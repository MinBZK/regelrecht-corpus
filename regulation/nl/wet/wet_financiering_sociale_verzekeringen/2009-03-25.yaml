  - number: '117.1'
    text: |-
      Ten laste van de Arbeidsongeschiktheidskas komen gedurende de periode van vijf jaar met betrekking tot een
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1], te rekenen
      vanaf de dag waarop een arbeidsongeschiktheidsuitkering op grond van [die wet][ref2] is ingegaan:


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002524
  - number: 117.1.a
    text: |-
      de door het UWV te betalen arbeidsongeschiktheidsuitkeringen, alsmede de op grond van enige
      wet over deze uitkeringen door het UWV verschuldigde premies of vergoedingen als bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref1] die niet op deze uitkeringen in mindering kunnen worden gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
  - number: 117.1.b
    text: |-
      het gezamenlijke bedrag van de arbeidsongeschiktheidsuitkeringen en de vakantie-uitkeringen die in
      de in de aanhef bedoelde periode niet zijn uitbetaald wegens het genieten van loon als bedoeld in
      [artikel 44, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] en dat op grond van
      [artikel 44, vierde lid, van die wet][ref2] wordt afgedragen aan ’s Rijks kas, vermeerderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel44
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '44'
  - number: 117.1.b.1°
    text: |-
      het bedrag aan premies dat het UWV bij uitbetaling op grond van enige wet over dat bedrag verschuldigd zou zijn en
      dat niet op de uitkeringen in mindering kan worden gebracht, en
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
  - number: 117.1.b.2°
    text: |-
      de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref1], van de inkomensafhankelijke bijdrage,
      bedoeld in [artikel 41 van die wet][ref2], over dat bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel41
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '41'
  - number: '117.2'
    text: |-
      Indien een arbeidsongeschiktheidsuitkering wordt toegekend met toepassing van
      [artikel 43a, eerste lid, onderdeel a, van de Wet op de arbeidsongeschiktheidsverzekering][ref1]
      vangt de in het eerste lid bedoelde periode van vijf jaar aan op de dag waarop de in
      [artikel 43a, eerste lid, onderdeel a, van die wet][ref2] bedoelde ingetrokken arbeidsongeschiktheidsuitkering
      is ingegaan. De eerste zin is tevens van toepassing op de arbeidsongeschiktheidsuitkering die niet is
      toegekend met toepassing van [artikel 43a, eerste lid, onderdeel a, van genoemde wet][ref3] maar met
      toepassing van [artikel 19 van die wet][ref4], omdat het [eerstgenoemde artikel][ref5] op grond van
      [artikel 43a, vierde lid, onderdeel b, van die wet][ref6] geen toepassing kon vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref6]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref6
        bwb_id: BWBR0002524
        artikel: 43a
  - number: '117.3'
    text: |-
      Indien een arbeidsongeschiktheidsuitkering wordt toegekend met toepassing van
      [artikel 43a, eerste lid, onderdeel b, van de Wet op de arbeidsongeschiktheidsverzekering][ref1]
      vangt de in het eerste lid bedoelde periode van vijf jaar aan na het verstrijken van de in
      [artikel 43, eerste lid, onderdeel b, van die wet][ref2] bedoelde wachttijd. De eerste zin
      is tevens van toepassing op de arbeidsongeschiktheidsuitkering die niet is toegekend met
      toepassing van [artikel 43a, eerste lid, onderdeel b, van genoemde wet][ref3] maar met toepassing
      van [artikel 19 van die wet][ref4], omdat het [eerstgenoemde artikel][ref5] op grond van
      [artikel 43a, vierde lid, onderdeel b, van die wet][ref6] geen toepassing kon vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref6]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '43'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref6
        bwb_id: BWBR0002524
        artikel: 43a
  - number: '117.4'
    text: |-
      Indien een arbeidsongeschiktheidsuitkering wordt toegekend direct aansluitend op een wachttijd die
      op grond van [artikel 19, zevende lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1]
      is verlengd, of een tijdvak waarin recht bestaat op loon of bezoldiging dat op grond van
      [artikel 24 van de Wet werk en inkomen naar arbeidsvermogen][ref2] is verlengd wordt de duur van de verlenging van
      de wachttijd respectievelijk de duur van de verlenging van bedoeld tijdvak in mindering gebracht op de periode van
      vijf jaar bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel24
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '24'
  - number: '117.5'
    text: |-
      Indien een arbeidsongeschiktheidsuitkering, respectievelijk een verhoging daarvan, niet wordt uitbetaald
      op grond van [artikel 43d van de Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt de periode
      van vijf jaar, bedoeld in het eerste lid, verlengd met het verlengde tijdvak waarin recht bestaat
      op ziekengeld op grond van [artikel 29, negende lid, van de Ziektewet][ref2], op loon op grond van
      [artikel 629 lid 11, onderdeel d, van Boek 7 van het Burgerlijk Wetboek][ref3], dan wel bezoldiging op grond van
      [artikel 76a, zesde lid, van de Ziektewet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43d
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43d
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: 76a
  - number: '117.6'
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
  - number: 117.6.a
    text: |-
      het een arbeidsongeschiktheidsuitkering betreft die op grond van
      [artikel 71, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] door het UWV wordt betaald en op
      grond van [artikel 71, derde lid, van die wet][ref2] niet op de eigenrisicodrager wordt verhaald;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel71
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '71'
  - number: 117.6.b
    text: |-
      het een arbeidsongeschiktheidsuitkering betreft die op grond van
      [artikel 75a, vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] door het UWV wordt betaald en
      niet kan worden verhaald op een kredietinstelling of verzekeraar als bedoeld in [artikel 40][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75a
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 117.6.c
    text: |-
      het een arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1]
      anders dan bedoeld in het tweede of derde lid betreft, toegekend aan een werknemer, die uit de
      dienstbetrekking waaruit de arbeidsongeschiktheidsuitkering is ontstaan, recht had op ziekengeld op grond van
      [artikel 29b van de Ziektewet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 29b
  - number: 117.6.d
    text: |-
      het een arbeidsongeschiktheidsuitkering anders dan bedoeld in het tweede of derde lid, betreft,
      toegekend aan een werknemer, wiens arbeidsongeschiktheidsuitkering wordt toegekend in aansluiting
      op een voordien op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] of de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2] toegekende uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0008656
      [ref2]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0008656
      - id: ref2
        bwb_id: BWBR0008657
  - number: 117.6.e
    text: |-
      het een uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1]
      betreft voorzover deze uitkering verhoogd is als gevolg van de inwerkingtreding van
      [artikel IV, onderdeel A, van de Wet verhoging uitkeringshoogte arbeidsongeschiktheidswetten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0023310#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0023310
        artikel: IV
  - number: '117.7'
    text: |-
      Het UWV bezigt de middelen die zijn gereserveerd ten behoeve van de Arbeidsongeschiktheidskas niet tot bestrijding
      van uitgaven ten laste van de Arbeidsongeschiktheidskas dan met toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
  - number: '117.8'
    text: |-
      Ten laste van de Arbeidsongeschiktheidskas komen voorts de bedragen van de kortingen oudere
      werknemer en arbeidsgehandicapte werknemer en de premievrijstelling bij marginale arbeid, bedoeld in
      [afdeling 6 van hoofdstuk 3][ref1], toegepast op de uniforme premie ten behoeve van de Arbeidsongeschiktheidskas,
      bedoeld in [artikel 37][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel37
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: '117.9'
    text: 'Ten laste van de Arbeidsongeschiktheidskas komen voorts:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
  - number: 117.9.a
    text: |-
      de kosten die verband houden met de uitvoering van
      [artikel 30a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] ten aanzien van een
      uitkeringsgerechtigde, indien deze ten tijde van het aanvangen van de werkzaamheden van het re-integratiebedrijf,
      bedoeld in het [achtste lid van dat artikel][ref2], recht heeft op een uitkering die ten laste komt van de
      Arbeidsongeschiktheidskas;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
  - number: 117.9.b
    text: |-
      de op grond van [artikel 2.8 van de Wet invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref1]
      aan het Reïntegratiefonds af te dragen bedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 117.9.c
    text: |-
      de loonkostensubsidie, bedoeld in [artikel 65i van de Wet op de arbeidsongeschiktheidsverzekering][ref1], indien
      de uitkeringsgerechtigde, met wie de werkgever aan wie de loonkostensubsidie wordt verstrekt een dienstbetrekking
      aangaat of is aangegaan, op de dag voorafgaand aan die dienstbetrekking recht heeft op een uitkering die ten laste
      komt van de Arbeidsongeschiktheidskas.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel65i
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 65i
  - number: '117.10'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere en zonodig afwijkende regels worden gesteld met betrekking tot
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117
  - number: 117a
    text: 'Ten gunste van de Werkhervattingskas komen:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117a
  - number: 117a.a
    text: |-
      de premie op grond van [artikel 38, eerste lid][ref1], de gedifferentieerde premie ten behoeve van de
      Werkhervattingskas op grond van [artikel 38a, eerste lid][ref2], en de premie op grond van [artikel 76a][ref3]
      voorzover deze de gedifferentieerde premie ten behoeve van de Werkhervattingskas op grond van
      [artikel 38, eerste lid][ref4], niet overschrijdt;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38a
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel76a
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel38
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 38a
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: 76a
        hoofdstuk: '6'
        paragraaf: '6'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0017745
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: 117a.b
    text: |-
      de gelden die het UWV ontvangt met toepassing van de [artikelen 76][ref1], [83, derde lid][ref2],
      [84, tweede en vierde lid][ref3], en [99 van de Wet werk en inkomen naar arbeidsvermogen][ref4] in verband met
      uitkeringen als bedoeld in [artikel 117b, eerste lid][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel83
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel84
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel99
      [ref5]: https://wetten.overheid.nl/BWBR0017745#Artikel117b
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '76'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '83'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '84'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '99'
      - id: ref5
        bwb_id: BWBR0017745
        artikel: 117b
        hoofdstuk: '7'
        paragraaf: '2'
        afdeling: '3'
  - number: 117a.c
    text: |-
      de gelden die door toepassing van [artikel 118][ref1] worden overgeheveld uit het Arbeidsongeschiktheidsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel118
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '118'
        hoofdstuk: '7'
        paragraaf: '2'
        afdeling: '3'
  - number: 117b.1
    text: |-
      Ten laste van de Werkhervattingskas komen de door het UWV te betalen WGA uitkeringen,
      alsmede de op grond van enige wet over deze uitkeringen door het UWV verschuldigde premies
      en de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref1], die niet op
      deze uitkeringen in mindering kunnen worden gebracht gedurende de periode die op grond van
      [artikel 82, eerste lid, onderdeel b, van de Wet werk en inkomen naar arbeidsvermogen][ref2], geldt op de dag
      waarop het recht op uitkering op grond van [die wet][ref3] is ontstaan, te rekenen vanaf die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '82'
      - id: ref3
        bwb_id: BWBR0019057
  - number: 117b.2
    text: |-
      Indien een WGA uitkering wordt toegekend direct aansluitend op een op grond van
      [artikel 24 van de Wet werk en inkomen naar arbeidsvermogen][ref1] verlengd tijdvak waarin de verzekerde recht
      heeft op loon, wordt de duur van de verlenging van dat tijdvak in mindering gebracht op de periode, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
  - number: 117b.3
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
  - number: 117b.3.a
    text: |-
      het een WGA uitkering betreft die op grond van
      [artikel 72, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] door het UWV wordt betaald en op
      grond van het derde lid van dat artikel niet op een eigenrisicodrager wordt verhaald;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel72
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '72'
  - number: 117b.3.b
    text: |-
      het een WGA uitkering betreft die op grond van
      [artikel 83, derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] door het UWV wordt betaald en niet
      kan worden verhaald op een kredietinstelling of verzekeraar als bedoeld in [artikel 40][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '83'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 117b.3.c
    text: |-
      het een WGA uitkering betreft, toegekend aan een werknemer, die uit de dienstbetrekking waaruit de WGA uitkering is
      ontstaan recht had op ziekengeld;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
  - number: 117b.3.d
    text: |-
      het een WGA uitkering betreft, toegekend aan een werknemer, wiens WGA uitkering wordt toegekend in
      aansluiting op een voordien op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] of de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2] toegekende uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0008656
      [ref2]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
    references:
      - id: ref1
        bwb_id: BWBR0008656
      - id: ref2
        bwb_id: BWBR0008657
  - number: 117b.3.e
    text: |-
      het een vervolguitkering als bedoeld in
      [artikel 62, derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] betreft, die door
      het UWV wordt betaald voorzover die uitkering meer bedraagt dan hetgeen berekend op grond van het
      [eerste en tweede lid van dat artikel][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel62
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '62'
  - number: 117b.3.f
    text: |-
      het een loonaanvullingsuitkering als bedoeld in
      [artikel 60, eerste lid, onderdeel a, van de Wet werk en inkomen naar arbeidsvermogen][ref1] betreft, die door
      het UWV wordt betaald voorzover die uitkering meer bedraagt dan een bedrag overeenkomende met het bedrag van
      de vervolguitkering, bedoeld in [artikel 60, eerste lid, onderdeel b, van die wet][ref2] waar de verzekerde,
      zonder toepassing van [artikel 62, derde lid][ref3], recht op zou hebben indien hij geen recht zou hebben gehad
      op de loonaanvullingsuitkering, bedoeld in [artikel 60, eerste lid, onderdeel a, van die wet][ref4], vermeerderd
      met de premies die op grond van enige wet daarover verschuldigd zouden zijn en de vergoeding, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref5], en die daarop niet in mindering kunnen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel60
      [ref5]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '60'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '60'
      - id: ref5
        bwb_id: BWBR0018450
        artikel: '46'
  - number: 117b.4
    text: |-
      Het UWV bezigt de middelen die zijn gereserveerd ten behoeve van de Werkhervattingskas niet tot bestrijding van
      uitgaven ten laste van de Werkhervattingskas dan met toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
  - number: 117b.5
    text: 'Ten laste van de Werkhervattingskas komen voorts:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
  - number: 117b.5.a
    text: |-
      de bedragen van de kortingen oudere werknemer en arbeidsgehandicapte werknemer en de premievrijstelling bij
      marginale arbeid, bedoeld in [afdeling 6 van hoofdstuk 3][ref1], toegepast op de gedifferentieerde premie ten
      behoeve van de Werkhervattingskas, bedoeld in [artikel 38][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: 117b.5.b
    text: |-
      de loonkostensubsidie, bedoeld in [artikel 37a van de Wet werk en inkomen naar arbeidsvermogen][ref1], indien de
      uitkeringsgerechtigde, met wie de werkgever aan wie de loonkostensubsidie wordt verstrekt een dienstbetrekking
      aangaat of is aangegaan, op de dag voorafgaand aan die dienstbetrekking recht heeft op een uitkering die ten laste
      komt van de Werkhervattingskas.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel37a
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: 37a
  - number: 117b.6
    text: |-
      De kosten die verband houden met de uitvoering van
      [artikel 30a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] ten aanzien van een
      uitkeringsgerechtigde, indien deze ten tijde van het aanvangen van de werkzaamheden van het re-integratiebedrijf,
      bedoeld in het [achtste lid van dat artikel][ref2], recht heeft op een uitkering die ten laste komt van de
      Werkhervattingskas.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
  - number: 117b.7
    text: |-
      Ten laste van de Werkhervattingskas komen voorts de uitvoeringskosten, voor zover deze betrekking hebben op de in
      het eerste lid bedoelde uitkeringen.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
  - number: 117b.8
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere en zonodig afwijkende regels worden gesteld met betrekking tot
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel117b
  - number: '118'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de overheveling van gelden uit het
      Arbeidsongeschiktheidsfonds naar de Arbeidsongeschiktheidskas of Werkhervattingskas.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel118
  - number: '119.1'
    text: |-
      Het College zorgverzekeringen, het UWV en de SVB beheren en administreren elk fonds, met uitzondering van het
      Uitvoeringsfonds voor de overheid en de sectorfondsen, afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel119
  - number: '119.2'
    text: |-
      Het UWV beheert het Uitvoeringsfonds voor de overheid en de sectorfondsen gezamenlijk en administreert het
      Uitvoeringsfonds voor de overheid en elk sectorfonds afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel119
  - number: '119.3'
    text: |-
      Indien met betrekking tot een fonds de lasten de baten blijken te overtreffen, wordt het tekort niet gedekt uit een
      ander fonds.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel119
  - number: '119.4'
    text: |-
      Het College zorgverzekeringen, het UWV en de SVB houden, elk afzonderlijk, de financiële middelen die deel uitmaken
      van hun fondsen aan in een of meer rekeningen-courant bij Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel119
  - number: '119.5'
    text: |-
      In afwijking van het vierde lid kunnen het College zorgverzekeringen, het UWV en de SVB een deel van de in het
      vierde lid bedoelde financiële middelen buiten de in het vierde lid bedoelde rekeningen-courant houden.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel119
  - number: '119.6'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport worden, in overeenstemming
      met Onze Minister van Financiën, na overleg met het College zorgverzekeringen, de SVB en het UWV, regels gesteld
      betreffende de omvang van het in het vijfde lid bedoelde deel van de financiële middelen.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel119
  - number: '119.7'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport kunnen, in overeenstemming
      met Onze Minister van Financiën, nadere regels worden gesteld omtrent het vierde lid.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel119
  - number: '120.1'
    text: |-
      Het College zorgverzekeringen, het UWV en de SVB kunnen, voor de uitvoering van hun wettelijke taken, beschikken
      over de financiële middelen die zij in rekening-courant bij Onze Minister van Financiën aanhouden.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel120
  - number: '120.2'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport worden, in overeenstemming
      met Onze Minister van Financiën en na overleg met het College zorgverzekeringen, het UWV en de SVB, regels gesteld
      omtrent de rente die over de saldi van de in [artikel 119, vierde lid][ref1], bedoelde rekeningen-courant wordt
      vergoed onderscheidenlijk in rekening wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel119
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '119'
        hoofdstuk: '7'
        afdeling: '4'
  - number: '120.3'
    text: |-
      Onze Minister van Financiën brengt voor het beheer van de in [artikel 119, vierde lid][ref1], bedoelde rekeningen-
      courant geen kosten in rekening.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel119
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '119'
        hoofdstuk: '7'
        afdeling: '4'
  - number: '120.4'
    text: |-
      Bij een tekort aan financiële middelen maken het College zorgverzekeringen, het UWV en de SVB uitsluitend gebruik
      van de kredietfaciliteiten die door Onze Minister van Financiën worden verleend of lenen het UWV en de SVB uit een
      door hen beheerd fonds.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel120
  - number: '120.5'
    text: |-
      Onze Minister van Financiën informeert dagelijks het College zorgverzekeringen, het UWV en de SVB ten aanzien van
      de in [artikel 119, vierde lid][ref1], bedoelde rekeningen-courant, in elk geval met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel119
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '119'
        hoofdstuk: '7'
        afdeling: '4'
  - number: 120.5.a
    text: de slotstanden per dag;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel120
  - number: 120.5.b
    text: alle dagelijks geboekte mutaties of transacties in de desbetreffende rekening-courant.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel120
  - number: '120.6'
    text: |-
      Het College zorgverzekeringen, het UWV en de SVB informeren Onze Minister van Financiën ten aanzien van de in
      [artikel 119, vierde lid][ref1], bedoelde rekeningen-courant, in elk geval met betrekking tot de prognoses van de
      saldi van de desbetreffende rekening-courant.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel119
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '119'
        hoofdstuk: '7'
        afdeling: '4'
  - number: '120.7'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport kunnen, in overeenstemming
      met Onze Minister van Financiën en na overleg met het College zorgverzekeringen, het UWV en de SVB, nadere regels
      worden gesteld omtrent het vierde, vijfde en zesde lid.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel120
  - number: '120.8'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport, in overeenstemming met Onze
      Minister van Financiën, kunnen regels worden gesteld met betrekking tot de door het College zorgverzekeringen, het
      UWV en de SVB beheerde fondsen betreffende:
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel120
  - number: 120.8.a
    text: |-
      de onderscheiding van het vermogen van het fonds in verschillende bestanddelen en de normen tot vaststelling van de
      omvang van deze bestanddelen;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel120
  - number: 120.8.b
    text: de vorming, omvang en instandhouding van reserves.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel120
  - number: '121.1'
    text: |-
      Jaarlijks vóór bij regeling van Onze Minister vast te stellen tijdstippen zenden het UWV en de SVB aan Onze
      Minister met betrekking tot elk fonds afzonderlijk:
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel121
  - number: 121.1.a
    text: |-
      een rapportage van de ontwikkelingen die zich tot op dat moment hebben voorgedaan met betrekking tot de financiële
      middelen en de gerealiseerde uitgaven;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel121
  - number: 121.1.b
    text: een begroting van de te verwachten uitgaven uit elk afzonderlijk fonds in het eerstvolgend kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel121
  - number: '121.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de aard en inrichting van de in het eerste lid
      bedoelde rapportage en de begroting van uitgaven.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel121
  - number: 121a
    text: |-
      Bij regeling van Onze Minister worden regels gesteld over de wijze waarop en de voorwaarden waaronder de aan het
      UWV en de SVB toegekende rijksbijdragen worden afgedragen en vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel121a
  - number: '122'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport kunnen, in overeenstemming
      met Onze Minister van Financiën, en na overleg met het College zorgverzekeringen, regels worden gesteld over
      de wijze waarop en de voorwaarden waaronder de afdracht van gelden plaatsvindt aan de fondsen die geheel of
      gedeeltelijk door het Rijk worden gefinancierd.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel122
  - number: 122a.1
    text: |-
      De werkgever past de korting, bedoeld in [artikel 49, eerste lid][ref1],
      overeenkomstig dat lid eveneens toe voor de persoon die voor de inwerkingtreding van
      __REF001___________________________________________________________________________________________________________
      __, arbeidsgehandicapte was op grond van [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref3],
      indien die werknemer op de dag van aanvang van de dienstbetrekking arbeidsgehandicapte was op grond van
      [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref4] dan wel dit zou zijn geweest indien het
      laatstgenoemde artikel niet zou zijn ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0009565#Artikel2
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
