  - number: '102.1'
    text: |-
      Het UWV vergoedt, ten laste van het Algemeen Werkloosheidsfonds, aan het Rijk bijdragen, die vanwege het Rijk
      worden verleend aan uit het buitenland afkomstige werknemers, die geen Nederlander zijn en die terugkeren naar
      hun land van herkomst of emigreren naar een ander land en tot het tijdstip van vertrek uitkering op grond van de
      [Werkloosheidswet][ref1] ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '102.2'
    text: |-
      De in het eerste lid bedoelde vergoedingen zijn ten hoogste gelijk aan de bedragen die de in het eerste lid
      bedoelde werknemers op grond van de [Werkloosheidswet][ref1] zouden hebben kunnen ontvangen indien zij werkloos
      waren gebleven en niet naar hun land van herkomst of een ander land waren vertrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '102.3'
    text: |-
      Bij ministeriële regeling, na overleg met Onze Minister wie het mede aangaat, worden regels gesteld met betrekking
      tot de aan het Rijk te vergoeden bijdragen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel102
  - number: '103'
    text: 'Ten gunste van een sectorfonds komen:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel103
  - number: 103.a
    text: |-
      de premies op grond van [artikel 28][ref1], met uitzondering van de premies die op grond van het derde lid van
      dat artikel ten gunste komen van het Algemeen Werkloosheidsfonds, en de premie op grond van [artikel 74][ref2],
      voorzover deze de premie op grond van [artikel 28, tweede lid][ref3], niet overschrijdt;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel28
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '74'
        hoofdstuk: '6'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
  - number: 103.b
    text: |-
      de bedragen, die het UWV ontvangt door toepassing van de [artikelen 27a][ref1] en
      [36 van de Werkloosheidswet][ref2], voorzover deze bedragen betrekking hebben op uitkeringen die ten laste van dit
      fonds zijn gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel36
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 27a
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '36'
  - number: 103.c
    text: |-
      de bedragen, die het UWV op grond van [artikel 100, onderdeel d][ref1], ten laste van het Algemeen
      Werkloosheidsfonds brengt;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel100
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '100'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: 103.d
    text: |-
      de bedragen, die het UWV ontvangt door toepassing van de [artikelen 38, vierde lid][ref1], [39a][ref2],
      [63a, derde tot en met vijfde lid][ref3], [63b, tweede lid][ref4], en [63c van de Ziektewet][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel39a
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel63b
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel63c
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 39a
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 63a
      - id: ref4
        bwb_id: BWBR0001888
        artikel: 63b
      - id: ref5
        bwb_id: BWBR0001888
        artikel: 63c
  - number: 103.e
    text: |-
      de bedragen, die het UWV ontvangt door toepassing van [artikel 45a van de Ziektewet][ref1], voorzover deze verband
      houden met op grond van [artikel 29, tweede lid, onderdeel a, b en c, van die wet][ref2] te betalen uitkeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 45a
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 103.f
    text: |-
      de bijdragen van de werkgever of de eigenrisicodrager of de werknemer in de kosten van het onderzoek, bedoeld in
      [artikel 32, eerste, tweede, derde en vierde lid van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1]
      ;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel32
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '32'
  - number: 103.g
    text: |-
      de bedragen, die het UWV ontvangt door toepassing van de [artikelen 76][ref1], [91][ref2] en
      [99 van de Wet werk en inkomen naar arbeidsvermogen][ref3], voorzover deze bedragen betrekking hebben op
      uitkeringen die ten laste van dit fonds zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel91
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel99
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '76'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '91'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '99'
  - number: '104.1'
    text: 'Ten laste van een sectorfonds komen:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
  - number: 104.1.a
    text: |-
      de op grond van de [Werkloosheidswet][ref1] over de eerste zes maanden vanaf de eerste werkloosheidsdag te
      betalen uitkering aan de werknemer, die in de kalenderweek onmiddellijk voorafgaande aan het intreden van zijn
      arbeidsurenverlies in de sector werkzaam is geweest waarvoor het sectorfonds is ingesteld, waarbij, voor de
      bepaling van de periode van zes maanden, perioden waarin de werknemer geen recht op uitkering heeft, buiten
      beschouwing worden gelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 104.1.b
    text: |-
      de op grond van [artikel 18 van de Werkloosheidswet][ref1] te betalen uitkeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
  - number: 104.1.c
    text: |-
      de op grond van [artikel 29, tweede lid, onderdeel a, b en c, van de Ziektewet][ref1] te betalen
      uitkeringen met uitzondering van de uitkeringen aan de personen, wier arbeidsverhouding op grond van
      [artikel 4, eerste lid, onderdeel i of j, van de Ziektewet][ref2] als dienstbetrekking wordt beschouwd;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel4
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '4'
  - number: 104.1.d
    text: |-
      de door het UWV te betalen WGA uitkering aan degenen die op de laatste dag van de
      wachttijd, bedoeld in [artikel 23 van de Wet werk en inkomen naar arbeidsvermogen][ref1],
      een uitkering ontvingen als bedoeld in onderdeel c, gedurende de periode die op grond van
      [artikel 82, eerste lid, onderdeel b, van de Wet werk en inkomen naar arbeidsvermogen][ref2], geldt op de dag
      waarop het recht op een uitkering op grond van [die wet][ref3] is ontstaan, te rekenen vanaf de laatstgenoemde dag;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '82'
      - id: ref3
        bwb_id: BWBR0019057
  - number: 104.1.e
    text: de uitvoeringskosten, voorzover deze betrekking hebben op de in de onderdelen a tot en met d bedoelde uitkeringen;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
  - number: 104.1.f
    text: |-
      de op grond van enige wet over de uitkeringen, bedoeld in de onderdelen a tot en met d, door het UWV verschuldigde
      premies of vergoedingen als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref1] die niet op deze uitkeringen
      in mindering kunnen worden gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
  - number: 104.1.g
    text: |-
      de kosten van de werkzaamheden, bedoeld in [artikel 63a, vierde en vijfde lid, van de Ziektewet][ref1] alsmede de
      schade, bedoeld in het [zesde lid van dat artikel][ref2], die wordt vergoed aan een eigenrisicodrager als bedoeld
      in [artikel 40, eerste lid, onderdeel a][ref3], en de daaraan verbonden uitvoeringskosten;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 63a
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 63a
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 104.1.h
    text: |-
      de kosten van onderzoek, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel32
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '32'
  - number: 104.1.i
    text: |-
      de bedragen van de premievrijstelling bij marginale arbeid, bedoeld in [afdeling 6 van hoofdstuk 3][ref1],
      toegepast op de sectorpremie;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        afdeling: '6'
  - number: 104.1.j
    text: |-
      de uitvoeringskosten, voorzover deze betrekking hebben op de uitvoering van de [artikelen 38, vierde lid][ref1],
      [39][ref2] en [39a van de Ziektewet][ref3] ten aanzien van anderen dan de personen, bedoeld
      in onderdeel c, en niet reeds op grond van onderdeel d ten laste van een sectorfonds worden
      gebracht, alsmede de uitvoeringskosten, voorzover deze betrekking hebben op de uitvoering van
      [artikel 629, derde lid, onderdeel c, van Boek 7 van het Burgerlijk Wetboek][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel39a
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '39'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 39a
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '629'
  - number: 104.1.k
    text: |-
      de kosten die in verband met de uitvoering van
      [artikel 30, eerste lid, onderdeel b, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], ten
      aanzien van personen, die een uitkering ontvangen als bedoeld in onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
  - number: '104.2'
    text: |-
      Het UWV is bevoegd in bijzondere gevallen voor de toepassing van het eerste lid, onderdeel a, werkzaamheden in de
      ene sector gelijk te stellen met werkzaamheden in een andere sector.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
  - number: '104.3'
    text: |-
      [Artikel 21 van de Werkloosheidswet][ref1] is met betrekking tot de in het eerste lid, onderdeel a, bedoelde
      periode waarover de uitkering ten laste van een sectorfonds komt, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel21
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '21'
  - number: '104.4'
    text: |-
      Het UWV brengt hetgeen ten laste van het sectorfonds komt, ten laste van het Algemeen Werkloosheidsfonds voor
      zoveel dit meer bedraagt dan het voor het sectorfonds op grond van [artikel 105, eerste of derde lid][ref1],
      vastgestelde maximum.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel105
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '105'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: '104.5'
    text: 'Ten laste van het sectorfonds komen voorts:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
  - number: 104.5.a
    text: |-
      de kosten die rechtstreeks verband houden met de uitvoering van
      [artikel 30a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] ten aanzien van een betrokkene,
      indien deze ten tijde van het aanvangen van de werkzaamheden van het re-integratiebedrijf, bedoeld in het
      [achtste lid van dat artikel][ref2], een uitkering als bedoeld in het eerste lid, onderdeel d, ontvangt; en


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
  - number: 104.5.b
    text: |-
      de loonkostensubsidie, bedoeld in [artikel 37a van de Wet werk en inkomen naar arbeidsvermogen][ref1], indien de
      uitkeringsgerechtigde, met wie de werkgever aan wie de loonkostensubsidie wordt verstrekt een dienstbetrekking
      aangaat of is aangegaan, op de dag voorafgaand aan die dienstbetrekking recht heeft op een uitkering als bedoeld in
      het eerste lid, onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel37a
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: 37a
  - number: '104.6'
    text: |-
      In afwijking van het eerste lid, onderdelen c, e en f, komen de uitkeringen, die worden betaald door
      een eigenrisicodrager als bedoeld in [artikel 40, eerste lid, onderdeel a][ref1], of een werkgever die
      een onderneming verkrijgt als bedoeld in [artikel 63b, derde lid, van de Ziektewet][ref2], en de door
      hem gemaakte kosten ter zake van de betaling van die uitkeringen en van de werkzaamheden, bedoeld in
      [artikel 63a, eerste lid, van die wet][ref3], alsmede de op grond van enige wet over die uitkeringen verschuldigde
      premies of vergoedingen als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref4] die niet op die uitkeringen in
      mindering kunnen worden gebracht, niet ten laste van een sectorfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel63b
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 63b
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 63a
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '104.7'
    text: |-
      In afwijking van het eerste lid, onderdeel a, komen de uitkeringen op grond van de [Werkloosheidswet][ref1] die
      worden betaald gedurende de eerste dertien weken van ongeschiktheid van de werknemer tot het verrichten van zijn
      arbeid wegens ziekte, niet ten laste van een sectorfonds. [Artikel 20, zevende lid, van de Werkloosheidswet][ref2]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel20
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '20'
  - number: '104.8'
    text: |-
      Voor de bepaling van de periode van zes maanden, bedoeld in het eerste lid, onderdeel a, worden perioden waarin de
      werknemer uitkering ontvangt als bedoeld in het zevende lid, buiten aanmerking gelaten.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel104
  - number: '105.1'
    text: |-
      Het UWV stelt elk jaar voor elk sectorfonds afzonderlijk een maximum vast dat in een kalenderjaar op grond van
      [artikel 104][ref1] ten laste van dat sectorfonds komt.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '104'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: '105.2'
    text: 'Bij de vaststelling van het maximum, bedoeld in het eerste lid, blijven buiten beschouwing:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel105
  - number: 105.2.a
    text: |-
      de bedragen die ten laste van een sectorfonds komen op grond van [artikel 104, eerste lid, c, d en i][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '104'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: 105.2.b
    text: |-
      de lasten die op grond van [artikel 104, vierde lid][ref1], bij het UWV ten laste van het Algemeen
      Werkloosheidsfonds in rekening worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '104'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: '105.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt elk jaar voor het sectorfonds voor de sector waartoe de
      werkgevers behoren die zich in het kader van de uitoefening van hun bedrijf of beroep bezighouden met het ter
      beschikking stellen van arbeidskrachten aan een derde om krachtens een door deze aan de werkgever verstrekte
      opdracht arbeid te verrichten onder leiding en toezicht van de derde, waarbij die arbeidskrachten werkzaam zijn
      op basis van een uitzendovereenkomst als bedoeld in [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref1],
      waarin tevens een beding als bedoeld in [artikel 691, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref2]
      is opgenomen, een maximum vast dat in een kalenderjaar ten laste van het sectorfonds komt, voorzover het
      betrekking heeft op de uitkeringen, bedoeld in [artikel 104, eerste lid, onderdeel c][ref3], respectievelijk
      [artikel 104, eerste lid, onderdeel d][ref4]. Dat maximum bedraagt per kalenderjaar 75 procent van het
      bedrag in dat kalenderjaar van die uitkeringen, de uitvoeringskosten met betrekking tot die uitkeringen
      en de op grond van enige wet over die uitkeringen verschuldigde premies of vergoedingen als bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref5] die niet op die uitkeringen in mindering kunnen worden gebracht.


