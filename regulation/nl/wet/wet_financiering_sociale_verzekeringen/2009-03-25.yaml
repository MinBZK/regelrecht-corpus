  - number: 122d
    text: |-
      De premie die op grond van [artikel 27][ref1] is vastgesteld wordt met ingang van het jaar 2015 in verband met de
      ontwikkeling van de lasten voor werkgevers voortvloeiend uit de toepassing van [artikel 47][ref2], [122b][ref3]
      en [122c][ref4] verlaagd met 0,35% in 2015, 0,45% in 2016, 0,55% in 2017, 0,60% in 2018, 0,70% in 2019 en 0,75%
      in 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel47
