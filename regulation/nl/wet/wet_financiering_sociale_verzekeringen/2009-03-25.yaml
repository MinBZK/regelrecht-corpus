  - number: 100.d
    text: |-
      de op grond van enige wet over de uitkeringen, bedoeld in onderdeel a en b, door het UWV verschuldigde premies of
      vergoedingen als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref1] die niet op deze uitkeringen in mindering
