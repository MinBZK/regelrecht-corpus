      [artikel 74][ref4], voorzover deze niet ten gunste komt van een sectorfonds;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel76
