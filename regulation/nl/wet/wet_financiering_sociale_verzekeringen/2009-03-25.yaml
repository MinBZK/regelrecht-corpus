      marginale arbeid, bedoeld in [afdeling 6 van hoofdstuk 3][ref1], voorzover die worden toegepast op de premies
      berekend op grond van [artikel 27][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel27
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel100
