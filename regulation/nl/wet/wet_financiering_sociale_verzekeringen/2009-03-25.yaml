  - number: '115.2'
    text: |-
      Het UWV bezigt de middelen die zijn gereserveerd ten behoeve van het Arbeidsongeschiktheidsfonds niet tot
      bestrijding van uitgaven ten laste van het Arbeidsongeschiktheidsfonds dan met toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel115
  - number: '116'
