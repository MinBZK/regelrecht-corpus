  - number: 122f
    text: |-
      [Artikel 104, derde lid][ref1], zoals dat luidde op de dag voor inwerkingtreding van artikel VIII, onderdeel C,
      onder 1, van de Wet wijziging WW-stelsel blijft van toepassing met betrekking tot een recht op uitkering waarvan de
      eerste werkloosheidsdag is gelegen op of voor die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel122f
