  - number: 47.1.a
    text: |-
      die onmiddellijk voorafgaand aan de aanvang van de dienstbetrekking recht heeft op een uitkering
      op grond van de [Werkloosheidswet][ref1], de [Wet op de arbeidsongeschiktheidsverzekering][ref2],
      de [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet werk en inkomen kunstenaars][ref4],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref7], de [Wet werk en bijstand][ref8], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref9], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref10]
      en de [Algemene pensioenwet politieke ambtsdragers][ref11], of op wachtgeld als bedoeld in
      [artikel 6, vierde lid, van de Werkloosheidswet][ref12]; en


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002524
