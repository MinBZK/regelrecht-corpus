  - number: 47.1.b
    text: die op het moment van in dienst treden bij die werkgever 50 jaar of ouder is.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel47
  - number: '47.3'
    text: |-
      Ten aanzien van een werknemer die 62 jaar of ouder is, op wie in een tijdvak waarover premie wordt betaald het
      eerste of tweede lid niet van toepassing is, past de werkgever, voor zolang de dienstbetrekking duurt, een korting
      toe op het totaal van de verschuldigde premies, bedoeld in het eerste lid, met ingang van de eerste dag van het
      tijdvak waarover premie wordt betaald waarin de werknemer de leeftijd van 62 jaar bereikt.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel47
  - number: '47.4'
    text: |-
      De werkgever bewaart bij de loonadministratie een verklaring van het Uitvoeringsinstituut werknemersverzekeringen,
      de Sociale verzekeringsbank, het college van burgemeester en wethouders of een andere uitkeringsinstantie, dat de
      werknemer, bedoeld in het eerste of tweede lid, voorafgaande aan de datum van aanvang van dienstbetrekking recht
      had op een uitkering als bedoeld in het eerste lid, onderdeel a, of voldoet aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel47
  - number: '48.1'
    text: |-
      De korting, bedoeld in [artikel 47, eerste en derde lid][ref1], bedraagt € 6 500 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
  - number: '48.2'
    text: |-
      Het bedrag van de korting wordt naar evenredigheid verminderd, indien de met die werknemer overeengekomen
      gemiddelde arbeidsduur per week in het tijdvak waarover premie wordt betaald korter is dan de volledige arbeidsduur
      en indien geen vaste arbeidsduur is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel48
  - number: '48.3'
    text: De volledige arbeidsduur wordt gesteld op 36 uur per week.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel48
  - number: '48.4'
    text: |-
      Voor een werknemer zonder vast overeengekomen arbeidsduur wordt de vermindering bepaald aan de hand van het aantal
      uren waarover de werkgever loon is verschuldigd in het tijdvak waarover premie wordt betaald herleid naar weken.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel48
  - number: '49.1'
    text: |-
      De werkgever past een korting toe op het totaal van de door hem en zijn werknemers op grond van de
      [artikelen 27][ref1] en [31][ref2] verschuldigde premies en de door hem op grond van [afdeling 4][ref3]
      verschuldigde premies bij een dienstbetrekking met een werknemer, die onmiddellijk voorafgaand aan de aanvang van
      de dienstbetrekking:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        afdeling: '4'
  - number: 49.1.a
    text: |-
      recht heeft op een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 49.1.b
    text: |-
      recht heeft op een uitkering op grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: 49.1.c
    text: |-
      een indicatiebeschikking als bedoeld in [artikel 11 van de Wet sociale werkvoorziening][ref1] heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel11
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '11'
  - number: 49.1.d
    text: |-
      naar het oordeel van het UWV een structurele functionele beperking heeft en voor wiens ondersteuning
      bij arbeidsinschakeling het college van burgemeester en wethouders, op die dag, op grond van
      [artikel 7, eerste lid, aanhef en onderdeel a, van de Wet werk en bijstand][ref1], verantwoordelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
  - number: 49.1.e
    text: |-
      de leeftijd van achttien jaar nog niet heeft bereikt en in verband met ziekte of gebrek een belemmering ondervindt
      of heeft ondervonden bij het volgen van onderwijs en binnen vijf jaar na afronding van dat onderwijs arbeid in
      dienstbetrekking gaat verrichten; of
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
  - number: 49.1.f
    text: |-
      geen werknemer is als bedoeld in onderdeel b, achttien jaar is of ouder en in verband met ziekte of gebrek een
      belemmering ondervindt of heeft ondervonden bij het volgen van onderwijs en binnen vijf jaar na afronding van dat
      onderwijs arbeid in dienstbetrekking gaat verrichten.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
  - number: '49.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot de werknemer, bedoeld in het eerste lid,
      onderdeel a, die zijn eigen arbeid geheel of gedeeltelijk heeft hervat of een andere functie bij dezelfde werkgever
      is gaan bekleden voor zolang de dienstbetrekking duurt doch ten hoogste gedurende een jaar nadat die werknemer zijn
      eigen arbeid geheel of gedeeltelijk heeft hervat of een andere functie bij dezelfde werkgever is gaan bekleden.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
  - number: '49.3'
    text: |-
      Ter uitvoering van het eerste lid, onderdeel d, wordt op verzoek van het college van burgemeester en wethouders,
      bedoeld in dat lid, de aanwezigheid van een structurele functionele beperking vastgesteld. Bij ministeriële
      regeling kunnen nadere regels worden gesteld voor het eerste lid, onderdeel d, en dit lid in ieder geval met
      betrekking tot de gegevens, die bij de aanvraag worden verstrekt en de kosten die voor de beoordeling van de
      aanvraag bij de aanvrager in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
  - number: '49.4'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot de werknemer van wie in een arbeidskundig
      onderzoek is vastgesteld dat hij op de eerste dag na afloop van de wachttijd, bedoeld in artikel 3.1
      van de Wet werk en inkomen naar arbeidsvermogen of van het tijdvak, bedoeld in [artikel 24][ref1] of
      [25, negende lid, van die wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 49.4.1°
    text: minder dan 35% arbeidsongeschikt is,
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
  - number: 49.4.2°
    text: |-
      op de eerste dag van dertien weken voorafgaand aan die dag geen dienstbetrekking had met een andere dan zijn eigen
      werkgever, tenzij de dienstbetrekking met die andere werkgever reeds bestond op de eerste dag van de wachttijd,
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
  - number: 49.4.3°
    text: niet in staat is tot het verrichten van eigen of andere passende arbeid bij de eigen werkgever, en
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
  - number: 49.4.4°
    text: binnen vijf jaar na die dag in dienstbetrekking werkzaamheden gaat verrichten bij een werkgever.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
  - number: '49.5'
    text: |-
      Bij ministeriële regeling kunnen voorwaarden worden gesteld met betrekking tot de toepassing van het eerste lid,
      aanhef en onderdeel d.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
  - number: '49.6'
    text: |-
      Het UWV verstrekt op verzoek van de werknemer of de persoon die verwacht een dienstbetrekking met een werkgever
      te zullen aangaan een verklaring of de aanvrager naar het oordeel van het UWV voldoet aan de voorwaarden voor
      toepassing van het eerste lid, onderdeel e of f.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel49
  - number: '50.1'
    text: |-
      De korting, bedoeld in [artikel 49][ref1], bedraagt € 2 042 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel49
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
  - number: '50.2'
    text: |-
      De korting, bedoeld in [artikel 49][ref1], bedraagt € 454 per jaar indien het loon van de werknemer over het
      kalenderjaar minder dan 50% van het naar een jaarbedrag herleide minimumloon bedraagt zoals dat voor de werknemer
      gold op 1 januari van het desbetreffende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel49
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
  - number: '50.3'
    text: |-
      Onverminderd het eerste en tweede lid bedraagt de korting, bedoeld in [artikel 49][ref1],
      € 1 360 per jaar voor de werknemer die tevens jonggehandicapte is als bedoeld in
      [artikel 5 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2], de werknemer, bedoeld in
      [artikel 49, eerste lid, onderdelen e en f][ref3], en voor de werknemer, bedoeld in [artikel 49, eerste lid][ref4],
      die voor zijn zeventiende verjaardag tot de doelgroep van [artikel 49, eerste lid, onderdeel a, c of d][ref5] kon
      worden gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel49
      [ref5]: https://wetten.overheid.nl/BWBR0017745#Artikel49
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel50
    references:
      - id: ref1
