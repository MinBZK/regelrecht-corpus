        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
  - number: 122a.3.b
    text: |-
      de zinsnede «nadat die werknemer zijn eigen arbeid of een andere functie bij dezelfde werkgever geheel of
      gedeeltelijk heeft hervat» in het tweede lid en in [artikel 49, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel49
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
  - number: 122a.4
    text: |-
      Dit artikel is niet van toepassing indien de werknemer werkzaam is in een dienstbetrekking in de zin van
      [artikel 2 van de Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
  - number: 122ab
    text: |-
      Met betrekking tot personen die op of na 1 januari 2004 maar voor 15 augustus 2004 ziek zijn geworden wordt in
      [artikel 49, vijfde lid, aanhef][ref1], voor «bedoeld in [artikel 24][ref2] of [25, negende lid, van die wet][ref3]»
      gelezen: bedoeld in [artikel 24 van die wet][ref4] of het tijdvak dat voortvloeit uit de toepassing van
      [artikel 123b, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel25
