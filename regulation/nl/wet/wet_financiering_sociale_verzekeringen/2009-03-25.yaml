      - id: ref6
        bwb_id: BWBR0004045
        artikel: '12'
      - id: ref7
        bwb_id: BWBR0001888
  - number: '39'
    text: |-
      Onze Minister kan bedragen vaststellen die jaarlijks of in het desbetreffende jaar als rijksbijdrage als bedoeld in
      [artikel 114, onderdeel f][ref1], ten gunste komen van het Arbeidsongeschiktheidsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel114
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '114'
        hoofdstuk: '7'
        paragraaf: '2'
        afdeling: '3'
  - number: '40.1'
    text: |-
      De inspecteur verleent overeenkomstig deze afdeling aan een werkgever op aanvraag bij voor bezwaar vatbare
      beschikking toestemming om zelf het risico te dragen van betaling van:
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
  - number: 40.1.a
    text: |-
      het ziekengeld aan de personen, bedoeld in [artikel 29, tweede lid, onderdelen a, b en c, van de Ziektewet][ref1],
      die laatstelijk tot de werkgever in dienstbetrekking stonden; of


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 40.1.b
    text: |-
      WGA uitkering overeenkomstig [hoofdstuk 9 van de Wet werk en inkomen naar arbeidsvermogen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '9'
  - number: '40.2'
    text: |-
      De werkgever legt bij een aanvraag als bedoeld in het eerste lid een schriftelijke garantie over waaruit blijkt dat
      een kredietinstelling of een verzekeraar zich jegens het UWV verplicht, op het eerste verzoek van het UWV waarbij
      het UWV schriftelijk meedeelt dat de verplichtingen die voortvloeien uit het zelf dragen van het risico niet worden
      nagekomen, die verplichtingen na te komen.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
  - number: '40.3'
    text: |-
      De overheidswerkgever, bedoeld in
      [artikel 1, onderdeel k, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1], voorzover deze door
      Onze Minister in overeenstemming met Onze Minister van Financiën is aangewezen, is ontheven van de verplichting tot
      het overleggen van een schriftelijke garantie als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009267#Artikel1
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0009267
        artikel: '1'
  - number: '40.4'
    text: |-
      De in het eerste lid bedoelde toestemming wordt niet verleend gedurende drie jaren nadat het door de werkgever zelf
      dragen van het desbetreffende in het eerste lid bedoelde risico is beëindigd.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
  - number: '40.5'
    text: |-
      Onder een kredietinstelling als bedoeld in het tweede lid wordt verstaan een financiële onderneming die ingevolge
      de [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van bank mag uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '40.6'
    text: |-
      Onder een verzekeraar als bedoeld in het tweede lid wordt verstaan een financiële onderneming die ingevolge de
      [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van levensverzekeraar of schadeverzekeraar mag
      uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '40.7'
    text: |-
      De garantie, bedoeld in het tweede lid, wordt voor onbepaalde tijd gegeven. Deze garantie strekt zich uit
      tot rechtsopvolgers onder algemene titel van de eigenrisicodrager en tot het risico dat overgaat op de
      verkrijgende werkgever, bedoeld in [artikel 63b, derde lid, van de Ziektewet][ref1], onderscheidenlijk
      [artikel 75b, vierde en zesde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2] respectievelijk
      [artikel 84, derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref3]. Deze garantie kan door de
      desbetreffende kredietinstelling of verzekeraar niet worden beëindigd zonder schriftelijke opzegging bij de
      inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63b
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel75b
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel84
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 63b
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 75b
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '84'
  - number: '40.8'
    text: 'De garantie, bedoeld in het tweede lid, strekt zich niet uit tot:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
  - number: 40.8.a
    text: |-
      ziekengeld onderscheidenlijk arbeidsongeschiktheidsuitkering dan wel WGA-uitkering ter
      zake van ongeschiktheid tot werken die is ontstaan door een omstandigheid als bedoeld in
      [artikel 3:38 van de Wet op het financieel toezicht][ref1], door een omstandigheid die het gevolg is van een of
      meer terroristische handelingen voor zover de totale schade die in een kalenderjaar ten gevolge van dergelijke
      handelingen bij schade- of levensverzekeraars waarop de [Wet op het financieel toezicht][ref2] van toepassing is,
      zal worden gedeclareerd, naar verwachting van de Nederlandse Herverzekeringsmaatschappij voor Terrorismeschaden
      N.V. hoger zal zijn dan het door die maatschappij herverzekerde maximumbedrag per kalenderjaar, of door een
      kernongeval als bedoeld in [artikel 1, eerste lid, van de Wet aansprakelijkheid kernongevallen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368
      [ref3]: https://wetten.overheid.nl/BWBR0003234#Artikel1
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
      - id: ref3
        bwb_id: BWBR0003234
        artikel: '1'
  - number: 40.8.b
    text: |-
      de boete, bedoeld in [artikel 63c van de Ziektewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63c
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 63c
  - number: '40.9'
    text: |-
      De toestemming, bedoeld in het eerste lid, wordt door de inspecteur verleend met ingang van 1 januari of 1 juli van
      enig jaar, mits de aanvraag ten minste dertien weken voor de desbetreffende datum is ingediend. Aan een startende
      werkgever wordt op zijn verzoek toestemming verleend met ingang van het tijdstip waarop deze aanvangt werkgever
      te zijn.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
  - number: '40.10'
    text: |-
      Het door de werkgever zelf dragen van het risico, bedoeld in het eerste lid, en
      het risico van de betaling van de arbeidsongeschiktheidsuitkering overeenkomstig
      [hoofdstuk IIIA van de Wet op de arbeidsongeschiktheidsverzekering][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukIIIA
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: IIIA
  - number: 40.10.a
    text: |-
      eindigt met ingang van de dag waarop de schriftelijke garantie, bedoeld in het tweede lid, eindigt,
      onderscheidenlijk met ingang van de dag waarop de eigenrisicodrager in staat van faillissement is verklaard of ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard dan wel de dag waarop
      hij ophoudt werkgever te zijn;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
  - number: 40.10.b
    text: |-
      wordt door de inspecteur op 1 januari of 1 juli van enig jaar beëindigd bij voor bezwaar vatbare beschikking op
      aanvraag van de werkgever, mits deze aanvraag ten minste dertien weken voor de desbetreffende datum is ingediend;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
  - number: 40.10.c
    text: |-
      kan door de inspecteur zonder aanvraag van de werkgever met onmiddellijke ingang bij voor
      bezwaar vatbare beschikking worden beëindigd indien de rechtbank de noodregeling, bedoeld in
      [hoofdstuk 3.5 van de Wet op het financieel toezicht][ref1] heeft uitgesproken over de betrokken verzekeraar
      onderscheidenlijk kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Hoofdstuk3.5
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020368
        hoofdstuk: '3.5'
  - number: '40.11'
    text: |-
      Aan een gemeente kan door de inspecteur bij voor bezwaar vatbare beschikking toestemming worden verleend om het
      risico, bedoeld in het eerste lid, zelf te dragen met uitzondering van dat risico ten aanzien van haar werknemers
      die werkzaam zijn bij:
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
  - number: 40.11.a
    text: |-
      een door een of meer gemeenten, al dan niet tezamen met een of meer privaatrechtelijke rechtspersonen met volledige
      rechtsbevoegdheid, in stand gehouden school;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
  - number: 40.11.b
    text: |-
      een door een openbare rechtspersoon als bedoeld in [artikel 47 van de Wet op het primair onderwijs][ref1] in stand
      gehouden school;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel47
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '47'
  - number: 40.11.c
    text: |-
      een door een stichting als bedoeld in [artikel 17][ref1] of [artikel 48 van de Wet op het primair onderwijs][ref2]
      in stand gehouden school;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel48
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '48'
  - number: 40.11.d
    text: |-
      een door het bevoegd gezag van een openbare school, al dan niet met één of meer andere bevoegde gezagsorganen
      als bedoeld in de [Wet op het primair onderwijs][ref1], de [Wet op de expertisecentra][ref2] of de
      [Wet op het voortgezet onderwijs][ref3], in stand gehouden centrale dienst zoals die beschreven wordt in
      [artikel 68 van de Wet op het primair onderwijs][ref4], voorzover de kosten voor de betrokken werknemers door het
      Rijk worden bekostigd; of


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel68
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
      - id: ref4
        bwb_id: BWBR0003420
        artikel: '68'
  - number: 40.11.e
    text: |-
      openbare scholen als bedoeld in [artikel 1, onderdelen a tot en met c][ref1], en
      [artikel 124, onderdelen a tot en met c, van de Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel124
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '124'
  - number: '40.12'
    text: |-
      In een geval als bedoeld in het tiende lid, onderdeel a, doet de inspecteur daarvan op verzoek van de werkgever
      mededeling bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
  - number: '40.13'
    text: |-
      Indien de periode, bedoeld in
      [artikel 82, eerste lid, onderdeel b, van de Wet werk en inkomen naar arbeidsvermogen][ref1] wordt gewijzigd in
      die zin dat de wijziging een verlenging van de periode betekent, legt de werkgever die zelf het risico draagt van
      betaling de WGA uitkering, binnen een bij ministeriële regeling te bepalen termijn, een schriftelijke garantie over
      aan de inspecteur waaruit blijkt dat een kredietinstelling of een verzekeraar zich jegens het UWV verplicht, op het
      eerste verzoek van het UWV, waarbij het UWV schriftelijk meedeelt dat de verplichtingen die voortvloeien uit het
      zelf dragen van het risico niet worden nagekomen, die verplichtingen na te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
  - number: '40.14'
    text: |-
      Indien niet of niet tijdig wordt voldaan aan het dertiende lid, eindigt het door de werkgever zelf dragen van het
      risico, bedoeld in het eerste lid, onderdeel c, met ingang van de dag waarop de wijziging van de periode, bedoeld
      in [artikel 82, eerste lid, onderdeel b, van de Wet werk en inkomen naar arbeidsvermogen][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
  - number: '40.15'
    text: Bij ministeriële regeling kunnen met betrekking tot het dertiende en veertiende lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
  - number: '40.16'
    text: |-
      Beschikkingen van de inspecteur op grond van deze afdeling worden genomen gehoord het UWV en in overeenstemming met
      het UWV.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel40
  - number: '41.1'
    text: |-
      De eigenrisicodrager met betrekking tot de WGA-uitkering bedoeld in [artikel 40, eerste lid, onderdeel b][ref1], en
      de startende werkgever, bedoeld in [artikel 40, negende lid][ref2], die in afwachting is van de door de inspecteur
      te nemen beslissing op aanvraag, bedoeld in [artikel 40, eerste lid, onderdeel b][ref3], kunnen de bij ministeriële
      regeling genoemde kosten met betrekking tot een werknemer ten behoeve van eigenrisicodragen onder bij ministeriële
      regeling te bepalen voorwaarden, tot ten hoogste de helft verhalen op de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: '41.2'
    text: |-
      De eigenrisicodrager die ter dekking van het risico, bedoeld in [artikel 40, eerste lid][ref1], een verzekering
      heeft afgesloten mag de door hem ter zake van die verzekering verschuldigde premie niet verhalen op de werknemer
      voorzover dit niet voortvloeit uit het eerste lid. Elk beding waarbij wordt afgeweken van de eerste zin is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: '42'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere en zonodig afwijkende regels worden gesteld met betrekking tot
      deze afdeling.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel42
  - number: '43.1'
    text: |-
      De garantie, bedoeld in [artikel 40, tweede lid][ref1], met betrekking tot een aanvraag als bedoeld in het
      [eerste lid, onderdeel a, van dat artikel,][ref2] reikt tot het bedrag dat overeenkomstig [artikel 44][ref3] wordt
      berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel44
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '44'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: '43.2'
    text: |-
      De werkgever aan wie toestemming wordt verleend als bedoeld in
      [artikel 40, eerste lid, onderdeel a][ref1], neemt ter zake van de begeleiding van zijn zieke werknemers
      [artikel 14, eerste lid, onderdeel b, van de Arbeidsomstandighedenwet][ref2] in acht en legt bij zijn aanvraag een
      afschrift over van de schriftelijke vastlegging, bedoeld in [artikel 14, vierde lid, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '14'
  - number: '43.3'
    text: |-
      De toestemming, bedoeld in [artikel 40, eerste lid, onderdeel a][ref1], kan, onverminderd het
      [tiende lid van dat artikel][ref2], door de inspecteur zonder aanvraag van de werkgever met onmiddellijke
      ingang bij voor bezwaar vatbare beschikking worden beëindigd indien de werkgever zich met betrekking
      tot de begeleiding van zijn zieke werknemers niet meer laat bijstaan door een persoon als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref3] die belast is met de bijstand, bedoeld in onderdeel
      b van dat lid of een arbodienst als bedoeld in [die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0010346
  - number: '44.1'
    text: |-
      Het bedrag, bedoeld in [artikel 43, eerste lid,][ref1] is gelijk aan de helft van het voor de werkgever voor
      het kalenderjaar berekende ziekterisicocijfer, vermenigvuldigd met de som van het loon, waarover op grond van
      [hoofdstuk 3, afdeling 2][ref2], over het aan dat kalenderjaar voorafgaande kalenderjaar door de werkgever premie
      is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        afdeling: '2'
  - number: '44.2'
    text: |-
      Indien de in het eerste lid bedoelde som van het loon niet kan worden vastgesteld wordt daarvoor in de
      plaats gesteld de som van het loon waarover op grond van [hoofdstuk 3, afdeling 2][ref1], laatstelijk door
      de werkgever premie is verschuldigd of, bij het ontbreken daarvan, de som van het loon waarover op grond van
      [hoofdstuk 3, afdeling 2][ref2], premie zal zijn verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        afdeling: '2'
  - number: '44.3'
    text: |-
      Het bedrag, bedoeld in [artikel 43, eerste lid][ref1], is niet lager dan de helft van het voor het kalenderjaar
      berekende gemiddelde premieplichtige loon per werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel43
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: '44.4'
    text: |-
      Het ziekterisicocijfer wordt berekend op basis van de formule: A = (U) / (L) waarbij:
      A = het ziekterisicocijfer; U = de uitkeringen in het kalenderjaar die op grond van
      [artikel 104, eerste lid, onderdeel c, juncto het vierde en vijfde lid][ref1], ten laste komen van het sectorfonds
      van de sector waartoe de werkgever behoort, bedoeld in [artikel 94][ref2], alsmede de uitvoeringskosten met
      betrekking tot die uitkeringen en de op grond van enige wet over die uitkeringen door het UWV verschuldigde premies
      die niet op die uitkeringen in mindering kunnen worden gebracht; L = het totaalbedrag van het loon, bedoeld in
      [artikel 26][ref3], waarover in het kalenderjaar, ten gunste van het sectorfonds van de sector waartoe de werkgever
      behoort, de aldaar bedoelde premies zijn verschuldigd, met uitzondering van de uitkeringen en het loon waarop
      [artikel 28, tweede lid][ref4], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel28
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '104'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '94'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0017745
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
  - number: '44.5'
    text: |-
      Indien een sectorfonds bestaat uit onderdelen die niet afzonderlijk worden beheerd, terwijl het deel van de premie
      dat ten gunste komt van het sectorfonds voor elk van die onderdelen afzonderlijk wordt vastgesteld, wordt voor de
      toepassing van het vierde lid onder het sectorfonds verstaan het onderdeel van het sectorfonds.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel44
  - number: '44.6'
    text: |-
      Bij de vaststelling van de som van het loon, bedoeld in het eerste en tweede lid, blijft
      [artikel 17, tweede lid][ref1], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '45'
    text: |-
      Aan een gemeente wordt geen toestemming verleend als bedoeld in
      [artikel 40, aanhef en eerste lid, onderdeel b][ref1], ten aanzien van werknemers die werkzaam zijn in een
      dienstbetrekking op grond van de [Wet sociale werkvoorziening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0008903
  - number: '46'
    text: |-
      De werkgever die zelf het risico draagt van de betaling van de arbeidsongeschiktheidsuitkering overeenkomstig
      [hoofdstuk IIIA van de Wet op de arbeidsongeschiktheidsverzekering][ref1] is over het loon van de tot hem in
      dienstbetrekking staande werknemers en over de door hem te betalen arbeidsongeschiktheidsuitkeringen de uniforme
      premie, bedoeld in [artikel 37][ref2], niet verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukIIIA
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel37
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: 46a.1
    text: |-
      De eigenrisicodrager met betrekking tot de WGA uitkering, bedoeld in [artikel 40, eerste lid, onderdeel b][ref1],
      is over het loon van de tot hem in dienstbetrekking staande werknemers de gedifferentieerde premie, bedoeld in
      [artikel 38][ref2], en over de door hem te betalen WGA uitkeringen de premie ten behoeve van de Werkhervattingskas,
      bedoeld in [artikel 38a][ref3], niet verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel38a
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: 38a
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: 46a.2
    text: |-
      De startende werkgever, bedoeld in [artikel 40, negende lid][ref1], is in afwachting van de door de inspecteur
      te nemen beslissing op aanvraag, bedoeld in [artikel 40, eerste lid, onderdeel b][ref2], over het loon van de
      tot hem in dienstbetrekking staande werknemers de gedifferentieerde premie, bedoeld in [artikel 38][ref3], niet
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel38
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: '47.1'
    text: |-
      De werkgever past een korting toe op het totaal van de door hem en zijn werknemers op grond van de
      [artikelen 27][ref1] en [31][ref2] verschuldigde premies en de door hem op grond van [afdeling 4][ref3]
      verschuldigde premies bij een dienstbetrekking met een werknemer:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '1'
