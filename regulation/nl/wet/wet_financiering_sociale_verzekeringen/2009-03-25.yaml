  - number: '105.4'
    text: |-
      Indien een of meer werkgevers eigenrisicodrager zijn als bedoeld in
      [artikel 40, eerste lid, onderdeel a of c][ref1], kan Onze Minister het deel van de premie dat ten gunste komt
      van het desbetreffende sectorfonds maximeren, voorzover dat deel betrekking heeft op de uitkeringen, bedoeld
      in [artikel 104, eerste lid, onderdeel c][ref2], respectievelijk [artikel 104, eerste lid, onderdeel d][ref3],
      alsmede de uitvoeringskosten met betrekking tot die uitkeringen en de op grond van enige wet over die uitkeringen
      verschuldigde premies of vergoedingen als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref4] die niet op die
      uitkeringen in mindering kunnen worden gebracht.


