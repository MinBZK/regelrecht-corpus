  - number: 122ac
    text: |-
      De werkgever die in 2005 of 2006 zelf het risico droeg van betaling van WGA-uitkering overeenkomstig
      [hoofdstuk 9 van de Wet werk en inkomen naar arbeidsvermogen][ref1], en die dat risico op enig moment in 2007
      niet meer draagt, krijgt in afwijking van [artikel 36][ref2] een eenmalige korting op de basispremie, te berekenen
      over het loon in 2007 van de tot hem in dienstbetrekking staande werknemers, die wordt gerelateerd aan het aantal
      maanden dat de werkgever in 2006 dit risico droeg. Indien de werkgever in 2007 reeds een bedrag aan premiekorting
      heeft ontvangen wordt dat bedrag op de korting, bedoeld in de eerste zin, in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel36
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel122ac
    references:
