        paragraaf: '1'
        afdeling: '6'
  - number: 122b.2
    text: |-
      Tot het jaar 2010 worden de premiekortingen, bedoeld in de [artikelen 47][ref1] en [49][ref2], toegepast op
      enerzijds de op grond van de [artikelen 27][ref3] en [31][ref4] door de werkgever verschuldigde premies en
      anderzijds op de op grond van [afdeling 4 van hoofdstuk 3][ref5] verschuldigde premies.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel27
