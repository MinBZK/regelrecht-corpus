        artikel: '8'
      - id: ref11
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref12
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '59.5'
    text: |-
      De inspecteur stelt de werkgever zonodig op de hoogte van de door het UWV op aanvraag van de werknemer genomen
      beschikking over het verzekerd zijn op grond van de werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel59
  - number: '59.6'
    text: |-
      In afwijking van de [artikelen 25b][ref1], [27f][ref2], [27j, derde lid][ref3], en
      [29i van de Algemene wet inzake rijksbelastingen][ref4] verleent de inspecteur een teruggaaf van premies voor de
      werknemersverzekeringen uitsluitend aan de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel25b
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel27f
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel27j
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel29i
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 25b
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 27f
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 27j
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 29i
  - number: '59.7'
    text: |-
      Indien in verband met een gevraagde beschikking informatie is gevraagd aan een persoon of
      instantie buiten Nederland en om die reden de beschikking niet binnen de termijn, bedoeld in
      [afdeling 4.1.3 van Algemene wet bestuursrecht][ref1], gegeven kan worden, wordt die termijn verlengd met ten
      hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.3
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.3
  - number: '59.8'
    text: |-
      Met betrekking tot premies voor de werknemersverzekeringen wordt, in afwijking van
      [artikel 20, tweede lid, eerste zin, van de Algemene wet inzake rijksbelastingen][ref1], geen naheffingsaanslag aan
      de werknemer opgelegd en is de tweede zin van dat lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
  - number: '59.9'
    text: |-
      Het zevende lid is van overeenkomstige toepassing op een aanvraag als bedoeld in het derde lid en op een aanvraag
      of melding op grond van de [artikelen 40][ref1], [95][ref2] of [97][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel97
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '95'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '97'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: '60.1'
    text: |-
      De rijksbelastingdienst vordert de premie voor de volksverzekeringen en de premies voor de werknemersverzekeringen
      in.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel60
  - number: '60.2'
    text: |-
      Bij de invordering van de premie voor de volksverzekeringen zijn, naar gelang
      [artikel 58, eerste lid, dan wel tweede lid][ref1] van toepassing is, de regels geldende voor de invordering van de
      inkomstenbelasting onderscheidenlijk de loonbelasting van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel58
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '60.3'
    text: |-
      Bij de invordering van de premies voor de werknemersverzekeringen zijn de regels geldende voor de invordering van
      de loonbelasting, met uitzondering van [artikel 38, eerste lid, onderdeel a, van de Invorderingswet 1990][ref1],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel38
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '38'
  - number: '61.1'
    text: |-
      Indien een premieplichtige heeft nagelaten over een bepaald jaar de op aanslag verschuldigde premie
      voor de volksverzekeringen te betalen, beslist de SVB dat sprake is van schuldig nalaten als bedoeld in
      [artikel 13 van de Algemene Ouderdomswet][ref1], behoudens voorzover de premieplichtige aantoont dat er
      omstandigheden aanwezig zijn op grond waarvan het niet betalen van de premie hem niet toegerekend kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel13
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '13'
  - number: '61.2'
    text: 'Een beslissing als bedoeld in het eerste lid wordt in elk geval genomen indien:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel61
  - number: 61.2.a
    text: |-
      de aanslag voor de premie voor de volksverzekeringen ambtshalve is vastgesteld omdat de premieplichtige geen of
      onvoldoende medewerking heeft verleend bij het vaststellen van het premie-inkomen;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel61
  - number: 61.2.b
    text: |-
      de premie voor de volksverzekeringen niet of niet geheel kan worden ingevorderd omdat is nagelaten te voldoen
      aan de krachtens de [artikelen 65, eerste tot en met derde en vijfde tot en met zevende lid][ref1], [66][ref2] en
      [68 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref3] geldende verplichtingen; of


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel68
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '66'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '68'
  - number: 61.2.c
    text: |-
      de premieplichtige de bekendmaking van de beslissing op grond van het eerste lid
      bemoeilijkt of onmogelijk maakt omdat is nagelaten te voldoen aan de krachtens de
      [artikelen 65, eerste tot en met derde en vijfde tot en met zevende lid][ref1], [66][ref2] en
      [68 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref3] geldende verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel68
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '66'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '68'
  - number: '61.3'
    text: |-
      Indien de premieplichtige ten aanzien van wie een beslissing als bedoeld in het eerste lid is genomen binnen vijf
      jaren na de dagtekening van de aanslag voor de premie voor de volksverzekeringen de verschuldigd gebleven premie
      alsnog geheel of gedeeltelijk betaalt, is hij een opslag verschuldigd van 5% op de verschuldigd gebleven premie
      voor de algemene ouderdomsverzekering. Indien een beslissing als bedoeld in het eerste lid meer dan vier jaren en
      achtenveertig weken na de dagtekening van de aanslag wordt genomen, wordt de termijn van vijf jaren verlengd tot
      vier weken na de datum van die beslissing.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel61
  - number: '61.4'
    text: |-
      Ingeval van gehele of gedeeltelijke premiebetaling als bedoeld in het derde lid, wordt die betaling
      achtereenvolgens toegerekend aan:
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel61
  - number: 61.4.a
    text: de kosten verbonden aan de invordering;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel61
  - number: 61.4.b
    text: de invorderingsrente;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel61
  - number: 61.4.c
    text: |-
      de verschuldigd gebleven inkomstenbelasting en de premie, verschuldigd gebleven voor de algemene verzekering
      bijzondere ziektekosten en de nabestaandenverzekering;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel61
  - number: 61.4.d
    text: de opslag, bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel61
  - number: 61.4.e
    text: |-
      de premie, verschuldigd gebleven voor de algemene ouderdomsverzekering, waarbij de betaling eerst wordt toegerekend
      aan het oudste tijdvak of de oudste tijdvakken binnen de termijn van vijf jaren bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel61
  - number: '61.5'
    text: |-
      Ingeval van gehele of gedeeltelijke premiebetaling voor de algemene ouderdomsverzekering als bedoeld in het derde
      lid wordt de beslissing op grond van het eerste lid in zoverre gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel61
  - number: '61.6'
    text: |-
      Aan de belanghebbende wordt door de SVB bij brief met ontvangstbevestiging kennis gegeven van een beslissing als
      bedoeld in het eerste en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel61
  - number: '62'
    text: |-
      Het beroep tegen een beslissing van de SVB op grond van [artikel 61][ref1] kan niet zijn gegrond op de stelling
      dat de aanslag ten onrechte of tot een te hoog bedrag is vastgesteld. Het beroep kan slechts dan zijn gegrond op
      de stelling dat de aanslag niet is ontvangen, indien de belanghebbende aannemelijk kan maken dat hij de aanslag
      nimmer ontvangen heeft en dat er geen omstandigheden zijn op grond waarvan het niet ontvangen van de aanslag hem
      kan worden toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel61
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '63'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën en Onze Minister van
      Volksgezondheid, Welzijn en Sport, kunnen nadere regels worden gesteld met betrekking tot dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel63
  - number: '64.1'
    text: |-
      De SVB kan op verzoek wegens gemoedsbezwaren tegen één of meer volksverzekeringen of werknemersverzekeringen
      ontheffen van de verplichtingen opgelegd op grond van de desbetreffende wetten en deze wet:
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel64
  - number: 64.1.a
    text: de persoon, die deze gemoedsbezwaren heeft;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel64
  - number: 64.1.b
    text: de rechtspersoon, waarbij natuurlijke personen zijn betrokken die deze gemoedsbezwaren hebben.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel64
  - number: '64.2'
    text: De SVB doet de inspecteur mededeling omtrent de ontheffing of intrekking van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel64
  - number: '65.1'
    text: |-
      Indien een ontheffing is verleend in het kader van één of meer volksverzekeringen, wordt voor geen van
      de volksverzekeringen premie geheven, doch vindt voor al die verzekeringen heffing van premievervangende
      inkomstenbelasting of premievervangende loonbelasting plaats overeenkomstig [artikel 58][ref1] tot het
      bedrag van de verschuldigde premie als bedoeld in [artikel 9][ref2]. Tevens wordt in het in de vorige zin
      bedoelde geval geen inkomensafhankelijke bijdrage geheven, maar vindt met overeenkomstige toepassing van
      [artikel 57, eerste en tweede lid, van de Zorgverzekeringswet][ref3] heffing van bijdragevervangende belasting
      plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel57
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '57'
  - number: '65.2'
    text: |-
      Indien een werkgever ontheffing is verleend in het kader van de werknemersverzekeringen wordt premievervangende
      loonbelasting geheven overeenkomstig [artikel 59][ref1] tot het bedrag aan premies dat hij met toepassing van
      [hoofdstuk 3][ref2] zou hebben afgedragen, indien hem geen ontheffing zou zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017745
        hoofdstuk: '3'
  - number: '65.3'
    text: |-
      Voor de toepassing van deze wet, de [Wet inkomstenbelasting 2001][ref1], de [Wet op de loonbelasting 1964][ref2]
      en de [Invorderingswet 1990][ref3] wordt de premievervangende belasting beschouwd als premie voor de
      volksverzekeringen dan wel voor de werknemersverzekeringen en wordt de bijdragevervangende belasting, bedoeld in
      het eerste lid en in [artikel 57 van de Zorgverzekeringswet][ref4], beschouwd als inkomensafhankelijke bijdrage op
      grond van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002471
      [ref3]: https://wetten.overheid.nl/BWBR0004770
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel57
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002471
      - id: ref3
        bwb_id: BWBR0004770
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '57'
  - number: '66'
    text: |-
      Ten laste van het Rijk komen de bedragen aan premie voor de volksverzekeringen en de werknemersverzekeringen die
      wegens een ontheffing niet zijn geheven overeenkomstig [artikel 65][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel65
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '65'
        hoofdstuk: '5'
  - number: '67'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën en Onze Minister van
      Volksgezondheid, Welzijn en Sport, worden regels gesteld ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel67
  - number: 67.a
    text: de voorwaarden, waaronder een ontheffing wordt verleend;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel67
  - number: 67.b
    text: de verdere gevolgen die aan een ontheffing worden verbonden;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel67
  - number: 67.c
    text: de gevallen, waarin een ontheffing wordt ingetrokken en de gevolgen die aan die intrekking worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel67
  - number: 67a
    text: |-
      In afwijking van [artikel 7:3 van de Algemene wet bestuursrecht][ref1] kan van het horen van een belanghebbende
      worden afgezien ten aanzien van een besluit inzake de ontheffing, bedoeld in [artikel 64][ref2], indien de
      belanghebbende niet binnen een door de SVB gestelde redelijke termijn verklaart dat hij gebruik wil maken van het
      recht te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel64
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '64'
        hoofdstuk: '5'
  - number: '68'
    text: |-
      De financiële middelen tot dekking van de uitgaven voor de vrijwillige volksverzekeringen worden verkregen door het
      heffen van premie.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel68
  - number: '69'
    text: 'Voor de toepassing van deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel69
  - number: 69.a
    text: |-
      vrijwillige algemene ouderdomsverzekering: de verzekering, bedoeld in
      [hoofdstuk IV van de Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002221
        hoofdstuk: IV
  - number: 69.b
    text: |-
      vrijwillige nabestaandenverzekering: de verzekering, bedoeld in [hoofdstuk 5 van de Algemene nabestaandenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0007795
        hoofdstuk: '5'
  - number: '70.1'
    text: |-
      De verschuldigde premie voor de vrijwillige algemene ouderdomsverzekering of de vrijwillige nabestaandenverzekering
      wordt in rekening gebracht en geïnd door de SVB op de wijze en het tijdstip aangegeven door de SVB.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel70
  - number: '70.2'
    text: |-
      Een schuld aan premie voor een vrijwillige verzekering valt buiten de nalatenschap van degene, die tot die
      verzekering was toegelaten. De schuld wordt betaald door degene, die krachtens de betrokken vrijwillige verzekering
      prestaties ontvangt.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel70
  - number: '71.1'
    text: |-
      Degene die is toegelaten tot de vrijwillige algemene ouderdomsverzekering of de vrijwillige
      nabestaandenverzekering, is voor die verzekeringen een premie verschuldigd volgens bij of krachtens algemene
      maatregel van bestuur te bepalen tarief.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel71
  - number: '71.2'
    text: |-
      De voordracht voor een op grond van het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel71
  - number: '72'
    text: |-
      De financiële middelen tot dekking van de uitgaven voor de vrijwillige werknemersverzekeringen worden verkregen
      door het heffen van premie.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel72
  - number: '73.1'
    text: |-
      De premies voor de vrijwillige werknemersverzekeringen worden in rekening gebracht en geïnd door het UWV op de
      wijze en het tijdstip, aangegeven door dat instituut.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel73
  - number: '73.2'
    text: Het UWV kan nadere regels stellen met betrekking tot de premie.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel73
  - number: '73.3'
    text: De door het UWV op grond van het tweede lid gestelde regels behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel73
  - number: '74.1'
    text: |-
      De premie voor de vrijwillige verzekering op grond van de [Werkloosheidswet][ref1] wordt berekend over het dagloon,
      bedoeld in [artikel 58, eerste lid, van de Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel58
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '58'
  - number: '74.2'
    text: |-
      De premie bedraagt een door het UWV te bepalen percentage van het in het eerste lid bedoelde dagloon, met
      dien verstande dat de premie niet meer bedraagt dan het deel van de premie, bedoeld in [artikel 27][ref1],
      dat ten gunste komt van het Algemeen Werkloosheidsfonds, vermeerderd met de premie, bedoeld in
      [artikel 28, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel28
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
  - number: '74.3'
    text: |-
      Bij de bepaling van de premie blijft [artikel 17, tweede lid][ref1], buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '75.1'
    text: |-
      De premie voor de vrijwillige verzekering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt berekend over het dagloon, bedoeld in
      [artikel 84, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel84
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '84'
  - number: '75.2'
    text: |-
      De premie bedraagt een door het UWV te bepalen percentage van het in het eerste lid bedoelde dagloon, met dien
      verstande dat de premie niet meer bedraagt dan de in [artikel 36][ref1] bedoelde basispremie, vermeerderd met het
      in [artikel 37][ref2] bedoelde percentage voor de uniforme premie.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel37
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: '76.1'
    text: |-
      De premie voor de vrijwillige verzekering op grond van de [Ziektewet][ref1] wordt berekend over het dagloon,
      bedoeld in [artikel 68, eerste lid, van de Ziektewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel68
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '68'
  - number: '76.2'
    text: De premie bedraagt een door het UWV te bepalen percentage van het in het eerste lid bedoelde dagloon.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel76
  - number: 76a.1
    text: |-
      De premie voor de vrijwillige verzekering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref1] wordt berekend over het dagloon, bedoeld in
      [artikel 21, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel21
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '21'
  - number: 76a.2
    text: |-
      De premie bedraagt een door het UWV te bepalen percentage van het in het eerste lid bedoelde dagloon, met dien
      verstande dat de premie niet meer bedraagt dan de in [artikel 36][ref1] bedoelde basispremie, vermeerderd met het
      in [artikel 37][ref2] bedoelde percentage voor de uniforme premie en een premieopslag die wordt berekend op grond
      van het in [artikel 38, eerste lid, onderdeel a][ref3], bedoelde percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel38
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: '77'
    text: |-
      Degene die is toegelaten tot een vrijwillige verzekering, is verplicht aan de SVB of het UWV onverwijld uit eigen
      beweging mededeling te doen van alle feiten en omstandigheden waarvan het hem redelijkerwijs duidelijk is, dat zij
      van invloed zijn op de hoogte van de verschuldigde premie.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel77
  - number: '78'
    text: |-
      In afwijking van [artikel 7:3 van de Algemene wet bestuursrecht][ref1] kan van het horen van een belanghebbende
      worden afgezien ten aanzien van een besluit inzake de verschuldigde premie voor een vrijwillige verzekering indien
      de belanghebbende niet binnen een door de SVB of het UWV gestelde redelijke termijn, verklaart dat hij gebruik wil
      maken van het recht te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '79'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist de SVB of het UWV
      binnen dertien weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '80'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      vaststelling, de inning en de betaling van de premie voor een vrijwillige verzekering.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel80
  - number: '81'
    text: |-
      Bij regeling van Onze Minister en Onze Ministers van Financiën en van Volksgezondheid, Welzijn en Sport
      worden regels gesteld met betrekking tot de afdracht van de premie voor de volksverzekeringen en de premies
      voor de werknemersverzekeringen alsmede van de daarmee verband houdende bestuurlijke boeten en renten door de
      rijksbelastingdienst aan de fondsen en de wijze van toerekening van die premies, boeten en renten aan de fondsen.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel81
  - number: '82.1'
    text: |-
      De SVB beheert en administreert afzonderlijk de middelen tot dekking van de uitgaven, bedoeld in
      [artikel 83, tweede lid][ref1], in de vorm van een Ouderdomsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel83
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '83'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '2'
  - number: '82.2'
    text: |-
      De SVB beheert en administreert afzonderlijk de middelen tot dekking van de uitgaven, bedoeld in
      [artikel 85, tweede lid][ref1], in de vorm van een Nabestaandenfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel85
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '85'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '2'
  - number: '82.3'
    text: Het Ouderdomsfonds en het Nabestaandenfonds maken deel uit van de SVB.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel82
  - number: '83.1'
    text: 'Ten gunste van het Ouderdomsfonds komen:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel83
  - number: 83.1.a
    text: de premies voor de algemene ouderdomsverzekering en voor de vrijwillige algemene ouderdomsverzekering;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel83
  - number: 83.1.b
    text: |-
      rijksbijdragen als bedoeld in [artikel 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel14
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '14'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 83.1.c
    text: |-
      de opslag, bedoeld in [artikel 61, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel61
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 83.1.d
    text: |-
      de boeten, bedoeld in [artikel 17c van de Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17c
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 17c
  - number: 83.1.e
    text: |-
      de bijdrage in de kosten van de heffingskortingen, bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel15
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '83.2'
    text: 'Uit het Ouderdomsfonds worden betaald:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel83
  - number: 83.2.a
    text: de lasten van de algemene ouderdomsverzekering en van de vrijwillige algemene ouderdomsverzekering;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel83
  - number: 83.2.b
    text: |-
      de lasten van de regeling, vervat in [hoofdstuk VIII van de Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002221
        hoofdstuk: VIII
  - number: 83.2.c
    text: |-
      de lasten van de tegemoetkoming, bedoeld in [artikel 33b van de Algemene Ouderdomswet][ref1], en de daaraan
      verbonden uitvoeringskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel33b
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 33b
  - number: '84'
    text: |-
      Onze Minister stelt een keer per jaar een prognose op van de benodigde middelen tot dekking van de lasten van de
      algemene ouderdomsverzekering voor de eerstkomende tien jaren, waarbij onderscheid wordt gemaakt naar de opbrengst
      van de premies voor de algemene ouderdomsverzekering, de rijksbijdragen, bedoeld in [artikel 14][ref1], en de
      ontvangsten en uitgaven van het Spaarfonds AOW.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel14
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '14'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '85.1'
    text: 'Ten gunste van het Nabestaandenfonds komen:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel85
  - number: 85.1.a
    text: |-
      de premies voor de nabestaandenverzekering en voor de vrijwillige nabestaandenverzekering alsmede de te ontvangen
      bijdragen op grond van [artikel 66a van de Algemene nabestaandenwet][ref1] en de daarop berustende bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel66a
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 66a
  - number: 85.1.b
    text: |-
      de boeten, bedoeld in [artikel 39 van de Algemene nabestaandenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel39
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '39'
  - number: 85.1.c
    text: |-
      de bijdrage in de kosten van de heffingskortingen, bedoeld in [artikel 15][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel15
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 85.1.d
    text: |-
      rijksbijdragen als bedoeld in [artikel 14, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel14
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '14'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '85.2'
    text: 'Uit het Nabestaandenfonds worden betaald:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel85
  - number: 85.2.a
    text: de lasten van de nabestaandenverzekering en van de vrijwillige nabestaandenverzekering;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel85
  - number: 85.2.b
    text: |-
      de lasten voortvloeiend uit [hoofdstuk 8 van de Algemene nabestaandenwet][ref1] en de daarop berustende bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0007795
        hoofdstuk: '8'
  - number: 85.2.c
    text: |-
      de lasten van de tegemoetkomingen, bedoeld in [artikel 29a van de Algemene nabestaandenwet][ref1], en de daaraan
      verbonden uitvoeringskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel29a
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 29a
  - number: '86.1'
    text: Er is een Spaarfonds AOW.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel86
  - number: '86.2'
    text: |-
      Het Spaarfonds AOW is een begrotingsfonds als bedoeld in
      [artikel 9, eerste lid, van de Comptabiliteitswet 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel9
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '9'
  - number: '86.3'
    text: |-
      De ontvangsten van het Spaarfonds AOW worden gevormd door bijdragen ten laste van de begroting van het Ministerie
      van Sociale Zaken en Werkgelegenheid en door renten op het saldo van het fonds.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel86
  - number: '86.4'
    text: De uitgaven van het Spaarfonds AOW strekken ter bekostiging van lasten van de algemene ouderdomsverzekering.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel86
  - number: '86.5'
    text: Onze Minister beheert de begroting van het Spaarfonds AOW.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel86
  - number: '86.6'
    text: |-
      In afwijking van de [artikelen 2, derde lid][ref1], en [52, eerste lid, van de Comptabiliteitswet 2001][ref2]
      worden de begroting en de financiële verantwoording van het fonds uitsluitend op kasbasis gepresenteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel52
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '52'
  - number: '86.7'
    text: |-
      Het gerealiseerde batig saldo van het Spaarfonds AOW van enig jaar wordt ten gunste gebracht van de begroting van
      het Spaarfonds AOW van het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel86
  - number: '87.1'
    text: |-
      Jaarlijks komt een bijdrage als bedoeld in [artikel 86, derde lid][ref1], ten gunste van het Spaarfonds AOW.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel86
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '86'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '2'
  - number: '87.2'
    text: |-
      De omvang van elke ten gunste van het Spaarfonds AOW komende bijdrage wordt door Onze Minister in overeenstemming
      met Onze Minister van Financiën bepaald.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel87
  - number: '87.3'
    text: |-
      In elk jaar wordt een bijdrage ten gunste van het Spaarfonds AOW gebracht die ten minste € 113 445 054 hoger is dan
      het bedrag dat in het jaar, voorafgaande aan het desbetreffende jaar, ten minste ten gunste van het Spaarfonds AOW
      diende te worden gebracht.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel87
  - number: '87.4'
    text: Het in het Spaarfonds AOW aanwezige saldo wordt rentedragend in 's Rijks schatkist aangehouden.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel87
  - number: '87.5'
    text: Onze Minister van Financiën stelt jaarlijks de rente vast die over het saldo van het Spaarfonds AOW wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel87
  - number: '88'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Financiën besluiten vanaf het jaar 2020 uit het
      Spaarfonds AOW lasten van de algemene ouderdomsverzekering te betalen.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel88
  - number: '89'
    text: Het College zorgverzekeringen beheert en administreert afzonderlijk een Algemeen Fonds Bijzondere Ziektekosten.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel89
  - number: '90.1'
    text: 'Ten gunste van het Algemeen Fonds Bijzondere Ziektekosten komen:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
  - number: 90.1.a
    text: de premie voor de algemene verzekering bijzondere ziektekosten;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
  - number: 90.1.b
    text: |-
      de inkomsten, die in verband met de algemene verzekering bijzondere ziektekosten voortvloeien uit internationale
      overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
  - number: 90.1.c
    text: |-
      de bijdragen in de kosten van zorg die op grond van
      [artikel 6, vierde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] worden betaald door of namens de
      verzekerde, dan wel, in voorkomend geval, door het krachtens een wettelijke regeling tot betaling van zodanige
      bijdragen bevoegde orgaan dat uitkeringen of pensioenen uit hoofde van die regeling aan die verzekerde betaalbaar
      stelt;


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
  - number: 90.1.d
    text: |-
      de bijdragen in de kosten van de heffingskortingen, bedoeld in [artikel 15][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel15
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 90.1.e
    text: |-
      een rijksbijdrage als bedoeld in [artikel 14, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel14
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '14'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '90.2'
    text: 'Uit het Algemeen Fonds Bijzondere Ziektekosten worden betaald:'
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
  - number: 90.2.a
    text: |-
      de gehele of gedeeltelijke kosten van de algemene verzekering bijzondere ziektekosten en uitkeringen als bedoeld in
      [artikel 3.1.2 van de Invoerings- en aanpassingswet Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018830#Artikel3
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0018830
        artikel: '3'
  - number: 90.2.b
    text: |-
      de uitgaven voor deze verzekering, voortvloeiende uit overeenkomsten, waaronder begrepen internationale
      overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
  - number: 90.2.c
    text: |-
      de uitgaven die in verband met die verzekering voortvloeien uit enige andere wettelijke regeling dan de
      [Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 90.2.d
    text: |-
      bijdragen aan Onze Minister van Justitie in verband met diens financiële verantwoordelijkheid bedoeld in
      [artikel 6, vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
  - number: 90.2.e
    text: |-
      bijdragen aan Onze Minister van Defensie op grond van
      [artikel 7, derde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel7
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '7'
  - number: 90.2.f
    text: |-
      uitgaven ten behoeve van subsidies, verstrekt op grond van
      [artikel 44 van de Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel44
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '44'
  - number: 90.2.g
    text: |-
      de uitgaven, bedoeld in [artikel 10, vierde lid, van de Wet op de orgaandonatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel10
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '10'
  - number: '90.3'
    text: |-
      Uit het Algemeen Fonds Bijzondere Ziektekosten kunnen middelen worden gebruikt voor het vormen en in stand houden
      van een reserve. Bij ministeriële regeling kunnen door Onze Minister van Volksgezondheid, Welzijn en Sport, in
      overeenstemming met Onze Minister, met betrekking tot de vorige volzin nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
  - number: '90.4'
    text: |-
      Onverminderd het bepaalde krachtens artikel 15 wordt jaarlijks aan het Algemeen Fonds Bijzondere Ziektekosten
      een bijdrage verleend voor de uitvoering van de Regeling Ziekenfondsraad Abortusklinieken 1992 dan wel de
      regeling die op grond van [artikel 44 van de Algemene Wet Bijzondere Ziektekosten][ref1] ter vervanging van
      die regeling is vastgesteld. Op de bijdrage worden voorschotten verleend. De bijdrage voor enig jaar is gelijk
      aan het saldo van de uitgaven en ontvangsten in het desbetreffende jaar met betrekking tot de uitvoering van
      de bedoelde regeling, voorzover door Onze Minister van Volksgezondheid, Welzijn en Sport aanvaard. Het College
      zorgverzekeringen neemt een specificatie van de ontvangsten en uitgaven op in de jaarrekening, bedoeld in
      [artikel 45 van de Algemene Wet Bijzondere Ziektekosten][ref2]. Onze Minister van Volksgezondheid, Welzijn en Sport
      stelt de bijdrage uiterlijk drie maanden na ontvangst van de jaarrekening vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel45
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '45'
  - number: '91.1'
    text: |-
      Het College zorgverzekeringen doet jaarlijks uitkeringen uit het Algemeen Fonds Bijzondere Ziektekosten ter dekking
      van de noodzakelijke uitgaven, gedaan voor de uitvoering van de in de [Algemene Wet Bijzondere Ziektekosten][ref1]
      geregelde verzekering, volgens bij of krachtens algemene maatregel van bestuur te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '91.2'
    text: |-
      De zorgautoriteit is bevoegd vast te stellen dat uitgaven niet verantwoord waren voorzover deze
      door hem niet noodzakelijk worden geacht voor de uitvoering van de verzekering op grond van de
      [Algemene Wet Bijzondere Ziektekosten][ref1]. Met de uitkeringen, bedoeld in het eerste lid, evenals met de
      daarmee verkregen opbrengsten worden geen uitgaven gedekt waarvan de zorgautoriteit heeft vastgesteld dat zij niet
      verantwoord waren, tenzij de zorgautoriteit anders besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '91.3'
    text: |-
      Op de uitkeringen, bedoeld in het eerste lid, kunnen voorschotten worden verleend overeenkomstig door het College
      zorgverzekeringen te stellen regels.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel91
  - number: '92'
    text: |-
      Een belanghebbende kan beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State tegen besluiten
      van het College zorgverzekeringen, genomen krachtens [artikel 91, eerste of derde lid][ref1], alsmede tegen
      besluiten van de zorgautoriteit, genomen krachtens [artikel 91, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel91
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '91'
