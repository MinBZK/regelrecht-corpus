        artikel: '46'
  - number: '110.1'
    text: |-
      Het UWV vergoedt, ten laste van het Uitvoeringsfonds voor de overheid, aan het Rijk bijdragen die vanwege het Rijk
      worden verleend aan uit het buitenland afkomstige werknemers, die geen Nederlander zijn en die terugkeren naar
      hun land van herkomst of emigreren naar een ander land en tot het tijdstip van vertrek uitkering op grond van de
      [Werkloosheidswet][ref1] ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '110.2'
    text: |-
      De in het eerste lid bedoelde vergoedingen zijn ten hoogste gelijk aan de bedragen, die de in het eerste lid
      bedoelde werknemers op grond van de [Werkloosheidswet][ref1] zouden hebben kunnen ontvangen ten laste van het
      Uitvoeringsfonds voor de overheid, indien zij werkloos waren gebleven en niet naar hun land van herkomst of een
      ander land waren vertrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '110.3'
    text: |-
      Bij ministeriële regeling, na overleg met Onze Minister wie het mede aangaat, worden regels gesteld met betrekking
      tot de aan het Rijk te vergoeden bijdragen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017745/2009-03-25#Artikel110
  - number: '111'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      kan een bedrag worden vastgesteld dat op grond van [artikel 24][ref1] met toepassing van de [artikelen 27][ref2] en
      [28, tweede en derde lid][ref3], op uitkeringen op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref4]
      of de [Wet werk en inkomen naar arbeidsvermogen][ref5] aan overheidswerknemers, volgens een bij die regeling
      te bepalen verdeling wordt afgedragen aan het Uitvoeringsfonds voor de overheid dan wel de sectorfondsen en het
      Algemeen Werkloosheidsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0019057
