preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter vermindering van administratieve en
    uitvoeringslasten en vereenvoudiging van regelgeving de heffing en invordering van de premies voor de
    werknemersverzekeringen te laten plaatsvinden door de rijksbelastingdienst tezamen met en op zoveel mogelijk
    gelijke wijze als die van de loonbelasting en de regeling daarvan en van hetgeen overigens de financiering van
    de werknemersverzekeringen betreft tezamen met de regeling van de financiering van de volksverzekeringen – onder
    intrekking van onder andere de Wet financiering volksverzekeringen – onder te brengen in één wet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#ArtikelAanhef
articles:
  - number: 122c.1
    text: |-
      De werkgever die op 28 december 2005 zelf het risico draagt van betaling van arbeidsongeschiktheidsuitkering
      overeenkomstig [hoofdstuk IIIA van de Wet op de arbeidsongeschiktheidsverzekering][ref1] en die dat risico voor 1
      januari 2005 zelf is gaan dragen, draagt met ingang van 29 december 2005 tevens zelf het risico van betaling van
      WGA-uitkering overeenkomstig [hoofdstuk 9 van de Wet werk en inkomen naar arbeidsvermogen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukIIIA
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0019057
        hoofdstuk: '9'
  - number: 122c.2
    text: 'Het eerste lid vindt geen toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
  - number: 122c.2.a
    text: |-
      de werkgever voor 29 december 2005 aan het UWV schriftelijk meldt het risico van betaling van WGA-uitkering
      overeenkomstig [hoofdstuk 9 van de Wet werk en inkomen naar arbeidsvermogen][ref1] niet zelf te willen dragen; of


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '9'
  - number: 122c.2.b
    text: |-
      het door de werkgever zelf dragen van het risico van betaling van arbeidsongeschiktheidsuitkering overeenkomstig
      [hoofdstuk IIIA van de Wet op de arbeidsongeschiktheidsverzekering][ref1] op aanvraag van de werkgever eindigt op 1
      januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukIIIA
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: IIIA
  - number: 122c.3
    text: |-
      Indien het eerste lid toepassing vindt, strekt de schriftelijke garantie die aan het UWV is overgelegd
      met betrekking tot het zelf dragen van het risico van betaling van arbeidsongeschiktheidsuitkering
      overeenkomstig [hoofdstuk IIIA van de Wet op de arbeidsongeschiktheidsverzekering][ref1] zich
      mede uit tot het zelf dragen van het risico van betaling van WGA-uitkering overeenkomstig
      [hoofdstuk 9 van de Wet werk en inkomen naar arbeidsvermogen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukIIIA
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0019057
        hoofdstuk: '9'
  - number: 122c.4
    text: |-
      In afwijking van [artikel 40][ref1] verleent het UWV aan de werkgever op wie het eerste lid niet van
      toepassing is op aanvraag toestemming om het risico van betaling van WGA-uitkering overeenkomstig
      [hoofdstuk 9 van de Wet werk en inkomen naar arbeidsvermogen][ref2] zelf te dragen, indien de werkgever
      een schriftelijke garantie overlegt, waaruit blijkt dat een kredietinstelling of een verzekeraar zich
      jegens het UWV verplicht, op het eerste verzoek van het UWV waarbij het UWV schriftelijk meedeelt dat de
      verplichtingen die voortvloeien uit het zelf dragen van het risico niet worden nagekomen, die verplichtingen
      na te komen. De overheidswerkgever, bedoeld in artikel 1, onderdeel k, van de Wet overheidspersoneel
      onder de werknemersverzekeringen, voorzover door Onze Minister in overeenstemming met Onze Minister van
      Financiën aangewezen, is ontheven van de verplichting tot het overleggen van een schriftelijke garantie,
      bedoeld in de eerste zin. De toestemming wordt niet verleend gedurende drie jaren nadat het door de
      werkgever zelf dragen van het risico van betaling van arbeidsongeschiktheidsuitkering overeenkomstig
      [hoofdstuk IIIA van de Wet op de arbeidsongeschiktheidsverzekering][ref3] is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0002524#HoofdstukIIIA
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
