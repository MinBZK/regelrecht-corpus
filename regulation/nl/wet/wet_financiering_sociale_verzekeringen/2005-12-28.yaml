  - number: 122c.8
    text: |-
      Indien het UWV de werkgever op grond van het vierde lid toestemming verleent om het risico van betaling van WGA-
      uitkering overeenkomstig [hoofdstuk 9 van de Wet werk en inkomen naar arbeidsvermogen][ref1] zelf te dragen, wordt
      de werkgever geacht dit risico zelf te hebben gedragen met ingang van 29 december 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '9'
  - number: 122c.9
    text: |-
      De werkgever die in 2005 of 2006 zelf het risico draagt van betaling van WGA-uitkering overeenkomstig
      [hoofdstuk 9 van de Wet Werk en inkomen naar arbeidsvermogen][ref1] krijgt in afwijking van [artikel 36][ref2]
      in 2007 zolang hij zelf dat risico draagt een korting op de basispremie ter hoogte van de door hem over 2005 en
      2006 betaalde basispremie WGA vermenigvuldigd met de breuk waarvan de teller wordt gevormd door het aantal hele
      kalendermaanden dat de werkgever het risico in 2005 en 2006 heeft gedragen en de noemer 12 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel36
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: 122c.10
    text: |-
      Indien het eerste lid toepassing heeft gevonden is [artikel 40, dertiende lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 122c.11
    text: |-
      Aan de werkgever die eigenrisicodrager is op grond van dit artikel wordt geacht toestemming te zijn verleend om
      zelf het risico van betaling van de arbeidsongeschiktheidsuitkering te dragen op grond van [artikel 40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 122c.12
    text: |-
      Het vijfde lid is niet van toepassing op de startende werkgever. In het zevende lid wordt ten aanzien van de
      startende werkgever voor «vanaf 29 december 2005» gelezen: vanaf het tijdstip waarop deze aanvangt werkgever te
      zijn.
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
  - number: 122c.13
    text: |-
      Het UWV is bevoegd te beslissen op een bezwaarschrift dat voor de datum van inwerkingtreding van [artikel 40][ref1]
      is ingediend tegen een beschikking op grond van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 122c.14
    text: |-
      De inspecteur is bevoegd te beslissen op een bezwaarschrift dat op of na de datum van inwerkingtreding van
      [artikel 40][ref1] is ingediend tegen een beschikking op grond van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 122c.15
    text: |-
      Op beroep tegen een uitspraak op een bezwaarschrift van het UWV inzake een beschikking op grond van dit artikel,
      waarop op de datum van inwerkingtreding van [artikel 40][ref1] nog geen uitspraak is gedaan, wordt beslist door de
      rechter waarbij het beroep aanhangig is.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 122c.16
    text: |-
      In bestuursrechtelijke gedingen, waarbij beroep na de inwerkingtreding van [artikel 40][ref1] wordt ingediend
      tegen een uitspraak op een bezwaarschrift van het UWV inzake een beschikking op grond van dit artikel, treedt de
      inspecteur als partij in de plaats van het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '5'
  - number: 122ca
    text: |-
      In afwijking van [artikel 40][ref1] en [artikel 122c, vierde lid][ref2], wordt geen toestemming
      verleend om in de jaren 2005 en 2006 het risico van betaling van WGA-uitkering overeenkomstig
      [hoofdstuk 9 van de Wet werk en inkomen naar arbeidsvermogen][ref3] zelf te dragen aan de werkgever te wiens laste,
      in het tweede kalenderjaar dat aan het premiejaar vooraf is gegaan, een premieplichtig loon is gekomen dat gelijk
      is of minder bedraagt dan 25 maal het gemiddelde premieplichtig loon per werknemer in dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel122c
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk9
