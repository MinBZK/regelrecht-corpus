  - number: 122c.5
    text: De aanvraag bedoeld in het vierde lid, wordt uiterlijk gedaan op 28 december 2005.
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
  - number: 122c.6
    text: Op een aanvraag als bedoeld in het vierde lid beslist het UWV binnen 26 weken na de ontvangst van die aanvraag.
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
  - number: 122c.7
    text: |-
      Indien een werkgever een aanvraag als bedoeld in het vierde lid heeft ingediend is vanaf 29 december 2005 tot de
      datum waarop het UWV op de aanvraag heeft beslist [artikel 42 van de Wet werk en inkomen naar arbeidsvermogen][ref1]
      van overeenkomstige toepassing en wordt met betrekking tot de [artikelen 27][ref2], [29][ref3], [30][ref4],
      [37][ref5], voor «eigenrisicodrager» gelezen: de werkgever die een aanvraag als bedoeld in artikel 122c, vierde
      lid, van de Wet financiering sociale verzekering heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0017745#Artikel37
    url: https://wetten.overheid.nl/BWBR0017745/2005-12-28#Artikel122c
