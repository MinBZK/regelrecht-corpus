  - number: '5'
    text: |-
      Voor de toepassing van deze wet wordt onder premie voor de volksverzekeringen niet begrepen de nominale premie die
      de verzekerde op grond van [artikel 17 van de Algemene Wet Bijzondere Ziektekosten][ref1] verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel17
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel5
