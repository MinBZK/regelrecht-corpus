        artikel: '32'
  - number: 104.1.i
    text: |-
      de bedragen van de premievrijstelling bij marginale arbeid, bedoeld in [afdeling 6 van hoofdstuk 3][ref1],
      toegepast op de sectorpremie;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
