  - number: '90.2'
    text: 'Uit het Algemeen Fonds Bijzondere Ziektekosten worden betaald:'
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel90
  - number: 90.2.a
    text: |-
      de gehele of gedeeltelijke kosten van de algemene verzekering bijzondere ziektekosten en uitkeringen als bedoeld in
      [artikel 3.1.2 van de Invoerings- en aanpassingswet Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018830#Artikel3
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0018830
        artikel: '3'
  - number: 90.2.b
    text: |-
      de uitgaven voor deze verzekering, voortvloeiende uit overeenkomsten, waaronder begrepen internationale
      overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel90
  - number: 90.2.c
    text: |-
      de uitgaven die in verband met die verzekering voortvloeien uit enige andere wettelijke regeling dan de
      [Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 90.2.d
    text: |-
      bijdragen aan Onze Minister van Veiligheid en Justitie in verband met diens financiële verantwoordelijkheid bedoeld
      in [artikel 6, vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
  - number: 90.2.e
    text: |-
      bijdragen aan Onze Minister van Defensie op grond van
      [artikel 7, derde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel7
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '7'
  - number: 90.2.f
    text: |-
      uitgaven ten behoeve van subsidies, verstrekt op grond van
      [artikel 44 van de Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel44
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '44'
  - number: 90.2.g
    text: |-
      bijdragen waarmee het CAK gemeenten compenseert voor in het kader van de
      [Wet tegemoetkoming chronisch zieken en gehandicapten][ref1] ingevoerde kortingen op eigen bijdragen of andere
      eigen betalingen als bedoeld in de [Wet maatschappelijke ondersteuning][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0025003
      [ref2]: https://wetten.overheid.nl/BWBR0020031
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0025003
      - id: ref2
        bwb_id: BWBR0020031
  - number: 90.2.h
    text: |-
      bedragen als bedoeld in [artikel 56a van de Wet marktordening gezondheidszorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel56a
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 56a
  - number: 90.2.i
    text: |-
      de door het College zorgverzekeringen op grond van een ministeriële regeling vastgestelde verdeelbedragen, zijnde
      aan de relevante zorgverzekeraars toegekende delen van de bedragen bedoeld in onderdeel f van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel90
  - number: '90.3'
    text: |-
      Uit het Algemeen Fonds Bijzondere Ziektekosten kunnen middelen worden gebruikt voor het vormen en in stand houden
      van een reserve. Bij ministeriële regeling kunnen door Onze Minister van Volksgezondheid, Welzijn en Sport, in
      overeenstemming met Onze Minister, met betrekking tot de vorige volzin nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel90
  - number: '90.4'
    text: |-
      Onverminderd het bepaalde krachtens [artikel 15][ref1] wordt jaarlijks aan het Algemeen Fonds Bijzondere
      Ziektekosten een bijdrage verleend voor de uitvoering van de Regeling Ziekenfondsraad Abortusklinieken 1992 dan
      wel de regeling die op grond van [artikel 44 van de Algemene Wet Bijzondere Ziektekosten][ref2] ter vervanging
      van die regeling is vastgesteld. Op de bijdrage worden voorschotten verleend. De bijdrage voor enig jaar is
      gelijk aan het saldo van de uitgaven en ontvangsten in het desbetreffende jaar met betrekking tot de uitvoering
      van de bedoelde regeling, voorzover door Onze Minister van Volksgezondheid, Welzijn en Sport aanvaard. Het
      College zorgverzekeringen neemt een specificatie van de ontvangsten en uitgaven op in de jaarrekening, bedoeld in
      [artikel 45 van de Algemene Wet Bijzondere Ziektekosten][ref3]. Onze Minister van Volksgezondheid, Welzijn en Sport
      stelt de bijdrage uiterlijk drie maanden na ontvangst van de jaarrekening vast.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel45
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '44'
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '45'
  - number: '90.5'
    text: |-
      Bij algemene maatregel van bestuur worden de bijdragen, bedoeld in het tweede lid, onderdeel g, nader aangeduid en
      worden regels gesteld over de wijze van betaalbaarstelling van deze bijdragen.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel90
  - number: '91.1'
    text: |-
      Het College zorgverzekeringen doet jaarlijks uitkeringen uit het Algemeen Fonds Bijzondere Ziektekosten ter dekking
      van de noodzakelijke uitgaven, gedaan voor de uitvoering van de in de [Algemene Wet Bijzondere Ziektekosten][ref1]
      geregelde verzekering, volgens bij of krachtens algemene maatregel van bestuur te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '91.2'
    text: |-
      De zorgautoriteit is bevoegd vast te stellen dat uitgaven niet verantwoord waren voorzover deze
      door hem niet noodzakelijk worden geacht voor de uitvoering van de verzekering op grond van de
      [Algemene Wet Bijzondere Ziektekosten][ref1]. Met de uitkeringen, bedoeld in het eerste lid, evenals met de
      daarmee verkregen opbrengsten worden geen uitgaven gedekt waarvan de zorgautoriteit heeft vastgesteld dat zij niet
      verantwoord waren, tenzij de zorgautoriteit anders besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '91.3'
    text: |-
      Op de uitkeringen, bedoeld in het eerste lid, kunnen voorschotten worden verleend overeenkomstig door het College
      zorgverzekeringen te stellen regels.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel91
  - number: '93'
    text: |-
      Het UWV beheert en administreert afzonderlijk de in [artikel 99][ref1] bedoelde middelen tot dekking van de
      uitgaven en de uitgaven, bedoeld in de [artikelen 100][ref2], [101][ref3] en [102][ref4], in de vorm van een
      Algemeen Werkloosheidsfonds dat deel uitmaakt van het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel101
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel102
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel93
