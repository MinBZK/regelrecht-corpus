  - number: '104.1'
    text: 'Ten laste van een sectorfonds komen:'
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
  - number: 104.1.a
    text: |-
      de op grond van de [Werkloosheidswet][ref1] over de eerste zes maanden vanaf de eerste werkloosheidsdag te
      betalen uitkering aan de werknemer, die in de kalenderweek onmiddellijk voorafgaande aan het intreden van zijn
      arbeidsurenverlies in de sector werkzaam is geweest waarvoor het sectorfonds is ingesteld, waarbij, voor de
      bepaling van de periode van zes maanden, perioden waarin de werknemer geen recht op uitkering heeft, buiten
      beschouwing worden gelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 104.1.b
    text: |-
      de op grond van [artikel 18 van de Werkloosheidswet][ref1] te betalen uitkeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
  - number: 104.1.c
    text: |-
      de op grond van [artikel 29, tweede lid, onderdeel a, b en c, van de Ziektewet][ref1] te betalen uitkeringen
      en de uitkeringen op grond van [artikel 29, tweede lid, onderdeel d, e, f en g][ref2] die direct aansluitend
      zijn toegekend op een uitkering op grond van [artikel 29, tweede lid, onderdeel a, b of c][ref3] of
      [artikel 70 van de Ziektewet][ref4], met uitzondering van de uitkeringen aan de personen, wier arbeidsverhouding op
      grond van [artikel 4, eerste lid, onderdeel i of j, van de Ziektewet][ref5] als dienstbetrekking wordt beschouwd;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel70
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel4
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
