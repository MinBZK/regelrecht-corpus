        artikel: 122c
        hoofdstuk: 7a
  - number: 122g
    text: |-
      [Artikel 52a][ref1] vervalt met ingang van 1 januari 2012, tenzij voor die datum een voorstel van wet bij de Tweede
      Kamer der Staten-Generaal is ingediend, dat een vergelijkbare regeling bevat voor arbeid in kleine banen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel52a
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel122g
