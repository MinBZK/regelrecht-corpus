        afdeling: '3'
  - number: '28.2'
    text: |-
      In afwijking van het eerste lid wordt met inachtneming van bij algemene maatregel van bestuur te stellen regels
      bij ministeriële regeling over een uitkering op grond van de [Werkloosheidswet][ref1], de [Ziektewet][ref2],
      de [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4],
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref5] aan de werknemer of gelijkgestelde, bedoeld
      in [artikel 3:6, eerste lid, van die wet][ref6], over een toeslag op grond van de [Toeslagenwet][ref7] en over loon
      op grond van een arbeidsovereenkomst als bedoeld in [hoofdstuk 2 van de Wet sociale werkvoorziening][ref8] voor het
      deel van de premie dat ten gunste komt van een sectorfonds een gemiddeld premiepercentage vastgesteld. Dit wordt
      bepaald op een gemiddelde van de percentages die zijn vastgesteld op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0004043
      [ref8]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel28
