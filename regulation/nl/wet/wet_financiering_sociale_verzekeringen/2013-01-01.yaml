      - id: ref9
        bwb_id: BWBR0004044
      - id: ref10
        bwb_id: BWBR0004163
      - id: ref11
        bwb_id: BWBR0002691
      - id: ref12
        bwb_id: BWBR0004045
        artikel: '6'
      - id: ref13
        bwb_id: BWBR0008657
  - number: 47.1.b
    text: die op het moment van in dienst treden bij die werkgever 50 jaar of ouder is.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel47
  - number: '47.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het eerste lid van overeenkomstige toepassing is bij een
      dienstbetrekking met een werknemer, die behoort tot een nader te bepalen categorie van personen, die onmiddellijk
      voorafgaand aan de aanvang van de dienstbetrekking recht hebben op een nabestaandenuitkering op grond van de
      [Algemene nabestaandenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: '47.3'
    text: |-
      De werkgever bewaart bij de loonadministratie een verklaring van het Uitvoeringsinstituut werknemersverzekeringen,
      de Sociale verzekeringsbank, het college van burgemeester en wethouders of een andere uitkeringsinstantie, dat de
      werknemer, bedoeld in het eerste of tweede lid, voorafgaande aan de datum van aanvang van dienstbetrekking recht
      had op een uitkering als bedoeld in het eerste lid, onderdeel a, of voldoet aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel47
  - number: '48'
    text: |-
      De korting, bedoeld in [artikel 47, eerste en tweede lid][ref1], bedraagt € 7000 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
  - number: '49.1'
    text: |-
      De werkgever past een korting toe op het totaal van de door hem op grond van de [afdelingen 2][ref1], [3][ref2]
      en [4][ref3] verschuldigde premies bij een dienstbetrekking met een werknemer, die onmiddellijk voorafgaand aan de
      aanvang van de dienstbetrekking:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        afdeling: '4'
  - number: 49.1.a
    text: |-
      recht heeft op een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 49.1.b
    text: |-
      recht heeft op een uitkering of op arbeidsondersteuning op grond van de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: 49.1.c
    text: |-
      een indicatiebeschikking als bedoeld in [artikel 11 van de Wet sociale werkvoorziening][ref1] heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel11
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '11'
  - number: 49.1.d
    text: |-
      naar het oordeel van het UWV een structurele functionele beperking heeft en voor wiens ondersteuning
      bij arbeidsinschakeling het college van burgemeester en wethouders, op die dag, op grond van
      [artikel 7, eerste lid, aanhef en onderdeel a, van de Wet werk en bijstand][ref1] verantwoordelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
  - number: 49.1.e
    text: |-
      de leeftijd van achttien jaar nog niet heeft bereikt en in verband met ziekte of gebrek een belemmering ondervindt
      of heeft ondervonden bij het volgen van onderwijs en binnen vijf jaar na afronding van dat onderwijs arbeid in
      dienstbetrekking gaat verrichten; of
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
  - number: 49.1.f
    text: |-
      geen werknemer is als bedoeld in onderdeel b, achttien jaar is of ouder en in verband met ziekte of gebrek een
      belemmering ondervindt of heeft ondervonden bij het volgen van onderwijs en binnen vijf jaar na afronding van dat
      onderwijs arbeid in dienstbetrekking gaat verrichten.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
  - number: '49.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot de werknemer, bedoeld in het eerste lid,
      onderdeel a, die zijn eigen arbeid geheel of gedeeltelijk heeft hervat of een andere functie bij dezelfde werkgever
      is gaan bekleden voor zolang de dienstbetrekking duurt doch ten hoogste gedurende een jaar nadat die werknemer zijn
      eigen arbeid geheel of gedeeltelijk heeft hervat of een andere functie bij dezelfde werkgever is gaan bekleden.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
  - number: '49.3'
    text: |-
      Ter uitvoering van het eerste lid, onderdeel d, wordt op verzoek van het college van burgemeester en wethouders,
      bedoeld in dat lid, de aanwezigheid van een structurele functionele beperking vastgesteld. Bij ministeriële
      regeling kunnen nadere regels worden gesteld voor het eerste lid, onderdeel d, en dit lid in ieder geval met
      betrekking tot de gegevens, die bij de aanvraag worden verstrekt en de kosten die voor de beoordeling van de
      aanvraag bij de aanvrager in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
  - number: '49.4'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot de werknemer van wie in een arbeidskundig
      onderzoek is vastgesteld dat hij op de eerste dag na afloop van de wachttijd, bedoeld in artikel 3.1
      van de Wet werk en inkomen naar arbeidsvermogen of van het tijdvak, bedoeld in [artikel 24][ref1] of
      [25, negende lid, van die wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 49.4.1°
    text: minder dan 35% arbeidsongeschikt is,
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
  - number: 49.4.2°
    text: |-
      op de eerste dag van dertien weken voorafgaand aan die dag geen dienstbetrekking had met een andere dan zijn eigen
      werkgever, tenzij de dienstbetrekking met die andere werkgever reeds bestond op de eerste dag van de wachttijd,
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
  - number: 49.4.3°
    text: niet in staat is tot het verrichten van eigen of andere passende arbeid bij de eigen werkgever, en
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
  - number: 49.4.4°
    text: binnen vijf jaar na die dag in dienstbetrekking werkzaamheden gaat verrichten bij een werkgever.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
  - number: '49.5'
    text: |-
      Bij ministeriële regeling kunnen voorwaarden worden gesteld met betrekking tot de toepassing van het eerste lid,
      aanhef en onderdeel d.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
  - number: '49.6'
    text: |-
      Het UWV verstrekt op verzoek van de werknemer of de persoon die verwacht een dienstbetrekking met een werkgever
      te zullen aangaan een verklaring of de aanvrager naar het oordeel van het UWV voldoet aan de voorwaarden voor
      toepassing van het eerste lid, onderdeel e of f.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
  - number: '49.7'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de gegevens, die de werkgever bij de loonadministratie
      bewaart waaruit blijkt dat de werknemer, bedoeld in het eerste lid, voorafgaande aan de datum van aanvang van de
      dienstbetrekking voldoet aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel49
  - number: '50'
    text: |-
      De korting, bedoeld in [artikel 49][ref1], bedraagt € 7000 per jaar, met dien verstande, dat de korting bij een
      dienstbetrekking met een werknemer als bedoeld in artikel 49, eerste lid, onderdeel b, waarbij [artikel 2:20][ref2]
      of [artikel 3:63 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref3] van toepassing is, € 3 500 per
      jaar bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '3'
  - number: 50a.1
    text: |-
      De [artikelen 47][ref1] en [49][ref2] zijn niet van toepassing, indien de werknemer arbeid verricht in een
      dienstbetrekking in de zin van [artikel 2 van de Wet sociale werkvoorziening][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0008903
        artikel: '2'
  - number: 50a.2
    text: |-
      [Artikel 47][ref1] is niet van toepassing bij een dienstbetrekking met een werknemer, indien de werkgever met
      betrekking tot een dienstbetrekking met diezelfde werknemer [artikel 49][ref2] kan toepassen dan wel heeft
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel49
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
  - number: 50b.1
    text: |-
      Het bedrag van de korting, bedoeld in [artikel 48][ref1] en [50][ref2], wordt naar evenredigheid verminderd, indien
      de met die werknemer overeengekomen gemiddelde arbeidsduur per week in het tijdvak waarover premie wordt betaald
      korter is dan de volledige arbeidsduur, die op 36 uur per week wordt gesteld en indien geen vaste arbeidsduur is
      overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel50
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel50b
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
  - number: 50b.2
    text: |-
      Voor een werknemer zonder vast overeengekomen arbeidsduur wordt de vermindering van het bedrag van de korting,
      bedoeld in [artikel 48][ref1] en [50][ref2], bepaald aan de hand van het aantal uren waarover de werkgever loon is
      verschuldigd in het tijdvak waarover premie wordt betaald herleid naar weken.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel50
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel50b
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
  - number: 50b.3
    text: |-
      Indien de toepassing van [artikel 48][ref1] en [50][ref2] ertoe zou leiden dat een negatieve premie wordt geheven,
      wordt de premie op nihil gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel50
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel50b
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
  - number: 50c.1
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën, worden met betrekking tot de
      premiekortingen regels gesteld over de toepassing van die kortingen bij onderbreking van het dienstverband dan wel
      opeenvolgende en verschillende dienstverbanden bij dezelfde werkgever of bij overgang van ondernemingen en voor het
      in dienst treden.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel50c
  - number: 50c.2
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën, kunnen regels worden gesteld
      ten behoeve van een goede uitvoering van [paragraaf 1 van deze afdeling][ref1], waaronder voor het berekenen van
      de evenredige vermindering en de samenloop van premiekortingen en premievrijstelling in het tijdvak waarover premie
      wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel50c
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
  - number: '51.1'
    text: |-
      Op aanvraag van een werkgever verleent de inspecteur, gehoord het UWV en in overeenstemming met het UWV, bij voor
      bezwaar vatbare beschikking vrijstelling van alle op grond van dit hoofdstuk verschuldigde premies ter zake van een
      dienstbetrekking met een uitkeringsgerechtigde indien:
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel51
  - number: 51.1.a
    text: de dienstbetrekking ten hoogste zes aaneengesloten weken duurt; en
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel51
  - number: 51.1.b
    text: de werkgever in het kalenderjaar niet eerder een dienstbetrekking met die uitkeringsgerechtigde is aangegaan; en
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel51
  - number: 51.1.c
    text: voor een dienstbetrekking van die uitkeringsgerechtigde in het kalenderjaar niet eerder vrijstelling is verleend.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel51
  - number: '51.2'
    text: |-
      Voor de toepassing van het eerste lid worden dienstbetrekkingen tussen de werkgever en de uitkeringsgerechtigde
      geacht eenzelfde niet onderbroken dienstbetrekking te zijn, indien die dienstbetrekkingen elkaar met tussenpozen
      van niet meer dan eenendertig dagen zijn opgevolgd.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel51
  - number: '51.3'
    text: |-
      Voor de toepassing van deze paragraaf wordt onder uitkeringsgerechtigde verstaan: degene wiens
      inkomen uit en in verband met arbeid in het bedrijfs- en beroepsleven onmiddellijk voorafgaande
      aan de aanvang van de in het eerste lid, aanhef, bedoelde dienstbetrekking uitsluitend bestaat
      uit een uitkering of inkomensvoorziening op grond van de [Wet werk en bijstand][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3],
      de [Werkloosheidswet][ref4], de [Wet werk en inkomen naar arbeidsvermogen][ref5], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7],
      de [Wet werk en arbeidsondersteuning jonggehandicapten][ref8], de [Wet inkomensvoorziening oudere werklozen][ref9]
      de [Toeslagenwet][ref10] of uit een uitkering op grond van vergelijkbare regelingen dan wel uit een combinatie van
      deze uitkeringen en die bij het UWV als werkzoekende is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0019057
      [ref6]: https://wetten.overheid.nl/BWBR0002524
      [ref7]: https://wetten.overheid.nl/BWBR0008656
      [ref8]: https://wetten.overheid.nl/BWBR0008657
      [ref9]: https://wetten.overheid.nl/BWBR0024394
      [ref10]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0019057
      - id: ref6
        bwb_id: BWBR0002524
      - id: ref7
        bwb_id: BWBR0008656
      - id: ref8
        bwb_id: BWBR0008657
      - id: ref9
        bwb_id: BWBR0024394
      - id: ref10
        bwb_id: BWBR0004043
  - number: '51.4'
    text: |-
      Het derde lid is van overeenkomstige toepassing op de persoon die recht op arbeidsondersteuning heeft op grond van
      de [Wet werk en arbeidsondersteuning jonggehandicapten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: '52.1'
    text: |-
      De werkgever vraagt de vrijstelling aan voor de afloop van de dienstbetrekking. De aanvraag wordt mede door de
      uitkeringsgerechtigde ondertekend.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel52
  - number: '52.2'
    text: |-
      De aanvraag bevat in ieder geval het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer
      van de uitkeringsgerechtigde.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel52
  - number: '53.1'
    text: |-
      Bij ministeriële regeling kunnen voor de Tabakverwerkende en Agrarische sector categorieën van werknemers worden
      aangewezen waarvoor de werkgever ter zake van een dienstbetrekking met een onder die categorie vallende werknemer
      de premievrijstelling, bedoeld in deze paragraaf, kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel53
  - number: '53.2'
    text: |-
      Voor aanwijzing komen in aanmerking categorieën van werknemers, die behalve uit de in het eerste lid bedoelde
      dienstbetrekking, bij aanvang van die dienstbetrekking niet zijn aangewezen op inkomen uit arbeid en geen
      uitkeringsgerechtigde zijn.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel53
  - number: '54.1'
    text: |-
      De inspecteur, gehoord het UWV en in overeenstemming met het UWV, verleent voor de Tabakverwerkende en Agrarische
      sector op aanvraag van een werkgever bij voor bezwaar vatbare beschikking vrijstelling van de verplichting tot het
      betalen van premies ter zake van een dienstbetrekking met een werknemer vallend onder een categorie als bedoeld in
      [artikel 53, eerste lid][ref1], die voldoet aan de vereisten, bedoeld in [artikel 51, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel51
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '51'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '6'
  - number: '54.2'
    text: |-
      De [artikelen 51][ref1] en [52][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel52
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '51'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '52'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '6'
  - number: '55'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën, kunnen nadere regels worden
      gesteld met betrekking tot de aanvragen, bedoeld in deze paragraaf, en ten behoeve van een goede uitvoering van
      deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel55
  - number: '56.1'
    text: |-
      De premies, bedoeld in [artikel 34][ref1], zijn niet verschuldigd over het loon van personen voorzover zij
      werknemer zijn op grond van [artikel 4, eerste lid, onderdeel i of j, van de Ziektewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel4
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '4'
  - number: '56.2'
    text: |-
      De uitkeringen op grond van de [Ziektewet][ref1] en de [Wet werk en inkomen naar arbeidsvermogen][ref2] uit hoofde
      van een dienstbetrekking als bedoeld in [artikel 4, eerste lid, onderdelen i en j, van de Ziektewet][ref3], de
      daaraan verbonden uitvoeringskosten alsmede de op grond van enige wet over die uitkeringen verschuldigde premies
      en de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref4] die niet op die uitkeringen in mindering
      kunnen worden gebracht, komen ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '56.3'
    text: |-
      Ten laste van het Rijk komen voorts de kosten die rechtstreeks verband houden met de uitvoering van
      [artikel 30a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] ten aanzien van een betrokkene,
      indien deze ten tijde van het aanvangen van de werkzaamheden van het re-integratiebedrijf, bedoeld in het achtste
      lid van dat artikel, een uitkering als bedoeld in het tweede lid ontvangt ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
  - number: '57'
    text: De rijksbelastingdienst heft de premie voor de volksverzekeringen en de premies voor de werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel57
  - number: '58.1'
    text: |-
      De premie voor de volksverzekeringen wordt, onverminderd het tweede lid en onder verrekening van de krachtens
      dat lid geheven premie, bij wege van aanslag geheven met overeenkomstige toepassing van de voor de heffing van de
      inkomstenbelasting geldende regels, met uitzondering van [artikel 3.154 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '58.2'
    text: |-
      Voorzover de premieplichtige van een inhoudingsplichtige loon geniet in de zin van de
      [Wet op de loonbelasting 1964][ref1], wordt de premie voor de volksverzekeringen bij wijze van inhouding geheven
      met overeenkomstige toepassing van de voor de heffing van de loonbelasting geldende regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: '58.3'
    text: |-
      Voorzover de premieplichtige aan de loonbelasting is onderworpen op grond van
      [artikel 5a van de Wet op de loonbelasting 1964][ref1] is het tweede lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5a
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5a
  - number: '59.1'
    text: |-
      De premies voor de werknemersverzekeringen worden geheven met overeenkomstige toepassing van de voor de heffing
      van de loonbelasting geldende regels. [Artikel 32d van de Wet op de loonbelasting 1964][ref1] is slechts van
      overeenkomstige toepassing indien degene aan wie het loon wordt afgestaan, werkgever van de werknemer is.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32d
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32d
  - number: '59.2'
    text: |-
      In de uitnodiging tot het doen van aangifte, bedoeld in
      [artikel 7, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1], kan mede opgave worden
      verlangd van gegevens die noodzakelijk zijn ten behoeve van de vaststelling van de premiepercentages,
      bedoeld in de [artikelen 27][ref2], [28][ref3], [31][ref4], [36][ref5] en [38][ref6], alsmede
      ten behoeve van de doelen van de gegevensverwerking in de polisadministratie, bedoeld in
      [artikel 33, tweede lid, onderdelen a en e, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref7],
      waarbij met betrekking tot die verlangde gegevens de regels die gelden voor de heffing van de loonbelasting van
      overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel31
      [ref5]: https://wetten.overheid.nl/BWBR0017745#Artikel36
      [ref6]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref7]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0017745
        artikel: '31'
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0017745
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref6
        bwb_id: BWBR0017745
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref7
        bwb_id: BWBR0013060
        artikel: '33'
  - number: '59.3'
    text: |-
      Een aanvraag tot het geven van een beschikking over het verzekerd zijn op grond van de werknemersverzekeringen kan
      door de werkgever uitsluitend bij de inspecteur worden ingediend. De inspecteur beslist bij voor bezwaar vatbare
      beschikking.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel59
  - number: '59.4'
    text: |-
      Op het beroep van de werkgever tegen de uitspraak op bezwaar van de inspecteur op grond van de [artikelen 95][ref1]
      of [97][ref2] is [hoofdstuk V, afdeling 2, van de Algemene wet inzake rijksbelastingen][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '95'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '97'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0002320
        afdeling: '2'
  - number: '59.5'
    text: |-
      De inspecteur stelt de werkgever zonodig op de hoogte van de door het UWV op aanvraag van de werknemer genomen
      beschikking over het verzekerd zijn op grond van de werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel59
  - number: '59.6'
    text: |-
      Indien in verband met een gevraagde beschikking informatie is gevraagd aan een persoon of
      instantie buiten Nederland en om die reden de beschikking niet binnen de termijn, bedoeld in
      [afdeling 4.1.3 van Algemene wet bestuursrecht][ref1], gegeven kan worden, wordt die termijn verlengd met ten
      hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.3
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.3
  - number: '59.7'
    text: |-
      In afwijking van de [artikelen 25][ref1], [30][ref2] en [34, eerste lid][ref3], en met overeenkomstige toepassing
      van [artikel 13bis, zestiende en twintigste lid, van de Wet op de loonbelasting 1964][ref4], is de premie door
      de werknemer verschuldigd in de gevallen, bedoeld in artikel 13bis, zestiende en twintigste lid, van de Wet op de
      loonbelasting 1964.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '30'
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 13bis
  - number: '59.8'
    text: |-
      Het zesde lid is van overeenkomstige toepassing op een aanvraag als bedoeld in het derde lid en op een aanvraag of
      melding op grond van de [artikelen 40][ref1], [95][ref2] of [97][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel97
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '95'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '97'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: '60.1'
    text: |-
      De rijksbelastingdienst vordert de premie voor de volksverzekeringen en de premies voor de werknemersverzekeringen
      in.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel60
  - number: '60.2'
    text: |-
      Bij de invordering van de premie voor de volksverzekeringen zijn, naar gelang
      [artikel 58, eerste lid, dan wel tweede lid][ref1] van toepassing is, de regels geldende voor de invordering van de
      inkomstenbelasting onderscheidenlijk de loonbelasting van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel58
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '60.3'
    text: |-
      Bij de invordering van de premies voor de werknemersverzekeringen zijn de regels geldende voor de invordering van
      de loonbelasting, met uitzondering van [artikel 38, eerste lid, onderdeel a, van de Invorderingswet 1990][ref1],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel38
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '38'
  - number: '61.1'
    text: |-
      Indien een premieplichtige heeft nagelaten over een bepaald jaar de op aanslag verschuldigde premie
      voor de volksverzekeringen te betalen, beslist de SVB dat sprake is van schuldig nalaten als bedoeld in
      [artikel 13 van de Algemene Ouderdomswet][ref1], behoudens voorzover de premieplichtige aantoont dat er
      omstandigheden aanwezig zijn op grond waarvan het niet betalen van de premie hem niet toegerekend kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel13
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '13'
  - number: '61.2'
    text: 'Een beslissing als bedoeld in het eerste lid wordt in elk geval genomen indien:'
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel61
  - number: 61.2.a
    text: |-
      de aanslag voor de premie voor de volksverzekeringen ambtshalve is vastgesteld omdat de premieplichtige geen of
      onvoldoende medewerking heeft verleend bij het vaststellen van het premie-inkomen;
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel61
  - number: 61.2.b
    text: |-
      de premie voor de volksverzekeringen niet of niet geheel kan worden ingevorderd omdat is nagelaten te voldoen
      aan de krachtens de [artikelen 65, eerste tot en met derde en vijfde tot en met zevende lid][ref1], [66][ref2] en
      [68 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref3] geldende verplichtingen; of


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel68
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '66'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '68'
  - number: 61.2.c
    text: |-
      de premieplichtige de bekendmaking van de beslissing op grond van het eerste lid
      bemoeilijkt of onmogelijk maakt omdat is nagelaten te voldoen aan de krachtens de
      [artikelen 65, eerste tot en met derde en vijfde tot en met zevende lid][ref1], [66][ref2] en
      [68 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref3] geldende verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel68
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '66'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '68'
  - number: '61.3'
    text: |-
      Nadat de betalingen op een belastingaanslag zijn toegerekend overeenkomstig
      [artikel 7, tweede lid, van de Invorderingswet 1990][ref1] en alvorens de SVB beslist dat de premieplichtige
      schuldig nalatig is als bedoeld in het eerste lid wordt het door de premieplichtige reeds betaalde deel van de op
      aanslag verschuldigde premie voor de volksverzekeringen in een bepaald jaar achtereenvolgens toegerekend aan:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel7
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '7'
  - number: 61.3.a
    text: |-
      de premie, verschuldigd gebleven voor de algemene verzekering bijzondere ziektekosten en de
      nabestaandenverzekering;
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel61
  - number: 61.3.b
    text: |-
      de premie, verschuldigd gebleven voor de algemene ouderdomsverzekering, waarbij de betaling eerst wordt toegerekend
      aan het oudste tijdvak.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel61
  - number: '61.4'
    text: |-
      Indien de premieplichtige ten aanzien van wie een beslissing als bedoeld in het eerste lid is genomen binnen vijf
      jaren na de dagtekening van de aanslag het op aanslag verschuldigde bedrag alsnog geheel of gedeeltelijk betaalt,
      is hij een opslag verschuldigd van 5% op de verschuldigd gebleven premie voor de algemene ouderdomsverzekering.
      Indien een beslissing als bedoeld in het eerste lid meer dan vier jaren en achtenveertig weken na de dagtekening
      van de aanslag wordt genomen, wordt de termijn van vijf jaren verlengd tot vier weken na de datum van die
      beslissing.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel61
  - number: '61.5'
    text: |-
      Ingeval van een gehele of gedeeltelijke betaling van het op aanslag verschuldigde bedrag,
      bedoeld in het vierde lid, worden, nadat deze betalingen zijn toegerekend overeenkomstig
      [artikel 7, tweede lid, van de Invorderingswet 1990][ref1], de premies volksverzekeringen toegerekend aan:


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel7
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '7'
  - number: 61.5.a
    text: |-
      de premie, verschuldigd gebleven voor de algemene verzekering bijzondere ziektekosten en de
      nabestaandenverzekering;
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel61
  - number: 61.5.b
    text: de opslag, bedoeld in het vierde lid;
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel61
  - number: 61.5.c
    text: |-
      de premie, verschuldigd gebleven voor de algemene ouderdomsverzekering, waarbij de betaling eerst wordt toegerekend
      aan het oudste tijdvak of de oudste tijdvakken binnen de termijn van vijf jaren, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel61
  - number: '61.6'
    text: |-
      In geval van gehele of gedeeltelijke toerekening van een betaling als bedoeld in het vierde lid aan de premie
      verschuldigd gebleven voor de algemene ouderdomsverzekering, wordt de beslissing op grond van het eerste lid in
      zoverre gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel61
  - number: '61.7'
    text: |-
      De SVB registreert de schuldige nalatigheid van de premieplichtige. Indien bij de SVB ten tijde van de registratie
      geen actueel adres van de premieplichtige bekend is, gaat de termijn van vier weken, genoemd in het vierde lid, in
      op de datum van registratie.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel61
  - number: '62'
    text: |-
      Het beroep tegen een beslissing van de SVB op grond van [artikel 61][ref1] kan niet zijn gegrond op de stelling
      dat de aanslag ten onrechte of tot een te hoog bedrag is vastgesteld. Het beroep kan slechts dan zijn gegrond op
      de stelling dat de aanslag niet is ontvangen, indien de belanghebbende aannemelijk kan maken dat hij de aanslag
      nimmer ontvangen heeft en dat er geen omstandigheden zijn op grond waarvan het niet ontvangen van de aanslag hem
      kan worden toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel61
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '63'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën en Onze Minister van
      Volksgezondheid, Welzijn en Sport, kunnen nadere regels worden gesteld met betrekking tot dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel63
  - number: '64.1'
    text: |-
      De SVB kan op verzoek wegens gemoedsbezwaren tegen één of meer volksverzekeringen of alle werknemersverzekeringen
      ontheffen van de verplichtingen opgelegd op grond van de desbetreffende wetten en deze wet:
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel64
  - number: 64.1.a
    text: de persoon, die deze gemoedsbezwaren heeft;
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel64
  - number: 64.1.b
    text: de rechtspersoon, waarbij natuurlijke personen zijn betrokken die deze gemoedsbezwaren hebben.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel64
  - number: '64.2'
    text: De SVB doet de inspecteur mededeling omtrent de ontheffing of intrekking van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel64
  - number: '64.3'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op verzoeken aan de SVB met
      betrekking tot het verlenen van een ontheffing als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '65.1'
    text: |-
      Indien een ontheffing is verleend in het kader van één of meer volksverzekeringen, wordt voor geen van
      de volksverzekeringen premie geheven, doch vindt voor al die verzekeringen heffing van premievervangende
      inkomstenbelasting of premievervangende loonbelasting plaats overeenkomstig [artikel 58][ref1] tot het bedrag van
      de verschuldigde premie als bedoeld in [artikel 9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel9
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: '65.2'
    text: |-
      Indien een werkgever ontheffing is verleend in het kader van de werknemersverzekeringen wordt premievervangende
      loonbelasting geheven overeenkomstig [artikel 59][ref1] tot het bedrag aan premies dat hij met toepassing van
      [hoofdstuk 3][ref2] zou hebben afgedragen, indien hem geen ontheffing zou zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017745
        hoofdstuk: '3'
  - number: '65.3'
    text: |-
      Voor de toepassing van deze wet, de [Wet inkomstenbelasting 2001][ref1], de [Wet op de loonbelasting 1964][ref2]
      en de [Invorderingswet 1990][ref3] wordt de premievervangende belasting beschouwd als premie voor de
      volksverzekeringen dan wel voor de werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002471
      [ref3]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002471
      - id: ref3
        bwb_id: BWBR0004770
  - number: '66'
    text: |-
      Ten laste van het Rijk komen de bedragen aan premie voor de volksverzekeringen en de werknemersverzekeringen die
      wegens een ontheffing niet zijn geheven overeenkomstig [artikel 65][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel65
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '65'
        hoofdstuk: '5'
  - number: '67'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën en Onze Minister van
      Volksgezondheid, Welzijn en Sport, worden regels gesteld ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel67
  - number: 67.a
    text: de voorwaarden, waaronder een ontheffing wordt verleend;
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel67
  - number: 67.b
    text: de verdere gevolgen die aan een ontheffing worden verbonden;
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel67
  - number: 67.c
    text: de gevallen, waarin een ontheffing wordt ingetrokken en de gevolgen die aan die intrekking worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel67
  - number: '68'
    text: |-
      De financiële middelen tot dekking van de uitgaven voor de vrijwillige volksverzekeringen worden verkregen door het
      heffen van premie.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel68
  - number: '69'
    text: 'Voor de toepassing van deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel69
  - number: 69.a
    text: |-
      vrijwillige algemene ouderdomsverzekering: de verzekering, bedoeld in
      [hoofdstuk IV van de Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002221
        hoofdstuk: IV
  - number: 69.b
    text: |-
      vrijwillige nabestaandenverzekering: de verzekering, bedoeld in [hoofdstuk 5 van de Algemene nabestaandenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0007795
        hoofdstuk: '5'
  - number: '70.1'
    text: |-
      De verschuldigde premie voor de vrijwillige algemene ouderdomsverzekering of de vrijwillige nabestaandenverzekering
      wordt in rekening gebracht en geïnd door de SVB op de wijze en het tijdstip aangegeven door de SVB.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel70
  - number: '70.2'
    text: |-
      Een schuld aan premie voor een vrijwillige verzekering valt buiten de nalatenschap van degene, die tot die
      verzekering was toegelaten. De schuld wordt betaald door degene, die krachtens de betrokken vrijwillige verzekering
      prestaties ontvangt.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel70
  - number: '71.1'
    text: |-
      Degene die is toegelaten tot de vrijwillige algemene ouderdomsverzekering of de vrijwillige
      nabestaandenverzekering, is voor die verzekeringen een premie verschuldigd volgens bij of krachtens algemene
      maatregel van bestuur te bepalen tarief.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel71
  - number: '71.2'
    text: |-
      De voordracht voor een op grond van het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel71
  - number: '72'
    text: |-
      De financiële middelen tot dekking van de uitgaven voor de vrijwillige werknemersverzekeringen worden verkregen
      door het heffen van premie.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel72
  - number: '73.1'
    text: |-
      De premies voor de vrijwillige werknemersverzekeringen worden in rekening gebracht en geïnd door het UWV op de
      wijze en het tijdstip, aangegeven door dat instituut.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel73
  - number: '73.2'
    text: Het UWV kan nadere regels stellen met betrekking tot de premie.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel73
  - number: '73.3'
    text: De door het UWV op grond van het tweede lid gestelde regels behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel73
  - number: '74.1'
    text: |-
      De premie voor de vrijwillige verzekering op grond van de [Werkloosheidswet][ref1] wordt berekend over het dagloon,
      bedoeld in [artikel 58, eerste lid, van de Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel58
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '58'
  - number: '74.2'
    text: |-
      De premie bedraagt een door het UWV te bepalen percentage van het in het eerste lid bedoelde dagloon, met
      dien verstande dat de premie niet meer bedraagt dan het deel van de premie, bedoeld in [artikel 27][ref1],
      dat ten gunste komt van het Algemeen Werkloosheidsfonds, vermeerderd met de premie, bedoeld in
      [artikel 28, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel28
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
  - number: '75.1'
    text: |-
      De premie voor de vrijwillige verzekering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt berekend over het dagloon, bedoeld in
      [artikel 84, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel84
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '84'
  - number: '75.2'
    text: |-
      De premie bedraagt een door het UWV te bepalen percentage van het in het eerste lid bedoelde dagloon, met dien
      verstande dat de premie niet meer bedraagt dan de in [artikel 36][ref1] bedoelde basispremie.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel36
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: '76.1'
    text: |-
      De premie voor de vrijwillige verzekering op grond van de [Ziektewet][ref1] wordt berekend over het dagloon,
      bedoeld in [artikel 68, eerste lid, van de Ziektewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel68
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '68'
  - number: '76.2'
    text: De premie bedraagt een door het UWV te bepalen percentage van het in het eerste lid bedoelde dagloon.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel76
  - number: 76a.1
    text: |-
      De premie voor de vrijwillige verzekering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref1] wordt berekend over het dagloon, bedoeld in
      [artikel 21, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel21
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '21'
  - number: 76a.2
    text: |-
      De premie bedraagt een door het UWV te bepalen percentage van het in het eerste lid bedoelde dagloon, met dien
      verstande dat de premie niet meer bedraagt dan de in [artikel 36][ref1] bedoelde basispremie, vermeerderd met
      een premieopslag die wordt berekend op grond van het in [artikel 38, eerste lid, onderdeel a][ref2], bedoelde
      percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: '77'
    text: |-
      Degene die is toegelaten tot een vrijwillige verzekering, is verplicht aan de SVB of het UWV onverwijld uit eigen
      beweging mededeling te doen van alle feiten en omstandigheden waarvan het hem redelijkerwijs duidelijk is, dat zij
      van invloed zijn op de hoogte van de verschuldigde premie.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel77
  - number: '79'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist de SVB of het UWV
      binnen dertien weken gerekend vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is
      verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '80'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      vaststelling, de inning en de betaling van de premie voor een vrijwillige verzekering.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel80
  - number: '81'
    text: |-
      Bij regeling van Onze Minister en Onze Ministers van Financiën en van Volksgezondheid, Welzijn en Sport
      worden regels gesteld met betrekking tot de afdracht van de premie voor de volksverzekeringen en de premies
      voor de werknemersverzekeringen alsmede van de daarmee verband houdende bestuurlijke boeten en renten door de
      rijksbelastingdienst aan de fondsen en de wijze van toerekening van die premies, boeten en renten aan de fondsen.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel81
  - number: '82.1'
    text: |-
      De SVB beheert en administreert afzonderlijk de middelen tot dekking van de uitgaven, bedoeld in
      [artikel 83, tweede lid][ref1], in de vorm van een Ouderdomsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel83
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '83'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '2'
  - number: '82.2'
    text: |-
      De SVB beheert en administreert afzonderlijk de middelen tot dekking van de uitgaven, bedoeld in
      [artikel 85, tweede lid][ref1], in de vorm van een Nabestaandenfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel85
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '85'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '2'
  - number: '82.3'
    text: Het Ouderdomsfonds en het Nabestaandenfonds maken deel uit van de SVB.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel82
  - number: '83.1'
    text: 'Ten gunste van het Ouderdomsfonds komen:'
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel83
  - number: 83.1.a
    text: de premies voor de algemene ouderdomsverzekering en voor de vrijwillige algemene ouderdomsverzekering;
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel83
  - number: 83.1.b
    text: |-
      rijksbijdragen als bedoeld in [artikel 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel14
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '14'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 83.1.c
    text: |-
      de opslag, bedoeld in [artikel 61, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel61
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 83.1.d
    text: |-
      de bestuurlijke boeten, bedoeld in [artikel 17c van de Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17c
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 17c
  - number: 83.1.e
    text: |-
      de bijdrage in de kosten van de heffingskortingen, bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel15
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '83.2'
    text: 'Uit het Ouderdomsfonds worden betaald:'
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel83
  - number: 83.2.a
    text: de lasten van de algemene ouderdomsverzekering en van de vrijwillige algemene ouderdomsverzekering;
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel83
  - number: 83.2.b
    text: |-
      de lasten van de regeling, vervat in [hoofdstuk VIII van de Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002221
        hoofdstuk: VIII
  - number: 83.2.d
    text: |-
      de bijdrage, bedoeld in [artikel 87a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel87a
