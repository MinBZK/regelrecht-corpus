  - number: 122a.3
    text: |-
      Ten aanzien van de werkgever wiens werknemer na de dag van inwerkingtreding van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref1] en voor de dag
      van inwerkingtreding van [artikel 1.5, onderdeel V, van die wet][ref2], recht krijgt op een uitkering op grond van
      de [Wet werk en inkomen naar arbeidsvermogen][ref3], wordt voor:


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019058
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0019057
  - number: 122a.3.a
    text: |-
      de zinsnede «vanaf de aanvang van de dienstbetrekking» in [artikel 49, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel49
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
  - number: 122a.3.b
    text: |-
      de zinsnede «nadat die werknemer zijn eigen arbeid of een andere functie bij dezelfde werkgever geheel of
      gedeeltelijk heeft hervat» in het tweede lid en in [artikel 49, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel49
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
  - number: 122a.4
    text: |-
      Dit artikel is niet van toepassing indien de werknemer werkzaam is in een dienstbetrekking in de zin van
      [artikel 2 van de Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
  - number: 122c.1
    text: |-
      [Artikel 47, aanhef en onderdeel b][ref1], zoals [dat artikel][ref2] luidde op de dag voorafgaand aan de
      inwerkingtreding van de wet van 29 december 2008 tot wijziging van de Wet financiering sociale verzekeringen en
      enige andere sociale verzekeringswetten in verband met de invoering van een premiekorting voor het in dienst nemen
      van uitkeringsgerechtigden van 50 jaar en ouder en het in dienst houden van werknemers van 62 jaar en ouder (Stb.
      598), blijft van toepassing voor zover de betreffende premievrijstelling op die dag werd toegepast voor het in
      dienst hebben van werknemers van 54,5 jaar en ouder, tot die werknemers de leeftijd van 62 jaar hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel47
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel122c
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
      - id: ref2
