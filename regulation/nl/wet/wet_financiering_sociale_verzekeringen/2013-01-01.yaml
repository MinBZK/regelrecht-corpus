        artikel: '4'
  - number: 104.1.d
    text: |-
      de door het UWV te betalen WGA-uitkeringen aan een werknemer die uit de dienstbetrekking waaruit de WGA-uitkering
      is ontstaan, recht had op een uitkering als bedoeld in onderdeel c dan wel van dit recht was uitgesloten op
      grond van [artikel 19a][ref1] of [artikel 19b van de Ziektewet][ref2], gedurende de periode die op grond van
      [artikel 82, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref3], geldt op de dag waarop het recht
      op een uitkering op grond van [die wet][ref4] is ontstaan, te rekenen vanaf de laatstgenoemde dag;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel19b
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel82
      [ref4]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
    references:
