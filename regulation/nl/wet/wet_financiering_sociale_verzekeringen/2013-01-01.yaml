        artikel: 39a
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '629'
  - number: 104.1.k
    text: |-
      de kosten die in verband met de uitvoering van
      [artikel 30a, eerste lid, onderdeel b, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], ten
      aanzien van personen, die een uitkering ontvangen als bedoeld in onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
  - number: '104.2'
    text: |-
      Het UWV is bevoegd in bijzondere gevallen voor de toepassing van het eerste lid, onderdeel a, werkzaamheden in de
      ene sector gelijk te stellen met werkzaamheden in een andere sector.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
  - number: '104.3'
    text: |-
      [Artikel 21 van de Werkloosheidswet][ref1] is met betrekking tot de in het eerste lid, onderdeel a, bedoelde
      periode waarover de uitkering ten laste van een sectorfonds komt, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel21
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '21'
  - number: '104.4'
    text: |-
      Het UWV brengt hetgeen ten laste van het sectorfonds komt, ten laste van het Algemeen Werkloosheidsfonds voor
      zoveel dit meer bedraagt dan het voor het sectorfonds op grond van [artikel 105, eerste lid][ref1], vastgestelde
      maximum, met dien verstande, dat het UWV ten laste van het Arbeidsongeschiktheidsfonds brengt, voor zoveel dit
      uitkeringen, bedoeld in [artikel 104, eerste lid, onderdeel d][ref2], betreft die meer bedragen dan dit maximum.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel104
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '105'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '104'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: '104.5'
    text: 'Ten laste van het sectorfonds komen voorts:'
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
  - number: 104.5.a
    text: |-
      de kosten die rechtstreeks verband houden met de uitvoering van
      [artikel 30a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] ten aanzien van een betrokkene,
      indien deze ten tijde van het aanvangen van de werkzaamheden van het re-integratiebedrijf, bedoeld in het
      [achtste lid van dat artikel][ref2], een uitkering als bedoeld in het eerste lid, onderdeel d, ontvangt; en


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
  - number: 104.5.b
    text: |-
      de loonkostensubsidie, bedoeld in [artikel 37a van de Wet werk en inkomen naar arbeidsvermogen][ref1] zoals dat
      luidde op 31 december 2011, indien de uitkeringsgerechtigde, met wie de werkgever aan wie de loonkostensubsidie
      wordt verstrekt een dienstbetrekking aangaat of is aangegaan, op de dag voorafgaand aan die dienstbetrekking recht
      heeft op een uitkering als bedoeld in het eerste lid, onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel37a
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: 37a
  - number: '104.6'
    text: |-
      In afwijking van het eerste lid, onderdelen c, e en f, komen de uitkeringen, die worden betaald door
      een eigenrisicodrager als bedoeld in [artikel 40, eerste lid, onderdeel a][ref1], of een werkgever die
      een onderneming verkrijgt als bedoeld in [artikel 63b, derde lid, van de Ziektewet][ref2], en de door
      hem gemaakte kosten ter zake van de betaling van die uitkeringen en van de werkzaamheden, bedoeld in
      [artikel 63a, eerste lid, van die wet][ref3], alsmede de op grond van enige wet over die uitkeringen verschuldigde
      premies of vergoedingen als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref4] die niet op die uitkeringen in
      mindering kunnen worden gebracht, niet ten laste van een sectorfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel63b
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 63b
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 63a
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '104.7'
    text: |-
      In afwijking van het eerste lid, onderdeel a, komen de uitkeringen op grond van de [Werkloosheidswet][ref1] die
      worden betaald gedurende de eerste dertien weken van ongeschiktheid van de werknemer tot het verrichten van zijn
      arbeid wegens ziekte, niet ten laste van een sectorfonds. [Artikel 20, zevende lid, van de Werkloosheidswet][ref2]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel20
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '20'
  - number: '104.8'
    text: |-
      Voor de bepaling van de periode van zes maanden, bedoeld in het eerste lid, onderdeel a, worden perioden waarin de
      werknemer uitkering ontvangt als bedoeld in het zevende lid, buiten aanmerking gelaten.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel104
  - number: '105.1'
    text: |-
      Het UWV stelt elk jaar voor elk sectorfonds afzonderlijk een maximum vast dat in een kalenderjaar op grond van
      [artikel 104][ref1] ten laste van dat sectorfonds komt.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '104'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: '105.2'
    text: 'Bij de vaststelling van het maximum, bedoeld in het eerste lid, blijven buiten beschouwing:'
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel105
  - number: 105.2.a
    text: |-
      de bedragen die ten laste van een sectorfonds komen op grond van [artikel 104, eerste lid, c, d en i][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '104'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: 105.2.b
    text: |-
      de lasten die op grond van [artikel 104, vierde lid][ref1], bij het UWV ten laste van het Algemeen
      Werkloosheidsfonds of het Arbeidsongeschiktheidsfonds in rekening worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '104'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: '105.4'
    text: |-
      Indien een of meer werkgevers eigenrisicodrager zijn als bedoeld in
      [artikel 40, eerste lid, onderdeel a of c][ref1], kan Onze Minister het deel van de premie dat ten
      gunste komt van het desbetreffende sectorfonds maximeren, voorzover dat deel betrekking heeft op de
      uitkeringen, bedoeld in [artikel 104, eerste lid, onderdeel c][ref2], respectievelijk artikel 104, eerste
      lid, onderdeel d, alsmede de uitvoeringskosten met betrekking tot die uitkeringen en de op grond van
      enige wet over die uitkeringen verschuldigde premies en de inkomensafhankelijke bijdrage, bedoeld in
      [artikel 42 van de Zorgverzekeringswet][ref3], die niet op die uitkeringen in mindering kunnen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel104
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel42
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '104'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '42'
  - number: '105.5'
    text: |-
      Het door het UWV vastgestelde maximum, bedoeld in het eerste en derde lid, behoeft de goedkeuring van Onze
      Minister. Indien Onze Minister zijn goedkeuring onthoudt aan het door het UWV vastgestelde maximum, stelt hij dat
      zelf vast.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel105
  - number: '106'
    text: |-
      Het UWV beheert en administreert afzonderlijk de in [artikel 107][ref1] bedoelde middelen tot dekking van de
      uitgaven en de uitgaven, bedoeld in de [artikelen 108][ref2], [109][ref3] en [110][ref4] in de vorm van een
      Uitvoeringsfonds voor de overheid dat deel uitmaakt van het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel108
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel109
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel110
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '107'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '108'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '109'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0017745
        artikel: '110'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: '107'
    text: 'Ten gunste van het Uitvoeringsfonds voor de overheid komen:'
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel107
