      [ref10]: https://wetten.overheid.nl/BWBR0004163
      [ref11]: https://wetten.overheid.nl/BWBR0002691
      [ref12]: https://wetten.overheid.nl/BWBR0004045#Artikel6
      [ref13]: https://wetten.overheid.nl/BWBR0008657
