  - number: 38a.2
    text: |-
      Behalve voor degene die loon ontvangt uit een dienstbetrekking op grond van de [Wet sociale werkvoorziening][ref1]
      wordt het eerste lid niet toegepast ingeval het UWV de uitkering, vermeerderd met de daarover door de werkgever
      verschuldigde premies en de inkomensafhankelijke bijdrage, bedoeld in [artikel 42 van de Zorgverzekeringswet][ref2],
      betaalt aan de werkgever, bedoeld in [artikel 11 van de Wet werk en inkomen naar arbeidsvermogen][ref3] en in
      [artikel 9][ref4], [10][ref5] of [12 van de Werkloosheidswet][ref6] en de [Ziektewet][ref7], onafhankelijk van het
      voortbestaan van de dienstbetrekking met die werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0004045#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0008903
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '9'
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '10'
      - id: ref6
        bwb_id: BWBR0004045
        artikel: '12'
      - id: ref7
        bwb_id: BWBR0001888
  - number: '39'
    text: |-
      Onze Minister kan bedragen vaststellen die jaarlijks of in het desbetreffende jaar als rijksbijdrage als bedoeld in
      [artikel 114, onderdeel f][ref1], ten gunste komen van het Arbeidsongeschiktheidsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel114
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '114'
        hoofdstuk: '7'
        paragraaf: '2'
        afdeling: '3'
  - number: '40.1'
    text: |-
      De inspecteur verleent overeenkomstig deze afdeling aan een werkgever op aanvraag bij voor bezwaar vatbare
      beschikking toestemming om zelf het risico te dragen van betaling van:
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
  - number: 40.1.a
    text: |-
      het ziekengeld aan de personen, bedoeld in [artikel 29, tweede lid, onderdelen a, b en c, van de Ziektewet][ref1],
      die laatstelijk tot de werkgever in dienstbetrekking stonden; of


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 40.1.b
    text: |-
      WGA uitkering overeenkomstig [hoofdstuk 9 van de Wet werk en inkomen naar arbeidsvermogen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '9'
  - number: '40.2'
    text: |-
      De werkgever legt bij een aanvraag als bedoeld in het eerste lid, onderdeel b, een schriftelijke garantie over
      waaruit blijkt dat een bank of een verzekeraar zich jegens het UWV verplicht, op het eerste verzoek van het UWV
      waarbij het UWV schriftelijk meedeelt dat de verplichtingen die voortvloeien uit het zelf dragen van het risico
      niet worden nagekomen, die verplichtingen na te komen.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
  - number: '40.3'
    text: |-
      De overheidswerkgever, bedoeld in
      [artikel 1, onderdeel k, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1], voorzover deze door
      Onze Minister in overeenstemming met Onze Minister van Financiën is aangewezen, is ontheven van de verplichting tot
      het overleggen van een schriftelijke garantie als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009267#Artikel1
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0009267
        artikel: '1'
  - number: '40.4'
    text: |-
      De in het eerste lid bedoelde toestemming wordt niet verleend gedurende drie jaren nadat het door de werkgever zelf
      dragen van het desbetreffende in het eerste lid bedoelde risico is beëindigd.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
  - number: '40.5'
    text: |-
      Onder een bank als bedoeld in het tweede lid wordt verstaan een financiële onderneming die ingevolge de
      [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van bank mag uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '40.6'
    text: |-
      Onder een verzekeraar als bedoeld in het tweede lid wordt verstaan een financiële onderneming die ingevolge de
      [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van levensverzekeraar of schadeverzekeraar mag
      uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '40.7'
    text: |-
      De garantie, bedoeld in het tweede lid, wordt voor onbepaalde tijd gegeven. Deze garantie strekt zich uit tot
      rechtsopvolgers onder algemene titel van de eigenrisicodrager en tot het risico dat overgaat op de verkrijgende
      werkgever, bedoeld in [artikel 84, derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1]. Deze
      garantie kan door de desbetreffende bank of verzekeraar niet worden beëindigd zonder schriftelijke opzegging bij
      de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel84
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '84'
  - number: '40.8'
    text: |-
      De garantie, bedoeld in het tweede lid, strekt zich niet uit tot een WGA-uitkering ter
      zake van ongeschiktheid tot werken die is ontstaan door een omstandigheid als bedoeld in
      [artikel 3:38 van de Wet op het financieel toezicht][ref1], door een omstandigheid die het gevolg is van een of
      meer terroristische handelingen voor zover de totale schade die in een kalenderjaar ten gevolge van dergelijke
      handelingen bij schade- of levensverzekeraars waarop de [Wet op het financieel toezicht][ref2] van toepassing is,
      zal worden gedeclareerd, naar verwachting van de Nederlandse Herverzekeringsmaatschappij voor Terrorismeschaden
      N.V. hoger zal zijn dan het door die maatschappij herverzekerde maximumbedrag per kalenderjaar, of door een
      kernongeval als bedoeld in [artikel 1, eerste lid, van de Wet aansprakelijkheid kernongevallen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368
      [ref3]: https://wetten.overheid.nl/BWBR0003234#Artikel1
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
      - id: ref3
        bwb_id: BWBR0003234
        artikel: '1'
  - number: '40.9'
    text: |-
      De toestemming, bedoeld in het eerste lid, wordt door de inspecteur verleend met ingang van 1 januari of 1 juli van
      enig jaar, mits de aanvraag ten minste dertien weken voor de desbetreffende datum is ingediend. Aan een startende
      werkgever wordt op zijn verzoek toestemming verleend met ingang van het tijdstip waarop deze aanvangt werkgever
      te zijn.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
  - number: '40.10'
    text: 'Het door de werkgever zelf dragen van het risico, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
  - number: 40.10.a
    text: |-
      eindigt met ingang van de dag waarop de schriftelijke garantie, bedoeld in het tweede lid, eindigt,
      onderscheidenlijk met ingang van de dag waarop de eigenrisicodrager in staat van faillissement is verklaard of ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard dan wel de dag waarop
      hij ophoudt werkgever te zijn;
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
  - number: 40.10.b
    text: |-
      wordt door de inspecteur op 1 januari of 1 juli van enig jaar beëindigd bij voor bezwaar vatbare beschikking op
      aanvraag van de werkgever, mits deze aanvraag ten minste dertien weken voor de desbetreffende datum is ingediend;
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
  - number: 40.10.c
    text: |-
      kan door de inspecteur zonder aanvraag van de werkgever met onmiddellijke ingang bij voor
      bezwaar vatbare beschikking worden beëindigd indien de rechtbank de noodregeling, bedoeld in
      [hoofdstuk 3.5 van de Wet op het financieel toezicht][ref1] heeft uitgesproken over de betrokken verzekeraar
      onderscheidenlijk bank.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Hoofdstuk3.5
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020368
        hoofdstuk: '3.5'
  - number: '40.11'
    text: |-
      In een geval als bedoeld in het tiende lid, onderdeel a, doet de inspecteur daarvan op verzoek van de werkgever
      mededeling bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
  - number: '40.12'
    text: |-
      Indien de periode, bedoeld in [artikel 82, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] wordt
      gewijzigd in die zin dat de wijziging een verlenging van de periode betekent, legt de werkgever die zelf het risico
      draagt van betaling de WGA uitkering, binnen een bij ministeriële regeling te bepalen termijn, een schriftelijke
      garantie over aan de inspecteur waaruit blijkt dat een bank of een verzekeraar zich jegens het UWV verplicht, op
      het eerste verzoek van het UWV, waarbij het UWV schriftelijk meedeelt dat de verplichtingen die voortvloeien uit
      het zelf dragen van het risico niet worden nagekomen, die verplichtingen na te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
  - number: '40.13'
    text: |-
      Indien niet of niet tijdig wordt voldaan aan het twaalfde lid, eindigt het door de werkgever zelf dragen van het
      risico, bedoeld in het eerste lid, onderdeel b, met ingang van de dag waarop de wijziging van de periode, bedoeld
      in [artikel 82, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
  - number: '40.14'
    text: Bij ministeriële regeling kunnen met betrekking tot het twaalfde en dertiende lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
  - number: '40.15'
    text: |-
      Beschikkingen van de inspecteur op grond van deze afdeling worden genomen gehoord het UWV en in overeenstemming met
      het UWV.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
  - number: '40.16'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de toestemming, bedoeld in het negende lid, eerste zin,
      en de beëindiging, bedoeld in het tiende lid, onderdeel b, uitsluitend wordt verleend onderscheidenlijk plaatsvindt
      met ingang van 1 januari van enig jaar. Bij regeling van Onze Minister, in overeenstemming met Onze Minister van
      Financiën, kan in bijzondere omstandigheden de termijn van dertien weken, bedoeld in het negende lid, eerste zin,
      en het tiende lid, onderdeel b, worden ingekort.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel40
  - number: '41.1'
    text: |-
      De eigenrisicodrager met betrekking tot de WGA-uitkering bedoeld in [artikel 40, eerste lid, onderdeel b][ref1], en
      de startende werkgever, bedoeld in [artikel 40, negende lid][ref2], die in afwachting is van de door de inspecteur
      te nemen beslissing op aanvraag, bedoeld in [artikel 40, eerste lid, onderdeel b][ref3], kunnen de bij ministeriële
      regeling genoemde kosten met betrekking tot een werknemer ten behoeve van eigenrisicodragen onder bij ministeriële
      regeling te bepalen voorwaarden, tot ten hoogste de helft verhalen op de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        afdeling: '5'
  - number: '41.2'
    text: |-
      De eigenrisicodrager die ter dekking van het risico, bedoeld in [artikel 40, eerste lid][ref1], een verzekering
      heeft afgesloten mag de door hem ter zake van die verzekering verschuldigde premie niet verhalen op de werknemer
      voorzover dit niet voortvloeit uit het eerste lid. Elk beding waarbij wordt afgeweken van de eerste zin is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        afdeling: '5'
  - number: '42'
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot deze afdeling.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel42
  - number: '43'
    text: |-
      Aan een gemeente of een bestuur van een openbaar lichaam ingevolge een gemeenschappelijke regeling als bedoeld
      in [artikel 1, tweede lid, van de Wet sociale werkvoorziening][ref1] wordt geen toestemming verleend als bedoeld
      in [artikel 40, aanhef en eerste lid, onderdeel b][ref2], ten aanzien van werknemers die werkzaam zijn in een
      dienstbetrekking op grond van de [Wet sociale werkvoorziening][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0008903
  - number: 46a.1
    text: |-
      De eigenrisicodrager met betrekking tot de WGA uitkering, bedoeld in [artikel 40, eerste lid, onderdeel b][ref1],
      is over het loon van de tot hem in dienstbetrekking staande werknemers de gedifferentieerde premie, bedoeld in
      [artikel 38][ref2], en over de door hem te betalen WGA uitkeringen de premie ten behoeve van de Werkhervattingskas,
      bedoeld in [artikel 38a][ref3], niet verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel38a
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: 38a
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: 46a.2
    text: |-
      De startende werkgever, bedoeld in [artikel 40, negende lid][ref1], is in afwachting van de door de inspecteur
      te nemen beslissing op aanvraag, bedoeld in [artikel 40, eerste lid, onderdeel b][ref2], over het loon van de
      tot hem in dienstbetrekking staande werknemers de gedifferentieerde premie, bedoeld in [artikel 38][ref3], niet
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel38
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: '47.1'
    text: |-
      De werkgever past een korting toe op het totaal van de door hem op grond van de [afdelingen 2][ref1], [3][ref2] en
      [4][ref3] verschuldigde premies bij een dienstbetrekking met een werknemer:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017745
        hoofdstuk: '3'
        afdeling: '4'
  - number: 47.1.a
    text: |-
      die onmiddellijk voorafgaand aan de aanvang van de dienstbetrekking recht heeft op een uitkering op
      grond van de [Werkloosheidswet][ref1], de [Wet op de arbeidsongeschiktheidsverzekering][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet werk en arbeidsondersteuning jonggehandicapten][ref4],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5],
      de [Wet arbeidsongeschiktheidsvoorziening militairen][ref6], de
      [Wet werk en bijstand][ref7], de [Wet inkomensvoorziening oudere werklozen][ref8], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref9], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref10]
      en de [Algemene pensioenwet politieke ambtsdragers][ref11], of op wachtgeld als bedoeld in
      [artikel 6, vijfde lid, van de Werkloosheidswet][ref12], dan wel recht heeft op inkomensondersteuning op grond van
      de [Wet werk en arbeidsondersteuning jonggehandicapten][ref13]; en


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0019057
