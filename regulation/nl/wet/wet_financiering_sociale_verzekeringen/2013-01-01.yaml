        hoofdstuk: '2'
  - number: '28.5'
    text: |-
      Een door het UWV bepaald percentage als bedoeld in het eerste lid behoeft de goedkeuring van Onze Minister. Indien
      Onze Minister zijn goedkeuring onthoudt stelt hij het percentage zelf vast.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel28
  - number: '28.6'
    text: |-
      Het UWV dan wel, indien Onze Minister het percentage heeft vastgesteld, Onze Minister maakt bekend
      welk deel van het percentage, bedoeld in het eerste lid, is gerelateerd aan hetgeen op grond van
      [artikel 104, eerste lid, onderdelen a en b, onderdeel c, respectievelijk onderdeel d][ref1], ten laste komt van
      een sectorfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '104'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: '29'
    text: |-
      De financiële middelen tot dekking van de uitgaven ten laste van het Uitvoeringsfonds voor de overheid, alsmede de
      financiële middelen voor het vormen en in stand houden van een reserve in dat fonds, worden verkregen door het in
      rekening brengen van de uitgaven, bedoeld in [artikel 79 van de Werkloosheidswet][ref1], bij de overheidswerkgevers
      en door het heffen van premie.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel79
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '79'
  - number: '30'
    text: De premie is verschuldigd door de overheidswerkgever.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel30
  - number: '31'
    text: |-
      De premie wordt bij ministeriële regeling vastgesteld op een percentage van het loon. Dit percentage kan
      uitsluitend voor verschillende werkgevers verschillen, omdat bij de vaststelling daarvan ten aanzien van
      de eigenrisicodrager, bedoeld in [artikel 40, eerste lid, onderdeel a][ref1], uitkeringen op grond van
      [artikel 29, tweede lid, onderdelen a, b en c, van de Ziektewet][ref2], vermeerderd met een opslag in
      verband met kosten ter zake van de betaling van die uitkeringen en van de werkzaamheden als bedoeld in
      [artikel 63a, eerste lid, van die wet][ref3], alsmede de op grond van enige wet over die uitkeringen verschuldigde
      premies die niet op die uitkeringen in mindering kunnen worden gebracht, buiten beschouwing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
        hoofdstuk: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 63a
  - number: '33.1'
    text: |-
      De financiële middelen tot dekking van de uitgaven ten laste van het Arbeidsongeschiktheidsfonds, alsmede de
      financiële middelen voor het vormen en in stand houden van een reserve in dat fonds, worden verkregen door
      het heffen van de in [artikel 36][ref1] bedoelde basispremie en door een bijdrage van het rijk als bedoeld in
      [artikel 114, onderdeel f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel114
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '114'
        hoofdstuk: '7'
        paragraaf: '2'
        afdeling: '3'
  - number: '33.2'
    text: |-
      De financiële middelen tot dekking van de uitgaven ten laste van de Werkhervattingskas, alsmede de financiële
      middelen voor het vormen en in stand houden van een reserve in de Werkhervattingskas, worden verkregen door het
      heffen van de in [artikel 38][ref1] bedoelde gedifferentieerde premie.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: '34.1'
    text: |-
      De premie is verschuldigd door werkgevers in de zin van de [Wet werk en inkomen naar arbeidsvermogen][ref1] en
      bestaat uit een basispremie en een gedifferentieerde premie.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: '34.2'
    text: |-
      In afwijking van [artikel 20][ref1] kan de werkgever de met betrekking tot een werknemer door hem verschuldigde
      gedifferentieerde premie ten behoeve van de Werkhervattingskas, bedoeld in [artikel 38][ref2], onder bij
      ministeriële regeling te bepalen voorwaarden, tot ten hoogste de helft verhalen op de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '4'
  - number: '35'
    text: De maatstaf voor de heffing van de premie is het loon.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel35
  - number: '36'
    text: |-
      Bij ministeriële regeling wordt voor de berekening van de basispremie een voor alle takken van bedrijf en beroep
      gelijk percentage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel36
  - number: '38.1'
    text: 'Het UWV stelt vast:'
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel38
  - number: 38.1.a
    text: |-
      voor de berekening van de gedifferentieerde premie ten behoeve van de Werkhervattingskas, een voor alle takken van
      bedrijf en beroep gelijk rekenpercentage;
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel38
  - number: 38.1.b
    text: |-
      voor de berekening van het rekenpercentage, bedoeld in onderdeel a, een voor alle takken van bedrijf en beroep
      gelijk gemiddeld percentage.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel38
  - number: '38.2'
    text: |-
      Elk jaar wordt met ingang van 1 januari een opslag of korting vastgesteld waarmee het in het eerste lid, onderdeel
      a, bedoelde percentage wordt verhoogd respectievelijk verlaagd. Bij of krachtens de algemene maatregel van bestuur,
      bedoeld in het vierde lid, kan worden bepaald dat de opslag of korting voor een werkgever dan wel voor categorieën
      van werkgevers wordt vastgesteld, waarbij de korting of opslag voor categorieën van werkgevers kan verschillen of
      op nihil kan worden vastgesteld. Indien een werkgever met toepassing van de [artikelen 96][ref1] of [97][ref2] is
      aangesloten bij verschillende sectoren, wordt voor elk bedrijfsonderdeel van de werkgever waar werkzaamheden worden
      verricht die behoren tot een afzonderlijke sector, de opslag of korting toegepast als was dat bedrijfsonderdeel een
      afzonderlijke werkgever. Voor de werkgever die niet behoort tot een categorie als bedoeld in de tweede zin, stelt
      de inspecteur de korting of opslag vast bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel97
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '96'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '97'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: '38.3'
    text: |-
      De inspecteur stelt in geval van overgang van een onderneming in de zin van
      [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1], alsmede in geval van een dergelijke overgang bij
      faillissement, de vastgestelde opslag of korting, bedoeld in het tweede lid, opnieuw bij voor bezwaar vatbare
      beschikking vast voor de werkgever die een onderneming of een deel daarvan verkrijgt en voor de werkgever die een
      deel van zijn onderneming overdraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
  - number: '38.4'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel38
  - number: 38.4.a
    text: |-
      de wijze waarop het rekenpercentage, bedoeld in het eerste lid, onderdeel a, en het gemiddelde percentage, bedoeld
      in het eerste lid, onderdeel b, worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel38
  - number: 38.4.b
    text: de wijze waarop de in het tweede en het derde lid bedoelde opslag en korting worden berekend;
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel38
  - number: 38.4.c
    text: |-
      de percentages die op grond van dit artikel ten hoogste voor een werkgever mogen gelden en omtrent de percentages
      die op grond van dit artikel ten minste voor een werkgever moeten gelden.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel38
  - number: '38.5'
    text: |-
      Beschikkingen van de inspecteur op grond van dit artikel worden genomen gehoord het UWV en in overeenstemming met
      het UWV.
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel38
  - number: 38a.1
    text: |-
      In afwijking van [artikel 38][ref1] is over een uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen,][ref2] de [Wet op de arbeidsongeschiktheidsverzekering][ref3],
      de [Ziektewet][ref4], [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref5],
      de [Werkloosheidswet][ref6], over een toeslag op grond van de [Toeslagenwet][ref7], over het
      loon uit een dienstbetrekking op grond van de [Wet sociale werkvoorziening][ref8] en over het
      loon van de werknemer van de eigenrisicodrager, op wie [artikel 56][ref9] van toepassing is,
      als gedifferentieerde premie ten behoeve van de Werkhervattingskas een premie verschuldigd
      naar het percentage, bedoeld in [artikel 38, eerste lid, onderdeel a][ref10]. Met een uitkering
      op grond van de [Werkloosheidswet][ref11] wordt gelijkgesteld een wachtgeld als bedoeld in
      [artikel 1, onderdeel r, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0001888
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref6]: https://wetten.overheid.nl/BWBR0004045
      [ref7]: https://wetten.overheid.nl/BWBR0004043
      [ref8]: https://wetten.overheid.nl/BWBR0008903
      [ref9]: https://wetten.overheid.nl/BWBR0017745#Artikel56
      [ref10]: https://wetten.overheid.nl/BWBR0017745#Artikel38
      [ref11]: https://wetten.overheid.nl/BWBR0004045
      [ref12]: https://wetten.overheid.nl/BWBR0009267#Artikel1
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel38a
