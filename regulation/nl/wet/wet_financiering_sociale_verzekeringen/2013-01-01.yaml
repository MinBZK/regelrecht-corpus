  - number: '103.2'
    text: |-
      Bij ministeriële regeling wordt een jaarlijkse bijdrage vastgesteld die in een kalenderjaar ten gunste komt
      van het sectorfonds waarin werkgevers op grond van [artikel 95][ref1] zijn ingedeeld, die zich in het kader
      van de uitoefening van hun bedrijf of beroep bezighouden met het ter beschikking stellen van arbeidskrachten
      aan een derde om krachtens een door deze aan de werkgever verstrekte opdracht arbeid te verrichten onder
      leiding en toezicht van de derde, waarbij die werknemers werkzaam zijn op basis van een uitzendovereenkomst als
      bedoeld in [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref2], waarin tevens een beding als bedoeld in
      [artikel 691, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref3] is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel690
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel691
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel103
