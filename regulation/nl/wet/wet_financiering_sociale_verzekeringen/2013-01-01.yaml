  - number: 122k.1
    text: |-
      Voor zover ter zake van het belastbare inkomen uit werk en woning
      [artikel 10a.8 van de Wet inkomstenbelasting 2001][ref1] wordt toegepast, wordt voor de toepassing van
      [artikel 8, eerste lid, eerste volzin][ref2], onder premie-inkomen verstaan het belastbare inkomen uit werk en
      woning, bepaald volgens de regels van [hoofdstuk 3 van de Wet inkomstenbelasting 2001][ref3], met inachtneming van
      artikel 10a.8 van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel122k
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0011353
        hoofdstuk: '3'
  - number: 122k.2
    text: |-
      Ingeval ter zake van het belastbare loon [artikel 39c van de Wet op de loonbelasting 1964][ref1] wordt toegepast:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel39c
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel122k
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 39c
  - number: 122k.2.1°
    text: |-
      wordt voor de toepassing van [artikel 8, tweede lid][ref1], onder premie-inkomen verstaan het belastbare loon in
      de zin van de [wet op de loonbelasting 1964][ref2] met uitzondering van de eindheffingsbestanddelen, bedoeld in
      [artikel 31, eerste lid, onderdelen e, onder 1°, f en g, van die wet][ref3], zoals dat op 31 december 2010 luidde:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002471
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel122k
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002471
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 122k.2.2°
    text: |-
      behoren voor de toepassing van [artikel 16, tweede lid, aanhef en onderdeel b][ref1],
      niet tot het loon eindheffingsbestanddelen als bedoel in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref2], zoals dit op
      31 december 2010 luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel122k
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 122k.3
    text: |-
      Dit artikel komt te vervallen met ingang van de dag waarop [artikel 39c van de Wet op de loonbelasting 1964][ref1]
      komt te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel39c
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel122k
    references:
