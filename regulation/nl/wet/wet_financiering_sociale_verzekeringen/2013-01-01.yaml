  - number: '94.1'
    text: |-
      Het UWV stelt voor een sector als bedoeld in [artikel 95][ref1], met uitzondering van de sectoren waartoe alleen
      overheidswerkgevers behoren, een sectorfonds in.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel95
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '95'
        hoofdstuk: '7'
        paragraaf: '1'
        afdeling: '3'
  - number: '94.2'
    text: |-
      Het UWV beheert de middelen, bedoeld in [artikel 103][ref1], en de uitgaven, bedoeld in
      [artikel 104, eerste lid][ref2], gezamenlijk en administreert deze middelen en uitgaven met betrekking tot elk
      sectorfonds afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel104
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '103'
        hoofdstuk: '7'
