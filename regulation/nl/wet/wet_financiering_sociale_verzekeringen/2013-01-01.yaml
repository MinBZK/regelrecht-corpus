        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '6'
  - number: 122c.2
    text: |-
      Het eerste lid is niet van toepassing op de premie die het UWV betaalt aan de werkgever op grond van
      [artikel 11, tweede lid, van de Werkloosheidswet][ref1], [artikel 11, derde lid, van de Ziektewet][ref2] of
      [artikel 10, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref3] met dien verstande dat ten
      aanzien van de premie die de werkgever in dat geval is verschuldigd, het eerste lid van toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel10
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel122c
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '10'
  - number: 122d
    text: |-
      De premie die op grond van [artikel 27][ref1] is vastgesteld wordt met ingang van het jaar 2015 in verband met de
      ontwikkeling van de lasten voor werkgevers voortvloeiend uit de toepassing van [artikel 47][ref2] en [122c][ref3]
      verlaagd met 0,35% in 2015, 0,45% in 2016, 0,55% in 2017, 0,60% in 2018, 0,70% in 2019 en 0,75% in 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel122c
    url: https://wetten.overheid.nl/BWBR0017745/2013-01-01#Artikel122d
    references:
