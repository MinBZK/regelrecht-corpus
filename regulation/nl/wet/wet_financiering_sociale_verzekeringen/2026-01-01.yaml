  - number: '33'
    text: |-
      1 De financiële middelen tot dekking van de uitgaven ten laste van het Arbeidsongeschiktheidsfonds worden verkregen
      door het heffen van de gedifferentieerde premie, bedoeld in [artikel 36][ref1], de quotumheffing, bedoeld in
      [artikel 38h][ref2], en door een bijdrage van het rijk als bedoeld in [artikel 114, onderdeel f][ref3].

      2 De financiële middelen tot dekking van de uitgaven ten laste van de Werkhervattingskas worden verkregen door het
      heffen van de in [artikel 38][ref4] bedoelde gedifferentieerde premie.


