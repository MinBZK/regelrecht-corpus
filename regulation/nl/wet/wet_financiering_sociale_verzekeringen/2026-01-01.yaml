  - number: '2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. volksverzekeringen: de verplichte verzekeringen op grond van de [Algemene Ouderdomswet][ref1], de
      [Algemene nabestaandenwet][ref2] en de [Wet langdurige zorg][ref3];

      b. vrijwillige volksverzekeringen: de vrijwillige verzekeringen op grond van de [Algemene Ouderdomswet][ref4] en de
      [Algemene nabestaandenwet][ref5];

      c. werknemersverzekeringen: de verplichte verzekeringen op grond van de [Werkloosheidswet][ref6],
      de [Ziektewet][ref7], de [Wet werk en inkomen naar arbeidsvermogen][ref8] en de
      [Wet op de arbeidsongeschiktheidsverzekering][ref9];

      d. vrijwillige werknemersverzekeringen: de vrijwillige verzekeringen op grond van de
      [Werkloosheidswet][ref10], de [Ziektewet][ref11], de [Wet werk en inkomen naar arbeidsvermogen][ref12] en de
      [Wet op de arbeidsongeschiktheidsverzekering][ref13].


