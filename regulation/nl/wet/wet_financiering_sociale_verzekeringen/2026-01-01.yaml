  - number: '100'
    text: |-
      Ten laste van het Algemeen Werkloosheidsfonds komen:

      a. de op grond van de [Werkloosheidswet][ref1] te betalen uitkeringen, met uitzondering van de uitkeringen, bedoeld
      in [artikel 108, eerste lid, onderdeel a][ref2];

      b. de op grond van [artikel 29, tweede lid, onderdeel d, van de Ziektewet][ref3] te betalen uitkeringen, met
      uitzondering van de uitkeringen, bedoeld in [artikel 108, eerste lid, onderdeel b][ref4];

      c. de uitvoeringskosten, voorzover deze betrekking hebben op de in de onderdelen a en b bedoelde uitkeringen en
      voor zover deze betrekking hebben op de bij regeling van Onze Minister bepaalde uitvoeringskosten waarvoor op grond
      van [artikel 99, onderdeel h][ref5], een deel van de rijksbijdrage in de uitvoeringskosten van het UWV ten gunste
      van het Algemeen Werkloosheidsfonds komt en de bedragen, bedoeld in onderdeel f;

      d. de op grond van enige wet over de uitkeringen, bedoeld in onderdeel a en b, door het UWV verschuldigde premies
      en de inkomensafhankelijke bijdrage, bedoeld in [artikel 42 van de Zorgverzekeringswet][ref6] die niet op deze
      uitkeringen in mindering kunnen worden gebracht;

      e.

      f. de op grond van [artikel 673e van Boek 7 van het Burgerlijk Wetboek][ref7] te betalen bedragen, voor zover het
      betreft vergoedingen in verband met het beëindigen of niet voortzetten van de arbeidsovereenkomst voor 1 januari
      2020 vanwege een omstandigheid als bedoeld in het eerste lid, onderdeel a, onder 1 of 2, van dat artikel;

      g.

      h.

      i.

      j.

      k. de kosten in verband met de uitvoering van
      [artikel 30a van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref8] ten aanzien van personen, die
      een uitkering ontvangen als bedoeld in de onderdelen a en b en de kosten van de re-integratiemaatregelen, bedoeld
      in [hoofdstuk VI van de Werkloosheidswet][ref9] en [hoofdstuk IIA van de Ziektewet][ref10] ten aanzien van deze
      personen;

      l. vergoedingen aan gemeenten die worden overeengekomen ter uitvoering van
      [artikel 30a, derde lid, onderdeel a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref11] voor
      zover betrekking hebbend op personen, die een uitkering ontvangen als bedoeld in de onderdelen a en b;

      m. middelen voor uitgaven van de Sociaal-Economische Raad als bedoeld in
      [artikel 54 van de Wet op de bedrijfsorganisatie][ref12].


