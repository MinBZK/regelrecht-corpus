      1 De premie voor de vrijwillige verzekering op grond van de [Ziektewet][ref1] wordt berekend over het dagloon,
      bedoeld in [artikel 68, eerste lid, van de Ziektewet][ref2].

      2 De premie bedraagt een door het UWV te bepalen percentage van het in het eerste lid bedoelde dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel68
