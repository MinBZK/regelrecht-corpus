  - number: 117a
    text: |-
      Ten gunste van de Werkhervattingskas komen:

      a. de gedifferentieerde premie op grond van de [artikelen 38, tweede lid][ref1], en [38a, eerste lid][ref2];

      b. de gelden die het UWV ontvangt met toepassing van de [artikelen 76][ref3], [82, vierde en vijfde lid][ref4],
      [84, derde lid][ref5], en [99 van de Wet werk en inkomen naar arbeidsvermogen][ref6] in verband met uitkeringen als
      bedoeld in [artikel 117b, eerste lid][ref7];

      c. de gelden die door toepassing van [artikel 118][ref8] worden overgeheveld uit het Arbeidsongeschiktheidsfonds.


