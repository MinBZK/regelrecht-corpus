  - number: 38b
    text: |-
      1 In deze paragraaf en de daarop berustende bepalingen wordt onder een arbeidsbeperkte verstaan de persoon, niet
      zijnde de persoon van wie door het college van burgemeester en wethouders is vastgesteld dat hij uitsluitend in een
      beschutte omgeving onder aangepaste omstandigheden mogelijkheden tot arbeidsparticipatie heeft als bedoeld in

      [artikel 10b, eerste lid, van de Participatiewet][ref1]:

      a. die met ondersteuning bij de arbeidsinschakeling van het college van burgemeester en wethouders op
      grond van [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref2] naar een dienstbetrekking
      is of wordt toegeleid of ten behoeve van wie loonkostensubsidie wordt verstrekt op grond van
      [artikel 10d, tweede lid, van de Participatiewet][ref3], en van wie uitsluitend op verzoek van het college van
      burgemeester en wethouders door het UWV is vastgesteld dat hij niet in staat is tot het verdienen van het wettelijk
      minimumloon, bedoeld in [artikel 2, onderdeel c, van de Participatiewet][ref4], dan wel van wie door het college
      van burgemeester en wethouders in overeenstemming met de eisen gesteld aan een loonwaardevaststelling op grond van
      artikel 10d, eerste of tweede lid, van de Participatiewet een loonwaarde is vastgesteld die bij voltijdse arbeid
      minder bedraagt dan het wettelijk minimumloon, bedoeld in artikel 2, onderdeel c, van de Participatiewet,

      b. die geïndiceerd is als bedoeld in de [Wet sociale werkvoorziening][ref5] of een nog geldende
      indicatiebeschikking heeft op grond van [artikel 11 van die wet][ref6], zoals dat artikel luidde op 31 december
      2014,

      c. die recht heeft op arbeidsondersteuning of een arbeidsongeschiktheidsuitkering op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref7], met dien verstande dat de persoon die
      duurzaam geen mogelijkheden tot arbeidsparticipatie heeft als bedoeld in de [artikelen 1a:1, eerste lid][ref8],
      [2:4, eerste lid][ref9], of [3:8a, eerste lid, van die wet][ref10] slechts wordt aangemerkt als arbeidsbeperkte
      indien die persoon arbeid verricht in een dienstbetrekking,

      d. die voldoet aan een bij of krachtens algemene maatregel van bestuur vastgestelde indicatie,

      e. die met ondersteuning bij de arbeidsinschakeling van het college van burgemeester en wethouders op grond
      van [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref11] naar een dienstbetrekking is of wordt
      toegeleid, en van wie op eigen verzoek door het UWV is of wordt vastgesteld dat hij niet in staat is tot het
      verdienen van het wettelijk minimumloon, bedoeld in [artikel 2, onderdeel c, van de Participatiewet][ref12]. Bij
      algemene maatregel van bestuur kunnen ten aanzien van de persoon, bedoeld in de vorige zin, nadere regels worden
      gesteld,

      f. die op of na 1 januari 2013 een persoon was als bedoeld in het eerste lid, onderdeel b of c,
      en op 1 mei 2015 niet langer een zodanige persoon was, met uitzondering van de persoon, bedoeld
      in onderdeel c, die duurzaam geen mogelijkheden tot arbeidsparticipatie meer heeft als bedoeld in
      [artikel 1a:1 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref13], of

      g. die recht heeft op een arbeidsongeschiktheidsuitkering als bedoeld in
      [Hoofdstuk 6 van de Wet werk en inkomen naar arbeidsvermogen][ref14] en voor wie op grond van
      [artikel 82a, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref15]
      bij wijze van experiment het instrument, bedoeld in de [artikelen 2:20][ref16] en
      [3:63 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref17], is ingezet.

      2 Voor de toepassing van deze paragraaf en de daarop berustende bepalingen wordt onder een
      arbeidsbeperkte mede verstaan een persoon die naar het oordeel van het UWV wegens ziekte of gebrek
      ontstaan voordat de leeftijd van 18 jaren is bereikt of in de tijd dat hij studerende was als bedoeld
      in [artikel 1:4 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref18] een belemmering
      ondervindt in het verrichten van arbeid in dienstbetrekking, en zonder een voorziening als bedoeld in
      [artikel 10 van de Participatiewet][ref19] of [artikel 35 van de Wet werk en inkomen naar arbeidsvermogen][ref20]
      niet in staat is tot het verdienen van het wettelijk minimumloon, bedoeld in
      [artikel 2, onderdeel c, van de Participatiewet][ref21].

      3 Met betrekking tot de beoordeling door het UWV of een persoon een arbeidsbeperkte is als bedoeld in het tweede
      lid worden bij of krachtens algemene maatregel van bestuur regels gesteld.

      4 In deze paragraaf en in [artikel 122n][ref22] en de daarop berustende bepalingen wordt
      verstaan onder verloonde uren: de uren waarover loon is betaald en die zijn opgenomen in de
      loonaangifte op grond van [artikel 28, eerste lid, van de Wet op de loonbelasting 1964][ref23]
      en die tevens zijn opgenomen in de polisadministratie op grond van
      [artikel 33, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref24].

      5 In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder de beschikking: de in
      [artikel 38h, eerste lid][ref25], bedoelde beschikking alsmede de op grond van artikel 38h, vijfde lid, herziene
      beschikking.

      6 Voor de toepassing van deze paragraaf en de daarop berustende bepalingen wordt tevens als arbeidsbeperkte
      beschouwd de persoon, niet zijnde de persoon van wie door het college van burgemeester en wethouders is vastgesteld
      dat hij uitsluitend in een beschutte omgeving onder aangepaste omstandigheden mogelijkheden tot arbeidsparticipatie
      heeft als bedoeld in [artikel 10b, eerste lid, van de Participatiewet][ref26], die niet langer aan de voorwaarden
      op grond van het eerste dan wel het tweede lid voldoet, zolang zijn opname in de registratie van arbeidsbeperkten,
      bedoeld in [artikel 38d, eerste lid][ref27], nog niet is geëindigd.


