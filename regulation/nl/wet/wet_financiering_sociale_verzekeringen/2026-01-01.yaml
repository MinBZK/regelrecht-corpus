    text: |-
      1 Premieplichtig voor de volksverzekeringen is de verzekerde in de zin van de volksverzekeringen.

      2 Ingeval [artikel 26b van de Wet op de loonbelasting 1964][ref1] toepassing vindt, wordt de in
      dat artikel bedoelde werknemer geacht premieplichtig te zijn. Ten aanzien van deze werknemer worden
      de in [artikel 10, eerste lid][ref2], bedoelde percentages toegepast op het loon in de zin van de
      [Wet op de loonbelasting 1964][ref3].


