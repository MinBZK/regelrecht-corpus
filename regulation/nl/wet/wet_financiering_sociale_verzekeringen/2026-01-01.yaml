  - number: '36'
    text: |-
      1 De gedifferentieerde premie ten behoeve van het Arbeidsongeschiktheidsfonds, bedoeld in
      [artikel 34, eerste lid][ref1], wordt bij regeling van Onze Minister vastgesteld op een percentage van het
      loon, bedoeld in [paragraaf 1 van afdeling 1][ref2] van dit hoofdstuk, waarbij voor kleine werkgevers een lager
      percentage geldt dan voor overige werkgevers en het verschil tussen het hoge en het lage percentage niet meer
      bedraagt dan 2 procentpunt.

      2 Bij algemene maatregel van bestuur wordt geregeld welke werkgevers voor de toepassing van dit artikel worden
      aangemerkt als kleine werkgevers. Daarbij kunnen aanvullende criteria worden vastgesteld voor het aanmerken van een
      werkgever als kleine werkgever.

      3 Indien een werkgever met toepassing van het bepaalde bij of krachtens de [artikelen 96][ref3] of [97][ref4] is
      aangesloten bij verschillende sectoren, wordt voor elk bedrijfsonderdeel van de werkgever waar werkzaamheden worden
      verricht die behoren tot een afzonderlijke sector het eerste en tweede lid toegepast als was dat bedrijfsonderdeel
      een afzonderlijke werkgever.

      4 In afwijking van het eerste en tweede lid is over een uitkering
      op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref5], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref6], de [Ziektewet][ref7],
      [hoofdstuk 3, afdeling 2, paragraaf 1][ref8], of de [artikelen 4:2b, eerste tot en met zesde lid][ref9],
      en [6:3, eerste tot en met zesde lid, van de Wet arbeid en zorg][ref10], de [Werkloosheidswet][ref11], over
      een toeslag op grond van de [Toeslagenwet][ref12] en over het loon uit een dienstbetrekking op grond van de
      [Wet sociale werkvoorziening][ref13], het krachtens het eerste lid vastgestelde hoge percentage verschuldigd.
      Met een uitkering op grond van de Werkloosheidswet wordt gelijkgesteld een wachtgeld als bedoeld in
      [artikel 1, onderdeel r, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref14].


