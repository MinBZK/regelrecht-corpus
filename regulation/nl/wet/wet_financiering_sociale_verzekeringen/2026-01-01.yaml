  - number: '118'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de overheveling van gelden uit het
      Arbeidsongeschiktheidsfonds naar de Werkhervattingskas.

      2 Bij algemene maatregel van bestuur worden regels gesteld over de overheveling van gelden uit het
      Arbeidsongeschiktheidsfonds naar het Rijk ten behoeve van de financiering van uitkeringen en re-
      integratievoorzieningen op grond van de [Wet arbeidsongeschiktheids-voorziening jonggehandicapten][ref1], en de
      financiering van uitkeringen en re-integratievoorzieningen op grond van de [Participatiewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008657
      [ref2]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0017745/2026-01-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0008657
      - id: ref2
        bwb_id: BWBR0015703
  - number: 118a
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald, dat de colleges van burgemeester en
      wethouders uitkeringen aan werknemers, die voorafgaande aan de dienstbetrekking, door die colleges
      van burgemeester en wethouders op grond van [artikel 7, eerste lid, onderdeel a][ref1], of
      [artikel 7a, eerste lid, onderdeel a, of derde lid, van de Participatiewet][ref2] zijn ondersteund bij de
      arbeidsinschakeling vergoeden aan het UWV, indien de dienstbetrekking een bij die maatregel te bepalen tijd heeft
      geduurd.

      2 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, wordt in ieder geval geregeld:

      a. welke uitkeringen op grond van de werknemersverzekeringen dit betreft;

      b. de doelgroep van de werknemers;

      c. de hoogte van de vergoeding;

      d. de wijze van vergoeding;

      e. ten gunste van welk fonds, bedoeld in deze afdeling, de vergoedingen komen.

      3 Een voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.

      4 Een op grond van dit artikel vastgestelde algemene maatregel van bestuur treedt slechts in werking,
      nadat gebleken is dat aan werknemers als bedoeld in het eerste lid bovenmatig uitkeringen op grond van de
      werknemersverzekeringen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel7a
    url: https://wetten.overheid.nl/BWBR0017745/2026-01-01#Artikel118a
