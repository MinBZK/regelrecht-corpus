      1 De eigenrisicodrager met betrekking tot de WGA-uitkering bedoeld in [artikel 40, eerste lid, onderdeel b][ref1],
      en de startende werkgever, bedoeld in [artikel 40, negende lid][ref2], die in afwachting is van de door de
      inspecteur te nemen beslissing op aanvraag, bedoeld in [artikel 40, eerste lid, onderdeel b][ref3], kunnen de bij
      ministeriële regeling genoemde kosten met betrekking tot een werknemer ten behoeve van eigenrisicodragen onder bij
      ministeriële regeling te bepalen voorwaarden, tot ten hoogste de helft verhalen op de werknemer.

      2 De eigenrisicodrager die ter dekking van het risico, bedoeld in [artikel 40, eerste lid][ref4], een verzekering
      heeft afgesloten mag de door hem ter zake van die verzekering verschuldigde premie niet verhalen op de werknemer
      voorzover dit niet voortvloeit uit het eerste lid. Elk beding waarbij wordt afgeweken van de eerste zin is nietig.


