  - number: '99'
    text: |-
      Ten gunste van het Algemeen Werkloosheidsfonds komen:

      a. de premie op grond van [artikel 27][ref1] en de premie op grond van [artikel 74][ref2];

      b. de bedragen, die het UWV ontvangt door de toepassing van de [artikelen 27a][ref3] en
      [36 van de Werkloosheidswet][ref4], voorzover deze bedragen betrekking hebben op uitkeringen, die ten laste van dat
      fonds zijn gebracht;

      c. de bedragen die het UWV ontvangt door de uitoefening van zijn bevoegdheid op grond van
      [artikel 66 van de Werkloosheidswet][ref5];

      d. de bedragen die het UWV ontvangt door toepassing van [artikel 45a van de Ziektewet][ref6], voorzover deze verband
      houden met te betalen uitkeringen op grond van [artikel 29, tweede lid, onderdeel d, van de Ziektewet][ref7];

      e. de bedragen die het UWV ontvangt van de werkgever in het kader van de toepassing van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref8];

      f. de bedragen die UWV ontvangt door toepassing van
      [artikel 673e, vijfde lid, van Boek 7 van het Burgerlijk Wetboek][ref9], voor zover het betreft onverschuldigd
      betaalde vergoedingen als bedoeld in [artikel 100, onderdeel f][ref10];

      g. een rijksbijdrage die jaarlijks door Onze Minister in overeenstemming met Onze Minister van Onderwijs, Cultuur
      en Wetenschap wordt vastgesteld;

      h. in afwijking van [artikel 23 ][ref11]de rijksbijdrage in de uitvoeringskosten van het UWV, bedoeld in
      [artikel 45, eerste lid, onderdeel e, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref12], voor
      zover dit bij regeling van Onze Minister is bepaald.


