  - number: 122n
    text: |-
      1 De quotumheffing, bedoeld in [hoofdstuk 3, afdeling 4, paragraaf 4a][ref1], wordt niet uitgevoerd
      dan nadat bij regeling van Onze Minister, in overeenstemming met het gevoelen van de ministerraad,
      tot invoering is besloten indien is gebleken dat het aantal banen voor arbeidsbeperkten als bedoeld in
      [artikel 38b, eerste, tweede en zesde lid, en het vijfde lid][ref2], in onvoldoende mate is toegenomen ten opzichte
      van het aantal van deze banen op 1 januari 2013, waarbij dit apart wordt beoordeeld voor de sector overheid
      onderscheidenlijk de sector niet-overheid.

      2 In afwijking van het eerste lid wordt de quotumheffing, bedoeld in [hoofdstuk 3, afdeling 4, paragraaf 4a][ref3],
      niet uitgevoerd indien hiertoe bij regeling van Onze Minister, in overeenstemming met het gevoelen van de
      ministerraad, is besloten, indien is gebleken dat het aantal banen voor arbeidsbeperkten als bedoeld in
      [artikel 38b, eerste, tweede en zesde lid, en het vijfde lid][ref4], in voldoende mate is toegenomen ten opzichte
      van het aantal van deze banen op 1 januari 2013, waarbij dit apart wordt beoordeeld voor de sector overheid
      onderscheidenlijk de sector niet-overheid.

      3 Bij regeling van Onze Minister wordt ten behoeve van de vaststelling van de toename, bedoeld in het eerste en
      tweede lid, het aantal banen bepaald voor arbeidsbeperkten, bedoeld in het eerste en tweede lid, uitgedrukt in
      verloonde uren op 1 januari 2013 voor de sector overheid onderscheidenlijk de sector niet-overheid en wordt voor de
      desbetreffende sector voor het desbetreffende kalenderjaar, bepaald:

      a. het cumulatief aantal extra te realiseren banen voor deze arbeidsbeperkten uitgedrukt in verloonde uren;

      b. het cumulatief aantal gerealiseerde banen voor deze arbeidsbeperkten uitgedrukt in verloonde uren, en

      c. de uitkomst van de vergelijking tussen het cumulatief aantal banen, bedoeld in de onderdelen a en b, uitgedrukt
      in verloonde uren.

      4 Voor de toepassing van het derde lid wordt niet als arbeidsbeperkte beschouwd de persoon die arbeid verricht in
      een dienstbetrekking in de zin van [artikel 2 van de Wet sociale werkvoorziening][ref5], tenzij deze persoon op
      grond van het vijfde lid is aangewezen en aan de werkgever in de sector overheid onderscheidenlijk de sector niet-
      overheid ter beschikking is gesteld.

      5 Bij regeling van Onze Minister worden categorieën arbeidsbeperkten die aan de werkgever in de sector overheid
      onderscheidenlijk de sector niet-overheid ter beschikking zijn gesteld om voor hem onder zijn toezicht en
      leiding arbeid te verrichten, aangewezen die overeenkomstig die regeling te stellen regels worden beschouwd
      als arbeidsbeperkten waarop het derde lid van toepassing is. Deze categorieën arbeidsbeperkten worden voor de
      toepassing van het derde lid niet geacht in dienstbetrekking te staan tot de werkgever in de sector overheid
      onderscheidenlijk de sector niet-overheid die deze arbeidsbeperkten ter beschikking heeft gesteld.

      6 Een krachtens het eerste lid vastgestelde ministeriële regeling wordt gelijktijdig aan de beide kamers
      der Staten-Generaal overgelegd. De ministeriële regeling treedt niet eerder in werking dan vier weken na de
      overlegging.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
