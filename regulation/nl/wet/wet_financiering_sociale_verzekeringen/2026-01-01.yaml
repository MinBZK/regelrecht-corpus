  - number: 76a
    text: |-
      1 De premie voor de vrijwillige verzekering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref1] wordt berekend over het dagloon, bedoeld in
      [artikel 21, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2].

      2 De premie bedraagt een door het UWV te bepalen percentage van het in het eerste lid bedoelde dagloon, met dien
