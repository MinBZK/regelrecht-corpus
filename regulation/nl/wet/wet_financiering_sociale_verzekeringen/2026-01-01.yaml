  - number: 91a
    text: |-
      1 De zorgautoriteit kan besluiten uitgaven voor zorg die door of namens een Wlz-uitvoerder als bedoeld in
      [artikel 1.1.1 van de Wet langdurige zorg][ref1], zijn gedaan en geen kosten van zorg of overige prestaties die
      op grond van de Wet langdurige zorg worden verstrekt of kosten ter uitvoering van die wet betreffen, in stand te
      laten.

      2 De zorgautoriteit kan besluiten uitgaven voor persoonsgebonden budgetten als bedoeld in de
      [Wet langdurige zorg][ref2] die geen kosten van zorg en overige prestaties betreffen die op grond van de Wet
      langdurige zorg worden verstrekt, in stand te laten.

      3 De zorgautoriteit kan toepassing geven aan het eerste of tweede lid voor bepaalde gevallen of, met gebruik van
      nieuwe regels waarvan het tijdstip van inwerkingtreding is vastgesteld, voor groepen van gevallen.

      4 De zorgautoriteit weegt bij een besluit over toepassing van het eerste of tweede lid af of het belang van de
      uitvoering van de zorgplicht voor de verzekerden en de handelwijze van de betrokken Wlz-uitvoerder dan wel Wlz-
      uitvoerders daartoe aanleiding geven.

      5 De zorgautoriteit kan over een kalenderjaar toepassing geven aan het eerste lid voor ten hoogste een procent van
      het bedrag, bedoeld in [artikel 49e, derde lid, onderdeel a, van de Wet marktordening gezondheidszorg][ref3] voor
      dat kalenderjaar.

      6 De zorgautoriteit kan over een kalenderjaar toepassing geven aan het tweede lid voor ten hoogste een procent van
      het bedrag dat op grond van [artikel 49e, derde lid, onderdeel b, van de Wet marktordening gezondheidszorg][ref4],
      voor dat kalenderjaar.

      7 De zorgautoriteit vraagt voorafgaand aan een toepassing van het eerste of tweede lid indien die een uitleg
      van het op grond van de [Wet langdurige zorg][ref5] verzekerde pakket vergt, advies aan het Zorginstituut of de
      uitgaven al dan niet kosten van zorg en overige prestaties betreffen die op grond van de Wet langdurige zorg worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0035917
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel49e
      [ref4]: https://wetten.overheid.nl/BWBR0020078#Artikel49e
      [ref5]: https://wetten.overheid.nl/BWBR0035917
