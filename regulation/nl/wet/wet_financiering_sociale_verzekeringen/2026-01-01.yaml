  - number: 122na
    text: |-
      1 Nadat bij regeling van Onze Minister op grond van [artikel 122n, eerste lid][ref1], tot invoering van
      de quotumheffing voor de betreffende sector is besloten, wordt de quotumheffing, in afwijking van de
      [artikelen 38e, eerste lid][ref2], en 122n, eerste lid, niet uitgevoerd met betrekking tot kalenderjaren die zijn
      gelegen vóór het tijdstip van inwerkingtreding van [artikel 2 van de Wet banenafspraak][ref3].

      2 Ten aanzien van een kalenderjaar waarover de quotumheffing op grond van het eerste lid niet wordt uitgevoerd,
      wordt met overeenkomstige toepassing van [artikel 38f][ref4] een quotumpercentage vastgesteld voor de sector
      overheid, onderscheidenlijk voor de sector niet-overheid.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel122n
