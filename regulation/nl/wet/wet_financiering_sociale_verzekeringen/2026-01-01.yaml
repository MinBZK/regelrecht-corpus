  - number: '114'
    text: |-
      Ten gunste van het Arbeidsongeschiktheidsfonds komen:

      a. de premies op grond van de [artikelen 36][ref1], [75][ref2], [76][ref3], en [76a][ref4];

      b. de gelden die het UWV ontvangt door toepassing van de [artikelen 29a][ref5] en
      [91i van de Wet op de arbeidsongeschiktheidsverzekering][ref6];

      c. de gelden die het UWV ontvangt door toepassing van de [artikelen 57][ref7] en
      [90 van de Wet op de arbeidsongeschiktheidsverzekering][ref8] in verband met uitkeringen als bedoeld in
      [artikel 115, eerste lid, onderdeel a][ref9];

      d. de quotumheffing, bedoeld in [artikel 38h][ref10];

      e. de gelden die het UWV ontvangt door toepassing van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref11];

      f. een rijksbijdrage ter hoogte van het door Onze Minister geraamde bedrag aan lasten en uitvoeringskosten als
      bedoeld in [artikel 115, eerste lid, onderdelen c en r][ref12], voor zover deze lasten en uitvoeringskosten
      betrekking hebben op de op grond van [hoofdstuk 3, afdeling 2, paragraaf 2][ref13], en de op grond van
      [artikel 3:30 van de Wet arbeid en zorg][ref14] te betalen uitkeringen;

      g. de gelden die het UWV ontvangt door toepassing van de [artikelen 86][ref15] en
      [91 van de Wet werk en inkomen naar arbeidsvermogen][ref16];

      h. de gelden die het UWV ontvangt door toepassing van de [artikelen 76][ref17] en
      [99 van de van de Wet werk en inkomen naar arbeidsvermogen][ref18];

      i. de bijdragen van de werkgever of de eigenrisicodrager of de werknemer in de kosten van het onderzoek, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _;

      j. de bedragen die het UWV ontvangt door toepassing van de [artikelen 38, derde lid][ref20],
      [38a, achtste lid][ref21], [39a][ref22], [45a][ref23], [63a, derde tot en met vijfde lid][ref24],
      [63b, tweede lid][ref25], [63c, tweede lid][ref26], en [63e, van de Ziektewet][ref27];

      k. de bedragen die UWV ontvangt door toepassing van
      [artikel 673e, vijfde lid, van Boek 7 van het Burgerlijk Wetboek][ref28], voor zover het niet betreft
      onverschuldigd betaalde vergoedingen als bedoeld in [artikel 100, onderdeel f][ref29];

      l. de gelden die UWV ontvangt door toepassing van de [Wet arbeid en zorg][ref30].


