  - number: '91'
    text: |-
      1 Het Zorginstituut doet jaarlijks uitkeringen uit het Fonds langdurige zorg ter dekking van de noodzakelijke
      uitgaven van:

      a. Wlz-uitvoerders als bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref1] voor beheerskosten
      ter uitvoering van die wet of voor kosten van verleende zorg en overige diensten als bedoeld in
      [paragraaf 3.1 van die wet][ref2] die niet door het CAK, genoemd in [artikel 6.1.1 van die wet][ref3], aan
      zorgaanbieders als bedoeld in artikel 1.1.1 van die wet worden uitbetaald;

      b. SVB voor kosten ter uitvoering van de Wet langdurige zorg.

      2 Het Zorginstituut doet de uitkeringen, bedoeld in het eerste lid, volgens bij of krachtens algemene
      maatregel van bestuur te stellen regels. Bij of krachtens deze algemene maatregel van bestuur kunnen
      tevens regels worden gesteld over de vorming en aanwending van reserves door Wlz-uitvoerders als bedoeld in
      [artikel 1.1.1, van de Wet langdurige zorg][ref4] en de SVB.

      3 De zorgautoriteit is bevoegd vast te stellen dat uitgaven niet verantwoord waren voor zover deze door haar niet
      noodzakelijk worden geacht voor de uitvoering van de verzekering op grond van de [Wet langdurige zorg][ref5]. Met
      de uitkeringen, bedoeld in het eerste lid, evenals met de daarmee verkregen opbrengsten worden geen uitgaven gedekt
      waarvan de zorgautoriteit heeft vastgesteld dat zij niet verantwoord waren, tenzij de zorgautoriteit die op grond
      van artikel 91a in stand laat.

      4 Op de uitkeringen, bedoeld in het eerste lid, kunnen voorschotten worden verleend overeenkomstig door het
      Zorginstituut te stellen regels,

      5 Op rechten of verplichtingen die voortvloeien uit hetgeen op grond van dit artikel is geregeld, is
      [titel 4.2 van de Algemene wet bestuursrecht][ref6] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel1.1.1
