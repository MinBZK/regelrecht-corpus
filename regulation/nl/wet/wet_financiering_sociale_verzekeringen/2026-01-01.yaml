  - number: '85'
    text: |-
      1 Ten gunste van het Nabestaandenfonds komen:

      a. de premies voor de nabestaandenverzekering en voor de vrijwillige nabestaandenverzekering alsmede de te
      ontvangen bijdragen op grond van [artikel 66a van de Algemene nabestaandenwet][ref1] en de daarop berustende
      bepalingen;

      b. de bestuurlijke boeten, bedoeld in [artikel 39 van de Algemene nabestaandenwet][ref2];

      c. de bijdrage in de kosten van de heffingskortingen, bedoeld in [artikel 15][ref3].

      2 Uit het Nabestaandenfonds worden betaald:

      a. de lasten van de nabestaandenverzekering en van de vrijwillige nabestaandenverzekering;

      b. de lasten voortvloeiend uit [hoofdstuk 8 van de Algemene nabestaandenwet][ref4] en de daarop berustende
      bepalingen;

      c. de lasten van de tegemoetkomingen, bedoeld in [artikel 29a van de Algemene nabestaandenwet][ref5], en de daaraan
      verbonden uitvoeringskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel66a
