  - number: 38a
    text: |-
      1 In afwijking van [artikel 38][ref1] is over een uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref2], de [Wet op de arbeidsongeschiktheidsverzekering][ref3],
      de [Ziektewet][ref4], [hoofdstuk 3, afdeling 2, paragraaf 1][ref5],
      of de [artikelen 4:2b, eerste tot en met zesde lid][ref6], en
      [6:3, eerste tot en met zesde lid, van de Wet arbeid en zorg][ref7], de [Werkloosheidswet][ref8],
      over een toeslag op grond van de [Toeslagenwet][ref9] en over het loon uit een dienstbetrekking
      op grond van de [Wet sociale werkvoorziening][ref10], als gedifferentieerde premie ten
      behoeve van de Werkhervattingskas een vervangende premie verschuldigd. Met een uitkering
      op grond van de Werkloosheidswet wordt gelijkgesteld een wachtgeld als bedoeld in
      [artikel 1, onderdeel r, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref11].

      2 Behalve voor degene die loon ontvangt uit een dienstbetrekking op grond van de
      [Wet sociale werkvoorziening][ref12] wordt het eerste lid niet toegepast ingeval het UWV de uitkering,
      vermeerderd met de daarover door de werkgever verschuldigde premies en de inkomensafhankelijke bijdrage,
      bedoeld in [artikel 42 van de Zorgverzekeringswet][ref13], betaalt aan de werkgever, bedoeld in
      [artikel 11 van de Wet werk en inkomen naar arbeidsvermogen][ref14] en in [artikel 9][ref15], [10][ref16]
      of [12 van de Werkloosheidswet][ref17] en de [Ziektewet][ref18], onafhankelijk van het voortbestaan van de
      dienstbetrekking met die werkgever.

      3 Het eerste lid wordt eveneens niet toegepast ingeval een eigenrisicodrager de
      uitkering, bedoeld in [artikel 63a Ziektewet][ref19], betaalt of de uitkering, bedoeld in
      [artikel 82 van de Wet werk en inkomen naar arbeidsvermogen][ref20], betaalt, onafhankelijk van het voortbestaan
      van de dienstbetrekking met die eigenrisicodrager.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de wijze waarop de vervangende premie,
      bedoeld in het eerste lid, wordt vastgesteld.


