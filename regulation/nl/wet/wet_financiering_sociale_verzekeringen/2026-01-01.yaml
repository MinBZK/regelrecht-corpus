  - number: '75'
    text: |-
      1 De premie voor de vrijwillige verzekering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt berekend over het dagloon, bedoeld in
      [artikel 84, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2].

      2 De premie bedraagt een door het UWV te bepalen percentage van het in het eerste lid bedoelde dagloon, met dien
      verstande dat de premie niet meer bedraagt dan het hoge krachtens [artikel 36, eerste lid][ref3], vastgestelde
      percentage voor de in dat artikel bedoelde gedifferentieerde premie voor het Arbeidsongeschiktheidsfonds.


