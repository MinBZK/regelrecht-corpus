      percentage voor de in dat artikel bedoelde gedifferentieerde premie voor het Arbeidsongeschiktheidsfonds,
      vermeerderd met een premieopslag die wordt berekend op grond van het in [artikel 38, tweede lid][ref4], bedoelde
      percentage.


