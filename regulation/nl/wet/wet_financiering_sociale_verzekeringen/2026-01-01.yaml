  - number: '89'
    text: Het Zorginstituut beheert en administreert afzonderlijk een Fonds langdurige zorg.
    url: https://wetten.overheid.nl/BWBR0017745/2026-01-01#Artikel89
  - number: '90'
    text: |-
      1 Ten gunste van het Fonds langdurige zorg komen:

      a. de premie voor de verzekering ingevolge de [Wet langdurige zorg][ref1];

      b. de inkomsten die in verband met de [Wet langdurige zorg][ref2] voortvloeien uit internationale overeenkomsten;

      c. de bijdragen in de kosten van zorg die op grond van [artikel 3.2.5][ref3] of
      [11.1.4 van de Wet langdurige zorg][ref4] worden betaald door of namens de verzekerde, dan wel, in voorkomend
      geval, door het krachtens een wettelijke regeling tot betaling van zodanige bijdragen bevoegde orgaan dat
      uitkeringen of pensioenen uit hoofde van die regeling aan die verzekerde betaalbaar stelt;

      d. de bijdragen in de kosten van de heffingskortingen, bedoeld in [artikel 15][ref5];

      e. een rijksbijdrage als bedoeld in [artikel 14, tweede lid][ref6];

      f. door zorgaanbieders ingevolge een regel van de zorgautoriteit op grond van
      [artikel 37, eerste lid, aanhef en onder d, van de Wet marktordening gezondheidszorg][ref7] dan wel op aanwijzing
      van de zorgautoriteit op grond van [artikel 76, tweede lid, van die wet][ref8] afgedragen bedragen en door de
      zorgautoriteit van zorgaanbieders op grond van [artikel 81, eerste lid, onder c, van die wet][ref9] ingevorderde
      bedragen, voor zover die bedragen niet worden afgedragen aan het Zorgverzekeringsfonds of aan derden.

      2 Uit het Fonds langdurige zorg worden betaald:

      a. de kosten van de zorg en van de overige prestaties die op grond van de [Wet langdurige zorg][ref10] worden
      verstrekt, alsmede de met de uitvoering van die wet gepaard gaande kosten;

      b. de uitgaven voor de verzekering ingevolge de [Wet langdurige zorg][ref11] die voortvloeien uit overeenkomsten,
      waaronder internationale overeenkomsten;

      c. de uitgaven die in verband met de verzekering ingevolge de [Wet langdurige zorg][ref12] voorvloeien uit enige
      andere wettelijke regeling dan laatstgenoemde wet;

      d.

      e. een uitkering als bedoeld in [artikel 3.2.8, tweede lid, van de Wet langdurige zorg][ref13];

      f. de kosten die de Sociale verzekeringsbank maakt voor de uitvoering van de taak, bedoeld in
      [artikel 3.3.3, zevende lid, van de Wet langdurige zorg][ref14];

      g. bedragen als bedoeld in [artikel 56a van de Wet marktordening gezondheidszorg][ref15];

      h. de door het Zorginstituut op grond van een ministeriële regeling vastgestelde verdeelbedragen, zijnde aan de
      relevante zorgverzekeraars toegekende delen van de bedragen bedoeld in onderdeel f van het eerste lid;

      i. de vergoedingen, bedoeld in [artikel 123, zesde en achtste lid, van de Zorgverzekeringswet][ref16] voor zover
      het zorg in de zin van de [Wet langdurige zorg][ref17] betreft;

      j. de kosten van maatregelen als bedoeld in [artikel 4.2.4, zesde lid, van de Wet langdurige zorg][ref18];

      k. de lasten, bedoeld in [artikel 4.3.1, tweede lid, van de Wet langdurige zorg][ref19];

      l. de door de zorgautoriteit op grond van artikel 91a in stand gelaten uitgaven.


