  - number: 38d
    text: |-
      1 Het UWV draagt zorg voor de inrichting en de adequate werking van de registratie van arbeidsbeperkten en is de
      verwerkingsverantwoordelijke in de zin van artikel 4, onderdeel 7, van de Algemene verordening gegevensbescherming
      met betrekking tot de verwerking van gegevens, waaronder persoonsgegevens als bedoeld in die verordening, ten
      behoeve van deze registratie.

      2 Het UWV verwerkt in de registratie, bedoeld in het eerste lid, de gegevens over arbeidsbeperkten met het oog op
      het bevorderen van de arbeidsdeelname van deze personen en ten behoeve van de vaststelling van de quotumheffing,
      bedoeld in [artikel 38h][ref1].

      3 Het college van burgemeester en wethouders verstrekt het UWV uit eigen beweging
      en verplicht op verzoek kosteloos de gegevens over de arbeidsbeperkten, bedoeld in
      [artikel 38b, eerste lid, onderdelen a, b, d en e, en tweede lid][ref2], die noodzakelijk zijn voor de
      gegevensverwerking, bedoeld in het eerste lid.

      4 Het UWV verstrekt het college van burgemeester en wethouders en de belastingdienst uit eigen beweging en
      verplicht op verzoek kosteloos gegevens uit de registratie, bedoeld in het eerste lid, die noodzakelijk zijn voor
      de uitvoering van hun taken.

      5 Het UWV is bevoegd gegevens die het verwerkt voor de uitvoering van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3] en voor de uitvoering van de taak, bedoeld in
      [artikel 30d van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4], te verwerken ten behoeve van de
      registratie, bedoeld in het eerste lid.

      6 Het UWV en de belastingdienst zijn bevoegd de gegevens, die zij verwerken in de polisadministratie op grond
      van [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] tevens te verwerken voor zover
      deze noodzakelijk zijn voor de bevordering van arbeidsdeelname van arbeidsbeperkten en voor de vaststelling van de
      quotumheffing, bedoeld in [artikel 38h][ref6].

      7 Het UWV deelt op verzoek aan een werkgever over een door middel van het burgerservicenummer aangeduide persoon
      mede:

      a. of de door de werkgever aangeduide werknemer, persoon met wie hij verwacht een dienstbetrekking aan te gaan,
      of persoon die onder zijn toezicht en leiding arbeid verricht of ter beschikking is gesteld als bedoeld in
      [artikel 38g, tweede lid][ref7], is opgenomen in de registratie, bedoeld in het eerste lid; of

      b. gedurende welke periode in een lopend kalenderjaar of in het voorgaande kalenderjaar deze persoon is opgenomen
      in de registratie, bedoeld in [artikel 38d, eerste lid][ref8].

      8 Het college van burgemeester en wethouders en het UWV informeren de persoon op wie de gegevens betrekking
      hebben over de verwerking van zijn gegevens op grond van dit artikel voordat de gegevens worden vastgelegd in de
      registratie, bedoeld in het eerste lid, of worden verstrekt met het oog op die vastlegging, tenzij deze persoon
      redelijkerwijs hiervan kennis draagt.

      9 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld, in ieder geval met betrekking tot:

      a. de inrichting, de gegevensset en de wijze van verkrijging van de gegevens ten behoeve van de registratie,
      bedoeld in het eerste lid,

      b. de geldigheidsduur van de registratie van de persoon en het vervallen van de registratie van de persoon, en

      c. de vaststelling, bedoeld in [artikel 38b, eerste lid, onderdelen a en e][ref9], ten behoeve van de opname van
      personen in de registratie, bedoeld in het eerste lid.

      10 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot:

      a. de ambtshalve verstrekking door het UWV van gegevens uit de registratie, bedoeld in het eerste lid, aan
      werkgevers als bedoeld in het zevende lid;

      b. de verstrekking van gegevens aan het UWV door werkgevers als bedoeld in het zevende lid in verband met het
      verrichten van arbeid door arbeidsbeperkten als bedoeld in [artikel 38g, tweede en vierde lid][ref10].


