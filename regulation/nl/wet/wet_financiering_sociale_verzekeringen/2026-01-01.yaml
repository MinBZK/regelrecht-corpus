  - number: '10'
    text: |-
      1 De premie voor de volksverzekeringen wordt vastgesteld op de som van de percentages bedoeld in [artikel 11][ref1]
      van het premie-inkomen.

      2 Tot de premie, bedoeld in het eerste lid, behoort met ingang van de eerste dag van de maand waarin de verzekerde
      de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], zal
      bereiken niet de premie voor de algemene ouderdomsverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel11
