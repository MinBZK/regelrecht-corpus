  - number: '38'
    text: |-
      1 In dit artikel wordt onder *categorie werkgevers* verstaan:

        - werkgevers ten laste van wie, in het tweede kalenderjaar dat aan het kalenderjaar waarvoor de premie wordt
      vastgesteld vooraf is gegaan, loon waarover de premies op grond van dit hoofdstuk worden geheven, is gekomen
      dat gelijk is aan, meer of minder bedraagt dan een bij algemene maatregel van bestuur te bepalen omvang van het
      gemiddelde van dit loon, bedoeld in [paragraaf 1 van afdeling 1 van dit hoofdstuk][ref1], per werknemer in dat
      kalenderjaar.

      2 Het UWV stelt voor de berekening van de gedifferentieerde premie een voor alle takken van bedrijf en beroep
      gelijk gemiddeld percentage vast.

      3 Elk jaar wordt met ingang van 1 januari een opslag of korting vastgesteld waarmee het in het tweede lid bedoelde
      percentage wordt verhoogd respectievelijk verlaagd. Bij of krachtens algemene maatregel van bestuur kan worden
      bepaald dat de opslag of korting naar categorie werkgevers voor de werkgever afzonderlijk of per sector als
      bedoeld in [artikel 95][ref2], wordt vastgesteld, waarbij de korting of opslag voor werkgevers per sector of
      sectoronderdelen kan verschillen of op nihil kan worden vastgesteld. Indien een werkgever met toepassing van de
      [artikelen 96][ref3] of [97][ref4] is aangesloten bij verschillende sectoren, wordt voor elk bedrijfsonderdeel
      van de werkgever waar werkzaamheden worden verricht die behoren tot een afzonderlijke sector, de opslag of
      korting toegepast als was dat bedrijfsonderdeel een afzonderlijke werkgever. Voor de werkgever voor wie de
      korting of opslag afzonderlijk wordt vastgesteld, stelt de inspecteur de korting of opslag vast bij voor bezwaar
      vatbare beschikking. Ten aanzien van werkgevers voor wie de opslag of korting per sector wordt vastgesteld kan
      in bijzondere gevallen bij regeling van Onze Minister worden bepaald dat de opslag of korting op een door Onze
      Minister te bepalen wijze wordt vastgesteld aan de hand van het gemiddelde van de opslag of korting van een aantal
      sectoren.

      4 De inspecteur stelt in geval van overgang van een onderneming in de zin van
      [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref5], alsmede in geval van een dergelijke overgang bij
      faillissement, de vastgestelde opslag of korting, bedoeld in het derde lid, opnieuw bij voor bezwaar vatbare
      beschikking vast voor de werkgever die een onderneming of een deel daarvan verkrijgt en voor de werkgever die een
      deel van zijn onderneming overdraagt.

      5 Indien de werkgever een overheidswerkgever is op wie [artikel 7:662 van het Burgerlijk Wetboek][ref6] niet van
      toepassing is, en deze geheel of gedeeltelijk is overgegaan naar een andere werkgever, alsmede in geval van een
      dergelijke overgang bij faillissement, stelt de inspecteur de vastgestelde opslag of korting, bedoeld in het derde
      lid, opnieuw vast bij voor bezwaar vatbare beschikking voor:

      a. de rechtsopvolger van die overheidswerkgever dan wel de verkrijger van een deel daarvan, en

      b. voor de overheidswerkgever die een deel van de organisatie overdraagt.

      Het bepaalde bij of krachtens het zevende lid, inzake de in het derde, vierde en vijfde lid bedoelde opslag en
      korting is van overeenkomstige toepassing.

      6 De inspecteur stelt, in geval aan een werkgever toestemming is verleend om zelf het risico te dragen van betaling
      van ziekengeld of WGA-uitkering en overlijdensuitkeringen als bedoeld in [artikel 40, eerste lid][ref7], alsmede
      in geval het door de werkgever zelf dragen van het risico, bedoeld in artikel 40, eerste lid, is geëindigd of
      wordt beëindigd, de vastgestelde opslag of korting, bedoeld in het derde lid, opnieuw bij voor bezwaar vatbare
      beschikking vast met ingang van de datum waarop het zelf dragen van het risico aanvangt dan wel is geëindigd of
      wordt beëindigd.

      7 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:

      a. de wijze waarop het gemiddelde percentage, bedoeld in het tweede lid, wordt vastgesteld, rekening houdend met de
      verschillende lasten voor de Werkhervattingskas;

      b. de wijze waarop de in het derde en het vierde lid, bedoelde opslag en korting worden berekend;

      c. de percentages die op grond van dit artikel ten hoogste voor categorieën van werkgevers, sector of
      sectoronderdeel mogen gelden en omtrent de percentages die op grond van dit artikel ten minste voor categorieën van
      werkgevers, sector of sectoronderdeel gelden.

      8 De inspecteur is bevoegd tot herziening van een beschikking op grond van dit artikel indien enig feit grond
      oplevert voor het vermoeden dat de beschikking is gegeven op grond van onjuiste of onvolledige gegevens. Een
      herziening ten nadele van de werkgever is uitsluitend mogelijk indien deze tekortkoming een gevolg is van een feit
      dat aan de werkgever of de gewezen werkgever kan worden toegerekend of redelijkerwijs kenbaar had kunnen zijn.
      De inspecteur stelt de herziening vast bij voor bezwaar vatbare beschikking. De bevoegdheid tot herziening werkt
      uiterlijk terug tot en met 1 januari van enig jaar waarop de beschikking betrekking heeft en vervalt door verloop
      van 5 jaren na het einde van het kalenderjaar waarop de beschikking betrekking heeft.

      9 Beschikkingen van de inspecteur op grond van dit artikel worden genomen gehoord het UWV en in overeenstemming met
      het UWV.


