        afdeling: '2'
  - number: '83'
    text: |-
      1 Ten gunste van het Ouderdomsfonds komen:

      a. de premies voor de algemene ouderdomsverzekering en voor de vrijwillige algemene ouderdomsverzekering;

      b. rijksbijdragen als bedoeld in [artikel 14][ref1];

      c. de bestuurlijke boeten, bedoeld in [artikel 17c van de Algemene Ouderdomswet][ref2];

      d. de bijdrage in de kosten van de heffingskortingen, bedoeld in [artikel 15][ref3].

      2 Uit het Ouderdomsfonds worden betaald:

      a. de lasten van de algemene ouderdomsverzekering en van de vrijwillige algemene ouderdomsverzekering;

      b. de lasten van de regeling, vervat in [hoofdstuk VIII van de Algemene Ouderdomswet][ref4];

      c. de bijdrage, bedoeld in [artikel 87a][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel17c
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel15
