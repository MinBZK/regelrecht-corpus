        bwb_id: BWBR0004045
  - number: '26'
    text: De maatstaf voor de heffing van de premie is het loon.
    url: https://wetten.overheid.nl/BWBR0017745/2026-01-01#Artikel26
  - number: '27'
    text: |-
      1 De premie, bedoeld in [artikel 23][ref1], wordt bij regeling van Onze Minister vastgesteld op een
      percentage van het loon dat voor categorieën van werknemers naar de aard van hun arbeidsovereenkomst
      verschilt, waarbij onderscheid wordt gemaakt in een lage premie voor werknemers met een schriftelijke
      arbeidsovereenkomst voor onbepaalde tijd niet zijnde een oproepovereenkomst als bedoeld in
      [artikel 628a, negende en tiende lid, van Boek 7 van het Burgerlijk Wetboek][ref2], en een hoge premie voor overige
      werknemers. Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het verschil tussen
      de hoge en de lage premie en over de gevallen waarin in afwijking van de eerste zin met terugwerkende kracht de
      hoge premie van toepassing is. Voorts kunnen bij of krachtens algemene maatregel van bestuur nadere voorwaarden
      worden gesteld aan de toepassing van de premie en over de wijze waarop de lage premie wordt herzien in de gevallen
      waarin met terugwerkende kracht de hoge premie van toepassing is.

      2 De premie, bedoeld in [artikel 23][ref3], over een uitkering op grond van de
      [Werkloosheidswet][ref4], de [Ziektewet][ref5], de [Wet werk en inkomen naar arbeidsvermogen][ref6],
      de [Wet op de arbeidsongeschiktheidsverzekering][ref7], [hoofdstuk 3, afdeling 2, paragraaf 1][ref8],
      of de [artikelen 4:2b, eerste tot en met zesde lid][ref9], en
      [6:3, eerste tot en met zesde lid, van de Wet arbeid en zorg][ref10] aan de werknemer of gelijkgestelde, bedoeld
      in [artikel 3:6, eerste lid, van die wet][ref11], en over een toeslag op grond van de [Toeslagenwet][ref12] wordt
      vastgesteld op het percentage van de lage premie, bedoeld in het eerste lid.

      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorwaarden worden gesteld aan de toepassing van de
      eerste zin.

      3 In afwijking van het eerste lid is het percentage van de lage premie, bedoeld in het eerste lid, van toepassing
      indien het een werknemer betreft die

      a. de beroepspraktijkopleiding volgt van de beroepsbegeleidende leerweg van een beroepsopleiding als bedoeld
      in [artikel 7.2.2, eerste lid, onderdelen a tot en met e, van de Wet educatie en beroepsonderwijs][ref13], op
      de grondslag van een schriftelijke, in de administratie van de werkgever opgenomen overeenkomst als bedoeld in
      [artikel 7.2.8 van die wet][ref14], gesloten door de partijen, genoemd in [artikel 7.2.9 van die wet][ref15]; of

      b. de leeftijd van 21 jaar nog niet heeft bereikt, mits het aantal verloonde uren in het aangiftetijdvak van vier
      weken niet meer bedraagt dan 48 uur, dan wel in het aangiftetijdvak van een maand niet meer bedraagt dan 52 uur.

      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorwaarden worden gesteld aan de toepassing van de
      eerste zin.

      4 Het bezwaar of beroep van een werkgever tegen een besluit dat met terugwerkende kracht de hoge premie van
      toepassing is, als bedoeld in het eerste lid, kan niet zijn gegrond op de grief dat een uitkering op grond van de
      [Werkloosheidswet][ref16] ten onrechte of tot een te hoog bedrag is vastgesteld.


