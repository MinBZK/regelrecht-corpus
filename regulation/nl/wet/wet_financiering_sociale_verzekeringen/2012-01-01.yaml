  - number: '35'
    text: De maatstaf voor de heffing van de premie is het loon.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel35
  - number: '36'
    text: |-
      Bij ministeriële regeling wordt voor de berekening van de basispremie een voor alle takken van bedrijf en beroep
      gelijk percentage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel36
  - number: '38'
    text: |-
      1 Het UWV stelt vast:

      a. voor de berekening van de gedifferentieerde premie ten behoeve van de Werkhervattingskas, een voor alle takken
      van bedrijf en beroep gelijk rekenpercentage;

      b. voor de berekening van het rekenpercentage, bedoeld in onderdeel a, een voor alle takken van bedrijf en beroep
      gelijk gemiddeld percentage.

      2 Elk jaar wordt met ingang van 1 januari een opslag of korting vastgesteld waarmee het in het eerste lid,
      onderdeel a, bedoelde percentage wordt verhoogd respectievelijk verlaagd. Bij of krachtens de algemene maatregel
      van bestuur, bedoeld in het vierde lid, kan worden bepaald dat de opslag of korting voor een werkgever dan wel
      voor categorieën van werkgevers wordt vastgesteld, waarbij de korting of opslag voor categorieën van werkgevers
      kan verschillen of op nihil kan worden vastgesteld. Indien een werkgever met toepassing van de [artikelen 96][ref1]
      of [97][ref2] is aangesloten bij verschillende sectoren, wordt voor elk bedrijfsonderdeel van de werkgever waar
      werkzaamheden worden verricht die behoren tot een afzonderlijke sector, de opslag of korting toegepast als was dat
      bedrijfsonderdeel een afzonderlijke werkgever. Voor de werkgever die niet behoort tot een categorie als bedoeld in
      de tweede zin, stelt de inspecteur de korting of opslag vast bij voor bezwaar vatbare beschikking.

      3 De inspecteur stelt in geval van overgang van een onderneming in de zin van
      [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref3], alsmede in geval van een dergelijke overgang bij
      faillissement, de vastgestelde opslag of korting, bedoeld in het tweede lid, opnieuw bij voor bezwaar vatbare
      beschikking vast voor de werkgever die een onderneming of een deel daarvan verkrijgt en voor de werkgever die een
      deel van zijn onderneming overdraagt.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:

      a. de wijze waarop het rekenpercentage, bedoeld in het eerste lid, onderdeel a, en het gemiddelde percentage,
      bedoeld in het eerste lid, onderdeel b, worden vastgesteld;

      b. de wijze waarop de in het tweede en het derde lid bedoelde opslag en korting worden berekend;

      c. de percentages die op grond van dit artikel ten hoogste voor een werkgever mogen gelden en omtrent de
      percentages die op grond van dit artikel ten minste voor een werkgever moeten gelden.

      5 Beschikkingen van de inspecteur op grond van dit artikel worden genomen gehoord het UWV en in overeenstemming met
      het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel662
