  - number: '48'
    text: |-
      1 De korting, bedoeld in [artikel 47, eerste en tweede lid][ref1], bedraagt € 6 500 per jaar.

      2 Het bedrag van de korting wordt naar evenredigheid verminderd, indien de met die werknemer overeengekomen
      gemiddelde arbeidsduur per week in het tijdvak waarover premie wordt betaald korter is dan de volledige arbeidsduur
      en indien geen vaste arbeidsduur is overeengekomen.

      3 De volledige arbeidsduur wordt gesteld op 36 uur per week.

      4 Voor een werknemer zonder vast overeengekomen arbeidsduur wordt de vermindering bepaald aan de hand van het
      aantal uren waarover de werkgever loon is verschuldigd in het tijdvak waarover premie wordt betaald herleid naar
      weken.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
