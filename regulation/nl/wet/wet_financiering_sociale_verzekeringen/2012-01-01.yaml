  - number: '9'
    text: |-
      De verschuldigde premie voor de volksverzekeringen is de premie voor de volksverzekeringen verminderd met de voor
      de premieplichtige toepasselijke heffingskorting voor de volksverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel9
  - number: '10'
    text: |-
      1 De premie voor de volksverzekeringen wordt vastgesteld op de som van de percentages bedoeld in [artikel 11][ref1]
      van het premie-inkomen.

      2 Tot de premie bedoeld in het eerste lid behoort met ingang van de eerste dag van de maand waarin de verzekerde de
      leeftijd van 65 jaar zal bereiken niet de premie voor de algemene ouderdomsverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel11
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: '11'
    text: |-
      1 Het premiepercentage voor de algemene ouderdomsverzekering wordt bij regeling van Onze Minister vastgesteld. Het
      bedraagt ten hoogste 18,25.

      2 Het premiepercentage voor de nabestaandenverzekering wordt bij regeling van Onze Minister vastgesteld.

      3 Het premiepercentage voor de algemene verzekering bijzondere ziektekosten wordt vastgesteld bij regeling van Onze
      Minister van Volksgezondheid, Welzijn en Sport in overeenstemming met Onze Minister.

      4 Indien een wijziging van een premiepercentage ingaat op een ander tijdstip dan 1 januari, vindt de vaststelling
      plaats in overeenstemming met Onze Minister van Financiën en kunnen daarbij regels worden gesteld omtrent de wijze
      van berekening van de premie over het gehele kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel11
  - number: '12'
    text: |-
      1 De heffingskorting voor de volksverzekeringen is de som van:

      a. indien betrokkene premieplichtig is voor de algemene ouderdomsverzekering: de op grond van
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref1] berekende heffingskorting voor de algemene
      ouderdomsverzekering;

      b. indien betrokkene premieplichtig is voor de nabestaandenverzekering: de op grond van
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref2] berekende heffingskorting voor de nabestaandenverzekering;

      c. indien betrokkene premieplichtig is voor de algemene verzekering bijzondere ziektekosten: de op grond van
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref3] berekende heffingskorting voor de algemene verzekering
      bijzondere ziektekosten.

      2 Indien de premie voor de volksverzekeringen bij wijze van inhouding wordt geheven,
      worden voor de toepassing van het eerste lid de heffingskortingen, genoemd in
      [artikel 8.2 van de Wet inkomstenbelasting 2001][ref4], die geen deel uitmaken van de standaardloonheffingskorting,
      bedoeld in [artikel 21c van de Wet op de loonbelasting 1964][ref5], geacht geen deel uit te maken van de
      standaardheffingskorting, bedoeld in [artikel 8.2 van de Wet inkomstenbelasting 2001][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk8
