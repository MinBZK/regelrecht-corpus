  - number: '50'
    text: |-
      1 De korting, bedoeld in [artikel 49][ref1], bedraagt € 2 042 per jaar.

      2 De korting, bedoeld in [artikel 49][ref2], bedraagt € 454 per jaar indien het loon van de werknemer over het
      kalenderjaar minder dan 50% van het naar een jaarbedrag herleide minimumloon bedraagt zoals dat voor de werknemer
      gold op 1 januari van het desbetreffende kalenderjaar.

      3 Onverminderd het eerste en tweede lid bedraagt de korting, bedoeld in [artikel 49][ref3], € 1 360
      per jaar voor de werknemer die tevens jonggehandicapte is als bedoeld in [artikel 2:3][ref4] of
      [artikel 3:2 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref5], de werknemer, bedoeld in
      [artikel 49, eerste lid, onderdelen e en f][ref6], en voor de werknemer, bedoeld in [artikel 49, eerste lid][ref7],
      die voor zijn zeventiende verjaardag tot de doelgroep van [artikel 49, eerste lid, onderdeel a, c of d][ref8] kon
      worden gerekend.


