  - number: '105'
    text: |-
      1 Het UWV stelt elk jaar voor elk sectorfonds afzonderlijk een maximum vast dat in een kalenderjaar op grond van
      [artikel 104][ref1] ten laste van dat sectorfonds komt.

      2 Bij de vaststelling van het maximum, bedoeld in het eerste lid, blijven buiten beschouwing:

      a. de bedragen die ten laste van een sectorfonds komen op grond van [artikel 104, eerste lid, c, d en i][ref2]; en

      b. de lasten die op grond van [artikel 104, vierde lid][ref3], bij het UWV ten laste van het Algemeen
      Werkloosheidsfonds of het Arbeidsongeschiktheidsfonds in rekening worden gebracht.

      3 Het Uitvoeringsinstituut werknemersverzekeringen stelt elk jaar voor het sectorfonds voor de sector waartoe
      de werkgevers behoren die zich in het kader van de uitoefening van hun bedrijf of beroep bezighouden met het
      ter beschikking stellen van arbeidskrachten aan een derde om krachtens een door deze aan de werkgever verstrekte
      opdracht arbeid te verrichten onder leiding en toezicht van de derde, waarbij die arbeidskrachten werkzaam zijn
      op basis van een uitzendovereenkomst als bedoeld in [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref4],
      waarin tevens een beding als bedoeld in [artikel 691, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref5]
      is opgenomen, een maximum vast dat in een kalenderjaar ten laste van het sectorfonds komt, voorzover het
      betrekking heeft op de uitkeringen, bedoeld in [artikel 104, eerste lid, onderdeel c][ref6], respectievelijk
      [artikel 104, eerste lid, onderdeel d][ref7]. Dat maximum bedraagt per kalenderjaar 75 procent van het
      bedrag in dat kalenderjaar van die uitkeringen, de uitvoeringskosten met betrekking tot die uitkeringen
      en de op grond van enige wet over die uitkeringen verschuldigde premies of vergoedingen als bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref8] die niet op die uitkeringen in mindering kunnen worden gebracht.

      4 Indien een of meer werkgevers eigenrisicodrager zijn als bedoeld in
      [artikel 40, eerste lid, onderdeel a of c][ref9], kan Onze Minister het deel van de premie dat ten gunste komt
      van het desbetreffende sectorfonds maximeren, voorzover dat deel betrekking heeft op de uitkeringen, bedoeld in
      [artikel 104, eerste lid, onderdeel c][ref10], respectievelijk [artikel 104, eerste lid, onderdeel d][ref11],
      alsmede de uitvoeringskosten met betrekking tot die uitkeringen en de op grond van enige wet over die uitkeringen
      verschuldigde premies of vergoedingen als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref12] die niet op die
      uitkeringen in mindering kunnen worden gebracht.

      5 Het door het UWV vastgestelde maximum, bedoeld in het eerste en derde lid, behoeft de goedkeuring van Onze
      Minister. Indien Onze Minister zijn goedkeuring onthoudt aan het door het UWV vastgestelde maximum, stelt hij dat
      zelf vast.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
