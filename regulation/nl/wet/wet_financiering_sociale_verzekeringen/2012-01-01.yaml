  - number: '34'
    text: |-
      1 De premie is verschuldigd door werkgevers in de zin van de [Wet werk en inkomen naar arbeidsvermogen][ref1] en
      bestaat uit een basispremie en een gedifferentieerde premie.

      2 In afwijking van [artikel 20, tweede lid][ref2], kan de werkgever de met betrekking tot een werknemer door hem
      verschuldigde gedifferentieerde premie ten behoeve van de Werkhervattingskas, bedoeld in [artikel 38][ref3], onder
      bij ministeriële regeling te bepalen voorwaarden, tot ten hoogste de helft verhalen op de werknemer.


