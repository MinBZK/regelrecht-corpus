  - number: '115'
    text: |-
      1 Ten laste van het Arbeidsongeschiktheidsfonds komen, met inachtneming van de [artikelen 56][ref1], [104][ref2],
      [108][ref3] en [117b][ref4] en [artikel 5:3 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref5]:

      a. de door het UWV op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref6] te betalen uitkeringen;

      b. de door het UWV op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7] te betalen
      uitkeringen;

      c. de op grond van [hoofdstuk 3, afdeling 2, paragraaf 2][ref8], en de op grond van
      [artikel 3:30 van de Wet arbeid en zorg][ref9] te betalen uitkeringen;

      d. de door het UWV op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref10] te betalen uitkeringen;

      e. de uitvoeringskosten, voor zover die betrekking hebben op de in de onderdelen a tot en met d bedoelde
      uitkeringen;

      f. de op grond van enige wet over de uitkeringen, bedoeld in de onderdelen a tot en met d, door het UWV
      verschuldigde premies of vergoedingen als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref11] die niet op
      deze uitkeringen in mindering kunnen worden gebracht;

      g. de gelden die door toepassing van [artikel 118][ref12] worden overgeheveld naar de Werkhervattingskas;

      h.

      i. het gezamenlijke bedrag van de arbeidsongeschiktheidsuitkeringen en de vakantie-
      uitkeringen die niet zijn uitbetaald wegens het genieten van loon als bedoeld in
      [artikel 44, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref13] en dat op grond van
      [artikel 44, vierde lid, van die wet][ref14] wordt afgedragen aan ’s Rijks kas, vermeerderd met:

      1°. het bedrag aan premies dat het UWV bij wel-uitbetaling op grond van enige wet over dat bedrag verschuldigd zou
      zijn en dat niet op de uitkeringen in mindering kan worden gebracht, en

      2°. de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref15], van de inkomensafhankelijke bijdrage,
      bedoeld in [artikel 41 van die wet][ref16], over dat bedrag;

      j. de re-integratieinstrumenten op grond van [hoofdstuk IIB van de Wet op arbeidsongeschiktheidsverzekering][ref17],
      [hoofdstuk 3A van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref18] en
      [paragraaf 4.2 van de Wet werk en inkomen naar arbeidsvermogen][ref19].

      k. de bedragen van de kortingen oudere werknemer en arbeidsgehandicapte werknemer en de premievrijstellingen,
      bedoeld in [afdeling 6 van hoofdstuk 3][ref20] en in [artikel 122c][ref21], toegepast op de basispremie, bedoeld
      in [artikel 36][ref22];

      l.

      m. de kosten die verband houden met de uitvoering van
      [artikel 30a van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref23];

      n. de subsidie, bedoeld in [artikel 32b van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref24];

      o. hetgeen op grond van [artikel 83, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref25] op het UWV
      wordt verhaald;

      p.

      q. vergoedingen aan gemeenten die worden overeengekomen ter uitvoering van
      [artikel 30a, derde lid, onderdeel a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref26] voor
      zover betrekking hebbend op de uitvoering van een wettelijke arbeidsongeschiktheidsverzekering;

      r. de bedragen die op grond van [artikel 104, vierde lid][ref27], ten laste van het Arbeidsongeschiktheidsfonds
      kunnen worden gebracht.

      2 Het UWV bezigt de middelen die zijn gereserveerd ten behoeve van het Arbeidsongeschiktheidsfonds niet tot
      bestrijding van uitgaven ten laste van het Arbeidsongeschiktheidsfonds dan met toestemming van Onze Minister.


