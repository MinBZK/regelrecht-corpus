  - number: '20'
    text: |-
      1 De werkgever mag op het loon van de werknemer het door deze verschuldigde deel van de premie inhouden.

      2 De werkgever mag de door hem verschuldigde premie en de door de werknemer verschuldigde premie voorzover deze
      niet op diens loon is ingehouden, niet verhalen op de werknemer. Elk beding waarbij van de eerste zin wordt
      afgeweken, is nietig.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel20
  - number: '21'
    text: |-
      Geen premies voor de werknemersverzekeringen zijn verschuldigd met ingang van de eerste dag van de maand waarin de
      verzekerde de leeftijd van 65 jaar zal bereiken.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel21
  - number: '22'
    text: |-
      1 Indien een wijziging van een premiepercentage bij ministeriële regeling op grond van dit hoofdstuk of een
      wijziging in de verdeling van de premie op grond van [artikel 25, tweede lid][ref1], ingaat op een ander tijdstip
      dan 1 januari, vindt de vaststelling plaats in overeenstemming met Onze Minister van Financiën.

      2 Indien een wijziging door het UWV van een premiepercentage op grond van dit hoofdstuk ingaat op een ander
      tijdstip dan 1 januari, is goedkeuring vereist van Onze Minister en Onze Minister van Financiën. Indien Onze
      Minister en Onze Minister van Financiën hun goedkeuring onthouden stellen zij het percentage zelf vast.

      3 Onze Minister en Onze Minister van Financiën kunnen in een geval als bedoeld in dit artikel regels stellen
      omtrent de wijze van berekening van de premie over het gehele kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel25
