  - number: '111'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      kan een bedrag worden vastgesteld dat op grond van [artikel 24][ref1] met toepassing van de [artikelen 27][ref2] en
      [28, tweede en derde lid][ref3], op uitkeringen op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref4]
      of de [Wet werk en inkomen naar arbeidsvermogen][ref5] aan overheidswerknemers, volgens een bij die regeling
      te bepalen verdeling wordt afgedragen aan het Uitvoeringsfonds voor de overheid dan wel de sectorfondsen en het
      Algemeen Werkloosheidsfonds.


