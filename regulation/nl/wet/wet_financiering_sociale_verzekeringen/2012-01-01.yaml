  - number: '62'
    text: |-
      Het beroep tegen een beslissing van de SVB op grond van [artikel 61][ref1] kan niet zijn gegrond op de stelling dat
      de aanslag ten onrechte of tot een te hoog bedrag is vastgesteld.

      Het beroep kan slechts dan zijn gegrond op de stelling dat de aanslag niet is ontvangen, indien de belanghebbende
      aannemelijk kan maken dat hij de aanslag nimmer ontvangen heeft en dat er geen omstandigheden zijn op grond waarvan
      het niet ontvangen van de aanslag hem kan worden toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel61
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '63'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën en Onze Minister van
      Volksgezondheid, Welzijn en Sport, kunnen nadere regels worden gesteld met betrekking tot dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel63
  - number: '64'
    text: |-
      1 De SVB kan op verzoek wegens gemoedsbezwaren tegen één of meer volksverzekeringen of alle werknemersverzekeringen
      ontheffen van de verplichtingen opgelegd op grond van de desbetreffende wetten en deze wet:

      a. de persoon, die deze gemoedsbezwaren heeft;

      b. de rechtspersoon, waarbij natuurlijke personen zijn betrokken die deze gemoedsbezwaren hebben.

      2 De SVB doet de inspecteur mededeling omtrent de ontheffing of intrekking van de ontheffing.

      3 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op verzoeken aan de SVB met
      betrekking tot het verlenen van een ontheffing als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '65'
    text: |-
      1 Indien een ontheffing is verleend in het kader van één of meer volksverzekeringen, wordt voor geen van
      de volksverzekeringen premie geheven, doch vindt voor al die verzekeringen heffing van premievervangende
      inkomstenbelasting of premievervangende loonbelasting plaats overeenkomstig [artikel 58][ref1] tot het bedrag van
      de verschuldigde premie als bedoeld in [artikel 9][ref2].

      Tevens wordt in het in de vorige zin bedoelde geval geen inkomensafhankelijke bijdrage geheven, maar vindt met
      overeenkomstige toepassing van [artikel 57, eerste en tweede lid, van de Zorgverzekeringswet][ref3] heffing van
      bijdragevervangende belasting plaats.

      2 Indien een werkgever ontheffing is verleend in het kader van de werknemersverzekeringen wordt premievervangende
      loonbelasting geheven overeenkomstig [artikel 59][ref4] tot het bedrag aan premies dat hij met toepassing van
      [hoofdstuk 3][ref5] zou hebben afgedragen, indien hem geen ontheffing zou zijn verleend.

      3 Voor de toepassing van deze wet, de [Wet inkomstenbelasting 2001][ref6], de [Wet op de loonbelasting 1964][ref7]
      en de [Invorderingswet 1990][ref8] wordt de premievervangende belasting beschouwd als premie voor de
      volksverzekeringen dan wel voor de werknemersverzekeringen en wordt de bijdragevervangende belasting, bedoeld in
      het eerste lid en in [artikel 57 van de Zorgverzekeringswet][ref9], beschouwd als inkomensafhankelijke bijdrage op
      grond van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel58
