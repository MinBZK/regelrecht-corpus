  - number: '49'
    text: |-
      1 De werkgever past een korting toe op het totaal van de door hem en zijn werknemers op grond van
      [afdeling 2][ref1] en de door hem op grond van de [afdelingen 3][ref2] en [4][ref3] verschuldigde premies bij een
      dienstbetrekking met een werknemer, die onmiddellijk voorafgaand aan de aanvang van de dienstbetrekking:

      a. recht heeft op een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref4];

      b. recht heeft op een uitkering of op arbeidsondersteuning op grond van de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref5];

      c. een indicatiebeschikking als bedoeld in [artikel 11 van de Wet sociale werkvoorziening][ref6] heeft;

      d. naar het oordeel van het UWV een structurele functionele beperking heeft en voor wiens ondersteuning
      bij arbeidsinschakeling het college van burgemeester en wethouders, op die dag, op grond van
      [artikel 7, eerste lid, aanhef en onderdeel a, van de Wet werk en bijstand][ref7] verantwoordelijk is;

      e. de leeftijd van achttien jaar nog niet heeft bereikt en in verband met ziekte of gebrek een belemmering
      ondervindt of heeft ondervonden bij het volgen van onderwijs en binnen vijf jaar na afronding van dat onderwijs
      arbeid in dienstbetrekking gaat verrichten; of

      f. geen werknemer is als bedoeld in onderdeel b, achttien jaar is of ouder en in verband met ziekte of gebrek een
      belemmering ondervindt of heeft ondervonden bij het volgen van onderwijs en binnen vijf jaar na afronding van dat
      onderwijs arbeid in dienstbetrekking gaat verrichten.

      De korting wordt toegepast voor zolang de dienstbetrekking met die werknemer duurt doch ten hoogste gedurende de
      eerste drie jaar vanaf de aanvang van die dienstbetrekking.

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot de werknemer, bedoeld in het eerste lid,
      onderdeel a, die zijn eigen arbeid geheel of gedeeltelijk heeft hervat of een andere functie bij dezelfde werkgever
      is gaan bekleden voor zolang de dienstbetrekking duurt doch ten hoogste gedurende een jaar nadat die werknemer zijn
      eigen arbeid geheel of gedeeltelijk heeft hervat of een andere functie bij dezelfde werkgever is gaan bekleden.

      3 Ter uitvoering van het eerste lid, onderdeel d, wordt op verzoek van het college van burgemeester en wethouders,
      bedoeld in dat lid, de aanwezigheid van een structurele functionele beperking vastgesteld. Bij ministeriële
      regeling kunnen nadere regels worden gesteld voor het eerste lid, onderdeel d, en dit lid in ieder geval met
      betrekking tot de gegevens, die bij de aanvraag worden verstrekt en de kosten die voor de beoordeling van de
      aanvraag bij de aanvrager in rekening worden gebracht.

      4 Het eerste lid is van overeenkomstige toepassing met betrekking tot de werknemer van wie in een arbeidskundig
      onderzoek is vastgesteld dat hij op de eerste dag na afloop van de wachttijd, bedoeld in artikel 3.1
      van de Wet werk en inkomen naar arbeidsvermogen of van het tijdvak, bedoeld in [artikel 24][ref8] of
      [25, negende lid, van die wet][ref9]:

      1°. minder dan 35% arbeidsongeschikt is,

      2°. op de eerste dag van dertien weken voorafgaand aan die dag geen dienstbetrekking had met een andere dan
      zijn eigen werkgever, tenzij de dienstbetrekking met die andere werkgever reeds bestond op de eerste dag van de
      wachttijd,

      3°. niet in staat is tot het verrichten van eigen of andere passende arbeid bij de eigen werkgever, en

      4°. binnen vijf jaar na die dag in dienstbetrekking werkzaamheden gaat verrichten bij een werkgever.

      5 Bij ministeriële regeling kunnen voorwaarden worden gesteld met betrekking tot de toepassing van het eerste lid,
      aanhef en onderdeel d.

      6 Het UWV verstrekt op verzoek van de werknemer of de persoon die verwacht een dienstbetrekking met een werkgever
      te zullen aangaan een verklaring of de aanvrager naar het oordeel van het UWV voldoet aan de voorwaarden voor
      toepassing van het eerste lid, onderdeel e of f.


