  - number: '103'
    text: |-
      Ten gunste van een sectorfonds komen:

      a. de premies op grond van [artikel 28][ref1], met uitzondering van de premies die op grond van het derde lid van
      dat artikel ten gunste komen van het Algemeen Werkloosheidsfonds, en de premie op grond van [artikel 74][ref2],
      voorzover deze de premie op grond van [artikel 28, tweede lid][ref3], niet overschrijdt;

      b. de bedragen, die het UWV ontvangt door toepassing van de [artikelen 27a][ref4] en
      [36 van de Werkloosheidswet][ref5], voorzover deze bedragen betrekking hebben op uitkeringen die ten laste van dit
      fonds zijn gebracht;

      c. de bedragen, die het UWV op grond van [artikel 100, onderdeel d][ref6], ten laste van het Algemeen
      Werkloosheidsfonds brengt;

      d. de bedragen, die het UWV ontvangt door toepassing van de [artikelen 38, vierde lid][ref7], [39a][ref8],
      [63a, derde tot en met vijfde lid][ref9], [63b, tweede lid][ref10], en [63c van de Ziektewet][ref11];

      e. de bedragen, die het UWV ontvangt door toepassing van [artikel 45a van de Ziektewet][ref12], voorzover deze
      verband houden met op grond van [artikel 29, tweede lid, onderdeel a, b en c, van die wet][ref13] te betalen
      uitkeringen;

      f. de bijdragen van de werkgever of de eigenrisicodrager of de werknemer in de kosten van het onderzoek, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _;

      g. de bedragen, die het UWV ontvangt door toepassing van de [artikelen 76][ref15], [91][ref16] en
      [99 van de Wet werk en inkomen naar arbeidsvermogen][ref17], voorzover deze bedragen betrekking hebben op
      uitkeringen die ten laste van dit fonds zijn gebracht.


