  - number: '98'
    text: |-
      1 Indien één of meer werkgevers van een sector overgaan naar een andere sector, kan het UWV besluiten dat tevens
      een deel van het vermogen van dit instituut, dat betrekking heeft op het door dit instituut voor die sector
      afzonderlijk beheerde en geadministreerde sectorfonds, overgaat naar het vermogen dat betrekking heeft op een door
      dit instituut voor een andere sector afzonderlijk beheerd en geadministreerd sectorfonds.

      2 Met betrekking tot het eerste lid stelt het UWV regels omtrent:

      a. de gevallen waarin vermogen overgaat;

      b. de wijze van berekening van vermogensbestanddelen;

      c. de termijnen waarin en de wijze waarop vermogen overgaat.

      3 De door het UWV op grond van het tweede lid gestelde regels behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel98
  - number: '99'
    text: |-
      Ten gunste van het Algemeen Werkloosheidsfonds komen:

      a. de premies op grond van de [artikelen 27][ref1], [28, derde lid][ref2], en [76][ref3] en de premie op grond van
      [artikel 74][ref4], voorzover deze niet ten gunste komt van een sectorfonds;

      b. de bedragen, die het UWV ontvangt door de toepassing van [artikel 36 van de Werkloosheidswet][ref5], voorzover
      deze bedragen betrekking hebben op uitkeringen, die ten laste van dat fonds zijn gebracht;

      c. de bedragen die het UWV ontvangt door de uitoefening van zijn bevoegdheid op grond van
      [artikel 66 van de Werkloosheidswet][ref6];

      d. de bedragen die het UWV ontvangt door toepassing van [artikel 45a van de Ziektewet][ref7], voorzover
      deze verband houden met te betalen uitkeringen op grond van de [Ziektewet][ref8], anders dan op grond van
      [artikel 29, tweede lid, onderdeel a, b en c, van die wet][ref9];

      e. de bedragen die het UWV ontvangt van de werkgever in het kader van de toepassing van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref10].


