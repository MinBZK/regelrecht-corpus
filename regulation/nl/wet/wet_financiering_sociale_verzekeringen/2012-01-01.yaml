    text: |-
      Het UWV beheert en administreert afzonderlijk de in [artikel 33, eerste lid][ref1], bedoelde middelen tot dekking
      van de uitgaven alsmede de middelen benodigd voor het vormen en in stand houden van een reserve, in de vorm van een
      Arbeidsongeschiktheidsfonds dat deel uitmaakt van het UWV.


