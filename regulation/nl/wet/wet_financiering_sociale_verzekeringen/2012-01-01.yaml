preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter vermindering van administratieve en
    uitvoeringslasten en vereenvoudiging van regelgeving de heffing en invordering van de premies voor de
    werknemersverzekeringen te laten plaatsvinden door de rijksbelastingdienst tezamen met en op zoveel mogelijk
    gelijke wijze als die van de loonbelasting en de regeling daarvan en van hetgeen overigens de financiering van
    de werknemersverzekeringen betreft tezamen met de regeling van de financiering van de volksverzekeringen – onder
    intrekking van onder andere de Wet financiering volksverzekeringen – onder te brengen in één wet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      c. SVB: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      d. College zorgverzekeringen: het College voor zorgverzekeringen, genoemd in
      [artikel 58, eerste lid, van de Zorgverzekeringswet][ref3];

      e. zorgautoriteit: de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref4];

      f. Ouderdomsfonds: het Ouderdomsfonds, genoemd in [artikel 82, eerste lid][ref5];

      g. Nabestaandenfonds: het Nabestaandenfonds, genoemd in [artikel 82, tweede lid][ref6];

      h.

      i. Algemeen Fonds Bijzondere Ziektekosten: het Algemeen Fonds Bijzondere Ziektekosten, genoemd in
      [artikel 89][ref7];

      j. Algemeen Werkloosheidsfonds: het Algemeen Werkloosheidsfonds, genoemd in [artikel 93][ref8];

      k. sectorfonds: een sectorfonds als bedoeld in [artikel 94][ref9];

      l. Uitvoeringsfonds voor de overheid: het Uitvoeringsfonds voor de overheid, genoemd in [artikel 106][ref10];

      m. Arbeidsongeschiktheidsfonds: het Arbeidsongeschiktheidsfonds, genoemd in [artikel 112][ref11];

      n.

      o. werknemer: de werknemer in de zin van de [Werkloosheidswet][ref12], de [Ziektewet][ref13], de
      [Wet werk en inkomen naar arbeidsvermogen][ref14] of de [Wet op de arbeidsongeschiktheidsverzekering][ref15];

      p. overheidswerknemer: de werknemer bedoeld in [artikel 1, onderdeel j, van de Werkloosheidswet][ref16];

      q. werkgever: de werkgever in de zin van de [Werkloosheidswet][ref17], de [Ziektewet][ref18], de
      [Wet werk en inkomen naar arbeidsvermogen][ref19] of de [Wet op de arbeidsongeschiktheidsverzekering][ref20];

      r. overheidswerkgever: de werkgever, bedoeld in [artikel 1, onderdeel i, van de Werkloosheidswet][ref21];

      s. burgerservicenummer: het nummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref22];

      sa. sociaal-fiscaalnummer: het nummer, bedoeld in
      [artikel 2, derde lid, onderdeel k, van de Algemene wet inzake rijksbelastingen][ref23];

      t. inspecteur: de functionaris van de rijksbelastingdienst die als zodanig bij regeling van Onze Minister van
      Financiën is aangewezen;

      u. loontijdvak: het loontijdvak, bedoeld in
      [artikel 25, eerste en vierde lid, van de Wet op de loonbelasting 1964][ref24];

      v.

      w. Werkhervattingskas: de Werkhervattingskas, genoemd in [artikel 113a][ref25];

      x. WGA-uitkering: de werkhervattingsuitkering gedeeltelijk arbeidsgeschikten, bedoeld in
      [artikel 54 van de Wet werk en inkomen naar arbeidsvermogen][ref26].


