  - number: '44'
    text: |-
      1 Het bedrag, bedoeld in [artikel 43, eerste lid,][ref1] is gelijk aan de helft van het voor de werkgever voor
      het kalenderjaar berekende ziekterisicocijfer, vermenigvuldigd met de som van het loon, waarover op grond van
      [hoofdstuk 3, afdeling 2][ref2], over het aan dat kalenderjaar voorafgaande kalenderjaar door de werkgever premie
      is verschuldigd.

      2 Indien de in het eerste lid bedoelde som van het loon niet kan worden vastgesteld wordt daarvoor in de
      plaats gesteld de som van het loon waarover op grond van [hoofdstuk 3, afdeling 2][ref3], laatstelijk door
      de werkgever premie is verschuldigd of, bij het ontbreken daarvan, de som van het loon waarover op grond van
      [hoofdstuk 3, afdeling 2][ref4], premie zal zijn verschuldigd.

      3 Het bedrag, bedoeld in [artikel 43, eerste lid][ref5], is niet lager dan de helft van het voor het kalenderjaar
      berekende gemiddelde premieplichtige loon per werknemer.

      4 Het ziekterisicocijfer wordt berekend op basis van de formule:

      A = (U) / (L)

      waarbij:

      A = het ziekterisicocijfer;

      U = de uitkeringen in het kalenderjaar die op grond van
      [artikel 104, eerste lid, onderdeel c, juncto het vierde en vijfde lid][ref6], ten laste komen van het sectorfonds
      van de sector waartoe de werkgever behoort, bedoeld in [artikel 94][ref7], alsmede de uitvoeringskosten met
      betrekking tot die uitkeringen en de op grond van enige wet over die uitkeringen door het UWV verschuldigde premies
      die niet op die uitkeringen in mindering kunnen worden gebracht;

      L = het totaalbedrag van het loon, bedoeld in [artikel 26][ref8], waarover in het kalenderjaar, ten gunste van
      het sectorfonds van de sector waartoe de werkgever behoort, de aldaar bedoelde premies zijn verschuldigd, met
      uitzondering van de uitkeringen en het loon waarop [artikel 28, tweede lid][ref9], van toepassing is.

      5 Indien een sectorfonds bestaat uit onderdelen die niet afzonderlijk worden beheerd, terwijl het deel van de
      premie dat ten gunste komt van het sectorfonds voor elk van die onderdelen afzonderlijk wordt vastgesteld, wordt
      voor de toepassing van het vierde lid onder het sectorfonds verstaan het onderdeel van het sectorfonds.

      6 Bij de vaststelling van de som van het loon, bedoeld in het eerste en tweede lid, blijft
      [artikel 17, tweede lid][ref10], buiten toepassing.


