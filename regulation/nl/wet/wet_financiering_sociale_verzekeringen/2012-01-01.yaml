        artikel: '38'
  - number: '61'
    text: |-
      1 Indien een premieplichtige heeft nagelaten over een bepaald jaar de op aanslag verschuldigde premie
      voor de volksverzekeringen te betalen, beslist de SVB dat sprake is van schuldig nalaten als bedoeld in
      [artikel 13 van de Algemene Ouderdomswet][ref1], behoudens voorzover de premieplichtige aantoont dat er
      omstandigheden aanwezig zijn op grond waarvan het niet betalen van de premie hem niet toegerekend kan worden.

      2 Een beslissing als bedoeld in het eerste lid wordt in elk geval genomen indien:

      a. de aanslag voor de premie voor de volksverzekeringen ambtshalve is vastgesteld omdat de premieplichtige geen of
      onvoldoende medewerking heeft verleend bij het vaststellen van het premie-inkomen;

      b. de premie voor de volksverzekeringen niet of niet geheel kan worden ingevorderd omdat is nagelaten te voldoen
      aan de krachtens de [artikelen 65, eerste tot en met derde en vijfde tot en met zevende lid][ref2], [66][ref3] en
      [68 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref4] geldende verplichtingen; of

      c. de premieplichtige de bekendmaking van de beslissing op grond van het eerste lid
      bemoeilijkt of onmogelijk maakt omdat is nagelaten te voldoen aan de krachtens de
      [artikelen 65, eerste tot en met derde en vijfde tot en met zevende lid][ref5], [66][ref6] en
      [68 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref7] geldende verplichtingen.

      3 Nadat de betalingen op een belastingaanslag zijn toegerekend overeenkomstig
      [artikel 7, tweede lid, van de Invorderingswet 1990][ref8] en alvorens de SVB beslist dat de premieplichtige
      schuldig nalatig is als bedoeld in het eerste lid wordt het door de premieplichtige reeds betaalde deel van de op
      aanslag verschuldigde premie voor de volksverzekeringen in een bepaald jaar achtereenvolgens toegerekend aan:

      a. de premie, verschuldigd gebleven voor de algemene verzekering bijzondere ziektekosten en de
      nabestaandenverzekering;

      b. de premie, verschuldigd gebleven voor de algemene ouderdomsverzekering, waarbij de betaling eerst wordt
      toegerekend aan het oudste tijdvak.

      4 Indien de premieplichtige ten aanzien van wie een beslissing als bedoeld in het eerste lid is genomen binnen vijf
      jaren na de dagtekening van de aanslag het op aanslag verschuldigde bedrag alsnog geheel of gedeeltelijk betaalt,
      is hij een opslag verschuldigd van 5% op de verschuldigd gebleven premie voor de algemene ouderdomsverzekering.
      Indien een beslissing als bedoeld in het eerste lid meer dan vier jaren en achtenveertig weken na de dagtekening
      van de aanslag wordt genomen, wordt de termijn van vijf jaren verlengd tot vier weken na de datum van die
      beslissing.

      5 Ingeval van een gehele of gedeeltelijke betaling van het op aanslag verschuldigde bedrag,
      bedoeld in het vierde lid, worden, nadat deze betalingen zijn toegerekend overeenkomstig
      [artikel 7, tweede lid, van de Invorderingswet 1990][ref9], de premies volksverzekeringen toegerekend aan:

      a. de premie, verschuldigd gebleven voor de algemene verzekering bijzondere ziektekosten en de
      nabestaandenverzekering;

      b. de opslag, bedoeld in het vierde lid;

      c. de premie, verschuldigd gebleven voor de algemene ouderdomsverzekering, waarbij de betaling eerst wordt
      toegerekend aan het oudste tijdvak of de oudste tijdvakken binnen de termijn van vijf jaren, bedoeld in het vierde
      lid.

      6 In geval van gehele of gedeeltelijke toerekening van een betaling als bedoeld in het vierde lid aan de premie
      verschuldigd gebleven voor de algemene ouderdomsverzekering, wordt de beslissing op grond van het eerste lid in
      zoverre gewijzigd of ingetrokken.

      7 De SVB registreert de schuldige nalatigheid van de premieplichtige. Indien bij de SVB ten tijde van de
      registratie geen actueel adres van de premieplichtige bekend is, gaat de termijn van vier weken, genoemd in het
      vierde lid, in op de datum van registratie.


