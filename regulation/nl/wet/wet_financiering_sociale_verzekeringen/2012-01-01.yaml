  - number: '52'
    text: |-
      1 De werkgever vraagt de vrijstelling aan voor de afloop van de dienstbetrekking. De aanvraag wordt mede door de
      uitkeringsgerechtigde ondertekend.

      2 De aanvraag bevat in ieder geval het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer
      van de uitkeringsgerechtigde.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel52
  - number: '53'
    text: |-
      1 Bij ministeriële regeling kunnen voor de Tabakverwerkende en Agrarische sector categorieën van werknemers worden
      aangewezen waarvoor de werkgever ter zake van een dienstbetrekking met een onder die categorie vallende werknemer
      de premievrijstelling, bedoeld in deze paragraaf, kan worden verleend.

      2 Voor aanwijzing komen in aanmerking categorieën van werknemers, die behalve uit de in het eerste lid bedoelde
      dienstbetrekking, bij aanvang van die dienstbetrekking niet zijn aangewezen op inkomen uit arbeid en geen
      uitkeringsgerechtigde zijn.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel53
  - number: '54'
    text: |-
      1 De inspecteur, gehoord het UWV en in overeenstemming met het UWV, verleent voor de Tabakverwerkende en Agrarische
      sector op aanvraag van een werkgever bij voor bezwaar vatbare beschikking vrijstelling van de verplichting tot het
      betalen van premies ter zake van een dienstbetrekking met een werknemer vallend onder een categorie als bedoeld in
      [artikel 53, eerste lid][ref1], die voldoet aan de vereisten, bedoeld in [artikel 51, eerste lid][ref2].

      2 De [artikelen 51][ref3] en [52][ref4] zijn van overeenkomstige toepassing.


