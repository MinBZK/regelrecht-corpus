    text: |-
      1 [Artikel 47, aanhef en onderdeel b][ref1], zoals [dat artikel][ref2] luidde op de dag voorafgaand aan de
      inwerkingtreding van de wet van 29 december 2008 tot wijziging van de Wet financiering sociale verzekeringen en
      enige andere sociale verzekeringswetten in verband met de invoering van een premiekorting voor het in dienst nemen
      van uitkeringsgerechtigden van 50 jaar en ouder en het in dienst houden van werknemers van 62 jaar en ouder (Stb.
      598), blijft van toepassing voor zover de betreffende premievrijstelling op die dag werd toegepast voor het in
      dienst hebben van werknemers van 54,5 jaar en ouder, tot die werknemers de leeftijd van 62 jaar hebben bereikt.

      2 Het eerste lid is niet van toepassing op de premie die het UWV betaalt aan de werkgever op grond van
      [artikel 11, tweede lid, van de Werkloosheidswet][ref3], [artikel 11, derde lid, van de Ziektewet][ref4] of
      [artikel 10, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref5] met dien verstande dat ten
      aanzien van de premie die de werkgever in dat geval is verschuldigd, het eerste lid van toepassing blijft.


