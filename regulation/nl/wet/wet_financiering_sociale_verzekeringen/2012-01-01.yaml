  - number: '125'
    text: |-
      1 Hij die niet voldoet aan de inlichtingenplicht, bedoeld in [artikel 77][ref1], wordt gestraft met hechtenis van
      ten hoogste zes maanden of een geldboete van de derde categorie.

      2 Hij die door hem op grond van deze wet betaalde of verschuldigde premie inhoudt op het loon van of op enige
      andere wijze verhaalt op een werknemer of gewezen werknemer, zonder dat dit bij deze wet is toegestaan, wordt
      gestraft met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.

      3 De in het eerste en tweede lid bedoelde strafbare feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel77
