  - number: '25'
    text: |-
      1 De premie is verschuldigd door werkgevers en werknemers in de zin van de [Werkloosheidswet][ref1].

      2 Het deel van de premie dat ten gunste komt van het Algemeen Werkloosheidsfonds is gedeeltelijk verschuldigd
      door de werkgever en gedeeltelijk door de werknemer. Bij ministeriële regeling wordt bepaald welk gedeelte door de
      werkgever en welk gedeelte door de werknemer is verschuldigd.

      3 Het deel van de premie dat ten gunste komt van een sectorfonds is verschuldigd door de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel25
