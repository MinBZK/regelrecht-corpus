  - number: '102'
    text: |-
      1 Het UWV vergoedt, ten laste van het Algemeen Werkloosheidsfonds, aan het Rijk bijdragen, die vanwege het Rijk
      worden verleend aan uit het buitenland afkomstige werknemers, die geen Nederlander zijn en die terugkeren naar
      hun land van herkomst of emigreren naar een ander land en tot het tijdstip van vertrek uitkering op grond van de
      [Werkloosheidswet][ref1] ontvangen.

      2 De in het eerste lid bedoelde vergoedingen zijn ten hoogste gelijk aan de bedragen die de in het eerste lid
      bedoelde werknemers op grond van de [Werkloosheidswet][ref2] zouden hebben kunnen ontvangen indien zij werkloos
      waren gebleven en niet naar hun land van herkomst of een ander land waren vertrokken.

      3 Bij ministeriële regeling, na overleg met Onze Minister wie het mede aangaat, worden regels gesteld met
      betrekking tot de aan het Rijk te vergoeden bijdragen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
