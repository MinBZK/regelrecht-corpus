  - number: '100'
    text: |-
      Ten laste van het Algemeen Werkloosheidsfonds komen:

      a. de op grond van de [Werkloosheidswet][ref1] te betalen uitkeringen:

      1°. met uitzondering van de uitkeringen, bedoeld in [artikel 104, eerste lid][ref2];

      2°. met inbegrip van de uitkeringen, bedoeld in [artikel 104, zevende lid][ref3];

      b. de op grond van [artikel 29, tweede lid, onderdeel d, e, f, en g][ref4], en [artikel 70 van de Ziektewet][ref5]
      te betalen uitkeringen en de uitkeringen op grond van [artikel 29, tweede lid, onderdeel a, b, en c][ref6]
      die direct aansluitend zijn toegekend op een uitkering op grond van
      [artikel 29, tweede lid, onderdeel d, e, f, of g van de Ziektewet][ref7] of [artikel 70 van de Ziektewet][ref8];

      c. de uitvoeringskosten, voorzover deze betrekking hebben op de in de onderdelen a en b bedoelde uitkeringen;

      d. de op grond van enige wet over de uitkeringen, bedoeld in onderdeel a en b, door het UWV verschuldigde premies
      of vergoedingen als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref9] die niet op deze uitkeringen in
      mindering kunnen worden gebracht;

      e. de bedragen, die op grond van [artikel 104, vierde lid][ref10], door het UWV ten laste van het Algemeen
      Werkloosheidsfonds zijn gebracht;

      f. de subsidies op grond van de Wet tijdelijke bijdrage herstructurering arbeidsvoorziening havens;

      g. de bedragen van de kortingen oudere werknemer en arbeidsgehandicapte werknemer en van de premievrijstelling
      bij marginale arbeid, bedoeld in [afdeling 6 van hoofdstuk 3][ref11], voorzover die worden toegepast op de premies
      berekend op grond van [artikel 27][ref12];

      h.

      i. de tegemoetkoming in de kosten van kinderopvang, bedoeld in
      [artikel 1.29, eerste lid, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref13] ten behoeve
      van de ouder die een persoon is als bedoeld in [artikel 1.6, eerste lid, onderdeel h, van die wet][ref14],
      met uitzondering van hetgeen op grond van [artikel 108][ref15] ten laste komt van het Uitvoeringsfonds voor de
      overheid;

      j. de op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref16] te betalen uitkeringen
      en de daaraan verbonden uitvoeringskosten, met uitzondering van hetgeen op grond van [artikel 108][ref17] ten laste
      komt van het Uitvoeringsfonds voor de overheid;

      k. de kosten in verband met de uitvoering van
      [artikel 30a van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref18] ten aanzien van personen, die
      een uitkering ontvangen als bedoeld in de onderdelen a en b en de kosten van de re-integratiemaatregelen, bedoeld
      in [hoofdstuk VI van de Werkloosheidswet][ref19] en [hoofdstuk IIA van de Ziektewet][ref20] ten aanzien van deze
      personen;

      l. vergoedingen aan gemeenten die worden overeengekomen ter uitvoering van
      [artikel 30a, derde lid, onderdeel a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref21] voor
      zover betrekking hebbend op personen, die een uitkering ontvangen als bedoeld in de onderdelen a en b.


