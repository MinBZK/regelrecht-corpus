  - number: '33'
    text: |-
      1 De financiële middelen tot dekking van de uitgaven ten laste van het Arbeidsongeschiktheidsfonds, alsmede
      de financiële middelen voor het vormen en in stand houden van een reserve in dat fonds, worden verkregen door
      het heffen van de in [artikel 36][ref1] bedoelde basispremie en door een bijdrage van het rijk als bedoeld in
      [artikel 114, onderdeel f][ref2].

      2 De financiële middelen tot dekking van de uitgaven ten laste van de Werkhervattingskas, alsmede de financiële
      middelen voor het vormen en in stand houden van een reserve in de Werkhervattingskas, worden verkregen door het
      heffen van de in [artikel 38][ref3] bedoelde gedifferentieerde premie.


