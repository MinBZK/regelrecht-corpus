  - number: '66'
    text: |-
      Ten laste van het Rijk komen de bedragen aan premie voor de volksverzekeringen en de werknemersverzekeringen die
      wegens een ontheffing niet zijn geheven overeenkomstig [artikel 65][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel65
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '65'
        hoofdstuk: '5'
  - number: '67'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën en Onze Minister van
      Volksgezondheid, Welzijn en Sport, worden regels gesteld ten aanzien van:

      a. de voorwaarden, waaronder een ontheffing wordt verleend;

      b. de verdere gevolgen die aan een ontheffing worden verbonden;

      c. de gevallen, waarin een ontheffing wordt ingetrokken en de gevolgen die aan die intrekking worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel67
  - number: 67a
    text: |-
      In afwijking van [artikel 7:3 van de Algemene wet bestuursrecht][ref1] kan van het horen van een belanghebbende
      worden afgezien ten aanzien van een besluit inzake de ontheffing, bedoeld in [artikel 64][ref2], indien de
      belanghebbende niet binnen een door de SVB gestelde redelijke termijn verklaart dat hij gebruik wil maken van het
      recht te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel64
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:3
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '64'
        hoofdstuk: '5'
  - number: '68'
    text: |-
      De financiële middelen tot dekking van de uitgaven voor de vrijwillige volksverzekeringen worden verkregen door het
      heffen van premie.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel68
  - number: '69'
    text: |-
      Voor de toepassing van deze afdeling wordt verstaan onder:

      a. vrijwillige algemene ouderdomsverzekering: de verzekering, bedoeld in
      [hoofdstuk IV van de Algemene Ouderdomswet][ref1];

      b. vrijwillige nabestaandenverzekering: de verzekering, bedoeld in
      [hoofdstuk 5 van de Algemene nabestaandenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002221
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007795
        hoofdstuk: '5'
  - number: '70'
    text: |-
      1 De verschuldigde premie voor de vrijwillige algemene ouderdomsverzekering of de vrijwillige
      nabestaandenverzekering wordt in rekening gebracht en geïnd door de SVB op de wijze en het tijdstip aangegeven door
      de SVB.

      2 Een schuld aan premie voor een vrijwillige verzekering valt buiten de nalatenschap van degene, die tot die
      verzekering was toegelaten. De schuld wordt betaald door degene, die krachtens de betrokken vrijwillige verzekering
      prestaties ontvangt.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel70
  - number: '71'
    text: |-
      1 Degene die is toegelaten tot de vrijwillige algemene ouderdomsverzekering of de vrijwillige
      nabestaandenverzekering, is voor die verzekeringen een premie verschuldigd volgens bij of krachtens algemene
      maatregel van bestuur te bepalen tarief.

      2 De voordracht voor een op grond van het eerste lid vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel71
  - number: '72'
    text: |-
      De financiële middelen tot dekking van de uitgaven voor de vrijwillige werknemersverzekeringen worden verkregen
      door het heffen van premie.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel72
  - number: '73'
    text: |-
      1 De premies voor de vrijwillige werknemersverzekeringen worden in rekening gebracht en geïnd door het UWV op de
      wijze en het tijdstip, aangegeven door dat instituut.

      2 Het UWV kan nadere regels stellen met betrekking tot de premie.

      3 De door het UWV op grond van het tweede lid gestelde regels behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel73
  - number: '74'
    text: |-
      1 De premie voor de vrijwillige verzekering op grond van de [Werkloosheidswet][ref1] wordt berekend over het
      dagloon, bedoeld in [artikel 58, eerste lid, van de Werkloosheidswet][ref2].

      2 De premie bedraagt een door het UWV te bepalen percentage van het in het eerste lid bedoelde dagloon, met
      dien verstande dat de premie niet meer bedraagt dan het deel van de premie, bedoeld in [artikel 27][ref3],
      dat ten gunste komt van het Algemeen Werkloosheidsfonds, vermeerderd met de premie, bedoeld in
      [artikel 28, tweede lid][ref4].

      3 Bij de bepaling van de premie blijft [artikel 17, tweede lid][ref5], buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel27
