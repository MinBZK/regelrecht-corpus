  - number: '121'
    text: |-
      1 Jaarlijks vóór bij regeling van Onze Minister vast te stellen tijdstippen zenden het UWV en de SVB aan Onze
      Minister met betrekking tot elk fonds afzonderlijk:

      a. een rapportage van de ontwikkelingen die zich tot op dat moment hebben voorgedaan met betrekking tot de
      financiële middelen en de gerealiseerde uitgaven;

      b. een begroting van de te verwachten uitgaven uit elk afzonderlijk fonds in het eerstvolgend kalenderjaar.

      2 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de aard en inrichting van de in het eerste
      lid bedoelde rapportage en de begroting van uitgaven.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel121
  - number: 121a
    text: |-
      Bij regeling van Onze Minister worden regels gesteld over de wijze waarop en de voorwaarden waaronder de aan het
      UWV en de SVB toegekende rijksbijdragen worden afgedragen en vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel121a
  - number: '122'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport kunnen, in overeenstemming
      met Onze Minister van Financiën, en na overleg met het College zorgverzekeringen, regels worden gesteld over
      de wijze waarop en de voorwaarden waaronder de afdracht van gelden plaatsvindt aan de fondsen die geheel of
      gedeeltelijk door het Rijk worden gefinancierd.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel122
  - number: 122a
    text: |-
      1 De werkgever past de korting, bedoeld in [artikel 49, eerste lid][ref1],
      overeenkomstig dat lid eveneens toe voor de persoon die voor de inwerkingtreding van
      __REF001___________________________________________________________________________________________________________
      __, arbeidsgehandicapte was op grond van [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref3],
      indien die werknemer op de dag van aanvang van de dienstbetrekking arbeidsgehandicapte was op grond van
      [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref4] dan wel dit zou zijn geweest indien het
      laatstgenoemde artikel niet zou zijn ingetrokken.

      2 [Artikel 49, eerste lid][ref5], is van overeenkomstige toepassing
      ten aanzien van de persoon die voor de inwerkingtreding van
      __REF001___________________________________________________________________________________________________________
      _, arbeidsgehandicapte is geworden als bedoeld in
      [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref7], voor zolang de dienstbetrekking duurt doch
      ten hoogste gedurende één jaar nadat die persoon zijn eigen arbeid of een andere functie bij diezelfde werkgever
      geheel of gedeeltelijk heeft hervat dan wel gedurende één jaar nadat diens arbeidsplaats is aangepast tot behoud,
      herstel of ter bevordering van de mogelijkheden tot het verrichten van arbeid van die werknemer, indien die persoon
      op de dag van hervatting respectievelijk op de dag van aanpassing van de arbeidsplaats arbeidsgehandicapte was
      op grond van [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref8] dan wel dit zou zijn geweest
      indien het laatstgenoemde artikel niet zou zijn ingetrokken.

      3 Ten aanzien van de werkgever wiens werknemer na de dag van inwerkingtreding van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref9] en voor de dag
      van inwerkingtreding van [artikel 1.5, onderdeel V, van die wet][ref10], recht krijgt op een uitkering op grond van
      de [Wet werk en inkomen naar arbeidsvermogen][ref11], wordt voor:

      a. de zinsnede «vanaf de aanvang van de dienstbetrekking» in [artikel 49, eerste lid][ref12]; en

      b. de zinsnede «nadat die werknemer zijn eigen arbeid of een andere functie bij dezelfde werkgever geheel of
      gedeeltelijk heeft hervat» in het tweede lid en in [artikel 49, tweede lid][ref13];

      gelezen: vanaf de dag van inwerkingtreding van
      [artikel 1.5, onderdeel V, van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref14].

      4 Dit artikel is niet van toepassing indien de werknemer werkzaam is in een dienstbetrekking in de zin van
      [artikel 2 van de Wet sociale werkvoorziening][ref15].


