  - number: 38a
    text: |-
      1 In afwijking van [artikel 38][ref1] is over een uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen,][ref2] de [Wet op de arbeidsongeschiktheidsverzekering][ref3],
      de [Ziektewet][ref4], [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref5],
      de [Werkloosheidswet][ref6], over een toeslag op grond van de [Toeslagenwet][ref7], over het
      loon uit een dienstbetrekking op grond van de [Wet sociale werkvoorziening][ref8] en over het
      loon van de werknemer van de eigenrisicodrager, op wie [artikel 56][ref9] van toepassing is,
      als gedifferentieerde premie ten behoeve van de Werkhervattingskas een premie verschuldigd
      naar het percentage, bedoeld in [artikel 38, eerste lid, onderdeel a][ref10]. Met een uitkering
      op grond van de [Werkloosheidswet][ref11] wordt gelijkgesteld een wachtgeld als bedoeld in
      [artikel 1, onderdeel r, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref12].

      2 Behalve voor degene die loon ontvangt uit een dienstbetrekking op grond van de
      [Wet sociale werkvoorziening][ref13] wordt het eerste lid niet toegepast ingeval het UWV de
      uitkering, vermeerderd met de daarover door de werkgever verschuldigde premies en de vergoeding,
      bedoeld in [artikel 46 van de Zorgverzekeringswet][ref14], betaalt aan de werkgever, bedoeld in
      [artikel 11 van de Wet werk en inkomen naar arbeidsvermogen][ref15] en in [artikel 9][ref16], [10][ref17]
      of [12 van de Werkloosheidswet][ref18] en de [Ziektewet][ref19], onafhankelijk van het voortbestaan van de
      dienstbetrekking met die werkgever.


