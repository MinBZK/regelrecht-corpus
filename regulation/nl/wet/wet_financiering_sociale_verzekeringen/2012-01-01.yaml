  - number: '26'
    text: De maatstaf voor de heffing van de premie is het loon.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel26
  - number: '27'
    text: |-
      Bij ministeriële regeling wordt het deel van de premie dat ten gunste komt van het Algemeen Werkloosheidsfonds
      vastgesteld op een voor alle takken van bedrijf en beroep gelijk percentage van het loon.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel27
  - number: '28'
    text: |-
      1 Het deel van de premie dat ten gunste komt van een sectorfonds wordt door het UWV vastgesteld op een percentage
      van het loon dat voor categorieën van werkgevers en werknemers die behoren tot verschillende sectoren en
      sectoronderdelen als bedoeld in [artikel 95][ref1] kan verschillen. Bij de vaststelling van het percentage blijven
      ten aanzien van eigenrisicodragers als bedoeld in [artikel 40, eerste lid, onderdeel a][ref2], uitkeringen op
      grond van [artikel 29, tweede lid, onderdelen a, b en c, van de Ziektewet][ref3], vermeerderd met een door het UWV
      vast te stellen opslag in verband met kosten ter zake van de betaling van die uitkeringen en van de werkzaamheden,
      bedoeld in [artikel 63a, eerste lid, van die wet][ref4], alsmede de op grond van enige wet over die uitkeringen
      verschuldigde premies die niet op die uitkeringen in mindering kunnen worden gebracht, buiten beschouwing. Bij de
      vaststelling van het percentage blijven ten aanzien van Onze Minister van Defensie en Onze Minister, voorzover zij
      werkgever zijn van personen als bedoeld in [artikel 4, eerste lid, onderdelen i en j, van de Ziektewet][ref5], de
      uitkeringen bedoeld in [artikel 104, eerste lid, onderdelen c en d][ref6], alsmede de daaraan gerelateerde overige
      uitgaven uit het sectorfonds buiten beschouwing. Bij of krachtens algemene maatregel van bestuur kunnen hieromtrent
      nadere regels worden gesteld.

      2 In afwijking van het eerste lid wordt met inachtneming van bij algemene maatregel van bestuur te stellen regels
      bij ministeriële regeling over een uitkering op grond van de [Werkloosheidswet][ref7], de [Ziektewet][ref8],
      de [Wet werk en inkomen naar arbeidsvermogen][ref9], de [Wet op de arbeidsongeschiktheidsverzekering][ref10],
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref11] aan de werknemer of
      gelijkgestelde, bedoeld in [artikel 3:6, eerste lid, van die wet][ref12], over een toeslag op
      grond van de [Toeslagenwet][ref13] en over loon op grond van een arbeidsovereenkomst als bedoeld in
      [hoofdstuk 2 van de Wet sociale werkvoorziening][ref14] voor het deel van de premie dat ten gunste komt van een
      sectorfonds een gemiddeld premiepercentage vastgesteld. Dit wordt bepaald op een gemiddelde van de percentages die
      zijn vastgesteld op grond van het eerste lid.

      3 Het deel van de premie dat met toepassing van het tweede lid ten gunste komt van het sectorfonds, bedraagt ten
      hoogste de premie die op grond van het eerste lid is vastgesteld. Het resterende deel van deze premie komt ten
      gunste van het Algemeen Werkloosheidsfonds.

      4 Het tweede lid wordt niet toegepast ingeval het UWV de uitkering, vermeerderd met de daarover door de werkgever
      verschuldigde premies en de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref15], betaalt
      aan de werkgever, bedoeld in [artikel 9][ref16], [10][ref17] of [12 van de Werkloosheidswet][ref18] en de
      [Ziektewet][ref19], [artikel 11 van de Wet werk en inkomen naar arbeidsvermogen][ref20] en in [artikel 8][ref21],
      [9][ref22] of [11 van de Wet op de arbeidsongeschiktheidsverzekering][ref23], onafhankelijk van het voortbestaan
      van de dienstbetrekking met die werkgever, tenzij die werkgever een werkgever is van degene die loon ontvangt uit
      een arbeidsovereenkomst als bedoeld in [hoofdstuk 2 van de Wet sociale werkvoorziening][ref24].

      5 Een door het UWV bepaald percentage als bedoeld in het eerste lid behoeft de goedkeuring van Onze Minister.
      Indien Onze Minister zijn goedkeuring onthoudt stelt hij het percentage zelf vast.

      6 Het UWV dan wel, indien Onze Minister het percentage heeft vastgesteld, Onze Minister maakt bekend
      welk deel van het percentage, bedoeld in het eerste lid, is gerelateerd aan hetgeen op grond van
      [artikel 104, eerste lid, onderdelen a en b, onderdeel c, respectievelijk onderdeel d][ref25], ten laste komt van
      een sectorfonds.


