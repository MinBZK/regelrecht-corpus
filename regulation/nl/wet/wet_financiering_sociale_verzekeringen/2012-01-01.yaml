  - number: '104'
    text: |-
      1 Ten laste van een sectorfonds komen:

      a. de op grond van de [Werkloosheidswet][ref1] over de eerste zes maanden vanaf de eerste werkloosheidsdag te
      betalen uitkering aan de werknemer, die in de kalenderweek onmiddellijk voorafgaande aan het intreden van zijn
      arbeidsurenverlies in de sector werkzaam is geweest waarvoor het sectorfonds is ingesteld, waarbij, voor de
      bepaling van de periode van zes maanden, perioden waarin de werknemer geen recht op uitkering heeft, buiten
      beschouwing worden gelaten;

      b. de op grond van [artikel 18 van de Werkloosheidswet][ref2] te betalen uitkeringen;

      c. de op grond van [artikel 29, tweede lid, onderdeel a, b en c, van de Ziektewet][ref3] te betalen
      uitkeringen en de uitkeringen op grond van [artikel 29, tweede lid, onderdeel d, e, f en g][ref4] die direct
      aansluitend zijn toegekend op een uitkering op grond van [artikel 29, tweede lid, onderdeel a, b of c][ref5] of
      [artikel 70 van de Ziektewet][ref6], met uitzondering van de uitkeringen aan de personen, wier arbeidsverhouding op
      grond van [artikel 4, eerste lid, onderdeel i of j, van de Ziektewet][ref7] als dienstbetrekking wordt beschouwd;

      d. de door het UWV te betalen WGA-uitkeringen aan een werknemer die uit de dienstbetrekking waaruit de WGA-
      uitkering is ontstaan, recht had op een uitkering als bedoeld in onderdeel c dan wel van dit recht was uitgesloten
      op grond van [artikel 19a][ref8] of [artikel 19b van de Ziektewet][ref9], gedurende de periode die op grond van
      [artikel 82, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref10], geldt op de dag waarop het recht
      op een uitkering op grond van [die wet][ref11] is ontstaan, te rekenen vanaf de laatstgenoemde dag;

      e. de uitvoeringskosten, voorzover deze betrekking hebben op de in de onderdelen a tot en met d bedoelde
      uitkeringen;

      f. de op grond van enige wet over de uitkeringen, bedoeld in de onderdelen a tot en met d, door het UWV
      verschuldigde premies of vergoedingen als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref12] die niet op
      deze uitkeringen in mindering kunnen worden gebracht;

      g. de kosten van de werkzaamheden, bedoeld in [artikel 63a, vierde en vijfde lid, van de Ziektewet][ref13] alsmede
      de schade, bedoeld in het [zesde lid van dat artikel][ref14], die wordt vergoed aan een eigenrisicodrager als
      bedoeld in [artikel 40, eerste lid, onderdeel a][ref15], en de daaraan verbonden uitvoeringskosten;

      h. de kosten van onderzoek, bedoeld in
      __REF000___________________________________________________________________________________________________________
      __;

      i. de bedragen van de premievrijstelling bij marginale arbeid, bedoeld in [afdeling 6 van hoofdstuk 3][ref17],
      toegepast op de sectorpremie;

      j. de uitvoeringskosten, voorzover deze betrekking hebben op de uitvoering van de
      [artikelen 38, vierde lid][ref18], [39][ref19] en [39a van de Ziektewet][ref20] ten aanzien van anderen dan
      de personen, bedoeld in onderdeel c, en niet reeds op grond van onderdeel d ten laste van een sectorfonds
      worden gebracht, alsmede de uitvoeringskosten, voorzover deze betrekking hebben op de uitvoering van
      [artikel 629, derde lid, onderdeel c, van Boek 7 van het Burgerlijk Wetboek][ref21];

      k. de kosten die in verband met de uitvoering van
      [artikel 30a, eerste lid, onderdeel b, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref22], ten
      aanzien van personen, die een uitkering ontvangen als bedoeld in onderdeel c.

      2 Het UWV is bevoegd in bijzondere gevallen voor de toepassing van het eerste lid, onderdeel a, werkzaamheden in de
      ene sector gelijk te stellen met werkzaamheden in een andere sector.

      3 [Artikel 21 van de Werkloosheidswet][ref23] is met betrekking tot de in het eerste lid, onderdeel a, bedoelde
      periode waarover de uitkering ten laste van een sectorfonds komt, van overeenkomstige toepassing.

      4 Het UWV brengt hetgeen ten laste van het sectorfonds komt, ten laste van het Algemeen Werkloosheidsfonds voor
      zoveel dit meer bedraagt dan het voor het sectorfonds op grond van [artikel 105, eerste en derde lid][ref24],
      vastgestelde maximum, met dien verstande, dat het UWV ten laste van het Arbeidsongeschiktheidsfonds brengt, voor
      zoveel dit uitkeringen, bedoeld in [artikel 104, eerste lid, onderdeel d][ref25], betreft die meer bedragen dan
      dit maximum.

      5 Ten laste van het sectorfonds komen voorts:

      a. de kosten die rechtstreeks verband houden met de uitvoering van
      [artikel 30a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref26] ten aanzien van een betrokkene,
      indien deze ten tijde van het aanvangen van de werkzaamheden van het re-integratiebedrijf, bedoeld in het
      [achtste lid van dat artikel][ref27], een uitkering als bedoeld in het eerste lid, onderdeel d, ontvangt; en

      b. de loonkostensubsidie, bedoeld in [artikel 37a van de Wet werk en inkomen naar arbeidsvermogen][ref28], indien
      de uitkeringsgerechtigde, met wie de werkgever aan wie de loonkostensubsidie wordt verstrekt een dienstbetrekking
      aangaat of is aangegaan, op de dag voorafgaand aan die dienstbetrekking recht heeft op een uitkering als bedoeld in
      het eerste lid, onderdeel d.

      6 In afwijking van het eerste lid, onderdelen c, e en f, komen de uitkeringen, die worden betaald door
      een eigenrisicodrager als bedoeld in [artikel 40, eerste lid, onderdeel a][ref29], of een werkgever die
      een onderneming verkrijgt als bedoeld in [artikel 63b, derde lid, van de Ziektewet][ref30], en de door
      hem gemaakte kosten ter zake van de betaling van die uitkeringen en van de werkzaamheden, bedoeld in
      [artikel 63a, eerste lid, van die wet][ref31], alsmede de op grond van enige wet over die uitkeringen verschuldigde
      premies of vergoedingen als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref32] die niet op die uitkeringen
      in mindering kunnen worden gebracht, niet ten laste van een sectorfonds.

      7 In afwijking van het eerste lid, onderdeel a, komen de uitkeringen op grond van de [Werkloosheidswet][ref33] die
      worden betaald gedurende de eerste dertien weken van ongeschiktheid van de werknemer tot het verrichten van zijn
      arbeid wegens ziekte, niet ten laste van een sectorfonds. [Artikel 20, zevende lid, van de Werkloosheidswet][ref34]
      is van overeenkomstige toepassing.

      8 Voor de bepaling van de periode van zes maanden, bedoeld in het eerste lid, onderdeel a, worden perioden waarin
      de werknemer uitkering ontvangt als bedoeld in het zevende lid, buiten aanmerking gelaten.


