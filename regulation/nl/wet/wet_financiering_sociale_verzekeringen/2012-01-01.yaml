  - number: 117b
    text: |-
      1 Ten laste van de Werkhervattingskas komen de door het UWV te betalen WGA uitkeringen,
      alsmede de op grond van enige wet over deze uitkeringen door het UWV verschuldigde premies
      en de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref1], die niet op
      deze uitkeringen in mindering kunnen worden gebracht gedurende de periode die op grond van
      [artikel 82, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2], geldt op de dag waarop het recht
      op uitkering op grond van [die wet][ref3] is ontstaan, te rekenen vanaf die dag.

      2 Indien een WGA uitkering wordt toegekend direct aansluitend op een op grond van
      [artikel 24 van de Wet werk en inkomen naar arbeidsvermogen][ref4] verlengd tijdvak waarin de verzekerde recht
      heeft op loon, wordt de duur van de verlenging van dat tijdvak in mindering gebracht op de periode, bedoeld in het
      eerste lid.

      3 Het eerste lid is niet van toepassing indien:

      a. het een WGA uitkering betreft die op grond van
      [artikel 72, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref5] door het UWV wordt betaald en op
      grond van het derde lid van dat artikel niet op een eigenrisicodrager wordt verhaald;

      b. het een WGA uitkering betreft die op grond van
      [artikel 83, derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref6] door het UWV wordt betaald en niet
      kan worden verhaald op een bank of verzekeraar als bedoeld in [artikel 40][ref7];

      c. het een WGA uitkering betreft, toegekend aan een werknemer, die uit de dienstbetrekking waaruit de WGA uitkering
      is ontstaan recht had op ziekengeld;

      d. het een WGA uitkering betreft, toegekend aan een werknemer, wiens WGA uitkering wordt toegekend in
      aansluiting op een voordien op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8] of de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref9] toegekende uitkering, danwel het op grond van de Wet
      werk en arbeidsondersteuning jonggehandicapten toegekende recht op arbeidsondersteuning;

      e. het een vervolguitkering als bedoeld in
      [artikel 62, derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref10] betreft, die door
      het UWV wordt betaald voorzover die uitkering meer bedraagt dan hetgeen berekend op grond van het
      [eerste en tweede lid van dat artikel][ref11];

      f. het een loonaanvullingsuitkering als bedoeld in
      [artikel 60, eerste lid, onderdeel a, van de Wet werk en inkomen naar arbeidsvermogen][ref12] betreft, die door
      het UWV wordt betaald voorzover die uitkering meer bedraagt dan een bedrag overeenkomende met het bedrag van de
      vervolguitkering, bedoeld in [artikel 60, eerste lid, onderdeel b, van die wet][ref13] waar de verzekerde, zonder
      toepassing van [artikel 62, derde lid][ref14], recht op zou hebben indien hij geen recht zou hebben gehad op
      de loonaanvullingsuitkering, bedoeld in [artikel 60, eerste lid, onderdeel a, van die wet][ref15], vermeerderd
      met de premies die op grond van enige wet daarover verschuldigd zouden zijn en de vergoeding, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref16], en die daarop niet in mindering kunnen worden gebracht.

      4 Het UWV bezigt de middelen die zijn gereserveerd ten behoeve van de Werkhervattingskas niet tot bestrijding van
      uitgaven ten laste van de Werkhervattingskas dan met toestemming van Onze Minister.

      5 Ten laste van de Werkhervattingskas komen voorts:

      a. de bedragen van de kortingen oudere werknemer en arbeidsgehandicapte werknemer en de premievrijstelling bij
      marginale arbeid, bedoeld in [afdeling 6 van hoofdstuk 3][ref17], toegepast op de gedifferentieerde premie ten
      behoeve van de Werkhervattingskas, bedoeld in [artikel 38][ref18]; en

      b. de loonkostensubsidie, bedoeld in [artikel 37a van de Wet werk en inkomen naar arbeidsvermogen][ref19], indien
      de uitkeringsgerechtigde, met wie de werkgever aan wie de loonkostensubsidie wordt verstrekt een dienstbetrekking
      aangaat of is aangegaan, op de dag voorafgaand aan die dienstbetrekking recht heeft op een uitkering die ten laste
      komt van de Werkhervattingskas.

      6 De kosten die verband houden met de uitvoering van
      [artikel 30a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref20] ten aanzien van een
      uitkeringsgerechtigde, indien deze ten tijde van het aanvangen van de werkzaamheden van het re-integratiebedrijf,
      bedoeld in het [achtste lid van dat artikel][ref21], recht heeft op een uitkering die ten laste komt van de
      Werkhervattingskas.

      7 Ten laste van de Werkhervattingskas komen voorts de uitvoeringskosten, voor zover deze betrekking hebben op de in
      het eerste lid bedoelde uitkeringen.

      8 Bij algemene maatregel van bestuur kunnen nadere en zonodig afwijkende regels worden gesteld met betrekking tot
      dit artikel.


