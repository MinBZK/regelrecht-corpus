      - id: ref3
        bwb_id: BWBR0002471
        artikel: 5a
  - number: '59'
    text: |-
      1 De premies voor de werknemersverzekeringen worden geheven met overeenkomstige toepassing van de voor de heffing
      van de loonbelasting geldende regels. [Artikel 32d van de Wet op de loonbelasting 1964][ref1] is slechts van
      overeenkomstige toepassing indien degene aan wie het loon wordt afgestaan, werkgever van de werknemer is.

      2 In de uitnodiging tot het doen van aangifte kan mede opgave worden verlangd van gegevens
      die noodzakelijk zijn ten behoeve van de vaststelling van de premiepercentages, bedoeld
      in de [artikelen 27][ref2], [28][ref3], [31][ref4], [36][ref5] en [38][ref6], alsmede
      ten behoeve van de doelen van de gegevensverwerking in de polisadministratie, bedoeld in
      [artikel 33, tweede lid, onderdelen a en e, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref7],
      waarbij met betrekking tot die verlangde gegevens de regels die gelden voor de heffing van de loonbelasting van
      overeenkomstige toepassing zijn.

      3 Een aanvraag tot het geven van een beschikking over het verzekerd zijn op grond van de werknemersverzekeringen
      kan door de werkgever uitsluitend bij de inspecteur worden ingediend. De inspecteur beslist bij voor bezwaar
      vatbare beschikking.

      4 In afwijking van [artikel 26 van de Algemene wet inzake rijksbelastingen][ref8]
      kan de werkgever tegen de uitspraak op bezwaar van de inspecteur op grond van de
      [artikelen 95][ref9] of [97][ref10] uitsluitend beroep instellen bij het gerechtshof. Op
      het beroep is [hoofdstuk V, afdeling 2, van de Algemene wet inzake rijksbelastingen][ref11],
      alsmede [hoofdstuk 8 van de Algemene wet bestuursrecht][ref12], met uitzondering van de
      [artikelen 8:1, eerste en tweede lid][ref13], [8:4][ref14], [8:5][ref15], [8:6, eerste lid][ref16], [8:8][ref17],
      [8:9][ref18] en [8:10][ref19], van overeenkomstige toepassing.

      5 De inspecteur stelt de werkgever zonodig op de hoogte van de door het UWV op aanvraag van de werknemer genomen
      beschikking over het verzekerd zijn op grond van de werknemersverzekeringen.

      6 In afwijking van de [artikelen 25b][ref20], [27f][ref21], [27j, derde lid][ref22], en
      [29i van de Algemene wet inzake rijksbelastingen][ref23] verleent de inspecteur een teruggaaf van premies voor de
      werknemersverzekeringen uitsluitend aan de werkgever.

      7 Indien in verband met een gevraagde beschikking informatie is gevraagd aan een persoon of
      instantie buiten Nederland en om die reden de beschikking niet binnen de termijn, bedoeld in
      [afdeling 4.1.3 van Algemene wet bestuursrecht][ref24], gegeven kan worden, wordt die termijn verlengd met ten
      hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in kennis gesteld.

      8 Met betrekking tot premies voor de werknemersverzekeringen wordt, in afwijking van
      [artikel 20, tweede lid, eerste zin, van de Algemene wet inzake rijksbelastingen][ref25], geen naheffingsaanslag
      aan de werknemer opgelegd en is de tweede zin van dat lid niet van toepassing.

      9 Het zevende lid is van overeenkomstige toepassing op een aanvraag als bedoeld in het derde lid en op een aanvraag
      of melding op grond van de [artikelen 40][ref26], [95][ref27] of [97][ref28].


