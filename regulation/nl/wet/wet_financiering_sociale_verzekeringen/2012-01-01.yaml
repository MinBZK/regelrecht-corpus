  - number: '107'
    text: |-
      Ten gunste van het Uitvoeringsfonds voor de overheid komen:

      a. de bedragen die het UWV ontvangt door de toepassing van [artikel 79 van de Werkloosheidswet][ref1];

      b. de premies op grond van [artikel 31][ref2];

      c. de premies geheven over uitkeringen en toeslagen van personen als bedoeld in [artikel 24, tweede lid][ref3];

      d. de bedragen die het UWV ontvangt door de toepassing van de [artikelen 27a][ref4] en
      [36 van de Werkloosheidswet][ref5], voorzover deze bedragen betrekking hebben op uitkeringen, die ten laste van dat
      fonds zijn gebracht;

      e. de bedragen die het UWV ontvangt door de uitoefening van zijn bevoegdheid op grond van
      [artikel 66 van de Werkloosheidswet][ref6] indien de in [dat artikel][ref7] bedoelde werkgever een
      overheidswerkgever is;

      f. de bedragen die het UWV ontvangt door de toepassing van [artikel 45a van de Ziektewet][ref8], voorzover deze
      bedragen betrekking hebben op uitkeringen, die ten laste van dat fonds zijn gebracht;

      g. de bedragen die het UWV ontvangt door de toepassing van de [artikelen 38, vierde lid][ref9], en
      [39a van de Ziektewet][ref10], indien de in het toegepaste artikel bedoelde werkgever een overheidswerkgever is;

      h. de bijdragen van de overheidswerkgever of overheidswerknemer in de kosten van het onderzoek, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________;

      i. de bedragen die het UWV ontvangt door de toepassing van de [artikelen 63a, derde tot en met vijfde lid][ref12],
      [63b, tweede lid][ref13], en [63c van de Ziektewet][ref14];

      j. de bedragen die het UWV ontvangt door toepassing van de [artikelen 76][ref15], [91][ref16] en
      [99 van de Wet werk en inkomen naar arbeidsvermogen][ref17], voorzover deze bedragen betrekking hebben op
      uitkeringen die ten laste van dat fonds zijn gebracht.


