  - number: '40'
    text: |-
      1 De inspecteur verleent overeenkomstig deze afdeling aan een werkgever op aanvraag bij voor bezwaar vatbare
      beschikking toestemming om zelf het risico te dragen van betaling van:

      a. het ziekengeld aan de personen, bedoeld in [artikel 29, tweede lid, onderdelen a, b en c, van de Ziektewet][ref1],
      die laatstelijk tot de werkgever in dienstbetrekking stonden; of

      b. WGA uitkering overeenkomstig [hoofdstuk 9 van de Wet werk en inkomen naar arbeidsvermogen][ref2].

      2 De werkgever legt bij een aanvraag als bedoeld in het eerste lid een schriftelijke garantie over waaruit blijkt
      dat een bank of een verzekeraar zich jegens het UWV verplicht, op het eerste verzoek van het UWV waarbij het
      UWV schriftelijk meedeelt dat de verplichtingen die voortvloeien uit het zelf dragen van het risico niet worden
      nagekomen, die verplichtingen na te komen.

      3 De overheidswerkgever, bedoeld in
      [artikel 1, onderdeel k, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref3], voorzover deze door
      Onze Minister in overeenstemming met Onze Minister van Financiën is aangewezen, is ontheven van de verplichting tot
      het overleggen van een schriftelijke garantie als bedoeld in het tweede lid.

      4 De in het eerste lid bedoelde toestemming wordt niet verleend gedurende drie jaren nadat het door de werkgever
      zelf dragen van het desbetreffende in het eerste lid bedoelde risico is beëindigd.

      5 Onder een bank als bedoeld in het tweede lid wordt verstaan een financiële onderneming die ingevolge de
      [Wet op het financieel toezicht][ref4] in Nederland het bedrijf van bank mag uitoefenen.

      6 Onder een verzekeraar als bedoeld in het tweede lid wordt verstaan een financiële onderneming die ingevolge de
      [Wet op het financieel toezicht][ref5] in Nederland het bedrijf van levensverzekeraar of schadeverzekeraar mag
      uitoefenen.

      7 De garantie, bedoeld in het tweede lid, wordt voor onbepaalde tijd gegeven. Deze garantie strekt zich
      uit tot rechtsopvolgers onder algemene titel van de eigenrisicodrager en tot het risico dat overgaat op
      de verkrijgende werkgever, bedoeld in [artikel 63b, derde lid, van de Ziektewet][ref6], respectievelijk
      [artikel 84, derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref7]. Deze garantie kan door de
      desbetreffende bank of verzekeraar niet worden beëindigd zonder schriftelijke opzegging bij de inspecteur.

      8 De garantie, bedoeld in het tweede lid, strekt zich niet uit tot:

      a. ziekengeld dan wel WGA-uitkering ter zake van ongeschiktheid tot werken die is ontstaan door een omstandigheid
      als bedoeld in [artikel 3:38 van de Wet op het financieel toezicht][ref8], door een omstandigheid die het gevolg
      is van een of meer terroristische handelingen voor zover de totale schade die in een kalenderjaar ten gevolge
      van dergelijke handelingen bij schade- of levensverzekeraars waarop de [Wet op het financieel toezicht][ref9]
      van toepassing is, zal worden gedeclareerd, naar verwachting van de Nederlandse Herverzekeringsmaatschappij voor
      Terrorismeschaden N.V. hoger zal zijn dan het door die maatschappij herverzekerde maximumbedrag per kalenderjaar,
      of door een kernongeval als bedoeld in [artikel 1, eerste lid, van de Wet aansprakelijkheid kernongevallen][ref10];

      b. de bestuurlijke boete, bedoeld in [artikel 63c van de Ziektewet][ref11].

      9 De toestemming, bedoeld in het eerste lid, wordt door de inspecteur verleend met ingang van 1 januari of 1
      juli van enig jaar, mits de aanvraag ten minste dertien weken voor de desbetreffende datum is ingediend. Aan een
      startende werkgever wordt op zijn verzoek toestemming verleend met ingang van het tijdstip waarop deze aanvangt
      werkgever te zijn.

      10 Het door de werkgever zelf dragen van het risico, bedoeld in het eerste lid:

      a. eindigt met ingang van de dag waarop de schriftelijke garantie, bedoeld in het tweede lid, eindigt,
      onderscheidenlijk met ingang van de dag waarop de eigenrisicodrager in staat van faillissement is verklaard of ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard dan wel de dag waarop
      hij ophoudt werkgever te zijn;

      b. wordt door de inspecteur op 1 januari of 1 juli van enig jaar beëindigd bij voor bezwaar vatbare beschikking op
      aanvraag van de werkgever, mits deze aanvraag ten minste dertien weken voor de desbetreffende datum is ingediend;

      c. kan door de inspecteur zonder aanvraag van de werkgever met onmiddellijke ingang bij voor
      bezwaar vatbare beschikking worden beëindigd indien de rechtbank de noodregeling, bedoeld in
      [hoofdstuk 3.5 van de Wet op het financieel toezicht][ref12] heeft uitgesproken over de betrokken verzekeraar
      onderscheidenlijk bank.

      11 In een geval als bedoeld in het tiende lid, onderdeel a, doet de inspecteur daarvan op verzoek van de werkgever
      mededeling bij voor bezwaar vatbare beschikking.

      12 Indien de periode, bedoeld in [artikel 82, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref13]
      wordt gewijzigd in die zin dat de wijziging een verlenging van de periode betekent, legt de werkgever die zelf
      het risico draagt van betaling de WGA uitkering, binnen een bij ministeriële regeling te bepalen termijn, een
      schriftelijke garantie over aan de inspecteur waaruit blijkt dat een bank of een verzekeraar zich jegens het UWV
      verplicht, op het eerste verzoek van het UWV, waarbij het UWV schriftelijk meedeelt dat de verplichtingen die
      voortvloeien uit het zelf dragen van het risico niet worden nagekomen, die verplichtingen na te komen.

      13 Indien niet of niet tijdig wordt voldaan aan het twaalfde lid, eindigt het door de werkgever zelf dragen van het
      risico, bedoeld in het eerste lid, onderdeel c, met ingang van de dag waarop de wijziging van de periode, bedoeld
      in [artikel 82, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref14] in werking treedt.

      14 Bij ministeriële regeling kunnen met betrekking tot het twaalfde en dertiende lid nadere regels worden gesteld.

      15 Beschikkingen van de inspecteur op grond van deze afdeling worden genomen gehoord het UWV en in overeenstemming
      met het UWV.

      17 Bij algemene maatregel van bestuur kan worden bepaald dat de toestemming, bedoeld in het negende lid, eerste
      zin, en de beëindiging, bedoeld in het tiende lid, onderdeel b, uitsluitend wordt verleend onderscheidenlijk
      plaatsvindt met ingang van 1 januari van enig jaar. Bij regeling van Onze Minister, in overeenstemming met Onze
      Minister van Financiën, kan in bijzondere omstandigheden de termijn van dertien weken, bedoeld in het negende lid,
      eerste zin, en het tiende lid, onderdeel b, worden ingekort.


