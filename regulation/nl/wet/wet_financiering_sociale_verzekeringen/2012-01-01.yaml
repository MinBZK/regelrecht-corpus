    text: |-
      1 Tot het jaar 2013 bedraagt de korting, bedoeld in [artikel 47, derde lid][ref1], € 2 750 per jaar.

      2 Tot het jaar 2010 worden de premiekortingen, bedoeld in de [artikelen 47][ref2] en [49][ref3], toegepast
      op enerzijds de op grond van de [artikelen 27][ref4] en [31][ref5] door de werkgever verschuldigde premies en
      anderzijds op de op grond van [afdeling 4 van hoofdstuk 3][ref6] verschuldigde premies.

      3 Bij de toepassing van het tweede lid bedragen de premiekortingen per soort verschuldigde premies de helft van de
      in de [artikelen 48][ref7] en [50][ref8] en in het eerste lid, genoemde bedragen.


