  - number: 113a
    text: |-
      Het UWV beheert en administreert afzonderlijk de in [artikel 33, derde lid][ref1], bedoelde middelen tot dekking
      van de uitgaven alsmede de middelen benodigd voor het vormen en in stand houden van een reserve, in de vorm van een
      Werkhervattingskas die deel uitmaakt van het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel33
