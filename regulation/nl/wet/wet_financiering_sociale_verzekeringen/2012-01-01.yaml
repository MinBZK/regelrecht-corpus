  - number: '89'
    text: Het College zorgverzekeringen beheert en administreert afzonderlijk een Algemeen Fonds Bijzondere Ziektekosten.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel89
  - number: '90'
    text: |-
      1 Ten gunste van het Algemeen Fonds Bijzondere Ziektekosten komen:

      a. de premie voor de algemene verzekering bijzondere ziektekosten;

      b. de inkomsten, die in verband met de algemene verzekering bijzondere ziektekosten voortvloeien uit internationale
      overeenkomsten;

      c. de bijdragen in de kosten van zorg die op grond van
      [artikel 6, vierde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] worden betaald door of namens de
      verzekerde, dan wel, in voorkomend geval, door het krachtens een wettelijke regeling tot betaling van zodanige
      bijdragen bevoegde orgaan dat uitkeringen of pensioenen uit hoofde van die regeling aan die verzekerde betaalbaar
      stelt;

      d. de bijdragen in de kosten van de heffingskortingen, bedoeld in [artikel 15][ref2];

      e. een rijksbijdrage als bedoeld in [artikel 14, tweede lid][ref3];

      f. door zorgaanbieders ingevolge een regel van de zorgautoriteit op grond van
      [artikel 37, eerste lid, aanhef en onder d, van de Wet marktordening gezondheidszorg][ref4] dan wel op aanwijzing
      van de zorgautoriteit op grond van [artikel 76, tweede lid, van die wet][ref5] afgedragen bedragen en door de
      zorgautoriteit van zorgaanbieders op grond van [artikel 81, eerste lid, onder c, van die wet][ref6] ingevorderde
      bedragen, voor zover die bedragen niet worden afgedragen aan het Zorgverzekeringsfonds of aan derden.

      2 Uit het Algemeen Fonds Bijzondere Ziektekosten worden betaald:

      a. de gehele of gedeeltelijke kosten van de algemene verzekering bijzondere ziektekosten en uitkeringen als bedoeld
      in [artikel 3.1.2 van de Invoerings- en aanpassingswet Zorgverzekeringswet][ref7];

      b. de uitgaven voor deze verzekering, voortvloeiende uit overeenkomsten, waaronder begrepen internationale
      overeenkomsten;

      c. de uitgaven die in verband met die verzekering voortvloeien uit enige andere wettelijke regeling dan de
      [Algemene Wet Bijzondere Ziektekosten][ref8];

      d. bijdragen aan Onze Minister van Veiligheid en Justitie in verband met diens financiële verantwoordelijkheid
      bedoeld in [artikel 6, vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref9];

      e. bijdragen aan Onze Minister van Defensie op grond van
      [artikel 7, derde lid, van de Algemene Wet Bijzondere Ziektekosten][ref10];

      f. uitgaven ten behoeve van subsidies, verstrekt op grond van
      [artikel 44 van de Algemene Wet Bijzondere Ziektekosten][ref11];

      g. de uitgaven, bedoeld in [artikel 10, vierde lid, van de Wet op de orgaandonatie][ref12];

      h. bedragen als bedoeld in [artikel 56a van de Wet marktordening gezondheidszorg][ref13];

      i. de door het College zorgverzekeringen op grond van een ministeriële regeling vastgestelde verdeelbedragen,
      zijnde aan de relevante zorgverzekeraars toegekende delen van de bedragen bedoeld in onderdeel f van het eerste
      lid.

      3 Uit het Algemeen Fonds Bijzondere Ziektekosten kunnen middelen worden gebruikt voor het vormen en in stand houden
      van een reserve. Bij ministeriële regeling kunnen door Onze Minister van Volksgezondheid, Welzijn en Sport, in
      overeenstemming met Onze Minister, met betrekking tot de vorige volzin nadere regels worden gesteld.

      4 Onverminderd het bepaalde krachtens [artikel 15][ref14] wordt jaarlijks aan het Algemeen Fonds Bijzondere
      Ziektekosten een bijdrage verleend voor de uitvoering van de Regeling Ziekenfondsraad Abortusklinieken 1992 dan
      wel de regeling die op grond van [artikel 44 van de Algemene Wet Bijzondere Ziektekosten][ref15] ter vervanging
      van die regeling is vastgesteld. Op de bijdrage worden voorschotten verleend. De bijdrage voor enig jaar is
      gelijk aan het saldo van de uitgaven en ontvangsten in het desbetreffende jaar met betrekking tot de uitvoering
      van de bedoelde regeling, voorzover door Onze Minister van Volksgezondheid, Welzijn en Sport aanvaard. Het
      College zorgverzekeringen neemt een specificatie van de ontvangsten en uitgaven op in de jaarrekening, bedoeld
      in [artikel 45 van de Algemene Wet Bijzondere Ziektekosten][ref16]. Onze Minister van Volksgezondheid, Welzijn en
      Sport stelt de bijdrage uiterlijk drie maanden na ontvangst van de jaarrekening vast.


