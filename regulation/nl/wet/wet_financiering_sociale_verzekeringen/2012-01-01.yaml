      1 De eigenrisicodrager met betrekking tot de WGA uitkering, bedoeld in [artikel 40, eerste lid, onderdeel b][ref1],
      is over het loon van de tot hem in dienstbetrekking staande werknemers de gedifferentieerde premie, bedoeld in
      [artikel 38][ref2], en over de door hem te betalen WGA uitkeringen de premie ten behoeve van de Werkhervattingskas,
      bedoeld in [artikel 38a][ref3], niet verschuldigd.

      2 De startende werkgever, bedoeld in [artikel 40, negende lid][ref4], is in afwachting van de door de inspecteur
      te nemen beslissing op aanvraag, bedoeld in [artikel 40, eerste lid, onderdeel b][ref5], over het loon van de
      tot hem in dienstbetrekking staande werknemers de gedifferentieerde premie, bedoeld in [artikel 38][ref6], niet
      verschuldigd.


