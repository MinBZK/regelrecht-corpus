  - number: '118'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de overheveling van gelden uit het
      Arbeidsongeschiktheidsfonds naar de Werkhervattingskas.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel118
  - number: '119'
    text: |-
      1 Het College zorgverzekeringen, het UWV en de SVB beheren en administreren elk fonds, met uitzondering van het
      Uitvoeringsfonds voor de overheid en de sectorfondsen, afzonderlijk.

      2 Het UWV beheert het Uitvoeringsfonds voor de overheid en de sectorfondsen gezamenlijk en administreert het
      Uitvoeringsfonds voor de overheid en elk sectorfonds afzonderlijk.

      3 Indien met betrekking tot een fonds de lasten de baten blijken te overtreffen, wordt het tekort niet gedekt uit
      een ander fonds.

      4 Het College zorgverzekeringen, het UWV en de SVB houden, elk afzonderlijk, de financiële middelen die deel
      uitmaken van hun fondsen aan in een of meer rekeningen-courant bij Onze Minister van Financiën.

      5 In afwijking van het vierde lid kunnen het College zorgverzekeringen, het UWV en de SVB een deel van de in het
      vierde lid bedoelde financiële middelen buiten de in het vierde lid bedoelde rekeningen-courant houden.

      6 Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport worden, in overeenstemming
      met Onze Minister van Financiën, na overleg met het College zorgverzekeringen, de SVB en het UWV, regels gesteld
      betreffende de omvang van het in het vijfde lid bedoelde deel van de financiële middelen.

      7 Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport kunnen, in overeenstemming
      met Onze Minister van Financiën, nadere regels worden gesteld omtrent het vierde lid.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel119
  - number: '120'
    text: |-
      1 Het College zorgverzekeringen, het UWV en de SVB kunnen, voor de uitvoering van hun wettelijke taken, beschikken
      over de financiële middelen die zij in rekening-courant bij Onze Minister van Financiën aanhouden.

      2 Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport worden, in overeenstemming
      met Onze Minister van Financiën en na overleg met het College zorgverzekeringen, het UWV en de SVB, regels gesteld
      omtrent de rente die over de saldi van de in [artikel 119, vierde lid][ref1], bedoelde rekeningen-courant wordt
      vergoed onderscheidenlijk in rekening wordt gebracht.

      3 Onze Minister van Financiën brengt voor het beheer van de in [artikel 119, vierde lid][ref2], bedoelde
      rekeningen-courant geen kosten in rekening.

      4 Bij een tekort aan financiële middelen maken het College zorgverzekeringen, het UWV en de SVB uitsluitend gebruik
      van de kredietfaciliteiten die door Onze Minister van Financiën worden verleend of lenen het UWV en de SVB uit een
      door hen beheerd fonds.

      5 Onze Minister van Financiën informeert dagelijks het College zorgverzekeringen, het UWV en de SVB ten aanzien van
      de in [artikel 119, vierde lid][ref3], bedoelde rekeningen-courant, in elk geval met betrekking tot:

      a. de slotstanden per dag;

      b. alle dagelijks geboekte mutaties of transacties in de desbetreffende rekening-courant.

      6 Het College zorgverzekeringen, het UWV en de SVB informeren Onze Minister van Financiën ten aanzien van de in
      [artikel 119, vierde lid][ref4], bedoelde rekeningen-courant, in elk geval met betrekking tot de prognoses van de
      saldi van de desbetreffende rekening-courant.

      7 Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport kunnen, in overeenstemming
      met Onze Minister van Financiën en na overleg met het College zorgverzekeringen, het UWV en de SVB, nadere regels
      worden gesteld omtrent het vierde, vijfde en zesde lid.

      8 Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport, in overeenstemming met
      Onze Minister van Financiën, kunnen regels worden gesteld met betrekking tot de door het College zorgverzekeringen,
      het UWV en de SVB beheerde fondsen betreffende:

      a. de onderscheiding van het vermogen van het fonds in verschillende bestanddelen en de normen tot vaststelling van
      de omvang van deze bestanddelen;

      b. de vorming, omvang en instandhouding van reserves.


