  - number: 122k
    text: |-
      1 Voor zover ter zake van het belastbare inkomen uit werk en woning
      [artikel 10a.8 van de Wet inkomstenbelasting 2001][ref1] wordt toegepast, wordt voor de toepassing van
      [artikel 8, eerste lid, eerste volzin][ref2], onder premie-inkomen verstaan het belastbare inkomen uit werk en
      woning, bepaald volgens de regels van [hoofdstuk 3 van de Wet inkomstenbelasting 2001][ref3], met inachtneming van
      artikel 10a.8 van die wet.

      2 Ingeval ter zake van het belastbare loon [artikel 39c van de Wet op de loonbelasting 1964][ref4] wordt toegepast:

      1°. wordt voor de toepassing van [artikel 8, tweede lid][ref5], onder premie-inkomen verstaan het belastbare loon
      in de zin van de [wet op de loonbelasting 1964][ref6] met uitzondering van de eindheffingsbestanddelen, bedoeld in
      [artikel 31, eerste lid, onderdelen e, onder 1°, f en g, van die wet][ref7], zoals dat op 31 december 2010 luidde:

      2°. behoren voor de toepassing van [artikel 16, tweede lid, aanhef en onderdeel b][ref8],
      niet tot het loon eindheffingsbestanddelen als bedoel in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref9], zoals dit op
      31 december 2010 luidde.

      3 Dit artikel komt te vervallen met ingang van de dag waarop
      [artikel 39c van de Wet op de loonbelasting 1964][ref10] komt te vervallen.


