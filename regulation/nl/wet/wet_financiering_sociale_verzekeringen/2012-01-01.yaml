  - number: '17'
    text: |-
      1 Het loon, waarnaar de premies op grond van dit hoofdstuk worden geheven, wordt bij dezelfde werkgever tot geen
      hoger bedrag in aanmerking genomen dan het door Onze Minister met betrekking tot het kalenderjaar vastgestelde
      bedrag. Voorts bedraagt het dagloon dat aan de uitkeringen op grond van de werknemersverzekeringen of vrijwillige
      werknemersverzekeringen ten grondslag ligt of wordt gelegd ten hoogste het bedrag, bedoeld in de eerste volzin, met
      betrekking tot een loontijdvak van een dag, waarbij het kalenderjaar wordt gesteld op 261 dagen.

      2 Van het bij dezelfde werkgever genoten loon, waarnaar de premie op grond van [afdeling 2 van dit hoofdstuk][ref1]
      wordt geheven, blijft, wat betreft het deel van de premie dat ten gunste komt van het Algemeen Werkloosheidsfonds,
      buiten aanmerking tot een door Onze Minister met betrekking tot het kalenderjaar vastgesteld bedrag. Het bedrag,
      bedoeld in de eerste volzin, kan voor de werkgever en voor de werknemer verschillend worden vastgesteld.

      3 De bedragen, bedoeld in het eerste en tweede lid, worden herleid en vastgesteld voor
      loontijdvakken waarin loon als bedoeld in [artikel 16][ref2] wordt genoten waarvoor Onze Minister
      dit nodig acht. Voor de herleiding van het loontijdvak van een jaar naar een ander loontijdvak is
      [artikel 25, eerste en vierde lid, van de Wet op de loonbelasting 1964][ref3] van overeenkomstige toepassing, met
      uitzondering van de toepassing voor het dagloon, bedoeld in het eerste lid, tweede volzin. Indien een wijziging
      ingaat op een ander tijdstip dan 1 januari, vindt de vaststelling plaats in overeenstemming met Onze Minister van
      Financiën.

      4 Indien voor een werknemer die van verschillende werkgevers loon heeft genoten premie is betaald over een hoger
      loonbedrag dan het bedrag, bedoeld in het eerste lid, eerste volzin, stelt de inspecteur bij voor bezwaar vatbare
      beschikking het bedrag van de teveel betaalde premie vast. Bij die vaststelling wordt het voor de premieheffing in
      aanmerking komende loon berekend naar evenredigheid van het ten laste van die werkgevers genoten loon, en blijft
      bij de berekening van het loon waarnaar de premie op grond van [afdeling 2 van dit hoofdstuk][ref4], bedoeld in het
      tweede lid, wordt geheven, het voor premieberekening in aanmerking komende loon buiten aanmerking tot een evenredig
      deel van het bedrag, bedoeld in het tweede lid.

      5 Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën, kunnen regels worden
      gesteld voor de vaststelling van het voor premieberekening in aanmerking komende loon bij samenloop van loon
      dat gelijktijdig wordt genoten uit een dienstbetrekking in de zin van de [Wet op de Loonbelasting 1964][ref5]
      en uit een vroegere dienstbetrekking in de zin van die wet dan wel bij het gelijktijdig genieten van meer dan
      één uitkering of toeslag als bedoeld in [artikel 16, derde en vierde lid][ref6]. In de te stellen regels wordt
      uitgegaan van een totaal loonbedrag, dat niet hoger is dan het bedrag in het eerste lid, eerste volzin, waarbij
      niet meer dan één keer rekening wordt gehouden met dat bedrag.

      6 Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën, kunnen nadere en zo nodig van
      de vorige leden afwijkende regels worden gesteld.


