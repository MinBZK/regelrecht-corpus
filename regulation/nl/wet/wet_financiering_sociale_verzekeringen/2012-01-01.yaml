  - number: '13'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën en Onze Minister van
      Volksgezondheid, Welzijn en Sport, kunnen nadere regels worden gesteld met betrekking tot deze afdeling.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel13
  - number: '14'
    text: |-
      1 Bij ministeriële regeling kunnen bedragen worden vastgesteld die als rijksbijdrage ten gunste komen van het
      Nabestaandenfonds en het Ouderdomsfonds.

      2 Onze Minister van Volksgezondheid, Welzijn en Sport kan jaarlijks bedragen vaststellen die als rijksbijdrage ten
      gunste komen van het Algemeen Fonds Bijzondere Ziektekosten.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel14
  - number: '15'
    text: |-
      Ten gunste van het Ouderdomsfonds, het Nabestaandenfonds en het Algemeen Fonds Bijzondere Ziektekosten wordt
      jaarlijks een rijksbijdrage in de kosten van de heffingskortingen voor de volksverzekeringen toegekend. Deze
      bijdrage wordt door Onze Minister vastgesteld volgens de formule: BIKKt = (BIKKt-1 + A*Kt-1)*Kt/Kt-1 waarbij:

      BIKKt = de bijdrage in de kosten van de heffingskortingen ten gunste van het fonds in een bepaald jaar;

      BIKKt-1 = de bijdrage in de kosten van de heffingskortingen ten gunste van het fonds in het voorafgaande jaar;

      A = het aandeel van de premie ten gunste van het fonds in het gecombineerde heffingspercentage, bedoeld in
      [artikel 8.1, onderdeel c, van de Wet inkomstenbelasting 2001][ref1], in het jaar waarvoor de bijdrage wordt
      toegekend, verminderd met het aandeel in het daaraan voorafgaande jaar;

      Kt = de door Onze Minister, in overeenstemming met Onze Ministers van Financiën en van Volksgezondheid, Welzijn en
      Sport, geraamde totale kosten voor de heffingskortingen in het jaar waarvoor de bijdrage wordt toegekend;

      Kt-1 = de door Onze Minister, in overeenstemming met Onze Ministers van Financiën en van Volksgezondheid, Welzijn
      en Sport, geraamde totale kosten voor de heffingskortingen in het jaar voorafgaand aan het jaar waarvoor de
      bijdrage wordt toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel15
