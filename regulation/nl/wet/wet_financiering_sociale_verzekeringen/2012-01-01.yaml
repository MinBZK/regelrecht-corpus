  - number: '47'
    text: |-
      1 De werkgever past een korting toe op het totaal van de door hem en zijn werknemers op grond van
      [afdeling 2][ref1] en de door hem op grond van de [afdelingen 3][ref2] en [4][ref3] verschuldigde premies bij een
      dienstbetrekking met een werknemer:

      a. die onmiddellijk voorafgaand aan de aanvang van de dienstbetrekking recht heeft op een uitkering
      op grond van de [Werkloosheidswet][ref4], de [Wet op de arbeidsongeschiktheidsverzekering][ref5], de
      [Wet werk en inkomen naar arbeidsvermogen][ref6], de [Wet werk en arbeidsondersteuning jonggehandicapten][ref7],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8],
      de [Wet arbeidsongeschiktheidsvoorziening militairen][ref9], de
      [Wet werk en bijstand][ref10], de [Wet inkomensvoorziening oudere werklozen][ref11], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref12], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref13]
      en de [Algemene pensioenwet politieke ambtsdragers][ref14], of op wachtgeld als bedoeld in
      [artikel 6, vijfde lid, van de Werkloosheidswet][ref15], dan wel recht heeft op inkomensondersteuning op grond van
      de [Wet werk en arbeidsondersteuning jonggehandicapten][ref16]; en

      b. die op het moment van in dienst treden bij die werkgever 50 jaar of ouder is.

      De korting wordt toegepast voor zolang de dienstbetrekking met die werknemer duurt doch ten hoogste gedurende de
      eerste drie jaar vanaf de aanvang van die dienstbetrekking.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat het eerste lid van overeenkomstige toepassing is
      bij een dienstbetrekking met een werknemer, die behoort tot een nader te bepalen categorie van personen, die
      onmiddellijk voorafgaand aan de aanvang van de dienstbetrekking recht hebben op een nabestaandenuitkering op grond
      van de [Algemene nabestaandenwet][ref17].

      3 Ten aanzien van een werknemer die 62 jaar of ouder is, op wie in een tijdvak waarover premie wordt betaald het
      eerste of tweede lid niet van toepassing is, past de werkgever, voor zolang de dienstbetrekking duurt, een korting
      toe op het totaal van de verschuldigde premies, bedoeld in het eerste lid, met ingang van de eerste dag van het
      tijdvak waarover premie wordt betaald waarin de werknemer de leeftijd van 62 jaar bereikt.

      4 De werkgever bewaart bij de loonadministratie een verklaring van het Uitvoeringsinstituut
      werknemersverzekeringen, de Sociale verzekeringsbank, het college van burgemeester en wethouders of een andere
      uitkeringsinstantie, dat de werknemer, bedoeld in het eerste of tweede lid, voorafgaande aan de datum van aanvang
      van dienstbetrekking recht had op een uitkering als bedoeld in het eerste lid, onderdeel a, of voldoet aan het
      tweede lid.


