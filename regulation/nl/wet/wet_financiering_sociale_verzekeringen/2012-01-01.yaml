  - number: '97'
    text: |-
      1 De werkgever die op grond van [artikel 96][ref1] bij een sector is aangesloten of ophoudt bij een sector
      aangesloten te zijn, doet daarvan binnen twee weken schriftelijk melding bij de inspecteur.

      2 De inspecteur deelt een werkgever bij voor bezwaar vatbare beschikking mee, bij welke sector en vanaf welke datum
      hij op grond van [artikel 96][ref2] is aangesloten.

      3 In afwijking van [artikel 96, tweede lid][ref3], beslist de inspecteur bij voor bezwaar vatbare beschikking op
      aanvraag dat een werkgever met ingang van een door de inspecteur aan te geven datum voor door de inspecteur aan te
      wijzen werkzaamheden is aangesloten bij een andere sector dan de sector waartoe de werkzaamheden behoren die hij
      overigens doet verrichten.


