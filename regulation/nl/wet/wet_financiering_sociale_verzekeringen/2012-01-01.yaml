  - number: '43'
    text: |-
      1 De garantie, bedoeld in [artikel 40, tweede lid][ref1], met betrekking tot een aanvraag als bedoeld in het
      [eerste lid, onderdeel a, van dat artikel,][ref2] reikt tot het bedrag dat overeenkomstig [artikel 44][ref3] wordt
      berekend.

      2 De werkgever aan wie toestemming wordt verleend als bedoeld in
      [artikel 40, eerste lid, onderdeel a][ref4], neemt ter zake van de begeleiding van zijn zieke werknemers
      [artikel 14, eerste lid, onderdeel b, van de Arbeidsomstandighedenwet][ref5] in acht en legt bij zijn aanvraag een
      afschrift over van de schriftelijke vastlegging, bedoeld in [artikel 14, vierde lid, van die wet][ref6].

      3 De toestemming, bedoeld in [artikel 40, eerste lid, onderdeel a][ref7], kan, onverminderd het
      [tiende lid van dat artikel][ref8], door de inspecteur zonder aanvraag van de werkgever met onmiddellijke
      ingang bij voor bezwaar vatbare beschikking worden beëindigd indien de werkgever zich met betrekking
      tot de begeleiding van zijn zieke werknemers niet meer laat bijstaan door een persoon als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref9] die belast is met de bijstand, bedoeld in onderdeel
      b van dat lid of een arbodienst als bedoeld in [die wet][ref10].


