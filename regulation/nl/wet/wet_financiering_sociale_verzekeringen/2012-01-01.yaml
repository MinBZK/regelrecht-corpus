  - number: '106'
    text: |-
      Het UWV beheert en administreert afzonderlijk de in [artikel 107][ref1] bedoelde middelen tot dekking van de
      uitgaven en de uitgaven, bedoeld in de [artikelen 108][ref2], [109][ref3] en [110][ref4] in de vorm van een
      Uitvoeringsfonds voor de overheid dat deel uitmaakt van het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel107
