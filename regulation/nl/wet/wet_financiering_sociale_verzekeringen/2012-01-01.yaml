  - number: '108'
    text: |-
      1 Ten laste van het Uitvoeringsfonds voor de overheid komen:

      a. de op grond van de [Werkloosheidswet][ref1] te betalen uitkeringen aan de personen, bedoeld in
      [artikel 24][ref2];

      b. de op grond van [artikel 29, tweede lid, van de Ziektewet][ref3] te betalen uitkeringen aan de personen, bedoeld
      in [artikel 24][ref4];

      c. de op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref5] te betalen uitkeringen;

      d. de door het UWV te betalen WGA-uitkeringen aan de personen, bedoeld in [artikel 24][ref6], die uit
      de dienstbetrekking waaruit de WGA-uitkering is ontstaan, recht hadden op een uitkering als bedoeld
      in [artikel 29, tweede lid, onderdeel a, b of c, van de Ziektewet][ref7] dan wel van dit recht waren
      uitgesloten op grond van de [artikelen 19a][ref8] en [19b van de Ziektewet][ref9], en op een uitkering
      op grond van [artikel 29, tweede lid, onderdeel d, e, f en g][ref10] die aansluitend is toegekend
      op de uitkering op grond van [artikel 29, tweede lid, onderdeel a, b, of c van de Ziektewet][ref11]
      of [artikel 70 van de Ziektewet][ref12], gedurende de periode die op grond van
      [artikel 82, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref13], geldt op de dag waarop het recht
      op een uitkering op grond van [die wet][ref14] is ontstaan, te rekenen vanaf de laatstgenoemde dag;

      e. de uitvoeringskosten, voorzover deze betrekking hebben op de in de onderdelen a tot en met d bedoelde
      uitkeringen;

      f. de op grond van enige wet over de uitkeringen, bedoeld in onderdeel a tot en met d door het UWV verschuldigde
      premies of vergoedingen als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref15] die niet op deze uitkeringen
      in mindering kunnen worden gebracht;

      g. de kosten van het onderzoek, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________, indien dat op verzoek van een overheidswerkgever of overheidswerknemer is ingesteld;

      h. de uitvoeringskosten, voorzover betrekking hebbend op de uitvoering van de [artikelen 38, vierde lid][ref17],
      [39][ref18] en [39a van de Ziektewet][ref19] ten aanzien van overheidswerkgevers en overheidswerknemers, die niet
      reeds op grond van onderdeel c ten laste van dat fonds worden gebracht, voorzover deze betrekking hebben op de
      uitvoering van [artikel 629, derde lid, onderdeel c, van Boek 7 van het Burgerlijk Wetboek][ref20];

      i.

      j. de op diens aanvraag aan de werkgever door het UWV te verlenen vergoeding van de schade, die de werkgever
      lijdt door toepassing van [artikel 23, eerste lid, van de Werkloosheidswet][ref21] en de daaraan verbonden
      uitvoeringskosten;

      k. de uitvoeringskosten verbonden aan werkzaamheden gericht op het ontvangen van bedragen, premies en bijdragen als
      bedoeld in [artikel 107][ref22];

      l. de kosten van de werkzaamheden, bedoeld in [artikel 63a, vierde en vijfde lid, van de Ziektewet][ref23] alsmede
      de schade, bedoeld in het [zesde lid van dat artikel][ref24], die wordt vergoed aan een eigenrisicodrager als
      bedoeld in [artikel 40, eerste lid, onderdeel a][ref25], en de daaraan verbonden uitvoeringskosten;

      m. de tegemoetkoming in de kosten van kinderopvang, bedoeld in
      [artikel 1.29, eerste lid, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref26]
      ten behoeve van de ouder die een persoon is als bedoeld in [artikel 1.24][ref27] en in
      [artikel 1.6, eerste lid, onderdeel h, van die wet][ref28];

      n. de bedragen van de kortingen oudere werknemer en arbeidsgehandicapte werknemer en premievrijstelling bij
      marginale arbeid, bedoeld in [afdeling 6 van hoofdstuk 3][ref29], toegepast op de premies, berekend op grond van
      [artikel 31][ref30];

      o. de uitvoeringskosten die betrekking hebben op de uitvoering van
      [artikel 32, vijfde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref31];

      p. vergoedingen aan gemeenten die worden overeengekomen ter uitvoering van
      [artikel 30a, derde lid, onderdeel a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref32]
      voor zover [dat artikel][ref33] wordt toegepast ten aanzien van personen als bedoeld in
      [artikel 24 van de Werkloosheidswet][ref34].

      2 Ten laste van het Uitvoeringsfonds voor de overheid komen voorts de kosten die rechtstreeks verband houden met de
      uitvoering van [artikel 30a van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref35] ten aanzien van een
      betrokkene, indien deze ten tijde van het aanvangen van de werkzaamheden van het re-integratiebedrijf, bedoeld in
      het achtste lid van dat artikel:

      a. een uitkering ontvangt als bedoeld in het eerste lid, onderdeel a, en het UWV deze uitkering met toepassing van
      [artikel 79 van de Werkloosheidswet][ref36] niet kan verhalen op de overheidswerkgever; of

      b. een uitkering ontvangt als bedoeld in het eerste lid, onderdeel d.

      3 In afwijking van het eerste lid, onderdelen b, d en f, komen de uitkeringen, die worden betaald door
      een eigenrisicodrager als bedoeld in [artikel 40, eerste lid, onderdeel a][ref37], of een werkgever die
      een onderneming verkrijgt als bedoeld in [artikel 63b, derde lid, van de Ziektewet][ref38], en de door
      hem gemaakte kosten ter zake van de betaling van die uitkeringen en van de werkzaamheden, bedoeld in
      [artikel 63a, eerste lid, van die wet][ref39], alsmede de op grond van enige wet over die uitkeringen verschuldigde
      premies of vergoedingen als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref40] die niet op die uitkeringen
      in mindering kunnen worden gebracht, niet ten laste van het Uitvoeringsfonds voor de overheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
