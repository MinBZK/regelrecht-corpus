  - number: '114'
    text: |-
      Ten gunste van het Arbeidsongeschiktheidsfonds komen:

      a. de premies op grond van de [artikelen 36][ref1] en [75][ref2] en de premie op grond van [artikel 76a][ref3] voor
      zover deze niet ten gunste komt van de Werkhervatttingskas;

      b. de gelden die het UWV ontvangt door toepassing van de [artikelen 29a][ref4] en
      [91i van de Wet op de arbeidsongeschiktheidsverzekering][ref5];

      c. de gelden die het UWV ontvangt door toepassing van de [artikelen 57][ref6] en
      [90 van de Wet op de arbeidsongeschiktheidsverzekering][ref7] in verband met uitkeringen als bedoeld in
      [artikel 115, eerste lid, onderdeel a][ref8];

      d.

      e. de gelden die het UWV ontvangt door toepassing van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref9];

      f. een rijksbijdrage ter hoogte van het door Onze Minister geraamde bedrag aan lasten als bedoeld in
      [artikel 115, eerste lid, onderdeel c en onderdeel e][ref10] voor zover de uitvoeringskosten, bedoeld in dat
      laatste onderdeel betrekking hebben op de op grond van [hoofdstuk 3, afdeling 2, paragraaf 2][ref11], en de op
      grond van [artikel 3:30 van de Wet arbeid en zorg][ref12] te betalen uitkeringen;

      g. de gelden die het UWV ontvangt door toepassing van de [artikelen 86][ref13] en
      [91 van de Wet werk en inkomen naar arbeidsvermogen][ref14];

      h. de gelden die het UWV ontvangt door toepassing van de [artikelen 76][ref15] en
      [99 van de van de Wet werk en inkomen naar arbeidsvermogen][ref16] in verband met uitkeringen als bedoeld in
      [artikel 115, eerste lid, onderdeel d][ref17].


