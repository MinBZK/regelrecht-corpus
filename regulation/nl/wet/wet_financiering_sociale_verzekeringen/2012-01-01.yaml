  - number: '91'
    text: |-
      1 Het College zorgverzekeringen doet jaarlijks uitkeringen uit het Algemeen Fonds Bijzondere
      Ziektekosten ter dekking van de noodzakelijke uitgaven, gedaan voor de uitvoering van de in de
      [Algemene Wet Bijzondere Ziektekosten][ref1] geregelde verzekering, volgens bij of krachtens algemene maatregel van
      bestuur te stellen regelen.

      2 De zorgautoriteit is bevoegd vast te stellen dat uitgaven niet verantwoord waren voorzover deze
      door hem niet noodzakelijk worden geacht voor de uitvoering van de verzekering op grond van de
      [Algemene Wet Bijzondere Ziektekosten][ref2]. Met de uitkeringen, bedoeld in het eerste lid, evenals met de
      daarmee verkregen opbrengsten worden geen uitgaven gedekt waarvan de zorgautoriteit heeft vastgesteld dat zij niet
      verantwoord waren, tenzij de zorgautoriteit anders besluit.

      3 Op de uitkeringen, bedoeld in het eerste lid, kunnen voorschotten worden verleend overeenkomstig door het College
      zorgverzekeringen te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel91
