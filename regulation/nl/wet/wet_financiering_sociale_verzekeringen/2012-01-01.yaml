        artikel: '8.1'
  - number: '16'
    text: |-
      1 Voor de toepassing van dit hoofdstuk wordt onder loon verstaan het loon en de gage overeenkomstig de
      [Wet op de loonbelasting 1964][ref1], waarbij van die wet buiten toepassing blijven:

      a. [artikel 11, eerste lid, onderdelen j, onder 2° en 5°, en r, onder 4°][ref2];

      b. [artikel 11, eerste lid, onderdeel j, onder 4°][ref3], en [artikel 35, derde lid, onderdeel g][ref4], voorzover
      het de bedragen betreft die worden ingehouden op grond van dit hoofdstuk;

      c. [artikel 13bis][ref5].

      2 Tot het loon behoren niet:

      a. hetgeen uit een vroegere dienstbetrekking als bedoeld in de [Wet op de loonbelasting 1964][ref6] wordt genoten
      met uitzondering van:

      1°. de uitkeringen en toeslag, genoemd in het derde lid en vierde lid, en de aanvullingen daarop van degene tot wie
      de werknemer in dienstbetrekking staat,

      2°. hetgeen wordt genoten op grond van de [artikelen 628][ref7], [628a][ref8] en
      [629 van Boek 7 van het Burgerlijk Wetboek][ref9], alsmede hetgeen door de werknemer met een publiekrechtelijke
      dienstbetrekking wordt genoten op grond van naar aard en strekking overeenkomstige regelingen, en de aanvullingen
      daarop van degene tot wie de werknemer in dienstbetrekking staat;

      b. eindheffingsbestanddelen als bedoeld in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref10];

      c. een vergoeding als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref11] of een
      werkgeversbijdrage in de premie voor de ziektekostenverzekering van een persoon, bedoeld in
      [artikel 2, tweede lid, onderdeel a, van de Zorgverzekeringswet][ref12];

      d. uitkeringen op grond van een regeling als bedoeld in
      [artikel 11, eerste lid, onderdeel j, onder 5°, van de Wet op de loonbelasting 1964][ref13].

      3 De uitkeringen en de toeslag, bedoeld in het tweede lid, onderdeel a, onder 1°, zijn:

      a. een uitkering op grond van een werknemersverzekering, al dan niet vermeerderd met een toeslag op grond van de
      [Toeslagenwet][ref14];

      b. een uitkering op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref15];

      c. wachtgeld als bedoeld in [artikel 6, vijfde lid, tweede zin, van de Werkloosheidswet][ref16].

      4 De toeslag die de werknemer die geen ziekengeld op grond van [artikel 29, eerste lid, van de Ziektewet][ref17]
      ontvangt, ontvangt op grond van de [Toeslagenwet][ref18], wordt voor de toepassing van het tweede lid, onderdeel a,
      onder 1°, geacht een uitkering te zijn.


