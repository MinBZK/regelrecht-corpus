  - number: '51'
    text: |-
      1 Op aanvraag van een werkgever verleent de inspecteur, gehoord het UWV en in overeenstemming met het UWV, bij voor
      bezwaar vatbare beschikking vrijstelling van alle op grond van dit hoofdstuk verschuldigde premies ter zake van een
      dienstbetrekking met een uitkeringsgerechtigde indien:

      a. de dienstbetrekking ten hoogste zes aaneengesloten weken duurt; en

      b. de werkgever in het kalenderjaar niet eerder een dienstbetrekking met die uitkeringsgerechtigde is aangegaan; en

      c. voor een dienstbetrekking van die uitkeringsgerechtigde in het kalenderjaar niet eerder vrijstelling is
      verleend.

      2 Voor de toepassing van het eerste lid worden dienstbetrekkingen tussen de werkgever en de uitkeringsgerechtigde
      geacht eenzelfde niet onderbroken dienstbetrekking te zijn, indien die dienstbetrekkingen elkaar met tussenpozen
      van niet meer dan eenendertig dagen zijn opgevolgd.

      3 Voor de toepassing van deze paragraaf wordt onder uitkeringsgerechtigde verstaan: degene wiens
      inkomen uit en in verband met arbeid in het bedrijfs- en beroepsleven onmiddellijk voorafgaande
      aan de aanvang van de in het eerste lid, aanhef, bedoelde dienstbetrekking uitsluitend bestaat
      uit een uitkering of inkomensvoorziening op grond van de [Wet werk en bijstand][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3],
      de [Werkloosheidswet][ref4], de [Wet werk en inkomen naar arbeidsvermogen][ref5], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7],
      de [Wet werk en arbeidsondersteuning jonggehandicapten][ref8], de [Wet inkomensvoorziening oudere werklozen][ref9]
      de [Toeslagenwet][ref10] of uit een uitkering op grond van vergelijkbare regelingen dan wel uit een combinatie van
      deze uitkeringen en die bij het UWV als werkzoekende is geregistreerd.

      4 Het derde lid is van overeenkomstige toepassing op de persoon die recht op arbeidsondersteuning heeft op grond
      van de [Wet werk en arbeidsondersteuning jonggehandicapten][ref11].


