  - number: 117a
    text: |-
      Ten gunste van de Werkhervattingskas komen:

      a. de premie op grond van [artikel 38, eerste lid][ref1], de gedifferentieerde premie ten behoeve van de
      Werkhervattingskas op grond van [artikel 38a, eerste lid][ref2], en de premie op grond van [artikel 76a][ref3]
      voorzover deze de gedifferentieerde premie ten behoeve van de Werkhervattingskas op grond van
      [artikel 38, eerste lid][ref4], niet overschrijdt;

      b. de gelden die het UWV ontvangt met toepassing van de [artikelen 76][ref5], [83, derde lid][ref6],
      [84, tweede en vierde lid][ref7], en [99 van de Wet werk en inkomen naar arbeidsvermogen][ref8] in verband met
      uitkeringen als bedoeld in [artikel 117b, eerste lid][ref9];

      c. de gelden die door toepassing van [artikel 118][ref10] worden overgeheveld uit het Arbeidsongeschiktheidsfonds.


