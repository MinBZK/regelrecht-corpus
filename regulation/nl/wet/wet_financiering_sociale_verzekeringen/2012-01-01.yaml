  - number: '77'
    text: |-
      Degene die is toegelaten tot een vrijwillige verzekering, is verplicht aan de SVB of het UWV onverwijld uit eigen
      beweging mededeling te doen van alle feiten en omstandigheden waarvan het hem redelijkerwijs duidelijk is, dat zij
      van invloed zijn op de hoogte van de verschuldigde premie.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel77
  - number: '78'
    text: |-
      In afwijking van [artikel 7:3 van de Algemene wet bestuursrecht][ref1] kan van het horen van een belanghebbende
      worden afgezien ten aanzien van een besluit inzake de verschuldigde premie voor een vrijwillige verzekering indien
      de belanghebbende niet binnen een door de SVB of het UWV gestelde redelijke termijn, verklaart dat hij gebruik wil
      maken van het recht te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel73
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:3
  - number: '79'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist de SVB of het UWV
      binnen dertien weken gerekend vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is
      verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel710
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:10
  - number: '80'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      vaststelling, de inning en de betaling van de premie voor een vrijwillige verzekering.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel80
  - number: '81'
    text: |-
      Bij regeling van Onze Minister en Onze Ministers van Financiën en van Volksgezondheid, Welzijn en Sport
      worden regels gesteld met betrekking tot de afdracht van de premie voor de volksverzekeringen en de premies
      voor de werknemersverzekeringen alsmede van de daarmee verband houdende bestuurlijke boeten en renten door de
      rijksbelastingdienst aan de fondsen en de wijze van toerekening van die premies, boeten en renten aan de fondsen.
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel81
  - number: '82'
    text: |-
      1 De SVB beheert en administreert afzonderlijk de middelen tot dekking van de uitgaven, bedoeld in
      [artikel 83, tweede lid][ref1], in de vorm van een Ouderdomsfonds.

      2 De SVB beheert en administreert afzonderlijk de middelen tot dekking van de uitgaven, bedoeld in
      [artikel 85, tweede lid][ref2], in de vorm van een Nabestaandenfonds.

      3 Het Ouderdomsfonds en het Nabestaandenfonds maken deel uit van de SVB.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel85
    url: https://wetten.overheid.nl/BWBR0017745/2012-01-01#Artikel82
    references:
