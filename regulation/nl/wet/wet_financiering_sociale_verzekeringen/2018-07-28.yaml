    text: |-
      1 Ten gunste van een sectorfonds komen:

      a. de premies op grond van [artikel 28][ref1], met uitzondering van de premies die op grond van het derde lid van
      dat artikel ten gunste komen van het Algemeen Werkloosheidsfonds, en de premie op grond van [artikel 74][ref2],
      voorzover deze de premie op grond van artikel 28, tweede lid, niet overschrijdt;

      b. de bedragen, die het UWV ontvangt door toepassing van de [artikelen 27a][ref3] en
      [36 van de Werkloosheidswet][ref4], voorzover deze bedragen betrekking hebben op uitkeringen die ten laste van dit
      fonds zijn gebracht;

      c. de bedragen, die het UWV op grond van [artikel 100, onderdeel d][ref5], ten laste van het Algemeen
      Werkloosheidsfonds brengt.

      2 Bij ministeriële regeling wordt een jaarlijkse bijdrage vastgesteld die in een kalenderjaar ten gunste komt
      van het sectorfonds waarin werkgevers op grond van [artikel 95][ref6] zijn ingedeeld, die zich in het kader
      van de uitoefening van hun bedrijf of beroep bezighouden met het ter beschikking stellen van arbeidskrachten
      aan een derde om krachtens een door deze aan de werkgever verstrekte opdracht arbeid te verrichten onder
      leiding en toezicht van de derde, waarbij die werknemers werkzaam zijn op basis van een uitzendovereenkomst als
      bedoeld in [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref7], waarin tevens een beding als bedoeld in
      [artikel 691, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref8] is opgenomen.


