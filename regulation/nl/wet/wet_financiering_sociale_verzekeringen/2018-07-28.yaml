  - number: '18'
    text: |-
      1 Het bedrag, bedoeld in [artikel 17, eerste lid][ref1], wordt herzien
      met ingang van de dag waarop en in de mate waarin het bedrag genoemd in
      [artikel 8, eerste lid, onderdeel c, van de Wet minimumloon en minimumvakantiebijslag][ref2] wordt herzien.

      2 De dag, bedoeld in het eerste lid, en het overeenkomstig het eerste lid herziene bedrag worden door Onze Minister
      in de Staatscourant bekend gemaakt.

      3 Het overeenkomstig het eerste lid herziene bedrag treedt in de plaats van het bedrag, bedoeld in
      [artikel 17, eerste lid][ref3].

      4 Uitsluitend voor de berekening van het loon waarnaar de premies worden geheven, blijft het bedrag, bedoeld in
      [artikel 17, eerste lid][ref4], zoals dat geldt per 1 januari van een kalenderjaar gedurende dat hele kalenderjaar
      van kracht.


