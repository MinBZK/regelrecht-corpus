  - number: 117a
    text: |-
      Ten gunste van de Werkhervattingskas komen:

      a. de gedifferentieerde premie op grond van de [artikelen 38, tweede lid][ref1], en [38a, eerste lid][ref2], en de
      premie op grond van [artikel 76a][ref3] voor zover deze de gedifferentieerde premie op grond van artikel 38, tweede
      lid, niet overschrijdt;

      b. de gelden die het UWV ontvangt met toepassing van de [artikelen 76][ref4], [82, vierde en vijfde lid][ref5],
      [84, derde lid][ref6], en [99 van de Wet werk en inkomen naar arbeidsvermogen][ref7] in verband met uitkeringen als
      bedoeld in [artikel 117b, eerste lid][ref8];

      c. de gelden die door toepassing van [artikel 118][ref9] worden overgeheveld uit het Arbeidsongeschiktheidsfonds.


