    text: |-
      1 Periodiek wordt door de SVB een bijdrage ten laste gebracht van het Ouderdomsfonds die ten gunste komt van het
      Zorgverzekeringsfonds, bedoeld in [artikel 39, eerste lid, van de Zorgverzekeringswet][ref1].

      2 De bijdrage, bedoeld in het eerste lid, vormt het verschil tussen het in het kalenderjaar geldende percentage,
      bedoeld in [artikel 45, eerste lid, van de Zorgverzekeringswet][ref2], dat wordt toegepast voor het loon, bedoeld
      in [artikel 42, eerste lid, van de Zorgverzekeringswet][ref3] en het in het kalenderjaar geldende percentage,
      bedoeld in artikel 45, tweede lid, van de Zorgverzekeringswet, dat wordt toegepast voor het bijdrage-inkomen,
      bedoeld in [artikel 43, tweede lid, van de Zorgverzekeringswet][ref4], vermenigvuldigd met de lasten van de
      algemene ouderdomsverzekering en de vrijwillige algemene ouderdomsverzekering.

      3 De SVB stelt regels omtrent de termijnen waarin en de wijze waarop de bijdrage, bedoeld in het eerste lid,
      betaalbaar wordt gesteld.

      4 De door de SVB op grond van het derde lid gestelde regels behoeven de goedkeuring van Onze Minister, na overleg
      met Onze Ministers van Financiën en van Volksgezondheid, Welzijn en Sport.


