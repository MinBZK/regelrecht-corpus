  - number: 122n
    text: |-
      1 De quotumheffing, bedoeld in [hoofdstuk 3, afdeling 4, paragraaf 4a][ref1], wordt niet uitgevoerd
      dan nadat bij regeling van Onze Minister, in overeenstemming met het gevoelen van de ministerraad,
      tot invoering is besloten indien is gebleken dat het aantal banen voor arbeidsbeperkten als bedoeld in
      [artikel 38b, eerste lid, en het vierde lid][ref2], in onvoldoende mate is toegenomen ten opzichte van het aantal
      van deze banen op 1 januari 2013, waarbij dit apart wordt beoordeeld voor de sector overheid onderscheidenlijk de
      sector niet-overheid.

      2 Bij regeling van Onze Minister wordt ten behoeve van de vaststelling van de toename, bedoeld in het eerste
      lid, het aantal banen bepaald voor arbeidsbeperkten, bedoeld in het eerste lid, uitgedrukt in verloonde uren op
      1 januari 2013 voor de sector overheid onderscheidenlijk de sector niet-overheid en wordt voor de desbetreffende
      sector voor het desbetreffende kalenderjaar, bepaald:

      a. het cumulatief aantal extra te realiseren banen voor deze arbeidsbeperkten uitgedrukt in verloonde uren;

      b. het cumulatief aantal gerealiseerde banen voor deze arbeidsbeperkten uitgedrukt in verloonde uren, en

      c. de uitkomst van de vergelijking tussen het cumulatief aantal banen, bedoeld in de onderdelen a en b, uitgedrukt
      in verloonde uren.

      3 Voor de toepassing van het tweede lid wordt niet als arbeidsbeperkte beschouwd de persoon die arbeid verricht
      in een dienstbetrekking in de zin van [artikel 2 van de Wet sociale werkvoorziening][ref3], tenzij deze persoon op
      grond van het vierde lid is aangewezen en aan de werkgever in de sector overheid onderscheidenlijk de sector niet-
      overheid ter beschikking is gesteld.

      4 Bij regeling van Onze Minister worden categorieën arbeidsbeperkten die aan de werkgever in de sector overheid
      onderscheidenlijk de sector niet-overheid ter beschikking zijn gesteld om voor hem onder zijn toezicht en
      leiding arbeid te verrichten, aangewezen die overeenkomstig die regeling te stellen regels worden beschouwd
      als arbeidsbeperkten waarop het tweede lid van toepassing is. Deze categorieën arbeidsbeperkten worden voor de
      toepassing van het tweede lid niet geacht in dienstbetrekking te staan tot de werkgever in de sector overheid
      onderscheidenlijk de sector niet-overheid die deze arbeidsbeperkten ter beschikking heeft gesteld.

      5 Een krachtens het eerste lid vastgestelde ministeriële regeling wordt gelijktijdig aan de beide kamers
      der Staten-Generaal overgelegd. De ministeriële regeling treedt niet eerder in werking dan vier weken na de
      overlegging.


