  - number: 117b
    text: |-
      1 Ten laste van de Werkhervattingskas komen de door het UWV te betalen:

      a. WGA-uitkeringen en de overlijdensuitkering, bedoeld in
      [artikel 74, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] gedurende de periode die op grond
      van [artikel 83, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2], geldt op de dag waarop het
      recht van uitkering op grond van die wet is ontstaan te rekenen vanaf die dag, met dien verstande dat de WGA-
      staartlastuitkeringen en de uitvoeringskosten en andere kosten in verband met deze uitkeringen ten laste komen van
      het staartlastenvermogen;

      b. ziekengeld als bedoeld in [artikel 29, tweede lid, onderdeel a, b of c][ref3], en de overlijdensuitkering,
      bedoeld in [artikel 35 van de Ziektewet][ref4];

      c. de op grond van enige wet over de uitkeringen, bedoeld in de onderdelen a en b, door het UWV verschuldigde
      premies en de inkomensafhankelijke bijdrage, bedoeld in [artikel 42 van de Zorgverzekeringswet][ref5].

      2 Indien een WGA uitkering wordt toegekend direct aansluitend op een op grond van
      [artikel 24 van de Wet werk en inkomen naar arbeidsvermogen][ref6] verlengd tijdvak waarin de verzekerde recht
      heeft op loon, wordt de duur van de verlenging van dat tijdvak in mindering gebracht op de periode, bedoeld in het
      eerste lid.

      3 Het eerste lid is niet van toepassing indien:

      a. het een WGA uitkering betreft die op grond van
      [artikel 72, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref7] door het UWV wordt betaald en op
      grond van het derde lid van dat artikel niet op een eigenrisicodrager wordt verhaald;

      b. het een WGA uitkering betreft die op grond van
      [artikel 84, derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref8] door het UWV wordt betaald en niet
      kan worden verhaald op een bank of verzekeraar als bedoeld in [artikel 40][ref9];

      c. het een WGA-uitkering betreft, toegekend aan een werknemer die uit de dienstbetrekking
      waaruit de WGA-uitkering is ontstaan recht had op ziekengeld als bedoeld in
      [artikel 29, tweede lid, onderdeel d, e, f of g, van de Ziektewet][ref10] of op ziekengeld als bedoeld in
      artikel 29, tweede lid, onderdelen a, b en c, dat aan een werknemer is toegekend direct aansluitend op een
      dienstbetrekking waarin recht op ziekengeld als bedoeld in artikel 29, tweede lid, onderdeel e, f of g, bestond;

      d. het een WGA uitkering betreft, toegekend aan een werknemer, wiens WGA uitkering wordt toegekend in
      aansluiting op een voordien op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref11] of de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref12] toegekende uitkering, danwel het op grond van de
      Wet arbeidsongeschiktheidsvoorziening jonggehandicapten toegekende recht op arbeidsondersteuning;

      e. het een vervolguitkering als bedoeld in
      [artikel 62, derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref13] betreft, die door
      het UWV wordt betaald voorzover die uitkering meer bedraagt dan hetgeen berekend op grond van het
      [eerste en tweede lid van dat artikel][ref14];

      f. het een loonaanvullingsuitkering als bedoeld in
      [artikel 60, eerste lid, onderdeel a, van de Wet werk en inkomen naar arbeidsvermogen][ref15] betreft, die door
      het UWV wordt betaald voorzover die uitkering meer bedraagt dan een bedrag overeenkomende met het bedrag van de
      vervolguitkering, bedoeld in [artikel 60, eerste lid, onderdeel b, van die wet][ref16] waar de verzekerde, zonder
      toepassing van [artikel 62, derde lid][ref17], recht op zou hebben indien hij geen recht zou hebben gehad op de
      loonaanvullingsuitkering, bedoeld in [artikel 60, eerste lid, onderdeel a, van die wet][ref18], vermeerderd met de
      premies die op grond van enige wet daarover verschuldigd zouden zijn en de inkomensafhankelijke bijdrage, bedoeld
      in [artikel 42 van de Zorgverzekeringswet][ref19], en die daarop niet in mindering kunnen worden gebracht;

      g. het uitkeringen als bedoeld in het eerste lid, onderdeel b, betreft toegekend aan werknemers, die op de
      eerste dag van ongeschiktheid tot werken in dienstbetrekking stonden van eigenrisicodragers als bedoeld in
      [artikel 40, eerste lid, onderdeel a][ref20], voor de betaling van die uitkering de eigenrisicodrager op grond van
      [artikel 63b, eerste lid, van de Ziektewet][ref21] niet het risico draagt;

      h. het uitkeringen betreft als bedoeld in het eerste lid, onderdeel a, die op grond van
      [artikel 133l, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref22] niet ten laste komen van
      de eigenrisicodragers, met dien verstande dat het eerste lid van toepassing is op een bij of krachtens algemene
      maatregel van bestuur bepaald deel van die uitkeringen;

      i. het ziekengeld als bedoeld in [artikel 29, tweede lid, onderdeel a, b of c][ref23], betreft dat op grond van
      [artikel 63a, derde lid, van de Ziektewet][ref24] door het UWV wordt betaald en niet kan worden verhaald op de
      eigenrisicodrager, bedoeld in [artikel 40, eerste lid, onderdeel a][ref25];

      j. het een WGA-uitkering betreft, toegekend aan een werknemer, die naar de dienstbetrekking waaruit de
      WGA uitkering is ontstaan, is toegeleid door het college van burgemeester en wethouders op grond van
      [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref26] en waarbij bij ziekte van die werknemer
      de mogelijkheid tot vergoeding als bedoeld in [artikel 8a, tweede lid, onderdeel b, van die wet][ref27],
      zoals dat luidde op 31 december 2015, van toepassing was of het ziekengeld betreft als bedoeld in
      [artikel 29, tweede lid, onderdeel a, b en c][ref28], dat aan die werknemer is toegekend direct aansluitend op een
      hiervoor bedoelde dienstbetrekking;

      k. het ziekengeld betreft als bedoeld in [artikel 29, tweede lid, onderdelen a, b en c, van de Ziektewet][ref29]
      toegekend aan een werknemer direct aansluitend op een dienstbetrekking waarin recht op ziekengeld op grond van
      [artikel 29, tweede lid, onderdeel e, f of g, van de Ziektewet][ref30] bestond.

      4 Het UWV bezigt de middelen die zijn gereserveerd ten behoeve van de Werkhervattingskas niet tot bestrijding van
      uitgaven ten laste van de Werkhervattingskas dan met toestemming van Onze Minister.

      5 Ten laste van de Werkhervattingskas komen voorts:

      a.

      b. de loonkostensubsidie, bedoeld in [artikel 37a van de Wet werk en inkomen naar arbeidsvermogen][ref31] zoals
      dat luidde op 31 december 2011, indien de uitkeringsgerechtigde, met wie de werkgever aan wie de loonkostensubsidie
      wordt verstrekt een dienstbetrekking aangaat of is aangegaan, op de dag voorafgaand aan die dienstbetrekking recht
      heeft op een uitkering die ten laste komt van de Werkhervattingskas;

      c. de kosten die verband houden met de uitvoering van
      [artikel 30a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref32] ten aanzien van een
      uitkeringsgerechtigde, indien deze ten tijde van het aanvangen van de werkzaamheden van het re-integratiebedrijf,
      bedoeld in het achtste lid van dat artikel, recht heeft op een uitkering die ten laste komt van de
      Werkhervattingskas.

      6 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.


