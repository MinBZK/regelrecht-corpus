  - number: '108'
    text: |-
      1 Ten laste van het Uitvoeringsfonds voor de overheid komen:

      a. de op grond van de [Werkloosheidswet][ref1] te betalen uitkeringen aan de personen, bedoeld in
      [artikel 24][ref2];

      b. de op grond van [artikel 29, tweede lid, onderdeel d, van de Ziektewet][ref3] te betalen uitkeringen aan de
      personen, bedoeld in [artikel 24][ref4];

      c.

      d.

      e. de uitvoeringskosten, voorzover deze betrekking hebben op de in de onderdeel a en b bedoelde uitkeringen;

      f. de op grond van enige wet over de uitkeringen, bedoeld in onderdeel a en b door het UWV verschuldigde premies
      en de inkomensafhankelijke bijdrage, bedoeld in [artikel 42 van de Zorgverzekeringswet][ref5], die niet op deze
      uitkeringen in mindering kunnen worden gebracht;

      g.

      h.

      i.

      j. de op diens aanvraag aan de werkgever door het UWV te verlenen vergoeding van de schade, die de werkgever
      lijdt door toepassing van [artikel 23, eerste lid, van de Werkloosheidswet][ref6] en de daaraan verbonden
      uitvoeringskosten;

      k. de uitvoeringskosten verbonden aan werkzaamheden gericht op het ontvangen van bedragen, premies en bijdragen als
      bedoeld in [artikel 107][ref7];

      l.

      m.

      n.

      o. de uitvoeringskosten die betrekking hebben op de uitvoering van
      [artikel 32, vijfde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref8];

      p. vergoedingen aan gemeenten die worden overeengekomen ter uitvoering van
      [artikel 30a, derde lid, onderdeel a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref9]
      voor zover [dat artikel][ref10] wordt toegepast ten aanzien van personen als bedoeld in
      [artikel 24 van de Werkloosheidswet][ref11].

      2 Ten laste van het Uitvoeringsfonds voor de overheid komen voorts de kosten die rechtstreeks verband houden met
      de uitvoering van [artikel 30a van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref12] ten aanzien
      van een betrokkene, indien deze ten tijde van het aanvangen van de werkzaamheden van het re-integratiebedrijf,
      bedoeld in het achtste lid van dat artikel een uitkering ontvangt als bedoeld in het eerste lid, onderdeel a,
      en het UWV deze uitkering met toepassing van [artikel 79 van de Werkloosheidswet][ref13] niet kan verhalen op de
      overheidswerkgever.

      3 Ten laste van het Uitvoeringsfonds voor de overheid kunnen tevens komen, indien dit bij algemene maatregel van
      bestuur wordt bepaald:

      a. de door het UWV te betalen WGA-uitkeringen, bedoeld in [artikel 117b, derde lid, onderdeel h][ref14], aan de
      personen, bedoeld in [artikel 24][ref15];

      b. uitkeringen op grond van de Ziektewet als bedoeld in [artikel 117b, derde lid, onderdeel g][ref16], te betalen
      aan de personen, bedoeld in [artikel 24][ref17];

      c. uitkeringen als bedoeld in artikel [122f][ref18], te betalen aan de personen, bedoeld in [artikel 24][ref19];

      d. de uitvoeringskosten, die betrekking hebben op deze uitkeringen op grond van de Ziektewet en op deze WGA-
      uitkeringen.


