  - number: '100'
    text: |-
      Ten laste van het Algemeen Werkloosheidsfonds komen:

      a. de op grond van de [Werkloosheidswet][ref1] te betalen uitkeringen, met uitzondering van de uitkeringen, bedoeld
      in [artikel 104, eerste lid][ref2];

      b. de op grond van [artikel 29, tweede lid, onderdeel d, van de Ziektewet][ref3] te betalen uitkeringen;

      c. de uitvoeringskosten, voorzover deze betrekking hebben op de in de onderdelen a en b bedoelde uitkeringen;

      d. de op grond van enige wet over de uitkeringen, bedoeld in onderdeel a en b, door het UWV verschuldigde premies
      en de inkomensafhankelijke bijdrage, bedoeld in [artikel 42 van de Zorgverzekeringswet][ref4] die niet op deze
      uitkeringen in mindering kunnen worden gebracht;

      e. de bedragen, die op grond van [artikel 104, vierde lid][ref5], door het UWV ten laste van het Algemeen
      Werkloosheidsfonds zijn gebracht;

      f.

      g.

      h.

      i.

      j.

      k. de kosten in verband met de uitvoering van
      [artikel 30a van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6] ten aanzien van personen, die
      een uitkering ontvangen als bedoeld in de onderdelen a en b en de kosten van de re-integratiemaatregelen, bedoeld
      in [hoofdstuk VI van de Werkloosheidswet][ref7] en [hoofdstuk IIA van de Ziektewet][ref8] ten aanzien van deze
      personen;

      l. vergoedingen aan gemeenten die worden overeengekomen ter uitvoering van
      [artikel 30a, derde lid, onderdeel a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref9] voor zover
      betrekking hebbend op personen, die een uitkering ontvangen als bedoeld in de onderdelen a en b;

      m. middelen voor uitgaven van de Sociaal-Economische Raad als bedoeld in
      [artikel 54 van de Wet op de bedrijfsorganisatie][ref10].


