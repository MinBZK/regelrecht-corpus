  - number: 38h
    text: |-
      1 De inspecteur stelt bij voor bezwaar vatbare beschikking de quotumheffing vast voor de werkgever, ten aanzien van
      wie een quotumtekort als bedoeld in [artikel 38g][ref1] is bepaald.

      2 De beschikking bevat in ieder geval:

      a. de vaststelling dat de werkgever quotumheffing is verschuldigd op grond van
      [artikel 34, derde en vierde lid][ref2];

      b. het kalenderjaar waarover het quotumtekort is vastgesteld waarop de beschikking betrekking heeft;

      c. het totale aantal verloonde uren bij de werkgever in het kalenderjaar waarover het quotumtekort is vastgesteld;

      d. het aantal van die verloonde uren dat wordt ingevuld door arbeidsbeperkten;

      e. de berekening van het quotumtekort, bedoeld in [artikel 38g, derde lid][ref3];

      f. het bedrag van de quotumheffing.

      3 De vaststelling van de quotumheffing vindt plaats vóór 1 november volgend op het kalenderjaar waarover het
      quotumtekort wordt vastgesteld.

      4 De quotumheffing bedraagt het quotumtekort vermenigvuldigd met € 5.000.

      5 De inspecteur is bevoegd tot herziening van een beschikking op grond van dit artikel indien enig feit grond
      oplevert voor het vermoeden dat de beschikking is gegeven op grond van onjuiste of onvolledige gegevens. Een
      herziening ten nadele van de werkgever is uitsluitend mogelijk indien deze tekortkoming een gevolg is van een feit
      dat aan de werkgever of de gewezen werkgever kan worden toegerekend of redelijkerwijs kenbaar had kunnen zijn. De
      inspecteur stelt de herziening vast bij voor bezwaar vatbare beschikking. De bevoegdheid tot herziening vervalt
      door verloop van 5 jaren na het einde van het kalenderjaar waarop de beschikking betrekking heeft.

      6 Beschikkingen van de inspecteur op grond van dit artikel worden genomen gehoord het UWV en in overeenstemming met
      het UWV.

      7 Op het bezwaar, beroep, hoger beroep en beroep in cassatie inzake de beschikking is
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref4] van overeenkomstige toepassing. Het bezwaar,
      beroep, hoger beroep en beroep in cassatie inzake de beschikking kan niet zijn gegrond op de grief dat een
      werknemer niet is opgenomen in de registratie, bedoeld in [artikel 38d][ref5].

      8 [Paragraaf 4.1.3.2 van de Algemene wet bestuursrecht][ref6] is niet van toepassing ten aanzien van de beslissing
      van de inspecteur naar aanleiding van het bezwaar tegen de beschikking, bedoeld in het eerste en vijfde lid.


