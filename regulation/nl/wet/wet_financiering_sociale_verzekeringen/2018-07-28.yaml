  - number: '13'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën en Onze Minister van
      Volksgezondheid, Welzijn en Sport, kunnen nadere regels worden gesteld met betrekking tot deze afdeling.
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel13
  - number: '14'
    text: |-
      1 Bij ministeriële regeling kunnen bedragen worden vastgesteld die als rijksbijdrage ten gunste komen van het
      Ouderdomsfonds.

      2 Onze Minister van Volksgezondheid, Welzijn en Sport kan jaarlijks bedragen vaststellen die als rijksbijdrage ten
      gunste komen van het Fonds langdurige zorg.
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel14
  - number: '15'
    text: |-
      Ten gunste van het Ouderdomsfonds, het Nabestaandenfonds en het Fonds langdurige zorg wordt jaarlijks een
      rijksbijdrage in de kosten van de heffingskortingen voor de volksverzekeringen toegekend. Deze bijdrage wordt door
      Onze Minister vastgesteld volgens de formule: BIKKt = (BIKKt-1 + A*Kt-1)*Kt/Kt-1 waarbij:

      BIKKt = de bijdrage in de kosten van de heffingskortingen ten gunste van het fonds in een bepaald jaar;

      BIKKt-1 = de bijdrage in de kosten van de heffingskortingen ten gunste van het fonds in het voorafgaande jaar;

      A = het aandeel van de premie ten gunste van het fonds in het gecombineerde heffingspercentage, bedoeld in
      [artikel 8.1, onderdeel c, van de Wet inkomstenbelasting 2001][ref1], in het jaar waarvoor de bijdrage wordt
      toegekend, verminderd met het aandeel in het daaraan voorafgaande jaar;

      Kt = de door Onze Minister, in overeenstemming met Onze Ministers van Financiën en van Volksgezondheid, Welzijn en
      Sport, geraamde totale kosten voor de heffingskortingen in het jaar waarvoor de bijdrage wordt toegekend;

      Kt-1 = de door Onze Minister, in overeenstemming met Onze Ministers van Financiën en van Volksgezondheid, Welzijn
      en Sport, geraamde totale kosten voor de heffingskortingen in het jaar voorafgaand aan het jaar waarvoor de
      bijdrage wordt toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8.1'
  - number: '16'
    text: |-
      1 Voor de toepassing van dit hoofdstuk wordt onder loon verstaan het loon en de gage overeenkomstig de
      [Wet op de loonbelasting 1964][ref1].

      2 Tot het loon behoren niet:

      a. hetgeen uit een vroegere dienstbetrekking als bedoeld in de [Wet op de loonbelasting 1964][ref2] wordt
      genoten met uitzondering van uitkeringen op grond van een werknemersverzekering of wachtgeld als bedoeld in
      [artikel 6, vijfde lid, tweede zin, van de Werkloosheidswet][ref3] en de aanvullingen daarop van degene tot wie de
      werknemer in dienstbetrekking staat en met uitzondering van toeslagen op grond van de [Toeslagenwet][ref4];

      b. eindheffingsbestanddelen als bedoeld in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref5];

      c. een tegemoetkoming als bedoeld in de [artikelen 63a van de Wet werk en inkomen naar arbeidsvermogen](onbekend)
      en [65l van de Wet op de arbeidsongeschiktheidsverzekering](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0002471
