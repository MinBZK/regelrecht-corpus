    text: |-
      1 Het UWV stelt elk jaar voor elk sectorfonds afzonderlijk een maximum vast dat in een kalenderjaar op grond van
      [artikel 104][ref1] ten laste van dat sectorfonds komt.

      2 Het door het UWV vastgestelde maximum, bedoeld in het eerste lid, behoeft de goedkeuring van Onze Minister.
      Indien Onze Minister zijn goedkeuring onthoudt aan het door het UWV vastgestelde maximum, stelt hij dat zelf vast.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel104
