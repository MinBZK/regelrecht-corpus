  - number: '115'
    text: |-
      1 Ten laste van het Arbeidsongeschiktheidsfonds komen, met inachtneming van de
      [artikelen 56][ref1], [100][ref2], [104][ref3], [108][ref4] en [117b][ref5] en
      [artikel 5:3 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6]:

      a. de door het UWV op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref7] te betalen uitkeringen;

      b. de door het UWV op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8] te betalen
      uitkeringen;

      c. de op grond van [artikel 3:1a][ref9] en [hoofdstuk 3, afdeling 2 van de Wet arbeid en zorg][ref10] te betalen
      vergoedingen en uitkeringen;

      d. de door het UWV op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref11] te betalen uitkeringen;

      e. de op grond van [artikel 29, tweede lid, onderdeel e, f en g][ref12], en [artikel 70 van de Ziektewet][ref13] te
      betalen uitkeringen en de uitkeringen op grond van [artikel 29, tweede lid, onderdeel a, b en c][ref14], toegekend
      aan een werknemer direct aansluitend op een dienstbetrekking waarin recht op een uitkering op grond van artikel
      29, tweede lid, onderdeel e, f of g, bestond en de op grond van de [Ziektewet][ref15] te betalen uitkeringen aan
      de verzekerde die de leeftijd, bedoeld in [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref16] heeft
      bereikt;

      f. de op grond van enige wet over de uitkeringen, bedoeld in de onderdelen a tot en met
      e, door het UWV verschuldigde premies en de inkomensafhankelijke bijdrage, bedoeld in
      [artikel 42 van de Zorgverzekeringswet][ref17], die niet op deze uitkeringen in mindering kunnen worden gebracht;

      g. de gelden die door toepassing van [artikel 118, onderdeel a][ref18], worden overgeheveld naar de
      Werkhervattingskas;

      h. de gelden die door toepassing van [artikel 118, onderdeel b][ref19], worden overgeheveld naar het Rijk;

      i.

      j. de re-integratieinstrumenten op grond van [hoofdstuk IIB van de Wet op arbeidsongeschiktheidsverzekering][ref20],
      [hoofdstuk 3A van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref21] en
      [paragraaf 4.2 van de Wet werk en inkomen naar arbeidsvermogen][ref22].

      k.

      l.

      m. de kosten die verband houden met de uitvoering van
      [artikel 30a van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref23];

      n. de subsidie, bedoeld in [artikel 32b van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref24];

      o. hetgeen op grond van [artikel 84, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref25] op het
      UWV wordt verhaald;

      p.

      q. vergoedingen aan gemeenten die worden overeengekomen ter uitvoering van
      [artikel 30a, derde lid, onderdeel a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref26] voor
      zover betrekking hebbend op de uitvoering van een wettelijke arbeidsongeschiktheidsverzekering;

      r. de uitvoeringskosten die betrekking hebben op de uitkeringen, bedoeld in de onderdelen a tot en met e en de
      uitkeringen, bedoeld in [artikel 117b, eerste lid, onderdelen a en b][ref27];

      s. de kosten van de werkzaamheden, bedoeld in [artikel 63a, vierde, vijfde en zesde lid, van de Ziektewet][ref28]
      alsmede de schade, bedoeld in het zevende lid van dat artikel, die wordt vergoed aan een eigenrisicodrager als
      bedoeld in [artikel 40, eerste lid, onderdeel a][ref29], en de daaraan verbonden uitvoeringskosten;

      t. de kosten van onderzoek, bedoeld in
      __REF000___________________________________________________________________________________________________________
      __;

      u. de uitkeringen op grond van [artikel 29, tweede lid, onderdeel a, b, en c, van de Ziektewet][ref31], die
      op grond van [artikel 63a, derde lid, van die wet][ref32] door het UWV worden betaald en niet kunnen worden
      verhaald op de eigenrisicodrager, bedoeld in [artikel 40, eerste lid, onderdeel a][ref33], en de daaraan verbonden
      uitvoeringskosten;

      v. de bijdrage, bedoeld in [artikel 103, tweede lid][ref34];

      w. de uitkeringen op grond van [artikel 29, tweede lid, onderdeel a, b, of c van de Ziektewet][ref35], bedoeld in
      [artikel 117b, derde lid, onderdeel j][ref36].

      2 Het UWV bezigt de middelen die zijn gereserveerd ten behoeve van het Arbeidsongeschiktheidsfonds niet tot
      bestrijding van uitgaven ten laste van het Arbeidsongeschiktheidsfonds dan met toestemming van Onze Minister.

      3 Bij algemene maatregel van bestuur kan worden bepaald, dat tevens ten laste van het Arbeidsongeschiktheidsfonds
      komen:

      a. de uitkeringen op grond van [artikel 29, tweede lid, onderdeel a, b en c, van de Ziektewet][ref37] toegekend aan
      werknemers, die op de eerste dag van ongeschiktheid tot werken in dienstbetrekking stonden van eigenrisicodragers
      als bedoeld in [artikel 40, eerste lid, onderdeel a][ref38], voor zover de eigenrisicodrager op grond van
      [artikel 63b, eerste lid, van de Ziektewet][ref39] niet het risico draagt voor de betaling van die uitkering;

      b. uitkeringen als bedoeld in [artikel 122f][ref40].

      4 Bij algemene maatregel van bestuur kunnen nadere regels gesteld voor de uitkeringen, die op grond van het derde
      lid, ten laste van het Arbeidsongeschiktheidsfond komen.


