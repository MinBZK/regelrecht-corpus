  - number: '3'
    text: |-
      De financiële middelen tot dekking van de uitgaven ten laste van de fondsen voor de volksverzekeringen worden
      verkregen door het heffen van premie en door bijdragen van het Rijk.
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel3
  - number: '4'
    text: |-
      Voor de toepassing van dit hoofdstuk en [afdeling 2 van hoofdstuk 7][ref1] wordt verstaan onder:

      a. algemene ouderdomsverzekering: de verzekering, bedoeld in [hoofdstuk II van de Algemene Ouderdomswet][ref2];

      b. nabestaandenverzekering: de verzekering, bedoeld in [hoofdstuk 2 van de Algemene nabestaandenwet][ref3];

      c. verzekering langdurige zorg: de verzekering, bedoeld in [hoofdstuk 2 van de Wet langdurige zorg][ref4].


