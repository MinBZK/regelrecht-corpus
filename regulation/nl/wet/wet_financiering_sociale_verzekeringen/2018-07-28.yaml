  - number: '59'
    text: |-
      1 De premies voor de werknemersverzekeringen worden geheven met overeenkomstige toepassing van de voor de heffing
      van de loonbelasting geldende regels. [Artikel 32d van de Wet op de loonbelasting 1964][ref1] is slechts van
      overeenkomstige toepassing indien degene aan wie het loon wordt afgestaan, werkgever van de werknemer is.

      2 In de uitnodiging tot het doen van aangifte, bedoeld in
      [artikel 7, eerste lid, van de Algemene wet inzake rijksbelastingen][ref2], kan mede opgave worden
      verlangd van gegevens die noodzakelijk zijn ten behoeve van de vaststelling van de premiepercentages,
      bedoeld in de [artikelen 27][ref3], [28][ref4], [31][ref5], [36][ref6] en [38][ref7], alsmede
      ten behoeve van de doelen van de gegevensverwerking in de polisadministratie, bedoeld in
      [artikel 33, tweede lid, onderdelen a en e, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref8],
      waarbij met betrekking tot die verlangde gegevens de regels die gelden voor de heffing van de loonbelasting van
      overeenkomstige toepassing zijn.

      3 De inspecteur beslist ambtshalve of op verzoek van de werkgever bij voor bezwaar vatbare beschikking over het
      verzekerd zijn op grond van de werknemersverzekeringen.

      4 De inspecteur is bevoegd tot herziening van de beschikking, bedoeld in het derde lid, indien enig feit grond
      oplevert voor het vermoeden dat de beschikking is verleend op grond van onjuiste of onvolledige gegevens en deze
      tekortkoming een gevolg is van een feit dat aan de werkgever kan worden toegerekend of redelijkerwijs kenbaar
      had kunnen zijn. De inspecteur stelt de herziening van de beschikking vast bij voor bezwaar vatbare beschikking.
      De bevoegdheid tot herziening werkt uiterlijk terug tot en met 1 januari van enig jaar waarop de beschikking
      betrekking heeft en vervalt door verloop van 5 jaren na het einde van het kalenderjaar waarop de beschikking
      betrekking heeft.

      5 Op het beroep van de werkgever tegen de uitspraak op bezwaar van de
      inspecteur op grond van de [artikelen 40][ref9], [95][ref10] of [97][ref11] is
      [hoofdstuk V, afdeling 2, van de Algemene wet inzake rijksbelastingen][ref12] van overeenkomstige toepassing.

      6 De inspecteur stelt de werkgever zonodig op de hoogte van de door het UWV op aanvraag van de werknemer genomen
      beschikking over het verzekerd zijn op grond van de werknemersverzekeringen.

      7 Indien in verband met een gevraagde beschikking informatie is gevraagd aan een persoon of
      instantie buiten Nederland en om die reden de beschikking niet binnen de termijn, bedoeld in
      [afdeling 4.1.3 van Algemene wet bestuursrecht][ref13], gegeven kan worden, wordt die termijn verlengd met ten
      hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in kennis gesteld.

      8 In afwijking van de [artikelen 25][ref14], [30][ref15] en [34, eerste lid][ref16], en met overeenkomstige
      toepassing van [artikel 13bis, vijftiende en negentiende lid, van de Wet op de loonbelasting 1964][ref17], is de
      premie door de werknemer verschuldigd in de gevallen, bedoeld in artikel 13bis, vijftiende en negentiende lid, van
      de Wet op de loonbelasting 1964.

      9 Het zevende lid is van overeenkomstige toepassing op een aanvraag als bedoeld in het derde lid en op een aanvraag
      of melding op grond van de [artikelen 40][ref18], [95][ref19] of [97][ref20].


