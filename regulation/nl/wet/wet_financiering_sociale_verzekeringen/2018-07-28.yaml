  - number: '57'
    text: De rijksbelastingdienst heft de premie voor de volksverzekeringen en de premies voor de werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel57
  - number: '58'
    text: |-
      1 De premie voor de volksverzekeringen wordt, onverminderd het tweede lid en onder verrekening van de krachtens
      dat lid geheven premie, bij wege van aanslag geheven met overeenkomstige toepassing van de voor de heffing van de
      inkomstenbelasting geldende regels, met uitzondering van [artikel 3.154 van de Wet inkomstenbelasting 2001][ref1].

      2 Voorzover de premieplichtige van een inhoudingsplichtige loon geniet in de zin van de
      [Wet op de loonbelasting 1964][ref2], wordt de premie voor de volksverzekeringen bij wijze van inhouding geheven
      met overeenkomstige toepassing van de voor de heffing van de loonbelasting geldende regels.

      3 Voorzover de premieplichtige aan de loonbelasting is onderworpen op grond van
      [artikel 5a van de Wet op de loonbelasting 1964][ref3] is het tweede lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.154
