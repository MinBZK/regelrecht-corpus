  - number: '60'
    text: |-
      1 De rijksbelastingdienst vordert de premie voor de volksverzekeringen en de premies voor de
      werknemersverzekeringen in.

      2 Bij de invordering van de premie voor de volksverzekeringen zijn, naar gelang
      [artikel 58, eerste lid, dan wel tweede lid][ref1] van toepassing is, de regels geldende voor de invordering van de
      inkomstenbelasting onderscheidenlijk de loonbelasting van overeenkomstige toepassing.

      3 Bij de invordering van de premies voor de werknemersverzekeringen zijn de regels geldende voor de invordering van
      de loonbelasting, met uitzondering van [artikel 38, eerste lid, onderdeel a, van de Invorderingswet 1990][ref2],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel38
