  - number: '118'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de overheveling van gelden uit het
      Arbeidsongeschiktheidsfonds naar de Werkhervattingskas.

      2 Bij algemene maatregel van bestuur worden regels gesteld over de overheveling van gelden uit het
      Arbeidsongeschiktheidsfonds naar het Rijk ten behoeve van de financiering van uitkeringen en re-
      integratievoorzieningen op grond van de [Wet arbeidsongeschiktheids-voorziening jonggehandicapten][ref1], en de
      financiering van uitkeringen en re-integratievoorzieningen op grond van de [Participatiewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008657
      [ref2]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0008657
      - id: ref2
        bwb_id: BWBR0015703
  - number: 118a
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald, dat de colleges van burgemeester en wethouders uitkeringen
      aan werknemers, die voorafgaande aan de dienstbetrekking, door die colleges van burgemeester en wethouders op grond
      van [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref1] zijn ondersteund bij de arbeidsinschakeling
      vergoeden aan het UWV, indien de dienstbetrekking een bij die maatregel te bepalen tijd heeft geduurd.

      2 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, wordt in ieder geval geregeld:

      a. welke uitkeringen op grond van de werknemersverzekeringen dit betreft;

      b. de doelgroep van de werknemers;

      c. de hoogte van de vergoeding;

      d. de wijze van vergoeding;

      e. ten gunste van welk fonds, bedoeld in deze afdeling, de vergoedingen komen.

      3 Een voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.

      4 Een op grond van dit artikel vastgestelde algemene maatregel van bestuur treedt slechts in werking,
      nadat gebleken is dat aan werknemers als bedoeld in het eerste lid bovenmatig uitkeringen op grond van de
      werknemersverzekeringen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel118a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
  - number: '119'
    text: |-
      1 Het Zorginstituut, het UWV en de SVB beheren en administreren elk fonds, met uitzondering van het
      Uitvoeringsfonds voor de overheid en de sectorfondsen, afzonderlijk.

      2 Het UWV beheert het Uitvoeringsfonds voor de overheid en de sectorfondsen gezamenlijk en administreert het
      Uitvoeringsfonds voor de overheid en elk sectorfonds afzonderlijk.

      3 Indien met betrekking tot een fonds de lasten de baten blijken te overtreffen, wordt het tekort niet gedekt uit
      een ander fonds.

      4 Het Zorginstituut, het UWV en de SVB houden, elk afzonderlijk, de financiële middelen die deel uitmaken van hun
      fondsen aan in een of meer rekeningen-courant bij Onze Minister van Financiën.

      5 In afwijking van het vierde lid kunnen het Zorginstituut, het UWV en de SVB een deel van de in het vierde lid
      bedoelde financiële middelen buiten de in het vierde lid bedoelde rekeningen-courant houden.

      6 Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport worden, in overeenstemming
      met Onze Minister van Financiën, na overleg met het Zorginstituut, de SVB en het UWV, regels gesteld betreffende de
      omvang van het in het vijfde lid bedoelde deel van de financiële middelen.

      7 Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport kunnen, in overeenstemming
      met Onze Minister van Financiën, nadere regels worden gesteld omtrent het vierde lid.
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel119
  - number: '120'
    text: |-
      1 Het Zorginstituut, het UWV en de SVB kunnen, voor de uitvoering van hun wettelijke taken, beschikken over de
      financiële middelen die zij in rekening-courant bij Onze Minister van Financiën aanhouden.

      2 Bij regeling van Onze Minister van Financiën worden, in overeenstemming met Onze Minister en Onze Minister van
      Volksgezondheid, Welzijn en Sport en na overleg met het Zorginstituut, het UWV en de SVB, regels gesteld omtrent
      de rente die over de saldi van de in [artikel 119, vierde lid][ref1], bedoelde rekeningen-courant wordt vergoed
      onderscheidenlijk in rekening wordt gebracht.

      3 Onze Minister van Financiën brengt voor het beheer van de in [artikel 119, vierde lid][ref2], bedoelde
      rekeningen-courant geen kosten in rekening.

      4 Bij een tekort aan financiële middelen maken het Zorginstituut, het UWV en de SVB uitsluitend gebruik van de
      kredietfaciliteiten die door Onze Minister van Financiën worden verleend of lenen het UWV en de SVB uit een door
      hen beheerd fonds.

      5 Onze Minister van Financiën informeert dagelijks het Zorginstituut, het UWV en de SVB ten aanzien van de in
      [artikel 119, vierde lid][ref3], bedoelde rekeningen-courant, in elk geval met betrekking tot:

      a. de slotstanden per dag;

      b. alle dagelijks geboekte mutaties of transacties in de desbetreffende rekening-courant.

      6 Het Zorginstituut, het UWV en de SVB informeren Onze Minister van Financiën ten aanzien van de in
      [artikel 119, vierde lid][ref4], bedoelde rekeningen-courant, in elk geval met betrekking tot de prognoses van de
      saldi van de desbetreffende rekening-courant.

      7 Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport kunnen, in overeenstemming
      met Onze Minister van Financiën en na overleg met het Zorginstituut, het UWV en de SVB, nadere regels worden
      gesteld omtrent het vierde, vijfde en zesde lid.

      8 Bij regeling van Onze Minister en Onze Minister van Volksgezondheid, Welzijn en Sport, in overeenstemming met
      Onze Minister van Financiën, kunnen regels worden gesteld met betrekking tot de door het College zorgverzekeringen,
      het UWV en de SVB beheerde fondsen betreffende de onderscheiding van het vermogen van het fonds in verschillende
      bestanddelen en de normen tot vaststelling van de omvang van deze bestanddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel119
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel119
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel119
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel120
