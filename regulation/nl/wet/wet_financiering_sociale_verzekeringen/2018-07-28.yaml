  - number: 113a
    text: |-
      Het UWV beheert en administreert afzonderlijk de in [artikel 33, tweede lid][ref1], bedoelde financiële middelen
      tot dekking van de uitgaven alsmede de financiële middelen benodigd voor het vormen en in stand houden van een
      staartlastenvermogen, in de vorm van een Werkhervattingskas die deel uitmaakt van het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel33
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel113a
