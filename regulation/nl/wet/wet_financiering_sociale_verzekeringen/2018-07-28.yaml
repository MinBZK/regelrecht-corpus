    text: |-
      Het UWV beheert en administreert afzonderlijk de in [artikel 33, eerste lid][ref1], bedoelde middelen tot dekking
      van de uitgaven in de vorm van een Arbeidsongeschiktheidsfonds dat deel uitmaakt van het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel33
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel112
