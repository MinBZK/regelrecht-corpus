  - number: '34'
    text: |-
      1 De premie is verschuldigd door werkgevers in de zin van de [Wet werk en inkomen naar arbeidsvermogen][ref1] en
      bestaat uit een basispremie en een gedifferentieerde premie.

      2 In afwijking van [artikel 20][ref2] kan de werkgever de met betrekking tot een werknemer door hem verschuldigde
      gedifferentieerde premie ten behoeve van de Werkhervattingskas, bedoeld in [artikel 38][ref3], verhalen op de
      werknemer onder bij ministeriële regeling te bepalen voorwaarden tot een bij die regeling nader te bepalen bedrag,
      dat ten hoogste de helft van de door de werkgever verschuldigde premie kan bedragen.

      3 De quotumheffing is verschuldigd door werkgevers in de zin van de
      [Wet werk en inkomen naar arbeidsvermogen][ref4].

      4 De quotumheffing is niet verschuldigd indien in het kalenderjaar voorafgaand aan het kalenderjaar waarover de
      quotumheffing wordt geheven, de werkgever minder dan 25 vermenigvuldigd met het gemiddeld aantal verloonde uren
      per werknemer op jaarbasis in Nederland aan verloonde uren als bedoeld in [artikel 38b, vierde lid][ref5], in de
      loonaangifte op grond van de [Wet op de loonbelasting 1964][ref6] heeft verantwoord.

      5 Bij algemene maatregel van bestuur kunnen categorieën werknemers worden aangewezen ten aanzien waarvan de
      verloonde uren bij de toepassing van het vierde lid in mindering worden gebracht op het totaal aantal verloonde
      uren die de werkgever in de loonaangifte heeft verantwoord.

      6 Indien de quotumheffing op grond van het vierde lid zou zijn verschuldigd maar in het kalenderjaar
      waarover de quotumheffing wordt geheven blijkt dat de werkgever minder dan 25 vermenigvuldigd met het
      gemiddeld aantal verloonde uren per werknemer op jaarbasis in Nederland aan verloonde uren als bedoeld in
      [artikel 38b, vierde lid][ref7], in de loonaangifte op grond van de [Wet op de loonbelasting 1964][ref8] heeft
      verantwoord, is de quotumheffing niet verschuldigd.

      7 De voor de toepassing van het vierde en zesde lid in aanmerking te nemen verloonde uren worden vastgesteld
      op grond van de loonaangiften die uiterlijk op 1 mei van het jaar waarover de quotumheffing wordt geheven
      onderscheidenlijk op 1 mei van het jaar volgend op kalenderjaar waarover de quotumheffing wordt geheven zijn
      ingediend alsmede de correcties daarop die uiterlijk op die datum zijn ingediend. Hierbij worden uitsluitend
      loonaangiften en correcties in aanmerking genomen met betrekking tot het kalenderjaar voorafgaand aan het
      kalenderjaar waarover de quotumheffing wordt geheven onderscheidenlijk het kalenderjaar waarover de quotumheffing
      wordt geheven.

      8 Bij of krachtens algemene maatregel van bestuur worden regels gesteld ter uitvoering van het vierde en zesde lid
      die in ieder geval betrekking hebben op:

      a. de bepaling van het gemiddeld aantal verloonde uren per werknemer op jaarbasis in Nederland in het
      desbetreffende kalenderjaar;

      b. de herleiding van het totaal aantal verloonde uren door de werkgever indien de werkgever in het desbetreffende
      kalenderjaar niet gedurende het gehele kalenderjaar de hoedanigheid van werkgever heeft gehad.


