      2 Hij die door hem op grond van deze wet betaalde of verschuldigde premie inhoudt op het loon van of op enige
      andere wijze verhaalt op een werknemer of gewezen werknemer, zonder dat dit bij deze wet is toegestaan, wordt
      gestraft met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.

