  - number: '22'
    text: |-
      1 Indien een wijziging van een premiepercentage bij ministeriële regeling op grond van dit hoofdstuk ingaat op een
      ander tijdstip dan 1 januari, vindt de vaststelling plaats in overeenstemming met Onze Minister van Financiën.

      2 Indien een wijziging door het UWV van een premiepercentage op grond van dit hoofdstuk ingaat op een ander
      tijdstip dan 1 januari, is goedkeuring vereist van Onze Minister en Onze Minister van Financiën. Indien Onze
      Minister en Onze Minister van Financiën hun goedkeuring onthouden stellen zij het percentage zelf vast.

      3 Onze Minister en Onze Minister van Financiën kunnen in een geval als bedoeld in dit artikel regels stellen
      omtrent de wijze van berekening van de premie over het gehele kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel22
  - number: '23'
    text: |-
      1 De financiële middelen tot dekking van de uitgaven ten laste van het Algemeen Werkloosheidsfonds en de
      sectorfondsen worden verkregen door het heffen van premie.

      2 De premie wordt onderscheiden in een deel dat ten gunste komt van het Algemeen Werkloosheidsfonds en een deel dat
      ten gunste komt van het sectorfonds dat het UWV voor de betrokken sector afzonderlijk administreert.
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel23
  - number: '24'
    text: |-
      1 Deze afdeling is niet van toepassing op overheidswerknemers en op overheidswerkgevers voorzover zij werkgever
      zijn van overheidswerknemers.

      2 In afwijking van het eerste lid is deze afdeling van toepassing ten aanzien van degenen
      die uitkering ontvangen op grond van de [Werkloosheidswet][ref1], de [Ziektewet][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4],
      of [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref5], dan wel een toeslag op grond
      van de [Toeslagenwet][ref6], indien zij die uitkering of toeslag uit hoofde van een dienstbetrekking als
      overheidswerknemer ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
