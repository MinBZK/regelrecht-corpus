  - number: 38b
    text: |-
      1 In deze paragraaf en de daarop berustende bepalingen wordt onder een arbeidsbeperkte verstaan de persoon, niet
      zijnde de persoon van wie door het college van burgemeester en wethouders is vastgesteld dat hij uitsluitend in een
      beschutte omgeving onder aangepaste omstandigheden mogelijkheden tot arbeidsparticipatie heeft als bedoeld in

      [artikel 10b, eerste lid, van de Participatiewet][ref1]:

      a. die met ondersteuning bij de arbeidsinschakeling van het college van burgemeester en wethouders op
      grond van [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref2] naar een dienstbetrekking
      is of wordt toegeleid of ten behoeve van wie loonkostensubsidie wordt verstrekt op grond van
      [artikel 10d, tweede lid, van de Participatiewet][ref3], en van wie uitsluitend op verzoek van het college van
      burgemeester en wethouders door het UWV is vastgesteld dat hij niet in staat is tot het verdienen van het wettelijk
      minimumloon, bedoeld in [artikel 2, onderdeel c, van de Participatiewet][ref4], dan wel van wie door het college
      van burgemeester en wethouders in overeenstemming met de eisen gesteld aan een loonwaardevaststelling op grond van
      artikel 10d, eerste of tweede lid, van de Participatiewet een loonwaarde is vastgesteld die bij voltijdse arbeid
      minder bedraagt dan het wettelijk minimumloon, bedoeld in artikel 2, onderdeel c, van de Participatiewet,

      b. die geïndiceerd is als bedoeld in de [Wet sociale werkvoorziening][ref5] of een nog geldende
      indicatiebeschikking heeft op grond van [artikel 11 van die wet][ref6], zoals dat artikel luidde op 31 december
      2014,

      c. die recht op arbeidsondersteuning of een arbeidsongeschiktheidsuitkering op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref7] heeft, tenzij deze persoon duurzaam geen
      mogelijkheden tot arbeidsparticipatie heeft als bedoeld in [artikel 1a:1 van die wet][ref8],

      d. die voldoet aan een bij of krachtens algemene maatregel van bestuur vastgestelde indicatie, of

      e. die met ondersteuning bij de arbeidsinschakeling van het college van burgemeester en wethouders op grond van
      [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref9] naar een dienstbetrekking is of wordt toegeleid,
      en van wie op eigen verzoek door het UWV is of wordt vastgesteld dat hij niet in staat is tot het verdienen van het
      wettelijk minimumloon, bedoeld in [artikel 2, onderdeel c, van de Participatiewet][ref10]. Bij algemene maatregel
      van bestuur kunnen ten aanzien van de persoon, bedoeld in de vorige zin, nadere regels worden gesteld.

      2 Voor de toepassing van deze paragraaf en de daarop berustende bepalingen wordt onder een
      arbeidsbeperkte mede verstaan een persoon die naar het oordeel van het UWV wegens ziekte of gebrek
      ontstaan voordat de leeftijd van 18 jaren is bereikt of in de tijd dat hij studerende was als bedoeld in
      [artikel 1:4 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref11] een belemmering ondervindt
      in het verrichten van arbeid in dienstbetrekking, op grond van [artikel 10 van de Participatiewet][ref12]
      of [artikel 35 van de Wet werk en inkomen naar arbeidsvermogen][ref13] een voorziening ontvangt en
      zonder die voorziening niet in staat is tot het verdienen van het wettelijk minimumloon, bedoeld in
      [artikel 2, onderdeel c, van de Participatiewet][ref14].

      3 Met betrekking tot de beoordeling door het UWV of een persoon een arbeidsbeperkte is als bedoeld in het tweede
      lid worden bij of krachtens algemene maatregel van bestuur regels gesteld.

      4 In deze paragraaf en in [artikel 122n][ref15] en de daarop berustende bepalingen wordt
      verstaan onder verloonde uren: de uren waarover loon is betaald en die zijn opgenomen in de
      loonaangifte op grond van [artikel 28, eerste lid, van de Wet op de loonbelasting 1964][ref16]
      en die tevens zijn opgenomen in de polisadministratie op grond van
      [artikel 33, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref17].

      5 In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder de beschikking: de in
      [artikel 38h, eerste lid][ref18], bedoelde beschikking alsmede de op grond van artikel 38h, vijfde lid, herziene
      beschikking.


