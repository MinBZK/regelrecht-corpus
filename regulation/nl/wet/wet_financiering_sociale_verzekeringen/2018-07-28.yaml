  - number: '25'
    text: |-
      De premie is verschuldigd door de werkgever in de zin van de [Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '26'
    text: De maatstaf voor de heffing van de premie is het loon.
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel26
  - number: '27'
    text: |-
      Het deel van de premie dat ten gunste komt van het Algemeen Werkloosheidsfonds wordt bij ministeriële regeling
      vastgesteld op een percentage van het loon dat voor categorieën van werkgevers en werknemers kan verschillen en
      mede kan worden bepaald door de mate waarin door werkgevers maatregelen zijn getroffen gericht op bevordering
      van de duurzame arbeidsparticipatie van de werknemers. Bij of krachtens algemene maatregel van bestuur kunnen
      hieromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel27
  - number: '28'
    text: |-
      1 Het deel van de premie dat ten gunste komt van een sectorfonds wordt door het UWV vastgesteld op een percentage
      van het loon dat voor categorieën van werkgevers en werknemers die behoren tot verschillende sectoren en
      sectoronderdelen als bedoeld in [artikel 95][ref1] kan verschillen, en mede kan worden bepaald door de mate
      waarin door die werkgevers maatregelen zijn getroffen gericht op bevordering van de duurzame arbeidsparticipatie
      van de werknemers. Bij of krachtens algemene maatregel van bestuur kunnen hieromtrent nadere regels worden
      gesteld, waaronder het stellen van voorwaarden ter afbakening van de verschillende categorieën van werkgevers en
      werknemers. Bij regeling van Onze Minister kan worden bepaald dat het deel van de premie dat ten gunste komt van
      het desbetreffende sectorfonds in bijzondere gevallen voor één of meerdere sectoren aan de hand van het gemiddelde
      van de premie van een aantal sectoren jaarlijks kan worden vastgesteld op een door Onze Minister te bepalen wijze.

      2 In afwijking van het eerste lid wordt met inachtneming van bij algemene maatregel van bestuur te
      stellen regels over een uitkering op grond van de [Werkloosheidswet][ref2], de [Ziektewet][ref3], de
      [Wet werk en inkomen naar arbeidsvermogen][ref4], de [Wet op de arbeidsongeschiktheidsverzekering][ref5],
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref6] aan de werknemer of gelijkgestelde, bedoeld
      in [artikel 3:6, eerste lid, van die wet][ref7], over een toeslag op grond van de [Toeslagenwet][ref8] en over loon
      op grond van een arbeidsovereenkomst als bedoeld in [hoofdstuk 2 van de Wet sociale werkvoorziening][ref9] voor het
      deel van de premie dat ten gunste komt van een sectorfonds door het UWV een gemiddeld premiepercentage vastgesteld.
      Dit wordt bepaald op een gemiddelde van de percentages die zijn vastgesteld op grond van het eerste lid.

      3 Het deel van de premie dat met toepassing van het tweede lid ten gunste komt van het sectorfonds, bedraagt ten
      hoogste de premie die op grond van het eerste lid is vastgesteld. Het resterende deel van deze premie komt ten
      gunste van het Algemeen Werkloosheidsfonds.

      4 Het tweede lid wordt niet toegepast ingeval het UWV de uitkering, vermeerderd met de
      daarover door de werkgever verschuldigde premies en de inkomensafhankelijke bijdrage, bedoeld
      in [artikel 42 van de Zorgverzekeringswet][ref10], betaalt aan de werkgever, bedoeld in
      [artikel 9][ref11], [10][ref12] of [12 van de Werkloosheidswet][ref13] en de [Ziektewet][ref14],
      [artikel 11 van de Wet werk en inkomen naar arbeidsvermogen][ref15] en in [artikel 8][ref16], [9][ref17] of
      [11 van de Wet op de arbeidsongeschiktheidsverzekering][ref18], onafhankelijk van het voortbestaan van de
      dienstbetrekking met die werkgever, tenzij die werkgever een werkgever is van degene die loon ontvangt uit een
      arbeidsovereenkomst als bedoeld in [hoofdstuk 2 van de Wet sociale werkvoorziening][ref19].

      5 Het tweede lid wordt eveneens niet toegepast ingeval een eigenrisicodrager de
      uitkering, bedoeld in [artikel 63a Ziektewet][ref20], betaalt of de uitkering, bedoeld in
      [artikel 82 van de Wet werk en inkomen naar arbeidsvermogen][ref21], betaalt, onafhankelijk van het voortbestaan
      van de dienstbetrekking met die eigenrisicodrager.

      6 Een door het UWV bepaald percentage als bedoeld in het eerste en tweede lid behoeft de goedkeuring van Onze
      Minister. Indien Onze Minister zijn goedkeuring onthoudt stelt hij het percentage zelf vast.


