  - number: 38a
    text: |-
      1 In afwijking van [artikel 38][ref1] is over een uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref2], de [Wet op de arbeidsongeschiktheidsverzekering][ref3],
      de [Ziektewet][ref4], [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref5], de
      [Werkloosheidswet][ref6], over een toeslag op grond van de [Toeslagenwet][ref7] en over het loon
      uit een dienstbetrekking op grond van de [Wet sociale werkvoorziening][ref8], als gedifferentieerde
      premie ten behoeve van de Werkhervattingskas een vervangende premie verschuldigd. Met een
      uitkering op grond van de Werkloosheidswet wordt gelijkgesteld een wachtgeld als bedoeld in
      [artikel 1, onderdeel r, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref9].

      2 Behalve voor degene die loon ontvangt uit een dienstbetrekking op grond van de
      [Wet sociale werkvoorziening][ref10] wordt het eerste lid niet toegepast ingeval het UWV de uitkering,
      vermeerderd met de daarover door de werkgever verschuldigde premies en de inkomensafhankelijke bijdrage,
      bedoeld in [artikel 42 van de Zorgverzekeringswet][ref11], betaalt aan de werkgever, bedoeld in
      [artikel 11 van de Wet werk en inkomen naar arbeidsvermogen][ref12] en in [artikel 9][ref13], [10][ref14]
      of [12 van de Werkloosheidswet][ref15] en de [Ziektewet][ref16], onafhankelijk van het voortbestaan van de
      dienstbetrekking met die werkgever.

      3 Het eerste lid wordt eveneens niet toegepast ingeval een eigenrisicodrager de
      uitkering, bedoeld in [artikel 63a Ziektewet][ref17], betaalt of de uitkering, bedoeld in
      [artikel 82 van de Wet werk en inkomen naar arbeidsvermogen][ref18], betaalt, onafhankelijk van het voortbestaan
      van de dienstbetrekking met die eigenrisicodrager.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de wijze waarop de vervangende premie,
      bedoeld in het eerste lid, wordt vastgesteld.


