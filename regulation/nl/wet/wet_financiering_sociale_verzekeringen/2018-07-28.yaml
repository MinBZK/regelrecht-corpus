  - number: '7'
    text: De maatstaf voor de heffing van de premie voor de volksverzekeringen is het premie-inkomen van de premieplichtige.
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel7
  - number: '8'
    text: |-
      1 Voor de heffing van de premie voor de volksverzekeringen bij wege van aanslag wordt onder premie-
      inkomen verstaan het belastbare inkomen uit werk en woning, bepaald volgens de regels van
      [hoofdstuk 3 van de Wet inkomstenbelasting 2001][ref1]. De toerekening van de gemeenschappelijke
      inkomensbestanddelen van de premieplichtige en zijn partner geschiedt overeenkomstig
      [artikel 2.17 van de Wet inkomstenbelasting 2001][ref2]. In het geval de premieplichtige en zijn partner beiden
      belastingplichtig zijn, geldt de gemaakte keuze, bedoeld in [artikel 2.17, tweede lid, van die wet][ref3], zowel
      voor de heffing van de inkomstenbelasting als voor de heffing van de premie voor de volksverzekeringen.

      2 Voor de heffing van de premie voor de volksverzekeringen bij wijze van inhouding wordt onder premie-inkomen
      verstaan het belastbare loon in de zin van de [Wet op de loonbelasting 1964][ref4] met uitzondering van de
      eindheffingsbestanddelen, bedoeld in [artikel 31, eerste lid, onderdelen d tot en met g, van die wet][ref5].

      3 Het premie-inkomen wordt tot geen hoger bedrag in aanmerking genomen dan het als tweede vermelde bedrag in
      kolom II van de tarieftabel in [artikel 2.10, eerste lid, van de Wet inkomstenbelasting 2001][ref6]. In afwijking
      van de eerste volzin wordt het premie-inkomen van een premieplichtige die is geboren vóór 1 januari 1946 tot
      geen hoger bedrag in aanmerking genomen dan het als tweede vermelde bedrag in kolom II van de tarieftabel in
      [artikel 2.10a, eerste lid, van de Wet inkomstenbelasting 2001][ref7].


