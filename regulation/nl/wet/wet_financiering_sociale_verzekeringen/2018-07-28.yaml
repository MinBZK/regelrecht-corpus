  - number: '91'
    text: |-
      1 Het Zorginstituut doet jaarlijks uitkeringen uit het Fonds langdurige zorg ter dekking van de noodzakelijke
      uitgaven, gedaan voor de uitvoering van de in de [Wet langdurige zorg][ref1] geregelde verzekering, volgens bij of
      krachtens algemene maatregel van bestuur te stellen regels. Bij of krachtens deze algemene maatregel van bestuur
      kunnen tevens regels worden gesteld over de vorming en aanwending van reserves door Wlz-uitvoerders als bedoeld in
      de Wet langdurige zorg.

      2 De zorgautoriteit is bevoegd vast te stellen dat uitgaven niet verantwoord waren voor zover deze door hem niet
      noodzakelijk worden geacht voor de uitvoering van de verzekering op grond van de [Wet langdurige zorg][ref2].
      Met de uitkeringen, bedoeld in het eerste lid, evenals met de daarmee verkregen opbrengsten worden geen uitgaven
      gedekt waarvan de zorgautoriteit heeft vastgesteld dat zij niet verantwoord waren, tenzij de zorgautoriteit anders
      besluit.

      3 Op de uitkeringen, bedoeld in het eerste lid, kunnen voorschotten worden verleend overeenkomstig door het
      Zorginstituut te stellen regels,

      4 Op rechten of verplichtingen die voortvloeien uit hetgeen op grond van dit artikel is geregeld, is
      [titel 4.2 van de Algemene wet bestuursrecht][ref3] niet van toepassing.


