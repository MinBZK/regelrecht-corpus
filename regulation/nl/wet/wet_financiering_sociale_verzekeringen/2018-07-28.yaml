      1 De maatstaf voor de heffing van de premie is het loon.

      2 De maatstaf voor de quotumheffing is het aantal verloonde uren, bedoeld in [artikel 38b, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
