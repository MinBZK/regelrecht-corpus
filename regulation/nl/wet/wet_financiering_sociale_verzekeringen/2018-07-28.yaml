  - number: '9'
    text: |-
      De verschuldigde premie voor de volksverzekeringen is de premie voor de volksverzekeringen verminderd met de voor
      de premieplichtige toepasselijke heffingskorting voor de volksverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel9
  - number: '10'
    text: |-
      1 De premie voor de volksverzekeringen wordt vastgesteld op de som van de percentages bedoeld in [artikel 11][ref1]
      van het premie-inkomen.

      2 Tot de premie, bedoeld in het eerste lid, behoort met ingang van de eerste dag van de maand waarin de verzekerde
      de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], zal
      bereiken niet de premie voor de algemene ouderdomsverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0017745/2018-07-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
