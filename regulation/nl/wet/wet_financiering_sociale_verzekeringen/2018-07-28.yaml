  - number: '104'
    text: |-
      1 Ten laste van een sectorfonds komen:

      a. de op grond van de [Werkloosheidswet][ref1] over de eerste zes maanden vanaf de eerste werkloosheidsdag te
      betalen uitkering aan de werknemer, die in de kalenderweek onmiddellijk voorafgaande aan het intreden van zijn
      arbeidsurenverlies in de sector werkzaam is geweest waarvoor het sectorfonds is ingesteld, waarbij, voor de
      bepaling van de periode van zes maanden, perioden waarin de werknemer geen recht op uitkering heeft, buiten
      beschouwing worden gelaten;

      b. de op grond van [artikel 18 van de Werkloosheidswet][ref2] te betalen uitkeringen;

      c.

      d.

      e. de uitvoeringskosten, voorzover deze betrekking hebben op de in de onderdelen a en b bedoelde uitkeringen;

      f. de op grond van enige wet over de uitkeringen, bedoeld in de onderdelen a en b, door het UWV verschuldigde
      premies en de inkomensafhankelijke bijdrage, bedoeld in [artikel 42 van de Zorgverzekeringswet][ref3] die niet op
      deze uitkeringen in mindering kunnen worden gebracht.

      2 Het UWV is bevoegd in bijzondere gevallen voor de toepassing van het eerste lid, onderdeel a, werkzaamheden in de
      ene sector gelijk te stellen met werkzaamheden in een andere sector.

      3 [Artikel 21 van de Werkloosheidswet][ref4] is met betrekking tot de in het eerste lid, onderdeel a, bedoelde
      periode waarover de uitkering ten laste van een sectorfonds komt, van overeenkomstige toepassing.

      4 Het UWV brengt hetgeen ten laste van het sectorfonds komt, ten laste van het Algemeen Werkloosheidsfonds voor
      zoveel dit meer bedraagt dan het voor het sectorfonds op grond van [artikel 105, eerste lid][ref5], vastgestelde
      maximum.

      5 Ten laste van het sectorfonds kunnen voorts komen, indien dit bij algemene maatregel van bestuur is bepaald:

      a. de door het UWV te betalen WGA-uitkeringen, bedoeld in [artikel 117b, derde lid, onderdeel h][ref6];

      b. uitkeringen op grond van de Ziektewet als bedoeld in [artikel 117b, derde lid, onderdeel g][ref7];

      c. uitkeringen als bedoeld in [artikel 122f][ref8];

      d. de uitvoeringskosten, die betrekking hebben op deze uitkeringen op grond van de Ziektewet en op deze WGA-
      uitkeringen.

      6 Bij algemene maatregel van bestuur kunnen nadere regels gesteld voor de uitkeringen, die op grond van het vijfde
      lid, ten laste van het sectorfonds komen.

      7 In afwijking van het eerste lid, onderdeel a, komen de uitkeringen op grond van de [Werkloosheidswet][ref9]
      die worden betaald gedurende de eerste dertien weken van ongeschiktheid van de werknemer tot het verrichten van
      zijn arbeid wegens ziekte, niet ten laste van een sectorfonds. Perioden van ongeschiktheid worden samengeteld
      indien zij elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan
      aan en aansluiten op een periode waarin uitkering in verband met zwangerschap of bevalling op grond van
      [artikel 3:7, eerste lid][ref10], [3:8][ref11] of [3:10, eerste lid, van de Wet arbeid en zorg][ref12] wordt
      genoten, tenzij de ongeschiktheid redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak.

      8 Voor de bepaling van de periode van zes maanden, bedoeld in het eerste lid, onderdeel a, worden perioden waarin
      de werknemer uitkering ontvangt als bedoeld in het zevende lid, buiten aanmerking gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
