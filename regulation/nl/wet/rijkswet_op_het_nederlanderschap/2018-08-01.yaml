  - number: '24.1'
    text: |-
      Deze Rijkswet kan worden aangehaald als "Rijkswet op het Nederlanderschap". Zij treedt in werking op een door Ons
      te bepalen tijdstip. Wij kunnen een ander tijdstip vaststellen waarop [hoofdstuk 6][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003738
        hoofdstuk: '6'
  - number: '24.2'
    text: De wet van 12 december 1892, *Stb.* 268, op het Nederlanderschap en het ingezetenschap, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel24
  - number: '25'
    text: |-
      Nederlanders in de zin van deze Rijkswet zijn mede zij, die bij haar inwerkingtreding het Nederlanderschap
      bezitten.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel25
  - number: '26.1'
    text: |-
      Het vereiste van toelating en hoofdverblijf, bedoeld in [artikel 6, eerste lid, onder f][ref1], is niet
      van toepassing op de vreemdeling die nadat hij meerderjarig is geworden het Nederlanderschap heeft verloren
      als gevolg van verkrijging van een andere nationaliteit op grond van artikel 5 (oud) zoals dit luidde
      tot 1 maart 1964, en [artikel 7, aanhef][ref2] en ten eerste of ten derde, van de Wet van 12 december
      1892, Stb 268, op het Nederlanderschap en het ingezetenschap, dan wel dit heeft verloren op grond van
      [artikel 15, aanhef en onder a][ref3], indien de persoon:


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel15
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '7'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0003738
        artikel: '15'
        hoofdstuk: '5'
  - number: 26.1.a
    text: |-
      in het land van die andere nationaliteit is geboren en daar ten tijde van de verkrijging zijn hoofdverblijf heeft
      gehad;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel26
  - number: 26.1.b
    text: |-
      voor het bereiken van de meerderjarige leeftijd gedurende een onafgebroken periode van tenminste vijf jaren in het
      land van die andere nationaliteit zijn hoofdverblijf heeft gehad; of
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel26
  - number: 26.1.c
    text: ten tijde van de verkrijging van die andere nationaliteit gehuwd was met een persoon van die andere nationaliteit.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel26
  - number: '26.2'
    text: |-
      Het eerste lid is niet van toepassing op de vreemdeling die na de inwerkingtreding van deze bepaling gedurende een
      periode van tenminste tien jaren onderdaan is van de Staat van de andere nationaliteit.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel26
  - number: '26.3'
    text: |-
      Het minderjarige niet-Nederlandse kind van de vader of moeder, die de vreemdeling is, bedoeld in het eerste lid,
      deelt in diens verkrijging van het Nederlanderschap, indien hij in de verklaring tot dat doel is vermeld. Kinderen
      van een kind dat in de verkrijging deelt, delen onder dezelfde voorwaarden in die verkrijging. Een kind dat ten
      tijde van het afleggen van de verklaring de leeftijd van zestien jaar heeft bereikt, deelt in de verkrijging
      indien het daarmee uitdrukkelijk instemt, de in het [tweede lid van artikel 6][ref1] bedoelde bereidverklaring
      daadwerkelijk aflegt en jegens hem geen vermoedens bestaan als bedoeld in het [vierde lid van dat artikel][ref2].
      Het besluit tot bevestiging wordt niet bekend gemaakt dan nadat de verklaring van verbondenheid daadwerkelijk is
      afgelegd. [Artikel 11, achtste lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel11
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '6'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0003738
        artikel: '11'
        hoofdstuk: '4'
  - number: '27.1'
    text: |-
      [Artikel 3 van deze Rijkswet][ref1] is alleen van toepassing op kinderen geboren na de inwerkingtreding van deze
      Rijkswet.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel3
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '3'
        hoofdstuk: '2'
  - number: '27.2'
    text: |-
      [Artikel 3, derde lid][ref1], als gewijzigd bij
      __REF001___________________________________________________________________________________________________________
      ________________________________________________________________ (Stb. 618), is alleen van toepassing op kinderen
      geboren na de inwerkingtreding van die Rijkswet.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012089
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0012089
  - number: '28.1'
    text: |-
      De vrouw die het Nederlanderschap heeft verloren door of in verband met haar vóór de inwerkingtreding van
      deze Rijkswet gesloten huwelijk, verkrijgt het Nederlanderschap door het afleggen van een daartoe strekkende
      schriftelijke en door een bevestiging gevolgde verklaring, welke moet worden afgelegd binnen een jaar na de
      ontbinding van dat huwelijk of binnen een jaar nadat zij van die ontbinding heeft kunnen kennis nemen. Deze
      verkrijging werkt terug tot de datum van ontbinding van het huwelijk.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel28
  - number: '28.2'
    text: |-
      [Artikel 6, derde tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel6
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '6'
        hoofdstuk: '3'
  - number: '28.3'
    text: |-
      Het minderjarige niet-Nederlandse kind van de in het eerste lid genoemde persoon die moeder of adoptiefouder
      als bedoeld in [artikel 11, achtste lid][ref1], van dit kind is deelt in die verkrijging, indien het in de
      verklaring tot dat doel is vermeld. Kinderen van een kind dat in de verkrijging deelt, delen onder dezelfde
      voorwaarden in die verkrijging. Een kind dat ten tijde van het afleggen van de verklaring de leeftijd van
      zestien jaar heeft bereikt, deelt in de verkrijging indien het daarmee uitdrukkelijk instemt, de in het
      [tweede lid van artikel 6][ref2] bedoelde bereidverklaring aflegt en jegens hem geen vermoedens bestaan als bedoeld
      in het [vierde lid van dat artikel][ref3]. Het besluit tot bevestiging wordt met betrekking tot hem niet bekend
      gemaakt dan nadat de verklaring van verbondenheid daadwerkelijk is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel6
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '11'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '6'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0003738
        artikel: '6'
        hoofdstuk: '3'
  - number: '29'
    text: |-
      Voor de toepassing van de Rijkswet op het Nederlanderschap en de daarop rustende bepalingen worden de tijdvakken
      van hoofdverblijf die voor de inwerkingtreding van de [Rijkswet aanpassing rijkswetten aan de oprichting van
      de nieuwe landen](onbekend) zijn doorgebracht in de Nederlandse Antillen in aanmerking genomen als waren zij
      doorgebracht in Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Saba en Sint Eustatius.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel29
