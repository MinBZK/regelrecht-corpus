        bwb_id: BWBR0016986
        artikel: '3'
  - number: '2.1'
    text: |-
      Tenzij de wet anders bepaalt, hebben de verkrijging en het verlies van het Nederlanderschap geen terugwerkende
      kracht.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel2
  - number: '2.2'
    text: |-
      Behoudens in de bij algemene maatregel van rijksbestuur te bepalen gevallen worden verklaringen en verzoeken in
      persoon afgelegd en ingediend.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel2
  - number: '2.3'
    text: |-
      Tenzij anders bepaald, worden verklaringen en verzoeken van minderjarigen door hun wettelijke vertegenwoordigers
      afgelegd en ingediend.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel2
  - number: '2.4'
    text: |-
      Het kind, mits het de leeftijd van 12 jaar heeft bereikt, en zijn wettelijke vertegenwoordiger worden op hun
      verzoek in de gelegenheid gesteld hun zienswijze naar voren te brengen omtrent de verkrijging of medeverkrijging,
      of verlening of medeverlening van het Nederlanderschap. Indien de vertegenwoordiging van het kind van rechtswege
      is opgedragen aan één der ouders kan de andere ouder eenzelfde verzoek doen. Indien het kind dat de leeftijd van
      zestien jaar heeft bereikt bedenkingen heeft tegen de verkrijging of medeverkrijging, of tegen de verlening of
      medeverlening, of indien zowel het kind als zijn wettelijk vertegenwoordiger of de in dit lid bedoelde andere ouder
      bedenkingen hebben tegen de medeverkrijging of medeverlening, deelt het kind daarin niet.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel2
  - number: '2.5'
    text: |-
      De verklaring van verbondenheid wordt door minderjarigen van zestien jaar en ouder zelfstandig afgelegd. Tenzij
      anders bepaald kunnen zij daarin niet worden vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel2
  - number: '3.1'
    text: |-
      Nederlander is het kind waarvan ten tijde van zijn geboorte de vader of de moeder Nederlander is, alsmede het kind
      van een Nederlander die voordien is overleden.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel3
  - number: '3.2'
    text: |-
      Het op het grondgebied van Nederland, onderscheidenlijk Aruba, Curaçao of Sint Maarten, of aan boord van een in
      Nederland, Aruba, Curaçao of Sint Maarten te boek gesteld zeeschip of luchtvaartuig, gevonden kind wordt aangemerkt
      als het kind van een Nederlander tenzij binnen vijf jaren, te rekenen vanaf de dag waarop het is gevonden, blijkt
      dat het kind door geboorte een vreemde nationaliteit bezit.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel3
  - number: '3.3'
    text: |-
      Nederlander is het kind van een vader of moeder die ten tijde van de geboorte van het kind zijn of haar
      hoofdverblijf heeft in Nederland, Aruba, Curaçao of Sint Maarten en die zelf geboren is als kind van een vader of
      moeder die ten tijde van zijn of haar geboorte in een van die landen hoofdverblijf had, mits het kind ten tijde van
      zijn geboorte zijn hoofdverblijf heeft in Nederland, Aruba, Curaçao of Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel3
  - number: '4.1'
    text: |-
      In afwijking van [artikel 3][ref1] wordt Nederlander het kind van een persoon van wie het ouderschap gerechtelijk
      wordt vastgesteld, indien het kind op de dag van de uitspraak in eerste aanleg minderjarig was en de ouder op de
      in de volgende zin bedoelde dag Nederlander is, of, indien deze is overleden, op de dag van overlijden Nederlander
      was. Betreft het een Nederlandse uitspraak dan verkrijgt het kind het Nederlanderschap op de eerste dag na een
      periode van drie maanden, te rekenen van de dag van de uitspraak in eerste aanleg of, indien binnen deze periode
      hoger beroep is ingesteld, van drie maanden, te rekenen van de dag van de uitspraak in hoger beroep, dan wel,
      indien binnen deze laatste periode beroep in cassatie is ingesteld, op de dag van de uitspraak in cassatie. Betreft
      het een buitenlandse rechterlijke uitspraak dan verkrijgt het kind het Nederlanderschap op de dag waarop deze
      uitspraak kracht van gewijsde heeft gekregen.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel3
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.2'
    text: |-
      Nederlander wordt de minderjarige vreemdeling die na zijn geboorte en voor de leeftijd van zeven jaar door een
      Nederlander wordt erkend.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel4
  - number: '4.3'
    text: |-
      Nederlander wordt de minderjarige vreemdeling die zonder erkenning door wettiging het kind wordt van een
      Nederlander.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel4
  - number: '4.4'
    text: |-
      Door erkenning wordt ook Nederlander de minderjarige vreemdeling die na zijn geboorte wordt erkend door een
      Nederlander, die zijn biologische ouderschap bij of binnen de termijn van één jaar na de erkenning aantoont.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel4
  - number: '4.5'
    text: |-
      Kinderen van de minderjarige vreemdeling die op grond van het eerste, derde of vierde lid het Nederlanderschap
      verkrijgt, delen in die verkrijging.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel4
  - number: '4.6'
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur kunnen nadere regels worden gesteld met betrekking tot het in
      het vierde lid bedoelde bewijs.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel4
  - number: '5'
    text: |-
      Nederlander wordt het kind dat in Nederland, Aruba, Curaçao of Sint Maarten bij rechterlijke uitspraak is
      geadopteerd, indien het kind op de dag van de uitspraak in eerste aanleg minderjarig was en ten minste één der
      adoptiefouders op de in de volgende zin bedoelde dag Nederlander is. Het kind verkrijgt het Nederlanderschap op
      de eerste dag na een periode van drie maanden, te rekenen van de dag van de uitspraak in eerste aanleg of, indien
      binnen deze periode hoger beroep is ingesteld, van drie maanden, te rekenen van de dag van de uitspraak in hoger
      beroep, dan wel, indien binnen deze laatste periode beroep in cassatie is ingesteld, op de dag van de uitspraak
      in cassatie.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5
  - number: 5a.1
    text: |-
      Nederlander wordt ook het kind dat in het buitenland bij uitspraak van een ter plaatse bevoegde autoriteit
      wordt geadopteerd in overeenstemming met het op 29 mei 1993 te 's-Gravenhage tot stand gekomen verdrag inzake de
      bescherming van kinderen en de samenwerking op het gebied van de interlandelijke adoptie, indien en op het tijdstip
      waarop aan de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5a
  - number: 5a.1.a
    text: de adoptie is in overeenstemming met het voornoemde verdrag tot stand gekomen, en
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5a
  - number: 5a.1.b
    text: die adoptie heeft tot gevolg dat de voordien bestaande familierechtelijke betrekkingen worden verbroken, en
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5a
  - number: 5a.1.c
    text: ten minste één der adoptiefouders is Nederlander op de dag dat de uitspraak kracht van gewijsde heeft gekregen, en
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5a
  - number: 5a.1.d
    text: het kind was op de dag van de uitspraak in eerste aanleg minderjarig.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5a
  - number: 5a.2
    text: |-
      Nederlander wordt voorts het kind dat in het buitenland in overeenstemming met het op 29 mei 1993 te 's-
      Gravenhage tot stand gekomen verdrag inzake de bescherming van kinderen en de samenwerking op het gebied van
      de interlandelijke adoptie is geadopteerd bij een adoptie die niet tot gevolg heeft dat de voordien bestaande
      familierechtelijke betrekkingen worden verbroken, welke adoptie in Nederland, Aruba, Curaçao of Sint Maarten
      bij rechterlijke uitspraak in overeenstemming met artikel 27 van voornoemd verdrag wordt omgezet in een adoptie
      naar het recht van Nederland, Aruba, Curaçao of Sint Maarten, indien en op het tijdstip waarop aan de volgende
      voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5a
  - number: 5a.2.a
    text: de adoptie is in overeenstemming met het voornoemde verdrag tot stand gekomen; en
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5a
  - number: 5a.2.b
    text: |-
      ten minste één der adoptiefouders is Nederlander op de dag nadat drie maanden, te rekenen van de dag van de
      uitspraak houdende omzetting in eerste aanleg of in hoger beroep, zijn verstreken zonder dat daartegen hoger beroep
      of beroep in cassatie is ingesteld, dan wel, indien beroep in cassatie is ingesteld, op de dag van de uitspraak in
      cassatie, en
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5a
  - number: 5a.2.c
    text: het kind was op de dag van de uitspraak houdende omzetting in eerste aanleg minderjarig.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5a
  - number: 5b.1
    text: |-
      Nederlander wordt ook het kind dat in het buitenland bij uitspraak van een ter plaatse bevoegde autoriteit wordt
      geadopteerd, indien en op het tijdstip waarop aan de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5b
  - number: 5b.1.a
    text: |-
      de adoptie voldoet aan de voorwaarden voor erkenning in Nederland van [artikel 6][ref1] of
      [artikel 7 van de Wet conflictenrecht adoptie][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0015330#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015330#Artikel7
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0015330
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0015330
        artikel: '7'
  - number: 5b.1.b
    text: de adoptie heeft tot gevolg dat de voordien bestaande familierechtelijke betrekkingen worden verbroken, en
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5b
  - number: 5b.1.c
    text: ten minste een der adoptiefouders is Nederlander op de dag dat de uitspraak kracht van gewijsde heeft gekregen, en
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5b
  - number: 5b.1.d
    text: het kind was op de dag van de uitspraak in eerste aanleg minderjarig.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5b
  - number: 5b.2
    text: |-
      Nederlander wordt voorts het kind dat in het buitenland is geadopteerd bij een adoptie die niet tot gevolg
      heeft dat de voordien bestaande familierechtelijke betrekkingen worden verbroken, welke adoptie in Nederland bij
      rechterlijke uitspraak in overeenstemming met [artikel 9 van de Wet conflictenrecht adoptie][ref1] wordt omgezet in
      een adoptie naar Nederlands recht, indien en op het tijdstip waarop aan de volgende voorwaarden is voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0015330#Artikel9
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0015330
        artikel: '9'
  - number: 5b.2.a
    text: |-
      de adoptie voldoet aan de voorwaarden voor erkenning in Nederland van [artikel 6][ref1] of
      [artikel 7 van de Wet conflictenrecht adoptie][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0015330#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015330#Artikel7
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0015330
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0015330
        artikel: '7'
  - number: 5b.2.b
    text: |-
      ten minste een der adoptiefouders is Nederlander op de dag nadat drie maanden te rekenen van de dag van de
      uitspraak houdende omzetting in eerste aanleg of in hoger beroep zijn verstreken zonder dat daartegen hoger beroep
      of beroep in cassatie is ingesteld, dan wel, indien beroep in cassatie is ingesteld, op de dag van de uitspraak in
      cassatie; en
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5b
  - number: 5b.2.c
    text: het kind was op de dag van de uitspraak houdende omzetting in eerste aanleg minderjarig.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5b
  - number: 5c
    text: Het kind van degene die door adoptie het Nederlanderschap verkrijgt deelt in die verkrijging.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel5c
  - number: '6.1'
    text: |-
      Na het afleggen van een daartoe strekkende schriftelijke verklaring verkrijgt door een bevestiging als bedoeld in
      het derde lid het Nederlanderschap:
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: 6.1.a
    text: |-
      de toegelaten meerderjarige vreemdeling die in het Europese deel van Nederland, Aruba, Curaçao, Sint Maarten of de
      openbare lichamen Bonaire, Sint Eustatius en Saba, is geboren en aldaar sedert zijn geboorte hoofdverblijf heeft;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: 6.1.b
    text: |-
      de vreemdeling die in het Europese deel van Nederland, Aruba, Curaçao, Sint Maarten of de openbare lichamen
      Bonaire, Sint Eustatius en Saba, is geboren, aldaar gedurende een onafgebroken periode van tenminste drie jaren
      toelating en hoofdverblijf heeft en sedert zijn geboorte staatloos is;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: 6.1.c
    text: |-
      de minderjarige vreemdeling die door een Nederlander is erkend en die niet op grond van de [artikelen 3][ref1]
      of [4][ref2] Nederlander is of is geworden, indien hij onmiddellijk voorafgaand aan de verklaring gedurende een
      onafgebroken periode van ten minste drie jaren verzorging en opvoeding heeft genoten van de Nederlander door wie
      hij is erkend;


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel4
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '4'
        hoofdstuk: '2'
  - number: 6.1.d
    text: |-
      de minderjarige vreemdeling die krachtens Nederlandse rechterlijke beslissing of bij zijn geboorte van rechtwege
      onder het gezamenlijk gezag is komen te staan van een niet-Nederlandse vader of moeder en een ander die Nederlander
      is, indien hij na het instellen van dat gezag gedurende een onafgebroken periode van tenminste drie jaren
      verzorging en opvoeding heeft genoten van deze Nederlander, en hij zijn hoofdverblijf niet heeft in het land
      waarvan hij onderdaan is. Op de minderjarige die ten tijde van het afleggen van de verklaring de leeftijd van
      zestien jaar nog niet heeft bereikt, is het vierde lid van dit artikel niet van toepassing;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: 6.1.e
    text: |-
      de meerderjarige vreemdeling die sedert het bereiken van de leeftijd van vier jaar toelating en hoofdverblijf heeft
      in het Europese deel van Nederland, Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius
      en Saba;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: 6.1.f
    text: |-
      de meerderjarige vreemdeling die te eniger tijd het Nederlanderschap of de staat van Nederlands onderdaan-niet-
      Nederlander heeft bezeten en in het Europese deel van Nederland, Aruba, Curaçao, Sint Maarten of de openbare
      lichamen Bonaire, Sint Eustatius en Saba tenminste één jaar toelating voor onbepaalde tijd en hoofdverblijf heeft
      tenzij hij het Nederlanderschap heeft verloren op grond van [artikel 15, eerste lid, onder d of e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel15
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '15'
        hoofdstuk: '5'
  - number: 6.1.g
    text: |-
      de vreemdeling die gedurende tenminste drie jaren de echtgenoot is van een Nederlander en gedurende een
      onafgebroken periode van tenminste vijftien jaren toelating en hoofdverblijf heeft in het Europese deel van
      Nederland, Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: 6.1.h
    text: |-
      de vreemdeling die de leeftijd van vijf en zestig jaar heeft bereikt en gedurende een onafgebroken periode van
      tenminste vijftien jaren toelating en hoofdverblijf heeft in het Europese deel van Nederland, Aruba, Curaçao, Sint
      Maarten of de openbare lichamen Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: 6.1.i
    text: |-
      de vreemdeling die vóór 1 januari 1985 is geboren uit een moeder die ten tijde van zijn geboorte Nederlander was,
      terwijl de vader ten tijde van die geboorte niet-Nederlander was;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: 6.1.j
    text: |-
      het vóór 1 januari 1985 in het Europese deel van Nederland, Aruba, Curaçao, Sint Maarten of de openbare lichamen
      Bonaire, Sint Eustatius en Saba bij rechterlijke uitspraak geadopteerde niet-Nederlandse kind van een vrouw die
      op de dag dat de uitspraak kracht van gewijsde heeft gekregen Nederlander was, indien het kind op de dag van de
      uitspraak in eerste aanleg minderjarig was;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: 6.1.k
    text: |-
      de vreemdeling die is geboren als kind van één van de in de onderdelen i of j bedoelde personen die het
      Nederlanderschap heeft verkregen dan wel voor die verkrijging is overleden;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: 6.1.l
    text: |-
      de vreemdeling die voor de leeftijd van zeven jaar is erkend door één van de in de onderdelen i of j bedoelde
      personen die het Nederlanderschap heeft verkregen dan wel voor die verkrijging is overleden;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: 6.1.m
    text: |-
      de vreemdeling die door één van de in de onderdelen i of j bedoelde personen die het Nederlanderschap heeft
      verkregen dan wel voor die verkrijging is overleden, tijdens zijn minderjarigheid is erkend, terwijl hij aangetoond
      heeft dat die persoon de biologische vader is;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: 6.1.n
    text: |-
      de vreemdeling die door een gerechtelijke vaststelling van het ouderschap kind is van één van de in de onderdelen
      i of j bedoelde personen die het Nederlanderschap heeft verkregen dan wel voor die verkrijging is overleden, indien
      hij op de dag van de uitspraak in eerste aanleg minderjarig was;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: 6.1.o
    text: |-
      het in het Europese deel van Nederland, Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint
      Eustatius en Saba bij rechterlijke uitspraak geadopteerde kind van één van de in de onderdelen i of j bedoelde
      personen die het Nederlanderschap heeft verkregen dan wel voor die verkrijging is overleden, indien hij op de dag
      van de uitspraak in eerste aanleg minderjarig was.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: '6.2'
    text: |-
      Bij het afleggen van de verklaring tot verkrijging van het Nederlanderschap verklaart de meerderjarige vreemdeling
      en de minderjarige vreemdeling die de leeftijd van zestien jaar heeft bereikt tevens bereid te zijn bij de
      verkrijging van het Nederlanderschap een verklaring van verbondenheid af te leggen. Het besluit tot bevestiging
      wordt niet bekend gemaakt dan nadat de verklaring van verbondenheid daadwerkelijk is afgelegd.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: '6.3'
    text: |-
      De autoriteit die de verklaring in ontvangst neemt, beoordeelt aan de hand van de haar overgelegde stukken de
      gronden waarop de verklaring berust. Indien aan de vereisten is voldaan, bevestigt zij schriftelijk de verkrijging
      van het Nederlanderschap.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: '6.4'
    text: |-
      Zij weigert de bevestiging indien op grond van het gedrag van de persoon, die de verklaring betreft, ernstige
      vermoedens bestaan dat hij gevaar oplevert voor de openbare orde, de goede zeden of de veiligheid van het
      Koninkrijk, tenzij volkenrechtelijke verplichtingen zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: '6.5'
    text: |-
      Zij beslist binnen dertien weken na de inontvangstneming van de verklaring; deze termijn kan éénmaal met ten
      hoogste dertien weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: '6.6'
    text: |-
      Indien een persoon op wie de verklaring betrekking heeft, geen geslachtsnaam of voornaam heeft of indien de juiste
      spelling daarvan niet vaststaat, wordt deze in overleg met hem vastgesteld en in de bevestiging vermeld; zijn naam
      wordt daarin zonodig in de in het Koninkrijk gebruikelijke lettertekens overgebracht.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: '6.7'
    text: |-
      Voor de toepassing van het eerste lid, aanhef en onder a en b, wordt geboorte aan boord van een in het Europese
      deel van Nederland, Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius en Saba te boek
      gesteld zeeschip of luchtvaartuig gelijk gesteld met geboorte in het Europese deel van Nederland, Aruba, Curaçao,
      Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: '6.8'
    text: |-
      Het minderjarige niet-Nederlandse kind van de vader, moeder of adoptiefouder als bedoeld in
      [artikel 11, achtste lid][ref1], die een verklaring tot verkrijging van het Nederlanderschap aflegt, deelt in
      die verkrijging indien het in de verklaring tot dat doel is vermeld en het, behoudens in de gevallen waarin de
      verklaring wordt afgelegd op grond van het eerste lid, onder c of d, sedert het tijdstip van het afleggen van de
      verklaring toelating en hoofdverblijf heeft in het Europese deel van Nederland, Aruba, Curaçao, Sint Maarten of
      de openbare lichamen Bonaire, Sint Eustatius en Saba. Kinderen van een kind dat in de verkrijging deelt, delen
      onder dezelfde voorwaarden in die verkrijging. Een kind dat ten tijde van het afleggen van de bereidverklaring
      de leeftijd van zestien jaar heeft bereikt, deelt slechts in de verkrijging indien het daarmee uitdrukkelijk
      instemt, de in het tweede lid bedoelde bereidverklaring, alsmede de verklaring zelf aflegt en jegens hem geen
      vermoedens bestaan als in het vierde lid bedoeld. Het besluit tot bevestiging wordt niet bekend gemaakt dan nadat
      de verklaring van verbondenheid daadwerkelijk is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel11
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '11'
        hoofdstuk: '4'
  - number: '6.9'
    text: |-
      Aan de vreemdeling die te eniger tijd het Nederlanderschap door optie heeft verkregen, staat van de in het eerste
      lid genoemde mogelijkheden tot herkrijging van het Nederlanderschap door optie alleen die, bedoeld onder f., open.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6
  - number: 6a.1
    text: |-
      De in [artikel 6, tweede lid][ref1], bedoelde bevestiging wordt geweigerd indien de vreemdeling als bedoeld
      in artikel 6, eerste lid, onder e, een andere nationaliteit bezit en niet het mogelijke heeft gedaan om die
      nationaliteit te verliezen dan wel niet bereid is het mogelijke te zullen doen om, na de totstandkoming van de
      bevestiging, die nationaliteit te verliezen, tenzij dit redelijkerwijs niet kan worden verlangd.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel6
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '6'
        hoofdstuk: '3'
  - number: 6a.2
    text: Het eerste lid is niet van toepassing op
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6a
  - number: 6a.2.a
    text: |-
      de vreemdeling die onderdaan is van een Staat die Partij is bij het op 2 februari 1993 te Straatsburg tot stand
      gekomen Tweede Protocol tot wijziging van het Verdrag betreffende de beperking van gevallen van meervoudige
      nationaliteit en betreffende militaire verplichtingen in geval van meervoudige nationaliteit (Trb. 1994, 265);
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6a
  - number: 6a.2.b
    text: |-
      de vreemdeling die in Nederland, Aruba, Curaçao of Sint Maarten is geboren en daar ten tijde van de verklaring tot
      verkrijging van het Nederlanderschap zijn hoofdverblijf heeft;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6a
  - number: 6a.2.c
    text: de vreemdeling die gehuwd is met een Nederlander;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6a
  - number: 6a.2.d
    text: de vreemdeling die in Nederland, Aruba, Curaçao of Sint Maarten erkend is als vluchteling.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6a
  - number: 6a.3
    text: |-
      De autoriteit, bedoeld in [artikel 6, derde lid][ref1], beoordeelt of de vreemdeling heeft voldaan aan het
      vereiste, genoemd in het eerste lid, of dat de vreemdeling een beroep toekomt op een van de uitzonderingen, genoemd
      in het tweede lid. Indien dit het geval is en ook aan de overige vereisten is voldaan, bevestigt zij schriftelijk
      de verkrijging van het Nederlanderschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel6
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '6'
        hoofdstuk: '3'
  - number: 6a.4
    text: |-
      De autoriteit vraagt advies aan Onze Minister indien de vreemdeling stelt dat afstand van zijn andere nationaliteit
      redelijkerwijs niet kan worden verlangd. De autoriteit deelt de vreemdeling mee dat Onze Minister om advies is
      verzocht en binnen welke termijn op de optie zal worden besloten.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6a
  - number: 6a.5
    text: |-
      De autoriteit besluit na de ontvangst van het advies van Onze Minister schriftelijk op de verkrijging van het
      Nederlanderschap.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6a
  - number: 6a.6
    text: |-
      De beslistermijn als bedoeld in [artikel 6, vierde lid][ref1], wordt met vier weken verlengd, indien de autoriteit
      Onze Minister verzoekt om advies, bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel6
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '6'
        hoofdstuk: '3'
  - number: '7.1'
    text: |-
      Met inachtneming van de bepalingen van dit Hoofdstuk verlenen Wij op voordracht van Onze Minister het
      Nederlanderschap aan vreemdelingen die daarom verzoeken.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel7
  - number: '7.2'
    text: |-
      Ten aanzien van hen die hun hoofdverblijf hebben in Aruba, Curaçao of Sint Maarten, adviseert Onze Minister van
      Justitie van Aruba, van Curaçao, onderscheidenlijk van Sint Maarten, omtrent het verzoek.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel7
  - number: '8.1'
    text: |-
      Voor verlening van het Nederlanderschap overeenkomstig [artikel 7][ref1] komt slechts in aanmerking de verzoeker


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel7
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '7'
        hoofdstuk: '4'
  - number: 8.1.a
    text: die meerderjarig is;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel8
  - number: 8.1.b
    text: |-
      tegen wiens verblijf voor onbepaalde tijd in het Europese deel van Nederland, Aruba, Curaçao, Sint Maarten of de
      openbare lichamen Bonaire, Sint Eustatius en Saba, geen bedenkingen bestaan;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel8
  - number: 8.1.c
    text: |-
      die tenminste sedert vijf jaren onmiddellijk voorafgaande aan het verzoek in het Europese deel van Nederland,
      Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius en Saba, toelating en hoofdverblijf
      heeft;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel8
  - number: 8.1.d
    text: |-
      die in het Koninkrijk en het land van ingezetenschap als ingeburgerd kan worden beschouwd op grond van het feit
      dat hij beschikt over een bij algemene maatregel van rijksbestuur te bepalen mate van kennis van de Nederlandse
      taal en – indien hij in Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius en Saba
      hoofdverblijf heeft – de taal die op het eiland van het hoofdverblijf gangbaar is, alsmede van de staatsinrichting
      en maatschappij van het Europese deel van Nederland, Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire,
      Sint Eustatius en Saba, en hij zich ook overigens in een van deze samenlevingen heeft doen opnemen; en
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel8
  - number: 8.1.e
    text: |-
      die verklaart bereid te zijn bij de verkrijging van het Nederlanderschap een verklaring van verbondenheid af te
      leggen. Het besluit tot verlening wordt niet bekend gemaakt dan nadat de verklaring daadwerkelijk is afgelegd.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel8
  - number: '8.2'
    text: |-
      Het eerste lid, onder c, geldt niet met betrekking tot de verzoeker die hetzij te eniger tijd het Nederlanderschap
      of de staat van Nederlands onderdaan-niet-Nederlander heeft bezeten, hetzij sedert tenminste drie jaren de
      echtgenoot is van en samenwoont met een Nederlander, hetzij tijdens zijn meerderjarigheid in Nederland, Aruba,
      Curaçao of Sint Maarten is geadopteerd door ouders van wie in elk geval één het Nederlanderschap bezit.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel8
  - number: '8.3'
    text: |-
      De termijn bedoeld in het eerste lid, onder c, wordt op twee jaren gesteld voor degene die in totaal ten minste
      tien jaren in het Europese deel van Nederland, Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint
      Eustatius en Saba toelating en hoofdverblijf heeft gehad.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel8
  - number: '8.4'
    text: |-
      De termijn bedoeld in het eerste lid, onder c, wordt op drie jaren gesteld voor de verzoeker die hetzij ongehuwd
      tenminste drie jaren onafgebroken met een ongehuwde Nederlander in een duurzame relatie anders dan het huwelijk
      samenleeft, hetzij staatloos is.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel8
  - number: '8.5'
    text: |-
      De termijn bedoeld in het eerste lid, onder c, wordt eveneens op drie jaren gesteld voor de verzoeker die door
      erkenning of wettiging zonder erkenning het kind van een Nederlander is geworden. Voor de verzoeker die tijdens
      zijn minderjarigheid is erkend of gewettigd wordt de termijn van drie jaren verminderd met de onafgebroken periode
      gedurende welke hij onmiddellijk voorafgaande aan zijn meerderjarigheid na de erkenning of wettiging zonder
      erkenning, verzorging en opvoeding heeft genoten van de Nederlander door wie hij is erkend of wiens kind hij door
      wettiging zonder erkenning is geworden.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel8
  - number: '8.6'
    text: |-
      Een krachtens het eerste lid, onder d, vastgestelde algemene maatregel van rijksbestuur treedt niet eerder in
      werking dan vier weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt
      onverwijld mededeling gedaan aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel8
  - number: '9.1'
    text: |-
      Het verzoek van een vreemdeling die voldoet aan de [artikelen 7][ref1] en [8][ref2] wordt niettemin afgewezen,
      indien


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel8
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '7'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '8'
        hoofdstuk: '4'
  - number: 9.1.a
    text: |-
      op grond van het gedrag van de verzoeker ernstige vermoedens bestaan dat hij gevaar oplevert voor de openbare orde,
      de goede zeden, of de veiligheid van het Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel9
  - number: 9.1.b
    text: |-
      de verzoeker die een andere nationaliteit bezit, niet het mogelijke heeft gedaan om die nationaliteit te
      verliezen dan wel niet bereid is het mogelijke te zullen doen om, na de totstandkoming van de naturalisatie, die
      nationaliteit te verliezen, tenzij dit redelijkerwijs niet kan worden verlangd;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel9
  - number: 9.1.c
    text: |-
      de verzoeker op wie een van de uitzonderingen van [artikel 8, tweede lid][ref1], van toepassing is, zijn
      hoofdverblijf heeft in het land waarvan hij onderdaan is.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel8
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '8'
        hoofdstuk: '4'
  - number: '9.2'
    text: |-
      Indien de verzoeker het Nederlanderschap heeft verloren ingevolge [artikel 16, eerste lid][ref1], kan het verzoek
      op de grond bedoeld in het eerste lid, onder a, alleen worden afgewezen, indien hij binnen een periode van tien
      jaren voorafgaande aan het verzoek veroordeeld is wegens een strafbaar feit tegen de veiligheid van het Koninkrijk
      of is veroordeeld tot een gevangenisstraf van tenminste vijf jaren wegens een ander strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel16
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '16'
        hoofdstuk: '5'
  - number: '9.3'
    text: Het eerste lid, aanhef en onder b, is niet van toepassing op
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel9
  - number: 9.3.a
    text: |-
      de verzoeker die onderdaan is van een Staat die Partij is bij het op 2 februari 1993 te Straatsburg tot stand
      gekomen Tweede Protocol tot wijziging van het Verdrag betreffende de beperking van gevallen van meervoudige
      nationaliteit en betreffende militaire verplichtingen in geval van meervoudige nationaliteit (Trb. 1994, 265);
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel9
  - number: 9.3.b
    text: |-
      de verzoeker die in Nederland, Aruba, Curaçao of Sint Maarten is geboren en daar ten tijde van het verzoek zijn
      hoofdverblijf heeft;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel9
  - number: 9.3.c
    text: de verzoeker die gehuwd is met een Nederlander;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel9
  - number: 9.3.d
    text: de verzoeker die in Nederland, de Nederlandse Antillen of Aruba erkend is als vluchteling.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel9
  - number: '9.4'
    text: |-
      Op het verzoek wordt beslist binnen één jaar na de betaling van het verschuldigde recht, bedoeld in
      [artikel 13][ref1] of na de beslissing tot algehele ontheffing van die betaling, dan wel na de ontvangst van de
      gevraagde aanvulling van het verzoek, noodzakelijk voor de beoordeling daarvan. De beslissing kan ten hoogste
      tweemaal zes maanden worden aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel13
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '13'
        hoofdstuk: '4'
  - number: '9.5'
    text: |-
      Beslissingen tot afwijzing of aanhouding van verzoeken tot verlening van het Nederlanderschap kunnen door Onze
      Minister worden genomen.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel9
  - number: '10'
    text: |-
      Wij kunnen, de Raad van State van het Koninkrijk gehoord, in bijzondere gevallen het
      Nederlanderschap verlenen met afwijking van [artikel 8, eerste lid, aanhef en onder a, c en d][ref1],
      [artikel 9, eerste lid, aanhef en onder c][ref2], en de termijn genoemd in
      [artikel 11, derde, vierde en vijfde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel11
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '8'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '9'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0003738
        artikel: '11'
        hoofdstuk: '4'
  - number: '11.1'
    text: |-
      Het minderjarige niet-Nederlandse kind van een vader of moeder aan wie het Nederlanderschap is verleend, deelt in
      deze verlening, indien dit in het besluit uitdrukkelijk is bepaald. Het verzoek tot medeverlening wordt bij het
      verzoek tot verlening ingediend.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel11
  - number: '11.2'
    text: |-
      Een verzoek van de vader of moeder tot medeverlening van het Nederlanderschap aan een kind beneden de leeftijd van
      16 jaar wordt ingewilligd indien het kind sedert het tijdstip van het verzoek in het Europese deel van Nederland,
      Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius en Saba, toelating voor onbepaalde
      tijd en hoofdverblijf heeft.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel11
  - number: '11.3'
    text: |-
      Een verzoek van de vader of moeder tot medeverlening van het Nederlanderschap aan een kind dat ten tijde van
      het verzoek de leeftijd van 16 jaar heeft bereikt wordt ingewilligd indien het kind in het Europese deel van
      Nederland, Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius en Saba een onafgebroken
      periode van ten minste drie jaren onmiddellijk voorafgaand aan het verzoek toelating en hoofdverblijf en,
      sedert het tijdstip van het verzoek, toelating voor onbepaalde tijd en hoofdverblijf heeft. Het Nederlanderschap
      wordt slechts verleend, indien het kind daarmee uitdrukkelijk instemt, hij bereid is bij de verkrijging van
      het Nederlanderschap een verklaring van verbondenheid af te leggen en op hem geen van de afwijzingsgronden van
      [artikel 9, eerste lid, aanhef en onder a][ref1], met inbegrip van het tweede lid van dat artikel, van toepassing
      is. Het besluit tot verlening wordt niet bekend gemaakt dan nadat de verklaring van verbondenheid daadwerkelijk
      is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel9
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '9'
        hoofdstuk: '4'
  - number: '11.4'
    text: |-
      Aan het minderjarige niet-Nederlandse kind van een vader of moeder die het Nederlanderschap door optie verkregen
      heeft of aan wie dat is verleend, dat in deze verkrijging of verlening niet deelde, wordt op zijn verzoek het
      Nederlanderschap verleend, indien het een onafgebroken periode van tenminste drie jaren onmiddellijk voorafgaand
      aan het verzoek toelating en hoofdverblijf en, sedert het tijdstip van het verzoek, toelating voor onbepaalde tijd
      en hoofdverblijf in het Europese deel van Nederland, Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire,
      Sint Eustatius en Saba heeft. De termijn van toelating en hoofdverblijf is niet van toepassing op het kind dat
      geboren is nadat zijn ouder de verklaring bedoeld in [artikel 6, eerste lid][ref1], of het verzoek, bedoeld in
      [artikel 7, eerste lid][ref2], heeft ingediend. Aan een kind dat ten tijde van het verzoek de leeftijd van zestien
      jaar heeft bereikt, wordt het Nederlanderschap slechts verleend, indien het daarmee uitdrukkelijk instemt, hij
      bereid is bij de verkrijging van het Nederlanderschap een verklaring van verbondenheid af te leggen en op hem geen
      van de afwijzingsgronden van [artikel 9, aanhef en onder a][ref3], met inbegrip van het tweede lid van dat artikel,
      van toepassing is. Het besluit tot verlening wordt niet bekend gemaakt dan nadat de verklaring van verbondenheid
      daadwerkelijk is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel9
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '7'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0003738
        artikel: '9'
        hoofdstuk: '4'
  - number: '11.5'
    text: |-
      Aan het niet-Nederlandse kind van een vader of moeder die het Nederlanderschap door optie verkregen heeft of
      aan wie zulks is verleend, dat minderjarig was op het tijdstip van de verklaring of het verzoek van die ouder,
      en dat in deze verkrijging of verlening niet deelde wegens het bereiken van de meerderjarigheid, wordt het
      Nederlanderschap op zijn verzoek verleend:
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel11
  - number: 11.5.a
    text: |-
      indien hij een onafgebroken periode van ten minste drie jaren onmiddellijk voorafgaand aan het verzoek en
      aanvangende vóór het bereiken van de meerderjarigheid toelating en hoofdverblijf en, sedert het tijdstip van het
      verzoek, toelating voor onbepaalde tijd en hoofdverblijf in het Europese deel van Nederland, Aruba, Curaçao, Sint
      Maarten of de openbare lichamen Bonaire, Sint Eustatius en Saba heeft,
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel11
  - number: 11.5.b
    text: indien hij bereid is bij de verkrijging van het Nederlanderschap een verklaring van verbondenheid af te leggen en
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel11
  - number: 11.5.c
    text: |-
      ten aanzien van hem geen van de afwijzingsgronden van [artikel 9, eerste lid, aanhef en onder a][ref1], met
      inbegrip van het [tweede lid van dat artikel][ref2], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel9
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '9'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '9'
        hoofdstuk: '4'
  - number: '11.6'
    text: |-
      De vereisten van toelating en van hoofdverblijf van het tweede en derde lid zijn niet van toepassing op het
      minderjarige kind van een vader of moeder die hoofdverblijf heeft in het buitenland en die met toepassing van het
      [tweede lid van artikel 8][ref1] het Nederlanderschap verkrijgt, mits het kind feitelijk tot het gezin van deze
      ouder behoort en zijn hoofdverblijf niet heeft in het land waarvan hij onderdaan is.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel8
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '8'
        hoofdstuk: '4'
  - number: '11.7'
    text: Kinderen van een kind dat in de verlening deelt, delen onder dezelfde voorwaarden in die verlening.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel11
  - number: '11.8'
    text: |-
      Voor de toepassing van dit artikel wordt onder vader of moeder mede verstaan de adoptiefouder, indien de adoptie
      tot stand is gekomen in overeenstemming met de regelen van Nederlands internationaal privaatrecht en de adoptie tot
      gevolg heeft gehad dat de voordien bestaande familierechtelijke betrekkingen zijn verbroken.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel11
  - number: '12.1'
    text: |-
      Indien de verzoeker geen geslachtsnaam of voornaam heeft of indien de juiste spelling daarvan niet vaststaat,
      zullen deze in overleg met hem worden vastgesteld bij het besluit waarbij het Nederlanderschap wordt verleend.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel12
  - number: '12.2'
    text: |-
      De naam van de verzoeker wordt zonodig in de in het Koninkrijk gebruikelijke lettertekens overgebracht en kan,
      indien dit voor de inburgering van belang is, met toestemming van de verzoeker bij het besluit tot verlening van
      het Nederlanderschap worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel12
  - number: '13.1'
    text: |-
      Bij algemene maatregel van rijksbestuur worden regelen gesteld betreffende het recht dat verschuldigd is voor het
      afleggen en de behandeling van de verklaring van optie en van het verzoek tot verlening van het Nederlanderschap,
      de gevallen en de mate waarin daarvan ontheffing kan worden verleend en de wijze waarop het moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel13
  - number: '13.2'
    text: |-
      Bij algemene maatregel van rijksbestuur worden regelen gesteld betreffende het bewijs van toelating tot één van de
      landen van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister kan de verkrijging of verlening van het Nederlanderschap intrekken, indien zij berust op een door
      de betrokken persoon gegeven valse verklaring of bedrog, dan wel op het verzwijgen van enig voor de verkrijging
      of verlening relevant feit. De intrekking werkt terug tot het tijdstip van verkrijging of verlening van het
      Nederlanderschap. De intrekking is niet mogelijk indien sedert de verkrijging of verlening een periode van twaalf
      jaar is verstreken. De derde volzin is niet van toepassing indien de betrokken persoon is veroordeeld voor een
      van de misdrijven, omschreven in de artikelen 6, 7, 8 en 8 bis van het op 17 juli 1998 te Rome tot stand gekomen
      Statuut van Rome inzake het Internationale Strafhof (Trb. 2000, 120 en Trb. 2011, 73).
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel14
  - number: '14.2'
    text: 'Onze Minister kan het Nederlanderschap intrekken van de persoon die onherroepelijk is veroordeeld wegens:'
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel14
  - number: 14.2.a
    text: |-
      een misdrijf omschreven in de
      [titels I tot en met IV van het Tweede Boek van het Nederlandse Wetboek van Strafrecht][ref1], waarop naar de
      wettelijke omschrijving een gevangenisstraf van acht jaar of meer is gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: 14.2.b
    text: |-
      een misdrijf als bedoeld in de [artikelen 83][ref1], [134a][ref2]
      of [205 van het Nederlandse Wetboek van Strafrecht][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel134a
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel205
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '83'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 134a
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '205'
  - number: 14.2.c
    text: |-
      een misdrijf dat soortgelijk is aan de misdrijven bedoeld onder a waarop naar de wettelijke omschrijving in de
      strafwet van een van de landen van het Koninkrijk een gevangenisstraf van acht jaar of meer is gesteld, danwel een
      misdrijf dat naar de wettelijke omschrijving in de strafwet van een van de landen van het Koninkrijk soortgelijk is
      aan de misdrijven bedoeld onder b;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel14
  - number: 14.2.d
    text: |-
      een misdrijf omschreven in de artikelen 6, 7, 8 en 8 bis van het op 17 juli 1998 te Rome tot stand gekomen Statuut
      van Rome inzake het Internationale Strafhof (Trb. 2000, 120 en Trb. 2011, 73).
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel14
  - number: '14.3'
    text: |-
      Onze Minister kan het Nederlanderschap intrekken van de persoon die de leeftijd van zestien jaar heeft bereikt en
      die zich vrijwillig in vreemde krijgsdienst begeeft van een staat die betrokken is bij gevechtshandelingen tegen
      het Koninkrijk dan wel tegen een bondgenootschap waarvan het Koninkrijk lid is.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel14
  - number: '14.4'
    text: |-
      Onze Minister kan in het belang van de nationale veiligheid het Nederlanderschap intrekken van een persoon die
      de leeftijd van zestien jaar heeft bereikt en die zich buiten het Koninkrijk bevindt, indien uit zijn gedragingen
      blijkt dat hij zich heeft aangesloten bij een organisatie die door Onze Minister, in overeenstemming met het
      gevoelen van de Rijksministerraad, is geplaatst op een lijst van organisaties die deelnemen aan een nationaal of
      internationaal gewapend conflict en een bedreiging vormen voor de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel14
  - number: '14.5'
    text: |-
      De persoon die de Nederlandse nationaliteit heeft verloren op grond van het tweede, derde of vierde lid kan de
      Nederlandse nationaliteit niet herkrijgen. Wij kunnen, de Raad van State van het Koninkrijk gehoord, in bijzondere
      gevallen van de eerste zin afwijken, indien ten minste vijf jaren zijn verstreken sedert het verlies van de
      Nederlandse nationaliteit.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel14
  - number: '14.6'
    text: |-
      Het Nederlanderschap wordt door een minderjarige verloren door het vervallen van de
      familierechtelijke betrekking waaraan het wordt ontleend ingevolge [artikel 3][ref1], [4][ref2],
      [5][ref3], [5a][ref4], [5b][ref5], [5c][ref6], of [6, eerste lid, aanhef en onder c][ref7],
      alsmede ingevolge artikel 4 zoals dit luidde tot de inwerkingtreding van de
      __REF007___________________________________________________________________________________________________________
      ___________________________________________ van 21 december 2000, Stb. 618 en ingevolge artikel 5 zoals dat luidde
      tot de inwerkingtreding van de Rijkswet van 3 juli 2003 tot wijziging van de Rijkswet op het Nederlanderschap
      in verband met de totstandkoming van de Wet conflictenrecht adoptie (Stb. 284). Het verlies bedoeld in de eerste
      zin treedt niet in indien de andere ouder op het tijdstip van het vervallen van die betrekking Nederlander is
      of dat was ten tijde van zijn overlijden. Het verlies treedt evenmin in indien het Nederlanderschap ook kan
      worden ontleend aan artikel 3, derde lid, of aan artikel 2, onder a, van de Wet van 12 december 1892 op het
      Nederlanderschap en het ingezetenschap (Stb. 268).


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003738#Artikel5a
      [ref5]: https://wetten.overheid.nl/BWBR0003738#Artikel5b
      [ref6]: https://wetten.overheid.nl/BWBR0003738#Artikel5c
      [ref7]: https://wetten.overheid.nl/BWBR0003738#Artikel6
      [ref8]: https://wetten.overheid.nl/BWBR0012089
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0003738
        artikel: '5'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0003738
        artikel: 5a
        hoofdstuk: '2'
      - id: ref5
        bwb_id: BWBR0003738
        artikel: 5b
        hoofdstuk: '2'
      - id: ref6
        bwb_id: BWBR0003738
        artikel: 5c
        hoofdstuk: '2'
      - id: ref7
        bwb_id: BWBR0003738
        artikel: '6'
        hoofdstuk: '3'
      - id: ref8
        bwb_id: BWBR0012089
  - number: '14.7'
    text: Het Nederlanderschap wordt niet verloren dan krachtens een van de bepalingen van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel14
  - number: '14.8'
    text: |-
      Met uitzondering van het geval, bedoeld in het eerste lid, heeft geen verlies van het Nederlanderschap plaats
      indien staatloosheid daarvan het gevolg zou zijn.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel14
  - number: '14.9'
    text: |-
      De in het vierde lid bedoelde lijst wordt na vaststelling of wijziging toegezonden aan de Tweede Kamer der Staten-
      Generaal, aan de Staten van Aruba, aan die van Curaçao en aan die van Sint Maarten en wordt gepubliceerd in de
      Staatscourant, in het Afkondigingsblad van Aruba, in het Publicatieblad van Curaçao en in het Afkondigingsblad van
      Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel14
  - number: '14.10'
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur worden nadere regels gesteld omtrent de elementen die
      betrokken worden bij de belangenafweging inzake een beslissing omtrent intrekking van het Nederlanderschap op grond
      van het eerste, tweede, derde of vierde lid.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel14
  - number: '15.1'
    text: 'Het Nederlanderschap gaat voor een meerderjarige verloren:'
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel15
  - number: 15.1.a
    text: door het vrijwillig verkrijgen van een andere nationaliteit;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel15
  - number: 15.1.b
    text: door het afleggen van een verklaring van afstand;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel15
  - number: 15.1.c
    text: |-
      indien hij tevens een vreemde nationaliteit bezit en tijdens zijn meerderjarigheid gedurende een ononderbroken
      periode van tien jaar in het bezit van beide nationaliteiten zijn hoofdverblijf heeft buiten Nederland, Aruba,
      Curaçao en Sint Maarten, en buiten de gebieden waarop het Verdrag betreffende de Europese Unie van toepassing
      is, anders dan in een dienstverband met Nederland, Aruba, Curaçao of Sint Maarten dan wel met een internationaal
      orgaan waarin het Koninkrijk is vertegenwoordigd, of als echtgenoot van of als ongehuwde in een duurzame relatie
      samenlevend met een persoon in een zodanig dienstverband;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel15
  - number: 15.1.d
    text: |-
      door intrekking door Onze Minister van het besluit waarbij het Nederlanderschap is verleend, welke kan
      plaatsvinden, indien de betrokkene heeft nagelaten na de totstandkoming van zijn naturalisatie al het mogelijke te
      doen om zijn oorspronkelijke nationaliteit te verliezen;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel15
  - number: 15.1.e
    text: |-
      door intrekking door Onze Minister van het besluit waarbij de verkrijging van het Nederlanderschap is bevestigd,
      welke kan plaatsvinden, indien de vreemdeling als bedoeld in [artikel 6, eerste lid, onder e][ref1], heeft
      nagelaten na de verkrijging van het Nederlanderschap het mogelijke te doen om zijn oorspronkelijke nationaliteit
      te verliezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel6
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '6'
        hoofdstuk: '3'
  - number: '15.2'
    text: Het eerste lid, aanhef en onder a, is niet van toepassing op de verkrijger
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel15
  - number: 15.2.a
    text: |-
      die in het land van die andere nationaliteit is geboren en daar ten tijde van de verkrijging zijn hoofdverblijf
      heeft;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel15
  - number: 15.2.b
    text: |-
      die voor het bereiken van de meerderjarige leeftijd gedurende een onafgebroken periode van tenminste vijf jaren in
      het land van die andere nationaliteit zijn hoofdverblijf heeft gehad; of
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel15
  - number: 15.2.c
    text: die gehuwd is met een persoon die die andere nationaliteit bezit.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel15
  - number: '15.3'
    text: |-
      De periode bedoeld in het eerste lid, onder c, wordt geacht niet te zijn onderbroken indien de betrokkene gedurende
      een periode korter dan één jaar zijn hoofdverblijf in Nederland, Aruba, Curaçao of Sint Maarten heeft, dan wel in
      de gebieden waarop het Verdrag betreffende de Europese Unie van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel15
  - number: '15.4'
    text: |-
      De periode, bedoeld in het eerste lid, onder c, wordt gestuit door de verstrekking van een verklaring omtrent
      het bezit van het Nederlanderschap dan wel van een reisdocument, Nederlandse identiteitskaart of vervangende
      Nederlandse identiteitskaart in de zin van de [Paspoortwet][ref1]. Vanaf de dag der verstrekking begint een nieuwe
      periode van tien jaren te lopen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 15A
    text: 'Voorts gaat het Nederlanderschap voor een meerderjarige verloren:'
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel15A
  - number: 15A.a
    text: |-
      indien hij ten gevolge van een uitdrukkelijke wilsverklaring door naturalisatie, optie of herstel daarin de
      nationaliteit verkrijgt van een Staat die Partij is bij het op 6 mei 1963 te Straatsburg gesloten Verdrag
      betreffende beperking van gevallen van meervoudige nationaliteit en betreffende militaire verplichtingen in geval
      van meervoudige nationaliteit (Trb. 1964, nr. 4) en dit Verdrag dat verlies meebrengt. Het voorgaande is echter
      niet van toepassing indien die Staat tevens Partij is bij het Tweede Protocol tot wijziging van dat Verdrag (Trb.
      1994, nr. 265) en de betrokkene behoort tot een van de categorieën, genoemd in [artikel 15, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel15
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel15A
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '15'
        hoofdstuk: '5'
  - number: 15A.b
    text: |-
      indien hij ingevolge de op 25 november 1975 te Paramaribo gesloten Toescheidingsovereenkomst inzake nationaliteiten
      tussen het Koninkrijk der Nederlanden en de Republiek Suriname (Trb. 1975, nr. 132) de Surinaamse nationaliteit
      verkrijgt.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel15A
  - number: '16.1'
    text: 'Het Nederlanderschap gaat voor een minderjarige verloren:'
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel16
  - number: 16.1.a
    text: |-
      door gerechtelijke vaststelling van het ouderschap, erkenning, wettiging of adoptie door een vreemdeling, indien
      hij diens nationaliteit daardoor verkrijgt, of deze reeds bezit;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel16
  - number: 16.1.b
    text: |-
      door het afleggen van een verklaring van afstand, indien hij de nationaliteit bezit van zijn vader, moeder of
      adoptiefouder als bedoeld in [artikel 11, achtste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel11
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '11'
        hoofdstuk: '4'
  - number: 16.1.c
    text: |-
      indien zijn vader of moeder vrijwillig een andere nationaliteit verkrijgt en hij in deze verkrijging deelt of deze
      nationaliteit reeds bezit;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel16
  - number: 16.1.d
    text: |-
      indien zijn vader of moeder het Nederlanderschap verliest ingevolge
      [artikel 15, eerste lid, onder b, c of d][ref1], of ingevolge [artikel 15A][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel15A
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '15'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: 15A
        hoofdstuk: '5'
  - number: 16.1.e
    text: indien hij zelfstandig dezelfde nationaliteit verkrijgt als zijn vader of moeder.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel16
  - number: '16.2'
    text: 'Het verlies van het Nederlanderschap, bedoeld in het eerste lid treedt niet in:'
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel16
  - number: 16.2.a
    text: indien en zolang een ouder het Nederlanderschap bezit;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel16
  - number: 16.2.b
    text: |-
      door het overlijden van een ouder na het tijdstip waarop krachtens het eerste lid het verlies van het
      Nederlanderschap zou intreden;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel16
  - number: 16.2.c
    text: |-
      indien een ouder als Nederlander is overleden vóór het tijdstip waarop krachtens het eerste lid het verlies van het
      Nederlanderschap zou intreden;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel16
  - number: 16.2.d
    text: |-
      indien de minderjarige voldoet aan artikel 3, derde lid, of artikel 2, onder a, van de wet van 12 december 1892 op
      het Nederlanderschap en het ingezetenschap (Stb.268), behoudens in het geval bedoeld in het eerste lid onder b;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel16
  - number: 16.2.e
    text: |-
      indien de minderjarige in het land van de door hem verkregen nationaliteit is geboren en daar ten tijde van de
      verkrijging zijn hoofdverblijf heeft, behoudens in het geval bedoeld in het eerste lid onder b;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel16
  - number: 16.2.f
    text: |-
      indien de minderjarige gedurende een onafgebroken periode van tenminste vijf jaren in het land van de door hem
      verkregen nationaliteit zijn hoofdverblijf heeft of gehad heeft, behoudens in het geval bedoeld in het eerste lid
      onder b; of
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel16
  - number: 16.2.g
    text: |-
      indien in het geval in het eerste lid, onder e, bedoeld een ouder op het tijdstip van de verkrijging Nederlander
      is.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel16
  - number: 16A
    text: |-
      Voorts gaat het Nederlanderschap voor een minderjarige verloren indien hij ten gevolge van een uitdrukkelijke
      wilsverklaring door naturalisatie, optie of herstel daarin de nationaliteit verkrijgt van een Staat die Partij
      is bij het op 6 mei 1963 te Straatsburg gesloten Verdrag betreffende beperking van gevallen van meervoudige
      nationaliteit en betreffende militaire verplichtingen in geval van meervoudige nationaliteit (Trb. 1964, nr. 4)
      en dit Verdrag dat verlies meebrengt. Het voorgaande is niet van toepassing indien die Staat tevens Partij is bij
      het Tweede Protocol tot wijziging van dat Verdrag (Trb. 1994, nr. 265), en de betrokkene behoort tot een van de
      categorieën, genoemd in [artikel 16, tweede lid, onder e, f en g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel16
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel16A
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '16'
        hoofdstuk: '5'
  - number: '17.1'
    text: |-
      Een ieder die, buiten een bij enige in een der delen van het Koninkrijk gevestigde rechterlijke instantie of een in
      administratief beroep aanhangige zaak, daarbij onmiddellijk belang heeft, kan bij de rechtbank te ’s-Gravenhage of,
      indien hij in Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius of Saba woonachtig is,
      bij het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba
      een verzoek indienen tot vaststelling van zijn Nederlanderschap of tot vaststelling dat hij het Nederlanderschap
      niet bezit. Het verzoek kan ook strekken tot de vaststelling dat de betrokkene op een bepaald tijdstip het
      Nederlanderschap al dan niet bezat.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel17
  - number: '17.2'
    text: Een verzoek als in het vorige lid bedoeld kan ook ten aanzien van een overledene worden gedaan.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel17
  - number: '18.1'
    text: |-
      Omtrent verzoeken als bedoeld in het vorige artikel hoort de rechtbank, onderscheidenlijk het Hof van Justitie, het
      openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel18
  - number: '18.2'
    text: Voor de belanghebbenden staat van de beschikking uitsluitend beroep in cassatie open.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel18
  - number: '19'
    text: |-
      Aan een onherroepelijk geworden beschikking, gegeven met toepassing van [artikel 17][ref1], is elk met de
      uitvoering van enige wettelijke regeling belast orgaan gebonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel17
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '17'
        hoofdstuk: '6'
  - number: '20.1'
    text: |-
      Indien in enige voor een rechterlijke instantie in Nederland, onderscheidenlijk Aruba, Curaçao of Sint Maarten,
      aanhangige zaak onzeker is of een bij de zaak belanghebbende al dan niet het Nederlanderschap bezit of op een
      vroeger tijdstip bezat, kan de rechter terzake het advies van Onze Minister, onderscheidenlijk van Onze Minister
      van Justitie van Aruba, van Curaçao, onderscheidenlijk van Sint Maarten, vragen.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel20
  - number: '20.2'
    text: |-
      Indien in enig administratief beroep in Nederland, onderscheidenlijk Aruba, Curaçao en Sint Maarten, ingesteld
      een in het vorige lid bedoelde onzekerheid bestaat, houdt die instantie de behandeling van de zaak aan en vraagt
      zij terzake het advies van Onze Minister, onderscheidenlijk van Onze Minister van Justitie van Aruba, van Curaçao,
      onderscheidenlijk van Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel20
  - number: '20.3'
    text: De behandeling van de zaak wordt terstond hervat zodra het in de vorige leden bedoelde advies is ontvangen.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel20
  - number: '21'
    text: |-
      Bij algemene maatregel van rijksbestuur worden de autoriteiten en ambtenaren aangewezen die bevoegd zijn tot
      het in ontvangst nemen van verzoeken om verlening en verklaringen tot verkrijging van het Nederlanderschap,
      en van verklaringen van afstand daarvan en kunnen nadere voorschriften worden gesteld betreffende de wijze van
      inontvangstneming van de verklaringen en de verzoeken, de bevestigingen, bedoeld in [artikel 6][ref1], alsmede de
      verdere administratieve behandeling van verkrijging en verlening van het Nederlanderschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel6
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '6'
        hoofdstuk: '3'
  - number: '22.1'
    text: 'Onze Minister houdt een openbaar register van:'
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22
  - number: 22.1.a
    text: de verklaringen tot verkrijging en afstand van het Nederlanderschap;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22
  - number: 22.1.b
    text: |-
      de bevestigingen, bedoeld in het [derde lid van artikel 6][ref1] en in [artikel 28][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel28
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '28'
        hoofdstuk: '9'
  - number: 22.1.c
    text: de verlening van het Nederlanderschap;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22
  - number: 22.1.d
    text: |-
      de intrekkingen, bedoeld in het [eerste lid van artikel 14][ref1], en [artikel 15, eerste lid, onder d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel15
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '14'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '15'
        hoofdstuk: '5'
  - number: '22.2'
    text: |-
      Onze Ministers van Justitie van Aruba, van Curaçao en van Sint Maarten houden een openbaar register van de in het
      eerste lid bedoelde akten welke betrekking hebben op personen die in hun land woonachtig zijn.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22
  - number: 22a.1
    text: |-
      Tegen een besluit tot intrekking van het Nederlanderschap als bedoeld in [artikel 14, vierde lid][ref1], staat
      rechtstreeks beroep open bij de rechtbank te ’s-Gravenhage of, indien degene die het betreft in Aruba, Curaçao,
      Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius of Saba woonachtig was, bij het Gerecht van eerste
      aanleg van het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius
      en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '14'
        hoofdstuk: '5'
  - number: 22a.2
    text: De termijn voor het indienen van een beroepsschrift bedraagt vier weken.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22a
  - number: 22a.3
    text: |-
      Uiterlijk op de achtentwintigste dag na de bekendmaking van een besluit tot intrekking van het Nederlanderschap
      als bedoeld in [artikel 14, vierde lid][ref1], stelt Onze Minister de rechtbank of het Gerecht van eerste aanleg
      van het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en
      Saba hiervan in kennis, tenzij degene die het betreft voordien zelf beroep heeft ingesteld. Zodra de rechtbank
      onderscheidenlijk het Gerecht van eerste aanleg de kennisgeving heeft ontvangen, wordt degene die het betreft
      geacht beroep te hebben ingesteld tegen het besluit tot intrekking van het Nederlanderschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '14'
        hoofdstuk: '5'
  - number: 22a.4
    text: |-
      Tegen de uitspraak van de rechtbank, bedoeld in het eerste lid, kan hoger beroep worden ingesteld bij de Afdeling
      bestuursrechtspraak van de Raad van State. Tegen de uitspraak van het Gerecht van eerste aanleg, bedoeld in het
      eerste lid, kan hoger beroep worden ingesteld bij het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint
      Maarten en van Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22a
  - number: 22a.5
    text: |-
      Indien de ingevolge het eerste lid bevoegde rechtbank bij het beroep van oordeel is dat het besluit tot intrekking
      van het Nederlanderschap, bedoeld in [artikel 14, vierde lid][ref1], in strijd is met de wet dan wel bij afweging
      van alle daarbij betrokken belangen in redelijkheid niet gerechtvaardigd is, verklaart zij het beroep gegrond.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '14'
        hoofdstuk: '5'
  - number: 22a.6
    text: |-
      Er wordt door de griffier van de ingevolge het eerste lid bevoegde rechtbank, door de griffier van het Gerecht
      van eerste aanleg van het Gemeenschappelijk Hof van Justitie, door de griffier van het Gemeenschappelijk Hof van
      Justitie en door de griffier van de Afdeling bestuursrechtspraak van de Raad van State geen griffierecht geheven.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22a
  - number: 22a.7
    text: |-
      Beroep tegen het besluit tot intrekking van het Nederlanderschap, bedoeld in [artikel 14, vierde lid][ref1],
      wordt geacht tevens beroep tegen het besluit tot ongewenstverklaring, bedoeld in
      [artikel 67 van de Vreemdelingenwet 2000][ref2], [artikel 16d van de Wet toelating en uitzetting BES][ref3], dan
      wel overeenkomstige artikelen uit de wetgeving van de andere landen, te omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0028571#Artikel16d
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '14'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '67'
      - id: ref3
        bwb_id: BWBR0028571
        artikel: 16d
  - number: 22b.1
    text: De belanghebbende is steeds bevoegd een of meer raadslieden te kiezen.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22b
  - number: 22b.2
    text: Daartoe is ook zijn wettige vertegenwoordiger of zijn bijzondere gemachtigde bevoegd.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22b
  - number: 22b.3
    text: |-
      Kan de belanghebbende zijn wil te dien aanzien niet doen blijken en heeft hij geen wettelijke vertegenwoordiger of
      bijzondere gemachtigde, dan is zijn echtgenoot of de meest gerede van zijn in het Koninkrijk verblijvende bloed- of
      aanverwanten, tot de vierde graad ingesloten, tot die keuze bevoegd.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22b
  - number: 22b.4
    text: |-
      De ingevolge het tweede of derde lid gekozen raadsman treedt af zodra de belanghebbende zelf een raadsman heeft
      gekozen.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22b
  - number: 22b.5
    text: |-
      Voor zover deze Rijkswet niet op andere wijze in de toevoeging voorziet, voegt een bij algemene maatregel van
      rijksbestuur te bepalen bevoegd orgaan aan de vreemdeling een raadsman toe.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22b
  - number: 22c.1
    text: |-
      Bevoegd tot het geven van een last tot toevoeging aan het bevoegde orgaan, bedoeld in
      [artikel 22B, vijfde lid][ref1], is de rechtbank respectievelijk het Gerecht van eerste aanleg, bedoeld in
      [artikel 22A, eerste lid][ref2]. Ingeval hoger beroep is ingesteld op grond van artikel 22A, vierde lid,
      is de voorzitter van de Afdeling bestuursrechtspraak van de Raad van State, dan wel de voorzitter van het
      Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba bevoegd
      tot het geven van de last tot toevoeging.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel22b
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel22a
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: 22b
        hoofdstuk: 7a
      - id: ref2
        bwb_id: BWBR0003738
        artikel: 22a
        hoofdstuk: 7a
  - number: 22c.2
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur kunnen nadere regels worden gesteld omtrent uitvoering van
      de [artikelen 22A][ref1], [22B][ref2] en 22C en de beloning van toegevoegde raadslieden en de vergoeding van hun
      onkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel22b
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: 22a
        hoofdstuk: 7a
      - id: ref2
        bwb_id: BWBR0003738
        artikel: 22b
        hoofdstuk: 7a
  - number: '23.1'
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur kunnen nadere regelen worden gesteld ter uitvoering van deze
      Rijkswet.
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel23
  - number: '23.2'
    text: |-
      De verklaring van verbondenheid, bedoeld in [artikel 6, tweede lid][ref1], [artikel 8, eerste lid onder e][ref2] en
      [artikel 11, derde, vierde en vijfde lid][ref3], wordt afgelegd met de volgende woorden: Ik zweer (verklaar) dat ik
      de grondwettelijke orde van het Koninkrijk der Nederlanden, haar vrijheden en rechten respecteer en zweer (beloof)
      de plichten die het staatsburgerschap met zich meebrengt getrouw te vervullen. Degene die de verklaring aflegt
      voegt daar ter bevestiging aan toe: Zo waarlijk helpe mij God almachtig, of: Dat verklaar en beloof ik.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel11
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '8'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0003738
        artikel: '11'
        hoofdstuk: '4'
  - number: '23.3'
    text: |-
      De gevallen waarin het afleggen van de verklaring, in afwijking van [artikel 6, tweede lid][ref1],
      [6 achtste lid][ref2], [8, eerste lid onder e][ref3], [11, derde, vierde lid][ref4],
      [11 vijfde lid onder b][ref5], [26, derde lid][ref6] en [28, derde lid][ref7], niet gevraagd zal worden of
      redelijkerwijs niet gevraagd kan worden en de wijze waarop deze verklaring kan worden afgelegd, worden bij of
      krachtens algemene maatregel van bestuur vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003738#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0003738#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0003738#Artikel26
      [ref7]: https://wetten.overheid.nl/BWBR0003738#Artikel28
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel23
