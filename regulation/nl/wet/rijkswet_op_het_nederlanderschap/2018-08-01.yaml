preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat er mede in verband met de bekrachtiging van het op 30 augustus
    1961 te New York tot stand gekomen Verdrag tot beperking der staatloosheid (Trb. 1967, 124), het op 6 mei 1963
    te Straatsburg tot stand gekomen Verdrag betreffende beperking van gevallen van meervoudige nationaliteit en
    betreffende de militaire verplichtingen in geval van meervoudige nationaliteit (Trb. 1964, 4) en de op 13 september
    1973 te Bern tot stand gekomen Overeenkomst inzake beperking van het aantal gevallen van staatloosheid (Trb.
    1974, 32), aanleiding bestaat de Wet van 12 december 1892, Stb. 268 op het Nederlanderschap en het ingezetenschap
    aan een algehele herziening te onderwerpen en ter vervanging van die wet nieuwe, algemene bepalingen omtrent het
    Nederlanderschap vast te stellen;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze Rijkswet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Justitie in zijn hoedanigheid van minister van het Koninkrijk;'
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel1
  - number: 1.1.b
    text: 'meerderjarige: hij die de leeftijd van achttien jaren heeft bereikt of voordien in het huwelijk is getreden;'
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel1
  - number: 1.1.c
    text: |-
      moeder: de vrouw tot wie het kind, anders dan door adoptie, in de eerste graad in opgaande lijn in
      familierechtelijke betrekking staat;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel1
  - number: 1.1.d
    text: |-
      vader: de man tot wie het kind, anders dan door adoptie, in de eerste graad in opgaande lijn in familierechtelijke
      betrekking staat;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel1
  - number: 1.1.e
    text: 'vreemdeling: hij die de Nederlandse nationaliteit niet bezit;'
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel1
  - number: 1.1.f
    text: 'staatloze: een persoon die door geen enkele staat, krachtens diens wetgeving, als onderdaan wordt beschouwd;'
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel1
  - number: 1.1.g
    text: |-
      toelating: instemming door het bevoegd gezag met het bestendig verblijf van de vreemdeling in het Europese deel van
      Nederland, Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel1
  - number: 1.1.h
    text: 'hoofdverblijf: de plaats waar een persoon zijn feitelijke woonstede heeft.'
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel1
  - number: '1.2'
    text: |-
      Behoudens voor de toepassing van [artikel 15A, onder a, van deze rijkswet ][ref1]wordt mede verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel15A
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: 15A
        hoofdstuk: '5'
  - number: 1.2.a
    text: |-
      echtgenoot: de partner in een in Nederland geregistreerd partnerschap alsmede de partner in
      een buiten Nederland geregistreerd partnerschap dat op grond van de [artikelen 2][ref1] en
      [3 van de Wet conflictenrecht geregistreerd partnerschap][ref2] wordt erkend, en


      [ref1]: https://wetten.overheid.nl/BWBR0016986#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016986#Artikel3
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016986
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0016986
        artikel: '3'
