    text: |-
      huwelijk: het in Nederland geregistreerd partnerschap alsmede het buiten Nederland geregistreerd partnerschap
      dat op grond van de [artikelen 2][ref1] en [3 van de Wet conflictenrecht geregistreerd partnerschap][ref2] wordt
      erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0016986#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016986#Artikel3
    url: https://wetten.overheid.nl/BWBR0003738/2018-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016986
        artikel: '2'
