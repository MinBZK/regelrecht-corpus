url: https://wetten.overheid.nl/BWBR0003738/1998-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat er mede in verband met de bekrachtiging van het op 30 augustus
    1961 te New York tot stand gekomen Verdrag tot beperking der staatloosheid (Trb. 1967, 124), het op 6 mei 1963
    te Straatsburg tot stand gekomen Verdrag betreffende beperking van gevallen van meervoudige nationaliteit en
    betreffende de militaire verplichtingen in geval van meervoudige nationaliteit (Trb. 1964, 4) en de op 13 september
    1973 te Bern tot stand gekomen Overeenkomst inzake beperking van het aantal gevallen van staatloosheid (Trb.
    1974, 32), aanleiding bestaat de Wet van 12 december 1892, Stb. 268 op het Nederlanderschap en het ingezetenschap
    aan een algehele herziening te onderwerpen en ter vervanging van die wet nieuwe, algemene bepalingen omtrent het
    Nederlanderschap vast te stellen;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: Voor de toepassing van deze Rijkswet wordt verstaan onder
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Justitie van het Koninkrijk;'
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel1
  - number: 1.b
    text: 'meerderjarige: hij die de leeftijd van achttien jaren heeft bereikt of voordien in het huwelijk is getreden;'
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel1
  - number: 1.c
    text: 'moeder: de vrouw die het kind ter wereld heeft gebracht;'
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel1
  - number: 1.d
    text: |-
      vader: de man tot wie het kind, anders dan door adoptie, in de eerste graad in opgaande lijn in familierechtelijke
      betrekking staat;
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel1
  - number: 1.e
    text: 'vreemdeling: hij die de Nederlandse nationaliteit niet bezit; en'
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel1
  - number: 1.f
    text: 'staatloze: hij die geen nationaliteit heeft of wiens nationaliteit niet kan worden vastgesteld.'
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel1
  - number: '2'
    text: De verkrijging en het verlies van het Nederlanderschap hebben geen terugwerkende kracht.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel2
  - number: '3.1'
    text: |-
      Nederlander is het kind waarvan ten tijde van zijn geboorte de vader of de moeder Nederlander is, alsmede het kind
      van een Nederlander die voordien is overleden.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel3
  - number: '3.2'
    text: |-
      Het op het grondgebied van Nederland, onderscheidenlijk de Nederlandse Antillen of Aruba, of aan boord van een
      in Nederland, de Nederlandse Antillen of Aruba te boek gesteld zeeschip of luchtvaartuig, gevonden kind wordt
      aangemerkt als het kind van een Nederlander tenzij binnen vijf jaren, te rekenen vanaf de dag waarop het is
      gevonden, blijkt dat het kind door geboorte een vreemde nationaliteit bezit.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel3
  - number: '3.3'
    text: |-
      Nederlander is het kind van een ten tijde van zijn geboorte in Nederland, de Nederlandse Antillen of Aruba wonende
      vader of moeder die zelf geboren is uit een in één van die landen wonende moeder.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel3
  - number: '4.1'
    text: Nederlander wordt de minderjarige vreemdeling die door een Nederlander wordt erkend.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel4
  - number: '4.2'
    text: |-
      Nederlander wordt de minderjarige vreemdeling die zonder erkenning door wettiging het kind wordt van een
      Nederlander.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel4
  - number: '4.3'
    text: Het kind van degene die door erkenning of door wettiging het Nederlanderschap verkrijgt, deelt in die verkrijging.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel4
  - number: '5.1'
    text: |-
      Nederlander wordt het kind dat in Nederland, de Nederlandse Antillen of Aruba bij rechterlijke uitspraak wordt
      geadopteerd, indien de adoptief-vader of adoptief-moeder op de dag dat die uitspraak kracht van gewijsde heeft
      gekregen Nederlander is en het kind op de dag van uitspraak in eerste aanleg minderjarig was.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel5
  - number: '5.2'
    text: |-
      Nederlander wordt ook het kind dat in het buitenland bij uitspraak van een ter plaatse bevoegde autoriteit
      wordt geadopteerd in overeenstemming met het op 29 mei 1993 te 's-Gravenhage tot stand gekomen verdrag inzake de
      bescherming van kinderen en de samenwerking op het gebied van de interlandelijke adoptie, indien en op het tijdstip
      waarop aan de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel5
  - number: 5.2.a
    text: de adoptie is in overeenstemming met het voornoemde verdrag tot stand gekomen, en
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel5
  - number: 5.2.b
    text: die adoptie heeft tot gevolg dat de voordien bestaande familierechtelijke betrekkingen worden verbroken, en
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel5
  - number: 5.2.c
    text: |-
      de adoptief-vader of adoptief-moeder is Nederlander op de dag dat de uitspraak kracht van gewijsde heeft gekregen,
      en
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel5
  - number: 5.2.d
    text: het kind was op de dag van de uitspraak in eerste aanleg minderjarig.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel5
  - number: '5.3'
    text: |-
      Nederlander wordt voorts het kind dat in het buitenland in overeenstemming met het op 29 mei 1993 te 's-
      Gravenhage tot stand gekomen verdrag inzake de bescherming van kinderen en de samenwerking op het gebied van
      de interlandelijke adoptie is geadopteerd bij een adoptie die niet tot gevolg heeft dat de voordien bestaande
      familierechtelijke betrekkingen worden verbroken, welke adoptie in Nederland, de Nederlandse Antillen of Aruba bij
      rechterlijke uitspraak in overeenstemming met artikel 27 van voornoemd verdrag wordt omgezet in een adoptie naar
      Nederlands, Nederlands-Antilliaans of Arubaans recht, indien en op het tijdstip waarop aan de volgende voorwaarden
      is voldaan:
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel5
  - number: 5.3.a
    text: de adoptie is in overeenstemming met het voornoemde verdrag tot stand gekomen; en
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel5
  - number: 5.3.b
    text: |-
      de adoptief-vader of adoptief-moeder is Nederlander op de dag nadat twee maanden sinds de uitspraak houdende
      omzetting in eerste aanleg of in hoger beroep zijn verstreken zonder dat daartegen hoger beroep of beroep in
      cassatie is ingesteld, dan wel, indien beroep in cassatie is ingesteld, op de dag van de uitspraak in cassatie; en
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel5
  - number: 5.3.c
    text: het kind was op de dag van de uitspraak houdende omzetting in eerste aanleg minderjarig.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel5
  - number: '5.4'
    text: Het kind van degene die door adoptie het Nederlanderschap verkrijgt deelt in die verkrijging.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel5
  - number: '6.1'
    text: 'Door het afleggen van een daartoe strekkende verklaring verkrijgt het Nederlanderschap:'
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel6
  - number: 6.1.a
    text: |-
      de meerderjarige vreemdeling die in Nederland, onderscheidenlijk de Nederlandse Antillen of Aruba, is geboren en
      aldaar sedert zijn geboorte woonplaats of werkelijk verblijf heeft, mits hij de leeftijd van 25 jaar nog niet heeft
      bereikt;
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel6
  - number: 6.1.b
    text: |-
      degene die in Nederland, onderscheidenlijk de Nederlandse Antillen of Aruba is geboren, aldaar tenminste 3
      jaren woonplaats of werkelijk verblijf heeft en sedert zijn geboorte staatloos is, mits hij de leeftijd van
      25 jaar nog niet heeft bereikt. Voor een minderjarige moet de verklaring worden afgelegd door zijn wettelijke
      vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel6
  - number: '6.2'
    text: |-
      Voor de toepassing van het in de aanhef en onder *b* bepaalde wordt geboorte aan boord van een in Nederland, de
      Nederlandse Antillen of Aruba te boek gesteld zeeschip of luchtvaartuig gelijk gesteld met geboorte in Nederland,
      onderscheidenlijk de Nederlandse Antillen of Aruba.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel6
  - number: '7.1'
    text: |-
      Met inachtneming van de bepalingen van dit Hoofdstuk verlenen Wij op voordracht van Onze Minister het
      Nederlanderschap aan vreemdelingen die daarom verzoeken.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel7
  - number: '7.2'
    text: |-
      Ten aanzien van hen die woonachtig zijn in de Nederlandse Antillen, onderscheidenlijk Aruba, adviseert Onze
      Minister van Justitie van de Nederlandse Antillen, onderscheidenlijk Onze Minister van Justitie van Aruba, omtrent
      het verzoek.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel7
  - number: '8.1'
    text: |-
      Voor verlening van het Nederlanderschap overeenkomstig [artikel 7][ref1] komen slechts in aanmerking verzoekers:


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel7
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '7'
        hoofdstuk: '4'
  - number: 8.1.a
    text: die meerderjarig zijn;
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel8
  - number: 8.1.b
    text: |-
      tegen wier verblijf voor onbepaalde tijd in Nederland, onderscheidenlijk de Nederlandse Antillen of Aruba, geen
      bedenkingen bestaan;
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel8
  - number: 8.1.c
    text: |-
      die tenminste vijf jaren onmiddellijk voorafgaande aan het verzoek in Nederland, onderscheidenlijk de Nederlandse
      Antillen of Aruba, woonplaats of werkelijk verblijf hebben gehad; en
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel8
  - number: 8.1.d
    text: |-
      die in de Nederlandse, onderscheidenlijk Nederlands-Antilliaanse of Arubaanse, samenleving als ingeburgerd kunnen
      worden beschouwd op grond van het feit dat zij beschikken over een redelijke kennis van de Nederlandse taal, dan
      wel - indien zij in de Nederlandse Antillen of Aruba wonen - de taal die op het eiland van inwoning naast het
      Nederlands gangbaar is, en zij zich ook overigens in de Nederlandse, onderscheidenlijk Nederlands-Antilliaanse of
      Arubaanse, samenleving hebben doen opnemen.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel8
  - number: '8.2'
    text: |-
      Het in het eerste lid, onder *c* bepaalde geldt niet met betrekking tot een verzoeker die hetzij te eniger tijd het
      Nederlanderschap of de staat van Nederlands onderdaan-niet-Nederlander heeft bezeten, hetzij sedert tenminste drie
      jaren de echtgenoot is van een Nederlander, hetzij tijdens zijn meerderjarigheid door erkenning of wettiging het
      kind is geworden van een Nederlander, dan wel in Nederland, de Nederlandse Antillen of Aruba is geadopteerd door
      ouders van wie in elk geval één het Nederlanderschap bezit.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel8
  - number: '8.3'
    text: |-
      De in het eerste lid, onder *c*, genoemde termijn wordt op twee jaren gesteld voor degenen die in totaal ten minste
      tien jaren in Nederland, onderscheidenlijk de Nederlandse Antillen of Aruba, hebben gewoond.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel8
  - number: '8.4'
    text: |-
      De in het eerste lid, onder *c*, genoemde termijn wordt op drie jaren gesteld voor ongehuwden die ten minste drie
      jaren met een ongehuwde Nederlander in een duurzame relatie anders dan het huwelijk samenleven.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel8
  - number: '9.1'
    text: |-
      Een verzoek van een vreemdeling die voldoet aan de bepalingen van de beide voorgaande artikelen wordt niettemin
      afgewezen, indien
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel9
  - number: 9.1.a
    text: |-
      op grond van het gedrag van de verzoeker ernstige vermoedens bestaan dat hij gevaar oplevert voor de openbare orde,
      de goede zeden, de volksgezondheid, of de veiligheid van het Koninkrijk; of
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel9
  - number: 9.1.b
    text: |-
      de verzoeker die een andere nationaliteit bezit, niet het mogelijke heeft gedaan om die nationaliteit te
      verliezen, dan wel niet bereid is het mogelijke te zullen doen om, na de totstandkoming van de naturalisatie, die
      nationaliteit te verliezen, tenzij dit redelijkerwijs niet kan worden verlangd;
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel9
  - number: 9.1.c
    text: |-
      de verzoeker, op wie één van de uitzonderingen van [artikel 8, tweede lid][ref1], van toepassing is, woont in het
      land waarvan hij onderdaan is.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel8
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '8'
        hoofdstuk: '4'
  - number: '9.2'
    text: |-
      Indien de verzoeker het Nederlanderschap heeft verloren ingevolge [artikel 16, eerste lid][ref1], kan het verzoek
      op de in het voorgaande lid onder *a* omschreven grond alleen worden afgewezen, indien hij binnen een periode
      van 10 jaren voorafgaande aan het verzoek veroordeeld is wegens een strafbaar feit tegen de veiligheid van het
      Koninkrijk of is veroordeeld tot een gevangenisstraf van tenminste 5 jaren wegens een ander strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel16
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '16'
        hoofdstuk: '5'
  - number: '9.3'
    text: |-
      Op het verzoek wordt binnen één jaar na indiening van het verzoek beslist. De beslissing kan ten hoogste tweemaal
      zes maanden worden aangehouden.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel9
  - number: '9.4'
    text: |-
      Beslissingen tot afwijzing of aanhouding van verzoeken tot verkrijging van het Nederlanderschap kunnen door Onze
      Minister worden genomen.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel9
  - number: '10'
    text: |-
      Wij kunnen, de Raad van State van het Koninkrijk gehoord, in bijzondere gevallen het Nederlanderschap
      verlenen met afwijking van het bepaalde in [artikel 8, eerste lid, aanhef en onder ][ref1], en
      [artikel 9, eerste lid, aanhef en onder ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel9
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '8'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '9'
        hoofdstuk: '4'
  - number: '11.1'
    text: |-
      Het minderjarige niet-Nederlandse kind van een vader of moeder aan wie het Nederlanderschap is verleend
      deelt in deze verkrijging, tenzij te zijnen aanzien in het besluit een voorbehoud is gemaakt. De wettelijke
      vertegenwoordiger en het kind, mits het de leeftijd van 12 jaar heeft bereikt, worden in de gelegenheid gesteld hun
      zienswijze omtrent de mede-naturalisatie naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel11
  - number: '11.2'
    text: |-
      Voor de toepassing van het bepaalde in het eerste lid wordt onder vader mede verstaan de adoptief-vader, onder
      moeder mede de adoptief-moeder, indien de adoptie tot stand is gekomen in overeenstemming met de regelen van
      Nederlands internationaal privaatrecht en het kind door die adoptie de staat van wettig kind van de adoptanten
      heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel11
  - number: '12.1'
    text: |-
      Indien de verzoeker geen geslachtsnaam of voornaam heeft of indien de juiste spelling daarvan niet vaststaat,
      zullen deze in overleg met hem worden vastgesteld bij het besluit waarbij het Nederlanderschap wordt verleend.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel12
  - number: '12.2'
    text: |-
      De naam van de verzoeker wordt zonodig in de in het Koninkrijk gebruikelijke lettertekens overgebracht en kan,
      indien dit voor de inburgering van belang is, met toestemming van de verzoeker bij het besluit tot verlening van
      het Nederlanderschap worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel12
  - number: '13'
    text: |-
      Bij algemene maatregel van rijksbestuur worden regelen gesteld betreffende het voor de verlening van het
      Nederlanderschap verschuldigde recht, de gevallen waarin daarvan geheel of gedeeltelijk ontheffing kan worden
      verleend en de wijze waarop het moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel13
  - number: '14.1'
    text: |-
      Behalve door het vervallen van de familierechtelijke betrekking waaraan het Nederlanderschap wordt ontleend
      ingevolge een van de bepalingen van de [artikelen 3][ref1], [4][ref2] en [5][ref3] wordt het Nederlanderschap
      niet verloren dan krachtens een van de bepalingen van de [artikelen 15][ref4] en [16][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003738#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0003738#Artikel16
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0003738
        artikel: '5'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0003738
        artikel: '15'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0003738
        artikel: '16'
        hoofdstuk: '5'
  - number: '14.2'
    text: |-
      Geen verlies van het Nederlanderschap uit welken hoofde ook heeft plaats indien staatloosheid daarvan het gevolg
      zou zijn.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel14
  - number: '15'
    text: 'Het Nederlanderschap gaat voor een meerderjarige verloren:'
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel15
  - number: 15.a
    text: door het vrijwillig verkrijgen van een andere nationaliteit;
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel15
  - number: 15.b
    text: door het afleggen van een verklaring van afstand;
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel15
  - number: 15.c
    text: |-
      wanneer de betrokkene na zijn meerderjarigheid gedurende een ononderbroken periode van 10 jaren woonplaats buiten
      Nederland, de Nederlandse Antillen of Aruba heeft in het land waarin hij is geboren en waarvan hij eveneens de
      nationaliteit bezit, anders dan in een dienstverband met Nederland, de Nederlandse Antillen of Aruba dan wel een
      internationaal orgaan waarin het Koninkrijk is vertegenwoordigd, of als echtgenoot van een persoon met een zodanig
      dienstverband;
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel15
  - number: 15.d
    text: |-
      door intrekking van het besluit waarbij het Nederlanderschap is verleend, welke kan plaatsvinden, indien
      de betrokkene heeft nagelaten na de totstandkoming van zijn naturalisatie al het mogelijke te doen om zijn
      oorspronkelijke nationaliteit te verliezen.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel15
  - number: '16.1'
    text: 'Het Nederlanderschap gaat voor een minderjarige verloren:'
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel16
  - number: 16.1.a
    text: |-
      door erkenning, wettiging of adoptie door een vreemdeling, indien hij diens nationaliteit daardoor verkrijgt, of
      deze reeds bezit;
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel16
  - number: 16.1.b
    text: |-
      indien zijn vader of moeder vrijwillig een andere nationaliteit verkrijgt en hij in die verkrijging deelt of deze
      nationaliteit reeds bezit;
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel16
  - number: 16.1.c
    text: |-
      indien zijn vader of moeder het Nederlanderschap verliest ingevolge [artikel 15, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel15
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '15'
        hoofdstuk: '5'
  - number: 16.1.d
    text: indien hij zelfstandig dezelfde nationaliteit verkrijgt als zijn vader of moeder.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel16
  - number: '16.2'
    text: Het verlies van het Nederlanderschap treedt niet in, indien en zolang de andere ouder het Nederlanderschap bezit.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel16
  - number: '17.1'
    text: |-
      Een ieder die, buiten een bij enige in een der delen van het Koninkrijk gevestigde rechterlijke instantie of een
      in administratief beroep aanhangige zaak, daarbij onmiddellijk belang heeft, kan bij de rechtbank te ’s-Gravenhage
      of, indien hij in de Nederlandse Antillen of Aruba woonachtig is, bij het Gemeenschappelijk Hof van Justitie van de
      Nederlandse Antillen en Aruba een verzoek indienen tot vaststelling van zijn Nederlanderschap of tot vaststelling
      dat hij het Nederlanderschap niet bezit. Het verzoek kan ook strekken tot de vaststelling dat de betrokkene op een
      bepaald tijdstip het Nederlanderschap al dan niet bezat.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel17
  - number: '17.2'
    text: Een verzoek als in het vorige lid bedoeld kan ook ten aanzien van een overledene worden gedaan.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel17
  - number: '18.1'
    text: |-
      Omtrent verzoeken als bedoeld in het vorige artikel hoort de rechtbank, onderscheidenlijk het Hof van Justitie, het
      openbaar ministerie. Voor Nederland zijn de [artikelen 429][ref1][429][ref2] en [429][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel429d
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel429f
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel429s
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 429d
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 429f
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 429s
  - number: '18.2'
    text: Voor de belanghebbenden staat van de beschikking uitsluitend beroep in cassatie open.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel18
  - number: '19'
    text: |-
      Aan een onherroepelijk geworden beschikking, gegeven met toepassing van [artikel 17][ref1], is elk met de
      uitvoering van enige wettelijke regeling belast orgaan gebonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel17
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '17'
        hoofdstuk: '6'
  - number: '20.1'
    text: |-
      Indien in enige voor een rechterlijke instantie in Nederland, onderscheidenlijk de Nederlandse Antillen of Aruba,
      aanhangige zaak onzeker is of een bij de zaak belanghebbende al dan niet het Nederlanderschap bezit of op een
      vroeger tijdstip bezat, kan de rechter terzake het advies van Onze Minister, onderscheidenlijk van Onze Minister
      van Justitie van de Nederlandse Antillen, onderscheidenlijk Onze Minister van Justitie van Aruba, vragen.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel20
  - number: '20.2'
    text: |-
      Indien in enig administratief beroep in Nederland, onderscheidenlijk de Nederlandse Antillen en Aruba, ingesteld
      een in het vorige lid bedoelde onzekerheid bestaat, houdt die instantie de behandeling van de zaak aan en vraagt
      zij terzake het advies van Onze Minister, onderscheidenlijk van Onze Minister van Justitie van de Nederlandse
      Antillen, onderscheidenlijk Onze Minister van Justitie van Aruba.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel20
  - number: '20.3'
    text: De behandeling van de zaak wordt terstond hervat zodra het in de vorige leden bedoelde advies is ontvangen.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel20
  - number: '21'
    text: 'Tot het in ontvangst nemen van verklaringen tot verkrijging en van afstand van het Nederlanderschap zijn bevoegd:'
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel21
  - number: 21.a
    text: 'in Nederland: de burgemeesters;'
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel21
  - number: 21.b
    text: 'in de Nederlandse Antillen: de door Onze Minister van Justitie van de Nederlandse Antillen aangewezen ambtenaren;'
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel21
  - number: 21.c
    text: 'in Aruba: de door Onze Minister van Justitie van Aruba aangewezen ambtenaren.'
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel21
  - number: 21.d
    text: 'in het buitenland: de Nederlandse diplomatieke en consulaire ambtenaren.'
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel21
  - number: '22.1'
    text: 'Onze Minister houdt een openbaar register van:'
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel22
  - number: 22.1.a
    text: de verklaringen tot verkrijging en afstand van het Nederlanderschap;
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel22
  - number: 22.1.b
    text: de verlening van het Nederlanderschap;
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel22
  - number: 22.1.c
    text: |-
      de intrekkingen, bedoeld in [artikel 15, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel15
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '15'
        hoofdstuk: '5'
  - number: '22.2'
    text: |-
      Onze Ministers van Justitie van de Nederlandse Antillen en van Aruba houden een openbaar register van de in het
      eerste lid bedoelde akten welke betrekking hebben op personen die in hun land woonachtig zijn.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel22
  - number: '23'
    text: Wij kunnen bij algemene maatregel van rijksbestuur nadere regelen stellen ter uitvoering van deze Rijkswet.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel23
  - number: '24.1'
    text: |-
      Deze Rijkswet kan worden aangehaald als "Rijkswet op het Nederlanderschap". Zij treedt in werking op een door Ons
      te bepalen tijdstip. Wij kunnen een ander tijdstip vaststellen waarop [hoofdstuk 6][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003738
        hoofdstuk: '6'
  - number: '24.2'
    text: De wet van 12 december 1892, *Stb.* 268, op het Nederlanderschap en het ingezetenschap, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel24
  - number: '25'
    text: |-
      Nederlanders in de zin van deze Rijkswet zijn mede zij, die bij haar inwerkingtreding het Nederlanderschap
      bezitten.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel25
  - number: '26'
    text: |-
      De in [artikel 15, onder ][ref1], genoemde termijn vangt ten aanzien van Nederlanders die op het tijdstip van
      inwerkingtreding van deze Rijkswet woonplaats buiten het Koninkrijk hebben, aan op dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel15
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '15'
        hoofdstuk: '5'
  - number: '27.1'
    text: |-
      [Artikel 3 van deze Rijkswet][ref1] is alleen van toepassing op kinderen geboren na de inwerkingtreding van deze
      Rijkswet.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel3
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '3'
        hoofdstuk: '2'
  - number: '27.2'
    text: |-
      Het niet-Nederlandse kind - daaronder begrepen het in Nederland, de Nederlandse Antillen of Aruba geadopteerde kind
        - van een vrouw die Nederlander is of - indien zij is overleden - ten tijde van het overlijden Nederlander was,
      verkrijgt, indien het op het tijdstip van inwerkingtreding van deze Rijkswet de leeftijd van 21 jaar nog niet heeft
      bereikt en niet gehuwd of gehuwd geweest is, het Nederlanderschap door het afleggen van een daartoe strekkende
      verklaring. Voor hen die de leeftijd van 18 jaar nog niet hebben bereikt moet de verklaring worden afgelegd door de
      moeder of - indien deze is overleden - door de wettelijke vertegenwoordiger. Deze verklaring moet worden afgelegd
      binnen drie jaar na de inwerkingtreding van deze Rijkswet.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel27
  - number: '28'
    text: |-
      De vrouw die het Nederlanderschap heeft verloren door of in verband met haar vóór de inwerkingtreding van deze
      Rijkswet gesloten huwelijk, verkrijgt het Nederlanderschap door het afleggen van een daartoe strekkende verklaring,
      welke moet worden afgelegd binnen een jaar na de ontbinding van dat huwelijk of binnen een jaar nadat zij van die
      ontbinding heeft kunnen kennis nemen. Deze verkrijging werkt terug tot de datum van ontbinding van het huwelijk.
    url: https://wetten.overheid.nl/BWBR0003738/1998-10-01#Artikel28
