  - number: '5'
    text: |-
      1 Als personen als bedoeld in [artikel 10, eerste lid, van het besluit][ref1] worden aangewezen personen die een
      van de volgende werkzaamheden uitvoeren: analyse van bouwstoffen, analyse voor milieuhygiënisch bodemonderzoek,
      onderdeel milieukundige verificatie van milieukundige begeleiding, monsterneming bij partijkeuringen en veldwerk.

      2 Als instellingen als bedoeld in [artikel 10, tweede lid, van het besluit][ref2] worden aangewezen instellingen
      die een van de volgende werkzaamheden uitvoeren: inspectie van vloeistofdichte voorzieningen, certificering van
      rechtspersonen en afgeven van kwaliteitsverklaringen.

      3 Ten aanzien van het eerste en tweede lid is [artikel 2, tweede lid][ref3], van overeenkomstige toepassing.


