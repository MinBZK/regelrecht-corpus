      1 Als werkzaamheden als bedoeld in [artikel 2, tweede lid, van het besluit][ref1] worden aangewezen:

      a. monsterneming bij partijkeuringen;

      b. milieukundige begeleiding, en

      c. veldwerk.

      2 Ten aanzien van het eerste lid is [artikel 2, tweede lid][ref2], van overeenkomstige toepassing.


