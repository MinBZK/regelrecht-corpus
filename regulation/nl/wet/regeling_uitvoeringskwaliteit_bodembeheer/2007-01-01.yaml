  - number: '7'
    text: |-
      1 Als een deskundig, onafhankelijk instituut als bedoeld in
      [artikel 1, eerste lid, onderdeel t, van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1]
      wordt aangewezen een instelling die is erkend voor het afgeven van kwaliteitsverklaringen.

      2 Als een instantie als bedoeld in [artikel 5, tweede lid][ref2], [artikel 9, eerste, vierde en elfde lid][ref3],
      en [artikel 22, eerste en vierde lid, van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref4]
      wordt aangewezen een persoon of instelling die is erkend voor analyse van bouwstoffen of monsterneming bij
      partijkeuringen.


