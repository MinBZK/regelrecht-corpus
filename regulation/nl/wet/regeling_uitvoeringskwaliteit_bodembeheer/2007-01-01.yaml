articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. aanleg van bodembeschermende voorzieningen: aanleg van bodembeschermende voorzieningen, zoals gedefinieerd en
      nader bepaald in de normdocumenten die bij [categorie 1 in bijlage 1][ref1] zijn aangewezen;

      b. afgeven van kwaliteitsverklaringen: afgeven van kwaliteitsverklaringen voor bouwstoffen op grond van een door de
      Harmonisatie Commissie Bouw aanvaarde BRL die bij [categorie 2 in bijlage 1][ref2] is aangewezen;

      c. analyse van bouwstoffen: analytische werkzaamheden van bouwstoffen die verricht worden door een laboratorium
      zoals gedefinieerd en nader bepaald in de normdocumenten die bij [categorie 3 in bijlage 1][ref3] zijn aangewezen;

      d. analyse voor milieuhygiënisch bodemonderzoek: analytische werkzaamheden die verricht worden door een
      laboratorium bij een verkennend onderzoek, een oriënterend onderzoek, een nader onderzoek, een saneringsonderzoek
      of een ander vergelijkbaar onderzoek van de bodem, waaronder mede begrepen de bodem onder oppervlaktewater, zoals
      gedefinieerd en nader bepaald in de normdocumenten die bij [categorie 4 in bijlage 1][ref4] zijn aangewezen;

      e. besluit: [Besluit uitvoeringskwaliteit bodembeheer][ref5];

      f. bewerking van verontreinigde grond of baggerspecie: procesmatige ex situ reiniging van verontreinigde
      grond of baggerspecie door middel van thermische, extractieve of biologische methoden, of zandscheiding,
      rijping of landfarming van baggerspecie, zoals gedefinieerd en nader bepaald in de normdocumenten die bij
      [categorie 5 in bijlage 1][ref6] zijn aangewezen;

      g. bijlage: bij deze regeling behorende bijlage;

      h. Bodem+: onderdeel van het agentschap SenterNovem te Den Haag;

      i. BRL: beoordelingsrichtlijn, een door het betrokken College van Deskundigen bindend verklaard document dat wordt
      gehanteerd als grondslag voor de afgifte en instandhouding van certificaten;

      j. certificering van rechtspersonen: certificering van rechtspersonen zoals gedefinieerd en nader bepaald in de
      normdocumenten die bij [categorie 6 in bijlage 1][ref7] zijn aangewezen;

      k. College van Deskundigen: door de Raad voor Accreditatie geaccepteerd college dat een of meer BRL’en onder beheer
      heeft en waarin de bij certificatie belanghebbende partijen zijn vertegenwoordigd;

      l. inspectie van vloeistofdichte voorzieningen: periodieke inspectie van vloeistofdichte voorzieningen zoals
      gedefinieerd en nader bepaald in de normdocumenten die bij [categorie 7 in bijlage 1][ref8] zijn aangewezen;

      m. milieukundige begeleiding: milieukundige processturing of milieukundige verificatie bij saneringen van de bodem,
      waaronder mede begrepen de bodem onder oppervlaktewater, zoals gedefinieerd en nader bepaald in de normdocumenten
      die bij [categorie 8 in bijlage 1][ref9] zijn aangewezen;

      n. monsterneming bij partijkeuringen: monsterneming van grond, niet-vormgegeven
      bouwstoffen of vormgegeven bouwstoffen voor partijkeuringen in het kader van het
      [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref10] zoals gedefinieerd en nader bepaald in de
      normdocumenten die bij [categorie 9 in bijlage 1][ref11] zijn aangewezen;

      o. uitvoering van bodemsaneringen: uitvoering van een sanering van de bodem, waaronder mede de bodem
      onder oppervlaktewateren wordt begrepen, zoals gedefinieerd en nader bepaald in de normdocumenten die bij
      [categorie 10 in bijlage 1][ref12] zijn aangewezen;

      p. veldwerk: plaatsen van boringen en peilbuizen ten behoeve van het nemen van grondwatermonsters of grondmonsters
      of locatie-inspectie en monsterneming van asbest in bodem zoals gedefinieerd en nader bepaald in de normdocumenten
      die bij [categorie 11 in bijlage 1][ref13] zijn aangewezen.


