  - number: '2'
    text: |-
      1 Als werkzaamheden als bedoeld in [artikel 1, onderdeel k, van het besluit][ref1] worden aangewezen:

      a. aanleg van bodembeschermende voorzieningen;

      b. afgeven van kwaliteitsverklaringen;

      c. analyse van bouwstoffen;

      d. analyse voor milieuhygiënisch bodemonderzoek;

      e. bewerking van verontreinigde grond of baggerspecie;

      f. certificering van rechtspersonen;

      g. inspectie van vloeistofdichte voorzieningen;

      h. milieukundige begeleiding;

      i. monsterneming bij partijkeuringen;

      j. uitvoering van bodemsaneringen;

      k. veldwerk.

      2 Het eerste lid is alleen van toepassing voorzover de in dat lid genoemde werkzaamheden worden uitgevoerd:

      a. ter verkrijging van een beschikking die op grond van een bij of krachtens een in
      [artikel 14, tweede lid, van het besluit][ref2] genoemd wettelijk voorschrift wordt gegeven;

      b. ter voldoening aan een bij of krachtens [artikel 15, tweede lid, van het besluit][ref3] geldende verplichting,
      of

      c. ter voldoening aan een wettelijk voorschrift voorzover bij of krachtens dat voorschrift is bepaald dat de
      werkzaamheid wordt uitgevoerd door een persoon of instelling die op grond van het [besluit][ref4] daartoe is
      erkend.

      3 Een erkenning geldt alleen voor de verrichtingen die vallen onder de reikwijdte van de normdocumenten als bedoeld
      in [artikel 4][ref5], waarvoor de desbetreffende persoon of instelling is gecertificeerd of geaccrediteerd en die
      staan vermeld op de erkenning.

      4 De erkenning voor de werkzaamheden, bedoeld in het eerste lid, onderdeel a, e, h, i en j wordt gebaseerd op
      een certificaat. De erkenning voor de werkzaamheden, bedoeld in het eerste lid, onderdeel b, c, d, f en g wordt
      gebaseerd op een accreditatie. De erkenning voor de werkzaamheid, bedoeld in het eerste lid, onderdeel i en k, kan
      zowel op een certificaat als een accreditatie worden gebaseerd.

      5 Een erkenning voor de werkzaamheid, bedoeld in het eerste lid, onderdeel c, wordt alleen verleend indien de
      desbetreffende instelling is geaccrediteerd voor alle verrichtingen van een van de pakketten als bedoeld in de
      onderdelen genoemd bij [categorie 3 in bijlage 1][ref6]. Indien de aanvraag betrekking heeft op het onderdeel
      samenstelling grond of het onderdeel samenstelling bouwstoffen dan kan de erkenning alleen worden verleend indien
      de instelling is geaccrediteerd voor pakket SG1, onderscheidenlijk pakket SB1. In afwijking van de eerste volzin
      is het, met uitzondering van de verrichtingen die betrekking hebben op uitloogonderzoek, toegestaan één verrichting
      van een pakket uit te besteden aan een instelling die voor die verrichting beschikt over een erkenning.


