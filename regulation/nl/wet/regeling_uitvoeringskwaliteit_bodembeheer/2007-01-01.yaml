  - number: '8'
    text: |-
      1 Tot en met 31 december 2006 geldt een vrijstelling van het verbod van
      [artikel 8, eerste lid, van het besluit][ref1] voor aanleg van bodembeschermende voorzieningen en inspectie van
      vloeistofdichte voorzieningen.

      2 Tot en met 30 juni 2007 geldt een vrijstelling van het verbod van [artikel 8, eerste lid, van het besluit][ref2]
      voor analyse voor milieuhygiënisch bodemonderzoek, bewerking van verontreinigde grond of baggerspecie,
      milieukundige begeleiding, uitvoering van bodemsaneringen en veldwerk.

      3 Tot en met 30 juni 2007 geldt een vrijstelling van het verbod van [artikel 8, eerste lid, van het besluit][ref3]
      voor monsterneming bij partijkeuringen indien de persoon of instelling, die deze
      werkzaamheid verricht, beschikt over een geldige aanwijzing als monsternemer op grond van het
      [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref4], die vóór 1 oktober 2006 is verleend.

      4 Tot en met 31 december 2007 geldt een vrijstelling van het verbod van
      [artikel 8, eerste lid, van het besluit][ref5] voor afgeven van kwaliteitsverklaringen indien
      de instelling, die deze werkzaamheid verricht, beschikt over een geldige aanwijzing als
      certificeringsinstelling voor het afgeven van kwaliteitsverklaringen voor bouwstoffen op grond van het
      [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref6], die vóór 1 oktober 2006 is verleend.

      5 Tot en met 31 december 2007 geldt een vrijstelling van het verbod van
      [artikel 8, eerste lid, van het besluit][ref7] voor analyse van bouwstoffen indien de persoon of instelling,
      die deze werkzaamheid verricht, beschikt over een geldige aanwijzing als laboratorium op grond van het
      [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref8], die vóór 1 oktober 2006 is verleend.

      6 [Artikel 5 van het besluit][ref9] is niet van toepassing op de aanwijzingen, bedoeld in het derde, vierde en
      vijfde lid.


