  - number: '6'
    text: |-
      1 De aanvraag voor een erkenning, het verzoek tot wijziging van een erkenning, een melding van een door de
      rechtbank uitgesproken faillissement of surseance van betaling en een melding van een schorsing of intrekking
      van een certificaat of een accreditatie, bedoeld in [artikel 3][ref1], [artikel 5, eerste lid][ref2],
      [artikel 12][ref3] en [artikel 13 van het besluit][ref4] wordt gedaan aan Bodem+ met de daartoe door de Ministers
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Verkeer en Waterstaat vastgestelde formulieren
      die als [bijlage 2][ref5] bij deze regeling zijn opgenomen. De formulieren zijn verkrijgbaar bij Bodem+. Zij kunnen
      tevens worden gedownload van de volgende website: http://www.senternovem.nl/Bodemplus.

      2 Als website waarop de lijsten met erkende personen en instellingen, bedoeld in
      [artikel 2, vierde lid, van het besluit][ref6] worden gepubliceerd wordt aangewezen: http://www.senternovem.nl/
      Bodemplus.


