  - number: '6.2'
    text: |-
      Als website waarop de lijsten met erkende personen en instellingen, bedoeld in
      [artikel 2, vierde lid, van het besluit][ref1] worden gepubliceerd wordt aangewezen: http://www.senternovem.nl/
      Bodemplus.


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel2
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '2'
  - number: '7.1'
    text: |-
      Als een deskundig, onafhankelijk instituut als bedoeld in
      [artikel 1, eerste lid, onderdeel t, van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1]
      wordt aangewezen een instelling die is erkend voor het afgeven van kwaliteitsverklaringen.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel1
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '1'
  - number: '7.2'
    text: |-
      Als een instantie als bedoeld in [artikel 5, tweede lid][ref1], [artikel 9, eerste, vierde en elfde lid][ref2],
      en [artikel 22, eerste en vierde lid, van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref3]
      wordt aangewezen een persoon of instelling die is erkend voor analyse van bouwstoffen of monsterneming bij
      partijkeuringen.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007667#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0007667#Artikel22
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007667
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0007667
        artikel: '22'
  - number: '8.1'
    text: |-
      Tot en met 31 december 2006 geldt een vrijstelling van het verbod van [artikel 8, eerste lid, van het besluit][ref1]
      voor aanleg van bodembeschermende voorzieningen en inspectie van vloeistofdichte voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel8
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '8'
  - number: '8.2'
    text: |-
      Tot en met 30 juni 2007 geldt een vrijstelling van het verbod van [artikel 8, eerste lid, van het besluit][ref1]
      voor analyse voor milieuhygiënisch bodemonderzoek, bewerking van verontreinigde grond of baggerspecie,
      milieukundige begeleiding, uitvoering van bodemsaneringen en veldwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel8
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '8'
  - number: '8.3'
    text: |-
      Tot en met 30 juni 2007 geldt een vrijstelling van het verbod van [artikel 8, eerste lid, van het besluit][ref1]
      voor monsterneming bij partijkeuringen indien de persoon of instelling, die deze
      werkzaamheid verricht, beschikt over een geldige aanwijzing als monsternemer op grond van het
      [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref2], die vóór 1 oktober 2006 is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007667
  - number: '8.4'
    text: |-
      Tot en met 31 december 2007 geldt een vrijstelling van het verbod van [artikel 8, eerste lid, van het besluit][ref1]
      voor afgeven van kwaliteitsverklaringen indien de instelling, die deze werkzaamheid verricht, beschikt over een
      geldige aanwijzing als certificeringsinstelling voor het afgeven van kwaliteitsverklaringen voor bouwstoffen
      op grond van het [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref2], die vóór 1 oktober 2006 is
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007667
  - number: '8.5'
    text: |-
      Tot en met 31 december 2007 geldt een vrijstelling van het verbod van
      [artikel 8, eerste lid, van het besluit][ref1] voor analyse van bouwstoffen indien de persoon of instelling,
      die deze werkzaamheid verricht, beschikt over een geldige aanwijzing als laboratorium op grond van het
      [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref2], die vóór 1 oktober 2006 is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007667
  - number: '8.6'
    text: |-
      [Artikel 5 van het besluit][ref1] is niet van toepassing op de aanwijzingen, bedoeld in het derde, vierde en vijfde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel5
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '5'
  - number: '8.7'
    text: |-
      Tot en met 31 december 2007 geldt een vrijstelling van het verbod van
      [artikel 8, eerste lid, van het besluit][ref1] voor verwijderen, onklaar maken en installeren ondergrondse tanks en
      voorzieningen ondergrondse tanks beoordelen en keuren.


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel8
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '8'
  - number: '8.8'
    text: |-
      Tot en met 31 december 2007 geldt een vrijstelling van het verbod van
      [artikel 8, eerste lid, van het besluit][ref1] voor analyse voor milieuhygiënisch bodemonderzoek, voor zover dat
      bestaat uit laboratoriumanalyses voor grondwateronderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel8
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '8'
  - number: '8.9'
    text: |-
      Tot en met 30 juni 2008 geldt een vrijstelling van het verbod van [artikel 8, eerste lid, van het besluit][ref1]
      voor milieukundige begeleiding, voor zover dat bestaat uit milieukundige begeleiding van nazorg.


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel8
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '8'
  - number: '8.10'
    text: |-
      Tot en met 31 december 2008 geldt een vrijstelling van het verbod van
      [artikel 8, eerste lid, van het besluit][ref1] voor bewerking van verontreinigde grond of baggerspecie, voor zover
      dat bestaat uit het ontwateren van baggerspecie.


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel8
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '8'
  - number: 8a
    text: |-
      Tot uiterlijk zes maanden na afloop van de in
      [artikel 8, eerste en tweede lid en zevende tot en met tiende lid][ref1], genoemde data geldt een vrijstelling
      van de verboden van [artikel 8, eerste en tweede lid, van het besluit][ref2] voor de in die leden genoemde
      werkzaamheden, die zijn aangevangen op een tijdstip dat is gelegen vóór de in die leden genoemde data.


      [ref1]: https://wetten.overheid.nl/BWBR0020345#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0019963#Artikel8
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0020345
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0019963
        artikel: '8'
  - number: '9'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het [Besluit uitvoeringskwaliteit bodembeheer][ref1] in
      werking treedt, met uitzondering van [artikel 3][ref2] dat in werking treedt met ingang van 1 juli 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0019963
      [ref2]: https://wetten.overheid.nl/BWBR0020345#Artikel3
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel9
