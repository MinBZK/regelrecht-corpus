---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_uitvoeringskwaliteit_bodembeheer
regulatory_layer: WET
publication_date: '2007-12-20'
valid_from: '2007-07-01'
bwb_id: BWBR0020345
url: https://wetten.overheid.nl/BWBR0020345/2007-07-01
preamble:
  text: |-
    Gelet op artikel 11.2, zesde lid, van de Wet milieubeheer, de artikelen 1, onderdeel d, 2, tweede en vierde
    lid, 3, 4, vierde lid,5, tweede lid, 8, tweede lid, 10, eerste en tweede lid, 12, 13 en 18 van het Besluit
    uitvoeringskwaliteit bodembeheer alsmede de artikelen 1, eerste lid, onderdeel t, 5, tweede lid, 9, eerste, vierde
    en elfde lid, en 22, eerste en vierde lid, van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
  - number: 1.a
    text: |-
      aanleg van bodembeschermende voorzieningen: aanleg van bodembeschermende voorzieningen, zoals gedefinieerd en nader
      bepaald in de normdocumenten die bij [categorie 1 in bijlage 1][ref1] zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020345
  - number: 1.b
    text: |-
      afgeven van kwaliteitsverklaringen: afgeven van kwaliteitsverklaringen voor bouwstoffen op grond van een door de
      Harmonisatie Commissie Bouw aanvaarde BRL die bij [categorie 2 in bijlage 1][ref1] is aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020345
  - number: 1.c
    text: |-
      analyse van bouwstoffen: analytische werkzaamheden van bouwstoffen die verricht worden door een laboratorium zoals
      gedefinieerd en nader bepaald in de normdocumenten die bij [categorie 3 in bijlage 1][ref1] zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020345
  - number: 1.d
    text: |-
      analyse voor milieuhygiënisch bodemonderzoek: analytische werkzaamheden die verricht worden door een laboratorium
      bij een verkennend onderzoek, een oriënterend onderzoek, een nader onderzoek, een saneringsonderzoek of een ander
      vergelijkbaar onderzoek van de bodem, waaronder mede begrepen de bodem onder oppervlaktewater, zoals gedefinieerd
      en nader bepaald in de normdocumenten die bij [categorie 4 in bijlage 1][ref1] zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020345
  - number: 1.e
    text: |-
      besluit: [Besluit uitvoeringskwaliteit bodembeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019963
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019963
  - number: 1.f
    text: |-
      bewerking van verontreinigde grond of baggerspecie: procesmatige ex situ reiniging van verontreinigde
      grond of baggerspecie door middel van thermische, extractieve of biologische methoden, of zandscheiding,
      rijping of landfarming van baggerspecie, zoals gedefinieerd en nader bepaald in de normdocumenten die bij
      [categorie 5 in bijlage 1][ref1] zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020345
  - number: 1.g
    text: 'bijlage: bij deze regeling behorende bijlage;'
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
  - number: 1.h
    text: 'Bodem+: onderdeel van het agentschap SenterNovem te Den Haag;'
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
  - number: 1.i
    text: |-
      BRL: beoordelingsrichtlijn, een door het betrokken College van Deskundigen bindend verklaard document dat wordt
      gehanteerd als grondslag voor de afgifte en instandhouding van certificaten;
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
  - number: 1.j
    text: |-
      certificering van rechtspersonen: certificering van rechtspersonen zoals gedefinieerd en nader bepaald in de
      normdocumenten die bij [categorie 6 in bijlage 1][ref1] zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020345
  - number: 1.k
    text: |-
      College van Deskundigen: door de Raad voor Accreditatie geaccepteerd college dat een of meer BRL’en onder beheer
      heeft en waarin de bij certificatie belanghebbende partijen zijn vertegenwoordigd;
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
  - number: 1.l
    text: |-
      inspectie van vloeistofdichte voorzieningen: periodieke inspectie van vloeistofdichte voorzieningen zoals
      gedefinieerd en nader bepaald in de normdocumenten die bij [categorie 7 in bijlage 1][ref1] zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020345
  - number: 1.m
    text: |-
      milieukundige begeleiding: milieukundige processturing of milieukundige verificatie bij saneringen van de bodem,
      waaronder mede begrepen de bodem onder oppervlaktewater, zoals gedefinieerd en nader bepaald in de normdocumenten
      die bij [categorie 8 in bijlage 1][ref1] zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020345
  - number: 1.n
    text: |-
      monsterneming bij partijkeuringen: monsterneming van grond, niet-vormgegeven bouwstoffen of vormgegeven bouwstoffen
      voor partijkeuringen in het kader van het [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1] zoals
      gedefinieerd en nader bepaald in de normdocumenten die bij [categorie 9 in bijlage 1][ref2] zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0007667
      [ref2]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007667
      - id: ref2
        bwb_id: BWBR0020345
  - number: 1.o
    text: |-
      uitvoering van bodemsaneringen: uitvoering van een sanering van de bodem, waaronder mede de bodem onder
      oppervlaktewateren wordt begrepen, zoals gedefinieerd en nader bepaald in de normdocumenten die bij
      [categorie 10 in bijlage 1][ref1] zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020345
  - number: 1.p
    text: |-
      veldwerk: plaatsen van boringen en peilbuizen ten behoeve van het nemen van grondwatermonsters of grondmonsters of
      locatie-inspectie en monsterneming van asbest in bodem zoals gedefinieerd en nader bepaald in de normdocumenten die
      bij [categorie 11 in bijlage 1][ref1] zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020345
  - number: '1.q:'
    text: |-
      verwijderen, onklaar maken en installeren ondergrondse tanks: verwijderen, onklaar maken of installeren van
      ondergrondse tanks, zoals beschreven in de normdocumenten die bij categorie 12 in [bijlage 1][ref1] zijn
      aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020345
  - number: '1.r:'
    text: |-
      voorzieningen ondergrondse tanks beoordelen en keuren: beoordelen en keuren van ondergrondse tanks en de daarbij
      behorende voorzieningen, zoals beschreven in de normdocumenten die bij categorie 13 in [bijlage 1][ref1] zijn
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020345
  - number: '2.1'
    text: |-
      Als werkzaamheden als bedoeld in [artikel 1, onderdeel k, van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel1
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '1'
  - number: 2.1.a
    text: aanleg van bodembeschermende voorzieningen;
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
  - number: 2.1.b
    text: afgeven van kwaliteitsverklaringen;
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
  - number: 2.1.c
    text: analyse van bouwstoffen;
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
  - number: 2.1.d
    text: analyse voor milieuhygiënisch bodemonderzoek;
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
  - number: 2.1.e
    text: |-
      bewerking van verontreinigde grond of baggerspecie, met uitzondering van een bewerking die uitsluitend bestaat uit
      het ontwateren van baggerspecie waarvoor op grond van [artikel 8.1 van de Wet milieubeheer][ref1] geen vergunning
      is vereist;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 2.1.f
    text: certificering van rechtspersonen;
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
  - number: 2.1.g
    text: inspectie van vloeistofdichte voorzieningen;
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
  - number: 2.1.h
    text: milieukundige begeleiding;
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
  - number: 2.1.i
    text: monsterneming bij partijkeuringen;
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
  - number: 2.1.j
    text: uitvoering van bodemsaneringen;
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
  - number: 2.1.k
    text: veldwerk;
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
  - number: 2.1.l
    text: verwijderen, onklaar maken en installeren ondergrondse tanks;
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
  - number: 2.1.m
    text: voorzieningen ondergrondse tanks beoordelen en keuren.
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
  - number: '2.2'
    text: 'Het eerste lid is alleen van toepassing voorzover de in dat lid genoemde werkzaamheden worden uitgevoerd:'
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
  - number: 2.2.a
    text: |-
      ter verkrijging van een beschikking die op grond van een bij of krachtens een in
      [artikel 14, tweede lid, van het besluit][ref1] genoemd wettelijk voorschrift wordt gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel14
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '14'
  - number: 2.2.b
    text: |-
      ter voldoening aan een bij of krachtens [artikel 15, tweede lid, van het besluit][ref1] geldende verplichting, of


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel15
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '15'
  - number: 2.2.c
    text: |-
      ter voldoening aan een wettelijk voorschrift voorzover bij of krachtens dat voorschrift is bepaald dat de
      werkzaamheid wordt uitgevoerd door een persoon of instelling die op grond van het [besluit][ref1] daartoe is
      erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0019963
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019963
  - number: '2.3'
    text: |-
      Een erkenning geldt alleen voor de verrichtingen die vallen onder de reikwijdte van de normdocumenten als bedoeld
      in [artikel 4][ref1], waarvoor de desbetreffende persoon of instelling is gecertificeerd of geaccrediteerd en die
      staan vermeld op de erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0020345#Artikel4
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020345
        artikel: '4'
  - number: '2.4'
    text: |-
      De erkenning voor de werkzaamheden, bedoeld in het eerste lid, onderdeel a, e, h, j, en l wordt gebaseerd op een
      certificaat. De erkenning voor de werkzaamheden, bedoeld in het eerste lid, onderdeel b, c, d, f, g en m wordt
      gebaseerd op een accreditatie. De erkenning voor de werkzaamheid, bedoeld in het eerste lid, onderdeel i en k, kan
      zowel op een certificaat als een accreditatie worden gebaseerd.
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
  - number: '2.5'
    text: |-
      Een erkenning voor de werkzaamheid, bedoeld in het eerste lid, onderdeel c, wordt alleen verleend indien de
      desbetreffende instelling is geaccrediteerd voor alle verrichtingen van een van de pakketten als bedoeld in de
      onderdelen genoemd bij categorie 3 in [bijlage 1][ref1]. Indien de aanvraag betrekking heeft op het onderdeel
      samenstelling grond of het onderdeel samenstelling bouwstoffen dan kan de erkenning alleen worden verleend indien
      de instelling is geaccrediteerd voor pakket SG1, onderscheidenlijk pakket SB1. In afwijking van de eerste volzin
      is het, met uitzondering van de verrichtingen die betrekking hebben op uitloogonderzoek, toegestaan één verrichting
      van een pakket uit te besteden aan een instelling die voor die verrichting beschikt over een erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020345
  - number: '2.6'
    text: |-
      Een erkenning voor de werkzaamheid, bedoeld in het eerste lid, onderdeel d, wordt alleen verleend indien de
      desbetreffende instelling is geaccrediteerd voor alle verrichtingen van het onderdeel SIKB-protocol 3010 of SIKB-
      protocol 3110, zoals vermeld bij categorie 4 in [bijlage 1][ref1]. Het is toegestaan één verrichting van een SIKB-
      protocol uit te besteden aan een instelling die voor die verrichting beschikt over een erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020345
  - number: '2.7'
    text: |-
      Voor zover een erkenning voor de werkzaamheid, bedoeld in het eerste lid, onderdeel k, wordt gebaseerd op een
      accreditatie, wordt deze erkenning alleen verleend indien de desbetreffende instelling is geaccrediteerd voor
      alle verrichtingen van het onderdeel SIKB-protocol 2001 of SIKB-protocol 2002, zoals vermeld bij categorie 11
      in [bijlage 1][ref1]. Het is toegestaan ten hoogste drie verrichtingen (NEN normen) van een SIKB-protocol uit te
      besteden aan een instelling die voor die verrichting beschikt over een erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020345
  - number: '3.1'
    text: |-
      Als werkzaamheden als bedoeld in [artikel 2, tweede lid, van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel2
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '2'
  - number: 3.1.a
    text: monsterneming bij partijkeuringen;
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel3
  - number: 3.1.b
    text: milieukundige begeleiding, en
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel3
  - number: 3.1.c
    text: veldwerk.
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel3
  - number: '3.2'
    text: |-
      Ten aanzien van het eerste lid is [artikel 2, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020345#Artikel2
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020345
        artikel: '2'
  - number: '4'
    text: |-
      Als normdocumenten als bedoeld in [artikel 18, van het besluit][ref1] worden aangewezen de certificatierichtlijnen,
      accreditatierichtlijnen, protocollen en andere onderdelen, die bij de betrokken categorie van werkzaamheden in
      [bijlage 1][ref2] zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0020345
  - number: '5.1'
    text: |-
      Als personen als bedoeld in [artikel 10, eerste lid, van het besluit][ref1] worden aangewezen personen die een
      van de volgende werkzaamheden uitvoeren: analyse van bouwstoffen, analyse voor milieuhygiënisch bodemonderzoek,
      onderdeel milieukundige verificatie van milieukundige begeleiding, monsterneming bij partijkeuringen en veldwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel10
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '10'
  - number: '5.2'
    text: |-
      Als instellingen als bedoeld in [artikel 10, tweede lid, van het besluit][ref1] worden aangewezen instellingen
      die een van de volgende werkzaamheden uitvoeren: inspectie van bodembeschermende voorzieningen, certificering van
      rechtspersonen, afgeven van kwaliteitsverklaringen en voorzieningen ondergrondse tanks beoordelen en keuren.


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel10
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '10'
  - number: '5.3'
    text: |-
      Ten aanzien van het eerste en tweede lid is [artikel 2, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020345#Artikel2
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020345
        artikel: '2'
  - number: '6.1'
    text: |-
      De aanvraag voor een erkenning, het verzoek tot wijziging van een erkenning, een melding van een door de rechtbank
      uitgesproken faillissement of surseance van betaling en een melding van een schorsing of intrekking van een
      certificaat of een accreditatie, bedoeld in [artikel 3][ref1], [artikel 5, eerste lid][ref2], [artikel 12][ref3] en
      [artikel 13 van het besluit][ref4] wordt gedaan aan Bodem+ met de daartoe door de Ministers van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer en van Verkeer en Waterstaat vastgestelde formulieren die als
      [bijlage 2][ref5] bij deze regeling zijn opgenomen. De formulieren zijn verkrijgbaar bij Bodem+. Zij kunnen tevens
      worden gedownload van de volgende website: http://www.senternovem.nl/Bodemplus.


      [ref1]: https://wetten.overheid.nl/BWBR0019963#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019963#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0019963#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0019963#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0020345
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019963
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0019963
        artikel: '5'
      - id: ref3
