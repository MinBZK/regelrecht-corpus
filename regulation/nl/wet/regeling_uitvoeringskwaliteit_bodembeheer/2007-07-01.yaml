        bwb_id: BWBR0020345
        artikel: '3'
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Regeling uitvoeringskwaliteit bodembeheer.'
    url: https://wetten.overheid.nl/BWBR0020345/2007-07-01#Artikel10
