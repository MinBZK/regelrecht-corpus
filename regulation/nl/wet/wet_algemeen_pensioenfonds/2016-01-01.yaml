preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een algemeen pensioenfonds in te voeren;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037452/2016-01-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit vast te stellen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld. In dat besluit wordt zo nodig
      toepassing gegeven aan [artikel 12 van de Wet raadgevend referendum][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel12
    url: https://wetten.overheid.nl/BWBR0037452/2016-01-01#ArtikelIV
