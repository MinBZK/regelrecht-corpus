valid_from: '2005-06-01'
bwb_id: BWBR0018262
url: https://wetten.overheid.nl/BWBR0018262/2005-06-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels vast te stellen inzake een recht op langdurend
    zorgverlof;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018262/2005-06-01#ArtikelAanhef
articles:
  - number: V
    text: Vervallen.
    url: https://wetten.overheid.nl/BWBR0018262/2005-06-01#ArtikelV
  - number: IX
    text: |-
      Indien de termijn voor het instellen van hoger beroep tegen een uitspraak van de rechtbank inzake een besluit op
      grond van [hoofdstuk 7 van de Wet arbeid en zorg](onbekend) nog niet is verstreken op de dag voor inwerkingtreding
      van deze wet, blijft ten aanzien van de mogelijkheid om hoger beroep in te stellen het recht zoals dat gold vóór
      dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0018262/2005-06-01#ArtikelIX
  - number: IXa
    text: |-
      [Hoofdstuk 7 van de Wet arbeid en zorg](onbekend), zoals dit hoofdstuk luidde op de dag voor inwerkingtreding van
      deze wet, blijft van toepassing voor de duur van de periode waarin recht bestaat op een financiële tegemoetkoming
      ingevolge dat hoofdstuk, indien dat recht is ingegaan voor de dag van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0018262/2005-06-01#ArtikelIXa
  - number: X
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0018262/2005-06-01#ArtikelX
