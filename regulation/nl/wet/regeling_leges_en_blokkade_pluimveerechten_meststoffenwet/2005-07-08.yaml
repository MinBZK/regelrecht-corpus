  - number: '8'
    text: |-
      1 Een kennisgeving wordt eerst in behandeling genomen nadat degene naar wiens bedrijf het pluimveerecht, of een
      gedeelte daarvan, moet overgaan een bedrag van € 181,51 heeft voldaan aan de Dienst Regelingen.

      2 Indien de Dienst Regelingen op grond van [artikel 58r, eerste lid, van de wet][ref1] niet tot registratie
      overgaat, wordt het bedrag, bedoeld in het eerste lid, aan de betaler gerestitueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58r
