  - number: '6'
    text: |-
      Indien een hypotheekhouder een bedrijf overeenkomstig
      [artikel 2 van de Regeling blokkade verplaatsing mestproductie][ref1] of
      [artikel 5 van de Regeling leges en blokkade Wet herstructurering varkenshouderij][ref2] heeft aangemeld, dan geldt
      deze aanmelding tevens als aanmelding als bedoeld in [artikel 2][ref3], tenzij de hypotheekhouder binnen negentig
      dagen na inwerkingtreding van de wet door middel van een daartoe vastgesteld formulier aan de Dienst Regelingen
      verklaart niet in aanmerking te willen komen voor overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006343#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009801#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0012009#Artikel2
    url: https://wetten.overheid.nl/BWBR0012009/2005-07-08#Artikel6
