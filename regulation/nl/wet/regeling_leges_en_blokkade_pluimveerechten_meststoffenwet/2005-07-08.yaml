preamble:
  text: |-
    Gelet op artikel 58u, tweede en derde lid, van de Meststoffenwet voorzover het betreft paragraaf 2 van deze
    regeling, en artikel 58v, eerste lid, van de Meststoffenwet voorzover het betreft paragraaf 3 van deze regeling;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012009/2005-07-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *wet:*


              [Meststoffenwet][ref1];



            b

              *minister:*


              Minister van Landbouw, Natuur en Voedselkwaliteit;



            c

              *kennisgeving:*


              kennisgeving van de overgang van een pluimveerecht, of een gedeelte daarvan, als bedoeld in
      [artikel 58q, eerste lid, van de wet][ref2];



            d

              *hypotheekhouder:*


              degene ten gunste van wie een recht van hypotheek is gevestigd op een registergoed behorende tot een
      bedrijf waarvoor een pluimveerecht geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58q
    url: https://wetten.overheid.nl/BWBR0012009/2005-07-08#Artikel1
    references:
