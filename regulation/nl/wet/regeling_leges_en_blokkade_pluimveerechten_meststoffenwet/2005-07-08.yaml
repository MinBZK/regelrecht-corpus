  - number: '3'
    text: |-
      1 De aanmelding, bedoeld in [artikel 2, eerste lid][ref1], geschiedt door indiening bij de Dienst Regelingen van
      een daartoe bestemd, door de Dienst Regelingen op verzoek van de hypotheekhouder ter beschikking gesteld formulier,
      dat overeenkomstig de op het formulier aangegeven wijze volledig en naar waarheid is ingevuld en door zowel de
      hypotheekhouder als degene wiens bedrijf wordt aangemeld is ondertekend.

      2 Indien het recht van hypotheek, op grond waarvan de aanmelding plaatsvond, is tenietgegaan, doet degene ten
      gunste van wie dit hypotheekrecht was gevestigd daarvan onverwijld mededeling aan de Dienst Regelingen. De
      betreffende aanmelding vervalt zodra deze mededeling door de Dienst Regelingen is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0012009#Artikel2
    url: https://wetten.overheid.nl/BWBR0012009/2005-07-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012009
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      1 Indien het formulier, bedoeld in [artikel 3, eerste lid][ref1], niet is medeondertekend door degene
      op wiens bedrijf de aanmelding betrekking heeft, is onverminderd het tweede lid, [artikel 2][ref2]
      slechts van toepassing indien de hypotheekhouder bij de aanmelding tevens een uittreksel van het in
      [artikel 260, eerste lid, van boek 3 van het Burgerlijk Wetboek][ref3] bedoelde openbare register overlegt, waaruit
      blijkt op welk registergoed, of in voorkomend geval op welke registergoederen een hypotheekrecht is gevestigd.

      2 De Dienst Regelingen doet van de aanmelding, bedoeld in het eerste lid, schriftelijk mededeling aan degene op
      wiens bedrijf de aanmelding betrekking heeft. Indien deze binnen dertig dagen na dagtekening van deze mededeling
      aan de Dienst Regelingen verklaart dat de gegevens vermeld in de aanmelding niet juist zijn, geldt in plaats van
      [artikel 2][ref4] het in de volgende leden bepaalde.

      3 De Dienst Regelingen neemt een kennisgeving, gedaan door degene op wiens bedrijf de aanmelding betrekking heeft,
      niet in behandeling zolang de hypotheekhouder de aanmelding niet intrekt, doch hoogstens gedurende negentig dagen
      na dagtekening van de schriftelijke mededeling, bedoeld in het tweede lid.

      4 De termijn, bedoeld in het derde lid, wordt eenmalig met negentig dagen verlengd indien de hypotheekhouder
      daartoe binnen de eerstgenoemde termijn een verzoek doet bij de Dienst Regelingen, onder gelijktijdige overlegging
      van een rechterlijke uitspraak of een verklaring van een notaris als bedoeld in [artikel 2, derde lid][ref5].

      5 De aanmelding vervalt definitief na afloop van de in het derde, dan wel in voorkomend geval in het vierde lid
      bedoelde termijn.

      6 Ter zake van het bedrijf waarop de aanmelding, bedoeld in dit artikel, betrekking heeft, wordt door de
      Dienst Regelingen geen nieuwe aanmelding van dit bedrijf door dezelfde hypotheekhouder aanvaard, tenzij deze is
      medeondertekend door degene op wiens bedrijf de aanmelding betrekking heeft. Deze medeondertekende aanmelding geldt
      tevens als intrekking van de niet-medeondertekende aanmelding, indien deze aanmelding nog niet is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0012009#Artikel3
