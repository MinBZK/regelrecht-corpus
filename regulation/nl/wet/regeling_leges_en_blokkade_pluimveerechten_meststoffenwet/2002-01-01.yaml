  - number: '8'
    text: >-
      1 Een kennisgeving wordt eerst in behandeling genomen nadat degene naar wiens bedrijf het pluimveerecht, of een
      gedeelte daarvan, moet overgaan een bedrag van € 181,51 heeft voldaan aan het Bureau Heffingen.


      2 Indien het Bureau Heffingen op grond van artikel 58r, eerste lid, van de wet niet tot registratie overgaat, wordt
      het bedrag, bedoeld in het eerste lid, aan de betaler gerestitueerd.
    url: https://wetten.overheid.nl/BWBR0012009/2002-01-01#Artikel8
  - number: '9'
    text: |-
      1 Een aanmelding als bedoeld in [artikel 2, eerste lid][ref1], en 4, eerste lid, wordt eerst in aanmerking genomen
      nadat de hypotheekhouder een bedrag van € 27,23 heeft voldaan aan het Bureau Heffingen.

      2 Het bedrag, bedoeld in het eerste lid, geldt per aanmelding en per bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0012009#Artikel2
