        artikel: '2'
        paragraaf: '2'
  - number: '7'
    text: |-
      1 De verzoeken, bedoeld in de [artikelen 2, tweede en derde lid][ref1], de verklaring, bedoeld in
      [artikel 2, vijfde lid][ref2], de mededeling, bedoeld in [artikel 3, tweede lid][ref3], de verklaring, bedoeld
      in [artikel 4, tweede lid][ref4], de intrekking, bedoeld in [artikel 4, derde lid][ref5], het verzoek, bedoeld in
      [artikel 4, vierde lid][ref6], het verzoek, bedoeld in [artikel 5, tweede lid][ref7], en de verklaring, bedoeld
      in [artikel 8][ref8], worden gedaan door indiening bij het Bureau Heffingen van een daartoe bestemd, door het
      Bureau Heffingen op verzoek van de hypotheekhouder ter beschikking gesteld formulier, dat overeenkomstig de op het
      formulier aangewezen wijze volledig en naar waarheid is ingevuld en ondertekend.

      2 De formulieren, bedoeld in het eerste lid, worden eerst in aanmerking genomen vanaf het moment dat zij door het
      Bureau Heffingen zijn ontvangen.


