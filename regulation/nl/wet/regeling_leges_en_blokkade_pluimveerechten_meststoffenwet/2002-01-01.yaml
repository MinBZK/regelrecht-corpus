        bwb_id: BWBR0004054
        artikel: 58q
  - number: '2'
    text: |-
      1 Alvorens het Bureau Heffingen een kennisgeving in behandeling neemt, doet het van deze kennisgeving schriftelijk
      mededeling aan iedere hypotheekhouder die het bedrijf waarvandaan het pluimveerecht, of een gedeelte daarvan,
      overgaat, heeft aangemeld overeenkomstig [artikel 3][ref1]. Het Bureau Heffingen neemt de kennisgeving niet in
      behandeling gedurende dertig dagen na dagtekening van deze mededeling.

      2 De termijn van dertig dagen wordt verlengd tot negentig dagen na dagtekening van de mededeling, indien een
      hypotheekhouder binnen de termijn van dertig dagen een verzoek daartoe bij het Bureau Heffingen indient.

      3 De termijn van negentig dagen wordt eenmalig met negentig dagen verlengd indien de hypotheekhouder die het in het
      tweede lid bedoelde verzoek heeft gedaan, een verzoek daartoe bij het Bureau Heffingen indient onder gelijktijdige
      overlegging van:

      - een rechterlijke uitspraak waaruit blijkt dat degene op wiens bedrijf de aanmelding betrekking heeft, de
      desbetreffende overgang geen doorgang kan laten vinden, of
      - een schriftelijke verklaring van een notaris, waarin deze stelt dat hij van de hypotheekhouder op grond van
      artikel 268, eerste lid, van boek 3 van het Burgerlijk Wetboek de opdracht heeft ontvangen om het desbetreffende
      registergoed, of in voorkomend geval de desbetreffende registergoederen in het openbaar te verkopen.

      4 Na afloop van de overeenkomstig het derde lid verlengde termijn wordt de kennisgeving onherroepelijk door het
      Bureau Heffingen in behandeling genomen.

      5 In afwijking van het eerste lid, onderscheidenlijk het tweede tot en met het vierde lid, wordt de kennisgeving
      door het Bureau Heffingen in behandeling genomen voordat de termijn van dertig dagen, onderscheidenlijk
      de verlengde termijn is ver-streken, zodra het van elke hypotheekhouder die het bedrijf heeft aangemeld,
      onderscheidenlijk elke hypotheekhouder die om verlenging van de desbetreffende termijn heeft verzocht, een
      verklaring heeft ontvangen waaruit blijkt dat tegen inbehandelingneming geen bezwaar bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0012009#Artikel3
    url: https://wetten.overheid.nl/BWBR0012009/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012009
        artikel: '3'
        paragraaf: '2'
  - number: '3'
    text: |-
      1 De aanmelding, bedoeld in [artikel 2, eerste lid][ref1], geschiedt door indiening bij het Bureau Heffingen van
      een daartoe bestemd, door het Bureau Heffingen op verzoek van de hypotheekhouder ter beschikking gesteld formulier,
      dat overeenkomstig de op het formulier aangegeven wijze volledig en naar waarheid is ingevuld en door zowel de
      hypotheekhouder als degene wiens bedrijf wordt aangemeld is ondertekend.

      2 Indien het recht van hypotheek, op grond waarvan de aanmelding plaatsvond, is tenietgegaan, doet degene ten
      gunste van wie dit hypotheekrecht was gevestigd daarvan onverwijld mededeling aan het Bureau Heffingen. De
      betreffende aanmelding vervalt zodra deze mededeling door het Bureau Heffingen is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0012009#Artikel2
    url: https://wetten.overheid.nl/BWBR0012009/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012009
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      1 Indien het formulier, bedoeld in [artikel 3, eerste lid][ref1], niet is medeondertekend door degene op wiens
      bedrijf de aanmelding betrekking heeft, is onverminderd het tweede lid, [artikel 2][ref2] slechts van toepassing
      indien de hypotheekhouder bij de aanmelding tevens een uittreksel van het in artikel 260, eerste lid, van boek
      3 van het Burgerlijk Wetboek bedoelde openbare register overlegt, waaruit blijkt op welk registergoed, of in
      voorkomend geval op welke registergoederen een hypotheekrecht is gevestigd.

      2 Het Bureau Heffingen doet van de aanmelding, bedoeld in het eerste lid, schriftelijk mededeling aan degene op
      wiens bedrijf de aanmelding betrekking heeft. Indien deze binnen dertig dagen na dagtekening van deze mededeling
      aan het Bureau Heffingen verklaart dat de gegevens vermeld in de aanmelding niet juist zijn, geldt in plaats van
      [artikel 2][ref3] het in de volgende leden bepaalde.

      3 Het Bureau Heffingen neemt een kennisgeving, gedaan door degene op wiens bedrijf de aanmelding betrekking heeft,
      niet in behandeling zolang de hypotheekhouder de aanmelding niet intrekt, doch hoogstens gedurende negentig dagen
      na dagtekening van de schriftelijke mededeling, bedoeld in het tweede lid.

      4 De termijn, bedoeld in het derde lid, wordt eenmalig met negentig dagen verlengd indien de hypotheekhouder
      daartoe binnen de eerstgenoemde termijn een verzoek doet bij het Bureau Heffingen, onder gelijktijdige overlegging
      van een rechterlijke uitspraak of een verklaring van een notaris als bedoeld in [artikel 2, derde lid][ref4].

      5 De aanmelding vervalt definitief na afloop van de in het derde, dan wel in voorkomend geval in het vierde lid
      bedoelde termijn.

      6 Ter zake van het bedrijf waarop de aanmelding, bedoeld in dit artikel, betrekking heeft, wordt door het
      Bureau Heffingen geen nieuwe aanmelding van dit bedrijf door dezelfde hypotheekhouder aanvaard, tenzij deze is
      medeondertekend door degene op wiens bedrijf de aanmelding betrekking heeft. Deze medeondertekende aanmelding geldt
      tevens als intrekking van de niet-medeondertekende aanmelding, indien deze aanmelding nog niet is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0012009#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012009#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012009#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0012009#Artikel2
