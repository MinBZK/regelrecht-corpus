  - number: '2.5'
    text: |-
      De subsidie voor een gebiedsgericht project, niet zijnde een gebiedsgericht innovatieproject, bedraagt 50 procent
      van de subsidiabele kosten, met dien verstande dat van die subsidiabele kosten eerst worden afgetrokken de aan
      het gebiedsgericht project toe te rekenen opbrengsten, de eigen bijdrage van de aanvrager, de bijdragen van derden
      en de subsidies van de andere bestuursorganen en de Commissie van de Europese Gemeenschappen, waarbij onder de
      bijdragen van derden en de subsidies van andere bestuursorganen niet die van publieke cofinanciers worden verstaan.
    url: https://wetten.overheid.nl/BWBR0024884/2010-07-07#Artikel2.5
  - number: '2.6'
    text: |-
      1 In afwijking van de [Regeling steunintensiteit][ref1] bedraagt de subsidie voor een gebiedsgericht
      innovatieproject:

      a. 25 procent van de subsidiabele kosten, voor zover deze betrekking hebben op industrieel onderzoek;

      b. 12,5 procent van de subsidiabele kosten, voor zover deze betrekking hebben op experimentele ontwikkeling;

      c. de helft van het op grond van de [Regeling steunintensiteit][ref2] toegestane maximale percentage van de
      subsidiabele kosten of toegestane maximale bedrag, voor zover deze geen betrekking hebben op fundamenteel
      onderzoek, industrieel onderzoek of experimentele ontwikkeling.

      2 De in het eerste lid, onderdeel a en b, bedoelde percentages worden verhoogd met 5 procentpunten, indien de
      subsidie wordt verstrekt aan een MKB-ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0026689
      [ref2]: https://wetten.overheid.nl/BWBR0026689
    url: https://wetten.overheid.nl/BWBR0024884/2010-07-07#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0026689
      - id: ref2
        bwb_id: BWBR0026689
  - number: '2.7'
    text: |-
      1 Een bijdrage van een gemeente, provincie of openbaar lichaam wordt aangemerkt als publieke cofinanciering.

      2 Indien het bedrag van de subsidie wordt berekend op grond van [artikel 2.5][ref1] is
      [artikel 6, eerste lid, van het Kaderbesluit EZ-subsidies][ref2] niet van toepassing.

      3 Indien het bedrag van de subsidie wordt berekend op grond van [artikel 2.6][ref3] wordt in afwijking van
      [artikel 6, eerste lid, van het Kaderbesluit EZ-subsidies][ref4] voor de cumulatie van subsidies de bijdrage van
      een publieke cofinancier niet aangemerkt als subsidie verstrekt door een bestuursorgaan.


