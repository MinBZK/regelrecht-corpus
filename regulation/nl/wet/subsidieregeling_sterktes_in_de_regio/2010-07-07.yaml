  - number: '3.6'
    text: |-
      1 In afwijking van [artikel 11, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] komen voor
      subsidie in aanmerking de volgende kosten, voor zover zij geactiveerd zijn op de fiscale balans,
      de taxatiewaarde niet te boven gaan en, tenzij het betreft duurzame bedrijfsuitrusting die
      door de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer met toepassing van
      [artikel 3.31, tweede lid, van de Wet op de inkomstenbelasting 2001][ref2] is aangewezen, niet binnen twee jaar
      worden afgeschreven:

      a. wat betreft grond:

      1°. de koopsom en overdrachtskosten exclusief de overdrachtsbelasting, of

      2°. de gekapitaliseerde erfpachtcanon inclusief de kosten van vestiging van de erfpacht, indien de grond van een
      gemeente of enig ander van overheidswege opgericht lichaam in erfpacht is verkregen;

      b. wat betreft bedrijfsgebouwen en de daartoe te rekenen centrale voorzieningen:

      1°. de koopsom en de overdrachtskosten of de aan derden verschuldigde bouwkosten, exclusief de financieringskosten
      en de overdrachtsbelasting;

      2°. de voortbrengingskosten;

      3°. in geval van huurkoop of financial lease de aanschafwaarde dan wel, indien deze niet kan worden bepaald, de
      contante waarde van de in totaal verschuldigde lease-termijnen inclusief kosten, verdisconteerd op jaarbasis tegen
      het door de Europese Commissie vastgestelde percentage dat geldt op het moment van subsidieverlening;

      c. wat betreft duurzame bedrijfsuitrusting:

      1°. de koopsom;

      2°. de voortbrengingskosten;

      3°. in geval van huurkoop of financial lease de aanschafwaarde dan wel, indien deze niet kan worden bepaald, de
      contante waarde van de in totaal verschuldigde lease-termijnen inclusief kosten, verdisconteerd op jaarbasis tegen
      het door de Europese Commissie vastgestelde percentage dat geldt op het moment van subsidieverlening.

      2 Onder voortbrengingskosten als bedoeld in het eerste lid, onder b, 2°, en c, 2°, worden de volgende kosten
      verstaan:

      a. loonkosten, met dien verstande dat wordt uitgegaan van een uurloon berekend op basis van het bruto jaarloon
      bij een volledige dienstbetrekking volgens de kolommen 3, 4 en 13 van de loonstaat van het betrokken directe
      personeel, exclusief volledig winstafhankelijke uitkeringen, verhoogd met de wettelijke dan wel de op grond van een
      individuele of collectieve arbeidsovereenkomst verschuldigde opslagen voor sociale lasten, en van 1650 productieve
      uren per jaar;

      b. kosten van verbruikte materialen en hulpmiddelen, gebaseerd op historische aanschafprijzen en

      c. een opslag voor algemene kosten, groot 20 procent van de onder a bedoelde loonkosten.

      3 [Artikel 10, derde en zevende lid, van het Kaderbesluit EZ-subsidies][ref3] is niet van toepassing.


