    text: |-
      1 In afwijking van de [artikelen 50 tot en met 52 van het Kaderbesluit EZ-subsidies][ref1] dienen een
      gemeente, provincie of openbaar lichaam, waaraan niet als deelnemer in een samenwerkingsverband, subsidie
      is verleend, een aanvraag om subsidievaststelling in door verantwoordingsinformatie aan de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties te verstrekken, op de wijze, bedoeld in artikel 27 van het Besluit
      financiële verhoudingen 2001. In dat geval wordt een eindverslag omtrent de uitvoering en resultaten van
      het gebiedsgericht project bij de minister ingediend binnen dertien weken na het tijdstip, bedoeld in
      [artikel 50, eerste lid, van het Kaderbesluit EZ-subsidies][ref2].

      2 In afwijking van [artikel 50, tweede lid, onderdeel b, van het Kaderbesluit EZ-subsidies][ref3] verstrekt de
      subsidie-ontvanger geen accountantsverklaring, indien het gaat om een subsidie voor een gebiedsgericht project dat
      past in één van de actielijnen van het gebiedsgericht programma van het gebied Noord-Nederland en waarvoor door het
      in [artikel 2.1][ref4] als publieke cofinancier genoemde bestuur subsidie is verleend.


