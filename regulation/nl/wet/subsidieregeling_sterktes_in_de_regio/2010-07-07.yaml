        artikel: '23'
  - number: '2.11'
    text: |-
      1 De minister rangschikt de aanvragen waarop niet afwijzend is beslist en waarop [artikel 2.9, eerste lid][ref1],
      van toepassing is, hoger naarmate:

      a. het gebiedsgericht project een grotere bijdrage levert aan de verwezenlijking van een programmalijn opgenomen in
      het desbetreffende gebiedsgericht programma;

      b. het gebiedsgericht project in verhouding tot de kosten van het gebiedsgericht project een grotere bijdrage
      levert aan de verwezenlijking van een programmalijn opgenomen in het desbetreffende gebiedsgericht programma.

      2 In aanvulling op het eerste lid, rangschikt de minister voor het gebied Oost-Nederland de aanvragen zodanig dat
      een gebiedsgericht project hoger gerangschikt wordt naarmate:

      a. een gebiedsgericht project meer bijdraagt aan de samenwerking tussen ondernemers of tussen een ondernemer en een
      onderzoeksorganisatie die actief zijn in verschillende in het gebiedsgericht programma Oost-Nederland gedefinieerde
      kennisgebieden;

      b. de betrokkenheid van een ondernemer aan een gebiedsgericht project groter is, blijkend uit de eigen bijdrage of
      het aantal betrokken ondernemers;

      c. de kans op continuering van de resultaten na afloop van een gebiedsgericht project groter is;

      d. een gebiedsgericht project direct en indirect meer nieuwe economische bedrijvigheid stimuleert in de vorm van
      meer werkgelegenheid, omzet en export in het gebied Oost-Nederland.

      3 In aanvulling op het eerste lid, rangschikt de minister voor het gebied Noordvleugel Randstad, de aanvragen
      zodanig dat een gebiedsgericht project hoger gerangschikt wordt naarmate:

      a. een gebiedsgericht project meer bijdraagt aan de samenwerking tussen ondernemers, tussen onderzoeksorganisaties
      of tussen ondernemers en één of meer onderzoeksorganisaties of publieke cofinanciers in het gebied Noordvleugel
      Randstad;

      b. een gebiedsgericht project innovatiever is;

      c. een gebiedsgericht project een grotere bijdrage levert aan de internationale profilering van het gebied
      Noordvleugel Randstad;

      d. een gebiedsgericht project meer bijdraagt aan een structurele economische versterking van het gebied
      Noordvleugel Randstad;

      e. de eigen bijdrage van een ondernemer aan het gebiedsgericht project groter is.

      4 In aanvulling op het eerste lid, rangschikt de minister voor het gebied Zuidvleugel Randstad, de aanvragen
      zodanig dat een gebiedsgericht project hoger gerangschikt wordt naarmate:

      a. een gebiedsgericht project een grotere bijdrage levert aan een intensievere samenwerking tussen
      onderzoeksorganisaties, tussen ondernemers of tussen ondernemers en één of meer onderzoeksorganisaties in het
      gebied Zuidvleugel Randstad;

      b. een gebiedsgericht project meer nieuwe economische bedrijvigheid stimuleert in de vorm van meer werkgelegenheid,
      omzet en export in het gebied Zuidvleugel Randstad.

      5 In aanvulling op het eerste lid, rangschikt de minister voor het gebied Zuidwest-Nederland, de aanvragen zodanig
      dat een gebiedsgericht project hoger gerangschikt wordt naarmate:

      a. de financiële participatie van ondernemers in het gebiedsgericht project groter is;

      b. een gebiedsgericht project een grotere bijdrage levert aan een intensievere samenwerking tussen een
      onderzoeksorganisatie, een ondernemer of een publieke cofinancier;

      c. een gebiedsgericht project een grotere bijdrage levert aan de verspreiding van de met het project opgedane
      kennis en ervaring naar ondernemers, onderzoeksorganisaties, gemeenten of openbare lichamen;

      d. een gebiedsgericht project een grotere bijdrage levert aan een structurele samenwerking tussen een ondernemer,
      een onderwijs- of onderzoeksorganisatie of een publieke cofinancier in het gebied van Zuidwest-Nederland en de
      aangrenzende regio’s.

      6 In aanvulling op het eerste lid, van de subsidieregeling, rangschikt de minister voor het gebied Zuidoost-
      Nederland, de aanvragen zodanig dat een gebiedsgericht project hoger gerangschikt wordt naarmate:

      a. de kans op continuering van de resultaten na afloop van een gebiedsgericht project groter is;

      b. een gebiedsgericht project een grotere bijdrage levert aan de nationale en internationale profilering van het
      gebied Zuidoost-Nederland als toptechnologie regio;

      c. de eigen bijdrage van ondernemers aan een gebiedsgericht project groter is.

      7 Voor de rangschikking wegen de in het eerste tot en met zesde lid genoemde criteria even zwaar.


