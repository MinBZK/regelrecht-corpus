    text: |-
      Het formulier voor het indienen van een aanvraag voor:

      a. een subsidie is opgenomen in [bijlage 2.9][ref1];

      b. een subsidie voor een gebiedsgericht project dat past in één van de actielijnen van het gebiedsgericht programma
      van het gebied Noord-Nederland, is opgenomen in [bijlage 2.10][ref2];

      c. een voorschot als bedoeld in [artikel 2.13, derde tot en met zesde lid][ref3], is opgenomen in
      [bijlage 2.11][ref4];

      d. een subsidievaststelling is opgenomen in [bijlage 2.12][ref5];

      e. een vaststelling van een subsidie voor een gebiedsgericht project dat past in één van de actielijnen van het
      gebiedsgericht programma van het gebied Noord-Nederland, is opgenomen in [bijlage 2.13][ref6].


