  - number: '2.2'
    text: |-
      1 Een samenwerkingsverband dat een gebiedsgericht project uitvoert bevat ten minste één in Nederland gevestigde
      deelnemer.

      2 Een samenwerkingsverband dat een gebiedsgericht innovatieproject uitvoert bestaat uit tenminste twee ondernemers
      of tenminste een ondernemer en een onderzoeksorganisatie.
    url: https://wetten.overheid.nl/BWBR0024884/2010-07-07#Artikel2.2
  - number: '2.3'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan degene die een gebiedsgericht project, niet zijnde een
      gebiedsgericht innovatieproject, uitvoert dat past in een in een gebiedsgericht programma opgenomen actielijn. De
      subsidie kan worden verstrekt in de vorm van een krediet.

      2 In aanvulling op [artikel 3, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] is het eerste lid ook
      van toepassing op niet in Nederland gevestigde rechtspersonen of vennootschappen of hiermee gelijk te stellen
      entiteiten.

      3 De minister verstrekt op aanvraag subsidie aan een deelnemer in een samenwerkingsverband dat een gebiedsgericht
      innovatieproject uitvoert dat past in een in een gebiedsgericht programma opgenomen actielijn. De subsidie kan
      worden verstrekt in de vorm van een krediet.

      4 In aanvulling op [artikel 3, eerste lid, van het Kaderbesluit EZ-subsidies][ref2] is het derde lid ook van
      toepassing op niet in Nederland gevestigde deelnemers in een samenwerkingsverband.

      5 In afwijking van [artikel 3, vierde lid, van het Kaderbesluit EZ-subsidies][ref3], kan de minister op aanvraag
      subsidie verstrekken aan een provincie, gemeente of openbaar lichaam.

      6 Geen subsidie wordt verstrekt aan natuurlijke personen, de N.V. NOM Investerings- en ontwikkelingsmaatschappij
      voor Noord-Nederland, de Ontwikkelingsmaatschappij Oost-Nederland N.V., de N.V. Brabantse
      Ontwikkelingsmaatschappij, de Limburgs Industrie- en Ontwikkelingsfonds N.V. en Syntens.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel3
