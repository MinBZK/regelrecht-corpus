  - number: '2.12'
    text: |-
      De beschikking tot subsidieverlening kan de opschortende voorwaarde bevatten dat binnen drie maanden na de
      beschikking tot subsidieverlening een publieke cofinancier of de publieke cofinanciers gezamenlijk voor het
      betreffende gebiedsgericht project ten minste evenveel subsidie moeten hebben verleend als wordt verleend op grond
      van de beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0024884/2010-07-07#Artikel2.12
  - number: '2.13'
    text: |-
      1 De verstrekking van voorschotten door de minister bij subsidies voor gebiedsgerichte projecten passend in één
      van de actielijnen van het gebiedsgericht programma van het gebied Noord-Nederland geschiedt in afwijking van de
      [artikelen 45 tot en met 47 van het Kaderbesluit EZ-subsidies][ref1].

      2 Het bedrag aan voorschotten als bedoeld in het eerste lid, bedraagt in totaal ten hoogste 90 procent van het in
      de beschikking tot subsidieverlening genoemde maximale subsidiebedrag.

      3 De minister verstrekt het eerste voorschot op aanvraag van de subsidie-ontvanger. Dit voorschot bedraagt
      30 procent van het in de beschikking tot subsidieverlening genoemde maximale subsidiebedrag en wordt niet
      eerder verstrekt dan nadat de subsidie-ontvanger met de uitvoering van het gebiedsgericht project is begonnen,
      de subsidie-ontvanger heeft verklaard dat hij voor reeds gemaakte en betaalde kosten heeft voldaan aan de
      toepasselijke aanbestedingsregels en de subsidie-ontvanger heeft aangegeven op welke wijze hij voldoet of zal
      voldoen aan de in de beschikking tot subsidieverlening gestelde verplichtingen.

      4 De minister verstrekt het tweede voorschot op aanvraag van de subsidie-ontvanger. Dit voorschot bedraagt ten
      hoogste 30 procent van het in de beschikking tot subsidieverlening genoemde maximale subsidiebedrag en wordt niet
      eerder verstrekt dan nadat de subsidie-ontvanger 30 procent van de subsidiabele kosten heeft gemaakt en betaald.

      5 De minister verstrekt het derde voorschot op aanvraag van de subsidie-ontvanger. Dit voorschot bedraagt ten
      hoogste 20 procent van het in de beschikking tot subsidieverlening genoemde maximale subsidiebedrag en wordt niet
      eerder verstrekt dan nadat de subsidie-ontvanger 60 procent van de subsidiabele kosten heeft gemaakt en betaald.

      6 De minister verstrekt het vierde voorschot op aanvraag van de subsidie-ontvanger. Dit voorschot bedraagt ten
      hoogste 10 procent van het in de beschikking tot subsidieverlening genoemde maximale subsidiebedrag en wordt niet
      eerder verstrekt dan nadat de subsidie-ontvanger 80 procent van de subsidiabele kosten heeft gemaakt en betaald.

      7 Een aanvraag om een voorschot wordt ingediend met gebruikmaking van het formulier, bedoeld in
      [artikel 2.15, onderdeel c][ref2], en gaat vergezeld van de in dat formulier genoemde stukken.

      8 [Artikel 20 van het Kaderbesluit EZ-subsidies][ref3] is van overeenkomstige toepassing.


