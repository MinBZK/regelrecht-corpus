  - number: '3.9'
    text: |-
      De in [artikel 23, onder c, van het Kaderbesluit EZ-subsidies][ref1] bedoelde termijn bedraagt drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
