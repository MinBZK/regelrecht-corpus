  - number: '2.8'
    text: |-
      1 In aanvulling op [artikel 10 van het Kaderbesluit EZ-subsidies][ref1] komen de interne loonkosten van een
      provincie, gemeente en openbaar lichaam en de kosten van het oprichten van een privaatrechtelijke rechtspersoon
      niet voor subsidie in aanmerking.

      2 Met betrekking tot een aanvraag om subsidie voor een gebiedsgericht project dat past in één van de
      actielijnen van het gebiedsgericht programma van het gebied Noord-Nederland kan de minister, in aanvulling op
      [artikel 10][ref2] en [11 van het Kaderbesluit EZ-subsidies][ref3], op verzoek toestaan dat als kosten van een
      gebiedsgericht project in aanmerking komen:

      a. de loonkosten van het bij de uitvoering van het project direct betrokken personeel, berekend op basis van het
      brutoloon volgens de loonstaat van de betrokken medewerkers, verhoogd met de wettelijke dan wel op grond van een
      collectieve arbeidsovereenkomst verschuldigde opslagen voor sociale lasten, met dien verstande dat wordt uitgegaan
      van 1650 productieve uren per jaar uitgaande van een voltijds dienstverband;

      b. de algemene indirecte kosten die gerelateerd zijn aan de loonkosten of worden berekend op basis van de
      werkelijke kosten van de uitgevoerde actie volgens een bij de subsidieaanvraag overgelegde berekeningswijze.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel11
