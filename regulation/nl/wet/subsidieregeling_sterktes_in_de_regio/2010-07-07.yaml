  - number: '2.9'
    text: |-
      1 De minister verdeelt het subsidieplafond op volgorde van rangschikking van de aanvragen.

      2 In afwijking van het eerste lid, verdeelt de minister het subsidieplafond voor het gebied Noord-Nederland op
      volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024884/2010-07-07#Artikel2.9
  - number: '2.10'
    text: |-
      1 De minister beslist afwijzend op een aanvraag:

      a. indien de minister voor het gebiedsgericht project of een deel daarvan reeds subsidie heeft verstrekt;

      b. voor zover het gebiedsgericht innovatieproject betrekking heeft op fundamenteel onderzoek;

      c. indien het een gebiedsgericht innovatieproject betreft dat uitsluitend betrekking heeft op industrieel
      onderzoek;

      d. indien de eigen bijdrage van de aanvrager minder dan 15 procent van de subsidiabele kosten bedraagt;

      e. indien een gebiedsgericht project een combinatie betreft van een gebiedsgericht innovatieproject en een
      gebiedsgericht project, niet zijnde een gebiedsgericht innovatieproject, en zowel de activiteiten ter uitvoering
      van het gebiedsgerichte innovatieproject als de activiteiten ter uitvoering van het gebiedsgericht project,
      niet zijnde een gebiedsgericht innovatieproject, niet ten minste 25 procent van de subsidiabele kosten van het
      gebiedsgericht project bedragen;

      f. indien het gebiedsgericht project niet past binnen een actielijn;

      g. indien het gebiedsgericht project in verhouding tot de kosten van het gebiedsgericht project onvoldoende
      bijdraagt aan de verwezenlijking van een programmalijn;

      h. indien de financiële ondersteuning van het gebiedsgericht project door een publieke cofinancier naar verwachting
      onvoldoende is;

      i. indien van het gebiedsgericht project onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten
      zijn;

      j. indien de aangevraagde vorm van subsidie niet de meest geëigende vorm is;

      k. indien de subsidiabele kosten van een gebiedsgericht project dat past in één van de actielijnen van het
      gebiedsgericht programma Noordvleugel Randstad minder dan € 500.000 bedragen;

      l. indien de subsidiabele kosten van een gebiedsgericht project dat past in één van de actielijnen van het
      gebiedsgericht programma Zuidvleugel Randstad minder dan € 500.000 bedragen;

      m. indien de subsidiabele kosten van een gebiedsgericht project dat past in één van de actielijnen, met
      uitzondering van actielijn 1.1 en 4.2, van het gebiedsgericht programma Zuidoost-Nederland minder dan € 250.000
      bedragen;

      n. indien de subsidiabele kosten van een gebiedsgericht project dat past in actielijn 1.1 van het gebiedsgericht
      programma Zuidoost-Nederland minder dan € 1.000.000 bedragen;

      o. indien de subsidiabele kosten van een gebiedsgericht project dat past in één van de actielijnen van het
      gebiedsgericht programma Oost-Nederland minder dan € 250.000 bedragen;

      p. indien een gebiedsgericht project dat past in één van de actielijnen van het gebiedsgericht programma Noord-
      Nederland voldoet aan ten minste twee van de volgende afwijzingsgronden:

      1°. een gebiedsgericht project draagt onvoldoende bij aan de samenwerking tussen ondernemers,
      onderzoeksorganisaties of bestuursorganen;

      2°. een gebiedsgericht project stimuleert onvoldoende nieuwe economische bedrijvigheid in de vorm van meer
      werkgelegenheid, omzet en export in het gebied Noord-Nederland;

      3°. de eigen bijdrage van de aanvrager voor het gebiedsgericht project is onvoldoende;

      4°. een gebiedsgericht project draagt onvoldoende bij aan de vestiging of uitoefening van een activiteit van het
      cluster energie, water, sensortechnologie of agribusiness in de kernzones van het gebied Noord-Nederland zoals die
      zijn omschreven in [bijlage 2.8][ref1].

      2 De minister beslist tevens afwijzend op een aanvraag om subsidie voor zover het gevraagde subsidiebedrag hoger is
      dan € 10 000 000.

      3 De afwijzingsgrond, genoemd in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref2] is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024884
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024884/2010-07-07#Artikel2.10
