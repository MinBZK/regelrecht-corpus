  - number: '3.7'
    text: |-
      1 De in de [artikelen 3.5][ref1] en [3.6][ref2] bedoelde subsidiabele kosten worden verminderd overeenkomstig de
      volgende leden van dit artikel.

      2 Een vermindering wordt toegepast indien:

      a. de door realisering van het project verworven grond, verworven of tot stand gebrachte bedrijfsgebouwen of
      duurzame bedrijfsuitrusting op het tijdstip waarop het project is uitgevoerd zijn afgestoten of buiten gebruik
      gesteld;

      b. de realisering van het project geschiedt in een bedrijfsgebouw of door aanschaf van vaste installaties
      in de open lucht, waarin of waarmee grotendeels activiteiten worden verricht welke behoren tot dezelfde
      S.B.I.-bedrijfsgroep als minder dan één jaar voor de indiening van de aanvraag reeds geschiedde;

      c. de realisering van het project geschiedt door de verzelfstandiging van een in Nederland gevestigd bedrijf en de
      daarin verrichte activiteiten blijven behoren tot dezelfde S.B.I.-bedrijfsgroep.

      3 Een vermindering wordt voorts toegepast indien binnen een periode van één jaar vóór het indienen van de aanvraag
      tot en met de datum waarop het project is uitgevoerd aan de subsidie-ontvanger of tot hetzelfde concern als de
      subsidie-ontvanger behorende grond, bedrijfsgebouwen of duurzame bedrijfsuitrusting, welke zich in een in de
      provincies Groningen, Friesland of Drenthe gelegen gemeente of een in [bijlage 3.2][ref3] genoemde gemeente
      of deel van een gemeente bevinden en waarin of waarmee activiteiten werden verricht welke behoren tot dezelfde
      S.B.I.-bedrijfsgroep als de activiteiten welke in of met de tot het project behorende bedrijfsgebouwen en duurzame
      bedrijfsuitrusting worden verricht, worden afgestoten of buiten gebruik gesteld. Deze vermindering geldt niet voor
      afstoot of buitengebruikstelling als onderdeel van een fundamenteel wijzigingproject.

      4 De in het tweede lid, onder a, bedoelde vermindering bedraagt het gedeelte van de kosten dat kan worden
      toegerekend aan de grond, de bedrijfsgebouwen of duurzame bedrijfsuitrusting die zijn afgestoten of buiten gebruik
      gesteld.

      5 De in het tweede lid, onder b, bedoelde vermindering bedraagt het gedeelte van de kosten dat kan worden
      toegerekend aan het desbetreffende bedrijfsgebouw of de vaste installaties.

      6 De in het tweede lid, onder c, bedoelde vermindering bedraagt het gedeelte van de kosten dat kan worden
      toegerekend aan de verkrijging van het desbetreffende bedrijf.

      7 De in het derde lid bedoelde vermindering bedraagt:

      a. het gedeelte van de kosten van verkrijging van grond, dat overeenkomt met het gedeelte dat de oppervlakte die
      wordt afgestoten of buiten gebruik gesteld uitmaakt van de totale oppervlakte van de door het project verworven
      grond;

      b. het gedeelte van de kosten van verkrijging van bedrijfsgebouwen, dat overeenkomt met het gedeelte dat de inhoud
      die wordt afgestoten of buiten gebruik gesteld uitmaakt van de totale inhoud van de door het project verworven of
      tot stand gebrachte bedrijfsgebouwen;

      c. het gedeelte van de kosten van verkrijging van duurzame bedrijfsuitrusting, dat overeenkomt met het gedeelte
      dat de capaciteit die wordt afgestoten of buiten gebruik gesteld uitmaakt van de totale capaciteit van de door het
      project verworven of tot stand gebrachte duurzame bedrijfsuitrusting.

      Onder capaciteit wordt verstaan het door de duurzame bedrijfsuitrusting bepaalde, technisch maximale vermogen tot
      produceren per tijdseenheid. Indien de capaciteit vanwege het onderscheid tussen de producten niet vergelijkbaar
      is, wordt de vermindering berekend aan de hand van de verhouding tussen de kosten van verkrijging van duurzame
      bedrijfsuitrusting en de ten hoogste twee jaar voor de aanvraag om subsidie bepaalde taxatiewaarde welke ten
      grondslag ligt aan de verzekerde waarde van de op het tijdstip van het indienen van de aanvraag bij het bedrijf of
      het hoofdkantoor in gebruik zijnde duurzame bedrijfsuitrusting.


