  - number: '3.10'
    text: |-
      De minister beslist afwijzend op een aanvraag:

      a. indien de subsidiabele kosten van het project minder dan € 4 500 000 bedragen;

      b. in geval van een project als bedoeld in [artikel 3.2, eerste lid, onder b of c, of tweede lid, a of b][ref1],
      indien de subsidiabele kosten minder dan € 13 500 000, € 45 000 000 onderscheidenlijk € 13 500 000 bedragen;

      c. indien ter zake van het project waarop de aanvraag betrekking heeft reeds subsidie is verstrekt vanwege een
      provincie met gebruikmaking van een door het Rijk verstrekte uitkering in het kader van het regionaal beleid,
      bestemd voor stimulering van investeringen door ondernemers;

      d. indien de aanvrager niet heeft aangetoond dat de gevraagde subsidie een stimulerend effect heeft in de zin van
      artikel 8 van de algemene groepsvrijstellingsverordening;

      e. indien de subsidiabele kosten voor minder dan 25 procent met eigen middelen worden gefinancierd;

      f. indien de verhouding tussen eigen en vreemd vermogen, gezien de rentabiliteit en de aard van het bedrijf, naar
      verwachting niet aanvaardbaar zal zijn nadat na uitvoering van het project de bedrijfsactiviteiten een aanvang
      hebben genomen;

      g. indien de gewenste structuur van de betrokken sector van het bedrijfsleven zich tegen het project verzet;

      h. indien het project het vestigen van een elektriciteitsproductie-installatie met een vermogen van meer dan 100 MW
      (input thermisch) behelst;

      i. in geval van een project als bedoeld in [artikel 3.2, eerste lid, onder c, of tweede lid, onder b][ref2], indien
      de aanvrager niet heeft aangetoond dat hij met betrekking tot de uitvoering van het project binnen concernverband
      een bestaande of op te richten zusteronderneming heeft die met betrekking tot de uitvoering van een soortgelijk
      project op het grondgebied van een andere lidstaat van de Europese Unie een beroep kan doen op een gepubliceerde
      regionale steunmaatregel van de desbetreffende overheid en dat de besluitvorming ten aanzien van het project is
      voorbehouden aan de leiding van het concern.

      Onder regionale steunmaatregel wordt verstaan een regionale steunmaatregel die voldoet aan de voorwaarden van
      artikel 13 van de algemene groepsvrijstellingsverordening of die is gebaseerd op een door Europese Commissie
      goedgekeurde regionale steunkaart en die blijkens een besluit van de Commissie als verenigbaar met de interne markt
      wordt beschouwd.


