  - number: '1.5'
    text: |-
      Deze regeling valt onder de [verordening (EG) nr. 800/2008](32008R0800) van de Commissie van de Europese
      Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van de artikelen 87 en 88 van het
      Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (‘de algemene groepsvrijstellingsverordening’)
      (PbEU L214).
    url: https://wetten.overheid.nl/BWBR0024884/2010-07-07#Artikel1.5
  - number: '2.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *actielijn:* een in een gebiedsgericht programma opgenomen actielijn;
        - *experimentele ontwikkeling:* experimentele ontwikkeling als bedoeld in paragraaf 2.2, onder g, van de
      Communautaire kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU
      C 323);
        - *fundamenteel onderzoek:* fundamenteel onderzoek als bedoeld in paragraaf 2.2, onder e, van de Communautaire
      kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU C 323);
        - *gebied:* het gebied Oost-Nederland, Noordvleugel Randstad, Zuidvleugel Randstad, Zuidwest-Nederland, Zuidoost-
      Nederland en Noord-Nederland, zoals die zijn omschreven in [bijlage 2.1][ref1];
        - *gebiedsgericht innovatieproject:* een gebiedsgericht project, dat gericht is op innovatie en een bijdrage kan
      leveren aan duurzame economische groei in Nederland;
        - *gebiedsgericht programma:* een in [artikel 2.4][ref2] aangewezen programma dat door middel van programmalijnen
      en actielijnen voor een gebied de meerjarige economische doelstellingen aangeeft, die een bijdrage kunnen leveren
      aan een duurzame economische groei in Nederland;
        - *gebiedsgericht project:* een samenhangend geheel van activiteiten, dat bijdraagt aan de verwezenlijking van een
      programmalijn opgenomen in een gebiedsgericht programma;
        - *industrieel onderzoek:* industrieel onderzoek als bedoeld in paragraaf 2.2, onderdeel f, van de Communautaire
      kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU C 323);.
        - *innovatie:* technologische innovatie, met inbegrip van niet-technologische aspecten voor zover ze dienstbaar
      zijn aan technologische innovatie;
        - *openbaar lichaam:* een lichaam als bedoeld in
      [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref3];
        - *programmalijn:* een in een gebiedsgericht programma opgenomen programmalijn;
        - *publieke cofinancier:* een gemeente, provincie of openbaar lichaam en, indien het subsidie
      betreft voor een gebiedsgericht project dat past in één van de actielijnen van het gebiedsgericht
      programma van het gebied Noord-Nederland, het dagelijks bestuur van het Samenwerkingsverband Noord-
      Nederland, voor zover dat bestuur ten laste van het Europees Fonds voor Regionale Ontwikkeling
      op grond van [artikel 6 van het Besluit EFRO programmaperiode 2007–2013][ref4] voor een
      gebiedsgericht project subsidie verstrekt of voor zover dat bestuur ten laste van het in
      [artikel 13, vijfde lid, van de Regeling EFRO doelstelling 2 programmaperiode 2007–2013][ref5] gegeven
      subsidieplafond voor een gebiedsgericht project subsidie verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0024884
      [ref2]: https://wetten.overheid.nl/BWBR0024884#Artikel2.4
