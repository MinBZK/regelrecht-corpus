  - number: '3.5'
    text: |-
      1 In afwijking van [artikel 11, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] komen voor subsidie
      in aanmerking de door de subsidie-ontvanger gemaakte en betaalde kosten van verkrijging van grond, nieuwe
      bedrijfsgebouwen en nieuwe duurzame bedrijfsuitrusting, met uitzondering van:

      a. grond, bedrijfsgebouwen of duurzame bedrijfsuitrusting die de subsidie-ontvanger heeft verkregen van een
      natuurlijke persoon of rechtspersoon die tot hetzelfde concern behoort;

      b. niet permanent in het bedrijf aanwezige duurzame bedrijfsuitrusting;

      c. immateriële vaste activa zoals omschreven in [artikel 365 van Boek 2 van het Burgerlijk Wetboek][ref2],
      daaronder niet begrepen legeskosten van bouw- en milieuvergunningen.

      2 Voor zover subsidie wordt verstrekt aan een MKB-ondernemer worden, in afwijking van het eerste lid,
      tevens in aanmerking genomen de kosten van verkrijging van gebruikte bedrijfsgebouwen en gebruikte duurzame
      bedrijfsuitrusting.

      3 In geval van overname van een bedrijfsvestiging die langer dan één jaar vóór het indienen van de aanvraag is
      gesloten worden, in afwijking van het eerste lid, tevens in aanmerking genomen de kosten van verkrijging van
      gebruikte bedrijfsgebouwen en gebruikte duurzame bedrijfsuitrusting.

      4 Het vereiste dat de kosten moeten zijn betaald is niet van toepassing op kosten als bedoeld in
      [artikel 3.6, eerste lid, onder a, 2°, onder b, 3° en onder c, 3°][ref3], en in artikel 3.6, tweede lid, onder
      c.


