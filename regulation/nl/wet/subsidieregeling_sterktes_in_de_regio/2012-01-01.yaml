  - number: '3.3'
    text: |-
      1 De subsidie bedraagt:

      a. voor een project dat tot stand wordt gebracht in een gemeente of deel van een gemeente waar de in
      [bijlage 3.1][ref1] aangegeven maximale steunintensiteit 15 procent bedraagt, het in de bij deze regeling
      behorende [bijlage 3.3][ref2] in tabel 2 aangegeven percentage van de subsidiabele kosten dat correspondeert met
      de puntenscore die resulteert uit de scorelijst van tabel 1;

      b. voor een project, niet zijnde een project als bedoeld in het eerste lid, onder a, het in de bij deze regeling
      behorende [bijlage 3.3][ref3] in tabel 3 aangegeven percentage van de subsidiabele kosten dat correspondeert met
      de puntenscore die resulteert uit de scorelijst van tabel 1.

      2 Voor zover subsidie wordt verstrekt aan een MKB-ondernemer, niet zijnde een ondernemer die een onderneming in
      stand houdt die behoort tot de vervoersector, bedraagt de subsidie, in afwijking van het eerste lid, onder b, het
      percentage van de subsidiabele kosten bedoeld in het eerste lid, onder a, tenzij de subsidiabele kosten van het
      project meer dan € 50 000 000 bedragen.

      3 Bij de toepassing van [artikel 6 van het Kaderbesluit EZ-subsidies][ref4] blijven subsidies uit hoofde van

      a. het [Besluit stimulering duurzame energieproductie][ref5] en

      b. de [paragrafen 2.3][ref6], [3.4][ref7] en [3.5 van de Subsidieregeling energie en innovatie][ref8] buiten
      beschouwing, voor zover het totale bedrag aan subsidies niet meer bedraagt dan het bedrag dat ingevolge de door
      de Europese Commissie bij beschikking van 27 juni 2007 goedgekeurde regionale steunkaart voor Nederland voor de
      periode 2007-2013 (PbEU C 176) kan worden verstrekt.


