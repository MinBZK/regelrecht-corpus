    text: |-
      Deze regeling valt onder de [verordening (EG) nr. 800/2008](32008R0800) van de Commissie van de Europese
      Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van de artikelen 87 en 88 van het
      Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (‘de algemene groepsvrijstellingsverordening’)
      (PbEU L214).
    url: https://wetten.overheid.nl/BWBR0024884/2012-01-01#Artikel1.5
  - number: '1.6'
    text: |-
      Indien door de minister op grond van deze regeling een subsidie wordt verleend van minder dan € 25.000, wordt de
      subsidie ambtshalve vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024884/2012-01-01#Artikel1.6
  - number: '3.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *concern:* een economische eenheid waarin organisatorisch zijn verbonden: 1°. een natuurlijke persoon of
      privaatrechtelijke rechtspersoon die direct of indirect: – de helft of meer van het geplaatste kapitaal verschaft
      aan, – volledig aansprakelijk vennoot is van of – overwegende zeggenschap heeft over een of meer rechtspersonen of
      vennootschappen en 2°. laatstbedoelde rechtspersonen of vennootschappen;
        - *fundamenteel wijzigingsproject:* een fundamentele wijziging in het productieproces van een industrieel bedrijf;
        - *hoofdkantoor:* een kantoor van een concern waarin de centrale leiding of een zelfstandig onderdeel daarvan is
      gehuisvest;
        - ** een bedrijf of bedrijfsonderdeel op het gebied van technisch of fysisch onderzoek, dat een belangrijke functie
      vervult voor de ontwikkeling van voor het bedrijf nieuwe producten;
        - *project:* een technisch, functioneel en in de tijd samenhangend geheel van investeringen in duurzame
      bedrijfsuitrusting al dan niet in combinatie met grond of bedrijfsgebouwen;
        - *regio:* a. het gebied van de provincies Groningen, Friesland en Drenthe tezamen, b. het gebied van de provincie
      Limburg;
        - *S.B.I.-bedrijfsgroep:* een bedrijfsgroep op vier-cijferniveau van de Standaardbedrijfsindeling 2008 van het
      Centraal Bureau voor de Statistiek;
        - *strategisch uitbreidingsproject:* een uitbreidingsproject waarbij sprake is van concurrentie binnen de Europese
      Unie ten aanzien van de plaats waar het project wordt gerealiseerd;
        - *stuwend dienstverlenend bedrijf:* een dienstverlenend bedrijf, niet zijnde een toeristisch bedrijf of een
      bedrijf waarvan de activiteiten grotendeels bestaan uit het bieden van accommodatie aan congresgangers, dat naar
      zijn aard niet aan enige plaats gebonden is, dat de economische ontwikkeling van de regio van vestiging stimuleert
      en waarvan de afnemers in overwegende mate gevestigd zijn buiten de regio waarin het is of zal worden gevestigd;
        - *stuwend toeristisch bedrijf:* een bedrijf op het gebied van de toeristische dagrecreatie, dat de economische
      ontwikkeling in de regio van vestiging stimuleert en dat in overwegende mate bezoekers trekt van buiten de regio
      waarin het is of zal worden gevestigd;
        - *uitbreidingsproject:* een project inhoudende de uitbreiding van de capaciteit van een industrieel bedrijf,
      stuwend dienstverlenend bedrijf, stuwend toeristisch bedrijf, hoofdkantoor of laboratorium in dezelfde gemeente
      als waarin reeds een bedrijf van de ondernemer of een bedrijf van een tot hetzelfde concern behorende ondernemer
      is gevestigd;
        - *vestigingsproject:* een project, niet zijnde een uitbreidingsproject, inhoudende het stichten van: a. een
      industrieel bedrijf, b. een stuwend dienstverlenend bedrijf, hoofdkantoor of laboratorium, c. een stuwend
      toeristisch bedrijf.
    url: https://wetten.overheid.nl/BWBR0024884/2012-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een ondernemer die in een in [bijlage 3.1][ref1] genoemde
      gemeente of deel van een gemeente een van de volgende soorten projecten tot stand brengt:

      a. een vestigingsproject;

      b. een fundamenteel wijzigingsproject waarvan de subsidiabele kosten € 45 000 000 of meer bedragen;

      c. een strategisch uitbreidingsproject waarvan de subsidiabele kosten € 13 500 000 of meer bedragen.

      2 De minister verstrekt voorts op aanvraag subsidie aan de ondernemer die in een in [bijlage 3.2][ref2] genoemde
      gemeente of deel van een gemeente een van de volgende projecten tot stand brengt:

      a. een vestigingsproject waarvan de subsidiabele kosten € 13 500 000 of meer bedragen;

      b. een strategisch uitbreidingsproject waarvan de subsidiabele kosten € 13 500 000 of meer bedragen.

      3 Ondernemingen die van de toepassing van dit hoofdstuk zijn uitgesloten zijn ondernemingen die behoren tot:

      a. sectoren van de productie van landbouwproducten als bedoeld in bijlage 1 van het EU-verdrag;

      b. sectoren van de productie en het in de handel brengen van producten bedoeld om melk en zuivelproducten te
      imiteren en te vervangen als bedoeld in artikel 3, tweede lid, van Verordening (EU) nr. 1898/87;

      c. de visserij;

      d. de scheepsbouwsector;

      e. de kolenindustrie;

      f. de ijzer- en staalindustrie;

      g. de synthetische-vezelindustrie.


      [ref1]: https://wetten.overheid.nl/BWBR0024884
      [ref2]: https://wetten.overheid.nl/BWBR0024884
