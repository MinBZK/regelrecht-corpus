  - number: '3.11'
    text: |-
      De subsidie-ontvanger verwerft de tot het project behorende bedrijfsgebouwen en de duurzame bedrijfsuitrusting en
      stelt deze in bedrijf binnen de in de beschikking tot subsidieverlening vermelde termijn.
    url: https://wetten.overheid.nl/BWBR0024884/2012-01-01#Artikel3.11
  - number: '3.12'
    text: |-
      1 De subsidie-ontvanger houdt het project in bedrijf in de gemeente of in het deel van de gemeente waar het tot
      stand is gebracht.

      2 De subsidie-ontvanger stelt de minister onverwijld in kennis van elk voornemen om van het project deel uitmakende
      grond, bedrijfsgebouwen of duurzame bedrijfsuitrusting af te stoten of buiten gebruik te stellen.

      3 De verplichtingen, bedoeld in het eerste en tweede lid, gelden tot vijf jaar na het tijdstip waarop het project
      is voltooid.
    url: https://wetten.overheid.nl/BWBR0024884/2012-01-01#Artikel3.12
  - number: '3.13'
    text: |-
      Het formulier voor het indienen van een aanvraag om:

      a. een subsidie is opgenomen in [bijlage 3.4][ref1];

      b. een subsidievaststelling is opgenomen in [bijlage 3.5][ref2].


