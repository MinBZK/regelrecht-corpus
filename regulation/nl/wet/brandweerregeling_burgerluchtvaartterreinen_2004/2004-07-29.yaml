---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: brandweerregeling_burgerluchtvaartterreinen_2004
regulatory_layer: WET
publication_date: '2009-10-06'
valid_from: '2004-07-29'
bwb_id: BWBR0017052
url: https://wetten.overheid.nl/BWBR0017052/2004-07-29
preamble:
  text: |-
    Gelet op artikel 129, vijfde lid, van de Regeling Toezicht Luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: blusstof: een vaste, vloeibare of gasvormige stof geschikt voor het
      blussen van branden; brandrisicoklasse: 1°. de risicoklassen waarin een luchtvaartterrein met betrekking tot
      de brandweervoorzieningen wordt ingedeeld aan de hand van het aantal vliegtuigen en de afmetingen daarvan
      dat van het luchtvaartterrein gebruik maakt, of 2°. de risicoklassen waarin een vliegtuig met betrekking
      tot de brandbestrijding wordt ingedeeld aan de hand van de totale lengte en rompbreedte van dat vliegtuig;
      brandweervoertuigen: voertuigen, die voor het gebruik bij de brandweer op luchtvaartterreinen zijn gebouwd,
      ingericht of uitgerust; brandweervoorzieningen: het personeel en de middelen aanwezig op het luchtvaartterrein
      voor het redden van mens en dier en voor het voorkomen, beperken en bestrijden van brand bij ongevallen met
      luchtvaartuigen; burgerluchtvaartterrein: een voor burgerluchtvaartuigen openstaand aangewezen luchtvaartterrein;
      calamiteitenplan: het samenstel van maatregelen, dat is voorbereid, in geval van een ongeval of voorval
      op of in de onmiddellijke omgeving van het burgerluchtvaartterrein; gecontroleerd luchtvaartterrein: een
      burgerluchtvaartterrein, waar luchtverkeersleiding wordt gegeven aan luchtvaartterreinverkeer; luchtvaartongeval:
      elk voorval dat samenhangt met het gebruik van een luchtvaartuig en plaatsvindt tussen het tijdstip waarop een
      persoon zich aan boord begeeft met het voornemen een vlucht uit te voeren en het tijdstip waarop alle personen
      die zich met dit voornemen aan boord hebben begeven, zijn uitgestapt, en waarbij: 1°. een persoon dodelijk of
      ernstig gewond raakt als gevolg van het zich in het luchtvaartuig bevinden, direct contact met een onderdeel van
      het luchtvaartuig, inclusief de onderdelen die van het luchtvaartuig zijn losgeraakt of directe blootstelling
      aan de uitlaatstroom van de reactoren, behalve wanneer de letsels een natuurlijke oorzaak hebben, door de persoon
      zelf of door anderen zijn toegebracht, of wanneer de letsels verstekelingen treffen die zich buiten de normale
      voor passagiers en het personeel bedoelde ruimten ophouden, of 2°. het luchtvaartuig schade of een structureel
      defect oploopt, waardoor afbreuk wordt gedaan aan zijn soliditeit, prestaties of vluchtkenmerken en waardoor
      normaliter ingrijpende herstelwerkzaamheden of vervanging van het getroffen onderdeel noodzakelijk zouden maken,
      behalve wanneer het gaat om motorstoring of motorschade en de schade beperkt is tot de motor, de motorkap of
      motoronderdelen, dan wel om schade die beperkt is tot de propellers, de vleugelpunten, de antennes, de banden,
      de remmen, de stroomlijnkappen of tot deukjes of gaatjes in de vliegtuighuid, of 3°. het luchtvaartuig vermist
      wordt of volledig onbereikbaar is; meldingspost: de plaats op het luchtvaartterrein waar alle incident- en
      ongevalmeldingen binnenkomen; minister: Minister van Verkeer en Waterstaat; notice to airmen (NOTAM): bericht
      aan luchtvarenden; onmiddellijke omgeving van het luchtvaartterrein: een in overleg met de lokale overheid
      vastgesteld gebied buiten een luchtvaartterrein; opkomsttijd: het tijdsverloop tussen de eerste melding van
      een luchtvaartongeval aan de brandweer en de aankomst van de brandweervoorzieningen met de minimum vereiste
      capaciteit die voor de desbetreffende brandrisicoklasse vereist is; svm: schuimvormend middel voor de productie
      van blusschuim; uitruksterkte: brandweerpersoneel en -materieel benodigd om de repressieve taak naar behoren uit te
      kunnen voeren; vliegtuigbeweging: een landing of opstijging van een vliegtuig.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel1
  - number: '2'
    text: |-
      Deze regeling is van toepassing op alle burgerluchtvaartterreinen in Nederland, met uitzondering van terreinen die
      uitsluitend zijn ingericht voor het gebruik van hefschroefvliegtuigen.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel2
  - number: '3.1'
    text: |-
      De exploitant van een luchtvaartterrein stelt een calamiteitenplan vast met inachtneming van de wettelijke
      bepalingen terzake van het bestrijden van ongevallen en rampen.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel3
  - number: '3.2'
    text: 'Het calamiteitenplan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel3
  - number: 3.2.a
    text: begripsomschrijvingen;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel3
  - number: 3.2.b
    text: een overzicht van de luchtvaartongevallen en overige voorvallen waarop het calamiteitenplan van toepassing is;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel3
  - number: 3.2.c
    text: |-
      een overzicht van diensten, organisaties en personen, die bij de bestrijding van de in onderdeel b bedoelde
      gevallen en voorvallen kunnen of moeten worden betrokken;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel3
  - number: 3.2.d
    text: |-
      een overzicht waarin de leiding over en de gecoördineerde inzet van diensten, organisaties en personen zijn
      weergegeven, gerelateerd aan de in onderdeel b genoemde gevallen en voorvallen;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel3
  - number: 3.2.e
    text: |-
      een overzicht van de taken en verantwoordelijkheden van de diensten, organisaties en personen per ongeval of
      voorval als bedoeld in onderdeel b;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel3
  - number: 3.2.f
    text: een intern en extern verbindings- en alarmschema;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel3
  - number: 3.2.g
    text: een overzichtskaart van het luchtvaartterrein en de onmiddellijke omgeving voorzien van een coördinatenstelsel;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel3
  - number: 3.2.h
    text: de wijze van verslaglegging;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel3
  - number: 3.2.i
    text: |-
      een verzendlijst, in ieder geval bevattende de in onderdeel c bedoelde diensten, organisaties en personen en de
      minister.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel3
  - number: '3.3'
    text: |-
      De exploitant overlegt over het ontwerp met de in het tweede lid in onderdeel c bedoelde diensten, organisaties
      en personen.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel3
  - number: '3.4'
    text: |-
      Het calamiteitenplan wordt niet eerder vastgesteld of gewijzigd dan nadat de daarin vastgelegde wederzijdse
      verantwoordelijkheden zijn afgestemd met de burgemeester(s) van de gemeente(n) waarbinnen het luchtvaartterrein
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel3
  - number: '3.5'
    text: Het calamiteitenplan wordt binnen een maand na vaststelling of wijziging aan de minister aangeboden.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel3
  - number: '4'
    text: |-
      Bij inwerkingtreding van het calamiteitenplan is er een ruimte van waaruit de leiding en de coördinatie van de
      luchthavendiensten kunnen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel4
  - number: '5.1'
    text: |-
      Zo spoedig mogelijk na vaststelling en vervolgens ten minste éénmaal per jaar wordt het calamiteitenplan op zijn
      bruikbaarheid getoetst.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel5
  - number: '5.2'
    text: |-
      Op luchtvaartterreinen ingedeeld in brandrisicoklasse 3 en hoger vindt de toets, bedoeld in het eerste lid, éénmaal
      in de twee jaar plaats in de vorm van een praktische oefening. De exploitant van het luchtvaartterrein stelt de
      Inspectie Verkeer en Waterstaat hiervan tijdig op de hoogte. Indien het calamiteitenplan, vanwege een daadwerkelijk
      luchtvaartongeval, in zijn totaliteit in werking is geweest, kan deze toets achterwege blijven.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel5
  - number: '5.3'
    text: |-
      Bij de uitvoering en de evaluatie van de bruikbaarheidtoets worden de diensten, organisaties en personen, bedoeld
      in [artikel 3, tweede lid, onderdeel c][ref1], betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0017052#Artikel3
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0017052
        artikel: '3'
        paragraaf: '2'
  - number: '6.1'
    text: |-
      De exploitant van een luchtvaartterrein stelt voor het luchtvaartterrein een brandrisicoklasse vast aan de
      hand van de vliegtuigen met de hoogste brandrisicoklasse door middel van de afmetingen weergegeven in de in
      [artikel 8, eerste lid][ref1], bedoelde [bijlage][ref2], behorend bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017052#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0017052
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017052
        artikel: '8'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0017052
  - number: '6.2'
    text: |-
      Tijdens perioden van verminderde vliegtuigbewegingen kan de exploitant voor het luchtvaartterrein een
      brandrisicoklasse vaststellen overeenkomstig de brandrisicoklasse van het grootste vliegtuig dat in deze periode
      het luchtvaartterrein gebruikt, ongeacht het aantal vliegtuigbewegingen.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel6
  - number: '6.3'
    text: |-
      De vaststelling of wijziging van de brandrisicoklasse van het luchtvaartterrein maakt de exploitant bekend aan
      de minister.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel6
  - number: '6.4'
    text: |-
      De vaststelling of wijziging van de brandrisicoklasse wordt gemeld in de desbetreffende luchtvaartpublicaties. In
      spoedeisende gevallen wordt een NOTAM uitgegeven.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel6
  - number: '7.1'
    text: |-
      Tijdens de openstellingsuren van een luchtvaartterrein en ten minste tot 15 minuten na de daadwerkelijke
      vertrektijd van het laatste luchtvaartuig, is voor de uitruksterkte tenminste het aantal personen aanwezig,
      genoemd in tabel 1 van [ bijlage A][ref1], behorend bij deze regeling, gekoppeld aan de van kracht zijnde
      brandrisicoklasse.


      [ref1]: https://wetten.overheid.nl/BWBR0017052
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017052
  - number: '7.2'
    text: |-
      De exploitant treft zodanige voorzieningen dat de vereiste kennis en vaardigheid van het in het eerste lid bedoelde
      personeel voldoen aan de eisen, opgenomen in [bijlage A][ref1], behorend bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017052
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017052
  - number: '7.3'
    text: |-
      Voor luchtvaartterreinen in de brandrisicoklassen 1 tot en met 3 (geen geregeld luchtvervoer) wordt het personeel
      mede belast met de repressieve brandweerdienst, ten minste jaarlijks in de gelegenheid gesteld de specifieke
      brandweerkennis voor luchtvaartterreinen op peil te houden door het volgen van een daarvoor door de minister
      goedgekeurde opleiding.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel7
  - number: '7.4'
    text: |-
      De minister kan met betrekking tot de specifieke kennis en vaardigheid ten aanzien van het bestrijden van
      vliegtuigbranden voor personeel van luchtvaartterreinen in de brandrisicoklassen 1 tot en met 3 (geen geregeld
      luchtvervoer) een bewijs van bekwaamheid afgeven.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel7
  - number: '7.5'
    text: |-
      De exploitant kan de personen, bedoeld in het eerste lid, met andere taken belasten mits deze niet strijdig zijn
      met hun taakuitvoering en paraatheid.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel7
  - number: '8.1'
    text: |-
      Het brandweer- en reddingsmaterieel op luchtvaartterreinen bestaat ten minste uit brandweervoertuigen zoals vermeld
      in [bijlage B][ref1], behorend bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017052
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017052
  - number: '8.2'
    text: |-
      De brandweervoertuigen bezitten zodanige eigenschappen dat onder de gemiddelde weers- en terreinomstandigheden op
      of in de onmiddellijke omgeving van het luchtvaartterrein kan worden geopereerd.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel8
  - number: '8.3'
    text: |-
      Een luchtvaartterrein dat tussen zonsondergang en zonsopgang is opengesteld beschikt, ten behoeve van opsporings-
      en reddingswerkzaamheden alsmede voor de verlichting van het werkterrein, over adequate verlichtingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel8
  - number: '8.4'
    text: |-
      Bij aanwezigheid van waterrijke of drassige gebieden op of in de onmiddellijke omgeving van het luchtvaartterrein,
      draagt de exploitant zorg voor voldoende en doelmatige reddingsmiddelen met het oog op die gebieden.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel8
  - number: '8.5'
    text: |-
      Op één van de voertuigen, vermeld in [bijlage B][ref1], behorend bij deze regeling, of een ander daartoe ingericht
      voertuig zijn adequate reddingsmiddelen aanwezig voor de onmiddellijke hulpverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0017052
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017052
  - number: '8.6'
    text: |-
      Op gecontroleerde luchtvaartterreinen en luchtvaartterreinen waarvan de brandrisicoklasse 4 of hoger bedraagt, zijn
      de brandweervoertuigen voorzien van adequate verbindingsapparatuur voor de communicatie met tenminste:
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel8
  - number: 8.6.a
    text: de brandweervoertuigen onderling;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel8
  - number: 8.6.b
    text: de meldingspost;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel8
  - number: 8.6.c
    text: de plaatselijke luchtverkeersdienst, en
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel8
  - number: 8.6.d
    text: de leidinggevende van de brandweer met de gemeentelijke of regionale brandweer.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel8
  - number: '8.7'
    text: Het brandweerpersoneel beschikt over een uitrusting die zijn persoonlijke bescherming zo goed mogelijk waarborgt.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel8
  - number: '9.1'
    text: |-
      Indien door bijzondere omstandigheden niet aan de eisen van [artikel 6][ref1] kan worden voldaan, kan de exploitant
      afwijkende brandweervoorzieningen op het luchtvaartterrein vaststellen. De exploitant stelt de minister in kennis
      van de vastgestelde afwijkende brandweervoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0017052#Artikel6
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017052
        artikel: '6'
        paragraaf: '3'
  - number: '9.2'
    text: |-
      Bij een onvoorziene wijziging van twee uur of minder in de brandweervoorzieningen stelt de exploitant de
      gezagvoerders van de luchtvaartuigen die van het luchtvaartterrein gebruik willen maken, hiervan onmiddellijk op
      de hoogte.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel9
  - number: '10'
    text: |-
      De vereiste brandweervoorzieningen zijn tijdens de openstellingsuren van het luchtvaartterrein en ten minste tot 15
      minuten na de daadwerkelijke vertrektijd van het laatste luchtvaartuig aanwezig.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel10
  - number: '11.1'
    text: |-
      De brandweervoertuigen zijn ten minste voorzien van een hoeveelheid blusstof bestaande uit water met een
      bijbehorende hoeveelheid svm alsmede aanvullende blusstof, zoals vermeld in [bijlage B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017052
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017052
  - number: '11.2'
    text: |-
      De afgifte van water vermengd met svm bedraagt per minuut zoveel als vermeld in [bijlage B][ref1], behorend bij
      deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017052
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017052
  - number: '11.3'
    text: |-
      Om de brandweervoertuigen na of tijdens een actie zo snel mogelijk weer gereed te maken voor gebruik, zijn op het
      luchtvaartterrein een reserve hoeveelheid svm en aanvullende blusstoffen beschikbaar die ten minste gelijk is aan
      de in [bijlage B][ref1], behorend bij deze regeling, vermelde hoeveelheden.


      [ref1]: https://wetten.overheid.nl/BWBR0017052
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017052
  - number: '11.4'
    text: |-
      Op luchtvaartterreinen zijn voldoende waterwinplaatsen aanwezig, waaruit minstens 1000 liter water per minuut kan
      worden onttrokken.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel11
  - number: '11.5'
    text: |-
      De in het eerste tot en met het vierde lid bedoelde blusstoffen voldoen aan de brandtest opgenomen in
      [bijlage C][ref1], behorend bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017052
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017052
  - number: '11.6'
    text: |-
      In de hoeveelheden blusstof, bedoeld in het eerste, derde en vierde lid, zijn niet begrepen de voor het houden van
      oefeningen benodigde blusstoffen.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel11
  - number: '12'
    text: |-
      De opkomsttijd tot aan de baaneinden van elk van de in gebruik zijnde banen bedraagt niet meer dan drie minuten,
      onder optimale zicht- en terreinomstandigheden.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel12
  - number: '13.1'
    text: |-
      Het materieel, bedoeld in [artikel 8][ref1], wordt ondergebracht in een deugdelijke stallingruimte, die zodanig is
      geconstrueerd en ingericht dat de brandweervoertuigen bij alarmering onmiddellijk kunnen uitrukken.


      [ref1]: https://wetten.overheid.nl/BWBR0017052#Artikel8
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017052
        artikel: '8'
        paragraaf: '4'
  - number: '13.2'
    text: |-
      De stallingruimte van het materieel is zodanig gelegen dat de brandweervoertuigen een onbelemmerde toegang hebben
      tot het landingsterrein.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel13
  - number: '13.3'
    text: 'Een meldingspost beschikt ten minste over de volgende voorzieningen:'
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel13
  - number: 13.3.a
    text: het calamiteitenplan;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel13
  - number: 13.3.b
    text: een systeem ter alarmering van het brandweerpersoneel;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel13
  - number: 13.3.c
    text: 'voor zover van toepassing: een directe lijnverbinding met de plaatselijke luchtverkeersdienst;'
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel13
  - number: 13.3.d
    text: voorzieningen ter alarmering van de in het calamiteitenplan genoemde diensten, organisaties en personen;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel13
  - number: 13.3.e
    text: apparatuur voor draadloze verbinding met de brandweervoertuigen die uitrukken;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel13
  - number: 13.3.f
    text: middelen om alle desbetreffende berichtgeving vast te leggen, en
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel13
  - number: 13.3.g
    text: |-
      een naslagsysteem van alle typen luchtvaartuigen welke in de regel van het luchtvaartterrein gebruik maken, zodat
      bijzonderheden direct kunnen worden doorgegeven indien dit niet op de voertuigen aanwezig is.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel13
  - number: '13.4'
    text: De meldingspost is bezet door terzake kundig personeel.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel13
  - number: '14.1'
    text: |-
      De exploitant draagt zorg voor uitvalswegen op het luchtvaartterrein aansluitend op wegen in de onmiddellijke
      omgeving van het luchtvaartterrein voor zover de infrastructuur of de terreinomstandigheden dit toelaten.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel14
  - number: '14.2'
    text: |-
      De in het eerste lid bedoelde uitvalswegen zijn toegankelijk voor het brandweer- en reddingsmaterieel, bedoeld in
      [artikel 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017052#Artikel8
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017052
        artikel: '8'
        paragraaf: '4'
  - number: '14.3'
    text: |-
      Indien de in het eerste lid bedoelde uitvalswegen op het luchtvaartterrein niet te onderscheiden zijn van hun
      directe omgeving, moeten bermmarkeringen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel14
  - number: '15.1'
    text: 'Tijdens de grondafhandeling van luchtvaartuigen zijn aanwezig:'
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel15
  - number: 15.1.a
    text: voor onmiddellijk gebruik geschikte blusstoffen ter bestrijding van beginnende vloeistofbranden, en
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel15
  - number: 15.1.b
    text: deskundig personeel voor de bestrijding van vloeistofbranden.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel15
  - number: '15.2'
    text: |-
      Bij een brand of een omvangrijke brandstoflekkage zijn er voorzieningen opdat de brandweer snel kan worden
      gealarmeerd.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel15
  - number: '15.3'
    text: |-
      Tijdens brandstofhandelingen aan een luchtvaartuig met passagiers aan boord is het afhandelingmaterieel zodanig
      opgesteld dat het gebruik van voldoende uitgangen voor een snelle evacuatie met een onbelemmerde vluchtweg mogelijk
      is.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel15
  - number: '16.1'
    text: |-
      In het driemaandelijks verslag over de toestand van het luchtvaartterrein neemt de exploitant ten aanzien van de
      brandweervoorzieningen tenminste het volgende op:
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel16
  - number: 16.1.a
    text: de van belang zijnde wijzigingen met betrekking tot het personeel;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel16
  - number: 16.1.b
    text: de toestand van materieel en middelen, en
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel16
  - number: 16.1.c
    text: overige bijzonderheden de brandweer betreffende.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel16
  - number: '16.2'
    text: |-
      In het verslag van het eerste kwartaal van elk jaar wordt de uitruksterkte opgegeven naar de toestand op 1 januari
      van dat jaar.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel16
  - number: '17.1'
    text: |-
      Van ieder voorval met een luchtvaartuig op of in de onmiddellijke omgeving van het luchtvaartterrein waarbij de
      brandweer is uitgerukt, wordt een register bijgehouden waarin wordt vermeld:
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel17
  - number: 17.1.a
    text: de datum en het tijdstip van de alarmering;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel17
  - number: 17.1.b
    text: het tijdstip waarop de brandweer ter plaatse van het voorval is gearriveerd;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel17
  - number: 17.1.c
    text: het soort alarm en de aanleiding hiervoor;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel17
  - number: 17.1.d
    text: de houder van het luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel17
  - number: 17.1.e
    text: het type luchtvaartuig en de registratie, en
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel17
  - number: 17.1.f
    text: de genomen acties.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel17
  - number: '17.2'
    text: |-
      Een afschrift van het register wordt aan het verslag, bedoeld in [artikel 16][ref1], toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017052#Artikel16
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0017052
        artikel: '16'
        paragraaf: '6'
  - number: '18.1'
    text: |-
      Indien de brandweer daadwerkelijk reddingsacties heeft verricht dan wel brand heeft voorkomen, beperkt
      of bestreden, wordt door de exploitant direct een rapport opgemaakt overeenkomstig het model opgenomen in
      [bijlage D][ref1], behorend bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017052
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0017052
  - number: '18.2'
    text: Het rapport wordt binnen zeven dagen aan de minister aangeboden.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel18
  - number: '19.1'
    text: |-
      Tot 1 januari 2005 kan de exploitant van een luchtvaartterrein, indien gedurende de drie drukste opeenvolgende
      maanden van het jaar het aantal vliegtuigbewegingen van vliegtuigen met de hoogste brandrisicoklasse op dat
      luchtvaartterrein 700 of meer bedraagt, voor het luchtvaartterrein dezelfde brandrisicoklasse vaststellen als de
      brandrisicoklasse van de vliegtuigen, bedoeld in [artikel 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017052#Artikel6
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0017052
        artikel: '6'
        paragraaf: '3'
  - number: '19.2'
    text: |-
      Tot 1 januari 2005 kan de exploitant van een luchtvaartterrein, indien gedurende de drie drukste opeenvolgende
      maanden van het jaar het aantal vliegtuigbewegingen van vliegtuigen met de hoogste brandrisicoklasse op dat
      luchtvaartterrein minder dan 700 bedraagt, voor het luchtvaartterrein een brandrisicoklasse vaststellen, die één
      klasse lager ligt dan de brandrisicoklasse van de vliegtuigen, bedoeld in [artikel 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017052#Artikel6
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0017052
        artikel: '6'
        paragraaf: '3'
  - number: '20'
    text: |-
      De minister kan personeelsleden die op het tijdstip van inwerkingtreding van deze regeling meer dan twee jaar
      een functie bekleden van bevelvoerder of officier en niet over de certificaten of diploma’s beschikken van de
      opleidingen, bedoeld in [artikel 7][ref1], vrijstelling verlenen voor het volgen van de vereiste opleidingen,
      indien zij kunnen aantonen, door middel van ervaring en bewijsstukken van andere opleidingen die zij gevolgd
      hebben, dat zij over een gelijkwaardig bekwaamheidsniveau beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0017052#Artikel7
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017052
        artikel: '7'
        paragraaf: '4'
  - number: '21'
    text: |-
      De [Brandweerregeling Burgerluchtvaartterreinen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007138
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007138
  - number: '22'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel22
  - number: '23'
    text: 'Deze regeling wordt aangehaald als: Brandweerregeling burgerluchtvaartterreinen 2004.'
    url: https://wetten.overheid.nl/BWBR0017052/2004-07-29#Artikel23
