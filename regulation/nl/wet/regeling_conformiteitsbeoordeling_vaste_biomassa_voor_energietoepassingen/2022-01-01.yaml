preamble:
  text: |-
    Gelet op de artikelen 13, 16, eerste en derde lid, 19 en 20, eerste lid, van het Besluit conformiteitsbeoordeling
    vaste biomassa voor energietoepassingen;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt onder ‘besluit’ verstaan:
      [Besluit conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040209
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0040209
  - number: '1.2'
    text: |-
      [Bijlage A][ref1] bevat begripsomschrijvingen van begrippen in de [bijlagen B][ref2], [C][ref3] en [D][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0040431
      [ref2]: https://wetten.overheid.nl/BWBR0040431
      [ref3]: https://wetten.overheid.nl/BWBR0040431
      [ref4]: https://wetten.overheid.nl/BWBR0040431
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0040431
      - id: ref2
        bwb_id: BWBR0040431
      - id: ref3
        bwb_id: BWBR0040431
      - id: ref4
        bwb_id: BWBR0040431
  - number: '2'
    text: |-
      De duurzaamheidseisen voor de categorieën vaste biomassa, bedoeld in [artikel 16, eerste lid, van het besluit][ref1]
      zijn opgenomen in [bijlage D][ref2] in samenhang met [bijlage B][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0040431
      [ref3]: https://wetten.overheid.nl/BWBR0040431
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0040431
      - id: ref3
        bwb_id: BWBR0040431
  - number: '3'
    text: |-
      De beheerseisen, bedoeld in [artikel 16, derde lid, van het besluit][ref1] zijn opgenomen in [bijlage C][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0040431
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0040431
  - number: '4.1'
    text: |-
      Het verificatieprotocol, bedoeld in [artikel 13 van het besluit][ref1], is het Verificatieprotocol duurzaamheid
      vaste biomassa voor energietoepassingen.


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel13
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '13'
  - number: '4.2'
    text: |-
      Indien een nieuwe versie van het verificatieprotocol beschikbaar is, wordt die door de Minister van Economische
      Zaken en Klimaat op de website van Rijksdienst voor Ondernemend Nederland geplaatst.
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel4
  - number: '5'
    text: |-
      De inspecteurs van de Nederlandse emissieautoriteit worden aangewezen als ambtenaren, belast met het toezicht op de
      naleving, bedoeld in [artikel 19 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel19
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '19'
  - number: '6'
    text: |-
      De redelijke termijn, bedoeld in [artikel 20, eerste en tweede lid, van het besluit][ref1], bedraagt zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel20
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '20'
  - number: '7'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het Besluit van 1 november 2017, houdende regels inzake de
      conformiteitsbeoordeling van vaste biomassa voor energietoepassingen door erkende conformiteitsbeoordelingsinstanties
      ([Besluit conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref1]) (Stb. 2017, 427) in werking
      treedt. Indien de Staatscourant waarin deze regeling wordt geplaatst, wordt uitgegeven op of na de datum van
      inwerkingtreding van dat besluit, treedt deze regeling in werking op de dag na de datum van uitgifte van de
      Staatscourant waarin zij wordt geplaatst en werkt terug tot en met het tijdstip waarop het genoemde besluit in
      werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0040209
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0040209
  - number: '8'
    text: 'Deze regeling wordt aangehaald als: Regeling conformiteitsbeoordeling vaste biomassa voor energietoepassingen.'
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel8
