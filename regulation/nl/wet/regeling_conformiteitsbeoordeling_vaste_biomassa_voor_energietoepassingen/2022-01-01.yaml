            legal_basis:
              law: regeling_conformiteitsbeoordeling_vaste_biomassa_voor_energietoepassingen
              article: '1'
  - number: '2'
    text: |-
      De duurzaamheidseisen voor de categorieën vaste biomassa, bedoeld in [artikel 16, eerste lid, van het besluit][ref1]
      zijn opgenomen in [bijlage D][ref2] in samenhang met [bijlage B][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0040431
      [ref3]: https://wetten.overheid.nl/BWBR0040431
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0040431
      - id: ref3
        bwb_id: BWBR0040431
    machine_readable:
      execution:
        output:
          - name: duurzaamheidseisen_voldaan
            type: boolean
            description: Indicates whether the durability requirements for solid biomass categories are met as per Annex D in conjunction with Annex B.
        input:
          - name: bijlage_d
            type: object
            source:
              regulation: regeling_conformiteitsbeoordeling_vaste_biomassa_voor_energietoepassingen
              output: bijlage_d
          - name: bijlage_b
            type: object
            source:
              regulation: regeling_conformiteitsbeoordeling_vaste_biomassa_voor_energietoepassingen
              output: bijlage_b
        actions:
          - output: duurzaamheidseisen_voldaan
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $bijlage_d
                  value: true
                - operation: EQUALS
                  subject: $bijlage_b
                  value: true
            legal_basis:
              law: regeling_conformiteitsbeoordeling_vaste_biomassa_voor_energietoepassingen
              article: '2'
  - number: '3'
    text: |-
      De beheerseisen, bedoeld in [artikel 16, derde lid, van het besluit][ref1] zijn opgenomen in [bijlage C][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0040431
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0040431
    machine_readable:
      execution:
        output:
          - name: beheerseisen_voldaan
            type: boolean
            description: Indicates whether the management requirements are met as per Annex C.
        input:
          - name: bijlage_c
            type: object
