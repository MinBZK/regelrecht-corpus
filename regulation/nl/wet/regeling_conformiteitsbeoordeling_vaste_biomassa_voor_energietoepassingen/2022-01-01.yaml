      - id: ref2
        bwb_id: BWBR0040431
      - id: ref3
        bwb_id: BWBR0040431
      - id: ref4
        bwb_id: BWBR0040431
      - id: ref5
        bwb_id: BWBR0040431
    machine_readable:
      execution:
        output:
