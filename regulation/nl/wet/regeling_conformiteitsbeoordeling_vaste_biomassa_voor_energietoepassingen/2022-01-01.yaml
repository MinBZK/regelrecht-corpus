              regulation: regeling_conformiteitsbeoordeling_vaste_biomassa_voor_energietoepassingen
              output: bijlage_c
        actions:
          - output: beheerseisen_voldaan
            value:
              operation: EQUALS
              subject: $bijlage_c
              value: true
            legal_basis:
              law: regeling_conformiteitsbeoordeling_vaste_biomassa_voor_energietoepassingen
              article: '3'
  - number: '4'
    text: |-
      1 Het verificatieprotocol, bedoeld in [artikel 13 van het besluit][ref1], is het Verificatieprotocol duurzaamheid
      vaste biomassa voor energietoepassingen.

      2 Indien een nieuwe versie van het verificatieprotocol beschikbaar is, wordt die door de Minister van Economische
      Zaken en Klimaat op de website van Rijksdienst voor Ondernemend Nederland geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel13
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '13'
    machine_readable:
      untranslatable: true
      reason: Dynamic updates to the verification protocol are published via the RVO website, which cannot be statically represented.
  - number: '5'
    text: |-
      De inspecteurs van de Nederlandse emissieautoriteit worden aangewezen als ambtenaren, belast met het toezicht op de
      naleving, bedoeld in [artikel 19 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel19
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '19'
    machine_readable:
      execution:
        output:
          - name: toezicht_ingevoegd
            type: boolean
            description: Indicates whether supervision by NEa inspectors is introduced.
        actions:
          - output: toezicht_ingevoerd
            value: true
            legal_basis:
              law: regeling_conformiteitsbeoordeling_vaste_biomassa_voor_energietoepassingen
              article: '5'
  - number: '6'
    text: |-
      De redelijke termijn, bedoeld in [artikel 20, eerste en tweede lid, van het besluit][ref1], bedraagt zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel20
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '20'
    machine_readable:
      execution:
        output:
          - name: redelijke_termijn
            type: number
            description: The reasonable term for compliance, in months.
        actions:
          - output: redelijke_termijn
            value: 6
            legal_basis:
              law: regeling_conformiteitsbeoordeling_vaste_biomassa_voor_energietoepassingen
              article: '6'
  - number: '7'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het Besluit van 1 november 2017, houdende regels inzake de
      conformiteitsbeoordeling van vaste biomassa voor energietoepassingen door erkende conformiteitsbeoordelingsinstanties
      ([Besluit conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref1]) (Stb. 2017, 427) in werking
      treedt. Indien de Staatscourant waarin deze regeling wordt geplaatst, wordt uitgegeven op of na de datum van
      inwerkingtreding van dat besluit, treedt deze regeling in werking op de dag na de datum van uitgifte van de
      Staatscourant waarin zij wordt geplaatst en werkt terug tot en met het tijdstip waarop het genoemde besluit in
      werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0040209
    url: https://wetten.overheid.nl/BWBR0040431/2022-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0040209
    machine_readable:
      execution:
        output:
          - name: inwerkingtreding_datum
            type: string
            description: The effective date of this regulation, aligned with BWBR0040209.
        actions:
          - output: inwerkingtreding_datum
            value: "2022-01-01"
            legal_basis:
              law: regeling_conformiteitsbeoordeling_vaste_biomassa_voor_energietoepassingen
              article: '7'
