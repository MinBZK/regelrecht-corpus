  - number: XXXVII
    text: |-
      Ingeval de samenloop van wetten die in 2011 in het Staatsblad zijn of worden gepubliceerd en wijzigingen aanbrengen
      in één of meer belastingwetten, niet of niet juist is geregeld, of indien als gevolg van die samenloop onjuistheden
      ontstaan in de aanduiding van artikelen, artikelonderdelen, verwijzingen en dergelijke in de desbetreffende wetten,
      kunnen die wetten op dit punt bij ministeriële regeling worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0030999/2017-01-01#ArtikelXXXVII
  - number: XXXVIII
    text: |-
      1 Deze wet treedt in werking met ingang van 1 januari 2012, met dien verstande dat:

      a. [artikel I, onderdelen A, B, M, N, P, Q en R][ref1], eerst toepassing vindt nadat
      [artikel 10.1 van de Wet inkomstenbelasting 2001][ref2] bij het begin van het kalenderjaar 2012 is toegepast;

      b. [artikel V, onderdelen C en D][ref3], eerst toepassing vindt nadat [artikel 20a, tweede lid][ref4],
      onderscheidenlijk [20b, tweede lid, van de Wet op de loonbelasting 1964][ref5] bij het begin van het kalenderjaar
      2012 is toegepast;

      c. [artikel V, onderdelen F, G en H][ref6], eerst toepassing vindt nadat
      [artikel 22d van de Wet op de loonbelasting 1964][ref7] bij het begin van het kalenderjaar 2012 is toegepast;

      d. de wijzigingen van de [Wet op de vennootschapsbelasting 1969][ref8] ingevolge
      [artikel X, onderdelen L, onder 3, en M, onder 3][ref9], niet van toepassing zijn met betrekking tot de verwerving
      van een belang in een lichaam indien de overnameschuld en het vermogen van dat lichaam voor 15 november 2011 deel
      zijn gaan uitmaken van het vermogen van eenzelfde lichaam;

      e. de wijzigingen van de [Wet op de vennootschapsbelasting 1969][ref10] ingevolge [artikel X, onderdeel Q][ref11],
      niet van toepassing zijn met betrekking tot de verwerving of uitbreiding van een belang in een maatschappij welke
      voor 15 november 2011 deel is gaan uitmaken van dezelfde fiscale eenheid als de maatschappij die dat belang heeft
      verworven of uitgebreid;

      f. [artikel X][ref12] voor het eerst toepassing vindt met betrekking tot boekjaren die aanvangen op of na 1 januari
      2012;

      g. [artikel I, onderdeel Ba][ref13], voor het eerst toepassing vindt met betrekking tot kosten of uitgaven ter zake
      van speur- en ontwikkelingswerk dat wordt verricht na 31 december 2011.

      2 [Artikel XVI ][ref14]werkt terug tot en met 15 juni 2011.

      3 In afwijking van het eerste lid treden [artikel XX][ref15], [artikel XXI][ref16] en [artikel XXXIII][ref17] in
      werking op een bij koninklijk besluit te bepalen tijdstip.

      4 Het eerste lid, onderdeel e, vindt geen toepassing indien de fiscale eenheid, bedoeld in dat onderdeel, op enig
      tijdstip na 31 december 2016 deel is gaan uitmaken van een andere fiscale eenheid.


