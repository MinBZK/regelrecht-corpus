      1 Een ingevolge [artikel 12 van de Wet op de vennootschapsbelasting 1969][ref1], zoals dat artikel luidde op 31
      december 2011, gevormde herbestedingsreserve wordt bij het begin van het eerste boekjaar dat aanvangt op of na
      1 januari 2012 aangemerkt als een bestedingsreserve als bedoeld in genoemd artikel 12 zoals dat luidt met ingang
      van 1 januari 2012, mits wordt voldaan aan de voorwaarden van genoemd artikel 12, zoals dat luidt met ingang van 1
      januari 2012.

      2 Voor lichamen die een herbestedingsreserve hebben gevormd als bedoeld in
      [artikel 12 van de Wet op de vennootschapsbelasting 1969][ref2] zoals dat artikel luidde op 31 december 2011, en
      met ingang van het eerste boekjaar dat aanvangt op of na 1 januari 2012 niet voldoen aan de voorwaarden die artikel
      12 van de Wet op de vennootschapsbelasting 1969 stelt ter zake van de vorming van een bestedingsreserve, blijft
      artikel 12 van de Wet op de vennootschapsbelasting 1969 zoals dat luidde op 31 december 2011 van toepassing met
      betrekking tot die herbestedingsreserve.


