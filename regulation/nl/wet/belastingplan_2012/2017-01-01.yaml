  - number: XXXIV
    text: |-
      1 [Artikel 1][ref1] en [hoofdstuk VA van de Algemene wet inzake rijksbelastingen][ref2] en de op dat hoofdstuk
      berustende bepalingen, zoals dat artikel, dat hoofdstuk en die bepalingen luidden op 31 december 2012, blijven van
      toepassing met betrekking tot:

      a. belastingaanslagen inkomstenbelasting die betrekking hebben op tijdvakken die zijn geëindigd vóór 1 januari
      2012;

      b. belastingaanslagen vennootschapsbelasting die betrekking hebben op tijdvakken die zijn aangevangen vóór 1
      januari 2012;

      c. belastingaanslagen erfbelasting die betrekking hebben op belastingschulden die zijn ontstaan vóór 1 januari
      2013;

      d. naheffingsaanslagen en beschikkingen ter zake van loonbelasting, omzetbelasting, overdrachtsbelasting, belasting
      van personenauto’s en motorrijwielen, accijns, verbruiksbelastingen van alcoholvrije dranken en van pruimtabak
      en snuiftabak, en de in [artikel 1 van de Wet belastingen op milieugrondslag][ref3] genoemde belastingen, die
      betrekking hebben op belastingschulden die zijn ontstaan in tijdvakken die zijn geëindigd vóór 1 januari 2012.

      In afwijking in zoverre van de eerste volzin blijft de regeling inzake het rentepercentage van de heffingsrente van
      [artikel 30f, vijfde lid, van de Algemene wet inzake rijksbelastingen][ref4], zoals dat luidde op 31 december 2012,
      slechts van toepassing ter zake van renteperiodes die zijn gelegen vóór 1 januari 2013. Voor zover een renteperiode
      is gelegen na 31 december 2012, geldt de regeling inzake het rentepercentage, zoals die regeling luidt met ingang
      van 1 januari 2013.

      2 Met betrekking tot de in het eerste lid bedoelde belastingaanslagen en beschikkingen alsmede
      teruggaafbeschikkingen op grond van de artikelen 236, 237 en 238 van Verordening (EEG) nr. 2913/92 van de Raad van
      de Europese Gemeenschappen van 12 oktober 1992 tot vaststelling van het communautair douanewetboek (PbEG 1992, L
      302) met betrekking tot uitnodigingen tot betaling met een dagtekening die is gelegen vóór 1 januari 2013, blijven
      [artikel 9, derde lid][ref5], [artikel 26, achtste lid][ref6], [hoofdstuk V van de Invorderingswet 1990][ref7]
      en de op dat hoofdstuk berustende bepalingen, zoals die artikelen, dat hoofdstuk en die bepalingen luidden op 31
      december 2012, van toepassing met uitzondering van de regeling inzake het rentepercentage van de invorderingsrente
      van [artikel 29 van die wet][ref8] ter zake van periodes na 31 december 2012. Voor zover een renteperiode is
      gelegen na 31 december 2012, geldt de regeling inzake het rentepercentage, zoals die regeling luidt met ingang van
      1 januari 2013.

      3 Met betrekking tot andere belastingaanslagen dan bedoeld in het eerste lid, blijft
      [artikel 29 van de Invorderingswet 1990][ref9], zoals dat artikel luidde op 31 december 2012, van toepassing voor
      zover een renteperiode is gelegen vóór 1 januari 2013.

      4 In afwijking van de aanhef van [artikel XXVIII][ref10] gelden de in dat artikel opgenomen wijzigingen van de
      [Algemene wet inzake rijksbelastingen][ref11] ook met betrekking tot belastingaanslagen vennootschapsbelasting
      die worden vastgesteld in het kalenderjaar 2012 en betrekking hebben op tijdvakken die zijn aangevangen op of na 1
      januari 2012.

      5 Voor zover de in [artikel 30i, derde lid, van de Algemene wet inzake rijksbelastingen][ref12]
      bedoelde renteperiode is gelegen voor 1 januari 2013, geldt de regeling inzake het rentepercentage van
      [artikel 30f, vijfde lid, van die wet][ref13] zoals dat artikel luidde vóór 1 januari 2013.


