preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo wij in overweging genomen hebben, dat het voor het jaar 2012 wenselijk is het aantal belastingen in
    belangrijke mate te verminderen, een aantal onevenwichtigheden in de vennootschapsbelasting weg te nemen,
    maatregelen te treffen die voortvloeien uit het Regeerakkoord en de woningmarkt een impuls te geven;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030999/2017-01-01#ArtikelAanhef
