  - number: XXXVIc
    text: |-
      1 Voor de toepassing van de vrijstelling van grondwaterbelasting ingevolge
      [artikel 10, eerste lid, onderdeel b of c, van de Wet belastingen op milieugrondslag][ref1] blijven, indien
      de onttrekking van het grondwater voortduurt na 31 december 2011, de administratieve verplichtingen ingevolge
      [artikel 11 van de Wet belastingen op milieugrondslag][ref2], zoals dit artikel luidde op 31 december 2011, alsmede
      de daarop gebaseerde bepalingen, onverkort van toepassing voor de volledige periode van de onttrekking van het
      grondwater.

      2 Bij de aangifte van de afvalstoffenbelasting over het laatste tijdvak van het jaar 2011 wordt
      [artikel 27, eerste lid, van de Wet belastingen op milieugrondslag][ref3], zoals dit artikel luidde op 31
      december 2011, zodanig toegepast dat ook de belasting ter zake van de op 31 december 2011 in de inrichting
      aanwezige voorraden stoffen, preparaten of voorwerpen die de inrichting, al dan niet na nuttige toepassing, na
      die datum zullen verlaten in mindering wordt gebracht op de verschuldigde belasting, met dien verstande dat de
      vermindering niet wordt toegepast ter zake van percolaat of stortgas. Deze toepassing geldt slechts voor zover
      deze voorraden bestemd zijn om de inrichting met het oog op nuttige toepassing of hergebruik als bedoeld in de
      [Wet milieubeheer][ref4] of verbranding te verlaten en uit boeken en bescheiden blijkt dat de stoffen, preparaten
      of voorwerpen niet gestort als bedoeld in de Wet milieubeheer geweest zijn.

      3 Bij de aangifte van de afvalstoffenbelasting over het laatste tijdvak van het jaar 2011 wordt de herrekening,
      bedoeld in [artikel 27, derde lid, van de Wet belastingen op milieugrondslag][ref5], zoals dit artikel luidde op
      31 december 2011, zodanig toegepast dat de afvalstoffenbelasting niet wordt geheven ter zake van de op 31 december
      2011 in de inrichting aanwezige voorraden van afvalstoffenstromen waarbij de toepassing van een verhoudingsgetal
      is toegestaan. Deze toepassing geldt slechts voor zover deze voorraden bestemd zijn om de inrichting met het
      oog op nuttige toepassing of hergebruik als bedoeld in de [Wet milieubeheer][ref6] of verbranding te verlaten
      en uit boeken en bescheiden blijkt dat de stoffen, preparaten of voorwerpen niet gestort als bedoeld in de Wet
      milieubeheer geweest zijn.

      4 Voor het op verzoek verlenen van teruggaaf van afvalstoffenbelasting ter zake van afvalstoffen die
      afkomstig zijn van een overtreder jegens wie krachtens [artikel 18.2 van de Wet milieubeheer][ref7] of
      [artikel 5.2 van de Wet algemene bepalingen omgevingsrecht][ref8] bestuursdwang is toegepast, blijven de
      [artikelen 30][ref9] en [91 van de Wet belastingen op milieugrondslag][ref10], zoals deze artikelen luidden op 31
      december 2011, van toepassing tot en met 31 december 2014.

      5 Voor het op verzoek verlenen van teruggaaf van afvalstoffenbelasting voor zover de door de
      belastingplichtige ter zake te ontvangen bedragen niet zijn en niet zullen worden ontvangen, blijven
      [artikel 92 van de Wet belastingen op milieugrondslag][ref11], zoals dit artikel luidde op 31 december 2011, en de
      daarop gebaseerde bepalingen van toepassing tot en met 31 december 2014.


