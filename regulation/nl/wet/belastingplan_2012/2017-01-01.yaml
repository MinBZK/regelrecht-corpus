    text: |-
      1 De [artikelen 76][ref1], [76a][ref2], [77][ref3] en [79 van de Wet op de accijns][ref4] zoals deze luidden op 31
      mei 2012, blijven tot 1 januari 2013 van toepassing voor zover zij betrekking hebben op accijnszegels die vóór 1
      juni 2012 zijn aangevraagd.

      2 De [artikelen 76][ref5], [77][ref6] en [79 van de Wet op de accijns][ref7] zoals deze luidden op 31 mei 2012,
      blijven tot 1 januari 2013 van toepassing voor zover zij betrekking hebben op belastingzegels die vóór 1 juni 2012
      zijn aangevraagd.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de overgang van de in de
      [artikelen 76][ref8], [76a][ref9], [77][ref10] en [79 van de Wet op de accijns][ref11], zoals deze luidden op 31
      mei 2011, neergelegde systematiek, naar de op grond van deze wet met ingang van 1 juni 2012 geldende systematiek.


