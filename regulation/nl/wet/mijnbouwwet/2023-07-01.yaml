  - number: 24t
    text: |-
      1 De aanvraag om een startvergunning aardwarmte wordt geheel of gedeeltelijk afgewezen indien:

      a. het opsporen of winnen van aardwarmte in de in de aanvraag aangegeven aardlagen en de begrenzing ervan bij of
      krachtens wet niet is toegestaan;

      b. voor de aardlagen en de begrenzing ervan die in de aanvraag is aangeduid aan een ander dan de aanvrager een
      toewijzing zoekgebied aardwarmte is verleend of een startvergunning aardwarmte of een vervolgvergunning aardwarmte
      is verleend;

      c. de in de aanvraag beschreven opsporing en winning onaanvaardbare risico’s met zich brengt voor de veiligheid van
      omwonenden of onaanvaardbare schade kan veroorzaken aan gebouwen of infrastructurele werken of de functionaliteit
      daarvan;

      d. geen financiële zekerheid, anders dan bedoeld in de [artikelen 46][ref1] en [47][ref2], kan worden gesteld
      ter dekking van de aansprakelijkheid voor de schade door verontreiniging van grondwater of bodem in verband met
      de opsporing en winning van aardwarmte indien de in de aanvraag aangegeven aardlagen zich geheel of gedeeltelijk
      bevinden onder een gebied dat is aangewezen voor de winning van drinkwater uit grondwater.

      2 Een aanvraag om een startvergunning aardwarmte kan geheel of gedeeltelijk worden afgewezen:

      a. in het belang van de planmatige ontwikkeling of het beheer van delfstoffen, aardwarmte, andere natuurlijke
      rijkdommen, waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van
      stoffen;

      b. indien de in de aanvraag aangeduide wijze van opsporing en winning en de wijze waarop de putintegriteit wordt
      geborgd niet geschikt wordt geacht om reden van nadelige gevolgen voor het milieu;

      c. indien de aardlagen en de begrenzing ervan waar de aanvrager voornemens is aardwarmte te winnen niet aansluiten
      bij de verwachte winning van aardwarmte en de verwachte afzet van aardwarmte;

      d. in verband met het ontbreken van overeenkomsten met betrekking tot de afzet van aardwarmte;

      e. in verband met de financiële mogelijkheden van de aanvrager om de kosten in verband met de opsporing en winning
      en de hierbij behorende aansprakelijkheden, anders dan bedoeld in het eerste lid, onderdeel d, te dragen en gelet
      op zijn voornemens om kosten in verband met het geheel of gedeeltelijk buiten gebruik stellen van een boorgat
      tijdens of na afloop van de looptijd van de startvergunning te dragen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de gronden, bedoeld in
      het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
