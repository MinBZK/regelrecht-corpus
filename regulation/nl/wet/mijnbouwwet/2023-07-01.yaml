  - number: '33'
    text: |-
      1 De houder van een vergunning als bedoeld in [artikel 6][ref1] of [25][ref2], dan wel, ingeval de vergunning haar
      gelding heeft verloren, de laatste houder daarvan, neemt alle maatregelen die redelijkerwijs van hem gevergd kunnen
      worden om te voorkomen dat als gevolg van de met gebruikmaking van de vergunning verrichte activiteiten:

      a. nadelige gevolgen voor mens en milieu worden veroorzaakt,

      b. schade door bodembeweging wordt veroorzaakt,

      c. de veiligheid wordt geschaad, of

      d. het belang van een planmatig beheer van voorkomens van delfstoffen of aardwarmte wordt geschaad.

      2 De houder van een vergunning voor de opsporing of winning van koolwaterstoffen neemt alle noodzakelijke
      maatregelen om de gevolgen van een zwaar ongeval voor mens en milieu te beperken.

      3 Een houder van een startvergunning aardwarmte of een vervolgvergunning aardwarmte dan wel de laatste houder van
      een startvergunning aardwarmte of een vervolgvergunning aardwarmte neemt alle maatregelen die redelijkerwijs van
      hem gevergd kunnen worden om te voorkomen dat als gevolg van de verrichte activiteiten:

      a. nadelige gevolgen voor mens en milieu worden veroorzaakt;

      b. schade door bodembeweging wordt veroorzaakt;

      c. de veiligheid wordt geschaad.

      4 Een uitvoerder aardwarmte draagt zorg voor een goede en veilige uitvoering van het opsporen en winnen van
      aardwarmte en neemt alle maatregelen die redelijkerwijs van hem gevergd kunnen worden om te voorkomen dat als
      gevolg van de verrichte activiteiten:

      a. nadelige gevolgen voor mens en milieu worden veroorzaakt;

      b. schade door bodembeweging wordt veroorzaakt;

      c. de veiligheid wordt geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
