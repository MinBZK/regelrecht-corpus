  - number: '14'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop de aanvraag om een vergunning dient te
      geschieden en omtrent de gegevens en de bescheiden, welke daarbij moeten worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel14
  - number: '15'
    text: |-
      1 Zodra een aanvraag om een vergunning is ingediend, worden anderen in de gelegenheid gesteld om aanvragen om een
      soortgelijke vergunning in te dienen voor dezelfde delfstof voor hetzelfde gebied.

      2 Onze Minister plaatst hiertoe een uitnodiging in de Staatscourant. De uitnodiging maakt melding van het bepaalde
      in [artikel 17][ref1]. Indien het een aanvraag om een opsporings- of winningsvergunning voor koolwaterstoffen
      betreft, wordt de uitnodiging tevens geplaatst in het Publicatieblad van de Europese Unie.

      3 Anderen kunnen aanvragen indienen tot dertien weken na de dag van plaatsing van de uitnodiging in de
      Staatscourant of, ingeval het koolwaterstoffen betreft, het Publicatieblad van de Europese Unie.

      4 De procedure, bedoeld in het eerste tot en met het derde lid, wordt niet toegepast met betrekking tot:

      a. een aanvraag om een winningsvergunning als bedoeld in [artikel 10, eerste lid][ref2];

      b. een aanvraag om een winningsvergunning die wordt ingediend door de houder van een opsporings- of
      winningsvergunning naar aanleiding van de aantoning van een voorkomen, waarvan aannemelijk is dat het zich
      gedeeltelijk in zijn gebied en gedeeltelijk in het aangevraagde aangrenzende gebied bevindt;

      c. een aanvraag voor een gebied, waarvoor op grond van [artikel 7][ref3] geen vergunning wordt verleend;

      d. een aanvraag die wordt ingediend overeenkomstig het derde lid.

      5 In het geval, bedoeld in het vierde lid, onderdeel b, stelt Onze Minister anderen die ten tijde van de in dat
      onderdeel bedoelde indiening houder zijn van een opsporings- of winningsvergunning voor dezelfde delfstof, voor
      gebieden die grenzen aan het in dat onderdeel bedoelde aangevraagde aangrenzende gebied, in de gelegenheid om
      tot dertien weken na die indiening een aanvraag om een winningsvergunning voor die delfstof voor dat gebied in
      te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel7
