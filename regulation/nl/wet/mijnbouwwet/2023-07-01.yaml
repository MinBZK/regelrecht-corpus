  - number: '118'
    text: |-
      1 De commissie neemt een adviesaanvraag niet in behandeling, indien er kennelijk geen verband bestaat tussen de
      schade en de mijnbouwactiviteiten.

      2 Indien de commissie een adviesaanvraag in behandeling neemt, zendt zij afschrift van de adviesaanvraag aan de
      betrokken mijnbouwondernemer. Deze kan desgewenst binnen een maand na de datum van verzending schriftelijk reageren
      op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel118
  - number: '119'
    text: |-
      1 De commissie stelt onderzoek in naar het oorzakelijk verband tussen de verrichte mijnbouwactiviteiten en de
      schade, alsmede naar de hoogte van het schadebedrag. Zij kan deskundigen opdracht verlenen onderzoek te verrichten.

      2 De commissie brengt binnen drie, doch uiterlijk binnen zes maanden na het moment waarop de adviesaanvraag is
      ingediend, een voorlopig advies uit aan de adviesaanvrager en de mijnbouwondernemer.

      3 De adviesaanvrager en de mijnbouwondernemer kunnen schriftelijk bedenkingen inbrengen tegen het voorlopig advies
      binnen een maand na de datum van verzending van het voorlopig advies.

      4 De commissie stelt vervolgens een definitief advies vast.

      5 Het advies bevat een oordeel over het oorzakelijk verband tussen de verrichte mijnbouwactiviteiten en de schade,
      alsmede de hoogte van het schadebedrag.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel119
  - number: '120'
    text: |-
      1 De commissie kan van de mijnbouwondernemer alle inlichtingen vorderen die zij nodig acht ter uitvoering van de
      haar in [artikel 114, tweede lid][ref1], opgedragen taken.

      2 De mijnbouwondernemer verstrekt de commissie binnen een door haar gestelde redelijke termijn de gewenste
      inlichtingen.

      3 Indien de commissie inlichtingen heeft verkregen ter uitvoering van de taak, bedoeld in
      [artikel 114, tweede lid, onderdeel d][ref2], verstrekt zij deze aan de adviesaanvrager, tenzij deze gegevens op
      grond van [artikel 5.1, eerste lid, onderdeel c, of tweede lid, onderdeel f, van de Wet open overheid][ref3] niet
      openbaar kunnen worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel114
