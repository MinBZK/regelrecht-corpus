  - number: 31b
    text: |-
      Een aanvraag om een vergunning voor permanent opslaan van CO omvat ten minste de volgende onderwerpen:

      a. het tijdvak van injectie van CO en de omvang van het vergunningsgebied,

      b. een karakterisering van het opslagvoorkomen en het opslagcomplex en een beoordeling van de verwachte veiligheid
      van de opslag,

      c. de technische en financiële mogelijkheden van de aanvrager,

      d. de totale hoeveelheid CO die zal worden opgeslagen,

      e. de toekomstige bronnen van CO en transportmethoden,

      f. de samenstelling van de CO-stroom,

      g. de maximum toelaatbare snelheid en druk bij injectie van CO en de maximaal toelaatbare druk van de opgeslagen
      CO,

      h. de ligging van het voorkomen waar CO zal worden opgeslagen,

      i. risicobeheer,

      j. monitoring,

      k. afsluiting,

      l. corrigerende maatregelen,

      m. bodembeweging, en

      n. een omschrijving van de financiële zekerheid of een gelijkwaardige voorziening die gesteld zal worden en een
      bewijs dat deze rechtsgeldig en daadwerkelijk wordt gesteld voordat met de opslag van CO wordt aangevangen.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel31b
  - number: 31c
    text: |-
      1 Onze Minister zendt een aanvraag om een vergunning voor permanent opslaan van CO die voldoet aan
      [artikel 31b][ref1] met de daarbij behorende stukken binnen een maand na de ontvangst daarvan aan de Europese
      Commissie.

      2 Onze Minister zendt het ontwerp van een vergunning voor permanent opslaan van CO met de daarbij behorende stukken
      voor advies aan de Europese Commissie binnen zes maanden:

      a. na afloop van de termijn, bedoeld in [artikel 26b, derde lid][ref2], of

      b. na ontvangst van de aanvraag om de vergunning indien [artikel 26a, eerste lid][ref3], van toepassing is.

      3 Onze Minister neemt een besluit op een aanvraag binnen uiterlijk tien maanden na de ontvangst van de aanvraag.

      4 Onze Minister kan de termijnen, genoemd in het tweede en derde lid, eenmaal met ten hoogste zes maanden
      verlengen.

      5 Van een beschikking tot verlening van een vergunning wordt mededeling gedaan in de Staatscourant.

      6 Onze Minister zendt afschrift van het besluit omtrent de aanvraag ter kennisneming naar de Europese Commissie.
      Een afwijking van het advies, bedoeld in het tweede lid, wordt met redenen omkleed.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31b
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel26b
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel26a
