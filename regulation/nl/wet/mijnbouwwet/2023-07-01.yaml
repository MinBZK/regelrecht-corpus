  - number: 24p
    text: |-
      1 Als een aanvraag voor een startvergunning aardwarmte ziet op aardwarmte die zich gedeeltelijk bevindt in een
      aangrenzend gebied waarvoor geen toewijzing zoekgebied aardwarmte, startvergunning aardwarmte of vervolgvergunning
      aardwarmte is aangevraagd of verleend, doet Onze Minister hiervan mededeling in de Staatscourant.

      2 Indien het in het eerste lid aangevraagde gebied grenst aan een gebied waarvoor een toewijzing zoekgebied
      aardwarmte, een startvergunning aardwarmte of een vervolgvergunning aardwarmte geldt, stelt Onze Minister de
      houders van de toewijzing of vergunning op de hoogte van de ingediende aanvraag.

      3 Een houder van een toewijzing of vergunning als bedoeld in het tweede lid, kan binnen acht weken na de mededeling
      van Onze Minister een concurrerende aanvraag voor een startvergunning aardwarmte voor dit aangrenzende gebied
      indienen.

      4 Onze Minister stelt de aanvragers van alle ingediende aanvragen op de hoogte. De aanvragers voeren overleg over
      de mogelijkheden tot samenwerking of aanpassing van de aanvraag.

      5 Gedurende vier weken na het op de hoogte stellen van de aanvragers, bedoeld in het derde lid, heeft een aanvrager
      de mogelijkheid zijn aanvraag te wijzigen of in te trekken.

      6 Onze Minister kan de termijn, bedoeld in het vijfde lid, eenmaal met ten hoogste vier weken verlengen.
