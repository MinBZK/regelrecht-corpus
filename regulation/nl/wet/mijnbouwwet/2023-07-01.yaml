      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, met uitzondering van het bij of
      krachtens [artikel 52][ref1] bepaalde, zijn belast de bij besluit van Onze Minister daartoe aangewezen ambtenaren
      van het Staatstoezicht op de mijnen, voorzover niet op grond van [artikel 131][ref2] het toezicht aan anderen is
      opgedragen.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


