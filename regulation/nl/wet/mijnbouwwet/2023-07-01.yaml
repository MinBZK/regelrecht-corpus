    text: |-
      1 Onze Minister beslist op een aanvraag om een toewijzing zoekgebied aardwarmte binnen achttien weken na ontvangst
      van de aanvraag.

      2 Als ingevolge [artikel 24f, tweede lid][ref1], een aanvraag wordt ingediend, beslist Onze Minister binnen zes
      weken na afloop van de termijn, bedoeld in artikel 24f, vierde lid.

      3 Onze Minister kan de termijn, bedoeld in het eerste en tweede lid, eenmaal met ten hoogste vier weken verlengen.

      4 Van een beschikking tot verlening van een toewijzing zoekgebied aardwarmte wordt mededeling gedaan in de
      Staatscourant.


