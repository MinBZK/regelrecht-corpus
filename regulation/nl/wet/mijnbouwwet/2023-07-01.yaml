        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '145'
    text: |-
      1 Gedurende een in het tweede lid genoemde termijn kan na het tijdstip van inwerkingtreding van deze wet het winnen
      van delfstoffen zonder een in [artikel 34][ref1] genoemd winningsplan worden voortgezet.

      2 De termijn voor voortzetting van het winnen van delfstoffen is ten hoogste:

      a. voorzover het betreft winning uit voorkomens in het continentaal plat of onder de territoriale zee gelegen aan
      de zeezijde van de in de bijlage bij deze wet vastgelegde lijn: zes maanden, en

      b. voor ander dan onder a genoemd gebied: twaalf maanden.

      3 Indien een houder van een andere dan in [artikel 144][ref2] bedoelde winningsvergunning voor de afloop van de
      voor hem geldende termijn een winningsplan als bedoeld in [artikel 34][ref3] bij Onze Minister heeft ingediend en
      niet voor de afloop de beslissing van Onze Minister onherroepelijk vaststaat, kan de winning in elk geval worden
      voortgezet tot het laatstbedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel144
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel145
