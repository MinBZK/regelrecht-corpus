  - number: '190'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van een voor Nederland verbindend verdrag of
      een voor Nederland verbindend besluit van een volkenrechtelijke organisatie regels worden gesteld omtrent mijnbouw
      en met mijnbouw verwante activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel190
  - number: '191'
    text: |-
      Onze Minister van Economische Zaken en Klimaat zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel191
  - number: '192'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel192
  - number: '193'
    text: 'Deze wet wordt aangehaald als: Mijnbouwwet.'
