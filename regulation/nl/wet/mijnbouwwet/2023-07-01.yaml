  - number: '123'
    text: |-
      1 Degene die activiteiten verricht waarop het bij en krachtens [artikel 49, eerste lid][ref1],
      [artikel 51, eerste lid][ref2], of [52, eerste lid][ref3], bepaalde van toepassing is verstrekt aan Onze Minister
      de op grond van het vijfde lid bepaalde gegevens, voorzover de betrokkene in verband met die activiteiten in het
      bezit van deze gegevens is gekomen.

      2 Onze Minister kan de verstrekte gegevens, of een deel van die gegevens, doen beheren door door hem daartoe aan te
      wijzen instellingen, welke hem desgevraagd mede van advies dienen aan de hand van die gegevens.

      3 De verstrekte gegevens zijn gegevens als bedoeld in
      [artikel 5.1, eerste lid, onderdeel c, of tweede lid, onderdeel f, van de Wet open overheid][ref4].

      4 De op grond van het vijfde lid, onderdeel c, aangewezen gegevens verliezen op een op
      grond van dat onderdeel bepaald tijdstip hun vertrouwelijk karakter. Na dit tijdstip is
      [artikel 5.1, eerste lid, onderdeel c, of tweede lid, onderdeel f, van de Wet open overheid][ref5] niet meer van
      toepassing op deze aangewezen gegevens.

      5 Bij of krachtens algemene maatregel van bestuur worden:

      a. de gegevens bepaald die aan Onze Minister worden verstrekt;

      b. regels gesteld omtrent het tijdstip en de wijze waarop de gegevens worden verstrekt, omtrent het beheer van de
      gegevens en omtrent het gebruik dat van de gegevens kan worden gemaakt;

      c. regels gesteld omtrent het tijdstip waarop
      [artikel 5.1, eerste lid, onderdeel c, of tweede lid, onderdeel f, van de Wet open overheid][ref6] niet meer van
      toepassing is op deze gegevens.

      6 Dit artikel is van overeenkomstige toepassing op bescheiden en monsters.


