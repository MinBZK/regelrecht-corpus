  - number: 7a
    text: |-
      1 Indien een vergunning als bedoeld in [artikel 6, onderdelen a of b][ref1], is verleend, wordt geen vergunning
      verleend als bedoeld in [artikel 2.1, eerste lid, onderdeel e, van de Wet algemene bepalingen omgevingsrecht][ref2],
      voor zover die vergunning zou gelden voor een activiteit tot het oprichten van een mijnbouwwerk:

      a. in de op grond van [artikel 1.1, eerste lid, van de Wet natuurbescherming][ref3] aangewezen Natura 2000-gebieden
      Waddenzee en Noordzeekustzone,

      b. in een gebied, of een gedeelte daarvan, dat is gelegen binnen de Waddenzee, als aangewezen krachtens de
      [Wet ruimtelijke ordening][ref4],

      c. in het op grond van de Overeenkomst inzake de bescherming van het cultureel en natuurlijk erfgoed van de wereld
      (Trb. 1973, 155) aangewezen werelderfgoedgebied Waddenzee, of

      d. op de Waddeneilanden.

      2 Een vergunning als bedoeld in
      [artikel 2.1, eerste lid, onderdeel e, van de Wet algemene bepalingen omgevingsrecht][ref5]
      voor een oppervlaktewinningsinstallatie in het gebied gelegen boven het op grond van
      [artikel 1.1, eerste lid, van de Wet natuurbescherming][ref6] aangewezen Natura 2000-gebied Noordzeekustzone, maar
      binnen de 12-mijlszone wordt slechts verleend als medegebruik van een reeds bestaand mijnbouwplatform niet mogelijk
      is en als zichthinder is geminimaliseerd.


