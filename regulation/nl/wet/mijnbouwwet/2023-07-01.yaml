    text: |-
      1 Een eigenaar van een niet-productie-installatie herziet om de vijf jaar het rapport inzake grote gevaren en
      brengt de resultaten van de herziening ter kennis van de inspecteur-generaal der mijnen.

      2 De inspecteur-generaal der mijnen kan bepalen dat de herziening eerder geschiedt.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel45h
  - number: 45i
    text: |-
      1 In het geval van een essentiële wijziging van een niet-productie-installatie of van ontmanteling van een vaste
      niet-productie-installatie, dient de eigenaar van deze installatie een gewijzigd rapport inzake grote gevaren in
      bij de inspecteur-generaal der mijnen.

      2 De geplande wijzigingen en de ontmanteling worden niet uitgevoerd voordat de inspecteur-generaal der mijnen heeft
      ingestemd met het gewijzigd rapport inzake grote gevaren.

      3 Bij ministeriële regeling worden regels gesteld over het gewijzigd rapport inzake grote gevaren.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel45i
  - number: 45j
    text: |-
      1 De exploitant van een productie-installatie stelt een bedrijfsbeleid inzake het voorkomen van zware ongevallen op
      en past dit toe bij alle door de exploitant te verrichten opsporings- en winningsactiviteiten.

      2 De eigenaar van een niet-productie-installatie stelt een bedrijfsbeleid inzake het voorkomen van zware ongevallen
      op en past dit toe bij alle door de eigenaar te verrichten opsporings- en winningsactiviteiten.

      3 De exploitant, bedoeld in het eerste lid, en de eigenaar, bedoeld in het tweede lid, passen het bedrijfsbeleid
      inzake het voorkomen van zware ongevallen tevens toe op zijn mijnbouwinstallaties die buiten de Europese Unie in
      werking zijn.

      4 Bij ministeriële regeling worden regels gesteld over de inhoud van het bedrijfsbeleid inzake het voorkomen van
      zware ongevallen en de wijze waarop dit moet worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel45j
  - number: 45k
    text: |-
      1 De exploitant van een productie-installatie beschrijft in een document het veiligheids- en milieubeheerssysteem.

      2 De eigenaar van een niet-productie-installatie beschrijft in een document het veiligheids- en
      milieubeheerssysteem.

      3 Bij ministeriële regeling worden regels gesteld over de inhoud van het veiligheids- en milieubeheerssysteem en de
      wijze waarop het ontwikkeld wordt.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel45k
  - number: 45l
    text: |-
      1 De exploitant stelt een regeling voor onafhankelijke verificatie op voor zijn productie-installatie.

      2 De eigenaar stelt een regeling voor onafhankelijke verificatie op voor zijn niet-productie-installatie.

      3 De exploitant van een productie-installatie stelt een regeling voor onafhankelijke verificatie op voor
      kennisgevingen van boorgatactiviteiten.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. de eisen waaraan de regeling voor onafhankelijke verificatie moet voldoen,

      b. de selectiecriteria voor een onafhankelijke verificateur,

      c. het moment waarop de regeling voor onafhankelijke verificatie getroffen wordt,

      d. de wijze waarop de exploitant of de eigenaar uitvoering geeft aan het advies van de onafhankelijke verificateur
      en

      e. de wijze van bekendmaking van het advies van de onafhankelijke verificateur aan de inspecteur-generaal der
      mijnen.

      5 Bij ministeriële regeling wordt de termijn vastgesteld:

      a. gedurende welke de exploitant van een productie-installatie en de eigenaar van een niet-productie-installatie
      het advies van de onafhankelijke verificateur en documentatie over de maatregelen die op grond van een dergelijk
      advies door hen zijn genomen, bewaren;

      b. waarbinnen de exploitant en de eigenaar een regeling voor onafhankelijke verificatie voor de desbetreffende
      installatie, treffen.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel45l
  - number: 45m
    text: |-
      1 De exploitant dient bij een voorgenomen productie-installatie een kennisgeving van het ontwerp in bij de
      inspecteur-generaal der mijnen.

      2 Wanneer er vóór de indiening van het rapport inzake grote gevaren een essentiële wijziging wordt aangebracht in
      het ontwerp van de voorgenomen productie-installatie, meldt de exploitant dit zo snel mogelijk bij de inspecteur-
      generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel45m
  - number: 45n
    text: |-
      1 De exploitant dient in het geval van een boorgatactiviteit, een kennisgeving van de boorgatactiviteit in bij de
      inspecteur-generaal der mijnen.

      2 De kennisgeving, bedoeld in het eerste lid, bevat tevens het bedrijfsbeleid inzake het voorkomen van zware
      ongevallen voor zover dit beleid niet reeds eerder is ingediend bij de inspecteur-generaal der mijnen.

      3 Bij een essentiële wijziging in de gegevens van een ingediende kennisgeving van boorgatactiviteiten betrekt de
      exploitant een onafhankelijke verificateur bij het opstellen daarvan en stelt de inspecteur-generaal der mijnen in
      kennis van deze wijziging.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel45n
  - number: 45o
    text: |-
      1 De exploitant van een productie-installatie dient in het geval een bestaande mijnbouwinstallatie verplaatst moet
      worden naar een nieuwe productielocatie, een kennisgeving in bij de inspecteur-generaal der mijnen.

      2 Wanneer er vóór de indiening van het rapport inzake grote gevaren een essentiële wijziging wordt aangebracht
      in de kennisgeving van de verplaatsing, meldt de exploitant dit zo snel mogelijk bij de inspecteur-generaal der
      mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel45o
  - number: 45p
    text: |-
      1 De exploitant van een productie-installatie dient in het geval van een gecombineerde activiteit, een kennisgeving
      van gecombineerde activiteiten in bij de inspecteur-generaal der mijnen.

      2 De kennisgeving van gecombineerde activiteiten wordt gezamenlijk opgesteld door de exploitant van de productie-
      installatie en de betrokken eigenaren van de niet-productie-installaties.

      3 De exploitant van een productie-installatie en de eigenaar van een niet-productie-installatie starten niet met
      boorgatactiviteiten of gecombineerde activiteiten, voordat een kennisgeving aan de inspecteur-generaal der mijnen
      is voorgelegd.

      4 De exploitant van een productie-installatie en de eigenaar van een niet-productie-installatie beginnen niet
      met of staken de boorgatactiviteiten of de gecombineerde activiteiten, indien de inspecteur-generaal der mijnen
      bezwaren heeft geuit over de inhoud van de kennisgeving, bedoeld in het eerste lid.

      5 De exploitant van een productie-installatie stelt de inspecteur-generaal der mijnen in kennis van elke essentiële
      wijziging in de ingediende kennisgeving van gecombineerde activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel45p
  - number: 45q
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:

      a. de inhoud van de kennisgevingen, bedoeld in de [artikelen 45m][ref1], [45n][ref2], [45o][ref3] en [45p][ref4];

      b. de verplichtingen van de exploitant of de eigenaar inzake eventuele opmerkingen van de inspecteur-generaal der
      mijnen over de inhoud en de wijzigingen van de kennisgevingen, bedoeld in de [artikelen 45m][ref5], [45n][ref6],
      [45o][ref7] en [45p][ref8].

      2 Bij ministeriële regeling worden regels gesteld over de wijze waarop kennisgevingen, bedoeld in de
      [artikelen 45m][ref9], [45n][ref10], [45o][ref11] en [45p][ref12], moeten worden ingediend.


