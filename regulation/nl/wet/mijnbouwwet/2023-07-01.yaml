  - number: 31h
    text: |-
      1 Onze Minister wijzigt waar nodig een vergunning voor permanent opslaan van CO of trekt deze in:

      a. na kennis te hebben genomen van lekkages of significante onregelmatigheden,

      b. indien blijkt dat de vergunningsvoorwaarden niet worden nageleefd of dat er risico is op lekkages of
      significante onregelmatigheden,

      c. indien dit noodzakelijk blijkt op basis van de meest recente wetenschappelijke bevindingen en technologische
      vooruitgang, of

      d. indien de gestelde financiële zekerheid of een gelijkwaardige voorziening onvoldoende blijkt te zijn.

      2 Beoordeling van de vergunning vindt plaats nadat een periode van vijf jaar na de verlening van de vergunning is
      verstreken en vervolgens om de tien jaar.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel31h
  - number: 31i
    text: |-
      1 Een houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door meerdere personen
      wordt gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref1] sluit een opslagvoorkomen af en verwijdert
      de injectiefaciliteiten met de bijbehorende bovengrondse voorzieningen indien opslag van CO overeenkomstig de
      voorschriften van zijn vergunning is beëindigd.

      2 Alvorens te beginnen met de afsluiting van het opslagvoorkomen en de verwijdering van de injectiefaciliteiten met
      de bijbehorende bovengrondse voorzieningen dient de houder of de aangewezen persoon, bedoeld in het eerste lid, een
      geactualiseerde versie van de documenten, bedoeld in [artikel 31d, eerste lid, onderdelen h tot en met l][ref2],
      bij Onze Minister in.

      3 De houder of de aangewezen persoon, bedoeld in het eerste lid, vangt niet eerder aan met de afsluiting dan nadat
      Onze Minister met de geactualiseerde versie heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel31d
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel31i
