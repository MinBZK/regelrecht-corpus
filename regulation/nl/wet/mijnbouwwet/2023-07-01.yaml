        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 32a
    text: |-
      1 Onze Minister inventariseert jaarlijks voor 1 april de delen van een gebied, waarvoor een vergunning voor het
      winnen van koolwaterstoffen of een opslagvergunning geldt, waar:

      a. in de voorafgaande twee kalenderjaren geen significante activiteiten met betrekking tot het opsporen of winnen
      van koolwaterstoffen of het opslaan van stoffen hebben plaatsgevonden;

      b. de winningsactiviteiten zijn gestaakt.

      2 Van de inventarisatie wordt door Onze Minister mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel32a
  - number: 32b
    text: |-
      1 Onze Minister kan een gebied waarvoor een vergunning voor het winnen van koolwaterstoffen of opslagvergunning
      geldt, verkleinen met een deel ervan indien in dat deel gedurende een periode van de voorafgaande twee
      kalenderjaren geen significante activiteiten met betrekking tot het opsporen of winnen van koolwaterstoffen of het
      opslaan van stoffen hebben plaatsgevonden of de winningsactiviteiten zijn gestaakt.

      2 Onze Minister stelt de houder van een winnings- of opslagvergunning schriftelijk in kennis van zijn voornemen
      tot gebiedsverkleining als bedoeld in het eerste lid over te gaan en stelt hem daarbij in de gelegenheid binnen zes
      maanden, ingaande op de eerste dag na de dag van verzending van de kennisgeving, aannemelijk te maken dat in dat
      deel significante activiteiten als bedoeld in het eerste lid zijn of zullen worden verricht.

      3 Van significante activiteiten als bedoeld in het tweede lid is in ieder geval sprake indien:

      a. opsporings-, winnings- of opslagactiviteiten als bedoeld in [artikel 1, onderdeel e, f respectievelijk i][ref1],
      zijn verricht of binnen een naar het oordeel van Onze Minister redelijke termijn zullen worden verricht;

      b. een winningsplan als bedoeld in [artikel 34][ref2] is ingediend;

      c. een opslagplan als bedoeld in [artikel 39][ref3] in samenhang met [artikel 34][ref4] is ingediend.

      4 Uiterlijk vier maanden na afloop van de termijn, bedoeld in het tweede lid, of, indien de houder van de
      vergunning binnen die termijn schriftelijk heeft medegedeeld dat geen activiteiten zijn of zullen worden verricht,
      uiterlijk vier maanden nadat die mededeling is gedaan, geeft Onze Minister een beschikking omtrent verkleining van
      een vergunningsgebied. Onze Minister kan beperkingen en voorschriften verbinden aan de beschikking. Indien Onze
      Minister geen beschikking heeft gegeven binnen de termijn, bedoeld in de eerste volzin, wordt het gebied aangemerkt
      als niet te zijn verkleind.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel34
