  - number: 31j
    text: |-
      1 Onze Minister trekt een vergunning voor permanent opslaan van CO op eigen beweging of op verzoek van de
      vergunninghouder in indien:

      a. door de houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door meerdere personen
      wordt gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref1] schriftelijk is aangetoond dat het
      opgeslagen CO volledig en permanent ingesloten blijft,

      b. het opslagvoorkomen is afgesloten en de injectiefaciliteiten met de bijbehorende bovengrondse voorzieningen
      zijn verwijderd,

      c. na het tijdstip waarop het opslagvoorkomen is afgesloten en de bijbehorende bovengrondse voorzieningen en
      injectiefaciliteiten zijn verwijderd een periode van tenminste 20 jaar is verstreken of zoveel korter of langer als
      naar het oordeel van Onze Minister, gelet op onderdeel a, verantwoord is, en

      d. de houder, bedoeld in onderdeel a, hem een financiële bijdrage ter beschikking heeft gesteld waarmee de
      voorziene kosten, doch ten minste de geraamde monitoringskosten gedurende een periode van 30 jaar, ingaande op het
      tijdstip van intrekking worden gedekt.

      2 Op het document, bedoeld in het eerste lid, onderdeel a, en een besluit als bedoeld in het eerste lid zijn de
      artikelen [artikel 31c][ref2] en [31d, tweede lid][ref3], van overeenkomstige toepassing.

      3 Bij of krachtens algemene maatregel van bestuur worden omtrent het eerste lid regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel31c
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel31d
