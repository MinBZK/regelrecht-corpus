  - number: 24d
    text: Onze Minister verleent op aanvraag een toewijzing zoekgebied aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24d
  - number: 24e
    text: |-
      1 Een aanvraag om een toewijzing zoekgebied aardwarmte bevat een beschrijving van:

      a. de aardlagen en de begrenzing ervan waar de aanvraag betrekking op heeft;

      b. de andere gebruiksmogelijkheden van het gebied, waaronder grondwater met het oog op de winning van drinkwater en
      kenbare mogelijkheden tot het opslaan van stoffen;

      c. een plan voor de wijze waarop de aanvrager voornemens is de aardwarmte op te sporen en te winnen;

      d. de voorgenomen afzet van warmte en de afspraken hieromtrent;

      e. de ervaring van de aanvrager met de ontwikkeling van aardwarmteprojecten en andere mijnbouwactiviteiten;

      f. de wijze waarop de aanvrager voornemens is de opsporing en winning van aardwarmte te financieren.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24e
  - number: 24f
    text: |-
      1 Zodra voor een toewijzing zoekgebied aardwarmte een aanvraag is ingediend die voldoet aan het bepaalde bij
      of krachtens [artikel 24e][ref1] en deze aanvraag betrekking heeft op een zoekgebied dat beschikbaar is voor
      een toewijzing zoekgebied aardwarmte, stelt Onze Minister met een uitnodiging in de Staatscourant anderen in de
      gelegenheid om voor hetzelfde zoekgebied of een deel hiervan een aanvraag in te dienen.

      2 Anderen kunnen een aanvraag voor een toewijzing zoekgebied aardwarmte indienen tot twaalf weken na de dag van
      plaatsing van de uitnodiging in de Staatscourant. Indien deze aanvragen gedeeltelijk betrekking hebben op een nieuw
      zoekgebied voor aardwarmte ten opzichte van het in de Staatscourant gepubliceerde zoekgebied aardwarmte, geldt
      voor dat deel van de aanvraag de procedure van het eerste lid en wordt dat deel van de aanvraag geacht een nieuwe
      aanvraag te zijn.

      3 Onze Minister stelt de aanvragers van alle ingediende aanvragen op de hoogte. De aanvragers voeren overleg over
      de mogelijkheden tot samenwerking dan wel aanpassing van de aanvraag.

      4 Gedurende acht weken na het op de hoogte stellen van de aanvragers, bedoeld in het derde lid, heeft een aanvrager
      de mogelijkheid zijn aanvraag te wijzigen of in te trekken.


