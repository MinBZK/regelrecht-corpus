  - number: '21'
    text: |-
      1 Onze Minister kan een vergunning slechts geheel of gedeeltelijk intrekken:

      a. indien de bij de aanvraag verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op de
      aanvraag een andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig
      bekend waren geweest,

      b. indien de vergunning niet langer nodig is voor de goede uitvoering van de activiteiten waarvoor zij geldt,

      c. indien dit wordt gerechtvaardigd door een wijziging in de technische of financiële mogelijkheden van de houder,

      d. indien niet overeenkomstig de vergunning is of wordt gehandeld,

      e. indien voor de houder van de vergunning of de in [artikel 22][ref1] bedoelde aangewezen persoon als zodanig
      geldende regels niet worden nageleefd,

      f. in verband met veranderde omstandigheden of gewijzigde inzichten inzake de manier waarop de aanvrager de
      activiteiten voor opsporing of winning verricht of voornemens is te verrichten, waaronder de bij die activiteiten
      te gebruiken technieken, hulpmiddelen of stoffen,

      g. in verband met een vaststelling of wijziging van bij of krachtens een algemene maatregel van bestuur als
      bedoeld in [artikel 4.3, eerste lid][ref2], of [10.8, eerste lid, van de Wet ruimtelijke ordening][ref3]
      voor een gebied op land, respectievelijk in de territoriale zee, bedoeld in
      [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref4], gestelde regels inhoudende dat de
      opsporing of winning van een delfstof door middel van een opsporings- of winningsinstallatie in dat gebied niet
      wordt of kan worden toegestaan,

      h. in verband met een vaststelling of wijziging van bij of krachtens een algemene maatregel van bestuur als bedoeld
      in [artikel 49][ref5] gestelde regels over:

      1°. het geheel of gedeeltelijk uitsluiten van een gebied van de opsporing of winning van een delfstof,

      2°. de diepte waarop een activiteit plaatsvindt,

      3°. de soort activiteit, of

      4°. de soort delfstof,

      i. in verband met veranderde omstandigheden of gewijzigde inzichten inzake de veiligheid voor omwonenden of het
      voorkomen van schade aan gebouwen of infrastructurele werken of de functionaliteit daarvan,

      j. in verband met veranderde omstandigheden of gewijzigde inzichten inzake het planmatig gebruik of beheer van
      delfstoffen, andere natuurlijke rijkdommen, waaronder grondwater met het oog op de winning van drinkwater, of
      mogelijkheden tot het opslaan van stoffen,

      k. voor zover de vergunning geldt voor de op grond van [artikel 1.1, eerste lid, van de Wet natuurbescherming][ref6]
      aangewezen Natura 2000-gebieden Waddenzee en Noordzeekustzone,

      l. voor zover de vergunning geldt voor een gebied gelegen binnen de Waddenzee als aangewezen krachtens de
      [Wet ruimtelijke ordening][ref7] of op de Waddeneilanden,

      m. voor zover de vergunning geldt voor het op grond van de Overeenkomst inzake de bescherming van het cultureel en
      natuurlijk erfgoed van de wereld (Trb. 1973, 155) aangewezen werelderfgoedgebied Waddenzee, of

      n. indien een mijnbouwwerk voor de winning van delfstoffen kan worden hergebruikt voor de winning van aardwarmte en
      daarvoor een aanvraag om een vergunning als bedoeld in [artikel 6, eerste lid, onder c en d][ref8], is ingediend.

      2 Onze Minister gaat niet over tot gehele of gedeeltelijke intrekking op grond van het eerste lid, onderdeel d
      of e, dan nadat hij de houder schriftelijk heeft gewaarschuwd en de houder of de in [artikel 22][ref9] bedoelde
      aangewezen persoon zich na de waarschuwing voortdurend of opnieuw aan de overtreding schuldig maakt.

      3 Onze Minister kan een winningsvergunning op aanvraag van de houder geheel of gedeeltelijk intrekken. Een aanvraag
      tot gehele of gedeeltelijke intrekking kan slechts worden afgewezen, indien het noodzakelijk is dat de houder een
      aan de vergunning verbonden voorschrift of een voor hem als zodanig geldende regel naleeft.

      4 De houder van een opsporingsvergunning kan met een schriftelijke verklaring aan Onze Minister afstand doen van de
      vergunning met dien verstande dat de vergunning niet eerder vervalt dan met ingang van de dag nadat:

      a. Onze Minister de verklaring heeft ontvangen en

      b. de houder van de vergunning een aan de vergunning verbonden voorschrift of een voor hem als zodanig geldende
      regel heeft nageleefd.

      5 De vergunning vervalt van rechtswege:

      a. als de houder een natuurlijke persoon is, met ingang van de dag na die waarop die persoon is overleden;

      b. als de houder een rechtspersoon is, met ingang van de dag na die waarop die persoon heeft opgehouden te bestaan.

      6 Van een beschikking tot gehele of gedeeltelijke intrekking van een vergunning of van het vervallen van een
      vergunning wordt mededeling gedaan in de Staatscourant.


