  - number: '53'
    text: |-
      Deze afdeling is van toepassing op de heffing en invordering van oppervlakterecht, cijns en winstaandeel van de
      houder of medehouder van een vergunning voor het opsporen of winnen van koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel53
  - number: '54'
    text: |-
      In deze afdeling wordt verstaan onder:

      a. medehouderschap: geval waarin de vergunning wordt gehouden door meer dan één natuurlijke persoon of
      rechtspersoon;

      b. medehouder: ieder van de in onderdeel a bedoelde natuurlijke personen of rechtspersonen;

      c. de aangewezen medehouder: de in [artikel 22][ref1] bedoelde aangewezen persoon;

      d. de landzijde: het deel van het Nederlands territoir dat ligt aan de landzijde van de in de bijlage bij deze wet
      vastgelegde lijn;

      e. de zeezijde: het continentaal plat en het deel van het Nederlands territoir dat ligt aan de zeezijde van de in
      de bijlage bij deze wet vastgelegde lijn;

      f. de inspecteur: de door Onze Minister van Financiën bij ministeriële regeling aangewezen functionaris van de
      rijksbelastingdienst;

      g. de ontvanger: de door Onze Minister van Financiën bij ministeriële regeling aangewezen functionaris van de
      rijksbelastingdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
