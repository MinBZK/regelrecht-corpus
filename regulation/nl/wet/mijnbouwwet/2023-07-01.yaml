    text: |-
      1 De persoon, bedoeld in [artikel 137][ref1], dient zijn verzoek bij het waarborgfonds in uiterlijk drie maanden
      na het moment waarop de commissie het advies, bedoeld in [artikel 119, vierde lid][ref2], heeft vastgesteld en
      overlegt daarbij in ieder geval dat advies.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de indiening en de
      behandeling van, alsmede de beslissing op het verzoek.


