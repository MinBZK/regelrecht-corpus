  - number: '86'
    text: |-
      1 De vennootschap verschaft Onze Minister alle gegevens en inlichtingen die hij nodig heeft voor de uitvoering van
      deze wet.

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent de te verstrekken gegevens en inlichtingen en
      omtrent de wijze en het tijdstip waarop de gegevens en inlichtingen moeten worden verschaft.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel86
  - number: 86a
    text: |-
      1 De houder van een toewijzing zoekgebied aardwarmte en de op grond van [artikel 82, tweede lid][ref1],
      aangewezen vennootschap brengen een overeenkomst tot stand gericht op deelname door die aangewezen vennootschap
      in de voorgenomen werkzaamheden voor opsporing en winning van aardwarmte, tenzij Onze Minister bepaalt dat deze
      verplichting niet geldt.

      2 De overeenkomst wordt gesloten binnen een jaar na de verlening van de toewijzing zoekgebied aardwarmte. Onze
      Minister kan deze termijn eenmaal met ten hoogste een jaar verlengen.

      3 De overeenkomst en wijzigingen daarin behoeven de instemming van Onze Minister.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake de deelname en de
      overeenkomst, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel82
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel86a
