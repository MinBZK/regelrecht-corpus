  - number: '158'
    text: |-
      1 Voor de toepassing van [artikel 66, derde lid][ref1], op voor de inwerkingtreding van deze wet geleden verliezen,
      wordt het resultaat van de geconsolideerde winst- en verliesrekening, bedoeld in artikel 66, tweede lid, telkenjare
      berekend alsof consolidatie slechts heeft plaatsgevonden van resultaten behaald aan de zeezijde respectievelijk aan
      de landzijde.

      2 Nog te compenseren voor de inwerkingtreding van deze wet geleden verliezen aan de zeezijde respectievelijk aan
      de landzijde, worden slechts verrekend met de over een der jaren na de inwerkingtreding van deze wet overeenkomstig
      het eerste lid berekende geconsolideerde resultaten behaald aan de zeezijde respectievelijk aan de landzijde.

      3 Indien het resultaat van de geconsolideerde winst- en verliesrekening, bedoeld in [artikel 66, tweede lid][ref2],
      over een der jaren na de inwerkingtreding van deze wet negatief is, wordt dit verlies met inachtneming van de
      wettelijke termijn, bedoeld in [artikel 20, tweede lid, van de Wet op de vennootschapsbelasting 1969][ref3],
      slechts verrekend met het resultaat van de geconsolideerde winst- en verliesrekening, bedoeld in
      [artikel 66, tweede lid][ref4], over een der jaren na de inwerkingtreding van deze wet.

      4 Waar in dit artikel wordt gesproken over voor de inwerkingtreding van deze wet geleden verliezen wordt hieronder
      verstaan een negatief resultaat van een met inachtneming van de destijds toepasselijke voorschriften opgemaakte
      winst- en verliesrekening over een voor de inwerkingtreding van deze wet gelegen boekjaar.


