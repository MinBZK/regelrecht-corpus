  - number: 45a
    text: Deze paragraaf is van toepassing op de opsporing en winning van koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel45a
  - number: 45b
    text: |-
      1 Een exploitant van een productie-installatie stelt een rapport inzake grote gevaren op voor een productie-
      installatie en dient dit in bij de inspecteur-generaal der mijnen.

      2 Het rapport inzake grote gevaren behoeft de instemming van de inspecteur-generaal der mijnen voor zover het
      rapport ziet op een productie-installatie die is gelegen op het continentaal plat of in de territoriale zee en deze
      productie-installatie gelegen is aan de zeezijde van de in de bijlage bij deze wet vastgelegde lijn.

      3 Een rapport inzake grote gevaren voor een productie-installatie als bedoeld in het eerste lid kan, indien de
      inspecteur-generaal der mijnen daarmee instemt, voor een groep van installaties worden opgesteld.

      4 Een exploitant van een productie-installatie als bedoeld in het tweede lid start niet met activiteiten op
      productie-installaties of zet deze activiteiten niet voort, met uitzondering van verkenningsonderzoek, voordat
      de inspecteur-generaal der mijnen heeft ingestemd met het rapport inzake grote gevaren voor de desbetreffende
      productie-installaties.

      5 Bij ministeriële regeling worden regels gesteld over de indiening van en de instemming met het rapport inzake
      grote gevaren.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel45b
  - number: 45c
    text: |-
      1 Bij het rapport inzake grote gevaren worden in elk geval de volgende documenten gevoegd:

      a. het bedrijfsbeleid inzake het voorkomen van zware ongevallen, bedoeld in [artikel 45j][ref1];

      b. het veiligheids- en milieubeheerssysteem dat van toepassing is op de productie-installatie, bedoeld in
      [artikel 45k][ref2];

      c. een beschrijving van de regeling voor onafhankelijke verificatie, bedoeld in [artikel 45l][ref3].

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de inhoud van het rapport
      inzake grote gevaren, de wijze waarop dit rapport wordt opgesteld en de documenten die daarbij worden gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45j
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel45k
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel45l
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel45c
