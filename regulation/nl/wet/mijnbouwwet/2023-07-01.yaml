  - number: '114'
    text: |-
      1 Er is een Technische commissie bodembeweging.

      2 De commissie heeft tot taak om in verband met de gevolgen van mijnbouwactiviteiten voor beweging van de aardbodem
      en schade die daarvan het gevolg kan zijn:

      a. Onze Minister desgevraagd te adviseren over door hem te geven beschikkingen;

      b. Onze Minister desgevraagd de inlichtingen te verstrekken die nodig zijn voor de beoordeling van de
      uitvoerbaarheid van voorgenomen wettelijke voorschriften;

      c. degene bij wie schade is te verwachten door bodembeweging die redelijkerwijs het gevolg kan zijn van
      mijnbouwactiviteiten, desgevraagd kosteloos inlichtingen te verstrekken omtrent het verband tussen de bodembeweging
      en de mijnbouwactiviteiten;

      d. degene bij wie zaakschade is opgetreden door bodembeweging die redelijkerwijs het gevolg kan zijn van
      mijnbouwactiviteiten, desgevraagd advies te geven omtrent het verband tussen die schade en de mijnbouwactiviteiten
      alsmede de hoogte van het schadebedrag.

      3 Onze Minister vraagt in elk geval advies aan de commissie voordat hij op grond van [artikel 46][ref1] een bedrag
      waarvoor zekerheid moet worden gesteld, vaststelt of wijzigt.

      4 De commissie brengt aan Onze Minister advies uit omtrent bodembeweging als bedoeld
      [artikel 31b, onderdeel m][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel31b
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel114
    references:
      - id: ref1
