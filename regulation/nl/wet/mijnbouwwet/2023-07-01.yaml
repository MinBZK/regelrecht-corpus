  - number: 24i
    text: |-
      1 Een aanvraag om een toewijzing zoekgebied aardwarmte wordt geheel of gedeeltelijk afgewezen indien:

      a. het opsporen of winnen van aardwarmte in de in de aanvraag aangegeven aardlagen en de begrenzing ervan bij of
      krachtens wet niet is toegestaan;

      b. voor het zoekgebied al een toewijzing zoekgebied aardwarmte, een startvergunning aardwarmte of een
      vervolgvergunning aardwarmte geldt.

      2 Een aanvraag om een toewijzing zoekgebied aardwarmte kan geheel of gedeeltelijk worden afgewezen:

      a. in het belang van de planmatige ontwikkeling of het beheer van delfstoffen, aardwarmte, andere natuurlijke
      rijkdommen, waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van
      stoffen;

      b. indien het plan of de uitvoering ervan voor de wijze van opsporen en winnen van aardwarmte niet haalbaar wordt
      geacht;

      c. indien er onvoldoende zicht is op een warmtevraag die passend is bij de te verwachten winning van aardwarmte;

      d. indien het zoekgebied niet passend is bij de te verwachten warmtevraag;

      e. indien onvoldoende zicht is op de financiering van de opsporing en winning van aardwarmte.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de gronden, bedoeld in
      het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24i
  - number: 24j
    text: |-
      1 Indien er meer aanvragen om een toewijzing zoekgebied aardwarmte zijn ingediend die toegewezen zouden kunnen
      worden, verleent Onze Minister de toewijzing zoekgebied aardwarmte aan de aanvrager van wie de aanvraag het hoogst
      is gerangschikt.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de procedure van rangschikking, de
      rangschikkingscriteria en de onderlinge weging hiervan.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24j
  - number: 24k
    text: |-
      1 Een toewijzing zoekgebied aardwarmte geldt voor een periode van vier jaar. Onze Minister kan deze termijn op
      verzoek van de houder van een toewijzing zoekgebied aardwarmte eenmaal met een jaar verlengen.

      2 In afwijking van het eerste lid geldt de toewijzing zoekgebied aardwarmte, indien een aanvraag voor een
      startvergunning aardwarmte is ingediend, tot het moment waarop het besluit waarbij op deze aanvraag wordt beslist,
      onherroepelijk wordt.

      3 In afwijking van het eerste lid kan de houder van een toewijzing zoekgebied aardwarmte, wanneer hij gelet op de
      voorgenomen afzet van warmte en de afspraken hieromtrent voldoende vraag naar warmte aannemelijk kan maken, iedere
      keer wanneer een startvergunning aardwarmte wordt aangevraagd om een verlenging van de toewijzing zoekgebied vragen
      voor een periode van vier jaar.

      4 Onze Minister bepaalt in de toewijzing zoekgebied aardwarmte voor welke aardlagen en begrenzing daarvan een
      toewijzing zoekgebied aardwarmte geldt.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24k
  - number: 24l
    text: |-
      1 Onze Minister kan op aanvraag van een houder van een toewijzing zoekgebied aardwarmte, een toewijzing zoekgebied
      aardwarmte wijzigen of intrekken.

      2 Onze Minister kan op aanvraag van een houder van een toewijzing zoekgebied aardwarmte, een natuurlijke persoon of
      rechtspersoon als houder aan een toewijzing zoekgebied aardwarmte toevoegen.

      3 Onze Minister kan een toewijzing zoekgebied aardwarmte wijzigen of intrekken indien de bij de aanvraag verstrekte
      gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op de aanvraag een andere beslissing zou zijn
      genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren geweest.

      4 Onze Minister beslist op een aanvraag als bedoeld in het eerste of tweede lid binnen acht weken na ontvangst van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24l
  - number: 24m
    text: |-
      Indien meer dan één natuurlijke persoon of rechtspersoon een toewijzing zoekgebied aardwarmte houdt, worden zij
      gezamenlijk als houder van een toewijzing zoekgebied aardwarmte beschouwd.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24m
  - number: 24n
    text: |-
      Onze Minister verleent op aanvraag een startvergunning aardwarmte aan de houder van de toewijzing zoekgebied
      aardwarmte of aan de houder van de toewijzing zoekgebied aardwarmte en de uitvoerder aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24n
  - number: 24o
    text: |-
      1 Een aanvraag voor een startvergunning aardwarmte bevat een beschrijving van:

      a. de aardlagen en de begrenzing ervan waar de aanvrager voornemens is aardwarmte op te sporen en te winnen;

      b. de andere gebruiksmogelijkheden van het gebied, waaronder grondwater met het oog op de winning van drinkwater,
      of kenbare voornemens tot het opslaan van stoffen;

      c. de wijze waarop de aanvrager voornemens is aardwarmte op te sporen en te winnen en hoe hij voornemens is de
      putintegriteit te borgen;

      d. de verwachte bodembeweging ten gevolge van de winning;

      e. indien dit nodig is gelet op de verwachte bodembeweging:

      1°. de veiligheidsrisico’s voor omwonenden, het risico op schade aan gebouwen of infrastructurele werken of het
      risico op verstoring van de functionaliteit daarvan;

      2°. de maatregelen die worden genomen om bodembeweging te voorkomen of te beperken;

      3°. de maatregelen die worden genomen om schade door bodembeweging te voorkomen of te beperken;

      f. overeenkomsten met betrekking tot de afzet van warmte;

      g. de wijze waarop de aanvrager voornemens is de kosten in verband met de opsporing en winning en de hierbij
      behorende aansprakelijkheden, waaronder het stellen van financiële zekerheid, anders dan bedoeld in de
      [artikelen 46][ref1] en [47][ref2], ter dekking van de aansprakelijkheid voor de schade door verontreiniging van
      grondwater of bodem indien de in de aanvraag aangegeven aardlagen zich geheel of gedeeltelijk bevinden onder een
      gebied dat is aangewezen voor de winning van drinkwater uit grondwater, en het zo nodig geheel of gedeeltelijk
      buiten gebruik stellen van een boorgat tijdens of na afloop van de looptijd van de startvergunning te dragen;

      h. de ervaring van de aanvrager met de ontwikkeling van aardwarmteprojecten en andere mijnbouwactiviteiten.

      2 Een aanvraag voor een startvergunning aardwarmte gaat vergezeld van een aanvraag om instemming met de aanwijzing
      van een uitvoerder aardwarmte als bedoeld in [artikel 24z, derde lid][ref3].

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel24z
