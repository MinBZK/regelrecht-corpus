  - number: '124'
    text: |-
      1 Onze Minister zendt aan de Europese Commissie ieder jaar een verslag met gegevens over:

      a. de gebieden die voor het opsporen en winnen van koolwaterstoffen zijn vrijgegeven;

      b. de verleende vergunningen voor koolwaterstoffen;

      c. de houders van de verleende vergunningen voor koolwaterstoffen en de samenstelling van die houders;

      d. de geraamde reserves aan koolwaterstoffen.

      2 Onze Minister zendt het in het eerste lid bedoelde verslag tevens aan de beide kamers der Staten-Generaal en en
      geeft in de Staatscourant kennis van de terinzagelegging van het verslag.

      3 Onze Minister zendt aan de Europese Commissie om de drie jaar een verslag over het register, bedoeld in
      [artikel 31m][ref1], en andere door de Commissie opgevraagde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31m
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31m
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '125'
    text: |-
      1 Onze Minister zendt tweejaarlijks aan de beide kamers der Staten-Generaal een overzicht van aardgasactiviteiten.

      2 Het overzicht bevat tenminste:

      a. de aangevraagde, dan wel de verleende opsporings- en winningsvergunningen voorzover deze betrekking hebben op
      het opsporen of winnen van aardgas;

      b. de opgespoorde aardgasvoorkomens waarbij wordt aangegeven:

      1°. in welke vergunningsgebieden deze voorkomens zijn opgespoord en

      2°. of uit deze voorkomens aardgas wordt gewonnen en zo niet, wanneer daarmee wordt aangevangen;

      c. de omvang van de opgespoorde en overige aardgasreserves waarbij de aardgasreserves die in geologisch of
      geografisch opzicht met elkaar samenhangen afzonderlijk worden vermeld;

      d. een raming van de winning van aardgas per vergunninggebied, dan wel gebieden die in geologisch of geografisch
      opzicht met elkaar samenhangen over een periode van tien jaar, aanvangend met het jaar waarin het overzicht aan de
      beide kamers der Staten-Generaal wordt gezonden;

      e. de bestaande en toekomstige faciliteiten voor de ondergrondse opslag van aardgas;

      f. de winningsplannen, als bedoeld in [artikel 34][ref1], die zijn ingediend en waarvoor de instemming van Onze
      Minister is gegeven;

      g. de door Onze Minister vastgestelde operationele strategieën, bedoeld in [artikel 52d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel52d
