  - number: 97b
    text: |-
      1 Indien na toepassing van het slot van de eerste volzin van [artikel 93, eerste lid][ref1], in een ander
      voorkomen in het vergunningsgebied koolwaterstoffen worden aangetoond, kan Onze Minister besluiten dat alsnog een
      overeenkomst als bedoeld in [artikel 93][ref2] tot stand wordt gebracht. Deze paragraaf is van overeenkomstige
      toepassing op die overeenkomst, met dien verstande dat:

      a. de overeenkomst slechts betrekking heeft op dit andere voorkomen;

      b. de overeenkomst tot stand komt binnen een jaar na het besluit van Onze Minister.

      2 In afwijking van [artikel 146, vierde lid][ref3], kan Onze Minister op verzoek van de vennootschap in
      overeenstemming met de vergunninghouder besluiten dat deze paragraaf van overeenkomstige toepassing is op een
      winningsvergunning als bedoeld in [artikel 143, tweede lid][ref4], met dien verstande dat:

      a. de mijnbouwovereenkomst tot één of meer voorkomens van koolwaterstoffen in het vergunningsgebied kan worden
      beperkt;

      b. in de mijnbouwovereenkomst bepalingen kunnen worden opgenomen die afwijken van de [artikelen 94][ref5],
      [95][ref6], [96][ref7] en [97][ref8];

      c. de overeenkomst tot stand komt binnen een jaar na het besluit van Onze Minister.


