    text: |-
      1 Ten aanzien van een opslagvergunning zijn de [artikelen 14][ref1], [16][ref2], [17][ref3], [19][ref4],
      [21][ref5], met uitzondering van het vierde lid, en [22][ref6] van overeenkomstige toepassing.

      2 In afwijking van het eerste lid zijn op vergunningen voor permanent opslaan van CO uitsluitend de
      [artikelen 14][ref7], [16][ref8] en [22][ref9] van overeenkomstige toepassing.

      3 Ten aanzien van een vergunning voor opsporen van CO-opslagcomplexen zijn de
      [artikelen 9, eerste tot en met derde lid][ref10], [11, tweede, derde en vierde lid][ref11], [12][ref12],
      [13, tweede lid][ref13], [14][ref14], [16][ref15], [17][ref16], [18][ref17] met dien verstande dat voor
      «andere delfstoffen» wordt gelezen «andere stoffen», [19][ref18], [20][ref19] met dien verstande dat in het
      eerste lid, tweede volzin, voor «Artikel 7, tweede lid» wordt gelezen «Artikel 26, zesde en zevende lid»,
      [21, eerste, tweede, vierde, vijfde en zesde lid][ref20], en [22][ref21] van overeenkomstige toepassing.


