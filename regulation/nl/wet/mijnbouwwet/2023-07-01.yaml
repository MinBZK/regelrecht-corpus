  - number: '135'
    text: |-
      1 Er is een Waarborgfonds mijnbouwschade.

      2 Het waarborgfonds bezit rechtspersoonlijkheid en is gevestigd te 's-Gravenhage.

      3 Onze Minister is belast met het beheer van het waarborgfonds.

      4 Het waarborgfonds ontvangt:

      a. een door een mijnbouwondernemer jaarlijks verschuldigde bijdrage, op te leggen door Onze Minister, met
      inachtneming van bij algemene maatregel van bestuur te stellen regels;

      b. rentebaten die via het waarborgfonds zijn verkregen;

      c. het batig saldo van de laatstelijk afgesloten rekening van het waarborgfonds;

      d. andere inkomsten.

      5 Bij algemene maatregel van bestuur worden in elk geval regels gesteld omtrent:

      a. de maatstaf ter bepaling van de hoogte van de bijdrage, met inachtneming van:

      1°. de omvang van de mijnbouwactiviteiten van een mijnbouwondernemer aan de landzijde van de in de bijlage bij deze
      wet vastgelegde lijn,

      2°. de hoogte van de schadevergoedingen die de vijf voorafgaande jaren ten laste van het waarborgfonds zijn
      toegekend in verband met mijnbouwactiviteiten van de desbetreffende mijnbouwondernemer of diens rechtsvoorganger,

      3°. de aard van de desbetreffende mijnbouwactiviteiten, en

      4°. de in het waarborgfonds aanwezige baten in relatie tot de begrote uitgaven;

      b. het tijdstip waarop de bijdrage verschuldigd wordt, en

      c. de verschuldigdheid van rente als de bijdrage op een later tijdstip op een ander bedrag wordt vastgesteld.

      6 Niet in het jaar van ontvangst bestede gelden blijven in het waarborgfonds.

      7 Bij algemene maatregel van bestuur worden regels gesteld omtrent het vermogen van het waarborgfonds, mede
      met inachtneming van het totale bedrag aan schadevergoedingen dat mijnbouwondernemers gedurende in elk geval de
      laatste vijf jaar voorafgaande aan het tijdstip van inwerkingtreding van deze wet hebben betaald aan natuurlijke
      personen bij wie in die periode zaakschade is opgetreden als gevolg van door die mijnbouwondernemers verrichte
      mijnbouwactiviteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel135
  - number: '136'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de inrichting en de
      administratie van het waarborgfonds, alsmede het daarop uit te oefenen toezicht.

      2 Onze Minister doet jaarlijks verslag aan beide kamers der Staten-Generaal omtrent het over het waarborgfonds
      gevoerde beheer.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel136
  - number: '137'
    text: |-
      Onze Minister kent een natuurlijke persoon bij wie zaakschade is opgetreden als gevolg van mijnbouwactiviteiten op
      diens verzoek een schadevergoeding toe ten laste van het waarborgfonds, indien:

      a. de betrokken mijnbouwondernemer failliet is verklaard, surséance van betaling is verleend of ten aanzien van hem
      de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, of

      b. de betrokken mijnbouwondernemer heeft opgehouden te bestaan of is overleden, en

      c. de schade niet reeds geheel of gedeeltelijk uit anderen hoofde is vergoed.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel137
  - number: '138'
    text: |-
      1 Indien op het moment waarop zich een van de gebeurtenissen, genoemd in [137, onderdeel a of b][ref1],
      voordoet de persoon, bedoeld in de aanhef van dat artikel nog geen adviesaanvraag als bedoeld in
      [artikel 114, tweede lid, onderdeel d][ref2], had ingediend, dient die persoon alsnog een aanvraag in:

      a. uiterlijk drie maanden na het moment waarop de desbetreffende gebeurtenis zich heeft voorgedaan, of,

      b. als hij op dat moment nog niet met de schade bekend kon zijn, binnen drie maanden na het moment waarop hij met
      de schade bekend is geworden of redelijkerwijs bekend had kunnen zijn.

      2 De artikelen [117 tot en met 119][ref3] zijn van toepassing, met dien verstande dat de
      [artikelen 118, tweede lid][ref4], en [119, tweede en derde lid][ref5], voorzover betrekking hebbend op de
      mijnbouwondernemer, buiten toepassing blijven. De commissie zendt Onze Minister afschriften van de adviesaanvraag
      en het voorlopig advies.


