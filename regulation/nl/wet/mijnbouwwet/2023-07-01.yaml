  - number: 44b
    text: |-
      1 Als een mijnbouwwerk in aanmerking komt voor geheel of gedeeltelijk hergebruik of verwijdering tezamen met
      andere mijnbouwwerken kan Onze Minister tijdelijk ontheffing verlenen van de verplichting tot het overleggen van
      een verwijderingsplan en de verplichting tot verwijderen van het mijnbouwwerk. De ontheffing kan onder beperkingen
      worden verleend en aan de ontheffing kunnen voorschriften worden verbonden.

      2 Als Onze Minister verwijdering van het mijnbouwwerk tezamen met andere mijnbouwwerken of geheel of gedeeltelijk
      hergebruik van het mijnbouwwerk met het oogmerk waarvoor de ontheffing is verleend niet meer doelmatig acht, kan
      Onze Minister de ontheffing wijzigen of intrekken.

      3 Als Onze Minister de ontheffing intrekt, stelt Onze Minister een termijn voor het overleggen van een
      verwijderingsplan en kan Onze Minister een termijn stellen voor het verwijderen van het mijnbouwwerk.

      4 Onder hergebruik als bedoeld in het eerste lid wordt mede verstaan het opnieuw gebruiken van het mijnbouwwerk
      voor het doel waarvoor het mijnbouwwerk is opgericht.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel44b
  - number: 44c
    text: |-
      1 De houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25][ref2] verwijdert het mijnbouwwerk
      overeenkomstig het verwijderingsplan en de voorschriften die aan de instemming zijn verbonden.

      2 Als het verwijderingsplan is uitgevoerd, overlegt de houder van een vergunning aan Onze Minister een rapport over
      de verwijdering.

      3 Onze Minister neemt op aanvraag van de houder van een vergunning een besluit tot instemming met het rapport als
      de verwijdering heeft plaatsgevonden overeenkomstig het verwijderingsplan en de voorschriften die aan de instemming
      zijn verbonden.

      4 Als een mijnbouwwerk gedeeltelijk is verwijderd en een besluit tot instemming als bedoeld in het derde lid
      is genomen, rust de verplichting tot verwijderen van het resterende gedeelte van het mijnbouwwerk op de nieuwe
      exploitant.


