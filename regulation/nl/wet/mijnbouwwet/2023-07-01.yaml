  - number: 44a
    text: |-
      1 Het verwijderingsplan behoeft de instemming van Onze Minister. De instemming kan onder beperkingen worden
      verleend en aan de instemming kunnen voorschriften worden verbonden.

      2 Als een mijnbouwwerk volgens het verwijderingsplan geheel of gedeeltelijk wordt hergebruikt of slechts
      gedeeltelijk wordt verwijderd, neemt Onze Minister het besluit tot instemming niet, dan nadat advies met instemming
      is ontvangen van het bevoegde gezag dat bij of krachtens de [Omgevingswet][ref1] is aangewezen voor een activiteit
      waarvoor bij of krachtens de Omgevingswet een besluit van dat bevoegd gezag vereist is.

      3 Een advies met instemming wordt verleend met overeenkomstige toepassing van de regels die voor de activiteit,
      bedoeld in het tweede lid, bij of krachtens de [Omgevingswet][ref2] zijn bepaald.

      4 Als Onze Minister aan het verwijderingsplan instemming onthoudt, kan Onze Minister een termijn stellen voor het
      verwijderen van het mijnbouwwerk.

      5 Onze Minister kan op aanvraag het besluit tot instemming wijzigen. Het tweede en derde lid zijn van
      overeenkomstige toepassing.

      6 Onze Minister kan het besluit tot instemming:

      a. ambtshalve wijzigen indien:

      1°. de bij de aanvraag verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op de aanvraag
      een andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend
      waren geweest;

      2°. dit wordt gerechtvaardigd door een wijziging in de technische mogelijkheden van gehele of gedeeltelijke
      verwijdering of hergebruik van het mijnbouwwerk;

      3°. de wijziging of actualisatie van ondergeschikte aard is;

      b. ambtshalve intrekken indien:

      1°. de bij de aanvraag verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op de aanvraag
      een andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend
      waren geweest;

      2°. dit wordt gerechtvaardigd door een wijziging in de technische mogelijkheden van gehele of gedeeltelijke
      verwijdering of hergebruik van het mijnbouwwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0037885
