  - number: '164'
    text: |-
      1 Voor de bepaling van een oppervlakterecht als bedoeld in [paragraaf 5.1.1.2][ref1], met betrekking tot een
      opsporingsvergunning of een winningsvergunning als bedoeld in [artikel 143][ref2], wordt de vergunning geacht van
      kracht te zijn op het tijdstip waarop het besluit, bedoeld in artikel 143, eerste of tweede lid, waarvoor deze
      vergunning in de plaats komt, van kracht was.

      2 In een geval als bedoeld in het eerste lid wordt over het tijdvak vanaf de inwerkingtreding van deze wet tot de
      eerste 1 januari na de inwerkingtreding, het oppervlakterecht bepaald op een deel van het recht dat overeenkomstig
      [paragraaf 5.1.1.2][ref3] vastgesteld zou worden over het jaar van inwerkingtreding. Dit deel wordt bepaald
      op het deel dat is toe te rekenen aan het tijdvak vanaf de inwerkingtreding tot de eerste 1 januari na de
      inwerkingtreding. Het recht is verschuldigd op 1 april na de inwerkingtreding.

      3 In een geval als bedoeld in het tweede lid wordt op het verschuldigde recht in mindering gebracht een deel van
      het oppervlakterecht dat op grond van een van de in [artikel 168][ref4] genoemde wetten verschuldigd is over een
      tijdvak dat doorloopt na de inwerkingtreding van deze wet. Dit deel wordt bepaald op het deel dat is toe te rekenen
      aan het tijdvak na de inwerkingtreding.


