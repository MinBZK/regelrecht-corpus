  - number: 31g
    text: |-
      1 De houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door meerdere personen wordt
      gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref1] verstrekt ten minste elk jaar aan Onze Minister
      de volgende gegevens:

      a. de resultaten van de monitoring van de opgeslagen CO met vermelding van de gebruikte technologie,

      b. de hoeveelheden en kenmerken van de geleverde en opgeslagen CO-stromen met vermelding van de samenstelling van
      deze stromen,

      c. het bewijs dat financiële zekerheid of een gelijkwaardige voorziening is gesteld en aangehouden, en

      d. andere gegevens die Onze Minister van belang acht voor het beoordelen van de belangen genoemd in
      [artikel 27, eerste lid, onderdelen a, b en c, en derde lid, onderdeel b][ref2], en voor het vergroten van de
      kennis van het CO-gedrag in het opslagvoorkomen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gegevens, bedoeld in het
      eerste lid, en tijdstip van verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel27
