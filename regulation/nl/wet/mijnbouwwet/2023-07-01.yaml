      1 Het tarief is een percentage dat wordt bepaald op basis van het in totaal in het kalenderjaar in het
      vergunningsgebied gewonnen aantal eenheden. Het aantal eenheden aardolie wordt bepaald bij een druk van 101,325
      kPa en een temperatuur van 15 °C. Onder aardolie wordt condensaat mede begrepen. Het aantal eenheden aardgas wordt
      bepaald bij een druk van 101,325 kPa en een temperatuur van 0 °C en omgerekend naar eenheden met een calorische
      waarde van 35,1692 MJ/m3 bovenwaarde.

      2 Bij de bepaling van het aantal eenheden, bedoeld in het eerste lid, is [artikel 62, derde lid][ref1], van
      toepassing.

      3 Het percentage wordt opgebouwd door middel van een schijvensysteem overeenkomstig de navolgende tabellen en wordt
      berekend door:

      a. bij iedere schijf de hoeveelheid te bepalen die binnen die schijf valt en deze hoeveelheid te vermenigvuldigen
      met het percentage dat behoort bij die schijf;

      b. deze producten te sommeren, en

      c. deze som te delen door het totaal van het in het vergunningsgebied gewonnen aantal eenheden.

