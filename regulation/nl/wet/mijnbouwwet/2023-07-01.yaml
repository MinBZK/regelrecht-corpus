  - number: '26'
    text: |-
      1 Een opslagvergunning wordt niet verleend, voorzover deze bij het in werking treden zou gaan gelden voor een
      gebied waarvoor op dat tijdstip reeds een door een ander gehouden opslagvergunning geldt.

      2 Een opslagvergunning wordt evenmin verleend, voorzover deze bij het in werking treden zou gaan gelden voor een
      voorkomen waarvoor op dat tijdstip reeds een door een ander gehouden vergunning als bedoeld in [artikel 6][ref1]
      geldt of waarvoor een toewijzing zoekgebied aardwarmte, een startvergunning aardwarmte of een vervolgvergunning
      aardwarmte geldt.

      3 Ingeval aan een houder van een opsporings- of winningsvergunning voor koolwaterstoffen een opslagvergunning voor
      hetzelfde gebied en voor dezelfde stof is verleend, vervalt de opsporings- of winningsvergunning op het tijdstip
      waarop de verleende opslagvergunning onherroepelijk wordt.

      4 Met ingang van het tijdstip waarop een winningsvergunning als bedoeld in het derde lid vervalt, gelden de
      delfstoffen in het gebied waarvoor de winningsvergunning gold, als stoffen die na winning door de houder van de
      opslagvergunning, bedoeld in het derde lid, zijn opgeslagen en waarvan de eigendom bij hem berust.

      5 Het derde lid is niet van toepassing op een houder van een opsporings- of winningsvergunning voor
      koolwaterstoffen indien hem voor het tijdstip van inwerkingtreding van deze leden een onherroepelijke
      opslagvergunning voor hetzelfde gebied en voor dezelfde stof is verleend.

      6 In afwijking van het eerste lid wordt een vergunning voor het permanent opslaan van CO of een vergunning voor
      opsporen van CO-opslagcomplexen niet verleend voor zover de vergunning bij de inwerkingtreding ervan zou gaan
      gelden voor een CO-opslagcomplex waarvoor op dat tijdstip reeds een vergunning als bedoeld in [artikel 25][ref2]
      geldt, ongeacht wie de houder van de desbetreffende vergunning is.

      7 In afwijking van het tweede lid kan voor een voorkomen waarvoor een vergunning als bedoeld in [artikel 6][ref3]
      geldt, ten hoogste één vergunning voor permanent opslaan van CO of een vergunning voor het opsporen van CO-
      opslagcomplexen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel6
