        artikel: '114'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '117'
    text: |-
      1 Van de adviesaanvrager, bedoeld in [artikel 114, tweede lid, onderdeel d][ref1], wordt door het secretariaat van
      de commissie een bijdrage geheven.

      2 De bijdrage is:

      € 90 voor een natuurlijk persoon, en

      € 181 voor andere dan onder a bedoelde personen.

      3 Het advies wordt in behandeling genomen nadat de aanvrager het verschuldigde bedrag op een door het secretariaat
      te bepalen wijze heeft voldaan.

      4 Indien uit het advies blijkt dat de schade geheel of gedeeltelijk kan worden toegerekend aan
      mijnbouwactiviteiten, wordt de bijdrage terugbetaald aan de aanvrager. Dit geldt uitsluitend als het bedrag,
      genoemd in het advies van de commissie, hoger is dan het bedrag dat de mijnbouwondernemer bereid was te betalen
      naar aanleiding van de aansprakelijkstelling, bedoeld in [artikel 116][ref2].

      5 De in het tweede lid genoemde bedragen kunnen bij ministeriële regeling worden gewijzigd voorzover de
      consumentenprijsindex daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel116
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel117
