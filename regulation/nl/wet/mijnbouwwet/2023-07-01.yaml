    text: |-
      1 Deze wet is mede van toepassing op het continentaal plat.

      2 Deze wet, met uitzondering van [artikel 51][ref1], is met betrekking tot delfstoffen slechts van toepassing,
      voorzover de delfstoffen op een diepte van meer dan 100 meter beneden de oppervlakte van de aardbodem aanwezig
      zijn.

      3 Deze wet is met betrekking tot aardwarmte slechts van toepassing, voorzover de aardwarmte op een diepte van meer
      dan 500 meter beneden de oppervlakte van de aardbodem aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel51
