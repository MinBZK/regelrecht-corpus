  - number: '67'
    text: |-
      1 Tot het in [artikel 66, eerste lid][ref1], bedoelde resultaat worden in ieder geval gerekend:

      a. de waarde in het economische verkeer van de anders dan door verkoop aan het winningsbedrijf onttrokken
      koolwaterstoffen;

      b. de verschillen tussen de volgens goed koopmansgebruik gewaardeerde begin- en eindvoorraden;

      c. het resultaat dat is behaald met de verkoop van de winningsvergunning.

      2 Tot het in [artikel 66, eerste lid][ref2], bedoelde resultaat worden in ieder geval gerekend:

      a. de niet reeds ten laste van een andere winst- en verliesrekening gebrachte kosten van verkennings- en
      opsporingsonderzoeken die zijn verricht krachtens een opsporingsvergunning;

      b. afschrijving op de niet reeds ten laste van een andere winst- en verliesrekening gebrachte kosten, welke zijn
      gemaakt voordat de winningsvergunning is verleend.

      3 Tot het in [artikel 66, eerste lid][ref3], bedoelde resultaat worden niet gerekend:

      a. afschrijving op de koopsom ter zake van de overname van een opsporingsvergunning, voorzover deze koopsom de door
      de overdrager van die vergunning nog niet reeds ten laste van een winst- en verliesrekening gebrachte kosten te
      boven gaat;

      b. de waarde van de in het winningsbedrijf gewonnen en verbruikte koolwaterstoffen.

      4 Indien de inspecteur vooraf bij voor bezwaar vatbare beschikking, eventueel onder het stellen van nadere
      voorwaarden, heeft vastgesteld dat een rechtshandeling strekt tot het afdekken van een prijs- of koersrisico dat
      ter zake van gewonnen of te winnen koolwaterstoffen wordt gelopen, behoort het resultaat uit de desbetreffende
      rechtshandeling tot het in [artikel 66, eerste lid][ref4], bedoelde resultaat.


