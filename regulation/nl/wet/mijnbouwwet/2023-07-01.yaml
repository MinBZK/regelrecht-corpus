    text: |-
      1 Cijns wordt op aangifte voldaan.

      2 De houder, of, ingeval van medehouderschap, ieder van de medehouders, doet uiterlijk op 1 april volgend op het
      kalenderjaar waarover wordt geheven aangifte door de inlevering van een aangiftebiljet.
