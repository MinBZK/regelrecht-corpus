    text: |-
      Indien een afdracht aan de provincie op een later tijdstip op een ander bedrag wordt vastgesteld,
      wordt bij die latere vaststelling de rentederving in rekening gebracht die voor de betrokkene of voor
      de provincie uit die latere vaststelling voortvloeit. Daarbij wordt een enkelvoudige rente in rekening
      gebracht, waarvan het percentage gelijk is aan het percentage van de belastingrente, bedoeld in
      [artikel 30hb van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30hb
