        artikel: '17.16'
  - number: 24b
    text: |-
      Het is verboden zonder een startvergunning aardwarmte of een vervolgvergunning aardwarmte, aardwarmte op te sporen
      of te winnen.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24b
  - number: 24c
    text: |-
      1 Dit hoofdstuk, met uitzondering van [artikel 24b][ref1], is niet van toepassing op het opsporen of het winnen
      van aardwarmte in het kader van het verkrijgen van gegevens voor zuiver wetenschappelijk onderzoek of voor het door
      de centrale overheid te voeren beleid. Bij het nemen van een besluit omtrent een vergunning voor deze activiteiten
      sluit Onze Minister aan bij de bepalingen van dit hoofdstuk, voor zover dit met het bijzondere karakter van de
      vergunning te verenigen is.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het nemen van een besluit
      omtrent een vergunning, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24b
