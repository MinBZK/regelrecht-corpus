  - number: 24w
    text: |-
      1 Indien de in de aanvraag aangegeven aardlagen zich geheel of gedeeltelijk bevinden onder een gebied dat is
      aangewezen voor de winning van drinkwater uit grondwater, verbindt Onze Minister aan een startvergunning aardwarmte
      voorschriften of beperkingen in verband met het stellen van financiële zekerheid, anders dan bedoeld in de
      [artikelen 46][ref1] en [47][ref2], ter dekking van de aansprakelijkheid voor de schade door verontreiniging van
      grondwater of bodem in verband met de opsporing en winning van aardwarmte.

      2 Indien de in de aanvraag aangegeven aardlagen zich geheel of gedeeltelijk bevinden onder een gebied dat is
      aangewezen of gereserveerd bij of krachtens wet voor de winning van drinkwater uit grondwater, verbindt Onze
      Minister aan de startvergunning aardwarmte het voorschrift dat geen doorboring plaatsvindt door dat gebied

      3 Onze Minister verbindt aan een startvergunning aardwarmte voorschriften of beperkingen in verband met het
      voorkomen van nadelige gevolgen voor het milieu als gevolg van de wijze van winning en de wijze waarop de
      putintegriteit wordt geborgd.

      4 Onze Minister kan aan een startvergunning aardwarmte voorschriften of beperkingen verbinden in verband met:

      a. de veiligheid van omwonenden of het voorkomen van schade aan gebouwen of infrastructurele werken of de
      functionaliteit daarvan;

      b. het belang van de planmatige ontwikkeling of het beheer van delfstoffen, aardwarmte, andere natuurlijke
      rijkdommen, waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van
      stoffen;

      c. de financiële mogelijkheden van de aanvrager om de kosten in verband met de opsporing en winning en de
      hierbij behorende aansprakelijkheden, anders dan bedoeld in het eerste lid, te dragen en om kosten in verband
      met het geheel of gedeeltelijk buiten gebruik stellen van een boorgat tijdens of na afloop van de looptijd van de
      startvergunning te dragen.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld inzake de gronden, bedoeld in het
      derde lid, en kunnen nadere regels worden gesteld inzake de gronden, bedoeld in het eerste, tweede en vierde lid.


