  - number: 31k
    text: |-
      1 Met ingang van het tijdstip waarop een vergunning ingevolge [artikel 31j][ref1] is ingetrokken, is Onze Minister
      belast met:

      a. monitoring,

      b. corrigerende maatregelen en

      c. de preventieve en herstelmaatregelen, bedoeld in de [artikelen 17.12][ref2] en
      [17.13 van de Wet milieubeheer][ref3].

      2 Indien na het tijdstip, bedoeld in het eerste lid, lekkages van CO plaatsvinden:

      a. meldt Onze Minister de lekkages aan de Nederlandse emissieautoriteit en

      b. levert Onze Minister voor 1 mei van het daarop volgende kalenderjaar ten minste een aantal
      broeikasgasemissierechten als bedoeld in [artikel 1:1 van de Wet milieubeheer][ref4] in, dat overeenkomt met de
      hoeveelheid van de emissie ten gevolge van de lekkages.

      3 Met ingang van het tijdstip, bedoeld in het eerste lid, vervalt de verplichting de gestelde financiële zekerheid
      of een gelijkwaardige voorziening aan te houden.

      4 De monitoring betreft het niveau waarop lekkages of significante onregelmatigheden kunnen worden vastgesteld.
      Indien significante onregelmatigheden of dreiging daarvan worden vastgesteld, intensiveert Onze Minister de
      monitoring.

      5 Onze Minister verhaalt de kosten die samenhangen met het eerste lid en zijn ontstaan na intrekking van de
      vergunning op de voormalige houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door
      meerdere personen wordt gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref5] voor zover hij niet
      zorgvuldig heeft gehandeld in de periode voorafgaande aan de intrekking van de opslagvergunning.

      6 Bij of krachtens algemene maatregel van bestuur kunnen omtrent het eerste lid, onderdeel a, en het tweede lid
      regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31j
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel17.12
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel17.13
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel1.1
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Artikel22
