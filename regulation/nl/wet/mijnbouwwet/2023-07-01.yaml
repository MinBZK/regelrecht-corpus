  - number: 24aj
    text: |-
      1 Een aanvraag om vervolgvergunning aardwarmte wordt geheel of gedeeltelijk afgewezen indien:

      a. de in de aanvraag beschreven winning onaanvaardbare risico’s met zich brengt voor de veiligheid van omwonenden
      of onaanvaardbare schade kan veroorzaken aan gebouwen of infrastructurele werken of de functionaliteit daarvan;

      b. geen financiële zekerheid, anders dan bedoeld in de [artikelen 46][ref1] en [47][ref2], kan worden gesteld
      ter dekking van de schade door verontreiniging van grondwater of bodem in verband met de opsporing en winning van
      aardwarmte indien de in de aanvraag aangegeven aardlagen zich geheel of gedeeltelijk bevinden onder een gebied dat
      is aangewezen voor de winning van drinkwater uit grondwater.

      2 Een vervolgvergunning aardwarmte kan geheel of gedeeltelijk worden afgewezen:

      a. indien de in de aanvraag aangeduide wijze van winning niet geschikt wordt geacht om reden van de nadelige
      gevolgen voor het milieu;

      b. indien de invloedssfeer niet aansluit bij de door de aanvrager aangegeven aardlaag en de begrenzing ervan;

      c. in verband met de financiële mogelijkheden van de aanvrager om alle kosten in verband met de winning en de
      hierbij behorende aansprakelijkheden, anders dan bedoeld in het eerste lid, onderdeel b, te dragen;

      d. in verband met de financiële mogelijkheden van de aanvrager om de kosten in verband met het geheel of
      gedeeltelijk buiten gebruik stellen van een boorgat tijdens de looptijd van of na afloop van de vervolgvergunning
      te dragen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de gronden, bedoeld in
      het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
