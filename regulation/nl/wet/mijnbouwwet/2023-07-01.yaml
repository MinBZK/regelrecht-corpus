  - number: 26b
    text: |-
      1 Zodra een aanvraag om een opslagvergunning is ingediend, worden anderen in de gelegenheid gesteld om aanvragen om
      een opslagvergunning in te dienen voor hetzelfde gebied.

      2 Onze Minister plaatst hiertoe een uitnodiging in de Staatscourant. De uitnodiging maakt melding van het
      bepaalde in [artikel 17][ref1] dan wel, indien het permanent opslaan van CO betreft, van het bepaalde in
      [artikel 31c, derde tot en met vijfde lid][ref2].

      3 Anderen kunnen aanvragen indienen tot dertien weken na de dag van plaatsing van de uitnodiging in de
      Staatscourant.

      4 De procedure, bedoeld in het eerste tot en met het derde lid, wordt niet toegepast met betrekking tot:

      a. een aanvraag die wordt ingediend overeenkomstig het derde lid;

      b. vergunningen waarop [artikel 26, eerste of tweede lid][ref3], van toepassing is;

      c. een aanvraag voor een gebied waarvoor op grond van [artikel 26, zesde lid][ref4], geen vergunning zal kunnen
      worden verleend;

      d. een aanvraag voor een vergunning voor permanent opslaan van CO waarop [artikel 26a][ref5] van toepassing is.

      5 Het eerste tot en met het vierde lid, onderdeel a en c, is van overeenkomstige toepassing op een aanvraag voor
      een vergunning voor opsporen van CO-opslagcomplexen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel17
