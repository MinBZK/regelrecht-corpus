      1 Rondom een mijnbouwinstallatie geldt een veiligheidszone van 500 meter.

      2 Het is verboden zich te bevinden dan wel enig voorwerp te hebben of te doen hebben binnen een veiligheidszone,
      bedoeld in het eerste lid, anders dan ten behoeve van het op grond van een vergunning opsporen of winnen van
      delfstoffen, aardwarmte of het opslaan van stoffen.

      3 Bij ministeriële regeling wordt bepaald wanneer het verbod, bedoeld in het tweede lid, niet geldt.

      4 Onze Minister kan op verzoek een ontheffing verlenen van het verbod, bedoeld in het tweede lid.

      5 Aan de ontheffing kunnen voorschriften of beperkingen worden verbonden.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de aanvraag voor de ontheffing,
      wijziging of intrekking van de ontheffing.
