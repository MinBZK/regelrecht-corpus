  - number: '81'
    text: |-
      In deze afdeling wordt verstaan onder:

      a. de vennootschap: de vennootschap, bedoeld in [artikel 82, eerste lid][ref1];

      b. opsporingswerkzaamheden: werkzaamheden die op grond van een opsporingsvergunning worden of kunnen worden
      verricht of werkzaamheden die voortvloeien uit het doen van verkenningsonderzoeken naar de aanwezigheid van
      koolwaterstoffen binnen het vergunningsgebied, dan wel naar nadere gegevens omtrent die koolwaterstoffen;

      c. mijnbouwwerkzaamheden: winnings- en opsporingswerkzaamheden die op grond van een winningsvergunning worden
      of kunnen worden verricht of werkzaamheden die voortvloeien uit het doen van verkenningsonderzoeken naar
      de aanwezigheid van koolwaterstoffen binnen het vergunningsgebied, dan wel naar nadere gegevens omtrent die
      koolwaterstoffen;

      d. opsporingsovereenkomst: een overeenkomst van samenwerking tussen de houder van een opsporingsvergunning en de
      vennootschap inzake het verrichten van opsporingswerkzaamheden;

      e. mijnbouwovereenkomst: een overeenkomst van samenwerking tussen de houder van een winningsvergunning en de
      vennootschap inzake het verrichten van mijnbouwwerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel82
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '82'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
  - number: '82'
    text: |-
      1 In het belang van een doelmatige opsporing en winning, een planmatig beheer en een optimale afzet van
      koolwaterstoffen, wijst Onze Minister een naamloze of een besloten vennootschap met beperkte aansprakelijkheid,
      waarvan alle aandelen middellijk of onmiddellijk aan de staat behoren, aan, die tot taak heeft:

      a. het deelnemen in opsporingswerkzaamheden op grond van opsporingsovereenkomsten, overeenkomstig
      [paragraaf 5.2.2.][ref1] van deze afdeling;

      b. het deelnemen in mijnbouwwerkzaamheden op grond van mijnbouwovereenkomsten, overeenkomstig
      [paragraaf 5.2.3.][ref2] van deze afdeling, met inbegrip van daarmee rechtstreeks verbonden werkzaamheden,
      waaronder in ieder geval worden begrepen behandeling, transport en verkoop van de gewonnen koolwaterstoffen*;*

      c. het sluiten van overeenkomsten, bedoeld in [artikel 97d, eerste en derde lid][ref3], met inbegrip van
      daarmee rechtstreeks verbonden werkzaamheden, waaronder het begeleiden, bewaken en monitoren van het systeem van
      overeenkomsten, bedoeld in artikel 97d, eerste, tweede en derde lid;

      d. het verstrekken van inlichtingen aan Onze Minister over de vaststelling, toepassing en uitvoering van de
      overeenkomsten, bedoeld in [artikel 97d, eerste, tweede en derde lid][ref4], alsmede over de aard en omvang van de
      door een houder van een vergunning gestelde of te stellen financiële zekerheden;

      e. het verstrekken van inlichtingen aan Onze Minister, indien informatie over financiële zekerheden, informatie
      over zeggenschap dan wel andere informatie daartoe aanleiding geeft;

      f. het uitvoeren van de taken, het uitoefenen van de rechten en het voldoen aan de verplichtingen die voor
      de vennootschap voortvloeien uit de overeenkomst van samenwerking, bedoeld in artikel 11, eerste lid, van
      het koninklijk besluit van 30 mei 1963, nummer 39 (Stcrt. 126) en de daarmee verband houdende regelingen en
      overeenkomsten;

      g. Onze Minister desgevraagd de inlichtingen te verstrekken die nodig zijn voor de beoordeling van de
      uitvoerbaarheid van voorgenomen energiebeleid, in het bijzonder ten aanzien van opsporing, winning, beëindiging van
      opsporing en winning, alsmede het beheer en afzet van koolwaterstoffen.

      2 In het belang van kennisdeling en -borging wijst Onze Minister een naamloze of een besloten vennootschap met
      beperkte aansprakelijkheid, waarvan alle aandelen middellijk of onmiddellijk aan de staat behoren, aan, die tot
      taak heeft het deelnemen in werkzaamheden voor opsporing en winning van aardwarmte op grond van overeenkomsten,
      overeenkomstig [artikel 86a][ref5].

      3 Onverminderd het eerste lid, kunnen de vennootschap bij besluit van Onze Minister andere taken dan de taken,
      bedoeld in het eerste lid, worden opgedragen in het algemeen belang van het klimaat- en energiebeleid. Bij of
      krachtens algemene maatregel van bestuur worden de algemene belangen omschreven ten behoeve waarvan en de gevallen
      waarin Onze Minister de vennootschap een opdracht als bedoeld in de eerste volzin kan geven. Onze Minister kan aan
      een besluit tot het geven van een opdracht voorschriften en beperkingen verbinden.

      4 De vennootschap verricht middellijk of onmiddellijk geen andere activiteiten dan activiteiten ter uitvoering
      van de taken, bedoeld in het eerste en derde lid, tenzij Onze Minister daarmee heeft ingestemd. Onze Minister
      kan voorschriften en beperkingen verbinden aan zijn instemming. De instemming wordt slechts verleend indien die
      activiteiten en de uitvoering daarvan:

      a. nauw verwant zijn aan de activiteiten ter uitvoering van de taken, bedoeld in het eerste en derde lid,

      b. een goede uitvoering van die taken niet belemmeren of anderszins bemoeilijken, en

      c. mede het algemeen belang van het klimaat- en energiebeleid dienen.

      5 Onze Minister kan een besluit tot het geven van een opdracht als bedoeld in het derde lid onderscheidenlijk een
      besluit tot instemming als bedoeld in het vierde lid intrekken of wijzigen indien niet meer wordt voldaan aan de
      voorwaarden voor het geven van die opdracht onderscheidenlijk het verlenen van die instemming als bedoeld in het
      derde onderscheidenlijk het vierde lid.


