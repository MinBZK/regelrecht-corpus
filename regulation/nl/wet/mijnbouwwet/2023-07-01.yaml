  - number: 45d
    text: |-
      1 Een exploitant van een productie-installatie herziet om de vijf jaar het rapport inzake grote gevaren en brengt
      de resultaten van de herziening ter kennis van de inspecteur-generaal der mijnen.

      2 De inspecteur-generaal der mijnen kan bepalen dat de herziening eerder geschiedt.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel45d
  - number: 45e
    text: |-
      1 In het geval van een essentiële wijziging van een productie-installatie of van ontmanteling van een productie-
      installatie, dient de exploitant van deze productie-installatie een gewijzigd rapport inzake grote gevaren in bij
      de inspecteur-generaal der mijnen.

      2 De geplande wijzigingen of de ontmanteling worden niet uitgevoerd voordat de inspecteur-generaal der mijnen heeft
      ingestemd met het gewijzigd rapport inzake grote gevaren voor zover het een productie-installatie betreft die is
      gelegen op het continentaal plat of in de territoriale zee, voor zover deze productie-installatie is gelegen aan de
      zeezijde van de in de bijlage bij deze wet vastgestelde lijn.

      3 Bij ministeriële regeling worden regels gesteld over de indiening van en de instemming met het gewijzigd rapport
      inzake grote gevaren.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel45e
  - number: 45f
    text: |-
      1 Een eigenaar van een niet-productie-installatie stelt een rapport inzake grote gevaren op voor de niet-productie-
      installatie en dient het bij de inspecteur-generaal der mijnen.

      2 Het rapport inzake grote gevaren behoeft de instemming van de inspecteur-generaal der mijnen.

      3 Een eigenaar van een niet-productie-installatie start niet met activiteiten op een niet-productie-installatie,
      waaronder gecombineerde activiteiten of boorgatactiviteiten, met uitzondering van verkenningsonderzoek, of zet
      deze activiteiten niet voort voordat de inspecteur-generaal der mijnen heeft ingestemd met het rapport inzake grote
      gevaren voor de betreffende niet-productie-installatie.

      4 Bij ministeriële regeling worden regels gesteld over de indiening van en de instemming met het rapport inzake
      grote gevaren.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel45f
  - number: 45g
    text: |-
      1 Bij het rapport inzake grote gevaren worden in elke geval de volgende documenten gevoegd:

      a. het bedrijfsbeleid inzake het voorkomen van zware ongevallen, bedoeld in [artikel 45j][ref1];

      b. het veiligheids- en milieubeheerssysteem dat van toepassing is op de niet-productie-installatie, bedoeld in
      [artikel 45k][ref2];

      c. een beschrijving van de regeling voor onafhankelijke verificatie, bedoeld in [artikel 45l][ref3].

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de inhoud van het rapport
      inzake grote gevaren, de wijze waarop dit rapport moet worden opgesteld en de documenten die daarbij worden
      gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45j
