  - number: '105'
    text: |-
      1 Er is een Mijnraad.

      2 De Mijnraad heeft tot taak om in verband met het opsporen of winnen van delfstoffen of aardwarmte, dan wel het
      opslaan van stoffen:

      a. Onze Minister desgevraagd te adviseren over door hem te geven beschikkingen;

      b. Onze Minister desgevraagd de inlichtingen te verstrekken die nodig zijn voor de beoordeling van de
      uitvoerbaarheid van voorgenomen wettelijke voorschriften en algemene beleidsvoornemens.

      3 Onze Minister vraagt in elk geval advies aan de Mijnraad inzake door hem te geven beschikkingen inzake:

      a. de verlening of intrekking van een vergunning als bedoeld in [artikel 6, eerste lid][ref1], of
      [25, eerste lid][ref2];

      b. een instemming met een winningsplan als bedoeld in [artikel 34, derde lid][ref3], voor zover het winnen van
      delfstoffen niet geschiedt in het continentaal plat;

      c. een besluit tot wijziging van een instemming met een winningsplan en een besluit tot instemming met een
      gewijzigd of geactualiseerd winningsplan, voor zover het winnen van delfstoffen niet geschiedt in het continentaal
      plat, tenzij de wijziging of actualisatie van ondergeschikte aard is omdat deze naar het oordeel van Onze Minister
      niet leidt tot een andere beoordeling van:

      1°. de effecten van de wijze van winning alsmede de daarmee verband houdende activiteiten,

      2°. de effecten van de bodembeweging ten gevolge van de winning en de maatregelen ter voorkoming van schade door
      bodembeweging,

      3°. de risico’s voor omwonenden, gebouwen of infrastructurele werken of de functionaliteit daarvan;

      d. een vaststelling van een operationele strategie als bedoeld in [artikel 52d, eerste lid][ref4];

      e. de verlening of intrekking van een startvergunning aardwarmte;

      f. de verlening of intrekking van een vervolgvergunning aardwarmte indien hiervoor de procedure, bedoeld in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref5], wordt gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel52d
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
