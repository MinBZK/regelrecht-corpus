  - number: '12'
    text: |-
      1 In een opsporingsvergunning wordt bepaald binnen welke tijdvakken nadat de vergunning onherroepelijk is geworden,
      de in de vergunning aangegeven opsporingsactiviteiten dienen te worden verricht. In de vergunning kan tevens worden
      bepaald binnen welke tijdvakken nadat de vergunning onherroepelijk is geworden, de in de vergunning aangegeven
      verkenningsonderzoeken dienen te worden verricht.

      2 In een vergunning voor opsporing en winning van koolwaterstoffen wordt de omvang van de middelen bepaald die de
      houder van de vergunning verplicht is aan te houden om te voldoen aan financiële verplichtingen die voort kunnen
      vloeien uit aansprakelijkheden voor schade door zware ongevallen met mijnbouwwerken.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel12
  - number: '13'
    text: |-
      Een vergunning kan onder andere beperkingen dan die bedoeld in [artikel 11][ref1] worden verleend of aan een
      vergunning kunnen andere voorschriften dan die bedoeld in de [artikelen 12][ref2] en [98][ref3] worden verbonden
      uitsluitend in verband met:

      a. de manier waarop de aanvrager voornemens is de activiteiten voor opsporing of winning te verrichten, waaronder
      de bij die activiteiten te gebruiken technieken, hulpmiddelen of stoffen,

      b. bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 4.3, eerste lid][ref4], of
      [10.8, eerste lid, van de Wet ruimtelijke ordening][ref5] voor gebieden op land, respectievelijk in de territoriale
      zee, bedoeld in [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref6], gestelde regels
      over de opsporing of winning van een delfstof door middel van een opsporings- of winningsinstallatie,

      c. bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 49][ref7] gestelde regels over:

      1°. het geheel of gedeeltelijk uitsluiten van een gebied van de opsporing of winning van een delfstof,

      2°. de diepte waarop een activiteit plaatsvindt,

      3°. de soort activiteit, of

      4°. de soort delfstof,

      d. de veiligheid voor omwonenden of het voorkomen van schade aan gebouwen of infrastructurele werken of de
      functionaliteit daarvan,

      e. het planmatig gebruik of beheer van delfstoffen, andere natuurlijke rijkdommen, waaronder grondwater met het oog
      op de winning van drinkwater, of mogelijkheden tot opslaan van stoffen,

      f. de nadelige gevolgen die voor het milieu worden veroorzaakt,

      g. de nadelige gevolgen die voor de natuur worden veroorzaakt, of

      h. het belang van de landsverdediging.


