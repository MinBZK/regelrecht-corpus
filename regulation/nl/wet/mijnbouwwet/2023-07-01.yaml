  - number: '143'
    text: |-
      1 Als opsporingsvergunning wordt beschouwd:

      a. een vergunning verleend krachtens [artikel 2 van de Wet opsporing delfstoffen][ref1];

      b. een opsporingsvergunning verleend krachtens [artikel 2 van de Mijnwet continentaal plat][ref2];

      c. een ontheffing verleend krachtens [artikel 2 van de Mijnwet continentaal plat][ref3], indien deze uitsluitend
      betrekking heeft op onderzoekingen die kunnen leiden tot het aantonen van de aanwezigheid van delfstoffen.

      2 Als winningsvergunning wordt beschouwd:

      a. een concessie verleend krachtens [artikel 5 van de wet van 21 april 1810 (Bulletin des Lois no. 285)][ref4];

      b. een aanwijzing van een mijn bij of krachtens de
      [wet van 24 juni 1901, betreffende exploitatie van Staatswege van steenkolenmijnen in Limburg (Stb. 170)][ref5],
      de [wet van 18 juni 1918 tot ontginning van steenzout bij Buurse (Stb. 421)][ref6] of de
      [wet van 27 september 1920 tot uitbreiding van het Staatsmijnveld (Stb. 752)][ref7];

      c. een winningsvergunning verleend krachtens [artikel 2 van de Mijnwet continentaal plat][ref8];

      d. een ontheffing verleend krachtens [artikel 2 van de Mijnwet continentaal plat][ref9], indien deze betrekking
      heeft of mede betrekking heeft op het winnen van delfstoffen.

      3 De voorwaarden, beperkingen of voorschriften, verbonden aan een besluit als bedoeld in het eerste lid, onderdelen
      a tot en met c, gaan gelden als aan de opsporingsvergunning verbonden beperkingen of voorschriften. De voorwaarden,
      beperkingen of voorschriften, verbonden aan een besluit als bedoeld in het tweede lid, onderdelen a tot en met d,
      gaan gelden als aan de winningsvergunning verbonden beperkingen of voorschriften.

      4 In afwijking van [artikel 3][ref10] is de houder van een vergunning die ingevolge het tweede lid, aanhef en
      onderdeel a of b, als een winningsvergunning wordt beschouwd, voor het tijdvak waarvoor de vergunning geldt
      eigenaar van de mijn waarop zij betrekking heeft. Als een overeenkomst met de vennootschap tot stand is gekomen
      als bedoeld in [artikel 3, tweede lid][ref11], geldt dat tweede lid voor de vennootschap onverminderd, zodra de
      delfstoffen zijn gewonnen, tenzij in de overeenkomst een verdeling van de financiële opbrengst is overeengekomen.

      5 Als mijnbouwmilieuvergunning wordt beschouwd:

      a. een goedkeuring verleend overeenkomstig artikel 4.6 of 5.7 van de Regeling vergunningen en concessies
      delfstoffen Nederlands territoir 1996, of een soortgelijke goedkeuring op basis van voor de inwerkingtreding van
      die regeling verleende vergunningen of concessies;

      b. een vergunning verleend krachtens [artikel 30a van het Mijnreglement continentaal plat][ref12].

      6 In afwijking van het vijfde lid wordt de goedkeuring of de vergunning die betrekking heeft op een inrichting
      waarop bij de inwerkingtreding van deze wet [hoofdstuk 8 van de Wet milieubeheer][ref13] van toepassing is,
      niet beschouwd als een mijnbouwmilieuvergunning maar als een milieuvergunning als bedoeld in dat hoofdstuk. Deze
      milieuvergunning wordt, indien [artikel 153, derde lid][ref14], op de inrichting van toepassing is, samen met de in
      dat lid bedoelde milieuvergunning als één milieuvergunning beschouwd.

      7 De beperkingen of voorschriften die aan een goedkeuring of een vergunning als bedoeld in het vijfde lid zijn
      verbonden, gaan gelden als aan de mijnbouwmilieuvergunning of aan de milieuvergunning verbonden beperkingen of
      voorschriften.

      8 Een houder van een winningsvergunning als bedoeld in het tweede lid, onderdeel a, die voor 1965 is verleend
      voor het winnen van koolwaterstoffen, die met toepassing van [artikel 20, eerste lid][ref15], een deel van zijn
      vergunning op een ander wil doen overgaan, dient in afwijking van artikel 20, tweede lid, tevens een aanvraag in
      tot afsplitsing van dat deel van die vergunning. Bij een afsplitsing wordt de vergunning uitsluitend gewijzigd
      door van het gebied waarop die vergunning betrekking heeft, af te splitsen een gebiedsdeel dat de vergunninghouder
      wil doen overgaan op een ander en wordt aan deze vergunninghouder voor het afgesplitste gebiedsdeel een
      winningsvergunning verleend die niet als een winningsvergunning als bedoeld in het tweede lid, onderdeel a, wordt
      beschouwd.

      9 Aan de winningsvergunning voor het afgesplitste gebiedsdeel worden de beperkingen en voorschriften verbonden die
      zijn verbonden aan de winningsvergunning waarvan dat gebiedsdeel is afgesplitst, voor zover dit verenigbaar is met
      het bij en krachtens de wet bepaalde.

      10 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het afsplitsen van een
      winningsvergunning als bedoeld in het tweede lid, onderdeel a, die voor 1965 is verleend voor het winnen van
      koolwaterstoffen met betrekking tot de bepaling van het af te splitsen gebied en het aan de afsplitsing aanpassen
      van beperkingen die zijn gesteld of voorschriften die aan de vergunning zijn verbonden, mede met het oog op het
      planmatig beheer of gebruik van delfstoffen, aardwarmte, andere natuurlijke rijkdommen, waaronder grondwater met
      het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van stoffen.

      11 Een overeenkomst als bedoeld in [artikel 147, eerste en tweede lid][ref16], blijft door een afsplitsing van
      een winningsvergunning, ongewijzigd in stand voor het gebied waarop de winningsvergunning waarvan een deel is
      afgesplitst betrekking heeft en vervalt voor het afgesplitste gebiedsdeel op het tijdstip dat de daarvoor verleende
      winningsvergunning in werking treedt.

      12 Een afsplitsing van een winningsvergunning en een voor een afgesplitst gebiedsdeel verleende winningsvergunning,
      treden niet eerder in werking dan op het tijdstip waarop de voor het afgesplitste gebiedsdeel verleende
      winningsvergunning onherroepelijk op een ander overgaat.

      13 Op een houder van een voor een afgesplitst gebiedsdeel verleende winningsvergunning, is ten aanzien van die
      vergunning het vierde lid van overeenkomstige toepassing en is [paragraaf 5.2.3][ref17] niet van toepassing.


