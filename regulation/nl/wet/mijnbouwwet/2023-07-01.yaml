  - number: '85'
    text: |-
      Onze Minister kan de vennootschap aanwijzingen geven in het belang van een goede vervulling van de in
      [artikel 82, eerste, tweede en derde lid][ref1], bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel82
