      1 De houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25][ref2] meldt binnen vier weken nadat
      een mijnbouwwerk buiten werking is, aan Onze Minister om welke reden het mijnbouwwerk buiten werking is en welke
      maatregelen zijn of worden genomen, tenzij het mijnbouwwerk tijdelijk buiten werking is in een geval dat krachtens
      [artikel 49, vierde lid][ref3], is aangewezen.

      2 De houder van een vergunning verwijdert een mijnbouwwerk dat buiten werking is, tenzij het mijnbouwwerk tijdelijk
      buiten werking is in een geval als bedoeld in het eerste lid.

      3 De houder van een vergunning overlegt binnen een jaar nadat een mijnbouwwerk buiten werking is, aan Onze Minister
      een verwijderingsplan, tenzij het mijnbouwwerk tijdelijk buiten werking is in een geval als bedoeld in het eerste
      lid.

      4 De verplichtingen, bedoeld in het tweede en derde lid, zijn mede van toepassing op het verwijderen van
      verontreinigde grond, verontreinigd grondwater, verontreinigingen op of in oppervlaktewater, afval, waaronder
      schroot, en andere materialen, die in het gebied of in de naaste omgeving van het mijnbouwwerk zijn terechtgekomen
      bij het aanleggen of exploiteren van het mijnbouwwerk.

      5 Het eerste, tweede en derde lid, zijn van overeenkomstige toepassing op een gedeelte van een mijnbouwwerk,
      waaronder een boorgat, dat buiten werking is in de gevallen, die krachtens [artikel 49, vierde lid][ref4], zijn
      aangewezen.


