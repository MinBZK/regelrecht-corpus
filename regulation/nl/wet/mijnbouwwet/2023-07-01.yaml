  - number: 5a
    text: |-
      Onze Minister draagt zorg voor de instelling van een onafhankelijk wetenschappelijk kennisprogramma, waarin de
      inbreng van nationale en internationale wetenschappers en deskundigen is geborgd.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel5a
  - number: '6'
    text: |-
      Het is verboden zonder vergunning van Onze Minister:

      a. delfstoffen op te sporen;

      b. delfstoffen te winnen.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel6
  - number: 6a
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van een besluit inzake
      de aanvraag om een vergunning als bedoeld in [artikel 6, onderdeel a][ref2], voor het opsporen van koolwaterstoffen
      in het continentaal plat of onder de territoriale zee.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel6
