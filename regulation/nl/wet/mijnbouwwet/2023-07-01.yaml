  - number: '102'
    text: |-
      1 Voorzover twijfel bestaat of degene die ingevolge dit hoofdstuk een afdracht aan de staat verschuldigd zal worden
      deze zal voldoen, kan Onze Minister bepalen dat de betrokkene zekerheid stelt voor de voldoening van de afdracht.

      2 Het bedrag en de termijn waarvoor en het tijdstip en de wijze waarop de zekerheid wordt gesteld, dienen ten
      genoegen van Onze Minister te zijn.

      3 De verplichtingen van dit artikel blijven na afloop van de vergunning van kracht, tenzij eerder aan de
      betalingsverplichtingen is voldaan.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel102
  - number: '103'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen in ieder geval nadere regels worden gesteld omtrent:

      a. de uitvoering van dit hoofdstuk;

      b. afdrachten in verband met andere vergunningen dan die tot het opsporen en het winnen van koolwaterstoffen.

      2 De voordracht voor een krachtens het eerste lid, onderdeel b, vast te stellen algemene maatregel van bestuur
      wordt niet eerder gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel103
  - number: '104'
    text: |-
      Dit hoofdstuk is niet van toepassing ten aanzien van vergunningen als bedoeld in de [artikelen 24][ref1] en
      [24c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel24c
