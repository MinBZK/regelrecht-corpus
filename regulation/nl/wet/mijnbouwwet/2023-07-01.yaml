  - number: 31d
    text: |-
      1 Een vergunning voor permanent opslaan van CO omvat ten minste de volgende onderwerpen:

      a. het tijdvak van injectie van CO en het gebied,

      b. de ligging en begrenzing van het opslagvoorkomen en het gebied van het opslagcomplex,

      c. gegevens met betrekking tot de hydraulische eenheid,

      d. voorschriften voor het opslagproces,

      e. de totale hoeveelheid CO die overeenkomstig de vergunning ten hoogste kan worden opgeslagen,

      f. de grenswaarden van de druk van de opgeslagen CO,

      g. de maximum toelaatbare snelheid en druk bij injectie van CO en de maximaal toelaatbare druk van het opgeslagen
      CO,

      h. risicobeheer,

      i. monitoring,

      j. afsluiting,

      k. corrigerende maatregelen,

      l. bodembeweging,

      m. de samenstelling van de CO-stroom die wordt opgeslagen met inbegrip van stoffen die worden toegevoegd ten
      behoeve van de monitoring en de controle van CO-migratie, en

      n. het bedrag aan financiële zekerheid of een gelijkwaardige voorziening.

      2 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] met uitzondering van [artikel 3:18][ref2] is van
      toepassing op de voorbereiding van het besluit over een vergunning voor permanent opslaan van CO, voor zover de
      opslag niet geschiedt in het continentaal plat of onder de territoriale zee in een opslagvoorkomen dat is gelegen
      aan de zeezijde van de in de bijlage bij deze wet vastgelegde lijn. Zienswijzen kunnen naar voren worden gebracht
      door een ieder. Afdeling 3.4 van de Algemene wet bestuursrecht is niet van toepassing indien het een besluit
      betreft inzake wijziging van een besluit omtrent een vergunning als bedoeld in het eerste lid.

      3 Bij of krachtens algemene maatregel van bestuur kunnen omtrent het eerste lid regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel318
