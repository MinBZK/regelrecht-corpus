  - number: '55'
    text: |-
      1 Een wijziging in [paragraaf 5.1.1.2.][ref1], met uitzondering van een wijziging die het gevolg is van toepassing
      van [artikel 58, derde lid][ref2], is niet van toepassing op de houder van een voor de inwerkingtreding van die
      wijziging verleende opsporingsvergunning, tenzij die houder om toepassing van de gewijzigde paragraaf verzoekt.

      2 Een wijziging in [paragraaf 5.1.1.2.][ref3], met uitzondering van een wijziging die het gevolg is
      van toepassing van [artikel 58, derde lid][ref4], in [paragraaf 5.1.1.3.][ref5], met uitzondering van
      [artikel 63, zesde en zevende lid][ref6], of in [paragraaf 5.1.1.4.][ref7], met uitzondering van
      [artikel 68, eerste lid][ref8], is niet van toepassing op de houder van een voor de inwerkingtreding van die
      wijziging verleende winningsvergunning, tenzij die houder om toepassing van de gewijzigde paragrafen verzoekt.

      3 Een verzoek, als bedoeld in het eerste en tweede lid, wordt schriftelijk bij Onze Minister ingediend binnen drie
      maanden na de dag waarop die wijziging in werking is getreden.

      4 Onze Minister geeft aan een verzoek, als bedoeld in het eerste en tweede lid, gevolg, tenzij naar zijn oordeel
      het algemeen belang zich daartegen verzet.


