  - number: '83'
    text: |-
      1 Indien de vennootschap activiteiten als bedoeld in [artikel 82, vierde lid][ref1], verricht, is zij verplicht,
      al dan niet op geconsolideerde basis, een afzonderlijke boekhouding te voeren voor die activiteiten enerzijds en de
      activiteiten ter uitvoering van haar taken, bedoeld in [artikel 82, eerste, tweede en derde lid][ref2], anderzijds.

      2 De afzonderlijke boekhouding is zodanig ingericht dat:

      a. de registratie van de lasten en baten van de verschillende activiteiten gescheiden zijn;

      b. alle lasten en baten, op grond van consequent toegepaste en objectief te rechtvaardigen beginselen inzake
      kostprijsadministratie, correct worden toegerekend;

      c. de beginselen inzake kostprijsadministratie volgens welke de boekhouding wordt gevoerd, duidelijk zijn
      vastgelegd.

      3 De baten die de vennootschap behaalt met de uitvoering van de taken, bedoeld in
      [artikel 82, eerste, tweede of derde lid][ref3], worden niet gebruikt voor financiering van de activiteiten,
      bedoeld in [artikel 82, vierde lid][ref4].

      4 De vennootschap verricht activiteiten als bedoeld in [artikel 82, vierde lid][ref5], tegen marktconforme tarieven
      en voorwaarden en op basis van een integrale doorberekening van alle kosten.


