  - number: 52c
    text: |-
      1 Onze Minister zendt de raming, bedoeld in [artikel 10a, eerste lid, onderdeel q, van de Gaswet][ref1], aan de
      houder van de winningsvergunning Groningenveld.

      2 De houder van de winningsvergunning Groningenveld stelt op verzoek van Onze Minister, met inachtneming van de
      raming en gelet op het belang van het minimaliseren van de inzet van het Groningenveld en op het minimaliseren van
      de verwachte bodembeweging, één of meerdere operationele strategieën voor over de inzet van het Groningenveld.

      3 Een operationele strategie bevat tenminste een voorstel voor de verdeling van de winning over de clusters in
      volume en tijd.

      4 De houder van de winningsvergunning verstrekt ter onderbouwing van een operationele strategie:

      a. de optimale inzet van de gasopslag Norg;

      b. een analyse van de verwachte bodembeweging op regioniveau;

      c. een analyse van de risico’s van de verwachte bodembeweging voor omwonenden, gebouwen of infrastructurele werken
      of de functionaliteit daarvan.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het voorstel voor de operationele strategie
      en de onderbouwing daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel52c
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 10a
  - number: 52d
    text: |-
      1 Onze Minister stelt de operationele strategie voor het Groningenveld vast.

      2 Onze Minister betrekt bij de vaststelling het veiligheidsbelang en het maatschappelijk belang dat verbonden is
      aan het niet kunnen voorzien van eindafnemers van de benodigde hoeveelheid laagcalorisch gas en kijkt hierbij in
      het bijzonder:

      a. in hoeverre wordt voldaan aan de veiligheidsnorm van 10-5;

      b. in hoeverre de leveringszekerheid van verschillende categorieën eindafnemers wordt geborgd;

      c. naar het tempo van de afbouw van de vraag;

      d. naar het tempo van versterken van gebouwen;

      e. naar maatschappelijke ontwrichting als gevolg van bodembeweging veroorzaakt door de winning van gas uit het
      Groningenveld;

      f. naar maatschappelijke ontwrichting als gevolg van het afsluiten van verschillende categorieën eindafnemers.

      3 Bij ministeriële regeling worden nadere regels gesteld over de invulling van de veiligheidsnorm van 10-5 en de
      verschillende categorieën eindafnemers.

      4 Onze Minister kan de operationele strategie wijzigen indien dat gerechtvaardigd wordt door het veiligheidsbelang
      of het maatschappelijk belang dat verbonden is aan het niet kunnen voorzien van eindafnemers van de benodigde
      hoeveelheid laagcalorisch gas.

      5 Onze Minister motiveert bij de vaststelling, als bedoeld in tweede en vierde lid, voor een ieder inzichtelijk en
      navolgbaar op welke wijze een zwaarwegend belang is toegekend aan de veiligheidsrisico’s voor omwonenden als gevolg
      van bodembeweging veroorzaakt door de winning van gas uit het Groningenveld.

      6 Onze Minister stelt in de gelegenheid binnen zes weken advies uit te brengen over de voorbereiding van een
      besluit als bedoeld in het eerste lid:

      a. gedeputeerde staten van een provincie binnen het gebied waarop de operationele strategie betrekking heeft;

      b. burgemeesters en wethouders van een gemeente binnen het gebied waarop de operationele strategie betrekking
      heeft;

      c. het dagelijks bestuur van een waterschap binnen het gebied waarop de operationele strategie betrekking heeft.

      7 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van een besluit als
      bedoeld in het eerste lid, met dien verstande dat zienswijzen naar voren kunnen worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel52d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 52e
    text: |-
      1 De houder van de winningsvergunning Groningenveld meldt een te verwachten langdurige en substantiële afwijking
      van de operationele strategie aan Onze Minister.

      2 Onze Minister kan aan de houder van de winningsvergunning Groningenveld in aanvulling op of in afwijking van de
      operationele strategie een tijdelijke maatregel opleggen indien:

      a. uit een melding als bedoeld in [artikel 10a, elfde lid, van de Gaswet][ref1] volgt dat de vraag naar gas uit het
      Groningenveld substantieel wijzigt ten opzichte van de raming waarop de operationele strategie is gebaseerd;

      b. een melding als bedoeld in het eerste lid of een onverwachte gebeurtenis aanleiding geeft tot een andere
      verdeling van de winning over de clusters;

      c. een ernstige aantasting van de veiligheid van omwonenden van het Groningenveld ontstaat of dreigt te ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel52e
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 10a
  - number: 52f
    text: |-
      De houder van de winningsvergunning Groningenveld is verplicht de winning van het Groningenveld uit te voeren
      overeenkomstig de door Onze Minister vastgestelde operationele strategie en indien die is opgelegd, een tijdelijke
      maatregel als bedoeld in [artikel 52e, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52e
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel52f
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 52e
        hoofdstuk: 4a
  - number: 52g
    text: |-
      1 De houder van de winningsvergunning Groningenveld voert de door Onze Minister vastgestelde operationele strategie
      en indien die is opgelegd, een tijdelijke maatregel als bedoeld in [artikel 52e, tweede lid][ref1], op zodanige
      wijze uit dat de nadelige gevolgen van de gaswinning uit het Groningenveld zoveel mogelijk worden beperkt.

      2 De houder van de winningsvergunning Groningenveld neemt alle noodzakelijke maatregelen om de gevolgen van een
      zwaar ongeval voor mens en milieu te beperken.

      3 Na beëindiging van de winning uit het Groningenveld neemt de houder van de winningsvergunning Groningenveld
      dan wel, indien deze vergunning haar gelding heeft verloren, de laatste houder daarvan, alle maatregelen die
      redelijkerwijs van hem gevergd kunnen worden om nadelige gevolgen van de gaswinning uit het Groningenveld zoveel
      mogelijk te beperken.

      4 Bij ministeriële regeling worden nadere regels gesteld over het uitvoeren van de door Onze Minister vastgestelde
      operationele strategie.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52e
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel52g
    references:
