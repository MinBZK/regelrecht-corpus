        afdeling: '3.4'
  - number: 167j
    text: |-
      Een winningsvergunning aardwarmte afgegeven voor 1 januari 2020 waarvoor een instemming met een winningsplan
      aardwarmte is verleend, wordt met inbegrip van de instemming met het winningsplan en de daaraan verbonden
      voorwaarden en beperkingen met ingang van de datum van inwerkingtreding van [hoofdstuk 2a][ref1] beschouwd
      als een vervolgvergunning aardwarmte. De resterende looptijd van de winningsvergunning aardwarmte, of, indien
      dat korter is, de resterende looptijd van de instemming met het winningsplan, wordt geacht de looptijd van de
      vervolgvergunning aardwarmte te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel167j
