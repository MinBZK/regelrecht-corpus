  - number: '148'
    text: |-
      1 In het geval dat een vergunning ingevolge [artikel 143, tweede lid, onderdeel c][ref1], als een
      winningsvergunning wordt beschouwd en op grond van deze vergunning een vennootschap is opgericht als bedoeld
      in [artikel 11, tweede lid, onderdeel a, van de Mijnwet continentaal plat][ref2], zoals deze luidde voor de
      inwerkingtreding van deze wet, worden tot het in [artikel 66, eerste lid][ref3], bedoelde resultaat gerekend:

      a. mede de bedragen die ten goede komen aan de vennootschap;

      b. niet de bedragen die de houder van de winningsvergunning heeft ontvangen van de vennootschap, als houder van
      aandelen of van winstbewijzen van die vennootschap.

      2 In het geval, bedoeld in het eerste lid, worden tot het in [artikel 66, eerste lid][ref4], bedoelde resultaat
      gerekend:

      a. mede de kosten die voor rekening komen van de vennootschap;

      b. niet de rente over het eigen vermogen van de vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
