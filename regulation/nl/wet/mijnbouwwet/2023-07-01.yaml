  - number: 24ai
    text: |-
      1 Onze Minister beslist op een aanvraag om een vervolgvergunning aardwarmte binnen twaalf weken na de ontvangst van
      de aanvraag.

      2 Onze Minister kan de termijn, bedoeld in het eerste lid, eenmaal met ten hoogste vier weken verlengen.

      3 Indien [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, beslist Onze Minister, in
      afwijking van [artikel 3:18 van de Algemene wet bestuursrecht][ref2] en het eerste lid, op een aanvraag om een
      vervolgvergunning aardwarmte binnen 32 weken na de ontvangst daarvan.

      4 Onze Minister kan de termijn, bedoeld in het derde lid, eenmaal met ten hoogste acht weken verlengen.

      5 Van een beschikking tot verlening van een vergunning wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel318
