        afdeling: 5.1.1
  - number: '70'
    text: |-
      1 Winstaandeel wordt geheven bij wege van aanslag.

      2 De houder, of, ingeval van medehouderschap, ieder van de medehouders, zendt gelijktijdig met de aangifte
      voor de vennootschapsbelasting over een boekjaar aan de inspecteur een over dat boekjaar opgemaakte winst- en
      verliesrekening als bedoeld in [artikel 66, eerste lid][ref1], en een berekening van het op dat boekjaar betrekking
      hebbende verrekenbare bedrag, bedoeld in [artikel 69, tweede lid][ref2], alsmede een balans, vermeldende de aan het
      eind van het boekjaar tot het winningsbedrijf behorende activa en passiva.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel69
