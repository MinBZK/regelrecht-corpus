      - id: ref2
        bwb_id: BWBR0014168
        artikel: 31b
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '115'
    text: |-
      1 De Technische commissie bodembeweging bestaat uit een voorzitter en ten hoogste negen andere leden.

      2 De voorzitter en de andere leden van de commissie worden door Onze Minister benoemd, geschorst en ontslagen. De
      benoeming van de leden geschiedt op grond van hun deskundigheid op gebieden die van belang zijn voor de mijnbouw en
      met de mijnbouw verwante activiteiten. De commissie kan uit zijn midden ondervoorzitters aanwijzen.

      3 De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan telkens voor ten hoogste vier jaar
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel115
  - number: '116'
    text: |-
      1 Alvorens de commissie om advies als bedoeld in [artikel 114, tweede lid, onderdeel d][ref1], wordt gevraagd,
      stelt degene die schade heeft geleden die naar zijn mening aan een mijnbouwondernemer kan worden toegerekend,
      deze schriftelijk aansprakelijk onder vordering van schadevergoeding. De aansprakelijkstelling geschiedt binnen
      drie maanden na het moment waarop de benadeelde bekend is geworden of redelijkerwijs bekend had kunnen zijn met
      de schade.

      2 De in het eerste lid bedoelde benadeelde kan de commissie om advies verzoeken, indien binnen drie maanden na de
      datum van verzending van de aansprakelijkheidstelling geen overeenstemming is bereikt met de mijnbouwondernemer
      over vergoeding van de schade.

      3 Een adviesaanvraag wordt uiterlijk binnen een maand na het verstrijken van de termijn, genoemd in het tweede lid,
      ingediend bij de commissie. De commissie kan op verzoek van de benadeelde of de betrokken mijnbouwondernemer de
      termijn verlengen met een door haar te bepalen periode.

      4 Indien de benadeelde in onzekerheid verkeert tot welke mijnbouwondernemer de aansprakelijkstelling moet worden
      gericht, verstrekt de commissie, voorzover haar bekend, hem naam en adres van de bedoelde onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel114
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel116
    references:
      - id: ref1
