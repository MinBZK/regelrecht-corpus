  - number: 24ae
    text: |-
      Onze Minister verleent op aanvraag een vervolgvergunning aardwarmte aan de houder van een startvergunning
      aardwarmte voor het gebied of een gedeelte daarvan waarop de startvergunning aardwarmte ziet.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24ae
  - number: 24af
    text: |-
      1 Een aanvraag voor een vervolgvergunning aardwarmte gaat vergezeld van een beschrijving van:

      a. de aardlaag en de begrenzing ervan waar de aanvrager aardwarmte wint;

      b. de verwachte exploitatieduur;

      c. de verwachte invloedssfeer van de winning en de verwachte afkoeling;

      d. indien van toepassing, wijziging ten opzichte van de startvergunning aardwarmte in de wijze waarop de aanvrager
      voornemens is aardwarmte te winnen en de wijze waarop hij zijn put heeft ingericht;

      e. de gemeten en nog te verwachten bodembeweging ten gevolge van de winning;

      f. indien dit nodig is gelet op de nog te verwachten bodembeweging:

      1°. de veiligheidsrisico’s voor omwonenden, het risico op schade aan gebouwen of infrastructurele werken of het
      risico op verstoring van de functionaliteit daarvan,

      2°. de maatregelen die worden genomen om bodembeweging te voorkomen of te beperken;

      3°. de maatregelen die worden genomen om de schade door bodembeweging te voorkomen of te beperken;

      g. indien van toepassing, wijziging ten opzichte van de startvergunning aardwarmte in de wijze waarop de aanvrager
      voornemens is de kosten in verband met de winning en de hierbij behorende aansprakelijkheden, waaronder het
      stellen van financiële zekerheid, anders dan bedoeld in de [artikelen 46][ref1] en [47][ref2], ter dekking van
      de aansprakelijkheid voor de schade door verontreiniging van grondwater of bodem in verband met de opsporing en
      winning van aardwarmte indien de in de aanvraag aangegeven aardlagen zich geheel of gedeeltelijk bevinden onder een
      gebied dat is aangewezen voor de winning van drinkwater uit grondwater, te dragen;

      h. de wijze waarop de aanvrager voornemens is om kosten in verband met het geheel of gedeeltelijk buiten gebruik
      stellen van een boorgat tijdens de looptijd van de vervolgvergunning of na afloop hiervan te dragen.

      2 Indien een nieuwe uitvoerder aardwarmte wordt aangewezen, gaat de aanvraag voor een vervolgvergunning
      aardwarmte vergezeld van een verzoek om instemming met de aanwijzing van een uitvoerder aardwarmte als bedoeld in
      [artikel 24z, derde lid][ref3].

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel24z
