preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het bestaande samenstel van wettelijke regelingen
    inzake het onderzoek naar en het winnen van delfstoffen te vervangen door een nieuwe regeling, die aan de thans te
    stellen eisen voldoet, en enige regels te stellen met betrekking tot bepaalde met mijnbouw verwante activiteiten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. delfstoffen: in de ondergrond aanwezige mineralen of substanties van organische oorsprong, in een aldaar langs
      natuurlijke weg ontstane concentratie of afzetting, in vaste, vloeibare of gasvormige toestand, met uitzondering
      van brongas, kalksteen, grind, zand, klei, schelpen en mengsels daarvan;

      b. aardwarmte: in de ondergrond aanwezige warmte die aldaar langs natuurlijke weg is ontstaan;

      c. continentaal plat: het onder de Noordzee gelegen deel van de zeebodem en de ondergrond daarvan, waarop
      het Koninkrijk mede overeenkomstig het op 10 december 1982 te Montego-Bay gesloten Verdrag inzake het
      recht van de zee (Trb. 1983, 83) soevereine rechten heeft en hetwelk is gelegen aan de zeezijde van de in
      [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref1] bedoelde lijn;

      d. verkenningsonderzoek: een onderzoek, zonder gebruikmaking van een boorgat, naar de aanwezigheid van delfstoffen
      of naar de aanwezigheid van aardwarmte, dan wel naar nadere gegevens omtrent delfstoffen of aardwarmte;

      e. opsporen van delfstoffen: onderzoek doen naar de aanwezigheid van delfstoffen, dan wel naar nadere gegevens
      daaromtrent, met gebruikmaking van een boorgat;

      f. winnen van delfstoffen: het met gebruikmaking van een boorgat, tunnel, schacht of ander ondergronds werk
      onttrekken van delfstoffen aan de ondergrond anders dan in de vorm van monsters of formatiebeproevingen;

      g. opsporen van aardwarmte: onderzoek doen naar de aanwezigheid van aardwarmte, dan wel naar nadere gegevens
      daaromtrent, met gebruikmaking van een boorgat;

      h. *winnen van aardwarmte:* met gebruikmaking van boorgaten onttrekken van aardwarmte aan de ondergrond door het
      oppompen van formatiewater en het terugvoeren van dat formatiewater in het oorspronkelijke reservoirinterval, of
      door het uitwisselen van warmte met de ondergrond zonder het oppompen en terugvoeren van formatiewater;

      i. opslaan van stoffen: het brengen of houden van stoffen op een diepte van meer dan 100 meter beneden de
      oppervlakte van de aardbodem, dan wel het terughalen van die stoffen, anders dan het in de ondergrond brengen of
      houden of daaruit terughalen van stoffen gericht op het onttrekken van aardwarmte aan de ondergrond;

      j. opsporingsvergunning: een vergunning voor het opsporen van delfstoffen;

      k. winningsvergunning: een vergunning voor het winnen van delfstoffen, alsmede voor het opsporen van delfstoffen;

      l. opslagvergunning: een vergunning voor het opslaan van stoffen;

      m. mijnbouwmilieuvergunning: een vergunning als bedoeld in [artikel 40, tweede lid][ref2];

      n. mijnbouwwerk: een werk dat behoort tot een bij algemene maatregel van bestuur aangewezen categorie van werken:

      1°. ten behoeve van het opsporen of het winnen van delfstoffen of aardwarmte;

      2°. ten behoeve van het opslaan van stoffen;

      3°. die samenhangen met de in de onderdelen 1° en 2° bedoelde werken;

      o. mijnbouwinstallatie: een mijnbouwwerk dat verankerd is in of aanwezig is boven de bodem van een
      oppervlaktewater;

      p. Onze Minister: Onze Minister van Economische Zaken en Klimaat;

      q. opsporen van CO-opslagcomplexen: onderzoek naar opslagcomplexen met gebruikmaking van een boorgat of door het
      verrichten van proeven met injectie van CO om het opslagvoorkomen te karakteriseren;

      r. opsporingsvergunning van CO-opslagcomplexen: een vergunning voor het opsporen van CO-opslagcomplexen;

      s. CO-opslagcomplex: opslagvoorkomen voor CO en de omringende geologische gebieden die een weerslag kunnen hebben
      op de algehele integriteit van de opslag en de veiligheid ervan;

      t. opslagvoorkomen: een voorkomen dat gebruikt wordt voor opslag;

      u. permanent opslaan van CO: permanent opslaan van CO en stoffen die daarmee in directe samenhang worden opgeslagen
      met uitzondering van opslag van CO voor onderzoeks- of ontwikkelingsdoeleinden of voor het beproeven van nieuwe
      producten en procedés indien de geplande opslagcapaciteit minder is dan 100 kiloton;

      v. zwaar ongeval:

      1°. een incident met daarbij een explosie, brand of verlies van controle over de boorput of lekkage van olie,
      gas of gevaarlijke stoffen, waarbij sprake is van of een aanzienlijke kans bestaat op slachtoffers of ernstig
      lichamelijk letsel,

      2°. een incident dat tot ernstige schade aan het mijnbouwwerk of de verbonden infrastructuur leidt, waarbij sprake
      is van of een aanzienlijke kans bestaat op slachtoffers of ernstig lichamelijk letsel,

      3°. een incident leidend tot de dood of tot ernstige verwondingen van vijf of meer personen, die aanwezig zijn
      op het mijnbouwwerk waar het gevaar zijn oorsprong vindt of die betrokken zijn bij een olie- of gasactiviteit in
      verband met het mijnbouwwerk of de verbonden infrastructuur of

      4°. een zwaar milieuincident dat voortvloeit uit de incidenten als bedoeld onder a, b en c en dat leidt of naar
      verwachting zal leiden tot aanzienlijke negatieve gevolgen voor het milieu, als bedoeld in richtlijn 2004/35/EG;

      w. kennisgeving: een schriftelijke aankondiging van een voorgenomen activiteit;

      x. exploitant: een houder van een vergunning voor het opsporen of winnen van koolwaterstoffen of indien er meerdere
      houders van de vergunning zijn, één van de vergunninghouders die overeenkomstig [artikel 22, vijfde lid][ref3], is
      aangewezen om de feitelijke werkzaamheden te verrichten of daartoe opdracht te verlenen;

      y. boorgatactiviteit: elke activiteit, met inbegrip van het opschorten daarvan, met betrekking tot een boorgat
      waarbij per ongeluk stoffen kunnen vrijkomen, wat mogelijk tot een zwaar ongeval kan leiden, waarbij het in ieder
      geval gaat om:

      1°. het boren van een boorgat ten behoeve van de opsporing of winning van koolwaterstoffen,

      2°. het herstellen of aanpassen van een boorgat of

      3°. het definitief verlaten van een boorgat;

      z. gecombineerde activiteit:

      1°. een activiteit die wordt uitgevoerd vanaf een mijnbouwwerk samen met één of meerdere andere mijnbouwwerken
      ten behoeve van aan het andere mijnbouwwerk gerelateerde doeleinden, waarbij de risico’s voor de veiligheid van
      personen of de bescherming van het milieu op één of alle mijnbouwwerken aanzienlijk wordt beïnvloed of

      2°. het gelijktijdig uitvoeren van werkzaamheden;

      aa. onafhankelijke verificatie: een beoordeling en bevestiging van de geldigheid van bepaalde schriftelijke
      verklaringen, door een entiteit of organisatorisch onderdeel van de vergunninghouder of eigenaar van een
      mijnbouwwerk die niet onder de controle of invloed valt van de entiteit die of het organisatorisch onderdeel dat de
      verklaringen gebruikt;

      ab. productie-installatie: een mijnbouwwerk dat gebruikt wordt voor het winnen of bewerken van koolwaterstoffen,
      met uitzondering van inrichtingen waarvoor het [Besluit risico’s zware ongevallen 2015][ref4] geldt, of een
      pijpleiding, met uitzondering van pijpleidingen waarvoor het [Besluit externe veiligheid buisleidingen][ref5]
      geldt;

      ac. niet-productie-installatie: een mijnbouwwerk niet zijnde een productie-installatie en niet zijnde een
      mijnbouwwerk bestemd voor het winnen van zout of aardwarmte of voor het opslaan van stoffen;

      ad. richtlijn 2013/30/EU: richtlijn 2013/30/EU van het Europees parlement en de Raad van 12 juni 2013 betreffende
      de veiligheid van offshore olie- en gasactiviteiten en tot wijziging van richtlijn 2004/35/EG (PbEU 2013, L 178);

      ae. richtlijn 2008/56/EG: richtlijn 2008/56/EG van het Europees parlement en de Raad van 17 juni 2008 tot
      vaststelling van een kader voor communautaire maatregelen betreffende het beleid ten aanzien van het mariene milieu
      (Kaderrichtlijn mariene strategie) (PbEU 2008, L 164);

      af. essentiële wijziging: wezenlijke verandering die de kern betreffen;

      ag. pijpleiding:

      1°. leiding die twee of meer mijnbouwwerken met elkaar verbindt ten behoeve van het vervoer van stoffen, te rekenen
      vanaf de eerste isolatieafsluiter van het mijnbouwwerk;

      2°. andere leiding dan bedoeld onder 1°, aan te wijzen door Onze Minister, die een mijnbouwwerk verbindt met
      een ander werk ten behoeve van het vervoer van stoffen te rekenen vanaf de eerste isolatieafsluiter van het
      mijnbouwwerk;

      ah. risicobeoordeling: wetenschappelijke of anderszins geobjectiveerde beoordeling, die bestaat uit een
      gevareninventarisatie, gevarenkarakterisatie, blootstellingschatting en risicokarakterisatie;

      ai. beheerder: natuurlijke persoon of rechtspersoon voor wiens rekening en risico een pijpleiding of kabel wordt
      aangelegd, gebruikt dan wel in stand gehouden;

      aj. buiten werking: een situatie, waarin een mijnbouwwerk, kabel of pijpleiding, bestemd voor het opsporen of
      winnen van delfstoffen of aardwarmte dan wel het opslaan van stoffen of het opsporen van CO-opslagcomplexen niet
      meer als zodanig in werking is;

      ak. buiten gebruik stellen van een boorgat: het permanent afsluiten van een boorgat;

      al. kabel: leiding voor het vervoer van elektriciteit of elektronische signalen die:

      1°. twee of meer mijnbouwwerken verbindt of

      2°. tussen een mijnbouwwerk en een ander werk ligt en door Onze Minister is aangewezen;

      am. *toewijzing zoekgebied aardwarmte:* het exclusieve recht om in een bepaald gebied een startvergunning
      aardwarmte aan te vragen;

      an. *startvergunning aardwarmte:* een vergunning om aardwarmte op te sporen en gedurende de looptijd van de
      vergunning te winnen;

      ao. *vervolgvergunning aardwarmte:* een vergunning om aardwarmte gedurende de looptijd van de vergunning te winnen;

      ap. *uitvoerder aardwarmte:* een natuurlijke persoon of een rechtspersoon als bedoeld in [artikel 24z][ref6],
      die in opdracht van de vergunninghouder de feitelijke werkzaamheden met betrekking tot het opsporen en winnen van
      aardwarmte uitvoert of daartoe opdracht verleent;

      aq. *invloedssfeer:* gebied in de ondergrond waar als gevolg van winning van aardwarmte een daling in temperatuur
      plaatsvindt.


