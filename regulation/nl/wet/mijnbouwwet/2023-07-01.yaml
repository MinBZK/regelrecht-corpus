  - number: '22'
    text: |-
      1 Dit artikel is van toepassing op het houden van een vergunning door meer dan een natuurlijke persoon of
      rechtspersoon.

      2 Bij de aanvraag om een vergunning worden de personen gezamenlijk als aanvrager van de vergunning beschouwd. Na
      verlening worden zij gezamenlijk als houder van de vergunning beschouwd.

      3 [Artikel 20][ref1] is van overeenkomstige toepassing als een van de personen zijn aandeel in de vergunning op een
      ander wil doen overgaan.

      4 In afwijking van [artikel 21, vijfde lid][ref2], vervalt de vergunning niet als één van de houders die een
      natuurlijke persoon is, overlijdt dan wel één van de houders die een rechtspersoon is, ophoudt te bestaan, maar
      gaat diens aandeel in de vergunning over op de medehouders.

      5 Een van de personen wordt aangewezen om de feitelijke werkzaamheden te verrichten of daartoe opdracht te
      verlenen. Het verrichten van de feitelijke werkzaamheden of het verlenen van opdracht daartoe is slechts aan de
      aangewezen persoon toegestaan.

      6 De aanwijzing geschiedt voor de eerste maal in de vergunning.

      7 De houder van de vergunning kan uit zijn midden een andere persoon aanwijzen, nadat hij daartoe van Onze Minister
      schriftelijk toestemming heeft gekregen.

      8 Indien de aangewezen persoon niet meer in staat is tot het verrichten van de feitelijke werkzaamheden of het
      verlenen van opdracht daartoe, trekt Onze Minister de aanwijzing in. Indien geen van de personen is aangewezen,
      wijst Onze Minister een van hen aan.

      9 Onze Minister neemt de besluiten die verband houden met de aanwijzing op basis van
      de in [artikel 9, eerste lid, onderdelen a tot en met c][ref3], genoemde gronden.
      [Artikel 9, tweede, derde en vierde lid][ref4], is van overeenkomstige toepassing.


