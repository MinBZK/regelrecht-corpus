    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. het splitsen van een vergunning, waardoor twee of meer vergunningen voor twee of meer gebieden ontstaan;

      b. het samenvoegen van twee of meer vergunningen, waardoor een vergunning voor een gebied ontstaat.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel19
  - number: '20'
    text: |-
      1 De houder van een vergunning kan zijn vergunning slechts met schriftelijke toestemming van Onze Minister op een
      ander doen overgaan. [Artikel 7, tweede lid][ref1], en [artikel 9][ref2], met uitzondering van het eerste lid,
      onderdeel d, zijn van overeenkomstige toepassing. Aan een toestemming kunnen voorschriften worden verbonden. Een
      toestemming kan onder beperkingen worden verleend.

      2 Indien de houder van een vergunning een deel van zijn vergunning op een ander wil doen overgaan, dient hij tevens
      een aanvraag in om splitsing van de vergunning als bedoeld in [artikel 19, onderdeel a][ref3].

      3 Van een beschikking tot verlening van toestemming wordt mededeling gedaan in de Staatscourant.

      4 [Paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref4] is van toepassing op de schriftelijke toestemming,
      bedoeld in het eerste lid.


