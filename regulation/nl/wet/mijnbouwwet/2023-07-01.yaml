  - number: '16'
    text: |-
      1 Gedeputeerde staten van de provincie waarop de aanvraag voor een vergunning betrekking heeft worden in de
      gelegenheid gesteld binnen een door Onze Minister te stellen redelijke termijn advies uit te brengen over de
      ingediende aanvraag.

      2 Gedeputeerde staten betrekken bij het advies:

      a. het college van burgemeester en wethouders van de gemeenten van het gebied waarop de aanvraag betrekking heeft
      en

      b. het dagelijks bestuur van de waterschappen van het gebied waarop de aanvraag betrekking heeft met het oog op
      waterkwaliteit, waterkwantiteit en infrastructurele werken.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel16
  - number: '17'
    text: |-
      1 Onze Minister beslist op een aanvraag om een vergunning binnen zes maanden na de ontvangst daarvan. Indien
      [artikel 15, eerste of vijfde lid][ref1], toepassing heeft gevonden, beslist Onze Minister op alle aanvragen binnen
      zes maanden na afloop van de termijn, bedoeld in artikel 15, derde, onderscheidenlijk vijfde lid.

      2 Onze Minister kan de termijn, waarbinnen hij op een aanvraag beslist, eenmaal met ten hoogste zes maanden
      verlengen.

      3 In afwijking van het tweede lid kan Onze Minister de termijn, waarbinnen hij op een aanvraag beslist, tweemaal
      met ten hoogste een jaar verlengen indien de aanvraag betrekking heeft op:

      a. een gebied waarvoor een aanvang voor de vaststelling van een structuurvisie met betrekking tot
      mijnbouwactiviteiten is gemaakt als bedoeld in [artikel 2.3, vierde lid, van de Wet ruimtelijke ordening][ref2]
      voor gebieden op land, respectievelijk in de territoriale zee, bedoeld in
      [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref3], of

      b. een gebied op land, respectievelijk in de territoriale zee, bedoeld in
      [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref4], waarvoor in een ontwerp
      van een algemene maatregel van bestuur als bedoeld in [artikel 4.3, eerste lid][ref5], respectievelijk
      [10.8, eerste lid, van de Wet ruimtelijke ordening][ref6] regels zijn gesteld in verband met de opsporing of
      winning van een delfstof door middel van een opsporings- of winningsinstallatie en nationale belangen die regels
      met het oog op een goede ruimtelijke ordening noodzakelijk maken.

      4 Van een beschikking tot verlening van een vergunning wordt mededeling gedaan in de Staatscourant.


