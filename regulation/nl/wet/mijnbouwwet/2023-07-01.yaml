  - number: 97e
    text: |-
      1 Iedere persoon, bedoeld in [artikel 22, tweede lid][ref1], eerste volzin, meldt een wijziging in zijn directe en
      indirecte zeggenschap binnen vier weken na die wijziging aan de vennootschap in het geval een wijziging betrekking
      heeft op de helft of meer van de stemrechten in een aandeelhoudersvergadering dan wel de benoeming, de schorsing of
      het ontslag van de helft of meer van de bestuurders, commissarissen of vennoten.

      2 Als een wijziging in de zeggenschap, bedoeld in het eerste lid, daartoe aanleiding geeft, adviseert de
      vennootschap Onze Minister over de toepassing van de [artikelen 47][ref2] en [48][ref3].

      3 Als de wijziging in de zeggenschap, bedoeld in het eerste lid, mogelijk nadelig is voor een te stellen
      of gestelde zekerheid als bedoeld in de [artikelen 47][ref4] en [48][ref5] en de melding niet is gedaan
      binnen de termijn van vier weken, bedoeld in dat lid, is een rechtshandeling, die nodig is voor de
      wijziging van de zeggenschap vernietigbaar door een rechterlijke uitspraak, onverminderd de toepassing
      van [artikel 40, tweede lid, van Boek 3 van het Burgerlijk Wetboek][ref6] door een persoon als bedoeld in
      [artikel 97d, tweede lid][ref7], of de vennootschap.


