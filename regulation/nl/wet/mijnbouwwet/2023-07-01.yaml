  - number: 167f
    text: |-
      Een aanvraag voor een opsporingsvergunning voor aardwarmte wordt met ingang van de datum van inwerkingtreding van
      [hoofdstuk 2a][ref1] beschouwd als een aanvraag voor een toewijzing zoekgebied aardwarmte. Indien over een aanvraag
      voor een opsporingsvergunning voor aardwarmte al adviezen zijn ingewonnen, worden niet opnieuw adviezen ingewonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel167f
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: 2a
  - number: 167g
    text: |-
      Een opsporingsvergunning voor aardwarmte wordt met ingang van de datum van inwerkingtreding van
      [hoofdstuk 2a][ref1] beschouwd als een toewijzing zoekgebied aardwarmte. De resterende looptijd van de
      opsporingsvergunning aardwarmte wordt geacht de looptijd van de toewijzing zoekgebied aardwarmte te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel167g
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: 2a
  - number: 167h
    text: |-
      1 Een aanvraag voor een winningsvergunning voor aardwarmte en een verzoek om instemming met een winningsplan door
      een houder van een opsporingsvergunning voor aardwarmte wordt met ingang van de datum van inwerkingtreding van
      [hoofdstuk 2a][ref1] beschouwd als een aanvraag om een startvergunning aardwarmte. Indien over een aanvraag voor
      een winningsvergunning voor aardwarmte en over het verzoek om instemming met een winningsplan voor aardwarmte al
      adviezen zijn ingewonnen of de procedure, bedoeld in [Afdeling 3.4. van de Algemene wet bestuursrecht][ref2] is
      gevolgd, worden niet opnieuw adviezen ingewonnen of wordt niet opnieuw de procedure, bedoeld in Afdeling 3.4 van de
      Algemene wet bestuursrecht gevolgd.

      2 Het verbod om aardwarmte op te sporen zonder startvergunning aardwarmte, bedoeld in [artikel 24b][ref3], geldt
      niet voor de houder van een opsporingsvergunning voor aardwarmte, bedoeld in het eerste lid, met ingang van de
      datum van inwerkingtreding van [hoofdstuk 2a][ref4], zolang de aanvraag om een startvergunning, bedoeld in het
      eerste lid, in behandeling is.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel24b
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel167h
