  - number: '46'
    text: |-
      1 Onze Minister kan bepalen dat zekerheid gesteld dient te worden ter dekking van de aansprakelijkheid voor
      de schade die naar redelijke schatting ontstaat door beweging van de aardbodem als gevolg van het winnen van
      delfstoffen.

      2 Op verzoek van Onze Minister wordt aan hem een goed onderbouwd rapport overgelegd, waaruit blijkt welke schade
      naar redelijke schatting zal ontstaan.

      3 Het bedrag en de termijn waarvoor en het tijdstip en de wijze waarop de zekerheid wordt gesteld, dienen ten
      genoegen van Onze Minister te zijn.

      4 Dit artikel is van overeenkomstige toepassing op het opsporen en winnen van aardwarmte en het opslaan van
      stoffen.

      5 Dit artikel geldt, tenzij in de desbetreffende vergunning anders is bepaald, niet met betrekking tot het winnen
      van delfstoffen of aardwarmte of het opslaan van stoffen in het continentaal plat en onder de territoriale zee,
      voorzover het winnen of het opslaan plaatsvindt vanuit of in een voorkomen dat gelegen is aan de zeezijde van de in
      de bijlage bij deze wet vastgelegde lijn.

      6 [Artikel 41, vierde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat, indien een
      vergunning wordt overgedragen na het bekend worden van schade, de verplichtingen van dit artikel wat betreft
      die schade blijven rusten op degene die ten tijde van dat bekend worden de houder van de vergunning of de in
      [artikel 22][ref2] bedoelde aangewezen persoon was.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel46
