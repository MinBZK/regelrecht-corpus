  - number: 33a
    text: |-
      1 De houder van een vergunning voor de opsporing of winning van koolwaterstoffen verricht de activiteiten op
      basis van systematisch risicobeheer, zodat de overblijvende risico’s op zware ongevallen voor mens, milieu en het
      mijnbouwwerk aanvaardbaar zijn.

      2 Bij de beoordeling van de aanvaardbaarheid van de risico’s, bedoeld in het eerste lid, wordt een risiconiveau
      gehanteerd waarbij de tijd, kosten of inspanningen voor een verdere beperking ervan zwaar onevenredig zouden zijn
      in relatie tot het voordeel van een dergelijke beperking. Bij het beoordelen of tijd, kosten of inspanningen zwaar
      onevenredig zouden zijn in relatie tot de voordelen van verdere risicoreductie, worden de tot de beste praktijken
      behorende risiconiveaus die passen bij de onderneming in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel33a
  - number: '34'
    text: |-
      1 Het winnen van delfstoffen vanuit een voorkomen geschiedt overeenkomstig een winningsplan.

      2 De houder van een winningsvergunning of de krachtens [artikel 22][ref1] aangewezen persoon dient een winningsplan
      in bij Onze Minister.

      3 Het winningsplan behoeft de instemming van Onze Minister.

      4 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref2] is van toepassing, voor zover het winnen van delfstoffen
      niet geschiedt in het continentaal plat, op:

      a. de voorbereiding van een besluit omtrent instemming met een winningsplan en

      b. de voorbereiding van een besluit omtrent wijziging van een instemming met een winningsplan en de voorbereiding
      van een besluit tot instemming met een gewijzigd of geactualiseerd winningsplan, tenzij de wijziging of
      actualisatie van ondergeschikte aard is omdat deze naar het oordeel van Onze Minister niet leidt tot een andere
      beoordeling van:

      1°. de effecten van de wijze van winning alsmede de daarmee verband houdende activiteiten,

      2°. de effecten van de bodembeweging ten gevolge van de winning en de maatregelen ter voorkoming van schade door
      bodembeweging,

      3°. de risico’s voor omwonenden, gebouwen of infrastructurele werken of de functionaliteit daarvan.

      5 Onze Minister stelt in de gelegenheid advies uit te brengen over een instemming met een winningsplan als bedoeld
      in het vierde lid, onderdeel a, of een besluit omtrent wijziging van een instemming met een winningsplan of een
      besluit tot instemming met een gewijzigd of geactualiseerd winningsplan als bedoeld in het vierde lid, onderdeel b:

      a. gedeputeerde staten van een provincie binnen het gebied waarop een winningsplan betrekking heeft,

      b. burgemeester en wethouders van een gemeente binnen het gebied waarop het winningsplan betrekking heeft en

      c. het dagelijks bestuur van een waterschap binnen het gebied waarop een winningsplan betrekking heeft.

      6 Zienswijzen kunnen naar voren worden gebracht door een ieder.

      7 [Afdeling 3.5 van de Algemene wet bestuursrecht][ref3] is van toepassing op een besluit tot instemming met een
      winningsplan of een gewijzigd of geactualiseerd winningsplan voor koolwaterstoffen met dien verstande dat:

      a. het coördinerende bestuursorgaan, bedoeld in [artikel 3:22 van de Algemene wet bestuursrecht][ref4] is: de
      Minister van Economische Zaken en Klimaat;

      b. de besluiten, bedoeld in [artikel 3:24, eerste lid, van de Algemene wet bestuursrecht][ref5], zijn:

      1°. de instemming met het winningsplan, bedoeld in het derde lid,

      2°. de omgevingsvergunning, bedoeld in
      [artikel 2.1, eerste lid, onderdeel e, van de Wet algemene bepalingen omgevingsrecht][ref6],

      3°. een besluit als bedoeld in de [artikelen 6.2, eerste lid, onder a][ref7], [6.3, eerste lid][ref8],
      [6.5][ref9], [6.10, eerste lid, van de Waterwet][ref10] te nemen door Onze Minister, bedoeld in
      [artikel 1.1, eerste lid, van de Waterwet][ref11],

      4°. de vergunning, bedoeld in [artikel 40, tweede lid][ref12], van deze wet,

      5°. andere daarvoor in aanmerking komende besluiten die door Onze Minister of Onze Minister die het aangaat worden
      genomen, waaronder besluiten met betrekking tot de [Wet natuurbescherming][ref13].

      8 Het eerste, zesde en zevende lid is niet van toepassing op het winnen van delfstoffen in het kader van het
      verkrijgen van gegevens voor zuiver wetenschappelijk onderzoek of voor het door de centrale overheid te voeren
      beleid.


