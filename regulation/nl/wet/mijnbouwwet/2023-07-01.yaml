      1 De persoon, bedoeld in [artikel 140, eerste lid][ref1], kan vanaf het moment waarop de commissie een voorlopig
      advies als bedoeld in [artikel 119, tweede lid][ref2], heeft uitgebracht, een verzoek om een voorschot indienen.
      Hij overlegt daarbij in ieder geval dat voorlopig advies.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de indiening en de
      behandeling van, alsmede de beslissing op een verzoek als bedoeld in [artikel 140, eerste lid][ref3].


