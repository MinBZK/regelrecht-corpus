    text: |-
      Bepalingen in een voor de inwerkingtreding van deze wet gesloten overeenkomst, waarbij een partij zich jegens de
      staat verbindt om borg te staan voor de betaling van een oppervlakterecht, een cijns of een aandeel in de winst
      door de houder van een opsporingsvergunning of een winningsvergunning als bedoeld in [artikel 143][ref1] of diens
      rechtsvoorganger, blijven buiten toepassing voorzover zij betrekking hebben op verplichtingen die zijn ontstaan op
      grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel163
