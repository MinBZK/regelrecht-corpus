  - number: '128'
    text: |-
      1 De inspecteur-generaal der mijnen brengt jaarlijks voor 1 mei aan Onze Minister verslag uit over de werkzaamheden
      van het Staatstoezicht op de mijnen in het afgelopen jaar. De inspecteur-generaal der mijnen kan voorzien in
      verslaglegging op andere momenten waarop de inspecteur-generaal dat nodig oordeelt.

      2 De inspecteur-generaal der mijnen doet in het verslag de aanbevelingen die hij wenselijk acht met het oog op een
      doelmatige en voortvarende uitvoering in de toekomst van de in [artikel 127][ref1] genoemde activiteiten.

      3 Onze Minister zendt het verslag alsmede een schriftelijke reactie daarop aan de Staten-Generaal.

      4 De inspecteur-generaal der mijnen dient jaarlijks voor een bij ministeriële regeling vast te stellen datum,
      aan Onze Minister een jaarplan in, waarin de plannen worden uitgewerkt voor een effectief toezicht gebaseerd
      op risicobeheer en waarin bijzondere aandacht wordt besteed aan de naleving van de verplichtingen, genoemd in
      [§ 4.1a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel128
