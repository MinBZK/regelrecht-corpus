      1 Ten aanzien van een besluit omtrent een mijnbouwmilieuvergunning en instemming met een winningsplan
      is [hoofdstuk 20 van de Wet milieubeheer][ref1] van overeenkomstige toepassing, met dien verstande
      dat [artikel 20.3 van de Wet milieubeheer][ref2] niet van toepassing is op een besluit omtrent een
      mijnbouwmilieuvergunning voor een mijnbouwwerk te plaatsen of geplaatst aan de zeezijde van de in de bijlage bij
      deze wet vastgelegde lijn en een winningsplan voorzover het winnen van delfstoffen geschiedt vanuit een voorkomen
      dat is gelegen aan de zeezijde van de in de bijlage bij deze wet vastgelegde lijn. De eerste volzin is van
      overeenkomstige toepassing op een besluit omtrent instemming met een winningsplan of opslagplan als bedoeld in
      [artikel 39, eerste lid][ref3].

      2 Op het beroep tegen besluiten op grond van de [afdelingen 5.1.1][ref4], [5.1.2][ref5], [5.3][ref6], [5.4][ref7]
      en [5.5][ref8] is [hoofdstuk V, afdelingen 2][ref9] en [4, van de Algemene wet inzake rijksbelastingen][ref10] van
      overeenkomstige toepassing.


