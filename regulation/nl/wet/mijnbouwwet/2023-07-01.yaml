  - number: '89'
    text: |-
      In de opsporingsovereenkomst worden bepalingen opgenomen die de vergunninghouder ertoe verplichten:

      a. de voor hem uit de vergunning voortvloeiende rechten uit te oefenen ten behoeve van de samenwerking en
      overeenkomstig de gezamenlijke besluiten die met inachtneming van [artikel 91][ref1] zijn genomen door de
      vergunninghouder en de vennootschap;

      b. het door hem aangaan, wijzigen of beëindigen van duurzame samenwerking met derden ter zake van verkenning en
      opsporing te onderwerpen aan goedkeuring door de vergunninghouder en de vennootschap gezamenlijk;

      c. aan de samenwerking ten goede te doen komen zijn kennis en ervaring op het gebied van verkenning, opsporing,
      winning en afzet van koolwaterstoffen en daarmee samenhangende gebieden zoals het transport, de opslag en de
      behandeling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel91
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '91'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: '90'
    text: |-
      1 In de opsporingsovereenkomst worden bepalingen opgenomen die de vennootschap ertoe verplichten:

      a. aan de vergunninghouder te vergoeden 40% van de uitgaven van de vergunninghouder die in overeenstemming met
      [artikel 91][ref1] zijn goedgekeurd of in overeenstemming zijn met een goedgekeurd jaarlijks investerings- en
      financieringsplan;

      b. niet te beletten dat besluiten van de vergunninghouder gebaseerd worden op normale commerciële overwegingen;

      c. zijn stem bij de besluitvorming volgens [artikel 91][ref2] uit te brengen op grond van transparante, objectieve
      en niet-discriminerende beginselen.

      2 In de overeenkomst worden bepalingen opgenomen die ertoe strekken dat ten aanzien van besluiten, inhoudende bij
      wie opdrachten worden geplaatst voor leveringen, voor de uitvoering van werken en voor het verrichten van diensten:

      a. de vergunninghouder niet verplicht is vooraf aan de vennootschap informatie te geven over het te nemen besluit;

      b. de vennootschap geen stem uitbrengt bij het nemen van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel91
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel90
