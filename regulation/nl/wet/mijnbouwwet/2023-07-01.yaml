    text: |-
      1 De beheerder van een kabel of pijpleiding meldt binnen vier weken nadat een kabel of pijpleiding buiten
      werking is, aan Onze Minister om welke reden de kabel of pijpleiding buiten werking is en welke maatregelen
      zijn of worden genomen tenzij de kabel of pijpleiding tijdelijk buiten werking is in een geval dat krachtens
      [artikel 49, vierde lid][ref1], is aangewezen.

      2 Onze Minister kan binnen zes maanden na de melding met overeenkomstige toepassing van [artikel 44][ref2] bepalen
      dat de beheerder van een kabel of pijpleiding die buiten werking is, verplicht is om de kabel of pijpleiding te
      verwijderen overeenkomstig een door de beheerder te overleggen verwijderingsplan, tenzij de kabel of pijpleiding:

      a. in gemeentelijk ingedeeld gebied is gelegen en

      b. met de eigenaar van de grond is overeengekomen dat de kabel of de pijpleiding niet wordt verwijderd.

      3 Als Onze Minister bepaalt dat de beheerder verplicht is een kabel of pijpleiding te verwijderen, kan de beheerder
      een aanvraag om ontheffing indienen. [Artikel 44b][ref3] is van overeenkomstige toepassing.

      4 De [artikelen 44a][ref4] en [44c][ref5] zijn van overeenkomstige toepassing op een verwijderingsplan,
      respectievelijk de verwijdering, van kabels en pijpleidingen.

      5 Als Onze Minister de beheerder niet heeft verplicht een kabel of pijpleiding te verwijderen en de beheerder niet
      verplicht is om de kabel of pijpleiding krachtens een overeenkomst met de eigenaar van de grond te verwijderen, is
      de beheerder verplicht om de kabel, respectievelijk pijpleiding, schoon en veilig achter te laten.

      6 Als niemand als beheerder van een kabel of pijpleiding kan worden aangemerkt, rusten de verplichtingen op de
      laatste beheerder van de kabel of pijpleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel44b
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel44a
