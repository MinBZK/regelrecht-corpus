  - number: '48'
    text: |-
      1 Onze Minister kan bepalen dat de beheerder van een kabel of pijpleiding als bedoeld in [artikel 45][ref1] binnen
      een door Onze Minister vast te stellen termijn zekerheid stelt aan de Staat der Nederlanden voor het schoon en
      veilig achterlaten of het verwijderen van een kabel of pijpleiding.

      2 De zekerheid wordt gesteld vanaf een tijdstip, voor een bedrag, met een termijn en op een wijze die Onze Minister
      voldoende acht.

      3 Onze Minister kan een last onder dwangsom opleggen voor de handhaving van het eerste lid.

      4 Het eerste lid is van overeenkomstige toepassing op de houder van een ontheffing voor het verwijderen
      van een kabel of pijpleiding als bedoeld in [artikel 45, derde lid][ref2], in samenhang met
      [artikel 44b, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel45
