  - number: '147'
    text: |-
      1 Bepalingen in een overeenkomst die voor de inwerkingtreding van deze wet is gesloten tussen de staat en
      de houder van een opsporingsvergunning of een winningsvergunning als bedoeld in [artikel 143][ref1] of diens
      rechtsvoorganger, welke overeenkomst samenhangt met de in het eerste of tweede lid van dat artikel bedoelde
      besluiten, komen bij de inwerkingtreding van deze wet te vervallen voorzover zij in strijd zijn met deze wet.

      2 In afwijking van het eerste lid blijven de bepalingen in stand voorzover de overeenkomst samenhangt met een
      besluit als bedoeld in [artikel 143, tweede lid][ref2], dat is genomen voor 1962 en de bepalingen betrekking hebben
      op financiële afdrachten aan de staat, waaronder begrepen de aansprakelijkheid voor die afdrachten.

      3 Bepalingen in een overeenkomst die voor de inwerkingtreding van deze wet is gesloten omtrent onderling overleg
      bij het winnen van delfstoffen uit een voorkomen dat de grens van een vergunningsgebied overschrijdt, worden geacht
      te zijn gesloten op basis van [artikel 42, tweede lid][ref3].

      4 Bepalingen in een overeenkomst als bedoeld in het eerste lid omtrent het verwijderen van mijnbouwinstallaties
      als bedoeld in [artikel 44][ref4], voorzover deze installaties bij de inwerkingtreding van deze wet nog in gebruik
      zijn, komen bij de inwerkingtreding van deze wet te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel143
