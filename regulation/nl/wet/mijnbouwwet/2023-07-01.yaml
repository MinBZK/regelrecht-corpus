  - number: 24ag
    text: |-
      1 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van een besluit
      inzake een aanvraag om een vervolgvergunning aardwarmte indien de verlening van de vervolgvergunning aardwarmte ten
      opzichte van de startvergunning aardwarmte leidt tot een significant:

      a. nadeliger gevolg voor het milieu als gevolg van de wijze van winning;

      b. nadeliger effect van de bodembeweging ten gevolge van de winning;

      c. groter risico voor omwonenden of grotere schade aan gebouwen of infrastructurele werken of de functionaliteit
      daarvan.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de gronden, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24ag
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 24ah
    text: |-
      1 Indien [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, stelt Onze Minister gedeputeerde
      staten van de provincie en het college van burgemeester en wethouders van de gemeenten binnen wier grondgebied het
      gebied waarop de aanvraag voor een vervolgvergunning aardwarmte betrekking heeft, in de gelegenheid binnen acht
      weken advies uit te brengen met het oog op de planmatige ontwikkeling of het beheer van delfstoffen, aardwarmte,
      andere natuurlijke rijkdommen, waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot
      het opslaan van stoffen.

      2 Indien [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing is, stelt Onze Minister gedeputeerde
      staten van de provincie en het dagelijks bestuur van waterschappen binnen wier grondgebied het gebied waarop de
      aanvraag voor een vervolgvergunning aardwarmte betrekking heeft, in de gelegenheid binnen acht weken advies uit te
      brengen met het oog op grondwaterkwaliteit en -kwantiteit.

      3 Indien Onze Minister voornemens is af te wijken van het advies van gedeputeerde staten van de provincie met het
      oog op het beheer van grondwater met het oog op de winning van drinkwater, bedoeld in het eerste lid, of het advies
      van gedeputeerde staten van de provincie met het oog op grondwaterkwaliteit en -kwantiteit, bedoeld in het tweede
      lid, informeert Onze Minister Onze Minister van Infrastructuur en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
