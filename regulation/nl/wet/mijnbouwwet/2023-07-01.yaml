    text: |-
      De statuten van de vennootschap en elke wijziging van die statuten behoeven goedkeuring van Onze Minister. Hij
      onthoudt zijn goedkeuring slechts als door de statuten naar zijn oordeel een behoorlijke vervulling van de taken,
      genoemd in [artikel 82, eerste, tweede en derde lid][ref1], onvoldoende is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel82
