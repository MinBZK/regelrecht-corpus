  - number: '98'
    text: |-
      1 De houder van een vergunning tot het winnen van andere delfstoffen dan koolwaterstoffen is jaarlijks een afdracht
      verschuldigd aan de staat, voorzover dit in aan de vergunning verbonden voorschriften is bepaald. De afdracht wordt
      afgestemd op de omvang van of de voordelen behaald met het winnen en de daarmee samenhangende activiteiten.

      2 De houder van een opslagvergunning is jaarlijks een afdracht verschuldigd aan de staat, voorzover dit in aan de
      vergunning verbonden voorschriften is bepaald. De afdracht wordt afgestemd op de omvang van of de voordelen behaald
      met het opslaan en de daarmee samenhangende activiteiten.

      3 De houder van een vergunning als bedoeld in het eerste of tweede lid die een terrein binnen een provincie in
      gebruik heeft, waarbinnen voor het winnen of het opslaan benodigde mijnbouwwerken aanwezig zijn, is een eenmalige
      afdracht verschuldigd aan de provincie, voorzover dit in aan de vergunning verbonden voorschriften is bepaald. De
      afdracht wordt afgestemd op de regeling in [afdeling 5.1.2][ref1].

      4 Indien de vergunning wordt gehouden door meer dan een natuurlijke persoon of rechtspersoon, wordt in aan de
      vergunning te verbinden voorschriften bepaald in hoeverre ieder van deze personen een afdracht als bedoeld in het
      eerste tot en met derde lid verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel98
