    text: |-
      1 Onverminderd [artikel 32c][ref1] kan Onze Minister een vergunning slechts wijzigen:

      a. op aanvraag van de houder van de vergunning,

      b. in verband met veranderde omstandigheden of gewijzigde inzichten inzake de manier waarop de aanvrager de
      activiteiten voor opsporing of winning verricht of voornemens is te verrichten, waaronder de bij die activiteiten
      te gebruiken technieken, hulpmiddelen of stoffen,

      c. in verband met een vaststelling of wijziging van bij of krachtens een algemene maatregel van bestuur als
      bedoeld in [artikel 4.3, eerste lid][ref2], of [10.8, eerste lid, van de Wet ruimtelijke ordening][ref3]
      voor een gebied op land, respectievelijk in de territoriale zee, bedoeld in
      [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref4], gestelde regels over de opsporing
      of winning van een delfstof door middel van een opsporings- of winningsinstallatie,

      d. in verband met een vaststelling of wijziging van bij of krachtens een algemene maatregel van bestuur als bedoeld
      in [artikel 49][ref5] gestelde regels over:

      1°. het geheel of gedeeltelijk uitsluiten van een gebied van de opsporing of winning van een delfstof,

      2°. de diepte waarop een activiteit plaatsvindt,

      3°. de soort activiteit,

      4°. de soort delfstof,

      e. in verband met veranderde omstandigheden of gewijzigde inzichten inzake de veiligheid voor omwonenden of het
      voorkomen van schade aan gebouwen of infrastructurele werken of de functionaliteit daarvan,

      f. in verband met veranderde omstandigheden of gewijzigde inzichten inzake het planmatig gebruik of beheer van
      delfstoffen, andere natuurlijke rijkdommen, waaronder grondwater met het oog op de winning van drinkwater, of
      mogelijkheden tot het opslaan van stoffen,

      g. voor zover de vergunning geldt voor de op grond van [artikel 1.1, eerste lid, van de Wet natuurbescherming][ref6]
      aangewezen Natura 2000-gebieden Waddenzee en Noordzeekustzone,

      h. voor zover de vergunning geldt voor een gebied gelegen binnen de Waddenzee als aangewezen krachtens de
      [Wet ruimtelijke ordening][ref7] of op de Waddeneilanden, of

      i. voor zover de vergunning geldt voor het op grond van de Overeenkomst inzake de bescherming van het cultureel en
      natuurlijk erfgoed van de wereld (Trb. 1973, 155) aangewezen werelderfgoedgebied Waddenzee.

      2 Een vergunning kan niet zodanig worden gewijzigd dat zij komt te gelden voor:

      a. andere activiteiten of andere delfstoffen;

      b. een groter gebied.

      3 Een aanvraag om verlenging van het tijdvak waarvoor een vergunning geldt wordt slechts ingewilligd, indien het
      in de vergunning vastgestelde tijdvak onvoldoende is om de activiteiten, waarvoor de vergunning geldt, te voltooien
      en deze activiteiten zijn verricht in overeenstemming met de vergunning. In een beschikking, waarbij het tijdvak
      waarvoor een vergunning geldt wordt verlengd, kan het gebied waarvoor die vergunning geldt worden beperkt tot een
      deel van het gebied. [Artikel 11, derde en vierde lid][ref8], is van overeenkomstige toepassing.

      4 Een aanvraag om verkleining van het gebied waarvoor een vergunning geldt, wordt slechts ingewilligd met
      inachtneming van [artikel 11, derde en vierde lid][ref9].

      5 Van een beschikking tot wijziging van een vergunning wordt mededeling gedaan in de Staatscourant.


