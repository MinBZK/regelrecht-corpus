  - number: '126'
    text: |-
      1 Er is een Staatstoezicht op de mijnen. Het Staatstoezicht op de mijnen ressorteert onder Onze Minister.

      2 Aan het hoofd van het Staatstoezicht op de mijnen staat de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel126
  - number: '127'
    text: |-
      1 De inspecteur-generaal der mijnen heeft tot taak:

      a. het uitoefenen van toezicht op de naleving van de bij of krachtens deze wet gestelde regels, met uitzondering
      van het bij of krachtens [artikel 52][ref1] en de [hoofdstukken 5][ref2], [6][ref3] en [9][ref4], bepaalde
      met uitzondering van [artikel 111][ref5], [artikel 120, tweede lid][ref6], en artikel 111 in samenhang met
      [artikel 121][ref7], en het uitoefenen van toezicht op de naleving van de bij of krachtens een andere wet gestelde
      regels waarvoor ambtenaren van het Staatstoezicht op de mijnen zijn aangewezen als toezichthouders;

      b. Onze Minister te adviseren bij besluiten die Onze Minister neemt inzake mijnbouw;

      c. risicobeoordelingen te toetsen voor advisering aan Onze Minister;

      d. onderzoek te doen verrichten, indien dat nodig is voor het toetsen van een risicobeoordeling;

      e. gevraagd en ongevraagd adviezen te verstrekken naar aanleiding van het toezicht op de naleving, de
      risicobeoordelingen en het onderzoek;

      f. het rapport inzake grote gevaren te beoordelen voor een instemming als bedoeld in de
      [artikelen 45b, tweede lid][ref8], [45e, tweede lid][ref9], [45f, tweede lid][ref10] en [45i, tweede lid][ref11];

      g. kennisgevingen, bedoeld in de [artikelen 45m][ref12], [45n][ref13], [45o][ref14], [45p][ref15], te beoordelen;

      h. een mechanisme op te zetten voor vertrouwelijke melding van veiligheids- en milieukwesties met betrekking tot
      activiteiten die zien op de opsporing of winning van koolwaterstoffen en het onderzoeken van deze meldingen;

      i. regelmatig kennis, gegevens en ervaringen uit te wisselen met toezichthouders van andere lidstaten
      overeenkomstig artikel 27 van richtlijn 2013/30/EU;

      j. informatie uit te wisselen overeenkomstig artikel 23 van richtlijn 2013/30/EU;

      k. informatie te publiceren overeenkomstig artikel 24 van richtlijn 2013/30/EU;

      l. Onze Minister te adviseren of de voorgestelde operationele strategie of strategieën, bedoeld in
      [artikel 52c, tweede lid][ref16], gelet op de winning van de hoeveelheid gas die ten hoogste uit het Groningenveld
      benodigd is om eindafnemers van de hoeveelheid laagcalorisch gas te voorzien, de verwachte bodembeweging
      minimaliseert en de gevolgen daarvan voor omwonenden, gebouwen of infrastructurele werken of de functionaliteit
      daarvan zoveel mogelijk beperkt.

      2 De inspecteur-generaal der mijnen stelt na elke inspectie, verricht in het kader van [paragraaf 3.2][ref17] een
      verslag op over de naleving van de voorschriften en de voorgeschreven maatregelen. Het verslag wordt ter kennis
      gebracht van de betrokken houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door
      meerdere personen wordt gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref18], en binnen twee maanden
      na de inspectie openbaar gemaakt.

      3 De inspecteur-generaal der mijnen stelt bij een zwaar ongeval als bedoeld in [artikel 33][ref19], een onderzoek
      in en dient een samenvatting van de bevindingen in bij de Europese Commissie en Onze Minister.

      4 De inspecteur-generaal der mijnen draagt er zorg voor dat de aanbevelingen naar aanleiding van de bevindingen,
      bedoeld in het derde lid, worden uitgevoerd, voor zover deze binnen diens bevoegdheid vallen.


