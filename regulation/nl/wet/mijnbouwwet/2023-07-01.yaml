  - number: '68'
    text: |-
      1 De winst- en verliesrekening, bedoeld in [artikel 66, eerste lid][ref1],
      wordt opgemaakt met overeenkomstige toepassing van de [artikelen 3.8][ref2],
      [3.14, eerste lid, onderdelen b tot en met i, en derde tot en met vijfde lid][ref3],
      [3.25 tot en met 3.39][ref4],[ 3.52][ref5], [3.53, eerste lid, onderdelen a en b, en tweede lid][ref6],
      [3.54][ref7], [3.56][ref8] en [3.57 van de Wet inkomstenbelasting 2001][ref9],
      alsmede de [artikelen 7, vierde en vijfde lid][ref10], [8, vierde lid][ref11],
      [8b tot en met 8bd][ref12], [9 tot en met 10b][ref13], [14 tot en met 14b][ref14], [15d][ref15] en
      [35 van de Wet op de vennootschapsbelasting 1969][ref16], behoudens voorzover bij of krachtens deze wet anders
      is bepaald, dan wel uit het verschil in wezen tussen de houder dan wel de medehouder enerzijds en een natuurlijk
      persoon in de zin van de inkomstenbelasting respectievelijk een belastingplichtige voor de vennootschapsbelasting
      anderzijds, het tegendeel voortvloeit.

      2 Voor de toepassing van het eerste lid wordt in de genoemde artikelen van de [Wet inkomstenbelasting 2001][ref17]
      en van de [Wet op de vennootschapsbelasting 1969][ref18] voor «onderneming» gelezen: winningsbedrijf.

      3 Bij het opmaken van de winst- en verliesrekening, bedoeld in [artikel 66, eerste lid][ref19], wordt een verhoging
      van 10% toegepast op de kosten met uitzondering van:

      a. door de houder van de winningsvergunning aan de staat verschuldigde belastingen en
      andere Nederlandse publiekrechtelijke lasten met uitzondering van een heffing als bedoeld in
      [artikel 15, eerste lid, van de Tijdelijke wet Groningen][ref20];

      b. afschrijving op de koopsom ter zake van de overname van een winningsvergunning, voorzover deze koopsom de door
      de overdrager van die vergunning nog niet reeds ten laste van een winst- en verliesrekening gebrachte kosten te
      boven gaat;

      c. dotaties aan de voorziening ter zake van de uit een overgenomen winningsvergunning voortvloeiende
      ontmantelingsverplichting, voorzover reeds door de overdrager van die vergunning dotaties zijn gepleegd.

      4 Voorzover bij of krachtens de [Wet inkomstenbelasting 2001][ref21] of de
      [Wet op de vennootschapsbelasting 1969][ref22] de bevoegdheid is verleend om bij algemene maatregel van bestuur
      onderscheidenlijk bij ministeriële regeling regels te stellen en het voor een goede afstemming van het eerste lid,
      op die regels nodig is om dit artikel aan te passen, kan bij algemene maatregel van bestuur, onderscheidenlijk bij
      ministeriële regeling van Onze Minister in overeenstemming met Onze Minister van Financiën, deze aanpassing worden
      geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
