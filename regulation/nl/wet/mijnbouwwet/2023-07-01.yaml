    text: |-
      1 Een voor de inwerkingtreding van deze wet ingediende aanvraag om een besluit als bedoeld in
      [artikel 143, eerste lid][ref1], wordt beschouwd als een aanvraag om een opsporingsvergunning.

      2 Een voor de inwerkingtreding van deze wet ingediende aanvraag om een besluit als bedoeld in
      [artikel 143, tweede lid][ref2], wordt beschouwd als een aanvraag om een winningsvergunning.

      3 Een voor de inwerkingtreding van deze wet ingediende aanvraag om een goedkeuring of een vergunning als bedoeld
      in [artikel 143, vijfde lid][ref3], wordt beschouwd als een aanvraag om een mijnbouwmilieuvergunning of een
      milieuvergunning overeenkomstig de toedeling in artikel 143, vijfde en zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
