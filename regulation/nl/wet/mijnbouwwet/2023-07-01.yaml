  - number: '35'
    text: |-
      1 Het winningsplan bevat voor elk voorkomen binnen het vergunningsgebied ten minste een beschrijving van:

      a. de verwachte hoeveelheid aanwezige delfstoffen en de ligging ervan;

      b. de duur van de winning;

      c. de wijze van winning alsmede de daarmee verband houdende activiteiten;

      d. een schatting van de verwachte hoeveelheid per jaar te winnen delfstoffen;

      e. de kosten op jaarbasis van het winnen van de delfstoffen;

      f. de bodembeweging ten gevolge van de winning alsmede de daarmee verband houdende activiteiten en de maatregelen
      ter voorkoming van schade door bodembeweging, voorzover het winnen van delfstoffen niet geschiedt in het
      continentaal plat, tenzij Onze Minister anders heeft bepaald;

      g. de risico’s voor omwonenden, gebouwen of infrastructurele werken of de functionaliteit daarvan met een
      risicobeoordeling, voor zover het winnen van delfstoffen niet geschiedt in het continentaal plat.

      2 De Technische commissie bodembeweging brengt aan Onze Minister advies uit omtrent het eerste lid, onderdeel f.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      winningsplan.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel35
  - number: '36'
    text: |-
      1 Onze Minister kan zijn instemming met het opgestelde winningsplan slechts geheel of gedeeltelijk weigeren:

      a. indien het in het winningsplan aangeduide gebied door Onze Minister niet geschikt wordt geacht voor de in het
      winningsplan vermelde activiteit om reden van het belang van de veiligheid voor omwonenden of het voorkomen van
      schade aan gebouwen of infrastructurele werken of de functionaliteit daarvan,

      b. in het belang van het planmatig gebruik of beheer van delfstoffen, aardwarmte, andere natuurlijke rijkdommen,
      waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van stoffen,

      c. indien nadelige gevolgen voor het milieu ontstaan, of

      d. indien nadelige gevolgen voor de natuur worden veroorzaakt.

      2 Onze Minister kan zijn instemming verlenen onder beperkingen of daaraan voorschriften verbinden, indien deze
      gerechtvaardigd worden door een grond als genoemd in het eerste lid.

      3 Onze Minister kan zijn instemming intrekken of beperkingen en voorschriften stellen of wijzigen, indien dat
      gerechtvaardigd wordt door veranderde omstandigheden of gewijzigde inzichten inzake een grond als genoemd in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel36
  - number: '39'
    text: |-
      1 De [artikelen 34 tot en met 36][ref1] zijn van overeenkomstige toepassing op het opslaan van stoffen.

      2 Het eerste lid blijft buiten toepassing voor zover [hoofdstuk 3, paragraaf 3.2][ref2], toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel39
