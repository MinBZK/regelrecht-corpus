      1 Dit artikel is van toepassing in die gevallen waarin
      [artikel 2.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1] niet van toepassing is op een
      mijnbouwwerk.

      2 Het is verboden zonder vergunning van Onze Minister een mijnbouwwerk op te richten of in stand te houden. Het
      verbod geldt niet voor mijnbouwwerken, behorende tot een categorie die bij of krachtens algemene maatregel van
      bestuur van dit verbod is uitgezonderd en waarvoor die algemene maatregel van bestuur regels stelt ter bescherming
      van het milieu en de natuur.

      3 De vergunning kan slechts in het belang van de bescherming van het milieu en de natuur worden geweigerd.

      4 De vergunning kan onder beperkingen worden verleend. Aan de vergunning kunnen voorschriften worden verbonden.
      De beperkingen en voorschriften kunnen slechts worden gerechtvaardigd door het belang van de bescherming van het
      milieu en de natuur.

      5 In de vergunning kan worden bepaald dat Onze Minister daarbij omschreven bevoegdheden heeft ter uitvoering van
      daarbij aangewezen voorschriften.

      6 Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop de aanvraag om een vergunning dient te
      geschieden en omtrent de gegevens en de bescheiden welke daarbij moeten worden overgelegd. Bij de regeling worden
      bestuursorganen aangewezen die in de gelegenheid moeten worden gesteld advies uit te brengen met betrekking tot het
      nemen van een besluit, of die op andere wijze bij de voorbereidingsprocedure worden betrokken.

      7 Onze Minister kan de beperkingen en voorschriften wijzigen, voorzover zij geen betrekking hebben op de plaats
      van het mijnbouwwerk en de wijziging wordt gerechtvaardigd door het belang van de bescherming van het milieu en
      de natuur.

      8 [Artikel 21, eerste lid, met uitzondering van onderdeel c, en tweede lid][ref2], is van overeenkomstige
      toepassing.

      9 Op de voorbereiding van de beschikking tot verlening van een vergunning is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing.

      10 In een vergunning kan worden bepaald:

      a. dat daarbij aangewezen voorschriften eerst in werking treden op een daarbij aangegeven tijdstip, dan wel wanneer
      een daarbij aangegeven omstandigheid zich voordoet;

      b. dat daarbij aangewezen voorschriften slechts gelden tot een daarbij aangegeven tijdstip, dan wel omstandigheid;

      c. dat daarbij aangewezen voorschriften nadat de vergunning haar gelding heeft verloren, gedurende een daarbij
      aangegeven termijn van kracht blijven.

      11 De volgende onderdelen van de [Wet algemene bepalingen omgevingsrecht][ref4] zijn van overeenkomstige
      toepassing:

      a. [artikel 4.2][ref5] ten aanzien van een beschikking omtrent:

      1°. het wijzigen of intrekken van een vergunning;

      2°. het verlenen van een vergunning voor het in stand houden van een mijnbouwwerk in een geval waarin het in het
      tweede lid bedoelde verbod niet gold voor dat mijnbouwwerk en het verbod op enig tijdstip is gaan gelden anders dan
      ten gevolge van een verandering van het mijnbouwwerk of van de werking daarvan;

      b. de [artikelen 2.25, eerste lid][ref6], en [8.1][ref7].

      12 De volgende onderdelen van de [Wet milieubeheer][ref8] zijn van overeenkomstige toepassing: [hoofdstuk 7][ref9],
      de [artikelen 8.40, eerste en tweede lid][ref10], [8.41][ref11], [8.42][ref12], [8.42a][ref13] en
      [afdeling 13.2][ref14].


