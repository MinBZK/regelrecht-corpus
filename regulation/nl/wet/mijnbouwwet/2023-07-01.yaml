  - number: '153'
    text: |-
      1 Degene die bij de inwerkingtreding van deze wet een mijnbouwwerk in stand houdt, waarvoor voor dat tijdstip
      geen goedkeuring of vergunning als bedoeld in [artikel 143, vijfde lid][ref1], noodzakelijk was en waarvoor op
      dat tijdstip het verbod, bedoeld in [artikel 40, tweede lid][ref2], is gaan gelden, verkrijgt op dat tijdstip van
      rechtswege een mijnbouwmilieuvergunning voor het mijnbouwwerk.

      2 Degene die bij de inwerkingtreding van deze wet een mijnbouwwerk in stand houdt, waarvoor voor dat tijdstip
      het in [artikel 8.1, eerste lid, van de Wet milieubeheer][ref3] vervatte verbod niet gold noch een goedkeuring of
      vergunning als bedoeld in [artikel 143, vijfde lid][ref4], noodzakelijk was en waarvoor het verbod op dat tijdstip
      is gaan gelden, verkrijgt op dat tijdstip van rechtswege een milieuvergunning als bedoeld in artikel 8.1 van de Wet
      milieubeheer voor de desbetreffende inrichting.

      3 Een vergunning als bedoeld in [artikel 8.1, eerste lid, van de Wet milieubeheer][ref5] die
      van kracht was voor de inwerkingtreding van deze wet voor een inrichting waarop wat betreft het
      ondergrondse deel [hoofdstuk 8 van de Wet milieubeheer][ref6] niet van toepassing was op grond van
      [artikel 22.1, eerste lid, onderdeel a, van die wet][ref7], wordt geacht vanaf dat tijdstip ook te zijn verleend
      voor het ondergrondse deel.

      4 Aan de in het derde lid bedoelde vergunning zijn vanaf de inwerkingtreding van deze wet de voorschriften
      verbonden die voor dat tijdstip op grond van de [Wet milieubeheer][ref8] en de [Wet bodembescherming][ref9] voor
      dit ondergrondse deel golden.


