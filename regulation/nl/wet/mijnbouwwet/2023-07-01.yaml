  - number: '49'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:

      a. het opsporen van delfstoffen of aardwarmte;

      b. het winnen van delfstoffen of aardwarmte;

      c. het opslaan van stoffen;

      d. het instellen van een verkenningsonderzoek;

      e. boorgaten dieper dan 500 meter beneden de oppervlakte van de aardbodem;

      f. pijpleidingen en kabels die worden gebruikt ten behoeve van het opsporen of winnen van delfstoffen of
      aardwarmte, dan wel ten behoeve van het opslaan van stoffen;

      g. de stoffen die samen met CO, worden getransporteerd en opgeslagen;

      h. het geheel of gedeeltelijk uitsluiten van een gebied van de opsporing of winning van een delfstof of aardwarmte
      of het opslaan van stoffen,

      i. de diepte waarop een activiteit plaatsvindt,

      j. de soort activiteit, en

      k. de soort delfstof of de soort stof die wordt opgeslagen.

      2 De in het eerste lid bedoelde regels kunnen worden gesteld ten behoeve van:

      a. een gebruik van ondergrond of planmatig beheer van voorkomens van delfstoffen, aardwarmte, andere natuurlijke
      rijkdommen, waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van
      stoffen;

      b. de bescherming van de veiligheid voor omwonenden;

      c. de bescherming van het milieu;

      d. het voorkomen van schade aan gebouwen en infrastructurele werken of de functionaliteit daarvan.

      3 De in het eerste lid bedoelde regels kunnen voorts worden gesteld, voorzover de in het eerste lid bedoelde
      activiteiten plaatsvinden op of in het continentaal plat of de territoriale zee, ten behoeve van:

      a. de scheepvaart, de landsverdediging, de visserij, de opwekking van elektriciteit, het instandhouden van de
      levende rijkdommen van de zee, het zuiver wetenschappelijk onderzoek en het leggen en onderhouden van onderzeese
      kabels en pijpleidingen;

      b. de bescherming van historische, oudheidkundige en andere wetenschappelijke vondsten.

      4 De in het eerste lid bedoelde regels kunnen, voorzover die gesteld worden, inhouden het doen van een melding,
      het achterwege laten daarvan, het weigeren, wijzigen of intrekken van een vergunning, een ontheffing of een
      instemming, het stellen van beperkingen of het verbinden van voorschriften aan een vergunning, een ontheffing of
      een instemming, het aanwijzen van gevallen van tijdelijk buiten werking zijn van mijnbouwwerken en het aanwijzen
      van gevallen waarin een gedeelte van een mijnbouwwerk buiten werking is.

      5 De in het eerste lid bedoelde regels kunnen mede betrekking hebben op het buiten gebruik stellen van een boorgat
      dan wel het buiten werking stellen, het verwijderen, het achterlaten of het hergebruiken van mijnbouwwerken, kabels
      en pijpleidingen, waaronder regels over:

      a. meldingen en het overleggen van gegevens en bescheiden;

      b. het stellen van zekerheden voor de nakoming van verplichtingen tot verwijderen, tot achterlaten of tot het na
      hergebruik verwijderen van mijnbouwwerken, kabels en pijpleidingen die buiten werking zijn.

      6 De in het derde lid bedoelde regels, voorzover die gesteld worden ten behoeve van de scheepvaart, de opwekking
      van elektriciteit, de bescherming van historische, oudheidkundige en andere wetenschappelijke vondsten of de
      landsverdediging, kunnen beperkingen inhouden ten aanzien van de locaties waar de in het eerste lid bedoelde
      activiteiten plaats kunnen vinden.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel49
