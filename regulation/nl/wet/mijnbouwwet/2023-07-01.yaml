  - number: '7'
    text: |-
      1 Een vergunning wordt niet verleend, voorzover deze bij het in werking treden zou gaan gelden voor een gebied
      waarvoor op dat tijdstip reeds een door een ander gehouden vergunning voor dezelfde delfstof geldt.

      2 Een vergunning wordt evenmin verleend, voorzover deze bij het in werking treden zou gaan gelden voor een
      voorkomen waarvoor op dat tijdstip reeds een door een ander gehouden opslagvergunning geldt.

      3 Het eerste lid blijft buiten toepassing ten aanzien van de in [artikel 11, eerste lid][ref1], bedoelde andere
      delfstoffen.


