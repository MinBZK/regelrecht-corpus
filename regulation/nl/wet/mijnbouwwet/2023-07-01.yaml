      1 Met het toezicht op de naleving van het bepaalde bij of krachtens [artikel 52][ref1] zijn binnen hun ambtsgebied
      belast de bij besluit van gedeputeerde staten aangewezen ambtenaren.

      2 Gedeputeerde staten wijzen ambtenaren die niet onder hen ressorteren niet aan dan in overeenstemming met het
      bestuursorgaan onder wie de desbetreffende ambtenaren ressorteren.

      3 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in het provinciaal blad.


