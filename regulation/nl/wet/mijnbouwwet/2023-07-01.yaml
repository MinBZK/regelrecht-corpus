  - number: '56'
    text: |-
      1 Oppervlakterecht wordt geheven van degene die op 1 januari van het kalenderjaar waarover wordt geheven houder
      is van een opsporingsvergunning voor de zeezijde alsmede van degene die op 1 januari van het kalenderjaar waarover
      wordt geheven houder is van een winningsvergunning.

      2 Ingeval van medehouderschap wordt het oppervlakterecht geheven van de aangewezen medehouder.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel56
  - number: '57'
    text: |-
      1 De heffingsmaatstaf is de oppervlakte van het gebied waarvoor een in [artikel 56, eerste lid][ref1], bedoelde
      opsporings- of winningsvergunning op 1 januari van kracht is.

      2 Het tijdvak waarover het oppervlakterecht wordt geheven is het kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel56
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel57
