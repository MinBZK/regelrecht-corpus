      1 Indien een vergunning als bedoeld in [artikel 6][ref1] of [25][ref2], een startvergunning aardwarmte of een
      vervolgvergunning aardwarmte geldt voor een gebied waarvoor een ander een in dit lid genoemde vergunning houdt, kan
      Onze Minister de vergunninghouder verplichten in een door hem te bepalen omvang te gedogen dat de houder van die
      andere vergunning zijn daaruit voortvloeiende rechten uitoefent.

      2 Indien een vergunning voor het winnen van delfstoffen geldt voor een gebied, waarin zich een voorkomen
      bevindt dat naar redelijkerwijs kan worden aangenomen de grens van het vergunningsgebied overschrijdt of een
      startvergunning aardwarmte of een vervolgvergunning aardwarmte geldt voor een invloedssfeer die naar redelijkerwijs
      kan worden aangenomen de grens van het vergunningsgebied overschrijdt, is de vergunninghouder verplicht om
      medewerking te verlenen aan de totstandkoming van een overeenkomst tussen de vergunninghouder en de voor het
      aangrenzende gebied tot het winnen van de delfstoffen of aardwarmte gerechtigde, tenzij Onze Minister van deze
      verplichting ontheffing verleent. De overeenkomst strekt er toe dat het winnen in onderlinge overeenstemming zal
      geschieden. In de overeenkomst kan worden bepaald dat verplichtingen die krachtens de [hoofdstukken 2][ref3],
      [3][ref4] en [4][ref5] rusten op de in [artikel 22][ref6] bedoelde aangewezen personen, rusten op een van deze
      aangewezen personen. Onze Minister kan eisen stellen aan de tot stand te brengen overeenkomst. De overeenkomst en
      de wijzigingen in de overeenkomst worden aan Onze Minister overgelegd.

      3 Indien een vergunning voor het winnen van koolwaterstoffen geldt voor een gebied waarvoor een vergunning voor
      permanent opslaan van CO geldt, is de houder van de winningsvergunning verplicht om medewerking te verlenen aan
      de totstandkoming van een overeenkomst tussen de vergunninghouder en de houder van de vergunning voor permanent
      opslaan van CO. De overeenkomst strekt ertoe dat winnen en permanent opslaan van CO in onderlinge overeenstemming
      zal geschieden. In de overeenkomst kan worden bepaald dat verplichtingen die krachtens de [hoofdstukken 2][ref7],
      [3][ref8] en [4][ref9] rusten op de in [artikel 22][ref10] bedoelde aangewezen personen, rusten op een van deze
      aangewezen personen. Onze Minister kan eisen stellen aan de tot stand te brengen overeenkomst. De overeenkomst en
      de wijzigingen in de overeenkomst worden aan Onze Minister overgelegd.

      4 Bij of krachtens algemene maatregel van bestuur kan worden bepaald onder welke omstandigheden de houder van een
      vervolgvergunning aardwarmte verplicht is medewerking te verlenen aan de totstandkoming van een overeenkomst tussen
      hem en degene die een winningsvergunning heeft voor de meekomende delfstoffen. Een overeenkomst strekt ertoe dat
      degene die een vergunning heeft voor de winning van de meekomende delfstoffen een redelijke vergoeding ontvangt
      voor de met de bij de winning van aardwarmte meekomende delfstoffen. Bij ministeriële regeling kunnen regels worden
      gesteld omtrent de inhoud van de overeenkomst.


