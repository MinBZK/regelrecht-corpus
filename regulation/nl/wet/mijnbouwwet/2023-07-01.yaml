  - number: 24ac
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. het splitsen van een startvergunning aardwarmte, waardoor twee of meer startvergunningen aardwarmte voor twee of
      meer gebieden ontstaan;

      b. het samenvoegen van delen van twee of meer startvergunningen aardwarmte, waardoor een startvergunning aardwarmte
      voor een gebied ontstaat.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24ac
  - number: 24ad
    text: |-
      1 Een houder van een startvergunning aardwarmte kan deze slechts met schriftelijke toestemming van Onze Minister op
      een ander doen overgaan. Onze Minister kan aan een toestemming voorschriften of beperkingen verbinden.

      2 Een verzoek om overdracht gaat vergezeld van de informatie, bedoeld in
      [artikel 24o, eerste lid, onderdeel g][ref1].

      3 [Artikel 24t, tweede lid, aanhef en onderdeel e][ref2], is van overeenkomstige toepassing.

      4 Indien de houder van een startvergunning aardwarmte een deel van zijn startvergunning aardwarmte op een ander
      wil doen overgaan, dient hij tevens een aanvraag in om splitsing van de startvergunning aardwarmte als bedoeld in
      [artikel 24ac, onderdeel a][ref3].


