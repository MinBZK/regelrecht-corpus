  - number: '3'
    text: |-
      1 Delfstoffen zijn eigendom van de staat.

      2 De eigendom van delfstoffen die met gebruikmaking van een winningsvergunning worden gewonnen, gaat door
      het winnen daarvan over op de vergunninghouder met dien verstande dat in het geval een overeenkomst als
      bedoeld in [artikel 93, eerste lid][ref1], tot stand is gekomen, een deel van de delfstoffen in eigendom
      overgaat op de vennootschap, bedoeld in [artikel 82, eerste lid][ref2], voor een percentage als bedoeld in
      [artikel 94, tweede lid, onder a][ref3], dat krachtens overeenkomst voor de vennootschap geldt.

      3 Het tweede lid is van overeenkomstige toepassing ten aanzien van delfstoffen die met gebruikmaking van een
      opsporingsvergunning in de vorm van monsters of formatiebeproevingen aan de ondergrond worden onttrokken.

      4 De eigendom van stoffen die met gebruikmaking van een opslagvergunning worden teruggehaald, komt door het
      terughalen daarvan te berusten bij degene die eigenaar was van de stoffen direct voorafgaande aan het in de
      ondergrond brengen daarvan, dan wel bij degene die ten tijde van het terughalen de rechtsopvolger is van die
      eigenaar.

      5 De staat wordt voor alle met de eigendom van delfstoffen verband houdende handelingen vertegenwoordigd door Onze
      Minister.


