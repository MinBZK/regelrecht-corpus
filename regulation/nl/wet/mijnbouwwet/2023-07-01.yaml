      1 Oppervlakterecht wordt op aangifte voldaan.

      2 De houder, of, ingeval van medehouderschap, de aangewezen medehouder, doet uiterlijk 1 april van het kalenderjaar
      waarover wordt geheven aangifte door de inlevering van een aangiftebiljet.
