  - number: 31e
    text: |-
      1 Een houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door meerdere personen wordt
      gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref1] stelt Onze Minister in kennis van de geplande
      wijzigingen van de exploitatie van het opslagvoorkomen en de injectiefaciliteiten met bijbehorende bovengrondse
      voorzieningen.

      2 Op een aanvraag van de houder van een vergunning voor permanent opslaan van CO om wijziging van een of meer
      onderdelen van een verleende vergunning is [artikel 31d, eerste lid][ref2], voor zover relevant van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel31d
