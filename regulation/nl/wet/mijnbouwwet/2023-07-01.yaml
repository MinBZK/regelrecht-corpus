  - number: '47'
    text: |-
      1 Onze Minister kan bepalen dat de houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25][ref2],
      binnen een door Onze Minister vast te stellen termijn zekerheid stelt aan de Staat der Nederlanden voor het
      verwijderen van een mijnbouwwerk.

      2 De zekerheid wordt gesteld vanaf een tijdstip, voor een bedrag, met een termijn en op een wijze die Onze Minister
      voldoende acht.

      3 Onze Minister kan een last onder dwangsom opleggen voor de handhaving van het eerste lid.

      4 Het eerste lid is van overeenkomstige toepassing op de houder van een ontheffing als bedoeld in
      [artikel 44b, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
