  - number: '87'
    text: |-
      1 De vennootschap verleent op verzoek van de houder van een opsporingsvergunning medewerking aan de totstandkoming
      van een opsporingsovereenkomst.

      2 De opsporingsovereenkomst komt binnen een periode van zes maanden tot stand, ingaande op het tijdstip waarop
      de vergunninghouder een verzoek als bedoeld in het eerste lid heeft gedaan. Onze Minister kan de termijn van zes
      maanden eenmaal met ten hoogste zes maanden verlengen. De opsporingsovereenkomst behoeft de instemming van Onze
      Minister.

      3 De opsporingsovereenkomst kan niet worden gewijzigd of ontbonden dan na instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel87
  - number: '88'
    text: |-
      In de opsporingsovereenkomst worden bepalingen opgenomen, die ertoe strekken dat ten behoeve van de
      opsporingswerkzaamheden wordt samengewerkt, waarbij:

      a. de vergunninghouder voor 60% en de vennootschap voor 40% belang neemt;

      b. de werken die door het doen van de in [artikel 90, eerste lid, onderdeel a][ref1], bedoelde investeringen tot
      stand zijn gekomen voor 60% toebehoren aan de vergunninghouder en voor 40% aan de vennootschap;

      c. de vergunninghouder en de vennootschap ten behoeve van de samenwerking, in verhouding tot ieders belang
      in de samenwerking, de middelen verstrekken die bestemd zijn voor het doen van de uitgaven, bedoeld in
      [artikel 90, eerste lid, onderdeel a][ref2];

      d. op de overeenkomst Nederlands recht van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel90
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel88
