  - number: 52h
    text: |-
      1 De houder van de winningsvergunning Groningenveld zendt binnen een maand na afloop van een gasjaar een rapportage
      aan Onze Minister en de inspecteur-generaal der mijnen over:

      a. het temperatuurscenario dat zich in het afgelopen gasjaar heeft voorgedaan;

      b. de hoeveelheid gewonnen gas uit het Groningenveld in het afgelopen gasjaar;

      c. de inzet van de clusters en de gasopslag Norg;

      d. of de winning conform de door Onze Minister vastgestelde operationele strategie is uitgevoerd;

      e. de waargenomen bodembeweging.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de rapportage, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel52h
  - number: 52i
    text: |-
      1 In aanvulling op [artikel 36, tweede lid][ref1], kan Onze Minister zijn instemming met een opslagplan verlenen
      onder beperkingen of daaraan voorschriften verbinden gelet op het belang van het minimaliseren van de gaswinning
      uit het Groningenveld.

      2 In aanvulling op [artikel 36, derde lid][ref2], kan Onze Minister zijn instemming met een opslagplan intrekken
      of beperkingen en voorschriften stellen of wijzigen gelet op het belang van het minimaliseren van de gaswinning uit
      het Groningenveld.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel36
