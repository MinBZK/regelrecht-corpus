      1 Bij besluit van Onze Minister kunnen andere ambtenaren worden aangewezen die zijn belast met het toezicht op de
      naleving van het bepaalde bij of krachtens deze wet met uitzondering van het bij of krachtens [artikel 52][ref1]
      bepaalde, voorzover het toezicht bepaalde in het besluit aangegeven gevallen betreft.

      2 Onze Minister wijst ambtenaren die onder een van Onze andere Ministers ressorteren niet aan, dan in
      overeenstemming met Onze Minister wie het aangaat.

      3 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


