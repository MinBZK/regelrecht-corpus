  - number: '106'
    text: |-
      1 De Mijnraad bestaat uit een voorzitter en ten hoogste negen andere leden.

      2 De voorzitter en de andere leden van de Mijnraad worden door Onze Minister benoemd, geschorst en ontslagen.
      De raad kan uit zijn midden ondervoorzitters aanwijzen. De benoeming van de leden geschiedt op grond van hun
      deskundigheid op gebieden die van belang zijn voor de mijnbouw en met de mijnbouw verwante activiteiten.

      3 De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan telkens voor ten hoogste vier jaar
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel106
  - number: '107'
    text: |-
      1 De Mijnraad heeft een secretariaat, dat bestaat uit een of meer door Onze Minister aan te wijzen personen.

      2 De aangewezen personen zijn voor hun werkzaamheden voor de Mijnraad uitsluitend verantwoording schuldig aan de
      raad.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel107
  - number: '108'
    text: |-
      Leden van de Mijnraad onthouden zich van stemming over een advies, indien dit een zaak betreft waarbij zij
      persoonlijk belang hebben.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel108
  - number: '109'
    text: |-
      1 De Mijnraad stelt een bestuursreglement vast.

      2 Het bestuursreglement en de daarin aangebrachte wijzigingen behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel109
  - number: '110'
    text: |-
      De Mijnraad stelt jaarlijks voor 1 juli een verslag op van de werkzaamheden en de doelmatigheid en doeltreffendheid
      van zijn werkzaamheden en werkwijze in het afgelopen kalenderjaar. Het verslag wordt aan Onze Minister toegezonden.
      Onze Minister zendt het verslag alsmede een schriftelijke reactie daarop aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel110
  - number: '111'
    text: |-
      De Mijnraad verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voorzover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel111
  - number: '112'
    text: |-
      Het beheer van de bescheiden betreffende de werkzaamheden van de Mijnraad geschiedt op overeenkomstige wijze als
      bij het Ministerie van Economische Zaken en Klimaat. De bescheiden worden na beëindiging van de werkzaamheden van
      de raad opgeborgen in het archief van dat ministerie.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel112
  - number: '113'
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. commissie: Technische commissie bodembeweging;

      b. mijnbouwactiviteiten: activiteiten als bedoeld in de [artikelen 1, onderdeel d tot en met i][ref1], en
      [51][ref2];

      c. mijnbouwondernemer: natuurlijke persoon of rechtspersoon die mijnbouwactiviteiten verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel51
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel113
