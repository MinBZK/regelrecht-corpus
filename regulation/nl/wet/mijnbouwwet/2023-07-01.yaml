    text: |-
      Cijns wordt geheven van de houder, of, ingeval van medehouderschap, van ieder van de medehouders, van een
      winningsvergunning.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel60
  - number: '61'
    text: |-
      Indien in het vergunningsgebied zowel aardgas als aardolie zijn gewonnen, wordt over aardgas en aardolie
      afzonderlijk cijns geheven.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel61
  - number: '62'
    text: |-
      1 De heffingsmaatstaf is de omzet die de houder, of, ingeval van medehouderschap, ieder van de medehouders, heeft
      behaald in het kalenderjaar waarover de cijns wordt geheven.

      2 De omzet is het aantal in het kalenderjaar in het vergunningsgebied gewonnen eenheden aardolie of aardgas dat
      aan de houder, of, ingeval van medehouderschap, aan ieder van de medehouders toekomt, vermenigvuldigd met de prijs
      per eenheid waarvoor die eenheden zijn verkocht. Indien ter zake van die verkoop voorwaarden worden overeengekomen
      of opgelegd die afwijken van voorwaarden die in het economische verkeer door onafhankelijke partijen zouden zijn
      overeengekomen, wordt de in het eerste lid bedoelde omzet bepaald alsof die laatstbedoelde voorwaarden zouden
      zijn overeengekomen. Indien eenheden anders dan door verkoop aan het winningsbedrijf zijn onttrokken, wordt de in
      het eerste lid bedoelde omzet bepaald alsof deze eenheden zijn verkocht onder voorwaarden die in het economische
      verkeer door onafhankelijke partijen zouden zijn overeengekomen.

      3 Bij de bepaling van het aantal gewonnen eenheden blijven buiten beschouwing de eenheden aardolie of aardgas welke
      zijn aangewend ten behoeve van:

      a. het opsporen of het winnen in het vergunningsgebied waar ze zijn gewonnen;

      b. het voor de aflevering bewerken van die eenheden en het transport naar de plaats waar die bewerking plaatsvindt.

      4 Onder de omzet, bedoeld in het tweede lid, wordt mede verstaan het resultaat uit een rechtshandeling
      die strekt tot het afdekken van een prijsrisico dat ter zake van gewonnen of te winnen koolwaterstoffen
      wordt gelopen, tot ten hoogste het aantal in het kalenderjaar in het vergunningsgebied gewonnen
      eenheden aardolie of aardgas dat daadwerkelijk is verkocht. De eerste zin is niet van toepassing op
      rechtshandelingen die zijn aangegaan met een aan de houder of medehouder verbonden lichaam als bedoeld in
      [artikel 10a, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref1].

      5 Eenheden aardolie of aardgas welke overeenkomstig [artikel 94, tweede lid, onderdeel a][ref2], aan de in dat
      artikel bedoelde vennootschap toekomen, blijven bij de toepassing van het eerste lid buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel94
