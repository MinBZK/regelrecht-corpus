      1 Bij of krachtens algemene maatregel van bestuur kunnen ter bescherming van de veiligheid met het oog op
      instorting regels worden gesteld omtrent het met gebruikmaking van een boorgat, tunnel, schacht of ander
      ondergronds werk onttrekken aan de ondergrond van:

      a. delfstoffen, voorzover deze op een diepte van minder dan 100 meter beneden de oppervlakte van de aardbodem
      aanwezig zijn;

      b. andere vaste stoffen dan kalksteen of delfstoffen.

      2 De in het eerste lid bedoelde algemene maatregel van bestuur kan bepalen dat:

      a. de onttrekking van stoffen, bedoeld in het eerste lid, zonder vergunning van Onze Minister verboden is;

      b. Onze Minister bij de maatregel omschreven bevoegdheden heeft ter uitvoering van daarbij aangewezen regels.

      3 Onze Minister kan, in gevallen waarin ernstige aantasting van de veiligheid met het oog op instorting ontstaat of
      dreigt te ontstaan, maatregelen voorschrijven ten aanzien van de in het eerste lid bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel51
  - number: '52'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen ter bescherming van de veiligheid met het oog op
      instorting regels worden gesteld omtrent het met gebruikmaking van een boorgat, tunnel, schacht of ander
      ondergronds werk onttrekken aan de ondergrond van kalksteen alsmede omtrent het gebruik van een vorenbedoeld
      ondergronds werk voor andere doeleinden dan het onttrekken van kalksteen.

      2 De in het eerste lid bedoelde algemene maatregel van bestuur kan bepalen dat:

      a. het verrichten van de activiteiten, bedoeld in het eerste lid, zonder vergunning van gedeputeerde staten van de
      provincie waarin het werk geheel of voor het grootste deel is gelegen, verboden is;

      b. indien het betreft het gebruik van een ondergronds werk voor andere doeleinden dan het onttrekken van kalksteen,
      voor het verrichten van deze activiteiten geen vergunning maar een voorafgaande schriftelijke melding hiervan aan
      gedeputeerde staten van de provincie waarin het werk geheel of voor het grootste deel is gelegen, is vereist;

      c. gedeputeerde staten van de provincie waarin het werk geheel of voor het grootste deel is gelegen bij de
      maatregel omschreven bevoegdheden hebben ter uitvoering van daarbij aangewezen regels.

      3 Provinciale staten van de provincie waarin het werk geheel of voor het grootste deel is gelegen, kunnen in geval
      van een meldingsplicht regels stellen voor het gebruik van een ondergronds werk voor andere doeleinden dan het
      onttrekken van kalksteen.

      4 Gedeputeerde staten van de provincie waarin het werk geheel of voor het grootste deel is gelegen, kunnen, in
      gevallen waarin ernstige aantasting van de veiligheid met het oog op instorting ontstaat of dreigt te ontstaan,
      maatregelen voorschrijven ten aanzien van de in het eerste lid bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel52
  - number: 52a
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *gasopslag Norg:* de ondergrondse gasopslag bij Norg waarvoor op basis van [artikel 25][ref1] op 1 april 2003
      vergunning is verleend;
        - *netbeheerder:* de vennootschap die op grond van [artikel 2, eerste lid, van de Gaswet][ref2] is aangewezen als
      beheerder van het landelijk gastransportnet, bedoeld in [artikel 1, eerste lid, onderdeel n, van de Gaswet][ref3];
        - *veiligheidsbelang:* de veiligheidsrisico’s voor omwonenden als gevolg van bodembeweging veroorzaakt door
      de winning van gas uit het Groningenveld en de veiligheidsrisico’s als gevolg van het niet kunnen voorzien van
      eindafnemers van de benodigde hoeveelheid laagcalorisch gas;
        - *winningsvergunning Groningenveld:* de op basis van het koninklijk besluit van 30 mei 1963, nr. 39 (Stcrt. 126)
      verleende winningsvergunning voor zover het het Groningenveld betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel2
