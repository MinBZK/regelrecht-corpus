  - number: '69'
    text: |-
      1 Het tarief bedraagt 50%.

      2 Het door de houder of de medehouder verschuldigde bedrag aan winstaandeel over een boekjaar wordt, voorzover
      mogelijk, verminderd met het op dat boekjaar betrekking hebbende verrekenbare bedrag dat wordt berekend op de in
      het derde lid aangegeven wijze. Indien niet het gehele verrekenbare bedrag in mindering kan worden gebracht, wordt
      het overschot opgeteld bij het verrekenbare bedrag over het volgende boekjaar. Indien het verrekenbare bedrag
      negatief is, wordt dit in mindering gebracht op het verrekenbare bedrag over het volgende boekjaar.

      3 Onder het verrekenbare bedrag, bedoeld in het tweede lid, wordt verstaan het bedrag dat wordt verkregen door:

      a. het resultaat van de winst- en verliesrekening over het boekjaar te bepalen, met dien verstande dat daarbij
      [artikel 68, derde lid][ref1], buiten beschouwing wordt gelaten;

      b. dit resultaat te verminderen met het over het boekjaar na toepassing van dit artikel te betalen bedrag aan
      winstaandeel;

      c. op dit verschil het voor het boekjaar geldende tarief van de vennootschapsbelasting toe te passen.

      4 Het tweede lid is niet van toepassing indien de houder of de medehouder ter zake van het met het winningsbedrijf
      behaalde resultaat niet is onderworpen aan de Nederlandse belastingheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel68
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel69
