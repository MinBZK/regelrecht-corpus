  - number: '30'
    text: |-
      1 Onze Minister kan een opslagvergunning wijzigen of geheel of gedeeltelijk intrekken, indien dit wordt
      gerechtvaardigd op grond van de in [artikel 29, tweede, derde en vierde lid][ref1], genoemde gronden.

      2 Voorts kan Onze Minister een opslagvergunning wijzigen of geheel of gedeeltelijk intrekken, indien niet wordt
      voldaan aan [artikel 39a][ref2].

      3 Onverminderd het eerste lid kan Onze Minister ook op grond van [artikel 31h][ref3] een vergunning voor permanent
      opslaan van CO wijzigen of geheel of gedeeltelijk intrekken.

      4 Van een beschikking tot wijziging of gehele of gedeeltelijke intrekking van een vergunning wordt mededeling
      gedaan in de Staatscourant.


