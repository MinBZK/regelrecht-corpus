  - number: '95'
    text: |-
      1 [Artikel 89][ref1] is van overeenkomstige toepassing.

      2 Voorts worden in de overeenkomst bepalingen opgenomen die de vergunninghouder ertoe verplichten:

      a. zorg te dragen dat de werken die voor de totstandkoming van de overeenkomst tot stand zijn gekomen binnen
      het vergunningsgebied, voor 60% gaan toebehoren aan de vergunninghouder en voor 40% gaan toebehoren aan de
      vennootschap;

      b. de vennootschap tijdig in te lichten en in staat te stellen om een belang tot een percentage van 40 te nemen
      in te treffen regelingen die verband houden met de winning en de afzet van de gewonnen koolwaterstoffen, zoals het
      transport, de opslag en de behandeling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel89
