  - number: '140'
    text: |-
      1 Onze Minister kent een natuurlijke persoon van wie in het voorlopig advies, bedoeld in
      [artikel 119, tweede lid][ref1], dan wel het definitieve advies, bedoeld in artikel 119, vierde lid, is vastgesteld
      dat bij hem zaakschade als gevolg van mijnbouwactiviteiten is opgetreden op diens verzoek een voorschot ten laste
      van het waarborgfonds toe, indien:

      a. de mijnbouwondernemer bedenkingen heeft tegen het voorlopig advies dan wel het definitieve advies betwist, en

      b. noodzakelijke maatregelen moeten worden getroffen ter herstel of beperking van de schade.

      Het bedrag dat aan voorschotten kan worden verstrekt bedraagt ten hoogste 60 procent van het schadebedrag dat in
      het voorlopig advies wordt vermeld.

      2 Indien in een overeenkomst als bedoeld in [artikel 900 van Boek 7 van het Burgerlijk Wetboek][ref2]
      of bij onherroepelijke rechterlijke uitspraak wordt vastgesteld dat de schade niet het gevolg is van de
      mijnbouwactiviteiten dan wel het schadebedrag op een lager bedrag wordt vastgesteld dan het bedrag dat in totaal
      aan voorschotten is verstrekt, betaalt de persoon, bedoeld in het eerste lid, binnen drie maanden na het moment
      waarop die overeenkomst is gesloten of die uitspraak is gedaan het voorschot dan wel het verschil tussen het
      schadebedrag en het voorschot terug aan het waarborgfonds.


