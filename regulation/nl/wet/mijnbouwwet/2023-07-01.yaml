      1 Een aanvrager, een verzoeker, een exploitant van een productie-installatie, een eigenaar van
      een niet-productie-installatie, een eigenaar van een pijpleiding, een netbeheerder als bedoeld in
      [artikel 1 van de Gaswet][ref1] en een aanvrager of houder van een zoekgebied aardwarmte, van een
      startvergunning aardwarmte of een vervolgvergunning aardwarmte, zijn, indien van toepassing in afwijking van
      [artikel 2.9a. van de Wet algemene bepalingen omgevingsrecht][ref2], een vergoeding verschuldigd voor:

      a. het door Onze Minister:

      1°. op aanvraag verlenen, wijzigen of intrekken van een vergunning, ontheffing, instemming, maatwerkvoorschrift
      of toestemming;

      2°. adviseren over of instemmen met activiteiten inzake een mijnbouwwerk, het beoordelen van een melding of het
      beoordelen van gegevens en bescheiden die zijn verstrekt voor een activiteit inzake een mijnbouwwerk;

      b. de door de inspecteur-generaal uit te voeren taken als bedoeld in
      [artikel 127, eerste lid, onderdelen a tot en met g][ref3], met dien verstande dat een vergoeding niet in rekening
      wordt gebracht voor:

      1°. advisering en onderzoek dat wordt uitgevoerd voor een ander doel dan een advies aan of het toezicht op een
      besluit van Onze Minister, respectievelijk de inspecteur generaal der mijnen, over handelingen als bedoeld in
      onderdeel a, onder 1° en 2°;

      2°. het vaststellen van een besluit als bedoeld in [artikel 132][ref4].

      2 Bij algemene maatregel van bestuur worden regels gesteld over de vergoeding.

      3 De hoogte van de vergoeding wordt bij ministeriële regeling vastgesteld.

      4 Onze Minister kan de verschuldigde bedragen invorderen bij dwangbevel. [Titel 4.4][ref5], met uitzondering van
      de [artikelen 4:85][ref6] en [4:95, van de Algemene wet bestuursrecht][ref7] is, voor zover al niet van toepassing,
      van overeenkomstige toepassing.

      5 Voor zover een door Onze Minister in rekening gebracht bedrag verplicht tot betaling van een geldsom, komt deze
      geldsom toe aan de Staat der Nederlanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
