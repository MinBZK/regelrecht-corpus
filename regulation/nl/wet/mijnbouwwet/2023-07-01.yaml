      4 Het tarief over enig kalenderjaar wordt verhoogd met 25%, indien over dat jaar het gewogen gemiddelde van de
      waarde van in Nederland ingevoerde ruwe olie hoger is dan € 25 per vat. Bij ministeriële regeling worden regels
      gesteld omtrent de wijze waarop het in de eerste volzin bedoelde gewogen gemiddelde wordt bepaald.

      5 Het tarief wordt, onverminderd de verhoging op grond van het vierde lid, verhoogd met 100%, indien de houder geen
      overeenkomst als bedoeld in [artikel 93][ref2] heeft gesloten ten aanzien van de winningsvergunning. Deze verhoging
      vindt niet plaats met betrekking tot de eenheden die zijn gewonnen uit een voorkomen ten aanzien waarvan een
      overeenkomst als bedoeld in [artikel 97b][ref3] is gesloten.

      6 Voor zover de gemiddelde prijs van aardgas in het kalenderjaar 2023 of 2024 meer bedraagt dan € 0,50 per m3
      wordt, in afwijking van het eerste lid, eerste zin, derde, vierde en vijfde lid, het tarief over die kalenderjaren
      gesteld op 65% voor de omzet ten aanzien van dit meerdere.

      7 De gemiddelde prijs, bedoeld in het zesde lid, wordt bepaald door de omzet in het kalenderjaar te delen door het
      totaal in dat kalenderjaar in het vergunningsgebied gewonnen aantal eenheden aardgas, bedoeld in het eerste lid.


