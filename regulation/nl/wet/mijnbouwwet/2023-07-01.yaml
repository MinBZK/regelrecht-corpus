  - number: '96'
    text: |-
      1 [Artikel 90][ref1] is van overeenkomstige toepassing.

      2 Voorts wordt in de overeenkomst een bepaling opgenomen die de vennootschap ertoe verplicht aan de
      vergunninghouder terstond te vergoeden 40% van het bedrag, bedoeld in [artikel 94, derde lid][ref2], vermeerderd
      met een enkelvoudige rente, waarvan het percentage gelijk is aan dat van de wettelijke rente, over een tijdvak van
      ten hoogste vijf jaar, te rekenen vanaf het tijdstip waarop de desbetreffende kosten zijn gemaakt.

      3 Het tweede lid blijft buiten toepassing, voorzover de vennootschap in het kader van een opsporingsovereenkomst de
      in [artikel 94, derde lid][ref3], bedoelde kosten reeds heeft voldaan.


