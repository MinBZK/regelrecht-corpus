  - number: 68a
    text: |-
      1 Als een houder van een vergunning investeert in een niet verplaatsbaar mijnbouwwerk, voor de opsporing of
      winning van een voorkomen van koolwaterstoffen kan de houder en, ingeval van medehouderschap, de medehouder bij de
      berekening van de heffingsmaatstaf, bedoeld in [artikel 66, eerste lid][ref1], aanvullend 40% van zijn deel van
      het investeringsbedrag ten laste brengen van het resultaat.

      2 Onder investeren wordt verstaan:

      a. het aangaan van verplichtingen voor en het maken van kosten voor het aanschaffen van een ten aanzien van het
      voorkomen niet eerder gebruikt mijnbouwwerk;

      b. het maken van voortbrengingskosten voor een ten aanzien van het voorkomen niet eerder gebruikt mijnbouwwerk;

      c. het maken van kosten voor het aanpassen of verbeteren van een mijnbouwwerk en

      d. het maken van kosten voor het aanleggen, het uitbreiden en het wijzigen van een boorgat, waaronder, in
      voorkomend geval, de kosten van het huren of gebruiken van een verplaatsbaar mijnbouwwerk;

      voor zover die verplichtingen, respectievelijk kosten, op de houder dan wel de medehouder drukken.

      3 [Artikel 8, achtste lid, aanhef en onderdeel b en c, van de Wet op de vennootschapsbelasting 1969][ref2] is van
      overeenkomstige toepassing.

      4 Als de houder van de vergunning aan het einde van het boekjaar het mijnbouwwerk, dan wel de aanpassing of
      verbetering van het mijnbouwwerk, nog niet in gebruik heeft genomen en de investeringsaftrek, bedoeld in het eerste
      lid, zou uitgaan boven het bedrag dat aan het einde van het jaar voor de investering is betaald, wordt in afwijking
      van het eerste lid voor de berekening van de investeringsaftrek een bedrag in aanmerking genomen dat gelijk is aan
      de betaling en wordt het meerdere in aanmerking genomen in de volgende jaren, voor zover betalingen plaatsvinden,
      maar niet later dan in het jaar waarin het mijnbouwwerk, dan wel de aanpassing of verbetering van het mijnbouwwerk,
      in gebruik wordt genomen.

      5 Als de houder of, ingeval van medehouderschap, de medehouder van een opsporingsvergunning niet tevens houder,
      respectievelijk medehouder, is van een winningsvergunning, kan deze houder of medehouder de in het eerste lid
      bedoelde investeringsaftrek ten laste van het resultaat brengen in het eerste jaar waarin hij houder of medehouder
      is van een winningsvergunning. Het vierde lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel8
