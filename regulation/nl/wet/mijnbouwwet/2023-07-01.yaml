  - number: '94'
    text: |-
      1 [Artikel 88][ref1] is van overeenkomstige toepassing.

      2 Voorts worden in de overeenkomst bepalingen opgenomen, die ertoe strekken dat ten behoeve van de
      mijnbouwwerkzaamheden wordt samengewerkt, waarbij:

      a. de vergunninghouder en de vennootschap de verdeling van de uit de voorkomens gewonnen en beschikbare
      hoeveelheden koolwaterstoffen vaststellen op 60% voor de vergunninghouder, respectievelijk 40% voor de
      vennootschap;

      b. zowel de vergunninghouder als de vennootschap gerechtigd is het eigen aandeel in de gewonnen en beschikbare
      hoeveelheden koolwaterstoffen in natura op te nemen, met dien verstande dat zij ernaar streven zoveel mogelijk
      samen te werken bij de verkoop van de gewonnen en beschikbare hoeveelheden koolwaterstoffen uit de voorkomens;

      c. de vergunninghouder en de vennootschap ten behoeve van de afzet regelmatig overleg plegen.

      3 In de overeenkomst wordt het bedrag vastgesteld van de door de vergunninghouder reeds gemaakte kosten:

      a. die naar redelijkheid kunnen worden toegeschreven aan de activiteiten die tot het aantreffen van het voorkomen
      hebben geleid;

      b. van de verdere evaluatie van dat voorkomen;

      c. van investeringen ten behoeve van de mijnbouwwerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel88
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel94
