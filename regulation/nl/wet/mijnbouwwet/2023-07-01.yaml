  - number: '10'
    text: |-
      1 Onverminderd de [artikelen 7][ref1] en [8][ref2] wordt de houder van een opsporingsvergunning die met
      gebruikmaking van die vergunning de aanwezigheid van de betrokken delfstoffen heeft aangetoond, op zijn aanvraag,
      ingediend gedurende de geldingsduur van die vergunning, een winningsvergunning voor die delfstoffen verleend voor
      het gebied waarvoor de opsporingsvergunning geldt. Indien de opsporingsvergunning geldt voor een gebied dat niet
      overeenkomstig [artikel 11, vijfde lid][ref3], is begrensd en de aanwezigheid van de betrokken delfstoffen slechts
      in een deel van het gebied is aangetoond, wordt de winningsvergunning verleend voor het deel van het gebied,
      waarvoor verlening uit geologisch oogpunt gerechtvaardigd is.

      2 Het eerste lid geldt niet, indien weigering van de winningsvergunning gerechtvaardigd wordt door een van de in
      [artikel 9, eerste lid, onderdelen a tot en met c, e en f][ref4], genoemde gronden. Artikel 9, tweede, derde en
      vierde lid, is van overeenkomstige toepassing.

      3 Indien een aanvraag als bedoeld in het eerste lid is ingediend, blijft de opsporingsvergunning, voorzover
      deze betrekking heeft op het aangevraagde gebied, tenminste gelden tot het tijdstip waarop de beschikking
      waarbij op de aanvraag wordt beslist onherroepelijk wordt. Indien een winningsvergunning wordt verleend, vervalt
      op het tijdstip waarop de beschikking onherroepelijk wordt, voor het gebied waarvoor de winningsvergunning
      geldt, de opsporingsvergunning voor de betrokken delfstoffen. Voorzover hierdoor voorschriften als bedoeld in
      [artikel 12][ref5] vervallen die nog niet zijn uitgewerkt, gaan zij gelden als voorschriften die zijn verbonden aan
      de winningsvergunning.


