  - number: '27'
    text: |-
      1 Onverminderd [artikel 26][ref1] kan een opslagvergunning slechts geheel of gedeeltelijk worden geweigerd:

      a. op grond van de technische of financiële mogelijkheden van de aanvrager,

      b. op grond van de manier waarop de aanvrager voornemens is de activiteiten voor het opslaan van stoffen te
      verrichten, waaronder de daarbij te gebruiken technieken, hulpmiddelen of stoffen,

      c. op grond van het gebrek aan efficiëntie en verantwoordelijkheidszin waarvan de aanvrager blijk heeft gegeven bij
      activiteiten onder een eerdere vergunning op grond van deze wet,

      d. in het belang van de veiligheid voor omwonenden en het voorkomen van schade aan gebouwen of infrastructurele
      werken of de functionaliteit daarvan,

      e. in het belang van de landsverdediging,

      f. in het belang van een planmatig gebruik of beheer van delfstoffen, aardwarmte, andere natuurlijke rijkdommen,
      waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van stoffen,

      g. ter nakoming van het op 7 november 1996 te Londen tot stand gekomen Protocol bij het op 29 december 1972 te
      Londen tot stand gekomen Verdrag inzake de voorkoming van verontreiniging van de zee ten gevolge van het storten
      van afval en andere stoffen (Trb. 1998, 134 en Trb. 2000, 27),

      h. indien het algemeen belang vereist dat het gebied waarvoor een opslagvergunning wordt aangevraagd, wordt
      gebruikt voor de opslag van andere dan in de aanvraag omschreven stoffen,

      i. indien een keuze moet worden gemaakt uit twee of meer aanvragen om een vergunning die bij een beoordeling op
      grond van de onderdelen a tot en met h gelijkwaardig zijn gebleken, in het belang van het doelmatig en voortvarend
      opslaan,

      j. in verband met bij of krachtens een algemene maatregel van bestuur als bedoeld in
      [artikel 4.3, eerste lid][ref2], of [10.8, eerste lid, van de Wet ruimtelijke ordening][ref3]
      voor een gebied op land, respectievelijk in de territoriale zee, bedoeld in
      [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref4], gestelde regels inhoudende dat het
      opslaan van stoffen door middel van een installatie in dat gebied niet wordt of kan worden toegestaan, of

      k. in verband met bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 49][ref5] gestelde
      regels over:

      1°. het geheel of gedeeltelijk uitsluiten van een gebied van het opslaan van stoffen,

      2°. de diepte waarop een activiteit plaatsvindt,

      3°. de soort activiteit, of

      4°. de soort stof die wordt opgeslagen.

      2 Een vergunning kan op grond van de financiële mogelijkheden van de aanvrager worden geweigerd als
      onvoldoende verzekerd is dat de aanvrager zal voldoen aan hem op te leggen verplichtingen als bedoeld in de
      [artikelen 46][ref6], [47][ref7] en [102][ref8].

      3 Onverminderd [artikel 26][ref9] wordt een vergunning voor permanent opslaan van CO geweigerd indien:

      a. bij opslag onder de voorgestelde exploitatievoorwaarden een significant risico van lekkage bestaat of
      significante milieu- of gezondheidsrisico’s bestaan;

      b. door verlening van de vergunning zich in dezelfde hydraulische eenheid meer dan één opslagvoorkomen zou
      gaan bevinden en de potentiële drukinteracties zodanig zijn dat beide voorkomens niet tegelijk aan de eisen van
      veiligheid kunnen voldoen.

      4 Met het oog op de toepassing van het eerste, tweede en derde lid kunnen bij ministeriële regeling nadere regels
      worden gesteld, die bij de beslissing op een aanvraag om een vergunning in acht worden genomen.


