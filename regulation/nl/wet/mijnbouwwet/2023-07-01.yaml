  - number: '97'
    text: |-
      1 [Artikel 91, onderdelen a en b][ref1], is van overeenkomstige toepassing.

      2 Voorts worden in de overeenkomst bepalingen opgenomen die ertoe strekken dat een gezamenlijk besluit van de
      vergunninghouder en de vennootschap, waarbij de vennootschap en, als de vergunning door meerdere personen gehouden
      wordt, de persoon, bedoeld in [artikel 22, vijfde lid][ref2], elk een beslissende stem hebben, vereist is voor:

      1°. het jaarlijkse investerings- en financieringsplan;

      2°. niet in het jaarlijkse investerings- en financieringsplan opgenomen activiteiten en aanschaffingen, die een
      bedrag van € 500 000 te boven gaan;

      3°. de meerjarenplanning ten aanzien van mijnbouwwerkzaamheden binnen het vergunningsgebied;

      4°. het de vergunninghouder toestaan dat overeenkomstig het beperkte doel van de samenwerking een deel van de
      mijnbouwwerkzaamheden niet of niet langer zal geschieden voor rekening van de vergunninghouder en de vennootschap
      gezamenlijk;

      5°. het aangaan van verplichtingen tot levering van koolwaterstoffen;

      6°. besluiten inzake het vervoer van gewonnen koolwaterstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel91
