  - number: '101'
    text: |-
      1 Indien een afdracht als bedoeld in [artikel 98, eerste lid][ref1], aan de staat of een vooruitbetaling op een
      afdracht als bedoeld in artikel 98, eerste lid, op een later tijdstip op een ander bedrag wordt vastgesteld, wordt
      bij die latere vaststelling de rentederving in rekening gebracht die voor de betrokkene of voor de staat uit die
      latere vaststelling voortvloeit. Daarbij wordt een enkelvoudige rente in rekening gebracht.

      2 Aan de betrokkene wordt een enkelvoudige rente in rekening gebracht over het bedrag waarvoor overeenkomstig
      [artikel 25 van de Invorderingswet 1990][ref2] uitstel van betaling is verleend. De rente wordt berekend over het
      tijdvak waarvoor uitstel is verleend.

      3 Het percentage van de rente, bedoeld in het eerste en het tweede lid, is gelijk aan het percentage van de
      belastingrente, bedoeld in [artikel 30hb van de Algemene wet inzake rijksbelastingen][ref3].

      4 Een rente, bedoeld in het eerste en het tweede lid, is aan de staat verschuldigd met ingang van de dag na die
      waarop de vaststelling aan de betrokkene bekend is gemaakt. [Artikel 100][ref4] is van overeenkomstige toepassing
      ten aanzien van de betaling en de invordering van deze rente.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel30hb
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel100
