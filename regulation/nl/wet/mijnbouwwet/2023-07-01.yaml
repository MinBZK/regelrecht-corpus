      (versterking veiligheidsbelang mijnbouw en regie opsporings-, winnings- en opslagvergunningen)](onbekend)
      (Stb. 2016, 554), heeft geen gevolgen voor de houder van een vergunning, die voor de datum van inwerkingtreding van
      die wijziging is verleend.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel167b
  - number: 167c
    text: |-
      Bij de instemming met het winningsplan voor het Groningenveld in 2018 op grond van [artikel 34][ref1], neemt Onze
      Minister, in aanvulling op [artikel 36][ref2], de bijzondere functie van het Groningenveld voor het kunnen voorzien
      van eindafnemers van de benodigde hoeveelheid laagcalorisch gas in acht.


