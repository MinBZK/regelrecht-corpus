  - number: '8'
    text: |-
      Een winningsvergunning wordt slechts verleend, indien aannemelijk is dat de delfstoffen binnen het gebied waarvoor
      de vergunning zal gelden economisch winbaar zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel8
  - number: '9'
    text: |-
      1 Onverminderd de [artikelen 7][ref1] en [8][ref2] kan een vergunning slechts geheel of gedeeltelijk worden
      geweigerd:

      a. op grond van de technische of financiële mogelijkheden van de aanvrager,

      b. op grond van de manier waarop de aanvrager voornemens is de activiteiten voor opsporing of winning te
      verrichten, waaronder de bij die activiteiten te gebruiken technieken, hulpmiddelen of stoffen,

      c. op grond van het gebrek aan efficiëntie en verantwoordelijkheidszin, daaronder mede verstaan maatschappelijke
      verantwoordelijkheidszin, waarvan de aanvrager blijk heeft gegeven bij activiteiten als bedoeld in de
      [artikelen 6][ref3], [24b][ref4] en [25, eerste lid][ref5] onder een eerdere vergunning,

      d. indien een keuze moet worden gemaakt uit twee of meer aanvragen om een vergunning die bij een beoordeling op
      grond van de onderdelen a, b en c gelijkwaardig zijn gebleken, in het belang van het doelmatig en voortvarend
      opsporen en winnen,

      e. indien:

      1°. bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 4.3, eerste lid][ref6], of
      [10.8, eerste lid, van de Wet ruimtelijke ordening][ref7] voor een gebied op land, respectievelijk in de
      territoriale zee, bedoeld in [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref8],
      regels zijn gesteld inhoudende dat de opsporing of winning van een delfstof door middel van een opsporings- of
      winningsinstallatie in dat gebied niet wordt of kan worden toegestaan,

      2°. bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 49][ref9] regels zijn gesteld over:

        - het geheel of gedeeltelijk uitsluiten van een gebied van de opsporing of winning van een delfstof,
        - de diepte waarop een activiteit plaatsvindt,
        - de soort activiteit, of
        - de soort delfstof,

      f. indien het in de aanvraag aangeduide gebied door Onze Minister niet geschikt wordt geacht voor de in de aanvraag
      vermelde activiteit om reden van het belang van:

      1°. de veiligheid voor omwonenden of het voorkomen van schade aan gebouwen of infrastructurele werken of de
      functionaliteit daarvan, voor zover het winnen van delfstoffen niet geschiedt in het continentaal plat,

      2°. het planmatig gebruik of beheer van delfstoffen, andere natuurlijke rijkdommen, waaronder grondwater met het
      oog op de winning van drinkwater, of mogelijkheden tot het opslaan van stoffen,

      3°. nadelige gevolgen die voor het milieu worden veroorzaakt, of

      4°. nadelige gevolgen die voor de natuur worden veroorzaakt.

      2 Een vergunning kan op grond van de financiële mogelijkheden van de aanvrager worden geweigerd als onvoldoende
      verzekerd is dat de aanvrager zal voldoen aan hem op te leggen verplichtingen als bedoeld in de artikelen
      [46][ref10], [47][ref11] en [102][ref12].

      3 Met het oog op de toepassing van het eerste en tweede lid kunnen bij ministeriële regeling nadere regels worden
      gesteld die bij de beslissing op een aanvraag om een vergunning in acht worden genomen. Zodanige regels worden in
      elk geval gesteld met betrekking tot opsporings- en winningsvergunningen voor koolwaterstoffen.

      4 Van de plaatsing in de Staatscourant van een regeling als bedoeld in de tweede volzin van het derde lid wordt
      mededeling gedaan in het Publicatieblad van de Europese Unie. Van een besluit tot wijziging van zodanige regeling
      wordt eveneens mededeling gedaan in het Publicatieblad van de Europese Unie.


