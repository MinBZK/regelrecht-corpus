  - number: '28'
    text: |-
      In een opslagvergunning anders dan een vergunning voor permanent opslaan van CO wordt bepaald voor welke stoffen,
      voor welk gebied en voor welk tijdvak zij geldt. Daarbij wordt bepaald dat:

      a. de in de ondergrond gebrachte stoffen voor een in de vergunning geregeld tijdstip teruggehaald moeten worden, of

      b. de stoffen definitief in de ondergrond achtergelaten moeten worden.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel28
  - number: '29'
    text: |-
      1 Een opslagvergunning kan voorts onder andere beperkingen dan die bedoeld in [artikel 28][ref1] worden verleend.
      Aan een vergunning kunnen voorschriften worden verbonden.

      2 De beperkingen en voorschriften, anders dan de voorschriften op grond van [artikel 98][ref2], kunnen slechts
      worden gerechtvaardigd door het belang van de veiligheid voor omwonenden, het voorkomen van schade aan gebouwen
      of infrastructurele werken of de functionaliteit daarvan, de landsverdediging of het planmatig gebruik of beheer
      van delfstoffen, aardwarmte, andere natuurlijke rijkdommen, waaronder grondwater met het oog op de winning van
      drinkwater, of mogelijkheden tot het opslaan van stoffen.

      3 In afwijking van het tweede lid kunnen aan een vergunning voor permanent opslaan van CO ook beperkingen en
      voorschriften als bedoeld in [artikel 31d, eerste lid][ref3], worden verbonden.

      4 In aanvulling op het tweede lid kan een vergunning onder beperkingen worden verleend of kunnen aan een vergunning
      voorschriften worden verbonden:

      a. in verband met de manier waarop de aanvrager de activiteiten voor het opslaan van stoffen verricht of voornemens
      is te verrichten, waaronder de daarbij te gebruiken technieken, hulpmiddelen of stoffen,

      b. in verband met bij of krachtens een algemene maatregel van bestuur als bedoeld in
      [artikel 4.3, eerste lid][ref4], of [10.8, eerste lid, van de Wet ruimtelijke ordening][ref5] voor een gebied op
      land, respectievelijk in de territoriale zee, bedoeld in artikel 1, eerste lid, van de Wet grenzen Nederlandse
      territoriale zee, gestelde regels over het opslaan van stoffen door middel van een installatie,

      c. in verband met bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 49][ref6] gestelde
      regels over:

      1°. het geheel of gedeeltelijk uitsluiten van een gebied voor het opslaan van stoffen,

      2°. de diepte waarop een activiteit plaatsvindt,

      3°. de soort activiteit, of

      4°. de soort stof die wordt opgeslagen.


