  - number: 24ap
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. het splitsen van een vervolgvergunning aardwarmte, waardoor twee of meer vervolgvergunningen aardwarmte voor
      twee of meer gebieden ontstaan;

      b. het samenvoegen van delen van twee of meer vervolgvergunningen aardwarmte, waardoor een vervolgvergunning
      aardwarmte voor een gebied ontstaat.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24ap
  - number: 24aq
    text: |-
      1 De houder van een vervolgvergunning aardwarmte kan deze slechts met schriftelijke toestemming van Onze Minister
      op een ander doen overgaan. Aan een toestemming kunnen voorschriften worden verbonden of een toestemming kan onder
      beperkingen worden verleend.

      2 Een verzoek om overdracht gaat vergezeld van de informatie, bedoeld in
      [artikel 24af, eerste lid, onderdeel g en h][ref1].

      3 [Artikel 24aj, tweede lid, aanhef en onderdeel c, en d][ref2], is van overeenkomstige toepassing.

      4 Indien de houder van een vergunning een deel van zijn vergunning op een ander wil doen overgaan, dient hij tevens
      een aanvraag in om splitsing van de vergunning als bedoeld in [artikel 24ap][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24af
