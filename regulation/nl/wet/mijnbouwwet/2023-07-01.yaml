  - number: '91'
    text: |-
      In de opsporingsovereenkomst worden bepalingen opgenomen die ertoe strekken dat:

      a. een gezamenlijk besluit van de vergunninghouder en de vennootschap wordt genomen in een vergadering, waarin de
      vergunninghouder en de vennootschap worden vertegenwoordigd door een aantal gevolmachtigde personen, in verhouding
      tot ieders belang in de samenwerking;

      b. een gezamenlijk besluit van de vergunninghouder en de vennootschap, in afwijking van onderdeel a, buiten
      vergadering kan worden genomen, mits dit gebeurt bij een gezamenlijke schriftelijke verklaring of bij een
      gelijkluidende schriftelijke verklaring van de vergunninghouder en de vennootschap, door deze of hun gevolmachtigde
      vertegenwoordigers ondertekend;

      c. een gezamenlijk besluit van de vergunninghouder en de vennootschap, waarbij de vennootschap en, als de
      vergunning door meerdere personen gehouden wordt, de persoon, bedoeld in [artikel 22, vijfde lid][ref1], elk een
      beslissende stem hebben, vereist is voor:

      1°. het jaarlijkse investerings- en financieringsplan;

      2°. niet in het jaarlijkse investerings- en financieringsplan opgenomen activiteiten en aanschaffingen, die een
      bedrag van € 500 000 te boven gaan;

      3°. de meerjarenplanning ten aanzien van opsporingswerkzaamheden binnen het vergunningsgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '92'
    text: |-
      De vergunninghouder neemt geen besluit, inhoudende bij wie opdrachten worden geplaatst voor leveringen, voor het
      uitvoeren van werken of voor het verrichten van diensten, indien aannemelijk is dat dit besluit leidt tot:

      a. financieel nadeel voor de staat, voorzover het betreft hetgeen ingevolge dit hoofdstuk is verschuldigd, of

      b. financieel nadeel voor de vennootschap.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel92
  - number: '93'
    text: |-
      1 De houder van een winningsvergunning voor koolwaterstoffen en de vennootschap brengen een mijnbouwovereenkomst
      tot stand, tenzij Onze Minister bij de vergunningverlening heeft bepaald dat deze verplichting niet geldt. Onze
      Minister bepaalt uitsluitend dat de verplichting, bedoeld in de vorige volzin, niet geldt als de staat door de
      overeenkomst naar redelijke schatting financieel nadeel zal lijden.

      2 De overeenkomst komt binnen een jaar na de verlening van de vergunning tot stand. Onze Minister kan de termijn
      van een jaar eenmaal met ten hoogste een jaar verlengen. De overeenkomst behoeft de instemming van Onze Minister.

      3 Tot het tijdstip waarop de instemming wordt verleend, verricht de vergunninghouder geen winningswerkzaamheden.
      Tot dat tijdstip behoeven besluiten als bedoeld in [artikel 97, tweede lid][ref1], de instemming van de
      vennootschap.

      4 [Artikel 87, derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel87
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel93
