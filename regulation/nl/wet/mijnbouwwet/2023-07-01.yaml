    text: |-
      1 Een startvergunning aardwarmte geldt ook voor delfstoffen die onvermijdelijk meekomen met de winning van
      aardwarmte, maar niet voor delfstoffen die zelfstandig economisch winbaar zijn.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake de zelfstandige economische
      winbaarheid van meekomende delfstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24x
  - number: 24y
    text: |-
      Indien bij het opsporen of winnen van aardwarmte wordt geconstateerd dat de situatie van de ondergrond afwijkt van
      de aanvraag voor de startvergunning aardwarmte, meldt een houder van een startvergunning aardwarmte dit zo spoedig
      mogelijk aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24y
  - number: 24z
    text: |-
      1 Het verrichten van feitelijke werkzaamheden in verband met de opsporing of winning van aardwarmte waaronder het
      verlenen van opdracht daartoe of het buiten gebruik stellen van een boorgat, is slechts toegestaan aan één, door
      de houder van de startvergunning aardwarmte of de houder van de vervolgvergunning aardwarmte aangewezen uitvoerder
      aardwarmte.

      2 Indien de uitvoerder aardwarmte niet meer in staat is feitelijke werkzaamheden uit te voeren, wijst de houder
      van de startvergunning aardwarmte of de houder van de vervolgvergunning aardwarmte een nieuwe uitvoerder aardwarmte
      aan.

      3 De aanwijzing, bedoeld in het eerste en tweede lid, behoeft de instemming van Onze Minister. Onze Minister kan
      zijn instemming slechts weigeren in verband met de technische of financiële capaciteiten waarover de uitvoerder
      aardwarmte beschikt.

      4 Onze Minister beslist op een aanvraag om een instemming binnen acht weken na ontvangst van de aanvraag. Onze
      Minister kan de termijn eenmaal met ten hoogste acht weken verlengen.

      5 Onze Minister kan aan de instemming met de uitvoerder aardwarmte voorschriften of beperkingen verbinden in
      verband met de technische en financiële capaciteiten waarover de uitvoerder aardwarmte beschikt.

      6 Onze Minister kan de instemming, bedoeld in het derde lid, wijzigen of intrekken indien de uitvoerder aardwarmte
      niet meer in staat is feitelijke werkzaamheden op een verantwoorde wijze uit te voeren.

      7 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over:

      a. de aanwijzing, bedoeld in het eerste en tweede lid;

      b. de instemming, bedoeld in het derde lid;

      c. een aanvraag om een instemming als bedoeld in het vierde lid;

      d. de voorschriften en beperkingen, bedoeld in het vijfde lid;

      e. het wijzigen of intrekken van de instemming, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24z
  - number: 24aa
    text: |-
      Indien meer dan één natuurlijke persoon of rechtspersoon een startvergunning aardwarmte houdt, worden zij
      gezamenlijk als houder van een startvergunning aardwarmte beschouwd.
    url: https://wetten.overheid.nl/BWBR0014168/2023-07-01#Artikel24aa
  - number: 24ab
    text: |-
      1 Onze Minister kan op aanvraag van een houder van een startvergunning aardwarmte een startvergunning aardwarmte
      wijzigen of intrekken.

      2 Onze Minister kan een startvergunning aardwarmte wijzigen of intrekken:

      a. indien de bij de aanvraag verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat
      op de aanvraag een andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste gegevens of
      omstandigheden volledig bekend waren geweest;

      b. indien dat wordt gerechtvaardigd door veranderde omstandigheden of gewijzigde inzichten inzake:

      1°. de veiligheidsrisico’s voor omwonenden of het voorkomen van schade aan gebouwen of infrastructurele werken of
      de functionaliteit daarvan;

      2°. het voorkomen van nadelige gevolgen voor het milieu als gevolg van de wijze van opsporen en winnen;

      3°. de financiële mogelijkheden van de houder om de kosten in verband met de opsporing en winning en de
      hierbij behorende aansprakelijkheden, waaronder het stellen van financiële zekerheid, anders dan bedoeld in de
      [artikelen 46][ref1] en [47][ref2], ter dekking van de aansprakelijkheid voor de schade door verontreiniging van
      grondwater of bodem in verband met de opsporing en winning van aardwarmte indien de in de aanvraag aangegeven
      aardlagen zich geheel of gedeeltelijk bevinden onder een gebied dat is aangewezen voor de winning van drinkwater
      uit grondwater, te dragen en om kosten in verband met het geheel of gedeeltelijk buiten gebruik stellen van een
      boorgat tijdens of na afloop van de looptijd van de startvergunning te dragen;

      c. indien er niet langer een uitvoerder aardwarmte is waarmee Onze Minister heeft ingestemd;

      d. indien niet overeenkomstig de startvergunning aardwarmte is of wordt gehandeld.

      3 Onze Minister beslist op een aanvraag om wijziging of intrekking van een startvergunning aardwarmte binnen acht
      weken na ontvangst van de aanvraag.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake de gronden, bedoeld in
      het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
