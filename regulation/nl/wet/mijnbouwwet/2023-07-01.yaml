  - number: 9a
    text: |-
      1 In aanvulling op [artikel 9, eerste lid, onder a][ref1], wordt bij een aanvraag voor een opsporings- of
      winningsvergunning voor koolwaterstoffen bij de beoordeling van de technische of financiële mogelijkheden van de
      aanvrager rekening gehouden met:

      a. het risico, de gevaren en andere relevante informatie over het gebied waarvoor de vergunning zal gaan gelden;

      b. de financiële draagkracht van de aanvrager om alle eventueel uit de desbetreffende opsporings- en
      winningsactiviteiten voortvloeiende aansprakelijkheden te dragen;

      c. de beschikbare informatie betreffende de technische bekwaamheden en de veiligheids- en milieuprestaties van
      de aanvrager.

      2 Bij een aanvraag voor een opsporings- of winningsvergunning voor koolwaterstoffen in het continentaal plat of
      onder de territoriale zee wordt bij de beoordeling van de technische of financiële mogelijkheden van de aanvrager,
      tevens rekening gehouden met de kosten van aantasting van het mariene milieu als bedoeld in artikel 8, eerste lid,
      onder c, van richtlijn 2008/56/EG;

      3 Bij ministeriële regeling worden regels gesteld over de informatie met betrekking tot de veiligheids- en
      milieuprestatie van de aanvrager, die bij de beoordeling van diens technische en financiële mogelijkheden,
      meegenomen wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel9
