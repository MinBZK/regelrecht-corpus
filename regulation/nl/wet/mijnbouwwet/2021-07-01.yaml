        afdeling: '13.2'
  - number: '41.1'
    text: |-
      Met het oog op de kans op beweging van de aardbodem worden metingen verricht voor de aanvang van het winnen van
      delfstoffen, tijdens het winnen en tot dertig jaar na het beëindigen van het winnen. Bij of krachtens algemene
      maatregel van bestuur worden regels gesteld omtrent deze metingen en de rapportage over de uitkomsten daarvan,
      waarbij in elk geval wordt bepaald dat de rapportage een analyse van de metingen bevat.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel41
  - number: '41.2'
    text: Dit artikel is van overeenkomstige toepassing op het winnen van aardwarmte en het opslaan van stoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel41
  - number: '41.3'
    text: |-
      Dit artikel geldt, tenzij in de desbetreffende vergunning anders is bepaald, niet met betrekking tot het winnen
      van delfstoffen of aardwarmte of het opslaan van stoffen in het continentaal plat en onder de territoriale zee,
      voorzover het winnen of het opslaan plaatsvindt vanuit of in een voorkomen dat gelegen is aan de zeezijde van de in
      de bijlage bij deze wet vastgelegde lijn.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel41
  - number: '41.4'
    text: |-
      De verplichtingen van dit artikel rusten op de houder van de desbetreffende, in [artikel 6][ref1] of [25][ref2]
      bedoelde vergunning, dan wel, indien de vergunning haar geldigheid heeft verloren, op de laatste houder van de
      vergunning. Indien de vergunning wordt gehouden door meer dan een natuurlijke persoon of rechtspersoon, rusten
      de verplichtingen van dit artikel op de in [artikel 22][ref3] bedoelde aangewezen persoon, dan wel, indien de
      vergunning haar geldigheid heeft verloren, de laatstelijk op grond van dat artikel aangewezen persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '42.1'
    text: |-
      Indien een vergunning als bedoeld in [artikel 6][ref1] of [25][ref2] geldt voor een gebied, waarvoor een ander een
      vergunning als bedoeld in [artikel 6][ref3] of [25][ref4] houdt, kan Onze Minister de vergunninghouder verplichten
      in een door hem te bepalen omvang te gedogen dat de houder van die andere vergunning zijn daaruit voortvloeiende
      rechten uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '42.2'
    text: |-
      Indien een vergunning voor het winnen van delfstoffen of aardwarmte geldt voor een gebied, waarin zich een
      voorkomen bevindt dat naar redelijkerwijs kan worden aangenomen de grens van het vergunningsgebied overschrijdt,
      is de vergunninghouder verplicht om medewerking te verlenen aan de totstandkoming van een overeenkomst tussen de
      vergunninghouder en de voor het aangrenzende gebied tot het winnen van de delfstoffen of aardwarmte gerechtigde,
      tenzij Onze Minister van deze verplichting ontheffing verleent. De overeenkomst strekt er toe dat het winnen in
      onderlinge overeenstemming zal geschieden. In de overeenkomst kan worden bepaald dat verplichtingen die krachtens
      de [hoofdstukken 2][ref1], [3][ref2] en [4][ref3] rusten op de in [artikel 22][ref4] bedoelde aangewezen
      personen, rusten op een van deze aangewezen personen. Onze Minister kan eisen stellen aan de tot stand te brengen
      overeenkomst. De overeenkomst en de wijzigingen in de overeenkomst worden aan Onze Minister overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0014168
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '42.3'
    text: |-
      Indien een vergunning voor het winnen van koolwaterstoffen geldt voor een gebied waarvoor een vergunning voor
      permanent opslaan van CO geldt, is de houder van de winningsvergunning verplicht om medewerking te verlenen aan
      de totstandkoming van een overeenkomst tussen de vergunninghouder en de houder van de vergunning voor permanent
      opslaan van CO. De overeenkomst strekt ertoe dat winnen en permanent opslaan van CO in onderlinge overeenstemming
      zal geschieden. In de overeenkomst kan worden bepaald dat verplichtingen die krachtens de [hoofdstukken 2][ref1],
      [3][ref2] en [4][ref3] rusten op de in [artikel 22][ref4] bedoelde aangewezen personen, rusten op een van deze
      aangewezen personen. Onze Minister kan eisen stellen aan de tot stand te brengen overeenkomst. De overeenkomst en
      de wijzigingen in de overeenkomst worden aan Onze Minister overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel42
    references:
      - id: ref1
