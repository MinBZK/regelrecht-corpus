      [ref9]: https://wetten.overheid.nl/BWBR0014168#Artikel19
      [ref10]: https://wetten.overheid.nl/BWBR0014168#Artikel20
      [ref11]: https://wetten.overheid.nl/BWBR0014168#Artikel21
