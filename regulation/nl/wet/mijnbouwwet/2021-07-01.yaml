        paragraaf: '6.2'
  - number: 127.1.b
    text: Onze Minister te adviseren bij besluiten die Onze Minister neemt inzake mijnbouw;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
  - number: 127.1.c
    text: risicobeoordelingen te toetsen voor advisering aan Onze Minister;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
  - number: 127.1.d
    text: onderzoek te doen verrichten, indien dat nodig is voor het toetsen van een risicobeoordeling;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
  - number: 127.1.e
    text: |-
      gevraagd en ongevraagd adviezen te verstrekken naar aanleiding van het toezicht op de naleving, de
      risicobeoordelingen en het onderzoek;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
  - number: 127.1.f
    text: |-
      het rapport inzake grote gevaren te beoordelen voor een instemming als bedoeld in de
      [artikelen 45b, tweede lid][ref1], [45e, tweede lid][ref2], [45f, tweede lid][ref3] en [45i, tweede lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45b
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel45e
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel45f
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel45i
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 45b
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 45e
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref3
        bwb_id: BWBR0014168
        artikel: 45f
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref4
        bwb_id: BWBR0014168
        artikel: 45i
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: 127.1.g
    text: |-
      kennisgevingen, bedoeld in de [artikelen 45m][ref1], [45n][ref2], [45o][ref3], [45p][ref4], te beoordelen;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45m
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel45n
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel45o
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel45p
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 45m
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref2
