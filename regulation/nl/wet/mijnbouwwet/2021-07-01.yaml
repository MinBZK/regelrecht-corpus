      - id: ref3
        bwb_id: BWBR0014168
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '123.2'
    text: |-
      Onze Minister kan de verstrekte gegevens, of een deel van die gegevens, doen beheren door door hem daartoe aan te
      wijzen instellingen, welke hem desgevraagd mede van advies dienen aan de hand van die gegevens.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel123
  - number: '123.3'
    text: |-
      De verstrekte gegevens zijn gegevens als bedoeld in
      [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '123.4'
    text: |-
      De op grond van het vijfde lid, onderdeel c, aangewezen gegevens verliezen op een op
      grond van dat onderdeel bepaald tijdstip hun vertrouwelijk karakter. Na dit tijdstip is
      [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref1] niet meer van toepassing op deze
      aangewezen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '123.5'
    text: 'Bij of krachtens algemene maatregel van bestuur worden:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel123
  - number: 123.5.a
    text: de gegevens bepaald die aan Onze Minister worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel123
  - number: 123.5.b
    text: |-
      regels gesteld omtrent het tijdstip en de wijze waarop de gegevens worden verstrekt, omtrent het beheer van de
      gegevens en omtrent het gebruik dat van de gegevens kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel123
  - number: 123.5.c
    text: |-
      regels gesteld omtrent het tijdstip waarop
      [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref1] niet meer van toepassing is op
      deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '123.6'
    text: Dit artikel is van overeenkomstige toepassing op bescheiden en monsters.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel123
  - number: '124.1'
    text: 'Onze Minister zendt aan de Europese Commissie ieder jaar een verslag met gegevens over:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel124
  - number: 124.1.a
    text: de gebieden die voor het opsporen en winnen van koolwaterstoffen zijn vrijgegeven;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel124
  - number: 124.1.b
    text: de verleende vergunningen voor koolwaterstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel124
  - number: 124.1.c
    text: de houders van de verleende vergunningen voor koolwaterstoffen en de samenstelling van die houders;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel124
  - number: 124.1.d
    text: de geraamde reserves aan koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel124
  - number: '124.2'
    text: |-
      Onze Minister zendt het in het eerste lid bedoelde verslag tevens aan de beide kamers der Staten-Generaal en en
      geeft in de Staatscourant kennis van de terinzagelegging van het verslag.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel124
  - number: '124.3'
    text: |-
      Onze Minister zendt aan de Europese Commissie om de drie jaar een verslag over het register, bedoeld in
      [artikel 31m][ref1], en andere door de Commissie opgevraagde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31m
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31m
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '125.1'
    text: Onze Minister zendt tweejaarlijks aan de beide kamers der Staten-Generaal een overzicht van aardgasactiviteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel125
  - number: '125.2'
    text: 'Het overzicht bevat tenminste:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel125
  - number: 125.2.a
    text: |-
      de aangevraagde, dan wel de verleende opsporings- en winningsvergunningen voorzover deze betrekking hebben op het
      opsporen of winnen van aardgas;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel125
  - number: 125.2.b
    text: 'de opgespoorde aardgasvoorkomens waarbij wordt aangegeven:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel125
  - number: 125.2.b.1°
    text: in welke vergunningsgebieden deze voorkomens zijn opgespoord en
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel125
  - number: 125.2.b.2°
    text: of uit deze voorkomens aardgas wordt gewonnen en zo niet, wanneer daarmee wordt aangevangen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel125
  - number: 125.2.c
    text: |-
      de omvang van de opgespoorde en overige aardgasreserves waarbij de aardgasreserves die in geologisch of geografisch
      opzicht met elkaar samenhangen afzonderlijk worden vermeld;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel125
  - number: 125.2.d
    text: |-
      een raming van de winning van aardgas per vergunninggebied, dan wel gebieden die in geologisch of geografisch
      opzicht met elkaar samenhangen over een periode van tien jaar, aanvangend met het jaar waarin het overzicht aan de
      beide kamers der Staten-Generaal wordt gezonden;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel125
  - number: 125.2.e
    text: de bestaande en toekomstige faciliteiten voor de ondergrondse opslag van aardgas;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel125
  - number: 125.2.f
    text: |-
      de winningsplannen, als bedoeld in [artikel 34][ref1], die zijn ingediend en waarvoor de instemming van Onze
      Minister is gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 125.2.g
    text: |-
      de door Onze Minister vastgestelde operationele strategieën, bedoeld in [artikel 52d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52d
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 52d
        hoofdstuk: 4a
  - number: '126.1'
    text: Er is een Staatstoezicht op de mijnen. Het Staatstoezicht op de mijnen ressorteert onder Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel126
  - number: '126.2'
    text: Aan het hoofd van het Staatstoezicht op de mijnen staat de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel126
  - number: '127.1'
    text: 'De inspecteur-generaal der mijnen heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
  - number: 127.1.a
    text: |-
      het uitoefenen van toezicht op de naleving van de bij of krachtens deze wet gestelde regels, met uitzondering
      van het bij of krachtens [artikel 52][ref1] en de [hoofdstukken 5][ref2], [6][ref3] en [9][ref4], bepaalde
      met uitzondering van [artikel 111][ref5], [artikel 120, tweede lid][ref6], en artikel 111 in samenhang met
      [artikel 121][ref7], en het uitoefenen van toezicht op de naleving van de bij of krachtens een andere wet gestelde
      regels waarvoor ambtenaren van het Staatstoezicht op de mijnen zijn aangewezen als toezichthouders;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk9
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Artikel111
      [ref6]: https://wetten.overheid.nl/BWBR0014168#Artikel120
      [ref7]: https://wetten.overheid.nl/BWBR0014168#Artikel121
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '5'
      - id: ref3
