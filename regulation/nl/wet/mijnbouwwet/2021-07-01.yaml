      - id: ref4
        bwb_id: BWBR0014168
        artikel: 45p
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: '46.1'
    text: |-
      Onze Minister kan bepalen dat zekerheid gesteld dient te worden ter dekking van de aansprakelijkheid voor de schade
      die naar redelijke schatting ontstaat door beweging van de aardbodem als gevolg van het winnen van delfstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel46
  - number: '46.2'
    text: |-
      Op verzoek van Onze Minister wordt aan hem een goed onderbouwd rapport overgelegd, waaruit blijkt welke schade naar
      redelijke schatting zal ontstaan.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel46
  - number: '46.3'
    text: |-
      Het bedrag en de termijn waarvoor en het tijdstip en de wijze waarop de zekerheid wordt gesteld, dienen ten
      genoegen van Onze Minister te zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel46
  - number: '46.4'
    text: Dit artikel is van overeenkomstige toepassing op het winnen van aardwarmte en het opslaan van stoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel46
  - number: '46.5'
    text: |-
      Dit artikel geldt, tenzij in de desbetreffende vergunning anders is bepaald, niet met betrekking tot het winnen
      van delfstoffen of aardwarmte of het opslaan van stoffen in het continentaal plat en onder de territoriale zee,
      voorzover het winnen of het opslaan plaatsvindt vanuit of in een voorkomen dat gelegen is aan de zeezijde van de in
      de bijlage bij deze wet vastgelegde lijn.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel46
  - number: '46.6'
    text: |-
      [Artikel 41, vierde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat, indien een
      vergunning wordt overgedragen na het bekend worden van schade, de verplichtingen van dit artikel wat betreft
      die schade blijven rusten op degene die ten tijde van dat bekend worden de houder van de vergunning of de in
      [artikel 22][ref2] bedoelde aangewezen persoon was.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '47.1'
    text: |-
      Onze Minister kan bepalen dat zekerheid gesteld dient te worden voor de nakoming van hetgeen verschuldigd zal
      worden, ingeval hij een last onder bestuursdwang oplegt ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen ten aanzien van het verwijderen of achterlaten, dan wel het na verwijdering slopen of hergebruiken
      van niet meer in gebruik zijnde mijnbouwinstallaties.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel47
  - number: '47.2'
    text: De [artikelen 41, vierde lid](onbekend), en [46, derde lid](onbekend), zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel47
  - number: '47.3'
    text: |-
      In afwijking van het tweede lid rust de door Onze Minister te stellen zekerheid als bedoeld in het eerste lid op
      de houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door meerdere personen wordt
      gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '48.1'
    text: |-
      Onze Minister kan bepalen dat zekerheid gesteld dient te worden voor de nakoming van hetgeen verschuldigd zal
      worden, ingeval hij een last onder bestuursdwang oplegt ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen ten aanzien van het verwijderen of achterlaten, dan wel het na verwijdering slopen of hergebruiken
      van niet meer in gebruik zijnde, op of in het continentaal plat gelegen kabels of pijpleidingen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel48
  - number: '48.2'
    text: De [artikelen 45, tweede lid](onbekend), en [46, derde lid](onbekend), zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel48
  - number: '49.1'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.1.a
    text: het opsporen van delfstoffen of aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.1.b
    text: het winnen van delfstoffen of aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.1.c
    text: het opslaan van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.1.d
    text: het instellen van een verkenningsonderzoek;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.1.e
    text: |-
      boorgaten, anders dan ten behoeve van het opsporen of winnen van delfstoffen of aardwarmte dan wel het opslaan van
      stoffen, dieper dan 500 meter beneden de oppervlakte van de aardbodem;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.1.f
    text: |-
      pijpleidingen en kabels die worden gebruikt ten behoeve van het opsporen of winnen van delfstoffen of aardwarmte,
      dan wel ten behoeve van het opslaan van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.1.g
    text: de stoffen die samen met CO, worden getransporteerd en opgeslagen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.1.h
    text: |-
      het geheel of gedeeltelijk uitsluiten van een gebied van de opsporing of winning van een delfstof of aardwarmte of
      het opslaan van stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.1.i
    text: de diepte waarop een activiteit plaatsvindt,
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.1.j
    text: de soort activiteit, en
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.1.k
    text: de soort delfstof of de soort stof die wordt opgeslagen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: '49.2'
    text: 'De in het eerste lid bedoelde regels kunnen worden gesteld ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.2.a
    text: |-
      een gebruik van ondergrond of planmatig beheer van voorkomens van delfstoffen, aardwarmte, andere natuurlijke
      rijkdommen, waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van
      stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.2.b
    text: de bescherming van de veiligheid voor omwonenden;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.2.c
    text: de bescherming van het milieu;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.2.d
    text: het voorkomen van schade aan gebouwen en infrastructurele werken of de functionaliteit daarvan.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: '49.3'
    text: |-
      De in het eerste lid bedoelde regels kunnen voorts worden gesteld, voorzover de in het eerste lid bedoelde
      activiteiten plaatsvinden op of in het continentaal plat of de territoriale zee, ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.3.a
    text: |-
      de scheepvaart, de landsverdediging, de visserij, de opwekking van elektriciteit, het instandhouden van de levende
      rijkdommen van de zee, het zuiver wetenschappelijk onderzoek en het leggen en onderhouden van onderzeese kabels
      en pijpleidingen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: 49.3.b
    text: de bescherming van historische, oudheidkundige en andere wetenschappelijke vondsten.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: '49.4'
    text: |-
      De in het eerste lid bedoelde regels kunnen, voorzover die gesteld worden, inhouden het weigeren, wijzigen of
      intrekken van een vergunning of een instemming, het stellen van beperkingen of het verbinden van voorschriften aan
      een vergunning of een instemming.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: '49.5'
    text: |-
      De in het eerste lid bedoelde regels kunnen mede betrekking hebben op het verwijderen of achterlaten en op het na
      verwijdering slopen of hergebruiken van niet meer in gebruik zijnde mijnbouwwerken, kabels en pijpleidingen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: '49.6'
    text: |-
      De in het derde lid bedoelde regels, voorzover die gesteld worden ten behoeve van de scheepvaart, de opwekking
      van elektriciteit, de bescherming van historische, oudheidkundige en andere wetenschappelijke vondsten of de
      landsverdediging, kunnen beperkingen inhouden ten aanzien van de locaties waar de in het eerste lid bedoelde
      activiteiten plaats kunnen vinden.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel49
  - number: '50'
    text: |-
      Onze Minister kan, in gevallen waarin ernstige aantasting van de in [artikel 49, tweede of derde lid][ref1],
      genoemde belangen ontstaat of dreigt te ontstaan, maatregelen voorschrijven ten aanzien van de in artikel 49,
      eerste en vijfde lid, bedoelde activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '51.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bescherming van de veiligheid met het oog op instorting
      regels worden gesteld omtrent het met gebruikmaking van een boorgat, tunnel, schacht of ander ondergronds werk
      onttrekken aan de ondergrond van:
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel51
  - number: 51.1.a
    text: |-
      delfstoffen, voorzover deze op een diepte van minder dan 100 meter beneden de oppervlakte van de aardbodem aanwezig
      zijn;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel51
  - number: 51.1.b
    text: andere vaste stoffen dan kalksteen of delfstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel51
  - number: '51.2'
    text: 'De in het eerste lid bedoelde algemene maatregel van bestuur kan bepalen dat:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel51
  - number: 51.2.a
    text: de onttrekking van stoffen, bedoeld in het eerste lid, zonder vergunning van Onze Minister verboden is;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel51
  - number: 51.2.b
    text: Onze Minister bij de maatregel omschreven bevoegdheden heeft ter uitvoering van daarbij aangewezen regels.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel51
  - number: '51.3'
    text: |-
      Onze Minister kan, in gevallen waarin ernstige aantasting van de veiligheid met het oog op instorting ontstaat of
      dreigt te ontstaan, maatregelen voorschrijven ten aanzien van de in het eerste lid bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel51
  - number: '52.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bescherming van de veiligheid met het oog op instorting
      regels worden gesteld omtrent het met gebruikmaking van een boorgat, tunnel, schacht of ander ondergronds werk
      onttrekken aan de ondergrond van kalksteen alsmede omtrent het gebruik van een vorenbedoeld ondergronds werk voor
      andere doeleinden dan het onttrekken van kalksteen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52
  - number: '52.2'
    text: 'De in het eerste lid bedoelde algemene maatregel van bestuur kan bepalen dat:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52
  - number: 52.2.a
    text: |-
      het verrichten van de activiteiten, bedoeld in het eerste lid, zonder vergunning van gedeputeerde staten van de
      provincie waarin het werk geheel of voor het grootste deel is gelegen, verboden is;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52
  - number: 52.2.b
    text: |-
      indien het betreft het gebruik van een ondergronds werk voor andere doeleinden dan het onttrekken van kalksteen,
      voor het verrichten van deze activiteiten geen vergunning maar een voorafgaande schriftelijke melding hiervan aan
      gedeputeerde staten van de provincie waarin het werk geheel of voor het grootste deel is gelegen, is vereist;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52
  - number: 52.2.c
    text: |-
      gedeputeerde staten van de provincie waarin het werk geheel of voor het grootste deel is gelegen bij de maatregel
      omschreven bevoegdheden hebben ter uitvoering van daarbij aangewezen regels.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52
  - number: '52.3'
    text: |-
      Provinciale staten van de provincie waarin het werk geheel of voor het grootste deel is gelegen, kunnen in geval
      van een meldingsplicht regels stellen voor het gebruik van een ondergronds werk voor andere doeleinden dan het
      onttrekken van kalksteen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52
  - number: '52.4'
    text: |-
      Gedeputeerde staten van de provincie waarin het werk geheel of voor het grootste deel is gelegen, kunnen, in
      gevallen waarin ernstige aantasting van de veiligheid met het oog op instorting ontstaat of dreigt te ontstaan,
      maatregelen voorschrijven ten aanzien van de in het eerste lid bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52
  - number: 52a
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *gasopslag Norg:* de ondergrondse
      gasopslag bij Norg waarvoor op basis van [artikel 25][ref1] op 1 april 2003 vergunning is verleend;
        - *netbeheerder:* de vennootschap die op grond van [artikel 2, eerste lid, van de Gaswet][ref2] is aangewezen als
      beheerder van het landelijk gastransportnet, bedoeld in [artikel 1, eerste lid, onderdeel n, van de Gaswet][ref3];
        - *veiligheidsbelang:* de veiligheidsrisico’s voor omwonenden als gevolg van bodembeweging veroorzaakt door
      de winning van gas uit het Groningenveld en de veiligheidsrisico’s als gevolg van het niet kunnen voorzien van
      eindafnemers van de benodigde hoeveelheid laagcalorisch gas;
        - *winningsvergunning Groningenveld:* de op basis van het koninklijk besluit van 30 mei 1963, nr. 39 (Stcrt. 126)
      verleende winningsvergunning voor zover het het Groningenveld betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '1'
  - number: 52b
    text: |-
      De [artikelen 21, derde lid, tweede volzin][ref1], [33][ref2], [34][ref3], [35][ref4] en [36][ref5] zijn niet van
      toepassing op de houder van de winningsvergunning Groningenveld voor zover het betreft de winning van gas uit het
      Groningenveld.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Artikel36
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref5
        bwb_id: BWBR0014168
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 52c.1
    text: |-
      Onze Minister zendt de raming, bedoeld in [artikel 10a, eerste lid, onderdeel q, van de Gaswet][ref1], aan de
      houder van de winningsvergunning Groningenveld.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52c
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 10a
  - number: 52c.2
    text: |-
      De houder van de winningsvergunning Groningenveld stelt op verzoek van Onze Minister, met inachtneming van de
      raming en gelet op het belang van het minimaliseren van de inzet van het Groningenveld en op het minimaliseren van
      de verwachte bodembeweging, één of meerdere operationele strategieën voor over de inzet van het Groningenveld.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52c
  - number: 52c.3
    text: |-
      Een operationele strategie bevat tenminste een voorstel voor de verdeling van de winning over de clusters in volume
      en tijd.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52c
  - number: 52c.4
    text: 'De houder van de winningsvergunning verstrekt ter onderbouwing van een operationele strategie:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52c
  - number: 52c.4.a
    text: de optimale inzet van de gasopslag Norg;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52c
  - number: 52c.4.b
    text: een analyse van de verwachte bodembeweging op regioniveau;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52c
  - number: 52c.4.c
    text: |-
      een analyse van de risico’s van de verwachte bodembeweging voor omwonenden, gebouwen of infrastructurele werken of
      de functionaliteit daarvan.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52c
  - number: 52c.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het voorstel voor de operationele strategie
      en de onderbouwing daarvan.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52c
  - number: 52d.1
    text: Onze Minister stelt de operationele strategie voor het Groningenveld vast.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
  - number: 52d.2
    text: |-
      Onze Minister betrekt bij de vaststelling het veiligheidsbelang en het maatschappelijk belang dat verbonden is
      aan het niet kunnen voorzien van eindafnemers van de benodigde hoeveelheid laagcalorisch gas en kijkt hierbij in
      het bijzonder:
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
  - number: 52d.2.a
    text: in hoeverre wordt voldaan aan de veiligheidsnorm van 10-5;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
  - number: 52d.2.b
    text: in hoeverre de leveringszekerheid van verschillende categorieën eindafnemers wordt geborgd;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
  - number: 52d.2.c
    text: naar het tempo van de afbouw van de vraag;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
  - number: 52d.2.d
    text: naar het tempo van versterken van gebouwen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
  - number: 52d.2.e
    text: |-
      naar maatschappelijke ontwrichting als gevolg van bodembeweging veroorzaakt door de winning van gas uit het
      Groningenveld;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
  - number: 52d.2.f
    text: naar maatschappelijke ontwrichting als gevolg van het afsluiten van verschillende categorieën eindafnemers.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
  - number: 52d.3
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de invulling van de veiligheidsnorm van 10-5 en de
      verschillende categorieën eindafnemers.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
  - number: 52d.4
    text: |-
      Onze Minister kan de operationele strategie wijzigen indien dat gerechtvaardigd wordt door het veiligheidsbelang
      of het maatschappelijk belang dat verbonden is aan het niet kunnen voorzien van eindafnemers van de benodigde
      hoeveelheid laagcalorisch gas.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
  - number: 52d.5
    text: |-
      Onze Minister motiveert bij de vaststelling, als bedoeld in tweede en vierde lid, voor een ieder inzichtelijk en
      navolgbaar op welke wijze een zwaarwegend belang is toegekend aan de veiligheidsrisico’s voor omwonenden als gevolg
      van bodembeweging veroorzaakt door de winning van gas uit het Groningenveld.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
  - number: 52d.6
    text: |-
      Onze Minister stelt in de gelegenheid binnen zes weken advies uit te brengen over de voorbereiding van een besluit
      als bedoeld in het eerste lid:
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
  - number: 52d.6.a
    text: gedeputeerde staten van een provincie binnen het gebied waarop de operationele strategie betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
  - number: 52d.6.b
    text: burgemeesters en wethouders van een gemeente binnen het gebied waarop de operationele strategie betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
  - number: 52d.6.c
    text: het dagelijks bestuur van een waterschap binnen het gebied waarop de operationele strategie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
  - number: 52d.7
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van een besluit als
      bedoeld in het eerste lid, met dien verstande dat zienswijzen naar voren kunnen worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 52e.1
    text: |-
      De houder van de winningsvergunning Groningenveld meldt een te verwachten langdurige en substantiële afwijking van
      de operationele strategie aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52e
  - number: 52e.2
    text: |-
      Onze Minister kan aan de houder van de winningsvergunning Groningenveld in aanvulling op of in afwijking van de
      operationele strategie een tijdelijke maatregel opleggen indien:
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52e
  - number: 52e.2.a
    text: |-
      uit een melding als bedoeld in [artikel 10a, elfde lid, van de Gaswet][ref1] volgt dat de vraag naar gas uit het
      Groningenveld substantieel wijzigt ten opzichte van de raming waarop de operationele strategie is gebaseerd;


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52e
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 10a
  - number: 52e.2.b
    text: |-
      een melding als bedoeld in het eerste lid of een onverwachte gebeurtenis aanleiding geeft tot een andere verdeling
      van de winning over de clusters;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52e
  - number: 52e.2.c
    text: een ernstige aantasting van de veiligheid van omwonenden van het Groningenveld ontstaat of dreigt te ontstaan.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52e
  - number: 52f
    text: |-
      De houder van de winningsvergunning Groningenveld is verplicht de winning van het Groningenveld uit te voeren
      overeenkomstig de door Onze Minister vastgestelde operationele strategie en indien die is opgelegd, een tijdelijke
      maatregel als bedoeld in [artikel 52e, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52e
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52f
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 52e
        hoofdstuk: 4a
  - number: 52g.1
    text: |-
      De houder van de winningsvergunning Groningenveld voert de door Onze Minister vastgestelde operationele strategie
      en indien die is opgelegd, een tijdelijke maatregel als bedoeld in [artikel 52e, tweede lid][ref1], op zodanige
      wijze uit dat de nadelige gevolgen van de gaswinning uit het Groningenveld zoveel mogelijk worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52e
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52g
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 52e
        hoofdstuk: 4a
  - number: 52g.2
    text: |-
      De houder van de winningsvergunning Groningenveld neemt alle noodzakelijke maatregelen om de gevolgen van een zwaar
      ongeval voor mens en milieu te beperken.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52g
  - number: 52g.3
    text: |-
      Onze Minister neemt alle maatregelen die redelijkerwijs van hem gevergd kunnen worden om te voorkomen dat als
      gevolg van de gaswinning uit het Groningenveld de veiligheid wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52g
  - number: 52g.4
    text: |-
      Na beëindiging van de winning uit het Groningenveld neemt de houder van de winningsvergunning Groningenveld
      dan wel, indien deze vergunning haar gelding heeft verloren, de laatste houder daarvan, alle maatregelen die
      redelijkerwijs van hem gevergd kunnen worden om nadelige gevolgen van de gaswinning uit het Groningenveld zoveel
      mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52g
  - number: 52g.5
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over het uitvoeren van de door Onze Minister vastgestelde
      operationele strategie.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52g
  - number: 52h.1
    text: |-
      De houder van de winningsvergunning Groningenveld zendt binnen een maand na afloop van een gasjaar een rapportage
      aan Onze Minister en de inspecteur-generaal der mijnen over:
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52h
  - number: 52h.1.a
    text: het temperatuurscenario dat zich in het afgelopen gasjaar heeft voorgedaan;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52h
  - number: 52h.1.b
    text: de hoeveelheid gewonnen gas uit het Groningenveld in het afgelopen gasjaar;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52h
  - number: 52h.1.c
    text: de inzet van de clusters en de gasopslag Norg;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52h
  - number: 52h.1.d
    text: of de winning conform de door Onze Minister vastgestelde operationele strategie is uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52h
  - number: 52h.1.e
    text: de waargenomen bodembeweging.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52h
  - number: 52h.2
    text: Bij ministeriële regeling kunnen regels worden gesteld over de rapportage, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52h
  - number: 52i.1
    text: |-
      In aanvulling op [artikel 36, tweede lid][ref1], kan Onze Minister zijn instemming met een opslagplan verlenen
      onder beperkingen of daaraan voorschriften verbinden gelet op het belang van het minimaliseren van de gaswinning
      uit het Groningenveld.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel36
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52i
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 52i.2
    text: |-
      In aanvulling op [artikel 36, derde lid][ref1], kan Onze Minister zijn instemming met een opslagplan intrekken of
      beperkingen en voorschriften stellen of wijzigen gelet op het belang van het minimaliseren van de gaswinning uit
      het Groningenveld.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel36
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel52i
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '53'
    text: |-
      Deze afdeling is van toepassing op de heffing en invordering van oppervlakterecht, cijns en winstaandeel van de
      houder of medehouder van een vergunning voor het opsporen of winnen van koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel53
  - number: '54'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel54
  - number: 54.a
    text: 'medehouderschap: geval waarin de vergunning wordt gehouden door meer dan één natuurlijke persoon of rechtspersoon;'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel54
  - number: 54.b
    text: 'medehouder: ieder van de in onderdeel a bedoelde natuurlijke personen of rechtspersonen;'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel54
  - number: 54.c
    text: |-
      de aangewezen medehouder: de in [artikel 22][ref1] bedoelde aangewezen persoon;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 54.d
    text: |-
      de landzijde: het deel van het Nederlands territoir dat ligt aan de landzijde van de in de bijlage bij deze wet
      vastgelegde lijn;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel54
  - number: 54.e
    text: |-
      de zeezijde: het continentaal plat en het deel van het Nederlands territoir dat ligt aan de zeezijde van de in de
      bijlage bij deze wet vastgelegde lijn;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel54
  - number: 54.f
    text: |-
      de inspecteur: de door Onze Minister van Financiën bij ministeriële regeling aangewezen functionaris van de
      rijksbelastingdienst;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel54
  - number: 54.g
    text: |-
      de ontvanger: de door Onze Minister van Financiën bij ministeriële regeling aangewezen functionaris van de
      rijksbelastingdienst.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel54
  - number: '55.1'
    text: |-
      Een wijziging in [paragraaf 5.1.1.2.](onbekend), met uitzondering van een wijziging die het gevolg is
      van toepassing van [artikel 58, derde lid](onbekend), is niet van toepassing op de houder van een voor de
      inwerkingtreding van die wijziging verleende opsporingsvergunning, tenzij die houder om toepassing van de
      gewijzigde paragraaf verzoekt.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel55
  - number: '55.2'
    text: |-
      Een wijziging in [paragraaf 5.1.1.2.](onbekend), met uitzondering van een wijziging die het gevolg is van
      toepassing van [artikel 58, derde lid](onbekend), in [paragraaf 5.1.1.3.](onbekend) of in [paragraaf 5.1.1.4.]
      (onbekend), met uitzondering van [artikel 68, eerste lid](onbekend), is niet van toepassing op de houder van een
      voor de inwerkingtreding van die wijziging verleende winningsvergunning, tenzij die houder om toepassing van de
      gewijzigde paragrafen verzoekt.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel55
  - number: '55.3'
    text: |-
      Een verzoek, als bedoeld in het eerste en tweede lid, wordt schriftelijk bij Onze Minister ingediend binnen drie
      maanden na de dag waarop die wijziging in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel55
  - number: '55.4'
    text: |-
      Onze Minister geeft aan een verzoek, als bedoeld in het eerste en tweede lid, gevolg, tenzij naar zijn oordeel het
      algemeen belang zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel55
  - number: '56.1'
    text: |-
      Oppervlakterecht wordt geheven van degene die op 1 januari van het kalenderjaar waarover wordt geheven houder is
      van een opsporingsvergunning voor de zeezijde alsmede van degene die op 1 januari van het kalenderjaar waarover
      wordt geheven houder is van een winningsvergunning.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel56
  - number: '56.2'
    text: Ingeval van medehouderschap wordt het oppervlakterecht geheven van de aangewezen medehouder.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel56
  - number: '57.1'
    text: |-
      De heffingsmaatstaf is de oppervlakte van het gebied waarvoor een in [artikel 56, eerste lid][ref1], bedoelde
      opsporings- of winningsvergunning op 1 januari van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel56
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: 5.1.1.2
        afdeling: 5.1.1
  - number: '57.2'
    text: Het tijdvak waarover het oppervlakterecht wordt geheven is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel57
  - number: '58.1'
    text: |-
      Het tarief over 2003 voor het houden van een opsporingsvergunning is een bedrag per vierkante kilometer
      overeenkomstig de onderstaande tabel. Het eerste tijdvak is het eerste kalenderjaar waarin de vergunning op 1
      januari van kracht is. De volgende tijdvakken zijn de op dat kalenderjaar volgende jaren. **Tarief over 2003**






                    Tijdvak


                    Bedrag per km2






                    1e tot en met 6e tijdvak


                    € 200





                    7e tot en met 9e tijdvak


                    € 400





                    Volgende tijdvakken


                    € 600
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel58
  - number: '58.2'
    text: Het tarief over 2003 voor het houden van een winningsvergunning bedraagt € 600  per vierkante kilometer.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel58
  - number: '58.3'
    text: |-
      Bij het begin van ieder kalenderjaar worden de voor dat jaar geldende tarieven, bedoeld in het eerste en tweede lid,
      bij ministeriële regeling vastgesteld. Deze tarieven worden berekend aan de hand van het indexcijfer, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____________ (Stb. 507), zoals dat gold op 31 december van het voorgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005666#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005666
        artikel: '1'
  - number: '59.1'
    text: Oppervlakterecht wordt op aangifte voldaan.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel59
  - number: '59.2'
    text: |-
      De houder, of, ingeval van medehouderschap, de aangewezen medehouder, doet uiterlijk 1 april van het kalenderjaar
      waarover wordt geheven aangifte door de inlevering van een aangiftebiljet.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel59
  - number: '60'
    text: |-
      Cijns wordt geheven van de houder, of, ingeval van medehouderschap, van ieder van de medehouders, van een
      winningsvergunning.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel60
  - number: '61'
    text: |-
      Indien in het vergunningsgebied zowel aardgas als aardolie zijn gewonnen, wordt over aardgas en aardolie
      afzonderlijk cijns geheven.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel61
  - number: '62.1'
    text: |-
      De heffingsmaatstaf is de omzet die de houder, of, ingeval van medehouderschap, ieder van de medehouders, heeft
      behaald in het kalenderjaar waarover de cijns wordt geheven.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel62
  - number: '62.2'
    text: |-
      De omzet is het aantal in het kalenderjaar in het vergunningsgebied gewonnen aantal eenheden aardolie of aardgas
      dat aan de houder, of, ingeval van medehouderschap, aan ieder van de medehouders toekomt, vermenigvuldigd met
      de prijs per eenheid waarvoor die eenheden zijn verkocht. Indien ter zake van die verkoop voorwaarden worden
      overeengekomen of opgelegd die afwijken van voorwaarden die in het economische verkeer door onafhankelijke partijen
      zouden zijn overeengekomen, wordt de in het eerste lid bedoelde omzet bepaald alsof die laatstbedoelde voorwaarden
      zouden zijn overeengekomen. Indien eenheden anders dan door verkoop aan het winningsbedrijf zijn onttrokken,
      wordt de in het eerste lid bedoelde omzet bepaald alsof deze eenheden zijn verkocht onder voorwaarden die in het
      economische verkeer door onafhankelijke partijen zouden zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel62
  - number: '62.3'
    text: |-
      Bij de bepaling van het aantal gewonnen eenheden blijven buiten beschouwing de eenheden aardolie of aardgas welke
      zijn aangewend ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel62
  - number: 62.3.a
    text: het opsporen of het winnen in het vergunningsgebied waar ze zijn gewonnen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel62
  - number: 62.3.b
    text: het voor de aflevering bewerken van die eenheden en het transport naar de plaats waar die bewerking plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel62
  - number: '62.4'
    text: |-
      Eenheden aardolie of aardgas welke overeenkomstig [artikel 94, tweede lid, onderdeel a][ref1], aan de in
      [dat artikel][ref2] bedoelde vennootschap toekomen, blijven bij de toepassing van het eerste lid buiten
      beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel94
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '94'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '94'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
  - number: '63.1'
    text: |-
      Het tarief is een percentage dat wordt bepaald op basis van het in totaal in het kalenderjaar in het
      vergunningsgebied gewonnen aantal eenheden. Het aantal eenheden aardolie wordt bepaald bij een druk van 101,325
      kPa en een temperatuur van 15 °C. Onder aardolie wordt condensaat mede begrepen. Het aantal eenheden aardgas wordt
      bepaald bij een druk van 101,325 kPa en een temperatuur van 0 °C en omgerekend naar eenheden met een calorische
      waarde van 35,1692 MJ/m3 bovenwaarde.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel63
  - number: '63.2'
    text: |-
      Bij de bepaling van het aantal eenheden, bedoeld in het eerste lid, is [artikel 62, derde lid][ref1], van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel62
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '62'
        hoofdstuk: '5'
        paragraaf: 5.1.1.3
        afdeling: 5.1.1
  - number: '63.3'
    text: |-
      Het percentage wordt opgebouwd door middel van een schijvensysteem overeenkomstig de navolgende tabellen en wordt
      berekend door:
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel63
  - number: 63.3.a
    text: |-
      bij iedere schijf de hoeveelheid te bepalen die binnen die schijf valt en deze hoeveelheid te vermenigvuldigen met
      het percentage dat behoort bij die schijf;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel63
  - number: 63.3.b
    text: deze producten te sommeren, en
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel63
  - number: 63.3.c
    text: deze som te delen door het totaal van het in het vergunningsgebied gewonnen aantal eenheden.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel63
  - number: '63.4'
    text: |-
      Het tarief over enig kalenderjaar wordt verhoogd met 25%, indien over dat jaar het gewogen gemiddelde van de waarde
      van in Nederland ingevoerde ruwe olie hoger is dan € 25 per vat. Bij ministeriële regeling worden regels gesteld
      omtrent de wijze waarop het in de eerste volzin bedoelde gewogen gemiddelde wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel63
  - number: '63.5'
    text: |-
      Het tarief wordt, onverminderd de verhoging op grond van het vierde lid, verhoogd met 100%, indien de houder geen
      overeenkomst als bedoeld in [artikel 93][ref1] heeft gesloten ten aanzien van de winningsvergunning. Deze verhoging
      vindt niet plaats met betrekking tot de eenheden die zijn gewonnen uit een voorkomen ten aanzien waarvan een
      overeenkomst als bedoeld in [artikel 97b][ref2] is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel97b
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '93'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 97b
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
  - number: '64.1'
    text: Cijns wordt op aangifte voldaan.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel64
  - number: '64.2'
    text: |-
      De houder, of, ingeval van medehouderschap, ieder van de medehouders, doet uiterlijk op 1 april volgend op het
      kalenderjaar waarover wordt geheven aangifte door de inlevering van een aangiftebiljet.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel64
  - number: '65'
    text: |-
      Winstaandeel wordt geheven van de houder, of, ingeval van medehouderschap, van ieder van de medehouders, van een
      winningsvergunning.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel65
  - number: '66.1'
    text: |-
      De heffingsmaatstaf is het resultaat van een met inachtneming van de [artikelen 67][ref1] en [68][ref2] door
      de houder, of, ingeval van medehouderschap, door ieder van de medehouders, van een winningsvergunning, over een
      boekjaar op te maken winst- en verliesrekening, verminderd met de op de voet van het derde lid te verrekenen
      verliezen en de in [artikel 68a][ref3] bedoelde investeringsaftrek. De winst- en verliesrekening omvat de aan dat
      jaar en aan die vergunning toe te rekenen kosten en opbrengsten van het winningsbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel68a
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '67'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '68'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
      - id: ref3
        bwb_id: BWBR0014168
        artikel: 68a
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: '66.2'
    text: |-
      Indien de houder of de medehouder tevens houder of medehouder is van één of meer andere winningsvergunningen, kan
      een geconsolideerde winst- en verliesrekening worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel66
  - number: '66.3'
    text: |-
      Indien het resultaat, bedoeld in het eerste lid, verminderd met de in [artikel 68a][ref1] bedoelde
      investeringsaftrek, negatief is, is sprake van een verlies. Dit verlies wordt onder toepassing van
      [hoofdstuk IV van de Wet op de vennootschapsbelasting 1969][ref2] verrekend met de positieve resultaten van de drie
      voorafgaande boekjaren en van de volgende boekjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel68a
      [ref2]: https://wetten.overheid.nl/BWBR0002672#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 68a
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
      - id: ref2
        bwb_id: BWBR0002672
        hoofdstuk: IV
  - number: '67.1'
    text: |-
      Tot het in [artikel 66, eerste lid][ref1], bedoelde resultaat worden in ieder geval gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 67.1.a
    text: |-
      de waarde in het economische verkeer van de anders dan door verkoop aan het winningsbedrijf onttrokken
      koolwaterstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel67
  - number: 67.1.b
    text: de verschillen tussen de volgens goed koopmansgebruik gewaardeerde begin- en eindvoorraden;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel67
  - number: 67.1.c
    text: het resultaat dat is behaald met de verkoop van de winningsvergunning.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel67
  - number: '67.2'
    text: |-
      Tot het in [artikel 66, eerste lid][ref1], bedoelde resultaat worden in ieder geval gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 67.2.a
    text: |-
      de niet reeds ten laste van een andere winst- en verliesrekening gebrachte kosten van verkennings- en
      opsporingsonderzoeken die zijn verricht krachtens een opsporingsvergunning;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel67
  - number: 67.2.b
    text: |-
      afschrijving op de niet reeds ten laste van een andere winst- en verliesrekening gebrachte kosten, welke zijn
      gemaakt voordat de winningsvergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel67
  - number: '67.3'
    text: |-
      Tot het in [artikel 66, eerste lid][ref1], bedoelde resultaat worden niet gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 67.3.a
    text: |-
      afschrijving op de koopsom ter zake van de overname van een opsporingsvergunning, voorzover deze koopsom de door
      de overdrager van die vergunning nog niet reeds ten laste van een winst- en verliesrekening gebrachte kosten te
      boven gaat;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel67
  - number: 67.3.b
    text: de waarde van de in het winningsbedrijf gewonnen en verbruikte koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel67
  - number: '67.4'
    text: |-
      Indien de inspecteur vooraf bij voor bezwaar vatbare beschikking, eventueel onder het stellen van nadere
      voorwaarden, heeft vastgesteld dat een rechtshandeling strekt tot het afdekken van een prijs- of koersrisico dat
      ter zake van gewonnen of te winnen koolwaterstoffen wordt gelopen, behoort het resultaat uit de desbetreffende
      rechtshandeling tot het in [artikel 66, eerste lid][ref1], bedoelde resultaat.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: '67.5'
    text: |-
      Indien door of aan de houder dan wel de medehouder voorwaarden worden overeengekomen of opgelegd die afwijken van
      de voorwaarden die in het economische verkeer door onafhankelijke partijen zouden zijn overeengekomen, wordt het
      in [artikel 66, eerste lid][ref1], bedoelde resultaat bepaald alsof die laatstbedoelde voorwaarden zouden zijn
      overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: '68.1'
    text: |-
      De winst- en verliesrekening, bedoeld in [artikel 66, eerste lid](onbekend),
      wordt opgemaakt met overeenkomstige toepassing van de [artikelen 3.8][ref1],
      [3.14, eerste lid, onderdelen b tot en met i, en derde tot en met vijfde lid][ref2],
      [3.25 tot en met 3.39][ref3],[ 3.52][ref4], [3.53, eerste lid, onderdelen a en b, en tweede lid][ref5],
      [3.54][ref6], [3.56][ref7] en [3.57 van de Wet inkomstenbelasting 2001][ref8], alsmede de
      [artikelen 7, vierde en vijfde lid][ref9], [8, vierde lid][ref10], [9 tot en met 10b][ref11],
      [14 tot en met 14b][ref12] en [15d, van de Wet op de vennootschapsbelasting 1969][ref13], behoudens voorzover bij
      of krachtens deze wet anders is bepaald, dan wel uit het verschil in wezen tussen de houder dan wel de medehouder
      enerzijds en een natuurlijk persoon in de zin van de inkomstenbelasting respectievelijk een belastingplichtige voor
      de vennootschapsbelasting anderzijds, het tegendeel voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0011353#Artikel3
