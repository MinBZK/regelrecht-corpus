      - id: ref4
        bwb_id: BWBR0014168
        artikel: 45p
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: 127.1.h
    text: |-
      een mechanisme op te zetten voor vertrouwelijke melding van veiligheids- en milieukwesties met betrekking tot
      activiteiten die zien op de opsporing of winning van koolwaterstoffen en het onderzoeken van deze meldingen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
  - number: 127.1.i
    text: |-
      regelmatig kennis, gegevens en ervaringen uit te wisselen met toezichthouders van andere lidstaten overeenkomstig
      artikel 27 van richtlijn 2013/30/EU;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
  - number: 127.1.j
    text: informatie uit te wisselen overeenkomstig artikel 23 van richtlijn 2013/30/EU;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
  - number: 127.1.k
    text: informatie te publiceren overeenkomstig artikel 24 van richtlijn 2013/30/EU;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
  - number: 127.1.l
    text: |-
      Onze Minister te adviseren of de voorgestelde operationele strategie of strategieën, bedoeld in
      [artikel 52c, tweede lid][ref1], gelet op de winning van de hoeveelheid gas die ten hoogste uit het Groningenveld
      benodigd is om eindafnemers van de hoeveelheid laagcalorisch gas te voorzien, de verwachte bodembeweging
      minimaliseert en de gevolgen daarvan voor omwonenden, gebouwen of infrastructurele werken of de functionaliteit
      daarvan zoveel mogelijk beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52c
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 52c
        hoofdstuk: 4a
  - number: '127.2'
    text: |-
      De inspecteur-generaal der mijnen stelt na elke inspectie, verricht in het kader van [paragraaf 3.2][ref1] een
      verslag op over de naleving van de voorschriften en de voorgeschreven maatregelen. Het verslag wordt ter kennis
      gebracht van de betrokken houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door
      meerdere personen wordt gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref2], en binnen twee maanden
      na de inspectie openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '127.3'
    text: |-
      De inspecteur-generaal der mijnen stelt bij een zwaar ongeval als bedoeld in [artikel 33][ref1], een onderzoek in
      en dient een samenvatting van de bevindingen in bij de Europese Commissie en Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel33
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '127.4'
    text: |-
      De inspecteur-generaal der mijnen draagt er zorg voor dat de aanbevelingen naar aanleiding van de bevindingen,
      bedoeld in het derde lid, worden uitgevoerd, voor zover deze binnen diens bevoegdheid vallen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel127
  - number: '128.1'
    text: |-
      De inspecteur-generaal der mijnen brengt jaarlijks voor 1 mei aan Onze Minister verslag uit over de werkzaamheden
      van het Staatstoezicht op de mijnen in het afgelopen jaar. De inspecteur-generaal der mijnen kan voorzien in
      verslaglegging op andere momenten waarop de inspecteur-generaal dat nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel128
  - number: '128.2'
    text: |-
      De inspecteur-generaal der mijnen doet in het verslag de aanbevelingen die hij wenselijk acht met het oog op een
      doelmatige en voortvarende uitvoering in de toekomst van de in [artikel 127][ref1] genoemde activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel127
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '127'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: '128.3'
    text: Onze Minister zendt het verslag alsmede een schriftelijke reactie daarop aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel128
  - number: '128.4'
    text: |-
      De inspecteur-generaal der mijnen dient jaarlijks voor een bij ministeriële regeling vast te stellen datum,
      aan Onze Minister een jaarplan in, waarin de plannen worden uitgewerkt voor een effectief toezicht gebaseerd
      op risicobeheer en waarin bijzondere aandacht wordt besteed aan de naleving van de verplichtingen, genoemd in
      [§ 4.1a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: 128a.1
    text: Onze Minister geeft een aanwijzing aan de inspecteur-generaal der mijnen uitsluitend in schriftelijke vorm.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel128a
  - number: 128a.2
    text: Onze Minister verleent geen mandaat voor het geven van een aanwijzing.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel128a
  - number: 128a.3
    text: Een aanwijzing wordt door Onze Minister onverwijld aan de Staten-Generaal gezonden.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel128a
  - number: 128a.4
    text: |-
      Onverminderd [artikel 10:6 van de Algemene wet bestuursrecht][ref1] en in afwijking van de
      [artikelen 10:22, eerste lid][ref2], en [10:23 van de Algemene wet bestuursrecht][ref3] ziet een bijzondere
      aanwijzing niet op:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel128a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 128a.4.a
    text: het weerhouden van de inspecteur-generaal der mijnen om een specifiek onderzoek te verrichten of af te ronden;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel128a
  - number: 128a.4.b
    text: de wijze waarop de inspecteur-generaal der mijnen een specifiek onderzoek verricht;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel128a
  - number: 128a.4.c
    text: iedere vorm van bevindingen, oordelen en adviezen van de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel128a
  - number: '129.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, met uitzondering van het bij of
      krachtens [artikel 52][ref1] bepaalde, zijn belast de bij besluit van Onze Minister daartoe aangewezen ambtenaren
      van het Staatstoezicht op de mijnen, voorzover niet op grond van [artikel 131][ref2] het toezicht aan anderen is
      opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel131
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '131'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '129.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel129
  - number: '130'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald in welke gevallen en op welke wijze de houder van een
      vergunning als bedoeld in [artikel 6][ref1] of [25][ref2] dan wel degene die een verkenningsonderzoek uitvoert of
      voornemens is uit te voeren, wordt verplicht de in de [artikelen 129][ref3] en [131][ref4] bedoelde ambtenaren bij
      de uitoefening van hun bevoegdheden:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel129
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel131
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '129'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '131'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 130.a
    text: |-
      met inbegrip van hun uitrusting, te vervoeren naar door deze ambtenaren aan te duiden plaatsen waar
      met gebruikmaking van de vergunning activiteiten worden of zullen worden uitgevoerd dan wel waar een
      verkenningsonderzoek wordt of zal worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel130
  - number: 130.b
    text: te voorzien van een verblijfplaats;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel130
  - number: 130.c
    text: te voorzien in maaltijden en andere benodigdheden.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel130
  - number: '131.1'
    text: |-
      Bij besluit van Onze Minister kunnen andere ambtenaren worden aangewezen die zijn belast met het toezicht op de
      naleving van het bepaalde bij of krachtens deze wet met uitzondering van het bij of krachtens [artikel 52][ref1]
      bepaalde, voorzover het toezicht bepaalde in het besluit aangegeven gevallen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '131.2'
    text: |-
      Onze Minister wijst ambtenaren die onder een van Onze andere Ministers ressorteren niet aan, dan in overeenstemming
      met Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel131
  - number: '131.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel131
  - number: 131a.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens [artikel 52][ref1] zijn binnen hun ambtsgebied
      belast de bij besluit van gedeputeerde staten aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel131a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 131a.2
    text: |-
      Gedeputeerde staten wijzen ambtenaren die niet onder hen ressorteren niet aan dan in overeenstemming met het
      bestuursorgaan onder wie de desbetreffende ambtenaren ressorteren.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel131a
  - number: 131a.3
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in het provinciaal blad.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel131a
  - number: '132'
    text: |-
      De inspecteur-generaal der mijnen is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van
      de bij of krachtens deze wet gestelde verplichtingen, met uitzondering van de verplichtingen die bij of krachtens
      [artikel 52][ref1] en de [hoofdstukken 5][ref2], [6][ref3] en [9][ref4], zijn gesteld met uitzondering van
      [artikel 111][ref5], [artikel 120, tweede lid][ref6], en [artikel 111][ref7] in samenhang met [artikel 121][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk9
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Artikel111
      [ref6]: https://wetten.overheid.nl/BWBR0014168#Artikel120
      [ref7]: https://wetten.overheid.nl/BWBR0014168#Artikel111
      [ref8]: https://wetten.overheid.nl/BWBR0014168#Artikel121
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0014168
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0014168
        hoofdstuk: '9'
      - id: ref5
        bwb_id: BWBR0014168
        artikel: '111'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref6
        bwb_id: BWBR0014168
        artikel: '120'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref7
        bwb_id: BWBR0014168
        artikel: '111'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref8
        bwb_id: BWBR0014168
        artikel: '121'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '133.1'
    text: |-
      Een exploitant van een productie-installatie, een eigenaar van een niet-productie-installatie, een eigenaar van
      een pijpleiding en een netbeheerder als bedoeld in [artikel 1 van de Gaswet][ref1] zijn, indien van toepassing in
      afwijking van [artikel 2.9a van de Wet algemene bepalingen omgevingsrecht][ref2], een vergoeding verschuldigd voor:


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 133.1.a
    text: |-
      het door Onze Minister op aanvraag verlenen, wijzigen of intrekken van een vergunning, ontheffing of instemming met
      betrekking tot mijnbouw, of het beoordelen van een melding voor een handeling met een mobiele installatie;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel133
  - number: 133.1.b
    text: |-
      de door de inspecteur-generaal uit te voeren taken als bedoeld in
      [artikel 127, eerste lid, onderdelen a tot en met g][ref1], met dien verstande dat een vergoeding niet in rekening
      wordt gebracht voor:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel127
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '127'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 133.1.b.1°
    text: |-
      advisering en het doen uitvoeren van onderzoek dat geen verband houdt met het verlenen, wijzigen of intrekken op
      aanvraag van een vergunning of instemming;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel133
  - number: 133.1.b.2°
    text: |-
      het vaststellen van een besluit als bedoeld in [artikel 132][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel132
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '132'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: '133.2'
    text: Bij algemene maatregel van bestuur worden regels gesteld over de vergoeding.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel133
  - number: '133.3'
    text: De hoogte van de vergoeding wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel133
  - number: '133.4'
    text: |-
      Onze Minister kan de verschuldigde bedragen invorderen bij dwangbevel. [Titel 4.4][ref1], met uitzondering van de
      [artikelen 4:85][ref2] en [4:95, van de Algemene wet bestuursrecht][ref3] is, voor zover al niet van toepassing,
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '133.5'
    text: |-
      Voor zover een door Onze Minister in rekening gebracht bedrag verplicht tot betaling van een geldsom, komt deze
      geldsom toe aan de Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel133
  - number: '134.1'
    text: |-
      Onder de in dit hoofdstuk gebruikte begrippen wordt verstaan hetgeen daaronder wordt verstaan in
      [artikel 113][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel113
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '113'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '134.2'
    text: |-
      Dit hoofdstuk is van toepassing op mijnbouwondernemers voorzover deze mijnbouwactiviteiten verrichten aan de
      landzijde van de in de bijlage bij deze wet vastgelegde lijn.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel134
  - number: '135.1'
    text: Er is een Waarborgfonds mijnbouwschade.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: '135.2'
    text: Het waarborgfonds bezit rechtspersoonlijkheid en is gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: '135.3'
    text: Onze Minister is belast met het beheer van het waarborgfonds.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: '135.4'
    text: 'Het waarborgfonds ontvangt:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: 135.4.a
    text: |-
      een door een mijnbouwondernemer jaarlijks verschuldigde bijdrage, op te leggen door Onze Minister, met inachtneming
      van bij algemene maatregel van bestuur te stellen regels;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: 135.4.b
    text: rentebaten die via het waarborgfonds zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: 135.4.c
    text: het batig saldo van de laatstelijk afgesloten rekening van het waarborgfonds;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: 135.4.d
    text: andere inkomsten.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: '135.5'
    text: 'Bij algemene maatregel van bestuur worden in elk geval regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: 135.5.a
    text: 'de maatstaf ter bepaling van de hoogte van de bijdrage, met inachtneming van:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: 135.5.a.1°
    text: |-
      de omvang van de mijnbouwactiviteiten van een mijnbouwondernemer aan de landzijde van de in de bijlage bij deze wet
      vastgelegde lijn,
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: 135.5.a.2°
    text: |-
      de hoogte van de schadevergoedingen die de vijf voorafgaande jaren ten laste van het waarborgfonds zijn toegekend
      in verband met mijnbouwactiviteiten van de desbetreffende mijnbouwondernemer of diens rechtsvoorganger,
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: 135.5.a.3°
    text: de aard van de desbetreffende mijnbouwactiviteiten, en
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: 135.5.a.4°
    text: de in het waarborgfonds aanwezige baten in relatie tot de begrote uitgaven;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: 135.5.b
    text: het tijdstip waarop de bijdrage verschuldigd wordt, en
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: 135.5.c
    text: de verschuldigdheid van rente als de bijdrage op een later tijdstip op een ander bedrag wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: '135.6'
    text: Niet in het jaar van ontvangst bestede gelden blijven in het waarborgfonds.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: '135.7'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent het vermogen van het waarborgfonds, mede met
      inachtneming van het totale bedrag aan schadevergoedingen dat mijnbouwondernemers gedurende in elk geval de
      laatste vijf jaar voorafgaande aan het tijdstip van inwerkingtreding van deze wet hebben betaald aan natuurlijke
      personen bij wie in die periode zaakschade is opgetreden als gevolg van door die mijnbouwondernemers verrichte
      mijnbouwactiviteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel135
  - number: '136.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de inrichting en de
      administratie van het waarborgfonds, alsmede het daarop uit te oefenen toezicht.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel136
  - number: '136.2'
    text: |-
      Onze Minister doet jaarlijks verslag aan beide kamers der Staten-Generaal omtrent het over het waarborgfonds
      gevoerde beheer.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel136
  - number: '137'
    text: |-
      Onze Minister kent een natuurlijke persoon bij wie zaakschade is opgetreden als gevolg van mijnbouwactiviteiten op
      diens verzoek een schadevergoeding toe ten laste van het waarborgfonds, indien:
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel137
  - number: 137.a
    text: |-
      de betrokken mijnbouwondernemer failliet is verklaard, surséance van betaling is verleend of ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, of
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel137
  - number: 137.b
    text: de betrokken mijnbouwondernemer heeft opgehouden te bestaan of is overleden, en
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel137
  - number: 137.c
    text: de schade niet reeds geheel of gedeeltelijk uit anderen hoofde is vergoed.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel137
  - number: '138.1'
    text: |-
      Indien op het moment waarop zich een van de gebeurtenissen, genoemd in [137, onderdeel a of b][ref1],
      voordoet de persoon, bedoeld in de aanhef van dat artikel nog geen adviesaanvraag als bedoeld in
      [artikel 114, tweede lid, onderdeel d][ref2], had ingediend, dient die persoon alsnog een aanvraag in:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel114
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '137'
        hoofdstuk: '9'
        paragraaf: '9.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '114'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 138.1.a
    text: uiterlijk drie maanden na het moment waarop de desbetreffende gebeurtenis zich heeft voorgedaan, of,
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel138
  - number: 138.1.b
    text: |-
      als hij op dat moment nog niet met de schade bekend kon zijn, binnen drie maanden na het moment waarop hij met de
      schade bekend is geworden of redelijkerwijs bekend had kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel138
  - number: '138.2'
    text: |-
      De artikelen [117 tot en met 119][ref1] zijn van toepassing, met dien verstande dat de
      [artikelen 118, tweede lid][ref2], en [119, tweede en derde lid][ref3], voorzover betrekking hebbend op de
      mijnbouwondernemer, buiten toepassing blijven. De commissie zendt Onze Minister afschriften van de adviesaanvraag
      en het voorlopig advies.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel118
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel119
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '117'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '118'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '119'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '139.1'
    text: |-
      De persoon, bedoeld in [artikel 137][ref1], dient zijn verzoek bij het waarborgfonds in uiterlijk drie maanden
      na het moment waarop de commissie het advies, bedoeld in [artikel 119, vierde lid][ref2], heeft vastgesteld en
      overlegt daarbij in ieder geval dat advies.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel119
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '137'
        hoofdstuk: '9'
        paragraaf: '9.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '119'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '139.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de indiening en de
      behandeling van, alsmede de beslissing op het verzoek.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel139
  - number: '140.1'
    text: |-
      Onze Minister kent een natuurlijke persoon van wie in het voorlopig advies, bedoeld in
      [artikel 119, tweede lid][ref1], dan wel het definitieve advies, bedoeld in artikel 119, vierde lid, is vastgesteld
      dat bij hem zaakschade als gevolg van mijnbouwactiviteiten is opgetreden op diens verzoek een voorschot ten laste
      van het waarborgfonds toe, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel119
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '119'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 140.1.a
    text: de mijnbouwondernemer bedenkingen heeft tegen het voorlopig advies dan wel het definitieve advies betwist, en
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel140
  - number: 140.1.b
    text: noodzakelijke maatregelen moeten worden getroffen ter herstel of beperking van de schade.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel140
  - number: 140.1.Het
    text: |-
      bedrag dat aan voorschotten kan worden verstrekt bedraagt ten hoogste 60 procent van het schadebedrag dat in het
      voorlopig advies wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel140
  - number: '140.2'
    text: |-
      Indien in een overeenkomst als bedoeld in [artikel 900 van Boek 7 van het Burgerlijk Wetboek][ref1] of
      bij onherroepelijke rechterlijke uitspraak wordt vastgesteld dat de schade niet het gevolg is van de
      mijnbouwactiviteiten dan wel het schadebedrag op een lager bedrag wordt vastgesteld dan het bedrag dat in totaal
      aan voorschotten is verstrekt, betaalt de persoon, bedoeld in het eerste lid, binnen drie maanden na het moment
      waarop die overeenkomst is gesloten of die uitspraak is gedaan het voorschot dan wel het verschil tussen het
      schadebedrag en het voorschot terug aan het waarborgfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel900
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '900'
  - number: '141.1'
    text: |-
      De persoon, bedoeld in [artikel 140, eerste lid][ref1], kan vanaf het moment waarop de commissie een voorlopig
      advies als bedoeld in [artikel 119, tweede lid][ref2], heeft uitgebracht, een verzoek om een voorschot indienen.
      Hij overlegt daarbij in ieder geval dat voorlopig advies.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel140
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel119
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '140'
        hoofdstuk: '9'
        paragraaf: '9.3'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '119'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '141.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de indiening en de
      behandeling van, alsmede de beslissing op een verzoek als bedoeld in [artikel 140, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel140
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '140'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: 141a.1
    text: |-
      De procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel c, van de Wet ruimtelijke ordening][ref1],
      is van toepassing op de aanleg of de uitbreiding van:


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 141a.1.a
    text: |-
      een mijnbouwwerk ten behoeve van de opsporing of winning van koolwaterstoffen in of onder een Natura 2000-gebied of
      een bijzonder nationaal natuurgebied als bedoeld in de [Wet natuurbescherming][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037552
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0037552
  - number: 141a.1.b
    text: een mijnbouwwerk ten behoeve van de opslag van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
  - number: 141a.1.c
    text: |-
      pijpleidingen die uitsluitend of in hoofdzaak zijn bestemd voor het vervoer van delfstoffen respectievelijk het
      vervoer van stoffen in verband met het opsporen of winnen van delfstoffen respectievelijk het opslaan van stoffen
      met behulp van een mijnbouwwerk als bedoeld in onderdeel a respectievelijk onderdeel b;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
  - number: 141a.1.d
    text: |-
      een mijnbouwwerk of pijpleidingen, voor zover het een project betreft voor olie of koolstofdioxide dat is opgenomen
      op de Unielijst van projecten van gemeenschappelijk belang, bedoeld in artikel 3, vierde lid, Verordening (EU)
      nr. 347/2013 van het Europees Parlement en de Raad van 17 april 2013 betreffende richtsnoeren voor de trans-
      Europese energie-infrastructuur en tot intrekking van Beschikking nr. 1364/2006/EG en tot wijziging van de
      Verordeningen (EG) nr. 713/2009, (EG) nr. 714/2009 en (EG) nr. 715/2009 (PbEU 2013, L 115).
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
  - number: 141a.2
    text: |-
      Een mijnbouwondernemer als omschreven in [artikel 113][ref1] meldt een voornemen tot aanleg of uitbreiding van een
      mijnbouwwerk of pijpleiding als bedoeld in het eerste lid, zo spoedig mogelijk schriftelijk aan Onze Minister. Bij
      ministeriële regeling kan voor het doen van de melding en de daarbij te verstrekken gegevens een formulier worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel113
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '113'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 141a.3
    text: |-
      Indien, in aanmerking genomen de omvang, aard en ligging van een mijnbouwwerk of een pijpleiding als bedoeld
      in het eerste lid, alsmede het aantal voor de aanleg of de uitbreiding van dat werk of die leiding benodigde
      besluiten, redelijkerwijze niet valt te verwachten dat toepassing van de procedures, bedoeld in het eerste lid, de
      besluitvorming in betekenende mate zal versnellen of daaraan anderszins aanmerkelijke voordelen zijn verbonden, kan
      Onze Minister bepalen dat:
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
  - number: 141a.3.a
    text: |-
      geen van de procedures, bedoeld in [artikel 3.35, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 141a.3.b
    text: |-
      uitsluitend de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel a][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 141a.3.c
    text: |-
      uitsluitend de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel b][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 141a.3.d
    text: |-
      de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel a][ref1], gevolgd door de procedure,
      bedoeld in artikel 3.35, eerste lid, aanhef en onderdeel b, van de Wet ruimtelijke ordening, van toepassing zijn
      of is op de aanleg of de uitbreiding van dat werk of die leiding. Onze Minister hoort de mijnbouwondernemer en de
      betrokken bestuursorganen over een voornemen toepassing te geven aan de bevoegdheid, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 141a.4
    text: |-
      Onze Minister kan in overeenstemming met de Minister van Infrastructuur en Milieu besluiten tot toepassing van de
      procedure, bedoeld in het eerste lid, aanhef, voor de aanleg of de uitbreiding van een mijnbouwwerk ten behoeve van
      de opsporing of winning van koolwaterstoffen in of onder andere gebieden dan bedoeld in het eerste lid, onderdeel
      a, indien:
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
  - number: 141a.4.a
    text: |-
      een gebied niet geheel is uitgesloten van de opsporing of winning van koolwaterstoffen bij of krachtens een
      algemene maatregel van bestuur als bedoeld in [artikel 9, eerste lid, onderdeel e][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel9
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 141a.4.b
    text: |-
      een belang als bedoeld in [artikel 9, eerste lid, onderdeel f][ref1], zich niet tegen aanleg of uitbreiding in dat
      gebied verzet,


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel9
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 141a.4.c
    text: |-
      het desbetreffende gebied niet geheel of ten dele is gelegen binnen de op grond van
      [artikel 1.1, eerste lid, van de Wet natuurbescherming][ref1] aangewezen Natura 2000-gebieden Waddenzee en
      Noordzeekustzone,


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
  - number: 141a.4.d
    text: |-
      het desbetreffende gebied niet geheel of ten dele is gelegen binnen de Waddenzee als aangewezen krachtens de
      [Wet ruimtelijke ordening][ref1] of op de Waddeneilanden, en


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: 141a.4.e
    text: |-
      het desbetreffende gebied niet geheel of ten dele is gelegen binnen het gebied dat op grond van de Overeenkomst
      inzake de bescherming van het cultureel en natuurlijk erfgoed van de wereld (Trb. 1973, 155) is aangewezen als
      werelderfgoedgebied Waddenzee.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141a
  - number: 141b.1
    text: |-
      Onze Minister is de aangewezen minister, bedoeld in
      [artikel 3.35, tweede en derde lid, van de Wet ruimtelijke ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141b
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 141b.2
    text: |-
      Indien toepassing wordt gegeven aan [artikel 3.28, vierde lid, van de Wet ruimtelijke ordening][ref1] treden, in
      afwijking van dat artikellid, Onze Minister en Onze Minister van Infrastructuur en Milieu gezamenlijk in de plaats
      van burgemeester en wethouders ten aanzien van de bevoegdheden en verplichtingen, bedoeld in dat artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141b
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 141b.3
    text: |-
      Onze Minister kan, in overeenstemming met het gevoelen van de ministerraad, bepalen dat
      Onze Minister en Onze Minister wie het mede aangaat, met overeenkomstige toepassing van
      [artikel 3.35, derde lid, vierde volzin, van de Wet ruimtelijke ordening][ref1], één of meer besluiten nemen die
      nodig zijn voor de aanleg of uitbreiding van een daarbij aangewezen mijnbouwwerk of pijpleiding als bedoeld in
      [artikel 141a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel141a
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141b
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 141a
        hoofdstuk: 9a
  - number: 141c.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de besluiten aangewezen die voor de aanleg of uitbreiding
      van een mijnbouwwerk of pijpleiding als bedoeld in [artikel 141a, eerste lid][ref1], in ieder geval besluiten als
      bedoeld in [artikel 3.35, eerste lid, onderdeel b, van de Wet ruimtelijke ordening][ref2] zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel141a
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 141a
        hoofdstuk: 9a
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 141c.2
    text: |-
      Onze Minister kan ten behoeve van de aanleg of uitbreiding van een mijnbouwwerk of een pijpleiding
      als bedoeld in [artikel 141a, eerste lid][ref1], tevens één of meer andere besluiten dan de
      bij of krachtens het eerste lid aangewezen besluiten aanwijzen als besluiten als bedoeld in
      [artikel 3.35, eerste lid, onderdeel b, van de Wet ruimtelijke ordening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel141a
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 141a
        hoofdstuk: 9a
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 141c.3
    text: |-
      Onze Minister kan, indien een bij of krachtens het eerste lid aangewezen besluit de toepassing van de procedure,
      bedoeld in [artikel 141a, eerste lid][ref1], zou belemmeren of ernstig bemoeilijken, bepalen dat het desbetreffende
      besluit, in afwijking van de in het eerste lid bedoelde algemene maatregel van bestuur, niet als een besluit als
      bedoeld in [artikel 3.35, eerste lid, onderdeel b, van de Wet ruimtelijke ordening][ref2] wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel141a
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel141c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 141a
        hoofdstuk: 9a
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '142.1'
    text: |-
      Ten aanzien van een besluit omtrent een mijnbouwmilieuvergunning en instemming met een winningsplan
      is [hoofdstuk 20 van de Wet milieubeheer][ref1] van overeenkomstige toepassing, met dien verstande
      dat [artikel 20.3 van de Wet milieubeheer][ref2] niet van toepassing is op een besluit omtrent een
      mijnbouwmilieuvergunning voor een mijnbouwwerk te plaatsen of geplaatst aan de zeezijde van de in de bijlage bij
      deze wet vastgelegde lijn en een winningsplan voorzover het winnen van delfstoffen geschiedt vanuit een voorkomen
      dat is gelegen aan de zeezijde van de in de bijlage bij deze wet vastgelegde lijn. De eerste volzin is van
      overeenkomstige toepassing op een besluit omtrent instemming met een winningsplan of opslagplan als bedoeld in
      [artikel 39, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk20
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel39
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel142
    references:
      - id: ref1
