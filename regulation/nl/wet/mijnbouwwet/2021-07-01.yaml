      zee, bedoeld in [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref3], gestelde regels
      over de opsporing of winning van een delfstof of aardwarmte door middel van een opsporings- of winningsinstallatie,


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003748#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel13
