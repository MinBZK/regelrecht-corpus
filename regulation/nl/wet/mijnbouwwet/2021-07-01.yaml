---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mijnbouwwet
regulatory_layer: WET
publication_date: '2025-11-13'
valid_from: '2021-07-01'
bwb_id: BWBR0014168
url: https://wetten.overheid.nl/BWBR0014168/2021-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het bestaande samenstel van wettelijke regelingen
    inzake het onderzoek naar en het winnen van delfstoffen te vervangen door een nieuwe regeling, die aan de thans te
    stellen eisen voldoet, en enige regels te stellen met betrekking tot bepaalde met mijnbouw verwante activiteiten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.a
    text: |-
      delfstoffen: in de ondergrond aanwezige mineralen of substanties van organische oorsprong, in een aldaar langs
      natuurlijke weg ontstane concentratie of afzetting, in vaste, vloeibare of gasvormige toestand, met uitzondering
      van brongas, kalksteen, grind, zand, klei, schelpen en mengsels daarvan;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.b
    text: 'aardwarmte: in de ondergrond aanwezige warmte die aldaar langs natuurlijke weg is ontstaan;'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.c
    text: |-
      continentaal plat: het onder de Noordzee gelegen deel van de zeebodem en de ondergrond daarvan, waarop
      het Koninkrijk mede overeenkomstig het op 10 december 1982 te Montego-Bay gesloten Verdrag inzake het
      recht van de zee (Trb. 1983, 83) soevereine rechten heeft en hetwelk is gelegen aan de zeezijde van de in
      [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref1] bedoelde lijn;


      [ref1]: https://wetten.overheid.nl/BWBR0003748#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003748
        artikel: '1'
  - number: 1.d
    text: |-
      verkenningsonderzoek: een onderzoek, zonder gebruikmaking van een boorgat, naar de aanwezigheid van delfstoffen of
      naar de aanwezigheid van aardwarmte, dan wel naar nadere gegevens omtrent delfstoffen of aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.e
    text: |-
      opsporen van delfstoffen: onderzoek doen naar de aanwezigheid van delfstoffen, dan wel naar nadere gegevens
      daaromtrent, met gebruikmaking van een boorgat;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.f
    text: |-
      winnen van delfstoffen: het met gebruikmaking van een boorgat, tunnel, schacht of ander ondergronds werk onttrekken
      van delfstoffen aan de ondergrond anders dan in de vorm van monsters of formatiebeproevingen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.g
    text: |-
      opsporen van aardwarmte: onderzoek doen naar de aanwezigheid van aardwarmte, dan wel naar nadere gegevens
      daaromtrent, met gebruikmaking van een boorgat;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.h
    text: |-
      winnen van aardwarmte: het onttrekken van aardwarmte aan de ondergrond anders dan het onttrekken daarvan in
      samenhang met het opsporen of het winnen van delfstoffen dan wel met het opslaan van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.i
    text: |-
      opslaan van stoffen: het brengen of houden van stoffen op een diepte van meer dan 100 meter beneden de oppervlakte
      van de aardbodem, dan wel het terughalen van die stoffen, anders dan het in de ondergrond brengen of houden of
      daaruit terughalen van stoffen gericht op het onttrekken van aardwarmte aan de ondergrond;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.j
    text: 'opsporingsvergunning: een vergunning voor het opsporen van delfstoffen;'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.k
    text: 'winningsvergunning: een vergunning voor het winnen van delfstoffen, alsmede voor het opsporen van delfstoffen;'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.l
    text: 'opslagvergunning: een vergunning voor het opslaan van stoffen;'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.m
    text: 'mijnbouwmilieuvergunning: een vergunning als bedoeld in [artikel 40, tweede lid](onbekend);'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.n
    text: 'mijnbouwwerk: een werk dat behoort tot een bij algemene maatregel van bestuur aangewezen categorie van werken:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.n.1°
    text: ten behoeve van het opsporen of het winnen van delfstoffen of aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.n.2°
    text: ten behoeve van het opslaan van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.n.3°
    text: die samenhangen met de in de onderdelen 1° en 2° bedoelde werken;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.o
    text: 'mijnbouwinstallatie: een mijnbouwwerk dat verankerd is in of aanwezig is boven de bodem van een oppervlaktewater;'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.p
    text: 'Onze Minister: Onze Minister van Economische Zaken en Klimaat;'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.q
    text: |-
      opsporen van CO-opslagcomplexen: onderzoek naar opslagcomplexen met gebruikmaking van een boorgat of door het
      verrichten van proeven met injectie van CO om het opslagvoorkomen te karakteriseren;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.r
    text: 'opsporingsvergunning van CO-opslagcomplexen: een vergunning voor het opsporen van CO-opslagcomplexen;'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.s
    text: |-
      CO-opslagcomplex: opslagvoorkomen voor CO en de omringende geologische gebieden die een weerslag kunnen hebben op
      de algehele integriteit van de opslag en de veiligheid ervan;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.t
    text: 'opslagvoorkomen: een voorkomen dat gebruikt wordt voor opslag;'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.u
    text: |-
      permanent opslaan van CO: permanent opslaan van CO en stoffen die daarmee in directe samenhang worden opgeslagen
      met uitzondering van opslag van CO voor onderzoeks- of ontwikkelingsdoeleinden of voor het beproeven van nieuwe
      producten en procedés indien de geplande opslagcapaciteit minder is dan 100 kiloton;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.v
    text: 'zwaar ongeval:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.v.1°
    text: |-
      een incident met daarbij een explosie, brand of verlies van controle over de boorput of lekkage van olie, gas of
      gevaarlijke stoffen, waarbij sprake is van of een aanzienlijke kans bestaat op slachtoffers of ernstig lichamelijk
      letsel,
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.v.2°
    text: |-
      een incident dat tot ernstige schade aan het mijnbouwwerk of de verbonden infrastructuur leidt, waarbij sprake is
      van of een aanzienlijke kans bestaat op slachtoffers of ernstig lichamelijk letsel,
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.v.3°
    text: |-
      een incident leidend tot de dood of tot ernstige verwondingen van vijf of meer personen, die aanwezig zijn op het
      mijnbouwwerk waar het gevaar zijn oorsprong vindt of die betrokken zijn bij een olie- of gasactiviteit in verband
      met het mijnbouwwerk of de verbonden infrastructuur of
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.v.4°
    text: |-
      een zwaar milieuincident dat voortvloeit uit de incidenten als bedoeld onder a, b en c en dat leidt of naar
      verwachting zal leiden tot aanzienlijke negatieve gevolgen voor het milieu, als bedoeld in richtlijn 2004/35/EG;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.w
    text: 'kennisgeving: een schriftelijke aankondiging van een voorgenomen activiteit;'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.x
    text: |-
      exploitant: een houder van een vergunning voor het opsporen of winnen van koolwaterstoffen of indien er meerdere
      houders van de vergunning zijn, één van de vergunninghouders die overeenkomstig [artikel 22, vijfde lid][ref1], is
      aangewezen om de feitelijke werkzaamheden te verrichten of daartoe opdracht te verlenen;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 1.y
    text: |-
      boorgatactiviteit: elke activiteit, met inbegrip van het opschorten daarvan, met betrekking tot een boorgat waarbij
      per ongeluk stoffen kunnen vrijkomen, wat mogelijk tot een zwaar ongeval kan leiden, waarbij het in ieder geval
      gaat om:
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.y.1°
    text: het boren van een boorgat ten behoeve van de opsporing of winning van koolwaterstoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.y.2°
    text: het herstellen of aanpassen van een boorgat of
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.y.3°
    text: het definitief verlaten van een boorgat;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.z
    text: 'gecombineerde activiteit:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.z.1°
    text: |-
      een activiteit die wordt uitgevoerd vanaf een mijnbouwwerk samen met één of meerdere andere mijnbouwwerken ten
      behoeve van aan het andere mijnbouwwerk gerelateerde doeleinden, waarbij de risico’s voor de veiligheid van
      personen of de bescherming van het milieu op één of alle mijnbouwwerken aanzienlijk wordt beïnvloed of
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.z.2°
    text: het gelijktijdig uitvoeren van werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.aa
    text: |-
      onafhankelijke verificatie: een beoordeling en bevestiging van de geldigheid van bepaalde schriftelijke
      verklaringen, door een entiteit of organisatorisch onderdeel van de vergunninghouder of eigenaar van een
      mijnbouwwerk die niet onder de controle of invloed valt van de entiteit die of het organisatorisch onderdeel dat de
      verklaringen gebruikt;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.ab
    text: |-
      productie-installatie: een mijnbouwwerk dat gebruikt wordt voor het winnen of bewerken van koolwaterstoffen,
      met uitzondering van inrichtingen waarvoor het [Besluit risico’s zware ongevallen 1999][ref1] geldt, of een
      pijpleiding, met uitzondering van pijpleidingen waarvoor het [Besluit externe veiligheid buisleidingen][ref2]
      geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0010475
      [ref2]: https://wetten.overheid.nl/BWBR0028265
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010475
      - id: ref2
        bwb_id: BWBR0028265
  - number: 1.ac
    text: |-
      niet-productie-installatie: een mijnbouwwerk niet zijnde een productie-installatie en niet zijnde een mijnbouwwerk
      bestemd voor het winnen van zout of aardwarmte of voor het opslaan van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.ad
    text: |-
      richtlijn 2013/30/EU: richtlijn 2013/30/EU van het Europees parlement en de Raad van 12 juni 2013 betreffende de
      veiligheid van offshore olie- en gasactiviteiten en tot wijziging van richtlijn 2004/35/EG (PbEU 2013, L 178);
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.ae
    text: |-
      richtlijn 2008/56/EG: richtlijn 2008/56/EG van het Europees parlement en de Raad van 17 juni 2008 tot vaststelling
      van een kader voor communautaire maatregelen betreffende het beleid ten aanzien van het mariene milieu
      (Kaderrichtlijn mariene strategie) (PbEU 2008, L 164);
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.af
    text: 'essentiële wijziging: wezenlijke verandering die de kern betreffen;'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.ag
    text: 'pijpleiding:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.ag.1°
    text: |-
      leiding die twee of meer mijnbouwwerken met elkaar verbindt ten behoeve van het vervoer van stoffen, te rekenen
      vanaf de eerste isolatieafsluiter van het mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.ag.2°
    text: |-
      andere leiding dan bedoeld onder 1°, aan te wijzen door Onze Minister, die een mijnbouwwerk verbindt met een ander
      werk ten behoeve van het vervoer van stoffen te rekenen vanaf de eerste isolatieafsluiter van het mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: 1.ah
    text: |-
      risicobeoordeling: wetenschappelijke of anderszins geobjectiveerde beoordeling, die bestaat uit een
      gevareninventarisatie, gevarenkarakterisatie, blootstellingschatting en risicokarakterisatie.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel1
  - number: '2.1'
    text: Deze wet is mede van toepassing op het continentaal plat.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel2
  - number: '2.2'
    text: |-
      Deze wet, met uitzondering van [artikel 51][ref1], is met betrekking tot delfstoffen slechts van toepassing,
      voorzover de delfstoffen op een diepte van meer dan 100 meter beneden de oppervlakte van de aardbodem aanwezig
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel51
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '2.3'
    text: |-
      Deze wet is met betrekking tot aardwarmte slechts van toepassing, voorzover de aardwarmte op een diepte van meer
      dan 500 meter beneden de oppervlakte van de aardbodem aanwezig is.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel2
  - number: '3.1'
    text: Delfstoffen zijn eigendom van de staat.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel3
  - number: '3.2'
    text: |-
      De eigendom van delfstoffen die met gebruikmaking van een winningsvergunning worden gewonnen, gaat door het
      winnen daarvan over op de vergunninghouder. De eerste volzin is van overeenkomstige toepassing ten aanzien van
      delfstoffen die met gebruikmaking van een opsporingsvergunning in de vorm van monsters of formatiebeproevingen aan
      de ondergrond worden onttrokken.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel3
  - number: '3.3'
    text: |-
      De eigendom van stoffen die met gebruikmaking van een opslagvergunning worden teruggehaald, komt door het
      terughalen daarvan te berusten bij degene die eigenaar was van de stoffen direct voorafgaande aan het in de
      ondergrond brengen daarvan, dan wel bij degene die ten tijde van het terughalen de rechtsopvolger is van die
      eigenaar.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel3
  - number: '3.4'
    text: |-
      De staat wordt voor alle met de eigendom van delfstoffen verband houdende handelingen vertegenwoordigd door Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel3
  - number: '4'
    text: |-
      De rechthebbende ten aanzien van de oppervlakte van de aardbodem is verplicht te gedogen dat de houder van een
      vergunning voor het opsporen van CO-opslagcomplexen, het opsporen of het winnen van delfstoffen of aardwarmte,
      dan wel het opslaan van stoffen, in de ondergrond COopslagcomplexen opspoort, delfstoffen of aardwarmte opspoort
      of wint of stoffen opslaat overeenkomstig de op deze activiteiten betrekking hebbende regels, voorzover deze
      activiteiten plaatsvinden op een diepte van meer dan 100 meter beneden de oppervlakte en heeft recht op een door
      Onze Minister vast te stellen vergoeding voor het gebruik van de oppervlakte van de houder van een vergunning voor
      het opsporen van CO-opslagcomplexen, het opsporen of winnen van delfstoffen of aardwarmte, dan wel het opslaan van
      stoffen, onverminderd het recht dat de rechthebbende ten aanzien van de oppervlakte heeft op vergoeding van de door
      deze activiteiten veroorzaakte schade. De hoogte van de vergoeding voor het gebruik is afhankelijk van de impact
      van het mijnbouwwerk op de gebruiksrechten en waarde van de oppervlakte voor de rechthebbende ten aanzien van de
      oppervlakte.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel4
  - number: '5'
    text: |-
      Voor de toepassing van de [Belemmeringenwet Verordeningen][ref1] en de [Belemmeringenwet Privaatrecht][ref2]
      worden werken die worden of zijn uitgevoerd ten behoeve van het opsporen van CO-opslagcomplexen, het opsporen of
      winnen van delfstoffen of aardwarmte of ten behoeve van het opslaan van stoffen, aangemerkt als openbare werken van
      algemeen nut.


      [ref1]: https://wetten.overheid.nl/BWBR0001865
      [ref2]: https://wetten.overheid.nl/BWBR0001936
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001865
      - id: ref2
        bwb_id: BWBR0001936
  - number: 5a
    text: |-
      Onze Minister draagt zorg voor de instelling van een onafhankelijk wetenschappelijk kennisprogramma, waarin de
      inbreng van nationale en internationale wetenschappers en deskundigen is geborgd.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel5a
  - number: '6.1'
    text: 'Het is verboden zonder vergunning van Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel6
  - number: 6.1.a
    text: delfstoffen op te sporen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel6
  - number: 6.1.b
    text: delfstoffen te winnen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel6
  - number: 6.1.c
    text: aardwarmte op te sporen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel6
  - number: 6.1.d
    text: aardwarmte te winnen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel6
  - number: '6.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het verbod niet van toepassing is op in die maatregel
      omschreven categorieën van opsporen of winnen van aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel6
  - number: '6.3'
    text: |-
      Het in dit hoofdstuk met betrekking tot opsporen of winnen van delfstoffen bepaalde is van overeenkomstige
      toepassing met betrekking tot opsporen of winnen van aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel6
  - number: 6a
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van een besluit inzake
      de aanvraag om een vergunning als bedoeld in [artikel 6, eerste lid, onderdeel a][ref2], voor het opsporen van
      koolwaterstoffen in het continentaal plat of onder de territoriale zee.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel6
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '7.1'
    text: |-
      Een vergunning wordt niet verleend, voorzover deze bij het in werking treden zou gaan gelden voor een gebied
      waarvoor op dat tijdstip reeds een door een ander gehouden vergunning voor dezelfde delfstof geldt.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel7
  - number: '7.2'
    text: |-
      Een vergunning wordt evenmin verleend, voorzover deze bij het in werking treden zou gaan gelden voor een voorkomen
      waarvoor op dat tijdstip reeds een door een ander gehouden opslagvergunning geldt.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel7
  - number: '7.3'
    text: |-
      Het eerste lid blijft buiten toepassing ten aanzien van de in [artikel 11, eerste lid][ref1], bedoelde andere
      delfstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel11
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 7a.1
    text: |-
      Indien een vergunning als bedoeld in [artikel 6, eerste lid, onderdelen a of b][ref1],
      is verleend, wordt geen vergunning verleend als bedoeld in
      [artikel 2.1, eerste lid, onderdeel e, van de Wet algemene bepalingen omgevingsrecht][ref2], voor zover die
      vergunning zou gelden voor een activiteit tot het oprichten van een mijnbouwwerk:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7a.1.a
    text: |-
      in de op grond van [artikel 1.1, eerste lid, van de Wet natuurbescherming][ref1] aangewezen Natura 2000-gebieden
      Waddenzee en Noordzeekustzone,


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
  - number: 7a.1.b
    text: |-
      in een gebied, of een gedeelte daarvan, dat is gelegen binnen de Waddenzee, als aangewezen krachtens de
      [Wet ruimtelijke ordening][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: 7a.1.c
    text: |-
      in het op grond van de Overeenkomst inzake de bescherming van het cultureel en natuurlijk erfgoed van de wereld
      (Trb. 1973, 155) aangewezen werelderfgoedgebied Waddenzee, of
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel7a
  - number: 7a.1.d
    text: op de Waddeneilanden.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel7a
  - number: 7a.2
    text: |-
      Een vergunning als bedoeld in
      [artikel 2.1, eerste lid, onderdeel e, van de Wet algemene bepalingen omgevingsrecht][ref1]
      voor een oppervlaktewinningsinstallatie in het gebied gelegen boven het op grond van
      [artikel 1.1, eerste lid, van de Wet natuurbescherming][ref2] aangewezen Natura 2000-gebied Noordzeekustzone, maar
      binnen de 12-mijlszone wordt slechts verleend als medegebruik van een reeds bestaand mijnbouwplatform niet mogelijk
      is en als zichthinder is geminimaliseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '1'
  - number: '8'
    text: |-
      Een winningsvergunning wordt slechts verleend, indien aannemelijk is dat de delfstoffen binnen het gebied waarvoor
      de vergunning zal gelden economisch winbaar zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel8
  - number: '9.1'
    text: |-
      Onverminderd de [artikelen 7][ref1] en [8][ref2] kan een vergunning slechts geheel of gedeeltelijk worden
      geweigerd:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel8
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9.1.a
    text: op grond van de technische of financiële mogelijkheden van de aanvrager,
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
  - number: 9.1.b
    text: |-
      op grond van de manier waarop de aanvrager voornemens is de activiteiten voor opsporing of winning te verrichten,
      waaronder de bij die activiteiten te gebruiken technieken, hulpmiddelen of stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
  - number: 9.1.c
    text: |-
      op grond van het gebrek aan efficiëntie en verantwoordelijkheidszin, daaronder mede verstaan maatschappelijke
      verantwoordelijkheidszin, waarvan de aanvrager blijk heeft gegeven bij activiteiten als bedoeld in de
      [artikelen 6, eerste lid][ref1], en [25, eerste lid][ref2], onder een eerdere vergunning,


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 9.1.d
    text: |-
      indien een keuze moet worden gemaakt uit twee of meer aanvragen om een vergunning die bij een beoordeling op grond
      van de onderdelen a, b en c gelijkwaardig zijn gebleken, in het belang van het doelmatig en voortvarend opsporen
      en winnen,
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
  - number: 9.1.e
    text: 'indien:'
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
  - number: 9.1.e.1°
    text: |-
      bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 4.3, eerste lid][ref1], of
      [10.8, eerste lid, van de Wet ruimtelijke ordening][ref2] voor een gebied op land, respectievelijk in de
      territoriale zee, bedoeld in [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref3], regels
      zijn gesteld inhoudende dat de opsporing of winning van een delfstof of aardwarmte door middel van een opsporings-
      of winningsinstallatie in dat gebied niet wordt of kan worden toegestaan,


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003748#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0003748
        artikel: '1'
  - number: 9.1.e.2°
    text: |-
      bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 49][ref1] regels zijn gesteld over: -
      het geheel of gedeeltelijk uitsluiten van een gebied van de opsporing of winning van een delfstof of aardwarmte,
        - de diepte waarop een activiteit plaatsvindt,
        - de soort activiteit, of
        - de soort delfstof,


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 9.1.f
    text: |-
      indien het in de aanvraag aangeduide gebied door Onze Minister niet geschikt wordt geacht voor de in de aanvraag
      vermelde activiteit om reden van het belang van:
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
  - number: 9.1.f.1°
    text: |-
      de veiligheid voor omwonenden of het voorkomen van schade aan gebouwen of infrastructurele werken of de
      functionaliteit daarvan, voor zover het winnen van delfstoffen niet geschiedt in het continentaal plat,
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
  - number: 9.1.f.2°
    text: |-
      het planmatig gebruik of beheer van delfstoffen, aardwarmte, andere natuurlijke rijkdommen, waaronder grondwater
      met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
  - number: 9.1.f.3°
    text: nadelige gevolgen die voor het milieu worden veroorzaakt, of
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
  - number: 9.1.f.4°
    text: nadelige gevolgen die voor de natuur worden veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
  - number: '9.2'
    text: |-
      Een vergunning kan op grond van de financiële mogelijkheden van de aanvrager worden geweigerd als onvoldoende
      verzekerd is dat de aanvrager zal voldoen aan hem op te leggen verplichtingen als bedoeld in de artikelen
      [46][ref1], [47][ref2] en [102][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel102
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '102'
        hoofdstuk: '5'
        afdeling: '5.4'
  - number: '9.3'
    text: |-
      Met het oog op de toepassing van het eerste en tweede lid kunnen bij ministeriële regeling nadere regels worden
      gesteld die bij de beslissing op een aanvraag om een vergunning in acht worden genomen. Zodanige regels worden in
      elk geval gesteld met betrekking tot opsporings- en winningsvergunningen voor koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
  - number: '9.4'
    text: |-
      Van de plaatsing in de Staatscourant van een regeling als bedoeld in de tweede volzin van het derde lid wordt
      mededeling gedaan in het Publicatieblad van de Europese Unie. Van een besluit tot wijziging van zodanige regeling
      wordt eveneens mededeling gedaan in het Publicatieblad van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9
  - number: 9a.1
    text: |-
      In aanvulling op [artikel 9, eerste lid, onder a][ref1], wordt bij een aanvraag voor een opsporings- of
      winningsvergunning voor koolwaterstoffen bij de beoordeling van de technische of financiële mogelijkheden van de
      aanvrager rekening gehouden met:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel9
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9a.1.a
    text: het risico, de gevaren en andere relevante informatie over het gebied waarvoor de vergunning zal gaan gelden;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9a
  - number: 9a.1.b
    text: |-
      de financiële draagkracht van de aanvrager om alle eventueel uit de desbetreffende opsporings- en
      winningsactiviteiten voortvloeiende aansprakelijkheden te dragen;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9a
  - number: 9a.1.c
    text: |-
      de beschikbare informatie betreffende de technische bekwaamheden en de veiligheids- en milieuprestaties van de
      aanvrager.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9a
  - number: 9a.2
    text: |-
      Bij een aanvraag voor een opsporings- of winningsvergunning voor koolwaterstoffen in het continentaal plat of onder
      de territoriale zee wordt bij de beoordeling van de technische of financiële mogelijkheden van de aanvrager, tevens
      rekening gehouden met de kosten van aantasting van het mariene milieu als bedoeld in artikel 8, eerste lid, onder
      c, van richtlijn 2008/56/EG;
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9a
  - number: 9a.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de informatie met betrekking tot de veiligheids- en
      milieuprestatie van de aanvrager, die bij de beoordeling van diens technische en financiële mogelijkheden,
      meegenomen wordt.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel9a
  - number: '10.1'
    text: |-
      Onverminderd de [artikelen 7][ref1] en [8][ref2] wordt de houder van een opsporingsvergunning die met
      gebruikmaking van die vergunning de aanwezigheid van de betrokken delfstoffen heeft aangetoond, op zijn aanvraag,
      ingediend gedurende de geldingsduur van die vergunning, een winningsvergunning voor die delfstoffen verleend voor
      het gebied waarvoor de opsporingsvergunning geldt. Indien de opsporingsvergunning geldt voor een gebied dat niet
      overeenkomstig [artikel 11, vijfde lid][ref3], is begrensd en de aanwezigheid van de betrokken delfstoffen slechts
      in een deel van het gebied is aangetoond, wordt de winningsvergunning verleend voor het deel van het gebied,
      waarvoor verlening uit geologisch oogpunt gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel11
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '10.2'
    text: |-
      Het eerste lid geldt niet, indien weigering van de winningsvergunning gerechtvaardigd wordt door een van de in
      [artikel 9, eerste lid, onderdelen a tot en met c, e en f][ref1], genoemde gronden. Artikel 9, tweede, derde en
      vierde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel9
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '10.3'
    text: |-
      Indien een aanvraag als bedoeld in het eerste lid is ingediend, blijft de opsporingsvergunning, voorzover deze
      betrekking heeft op het aangevraagde gebied, tenminste gelden tot het tijdstip waarop de beschikking waarbij
      op de aanvraag wordt beslist onherroepelijk wordt. Indien een winningsvergunning wordt verleend, vervalt
      op het tijdstip waarop de beschikking onherroepelijk wordt, voor het gebied waarvoor de winningsvergunning
      geldt, de opsporingsvergunning voor de betrokken delfstoffen. Voorzover hierdoor voorschriften als bedoeld in
      [artikel 12][ref1] vervallen die nog niet zijn uitgewerkt, gaan zij gelden als voorschriften die zijn verbonden aan
      de winningsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel12
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '11.1'
    text: |-
      In een vergunning wordt bepaald voor welke in [artikel 6][ref1] bedoelde activiteiten en voor welke delfstoffen zij
      geldt. Indien in een winningsvergunning is opgenomen dat zij geldt voor bepaalde delfstoffen, geldt zij tevens voor
      andere delfstoffen die onvermijdelijk meekomen met de winning van die bepaalde delfstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '11.2'
    text: |-
      In een vergunning wordt bepaald voor welk tijdvak zij geldt. Dit geschiedt zodanig dat het tijdvak niet langer is
      dan noodzakelijk om de activiteiten, waarvoor de vergunning wordt verleend, te verrichten.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel11
  - number: '11.3'
    text: |-
      In een vergunning wordt bepaald voor welk gebied zij geldt. Ten behoeve van de afbakening van het gebied wordt de
      begrenzing aan de oppervlakte aangegeven. Tenzij de vergunning anders bepaalt, wordt het gebied gevormd door het
      aangegeven oppervlak en de ondergrond daarvan.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel11
  - number: '11.4'
    text: |-
      De afbakening van het gebied geschiedt zodanig dat de uitoefening van de activiteiten uit technisch en economisch
      oogpunt op zo goed mogelijke wijze kan plaatsvinden. Bij ministeriële regeling worden nadere regels gesteld
      met het oog op de toepassing van de vorige volzin met betrekking tot een opsporings- of winningsvergunning voor
      koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel11
  - number: '11.5'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat een opsporingsvergunning voor daarbij aangegeven delfstoffen
      slechts kan worden verleend voor een gebied, waarvan de begrenzing een gevolg is van een voorafgaande geometrische
      verdeling van het gebied waarvoor deze wet geldt of van een deel daarvan. In dat geval is het vierde lid niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel11
  - number: '12.1'
    text: |-
      In een opsporingsvergunning wordt bepaald binnen welke tijdvakken nadat de vergunning onherroepelijk is geworden,
      de in de vergunning aangegeven opsporingsactiviteiten dienen te worden verricht. In de vergunning kan tevens worden
      bepaald binnen welke tijdvakken nadat de vergunning onherroepelijk is geworden, de in de vergunning aangegeven
      verkenningsonderzoeken dienen te worden verricht.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel12
  - number: '12.2'
    text: |-
      In een vergunning voor opsporing en winning van koolwaterstoffen wordt de omvang van de middelen bepaald die de
      houder van de vergunning verplicht is aan te houden om te voldoen aan financiële verplichtingen die voort kunnen
      vloeien uit aansprakelijkheden ter zake van op basis van de vergunning te verrichten activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel12
  - number: '13'
    text: |-
      Een vergunning kan onder andere beperkingen dan die bedoeld in [artikel 11][ref1] worden verleend of aan een
      vergunning kunnen andere voorschriften dan die bedoeld in de [artikelen 12][ref2] en [98][ref3] worden verbonden
      uitsluitend in verband met:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel98
    url: https://wetten.overheid.nl/BWBR0014168/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '12'
        hoofdstuk: '2'
