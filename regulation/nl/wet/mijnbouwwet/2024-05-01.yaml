  - number: '163'
    text: |-
      Bepalingen in een voor de inwerkingtreding van deze wet gesloten overeenkomst, waarbij een partij zich jegens de
      staat verbindt om borg te staan voor de betaling van een oppervlakterecht, een cijns of een aandeel in de winst
      door de houder van een opsporingsvergunning of een winningsvergunning als bedoeld in [artikel 143][ref1] of diens
      rechtsvoorganger, blijven buiten toepassing voorzover zij betrekking hebben op verplichtingen die zijn ontstaan op
      grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '164.1'
    text: |-
      Voor de bepaling van een oppervlakterecht als bedoeld in [paragraaf 5.1.1.2][ref1], met betrekking tot een
      opsporingsvergunning of een winningsvergunning als bedoeld in [artikel 143][ref2], wordt de vergunning geacht van
      kracht te zijn op het tijdstip waarop het besluit, bedoeld in artikel 143, eerste of tweede lid, waarvoor deze
      vergunning in de plaats komt, van kracht was.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.1.1.2
        afdeling: 5.1.1
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '164.2'
    text: |-
      In een geval als bedoeld in het eerste lid wordt over het tijdvak vanaf de inwerkingtreding van deze wet tot de
      eerste 1 januari na de inwerkingtreding, het oppervlakterecht bepaald op een deel van het recht dat overeenkomstig
      [paragraaf 5.1.1.2][ref1] vastgesteld zou worden over het jaar van inwerkingtreding. Dit deel wordt bepaald
      op het deel dat is toe te rekenen aan het tijdvak vanaf de inwerkingtreding tot de eerste 1 januari na de
      inwerkingtreding. Het recht is verschuldigd op 1 april na de inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.1.1.2
        afdeling: 5.1.1
  - number: '164.3'
    text: |-
      In een geval als bedoeld in het tweede lid wordt op het verschuldigde recht in mindering gebracht een deel van
      het oppervlakterecht dat op grond van een van de in [artikel 168][ref1] genoemde wetten verschuldigd is over een
      tijdvak dat doorloopt na de inwerkingtreding van deze wet. Dit deel wordt bepaald op het deel dat is toe te rekenen
      aan het tijdvak na de inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel168
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '168'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '165'
    text: |-
      De Mijnraad, ingesteld bij de [wet van 1 mei 1970, houdende regeling betreffende de Mijnraad (Stb. 196)][ref1],
      wordt beschouwd als de Mijnraad, bedoeld in [artikel 105][ref2]. De besluiten die zijn genomen op grond van die wet
      gaan gelden als de overeenkomstige besluiten op grond van paragraaf 6.1.


      [ref1]: https://wetten.overheid.nl/BWBR0002707
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel105
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0002707
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '105'
        hoofdstuk: '6'
  - number: '166'
    text: |-
      De bijdrage, bedoeld in [artikel 135, vierde lid, onderdeel a][ref1], is voor het eerst verschuldigd in het jaar
      dat volgt op het jaar van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel135
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '135'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: '167.1'
    text: |-
      Ten aanzien van de mogelijkheid om bezwaar te maken of beroep in te stellen tegen een besluit dat is genomen op
      grond van een van de in [artikel 168][ref1] genoemde wetten, blijft het recht van toepassing zoals dat gold voor de
      inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel168
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '168'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '167.2'
    text: |-
      Ten aanzien van de behandeling van bezwaar of beroep dat is gemaakt of ingesteld tegen een besluit dat is genomen
      op grond van een van de in [artikel 168][ref1] genoemde wetten, blijft het recht van toepassing zoals dat gold voor
      de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel168
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '168'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: 167a.1
    text: |-
      De wijziging van de [artikelen 18][ref1] en [21][ref2] van deze wet bij [wet van 21 december 2016, houdende
      wijziging van de Mijnbouwwet (versterking veiligheidsbelang mijnbouw en regie opsporings-, winnings- en
      opslagvergunningen)](onbekend) (Stb. 2016, 554), heeft geen gevolgen voor de houder van een winningsvergunning of
      een opslagvergunning, aan wie een instemming met het winningsplan als bedoeld in [artikel 34, derde lid][ref3],
      respectievelijk een plan als bedoeld in [artikel 39, eerste lid][ref4], is verleend voor de datum van
      inwerkingtreding van die wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel39
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 167a.2
    text: |-
      In afwijking van het eerste lid kan Onze Minister een instemming met het winningsplan geheel of gedeeltelijk
      intrekken of wijzigen na de datum van inwerkingtreding van dit artikel, indien dit wordt gerechtvaardigd door
      veranderde omstandigheden of gewijzigde inzichten om reden van het belang van:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167a
  - number: 167a.2.1°
    text: |-
      de veiligheid voor omwonenden of het voorkomen van schade aan gebouwen of infrastructurele werken of de
      functionaliteit daarvan of
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167a
  - number: 167a.2.2°
    text: |-
      het planmatig gebruik of beheer van delfstoffen, aardwarmte, andere natuurlijke rijkdommen, waaronder grondwater
      met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van stoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167a
  - number: 167a.3
    text: Indien toepassing is gegeven aan het tweede lid, geldt het eerste lid niet.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167a
  - number: 167b
    text: |-
      De wijziging van de bijlage bij deze wet bij [wet van 21 december 2016, houdende wijziging van de Mijnbouwwet
      (versterking veiligheidsbelang mijnbouw en regie opsporings-, winnings- en opslagvergunningen)](onbekend)
      (Stb. 2016, 554), heeft geen gevolgen voor de houder van een vergunning, die voor de datum van inwerkingtreding van
      die wijziging is verleend.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167b
  - number: 167d
    text: |-
      Betalingen gedaan op grond van de tussen de Staat en de houder van de winningsvergunning Groningen op 28 september
      2018 gesloten overeenkomst, die gelijk zijn aan de heffingen die de houder van de winningsvergunning Groningen
      verschuldigd is op grond van [paragrafen 5.1.1.2 tot en met 5.1.1.4][ref1] van deze wet worden gezien als
      betalingen gedaan op grond van deze paragrafen. [Afdeling 5.1.1.][ref2] van deze wet is van overeenkomstige
      toepassing op deze betalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167d
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.1.1.2
        afdeling: 5.1.1
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        afdeling: 5.1.1
  - number: 167e.1
    text: |-
      Onverminderd een op 1 januari 2003 krachtens een overgangsrechtelijke bepaling geldende verplichting tot het
      verwijderen van mijnbouwwerken of het verwijderen dan wel schoon en veilig achterlaten van kabels en pijpleidingen
      zijn de [artikelen 44][ref1] en [45][ref2] van toepassing op mijnbouwwerken, respectievelijk kabels en
      pijpleidingen, die op of na 1 januari 2003 buiten werking zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel45
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167e
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 167e.2
    text: |-
      In afwijking van [artikel 44, derde lid][ref1], kan Onze Minister gedurende vier jaar na de inwerkingtreding van
      dat artikel de termijn van een jaar, bedoeld in artikel 44, derde lid, verlengen met overeenkomstige toepassing van
      [artikel 44b, derde lid][ref2], met dien verstande dat de termijn niet verder wordt verlengd dan tot vijf jaar na
      de inwerkingtreding van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel44b
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167e
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 44b
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 167f
    text: |-
      Een aanvraag voor een opsporingsvergunning voor aardwarmte wordt met ingang van de datum van inwerkingtreding van
      [hoofdstuk 2a][ref1] beschouwd als een aanvraag voor een toewijzing zoekgebied aardwarmte. Indien over een aanvraag
      voor een opsporingsvergunning voor aardwarmte al adviezen zijn ingewonnen, worden niet opnieuw adviezen ingewonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167f
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: 2a
  - number: 167g
    text: |-
      Een opsporingsvergunning voor aardwarmte wordt met ingang van de datum van inwerkingtreding van
      [hoofdstuk 2a][ref1] beschouwd als een toewijzing zoekgebied aardwarmte. De resterende looptijd van de
      opsporingsvergunning aardwarmte wordt geacht de looptijd van de toewijzing zoekgebied aardwarmte te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167g
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: 2a
  - number: 167h.1
    text: |-
      Een aanvraag voor een winningsvergunning voor aardwarmte en een verzoek om instemming met een winningsplan door
      een houder van een opsporingsvergunning voor aardwarmte wordt met ingang van de datum van inwerkingtreding van
      [hoofdstuk 2a][ref1] beschouwd als een aanvraag om een startvergunning aardwarmte. Indien over een aanvraag voor
      een winningsvergunning voor aardwarmte en over het verzoek om instemming met een winningsplan voor aardwarmte al
      adviezen zijn ingewonnen of de procedure, bedoeld in [Afdeling 3.4. van de Algemene wet bestuursrecht][ref2] is
      gevolgd, worden niet opnieuw adviezen ingewonnen of wordt niet opnieuw de procedure, bedoeld in Afdeling 3.4 van de
      Algemene wet bestuursrecht gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167h
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: 2a
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 167h.2
    text: |-
      Het verbod om aardwarmte op te sporen zonder startvergunning aardwarmte, bedoeld in [artikel 24b][ref1], geldt niet
      voor de houder van een opsporingsvergunning voor aardwarmte, bedoeld in het eerste lid, met ingang van de datum van
      inwerkingtreding van [hoofdstuk 2a][ref2], zolang de aanvraag om een startvergunning, bedoeld in het eerste lid, in
      behandeling is.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167h
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24b
        hoofdstuk: 2a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: 2a
  - number: 167i.1
    text: |-
      Een winningsvergunning voor aardwarmte afgegeven voor 1 januari 2020 waarvoor nog geen instemming met een
      winningsplan is verleend, wordt met ingang van de datum van inwerkingtreding van [hoofdstuk 2a][ref1] beschouwd als
      een startvergunning aardwarmte.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167i
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: 2a
  - number: 167i.2
    text: |-
      Een verzoek om instemming met een winningsplan door een houder van een winningsvergunning voor aardwarmte
      afgegeven voor 1 januari 2020, wordt met ingang van de datum van inwerkingtreding van [hoofdstuk 2a][ref1]
      beschouwd als een aanvraag voor een vervolgvergunning aardwarmte. Indien over een verzoek om
      instemming met een winningsplan voor aardwarmte al adviezen zijn ingewonnen of de procedure, bedoeld in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] is gevolgd, worden niet opnieuw adviezen ingewonnen of wordt
      niet opnieuw de procedure, bedoeld in afdeling 3.4 van de Algemene wet bestuursrecht gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167i
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: 2a
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 167i.3
    text: |-
      De houder van de in het eerste lid bedoelde winningsvergunning voor aardwarmte is verplicht binnen twee jaar
      een aanvraag om een vervolgvergunning aardwarmte in te dienen. Na het verstrijken van deze termijn, vervalt de
      winningsvergunning aardwarmte. Onze Minister kan deze termijn op aanvraag van de houder van de in het eerste lid
      bedoelde winningsvergunning voor aardwarmte eenmaal met een jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167i
  - number: 167j
    text: |-
      Een winningsvergunning aardwarmte afgegeven voor 1 januari 2020 waarvoor een instemming met een winningsplan
      aardwarmte is verleend, wordt met inbegrip van de instemming met het winningsplan en de daaraan verbonden
      voorwaarden en beperkingen met ingang van de datum van inwerkingtreding van [hoofdstuk 2a][ref1] beschouwd
      als een vervolgvergunning aardwarmte. De resterende looptijd van de winningsvergunning aardwarmte, of, indien
      dat korter is, de resterende looptijd van de instemming met het winningsplan, wordt geacht de looptijd van de
      vervolgvergunning aardwarmte te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167j
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: 2a
  - number: 167k
    text: |-
      Een winningsvergunning aardwarmte afgegeven na 1 januari 2020 waarvoor een instemming met een winningsplan
      aardwarmte is verleend, wordt met inbegrip van de instemming met het winningsplan en de daaraan verbonden
      voorwaarden en beperkingen met ingang van de datum van inwerkingtreding van [hoofdstuk 2a][ref1] beschouwd als
      een startvergunning aardwarmte. De resterende looptijd van de winningsvergunning aardwarmte of, indien dat korter
      is, de resterende looptijd van de instemming met het winningsplan, wordt geacht de looptijd van de startvergunning
      aardwarmte te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167k
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: 2a
  - number: 167l
    text: |-
      Een aanvraag voor het nemen van een besluit omtrent een vergunning voor het opsporen of winnen van aardwarmte
      in het kader van het verkrijgen van gegevens voor zuiver wetenschappelijk onderzoek of voor het door de centrale
      overheid te voeren beleid als bedoeld in [artikel 24][ref1], wordt met ingang van de datum van inwerkingtreding van
      [hoofdstuk 2a][ref2] beschouwd als een aanvraag voor het nemen van een besluit omtrent een vergunning als bedoeld
      in [artikel 24c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2a
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel24c
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167l
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: 2a
      - id: ref3
        bwb_id: BWBR0014168
        artikel: 24c
        hoofdstuk: 2a
        paragraaf: '1'
  - number: 167m
    text: |-
      De Mijnbouwwet zoals die luidde onmiddellijk voor inwerkingtreding van dit [hoofdstuk 2a][ref1], blijft van
      toepassing op besluiten die zijn genomen voor inwerkingtreding van hoofdstuk 2a en die nog niet onherroepelijk
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167m
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: 2a
  - number: 167n
    text: |-
      [Artikel 86a][ref1] geldt uitsluitend voor een houder van een toewijzing zoekgebied aardwarmte, die is verleend op
      basis van [artikel 24d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel86a
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel24d
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167n
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 86a
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 24d
        hoofdstuk: 2a
        paragraaf: '2'
  - number: 167o
    text: |-
      Het bepaalde bij of krachtens paragraaf 6.2 en [artikel 139 eerste lid][ref1], zoals deze luidde voor de
      inwerkingtreding van artikel II, onderdeel H, van de Wet van 17 april 2024, houdende wijziging van de Gaswet
      en de Mijnbouwwet in verband met de beëindiging van de gaswinning uit het Groningenveld (Stb. 2024, 95), blijft
      van toepassing op adviezen die voorafgaand aan het moment van die inwerkingtreding aan de Technische commissie
      bodembeweging zijn gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel139
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167o
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '139'
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: 167p.1
    text: |-
      [Artikel 36, eerste lid, aanhef en onderdeel e][ref1], is niet van toepassing op een winningsplan dat voor de datum
      van inwerkingtreding van dat onderdeel is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel36
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167p
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 167p.2
    text: |-
      [Artikel 36, vierde en vijfde lid][ref1], is niet van toepassing op een winningsplan, een gewijzigd winningsplan
      of een geactualiseerd winningsplan dat door de houder van een winningsvergunning op grond van [artikel 34][ref2]
      bij Onze Minister is ingediend en waarmee nog niet is ingestemd voor de datum van inwerkingtreding van die
      artikelleden.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel167p
    references:
