      [ref10]: https://wetten.overheid.nl/BWBR0014168#Artikel20
      [ref11]: https://wetten.overheid.nl/BWBR0014168#Artikel21
      [ref12]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31a
