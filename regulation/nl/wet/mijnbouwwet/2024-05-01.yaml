  - number: '153.4'
    text: |-
      Aan de in het derde lid bedoelde vergunning zijn vanaf de inwerkingtreding van deze wet de voorschriften verbonden
      die voor dat tijdstip op grond van de [Wet milieubeheer][ref1] en de [Wet bodembescherming][ref2] voor dit
      ondergrondse deel golden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel153
    references:
