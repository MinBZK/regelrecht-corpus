      indien de desbetreffende winningsvergunning is verleend op grond van [artikel 10][ref2], in aansluiting op een
      opsporingsvergunning als bedoeld in [artikel 143][ref3], die een voortzetting is van een opsporingsvergunning die
      is verleend overeenkomstig het hiervoor genoemde koninklijk besluit.


