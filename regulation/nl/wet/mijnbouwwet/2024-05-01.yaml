        afdeling: '5.2'
  - number: '3.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing ten aanzien van delfstoffen die met gebruikmaking van een
      opsporingsvergunning in de vorm van monsters of formatiebeproevingen aan de ondergrond worden onttrokken.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel3
  - number: '3.4'
    text: |-
      De eigendom van stoffen die met gebruikmaking van een opslagvergunning worden teruggehaald, komt door het
      terughalen daarvan te berusten bij degene die eigenaar was van de stoffen direct voorafgaande aan het in de
      ondergrond brengen daarvan, dan wel bij degene die ten tijde van het terughalen de rechtsopvolger is van die
      eigenaar.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel3
  - number: '3.5'
    text: |-
      De staat wordt voor alle met de eigendom van delfstoffen verband houdende handelingen vertegenwoordigd door Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel3
  - number: '4'
    text: |-
      De rechthebbende ten aanzien van de oppervlakte van de aardbodem, die een gedoogplicht heeft als bedoeld in
      [artikel 10.9 van de Omgevingswet][ref1], heeft recht op een door Onze Minister vast te stellen vergoeding voor
      het gebruik van de oppervlakte van de houder van een vergunning voor het opsporen van CO-opslagcomplexen, het
      opsporen of winnen van delfstoffen of aardwarmte, dan wel het opslaan van stoffen, onverminderd het recht dat de
      rechthebbende ten aanzien van de oppervlakte heeft op vergoeding van de door deze activiteiten veroorzaakte schade,
      bedoeld in [afdeling 15.2 van de Omgevingswet][ref2]. De hoogte van de vergoeding voor het gebruik is afhankelijk
      van de impact van het mijnbouwwerk op de gebruiksrechten en waarde van de oppervlakte voor de rechthebbende ten
      aanzien van de oppervlakte.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Afdeling15.2
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0037885
        afdeling: '15.2'
  - number: 5a
    text: |-
      Onze Minister draagt zorg voor de instelling van een onafhankelijk wetenschappelijk kennisprogramma, waarin de
      inbreng van nationale en internationale wetenschappers en deskundigen is geborgd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel5a
  - number: '6'
    text: 'Het is verboden zonder vergunning van Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel6
  - number: 6.a
    text: delfstoffen op te sporen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel6
  - number: 6.b
    text: delfstoffen te winnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel6
  - number: 6a
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van een besluit inzake
      de aanvraag om een vergunning als bedoeld in [artikel 6, onderdeel a][ref2], voor het opsporen van koolwaterstoffen
      in het continentaal plat of onder de territoriale zee.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel6
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '7.1'
    text: |-
      Een vergunning wordt niet verleend, voorzover deze bij het in werking treden zou gaan gelden voor een gebied
      waarvoor op dat tijdstip reeds een door een ander gehouden vergunning voor dezelfde delfstof geldt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel7
  - number: '7.2'
    text: |-
      Een vergunning wordt evenmin verleend, voorzover deze bij het in werking treden zou gaan gelden voor een voorkomen
      waarvoor op dat tijdstip reeds een door een ander gehouden opslagvergunning geldt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel7
  - number: '7.3'
    text: |-
      Een vergunning wordt evenmin verleend, voor zover deze bij het in werking treden zou gaan gelden voor een gebied
      dat is gelegen binnen het op grond van [artikel 2.44, eerste lid, van de Omgevingswet][ref1] aangewezen Natura
      2000-gebied Waddenzee.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
  - number: '7.4'
    text: |-
      Het eerste lid blijft buiten toepassing ten aanzien van de in [artikel 11, eerste lid][ref1], bedoelde andere
      delfstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel11
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '8'
    text: |-
      Een winningsvergunning wordt slechts verleend, indien aannemelijk is dat de delfstoffen binnen het gebied waarvoor
      de vergunning zal gelden economisch winbaar zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel8
  - number: '9.1'
    text: |-
      Onverminderd de [artikelen 7][ref1] en [8][ref2] kan een vergunning slechts geheel of gedeeltelijk worden
      geweigerd:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel8
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9.1.a
    text: op grond van de technische of financiële mogelijkheden van de aanvrager,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
  - number: 9.1.b
    text: |-
      op grond van de manier waarop de aanvrager voornemens is de activiteiten voor opsporing of winning te verrichten,
      waaronder de bij die activiteiten te gebruiken technieken, hulpmiddelen of stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
  - number: 9.1.c
    text: |-
      op grond van het gebrek aan efficiëntie en verantwoordelijkheidszin, daaronder mede verstaan maatschappelijke
      verantwoordelijkheidszin, waarvan de aanvrager blijk heeft gegeven bij activiteiten als bedoeld in de
      [artikelen 6][ref1], [24b][ref2] en [25, eerste lid][ref3] onder een eerdere vergunning,


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 24b
        hoofdstuk: 2a
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 9.1.d
    text: |-
      indien een keuze moet worden gemaakt uit twee of meer aanvragen om een vergunning die bij een beoordeling op grond
      van de onderdelen a, b en c gelijkwaardig zijn gebleken, in het belang van het doelmatig en voortvarend opsporen
      en winnen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
  - number: 9.1.e
    text: 'indien:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
  - number: 9.1.e.1°
    text: |-
      bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 2.24 van de Omgevingswet][ref1]
      voor een gebied op land, respectievelijk in de territoriale zee, bedoeld in
      [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref2], regels zijn gesteld inhoudende dat
      de opsporing of winning van een delfstof door middel van een opsporings- of winningsinstallatie in dat gebied niet
      wordt of kan worden toegestaan,


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003748#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003748
        artikel: '1'
  - number: 9.1.e.2°
    text: |-
      bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 49][ref1] regels zijn gesteld over: -
      het geheel of gedeeltelijk uitsluiten van een gebied van de opsporing of winning van een delfstof,
        - de diepte waarop een activiteit plaatsvindt,
        - de soort activiteit, of
        - de soort delfstof,


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 9.1.f
    text: |-
      indien het in de aanvraag aangeduide gebied door Onze Minister niet geschikt wordt geacht voor de in de aanvraag
      vermelde activiteit om reden van het belang van:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
  - number: 9.1.f.1°
    text: |-
      de veiligheid voor omwonenden of het voorkomen van schade aan gebouwen of infrastructurele werken of de
      functionaliteit daarvan, voor zover het winnen van delfstoffen niet geschiedt in het continentaal plat,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
  - number: 9.1.f.2°
    text: |-
      het planmatig gebruik of beheer van delfstoffen, andere natuurlijke rijkdommen, waaronder grondwater met het oog op
      de winning van drinkwater, of mogelijkheden tot het opslaan van stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
  - number: 9.1.f.3°
    text: nadelige gevolgen die voor het milieu worden veroorzaakt, of
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
  - number: 9.1.f.4°
    text: nadelige gevolgen die voor de natuur worden veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
  - number: '9.2'
    text: |-
      Een vergunning kan op grond van de financiële mogelijkheden van de aanvrager worden geweigerd als onvoldoende
      verzekerd is dat de aanvrager zal voldoen aan hem op te leggen verplichtingen als bedoeld in de artikelen
      [46][ref1], [47][ref2] en [102][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel102
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '102'
        hoofdstuk: '5'
        afdeling: '5.4'
  - number: '9.3'
    text: |-
      Met het oog op de toepassing van het eerste en tweede lid kunnen bij ministeriële regeling nadere regels worden
      gesteld die bij de beslissing op een aanvraag om een vergunning in acht worden genomen. Zodanige regels worden in
      elk geval gesteld met betrekking tot opsporings- en winningsvergunningen voor koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
  - number: '9.4'
    text: |-
      Van de plaatsing in de Staatscourant van een regeling als bedoeld in de tweede volzin van het derde lid wordt
      mededeling gedaan in het Publicatieblad van de Europese Unie. Van een besluit tot wijziging van zodanige regeling
      wordt eveneens mededeling gedaan in het Publicatieblad van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9
  - number: 9a.1
    text: |-
      In aanvulling op [artikel 9, eerste lid, onder a][ref1], wordt bij een aanvraag voor een opsporings- of
      winningsvergunning voor koolwaterstoffen bij de beoordeling van de technische of financiële mogelijkheden van de
      aanvrager rekening gehouden met:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel9
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9a.1.a
    text: het risico, de gevaren en andere relevante informatie over het gebied waarvoor de vergunning zal gaan gelden;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9a
  - number: 9a.1.b
    text: |-
      de financiële draagkracht van de aanvrager om alle eventueel uit de desbetreffende opsporings- en
      winningsactiviteiten voortvloeiende aansprakelijkheden te dragen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9a
  - number: 9a.1.c
    text: |-
      de beschikbare informatie betreffende de technische bekwaamheden en de veiligheids- en milieuprestaties van de
      aanvrager.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9a
  - number: 9a.2
    text: |-
      Bij een aanvraag voor een opsporings- of winningsvergunning voor koolwaterstoffen in het continentaal plat of onder
      de territoriale zee wordt bij de beoordeling van de technische of financiële mogelijkheden van de aanvrager, tevens
      rekening gehouden met de kosten van aantasting van het mariene milieu als bedoeld in artikel 8, eerste lid, onder
      c, van richtlijn 2008/56/EG;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9a
  - number: 9a.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de informatie met betrekking tot de veiligheids- en
      milieuprestatie van de aanvrager, die bij de beoordeling van diens technische en financiële mogelijkheden,
      meegenomen wordt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel9a
  - number: '10.1'
    text: |-
      Onverminderd de [artikelen 7][ref1] en [8][ref2] wordt de houder van een opsporingsvergunning die met
      gebruikmaking van die vergunning de aanwezigheid van de betrokken delfstoffen heeft aangetoond, op zijn aanvraag,
      ingediend gedurende de geldingsduur van die vergunning, een winningsvergunning voor die delfstoffen verleend voor
      het gebied waarvoor de opsporingsvergunning geldt. Indien de opsporingsvergunning geldt voor een gebied dat niet
      overeenkomstig [artikel 11, vijfde lid][ref3], is begrensd en de aanwezigheid van de betrokken delfstoffen slechts
      in een deel van het gebied is aangetoond, wordt de winningsvergunning verleend voor het deel van het gebied,
      waarvoor verlening uit geologisch oogpunt gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel11
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '10.2'
    text: |-
      Het eerste lid geldt niet, indien weigering van de winningsvergunning gerechtvaardigd wordt door een van de in
      [artikel 9, eerste lid, onderdelen a tot en met c, e en f][ref1], genoemde gronden. Artikel 9, tweede, derde en
      vierde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel9
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '10.3'
    text: |-
      Indien een aanvraag als bedoeld in het eerste lid is ingediend, blijft de opsporingsvergunning, voorzover deze
      betrekking heeft op het aangevraagde gebied, tenminste gelden tot het tijdstip waarop de beschikking waarbij
      op de aanvraag wordt beslist onherroepelijk wordt. Indien een winningsvergunning wordt verleend, vervalt
      op het tijdstip waarop de beschikking onherroepelijk wordt, voor het gebied waarvoor de winningsvergunning
      geldt, de opsporingsvergunning voor de betrokken delfstoffen. Voorzover hierdoor voorschriften als bedoeld in
      [artikel 12][ref1] vervallen die nog niet zijn uitgewerkt, gaan zij gelden als voorschriften die zijn verbonden aan
      de winningsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel12
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '11.1'
    text: |-
      In een vergunning wordt bepaald voor welke in [artikel 6][ref1] bedoelde activiteiten en voor welke delfstoffen
      zij geldt. Indien in een winningsvergunning is opgenomen dat zij geldt voor bepaalde delfstoffen, geldt zij tevens
      voor andere delfstoffen die onvermijdelijk meekomen en aardwarmte die onvermijdelijk meekomt met de winning van die
      bepaalde delfstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '11.2'
    text: |-
      In een vergunning wordt bepaald voor welk tijdvak zij geldt. Dit geschiedt zodanig dat het tijdvak niet langer is
      dan noodzakelijk om de activiteiten, waarvoor de vergunning wordt verleend, te verrichten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel11
  - number: '11.3'
    text: |-
      In een vergunning wordt bepaald voor welk gebied zij geldt. Ten behoeve van de afbakening van het gebied wordt de
      begrenzing aan de oppervlakte aangegeven. Tenzij de vergunning anders bepaalt, wordt het gebied gevormd door het
      aangegeven oppervlak en de ondergrond daarvan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel11
  - number: '11.4'
    text: |-
      De afbakening van het gebied geschiedt zodanig dat de uitoefening van de activiteiten uit technisch en economisch
      oogpunt op zo goed mogelijke wijze kan plaatsvinden. Bij ministeriële regeling worden nadere regels gesteld
      met het oog op de toepassing van de vorige volzin met betrekking tot een opsporings- of winningsvergunning voor
      koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel11
  - number: '11.5'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat een opsporingsvergunning voor daarbij aangegeven delfstoffen
      slechts kan worden verleend voor een gebied, waarvan de begrenzing een gevolg is van een voorafgaande geometrische
      verdeling van het gebied waarvoor deze wet geldt of van een deel daarvan. In dat geval is het vierde lid niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel11
  - number: '12.1'
    text: |-
      In een opsporingsvergunning wordt bepaald binnen welke tijdvakken nadat de vergunning onherroepelijk is geworden,
      de in de vergunning aangegeven opsporingsactiviteiten dienen te worden verricht. In de vergunning kan tevens worden
      bepaald binnen welke tijdvakken nadat de vergunning onherroepelijk is geworden, de in de vergunning aangegeven
      verkenningsonderzoeken dienen te worden verricht.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel12
  - number: '12.2'
    text: |-
      In een vergunning voor opsporing en winning van koolwaterstoffen wordt de omvang van de middelen bepaald die de
      houder van de vergunning verplicht is aan te houden om te voldoen aan financiële verplichtingen die voort kunnen
      vloeien uit aansprakelijkheden voor schade door zware ongevallen met mijnbouwwerken.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel12
  - number: '13'
    text: |-
      Een vergunning kan onder andere beperkingen dan die bedoeld in [artikel 11][ref1] worden verleend of aan een
      vergunning kunnen andere voorschriften dan die bedoeld in de [artikelen 12][ref2] en [98][ref3] worden verbonden
      uitsluitend in verband met:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel98
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '98'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: 13.a
    text: |-
      de manier waarop de aanvrager voornemens is de activiteiten voor opsporing of winning te verrichten, waaronder de
      bij die activiteiten te gebruiken technieken, hulpmiddelen of stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel13
  - number: 13.b
    text: |-
      bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 2.24 van de Omgevingswet][ref1]
      voor gebieden op land, respectievelijk in de territoriale zee, bedoeld in
      [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref2], gestelde regels over de opsporing
      of winning van een delfstof door middel van een opsporings- of winningsinstallatie,


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003748#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003748
        artikel: '1'
  - number: 13.c
    text: |-
      bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 49][ref1] gestelde regels over:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 13.c.1°
    text: het geheel of gedeeltelijk uitsluiten van een gebied van de opsporing of winning van een delfstof,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel13
  - number: 13.c.2°
    text: de diepte waarop een activiteit plaatsvindt,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel13
  - number: 13.c.3°
    text: de soort activiteit, of
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel13
  - number: 13.c.4°
    text: de soort delfstof,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel13
  - number: 13.d
    text: |-
      de veiligheid voor omwonenden of het voorkomen van schade aan gebouwen of infrastructurele werken of de
      functionaliteit daarvan,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel13
  - number: 13.e
    text: |-
      het planmatig gebruik of beheer van delfstoffen, andere natuurlijke rijkdommen, waaronder grondwater met het oog op
      de winning van drinkwater, of mogelijkheden tot opslaan van stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel13
  - number: 13.f
    text: de nadelige gevolgen die voor het milieu worden veroorzaakt,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel13
  - number: 13.g
    text: de nadelige gevolgen die voor de natuur worden veroorzaakt, of
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel13
  - number: 13.h
    text: het belang van de landsverdediging.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel13
  - number: '14'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop de aanvraag om een vergunning dient te
      geschieden en omtrent de gegevens en de bescheiden, welke daarbij moeten worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel14
  - number: '15.1'
    text: |-
      Zodra een aanvraag om een vergunning is ingediend, worden anderen in de gelegenheid gesteld om aanvragen om een
      soortgelijke vergunning in te dienen voor dezelfde delfstof voor hetzelfde gebied.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel15
  - number: '15.2'
    text: |-
      Onze Minister plaatst hiertoe een uitnodiging in de Staatscourant. De uitnodiging maakt melding van het bepaalde in
      [artikel 17][ref1]. Indien het een aanvraag om een opsporings- of winningsvergunning voor koolwaterstoffen betreft,
      wordt de uitnodiging tevens geplaatst in het Publicatieblad van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel17
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '15.3'
    text: |-
      Anderen kunnen aanvragen indienen tot dertien weken na de dag van plaatsing van de uitnodiging in de Staatscourant
      of, ingeval het koolwaterstoffen betreft, het Publicatieblad van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel15
  - number: '15.4'
    text: 'De procedure, bedoeld in het eerste tot en met het derde lid, wordt niet toegepast met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel15
  - number: 15.4.a
    text: |-
      een aanvraag om een winningsvergunning als bedoeld in [artikel 10, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel10
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 15.4.b
    text: |-
      een aanvraag om een winningsvergunning die wordt ingediend door de houder van een opsporings- of winningsvergunning
      naar aanleiding van de aantoning van een voorkomen, waarvan aannemelijk is dat het zich gedeeltelijk in zijn gebied
      en gedeeltelijk in het aangevraagde aangrenzende gebied bevindt;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel15
  - number: 15.4.c
    text: |-
      een aanvraag voor een gebied, waarvoor op grond van [artikel 7][ref1] geen vergunning wordt verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel7
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 15.4.d
    text: een aanvraag die wordt ingediend overeenkomstig het derde lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel15
  - number: '15.5'
    text: |-
      In het geval, bedoeld in het vierde lid, onderdeel b, stelt Onze Minister anderen die ten tijde van de in dat
      onderdeel bedoelde indiening houder zijn van een opsporings- of winningsvergunning voor dezelfde delfstof, voor
      gebieden die grenzen aan het in dat onderdeel bedoelde aangevraagde aangrenzende gebied, in de gelegenheid om
      tot dertien weken na die indiening een aanvraag om een winningsvergunning voor die delfstof voor dat gebied in
      te dienen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel15
  - number: '16.1'
    text: |-
      Gedeputeerde staten van de provincie waarop de aanvraag voor een vergunning betrekking heeft worden in de
      gelegenheid gesteld binnen een door Onze Minister te stellen redelijke termijn advies uit te brengen over de
      ingediende aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel16
  - number: '16.2'
    text: 'Gedeputeerde staten betrekken bij het advies:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel16
  - number: 16.2.a
    text: het college van burgemeester en wethouders van de gemeenten van het gebied waarop de aanvraag betrekking heeft en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel16
  - number: 16.2.b
    text: |-
      het dagelijks bestuur van de waterschappen van het gebied waarop de aanvraag betrekking heeft met het oog op
      waterkwaliteit, waterkwantiteit en infrastructurele werken.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister beslist op een aanvraag om een vergunning binnen zes maanden na de ontvangst daarvan. Indien artikel
      15, eerste of vijfde lid, toepassing heeft gevonden, beslist Onze Minister op alle aanvragen binnen zes maanden na
      afloop van de termijn, bedoeld in [artikel 15, derde, onderscheidenlijk vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel15
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '17.2'
    text: |-
      Onze Minister kan de termijn, waarbinnen hij op een aanvraag beslist, eenmaal met ten hoogste zes maanden
      verlengen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel17
  - number: '17.3'
    text: |-
      In afwijking van het tweede lid kan Onze Minister de termijn, waarbinnen hij op een aanvraag beslist, tweemaal met
      ten hoogste een jaar verlengen indien de aanvraag betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel17
  - number: 17.3.a
    text: |-
      een gebied waarvoor in verband met milieubelastende activiteiten met betrekking tot een
      mijnbouwwerk of een mijnbouwlocatieactiviteit een aanvang is gemaakt met de vaststelling van
      een omgevingsvisie als bedoeld in [artikel 3.1, derde lid, van de Omgevingswet][ref1], een
      instructieregel als bedoeld in [artikel 2.24 van de Omgevingswet][ref2], een instructie als
      bedoeld in [artikel 2.34, eerste lid, van de Omgevingswet][ref3] of een programma als bedoeld in
      [afdeling 3.2 van de Omgevingswet][ref4] voor gebieden op land, respectievelijk in de territoriale zee, bedoeld in
      [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref5], of


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Afdeling3.2
      [ref5]: https://wetten.overheid.nl/BWBR0003748#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0037885
        afdeling: '3.2'
      - id: ref5
        bwb_id: BWBR0003748
        artikel: '1'
  - number: 17.3.b
    text: |-
      een gebied op land, respectievelijk in de territoriale zee, bedoeld in
      [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref1], waarvoor in een ontwerp van een
      algemene maatregel van bestuur als bedoeld in [artikel 2.24 van de Omgevingswet][ref2] regels zijn gesteld in
      verband met de opsporing of winning van een delfstof door middel van een opsporings- of winningsinstallatie en
      nationale belangen die regels met het oog op de fysieke leefomgeving noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0003748#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003748
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '2'
  - number: '17.4'
    text: Van een beschikking tot verlening van een vergunning wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel17
  - number: '18.1'
    text: |-
      Onverminderd [artikel 32c][ref1] kan Onze Minister een vergunning slechts wijzigen:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel32c
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 32c
        hoofdstuk: 3a
  - number: 18.1.a
    text: op aanvraag van de houder van de vergunning,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
  - number: 18.1.b
    text: |-
      in verband met veranderde omstandigheden of gewijzigde inzichten inzake de manier waarop de aanvrager de
      activiteiten voor opsporing of winning verricht of voornemens is te verrichten, waaronder de bij die activiteiten
      te gebruiken technieken, hulpmiddelen of stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
  - number: 18.1.c
    text: |-
      in verband met een vaststelling of wijziging van bij of krachtens een algemene maatregel van bestuur als bedoeld
      in [artikel 2.24 van de Omgevingswet][ref1] voor een gebied op land, respectievelijk in de territoriale zee,
      bedoeld in [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref2], gestelde regels over de
      opsporing of winning van een delfstof door middel van een opsporings- of winningsinstallatie,


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003748#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003748
        artikel: '1'
  - number: 18.1.d
    text: |-
      in verband met een vaststelling of wijziging van bij of krachtens een algemene maatregel van bestuur als bedoeld in
      [artikel 49][ref1] gestelde regels over:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 18.1.d.1°
    text: het geheel of gedeeltelijk uitsluiten van een gebied van de opsporing of winning van een delfstof,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
  - number: 18.1.d.2°
    text: de diepte waarop een activiteit plaatsvindt,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
  - number: 18.1.d.3°
    text: de soort activiteit,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
  - number: 18.1.d.4°
    text: de soort delfstof,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
  - number: 18.1.e
    text: |-
      in verband met veranderde omstandigheden of gewijzigde inzichten inzake de veiligheid voor omwonenden of het
      voorkomen van schade aan gebouwen of infrastructurele werken of de functionaliteit daarvan,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
  - number: 18.1.f
    text: |-
      in verband met veranderde omstandigheden of gewijzigde inzichten inzake het planmatig gebruik of beheer van
      delfstoffen, andere natuurlijke rijkdommen, waaronder grondwater met het oog op de winning van drinkwater, of
      mogelijkheden tot het opslaan van stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
  - number: 18.1.g
    text: |-
      voor zover de vergunning geldt voor de op grond van [artikel 1.1, eerste lid, van de Wet natuurbescherming][ref1]
      aangewezen Natura 2000-gebieden Waddenzee en Noordzeekustzone,


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
  - number: 18.1.h
    text: |-
      voor zover de vergunning geldt voor een gebied gelegen binnen de Waddenzee als aangewezen krachtens de
      [Omgevingswet][ref1] of op de Waddeneilanden, of


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 18.1.i
    text: |-
      voor zover de vergunning geldt voor het op grond van de Overeenkomst inzake de bescherming van het cultureel en
      natuurlijk erfgoed van de wereld (Trb. 1973, 155) aangewezen werelderfgoedgebied Waddenzee.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
  - number: '18.2'
    text: 'Een vergunning kan niet zodanig worden gewijzigd dat zij komt te gelden voor:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
  - number: 18.2.a
    text: andere activiteiten of andere delfstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
  - number: 18.2.b
    text: een groter gebied.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
  - number: '18.3'
    text: |-
      Een aanvraag om verlenging van het tijdvak waarvoor een vergunning geldt wordt slechts ingewilligd, indien het in
      de vergunning vastgestelde tijdvak onvoldoende is om de activiteiten, waarvoor de vergunning geldt, te voltooien
      en deze activiteiten zijn verricht in overeenstemming met de vergunning. In een beschikking, waarbij het tijdvak
      waarvoor een vergunning geldt wordt verlengd, kan het gebied waarvoor die vergunning geldt worden beperkt tot een
      deel van het gebied. [Artikel 11, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel11
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '18.4'
    text: |-
      In afwijking van het derde lid wordt een aanvraag om verlenging van het tijdvak waarvoor een vergunning
      geldt afgewezen indien de vergunning geldt voor een gebied dat is gelegen binnen het op grond van
      [artikel 2.44, eerste lid, van de Omgevingswet][ref1] aangewezen Natura 2000-gebied Waddenzee.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
  - number: '18.5'
    text: |-
      Een aanvraag om verkleining van het gebied waarvoor een vergunning geldt, wordt slechts ingewilligd met
      inachtneming van [artikel 11, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel11
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '18.6'
    text: Van een beschikking tot wijziging van een vergunning wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel18
  - number: '19'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel19
  - number: 19.a
    text: het splitsen van een vergunning, waardoor twee of meer vergunningen voor twee of meer gebieden ontstaan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel19
  - number: 19.b
    text: het samenvoegen van twee of meer vergunningen, waardoor een vergunning voor een gebied ontstaat.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel19
  - number: '20.1'
    text: |-
      De houder van een vergunning kan zijn vergunning slechts met schriftelijke toestemming van Onze Minister op een
      ander doen overgaan. [Artikel 7, tweede lid][ref1], en [artikel 9][ref2], met uitzondering van het eerste lid,
      onderdeel d, zijn van overeenkomstige toepassing. Aan een toestemming kunnen voorschriften worden verbonden. Een
      toestemming kan onder beperkingen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel9
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '20.2'
    text: |-
      Indien de houder van een vergunning een deel van zijn vergunning op een ander wil doen overgaan, dient hij tevens
      een aanvraag in om splitsing van de vergunning als bedoeld in [artikel 19, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel19
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '20.3'
    text: Van een beschikking tot verlening van toestemming wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel20
  - number: '20.4'
    text: |-
      [Paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref1] is van toepassing op de schriftelijke toestemming,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '21.1'
    text: 'Onze Minister kan een vergunning slechts geheel of gedeeltelijk intrekken:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.1.a
    text: |-
      indien de bij de aanvraag verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op de
      aanvraag een andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig
      bekend waren geweest,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.1.b
    text: indien de vergunning niet langer nodig is voor de goede uitvoering van de activiteiten waarvoor zij geldt,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.1.c
    text: indien dit wordt gerechtvaardigd door een wijziging in de technische of financiële mogelijkheden van de houder,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.1.d
    text: indien niet overeenkomstig de vergunning is of wordt gehandeld,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.1.e
    text: |-
      indien voor de houder van de vergunning of de in [artikel 22][ref1] bedoelde aangewezen persoon als zodanig
      geldende regels niet worden nageleefd,


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 21.1.f
    text: |-
      in verband met veranderde omstandigheden of gewijzigde inzichten inzake de manier waarop de aanvrager de
      activiteiten voor opsporing of winning verricht of voornemens is te verrichten, waaronder de bij die activiteiten
      te gebruiken technieken, hulpmiddelen of stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.1.g
    text: |-
      in verband met een vaststelling of wijziging van bij of krachtens een algemene maatregel van bestuur als bedoeld in
      [artikel 2.24 van de Omgevingswet][ref1] voor een gebied op land, respectievelijk in de territoriale zee, bedoeld
      in [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref2], gestelde regels inhoudende dat
      de opsporing of winning van een delfstof door middel van een opsporings- of winningsinstallatie in dat gebied niet
      wordt of kan worden toegestaan,


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003748#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003748
        artikel: '1'
  - number: 21.1.h
    text: |-
      in verband met een vaststelling of wijziging van bij of krachtens een algemene maatregel van bestuur als bedoeld in
      [artikel 49][ref1] gestelde regels over:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 21.1.h.1°
    text: het geheel of gedeeltelijk uitsluiten van een gebied van de opsporing of winning van een delfstof,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.1.h.2°
    text: de diepte waarop een activiteit plaatsvindt,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.1.h.3°
    text: de soort activiteit, of
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.1.h.4°
    text: de soort delfstof,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.1.i
    text: |-
      in verband met veranderde omstandigheden of gewijzigde inzichten inzake de veiligheid voor omwonenden of het
      voorkomen van schade aan gebouwen of infrastructurele werken of de functionaliteit daarvan,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.1.j
    text: |-
      in verband met veranderde omstandigheden of gewijzigde inzichten inzake het planmatig gebruik of beheer van
      delfstoffen, andere natuurlijke rijkdommen, waaronder grondwater met het oog op de winning van drinkwater, of
      mogelijkheden tot het opslaan van stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.1.k
    text: |-
      voor zover de vergunning geldt voor de op grond van [artikel 1.1, eerste lid, van de Wet natuurbescherming][ref1]
      aangewezen Natura 2000-gebieden Waddenzee en Noordzeekustzone,


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
  - number: 21.1.l
    text: |-
      voor zover de vergunning geldt voor een gebied gelegen binnen de Waddenzee als aangewezen krachtens de
      [Omgevingswet][ref1] of op de Waddeneilanden, of


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 21.1.m
    text: |-
      voor zover de vergunning geldt voor het op grond van de Overeenkomst inzake de bescherming van het cultureel en
      natuurlijk erfgoed van de wereld (Trb. 1973, 155) aangewezen werelderfgoedgebied Waddenzee.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: '21.2'
    text: |-
      Onze Minister gaat niet over tot gehele of gedeeltelijke intrekking op grond van het eerste lid, onderdeel d
      of e, dan nadat hij de houder schriftelijk heeft gewaarschuwd en de houder of de in [artikel 22][ref1] bedoelde
      aangewezen persoon zich na de waarschuwing voortdurend of opnieuw aan de overtreding schuldig maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '21.3'
    text: |-
      Onze Minister kan een winningsvergunning op aanvraag van de houder geheel of gedeeltelijk intrekken. Een aanvraag
      tot gehele of gedeeltelijke intrekking kan slechts worden afgewezen, indien het noodzakelijk is dat de houder een
      aan de vergunning verbonden voorschrift of een voor hem als zodanig geldende regel naleeft.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: '21.4'
    text: |-
      De houder van een opsporingsvergunning kan met een schriftelijke verklaring aan Onze Minister afstand doen van de
      vergunning met dien verstande dat de vergunning niet eerder vervalt dan met ingang van de dag nadat:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.4.a
    text: Onze Minister de verklaring heeft ontvangen en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.4.b
    text: |-
      de houder van de vergunning een aan de vergunning verbonden voorschrift of een voor hem als zodanig geldende regel
      heeft nageleefd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: '21.5'
    text: 'De vergunning vervalt van rechtswege:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.5.a
    text: als de houder een natuurlijke persoon is, met ingang van de dag na die waarop die persoon is overleden;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: 21.5.b
    text: als de houder een rechtspersoon is, met ingang van de dag na die waarop die persoon heeft opgehouden te bestaan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: '21.6'
    text: |-
      Van een beschikking tot gehele of gedeeltelijke intrekking van een vergunning of van het vervallen van een
      vergunning wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel21
  - number: '22.1'
    text: |-
      Dit artikel is van toepassing op het houden van een vergunning door meer dan een natuurlijke persoon of
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel22
  - number: '22.2'
    text: |-
      Bij de aanvraag om een vergunning worden de personen gezamenlijk als aanvrager van de vergunning beschouwd. Na
      verlening worden zij gezamenlijk als houder van de vergunning beschouwd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel22
  - number: '22.3'
    text: |-
      [Artikel 20][ref1] is van overeenkomstige toepassing als een van de personen zijn aandeel in de vergunning op een
      ander wil doen overgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel20
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '22.4'
    text: |-
      In afwijking van [artikel 21, vijfde lid][ref1], vervalt de vergunning niet als één van de houders die een
      natuurlijke persoon is, overlijdt dan wel één van de houders die een rechtspersoon is, ophoudt te bestaan, maar
      gaat diens aandeel in de vergunning over op de medehouders.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel21
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '22.5'
    text: |-
      Een van de personen wordt aangewezen om de feitelijke werkzaamheden te verrichten of daartoe opdracht te verlenen.
      Het verrichten van de feitelijke werkzaamheden of het verlenen van opdracht daartoe is slechts aan de aangewezen
      persoon toegestaan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel22
  - number: '22.6'
    text: De aanwijzing geschiedt voor de eerste maal in de vergunning.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel22
  - number: '22.7'
    text: |-
      De houder van de vergunning kan uit zijn midden een andere persoon aanwijzen, nadat hij daartoe van Onze Minister
      schriftelijk toestemming heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel22
  - number: '22.8'
    text: |-
      Indien de aangewezen persoon niet meer in staat is tot het verrichten van de feitelijke werkzaamheden of het
      verlenen van opdracht daartoe, trekt Onze Minister de aanwijzing in. Indien geen van de personen is aangewezen,
      wijst Onze Minister een van hen aan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel22
  - number: '22.9'
    text: |-
      Onze Minister neemt de besluiten die verband houden met de aanwijzing op basis van
      de in [artikel 9, eerste lid, onderdelen a tot en met c][ref1], genoemde gronden.
      [Artikel 9, tweede, derde en vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel9
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '23.1'
    text: |-
      De houder van een winningsvergunning voor koolwaterstoffen gaat niet over tot het winnen uit een voorkomen dat
      naar redelijkerwijs kan worden aangenomen de grens van het vergunningsgebied overschrijdt, zolang geen overeenkomst
      van kracht is als bedoeld in [artikel 42, tweede lid][ref1], tenzij Onze Minister ontheffing heeft verleend van de
      verplichting om een overeenkomst te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel42
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '23.2'
    text: |-
      Indien tijdens of na het winnen van koolwaterstoffen blijkt of is gebleken dat het desbetreffende voorkomen de
      grens van het vergunningsgebied overschrijdt, is de vergunninghouder, bedoeld in het eerste lid, verplicht terstond
      na het bekend worden van dat feit de voor het aangrenzende gebied tot het winnen van de delfstoffen gerechtigde
      daarvan in kennis te stellen en medewerking te verlenen aan de totstandkoming van een overeenkomst als bedoeld in
      [artikel 42, tweede lid, eerste volzin][ref1]. Artikel 42, tweede lid, tweede tot en met vierde volzin, zijn van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel42
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '24'
    text: |-
      Dit hoofdstuk, met uitzondering van [artikel 6](onbekend), is niet van toepassing op het opsporen of het winnen van
      delfstoffen in het kader van het verkrijgen van gegevens voor zuiver wetenschappelijk onderzoek of voor het door
      de centrale overheid te voeren beleid. Bij het nemen van een besluit omtrent een vergunning voor deze activiteiten
      sluit Onze Minister aan bij de bepalingen van dit hoofdstuk, voorzover dit met het bijzondere karakter van de
      vergunning te verenigen is.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24
  - number: 24a
    text: |-
      In aanvulling op [artikel 17.16, eerste lid, van de Wet milieubeheer][ref1], draagt ook de houder van een
      vergunning voor de opsporing of winning van koolwaterstoffen in het continentaal plat of onder de territoriale zee,
      de kosten voor de maatregelen genoemd in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
  - number: 24b
    text: |-
      Het is verboden zonder een startvergunning aardwarmte of een vervolgvergunning aardwarmte, aardwarmte op te sporen
      of te winnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24b
  - number: 24c.1
    text: |-
      Dit hoofdstuk, met uitzondering van [artikel 24b][ref1], is niet van toepassing op het opsporen of het winnen van
      aardwarmte in het kader van het verkrijgen van gegevens voor zuiver wetenschappelijk onderzoek of voor het door
      de centrale overheid te voeren beleid. Bij het nemen van een besluit omtrent een vergunning voor deze activiteiten
      sluit Onze Minister aan bij de bepalingen van dit hoofdstuk, voor zover dit met het bijzondere karakter van de
      vergunning te verenigen is.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24b
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24b
        hoofdstuk: 2a
        paragraaf: '1'
  - number: 24c.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het nemen van een besluit omtrent
      een vergunning, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24c
  - number: 24d
    text: Onze Minister verleent op aanvraag een toewijzing zoekgebied aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24d
  - number: 24e.1
    text: 'Een aanvraag om een toewijzing zoekgebied aardwarmte bevat een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24e
  - number: 24e.1.a
    text: de aardlagen en de begrenzing ervan waar de aanvraag betrekking op heeft;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24e
  - number: 24e.1.b
    text: |-
      de andere gebruiksmogelijkheden van het gebied, waaronder grondwater met het oog op de winning van drinkwater en
      kenbare mogelijkheden tot het opslaan van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24e
  - number: 24e.1.c
    text: een plan voor de wijze waarop de aanvrager voornemens is de aardwarmte op te sporen en te winnen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24e
  - number: 24e.1.d
    text: de voorgenomen afzet van warmte en de afspraken hieromtrent;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24e
  - number: 24e.1.e
    text: de ervaring van de aanvrager met de ontwikkeling van aardwarmteprojecten en andere mijnbouwactiviteiten;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24e
  - number: 24e.1.f
    text: de wijze waarop de aanvrager voornemens is de opsporing en winning van aardwarmte te financieren.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24e
  - number: 24e.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24e
  - number: 24f.1
    text: |-
      Zodra voor een toewijzing zoekgebied aardwarmte een aanvraag is ingediend die voldoet aan het bepaalde bij of
      krachtens [artikel 24e][ref1] en deze aanvraag betrekking heeft op een zoekgebied dat beschikbaar is voor een
      toewijzing zoekgebied aardwarmte, stelt Onze Minister met een uitnodiging in de Staatscourant anderen in de
      gelegenheid om voor hetzelfde zoekgebied of een deel hiervan een aanvraag in te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24e
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24f
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24e
        hoofdstuk: 2a
        paragraaf: '2'
  - number: 24f.2
    text: |-
      Anderen kunnen een aanvraag voor een toewijzing zoekgebied aardwarmte indienen tot twaalf weken na de dag van
      plaatsing van de uitnodiging in de Staatscourant. Indien deze aanvragen gedeeltelijk betrekking hebben op een nieuw
      zoekgebied voor aardwarmte ten opzichte van het in de Staatscourant gepubliceerde zoekgebied aardwarmte, geldt
      voor dat deel van de aanvraag de procedure van het eerste lid en wordt dat deel van de aanvraag geacht een nieuwe
      aanvraag te zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24f
  - number: 24f.3
    text: |-
      Onze Minister stelt de aanvragers van alle ingediende aanvragen op de hoogte. De aanvragers voeren overleg over de
      mogelijkheden tot samenwerking dan wel aanpassing van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24f
  - number: 24f.4
    text: |-
      Gedurende acht weken na het op de hoogte stellen van de aanvragers, bedoeld in het derde lid, heeft een aanvrager
      de mogelijkheid zijn aanvraag te wijzigen of in te trekken.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24f
  - number: 24g.1
    text: |-
      Over de aanvragen die aan het bepaalde bij of krachtens [artikel 24e][ref1] voldoen stelt Onze Minister
      gedeputeerde staten van de provincies en het college van burgemeester en wethouders van de gemeenten binnen wier
      grondgebied het zoekgebied waarop de aanvraag voor een toewijzing zoekgebied aardwarmte betrekking heeft, in
      de gelegenheid binnen acht weken advies uit te brengen met het oog op de planmatige ontwikkeling of het beheer
      van delfstoffen, aardwarmte, andere natuurlijke rijkdommen, waaronder grondwater met het oog op de winning van
      drinkwater, of mogelijkheden tot het opslaan van stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24e
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24g
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24e
        hoofdstuk: 2a
        paragraaf: '2'
  - number: 24g.2
    text: |-
      Over de aanvragen die aan het bepaalde bij of krachtens [artikel 24e][ref1] voldoen stelt Onze Minister
      gedeputeerde staten van de provincies en het dagelijks bestuur van waterschappen binnen wier grondgebied het
      zoekgebied waarop de aanvraag voor een toewijzing zoekgebied aardwarmte betrekking heeft, in de gelegenheid binnen
      acht weken advies uit te brengen met het oog op grondwaterkwaliteit en -kwantiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24e
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24g
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24e
        hoofdstuk: 2a
        paragraaf: '2'
  - number: 24h.1
    text: |-
      Onze Minister beslist op een aanvraag om een toewijzing zoekgebied aardwarmte binnen achttien weken na ontvangst
      van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24h
  - number: 24h.2
    text: |-
      Als ingevolge [artikel 24f, tweede lid][ref1], een aanvraag wordt ingediend, beslist Onze Minister binnen zes weken
      na afloop van de termijn, bedoeld in artikel 24f, vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24f
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24h
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24f
        hoofdstuk: 2a
        paragraaf: '2'
  - number: 24h.3
    text: Onze Minister kan de termijn, bedoeld in het eerste en tweede lid, eenmaal met ten hoogste vier weken verlengen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24h
  - number: 24h.4
    text: |-
      Van een beschikking tot verlening van een toewijzing zoekgebied aardwarmte wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24h
  - number: 24i.1
    text: 'Een aanvraag om een toewijzing zoekgebied aardwarmte wordt geheel of gedeeltelijk afgewezen indien:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24i
  - number: 24i.1.a
    text: |-
      het opsporen of winnen van aardwarmte in de in de aanvraag aangegeven aardlagen en de begrenzing ervan bij of
      krachtens wet niet is toegestaan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24i
  - number: 24i.1.b
    text: |-
      voor het zoekgebied al een toewijzing zoekgebied aardwarmte, een startvergunning aardwarmte of een
      vervolgvergunning aardwarmte geldt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24i
  - number: 24i.2
    text: 'Een aanvraag om een toewijzing zoekgebied aardwarmte kan geheel of gedeeltelijk worden afgewezen:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24i
  - number: 24i.2.a
    text: |-
      in het belang van de planmatige ontwikkeling of het beheer van delfstoffen, aardwarmte, andere natuurlijke
      rijkdommen, waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van
      stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24i
  - number: 24i.2.b
    text: |-
      indien het plan of de uitvoering ervan voor de wijze van opsporen en winnen van aardwarmte niet haalbaar wordt
      geacht;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24i
  - number: 24i.2.c
    text: indien er onvoldoende zicht is op een warmtevraag die passend is bij de te verwachten winning van aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24i
  - number: 24i.2.d
    text: indien het zoekgebied niet passend is bij de te verwachten warmtevraag;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24i
  - number: 24i.2.e
    text: indien onvoldoende zicht is op de financiering van de opsporing en winning van aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24i
  - number: 24i.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de gronden, bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24i
  - number: 24j.1
    text: |-
      Indien er meer aanvragen om een toewijzing zoekgebied aardwarmte zijn ingediend die toegewezen zouden kunnen
      worden, verleent Onze Minister de toewijzing zoekgebied aardwarmte aan de aanvrager van wie de aanvraag het hoogst
      is gerangschikt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24j
  - number: 24j.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de procedure van rangschikking, de
      rangschikkingscriteria en de onderlinge weging hiervan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24j
  - number: 24k.1
    text: |-
      Een toewijzing zoekgebied aardwarmte geldt voor een periode van vier jaar. Onze Minister kan deze termijn op
      verzoek van de houder van een toewijzing zoekgebied aardwarmte eenmaal met een jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24k
  - number: 24k.2
    text: |-
      In afwijking van het eerste lid geldt de toewijzing zoekgebied aardwarmte, indien een aanvraag voor een
      startvergunning aardwarmte is ingediend, tot het moment waarop het besluit waarbij op deze aanvraag wordt beslist,
      onherroepelijk wordt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24k
  - number: 24k.3
    text: |-
      In afwijking van het eerste lid kan de houder van een toewijzing zoekgebied aardwarmte, wanneer hij gelet op de
      voorgenomen afzet van warmte en de afspraken hieromtrent voldoende vraag naar warmte aannemelijk kan maken, iedere
      keer wanneer een startvergunning aardwarmte wordt aangevraagd om een verlenging van de toewijzing zoekgebied vragen
      voor een periode van vier jaar.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24k
  - number: 24k.4
    text: |-
      Onze Minister bepaalt in de toewijzing zoekgebied aardwarmte voor welke aardlagen en begrenzing daarvan een
      toewijzing zoekgebied aardwarmte geldt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24k
  - number: 24l.1
    text: |-
      Onze Minister kan op aanvraag van een houder van een toewijzing zoekgebied aardwarmte, een toewijzing zoekgebied
      aardwarmte wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24l
  - number: 24l.2
    text: |-
      Onze Minister kan op aanvraag van een houder van een toewijzing zoekgebied aardwarmte, een natuurlijke persoon of
      rechtspersoon als houder aan een toewijzing zoekgebied aardwarmte toevoegen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24l
  - number: 24l.3
    text: |-
      Onze Minister kan een toewijzing zoekgebied aardwarmte wijzigen of intrekken indien de bij de aanvraag verstrekte
      gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op de aanvraag een andere beslissing zou zijn
      genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren geweest.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24l
  - number: 24l.4
    text: |-
      Onze Minister beslist op een aanvraag als bedoeld in het eerste of tweede lid binnen acht weken na ontvangst van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24l
  - number: 24m
    text: |-
      Indien meer dan één natuurlijke persoon of rechtspersoon een toewijzing zoekgebied aardwarmte houdt, worden zij
      gezamenlijk als houder van een toewijzing zoekgebied aardwarmte beschouwd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24m
  - number: 24n
    text: |-
      Onze Minister verleent op aanvraag een startvergunning aardwarmte aan de houder van de toewijzing zoekgebied
      aardwarmte of aan de houder van de toewijzing zoekgebied aardwarmte en de uitvoerder aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24n
  - number: 24o.1
    text: 'Een aanvraag voor een startvergunning aardwarmte bevat een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24o
  - number: 24o.1.a
    text: de aardlagen en de begrenzing ervan waar de aanvrager voornemens is aardwarmte op te sporen en te winnen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24o
  - number: 24o.1.b
    text: |-
      de andere gebruiksmogelijkheden van het gebied, waaronder grondwater met het oog op de winning van drinkwater, of
      kenbare voornemens tot het opslaan van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24o
  - number: 24o.1.c
    text: |-
      de wijze waarop de aanvrager voornemens is aardwarmte op te sporen en te winnen en hoe hij voornemens is de
      putintegriteit te borgen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24o
  - number: 24o.1.d
    text: de verwachte bodembeweging ten gevolge van de winning;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24o
  - number: 24o.1.e
    text: 'indien dit nodig is gelet op de verwachte bodembeweging:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24o
  - number: 24o.1.e.1°
    text: |-
      de veiligheidsrisico’s voor omwonenden, het risico op schade aan gebouwen of infrastructurele werken of het risico
      op verstoring van de functionaliteit daarvan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24o
  - number: 24o.1.e.2°
    text: de maatregelen die worden genomen om bodembeweging te voorkomen of te beperken;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24o
  - number: 24o.1.e.3°
    text: de maatregelen die worden genomen om schade door bodembeweging te voorkomen of te beperken;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24o
  - number: 24o.1.f
    text: overeenkomsten met betrekking tot de afzet van warmte;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24o
  - number: 24o.1.g
    text: |-
      de wijze waarop de aanvrager voornemens is de kosten in verband met de opsporing en winning en de hierbij behorende
      aansprakelijkheden, waaronder het stellen van financiële zekerheid, anders dan bedoeld in de [artikelen 46][ref1]
      en [47][ref2], ter dekking van de aansprakelijkheid voor de schade door verontreiniging van grondwater of bodem
      indien de in de aanvraag aangegeven aardlagen zich geheel of gedeeltelijk bevinden onder een gebied dat is
      aangewezen voor de winning van drinkwater uit grondwater, en het zo nodig geheel of gedeeltelijk buiten gebruik
      stellen van een boorgat tijdens of na afloop van de looptijd van de startvergunning te dragen;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24o
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24o.1.h
    text: de ervaring van de aanvrager met de ontwikkeling van aardwarmteprojecten en andere mijnbouwactiviteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24o
  - number: 24o.2
    text: |-
      Een aanvraag voor een startvergunning aardwarmte gaat vergezeld van een aanvraag om instemming met de aanwijzing
      van een uitvoerder aardwarmte als bedoeld in [artikel 24z, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24z
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24o
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24z
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 24o.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24o
  - number: 24p.1
    text: |-
      Als een aanvraag voor een startvergunning aardwarmte ziet op aardwarmte die zich gedeeltelijk bevindt in een
      aangrenzend gebied waarvoor geen toewijzing zoekgebied aardwarmte, startvergunning aardwarmte of vervolgvergunning
      aardwarmte is aangevraagd of verleend, doet Onze Minister hiervan mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24p
  - number: 24p.2
    text: |-
      Indien het in het eerste lid aangevraagde gebied grenst aan een gebied waarvoor een toewijzing zoekgebied
      aardwarmte, een startvergunning aardwarmte of een vervolgvergunning aardwarmte geldt, stelt Onze Minister de
      houders van de toewijzing of vergunning op de hoogte van de ingediende aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24p
  - number: 24p.3
    text: |-
      Een houder van een toewijzing of vergunning als bedoeld in het tweede lid, kan binnen acht weken na de mededeling
      van Onze Minister een concurrerende aanvraag voor een startvergunning aardwarmte voor dit aangrenzende gebied
      indienen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24p
  - number: 24p.4
    text: |-
      Onze Minister stelt de aanvragers van alle ingediende aanvragen op de hoogte. De aanvragers voeren overleg over de
      mogelijkheden tot samenwerking of aanpassing van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24p
  - number: 24p.5
    text: |-
      Gedurende vier weken na het op de hoogte stellen van de aanvragers, bedoeld in het derde lid, heeft een aanvrager
      de mogelijkheid zijn aanvraag te wijzigen of in te trekken.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24p
  - number: 24p.6
    text: Onze Minister kan de termijn, bedoeld in het vijfde lid, eenmaal met ten hoogste vier weken verlengen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24p
  - number: 24q.1
    text: |-
      Over de aanvragen die aan het bepaalde bij of krachtens [artikel 24o][ref1] voldoen stelt Onze Minister
      gedeputeerde staten van de provincie en het college van burgemeester en wethouders van de gemeenten binnen wier
      grondgebied het gebied waarop de aanvraag voor een startvergunning aardwarmte betrekking heeft, in de gelegenheid
      binnen acht weken advies uit te brengen met het oog op de planmatige ontwikkeling of het beheer van delfstoffen,
      aardwarmte, andere natuurlijke rijkdommen, waaronder grondwater met het oog op de winning van drinkwater, of
      mogelijkheden tot het opslaan van stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24o
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24q
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24o
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 24q.2
    text: |-
      Over de aanvragen die aan het bepaalde bij of krachtens [artikel 24o][ref1] voldoen, stelt Onze Minister
      gedeputeerde staten van de provincie en het dagelijks bestuur van waterschappen binnen wier grondgebied het gebied
      waarop de aanvraag voor een startvergunning aardwarmte betrekking heeft, in de gelegenheid binnen acht weken advies
      uit te brengen met het oog op grondwaterkwaliteit en -kwantiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24o
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24q
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24o
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 24q.3
    text: |-
      Indien Onze Minister voornemens is af te wijken van het advies van gedeputeerde staten van de provincie met het oog
      op het beheer van grondwater met het oog op de winning van drinkwater, bedoeld in het eerste lid, of het advies van
      gedeputeerde staten van de provincie met het oog op grondwaterkwaliteit en -kwantiteit, bedoeld in het tweede lid,
      informeert Onze Minister Onze Minister van Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24q
  - number: 24r
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van een besluit inzake
      de aanvraag om een startvergunning aardwarmte.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24r
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 24s.1
    text: |-
      In afwijking van [artikel 3:18 van de Algemene wet bestuursrecht][ref1] en [artikel 24z, vierde lid][ref2],
      beslist Onze Minister op een aanvraag om een startvergunning aardwarmte en het tegelijkertijd ingediende verzoek om
      instemming met de aanwijzing van een uitvoerder aardwarmte binnen 32 weken na de ontvangst daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel24z
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24s
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 24z
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 24s.2
    text: Onze Minister kan de termijn, bedoeld in het eerste lid, eenmaal met ten hoogste acht weken verlengen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24s
  - number: 24s.3
    text: Van een beschikking tot verlening van een startvergunning aardwarmte wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24s
  - number: 24t.1
    text: 'De aanvraag om een startvergunning aardwarmte wordt geheel of gedeeltelijk afgewezen indien:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24t
  - number: 24t.1.a
    text: |-
      het opsporen of winnen van aardwarmte in de in de aanvraag aangegeven aardlagen en de begrenzing ervan bij of
      krachtens wet niet is toegestaan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24t
  - number: 24t.1.b
    text: |-
      voor de aardlagen en de begrenzing ervan die in de aanvraag is aangeduid aan een ander dan de aanvrager een
      toewijzing zoekgebied aardwarmte is verleend of een startvergunning aardwarmte of een vervolgvergunning aardwarmte
      is verleend;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24t
  - number: 24t.1.c
    text: |-
      de in de aanvraag beschreven opsporing en winning onaanvaardbare risico’s met zich brengt voor de veiligheid van
      omwonenden of onaanvaardbare schade kan veroorzaken aan gebouwen of infrastructurele werken of de functionaliteit
      daarvan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24t
  - number: 24t.1.d
    text: |-
      geen financiële zekerheid, anders dan bedoeld in de [artikelen 46][ref1] en [47][ref2], kan worden gesteld ter
      dekking van de aansprakelijkheid voor de schade door verontreiniging van grondwater of bodem in verband met de
      opsporing en winning van aardwarmte indien de in de aanvraag aangegeven aardlagen zich geheel of gedeeltelijk
      bevinden onder een gebied dat is aangewezen voor de winning van drinkwater uit grondwater.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24t
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24t.2
    text: 'Een aanvraag om een startvergunning aardwarmte kan geheel of gedeeltelijk worden afgewezen:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24t
  - number: 24t.2.a
    text: |-
      in het belang van de planmatige ontwikkeling of het beheer van delfstoffen, aardwarmte, andere natuurlijke
      rijkdommen, waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van
      stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24t
  - number: 24t.2.b
    text: |-
      indien de in de aanvraag aangeduide wijze van opsporing en winning en de wijze waarop de putintegriteit wordt
      geborgd niet geschikt wordt geacht om reden van nadelige gevolgen voor het milieu;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24t
  - number: 24t.2.c
    text: |-
      indien de aardlagen en de begrenzing ervan waar de aanvrager voornemens is aardwarmte te winnen niet aansluiten bij
      de verwachte winning van aardwarmte en de verwachte afzet van aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24t
  - number: 24t.2.d
    text: in verband met het ontbreken van overeenkomsten met betrekking tot de afzet van aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24t
  - number: 24t.2.e
    text: |-
      in verband met de financiële mogelijkheden van de aanvrager om de kosten in verband met de opsporing en winning en
      de hierbij behorende aansprakelijkheden, anders dan bedoeld in het eerste lid, onderdeel d, te dragen en gelet op
      zijn voornemens om kosten in verband met het geheel of gedeeltelijk buiten gebruik stellen van een boorgat tijdens
      of na afloop van de looptijd van de startvergunning te dragen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24t
  - number: 24t.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de gronden, bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24t
  - number: 24u.1
    text: |-
      Indien er op basis van [artikel 24p, derde lid][ref1], meer aanvragen om een startvergunning aardwarmte zijn
      ingediend die toegewezen zouden kunnen worden, verleent Onze Minister de startvergunning aardwarmte aan de
      aanvrager van wie de aanvraag het hoogst is gerangschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24p
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24u
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24p
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 24u.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de procedure van rangschikking, de
      rangschikkingscriteria en de onderlinge weging hiervan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24u
  - number: 24v.1
    text: |-
      Een startvergunning aardwarmte geldt voor twee jaar of, indien een aanvraag voor een vervolgvergunning aardwarmte
      is ingediend, tot het tijdstip waarop de beschikking waarbij op deze aanvraag wordt beslist, onherroepelijk wordt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24v
  - number: 24v.2
    text: Onze Minister kan de termijn, bedoeld in het eerste lid, eenmaal met een jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24v
  - number: 24v.3
    text: Onze Minister bepaalt in een startvergunning aardwarmte voor welke aardlagen en begrenzing daarvan zij geldt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24v
  - number: 24w.1
    text: |-
      Indien de in de aanvraag aangegeven aardlagen zich geheel of gedeeltelijk bevinden onder een gebied dat is
      aangewezen voor de winning van drinkwater uit grondwater, verbindt Onze Minister aan een startvergunning aardwarmte
      voorschriften of beperkingen in verband met het stellen van financiële zekerheid, anders dan bedoeld in de
      [artikelen 46][ref1] en [47][ref2], ter dekking van de aansprakelijkheid voor de schade door verontreiniging van
      grondwater of bodem in verband met de opsporing en winning van aardwarmte.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24w
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24w.2
    text: |-
      Indien de in de aanvraag aangegeven aardlagen zich geheel of gedeeltelijk bevinden onder een gebied dat is
      aangewezen of gereserveerd bij of krachtens wet voor de winning van drinkwater uit grondwater, verbindt Onze
      Minister aan de startvergunning aardwarmte het voorschrift dat geen doorboring plaatsvindt door dat gebied
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24w
  - number: 24w.3
    text: |-
      Onze Minister verbindt aan een startvergunning aardwarmte voorschriften of beperkingen in verband met het voorkomen
      van nadelige gevolgen voor het milieu als gevolg van de wijze van winning en de wijze waarop de putintegriteit
      wordt geborgd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24w
  - number: 24w.4
    text: 'Onze Minister kan aan een startvergunning aardwarmte voorschriften of beperkingen verbinden in verband met:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24w
  - number: 24w.4.a
    text: |-
      de veiligheid van omwonenden of het voorkomen van schade aan gebouwen of infrastructurele werken of de
      functionaliteit daarvan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24w
  - number: 24w.4.b
    text: |-
      het belang van de planmatige ontwikkeling of het beheer van delfstoffen, aardwarmte, andere natuurlijke rijkdommen,
      waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24w
  - number: 24w.4.c
    text: |-
      de financiële mogelijkheden van de aanvrager om de kosten in verband met de opsporing en winning en de hierbij
      behorende aansprakelijkheden, anders dan bedoeld in het eerste lid, te dragen en om kosten in verband met
      het geheel of gedeeltelijk buiten gebruik stellen van een boorgat tijdens of na afloop van de looptijd van de
      startvergunning te dragen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24w
  - number: 24w.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld inzake de gronden, bedoeld in het
      derde lid, en kunnen nadere regels worden gesteld inzake de gronden, bedoeld in het eerste, tweede en vierde lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24w
  - number: 24x.1
    text: |-
      Een startvergunning aardwarmte geldt ook voor delfstoffen die onvermijdelijk meekomen met de winning van
      aardwarmte, maar niet voor delfstoffen die zelfstandig economisch winbaar zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24x
  - number: 24x.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake de zelfstandige economische
      winbaarheid van meekomende delfstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24x
  - number: 24y
    text: |-
      Indien bij het opsporen of winnen van aardwarmte wordt geconstateerd dat de situatie van de ondergrond afwijkt van
      de aanvraag voor de startvergunning aardwarmte, meldt een houder van een startvergunning aardwarmte dit zo spoedig
      mogelijk aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24y
  - number: 24z.1
    text: |-
      Het verrichten van feitelijke werkzaamheden in verband met de opsporing of winning van aardwarmte waaronder het
      verlenen van opdracht daartoe of het buiten gebruik stellen van een boorgat, is slechts toegestaan aan één, door
      de houder van de startvergunning aardwarmte of de houder van de vervolgvergunning aardwarmte aangewezen uitvoerder
      aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24z
  - number: 24z.2
    text: |-
      Indien de uitvoerder aardwarmte niet meer in staat is feitelijke werkzaamheden uit te voeren, wijst de houder van
      de startvergunning aardwarmte of de houder van de vervolgvergunning aardwarmte een nieuwe uitvoerder aardwarmte
      aan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24z
  - number: 24z.3
    text: |-
      De aanwijzing, bedoeld in het eerste en tweede lid, behoeft de instemming van Onze Minister. Onze Minister kan
      zijn instemming slechts weigeren in verband met de technische of financiële capaciteiten waarover de uitvoerder
      aardwarmte beschikt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24z
  - number: 24z.4
    text: |-
      Onze Minister beslist op een aanvraag om een instemming binnen acht weken na ontvangst van de aanvraag. Onze
      Minister kan de termijn eenmaal met ten hoogste acht weken verlengen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24z
  - number: 24z.5
    text: |-
      Onze Minister kan aan de instemming met de uitvoerder aardwarmte voorschriften of beperkingen verbinden in verband
      met de technische en financiële capaciteiten waarover de uitvoerder aardwarmte beschikt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24z
  - number: 24z.6
    text: |-
      Onze Minister kan de instemming, bedoeld in het derde lid, wijzigen of intrekken indien de uitvoerder aardwarmte
      niet meer in staat is feitelijke werkzaamheden op een verantwoorde wijze uit te voeren.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24z
  - number: 24z.7
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24z
  - number: 24z.7.a
    text: de aanwijzing, bedoeld in het eerste en tweede lid;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24z
  - number: 24z.7.b
    text: de instemming, bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24z
  - number: 24z.7.c
    text: een aanvraag om een instemming als bedoeld in het vierde lid;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24z
  - number: 24z.7.d
    text: de voorschriften en beperkingen, bedoeld in het vijfde lid;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24z
  - number: 24z.7.e
    text: het wijzigen of intrekken van de instemming, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24z
  - number: 24aa
    text: |-
      Indien meer dan één natuurlijke persoon of rechtspersoon een startvergunning aardwarmte houdt, worden zij
      gezamenlijk als houder van een startvergunning aardwarmte beschouwd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24aa
  - number: 24ab.1
    text: |-
      Onze Minister kan op aanvraag van een houder van een startvergunning aardwarmte een startvergunning aardwarmte
      wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ab
  - number: 24ab.2
    text: 'Onze Minister kan een startvergunning aardwarmte wijzigen of intrekken:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ab
  - number: 24ab.2.a
    text: |-
      indien de bij de aanvraag verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op
      de aanvraag een andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste gegevens of
      omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ab
  - number: 24ab.2.b
    text: 'indien dat wordt gerechtvaardigd door veranderde omstandigheden of gewijzigde inzichten inzake:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ab
  - number: 24ab.2.b.1°
    text: |-
      de veiligheidsrisico’s voor omwonenden of het voorkomen van schade aan gebouwen of infrastructurele werken of de
      functionaliteit daarvan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ab
  - number: 24ab.2.b.2°
    text: het voorkomen van nadelige gevolgen voor het milieu als gevolg van de wijze van opsporen en winnen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ab
  - number: 24ab.2.b.3°
    text: |-
      de financiële mogelijkheden van de houder om de kosten in verband met de opsporing en winning en de hierbij
      behorende aansprakelijkheden, waaronder het stellen van financiële zekerheid, anders dan bedoeld in de
      [artikelen 46][ref1] en [47][ref2], ter dekking van de aansprakelijkheid voor de schade door verontreiniging van
      grondwater of bodem in verband met de opsporing en winning van aardwarmte indien de in de aanvraag aangegeven
      aardlagen zich geheel of gedeeltelijk bevinden onder een gebied dat is aangewezen voor de winning van drinkwater
      uit grondwater, te dragen en om kosten in verband met het geheel of gedeeltelijk buiten gebruik stellen van een
      boorgat tijdens of na afloop van de looptijd van de startvergunning te dragen;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ab
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24ab.2.c
    text: indien er niet langer een uitvoerder aardwarmte is waarmee Onze Minister heeft ingestemd;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ab
  - number: 24ab.2.d
    text: indien niet overeenkomstig de startvergunning aardwarmte is of wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ab
  - number: 24ab.3
    text: |-
      Onze Minister beslist op een aanvraag om wijziging of intrekking van een startvergunning aardwarmte binnen acht
      weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ab
  - number: 24ab.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake de gronden, bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ab
  - number: 24ac
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ac
  - number: 24ac.a
    text: |-
      het splitsen van een startvergunning aardwarmte, waardoor twee of meer startvergunningen aardwarmte voor twee of
      meer gebieden ontstaan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ac
  - number: 24ac.b
    text: |-
      het samenvoegen van delen van twee of meer startvergunningen aardwarmte, waardoor een startvergunning aardwarmte
      voor een gebied ontstaat.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ac
  - number: 24ad.1
    text: |-
      Een houder van een startvergunning aardwarmte kan deze slechts met schriftelijke toestemming van Onze Minister op
      een ander doen overgaan. Onze Minister kan aan een toestemming voorschriften of beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ad
  - number: 24ad.2
    text: |-
      Een verzoek om overdracht gaat vergezeld van de informatie, bedoeld in [artikel 24o, eerste lid, onderdeel g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24o
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ad
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24o
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 24ad.3
    text: |-
      [Artikel 24t, tweede lid, aanhef en onderdeel e][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24t
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ad
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24t
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 24ad.4
    text: |-
      Indien de houder van een startvergunning aardwarmte een deel van zijn startvergunning aardwarmte op een ander
      wil doen overgaan, dient hij tevens een aanvraag in om splitsing van de startvergunning aardwarmte als bedoeld in
      [artikel 24ac, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24ac
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ad
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24ac
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 24ae
    text: |-
      Onze Minister verleent op aanvraag een vervolgvergunning aardwarmte aan de houder van een startvergunning
      aardwarmte voor het gebied of een gedeelte daarvan waarop de startvergunning aardwarmte ziet.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ae
  - number: 24af.1
    text: 'Een aanvraag voor een vervolgvergunning aardwarmte gaat vergezeld van een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24af
  - number: 24af.1.a
    text: de aardlaag en de begrenzing ervan waar de aanvrager aardwarmte wint;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24af
  - number: 24af.1.b
    text: de verwachte exploitatieduur;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24af
  - number: 24af.1.c
    text: de verwachte invloedssfeer van de winning en de verwachte afkoeling;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24af
  - number: 24af.1.d
    text: |-
      indien van toepassing, wijziging ten opzichte van de startvergunning aardwarmte in de wijze waarop de aanvrager
      voornemens is aardwarmte te winnen en de wijze waarop hij zijn put heeft ingericht;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24af
  - number: 24af.1.e
    text: de gemeten en nog te verwachten bodembeweging ten gevolge van de winning;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24af
  - number: 24af.1.f
    text: 'indien dit nodig is gelet op de nog te verwachten bodembeweging:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24af
  - number: 24af.1.f.1°
    text: |-
      de veiligheidsrisico’s voor omwonenden, het risico op schade aan gebouwen of infrastructurele werken of het risico
      op verstoring van de functionaliteit daarvan,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24af
  - number: 24af.1.f.2°
    text: de maatregelen die worden genomen om bodembeweging te voorkomen of te beperken;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24af
  - number: 24af.1.f.3°
    text: de maatregelen die worden genomen om de schade door bodembeweging te voorkomen of te beperken;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24af
  - number: 24af.1.g
    text: |-
      indien van toepassing, wijziging ten opzichte van de startvergunning aardwarmte in de wijze waarop de aanvrager
      voornemens is de kosten in verband met de winning en de hierbij behorende aansprakelijkheden, waaronder het
      stellen van financiële zekerheid, anders dan bedoeld in de [artikelen 46][ref1] en [47][ref2], ter dekking van
      de aansprakelijkheid voor de schade door verontreiniging van grondwater of bodem in verband met de opsporing en
      winning van aardwarmte indien de in de aanvraag aangegeven aardlagen zich geheel of gedeeltelijk bevinden onder een
      gebied dat is aangewezen voor de winning van drinkwater uit grondwater, te dragen;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24af
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24af.1.h
    text: |-
      de wijze waarop de aanvrager voornemens is om kosten in verband met het geheel of gedeeltelijk buiten gebruik
      stellen van een boorgat tijdens de looptijd van de vervolgvergunning of na afloop hiervan te dragen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24af
  - number: 24af.2
    text: |-
      Indien een nieuwe uitvoerder aardwarmte wordt aangewezen, gaat de aanvraag voor een vervolgvergunning aardwarmte
      vergezeld van een verzoek om instemming met de aanwijzing van een uitvoerder aardwarmte als bedoeld in
      [artikel 24z, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24z
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24af
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24z
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 24af.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24af
  - number: 24ag.1
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van een besluit
      inzake een aanvraag om een vervolgvergunning aardwarmte indien de verlening van de vervolgvergunning aardwarmte ten
      opzichte van de startvergunning aardwarmte leidt tot een significant:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ag
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 24ag.1.a
    text: nadeliger gevolg voor het milieu als gevolg van de wijze van winning;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ag
  - number: 24ag.1.b
    text: nadeliger effect van de bodembeweging ten gevolge van de winning;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ag
  - number: 24ag.1.c
    text: |-
      groter risico voor omwonenden of grotere schade aan gebouwen of infrastructurele werken of de functionaliteit
      daarvan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ag
  - number: 24ag.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de gronden, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ag
  - number: 24ah.1
    text: |-
      Indien [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, stelt Onze Minister gedeputeerde
      staten van de provincie en het college van burgemeester en wethouders van de gemeenten binnen wier grondgebied het
      gebied waarop de aanvraag voor een vervolgvergunning aardwarmte betrekking heeft, in de gelegenheid binnen acht
      weken advies uit te brengen met het oog op de planmatige ontwikkeling of het beheer van delfstoffen, aardwarmte,
      andere natuurlijke rijkdommen, waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot
      het opslaan van stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ah
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 24ah.2
    text: |-
      Indien [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, stelt Onze Minister gedeputeerde
      staten van de provincie en het dagelijks bestuur van waterschappen binnen wier grondgebied het gebied waarop de
      aanvraag voor een vervolgvergunning aardwarmte betrekking heeft, in de gelegenheid binnen acht weken advies uit te
      brengen met het oog op grondwaterkwaliteit en -kwantiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ah
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 24ah.3
    text: |-
      Indien Onze Minister voornemens is af te wijken van het advies van gedeputeerde staten van de provincie met het oog
      op het beheer van grondwater met het oog op de winning van drinkwater, bedoeld in het eerste lid, of het advies van
      gedeputeerde staten van de provincie met het oog op grondwaterkwaliteit en -kwantiteit, bedoeld in het tweede lid,
      informeert Onze Minister Onze Minister van Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ah
  - number: 24ai.1
    text: |-
      Onze Minister beslist op een aanvraag om een vervolgvergunning aardwarmte binnen twaalf weken na de ontvangst van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ai
  - number: 24ai.2
    text: Onze Minister kan de termijn, bedoeld in het eerste lid, eenmaal met ten hoogste vier weken verlengen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ai
  - number: 24ai.3
    text: |-
      Indien [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, beslist Onze Minister, in
      afwijking van [artikel 3:18 van de Algemene wet bestuursrecht][ref2] en het eerste lid, op een aanvraag om een
      vervolgvergunning aardwarmte binnen 32 weken na de ontvangst daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ai
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 24ai.4
    text: Onze Minister kan de termijn, bedoeld in het derde lid, eenmaal met ten hoogste acht weken verlengen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ai
  - number: 24ai.5
    text: Van een beschikking tot verlening van een vergunning wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ai
  - number: 24aj.1
    text: 'Een aanvraag om vervolgvergunning aardwarmte wordt geheel of gedeeltelijk afgewezen indien:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24aj
  - number: 24aj.1.a
    text: |-
      de in de aanvraag beschreven winning onaanvaardbare risico’s met zich brengt voor de veiligheid van omwonenden of
      onaanvaardbare schade kan veroorzaken aan gebouwen of infrastructurele werken of de functionaliteit daarvan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24aj
  - number: 24aj.1.b
    text: |-
      geen financiële zekerheid, anders dan bedoeld in de [artikelen 46][ref1] en [47][ref2], kan worden gesteld ter
      dekking van de aansprakelijkheid voor de schade door verontreiniging van grondwater of bodem in verband met de
      opsporing en winning van aardwarmte indien de in de aanvraag aangegeven aardlagen zich geheel of gedeeltelijk
      bevinden onder een gebied dat is aangewezen voor de winning van drinkwater uit grondwater.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24aj
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24aj.2
    text: 'Een vervolgvergunning aardwarmte kan geheel of gedeeltelijk worden afgewezen:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24aj
  - number: 24aj.2.a
    text: |-
      indien de in de aanvraag aangeduide wijze van winning niet geschikt wordt geacht om reden van de nadelige gevolgen
      voor het milieu;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24aj
  - number: 24aj.2.b
    text: indien de invloedssfeer niet aansluit bij de door de aanvrager aangegeven aardlaag en de begrenzing ervan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24aj
  - number: 24aj.2.c
    text: |-
      in verband met de financiële mogelijkheden van de aanvrager om alle kosten in verband met de winning en de hierbij
      behorende aansprakelijkheden, anders dan bedoeld in het eerste lid, onderdeel b, te dragen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24aj
  - number: 24aj.2.d
    text: |-
      in verband met de financiële mogelijkheden van de aanvrager om de kosten in verband met het geheel of gedeeltelijk
      buiten gebruik stellen van een boorgat tijdens de looptijd van of na afloop van de vervolgvergunning te dragen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24aj
  - number: 24aj.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de gronden, bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24aj
  - number: 24ak
    text: |-
      In een vervolgvergunning aardwarmte wordt bepaald voor welk tijdvak zij geldt en voor welke aardlaag en begrenzing
      daarvan zij geldt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ak
  - number: 24al.1
    text: |-
      Indien de in de aanvraag aangegeven aardlagen zich geheel of gedeeltelijk bevinden onder een gebied dat is
      aangewezen voor de winning van drinkwater uit grondwater, verbindt Onze Minister aan een vervolgvergunning
      aardwarmte voorschriften of beperkingen in verband met het stellen van financiële zekerheid, anders dan bedoeld in
      de [artikelen 46][ref1] en [47][ref2], ter dekking van de aansprakelijkheid voor de schade door verontreiniging van
      grondwater of bodem in verband met de opsporing en winning van aardwarmte.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24al
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24al.2
    text: |-
      Onze Minister verbindt aan een vervolgvergunning aardwarmte voorschriften of beperkingen in verband met het
      voorkomen van nadelige gevolgen voor het milieu als gevolg van de wijze van winning en de wijze waarop de
      putintegriteit wordt geborgd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24al
  - number: 24al.3
    text: 'Onze Minister kan aan een vervolgvergunning aardwarmte voorschriften of beperkingen verbinden in verband met:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24al
  - number: 24al.3.a
    text: |-
      de veiligheid van omwonenden of het voorkomen van schade aan gebouwen of infrastructurele werken of de
      functionaliteit daarvan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24al
  - number: 24al.3.b
    text: |-
      het belang van de planmatige ontwikkeling of het beheer van delfstoffen, aardwarmte, andere natuurlijke rijkdommen,
      waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24al
  - number: 24al.3.c
    text: |-
      de financiële mogelijkheden van de aanvrager om de kosten in verband met de winning en de hierbij behorende
      aansprakelijkheden, anders dan bedoeld in het eerste lid, te dragen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24al
  - number: 24al.3.d
    text: |-
      de financiële mogelijkheden van de aanvrager om de kosten in verband met het geheel of gedeeltelijk buiten gebruik
      stellen van een boorgat tijdens of na afloop van de vervolgvergunning te dragen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24al
  - number: 24al.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld inzake de gronden, bedoeld in het
      tweede lid, en kunnen nadere regels worden gesteld inzake de gronden, bedoeld in het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24al
  - number: 24am.1
    text: |-
      Een vervolgvergunning aardwarmte geldt ook voor delfstoffen die onvermijdelijk meekomen met de winning van
      aardwarmte, maar niet voor delfstoffen die zelfstandig economisch winbaar zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24am
  - number: 24am.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake de zelfstandige economische
      winbaarheid van meekomende delfstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24am
  - number: 24an
    text: |-
      Indien meer dan één natuurlijke persoon of rechtspersoon een vervolgvergunning aardwarmte houden, worden zij
      gezamenlijk als houder van een vervolgvergunning aardwarmte beschouwd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24an
  - number: 24ao.1
    text: |-
      Onze Minister kan op aanvraag van een houder van een vervolgvergunning aardwarmte een vervolgvergunning aardwarmte
      wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ao
  - number: 24ao.2
    text: 'Onze Minister kan een vervolgvergunning aardwarmte wijzigen of intrekken:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ao
  - number: 24ao.2.a
    text: |-
      indien de bij de aanvraag verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op de
      aanvraag een andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig
      bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ao
  - number: 24ao.2.b
    text: 'indien dat wordt gerechtvaardigd door veranderde omstandigheden of gewijzigde inzichten inzake:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ao
  - number: 24ao.2.b.1°
    text: de wijze waarop de houder aardwarmte wint;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ao
  - number: 24ao.2.b.2°
    text: |-
      de veiligheid van omwonenden of het voorkomen van schade aan gebouwen of infrastructurele werken of de
      functionaliteit daarvan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ao
  - number: 24ao.2.b.3°
    text: |-
      de financiële mogelijkheden van de houder om de kosten in verband met de winning en de hierbij behorende
      aansprakelijkheden, waaronder het stellen van financiële zekerheid, anders dan bedoeld in de [artikelen 46][ref1]
      en [47][ref2], ter dekking van de aansprakelijkheid voor de schade door verontreiniging van grondwater of bodem
      in verband met de opsporing en winning van aardwarmte indien de in de aanvraag aangegeven aardlagen zich geheel of
      gedeeltelijk bevinden onder een gebied dat is aangewezen voor de winning van drinkwater uit grondwater, te dragen
      en om kosten in verband met het geheel of gedeeltelijk buiten gebruik stellen van een boorgat tijdens of na afloop
      van de looptijd van de vervolgvergunning te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ao
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 24ao.2.c
    text: in verband met de nadelige gevolgen voor het milieu als gevolg van de wijze van winning;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ao
  - number: 24ao.2.d
    text: indien er niet langer een uitvoerder aardwarmte is waarmee Onze Minister heeft ingestemd;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ao
  - number: 24ao.2.e
    text: indien de houder definitief gestopt is met het winnen van aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ao
  - number: 24ao.2.f
    text: indien niet overeenkomstig de vergunning is of wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ao
  - number: 24ao.3
    text: |-
      Onze Minister beslist op een aanvraag om wijziging of intrekking van vervolgvergunning aardwarmte binnen acht weken
      na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ao
  - number: 24ao.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake de gronden, bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ao
  - number: 24ap
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ap
  - number: 24ap.a
    text: |-
      het splitsen van een vervolgvergunning aardwarmte, waardoor twee of meer vervolgvergunningen aardwarmte voor twee
      of meer gebieden ontstaan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ap
  - number: 24ap.b
    text: |-
      het samenvoegen van delen van twee of meer vervolgvergunningen aardwarmte, waardoor een vervolgvergunning
      aardwarmte voor een gebied ontstaat.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24ap
  - number: 24aq.1
    text: |-
      De houder van een vervolgvergunning aardwarmte kan deze slechts met schriftelijke toestemming van Onze Minister
      op een ander doen overgaan. Aan een toestemming kunnen voorschriften worden verbonden of een toestemming kan onder
      beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24aq
  - number: 24aq.2
    text: |-
      Een verzoek om overdracht gaat vergezeld van de informatie, bedoeld in
      [artikel 24af, eerste lid, onderdeel g en h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24af
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24aq
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24af
        hoofdstuk: 2a
        paragraaf: '4'
  - number: 24aq.3
    text: |-
      [Artikel 24aj, tweede lid, aanhef en onderdeel c, en d][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24aj
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24aq
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24aj
        hoofdstuk: 2a
        paragraaf: '4'
  - number: 24aq.4
    text: |-
      Indien de houder van een vergunning een deel van zijn vergunning op een ander wil doen overgaan, dient hij tevens
      een aanvraag in om splitsing van de vergunning als bedoeld in [artikel 24ap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24ap
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel24aq
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24ap
        hoofdstuk: 2a
        paragraaf: '4'
  - number: '25.1'
    text: 'Het is verboden zonder vergunning van Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel25
  - number: 25.1.a
    text: stoffen op te slaan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel25
  - number: 25.1.b
    text: CO-opslagcomplexen op te sporen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel25
  - number: '25.2'
    text: Het verbod geldt niet met betrekking tot bij algemene maatregel van bestuur omschreven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel25
  - number: '25.3'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag om een vergunning
      als bedoeld in het eerste lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '26.1'
    text: |-
      Een opslagvergunning wordt niet verleend, voorzover deze bij het in werking treden zou gaan gelden voor een gebied
      waarvoor op dat tijdstip reeds een door een ander gehouden opslagvergunning geldt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26
  - number: '26.2'
    text: |-
      Een opslagvergunning wordt evenmin verleend, voorzover deze bij het in werking treden zou gaan gelden voor een
      voorkomen waarvoor op dat tijdstip reeds een door een ander gehouden vergunning als bedoeld in [artikel 6][ref1]
      geldt of waarvoor een toewijzing zoekgebied aardwarmte, een startvergunning aardwarmte of een vervolgvergunning
      aardwarmte geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '26.3'
    text: |-
      Ingeval aan een houder van een opsporings- of winningsvergunning voor koolwaterstoffen een opslagvergunning voor
      hetzelfde gebied en voor dezelfde stof is verleend, vervalt de opsporings- of winningsvergunning op het tijdstip
      waarop de verleende opslagvergunning onherroepelijk wordt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26
  - number: '26.4'
    text: |-
      Met ingang van het tijdstip waarop een winningsvergunning als bedoeld in het derde lid vervalt, gelden de
      delfstoffen in het gebied waarvoor de winningsvergunning gold, als stoffen die na winning door de houder van de
      opslagvergunning, bedoeld in het derde lid, zijn opgeslagen en waarvan de eigendom bij hem berust.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26
  - number: '26.5'
    text: |-
      Het derde lid is niet van toepassing op een houder van een opsporings- of winningsvergunning voor koolwaterstoffen
      indien hem voor het tijdstip van inwerkingtreding van deze leden een onherroepelijke opslagvergunning voor
      hetzelfde gebied en voor dezelfde stof is verleend.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26
  - number: '26.6'
    text: |-
      In afwijking van het eerste lid wordt een vergunning voor het permanent opslaan van CO of een vergunning voor
      opsporen van CO-opslagcomplexen niet verleend voor zover de vergunning bij de inwerkingtreding ervan zou gaan
      gelden voor een CO-opslagcomplex waarvoor op dat tijdstip reeds een vergunning als bedoeld in [artikel 25][ref1]
      geldt, ongeacht wie de houder van de desbetreffende vergunning is.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '26.7'
    text: |-
      In afwijking van het tweede lid kan voor een voorkomen waarvoor een vergunning als bedoeld in [artikel 6][ref1]
      geldt, ten hoogste één vergunning voor permanent opslaan van CO of een vergunning voor het opsporen van CO-
      opslagcomplexen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 26a.1
    text: |-
      Onverminderd [artikel 26, zesde en zevende lid][ref1], wordt de houder van een vergunning voor het opsporen van
      CO-opslagcomplexen die met gebruikmaking van die vergunning de geschiktheid van een voorkomen voor permanent
      opslaan van CO heeft aangetoond, op zijn aanvraag, ingediend gedurende de geldingsduur van die vergunning, een
      opslagvergunning voor het aangetoonde opslagvoorkomen verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel26
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 26a.2
    text: |-
      Het eerste lid geldt niet, indien weigering van de opslagvergunning, bedoeld in het eerste lid, gerechtvaardigd
      wordt door één van de in [artikel 27][ref1] genoemde gronden.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel27
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 26a.3
    text: |-
      Indien een aanvraag als bedoeld in het eerste lid is ingediend, blijft de vergunning voor het opsporen van CO-
      opslagcomplexen, voor zover deze betrekking heeft op het aangevraagde opslagvoorkomen, tenminste gelden tot het
      tijdstip waarop de beschikking waarbij op de aanvraag wordt beslist onherroepelijk wordt. Indien een vergunning
      voor permanent opslaan van CO wordt verleend, vervalt op het tijdstip waarop de beschikking onherroepelijk wordt,
      voor het gebied waarvoor de opslagvergunning geldt, de vergunning voor opsporen van CO-opslagcomplexen. Voor zover
      hierdoor voorschriften vervallen die nog niet zijn uitgewerkt, gaan zij gelden als voorschriften die zijn verbonden
      aan de opslagvergunning.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26a
  - number: 26b.1
    text: |-
      Zodra een aanvraag om een opslagvergunning is ingediend, worden anderen in de gelegenheid gesteld om aanvragen om
      een opslagvergunning in te dienen voor hetzelfde gebied.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26b
  - number: 26b.2
    text: |-
      Onze Minister plaatst hiertoe een uitnodiging in de Staatscourant. De uitnodiging maakt melding van het
      bepaalde in [artikel 17][ref1] dan wel, indien het permanent opslaan van CO betreft, van het bepaalde in
      [artikel 31c, derde tot en met vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel31c
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 31c
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 26b.3
    text: Anderen kunnen aanvragen indienen tot dertien weken na de dag van plaatsing van de uitnodiging in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26b
  - number: 26b.4
    text: 'De procedure, bedoeld in het eerste tot en met het derde lid, wordt niet toegepast met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26b
  - number: 26b.4.a
    text: een aanvraag die wordt ingediend overeenkomstig het derde lid;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26b
  - number: 26b.4.b
    text: |-
      vergunningen waarop [artikel 26, eerste of tweede lid][ref1], van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel26
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 26b.4.c
    text: |-
      een aanvraag voor een gebied waarvoor op grond van [artikel 26, zesde lid][ref1], geen vergunning zal kunnen worden
      verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel26
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 26b.4.d
    text: |-
      een aanvraag voor een vergunning voor permanent opslaan van CO waarop [artikel 26a][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel26a
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 26a
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 26b.5
    text: |-
      Het eerste tot en met het vierde lid, onderdeel a en c, is van overeenkomstige toepassing op een aanvraag voor een
      vergunning voor opsporen van CO-opslagcomplexen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel26b
  - number: '27.1'
    text: |-
      Onverminderd [artikel 26][ref1] kan een opslagvergunning slechts geheel of gedeeltelijk worden geweigerd:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel26
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 27.1.a
    text: op grond van de technische of financiële mogelijkheden van de aanvrager,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: 27.1.b
    text: |-
      op grond van de manier waarop de aanvrager voornemens is de activiteiten voor het opslaan van stoffen te
      verrichten, waaronder de daarbij te gebruiken technieken, hulpmiddelen of stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: 27.1.c
    text: |-
      op grond van het gebrek aan efficiëntie en verantwoordelijkheidszin waarvan de aanvrager blijk heeft gegeven bij
      activiteiten onder een eerdere vergunning op grond van deze wet,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: 27.1.d
    text: |-
      in het belang van de veiligheid voor omwonenden en het voorkomen van schade aan gebouwen of infrastructurele werken
      of de functionaliteit daarvan,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: 27.1.e
    text: in het belang van de landsverdediging,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: 27.1.f
    text: |-
      in het belang van een planmatig gebruik of beheer van delfstoffen, aardwarmte, andere natuurlijke rijkdommen,
      waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: 27.1.g
    text: |-
      ter nakoming van het op 7 november 1996 te Londen tot stand gekomen Protocol bij het op 29 december 1972 te Londen
      tot stand gekomen Verdrag inzake de voorkoming van verontreiniging van de zee ten gevolge van het storten van afval
      en andere stoffen (Trb. 1998, 134 en Trb. 2000, 27),
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: 27.1.h
    text: |-
      indien het algemeen belang vereist dat het gebied waarvoor een opslagvergunning wordt aangevraagd, wordt gebruikt
      voor de opslag van andere dan in de aanvraag omschreven stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: 27.1.i
    text: |-
      indien een keuze moet worden gemaakt uit twee of meer aanvragen om een vergunning die bij een beoordeling op
      grond van de onderdelen a tot en met h gelijkwaardig zijn gebleken, in het belang van het doelmatig en voortvarend
      opslaan,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: 27.1.j
    text: |-
      in verband met bij of krachtens een algemene maatregel van bestuur als bedoeld in
      [artikel 2.24 van de Omgevingswet][ref1] voor een gebied op land, respectievelijk in de territoriale zee, bedoeld
      in [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref2], gestelde regels inhoudende dat
      het opslaan van stoffen door middel van een installatie in dat gebied niet wordt of kan worden toegestaan, of


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003748#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003748
        artikel: '1'
  - number: 27.1.k
    text: |-
      in verband met bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 49][ref1] gestelde
      regels over:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 27.1.k.1°
    text: het geheel of gedeeltelijk uitsluiten van een gebied van het opslaan van stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: 27.1.k.2°
    text: de diepte waarop een activiteit plaatsvindt,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: 27.1.k.3°
    text: de soort activiteit, of
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: 27.1.k.4°
    text: de soort stof die wordt opgeslagen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: '27.2'
    text: |-
      Een vergunning kan op grond van de financiële mogelijkheden van de aanvrager worden geweigerd als
      onvoldoende verzekerd is dat de aanvrager zal voldoen aan hem op te leggen verplichtingen als bedoeld in de
      [artikelen 46][ref1], [47][ref2] en [102][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel102
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '102'
        hoofdstuk: '5'
        afdeling: '5.4'
  - number: '27.3'
    text: |-
      Onverminderd [artikel 26][ref1] wordt een vergunning voor permanent opslaan van CO geweigerd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel26
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 27.3.a
    text: |-
      bij opslag onder de voorgestelde exploitatievoorwaarden een significant risico van lekkage bestaat of significante
      milieu- of gezondheidsrisico’s bestaan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: 27.3.b
    text: |-
      door verlening van de vergunning zich in dezelfde hydraulische eenheid meer dan één opslagvoorkomen zou gaan
      bevinden en de potentiële drukinteracties zodanig zijn dat beide voorkomens niet tegelijk aan de eisen van
      veiligheid kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: '27.4'
    text: |-
      Met het oog op de toepassing van het eerste, tweede en derde lid kunnen bij ministeriële regeling nadere regels
      worden gesteld, die bij de beslissing op een aanvraag om een vergunning in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel27
  - number: '28'
    text: |-
      In een opslagvergunning anders dan een vergunning voor permanent opslaan van CO wordt bepaald voor welke stoffen,
      voor welk gebied en voor welk tijdvak zij geldt. Daarbij wordt bepaald dat:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel28
  - number: 28.a
    text: de in de ondergrond gebrachte stoffen voor een in de vergunning geregeld tijdstip teruggehaald moeten worden, of
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel28
  - number: 28.b
    text: de stoffen definitief in de ondergrond achtergelaten moeten worden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel28
  - number: '29.1'
    text: |-
      Een opslagvergunning kan voorts onder andere beperkingen dan die bedoeld in [artikel 28][ref1] worden verleend. Aan
      een vergunning kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel28
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '29.2'
    text: |-
      De beperkingen en voorschriften, anders dan de voorschriften op grond van [artikel 98][ref1], kunnen slechts
      worden gerechtvaardigd door het belang van de veiligheid voor omwonenden, het voorkomen van schade aan gebouwen
      of infrastructurele werken of de functionaliteit daarvan, de landsverdediging of het planmatig gebruik of beheer
      van delfstoffen, aardwarmte, andere natuurlijke rijkdommen, waaronder grondwater met het oog op de winning van
      drinkwater, of mogelijkheden tot het opslaan van stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel98
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '98'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: '29.3'
    text: |-
      In afwijking van het tweede lid kunnen aan een vergunning voor permanent opslaan van CO ook beperkingen en
      voorschriften als bedoeld in [artikel 31d, eerste lid][ref1], worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31d
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31d
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '29.4'
    text: |-
      In aanvulling op het tweede lid kan een vergunning onder beperkingen worden verleend of kunnen aan een vergunning
      voorschriften worden verbonden:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel29
  - number: 29.4.a
    text: |-
      in verband met de manier waarop de aanvrager de activiteiten voor het opslaan van stoffen verricht of voornemens is
      te verrichten, waaronder de daarbij te gebruiken technieken, hulpmiddelen of stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel29
  - number: 29.4.b
    text: |-
      in verband met bij of krachtens een algemene maatregel van bestuur als bedoeld in
      [artikel 2.24 van de Omgevingswet][ref1] voor een gebied op land, respectievelijk in de territoriale zee, bedoeld
      in [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref2], gestelde regels over het opslaan
      van stoffen door middel van een installatie,


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003748#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003748
        artikel: '1'
  - number: 29.4.c
    text: |-
      in verband met bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 49][ref1] gestelde
      regels over:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 29.4.c.1°
    text: het geheel of gedeeltelijk uitsluiten van een gebied voor het opslaan van stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel29
  - number: 29.4.c.2°
    text: de diepte waarop een activiteit plaatsvindt,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel29
  - number: 29.4.c.3°
    text: de soort activiteit, of
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel29
  - number: 29.4.c.4°
    text: de soort stof die wordt opgeslagen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel29
  - number: '30.1'
    text: |-
      Onze Minister kan een opslagvergunning wijzigen of geheel of gedeeltelijk intrekken, indien dit wordt
      gerechtvaardigd op grond van de in [artikel 29, tweede, derde en vierde lid][ref1], genoemde gronden.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel29
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '30.2'
    text: |-
      Voorts kan Onze Minister een opslagvergunning wijzigen of geheel of gedeeltelijk intrekken, indien niet wordt
      voldaan aan [artikel 39a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel39a
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 39a
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '30.3'
    text: |-
      Onverminderd het eerste lid kan Onze Minister ook op grond van [artikel 31h][ref1] een vergunning voor permanent
      opslaan van CO wijzigen of geheel of gedeeltelijk intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31h
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31h
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '30.4'
    text: |-
      Van een beschikking tot wijziging of gehele of gedeeltelijke intrekking van een vergunning wordt mededeling gedaan
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel30
  - number: '31'
    text: |-
      De houder van een opslagvergunning kan zijn vergunning slechts met schriftelijke toestemming van Onze Minister op
      een ander doen overgaan. De [artikelen 20, tweede en derde lid][ref1], [artikel 26, tweede en zevende lid][ref2],
      en [27][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel27
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 31a.1
    text: |-
      Ten aanzien van een opslagvergunning zijn de [artikelen 14][ref1], [16][ref2], [17][ref3], [19][ref4], [21][ref5],
      met uitzondering van het vierde lid, en [22][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Artikel21
      [ref6]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref5
        bwb_id: BWBR0014168
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref6
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 31a.2
    text: |-
      In afwijking van het eerste lid zijn op vergunningen voor permanent opslaan van CO uitsluitend de
      [artikelen 14][ref1], [16][ref2] en [22][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 31a.3
    text: |-
      Ten aanzien van een vergunning voor opsporen van CO-opslagcomplexen zijn de
      [artikelen 9, eerste tot en met derde lid][ref1], [11, tweede, derde en vierde lid][ref2], [12][ref3],
      [13, tweede lid][ref4], [14][ref5], [16][ref6], [17][ref7], [18][ref8] met dien verstande dat voor
      «andere delfstoffen» wordt gelezen «andere stoffen», [19][ref9], [20][ref10] met dien verstande dat in het
      eerste lid, tweede volzin, voor «Artikel 7, tweede lid» wordt gelezen «Artikel 26, zesde en zevende lid»,
      [21, eerste, tweede, vierde, vijfde en zesde lid][ref11], en [22][ref12] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel13
