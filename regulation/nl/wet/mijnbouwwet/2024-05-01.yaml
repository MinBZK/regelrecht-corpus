        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref4
        bwb_id: BWBR0014168
        artikel: 45p
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: 45q.1.b
    text: |-
      de verplichtingen van de exploitant of de eigenaar inzake eventuele opmerkingen van de inspecteur-generaal der
      mijnen over de inhoud en de wijzigingen van de kennisgevingen, bedoeld in de [artikelen 45m][ref1], [45n][ref2],
      [45o][ref3] en [45p][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45m
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel45n
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel45o
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel45p
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45q
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 45m
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 45n
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref3
        bwb_id: BWBR0014168
        artikel: 45o
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref4
        bwb_id: BWBR0014168
        artikel: 45p
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: 45q.2
    text: |-
      Bij ministeriële regeling worden regels gesteld over de wijze waarop kennisgevingen, bedoeld in de
      [artikelen 45m][ref1], [45n][ref2], [45o][ref3] en [45p][ref4], moeten worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45m
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel45n
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel45o
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel45p
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45q
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 45m
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 45n
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref3
        bwb_id: BWBR0014168
        artikel: 45o
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref4
        bwb_id: BWBR0014168
        artikel: 45p
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: '46.1'
    text: |-
      Onze Minister kan bepalen dat zekerheid gesteld dient te worden ter dekking van de aansprakelijkheid voor de schade
      die naar redelijke schatting ontstaat door beweging van de aardbodem als gevolg van het winnen van delfstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel46
  - number: '46.2'
    text: |-
      Op verzoek van Onze Minister wordt aan hem een goed onderbouwd rapport overgelegd, waaruit blijkt welke schade naar
      redelijke schatting zal ontstaan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel46
  - number: '46.3'
    text: |-
      Het bedrag en de termijn waarvoor en het tijdstip en de wijze waarop de zekerheid wordt gesteld, dienen ten
      genoegen van Onze Minister te zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel46
  - number: '46.4'
    text: Dit artikel is van overeenkomstige toepassing op het opsporen en winnen van aardwarmte en het opslaan van stoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel46
  - number: '46.5'
    text: |-
      Dit artikel geldt, tenzij in de desbetreffende vergunning anders is bepaald, niet met betrekking tot het winnen
      van delfstoffen of aardwarmte of het opslaan van stoffen in het continentaal plat en onder de territoriale zee,
      voorzover het winnen of het opslaan plaatsvindt vanuit of in een voorkomen dat gelegen is aan de zeezijde van de in
      de bijlage bij deze wet vastgelegde lijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel46
  - number: '46.6'
    text: |-
      [Artikel 41, vierde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat, indien een
      vergunning wordt overgedragen na het bekend worden van schade, de verplichtingen van dit artikel wat betreft
      die schade blijven rusten op degene die ten tijde van dat bekend worden de houder van de vergunning of de in
      [artikel 22][ref2] bedoelde aangewezen persoon was.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '47.1'
    text: |-
      Onze Minister kan bepalen dat de houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25][ref2],
      van een startvergunning aardwarmte of van een vervolgvergunning aardwarmte, binnen een door Onze Minister vast te
      stellen termijn zekerheid stelt aan de Staat der Nederlanden voor het verwijderen van een mijnbouwwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '47.2'
    text: |-
      De zekerheid wordt gesteld vanaf een tijdstip, voor een bedrag, met een termijn en op een wijze die Onze Minister
      voldoende acht.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel47
  - number: '47.3'
    text: Onze Minister kan een last onder dwangsom opleggen voor de handhaving van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel47
  - number: '47.4'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de houder van een ontheffing als bedoeld in
      [artikel 44b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44b
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 44b
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '48.1'
    text: |-
      Onze Minister kan bepalen dat de beheerder van een kabel of pijpleiding als bedoeld in [artikel 45][ref1] binnen
      een door Onze Minister vast te stellen termijn zekerheid stelt aan de Staat der Nederlanden voor het schoon en
      veilig achterlaten of het verwijderen van een kabel of pijpleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '48.2'
    text: |-
      De zekerheid wordt gesteld vanaf een tijdstip, voor een bedrag, met een termijn en op een wijze die Onze Minister
      voldoende acht.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel48
  - number: '48.3'
    text: Onze Minister kan een last onder dwangsom opleggen voor de handhaving van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel48
  - number: '48.4'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de houder van een ontheffing voor het verwijderen van een kabel
      of pijpleiding als bedoeld in [artikel 45, derde lid][ref1], in samenhang met [artikel 44b, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel44b
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 44b
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '49.1'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.1.a
    text: het opsporen van delfstoffen of aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.1.b
    text: het winnen van delfstoffen of aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.1.c
    text: het opslaan van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.1.d
    text: het instellen van een verkenningsonderzoek;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.1.e
    text: boorgaten dieper dan 500 meter beneden de oppervlakte van de aardbodem;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.1.f
    text: |-
      pijpleidingen en kabels die worden gebruikt ten behoeve van het opsporen of winnen van delfstoffen of aardwarmte,
      dan wel ten behoeve van het opslaan van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.1.g
    text: de stoffen die samen met CO, worden getransporteerd en opgeslagen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.1.h
    text: |-
      het geheel of gedeeltelijk uitsluiten van een gebied van de opsporing of winning van een delfstof of aardwarmte of
      het opslaan van stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.1.i
    text: de diepte waarop een activiteit plaatsvindt,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.1.j
    text: de soort activiteit, en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.1.k
    text: de soort delfstof of de soort stof die wordt opgeslagen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: '49.2'
    text: 'De in het eerste lid bedoelde regels kunnen worden gesteld ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.2.a
    text: |-
      een gebruik van ondergrond of planmatig beheer van voorkomens van delfstoffen, aardwarmte, andere natuurlijke
      rijkdommen, waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van
      stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.2.b
    text: de bescherming van de veiligheid voor omwonenden;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.2.c
    text: de bescherming van het milieu;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.2.d
    text: het voorkomen van schade aan gebouwen en infrastructurele werken of de functionaliteit daarvan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: '49.3'
    text: |-
      De in het eerste lid bedoelde regels kunnen voorts worden gesteld, voorzover de in het eerste lid bedoelde
      activiteiten plaatsvinden op of in het continentaal plat of de territoriale zee, ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.3.a
    text: |-
      de scheepvaart, de landsverdediging, de visserij, de opwekking van elektriciteit, het instandhouden van de levende
      rijkdommen van de zee, het zuiver wetenschappelijk onderzoek en het leggen en onderhouden van onderzeese kabels
      en pijpleidingen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.3.b
    text: de bescherming van historische, oudheidkundige en andere wetenschappelijke vondsten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: '49.4'
    text: |-
      De in het eerste lid bedoelde regels kunnen, voorzover die gesteld worden, inhouden het doen van een melding,
      het achterwege laten daarvan, het weigeren, wijzigen of intrekken van een vergunning, een ontheffing of een
      instemming, het stellen van beperkingen of het verbinden van voorschriften aan een vergunning, een ontheffing of
      een instemming, het aanwijzen van gevallen van tijdelijk buiten werking zijn van mijnbouwwerken en het aanwijzen
      van gevallen waarin een gedeelte van een mijnbouwwerk buiten werking is.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: '49.5'
    text: |-
      De in het eerste lid bedoelde regels kunnen mede betrekking hebben op het buiten gebruik stellen van een boorgat
      dan wel het buiten werking stellen, het verwijderen, het achterlaten of het hergebruiken van mijnbouwwerken, kabels
      en pijpleidingen, waaronder regels over:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.5.a
    text: meldingen en het overleggen van gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: 49.5.b
    text: |-
      het stellen van zekerheden voor de nakoming van verplichtingen tot verwijderen, tot achterlaten of tot het na
      hergebruik verwijderen van mijnbouwwerken, kabels en pijpleidingen die buiten werking zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: '49.6'
    text: |-
      De in het derde lid bedoelde regels, voorzover die gesteld worden ten behoeve van de scheepvaart, de opwekking
      van elektriciteit, de bescherming van historische, oudheidkundige en andere wetenschappelijke vondsten of de
      landsverdediging, kunnen beperkingen inhouden ten aanzien van de locaties waar de in het eerste lid bedoelde
      activiteiten plaats kunnen vinden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel49
  - number: '50'
    text: |-
      Onze Minister kan, in gevallen waarin ernstige aantasting van de in [artikel 49, tweede of derde lid][ref1],
      genoemde belangen ontstaat of dreigt te ontstaan, maatregelen voorschrijven ten aanzien van de in artikel 49,
      eerste en vijfde lid, bedoelde activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '51.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bescherming van de veiligheid met het oog op instorting
      regels worden gesteld omtrent het met gebruikmaking van een boorgat, tunnel, schacht of ander ondergronds werk
      onttrekken aan de ondergrond van:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel51
  - number: 51.1.a
    text: |-
      delfstoffen, voorzover deze op een diepte van minder dan 100 meter beneden de oppervlakte van de aardbodem aanwezig
      zijn;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel51
  - number: 51.1.b
    text: andere vaste stoffen dan kalksteen of delfstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel51
  - number: '51.2'
    text: 'De in het eerste lid bedoelde algemene maatregel van bestuur kan bepalen dat:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel51
  - number: 51.2.a
    text: de onttrekking van stoffen, bedoeld in het eerste lid, zonder vergunning van Onze Minister verboden is;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel51
  - number: 51.2.b
    text: Onze Minister bij de maatregel omschreven bevoegdheden heeft ter uitvoering van daarbij aangewezen regels.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel51
  - number: '51.3'
    text: |-
      Onze Minister kan, in gevallen waarin ernstige aantasting van de veiligheid met het oog op instorting ontstaat of
      dreigt te ontstaan, maatregelen voorschrijven ten aanzien van de in het eerste lid bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel51
  - number: '52.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bescherming van de veiligheid met het oog op instorting
      regels worden gesteld omtrent het met gebruikmaking van een boorgat, tunnel, schacht of ander ondergronds werk
      onttrekken aan de ondergrond van kalksteen alsmede omtrent het gebruik van een vorenbedoeld ondergronds werk voor
      andere doeleinden dan het onttrekken van kalksteen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel52
  - number: '52.2'
    text: 'De in het eerste lid bedoelde algemene maatregel van bestuur kan bepalen dat:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel52
  - number: 52.2.a
    text: |-
      het verrichten van de activiteiten, bedoeld in het eerste lid, zonder vergunning van gedeputeerde staten van de
      provincie waarin het werk geheel of voor het grootste deel is gelegen, verboden is;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel52
  - number: 52.2.b
    text: |-
      indien het betreft het gebruik van een ondergronds werk voor andere doeleinden dan het onttrekken van kalksteen,
      voor het verrichten van deze activiteiten geen vergunning maar een voorafgaande schriftelijke melding hiervan aan
      gedeputeerde staten van de provincie waarin het werk geheel of voor het grootste deel is gelegen, is vereist;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel52
  - number: 52.2.c
    text: |-
      gedeputeerde staten van de provincie waarin het werk geheel of voor het grootste deel is gelegen bij de maatregel
      omschreven bevoegdheden hebben ter uitvoering van daarbij aangewezen regels.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel52
  - number: '52.3'
    text: |-
      Provinciale staten van de provincie waarin het werk geheel of voor het grootste deel is gelegen, kunnen in geval
      van een meldingsplicht regels stellen voor het gebruik van een ondergronds werk voor andere doeleinden dan het
      onttrekken van kalksteen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel52
  - number: '52.4'
    text: |-
      Gedeputeerde staten van de provincie waarin het werk geheel of voor het grootste deel is gelegen, kunnen, in
      gevallen waarin ernstige aantasting van de veiligheid met het oog op instorting ontstaat of dreigt te ontstaan,
      maatregelen voorschrijven ten aanzien van de in het eerste lid bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel52
  - number: 52a
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder *winningsvergunning Groningenveld:* op
      basis van het koninklijk besluit van 30 mei 1963, nr. 39 (Stcrt. 126) verleende winningsvergunning voor zover het
      het Groningenveld betreft.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel52a
  - number: 52b
    text: |-
      De [artikelen 21, derde lid, tweede volzin][ref1], [33][ref2], [34][ref3], [35][ref4] en [36][ref5] zijn niet van
      toepassing op de houder van de winningsvergunning Groningenveld voor zover het betreft de winning van gas uit het
      Groningenveld.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Artikel36
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref5
        bwb_id: BWBR0014168
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 52c.1
    text: Er wordt geen gas meer gewonnen uit het Groningenveld.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel52c
  - number: 52c.2
    text: |-
      Na de beëindiging van de gaswinning uit het Groningenveld, bedoeld in het eerste lid, dragen Onze Minister en het
      Instituut Mijnbouwschade Groningen, bedoeld in [artikel 2, eerste lid, van de Tijdelijke wet Groningen][ref1] er
      bij de uitvoering van hun taken op grond van die wet zorg voor dat er als gevolg van deze beëindiging geen grotere
      verschillen in behandeling ontstaan tussen gedupeerden van de gaswinning met betrekking tot de afhandeling van
      schade, bedoeld in artikel 2, derde lid, van die wet, versterking als bedoeld in [hoofdstuk 5 van die wet][ref2],
      verduurzaming en andere compensatie.


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0043252#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel52c
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0043252
        hoofdstuk: '5'
  - number: 52g.1
    text: |-
      De houder van de winningsvergunning Groningenveld dan wel indien deze vergunning haar gelding heeft verloren, de
      laatste houder daarvan, neemt alle maatregelen die redelijkerwijs van hem kunnen worden gevergd om:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel52g
  - number: 52g.1.a
    text: |-
      na beëindiging van de gaswinning uit het Groningenveld de nadelige gevolgen van die winning zoveel mogelijk te
      voorkomen en te beperken;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel52g
  - number: 52g.1.b
    text: |-
      te voorkomen dat als gevolg van een mijnbouwwerk dat buiten werking is nadelige gevolgen voor mens en milieu worden
      veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel52g
  - number: '53'
    text: |-
      Deze afdeling is van toepassing op de heffing en invordering van oppervlakterecht, cijns en winstaandeel van de
      houder of medehouder van een vergunning voor het opsporen of winnen van koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel53
  - number: '54'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel54
  - number: 54.a
    text: 'medehouderschap: geval waarin de vergunning wordt gehouden door meer dan één natuurlijke persoon of rechtspersoon;'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel54
  - number: 54.b
    text: 'medehouder: ieder van de in onderdeel a bedoelde natuurlijke personen of rechtspersonen;'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel54
  - number: 54.c
    text: |-
      de aangewezen medehouder: de in [artikel 22][ref1] bedoelde aangewezen persoon;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 54.d
    text: |-
      de landzijde: het deel van het Nederlands territoir dat ligt aan de landzijde van de in de bijlage bij deze wet
      vastgelegde lijn;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel54
  - number: 54.e
    text: |-
      de zeezijde: het continentaal plat en het deel van het Nederlands territoir dat ligt aan de zeezijde van de in de
      bijlage bij deze wet vastgelegde lijn;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel54
  - number: 54.f
    text: |-
      de inspecteur: de door Onze Minister van Financiën bij ministeriële regeling aangewezen functionaris van de
      rijksbelastingdienst;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel54
  - number: 54.g
    text: |-
      de ontvanger: de door Onze Minister van Financiën bij ministeriële regeling aangewezen functionaris van de
      rijksbelastingdienst.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel54
  - number: '55.1'
    text: |-
      Een wijziging in [paragraaf 5.1.1.2.][ref1], met uitzondering van een wijziging die het gevolg is van toepassing
      van [artikel 58, derde lid][ref2], is niet van toepassing op de houder van een voor de inwerkingtreding van die
      wijziging verleende opsporingsvergunning, tenzij die houder om toepassing van de gewijzigde paragraaf verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel58
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.1.1.2
        afdeling: 5.1.1
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '58'
        hoofdstuk: '5'
        paragraaf: 5.1.1.2
        afdeling: 5.1.1
  - number: '55.2'
    text: |-
      Een wijziging in [paragraaf 5.1.1.2.][ref1], met uitzondering van een wijziging die het gevolg is
      van toepassing van [artikel 58, derde lid][ref2], in [paragraaf 5.1.1.3.][ref3], met uitzondering van
      [artikel 63, zesde en zevende lid][ref4], of in [paragraaf 5.1.1.4.][ref5], met uitzondering van
      [artikel 68, eerste lid][ref6], is niet van toepassing op de houder van een voor de inwerkingtreding van die
      wijziging verleende winningsvergunning, tenzij die houder om toepassing van de gewijzigde paragrafen verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel63
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref6]: https://wetten.overheid.nl/BWBR0014168#Artikel68
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.1.1.2
        afdeling: 5.1.1
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '58'
        hoofdstuk: '5'
        paragraaf: 5.1.1.2
        afdeling: 5.1.1
      - id: ref3
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.1.1.3
        afdeling: 5.1.1
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '63'
        hoofdstuk: '5'
        paragraaf: 5.1.1.3
        afdeling: 5.1.1
      - id: ref5
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
      - id: ref6
