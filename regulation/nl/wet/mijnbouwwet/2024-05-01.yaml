      bedoeld in die artikelen, indien de desbetreffende opsporingsvergunning een opsporingsvergunning is als bedoeld in
      [artikel 143][ref3], die is verleend overeenkomstig het koninklijk besluit van 6 februari 1976, houdende uitvoering
      van artikel 12 van de Mijnwet continentaal plat ten aanzien van opsporings- en winningsvergunningen voor of mede
      voor aardolie of aardgas (Stb. 102).


