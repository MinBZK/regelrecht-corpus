  - number: '68.2'
    text: |-
      Voor de toepassing van het eerste lid wordt in de genoemde artikelen van de [Wet inkomstenbelasting 2001][ref1] en
      van de [Wet op de vennootschapsbelasting 1969][ref2] voor «onderneming» gelezen: winningsbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002672
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002672
  - number: '68.3'
    text: |-
      Bij het opmaken van de winst- en verliesrekening, bedoeld in [artikel 66, eerste lid][ref1], wordt een verhoging
      van 10% toegepast op de kosten met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 68.3.a
    text: |-
      door de houder van de winningsvergunning aan de staat verschuldigde belastingen en andere
      Nederlandse publiekrechtelijke lasten met uitzondering van een heffing als bedoeld in
      [artikel 15, eerste lid, van de Tijdelijke wet Groningen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0043252#Artikel15
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0043252
        artikel: '15'
  - number: 68.3.b
    text: |-
      afschrijving op de koopsom ter zake van de overname van een winningsvergunning, voorzover deze koopsom de door de
      overdrager van die vergunning nog niet reeds ten laste van een winst- en verliesrekening gebrachte kosten te boven
      gaat;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68
  - number: 68.3.c
    text: |-
      dotaties aan de voorziening ter zake van de uit een overgenomen winningsvergunning voortvloeiende
      ontmantelingsverplichting, voorzover reeds door de overdrager van die vergunning dotaties zijn gepleegd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68
  - number: '68.4'
    text: |-
      Voorzover bij of krachtens de [Wet inkomstenbelasting 2001][ref1] of de
      [Wet op de vennootschapsbelasting 1969][ref2] de bevoegdheid is verleend om bij algemene maatregel van bestuur
      onderscheidenlijk bij ministeriële regeling regels te stellen en het voor een goede afstemming van het eerste lid,
      op die regels nodig is om dit artikel aan te passen, kan bij algemene maatregel van bestuur, onderscheidenlijk bij
      ministeriële regeling van Onze Minister in overeenstemming met Onze Minister van Financiën, deze aanpassing worden
      geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002672
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002672
  - number: 68a.1
    text: |-
      Als een houder van een vergunning investeert in een niet verplaatsbaar mijnbouwwerk, voor de opsporing of winning
      van een voorkomen van koolwaterstoffen kan de houder en, ingeval van medehouderschap, de medehouder bij de
      berekening van de heffingsmaatstaf, bedoeld in [artikel 66, eerste lid][ref1], aanvullend 40% van zijn deel van
      het investeringsbedrag ten laste brengen van het resultaat.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 68a.2
    text: 'Onder investeren wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68a
  - number: 68a.2.a
    text: |-
      het aangaan van verplichtingen voor en het maken van kosten voor het aanschaffen van een ten aanzien van het
      voorkomen niet eerder gebruikt mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68a
  - number: 68a.2.b
    text: het maken van voortbrengingskosten voor een ten aanzien van het voorkomen niet eerder gebruikt mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68a
  - number: 68a.2.c
    text: het maken van kosten voor het aanpassen of verbeteren van een mijnbouwwerk en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68a
  - number: 68a.2.d
    text: |-
      het maken van kosten voor het aanleggen, het uitbreiden en het wijzigen van een boorgat, waaronder, in voorkomend
      geval, de kosten van het huren of gebruiken van een verplaatsbaar mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68a
  - number: 68a.3
    text: |-
      [Artikel 8, achtste lid, aanhef en onderdeel b en c, van de Wet op de vennootschapsbelasting 1969][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel8
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '8'
  - number: 68a.4
    text: |-
      Als de houder van de vergunning aan het einde van het boekjaar het mijnbouwwerk, dan wel de aanpassing of
      verbetering van het mijnbouwwerk, nog niet in gebruik heeft genomen en de investeringsaftrek, bedoeld in het eerste
      lid, zou uitgaan boven het bedrag dat aan het einde van het jaar voor de investering is betaald, wordt in afwijking
      van het eerste lid voor de berekening van de investeringsaftrek een bedrag in aanmerking genomen dat gelijk is aan
      de betaling en wordt het meerdere in aanmerking genomen in de volgende jaren, voor zover betalingen plaatsvinden,
      maar niet later dan in het jaar waarin het mijnbouwwerk, dan wel de aanpassing of verbetering van het mijnbouwwerk,
      in gebruik wordt genomen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68a
  - number: 68a.5
    text: |-
      Als de houder of, ingeval van medehouderschap, de medehouder van een opsporingsvergunning niet tevens houder,
      respectievelijk medehouder, is van een winningsvergunning, kan deze houder of medehouder de in het eerste lid
      bedoelde investeringsaftrek ten laste van het resultaat brengen in het eerste jaar waarin hij houder of medehouder
      is van een winningsvergunning. Het vierde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68a
  - number: 68b
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van [artikel 68a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel68a
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel68b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 68a
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: '69.1'
    text: Het tarief bedraagt 50%.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel69
  - number: '69.2'
    text: |-
      Het door de houder of de medehouder verschuldigde bedrag aan winstaandeel over een boekjaar wordt, voorzover
      mogelijk, verminderd met het op dat boekjaar betrekking hebbende verrekenbare bedrag dat wordt berekend op de in
      het derde lid aangegeven wijze. Indien niet het gehele verrekenbare bedrag in mindering kan worden gebracht, wordt
      het overschot opgeteld bij het verrekenbare bedrag over het volgende boekjaar. Indien het verrekenbare bedrag
      negatief is, wordt dit in mindering gebracht op het verrekenbare bedrag over het volgende boekjaar.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel69
  - number: '69.3'
    text: 'Onder het verrekenbare bedrag, bedoeld in het tweede lid, wordt verstaan het bedrag dat wordt verkregen door:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel69
  - number: 69.3.a
    text: |-
      het resultaat van de winst- en verliesrekening over het boekjaar te bepalen, met dien verstande dat daarbij
      [artikel 68, derde lid][ref1], buiten beschouwing wordt gelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel68
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '68'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 69.3.b
    text: |-
      dit resultaat te verminderen met het over het boekjaar na toepassing van dit artikel te betalen bedrag aan
      winstaandeel;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel69
  - number: 69.3.c
    text: op dit verschil het voor het boekjaar geldende tarief van de vennootschapsbelasting toe te passen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel69
  - number: '69.4'
    text: |-
      Het tweede lid is niet van toepassing indien de houder of de medehouder ter zake van het met het winningsbedrijf
      behaalde resultaat niet is onderworpen aan de Nederlandse belastingheffing.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel69
  - number: '70.1'
    text: Winstaandeel wordt geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel70
  - number: '70.2'
    text: |-
      De houder, of, ingeval van medehouderschap, ieder van de medehouders, zendt gelijktijdig met de aangifte
      voor de vennootschapsbelasting over een boekjaar aan de inspecteur een over dat boekjaar opgemaakte winst- en
      verliesrekening als bedoeld in [artikel 66, eerste lid][ref1], en een berekening van het op dat boekjaar betrekking
      hebbende verrekenbare bedrag, bedoeld in [artikel 69, tweede lid][ref2], alsmede een balans, vermeldende de aan het
      eind van het boekjaar tot het winningsbedrijf behorende activa en passiva.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel69
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '69'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: '71'
    text: De afdrachten, bedoeld in deze afdeling, worden geheven door de inspecteur en ingevorderd door de ontvanger.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel71
  - number: '72'
    text: |-
      Onverminderd het overigens bij of krachtens deze paragraaf bepaalde geschieden de heffing
      en de invordering van oppervlakterecht, cijns en winstaandeel met overeenkomstige toepassing
      van de [Algemene wet inzake rijksbelastingen][ref1], de [Invorderingswet 1990][ref2] en de
      [Kostenwet invordering rijksbelastingen][ref3] en de op die wetten berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
      - id: ref3
        bwb_id: BWBR0002645
  - number: '73.1'
    text: |-
      De [artikelen 30f][ref1], [30fa][ref2], [30fb][ref3], [30fc][ref4], [30fd][ref5], [30fe][ref6] en
      [30hb, van de Algemene wet inzake rijksbelastingen][ref7] zijn van overeenkomstige toepassing op de berekening van
      de belastingrente met betrekking tot het winstaandeel.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30f
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30fa
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel30fb
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel30fc
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel30fd
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel30fe
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Artikel30hb
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30f
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 30fa
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 30fb
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 30fc
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 30fd
      - id: ref6
        bwb_id: BWBR0002320
        artikel: 30fe
      - id: ref7
        bwb_id: BWBR0002320
        artikel: 30hb
  - number: '73.2'
    text: |-
      De [artikelen 30h][ref1] en [30hb van de Algemene wet inzake rijksbelastingen][ref2] zijn van overeenkomstige
      toepassing op de berekening van de belastingrente met betrekking tot de cijns en het oppervlakterecht.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30h
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30hb
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30h
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 30hb
  - number: '74.1'
    text: |-
      De inspecteur en de ontvanger verstrekken desgevraagd aan Onze Minister kosteloos de voor de uitvoering van deze
      wet benodigde inlichtingen en gegevens.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel74
  - number: '74.2'
    text: |-
      De inspecteur en de ontvanger verlenen aan de door Onze Minister aangewezen personen toegang tot en inzage in alle
      gegevens die Onze Minister nodig heeft voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel74
  - number: '75'
    text: |-
      Op deze afdeling zijn de onderdelen a tot en met e van [artikel 54][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel54
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '54'
        hoofdstuk: '5'
        paragraaf: 5.1.1.1
        afdeling: 5.1.1
  - number: '76.1'
    text: |-
      De houder van een winningsvergunning die een terrein binnen een provincie in gebruik neemt voor het winnen van
      koolwaterstoffen, waarbij binnen het terrein voor het winnen benodigde mijnbouwwerken aanwezig zijn, is een
      eenmalige afdracht verschuldigd aan de provincie.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel76
  - number: '76.2'
    text: Bij medehouderschap is de afdracht verschuldigd door de aangewezen medehouder.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel76
  - number: '77.1'
    text: |-
      De heffingsmaatstaf van de afdracht, bedoeld in [artikel 76][ref1], is de oppervlakte van het in artikel 76, eerste
      lid, bedoelde terrein.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel76
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '76'
        hoofdstuk: '5'
        afdeling: 5.1.2
  - number: '77.2'
    text: |-
      Het tarief over 2003 bedraagt € 4,50 per vierkante meter. [Artikel 58, derde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel58
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '58'
        hoofdstuk: '5'
        paragraaf: 5.1.1.2
        afdeling: 5.1.1
  - number: '78'
    text: |-
      Gedeputeerde staten stellen de afdracht vast en maken het verschuldigde bedrag aan de houder of de aangewezen
      medehouder bekend.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel78
  - number: '79'
    text: |-
      Onverminderd het bij of krachtens deze afdeling bepaalde geschieden de heffing en invordering van de
      afdracht aan de provincie met overeenkomstige toepassing van de [artikelen 11][ref1], [12][ref2], [14][ref3],
      [17, eerste lid][ref4], [28, eerste en tweede lid][ref5], en [29 van de Invorderingswet 1990][ref6] met dien
      verstande dat gedeputeerde staten in de plaats treden van de ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel28
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel29
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '17'
      - id: ref5
        bwb_id: BWBR0004770
        artikel: '28'
      - id: ref6
        bwb_id: BWBR0004770
        artikel: '29'
  - number: '80'
    text: |-
      Indien een afdracht aan de provincie op een later tijdstip op een ander bedrag wordt vastgesteld,
      wordt bij die latere vaststelling de rentederving in rekening gebracht die voor de betrokkene of voor
      de provincie uit die latere vaststelling voortvloeit. Daarbij wordt een enkelvoudige rente in rekening
      gebracht, waarvan het percentage gelijk is aan het percentage van de belastingrente, bedoeld in
      [artikel 30hb van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30hb
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30hb
  - number: '81'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel81
  - number: 81.a
    text: |-
      de vennootschap: de vennootschap, bedoeld in [artikel 82, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel82
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '82'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
  - number: 81.b
    text: |-
      opsporingswerkzaamheden: werkzaamheden die op grond van een opsporingsvergunning worden of kunnen worden verricht
      of werkzaamheden die voortvloeien uit het doen van verkenningsonderzoeken naar de aanwezigheid van koolwaterstoffen
      binnen het vergunningsgebied, dan wel naar nadere gegevens omtrent die koolwaterstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel81
  - number: 81.c
    text: |-
      mijnbouwwerkzaamheden: winnings- en opsporingswerkzaamheden die op grond van een winningsvergunning worden
      of kunnen worden verricht of werkzaamheden die voortvloeien uit het doen van verkenningsonderzoeken naar
      de aanwezigheid van koolwaterstoffen binnen het vergunningsgebied, dan wel naar nadere gegevens omtrent die
      koolwaterstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel81
  - number: 81.d
    text: |-
      opsporingsovereenkomst: een overeenkomst van samenwerking tussen de houder van een opsporingsvergunning en de
      vennootschap inzake het verrichten van opsporingswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel81
  - number: 81.e
    text: |-
      mijnbouwovereenkomst: een overeenkomst van samenwerking tussen de houder van een winningsvergunning en de
      vennootschap inzake het verrichten van mijnbouwwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel81
  - number: '82.1'
    text: |-
      In het belang van een doelmatige opsporing en winning, een planmatig beheer en een optimale afzet van
      koolwaterstoffen, wijst Onze Minister een naamloze of een besloten vennootschap met beperkte aansprakelijkheid,
      waarvan alle aandelen middellijk of onmiddellijk aan de staat behoren, aan, die tot taak heeft:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel82
  - number: 82.1.a
    text: |-
      het deelnemen in opsporingswerkzaamheden op grond van opsporingsovereenkomsten, overeenkomstig
      [paragraaf 5.2.2.][ref1] van deze afdeling;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 82.1.b
    text: |-
      het deelnemen in mijnbouwwerkzaamheden op grond van mijnbouwovereenkomsten, overeenkomstig [paragraaf 5.2.3.][ref1]
      van deze afdeling, met inbegrip van daarmee rechtstreeks verbonden werkzaamheden, waaronder in ieder geval worden
      begrepen behandeling, transport en verkoop van de gewonnen koolwaterstoffen*;*


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
  - number: 82.1.c
    text: |-
      het sluiten van overeenkomsten, bedoeld in [artikel 97d, eerste en derde lid][ref1], met inbegrip van daarmee
      rechtstreeks verbonden werkzaamheden, waaronder het begeleiden, bewaken en monitoren van het systeem van
      overeenkomsten, bedoeld in artikel 97d, eerste, tweede en derde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel97d
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 97d
        hoofdstuk: '5'
        paragraaf: 5.2.4
        afdeling: '5.2'
  - number: 82.1.d
    text: |-
      het verstrekken van inlichtingen aan Onze Minister over de vaststelling, toepassing en uitvoering van de
      overeenkomsten, bedoeld in [artikel 97d, eerste, tweede en derde lid][ref1], alsmede over de aard en omvang van de
      door een houder van een vergunning gestelde of te stellen financiële zekerheden;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel97d
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 97d
        hoofdstuk: '5'
        paragraaf: 5.2.4
        afdeling: '5.2'
  - number: 82.1.e
    text: |-
      het verstrekken van inlichtingen aan Onze Minister, indien informatie over financiële zekerheden, informatie over
      zeggenschap dan wel andere informatie daartoe aanleiding geeft;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel82
  - number: 82.1.f
    text: |-
      het uitvoeren van de taken, het uitoefenen van de rechten en het voldoen aan de verplichtingen die voor de
      vennootschap voortvloeien uit de overeenkomst van samenwerking, bedoeld in artikel 11, eerste lid, van het
      koninklijk besluit van 30 mei 1963, nummer 39 (Stcrt. 126) en de daarmee verband houdende regelingen en
      overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel82
  - number: 82.1.g
    text: |-
      Onze Minister desgevraagd de inlichtingen te verstrekken die nodig zijn voor de beoordeling van de uitvoerbaarheid
      van voorgenomen energiebeleid, in het bijzonder ten aanzien van opsporing, winning, beëindiging van opsporing en
      winning, alsmede het beheer en afzet van koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel82
  - number: '82.2'
    text: |-
      In het belang van kennisdeling en -borging wijst Onze Minister een naamloze of een besloten vennootschap met
      beperkte aansprakelijkheid, waarvan alle aandelen middellijk of onmiddellijk aan de staat behoren, aan, die tot
      taak heeft het deelnemen in werkzaamheden voor opsporing en winning van aardwarmte op grond van overeenkomsten,
      overeenkomstig [artikel 86a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel86a
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 86a
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
  - number: '82.3'
    text: |-
      Onverminderd het eerste lid, kunnen de vennootschap bij besluit van Onze Minister andere taken dan de taken,
      bedoeld in het eerste lid, worden opgedragen in het algemeen belang van het klimaat- en energiebeleid. Bij of
      krachtens algemene maatregel van bestuur worden de algemene belangen omschreven ten behoeve waarvan en de gevallen
      waarin Onze Minister de vennootschap een opdracht als bedoeld in de eerste volzin kan geven. Onze Minister kan aan
      een besluit tot het geven van een opdracht voorschriften en beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel82
  - number: '82.4'
    text: |-
      De vennootschap verricht middellijk of onmiddellijk geen andere activiteiten dan activiteiten ter uitvoering
      van de taken, bedoeld in het eerste en derde lid, tenzij Onze Minister daarmee heeft ingestemd. Onze Minister
      kan voorschriften en beperkingen verbinden aan zijn instemming. De instemming wordt slechts verleend indien die
      activiteiten en de uitvoering daarvan:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel82
  - number: 82.4.a
    text: nauw verwant zijn aan de activiteiten ter uitvoering van de taken, bedoeld in het eerste en derde lid,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel82
  - number: 82.4.b
    text: een goede uitvoering van die taken niet belemmeren of anderszins bemoeilijken, en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel82
  - number: 82.4.c
    text: mede het algemeen belang van het klimaat- en energiebeleid dienen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel82
  - number: '82.5'
    text: |-
      Onze Minister kan een besluit tot het geven van een opdracht als bedoeld in het derde lid onderscheidenlijk een
      besluit tot instemming als bedoeld in het vierde lid intrekken of wijzigen indien niet meer wordt voldaan aan de
      voorwaarden voor het geven van die opdracht onderscheidenlijk het verlenen van die instemming als bedoeld in het
      derde onderscheidenlijk het vierde lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel82
  - number: '83.1'
    text: |-
      Indien de vennootschap activiteiten als bedoeld in [artikel 82, vierde lid][ref1], verricht, is zij verplicht, al
      dan niet op geconsolideerde basis, een afzonderlijke boekhouding te voeren voor die activiteiten enerzijds en de
      activiteiten ter uitvoering van haar taken, bedoeld in [artikel 82, eerste, tweede en derde lid][ref2], anderzijds.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel82
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '82'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '82'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
  - number: '83.2'
    text: 'De afzonderlijke boekhouding is zodanig ingericht dat:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel83
  - number: 83.2.a
    text: de registratie van de lasten en baten van de verschillende activiteiten gescheiden zijn;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel83
  - number: 83.2.b
    text: |-
      alle lasten en baten, op grond van consequent toegepaste en objectief te rechtvaardigen beginselen inzake
      kostprijsadministratie, correct worden toegerekend;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel83
  - number: 83.2.c
    text: de beginselen inzake kostprijsadministratie volgens welke de boekhouding wordt gevoerd, duidelijk zijn vastgelegd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel83
  - number: '83.3'
    text: |-
      De baten die de vennootschap behaalt met de uitvoering van de taken, bedoeld in
      [artikel 82, eerste, tweede of derde lid][ref1], worden niet gebruikt voor financiering van de activiteiten,
      bedoeld in [artikel 82, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel82
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '82'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '82'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
  - number: '83.4'
    text: |-
      De vennootschap verricht activiteiten als bedoeld in [artikel 82, vierde lid][ref1], tegen marktconforme tarieven
      en voorwaarden en op basis van een integrale doorberekening van alle kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel82
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '82'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
  - number: '84'
    text: |-
      De statuten van de vennootschap en elke wijziging van die statuten behoeven goedkeuring van Onze Minister. Hij
      onthoudt zijn goedkeuring slechts als door de statuten naar zijn oordeel een behoorlijke vervulling van de taken,
      genoemd in [artikel 82, eerste, tweede en derde lid][ref1], onvoldoende is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel82
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '82'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
  - number: '85'
    text: |-
      Onze Minister kan de vennootschap aanwijzingen geven in het belang van een goede vervulling van de in
      [artikel 82, eerste, tweede en derde lid][ref1], bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel82
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '82'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
  - number: '86.1'
    text: |-
      De vennootschap verschaft Onze Minister alle gegevens en inlichtingen die hij nodig heeft voor de uitvoering van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel86
  - number: '86.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de te verstrekken gegevens en inlichtingen en
      omtrent de wijze en het tijdstip waarop de gegevens en inlichtingen moeten worden verschaft.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel86
  - number: 86a.1
    text: |-
      De houder van een toewijzing zoekgebied aardwarmte en de op grond van [artikel 82, tweede lid][ref1], aangewezen
      vennootschap brengen een overeenkomst tot stand gericht op deelname door die aangewezen vennootschap in de
      voorgenomen werkzaamheden voor opsporing en winning van aardwarmte, tenzij Onze Minister bepaalt dat deze
      verplichting niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel82
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel86a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '82'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
  - number: 86a.2
    text: |-
      De overeenkomst wordt gesloten binnen een jaar na de verlening van de toewijzing zoekgebied aardwarmte. Onze
      Minister kan deze termijn eenmaal met ten hoogste een jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel86a
  - number: 86a.3
    text: De overeenkomst en wijzigingen daarin behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel86a
  - number: 86a.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake de deelname en de overeenkomst,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel86a
  - number: '87.1'
    text: |-
      De vennootschap verleent op verzoek van de houder van een opsporingsvergunning medewerking aan de totstandkoming
      van een opsporingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel87
  - number: '87.2'
    text: |-
      De opsporingsovereenkomst komt binnen een periode van zes maanden tot stand, ingaande op het tijdstip waarop de
      vergunninghouder een verzoek als bedoeld in het eerste lid heeft gedaan. Onze Minister kan de termijn van zes
      maanden eenmaal met ten hoogste zes maanden verlengen. De opsporingsovereenkomst behoeft de instemming van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel87
  - number: '87.3'
    text: De opsporingsovereenkomst kan niet worden gewijzigd of ontbonden dan na instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel87
  - number: '88'
    text: |-
      In de opsporingsovereenkomst worden bepalingen opgenomen, die ertoe strekken dat ten behoeve van de
      opsporingswerkzaamheden wordt samengewerkt, waarbij:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel88
  - number: 88.a
    text: de vergunninghouder voor 60% en de vennootschap voor 40% belang neemt;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel88
  - number: 88.b
    text: |-
      de werken die door het doen van de in [artikel 90, eerste lid, onderdeel a][ref1], bedoelde investeringen tot stand
      zijn gekomen voor 60% toebehoren aan de vergunninghouder en voor 40% aan de vennootschap;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel90
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '90'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 88.c
    text: |-
      de vergunninghouder en de vennootschap ten behoeve van de samenwerking, in verhouding tot ieders belang
      in de samenwerking, de middelen verstrekken die bestemd zijn voor het doen van de uitgaven, bedoeld in
      [artikel 90, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel90
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '90'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 88.d
    text: op de overeenkomst Nederlands recht van toepassing is.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel88
  - number: '89'
    text: 'In de opsporingsovereenkomst worden bepalingen opgenomen die de vergunninghouder ertoe verplichten:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel89
  - number: 89.a
    text: |-
      de voor hem uit de vergunning voortvloeiende rechten uit te oefenen ten behoeve van de samenwerking en
      overeenkomstig de gezamenlijke besluiten die met inachtneming van [artikel 91][ref1] zijn genomen door de
      vergunninghouder en de vennootschap;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel91
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '91'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 89.b
    text: |-
      het door hem aangaan, wijzigen of beëindigen van duurzame samenwerking met derden ter zake van verkenning en
      opsporing te onderwerpen aan goedkeuring door de vergunninghouder en de vennootschap gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel89
  - number: 89.c
    text: |-
      aan de samenwerking ten goede te doen komen zijn kennis en ervaring op het gebied van verkenning, opsporing,
      winning en afzet van koolwaterstoffen en daarmee samenhangende gebieden zoals het transport, de opslag en de
      behandeling daarvan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel89
  - number: '90.1'
    text: 'In de opsporingsovereenkomst worden bepalingen opgenomen die de vennootschap ertoe verplichten:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel90
  - number: 90.1.a
    text: |-
      aan de vergunninghouder te vergoeden 40% van de uitgaven van de vergunninghouder die in overeenstemming met
      [artikel 91][ref1] zijn goedgekeurd of in overeenstemming zijn met een goedgekeurd jaarlijks investerings- en
      financieringsplan;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel91
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '91'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 90.1.b
    text: niet te beletten dat besluiten van de vergunninghouder gebaseerd worden op normale commerciële overwegingen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel90
  - number: 90.1.c
    text: |-
      zijn stem bij de besluitvorming volgens [artikel 91][ref1] uit te brengen op grond van transparante, objectieve en
      niet-discriminerende beginselen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel91
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '91'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: '90.2'
    text: |-
      In de overeenkomst worden bepalingen opgenomen die ertoe strekken dat ten aanzien van besluiten, inhoudende bij wie
      opdrachten worden geplaatst voor leveringen, voor de uitvoering van werken en voor het verrichten van diensten:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel90
  - number: 90.2.a
    text: de vergunninghouder niet verplicht is vooraf aan de vennootschap informatie te geven over het te nemen besluit;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel90
  - number: 90.2.b
    text: de vennootschap geen stem uitbrengt bij het nemen van het besluit.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel90
  - number: '91'
    text: 'In de opsporingsovereenkomst worden bepalingen opgenomen die ertoe strekken dat:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel91
  - number: 91.a
    text: |-
      een gezamenlijk besluit van de vergunninghouder en de vennootschap wordt genomen in een vergadering, waarin de
      vergunninghouder en de vennootschap worden vertegenwoordigd door een aantal gevolmachtigde personen, in verhouding
      tot ieders belang in de samenwerking;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel91
  - number: 91.b
    text: |-
      een gezamenlijk besluit van de vergunninghouder en de vennootschap, in afwijking van onderdeel a, buiten
      vergadering kan worden genomen, mits dit gebeurt bij een gezamenlijke schriftelijke verklaring of bij een
      gelijkluidende schriftelijke verklaring van de vergunninghouder en de vennootschap, door deze of hun gevolmachtigde
      vertegenwoordigers ondertekend;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel91
  - number: 91.c
    text: |-
      een gezamenlijk besluit van de vergunninghouder en de vennootschap, waarbij de vennootschap en, als de vergunning
      door meerdere personen gehouden wordt, de persoon, bedoeld in [artikel 22, vijfde lid][ref1], elk een beslissende
      stem hebben, vereist is voor:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 91.c.1°
    text: het jaarlijkse investerings- en financieringsplan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel91
  - number: 91.c.2°
    text: |-
      niet in het jaarlijkse investerings- en financieringsplan opgenomen activiteiten en aanschaffingen, die een bedrag
      van € 500 000 te boven gaan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel91
  - number: 91.c.3°
    text: de meerjarenplanning ten aanzien van opsporingswerkzaamheden binnen het vergunningsgebied.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel91
  - number: '92'
    text: |-
      De vergunninghouder neemt geen besluit, inhoudende bij wie opdrachten worden geplaatst voor leveringen, voor het
      uitvoeren van werken of voor het verrichten van diensten, indien aannemelijk is dat dit besluit leidt tot:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel92
  - number: 92.a
    text: financieel nadeel voor de staat, voorzover het betreft hetgeen ingevolge dit hoofdstuk is verschuldigd, of
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel92
  - number: 92.b
    text: financieel nadeel voor de vennootschap.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel92
  - number: '93.1'
    text: |-
      De houder van een winningsvergunning voor koolwaterstoffen en de vennootschap brengen een mijnbouwovereenkomst
      tot stand, tenzij Onze Minister bij de vergunningverlening heeft bepaald dat deze verplichting niet geldt. Onze
      Minister bepaalt uitsluitend dat de verplichting, bedoeld in de vorige volzin, niet geldt als de staat door de
      overeenkomst naar redelijke schatting financieel nadeel zal lijden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel93
  - number: '93.2'
    text: |-
      De overeenkomst komt binnen een jaar na de verlening van de vergunning tot stand. Onze Minister kan de termijn van
      een jaar eenmaal met ten hoogste een jaar verlengen. De overeenkomst behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel93
  - number: '93.3'
    text: |-
      Tot het tijdstip waarop de instemming wordt verleend, verricht de vergunninghouder geen winningswerkzaamheden. Tot
      dat tijdstip behoeven besluiten als bedoeld in [artikel 97, tweede lid][ref1], de instemming van de vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel97
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '97'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
  - number: '93.4'
    text: |-
      [Artikel 87, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel87
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '87'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: '94.1'
    text: |-
      [Artikel 88][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel88
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '88'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: '94.2'
    text: |-
      Voorts worden in de overeenkomst bepalingen opgenomen, die ertoe strekken dat ten behoeve van de
      mijnbouwwerkzaamheden wordt samengewerkt, waarbij:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel94
  - number: 94.2.a
    text: |-
      de vergunninghouder en de vennootschap de verdeling van de uit de voorkomens gewonnen en beschikbare hoeveelheden
      koolwaterstoffen vaststellen op 60% voor de vergunninghouder, respectievelijk 40% voor de vennootschap;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel94
  - number: 94.2.b
    text: |-
      zowel de vergunninghouder als de vennootschap gerechtigd is het eigen aandeel in de gewonnen en beschikbare
      hoeveelheden koolwaterstoffen in natura op te nemen, met dien verstande dat zij ernaar streven zoveel mogelijk
      samen te werken bij de verkoop van de gewonnen en beschikbare hoeveelheden koolwaterstoffen uit de voorkomens;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel94
  - number: 94.2.c
    text: de vergunninghouder en de vennootschap ten behoeve van de afzet regelmatig overleg plegen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel94
  - number: '94.3'
    text: 'In de overeenkomst wordt het bedrag vastgesteld van de door de vergunninghouder reeds gemaakte kosten:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel94
  - number: 94.3.a
    text: |-
      die naar redelijkheid kunnen worden toegeschreven aan de activiteiten die tot het aantreffen van het voorkomen
      hebben geleid;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel94
  - number: 94.3.b
    text: van de verdere evaluatie van dat voorkomen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel94
  - number: 94.3.c
    text: van investeringen ten behoeve van de mijnbouwwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel94
  - number: '95.1'
    text: |-
      [Artikel 89][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel89
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '89'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: '95.2'
    text: 'Voorts worden in de overeenkomst bepalingen opgenomen die de vergunninghouder ertoe verplichten:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel95
  - number: 95.2.a
    text: |-
      zorg te dragen dat de werken die voor de totstandkoming van de overeenkomst tot stand zijn gekomen binnen
      het vergunningsgebied, voor 60% gaan toebehoren aan de vergunninghouder en voor 40% gaan toebehoren aan de
      vennootschap;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel95
  - number: 95.2.b
    text: |-
      de vennootschap tijdig in te lichten en in staat te stellen om een belang tot een percentage van 40 te nemen in
      te treffen regelingen die verband houden met de winning en de afzet van de gewonnen koolwaterstoffen, zoals het
      transport, de opslag en de behandeling daarvan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel95
  - number: '96.1'
    text: |-
      [Artikel 90][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel90
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '90'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: '96.2'
    text: |-
      Voorts wordt in de overeenkomst een bepaling opgenomen die de vennootschap ertoe verplicht aan de vergunninghouder
      terstond te vergoeden 40% van het bedrag, bedoeld in [artikel 94, derde lid][ref1], vermeerderd met een
      enkelvoudige rente, waarvan het percentage gelijk is aan dat van de wettelijke rente, over een tijdvak van ten
      hoogste vijf jaar, te rekenen vanaf het tijdstip waarop de desbetreffende kosten zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel94
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '94'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
  - number: '96.3'
    text: |-
      Het tweede lid blijft buiten toepassing, voorzover de vennootschap in het kader van een opsporingsovereenkomst de
      in [artikel 94, derde lid][ref1], bedoelde kosten reeds heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel94
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '94'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
  - number: '97.1'
    text: |-
      [Artikel 91, onderdelen a en b][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel91
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '91'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: '97.2'
    text: |-
      Voorts worden in de overeenkomst bepalingen opgenomen die ertoe strekken dat een gezamenlijk besluit van de
      vergunninghouder en de vennootschap, waarbij de vennootschap en, als de vergunning door meerdere personen gehouden
      wordt, de persoon, bedoeld in [artikel 22, vijfde lid][ref1], elk een beslissende stem hebben, vereist is voor:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 97.2.1°
    text: het jaarlijkse investerings- en financieringsplan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97
  - number: 97.2.2°
    text: |-
      niet in het jaarlijkse investerings- en financieringsplan opgenomen activiteiten en aanschaffingen, die een bedrag
      van € 500 000 te boven gaan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97
  - number: 97.2.3°
    text: de meerjarenplanning ten aanzien van mijnbouwwerkzaamheden binnen het vergunningsgebied;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97
  - number: 97.2.4°
    text: |-
      het de vergunninghouder toestaan dat overeenkomstig het beperkte doel van de samenwerking een deel van de
      mijnbouwwerkzaamheden niet of niet langer zal geschieden voor rekening van de vergunninghouder en de vennootschap
      gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97
  - number: 97.2.5°
    text: het aangaan van verplichtingen tot levering van koolwaterstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97
  - number: 97.2.6°
    text: besluiten inzake het vervoer van gewonnen koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97
  - number: 97a
    text: |-
      [Artikel 92][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel92
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '92'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 97b.1
    text: |-
      Indien na toepassing van het slot van de eerste volzin van [artikel 93, eerste lid][ref1], in een ander
      voorkomen in het vergunningsgebied koolwaterstoffen worden aangetoond, kan Onze Minister besluiten dat alsnog een
      overeenkomst als bedoeld in [artikel 93][ref2] tot stand wordt gebracht. Deze paragraaf is van overeenkomstige
      toepassing op die overeenkomst, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel93
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '93'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '93'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
  - number: 97b.1.a
    text: de overeenkomst slechts betrekking heeft op dit andere voorkomen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97b
  - number: 97b.1.b
    text: de overeenkomst tot stand komt binnen een jaar na het besluit van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97b
  - number: 97b.2
    text: |-
      In afwijking van [artikel 146, vierde lid][ref1], kan Onze Minister op verzoek van de vennootschap in
      overeenstemming met de vergunninghouder besluiten dat deze paragraaf van overeenkomstige toepassing is op een
      winningsvergunning als bedoeld in [artikel 143, tweede lid][ref2], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel146
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '146'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: 97b.2.a
    text: |-
      de mijnbouwovereenkomst tot één of meer voorkomens van koolwaterstoffen in het vergunningsgebied kan worden
      beperkt;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97b
  - number: 97b.2.b
    text: |-
      in de mijnbouwovereenkomst bepalingen kunnen worden opgenomen die afwijken van de [artikelen 94][ref1], [95][ref2],
      [96][ref3] en [97][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel96
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel97
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '94'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '95'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '96'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '97'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
  - number: 97b.2.c
    text: de overeenkomst tot stand komt binnen een jaar na het besluit van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97b
  - number: 97c
    text: |-
      Deze paragraaf heeft betrekking op personen die een vergunning houden voor het opsporen, winnen of opslaan van
      koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97c
  - number: 97d.1
    text: |-
      Als één natuurlijke persoon of rechtspersoon een vergunning houdt, brengen deze persoon en de vennootschap
      een overeenkomst tot stand die strekt tot het begeleiden, bewaken en monitoren van de financiële
      zekerheid voor de nakoming van verplichtingen als bedoeld in de [artikelen 44, tweede lid][ref1], en
      [45, tweede en vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel45
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97d
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 97d.2
    text: |-
      Als twee of meer natuurlijke personen of rechtspersonen de vergunning gezamenlijk houden, brengen deze
      personen onderling een overeenkomst tot stand die strekt tot het stellen van financiële zekerheid voor
      de nakoming van ieders aandeel in de verplichtingen, bedoeld in de [artikelen 44, tweede lid][ref1], en
      [45, tweede en vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel45
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97d
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 97d.3
    text: |-
      De personen, bedoeld in het tweede lid, en de vennootschap brengen gezamenlijk een overeenkomst tot stand die
      strekt tot het begeleiden, bewaken en monitoren van de uitvoering van de overeenkomst, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97d
  - number: 97d.4
    text: |-
      Onze Minister kan bij ministeriële regeling regels stellen met betrekking tot de inhoud van overeenkomsten
      als bedoeld in het eerste, tweede en derde lid, en daarmee verband houdende overeenkomsten tot het stellen van
      zekerheden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97d
  - number: 97d.5
    text: |-
      Als personen een overeenkomst als bedoeld in het eerste, tweede of derde lid sluiten, die afwijkt van de regels,
      bedoeld in het vierde lid, behoeft de overeenkomst instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97d
  - number: 97d.6
    text: Ontbinding van een overeenkomst komt niet tot stand dan na instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97d
  - number: 97e.1
    text: |-
      Iedere persoon, bedoeld in [artikel 22, tweede lid][ref1], eerste volzin, meldt een wijziging in zijn directe en
      indirecte zeggenschap binnen vier weken na die wijziging aan de vennootschap in het geval een wijziging betrekking
      heeft op de helft of meer van de stemrechten in een aandeelhoudersvergadering dan wel de benoeming, de schorsing of
      het ontslag van de helft of meer van de bestuurders, commissarissen of vennoten.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97e
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 97e.2
    text: |-
      Als een wijziging in de zeggenschap, bedoeld in het eerste lid, daartoe aanleiding geeft, adviseert de vennootschap
      Onze Minister over de toepassing van de [artikelen 47][ref1] en [48][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel48
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97e
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 97e.3
    text: |-
      Als de wijziging in de zeggenschap, bedoeld in het eerste lid, mogelijk nadelig is voor een te stellen
      of gestelde zekerheid als bedoeld in de [artikelen 47][ref1] en [48][ref2] en de melding niet is gedaan
      binnen de termijn van vier weken, bedoeld in dat lid, is een rechtshandeling, die nodig is voor de
      wijziging van de zeggenschap vernietigbaar door een rechterlijke uitspraak, onverminderd de toepassing
      van [artikel 40, tweede lid, van Boek 3 van het Burgerlijk Wetboek][ref3] door een persoon als bedoeld in
      [artikel 97d, tweede lid][ref4], of de vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel97d
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel97e
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '40'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: 97d
        hoofdstuk: '5'
        paragraaf: 5.2.4
        afdeling: '5.2'
  - number: '98.1'
    text: |-
      De houder van een vergunning tot het winnen van andere delfstoffen dan koolwaterstoffen is jaarlijks een afdracht
      verschuldigd aan de staat, voorzover dit in aan de vergunning verbonden voorschriften is bepaald. De afdracht wordt
      afgestemd op de omvang van of de voordelen behaald met het winnen en de daarmee samenhangende activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel98
  - number: '98.2'
    text: |-
      De houder van een opslagvergunning is jaarlijks een afdracht verschuldigd aan de staat, voorzover dit in aan de
      vergunning verbonden voorschriften is bepaald. De afdracht wordt afgestemd op de omvang van of de voordelen behaald
      met het opslaan en de daarmee samenhangende activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel98
  - number: '98.3'
    text: |-
      De houder van een vergunning als bedoeld in het eerste of tweede lid die een terrein binnen een provincie in
      gebruik heeft, waarbinnen voor het winnen of het opslaan benodigde mijnbouwwerken aanwezig zijn, is een eenmalige
      afdracht verschuldigd aan de provincie, voorzover dit in aan de vergunning verbonden voorschriften is bepaald. De
      afdracht wordt afgestemd op de regeling in [afdeling 5.1.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        afdeling: 5.1.2
  - number: '98.4'
    text: |-
      Indien de vergunning wordt gehouden door meer dan een natuurlijke persoon of rechtspersoon, wordt in aan de
      vergunning te verbinden voorschriften bepaald in hoeverre ieder van deze personen een afdracht als bedoeld in het
      eerste tot en met derde lid verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel98
  - number: '100'
    text: |-
      Onverminderd het bij of krachtens deze afdeling bepaalde geschieden de heffing en invordering van de afdracht
      aan de staat of een vooruitbetaling op een afdracht met overeenkomstige toepassing van de [artikelen 11][ref1],
      [12][ref2], [14][ref3], [17, eerste lid][ref4], [25, eerste en tweede lid][ref5], [28][ref6] en
      [29 van de Invorderingswet 1990][ref7] en de daarop berustende bepalingen, met dien verstande dat Onze Minister in
      de plaats treedt van de ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel28
      [ref7]: https://wetten.overheid.nl/BWBR0004770#Artikel29
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '17'
      - id: ref5
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref6
        bwb_id: BWBR0004770
        artikel: '28'
      - id: ref7
        bwb_id: BWBR0004770
        artikel: '29'
  - number: '101.1'
    text: |-
      Indien een afdracht als bedoeld in [artikel 98, eerste lid][ref1], aan de staat of een vooruitbetaling op een
      afdracht als bedoeld in artikel 98, eerste lid, op een later tijdstip op een ander bedrag wordt vastgesteld, wordt
      bij die latere vaststelling de rentederving in rekening gebracht die voor de betrokkene of voor de staat uit die
      latere vaststelling voortvloeit. Daarbij wordt een enkelvoudige rente in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel98
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '98'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: '101.2'
    text: |-
      Aan de betrokkene wordt een enkelvoudige rente in rekening gebracht over het bedrag waarvoor overeenkomstig
      [artikel 25 van de Invorderingswet 1990][ref1] uitstel van betaling is verleend. De rente wordt berekend over het
      tijdvak waarvoor uitstel is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: '101.3'
    text: |-
      Het percentage van de rente, bedoeld in het eerste en het tweede lid, is gelijk aan het percentage van de
      belastingrente, bedoeld in [artikel 30hb van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30hb
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30hb
  - number: '101.4'
    text: |-
      Een rente, bedoeld in het eerste en het tweede lid, is aan de staat verschuldigd met ingang van de dag na die
      waarop de vaststelling aan de betrokkene bekend is gemaakt. [Artikel 100][ref1] is van overeenkomstige toepassing
      ten aanzien van de betaling en de invordering van deze rente.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel100
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '100'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: '102.1'
    text: |-
      Voorzover twijfel bestaat of degene die ingevolge dit hoofdstuk een afdracht aan de staat verschuldigd zal worden
      deze zal voldoen, kan Onze Minister bepalen dat de betrokkene zekerheid stelt voor de voldoening van de afdracht.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel102
  - number: '102.2'
    text: |-
      Het bedrag en de termijn waarvoor en het tijdstip en de wijze waarop de zekerheid wordt gesteld, dienen ten
      genoegen van Onze Minister te zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel102
  - number: '102.3'
    text: |-
      De verplichtingen van dit artikel blijven na afloop van de vergunning van kracht, tenzij eerder aan de
      betalingsverplichtingen is voldaan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel102
  - number: '103.1'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen in ieder geval nadere regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel103
  - number: 103.1.a
    text: de uitvoering van dit hoofdstuk;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel103
  - number: 103.1.b
    text: afdrachten in verband met andere vergunningen dan die tot het opsporen en het winnen van koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel103
  - number: '103.2'
    text: |-
      De voordracht voor een krachtens het eerste lid, onderdeel b, vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel103
  - number: '104'
    text: |-
      Dit hoofdstuk is niet van toepassing ten aanzien van vergunningen als bedoeld in de [artikelen 24][ref1] en
      [24c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel24c
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 24c
        hoofdstuk: 2a
        paragraaf: '1'
  - number: '105.1'
    text: Er is een Mijnraad.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel105
  - number: '105.2'
    text: |-
      De Mijnraad heeft tot taak om in verband met het opsporen of winnen van delfstoffen of aardwarmte, dan wel het
      opslaan van stoffen:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel105
  - number: 105.2.a
    text: Onze Minister desgevraagd te adviseren over door hem te geven beschikkingen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel105
  - number: 105.2.b
    text: |-
      Onze Minister desgevraagd de inlichtingen te verstrekken die nodig zijn voor de beoordeling van de uitvoerbaarheid
      van voorgenomen wettelijke voorschriften en algemene beleidsvoornemens.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel105
  - number: '105.3'
    text: 'Onze Minister vraagt in elk geval advies aan de Mijnraad inzake door hem te geven beschikkingen inzake:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel105
  - number: 105.3.a
    text: |-
      de verlening of intrekking van een vergunning als bedoeld in [artikel 6, eerste lid][ref1], of
      [25, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 105.3.b
    text: |-
      een instemming met een winningsplan als bedoeld in [artikel 34, derde lid][ref1], voor zover het winnen van
      delfstoffen niet geschiedt in het continentaal plat;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 105.3.c
    text: |-
      een besluit tot wijziging van een instemming met een winningsplan en een besluit tot instemming met een gewijzigd
      of geactualiseerd winningsplan, voor zover het winnen van delfstoffen niet geschiedt in het continentaal plat,
      tenzij de wijziging of actualisatie van ondergeschikte aard is omdat deze naar het oordeel van Onze Minister niet
      leidt tot een andere beoordeling van:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel105
  - number: 105.3.c.1°
    text: de effecten van de wijze van winning alsmede de daarmee verband houdende activiteiten,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel105
  - number: 105.3.c.2°
    text: |-
      de effecten van de bodembeweging ten gevolge van de winning en de maatregelen ter voorkoming van schade door
      bodembeweging,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel105
  - number: 105.3.c.3°
    text: de risico’s voor omwonenden, gebouwen of infrastructurele werken of de functionaliteit daarvan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel105
  - number: 105.3.d
    text: de verlening of intrekking van een startvergunning aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel105
  - number: 105.3.e
    text: |-
      de verlening of intrekking van een vervolgvergunning aardwarmte indien hiervoor de procedure, bedoeld in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1], wordt gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '106.1'
    text: De Mijnraad bestaat uit een voorzitter en ten hoogste negen andere leden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel106
  - number: '106.2'
    text: |-
      De voorzitter en de andere leden van de Mijnraad worden door Onze Minister benoemd, geschorst en ontslagen. De raad
      kan uit zijn midden ondervoorzitters aanwijzen. De benoeming van de leden geschiedt op grond van hun deskundigheid
      op gebieden die van belang zijn voor de mijnbouw en met de mijnbouw verwante activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel106
  - number: '106.3'
    text: |-
      De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan telkens voor ten hoogste vier jaar
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel106
  - number: '107.1'
    text: De Mijnraad heeft een secretariaat, dat bestaat uit een of meer door Onze Minister aan te wijzen personen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel107
  - number: '107.2'
    text: |-
      De aangewezen personen zijn voor hun werkzaamheden voor de Mijnraad uitsluitend verantwoording schuldig aan de
      raad.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel107
  - number: '108'
    text: |-
      Leden van de Mijnraad onthouden zich van stemming over een advies, indien dit een zaak betreft waarbij zij
      persoonlijk belang hebben.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel108
  - number: '109.1'
    text: De Mijnraad stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel109
  - number: '109.2'
    text: Het bestuursreglement en de daarin aangebrachte wijzigingen behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel109
  - number: '110'
    text: |-
      De Mijnraad stelt jaarlijks voor 1 juli een verslag op van de werkzaamheden en de doelmatigheid en doeltreffendheid
      van zijn werkzaamheden en werkwijze in het afgelopen kalenderjaar. Het verslag wordt aan Onze Minister toegezonden.
      Onze Minister zendt het verslag alsmede een schriftelijke reactie daarop aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel110
  - number: '111'
    text: |-
      De Mijnraad verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voorzover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel111
  - number: '112'
    text: |-
      Het beheer van de bescheiden betreffende de werkzaamheden van de Mijnraad geschiedt op overeenkomstige wijze als
      bij het Ministerie van Economische Zaken en Klimaat. De bescheiden worden na beëindiging van de werkzaamheden van
      de raad opgeborgen in het archief van dat ministerie.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel112
  - number: '123.1'
    text: |-
      Degene die activiteiten verricht waarop het bij en krachtens [artikel 49, eerste lid][ref1],
      [artikel 51, eerste lid][ref2], of [52, eerste lid][ref3], bepaalde van toepassing is verstrekt aan Onze Minister
      de op grond van het vijfde lid bepaalde gegevens, voorzover de betrokkene in verband met die activiteiten in het
      bezit van deze gegevens is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel52
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '123.2'
    text: |-
      Onze Minister kan de verstrekte gegevens, of een deel van die gegevens, doen beheren door door hem daartoe aan te
      wijzen instellingen, welke hem desgevraagd mede van advies dienen aan de hand van die gegevens.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel123
  - number: '123.3'
    text: |-
      De verstrekte gegevens zijn gegevens als bedoeld in
      [artikel 5.1, eerste lid, onderdeel c, of tweede lid, onderdeel f, van de Wet open overheid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
  - number: '123.4'
    text: |-
      De op grond van het vijfde lid, onderdeel c, aangewezen gegevens verliezen op een op
      grond van dat onderdeel bepaald tijdstip hun vertrouwelijk karakter. Na dit tijdstip is
      [artikel 5.1, eerste lid, onderdeel c, of tweede lid, onderdeel f, van de Wet open overheid][ref1] niet meer van
      toepassing op deze aangewezen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
  - number: '123.5'
    text: 'Bij of krachtens algemene maatregel van bestuur worden:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel123
  - number: 123.5.a
    text: de gegevens bepaald die aan Onze Minister worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel123
  - number: 123.5.b
    text: |-
      regels gesteld omtrent het tijdstip en de wijze waarop de gegevens worden verstrekt, omtrent het beheer van de
      gegevens en omtrent het gebruik dat van de gegevens kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel123
  - number: 123.5.c
    text: |-
      regels gesteld omtrent het tijdstip waarop
      [artikel 5.1, eerste lid, onderdeel c, of tweede lid, onderdeel f, van de Wet open overheid][ref1] niet meer van
      toepassing is op deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
  - number: '123.6'
    text: Dit artikel is van overeenkomstige toepassing op bescheiden en monsters.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel123
  - number: '124.1'
    text: 'Onze Minister zendt aan de Europese Commissie ieder jaar een verslag met gegevens over:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel124
  - number: 124.1.a
    text: de gebieden die voor het opsporen en winnen van koolwaterstoffen zijn vrijgegeven;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel124
  - number: 124.1.b
    text: de verleende vergunningen voor koolwaterstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel124
  - number: 124.1.c
    text: de houders van de verleende vergunningen voor koolwaterstoffen en de samenstelling van die houders;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel124
  - number: 124.1.d
    text: de geraamde reserves aan koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel124
  - number: '124.2'
    text: |-
      Onze Minister zendt het in het eerste lid bedoelde verslag tevens aan de beide kamers der Staten-Generaal en en
      geeft in de Staatscourant kennis van de terinzagelegging van het verslag.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel124
  - number: '124.3'
    text: |-
      Onze Minister zendt aan de Europese Commissie om de drie jaar een verslag over het register, bedoeld in
      [artikel 31m][ref1], en andere door de Commissie opgevraagde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31m
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31m
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '125.1'
    text: Onze Minister zendt tweejaarlijks aan de beide kamers der Staten-Generaal een overzicht van aardgasactiviteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel125
  - number: '125.2'
    text: 'Het overzicht bevat tenminste:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel125
  - number: 125.2.a
    text: |-
      de aangevraagde, dan wel de verleende opsporings- en winningsvergunningen voorzover deze betrekking hebben op het
      opsporen of winnen van aardgas;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel125
  - number: 125.2.b
    text: 'de opgespoorde aardgasvoorkomens waarbij wordt aangegeven:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel125
  - number: 125.2.b.1°
    text: in welke vergunningsgebieden deze voorkomens zijn opgespoord en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel125
  - number: 125.2.b.2°
    text: of uit deze voorkomens aardgas wordt gewonnen en zo niet, wanneer daarmee wordt aangevangen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel125
  - number: 125.2.c
    text: |-
      de omvang van de opgespoorde en overige aardgasreserves waarbij de aardgasreserves die in geologisch of geografisch
      opzicht met elkaar samenhangen afzonderlijk worden vermeld;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel125
  - number: 125.2.d
    text: |-
      een raming van de winning van aardgas per vergunninggebied, dan wel gebieden die in geologisch of geografisch
      opzicht met elkaar samenhangen over een periode van tien jaar, aanvangend met het jaar waarin het overzicht aan de
      beide kamers der Staten-Generaal wordt gezonden;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel125
  - number: 125.2.e
    text: de bestaande en toekomstige faciliteiten voor de ondergrondse opslag van aardgas;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel125
  - number: 125.2.f
    text: |-
      de winningsplannen, als bedoeld in [artikel 34][ref1], die zijn ingediend en waarvoor de instemming van Onze
      Minister is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '126.1'
    text: Er is een Staatstoezicht op de mijnen. Het Staatstoezicht op de mijnen ressorteert onder Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel126
  - number: '126.2'
    text: Aan het hoofd van het Staatstoezicht op de mijnen staat de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel126
  - number: '127.1'
    text: 'De inspecteur-generaal der mijnen heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
  - number: 127.1.a
    text: 'het uitoefenen van:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
  - number: 127.1.a.1°
    text: |-
      het toezicht op de naleving van de bij of krachtens deze wet gestelde regels, met uitzondering van het bij of
      krachtens [artikel 52][ref1] en de [hoofdstukken 5][ref2], [6][ref3] en [9][ref4] bepaalde met uitzondering van
      [artikel 111][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk9
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Artikel111
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0014168
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0014168
        hoofdstuk: '9'
      - id: ref5
        bwb_id: BWBR0014168
        artikel: '111'
        hoofdstuk: '6'
  - number: 127.1.a.2°
    text: |-
      het toezicht op de naleving van de bij of krachtens een andere wet gestelde regels waarvoor ambtenaren van het
      Staatstoezicht op de mijnen zijn aangewezen als toezichthouders, en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
  - number: 127.1.a.3°
    text: |-
      de taken en bevoegdheden als bedoeld in [artikel 18.5a van de Omgevingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18'
  - number: 127.1.b
    text: Onze Minister te adviseren bij besluiten die Onze Minister neemt inzake mijnbouw;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
  - number: 127.1.c
    text: risicobeoordelingen te toetsen voor advisering aan Onze Minister;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
  - number: 127.1.d
    text: onderzoek te doen verrichten, indien dat nodig is voor het toetsen van een risicobeoordeling;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
  - number: 127.1.e
    text: |-
      gevraagd en ongevraagd adviezen te verstrekken naar aanleiding van het toezicht op de naleving, de
      risicobeoordelingen en het onderzoek;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
  - number: 127.1.f
    text: |-
      het rapport inzake grote gevaren te beoordelen voor een instemming als bedoeld in de
      [artikelen 45b, tweede lid][ref1], [45e, tweede lid][ref2], [45f, tweede lid][ref3] en [45i, tweede lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45b
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel45e
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel45f
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel45i
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 45b
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 45e
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref3
        bwb_id: BWBR0014168
        artikel: 45f
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref4
        bwb_id: BWBR0014168
        artikel: 45i
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: 127.1.g
    text: |-
      kennisgevingen, bedoeld in de [artikelen 45m][ref1], [45n][ref2], [45o][ref3], [45p][ref4], te beoordelen;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45m
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel45n
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel45o
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel45p
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 45m
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 45n
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref3
        bwb_id: BWBR0014168
        artikel: 45o
        hoofdstuk: '4'
        paragraaf: 4.1a
      - id: ref4
        bwb_id: BWBR0014168
        artikel: 45p
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: 127.1.h
    text: |-
      een mechanisme op te zetten voor vertrouwelijke melding van veiligheids- en milieukwesties met betrekking tot
      activiteiten die zien op de opsporing of winning van koolwaterstoffen en het onderzoeken van deze meldingen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
  - number: 127.1.i
    text: |-
      regelmatig kennis, gegevens en ervaringen uit te wisselen met toezichthouders van andere lidstaten overeenkomstig
      artikel 27 van richtlijn 2013/30/EU;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
  - number: 127.1.j
    text: informatie uit te wisselen overeenkomstig artikel 23 van richtlijn 2013/30/EU;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
  - number: 127.1.k
    text: informatie te publiceren overeenkomstig artikel 24 van richtlijn 2013/30/EU.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
  - number: '127.2'
    text: |-
      De inspecteur-generaal der mijnen stelt na elke inspectie, verricht in het kader van [paragraaf 3.2][ref1] een
      verslag op over de naleving van de voorschriften en de voorgeschreven maatregelen. Het verslag wordt ter kennis
      gebracht van de betrokken houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door
      meerdere personen wordt gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref2], en binnen twee maanden
      na de inspectie openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '127.3'
    text: |-
      De inspecteur-generaal der mijnen stelt bij een zwaar ongeval als bedoeld in [artikel 33][ref1], een onderzoek in
      en dient een samenvatting van de bevindingen in bij de Europese Commissie en Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel33
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '127.4'
    text: |-
      De inspecteur-generaal der mijnen draagt er zorg voor dat de aanbevelingen naar aanleiding van de bevindingen,
      bedoeld in het derde lid, worden uitgevoerd, voor zover deze binnen diens bevoegdheid vallen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel127
  - number: '128.1'
    text: |-
      De inspecteur-generaal der mijnen brengt jaarlijks voor 1 mei aan Onze Minister verslag uit over de werkzaamheden
      van het Staatstoezicht op de mijnen in het afgelopen jaar. De inspecteur-generaal der mijnen kan voorzien in
      verslaglegging op andere momenten waarop de inspecteur-generaal dat nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel128
  - number: '128.2'
    text: |-
      De inspecteur-generaal der mijnen doet in het verslag de aanbevelingen die hij wenselijk acht met het oog op een
      doelmatige en voortvarende uitvoering in de toekomst van de in [artikel 127][ref1] genoemde activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel127
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '127'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: '128.3'
    text: Onze Minister zendt het verslag alsmede een schriftelijke reactie daarop aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel128
  - number: '128.4'
    text: |-
      De inspecteur-generaal der mijnen dient jaarlijks voor een bij ministeriële regeling vast te stellen datum,
      aan Onze Minister een jaarplan in, waarin de plannen worden uitgewerkt voor een effectief toezicht gebaseerd
      op risicobeheer en waarin bijzondere aandacht wordt besteed aan de naleving van de verplichtingen, genoemd in
      [§ 4.1a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: 128a.1
    text: Onze Minister geeft een aanwijzing aan de inspecteur-generaal der mijnen uitsluitend in schriftelijke vorm.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel128a
  - number: 128a.2
    text: Onze Minister verleent geen mandaat voor het geven van een aanwijzing.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel128a
  - number: 128a.3
    text: Een aanwijzing wordt door Onze Minister onverwijld aan de Staten-Generaal gezonden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel128a
  - number: 128a.4
    text: |-
      Onverminderd [artikel 10:6 van de Algemene wet bestuursrecht][ref1] en in afwijking van de
      [artikelen 10:22, eerste lid][ref2], en [10:23 van de Algemene wet bestuursrecht][ref3] ziet een bijzondere
      aanwijzing niet op:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel128a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 128a.4.a
    text: het weerhouden van de inspecteur-generaal der mijnen om een specifiek onderzoek te verrichten of af te ronden;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel128a
  - number: 128a.4.b
    text: de wijze waarop de inspecteur-generaal der mijnen een specifiek onderzoek verricht;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel128a
  - number: 128a.4.c
    text: iedere vorm van bevindingen, oordelen en adviezen van de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel128a
  - number: '129.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, met uitzondering van het bij of
      krachtens [artikel 52][ref1] bepaalde, zijn belast de bij besluit van Onze Minister daartoe aangewezen ambtenaren
      van het Staatstoezicht op de mijnen, voorzover niet op grond van [artikel 131][ref2] het toezicht aan anderen is
      opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel131
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '131'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '129.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel129
  - number: '130'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald in welke gevallen en op welke wijze de houder van een
      vergunning als bedoeld in [artikel 6][ref1] of [25][ref2] dan wel degene die een verkenningsonderzoek uitvoert of
      voornemens is uit te voeren, wordt verplicht de in de [artikelen 129][ref3] en [131][ref4] bedoelde ambtenaren bij
      de uitoefening van hun bevoegdheden:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel129
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel131
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '129'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '131'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 130.a
    text: |-
      met inbegrip van hun uitrusting, te vervoeren naar door deze ambtenaren aan te duiden plaatsen waar
      met gebruikmaking van de vergunning activiteiten worden of zullen worden uitgevoerd dan wel waar een
      verkenningsonderzoek wordt of zal worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel130
  - number: 130.b
    text: te voorzien van een verblijfplaats;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel130
  - number: 130.c
    text: te voorzien in maaltijden en andere benodigdheden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel130
  - number: '131.1'
    text: |-
      Bij besluit van Onze Minister kunnen andere ambtenaren worden aangewezen die zijn belast met het toezicht op de
      naleving van het bepaalde bij of krachtens deze wet met uitzondering van het bij of krachtens [artikel 52][ref1]
      bepaalde, voorzover het toezicht bepaalde in het besluit aangegeven gevallen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '131.2'
    text: |-
      Onze Minister wijst ambtenaren die onder een van Onze andere Ministers ressorteren niet aan, dan in overeenstemming
      met Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel131
  - number: '131.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel131
  - number: 131a.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens [artikel 52][ref1] zijn binnen hun ambtsgebied
      belast de bij besluit van gedeputeerde staten aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel131a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 131a.2
    text: |-
      Gedeputeerde staten wijzen ambtenaren die niet onder hen ressorteren niet aan dan in overeenstemming met het
      bestuursorgaan onder wie de desbetreffende ambtenaren ressorteren.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel131a
  - number: 131a.3
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in het provinciaal blad.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel131a
  - number: '132'
    text: |-
      De inspecteur-generaal der mijnen is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de
      bij of krachtens deze wet gestelde verplichtingen, met uitzondering van de verplichtingen die bij of krachtens de
      [artikelen 47, eerste lid][ref1], [48, eerste lid][ref2], en [52][ref3] en de [hoofdstukken 5][ref4], [6][ref5]
      en [9][ref6], zijn gesteld met uitzondering van [artikel 111][ref7], en is bevoegd tot uitoefening van de taken en
      bevoegdheden als bedoeld in [artikel 18.5a van de Omgevingswet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel52
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk6
      [ref6]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk9
      [ref7]: https://wetten.overheid.nl/BWBR0014168#Artikel111
      [ref8]: https://wetten.overheid.nl/BWBR0037885#Artikel18
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref4
        bwb_id: BWBR0014168
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0014168
        hoofdstuk: '6'
      - id: ref6
        bwb_id: BWBR0014168
        hoofdstuk: '9'
      - id: ref7
        bwb_id: BWBR0014168
        artikel: '111'
        hoofdstuk: '6'
      - id: ref8
        bwb_id: BWBR0037885
        artikel: '18'
  - number: '133.1'
    text: |-
      Een aanvrager, een verzoeker, een exploitant van een productie-installatie, een eigenaar van een niet-productie-
      installatie, een eigenaar van een pijpleiding, een netbeheerder als bedoeld in [artikel 1 van de Gaswet][ref1] en
      een aanvrager of houder van een zoekgebied aardwarmte, van een startvergunning aardwarmte of een vervolgvergunning
      aardwarmte, zijn een vergoeding verschuldigd voor:


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
  - number: 133.1.a
    text: 'het door Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel133
  - number: 133.1.a.1°
    text: |-
      op aanvraag verlenen, wijzigen of intrekken van een vergunning, ontheffing, instemming, maatwerkvoorschrift of
      toestemming;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel133
  - number: 133.1.a.2°
    text: |-
      adviseren over of instemmen met activiteiten inzake een mijnbouwwerk, het beoordelen van een melding of het
      beoordelen van gegevens en bescheiden die zijn verstrekt voor een activiteit inzake een mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel133
  - number: 133.1.b
    text: |-
      de door de inspecteur-generaal uit te voeren taken als bedoeld in
      [artikel 127, eerste lid, onderdelen a tot en met g][ref1], met dien verstande dat een vergoeding niet in rekening
      wordt gebracht voor:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel127
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '127'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 133.1.b.1°
    text: |-
      advisering en onderzoek dat wordt uitgevoerd voor een ander doel dan een advies aan of het toezicht op een besluit
      van Onze Minister, respectievelijk de inspecteur generaal der mijnen, over handelingen als bedoeld in onderdeel a,
      onder 1° en 2°;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel133
  - number: 133.1.b.2°
    text: |-
      het vaststellen van een besluit als bedoeld in [artikel 132][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel132
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '132'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: '133.2'
    text: Bij algemene maatregel van bestuur worden regels gesteld over de vergoeding.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel133
  - number: '133.3'
    text: De hoogte van de vergoeding wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel133
  - number: '133.4'
    text: |-
      Onze Minister kan de verschuldigde bedragen invorderen bij dwangbevel. [Titel 4.4][ref1], met uitzondering van de
      [artikelen 4:85][ref2] en [4:95, van de Algemene wet bestuursrecht][ref3] is, voor zover al niet van toepassing,
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '133.5'
    text: |-
      Voor zover een door Onze Minister in rekening gebracht bedrag verplicht tot betaling van een geldsom, komt deze
      geldsom toe aan de Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel133
  - number: '134.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *mijnbouwactiviteiten:* activiteiten als bedoeld in de
      [artikelen 1, onderdeel d tot en met i][ref1], en [51][ref2];
        - *mijnbouwondernemer:* natuurlijke persoon of rechtspersoon die mijnbouwactiviteiten verricht;
        - *schadeadvies:* advies van een door Onze Minister ingestelde commissie over het verband tussen zaakschade
      die is opgetreden door bodembeweging die redelijkerwijs het gevolg kan zijn van mijnbouwactiviteiten en de
      mijnbouwactiviteiten, alsmede over de hoogte van het schadebedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel51
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '134.2'
    text: |-
      Dit hoofdstuk is van toepassing op mijnbouwondernemers voorzover deze mijnbouwactiviteiten verrichten aan de
      landzijde van de in de bijlage bij deze wet vastgelegde lijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel134
  - number: '135.1'
    text: Er is een Waarborgfonds mijnbouwschade.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: '135.2'
    text: Het waarborgfonds bezit rechtspersoonlijkheid en is gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: '135.3'
    text: Onze Minister is belast met het beheer van het waarborgfonds.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: '135.4'
    text: 'Het waarborgfonds ontvangt:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: 135.4.a
    text: |-
      een door een mijnbouwondernemer jaarlijks verschuldigde bijdrage, op te leggen door Onze Minister, met inachtneming
      van bij algemene maatregel van bestuur te stellen regels;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: 135.4.b
    text: rentebaten die via het waarborgfonds zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: 135.4.c
    text: het batig saldo van de laatstelijk afgesloten rekening van het waarborgfonds;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: 135.4.d
    text: andere inkomsten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: '135.5'
    text: 'Bij algemene maatregel van bestuur worden in elk geval regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: 135.5.a
    text: 'de maatstaf ter bepaling van de hoogte van de bijdrage, met inachtneming van:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: 135.5.a.1°
    text: |-
      de omvang van de mijnbouwactiviteiten van een mijnbouwondernemer aan de landzijde van de in de bijlage bij deze wet
      vastgelegde lijn,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: 135.5.a.2°
    text: |-
      de hoogte van de schadevergoedingen die de vijf voorafgaande jaren ten laste van het waarborgfonds zijn toegekend
      in verband met mijnbouwactiviteiten van de desbetreffende mijnbouwondernemer of diens rechtsvoorganger,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: 135.5.a.3°
    text: de aard van de desbetreffende mijnbouwactiviteiten, en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: 135.5.a.4°
    text: de in het waarborgfonds aanwezige baten in relatie tot de begrote uitgaven;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: 135.5.b
    text: het tijdstip waarop de bijdrage verschuldigd wordt, en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: 135.5.c
    text: de verschuldigdheid van rente als de bijdrage op een later tijdstip op een ander bedrag wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: '135.6'
    text: Niet in het jaar van ontvangst bestede gelden blijven in het waarborgfonds.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: '135.7'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent het vermogen van het waarborgfonds, mede met
      inachtneming van het totale bedrag aan schadevergoedingen dat mijnbouwondernemers gedurende in elk geval de
      laatste vijf jaar voorafgaande aan het tijdstip van inwerkingtreding van deze wet hebben betaald aan natuurlijke
      personen bij wie in die periode zaakschade is opgetreden als gevolg van door die mijnbouwondernemers verrichte
      mijnbouwactiviteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel135
  - number: '136.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de inrichting en de
      administratie van het waarborgfonds, alsmede het daarop uit te oefenen toezicht.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel136
  - number: '136.2'
    text: |-
      Onze Minister doet jaarlijks verslag aan beide kamers der Staten-Generaal omtrent het over het waarborgfonds
      gevoerde beheer.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel136
  - number: '137'
    text: |-
      Onze Minister kent een natuurlijke persoon bij wie zaakschade is opgetreden als gevolg van mijnbouwactiviteiten op
      diens verzoek een schadevergoeding toe ten laste van het waarborgfonds, indien:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel137
  - number: 137.a
    text: |-
      de betrokken mijnbouwondernemer failliet is verklaard, surséance van betaling is verleend of ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, of
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel137
  - number: 137.b
    text: de betrokken mijnbouwondernemer heeft opgehouden te bestaan of is overleden, en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel137
  - number: 137.c
    text: de schade niet reeds geheel of gedeeltelijk uit anderen hoofde is vergoed.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel137
  - number: '138'
    text: |-
      Indien zich een van de gebeurtenissen, genoemd in [artikel 137, onderdeel a of b][ref1], voordoet, dient de
      persoon, bedoeld in de aanhef van dat artikel, een aanvraag voor een schadeadvies in:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel137
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '137'
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: 138.a
    text: uiterlijk drie maanden na het moment waarop de desbetreffende gebeurtenis zich heeft voorgedaan, of,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel138
  - number: 138.b
    text: |-
      als hij op dat moment nog niet met de schade bekend kon zijn, binnen drie maanden na het moment waarop hij met de
      schade bekend is geworden of redelijkerwijs bekend had kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel138
  - number: '139.1'
    text: |-
      De persoon, bedoeld in [artikel 137][ref1], dient zijn verzoek bij Onze Minister voor het waarborgfonds in
      uiterlijk drie maanden na ontvangst van het schadeadvies en overlegt daarbij in ieder geval dat advies.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel137
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '137'
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: '139.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de indiening en de
      behandeling van, alsmede de beslissing op het verzoek.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel139
  - number: 141a.1
    text: |-
      Werken met een nationaal belang waarvoor Onze Minister in ieder geval een projectbesluit als bedoeld in
      [afdeling 5.2 van de Omgevingswet][ref1] vaststelt, zijn de aanleg of uitbreiding van de volgende projecten:


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 141a.1.a
    text: |-
      een mijnbouwwerk ten behoeve van de opsporing of winning van koolwaterstoffen in of onder een Natura 2000-gebied of
      een bijzonder nationaal natuurgebied als bedoeld in de [Omgevingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 141a.1.b
    text: een mijnbouwwerk ten behoeve van de opslag van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel141a
  - number: 141a.1.c
    text: |-
      pijpleidingen die uitsluitend of in hoofdzaak zijn bestemd voor het vervoer van delfstoffen respectievelijk het
      vervoer van stoffen in verband met het opsporen of winnen van delfstoffen respectievelijk het opslaan van stoffen
      met behulp van een mijnbouwwerk als bedoeld in onderdeel a respectievelijk onderdeel b;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel141a
  - number: 141a.1.d
    text: |-
      een mijnbouwwerk of pijpleidingen, voor zover het een project betreft voor olie of koolstofdioxide dat is opgenomen
      op de Unielijst van projecten van gemeenschappelijk belang, bedoeld in artikel 3, vierde lid, Verordening (EU)
      nr. 347/2013 van het Europees Parlement en de Raad van 17 april 2013 betreffende richtsnoeren voor de trans-
      Europese energie-infrastructuur en tot intrekking van Beschikking nr. 1364/2006/EG en tot wijziging van de
      Verordeningen (EG) nr. 713/2009, (EG) nr. 714/2009 en (EG) nr. 715/2009 (PbEU 2013, L 115).
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel141a
  - number: 141a.2
    text: |-
      [Artikel 16.7 van de Omgevingswet][ref1] is van toepassing op de coördinatie van besluiten ter uitvoering van
      projectbesluiten als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '16'
  - number: 141a.3
    text: |-
      Onze Minister kan in overeenstemming met de Minister van Infrastructuur en Milieu besluiten tot toepassing van de
      procedure, bedoeld in het eerste lid, aanhef, voor de aanleg of de uitbreiding van een mijnbouwwerk ten behoeve van
      de opsporing of winning van koolwaterstoffen in of onder andere gebieden dan bedoeld in het eerste lid, onderdeel
      a, indien:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel141a
  - number: 141a.3.a
    text: |-
      een gebied niet geheel is uitgesloten van de opsporing of winning van koolwaterstoffen bij of krachtens een
      algemene maatregel van bestuur als bedoeld in [artikel 9, eerste lid, onderdeel e][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel9
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 141a.3.b
    text: |-
      een belang als bedoeld in [artikel 9, eerste lid, onderdeel f][ref1], zich niet tegen aanleg of uitbreiding in dat
      gebied verzet,


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel9
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 141a.3.c
    text: |-
      het desbetreffende gebied niet geheel of ten dele is gelegen binnen de op grond van
      [artikel 2.44, eerste lid, van de Omgevingswet][ref1] aangewezen Natura 2000-gebieden Waddenzee en
      Noordzeekustzone,


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
  - number: 141a.3.d
    text: |-
      het desbetreffende gebied niet geheel of ten dele is gelegen binnen de Waddenzee als aangewezen krachtens de
      [Wet ruimtelijke ordening][ref1] of op de Waddeneilanden, en


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel141a
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: 141a.3.e
    text: |-
      het desbetreffende gebied niet geheel of ten dele is gelegen binnen het gebied dat op grond van de Overeenkomst
      inzake de bescherming van het cultureel en natuurlijk erfgoed van de wereld (Trb. 1973, 155) is aangewezen als
      werelderfgoedgebied Waddenzee.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel141a
  - number: 141a.4
    text: |-
      Voor projecten als bedoeld in het eerste lid, onder d, stelt Onze Minister, in overeenstemming met Onze Minister
      voor Volkshuisvesting en Ruimtelijke Ordening, een handleiding vast als bedoeld in artikel 9, eerste lid, van de
      verordening, bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel141a
  - number: '142.1'
    text: |-
      Ten aanzien van een besluit omtrent instemming met een winningsplan is [hoofdstuk 20 van de Wet milieubeheer][ref1]
      van overeenkomstige toepassing, met dien verstande dat [artikel 20.3 van de Wet milieubeheer][ref2] niet
      van toepassing is op een winningsplan voor zover het winnen van delfstoffen geschiedt vanuit een voorkomen
      dat is gelegen aan de zeezijde van de in de bijlage bij deze wet vastgelegde lijn. De eerste volzin is van
      overeenkomstige toepassing op een besluit omtrent instemming met een winningsplan of opslagplan als bedoeld
      in [artikel 39, eerste lid][ref3]. De eerste volzin is van overeenkomstige toepassing op een besluit omtrent
      instemming met een winningsplan of opslagplan als bedoeld in artikel 39, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk20
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel39
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '20'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '142.2'
    text: |-
      Op het beroep tegen besluiten op grond van de [afdelingen 5.1.1][ref1], [5.1.2][ref2], [5.3][ref3], [5.4][ref4]
      en [5.5][ref5] is [hoofdstuk V, afdelingen 2][ref6] en [4, van de Algemene wet inzake rijksbelastingen][ref7] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Afdeling4
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        afdeling: 5.1.1
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        afdeling: 5.1.2
      - id: ref3
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        afdeling: '5.3'
      - id: ref4
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        afdeling: '5.4'
      - id: ref5
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        afdeling: '5.5'
      - id: ref6
        bwb_id: BWBR0002320
        afdeling: '2'
      - id: ref7
