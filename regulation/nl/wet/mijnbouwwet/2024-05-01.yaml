  - number: '155.1'
    text: |-
      Op verplichtingen tot betaling van een geldsom die zijn ontstaan onder de werking van een van de in
      [artikel 168][ref1] genoemde wetten, blijft na de inwerkingtreding van deze wet het recht van toepassing zoals dat
      op grond van die wetten gold op de dag voor de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel168
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '168'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '155.2'
    text: |-
      In afwijking van het eerste lid is [paragraaf 5.1.1.5.][ref1] vanaf de inwerkingtreding van deze wet van
      overeenkomstige toepassing op de betaling van een bonus, een oppervlakterecht, een cijns of een aandeel in de winst
      op grond van de in [artikel 168][ref2] genoemde wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel168
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel155
