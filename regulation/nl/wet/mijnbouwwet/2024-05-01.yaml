  - number: '161'
    text: |-
      Overeenkomsten die voor de inwerkingtreding van deze wet zijn gesloten tussen de door Onze Minister
      aangewezen naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid en de houder van
      een opsporingsvergunning voor het voor hun gezamenlijke rekening verrichten van opsporingswerkzaamheden zijn
      overeenkomsten als bedoeld in [artikel 81, onderdeel d][ref1].


