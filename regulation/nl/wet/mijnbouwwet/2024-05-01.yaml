        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0003994
  - number: '154'
    text: |-
      Een veiligheidszone ingesteld krachtens [artikel 27 van de Mijnwet continentaal plat][ref1], en een toestemming
      verleend krachtens [artikel 28 van die wet][ref2], worden beschouwd als een veiligheidszone en een ontheffing als
      bedoeld in [artikel 43][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002504#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel43
