        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: '158.1'
    text: |-
      Voor de toepassing van [artikel 66, derde lid][ref1], op voor de inwerkingtreding van deze wet geleden verliezen,
      wordt het resultaat van de geconsolideerde winst- en verliesrekening, bedoeld in artikel 66, tweede lid, telkenjare
      berekend alsof consolidatie slechts heeft plaatsgevonden van resultaten behaald aan de zeezijde respectievelijk aan
      de landzijde.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: '158.2'
    text: |-
      Nog te compenseren voor de inwerkingtreding van deze wet geleden verliezen aan de zeezijde respectievelijk aan de
      landzijde, worden slechts verrekend met de over een der jaren na de inwerkingtreding van deze wet overeenkomstig
      het eerste lid berekende geconsolideerde resultaten behaald aan de zeezijde respectievelijk aan de landzijde.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel158
  - number: '158.3'
    text: |-
      Indien het resultaat van de geconsolideerde winst- en verliesrekening, bedoeld in [artikel 66, tweede lid][ref1],
      over een der jaren na de inwerkingtreding van deze wet negatief is, wordt dit verlies met inachtneming van de
      wettelijke termijn, bedoeld in [artikel 20, tweede lid, van de Wet op de vennootschapsbelasting 1969][ref2],
      slechts verrekend met het resultaat van de geconsolideerde winst- en verliesrekening, bedoeld in
      [artikel 66, tweede lid][ref3], over een der jaren na de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel158
    references:
