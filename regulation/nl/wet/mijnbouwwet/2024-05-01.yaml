        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '156'
    text: |-
      Voor de toepassing van [artikel 66, eerste lid][ref1], wordt tot het resultaat niet gerekend afschrijving op de
      koopsom ter zake van een voor de inwerkingtreding van deze wet overgenomen winningsvergunning, voorzover deze
      koopsom de door de overdrager van die vergunning nog niet reeds ten laste van een winst- en verliesrekening
      gebrachte kosten te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: '157'
    text: |-
      Voorzover als gevolg van afschrijving op niet reeds ten laste van een andere winst- en verliesrekening gebrachte
      kosten, gemaakt voor de inwerkingtreding van deze wet en voordat de winningsvergunning is verleend, het resultaat
      van een geconsolideerde winst- en verliesrekening aan de zeezijde respectievelijk aan de landzijde negatief is,
      wordt voor de toepassing van [artikel 66, tweede en derde lid][ref1], het resultaat van de geconsolideerde winst-
      en verliesrekening berekend alsof consolidatie slechts heeft plaatsgevonden van resultaten behaald aan de zeezijde
      respectievelijk aan de landzijde.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel157
