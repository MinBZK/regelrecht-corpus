        afdeling: '4'
  - number: '143.1'
    text: 'Als opsporingsvergunning wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
  - number: 143.1.a
    text: |-
      een vergunning verleend krachtens [artikel 2 van de Wet opsporing delfstoffen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002579#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002579
        artikel: '2'
  - number: 143.1.b
    text: |-
      een opsporingsvergunning verleend krachtens [artikel 2 van de Mijnwet continentaal plat][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '2'
  - number: 143.1.c
    text: |-
      een ontheffing verleend krachtens [artikel 2 van de Mijnwet continentaal plat][ref1], indien deze uitsluitend
      betrekking heeft op onderzoekingen die kunnen leiden tot het aantonen van de aanwezigheid van delfstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '2'
  - number: '143.2'
    text: 'Als winningsvergunning wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
  - number: 143.2.a
    text: |-
      een concessie verleend krachtens [artikel 5 van de wet van 21 april 1810 (Bulletin des Lois no. 285)][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001821#Artikel5
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0001821
        artikel: '5'
  - number: 143.2.b
    text: |-
      een aanwijzing van een mijn bij of krachtens de
      [wet van 24 juni 1901, betreffende exploitatie van Staatswege van steenkolenmijnen in Limburg (Stb. 170)][ref1],
      de [wet van 18 juni 1918 tot ontginning van steenzout bij Buurse (Stb. 421)][ref2] of de
      [wet van 27 september 1920 tot uitbreiding van het Staatsmijnveld (Stb. 752)][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0001868
      [ref2]: https://wetten.overheid.nl/BWBR0001893
      [ref3]: https://wetten.overheid.nl/BWBR0001901
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0001868
      - id: ref2
        bwb_id: BWBR0001893
      - id: ref3
        bwb_id: BWBR0001901
  - number: 143.2.c
    text: |-
      een winningsvergunning verleend krachtens [artikel 2 van de Mijnwet continentaal plat][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '2'
  - number: 143.2.d
    text: |-
      een ontheffing verleend krachtens [artikel 2 van de Mijnwet continentaal plat][ref1], indien deze betrekking heeft
      of mede betrekking heeft op het winnen van delfstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '2'
  - number: '143.3'
    text: |-
      De voorwaarden, beperkingen of voorschriften, verbonden aan een besluit als bedoeld in het eerste lid, onderdelen
      a tot en met c, gaan gelden als aan de opsporingsvergunning verbonden beperkingen of voorschriften. De voorwaarden,
      beperkingen of voorschriften, verbonden aan een besluit als bedoeld in het tweede lid, onderdelen a tot en met d,
      gaan gelden als aan de winningsvergunning verbonden beperkingen of voorschriften.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
  - number: '143.4'
    text: |-
      In afwijking van [artikel 3][ref1] is de houder van een vergunning die ingevolge het tweede lid, aanhef en
      onderdeel a of b, als een winningsvergunning wordt beschouwd, voor het tijdvak waarvoor de vergunning geldt
      eigenaar van de mijn waarop zij betrekking heeft. Als een overeenkomst met de vennootschap tot stand is gekomen
      als bedoeld in [artikel 3, tweede lid][ref2], geldt dat tweede lid voor de vennootschap onverminderd, zodra de
      delfstoffen zijn gewonnen, tenzij in de overeenkomst een verdeling van de financiële opbrengst is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel3
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '3'
        hoofdstuk: '1'
  - number: '143.5'
    text: 'Als mijnbouwmilieuvergunning wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
  - number: 143.5.a
    text: |-
      een goedkeuring verleend overeenkomstig artikel 4.6 of 5.7 van de Regeling vergunningen en concessies delfstoffen
      Nederlands territoir 1996, of een soortgelijke goedkeuring op basis van voor de inwerkingtreding van die regeling
      verleende vergunningen of concessies;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
  - number: 143.5.b
    text: |-
      een vergunning verleend krachtens [artikel 30a van het Mijnreglement continentaal plat][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002564#Artikel30a
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002564
        artikel: 30a
  - number: '143.6'
    text: |-
      In afwijking van het vijfde lid wordt de goedkeuring of de vergunning die betrekking heeft op een inrichting waarop
      bij de inwerkingtreding van deze wet [hoofdstuk 8 van de Wet milieubeheer][ref1] van toepassing is, niet beschouwd
      als een mijnbouwmilieuvergunning maar als een milieuvergunning als bedoeld in dat hoofdstuk. Deze milieuvergunning
      wordt, indien [artikel 153, derde lid][ref2], op de inrichting van toepassing is, samen met de in dat lid bedoelde
      milieuvergunning als één milieuvergunning beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel153
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '153'
        hoofdstuk: '11'
  - number: '143.7'
    text: |-
      De beperkingen of voorschriften die aan een goedkeuring of een vergunning als bedoeld in het vijfde lid zijn
      verbonden, gaan gelden als aan de mijnbouwmilieuvergunning of aan de milieuvergunning verbonden beperkingen of
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
  - number: '143.8'
    text: |-
      Een houder van een winningsvergunning als bedoeld in het tweede lid, onderdeel a, die voor 1965 is verleend
      voor het winnen van koolwaterstoffen, die met toepassing van [artikel 20, eerste lid][ref1], een deel van zijn
      vergunning op een ander wil doen overgaan, dient in afwijking van artikel 20, tweede lid, tevens een aanvraag in
      tot afsplitsing van dat deel van die vergunning. Bij een afsplitsing wordt de vergunning uitsluitend gewijzigd
      door van het gebied waarop die vergunning betrekking heeft, af te splitsen een gebiedsdeel dat de vergunninghouder
      wil doen overgaan op een ander en wordt aan deze vergunninghouder voor het afgesplitste gebiedsdeel een
      winningsvergunning verleend die niet als een winningsvergunning als bedoeld in het tweede lid, onderdeel a, wordt
      beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel20
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '143.9'
    text: |-
      Aan de winningsvergunning voor het afgesplitste gebiedsdeel worden de beperkingen en voorschriften verbonden die
      zijn verbonden aan de winningsvergunning waarvan dat gebiedsdeel is afgesplitst, voor zover dit verenigbaar is met
      het bij en krachtens de wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
  - number: '143.10'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het afsplitsen van een
      winningsvergunning als bedoeld in het tweede lid, onderdeel a, die voor 1965 is verleend voor het winnen van
      koolwaterstoffen met betrekking tot de bepaling van het af te splitsen gebied en het aan de afsplitsing aanpassen
      van beperkingen die zijn gesteld of voorschriften die aan de vergunning zijn verbonden, mede met het oog op het
      planmatig beheer of gebruik van delfstoffen, aardwarmte, andere natuurlijke rijkdommen, waaronder grondwater met
      het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van stoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
  - number: '143.11'
    text: |-
      Een overeenkomst als bedoeld in [artikel 147, eerste en tweede lid][ref1], blijft door een afsplitsing van
      een winningsvergunning, ongewijzigd in stand voor het gebied waarop de winningsvergunning waarvan een deel is
      afgesplitst betrekking heeft en vervalt voor het afgesplitste gebiedsdeel op het tijdstip dat de daarvoor verleende
      winningsvergunning in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel147
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '147'
        hoofdstuk: '11'
  - number: '143.12'
    text: |-
      Een afsplitsing van een winningsvergunning en een voor een afgesplitst gebiedsdeel verleende winningsvergunning,
      treden niet eerder in werking dan op het tijdstip waarop de voor het afgesplitste gebiedsdeel verleende
      winningsvergunning onherroepelijk op een ander overgaat.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
  - number: '143.13'
    text: |-
      Op een houder van een voor een afgesplitst gebiedsdeel verleende winningsvergunning, is ten aanzien van die
      vergunning het vierde lid van overeenkomstige toepassing en is [paragraaf 5.2.3][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
  - number: '144'
    text: |-
      Als winningsplan als bedoeld in [artikel 34][ref1] geldt een door Onze Minister goedgekeurd winningsplan als
      bedoeld in artikel 5.2 van de Regeling vergunningen koolwaterstoffen continentaal plat 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '145.1'
    text: |-
      Gedurende een in het tweede lid genoemde termijn kan na het tijdstip van inwerkingtreding van deze wet het winnen
      van delfstoffen zonder een in [artikel 34][ref1] genoemd winningsplan worden voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '145.2'
    text: 'De termijn voor voortzetting van het winnen van delfstoffen is ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel145
  - number: 145.2.a
    text: |-
      voorzover het betreft winning uit voorkomens in het continentaal plat of onder de territoriale zee gelegen aan de
      zeezijde van de in de bijlage bij deze wet vastgelegde lijn: zes maanden, en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel145
  - number: 145.2.b
    text: 'voor ander dan onder a genoemd gebied: twaalf maanden.'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel145
  - number: '145.3'
    text: |-
      Indien een houder van een andere dan in [artikel 144][ref1] bedoelde winningsvergunning voor de afloop van de
      voor hem geldende termijn een winningsplan als bedoeld in [artikel 34][ref2] bij Onze Minister heeft ingediend en
      niet voor de afloop de beslissing van Onze Minister onherroepelijk vaststaat, kan de winning in elk geval worden
      voortgezet tot het laatstbedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel144
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '144'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '146.1'
    text: |-
      De beperkingen of voorschriften die op grond van [artikel 143, derde lid][ref1], aan een vergunning zijn
      verbonden, gelden niet voorzover zij betreffen de betaling van een oppervlakterecht, een cijns of een aandeel in
      de winst in verband met het opsporen of het winnen van koolwaterstoffen. De eerste volzin is niet van toepassing
      op concessies die zijn verleend voor 1962. In dat geval is [afdeling 5.1.1.][ref2], met uitzondering van
      [paragraaf 5.1.1.5.][ref3], welke paragraaf van overeenkomstige toepassing is, niet van toepassing. De beperkingen
      en voorschriften gelden eveneens niet voorzover zij een uitkering aan gemeenten in verband met het winnen van
      koolwaterstoffen betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        afdeling: 5.1.1
      - id: ref3
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.1.1.5
        afdeling: 5.1.1
  - number: '146.2'
    text: |-
      Onze Minister kan de beperkingen of voorschriften die op grond van [artikel 143, derde of zevende lid][ref1], aan
      een vergunning zijn verbonden, wijzigen of intrekken, voorzover over het onderwerp hiervan regels zijn gesteld ter
      bescherming van de door de beperkingen en voorschriften beschermde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '146.3'
    text: |-
      Onze Minister kan ten aanzien van een opsporingsvergunning of een winningsvergunning als bedoeld in
      [artikel 143][ref1] die wordt gehouden door meer dan een natuurlijke persoon of rechtspersoon, de in
      [artikel 22][ref2] bedoelde persoon aanwijzen. Zolang geen aanwijzing heeft plaatsgevonden wordt als de aangewezen
      persoon beschouwd degene die de feitelijke werkzaamheden verricht of daartoe opdracht verleent. In dat geval is
      [artikel 22, achtste lid, tweede zin][ref3], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '146.4'
    text: |-
      [Paragraaf 5.2.3][ref1] is niet van toepassing op een winningsvergunning als bedoeld in
      [artikel 143, tweede lid][ref2], behoudens toepassing van [artikel 97b, tweede lid][ref3]. Indien aan een
      vergunning als bedoeld in de eerste volzin het voorschrift is verbonden dat de in de vergunning aangewezen
      vennootschap verzet kan aantekenen tegen een besluit van de vergunninghouder, treedt [artikel 97a][ref4] voor dit
      voorschrift in de plaats. Indien toepassing is gegeven aan het slot van de eerste volzin en aan de desbetreffende
      winningsvergunning voorschriften zijn verbonden omtrent deelneming door een in die vergunning aangewezen
      vennootschap, vervallen op het tijdstip waarop de mijnbouwovereenkomst tot stand is gebracht en goedgekeurd die
      voorschriften en treedt de mijnbouwovereenkomst in de plaats van een op grond van die voorschriften gesloten
      overeenkomst van samenwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel97b
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel97a
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: 97b
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: 97a
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
  - number: '146.5'
    text: |-
      Indien de vennootschap op grond van de aan een opsporingsvergunning als bedoeld in [artikel 143, eerste lid][ref1],
      onderscheidenlijk een winningsvergunning als bedoeld in artikel 143, tweede lid, verbonden voorschriften een
      overeenkomst van samenwerking heeft gesloten met de houder van die vergunning, wordt de uitvoering van die
      overeenkomst aangemerkt als uitvoering van de taak, bedoeld in [artikel 82, eerste lid, onderdeel a][ref2],
      onderscheidenlijk de taak, bedoeld in artikel 82, eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel82
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '82'
        hoofdstuk: '5'
        paragraaf: 5.2.1
        afdeling: '5.2'
  - number: '147.1'
    text: |-
      Bepalingen in een overeenkomst die voor de inwerkingtreding van deze wet is gesloten tussen de staat en de
      houder van een opsporingsvergunning of een winningsvergunning als bedoeld in [artikel 143][ref1] of diens
      rechtsvoorganger, welke overeenkomst samenhangt met de in het eerste of tweede lid van dat artikel bedoelde
      besluiten, komen bij de inwerkingtreding van deze wet te vervallen voorzover zij in strijd zijn met deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '147.2'
    text: |-
      In afwijking van het eerste lid blijven de bepalingen in stand voorzover de overeenkomst samenhangt met een besluit
      als bedoeld in [artikel 143, tweede lid][ref1], dat is genomen voor 1962 en de bepalingen betrekking hebben op
      financiële afdrachten aan de staat, waaronder begrepen de aansprakelijkheid voor die afdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '147.3'
    text: |-
      Bepalingen in een overeenkomst die voor de inwerkingtreding van deze wet is gesloten omtrent onderling overleg bij
      het winnen van delfstoffen uit een voorkomen dat de grens van een vergunningsgebied overschrijdt, worden geacht te
      zijn gesloten op basis van [artikel 42, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel42
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '147.4'
    text: |-
      Bepalingen in een overeenkomst als bedoeld in het eerste lid omtrent het verwijderen van mijnbouwinstallaties als
      bedoeld in [artikel 44][ref1], voorzover deze installaties bij de inwerkingtreding van deze wet nog in gebruik
      zijn, komen bij de inwerkingtreding van deze wet te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '148.1'
    text: |-
      In het geval dat een vergunning ingevolge [artikel 143, tweede lid, onderdeel c][ref1], als een
      winningsvergunning wordt beschouwd en op grond van deze vergunning een vennootschap is opgericht als bedoeld
      in [artikel 11, tweede lid, onderdeel a, van de Mijnwet continentaal plat][ref2], zoals deze luidde voor de
      inwerkingtreding van deze wet, worden tot het in [artikel 66, eerste lid][ref3], bedoelde resultaat gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0002504#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0002504
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 148.1.a
    text: mede de bedragen die ten goede komen aan de vennootschap;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel148
  - number: 148.1.b
    text: |-
      niet de bedragen die de houder van de winningsvergunning heeft ontvangen van de vennootschap, als houder van
      aandelen of van winstbewijzen van die vennootschap.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel148
  - number: '148.2'
    text: |-
      In het geval, bedoeld in het eerste lid, worden tot het in [artikel 66, eerste lid][ref1], bedoelde resultaat
      gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 148.2.a
    text: mede de kosten die voor rekening komen van de vennootschap;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel148
  - number: 148.2.b
    text: niet de rente over het eigen vermogen van de vennootschap.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel148
  - number: '149.1'
    text: |-
      Indien de houder van een winningsvergunning als bedoeld in [artikel 143][ref1] of zijn rechtsvoorganger voor
      de inwerkingtreding van deze wet een overeenkomst met de staat heeft gesloten omtrent het opslaan van stoffen,
      waarvoor bij de inwerkingtreding van deze wet op grond van [artikel 25][ref2] een vergunningsplicht geldt,
      verkrijgt de houder op dat moment van rechtswege een opslagvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '149.2'
    text: |-
      Onze Minister stelt binnen drie maanden na de inwerkingtreding van deze wet de bij de vergunning behorende
      beperkingen en voorschriften vast. De beperkingen en voorschriften worden afgestemd op de in het eerste
      lid bedoelde overeenkomst. De overeenkomst vervalt op het tijdstip waarop de beperkingen en voorschriften
      onherroepelijk van kracht worden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel149
  - number: '149.3'
    text: |-
      [Artikel 26, derde lid][ref1], alsmede [hoofdstuk 3a][ref2] zijn niet van toepassing op de houder van een
      winningsvergunning als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk3a
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: 3a
  - number: '150.1'
    text: |-
      Ten aanzien van een winningsvergunning als bedoeld in [artikel 143, tweede lid, aanhef en onderdeel a of b][ref1],
      wordt [artikel 21, eerste lid, onderdeel b][ref2], of [artikel 32b][ref3] slechts toegepast tegen vooraf verzekerde
      schadeloosstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel32b
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: 32b
        hoofdstuk: 3a
  - number: '150.2'
    text: |-
      Een winningsvergunning als bedoeld in [artikel 143, tweede lid][ref1], die in de plaats komt van een in dat lid
      bedoeld besluit dat is genomen voor 1 januari 1965, vervalt twee jaar na het tijdstip van inwerkingtreding van deze
      wet, indien gedurende vijf jaren voor die inwerkingtreding geen opsporing of winning heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '150.3'
    text: |-
      Het tweede lid geldt niet, indien de houder binnen de in dat lid bedoelde termijn van twee jaar aan Onze Minister
      kenbaar heeft gemaakt houder van de winningsvergunning te willen blijven.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel150
  - number: '151'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld ten aanzien van opsporingsvergunningen,
      winningsvergunningen, milieuvergunningen of mijnbouwmilieuvergunningen als bedoeld in [artikel 143][ref1] en ten
      aanzien van activiteiten die met gebruikmaking van die vergunningen worden verricht. De regels zijn gericht op
      een goede invoering van de wet ten aanzien van die vergunningen. De regels kunnen afwijken van de bij of krachtens
      de [hoofdstukken 1 tot en met 5][ref2], [7][ref3] en [11][ref4] gestelde bepalingen, indien dit voor een goede
      invoering van de wet noodzakelijk is, gelet op de door die bepalingen beschermde belangen. Bij de maatregel worden
      in ieder geval regels gesteld omtrent het wijzigen of intrekken van beperkingen of voorschriften die op grond van
      [artikel 143, derde of zevende lid][ref5], aan de vergunning zijn verbonden, voorzover over het onderwerp hiervan
      regels zijn gesteld ter bescherming van de door de beperkingen en voorschriften beschermde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk11
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0014168
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0014168
        hoofdstuk: '11'
      - id: ref5
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '152.1'
    text: |-
      Een voor de inwerkingtreding van deze wet ingediende aanvraag om een besluit als bedoeld in
      [artikel 143, eerste lid][ref1], wordt beschouwd als een aanvraag om een opsporingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '152.2'
    text: |-
      Een voor de inwerkingtreding van deze wet ingediende aanvraag om een besluit als bedoeld in
      [artikel 143, tweede lid][ref1], wordt beschouwd als een aanvraag om een winningsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '152.3'
    text: |-
      Een voor de inwerkingtreding van deze wet ingediende aanvraag om een goedkeuring of een vergunning als bedoeld
      in [artikel 143, vijfde lid][ref1], wordt beschouwd als een aanvraag om een mijnbouwmilieuvergunning of een
      milieuvergunning overeenkomstig de toedeling in artikel 143, vijfde en zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '153.1'
    text: |-
      Degene die bij de inwerkingtreding van deze wet een mijnbouwwerk in stand houdt, waarvoor voor dat tijdstip geen
      goedkeuring of vergunning als bedoeld in [artikel 143, vijfde lid][ref1], noodzakelijk was en waarvoor op dat
      tijdstip het verbod, bedoeld in [artikel 40, tweede lid][ref2], is gaan gelden, verkrijgt op dat tijdstip van
      rechtswege een mijnbouwmilieuvergunning voor het mijnbouwwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel40
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '153.2'
    text: |-
      Degene die bij de inwerkingtreding van deze wet een mijnbouwwerk in stand houdt, waarvoor voor dat tijdstip het
      in [artikel 8.1, eerste lid, van de Wet milieubeheer][ref1] vervatte verbod niet gold noch een goedkeuring of
      vergunning als bedoeld in [artikel 143, vijfde lid][ref2], noodzakelijk was en waarvoor het verbod op dat tijdstip
      is gaan gelden, verkrijgt op dat tijdstip van rechtswege een milieuvergunning als bedoeld in artikel 8.1 van de Wet
      milieubeheer voor de desbetreffende inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '153.3'
    text: |-
      Een vergunning als bedoeld in [artikel 8.1, eerste lid, van de Wet milieubeheer][ref1] die van
      kracht was voor de inwerkingtreding van deze wet voor een inrichting waarop wat betreft het
      ondergrondse deel [hoofdstuk 8 van de Wet milieubeheer][ref2] niet van toepassing was op grond van
      [artikel 22.1, eerste lid, onderdeel a, van die wet][ref3], wordt geacht vanaf dat tijdstip ook te zijn verleend
      voor het ondergrondse deel.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel22
