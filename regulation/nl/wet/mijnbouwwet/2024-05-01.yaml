  - number: 31b
    text: 'Een aanvraag om een vergunning voor permanent opslaan van CO omvat ten minste de volgende onderwerpen:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31b
  - number: 31b.a
    text: het tijdvak van injectie van CO en de omvang van het vergunningsgebied,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31b
  - number: 31b.b
    text: |-
      een karakterisering van het opslagvoorkomen en het opslagcomplex en een beoordeling van de verwachte veiligheid van
      de opslag,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31b
  - number: 31b.c
    text: de technische en financiële mogelijkheden van de aanvrager,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31b
  - number: 31b.d
    text: de totale hoeveelheid CO die zal worden opgeslagen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31b
  - number: 31b.e
    text: de toekomstige bronnen van CO en transportmethoden,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31b
  - number: 31b.f
    text: de samenstelling van de CO-stroom,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31b
  - number: 31b.g
    text: de maximum toelaatbare snelheid en druk bij injectie van CO en de maximaal toelaatbare druk van de opgeslagen CO,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31b
  - number: 31b.h
    text: de ligging van het voorkomen waar CO zal worden opgeslagen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31b
  - number: 31b.i
    text: risicobeheer,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31b
  - number: 31b.j
    text: monitoring,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31b
  - number: 31b.k
    text: afsluiting,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31b
  - number: 31b.l
    text: corrigerende maatregelen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31b
  - number: 31b.m
    text: bodembeweging, en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31b
  - number: 31b.n
    text: |-
      een omschrijving van de financiële zekerheid of een gelijkwaardige voorziening die gesteld zal worden en een bewijs
      dat deze rechtsgeldig en daadwerkelijk wordt gesteld voordat met de opslag van CO wordt aangevangen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31b
  - number: 31c.1
    text: |-
      Onze Minister zendt een aanvraag om een vergunning voor permanent opslaan van CO die voldoet aan
      [artikel 31b][ref1] met de daarbij behorende stukken binnen een maand na de ontvangst daarvan aan de Europese
      Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31b
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31b
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 31c.2
    text: |-
      Onze Minister zendt het ontwerp van een vergunning voor permanent opslaan van CO met de daarbij behorende stukken
      voor advies aan de Europese Commissie binnen zes maanden:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31c
  - number: 31c.2.a
    text: |-
      na afloop van de termijn, bedoeld in [artikel 26b, derde lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel26b
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 26b
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 31c.2.b
    text: |-
      na ontvangst van de aanvraag om de vergunning indien [artikel 26a, eerste lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel26a
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 26a
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 31c.3
    text: Onze Minister neemt een besluit op een aanvraag binnen uiterlijk tien maanden na de ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31c
  - number: 31c.4
    text: Onze Minister kan de termijnen, genoemd in het tweede en derde lid, eenmaal met ten hoogste zes maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31c
  - number: 31c.5
    text: Van een beschikking tot verlening van een vergunning wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31c
  - number: 31c.6
    text: |-
      Onze Minister zendt afschrift van het besluit omtrent de aanvraag ter kennisneming naar de Europese Commissie. Een
      afwijking van het advies, bedoeld in het tweede lid, wordt met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31c
  - number: 31d.1
    text: 'Een vergunning voor permanent opslaan van CO omvat ten minste de volgende onderwerpen:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31d.1.a
    text: het tijdvak van injectie van CO en het gebied,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31d.1.b
    text: de ligging en begrenzing van het opslagvoorkomen en het gebied van het opslagcomplex,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31d.1.c
    text: gegevens met betrekking tot de hydraulische eenheid,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31d.1.d
    text: voorschriften voor het opslagproces,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31d.1.e
    text: de totale hoeveelheid CO die overeenkomstig de vergunning ten hoogste kan worden opgeslagen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31d.1.f
    text: de grenswaarden van de druk van de opgeslagen CO,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31d.1.g
    text: de maximum toelaatbare snelheid en druk bij injectie van CO en de maximaal toelaatbare druk van het opgeslagen CO,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31d.1.h
    text: risicobeheer,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31d.1.i
    text: monitoring,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31d.1.j
    text: afsluiting,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31d.1.k
    text: corrigerende maatregelen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31d.1.l
    text: bodembeweging,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31d.1.m
    text: |-
      de samenstelling van de CO-stroom die wordt opgeslagen met inbegrip van stoffen die worden toegevoegd ten behoeve
      van de monitoring en de controle van CO-migratie, en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31d.1.n
    text: het bedrag aan financiële zekerheid of een gelijkwaardige voorziening.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31d.2
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] met uitzondering van [artikel 3:18][ref2] is van toepassing
      op de voorbereiding van het besluit over een vergunning voor permanent opslaan van CO, voor zover de opslag niet
      geschiedt in het continentaal plat of onder de territoriale zee in een opslagvoorkomen dat is gelegen aan de
      zeezijde van de in de bijlage bij deze wet vastgelegde lijn. Zienswijzen kunnen naar voren worden gebracht door een
      ieder. Afdeling 3.4 van de Algemene wet bestuursrecht is niet van toepassing indien het een besluit betreft inzake
      wijziging van een besluit omtrent een vergunning als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 31d.3
    text: Bij of krachtens algemene maatregel van bestuur kunnen omtrent het eerste lid regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31d
  - number: 31e.1
    text: |-
      Een houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door meerdere personen wordt
      gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref1] stelt Onze Minister in kennis van de geplande
      wijzigingen van de exploitatie van het opslagvoorkomen en de injectiefaciliteiten met bijbehorende bovengrondse
      voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31e
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 31e.2
    text: |-
      Op een aanvraag van de houder van een vergunning voor permanent opslaan van CO om wijziging van een of meer
      onderdelen van een verleende vergunning is [artikel 31d, eerste lid][ref1], voor zover relevant van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31d
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31e
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31d
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 31f.1
    text: |-
      Een houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door meerdere personen wordt
      gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref1] houdt in een register bij de hoeveelheden en
      kenmerken van de geleverde, opgeslagen en weggelekte CO-stromen met inbegrip van hun samenstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31f
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 31f.2
    text: Bij ministeriële regeling worden regels gesteld omtrent de inrichting van het register.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31f
  - number: 31g.1
    text: |-
      De houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door meerdere personen wordt
      gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref1] verstrekt ten minste elk jaar aan Onze Minister
      de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31g
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 31g.1.a
    text: de resultaten van de monitoring van de opgeslagen CO met vermelding van de gebruikte technologie,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31g
  - number: 31g.1.b
    text: |-
      de hoeveelheden en kenmerken van de geleverde en opgeslagen CO-stromen met vermelding van de samenstelling van
      deze stromen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31g
  - number: 31g.1.c
    text: het bewijs dat financiële zekerheid of een gelijkwaardige voorziening is gesteld en aangehouden, en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31g
  - number: 31g.1.d
    text: |-
      andere gegevens die Onze Minister van belang acht voor het beoordelen van de belangen genoemd in
      [artikel 27, eerste lid, onderdelen a, b en c, en derde lid, onderdeel b][ref1], en voor het vergroten van de
      kennis van het CO-gedrag in het opslagvoorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel27
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31g
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 31g.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gegevens, bedoeld in het
      eerste lid, en tijdstip van verstrekking.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31g
  - number: 31h.1
    text: 'Onze Minister wijzigt waar nodig een vergunning voor permanent opslaan van CO of trekt deze in:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31h
  - number: 31h.1.a
    text: na kennis te hebben genomen van lekkages of significante onregelmatigheden,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31h
  - number: 31h.1.b
    text: |-
      indien blijkt dat de vergunningsvoorwaarden niet worden nageleefd of dat er risico is op lekkages of significante
      onregelmatigheden,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31h
  - number: 31h.1.c
    text: |-
      indien dit noodzakelijk blijkt op basis van de meest recente wetenschappelijke bevindingen en technologische
      vooruitgang, of
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31h
  - number: 31h.1.d
    text: indien de gestelde financiële zekerheid of een gelijkwaardige voorziening onvoldoende blijkt te zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31h
  - number: 31h.2
    text: |-
      Beoordeling van de vergunning vindt plaats nadat een periode van vijf jaar na de verlening van de vergunning is
      verstreken en vervolgens om de tien jaar.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31h
  - number: 31i.1
    text: |-
      Een houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door meerdere personen wordt
      gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref1] sluit een opslagvoorkomen af en verwijdert
      de injectiefaciliteiten met de bijbehorende bovengrondse voorzieningen indien opslag van CO overeenkomstig de
      voorschriften van zijn vergunning is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31i
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 31i.2
    text: |-
      Alvorens te beginnen met de afsluiting van het opslagvoorkomen en de verwijdering van de injectiefaciliteiten met
      de bijbehorende bovengrondse voorzieningen dient de houder of de aangewezen persoon, bedoeld in het eerste lid, een
      geactualiseerde versie van de documenten, bedoeld in [artikel 31d, eerste lid, onderdelen h tot en met l][ref1],
      bij Onze Minister in.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31d
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31i
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31d
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 31i.3
    text: |-
      De houder of de aangewezen persoon, bedoeld in het eerste lid, vangt niet eerder aan met de afsluiting dan nadat
      Onze Minister met de geactualiseerde versie heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31i
  - number: 31j.1
    text: |-
      Onze Minister trekt een vergunning voor permanent opslaan van CO op eigen beweging of op verzoek van de
      vergunninghouder in indien:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31j
  - number: 31j.1.a
    text: |-
      door de houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door meerdere personen
      wordt gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref1] schriftelijk is aangetoond dat het
      opgeslagen CO volledig en permanent ingesloten blijft,


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31j
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 31j.1.b
    text: |-
      het opslagvoorkomen is afgesloten en de injectiefaciliteiten met de bijbehorende bovengrondse voorzieningen zijn
      verwijderd,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31j
  - number: 31j.1.c
    text: |-
      na het tijdstip waarop het opslagvoorkomen is afgesloten en de bijbehorende bovengrondse voorzieningen en
      injectiefaciliteiten zijn verwijderd een periode van tenminste 20 jaar is verstreken of zoveel korter of langer als
      naar het oordeel van Onze Minister, gelet op onderdeel a, verantwoord is, en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31j
  - number: 31j.1.d
    text: |-
      de houder, bedoeld in onderdeel a, hem een financiële bijdrage ter beschikking heeft gesteld waarmee de voorziene
      kosten, doch ten minste de geraamde monitoringskosten gedurende een periode van 30 jaar, ingaande op het tijdstip
      van intrekking worden gedekt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31j
  - number: 31j.2
    text: |-
      Op het document, bedoeld in het eerste lid, onderdeel a, en een besluit als bedoeld in het eerste lid zijn de
      artikelen [artikel 31c][ref1] en [31d, tweede lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31c
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel31d
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31j
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31c
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 31d
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 31j.3
    text: Bij of krachtens algemene maatregel van bestuur worden omtrent het eerste lid regels gesteld.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31j
  - number: 31k.1
    text: |-
      Met ingang van het tijdstip waarop een vergunning ingevolge [artikel 31j][ref1] is ingetrokken, is Onze Minister
      belast met:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31j
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31k
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31j
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 31k.1.a
    text: monitoring,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31k
  - number: 31k.1.b
    text: corrigerende maatregelen en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31k
  - number: 31k.1.c
    text: |-
      de preventieve en herstelmaatregelen, bedoeld in de [artikelen 17.12][ref1] en
      [17.13 van de Wet milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31k
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '17'
  - number: 31k.2
    text: 'Indien na het tijdstip, bedoeld in het eerste lid, lekkages van CO plaatsvinden:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31k
  - number: 31k.2.a
    text: meldt Onze Minister de lekkages aan de Nederlandse emissieautoriteit en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31k
  - number: 31k.2.b
    text: |-
      levert Onze Minister voor 1 mei van het daarop volgende kalenderjaar ten minste een aantal
      broeikasgasemissierechten als bedoeld in [artikel 1:1 van de Wet milieubeheer][ref1] in, dat overeenkomt met de
      hoeveelheid van de emissie ten gevolge van de lekkages.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31k
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 31k.3
    text: |-
      Met ingang van het tijdstip, bedoeld in het eerste lid, vervalt de verplichting de gestelde financiële zekerheid of
      een gelijkwaardige voorziening aan te houden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31k
  - number: 31k.4
    text: |-
      De monitoring betreft het niveau waarop lekkages of significante onregelmatigheden kunnen worden vastgesteld.
      Indien significante onregelmatigheden of dreiging daarvan worden vastgesteld, intensiveert Onze Minister de
      monitoring.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31k
  - number: 31k.5
    text: |-
      Onze Minister verhaalt de kosten die samenhangen met het eerste lid en zijn ontstaan na intrekking van de
      vergunning op de voormalige houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door
      meerdere personen wordt gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref1] voor zover hij niet
      zorgvuldig heeft gehandeld in de periode voorafgaande aan de intrekking van de opslagvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31k
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 31k.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen omtrent het eerste lid, onderdeel a, en het tweede lid
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31k
  - number: 31l.1
    text: |-
      Indien Onze Minister ingevolge [artikel 31h, eerste lid][ref1], een vergunning intrekt, zet hij de werkzaamheden
      met betrekking tot opslag voort in overeenstemming met de voorschriften die verbonden zijn aan de vergunning en
      [artikel 31f][ref2], totdat hij opnieuw een vergunning voor permanent opslaan van CO heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31h
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel31f
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31l
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31h
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 31f
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 31l.2
    text: |-
      Indien in afwijking van het eerste lid geen nieuwe vergunning wordt verleend sluit Onze Minister het
      opslagvoorkomen af en verwijdert de injectiefaciliteiten met de bijbehorende bovengrondse voorzieningen in
      overeenstemming met de voorschriften van de vergunning.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31l
  - number: 31l.3
    text: |-
      Indien het eerste dan wel tweede lid toepassing vindt, actualiseert Onze Minister zo nodig de documenten, bedoeld
      in [artikel 31d, eerste lid, onderdelen h tot en met l][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31d
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31l
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31d
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 31l.4
    text: |-
      De kosten die Onze Minister bij toepassing van het eerste tot en met derde lid maakt of heeft gemaakt, verhaalt
      hij op de voormalige houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door meerdere
      personen wordt gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref1]. Indien geen verhaal mogelijk
      is, verhaalt Onze Minister de kosten op de door de voormalige vergunninghouder gestelde financiële zekerheid of een
      gelijkwaardige voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31l
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 31l.5
    text: |-
      Onze Minister stelt in de periode die aanvangt met de intrekking van een vergunning de financiële zekerheid of een
      gelijkwaardige voorziening periodiek bij.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31l
  - number: 31l.6
    text: |-
      De door de voormalige vergunninghouder gestelde financiële zekerheid of een gelijkwaardige voorziening vervalt
      wanneer alle beschikbare gegevens naar het oordeel van Onze Minister aantonen dat het opgeslagen CO volledig en
      permanent ingesloten blijft na betaling van de kosten, bedoeld in het vierde lid, die nog niet door de voormalige
      houder of de aangewezen persoon, bedoeld in het vierde lid, zijn betaald, en de kosten die Onze Minister naar
      redelijke verwachting gedurende een aansluitende periode van 30 jaar zal moeten maken, waaronder kosten van
      monitoring.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31l
  - number: 31l.7
    text: |-
      Indien de kosten als bedoeld in het zesde lid meer bedragen dan de financiële zekerheid of een gelijkwaardige
      voorziening verhaalt Onze Minister deze meerdere kosten op de voormalige houder of aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31l
  - number: 31l.8
    text: |-
      Indien het eerste of tweede lid van toepassing is, is Onze Minister belast met het inleveren van rechten als
      bedoeld in [artikel 31k, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31k
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31l
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31k
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 31m
    text: |-
      Onze Minister houdt een register bij van de verleende vergunningen voor permanent opslaan van CO en het afgesloten
      opslagvoorkomen en omliggende opslagcomplexen inclusief informatie aan de hand waarvan kan worden beoordeeld of de
      opgeslagen CO volledig en permanent ingesloten is.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31m
  - number: 31n
    text: |-
      Onze Minister draagt er zorg voor dat de milieu-informatie over permanent opslaan van CO voor een ieder
      toegankelijk is. [Artikel 5.1, eerste en tweede lid, van de Wet open overheid][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31n
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
  - number: 31o
    text: |-
      Indien [artikel 42, derde lid][ref1], van toepassing is, vangt de houder van een vergunning voor permanent opslaan
      van CO niet aan met het permanent opslaan van CO dan nadat een overeenkomst als bedoeld in artikel 42, derde lid,
      tot stand is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel42
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel31o
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '32.1'
    text: |-
      Een houder van een vergunning voor permanent opslaan van CO of, indien de vergunning door meerdere personen wordt
      gehouden, een aangewezen persoon als bedoeld in [artikel 22][ref1] en een exploitant van een transportnetwerk zijn
      verplicht op voorwaarden die redelijk, transparant en niet-discriminerend zijn voor degene die daarom verzoekt CO
      in zijn opslagvoorkomen op te slaan respectievelijk door zijn transportnetwerk te transporteren.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '32.2'
    text: |-
      Een houder en een exploitant als bedoeld in de eerste volzin kunnen het verzoek om opslag of transport weigeren op
      grond van een gebrek aan capaciteit, verbindingsmogelijkheden of onverenigbaarheid van technische specificaties.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32
  - number: '32.3'
    text: |-
      Beroep op een gebrek aan capaciteit of verbindingsmogelijkheden kan niet worden gedaan indien de houder en de
      exploitant het gebrek kunnen opheffen met het uitvoeren van de nodige capaciteitsverhogende werkzaamheden voor
      zover dit economisch verantwoord is of de verzoeker bereid is de werkzaamheden te betalen en de uit te voeren
      werkzaamheden geen negatief effect hebben op de milieuveiligheid van het transport en de opslag van CO.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32
  - number: '32.4'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32
  - number: 32a.1
    text: |-
      Onze Minister inventariseert jaarlijks voor 1 april de delen van een gebied, waarvoor een vergunning voor het
      winnen van koolwaterstoffen of een opslagvergunning geldt, waar:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32a
  - number: 32a.1.a
    text: |-
      in de voorafgaande twee kalenderjaren geen significante activiteiten met betrekking tot het opsporen of winnen van
      koolwaterstoffen of het opslaan van stoffen hebben plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32a
  - number: 32a.1.b
    text: de winningsactiviteiten zijn gestaakt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32a
  - number: 32a.2
    text: Van de inventarisatie wordt door Onze Minister mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32a
  - number: 32b.1
    text: |-
      Onze Minister kan een gebied waarvoor een vergunning voor het winnen van koolwaterstoffen of opslagvergunning
      geldt, verkleinen met een deel ervan indien in dat deel gedurende een periode van de voorafgaande twee
      kalenderjaren geen significante activiteiten met betrekking tot het opsporen of winnen van koolwaterstoffen of het
      opslaan van stoffen hebben plaatsgevonden of de winningsactiviteiten zijn gestaakt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32b
  - number: 32b.2
    text: |-
      Onze Minister stelt de houder van een winnings- of opslagvergunning schriftelijk in kennis van zijn voornemen tot
      gebiedsverkleining als bedoeld in het eerste lid over te gaan en stelt hem daarbij in de gelegenheid binnen zes
      maanden, ingaande op de eerste dag na de dag van verzending van de kennisgeving, aannemelijk te maken dat in dat
      deel significante activiteiten als bedoeld in het eerste lid zijn of zullen worden verricht.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32b
  - number: 32b.3
    text: 'Van significante activiteiten als bedoeld in het tweede lid is in ieder geval sprake indien:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32b
  - number: 32b.3.a
    text: |-
      opsporings-, winnings- of opslagactiviteiten als bedoeld in [artikel 1, onderdeel e, f respectievelijk i][ref1],
      zijn verricht of binnen een naar het oordeel van Onze Minister redelijke termijn zullen worden verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
        hoofdstuk: '1'
  - number: 32b.3.b
    text: |-
      een winningsplan als bedoeld in [artikel 34][ref1] is ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 32b.3.c
    text: |-
      een opslagplan als bedoeld in [artikel 39][ref1] in samenhang met [artikel 34][ref2] is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 32b.4
    text: |-
      Uiterlijk vier maanden na afloop van de termijn, bedoeld in het tweede lid, of, indien de houder van de vergunning
      binnen die termijn schriftelijk heeft medegedeeld dat geen activiteiten zijn of zullen worden verricht, uiterlijk
      vier maanden nadat die mededeling is gedaan, geeft Onze Minister een beschikking omtrent verkleining van een
      vergunningsgebied. Onze Minister kan beperkingen en voorschriften verbinden aan de beschikking. Indien Onze
      Minister geen beschikking heeft gegeven binnen de termijn, bedoeld in de eerste volzin, wordt het gebied aangemerkt
      als niet te zijn verkleind.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32b
  - number: 32c.1
    text: |-
      Een beschikking als bedoeld in [artikel 32b][ref1] wordt zodanig gegeven dat zowel het vergunningsgebied
      dat na de verkleining resteert, als het deel waarmee het vergunningsgebied wordt verkleind voldoen aan
      [artikel 11, derde en vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel32b
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel11
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 32b
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 32c.2
    text: 'In de beschikking wordt in elk geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32c
  - number: 32c.2.a
    text: het vergunningsgebied dat na de verkleining resteert,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32c
  - number: 32c.2.b
    text: het deel waarmee het vergunningsgebied wordt verkleind en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32c
  - number: 32c.2.c
    text: het tijdstip waarop de verkleining van het gebied waarvoor een vergunning geldt, zal ingaan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32c
  - number: 32c.3
    text: Van de beschikking wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel32c
  - number: '33.1'
    text: |-
      De houder van een vergunning als bedoeld in [artikel 6][ref1] of [25][ref2], dan wel, ingeval de vergunning haar
      gelding heeft verloren, de laatste houder daarvan, neemt alle maatregelen die redelijkerwijs van hem gevergd kunnen
      worden om te voorkomen dat als gevolg van de met gebruikmaking van de vergunning verrichte activiteiten:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 33.1.a
    text: nadelige gevolgen voor mens en milieu worden veroorzaakt,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33
  - number: 33.1.b
    text: schade door bodembeweging wordt veroorzaakt,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33
  - number: 33.1.c
    text: de veiligheid wordt geschaad, of
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33
  - number: 33.1.d
    text: het belang van een planmatig beheer van voorkomens van delfstoffen of aardwarmte wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33
  - number: '33.2'
    text: |-
      De houder van een vergunning voor de opsporing of winning van koolwaterstoffen neemt alle noodzakelijke maatregelen
      om de gevolgen van een zwaar ongeval voor mens en milieu te beperken.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33
  - number: '33.3'
    text: |-
      Een houder van een startvergunning aardwarmte of een vervolgvergunning aardwarmte dan wel de laatste houder van een
      startvergunning aardwarmte of een vervolgvergunning aardwarmte neemt alle maatregelen die redelijkerwijs van hem
      gevergd kunnen worden om te voorkomen dat als gevolg van de verrichte activiteiten:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33
  - number: 33.3.a
    text: nadelige gevolgen voor mens en milieu worden veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33
  - number: 33.3.b
    text: schade door bodembeweging wordt veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33
  - number: 33.3.c
    text: de veiligheid wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33
  - number: '33.4'
    text: |-
      Een uitvoerder aardwarmte draagt zorg voor een goede en veilige uitvoering van het opsporen en winnen van
      aardwarmte en neemt alle maatregelen die redelijkerwijs van hem gevergd kunnen worden om te voorkomen dat als
      gevolg van de verrichte activiteiten:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33
  - number: 33.4.a
    text: nadelige gevolgen voor mens en milieu worden veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33
  - number: 33.4.b
    text: schade door bodembeweging wordt veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33
  - number: 33.4.c
    text: de veiligheid wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33
  - number: 33a.1
    text: |-
      De houder van een vergunning voor de opsporing of winning van koolwaterstoffen verricht de activiteiten op basis
      van systematisch risicobeheer, zodat de overblijvende risico’s op zware ongevallen voor mens, milieu en het
      mijnbouwwerk aanvaardbaar zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33a
  - number: 33a.2
    text: |-
      Bij de beoordeling van de aanvaardbaarheid van de risico’s, bedoeld in het eerste lid, wordt een risiconiveau
      gehanteerd waarbij de tijd, kosten of inspanningen voor een verdere beperking ervan zwaar onevenredig zouden zijn
      in relatie tot het voordeel van een dergelijke beperking. Bij het beoordelen of tijd, kosten of inspanningen zwaar
      onevenredig zouden zijn in relatie tot de voordelen van verdere risicoreductie, worden de tot de beste praktijken
      behorende risiconiveaus die passen bij de onderneming in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel33a
  - number: '34.1'
    text: Het winnen van delfstoffen vanuit een voorkomen geschiedt overeenkomstig een winningsplan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
  - number: '34.2'
    text: |-
      De houder van een winningsvergunning of de krachtens [artikel 22][ref1] aangewezen persoon dient een winningsplan
      in bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '34.3'
    text: Het winningsplan behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
  - number: '34.4'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing, voor zover het winnen van delfstoffen
      niet geschiedt in het continentaal plat, op:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 34.4.a
    text: de voorbereiding van een besluit omtrent instemming met een winningsplan en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
  - number: 34.4.b
    text: |-
      de voorbereiding van een besluit omtrent wijziging van een instemming met een winningsplan en de voorbereiding van
      een besluit tot instemming met een gewijzigd of geactualiseerd winningsplan, tenzij de wijziging of actualisatie
      van ondergeschikte aard is omdat deze naar het oordeel van Onze Minister niet leidt tot een andere beoordeling van:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
  - number: 34.4.b.1°
    text: de effecten van de wijze van winning alsmede de daarmee verband houdende activiteiten,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
  - number: 34.4.b.2°
    text: |-
      de effecten van de bodembeweging ten gevolge van de winning en de maatregelen ter voorkoming van schade door
      bodembeweging,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
  - number: 34.4.b.3°
    text: de risico’s voor omwonenden, gebouwen of infrastructurele werken of de functionaliteit daarvan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
  - number: '34.5'
    text: |-
      Onze Minister stelt in de gelegenheid advies uit te brengen over een instemming met een winningsplan als bedoeld
      in het vierde lid, onderdeel a, of een besluit omtrent wijziging van een instemming met een winningsplan of een
      besluit tot instemming met een gewijzigd of geactualiseerd winningsplan als bedoeld in het vierde lid, onderdeel b:
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
  - number: 34.5.a
    text: gedeputeerde staten van een provincie binnen het gebied waarop een winningsplan betrekking heeft,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
  - number: 34.5.b
    text: burgemeester en wethouders van een gemeente binnen het gebied waarop het winningsplan betrekking heeft en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
  - number: 34.5.c
    text: het dagelijks bestuur van een waterschap binnen het gebied waarop een winningsplan betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
  - number: '34.6'
    text: Zienswijzen kunnen naar voren worden gebracht door een ieder.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
  - number: '34.7'
    text: |-
      [Afdeling 3.5 van de Algemene wet bestuursrecht][ref1] is van toepassing op een besluit tot instemming met een
      winningsplan of een gewijzigd of geactualiseerd winningsplan voor koolwaterstoffen met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.5
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.5'
  - number: 34.7.a
    text: |-
      het coördinerende bestuursorgaan, bedoeld in [artikel 3:21, eerste lid, van de Algemene wet bestuursrecht][ref1]
      is: de Minister van Economische Zaken en Klimaat;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 34.7.b
    text: |-
      de besluiten, bedoeld in [artikel 3:23, eerste lid, van de Algemene wet bestuursrecht][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 34.7.b.1°
    text: de instemming met het winningsplan, bedoeld in het derde lid,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
  - number: 34.7.b.2°
    text: |-
      een besluit als bedoeld in de [artikelen 2.40, eerste lid][ref1], [5.1, eerste lid, aanhef en onder d][ref2], en
      5.1, tweede lid, aanhef en onder b, c, d en f, onder 2°, van de Omgevingswet,


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 34.7.b.3°
    text: |-
      andere daarvoor in aanmerking komende besluiten die door Onze Minister of Onze Minister die het aangaat worden
      genomen, waaronder omgevingsvergunningen voor Natura 2000-activiteiten en flora- en fauna-activiteiten als
      bedoeld in de Omgevingswet en besluiten tot het stellen van maatwerkvoorschriften over activiteiten als bedoeld in
      [artikel 4.30][ref1], [4.35][ref2] of [4.38 van de Omgevingswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '4'
  - number: '34.8'
    text: |-
      Het eerste, zesde en zevende lid is niet van toepassing op het winnen van delfstoffen in het kader van het
      verkrijgen van gegevens voor zuiver wetenschappelijk onderzoek of voor het door de centrale overheid te voeren
      beleid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel34
  - number: '35.1'
    text: 'Het winningsplan bevat voor elk voorkomen binnen het vergunningsgebied ten minste een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel35
  - number: 35.1.a
    text: de verwachte hoeveelheid aanwezige delfstoffen en de ligging ervan;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel35
  - number: 35.1.b
    text: de duur van de winning;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel35
  - number: 35.1.c
    text: de wijze van winning alsmede de daarmee verband houdende activiteiten;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel35
  - number: 35.1.d
    text: een schatting van de verwachte hoeveelheid per jaar te winnen delfstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel35
  - number: 35.1.e
    text: de kosten op jaarbasis van het winnen van de delfstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel35
  - number: 35.1.f
    text: |-
      de bodembeweging ten gevolge van de winning alsmede de daarmee verband houdende activiteiten en de maatregelen ter
      voorkoming van schade door bodembeweging, voorzover het winnen van delfstoffen niet geschiedt in het continentaal
      plat, tenzij Onze Minister anders heeft bepaald;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel35
  - number: 35.1.g
    text: |-
      de risico’s voor omwonenden, gebouwen of infrastructurele werken of de functionaliteit daarvan met een
      risicobeoordeling, voor zover het winnen van delfstoffen niet geschiedt in het continentaal plat.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel35
  - number: '35.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      winningsplan.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel35
  - number: '36.1'
    text: 'Onze Minister kan zijn instemming met het opgestelde winningsplan slechts geheel of gedeeltelijk weigeren:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel36
  - number: 36.1.a
    text: |-
      indien het in het winningsplan aangeduide gebied door Onze Minister niet geschikt wordt geacht voor de in het
      winningsplan vermelde activiteit om reden van het belang van de veiligheid voor omwonenden of het voorkomen van
      schade aan gebouwen of infrastructurele werken of de functionaliteit daarvan,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel36
  - number: 36.1.b
    text: |-
      in het belang van het planmatig gebruik of beheer van delfstoffen, aardwarmte, andere natuurlijke rijkdommen,
      waaronder grondwater met het oog op de winning van drinkwater, of mogelijkheden tot het opslaan van stoffen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel36
  - number: 36.1.c
    text: indien nadelige gevolgen voor het milieu ontstaan,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel36
  - number: 36.1.d
    text: indien nadelige gevolgen voor de natuur worden veroorzaakt, of
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel36
  - number: 36.1.e
    text: |-
      op grond van het gebrek aan efficiëntie en verantwoordelijkheidszin, daaronder mede verstaan maatschappelijke
      verantwoordelijkheidszin, waarvan de vergunninghouder blijk heeft gegeven bij activiteiten onder deze vergunning of
      een eerdere vergunning op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel36
  - number: '36.2'
    text: |-
      Onze Minister kan zijn instemming verlenen onder beperkingen of daaraan voorschriften verbinden, indien deze
      gerechtvaardigd worden door een grond als genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel36
  - number: '36.3'
    text: |-
      Onze Minister kan zijn instemming intrekken of beperkingen en voorschriften stellen of wijzigen, indien dat
      gerechtvaardigd wordt door veranderde omstandigheden of gewijzigde inzichten inzake een grond als genoemd in het
      eerste lid, onderdelen a tot en met d.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel36
  - number: '36.4'
    text: |-
      Onze Minister weigert de instemming met een winningsplan voor het winnen van delfstoffen, voor zover de
      winning zou geschieden uit een voorkomen dat geheel of gedeeltelijk is gelegen binnen het op grond van
      [artikel 2.44, eerste lid, van de Omgevingswet][ref1] aangewezen Natura 2000-gebied Waddenzee.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
  - number: '36.5'
    text: |-
      Onze Minister weigert de instemming met de wijziging van een winningsplan voor het winnen van
      delfstoffen uit een voorkomen dat geheel of gedeeltelijk is gelegen binnen het op grond van
      [artikel 2.44, eerste lid, van de Omgevingswet][ref1] aangewezen Natura 2000-gebied Waddenzee, voor zover die
      wijziging een verlenging van het tijdvak of een uitbreiding van de omvang van de winning betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2'
  - number: '39.1'
    text: |-
      De [artikelen 34 tot en met 36][ref1] zijn van overeenkomstige toepassing op het opslaan van stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '39.2'
    text: |-
      Het eerste lid blijft buiten toepassing voor zover [hoofdstuk 3, paragraaf 3.2][ref1], toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 39a
    text: |-
      Binnen een termijn van twaalf maanden, nadat een opslagvergunning onherroepelijk is geworden, dient de houder
      van de opslagvergunning of de krachtens [artikel 22][ref1] aangewezen persoon een opslagplan als bedoeld in
      [artikel 39][ref2] in bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel39
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '41.1'
    text: |-
      Met het oog op de kans op beweging van de aardbodem worden metingen verricht voor de aanvang van het winnen van
      delfstoffen, tijdens het winnen en tot dertig jaar na het beëindigen van het winnen. Bij of krachtens algemene
      maatregel van bestuur worden regels gesteld omtrent deze metingen en de rapportage over de uitkomsten daarvan,
      waarbij in elk geval wordt bepaald dat de rapportage een analyse van de metingen bevat.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel41
  - number: '41.2'
    text: Dit artikel is van overeenkomstige toepassing op het opslaan van stoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel41
  - number: '41.3'
    text: |-
      Dit artikel geldt, tenzij in de desbetreffende vergunning anders is bepaald, niet met betrekking tot het winnen van
      delfstoffen of het opslaan van stoffen in het continentaal plat en onder de territoriale zee, voorzover het winnen
      of het opslaan plaatsvindt vanuit of in een voorkomen dat gelegen is aan de zeezijde van de in de bijlage bij deze
      wet vastgelegde lijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel41
  - number: '41.4'
    text: |-
      De verplichtingen van dit artikel rusten op de houder van de desbetreffende, in [artikel 6][ref1] of [25][ref2]
      bedoelde vergunning, dan wel, indien de vergunning haar geldigheid heeft verloren, op de laatste houder van de
      vergunning. Indien de vergunning wordt gehouden door meer dan een natuurlijke persoon of rechtspersoon, rusten
      de verplichtingen van dit artikel op de in [artikel 22][ref3] bedoelde aangewezen persoon, dan wel, indien de
      vergunning haar geldigheid heeft verloren, de laatstelijk op grond van dat artikel aangewezen persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '42.1'
    text: |-
      Indien een vergunning als bedoeld in [artikel 6][ref1] of [25][ref2], een startvergunning aardwarmte of een
      vervolgvergunning aardwarmte geldt voor een gebied waarvoor een ander een in dit lid genoemde vergunning houdt, kan
      Onze Minister de vergunninghouder verplichten in een door hem te bepalen omvang te gedogen dat de houder van die
      andere vergunning zijn daaruit voortvloeiende rechten uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '42.2'
    text: |-
      Indien een vergunning voor het winnen van delfstoffen geldt voor een gebied, waarin zich een voorkomen bevindt dat
      naar redelijkerwijs kan worden aangenomen de grens van het vergunningsgebied overschrijdt of een startvergunning
      aardwarmte of een vervolgvergunning aardwarmte geldt voor een invloedssfeer die naar redelijkerwijs kan worden
      aangenomen de grens van het vergunningsgebied overschrijdt, is de vergunninghouder verplicht om medewerking
      te verlenen aan de totstandkoming van een overeenkomst tussen de vergunninghouder en de voor het aangrenzende
      gebied tot het winnen van de delfstoffen of aardwarmte gerechtigde, tenzij Onze Minister van deze verplichting
      ontheffing verleent. De overeenkomst strekt er toe dat het winnen in onderlinge overeenstemming zal geschieden.
      In de overeenkomst kan worden bepaald dat verplichtingen die krachtens de [hoofdstukken 2][ref1], [3][ref2] en
      [4][ref3] rusten op de in [artikel 22][ref4] bedoelde aangewezen personen, rusten op een van deze aangewezen
      personen. Onze Minister kan eisen stellen aan de tot stand te brengen overeenkomst. De overeenkomst en de
      wijzigingen in de overeenkomst worden aan Onze Minister overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0014168
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '42.3'
    text: |-
      Indien een vergunning voor het winnen van koolwaterstoffen geldt voor een gebied waarvoor een vergunning voor
      permanent opslaan van CO geldt, is de houder van de winningsvergunning verplicht om medewerking te verlenen aan
      de totstandkoming van een overeenkomst tussen de vergunninghouder en de houder van de vergunning voor permanent
      opslaan van CO. De overeenkomst strekt ertoe dat winnen en permanent opslaan van CO in onderlinge overeenstemming
      zal geschieden. In de overeenkomst kan worden bepaald dat verplichtingen die krachtens de [hoofdstukken 2][ref1],
      [3][ref2] en [4][ref3] rusten op de in [artikel 22][ref4] bedoelde aangewezen personen, rusten op een van deze
      aangewezen personen. Onze Minister kan eisen stellen aan de tot stand te brengen overeenkomst. De overeenkomst en
      de wijzigingen in de overeenkomst worden aan Onze Minister overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0014168
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '42.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald onder welke omstandigheden de houder van een
      vervolgvergunning aardwarmte verplicht is medewerking te verlenen aan de totstandkoming van een overeenkomst tussen
      hem en degene die een winningsvergunning heeft voor de meekomende delfstoffen. Een overeenkomst strekt ertoe dat
      degene die een vergunning heeft voor de winning van de meekomende delfstoffen een redelijke vergoeding ontvangt
      voor de met de bij de winning van aardwarmte meekomende delfstoffen. Bij ministeriële regeling kunnen regels worden
      gesteld omtrent de inhoud van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel42
  - number: '44.1'
    text: |-
      De houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25][ref2], van een startvergunning
      aardwarmte of van een vervolgvergunning aardwarmte meldt binnen vier weken nadat een mijnbouwwerk buiten
      werking is, aan Onze Minister om welke reden het mijnbouwwerk buiten werking is en welke maatregelen
      zijn of worden genomen, tenzij het mijnbouwwerk tijdelijk buiten werking is in een geval dat krachtens
      [artikel 49, vierde lid][ref3], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel49
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '44.2'
    text: |-
      De houder van een vergunning verwijdert een mijnbouwwerk dat buiten werking is, tenzij het mijnbouwwerk tijdelijk
      buiten werking is in een geval als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44
  - number: '44.3'
    text: |-
      De houder van een vergunning overlegt binnen een jaar nadat een mijnbouwwerk buiten werking is, aan Onze Minister
      een verwijderingsplan, tenzij het mijnbouwwerk tijdelijk buiten werking is in een geval als bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44
  - number: '44.4'
    text: |-
      De verplichtingen, bedoeld in het tweede en derde lid, zijn mede van toepassing op het verwijderen van
      verontreinigde grond, verontreinigd grondwater, verontreinigingen op of in oppervlaktewater, afval, waaronder
      schroot, en andere materialen, die in het gebied of in de naaste omgeving van het mijnbouwwerk zijn terechtgekomen
      bij het aanleggen of exploiteren van het mijnbouwwerk.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44
  - number: '44.5'
    text: |-
      Het eerste, tweede en derde lid, zijn van overeenkomstige toepassing op een gedeelte van een mijnbouwwerk,
      waaronder een boorgat, dat buiten werking is in de gevallen, die krachtens [artikel 49, vierde lid][ref1], zijn
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 44a.1
    text: |-
      Het verwijderingsplan behoeft de instemming van Onze Minister. De instemming kan onder beperkingen worden verleend
      en aan de instemming kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44a
  - number: 44a.2
    text: |-
      Als een mijnbouwwerk volgens het verwijderingsplan geheel of gedeeltelijk wordt hergebruikt of slechts gedeeltelijk
      wordt verwijderd, neemt Onze Minister het besluit tot instemming niet, dan nadat advies met instemming is ontvangen
      van het bevoegde gezag dat bij of krachtens de [Omgevingswet][ref1] is aangewezen voor een activiteit waarvoor bij
      of krachtens de Omgevingswet een besluit van dat bevoegd gezag vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 44a.3
    text: |-
      Een advies met instemming wordt verleend met overeenkomstige toepassing van de regels die voor de activiteit,
      bedoeld in het tweede lid, bij of krachtens de [Omgevingswet][ref1] zijn bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 44a.4
    text: |-
      Als Onze Minister aan het verwijderingsplan instemming onthoudt, kan Onze Minister een termijn stellen voor het
      verwijderen van het mijnbouwwerk.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44a
  - number: 44a.5
    text: |-
      Onze Minister kan op aanvraag het besluit tot instemming wijzigen. Het tweede en derde lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44a
  - number: 44a.6
    text: 'Onze Minister kan het besluit tot instemming:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44a
  - number: 44a.6.a
    text: 'ambtshalve wijzigen indien:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44a
  - number: 44a.6.a.1°
    text: |-
      de bij de aanvraag verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op de aanvraag een
      andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren
      geweest;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44a
  - number: 44a.6.a.2°
    text: |-
      dit wordt gerechtvaardigd door een wijziging in de technische mogelijkheden van gehele of gedeeltelijke
      verwijdering of hergebruik van het mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44a
  - number: 44a.6.a.3°
    text: de wijziging of actualisatie van ondergeschikte aard is;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44a
  - number: 44a.6.b
    text: 'ambtshalve intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44a
  - number: 44a.6.b.1°
    text: |-
      de bij de aanvraag verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op de aanvraag een
      andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren
      geweest;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44a
  - number: 44a.6.b.2°
    text: |-
      dit wordt gerechtvaardigd door een wijziging in de technische mogelijkheden van gehele of gedeeltelijke
      verwijdering of hergebruik van het mijnbouwwerk.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44a
  - number: 44b.1
    text: |-
      Als een mijnbouwwerk in aanmerking komt voor geheel of gedeeltelijk hergebruik of verwijdering tezamen met andere
      mijnbouwwerken kan Onze Minister tijdelijk ontheffing verlenen van de verplichting tot het overleggen van een
      verwijderingsplan en de verplichting tot verwijderen van het mijnbouwwerk. De ontheffing kan onder beperkingen
      worden verleend en aan de ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44b
  - number: 44b.2
    text: |-
      Als Onze Minister verwijdering van het mijnbouwwerk tezamen met andere mijnbouwwerken of geheel of gedeeltelijk
      hergebruik van het mijnbouwwerk met het oogmerk waarvoor de ontheffing is verleend niet meer doelmatig acht, kan
      Onze Minister de ontheffing wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44b
  - number: 44b.3
    text: |-
      Als Onze Minister de ontheffing intrekt, stelt Onze Minister een termijn voor het overleggen van een
      verwijderingsplan en kan Onze Minister een termijn stellen voor het verwijderen van het mijnbouwwerk.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44b
  - number: 44b.4
    text: |-
      Onder hergebruik als bedoeld in het eerste lid wordt mede verstaan het opnieuw gebruiken van het mijnbouwwerk voor
      het doel waarvoor het mijnbouwwerk is opgericht.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44b
  - number: 44c.1
    text: |-
      De houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25][ref2], van een startvergunning
      aardwarmte of van een vervolgvergunning aardwarmte verwijdert het mijnbouwwerk overeenkomstig het verwijderingsplan
      en de voorschriften die aan de instemming zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 44c.2
    text: |-
      Als het verwijderingsplan is uitgevoerd, overlegt de houder van een vergunning aan Onze Minister een rapport over
      de verwijdering.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44c
  - number: 44c.3
    text: |-
      Onze Minister neemt op aanvraag van de houder van een vergunning een besluit tot instemming met het rapport als de
      verwijdering heeft plaatsgevonden overeenkomstig het verwijderingsplan en de voorschriften die aan de instemming
      zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44c
  - number: 44c.4
    text: |-
      Als een mijnbouwwerk gedeeltelijk is verwijderd en een besluit tot instemming als bedoeld in het derde lid is
      genomen, rust de verplichting tot verwijderen van het resterende gedeelte van het mijnbouwwerk op de nieuwe
      exploitant.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel44c
  - number: '45.1'
    text: |-
      De beheerder van een kabel of pijpleiding meldt binnen vier weken nadat een kabel of pijpleiding buiten
      werking is, aan Onze Minister om welke reden de kabel of pijpleiding buiten werking is en welke maatregelen
      zijn of worden genomen tenzij de kabel of pijpleiding tijdelijk buiten werking is in een geval dat krachtens
      [artikel 49, vierde lid][ref1], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '45.2'
    text: |-
      Onze Minister kan binnen zes maanden na de melding met overeenkomstige toepassing van [artikel 44][ref1] bepalen
      dat de beheerder van een kabel of pijpleiding die buiten werking is, verplicht is om de kabel of pijpleiding te
      verwijderen overeenkomstig een door de beheerder te overleggen verwijderingsplan, tenzij de kabel of pijpleiding:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 45.2.a
    text: in gemeentelijk ingedeeld gebied is gelegen en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45
  - number: 45.2.b
    text: met de eigenaar van de grond is overeengekomen dat de kabel of de pijpleiding niet wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45
  - number: '45.3'
    text: |-
      Als Onze Minister bepaalt dat de beheerder verplicht is een kabel of pijpleiding te verwijderen, kan de beheerder
      een aanvraag om ontheffing indienen. [Artikel 44b][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44b
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 44b
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '45.4'
    text: |-
      De [artikelen 44a][ref1] en [44c][ref2] zijn van overeenkomstige toepassing op een verwijderingsplan,
      respectievelijk de verwijdering, van kabels en pijpleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44a
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel44c
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 44a
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 44c
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '45.5'
    text: |-
      Als Onze Minister de beheerder niet heeft verplicht een kabel of pijpleiding te verwijderen en de beheerder niet
      verplicht is om de kabel of pijpleiding krachtens een overeenkomst met de eigenaar van de grond te verwijderen, is
      de beheerder verplicht om de kabel, respectievelijk pijpleiding, schoon en veilig achter te laten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45
  - number: '45.6'
    text: |-
      Als niemand als beheerder van een kabel of pijpleiding kan worden aangemerkt, rusten de verplichtingen op de
      laatste beheerder van de kabel of pijpleiding.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45
  - number: 45a
    text: Deze paragraaf is van toepassing op de opsporing en winning van koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45a
  - number: 45b.1
    text: |-
      Een exploitant van een productie-installatie stelt een rapport inzake grote gevaren op voor een productie-
      installatie en dient dit in bij de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45b
  - number: 45b.2
    text: |-
      Het rapport inzake grote gevaren behoeft de instemming van de inspecteur-generaal der mijnen voor zover het
      rapport ziet op een productie-installatie die is gelegen op het continentaal plat of in de territoriale zee en deze
      productie-installatie gelegen is aan de zeezijde van de in de bijlage bij deze wet vastgelegde lijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45b
  - number: 45b.3
    text: |-
      Een rapport inzake grote gevaren voor een productie-installatie als bedoeld in het eerste lid kan, indien de
      inspecteur-generaal der mijnen daarmee instemt, voor een groep van installaties worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45b
  - number: 45b.4
    text: |-
      Een exploitant van een productie-installatie als bedoeld in het tweede lid start niet met activiteiten op
      productie-installaties of zet deze activiteiten niet voort, met uitzondering van verkenningsonderzoek, voordat
      de inspecteur-generaal der mijnen heeft ingestemd met het rapport inzake grote gevaren voor de desbetreffende
      productie-installaties.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45b
  - number: 45b.5
    text: |-
      Bij ministeriële regeling worden regels gesteld over de indiening van en de instemming met het rapport inzake grote
      gevaren.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45b
  - number: 45c.1
    text: 'Bij het rapport inzake grote gevaren worden in elk geval de volgende documenten gevoegd:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45c
  - number: 45c.1.a
    text: |-
      het bedrijfsbeleid inzake het voorkomen van zware ongevallen, bedoeld in [artikel 45j][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45j
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 45j
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: 45c.1.b
    text: |-
      het veiligheids- en milieubeheerssysteem dat van toepassing is op de productie-installatie, bedoeld in
      [artikel 45k][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45k
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 45k
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: 45c.1.c
    text: |-
      een beschrijving van de regeling voor onafhankelijke verificatie, bedoeld in [artikel 45l][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45l
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 45l
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: 45c.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de inhoud van het rapport inzake
      grote gevaren, de wijze waarop dit rapport wordt opgesteld en de documenten die daarbij worden gevoegd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45c
  - number: 45d.1
    text: |-
      Een exploitant van een productie-installatie herziet om de vijf jaar het rapport inzake grote gevaren en brengt de
      resultaten van de herziening ter kennis van de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45d
  - number: 45d.2
    text: De inspecteur-generaal der mijnen kan bepalen dat de herziening eerder geschiedt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45d
  - number: 45e.1
    text: |-
      In het geval van een essentiële wijziging van een productie-installatie of van ontmanteling van een productie-
      installatie, dient de exploitant van deze productie-installatie een gewijzigd rapport inzake grote gevaren in bij
      de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45e
  - number: 45e.2
    text: |-
      De geplande wijzigingen of de ontmanteling worden niet uitgevoerd voordat de inspecteur-generaal der mijnen heeft
      ingestemd met het gewijzigd rapport inzake grote gevaren voor zover het een productie-installatie betreft die is
      gelegen op het continentaal plat of in de territoriale zee, voor zover deze productie-installatie is gelegen aan de
      zeezijde van de in de bijlage bij deze wet vastgestelde lijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45e
  - number: 45e.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de indiening van en de instemming met het gewijzigd rapport
      inzake grote gevaren.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45e
  - number: 45f.1
    text: |-
      Een eigenaar van een niet-productie-installatie stelt een rapport inzake grote gevaren op voor de niet-productie-
      installatie en dient het bij de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45f
  - number: 45f.2
    text: Het rapport inzake grote gevaren behoeft de instemming van de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45f
  - number: 45f.3
    text: |-
      Een eigenaar van een niet-productie-installatie start niet met activiteiten op een niet-productie-installatie,
      waaronder gecombineerde activiteiten of boorgatactiviteiten, met uitzondering van verkenningsonderzoek, of zet
      deze activiteiten niet voort voordat de inspecteur-generaal der mijnen heeft ingestemd met het rapport inzake grote
      gevaren voor de betreffende niet-productie-installatie.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45f
  - number: 45f.4
    text: |-
      Bij ministeriële regeling worden regels gesteld over de indiening van en de instemming met het rapport inzake grote
      gevaren.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45f
  - number: 45g.1
    text: 'Bij het rapport inzake grote gevaren worden in elke geval de volgende documenten gevoegd:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45g
  - number: 45g.1.a
    text: |-
      het bedrijfsbeleid inzake het voorkomen van zware ongevallen, bedoeld in [artikel 45j][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45j
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45g
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 45j
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: 45g.1.b
    text: |-
      het veiligheids- en milieubeheerssysteem dat van toepassing is op de niet-productie-installatie, bedoeld in
      [artikel 45k][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45k
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45g
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 45k
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: 45g.1.c
    text: |-
      een beschrijving van de regeling voor onafhankelijke verificatie, bedoeld in [artikel 45l][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45l
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45g
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 45l
        hoofdstuk: '4'
        paragraaf: 4.1a
  - number: 45g.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de inhoud van het rapport inzake
      grote gevaren, de wijze waarop dit rapport moet worden opgesteld en de documenten die daarbij worden gevoegd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45g
  - number: 45h.1
    text: |-
      Een eigenaar van een niet-productie-installatie herziet om de vijf jaar het rapport inzake grote gevaren en brengt
      de resultaten van de herziening ter kennis van de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45h
  - number: 45h.2
    text: De inspecteur-generaal der mijnen kan bepalen dat de herziening eerder geschiedt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45h
  - number: 45i.1
    text: |-
      In het geval van een essentiële wijziging van een niet-productie-installatie of van ontmanteling van een vaste
      niet-productie-installatie, dient de eigenaar van deze installatie een gewijzigd rapport inzake grote gevaren in
      bij de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45i
  - number: 45i.2
    text: |-
      De geplande wijzigingen en de ontmanteling worden niet uitgevoerd voordat de inspecteur-generaal der mijnen heeft
      ingestemd met het gewijzigd rapport inzake grote gevaren.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45i
  - number: 45i.3
    text: Bij ministeriële regeling worden regels gesteld over het gewijzigd rapport inzake grote gevaren.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45i
  - number: 45j.1
    text: |-
      De exploitant van een productie-installatie stelt een bedrijfsbeleid inzake het voorkomen van zware ongevallen op
      en past dit toe bij alle door de exploitant te verrichten opsporings- en winningsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45j
  - number: 45j.2
    text: |-
      De eigenaar van een niet-productie-installatie stelt een bedrijfsbeleid inzake het voorkomen van zware ongevallen
      op en past dit toe bij alle door de eigenaar te verrichten opsporings- en winningsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45j
  - number: 45j.3
    text: |-
      De exploitant, bedoeld in het eerste lid, en de eigenaar, bedoeld in het tweede lid, passen het bedrijfsbeleid
      inzake het voorkomen van zware ongevallen tevens toe op zijn mijnbouwinstallaties die buiten de Europese Unie in
      werking zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45j
  - number: 45j.4
    text: |-
      Bij ministeriële regeling worden regels gesteld over de inhoud van het bedrijfsbeleid inzake het voorkomen van
      zware ongevallen en de wijze waarop dit moet worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45j
  - number: 45k.1
    text: De exploitant van een productie-installatie beschrijft in een document het veiligheids- en milieubeheerssysteem.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45k
  - number: 45k.2
    text: De eigenaar van een niet-productie-installatie beschrijft in een document het veiligheids- en milieubeheerssysteem.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45k
  - number: 45k.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de inhoud van het veiligheids- en milieubeheerssysteem en de
      wijze waarop het ontwikkeld wordt.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45k
  - number: 45l.1
    text: De exploitant stelt een regeling voor onafhankelijke verificatie op voor zijn productie-installatie.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45l
  - number: 45l.2
    text: De eigenaar stelt een regeling voor onafhankelijke verificatie op voor zijn niet-productie-installatie.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45l
  - number: 45l.3
    text: |-
      De exploitant van een productie-installatie stelt een regeling voor onafhankelijke verificatie op voor
      kennisgevingen van boorgatactiviteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45l
  - number: 45l.4
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45l
  - number: 45l.4.a
    text: de eisen waaraan de regeling voor onafhankelijke verificatie moet voldoen,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45l
  - number: 45l.4.b
    text: de selectiecriteria voor een onafhankelijke verificateur,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45l
  - number: 45l.4.c
    text: het moment waarop de regeling voor onafhankelijke verificatie getroffen wordt,
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45l
  - number: 45l.4.d
    text: de wijze waarop de exploitant of de eigenaar uitvoering geeft aan het advies van de onafhankelijke verificateur en
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45l
  - number: 45l.4.e
    text: de wijze van bekendmaking van het advies van de onafhankelijke verificateur aan de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45l
  - number: 45l.5
    text: 'Bij ministeriële regeling wordt de termijn vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45l
  - number: 45l.5.a
    text: |-
      gedurende welke de exploitant van een productie-installatie en de eigenaar van een niet-productie-installatie het
      advies van de onafhankelijke verificateur en documentatie over de maatregelen die op grond van een dergelijk advies
      door hen zijn genomen, bewaren;
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45l
  - number: 45l.5.b
    text: |-
      waarbinnen de exploitant en de eigenaar een regeling voor onafhankelijke verificatie voor de desbetreffende
      installatie, treffen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45l
  - number: 45m.1
    text: |-
      De exploitant dient bij een voorgenomen productie-installatie een kennisgeving van het ontwerp in bij de
      inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45m
  - number: 45m.2
    text: |-
      Wanneer er vóór de indiening van het rapport inzake grote gevaren een essentiële wijziging wordt aangebracht in
      het ontwerp van de voorgenomen productie-installatie, meldt de exploitant dit zo snel mogelijk bij de inspecteur-
      generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45m
  - number: 45n.1
    text: |-
      De exploitant dient in het geval van een boorgatactiviteit, een kennisgeving van de boorgatactiviteit in bij de
      inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45n
  - number: 45n.2
    text: |-
      De kennisgeving, bedoeld in het eerste lid, bevat tevens het bedrijfsbeleid inzake het voorkomen van zware
      ongevallen voor zover dit beleid niet reeds eerder is ingediend bij de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45n
  - number: 45n.3
    text: |-
      Bij een essentiële wijziging in de gegevens van een ingediende kennisgeving van boorgatactiviteiten betrekt de
      exploitant een onafhankelijke verificateur bij het opstellen daarvan en stelt de inspecteur-generaal der mijnen in
      kennis van deze wijziging.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45n
  - number: 45o.1
    text: |-
      De exploitant van een productie-installatie dient in het geval een bestaande mijnbouwinstallatie verplaatst moet
      worden naar een nieuwe productielocatie, een kennisgeving in bij de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45o
  - number: 45o.2
    text: |-
      Wanneer er vóór de indiening van het rapport inzake grote gevaren een essentiële wijziging wordt aangebracht in de
      kennisgeving van de verplaatsing, meldt de exploitant dit zo snel mogelijk bij de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45o
  - number: 45p.1
    text: |-
      De exploitant van een productie-installatie dient in het geval van een gecombineerde activiteit, een kennisgeving
      van gecombineerde activiteiten in bij de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45p
  - number: 45p.2
    text: |-
      De kennisgeving van gecombineerde activiteiten wordt gezamenlijk opgesteld door de exploitant van de productie-
      installatie en de betrokken eigenaren van de niet-productie-installaties.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45p
  - number: 45p.3
    text: |-
      De exploitant van een productie-installatie en de eigenaar van een niet-productie-installatie starten niet met
      boorgatactiviteiten of gecombineerde activiteiten, voordat een kennisgeving aan de inspecteur-generaal der mijnen
      is voorgelegd.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45p
  - number: 45p.4
    text: |-
      De exploitant van een productie-installatie en de eigenaar van een niet-productie-installatie beginnen niet met of
      staken de boorgatactiviteiten of de gecombineerde activiteiten, indien de inspecteur-generaal der mijnen bezwaren
      heeft geuit over de inhoud van de kennisgeving, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45p
  - number: 45p.5
    text: |-
      De exploitant van een productie-installatie stelt de inspecteur-generaal der mijnen in kennis van elke essentiële
      wijziging in de ingediende kennisgeving van gecombineerde activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45p
  - number: 45q.1
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45q
  - number: 45q.1.a
    text: |-
      de inhoud van de kennisgevingen, bedoeld in de [artikelen 45m][ref1], [45n][ref2], [45o][ref3] en [45p][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45m
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel45n
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel45o
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel45p
    url: https://wetten.overheid.nl/BWBR0014168/2024-05-01#Artikel45q
