  - number: '189'
    text: |-
      Voor de toepassing van het bij of krachtens de[ In- en uitvoerwet ][ref1]bepaalde worden delfstoffen die zich
      bevinden in de mijnbouwinstallatie, waarmee zij in of op het continentaal plat zijn gewonnen, geacht in het vrije
      verkeer in Nederland te zijn en gedurende het rechtstreekse vervoer naar Nederland in Nederland te blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002376
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0002376
  - number: '190'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van een voor Nederland verbindend verdrag of
      een voor Nederland verbindend besluit van een volkenrechtelijke organisatie regels worden gesteld omtrent mijnbouw
      en met mijnbouw verwante activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel190
  - number: '191'
    text: |-
      Onze Minister van Economische Zaken zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-
      Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel191
  - number: '192'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel192
  - number: '193'
    text: 'Deze wet wordt aangehaald als: Mijnbouwwet.'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel193
