  - number: '166'
    text: |-
      De bijdrage, bedoeld in [artikel 135, vierde lid, onderdeel a][ref1], is voor het eerst verschuldigd in het jaar
      dat volgt op het jaar van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel135
