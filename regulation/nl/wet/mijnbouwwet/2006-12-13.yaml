  - number: '167.1'
    text: |-
      Ten aanzien van de mogelijkheid om bezwaar te maken of beroep in te stellen tegen een besluit dat is genomen op
      grond van een van de in [artikel 168][ref1] genoemde wetten, blijft het recht van toepassing zoals dat gold voor de
      inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel168
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel167
