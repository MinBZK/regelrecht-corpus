---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mijnbouwwet
regulatory_layer: WET
publication_date: '2025-11-13'
valid_from: '2006-12-13'
bwb_id: BWBR0014168
url: https://wetten.overheid.nl/BWBR0014168/2006-12-13
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het bestaande samenstel van wettelijke regelingen
    inzake het onderzoek naar en het winnen van delfstoffen te vervangen door een nieuwe regeling, die aan de thans te
    stellen eisen voldoet, en enige regels te stellen met betrekking tot bepaalde met mijnbouw verwante activiteiten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.a
    text: |-
      delfstoffen: in de ondergrond aanwezige mineralen of substanties van organische oorsprong, in een aldaar langs
      natuurlijke weg ontstane concentratie of afzetting, in vaste, vloeibare of gasvormige toestand, met uitzondering
      van brongas, kalksteen, grind, zand, klei, schelpen en mengsels daarvan;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.b
    text: 'aardwarmte: in de ondergrond aanwezige warmte die aldaar langs natuurlijke weg is ontstaan;'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.c
    text: |-
      continentaal plat: het onder de Noordzee gelegen deel van de zeebodem en de ondergrond daarvan, waarop
      het Koninkrijk mede overeenkomstig het op 10 december 1982 te Montego-Bay gesloten Verdrag inzake het
      recht van de zee (Trb. 1983, 83) soevereine rechten heeft en hetwelk is gelegen aan de zeezijde van de in
      [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref1] bedoelde lijn;


      [ref1]: https://wetten.overheid.nl/BWBR0003748#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003748
        artikel: '1'
  - number: 1.d
    text: |-
      verkenningsonderzoek: een onderzoek, zonder gebruikmaking van een boorgat, naar de aanwezigheid van delfstoffen of
      naar de aanwezigheid van aardwarmte, dan wel naar nadere gegevens omtrent delfstoffen of aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.e
    text: |-
      opsporen van delfstoffen: onderzoek doen naar de aanwezigheid van delfstoffen, dan wel naar nadere gegevens
      daaromtrent, met gebruikmaking van een boorgat;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.f
    text: |-
      winnen van delfstoffen: het met gebruikmaking van een boorgat, tunnel, schacht of ander ondergronds werk onttrekken
      van delfstoffen aan de ondergrond anders dan in de vorm van monsters of formatiebeproevingen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.g
    text: |-
      opsporen van aardwarmte: onderzoek doen naar de aanwezigheid van aardwarmte, dan wel naar nadere gegevens
      daaromtrent, met gebruikmaking van een boorgat;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.h
    text: |-
      winnen van aardwarmte: het onttrekken van aardwarmte aan de ondergrond anders dan het onttrekken daarvan in
      samenhang met het opsporen of het winnen van delfstoffen dan wel met het opslaan van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.i
    text: |-
      opslaan van stoffen: het brengen of houden van stoffen op een diepte van meer dan 100 meter beneden de oppervlakte
      van de aardbodem, dan wel het terughalen van die stoffen, anders dan het in de ondergrond brengen of houden of
      daaruit terughalen van stoffen gericht op het onttrekken van aardwarmte aan de ondergrond;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.j
    text: 'opsporingsvergunning: een vergunning voor het opsporen van delfstoffen;'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.k
    text: 'winningsvergunning: een vergunning voor het winnen van delfstoffen, alsmede voor het opsporen van delfstoffen;'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.l
    text: 'opslagvergunning: een vergunning voor het opslaan van stoffen;'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.m
    text: 'mijnbouwmilieuvergunning: een vergunning als bedoeld in [artikel 40, tweede lid](onbekend);'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.n
    text: 'mijnbouwwerk: een werk dat behoort tot een bij algemene maatregel van bestuur aangewezen categorie van werken:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.n.1°
    text: ten behoeve van het opsporen of het winnen van delfstoffen of aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.n.2°
    text: ten behoeve van het opslaan van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.n.3°
    text: die samenhangen met de in de onderdelen 1° en 2° bedoelde werken;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.o
    text: 'mijnbouwinstallatie: een mijnbouwwerk dat verankerd is in of aanwezig is boven de bodem van een oppervlaktewater;'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: 1.p
    text: 'Onze Minister: Onze Minister van Economische Zaken.'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel1
  - number: '2.1'
    text: Deze wet is mede van toepassing op het continentaal plat.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel2
  - number: '2.2'
    text: |-
      Deze wet, met uitzondering van [artikel 51][ref1], is met betrekking tot delfstoffen slechts van toepassing,
      voorzover de delfstoffen op een diepte van meer dan 100 meter beneden de oppervlakte van de aardbodem aanwezig
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel51
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '2.3'
    text: |-
      Deze wet is met betrekking tot aardwarmte slechts van toepassing, voorzover de aardwarmte op een diepte van meer
      dan 500 meter beneden de oppervlakte van de aardbodem aanwezig is.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel2
  - number: '3.1'
    text: Delfstoffen zijn eigendom van de staat.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel3
  - number: '3.2'
    text: |-
      De eigendom van delfstoffen die met gebruikmaking van een winningsvergunning worden gewonnen, gaat door het
      winnen daarvan over op de vergunninghouder. De eerste volzin is van overeenkomstige toepassing ten aanzien van
      delfstoffen die met gebruikmaking van een opsporingsvergunning in de vorm van monsters of formatiebeproevingen aan
      de ondergrond worden onttrokken.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel3
  - number: '3.3'
    text: |-
      De eigendom van stoffen die met gebruikmaking van een opslagvergunning worden teruggehaald, komt door het
      terughalen daarvan te berusten bij degene die eigenaar was van de stoffen direct voorafgaande aan het in de
      ondergrond brengen daarvan, dan wel bij degene die ten tijde van het terughalen de rechtsopvolger is van die
      eigenaar.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel3
  - number: '3.4'
    text: |-
      De staat wordt voor alle met de eigendom van delfstoffen verband houdende handelingen vertegenwoordigd door Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel3
  - number: '4'
    text: |-
      De rechthebbende ten aanzien van de oppervlakte van de aardbodem is verplicht te gedogen dat de houder van een
      vergunning voor het opsporen of het winnen van delfstoffen of aardwarmte, dan wel het opslaan van stoffen, in de
      ondergrond delfstoffen of aardwarmte opspoort of wint of stoffen opslaat overeenkomstig de op deze activiteiten
      betrekking hebbende regels, voorzover deze activiteiten plaatsvinden op een diepte van meer dan 100 meter beneden
      de oppervlakte en onverminderd het recht dat de rechthebbende ten aanzien van de oppervlakte heeft op vergoeding
      van de door deze activiteiten veroorzaakte schade.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel4
  - number: '5'
    text: |-
      Voor de toepassing van de [Belemmeringenwet Verordeningen][ref1] en de [Belemmeringenwet Privaatrecht][ref2] worden
      werken die worden of zijn uitgevoerd ten behoeve van het opsporen of winnen van delfstoffen of aardwarmte of ten
      behoeve van het opslaan van stoffen, aangemerkt als openbare werken van algemeen nut.


      [ref1]: https://wetten.overheid.nl/BWBR0001865
      [ref2]: https://wetten.overheid.nl/BWBR0001936
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001865
      - id: ref2
        bwb_id: BWBR0001936
  - number: '6.1'
    text: 'Het is verboden zonder vergunning van Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel6
  - number: 6.1.a
    text: delfstoffen op te sporen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel6
  - number: 6.1.b
    text: delfstoffen te winnen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel6
  - number: 6.1.c
    text: aardwarmte op te sporen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel6
  - number: 6.1.d
    text: aardwarmte te winnen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel6
  - number: '6.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het verbod niet van toepassing is op in die maatregel
      omschreven categorieën van opsporen of winnen van aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel6
  - number: '6.3'
    text: |-
      Het in dit hoofdstuk met betrekking tot opsporen of winnen van delfstoffen bepaalde is van overeenkomstige
      toepassing met betrekking tot opsporen of winnen van aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel6
  - number: '7.1'
    text: |-
      Een vergunning wordt niet verleend, voorzover deze bij het in werking treden zou gaan gelden voor een gebied
      waarvoor op dat tijdstip reeds een door een ander gehouden vergunning voor dezelfde delfstof geldt.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel7
  - number: '7.2'
    text: |-
      Een vergunning wordt evenmin verleend, voorzover deze bij het in werking treden zou gaan gelden voor een voorkomen
      waarvoor op dat tijdstip reeds een door een ander gehouden opslagvergunning geldt.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel7
  - number: '7.3'
    text: |-
      Het eerste lid blijft buiten toepassing ten aanzien van de in [artikel 11, eerste lid][ref1], bedoelde andere
      delfstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel11
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '8'
    text: |-
      Een winningsvergunning wordt slechts verleend, indien aannemelijk is dat de delfstoffen binnen het gebied waarvoor
      de vergunning zal gelden economisch winbaar zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel8
  - number: '9.1'
    text: |-
      Onverminderd de [artikelen 7][ref1] en [8][ref2] kan een vergunning slechts worden geweigerd:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel8
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9.1.a
    text: op grond van de technische of financiële mogelijkheden van de aanvrager,
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel9
  - number: 9.1.b
    text: |-
      op grond van de manier waarop de aanvrager voornemens is de activiteiten, waarvoor de vergunning wordt aangevraagd,
      te verrichten,
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel9
  - number: 9.1.c
    text: |-
      op grond van het gebrek aan efficiëntie en verantwoordelijkheidszin, daaronder mede verstaan maatschappelijke
      verantwoordelijkheidszin, waarvan de aanvrager blijk heeft gegeven bij activiteiten als bedoeld in de
      [artikelen 6, eerste lid][ref1], en [25, eerste lid][ref2], onder een eerdere vergunning, of


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
  - number: 9.1.d
    text: |-
      indien een keuze moet worden gemaakt uit twee of meer aanvragen om een vergunning die bij een beoordeling op grond
      van de onderdelen a, b en c gelijkwaardig zijn gebleken, in het belang van het doelmatig en voortvarend opsporen
      en winnen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel9
  - number: '9.2'
    text: |-
      Een vergunning kan op grond van de financiële mogelijkheden van de aanvrager worden geweigerd als onvoldoende
      verzekerd is dat de aanvrager zal voldoen aan hem op te leggen verplichtingen als bedoeld in de artikelen
      [46][ref1], [47][ref2] en [102][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel102
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '102'
        hoofdstuk: '5'
        afdeling: '5.4'
  - number: '9.3'
    text: |-
      Met het oog op de toepassing van het eerste en tweede lid kunnen bij ministeriële regeling nadere regels worden
      gesteld die bij de beslissing op een aanvraag om een vergunning in acht worden genomen. Zodanige regels worden in
      elk geval gesteld met betrekking tot opsporings- en winningsvergunningen voor koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel9
  - number: '9.4'
    text: |-
      Van de plaatsing in de Staatscourant van een regeling als bedoeld in de tweede volzin van het derde lid wordt
      mededeling gedaan in het Publicatieblad van de Europese Gemeenschappen. Van een besluit tot wijziging van zodanige
      regeling wordt eveneens mededeling gedaan in het Publicatieblad van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel9
  - number: '10.1'
    text: |-
      Onverminderd de [artikelen 7](onbekend) en [8 ](onbekend)wordt de houder van een opsporingsvergunning die met
      gebruikmaking van die vergunning de aanwezigheid van de betrokken delfstoffen heeft aangetoond, op zijn aanvraag,
      ingediend gedurende de geldingsduur van die vergunning, een winningsvergunning voor die delfstoffen verleend voor
      het gebied waarvoor de opsporingsvergunning geldt. Indien de opsporingsvergunning geldt voor een gebied dat niet
      overeenkomstig [artikel 11, vijfde lid](onbekend), is begrensd en de aanwezigheid van de betrokken delfstoffen
      slechts in een deel van het gebied is aangetoond, wordt de winningsvergunning verleend voor het deel van het
      gebied, waarvoor verlening uit geologisch oogpunt gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel10
  - number: '10.2'
    text: |-
      Het eerste lid geldt niet, indien weigering van de winningsvergunning gerechtvaardigd wordt door een van de in
      [artikel 9, eerste lid, onderdelen a tot en met c](onbekend), genoemde gronden. [Artikel 9, tweede, derde en vierde
      lid](onbekend), is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel10
  - number: '10.3'
    text: |-
      Indien een aanvraag als bedoeld in het eerste lid is ingediend, blijft de opsporingsvergunning, voorzover deze
      betrekking heeft op het aangevraagde gebied, tenminste gelden tot het tijdstip waarop de beschikking waarbij
      op de aanvraag wordt beslist onherroepelijk wordt. Indien een winningsvergunning wordt verleend, vervalt op het
      tijdstip waarop de beschikking onherroepelijk wordt, voor het gebied waarvoor de winningsvergunning geldt, de
      opsporingsvergunning voor de betrokken delfstoffen. Voorzover hierdoor voorschriften als bedoeld in [artikel 12]
      (onbekend) vervallen die nog niet zijn uitgewerkt, gaan zij gelden als voorschriften die zijn verbonden aan de
      winningsvergunning.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel10
  - number: '11.1'
    text: |-
      In een vergunning wordt bepaald voor welke in [artikel 6][ref1] bedoelde activiteiten en voor welke delfstoffen zij
      geldt. Indien in een winningsvergunning is opgenomen dat zij geldt voor bepaalde delfstoffen, geldt zij tevens voor
      andere delfstoffen die onvermijdelijk meekomen met de winning van die bepaalde delfstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '11.2'
    text: |-
      In een vergunning wordt bepaald voor welk tijdvak zij geldt. Dit geschiedt zodanig dat het tijdvak niet langer is
      dan noodzakelijk om de activiteiten, waarvoor de vergunning wordt verleend, te verrichten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel11
  - number: '11.3'
    text: |-
      In een vergunning wordt bepaald voor welk gebied zij geldt. Ten behoeve van de afbakening van het gebied wordt de
      begrenzing aan de oppervlakte aangegeven. Tenzij de vergunning anders bepaalt, wordt het gebied gevormd door het
      aangegeven oppervlak en de ondergrond daarvan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel11
  - number: '11.4'
    text: |-
      De afbakening van het gebied geschiedt zodanig dat de uitoefening van de activiteiten uit technisch en economisch
      oogpunt op zo goed mogelijke wijze kan plaatsvinden. Bij ministeriële regeling worden nadere regels gesteld
      met het oog op de toepassing van de vorige volzin met betrekking tot een opsporings- of winningsvergunning voor
      koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel11
  - number: '11.5'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat een opsporingsvergunning voor daarbij aangegeven delfstoffen
      slechts kan worden verleend voor een gebied, waarvan de begrenzing een gevolg is van een voorafgaande geometrische
      verdeling van het gebied waarvoor deze wet geldt of van een deel daarvan. In dat geval is het vierde lid niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel11
  - number: '12'
    text: |-
      In een opsporingsvergunning wordt bepaald binnen welke tijdvakken nadat de vergunning onherroepelijk is geworden,
      de in de vergunning aangegeven opsporingsactiviteiten dienen te worden verricht. In de vergunning kan tevens worden
      bepaald binnen welke tijdvakken nadat de vergunning onherroepelijk is geworden, de in de vergunning aangegeven
      verkenningsonderzoeken dienen te worden verricht.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel12
  - number: '13.1'
    text: |-
      Een vergunning voor koolwaterstoffen wordt verleend onder geen andere beperkingen dan die bedoeld in [artikel
      11](onbekend). Aan deze vergunning worden geen andere voorschriften verbonden dan die bedoeld in [artikel 12]
      (onbekend).
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel13
  - number: '13.2'
    text: |-
      Een vergunning die geen vergunning voor koolwaterstoffen is, kan tevens onder andere beperkingen dan die bedoeld
      in [artikel 11](onbekend) worden verleend. Aan deze vergunning kunnen tevens andere voorschriften worden verbonden
      dan die bedoeld in [artikel 12](onbekend). Deze andere beperkingen en voorschriften, anders dan voorschriften
      op grond van [artikel 98](onbekend), kunnen slechts worden gerechtvaardigd door het belang van de veiligheid, de
      landsverdediging of een planmatig beheer van voorkomens van delfstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel13
  - number: '14'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop de aanvraag om een vergunning dient te
      geschieden en omtrent de gegevens en de bescheiden, welke daarbij moeten worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel14
  - number: '15.1'
    text: |-
      Zodra een aanvraag om een vergunning is ingediend, worden anderen in de gelegenheid gesteld om aanvragen om een
      soortgelijke vergunning in te dienen voor dezelfde delfstof voor hetzelfde gebied.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel15
  - number: '15.2'
    text: |-
      Onze Minister plaatst hiertoe een uitnodiging in de Staatscourant. De uitnodiging maakt melding van het bepaalde in
      [artikel 17][ref1]. Indien het een aanvraag om een opsporings- of winningsvergunning voor koolwaterstoffen betreft,
      wordt de uitnodiging tevens geplaatst in het Publicatieblad van de Europese Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel17
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '15.3'
    text: |-
      Anderen kunnen aanvragen indienen tot dertien weken na de dag van plaatsing van de uitnodiging in de Staatscourant
      of, ingeval het koolwaterstoffen betreft, het Publicatieblad van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel15
  - number: '15.4'
    text: 'De procedure, bedoeld in het eerste tot en met het derde lid, wordt niet toegepast met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel15
  - number: 15.4.a
    text: |-
      een aanvraag om een winningsvergunning als bedoeld in [artikel 10, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel10
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 15.4.b
    text: |-
      een aanvraag om een winningsvergunning die wordt ingediend door de houder van een opsporings- of winningsvergunning
      naar aanleiding van de aantoning van een voorkomen, waarvan aannemelijk is dat het zich gedeeltelijk in zijn gebied
      en gedeeltelijk in het aangevraagde aangrenzende gebied bevindt;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel15
  - number: 15.4.c
    text: |-
      een aanvraag voor een gebied, waarvoor op grond van [artikel 7][ref1] geen vergunning wordt verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel7
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 15.4.d
    text: een aanvraag die wordt ingediend overeenkomstig het derde lid.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel15
  - number: '15.5'
    text: |-
      In het geval, bedoeld in het vierde lid, onderdeel b, stelt Onze Minister anderen die ten tijde van de in dat
      onderdeel bedoelde indiening houder zijn van een opsporings- of winningsvergunning voor dezelfde delfstof, voor
      gebieden die grenzen aan het in dat onderdeel bedoelde aangevraagde aangrenzende gebied, in de gelegenheid om
      tot dertien weken na die indiening een aanvraag om een winningsvergunning voor die delfstof voor dat gebied in
      te dienen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel15
  - number: '16'
    text: |-
      Gedeputeerde staten van de provincie waarop de aanvraag voor een vergunning betrekking heeft worden in de
      gelegenheid gesteld binnen een door Onze Minister te stellen redelijke termijn advies uit te brengen over de
      ingediende aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister beslist op een aanvraag om een vergunning binnen zes maanden na de ontvangst daarvan. Indien [artikel
      15, eerste of vijfde lid](onbekend), toepassing heeft gevonden, beslist Onze Minister op alle aanvragen binnen zes
      maanden na afloop van de termijn, bedoeld in [artikel 15, derde, onderscheidenlijk vijfde lid](onbekend).
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister kan de termijn, waarbinnen hij op een aanvraag dient te beslissen, eenmaal met ten hoogste zes
      maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel17
  - number: '17.3'
    text: Van een beschikking tot verlening van een vergunning wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel17
  - number: '18.1'
    text: Onze Minister kan een vergunning slechts op aanvraag van de houder wijzigen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel18
  - number: '18.2'
    text: 'Een vergunning kan niet zodanig worden gewijzigd dat zij komt te gelden voor:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel18
  - number: 18.2.a
    text: andere activiteiten of andere delfstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel18
  - number: 18.2.b
    text: een groter gebied.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel18
  - number: '18.3'
    text: |-
      Een aanvraag om verlenging van het tijdvak waarvoor een vergunning geldt wordt slechts ingewilligd, indien het in
      de vergunning vastgestelde tijdvak onvoldoende is om de activiteiten, waarvoor de vergunning geldt, te voltooien
      en deze activiteiten zijn verricht in overeenstemming met de vergunning. In een beschikking, waarbij het tijdvak
      waarvoor een vergunning geldt wordt verlengd, kan het gebied waarvoor die vergunning geldt worden beperkt tot een
      deel van het gebied. [Artikel 11, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel11
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '18.4'
    text: |-
      Een aanvraag om verkleining van het gebied waarvoor een vergunning geldt, wordt slechts ingewilligd met
      inachtneming van [artikel 11, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel11
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '19'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel19
  - number: 19.a
    text: het splitsen van een vergunning, waardoor twee of meer vergunningen voor twee of meer gebieden ontstaan;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel19
  - number: 19.b
    text: het samenvoegen van twee of meer vergunningen, waardoor een vergunning voor een gebied ontstaat.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel19
  - number: '20.1'
    text: |-
      De houder van een vergunning kan zijn vergunning slechts met schriftelijke toestemming van Onze Minister op een
      ander doen overgaan. [Artikel 7, tweede lid][ref1], en [artikel 9][ref2], met uitzondering van het eerste lid,
      onderdeel d, zijn van overeenkomstige toepassing. Aan een toestemming kunnen voorschriften worden verbonden. Een
      toestemming kan onder beperkingen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel9
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '20.2'
    text: |-
      Indien de houder van een vergunning een deel van zijn vergunning op een ander wil doen overgaan, dient hij tevens
      een aanvraag in om splitsing van de vergunning als bedoeld in [artikel 19, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel19
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '20.3'
    text: Van een beschikking tot verlening van toestemming wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel20
  - number: '21.1'
    text: 'Onze Minister kan een vergunning intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel21
  - number: 21.1.a
    text: |-
      de bij de aanvraag verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op de aanvraag een
      andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren
      geweest,
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel21
  - number: 21.1.b
    text: de vergunning niet langer nodig is voor de goede uitvoering van de activiteiten waarvoor zij geldt,
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel21
  - number: 21.1.c
    text: dit wordt gerechtvaardigd door een wijziging in de technische of financiële mogelijkheden van de houder,
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel21
  - number: 21.1.d
    text: niet overeenkomstig de vergunning is of wordt gehandeld, of
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel21
  - number: 21.1.e
    text: |-
      voor de houder van de vergunning of de in [artikel 22](onbekend) bedoelde aangewezen persoon als zodanig geldende
      regels niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel21
  - number: '21.2'
    text: |-
      Onze Minister gaat niet over tot intrekking op grond van het eerste lid, onderdeel d of e, dan nadat hij de houder
      schriftelijk heeft gewaarschuwd en de houder of de in [artikel 22](onbekend) bedoelde aangewezen persoon zich na de
      waarschuwing voortdurend of opnieuw aan de overtreding schuldig maakt.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel21
  - number: '21.3'
    text: |-
      Onze Minister kan een winningsvergunning op aanvraag van de houder intrekken. Een aanvraag tot intrekking kan
      slechts worden afgewezen, indien het voor een planmatig beheer van voorkomens van delfstoffen noodzakelijk is dat
      de houder een aan de vergunning verbonden voorschrift of een voor hem als zodanig geldende regel naleeft.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel21
  - number: '21.4'
    text: |-
      De houder van een opsporingsvergunning kan afstand doen van de vergunning. De vergunning vervalt met ingang van
      de dag na die waarop Onze Minister een schriftelijke verklaring van de houder heeft ontvangen, waarbij deze van de
      vergunning afstand doet.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel21
  - number: '21.5'
    text: 'De vergunning vervalt van rechtswege:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel21
  - number: 21.5.a
    text: als de houder een natuurlijke persoon is, met ingang van de dag na die waarop die persoon is overleden;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel21
  - number: 21.5.b
    text: als de houder een rechtspersoon is, met ingang van de dag na die waarop die persoon heeft opgehouden te bestaan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel21
  - number: '21.6'
    text: |-
      Van een beschikking tot intrekking van een vergunning of van het vervallen van een vergunning wordt mededeling
      gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel21
  - number: '22.1'
    text: |-
      Dit artikel is van toepassing op het houden van een vergunning door meer dan een natuurlijke persoon of
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel22
  - number: '22.2'
    text: |-
      Bij de aanvraag om een vergunning worden de personen gezamenlijk als aanvrager van de vergunning beschouwd. Na
      verlening worden zij gezamenlijk als houder van de vergunning beschouwd.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel22
  - number: '22.3'
    text: |-
      [Artikel 20][ref1] is van overeenkomstige toepassing als een van de personen zijn aandeel in de vergunning op een
      ander wil doen overgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel20
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '22.4'
    text: |-
      In afwijking van [artikel 21, vijfde lid][ref1], vervalt de vergunning niet als één van de houders die een
      natuurlijke persoon is, overlijdt dan wel één van de houders die een rechtspersoon is, ophoudt te bestaan, maar
      gaat diens aandeel in de vergunning over op de medehouders.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel21
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '22.5'
    text: |-
      Een van de personen wordt aangewezen om de feitelijke werkzaamheden te verrichten of daartoe opdracht te verlenen.
      Het verrichten van de feitelijke werkzaamheden of het verlenen van opdracht daartoe is slechts aan de aangewezen
      persoon toegestaan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel22
  - number: '22.6'
    text: De aanwijzing geschiedt voor de eerste maal in de vergunning.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel22
  - number: '22.7'
    text: |-
      De houder van de vergunning kan uit zijn midden een andere persoon aanwijzen, nadat hij daartoe van Onze Minister
      schriftelijk toestemming heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel22
  - number: '22.8'
    text: |-
      Indien de aangewezen persoon niet meer in staat is tot het verrichten van de feitelijke werkzaamheden of het
      verlenen van opdracht daartoe, trekt Onze Minister de aanwijzing in. Indien geen van de personen is aangewezen,
      wijst Onze Minister een van hen aan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel22
  - number: '22.9'
    text: |-
      Onze Minister neemt de besluiten die verband houden met de aanwijzing op basis van
      de in [artikel 9, eerste lid, onderdelen a tot en met c][ref1], genoemde gronden.
      [Artikel 9, tweede, derde en vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel9
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '22.10'
    text: |-
      Indien voor een voorkomen zowel een opsporings- of winningsvergunning als een opslagvergunning geldt, wordt binnen
      beide vergunningen dezelfde persoon aangewezen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel22
  - number: '23.1'
    text: |-
      De houder van een winningsvergunning voor koolwaterstoffen gaat niet over tot het winnen uit een voorkomen dat
      naar redelijkerwijs kan worden aangenomen de grens van het vergunningsgebied overschrijdt, zolang geen overeenkomst
      van kracht is als bedoeld in [artikel 42, tweede lid][ref1], tenzij Onze Minister ontheffing heeft verleend van de
      verplichting om een overeenkomst te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel42
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '23.2'
    text: |-
      Indien tijdens of na het winnen van koolwaterstoffen blijkt of is gebleken dat het desbetreffende voorkomen de
      grens van het vergunningsgebied overschrijdt, is de vergunninghouder, bedoeld in het eerste lid, verplicht terstond
      na het bekend worden van dat feit de voor het aangrenzende gebied tot het winnen van de delfstoffen of aardwarmte
      gerechtigde daarvan in kennis te stellen en medewerking te verlenen aan de totstandkoming van een overeenkomst als
      bedoeld in [artikel 42, tweede lid, eerste volzin][ref1]. Artikel 42, tweede lid, tweede tot en met vierde volzin,
      zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel42
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '24'
    text: |-
      Dit hoofdstuk, met uitzondering van [artikel 6](onbekend), is niet van toepassing op het opsporen of het winnen van
      delfstoffen in het kader van het verkrijgen van gegevens voor zuiver wetenschappelijk onderzoek of voor het door
      de centrale overheid te voeren beleid. Bij het nemen van een besluit omtrent een vergunning voor deze activiteiten
      sluit Onze Minister aan bij de bepalingen van dit hoofdstuk, voorzover dit met het bijzondere karakter van de
      vergunning te verenigen is.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel24
  - number: '25.1'
    text: Het is verboden stoffen op te slaan zonder vergunning van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel25
  - number: '25.2'
    text: Het verbod geldt niet met betrekking tot bij algemene maatregel van bestuur omschreven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel25
  - number: '26.1'
    text: |-
      Een opslagvergunning wordt niet verleend, voorzover deze bij het in werking treden zou gaan gelden voor een gebied
      waarvoor op dat tijdstip reeds een door een ander gehouden opslagvergunning geldt.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel26
  - number: '26.2'
    text: |-
      Een opslagvergunning wordt evenmin verleend, voorzover deze bij het in werking treden zou gaan gelden voor een
      voorkomen waarvoor op dat tijdstip reeds een door een ander gehouden vergunning als bedoeld in [artikel 6][ref1]
      geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '27.1'
    text: 'Onverminderd [artikel 26](onbekend) kan een opslagvergunning slechts worden geweigerd:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel27
  - number: 27.1.a
    text: op grond van de technische of financiële mogelijkheden van de aanvrager,
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel27
  - number: 27.1.b
    text: |-
      op grond van de manier waarop de aanvrager voornemens is de activiteiten, waarvoor de vergunning wordt aangevraagd,
      te verrichten,
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel27
  - number: 27.1.c
    text: |-
      op grond van het gebrek aan efficiëntie en verantwoordelijkheidszin waarvan de aanvrager blijk heeft gegeven bij
      activiteiten onder een eerdere vergunning op grond van deze wet,
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel27
  - number: 27.1.d
    text: in het belang van de veiligheid,
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel27
  - number: 27.1.e
    text: in het belang van de landsverdediging, of
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel27
  - number: 27.1.f
    text: in het belang van een planmatig beheer van voorkomens van delfstoffen of aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel27
  - number: '27.2'
    text: |-
      Een vergunning kan op grond van de financiële mogelijkheden van de aanvrager worden geweigerd als onvoldoende
      verzekerd is dat de aanvrager zal voldoen aan hem op te leggen verplichtingen als bedoeld in de artikelen [46]
      (onbekend), [47](onbekend) en [102](onbekend).
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel27
  - number: '27.3'
    text: |-
      Met het oog op de toepassing van het eerste en tweede lid kunnen bij ministeriële regeling nadere regels worden
      gesteld, die bij de beslissing op een aanvraag om een vergunning in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel27
  - number: '28'
    text: |-
      In een opslagvergunning wordt bepaald voor welke stoffen, voor welk gebied en voor welk tijdvak zij geldt. Daarbij
      wordt bepaald dat:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel28
  - number: 28.a
    text: de in de ondergrond gebrachte stoffen voor een in de vergunning geregeld tijdstip teruggehaald moeten worden, of
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel28
  - number: 28.b
    text: de stoffen definitief in de ondergrond achtergelaten moeten worden.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel28
  - number: '29.1'
    text: |-
      Een opslagvergunning kan voorts onder andere beperkingen dan die bedoeld in [artikel 28](onbekend) worden verleend.
      Aan een vergunning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel29
  - number: '29.2'
    text: |-
      De beperkingen en voorschriften, anders dan voorschriften op grond van [artikel 98](onbekend), kunnen slechts
      worden gerechtvaardigd door het belang van de veiligheid, de landsverdediging of een planmatig beheer van
      voorkomens van delfstoffen of aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel29
  - number: '30'
    text: |-
      Onze Minister kan een opslagvergunning wijzigen of intrekken, indien dit wordt gerechtvaardigd op grond van de in
      [artikel 29, tweede lid](onbekend), bedoelde belangen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel30
  - number: '31'
    text: |-
      De houder van een opslagvergunning kan zijn vergunning slechts met schriftelijke toestemming van Onze Minister
      op een ander doen overgaan. De [artikelen 20, tweede en derde lid](onbekend), [26, tweede lid](onbekend), en[ 27]
      (onbekend) zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel31
  - number: '32'
    text: |-
      Ten aanzien van een opslagvergunning zijn de artikelen [14](onbekend), [17](onbekend), [19](onbekend), [21]
      (onbekend), met uitzondering van het vierde lid, en [22](onbekend) van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel32
  - number: '33'
    text: |-
      De houder van een vergunning als bedoeld in [artikel 6](onbekend) of [25](onbekend), dan wel, ingeval de vergunning
      haar gelding heeft verloren, de laatste houder daarvan, neemt alle maatregelen die redelijkerwijs van hem gevergd
      kunnen worden om te voorkomen dat als gevolg van de met gebruikmaking van de vergunning verrichte activiteiten:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel33
  - number: 33.a
    text: nadelige gevolgen voor het milieu worden veroorzaakt,
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel33
  - number: 33.b
    text: schade door bodembeweging wordt veroorzaakt,
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel33
  - number: 33.c
    text: de veiligheid wordt geschaad, of
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel33
  - number: 33.d
    text: het belang van een planmatig beheer van voorkomens van delfstoffen of aardwarmte wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel33
  - number: '34.1'
    text: Het winnen van delfstoffen vanuit een voorkomen geschiedt overeenkomstig een winningsplan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel34
  - number: '34.2'
    text: |-
      De houder van een winningsvergunning of de krachtens [artikel 22][ref1] aangewezen persoon dient een winningsplan
      in bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '34.3'
    text: Het winningsplan behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel34
  - number: '34.4'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van het
      besluit omtrent instemming met een winningsplan, voorzover het winnen van delfstoffen niet geschiedt in het
      continentaal plat of onder de territoriale zee vanuit een voorkomen dat is gelegen aan de zeezijde van de
      in de bijlage bij deze wet vastgelegde lijn. Zienswijzen kunnen naar voren worden gebracht door een ieder.
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref2] is niet van toepassing indien het een besluit betreft inzake
      wijziging van een besluit omtrent instemming met een winningsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '34.5'
    text: |-
      Het eerste lid is niet van toepassing op het winnen van delfstoffen in het kader van het verkrijgen van gegevens
      voor zuiver wetenschappelijk onderzoek of voor het door de centrale overheid te voeren beleid.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel34
  - number: '35.1'
    text: 'Het winningsplan bevat voor elk voorkomen binnen het vergunningsgebied ten minste een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel35
  - number: 35.1.a
    text: de verwachte hoeveelheid aanwezige delfstoffen en de ligging ervan;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel35
  - number: 35.1.b
    text: het aanvangstijdstip en de duur van de winning;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel35
  - number: 35.1.c
    text: de wijze van winning alsmede de daarmee verband houdende activiteiten;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel35
  - number: 35.1.d
    text: de hoeveelheden jaarlijks te winnen delfstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel35
  - number: 35.1.e
    text: de kosten op jaarbasis van het winnen van de delfstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel35
  - number: 35.1.f
    text: |-
      de bodembeweging ten gevolge van de winning en de maatregelen ter voorkoming van schade door bodembeweging,
      voorzover het winnen van delfstoffen niet geschiedt in het continentaal plat of onder de territoriale zee vanuit
      een voorkomen dat is gelegen aan de zeezijde van de in de [bijlage bij deze wet](onbekend) vastgelegde lijn, tenzij
      Onze Minister anders heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel35
  - number: '35.2'
    text: De Technische commissie bodembeweging brengt aan Onze Minister advies uit omtrent het eerste lid, onderdeel f.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel35
  - number: '35.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      winningsplan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel35
  - number: '36.1'
    text: 'Onze Minister kan zijn instemming met het opgestelde winningsplan slechts weigeren:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel36
  - number: 36.1.a
    text: in het belang van het planmatig beheer van voorkomens van delfstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel36
  - number: 36.1.b
    text: |-
      in verband met het risico van schade ten gevolge van beweging van de aardbodem, voorzover het winnen van
      delfstoffen niet geschiedt in het continentaal plat of onder de territoriale zee vanuit een voorkomen dat is
      gelegen aan de zeezijde van de in de bijlage bij deze wet vastgelegde lijn, tenzij Onze Minister anders heeft
      bepaald.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel36
  - number: '36.2'
    text: |-
      Onze Minister kan zijn instemming verlenen onder beperkingen of daaraan voorschriften verbinden, indien deze
      gerechtvaardigd worden door een grond als genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel36
  - number: '36.3'
    text: |-
      Onze Minister kan zijn instemming intrekken of de beperkingen en voorschriften wijzigen, indien dat gerechtvaardigd
      wordt door de in het eerste lid genoemde gronden. De derde volzin van [artikel 34, vierde lid][ref1], is van
      overeenkomstige toepassing op een besluit inzake intrekking van een besluit omtrent instemming met een winningsplan
      en inzake wijziging van beperkingen en voorschriften als bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '38'
    text: |-
      Onze Minister houdt de beslissing op een aanvraag om een milieuvergunning als bedoeld in de
      [Wet milieubeheer][ref1] voor een mijnbouwwerk ten behoeve van het winnen uit een voorkomen dat is gelegen aan de
      landzijde van de in de [bijlage bij deze wet](onbekend) vastgelegde lijn aan totdat hij heeft ingestemd met het
      winningsplan, bedoeld in [artikel 34](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '39'
    text: 'De [artikelen 34 tot en met 38](onbekend) zijn van overeenkomstige toepassing op:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel39
  - number: 39.a
    text: het winnen van aardwarmte, en
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel39
  - number: 39.b
    text: het opslaan van stoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel39
  - number: '40.1'
    text: |-
      Dit artikel is van toepassing in die gevallen waarin [hoofdstuk 8 van de Wet milieubeheer][ref1] niet van
      toepassing is op een mijnbouwwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
  - number: '40.2'
    text: Het is verboden zonder vergunning van Onze Minister een mijnbouwwerk op te richten of in stand te houden.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel40
  - number: '40.3'
    text: De vergunning kan slechts in het belang van de bescherming van het milieu worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel40
  - number: '40.4'
    text: |-
      De vergunning kan onder beperkingen worden verleend. Aan de vergunning kunnen voorschriften worden verbonden.
      De beperkingen en voorschriften kunnen slechts worden gerechtvaardigd door het belang van de bescherming van het
      milieu.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel40
  - number: '40.5'
    text: |-
      In de vergunning kan worden bepaald dat Onze Minister daarbij omschreven bevoegdheden heeft ter uitvoering van
      daarbij aangewezen voorschriften.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel40
  - number: '40.6'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop de aanvraag om een vergunning dient te
      geschieden en omtrent de gegevens en de bescheiden welke daarbij moeten worden overgelegd. Bij de regeling worden
      bestuursorganen aangewezen die in de gelegenheid moeten worden gesteld advies uit te brengen met betrekking tot het
      nemen van een besluit, of die op andere wijze bij de voorbereidingsprocedure worden betrokken.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel40
  - number: '40.7'
    text: |-
      Onze Minister kan de beperkingen en voorschriften wijzigen, voorzover zij geen betrekking hebben op de plaats van
      het mijnbouwwerk en de wijziging wordt gerechtvaardigd door het belang van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel40
  - number: '40.8'
    text: |-
      [Artikel 21, eerste lid, met uitzondering van onderdeel c, en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel21
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '40.9'
    text: |-
      De volgende onderdelen van de [Wet milieubeheer][ref1] zijn van overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 40.9.a
    text: |-
      [hoofdstuk 7][ref1], de [artikelen 8.1, tweede lid][ref2], [8.16][ref3], [8.19, eerste lid][ref4],
      [8.20, eerste lid][ref5],[ 8.21][ref6], [8.40, eerste en tweede lid][ref7], [8.41][ref8], [8.42][ref9],
      [8.44][ref10], en [afdeling 13.2][ref11];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref9]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref10]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref11]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref6
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref7
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref8
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref9
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref10
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref11
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: 40.9.b
    text: |-
      [artikel 8.6][ref1] ten aanzien van het verlenen van een vergunning;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 40.9.c
    text: |-
      de [artikelen 8.39a][ref1], [8.39b][ref2], [8.39c][ref3] en [8.39e][ref4] ten aanzien van het verlenen, het
      wijzigen of het intrekken van een vergunning;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 40.9.d
    text: |-
      [titel 15.4][ref1] ten aanzien van een beschikking omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 40.9.d.1°
    text: het wijzigen of intrekken van een vergunning;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel40
  - number: 40.9.d.2°
    text: |-
      het verlenen van een vergunning voor het in stand houden van een mijnbouwwerk in een geval waarin het in het tweede
      lid bedoelde verbod niet gold voor dat mijnbouwwerk en het verbod op enig tijdstip is gaan gelden anders dan ten
      gevolge van een verandering van het mijnbouwwerk of van de werking daarvan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel40
  - number: '41.1'
    text: |-
      Met het oog op de kans op beweging van de aardbodem worden metingen verricht voor de aanvang van het winnen van
      delfstoffen, tijdens het winnen en tot dertig jaar na het beëindigen van het winnen. Bij of krachtens algemene
      maatregel van bestuur worden regels gesteld omtrent deze metingen en de rapportage over de uitkomsten daarvan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel41
  - number: '41.2'
    text: Dit artikel is van overeenkomstige toepassing op het winnen van aardwarmte en het opslaan van stoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel41
  - number: '41.3'
    text: |-
      Dit artikel geldt, tenzij in de desbetreffende vergunning anders is bepaald, niet met betrekking tot het winnen
      van delfstoffen of aardwarmte of het opslaan van stoffen in het continentaal plat en onder de territoriale zee,
      voorzover het winnen of het opslaan plaatsvindt vanuit of in een voorkomen dat gelegen is aan de zeezijde van de in
      de [bijlage bij deze wet](onbekend) vastgelegde lijn.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel41
  - number: '41.4'
    text: |-
      De verplichtingen van dit artikel rusten op de houder van de desbetreffende, in [artikel 6](onbekend) of [25]
      (onbekend) bedoelde vergunning, dan wel, indien de vergunning haar geldigheid heeft verloren, op de laatste houder
      van de vergunning. Indien de vergunning wordt gehouden door meer dan een natuurlijke persoon of rechtspersoon,
      rusten de verplichtingen van dit artikel op de in [artikel 22](onbekend) bedoelde aangewezen persoon, dan wel,
      indien de vergunning haar geldigheid heeft verloren, de laatstelijk op grond van dat artikel aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel41
  - number: '42.1'
    text: |-
      Indien een vergunning als bedoeld in [artikel 6][ref1] of [25][ref2] geldt voor een gebied, waarvoor een ander een
      vergunning als bedoeld in [artikel 6][ref3] of [25][ref4] houdt, kan Onze Minister de vergunninghouder verplichten
      in een door hem te bepalen omvang te gedogen dat de houder van die andere vergunning zijn daaruit voortvloeiende
      rechten uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
  - number: '42.2'
    text: |-
      Indien een vergunning voor het winnen van delfstoffen of aardwarmte geldt voor een gebied, waarin zich een
      voorkomen bevindt dat naar redelijkerwijs kan worden aangenomen de grens van het vergunningsgebied overschrijdt,
      is de vergunninghouder verplicht om medewerking te verlenen aan de totstandkoming van een overeenkomst tussen de
      vergunninghouder en de voor het aangrenzende gebied tot het winnen van de delfstoffen of aardwarmte gerechtigde,
      tenzij Onze Minister van deze verplichting ontheffing verleent. De overeenkomst strekt er toe dat het winnen in
      onderlinge overeenstemming zal geschieden. In de overeenkomst kan worden bepaald dat verplichtingen die krachtens
      de [hoofdstukken 2][ref1], [3][ref2] en [4][ref3] rusten op de in [artikel 22][ref4] bedoelde aangewezen
      personen, rusten op een van deze aangewezen personen. Onze Minister kan eisen stellen aan de tot stand te brengen
      overeenkomst. De overeenkomst en de wijzigingen in de overeenkomst worden aan Onze Minister overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0014168
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '43.1'
    text: |-
      Onze Minister kan rond een mijnbouwinstallatie een veiligheidszone van een door hem te bepalen omvang instellen.
      Zodanige veiligheidszone kan zich niet verder uitstrekken dan tot een afstand van 500 meter, gemeten vanaf de
      buitenzijde van de installatie.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel43
  - number: '43.2'
    text: |-
      Het is verboden, zonder ontheffing van Onze Minister, zich te bevinden dan wel enig voorwerp van welke aard
      ook te hebben of te doen hebben binnen een krachtens het eerste lid vastgestelde veiligheidszone anders dan ten
      behoeve van het verrichten van een verkenningsonderzoek of het op grond van een vergunning opsporen of winnen van
      delfstoffen of aardwarmte of het opslaan van stoffen. Aan de ontheffing kunnen voorschriften of beperkingen worden
      verbonden. Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de aanvraag, wijziging of
      intrekking van een ontheffing.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel43
  - number: '44.1'
    text: Een niet meer in gebruik zijnde mijnbouwinstallatie wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel44
  - number: '44.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op schroot en ander materiaal, dat ter plaatse of in de naaste
      omgeving terechtgekomen is bij het plaatsen, het gebruik of verwijderen van de mijnbouwinstallatie.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel44
  - number: '44.3'
    text: |-
      Onze Minister kan de verplichting tot verwijdering beperken tot een door hem te bepalen diepte beneden de bodem van
      het oppervlaktewater.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel44
  - number: '44.4'
    text: Onze Minister kan een termijn vaststellen, waarbinnen aan de verplichting tot verwijdering moet zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel44
  - number: '44.5'
    text: '[Artikel 41, vierde lid](onbekend), is van overeenkomstige toepassing.'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel44
  - number: '45.1'
    text: |-
      Onze Minister kan bepalen dat een op of in het continentaal plat gelegen kabel of pijpleiding die is gebruikt voor
      het opsporen of winnen van delfstoffen of aardwarmte, dan wel voor het opslaan van stoffen, na het beëindigen van
      het gebruik wordt verwijderd. [Artikel 44, tweede en derde lid](onbekend), is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel45
  - number: '45.2'
    text: |-
      De verplichtingen van dit artikel rusten op de beheerder van de kabel of pijpleiding, dan wel, indien niemand als
      beheerder kan worden aangemerkt, op de laatste beheerder van de kabel of pijpleiding.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel45
  - number: '46.1'
    text: |-
      Onze Minister kan bepalen dat zekerheid gesteld dient te worden ter dekking van de aansprakelijkheid voor de schade
      die naar redelijke schatting ontstaat door beweging van de aardbodem als gevolg van het winnen van delfstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel46
  - number: '46.2'
    text: |-
      Op verzoek van Onze Minister wordt aan hem een goed onderbouwd rapport overgelegd, waaruit blijkt welke schade naar
      redelijke schatting zal ontstaan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel46
  - number: '46.3'
    text: |-
      Het bedrag en de termijn waarvoor en het tijdstip en de wijze waarop de zekerheid wordt gesteld, dienen ten
      genoegen van Onze Minister te zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel46
  - number: '46.4'
    text: Dit artikel is van overeenkomstige toepassing op het winnen van aardwarmte en het opslaan van stoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel46
  - number: '46.5'
    text: |-
      Dit artikel geldt, tenzij in de desbetreffende vergunning anders is bepaald, niet met betrekking tot het winnen
      van delfstoffen of aardwarmte of het opslaan van stoffen in het continentaal plat en onder de territoriale zee,
      voorzover het winnen of het opslaan plaatsvindt vanuit of in een voorkomen dat gelegen is aan de zeezijde van de in
      de bijlage bij deze wet vastgelegde lijn.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel46
  - number: '46.6'
    text: |-
      [Artikel 41, vierde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat, indien een
      vergunning wordt overgedragen na het bekend worden van schade, de verplichtingen van dit artikel wat betreft
      die schade blijven rusten op degene die ten tijde van dat bekend worden de houder van de vergunning of de in
      [artikel 22][ref2] bedoelde aangewezen persoon was.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '47.1'
    text: |-
      Onze Minister kan bepalen dat zekerheid gesteld dient te worden voor de nakoming van hetgeen verschuldigd zal
      worden, ingeval hij bestuursdwang toepast ter handhaving van de bij of krachtens deze wet gestelde verplichtingen
      ten aanzien van het verwijderen of achterlaten, dan wel het na verwijdering slopen of hergebruiken van niet meer in
      gebruik zijnde mijnbouwinstallaties.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel47
  - number: '47.2'
    text: De [artikelen 41, vierde lid](onbekend), en [46, derde lid](onbekend), zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel47
  - number: '48.1'
    text: |-
      Onze Minister kan bepalen dat zekerheid gesteld dient te worden voor de nakoming van hetgeen verschuldigd zal
      worden, ingeval hij bestuursdwang toepast ter handhaving van de bij of krachtens deze wet gestelde verplichtingen
      ten aanzien van het verwijderen of achterlaten, dan wel het na verwijdering slopen of hergebruiken van niet meer in
      gebruik zijnde, op of in het continentaal plat gelegen kabels of pijpleidingen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel48
  - number: '48.2'
    text: De [artikelen 45, tweede lid](onbekend), en [46, derde lid](onbekend), zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel48
  - number: '49.1'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: 49.1.a
    text: het opsporen van delfstoffen of aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: 49.1.b
    text: het winnen van delfstoffen of aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: 49.1.c
    text: het opslaan van stoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: 49.1.d
    text: het instellen van een verkenningsonderzoek;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: 49.1.e
    text: |-
      boorgaten, anders dan ten behoeve van het opsporen of winnen van delfstoffen of aardwarmte dan wel het opslaan van
      stoffen, dieper dan 500 meter beneden de oppervlakte van de aardbodem;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: 49.1.f
    text: |-
      pijpleidingen en kabels die worden gebruikt ten behoeve van het opsporen of winnen van delfstoffen of aardwarmte,
      dan wel ten behoeve van het opslaan van stoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: '49.2'
    text: 'De in het eerste lid bedoelde regels kunnen worden gesteld ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: 49.2.a
    text: een planmatig beheer van voorkomens van delfstoffen, aardwarmte en andere natuurlijke rijkdommen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: 49.2.b
    text: de bescherming van de veiligheid;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: 49.2.c
    text: de bescherming van het milieu;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: 49.2.d
    text: het beperken van schade ten gevolge van beweging van de aardbodem.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: '49.3'
    text: |-
      De in het eerste lid bedoelde regels kunnen voorts worden gesteld, voorzover de in het eerste lid bedoelde
      activiteiten plaatsvinden op of in het continentaal plat of de territoriale zee, ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: 49.3.a
    text: |-
      de scheepvaart, de landsverdediging, de visserij, de opwekking van elektriciteit, het instandhouden van de levende
      rijkdommen van de zee, het zuiver wetenschappelijk onderzoek en het leggen en onderhouden van onderzeese kabels
      en pijpleidingen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: 49.3.b
    text: de bescherming van historische, oudheidkundige en andere wetenschappelijke vondsten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: '49.4'
    text: De in het eerste lid bedoelde regels kunnen, voorzover die gesteld worden, beperkingen inhouden.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: '49.5'
    text: |-
      De in het eerste lid bedoelde regels kunnen mede betrekking hebben op het verwijderen of achterlaten en op het na
      verwijdering slopen of hergebruiken van niet meer in gebruik zijnde mijnbouwwerken, kabels en pijpleidingen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: '49.6'
    text: |-
      De in het derde lid bedoelde regels, voorzover die gesteld worden ten behoeve van de scheepvaart, de opwekking
      van elektriciteit, de bescherming van historische, oudheidkundige en andere wetenschappelijke vondsten of de
      landsverdediging, kunnen beperkingen inhouden ten aanzien van de locaties waar de in het eerste lid bedoelde
      activiteiten plaats kunnen vinden.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel49
  - number: '50'
    text: |-
      Onze Minister kan, in gevallen waarin ernstige aantasting van de in [artikel 49, tweede of derde lid][ref1],
      genoemde belangen ontstaat of dreigt te ontstaan, maatregelen voorschrijven ten aanzien van de in artikel 49,
      eerste en vijfde lid, bedoelde activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '51.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bescherming van de veiligheid met het oog op instorting
      regels worden gesteld omtrent het met gebruikmaking van een boorgat, tunnel, schacht of ander ondergronds werk
      onttrekken aan de ondergrond van:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel51
  - number: 51.1.a
    text: |-
      delfstoffen, voorzover deze op een diepte van minder dan 100 meter beneden de oppervlakte van de aardbodem aanwezig
      zijn;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel51
  - number: 51.1.b
    text: andere vaste stoffen dan kalksteen of delfstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel51
  - number: '51.2'
    text: 'De in het eerste lid bedoelde algemene maatregel van bestuur kan bepalen dat:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel51
  - number: 51.2.a
    text: de onttrekking van stoffen, bedoeld in het eerste lid, zonder vergunning van Onze Minister verboden is;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel51
  - number: 51.2.b
    text: Onze Minister bij de maatregel omschreven bevoegdheden heeft ter uitvoering van daarbij aangewezen regels.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel51
  - number: '51.3'
    text: |-
      Onze Minister kan, in gevallen waarin ernstige aantasting van de veiligheid met het oog op instorting ontstaat of
      dreigt te ontstaan, maatregelen voorschrijven ten aanzien van de in het eerste lid bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel51
  - number: '52.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bescherming van de veiligheid met het oog op instorting
      regels worden gesteld omtrent het met gebruikmaking van een boorgat, tunnel, schacht of ander ondergronds werk
      onttrekken aan de ondergrond van kalksteen alsmede omtrent het gebruik van een vorenbedoeld ondergronds werk voor
      andere doeleinden dan het onttrekken van kalksteen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel52
  - number: '52.2'
    text: 'De in het eerste lid bedoelde algemene maatregel van bestuur kan bepalen dat:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel52
  - number: 52.2.a
    text: het verrichten van de activiteiten, bedoeld in het eerste lid, zonder vergunning van Onze Minister verboden is;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel52
  - number: 52.2.b
    text: Onze Minister bij de maatregel omschreven bevoegdheden heeft ter uitvoering van daarbij aangewezen regels.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel52
  - number: '52.3'
    text: |-
      Onze Minister kan, in gevallen waarin ernstige aantasting van de veiligheid met het oog op instorting ontstaat of
      dreigt te ontstaan, maatregelen voorschrijven ten aanzien van de in het eerste lid bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel52
  - number: '53'
    text: |-
      Deze afdeling is van toepassing op de heffing en invordering van oppervlakterecht, cijns en winstaandeel van de
      houder of medehouder van een vergunning voor het opsporen of winnen van koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel53
  - number: '54'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel54
  - number: 54.a
    text: 'medehouderschap: geval waarin de vergunning wordt gehouden door meer dan één natuurlijke persoon of rechtspersoon;'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel54
  - number: 54.b
    text: 'medehouder: ieder van de in onderdeel a bedoelde natuurlijke personen of rechtspersonen;'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel54
  - number: 54.c
    text: |-
      de aangewezen medehouder: de in [artikel 22][ref1] bedoelde aangewezen persoon;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 54.d
    text: |-
      de landzijde: het deel van het Nederlands territoir dat ligt aan de landzijde van de in de bijlage bij deze wet
      vastgelegde lijn;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel54
  - number: 54.e
    text: |-
      de zeezijde: het continentaal plat en het deel van het Nederlands territoir dat ligt aan de zeezijde van de in de
      bijlage bij deze wet vastgelegde lijn;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel54
  - number: 54.f
    text: |-
      de inspecteur: de door Onze Minister van Financiën bij ministeriële regeling aangewezen functionaris van de
      rijksbelastingdienst;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel54
  - number: 54.g
    text: |-
      de ontvanger: de door Onze Minister van Financiën bij ministeriële regeling aangewezen functionaris van de
      rijksbelastingdienst.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel54
  - number: '55.1'
    text: |-
      Een wijziging in [paragraaf 5.1.1.2.](onbekend), met uitzondering van een wijziging die het gevolg is
      van toepassing van [artikel 58, derde lid](onbekend), is niet van toepassing op de houder van een voor de
      inwerkingtreding van die wijziging verleende opsporingsvergunning, tenzij die houder om toepassing van de
      gewijzigde paragraaf verzoekt.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel55
  - number: '55.2'
    text: |-
      Een wijziging in [paragraaf 5.1.1.2.](onbekend), met uitzondering van een wijziging die het gevolg is van
      toepassing van [artikel 58, derde lid](onbekend), in [paragraaf 5.1.1.3.](onbekend) of in [paragraaf 5.1.1.4.]
      (onbekend), met uitzondering van [artikel 68, eerste lid](onbekend), is niet van toepassing op de houder van een
      voor de inwerkingtreding van die wijziging verleende winningsvergunning, tenzij die houder om toepassing van de
      gewijzigde paragrafen verzoekt.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel55
  - number: '55.3'
    text: |-
      Een verzoek, als bedoeld in het eerste en tweede lid, wordt schriftelijk bij Onze Minister ingediend binnen drie
      maanden na de dag waarop die wijziging in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel55
  - number: '55.4'
    text: |-
      Onze Minister geeft aan een verzoek, als bedoeld in het eerste en tweede lid, gevolg, tenzij naar zijn oordeel het
      algemeen belang zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel55
  - number: '56.1'
    text: |-
      Oppervlakterecht wordt geheven van degene die op 1 januari van het kalenderjaar waarover wordt geheven houder is
      van een opsporingsvergunning voor de zeezijde alsmede van degene die op 1 januari van het kalenderjaar waarover
      wordt geheven houder is van een winningsvergunning.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel56
  - number: '56.2'
    text: Ingeval van medehouderschap wordt het oppervlakterecht geheven van de aangewezen medehouder.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel56
  - number: '57.1'
    text: |-
      De heffingsmaatstaf is de oppervlakte van het gebied waarvoor een in [artikel 56, eerste lid][ref1], bedoelde
      opsporings- of winningsvergunning op 1 januari van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel56
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: 5.1.1.2
        afdeling: 5.1.1
  - number: '57.2'
    text: Het tijdvak waarover het oppervlakterecht wordt geheven is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel57
  - number: '58.1'
    text: |-
      Het tarief over 2003 voor het houden van een opsporingsvergunning is een bedrag per vierkante kilometer
      overeenkomstig de onderstaande tabel. Het eerste tijdvak is het eerste kalenderjaar waarin de vergunning op 1
      januari van kracht is. De volgende tijdvakken zijn de op dat kalenderjaar volgende jaren. **Tarief over 2003**






                    Tijdvak


                    Bedrag per km2






                    1e tot en met 6e tijdvak


                    € 200





                    7e tot en met 9e tijdvak


                    € 400





                    Volgende tijdvakken


                    € 600
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel58
  - number: '58.2'
    text: Het tarief over 2003 voor het houden van een winningsvergunning bedraagt € 600  per vierkante kilometer.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel58
  - number: '58.3'
    text: |-
      Bij het begin van ieder kalenderjaar worden de voor dat jaar geldende tarieven, bedoeld in het eerste en tweede lid,
      bij ministeriële regeling vastgesteld. Deze tarieven worden berekend aan de hand van het indexcijfer, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________, zoals dat gold op 31 december van het voorgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005666#Artikel1
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005666
        artikel: '1'
  - number: '59.1'
    text: Oppervlakterecht wordt op aangifte voldaan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel59
  - number: '59.2'
    text: |-
      De houder, of, ingeval van medehouderschap, de aangewezen medehouder, doet uiterlijk 1 april van het kalenderjaar
      waarover wordt geheven aangifte door de inlevering van een aangiftebiljet.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel59
  - number: '60'
    text: |-
      Cijns wordt geheven van de houder, of, ingeval van medehouderschap, van ieder van de medehouders, van een
      winningsvergunning.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel60
  - number: '61'
    text: |-
      Indien in het vergunningsgebied zowel aardgas als aardolie zijn gewonnen, wordt over aardgas en aardolie
      afzonderlijk cijns geheven.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel61
  - number: '62.1'
    text: |-
      De heffingsmaatstaf is de omzet die de houder, of, ingeval van medehouderschap, ieder van de medehouders, heeft
      behaald in het kalenderjaar waarover de cijns wordt geheven.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel62
  - number: '62.2'
    text: |-
      De omzet is het aantal in het kalenderjaar in het vergunningsgebied gewonnen aantal eenheden aardolie of aardgas
      dat aan de houder, of, ingeval van medehouderschap, aan ieder van de medehouders toekomt, vermenigvuldigd met
      de prijs per eenheid waarvoor die eenheden zijn verkocht. Indien ter zake van die verkoop voorwaarden worden
      overeengekomen of opgelegd die afwijken van voorwaarden die in het economische verkeer door onafhankelijke partijen
      zouden zijn overeengekomen, wordt de in het eerste lid bedoelde omzet bepaald alsof die laatstbedoelde voorwaarden
      zouden zijn overeengekomen. Indien eenheden anders dan door verkoop aan het winningsbedrijf zijn onttrokken,
      wordt de in het eerste lid bedoelde omzet bepaald alsof deze eenheden zijn verkocht onder voorwaarden die in het
      economische verkeer door onafhankelijke partijen zouden zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel62
  - number: '62.3'
    text: |-
      Bij de bepaling van het aantal gewonnen eenheden blijven buiten beschouwing de eenheden aardolie of aardgas welke
      zijn aangewend ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel62
  - number: 62.3.a
    text: het opsporen of het winnen in het vergunningsgebied waar ze zijn gewonnen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel62
  - number: 62.3.b
    text: het voor de aflevering bewerken van die eenheden en het transport naar de plaats waar die bewerking plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel62
  - number: '62.4'
    text: |-
      Eenheden aardolie of aardgas welke overeenkomstig [artikel 92, tweede lid, onderdeel a](onbekend), aan de in dat
      artikel bedoelde vennootschap toekomen, blijven bij de toepassing van het eerste lid buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel62
  - number: '63.1'
    text: |-
      Het tarief is een percentage dat wordt bepaald op basis van het in totaal in het kalenderjaar in het
      vergunningsgebied gewonnen aantal eenheden. Het aantal eenheden aardolie wordt bepaald bij een druk van 101,325
      kPa en een temperatuur van 15 °C. Onder aardolie wordt condensaat mede begrepen. Het aantal eenheden aardgas wordt
      bepaald bij een druk van 101,325 kPa en een temperatuur van 0 °C en omgerekend naar eenheden met een calorische
      waarde van 35,1692 MJ/m3 bovenwaarde.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel63
  - number: '63.2'
    text: |-
      Bij de bepaling van het aantal eenheden, bedoeld in het eerste lid, is [artikel 62, derde lid](onbekend), van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel63
  - number: '63.3'
    text: |-
      Het percentage wordt opgebouwd door middel van een schijvensysteem overeenkomstig de navolgende tabellen en wordt
      berekend door:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel63
  - number: 63.3.a
    text: |-
      bij iedere schijf de hoeveelheid te bepalen die binnen die schijf valt en deze hoeveelheid te vermenigvuldigen met
      het percentage dat behoort bij die schijf;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel63
  - number: 63.3.b
    text: deze producten te sommeren, en
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel63
  - number: 63.3.c
    text: deze som te delen door het totaal van het in het vergunningsgebied gewonnen aantal eenheden.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel63
  - number: '63.4'
    text: |-
      Het tarief over enig kalenderjaar wordt verhoogd met 25%, indien over dat jaar het gewogen gemiddelde van de waarde
      van in Nederland ingevoerde ruwe olie hoger is dan € 25 per vat. Bij ministeriële regeling worden regels gesteld
      omtrent de wijze waarop het in de eerste volzin bedoelde gewogen gemiddelde wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel63
  - number: '63.5'
    text: |-
      Het tarief wordt, onverminderd de verhoging op grond van het vierde lid, verhoogd met 100%, indien de houder geen
      overeenkomst als bedoeld in [artikel 90](onbekend) heeft gesloten ten aanzien van de winningsvergunning. Deze
      verhoging vindt niet plaats met betrekking tot de eenheden die zijn gewonnen uit een voorkomen ten aanzien waarvan
      een overeenkomst als bedoeld in [artikel 97](onbekend) is gesloten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel63
  - number: '64.1'
    text: Cijns wordt op aangifte voldaan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel64
  - number: '64.2'
    text: |-
      De houder, of, ingeval van medehouderschap, ieder van de medehouders, doet uiterlijk op 1 april volgend op het
      kalenderjaar waarover wordt geheven aangifte door de inlevering van een aangiftebiljet.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel64
  - number: '65'
    text: |-
      Winstaandeel wordt geheven van de houder, of, ingeval van medehouderschap, van ieder van de medehouders, van een
      winningsvergunning.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel65
  - number: '66.1'
    text: |-
      De heffingsmaatstaf is het resultaat van een met inachtneming van de [artikelen 67][ref1] en [68][ref2] door
      de houder, of, ingeval van medehouderschap, door ieder van de medehouders, van een winningsvergunning, over
      een boekjaar op te maken winst- en verliesrekening verminderd met de op de voet van het derde lid te verrekenen
      verliezen. De winst- en verliesrekening omvat de aan dat jaar en aan die vergunning toe te rekenen kosten en
      opbrengsten van het winningsbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel68
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '67'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '68'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: '66.2'
    text: |-
      Indien de houder of de medehouder tevens houder of medehouder is van één of meer andere winningsvergunningen, kan
      een geconsolideerde winst- en verliesrekening worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel66
  - number: '66.3'
    text: |-
      Indien het resultaat, bedoeld in het eerste lid, negatief is, wordt dit resultaat aangemerkt als een verlies. Dit
      verlies wordt onder toepassing van [hoofdstuk IV van de Wet op de vennootschapsbelasting 1969][ref1] verrekend met
      de positieve resultaten van de drie voorafgaande boekjaren en van de volgende boekjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002672
        hoofdstuk: IV
  - number: '67.1'
    text: |-
      Tot het in [artikel 66, eerste lid][ref1], bedoelde resultaat worden in ieder geval gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 67.1.a
    text: |-
      de waarde in het economische verkeer van de anders dan door verkoop aan het winningsbedrijf onttrokken
      koolwaterstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel67
  - number: 67.1.b
    text: de verschillen tussen de volgens goed koopmansgebruik gewaardeerde begin- en eindvoorraden;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel67
  - number: 67.1.c
    text: het resultaat dat is behaald met de verkoop van de winningsvergunning.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel67
  - number: '67.2'
    text: |-
      Tot het in [artikel 66, eerste lid][ref1], bedoelde resultaat worden in ieder geval gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 67.2.a
    text: |-
      de niet reeds ten laste van een andere winst- en verliesrekening gebrachte kosten van verkennings- en
      opsporingsonderzoeken die zijn verricht krachtens een opsporingsvergunning;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel67
  - number: 67.2.b
    text: |-
      afschrijving op de niet reeds ten laste van een andere winst- en verliesrekening gebrachte kosten, welke zijn
      gemaakt voordat de winningsvergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel67
  - number: '67.3'
    text: |-
      Tot het in [artikel 66, eerste lid][ref1], bedoelde resultaat worden niet gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 67.3.a
    text: |-
      afschrijving op de koopsom ter zake van de overname van een opsporingsvergunning, voorzover deze koopsom de door
      de overdrager van die vergunning nog niet reeds ten laste van een winst- en verliesrekening gebrachte kosten te
      boven gaat;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel67
  - number: 67.3.b
    text: de waarde van de in het winningsbedrijf gewonnen en verbruikte koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel67
  - number: '67.4'
    text: |-
      Indien door of aan de houder dan wel de medehouder voorwaarden worden overeengekomen of opgelegd die afwijken van
      de voorwaarden die in het economische verkeer door onafhankelijke partijen zouden zijn overeengekomen, wordt het
      in [artikel 66, eerste lid][ref1], bedoelde resultaat bepaald alsof die laatstbedoelde voorwaarden zouden zijn
      overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: '68.1'
    text: |-
      De winst- en verliesrekening, bedoeld in [artikel 66, eerste lid](onbekend),
      wordt opgemaakt met overeenkomstige toepassing van de [artikelen 3.8][ref1],
      [3.14, eerste lid, onderdelen b tot en met g, en derde tot en met zesde lid][ref2],
      [3.25 tot en met 3.39][ref3],[ 3.52][ref4], [3.53, eerste lid, onderdelen a en b, en tweede lid][ref5],
      [3.54][ref6], [3.56][ref7] en [3.57 van de Wet inkomstenbelasting 2001][ref8], alsmede de
      [artikelen 7, vierde en vijfde lid][ref9], [8, vierde lid][ref10], [9 tot en met 10b][ref11],
      [14 tot en met 14b][ref12] en [15d, van de Wet op de vennootschapsbelasting 1969][ref13], behoudens voorzover bij
      of krachtens deze wet anders is bepaald, dan wel uit het verschil in wezen tussen de houder dan wel de medehouder
      enerzijds en een natuurlijk persoon in de zin van de inkomstenbelasting respectievelijk een belastingplichtige voor
      de vennootschapsbelasting anderzijds, het tegendeel voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref9]: https://wetten.overheid.nl/BWBR0002672#Artikel7
      [ref10]: https://wetten.overheid.nl/BWBR0002672#Artikel8
      [ref11]: https://wetten.overheid.nl/BWBR0002672#Artikel9
      [ref12]: https://wetten.overheid.nl/BWBR0002672#Artikel14
      [ref13]: https://wetten.overheid.nl/BWBR0002672#Artikel15d
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref8
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref9
        bwb_id: BWBR0002672
        artikel: '7'
      - id: ref10
        bwb_id: BWBR0002672
        artikel: '8'
      - id: ref11
        bwb_id: BWBR0002672
        artikel: '9'
      - id: ref12
        bwb_id: BWBR0002672
        artikel: '14'
      - id: ref13
        bwb_id: BWBR0002672
        artikel: 15d
  - number: '68.2'
    text: |-
      Voor de toepassing van het eerste lid wordt in de genoemde artikelen van de [Wet inkomstenbelasting 2001][ref1] en
      van de [Wet op de vennootschapsbelasting 1969][ref2] voor «onderneming» gelezen: winningsbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002672
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002672
  - number: '68.3'
    text: |-
      Bij het opmaken van de winst- en verliesrekening, bedoeld in [artikel 66, eerste lid](onbekend), wordt een
      verhoging van 10% toegepast op de kosten met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel68
  - number: 68.3.a
    text: |-
      door de houder van de winningsvergunning aan de staat verschuldigde belastingen en andere Nederlandse
      publiekrechtelijke lasten;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel68
  - number: 68.3.b
    text: |-
      afschrijving op de koopsom ter zake van de overname van een winningsvergunning, voorzover deze koopsom de door de
      overdrager van die vergunning nog niet reeds ten laste van een winst- en verliesrekening gebrachte kosten te boven
      gaat;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel68
  - number: 68.3.c
    text: |-
      dotaties aan de voorziening ter zake van de uit een overgenomen winningsvergunning voortvloeiende
      ontmantelingsverplichting, voorzover reeds door de overdrager van die vergunning dotaties zijn gepleegd.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel68
  - number: '68.4'
    text: |-
      Voorzover bij of krachtens de [Wet inkomstenbelasting 2001][ref1] of de
      [Wet op de vennootschapsbelasting 1969][ref2] de bevoegdheid is verleend om bij algemene maatregel van bestuur
      onderscheidenlijk bij ministeriële regeling regels te stellen en het voor een goede afstemming van het eerste lid,
      op die regels nodig is om dit artikel aan te passen, kan bij algemene maatregel van bestuur, onderscheidenlijk bij
      ministeriële regeling van Onze Minister in overeenstemming met Onze Minister van Financiën, deze aanpassing worden
      geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002672
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002672
  - number: '69.1'
    text: Het tarief bedraagt 50%.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel69
  - number: '69.2'
    text: |-
      Het door de houder of de medehouder verschuldigde bedrag aan winstaandeel over een boekjaar wordt, voorzover
      mogelijk, verminderd met het op dat boekjaar betrekking hebbende verrekenbare bedrag dat wordt berekend op de in
      het derde lid aangegeven wijze. Indien niet het gehele verrekenbare bedrag in mindering kan worden gebracht, wordt
      het overschot opgeteld bij het verrekenbare bedrag over het volgende boekjaar. Indien het verrekenbare bedrag
      negatief is, wordt dit in mindering gebracht op het verrekenbare bedrag over het volgende boekjaar.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel69
  - number: '69.3'
    text: 'Onder het verrekenbare bedrag, bedoeld in het tweede lid, wordt verstaan het bedrag dat wordt verkregen door:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel69
  - number: 69.3.a
    text: |-
      het resultaat van de winst- en verliesrekening over het boekjaar te bepalen, met dien verstande dat daarbij
      [artikel 68, derde lid][ref1], buiten beschouwing wordt gelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel68
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '68'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 69.3.b
    text: |-
      dit resultaat te verminderen met het over het boekjaar na toepassing van dit artikel te betalen bedrag aan
      winstaandeel;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel69
  - number: 69.3.c
    text: op dit verschil het voor het boekjaar geldende tarief van de vennootschapsbelasting toe te passen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel69
  - number: '69.4'
    text: |-
      Het tweede lid is niet van toepassing indien de houder of de medehouder ter zake van het met het winningsbedrijf
      behaalde resultaat niet is onderworpen aan de Nederlandse belastingheffing.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel69
  - number: '70.1'
    text: Winstaandeel wordt geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel70
  - number: '70.2'
    text: |-
      De houder, of, ingeval van medehouderschap, ieder van de medehouders, zendt gelijktijdig met de aangifte
      voor de vennootschapsbelasting over een boekjaar aan de inspecteur een over dat boekjaar opgemaakte winst- en
      verliesrekening als bedoeld in [artikel 66, eerste lid][ref1], en een berekening van het op dat boekjaar betrekking
      hebbende verrekenbare bedrag, bedoeld in [artikel 69, tweede lid][ref2], alsmede een balans, vermeldende de aan het
      eind van het boekjaar tot het winningsbedrijf behorende activa en passiva.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel69
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '69'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: '71'
    text: De afdrachten, bedoeld in deze afdeling, worden geheven door de inspecteur en ingevorderd door de ontvanger.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel71
  - number: '72'
    text: |-
      Onverminderd het overigens bij of krachtens deze paragraaf bepaalde geschieden de heffing
      en de invordering van oppervlakterecht, cijns en winstaandeel met overeenkomstige toepassing
      van de [Algemene wet inzake rijksbelastingen][ref1], de [Invorderingswet 1990][ref2] en de
      [Kostenwet invordering rijksbelastingen][ref3] en de op die wetten berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
      - id: ref3
        bwb_id: BWBR0002645
  - number: '73.1'
    text: |-
      [Artikel 30f, eerste en derde lid, onderdeel a, van de Algemene wet inzake rijksbelastingen][ref1] is van
      overeenkomstige toepassing op de berekening van de heffingsrente met betrekking tot het winstaandeel.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30f
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30f
  - number: '73.2'
    text: |-
      [Artikel 30f, tweede en derde lid, onderdeel c, van de Algemene wet inzake rijksbelastingen][ref1] is
      van overeenkomstige toepassing op de berekening van de heffingsrente met betrekking tot de cijns en het
      oppervlakterecht.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30f
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30f
  - number: '74.1'
    text: |-
      De inspecteur en de ontvanger verstrekken desgevraagd aan Onze Minister kosteloos de voor de uitvoering van deze
      wet benodigde inlichtingen en gegevens.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel74
  - number: '74.2'
    text: |-
      De inspecteur en de ontvanger verlenen aan de door Onze Minister aangewezen personen toegang tot en inzage in alle
      gegevens die Onze Minister nodig heeft voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel74
  - number: '75'
    text: |-
      Op deze afdeling zijn de onderdelen a tot en met e van [artikel 54][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel54
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '54'
        hoofdstuk: '5'
        paragraaf: 5.1.1.1
        afdeling: 5.1.1
  - number: '76.1'
    text: |-
      De houder van een winningsvergunning die een terrein binnen een provincie in gebruik neemt voor het winnen van
      koolwaterstoffen, waarbij binnen het terrein voor het winnen benodigde mijnbouwwerken aanwezig zijn, is een
      eenmalige afdracht verschuldigd aan de provincie.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel76
  - number: '76.2'
    text: Bij medehouderschap is de afdracht verschuldigd door de aangewezen medehouder.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel76
  - number: '77.1'
    text: |-
      De heffingsmaatstaf van de afdracht, bedoeld in [artikel 76][ref1], is de oppervlakte van het in artikel 76, eerste
      lid, bedoelde terrein.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel76
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '76'
        hoofdstuk: '5'
        afdeling: 5.1.2
  - number: '77.2'
    text: |-
      Het tarief over 2003 bedraagt € 4,50 per vierkante meter. [Artikel 58, derde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel58
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '58'
        hoofdstuk: '5'
        paragraaf: 5.1.1.2
        afdeling: 5.1.1
  - number: '78'
    text: |-
      Gedeputeerde staten stellen de afdracht vast en maken het verschuldigde bedrag aan de houder of de aangewezen
      medehouder bekend.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel78
  - number: '79.1'
    text: |-
      Een afdracht aan de provincie wordt betaald binnen een maand na het tijdstip waarop de afdracht door gedeputeerde
      staten bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel79
  - number: '79.2'
    text: |-
      Onverminderd het bij of krachtens deze afdeling bepaalde geschieden de heffing en invordering met
      overeenkomstige toepassing van de [artikelen 11][ref1], [12][ref2], [14][ref3], [17, eerste lid][ref4],
      [28, eerste, vijfde en zesde lid][ref5], en [29 van de Invorderingswet 1990][ref6] met dien verstande dat
      gedeputeerde staten in de plaats treden van de ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel28
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel29
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '17'
      - id: ref5
        bwb_id: BWBR0004770
        artikel: '28'
      - id: ref6
        bwb_id: BWBR0004770
        artikel: '29'
  - number: '80'
    text: |-
      Indien een afdracht aan de provincie op een later tijdstip op een ander bedrag wordt vastgesteld,
      wordt bij die latere vaststelling de rentederving in rekening gebracht die voor de betrokkene of
      voor de provincie uit die latere vaststelling voortvloeit. Daarbij wordt een enkelvoudige rente in
      rekening gebracht, waarvan het percentage gelijk is aan het percentage van de heffingsrente, bedoeld in
      [artikel 30f, vijfde lid, van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30f
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30f
  - number: '81'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel81
  - number: 81.a
    text: |-
      de aangewezen vennootschap: de in de opsporingsvergunning door Onze Minister aangewezen naamloze vennootschap of
      besloten vennootschap met beperkte aansprakelijkheid waarvan alle aandelen middellijk of onmiddellijk behoren aan
      de staat;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel81
  - number: 81.b
    text: |-
      de overeenkomst: de overeenkomst tussen de vergunninghouder en de aangewezen vennootschap inzake het verrichten
      van opsporingswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel81
  - number: 81.c
    text: |-
      opsporingswerkzaamheden: werkzaamheden die op grond van een opsporingsvergunning voor de zeezijde, bedoeld in
      [artikel 54, onderdeel e](onbekend), worden of kunnen worden verricht of werkzaamheden die voortvloeien uit het
      doen van verkenningsonderzoeken naar de aanwezigheid van koolwaterstoffen binnen het vergunningsgebied, dan wel
      naar nadere gegevens omtrent die koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel81
  - number: '82'
    text: |-
      De in een opsporingsvergunning voor koolwaterstoffen aangewezen vennootschap verleent de door de houder van
      die opsporingsvergunning verlangde medewerking aan de totstandkoming van een overeenkomst, krachtens welke de
      vergunningshouder en de aangewezen vennootschap voor hun gezamenlijke rekening de opsporingswerkzaamheden zullen
      verrichten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel82
  - number: '83.1'
    text: |-
      De overeenkomst komt binnen een periode van zes maanden tot stand, ingaande op het tijdstip waarop de
      vergunninghouder een verzoek als bedoeld in [artikel 82](onbekend) heeft gedaan. Onze Minister kan de termijn van
      zes maanden eenmaal met ten hoogste zes maanden verlengen. De overeenkomst behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel83
  - number: '83.2'
    text: De overeenkomst kan niet worden gewijzigd of ontbonden dan na instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel83
  - number: '84'
    text: |-
      In de overeenkomst worden bepalingen opgenomen, die ertoe strekken dat ten behoeve van de opsporingswerkzaamheden
      wordt samengewerkt, waarbij:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel84
  - number: 84.a
    text: de vergunninghouder voor 60% en de aangewezen vennootschap voor 40% belang neemt;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel84
  - number: 84.b
    text: |-
      de werken die door het doen van de in [artikel 86, eerste lid, onderdeel a](onbekend), bedoelde investeringen tot
      stand zijn gekomen voor 60% toebehoren aan de vergunninghouder en voor 40% aan de aangewezen vennootschap;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel84
  - number: 84.c
    text: |-
      de vergunninghouder en de aangewezen vennootschap ten behoeve van de samenwerking, in verhouding tot ieders belang
      in de samenwerking, de middelen verstrekken die bestemd zijn voor het doen van de uitgaven, bedoeld in [artikel 86,
      eerste lid, onderdeel a](onbekend);
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel84
  - number: 84.d
    text: op de overeenkomst Nederlands recht van toepassing is.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel84
  - number: '85'
    text: 'In de overeenkomst worden bepalingen opgenomen die de vergunninghouder ertoe verplichten:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel85
  - number: 85.a
    text: |-
      de voor hem uit de vergunning voortvloeiende rechten uit te oefenen ten behoeve van de samenwerking en
      overeenkomstig de gezamenlijke besluiten die met inachtneming van [artikel 87](onbekend) zijn genomen door de
      vergunninghouder en de aangewezen vennootschap;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel85
  - number: 85.b
    text: |-
      het door hem aangaan, wijzigen of beëindigen van duurzame samenwerking met derden, ter zake van verkenning en
      opsporing te onderwerpen aan goedkeuring door de vergunninghouder en de aangewezen vennootschap gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel85
  - number: 85.c
    text: |-
      aan de samenwerking ten goede te doen komen zijn kennis en ervaring op het gebied van verkenning, opsporing,
      winning en afzet van koolwaterstoffen en daarmee samenhangende gebieden zoals het transport, de opslag en de
      behandeling daarvan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel85
  - number: '86.1'
    text: 'In de overeenkomst worden bepalingen opgenomen die de aangewezen vennootschap ertoe verplichten:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel86
  - number: 86.1.a
    text: |-
      aan de vergunninghouder te vergoeden 40% van de uitgaven van de vergunninghouder die in overeenstemming met
      [artikel 87](onbekend) zijn goedgekeurd of in overeenstemming zijn met een goedgekeurd jaarlijks investerings-
      en financieringsplan;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel86
  - number: 86.1.b
    text: niet te beletten dat besluiten van de vergunninghouder gebaseerd worden op normale commerciële overwegingen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel86
  - number: 86.1.c
    text: |-
      zijn stem bij de besluitvorming volgens [artikel 87](onbekend)uit te brengen op grond van transparante, objectieve
      en niet-discriminerende beginselen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel86
  - number: '86.2'
    text: |-
      In de overeenkomst worden bepalingen opgenomen die ertoe strekken dat ten aanzien van besluiten, inhoudende bij wie
      opdrachten worden geplaatst voor leveringen, voor de uitvoering van werken en voor het verrichten van diensten:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel86
  - number: 86.2.a
    text: |-
      de vergunninghouder niet verplicht is vooraf aan de aangewezen vennootschap informatie te geven over het te nemen
      besluit;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel86
  - number: 86.2.b
    text: de aangewezen vennootschap geen stem uitbrengt bij het nemen van het besluit.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel86
  - number: '87'
    text: 'In de overeenkomst worden bepalingen opgenomen die ertoe strekken dat:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel87
  - number: 87.a
    text: |-
      een gezamenlijk besluit van de vergunninghouder en de aangewezen vennootschap wordt genomen in een vergadering,
      waarin de vergunninghouder en de aangewezen vennootschap worden vertegenwoordigd door een aantal gevolmachtigde
      personen, in verhouding tot ieders belang in de samenwerking;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel87
  - number: 87.b
    text: |-
      een gezamenlijk besluit van de vergunninghouder en de aangewezen vennootschap, in afwijking van onderdeel a,
      buiten vergadering kan worden genomen, mits dit gebeurt bij een gezamenlijke schriftelijke verklaring of bij een
      gelijkluidende schriftelijke verklaring van de vergunninghouder en de aangewezen vennootschap, door deze of hun
      gevolmachtigde vertegenwoordigers ondertekend;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel87
  - number: 87.c
    text: |-
      een gezamenlijk besluit van de vergunninghouder en de aangewezen vennootschap, genomen met twee derden van de
      stemmen, welke overeenkomstig de overeenkomst kunnen worden uitgebracht, is vereist voor:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel87
  - number: 87.c.1°
    text: het jaarlijkse investerings- en financieringsplan;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel87
  - number: 87.c.2°
    text: |-
      niet in het jaarlijkse investerings- en financieringsplan opgenomen activiteiten en aanschaffingen, die een bedrag
      van € 500 000 te boven gaan;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel87
  - number: 87.c.3°
    text: de meerjarenplanning ten aanzien van opsporingswerkzaamheden binnen het vergunningsgebied.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel87
  - number: '88'
    text: |-
      De vergunninghouder neemt geen besluit, inhoudende bij wie opdrachten worden geplaatst voor leveringen, voor het
      uitvoeren van werken of voor het verrichten van diensten, indien aannemelijk is dat dit besluit leidt tot:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel88
  - number: 88.a
    text: financieel nadeel voor de staat, voorzover het betreft hetgeen ingevolge dit hoofdstuk verschuldigd is, of
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel88
  - number: 88.b
    text: tot financieel nadeel voor de aangewezen vennootschap.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel88
  - number: '89'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel89
  - number: 89.a
    text: |-
      de aangewezen vennootschap: de in de winningsvergunning door Onze Minister aangewezen naamloze vennootschap of
      besloten vennootschap met beperkte aansprakelijkheid waarvan alle aandelen middellijk of onmiddellijk behoren aan
      de staat;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel89
  - number: 89.b
    text: |-
      de overeenkomst: de overeenkomst tussen de vergunninghouder en de aangewezen vennootschap inzake het verrichten
      van mijnbouwwerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel89
  - number: 89.c
    text: |-
      mijnbouwwerkzaamheden: winnings- en opsporingswerkzaamheden die op grond van een winningsvergunning worden
      of kunnen worden verricht of werkzaamheden die voortvloeien uit het doen van verkenningsonderzoeken naar
      de aanwezigheid van koolwaterstoffen binnen het vergunningsgebied, dan wel naar nadere gegevens omtrent die
      koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel89
  - number: '90.1'
    text: |-
      De houder van een winningsvergunning voor koolwaterstoffen verleent de door Onze Minister verlangde medewerking aan
      de totstandkoming van een overeenkomst krachtens welke de vergunninghouder en de aangewezen vennootschap voor hun
      gezamenlijke rekening de mijnbouwwerkzaamheden zullen verrichten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel90
  - number: '90.2'
    text: |-
      Onze Minister kan bij de vergunningverlening bepalen dat het eerste lid niet geldt, indien hij reden heeft om aan
      te nemen dat de staat door de overeenkomst naar redelijke schatting financieel nadeel zal leiden.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel90
  - number: '91.1'
    text: |-
      De overeenkomst komt binnen een jaar na de verlening van de vergunning tot stand. Onze Minister kan de termijn van
      een jaar eenmaal met ten hoogste een jaar verlengen. De overeenkomst behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel91
  - number: '91.2'
    text: |-
      Tot het tijdstip waarop de instemming wordt verleend, verricht de vergunninghouder geen winningswerkzaamheden. Tot
      dat tijdstip behoeven besluiten als bedoeld in [artikel 95, tweede lid](onbekend), de instemming van de aangewezen
      vennootschap.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel91
  - number: '91.3'
    text: '[Artikel 83, tweede lid](onbekend), is van overeenkomstige toepassing.'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel91
  - number: '92.1'
    text: '[Artikel 84](onbekend) is van overeenkomstige toepassing.'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel92
  - number: '92.2'
    text: |-
      Voorts worden in de overeenkomst bepalingen opgenomen, die ertoe strekken dat ten behoeve van de
      mijnbouwwerkzaamheden wordt samengewerkt, waarbij:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel92
  - number: 92.2.a
    text: |-
      de uit de voorkomens gewonnen en beschikbare hoeveelheden koolwaterstoffen voor 60% toekomen aan de
      vergunninghouder en voor 40% aan de aangewezen vennootschap;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel92
  - number: 92.2.b
    text: |-
      zowel de vergunninghouder als de aangewezen vennootschap gerechtigd is het eigen aandeel in de gewonnen en
      beschikbare hoeveelheden koolwaterstoffen in natura op te nemen, met dien verstande dat zij ernaar streven zoveel
      mogelijk samen te werken bij de verkoop van de gewonnen en beschikbare hoeveelheden koolwaterstoffen uit de
      voorkomens;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel92
  - number: 92.2.c
    text: de vergunninghouder en de aangewezen vennootschap ten behoeve van de afzet regelmatig overleg plegen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel92
  - number: '92.3'
    text: 'In de overeenkomst wordt het bedrag vastgesteld van de door de vergunninghouder reeds gemaakte kosten:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel92
  - number: 92.3.a
    text: |-
      die naar redelijkheid kunnen worden toegeschreven aan de activiteiten die tot het aantreffen van het voorkomen
      hebben geleid;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel92
  - number: 92.3.b
    text: van de verdere evaluatie van dat voorkomen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel92
  - number: 92.3.c
    text: van investeringen ten behoeve van de mijnbouwwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel92
  - number: '93.1'
    text: '[Artikel 85](onbekend) is van overeenkomstige toepassing.'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel93
  - number: '93.2'
    text: 'Voorts worden in de overeenkomst bepalingen opgenomen die de vergunninghouder ertoe verplichten:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel93
  - number: 93.2.a
    text: |-
      zorg te dragen dat de werken die voor de totstandkoming van de overeenkomst tot stand zijn gekomen binnen het
      vergunningsgebied, voor 60% gaan toebehoren aan de vergunninghouder en voor 40% gaan toebehoren aan de aangewezen
      vennootschap;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel93
  - number: 93.2.b
    text: |-
      de aangewezen vennootschap tijdig in te lichten en in staat te stellen om een belang tot een percentage van 40
      te nemen in te treffen regelingen die verband houden met de winning en de afzet van de gewonnen koolwaterstoffen,
      zoals het transport, de opslag en de behandeling daarvan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel93
  - number: '94.1'
    text: '[Artikel 86](onbekend) is van overeenkomstige toepassing.'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel94
  - number: '94.2'
    text: |-
      Voorts wordt in de overeenkomst een bepaling opgenomen die de aangewezen vennootschap ertoe verplicht aan
      de vergunninghouder terstond te vergoeden 40% van het bedrag, bedoeld in [artikel 92, derde lid](onbekend),
      vermeerderd met een enkelvoudige rente, waarvan het percentage gelijk is aan dat van de wettelijke rente, over een
      tijdvak van ten hoogste vijf jaar, te rekenen vanaf het tijdstip waarop de desbetreffende kosten zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel94
  - number: '94.3'
    text: |-
      Het tweede lid blijft buiten toepassing, voorzover de aangewezen vennootschap in het kader van een overeenkomst als
      bedoeld in [artikel 82](onbekend), de in [artikel 92, derde lid](onbekend), bedoelde kosten reeds heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel94
  - number: '95.1'
    text: '[Artikel 87, onderdelen a en b](onbekend), is van overeenkomstige toepassing.'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel95
  - number: '95.2'
    text: |-
      Voorts worden in de overeenkomst bepalingen opgenomen die ertoe strekken dat een gezamenlijk besluit van de
      vergunninghouder en de aangewezen vennootschap, genomen met twee derden van de stemmen, welke overeenkomstig de
      overeenkomst kunnen worden uitgebracht, is vereist voor:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel95
  - number: 95.2.1°
    text: het jaarlijkse investerings- en financieringsplan;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel95
  - number: 95.2.2°
    text: |-
      niet in het jaarlijkse investerings- en financieringsplan opgenomen activiteiten en aanschaffingen, die een bedrag
      van € 500 000 te boven gaan;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel95
  - number: 95.2.3°
    text: de meerjarenplanning ten aanzien van mijnbouwwerkzaamheden binnen het vergunningsgebied;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel95
  - number: 95.2.4°
    text: |-
      het de vergunninghouder toestaan dat overeenkomstig het beperkte doel van de samenwerking een deel van de
      mijnbouwwerkzaamheden niet of niet langer zal geschieden voor rekening van de vergunninghouder en de aangewezen
      vennootschap gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel95
  - number: 95.2.5°
    text: het aangaan van verplichtingen tot levering van koolwaterstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel95
  - number: 95.2.6°
    text: besluiten inzake het vervoer van gewonnen koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel95
  - number: '96'
    text: '[Artikel 88](onbekend) is van overeenkomstige toepassing.'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel96
  - number: '97'
    text: |-
      Indien na de toepassing van [artikel 90, tweede lid](onbekend), in een ander voorkomen in het vergunningsgebied
      koolwaterstoffen worden aangetoond, kan Onze Minister besluiten dat alsnog een overeenkomst als bedoeld in
      het [eerste lid van dat artikel](onbekend) moet worden afgesloten. Deze afdeling is op die overeenkomst van
      overeenkomstige toepassing, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel97
  - number: 97.a
    text: de overeenkomst slechts betrekking heeft op dit andere voorkomen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel97
  - number: 97.b
    text: de overeenkomst tot stand komt binnen een jaar na het besluit van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel97
  - number: '98.1'
    text: |-
      De houder van een vergunning tot het winnen van andere delfstoffen dan koolwaterstoffen en de houder van een
      vergunning tot het winnen van aardwarmte zijn jaarlijks een afdracht verschuldigd aan de staat, voorzover dit in
      aan de vergunning verbonden voorschriften is bepaald. De afdracht wordt afgestemd op de omvang van of de voordelen
      behaald met het winnen en de daarmee samenhangende activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel98
  - number: '98.2'
    text: |-
      De houder van een opslagvergunning is jaarlijks een afdracht verschuldigd aan de staat, voorzover dit in aan de
      vergunning verbonden voorschriften is bepaald. De afdracht wordt afgestemd op de omvang van of de voordelen behaald
      met het opslaan en de daarmee samenhangende activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel98
  - number: '98.3'
    text: |-
      De houder van een vergunning als bedoeld in het eerste of tweede lid die een terrein binnen een provincie in
      gebruik heeft, waarbinnen voor het winnen of het opslaan benodigde mijnbouwwerken aanwezig zijn, is een eenmalige
      afdracht verschuldigd aan de provincie, voorzover dit in aan de vergunning verbonden voorschriften is bepaald. De
      afdracht wordt afgestemd op de regeling in [afdeling 5.1.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        afdeling: 5.1.2
  - number: '98.4'
    text: |-
      Indien de vergunning wordt gehouden door meer dan een natuurlijke persoon of rechtspersoon, wordt in aan de
      vergunning te verbinden voorschriften bepaald in hoeverre ieder van deze personen een afdracht als bedoeld in het
      eerste tot en met derde lid verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel98
  - number: '99'
    text: |-
      [Afdeling 5.2.2][ref1], met uitzondering van [artikel 92, tweede lid, onderdeel a][ref2], is van overeenkomstige
      toepassing, indien een opslagvergunning is verleend aan de houder van een winningsvergunning voor koolwaterstoffen,
      waar [artikel 90, eerste lid][ref3], op van toepassing is en indien de opslagvergunning en de winningsvergunning
      gelden voor hetzelfde voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel92
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel90
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        afdeling: 5.2.2
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '92'
        hoofdstuk: '5'
        afdeling: 5.2.2
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '90'
        hoofdstuk: '5'
        afdeling: 5.2.2
  - number: '100.1'
    text: |-
      Een afdracht als bedoeld in [artikel 98, eerste lid][ref1], aan de staat of een vooruitbetaling op een afdracht
      wordt betaald binnen een maand na het tijdstip waarop de afdracht of de vooruitbetaling verschuldigd is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel98
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '98'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: '100.2'
    text: |-
      Onverminderd het bij of krachtens deze afdeling bepaalde geschieden de heffing en invordering van
      een afdracht als bedoeld in [artikel 98, eerste lid][ref1], met overeenkomstige toepassing van de
      [artikelen 11][ref2], [12][ref3], [14][ref4], [17, eerste lid][ref5],[ 25, eerste en tweede lid][ref6],
      [28, eerste, tweede, vijfde en zesde lid][ref7], en [29 van de Invorderingswet 1990][ref8] met dien verstande dat
      Onze Minister in de plaats treedt van de ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref7]: https://wetten.overheid.nl/BWBR0004770#Artikel28
      [ref8]: https://wetten.overheid.nl/BWBR0004770#Artikel29
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '98'
        hoofdstuk: '5'
        afdeling: '5.3'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '14'
      - id: ref5
        bwb_id: BWBR0004770
        artikel: '17'
      - id: ref6
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref7
        bwb_id: BWBR0004770
        artikel: '28'
      - id: ref8
        bwb_id: BWBR0004770
        artikel: '29'
  - number: '100.3'
    text: |-
      Een afdracht als bedoeld in [artikel 98, tweede lid][ref1], wordt geheven en ingevorderd met toepassing van
      [paragraaf 5.1.1.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '98'
        hoofdstuk: '5'
        afdeling: '5.3'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.1.1.5
        afdeling: 5.1.1
  - number: '101.1'
    text: |-
      Indien een afdracht als bedoeld in [artikel 98, eerste lid][ref1], aan de staat of een vooruitbetaling op
      een afdracht als bedoeld in [artikel 98, eerste lid][ref2], op een later tijdstip op een ander bedrag wordt
      vastgesteld, wordt bij die latere vaststelling de rentederving in rekening gebracht die voor de betrokkene of voor
      de staat uit die latere vaststelling voortvloeit. Daarbij wordt een enkelvoudige rente in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel98
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '98'
        hoofdstuk: '5'
        afdeling: '5.3'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '98'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: '101.2'
    text: |-
      Aan de betrokkene wordt een enkelvoudige rente in rekening gebracht over het bedrag waarvoor overeenkomstig
      [artikel 25 van de Invorderingswet 1990][ref1] uitstel van betaling is verleend. De rente wordt berekend over het
      tijdvak waarvoor uitstel is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: '101.3'
    text: |-
      Het percentage van de rente, bedoeld in het eerste en het tweede lid, is gelijk aan het percentage van de
      heffingsrente, bedoeld in [artikel 30f, vijfde lid, van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30f
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30f
  - number: '101.4'
    text: |-
      Een rente, bedoeld in het eerste en het tweede lid, is aan de staat verschuldigd met ingang van de dag na die
      waarop de vaststelling aan de betrokkene bekend is gemaakt. [Artikel 100][ref1] is van overeenkomstige toepassing
      ten aanzien van de betaling en de invordering van deze rente.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel100
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '100'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: '102.1'
    text: |-
      Voorzover twijfel bestaat of degene die ingevolge dit hoofdstuk een afdracht aan de staat verschuldigd zal worden
      deze zal voldoen, kan Onze Minister bepalen dat de betrokkene zekerheid stelt voor de voldoening van de afdracht.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel102
  - number: '102.2'
    text: |-
      Het bedrag en de termijn waarvoor en het tijdstip en de wijze waarop de zekerheid wordt gesteld, dienen ten
      genoegen van Onze Minister te zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel102
  - number: '102.3'
    text: |-
      De verplichtingen van dit artikel blijven na afloop van de vergunning van kracht, tenzij eerder aan de
      betalingsverplichtingen is voldaan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel102
  - number: '103.1'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen in ieder geval nadere regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel103
  - number: 103.1.a
    text: de uitvoering van dit hoofdstuk;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel103
  - number: 103.1.b
    text: afdrachten in verband met andere vergunningen dan die tot het opsporen en het winnen van koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel103
  - number: '103.2'
    text: |-
      De voordracht voor een krachtens het eerste lid, onderdeel b, vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel103
  - number: '104'
    text: |-
      Dit hoofdstuk is niet van toepassing ten aanzien van vergunningen als bedoeld in [artikel 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '105.1'
    text: Er is een Mijnraad.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel105
  - number: '105.2'
    text: |-
      De Mijnraad heeft tot taak om in verband met het opsporen of winnen van delfstoffen of aardwarmte, dan wel het
      opslaan van stoffen:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel105
  - number: 105.2.a
    text: Onze Minister desgevraagd te adviseren over door hem te geven beschikkingen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel105
  - number: 105.2.b
    text: |-
      Onze Minister desgevraagd de inlichtingen te verstrekken die nodig zijn voor de beoordeling van de uitvoerbaarheid
      van voorgenomen wettelijke voorschriften en algemene beleidsvoornemens.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel105
  - number: '105.3'
    text: |-
      Onze Minister vraagt in elk geval advies aan de Mijnraad inzake door hem te geven beschikkingen inzake verlening of
      intrekking van vergunningen als bedoeld in [artikel 6](onbekend) of [25](onbekend).
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel105
  - number: '106.1'
    text: De Mijnraad bestaat uit een voorzitter en ten hoogste negen andere leden.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel106
  - number: '106.2'
    text: |-
      De voorzitter en de andere leden van de Mijnraad worden door Onze Minister benoemd, geschorst en ontslagen. De raad
      kan uit zijn midden ondervoorzitters aanwijzen. De benoeming van de leden geschiedt op grond van hun deskundigheid
      op gebieden die van belang zijn voor de mijnbouw en met de mijnbouw verwante activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel106
  - number: '106.3'
    text: |-
      De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan telkens voor ten hoogste vier jaar
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel106
  - number: '107.1'
    text: De Mijnraad heeft een secretariaat, dat bestaat uit een of meer door Onze Minister aan te wijzen personen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel107
  - number: '107.2'
    text: |-
      De aangewezen personen zijn voor hun werkzaamheden voor de Mijnraad uitsluitend verantwoording schuldig aan de
      raad.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel107
  - number: '108'
    text: |-
      Leden van de Mijnraad onthouden zich van stemming over een advies, indien dit een zaak betreft waarbij zij
      persoonlijk belang hebben.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel108
  - number: '109.1'
    text: De Mijnraad stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel109
  - number: '109.2'
    text: Het bestuursreglement en de daarin aangebrachte wijzigingen behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel109
  - number: '110'
    text: |-
      De Mijnraad stelt jaarlijks voor 1 juli een verslag op van de werkzaamheden en de doelmatigheid en doeltreffendheid
      van zijn werkzaamheden en werkwijze in het afgelopen kalenderjaar. Het verslag wordt aan Onze Minister toegezonden.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel110
  - number: '111'
    text: |-
      De Mijnraad verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voorzover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel111
  - number: '112'
    text: |-
      Het beheer van de bescheiden betreffende de werkzaamheden van de Mijnraad geschiedt op overeenkomstige wijze als
      bij het Ministerie van Economische Zaken. De bescheiden worden na beëindiging van de werkzaamheden van de raad
      opgeborgen in het archief van dat ministerie.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel112
  - number: '113'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel113
  - number: 113.a
    text: 'commissie: Technische commissie bodembeweging;'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel113
  - number: 113.b
    text: |-
      mijnbouwactiviteiten: activiteiten als bedoeld in de [artikelen 1, onderdeel d tot en met i][ref1], en [51][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel51
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 113.c
    text: 'mijnbouwondernemer: natuurlijke persoon of rechtspersoon die mijnbouwactiviteiten verricht.'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel113
  - number: '114.1'
    text: Er is een Technische commissie bodembeweging.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel114
  - number: '114.2'
    text: |-
      De commissie heeft tot taak om in verband met de gevolgen van mijnbouwactiviteiten voor beweging van de aardbodem
      en schade die daarvan het gevolg kan zijn:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel114
  - number: 114.2.a
    text: Onze Minister desgevraagd te adviseren over door hem te geven beschikkingen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel114
  - number: 114.2.b
    text: |-
      Onze Minister desgevraagd de inlichtingen te verstrekken die nodig zijn voor de beoordeling van de uitvoerbaarheid
      van voorgenomen wettelijke voorschriften;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel114
  - number: 114.2.c
    text: |-
      degene bij wie schade is te verwachten door bodembeweging die redelijkerwijs het gevolg kan zijn van
      mijnbouwactiviteiten, desgevraagd kosteloos inlichtingen te verstrekken omtrent het verband tussen de bodembeweging
      en de mijnbouwactiviteiten;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel114
  - number: 114.2.d
    text: |-
      degene bij wie zaakschade is opgetreden door bodembeweging die redelijkerwijs het gevolg kan zijn van
      mijnbouwactiviteiten, desgevraagd advies te geven omtrent het verband tussen die schade en de mijnbouwactiviteiten
      alsmede de hoogte van het schadebedrag.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel114
  - number: '114.3'
    text: |-
      Onze Minister vraagt in elk geval advies aan de commissie voordat hij op grond van [artikel 46](onbekend) een
      bedrag waarvoor zekerheid moet worden gesteld, vaststelt of wijzigt.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel114
  - number: '115.1'
    text: De Technische commissie bodembeweging bestaat uit een voorzitter en ten hoogste negen andere leden.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel115
  - number: '115.2'
    text: |-
      De voorzitter en de andere leden van de commissie worden door Onze Minister benoemd, geschorst en ontslagen. De
      benoeming van de leden geschiedt op grond van hun deskundigheid op gebieden die van belang zijn voor de mijnbouw en
      met de mijnbouw verwante activiteiten. De commissie kan uit zijn midden ondervoorzitters aanwijzen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel115
  - number: '115.3'
    text: |-
      De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan telkens voor ten hoogste vier jaar
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel115
  - number: '116.1'
    text: |-
      Alvorens de commissie om advies als bedoeld in [artikel 114, tweede lid, onderdeel d][ref1], wordt gevraagd,
      stelt degene die schade heeft geleden die naar zijn mening aan een mijnbouwondernemer kan worden toegerekend,
      deze schriftelijk aansprakelijk onder vordering van schadevergoeding. De aansprakelijkstelling geschiedt binnen
      drie maanden na het moment waarop de benadeelde bekend is geworden of redelijkerwijs bekend had kunnen zijn met
      de schade.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel114
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '114'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '116.2'
    text: |-
      De in het eerste lid bedoelde benadeelde kan de commissie om advies verzoeken, indien binnen drie maanden na de
      datum van verzending van de aansprakelijkheidstelling geen overeenstemming is bereikt met de mijnbouwondernemer
      over vergoeding van de schade.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel116
  - number: '116.3'
    text: |-
      Een adviesaanvraag wordt uiterlijk binnen een maand na het verstrijken van de termijn, genoemd in het tweede lid,
      ingediend bij de commissie. De commissie kan op verzoek van de benadeelde of de betrokken mijnbouwondernemer de
      termijn verlengen met een door haar te bepalen periode.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel116
  - number: '116.4'
    text: |-
      Indien de benadeelde in onzekerheid verkeert tot welke mijnbouwondernemer de aansprakelijkstelling moet worden
      gericht, verstrekt de commissie, voorzover haar bekend, hem naam en adres van de bedoelde onderneming.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel116
  - number: '117.1'
    text: |-
      Van de adviesaanvrager, bedoeld in [artikel 114, tweede lid, onderdeel d][ref1], wordt door het secretariaat van de
      commissie een bijdrage geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel114
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '114'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '117.2'
    text: 'De bijdrage is: € 90 voor een natuurlijk persoon, en € 181 voor andere dan onder a bedoelde personen.'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel117
  - number: '117.3'
    text: |-
      Het advies wordt in behandeling genomen nadat de aanvrager het verschuldigde bedrag op een door het secretariaat te
      bepalen wijze heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel117
  - number: '117.4'
    text: |-
      Indien uit het advies blijkt dat de schade geheel of gedeeltelijk kan worden toegerekend aan mijnbouwactiviteiten,
      wordt de bijdrage terugbetaald aan de aanvrager. Dit geldt uitsluitend als het bedrag, genoemd in het advies
      van de commissie, hoger is dan het bedrag dat de mijnbouwondernemer bereid was te betalen naar aanleiding van de
      aansprakelijkstelling, bedoeld in [artikel 116][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel116
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '116'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '117.5'
    text: |-
      De in het tweede lid genoemde bedragen kunnen bij ministeriële regeling worden gewijzigd voorzover de
      consumentenprijsindex daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel117
  - number: '118.1'
    text: |-
      De commissie neemt een adviesaanvraag niet in behandeling, indien er kennelijk geen verband bestaat tussen de
      schade en de mijnbouwactiviteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel118
  - number: '118.2'
    text: |-
      Indien de commissie een adviesaanvraag in behandeling neemt, zendt zij afschrift van de adviesaanvraag aan de
      betrokken mijnbouwondernemer. Deze kan desgewenst binnen een maand na de datum van verzending schriftelijk reageren
      op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel118
  - number: '119.1'
    text: |-
      De commissie stelt onderzoek in naar het oorzakelijk verband tussen de verrichte mijnbouwactiviteiten en de schade,
      alsmede naar de hoogte van het schadebedrag. Zij kan deskundigen opdracht verlenen onderzoek te verrichten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel119
  - number: '119.2'
    text: |-
      De commissie brengt binnen drie, doch uiterlijk binnen zes maanden na het moment waarop de adviesaanvraag is
      ingediend, een voorlopig advies uit aan de adviesaanvrager en de mijnbouwondernemer.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel119
  - number: '119.3'
    text: |-
      De adviesaanvrager en de mijnbouwondernemer kunnen schriftelijk bedenkingen inbrengen tegen het voorlopig advies
      binnen een maand na de datum van verzending van het voorlopig advies.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel119
  - number: '119.4'
    text: De commissie stelt vervolgens een definitief advies vast.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel119
  - number: '119.5'
    text: |-
      Het advies bevat een oordeel over het oorzakelijk verband tussen de verrichte mijnbouwactiviteiten en de schade,
      alsmede de hoogte van het schadebedrag.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel119
  - number: '120.1'
    text: |-
      De commissie kan van de mijnbouwondernemer alle inlichtingen vorderen die zij nodig acht ter uitvoering van de haar
      in [artikel 114, tweede lid](onbekend), opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel120
  - number: '120.2'
    text: |-
      De mijnbouwondernemer verstrekt de commissie binnen een door haar gestelde redelijke termijn de gewenste
      inlichtingen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel120
  - number: '120.3'
    text: |-
      Indien de commissie inlichtingen heeft verkregen ter uitvoering van de taak, bedoeld in [artikel 114, tweede lid,
      onderdeel d](onbekend), verstrekt zij deze aan de adviesaanvrager, tenzij sprake is van gegevens als bedoeld in
      [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '121'
    text: |-
      De artikelen [107 tot en met 112][ref1] zijn van overeenkomstige toepassing op de Technische commissie
      bodembeweging.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel107
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '107'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '122'
    text: |-
      Bij ministeriële regeling worden in elk geval nadere regels gesteld omtrent de bij de adviesaanvraag
      te verstrekken gegevens en kunnen nadere regels worden gesteld omtrent de adviesprocedure, bedoeld in
      [artikel 114, tweede lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel114
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '114'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '123.1'
    text: |-
      Degene die activiteiten verricht waarop het bij en krachtens [artikel 49, eerste lid][ref1],
      [artikel 51, eerste lid][ref2], of [52, eerste lid][ref3], bepaalde van toepassing is verstrekt aan Onze Minister
      de op grond van het vijfde lid bepaalde gegevens, voorzover de betrokkene in verband met die activiteiten in het
      bezit van deze gegevens is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel52
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '123.2'
    text: |-
      Onze Minister kan de verstrekte gegevens, of een deel van die gegevens, doen beheren door door hem daartoe aan te
      wijzen instellingen, welke hem desgevraagd mede van advies dienen aan de hand van die gegevens.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel123
  - number: '123.3'
    text: |-
      De verstrekte gegevens zijn gegevens als bedoeld in
      [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '123.4'
    text: |-
      De op grond van het vijfde lid, onderdeel c, aangewezen gegevens verliezen op een op
      grond van dat onderdeel bepaald tijdstip hun vertrouwelijk karakter. Na dit tijdstip is
      [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref1] niet meer van toepassing op deze
      aangewezen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '123.5'
    text: 'Bij of krachtens algemene maatregel van bestuur worden:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel123
  - number: 123.5.a
    text: de gegevens bepaald die aan Onze Minister worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel123
  - number: 123.5.b
    text: |-
      regels gesteld omtrent het tijdstip en de wijze waarop de gegevens worden verstrekt, omtrent het beheer van de
      gegevens en omtrent het gebruik dat van de gegevens kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel123
  - number: 123.5.c
    text: |-
      regels gesteld omtrent het tijdstip waarop
      [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref1] niet meer van toepassing is op
      deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '123.6'
    text: Dit artikel is van overeenkomstige toepassing op bescheiden en monsters.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel123
  - number: '124.1'
    text: 'Onze Minister zendt aan de Commissie van de Europese Gemeenschappen ieder jaar een verslag met gegevens over:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel124
  - number: 124.1.a
    text: de gebieden die voor het opsporen en winnen van koolwaterstoffen zijn vrijgegeven;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel124
  - number: 124.1.b
    text: de verleende vergunningen voor koolwaterstoffen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel124
  - number: 124.1.c
    text: de houders van de verleende vergunningen voor koolwaterstoffen en de samenstelling van die houders;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel124
  - number: 124.1.d
    text: de geraamde reserves aan koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel124
  - number: '124.2'
    text: |-
      Onze Minister zendt het in het eerste lid bedoelde verslag tevens aan de beide kamers der Staten-Generaal en legt
      het voor een ieder ter inzage. Hij doet van deze terinzagelegging mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel124
  - number: '125.1'
    text: Onze Minister zendt tweejaarlijks aan de beide kamers der Staten-Generaal een overzicht van aardgasactiviteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel125
  - number: '125.2'
    text: 'Het overzicht bevat tenminste:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel125
  - number: 125.2.a
    text: |-
      de aangevraagde, dan wel de verleende opsporings- en winningsvergunningen voorzover deze betrekking hebben op het
      opsporen of winnen van aardgas;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel125
  - number: 125.2.b
    text: 'de opgespoorde aardgasvoorkomens waarbij wordt aangegeven:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel125
  - number: 125.2.b.1°
    text: in welke vergunningsgebieden deze voorkomens zijn opgespoord en
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel125
  - number: 125.2.b.2°
    text: of uit deze voorkomens aardgas wordt gewonnen en zo niet, wanneer daarmee wordt aangevangen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel125
  - number: 125.2.c
    text: |-
      de omvang van de opgespoorde en overige aardgasreserves waarbij de aardgasreserves die in geologisch of geografisch
      opzicht met elkaar samenhangen afzonderlijk worden vermeld;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel125
  - number: 125.2.d
    text: |-
      een raming van de winning van aardgas per vergunninggebied, dan wel gebieden die in geologisch of geografisch
      opzicht met elkaar samenhangen over een periode van tien jaar, aanvangend met het jaar waarin het overzicht aan de
      beide kamers der Staten-Generaal wordt gezonden;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel125
  - number: 125.2.e
    text: de bestaande en toekomstige faciliteiten voor de ondergrondse opslag van aardgas;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel125
  - number: 125.2.f
    text: |-
      de winningsplannen, als bedoeld in [artikel 34](onbekend), die zijn ingediend en waarvoor de instemming van Onze
      Minister is gegeven.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel125
  - number: '126.1'
    text: Er is een Staatstoezicht op de mijnen. Het Staatstoezicht op de mijnen ressorteert onder Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel126
  - number: '126.2'
    text: Aan het hoofd van het Staatstoezicht op de mijnen staat de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel126
  - number: '127'
    text: |-
      Het Staatstoezicht op de mijnen heeft tot taak het toezien op het verrichten van verkenningsonderzoeken, op het
      opsporen en het winnen van delfstoffen en aardwarmte en op het opslaan van stoffen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel127
  - number: '128.1'
    text: |-
      De inspecteur-generaal der mijnen brengt jaarlijks voor 1 mei aan Onze Minister verslag uit over de werkzaamheden
      van het Staatstoezicht op de mijnen in het afgelopen jaar.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel128
  - number: '128.2'
    text: |-
      De inspecteur-generaal der mijnen doet in het verslag de aanbevelingen die hij wenselijk acht met het oog op een
      doelmatige en voortvarende uitvoering in de toekomst van de in [artikel 127](onbekend) genoemde activiteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel128
  - number: '129.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister daartoe aangewezen ambtenaren van het Staatstoezicht op de mijnen, voorzover niet op grond van [artikel
      131](onbekend) het toezicht aan anderen is opgedragen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel129
  - number: '129.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel129
  - number: '130'
    text: |-
      In respectievelijk op bij of krachtens algemene maatregel van bestuur te bepalen gevallen en wijze kan de
      houder van een vergunning als bedoeld in [artikel 6](onbekend) of [25](onbekend) dan wel degene die een
      verkenningsonderzoek uitvoert of voornemens is uit te voeren, worden verplicht de in de [artikelen 129](onbekend)
      en[ 131](onbekend) bedoelde ambtenaren bij de uitoefening van hun bevoegdheden te vervoeren naar door deze
      ambtenaren aan te duiden plaatsen waar met gebruikmaking van de vergunning activiteiten worden of zullen worden
      uitgevoerd dan wel waar een verkenningsonderzoek wordt of zal worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel130
  - number: '131.1'
    text: |-
      Bij besluit van Onze Minister kunnen andere ambtenaren worden aangewezen die zijn belast met het toezicht op de
      naleving van het bepaalde bij of krachtens deze wet, voorzover het toezicht bepaalde in het besluit aangegeven
      gevallen betreft.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel131
  - number: '131.2'
    text: |-
      Onze Minister wijst ambtenaren die onder een van Onze andere Ministers ressorteren niet aan, dan in overeenstemming
      met Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel131
  - number: '131.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel131
  - number: '132'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel132
  - number: '133.1'
    text: Overtreding van [artikel 43, tweede lid](onbekend), wordt gestraft met geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel133
  - number: '133.2'
    text: Het in dit artikel strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel133
  - number: '134.1'
    text: |-
      Onder de in dit hoofdstuk gebruikte begrippen wordt verstaan hetgeen daaronder wordt verstaan in
      [artikel 113][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel113
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '113'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '134.2'
    text: |-
      Dit hoofdstuk is van toepassing op mijnbouwondernemers voorzover deze mijnbouwactiviteiten verrichten aan de
      landzijde van de in de bijlage bij deze wet vastgelegde lijn.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel134
  - number: '135.1'
    text: Er is een Waarborgfonds mijnbouwschade.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: '135.2'
    text: Het waarborgfonds bezit rechtspersoonlijkheid en is gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: '135.3'
    text: Onze Minister is belast met het beheer van het waarborgfonds.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: '135.4'
    text: 'Het waarborgfonds ontvangt:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: 135.4.a
    text: |-
      een door een mijnbouwondernemer jaarlijks verschuldigde bijdrage, op te leggen door Onze Minister, met inachtneming
      van bij algemene maatregel van bestuur te stellen regels;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: 135.4.b
    text: rentebaten die via het waarborgfonds zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: 135.4.c
    text: het batig saldo van de laatstelijk afgesloten rekening van het waarborgfonds;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: 135.4.d
    text: andere inkomsten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: '135.5'
    text: 'Bij algemene maatregel van bestuur worden in elk geval regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: 135.5.a
    text: 'de maatstaf ter bepaling van de hoogte van de bijdrage, met inachtneming van:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: 135.5.a.1°
    text: |-
      de omvang van de mijnbouwactiviteiten van een mijnbouwondernemer aan de landzijde van de in de bijlage bij deze wet
      vastgelegde lijn,
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: 135.5.a.2°
    text: |-
      de hoogte van de schadevergoedingen die de vijf voorafgaande jaren ten laste van het waarborgfonds zijn toegekend
      in verband met mijnbouwactiviteiten van de desbetreffende mijnbouwondernemer of diens rechtsvoorganger,
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: 135.5.a.3°
    text: de aard van de desbetreffende mijnbouwactiviteiten, en
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: 135.5.a.4°
    text: de in het waarborgfonds aanwezige baten in relatie tot de begrote uitgaven;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: 135.5.b
    text: het tijdstip waarop de bijdrage verschuldigd wordt, en
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: 135.5.c
    text: de verschuldigdheid van rente als de bijdrage op een later tijdstip op een ander bedrag wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: '135.6'
    text: Niet in het jaar van ontvangst bestede gelden blijven in het waarborgfonds.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: '135.7'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent het vermogen van het waarborgfonds, mede met
      inachtneming van het totale bedrag aan schadevergoedingen dat mijnbouwondernemers gedurende in elk geval de
      laatste vijf jaar voorafgaande aan het tijdstip van inwerkingtreding van deze wet hebben betaald aan natuurlijke
      personen bij wie in die periode zaakschade is opgetreden als gevolg van door die mijnbouwondernemers verrichte
      mijnbouwactiviteiten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel135
  - number: '136.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de inrichting en de
      administratie van het waarborgfonds, alsmede het daarop uit te oefenen toezicht.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel136
  - number: '136.2'
    text: |-
      Onze Minister doet jaarlijks verslag aan beide kamers der Staten-Generaal omtrent het over het waarborgfonds
      gevoerde beheer.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel136
  - number: '137'
    text: |-
      Onze Minister kent een natuurlijke persoon bij wie zaakschade is opgetreden als gevolg van mijnbouwactiviteiten op
      diens verzoek een schadevergoeding toe ten laste van het waarborgfonds, indien:
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel137
  - number: 137.a
    text: |-
      de betrokken mijnbouwondernemer failliet is verklaard, surséance van betaling is verleend of ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, of
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel137
  - number: 137.b
    text: de betrokken mijnbouwondernemer heeft opgehouden te bestaan of is overleden, en
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel137
  - number: 137.c
    text: de schade niet reeds geheel of gedeeltelijk uit anderen hoofde is vergoed.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel137
  - number: '138.1'
    text: |-
      Indien op het moment waarop zich een van de gebeurtenissen, genoemd in [137, onderdeel a of b][ref1],
      voordoet de persoon, bedoeld in de aanhef van dat artikel nog geen adviesaanvraag als bedoeld in
      [artikel 114, tweede lid, onderdeel d][ref2], had ingediend, dient die persoon alsnog een aanvraag in:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel114
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '137'
        hoofdstuk: '9'
        paragraaf: '9.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '114'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 138.1.a
    text: uiterlijk drie maanden na het moment waarop de desbetreffende gebeurtenis zich heeft voorgedaan, of,
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel138
  - number: 138.1.b
    text: |-
      als hij op dat moment nog niet met de schade bekend kon zijn, binnen drie maanden na het moment waarop hij met de
      schade bekend is geworden of redelijkerwijs bekend had kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel138
  - number: '138.2'
    text: |-
      De artikelen [117 tot en met 119][ref1] zijn van toepassing, met dien verstande dat de
      [artikelen 118, tweede lid][ref2], en [119, tweede en derde lid][ref3], voorzover betrekking hebbend op de
      mijnbouwondernemer, buiten toepassing blijven. De commissie zendt Onze Minister afschriften van de adviesaanvraag
      en het voorlopig advies.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel118
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel119
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '117'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '118'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '119'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '139.1'
    text: |-
      De persoon, bedoeld in [artikel 137][ref1], dient zijn verzoek bij het waarborgfonds in uiterlijk drie maanden
      na het moment waarop de commissie het advies, bedoeld in [artikel 119, vierde lid][ref2], heeft vastgesteld en
      overlegt daarbij in ieder geval dat advies.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel137
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel119
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '137'
        hoofdstuk: '9'
        paragraaf: '9.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '119'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '139.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de indiening en de
      behandeling van, alsmede de beslissing op het verzoek.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel139
  - number: '140.1'
    text: |-
      Onze Minister kent een natuurlijke persoon van wie in het voorlopig advies, bedoeld in
      [artikel 119, tweede lid][ref1], dan wel het definitieve advies, bedoeld in artikel 119, vierde lid, is vastgesteld
      dat bij hem zaakschade als gevolg van mijnbouwactiviteiten is opgetreden op diens verzoek een voorschot ten laste
      van het waarborgfonds toe, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel119
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '119'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 140.1.a
    text: de mijnbouwondernemer bedenkingen heeft tegen het voorlopig advies dan wel het definitieve advies betwist, en
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel140
  - number: 140.1.b
    text: noodzakelijke maatregelen moeten worden getroffen ter herstel of beperking van de schade.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel140
  - number: 140.1.Het
    text: |-
      bedrag dat aan voorschotten kan worden verstrekt bedraagt ten hoogste 60 procent van het schadebedrag dat in het
      voorlopig advies wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel140
  - number: '140.2'
    text: |-
      Indien in een overeenkomst als bedoeld in [artikel 900 van Boek 7 van het Burgerlijk Wetboek][ref1] of
      bij onherroepelijke rechterlijke uitspraak wordt vastgesteld dat de schade niet het gevolg is van de
      mijnbouwactiviteiten dan wel het schadebedrag op een lager bedrag wordt vastgesteld dan het bedrag dat in totaal
      aan voorschotten is verstrekt, betaalt de persoon, bedoeld in het eerste lid, binnen drie maanden na het moment
      waarop die overeenkomst is gesloten of die uitspraak is gedaan het voorschot dan wel het verschil tussen het
      schadebedrag en het voorschot terug aan het waarborgfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel900
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '900'
  - number: '141.1'
    text: |-
      De persoon, bedoeld in [artikel 140, eerste lid][ref1], kan vanaf het moment waarop de commissie een voorlopig
      advies als bedoeld in [artikel 119, tweede lid][ref2], heeft uitgebracht, een verzoek om een voorschot indienen.
      Hij overlegt daarbij in ieder geval dat voorlopig advies.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel140
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel119
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '140'
        hoofdstuk: '9'
        paragraaf: '9.3'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '119'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '141.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de indiening en de
      behandeling van, alsmede de beslissing op een verzoek als bedoeld in [artikel 140, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel140
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '140'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: '142.1'
    text: |-
      Tegen een op grond van deze wet genomen besluit dat van toepassing is op het continentaal plat kan een
      belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State. De eerste volzin geldt
      niet voor een besluit op grond van [hoofdstuk 5][ref1], met uitzondering van de [afdelingen 5.2.1.][ref2] en
      [5.2.2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        afdeling: 5.2.1
      - id: ref3
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        afdeling: 5.2.2
  - number: '142.2'
    text: |-
      Ten aanzien van een besluit omtrent een mijnbouwmilieuvergunning en instemming met een winningsplan
      is [hoofdstuk 20 van de Wet milieubeheer][ref1] van overeenkomstige toepassing, met dien verstande
      dat [artikel 20.3 van de Wet milieubeheer][ref2] niet van toepassing is op een besluit omtrent een
      mijnbouwmilieuvergunning voor een mijnbouwwerk te plaatsen of geplaatst aan de zeezijde van de in de bijlage bij
      deze wet vastgelegde lijn en een winningsplan voorzover het winnen van delfstoffen geschiedt vanuit een voorkomen
      dat is gelegen aan de zeezijde van de in de bijlage bij deze wet vastgelegde lijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk20
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel20
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '20'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '20'
  - number: '142.3'
    text: |-
      Op het beroep tegen besluiten op grond van [hoofdstuk 5][ref1], met uitzondering van de in het eerste lid, tweede
      volzin, genoemde afdelingen, is [hoofdstuk V, afdelingen 2 tot en met 4 van de Algemene wet rijksbelastingen][ref2]
      van overeenkomstige toepassing, met dien verstande dat hoger beroep en beroep in cassatie kunnen worden ingesteld
      door de belanghebbende die bevoegd was beroep bij de rechtbank, onderscheidenlijk hoger beroep bij het gerechtshof,
      in te stellen en door het bestuursorgaan dat bevoegd was het bestreden besluit te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0002320
        afdeling: '2'
  - number: '143.1'
    text: 'Als opsporingsvergunning wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
  - number: 143.1.a
    text: |-
      een vergunning verleend krachtens [artikel 2 van de Wet opsporing delfstoffen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002579#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002579
        artikel: '2'
  - number: 143.1.b
    text: |-
      een opsporingsvergunning verleend krachtens [artikel 2 van de Mijnwet continentaal plat][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '2'
  - number: 143.1.c
    text: |-
      een ontheffing verleend krachtens [artikel 2 van de Mijnwet continentaal plat][ref1], indien deze uitsluitend
      betrekking heeft op onderzoekingen die kunnen leiden tot het aantonen van de aanwezigheid van delfstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '2'
  - number: '143.2'
    text: 'Als winningsvergunning wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
  - number: 143.2.a
    text: |-
      een concessie verleend krachtens [artikel 5 van de wet van 21 april 1810 (Bulletin des Lois no. 285)][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001821#Artikel5
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0001821
        artikel: '5'
  - number: 143.2.b
    text: |-
      een aanwijzing van een mijn bij of krachtens de
      [wet van 24 juni 1901, betreffende exploitatie van Staatswege van steenkolenmijnen in Limburg (Stb. 170)][ref1],
      de [wet van 18 juni 1918 tot ontginning van steenzout bij Buurse (Stb. 421)][ref2] of de
      [wet van 27 september 1920 tot uitbreiding van het Staatsmijnveld (Stb. 752)][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0001868
      [ref2]: https://wetten.overheid.nl/BWBR0001893
      [ref3]: https://wetten.overheid.nl/BWBR0001901
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0001868
      - id: ref2
        bwb_id: BWBR0001893
      - id: ref3
        bwb_id: BWBR0001901
  - number: 143.2.c
    text: |-
      een winningsvergunning verleend krachtens [artikel 2 van de Mijnwet continentaal plat][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '2'
  - number: 143.2.d
    text: |-
      een ontheffing verleend krachtens [artikel 2 van de Mijnwet continentaal plat][ref1], indien deze betrekking heeft
      of mede betrekking heeft op het winnen van delfstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel2
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '2'
  - number: '143.3'
    text: |-
      De voorwaarden, beperkingen of voorschriften, verbonden aan een besluit als bedoeld in het eerste lid, onderdelen
      a tot en met c, gaan gelden als aan de opsporingsvergunning verbonden beperkingen of voorschriften. De voorwaarden,
      beperkingen of voorschriften, verbonden aan een besluit als bedoeld in het tweede lid, onderdelen a tot en met d,
      gaan gelden als aan de winningsvergunning verbonden beperkingen of voorschriften.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
  - number: '143.4'
    text: |-
      In afwijking van [artikel 3](onbekend) is de houder van een vergunning die ingevolge het tweede lid, aanhef
      en onderdeel a of b, als een winningsvergunning wordt beschouwd, voor het tijdvak waarvoor de vergunning geldt
      eigenaar van de mijn waarop zij betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
  - number: '143.5'
    text: 'Als mijnbouwmilieuvergunning wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
  - number: 143.5.a
    text: |-
      een goedkeuring verleend overeenkomstig artikel 4.6 of 5.7 van de Regeling vergunningen en concessies delfstoffen
      Nederlands territoir 1996, of een soortgelijke goedkeuring op basis van voor de inwerkingtreding van die regeling
      verleende vergunningen of concessies;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
  - number: 143.5.b
    text: |-
      een vergunning verleend krachtens [artikel 30a van het Mijnreglement continentaal plat][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002564#Artikel30a
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002564
        artikel: 30a
  - number: '143.6'
    text: |-
      In afwijking van het vijfde lid wordt de goedkeuring of de vergunning die betrekking heeft op een inrichting
      waarop bij de inwerkingtreding van deze wet [hoofdstuk 8 van de Wet milieubeheer][ref1] van toepassing is, niet
      beschouwd als een mijnbouwmilieuvergunning maar als een milieuvergunning als bedoeld in [dat hoofdstuk][ref2]. Deze
      milieuvergunning wordt, indien [artikel 153, derde lid](onbekend), op de inrichting van toepassing is, samen met de
      in dat lid bedoelde milieuvergunning als één milieuvergunning beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '8'
  - number: '143.7'
    text: |-
      De beperkingen of voorschriften die aan een goedkeuring of een vergunning als bedoeld in het vijfde lid zijn
      verbonden, gaan gelden als aan de mijnbouwmilieuvergunning of aan de milieuvergunning verbonden beperkingen of
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel143
  - number: '144'
    text: |-
      Als winningsplan als bedoeld in [artikel 34][ref1] geldt een door Onze Minister goedgekeurd winningsplan als
      bedoeld in artikel 5.2 van de Regeling vergunningen koolwaterstoffen continentaal plat 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '145.1'
    text: |-
      Gedurende een in het tweede lid genoemde termijn kan na het tijdstip van inwerkingtreding van deze wet het winnen
      van delfstoffen zonder een in [artikel 34][ref1] genoemd winningsplan worden voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '145.2'
    text: 'De termijn voor voortzetting van het winnen van delfstoffen is ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel145
  - number: 145.2.a
    text: |-
      voorzover het betreft winning uit voorkomens in het continentaal plat of onder de territoriale zee gelegen aan de
      zeezijde van de in de bijlage bij deze wet vastgelegde lijn: zes maanden, en
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel145
  - number: 145.2.b
    text: 'voor ander dan onder a genoemd gebied: twaalf maanden.'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel145
  - number: '145.3'
    text: |-
      Indien een houder van een andere dan in [artikel 144][ref1] bedoelde winningsvergunning voor de afloop van de
      voor hem geldende termijn een winningsplan als bedoeld in [artikel 34][ref2] bij Onze Minister heeft ingediend en
      niet voor de afloop de beslissing van Onze Minister onherroepelijk vaststaat, kan de winning in elk geval worden
      voortgezet tot het laatstbedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel144
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '144'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '146.1'
    text: |-
      De beperkingen of voorschriften die op grond van [artikel 143, derde lid][ref1], aan een vergunning zijn
      verbonden, gelden niet voorzover zij betreffen de betaling van een oppervlakterecht, een cijns of een aandeel in
      de winst in verband met het opsporen of het winnen van koolwaterstoffen. De eerste volzin is niet van toepassing
      op concessies die zijn verleend voor 1965. In dat geval is [afdeling 5.1.1.][ref2], met uitzondering van
      [paragraaf 5.1.1.5.][ref3], welke paragraaf van overeenkomstige toepassing is, niet van toepassing. De beperkingen
      en voorschriften gelden eveneens niet voorzover zij een uitkering aan gemeenten in verband met het winnen van
      koolwaterstoffen betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        afdeling: 5.1.1
      - id: ref3
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.1.1.5
        afdeling: 5.1.1
  - number: '146.2'
    text: |-
      Onze Minister kan de beperkingen of voorschriften die op grond van [artikel 143, derde of zevende lid][ref1], aan
      een vergunning zijn verbonden, wijzigen of intrekken, voorzover over het onderwerp hiervan regels zijn gesteld ter
      bescherming van de door de beperkingen en voorschriften beschermde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '146.3'
    text: |-
      Onze Minister kan ten aanzien van een opsporingsvergunning of een winningsvergunning als bedoeld in
      [artikel 143][ref1] die wordt gehouden door meer dan een natuurlijke persoon of rechtspersoon, de in
      [artikel 22][ref2] bedoelde persoon aanwijzen. Zolang geen aanwijzing heeft plaatsgevonden wordt als de aangewezen
      persoon beschouwd degene die de feitelijke werkzaamheden verricht of daartoe opdracht verleent. In dat geval is
      [artikel 22, achtste lid, tweede zin][ref3], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '146.4'
    text: |-
      [Afdeling 5.2.2][ref1], is niet van toepassing op een winningsvergunning als bedoeld in [artikel 143][ref2]. Indien
      aan zodanige vergunning het voorschrift is verbonden dat de in de vergunning aangewezen vennootschap verzet kan
      aantekenen tegen een besluit van de vergunninghouder, treedt voor dit voorschrift in de plaats een voorschrift
      overeenkomstig [artikel 96][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel96
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        afdeling: 5.2.2
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '96'
        hoofdstuk: '5'
        afdeling: 5.2.2
  - number: '147.1'
    text: |-
      Bepalingen in een overeenkomst die voor de inwerkingtreding van deze wet is gesloten tussen de staat en de
      houder van een opsporingsvergunning of een winningsvergunning als bedoeld in [artikel 143](onbekend) of diens
      rechtsvoorganger, welke overeenkomst samenhangt met de in het eerste of tweede lid van dat artikel bedoelde
      besluiten, komen bij de inwerkingtreding van deze wet te vervallen voorzover zij in strijd zijn met deze wet.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel147
  - number: '147.2'
    text: |-
      In afwijking van het eerste lid blijven de bepalingen in stand voorzover de overeenkomst samenhangt met een besluit
      als bedoeld in [artikel 143, tweede lid](onbekend), dat is genomen voor 1965 en de bepalingen betrekking hebben op
      financiële afdrachten aan de staat, waaronder begrepen de aansprakelijkheid voor die afdrachten.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel147
  - number: '147.3'
    text: |-
      Bepalingen in een overeenkomst die voor de inwerkingtreding van deze wet is gesloten omtrent onderling overleg bij
      het winnen van delfstoffen uit een voorkomen dat de grens van een vergunningsgebied overschrijdt, worden geacht te
      zijn gesloten op basis van [artikel 42, tweede lid](onbekend).
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel147
  - number: '147.4'
    text: |-
      Bepalingen in een overeenkomst als bedoeld in het eerste lid omtrent het verwijderen van mijnbouwinstallaties als
      bedoeld in [artikel 44](onbekend), voorzover deze installaties bij de inwerkingtreding van deze wet nog in gebruik
      zijn, komen bij de inwerkingtreding van deze wet te vervallen.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel147
  - number: '148.1'
    text: |-
      In het geval dat een vergunning ingevolge [artikel 143, tweede lid, onderdeel c][ref1], als een
      winningsvergunning wordt beschouwd en op grond van deze vergunning een vennootschap is opgericht als bedoeld
      in [artikel 11, tweede lid, onderdeel a, van de Mijnwet continentaal plat][ref2], zoals deze luidde voor de
      inwerkingtreding van deze wet, worden tot het in [artikel 66, eerste lid][ref3], bedoelde resultaat gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0002504#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0002504
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 148.1.a
    text: mede de bedragen die ten goede komen aan de vennootschap;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel148
  - number: 148.1.b
    text: |-
      niet de bedragen die de houder van de winningsvergunning heeft ontvangen van de vennootschap, als houder van
      aandelen of van winstbewijzen van die vennootschap.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel148
  - number: '148.2'
    text: |-
      In het geval, bedoeld in het eerste lid, worden tot het in [artikel 66, eerste lid][ref1], bedoelde resultaat
      gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 148.2.a
    text: mede de kosten die voor rekening komen van de vennootschap;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel148
  - number: 148.2.b
    text: niet de rente over het eigen vermogen van de vennootschap.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel148
  - number: '149.1'
    text: |-
      Indien de houder van een winningsvergunning als bedoeld in [artikel 143][ref1] of zijn rechtsvoorganger voor
      de inwerkingtreding van deze wet een overeenkomst met de staat heeft gesloten omtrent het opslaan van stoffen,
      waarvoor bij de inwerkingtreding van deze wet op grond van [artikel 25][ref2] een vergunningsplicht geldt,
      verkrijgt de houder op dat moment van rechtswege een opslagvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
        hoofdstuk: '3'
  - number: '149.2'
    text: |-
      Onze Minister stelt binnen drie maanden na de inwerkingtreding van deze wet de bij de vergunning behorende
      beperkingen en voorschriften vast. De beperkingen en voorschriften worden afgestemd op de in het eerste
      lid bedoelde overeenkomst. De overeenkomst vervalt op het tijdstip waarop de beperkingen en voorschriften
      onherroepelijk van kracht worden.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel149
  - number: '150.1'
    text: |-
      Ten aanzien van een winningsvergunning als bedoeld in [artikel 143, tweede lid, aanhef en onderdeel a of b][ref1],
      wordt [artikel 21, eerste lid, onderdeel b][ref2], slechts toegepast tegen vooraf verzekerde schadeloosstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel21
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '150.2'
    text: |-
      Een winningsvergunning als bedoeld in [artikel 143, tweede lid][ref1], die in de plaats komt van een in dat lid
      bedoeld besluit dat is genomen voor 1 januari 1965, vervalt twee jaar na het tijdstip van inwerkingtreding van deze
      wet, indien gedurende vijf jaren voor die inwerkingtreding geen opsporing of winning heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '150.3'
    text: |-
      Het tweede lid geldt niet, indien de houder binnen de in dat lid bedoelde termijn van twee jaar aan Onze Minister
      kenbaar heeft gemaakt houder van de winningsvergunning te willen blijven.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel150
  - number: '151'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld ten aanzien van opsporingsvergunningen,
      winningsvergunningen, milieuvergunningen of mijnbouwmilieuvergunningen als bedoeld in [artikel 143][ref1] en ten
      aanzien van activiteiten die met gebruikmaking van die vergunningen worden verricht. De regels zijn gericht op
      een goede invoering van de wet ten aanzien van die vergunningen. De regels kunnen afwijken van de bij of krachtens
      de [hoofdstukken 1 tot en met 5][ref2], [7][ref3] en [11][ref4] gestelde bepalingen, indien dit voor een goede
      invoering van de wet noodzakelijk is, gelet op de door die bepalingen beschermde belangen. Bij de maatregel worden
      in ieder geval regels gesteld omtrent het wijzigen of intrekken van beperkingen of voorschriften die op grond van
      [artikel 143, derde of zevende lid][ref5], aan de vergunning zijn verbonden, voorzover over het onderwerp hiervan
      regels zijn gesteld ter bescherming van de door de beperkingen en voorschriften beschermde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk11
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0014168
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0014168
        hoofdstuk: '11'
      - id: ref5
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '152.1'
    text: |-
      Een voor de inwerkingtreding van deze wet ingediende aanvraag om een besluit als bedoeld in
      [artikel 143, eerste lid][ref1], wordt beschouwd als een aanvraag om een opsporingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '152.2'
    text: |-
      Een voor de inwerkingtreding van deze wet ingediende aanvraag om een besluit als bedoeld in
      [artikel 143, tweede lid][ref1], wordt beschouwd als een aanvraag om een winningsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '152.3'
    text: |-
      Een voor de inwerkingtreding van deze wet ingediende aanvraag om een goedkeuring of een vergunning als bedoeld
      in [artikel 143, vijfde lid][ref1], wordt beschouwd als een aanvraag om een mijnbouwmilieuvergunning of een
      milieuvergunning overeenkomstig de toedeling in artikel 143, vijfde en zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '153.1'
    text: |-
      Degene die bij de inwerkingtreding van deze wet een mijnbouwwerk in stand houdt, waarvoor voor dat tijdstip geen
      goedkeuring of vergunning als bedoeld in [artikel 143, vijfde lid][ref1], noodzakelijk was en waarvoor op dat
      tijdstip het verbod, bedoeld in [artikel 40, tweede lid][ref2], is gaan gelden, verkrijgt op dat tijdstip van
      rechtswege een mijnbouwmilieuvergunning voor het mijnbouwwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel40
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '153.2'
    text: |-
      Degene die bij de inwerkingtreding van deze wet een mijnbouwwerk in stand houdt, waarvoor voor dat tijdstip het
      in [artikel 8.1, eerste lid, van de Wet milieubeheer][ref1] vervatte verbod niet gold noch een goedkeuring of
      vergunning als bedoeld in [artikel 143, vijfde lid][ref2], noodzakelijk was en waarvoor het verbod op dat tijdstip
      is gaan gelden, verkrijgt op dat tijdstip van rechtswege een milieuvergunning als bedoeld in artikel 8.1 van de Wet
      milieubeheer voor de desbetreffende inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '153.3'
    text: |-
      Een vergunning als bedoeld in [artikel 8.1, eerste lid, van de Wet milieubeheer][ref1] die van
      kracht was voor de inwerkingtreding van deze wet voor een inrichting waarop wat betreft het
      ondergrondse deel [hoofdstuk 8 van de Wet milieubeheer][ref2] niet van toepassing was op grond van
      [artikel 22.1, eerste lid, onderdeel a, van die wet][ref3], wordt geacht vanaf dat tijdstip ook te zijn verleend
      voor het ondergrondse deel.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel22
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '22'
  - number: '153.4'
    text: |-
      Aan de in het derde lid bedoelde vergunning zijn vanaf de inwerkingtreding van deze wet de voorschriften verbonden
      die voor dat tijdstip op grond van de [Wet milieubeheer][ref1] en de [Wet bodembescherming][ref2] voor dit
      ondergrondse deel golden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0003994
  - number: '154'
    text: |-
      Een veiligheidszone ingesteld krachtens [artikel 27 van de Mijnwet continentaal plat][ref1], en een toestemming
      verleend krachtens [artikel 28 van die wet][ref2], worden beschouwd als een veiligheidszone en een ontheffing als
      bedoeld in [artikel 43][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002504#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel43
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0002504
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '43'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '155.1'
    text: |-
      Op verplichtingen tot betaling van een geldsom die zijn ontstaan onder de werking van een van de in
      [artikel 168][ref1] genoemde wetten, blijft na de inwerkingtreding van deze wet het recht van toepassing zoals dat
      op grond van die wetten gold op de dag voor de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel168
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '168'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '155.2'
    text: |-
      In afwijking van het eerste lid is [paragraaf 5.1.1.5.][ref1] vanaf de inwerkingtreding van deze wet van
      overeenkomstige toepassing op de betaling van een bonus, een oppervlakterecht, een cijns of een aandeel in de winst
      op grond van de in [artikel 168][ref2] genoemde wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel168
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.1.1.5
        afdeling: 5.1.1
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '168'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '156'
    text: |-
      Voor de toepassing van [artikel 66, eerste lid][ref1], wordt tot het resultaat niet gerekend afschrijving op de
      koopsom ter zake van een voor de inwerkingtreding van deze wet overgenomen winningsvergunning, voorzover deze
      koopsom de door de overdrager van die vergunning nog niet reeds ten laste van een winst- en verliesrekening
      gebrachte kosten te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: '157'
    text: |-
      Voorzover als gevolg van afschrijving op niet reeds ten laste van een andere winst- en verliesrekening gebrachte
      kosten, gemaakt voor de inwerkingtreding van deze wet en voordat de winningsvergunning is verleend, het resultaat
      van een geconsolideerde winst- en verliesrekening aan de zeezijde respectievelijk aan de landzijde negatief is,
      wordt voor de toepassing van [artikel 66, tweede en derde lid][ref1], het resultaat van de geconsolideerde winst-
      en verliesrekening berekend alsof consolidatie slechts heeft plaatsgevonden van resultaten behaald aan de zeezijde
      respectievelijk aan de landzijde.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: '158.1'
    text: |-
      Voor de toepassing van [artikel 66, derde lid][ref1], op voor de inwerkingtreding van deze wet geleden verliezen,
      wordt het resultaat van de geconsolideerde winst- en verliesrekening, bedoeld in artikel 66, tweede lid, telkenjare
      berekend alsof consolidatie slechts heeft plaatsgevonden van resultaten behaald aan de zeezijde respectievelijk aan
      de landzijde.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: '158.2'
    text: |-
      Nog te compenseren voor de inwerkingtreding van deze wet geleden verliezen aan de zeezijde respectievelijk aan de
      landzijde, worden slechts verrekend met de over een der jaren na de inwerkingtreding van deze wet overeenkomstig
      het eerste lid berekende geconsolideerde resultaten behaald aan de zeezijde respectievelijk aan de landzijde.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel158
  - number: '158.3'
    text: |-
      Indien het resultaat van de geconsolideerde winst- en verliesrekening, bedoeld in [artikel 66, tweede lid][ref1],
      over een der jaren na de inwerkingtreding van deze wet negatief is, wordt dit verlies met inachtneming van de
      wettelijke termijn, bedoeld in [artikel 20, tweede lid, van de Wet op de vennootschapsbelasting 1969][ref2],
      slechts verrekend met het resultaat van de geconsolideerde winst- en verliesrekening, bedoeld in
      [artikel 66, tweede lid][ref3], over een der jaren na de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: '158.4'
    text: |-
      Waar in dit artikel wordt gesproken over voor de inwerkingtreding van deze wet geleden verliezen wordt hieronder
      verstaan een negatief resultaat van een met inachtneming van de destijds toepasselijke voorschriften opgemaakte
      winst- en verliesrekening over een voor de inwerkingtreding van deze wet gelegen boekjaar.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel158
  - number: '159'
    text: |-
      In afwijking van [artikel 69, derde lid][ref1], wordt het op het eerste boekjaar na inwerkingtreding van
      deze wet betrekking hebbende verrekenbare bedrag verkregen door het voor het boekjaar geldende tarief van de
      vennootschapsbelasting toe te passen op het saldo van:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel69
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '69'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 159.a
    text: |-
      het resultaat van de winst- en verliesrekening, met dien verstande dat daarbij [artikel 68, derde lid][ref1],
      buiten beschouwing wordt gelaten,


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel68
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '68'
        hoofdstuk: '5'
        paragraaf: 5.1.1.4
        afdeling: 5.1.1
  - number: 159.b
    text: 'vermeerderd respectievelijk verminderd met:'
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel159
  - number: 159.b.1°
    text: |-
      de in voorafgaande boekjaren nog niet in een met inachtneming van de daarop toepasselijke voorschriften opgemaakte
      winst- en verliesrekening opgenomen kosten respectievelijk opbrengsten, welke bij de vaststelling van de met het
      voor de inwerkingtreding van deze wet verschuldigd winstaandeel verrekenbare belasting reeds in aanmerking zijn
      genomen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel159
  - number: 159.b.2°
    text: |-
      de in voorafgaande boekjaren reeds in een met inachtneming van de daarop toepasselijke voorschriften opgemaakte
      winst- en verliesrekening opgenomen opbrengsten respectievelijk kosten, welke bij de vaststelling van de met het
      voor de inwerkingtreding van deze wet verschuldigd winstaandeel verrekenbare belasting nog niet in aanmerking zijn
      genomen;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel159
  - number: 159.b.3°
    text: |-
      de over voorafgaande boekjaren bij de vaststelling van de met het voor de inwerkingtreding van deze wet
      verschuldigd winstaandeel verrekenbare belasting reeds in aanmerking genomen bedragen aan winstaandeel, voorzover
      deze meer respectievelijk minder bedragen dan de over voorafgaande boekjaren te betalen bedragen aan winstaandeel;
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel159
  - number: 159.c
    text: verminderd met het over het boekjaar na toepassing van dit artikel te betalen bedrag aan winstaandeel.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel159
  - number: '160.1'
    text: |-
      De overeenkomst, bedoeld in [artikel 81](onbekend), betreft slechts een aardgasvoorkomen als bedoeld in artikel
      IV van het koninklijk besluit van 27 januari 1967 tot uitvoering van artikel 12 van de Mijnwet continentaal plat
      ten aanzien van opsporings- en winningsvergunningen voor of mede voor aardolie of aardgas (Stb. 24), indien de
      desbetreffende opsporingsvergunning een opsporingsvergunning is als bedoeld in [artikel 143](onbekend), die is
      verleend overeenkomstig het hiervoor genoemde koninklijke besluit.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel160
  - number: '160.2'
    text: |-
      De percentages, genoemd in de [artikelen 84](onbekend) en [86](onbekend), bedragen 50 ten aanzien van de
      overeenkomst, bedoeld in die artikelen, indien de desbetreffende opsporingsvergunning een opsporingsvergunning
      is als bedoeld in [artikel 143](onbekend), die is verleend overeenkomstig het koninklijk besluit van 6 februari
      1976, houdende uitvoering van artikel 12 van de Mijnwet continentaal plat ten aanzien van opsporings- en
      winningsvergunningen voor of mede voor aardolie of aardgas (Stb. 102).
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel160
  - number: '161'
    text: |-
      Overeenkomsten die voor de inwerkingtreding van deze wet zijn gesloten tussen de door Onze Minister
      aangewezen naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid en de houder van
      een opsporingsvergunning voor het voor hun gezamenlijke rekening verrichten van opsporingswerkzaamheden zijn
      overeenkomsten als bedoeld in [artikel 81](onbekend).
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel161
  - number: '162.1'
    text: |-
      De overeenkomst, bedoeld in [artikel 89](onbekend), betreft slechts een aardgasvoorkomen als bedoeld in artikel
      IV van het koninklijk besluit van 27 januari 1967 tot uitvoering van artikel 12 van de Mijnwet continentaal
      plat ten aanzien van opsporings- en winningsvergunningen voor of mede voor aardolie of aardgas (Stb. 24), indien
      de desbetreffende winningsvergunning is verleend op grond van [artikel 10](onbekend), in aansluiting op een
      opsporingsvergunning als bedoeld in [artikel 143](onbekend), die een voortzetting is van een opsporingsvergunning
      die is verleend overeenkomstig het hiervoor genoemde koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel162
  - number: '162.2'
    text: |-
      De percentages, genoemd in de [artikelen 92](onbekend), [93](onbekend) en [94](onbekend), bedragen 50 ten aanzien
      van de overeenkomst, bedoeld in die artikelen, indien de desbetreffende winningsvergunning is verleend op grond
      van [artikel 10](onbekend), in aansluiting op een opsporingsvergunning als bedoeld in [artikel 143](onbekend),
      die een voortzetting is van een opsporingsvergunning die is verleend overeenkomstig het koninklijk besluit van 6
      februari 1976, houdende uitvoering van artikel 12 van de Mijnwet continentaal plat ten aanzien van opsporings- en
      winningsvergunningen voor of mede voor aardolie of aardgas (Stb. 102).
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel162
  - number: '163'
    text: |-
      Bepalingen in een voor de inwerkingtreding van deze wet gesloten overeenkomst, waarbij een partij zich jegens de
      staat verbindt om borg te staan voor de betaling van een oppervlakterecht, een cijns of een aandeel in de winst
      door de houder van een opsporingsvergunning of een winningsvergunning als bedoeld in [artikel 143][ref1] of diens
      rechtsvoorganger, blijven buiten toepassing voorzover zij betrekking hebben op verplichtingen die zijn ontstaan op
      grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '164.1'
    text: |-
      Voor de bepaling van een oppervlakterecht als bedoeld in [paragraaf 5.1.1.2][ref1], met betrekking tot een
      opsporingsvergunning of een winningsvergunning als bedoeld in [artikel 143][ref2], wordt de vergunning geacht van
      kracht te zijn op het tijdstip waarop het besluit, bedoeld in artikel 143, eerste of tweede lid, waarvoor deze
      vergunning in de plaats komt, van kracht was.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.1.1.2
        afdeling: 5.1.1
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '143'
        hoofdstuk: '11'
  - number: '164.2'
    text: |-
      In een geval als bedoeld in het eerste lid wordt over het tijdvak vanaf de inwerkingtreding van deze wet tot de
      eerste 1 januari na de inwerkingtreding, het oppervlakterecht bepaald op een deel van het recht dat overeenkomstig
      [paragraaf 5.1.1.2][ref1] vastgesteld zou worden over het jaar van inwerkingtreding. Dit deel wordt bepaald
      op het deel dat is toe te rekenen aan het tijdvak vanaf de inwerkingtreding tot de eerste 1 januari na de
      inwerkingtreding. Het recht is verschuldigd op 1 april na de inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
        paragraaf: 5.1.1.2
        afdeling: 5.1.1
  - number: '164.3'
    text: |-
      In een geval als bedoeld in het tweede lid wordt op het verschuldigde recht in mindering gebracht een deel van
      het oppervlakterecht dat op grond van een van de in [artikel 168][ref1] genoemde wetten verschuldigd is over een
      tijdvak dat doorloopt na de inwerkingtreding van deze wet. Dit deel wordt bepaald op het deel dat is toe te rekenen
      aan het tijdvak na de inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel168
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '168'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '165'
    text: |-
      De Mijnraad, ingesteld bij de [wet van 1 mei 1970, houdende regeling betreffende de Mijnraad (Stb. 196)][ref1],
      wordt beschouwd als de Mijnraad, bedoeld in [artikel 105][ref2]. De besluiten die zijn genomen op grond van die wet
      gaan gelden als de overeenkomstige besluiten op grond van [paragraaf 6.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002707
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel105
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0014168/2006-12-13#Artikel165
