        artikel: '7'
  - number: '8'
    text: |-
      De Autoriteit Consument en Markt kan in geval van overtreding van artikel 5, veertiende lid, en de hoofdstukken
      III, IV en VII, van de datagovernanceverordening voor zover het toezicht ziet op de natuurlijke persoon of
      rechtspersoon die gegevens doorgeeft aan een derde land, of op de aanbieder van databemiddelingsdiensten of de
      erkende organisatie voor data-altruïsme, de overtreder:

      a. een last onder dwangsom opleggen; of

      b. een bestuurlijke boete opleggen van ten hoogste het bedrag dat is vastgesteld voor de zesde categorie, bedoeld
      in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] of, indien dat meer is, 10% van de jaaromzet van
      de overtreder.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0050415/2024-11-19#Artikel8
