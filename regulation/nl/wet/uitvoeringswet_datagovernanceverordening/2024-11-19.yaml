preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels te stellen ter uitvoering van Verordening
    (EU) 2022/868 van het Europees Parlement en de Raad van 30 mei 2022 betreffende Europese datagovernance en tot
    wijziging van Verordening (EU) 2018/1724 (Datagovernanceverordening) (PbEU 2022, L 152);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050415/2024-11-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Autoriteit Consument en Markt:* Autoriteit Consument en Markt als bedoeld in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *bevoegd orgaan:* bevoegd orgaan als bedoeld in artikel 7, eerste lid, van de datagovernanceverordening;
        - *bijstand:* bijstand, bedoeld in artikel 7, eerste lid, van de datagovernanceverordening;
        - *datagovernanceverordening:* [Verordening (EU) 2022/868](32022R0868) van het Europees Parlement en de Raad van
      30 mei 2022 betreffende Europese datagovernance en tot wijziging van [Verordening (EU) 2018/1724](32018R1724)
      (Datagovernanceverordening) (PbEU 2022, L 152);
        - *met een publieke taak belaste instelling:* openbaar lichaam als bedoeld in artikel 2, zeventiende lid, van de
      datagovernanceverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0050415/2024-11-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
  - number: '2'
    text: |-
      1 Bij algemene maatregel van bestuur worden een of meerdere bevoegde organen aangewezen.

      2 De gegevens die een bevoegd orgaan ontvangt in het kader van de uitoefening van de bijstand worden uitsluitend
      verwerkt ten behoeve van de uitoefening van die bijstand.

      3 De met een publieke taak belaste instelling van wie de gegevens afkomstig zijn, is verwerkingsverantwoordelijke.
      Indien een met een publieke taak belaste instelling bijstand van een bevoegd orgaan vraagt, dan is het bevoegd
      orgaan verwerker ten behoeve van die met een publieke taak belaste instelling.

      4 Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van ieder bevoegd orgaan regels worden gesteld
      over de reikwijdte en invulling van diens bevoegdheid en taak en de vergoeding van kosten voor de bijstand.

      5 Bij besluit van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wordt het centraal informatiepunt,
      bedoeld in artikel 8, eerste lid, van de datagovernanceverordening, aangewezen.

      6 De Autoriteit Consument en Markt is:

      a. de voor databemiddelingsdiensten bevoegde autoriteit, bedoeld in artikel 13, eerste lid, van de
      datagovernanceverordening;

      b. de voor de registratie van organisaties voor data-altruïsme bevoegde autoriteit, bedoeld in artikel 23, eerste
      lid, van de datagovernanceverordening.
    url: https://wetten.overheid.nl/BWBR0050415/2024-11-19#Artikel2
  - number: '3'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de criteria en de
      methode voor de berekening van de vergoedingen voor het hergebruik van de in artikel 3, eerste lid, van de
      datagovernanceverordening bedoelde gegevenscategorieën.

      2 [Artikel 25i, eerste lid, van de Mededingingswet][ref1] is niet van toepassing op de vergoedingen, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25i
    url: https://wetten.overheid.nl/BWBR0050415/2024-11-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25i
  - number: '4'
    text: |-
      1 De Autoriteit Consument en Markt besluit binnen twaalf weken op het verzoek van een aanbieder van een
      databemiddelingsdienst als bedoeld in artikel 11, negende lid, eerste alinea, van de datagovernanceverordening.

      2 Indien een beslissing op een verzoek van een aanbieder van een databemiddelingsdienst als bedoeld in artikel 11,
      negende lid, eerste alinea, van de datagovernanceverordening niet kan worden gegeven binnen de in het eerste lid
      bedoelde termijn, kan de termijn eenmaal worden verlengd met acht weken.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de vergoeding
      voor de aanmelding van aanbieders van databemiddelingsdiensten overeenkomstig artikel 11, elfde lid, van de
      datagovernanceverordening.
    url: https://wetten.overheid.nl/BWBR0050415/2024-11-19#Artikel4
  - number: '5'
    text: |-
      Als doeleinden van algemeen belang, als bedoeld in artikel 18, onderdeel b, van de datagovernanceverordening,
      worden beschouwd:

      a. welzijn;

      b. cultuur;

      c. onderwijs, wetenschap en onderzoek;

      d. bescherming van natuur en milieu, daaronder begrepen bevordering van duurzaamheid en de strijd tegen
      klimaatverandering;

      e. gezondheidszorg;

      f. jeugd- en ouderenzorg;

      g. ontwikkelingssamenwerking;

      h. dierenwelzijn;

      i. religie, levensbeschouwing en spiritualiteit;

      j. de bevordering van de democratische rechtsorde;

      k. volkshuisvesting;

      l. verbetering van mobiliteit;

      m. facilitering van de ontwikkeling, productie en verspreiding van officiële statistieken;

      n. verbetering van openbare diensten;

      o. openbare besluitvorming; of

      p. een combinatie van de bovengenoemde doelen.
    url: https://wetten.overheid.nl/BWBR0050415/2024-11-19#Artikel5
  - number: '6'
    text: |-
      De Autoriteit Consument en Markt is belast met het toezicht op de naleving van artikel 5, veertiende lid, en
      de hoofdstukken III, IV en VII, van de datagovernanceverordening voor zover het toezicht ziet op de natuurlijke
      persoon of rechtspersoon die gegevens doorgeeft aan een derde land, of op de aanbieder van databemiddelingsdiensten
      of de erkende organisatie voor data-altruïsme.
    url: https://wetten.overheid.nl/BWBR0050415/2024-11-19#Artikel6
  - number: '7'
    text: |-
      1 De Autoriteit Consument en Markt vraagt de Autoriteit persoonsgegevens advies over de vraag in hoeverre:

      a. op een verzoek als bedoeld in artikel 11, negende lid, van de datagovernanceverordening kan worden bevestigd
      dat een databemiddelingsdienst, die voornemens is om persoonsgegevens te verwerken, voldoet aan de voorwaarden uit
      de datagovernanceverordening voor het verlenen van databemiddelingsdiensten voor zover die voorwaarden betrekking
      hebben op de bescherming van persoonsgegevens, of

      b. een aanvraag als bedoeld in artikel 19, eerste lid, van de datagovernanceverordening voldoet aan de vereisten in
      de datagovernanceverordening voor de registratie als erkende organisatie voor data-altruïsme, die voornemens is om
      persoonsgegevens te verwerken, voor zover die vereisten betrekking hebben op de bescherming van persoonsgegevens.

      2 Bij ministeriële regeling kan een termijn worden bepaald waarbinnen het advies, bedoeld in het eerste lid, wordt
      gegeven.

      3 De Autoriteit Consument en Markt en de Autoriteit persoonsgegevens, maken in het belang van een effectief en
      efficiënt toezicht op het verwerken van persoonsgegevens overeenkomstig deze wet afspraken over de wijze van
      behandeling van aangelegenheden van wederzijds belang. Daartoe stellen zij een samenwerkingsprotocol vast. Het
      samenwerkingsprotocol wordt bekendgemaakt in de Staatscourant.

      4 Onverminderd [artikel 19, tweede lid, van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] en
      [artikel 7, derde lid, onderdeel a, van de Instellingswet Autoriteit Consument en Markt][ref2] zijn de Autoriteit
      Consument en Markt en de Autoriteit persoonsgegevens bevoegd uit eigen beweging en desgevraagd verplicht aan elkaar
      de gegevens te verstrekken die noodzakelijk zijn voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0033043#Artikel7
    url: https://wetten.overheid.nl/BWBR0050415/2024-11-19#Artikel7
