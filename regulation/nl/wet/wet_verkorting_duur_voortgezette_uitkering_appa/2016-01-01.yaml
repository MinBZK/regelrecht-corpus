preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de duur van de voortgezette uitkering voor politieke
    ambtsdragers te verkorten en daartoe de Algemene pensioenwet politieke ambtsdragers te wijzigen;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036870/2016-01-01#ArtikelAanhef
articles:
  - number: II
    text: 'Deze wet wordt aangehaald als: Wet verkorting duur voortgezette uitkering Appa.'
    url: https://wetten.overheid.nl/BWBR0036870/2016-01-01#ArtikelII
  - number: III
    text: >-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036870/2016-01-01#ArtikelIII
