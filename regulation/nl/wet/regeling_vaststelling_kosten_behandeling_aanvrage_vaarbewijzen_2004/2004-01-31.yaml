    text: |-
      De door de aanvrager te betalen kosten van behandeling van de aanvrage van een duplicaat dan wel van een
      vernieuwing van de geldigheid van het groot vaarbewijs in verband met de leeftijdscategorieën, bedoeld in
      [artikel 23a van de Binnenschepenwet][ref1], bedragen € 50.


