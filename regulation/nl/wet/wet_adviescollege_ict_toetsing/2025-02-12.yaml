  - number: '2'
    text: |-
      1 Er is een Adviescollege ICT-toetsing.

      2 Het Adviescollege bestaat uit een voorzitter en ten hoogste vier andere leden.

      3 De leden worden benoemd voor ten hoogste vier jaar.

      4 Ambtenaren of andere personen die werkzaam zijn onder verantwoordelijkheid van een Minister, een zelfstandig
      bestuursorgaan, de korpschef van politie of de Raad voor de rechtspraak worden niet benoemd tot voorzitter of lid
      van het Adviescollege.

      5 De [artikelen 11][ref1] en [12, eerste en derde lid, van Kaderwet adviescolleges][ref2] zijn van overeenkomstige
      toepassing op het Adviescollege.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008159#Artikel12
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel2
