        bwb_id: BWBR0008159
        artikel: '13'
  - number: '4'
    text: |-
      1 De leden van het Adviescollege hebben zitting op persoonlijke titel en oefenen hun functie uit zonder last en
      ruggespraak.

      2 Indien in voorkomend geval uit feiten of omstandigheden blijkt dat een van de leden zelf direct of indirect
      betrokkenheid heeft bij een adviesaanvraag, zal hij zich weerhouden van enige bemoeienis ten aanzien van de
      adviesaanvraag.

      3 Het Adviescollege stelt een integriteitscode op waarin in ieder geval aandacht wordt besteed aan de wijze waarop
      wordt omgegaan met een situatie als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel4
  - number: '5'
    text: |-
      Het Adviescollege kan voor de uitvoering of voorbereiding van bepaalde adviezen uit zijn midden commissies
      instellen.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister voorziet in een ambtelijk secretariaat van het Adviescollege.

      2 Het ambtelijk secretariaat heeft aan het hoofd een secretaris-directeur.

      3 [Artikel 15, tweede, vierde en vijfde lid, van de Kaderwet adviescolleges][ref1] is van overeenkomstige
      toepassing op het secretariaat, met dien verstande dat voor Onze Minister wordt gelezen: Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel15
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '15'
  - number: '7'
    text: |-
      1 Het Adviescollege heeft ten behoeve van de algehele verbetering van de beheersing van ICT-projecten en
      informatiesystemen bij de centrale overheid tot taak:

      a. op schriftelijk verzoek van een van beide kamers der Staten-Generaal advies uit te brengen over:

      1°. een doeltreffende en doelmatige inrichting en toepassing van een informatiesysteem ter uitvoering van beleid
      of regelgeving;

      2°. de risico’s en slaagkans van een voorgenomen ICT-project en daarbij een oordeel te geven over de mate van
      beheersbaarheid; en

      3°. de doeltreffendheid en doelmatigheid van onderhoud- en beheeractiviteiten van een informatiesysteem, en

      b. het voorzien in kennisoverdracht en kennisbevordering vanuit de kennis en ervaringen die bij de advisering,
      bedoeld in onderdeel a, zijn opgedaan, waaronder mede het geven van algemene aanbevelingen wordt begrepen.

      2 Een verzoek om advies als bedoeld in het eerste lid, onderdeel a, onder 1° en 3° kan eveneens door Onze Minister
      die verantwoordelijk is voor de ICT-voorziening worden gedaan.

      3 Een advies als bedoeld in het eerste lid, onderdeel a, onder 2° en 3°, over een ICT-project of informatiesysteem
      kan eveneens door het Adviescollege uit eigen beweging worden uitgebracht. Van een voornemen daartoe stelt het
      Adviescollege Onze Minister die verantwoordelijk is voor de ICT-voorziening, of, indien het advies ziet op een ICT-
      project of informatiesysteem van een zelfstandig bestuursorgaan, Onze Minister die het aangaat, en de beide kamers
      der Staten-Generaal onverwijld in kennis. Dit lid is niet van toepassing op een ICT-project of informatiesysteem
      van de politie of de Raad voor de rechtspraak.

      4 Een verzoek om advies als bedoeld in het eerste lid, onderdeel a, onder 3°, over een informatiesysteem van
      een zelfstandig bestuursorgaan of een verzoek om advies als bedoeld in het eerste lid, onderdeel a, onder 2° of
      3°, over een ICT-project of informatiesysteem van de politie of de Raad voor de rechtspraak kan eveneens door
      respectievelijk het zelfstandig bestuursorgaan, de korpschef van politie of de voorzitter van de Raad voor de
      rechtspraak worden gedaan.

      5 Voor het opstellen van adviezen als bedoeld in het eerste lid, onderdeel a, stelt het Adviescollege een
      toetsingskader vast, waarin in ieder geval wordt opgenomen:

      a. indien het een advies als bedoeld in het eerste lid, onderdeel a, onder 1°, betreft, de ruimte om bij
      beslissingen maatwerk toe te passen;

      b. indien het een advies als bedoeld in het eerste lid, onderdeel a, onder 1°, betreft, het perspectief van de
      burger als eindgebruiker; en

      c. de risico’s op het gebied van strategische digitale veiligheid.

      6 Voor de advisering, bedoeld in het eerste lid, onderdeel a, stelt het Adviescollege een onderzoeksprotocol vast
      waarin in ieder geval worden opgenomen:

      a. de procedure die wordt gevolgd; en

      b. de methodieken en de richtlijnen die worden gehanteerd.

      7 Het Adviescollege maakt het onderzoeksprotocol openbaar.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: '8'
    text: |-
      1 Het Adviescollege bepaalt welke verzoeken om advies in behandeling worden genomen.

      2 Het Adviescollege brengt een advies als bedoeld in [artikel 7, eerste lid, onderdeel a, onder 2° of 3°][ref1],
      over een ICT-project of een informatiesysteem van een zelfstandig bestuursorgaan, de politie of de Raad voor de
      rechtspraak rechtstreeks uit aan respectievelijk het zelfstandig bestuursorgaan, de korpschef van politie of de
      voorzitter van de Raad voor de rechtspraak.

      3 Indien een advies wordt uitgebracht aan een van beide kamers der Staten-Generaal, zendt het Adviescollege
      tegelijkertijd een afschrift van het advies aan:

      a. Onze Minister die verantwoordelijk is voor de ICT-voorziening, indien het een advies betreft over een ICT-
      project of informatiesysteem van deze Minister;

      b. Onze Minister die het aangaat, indien het een advies betreft over een ICT-project of informatiesysteem van een
      zelfstandig bestuursorgaan;

      c. Onze Minister van Justitie en Veiligheid, indien het een advies betreft over een ICT-project of
      informatiesysteem van de politie;

      d. Onze Minister voor Rechtsbescherming, indien het een advies betreft over een ICT-project of informatiesysteem
      van de Raad voor de rechtspraak.

      4 Het Adviescollege kan een naschrift over de maatregelen die zijn voorgesteld ter opvolging van een advies
      uitbrengen. Het derde lid is van overeenkomstige toepassing.

      5 Een naschrift als bedoeld in het vierde lid wordt niet aangemerkt als advies.


      [ref1]: https://wetten.overheid.nl/BWBR0049412#Artikel7
