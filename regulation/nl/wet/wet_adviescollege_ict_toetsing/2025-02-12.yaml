  - number: '3'
    text: |-
      [Artikel 13 van de Kaderwet adviescolleges][ref1] is van overeenkomstige toepassing op het Adviescollege, met dien
      verstande dat voor Onze Minister wordt gelezen: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel13
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel3
    references:
