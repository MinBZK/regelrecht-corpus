        artikel: '4'
  - number: '2.1'
    text: Er is een Adviescollege ICT-toetsing.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel2
  - number: '2.2'
    text: Het Adviescollege bestaat uit een voorzitter en ten hoogste vier andere leden.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel2
  - number: '2.3'
    text: De leden worden benoemd voor ten hoogste vier jaar.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel2
  - number: '2.4'
    text: |-
      Ambtenaren of andere personen die werkzaam zijn onder verantwoordelijkheid van een Minister, een zelfstandig
      bestuursorgaan, de korpschef van politie of de Raad voor de rechtspraak worden niet benoemd tot voorzitter of lid
      van het Adviescollege.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel2
  - number: '2.5'
    text: |-
      De [artikelen 11][ref1] en [12, eerste en derde lid, van Kaderwet adviescolleges][ref2] zijn van overeenkomstige
      toepassing op het Adviescollege.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008159#Artikel12
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0008159
        artikel: '12'
  - number: '3'
    text: |-
      [Artikel 13 van de Kaderwet adviescolleges][ref1] is van overeenkomstige toepassing op het Adviescollege, met dien
      verstande dat voor Onze Minister wordt gelezen: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel13
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '13'
  - number: '4.1'
    text: |-
      De leden van het Adviescollege hebben zitting op persoonlijke titel en oefenen hun functie uit zonder last en
      ruggespraak.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel4
  - number: '4.2'
    text: |-
      Indien in voorkomend geval uit feiten of omstandigheden blijkt dat een van de leden zelf direct of indirect
      betrokkenheid heeft bij een adviesaanvraag, zal hij zich weerhouden van enige bemoeienis ten aanzien van de
      adviesaanvraag.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel4
  - number: '4.3'
    text: |-
      Het Adviescollege stelt een integriteitscode op waarin in ieder geval aandacht wordt besteed aan de wijze waarop
      wordt omgegaan met een situatie als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel4
  - number: '5'
    text: |-
      Het Adviescollege kan voor de uitvoering of voorbereiding van bepaalde adviezen uit zijn midden commissies
      instellen.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel5
  - number: '6.1'
    text: Onze Minister voorziet in een ambtelijk secretariaat van het Adviescollege.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel6
  - number: '6.2'
    text: Het ambtelijk secretariaat heeft aan het hoofd een secretaris-directeur.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel6
  - number: '6.3'
    text: |-
      [Artikel 15, tweede, vierde en vijfde lid, van de Kaderwet adviescolleges][ref1] is van overeenkomstige toepassing
      op het secretariaat, met dien verstande dat voor Onze Minister wordt gelezen: Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel15
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '15'
  - number: '7.1'
    text: |-
      Het Adviescollege heeft ten behoeve van de algehele verbetering van de beheersing van ICT-projecten en
      informatiesystemen bij de centrale overheid tot taak:
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: 7.1.a
    text: 'op schriftelijk verzoek van een van beide kamers der Staten-Generaal advies uit te brengen over:'
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: 7.1.a.1°
    text: |-
      een doeltreffende en doelmatige inrichting en toepassing van een informatiesysteem ter uitvoering van beleid of
      regelgeving;
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: 7.1.a.2°
    text: |-
      de risico’s en slaagkans van een voorgenomen ICT-project en daarbij een oordeel te geven over de mate van
      beheersbaarheid; en
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: 7.1.a.3°
    text: de doeltreffendheid en doelmatigheid van onderhoud- en beheeractiviteiten van een informatiesysteem, en
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: 7.1.b
    text: |-
      het voorzien in kennisoverdracht en kennisbevordering vanuit de kennis en ervaringen die bij de advisering, bedoeld
      in onderdeel a, zijn opgedaan, waaronder mede het geven van algemene aanbevelingen wordt begrepen.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: '7.2'
    text: |-
      Een verzoek om advies als bedoeld in het eerste lid, onderdeel a, onder 1° en 3° kan eveneens door Onze Minister
      die verantwoordelijk is voor de ICT-voorziening worden gedaan.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: '7.3'
    text: |-
      Een advies als bedoeld in het eerste lid, onderdeel a, onder 2° en 3°, over een ICT-project of informatiesysteem
      kan eveneens door het Adviescollege uit eigen beweging worden uitgebracht. Van een voornemen daartoe stelt het
      Adviescollege Onze Minister die verantwoordelijk is voor de ICT-voorziening, of, indien het advies ziet op een ICT-
      project of informatiesysteem van een zelfstandig bestuursorgaan, Onze Minister die het aangaat, en de beide kamers
      der Staten-Generaal onverwijld in kennis. Dit lid is niet van toepassing op een ICT-project of informatiesysteem
      van de politie of de Raad voor de rechtspraak.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: '7.4'
    text: |-
      Een verzoek om advies als bedoeld in het eerste lid, onderdeel a, onder 3°, over een informatiesysteem van een
      zelfstandig bestuursorgaan of een verzoek om advies als bedoeld in het eerste lid, onderdeel a, onder 2° of
      3°, over een ICT-project of informatiesysteem van de politie of de Raad voor de rechtspraak kan eveneens door
      respectievelijk het zelfstandig bestuursorgaan, de korpschef van politie of de voorzitter van de Raad voor de
      rechtspraak worden gedaan.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: '7.5'
    text: |-
      Voor het opstellen van adviezen als bedoeld in het eerste lid, onderdeel a, stelt het Adviescollege een
      toetsingskader vast, waarin in ieder geval wordt opgenomen:
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: 7.5.a
    text: |-
      indien het een advies als bedoeld in het eerste lid, onderdeel a, onder 1°, betreft, de ruimte om bij beslissingen
      maatwerk toe te passen;
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: 7.5.b
    text: |-
      indien het een advies als bedoeld in het eerste lid, onderdeel a, onder 1°, betreft, het perspectief van de burger
      als eindgebruiker; en
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: 7.5.c
    text: de risico’s op het gebied van strategische digitale veiligheid.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: '7.6'
    text: |-
      Voor de advisering, bedoeld in het eerste lid, onderdeel a, stelt het Adviescollege een onderzoeksprotocol vast
      waarin in ieder geval worden opgenomen:
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: 7.6.a
    text: de procedure die wordt gevolgd; en
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: 7.6.b
    text: de methodieken en de richtlijnen die worden gehanteerd.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: '7.7'
    text: Het Adviescollege maakt het onderzoeksprotocol openbaar.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel7
  - number: '8.1'
    text: Het Adviescollege bepaalt welke verzoeken om advies in behandeling worden genomen.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel8
  - number: '8.2'
    text: |-
      Het Adviescollege brengt een advies als bedoeld in [artikel 7, eerste lid, onderdeel a, onder 2° of 3°][ref1],
      over een ICT-project of een informatiesysteem van een zelfstandig bestuursorgaan, de politie of de Raad voor de
      rechtspraak rechtstreeks uit aan respectievelijk het zelfstandig bestuursorgaan, de korpschef van politie of de
      voorzitter van de Raad voor de rechtspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0049412#Artikel7
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0049412
        artikel: '7'
        paragraaf: '3'
  - number: '8.3'
    text: |-
      Indien een advies wordt uitgebracht aan een van beide kamers der Staten-Generaal, zendt het Adviescollege
      tegelijkertijd een afschrift van het advies aan:
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel8
  - number: 8.3.a
    text: |-
      Onze Minister die verantwoordelijk is voor de ICT-voorziening, indien het een advies betreft over een ICT-project
      of informatiesysteem van deze Minister;
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel8
  - number: 8.3.b
    text: |-
      Onze Minister die het aangaat, indien het een advies betreft over een ICT-project of informatiesysteem van een
      zelfstandig bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel8
  - number: 8.3.c
    text: |-
      Onze Minister van Justitie en Veiligheid, indien het een advies betreft over een ICT-project of informatiesysteem
      van de politie;
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel8
  - number: 8.3.d
    text: |-
      Onze Minister voor Rechtsbescherming, indien het een advies betreft over een ICT-project of informatiesysteem van
      de Raad voor de rechtspraak.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel8
  - number: '8.4'
    text: |-
      Het Adviescollege kan een naschrift over de maatregelen die zijn voorgesteld ter opvolging van een advies
      uitbrengen. Het derde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel8
  - number: '8.5'
    text: Een naschrift als bedoeld in het vierde lid wordt niet aangemerkt als advies.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel8
  - number: '9.1'
    text: |-
      Het Adviescollege maakt een advies als bedoeld in [artikel 7, eerste lid, onderdeel a][ref1], binnen twee weken na
      aanbieding openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0049412#Artikel7
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0049412
        artikel: '7'
        paragraaf: '3'
  - number: '9.2'
    text: |-
      De aanbevelingen, bedoeld in [artikel 7, eerste lid, onderdeel b][ref1], worden eenmaal per half jaar openbaar
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0049412#Artikel7
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0049412
        artikel: '7'
        paragraaf: '3'
  - number: '10'
    text: |-
      De [artikelen 20][ref1] en [21 van de Kaderwet adviescolleges][ref2] zijn van toepassing op het Adviescollege.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008159#Artikel21
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0008159
        artikel: '21'
  - number: '11.1'
    text: |-
      Onze Minister die verantwoordelijk is voor de ICT-voorziening of een zelfstandig bestuursorgaan
      verzoekt voor aanvang van een ICT-project het Adviescollege om een advies als bedoeld in
      [artikel 7, eerste lid, onderdeel a, onder 2°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049412#Artikel7
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0049412
        artikel: '7'
        paragraaf: '3'
  - number: '11.2'
    text: |-
      Een advies van het Adviescollege als bedoeld in [artikel 7, eerste lid, onderdeel a][ref1], wordt binnen vier weken
      na ontvangst ervan aan de beide kamers der Staten-Generaal gezonden door:


      [ref1]: https://wetten.overheid.nl/BWBR0049412#Artikel7
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0049412
        artikel: '7'
        paragraaf: '3'
  - number: 11.2.a
    text: |-
      Onze Minister die verantwoordelijk is voor de ICT-voorziening, indien het een advies betreft over een ICT-project
      of informatiesysteem van deze Minister;
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel11
  - number: 11.2.b
    text: |-
      Onze Minister die het aangaat, indien het een advies betreft over een ICT-project of informatiesysteem van een
      zelfstandig bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel11
  - number: 11.2.c
    text: |-
      Onze Minister van Justitie en Veiligheid, indien het een advies betreft over een ICT-project of informatiesysteem
      van de politie;
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel11
  - number: 11.2.d
    text: |-
      Onze Minister voor Rechtsbescherming, indien het een advies betreft over een ICT-project of informatiesysteem van
      de Raad voor rechtspraak.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel11
  - number: '11.3'
    text: |-
      Ingeval een advies van het Adviescollege als bedoeld in [artikel 7, eerste lid, onderdeel a][ref1], niet wordt
      opgevolgd, wordt dat, in overeenstemming met het gevoelen van de ministerraad, met redenen omkleed medegedeeld aan
      de beide kamers der Staten-Generaal. Het tweede lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0049412#Artikel7
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0049412
        artikel: '7'
        paragraaf: '3'
  - number: '11.4'
    text: |-
      Het bereiken van overeenstemming met het gevoelen van de ministerraad als bedoeld in het derde lid is niet van
      toepassing op een ICT-project of een informatiesysteem van de Raad voor de rechtspraak.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel11
  - number: '11.5'
    text: |-
      Onze Minister die verantwoordelijk is voor de ICT-voorziening of een zelfstandig bestuursorgaan kan het
      Adviescollege verzoeken om nader advies over de risico’s en slaagkans van een ICT-project dat is gestart.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel11
  - number: '12'
    text: |-
      De [artikelen 25][ref1], [28][ref2] en [29 van de Kaderwet adviescolleges][ref3] zijn van toepassing, met dien
      verstande dat voor Onze Minister wordt gelezen: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0008159#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0008159#Artikel29
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0008159
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0008159
        artikel: '29'
  - number: '13'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vier jaar, aan
      beide kamers der Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel13
  - number: '14'
    text: Deze wet is niet van toepassing op de wapensystemen van het Ministerie van Defensie.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel14
  - number: '16'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel16
  - number: '17'
    text: 'Deze wet wordt aangehaald als: Wet Adviescollege ICT-toetsing.'
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel17
