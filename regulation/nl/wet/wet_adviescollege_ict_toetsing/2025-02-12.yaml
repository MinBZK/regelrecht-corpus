preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een adviescollege in te stellen dat de regering en de
    Staten-Generaal adviseert over de risico’s en slaagkansen van ICT-projecten en informatiesystemen bij de centrale
    overheid en door kennisoverdracht en kennisbevordering het lerend vermogen daaromtrent bevordert;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder: - *Adviescollege:* het Adviescollege ICT-toetsing, bedoeld in [artikel 2][ref1];
        - *centrale overheid:* de ministeries, de krachtens publiekrecht ingestelde zelfstandige bestuursorganen
      als bedoeld in [artikel 4 van de Kaderwet zelfstandige bestuursorganen][ref2], de politie en de Raad voor de
      rechtspraak;
        - *ICT-project:* een project of programma, dan wel projecten of programma’s die onderlinge samenhang hebben, van
      de centrale overheid waarvan de kosten voor de ICT-componenten over de gehele looptijd van het project of programma
      ten minste € 5.000.000 bedragen;
        - *informatiesysteem:* een samenhangend geheel van gegevensverzamelingen, procedures, processen en programmatuur
      van de centrale overheid, alsmede de voor het informatiesysteem getroffen voorzieningen voor opslag, verwerking
      en communicatie;
        - *korpschef van politie:* de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref3];
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *Onze Minister die verantwoordelijk is voor de ICT-voorziening:* Onze Minister die verantwoordelijk is voor het
      ICT-project of het informatiesysteem waarop het advies betrekking heeft;
        - *Onze Minister die het aangaat:* Onze Minister die de eerste ondertekenaar is van de wet of lagere regelgeving
      bij welke een zelfstandig bestuursorgaan is ingesteld;
        - *zelfstandig bestuursorgaan:* een krachtens publiekrecht ingesteld zelfstandig bestuursorgaan als bedoeld in
      [artikel 4 van de Kaderwet zelfstandige bestuursorganen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0049412#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0020495#Artikel4
    url: https://wetten.overheid.nl/BWBR0049412/2025-02-12#Artikel1
    references:
