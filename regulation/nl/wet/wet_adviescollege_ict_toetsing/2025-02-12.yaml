  - number: '11'
    text: |-
      1 Onze Minister die verantwoordelijk is voor de ICT-voorziening of een zelfstandig bestuursorgaan
      verzoekt voor aanvang van een ICT-project het Adviescollege om een advies als bedoeld in
      [artikel 7, eerste lid, onderdeel a, onder 2°][ref1].

      2 Een advies van het Adviescollege als bedoeld in [artikel 7, eerste lid, onderdeel a][ref2], wordt binnen vier
      weken na ontvangst ervan aan de beide kamers der Staten-Generaal gezonden door:

      a. Onze Minister die verantwoordelijk is voor de ICT-voorziening, indien het een advies betreft over een ICT-
      project of informatiesysteem van deze Minister;

      b. Onze Minister die het aangaat, indien het een advies betreft over een ICT-project of informatiesysteem van een
      zelfstandig bestuursorgaan;

      c. Onze Minister van Justitie en Veiligheid, indien het een advies betreft over een ICT-project of
      informatiesysteem van de politie;

      d. Onze Minister voor Rechtsbescherming, indien het een advies betreft over een ICT-project of informatiesysteem
      van de Raad voor rechtspraak.

      3 Ingeval een advies van het Adviescollege als bedoeld in [artikel 7, eerste lid, onderdeel a][ref3], niet wordt
      opgevolgd, wordt dat, in overeenstemming met het gevoelen van de ministerraad, met redenen omkleed medegedeeld aan
      de beide kamers der Staten-Generaal. Het tweede lid is van overeenkomstige toepassing.

      4 Het bereiken van overeenstemming met het gevoelen van de ministerraad als bedoeld in het derde lid is niet van
      toepassing op een ICT-project of een informatiesysteem van de Raad voor de rechtspraak.

      5 Onze Minister die verantwoordelijk is voor de ICT-voorziening of een zelfstandig bestuursorgaan kan het
      Adviescollege verzoeken om nader advies over de risico’s en slaagkans van een ICT-project dat is gestart.


      [ref1]: https://wetten.overheid.nl/BWBR0049412#Artikel7
