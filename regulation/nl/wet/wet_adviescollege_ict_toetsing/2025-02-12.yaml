  - number: '9'
    text: |-
      1 Het Adviescollege maakt een advies als bedoeld in [artikel 7, eerste lid, onderdeel a][ref1], binnen twee weken
      na aanbieding openbaar.

      2 De aanbevelingen, bedoeld in [artikel 7, eerste lid, onderdeel b][ref2], worden eenmaal per half jaar openbaar
      gemaakt.


