        bwb_id: BWBR0008406
        artikel: '6'
        hoofdstuk: '3'
  - number: 22c
    text: |-
      De in [artikel 20, tweede lid][ref1], genoemde financiële tegemoetkoming in de kosten van de extra slijtage van
      kleding en beddengoed wordt éénmalig opgehoogd met een percentage van 14.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel20
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel22c
    references:
