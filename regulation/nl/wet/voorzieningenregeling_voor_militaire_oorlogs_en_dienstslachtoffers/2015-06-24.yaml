---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: voorzieningenregeling_voor_militaire_oorlogs_en_dienstslachtoffers
regulatory_layer: WET
publication_date: '2015-06-23'
valid_from: '2015-06-24'
bwb_id: BWBR0008406
url: https://wetten.overheid.nl/BWBR0008406/2015-06-24
preamble:
  text: |-
    Gelet op artikel 21 van het Besluit aanvullende arbeidsongeschiktheids- en invaliditeitsvoorzieningen militairen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel1
  - number: 1.a
    text: |-
      *betrokkene:* de beroepsmilitair, de gewezen beroepsmilitair, de dienstplichtige militair, de gewezen
      dienstplichtige, alsmede de reservist en de gewezen reservist die ten gevolge van invaliditeit aantoonbare
      beperkingen ondervindt;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel1
  - number: 1.b
    text: |-
      *invaliditeit:* de invaliditeit met dienstverband, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______, ook indien sprake is van een invaliditeit van minder dan 10%;


      [ref1]: https://wetten.overheid.nl/BWBR0012223#Artikel2
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012223
        artikel: '2'
  - number: 1.c
    text: |-
      *voorziening:* het middel dat direct dan wel indirect de nadelige gevolgen van de beperkingen die de betrokkene ten
      gevolge van zijn invaliditeit ondervindt, opheft of vermindert dan wel voorziet in een financiële tegemoetkoming in
      of een financiële vergoeding van de kosten die daarvan een gevolg zijn;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel1
  - number: 1.d
    text: |-
      *kosten:* de kosten die de betrokkene in verband met invaliditeit noodzakelijkerwijs moet maken en zonder
      invaliditeit niet of niet in dezelfde mate gemaakt zouden worden;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel1
  - number: 1.e
    text: '*financiële tegemoetkoming:* een gedeeltelijke vergoeding van de kosten van een voorziening;'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel1
  - number: 1.f
    text: '*financiële vergoeding:* een volledige vergoeding van de kosten van een voorziening;'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel1
  - number: 1.g
    text: '*begeleider:* degene die de betrokkene begeleidt, omdat de toestand van de betrokkene begeleiding nodig maakt.'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel1
  - number: '2'
    text: 'Voorzieningen worden verleend in de vorm van:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
  - number: 2.a
    text: |-
      leefvoorzieningen als bedoeld in [hoofdstuk 3][ref1]; deze voorzieningen kunnen betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008406
        hoofdstuk: '3'
  - number: 2.a.1
    text: verplaatsing per taxi of auto;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
  - number: 2.a.2
    text: verplaatsing binnenshuis en buitenshuis per rolstoel;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
  - number: 2.a.3
    text: wonen;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
  - number: 2.a.4
    text: kosten verbonden aan op zich normale huishoudelijke uitgaven;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
  - number: 2.a.5
    text: ontspanning of ontwikkeling;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
  - number: 2.a.6
    text: conditietraining;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
  - number: 2.a.7
    text: verplaatsing per fiets;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
  - number: 2.a.8
    text: kosten verbonden aan alarmeringstoestellen;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
  - number: 2.a.9
    text: algemene dagelijkse levensverrichtingen;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
  - number: 2.a.10
    text: kinderopvang;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
  - number: 2.a.11
    text: Gezinsbegeleiding.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
  - number: 2.b
    text: |-
      werkvoorzieningen als bedoeld in [hoofdstuk 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008406
        hoofdstuk: '4'
  - number: 2.c
    text: |-
      voorzieningen ter zake van de kosten van geneeskundige verzorging als bedoeld in [hoofdstuk 4a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008406
        hoofdstuk: 4a
  - number: 2.d
    text: |-
      bijzondere voorzieningen als bedoeld in [hoofdstuk 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008406
        hoofdstuk: '5'
  - number: '3'
    text: |-
      Een voorziening als bedoeld in [artikel 2][ref1] wordt slechts verleend indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel2
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008406
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.a
    text: |-
      de verstrekking daarvan in verband met de aanwezige invaliditeit om medische dan wel sociaal-medische redenen
      aangewezen is;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel3
  - number: 3.b
    text: deze in overwegende mate op het individu gericht is;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel3
  - number: 3.c
    text: deze voor langere tijd noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel3
  - number: 3.d
    text: deze voor de betrokkene niet algemeen gebruikelijk is;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel3
  - number: 3.e
    text: |-
      deze door betrokkene vooraf is aangevraagd. Ambtshalve toekenning kan plaatsvinden indien tijdens een medisch
      onderzoek in verband met de invaliditeit van betrokkene de medische noodzaak komt vast te staan;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel3
  - number: 3.f
    text: deze de meest goedkope adequate is. De verstrekking kan hierdoor afwijken van de aangevraagde voorziening.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel3
  - number: '4'
    text: 'Onder leefvoorzieningen die betrekking hebben op verplaatsing per taxi of auto worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.a
    text: 'de financiële tegemoetkoming in de kosten van het gebruik van:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.a.1
    text: een (rolstoel)taxi;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.a.2
    text: vervoer door derden;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.b
    text: 'de financiële vergoeding van de kosten van:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.b.1
    text: een standaard auto;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.b.2
    text: |-
      een duurdere auto dan de standaard auto indien de standaard auto niet geschikt is; de meerprijs van de duurdere
      auto ten opzichte van de standaard auto wordt aangemerkt als aanpassingskosten als bedoeld in onderdeel d;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.c
    text: |-
      de verstrekking van een al dan niet aangepaste auto in bruikleen indien de standaard auto bedoeld in onderdeel b,
      onder 1, of de duurdere auto, bedoeld in onderdeel b, onder 2, niet geschikt is;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.d
    text: |-
      de financiële vergoeding van de kosten van de noodzakelijke aanpassingen van een auto als bedoeld in onderdeel b en
      c die als beperking op het rijbewijs staan vermeld;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.e
    text: |-
      de financiële tegemoetkoming in de kosten van een automatische transmissie die als beperking op het rijbewijs staat
      vermeld;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.f
    text: 'de financiële tegemoetkoming in de kosten van het gebruik van:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.f.1
    text: een eigen auto;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.f.2
    text: een standaard auto als bedoeld in onderdeel b, onder 1;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.f.3
    text: een duurdere auto als bedoeld in onderdeel b, onder 2;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.f.4
    text: een auto in bruikleen als bedoeld in onderdeel c;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.g
    text: 'de financiële vergoeding van de kosten van:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.g.1
    text: |-
      de aanleg alsmede de huur van een gehandicaptenparkeerplaats en/of Europese parkeerontheffing in verband met de
      invaliditeit van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.g.2
    text: het verlengen van het rijbewijs van de betrokkene in verband met de invaliditeit van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.g.3
    text: |-
      de keuring met het oog op het aanbrengen van noodzakelijke aanpassingen van een auto als bedoeld in onderdeel b en
      c in verband met de invaliditeit van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.h
    text: 'de financiële tegemoetkoming in de kosten van:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.h.1
    text: |-
      autorijlessen en proef- en gewenningslessen; deze tegemoetkomingen kunnen worden toegekend aan de betrokkene of aan
      diens begeleider in de meerijsituatie.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.h.2
    text: aflevering van een auto als bedoeld in onderdeel b en c;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.h.3
    text: de woonplaatsservice bij een organisatie die deze hulp biedt;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.h.4
    text: een kaartkluis.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: 4.i
    text: |-
      de financiële vergoeding van de kosten van het rij-examen; deze vergoeding kan worden toegekend aan de betrokkene
      of aan diens begeleider in de meerijsituatie.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel4
  - number: '5.1'
    text: |-
      De in [artikel 4, onderdeel a, , en onderdeel f][ref1], bedoelde voorzieningen worden toegekend tot maximaal 10.000
      kilometers.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel4
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008406
        artikel: '4'
        hoofdstuk: '3'
  - number: '5.2'
    text: |-
      Bij het vaststellen van de in het eerste lid bedoelde voorzieningen wordt geen rekening gehouden met bespaarde
      kosten op het openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel5
  - number: '5.3'
    text: |-
      De in [artikel 4, onderdeel a b, c en f, onder 1 tot en met 3][ref1], bedoelde voorzieningen worden toegekend voor
      een periode van vijf jaren. Deze periode kan worden verlengd met maximaal twee jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel4
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008406
        artikel: '4'
        hoofdstuk: '3'
  - number: '5.4'
    text: |-
      Indien de medische dan wel sociaal-medische redenen voor deze voorzieningen vervallen kunnen deze voorzieningen
      voor elke toegekende periode van vijf jaren gedurende een termijn van één jaar worden voortgezet doch ten hoogste
      voor de duur van drie jaar.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel5
  - number: '5.5'
    text: |-
      De in [artikel 4 onderdeel b][ref1], bedoelde voorzieningen worden toegekend indien op grond van psychische
      klachten invaliditeit is aangenomen en het niet toekennen van die voorziening medisch aantoonbaar zou leiden
      tot mobiliteitsbeperkingen met dreigende psychische decompensatie tot gevolg, dan wel tot een ernstige
      bestaansverschraling met een verstoring van het psychische evenwicht. Voor toekenning is een medische onderbouwing
      met medewerking van psychiatrische expertise noodzakelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel4
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008406
        artikel: '4'
        hoofdstuk: '3'
  - number: '6.1'
    text: |-
      Voor de vaststelling van het recht op een voorziening als bedoeld in
      [artikel 4, onderdeel a tot en met c, en onderdeel f][ref1], is de hoogte van het inkomen van de betrokkene
      bepalend.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel4
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008406
        artikel: '4'
        hoofdstuk: '3'
  - number: '6.2'
    text: |-
      Bij de vaststelling van het inkomen van de betrokkene wordt een pensioen ter zake van invaliditeit in
      aanmerking genomen, met dien verstande dat de toegekende bijzondere invaliditeitsverhoging ingevolge
      [artikel 8 van het Besluit aanvullende arbeidsongeschiktheids- en invaliditeitsvoorzieningen militairen][ref1] dan
      wel [artikel 3 van het Besluit bijzondere militaire pensioenen][ref2] buiten beschouwing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0012223#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012222#Artikel3
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012223
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0012222
        artikel: '3'
  - number: '6.3'
    text: |-
      Bij de vaststelling van het overige inkomen van de betrokkene zijn de
      [Regeling inkomenstoets vervoersvoorzieningen REA][ref1], zoals die luidde op de dag
      voorafgaande aan de dag waarop de regeling vervalt als gevolg van de inwerkingtreding van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref2] of paragraaf
      2 van de Reïntegratieregeling, voorzover daarvan in het navolgende niet wordt afgeweken, van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009854
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009854
      - id: ref2
        bwb_id: BWBR0019058
        artikel: '2'
  - number: '6.4'
    text: |-
      De in het eerste lid bedoelde voorzieningen worden toegekend indien het inkomen van de betrokkene
      in het kalenderjaar waarin het verzoek tot toekenning van de voorziening is gedaan niet meer
      bedraagt dan 261 x 80% van het bedrag, bedoeld in de [artikelen 17, eerste lid,][ref1] en
      [18, vierde lid, van de Wet financiering sociale verzekeringen][ref2] met betrekking tot een loontijdvak van een
      dag.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel18
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '18'
  - number: '6.5'
    text: |-
      Indien het inkomen van de betrokkene in een kalenderjaar meer bedraagt dan 261 x 80% van het bedrag, bedoeld in
      [de artikelen 17, eerste lid][ref1], en [18, vierde lid, van de Wet financiering sociale verzekeringen][ref2]
      met betrekking tot een loontijdvak van een dag, vervallen de in
      [artikel 4, onderdeel b, c en e, onder 2 tot en met 4][ref3], bedoelde voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0008406#Artikel4
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0008406
        artikel: '4'
        hoofdstuk: '3'
  - number: '6.6'
    text: |-
      Indien het inkomen van de betrokkene meer bedraagt dan het op grond van het in het vierde lid vastgestelde
      bedrag worden de voorzieningen, bedoeld in [artikel 4, onderdeel a en e, onder 1][ref1], gedeeltelijk toegekend
      overeenkomstig het hierna bepaalde: - bij een overschrijding tot maximaal f 1250 wordt tot 90% van de op jaarbasis
      vastgestelde waarde van de voorziening tegemoetgekomen;
        - bij een overschrijding met meer dan f 1.250, doch ten hoogste f 2.500 tot 80%;
        - bij een overschrijding met meer dan f 2.500, doch ten hoogste f 3.750 tot 70%;
        - bij een overschrijding met meer dan f 3.750, doch ten hoogste f 5.000 tot 60%;
        - bij een overschrijding met meer dan f 5.000, doch ten hoogste f 6.250 tot 50%;
        - bij een overschrijding met meer dan f 6.250, doch ten hoogste f 7.500 tot 40%;
        - bij een overschrijding met meer dan f 7.500, doch ten hoogste f 8.750 tot 30%;
        - bij een overschrijding met meer dan f 8.750, doch ten hoogste f 10.000 tot 20%;
        - bij een overschrijding met meer dan f 10.000, doch ten hoogste f 11.250 tot 10%;
        - indien de overschrijding f 11.250 te boven gaat wordt geen tegemoetkoming verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel4
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008406
        artikel: '4'
        hoofdstuk: '3'
  - number: '6.7'
    text: |-
      Een algehele beëindiging van een in het eerste lid bedoelde voorziening vindt niet eerder plaats dan zes maanden
      nadat de betrokkene van de voorgenomen beëindiging in kennis is gesteld.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel6
  - number: '6.8'
    text: |-
      Een tussentijdse verhoging van een in het zesde lid bedoelde voorziening als gevolg van verlaging van het inkomen
      van de betrokkene vindt met onmiddellijke ingang plaats. Een tussentijdse verlaging van een in het zesde lid
      bedoelde voorziening als gevolg van een verhoging van het inkomen van de betrokkene vindt niet eerder plaats dan na
      verloop van een maand na kennisneming van de voorgenomen wijziging.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel6
  - number: '6.9'
    text: |-
      De betrokkene, die voldoet aan het bepaalde in het eerste tot en met het zesde lid, is verplicht om zodra zich een
      wijziging voordoet in zijn inkomen met onmiddellijke ingang hiervan melding te doen aan de uitvoerende dienst.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel6
  - number: '6.10'
    text: |-
      In afwijking van het achtste lid kan de tussentijdse verlaging op een vroeger tijdstip ingaan indien de betrokkene
      zijn informatieplicht, bedoeld in het negende lid niet is nagekomen.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel6
  - number: '7'
    text: |-
      Onder leefvoorzieningen die betrekking hebben op verplaatsing binnenshuis en buitenshuis per rolstoel worden
      verstaan:
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel7
  - number: 7.a
    text: de verstrekking van een rolstoel in bruikleen;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel7
  - number: 7.b
    text: 'de financiële vergoeding van de kosten van:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel7
  - number: 7.b.1
    text: de noodzakelijke aanpassingen van een rolstoel;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel7
  - number: 7.b.2
    text: de accessoires van een rolstoel;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel7
  - number: 7.b.3
    text: het onderhoud, de reparatie en de keuring van een rolstoel;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel7
  - number: 7.b.4
    text: een rolstoeltraining;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel7
  - number: 7.b.5
    text: de premie van de verzekering van een buitenrolstoel.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel7
  - number: 7.c
    text: 'de financiële tegemoetkoming in de kosten van:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel7
  - number: 7.c.1
    text: weerbestendige rolstoelkleding;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel7
  - number: 7.c.2
    text: rolstoelbestendige vloerbedekking;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel7
  - number: 7.c.3
    text: een sportrolstoel, exclusief afleveringskosten;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel7
  - number: 7.c.4
    text: het onderhoud en de reparatie van een sportrolstoel.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel7
  - number: '8'
    text: 'Onder leefvoorzieningen die betrekking hebben op wonen wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel8
  - number: 8.a
    text: de financiële vergoeding van de kosten van de verhuizing door een erkende verhuizer;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel8
  - number: 8.b
    text: |-
      de financiële vergoeding van de eigen bijdrage voor een woonvoorziening krachtens de Wet maatschappelijke
      ondersteuning;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel8
  - number: 8.c
    text: 'de financiële tegemoetkoming in de kosten van:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel8
  - number: 8.c.1
    text: de inrichting van de nieuwe woning;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel8
  - number: 8.c.2
    text: de herinrichting van de woning.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel8
  - number: '9'
    text: |-
      Onder leefvoorzieningen die betrekking hebben op de kosten verbonden aan op zich normale huishoudelijke uitgaven
      worden verstaan:
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9.a
    text: 'de financiële vergoeding van de kosten van:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9.a.1
    text: |-
      de eigen bijdrage voor huishoudelijke hulp voor zover deze hulp door een instelling voor gezinsverzorging kan
      worden verleend;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9.a.2
    text: de factuur in verband met de indicatiestelling van de onder 1, bedoelde instelling;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9.a.3
    text: |-
      de extra huurkosten van een woning indien betrokkene voor het eerst zelfstandig gaat wonen en deze kosten een
      bedrag van 12% van het bruto jaarinkomen overschrijden. Voor verlenging van de voorziening kan betrokkene jaarlijks
      een verzoek hiertoe indienen.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9.b
    text: 'de financiële tegemoetkoming in de kosten van:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9.b.1
    text: |-
      het zelf inhuren van huishoudelijke hulp volgens een jaarlijks vast te stellen uurloon indien de in onderdeel a,
      onder 1, bedoelde instelling deze hulp niet kan leveren;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9.b.2
    text: de extra slijtage van de kleding, schoeisel en het beddengoed;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9.b.3
    text: de vervanging van een garderobe in verband met de invaliditeit van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9.b.4
    text: de extra verwarming en elektriciteit;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9.c
    text: 'de financiële tegemoetkoming in de premiekosten met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9.c.1
    text: een ongevallenverzekering, voor zover deze de risico’s, verbonden aan het uitgeoefende beroep, dekt;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9.c.2
    text: |-
      een verzekering ter verkrijging van een periodieke uitkering wegens inkomstenderving als gevolg van
      arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9.c.3
    text: een levensverzekering ten behoeve van nabestaanden;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9.c.4
    text: een pensioenverzekering ten behoeve van een nabestaandenpensioen;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9.c.5
    text: een verzekering van het WAO-hiaat.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9
  - number: 9a.1
    text: 'Onder leefvoorzieningen die betrekking hebben op ontspanning of ontwikkeling wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9a
  - number: 9a.1.a
    text: een financiële tegemoetkoming in de kosten van hobbybeoefening;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9a
  - number: 9a.1.b
    text: |-
      een financiële tegemoetkoming in de kosten van de aanpassing van een attribuut benodigd voor het uitoefenen van
      de hobby;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9a
  - number: 9a.1.c
    text: een aan de invaliditeit aangepast sportattribuut ten behoeve van instandhouding of verbetering van de conditie;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9a
  - number: 9a.1.d
    text: het onderhoud en de reparatie van het aangepast sportattribuut, bedoeld onder c.;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9a
  - number: 9a.1.e
    text: een financiële tegemoetkoming in de kosten van apparatuur t.b.v. conditietraining.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9a
  - number: 9a.2
    text: 'Onder leefvoorzieningen die betrekking hebben op het verplaatsen per fiets wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9a
  - number: 9a.2.a
    text: |-
      een financiële tegemoetkoming in de meerkosten van een aan de invaliditeit aangepaste, van een standaardfiets
      afwijkende fiets;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9a
  - number: 9a.2.b
    text: een financiële tegemoetkoming in de aanschafkosten van een elektrische fiets, inclusief accu;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9a
  - number: 9a.2.c
    text: een financiële tegemoetkoming in de onderhoudskosten van de onder a. of b. genoemde fiets;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9a
  - number: 9a.2.d
    text: een financiële tegemoetkoming in de verzekeringskosten van de onder a. of b. genoemde fiets.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9a
  - number: 9a.3
    text: |-
      Onder de leefvoorziening die betrekking heeft op kosten, verbonden aan alarmeringstoestellen wordt verstaan: een
      financiële vergoeding van de kosten van een aansluiting dan wel de abonnementskosten op het hulpnet draagbare
      alarminstallatie.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9a
  - number: 9a.4
    text: |-
      Onder leefvoorzieningen die betrekking hebben op algemene dagelijkse levensverrichtingen wordt verstaan een
      financiële tegemoetkoming in de kosten van middelen dan wel behandelingen betrekking hebbend op ondersteuning voor
      het verrichten van dagelijkse levensverrichtingen noodzakelijk tengevolge van de invaliditeit.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9a
  - number: 9a.5
    text: |-
      Onder de leefvoorziening die betrekking heeft op kinderopvang wordt verstaan een financiële tegemoetkoming in de
      enkel door invaliditeit veroorzaakte kosten van opvang van kinderen tot 13 jaar die tot het normale huishouden
      van betrokkene behoren, waarbij de opvang plaatsvindt door een professionele, geregistreerde en gecertificeerde
      kinderopvangaanbieder.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9a
  - number: 9a.6
    text: |-
      Onder de leefvoorziening die betrekking heeft op gezinsbegeleiding wordt verstaan een financiële vergoeding van
      professionele begeleiding op relationeel, sociaal, maatschappelijk of financieel gebied.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel9a
  - number: '10.1'
    text: 'Onder werkvoorzieningen worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10
  - number: 10.1.a
    text: |-
      voorzieningen die het mogelijk maken dat betrokkene behouden blijft voor de arbeidsmarkt dan wel dat de
      arbeidsgeschiktheid van betrokkene behouden blijft in het geval betrokkene niet op grond van andere regelgeving in
      aanmerking komt voor een dergelijke voorziening;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10
  - number: 10.1.b
    text: |-
      de voorzieningen bedoeld in [artikel 4][ref1], die betrekking hebben op woon-werkverkeer dan wel op een combinatie
      van woon-werkvervoer en leefvervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel4
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008406
        artikel: '4'
        hoofdstuk: '3'
  - number: '10.2'
    text: |-
      [Artikel 5, eerste lid][ref1], en [artikel 6][ref2] zijn niet van toepassing op de werkvoorzieningen, bedoeld in
      het eerste lid, onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008406#Artikel6
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008406
        artikel: '5'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008406
        artikel: '6'
        hoofdstuk: '3'
  - number: '10.3'
    text: |-
      In afwijking van [artikel 5, eerste lid][ref1], worden de in [artikel 4, onderdeel a en e][ref2], bedoelde
      voorzieningen indien die betrekking hebben op het woon-werkvervoer toegekend tot maximaal 80 werkkilometers vice
      versa per werkdag.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008406#Artikel4
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008406
        artikel: '5'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008406
        artikel: '4'
        hoofdstuk: '3'
  - number: 10a
    text: 'Onder voorzieningen ter zake van de kosten van geneeskundige verzorging worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.a
    text: 'de financiële vergoeding van de kosten van:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.a.1
    text: |-
      de eigen bijdrage voor de aanschaf van orthopedische schoenen indien sprake is van een eerste verstrekking dan wel
      van extra slijtage alsmede de ten gevolge van de orthopedische schoenen noodzakelijke steunzolen;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.a.2
    text: |-
      de eigen bijdrage, bedoeld in de [artikelen 3.3.2.1][ref1] en [3.3.2.2 van het Besluit langdurige zorg][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035948#Artikel3
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0035948
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0035948
        artikel: '3'
  - number: 10a.a.3
    text: de eigen bijdrage voor de aanschaf van een ringleiding;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.a.4
    text: de eigen bijdrage voor de aanschaf van een geruismaskeerder;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.a.5
    text: de eigen bijdrage voor de aanschaf van een koptelefoon;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.a.6
    text: de eigen bijdrage voor de aanschaf van elastische kousen;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.a.7
    text: de aanpassing aan een specifiek hulpmiddel dan wel aan een algemeen gebruiksmiddel.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b
    text: 'de financiële tegemoetkoming in de kosten van:'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.1
    text: een hoortoestel;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.2
    text: een prothese;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.3
    text: een sta-op-stoel;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.4
    text: een sta-stoel;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.5
    text: een bureaustoel i.v.m. thuis te verrichten werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.6
    text: twee éénpersoonsbedden inclusief de eerste aankleding;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.7
    text: een speciaal bed inclusief de eerste aankleding bed en/of bodem en/of matras;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.8
    text: een douche-toiletstoel;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.9
    text: psychologische hulp;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.10
    text: zelfverzorgingsproducten voor brandwonden;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.11
    text: geïndiceerde contactlenzen;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.12
    text: geïndiceerde brillenglazen;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.13
    text: een brilmontuur;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.14
    text: een sportprothese;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.15
    text: braces en aanpassingen van sportschoeisel;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.b.16
    text: Een veteranen hulphond.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.c
    text: |-
      de financiële tegemoetkoming in de kosten van kleine medische hulpmiddelen dan wel behandelingen noodzakelijk
      tengevolge van de invaliditeit;
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.d
    text: |-
      de financiële tegemoetkoming in de kosten van de hogere premie voor een ziektekosten-verzekering indien deze extra
      kosten in redelijkheid niet te zijnen laste kunnen blijven.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.e
    text: de financiële tegemoetkoming in de kosten van het eigen risico van een zorgverzekering.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
  - number: 10a.f
    text: |-
      de vergoeding van de eigen bijdrage als bedoeld in de [Wet langdurige zorg][ref1] (Wlz) bij tijdelijk verblijf in
      een AWBZ-instelling, indien betrokkene tevens een eigen huishouding voert.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: '11'
    text: |-
      In bijzondere gevallen kan de betrokkene in aanmerking komen voor een voorziening, verband houdende met zijn
      invaliditeit, indien hierin niet door een andere regeling wordt voorzien. Van een bijzonder geval is sprake indien
      niet toekenning van de bijzondere voorziening voor de betrokkene tot kosten zou leiden die redelijkerwijs niet ten
      laste van hem dienen te komen en bovendien zou leiden tot ernstige bestaansverschraling of psychische decompensatie
      van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel11
  - number: '12.1'
    text: |-
      Indien in verband met de ernst van de invaliditeit en de persoonlijke situatie van de betrokkene onverwijld een
      voorziening in de zin van deze regeling geboden is kan vooruitlopend op de uitkomsten van een nader onderzoek aan
      de betrokkene de gewenste voorziening op voorschotbasis worden toegekend.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel12
  - number: '12.2'
    text: |-
      De voorziening, bedoeld in het eerste lid, kan geheel of gedeeltelijk worden teruggevorderd indien naderhand blijkt
      dat daarop geen recht bestaat.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel12
  - number: '13'
    text: |-
      Indien voor het ter beschikking stellen van een voorziening in de zin van deze regeling bepaalde maatregelen
      dringend gewenst zijn en de ernst van de invaliditeit en de persoonlijke situatie van de betrokkene een onverwijld
      handelen noodzakelijk maken kan een renteloos voorschot worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel13
  - number: '14.1'
    text: |-
      Indien een in bruikleen verstrekte voorziening wordt beëindigd kan de betrokkene in de gelegenheid worden gesteld
      die voorziening te kopen voor een prijs die de actuele waarde daarvan in het maatschappelijk verkeer niet te boven
      gaat.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel14
  - number: '14.2'
    text: |-
      Indien een voorziening als bedoeld in [artikel 4, onderdeel b][ref1], wordt beëindigd kan de eventuele restwaarde
      van de in dat onderdeel bedoelde auto geheel of gedeeltelijk worden teruggevorderd.


