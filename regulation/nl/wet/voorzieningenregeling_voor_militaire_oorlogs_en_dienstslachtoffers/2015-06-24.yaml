        artikel: '20'
        hoofdstuk: '7'
  - number: '23'
    text: |-
      Deze regeling treedt in werking op 1 januari 1997. Deze regeling zal met toelichting in de Staatscourant worden
      geplaatst. De regeling zal worden geplaatst in de MP-31-serie.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel23
  - number: '24'
    text: 'Deze regeling wordt aangehaald als: Voorzieningenregeling voor militaire oorlogs- en dienstslachtoffers.'
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel24
