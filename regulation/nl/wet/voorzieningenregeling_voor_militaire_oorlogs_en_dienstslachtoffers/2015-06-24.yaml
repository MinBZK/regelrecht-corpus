        artikel: 10a
        hoofdstuk: 4a
  - number: 20b.5
    text: |-
      De in [artikel 10a, onderdeel c][ref1], bedoelde financiële tegemoetkoming in de extra kosten van de premie van een
      ziektekostenverzekering bestaat ten hoogste uit het verschil tussen de verschuldigde hogere premie en de gemiddelde
      premie voor particuliere ziektekostenverze-keringen die als uitgangspunt wordt genomen voor de toepassing van het
      Interimbesluit ziektekosten burgerlijke ambtenaren defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel10a
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel20b
