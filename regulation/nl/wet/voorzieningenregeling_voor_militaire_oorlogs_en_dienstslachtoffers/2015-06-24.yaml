  - number: '21.1'
    text: |-
      Indien een voorziening als bedoeld in [artikel 2, onderdeel a, b, en d][ref1] voor de datum van de inwerkingtreding
      van deze regeling in het kader van de uitvoering van artikel X 5, tweede lid, van de Algemene militaire pensioenwet
      is verstrekt op basis van de regels zoals die tot 1 januari 1997 golden wordt deze voorziening na 1 januari 1997
      gedurende de nog resterende looptijd voortgezet met toepassing van de regels, zoals die daarvoor golden, behoudens
      het bepaalde in het tweede lid.


