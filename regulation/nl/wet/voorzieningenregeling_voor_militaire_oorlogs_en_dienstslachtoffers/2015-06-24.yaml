        artikel: 10a
        hoofdstuk: 4a
  - number: 20b.4
    text: |-
      De in [artikel 10a, onder c][ref1], bedoelde financiële tegemoetkoming bedraagt maximaal € 544,– per middel dan wel
      behandeling per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel10a
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel20b
