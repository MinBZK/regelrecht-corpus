        bwb_id: BWBR0008406
        artikel: 9a
        hoofdstuk: '3'
  - number: 20a.11
    text: |-
      De in [artikel 9a, zesde lid][ref1], bedoelde financiële vergoeding, wordt verlaagd met aanspraken op vergoeding
      van ziektekostenverzekering en wordt hooguit tweemaal voor een jaar toegekend. *Voorwaarden voor toekenning* a.
      er is t.a.v. cliënt sprake van de dienstverbandaandoening PTSS, b. vanuit de behandelende sector wordt aangegeven
      dat begeleiding in het betreffende geval noodzakelijk is, en c. de zorgcoördinator/casemanager (ZC/CM) geeft een
      onderbouwd advies af waaruit blijkt dat begeleiding noodzakelijk is om ernstige gevolgen (financieel, relationeel,
      sociaal maatschappelijk e.d.) te voorkomen. *Duur van de toekenning* a. De onderhavige vergoeding wordt toegekend
      voor de duur van maximaal 1 jaar (korter indien de ZC/CM een kortere periode voldoende acht). b. De vergoeding
      kan maximaal 1 jaar worden verlengd (indien de ZC/CM het noodzakelijk acht en indien dit vanuit de behandelende
      sector wordt ondersteund). c. Indien de zorgcoördinator de begeleiding na 2 jaar alsnog noodzakelijk acht, wordt
      deze aanvraag in het kader van [art. 11 VZR][ref2] aan de VA/SMO ter beoordeling voorgelegd (er is op dat moment
      voldoende informatie beschikbaar op grond waarvan de VA zich een beeld kan vormen van de situatie van cliënt (en
      zijn gezin). De VA dient de duur van de eventuele verlenging aan te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0008406#Artikel11
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0008406
        artikel: 9a
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008406
        artikel: '11'
        hoofdstuk: '5'
  - number: 20b.1
    text: |-
      De in [artikel 10a, onderdeel b, onder 1][ref1], bedoelde financiële tegemoetkoming in de kosten van een
      hoortoestel bestaat ten hoogste uit de aanschaffingskosten van het hoortoestel minus de vergoeding van de
      ziektenkostenverzekering dan wel het ziekenfonds, minus de eventuele aanvullende vergoeding, bedoeld in artikel
      4.7.4. van de bijlage van de Regeling ziektekostenverzekering militairen (PAV 7315/94029383).


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel10a
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0008406
        artikel: 10a
        hoofdstuk: 4a
  - number: 20b.2
    text: |-
      De in [artikel 10a, onderdeel b, onder 2][ref1], bedoelde financiële tegemoetkoming in de kosten van een prothese
      bestaat ten hoogste uit de aanschaffingskosten van de prothese minus de vergoeding van de ziektenkostenverzekering
      dan wel het ziekenfonds minus de eventuele aanvullende vergoeding, bedoeld in artikel 4.7.1. van de bijlage van de
      Regeling ziektekostenverzekering militairen (PAV 7315/94029383). Naast het hiervoor gestelde bestaat de financiële
      tegemoetkoming voor gecompliceerde en dure protheses tevens uit een financiële vergoeding voor de kosten van een
      servicepakket behorende bij de desbetreffende prothese.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel10a
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0008406
        artikel: 10a
        hoofdstuk: 4a
  - number: 20b.3
    text: |-
      De in het [artikel 10a, onderdeel b, onder 3 tot en met 15][ref1], bedoelde financiële tegemoetkomingen bestaan
      ten hoogste uit de aanschafkosten van de onder die punten vermelde verstrekkingen verminderd met de aanspraken
      op vergoedingen zoals een vergoeding van de zorgverzekering of een vergoeding op grond van de Regeling
      ziektekostenverzekering militairen en bedragen ten hoogste voor: - een sta-op-stoel € 3008,–;
        - een sta-stoel € 1206,–;
        - een bureaustoel i.v.m. thuis te verrichten werkzaamheden € 1809,–;
        - twee eenpersoonsbedden inclusief de eerste aankleding € 2408,–;
        - een speciaal bed inclusief de eerste aankleding en of bodem en of matras € 2408,–;
        - een douche - toiletstoel € 3611,–;
        - psychologische hulp € 2408,– ;
        - € 2408,– ;
        - zelfverzorgingsproducten voor brandwonden € 1206,–;
        - geïndiceerde contactlenzen: de kostprijs;
        - geïndiceerde brillenglazen: de kostprijs maximaal één maal per vier jaar;
        - een brilmontuur: één maal per vier jaar € 164,–;
        - een sportprothese: € 11.685,– ; braces en aanpassingen aan sportschoeisel: de kostprijs;
        - veteranen hulphond € 1050,–.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel10a
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel20b
    references:
