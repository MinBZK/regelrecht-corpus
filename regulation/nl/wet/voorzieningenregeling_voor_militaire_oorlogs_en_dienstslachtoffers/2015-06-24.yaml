  - number: 20c
    text: |-
      De in de [artikelen 16][ref1],, [18][ref2], [20][ref3],, [20a][ref4] en [20b][ref5] genoemde bedragen
      aan financiële tegemoetkomingen worden per 1 januari van elk kalenderjaar geïndexeerd aan de hand van het
      consumentenprijsindexcijfer. De geïndexeerde bedragen worden afgerond naar boven op gehele bedragen met
      uitzondering van de tegemoetkoming voor de veteranen hulphond. De tegemoetkoming veteranen hulphond van
      [art. 20b lid 3][ref6] volgt de hoogte van het bedrag zoals dat jaarlijks vanuit SZVK-polis /Reglement Hulpmiddelen
      kan worden toegekend voor onderhoudskosten van ADL- en blindengeleidehonden.


