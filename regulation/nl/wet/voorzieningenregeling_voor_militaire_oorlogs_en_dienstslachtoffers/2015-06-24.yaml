  - number: '21.3'
    text: |-
      Ambtshalve wordt zo spoedig mogelijk een beslissing genomen, waarin de voorziening als bedoeld in het tweede lid
      wordt vastgelegd.
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel21
  - number: '22'
    text: |-
      De vóór 1 januari 1997 ingediende aanvragen voor een voorziening als bedoeld in
      [artikel 2, onderdeel a, b, en d][ref1] worden afgehandeld op basis van de regels zoals die vóór de datum van
      de inwerkingtreding van deze regeling luidden, met dien verstande dat de voorziening vanaf 1 januari 1997 wordt
      toegekend met toepassing van de bepalingen van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel2
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008406
        artikel: '2'
        hoofdstuk: '2'
  - number: 22a.1
    text: |-
      De betrokkene heeft vanaf 1 januari 1995 tot en met 31 december 1996 aanspraak op een voorziening als bedoeld in
      [artikel 10a][ref1] met overeenkomstige toepassing van de bepalingen van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel10a
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0008406
        artikel: 10a
        hoofdstuk: 4a
  - number: 22a.2
    text: |-
      Aan de in het eerste lid bedoelde betrokkene, aan wie voor 1 januari 1995 een volledige vergoeding van
      de kosten van orthopedische schoenen alsmede de tengevolge van de orthopedische schoenen noodzakelijke
      steunzolen is verstrekt, wordt voor de periode genoemd in het eerste lid alsmede vanaf 1 januari 1997 de in
      [artikel 10a, onderdeel a, onder 1][ref1], bedoelde financiële vergoeding van de kosten van orthopedische schoenen
      alsmede de tengevolge van de orthopedische schoenen noodzakelijke steunzolen toegekend, ook al is er geen sprake
      van extra slijtage.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel10a
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0008406
        artikel: 10a
        hoofdstuk: 4a
  - number: 22b
    text: |-
      In afwijking van [artikel 6, derde lid][ref1], wordt de voorziening die met toepassing van het [Besluit
      inkomensgrens vervoersvoorzieningen buitenshuis/AAW](onbekend) voor 1 juli 1998 is verstrekt, na 1 juli 1998
      gedurende de resterende looptijd van de voorziening ongewijzigd voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel6
    url: https://wetten.overheid.nl/BWBR0008406/2015-06-24#Artikel22b
    references:
