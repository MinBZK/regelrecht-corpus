        artikel: 10a
        hoofdstuk: 4a
  - number: 20b.6
    text: |-
      De in [artikel 10a, onderdeel e][ref1], bedoelde financiële tegemoetkoming bedraagt maximaal het bedrag van
      het eigen risico genoemd in [artikel 19 van de Zorgverzekeringswet][ref2], in voorkomend geval verminderd
      met het bedrag aan compensatie verplicht eigen risico voor chronisch zieken en gehandicapten ingevolge
      [artikel 118a van de Zorgverzekeringswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008406#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel118a
