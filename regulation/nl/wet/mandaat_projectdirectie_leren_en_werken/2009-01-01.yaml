  text: |-
    Gelet op artikel 22, eerste lid, van het Organisatie-, mandaat- en volmachtbesluit SZW 2004;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018705/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De projectdirectie Leren en Werken ressorteert onder de directeur-generaal Werk, en tevens onder de directeur-
      generaal Hoger Onderwijs en Beroepsonderwijs van het ministerie van Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0018705/2009-01-01#Artikel1
  - number: '2'
    text: |-
      De projectdirecteur Leren en Werken heeft tot taak om in lijn met de Lissabondoelstellingen te bereiken dat in
      verschillende leeftijdscategorieën meer Nederlanders een opleiding in het hoger onderwijs afronden, en tevens om
      het aantal werkenden en werkzoekenden met een startkwalificatie substantieel te verhogen.
    url: https://wetten.overheid.nl/BWBR0018705/2009-01-01#Artikel2
  - number: '3'
    text: |-
      De projectdirecteur Leren en Werken is bevoegd om namens de Minister van Sociale Zaken en Werkgelegenheid besluiten
      te nemen en handelingen te verrichten die noch een besluit, noch een privaatrechtelijke rechtshandeling zijn, voor
      zover zij verband houden met de taken en verantwoordelijkheden, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018705#Artikel2
    url: https://wetten.overheid.nl/BWBR0018705/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018705
        artikel: '2'
  - number: '4.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 maart 2005.
    url: https://wetten.overheid.nl/BWBR0018705/2009-01-01#Artikel4
  - number: '4.2'
    text: 'Deze regeling wordt aangehaald als: Mandaat projectdirectie Leren en Werken.'
    url: https://wetten.overheid.nl/BWBR0018705/2009-01-01#Artikel4
