$id: kaderwet_zelfstandige_bestuursorganen
regulatory_layer: WET
publication_date: '2022-03-02'
valid_from: '2010-02-01'
bwb_id: BWBR0020495
url: https://wetten.overheid.nl/BWBR0020495/2010-02-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het wenselijk is basisregels vast te stellen betreffende zelfstandige
    bestuursorganen op het niveau van de centrale overheid;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel1
  - number: 1.a
    text: |-
      zelfstandig bestuursorgaan: een bestuursorgaan van de centrale overheid dat bij de wet, krachtens de wet bij
      algemene maatregel van bestuur of krachtens de wet bij ministeriële regeling met openbaar gezag is bekleed, en dat
      niet hiërarchisch ondergeschikt is aan een minister;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel1
  - number: 1.b
    text: 'Onze Minister: Onze Minister wie het aangaat.'
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel1
  - number: '2.1'
    text: |-
      Deze wet is niet van toepassing op zelfstandige bestuursorganen die uitsluitend met openbaar gezag zijn bekleed
      voor zover zij bevoegd zijn besluiten te nemen op grond van de [Wet openbaarheid van bestuur][ref1] of op
      grond van de bevoegdheid tot het nemen van besluiten of het verrichten van handelingen ten aanzien van een
      ambtenaar als bedoeld in [artikel 1 van de Ambtenarenwet][ref2] als zodanig, zijn nagelaten betrekkingen of zijn
      rechtverkrijgenden.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0001947#Artikel1
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0001947
        artikel: '1'
  - number: '2.2'
    text: |-
      Op zelfstandige bestuursorganen die vóór het tijdstip van inwerkingtreding van deze wet zijn ingesteld, is deze
      wet van toepassing indien dit in de in [artikel 1, onder a][ref1], bedoelde wet, algemene maatregel van bestuur of
      ministeriële regeling is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel1
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '1'
        hoofdstuk: '1'
  - number: '3.1'
    text: 'Een zelfstandig bestuursorgaan kan uitsluitend worden ingesteld indien:'
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel3
  - number: 3.1.a
    text: er behoefte is aan onafhankelijke oordeelsvorming op grond van specifieke deskundigheid;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel3
  - number: 3.1.b
    text: er sprake is van strikt regelgebonden uitvoering in een groot aantal individuele gevallen;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel3
  - number: 3.1.c
    text: |-
      participatie van maatschappelijke organisaties in verband met de aard van de betrokken bestuurstaak bijzonder
      aangewezen moet worden geacht.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel3
  - number: '3.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien een reeds ingesteld zelfstandig bestuursorgaan met
      een andere taak, inhoudende de uitoefening van openbaar gezag, wordt belast dan die waarvoor het zelfstandig
      bestuursorgaan werd ingesteld.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel3
  - number: '4.1'
    text: Met openbaar gezag wordt alleen bekleed een orgaan van een rechtspersoon, die krachtens publiekrecht is ingesteld.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel4
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid kan bij de wet, krachtens de wet bij algemene maatregel van bestuur of krachtens
      de wet bij ministeriële regeling een orgaan van een rechtspersoon, die krachtens privaatrecht is opgericht, met
      openbaar gezag worden bekleed, mits
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel4
  - number: 4.2.a
    text: dat bijzonder aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar belang en
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel4
  - number: 4.2.b
    text: |-
      er voldoende waarborgen zijn dat de uitoefening ervan onafhankelijk van de overige bestaande en toekomstige
      werkzaamheden van die organisatie kan geschieden.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister doet van ieder voornemen om krachtens de wet bij algemene maatregel van bestuur of om krachtens de
      wet bij ministeriële regeling aan een zelfstandig bestuursorgaan de uitoefening van openbaar gezag op te dragen dan
      wel te ontnemen, mededeling aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel5
  - number: '5.2'
    text: |-
      De voordracht voor een vast te stellen algemene maatregel van bestuur als bedoeld in het eerste lid, wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel5
  - number: '5.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op de vaststelling van een ministeriële regeling als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel5
  - number: '6'
    text: Alle wetten, koninklijke besluiten en ministeriële regelingen, houdende
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel6
  - number: 6.a
    text: het opdragen of ontnemen van de uitoefening van openbaar gezag aan een zelfstandig bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel6
  - number: 6.b
    text: wijziging van bevoegdheden van Onze Minister jegens een zelfstandig bestuursorgaan, of
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel6
  - number: 6.c
    text: |-
      wijziging van verplichtingen die een zelfstandig bestuursorgaan jegens Onze Minister in acht dient te nemen, worden
      mede door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties ondertekend.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel6
  - number: '7'
    text: |-
      Een zelfstandig bestuursorgaan dat samen met een of meer andere zelfstandige bestuursorganen deel uitmaakt van
      dezelfde rechtspersoon of organisatorische eenheid, kan mede ten behoeve van de andere zelfstandige bestuursorganen
      de verplichtingen ingevolge deze wet nakomen.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel7
  - number: '8'
    text: |-
      Een zelfstandig bestuursorgaan behoeft voor instemming met mandaatverlening de goedkeuring van Onze Minister,
      tenzij het mandaatverlening door Onze Minister betreft. De goedkeuring kan worden onthouden wegens strijd met het
      recht of op de grond dat de te mandateren bevoegdheid naar het oordeel van Onze Minister een goede taakuitoefening
      door het zelfstandig bestuursorgaan kan belemmeren.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel8
  - number: '9'
    text: Een lid van een zelfstandig bestuursorgaan kan niet tevens zijn een aan Onze Minister ondergeschikte ambtenaar.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel9
  - number: '10'
    text: |-
      Dit hoofdstuk is van toepassing op zelfstandige bestuursorganen die orgaan zijn van een krachtens publiekrecht
      ingestelde rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel10
  - number: '11.1'
    text: |-
      Indien een zelfstandig bestuursorgaan op grond van een wettelijk voorschrift een bestuursreglement vaststelt,
      behoeft dit bestuursreglement de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel11
  - number: '11.2'
    text: |-
      De goedkeuring kan worden onthouden wegens strijd met het recht of op de grond dat het bestuursreglement naar het
      oordeel van Onze Minister een goede taakuitoefening door het zelfstandig bestuursorgaan kan belemmeren.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel11
  - number: '12.1'
    text: Onze Minister benoemt, schorst en ontslaat de leden van een zelfstandig bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel12
  - number: '12.2'
    text: |-
      Schorsing en ontslag vindt slechts plaats wegens ongeschiktheid of onbekwaamheid voor de vervulde functie dan wel
      wegens andere zwaarwegende in de persoon van de betrokkene gelegen redenen. Ontslag vindt voorts plaats op eigen
      verzoek.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel12
  - number: '13.1'
    text: |-
      Een lid van een zelfstandig bestuursorgaan vervult geen nevenfuncties die ongewenst zijn met het oog op een goede
      vervulling van zijn functie of de handhaving van zijn onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel13
  - number: '13.2'
    text: |-
      Een lid van een zelfstandig bestuursorgaan meldt het voornemen tot het aanvaarden van een nevenfunctie anders dan
      uit hoofde van zijn functie aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel13
  - number: '13.3'
    text: |-
      Nevenfuncties van een lid van een zelfstandig bestuursorgaan anders dan uit hoofde van zijn functie worden
      openbaar gemaakt. Openbaarmaking geschiedt door het ter inzage leggen van een opgave van deze nevenfuncties bij het
      zelfstandig bestuursorgaan en bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel13
  - number: '14.1'
    text: |-
      Aan het lidmaatschap van een zelfstandig bestuursorgaan is een bezoldiging dan wel een schadeloosstelling
      verbonden.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel14
  - number: '14.2'
    text: Onze Minister stelt de bezoldiging of de schadeloosstelling vast.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel14
  - number: '14.3'
    text: |-
      Buiten de bezoldiging of de schadeloosstelling en de vergoeding van bijzondere kosten in verband met zijn functie
      geniet een lid van een zelfstandig bestuursorgaan dat geen onderdeel is van de Staat, geen inkomsten ten laste van
      de rechtspersoon waartoe het zelfstandig bestuursorgaan behoort.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel14
  - number: '14.4'
    text: |-
      Ten aanzien van de leden van een zelfstandig bestuursorgaan dat geen onderdeel uitmaakt van de Staat, wordt met
      overeenkomstige toepassing van [artikel 383 van Boek 2 van het Burgerlijk Wetboek][ref1] verslag gedaan in het
      jaarverslag, bedoeld in [artikel 18][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel383
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '383'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '18'
        hoofdstuk: '3'
  - number: '15.1'
    text: |-
      Op het personeel in dienst van een zelfstandig bestuursorgaan dat geen onderdeel uitmaakt van de Staat, zijn
      de rechtspositieregels die gelden voor de ambtenaren die zijn aangesteld bij ministeries, van overeenkomstige
      toepassing. De in die regels neergelegde bevoegdheden, met uitzondering van de aan Ons dan wel de aan Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties toegekende bevoegdheden tot het stellen van regels, worden
      uitgeoefend door het zelfstandig bestuursorgaan. Voorzover in die regels is bepaald dat bevoegdheden worden
      uitgeoefend met medebetrokkenheid van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, worden deze
      bevoegdheden uitgeoefend met medebetrokkenheid van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel15
  - number: '15.2'
    text: Bij algemene maatregel van bestuur kan gedeeltelijk worden afgeweken van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel15
  - number: '16'
    text: |-
      Het personeel dat werkzaam is ten behoeve van een zelfstandig bestuursorgaan staat onder het gezag van het
      zelfstandig bestuursorgaan en legt over werkzaamheden uitsluitend daaraan verantwoording af.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel16
  - number: '17.1'
    text: |-
      Indien een zelfstandig bestuursorgaan bevoegd is tot het vaststellen van tarieven, behoeft de hoogte van de door
      het zelfstandig bestuursorgaan vastgestelde tarieven de goedkeuring van Onze Minister. De goedkeuring kan worden
      onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel17
  - number: '17.2'
    text: |-
      De goedkeuring is niet vereist indien het zelfstandig bestuursorgaan is gebonden aan een maximumbedrag voor het
      tarief.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel17
  - number: '18.1'
    text: |-
      Een zelfstandig bestuursorgaan stelt jaarlijks voor 15 maart een jaarverslag op. Het jaarverslag beschrijft de
      taakuitoefening en het gevoerde beleid. Het jaarverslag beschrijft voorts het gevoerde beleid met betrekking tot
      de kwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel18
  - number: '18.2'
    text: Het jaarverslag wordt aan Onze Minister en aan beide kamers der Staten-Generaal toegezonden.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel18
  - number: '19.1'
    text: 'Een zelfstandig bestuursorgaan ziet met betrekking tot de uitoefening van zijn taken en bevoegdheden toe op:'
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel19
  - number: 19.1.a
    text: een tijdige voorbereiding en uitvoering;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel19
  - number: 19.1.b
    text: de kwaliteit van de daarbij gebruikte procedures;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel19
  - number: 19.1.c
    text: de zorgvuldige behandeling van personen en instellingen die met hem in aanraking komen;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel19
  - number: 19.1.d
    text: de zorgvuldige behandeling van bezwaarschriften en klachten die worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel19
  - number: '19.2'
    text: |-
      Een zelfstandig bestuursorgaan treft voorzieningen, waardoor personen en instellingen, die met hem in aanraking
      komen, in de gelegenheid zijn voorstellen tot verbeteringen van werkwijzen en procedures te doen.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel19
  - number: '19.3'
    text: |-
      In het jaarverslag, bedoeld in [artikel 18][ref1], doet een zelfstandig bestuursorgaan verslag van hetgeen tot
      uitvoering van het eerste en het tweede lid is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
        hoofdstuk: '3'
  - number: '20.1'
    text: |-
      Een zelfstandig bestuursorgaan verstrekt desgevraagd aan Onze Minister alle voor de uitoefening van diens taak
      benodigde inlichtingen. Onze Minister kan inzage vorderen van alle zakelijke gegevens en bescheiden, indien dat
      voor de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel20
  - number: '20.2'
    text: |-
      Een zelfstandig bestuursorgaan geeft bij het verstrekken van de in het eerste lid bedoelde inlichtingen waar nodig
      aan welke gegevens een vertrouwelijk karakter dragen. Dit vertrouwelijke karakter kan voortvloeien uit de aard van
      de gegevens, dan wel uit het feit dat natuurlijke of rechtspersonen deze aan het zelfstandig bestuursorgaan hebben
      verstrekt onder het beding dat zij als vertrouwelijk zullen gelden.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel20
  - number: '21.1'
    text: |-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de taakuitoefening door een zelfstandig
      bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel21
  - number: '21.2'
    text: De beleidsregels worden in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel21
  - number: '22.1'
    text: Onze Minister kan een besluit van een zelfstandig bestuursorgaan vernietigen.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel22
  - number: '22.2'
    text: Van het vernietigingsbesluit wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel22
  - number: '23.1'
    text: |-
      Indien naar het oordeel van Onze Minister een zelfstandig bestuursorgaan zijn taak ernstig verwaarloost, kan Onze
      Minister de noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel23
  - number: '23.2'
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat het zelfstandig
      bestuursorgaan in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog zijn taak
      naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel23
  - number: '23.3'
    text: |-
      Onze Minister stelt beide kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel23
  - number: '24'
    text: |-
      Deze afdeling is van toepassing op zelfstandige bestuursorganen die orgaan zijn van een krachtens publiekrecht
      ingestelde rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel24
  - number: '25'
    text: |-
      Een zelfstandig bestuursorgaan dat onderdeel is van de Staat, zendt jaarlijks voor 1 april aan Onze Minister de
      ontwerp-begroting voor het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel25
  - number: '26'
    text: |-
      Een zelfstandig bestuursorgaan dat geen onderdeel is van de Staat, zendt jaarlijks voor een door hem vast te
      stellen datum aan Onze Minister de begroting voor het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel26
  - number: '27.1'
    text: |-
      De begroting, bedoeld in [artikel 26][ref1], behelst een raming van de baten en lasten, een raming van de
      voorgenomen investeringsuitgaven en een raming van de inkomsten en uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '27.2'
    text: De begrotingsposten worden ieder afzonderlijk van een toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel27
  - number: '27.3'
    text: |-
      Uit de toelichting blijkt steeds welke begrotingsposten betrekking hebben op de uitoefening van de bij of krachtens
      de wet aan een zelfstandig bestuursorgaan opgedragen taken dan wel op andere activiteiten.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel27
  - number: '27.4'
    text: |-
      Tenzij de activiteiten waarop de begroting betrekking heeft nog niet eerder werden verricht, behelst de begroting
      een vergelijking met de begroting van het lopende jaar en de laatst goedgekeurde jaarrekening.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel27
  - number: '28.1'
    text: |-
      De begroting, bedoeld in [artikel 26][ref1], omvat voorts:


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
        hoofdstuk: '4'
        afdeling: '1'
  - number: 28.1.a
    text: |-
      indien de wet bepaalt dat de kosten van een zelfstandig bestuursorgaan ten laste van de rijksbegroting komen:
      een voorstel aan Onze Minister aangaande het bedrag dat in het betreffende jaar in de rijksbegroting zal worden
      opgenomen;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel28
  - number: 28.1.b
    text: |-
      indien de wet bepaalt dat de kosten van een zelfstandig bestuursorgaan gedekt zullen worden uit door het
      bestuursorgaan in rekening te brengen tarieven: een voorstel aan Onze Minister aangaande de in het betreffende jaar
      te hanteren tarieven;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel28
  - number: 28.1.c
    text: |-
      indien de wet bepaalt dat de kosten van een zelfstandig bestuursorgaan uit zowel de rijksbegroting als uit tarieven
      bestreden zullen worden: een samenstel van voorstellen als bedoeld in de onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel28
  - number: '28.2'
    text: |-
      Indien een zelfstandig bestuursorgaan andere baten of inkomsten raamt, worden deze afzonderlijk vermeld en van een
      toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel28
  - number: '29.1'
    text: |-
      Het besluit tot vaststelling van de begroting, bedoeld in [artikel 26][ref1], behoeft de goedkeuring van Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '29.2'
    text: De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel29
  - number: '30'
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en de
      begrote baten en lasten dan wel inkomsten en uitgaven, doet een zelfstandig bestuursorgaan daarvan onverwijld
      mededeling aan Onze Minister onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel30
  - number: '31'
    text: |-
      Deze afdeling is van toepassing op zelfstandige bestuursorganen die orgaan zijn van een krachtens publiekrecht
      ingestelde rechtspersoon, niet zijnde de Staat.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel31
  - number: '32'
    text: 'Onze Minister kan bepalen dat een zelfstandig bestuursorgaan zijn voorafgaande instemming behoeft voor:'
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel32
  - number: 32.a
    text: het oprichten van dan wel deelnemen in een rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel32
  - number: 32.b
    text: het in eigendom verwerven, het vervreemden of het bezwaren van registergoederen;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel32
  - number: 32.c
    text: |-
      het aangaan en beëindigen van overeenkomsten tot verkrijging, vervreemding of bezwaring van registergoederen of tot
      huur, verhuur of pacht daarvan;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel32
  - number: 32.d
    text: het aangaan van kredietovereenkomsten en van overeenkomsten van geldlening;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel32
  - number: 32.e
    text: |-
      het aangaan van overeenkomsten waarbij het zelfstandig bestuursorgaan zich verbindt tot zekerheidstelling met
      inbegrip van zekerheidstelling voor schulden van derden of waarbij hij zich als borg of hoofdelijk medeschuldenaar
      verbindt of zich voor een derde sterk maakt;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel32
  - number: 32.f
    text: |-
      het vormen van andere fondsen en reserveringen dan de egalisatiereserve, bedoeld in [artikel 33][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel33
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '33'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 32.g
    text: het doen van aangifte tot zijn faillissement of het aanvragen van zijn surséance van betaling.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel32
  - number: '33.1'
    text: Een zelfstandig bestuursorgaan vormt een egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel33
  - number: '33.2'
    text: |-
      Het verschil tussen de gerealiseerde baten van een zelfstandig bestuursorgaan en de gerealiseerde lasten van de
      activiteiten komt ten gunste onderscheidenlijk ten laste van de egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel33
  - number: '33.3'
    text: De van de egalisatiereserve genoten rente wordt aan de egalisatiereserve toegevoegd.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel33
  - number: '34.1'
    text: |-
      Tegelijk met het jaarverslag, bedoeld in [artikel 18][ref1], dient een zelfstandig bestuursorgaan de jaarrekening
      bij Onze Minister in.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
        hoofdstuk: '3'
  - number: '34.2'
    text: Het besluit tot vaststelling van de jaarrekening behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel34
  - number: '34.3'
    text: De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel34
  - number: '35.1'
    text: |-
      De jaarrekening, waarin rekening en verantwoording wordt afgelegd van het financieel beheer en van de geleverde
      prestaties over het verstreken boekjaar, wordt ingericht zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '35.2'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven
      door een door het zelfstandig bestuursorgaan aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Bij de aanwijzing van de accountant bedingt
      een zelfstandig bestuursorgaan dat aan Onze Minister desgevraagd inzicht wordt geboden in de controlewerkzaamheden
      van de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '35.3'
    text: |-
      De verklaring, bedoeld in het tweede lid, heeft mede betrekking op de rechtmatige inning en besteding van de
      middelen door een zelfstandig bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel35
  - number: '35.4'
    text: |-
      De accountant voegt bij de verklaring, bedoeld in het tweede lid, tevens een verslag van zijn bevindingen over de
      vraag of het beheer en de organisatie van een zelfstandig bestuursorgaan voldoen aan eisen van doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel35
  - number: '36'
    text: |-
      Deze afdeling is van toepassing op zelfstandige bestuursorganen die orgaan zijn van een krachtens privaatrecht
      opgerichte rechtspersoon, tenzij [titel 4.2 van de Algemene wet bestuursrecht][ref1] op dat zelfstandig
      bestuursorgaan van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '37'
    text: |-
      Indien een zelfstandig bestuursorgaan uitsluitend de bij de wet, krachtens de wet bij algemene maatregel van
      bestuur of krachtens de wet bij ministeriële regeling opgedragen taken en daaruit onmiddellijk voortvloeiende
      werkzaamheden uitvoert, zijn de [artikelen 26 tot en met 35][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '38'
    text: |-
      Indien een zelfstandig bestuursorgaan de bij de wet, krachtens de wet bij algemene maatregel van bestuur of
      krachtens de wet bij ministeriële regeling opgedragen taken en daaruit onmiddellijk voortvloeiende werkzaamheden
      uitvoert naast andere activiteiten:
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel38
  - number: 38.a
    text: houdt het een afzonderlijke boekhouding bij ter zake van die taken en werkzaamheden en
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel38
  - number: 38.b
    text: verantwoordt het in zijn jaarrekening die taken en werkzaamheden afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel38
  - number: '39.1'
    text: |-
      Onze Minister zendt elke vijf jaar een verslag aan beide kamers der Staten-Generaal ten behoeve van de beoordeling
      van de doelmatigheid en doeltreffendheid van het functioneren van een zelfstandig bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel39
  - number: '39.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties zendt elke vijf jaar na de inwerkingtreding van deze
      wet aan beide kamers der Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de
      praktijk.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel39
  - number: '40'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties houdt een openbaar register bij waarin van alle
      zelfstandige bestuursorganen in ieder geval de volgende gegevens zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel40
  - number: 40.a
    text: de naam of andere aanduiding;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel40
  - number: 40.b
    text: het adres;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel40
  - number: 40.c
    text: de rechtsvorm van de rechtspersoon waarvan het zelfstandig bestuursorgaan deel uitmaakt;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel40
  - number: 40.d
    text: de taken en bevoegdheden, onder verwijzing naar de betreffende wettelijke voorschriften;
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel40
  - number: 40.e
    text: |-
      de bepalingen en een korte inhoud daarvan van de voor het desbetreffende zelfstandig bestuursorgaan geldende
      wettelijke voorschriften waarmee wordt afgeweken van deze wet.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel40
  - number: '41.1'
    text: |-
      Een zelfstandig bestuursorgaan draagt op de voet van de ter zake voor de Rijksdienst geldende voorschriften zorg
      voor de nodige technische en organisatorische voorzieningen ter beveiliging van zijn gegevens tegen verlies of
      aantasting en tegen onbevoegde kennisneming, wijziging en verstrekking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel41
  - number: '41.2'
    text: Onze Minister kan bepalen dat het eerste lid niet van toepassing is op een zelfstandig bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel41
  - number: '42'
    text: |-
      Binnen een jaar na inwerkingtreding van deze wet deelt Onze Minister aan beide Kamers der Staten-Generaal mee welke
      zelfstandige bestuursorganen bedoeld, in [artikel 2, tweede lid][ref1], onder de werking van deze wet zullen worden
      gebracht en op welke termijn de voordracht voor een daartoe strekkende wettelijke regeling zal worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel2
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '2'
        hoofdstuk: '1'
  - number: '45'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag van de derde kalendermaand na de datum van uitgifte van het
      Staatsblad waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel45
  - number: '46'
    text: 'Deze wet wordt aangehaald als: Kaderwet zelfstandige bestuursorganen.'
    url: https://wetten.overheid.nl/BWBR0020495/2010-02-01#Artikel46
