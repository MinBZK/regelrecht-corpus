preamble:
  text: |-
    Gelet op artikelen 20e, eerste lid, van de Elektriciteitswet 1998 en 39f, eerste lid, van de Gaswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0030161/2011-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *aanleg of uitbreiding van het net:* een toename van de lengte, de capaciteit of de functionaliteit van een
      net, bedoeld in [artikel 1, eerste lid, onder i, van de Elektriciteitswet 1998][ref1], of van een gastransportnet,
      bedoeld in [artikel 1, eerste lid, onder d, van de Gaswet][ref2], waar een externe behoefte aan ten grondslag ligt;
        - *kwaliteits- en capaciteitsdocument:* een document als bedoeld in
      [artikel 21, tweede lid, van de Elektriciteitswet 1998][ref3] of [artikel 8, tweede lid, van de Gaswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel8
    url: https://wetten.overheid.nl/BWBR0030161/2011-07-01#Artikel1
    references:
