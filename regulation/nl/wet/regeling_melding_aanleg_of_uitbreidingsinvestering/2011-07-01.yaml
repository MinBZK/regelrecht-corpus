        artikel: '8'
  - number: '2'
    text: |-
      Een voornemen tot een investering in de aanleg of uitbreiding van het net als bedoeld in
      [artikel 20e van de Elektriciteitswet 1998][ref1] of [artikel 39f van de Gaswet][ref2] wordt gemeld door het
      overleggen van de gegevens, bedoeld in [bijlage I][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel20e
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel39f
      [ref3]: https://wetten.overheid.nl/BWBR0030161
    url: https://wetten.overheid.nl/BWBR0030161/2011-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 20e
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 39f
      - id: ref3
        bwb_id: BWBR0030161
  - number: '3'
    text: |-
      Een voornemen als bedoeld in [artikel 2][ref1] wordt met een of meer andere voornemens geclusterd aangeleverd
      indien de voornemens onlosmakelijk met elkaar zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0030161#Artikel2
