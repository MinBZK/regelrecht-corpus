        bwb_id: BWBR0016021
        artikel: '1'
  - number: 1.f
    text: |-
      productie-installatie voor de productie van hernieuwbare elektriciteit met gebruik van stortgas of biogas uit
      afvalwater- of rioolwaterzuiveringsinstallaties: een productie-installatie waarmee hernieuwbare elektriciteit wordt
      geproduceerd:
    url: https://wetten.overheid.nl/BWBR0023566/2009-10-09#Artikel1
  - number: 1.f.1°
    text: uit gas dat vrijkomt tengevolge van biologische afbraakreacties uit gestorte afvalstoffen, of
    url: https://wetten.overheid.nl/BWBR0023566/2009-10-09#Artikel1
  - number: 1.f.2°
    text: |-
      uit gas dat vrijkomt tengevolge van biologische afbraakreacties bij de zuivering van huishoudelijk afvalwater,
      bedrijfsafvalwater en afvloeiend hemelwater;
    url: https://wetten.overheid.nl/BWBR0023566/2009-10-09#Artikel1
  - number: 1.g
    text: |-
      co-vergisting van dierlijke mest: de biologische afbraakreacties van in hoofdzaak
      verpompbare vaste en vloeibare uitwerpselen van dieren en een of meer producten genoemd in de
      [Meststoffenbeschikking 1977, bijlage I, hoofdstuk III][ref1], typeaanduiding ‘co-vergiste mest’ zoals deze luidde
      op 31 december 2007;


      [ref1]: https://wetten.overheid.nl/BWBR0003122
    url: https://wetten.overheid.nl/BWBR0023566/2009-10-09#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003122
  - number: 1.h
    text: |-
      NTA 8003: de Nederlandse Technische Afspraak 8003, Classificatie van biomassa voor energietoepassing, uitgegeven
      door het Nederlands Normalisatie-instituut, zoals deze luidde op 1 december 2003;
    url: https://wetten.overheid.nl/BWBR0023566/2009-10-09#Artikel1
  - number: 1.i
    text: |-
      vergisting van groente-, fruit- en tuinafval: de biologische afbraakreacties van biomassa als bedoeld in de nummers
      601 tot en met 609 van de NTA 8003;
    url: https://wetten.overheid.nl/BWBR0023566/2009-10-09#Artikel1
  - number: 1.j
    text: |-
      thermische conversie van vaste biomassa: de omzetting van biomassa als bedoeld in de NTA 8003, met uitzondering van
      biomassa als bedoeld in de nummers 540 tot en met 548 van de NTA 8003, door middel van:
    url: https://wetten.overheid.nl/BWBR0023566/2009-10-09#Artikel1
