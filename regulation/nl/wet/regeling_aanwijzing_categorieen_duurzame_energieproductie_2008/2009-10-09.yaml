  - number: 1.c
    text: |-
      productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie op land: een
      productie-installatie die niet is opgericht in de territoriale zee of in de exclusieve economische zone, waarmee
      hernieuwbare elektriciteit wordt geproduceerd met behulp van windenergie;
    url: https://wetten.overheid.nl/BWBR0023566/2009-10-09#Artikel1
  - number: 1.d
    text: |-
      productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van afvalverbranding: een
      productie-installatie waarmee hernieuwbare elektriciteit wordt geproduceerd uit de warmte die uitsluitend of in
      hoofdzaak is geproduceerd door:
    url: https://wetten.overheid.nl/BWBR0023566/2009-10-09#Artikel1
  - number: 1.d.1°
    text: de verbranding van afvalstoffen,
    url: https://wetten.overheid.nl/BWBR0023566/2009-10-09#Artikel1
  - number: 1.d.2°
    text: |-
      een andere thermische behandeling van afvalstoffen dan bedoeld onder 1° ingeval de producten daarvan vervolgens
      worden verbrand, of
    url: https://wetten.overheid.nl/BWBR0023566/2009-10-09#Artikel1
  - number: 1.d.3°
    text: de verbranding van producten die voortkomen uit thermische behandeling van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0023566/2009-10-09#Artikel1
  - number: 1.e
    text: |-
      gewogen maandelijks rendement: het rendement, bedoeld in
      [artikel 1, vierde lid, van de Regeling garanties van oorsprong voor duurzame elektriciteit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel1
    url: https://wetten.overheid.nl/BWBR0023566/2009-10-09#Artikel1
    references:
