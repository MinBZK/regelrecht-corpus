  - number: '18'
    text: |-
      Met de in deze regeling vastgestelde technische eisen worden gelijkgesteld daaraan gelijkwaardige technische eisen,
      vastgesteld door of vanwege een lid-staat van de Europese Unie danwel door of vanwege een staat die partij is bij
      de overeenkomst inzake de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel18
  - number: '19'
    text: |-
      Deze regeling kan worden aangehaald als: [Regeling rondvaartboten van het Amsterdamse grachtentype][ref1].

      Deze regeling zal worden geplaatst in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0004942
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel19
