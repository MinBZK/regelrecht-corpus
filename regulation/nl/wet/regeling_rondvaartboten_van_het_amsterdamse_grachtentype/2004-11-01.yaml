preamble:
  text: |-
    Gelet op artikel 47 in samenhang met artikel 20, eerste lid, onder a, van het Binnenschepenbesluit (Stb. 1987,
    466);

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De begripsbepalingen van het [Binnenschepenbesluit][ref1] zijn van toepassing.

      2 In deze regeling wordt verstaan onder:



              a
              rondvaartboot van het Amsterdamse grachtentype:

                een passagiersschip met een lengte Lwl van minder dan 30 meter, zoals ontwikkeld voor de rondvaarten in
      Amsterdam, en met de volgende kenmerken:
                het schip heeft één laag passagiersaccommodatie, deels verzonken tot beneden het gangboord;
      het schip is voorzien van een grotendeels doorgaande opbouw, voorzien van grote ramen. De lengte van een eventueel
      aanwezige open, tot beneden het gangboord verzonken kuip mag niet meer bedragen dan 25% van de lengte Lwl;
      het schip heeft een stuurstand aan de voorzijde van de passagiersaccommodatie en
      het schip is niet bestemd voor gebruik op de binnenwateren van zone 2;



              b
              CNG:

                compressed natural gas;



              c
              CNG-installatie:

                het geheel van gemonteerde onderdelen dat het mogelijk maakt om als brandstof voor de voortstuwingsmotor
      gebruik te maken van CNG;



              d
              ECE-Reglement Nr. 67:

                de publicatie ‘Uniform provisions concerning the approval of specific equipment of motorvehicles using
      liquefied petroleumgases in their propulsion system’, vastgesteld door de Economic Commission for Europe en
      uitgegeven door de Verenigde Naties;



              e
              ISO 2604-2:

                de publicatie ‘Steel products for pressure purposes; Quality requirements’;



              f
              Part 2:

                ‘Wrought seamless tubes’, uitgegeven door de International Organization for Standardization;



              g
              NEN-EN 10204:

                de publicatie ‘Metallic products; Types of inspection documents’, uitgegeven door het Nederlands
      Normalisatie instituut.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel1
