  - number: 14e
    text: |-
      1 De levering van de onderdelen van de CNG-installatie en de inbouw daarvan geschieden door dezelfde leverancier.

      2 De inbouw geschiedt in overeenstemming met de constructietekeningen, genoemd in
      [artikel 14, vierde of vijfde lid][ref1].

      3 De onderdelen van de CNG-installatie zijn deugdelijk bevestigd.

      4 De CNG-installatie vertoont geen lekkage.

      5 De CNG-installatie is zodanig ingebouwd dat de bescherming tegen beschadiging optimaal is.

      6 Geen deel van de CNG-installatie bevindt zich binnen een afstand van 0,1 meter van een uitlaat of vergelijkbare
      hittebron, tenzij het deel door middel van een schild afdoende tegen de hitte is beschermd.

      7 Op de CNG-installatie wordt niets aangesloten dat geen verband heeft met het goed en veilig functioneren van
      de voortstuwingsmotor.

      8 De onderdelen, genoemd in [artikel 14b][ref2], zijn zodanig ingebouwd dat controle eenvoudig is en de
      goedkeuringsmerken leesbaar zijn.


