  - number: 14f
    text: |-
      1 Indien door het falen van een onderdeel van de CNG-installatie een ander onderdeel van de CNG-installatie boven
      de ontwerpdruk kan worden belast, is een drukbeveiliging aangebracht die de gastoevoer naar het als gevolg van het
      falen te hoog belaste deel in voorkomende gevallen automatisch afsluit. De afsluiter bevindt zich in een gedeelte
      van de installatie dat niet door een te hoge druk kan worden belast.

      2 Een automatische afsluitklep sluit de brandstoftoevoer af, tenzij de motor draait of gestart wordt.

      3 Een automatische afsluitklep sluit de brandstoftoevoer af, indien de gasdruk voor de motor te hoog wordt. De
      gasdruk wordt bewaakt door middel van een drukschakelaar of een instrument met dezelfde werking. De afstelling is
      zodanig dat de gasdruk veilig is, maar voldoende hoog om de motor het gas stabiel en nagenoeg volledig te laten
      verbranden.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14f
  - number: 14g
    text: |-
      1 CNG-tanks bevinden zich niet in de motorkamer.

      2 Aansluitingen op CNG-tanks bevinden zich in de ruimte waarin de CNG-tanks zijn geplaatst.

      3 De ruimte waarin de CNG-tanks zijn geplaatst wordt voldoende geventileerd. De luchtinlaat bevindt zich aan de ene
      zijde bovenin de ruimte. Het afzuigkanaal bevindt zich op niet meer dan 50 mm van de bodem, diagonaal tegenover de
      luchtinlaat aan de andere zijde van de ruimte.

      4 De ventilatieopeningen in de ruimte waarin de CNG-tanks zijn geplaatst, zijn voorzien van door het hoofd van de
      scheepvaartinspectie goedgekeurde vlamkerende roosters.

      5 De capaciteit van de ventilatie is voldoende om de lucht in de ruimte tenminste 20 keer per uur volledig te
      verversen.

      6 Het ventilatiesysteem is zodanig uitgevoerd dat vonkvorming en elektrostatische oplading zijn uitgesloten.

      7 Ventilatieopeningen aan de buitenzijde van de rondvaartboot ten behoeve van de luchtinlaat bevinden zich aan de
      bovenzijde van de opbouw.

      8 De capaciteit van de CNG-tanks is niet groter dan vereist voor één dagreis.

      9 De hoofdkranen van de CNG-tanks kunnen vanuit de stuurstand worden gesloten.

      10 CNG-tanks zijn goedgekeurd bij de meest recente periodieke keuring, bedoeld in [artikel 14t, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004942#Artikel14t
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14g
    references:
      - id: ref1
        bwb_id: BWBR0004942
        artikel: 14t
  - number: 14h
    text: |-
      1 De overdrukbeveiliging is in de CNG-tank of in een appendage op de tank aangebracht.

      2 De werking van de appendage belemmert het functioneren van de overdrukbeveiliging niet.

      3 Eventuele overdruk wordt direct naar buiten afgevoerd en niet op een lager punt dan aan de bovenzijde van de
      opbouw afgeblazen.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14h
  - number: 14i
    text: |-
      1 De automatische tankafsluiter is op de CNG-tank aangebracht.

      2 De automatische tankafsluiter is uitgevoerd:

      a. als één component waarin een automatische afsluitklep en een handbediende afsluitklep is ondergebracht, zonodig
      tevens voorzien van een overdrukbeveiliging; of

      b. als een samenstel van twee componenten bestaande uit een handbediende tankafsluiter, al dan niet voorzien van
      een overdrukbeveiliging, en een automatische afsluitklep, waarbij de handafsluiter direct na de CNG-tank en de
      automatische afsluitklep direct op de handafsluiter is aangebracht.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14i
  - number: 14j
    text: |-
      1 In de gasleiding van de CNG-tank naar de drukregelaar is zo dicht mogelijk bij de drukregelaar een automatische
      afsluitklep aangebracht.

      2 Indien meerdere drukregelaars zijn aangebracht kan de automatische afsluitklep voor de laatste drukregelaar zijn
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14j
  - number: 14k
    text: |-
      [Artikel 14g, derde tot en met zevende lid][ref1], is van overeenkomstige toepassing op de ruimte waarin de
      voortstuwingsmotor van een rondvaartboot, voorzien van een CNG-installatie, is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004942#Artikel14g
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14k
    references:
      - id: ref1
        bwb_id: BWBR0004942
        artikel: 14g
  - number: 14l
    text: |-
      1 In ruimten waar lekkage van CNG kan ontstaan is een gasdetectie-installatie aangebracht.

      2 De gasdetectie-installatie geeft optisch en akoestisch alarm nabij de stuurstand indien de hoeveelheid CNG in de
      ruimte 10% van de onderste explosiegrens bereikt.

      3 De gasdetectie-installatie is uiterlijk zes maanden geleden gecontroleerd op correcte werking en in orde
      bevonden.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14l
  - number: 14m
    text: |-
      1 In het gedeelte van de gastoevoerleiding van de CNG-tanks naar de motor, dat is aangebracht onder het
      passagiersverblijf, bevinden zich geen flenzen of koppelingen.

      2 Het gedeelte van de gastoevoerleiding van de CNG-tanks naar de motor dat is aangebracht onder het
      passagiersverblijf bevindt zich in een voldoende geventileerde mantelpijp.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14m
  - number: 14n
    text: |-
      1 De manometer is aangebracht in het gedeelte van de CNG-installatie waar de ongeregelde tankdruk kan worden
      gemeten.

      2 De manometer is eenvoudig afleesbaar.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14n
  - number: 14o
    text: |-
      De vulaansluiting van een CNG-tank:

      a. bevindt zich aan dek in de buitenlucht; en

      b. is beschermd tegen vuil en water.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14o
  - number: 14p
    text: |-
      1 Een gasleiding voor CNG waarin de druk hoger kan zijn dan 2500 Kpa:

      a. heeft een buitendiameter van niet meer dan 12 mm;

      b. is van naadloos roestvast staal; en

      c. voldoet aan de op het moment van installatie voor dergelijke gasleidingen geldende normen van ISO 2604-2.

      2 Een gasleiding voor CNG waarin de druk hoger kan zijn dan 50 Kpa:

      a. is van naadloos roestvast staal of naadloos koper;

      b. heeft een buitendiameter van niet meer dan 12 mm; en

      c. heeft een wanddikte van tenminste 0,8 mm.

      3 Ten aanzien van een roestvaststalen gasleiding als bedoeld in het eerste lid is voorzien in een
      inspectiecertificaat volgens de op het moment van afgifte van het certificaat geldende normen van NEN-EN 10204 -
      3.1.B, of een gelijkwaardig testrapport.

      4 Indien het gebruik van gasleidingen om constructietechnische redenen niet goed mogelijk is, is het toegestaan
      over korte afstanden gebruik te maken van door het hoofd van de scheepvaartinspectie goedgekeurde gasslangen.

      5 Gasslangen zijn niet langer dan één jaar geleden geproduceerd. Indien alleen het produktiejaar is vermeld, geldt
      31 december van dat jaar als produktiedatum.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14p
  - number: 14q
    text: |-
      1 Gasleidingen voor CNG worden niet bevestigd met aluminium bevestigingsmiddelen of door middel van lassen of
      solderen.

      2 Gasleidingen zijn niet onderhevig aan spanning of trillingen anders dan die van het vaartuig zelf.

      3 Gasslangen zijn niet onderhevig aan spanningen.

      4 Roestvaststalen gasleidingen worden vast ingebouwd met tenminste iedere 0.60 m een bevestigingspunt.

      5 Koperen gasleidingen worden vast ingebouwd met tenminste iedere 0.40 m een bevestigingspunt.

      6 Op bevestigingspunten is de gasleiding voorzien van beschermend materiaal.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14q
  - number: 14r
    text: |-
      1 Gasvoerende soldeerverbindingen en gasvoerende snijringverbindingen in gasleidingen voor CNG zijn niet
      toegestaan.

      2 Roestvaststalen gasleidingen worden verbonden door middel van roestvaststalen fittingen.

      3 Lasverbindingen tussen roestvaststalen gasleidingen zijn toegestaan indien uit röntgenonderzoek gebleken is dat
      de verbindingen veilig zijn. Een daarvan getuigend certificaat, afgegeven door een daartoe door het hoofd van de
      scheepvaartinspectie erkende instantie, wordt overgelegd.

      4 Koperen gasleidingen worden verbonden door middel van een fitting van corrosiebestendig metaal.

      5 Verdeelblokken zijn van corrosiebestendig metaal.

      6 Stalen gasleidingen worden aangesloten door middel van daartoe geschikte knelringverbindingen.

      7 Koperen gasleidingen worden aangesloten door middel van daartoe geschikte dubbelconische ringen of dubbele
      flenzen.

      8 Het aantal verbindingen is zo klein mogelijk.

      9 De verbindingen zijn op een voor controle toegankelijke plaats aangebracht.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14r
  - number: 14s
    text: |-
      1 De CNG-installatie heeft ten hoogste twee handafsluiters.

      2 Een handafsluiter dient als:

      a. extra veiligheidsafsluiter; of

      b. testafsluiter.

      3 De handafsluiter, genoemd in het tweede lid, onder a, is gemonteerd voor de automatische afsluitklep.

      4 De handafsluiter, genoemd in het tweede lid, onder b, is voldoende beveiligd tegen gebruik door onbevoegden.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14s
  - number: 14t
    text: |-
      1 Het onderhoud van de CNG-installatie geschiedt conform een met de fabrikant of de leverancier van de CNG-
      installatie overeengekomen onderhoudsprogramma.

      2 Het onderhoudsprogramma voorziet tenminste in een regelmatige controle van de CNG-installatie.

      3 Het onderhoudsprogramma voorziet in een periodieke keuring van de CNG-tanks en vermeldt de daarbij toe te passen
      testmethode en de afkeuringscriteria.

      4 Een kopie van de beschrijving van het onderhoudsprogramma wordt binnen drie maanden na ingebruikname van de CNG-
      installatie toegezonden aan het hoofd van de scheepvaartinspectie.

      5 Het hoofd van de scheepvaartinspectie kan het onderhoudsprogramma aanpassen voor zover uitvoering van het
      onderhoudsprogramma de veiligheid van het gebruik van de CNG-installatie naar zijn redelijk oordeel onvoldoende
      waarborgt.

      6 De resultaten van een controle als bedoeld in het tweede lid en de resultaten van een periodieke keuring als
      bedoeld in het derde lid worden aangetekend bij de beschrijving van het onderhoudsprogramma, onder vermelding
      van de datum waarop de controle of de keuring is gehouden of geëindigd en de naam van degene onder wiens
      verantwoordelijkheid de controle of de keuring heeft plaatsgevonden. Deze ondertekend de aantekening.

      7 Indien een CNG-tank geheel of gedeeltelijk wordt afgekeurd stelt de eigenaar het hoofd van de
      scheepvaartinspectie hiervan onverwijld op de hoogte.

      8 De beschrijving van het onderhoudsprogramma bevindt zich aan boord.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14t
  - number: '15'
    text: |-
      Het uitzicht vanuit de stuurstand moet in alle richtingen voldoende vrij zijn.

      Het uitzicht naar achter mag met behulp van betrouwbare optische hulpmiddelen mogelijk worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel15
  - number: '16'
    text: |-
      Voor de dompelpomp als bedoeld in artikel 5.06, derde lid van [bijlage II van het Binnenschepenbesluit][ref1],
      wordt een capaciteit van 3000 l/uur voldoende geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004196
  - number: '17'
    text: |-
      1 In aanvulling op [artikel 43 van het Binnenschepenbesluit][ref1] zijn de artikelen 4, 5 en 15 van deze regeling
      gedurende 5 jaar vanaf het moment van het eerste onderzoek niet van toepassing bij het onderzoek van bestaande
      schepen.

      2 In aanvulling op [artikel 42 van het Binnenschepenbesluit][ref2] zijn de artikelen 7, 10, 11, eerste lid, 12
      en 14, eerste en tweede lid, van deze regeling niet van toepassing bij het onderzoek van bestaande schepen, mits
      voorzieningen zijn getroffen, die naar het redelijk oordeel van het hoofd van de scheepvaartinspectie voldoende
      waarborg bieden voor de veiligheid van het schip en de opvarenden, dan wel naar het redelijk oordeel van het hoofd
      van de scheepvaartinspectie in overeenstemming met het bevoegde districtshoofd van de arbeidsinspectie voldoende
      waarborg bieden voor de veiligheid, de gezondheid en het welzijn in verband met de arbeid aan boord.

      3 Indien op bestaande schepen niet aan de regelen van [artikel 6][ref3] wordt voldaan, kan het hoofd van de
      scheepvaartinspectie het maximaal toegestane aantal passagiers op het schip ofwel in de betrokken ruimte beperken.

      4 De [artikelen 14, vierde en zesde lid][ref4], [14e, eerste en tweede lid][ref5], en [14t, derde lid][ref6], zijn
      niet van toepassing op rondvaartboten waarvan het tijdstip van aanvang van de bouw gelegen is voor 1 juli 1996.

      5 De [artikelen 14, vijfde en zesde lid][ref7], [14e, eerste en tweede lid][ref8], en [14t, derde lid][ref9], zijn
      niet van toepassing op rondvaartboten waarvan het tijdstip van aanvang van de inbouw van de CNG-installatie gelegen
      is voor 1 juli 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel43
