  - number: 14c
    text: |-
      De onderdelen van de CNG-installatie zijn bestand tegen de hoogste druk die onder normale bedrijfsomstandigheden
      kan optreden in het gedeelte van de CNG-installatie waar een onderdeel is aangebracht.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14c
  - number: 14d
    text: |-
      1 De functies van de onderdelen, bedoeld in [artikel 14b, eerste, tweede en derde lid][ref1], worden niet in één
      onderdeel gecombineerd.

      2 In afwijking van het eerste lid, kunnen de functies van de volgende onderdelen in één onderdeel worden
      gecombineerd:

      a. de overdrukbeveiliging ten behoeve van de CNG-tank, genoemd in [artikel 14a, tweede lid, onder b][ref2], met de
      automatische tankafsluiter, genoemd in [artikel 14 a, tweede lid, onder c][ref3];

      b. de warmtewisselaar en drukregelaar, genoemd in [artikel 14a, tweede lid, onder e][ref4], met de automatische
      afsluitklep, genoemd in [artikel 14a, tweede lid, onder f][ref5];

      c. de CNG-filtereenheid, genoemd in artikel 14a, derde lid, onder d, met de onderdelen, genoemd in
      [artikel 14a, tweede lid, onder c, d, e, f, g en j][ref6], alsmede met de onderdelen, genoemd in
      [artikel 14a, derde lid, onder a, c, en e][ref7];

      d. de druk- of temperatuursensor, genoemd in artikel 14a, derde lid, onder e, met de onderdelen, genoemd
      in [artikel 14a, tweede lid, onder c, d, e, f, g, en j][ref8], alsmede met de onderdelen, genoemd in
      [artikel 14a, derde lid, onder a, c, en d][ref9].


