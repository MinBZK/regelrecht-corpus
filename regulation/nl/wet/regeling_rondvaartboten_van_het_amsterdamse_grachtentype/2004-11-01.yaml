  - number: '2'
    text: |-
      Met inachtneming van het bepaalde in deze regeling zijn onderstaande regelen van bijlage III van het

      [Binnenschepenbesluit][ref1] niet van toepassing op rondvaartboten van het Amsterdamse grachtentype:

      artikel 6.01;

      artikel 7.02;

      artikel 8.01;

      artikel 8.04;

      artikel 9.08;

      artikel 9.09;

      artikel 9.11;

      artikel 10.03;

      artikel 10.08;

      artikel 10.10.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004196
  - number: '3'
    text: |-
      In aanvulling op het bepaalde in artikel 1.02, derde en vierde lid, van
      [bijlage III van het Binnenschepenbesluit][ref1] en met inachtneming van het bepaalde in deze regeling zijn
      onderstaande regelen van [bijlage II van het Binnenschepenbesluit][ref2] niet van toepassing op rondvaartboten van
      het Amsterdamse grachtentype:

      artikel 2.02, derde lid;

      artikel 3.14;

      artikel 5.01, derde lid, eerste volzin, voor zover van toepassing op de hoofdmotor;

      artikel 7.01;

      artikel 7.02, eerste lid, sub d, e, f, g, i, j, k, l en m;

      artikel 7.03, eerste lid;

      artikel 7.05, eerste lid;

      artikel 11.15, derde lid;

      artikel 11.16, tweede lid, betreffende hekwerk of verschansing.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
      [ref2]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004196
      - id: ref2
        bwb_id: BWBR0004196
  - number: '4'
    text: |-
      1 Het ten hoogste toegestane aantal passagiers wordt zodanig vastgesteld dat aan de regelen met betrekking tot de
      stabiliteit en het vrijboord wordt voldaan.

      2 Het ten hoogste toegestane aantal passagiers mag echter niet groter zijn dan het aantal voor passagiers
      beschikbare zitplaatsen.

      3 Voor de zitplaatsen moet worden gerekend met een breedte van tenminste 0,45 m per persoon. De onderlinge vrije
      afstand tussen banken of zitplaatsen moet tenminste 0,30 m bedragen.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel4
  - number: '5'
    text: |-
      Indien passagiers plaats kunnen nemen in een open kuip of op een open dek, moeten de vaste verschansingen of
      relingen tenminste 0,20 m binnen de buitenzijde van het schip, berghouten daarbij inbegrepen, worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel5
  - number: '6'
    text: |-
      1 De vrije doorgang van de toegangen moet minimaal 0,80 m bedragen. De vrije breedte van het gangpad tussen de
      stoelen moet op een hoogte van 0,90 m en meer boven de vloer tenminste 0,70 m bedragen. Tot een hoogte van 0,90 m
      boven de vloer mag deze breedte nergens minder dan 0,60 m bedragen.

      2 In het achterschip moet een nooduitgang met een vrije doorgang van tenminste 0,80 m zijn aangebracht. De
      nooduitgang mag worden vervangen door tenminste twee uitwerpbare noodluiken in het dak. Elke nooduitgang in het dak
      moet een vrije opening van tenminste 0,36 m² hebben.

      Daarbij mag de kleinste afmeting niet minder dan 0,50 m bedragen.

      3 Indien een passagiersaccommodatie door middel van waterdichte schotten en waterdichte deuren van beperkte hoogte
      wordt onderverdeeld in waterdichte compartimenten moeten deze compartimenten veilig kunnen worden verlaten. Daarbij
      mag de vluchtweg vanuit het ene via een ander compartiment lopen.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel6
  - number: '7'
    text: |-
      De constructie van de ramen moet van voldoende sterkte zijn, afhankelijk van de hoogte boven de geladen lastlijn en
      van de zone van het vaarwater.

      Hieraan wordt geacht te zijn voldaan wanneer de constructie van de ramen voldoet aan de regelen van de bijlage.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel7
  - number: '8'
    text: |-
      Per elk toegestaan aantal van 25 passagiers, alsmede voor het aantal dat daarboven resteert, moet tenminste een
      reddingboei aanwezig zijn. Het aantal reddingboeien behoeft echter niet meer dan vier te bedragen.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel8
  - number: '9'
    text: |-
      1 Er moeten tenminste twee draagbare blustoestellen aanwezig zijn. Deze moeten in de nabijheid van de stuurstand
      zijn opgesteld. De regelen van artikel 7.03, tweede lid, van [bijlage II van het Binnenschepenbesluit][ref1] zijn
      van overeenkomstige toepassing.

      2 Indien de rondvaartboot is voorzien van een CNG-installatie is de ruimte waarin de voortstuwingsmotor is
      geplaatst voorzien van een vast opgestelde brandblusinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004196
  - number: '10'
    text: |-
      Bij gebruik op de binnenwateren van zone 3 moeten de schepen zijn voorzien van een anker met een gewicht van
      tenminste 50 kg en een ankerketting of ankerdraad met een lengte van tenminste 30 m. Het ankergewicht mag worden
      verminderd bij toepassing van bijzondere ankertypen met verhoogde houdkracht.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel10
  - number: '11'
    text: |-
      1 De volgende waterdichte schotten, die reiken tot de bovenkant van het scheepsboord moeten zijn aangebracht:

      a. een aanvaringsschot, gelegen op tenminste 0,10 m en ten hoogste 0,60 m achter de voorloodlijn;

      b. een schot tussen de machinekamer en de passagiersruimte;

      c. een achterpiekschot op een redelijke afstand van de achtersteven. Op schepen met een lengte van 25 m of minder
      mag het achterpiekschot achterwege worden gelaten.

      2 Indien de rondvaartboot is voorzien van een CNG-installatie zijn doorvoeringen door schotten gasdicht.

      Doorvoeringen door het machinekamerschot zijn tevens brandwerend.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel11
  - number: '12'
    text: |-
      Buitenboordaansluitingen moeten direct op de huid zijn voorzien van een afsluiter. Dit geldt niet voor toiletten
      die zijn voorzien van een metalen pot, gemonteerd op een dikwandige stalen pijp, zodanig dat de bovenrand van de
      pot een veiligheidsafstand van tenminste 0,40 m heeft.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel12
  - number: '13'
    text: |-
      In afwijking van de regelen van artikel 2.06, zesde lid, van [bijlage II van het Binnenschepenbesluit][ref1] kan
      worden volstaan met slechts één uitgang indien

        - de vluchtweg vanaf elke bedieningsplaats naar de uitgangsdeur die naar de buitenlucht voert, niet meer dan 5 m
      lang is, en
        - bij de plaats waar onderhoud moet worden verricht, die het verst van de uitgang is verwijderd, een draagbaar
      blustoestel aanwezig is, ook indien het geïnstalleerde vermogen niet meer dan 110 Kw bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004196
  - number: '14'
    text: |-
      1 Het vermogen van de voortstuwingsinstallatie moet zodanig zijn, dat het volbeladen schip bij vol vermogen
      varende, tot stilstand kan komen in een vaarweg van ten hoogste twee maal de lengte van het schip.

      2 Vanaf de stuurstand moeten afgelezen kunnen worden

        - de temperatuur van het koelwater en de druk van de smeerolie van voortstuwingsmotoren en
        - het toerental van voortstuwingsmotoren of schroefassen.

      3 Indien de voortstuwingsmotor gebruik maakt van brandstof met een vlampunt beneden 55 °C:

      a. wordt CNG gebruikt als brandstof; en

      b. wordt de voortstuwingsmotor voorzien van brandstof door middel van een CNG-installatie.

      4 Indien een rondvaartboot van het Amsterdamse grachtentype tijdens de bouw voorzien wordt van een CNG-installatie,
      zijn de constructietekeningen voor de aanvang van de bouw goedgekeurd door het hoofd van de scheepvaartinspectie.

      5 Indien een rondvaartboot van het Amsterdamse grachtentype voorzien wordt van een CNG-installatie zijn de
      constructietekeningen van de CNG-installatie zelf en de constructietekeningen voor de inbouw daarvan, voor aanvang
      van de inbouw, goedgekeurd door het hoofd van de scheepvaartinspectie.

      6 De goedkeuring, bedoeld in het vierde en vijfde lid, wordt verleend indien naar het redelijk oordeel van het
      hoofd van de scheepvaartinspectie de veiligheid van de rondvaartboot en de opvarenden, voor zover deze verband
      houdt met de constructie en wijze van inbouw van de CNG-installatie, voldoende gewaarborgd zal zijn.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14
  - number: 14a
    text: |-
      1 De CNG-installatie bevat uitsluitend de onderdelen, bedoeld in dit artikel.

      2 De CNG-installatie bestaat tenminste uit de volgende onderdelen:

      a. een CNG-tank;

      b. een overdrukbeveiliging ten behoeve van de CNG-tank;

      c. een automatische tankafsluiter;

      d. een manometer;

      e. een warmtewisselaar en drukregelaar, eventueel gecombineerd;

      f. een automatische afsluitklep;

      g. een vulaansluiting;

      h. een terugslagklep in de vulleiding;

      i. gasleidingen;

      j. een inspuitstuk of gasmengstuk; en

      k. gasvoerende verbindingen tussen de onderdelen van de CNG-installatie.

      3 De volgende onderdelen kunnen deel uitmaken van de CNG-installatie:

      a. een handafsluiter;

      b. gasslangen;

      c. een gasregeleenheid;

      d. een CNG-filtereenheid;

      e. een druk- of temperatuursensor; en

      f. elektrische voorzieningen.

      4 In het gedeelte van de CNG-installatie waar de druk lager is dan 50 kPa kunnen extra onderdelen ten behoeve van
      het goed functioneren van de motor worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0004942/2004-11-01#Artikel14a
  - number: 14b
    text: |-
      1 De onderdelen, genoemd in [artikel 14a, tweede lid, onder a tot en met h, en derde lid, onder a en e][ref1],
      voldoen aan de voor de desbetreffende onderdelen vastgestelde normen van het op het moment van installatie geldende
      ECE-Reglement Nr. 67.

      2 De onderdelen, genoemd in [artikel 14a, tweede lid, onder i en j, en derde lid, onder b, c en d][ref2], voldoen
      aan de voor de desbetreffende onderdelen vastgestelde normen van het op het moment van installatie geldende ECE-
      Reglement Nr. 67, voor zover deze onderdelen gebruikt worden in een gedeelte van de CNG-installatie waar de druk
      hoger kan zijn dan 50 Kpa.

      3 Onderdelen waarvoor in het op het moment van installatie geldende ECE-Reglement Nr. 67 geen normen zijn
      opgenomen en die gebruikt worden in een gedeelte van de CNG-installatie waar de druk hoger kan zijn dan 50 Kpa zijn
      goedgekeurd door het hoofd van de scheepvaartinspectie.

      4 De onderdelen, bedoeld in het eerste en tweede lid, zijn voorzien van een geldig goedkeuringsmerk ECE-Reglement
      Nr. 67 als bedoeld in bijlage 2 van de Regeling toelatingseisen, tenzij dit als gevolg van aard of functie van het
      onderdeel niet mogelijk is.

      5 Een onderdeel als bedoeld in het eerste en tweede lid wordt vermeld op een aan boord aanwezige lijst, onder
      vermelding van de gegevens van het goedkeuringsmerk, genoemd in het vierde lid.

      6 Een onderdeel als bedoeld in het derde lid, wordt vermeld op een aan boord aanwezige lijst, onder vermelding van
      de merknaam en de typeaanduiding en voorzien van een stempel ten teken van de goedkeuring, bedoeld in het derde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004942#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0004942#Artikel14a
