preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om het aantal uitzonderingsbepalingen in enkele
    socialezekerheidswetten terug te brengen en deze wetten te vereenvoudigen om zo de kosten gemoeid met de uitvoering
    te verlagen en tegelijkertijd de transparantie, de doelmatigheid en eigen verantwoordelijkheid voor de burger te
    bevorderen.

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0033114/2013-07-01#ArtikelAanhef
articles:
  - number: XI
    text: |-
      1 De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld, en kunnen terugwerken tot en met
      een in dat besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan
      worden vastgesteld.

      2 Bij het vaststellen van het in het eerste lid genoemde tijdstip van inwerkingtreding van [artikel II][ref1] wordt
      in acht genomen dat dat artikel voor personen die voor de datum van uitgifte van het Staatsblad waarin deze wet
      wordt geplaatst recht hebben op een halfwezenuitkering niet eerder in werking treedt dan zes maanden na die datum
      van uitgifte.


      [ref1]: https://wetten.overheid.nl/BWBR0033114#ArtikelII
    url: https://wetten.overheid.nl/BWBR0033114/2013-07-01#ArtikelXI
