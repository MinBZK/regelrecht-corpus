    text: |-
      1 Deze regeling verstaat onder wet: [Wet verplaatsing mestproductie][ref1].

      2 Deze regeling berust mede op de [artikelen 2, derde lid][ref2], en
      [6, eerste lid, van het Besluit administratieve verplichtingen Meststoffenwet][ref3].


