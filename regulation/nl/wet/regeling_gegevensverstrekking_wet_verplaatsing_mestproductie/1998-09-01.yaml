        artikel: '6'
  - number: '3'
    text: |-
      1 Voor zover zich met betrekking tot het bedrijf waarvandaan wordt verplaatst of het bedrijf waarheen wordt
      verplaatst wijzigingen hebben voorgedaan welke gevolgen kunnen hebben voor de omvang van het mestproductierecht
      of van het niet-gebonden mestproductierecht dan wel welke gevolgen kunnen hebben voor wat betreft de persoon, de
      rechtspersoon of het samenwerkingsverband van personen of rechtspersonen, die onderscheidenlijk dat aanspraak op
      het mestproductierecht kan maken, wordt hiervan door de betrokkenen uiterlijk tegelijk met de kennisgeving, bedoeld
      in artikel 9, eerste lid, of 10, eerste lid, van de wet, melding gedaan aan het Bureau Heffingen, met gebruikmaking
      van een daartoe door de Minister van Landbouw, Natuurbeheer en Visserij, vastgesteld formulier, dat overeenkomstig
      de daarbij aangegeven wijze volledig en naar waarheid is ingevuld, ondertekend en gedagtekend.

      2 Bij het in het eerste lid bedoelde formulier worden alle documenten overgelegd welke in het formulier worden
      gevraagd.

      3 Indien op grond van de bij of krachtens het [Besluit administratieve verplichtingen Meststoffenwet][ref1]
      gestelde regelen een kortere termijn geldt voor de in het eerste lid bedoelde melding, dan geschiedt, in zoverre in
      afwijking van het eerste lid, de melding binnen die termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009000
    url: https://wetten.overheid.nl/BWBR0006344/1998-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009000
  - number: '4'
    text: |-
      1 Naast de op grond van de wet en de daarop berustende bepalingen te verstrekken gegevens, verstrekken de
      betrokkenen bij de kennisgeving, bedoeld in artikel 9, eerste lid, of 10, eerste lid, van de wet alsmede de derde-
      belanghebbenden, bedoeld in artikel 12 van de wet, op verzoek van het Bureau Heffingen alle gegevens welke het
      nodig heeft ter uitvoering van de wet.

      2 Door de betrokkenen en derde-belanghebbenden worden in hun administratie de gegevens bijgehouden en de documenten
      bewaard waaruit de juistheid van de op grond van de wet en de daarop berustende bepalingen verstrekte gegevens
      blijkt, en wel tot vijf jaren na afloop van het kalenderjaar waarin de gegevens werden verstrekt.

      3 Onverminderd de voorgaande bepalingen houdt de producent ter uitvoering van de wet met betrekking tot het
      bedrijf waarheen wordt verplaatst, een administratie bij overeenkomstig artikel 13 van de Regeling administratieve
      verplichtingen Meststoffenwet.
    url: https://wetten.overheid.nl/BWBR0006344/1998-09-01#Artikel4
  - number: '6'
    text: Deze regeling treedt in werking met ingang van de datum van inwerkingtreding van de wet.
