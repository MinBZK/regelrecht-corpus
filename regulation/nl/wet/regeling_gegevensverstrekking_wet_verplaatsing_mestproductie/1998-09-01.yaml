  text: |-
    Gelet op artikel 11, vierde lid, onderdelen b en d, en artikel 13 van de Wet verplaatsing mestproductie;

    Gezien de adviezen van het Produktschap voor Veevoeder, het Produktschap Vee en Vlees, het Produktschap voor
    Pluimvee en Eieren, het Produktschap voor Zuivel en het Landbouwschap;

    Besluit:
