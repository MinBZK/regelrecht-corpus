$id: regeling_grenswaarden_luchtemissies_vcm_inrichtingen_milieubeheer
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2000-07-20'
bwb_id: BWBR0011473
url: https://wetten.overheid.nl/BWBR0011473/2000-07-20
preamble:
  text: |-
    Gelet op OSPAR-Besluit 98/4 inzake de grenswaarden voor emissie en lozing bij de productie van vinylchloride-
    monomeer (VCM), met inbegrip van de productie van 1,2-dichloorethaan (EDC) (OSPAR 98/14/1 para B-8.2 en annex 39)
    en op artikel 8.44 juncto artikel 21.6, zesde lid, van de Wet milieubeheer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011473/2000-07-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *VCM:*


              vinylchloride-monomeer;



            b

              *EDC:*


              1,2-dichloorethaan;



            c

              *dioxines:*


              polychloordibenzo-p-dioxines en polychloordibenzofuranen, uitgedrukt in toxiciteitsequivalenten (TEQ);



            d

              *productie van VCM:*


              elk industrieel proces waarbij VCM wordt geproduceerd;



            e

              *productie van EDC:*


              elk industrieel proces waarbij EDC wordt geproduceerd;



            f

              *VCM-inrichting:*


              een inrichting die VCM of EDC produceert uit etheen en chloor of uit etheen of waterstofchloride als
      grondstof;



            g

              *diffuse emissie:*


              niet-gekanaliseerde emissie naar de lucht als gevolg van lekverliezen;



            h
             bijlage:

              bij deze regeling behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0011473/2000-07-20#Artikel1
  - number: '2.1'
    text: |-
      Degene die de inrichting drijft, draagt er zorg voor dat gassen die afkomstig zijn uit puntbronnen van installaties
      en procesapparatuur in een VCM-inrichting, worden verzameld en behandeld in een verbrandingsinstallatie of in
      apparatuur met een vergelijkbaar rendement.
    url: https://wetten.overheid.nl/BWBR0011473/2000-07-20#Artikel2
  - number: '2.2'
    text: |-
      Degene die de inrichting drijft, draagt er zorg voor dat het maximale jaarlijkse gemiddelde van de uitworp van
      rookgassen uit de in een VCM-inrichting aanwezige verbrandingsinstallatie of apparatuur met een vergelijkbaar
      rendement voldoet aan de in [bijlage I][ref1] opgenomen grenswaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0011473
    url: https://wetten.overheid.nl/BWBR0011473/2000-07-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011473
  - number: '2.3'
    text: |-
      Degene die de inrichting drijft, draagt er zorg voor dat aan de in [bijlage I][ref1] opgenomen grenswaarden niet
      door middel van verdunning van de emissies wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011473
    url: https://wetten.overheid.nl/BWBR0011473/2000-07-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011473
  - number: '2.4'
    text: |-
      Degene die de inrichting drijft, draagt er zorg voor dat diffuse emissies naar de lucht tot een minimum worden
      beperkt.
    url: https://wetten.overheid.nl/BWBR0011473/2000-07-20#Artikel2
  - number: '3'
    text: |-
      Degene die de inrichting drijft, draagt er zorg voor dat de wijze van bemonsteren, meten en analyseren van de
      concentraties en vrachten voor de stoffen waarvoor in [bijlage I][ref1] grenswaarden zijn vastgesteld, ten minste
      voldoen aan de in [bijlage II][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0011473
      [ref2]: https://wetten.overheid.nl/BWBR0011473
    url: https://wetten.overheid.nl/BWBR0011473/2000-07-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011473
      - id: ref2
        bwb_id: BWBR0011473
  - number: '4.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0011473/2000-07-20#Artikel4
  - number: '4.2'
    text: |-
      Deze regeling blijft tot 1 januari 2006 buiten toepassing voor een VCM-inrichting, waaraan
      vóór de datum van inwerkingtreding van deze regeling een vergunning is verleend op grond van
      [artikel 8.1 van de Wet milieubeheer][ref1], tenzij na die datum naar het oordeel van het bevoegd gezag de
      capaciteit voor het produceren van VCM en EDC aanzienlijk is uitgebreid of aanzienlijke technische wijzigingen van
      het productieproces hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0011473/2000-07-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Regeling grenswaarden luchtemissies VCM-inrichtingen milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0011473/2000-07-20#Artikel5
