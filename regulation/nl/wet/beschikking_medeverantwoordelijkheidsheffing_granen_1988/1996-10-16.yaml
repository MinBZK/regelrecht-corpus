---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: beschikking_medeverantwoordelijkheidsheffing_granen_1988
regulatory_layer: WET
publication_date: '2004-01-22'
valid_from: '1996-10-16'
bwb_id: BWBR0004358
url: https://wetten.overheid.nl/BWBR0004358/1996-10-16
preamble:
  text: |-
    Overwegende dat bij Verordening (EEG) nr. 1097/88 van de Raad van de Europese Gemeenschappen (Pb EG nr. L 110)
    tot wijziging van Verordening (EEG) nr. 2727/75, houdende de gemeenschappelijke ordening der markten in de sector
    granen het stelsel van de medeverantwoordelijkheidsheffing granen, is gewijzigd; dat derhalve nieuwe regelingen
    moeten worden vastgesteld;

    Gelet op de artikelen 13, 19, 23, 27 en 28 van de Landbouwwet (Stb. 1957, 342) en op de artikelen 5 en 6 van het In
    en Uitvoerbesluit landbouwgoederen 1980 (Stb. 758);

    Gehoord het Hoofdproduktschap voor Akkerbouwprodukten en het Landbouwschap;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze beschikking wordt verstaan onder:


              *de Minister van Landbouw, Natuurbeheer en Visserij:*


              minister van Landbouw en Visserij;




              *hoofdproduktschap:*


              Hoofdproduktschap voor Akkerbouwprodukten;




              *EG-verordeningen:*


              [artikelen 4][ref1] en [4][ref2] ter van [Verordening (EEG) nr. 2727/75](31975R2727), zoals vastgesteld
      bij [Verordening (EEG) nr. 1097/88](31988R1097) van de Raad van de Europese Gemeenschappen van 25 april 1988 (Pb.
      EG nr. 110/7) en de door de Raad of de Commissie van de Europese Gemeenschappen ter uitvoering daarvan vastgestelde
      verordeningen;




              *granen:*


              granen, bedoeld in artikel 1, onderdelen a en b van [Verordening (EEG) nr. 2727/75](31975R2727) (Pb. EG L
      131), al dan niet in verwerkte vorm;




              *interventiebureau:*


              de minister, alsmede het interventieorgaan aangewezen in enige andere lid-staat;




              *lid-staat:*


              staat, niet zijnde Nederland, die als lid deel uitmaakt van de Europese Gemeenschappen;




              *derde land:*


              land, dat geen lid is van de Europese Gemeenschappen;




              *producent:*


              teler van granen;




              *koper:*


              degene die granen koopt, als bedoeld in artikel 1, tweede lid, van [Verordening (EEG) nr. 1432/88]
      (31988R1432);




              *verkoopseizoen:*


              periode aanvangend op 1 juli van ieder jaar en eindigend op 30 juni van het daaropvolgend jaar;




              *landbouwbedrijf:*


              een onderneming waar bedrijfsmatig de landbouw wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0004358#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004358#Artikel4
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004358
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004358
        artikel: '4'
  - number: '2.1'
    text: |-
      De producent is ter zake van de levering van granen aan een koper alsmede ter zake van de uitvoer van granen naar
      een andere lid-staat, niet zijnde België of Luxemburg, danwel naar een derde land, een heffing alsmede een extra-
      heffing verschuldigd.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel2
  - number: '2.2'
    text: |-
      Het bedrag van de heffing alsmede de extra-heffing wordt vastgesteld met inachtneming van de grondslagen en hetgeen
      overigens te dier zake in de EG-verordeningen is bepaald.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel2
  - number: '2.3'
    text: |-
      De heffing alsmede de extra-heffing is niet verschuldigd voor een bedrag ter grootte van het bedrag, dat de koper
      ter zake van de betrokken levering ingevolge [artikel 4][ref1] aan heffing alsmede extra-heffing is verschuldigd en
      afdraagt en dat hij op de koopprijs in mindering brengt .


      [ref1]: https://wetten.overheid.nl/BWBR0004358#Artikel4
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004358
        artikel: '4'
  - number: '3.1'
    text: |-
      De koper is ter zake van de levering van granen aan hem een heffing alsmede een extra-heffing verschuldigd. De
      eerste zin is niet van toepassing, indien de koper aantoont dat ter zake van die betrokken levering de heffing
      alsmede de extra-heffing is betaald.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel3
  - number: '3.2'
    text: |-
      [Artikel 2, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004358#Artikel2
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004358
        artikel: '2'
  - number: '4'
    text: |-
      De koper is, met het oog op de inning en de afdracht van heffingen als bedoeld in [artikel 2][ref1], een heffing
      alsmede een extra-heffing verschuldigd ter zake van de levering van granen aan hem.


      [ref1]: https://wetten.overheid.nl/BWBR0004358#Artikel2
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004358
        artikel: '2'
  - number: '5.1'
    text: |-
      De koper alsmede de producent die granen in de vorm van verwerkte produkten verkoopt of die granen uitvoert
      naar een andere lid-staat, niet zijnde België of Luxemburg, dan wel naar een derde land, doen aangifte van de
      grondslagen en al hetgeen overigens ingevolge de EG-verordeningen of het bij of krachtens deze beschikking bepaalde
      nodig is voor de vaststelling van die heffingen.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel5
  - number: '5.2'
    text: |-
      De in het eerste lid bedoelde aangifte dient in ieder geval per transactie onder vermelding van naam en adres van
      de producent die de granen heeft geleverd te worden gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel5
  - number: '6.1'
    text: |-
      Ter zake van de levering van granen bestemd voor zaaidoeleinden die overeenkomstig [Richtlijn 66/402/EEG]
      (31966L0402) (Pb. EG L 125 rectificatie L 229) van de Raad van de Europese Gemeenschappen worden gecertificeerd en
      als zaaigoed worden verkocht, is de heffing alsmede de extra-heffing als bedoeld in de artikellen 2 tot en met 4
      niet verschuldigd voor een door toepassing van een coëfficiënt te bepalen forfaitaire hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel6
  - number: '6.2'
    text: |-
      Het hoofdproduktschap stelt voor de aanvang van ieder verkoopseizoen de in het eerste lid bedoelde coëfficient
      vast per graansoort op basis van de verhouding tussen de hoeveelheid gecertificeerd zaaigoed die is verkocht en de
      hoeveelheid die op basis van een vermeerderingscontract is gekocht.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel6
  - number: '6.3'
    text: |-
      Ter zake van de verkoop door de producent van gehakselde maiskolven, die geoogst zijn met het oog op het inkuilen
      daarvan op een landbouwbedrijf, is de heffing alsmede de extra-heffing als bedoeld in de [artikelen 2][ref1] tot en
      met [4][ref2] niet verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004358#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004358#Artikel4
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004358
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004358
        artikel: '4'
  - number: '7.1'
    text: |-
      Het hoofdproduktschap is belast met de vaststelling en de inning van de heffing alsmede de extra-heffing als
      bedoeld in de [artikelen 2][ref1] tot en met [4][ref2]. De aangifte als bedoeld in [artikel 5][ref3] wordt bij het
      hoofdproduktschap gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004358#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004358#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004358#Artikel5
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004358
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004358
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0004358
        artikel: '5'
  - number: '7.2'
    text: |-
      Bij verkoop voor interventie door een producent wordt de heffing alsmede de extra-heffing geïnd bij de betaling
      van de aankoopprijs door het interventiebureau. De in het eerste lid bedoelde aangifte behoeft in dit geval niet te
      worden gedaan.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel7
  - number: '7.3'
    text: |-
      Het hoofdproduktschap regelt, met inachtneming van de EG-verordeningen en, zo nodig, de aanwijzingen van de
      minister, al hetgeen overigens voor een goede uitvoering van deze beschikking is vereist.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel7
  - number: '7.4'
    text: De geïnde heffingen vormen onderdeel van de afdeling B van het Landbouw-Egalisatiefonds.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel7
  - number: '8.1'
    text: |-
      De koper die op grond van de [artikelen 3][ref1] en [4][ref2] een heffing alsmede een extra-heffing is
      verschuldigd, is belast met de terugbetaling van het verschil tussen de betaalde extra-heffing en de tijdens of na
      afloop van het verkoopseizoen door de EG definitief vastgestelde verschuldigde extra-heffing aan de producent die
      de granen aan hem heeft geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0004358#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004358#Artikel4
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004358
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004358
        artikel: '4'
  - number: '8.2'
    text: |-
      Deze terugbetaling dient binnen de in de EG-verschuldigde ter zake gestelde termijn te worden verricht. De
      terugbetaling geschiedt aan de hand van de landbouwomrekeningskoers die op het moment van de inning van de extra-
      heffing gold.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel8
  - number: '8.3'
    text: |-
      In afwijking van het bepaalde in het eerste lid is het Hoofdproduktschap belast met de terugbetaling in het
      verkoopseizoen 1988/1989, voor wat betreft de over de maanden juli en augustus geïnde extra-heffingen, aan de
      producenten. Het bepaalde in [artikel 7, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004358#Artikel7
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004358
        artikel: '7'
  - number: '8.4'
    text: |-
      Het Hoofdproduktschap is belast met de terugbetaling, als bedoeld in het eerste lid, aan producenten, die op
      grond van [artikel 2][ref1] een heffing verschuldigd zijn. Het bepaalde in [artikel 7, derde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004358#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004358#Artikel7
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004358
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004358
        artikel: '7'
  - number: '9.1'
    text: |-
      Degene die ingevolge de [artikelen 2][ref1] tot en met [4][ref2] een heffing als mede een extra-heffing
      verschuldigd is of kan worden, is verplicht aan het hoofdproduktschap, dan wel aan ieder ander, die belast is
      met de uitvoering van de EG-verordeningen of deze beschikking, desgevraagd binnen de daarvoor gestelde termijn,
      zonder voorbehoud en naar waarheid die inlichtingen te verstrekken, welke naar diens oordeel nodig zijn voor de
      vaststelling en de inning van de heffingen dan wel de terugbetaling van de extra-heffing.


      [ref1]: https://wetten.overheid.nl/BWBR0004358#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004358#Artikel4
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004358
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004358
        artikel: '4'
  - number: '9.2'
    text: |-
      Degene die ingevolge de [artikelen 2][ref1] tot en met [4][ref2] een heffing alsmede een extra-heffing is
      verschuldigd of kan worden, is verplicht van alles wat zijn onderneming of bedrijf betreft op zodanige wijze
      aantekening te houden, dat daaruit te allen tijde de produktie, de voorraad, de geleverde hoeveelheden, de ingeval
      van verkoop van granen in verwerkte vorm gebruikte hoeveelheden onverwerkte granen de leveringsdata, naam en adres
      van de leveranciers alsmede de op een en ander betrekking hebbende financiële gegevens kunnen worden gekend, en
      zodanige aantekeningen en gegevens gedurende ten minste drie jaren te bewaren.


      [ref1]: https://wetten.overheid.nl/BWBR0004358#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004358#Artikel4
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004358
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004358
        artikel: '4'
  - number: '9.3'
    text: |-
      De koper is verplicht de ter zake van de inning van de heffingen op de koopprijs in mindering gebrachte heffingen
      op de aan de koop ten grondslag liggende facturen te verantwoorden.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel9
  - number: '9.4'
    text: |-
      De koper die op grond van [artikel 8][ref1] belast is met de in dat artikel bedoelde terugbetaling dient een
      lijst, met vermelding van naam, adres en woonplaats van de producenten die granen aan hem hebben geleverd, van de
      verrichte terugbetalingen bij te houden en deze ter beschikking te houden van het Hoofdproduktschap, dan wel van
      ieder ander, die belast is met de uitvoering van dse EG-Verordeningen en deze beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0004358#Artikel8
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004358
        artikel: '8'
  - number: '10'
    text: De Beschikking medeverantwoordelijkheidheffing granen (Stcrt. 1986, 123) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel10
  - number: '11.1'
    text: |-
      Ter zake van granen, die op het tijdstip van inwerkingtreding van deze beschikking reeds zijn verkocht en waarover
      nog geen heffing verschuldigd op grond van de Beschikking medeverantwoordelijkheidsheffing granen is afgedragen, is
      de heffing verschuldigd, die op 30 juni 1988 van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel11
  - number: '11.2'
    text: Ter zake van granen, die
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel11
  - number: 11.2.a
    text: |-
      voor 1 juli 1988 uit andere lid-staten, met uitzondering van Portugal, zijn uitgevoerd dan wel waarvoor het
      document tot staving van hun communautaire karakter overeenkomstig de EG-verordeningen wordt overgelegd en
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel11
  - number: 11.2.b
    text: na 1 juli 1988 ten verbruike worden aangegeven, is de heffing verschuldigd, die op 30 juni 1988 van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel11
  - number: '11.3'
    text: |-
      Het hoofdproduktschap is belast met de vaststelling en de inning van de over de in het eerste en tweede lid
      bedoelde granen verschuldigde heffing. De aangifte van deze hoeveelheden granen wordt bij het hoofdproduktschap
      gedaan.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel11
  - number: '12.1'
    text: Deze beschikking wordt bekend gemaakt in de Staatscourant en treedt in werking met ingang van 1 juli 1988.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel12
  - number: '12.2'
    text: Zij kan worden aangehaald als ‘Beschikking medeverantwoordelijkheidsheffing granen 1988’.
    url: https://wetten.overheid.nl/BWBR0004358/1996-10-16#Artikel12
