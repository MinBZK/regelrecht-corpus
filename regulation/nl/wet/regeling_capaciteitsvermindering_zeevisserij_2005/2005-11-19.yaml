  - number: '11'
    text: |-
      Ten aanzien van contingenten die zijn toegekend ten behoeve van vaartuigen waarvoor
      subsidie wordt verleend, wordt de periode van aanhouden van een contingent als bedoeld in
      [artikel 14 van de Regeling contingentering zeevis][ref1] vastgesteld op ten hoogste 12 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel14
