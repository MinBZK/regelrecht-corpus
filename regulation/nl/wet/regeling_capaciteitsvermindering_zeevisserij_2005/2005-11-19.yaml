preamble:
  text: |-
    Gelet op de artikelen 7 en 19, tweede lid, van verordening (EG) nr. 2792/1999 van de Raad van de Europese Unie van
    17 december 1999 tot vaststelling van de uitvoeringsbepalingen en voorwaarden voor de structurele acties van de
    Gemeenschap in de visserijsector (PbEG L 337);

    Gelet op de artikelen 2, 4, 6 en 7 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018732/2005-11-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. visvergunning: aan een ondernemer ten aanzien van een vissersvaartuig toegekende visvergunning als bedoeld in
      [artikel 1 van de Regeling visvergunning][ref1];

      c. besluit: [Besluit registratie vissersvaartuigen 1998][ref2];

      d. verordening: [verordening (EG) nr. 2792/1999](31999R2792) van de Raad van de Europese Unie van 17 december 1999
      tot vaststelling van de uitvoeringsbepalingen en voorwaarden voor de structurele acties van de Gemeenschap in de
      visserijsector (PbEG L 337);

      e. vissersvaartuig: vaartuig dat gebruikt wordt voor de uitoefening van de bedrijfsmatige visserij, dat
      overeenkomstig [artikel 1, tweede lid, van de Uitvoeringswet Visserijverdrag 1967][ref3] als Nederlands geldt en
      dat overeenkomstig het bij of krachtens het [besluit][ref4] bepaalde staat geregistreerd;

      f. brutoton: maat ter bepaling van de scheepsinhoud overeenkomstig bijlage I van het op 23 juni 1969 te Londen tot
      stand gekomen Internationaal Verdrag betreffende de meting van schepen (Trb. 1970, 122 en 194);

      g. meetbrief: document als bedoeld in [artikel 4 van de Meetbrievenwet 1981][ref5];

      h. directeur: directeur Visserij van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      i. segment: segment als bedoeld in [artikel 1, eerste lid, onderdeel l, van de Regeling visvergunning][ref6];

      j. lengte over alles: lengte als bedoeld in artikel 2, eerste lid, van [Verordening (EEG) nr. 2930/86]
      (31986R2930) van de Raad van de Europese Gemeenschap van 22 september 1986 houdende definities van de kenmerken van
      vissersvaartuigen (PbEG L 274);

      k. zeedag: aaneengesloten tijdvak van 24 uur waarin een vissersvaartuig niet in de haven ligt;

      l. contingent: contingent als bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Regeling contingentering zeevis][ref7];

      m. garnalenvergunning: vergunning als bedoeld in
      [artikel 11 van de Beschikking visserij visserijzone, zeegebied en kustwateren][ref8] verleend voor het vissen
      met enig vistuig geschikt voor het vangen van garnalen (Crangon, crangon) in de visserijzone, het zeegebied of
      de kustwateren.

      2 Voor de toepassing van deze regeling wordt de leeftijd van een vissersvaartuig bepaald overeenkomstig onderdeel
      1, punt 1.0, van bijlage III van de verordening.

      3 Voor de toepassing van deze regeling is het aantal brutoton dat een vissersvaartuig meet, het aantal brutoton dat
      het vaartuig meet volgens de opgave in de meetbrief.


