  - number: '10'
    text: |-
      In geval van definitieve beëindiging als bedoeld in [artikel 3, tweede lid][ref1], is de subsidieontvanger
      verplicht om ervoor zorg te dragen dat het vissersvaartuig niet op enig tijdstip terugkeert in de hoedanigheid
      van vissersvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0018732#Artikel3
