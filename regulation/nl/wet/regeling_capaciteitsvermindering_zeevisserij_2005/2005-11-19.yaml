  - number: '9'
    text: |-
      1 De subsidieontvanger dient binnen vier weken na afloop van de termijn, bedoeld in [artikel 8, eerste lid][ref1],
      een aanvraag tot subsidievaststelling in bij de directeur op een daartoe door de directeur vastgesteld formulier.

      2 De aanvraag gaat vergezeld van:

      a. een verklaring van een ambtenaar van de Algemene Inspectiedienst dat is voldaan aan:

      1°. [artikel 8, eerste lid, onderdeel a][ref2], voor zover het betreft de sloop van het vissersvaartuig of het
      verwijderen van de aanwezige vistuigen en de overige apparatuur specifiek bestemd en geschikt voor de visserij, en

      2°. [artikel 8, eerste lid, onderdeel b][ref3];

      b. overige bescheiden waarmee naar het oordeel van de minister wordt aangetoond dat aan de in
      [artikel 8, eerste lid][ref4], bedoelde verplichtingen is voldaan;

      c. het originele exemplaar van de ten aanzien van het betreffende vissersvaartuig toegekende visvergunning;

      d. het originele exemplaar van de garnalenvergunning, voor zover ten aanzien van het betreffende vissersvaartuig
      een garnalenvergunning is toegekend;

      e. het originele exemplaar van het speciale visdocument, bedoeld in
      [artikel 4, tweede lid, onderdeel a, van de Regeling technische maatregelen 2000][ref5], voor zover ten aanzien van
      het betreffende vissersvaartuig een speciaal visdocument is toegekend.

      3 Indien het vissersvaartuig verloren gaat op een tijdstip tussen het moment van subsidieverlening en de
      subsidievaststelling, wordt de subsidie verminderd met het bedrag van de door de verzekering uitgekeerde
      vergoeding.


