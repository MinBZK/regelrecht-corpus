  - number: '2'
    text: |-
      De minister kan op aanvraag aan de eigenaar van een vissersvaartuig overeenkomstig het bepaalde in deze regeling
      subsidie verlenen ter zake van:

      a. de definitieve beëindiging van de visserijactiviteiten met dat vissersvaartuig, of

      b. de eigendomsoverdracht van het vissersvaartuig in het kader van de definitieve beëindiging van de
      visserijactiviteiten.
    url: https://wetten.overheid.nl/BWBR0018732/2005-11-19#Artikel2
  - number: '3'
    text: |-
      Onder definitieve beëindiging als bedoeld in [artikel 2][ref1] wordt verstaan:

      a. sloop van het vissersvaartuig;

      b. het definitieve gebruik van het vissersvaartuig voor niet-commerciële andere doeleinden dan visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0018732#Artikel2
    url: https://wetten.overheid.nl/BWBR0018732/2005-11-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018732
        artikel: '2'
  - number: '4'
    text: |-
      1 De aanvraag voor subsidieverlening, bedoeld in [artikel 2][ref1], kan worden ingediend in de periode van 12
      september tot en met 7 november 2005.

      2 Het subsidieplafond voor de op grond van deze regeling te verstrekken subsidies bedraagt:

      a. € 4.000.000 voor vissersvaartuigen die behoren tot segment MFL 1 of MFL 2 en waarvoor een garnalenvergunning is
      verleend en geen contingent is toegekend;

      b. € 32.000.000 voor vissersvaartuigen die behoren tot het segment MFL 1 en waarvoor een contingent is toegekend.

      3 De minister verdeelt het beschikbare bedrag in volgorde van ontvangst van de aanvragen tot subsidieverlening,
      met dien verstande dat wanneer de aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref2] de
      gelegenheid heeft gehad de aanvraag aan te vullen, de dag waarop de aanvraag volledig is, als datum van ontvangst
      geldt.

      4 Bij de verdeling van het beschikbare bedrag op grond van het derde lid wordt in totaal niet meer dan € 18.000.000
      toegekend aan eigenaren van vissersvaartuigen die blijkens het visserijregister Urk als thuishaven hebben.

      5 Indien door toewijzing van aanvragen met dezelfde datum van ontvangst het subsidieplafond zou worden
      overschreden, geschiedt de toewijzing aan de hand van het rangschikken van de op deze datum ontvangen aanvragen,
      waarbij telkenmale de hoogst gerangschikte aanvraag het eerst voor toewijzing in aanmerking komt. De rangschikking
      van aanvragen wordt als volgt bepaald:

      a. voorrang wordt verleend aan vissers die gegevens hebben overgelegd waaruit naar het oordeel van de minister
      blijkt dat zij het afgelopen jaar meer dan de helft van de voor hen beschikbare zeedagen hebben gevist in
      de Voordelta, zoals beschreven in Beschikking 2004/813/EG van de Europese Commissie van 7 december 2004
      tot vaststelling, op grond van [Richtlijn 92/43/EEG](31992L0043) van de Raad, van de lijst van gebieden van
      communautair belang voor de Atlantische biogeografische regio (PbEG L 387) waarbij de onderlinge rangschikking
      tussen deze vissers plaatsvindt volgens loting, welke geschiedt door een vanwege de minister aan te wijzen notaris;

      b. voor de overige aanvragen vindt de rangschikking plaats volgens loting, welke geschiedt door een vanwege de
      minister aan te wijzen notaris.


      [ref1]: https://wetten.overheid.nl/BWBR0018732#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
