        artikel: '14'
  - number: '12'
    text: |-
      1 Subsidie wordt verleend onder voorbehoud van goedkeuring door de Commissie van de Europese Gemeenschappen.

      2 De beslissing tot verlening van subsidie kan worden ingetrokken of gewijzigd indien dit noodzakelijk is in
      verband met het verkrijgen van de goedkeuring van de Commissie van de Europese Gemeenschappen voor deze regeling of
      het uitblijven daarvan.
    url: https://wetten.overheid.nl/BWBR0018732/2005-11-19#Artikel12
  - number: '13'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0018732/2005-11-19#Artikel13
