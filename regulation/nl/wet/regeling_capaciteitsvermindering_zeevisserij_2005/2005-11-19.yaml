  - number: '7'
    text: |-
      1 De aanvraag tot subsidieverlening wordt ingediend bij de directeur, op een daartoe door de directeur vastgesteld
      formulier.

      2 De aanvraag tot subsidieverlening gaat vergezeld van een kopie van de meetbrief.
    url: https://wetten.overheid.nl/BWBR0018732/2005-11-19#Artikel7
  - number: '8'
    text: |-
      1 De subsidieontvanger is verplicht om binnen drie maanden, te rekenen vanaf de datum van de beschikking tot
      subsidieverlening, ervoor zorg te dragen dat:

      a. hetzij de sloop van het vissersvaartuig, hetzij de definitieve bestemming van het vissersvaartuig voor niet
      commerciële andere doeleinden dan de visserij heeft plaatsgevonden, waarbij in het laatstbedoelde geval de op het
      vissersvaartuig aanwezige vistuigen en de overige apparatuur specifiek bestemd en geschikt voor de visserij zijn
      verwijderd;

      b. de lettertekens en het nummer van het vissersvaartuig, bedoeld in
      [artikel 4, eerste lid, van de Registratieregeling vissersvaartuigen 1998][ref1], zijn verwijderd;

      c. de inschrijving van het vissersvaartuig in het register, bedoeld in [artikel 4 van het besluit][ref2], is
      doorgehaald;

      d. de teboekstelling van het vissersvaartuig in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref3], ongedaan is gemaakt.

      2 De minister kan de in het eerste lid genoemde termijn op een met redenen omkleed verzoek van de subsidieontvanger
      éénmalig met ten hoogste vier weken verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0009409#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009353#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
