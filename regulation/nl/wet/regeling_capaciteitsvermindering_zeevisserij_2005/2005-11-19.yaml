  - number: '5'
    text: |-
      1 Een subsidie als bedoeld in [artikel 2][ref1] kan slechts worden verleend ter zake van de definitieve beëindiging
      van de visserijactiviteiten van een vissersvaartuig:

      a. dat behoort tot het segment MFL 1 en waarvoor een contingent is toegekend of een garnalenvergunning is verleend
      of dat behoort tot het segment MFL 2 en waarvoor een garnalenvergunning is verleend;

      b. met een lengte over alles van meer dan 15 meter en een tonnage van minder dan 1.200 BT;

      c. dat op de datum van de indiening van de aanvraag tot subsidieverlening meer dan tien jaar oud is;

      d. dat in elk van de twee aan de datum van de indiening van de aanvraag tot subsidieverlening voorafgaande perioden
      van twaalf maanden ten minste 75 zeedagen is gebruikt voor een visserijactiviteit, en

      e. ten aanzien waarvan op de datum van de indiening van de aanvraag tot subsidieverlening op grond van
      [artikel 2a, eerste en tweede lid, van de Regeling visvergunning][ref2] een visvergunning is toegekend.

      2 De subsidieverlening wordt in ieder geval geweigerd indien:

      a. voor de definitieve beëindiging van de visserijactiviteiten met het vissersvaartuig reeds uit anderen hoofde een
      uit overheidsmiddelen bekostigde subsidie is of wordt verstrekt;

      b. de definitieve beëindiging van de visserijactiviteiten met het vissersvaartuig heeft plaatsgevonden alvorens de
      ontvangst van de aanvraag tot subsidieverlening schriftelijk aan de aanvrager is bevestigd;

      c. de subsidieaanvraag niet is ingediend in de periode, bedoeld in [artikel 4, eerste lid][ref3];

      d. de aanvrager de aan het vissersvaartuig verleende garnalenvergunning of, geheel of gedeeltelijk, een aan het
      vissersvaartuig toegekend contingent in de periode tussen 22 juli 2005 en de datum van subsidieverlening:

      1°. heeft overgedragen;

      2°. binnen zijn onderneming heeft toegewezen aan een ander vissersvaartuig, of

      3°. een verzoek heeft gedaan tot aanhouding van de toekenning;

      e. door verstrekking van de subsidie in totaal meer dan € 18.000.000 wordt toegekend aan eigenaren van
      vissersvaartuigen die blijkens het visserijregister Urk als thuishaven hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0018732#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016244#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0018732#Artikel4
