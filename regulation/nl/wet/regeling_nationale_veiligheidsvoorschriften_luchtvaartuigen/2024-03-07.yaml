  - number: '2.1'
    text: 'Deze regeling is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel2
  - number: 2.1.a
    text: |-
      luchtvaartuigen als bedoeld in Bijlage I bij de basisverordening met uitzondering van luchtvaartuigen als bedoeld
      in de [Regeling Yakovlev-52 vliegtuigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032948
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0032948
  - number: 2.1.b
    text: Nederlandse luchtvaartuigen die uitsluitend worden ingezet voor niet-militaire staatsactiviteiten of diensten.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel2
  - number: '2.2'
    text: |-
      De [artikelen 28 tot en met 32][ref1] zijn niet van toepassing op Nederlandse luchtvaartuigen die niet onder een
      AOC vliegen en zijn voorzien van een speciaal-BvL.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel28
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '3.1'
    text: |-
      Het ontwerp van een zelf ontworpen amateurbouwluchtvaartuig voldoet aan een gelijkwaardig veiligheidsniveau als het
      veiligheidsniveau dat gewaarborgd wordt door de luchtwaardigheidseisen voor:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel3
  - number: 3.1.a
    text: 'ballonnen: CS-31HB;'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel3
  - number: 3.1.b
    text: 'zweefvliegtuigen: CS-22;'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel3
  - number: 3.1.c
    text: 'motorzweefvliegtuigen: CS-22;'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel3
  - number: 3.1.d
    text: 'lichte sportvliegtuigen: CS-LSA;'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel3
  - number: 3.1.e
    text: 'zeer lichte vliegtuigen: CS-VLA;'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel3
  - number: 3.1.f
    text: |-
      kleine vliegtuigen, niet voorzien van een turbinemotor, mits het aantal zitplaatsen niet meer dan 4 bedraagt: CS-
      23;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel3
  - number: 3.1.g
    text: 'zeer lichte helikopters: CS-VLR;'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel3
  - number: 3.1.h
    text: |-
      kleine helikopters, niet voorzien van een turbinemotor, mits het aantal zitplaatsen niet meer dan 4 bedraagt: CS-
      27; of
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel3
  - number: 3.1.i
    text: 'replica''s: oorspronkelijke certificatiebasis.'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel3
  - number: '3.2'
    text: |-
      Voor de radiocommunicatie-, navigatie-, en identificatieapparatuur gelden de eisen inzake uitrustingsstukken en de
      verplichte instrumenten zijn van een toegelaten type.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel3
  - number: '4.1'
    text: Het ontwerp van een zelf ontworpen amateurbouwluchtvaartuig behoeft de acceptatie van de minister.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: '4.2'
    text: |-
      De minister accepteert een ontwerp van een zelf ontworpen amateurbouwluchtvaartuig, indien het ontwerp voldoet aan
      de eisen gesteld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel3
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.3'
    text: |-
      Om aan te tonen dat aan de eisen gesteld in [artikel 3][ref1] wordt voldaan, worden de gegevens genoemd in de bij
      deze regeling behorende [bijlage 1][ref2] bij de minister ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0043696
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0043696
  - number: '4.4'
    text: De eindverantwoordelijkheid voor de kwaliteit van het ontwerp ligt bij de ontwerper.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: '4.5'
    text: |-
      Om aan te tonen dat een replica geschikt is voor amateurbouw worden de ontwerp- en bouwgegevens door de minister
      gevalideerd. De volgende aspecten komen hierbij aan de orde:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: 4.5.a
    text: de oorspronkelijke certificatiebasis;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: 4.5.b
    text: de volledigheid van het ontwerp-tekeningenpakket;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: 4.5.c
    text: de eventuele ontwerpwijzigingen zoals het gebruik van andere dan originele materialen; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: 4.5.d
    text: de complexiteit van de bouw.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: '4.6'
    text: |-
      Alvorens met de bouw van een niet zelf ontworpen amateurbouwluchtvaartuig door de bouwer kan worden aangevangen
      worden de gegevens bij de minister ingediend die nodig zijn om aan te tonen dat wordt voldaan aan de
      luchtwaardigheidseisen, welke op het amateurbouwluchtvaartuig van toepassing zijn. Dit kan met behulp van een
      bewijs van luchtwaardigheid dat voor hetzelfde type luchtvaartuig is afgegeven in een van de volgende landen:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: 4.6.a
    text: Australië;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: 4.6.b
    text: België;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: 4.6.c
    text: Canada;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: 4.6.d
    text: Duitsland;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: 4.6.e
    text: Frankrijk;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: 4.6.f
    text: Verenigd Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: 4.6.g
    text: Verenigde Staten van Amerika; of
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: 4.6.h
    text: Zwitserland.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel4
  - number: '5.1'
    text: |-
      De aanvraag voor de afgifte of verlenging van de geldigheidsduur van een BvL wordt op elektronische wijze ingediend
      op een daartoe door de minister op elektronische wijze verstrekt aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel5
  - number: '5.2'
    text: |-
      De aanvraag en de in te dienen bescheiden voor een verlenging van de geldigheidsduur van een BvL, worden tenminste
      8 dagen voor de vervaldatum van de termijn van geldigheid van het BvL ingediend.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel5
  - number: '5.3'
    text: De minister kan toestaan dat bij de aanvraag in te dienen gegevens op andere wijze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel5
  - number: '6'
    text: 'Bij een aanvraag voor een ICAO-standaard-BvL worden in ieder geval de volgende gegevens ingediend:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel6
  - number: 6.a
    text: |-
      een gewichts- en zwaartepuntsrapport en indien vereist door de van toepassing zijnde luchtwaardigheidseisen, een
      beladingsschema;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel6
  - number: 6.b
    text: een kopie van het vlieghandboek, indien vereist door de van toepassing zijnde luchtwaardigheidseisen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel6
  - number: 6.c
    text: |-
      de historische gegevens ter vaststelling van de productie, modificatie en onderhoudsstandaard van het
      luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel6
  - number: 6.d
    text: |-
      een nauwkeurige omschrijving van de eventuele afwijkingen ten opzichte van het geaccepteerde type luchtvaartuig.
      Indien de aanvrager hier niet aan kan voldoen, worden de gegevens ingediend, aan de hand waarvan de bedoelde
      afwijkingen kunnen worden vastgesteld; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel6
  - number: 6.e
    text: |-
      een ingevuld en ondertekend BvL-acceptatierapport betreffende de BvL-acceptatiekeuring conform het model zoals
      door de minister op elektronische wijze beschikbaar is gesteld, waaruit blijkt dat het luchtvaartuig na inspectie
      luchtwaardig is bevonden en geschikt voor veilige operatie.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel6
  - number: '7.1'
    text: |-
      Voor een luchtvaartuig dat in overeenstemming is met een geaccepteerd type luchtvaartuig, dat is ontworpen,
      gebouwd, beproefd en uitgerust in een verdragsland en wordt geïmporteerd uit dat verdragsland, worden ten behoeve
      van de afgifte van een ICAO-standaard-BvL de in [artikel 6][ref1] genoemde gegevens ingediend tezamen met een door
      de luchtvaartautoriteit van dat verdragsland afgegeven BvL, of BvL voor export naar Nederland dat niet eerder is
      afgegeven dan 60 dagen onmiddellijk voorafgaand aan de datum van de aanvraag voor een ICAO-standaard-BvL.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel6
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Voor een luchtvaartuig dat in overeenstemming is met een geaccepteerd type luchtvaartuig, dat is ontworpen,
      gebouwd, beproefd en uitgerust in een verdragsland en dat uit een ander verdragsland wordt geïmporteerd, worden ten
      behoeve van de afgifte van een ICAO-standaard-BvL de in [artikel 6][ref1] genoemde gegevens ingediend, tezamen met:


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel6
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 7.2.a
    text: |-
      documentatie waaruit blijkt dat het luchtvaartuig gebouwd is conform het goedgekeurde ontwerp, wat kan bestaan uit
      het door de luchtvaartautoriteit van het land waarin het luchtvaartuig is vervaardigd, afgegeven export-BvL; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel7
  - number: 7.2.b
    text: |-
      een BvL, of een BvL voor export naar Nederland, afgegeven door de luchtvaartautoriteit van het land van waaruit het
      luchtvaartuig wordt geïmporteerd, niet eerder dan 60 dagen, onmiddellijk voorafgaande aan de datum van de aanvraag
      voor een ICAO-standaard-BvL.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel7
  - number: '7.3'
    text: |-
      Voor een luchtvaartuig dat in overeenstemming is met een geaccepteerd type luchtvaartuig, dat is ontworpen,
      gebouwd, beproefd en uitgerust in een verdragsland en wordt geïmporteerd uit een land waarmee de minister geen
      overeenkomst heeft gesloten inzake wederzijdse erkenning van bewijzen van luchtwaardigheid, worden ten behoeve van
      de afgifte van een ICAO-standaard-BvL, de in [artikel 6][ref1] genoemde gegevens ingediend en daarnaast de volgende
      documenten overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel6
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 7.3.a
    text: |-
      documentatie waaruit blijkt dat het luchtvaartuig gebouwd is conform het goedgekeurde ontwerp, wat kan bestaan uit
      het door de luchtvaartautoriteit van het land waarin het luchtvaartuig is vervaardigd, afgegeven export-BvL;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel7
  - number: 7.3.b
    text: |-
      documenten waaruit blijkt dat het luchtvaartuig in overeenstemming is met het geaccepteerd type luchtvaartuig, dan
      wel met een aanvullend type-certificaat dat voor het type-ontwerp is afgegeven;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel7
  - number: 7.3.c
    text: |-
      documenten waaruit blijkt dat de van toepassing zijnde luchtwaardigheidsaanwijzingen als bedoeld in
      [artikel 8, eerste lid][ref1], zijn uitgevoerd; en


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel8
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 7.3.d
    text: |-
      documenten waaruit blijkt dat het luchtvaartuig na inspectie luchtwaardig is bevonden en geschikt voor veilige
      operatie.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel7
  - number: '8.1'
    text: |-
      Voorafgaand aan de afgifte van een ICAO-standaard-BvL worden de verplichte luchtwaardigheidsaanwijzingen van het
      land van ontwerp en de Nederlandse luchtwaardigheidsaanwijzingen opgevolgd.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel8
  - number: '8.2'
    text: Voor het ICAO-standaard-BvL wordt het bij ICAO-Annex 8 voorgeschreven format gehanteerd.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel8
  - number: '9'
    text: |-
      Bij een aanvraag voor een speciaal-BvL voor een door de aanvrager gebouwd amateurbouwluchtvaartuig, waarvan het
      ontwerp reeds als acceptabel is beoordeeld conform [artikel 4][ref1], worden de volgende gegevens ingediend:


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel4
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '4'
        hoofdstuk: '2'
  - number: 9.a
    text: een specificatie van het luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel9
  - number: 9.b
    text: |-
      een verklaring van de bouwer dat het amateurbouwluchtvaartuig gebouwd is conform het ontwerp en eventuele door de
      ontwerper geaccepteerde wijzigingen en dat de bouwer ten minste 51% van de totale productie werkzaamheden heeft
      uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel9
  - number: 9.c
    text: 'een verklaring dat op grond van een globaal onderzoek geen belangrijke tekortkomingen zijn waargenomen, van:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel9
  - number: 9.c.1°
    text: een onderhoudstechnicus;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel9
  - number: 9.c.2°
    text: |-
      het door een erkend bedrijf aangewezen personeelslid, dat gemachtigd is een BvL-verlengingsinspectie of een AR uit
      te voeren aan een vergelijkbare categorie luchtvaartuigen, of
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel9
  - number: 9.c.3°
    text: een persoon die hiertoe door de minister is aangewezen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel9
  - number: 9.d
    text: |-
      een verklaring van de bouwer dat alle verplichte luchtwaardigheidsaanwijzingen van het land van ontwerp en de
      Nederlandse bijzondere luchtwaardigheidsaanwijzingen zijn uitgevoerd en alle verplichte onderhoudsaanwijzingen
      zijn nagekomen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel9
  - number: 9.e
    text: een kopie van het bij het amateurbouwluchtvaartuig behorende vlieghandboek;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel9
  - number: 9.f
    text: een omschrijving van alle verwisselbare onderdelen en uitrustingsstukken;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel9
  - number: 9.g
    text: een omschrijving van de afwijkingen van het ontwerp waarmee de minister heeft ingestemd; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel9
  - number: 9.h
    text: |-
      een geluidsmeetrapport waaruit blijkt, dat het luchtvaartuig voldoet aan de geluidseisen van ICAO Annex 16,
      Boekdeel I.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel9
  - number: '10.1'
    text: |-
      Bij de aanvraag voor een speciaal-BvL voor een MLA, MLH, lichte gyrokopter, gemotoriseerd schermvliegtuig of
      paramotortrike, worden de volgende gegevens ingediend:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.1.a
    text: |-
      een document, afgegeven door de luchtvaartautoriteiten van Duitsland, Groot-Brittannië of Tsjechië waaruit
      blijkt dat het desbetreffende type en configuratie MLA, MLH, lichte gyrokopter, gemotoriseerd schermvliegtuig
      of paramotortrike voldoet aan de desbetreffende luchtwaardigheidseisen zoals die zijn vastgesteld in één van de
      genoemde landen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.1.b
    text: |-
      een verklaring van de houder dat alle verplichte luchtwaardigheidsaanwijzingen, afgegeven door de
      luchtvaartautoriteit van een van de in onderdeel a genoemde landen aan de luchtwaardigheidseisen waarvan het
      desbetreffende luchtvaartuig voldoet, en de Nederlandse luchtwaardigheidsaanwijzingen zijn uitgevoerd en alle
      verplichte onderhoudsaanwijzingen zijn nagekomen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.1.c
    text: |-
      een verklaring van de houder, waarin deze verklaart dat de configuratie MLA, MLH, lichte gyrokopter, gemotoriseerd
      schermvliegtuig of paramotortrike identiek is aan de goedgekeurde configuratie;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.1.d
    text: |-
      een uittreksel van het geluidmeetrapport overeenkomstig de bij deze regeling behorende [bijlage 2][ref1], opgesteld
      door of namens één van de in onderdeel a bedoelde autoriteiten dan wel door een door de Minister erkende of
      geaccepteerde organisatie, waaruit blijkt dat de conform ICAO Annex 16 gemeten geluidsproductie:


      [ref1]: https://wetten.overheid.nl/BWBR0043696
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0043696
  - number: 10.1.d.1°
    text: |-
      voor het desbetreffende type en configuratie MLA met een maximum startmassa van ten hoogste 472,5 kg of
      gemotoriseerd schermvliegtuig niet meer dan 60 dB(A) bedraagt;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.1.d.2°
    text: |-
      voor het desbetreffende type en configuratie MLA met een maximum startmassa van meer dan 472,5, maar niet meer dan
      570 kg, de hierna gedefinieerde grenswaarde voor geluidproductie niet overschrijdt: de grenswaarde stijgt lineair
      mee met de maximale startmassa vanaf 60 dB(A) bij een maximale startmassa van 472,5 kg, tot 70 dB(A) bij een
      maximale startmassa van 570 kg;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.1.d.3°
    text: |-
      voor het desbetreffende type en configuratie MLA met een maximum startmassa tussen 570 kg en 650 kg de grenswaarde
      constant op 70 dB(A) blijft;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.1.d.4°
    text: |-
      voor de desbetreffende type en configuratie MLH of lichte gyrokopter, op basis van de specifieke meting in
      hoofdstuk 6 van ICAO Annex 16, niet meer dan 68 dB(A) bedraagt; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.1.e
    text: |-
      een verklaring van een door de Minister erkende of geaccepteerde organisatie of persoon, dat de betreffende MLA,
      MLH, lichte gyrokopter, paramotortrike of het betreffende gemotoriseerde schermvliegtuig voor wat betreft de voor
      de geluidproductie van belang zijnde aspecten overeenstemt met de MLA, MLH, lichte gyrokopter, paramotortrike of
      het gemotoriseerde schermvliegtuig waaraan de geluidsmetingen zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: '10.2'
    text: |-
      Indien een MLA is voorzien van in Duitsland voorgeschreven reddingapparatuur, voldoet deze apparatuur aan de in
      Duitsland daarvoor geldende luchtwaardigheidseisen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: '10.3'
    text: |-
      In afwijking van het eerste lid wordt bij de aanvraag voor een speciaal-BvL voor een gemotoriseerd schermvliegtuig
      of paramotortrike met een leeggewicht, inclusief reddingsmiddelen, van ten hoogste 120 kg, de volgende informatie
      overgelegd:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.3.a
    text: |-
      een document afgegeven door de bevoegde autoriteiten van een Europese lidstaat of een andere staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte, waaruit blijkt dat het scherm van het
      gemotoriseerde schermvliegtuig of de paramotortrike voldoet aan de desbetreffende luchtwaardigheidseisen
      zoals die zijn vastgesteld in het betreffende land dan wel een verklaring door de fabrikant van het scherm, in
      overeenstemming met van toepassing zijnde regelgeving, dat het scherm voldoet aan de eisen voor een verantwoord
      gebruik;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.3.b
    text: 'een verklaring van de aanvrager waaruit blijkt dat:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.3.b.1°
    text: |-
      op het scherm op voorgeschreven wijze de inschrijvingskenmerken zijn aangebracht, alsmede op veilige wijze een
      vuurvast plaatje met nationaliteitskenmerk bevestigd aan het luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.3.b.2
    text: |-
      het scherm overeenkomt met het geaccepteerde ontwerp en eventuele verplichte modificaties zijn uitgevoerd en dat
      geen zichtbare beschadigingen zijn waargenomen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.3.b.3°
    text: |-
      de maximale lege massa van de totale combinatie van scherm, motor inclusief het frame waarin de motor bevestigd is,
      reservemiddelen en eventuele andere toevoegingen aan de configuratie niet boven de 120 kilogram uit komt. Deze lege
      massa wordt bepaald met eventuele motorolie en koelvloeistof, en zonder brandstof;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.3.b.4
    text: |-
      de aanvrager beschikt over een kopie van de door de fabrikant aangeleverde gebruiksaanwijzing indien het gebruik
      van het scherm als paramotorscherm alleen blijkt uit deze gebruiksaanwijzing.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: '10.4'
    text: |-
      Het speciaal-BvL van een gemotoriseerde schermvliegtuig of paramotortrike met een leeggewicht, inclusief
      reddingsmiddelen, van ten hoogste 120 kg is uitsluitend geldig indien:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.4.a
    text: 'het speciaal-BvL vergezeld is van:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.4.a.1°
    text: |-
      een bewijs van initiële aankoop van het scherm waaruit blijkt dat het scherm volgens de aanbeveling van de
      fabrikant nog niet gekeurd had hoeven worden; of
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.4.a.2°
    text: |-
      een geldig bewijs van keuring van het scherm, welke is uitgevoerd door de fabrikant of door een instantie die
      keurt conform de aanwijzingen en voorschriften van de fabrikant; Van het geldige bewijs van keuring is een kopie
      verstrekt aan de Minister ten behoeve van het Nederlandse register voor burgerluchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.4.b
    text: |-
      het ontwerp, de constructie, de configuratie en het gewicht van de overige componenten geschikt is om in combinatie
      met het scherm gebruikt te worden. De geschiktheid blijkt uit de door de fabrikant aangeleverde handleiding,
      specificaties of kenmerken van de genoemde onderdelen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.4.c
    text: |-
      het ontwerp, de constructie en combinatie van de overige componenten voldoet aan een veiligheidsniveau dat
      tenminste gelijkwaardig wordt geacht aan het algemeen hiervoor in Europa geaccepteerde veiligheidsniveau. Dit
      veiligheidsniveau wordt gegarandeerd door een fabrikant of importeur gevestigd in een lidstaat van de Europese Unie
      of een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.4.d
    text: alle door de fabrikant voor het gehele luchtvaartuig verplichte onderhoudsaanwijzingen zijn nagekomen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: 10.4.e
    text: |-
      de geluidsproductie voor het betreffende gemotoriseerde schermvliegtuig of de paramotortrike niet meer dan 60 dB(A)
      bedraagt als gemeten conform ICAO Annex 16.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: '10.5'
    text: |-
      Het gebruik van een eigen ontwerp of constructie van het harnas, het frame, de kooi, de voortstuwingsinrichting
      of van het onderstel of andere componenten van de configuratie is uitsluitend toegestaan met toestemming van de
      Minister. Dit geldt ook voor de afzonderlijke in het vierde lid, onderdelen b en c, genoemde onderdelen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: '10.6'
    text: |-
      Voor een gemotoriseerd schermvliegtuig of paramotortrike met een leeggewicht, inclusief reddingsmiddelen, van ten
      hoogste 120 kg, geeft de Minister ambtshalve een geluidsdocument af met een maximale waarde van 60 dB(A).
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel10
  - number: '11.1'
    text: |-
      Met betrekking tot een historisch luchtvaartuig dat als een luchtvaartuig met een duidelijk historisch belang
      voor het Koninkrijk der Nederlanden wordt aangemerkt, kan na de beoordeling van de luchtwaardigheid van dat
      luchtvaartuig een speciaal-BvL worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel11
  - number: '11.2'
    text: |-
      Voor straalvliegtuigen en helikopters van een buitenlands militair ontwerp, die niet zijn voorzien van een BvL of
      slechts voorzien van een BvL, dat door een buitenlandse militaire autoriteit is afgegeven, wordt geen speciaal-
      BvL afgegeven.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel11
  - number: '12.1'
    text: |-
      Bij de aanvraag voor een speciaal-BvL worden in ieder geval de gegevens als genoemd in [artikel 6][ref1]
      ingediend, alsmede de door de minister met betrekking tot het betreffende luchtvaartuig voor de beoordeling van dat
      luchtvaartuig nodig geachte bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel6
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Een historisch luchtvaartuig verkeert in originele staat, tenzij de minister heeft ingestemd met bepaalde
      aanpassingen of deze voorschrijft in verband met de vliegveiligheid.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel12
  - number: '13'
    text: |-
      Voor een luchtvaartuig van een geaccepteerd type luchtvaartuig als bedoeld in [artikel 1][ref1], dat is ontworpen,
      gebouwd, beproefd en uitgerust in een verdragsland en dat wordt geïmporteerd uit de Verenigde Staten van Amerika,
      Canada of een van de bij EASA aangesloten landen, worden ten behoeve van de afgifte van een speciaal-BvL, de
      volgende gegevens en documenten ingediend:


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel1
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '1'
        hoofdstuk: '1'
  - number: 13.a
    text: |-
      documenten waaruit blijkt dat het luchtvaartuig in overeenstemming is met het geaccepteerd type luchtvaartuig, dan
      wel met een aanvullend type-certificaat dat voor het type-ontwerp is afgegeven;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel13
  - number: 13.b
    text: |-
      een nauwkeurige omschrijving van de eventuele afwijkingen ten opzichte van het geaccepteerde type luchtvaartuig.
      Indien de aanvrager hieraan niet kan voldoen, worden de gegevens ingediend, aan de hand waarvan de bedoelde
      afwijkingen kunnen worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel13
  - number: 13.c
    text: |-
      de historische gegevens ter vaststelling van de productie, modificatie en onderhoudsstandaard van het
      luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel13
  - number: 13.d
    text: een gewichts- en zwaartepuntrapport;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel13
  - number: 13.e
    text: een kopie van het vlieghandboek;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel13
  - number: 13.f
    text: |-
      documentatie waaruit blijkt dat het luchtvaartuig gebouwd is conform het goedgekeurde ontwerp, wat kan bestaan uit
      het door de luchtvaartautoriteit van het land waarin het luchtvaartuig is vervaardigd, afgegeven export-BvL;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel13
  - number: 13.g
    text: documenten waaruit blijkt dat de van toepassing zijnde luchtwaardigheidsaanwijzingen zijn uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel13
  - number: 13.h
    text: |-
      documenten waaruit blijkt dat het luchtvaartuig na inspectie luchtwaardig is bevonden en geschikt voor veilige
      operatie, en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel13
  - number: 13.i
    text: |-
      een volledig ingevuld en ondertekend BvL-acceptatierapport betreffende de BvL-acceptatiekeuring conform het model
      zoals door de minister elektronisch beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel13
  - number: '14'
    text: 'Bij een aanvraag voor een export-BvL worden de volgende gegevens ingediend:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel14
  - number: 14.a
    text: |-
      een verklaring van de bevoegde autoriteit van de staat van invoer waarin wordt vermeld welke luchtwaardigheidseisen
      van toepassing zijn, alsmede de eventuele afwijkingen van de luchtwaardigheidseisen die door de staat van invoer
      worden geaccepteerd; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel14
  - number: 14.b
    text: |-
      een volledig ingevuld en ondertekend inspectierapport conform het model zoals door de minister elektronisch
      beschikbaar gesteld, betreffende de exportinspectie die niet eerder is uitgevoerd dan 60 dagen voorafgaande aan
      de datum van de aanvraag voor een export-BvL, waaruit blijkt en waarin wordt verklaard dat het luchtvaartuig in
      overeenstemming is met de onder a. genoemde luchtwaardigheidseisen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel14
  - number: '15.1'
    text: |-
      De geldigheidsduur van een ICAO-standaard-BvL, een speciaal-BvL betreffende een orphan aircraft of een speciaal-BvL
      betreffende een historisch luchtvaartuig wordt op aanvraag verlengd nadat is aangetoond dat nog steeds aan de van
      toepassing zijnde eisen is voldaan.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel15
  - number: '15.2'
    text: |-
      Bij een aanvraag voor de verlenging van de geldigheidsduur van de in het eerste lid genoemde BvL’s worden de
      volgende bescheiden gevoegd:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel15
  - number: 15.2.a
    text: |-
      een volledig ingevuld en ondertekend inspectierapport van de BvL-verlengingsinspectie, conform het model zoals door
      de minister elektronisch beschikbaar gesteld, uitgevoerd door een daartoe erkend bedrijf, of
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel15
  - number: 15.2.b
    text: |-
      een volledig ingevuld en ondertekend inspectierapport van een volledige AR, uitgevoerd door een daartoe erkend
      bedrijf.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel15
  - number: '15.3'
    text: |-
      De verlenging van de geldigheidsduur van de in het eerste lid genoemde BvL’s kan tot hoogstens zes maanden na
      het verstrijken van de op het BvL vermelde termijn van geldigheid geschieden, indien in het inspectierapport een
      negatief advies wordt gegeven over de luchtwaardigheid van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel15
  - number: '15.4'
    text: |-
      Bij verlenging van de geldigheidsduur van de in het eerste lid genoemde BvL’s wordt aan de aanvrager van de
      verlenging een nieuw BvL gezonden, waaruit blijkt tot en met welke datum het document geldig is.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel15
  - number: '15.5'
    text: |-
      Voor een Nederlands luchtvaartuig dat volledig wordt ingezet voor niet-militaire operaties als bedoeld in artikel
      2, derde lid, onder a, van de basisverordening kan het ICAO-standaard-BvL voor ten hoogste 3 jaar geldig worden
      gehouden door telkens na 1 en 2 jaar een eenvoudig AR overeenkomstig Part M.A.901 (f) van [verordening (EG) nr.
      1321/2014](32014R1321) uit te voeren.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel15
  - number: '16.1'
    text: |-
      De aanvraag voor de verlenging van de geldigheidsduur van een speciaal-BvL betreffende een
      amateurbouwluchtvaartuig, MLA, MLH, lichte gyrokopter, gemotoriseerd schermvliegtuig of paramotortrike met een
      leeggewicht, inclusief reddingsmiddelen, van meer dan 120 kg, wordt vergezeld van een opgave van het totale aantal
      vlieguren, en een verklaring van de houder van het luchtvaartuig waaruit blijkt dat:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel16
  - number: 16.1.a
    text: het luchtvaartuig nog steeds in luchtwaardige toestand verkeert;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel16
  - number: 16.1.b
    text: |-
      wordt voldaan aan de van toepassing zijnde luchtwaardigheidsaanwijzingen en bijzondere
      luchtwaardigheidsaanwijzingen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel16
  - number: 16.1.c
    text: |-
      eventuele wijzigingen zijn goedgekeurd conform de procedure als bedoeld in [Hoofdstuk 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0043696
        hoofdstuk: '4'
  - number: 16.1.d
    text: |-
      de minister heeft ingestemd met eventuele geluidswijzigingen onder vermelding van het instemmingsnummer van de
      wijziging; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel16
  - number: 16.1.e
    text: het luchtvaartuig is onderhouden conform de aanwijzingen van de ontwerper.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel16
  - number: '16.2'
    text: |-
      Bij de aanvraag wordt een log-entry gevoegd waaruit blijkt dat wordt voldaan aan de onderhoudsaanwijzingen voor
      luchtvaartmaterieel opgenomen in Maintenance Directives.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel16
  - number: '16.3'
    text: 'De verklaring, bedoeld in het eerste lid, is medeondertekend door:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel16
  - number: 16.3.a
    text: een onderhoudstechnicus; of
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel16
  - number: 16.3.b
    text: |-
      voor een amateurbouwluchtvaartuig, een door de minister aangewezen persoon als bedoeld in
      [artikel 9, onderdeel c, onder 3°][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel9
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 16.3.c
    text: |-
      voor een MLA, MLH of lichte gyrokopter, een houder van een door de Deutsche Aero Club e.V. of de Deutsche
      Ultraleichtflugverbandes e.V. afgegeven Erlaubnis für Prüfer von Luftfahrtgerät, Klasse 5.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel16
  - number: '16.4'
    text: Het derde lid is niet van toepassing op gemotoriseerde schermvliegtuigen en paramotortrikes.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel16
  - number: '16.5'
    text: |-
      Op verzoek van de eigenaar of houder van een amateurbouwluchtvaartuig, MLA, MLH of lichte gyrokopter kan
      [artikel 15, tweede lid][ref1], worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel15
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '8'
  - number: '17.1'
    text: |-
      Een BvL-acceptatiekeuring, een BvL-verlengingsinspectie dan wel een exportinspectie wordt uitgevoerd door een
      daartoe erkend bedrijf.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel17
  - number: '17.2'
    text: |-
      Wanneer bijzondere omstandigheden daartoe aanleiding geven kan de minister een BvL-acceptatiekeuring, een BvL-
      verlengingsinspectie dan wel een exportinspectie uitvoeren.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel17
  - number: '17.3'
    text: |-
      De minister voert een BvL-acceptatiekeuring, een BvL-verlengingsinspectie dan wel een exportinspectie in ieder
      geval uit wanneer er geen door hem daartoe erkend bedrijf is.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel17
  - number: '17.4'
    text: |-
      Indien een BvL-acceptatiekeuring, een BvL-verlengingsinspectie dan wel een exportinspectie door de
      minister in het buitenland wordt uitgevoerd worden naast het desbetreffende vaste tarief volgens de
      [Regeling tarieven luchtvaart 2008][ref1] de eventuele kosten van een door hem te verrichten onderzoek in het kader
      van de inspectie door de eigenaar of houder van het betreffende luchtvaartuig gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0023145
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0023145
  - number: '18.1'
    text: |-
      Degene die bevoegd is tot het uitvoeren van een BvL-verlengingsinspectie of een exportinspectie bepaalt de
      inhoud van de technische inspectie, met dien verstande dat in de algemene luchtvaart ten minste de ‘check and
      inspect’-punten van de 100-uursinspectie of jaarlijkse inspectie of een daaraan gelijkwaardige inspectie worden
      uitgevoerd, indien de laatste inspectie langer dan een half jaar geleden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel18
  - number: '18.2'
    text: |-
      Een BvL-acceptatiekeuring wordt uitgevoerd conform de in het BvL-acceptatierapport, bedoeld in de
      [artikelen 6][ref1] en [13][ref2], opgenomen lijst van items.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0043696#Artikel13
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0043696
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '18.3'
    text: |-
      De BvL-verlengingsinspectie wordt niet eerder dan 90 dagen voor het verlopen van de termijn van geldigheid van het
      bewijs van luchtwaardigheid uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel18
  - number: '18.4'
    text: |-
      Uiterlijk op de ochtend van de datum van de steekproef, bedoeld in [artikel 19][ref1], is het inspectierapport
      conform het model zoals door de minister elektronisch beschikbaar gesteld, voor de minister beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel19
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '9'
  - number: '19.1'
    text: |-
      De minister kan een steekproef uitvoeren op een BvL-acceptatiekeuring, een BvL-verlengingsinspectie dan wel een
      exportinspectie in het kader van het houden van toezicht op het erkende bedrijf.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel19
  - number: '19.2'
    text: |-
      Op de aanvraag, bedoeld in [artikel 5, eerste lid][ref1], wordt door de eigenaar of houder van het luchtvaartuig
      dat behoort tot de algemene luchtvaart, aangegeven op welke datum en op welke plaats in Nederland het luchtvaartuig
      gereed zal staan voor een mogelijke steekproef.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel5
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '19.3'
    text: |-
      Tussen de datum waarop de aanvraag bij de minister wordt ingediend en de datum van de mogelijke steekproef wordt
      een termijn van ten minste 8 dagen aangehouden.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel19
  - number: '19.4'
    text: |-
      Voor een luchtvaartuig dat niet behoort tot de algemene luchtvaart worden zo nodig datum, tijdstip en plaats
      door de minister, na overleg met de eigenaar of houder van het luchtvaartuig, vastgesteld en schriftelijk aan de
      eigenaar of houder meegedeeld.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel19
  - number: '19.5'
    text: |-
      De eigenaar of houder van het luchtvaartuig neemt zo spoedig mogelijk contact op met de minister als het
      luchtvaartuig door overmacht niet op de op de aanvraag aangegeven of door de minister vastgestelde plaats of datum
      gereed kan staan voor een mogelijke steekproef.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel19
  - number: '20'
    text: |-
      Bij de overdracht van een luchtvaartuig wordt een BvL door de voormalige eigenaar of houder van dat luchtvaartuig
      overgedragen aan de nieuwe eigenaar of houder van dat luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel20
  - number: '21'
    text: |-
      Indien is gebleken dat de gegevens, zoals door de minister zijn vermeld op een BvL, onjuist zijn, wordt een BvL dat
      de juiste gegevens vermeldt, aan de eigenaar of houder van het luchtvaartuig gezonden.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel21
  - number: '22.1'
    text: |-
      Een BvL wordt door de minister vernieuwd, bij verlies of indien het onleesbaar, beschadigd of anderszins
      onbruikbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel22
  - number: '22.2'
    text: |-
      Bij verlies wordt bij de aanvraag tot vernieuwing van een BvL een afschrift van het proces-verbaal van de aangifte
      van verlies overgelegd.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel22
  - number: '22.3'
    text: |-
      Indien een BvL wegens verlies is vernieuwd en het verloren document wordt teruggevonden, zendt de eigenaar of
      houder van het luchtvaartuig het teruggevonden BvL zo spoedig mogelijk aan de minister.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel22
  - number: '22.4'
    text: |-
      Indien een BvL anders dan wegens verlies is vernieuwd, zendt de eigenaar of houder van het luchtvaartuig het
      oorspronkelijke BvL binnen een week na de datum van verzending van het vernieuwde document aan de minister.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel22
  - number: '23.1'
    text: |-
      Om een schorsing van een BvL op te heffen toont de houder aan, dat de redenen, die tot schorsing hebben geleid,
      zijn vervallen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel23
  - number: '23.2'
    text: De schorsing en de opheffing van de schorsing worden op door de minister te bepalen wijze bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel23
  - number: '23.3'
    text: De intrekking van een BvL wordt op door de minister te bepalen wijze bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel23
  - number: '24.1'
    text: Wijziging van een luchtvaartuig behoeft de instemming van de minister.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel24
  - number: '24.2'
    text: |-
      Met het ontwerp van een wijziging van een luchtvaartuig wordt ingestemd indien is aangetoond dat het gewijzigde
      luchtvaartuig voldoet aan de luchtwaardigheidsvoorschriften en de geluidseisen die toegepast zijn bij de toelating
      in Nederland van het type luchtvaartuig zoals die van kracht zijn op de datum van het verzoek om instemming.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel24
  - number: '25.1'
    text: |-
      De minister stemt zonder aanvraag daartoe reeds in met een wijziging van een luchtvaartuig voorzien van een ICAO-
      standaard-BvL of een historisch luchtvaartuig voorzien van een speciaal-BvL, indien:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel25
  - number: 25.1.a
    text: 'met betrekking tot het ontwerp:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel25
  - number: 25.1.a.1°
    text: het ontwerp en de uitvoering van de wijziging zijn voorbereid door de houder van een ontwerperkenning;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel25
  - number: 25.1.a.2°
    text: |-
      met het ontwerp van de wijziging is ingestemd door middel van een aanvullend type-certificaat voor het
      desbetreffende type luchtvaartuig bedoeld in [artikel 28][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel28
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 25.1.a.3°
    text: met het ontwerp van de wijziging al eerder is ingestemd voor het betreffende type luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel25
  - number: 25.1.a.4°
    text: een aldus gewijzigd luchtvaartuig reeds eerder in Nederland is toegelaten;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel25
  - number: 25.1.a.5°
    text: het de inbouw van een in Nederland toegelaten uitrustingsstuk voor het desbetreffende type luchtvaartuig betreft;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel25
  - number: 25.1.a.6°
    text: |-
      een aanvullend type-certificaat is afgegeven door een lidstaat van de EASA overeenkomstig de procedures van Part 21
      van verordening (EU) nr. 748/2012;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel25
  - number: 25.1.a.7°
    text: Service Informatie is verstrekt en de wijziging is goedgekeurd door de primair certificerende autoriteit, of
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel25
  - number: 25.1.a.8°
    text: het ontwerp en de uitvoering van de wijziging is opgenomen in CS-STAN zoals laatstelijk gewijzigd;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel25
  - number: 25.1.b
    text: |-
      met betrekking tot de geluidsproductie, de uitvoerende van het onderhoud aan de hand van [bijlage 3][ref1] bij deze
      regeling heeft vastgesteld dat de wijziging geen invloed heeft op de geluidsproductie van het luchtvaartuig;


      [ref1]: https://wetten.overheid.nl/BWBR0043696
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0043696
  - number: 25.1.c
    text: |-
      met betrekking tot de gegevens, de uitvoerende aan de hand van [bijlage 4][ref1] heeft vastgesteld dat de wijziging
      geen invloed heeft op de gegevens van het luchtvaartuig die zijn vastgelegd in het Nederlandse register voor
      burgerluchtvaartuigen; en


      [ref1]: https://wetten.overheid.nl/BWBR0043696
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0043696
  - number: 25.1.d
    text: |-
      de uitvoerende van het onderhoud heeft vastgesteld dat deze wijziging in combinatie met eerder uitgevoerde
      wijzigingen en reparaties geen nadelige invloed op de luchtwaardigheid van het luchtvaartuig heeft.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel25
  - number: '25.2'
    text: |-
      De instemming op voorhand, bedoeld in het eerste lid, geldt alleen indien bij het uitvoeren van een wijziging
      aantoonbaar gebruik wordt gemaakt van de benodigde informatie van de volgens het eerste lid ingestemde wijziging.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel25
  - number: '26.1'
    text: 'De aanvraag voor:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel26
  - number: 26.1.a
    text: |-
      het verkrijgen van instemming met het ontwerp van een wijziging van een luchtvaartuig voorzien van een ICAO-
      standaard-BvL of een historisch luchtvaartuig voorzien van een speciaal-BvL voor wijzigingen waarvan het ontwerp
      niet voldoet aan een van de criteria in [artikel 25, eerste lid, onder a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel25
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 26.1.b
    text: |-
      het verkrijgen van de verklaring ten aanzien van het voldoen aan de geluidseisen voor die wijzigingen van een
      luchtvaartuig voorzien van een ICAO-standaard-BvL of een historisch luchtvaartuig voorzien van een speciaal-BvL
      waarvan niet vaststaat dat die geen invloed hebben op de geluidsproductie van het luchtvaartuig, alsmede
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel26
  - number: 26.1.c
    text: |-
      de melding van de uitvoering van een wijziging van een luchtvaartuig voorzien van een ICAO-standaard-BvL of een
      historisch luchtvaartuig voorzien van een speciaal-BvL die invloed heeft op de gegevens van het luchtvaartuig die
      zijn vastgelegd in het Nederlandse register voor burgerluchtvaartuigen,
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel26
  - number: '26.2'
    text: |-
      Bij de aanvraag en de melding, bedoeld in het eerste lid, worden de voor de beoordeling noodzakelijke gegevens
      gevoegd.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel26
  - number: '26.3'
    text: |-
      Wanneer de bij de aanvraag of de melding gevraagde aanvullende informatie niet binnen 6 maanden wordt verstrekt,
      vervalt de aanvraag en wordt deze teruggezonden.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel26
  - number: '26.4'
    text: Een inspectie van het ingebouwde ontwerp kan onderdeel uitmaken van de beoordelingsprocedure.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel26
  - number: '26.5'
    text: |-
      De aanvraag, genoemd in het eerste lid, onder a of b, en op andere dan elektronische wijze gedaan, wordt in
      tweevoud ingediend.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel26
  - number: '26.6'
    text: |-
      De melding genoemd in het eerste lid, onder c, en de bijlagen bij de aanvraag of de melding kunnen in enkelvoud
      worden bijgevoegd.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel26
  - number: '26.7'
    text: |-
      Verkregen instemming met de in het eerste lid genoemde aanvraag blijkt uit een handtekening namens de minister op
      het formulier.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel26
  - number: '27.1'
    text: |-
      De minister stemt zonder aanvraag daartoe reeds in met een wijziging van een orphan aircraft,
      amateurbouwluchtvaartuig, MLA, MLH, lichte gyrokopter, gemotoriseerd schermvliegtuig of paramotortrike, indien:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel27
  - number: 27.1.a
    text: 'met betrekking tot het ontwerp:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel27
  - number: 27.1.a.1°
    text: de wijziging is goedgekeurd door de originele ontwerper of kitfabrikant van het luchtvaartuig,
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel27
  - number: 27.1.a.2°
    text: |-
      voor de wijziging van een zelf ontworpen amateurbouwluchtvaartuig of een luchtvaartuig waarvan de originele
      ontwerper of kitfabrikant niet meer bestaat, conform [artikel 4][ref1] is aangetoond dat aan de van toepassing
      zijnde luchtwaardigheidseisen volgens [artikel 3][ref2] dan wel [artikel 10, eerste lid, onder a][ref3] is voldaan,


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0043696#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0043696#Artikel10
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0043696
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0043696
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 27.1.a.3°
    text: het ontwerp en de uitvoering van de wijziging is opgenomen in CS-STAN zoals laatstelijk gewijzigd, of
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel27
  - number: 27.1.a.4°
    text: het ontwerp en de uitvoering van de wijziging zijn voorbereid door de houder van een ontwerperkenning;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel27
  - number: 27.1.b
    text: |-
      met betrekking tot de geluidsproductie de houder, eigenaar of de uitvoerende van de wijziging aan de hand van
      [bijlage 3][ref1] bij deze regeling heeft vastgesteld dat de wijziging geen invloed heeft op de geluidsproductie
      van het luchtvaartuig;


      [ref1]: https://wetten.overheid.nl/BWBR0043696
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0043696
  - number: 27.1.c
    text: |-
      met betrekking tot de gegevens de houder, eigenaar of de uitvoerende van de wijziging aan de hand van
      [bijlage 4][ref1] heeft vastgesteld dat de wijziging geen invloed heeft op de gegevens van het luchtvaartuig die
      zijn vastgelegd in het Nederlandse register voor burgerluchtvaartuigen; en


      [ref1]: https://wetten.overheid.nl/BWBR0043696
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0043696
  - number: 27.1.d
    text: |-
      de houder, eigenaar of de uitvoerende van de wijziging vastgesteld heeft dat deze wijziging in combinatie met
      eerder uitgevoerde wijzigingen en reparaties geen nadelige invloed op de luchtwaardigheid van het luchtvaartuig
      heeft;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel27
  - number: 27.1.e
    text: |-
      het luchtvaartuig een gemotoriseerd schermvliegtuig of een paramotortrike met een leeggewicht, inclusief
      reddingsmiddelen, van ten hoogste 120 kg betreft, voor zover de wijziging niet het scherm of een onderdeel daarvan,
      betreft.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel27
  - number: '27.2'
    text: |-
      De instemming, bedoeld in het eerste lid, geldt alleen indien bij het uitvoeren van een wijziging aantoonbaar
      gebruik wordt gemaakt van de benodigde informatie van de volgens het eerste lid ingestemde wijziging.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel27
  - number: '27.3'
    text: |-
      [Artikel 26, eerste lid, aanhef, onderdelen b en c, en tweede tot en met zevende lid][ref1] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel26
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '27.4'
    text: |-
      Indien naar het oordeel van de Minister door de wijziging van de MLA, MLH, paramotortrike of het
      gemotoriseerde schermvliegtuig niet meer met het ten aanzien van de betreffende MLA, MLH, paramotortrike of
      het betreffende gemotoriseerde schermvliegtuig afgegeven uittreksel van het geluidmeetrapport volstaan kan
      worden, wordt door of namens één van de in [artikel 10, eerste lid, onderdeel a][ref1], genoemde autoriteiten
      dan wel een door de minister erkende of geaccepteerde organisatie een nieuw uittreksel op basis van een
      nieuw geluidmeetrapport opgesteld en aan de minister gezonden tezamen met een verklaring als bedoeld in
      [artikel 10, eerste lid, onderdeel e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0043696#Artikel10
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0043696
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '27.5'
    text: |-
      Indien het vierde lid toepassing vindt, wordt de instemming eerst verleend, nadat de in
      [artikel 10, eerste lid, onderdeel e][ref1], bedoelde verklaring, die op het tijdstip van indiening van de in het
      derde lid bedoelde aanvraag geldig was, bij de minister is ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel10
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '28.1'
    text: |-
      De minister neemt een aanvraag voor een aanvullend type-certificaat voor het aanbrengen van een ingrijpende
      wijziging aan een Nederlands luchtvaartuig dat volledig wordt ingezet voor niet-militaire operaties genoemd
      in artikel 2, derde lid, onder a, van de basisverordening, of een in Bijlage I, onderdeel 1, onder b, bij de
      basisverordening genoemd luchtvaartuig, dat in het Nederlandse register voor burgerluchtvaartuigen is ingeschreven
      en is voorzien van een ICAO-standaard-BvL, in behandeling, indien de aanvrager naar het oordeel van de minister
      over voldoende kennis en ervaring beschikt om het ontwerp en de blijvende luchtwaardigheid daarvan te ondersteunen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel28
  - number: '28.2'
    text: |-
      Een aanvraag voor een aanvullend type-certificaat wordt ingediend overeenkomstig Part 21, onderdeel 21.A.113, van
      verordening (EU) nr. 748/2012.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel28
  - number: '28.3'
    text: |-
      De aanvrager toont voor de afgifte van een aanvullend type-certificaat overeenkomstig Part 21, onderdeel 21.A.114,
      van verordening (EU) nr. 748/2012 aan, dat het gewijzigde product voldoet aan de eisen overeenkomstig Part 21,
      onderdeel 21.A.101, van verordening (EU) nr. 748/2012.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel28
  - number: '28.4'
    text: De afgifte van een aanvullend type-certificaat wordt op door de minister te bepalen wijze bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel28
  - number: '29.1'
    text: |-
      De minister vermeldt overeenkomstig Part 21, onderdelen 21.A.101, 21A.113 en 21A.114, van verordening (EU) nr.
      748/2012, in de certificatiebasis de van toepassing zijnde eisen, waaraan een product waarvoor de aanvraag voor een
      aanvullend type-certificaat als bedoeld in [artikel 28][ref1] in behandeling is genomen, moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel28
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '29.2'
    text: |-
      De aanvrager geeft aan te voldoen aan de in de certificatiebasis gestelde eisen en de daarvoor benodigde
      bewijsvoering te zullen leveren ter uitvoering van het vereiste in [artikel 28, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel28
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '29.3'
    text: |-
      De aanvrager legt in de lijst van bewijsvoering als bedoeld in [bijlage 5][ref1] bij deze regeling vast, op welke
      wijze de bewijsvoering geleverd is, en met welke middelen deze onderbouwd is. De bewijsvoering wordt in de in
      [bijlage 5][ref2] bij deze regeling weergegeven categorieën ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0043696
      [ref2]: https://wetten.overheid.nl/BWBR0043696
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0043696
      - id: ref2
        bwb_id: BWBR0043696
  - number: '29.4'
    text: 'De lijst van bewijsvoering legt voor ieder artikel van alle van toepassing zijnde eisen vast:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
  - number: 29.4.a
    text: het middel van bewijsvoering;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
  - number: 29.4.b
    text: de referentie naar het document waarin de resultaten of bevindingen van de bewijsvoering zijn vastgelegd; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
  - number: 29.4.c
    text: de referentie van de acceptatie van die vastlegging.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
  - number: '29.5'
    text: |-
      De lijst van bewijsvoering, de certificatiebasis, en de daarbij behorende documentatie wordt opgenomen in een
      certificatiedossier.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
  - number: '29.6'
    text: |-
      Indien de aanvraag een niet eerder toegepaste bewijsvoeringsmethode omvat, mag deze methode eerst toegepast worden
      nadat deze door de minister is geaccepteerd. De acceptatie door de minister wordt vastgelegd in een wijze van
      interpretatie en opgenomen in de certificatiebasis.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
  - number: '29.7'
    text: |-
      De aanvrager kan een aanvraag indienen voor ontheffing van één of meer gestelde eisen in de certificatiebasis.
      De minister kan dit accepteren als daartoe gegronde redenen bestaan. Deze acceptatie wordt vastgelegd in een
      dispensatie van eis en opgenomen in de certificatiebasis.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
  - number: '29.8'
    text: |-
      De aanvrager kan een verzoek indienen om aan een gestelde eis op andere, maar equivalente wijze te voldoen.
      De minister kan dit accepteren als daartoe gegronde redenen bestaan. Deze acceptatie wordt vastgelegd in een
      equivalente eis en opgenomen in de certificatiebasis.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
  - number: '29.9'
    text: |-
      De aanvrager heeft voldaan aan het gestelde in [artikel 28, derde lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel28
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 29.9.a
    text: aan alle eisen in de certificatiebasis voldaan is;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
  - number: 29.9.b
    text: de aanvrager heeft verklaard dat voldaan is aan de eisen gesteld in de certificatiebasis;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
  - number: 29.9.c
    text: de lijst van bewijsvoering volledig is; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
  - number: 29.9.d
    text: |-
      de aanvrager heeft verklaard dat hem geen eigenschappen van zijn product bekend zijn, die de veiligheid in gevaar
      brengen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel29
  - number: '30.1'
    text: |-
      Voor het uitvoeren van testvluchten ter verkrijging van een aanvullend type-certificaat wordt door de aanvrager
      toestemming gevraagd.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel30
  - number: '30.2'
    text: |-
      De aanvrager krijgt toestemming van de minister wanneer de aanvrager voldoet aan de eisen overeenkomstig Part 21,
      onderdelen 21.A.33 en 21A.35, van verordening (EU) nr. 748/2012.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel30
  - number: '30.3'
    text: |-
      De toestemming voor het uitvoeren van testvluchten als bedoeld in het eerste lid wordt bij een ingrijpende
      wijziging van het type-ontwerp gegeven in de vorm van een speciaal-BvL.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel30
  - number: '30.4'
    text: |-
      De toestemming voor het uitvoeren van testvluchten als bedoeld in het eerste lid wordt bij een geringe wijziging
      van het type-ontwerp gegeven in de vorm van een ontheffing op grond van [artikel 3.21 van de Wet luchtvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
  - number: '31.1'
    text: |-
      De houder van een aanvullend type-certificaat kan de minister verzoeken een andere persoon aan te wijzen als houder
      van het aanvullend type-certificaat.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel31
  - number: '31.2'
    text: 'De minister wijst het verzoek toe als aan de volgende voorwaarden is voldaan:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel31
  - number: 31.2.a
    text: de nieuwe houder zich schriftelijk bereid verklaart om het houderschap te vervullen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel31
  - number: 31.2.b
    text: |-
      de oorspronkelijke houder verklaart alle ontwerp- en productiegegevens en de rechten daarop onvoorwaardelijk aan de
      nieuwe houder over te dragen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel31
  - number: 31.2.c
    text: |-
      indien de nieuwe houder naar het oordeel van de minister over voldoende kennis en ervaring beschikt om het ontwerp
      en de blijvende luchtwaardigheid daarvan te ondersteunen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel31
  - number: 31.2.d
    text: |-
      de nieuwe houder verklaart, dat voldaan zal worden aan de eisen gesteld in het ‘Document van overdracht van
      aanvullend type-certificaat’, bedoeld in het derde lid en aan de verplichtingen die voortvloeien uit ICAO Annex
      8; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel31
  - number: 31.2.e
    text: de vergoeding conform het tarief ter zake is voldaan.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel31
  - number: '31.3'
    text: |-
      De overdracht van een aanvullend type-certificaat wordt vastgelegd in een ‘Document van overdracht van aanvullend
      type-certificaat’, waarin tenminste wordt vermeld:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel31
  - number: 31.3.a
    text: de naam en het adres van de nieuwe houder van het aanvullend type-certificaat;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel31
  - number: 31.3.b
    text: de eventuele voorwaarden waaronder de bevoegde autoriteit de overdracht heeft geaccepteerd;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel31
  - number: 31.3.c
    text: de eventuele ontwerperkenning van de nieuwe houder;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel31
  - number: 31.3.d
    text: alle eventuele aanvullende voorwaarden ten aanzien van de kennis en ervaring die onze minister nodig acht, en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel31
  - number: 31.3.e
    text: |-
      de verklaring van de nieuwe houder, dat voldaan zal worden aan de eisen gesteld in het ‘Document van overdracht van
      aanvullend type-certificaat’, aan de verplichtingen die voortvloeien uit ICAO Annex 8.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel31
  - number: '32.1'
    text: |-
      Om een schorsing van een aanvullend type-certificaat op te heffen toont de houder aan, dat de redenen, die tot
      schorsing hebben geleid, zijn vervallen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel32
  - number: '32.2'
    text: De schorsing en de opheffing van de schorsing wordt op door de minister te bepalen wijze bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel32
  - number: '32.3'
    text: |-
      De houder van een aanvullend type-certificaat is bij intrekking daarvan verplicht het aanvullend type-certificaat
      zo spoedig mogelijk aan de minister te zenden.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel32
  - number: '32.4'
    text: De intrekking wordt op door de minister te bepalen wijze bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel32
  - number: '33.1'
    text: |-
      De houder van een luchtvaartuig is er voor verantwoordelijk dat een bij dat luchtvaartuig behorend
      onderhoudsprogramma wordt opgesteld, bijgehouden en bij uitvoering van onderhoud wordt gebruikt, tenzij deze
      verantwoordelijkheid door middel van een schriftelijk contract is overdragen aan een CAMO.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: '33.2'
    text: 'Een onderhoudsprogramma omvat ten minste de volgende aspecten:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: 33.2.1°
    text: inspectieperiodes;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: 33.2.2°
    text: inspectiestaten;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: 33.2.3°
    text: bedrijfsgegevens;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: 33.2.4°
    text: de van toepassing zijnde aanwijzingen van de minister;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: 33.2.5°
    text: aanvullende onderhoudsinformatie; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: 33.2.6°
    text: welk onderhoud eventueel door de piloot-eigenaar kan worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: '33.3'
    text: |-
      Een onderhoudsprogramma wordt opgesteld en bijgehouden volgens de meest recente aanbevelingen van de houder van het
      goedgekeurde ontwerp van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: '33.4'
    text: |-
      Wanneer door de houder van het goedgekeurde ontwerp van het luchtvaartuig geen aanbevelingen ter zake worden
      gedaan, als gevolg van de inbouw van een andere motor, propeller, onderdeel of uitrustingsstuk, worden de meest
      recente aanbevelingen van de houder van het goedgekeurde ontwerp van respectievelijk de motor, propeller, onderdeel
      of uitrustingsstuk in het onderhoudsprogramma opgenomen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: '33.5'
    text: Een onderhoudsprogramma van een
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: 33.5.a
    text: |-
      vliegtuig met een maximaal toegelaten startmassa van 2.730 kg of minder, of een helikopters of gyrokopter met een
      maximaal toegelaten startmassa van 1.200 kg of minder, tenzij daarmee vluchten worden uitgevoerd onder een AOC of
      een ontheffing krachtens [artikel 16 van de Luchtvaartwet][ref1] voor het vervoer ten behoeve van eigen bedrijf, of


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
  - number: 33.5.b
    text: ballon of een zweefvliegtuig,
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: '33.6'
    text: |-
      Een onderhoudsprogramma van een vliegtuig met een maximaal toegelaten startmassa van meer dan 2.730 kg, een
      helikopter of een gyrokopter met een maximaal toegelaten startmassa van meer dan 1.200 kg, tenzij daarmee
      vluchten worden uitgevoerd onder een AOC of een ontheffing krachtens [artikel 16 van de Luchtvaartwet][ref1] voor
      het vervoer ten behoeve van eigen bedrijf, dat door de houder wordt opgesteld en bijgehouden overeenkomstig de
      voorschriften van Part M, onderdeel M.A.302, van verordening (EU) nr. 1321/2014, wordt geacht te voldoen aan de
      eisen in het tweede tot en met vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
  - number: '33.7'
    text: 'In het onderhoudsprogramma wordt voorts tijdig opgenomen:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: 33.7.a
    text: aanvullend onderhoud, dat door de minister is aangewezen bij de certificatie die in Nederland van toepassing is;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: 33.7.b
    text: aanwijzingen van de minister in de vorm van onderhoudsaanwijzingen en bijzondere luchtwaardigheidsaanwijzingen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: '33.8'
    text: |-
      Voor luchtvaartuigen die volledig worden ingezet voor niet-militaire operaties als bedoeld in artikel 2, derde lid,
      onder a, van de basisverordening en die zijn voorzien van een ICAO-standaard-BvL is het aanvullend onderhoud als
      bedoeld in het zevende lid, onderdeel a, te onderscheiden ten opzichte van het onderhoudsprogramma.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel33
  - number: '34'
    text: 'Het onderhoudsprogramma van een luchtvaartuig als bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel34
  - number: 34.a
    text: |-
      [artikel 2, onderdeel a][ref1], voor zover het betreft een luchtvaartuig genoemd in de onderdelen a, b of d van
      Bijlage I bij de basisverordening, dat niet onder een AOC vliegt en is voorzien van een ICAO-standaard-BvL, en


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel2
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '2'
        hoofdstuk: '1'
  - number: 34.b
    text: |-
      [artikel 2, onderdeel b][ref1], dat is voorzien van een ICAO-standaard-BvL,


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel2
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '2'
        hoofdstuk: '1'
  - number: '35.1'
    text: |-
      Het onderhoudsprogramma wordt beheerd door de houder van het luchtvaartuig of namens de houder door een
      gecontracteerde CAMO.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel35
  - number: '35.2'
    text: Het onderhoudsprogramma wordt op verzoek zo spoedig mogelijk toegezonden aan de minister.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel35
  - number: '36.1'
    text: |-
      Met betrekking tot het onderhoud van een luchtvaartuig is de houder verplicht ervoor te zorgen dat de minister op
      zijn verzoek wordt ingelicht omtrent het tijdstip, waarop met het onderhoud dan wel met bepaalde daartoe behorende
      werkzaamheden zal worden aangevangen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel36
  - number: '36.2'
    text: |-
      Het onderhoud van een amateurbouwluchtvaartuig, MLA, MLH, lichte gyrokopter, gemotoriseerd schermvliegtuig of
      paramotortrike, mag worden uitgevoerd door of onder toezicht van de houder van het luchtvaartuig, met uitzondering
      van het onderhoud aan de verplichte instrumenten, radiocommunicatie-, navigatie-, en identificatieapparatuur.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel36
  - number: '36.3'
    text: |-
      De houder van een orphan aircraft, historisch luchtvaartuig of helikopter, met een maximaal toegelaten
      startmassa van 2.730 kg of minder, mag het piloot-eigenaar onderhoud, zoals opgenomen in het onderhoudsprogramma,
      uitvoeren zoals omschreven in Part ML van verordening (EU) nr. 1321/2014 wanneer hij voldoet aan de daartoe
      relevante eisen in Part ML, tenzij daarmee vluchten worden uitgevoerd onder een AOC of een ontheffing van
      [artikel 16 van de Luchtvaartwet][ref1] voor het vervoer ten behoeve van eigen bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
  - number: '36.4'
    text: |-
      De houder van een ballon of een zweefvliegtuig, mag het piloot-eigenaar onderhoud, zoals opgenomen in het
      onderhoudsprogramma, uitvoeren zoals omschreven in Part ML van verordening (EU) nr. 1321/2014 indien hij voldoet
      aan de daartoe relevante eisen in Part ML.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel36
  - number: '36.5'
    text: |-
      Het onderhoud van vliegtuigen met een maximaal toegelaten startmassa van 5.700 kg of meer en van helikopters met
      een maximaal toegelaten startmassa van 2.730 kg of meer, wordt uitgevoerd door of onder toezicht van een daartoe
      erkend onderhoudsbedrijf.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel36
  - number: '36.6'
    text: |-
      Het onderhoud van luchtvaartuigen die volledig worden ingezet voor niet-militaire staatsactiviteiten of diensten en
      die zijn voorzien van een ICAO-standaard-BvL wordt uitgevoerd door een daartoe erkend onderhoudsbedrijf.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel36
  - number: '37.1'
    text: |-
      Met uitzondering van het tweede en het derde lid van [artikel 36][ref1] geldt dat voor vliegtuigen met een
      maximaal toegelaten startmassa van 5.700 kg of minder en van helikopters met een maximaal toegelaten startmassa
      van 2.730 kg of minder, niet-complex onderhoud wordt uitgevoerd door of onder toezicht van een daartoe bevoegde
      onderhoudstechnicus of door of onder toezicht van een daartoe erkend onderhoudsbedrijf en dat complex onderhoud
      wordt uitgevoerd door of onder toezicht van een daartoe erkend onderhoudsbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel36
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '36'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '37.2'
    text: |-
      Een bevoegd onderhoudstechnicus mag onverminderd het eerste lid, complex onderhoud uitvoeren zoals omschreven in
      Part ML van verordening (EU) nr. 1321/2014, aan vliegtuigen met een maximaal toegelaten startmassa van 2.730 kg of
      minder, aan rotorcraft met een maximaal toegelaten startmassa van 1.200 kg of minder en toegelaten voor maximaal 4
      passagiers wanneer hij voldoet aan de daartoe relevante eisen in Part ML.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel37
  - number: '37.3'
    text: |-
      Indien het onderhoudsbedrijf, bedoeld in [artikel 36, vijfde lid][ref1], een volgens Part M van verordening (EU)
      nr. 1321/2014 erkende organisatie betreft, wordt het aanvullend onderhoud vrijgegeven met de volgende verklaring
      opgenomen in zijn verantwoording van het uitgevoerde werk: ‘Certificaat van vrijgave voor gebruik, afgegeven
      ingevolge de bevoegdheid op grond van het door de Minister van Infrastructuur en Waterstaat afgegeven bewijs van
      toestemming nr ....’, dan wel ‘Certificate of release to service, released in accordance with the approval by the
      Minister of Infrastructure and Watermanagement of the Netherlands reference degree no. ...’.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel36
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '36'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '37.4'
    text: |-
      Met betrekking tot het onderhoud aan een luchtvaartuig of luchtvaartuigonderdeel is de uitvoerder van het onderhoud
      er voor verantwoordelijk:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel37
  - number: 37.4.a
    text: |-
      dat de organisatie en inrichting van de bij het onderhoud betrokken werkplaatsen, de werkwijzen en
      controlemethoden, de gereedschappen, de onderhoudsdocumentatie, alsmede de kundigheid van het bij de werkzaamheden
      betrokken personeel, zodanig zijn dat een goede uitvoering van het onderhoud is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel37
  - number: 37.4.b
    text: |-
      dat materialen, onderdelen en halfproducten, alsmede uitrustingsstukken alvorens deze bij het onderhoud te
      verwerken, zijn:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel37
  - number: 37.4.b.1°
    text: |-
      geproduceerd volgens een goedgekeurd ontwerp, door of onder verantwoording van een houder van een daartoe
      strekkende erkenning, dan wel
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel37
  - number: 37.4.b.2°
    text: |-
      onderhouden volgens de aanwijzingen van de houder van het goedgekeurde ontwerp, door of onder de verantwoording van
      een houder van een daartoe strekkende bevoegdheid of erkenning;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel37
  - number: 37.4.c
    text: |-
      dat het luchtvaartuig na het onderhoud luchtwaardig is en blijft voldoen aan de geluidseisen, door het uitvoeren of
      laten uitvoeren van de inspecties en proeven waaruit blijkt, dat:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel37
  - number: 37.4.c.1°
    text: |-
      de vervaardigde delen ten minste gelijkwaardig zijn aan de te vervangen oorspronkelijke delen in deugdelijke
      toestand;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel37
  - number: 37.4.c.2°
    text: |-
      de vervaardigingswijzen, de samenvoeging en de beproevingswijzen door de minister zijn goedgekeurd of als zodanig
      zijn aanvaard, en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel37
  - number: 37.4.c.3°
    text: de werking van het luchtvaartuig juist is;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel37
  - number: 37.4.d
    text: |-
      dat er een goede identificatie is van de ter vervanging bestemde onderdelen. Bedoelde onderdelen zijn zoveel
      mogelijk vergezeld van instructies voor het aanbrengen en gebruik daarvan.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel37
  - number: '37.5'
    text: Aan het vierde lid wordt voldaan, indien het onderhoud wordt verricht door een daartoe erkend onderhoudsbedrijf.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel37
  - number: '38.1'
    text: 'Voor onderhoud aan luchtvaartuigen en onderdelen daarvan buiten Nederland geldt dat:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel38
  - number: 38.1.a
    text: |-
      deze mogen worden onderhouden door onderhoudsbedrijven, erkend of geaccepteerd overeenkomstig de geldende Europese
      procedures voor onderhoud aan luchtvaartuigen en onderdelen voor vergelijkbare EASA-luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel38
  - number: 38.1.b
    text: 'niet-complex onderhoud aan:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel38
  - number: 38.1.b.1°
    text: vliegtuigen met een maximaal toegelaten startmassa van 5.700 kg of minder,
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel38
  - number: 38.1.b.2°
    text: helikopters met een maximaal toegelaten startmassa van 2.730 kg of minder,
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel38
  - number: 38.1.c
    text: |-
      niet-complex onderhoud aan ballonnen en zweefvliegtuigen mag worden uitgevoerd in Duitsland, Oostenrijk en
      Zwitserland door onderhoudsbedrijven die zijn erkend overeenkomstig de in deze landen geldende nationale
      procedures.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel38
  - number: '38.2'
    text: |-
      De minister kan in afwijking van het eerste lid toestaan, dat buiten Nederland het onderhoud van
      luchtvaartuigen en onderdelen daarvan wordt uitgevoerd door of onder toezicht van een daartoe door buitenlandse
      burgerluchtvaartautoriteiten:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel38
  - number: 38.2.a
    text: bevoegd verklaarde onderhoudstechnicus, dan wel
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel38
  - number: 38.2.b
    text: erkend persoon.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel38
  - number: '38.3'
    text: |-
      De in het tweede lid bedoelde toestemming wordt verleend indien door de aanvrager is aangetoond dat een goede
      uitvoering van de werkzaamheden is gewaarborgd. De minister kan voorwaarden en beperkingen aan de toestemming
      verbinden.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel38
  - number: '38.4'
    text: 'Bij de beoordeling of aan het derde lid is voldaan, neemt de minister in ieder geval het volgende in overweging:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel38
  - number: 38.4.a
    text: |-
      de eisen, welke de bedoelde buitenlandse burgerluchtvaartautoriteiten stellen met betrekking tot het verlenen van
      bevoegdheden, dan wel het erkennen van personen voor het verrichten van de betrokken werkzaamheden en voorts de
      wijze waarop het overheidstoezicht is geregeld;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel38
  - number: 38.4.b
    text: ter zake dienende inlichtingen en gegevens, welke door de houder van het luchtvaartuig zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel38
  - number: '39.1'
    text: |-
      Alvorens na het verrichten van onderhoud het luchtvaartuig of onderdeel daarvan weer in gebruik wordt genomen,
      wordt een certificaat van vrijgave of een certificaat van vrijgave voor gebruik opgesteld:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel39
  - number: 39.1.a
    text: waarin de bevindingen en de verrichte werkzaamheden bij het onderhoud worden vastgelegd;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel39
  - number: 39.1.b
    text: |-
      waarin verklaard wordt dat bij het onderhoud is gehandeld overeenkomstig de krachtens deze regeling gegeven
      aanwijzingen, en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel39
  - number: 39.1.c
    text: |-
      dat is ondertekend door de persoon, de onderhoudstechnicus, of door het certificeringspersoneel van die erkenning-
      houder door wie of onder wiens toezicht de werkzaamheden krachtens de [artikelen 36][ref1], [37][ref2] of
      [38][ref3] zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0043696#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0043696#Artikel38
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '36'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0043696
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0043696
        artikel: '38'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '39.2'
    text: |-
      Voordat na het verrichten van onderhoud het luchtvaartuig weer in gebruik wordt genomen, wordt onder
      verantwoordelijkheid van de houder van het luchtvaartuig, of de erkende CAMO die het luchtvaartuig in beheer heeft,
      een verklaring, verder aangeduid als onderhoudsverklaring, opgesteld waarin is opgenomen wanneer het eerstvolgende
      geplande onderhoud wordt uitgevoerd. Als een onderhoudsverklaring wordt aangemerkt: het Journaal, de kolom ‘uren
      ‘over’ tot eerstvolgende onderhoudsbeurt' daarin, tezamen met een vermelding van de datum waarop het eerstvolgende
      onderhoud dat door middel van kalendertijd wordt bepaald in de kolom ‘opmerkingen' in het Journaal.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel39
  - number: '39.3'
    text: |-
      Zowel de inhoud als de vorm van de onder het eerste en tweede lid bedoelde certificaten en verklaringen zijn in
      overeenstemming met nadere aanwijzingen, voor zover die door de minister zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel39
  - number: '40.1'
    text: 'Periodiek onderhoud mag door de houder van het luchtvaartuig worden uitgesteld onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel40
  - number: 40.1.a
    text: |-
      de houder van het goedgekeurde ontwerp, bedoeld in [artikel 33, derde en vierde lid][ref1], geeft in zijn
      onderhoudsaanbevelingen een mogelijkheid tot uitstel van periodieke inspecties binnen gestelde grenzen;


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel33
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 40.1.b
    text: |-
      indien de houder van het goedgekeurde ontwerp, bedoeld in [artikel 33, derde en vierde lid][ref1], hierin
      niet voorziet geldt dat periodieke inspecties mogen worden uitgesteld met maximaal 10% van het in het
      onderhoudsprogramma opgenomen inspectie-interval. Dit uitstel wordt niet cumulatief gehanteerd, behalve voor
      inspecties op basis van kalendertijd.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel33
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '40.2'
    text: |-
      Voor zover de houder van het goedgekeurde ontwerp, bedoeld in [artikel 33, derde en vierde lid][ref1], dit niet
      uitdrukkelijk verbiedt, mogen onderdelen en uitrustingsstukken worden meegenomen in het uitstel. De uitvoering van
      een aanwijzing van de minister die gekoppeld is aan een periodieke inspectie van het luchtvaartuig, mag meegenomen
      worden in het uitstel.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel33
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '40.3'
    text: |-
      Indien wordt afgeweken van het eerste of tweede lid, is vooraf toestemming van de minister vereist. Voor de
      toestemming is in ieder geval een goedkeurende verklaring van de houder van het goedgekeurde ontwerp vereist.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel40
  - number: '41.1'
    text: |-
      De houder van een luchtvaartuig voert tijdens de geldigheidsduur van het voor dat luchtvaartuig afgegeven BvL, een
      technische administratie ten aanzien van het luchtvaartuig en van de volgende onderdelen daarvan:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel41
  - number: 41.1.a
    text: voortstuwingsinrichtingen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel41
  - number: 41.1.b
    text: luchtschroeven;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel41
  - number: 41.1.c
    text: 'onderdelen:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel41
  - number: 41.1.c.1°
    text: die na revisie of herstelling in het algemeen niet in hetzelfde luchtvaartuig zullen worden gemonteerd, en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel41
  - number: 41.1.c.2°
    text: |-
      waarvoor de in het derde lid, genoemde gegevens noodzakelijk zijn om na montage van het onderdeel in het
      luchtvaartuig het tijdstip te bepalen, waarop het onderdeel moet worden geïnspecteerd, gereviseerd of in verband
      met de beperkte levensduur buiten gebruik moet worden gesteld.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel41
  - number: '41.2'
    text: |-
      In de technische administratie van een luchtvaartuig zijn de onderhoudsverklaringen, de certificaten van
      vrijgave of de certificaten van vrijgave voor gebruik alsmede de onderliggende documenten betreffende de aan het
      luchtvaartuig verrichte werkzaamheden, opgenomen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel41
  - number: '41.3'
    text: |-
      In de technische administratie van onderdelen van luchtvaartuigen zijn de certificaten van vrijgave, alsmede de
      onderliggende documenten betreffende de aan het onderdeel verrichte werkzaamheden opgenomen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel41
  - number: '41.4'
    text: |-
      De gegevens worden beveiligd vastgelegd en mogen niet worden uitgewist, verwijderd of onleesbaar worden gemaakt. De
      gegevens zijn volledig, duidelijk leesbaar en begrijpelijk.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel41
  - number: '41.5'
    text: De technische administratie van een
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel41
  - number: 41.5.a
    text: |-
      vliegtuig met een maximaal toegelaten startmassa van 2.730 kg of minder, of een helikopters of gyrokopter met een
      maximaal toegelaten startmassa van 1.200 kg of minder, tenzij daarmee vluchten worden uitgevoerd onder een AOC of
      een ontheffing krachtens [artikel 16 van de Luchtvaartwet][ref1] voor het vervoer ten behoeve van eigen bedrijf, of


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
  - number: 41.5.b
    text: ballon of een zweefvliegtuig,
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel41
  - number: '41.6'
    text: |-
      De technische administratie van een vliegtuig met een maximaal toegelaten startmassa van meer dan 2.730 kg,
      een helikopters of een gyrokopter met een maximaal toegelaten startmassa van meer dan 1.200 kg, tenzij daarmee
      vluchten worden uitgevoerd onder een AOC of een ontheffing krachtens [artikel 16 van de Luchtvaartwet][ref1] voor
      het vervoer ten behoeve van eigen bedrijf, dat door de houder wordt opgesteld en bijgehouden overeenkomstig de
      voorschriften van Part ML, onderdeel ML.A.305, van verordening (EU) nr. 1321/2014, wordt geacht te voldoen aan de
      eisen in het eerste tot en met vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
  - number: '41.7'
    text: |-
      De houder van het luchtvaartuig kan de verplichting tot het voeren van een technische administratie contractueel
      uitbesteden aan een daartoe erkende CAMO.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel41
  - number: '42.1'
    text: |-
      Tenzij de minister een andere termijn heeft vastgesteld, wordt de technische administratie onder
      verantwoordelijkheid van de houder van het luchtvaartuig gedurende de hieronder aangegeven termijnen bewaard:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel42
  - number: 42.1.a
    text: 'met betrekking tot onderhoud anders dan revisie, wijzigingen of belangrijke herstellingen: twee jaar;'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel42
  - number: 42.1.b
    text: |-
      met betrekking tot revisies: gedurende de tijd totdat de aantekeningen van voorlaatste en laatste revisie
      beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel42
  - number: 42.1.c
    text: |-
      met betrekking tot wijzigingen en belangrijke herstellingen: tot één jaar is verstreken, nadat het luchtvaartuig in
      het luchtvaartuigregister is doorgehaald; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel42
  - number: 42.1.d
    text: |-
      met betrekking tot onderdelen met beperkte levensduur: tot één jaar is verstreken na de vervanging van het
      betreffende onderdeel.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel42
  - number: '42.2'
    text: |-
      De technische administratie onder verantwoordelijkheid van een CAMO als bedoeld in [artikel 33, eerste lid][ref1],
      wordt gedurende de termijnen, bedoeld in Bijlage V quater en Bijlage V quinquies van verordening (EU) nr. 1321/2014
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel33
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '42.3'
    text: |-
      De in het eerste lid, onder a, b en d gestelde verplichtingen blijven slechts één jaar van kracht, nadat het
      luchtvaartuig in het luchtvaartuigregister is doorgehaald.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel42
  - number: '43'
    text: |-
      De houder van een luchtvaartuig of de uitvoerder van onderhoud aan een luchtvaartuig meldt de bekende en vermoede
      gebreken van het luchtvaartuig alsmede defecten en beschadigingen, die zijn opgetreden of ontdekt in installaties
      of onderdelen van het luchtvaartuig en de luchtwaardigheid of het voldoen aan de geluidseisen nadelig beïnvloeden,
      schriftelijk of op digitale wijze en zo snel mogelijk maar tenminste binnen 72 uur na de waarneming aan de
      minister.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel43
  - number: '44.1'
    text: |-
      De houder van een luchtvaartuig is tijdens de geldigheidsduur van het voor dat luchtvaartuig afgegeven BvL
      verplicht op een door de minister gedaan verzoek het luchtvaartuig voor een onderzoek naar de luchtwaardigheid
      ter beschikking te stellen op een nader door de minister te bepalen tijdstip en plaats, waarbij zoveel mogelijk
      rekening zal worden gehouden met de belangen van de houder.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel44
  - number: '44.2'
    text: 'Tijdens een onderzoek als bedoeld in het eerste lid dient de houder:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel44
  - number: 44.2.a
    text: |-
      voldoende en deskundig personeel beschikbaar te stellen om de nodige assistentie te verlenen, alsmede de nodige
      hulpmiddelen, in het bijzonder voor het onderzoek van de installaties;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel44
  - number: 44.2.b
    text: |-
      te zorgen dat het luchtvaartuig goed is gereinigd en dat indien zulks voor het onderzoek noodzakelijk wordt
      geacht, alle wegneembare bekappingen, beplatingen en inspectieluiken zijn verwijderd of geopend en eventueel het
      luchtvaartuig verder voor inspectie toegankelijk worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel44
  - number: 44.2.c
    text: te zorgen dat de proeven en proefvluchten die de minister noodzakelijk acht worden uitgevoerd; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel44
  - number: 44.2.d
    text: 'te zorgen dat op verzoek van de minister:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel44
  - number: 44.2.d.1°
    text: het gewicht en het zwaartepunt van het luchtvaartuig wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel44
  - number: 44.2.d.2°
    text: de technische administratie wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel44
  - number: '44.3'
    text: |-
      Het eerste en tweede lid zijn met betrekking tot het onderzoek naar het voldoen aan de geluidseisen van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel44
  - number: '45.1'
    text: 'Het is verboden een amateurbouwluchtvaartuig te gebruiken voor:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel45
  - number: 45.1.a
    text: luchtwerk;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel45
  - number: 45.1.b
    text: vlieglessen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel45
  - number: 45.1.c
    text: commerciële doeleinden;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel45
  - number: 45.1.d
    text: verhuur of rondvluchten; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel45
  - number: 45.1.e
    text: |-
      vluchten boven of binnen een afstand van 100 meter van de bebouwde kommen, gebouwen, industriegebieden,
      havengebieden of mensenverzamelingen, tenzij benodigd voor start en landing.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel45
  - number: '45.2'
    text: |-
      De minister kan aanvullende gebruiksbeperkingen stellen. Deze aanvullende gebruiksbeperkingen worden opgenomen op
      het BvL of in een bijlage bij het BvL.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel45
  - number: '45.3'
    text: |-
      In en op het amateurbouwluchtvaartuig wordt duidelijk aangegeven dat het een experimenteel luchtvaartuig betreft
      waarvan niet is aangetoond dat het voldoet aan de internationale veiligheidseisen voor luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel45
  - number: '46.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel46
  - number: 46.1.a
    text: 'met een MLA luchtwerk te verrichten, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel46
  - number: 46.1.a.1°
    text: |-
      het slepen van een zeilvliegtuig, als bedoeld in
      [artikel 1, eerste lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1], met een MLA,
      dat is voorzien van een sleepinrichting, die is geaccepteerd door een luchtvaartautoriteit van één van de in
      [artikel 10, eerste lid, onderdeel a][ref2], genoemde landen, en


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0043696#Artikel10
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0043696
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 46.1.a.2°
    text: |-
      het slepen van een zweefvliegtuig, als bedoeld in
      [artikel 1, eerste lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1], met een MLA, die
      is geaccepteerd door de luchtvaartautoriteit van Duitsland inzake luchtwaardigheidseisen voor het slepen van
      zweefvliegtuigen;


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel1
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '1'
  - number: 46.1.b
    text: met een MLH, lichte gyrokopter, gemotoriseerd schermvliegtuig of paramotortrike luchtwerk te verrichten;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel46
  - number: 46.1.c
    text: |-
      een MLA, MLH, of lichte gyrokopter te gebruiken tegen vergoeding, met baat of voor commerciële doeleinden,
      met uitzondering van het gebruik voor instructie- en examenvluchten ter verkrijging, verlenging of
      vernieuwing van de bevoegdheid tot het vliegen met een MLA, MLH of lichte gyrokopter als bedoeld in de
      [Regeling bewijzen van bevoegdheid en bevoegdverklaringen voor luchtvarenden 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021240
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0021240
  - number: 46.1.d
    text: |-
      een gemotoriseerd schermvliegtuig of paramotortrike te gebruiken tegen vergoeding, met baat of voor commerciële
      doeleinden, met uitzondering van het gebruik voor instructie- en examenvluchten.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel46
  - number: '46.2'
    text: |-
      De houder van een MLA, MLH, lichte gyrokopter, gemotoriseerd schermvliegtuig of van een paramotortrike is verplicht
      om in het luchtvaartuig op een voor elke inzittende zichtbare plaats duidelijk leesbaar de volgende waarschuwing
      aan te brengen: **Waarschuwing voor inzittenden** Dit luchtvaartuig is niet gecertificeerd volgens internationale
      luchtwaardigheidsvoorschriften. Het veiligheidsniveau is niet vastgesteld. **Occupant Warning** This aircraft has
      not been certificated to international standards. The safety level has not been determined.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel46
  - number: '47.1'
    text: |-
      Onverminderd de [artikelen 44][ref1] en 45 worden met een amateurbouwluchtvaartuig, MLA, MLH, lichte gyrokopter,
      gemotoriseerd schermvliegtuig en paramotortrike slechts vluchten uitgevoerd:


      [ref1]: https://wetten.overheid.nl/BWBR0043696#Artikel44
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0043696
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 47.1.a
    text: |-
      met inachtneming van de blijkens het vlieghandboek van de fabrikant op het luchtvaartuig betrekking hebbende
      gebruiksbeperkingen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel47
  - number: 47.1.b
    text: |-
      indien met betrekking tot het luchtvaartuig een verzekering is gesloten tegen de burgerrechtelijke
      aansprakelijkheid voor dood of letsel van de inzittenden of derden of andere schade toegebracht aan de inzittenden
      of derden, overeenkomstig de in [artikel 7.4 van de Wet luchtvaart][ref1] gestelde limieten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel7
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '7'
  - number: '47.2'
    text: |-
      De gezagvoerder van een amateurbouwluchtvaartuig, MLA, MLH, lichte gyrokopter, gemotoriseerd schermvliegtuig of
      paramotortrike informeert iedere passagier voorafgaand aan de vlucht dat het luchtvaartuig niet is gecertificeerd
      volgens internationale luchtwaardigheidseisen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel47
  - number: '48.1'
    text: |-
      Tenzij ten behoeve van het starten en landen, is het verboden ten behoeve van niet-commercieel vervoer met een
      historisch luchtvaartuig voorzien van een speciaal-BvL lager te vliegen dan 300 meter of 1.000 voet boven de grond.
      Dit verbod geldt niet voor vluchten uitgevoerd met een historisch luchtvaartuig voorzien van een speciaal-Bvl. met
      een maximaal toegelaten startmassa van 2.000 kg of minder.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel48
  - number: '48.2'
    text: |-
      Tenzij ten behoeve van het starten en landen, is het verboden ten behoeve van niet-commerciële vervoer met een
      historisch luchtvaartuig voorzien van een speciaal-BvL tijdens VFR-vluchten boven aaneengesloten bebouwing,
      industriegebieden of concentraties van mensen te vliegen. Dit verbod geldt niet voor vluchten met:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel48
  - number: 48.2.a
    text: historische zweefvliegtuigen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel48
  - number: 48.2.b
    text: |-
      meermotorige historische vliegtuigen, mits deze in geval van nood het gebied boven aaneengesloten bebouwing,
      industrie of concentraties van mensen kunnen verlaten.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel48
  - number: '48.3'
    text: |-
      Met een historisch luchtvaartuig voorzien van een speciaal-BvL worden per jaar niet meer dan 200 vlieguren gemaakt,
      zulks exclusief het jaarlijks, vooraf in overleg met de minister vastgestelde, aantal noodzakelijk geachte uren
      voor opleiding, training en bekwaamheidseisen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel48
  - number: '48.4'
    text: |-
      Het is verboden tijdens de vluchtuitvoering ten behoeve van opleiding, training en bekwaamheid andere personen
      dan de instructeur en de voor de vluchtuitvoering noodzakelijke bemanningsleden aan boord van het desbetreffende
      historische luchtvaartuig te hebben.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel48
  - number: '48.5'
    text: |-
      Onverminderd het eerste tot en met vierde lid mogen met een historisch luchtvaartuig voorzien van een speciaal-
      BvL slechts vluchten worden uitgevoerd met inachtneming van de gebruiksbeperkingen die in het vlieghandboek van de
      fabrikant zijn opgenomen en op dat luchtvaartuig betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel48
  - number: '49.1'
    text: |-
      De houder van een historisch luchtvaartuig, die particulier of niet-commercieel vervoer verzorgt, is verplicht
      ten behoeve van elke vervoersactiviteit verzekerd te zijn tegen de aansprakelijkheid tegenover de vervoerde
      passagiers overeenkomstig de in [artikel 7.4 van de Wet luchtvaart][ref1] gestelde limieten, alsmede tegen de
      aansprakelijkheid voor schade, veroorzaakt aan derden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel7
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '7'
  - number: '49.2'
    text: |-
      Ten behoeve van niet-commercieel vervoer met een historisch luchtvaartuig beschikt de desbetreffende organisatie,
      de vereniging of de stichting over een kwaliteitshandboek waarin deze heeft vastgelegd op welke wijze zij de
      veilige exploitatie van dat historisch luchtvaartuig verzekert.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel49
  - number: '49.3'
    text: |-
      De organisatie, de vereniging of de stichting moet kunnen aantonen, dat elke passagier een redelijke tijd voor
      de vluchtuitvoering zowel mondeling als schriftelijk in een voor elke passagier begrijpelijke taal op de hoogte
      is gesteld van het feit dat het vervoer met een historisch luchtvaartuig betreft dat voldoet aan gedateerde
      en dus ten opzichte van de ten tijde van de desbetreffende vlucht geldende luchtwaardigheidseisen lagere
      luchtwaardigheidseisen.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel49
  - number: '49.4'
    text: |-
      De sponsor van een organisatie tot instandhouding van historische luchtvaart maakt voor de vluchtuitvoering zijn
      naam en de naam van zijn genodigden schriftelijk aan de organisatie bekend.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel49
  - number: '49.5'
    text: |-
      De leden van een vereniging en de begunstigers van een stichting met als een statutair doel instandhouding van
      historische luchtvaart moeten voor, tijdens en na de vlucht kunnen aantonen dat zij lid van de desbetreffende
      vereniging respectievelijk begunstiger van de desbetreffende stichting zijn.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel49
  - number: '50.1'
    text: |-
      Het tijdelijk verblijven en opereren in Nederland en het tijdelijk gebruik van het Nederlandse luchtruim
      van het vluchtinformatiegebied Amsterdam door een, in een andere lidstaat van de European Civil Aviation
      Conference ingeschreven amateurbouwluchtvaartuig, MLA, MLH, lichte gyrokopter, gemotoriseerd schermvliegtuig of
      paramotortrike, welke niet voorzien is van een geldig EASA-BvL of een geldig ICAO-standaard-BvL, is toegestaan
      onder de volgende voorschriften en beperkingen:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: 50.1.a
    text: |-
      door het bevoegde gezag van de desbetreffende lidstaat, die het bewijs van inschrijving heeft afgegeven, is tevens
      een bewijs afgegeven waaruit blijkt dat de uitoefening van de luchtvaart met het betrokken luchtvaartuig in die
      lidstaat is toegestaan;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: 50.1.b
    text: |-
      de door het bevoegd gezag van de desbetreffende lidstaat vastgestelde voorwaarden voor en beperkingen van het
      gebruik van het luchtvaartuig worden nagekomen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: 50.1.c
    text: |-
      met betrekking tot het luchtvaartuig is een verzekering afgesloten tegen de burgerrechtelijke aansprakelijkheid
      voor dood of letsel van de inzittenden of derden of andere schade toegebracht aan de inzittenden of derden; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: 50.1.d
    text: |-
      het is verboden in de Nederlandse luchtruim van het vluchtinformatiegebied Amsterdam deze luchtvaartuigen te
      gebruiken voor:
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: 50.1.d.1°
    text: luchtwerk;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: 50.1.d.2°
    text: vlieglessen;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: 50.1.d.3°
    text: commerciële doeleinden;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: 50.1.d.4°
    text: verhuur of rondvluchten;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: 50.1.d.5°
    text: |-
      vluchten boven of binnen een afstand van 100 meter van de bebouwde kommen, gebouwen, industriegebieden,
      havengebieden of mensenverzamelingen, tenzij benodigd voor start en landing.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: '50.2'
    text: |-
      Deze generieke toestemming is beperkt tot een verblijf van maximaal achtentwintig, al dan niet opeenvolgende, dagen
      per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: '50.3'
    text: |-
      Het eerste en tweede lid zijn overeenkomstig van toepassing op historische luchtvaartuigen als bedoeld in onderdeel
      a, onder 1, van Bijlage I bij de basisverordening, waarvan het type luchtvaartuig voorheen was voorzien van een
      ICAO-standaard-BvL en nu opereert op een ‘Permit to Fly’ of equivalent document afgegeven door een lidstaat van de
      European Civil Aviation Conference en het maximum startgewicht van het luchtvaartuig is niet groter dan 5.700 kg.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: '50.4'
    text: 'De volgende documenten zijn beschikbaar voor inspectie door de toezichthoudende functionarissen:'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: 50.4.a
    text: een geldig bewijs van registratie afgegeven door een lidstaat van de European Civil Aviation Conference;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: 50.4.b
    text: |-
      een geldig speciaal BvL, ‘Permit to Fly’ of equivalent document afgegeven door een lidstaat van de European Civil
      Aviation Conference;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: 50.4.c
    text: een geldig bewijs aanwijzing radiostation indien van toepassing;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: 50.4.d
    text: het bewijs, dat een verzekering bedoeld in het eerste lid, onder c is gesloten; en
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: 50.4.e
    text: |-
      een geldig bewijs van bevoegdheid voor het desbetreffende luchtvaartuig afgegeven door een lidstaat van de European
      Civil Aviation Conference;
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: '50.5'
    text: |-
      Voor een verblijf in Nederland langer dan achtentwintig al dan niet opeenvolgende dagen per kalenderjaar wordt
      schriftelijke toestemming van de minister gevraagd.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: '50.6'
    text: |-
      Voor verblijf in Nederland of het gebruik van het Nederlandse luchtruim door een luchtvaartuig niet voorzien van
      een geldig EASA-BvL of een geldig ICAO-standaard-BvL en niet vallende onder de toepassing van het eerste of het
      vierde lid, wordt schriftelijke toestemming van de minister gevraagd.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel50
  - number: '51.1'
    text: |-
      De [Regeling amateurbouwluchtvaartuigen][ref1], de [Regeling historische luchtvaart][ref2],
      de [Regeling MLA’s, MLH’s en gemotoriseerde schermvliegtuigen][ref3], de
      [Regeling aanvullende type-certificatie luchtwaardigheid][ref4] en de [Regeling onderhoud luchtvaartuigen][ref5],
      zoals dezen luidden onmiddellijk voorafgaand aan de inwerkingtreding van de onderhavige regeling, blijven tot
      die datum van inwerkingtreding van toepassing op de behandeling van de aanvraag voor certificaten, acceptaties,
      verklaringen, goedkeuringen, instemmingen, toestemmingen, en overige documenten op grond van bovengenoemde
      regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013494
      [ref2]: https://wetten.overheid.nl/BWBR0017356
      [ref3]: https://wetten.overheid.nl/BWBR0015237
      [ref4]: https://wetten.overheid.nl/BWBR0025367
      [ref5]: https://wetten.overheid.nl/BWBR0012882
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0013494
      - id: ref2
        bwb_id: BWBR0017356
      - id: ref3
        bwb_id: BWBR0015237
      - id: ref4
        bwb_id: BWBR0025367
      - id: ref5
        bwb_id: BWBR0012882
  - number: '51.2'
    text: |-
      De documenten bedoeld in het eerste lid, die hun geldigheid niet hebben verloren, behouden vanaf de
      inwerkingtreding van deze regeling hun geldigheid voor zover gedurende die periode hun geldigheidsduur
      overeenkomstig de voorwaarden waaronder elk van deze documenten is afgegeven niet is verlopen, en voor zover aan
      hetgeen ingevolge de genoemde regelingen, zoals deze golden voor de inwerkingtreding van deze regeling, is voldaan.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel51
  - number: '52'
    text: Deze regeling wordt vijf jaren na haar inwerkingtreding geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel52
  - number: '53'
    text: |-
      De [Regeling amateurbouwluchtvaartuigen][ref1], de [Regeling historische luchtvaart][ref2],
      de [Regeling MLA’s, MLH’s en gemotoriseerde schermvliegtuigen][ref3], de
      [Regeling aanvullende type-certificatie luchtwaardigheid][ref4] en de [Regeling onderhoud luchtvaartuigen][ref5]
      worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0013494
      [ref2]: https://wetten.overheid.nl/BWBR0017356
