  - number: '54'
    text: Deze regeling treedt in werking met ingang van 1 oktober 2020.
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel54
  - number: '55'
    text: 'Deze regeling wordt aangehaald als: Regeling nationale veiligheidsvoorschriften luchtvaartuigen.'
    url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#Artikel55
