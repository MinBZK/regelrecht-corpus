preamble:
  text: |-
    Gelet op de artikelen 3.13, vierde lid, 3.24, en 7.1, tweede lid, van de Wet luchtvaart, de artikelen 2, vierde
    lid, 6, 8, derde lid, 9, 12, tweede lid, en 13, van het Besluit luchtvaartuigen 2008, de artikelen 11, derde lid,
    en 19, derde lid, van het Besluit luchtverkeer 2014, artikel 7 van het Besluit ongeregeld luchtvervoer, en artikel
