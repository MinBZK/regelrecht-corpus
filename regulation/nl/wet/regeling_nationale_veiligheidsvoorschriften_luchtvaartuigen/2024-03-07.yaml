    BESLUIT:
  url: https://wetten.overheid.nl/BWBR0043696/2024-03-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *amateurbouwluchtvaartuig:* luchtvaartuig als bedoeld in Bijlage I,
      onderdeel 1, onder c, bij de basisverordening;
        - *algemene luchtvaart:* luchtvaart met vleugelvliegtuigen met een maximaal toegelaten startmassa van 5.700 kg of
      minder, helikopters met een maximaal toegelaten startmassa van 2.730 kg of minder, gyrokopters met een maximaal
      toegelaten startmassa van 2.730 kg of minder, ballonnen, luchtschepen en (motor)zweefvliegtuigen;
        - *AR:* beoordeling van de luchtwaardigheid van een luchtvaartuig conform Part M, subpart I, of conform Part ML,
      subpart I, van verordening (EU) nr. 1321/2014, (Airworthiness Review);
        - *belangrijke herstelling:* werkzaamheden om een defect of beschadigd luchtvaartuig of onderdeel daarvan te
      herstellen die, indien deze niet op de juiste wijze worden uitgevoerd, in een niet te verwaarlozen mate invloed
      hebben op de luchtwaardigheid of het voldoen aan de geluidseisen van het luchtvaartuig of de deugdelijkheid van
      het onderdeel;
        - *BvL-acceptatiekeuring:* inspectie van een luchtvaartuig in het kader van de afgifte van een bewijs van
      luchtwaardigheid, naar aanleiding waarvan de minister wordt geadviseerd over de luchtwaardigheid van dat
      luchtvaartuig;
        - *BvL-verlengingsinspectie:* inspectie van een luchtvaartuig in het kader van de verlenging van een bewijs
      van luchtwaardigheid, naar aanleiding waarvan de minister wordt geadviseerd over de luchtwaardigheid van dat
      luchtvaartuig;
        - *CAMO:* ingevolge bijlage V quater (Part CAMO) bij verordening (EU) nr. 1321/2014 erkende
      onderhoudsmanagementorganisatie voor blijvende luchtwaardigheid (Continuing Airworthiness Management Organisation);
        - *certificatiebasis:* document waarin naast de van toepassing zijnde eisen voor afgifte van een type-certificaat
      of een aanvullend type-certificaat, dan wel de goedkeuring van een ontwerp voor amateurbouw, een eventuele wijze
      van interpretatie, dispensatie van eis of equivalente eis, is opgenomen;
        - *CS-STAN:* door de EASA geaccepteerde methoden en technieken om standaardwijzigingen en standaardreparaties uit
      te voeren en te documenteren, (Certification Specifications Standard Changes and Standard Repairs);
        - *complex onderhoud:* onderhoud als genoemd in Aanhangsel VII bij Bijlage I (Part M) van verordening (EU)
      nr. 1321/2014;
        - *erkend bedrijf:* bedrijf dat door de minister op grond van
      [artikel 17 van het Besluit luchtvaartuigen 2008][ref1] is erkend;
        - *exportinspectie:* inspectie van een luchtvaartuig op luchtwaardigheidseisen van het importerende land in
      het kader van de export van het luchtvaartuig, naar aanleiding waarvan de minister wordt geadviseerd over de
      luchtwaardigheid van dat luchtvaartuig;
        - *geaccepteerd type luchtvaartuig:* 1. luchtvaartuig van een type dat naar het oordeel van de minister voldoet
      aan een ontwerp dat is goedgekeurd door de staat van ontwerp, zijnde een verdragsland, conform ICAO Annex 8 door
      middel van een civiel type-certificaat, of conform de nationale wet- en regelgeving zoals geldig vóór vaststelling
      van ICAO Annex 8; en 2. zweefvliegtuig van een type dat is ontworpen in het Verenigd Koninkrijk en voorzien van een
      ‘datasheet’ uitgegeven door de British Glider Association;
        - *historisch luchtvaartuig:* luchtvaartuig als bedoeld in Bijlage I, onderdeel 1, onder a, bij de
      basisverordening;
        - *ICAO Annex 16:* de op grond van het op 7 december 1944 te Chicago gesloten Verdrag inzake de Burgerluchtvaart
      (Trb. 1973, 109) door de Internationale Burgerluchtvaartorganisatie vastgestelde Bijlage 16, boekdeel I, deel II;
      betreffende geluidsnormering voor luchtvaartuigen;
        - *ingrijpende wijziging:* wijziging van het goedgekeurde ontwerp van het luchtvaartuig die een merkbaar effect
      heeft op de massa, de balans, de structurele sterkte, de betrouwbaarheid, de operationele kenmerken, het geluid,
      de brandstofventilatie, de uitlaatemissie, de gegevens betreffende de operationele geschiktheid of andere kenmerken
      die de luchtwaardigheid van het luchtvaartuig beïnvloeden;
        - *lijst van bewijsvoering:* document waarin wordt vastgelegd op welke wijze is aangetoond dat aan de in de
      certificatiebasis gestelde eisen is voldaan en met welke middelen dit is onderbouwd;
        - *log-entry:* verklaring met betrekking tot uitgevoerde werkzaamheden;
        - *maximaal toegelaten startmassa:* massa die een luchtvaartuig mag hebben wanneer het zich van het aardoppervlak
      verheft;
        - *minister:* Minister van Infrastructuur en Waterstaat;
        - *niet-complex onderhoud:* onderhoud anders dan genoemd in Aanhangsel VII bij Part M, of Aanhangsel III bij Part
      ML van verordening (EU) nr. 1321/2014;
        - *niet-commercieel vervoer:* vervoer zonder winstoogmerk door een rechtspersoonlijkheid bezittende organisatie
      als houder van een luchtvaartuig of door een particuliere houder van een luchtvaartuig waarbij, 1. uitsluitend
      de vervoerskosten en de kosten van het trainen van de bemanning worden doorberekend en 2. het uitsluitend vervoer
      betreft van sponsors van een organisatie tot instandhouding van historische luchtvaart en hun genodigden, alsmede
      van leden van een vereniging of begunstigers van een stichting met als een statutair doel instandhouding van
      historische luchtvaart;
        - *onderhoud:* revisie, reparatie, inspectie, vervanging, uitvoering van een wijziging, of de herstelling van een
      defect van een luchtvaartuig of luchtvaartuigonderdeel of een combinatie van deze werkzaamheden, met uitzondering
      van direct aan elke vlucht voorafgaande inspectie van het luchtvaartuig of daarmee gelijk te stellen inspecties;
        - *onderhoudsprogramma:* gedetailleerd overzicht van het geplande onderhoud dat aan het luchtvaartuig moet worden
      uitgevoerd om het luchtwaardig te houden;
        - *onderhoudstechnicus:* houder van een geldig, ingevolge [artikel 3.30 van de Wet luchtvaart][ref2] afgegeven,
      bewijs van bevoegdheid betreffende onderhoud van luchtvaartuigen;
        - *orphan aircraft:* luchtvaartuig waarvan de blijvende luchtwaardigheid niet meer wordt ondersteund als gevolg van
      het intrekken door de staat van ontwerp van zijn verklaring tot ondersteuning van het ontwerp;
        - *Part ML:* deel betreffende de blijvende luchtwaardigheid van lichte EASA-luchtvaartuigen, Bijlage V ter bij
      verordening (EU) nr. 1321/2014;
        - *replica:* luchtvaartuig, dat geheel of gedeeltelijk is nagebouwd volgens een bestaand ontwerp, al dan niet met
      gebruikmaking van de oorspronkelijke ontwerp- en bouwgegevens;
        - *revisie:* het weer in goede staat brengen van een luchtvaartuig of luchtvaartuigonderdeel door middel van
      inspectie en vervanging in overeenstemming met een goedgekeurde norm ter verlenging van de operationele levensduur;
        - *schermvliegtuig:* luchtvaartuig als bedoeld in
      [artikel 1, eerste lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref3];
        - *verdragsland:* land waarmee in het kader van een van de volgende verdragen een overeenkomst is gesloten
      inzake de wederzijdse erkenning van bewijzen van luchtwaardigheid: het op 13 september 1995 te ’s-Gravenhage
      tot stand gekomen Verdrag tussen de Verenigde Staten van Amerika en het Koninkrijk der Nederlanden inzake de
      bevordering van de veiligheid van de luchtvaart (Trb. 1996, 3), de op 17 december 2009 te Brussel tot stand gekomen
      Luchtvervoersovereenkomst tussen Canada en de Europese Gemeenschap en haar lidstaten (Trb. 2010, 211) en, de op
      22 april 1960 te Parijs gesloten Multilaterale Overeenkomst inzake bewijzen van luchtwaardigheid van ingevoerde
      luchtvaartuigen (Trb. 1961, 117);
        - *vervoerskosten:* kosten van verzekering, brandstof, onderhouds- en reparatiekosten alsmede landings- en
      stallingsgelden.


      [ref1]: https://wetten.overheid.nl/BWBR0023922#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010629#Artikel1
