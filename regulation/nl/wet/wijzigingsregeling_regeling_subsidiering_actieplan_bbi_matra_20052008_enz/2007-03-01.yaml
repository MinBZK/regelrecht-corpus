articles:
  - number: III
    text: |-
      Op projecten en programma’s waarvoor voor het tijdstip van inwerkingtreding van deze regeling subsidie is verleend,
      blijft het recht zoals dat gold op het tijdstip van de subsidieverlening van toepassing.
