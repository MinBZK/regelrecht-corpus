---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_arbeidsongeschiktheidsverzekering
regulatory_layer: WET
publication_date: '2026-02-03'
valid_from: '2004-03-01'
bwb_id: BWBR0002524
url: https://wetten.overheid.nl/BWBR0002524/2004-03-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen vast te stellen inzake een verplichte
    verzekering van loontrekkenden tegen geldelijke gevolgen van langdurige arbeidsongeschiktheid;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: 1.1.b
    text: |-
      Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 1.1.c
    text: |-
      Arbeidsongeschiktheidsfonds: het fonds, bedoeld in [artikel 72][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel72
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '72'
        hoofdstuk: III
        paragraaf: '2'
  - number: 1.1.d
    text: |-
      lichamen: rechtspersonen, maat- en vennootschappen, samenwerkingsvormen zonder rechtspersoonlijkheid die
      maatschappelijk kunnen worden gelijkgesteld met verenigingen, ondernemingen van publiekrechtelijke rechtspersonen
      en doelvermogens;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: 1.1.e
    text: |-
      Arbeidsongeschiktheidskas: de Arbeidsongeschiktheidskas, bedoeld in [artikel 73][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel73
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '73'
        hoofdstuk: III
        paragraaf: '2'
  - number: 1.1.f
    text: |-
      eigen risicodrager: de werkgever aan wie de toestemming is verleend, bedoeld in [artikel 75, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '75'
        hoofdstuk: IIIA
  - number: 1.1.g
    text: |-
      vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 1.1.h
    text: |-
      onbetaald verlof: een tussen werkgever en werknemer overeengekomen periode van verlof, waarbij op grond van
      [artikel 6, tweede lid][ref1], geen dienstbetrekking aanwezig is;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel6
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '6'
        hoofdstuk: I
        paragraaf: '2'
  - number: 1.1.i
    text: |-
      rechtens zijn vrijheid is ontnomen: rechtens zijn vrijheid is ontnomen, behoudens de
      gevallen, bedoeld in de Wet bijzondere opnemingen in psychiatrische ziekenhuizen en in
      [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '37'
  - number: 1.1.j
    text: |-
      justitiële inrichting: een penitentiaire inrichting, een inrichting voor verpleging van ter beschikking
      gestelden, of een inrichting voor justitiële jeugdbescherming zijnde een landelijke voorziening als bedoeld in
      [artikel 65 van de Wet op de jeugdhulpverlening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel65
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '65'
  - number: '1.2'
    text: 'Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: 1.2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: 1.2.b
    text: 'echtgenoten: geregistreerde partners;'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: 1.2.c
    text: 'gehuwd: als partner geregistreerd.'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: '1.3'
    text: 'Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: 1.3.a
    text: |-
      als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde meerderjarige
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: 1.3.b
    text: als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: '1.4'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: '1.5'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: 1.5.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: 1.5.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: 1.5.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: 1.5.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: '1.6'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: '1.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel1
  - number: '2.1'
    text: Waar iemand woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel2
  - number: '2.2'
    text: |-
      Voor de toepassing van het eerste lid worden schepen en luchtvaartuigen, die binnen Nederland hun thuishaven
      hebben, beschouwd als deel van Nederland.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel2
  - number: '3.1'
    text: |-
      Werknemer is de natuurlijke persoon, jonger dan 65 jaar, die in privaatrechtelijke of in publiekrechtelijke
      dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3
  - number: '3.2'
    text: |-
      Wie zijn dienstbetrekking buiten Nederland vervult, wordt niet als werknemer beschouwd, tenzij hij in Nederland
      woont en zijn werkgever eveneens in Nederland woont of gevestigd is. Voor zover een werkgever:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3
  - number: 3.2.a
    text: |-
      in Nederland een vaste inrichting voor de uitoefening van zijn bedrijf of beroep of een in Nederland wonende of
      gevestigde vaste vertegenwoordiger heeft; of
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3
  - number: 3.2.b
    text: in Nederland een of meer personen in dienst heeft en hij door of vanwege Onze Minister als werkgever is aangewezen,
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3
  - number: '3.3'
    text: |-
      In afwijking van het eerste en tweede lid wordt niet als werknemer beschouwd de vreemdeling die niet rechtmatig in
      Nederland verblijf houdt in de zin van [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '3.4'
    text: 'Bij of krachtens algemene maatregel van bestuur kan worden bepaald, dat:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3
  - number: 3.4.a
    text: |-
      personen, die buiten Nederland wonen ook als werknemer worden beschouwd, voor zover zij hun dienstbetrekking buiten
      Nederland vervullen;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3
  - number: 3.4.b
    text: |-
      personen, die in Nederland wonen, ook als werknemer worden beschouwd, voor zover zij hun dienstbetrekking buiten
      Nederland vervullen en hun werkgever buiten Nederland woont of gevestigd is.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3
  - number: '3.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan van het eerste, tweede en derde lid worden afgeweken ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3
  - number: 3.5.a
    text: vreemdelingen;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3
  - number: 3.5.b
    text: |-
      personen, op wie een regeling van toepassing is inzake verzekering tegen geldelijke gevolgen van langdurige
      arbeidsongeschiktheid van de Nederlandse Antillen, van Aruba, van een andere mogendheid, of van een
      volkenrechtelijke organisatie; en
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3
  - number: 3.5.c
    text: personen, die slechts tijdelijk in Nederland verblijven of tijdelijk in Nederland werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3
  - number: '3.6'
    text: 'Bij een maatregel, als bedoeld in het vijfde lid, kan worden afgeweken van het derde lid ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3
  - number: 3.6.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3
  - number: 3.6.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3a
    text: |-
      Zo nodig in afwijking van [artikel 3][ref1] en de daarop berustende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: 3a.a
    text: |-
      wordt als werknemer beschouwd de persoon van wie de verzekering op grond van deze wet voortvloeit uit de toepassing
      van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3a
  - number: 3a.b
    text: |-
      wordt niet als werknemer beschouwd de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel3a
  - number: '4.1'
    text: 'Als dienstbetrekking wordt mede beschouwd de arbeidsverhouding van:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: 4.1.a
    text: |-
      degene, die anders dan als zelfstandige als bedoeld in
      [artikel 4 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1], en anders
      dan als thuiswerker, ingevolge een overeenkomst tot aanneming van werk als bedoeld in
      [artikel 750 van Boek 7 van het Burgerlijk Wetboek][ref2], persoonlijk een werk tot stand brengt;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel750
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '750'
  - number: 4.1.b
    text: degene, die de onder *a* bedoelde persoon bij het tot stand brengen van dat werk bijstaat;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: 4.1.c
    text: |-
      degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en die ander, mits hij de bedoelde
      bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een voor hem bijkomstige
      werkzaamheid is en hij zich daarbij doorgaans niet door meer dan twee andere personen laat bijstaan;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: 4.1.d
    text: |-
      degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander,
      mits hij de bedoelde bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een
      voor hem bijkomstige werkzaamheid is en hij zich daarbij doorgaans niet door meer dan twee andere personen laat
      bijstaan;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: 4.1.f
    text: |-
      degene, die als lid van de bemanning van een vissersvaartuig aanspraak heeft op een aandeel in de besomming, tenzij
      hij
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: 4.1.f.1
    text: |-
      als zodanig tegen geldelijke gevolgen van arbeidsongeschiktheid verzekerd is bij het Sociaal Fonds voor de
      Maatschapsvisserij of
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: 4.1.f.2
    text: exploitant of mede-exploitant van het vaartuig is;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: 4.1.h
    text: |-
      degene, die als bestuurder werkzaam is ten behoeve van een coöperatie die met haar leden uitsluitend
      arbeidsovereenkomsten als bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] sluit,
      indien hij lid is van de coöperatie en deze blijkens haar statuten en met inachtneming van de vereisten gesteld in
      het derde lid en krachtens het vierde lid kan worden beschouwd als een coöperatie met werknemerszelfbestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: '4.2'
    text: |-
      Het bepaalde in het vorige lid, onder *a* en *b*, blijft buiten toepassing, indien de onder *a* bedoelde
      overeenkomst rechtstreeks is aangegaan met een natuurlijk persoon ten behoeve van diens persoonlijke
      aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: '4.3'
    text: 'Een coöperatie als bedoeld in het eerste lid, onderdeel *h*, dient te voldoen aan de vereisten, dat:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: 4.3.a
    text: |-
      doorgaans ten minste twee derde deel van het aantal personen met wie de coöperatie een arbeidsovereenkomst als
      bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] heeft gesloten, lid van de
      coöperatie is;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 4.3.b
    text: |-
      het lidmaatschap van de coöperatie door ieder van de in onderdeel *a* bedoelde personen onder dezelfde voorwaarden
      kan worden verkregen en voorwaarden van geldelijke aard geen wezenlijke belemmering vormen voor de verkrijging van
      het lidmaatschap;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: 4.3.c
    text: de leden van de coöperatie ieder één stem hebben;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: 4.3.d
    text: |-
      de arbeidsvoorwaarden van de leden van de coöperatie niet wezenlijk verschillen van hetgeen gebruikelijk is bij
      gelijksoortige ondernemingen in de desbetreffende sector;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: 4.3.e
    text: |-
      een lid van de coöperatie, behoudens in geval van liquidatie van de coöperatie, bij beëindiging van zijn
      lidmaatschap ten hoogste aanspraak kan maken op het door hem uit hoofde van een geldelijke voorwaarde als bedoeld
      in onderdeel *b*, hetzij uit anderen hoofde aan de coöperatie betaalde bedrag, herrekend naar geldontwaarding.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: '4.4'
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld waarbij de in het derde lid genoemde vereisten
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: 4.4.a
    text: nader worden bepaald;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: 4.4.b
    text: |-
      worden aangevuld met andere vereisten op grond waarvan de coöperatie kan worden beschouwd als een coöperatie met
      werknemerszelfbestuur.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
  - number: '4.5'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, wordt met een zelfstandige als bedoeld in
      [artikel 4 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel4
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '4'
  - number: 4.5.a
    text: |-
      een directeur-grootaandeelhouder als bedoeld in [artikel 6, eerste lid, onderdeel d][ref1], die het werk tot
      stand brengt uitsluitend voor rekening en risico van de onderneming van de rechtspersoon waarvan hij directeur-
      grootaandeelhouder is;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel6
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '6'
        hoofdstuk: I
        paragraaf: '2'
  - number: 4.5.b
    text: |-
      de directeur-grootaandeelhouder als bedoeld in [artikel 6, eerste lid, onderdeel d][ref1], voor wie met
      betrekking tot de werkzaamheden, bedoeld in het eerste lid, onder a, een beschikking geldt als bedoeld in
      [artikel 6a, eerste lid][ref2], waarin hij wordt gelijkgesteld met een zelfstandige.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel6a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '6'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 6a
        hoofdstuk: I
        paragraaf: '2'
  - number: '5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld, ingevolge welke eveneens als
      dienstbetrekking wordt beschouwd de arbeidsverhouding van:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel5
  - number: 5.a
    text: degene, die als thuiswerker arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel5
  - number: 5.b
    text: degene, die de onder *a* bedoelde persoon als hulp bij het verrichten van de arbeid bijstaat;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel5
  - number: 5.c
    text: degene, die als musicus of anderszins als artiest optreedt dan wel als beroep een tak van sport beoefent;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel5
  - number: 5.d
    text: |-
      degene, die tegen beloning persoonlijk arbeid verricht en wiens arbeidsverhouding niet reeds ingevolge de
      voorgaande bepalingen als dienstbetrekking wordt beschouwd, doch hiermede maatschappelijk gelijk kan worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel5
  - number: '6.1'
    text: 'Als dienstbetrekking wordt niet beschouwd de arbeidsverhouding van:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6
  - number: 6.1.a
    text: |-
      degene, bedoeld in [ artikel 2, eerste lid, onderdeel a of d van de Ambtenarenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel2
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '2'
  - number: 6.1.b
    text: |-
      degene, die een verplichting naleeft, hem opgelegd door de wet of voortvloeiende uit een verbintenis anders dan bij
      arbeidsovereenkomst door hem jegens de Overheid aangegaan ten aanzien van ’s lands verdediging of ter bescherming
      van de openbare orde en de veiligheid der bevolking, alsmede van degene, die als vrijwilliger al dan niet tegen
      loon werkzaamheden verricht bij een gemeentelijke brandweer;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6
  - number: 6.1.c
    text: |-
      degene, die ten behoeve van de natuurlijke persoon, tot wie hij in dienstbetrekking staat, uitsluitend of nagenoeg
      uitsluitend huiselijke of persoonlijke diensten in diens huishouding verricht en die diensten doorgaans op minder
      dan drie dagen per week verricht;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6
  - number: 6.1.d
    text: de directeur-grootaandeelhouder.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6
  - number: '6.2'
    text: |-
      Geen dienstbetrekking wordt geacht aanwezig te zijn op dagen, waarop geen arbeid wordt verricht en geen uitkering
      of een uitkering van minder dan de helft van het normale loon van de werkgever wordt genoten, tenzij het niet
      verrichten van de arbeid zijn oorzaak vindt in:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6
  - number: 6.2.a
    text: |-
      een normale onderbreking van of verhindering tot het verrichten van de arbeid, zolang deze onderbreking of
      verhindering niet langer dan een maand heeft geduurd;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6
  - number: 6.2.b
    text: weersinvloeden, gebrek aan materialen of dergelijke omstandigheden;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6
  - number: 6.2.d
    text: |-
      de omstandigheid, dat de dienstbetrekking er toe strekt, dat slechts een gedeelte van een normale werkweek arbeid
      wordt verricht;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6
  - number: 6.2.e
    text: |-
      de omstandigheid, dat de dienstbetrekking er toe strekt, dat niet regelmatig in elke kalenderweek arbeid wordt
      verricht, voor zover het betreft de kalenderweek waarin arbeid wordt verricht of arbeid zou worden verricht, indien
      de betrokkene niet arbeidsongeschikt was geworden;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6
  - number: 6.2.f
    text: |-
      arbeidsongeschiktheid, ter zake waarvan ziekengeld ingevolge de [Ziektewet][ref1] of
      arbeidsongeschiktheidsuitkering ingevolge deze wet is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '6.3'
    text: Het eerste en tweede lid zijn alleen van toepassing op de aldaar bedoelde arbeidsverhoudingen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6
  - number: '6.4'
    text: |-
      Door Onze Minister worden, in overeenstemming met Onze Minister van Financiën, regels gesteld omtrent hetgeen onder
      directeur-grootaandeelhouder, bedoeld in het eerste lid, onderdeel d, wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6
  - number: 6a.1
    text: |-
      De beschikking, bedoeld in [artikel 3.157 van de Wet inkomstenbelasting 2001][ref1], dat de werkzaamheden, die
      voortvloeien uit een arbeidsrelatie of uit arbeidsrelaties waarin sprake is van hetzelfde soort van werkzaamheden
      die onder overeenkomstige condities worden verricht, worden aangemerkt als werkzaamheden uitsluitend verricht voor
      rekening en risico van de onderneming van de rechtspersoon waarvan de belastingplichtige aanmerkelijk belanghouder
      is, heeft voor de termijn waarvoor deze beschikking geldt als gevolg dat de directeur-grootaandeelhouder als
      bedoeld in[ artikel 6, eerste lid, onderdeel d][ref2], met betrekking tot die arbeidsrelaties, voor de toepassing
      van [artikel 4, eerste lid, onder a][ref3], en de regels bij of krachtens [artikel 5][ref4], wordt aangemerkt als
      zelfstandige als bedoeld in [artikel 4 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0008656#Artikel4
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '6'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '4'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '5'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0008656
        artikel: '4'
  - number: 6a.2
    text: |-
      Voor de toepassing van de [artikelen 75a, derde lid][ref1], [76a, tweede lid][ref2], en [87g][ref3]
      wordt de beschikking, bedoeld in het eerste lid, aangemerkt als een beschikking als bedoeld in
      [artikel 4a van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4] waarin de directeur-
      grootaandeelhouder wordt aangemerkt als zelfstandige als bedoeld in [artikel 4 van die wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel76a
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel87g
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel4a
      [ref5]: https://wetten.overheid.nl/BWBR0008656#Artikel4
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 76a
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 87g
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0008656
        artikel: 4a
      - id: ref5
        bwb_id: BWBR0008656
        artikel: '4'
  - number: 6a.3
    text: |-
      Indien de beschikking, bedoeld in het eerste lid, wordt herzien, laat dat het in het eerste en tweede lid bedoelde
      gevolg onverlet, voor de termijn waarvoor die beschikking gold.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel6a
  - number: '7'
    text: 'Voor de toepassing van deze wet wordt als werknemer beschouwd:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel7
  - number: 7.a
    text: |-
      degene, die krachtens de verplichte verzekering op grond van de [Werkloosheidswet][ref1] (*Stb.* 1986, 566)
      uitkering ontvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 7.b
    text: |-
      in door Onze Minister aan te wijzen gevallen degene, die ten minste vijf of ten
      minste de helft van zijn arbeidsuren per kalenderweek heeft verloren als bedoeld in
      [artikel 16, eerste lid, onderdeel a, van de Werkloosheidswet][ref1], doch aan wie geen uitkering wordt verleend
      op grond van enige bepaling van die wet of van het uitkeringsreglement werkloosheidsverzekeringen van het
      Uitvoeringsinstituut werknemersverzekeringen of van een regeling als bedoeld in onderdeel c;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
  - number: 7.c
    text: |-
      degene, die wegens werkloosheid niet werkt en die ingevolge een door Onze Minister aan te wijzen, van overheidswege
      getroffen regeling uitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel7
  - number: 7a
    text: 'Voor de toepassing van deze wet wordt mede als werknemer beschouwd:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel7a
  - number: 7a.a
    text: |-
      degene, die krachtens de verplichte verzekering ingevolge de [Ziektewet][ref1] ziekengeld ontvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 7a.b
    text: |-
      in door Onze Minister aan te wijzen gevallen degene, die wegens arbeidsongeschiktheid niet werkt, doch aan wie geen
      ziekengeld wordt verleend op grond van enige bepaling van de [Ziektewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 7a.c
    text: |-
      degene, die wegens arbeidsongeschiktheid niet werkt, doch aan wie geen ziekengeld wordt betaald op grond van
      [artikel 29, eerste lid, van de Ziektewet][ref1] maar wel een toeslag op grond van de [Toeslagenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0004043
  - number: 7b
    text: |-
      Voor de toepassing van deze wet wordt mede als werknemer beschouwd degene, die op grond van de verplichte
      verzekering ingevolge deze wet uitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel7b
  - number: 7c
    text: 'Voor de toepassing van deze wet wordt mede als werknemer beschouwd:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel7c
  - number: 7c.a
    text: |-
      de werknemer of gelijkgestelde, bedoeld in [artikel 3:6, eerste lid, van de Wet arbeid en zorg][ref1] aan wie
      uitkering wordt betaald op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van die wet](onbekend);


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 7c.b
    text: |-
      in door Onze Minister aan te wijzen gevallen, degene die in verband met zwangerschap en bevalling niet werkt,
      anders dan bedoeld in [artikel 29a van de Ziektewet][ref1], doch aan wie geen uitkering wordt betaald op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 29a
  - number: '8'
    text: |-
      Werkgever is de natuurlijke persoon tot wie, of het lichaam tot welk een of meer natuurlijke personen in
      dienstbetrekking staan.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel8
  - number: '9'
    text: 'Als werkgever wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel9
  - number: 9.1°
    text: |-
      in de gevallen, bedoeld in [artikel 4, eerste lid][ref1], onder: *a* en *b:* de aanbesteder; *c* en *d:* degene,
      met wie de overeenkomst tot bemiddeling is gesloten; *e:* *f:* de exploitant of mede-exploitant van het vaartuig;
      *g:* *h*: de coöperatie;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel4
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '4'
        hoofdstuk: I
        paragraaf: '2'
  - number: 9.2°
    text: |-
      in de gevallen, bedoeld in [artikel 5][ref1], onder: *a:* de opdrachtgever; *b:* de thuiswerker; *c:* degene, met
      wie het optreden of de sportbeoefening is overeengekomen; *d:* degene, die bij de in [artikel 5][ref2] bedoelde
      algemene maatregel van bestuur als werkgever wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel5
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '5'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '5'
        hoofdstuk: I
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen wordt als werkgever beschouwd in de gevallen, bedoeld
      in [artikel 7, onderdeel a][ref1], [artikel 7a, onderdelen a en c][ref2], [artikel 7b][ref3] en
      [artikel 7c, onderdeel a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel7b
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel7c
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 7a
        hoofdstuk: I
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 7b
        hoofdstuk: I
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 7c
        hoofdstuk: I
        paragraaf: '2'
  - number: '10.2'
    text: |-
      In de gevallen, bedoeld in [artikel 7, onderdeel b en c][ref1], [artikel 7a, onderdeel b][ref2], en
      [artikel 7c, onderdeel b][ref3], wordt als werkgever beschouwd degene, die door Onze Minister als werkgever wordt
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel7c
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 7a
        hoofdstuk: I
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 7c
        hoofdstuk: I
        paragraaf: '2'
  - number: '10.3'
    text: |-
      Ingeval het Uitvoeringsinstituut werknemersverzekeringen de uitkering of toeslag, bedoeld in de artikelen genoemd
      in het eerste lid, vermeerderd met de daarover door de werkgever verschuldigde premies, betaalt aan de werkgever,
      bedoeld in [artikel 8][ref1], [9][ref2] of [11][ref3], teneinde deze uitkering of toeslag door diens tussenkomst
      te doen uitbetalen, treedt voor de toepassing van het eerste lid, deze in de plaats van het Uitvoeringsinstituut
      werknemersverzekeringen, onafhankelijk van het voortbestaan van de dienstbetrekking met die werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel11
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '8'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '9'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '11'
        hoofdstuk: I
        paragraaf: '3'
  - number: '11'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Financiën, in afwijking van het bepaalde in de
      [artikelen 8][ref1] en [9][ref2] een ander dan de aldaar bedoelde personen aanwijzen als werkgever met betrekking
      tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel9
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '8'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '9'
        hoofdstuk: I
        paragraaf: '3'
  - number: 11.a
    text: |-
      degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel11
  - number: 11.b
    text: degene, die een thuiswerker als hulp bij het verrichten van de arbeid bijstaat;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel11
  - number: 11.c
    text: degene, die als musicus of anderszins als artiest optreedt dan wel als beroep een tak van sport beoefent.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel11
  - number: '12'
    text: |-
      De werkgever is verplicht de werknemer gelegenheid te geven tot het uitoefenen van de hem bij of krachtens deze
      wet toegekende bevoegdheden en tot het nakomen van de hem bij of krachtens deze wet opgelegde verplichtingen, voor
      zover de uitoefening van die bevoegdheden en de nakoming van die verplichtingen niet buiten de arbeidstijd kan
      geschieden.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel12
  - number: '13.1'
    text: |-
      Deze wet verstaat onder loon het loon in de zin van de [Coördinatiewet Sociale Verzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002126
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002126
  - number: '13.2'
    text: |-
      Minimumloon is het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1] (*Stb.* 1968, 657)
      of, indien het een werknemer jonger dan 23 jaar betreft, het voor zijn leeftijd geldende minimumloon per maand,
      bedoeld in [artikel 7, derde lid][ref2], en [artikel 8, derde lid, van genoemde wet][ref3], beide vermeerderd met
      de daarover berekende vakantietoeslag, bedoeld in [artikel 15 van die wet][ref4], en vervolgens gedeeld door 21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '13.3'
    text: |-
      Loon, door verschillende personen tezamen onverdeeld genoten, wordt, voor zover niet blijkt van een andere
      verdeling, geacht door ieder van hen voor een gelijk deel te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel13
  - number: '13.4'
    text: |-
      Degene, die krachtens een regeling als bedoeld in [artikel 7, onderdeel c][ref1], uitkering ontvangt, wordt geacht
      op elke dag, waarover hij die uitkering ontvangt, een loon te ontvangen, gelijk aan die uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel7
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
  - number: '14.1'
    text: |-
      Voor de berekening van een arbeidsongeschiktheidsuitkering, waarop ingevolge deze wet aanspraak bestaat, wordt
      als dagloon beschouwd: hetgeen de uitkeringsgerechtigde, ware hij niet arbeidsongeschikt, indien hij werkzaam
      was in het beroep, dat - of de beroepen, welke - hij gewoonlijk uitoefende, gerekend naar het loonpeil op de dag
      van ingang van de arbeidsongeschiktheidsuitkering, gedurende het daaropvolgende jaar bij een vijfdaagse werkweek
      gemiddeld per dag zou kunnen verdienen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel14
  - number: '14.2'
    text: Onze Minister stelt met betrekking tot de vaststelling van het dagloon nadere regels.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel14
  - number: '14.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, zo nodig in afwijking van de door Onze Minister op grond van
      het tweede lid gestelde regels, regels stellen met betrekking tot de vaststelling van het dagloon voor één of meer
      categorieën van werknemers. Deze regels behoeven goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel14
  - number: '15.1'
    text: |-
      De daglonen worden herzien met ingang van de dag waarop en in de mate waarin het bedrag genoemd in
      [artikel 8, eerste lid, onder c, van de Wet minimumloon en minimumvakantiebijslag][ref1] (*Stb.* 1968, 657) wordt
      herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '15.2'
    text: |-
      Onze Minister maakt in de *Staatscourant* bekend met ingang van welke dag en met welk percentage een herziening als
      bedoeld in het eerste lid plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel15
  - number: '15.3'
    text: |-
      Op een beschikking als gevolg van een herziening van het dagloon ingevolge het bepaalde in dit artikel zijn de
      [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '16'
    text: De werknemers in de zin van deze wet zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel16
  - number: '17.1'
    text: Degene, die
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel17
  - number: 17.1.a
    text: gedurende twee maanden onafgebroken op alle dagen verzekerd is geweest, of
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel17
  - number: 17.1.b
    text: |-
      in de loop van de twee maanden, voorafgaande aan het einde van zijn verzekering, op ten minste 16 dagen verzekerd
      is geweest,
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel17
  - number: '17.2'
    text: |-
      Voor de toepassing van het in het vorige lid, onder *a*, bepaalde wordt de daar genoemde termijn van twee maanden
      geacht niet te zijn onderbroken, indien de betrokkene gedurende niet meer dan 7 dagen niet verzekerd is geweest.
      Voor de toepassing van dit en het vorige lid wordt arbeid, in een aaneengesloten nachtdienst op twee dagen
      verricht, gerekend als arbeid op één dag.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel17
  - number: '17.3'
    text: |-
      Het bepaalde in het eerste lid blijft buiten toepassing ten aanzien van degene, die in verband met het bepaalde in
      [artikel 6, eerste lid, onder ][ref1], niet verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel6
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '6'
        hoofdstuk: I
        paragraaf: '2'
  - number: '17.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld, ingevolge welke personen, die niet
      verzekerd zijn en die arbeidsongeschikt worden of, in gevallen als bedoeld in [artikel 37, eerste lid][ref1],
      meer arbeidsongeschikt worden als gevolg van bij die maatregel aan te wijzen beroepsziekten, voor het recht
      op toekenning, onderscheidenlijk herziening van een arbeidsongeschiktheidsuitkering worden beschouwd alsof zij
      verzekerd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel37
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '37'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17.5'
    text: |-
      Degene, die niet verzekerd is en een toelage ontvangt als bedoeld in artikel
      58, eerste of derde lid, van de Algemene Arbeidsongeschiktheidswet of
      [artikel 28, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref1], wordt voor het recht op
      toekenning en herziening van een arbeidsongeschiktheidsuitkering beschouwd alsof hij verzekerd is, mits hij een
      arbeidsongeschiktheidsuitkering ontvangt, dan wel gedurende het jaar vóór de dag, met ingang waarvan de toelage is
      verleend, verzekerd was.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel28
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '28'
  - number: '18.1'
    text: |-
      Arbeidsongeschikt, geheel of gedeeltelijk, is hij die als rechtstreeks en objectief medisch vast te stellen gevolg
      van ziekte, gebreken, zwangerschap of bevalling geheel of gedeeltelijk niet in staat is om met arbeid te verdienen,
      hetgeen gezonde personen, met soortgelijke opleiding en ervaring, ter plaatse waar hij arbeid verricht of het
      laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel18
  - number: '18.2'
    text: |-
      Degene die op en sedert het tijdstip dat zijn verzekering een aanvang neemt, reeds gedeeltelijk arbeidsongeschikt
      is in de zin van het eerste lid, wordt voor wat de door hem aan deze wet te ontlenen aanspraken betreft als
      geheel of gedeeltelijk arbeidsongeschikt aangemerkt, indien hij als rechtstreeks en objectief medisch vast te
      stellen gevolg van ziekte of gebreken geheel of gedeeltelijk niet in staat is om met arbeid te verdienen, hetgeen
      soortgelijke personen, die in dezelfde mate arbeidsongeschikt zijn in de zin van het eerste lid, ter plaatse waar
      hij arbeid verricht of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen.
      De eerste zin blijft buiten toepassing ten aanzien van degene die onmiddellijk voorafgaande aan het tijdstip,
      waarop de verzekering een aanvang nam, ononderbroken onbetaald verlof, tot een maximum van achttien maanden,
      heeft genoten, behoudens voorzover het betreft gedeeltelijke arbeidsongeschiktheid in de zin van het eerste lid,
      die bestond op de dag, voorafgaande aan de eerste dag van dit verlof. Als ononderbroken onbetaald verlof wordt
      aangemerkt perioden van onbetaald verlof die elkaar met een onderbreking van minder dan een maand opvolgen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel18
  - number: '18.3'
    text: |-
      Indien de bij de aanvang van de verzekering aanwezige arbeidsongeschiktheid in de zin van het eerste lid naderhand
      is afgenomen vindt het tweede lid vervolgens overeenkomstige toepassing, met dien verstande dat voor de aanvang
      van de verzekering in de plaats treedt het tijdstip waarop de arbeidsongeschiktheid in de zin van het eerste lid
      is afgenomen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel18
  - number: '18.4'
    text: |-
      Het tweede en derde lid vinden geen toepassing indien bij de aanvang van de verzekering de betrokkene uit hoofde
      van een vroegere verzekeringsperiode reeds een arbeidsongeschiktheidsuitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel18
  - number: '18.5'
    text: |-
      In het eerste en tweede lid wordt onder de eerstgenoemde arbeid verstaan alle algemeen geaccepteerde arbeid waartoe
      de werknemer met zijn krachten en bekwaamheden in staat is.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel18
  - number: '18.6'
    text: |-
      Bij de vaststelling van de mate van arbeidsongeschiktheid wordt buiten beschouwing gelaten of de werknemer de
      arbeid feitelijk kan verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel18
  - number: '18.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het bepaalde in dit artikel nadere en zo
      nodig afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel18
  - number: '18.9'
    text: 'Van een ontwerp van een besluit tot vaststelling, wijziging of intrekking van:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel18
  - number: 18.9.a
    text: een algemene maatregel van bestuur als bedoeld in het achtste lid;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel18
  - number: 18.9.b
    text: een krachtens de in onderdeel *a* bedoelde algemene maatregel van bestuur door Onze Minister genomen besluit,
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel18
  - number: '18.10'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent een afwijkende
      wijze van vaststelling van de mate van arbeidsongeschiktheid in gevallen waarin recht bestaat op een
      arbeidsongeschiktheidsuitkering op grond van deze wet en een arbeidsongeschiktheidsuitkering op grond van een
      andere wettelijke regeling ter verzekering tegen geldelijke gevolgen van langdurige arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel18
  - number: '19.1'
    text: |-
      De verzekerde, die arbeidsongeschikt wordt, heeft, zodra hij onafgebroken 104 weken arbeidsongeschikt is
      geweest, recht op toekenning van arbeidsongeschiktheidsuitkering, indien hij na afloop van deze periode nog
      arbeidsongeschikt is. Als eerste dag van de arbeidsongeschiktheid geldt de eerste werkdag waarop wegens ziekte niet
      is gewerkt of het werken tijdens de werktijd is gestaakt. Het Uitvoeringsinstituut werknemersverzekeringen kan voor
      bijzondere gevallen regels stellen inzake welke dag als eerste werkdag wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel19
  - number: '19.2'
    text: |-
      Voor het bepalen van het tijdvak van 104 weken, bedoeld in het vorige lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken
      opvolgen. Bij de vaststelling van de periode van vier weken blijven perioden, waarin uitkering
      in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid,][ref1][3:8][ref2]
      of [3:10, eerste lid van de Wet arbeid en zorg][ref3] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '19.3'
    text: |-
      Recht op toekenning van arbeidsongeschiktheidsuitkering heeft eveneens de verzekerde, bedoeld in het eerste lid,
      die na afloop van het in het eerste, tweede, en zevende lid bedoelde tijdvak niet arbeidsongeschikt is, doch ten
      aanzien van wie dit wel het geval is binnen vier weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel19
  - number: '19.4'
    text: |-
      Voor de toepassing van het bepaalde in de vorige leden wordt niet als arbeidsongeschikt beschouwd degene, die
      minder dan 15% arbeidsongeschikt is.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel19
  - number: '19.5'
    text: |-
      Voor het bepalen van het tijdvak van 104 weken, bedoeld in de vorige leden, worden steeds in aanmerking genomen
      tijdvakken, gedurende welke aanspraak bestaat op ziekengeld krachtens de [Ziektewet][ref1] en worden niet in
      aanmerking genomen tijdvakken gedurende welke een uitkering wordt genoten als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '19.6'
    text: |-
      Voor de toepassing van het bepaalde in het vorige lid wordt een belanghebbende geacht aanspraak te
      hebben op ziekengeld krachtens de [Ziektewet][ref1], indien hem in verband met de [artikelen 19a][ref2],
      [19b][ref3],[29][ref4], [30][ref5], [31][ref6], [42][ref7], [44][ref8] en [45 van de Ziektewet][ref9] geen
      ziekengeld wordt uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel19b
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel30
      [ref6]: https://wetten.overheid.nl/BWBR0001888#Artikel31
      [ref7]: https://wetten.overheid.nl/BWBR0001888#Artikel42
      [ref8]: https://wetten.overheid.nl/BWBR0001888#Artikel44
      [ref9]: https://wetten.overheid.nl/BWBR0001888#Artikel45
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 19a
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 19b
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref5
        bwb_id: BWBR0001888
        artikel: '30'
      - id: ref6
        bwb_id: BWBR0001888
        artikel: '31'
      - id: ref7
        bwb_id: BWBR0001888
        artikel: '42'
      - id: ref8
        bwb_id: BWBR0001888
        artikel: '44'
      - id: ref9
        bwb_id: BWBR0001888
        artikel: '45'
  - number: '19.7'
    text: |-
      De wachttijd, bedoeld in het eerste lid, wordt door het Uitvoeringsinstituut werknemersverzekeringen
      verlengd op gezamenlijk verzoek van de verzekerde en de werkgever jegens wie de verzekerde,
      bij ongeschiktheid tot het verrichten van arbeid wegens ziekte, recht heeft op loon als
      bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1], tenzij [artikel 29][ref2]
      of [29a, derde of zevende lid van de Ziektewet][ref3] van toepassing is dan wel aanspraak heeft op bezoldiging
      op grond van [artikel XV, tweede lid, van de Wet terugdringing ziekteverzuim][ref4], tenzij onderdeel a van het
      elfde lid van dat artikel van toepassing is, tenzij zwaarwegende omstandigheden zich daartegen verzetten. De
      verlengde wachttijd eindigt op de door het Uitvoeringsinstituut werknemersverzekeringen aangegeven datum. De
      verlengde wachttijd kan op verzoek van de werkgever of de werknemer worden verkort. Het Uitvoeringsinstituut
      werknemersverzekeringen stelt bij verkorting van de verlengde wachttijd een nieuwe datum vast waarop de verlengde
      wachttijd eindigt, met dien verstande dat de wachttijd niet eerder eindigt dan vijftien weken na dat verzoek
      tenzij de werkgever voor het verstrijken van het tijdvak van die vijftien weken geen loon meer verschuldigd
      is, omdat de dienstbetrekking is geëindigd. Bij de bekendmaking van het besluit maakt het Uitvoeringsinstituut
      werknemersverzekeringen melding van de mogelijkheid van het doen van een aanvraag voor de toekenning van de
      uitkering alsmede van de termijn binnen welke die aanvraag wordt gedaan. Het tweede en vierde lid zijn van
      overeenkomstige toepassing. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot dit
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
      [ref4]: https://wetten.overheid.nl/BWBR0006355#ArtikelXV
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 29a
      - id: ref4
        bwb_id: BWBR0006355
        artikel: XV
  - number: 19a.1
    text: |-
      De verzekerde, bedoeld in [artikel 19][ref1], heeft geen recht op toekenning van arbeidsongeschiktheidsuitkering
      indien de dag waarop het recht op arbeidsongeschiktheidsuitkering zou ingaan, is gelegen in een periode dat hem
      rechtens zijn vrijheid is ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 19a.2
    text: |-
      De persoon, die op grond van het eerste lid geen recht op toekenning van arbeidsongeschiktheidsuitkering
      heeft alsmede de persoon die op grond van [artikel 19b van de Ziektewet][ref1] geen recht heeft op
      ziekengeld, wordt vanaf de dag dat hij in vrijheid wordt gesteld weer als verzekerde aangemerkt en heeft met
      inachtneming van de bepalingen van deze wet recht op toekenning van arbeidsongeschiktheidsuitkering, indien
      hij op die dag arbeidsongeschikt is. [Artikel 19, vierde lid][ref2], is van overeenkomstige toepassing. De
      [artikelen 18, tweede tot en met vierde lid][ref3], en [30, eerste lid, onderdeel a][ref4] zijn niet van
      toepassing, behoudens voorzover het betreft de op de dag voorafgaande aan de eerste dag dat die persoon rechtens
      zijn vrijheid is ontnomen aanwezige arbeidsongeschiktheid in de zin van [artikel 18, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19b
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 19b
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '30'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
  - number: 19a.3
    text: |-
      Voor de toepassing van het eerste lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel19a
  - number: 19a.4
    text: |-
      De persoon, bedoeld in het tweede lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten
      aanzien van wie dit wel het geval is binnen vier weken na die dag, wordt vanaf de dag dat hij in vrijheid
      is gesteld weer als verzekerde aangemerkt en heeft met inachtneming van de bepalingen van deze wet recht op
      toekenning van arbeidsongeschiktheidsuitkering. [Artikel 19, vierde lid][ref1], is van overeenkomstige toepassing.
      [Artikel 30, eerste lid, onderdeel b][ref2], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel30
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '30'
        hoofdstuk: II
        paragraaf: '1'
  - number: 19a.5
    text: |-
      Het eerste lid is niet van toepassing en het tweede en vierde lid zijn van overeenkomstige toepassing op bij
      algemene maatregel van bestuur aan te wijzen categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf
      of vrijheidsbenemende maatregel buiten een justitiële inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel19a
  - number: '20.1'
    text: |-
      De verzekerde, bedoeld in [artikel 19][ref1], heeft geen recht op toekenning van arbeidsongeschiktheidsuitkering
      indien de dag waarop het recht op arbeidsongeschiktheidsuitkering zou ingaan, is gelegen in een periode dat hij
      niet in Nederland woont.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '20.2'
    text: |-
      Het eerste lid is niet van toepassing indien de verzekerde op die dag woont in een land waarin op
      grond van een verdrag of een besluit van een volkenrechtelijke organisatie recht op toekenning van
      arbeidsongeschiktheidsuitkering kan bestaan.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel20
  - number: '20.3'
    text: |-
      De persoon, die op grond van het eerste lid geen recht op toekenning van arbeidsongeschiktheidsuitkering heeft
      alsmede de persoon die op grond van [artikel 19a van de Ziektewet][ref1] geen recht heeft op ziekengeld, wordt
      vanaf de dag:


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 19a
  - number: 20.3.a
    text: dat hij in Nederland woont; of
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel20
  - number: 20.3.b
    text: |-
      dat hij in een land woont waarmee een verdrag in werking is getreden dan wel een besluit van een volkenrechtelijke
      organisatie van kracht is geworden, op grond waarvan recht op toekenning van arbeidsongeschiktheidsuitkering kan
      bestaan;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel20
  - number: '20.4'
    text: |-
      De persoon, bedoeld in het derde lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien
      van wie dit wel het geval is binnen vier weken na die dag, wordt vanaf die dag weer als verzekerde aangemerkt en
      heeft met inachtneming van de bepalingen van deze wet recht op toekenning van arbeidsongeschiktheidsuitkering.
      [Artikel 19, vierde lid][ref1], is van overeenkomstige toepassing. [Artikel 30, eerste lid, onderdeel b][ref2], is
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel30
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '30'
        hoofdstuk: II
        paragraaf: '1'
  - number: '20.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het eerste lid afwijkende regels worden
      gesteld ten gunste van:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel20
  - number: 20.5.a
    text: de verzekerde, die werkzaamheden verricht in het algemeen belang en niet in Nederland woont;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel20
  - number: 20.5.b
    text: de verzekerde, die in de Nederlandse Antillen of Aruba woont; of
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel20
  - number: 20.5.c
    text: de gezinsleden van de in de onderdelen a of b bedoelde verzekerde.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel20
  - number: '20.6'
    text: |-
      Onze Minister deelt mede in welke landen op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op toekenning van arbeidsongeschiktheidsuitkering kan bestaan. In deze mededeling wordt tevens
      opgenomen:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel20
  - number: 20.6.a
    text: de vindplaats van het desbetreffende verdrag of besluit, en
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel20
  - number: 20.6.b
    text: de eventueel in dat verdrag of besluit aanwezige beperkingen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel20
  - number: '21.1'
    text: |-
      De arbeidsongeschiktheidsuitkering op grond van deze wet bestaat achtereenvolgens uit een loondervingsuitkering,
      waarvoor het dagloon als maatstaf geldt en een vervolguitkering, waarvoor het vervolgdagloon als maatstaf geldt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel21
  - number: '21.2'
    text: |-
      De arbeidsongeschiktheidsuitkering bedraagt per dag, de zaterdagen en zondagen niet meegerekend, bij een
      arbeidsongeschiktheid van:







                    15-25%


                    14%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    25-35%


                    21%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    35-45%


                    28%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    45-55%


                    35%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    55-65%


                    42%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    65-80%


                    50,75%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    80% of meer


                    70%


                    van 100/108 maal het dagloon of het vervolgdagloon
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel21
  - number: '21.3'
    text: |-
      Bij de vaststelling van de mate van arbeidsongeschiktheid wordt, zoveel doenlijk, rekening gehouden met verkregen
      nieuwe bekwaamheden.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel21
  - number: 21a
    text: |-
      De duur van de loondervingsuitkering is voor degene, die op de datum met ingang waarvan hem een
      arbeidsongeschiktheidsuitkering wordt toegekend: 58 jaar of ouder is zes jaar; 53 jaar of ouder is drie jaar; 48
      jaar of ouder is twee jaar; 43 jaar of ouder is anderhalf jaar; 38 jaar of ouder is één jaar; 33 jaar of ouder is
      een half jaar, en jonger is dan 33 jaar nihil.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel21a
  - number: 21b.1
    text: |-
      Na afloop van de in [artikel 21a][ref1] bedoelde periode bestaat recht op vervolguitkering met als maatstaf het
      vervolgdagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 21a
        hoofdstuk: II
        paragraaf: '1'
  - number: 21b.2
    text: |-
      Het vervolgdagloon is gelijk aan het minimumloon verhoogd met een percentage van het verschil tussen het dagloon en
      het minimumloon.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel21b
  - number: 21b.3
    text: |-
      Voor de berekening van het vervolgdagloon geldt een percentage van 2 maal het aantal verstreken jaren tussen het
      15e jaar en de leeftijd van de betrokkene op de datum met ingang waarvan hem een arbeidsongeschiktheidsuitkering
      wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel21b
  - number: 21b.4
    text: Indien het dagloon lager is dan het minimumloon wordt het vervolgdagloon vastgesteld op het dagloon.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel21b
  - number: 21b.5
    text: |-
      Voor de toepassing van [artikel 21a][ref1] en het derde lid wordt voor degene ten aanzien van wie
      [artikel 35, tweede lid][ref2], wordt toegepast als datum met ingang waarvan de arbeidsongeschiktheidsuitkering
      wordt toegekend in aanmerking genomen de datum waarop de arbeidsongeschiktheidsuitkering zou zijn toegekend als dat
      lid niet was toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel35
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 21a
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
  - number: '22'
    text: |-
      Een arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van 80% of meer, wordt, indien
      de betrokkene in een althans voorlopig blijvende toestand van hulpbehoevendheid, welke geregeld oppassing en
      verzorging nodig maakt, verkeert, voor de duur van die hulpbehoevendheid tot ten hoogste 100/108 maal zijn dagloon
      of zijn vervolgdagloon verhoogd. Het bepaalde in de vorige volzin vindt geen toepassing, indien de betrokkene in
      een inrichting is opgenomen en de kosten van verblijf ten laste van een verzekering inzake ziektekosten komen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel22
  - number: '23.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, zo dikwijls hij zulks nodig oordeelt de persoon die aanspraak
      maakt op of in het genot is van een arbeidsongeschiktheidsuitkering, alsmede degene met betrekking tot wie
      premiekorting als bedoeld in [artikel 79b][ref1] wordt toegekend of wordt overwogen te worden toegekend oproepen
      of doen oproepen en op een door of vanwege het Uitvoeringsinstituut werknemersverzekeringen te bepalen plaats
      ondervragen of doen ondervragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel79
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '79'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '23.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan de in het eerste lid bedoelde personen op een door of vanwege
      het Uitvoeringsinstituut werknemersverzekeringen te bepalen plaats door een of meer daartoe door hem aangewezen
      deskundigen doen onderzoeken.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel23
  - number: '23.3'
    text: |-
      De daartoe door het Uitvoeringsinstituut werknemersverzekeringen aangewezen deskundige kan, ook zonder opdracht
      van het Uitvoeringsinstituut werknemersverzekeringen, de in het eerste lid bedoelde personen oproepen, ondervragen,
      onderzoeken, doen oproepen, doen ondervragen en doen onderzoeken door een of meer door hem daartoe aangewezen
      deskundigen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel23
  - number: '24.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de door hem daartoe aangewezen deskundige kunnen de
      persoon die aanspraak maakt op of in het genot is van een arbeidsongeschiktheidsuitkering voorschriften geven
      in het belang van een behandeling of van genezing dan wel voorzover dit voortvloeit uit de taak, bedoeld in
      [artikel 10 van de Wet op de (re)integratie arbeidsgehandicapten][ref1], tot behoud, herstel en bevordering van de
      mogelijkheid tot het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
  - number: '24.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan in het kader van de uitvoering van het eerste lid
      voorschrijven dat de persoon, bedoeld in het eerste lid, zich laat registreren als werkzoekende bij de Centrale
      organisatie werk en inkomen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel24
  - number: '25.1'
    text: |-
      Indien een persoon als bedoeld in [artikel 23, eerste lid][ref1], na tijdig opgeroepen te zijn, niet verscheen
      of weigerde:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel23
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '23'
        hoofdstuk: II
        paragraaf: '1'
  - number: 25.1.a
    text: |-
      vragen te beantwoorden die zijn gesteld door het Uitvoeringsinstituut werknemersverzekeringen of de door hem
      daartoe aangewezen deskundige;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel25
  - number: 25.1.b
    text: |-
      zich te laten onderzoeken door de door het Uitvoeringsinstituut werknemersverzekeringen daartoe aangewezen
      deskundige; of
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel25
  - number: 25.1.c
    text: |-
      te voldoen aan het voorschrift, gegeven door het Uitvoeringsinstituut werknemersverzekeringen of de door
      hem daartoe aangewezen deskundige, om zich ter observatie te doen opnemen of te verblijven in een aangewezen
      inrichting,
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel25
  - number: '25.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig het bepaalde in het eerste lid bij
      toeneming van de arbeidsongeschiktheid, voor zover deze toeneming kennelijk is voortgekomen uit dezelfde oorzaak
      als de arbeidsongeschiktheid, ter zake waarvan het niet voldoen aan de oproeping of de weigering plaatsvond.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel25
  - number: '26'
    text: |-
      Opgeroepenen en, indien hun toestand geleide nodig maakt, mede hun geleiders, worden reiskosten, verblijfkosten en
      tijdverlies vergoed in de gevallen en volgens regels, door het Uitvoeringsinstituut werknemersverzekeringen vast
      te stellen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel26
  - number: '27'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd controlevoorschriften vast te stellen. Deze
      voorschriften mogen niet verder gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel27
  - number: '28'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig het bepaalde in [artikel 25][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel25
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '25'
        hoofdstuk: II
        paragraaf: '1'
  - number: 28.a
    text: |-
      indien de belanghebbende de door het Uitvoeringsinstituut werknemersverzekeringen of de door hem daartoe aangewezen
      deskundige krachtens [artikel 24][ref1] in het belang van een behandeling of genezing of tot behoud, herstel of
      bevordering van de mogelijkheid tot het verrichten van arbeid en tot registratie als werkzoekende bij de Centrale
      organisatie werk en inkomen gegeven voorschriften zonder deugdelijke grond niet opvolgt;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel24
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '24'
        hoofdstuk: II
        paragraaf: '1'
  - number: 28.b
    text: |-
      indien de belanghebbende zich niet, zolang als het Uitvoeringsinstituut werknemersverzekeringen of de door hem
      daartoe aangewezen deskundige te kennen heeft gegeven dit noodzakelijk te achten, onder geneeskundige behandeling
      stelt of indien hij de voorschriften van de behandelende arts niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel28
  - number: 28.c
    text: |-
      indien de belanghebbende zich schuldig maakt aan gedragingen, waardoor zijn genezing wordt belemmerd of nalaat
      voldoende mede te werken om aanpassing aan zijn ziekte of gebrek te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel28
  - number: 28.d
    text: |-
      indien de belanghebbende de controlevoorschriften, bedoeld in [artikel 27][ref1], of de verplichting bedoeld
      in [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], niet of
      niet behoorlijk is nagekomen dan wel de verplichting bedoeld in [artikel 80][ref3] niet binnen de door het
      Uitvoeringsinstituut werknemersverzekeringen daarvoor vastgestelde termijn is nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '27'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: 28.e
    text: indien de belanghebbende zijn arbeidsongeschiktheid opzettelijk heeft veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel28
  - number: 28.f
    text: |-
      indien belanghebbende zich niet houdt aan de voorschriften, bedoeld in [artikel 34, derde lid][ref1],
      [artikel 34a, eerste lid][ref2], of [artikel 34a, vierde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel34a
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel34a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 34a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 34a
        hoofdstuk: II
        paragraaf: '2'
  - number: 28.g
    text: |-
      indien de belanghebbende zonder redelijke gronden niet meewerkt aan een scholing of opleiding die door zijn
      werkgever of het Uitvoeringsinstituut werknemersverzekeringen uit hoofde van de uitoefening van hun taak op grond
      van [artikel 8][ref1] of [10 van de Wet op de (re)integratie arbeidsgehandicapten][ref2] wenselijk wordt geacht
      voor zijn inschakeling in de arbeid;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '10'
  - number: 28.h
    text: |-
      indien de belanghebbende zonder deugdelijke grond weigert of heeft geweigerd mee te werken aan door zijn werkgever
      of door een door die werkgever aangewezen deskundige gegeven redelijke voorschriften of getroffen maatregelen
      die erop gericht zijn om de belanghebbende in staat te stellen passende arbeid te verrichten dan wel indien bij
      de behandeling van de aanvraag, bedoeld in [artikel 34, derde lid][ref1], en bij de beoordeling als bedoeld in
      [artikel 34a, eerste lid][ref2], blijkt dat de belanghebbende zonder deugdelijke grond onvoldoende reïntegratie-
      inspanningen heeft verricht. Voor de toepassing van dit onderdeel wordt onder werkgever mede verstaan de
      eigenrisicodrager, bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel34a
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel1
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 34a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '1'
  - number: '29.1'
    text: |-
      Een maatregel als bedoeld in [artikel 25][ref1] of [28][ref2] wordt afgestemd op de ernst van de gedraging en de
      mate waarin de belanghebbende de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in elk
      geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel28
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '25'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '28'
        hoofdstuk: II
        paragraaf: '1'
  - number: '29.2'
    text: |-
      Indien het niet tijdig nakomen van de verplichting, bedoeld in [artikel 80][ref1], niet heeft geleid tot
      het ten onrechte of tot een te hoog bedrag verlenen van uitkering, of indien de belanghebbende zich niet
      houdt aan de voorschriften, bedoeld in [artikel 34, derde lid][ref2] of [artikel 34a, eerste lid][ref3] kan
      het Uitvoeringsinstituut werknemersverzekeringen afzien van het opleggen van een maatregel als bedoeld in
      [artikel 28][ref4] en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet tijdig
      nakomen van de verplichting, of het zich niet houden aan de voorschriften, tenzij het niet tijdig nakomen van de
      verplichting, of het zich niet houden aan de voorschriften, plaatsvindt binnen een periode van twee jaar te rekenen
      vanaf de datum waarop eerder aan de belanghebbende een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel34a
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel28
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 34a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '28'
        hoofdstuk: II
        paragraaf: '1'
  - number: '29.3'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van
      het opleggen van een maatregel af te zien.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29
  - number: '29.4'
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een boete als bedoeld in
      [artikel 29a][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel29a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 29a
        hoofdstuk: II
        paragraaf: '1'
  - number: '29.5'
    text: Het Uitvoeringsinstituut werknemersverzekeringen stelt nadere regels met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29
  - number: 29a.1
    text: |-
      Indien de belanghebbende of zijn wettelijke vertegenwoordiger de verplichting bedoeld in [artikel 80][ref1] niet
      of niet behoorlijk is nagekomen, legt het Uitvoeringsinstituut werknemersverzekeringen hem een boete op van ten
      hoogste € 2 269.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: 29a.2
    text: |-
      De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de belanghebbende of zijn
      wettelijke vertegenwoordiger de gedraging verweten kan worden en de omstandigheden waarin hij verkeert. Van het
      opleggen van een boete wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29a
  - number: 29a.3
    text: |-
      Indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 80][ref1], niet heeft
      geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering, kan het Uitvoeringsinstituut
      werknemersverzekeringen afzien van het opleggen van een boete als bedoeld in het eerste lid en volstaan met het
      geven van een schriftelijke waarschuwing ter zake van het niet of niet behoorlijk nakomen van de verplichting,
      tenzij het niet of niet behoorlijk nakomen van de verplichting plaatsvindt binnen een periode van twee jaar te
      rekenen vanaf de datum waarop eerder aan de belanghebbende of zijn wettelijke vertegenwoordiger een zodanige
      waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: 29a.4
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van
      het opleggen van een boete af te zien.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29a
  - number: 29a.5
    text: |-
      Degene aan wie een boete is opgelegd is verplicht desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen
      de inlichtingen te verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29a
  - number: 29a.6
    text: Voor zover de boete nog niet is geïnd vervalt zij door het overlijden van degene aan wie zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29a
  - number: 29a.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29a
  - number: 29b.1
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen of een uitvoeringsinstelling jegens de belanghebbende
      of zijn wettelijke vertegenwoordiger een handeling verricht waaraan deze in redelijkheid de gevolgtrekking kan
      verbinden dat aan hem wegens een bepaalde gedraging een boete zal worden opgelegd, is de belanghebbende of zijn
      wettelijke vertegenwoordiger niet langer verplicht terzake van die gedraging enige verklaring af te leggen, voor
      zover het betreft de boeteoplegging. De belanghebbende of zijn wettelijke vertegenwoordiger wordt hiervan in kennis
      gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29b
  - number: 29b.2
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen voornemens is om aan de belanghebbende of zijn wettelijke
      vertegenwoordiger een boete op te leggen, wordt hiervan kennis gegeven aan de belanghebbende of zijn wettelijke
      vertegenwoordiger onder vermelding van de gronden waarop het voornemen berust. De kennisgeving is een handeling als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29b
  - number: 29b.3
    text: |-
      Op verzoek van de belanghebbende of zijn wettelijke vertegenwoordiger die de in het vorige lid bedoelde
      kennisgeving wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt het
      Uitvoeringsinstituut werknemersverzekeringen er zoveel mogelijk zorg voor dat de in die kennisgeving vermelde
      gronden aan de belanghebbende of zijn wettelijke vertegenwoordiger worden medegedeeld in een voor hem begrijpelijke
      taal.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29b
  - number: 29b.4
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt het Uitvoeringsinstituut
      werknemersverzekeringen de belanghebbende of zijn wettelijke vertegenwoordiger in de gelegenheid om naar keuze
      schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 29b.5
    text: |-
      Indien de belanghebbende of zijn wettelijke vertegenwoordiger zijn zienswijze mondeling naar voren brengt,
      draagt het Uitvoeringsinstituut werknemersverzekeringen er op verzoek van de belanghebbende of zijn wettelijke
      vertegenwoordiger die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd die de
      belanghebbende of zijn wettelijke vertegenwoordiger kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat
      daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29b
  - number: 29c.1
    text: |-
      Het besluit waarbij de boete wordt opgelegd vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald, alsmede de wijze waarop het besluit bij gebreke van tijdige betaling, overeenkomstig [artikel 29][ref1]
      zal worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel29g
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 29g
        hoofdstuk: II
        paragraaf: '1'
  - number: 29c.2
    text: |-
      Op verzoek van de belanghebbende of zijn wettelijke vertegenwoordiger die het in het eerste lid bedoelde besluit
      wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt het Uitvoeringsinstituut
      werknemersverzekeringen er zoveel mogelijk zorg voor dat de in dat besluit vermelde informatie aan de
      belanghebbende of zijn wettelijke vertegenwoordiger wordt medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29c
  - number: 29c.3
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29c
  - number: 29d.1
    text: Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29d
  - number: 29d.2
    text: |-
      De oplegging van een boete blijft definitief achterwege indien ter zake van de gedraging tegen de
      belanghebbende of zijn wettelijke vertegenwoordiger een strafvervolging is ingesteld en het onderzoek
      ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen ingevolge
      [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 29d.3
    text: |-
      Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en het tweede lid mededeling aan het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29d
  - number: 29e.1
    text: |-
      Een boete wordt opgelegd binnen een jaar nadat het Uitvoeringsinstituut werknemersverzekeringen de belanghebbende
      of zijn wettelijke vertegenwoordiger overeenkomstig [artikel 29b, vierde lid][ref1], in de gelegenheid heeft
      gesteld zijn zienswijze naar voren te brengen. Indien terzake aangifte is gedaan of proces-verbaal is opgemaakt
      en ingezonden vangt de termijn van een jaar aan op de dag na die waarop het openbaar ministerie aan het
      Uitvoeringsinstituut werknemersverzekeringen heeft medegedeeld dat geen strafvervolging wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel29b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29e
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 29b
        hoofdstuk: II
        paragraaf: '1'
  - number: 29e.2
    text: |-
      Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29e
  - number: 29f
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de boete is vastgesteld ook ten nadele van de belanghebbende of zijn wettelijke vertegenwoordiger
      wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 29g.1
    text: |-
      Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De titel heeft mede betrekking op de rente en
      kosten, bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 29g.2
    text: |-
      Indien degene aan wie een boete is opgelegd uitkering ontvangt op grond van deze wet, de
      [Werkloosheidswet][ref1], de [Ziektewet][ref2], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref5] of de [Wet arbeid en zorg][ref6] of een toeslag op grond
      van de [Toeslagenwet][ref7], wordt het besluit waarbij de boete is opgelegd tenuitvoergelegd door verrekening met
      die uitkering of toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
      [ref5]: https://wetten.overheid.nl/BWBR0002822
      [ref6]: https://wetten.overheid.nl/BWBR0013008
      [ref7]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
      - id: ref5
        bwb_id: BWBR0002822
      - id: ref6
        bwb_id: BWBR0013008
      - id: ref7
        bwb_id: BWBR0004043
  - number: 29g.3
    text: |-
      Indien degene aan wie een boete is opgelegd een uitkering ontvangt op grond van de
      [Algemene Ouderdomswet][ref1], de [Algemene nabestaandenwet][ref2], de [Wet werk en bijstand][ref3],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5] of de
      [Wet inkomensvoorziening kunstenaars][ref6], betaalt de Sociale verzekeringsbank, onderscheidenlijk de betrokken
      gemeente het bedrag van die boete, zonder dat daarvoor een machtiging nodig is van hem, op zijn verzoek aan het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
      [ref6]: https://wetten.overheid.nl/BWBR0009344
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0015703
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
      - id: ref6
        bwb_id: BWBR0009344
  - number: 29g.4
    text: |-
      Indien degene aan wie een boete is opgelegd geen uitkering als bedoeld in het derde lid ontvangt, of
      meer ontvangt, dan wel ten aanzien van zodanige uitkering toepassing van het derde lid niet mogelijk is,
      wordt het besluit waarbij de boete is opgelegd bij gebreke aan tijdige betaling met toepassing van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] op zijn kosten betekend tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 29g.5
    text: |-
      De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede of
      derde lid, dan wel van het vierde lid, dan wel van het tweede of derde lid in combinatie met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29g
  - number: 29g.6
    text: |-
      Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29g
  - number: 29g.7
    text: |-
      Op het executoriaal beslag ingevolge dit artikel door het Uitvoeringsinstituut werknemersverzekeringen
      op loon, sociale uitkeringen of andere periodieke betalingen, welke derden verschuldigd zijn of worden
      aan degene aan wie een boete is opgelegd, zijn de [artikelen 479b tot en met 479g][ref1], behoudens
      [artikel 479e, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] van overeenkomstige toepassing.
      De in [artikel 479g][ref3] aan de raad voor de kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan
      het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel479e
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479b
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 479e
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479g
  - number: 29g.8
    text: |-
      De tenuitvoerlegging van een besluit met toepassing van dit artikel geschiedt zodanig dat de belanghebbende of
      zijn wettelijke vertegenwoordiger blijft beschikken over een inkomen gelijk aan de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 29g.9
    text: |-
      Het achtste lid geldt niet, zolang de belanghebbende of zijn wettelijke vertegenwoordiger zijn verplichting bedoeld
      in [artikel 29a, vijfde lid][ref1], niet of niet behoorlijk nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel29a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 29a
        hoofdstuk: II
        paragraaf: '1'
  - number: '30.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd met betrekking tot uit deze wet voortvloeiende
      aanspraken geheel of ten dele, tijdelijk of blijvend, buiten aanmerking te laten:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel30
  - number: 30.1.a
    text: algehele arbeidsongeschiktheid, welke bestond op het tijdstip, dat de verzekering een aanvang nam;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel30
  - number: 30.1.b
    text: |-
      arbeidsongeschiktheid, welke binnen een half jaar na het tijdstip, dat de verzekering een aanvang nam, is
      ingetreden, terwijl de gezondheidstoestand van de betrokkene ten tijde van de aanvang van zijn verzekering het
      intreden van arbeidsongeschiktheid binnen een half jaar kennelijk moest doen verwachten.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel30
  - number: '30.2'
    text: |-
      Het eerste lid blijft buiten toepassing ten aanzien van degene die onmiddellijk voorafgaande aan het tijdstip,
      waarop de verzekering een aanvang nam, ononderbroken onbetaald verlof, tot een maximum van achttien maanden, heeft
      genoten, behoudens voorzover het betreft arbeidsongeschiktheid in de zin van het eerste lid, die bestond op de dag,
      voorafgaande aan de eerste dag van dit verlof. Als ononderbroken onbetaald verlof wordt aangemerkt perioden van
      onbetaald verlof die elkaar met een onderbreking van minder dan een maand opvolgen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel30
  - number: '30.3'
    text: |-
      De in het eerste lid, onder *b*, bedoelde bevoegdheid strekt zich mede uit tot toeneming van de
      arbeidsongeschiktheid, voor zover deze toeneming kennelijk is voortgekomen uit dezelfde oorzaak als de
      arbeidsongeschiktheid, welke binnen een half jaar na de aanvang van de verzekering is ingetreden.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel30
  - number: '30.4'
    text: |-
      Het bepaalde in het eerste lid, onder *b*, blijft buiten toepassing ten aanzien van degene, die onmiddellijk
      voorafgaande aan het tijdstip, dat de verzekering een aanvang nam, in verband met het bepaalde in
      [artikel 6, eerste lid, onder a of b][ref1], niet verzekerd was.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel6
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '6'
        hoofdstuk: I
        paragraaf: '2'
  - number: '30.5'
    text: |-
      Onze Minister kan met betrekking tot de bij dit artikel aan het Uitvoeringsinstituut werknemersverzekeringen
      gegeven bevoegdheid nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel30
  - number: '31'
    text: |-
      Zolang het Uitvoeringsinstituut werknemersverzekeringen ingevolge het bepaalde in de [artikelen 25][ref1],
      [28][ref2] en [30][ref3] arbeidsongeschiktheid buiten aanmerking laat, vindt [artikel 18, tweede lid][ref4],
      overeenkomstige toepassing met betrekking tot de door de betrokkene aan deze wet nog te ontlenen aanspraken, met
      dien verstande, dat voor de aanvang van de verzekering in de plaats treedt het tijdstip, met ingang waarvan het
      Uitvoeringsinstituut werknemersverzekeringen arbeidsongeschiktheid buiten aanmerking laat.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '25'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '28'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '30'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
  - number: '33.1'
    text: |-
      Met betrekking tot uit deze wet voortvloeiende aanspraken wordt buiten aanmerking gelaten
      arbeidsongeschiktheid, welke is ingetreden tijdens een periode, gedurende welke de verzekerde op grond van
      [artikel 17 der Coördinatiewet Sociale Verzekering][ref1] wegens gemoedsbezwaren van verplichtingen ingevolge deze
      wet was vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel17
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '17'
  - number: '33.2'
    text: |-
      [Artikel 30, tweede lid][ref1], en [artikel 31][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel31
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '30'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '31'
        hoofdstuk: II
        paragraaf: '1'
  - number: '34.1'
    text: |-
      Onverminderd het in deze wet terzake van herziening of intrekking van de arbeidsongeschiktheidsuitkering bepaalde,
      wordt de arbeidsongeschiktheidsuitkering op aanvraag toegekend over perioden van drie jaar.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34
  - number: '34.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt de belanghebbende van de mogelijkheid van het doen van een
      aanvraag schriftelijk in kennis uiterlijk vier maanden vóór de datum waarop:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34
  - number: 34.2.a
    text: |-
      de wachttijd van 104 weken, bedoeld in [artikel 19, eerste lid][ref1], verstrijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 34.2.b
    text: de periode waarover de arbeidsongeschiktheidsuitkering is toegekend, verstrijkt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34
  - number: '34.3'
    text: |-
      De belanghebbende, die in aanmerking wenst te komen voor toekenning dan wel voortzetting van de uitkering,
      dient zijn aanvraag te doen binnen 21 maanden na aanvang van zijn arbeidsongeschiktheid onderscheidenlijk
      uiterlijk dertien weken voor de in het eerste lid bedoelde termijn verstrijkt. Indien de wachttijd, bedoeld in
      [artikel 19, eerste lid][ref1], is verlengd op grond van het zevende lid van dat artikel wordt de aanvraag voor de
      toekenning van de uitkering, in afwijking van de eerste zin, uiterlijk 13 weken voor het verstrijken van de door
      het Uitvoeringsinstituut werknemersverzekeringen vastgestelde verlengde wachttijd gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '34.4'
    text: |-
      Indien niet binnen de termijn ingevolge [artikel 87, tweede lid][ref1], een beslissing is genomen op een tijdig
      ingediende aanvraag tot voortzetting van de arbeidsongeschiktheidsuitkering wordt de uitkering voortgezet tot het
      tijdstip waarop de beschikking op de aanvraag is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel87
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '34.5'
    text: |-
      Een aanvraag wordt geacht tijdig te zijn ingediend, indien het Uitvoeringsinstituut werknemersverzekeringen de
      kennisgeving als bedoeld in het tweede lid, niet heeft gedaan dan wel indien bij een latere kennisgeving dan
      bedoeld in het tweede lid de aanvraag wordt ingediend binnen vier weken nadat deze kennisgeving is ontvangen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34
  - number: '34.6'
    text: |-
      Indien de uitkering wordt voortgezet wordt als dagloon of vervolgdagloon in aanmerking genomen het dagloon of het
      vervolgdagloon, dat zou hebben gegolden als de periode, bedoeld in het eerste lid, niet was geëindigd.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34
  - number: '34.7'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat ten aanzien van bepaalde groepen arbeidsongeschikten geen termijn
      geldt dan wel een termijn zal gelden die afwijkt van de in het eerste lid genoemde termijn.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34
  - number: '34.8'
    text: |-
      Indien de toepassing van het derde lid zou leiden tot kennelijke hardheid, is het Uitvoeringsinstituut
      werknemersverzekeringen bevoegd de uitkering ambtshalve toe te kennen of voort te zetten.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34
  - number: '34.9'
    text: |-
      Indien de wachttijd, bedoeld in [artikel 19, eerste lid][ref1], is verlengd op grond van het
      [zevende lid van dat artikel][ref2], besluit het Uitvoeringsinstituut werknemersverzekeringen de aanvraag, bedoeld
      in het derde lid, niet te behandelen, indien deze is ingediend vóór het verzoek tot de verlenging.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 34a.1
    text: |-
      De aanvraag voor de toekenning van de uitkering gaat vergezeld van een reïntegratieverslag als bedoeld in
      [artikel 71a][ref1]. De eerste volzin is niet van toepassing indien [artikel 71b, eerste lid][ref2], toepassing
      vindt. Het Uitvoeringsinstituut werknemersverzekeringen beoordeelt of de werkgever en de werknemer dan wel
      de eigenrisicodrager, bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref3] en de persoon,
      bedoeld in [artikel 63, eerste lid, van die wet][ref4], in redelijkheid hebben kunnen komen tot de reïntegratie-
      inspanningen, die zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel71b
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel63
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 71b
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '63'
  - number: 34a.2
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen toepassing heeft gegeven aan
      [artikel 71a, negende lid][ref1], of [artikel 71b, derde lid, tweede zin][ref2], wijst het Uitvoeringsinstituut
      werknemersverzekeringen de aanvraag af.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel71b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 71b
        hoofdstuk: III
        paragraaf: '1'
  - number: 34a.3
    text: |-
      Bij de bekendmaking van het besluit, bedoeld in het tweede lid, maakt het Uitvoeringsinstituut
      werknemersverzekeringen melding van de mogelijkheid tot het doen van een nieuwe aanvraag voor de toekenning van de
      uitkering alsmede van de termijn binnen welke die aanvraag wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34a
  - number: 34a.4
    text: 'De termijn, waarbinnen de belanghebbende een nieuwe aanvraag voor de toekenning van de uitkering doet, is:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34a
  - number: 34a.4.a
    text: |-
      uiterlijk dertien weken voor het verstrijken van het tijdvak waarover de werkgever op grond van
      [artikel 629, elfde lid, onderdeel c, van Boek 7 van het Burgerlijk Wetboek][ref1] verplicht is het loon te betalen
      dan wel op grond van [artikel XV, veertiende lid, onderdeel c, van de Wet terugdringing ziekteverzuim][ref2]
      verplicht is bezoldiging te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0006355#ArtikelXV
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0006355
        artikel: XV
  - number: 34a.4.b
    text: |-
      zo spoedig mogelijk, indien het tijdvak waarover de werkgever op grond van
      [artikel 629, elfde lid, onderdeel c, van Boek 7 van het Burgerlijk Wetboek][ref1] verplicht is het loon te betalen
      dan wel op grond van [artikel XV, veertiende lid, onderdeel c, van de Wet terugdringing ziekteverzuim][ref2]
      verplicht is bezoldiging te betalen, minder bedraagt dan 13 weken of indien de werkgever vóór het verstrijken van
      dat tijdvak geen loon meer verschuldigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0006355#ArtikelXV
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0006355
        artikel: XV
  - number: 34a.4.c
    text: |-
      uiterlijk dertien weken voor het verstrijken van het tijdvak waarover de eigenrisicodrager,
      bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref1], op grond van
      [artikel 29, negende lid, van die wet][ref2] verplicht is het ziekengeld te betalen;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 34a.4.d
    text: |-
      zo spoedig mogelijk, indien het tijdvak waarover de eigenrisicodrager, bedoeld
      in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref1], op grond van
      [artikel 29, negende lid, van die wet][ref2] verplicht is het ziekengeld te betalen, minder bedraagt dan 13 weken.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
  - number: '35.1'
    text: |-
      De arbeidsongeschiktheidsuitkering gaat in op de dag, met ingang van welke de belanghebbende aan de vereisten voor
      het recht op toekenning van die uitkering voldoet.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel35
  - number: '35.2'
    text: |-
      In afwijking van het bepaalde in het vorige lid kan de arbeidsongeschiktheidsuitkering niet vroeger ingaan dan
      een jaar vóór de dag, waarop de aanvraag werd ingediend. Het Uitvoeringsinstituut werknemersverzekeringen kan voor
      bijzondere gevallen van het bepaalde in de vorige volzin afwijken.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel35
  - number: '36.1'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt herzien wanneer degene, aan wie zij is toegekend, ingevolge het bij of
      krachtens deze wet bepaalde voor een hogere of lagere uitkering in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel36
  - number: '36.2'
    text: |-
      Onverminderd het in deze wet ter zake van herziening of intrekking van de arbeidsongeschiktheidsuitkering bepaalde,
      dient binnen een jaar na ingang van de arbeidsongeschiktheidsuitkering, niet zijnde een voortzetting als bedoeld in
      [artikel 34, derde lid][ref1], door het Uitvoeringsinstituut werknemersverzekeringen te worden bezien of er gronden
      aanwezig zijn voor herziening of intrekking van de arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
  - number: '36.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat ten aanzien van bepaalde groepen arbeidsongeschikten geen termijn
      geldt dan wel een termijn zal gelden die afwijkt van de in het tweede lid genoemde termijn.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel36
  - number: '36.4'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van de arbeidsongeschiktheidsuitkering plaats
      met inachtneming van het bepaalde in de [artikelen 37 tot en met 40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel37
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '37'
        hoofdstuk: II
        paragraaf: '2'
  - number: 36a.1
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot
      toekenning van arbeidsongeschiktheidsuitkering en terzake van weigering van een zodanige uitkering, herziet het
      Uitvoeringsinstituut werknemersverzekeringen een dergelijk besluit of trekt hij dat in:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel36a
  - number: 36a.1.a
    text: ter uitvoering van een besluit als bedoeld in artikel 30;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel36a
  - number: 36a.1.b
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van artikel 25, 28 of 80 heeft geleid tot
      het ten onrechte of tot een te hoog bedrag verlenen van uitkering;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel36a
  - number: 36a.1.c
    text: indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel36a
  - number: 36a.1.d
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van artikel 25, 28 of 80 ertoe leidt dat
      niet kan worden vastgesteld of nog recht op uitkering bestaat.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel36a
  - number: 36a.2
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van herziening of intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel36a
  - number: 36b.1
    text: |-
      De intrekking of verlaging van een arbeidsongeschiktheidsuitkering, die voortvloeit uit het door de werkgever
      ingesteld bezwaar of beroep, vindt niet eerder plaats dan zes weken na de dag waarop de beslissing op bezwaar is
      bekendgemaakt of de uitspraak is gedaan. De eerste zin is van overeenkomstige toepassing in geval van intrekking
      van het bezwaar of beroep omdat het Uitvoeringsinstituut werknemersverzekeringen geheel of gedeeltelijk is tegemoet
      gekomen aan het bezwaar of beroep van de werkgever.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel36b
  - number: 36b.2
    text: |-
      Het eerste lid geldt niet, indien de uitkering door eigen schuld of toedoen van de werknemer ten onrechte of tot
      een te hoog bedrag is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel36b
  - number: '37.1'
    text: |-
      Terzake van toeneming van arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering, berekend
      naar een arbeidsongeschiktheid van minder dan 45%, onverminderd de [artikelen 39][ref1] en [39a][ref2], plaats
      zodra de toegenomen arbeidsongeschiktheid onafgebroken 104 weken heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel39a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '39'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 39a
        hoofdstuk: II
        paragraaf: '2'
  - number: '37.2'
    text: |-
      De in het eerste lid bedoelde herziening vindt niet plaats, indien de uitkeringsgerechtigde bij het intreden
      van de arbeidsongeschiktheid uitsluitend verzekerd is op grond van [artikel 7b][ref1], en de toeneming
      kennelijk is voortgekomen uit een andere oorzaak dan die waaruit de ongeschiktheid, terzake waarvan de
      arbeidsongeschiktheidsuitkering wordt ontvangen, is voortgekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel7b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 7b
        hoofdstuk: I
        paragraaf: '2'
  - number: '37.3'
    text: |-
      Voor het bepalen van het tijdvak van 104 weken, bedoeld in het eerste lid, worden perioden van toegenomen
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen.
      Bij de vaststelling van zowel het tijdvak van 104 weken als de periode van vier weken blijven perioden, waarin
      uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2],
      of [3:10, eerste lid, van de Wet arbeid en zorg][ref3] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '38.1'
    text: |-
      Terzake van toeneming van arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering, berekend
      naar een arbeidsongeschiktheid van ten minste 45%, onverminderd [artikel 39][ref1], plaats zodra de toegenomen
      arbeidsongeschiktheid onafgebroken vier weken heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel39
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '39'
        hoofdstuk: II
        paragraaf: '2'
  - number: '38.2'
    text: |-
      Indien de arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45%, doch minder
      dan 80%, wegens afneming van de arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder dan
      45%, doch binnen vier weken na de dag, met ingang waarvan die uitkering is herzien, de arbeidsongeschiktheid weer
      toeneemt, is het eerste lid van toepassing, onder afwijking van [artikel 37][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel37
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '37'
        hoofdstuk: II
        paragraaf: '2'
  - number: '38.3'
    text: |-
      Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste lid, worden perioden van toegenomen
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen. Bij
      de vaststelling van zowel de eerstgenoemde als de laatstgenoemde periode van vier weken blijven perioden, waarin
      uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2],
      of [3:10, eerste lid, van de Wet arbeid en zorg][ref3] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '39.1'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering steeds
      plaats zodra de toeneming van de arbeidsongeschiktheid intreedt, indien deze intreedt:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel39
  - number: 39.1.a
    text: binnen vier weken na de dag, met ingang van welke de arbeidsongeschiktheidsuitkering werd toegekend;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel39
  - number: 39.1.b
    text: |-
      binnen vier weken na de dag, met ingang van welke de arbeidsongeschiktheidsuitkering reeds eerder wegens toegenomen
      arbeidsongeschiktheid werd herzien;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel39
  - number: 39.1.c
    text: |-
      binnen vier weken na de dag, met ingang van welke de arbeidsongeschiktheidsuitkering, welke voordien was berekend
      naar een arbeidsongeschiktheid van 80 % of meer, wegens afneming van de arbeidsongeschiktheid is herzien naar een
      arbeidsongeschiktheid van minder dan 80 %;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel39
  - number: 39.1.d
    text: binnen een door Onze Minister aan te geven termijn in door Onze Minister aan te wijzen gevallen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel39
  - number: '39.2'
    text: |-
      Indien de arbeidsongeschiktheidsuitkering werd toegekend, onderscheidenlijk eerder wegens toegenomen
      arbeidsongeschiktheid werd herzien, met toepassing van [artikel 35, tweede lid][ref1], onderscheidenlijk
      [artikel 42, tweede lid][ref2], geldt met betrekking tot het bepaalde in het vorige lid, onder *a* en *b*, als
      dag met ingang van welke de arbeidsongeschiktheidsuitkering werd toegekend onderscheidenlijk herzien de dag, met
      ingang van welke die uitkering zou zijn toegekend onderscheidenlijk herzien, indien [artikel 35, tweede lid][ref3],
      onderscheidenlijk [artikel 42, tweede lid][ref4], geen toepassing zou hebben gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel42
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '42'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '42'
        hoofdstuk: II
        paragraaf: '2'
  - number: '39.3'
    text: |-
      Onze Minister is bevoegd regels te stellen voor gevallen waarbij direct herziening van de
      arbeidsongeschiktheidsuitkering plaatsvindt. Ingevolge deze regels kan bedoelde herziening slechts plaatsvinden ten
      behoeve van degene die bij hervatting van de arbeid inkomsten uit arbeid geniet, die minder bedragen dan evenredig
      is aan zijn nog bestaande arbeidsgeschiktheid.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel39
  - number: 39a.1
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid die intreedt binnen vijf jaar na de datum van
      toekenning of herziening van de arbeidsongeschiktheidsuitkering en die voortkomt uit dezelfde oorzaak
      als de arbeidsongeschiktheid ter zake waarvan uitkering wordt genoten, vindt herziening van de
      arbeidsongeschiktheidsuitkering steeds plaats, zodra de toegenomen arbeidsongeschiktheid onafgebroken vier weken
      heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel39a
  - number: 39a.2
    text: |-
      Voor het bepalen van de periode van vier weken, bedoeld in het eerste lid, worden perioden van toegenomen
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen. Bij
      de vaststelling van zowel de eerstgenoemde als de laatstgenoemde periode van vier weken blijven perioden, waarin
      uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2],
      of [3:10, eerste lid, van de Wet arbeid en zorg][ref3] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 39a.3
    text: |-
      Dit artikel vindt geen toepassing, indien recht bestaat op herziening van de arbeidsongeschiktheidsuitkering op
      grond van [artikel 38][ref1] of [39, eerste lid, onderdelen ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel39
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '38'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '39'
        hoofdstuk: II
        paragraaf: '2'
  - number: '40.1'
    text: |-
      Indien terzake van toeneming van de arbeidsongeschiktheid herziening van de arbeidsongeschiktheidsuitkering alsmede
      toekenning van ziekengeld krachtens de [Ziektewet][ref1] heeft plaatsgevonden dan wel loondoorbetaling heeft
      plaatsgevonden op grond van [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2] of betaling
      van bezoldiging op grond van [artikel XV, tweede lid, van de Wet terugdringing ziekteverzuim][ref3], wordt met
      ingang van de dag na beëindiging van het ziekengeld op grond van [artikel 29, vijfde lid, van de Ziektewet][ref4]
      dan wel na afloop van het in [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref5] of in
      [artikel XV, tweede lid, van de Wet terugdringing ziekteverzuim][ref6] bedoelde tijdvak van 104 weken het
      dagloon opnieuw vastgesteld overeenkomstig het bepaalde bij of krachtens [artikel 14][ref7], mits dat leidt tot
      een hoger dagloon, dan het dagloon dat voor de berekening van de laatstelijk ontvangen loondervingsuitkering of
      vervolguitkering in aanmerking werd genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref3]: https://wetten.overheid.nl/BWBR0006355#ArtikelXV
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref6]: https://wetten.overheid.nl/BWBR0006355#ArtikelXV
      [ref7]: https://wetten.overheid.nl/BWBR0002524#Artikel14
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref3
        bwb_id: BWBR0006355
        artikel: XV
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref6
        bwb_id: BWBR0006355
        artikel: XV
      - id: ref7
        bwb_id: BWBR0002524
        artikel: '14'
        hoofdstuk: I
        paragraaf: '4'
  - number: '40.2'
    text: |-
      Voor de toepassing van het bepaalde in het vorige lid wordt in [artikel 14, eerste lid][ref1], in plaats van de
      woorden "ware hij niet arbeidsongeschikt" gelezen: "ware zijn arbeidsongeschiktheid niet toegenomen" en voorts
      in plaats van de woorden "gerekend naar het loonpeil op de dag van ingang van de arbeidsongeschiktheidsuitkering"
      gelezen: "gerekend naar het loonpeil op de dag, met ingang waarvan op grond van het bepaalde in
      [artikel 40, eerste lid][ref2], hernieuwde vaststelling van een dagloon plaatsvindt".


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel40
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '14'
        hoofdstuk: I
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '40'
        hoofdstuk: II
        paragraaf: '2'
  - number: '40.3'
    text: |-
      Ingeval van herziening van een arbeidsongeschiktheidsuitkering in verband met toegenomen arbeidsongeschiktheid
      tijdens het ontvangen van een vervolguitkering wordt, met inachtneming van de tweede tot en met vierde volzin van
      dit lid, met ingang van de dag waarop het recht op die herziening bestaat, een loondervingsuitkering toegekend.
      Voor de duur van die loondervingsuitkering is, in afwijking van [artikel 21a][ref1], de leeftijd van de betrokkene
      op de dag van ingang van de herziening van de arbeidsongeschiktheidsuitkering bepalend. Toekenning van een
      loondervingsuitkering is slechts mogelijk indien de betrokkene bij de toeneming van de arbeidsongeschiktheid
      terzake van het verrichten van werkzaamheden op grond van deze wet verzekerd was en de duur van die uitkering
      langer is dan de duur van de loondervingsuitkering, waarop recht bestond onmiddellijk voorafgaande aan de datum van
      ingang van de vervolguitkering. De duur van de toe te kennen loondervingsuitkering wordt verminderd met de duur van
      de laatstelijk ontvangen loondervingsuitkering. Tijdens de duur van die loondervingsuitkering bestaat geen recht
      op vervolguitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 21a
        hoofdstuk: II
        paragraaf: '1'
  - number: '40.4'
    text: |-
      Na afloop van de in het derde lid bedoelde loondervingsuitkering geldt voor de berekening van het
      vervolgdagloon, in afwijking van [artikel 21b, derde lid][ref1], een percentage van 2 maal het aantal verstreken
      jaren tussen het 15e jaar en de leeftijd van de betrokkene op de dag van ingang van de herziening van de
      arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 21b
        hoofdstuk: II
        paragraaf: '1'
  - number: '40.5'
    text: Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere en zonodig afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel40
  - number: '41.1'
    text: Verhoging van de arbeidsongeschiktheidsuitkering vindt op aanvraag of ambtshalve plaats.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel41
  - number: '41.2'
    text: |-
      Verhoging van de arbeidsongeschiktheidsuitkering ter zake van toeneming van de
      arbeidsongeschiktheid vindt in elk geval ambtshalve plaats, indien de betrokkene aansluitend
      aan de uitkering van ziekengeld krachtens de [Ziektewet][ref1] dan wel na afloop van
      het in [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2] of in
      [artikel XV, tweede lid, van de Wet terugdringing ziekteverzuim][ref3] bedoelde tijdvak van 104 weken in aanmerking
      komt voor een hogere arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref3]: https://wetten.overheid.nl/BWBR0006355#ArtikelXV
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref3
        bwb_id: BWBR0006355
        artikel: XV
  - number: '42.1'
    text: |-
      De herziening van de arbeidsongeschiktheidsuitkering gaat in op de dag, met ingang van welke de belanghebbende
      ingevolge het bij of krachtens deze wet bepaalde voor een hogere of lagere uitkering in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel42
  - number: '42.2'
    text: |-
      Met betrekking tot de herziening van de arbeidsongeschiktheidsuitkering, welke een verhoging van die uitkering tot
      gevolg heeft, is het bepaalde in [artikel 35, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel35
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
  - number: '42.3'
    text: |-
      De herziening van een arbeidsongeschiktheidsuitkering ter zake van afneming van de arbeidsongeschiktheid gaat in op
      de dag, welke in de beschikking wordt genoemd als de dag, waarop de arbeidsongeschiktheid was afgenomen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel42
  - number: '42.4'
    text: |-
      Indien herziening van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide scholing of opleiding,
      gaat deze herziening niet eerder in dan één jaar na voltooiing van die scholing of opleiding. Indien de
      belanghebbende eerder inkomsten uit arbeid verwerft is [artikel 44, eerste lid][ref1], tot uiterlijk het einde van
      dat jaar van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel44
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
  - number: '43.1'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt ingetrokken wanneer de arbeidsongeschiktheid is geëindigd of beneden 15 %
      is gedaald.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43
  - number: '43.2'
    text: |-
      De intrekking van de arbeidsongeschiktheidsuitkering gaat in op de dag, welke in de beschikking wordt genoemd als
      de dag, waarop de arbeidsongeschiktheid was geëindigd of beneden 15 % was gedaald.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43
  - number: '43.3'
    text: |-
      Indien intrekking van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide opleiding of scholing, is
      [artikel 42, vierde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel42
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '42'
        hoofdstuk: II
        paragraaf: '2'
  - number: '43.4'
    text: |-
      De arbeidsongeschiktheidsuitkering van degene die deelneemt aan een opleiding of scholing, wordt gedurende
      deze opleiding of scholing niet ingetrokken of herzien in verband met een daaruit voortvloeiende afname van de
      arbeidsongeschiktheid. Indien de belanghebbende tijdens de opleiding of scholing inkomsten uit arbeid verwerft, is
      [artikel 44, eerste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel44
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
  - number: '43.5'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt ingetrokken, indien degene die recht heeft op
      arbeidsongeschiktheidsuitkering rechtens zijn vrijheid is ontnomen, vanaf de dag dat deze vrijheidsontneming één
      maand heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43
  - number: '43.6'
    text: |-
      Voor de toepassing van het vijfde lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43
  - number: 43a.1
    text: Indien degene
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43a
  - number: 43a.1.a
    text: |-
      wiens arbeidsongeschiktheidsuitkering wegens afneming van arbeidsongeschiktheid op grond van
      [artikel 43, eerste lid][ref1], is ingetrokken, of


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
  - number: 43a.1.b
    text: |-
      die aan het einde van de in [artikel 19][ref1], bedoelde wachttijd ongeschikt was tot het verrichten van zijn
      arbeid wegens ziekte of gebreken, maar geen recht had op toekenning van arbeidsongeschiktheidsuitkering omdat hij
      niet arbeidsongeschikt was,


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 43a.2
    text: |-
      Voor het bepalen van de periode van vier weken, bedoeld in het eerste lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen. Bij
      de vaststelling van zowel de eerstgenoemde als de laatstgenoemde periode van vier weken blijven perioden, waarin
      uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2],
      of [3:10, eerste lid, van de Wet arbeid en zorg][ref3] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 43a.3
    text: |-
      In de gevallen, waarin [artikel 20 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1]
      onderscheidenlijk [artikel 19 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2]
      geen toepassing vindt omdat [artikel 29b van de Ziektewet][ref3] toepassing kan vinden, wordt het
      aan de arbeidsongeschiktheidsuitkering ten grondslag te leggen dagloon niet lager gesteld dan 108/100
      maal de grondslag die voor de berekening van de laatstelijk ontvangen arbeidsongeschiktheidsuitkering
      op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4] onderscheidenlijk de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5] in aanmerking werd genomen, dan wel 108/100
      maal de grondslag die in aanmerking zou zijn genomen, indien na het einde van de wachttijd, bedoeld in
      [artikel 7, eerste lid, van de Wet arbeidsongeschiktheidverzekering zelfstandigen][ref6] onderscheidenlijk
      [artikel 6, eerste lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref7], recht
      zou hebben bestaan op een arbeidsongeschiktheidsuitkering op grond van een laatstbedoelde wet, zoals
      die sinds de beëindiging van die uitkering onderscheidenlijk sinds het einde van die wachttijd op grond
      van [artikel 8 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8] onderscheidenlijk
      [artikel 7 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref9] zou zijn herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
      [ref4]: https://wetten.overheid.nl/BWBR0008656
      [ref5]: https://wetten.overheid.nl/BWBR0008657
      [ref6]: https://wetten.overheid.nl/BWBR0008656#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0008657#Artikel6
      [ref8]: https://wetten.overheid.nl/BWBR0008656#Artikel8
      [ref9]: https://wetten.overheid.nl/BWBR0008657#Artikel7
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 29b
      - id: ref4
        bwb_id: BWBR0008656
      - id: ref5
        bwb_id: BWBR0008657
      - id: ref6
        bwb_id: BWBR0008656
        artikel: '7'
      - id: ref7
