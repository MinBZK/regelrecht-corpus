  - number: 98c
    text: |-
      Onze Minister kan ter bevordering van de veiligheid van de arbeid van verzekerden alsmede van de gezondheid van
      verzekerden bij de arbeid, regelen stellen inzake het door de werkgever vastleggen van gegevens en het verstrekken
      van inlichtingen door de werkgever aan het Uitvoeringsinstituut werknemersverzekeringen en een bij die regelen aan
      te wijzen instelling omtrent bedrijfsongevallen en beroepsziekten.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel98c
  - number: '99'
    text: Hetgeen nog ter uitvoering van deze wet nodig is, wordt door Onze Minister geregeld.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel99
  - number: '100'
    text: Deze wet kan worden aangehaald onder de titel "Wet op de arbeidsongeschiktheidsverzekering".
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel100
  - number: 100a
    text: |-
      Na de plaatsing van de Wet op de arbeidsongeschiktheidsverzekering in het *Staatsblad* wordt de tekst van die
      wet, zo nodig, door de zorg van Onze Minister van Justitie, opnieuw in het *Staatsblad* geplaatst, waarbij
      vernummeringen en daarmede verband houdende wijzigingen in aanhalingen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel100a
  - number: '101'
    text: |-
      De artikelen van deze wet treden in werking met ingang van een door Ons te bepalen tijdstip, dat voor de
      onderscheidene artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel101
