        artikel: '6'
      - id: ref8
        bwb_id: BWBR0008656
        artikel: '8'
      - id: ref9
        bwb_id: BWBR0008657
        artikel: '7'
  - number: 43a.4
    text: 'Dit artikel vindt geen toepassing, indien:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43a
  - number: 43a.4.a
    text: |-
      op grond van [artikel 47][ref1] aanspraak bestaat op heropening van de arbeidsongeschiktheidsuitkering; of


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel47
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '47'
        hoofdstuk: II
        paragraaf: '2'
  - number: 43a.4.b
    text: |-
      indien [artikel 29b van de Ziektewet][ref1] toepassing kan vinden, tenzij de toe te kennen
      arbeidsongeschiktheidsuitkering het ziekengeld overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 29b
  - number: 43a.5
    text: |-
      [Artikel 19a][ref1] en de daarop berustende bepalingen zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 19a
        hoofdstuk: II
        paragraaf: '1'
  - number: 43b.1
    text: De arbeidsongeschiktheidsuitkering wordt ingetrokken indien de verzekerde niet meer in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43b
  - number: 43b.2
    text: |-
      [Artikel 20, tweede, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel20
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '20'
        hoofdstuk: II
        paragraaf: '1'
  - number: 43c
    text: |-
      In de gevallen waarin [artikel 43a][ref1] toepassing vindt, alsmede in de gevallen waarin dat artikel niet van
      toepassing is omdat [artikel 29b van de Ziektewet][ref2] toepassing kan vinden, wordt het aan de toe te kennen
      arbeidsongeschiktheidsuitkering ten grondslag te leggen dagloon niet lager gesteld dan het dagloon dat voor de
      berekening van de laatstelijk ontvangen loondervingsuitkering in aanmerking werd genomen, dan wel het dagloon
      dat in aanmerking zou zijn genomen indien na het einde van de in [artikel 19][ref3], bedoelde wachttijd recht zou
      hebben bestaan op een loondervingsuitkering, zoals dat sinds de beëindiging van de uitkering onderscheidenlijk
      sinds het einde van die wachttijd op grond van [artikel 15][ref4] zou zijn herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel15
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '15'
        hoofdstuk: I
        paragraaf: '4'
  - number: 43d
    text: |-
      De arbeidsongeschiktheidsuitkering, onderscheidenlijk de verhoging van de arbeidsongeschiktheidsuitkering
      in geval van herziening van die uitkering op grond van de [artikelen 37][ref1], [38][ref2], [39][ref3]
      en [39a][ref4], wordt niet uitbetaald gedurende het verlengde tijdvak waarin recht bestaat op
      ziekengeld op grond van [artikel 29, negende lid, van de Ziektewet][ref5], op loon op grond van
      [artikel 629, elfde lid, onderdelen a en c, van Boek 7 van het Burgerlijk Wetboek][ref6], dan wel op bezoldiging op
      grond van [artikel XV, veertiende lid, van de Wet terugdringing ziekteverzuim][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel39a
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref7]: https://wetten.overheid.nl/BWBR0006355#ArtikelXV
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel43d
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '37'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '38'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '39'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 39a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref6
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref7
        bwb_id: BWBR0006355
        artikel: XV
  - number: '44.1'
    text: |-
      Indien degene, die recht heeft op een arbeidsongeschiktheidsuitkering, inkomsten uit arbeid geniet, wordt, zolang
      niet vaststaat of deze arbeid als arbeid, bedoeld in [artikel 18, vijfde lid][ref1], kan worden aangemerkt, de
      arbeidsongeschiktheidsuitkering niet ingetrokken of herzien, doch wordt die uitkering:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
  - number: 44.1.a
    text: |-
      niet uitbetaald indien de inkomsten uit arbeid zodanig zijn, dat als die arbeid wel de in
      [artikel 18, vijfde lid][ref1], bedoelde arbeid zou zijn, niet langer sprake zou zijn van een arbeidsongeschiktheid
      van ten minste 15% of


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
  - number: 44.1.b
    text: |-
      indien het bepaalde onder *a* niet van toepassing is, uitbetaald tot een bedrag ter grootte van
      de arbeidsongeschiktheidsuitkering, zoals deze zou zijn vastgesteld, indien die arbeid wel de in
      [artikel 18, vijfde lid][ref1], bedoelde arbeid zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
  - number: '44.2'
    text: |-
      De toepassing van het bepaalde in het eerste lid vindt ten hoogste plaats over een aaneengesloten termijn van
      drie jaren, aanvangende op de eerste dag waarover de inkomsten uit arbeid bedoeld in dat lid worden genoten. Deze
      termijn wordt geacht niet te zijn onderbroken indien gedurende perioden van korter dan vier weken geen inkomsten
      uit arbeid worden genoten. Na afloop van de in de eerste volzin genoemde termijn wordt de in het eerste lid
      bedoelde arbeid aangemerkt als arbeid, bedoeld in [artikel 18, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
  - number: '44.3'
    text: |-
      Indien degene, die recht heeft op een arbeidsongeschiktheidsuitkering, inkomsten uit arbeid geniet,
      die bestaan uit loon ingevolge een arbeidsovereenkomst als bedoeld in de [hoofdstukken 2][ref1] en
      [3 van de Wet sociale werkvoorziening][ref2] vindt het tweede lid geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        hoofdstuk: '3'
  - number: '44.4'
    text: |-
      Maandelijks wordt het geraamde bedrag aan arbeidsongeschiktheidsuitkeringen, die op grond van het derde lid
      niet worden uitbetaald wegens het genieten van dat loon alsmede van de dientengevolge niet uitbetaalde vakantie-
      uitkeringen, vermeerderd met het bedrag aan premies dat het Uitvoeringsinstituut werknemersverzekeringen bij
      uitbetaling daarover op grond van enige wet verschuldigd zou zijn en dat niet op de uitkeringen in mindering kan
      worden gebracht, aan ’s Rijks kas afgedragen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel44
  - number: '44.5'
    text: Onze Minister kan bepalen dat het tweede lid geen toepassing vindt ten aanzien van bepaalde groepen personen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel44
  - number: '44.6'
    text: |-
      Onze Minister kan met betrekking tot dit artikel nadere, en voor bijzondere gevallen, zonodig afwijkende regels
      stellen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel44
  - number: '47.1'
    text: |-
      Degene, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45 %, in
      verband met het bepaalde in [artikel 43, eerste lid][ref1], is ingetrokken, heeft, indien hij binnen vier weken na
      de dag, met ingang van welke de uitkering is ingetrokken, weer arbeidsongeschikt wordt, aanspraak op heropening van
      de arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
  - number: '47.2'
    text: |-
      Het bepaalde in het vorige lid is mede van toepassing met betrekking tot degene, wiens
      arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan 45 %, in verband met het
      bepaalde in [artikel 43, eerste lid][ref1], is ingetrokken, indien hij weer arbeidsongeschikt wordt binnen 4 weken
      na de dag, met ingang van welke die uitkering, welke voordien was berekend naar een arbeidsongeschiktheid van ten
      minste 45 %, wegens afneming van de arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder
      dan 45%.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
  - number: '47.3'
    text: |-
      Degene, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan 45 %,
      in verband met het bepaalde in [artikel 43, eerste lid][ref1], is ingetrokken met ingang van een dag, die
      gelegen is binnen vier weken na de dag, met ingang waarvan die uitkering werd toegekend of wegens toegenomen
      arbeidsongeschiktheid werd herzien, heeft, indien hij binnen die periode van vier weken weer arbeidsongeschikt
      wordt, aanspraak op heropening van de arbeidsongeschiktheidsuitkering. [Artikel 39, tweede lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel39
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '39'
        hoofdstuk: II
        paragraaf: '2'
  - number: '47.4'
    text: |-
      Degene, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan 45 %, in
      verband met het bepaalde in [artikel 43, eerste lid][ref1], is ingetrokken, heeft, onverminderd het bepaalde in het
      tweede en het derde lid, indien hij binnen vier weken na de dag, met ingang van welke de uitkering is ingetrokken,
      weer arbeidsongeschikt wordt, niet kennelijk uit een andere oorzaak dan die, waaruit de arbeidsongeschiktheid,
      ter zake waarvan de ingetrokken uitkering werd genoten, is voortgekomen, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
  - number: '47.5'
    text: |-
      De heropening gaat in op de dag, met ingang van welke de betrokkene weer arbeidsongeschikt is geworden en vindt
      plaats naar de mate van arbeidsongeschiktheid op die dag.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47
  - number: '47.6'
    text: |-
      De [artikelen 17, derde lid][ref1], [19, vierde lid][ref2], [19a][ref3] en de daarop berustende bepalingen, en
      [35, tweede lid][ref4], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel19a
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel35
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '17'
        hoofdstuk: I
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 19a
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
  - number: '47.7'
    text: De arbeidsongeschiktheidsuitkering wordt op aanvraag of ambtshalve heropend.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47
  - number: 47a.1
    text: |-
      De persoon, wiens arbeidsongeschiktheidsuitkering op grond van [artikel 43b, eerste lid][ref1], is ingetrokken,
      heeft vanaf de dag:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43b
        hoofdstuk: II
        paragraaf: '2'
  - number: 47a.1.a
    text: dat hij in Nederland woont; of
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47a
  - number: 47a.1.b
    text: |-
      waarop een verdrag in werking is getreden dan wel een besluit van een volkenrechtelijke organisatie van kracht is
      geworden in het land waar betrokkene woont, op grond waarvan recht op arbeidsongeschiktheidsuitkering kan bestaan;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47a
  - number: 47a.2
    text: |-
      Aanspraak op heropening van de arbeidsongeschiktheidsuitkering heeft eveneens de persoon, bedoeld in het eerste
      lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval is
      binnen vier weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47a
  - number: 47a.3
    text: |-
      De [artikelen 19, vierde lid][ref1], [35][ref2] en [47, zevende lid][ref3], zijn van overeenkomstige toepassing met
      betrekking tot de aanspraak op heropening van de arbeidsongeschiktheidsuitkering, bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel47
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '47'
        hoofdstuk: II
        paragraaf: '2'
  - number: 47b.1
    text: |-
      De persoon, wiens arbeidsongeschiktheidsuitkering op grond van [artikel 43, vijfde lid][ref1], is ingetrokken,
      heeft vanaf de dag dat hij in vrijheid wordt gesteld met inachtneming van de bepalingen van deze wet aanspraak op
      heropening van de arbeidsongeschiktheidsuitkering, indien hij op die dag arbeidsongeschikt is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
  - number: 47b.2
    text: |-
      Aanspraak op heropening van de arbeidsongeschiktheidsuitkering heeft eveneens de persoon, bedoeld in het eerste
      lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval is
      binnen vier weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47b
  - number: 47b.3
    text: |-
      De [artikelen 19, vierde lid][ref1], [35][ref2], en [47, zevende lid][ref3], zijn van overeenkomstige toepassing
      met betrekking tot de aanspraak op heropening van de arbeidsongeschiktheidsuitkering, bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel47
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '47'
        hoofdstuk: II
        paragraaf: '2'
  - number: 47b.4
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op bij algemene maatregel van bestuur aan te wijzen
      categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel buiten een
      justitiële inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel47b
  - number: '48.1'
    text: De arbeidsongeschiktheidsuitkering wordt heropend door het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel48
  - number: '48.2'
    text: |-
      De heropende arbeidsongeschiktheidsuitkering wordt beschouwd als een voortzetting van de ingetrokken uitkering.
      Voor de toepassing van de [artikelen 38, derde lid][ref1], [39, eerste lid, onderdeel c][ref2], en [39a][ref3]
      wordt daarbij met herziening van de arbeidsongeschiktheidsuitkering wegens afneming van de arbeidsongeschiktheid
      gelijk gesteld intrekking van de arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel39a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '38'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '39'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 39a
        hoofdstuk: II
        paragraaf: '2'
  - number: '48.3'
    text: |-
      Voor de berekening van de heropende arbeidsongeschiktheidsuitkering wordt als dagloon of vervolgdagloon beschouwd
      het dagloon of vervolgdagloon, waarnaar de ingetrokken uitkering op de dag van ingang van de heropende uitkering
      zou zijn berekend, indien de uitkering niet was ingetrokken, tenzij hernieuwde vaststelling van een dagloon
      overeenkomstig het bepaalde bij of krachtens [artikel 14][ref1] en met inachtneming van [artikel 15][ref2] tot
      een hoger dagloon of vervolgdagloon leidt, in welk geval de heropende uitkering aan de hand van dit dagloon of
      vervolgdagloon wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel15
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '14'
        hoofdstuk: I
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '15'
        hoofdstuk: I
        paragraaf: '4'
  - number: '49.1'
    text: |-
      De arbeidsongeschiktheidsuitkering neemt een einde met ingang van de eerste dag van de maand, waarin de betrokkene
      de leeftijd van 65 jaar bereikt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel49
  - number: '49.2'
    text: |-
      Toekenning of heropening van arbeidsongeschiktheidsuitkering vindt niet plaats, indien de uitkering
      onderscheidenlijk de heropening zou ingaan op of na de in het eerste lid bedoelde dag.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel49
  - number: '50.1'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt betaalbaar gesteld door het Uitvoeringsinstituut werknemersverzekeringen.
      De betaling geschiedt als regel in termijnen van niet langer dan een maand.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel50
  - number: '50.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan een uitkering als bedoeld in het eerste lid, over een door
      hem te bepalen tijdvak bij wege van voorschot betaalbaar stellen, indien onzekerheid bestaat over het recht op
      of de hoogte van de uitkering of de hoogte van het te betalen bedrag aan uitkering. Een verleend voorschot wordt
      verrekend met het definitief vastgestelde bedrag aan uitkering dat over het desbetreffende tijdvak wordt betaald.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel50
  - number: '50.3'
    text: |-
      Onverminderd het tweede lid, schort het Uitvoeringsinstituut werknemersverzekeringen de betaling van de
      arbeidsongeschiktheidsuitkering op of schorst het de betaling, indien het op grond van duidelijke aanwijzingen van
      oordeel is of het gegronde vermoeden heeft dat:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel50
  - number: 50.3.a
    text: het recht op uitkering niet of niet meer bestaat;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel50
  - number: 50.3.b
    text: recht op een lagere uitkering bestaat;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel50
  - number: 50.3.c
    text: |-
      degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend of zijn wettelijke vertegenwoordiger een
      verplichting als bedoeld in [artikel 25][ref1], [28][ref2] of [80][ref3] niet of niet behoorlijk is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '25'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '28'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: '50.4'
    text: |-
      In geval de arbeidsongeschiktheidsuitkering in het buitenland wordt uitbetaald worden de daaraan verbonden kosten
      van overmaking op de uitkering in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel50
  - number: '50.5'
    text: |-
      Wanneer degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend, een ander machtigt om de uitkering in
      ontvangst te nemen, onderscheidenlijk een verleende machtiging intrekt, wordt daaraan gevolg gegeven met ingang van
      een betalingstermijn, aanvangende na de dag waarop de machtiging wordt ingediend, onderscheidenlijk waarop van haar
      intrekking mededeling wordt gedaan, doch niet later dan de eerste dag van de tweede maand na de dag van indiening
      onderscheidenlijk intrekking der machtiging.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel50
  - number: '50.6'
    text: |-
      Onze Minister kan regelen vaststellen inzake de betaalbaarstelling van de arbeidsongeschiktheidsuitkering door
      organen, welke belast zijn met de uitbetaling van invaliditeitsuitkering of van pensioen uit anderen hoofde dan
      ingevolge deze wet.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel50
  - number: '50.7'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd om, onder door hem te stellen voorwaarden, op
      verzoek van de in het vorige lid bedoelde organen, gelijktijdig met de arbeidsongeschiktheidsuitkering,
      invaliditeitsuitkeringen of pensioenen, verschuldigd door die organen, betaalbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel50
  - number: '50.8'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt regels omtrent de betaalbaarstelling van de
      arbeidsongeschiktheidsuitkering in gevallen waarin de werknemer recht heeft op een arbeidsongeschiktheidsuitkering
      over een periode waarover hij tevens een uitkering op grond van de [Werkloosheidswet][ref1] ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 50a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van een uitkering ingevolge deze wet op indien
      degene aan wie uitkering is toegekend een vreemdeling is die niet rechtmatig in Nederland verblijf houdt als
      bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 50a.2
    text: |-
      De betaling van een uitkering ingevolge deze wet wordt hervat indien betrokkene daartoe een aanvraag indient en het
      het Uitvoeringsinstituut werknemersverzekeringen is gebleken dat hij feitelijk buiten Nederland woont of verblijf
      houdt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel50a
  - number: '51'
    text: |-
      Voor zover betreft het in ontvangst nemen van een uitkering ingevolge deze wet en het verlenen van kwijting
      voor de betaling daarvan, wordt een minderjarige met een meerderjarige gelijkgesteld. Indien de wettelijke
      vertegenwoordiger zich tegen de betaling aan de minderjarige schriftelijk verzet bij het Uitvoeringsinstituut
      werknemersverzekeringen geschiedt de uitbetaling aan de wettelijke vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel51
  - number: '53.1'
    text: |-
      Na het overlijden van degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend, wordt met ingang van de dag
      na het overlijden, de arbeidsongeschiktheidsuitkering in de vorm van een overlijdensuitkering uitbetaald:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel53
  - number: 53.1.a
    text: aan de langstlevende van de echtgenoten;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel53
  - number: 53.1.b
    text: |-
      bij ontstentenis van de in onderdeel *a* bedoelde persoon, aan de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel53
  - number: 53.1.c
    text: |-
      bij ontstentenis van de in de onderdelen *a* en *b* bedoelde personen, aan degenen ten aanzien van wie de
      overledene grotendeels in de kosten van het bestaan voorzag en met wie hij in gezinsverband leefde.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel53
  - number: '53.2'
    text: |-
      Met degene aan wie een arbeidsongeschiktheidsuitkering is toegekend, wordt voor de toepassing van dit artikel
      gelijkgesteld, degene wiens overlijden heeft plaats gevonden in de maand waarin hij de leeftijd van 65
      jaar zou hebben bereikt doch voor het bereiken van deze leeftijd is overleden, en die uitsluitend ingevolge
      [artikel 49][ref1], over de dag van zijn overlijden geen recht op een arbeidsongeschiktheidsuitkering had.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel49
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '49'
        hoofdstuk: II
        paragraaf: '2'
  - number: '53.3'
    text: |-
      De overlijdensuitkering is gelijk aan het bedrag van de arbeidsongeschiktheidsuitkering over één maand, doch niet
      over de zaterdagen en zondagen, berekend naar de hoogte van die uitkering op de dag of laatstelijk voor de dag van
      overlijden, van degene aan wie die arbeidsongeschiktheidsuitkering is toegekend.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel53
  - number: '53.4'
    text: |-
      In verband met het overlijden van degene aan wie een arbeidsongeschiktheidsuitkering is toegekend, is
      [artikel 49, eerste lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel49
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '49'
        hoofdstuk: II
        paragraaf: '2'
  - number: '53.5'
    text: |-
      De overlijdensuitkering wordt op verzoek aan de rechthebbende of rechthebbenden genoemd in het eerste lid, door het
      Uitvoeringsinstituut werknemersverzekeringen uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel53
  - number: '53.6'
    text: De overlijdensuitkering wordt in een bedrag ineens uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel53
  - number: '53.7'
    text: |-
      Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan arbeidsongeschiktheidsuitkering dat,
      over na het overlijden gelegen dagen reeds is uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel53
  - number: '54.1'
    text: |-
      Indien degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend, ingevolge het bepaalde bij of krachtens
      [artikel 6, derde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] een bijdrage verschuldigd is in de
      kosten van een verstrekking als bedoeld in de [artikelen 6][ref2] en [11 van die wet][ref3] of een vergoeding als
      bedoeld in de [artikelen 11][ref4] en [12 van die wet][ref5], is het Uitvoeringsinstituut werknemersverzekeringen
      bevoegd de arbeidsongeschiktheidsuitkering tot het bedrag van die bijdrage in plaats van aan degene, aan wie
      de arbeidsongeschiktheidsuitkering is toegekend, zonder diens machtiging uit te betalen aan het College voor
      zorgverzekeringen, genoemd in [artikel 1a van de Ziekenfondswet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0002614#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0002460#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0002614
        artikel: '12'
      - id: ref6
        bwb_id: BWBR0002460
        artikel: 1a
  - number: '54.2'
    text: |-
      Indien degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend, in een inrichting ter verpleging
      van geesteszieken of van zwakzinnigen is opgenomen en het Uitvoeringsinstituut werknemersverzekeringen,
      van de desbetreffende inrichting of van de gemeente die de opnamekosten betaalt, het verzoek ontvangt om de
      arbeidsongeschiktheidsuitkering aan die inrichting of die gemeente uit te betalen, is het Uitvoeringsinstituut
      werknemersverzekeringen bevoegd dat verzoek zonder het stellen van andere voorwaarden in te willigen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel54
  - number: '54.3'
    text: |-
      Indien het eerste lid toepassing vindt, heeft de in het tweede lid bedoelde bevoegdheid betrekking op het
      gedeelte van de arbeidsongeschiktheidsuitkering, dat niet aan het College voor zorgverzekeringen, genoemd in
      [artikel 1a van de Ziekenfondswet][ref1] wordt uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1a
  - number: '54.4'
    text: |-
      Op de herziening van een beschikking op grond van het eerste lid als gevolg van een wijziging van de verschuldigde
      bijdrage zijn de [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '56'
    text: |-
      De termijnen van de arbeidsongeschiktheidsuitkering, welke niet zijn ingevorderd binnen twee jaren na de dag der
      betaalbaarstelling, worden niet meer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel56
  - number: '57.1'
    text: |-
      De uitkering die als gevolg van een besluit als bedoeld in [artikel 36a][ref1] onverschuldigd is betaald, alsmede
      hetgeen anderszins onverschuldigd is betaald, wordt door het Uitvoeringsinstituut werknemersverzekeringen van de
      belanghebbende teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel36a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 36a
        hoofdstuk: II
        paragraaf: '2'
  - number: '57.2'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van terugvordering
      of van verdere terugvordering af te zien, indien de belanghebbende:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57
  - number: 57.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57
  - number: 57.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57
  - number: 57.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57
  - number: 57.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57
  - number: '57.3'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57
  - number: 57.3.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de artikelen [475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 57.3.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 80][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: '57.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57
  - number: '57.5'
    text: |-
      Het besluit tot terugvordering vermeldt hetgeen wordt teruggevorderd, de termijn of termijnen waarbinnen moet
      worden betaald, alsmede dat het besluit bij gebreke van tijdige betaling zal worden tenuitvoergelegd op de wijze
      als omschreven in [artikel 57][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel57a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 57a
        hoofdstuk: II
        paragraaf: '2'
  - number: '57.6'
    text: |-
      Degene van wie wordt teruggevorderd is verplicht desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen
      de inlichtingen te verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57
  - number: '57.7'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen, onder voorwaarden die Onze
      Minister kan stellen, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze
      Minister vast te stellen bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57
  - number: 57a.1
    text: |-
      Het besluit tot terugvordering levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 57a.2
    text: |-
      [Artikel 29g][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de artikelen [475c][ref2] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan, het Uitvoeringsinstituut
      werknemersverzekeringen de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel29g
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 29g
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 57b
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de
      [artikelen 57, eerste, tweede, derde, vierde, vijfde en zesde lid][ref1], en [57a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel57a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel57b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '57'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 57a
        hoofdstuk: II
        paragraaf: '2'
  - number: 59a
    text: Degene, die recht heeft op arbeidsongeschiktheidsuitkering, heeft recht op een vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel59a
  - number: 59b.1
    text: |-
      De vakantie-uitkering bedraagt 8 pct. van het bedrag aan arbeidsongeschiktheidsuitkering, waarop recht bestond in
      de periode van twaalf maanden, voorafgaande aan de maand mei.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel59b
  - number: 59b.2
    text: |-
      Indien [artikel 44][ref1] is toegepast, wordt onder het bedrag aan arbeidsongeschiktheidsuitkering als bedoeld in
      het eerste lid verstaan het bedrag van de arbeidsongeschiktheidsuitkering, nadat [artikel 44][ref2] is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel44
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
  - number: 59b.3
    text: De uitbetaling van de vakantie-uitkering vindt eenmaal per jaar ambtshalve plaats in de maand mei.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel59b
  - number: 59b.4
    text: |-
      Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1], wordt gewijzigd, wordt
      het percentage van de in het eerste lid bedoelde vakantie-uitkering, alsmede de noemer van de in de
      [artikelen 21, tweede lid][ref2] en [22][ref3], bedoelde breuk dienovereenkomstig aangepast. Het gewijzigde
      percentage wordt in aanmerking genomen over de uitkering waarop recht bestaat over de periode aanvangende met de
      dag waarop de wijziging ingaat. Het aldus gewijzigde percentage en de aldus gewijzigde noemer treden in de plaats
      van het in het eerste lid genoemde percentage onderscheidenlijk de in de [artikelen 21, tweede lid][ref4] en
      [22][ref5], genoemde noemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel22
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '21'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '22'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '21'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: '22'
        hoofdstuk: II
        paragraaf: '1'
  - number: 59b.5
    text: |-
      Op de toekenning van de vakantie-uitkering zijn de [artikelen 3:41][ref1] en
      [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 59c
    text: |-
      Onze Minister kan nadere, zo nodig van het bepaalde in [artikel 59][ref1], afwijkende regelen stellen ter
      berekening van de vakantie-uitkering van degene, wiens arbeidsongeschiktheidsuitkering met toepassing van het
      bepaalde krachtens [artikel 52][ref2] niet of niet ten volle wordt uitbetaald en die naast de uitkering ingevolge
      de wetgeving van een andere Mogendheid eveneens recht heeft op een vakantie-uitkering ingevolge die wetgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel59b
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel52
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel59c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 59b
        hoofdstuk: II
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '52'
        hoofdstuk: II
        paragraaf: '2'
  - number: 59d
    text: |-
      Het bepaalde bij of krachtens de [artikelen 50][ref1], [53][ref2], [54][ref3], [56][ref4], [57][ref5] en [80][ref6]
      vindt overeenkomstige toepassing ten aanzien van de vakantie-uitkering voor zover bij of krachtens deze paragraaf
      niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel56
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel57
      [ref6]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel59d
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '50'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '53'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '54'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '56'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: '57'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: 59e
    text: |-
      Onze Minister kan met betrekking tot het bepaalde in deze paragraaf nadere regelen stellen. Daarbij kan worden
      afgeweken van het bepaalde in [artikel 59][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel59b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 59b
        hoofdstuk: II
        paragraaf: 2a
  - number: '61'
    text: |-
      Indien een persoon die recht heeft op een arbeidsongeschiktheidsuitkering en op of na de dag waarop hij de
      leeftijd van 45 jaar heeft bereikt inkomsten uit arbeid in dienstbetrekking gaat verdienen in verband waarmee zijn
      arbeidsongeschiktheidsuitkering wordt beëindigd, binnen vijf jaar na de datum van werkaanvaarding opnieuw recht
      heeft op toekenning van een arbeidsongeschiktheidsuitkering, wordt het aan die uitkering ten grondslag te leggen
      dagloon niet lager gesteld dan het dagloon of vervolgdagloon dat voor de berekening van de laatstelijk ontvangen
      loondervingsuitkering of vervolguitkering in aanmerking werd genomen, zoals dat vanaf de beëindiging tot aan
      de datum van de in dit artikel bedoelde toekenning op grond van [artikel 15 van deze wet][ref1], al dan niet in
      verbinding met [artikel 14 van de Wet minimumloon en minimumvakantiebijslag][ref2], zou zijn herzien indien de
      arbeidsongeschiktheidsuitkering niet was beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '15'
        hoofdstuk: I
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '65.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter voorkoming of beperking van
      samenloop van arbeidsongeschiktheidsuitkering met arbeidsongeschiktheidsuitkering op grond van andere wetten.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel65
  - number: '65.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ter voorkoming of beperking van samenloop van
      arbeidsongeschiktheidsuitkering met uitkering op grond van de sociale wetgeving van de Nederlandse Antillen, Aruba
      of van een andere Mogendheid.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel65
  - number: 65a.1
    text: |-
      De arbeidsongeschiktheidsuitkering en de vakantie-uitkering op grond van deze wet zijn onvervreemdbaar en niet
      vatbaar voor verpanding of belening.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel65a
  - number: 65a.2
    text: Volmacht tot ontvangst van een uitkering onder welke vorm of benaming ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel65a
  - number: 65a.3
    text: Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel65a
  - number: 65b
    text: 'Niet vatbaar voor beslag zijn:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel65b
  - number: 65b.a
    text: |-
      de verhoging, bedoeld in [artikel 22][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel22
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel65b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '22'
        hoofdstuk: II
        paragraaf: '1'
  - number: 65b.b
    text: |-
      de overlijdensuitkering, bedoeld in [artikel 53][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel65b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '53'
        hoofdstuk: II
        paragraaf: '2'
  - number: '66'
    text: De werknemer is verzekerd bij het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel66
  - number: '67'
    text: |-
      Voor de toepassing van deze wet gelden aaneensluitende verzekeringen bij het Uitvoeringsinstituut
      werknemersverzekeringen als één verzekering.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel67
  - number: '71.1'
    text: |-
      Indien de werknemer meer dan één werkgever heeft, wordt de arbeidsongeschiktheidsuitkering betaald door het
      Uitvoeringsinstituut werknemersverzekeringen, ook indien één of meer werkgevers eigenrisicodrager zijn.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71
  - number: '71.2'
    text: |-
      In de situatie, bedoeld in het eerste lid, verhaalt het Uitvoeringsinstituut werknemersverzekeringen op de
      eigen risicodrager, naar rato van de loonsom en met inachtneming van het derde lid, de door hem verschuldigde
      arbeidsongeschiktheidsuitkering, alsmede de op grond van enige wet over deze uitkering verschuldigde premies die
      niet op deze uitkering in mindering kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71
  - number: '71.3'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt niet verhaald op de eigen risicodrager, indien de werknemer met behoud van
      hetzelfde loon bij die werkgever arbeid is blijven verrichten.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71
  - number: '71.4'
    text: Onze Minister kan omtrent de betaling en het verhaal regels stellen, zonodig in afwijking van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71
  - number: 71a.1
    text: |-
      De werkgever jegens wie de werknemer, bij ongeschiktheid tot het verrichten van arbeid wegens ziekte, recht
      heeft op loon als bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1] dan wel aanspraak heeft op
      bezoldiging op grond van [artikel XV, tweede lid, van de Wet terugdringing ziekteverzuim][ref2] houdt aantekening
      van het verloop van de arbeidsongeschiktheid en de reïntegratie van de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0006355#ArtikelXV
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0006355
        artikel: XV
  - number: 71a.2
    text: |-
      De werkgever, bedoeld in het eerste lid, stelt binnen een door Onze Minister nader te bepalen termijn, in
      overeenstemming met de werknemer een plan van aanpak op. De afspraken die in het plan van aanpak zijn gemaakt
      worden door werkgever en werknemer nageleefd. Het plan van aanpak wordt periodiek geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71a
  - number: 71a.3
    text: |-
      Uiterlijk twee weken voordat de termijn is verstreken waarbinnen de belanghebbende op grond van
      [artikel 34, derde lid, eerste volzin][ref1], zijn aanvraag voor toekenning van de arbeidsongeschiktheidsuitkering
      dient te doen stelt de werkgever, bedoeld in het eerste lid, in overleg met de werknemer een reïntegratieverslag op
      en verstrekt de werkgever hiervan een afschrift aan de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
  - number: 71a.4
    text: |-
      Indien [artikel 19, zevende lid][ref1], toepassing heeft gevonden:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 71a.4.a
    text: |-
      stelt de werkgever in overleg met de werknemer, indien hij nog geen reïntegratieverslag heeft opgesteld,
      in afwijking van het derde lid, het reïntegratieverslag uiterlijk 14 weken voor het verstrijken van
      de door het Uitvoeringsinstituut werknemersverzekeringen vastgestelde verlengde wachttijd, bedoeld in
      [artikel 19, zevende lid][ref1], op en verstrekt een afschrift daarvan aan de werknemer;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 71a.4.b
    text: |-
      vult de werkgever in overleg met de werknemer, indien hij reeds een reïntegratieverslag heeft opgesteld
      dit reïntegratieverslag uiterlijk 14 weken voor het verstrijken van de door het Uitvoeringsinstituut
      werknemersverzekeringen vastgestelde verlengde wachttijd, bedoeld in [artikel 19, zevende lid][ref1], aan en
      verstrekt een afschrift daarvan aan de werknemer, tenzij de werknemer verzoekt dit, in verband met het doen van een
      aanvraag als bedoeld in [artikel 34, derde lid][ref2], eerder te doen. De werkgever komt binnen twee weken aan dit
      verzoek tegemoet. Dit lid is van overeenkomstige toepassing bij een aanvraag voor de uitkering na toepassing van
      [artikel 34a, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel34a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 34a
        hoofdstuk: II
        paragraaf: '2'
  - number: 71a.5
    text: |-
      Bij de uitvoering van het eerste tot en met het vierde lid laat de werkgever zich bijstaan door een arbodienst als
      bedoeld in de [Arbeidsomstandighedenwet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: 71a.6
    text: |-
      De werknemer verleent zijn medewerking bij het opstellen van het plan van aanpak en het opstellen van het
      reïntegratieverslag.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71a
  - number: 71a.7
    text: |-
      Bij of krachtens ministeriële regeling kunnen regels met betrekking tot het eerste tot en met zesde lid worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71a
  - number: 71a.8
    text: |-
      Indien bij de behandeling van de aanvraag, bedoeld in [artikel 34, derde lid][ref1], blijkt dat de werkgever
      zijn verplichting om een reïntegratieverslag op te stellen niet of niet volledig is nagekomen, stelt het
      Uitvoeringsinstituut werknemersverzekeringen aan de werkgever een termijn waarbinnen het reïntegratieverslag wordt
      verstrekt of aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
  - number: 71a.9
    text: |-
      Indien bij de behandeling van de aanvraag, bedoeld in [artikel 34, derde lid][ref1], en de beoordeling als
      bedoeld in [artikel 34a][ref2] blijkt dat de werkgever zonder deugdelijke grond zijn verplichtingen op grond
      van het eerste, tweede, derde, vierde of vijfde lid dan wel de krachtens het zevende lid gestelde regels niet
      of niet volledig nakomt of onvoldoende reïntegratie-inspanningen heeft verricht stelt het Uitvoeringsinstituut
      werknemersverzekeringen een tijdvak vast, gedurende welke de werknemer jegens die werkgever recht op loon heeft
      op grond van [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref3] dan wel aanspraak op bezoldiging op grond
      van [artikel XV, tweede lid, van de Wet terugdringing ziekteverzuim][ref4]. Dit tijdvak is ten hoogste 52 weken
      en wordt afgestemd op de aard en ernst van het verzuim, alsmede op de periode die nodig wordt geacht om alsnog
      voldoende reïntegratie-inspanningen te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel34a
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref4]: https://wetten.overheid.nl/BWBR0006355#ArtikelXV
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 34a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref4
        bwb_id: BWBR0006355
        artikel: XV
  - number: 71a.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor de toepassing van het negende lid nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71a
  - number: 71b.1
    text: |-
      In afwijking van [artikel 71a][ref1], is op het Uitvoeringsinstituut werknemersverzekeringen ten aanzien
      van de werknemer die op grond van [artikel 29, tweede lid, onderdeel a, b, c of d, van de Ziektewet][ref2]
      recht heeft op ziekengeld, [artikel 71a, tweede tot en met het tiende lid][ref3] niet van toepassing en is
      [artikel 71a, eerste lid][ref4], van overeenkomstige toepassing. Het Uitvoeringsinstituut werknemersverzekeringen
      stelt, binnen een door Onze Minister nader te bepalen termijn, in overleg met die werknemer, een plan van aanpak
      op. Het plan van aanpak wordt periodiek geëvalueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
  - number: 71b.2
    text: |-
      In afwijking van [artikel 71a][ref1], is [artikel 71a, vierde, achtste, negende en tiende lid][ref2],
      niet van toepassing op de werkgever, wiens werknemer op grond van
      [artikel 29, tweede lid, onderdeel e, f of g , van de Ziektewet][ref3] dan wel op grond van
      [artikel 29a, derde of zevende lid, van die wet][ref4] recht heeft op ziekengeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: 29a
  - number: 71b.3
    text: |-
      In afwijking van het eerste lid is [artikel 71a, eerste, tweede, derde, vijfde, zesde, zevende en achtste lid][ref1],
      van overeenkomstige toepassing op de eigenrisicodrager, bedoeld in
      [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref2] ten aanzien van de persoon, bedoeld in
      [artikel 63, eerste lid, van die wet][ref3]. Indien bij de behandeling van de aanvraag, bedoeld in
      [artikel 34, derde lid][ref4], en de beoordeling, bedoeld in [artikel 34a][ref5], blijkt dat de eigenrisicodrager,
      bedoeld in de eerste zin, zonder deugdelijke grond de uit die zin voortvloeiende verplichtingen dan wel de
      krachtens het zevende lid gestelde regels niet of niet volledig nakomt of onvoldoende reïntegratie-inspanningen
      heeft verricht stelt het Uitvoeringsinstituut werknemersverzekeringen een tijdvak vast, gedurende welke de persoon,
      bedoeld in de eerste zin, recht op ziekengeld heeft op grond van [artikel 29 van de Ziektewet][ref6]. Dit tijdvak
      is ten hoogste 52 weken en wordt afgestemd op de aard en de ernst van het verzuim, alsmede op de periode die nodig
      wordt geacht om alsnog voldoende reïntegratie-inspanningen te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel34a
      [ref6]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '63'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: 34a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 71b.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel71b
  - number: '72'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beheert en administreert afzonderlijk de middelen tot dekking
      van de uitgaven, bedoeld in [artikel 76, eerste lid][ref1], alsmede de middelen benodigd voor het vormen en
      in stand houden van een reserve, in de vorm van een Arbeidsongeschiktheidsfonds dat deel uitmaakt van het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '76'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '73'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beheert en administreert afzonderlijk de middelen tot dekking van
      de uitgaven, bedoeld in [artikel 76, tweede lid][ref1], alsmede de middelen benodigd voor het vormen en in stand
      houden van een reserve, in de vorm van een Arbeidsongeschiktheidskas die deel uitmaakt van het Uitvoeringsinstituut
      werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '76'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '75.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verleent aan een werkgever op aanvraag toestemming
      om het risico van betaling van de arbeidsongeschiktheidsuitkering zelf te dragen, indien de werkgever
      een schriftelijke garantie overlegt, waaruit blijkt dat een kredietinstelling of een verzekeraar
      zich jegens het Uitvoeringsinstituut werknemersverzekeringen verplicht, op het eerste verzoek van het
      Uitvoeringsinstituut werknemersverzekeringen waarbij het Uitvoeringsinstituut werknemersverzekeringen
      schriftelijk meedeelt dat de verplichtingen die voortvloeien uit het zelf dragen van het
      risico niet worden nagekomen, die verplichtingen na te komen. De overheidswerkgever, bedoeld in
      [artikel 1, onderdeel k, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1], voorzover door Onze
      Minister in overeenstemming met Onze Minister van Financiën aangewezen, is ontheven van de verplichting tot het
      overleggen van een schriftelijke garantie, bedoeld in de eerste zin. De toestemming wordt niet verleend gedurende
      drie jaren nadat het door de werkgever zelf dragen van het in de eerste zin bedoelde risico is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0009267#Artikel1
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0009267
        artikel: '1'
  - number: '75.2'
    text: |-
      Onder een kredietinstelling als bedoeld in het eerste lid, wordt verstaan een op grond van
      [artikel 52, tweede lid, van de Wet toezicht kredietwezen 1992 ][ref1]geregistreerde kredietinstelling als bedoeld
      in [artikel 1, eerste lid, onderdeel a, onder 1°, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '1'
  - number: '75.3'
    text: 'Onder een verzekeraar als bedoeld in het eerste lid, wordt verstaan een verzekeraar:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
  - number: 75.3.1°
    text: |-
      die in het bezit is van de op grond van [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1]
      vereiste vergunning of heeft voldaan aan de op grond van de [artikelen 37][ref2] of [38 van die wet][ref3] vereiste
      procedure met betrekking tot een bijkantoor in Nederland; of


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel38
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0006509
        artikel: '38'
  - number: 75.3.2°
    text: |-
      die heeft voldaan aan de vereiste procedure, bedoeld in de
      [artikelen 111, eerste lid, onderdelen a tot en met c, of tweede lid][ref1],
      [113, eerste of vierde lid][ref2], [116, eerste lid, onderdelen a tot en met c, of derde lid][ref3], of
      [118, tweede of vijfde lid, van de Wet toezicht verzekeringsbedrijf 1993][ref4] indien het de aldaar bedoelde
      dienstverrichting naar Nederland betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel113
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel116
      [ref4]: https://wetten.overheid.nl/BWBR0006509#Artikel118
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '111'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '113'
      - id: ref3
        bwb_id: BWBR0006509
        artikel: '116'
      - id: ref4
        bwb_id: BWBR0006509
        artikel: '118'
  - number: '75.4'
    text: |-
      De schriftelijke garantie, bedoeld in het eerste lid, wordt voor onbepaalde tijd afgegeven, strekt zich uit tot
      rechtsopvolgers onder algemene titel van de eigen risicodrager en tot het risico dat overgaat op de verkrijgende
      werkgever, bedoeld in [artikel 75b, vierde en zesde lid][ref1] en bepaalt dat de desbetreffende kredietinstelling
      of verzekeraar de garantie kan beëindigen door schriftelijke opzegging bij het Uitvoeringsinstituut
      werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75b
        hoofdstuk: IIIA
  - number: '75.5'
    text: |-
      De schriftelijke garantie, bedoeld in het eerste lid, strekt zich niet uit tot arbeidsongeschiktheidsuitkeringen
      terzake van arbeidsongeschiktheid die is ontstaan door een omstandigheid als bedoeld in
      [artikel 64, tweede lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1], of door een kernongeval als bedoeld
      in [artikel 1, eerste lid, van de Wet aansprakelijkheid kernongevallen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003234#Artikel1
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0003234
        artikel: '1'
  - number: '75.6'
    text: |-
      De toestemming, bedoeld in het eerste lid, wordt verleend met ingang van 1 januari of 1 juli van enig jaar, mits de
      aanvraag ten minste dertien weken voor de desbetreffende datum is ingediend. Aan een startende werkgever wordt op
      zijn verzoek toestemming verleend met ingang van het tijdstip waarop deze start.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
  - number: '75.7'
    text: 'Het door de werkgever zelf dragen van het risico, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
  - number: 75.7.a
    text: |-
      eindigt met ingang van de dag waarop de schriftelijke garantie, bedoeld in het eerste lid, eindigt,
      onderscheidenlijk met ingang van de dag waarop de eigen risicodrager in staat van faillissement is verklaard of ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard dan wel de dag waarop
      hij ophoudt werkgever te zijn;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
  - number: 75.7.b
    text: |-
      wordt door het Uitvoeringsinstituut werknemersverzekeringen op 1 januari of 1 juli van enig jaar beëindigd op
      aanvraag van de werkgever, mits deze aanvraag ten minste dertien weken voor de desbetreffende datum is ingediend;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
  - number: 75.7.c
    text: |-
      kan door het Uitvoeringsinstituut werknemersverzekeringen zonder aanvraag van de werkgever
      met onmiddellijke ingang worden beëindigd indien de rechtbank de noodregeling, bedoeld in
      [hoofdstuk IX van de Wet toezicht verzekeringsbedrijf 1993][ref1] onderscheidenlijk de bijzondere voorziening
      als bedoeld in [hoofdstuk X van de Wet toezicht kredietwezen 1992][ref2] heeft uitgesproken over de betrokken
      verzekeraar onderscheidenlijk kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#HoofdstukIX
      [ref2]: https://wetten.overheid.nl/BWBR0005792#HoofdstukX
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006509
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0005792
        hoofdstuk: X
  - number: '75.8'
    text: |-
      Aan een gemeente kan toestemming worden verleend om het risico van betaling van de arbeidsongeschiktheidsuitkering
      zelf te dragen met uitzondering van dat risico ten aanzien van zijn werknemers die werkzaam zijn bij:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
  - number: 75.8.a
    text: |-
      een door een of meer gemeenten, al dan niet tezamen met een of meer privaatrechtelijke rechtspersonen met volledige
      rechtsbevoegdheid, in stand gehouden school;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
  - number: 75.8.b
    text: |-
      een door een openbare rechtspersoon als bedoeld in [artikel 47 van de Wet op het primair onderwijs][ref1] in stand
      gehouden school;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel47
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '47'
  - number: 75.8.c
    text: |-
      een door een stichting als bedoeld in [artikel 17][ref1] of [artikel 48 van de Wet op het primair onderwijs][ref2]
      in stand gehouden school;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel48
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '48'
  - number: 75.8.d
    text: |-
      een door het bevoegd gezag van een openbare school, al dan niet met één of meer andere bevoegde gezagsorganen
      als bedoeld in de [Wet op het primair onderwijs][ref1], de [Wet op de expertisecentra][ref2] of de
      [Wet op het voortgezet onderwijs][ref3], in stand gehouden centrale dienst zoals die beschreven wordt in
      [artikel 68 van de Wet op het primair onderwijs][ref4], voorzover de kosten voor de betrokken werknemers door het
      Rijk worden bekostigd; of


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel68
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
      - id: ref4
        bwb_id: BWBR0003420
        artikel: '68'
  - number: 75.8.e
    text: |-
      openbare scholen als bedoeld in [artikel 1, onderdelen a tot en met c][ref1], en
      [artikel 124, onderdelen a tot en met c, van de Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel124
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '124'
  - number: '75.9'
    text: |-
      Aan een gemeente wordt geen toestemming verleend om het risico van betaling van de arbeidsongeschiktheidsuitkering
      zelf te dragen ten aanzien van werknemers die werkzaam zijn in een dienstbetrekking op grond van de
      [Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0008903
  - number: 75a.1
    text: |-
      De eigen risicodrager draagt gedurende de periode van vier jaar nadat de arbeidsongeschiktheidsuitkering is
      ingegaan het risico van de betaling van de arbeidsongeschiktheidsuitkering die is toegekend:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75a
  - number: 75a.1.a
    text: |-
      aan de werknemer die op de eerste dag van de ongeschiktheid tot het verrichten van zijn arbeid als bedoeld in
      [artikel 19 van de Ziektewet][ref1] tot de eigen risicodrager in dienstbetrekking stond en ter zake van die
      ongeschiktheid de wachttijd van 104 weken, bedoeld in [artikel 19][ref2] heeft doorgemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '19'
  - number: 75a.1.b
    text: |-
      met toepassing [van artikel 43a, eerste lid, onderdeel a][ref1], nadat de arbeidsongeschiktheidsuitkering toegekend
      aan de werknemer, bedoeld in onderdeel a, is ingetrokken op grond van [artikel 43, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
  - number: 75a.1.c
    text: |-
      met toepassing van [artikel 43a, eerste lid, onderdeel b][ref1], aan de werknemer, bedoeld in onderdeel a, die aan
      het einde van de wachttijd ongeschikt was tot het verrichten van zijn arbeid wegens ziekte of gebreken, maar geen
      recht had op toekenning van arbeidsongeschiktheidsuitkering omdat hij niet arbeidsongeschikt was;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
  - number: 75a.1.d
    text: |-
      aan de werknemer, bedoeld in onderdeel a, ten aanzien van wie op grond van
      [artikel 43a, vierde lid, onderdeel b][ref1], geen toepassing kan worden gegeven aan
      [artikel 43a, eerste lid][ref2], als bedoeld in de onderdelen b en c.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
  - number: 75a.2
    text: |-
      Indien de arbeidsongeschiktheidsuitkering wordt toegekend met toepassing van [artikel 43a, eerste lid][ref1], of
      aan de werknemer, bedoeld in het eerste lid, onderdeel d, vangt de in het eerste lid bedoelde periode van vier jaar
      aan na het verstrijken van de wachttijd van 104 weken, bedoeld in het eerste lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
  - number: 75a.3
    text: |-
      Het eerste lid is niet van toepassing indien de arbeidsongeschiktheidsuitkering wordt toegekend aan een werknemer
      die:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75a
  - number: 75a.3.a
    text: |-
      bij het aangaan van de dienstbetrekking, bedoeld in het eerste lid, arbeidsgehandicapte was als bedoeld in
      [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
  - number: 75a.3.b
    text: tot de dag waarop de arbeidsongeschiktheidsuitkering is toegekend arbeidsgehandicapte is gebleven; en
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75a
  - number: 75a.3.c
    text: |-
      een periode van zes jaar te rekenen vanaf de dag waarop de dienstbetrekking, bedoeld onder a, is aangegaan niet
      is verstreken.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75a
  - number: 75a.4
    text: |-
      De eigen risicodrager betaalt, met inachtneming van [artikel 71][ref1], de door het Uitvoeringsinstituut
      werknemersverzekeringen toegekende arbeidsongeschiktheidsuitkering namens het Uitvoeringsinstituut
      werknemersverzekeringen aan de werknemer, bedoeld in het eerste lid. Indien de eigen risicodrager de
      arbeidsongeschiktheidsuitkering niet betaalt, betaalt het Uitvoeringsinstituut werknemersverzekeringen de
      arbeidsongeschiktheidsuitkering en verhaalt het Uitvoeringsinstituut werknemersverzekeringen deze uitkering,
      alsmede de op grond van enige wet over deze uitkering verschuldigde premies die niet op deze uitkering in mindering
      kunnen worden gebracht, op de eigen risicodrager.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '71'
        hoofdstuk: III
        paragraaf: '1'
  - number: 75a.5
    text: |-
      Indien de door het Uitvoeringsinstituut werknemersverzekeringen toegekende arbeidsongeschiktheidsuitkering geheel
      of ten dele niet aan de werknemer, bedoeld in het eerste lid, wordt betaald wegens het genieten van loon als
      bedoeld in [artikel 44, derde lid][ref1], wordt na afloop van een kalenderkwartaal het gezamenlijke bedrag van
      de arbeidsongeschiktheidsuitkeringen en de niet uitbetaalde vakantie-uitkeringen, vermeerderd met het bedrag aan
      premies dat de eigen risicodrager bij wel-uitbetaling daarover op grond van enige wet verschuldigd zou zijn en dat
      niet op de uitkeringen in mindering kan worden gebracht, door de eigen risicodrager aan ’s Rijks kas afgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel44
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
  - number: 75a.6
    text: |-
      Indien een arbeidsongeschiktheidsuitkering wordt toegekend direct aansluitend op een wachttijd die op grond
      van [artikel 19, zevende lid][ref1], is verlengd, wordt de duur van de verlenging van de wachttijd in mindering
      gebracht op de periode van vier jaar bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 75a.7
    text: |-
      Indien een arbeidsongeschiktheidsuitkering, respectievelijk een verhoging daarvan, niet wordt uitbetaald op grond
      van [artikel 43d][ref1] wordt de periode van vier jaar, bedoeld in het eerste lid, verlengd met het verlengde
      tijdvak waarin recht bestaat op ziekengeld op grond van [artikel 29, negende lid, van de Ziektewet][ref2], op loon
      op grond van [artikel 629, elfde lid, onderdelen a en c, van Boek 7 van het Burgerlijk Wetboek][ref3] dan wel op
      bezoldiging op grond van [artikel XV, veertiende lid, van de Wet terugdringing ziekteverzuim][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43d
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref4]: https://wetten.overheid.nl/BWBR0006355#ArtikelXV
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43d
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref4
        bwb_id: BWBR0006355
        artikel: XV
  - number: 75b.1
    text: |-
      Indien een werkgever eigen risicodrager wordt, wordt het risico van de betaling van de
      arbeidsongeschiktheidsuitkering aan de werknemer, bedoeld in [artikel 75a][ref1], die is ingegaan vóór de dag
      waarop deze werkgever eigen risicodrager wordt, vanaf die dag door de eigen risicodrager gedragen, overeenkomstig
      [artikel 75a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
  - number: 75b.2
    text: |-
      In geval van overgang van een onderneming in de zin van [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1],
      alsmede in geval van een dergelijke overgang bij faillissement, waarbij de werkgever die de onderneming overdraagt
      geen eigen risicodrager is en de werkgever die de onderneming verkrijgt eigen risicodrager is of wordt, wordt door
      de eigen risicodrager het in het derde lid beschreven risico zelf gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
  - number: 75b.3
    text: |-
      Het tweede lid betreft het risico van de betaling van de arbeidsongeschiktheidsuitkering, overeenkomstig
      [artikel 75a][ref1], die is of wordt toegekend aan de werknemer die op de eerste dag van de ongeschiktheid tot het
      verrichten van zijn arbeid in dienstbetrekking stond tot de werkgever die de onderneming heeft overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
  - number: 75b.4
    text: |-
      Indien de werkgever wiens onderneming wordt overgenomen als bedoeld in het tweede lid eigen risicodrager is, gaat
      het risico van de betaling van de arbeidsongeschiktheidsuitkering, overeenkomstig [artikel 75a][ref1], die is of
      wordt toegekend aan de werknemer die op de eerste dag van de ongeschiktheid tot het verrichten van zijn arbeid
      in dienstbetrekking stond tot de werkgever die de onderneming heeft overgedragen, over op de werkgever die de
      onderneming verkrijgt, ook indien hij geen eigen risicodrager is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
  - number: 75b.5
    text: |-
      Indien het zelf dragen van het risico eindigt of wordt beëindigd anders dan als gevolg van overgang van
      onderneming van de werkgever, bedoeld in het vierde lid, blijft de werkgever het risico van de betaling van
      de arbeidsongeschiktheidsuitkering dragen, overeenkomstig [artikel 75a][ref1], die is of wordt toegekend
      aan de werknemer die op de eerste dag van de ongeschiktheid tot het verrichten van zijn arbeid tot hem in
      dienstbetrekking stond. Indien de werkgever in staat van faillissement is verklaard, of indien ten aanzien van
      hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, dan wel indien hij ophoudt
      werkgever te zijn, betaalt het Uitvoeringsinstituut werknemersverzekeringen de in de eerste zin bedoelde
      arbeidsongeschiktheidsuitkering en verhaalt het Uitvoeringsinstituut werknemersverzekeringen deze uitkering,
      alsmede de op grond van enige wet over deze uitkering verschuldigde premies die niet op deze uitkering in mindering
      kunnen worden gebracht, op de kredietinstelling of verzekeraar, bedoeld in [artikel 75, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel75
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '75'
        hoofdstuk: IIIA
  - number: 75b.6
    text: |-
      Indien de onderneming van de werkgever, bedoeld in het vijfde lid, wordt overgenomen als bedoeld in het tweede lid
      en de werkgever die de onderneming verkrijgt geen eigen risicodrager is, gaan de verplichtingen met betrekking tot
      de betaling van de arbeidsongeschiktheidsuitkering, bedoeld in het vijfde lid, over op de laatstgenoemde werkgever.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75b
  - number: 75b.7
    text: |-
      Indien slechts een deel van een onderneming als bedoeld in het tweede lid overgaat, vindt het tweede lid
      toepassing naar rato van het deel van de loonsom dat het overgegane deel van de onderneming deel uitmaakte
      van de gehele onderneming in het kalenderjaar voorafgaande aan dat van overgang, doch blijft de betaling
      van een arbeidsongeschiktheidsuitkering als bedoeld in het derde lid berusten bij het Uitvoeringsinstituut
      werknemersverzekeringen. Het Uitvoeringsinstituut werknemersverzekeringen verhaalt op de eigen risicodrager de door
      hem op grond van de eerste zin verschuldigde arbeidsongeschiktheidsuitkering, alsmede de op grond van enige wet
      over deze uitkering verschuldigde premies die niet op deze uitkering in mindering kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75b
  - number: 75b.8
    text: |-
      Indien slechts een deel van een onderneming als bedoeld in het vierde en zesde lid overgaat, blijft het risico van
      de betaling van de arbeidsongeschiktheidsuitkering, bedoeld in het vierde en zesde lid, berusten bij de werkgever
      die een deel van de onderneming overdraagt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75b
  - number: 75c.1
    text: |-
      De eigen risicodrager is over het loon van de tot hem in dienstbetrekking staande werknemers, de
      gedifferentieerde premie, bedoeld in [artikel 78, eerste lid][ref1], en over de door hem te betalen
      arbeidsongeschiktheidsuitkeringen, de vervangende premie, bedoeld in [artikel 78, zevende lid][ref2], niet
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel78
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '78'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '78'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 75c.2
    text: |-
      De startende werkgever, bedoeld in [artikel 75, zesde lid][ref1], is in afwachting van de door het
      Uitvoeringsinstituut werknemersverzekeringen te verlenen toestemming, bedoeld in [artikel 75, eerste lid][ref2],
      over het loon van de tot hem in dienstbetrekking staande werknemers, de gedifferentieerde premie, bedoeld in
      [artikel 78, eerste lid][ref3], niet verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel78
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '75'
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '75'
        hoofdstuk: IIIA
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '78'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 75c.3
    text: |-
      De eigen risicodrager die ter dekking van het risico, bedoeld in [artikel 75a, eerste lid][ref1], een verzekering
      heeft afgesloten, mag de door hem ter zake van die verzekering verschuldigde premie niet verhalen op de werknemer.
      Elk beding waarbij van de eerste zin wordt afgeweken is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
  - number: 75c.4
    text: |-
      In afwijking van de vorige leden is over het loon van de werknemer van de eigenrisicodrager, op
      wie [artikel 76a, tweede lid][ref1], van toepassing is, de gedifferentieerde premie, bedoeld in
      [artikel 78, eerste lid][ref2], verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel78
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 76a
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '78'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 75d.1
    text: |-
      De eigen risicodrager is niet verplicht tot het doen van de aangifte van ongeschiktheid tot werken, bedoeld in
      [artikel 38 van de Ziektewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75d
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
  - number: 75d.2
    text: |-
      De eigen risicodrager doet, uiterlijk acht maanden nadat de ongeschiktheid tot werken van een werknemer voor
      wie hij het risico, bedoeld in [artikel 75][ref1], draagt zijn verstreken, aangifte van die ongeschiktheid bij
      het Uitvoeringsinstituut werknemersverzekeringen. De werkgever geeft daarbij de eerste dag van de ongeschiktheid
      tot werken op. Voor het bepalen van het tijdvak van acht maanden worden tijdvakken van ongeschiktheid
      tot werken samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen. Bij de
      vaststelling van zowel het tijdvak van acht maanden als de periode van vier weken blijven perioden, waarin
      uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref2], [3:8][ref3],
      of [3:10, eerste lid, van de Wet arbeid en zorg][ref4] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75d
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 75d.3
    text: |-
      Onverminderd het tweede lid doet de eigen risicodrager aangifte van de ongeschiktheid tot werken van een werknemer
      voor wie hij het in [artikel 75][ref1], bedoelde risico draagt, op de laatste werkdag voordat de dienstbetrekking
      eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75d
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
  - number: 75e
    text: |-
      Op de eigen risicodrager is [artikel 71a][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75e
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
  - number: 75f.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen brengt bij de eigen risicodrager de kosten in rekening ter zake
      van:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75f
  - number: 75f.1.a
    text: |-
      de beoordeling van de aanvraag, bedoeld in [artikel 75, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75f
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '75'
        hoofdstuk: IIIA
  - number: 75f.1.b
    text: |-
      de betaling van de uitkering door het Uitvoeringsinstituut werknemersverzekeringen en het verhaal op de eigen
      risicodrager, bedoeld in [artikel 75][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75f
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
  - number: 75f.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen vergoedt aan de eigen risicodrager op aanvraag de schade die deze
      lijdt door toepassing van [artikel 36b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel36b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75f
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 36b
        hoofdstuk: II
        paragraaf: '2'
  - number: 75f.3
    text: Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75f
  - number: 75g
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere en zonodig afwijkende regels worden gesteld met betrekking tot
      dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel75g
  - number: '76.1'
    text: |-
      De middelen tot dekking van de uitgaven ten laste van het Arbeidsongeschiktheidsfonds, alsmede de middelen benodigd
      voor het vormen en in stand houden van een reserve in het Arbeidsongeschiktheidsfonds, worden verkregen door het
      heffen van de in [artikel 76][ref1], bedoelde basispremie.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 76a
        hoofdstuk: IV
        paragraaf: '1'
  - number: '76.2'
    text: |-
      De middelen tot dekking van de uitgaven ten laste van de Arbeidsongeschiktheidskas, alsmede de middelen benodigd
      voor het vormen en in stand houden van een reserve in de Arbeidsongeschiktheidskas, worden verkregen door het
      heffen van de in [artikel 76][ref1], bedoelde gedifferentieerde premie.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 76a
        hoofdstuk: IV
        paragraaf: '1'
  - number: 76a.1
    text: 'De premie, die door de werkgever verschuldigd is, bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76a
  - number: 76a.1.a
    text: |-
      een basispremie, waarop de artikelen [76b][ref1], [77][ref2], [77a][ref3], [79a][ref4] en [79b][ref5] van
      toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76b
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel77
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel77a
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel79a
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel79b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 76b
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '77'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 77a
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 79a
        hoofdstuk: IV
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: 79b
        hoofdstuk: IV
        paragraaf: '4'
  - number: 76a.1.b
    text: |-
      een gedifferentieerde premie, waarop de [artikelen 76b][ref1], [78][ref2] en [79b][ref3] van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76b
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel79b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 76b
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '78'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 79b
        hoofdstuk: IV
        paragraaf: '4'
  - number: 76a.2
    text: 'In afwijking van het eerste lid is de premie verschuldigd door de werknemer indien:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76a
  - number: 76a.2.a
    text: |-
      voor hem een beschikking geldt als bedoeld in
      [artikel 4a van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] waarin hij met betrekking tot de
      verrichte soort van werkzaamheden wordt aangemerkt als zelfstandige als bedoeld in [artikel 4 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel4
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '4'
  - number: 76a.2.b
    text: |-
      het de werkgever niet redelijkerwijs duidelijk kan zijn dat de werknemer tot hem in een privaatrechtelijke of
      publiekrechtelijke dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76a
  - number: 76b.1
    text: |-
      De werkgever betaalt de basispremie en de gedifferentieerde premie aan het Uitvoeringsinstituut
      werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76b
  - number: 76b.2
    text: |-
      De werkgever mag de door hem verschuldigde premie niet verhalen op de werknemer. Elk beding waarbij van de eerste
      zin wordt afgeweken is nietig.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76b
  - number: 76b.3
    text: |-
      Indien [artikel 76a, tweede lid][ref1], van toepassing is, betaalt, in afwijking van het eerste lid, de werknemer
      de basispremie en de gedifferentieerde premie aan het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 76a
        hoofdstuk: IV
        paragraaf: '1'
  - number: 76c
    text: 'Ten gunste van het Arbeidsongeschiktheidsfonds komen:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76c
  - number: 76c.a
    text: |-
      de gelden die het Uitvoeringsinstituut werknemersverzekeringen ontvangt door het heffen van de basispremie, bedoeld
      in [artikel 77][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel77
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '77'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 76c.b
    text: |-
      de gelden die het Uitvoeringsinstituut werknemersverzekeringen ontvangt door toepassing van [artikel 29a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel29a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 29a
        hoofdstuk: II
        paragraaf: '1'
  - number: 76c.c
    text: |-
      de gelden die het Uitvoeringsinstituut werknemersverzekeringen ontvangt door toepassing van
      [artikel 75f, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75f
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75f
        hoofdstuk: IIIA
  - number: 76c.d
    text: |-
      de gelden die het Uitvoeringsinstituut werknemersverzekeringen met toepassing van verhaal als bedoeld in
      [artikel 90][ref1] ontvangt in verband met uitkeringen als bedoeld in [artikel 76d, eerste lid, onderdeel a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel76d
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '90'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 76d
        hoofdstuk: IV
        paragraaf: '1'
  - number: 76c.e
    text: |-
      de gelden die het Uitvoeringsinstituut werknemersverzekeringen ontvangt door toepassing van [artikel 57][ref1], in
      verband met uitkeringen als bedoeld in [artikel 76d, eerste lid, onderdeel a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel76d
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '57'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 76d
        hoofdstuk: IV
        paragraaf: '1'
  - number: 76c.f
    text: |-
      de gelden die het Uitvoeringsinstituut werknemersverzekeringen ontvangt door toepassing van
      [artikel XIV van de Wet afschaffing malus en bevordering reïntegratie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007634#ArtikelXIV
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76c
    references:
      - id: ref1
        bwb_id: BWBR0007634
        artikel: XIV
  - number: 76d.1
    text: |-
      Ten laste van het Arbeidsongeschiktheidsfonds komen, met inachtneming van [artikel 76f][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76f
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 76f
        hoofdstuk: IV
        paragraaf: '1'
  - number: 76d.1.a
    text: |-
      de door het Uitvoeringsinstituut werknemersverzekeringen te betalen arbeidsongeschiktheidsuitkeringen, alsmede de
      op grond van enige wet over deze uitkeringen door het Uitvoeringsinstituut werknemersverzekeringen verschuldigde
      premies, die niet op deze uitkeringen in mindering kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76d
  - number: 76d.1.b
    text: de kosten die zijn verbonden aan de uitvoering van deze wet;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76d
  - number: 76d.1.c
    text: |-
      de gelden die door toepassing van [artikel 79][ref1] worden overgeheveld naar de Arbeidsongeschiktheidskas;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel79
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '79'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 76d.1.d
    text: |-
      de in [artikel XIII van de Wet afschaffing malus en bevordering reïntegratie][ref1] bedoelde bonusuitkeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0007634#ArtikelXIII
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0007634
        artikel: XIII
  - number: 76d.1.e
    text: |-
      het gezamenlijke bedrag van de arbeidsongeschiktheidsuitkeringen en de vakantie-uitkeringen die niet zijn
      uitbetaald wegens het genieten van loon als bedoeld in [artikel 44, derde lid][ref1], en dat op grond van
      [artikel 44, vierde lid][ref2], wordt afgedragen aan 's Rijks kas, vermeerderd met het bedrag aan premies dat het
      Uitvoeringsinstituut werknemersverzekeringen bij wel-uitbetaling daarover op grond van enige wet verschuldigd zou
      zijn en dat niet op de uitkeringen in mindering kan worden gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel44
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
  - number: 76d.1.f
    text: |-
      het op grond van [artikel 42 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] aan het Reïntegratiefonds
      af te dragen bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel42
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '42'
  - number: 76d.1.g
    text: |-
      bij ministeriële regeling te bepalen kosten in verband met de overgang van personeel en
      vermogensbestanddelen naar de Centrale organisatie werk en inkomen voor het verrichten van werkzaamheden
      gericht op de bevordering van inschakeling in de arbeid van arbeidsgehandicapten in de zin van
      [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
  - number: 76d.1.i
    text: |-
      de bedragen die op grond van [artikel 79a][ref1] op de door werkgevers verschuldigde premies in mindering wordt
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel79a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 79a
        hoofdstuk: IV
        paragraaf: '4'
  - number: 76d.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen bezigt de middelen die zijn gereserveerd ten behoeve van het
      Arbeidsongeschiktheidsfonds niet tot bestrijding van uitgaven ten laste van het Arbeidsongeschiktheidsfonds dan met
      toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76d
  - number: 76e
    text: 'Ten gunste van de Arbeidsongeschiktheidskas komen:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76e
  - number: 76e.a
    text: |-
      de gelden die het Uitvoeringsinstituut werknemersverzekeringen ontvangt door het heffen van de
      gedifferentieerde premie, bedoeld in [artikel 78, eerste lid][ref1], en de vervangende premie, bedoeld in
      [artikel 78, zevende lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel78
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76e
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '78'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '78'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 76e.b
    text: |-
      de gelden die het Uitvoeringsinstituut werknemersverzekeringen ontvangt met toepassing van [artikel 57][ref1], in
      verband met uitkeringen als bedoeld in [artikel 76f, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel76f
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76e
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '57'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 76f
        hoofdstuk: IV
        paragraaf: '1'
  - number: 76e.c
    text: |-
      de gelden die het Uitvoeringsinstituut werknemersverzekeringen ontvangt met toepassing van verhaal als bedoeld in
      [artikel 75a, vierde lid][ref1], en [artikel 75b, vijfde lid en zevende lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel75b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76e
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 75b
        hoofdstuk: IIIA
  - number: 76e.d
    text: |-
      de gelden die het Uitvoeringsinstituut werknemersverzekeringen ontvangt door toepassing van [artikel 78a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel78a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76e
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 78a
        hoofdstuk: IV
        paragraaf: '3'
  - number: 76e.e
    text: |-
      de gelden die door toepassing van [artikel 79][ref1] worden overgeheveld uit het Arbeidsongeschiktheidsfonds;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel79
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76e
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '79'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 76e.f
    text: |-
      de gelden die het Uitvoeringsinstituut werknemersverzekeringen ontvangt met toepassing van verhaal als bedoeld in
      [artikel 90][ref1] in verband met uitkeringen als bedoeld in [artikel 76f, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel76f
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76e
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '90'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 76f
        hoofdstuk: IV
        paragraaf: '1'
  - number: 76f.1
    text: |-
      Ten laste van de Arbeidsongeschiktheidskas komen gedurende de periode van vier jaar te rekenen vanaf de dag waarop
      een arbeidsongeschiktheidsuitkering is ingegaan:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
  - number: 76f.1.a
    text: |-
      de door het Uitvoeringsinstituut werknemersverzekeringen te betalen arbeidsongeschiktheidsuitkeringen, alsmede de
      op grond van enige wet over deze uitkeringen door het Uitvoeringsinstituut werknemersverzekeringen verschuldigde
      premies die niet op deze uitkeringen in mindering kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
  - number: 76f.1.b
    text: |-
      het gezamenlijke bedrag van de arbeidsongeschiktheidsuitkeringen en de vakantie-uitkeringen die in de in de aanhef
      bedoelde periode niet zijn uitbetaald wegens het genieten van loon als bedoeld in [artikel 44, derde lid][ref1], en
      dat op grond van [artikel 44, vierde lid][ref2], wordt afgedragen aan ’s Rijks kas, vermeerderd met het bedrag aan
      premies dat het Uitvoeringsinstituut werknemersverzekeringen bij wel-uitbetaling daarover op grond van enige wet
      verschuldigd zou zijn en dat niet op de uitkeringen in mindering kan worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel44
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
  - number: 76f.2
    text: |-
      Indien een arbeidsongeschiktheidsuitkering wordt toegekend met toepassing van artikel
      [43a, eerste lid, onderdeel a][ref1], vangt de in het eerste lid bedoelde periode van vier jaar aan op de dag
      waarop de in [artikel 43a, eerste lid, onderdeel a][ref2], bedoelde ingetrokken arbeidsongeschiktheidsuitkering is
      ingegaan. De eerste zin is tevens van toepassing op de arbeidsongeschiktheidsuitkering die niet is toegekend met
      toepassing van [artikel 43a, eerste lid, onderdeel a][ref3], maar met toepassing van [artikel 19][ref4], omdat het
      eerstgenoemde artikel op grond van [artikel 43a, vierde lid, onderdeel b][ref5], geen toepassing kon vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
  - number: 76f.3
    text: |-
      Indien een arbeidsongeschiktheidsuitkering wordt toegekend met toepassing van artikel
      [43a, eerste lid, onderdeel b][ref1], vangt de in het eerste lid bedoelde periode van vier jaar aan na
      het verstrijken van de in [artikel 43a, eerste lid, onderdeel b][ref2], bedoelde wachttijd. De eerste zin
      is tevens van toepassing op de arbeidsongeschiktheidsuitkering die niet is toegekend met toepassing van
      [artikel 43a, eerste lid, onderdeel b][ref3], maar met toepassing van [artikel 19][ref4], omdat het eerstgenoemde
      artikel op grond van [artikel 43a, vierde lid, onderdeel b][ref5], geen toepassing kon vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
  - number: 76f.4
    text: |-
      Indien een arbeidsongeschiktheidsuitkering wordt toegekend direct aansluitend op een wachttijd die op grond
      van [artikel 19, zevende lid][ref1], is verlengd, wordt de duur van de verlenging van de wachttijd in mindering
      gebracht op de periode van vier jaar bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 76f.5
    text: |-
      Indien een arbeidsongeschiktheidsuitkering, respectievelijk een verhoging daarvan, niet wordt uitbetaald op grond
      van [artikel 43d][ref1] wordt de periode van vier jaar, bedoeld in het eerste lid, verlengd met het verlengde
      tijdvak waarin recht bestaat op ziekengeld op grond van [artikel 29, negende lid, van de Ziektewet][ref2], op loon
      op grond van [artikel 629, elfde lid, onderdelen a en c, van Boek 7 van het Burgerlijk Wetboek][ref3] dan wel op
      bezoldiging op grond van [artikel XV, veertiende lid, van de Wet terugdringing ziekteverzuim][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43d
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref4]: https://wetten.overheid.nl/BWBR0006355#ArtikelXV
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43d
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref4
        bwb_id: BWBR0006355
        artikel: XV
  - number: 76f.6
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
  - number: 76f.6.a
    text: |-
      het een arbeidsongeschiktheidsuitkering betreft die op grond van [artikel 71, eerste lid][ref1], door het
      Uitvoeringsinstituut werknemersverzekeringen wordt betaald en op grond van [artikel 71, derde lid][ref2], niet op
      een eigen risicodrager wordt verhaald;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel71
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '71'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '71'
        hoofdstuk: III
        paragraaf: '1'
  - number: 76f.6.b
    text: |-
      het een arbeidsongeschiktheidsuitkering betreft die op grond van [artikel 75a, vierde lid][ref1], door het
      Uitvoeringsinstituut werknemersverzekeringen wordt betaald en niet kan worden verhaald op een kredietinstelling of
      verzekeraar als bedoeld in [artikel 75][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel75
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '75'
        hoofdstuk: IIIA
  - number: 76f.6.c
    text: |-
      het een arbeidsongeschiktheidsuitkering, anders dan bedoeld in het tweede of derde lid, betreft, toegekend aan een
      werknemer die:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
  - number: 76f.6.c.1°
    text: |-
      bij het aangaan van de dienstbetrekking waaruit de arbeidsongeschiktheid is ontstaan, arbeidsgehandicapte was als
      bedoeld in [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
  - number: 76f.6.c.2°
    text: tot de dag waarop de arbeidsongeschiktheidsuitkering is toegekend arbeidsgehandicapte is gebleven; en
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
  - number: 76f.6.c.3°
    text: |-
      een periode van zes jaar te rekenen vanaf de dag waarop de dienstbetrekking, bedoeld onder 1, is aangegaan niet
      is verstreken.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
  - number: 76f.7
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen bezigt de middelen die zijn gereserveerd ten behoeve van de
      Arbeidsongeschiktheidskas niet tot bestrijding van uitgaven ten laste van de Arbeidsongeschiktheidskas dan met
      toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
  - number: 76f.8
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere en zonodig afwijkende regels worden gesteld met betrekking tot
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel76f
  - number: '77.1'
    text: |-
      De basispremie wordt door het Uitvoeringsinstituut werknemersverzekeringen geheven in een overeenkomstig dit
      artikel vastgesteld percentage van het loon dat, in het tijdvak waarover de betaling loopt, is genoten door de
      werknemer.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel77
  - number: '77.2'
    text: |-
      Onze Minister stelt voor de berekening van de basispremie een voor alle takken van bedrijf en beroep gelijk
      percentage vast, alsmede de periode waarvoor dit percentage zal gelden.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel77
  - number: 77a.1
    text: |-
      Indien een herziening van het in [artikel 77][ref1] bedoelde percentage ingaat op een ander tijdstip dan met ingang
      van 1 januari, gaat het Uitvoeringsinstituut werknemersverzekeringen bij de berekening en de inning van de premie
      uit van een door Onze Minister voor alle takken van bedrijf en beroep vast te stellen gemiddeld percentage dat zal
      gelden voor het gehele kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel77
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '77'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 77a.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, in afwijking van het eerste lid, in bijzondere gevallen,
      onder goedkeuring van Onze Minister, voor een of meer sectoren uitgaan van de percentages, bedoeld in
      [artikel 77][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel77
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '77'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '78.1'
    text: |-
      De gedifferentieerde premie wordt door het Uitvoeringsinstituut werknemersverzekeringen geheven in een
      overeenkomstig dit artikel vastgesteld percentage van het loon dat, in het tijdvak waarover de betaling loopt, is
      genoten door de werknemer.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
  - number: '78.2'
    text: 'Het Uitvoeringsinstituut werknemersverzekeringen stelt, onder goedkeuring van Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
  - number: 78.2.a
    text: |-
      voor de berekening van de gedifferentieerde premie een voor alle takken van bedrijf en beroep gelijk
      rekenpercentage vast, alsmede de periode waarover dit percentage zal gelden;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
  - number: 78.2.b
    text: |-
      voor de berekening van het rekenpercentage, bedoeld in onderdeel a, een voor alle takken van bedrijf en beroep
      gelijk gemiddeld percentage vast, alsmede de periode waarover dit percentage zal gelden.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
  - number: '78.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt elk jaar met ingang van 1 januari voor elke werkgever
      een opslag of korting vast waarmee voor die werkgever het in het tweede lid, onderdeel a, bedoelde percentage
      wordt verhoogd respectievelijk verlaagd. Indien een werkgever met toepassing van [artikel 97l][ref1] en
      [artikel 97m van de Werkloosheidswet][ref2] is aangesloten bij verschillende sectoren, worden de in de eerste zin
      bedoelde opslag en korting afzonderlijk vastgesteld voor elk bedrijfsonderdeel van de werkgever waar werkzaamheden
      worden verricht die behoren tot een afzonderlijke sector.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97l
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel97m
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97l
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 97m
  - number: '78.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt in geval van overgang van een onderneming in de zin van
      [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1], alsmede in geval van een dergelijke overgang bij
      faillissement, de vastgestelde opslag of korting, bedoeld in het derde lid, opnieuw vast voor de werkgever die een
      onderneming of een deel daarvan verkrijgt en voor de werkgever die een deel van zijn onderneming overdraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
  - number: '78.5'
    text: |-
      De verhoging en verlaging van de gedifferentieerde premie bedraagt op verzoek van een kleine werkgever als bedoeld
      in de algemene maatregel van bestuur, bedoeld in het zesde lid, per kalenderjaar maximaal één procentpunt. Een
      verzoek als bedoeld in de eerste zin wordt ten minste 13 weken voor de aanvang van enig kalenderjaar ingediend. De
      maximering, bedoeld in de eerste zin eindigt op het moment dat de kleine werkgever de minimumpremie bedoeld in de
      algemene maatregel van bestuur, bedoeld in het zesde lid, weer verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
  - number: '78.6'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
  - number: 78.6.a
    text: |-
      omtrent de wijze waarop het rekenpercentage, bedoeld in het tweede lid, onderdeel a, en het gemiddelde percentage,
      bedoeld in het tweede lid, onderdeel b, worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
  - number: 78.6.b
    text: |-
      omtrent de wijze waarop de in het derde of vierde lid bedoelde opslag of korting door het Uitvoeringsinstituut
      werknemersverzekeringen op basis van het arbeidsongeschiktheidsrisico wordt berekend;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
  - number: 78.6.c
    text: |-
      omtrent de percentages die op grond van dit artikel ten hoogste aan een werkgever in rekening mogen worden gebracht
      en omtrent de percentages die op grond van dit artikel ten minste aan een werkgever in rekening moeten worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
  - number: '78.7'
    text: |-
      In afwijking van het eerste lid wordt over een uitkering op grond van deze wet, de [Ziektewet][ref1],
      hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg, de [Werkloosheidswet][ref2], over een
      toeslag op grond van de [Toeslagenwet][ref3] en over het loon uit een dienstbetrekking op grond van de Wet
      sociale werkvoorziening in plaats van een gedifferentieerde premie een vervangende premie vastgesteld. Het
      percentage van de vervangende premie is gelijk aan het percentage, bedoeld in het tweede lid, onderdeel
      a. Met een uitkering op grond van de [Werkloosheidswet][ref4] wordt gelijkgesteld een wachtgeld als
      bedoeld in [artikel 1, onderdeel r, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref5].
      De derde zin en deze zin vervallen met ingang van het tijdstip van aanvang van fase 3 als bedoeld in
      [artikel 54 van de Wet overheidspersoneel onder de werknemersverzekeringen][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004043
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0009267#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0009267#Artikel54
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0004043
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0009267
        artikel: '1'
      - id: ref6
        bwb_id: BWBR0009267
        artikel: '54'
  - number: '78.8'
    text: |-
      Behalve voor degene die loon ontvangt uit een dienstbetrekking op grond van de Wet sociale werkvoorziening wordt
      het zevende lid niet toegepast ingeval het Uitvoeringsinstituut werknemersverzekeringen de uitkering, vermeerderd
      met de daarover door de werkgever verschuldigde premies betaalt aan de werkgever, bedoeld in [artikel 8][ref1],
      [9][ref2] of [11 van deze wet][ref3] en in [artikel 9][ref4], [10][ref5] of [12 van de Werkloosheidswet][ref6] en
      de [Ziektewet][ref7], onafhankelijk van het voortbestaan van de dienstbetrekking met die werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0004045#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '8'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '9'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '11'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '9'
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '10'
      - id: ref6
        bwb_id: BWBR0004045
        artikel: '12'
      - id: ref7
        bwb_id: BWBR0001888
  - number: '78.9'
    text: |-
      In afwijking van het eerste lid wordt over het loon van de werknemer van de eigenrisicodrager, op wie artikel
      [76a, tweede lid][ref1], van toepassing is, de gedifferentieerde premie vastgesteld op het percentage, bedoeld in
      het tweede lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 76a
        hoofdstuk: IV
        paragraaf: '1'
  - number: '78.10'
    text: |-
      Indien Onze Minister zijn goedkeuring onthoudt aan een door het Uitvoeringsinstituut werknemersverzekeringen op
      grond van het tweede lid, onderdeel a of onderdeel b, vastgesteld percentage of vastgestelde periode, stelt hij het
      percentage of de periode vast.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
  - number: '78.11'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere en zonodig afwijkende regels worden gesteld met
      betrekking tot het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78
  - number: 78a
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78a
  - number: 78a.a
    text: |-
      omtrent de vaststelling van het bedrag dat een werkgever als bedoeld in [artikel 78, vijfde lid][ref1], aan het
      Uitvoeringsinstituut werknemersverzekeringen verschuldigd is indien hij eigen risicodrager wordt voordat hij de in
      dat artikellid bedoelde minimumpremie weer verschuldigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel78
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '78'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 78a.b
    text: |-
      omtrent de vaststelling van het bedrag dat een werkgever aan wie op grond van
      [artikel 78, zesde lid, onderdeel c][ref1], het hoogste percentage in rekening wordt gebracht, aan het
      Uitvoeringsinstituut werknemersverzekeringen verschuldigd is indien hij eigen risicodrager wordt voordat het in dat
      artikelonderdeel bedoelde laagste percentage bij hem in rekening wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel78
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel78a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '78'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '79'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de overheveling van gelden uit het
      Arbeidsongeschiktheidsfonds naar de Arbeidsongeschiktheidskas.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel79
  - number: 79a.1
    text: |-
      Het uitvoeringsinstituut werknemersverzekeringen heft op het loon van de werknemer geen basispremie als bedoeld
      in [artikel 77][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel77
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel79a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '77'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 79a.1.a
    text: indien de werkgever die werknemer in dienst neemt, terwijl die werknemer een leeftijd van 50 jaar of ouder heeft;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel79a
  - number: 79a.1.b
    text: indien die werknemer de leeftijd van 55 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel79a
  - number: 79a.2
    text: |-
      Dit artikel is niet van toepassing op de premie over het loon van de persoon die arbeid verricht als bedoeld in
      [artikel 2 van de Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel79a
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
  - number: 79a.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van een goede uitvoering van het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel79a
  - number: 79b.1
    text: |-
      De werkgever wordt, op diens aanvraag, voor zolang de dienstbetrekking duurt doch ten hoogste
      gedurende de eerste drie jaar vanaf de aanvang van de dienstbetrekking voor de werknemer
      die op de dag van aanvang van die dienstbetrekking een arbeidsgehandicapte is als bedoeld in
      [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] een korting toegekend van € 1021 per jaar op
      de door hem verschuldigde premie, bedoeld in [artikel 76a][ref2]. Een aanvraag als bedoeld in dit lid wordt binnen
      één jaar na aanvang van de dienstbetrekking gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel76a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel79b
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 76a
        hoofdstuk: IV
        paragraaf: '1'
  - number: 79b.2
    text: |-
      De werkgever wordt, op diens aanvraag, met betrekking tot de werknemer die arbeidsgehandicapte is geworden als
      bedoeld in [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref1], voor zolang de dienstbetrekking
      duurt doch ten hoogste gedurende één jaar nadat die werknemer zijn eigen arbeid of een andere functie bij dezelfde
      werkgever geheel of gedeeltelijk heeft hervat dan wel gedurende één jaar nadat diens arbeidsplaats is aangepast
      tot behoud, herstel of ter bevordering van de mogelijkheden tot het verrichten van arbeid van die werknemer, een
      korting toegekend van € 1021 per jaar op de door hem verschuldigde premie, bedoeld in [artikel 76a][ref2]. Een
      aanvraag als bedoeld in dit lid wordt binnen één jaar nadat de werknemer zijn eigen arbeid of een andere functie
      bij dezelfde werkgever geheel of gedeeltelijke heeft hervat dan wel binnen één jaar nadat de arbeidsplaats is
      aangepast gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel76a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel79b
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 76a
        hoofdstuk: IV
        paragraaf: '1'
  - number: 79b.3
    text: |-
      Het eerste en tweede lid zijn slechts van toepassing indien het loon van de werknemer over het kalenderjaar
      tenminste 50% van het naar een jaarbedrag herleide minimumloon bedraagt zoals dat voor de werknemer gold op 1
      januari van het desbetreffende kalenderjaar. Voor de werknemer wiens loon minder dan 50% van het hiervoor bedoelde
      minimumloon bedraagt, geldt een bedrag van € 227. Bij ministeriële regeling worden regels gesteld omtrent de
      verdeling van de korting over de premies op grond van deze wet. Onverminderd het eerste en tweede lid en de tweede
      volzin, wordt de werkgever een korting op de verschuldigde premie toegekend van € 680 voor de werknemer die tevens
      jonggehandicapte is als bedoeld in [artikel 5 van de Wet arbeidsongeschiktheidsvoorziening][ref1] en diegenen die
      na rea-toets recht hebben op het rea-instrumentarium en bij wie hun beperking al voor hun 17e verjaardag bestond.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel5
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel79b
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '5'
  - number: 79b.4
    text: |-
      Een aanvraag als bedoeld in het tweede lid wordt slechts in behandeling genomen als de werkgever gelijktijdig met
      de aanvraag een plan van aanpak als bedoeld in [artikel 71a][ref1] overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel79b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
  - number: 79b.5
    text: |-
      Voor de toepassing van dit artikel wordt onder loon niet verstaan een uitkering krachtens de verplichte verzekering
      op grond van deze wet alsmede de toeslag daarop op grond van de [Toeslagenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel79b
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 79b.6
    text: |-
      Bij ministeriële regeling worden nadere en zo nodig afwijkende regels gesteld met betrekking tot de gevallen waarin
      en de situaties waaronder bij onderbrekingen van het dienstverband dan wel bij opeenvolgende dienstverbanden bij
      dezelfde dan wel een andere werkgever, in afwijking van het eerste en tweede lid wel premie verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel79b
  - number: 79b.7
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van een goede uitvoering van het eerste,
      tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel79b
  - number: 79b.8
    text: Bij ministeriële regeling kunnen de bedragen, bedoeld in het eerste, tweede en derde lid, worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel79b
  - number: 79b.9
    text: |-
      Indien de toepassing van dit artikel er toe zou leiden dat een negatieve premie wordt geheven, wordt de premie op
      nihil vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel79b
  - number: '80'
    text: |-
      Degene, die de wachttijd, bedoeld in [artikel 19][ref1] doormaakt, dan wel aanspraak maakt op of in het genot
      is van een arbeidsongeschiktheidsuitkering, diens wettelijke vertegenwoordiger alsmede de instelling aan
      welke ingevolge [artikel 54][ref2] de arbeidsongeschiktheidsuitkering wordt uitbetaald, zijn verplicht aan het
      Uitvoeringsinstituut werknemersverzekeringen, op zijn verzoek of onverwijld uit eigen beweging mededeling te doen
      van alle feiten of omstandigheden, waarvan het hun redelijkerwijs duidelijk is, dat zij van invloed kunnen zijn op
      het recht op of de hoogte van de arbeidsongeschiktheidsuitkering of het bedrag, dat daarvan wordt uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel54
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '54'
        hoofdstuk: II
        paragraaf: '2'
  - number: 80a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen maakt per werkgever, die behoort tot een bij ministeriële
      regeling te bepalen categorie, het percentage werknemers van die werkgever dat in een kalenderjaar recht heeft
      gekregen op een arbeidsongeschiktheidsuitkering op grond van deze wet openbaar. Dat percentage wordt verkregen
      door het aantal werknemers dat in dienstbetrekking stond tot die werkgever, dat recht heeft gekregen op een
      arbeidsongeschiktheidsuitkering op grond van deze wet in het kalenderjaar dat voorafgaat aan het kalenderjaar
      waarin openbaarmaking plaatsvindt, te delen door het gemiddelde aantal werknemers dat in dienstbetrekking stond tot
      die werkgever gedurende het kalenderjaar dat voorafgaat aan eerstgenoemd kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel80a
  - number: 80a.3
    text: |-
      Voor de toepassing van het eerste lid wordt onder recht krijgen op een arbeidsongeschiktheidsuitkering op grond
      van deze wet verstaan het voor de eerste maal betaald krijgen van de arbeidsongeschiktheidsuitkering na toekenning
      daarvan.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel80a
  - number: 80a.4
    text: |-
      Indien een werkgever, met toepassing van de [artikelen 97l][ref1] en [97m van de Werkloosheidswet][ref2], is
      aangesloten bij verschillende sectoren, vindt voor elk bedrijfsonderdeel van de werkgever, waar werkzaamheden
      worden verricht die behoren tot een afzonderlijke sector, de in het eerste lid bedoelde openbaarmaking afzonderlijk
      plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97l
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel97m
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97l
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 97m
  - number: 80a.4
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de wijze van openbaarmaking van gegevens als bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel80a
  - number: '81.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is verplicht overeenkomstig het bij of krachtens dit hoofdstuk
      bepaalde tot de vrijwillige verzekering toe te laten, mits hij hier te lande woont:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: 81.1.a
    text: |-
      degene, wiens verplichte verzekering is geëindigd en te wiens aanzien op grond van gebleken
      omstandigheden redelijkerwijze valt aan te nemen dat onderbreking van die verplichte verzekering
      van korte duur zal zijn, dan wel die beschikbaar is om arbeid te aanvaarden als bedoeld in
      [artikel 16, eerste lid, onderdeel b, van de Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
  - number: 81.1.b
    text: |-
      degene, die, terwijl hij hier te lande woonde, in het buitenland verplicht verzekerd was tegen geldelijke gevolgen
      van langdurige arbeidsongeschiktheid, mits:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: 81.1.b.1°
    text: hij niet meer in het buitenland verzekerd is, omdat hij niet langer werkzaamheden verricht in het buitenland;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: 81.1.b.2°
    text: |-
      op grond van gebleken omstandigheden redelijkerwijze valt aan te nemen, dat het zijn bedoeling is bij geboden
      gelegenheid opnieuw een dienstbetrekking aan te gaan;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: 81.1.c
    text: |-
      degene, wiens verplichte verzekering is geëindigd en die als zelfstandige een bedrijf of beroep uitoefent of gaat
      uitoefenen, of als echtgenoot van de zelfstandige in dat bedrijf of beroep meewerkt of gaat meewerken, indien
      gedurende één jaar, onmiddellijk voorafgaande aan het einde van zijn verplichte verzekering, onafgebroken, al
      dan niet in Nederland, bij of krachtens een wettelijke regeling een voorziening tegen geldelijke gevolgen van
      langdurige arbeidsongeschiktheid op hem van toepassing is geweest;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: 81.1.d
    text: |-
      degene, wiens dienstbetrekking ertoe strekt, dat slechts een gedeelte van een normale werkweek arbeid wordt
      verricht - niet uitsluitend als gevolg van een voor betrokkene geldende werktijdregeling, krachtens welke een
      normale werkweek van gemiddeld minder dan zes dagen van toepassing is - en die uit hoofde van die dienstbetrekking
      verplicht verzekerd is, indien gedurende de drie jaren, onmiddellijk voorafgaande aan de dag van aanvang van zijn
      vrijwillige verzekering, onafgebroken, al dan niet hier te lande, ingevolge het bepaalde bij of krachtens een
      wettelijke regeling een voorziening tegen geldelijke gevolgen van langdurige arbeidsongeschiktheid op hem van
      toepassing is geweest;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: 81.1.e
    text: |-
      degene, wiens arbeidsverhouding op grond van [artikel 6, eerste lid, onderdeel ][ref1], niet als dienstbetrekking
      wordt beschouwd;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel6
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '6'
        hoofdstuk: I
        paragraaf: '2'
  - number: 81.1.f
    text: |-
      degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend, berekend naar een arbeidsongeschiktheid van
      minder dan 45 %;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: 81.1.g
    text: |-
      degene, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45 %, wegens
      afneming van de arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder dan 45 %;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: 81.1.h
    text: |-
      degene, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45 %, is
      ingetrokken;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: 81.1.i
    text: |-
      degene, die op grond van [artikel 7][ref1] als werknemer wordt beschouwd en tevens als zelfstandige een bedrijf
      of beroep uitoefent of gaat uitoefenen of als echtgenoot van die zelfstandige in dat bedrijf of beroep meewerkt
      of gaat meewerken, indien gedurende de drie jaren, onmiddellijk voorafgaand aan de dag van aanvang van zijn
      vrijwillige verzekering, onafgebroken, al dan niet in Nederland, bij of krachtens een wettelijke regeling een
      voorziening tegen geldelijke gevolgen van langdurige arbeidsongeschiktheid op hem van toepassing is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel7
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
  - number: '81.2'
    text: |-
      De in het eerste lid bedoelde verplichting bestaat eveneens ten aanzien van de persoon, jonger dan 65 jaar, die op
      grond van het bepaalde bij of krachtens [artikel 3, tweede, vierde en vijfde lid][ref1], niet als werknemer wordt
      beschouwd, en


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: 81.2.a
    text: |-
      wiens verplichte verzekering is geëindigd en die buiten Nederland woont, aldaar direct aansluitend op de
      beëindiging van de verplichte verzekering een dienstbetrekking vervult voor de duur van maximaal vijf jaar en wiens
      werkgever binnen Nederland woont of gevestigd is;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: 81.2.b
    text: |-
      die Nederlander is en die is uitgezonden om door de Minister voor Ontwikkelingssamenwerking aan te wijzen
      werkzaamheden in het kader van ontwikkelingssamenwerking te verrichten;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: 81.2.c
    text: |-
      die Nederlander is en die is uitgezonden om, in of buiten Nederland, werkzaamheden te verrichten voor een
      volkenrechtelijke organisatie, waarvan Nederland lid is dan wel waarvan de werkzaamheden door Nederland worden
      ondersteund;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: 81.2.d
    text: die in Nederland woont, en buiten Nederland een dienstbetrekking vervult; of
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: 81.2.e
    text: |-
      die Nederlander is en buiten Nederland werkzaamheden verricht die worden bekostigd door het Rijk en die tevens in
      opdracht van het Rijk worden verricht in het kader van een wettelijke taakomschrijving of ter uitvoering van een
      internationaal verdrag dan wel een daarmee gelijk te stellen overeenkomst of een besluit van een volkenrechtelijke
      organisatie.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: '81.3'
    text: |-
      Aan het vervullen van een dienstbetrekking, bedoeld in het tweede lid, onderdeel a, dient een aaneengesloten
      periode van verplichte verzekering van tenminste één jaar te zijn voorafgegaan.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: '81.4'
    text: |-
      Met de Nederlander, bedoeld in het tweede lid, onderdeel b, c en e, wordt gelijkgesteld de persoon, die onderdaan
      is van één van de lidstaten van de Europese Gemeenschap of onderdaan is van een Staat, waarmee Nederland een
      verdrag inzake sociale zekerheid heeft gesloten, mits hij voor hij werd uitgezonden in Nederland woonde.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel81
  - number: '82.1'
    text: |-
      De in [artikel 81, eerste lid, onderdeel c respectievelijk d][ref1], genoemde termijn van één jaar respectievelijk
      van drie jaren wordt geacht niet te zijn onderbroken:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: 82.1.a
    text: indien de betrokkene gedurende niet meer dan zestig dagen niet verzekerd is geweest;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel82
  - number: 82.1.b
    text: |-
      gedurende de wachttijd als bedoeld in de [artikelen 19][ref1], [37][ref2] en [38][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel38
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '37'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '38'
        hoofdstuk: II
        paragraaf: '2'
  - number: 82.1.c
    text: |-
      gedurende het tijdvak, waarover een arbeidsongeschiktheidsuitkering is genoten, berekend naar een
      arbeidsongeschiktheid van ten minste 45 %.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel82
  - number: '82.2'
    text: |-
      De in [artikel 81, eerste lid, onderdeel c respectievelijk d][ref1], genoemde voorwaarde van een verzekeringsduur
      van één jaar respectievelijk van drie jaren wordt geacht te zijn vervuld, indien de betrokkene in het genot is van
      een arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: '83.1'
    text: |-
      Het verzoek om toelating tot de vrijwillige verzekering dient te worden ingediend bij het Uitvoeringsinstituut
      werknemersverzekeringen:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83
  - number: 83.1.a
    text: |-
      door de in [artikel 81, eerste lid, onderdeel ][ref1], bedoelde personen binnen vier weken na het einde van hun
      verplichte verzekering;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: 83.1.b
    text: |-
      door de in [artikel 81, eerste lid, onderdeel ][ref1], bedoelde personen binnen vier weken na de dagtekening van de
      beslissing, waarbij de arbeidsongeschiktheidsuitkering onderscheidenlijk werd toegekend, herzien of ingetrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: 83.1.c
    text: |-
      door de in [artikel 81, eerste lid, onderdeel ][ref1], bedoelde persoon: binnen vier weken na de dag, waarop zijn
      werkzaamheden als zelfstandige of zijn werkzaamheden als echtgenoot van de zelfstandige in diens bedrijfs- of
      beroepsuitoefening, een aanvang hebben genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: 83.1.d
    text: |-
      door de in [artikel 81, tweede lid, onderdeel ][ref1], bedoelde persoon: binnen vier weken na de dag, waarop de
      verplichte verzekering is geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: 83.1.e
    text: |-
      door de in [artikel 81, tweede lid, onderdeel b, c en e][ref1], bedoelde persoon: binnen vier weken na de dag
      van zijn vertrek naar het buitenland dan wel, indien de in [artikel 81, tweede lid, onderdeel c][ref2], bedoelde
      werkzaamheden worden verricht in Nederland, binnen vier weken na de dag waarop die werkzaamheden een aanvang hebben
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: 83.1.f
    text: |-
      door de in [artikel 81, tweede lid, onderdeel ][ref1], bedoelde persoon: binnen vier weken na de dag, waarop zijn
      werkzaamheden buiten Nederland een aanvang hebben genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: '83.2'
    text: |-
      De in het eerste lid, onderdeel *b*, bedoelde personen worden geacht een verzoek om toelating binnen vier weken na
      de dagtekening van de beslissing te hebben gedaan, indien dit verzoek geschiedt binnen vier weken na de dag, waarop
      zij redelijkerwijze hebben kunnen kennis nemen van die beslissing.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83
  - number: '83.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd te verklaren dat een verzoek om toelating tot de
      vrijwillige verzekering, ingediend na de daartoe op grond van deze wet of de daarop berustende bepalingen gestelde
      termijn, geacht wordt tijdig te zijn ingekomen, indien de persoon die het verzoek heeft gedaan, redelijkerwijs niet
      geacht kan worden in verzuim te zijn geweest.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83
  - number: '83.4'
    text: 'De vrijwillige verzekering vangt aan:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83
  - number: 83.4.a
    text: |-
      voor de in [artikel 81, eerste lid, onderdeel ][ref1], bedoelde persoon: op de dag na die, waarop de verplichte
      verzekering is geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: 83.4.b
    text: |-
      voor de in [artikel 81, eerste lid, onderdeel ][ref1], bedoelde persoon: op de dag van ontvangst van zijn verzoek
      om toelating;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: 83.4.c
    text: |-
      voor de in [artikel 81, eerste lid, onderdeel ][ref1], bedoelde persoon: op de dag met ingang waarvan de
      arbeidsongeschiktheidsuitkering wordt toegekend, herzien of ingetrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: 83.4.d
    text: |-
      voor de in [artikel 81, tweede lid, onderdeel b, c en e][ref1], bedoelde persoon: op de dag van zijn vertrek naar
      het buitenland dan wel, indien de in [artikel 81, tweede lid, onderdeel c][ref2], bedoelde werkzaamheden worden
      verricht in Nederland, op de dag waarop die werkzaamheden een aanvang hebben genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: 83.4.e
    text: |-
      voor de in [artikel 81, tweede lid, onderdeel ][ref1], bedoelde persoon: op de dag, waarop zijn werkzaamheden
      buiten Nederland een aanvang hebben genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: 83b
    text: 'Het Uitvoeringsinstituut werknemersverzekeringen beëindigt de vrijwillige verzekering:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83b
  - number: 83b.a
    text: op verzoek van de vrijwillig verzekerde met ingang van een door hem te bepalen datum;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83b
  - number: 83b.b
    text: |-
      met ingang van de dag, waarop de termijn van vijf jaar, bedoeld in [artikel 81, tweede lid, onderdeel ][ref1],
      is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: 83b.c
    text: |-
      met ingang van de dag, waarop de werkzaamheden bedoeld in [artikel 81, tweede lid][ref1], worden beëindigd en de
      vrijwillige verzekerde niet langer geacht kan worden inkomsten te verkrijgen wegens eindiging van die werkzaamheden
      dan wel inkomsten te derven in geval van ziekte;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: 83b.d
    text: met ingang van de dag, waarop de vrijwillig verzekerde verplicht verzekerd wordt ingevolge deze wet;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83b
  - number: 83b.e
    text: |-
      indien de verschuldigde premie over een periode van twee volle kalendermaanden niet, niet volledig of niet tijdig
      wordt betaald; of
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83b
  - number: 83b.f
    text: |-
      indien niet langer wordt voldaan aan andere vereisten voor toelating tot de vrijwillige verzekering, bedoeld in
      [artikel 81, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel83b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: '84.1'
    text: |-
      De persoon, die om toelating tot de vrijwillige verzekering verzoekt, bepaalt bij de aanvang van de vrijwillige
      verzekering de hoogte van het dagloon, met dien verstande dat dit niet meer kan bedragen dan:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel84
  - number: 84.1.a
    text: |-
      het in [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref1] genoemde bedrag eventueel verhoogd
      of verlaagd krachtens [artikel 9][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel9a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002126
        artikel: 9a
  - number: 84.1.b
    text: |-
      het loon of het inkomen dat hij in geval van arbeidsongeschiktheid naar het oordeel van het Uitvoeringsinstituut
      werknemersverzekeringen derft.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel84
  - number: '84.2'
    text: De premie voor de vrijwillige verzekering wordt geheven over het in het eerste lid bedoelde dagloon.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel84
  - number: '84.3'
    text: |-
      De premie bedraagt een door het Uitvoeringsinstituut werknemersverzekeringen te bepalen percentage van
      het in het eerste lid bedoelde dagloon, met dien verstande dat de premie niet meer bedraagt dan de in
      [artikel 76][ref1] bedoelde basispremie, vermeerderd met een premie-opslag die wordt berekend op grond van het in
      [artikel 78, tweede lid, onderdeel ][ref2], bedoelde percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel76a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel78
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 76a
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '78'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '84.4'
    text: |-
      De uitkering op grond van de vrijwillige verzekering wordt tijdens de duur, bedoeld in [artikel 21][ref1], berekend
      naar het in het eerste lid bedoelde dagloon. Dit dagloon wordt eveneens in aanmerking genomen bij de berekening van
      het vervolgdagloon, bedoeld in [artikel 21][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel21b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 21a
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 21b
        hoofdstuk: II
        paragraaf: '1'
  - number: '85'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt nadere regels met betrekking tot de vrijwillige verzekering.
      Deze regels bevatten in ieder geval bepalingen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel85
  - number: 85.a
    text: de toelating tot de vrijwillige verzekering;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel85
  - number: 85.b
    text: het einde van de vrijwillige verzekering;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel85
  - number: 85.c
    text: de premie voor de vrijwillige verzekering;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel85
  - number: 85.d
    text: |-
      het dagloon, bedoeld in [artikel 84, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel84
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '84'
        hoofdstuk: VI
  - number: '86'
    text: |-
      Met betrekking tot het bepaalde bij of krachtens dit hoofdstuk zijn, met inachtneming van de wijzigingen, welke de
      aard van het onderwerp vordert, de bepalingen van de overige hoofdstukken en de ter uitvoering van die bepalingen
      genomen besluiten, voor zoveel nodig, van overeenkomstige toepassing, voor zover daarvan in het bij of krachtens
      dit hoofdstuk bepaalde niet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel86
  - number: 86a.1
    text: |-
      Onverminderd [artikel 87][ref1], worden de beschikkingen op grond van deze wet en de daarop berustende bepalingen
      gegeven binnen een redelijke termijn na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel87
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel86a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 86a.2
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel86a
  - number: 86a.3
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel86a
  - number: 86a.4
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen acht weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel86a
  - number: '87.1'
    text: |-
      Een beschikking over verlenging van de wachttijd, bedoeld in [artikel 19, eerste lid][ref1], op grond van het
      zevende lid van dat artikel wordt gegeven binnen twee weken na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '87.2'
    text: |-
      Een beschikking over het verzekerd zijn op grond van deze wet, over de toekenning van een
      arbeidsongeschiktheidsuitkering, over voortzetting van een arbeidsongeschiktheidsuitkering als
      bedoeld in [artikel 34, derde lid][ref1], dan wel over herziening, intrekking of heropening van een
      arbeidsongeschiktheidsuitkering wordt gegeven binnen dertien weken na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
  - number: '87.3'
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het tweede lid advies is gevraagd aan een
      deskundige die niet onder verantwoordelijkheid van het Uitvoeringsinstituut werknemersverzekeringen werkzaam is
      en om die reden de beschikking niet binnen dertien weken gegeven kan worden, wordt die termijn verlengd met ten
      hoogste vier weken en wordt de aanvrager van deze verlenging schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel87
  - number: '87.4'
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het tweede lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen dertien weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel87
  - number: '87.5'
    text: |-
      Indien een beschikking als bedoeld in het tweede lid om andere dan de in het tweede en derde lid bedoelde redenen
      niet binnen dertien weken kan worden gegeven, wordt de aanvrager daarvan schriftelijk in kennis gesteld onder
      vermelding van een zo kort mogelijke termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel87
  - number: 87a
    text: |-
      In afwijking van [artikel 7:2 van de Algemene wet bestuursrecht][ref1] wordt de belanghebbende in een
      bezwaarschriftprocedure ten aanzien van een besluit inzake de premie die verschuldigd is op grond van deze wet op
      zijn verzoek gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 87b
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de behandeling van bezwaarschriften
      tegen besluiten, waaraan een medische of arbeidskundige beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel87b
  - number: 87c
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel87c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 87d
    text: |-
      Indien bezwaar wordt gemaakt tegen een besluit waaraan een medische of arbeidskundige beoordeling
      ten grondslag ligt, beslist het Uitvoeringsinstituut werknemersverzekeringen, in afwijking van
      [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1], binnen zeventien weken of, indien het advies
      vraagt aan een deskundige die niet onder zijn verantwoordelijkheid werkzaam is binnen eenentwintig weken, na
      ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel87d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 87e
    text: |-
      Het bezwaar of beroep van een werkgever tegen de in [artikel 75][ref1], bedoelde betaling danwel tegen de in
      [artikel 78, derde of vierde lid][ref2], bedoelde opslag of korting kan niet zijn gegrond op de grief, dat de
      arbeidsongeschiktheidsuitkering ten onrechte of tot een te hoog bedrag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel78
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel87e
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '78'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 87f.1
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van [artikel 1, derde tot en met zevende lid][ref1], en de daarop berustende
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel1
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel87f
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 87f.2
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen de uitspraken van de gerechtshoven
      inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats
      inneemt van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel87f
  - number: 87g.1
    text: |-
      Indien voor degene, die door het Uitvoeringsinstituut werknemersverzekeringen als werknemer als bedoeld in
      [artikel 3, eerste lid][ref1], wordt aangemerkt, ten tijde van het bestaan van de arbeidsverhouding een beschikking
      geldt als bedoeld in [artikel 4a van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] waarin
      hij met betrekking tot de verrichte soort van werkzaamheden wordt aangemerkt als zelfstandige als bedoeld in
      [artikel 4 van die wet][ref3], dient, indien de belanghebbende zich in rechte op die beschikking beroept, het
      Uitvoeringsinstituut werknemersverzekeringen te bewijzen dat betrokkene in privaatrechtelijke of publiekrechtelijke
      dienstbetrekking staat.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel4
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel87g
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '4'
  - number: 87g.2
    text: |-
      Indien degene, die door het Uitvoeringsinstituut werknemersverzekeringen wordt aangemerkt als werkgever van
      de werknemer, bedoeld in het eerste lid, zich in verband met de toepassing van [hoofdstuk IIIA][ref1] of
      [hoofdstuk IV][ref2] in rechte erop beroept, dat het hem ten tijde van het bestaan van de dienstbetrekking niet
      redelijkerwijs duidelijk kan zijn dat deze tot hem in een privaatrechtelijke of publiekrechtelijke dienstbetrekking
      staat, dient het Uitvoeringsinstituut werknemersverzekeringen te bewijzen dat dat hem ten tijde van het bestaan van
      de dienstbetrekking wel redelijkerwijs duidelijk kan zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukIIIA
      [ref2]: https://wetten.overheid.nl/BWBR0002524#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel87g
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002524
        hoofdstuk: IV
  - number: '88'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88
  - number: 88.a
    text: 'medisch besluit: een besluit, waaraan een beoordeling van medische gegevens ten grondslag ligt;'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88
  - number: 88.b
    text: 'werknemer: degene, op wiens medische gegevens de beoordeling betrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88
  - number: 88.c
    text: 'de werkgever: de belanghebbende bij een medisch besluit, die niet de werknemer is.'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88
  - number: 88a.1
    text: |-
      De werkgever heeft slechts recht op inzage in, dan wel kennisname of toezending van enig stuk dat medische gegevens
      bevat, indien de werknemer hiervoor toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88a
  - number: 88a.2
    text: De toestemming wordt schriftelijk gegeven.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88a
  - number: 88a.3
    text: De toestemming kan te allen tijde schriftelijk worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88a
  - number: 88a.4
    text: Tijdens het horen in bezwaar of ter zitting van de rechtbank kan de toestemming ook mondeling worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88a
  - number: 88b
    text: |-
      De [artikelen 88][ref1] en [88][ref2] zijn, voor zover nodig in afwijking van de
      [Algemene wet bestuursrecht][ref3], van toepassing, indien de in [artikel 88][ref4] bedoelde toestemming niet is
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel88c
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel88d
      [ref3]: https://wetten.overheid.nl/BWBR0005537
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel88a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 88c
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 88d
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005537
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 88a
        hoofdstuk: VII
        paragraaf: '2'
  - number: 88c.1
    text: |-
      Inzage in, dan wel kennisname of toezending van enig stuk, dat medische gegevens bevat, is voorbehouden aan een
      gemachtigde van de werkgever, die arts is.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88c
  - number: 88c.2
    text: 'De gemachtigde, die arts is, treedt in de plaats van de werkgever bij:'
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88c
  - number: 88c.2.a
    text: de voorbereiding van een medisch besluit;
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88c
  - number: 88c.2.b
    text: het opstellen van een bezwaar- of beroepschrift; en
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88c
  - number: 88c.2.c
    text: de behandeling van een bezwaar of beroep; voor zover betrekking hebbend op medische gegevens.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88c
  - number: 88d.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen vermeldt de motivering van een medisch besluit, voor zover
      betrekking hebbend op medische gegevens, op een aparte bijlage.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88d
  - number: 88d.2
    text: De bijlage wordt niet aan de werkgever verstrekt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88d
  - number: 88d.3
    text: Desgevraagd wordt de bijlage verstrekt aan de gemachtigde van de werkgever, die arts is.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88d
  - number: 88d.4
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing op een rapport of een advies van een arts of een
      psycholoog, waarnaar bij de motivering van een medisch besluit wordt verwezen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88d
  - number: 88e
    text: |-
      Bij de bekendmaking van een medisch besluit wordt gewezen op de [artikelen 88][ref1] en [88][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel88a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel88f
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88e
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 88a
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 88f
        hoofdstuk: VII
        paragraaf: '2'
  - number: 88f
    text: |-
      In afwijking van [artikel 6:5 van de Algemene wet bestuursrecht][ref1] worden de gronden van het bezwaar en beroep,
      die betrekking hebben op medische gegevens, op een aparte bijlage vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 88g
    text: |-
      De [artikelen 7:4, zesde lid][ref1], [8:29][ref2] en [8:32, tweede lid, van de Algemene wet bestuursrecht][ref3]
      zijn niet van toepassing op stukken of inlichtingen die medische gegevens bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 88h.1
    text: |-
      In afwijking van [artikel 8:62 van de Algemene wet bestuursrecht][ref1] vindt het onderzoek ter zitting, voor zover
      betrekking hebbend op medische gegevens, met gesloten deuren plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 88h.2
    text: |-
      In de uitnodiging als bedoeld in [artikel 8:56 van de Algemene wet bestuursrecht][ref1] wordt mededeling gedaan van
      het bepaalde in het vorige lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 88i
    text: |-
      De toepassing van de [artikelen 8:81][ref1] tot en met [8:88 van de Algemene wet bestuursrecht][ref2], alsmede
      de behandeling van het hoger beroep als bedoeld in [artikel 18 Beroepswet][ref3] geschiedt voor zover nodig met
      inachtneming van deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002170#Artikel18
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel88i
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002170
        artikel: '18'
  - number: '89'
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de verzekerde naar burgerlijk recht aanspraak kan maken ter
      zake van zijn arbeidsongeschiktheid, houdt de rechter rekening met de aanspraken, die hij krachtens deze wet heeft.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel89
  - number: '90.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft voor de krachtens deze wet gemaakte kosten verhaal op
      degene, die in verband met het veroorzaken van arbeidsongeschiktheid jegens de verzekerde naar burgerlijk recht tot
      schadevergoeding is verplicht, doch ten hoogste tot het bedrag, waarvoor deze bij het ontbreken van de aanspraken
      krachtens deze wet naar burgerlijk recht aansprakelijk zou zijn, verminderd met een bedrag, gelijk aan dat van
      de schadevergoeding tot betaling waarvan de aansprakelijke persoon jegens de verzekerde naar burgerlijk recht is
      gehouden.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel90
  - number: '90.2'
    text: |-
      Overeenkomstig door Onze Minister te stellen regelen kan het Uitvoeringsinstituut werknemersverzekeringen in plaats
      van het bedrag der periodieke verstrekkingen de contante waarde daarvan vorderen.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel90
  - number: '90.3'
    text: |-
      De eigen risicodrager treedt voor de toepassing van het eerste en het tweede lid in de plaats
      van het Uitvoeringsinstituut werknemersverzekeringen voorzover hij het risico van de betaling van
      arbeidsongeschiktheidsuitkering draagt.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel90
  - number: '91.1'
    text: |-
      Het bepaalde in het [vorige artikel][ref1] geldt ten aanzien van de naar burgerlijk recht tot schadevergoeding
      verplichte werkgever van de verzekerde, onderscheidenlijk ten aanzien van de naar burgerlijk recht tot
      schadevergoeding verplichte verzekerde, die in dienstbetrekking staat tot dezelfde werkgever als de verzekerde
      jegens wie naar burgerlijk recht verplichting tot schadevergoeding bestaat, slechts indien de arbeidsongeschiktheid
      is te wijten aan opzet of bewuste roekeloosheid van die werkgever onderscheidenlijk verzekerde.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel90
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '90'
        hoofdstuk: VIII
  - number: '91.2'
    text: |-
      Voor de toepassing van het vorige lid wordt mede als werkgever beschouwd degene, die krachtens het bepaalde bij
      het eerste lid van [artikel 16][ref1] mede als werkgever wordt beschouwd, ongeacht de bij het tweede lid van dat
      artikel bedoelde uitzonderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel16a
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: 16a
  - number: 91a.1
    text: |-
      [Artikel 79b, eerste lid][ref1], is niet van toepassing indien de dienstbetrekking is aangegaan voor 1 januari
      2002.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel79b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 79b
        hoofdstuk: IV
        paragraaf: '4'
  - number: 91a.2
    text: |-
      [Artikel 79b][ref1], tweede lid is niet van toepassing indien de werknemer voor 1 januari 2002 zijn eigen arbeid
      of een andere functie bij dezelfde werkgever geheel of gedeeltelijk heeft hervat dan wel indien diens arbeidsplaats
      voor die datum is aangepast tot behoud, herstel of ter bevordering van de mogelijkheden tot het verrichten van
      arbeid van die werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel79b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 79b
        hoofdstuk: IV
        paragraaf: '4'
  - number: 91a.3
    text: |-
      Zo nodig in afwijking van [artikel 79a, eerste lid][ref1], of [artikel 79b][ref2], eerste, tweede en derde lid,
      kan het bedrag dat in mindering wordt gebracht op de door de werkgever verschuldigde premie en de premiekorting met
      betrekking tot het jaar 2002, in 2003 worden vastgesteld. Bij ministeriële regeling kunnen met betrekking tot dit
      lid nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel79a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel79b
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 79a
        hoofdstuk: IV
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 79b
        hoofdstuk: IV
        paragraaf: '4'
  - number: 91b.1
    text: |-
      Ten aanzien van de persoon wiens eerste dag van arbeidsongeschiktheid is gelegen voor 1 januari 2004 blijven de
      [artikelen 19][ref1], [34][ref2], [75a][ref3] en [76f][ref4] van toepassing zoals deze luidden op 31 december 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel76f
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel91b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 76f
        hoofdstuk: IV
        paragraaf: '1'
  - number: 91b.2
    text: |-
      Indien de arbeidsongeschiktheidsuitkering wordt herzien in verband met een voor 1 januari 2004 ingetreden toeneming
      van de arbeidsongeschiktheid, zijn de [artikelen 37][ref1], [40][ref2] en [41][ref3] van toepassing, zoals deze
      luidden op 31 december 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel41
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel91b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '37'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '40'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '41'
        hoofdstuk: II
        paragraaf: '2'
  - number: 91b.3
    text: |-
      Voor de toepassing van het eerste en tweede lid worden perioden van ongeschiktheid tot werken geacht eenzelfde,
      niet onderbroken periode van ongeschiktheid te vormen, indien zij elkaar met een onderbreking van minder dan
      vier weken opvolgen. Bij de vaststelling van de periode van vier weken blijven perioden, waarin zwangerschaps- of
      bevallingsverlof wordt genoten overeenkomstig [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1],
      buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel91b
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '92.1'
    text: |-
      Hij die niet voldoet aan de verplichting, omschreven in [artikel 12][ref1], wordt gestraft met hechtenis van ten
      hoogste een maand of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel12
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '12'
        hoofdstuk: I
        paragraaf: '3'
  - number: '92.2'
    text: |-
      Met gelijke straf wordt gestraft hij, die door hem krachtens deze wet betaalde of verschuldigde premie inhoudt op
      het loon van of op enige andere wijze verhaalt op een werknemer of gewezen werknemer, zonder dat dit bij deze wet
      is toegestaan.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel92
  - number: '96'
    text: |-
      Overtreding van bepalingen van een krachtens deze wet uitgevaardigde algemene maatregel van bestuur, voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel96
  - number: '97'
    text: |-
      Het recht tot strafvordering vervalt indien het Uitvoeringsinstituut werknemersverzekeringen aan de belanghebbende
      ter zake van hetzelfde feit reeds een boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel97
  - number: '98'
    text: |-
      De in [artikelen 92][ref1] en [96][ref2] bedoelde strafbare feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel96
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '92'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '96'
        hoofdstuk: IX
  - number: 98a.1
    text: |-
      Een overeenkomst met betrekking tot de verzekering van geldelijke gevolgen van langdurige arbeidsongeschiktheid,
      gesloten door degene, die verplicht verzekerd wordt, vervalt met ingang van de dag, waarop de verzekeraar van de
      verzekerde mededeling van het verplicht verzekerd worden ontvangt, voor zover aan de overeenkomst rechten kunnen
      worden ontleend, gelijkwaardig aan die, welke uit de in deze wet geregelde verplichte verzekering voortvloeien.
      Bereikt deze mededeling de verzekeraar vóór de dag, waarop de betrokkene verplicht verzekerd wordt, dan vervalt de
      overeenkomst met ingang van die dag.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel98a
  - number: 98a.2
    text: |-
      De premie, welke degene, wiens verzekering krachtens het bepaalde in het eerste lid geheel of gedeeltelijk
      is vervallen, heeft vooruitbetaald, wordt door de verzekeraar al naar gelang van het vervallen gedeelte
      der overeenkomst terugbetaald, onder aftrek van ten hoogste 25 procent van het terug te betalen bedrag voor
      administratiekosten.
    url: https://wetten.overheid.nl/BWBR0002524/2004-03-01#Artikel98a
  - number: 98b
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de termijnen, gesteld in de
      [artikelen 6, tweede lid, onder a en c][ref2], [17, eerste lid][ref3], [19, tweede en derde lid][ref4],
      [21a][ref5], [38][ref6], [39, eerste lid][ref7], [39a][ref8], [43a][ref9],
      [47, eerste, tweede, derde en vierde lid][ref10], en [53][ref11].


