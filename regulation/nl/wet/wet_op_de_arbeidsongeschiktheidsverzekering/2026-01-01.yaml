  - number: '29'
    text: |-
      1 Een maatregel als bedoeld in [artikel 25][ref1] of [28][ref2] wordt afgestemd op de ernst van de gedraging en
      de mate waarin de belanghebbende de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in elk
      geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een maatregel als bedoeld
      in [artikel 28][ref3] en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet tijdig
      nakomen van de verplichting, bedoeld in [artikel 80][ref4], indien het niet tijdig nakomen van de verplichting
      niet heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering, of ter zake van het zich
      niet houden aan de voorschriften, bedoeld in [artikel 34, derde lid][ref5], of in [artikel 34a, eerste lid][ref6],
      tenzij het niet tijdig nakomen van de verplichting of het zich niet houden aan de voorschriften plaatsvindt binnen
      een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de belanghebbende een zodanige waarschuwing
      is gegeven.

      3 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een maatregel indien daarvoor
      dringende redenen aanwezig zijn.

      4 Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als
      bedoeld in [artikel 29a][ref7] wordt opgelegd.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste lid.


