  - number: 47a
    text: |-
      1 De persoon, wiens arbeidsongeschiktheidsuitkering op grond van [artikel 43b, eerste lid][ref1], is ingetrokken,
      heeft vanaf de dag:

      a. dat hij in Nederland woont; of

      b. waarop een verdrag in werking is getreden dan wel een besluit van een volkenrechtelijke organisatie van kracht
      is geworden in het land waar betrokkene woont, op grond waarvan recht op arbeidsongeschiktheidsuitkering kan
      bestaan;

      met inachtneming van de bepalingen van de wet aanspraak op heropening van de arbeidsongeschiktheidsuitkering,
      indien hij op die dag arbeidsongeschikt is.

      2 Aanspraak op heropening van de arbeidsongeschiktheidsuitkering heeft eveneens de persoon, bedoeld in het eerste
      lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval is
      binnen vier weken na afloop van dat tijdvak.

      3 De [artikelen 19, vierde lid][ref2], [35][ref3] en [47, achtste lid][ref4], zijn van overeenkomstige toepassing
      met betrekking tot de aanspraak op heropening van de arbeidsongeschiktheidsuitkering, bedoeld in dit artikel.


