  - number: '44'
    text: |-
      1 Indien degene, die recht heeft op een arbeidsongeschiktheidsuitkering, inkomen geniet doordat hij arbeid is gaan
      verrichten, wordt die arbeid gedurende een aaneengesloten tijdvak van vijf jaar niet aangemerkt als arbeid als
      bedoeld in [artikel 18, vijfde lid][ref1], en wordt de arbeidsongeschiktheidsuitkering niet ingetrokken of herzien,
      doch wordt de uitkering:

      a. niet uitbetaald indien het inkomen zodanig is, dat als die arbeid wel de in [artikel 18, vijfde lid][ref2],
      bedoelde arbeid zou zijn, niet langer sprake zou zijn van een arbeidsongeschiktheid van ten minste 15%; of

      b. indien het bepaalde onder a niet van toepassing is, uitbetaald tot een bedrag ter grootte van
      de arbeidsongeschiktheidsuitkering, zoals deze zou zijn vastgesteld, indien die arbeid wel de in
      [artikel 18, vijfde lid][ref3], bedoelde arbeid zou zijn.

      Na afloop van het in de aanhef genoemde tijdvak wordt de arbeid aangemerkt als arbeid als bedoeld in
      [artikel 18, vijfde lid][ref4].

      2 Indien degene die recht heeft op een arbeidsongeschiktheidsuitkering in dienstbetrekking arbeid als bedoeld in
      het eerste lid verricht of heeft verricht, wordt het loon geacht te zijn genoten in het aangiftetijdvak waarover de
      werkgever of de inhoudingsplichtige van dat loon opgave heeft gedaan.

      3 Het in het eerste lid, aanhef, genoemde tijdvak van vijf jaar vangt aan op de eerste dag waarop het eerste
      lid, onderdeel a of b, is toegepast. Indien diegene die recht heeft op een arbeidsongeschiktheidsuitkering en ten
      aanzien van wie het eerste lid, onderdeel a of b, is toegepast andere arbeid gaat verrichten, dan vangt een nieuw
      tijdvak als bedoeld in het eerste lid aan op de eerste dag dat de arbeidsongeschiktheidsuitkering vanwege het
      verrichten van die andere arbeid wordt vastgesteld door toepassing van het eerste lid, onderdeel a of b.

      4 Indien op de laatste dag van het in het eerste lid genoemde tijdvak van vijf jaar inkomen wordt genoten, maar
      geen arbeid wordt verricht, wordt dit tijdvak verlengd tot en met de laatste dag waarop dat inkomen wordt genoten.

      5 Indien degene, die recht heeft op een arbeidsongeschiktheidsuitkering, inkomen geniet, dat
      bestaat uit loon ingevolge een arbeidsovereenkomst als bedoeld in de [hoofdstukken 2][ref5] en
      [3 van de Wet sociale werkvoorziening][ref6], is het eerste lid voor onbeperkte duur van toepassing.

      6 Onze Minister kan bepalen dat het eerste lid voor onbeperkte duur toepassing vindt ten aanzien van bepaalde
      groepen personen.

      7 Bij ministeriële regeling worden regels gesteld met betrekking tot het eerste lid. Deze regels hebben in elk
      geval betrekking op de gevallen waarin het eerste lid buiten toepassing blijft.

      8 Bij ministeriële regeling wordt bepaald wat onder inkomen en loon als bedoeld in dit artikel wordt verstaan.
      Daarbij kan tevens worden bepaald dat nader te bepalen inkomen dat gedeeltelijk, niet, of niet langer wordt genoten
      als gevolg van gewijzigde omstandigheden of enig handelen of nalaten van betrokkene in aanmerking wordt genomen
      alsof het wel volledig wordt genoten.

      9 Bij de bepaling van de mate van arbeidsongeschiktheid, bedoeld in het eerste lid, kan loon niet meer dan eenmaal
      in aanmerking worden genomen.


