        hoofdstuk: VI
  - number: '86'
    text: |-
      Met betrekking tot het bepaalde bij of krachtens dit hoofdstuk zijn, met inachtneming van de wijzigingen, welke de
      aard van het onderwerp vordert, de bepalingen van de overige hoofdstukken en de ter uitvoering van die bepalingen
      genomen besluiten, voor zoveel nodig, van overeenkomstige toepassing, voor zover daarvan in het bij of krachtens
      dit hoofdstuk bepaalde niet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel86
  - number: 86a
    text: |-
      In afwijking van [artikel 1:2 van de Algemene wet bestuursrecht][ref1] is de werkgever geen belanghebbende bij
      een besluit van het Uitvoeringsinstituut werknemersverzekeringen over het verzekerd zijn op grond van deze wet als
      bedoeld in [artikel 87, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel87
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel86a
    references:
