  - number: 19a
    text: |-
      1 De verzekerde, bedoeld in [artikel 19][ref1], heeft geen recht op toekenning van arbeidsongeschiktheidsuitkering
      indien de dag waarop het recht op arbeidsongeschiktheidsuitkering zou ingaan dan wel de dag na afloop van de
      toepassing van [artikel 19b][ref2] met betrekking tot dat recht op uitkering, is gelegen in een periode dat hem
      rechtens zijn vrijheid is ontnomen.

      2 De persoon, die op grond van het eerste lid geen recht op toekenning van arbeidsongeschiktheidsuitkering
      heeft alsmede de persoon die voor 1 januari 2004 arbeidsongeschikt is, maar op grond van
      [artikel 19b van de Ziektewet][ref3] geen recht heeft op ziekengeld, wordt vanaf de dag dat hij in vrijheid wordt
      gesteld weer als verzekerde aangemerkt en heeft met inachtneming van de bepalingen van deze wet recht op toekenning
      van arbeidsongeschiktheidsuitkering, indien hij op die dag arbeidsongeschikt is. [Artikel 19, vierde lid][ref4],
      is van overeenkomstige toepassing. De [artikelen 18, tweede tot en met vierde lid][ref5], en
      [30, eerste lid, onderdeel a][ref6] zijn niet van toepassing, behoudens voorzover het betreft de op de dag
      voorafgaande aan de eerste dag dat die persoon rechtens zijn vrijheid is ontnomen aanwezige arbeidsongeschiktheid
      in de zin van [artikel 18, eerste lid][ref7].

      3 Voor de toepassing van het eerste lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met
      een onderbreking van minder dan vier weken opvolgen.

      4 De persoon, bedoeld in het tweede lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch
      ten aanzien van wie dit wel het geval is binnen vier weken na die dag, wordt vanaf de dag dat hij in vrijheid
      is gesteld weer als verzekerde aangemerkt en heeft met inachtneming van de bepalingen van deze wet recht op
      toekenning van arbeidsongeschiktheidsuitkering. [Artikel 19, vierde lid][ref8], is van overeenkomstige toepassing.
      [Artikel 30, eerste lid, onderdeel b][ref9], is niet van toepassing.

      5 Het eerste lid is niet van toepassing en het tweede en vierde lid zijn van overeenkomstige toepassing op bij
      algemene maatregel van bestuur aan te wijzen categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf
      of vrijheidsbenemende maatregel buiten een justitiële inrichting plaatsvindt.


