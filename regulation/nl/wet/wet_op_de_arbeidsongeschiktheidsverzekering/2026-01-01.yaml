        artikel: 10a
  - number: 65l
    text: |-
      1 De persoon die op 1 juli van het kalenderjaar recht heeft op een arbeidsongeschiktheidsuitkering op grond van
      deze wet bij een arbeidsongeschiktheid van 35% of meer heeft recht op een tegemoetkoming.

      2 De persoon, bedoeld in het eerste lid, ontvangt per kalenderjaar een tegemoetkoming van € 226,28.

      3 Het bedrag, genoemd in het tweede lid, wordt jaarlijks per 1 januari gewijzigd overeenkomstig de
      tabelcorrectiefactor, bedoeld in [artikel 10.2 van de Wet inkomstenbelasting 2001][ref1]. Het gewijzigde bedrag
      wordt door of namens Onze Minister medegedeeld in de Staatscourant.

      4 In afwijking van het derde lid kan het bedrag, genoemd in het tweede lid, bij algemene maatregel van bestuur met
      ingang van een bij die maatregel aan te geven datum worden vervangen door een ander bedrag.

      5 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt de tegemoetkoming ambtshalve in het derde kwartaal van
      het kalenderjaar.

      6 De tegemoetkoming is niet vatbaar voor beslag.

      7 De tegemoetkoming blijft buiten beschouwing bij de verlening van op het inkomen of vermogen afgestemde
      publiekrechtelijke uitkeringen en verstrekkingen.

      8 De tegemoetkoming is niet vatbaar voor terugvordering of verrekening met openstaande vorderingen in verband met
      een uitkering op grond van deze wet.

      9 De tegemoetkoming wordt slecht één keer uitgekeerd in het geval er tevens aanspraak gemaakt kan worden op de
      tegemoetkoming op grond van [artikelen 63a van de Wet werk en inkomen naar arbeidsvermogen](onbekend), [67i van
      de Wet arbeidsongeschiktheidsverzekering zelfstandigen](onbekend) of [3:75 van de Wet werk en arbeidsondersteuning
      jonggehandicapten](onbekend).

      10 De tegemoetkoming en de daarmee gepaard gaande beheerskosten komen ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10.2
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel65l
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10.2'
  - number: '66'
    text: De verzekerde is verzekerd bij het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel66
  - number: '67'
    text: |-
      Voor de toepassing van deze wet gelden aaneensluitende verzekeringen bij het Uitvoeringsinstituut
      werknemersverzekeringen als één verzekering.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel67
  - number: 71a
    text: |-
      1 De werkgever jegens wie de verzekerde, bij ongeschiktheid tot het verrichten van arbeid wegens ziekte, recht
      heeft op loon als bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1] dan wel aanspraak heeft op
      bezoldiging op grond van [artikel 76a, eerste lid, van de Ziektewet][ref2] houdt aantekening van het verloop van de
      arbeidsongeschiktheid en de reïntegratie van de verzekerde.

      2 De werkgever, bedoeld in het eerste lid, stelt binnen een door Onze Minister nader te bepalen termijn, in
      overeenstemming met de verzekerde een plan van aanpak op. De afspraken die in het plan van aanpak zijn gemaakt
      worden door werkgever en verzekerde nageleefd. Het plan van aanpak wordt periodiek geëvalueerd.

      3 Uiterlijk twee weken voordat de termijn is verstreken waarbinnen de belanghebbende op grond van
      [artikel 34, derde lid, eerste volzin][ref3], zijn aanvraag voor toekenning van de arbeidsongeschiktheidsuitkering
      dient te doen stelt de werkgever, bedoeld in het eerste lid, in overleg met de verzekerde een reïntegratieverslag
      op en verstrekt de werkgever hiervan een afschrift aan de verzekerde.

      4 Indien [artikel 19, zevende lid][ref4], toepassing heeft gevonden:

      a. stelt de werkgever in overleg met de verzekerde, indien hij nog geen reïntegratieverslag heeft opgesteld,
      in afwijking van het derde lid, het reïntegratieverslag uiterlijk 14 weken voor het verstrijken van
      de door het Uitvoeringsinstituut werknemersverzekeringen vastgestelde verlengde wachttijd, bedoeld in
      [artikel 19, zevende lid][ref5], op en verstrekt een afschrift daarvan aan de verzekerde;

      b. vult de werkgever in overleg met de verzekerde, indien hij reeds een reïntegratieverslag heeft opgesteld
      dit reïntegratieverslag uiterlijk 14 weken voor het verstrijken van de door het Uitvoeringsinstituut
      werknemersverzekeringen vastgestelde verlengde wachttijd, bedoeld in [artikel 19, zevende lid][ref6], aan en
      verstrekt een afschrift daarvan aan de verzekerde, tenzij de verzekerde verzoekt dit, in verband met het doen van
      een aanvraag als bedoeld in [artikel 34, derde lid][ref7], eerder te doen. De werkgever komt binnen twee weken aan
      dit verzoek tegemoet. Dit lid is van overeenkomstige toepassing bij een aanvraag voor de uitkering na toepassing
      van [artikel 34a, tweede lid][ref8].

      5 Bij de uitvoering van het eerste tot en met het vierde lid laat de werkgever zich bijstaan door een persoon,
      als bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref9] die belast is met de bijstand,
      bedoeld in [artikel 14, eerste lid, onderdeel b, van die wet][ref10] of een arbodienst als bedoeld in de
      [Arbeidsomstandighedenwet][ref11].

      6 De verzekerde verleent zijn medewerking bij het opstellen van het plan van aanpak en het opstellen van het
      reïntegratieverslag.

      7 Bij ministeriële regeling kunnen regels met betrekking tot het eerste tot en met zesde lid worden gesteld.

      8 Indien bij de behandeling van de aanvraag, bedoeld in [artikel 34, derde lid][ref12], blijkt dat de werkgever
      zijn verplichting om een reïntegratieverslag op te stellen niet of niet volledig is nagekomen, stelt het
      Uitvoeringsinstituut werknemersverzekeringen aan de werkgever een termijn waarbinnen het reïntegratieverslag wordt
      verstrekt of aangevuld.

      9 Indien bij de behandeling van de aanvraag, bedoeld in [artikel 34, derde lid][ref13], en de beoordeling als
      bedoeld in [artikel 34a][ref14] blijkt dat de werkgever zonder deugdelijke grond zijn verplichtingen op grond
      van het eerste, tweede, derde, vierde of vijfde lid dan wel de krachtens het zevende lid gestelde regels niet
      of niet volledig nakomt of onvoldoende reïntegratie-inspanningen heeft verricht stelt het Uitvoeringsinstituut
      werknemersverzekeringen een tijdvak vast, gedurende welke de verzekerde jegens die werkgever recht op loon heeft op
      grond van [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref15] dan wel aanspraak op bezoldiging op grond van
      [artikel 76a, eerste lid, van de Ziektewet][ref16].

      Dit tijdvak is ten hoogste 52 weken en wordt afgestemd op de periode die nodig wordt geacht om alsnog voldoende
      reïntegratie-inspanningen te leveren.

      10 Bij of krachtens algemene maatregel van bestuur kunnen voor de toepassing van het negende lid nadere regels
      worden gesteld.


