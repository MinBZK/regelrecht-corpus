  - number: '38'
    text: |-
      1 Terzake van toeneming van arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering,
      berekend naar een arbeidsongeschiktheid van ten minste 45%, onverminderd [artikel 39][ref1], plaats zodra de
      toegenomen arbeidsongeschiktheid onafgebroken vier weken heeft geduurd.

      2 Indien de arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45%, doch
      minder dan 80%, wegens afneming van de arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder
      dan 45%, doch binnen vier weken na de dag, met ingang waarvan die uitkering is herzien, de arbeidsongeschiktheid
      weer toeneemt, is het eerste lid van toepassing, onder afwijking van [artikel 37][ref2].

      3 Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste lid, worden perioden van
      toegenomen arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan
      vier weken opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering
      in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref3], [3:8][ref4] of
      [3:10, eerste lid, van de Wet arbeid en zorg][ref5] wordt genoten, tenzij de ongeschiktheid redelijkerwijs
      niet geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de vaststelling van de eerstgenoemde periode
      van vier weken blijven perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van
      [artikel 3:7, eerste lid][ref6], [3:8][ref7], of [3:10, eerste lid, van de Wet arbeid en zorg][ref8] wordt genoten,
      buiten beschouwing.


