  - number: 91h
    text: |-
      In gedingen aangevangen voor het van toepassing worden van [artikel 90, vierde lid][ref1], bepaalt de rechter
      op verzoek van een van de partijen of ambtshalve een termijn waarbinnen partijen de gelegenheid wordt geboden
      hun stellingen en conclusies voor zover nodig aan te passen aan [artikel 90, vierde lid][ref2]. Stelt de rechter
      partijen tot een zodanige aanpassing in de gelegenheid, dan staat tegen die beslissing geen rechtsmiddel open;
      wijst de rechter een daartoe strekkend verzoek af, dan staat een rechtsmiddel daartegen slechts gelijktijdig met de
      einduitspraak open.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel90
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel91h
