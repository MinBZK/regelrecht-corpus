  - number: 39c
    text: |-
      1 Ter zake van toeneming van de arbeidsongeschiktheid vindt, in afwijking van de [artikelen 38][ref1], [39][ref2]
      en [39a][ref3], herziening plaats zodra de toegenomen arbeidsongeschiktheid 104 weken heeft geduurd, indien ter
      zake van deze toegenomen arbeidsongeschiktheid:

      a. recht bestaat op ziekengeld op grond van de [Ziektewet][ref4];

      b. uit hoofde van de dienstbetrekking op grond waarvan de werknemer arbeid behoort te verrichten recht bestaat op
      loon als bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref5], dan wel indien het recht op loon
      door toepassing van het derde, vijfde, zesde of negende lid van dat artikel geheel of gedeeltelijk ontbreekt; of

      c. recht bestaat op bezoldiging als bedoeld in [artikel 76a, eerste lid van de Ziektewet][ref6],
      dan wel indien het recht op die bezoldiging op grond van artikel 76a, derde of zevende lid, of
      [artikel 76b, eerste, tweede of derde lid van de Ziektewet][ref7] geheel of gedeeltelijk ontbreekt.

      2 Voor het bepalen van het tijdvak van 104 weken, bedoeld in het eerste lid, worden perioden van
      toegenomen arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan
      vier weken opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering
      in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref8], [3:8][ref9] of
      [3:10, eerste lid, van de Wet arbeid en zorg][ref10] wordt genoten, tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de vaststelling van het tijdvak van 104 weken blijven
      perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van artikel 3:7, eerste lid, 3:8, of
      3:10, eerste lid, van de Wet arbeid en zorg wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel38
