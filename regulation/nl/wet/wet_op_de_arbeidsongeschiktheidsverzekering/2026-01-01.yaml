  - number: 50a
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van een uitkering ingevolge deze wet op
      indien degene aan wie uitkering is toegekend een vreemdeling is die niet rechtmatig in Nederland verblijf houdt als
      bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref1].

      2 De betaling van een uitkering ingevolge deze wet wordt hervat indien betrokkene daartoe een aanvraag indient
      en het het Uitvoeringsinstituut werknemersverzekeringen is gebleken dat hij feitelijk buiten Nederland woont of
      verblijf houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
