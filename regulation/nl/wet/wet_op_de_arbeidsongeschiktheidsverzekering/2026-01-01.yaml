  - number: 71b
    text: |-
      1 In afwijking van [artikel 71a][ref1], is op het Uitvoeringsinstituut werknemersverzekeringen ten aanzien
      van de verzekerde die op grond van [artikel 29, tweede lid, onderdeel a, b, c of d, van de Ziektewet][ref2]
      recht heeft op ziekengeld, [artikel 71a, tweede tot en met het tiende lid][ref3] niet van toepassing en is
      [artikel 71a, eerste lid][ref4], van overeenkomstige toepassing. Het Uitvoeringsinstituut werknemersverzekeringen
      stelt, binnen een door Onze Minister nader te bepalen termijn, in overleg met die verzekerde, een plan van aanpak
      op. Het plan van aanpak wordt periodiek geëvalueerd.

      2 In afwijking van [artikel 71a][ref5], is [artikel 71a, vierde, achtste, negende en tiende lid][ref6],
      niet van toepassing op de werkgever, wiens verzekerde op grond van
      [artikel 29, tweede lid, onderdeel e, f of g , van de Ziektewet][ref7] dan wel op grond van
      [artikel 29a, eerste of vierde lid, van die wet][ref8] recht heeft op ziekengeld.

      3 In afwijking van het eerste lid is
      [artikel 71a, eerste, tweede, derde, vijfde, zesde, zevende en achtste lid][ref9], van overeenkomstige toepassing
      op de eigenrisicodrager, bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref10] ten aanzien van
      de personen, bedoeld in [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref11], die laatstelijk tot hem
      in dienstbetrekking stonden. Indien bij de behandeling van de aanvraag, bedoeld in [artikel 34, derde lid][ref12],
      en de beoordeling, bedoeld in [artikel 34a][ref13], blijkt dat de eigenrisicodrager, bedoeld in de eerste zin,
      zonder deugdelijke grond de uit die zin voortvloeiende verplichtingen dan wel de krachtens het zevende lid
      gestelde regels niet of niet volledig nakomt of onvoldoende reïntegratie-inspanningen heeft verricht stelt het
      Uitvoeringsinstituut werknemersverzekeringen een tijdvak vast, gedurende welke de persoon, bedoeld in de eerste
      zin, recht op ziekengeld heeft op grond van [artikel 29 van de Ziektewet][ref14]. Dit tijdvak is ten hoogste 52
      weken en wordt afgestemd op de aard en de ernst van het verzuim, alsmede op de periode die nodig wordt geacht om
      alsnog voldoende reïntegratie-inspanningen te leveren.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld voor de uitvoering van dit artikel.


