  - number: 65d
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen kan aan de verzekerde die recht heeft op een
      arbeidsongeschiktheidsuitkering, die arbeid als zelfstandige verricht of gaat verrichten, op aanvraag
      inkomenssuppletie toekennen, indien zijn inkomen uit het bedrijf of beroep lager is dan zijn resterende
      verdiencapaciteit.

      2 De inkomenssuppletie wordt verstrekt over perioden waarin het bedrijf of beroep wordt uitgeoefend, doch
      ten hoogste over een periode van vier jaar te rekenen vanaf de dag met ingang waarvan voor de eerste maal
      inkomenssuppletie is toegekend.

      3 De inkomenssuppletie wordt voor de toepassing van de wettelijke bepalingen inzake premieheffing aangemerkt als
      een uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1].

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de hoogte van de
      inkomenssuppletie.


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel65d
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 65f
    text: |-
      De verzekerde die recht heeft op een arbeidsongeschiktheidsuitkering, heeft recht op ondersteuning bij
      arbeidsinschakeling en, met inachtneming van de daarvoor geldende wettelijke bepalingen, op de naar het oordeel van
      het Uitvoeringsinstituut werknemersverzekeringen noodzakelijk geachte voorziening gericht op arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel65f
  - number: 65g
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen kan, in het kader van de bevordering van de inschakeling in de
      arbeid, toestemming verlenen aan de verzekerde die recht heeft op een arbeidsongeschiktheidsuitkering, om op een
      proefplaats bij een werkgever gedurende maximaal zes maanden onbeloonde werkzaamheden te verrichten.

      2 Tijdens het verrichten van werkzaamheden op een proefplaats als bedoeld in het eerste lid wordt de
      arbeidsongeschiktheidsuitkering niet ingetrokken of herzien.

      3 De onbeloonde werkzaamheden op een proefplaats als bedoeld in het eerste lid zijn:

      a. werkzaamheden, waartoe de verzekerde, bedoeld in het eerste lid, met zijn krachten en bekwaamheden in staat is;

      b. werkzaamheden, waarbij de werkgever, bij wie de proefplaatsing geschiedt, een aansprakelijkheidsverzekering ten
      behoeve van de verzekerde, bedoeld in het eerste lid, heeft afgesloten;

      c. werkzaamheden, die de verzekerde, bedoeld in het eerste lid, niet reeds eerder onbeloond op een proefplaats bij
      die werkgever of diens rechtsvoorganger heeft verricht; en

      d. werkzaamheden waarbij er, naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen, een reëel
      uitzicht is op een op de onbeloonde werkzaamheden aansluitende dienstbetrekking van dezelfde of grotere omvang voor
      ten minste 6 maanden.

      4 Indien de werkzaamheden, bedoeld in het eerste lid, wegens ziekte worden onderbroken, wordt de periode waarin een
      uitkering bij ziekte wordt ontvangen, voor de toepassing van dat lid buiten beschouwing gelaten.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel65g
  - number: 65h
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de aanvraag van loonsuppletie,
      bedoeld in [artikel 65c][ref1], van inkomenssuppletie, bedoeld in [artikel 65d][ref2], de termijn waarbinnen die
      aanvraag wordt ingediend, alsmede omtrent de rechtsgevolgen die aan overschrijding van die termijn zijn verbonden,
      en met betrekking tot de aanvraag en van toestemming als bedoeld in [artikel 65g][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel65c
