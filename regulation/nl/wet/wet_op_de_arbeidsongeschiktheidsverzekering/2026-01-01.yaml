  - number: '50'
    text: |-
      1 De arbeidsongeschiktheidsuitkering wordt betaalbaar gesteld door het Uitvoeringsinstituut
      werknemersverzekeringen. De betaling geschiedt als regel in termijnen van niet langer dan een maand.

      2 Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van de arbeidsongeschiktheidsuitkering op of
      schorst het de betaling, indien het op grond van duidelijke aanwijzingen van oordeel is of het gegronde vermoeden
      heeft dat:

      a. het recht op uitkering niet of niet meer bestaat;

      b. recht op een lagere uitkering bestaat;

      c. degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend of zijn wettelijke vertegenwoordiger een
      verplichting als bedoeld in [artikel 25][ref1], [28][ref2] of [80][ref3] niet of niet behoorlijk is nagekomen.

      3 Indien de arbeidsongeschiktheidsuitkering in het buitenland wordt uitbetaald, geschiedt de betaling in afwijking
      van [artikel 4:89, derde lid, van de Algemene wet bestuursrecht][ref4] op het tijdstip waarop de rekening van de
      daartoe door de schuldeiser aangewezen bank wordt gecrediteerd.

      4 Wanneer degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend, een ander machtigt om de uitkering in
      ontvangst te nemen, onderscheidenlijk een verleende machtiging intrekt, wordt daaraan gevolg gegeven met ingang van
      een betalingstermijn, aanvangende na de dag waarop de machtiging wordt ingediend, onderscheidenlijk waarop van haar
      intrekking mededeling wordt gedaan, doch niet later dan de eerste dag van de tweede maand na de dag van indiening
      onderscheidenlijk intrekking der machtiging.

      5 Onze Minister kan regelen vaststellen inzake de betaalbaarstelling van de arbeidsongeschiktheidsuitkering door
      organen, welke belast zijn met de uitbetaling van invaliditeitsuitkering of van pensioen uit anderen hoofde dan
      ingevolge deze wet.

      6 Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd om, onder door hem te stellen voorwaarden,
      op verzoek van de in het vorige lid bedoelde organen, gelijktijdig met de arbeidsongeschiktheidsuitkering,
      invaliditeitsuitkeringen of pensioenen, verschuldigd door die organen, betaalbaar te stellen.

      7 Het Uitvoeringsinstituut werknemersverzekeringen stelt regels omtrent de betaalbaarstelling van de
      arbeidsongeschiktheidsuitkering in gevallen waarin de verzekerde recht heeft op een arbeidsongeschiktheidsuitkering
      over een periode waarover hij tevens een uitkering op grond van de [Werkloosheidswet][ref5] ontvangt.

      8 Indien een reïntegratiebedrijf aan het Uitvoeringsinstituut werknemersverzekeringen heeft gemeld dat het
      gegronde vermoeden bestaat dat een persoon aan wie een uitkering op grond van deze wet is toegekend, onvoldoende
      medewerking verleent aan de op hem betrekking hebbende werkzaamheden van het reïntegratiebedrijf, neemt het
      Uitvoeringsinstituut werknemersverzekeringen een beschikking omtrent de gehele of gedeeltelijke opschorting of
      schorsing van de betaling van de uitkering aan die persoon voor de duur van ten hoogste acht weken.

      9 Het Uitvoeringsinstituut werknemersverzekeringen stelt het reïntegratiebedrijf in kennis van een beschikking tot
      opschorting of schorsing als bedoeld in het achtste lid.


