  - number: '48'
    text: |-
      1 De arbeidsongeschiktheidsuitkering wordt heropend door het Uitvoeringsinstituut werknemersverzekeringen.

      2 De heropende arbeidsongeschiktheidsuitkering wordt beschouwd als een voortzetting van de ingetrokken uitkering.
      Voor de toepassing van de [artikelen 38, derde lid][ref1], [39, eerste lid, onderdeel c][ref2], en [39a][ref3]
      wordt daarbij met herziening van de arbeidsongeschiktheidsuitkering wegens afneming van de arbeidsongeschiktheid
      gelijk gesteld intrekking van de arbeidsongeschiktheidsuitkering.

      3 Voor de berekening van de heropende arbeidsongeschiktheidsuitkering wordt als dagloon of vervolgdagloon beschouwd
      het dagloon of vervolgdagloon, waarnaar de ingetrokken uitkering op de dag van ingang van de heropende uitkering
      zou zijn berekend, indien de uitkering niet was ingetrokken, tenzij hernieuwde vaststelling van een dagloon
      overeenkomstig het bepaalde bij of krachtens [artikel 14][ref4] en met inachtneming van [artikel 15][ref5] tot
      een hoger dagloon of vervolgdagloon leidt, in welk geval de heropende uitkering aan de hand van dit dagloon of
      vervolgdagloon wordt berekend.


