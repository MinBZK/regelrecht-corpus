  - number: '16'
    text: |-
      1 De persoon die voor 1 januari 2004 arbeidsongeschikt is geworden en op het tijdstip waarop hij arbeidsongeschikt
      werd, verzekerd was op grond van de verplichte verzekering blijft verzekerd:

      a. gedurende de wachttijd, bedoeld in [artikel 19][ref1];

      b. gedurende vier weken na afloop van de wachttijd, bedoeld in [artikel 19][ref2], indien hij na afloop van die
      wachttijd minder dan 15% arbeidsongeschikt is, doch binnen die vier weken 15% of meer arbeidsongeschikt is;

      c. gedurende de periode waarover hij recht heeft op arbeidsongeschiktheidsuitkering.

      2 De persoon die arbeidsongeschikt is geworden en op het tijdstip waarop hij arbeidsongeschikt werd, verzekerd was
      op grond van de verplichte verzekering blijft verzekerd:

      a. gedurende vijf jaar na de intrekking, bedoeld in [artikel 43][ref3], indien [artikel 43a, eerste lid][ref4],
      geen toepassing vindt omdat [artikel 43a, vierde lid][ref5], van toepassing is;

      b. gedurende vijf jaar na het bereiken van het einde van de wachttijd, bedoeld in [artikel 19][ref6], na
      welke wachttijd hij ongeschikt was tot het verrichten van zijn arbeid wegens ziekte of gebreken, maar geen
      recht had op toekenning van een arbeidsongeschiktheidsuitkering omdat hij niet arbeidsongeschikt was, indien
      [artikel 43a, eerste lid][ref7], geen toepassing vindt omdat [artikel 43a, vierde lid][ref8], van toepassing is.


