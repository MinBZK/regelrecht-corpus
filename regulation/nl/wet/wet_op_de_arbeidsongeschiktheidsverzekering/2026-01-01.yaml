  - number: '88'
    text: |-
      Voor de toepassing van deze paragraaf wordt verstaan onder:

      a. medische beschikking: een beschikking waaraan een beoordeling van medische gegevens ten grondslag ligt;

      b. werknemer: de persoon op wiens medische gegevens de beoordeling betrekking heeft;

      c. werkgever: de belanghebbende bij een medische beschikking, die niet de werknemer is.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel88
  - number: 88b
    text: |-
      1 De inzage in, dan wel kennisname of toezending van stukken die medische gegevens bevatten, is behalve aan de
      werknemer voorbehouden aan een gemachtigde van de werkgever die advocaat of arts is dan wel daarvoor van het
      Uitvoeringsinstituut werknemersverzekeringen bijzondere toestemming heeft gekregen.

      2 De gemachtigde, bedoeld in het eerste lid, treedt in de plaats van de werkgever bij:

      a. de voorbereiding van een medische beschikking;

      b. het opstellen van een bezwaar- of beroepschrift; en

      c. de behandeling van een bezwaar;

      voorzover betrekking hebbend op medische gegevens.

      3 [Artikel 7:4, tweede, vierde en zesde lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing op
      stukken of inlichtingen die medische gegevens bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel74
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel88b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:4
  - number: 88c
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen vermeldt de motivering van een medische beschikking, voorzover
      betrekking hebbend op medische gegevens, in een aparte bijlage.

      2 De bijlage wordt behalve aan de werknemer uitsluitend verstrekt aan de gemachtigde van de werkgever, bedoeld
      in [artikel 88b][ref1].

      3 Het tweede lid is van overeenkomstige toepassing op een rapport of een advies van een arts of een psycholoog,
      waarnaar bij de motivering van een medische beschikking wordt verwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel88b
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel88c
