  - number: '35'
    text: |-
      1 De arbeidsongeschiktheidsuitkering gaat in op de dag, met ingang van welke de belanghebbende aan de vereisten
      voor het recht op toekenning van die uitkering voldoet.

      2 In afwijking van het bepaalde in het vorige lid kan de arbeidsongeschiktheidsuitkering niet vroeger ingaan dan
      een jaar vóór de dag, waarop de aanvraag werd ingediend. Het Uitvoeringsinstituut werknemersverzekeringen kan voor
      bijzondere gevallen van het bepaalde in de vorige volzin afwijken.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel35
  - number: '36'
    text: |-
      1 De arbeidsongeschiktheidsuitkering wordt herzien wanneer degene, aan wie zij is toegekend, ingevolge het bij of
      krachtens deze wet bepaalde voor een hogere of lagere uitkering in aanmerking komt.

      2 Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van de arbeidsongeschiktheidsuitkering
      plaats met inachtneming van het bepaalde in de [artikelen 37 tot en met 40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel37
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '37'
        hoofdstuk: II
        paragraaf: '2'
  - number: 36a
    text: |-
      1 Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een beschikking tot
      toekenning van arbeidsongeschiktheidsuitkering en terzake van weigering van een zodanige uitkering, herziet het
      Uitvoeringsinstituut werknemersverzekeringen een dergelijke beschikking of trekt hij die in:

      a. ter uitvoering van een beschikking als bedoeld in [artikel 30][ref1];

      b. indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 25][ref2], [28][ref3] of
      [80][ref4] heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering;

      c. indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend;

      d. indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 25][ref5], [28][ref6] of
      [80][ref7] ertoe leidt dat niet kan worden vastgesteld of nog recht op uitkering bestaat.

      2 Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van herziening of intrekking als bedoeld in het eerste lid af te zien.

      3 Een beschikking tot toekenning van loonsuppletie als bedoeld in [artikel 65c][ref8], of van inkomenssuppletie
      als bedoeld in [artikel 65d][ref9] wordt ingetrokken of herzien indien onderscheidenlijk de loonsuppletie, de
      inkomenssuppletie of de voorziening ten onrechte of tot een te hoog bedrag is vastgesteld.


