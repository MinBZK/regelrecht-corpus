        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 87b
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de behandeling van bezwaarschriften
      tegen beschikkingen waaraan een medische of arbeidskundige beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel87b
  - number: 87c
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken gerekend vanaf de dag na die waarop de termijn
      voor het indienen van het bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel710
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel87c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:10
  - number: 87d
    text: |-
      1 Indien bezwaar wordt gemaakt tegen een beschikking waaraan een medische of arbeidskundige beoordeling
      ten grondslag ligt, beslist het Uitvoeringsinstituut werknemersverzekeringen, in afwijking van
      [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1], binnen zeventien weken of, indien het advies
      vraagt aan een deskundige die niet onder zijn verantwoordelijkheid werkzaam is binnen eenentwintig weken, gerekend
      vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.

      2 Indien in verband met het geven van een beslissing op bezwaar een in het buitenland wonende persoon is opgeroepen
      en om die reden de beslissing op bezwaar niet binnen de in het eerste lid bedoelde termijn gegeven kan worden,
      wordt de beslissing, in afwijking van [artikel 7:10, derde lid, van de Algemene wet bestuursrecht][ref2], verdaagd
      met ten hoogste zes maanden en wordt de aanvrager van deze verdaging schriftelijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel710
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel710
