  - number: '51'
    text: |-
      Voor zover betreft het in ontvangst nemen van een uitkering ingevolge deze wet en het verlenen van kwijting
      voor de betaling daarvan, wordt een minderjarige met een meerderjarige gelijkgesteld. Indien de wettelijke
      vertegenwoordiger zich tegen de betaling aan de minderjarige schriftelijk verzet bij het Uitvoeringsinstituut
      werknemersverzekeringen geschiedt de uitbetaling aan de wettelijke vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel51
  - number: '52'
    text: |-
      1 Is van de aanvrager of ontvanger van een arbeidsongeschiktheidsuitkering bij het Uitvoeringsinstituut
      werknemersverzekeringen een adres in Nederland bekend, terwijl in de basisregistratie personen ambtshalve is
      opgenomen dat hij is vertrokken naar een onbekend land van verblijf, dan verzoekt het Uitvoeringsinstituut
      werknemersverzekeringen hem de afwijkende registratie in de basisregistratie personen binnen een redelijke termijn
      ongedaan te laten maken.

      2 Wanneer na afloop van deze termijn, de afwijkende registratie niet is beëindigd of als uit de basisregistratie
      personen niet blijkt dat het college van burgemeester en wethouders van de desbetreffende gemeente de gegevens over
      het adres in onderzoek heeft genomen, schort het Uitvoeringsinstituut werknemersverzekeringen de betaling van de
      uitkering aan de persoon, aan wie de arbeidsongeschiktheidsuitkering is toegekend, op.

      3 De opschorting wordt beëindigd zodra is vastgesteld dat de persoon, bedoeld in het tweede lid, in het buitenland
      woont of verblijft of dat een adres in Nederland in de basisregistratie personen is opgenomen.

      4 Indien het onderzoek van het college van burgemeester en wethouders is afgerond en de persoon, bedoeld in
      het tweede lid, in de basisregistratie personen ambtshalve opgenomen blijft met gegevens over het vertrek uit
      Nederland, schort het Uitvoeringsinstituut werknemersverzekeringen de betaling van de uitkering op tot verblijf in
      het buitenland kan worden vastgesteld of een adres in Nederland in de basisregistratie personen is opgenomen.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel52
  - number: '53'
    text: |-
      1 Na het overlijden van degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend, wordt met ingang van de
      dag na het overlijden, de arbeidsongeschiktheidsuitkering in de vorm van een overlijdensuitkering uitbetaald:

      a. aan de langstlevende van de echtgenoten;

      b. bij ontstentenis van de in onderdeel *a* bedoelde persoon, aan de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;

      c. bij ontstentenis van de in de onderdelen *a* en *b* bedoelde personen, aan degenen met wie de overledene in
      gezinsverband leefde.

      2 De overlijdensuitkering is gelijk aan het bedrag van de arbeidsongeschiktheidsuitkering over één maand, doch niet
      over de zaterdagen en zondagen, berekend naar de hoogte van die uitkering op de dag of laatstelijk voor de dag van
      overlijden, van degene aan wie die arbeidsongeschiktheidsuitkering is toegekend.

      3 In verband met het overlijden van degene aan wie een arbeidsongeschiktheidsuitkering is toegekend, is
      [artikel 49, eerste lid][ref1], niet van toepassing.

      4 De overlijdensuitkering wordt ambtshalve of op verzoek aan de rechthebbende of rechthebbenden genoemd in het
      eerste lid, door het Uitvoeringsinstituut werknemersverzekeringen uitbetaald.

      5 De overlijdensuitkering wordt in een bedrag ineens uitbetaald.

      6 Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan arbeidsongeschiktheidsuitkering dat,
      over na het overlijden gelegen dagen reeds is uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel49
