  - number: 87e
    text: |-
      Het bezwaar of beroep van een werkgever tegen de in
      [artikel 38, tweede of derde lid, van de Wet financiering sociale verzekeringen][ref1] bedoelde opslag of korting
      kan niet zijn gegrond op de grief, dat de arbeidsongeschiktheidsuitkering ten onrechte of tot een te hoog bedrag
      is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel87e
