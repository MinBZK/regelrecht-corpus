  - number: 91d
    text: |-
      1 Een beschikking tot toekenning van inkomenssuppletie op grond van
      [artikel 29 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] aan de
      persoon die op de dag voorafgaand aan de dag waarop dat artikel op grond van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref2] vervalt,
      recht had op een arbeidsongeschiktheidsuitkering, wordt voor de duur waarvoor die inkomenssuppletie was toegekend
      aangemerkt als een beschikking tot toekenning van inkomenssuppletie als bedoeld in [artikel 65d][ref3].

      2 Een beschikking tot toekenning van loonsuppletie op grond van
      [artikel 32 van de Wet op de (re)integratie arbeidsgehandicapten][ref4] aan
      de persoon die op dag voorafgaand aan de dag waarop dat artikel op grond van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref5] vervalt, recht
      had op een arbeidsongeschiktheidsuitkering, wordt voor de duur waarvoor die loonsuppletie was toegekend aangemerkt
      als een beschikking tot toekenning van loonsuppletie als bedoeld in [artikel 65c][ref6].

      3 De persoon wiens arbeidsongeschiktheidsuitkering is ingetrokken als
      gevolg van de toepassing van [artikel 34, vierde lid][ref7], van deze wet,
      [artikel 35, vijfde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8] of
      [artikel 3:28, vijfde lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref9], of de persoon,
      bedoeld in [artikel 2, derde lid, van het Besluit eenmalige herbeoordelingen arbeidsongeschiktheidswetten][ref10],
      wiens arbeidsongeschiktheidsuitkering is ingetrokken, wordt gedurende vijf jaar na de dag van intrekking van de
      arbeidsongeschiktheidsuitkering aangemerkt als verzekerde in de zin van [artikel 65c][ref11] en [65d][ref12].


