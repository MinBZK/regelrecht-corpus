  - number: 36b
    text: |-
      1 De intrekking of verlaging van een arbeidsongeschiktheidsuitkering, die voortvloeit uit het door de werkgever
      ingesteld bezwaar of beroep, vindt niet eerder plaats dan zes weken na de dag waarop de beslissing op bezwaar is
      bekendgemaakt of de uitspraak is gedaan. De eerste zin is van overeenkomstige toepassing in geval van intrekking
      van het bezwaar of beroep omdat het Uitvoeringsinstituut werknemersverzekeringen geheel of gedeeltelijk is tegemoet
      gekomen aan het bezwaar of beroep van de werkgever.

      2 Het eerste lid geldt niet, indien de uitkering door eigen schuld of toedoen van de verzekerde ten onrechte of tot
      een te hoog bedrag is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel36b
  - number: '37'
    text: |-
      1 Terzake van toeneming van arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering,
      berekend naar een arbeidsongeschiktheid van minder dan 45%, onverminderd de [artikelen 39][ref1] en [39a][ref2],
      plaats zodra de toegenomen arbeidsongeschiktheid onafgebroken 104 weken heeft geduurd.

      2 De in het eerste lid bedoelde herziening vindt niet plaats indien de uitkeringsgerechtigde bij het intreden van
      de toegenomen arbeidsongeschiktheid uitsluitend op grond van [artikel 7b][ref3] als werknemer wordt beschouwd en
      de toeneming kennelijk is voortgekomen uit een andere oorzaak dan die waaruit de ongeschiktheid, terzake waarvan de
      arbeidsongeschiktheidsuitkering wordt ontvangen, is voortgekomen.

      3 Voor het bepalen van het tijdvak van 104 weken, bedoeld in het eerste lid, worden perioden van
      toegenomen arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan
      vier weken opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering
      in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref4], [3:8][ref5] of
      [3:10, eerste lid, van de Wet arbeid en zorg][ref6] wordt genoten, tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de vaststelling van het tijdvak van 104 weken blijven
      perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref7],
      [3:8][ref8], of [3:10, eerste lid, van de Wet arbeid en zorg][ref9] wordt genoten, buiten beschouwing.


