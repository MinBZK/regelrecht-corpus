        bwb_id: BWBR0002524
        artikel: 65d
        hoofdstuk: IIB
  - number: 65b
    text: |-
      Niet vatbaar voor beslag zijn:

      a. de verhoging, bedoeld in [artikel 22][ref1];

      b. de overlijdensuitkering, bedoeld in [artikel 53][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel53
