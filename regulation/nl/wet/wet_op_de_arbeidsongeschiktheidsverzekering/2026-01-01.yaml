  - number: '54'
    text: |-
      1 Indien de degene aan wie een arbeidsongeschiktheidsuitkering is toegekend, aanspraak heeft op
      verstrekking of vergoeding van zorg als bedoeld in de [Wet langdurige zorg][ref1] en op grond van die wet
      een bijdrage voor die zorg verschuldigd is, is het Uitvoeringsinstituut werknemersverzekeringen bevoegd
      de arbeidsongeschiktheidsuitkering tot het bedrag van die bijdrage in plaats van aan degene aan wie de
      arbeidsongeschiktheidsuitkering is toegekend, zonder diens machtiging uit te betalen aan het Zorginstituut
      Nederland, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref2].

      2 Indien aan degene aan wie een arbeidsongeschiktheidsuitkering is toegekend, een
      maatwerkvoorziening of persoonsgebonden budget wordt verstrekt voor beschermd wonen als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref3], en hij op grond van die [wet][ref4] hiervoor
      een bijdrage is verschuldigd, is het Uitvoeringsinstituut werknemersverzekeringen bevoegd die uitkering tot het
      bedrag van die bijdrage in plaats van aan degene, aan wie de uitkering is toegekend, zonder diens machtiging uit
      te betalen aan het CAK, genoemd in [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref5], dat voor de
      gemeente de bijdrage int.

      3 Indien degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend, in een inrichting ter verpleging
      van geesteszieken of van zwakzinnigen is opgenomen en het Uitvoeringsinstituut werknemersverzekeringen, van de
      desbetreffende inrichting of van het college van burgemeester en wethouders van de gemeente die de opnamekosten
      betaalt, het verzoek ontvangt om de arbeidsongeschiktheidsuitkering aan die inrichting of die gemeente uit te
      betalen, is het Uitvoeringsinstituut werknemersverzekeringen bevoegd dat verzoek zonder het stellen van andere
      voorwaarden in te willigen.

      4 Indien het eerste of tweede lid toepassing vindt, heeft de in het derde lid bedoelde bevoegdheid betrekking op
      het gedeelte van de arbeidsongeschiktheidsuitkering dat niet aan de in het eerste of tweede lid genoemde instantie
      wordt uitbetaald.

      5 Een herziening van de uitkering op grond van het eerste of tweede lid als gevolg van een wijziging van de
      verschuldigde bijdrage vindt plaats zonder dat dit bij beschikking is vastgesteld.


