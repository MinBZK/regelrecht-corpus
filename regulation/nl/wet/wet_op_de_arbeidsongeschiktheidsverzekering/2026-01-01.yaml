  - number: '89'
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de verzekerde naar burgerlijk recht aanspraak kan maken ter
      zake van zijn arbeidsongeschiktheid, houdt de rechter rekening met de aanspraken, die hij krachtens deze wet heeft.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel89
  - number: '90'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen heeft voor de krachtens deze wet gemaakte kosten verhaal op
      degene, die in verband met het veroorzaken van arbeidsongeschiktheid jegens de verzekerde naar burgerlijk recht tot
      schadevergoeding is verplicht, doch ten hoogste tot het bedrag, waarvoor deze bij het ontbreken van de aanspraken
      krachtens deze wet naar burgerlijk recht aansprakelijk zou zijn, verminderd met een bedrag, gelijk aan dat van
      de schadevergoeding tot betaling waarvan de aansprakelijke persoon jegens de verzekerde naar burgerlijk recht is
      gehouden.

      2 Overeenkomstig door Onze Minister te stellen regelen kan het Uitvoeringsinstituut werknemersverzekeringen in
      plaats van het bedrag der periodieke verstrekkingen de contante waarde daarvan vorderen.

      3 De in het eerste lid bedoelde aansprakelijke is eveneens verplicht tot vergoeding van de door
      het Uitvoeringsinstituut werknemersverzekeringen gemaakte redelijke kosten ter nakoming van de
      verplichtingen tot inschakeling in de arbeid van de verzekerde, die op het Uitvoeringsinstituut
      werknemersverzekeringen rusten op grond van deze wet en de daarop rustende bepalingen alsmede de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] en de daarop berustende bepalingen. De aansprakelijke
      kan hetzelfde verweer voeren dat hem jegens de verzekerde ten dienste zou hebben gestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: '91'
    text: |-
      1 Het bepaalde in het [vorige artikel][ref1] geldt ten aanzien van de naar burgerlijk recht tot schadevergoeding
      verplichte werkgever van de verzekerde, onderscheidenlijk ten aanzien van de naar burgerlijk recht tot
      schadevergoeding verplichte verzekerde, die in dienstbetrekking staat tot dezelfde werkgever als de verzekerde
      jegens wie naar burgerlijk recht verplichting tot schadevergoeding bestaat, slechts indien de arbeidsongeschiktheid
      is te wijten aan opzet of bewuste roekeloosheid van die werkgever onderscheidenlijk verzekerde.

      2 Voor de toepassing van het vorige lid wordt mede als werkgever beschouwd de inlener, bedoeld in
      [artikel 34 van de Invorderingswet 1990][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel34
