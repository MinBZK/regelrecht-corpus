  - number: 43a
    text: |-
      1 Indien degene

      a. wiens arbeidsongeschiktheidsuitkering wegens afneming van arbeidsongeschiktheid op grond van
      [artikel 43, eerste lid][ref1], is ingetrokken, of

      b. die aan het einde van de in [artikel 19][ref2], bedoelde wachttijd ongeschikt was tot het verrichten van zijn
      arbeid wegens ziekte of gebreken, maar geen recht had op toekenning van arbeidsongeschiktheidsuitkering omdat hij
      niet arbeidsongeschikt was,

      binnen vijf jaar na de datum van die intrekking dan wel binnen vijf jaar na het bereiken van het einde van
      die wachttijd arbeidsongeschikt wordt en deze arbeidsongeschiktheid voortkomt uit dezelfde oorzaak als die
      waaruit de arbeidsongeschiktheid ter zake waarvan de ingetrokken uitkering werd genoten dan wel als die op grond
      waarvan hij ongeschikt was tot het verrichten van zijn arbeid wegens ziekte of gebreken, vindt toekenning van
      arbeidsongeschiktheidsuitkering steeds plaats, zodra die arbeidsongeschiktheid onafgebroken vier weken heeft
      geduurd.

      2 Voor het bepalen van de periode van vier weken, bedoeld in het eerste lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier
      weken opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering in
      verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref3], [3:8][ref4] of
      [3:10, eerste lid, van de Wet arbeid en zorg][ref5] wordt genoten, tenzij de ongeschiktheid redelijkerwijs
      niet geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de vaststelling van de eerstgenoemde periode
      van vier weken blijven perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van
      [artikel 3:7, eerste lid][ref6], [3:8][ref7], of [3:10, eerste lid, van de Wet arbeid en zorg][ref8] wordt genoten,
      buiten beschouwing.

      3 In de gevallen, waarin [artikel 20 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref9]
      onderscheidenlijk [artikel 3:21 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref10]
      geen toepassing vindt omdat [artikel 29b van de Ziektewet][ref11] toepassing kan vinden, wordt het
      aan de arbeidsongeschiktheidsuitkering ten grondslag te leggen dagloon niet lager gesteld dan 108/100
      maal de grondslag die voor de berekening van de laatstelijk ontvangen arbeidsongeschiktheidsuitkering
      op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref12] onderscheidenlijk de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref13] in aanmerking werd genomen, dan wel 108/100
      maal de grondslag die in aanmerking zou zijn genomen, indien na het einde van de wachttijd, bedoeld in
      [artikel 7, eerste lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref14] onderscheidenlijk
      [artikel 3:3, eerste lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref15], recht
      zou hebben bestaan op een arbeidsongeschiktheidsuitkering op grond van een laatstbedoelde wet, zoals
      die sinds de beëindiging van die uitkering onderscheidenlijk sinds het einde van die wachttijd op grond
      van [artikel 8 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref16] onderscheidenlijk
      [artikel 3:7 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref17] zou zijn herzien.

      4 Dit artikel vindt geen toepassing, indien op grond van [artikel 47][ref18] aanspraak bestaat op heropening van de
      arbeidsongeschiktheidsuitkering.

      5 De [artikelen 19a][ref19] en [19b][ref20] en de daarop berustende bepalingen zijn van overeenkomstige toepassing.

      6 Indien de arbeidsongeschiktheidsuitkering op grond van dit artikel wordt toegekend en tevens recht op
      ziekengeld op grond van de [Ziektewet][ref21] bestaat, wordt de arbeidsongeschiktheidsuitkering uitbetaald
      voor zover deze het ziekengeld overtreft, danwel zou overtreffen, indien het ziekengeld op grond van
      [artikel 45 van de Ziektewet][ref22] geheel of gedeeltelijk is geweigerd.


