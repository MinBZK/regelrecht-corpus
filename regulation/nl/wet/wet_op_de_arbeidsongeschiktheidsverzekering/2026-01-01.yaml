  - number: 43c
    text: |-
      In de gevallen waarin [artikel 43a][ref1] toepassing vindt wordt het aan de toe te kennen
      arbeidsongeschiktheidsuitkering ten grondslag te leggen dagloon niet lager gesteld dan het dagloon dat voor de
      berekening van de laatstelijk ontvangen loondervingsuitkering in aanmerking werd genomen, dan wel het dagloon
      dat in aanmerking zou zijn genomen indien na het einde van de in [artikel 19][ref2], bedoelde wachttijd recht zou
      hebben bestaan op een loondervingsuitkering, zoals dat sinds de beëindiging van de uitkering onderscheidenlijk
      sinds het einde van die wachttijd op grond van [artikel 15][ref3] zou zijn herzien.


