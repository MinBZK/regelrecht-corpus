  - number: '18'
    text: |-
      1 Arbeidsongeschikt, geheel of gedeeltelijk, is hij die als rechtstreeks en objectief medisch vast te stellen
      gevolg van ziekte, gebreken, zwangerschap of bevalling geheel of gedeeltelijk niet in staat is om met arbeid te
      verdienen, hetgeen gezonde personen, met soortgelijke opleiding en ervaring, ter plaatse waar hij arbeid verricht
      of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen.

      2 Degene die op en sedert het tijdstip dat zijn verzekering een aanvang neemt, reeds gedeeltelijk arbeidsongeschikt
      is in de zin van het eerste lid, wordt voor wat de door hem aan deze wet te ontlenen aanspraken betreft als
      geheel of gedeeltelijk arbeidsongeschikt aangemerkt, indien hij als rechtstreeks en objectief medisch vast te
      stellen gevolg van ziekte of gebreken geheel of gedeeltelijk niet in staat is om met arbeid te verdienen, hetgeen
      soortgelijke personen, die in dezelfde mate arbeidsongeschikt zijn in de zin van het eerste lid, ter plaatse waar
      hij arbeid verricht of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen.
      De eerste zin blijft buiten toepassing ten aanzien van degene die onmiddellijk voorafgaande aan het tijdstip,
      waarop de verzekering een aanvang nam, ononderbroken onbetaald verlof, tot een maximum van achttien maanden,
      heeft genoten, behoudens voorzover het betreft gedeeltelijke arbeidsongeschiktheid in de zin van het eerste lid,
      die bestond op de dag, voorafgaande aan de eerste dag van dit verlof. Als ononderbroken onbetaald verlof wordt
      aangemerkt perioden van onbetaald verlof die elkaar met een onderbreking van minder dan een maand opvolgen.

      3 Indien de bij de aanvang van de verzekering aanwezige arbeidsongeschiktheid in de zin van het eerste lid
      naderhand is afgenomen vindt het tweede lid vervolgens overeenkomstige toepassing, met dien verstande dat voor
      de aanvang van de verzekering in de plaats treedt het tijdstip waarop de arbeidsongeschiktheid in de zin van het
      eerste lid is afgenomen.

      4 Het tweede en derde lid vinden geen toepassing indien bij de aanvang van de verzekering de betrokkene uit hoofde
      van een vroegere verzekeringsperiode reeds een arbeidsongeschiktheidsuitkering ontvangt.

      5 In het eerste en tweede lid wordt onder de eerstgenoemde arbeid verstaan alle algemeen geaccepteerde arbeid
      waartoe de verzekerde met zijn krachten en bekwaamheden in staat is.

      6 Bij de vaststelling van de mate van arbeidsongeschiktheid wordt buiten beschouwing gelaten of de verzekerde de
      arbeid feitelijk kan verkrijgen.

      7

      8 Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het bepaalde in dit artikel nadere en
      zo nodig afwijkende regels worden gesteld.

      9 De voordracht voor een krachtens het achtste lid vast te stellen algemene maatregel van bestuur, dan wel de
      vaststelling van een ministeriële regeling op basis van een dergelijke algemene maatregel van bestuur, wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.

      10 Bij de beoordeling van arbeidsongeschiktheid als bedoeld in deze wet maakt de verzekeringsarts zo veel mogelijk
      gebruik van wetenschappelijke inzichten die de beoordeling van arbeidsongeschiktheid kunnen ondersteunen.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel18
  - number: '19'
    text: |-
      1 De verzekerde, die arbeidsongeschikt wordt, heeft, zodra hij onafgebroken 104 weken arbeidsongeschikt is
      geweest, recht op toekenning van arbeidsongeschiktheidsuitkering, indien hij na afloop van deze periode nog
      arbeidsongeschikt is. Als eerste dag van de arbeidsongeschiktheid geldt de eerste werkdag waarop wegens ziekte niet
      is gewerkt of het werken tijdens de werktijd is gestaakt. Bij ministeriële regeling kunnen nadere regels worden
      gesteld en kunnen dagen waarop niet zou worden gewerkt als werkdag worden aangemerkt.

      2 Voor het bepalen van het tijdvak van 104 weken, bedoeld in het vorige lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier
      weken opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering in
      verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2] of
      [3:10, eerste lid, van de Wet arbeid en zorg][ref3] wordt genoten, tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.

      3 Recht op toekenning van arbeidsongeschiktheidsuitkering heeft eveneens de verzekerde, bedoeld in het eerste lid,
      die na afloop van het in het eerste, tweede, en zevende lid bedoelde tijdvak niet arbeidsongeschikt is, doch ten
      aanzien van wie dit wel het geval is binnen vier weken na afloop van dat tijdvak.

      4 Voor de toepassing van het bepaalde in de vorige leden wordt niet als arbeidsongeschikt beschouwd degene, die
      minder dan 15% arbeidsongeschikt is.

      5 Voor het bepalen van het tijdvak van 104 weken, bedoeld in de vorige leden, worden steeds in aanmerking genomen
      tijdvakken, gedurende welke aanspraak bestaat op ziekengeld krachtens de [Ziektewet][ref4] en worden niet in
      aanmerking genomen tijdvakken gedurende welke een uitkering wordt genoten als bedoeld in het tweede lid.

      6 Voor de toepassing van het bepaalde in het vorige lid wordt een belanghebbende geacht aanspraak te hebben
      op ziekengeld krachtens de [Ziektewet][ref5], indien hem in verband met de [artikelen 19a][ref6], [19b][ref7],
      [19c][ref8], [29][ref9], [30][ref10], [31][ref11], [44][ref12] en [45 van de Ziektewet][ref13] geen ziekengeld
      wordt uitgekeerd.

      7 De wachttijd, bedoeld in het eerste lid, wordt door het Uitvoeringsinstituut werknemersverzekeringen
      verlengd op gezamenlijk verzoek van de verzekerde en de werkgever jegens wie de verzekerde,
      bij ongeschiktheid tot het verrichten van arbeid wegens ziekte, recht heeft op loon als bedoeld
      in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref14], tenzij [artikel 29][ref15]
      of [artikel 29a, eerste of vierde lid, van de Ziektewet][ref16] van toepassing is dan wel
      aanspraak heeft op bezoldiging op grond van [artikel 76a van de Ziektewet][ref17], tenzij
      [onderdeel a van artikel 76c van die wet][ref18] van toepassing is, tenzij zwaarwegende omstandigheden zich
      daartegen verzetten. De verlengde wachttijd eindigt op de door het Uitvoeringsinstituut werknemersverzekeringen
      aangegeven datum. De verlengde wachttijd kan op verzoek van de werkgever of de verzekerde worden verkort of
      wordt op hun gezamenlijk verzoek verder verlengd tenzij zwaarwegende omstandigheden zich daartegen verzetten.
      Het Uitvoeringsinstituut werknemersverzekeringen stelt bij verkorting van de verlengde wachttijd een nieuwe datum
      vast waarop de verlengde wachttijd eindigt, met dien verstande dat de wachttijd niet eerder eindigt dan vijftien
      weken na dat verzoek tenzij de werkgever voor het verstrijken van het tijdvak van die vijftien weken geen loon
      meer verschuldigd is, omdat de dienstbetrekking is geëindigd. Bij de bekendmaking van de beschikking maakt het
      Uitvoeringsinstituut werknemersverzekeringen melding van de mogelijkheid van het doen van een aanvraag voor de
      toekenning van de uitkering alsmede van de termijn binnen welke die aanvraag wordt gedaan. Het tweede en vierde lid
      zijn van overeenkomstige toepassing. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking
      tot dit lid.


