  - number: 91e
    text: |-
      1 Ten aanzien van de persoon die recht heeft op arbeidsongeschiktheidsuitkering op grond van deze wet
      en van wie de eerste dag van de toegenomen arbeidsongeschiktheid is gelegen voor de inwerkingtreding van
      [artikel XXIV, onderdeel D, van de Verzamelwet SZW 2015][ref1], is [artikel 39c][ref2] niet van toepassing.

      2 Voor de toepassing van het eerste lid worden perioden van toegenomen arbeidsongeschiktheid samengeteld,
      indien zij elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan
      aan en aansluiten op een periode waarin uitkering in verband met zwangerschap of bevalling op grond van
      [artikel 3:7, eerste lid][ref3], [3:8][ref4] of [3:10, eerste lid, van de Wet arbeid en zorg][ref5] wordt genoten,
      tenzij de ongeschiktheid redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de
      vaststelling van het tijdvak van vier weken blijven perioden, waarin uitkering in verband met zwangerschap of
      bevalling op grond van artikel 3:7, eerste lid, 3:8, of 3:10, eerste lid, van de Wet arbeid en zorg wordt genoten,
      buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0036013#ArtikelXXIV
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel39c
