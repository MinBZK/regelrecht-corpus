  - number: 59a
    text: Degene, die recht heeft op arbeidsongeschiktheidsuitkering, heeft recht op een vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel59a
  - number: 59b
    text: |-
      1 De vakantie-uitkering bedraagt 8 pct. van het bedrag aan arbeidsongeschiktheidsuitkering, waarop recht bestond in
      de periode van twaalf maanden, voorafgaande aan de maand mei.

      2 Indien [artikel 39b][ref1], [43a, zesde lid][ref2], [44][ref3] of [47, zevende lid][ref4], is toegepast, wordt
      onder het bedrag aan arbeidsongeschiktheidsuitkering als bedoeld in het eerste lid verstaan het bedrag van de
      arbeidsongeschiktheidsuitkering, nadat artikel 39b, 43a, zesde lid, 44 of 47, zevende lid, is toegepast.

      3 De uitbetaling van de vakantie-uitkering vindt eenmaal per jaar ambtshalve plaats in de maand mei.

      4 Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref5], wordt gewijzigd, wordt
      het percentage van de in het eerste lid bedoelde vakantie-uitkering, alsmede de noemer van de in de
      [artikelen 21, tweede lid][ref6] en [22][ref7], bedoelde breuk dienovereenkomstig aangepast. Het gewijzigde
      percentage wordt in aanmerking genomen over de uitkering waarop recht bestaat over de periode aanvangende met de
      dag waarop de wijziging ingaat. Het aldus gewijzigde percentage en de aldus gewijzigde noemer treden in de plaats
      van het in het eerste lid genoemde percentage onderscheidenlijk de in de artikelen 21, tweede lid en 22, genoemde
      noemer.

      5 De vakantie-uitkering wordt betaald zonder dat dit bij beschikking is vastgesteld.

      6 In afwijking van het derde lid vindt, indien de arbeidsongeschiktheidsuitkering wordt beëindigd en het
      niet aannemelijk is dat binnen korte tijd wederom recht op een arbeidsongeschiktheidsuitkering zal ontstaan,
      uitbetaling van de vakantieuitkering plaats gelijktijdig met de uitbetaling van de laatste termijn van de
      arbeidsongeschiktheidsuitkering of zo spoedig mogelijk daarna.

      7 Indien na de toepassing van het zesde lid wederom recht op een arbeidsongeschiktheidsuitkering ontstaat en
      dientengevolge het derde lid of het zesde lid moet worden toegepast, wordt daarbij rekening gehouden met hetgeen
      met toepassing van het zesde lid reeds werd uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel39b
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
