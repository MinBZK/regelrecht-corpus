  - number: 39b
    text: |-
      Indien als gevolg van de toeneming van de arbeidsongeschiktheid zowel recht op herziening van de
      arbeidsongeschiktheidsuitkering bestaat of is ontstaan op grond van de [artikelen 37][ref1], [38][ref2],
      [39][ref3], [39a][ref4] en [39c][ref5], als op ziekengeld op grond van de [Ziektewet][ref6], wordt het bedrag
      waarmee de arbeidsongeschiktheidsuitkering is of wordt verhoogd uitbetaald voor zover dit het ziekengeld
      overtreft, danwel zou overtreffen, indien het ziekengeld op grond van [artikel 45 van de Ziektewet][ref7] geheel of
      gedeeltelijk is geweigerd.


