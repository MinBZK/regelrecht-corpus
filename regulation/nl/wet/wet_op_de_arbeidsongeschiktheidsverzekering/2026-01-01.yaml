  - number: '81'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen laat op verzoek tot de vrijwillige verzekering toe, mits hij
      hier te lande woont:

      a. de persoon aan wie een arbeidsongeschiktheidsuitkering is toegekend, berekend naar een arbeidsongeschiktheid van
      minder dan 45%;

      b. de persoon wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45%,
      wegens afneming van de arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder dan 45%.

      2 Op de persoon die voor 1 januari 2004 arbeidsongeschikt is geworden en op het tijdstip waarop hij
      arbeidsongeschikt werd verzekerde was op grond van de vrijwillige verzekering, blijft de vrijwillige verzekering op
      grond van dit hoofdstuk van toepassing:

      a. gedurende de wachttijd, bedoeld in [artikel 19][ref1];

      b. gedurende vier weken na afloop van de wachttijd, bedoeld in [artikel 19][ref2], indien hij na afloop van die
      wachttijd minder dan 15% arbeidsongeschikt is, doch binnen die vier weken 15% of meer arbeidsongeschikt is;

      c. gedurende de periode waarover hij recht heeft op arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel81
