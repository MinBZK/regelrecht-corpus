  - number: '39'
    text: |-
      1 Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering in
      afwijking van [artikel 37][ref1] steeds plaats zodra de toeneming van de arbeidsongeschiktheid intreedt, indien
      deze intreedt:

      a. binnen vier weken na de dag, met ingang van welke de arbeidsongeschiktheidsuitkering werd toegekend;

      b. binnen vier weken na de dag, met ingang van welke de arbeidsongeschiktheidsuitkering reeds eerder wegens
      toegenomen arbeidsongeschiktheid werd herzien;

      c. binnen vier weken na de dag, met ingang van welke de arbeidsongeschiktheidsuitkering, welke voordien was
      berekend naar een arbeidsongeschiktheid van 80 % of meer, wegens afneming van de arbeidsongeschiktheid is herzien
      naar een arbeidsongeschiktheid van minder dan 80 %;

      d. binnen een door Onze Minister aan te geven termijn in door Onze Minister aan te wijzen gevallen.

      2 Indien de arbeidsongeschiktheidsuitkering werd toegekend, onderscheidenlijk eerder wegens toegenomen
      arbeidsongeschiktheid werd herzien, met toepassing van [artikel 35, tweede lid][ref2], onderscheidenlijk
      [artikel 42, tweede lid][ref3], geldt met betrekking tot het bepaalde in het vorige lid, onder *a* en *b*, als
      dag met ingang van welke de arbeidsongeschiktheidsuitkering werd toegekend onderscheidenlijk herzien de dag, met
      ingang van welke die uitkering zou zijn toegekend onderscheidenlijk herzien, indien [artikel 35, tweede lid][ref4],
      onderscheidenlijk [artikel 42, tweede lid][ref5], geen toepassing zou hebben gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel37
