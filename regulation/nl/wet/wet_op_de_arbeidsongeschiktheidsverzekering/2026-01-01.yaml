  - number: '40'
    text: |-
      1 Het dagloon van de verzekerde, bedoeld in [artikel 19aa][ref1], wordt met ingang van de dag waarop het tweede
      recht op arbeidsongeschiktheidsuitkering zou zijn ontstaan opnieuw vastgesteld overeenkomstig het bepaalde bij
      of krachtens [artikel 14][ref2], mits dat leidt tot een hoger dagloon dan het dagloon dat voor de berekening
      van de laatstelijk ontvangen loondervingsuitkering of vervolguitkering in aanmerking werd genomen. In afwijking
      van het bepaalde bij of krachtens artikel 14 wordt bij de dagloonvaststelling, bedoeld in de eerste zin, de
      arbeidsongeschiktheidsuitkering op grond van deze wet niet aangemerkt als loon.

      2 Voor de toepassing van het eerste lid wordt in [artikel 14, eerste lid][ref3], in plaats van de
      woorden «voorafgaande aan het aangiftetijdvak waarin de arbeidsongeschiktheid is ingetreden» gelezen:
      voorafgaande aan het aangiftetijdvak waarin de arbeidsongeschiktheid is ontstaan waaruit het tweede recht op
      arbeidsongeschiktheiduitkering zou zijn ontstaan.

      3 Ingeval tijdens het ontvangen van een vervolguitkering ten aanzien van de verzekerde die na het ontstaan van
      recht op arbeidsongeschiktheidsuitkering ziek is geworden, als gevolg van de toepassing van [artikel 19aa][ref4],
      geen tweede recht op arbeidsongeschiktheidsuitkering ontstaat wordt, met inachtneming van de tweede tot
      en met vierde zin, met ingang van de dag waarop het tweede recht op arbeidsongeschiktheidsuitkering zou
      zijn ontstaan, een loondervingsuitkering toegekend. Voor de duur van die loondervingsuitkering is, in
      afwijking van [artikel 21a][ref5], de leeftijd van de betrokkene op de dag waarop het tweede recht op
      arbeidsongeschiktheidsuitkering zou zijn ontstaan bepalend. Toekenning van de loondervingsuitkering is slechts
      mogelijk indien de duur van die uitkering langer is dan de duur van de loondervingsuitkering waarop recht
      bestond onmiddellijk voorafgaande aan de datum van ingang van de vervolguitkering. De duur van de toe te kennen
      loondervingsuitkering wordt verminderd met de duur van de laatstelijk ontvangen loondervingsuitkering. Tijdens de
      duur van die loondervingsuitkering bestaat geen recht op vervolguitkering.

      4 Na afloop van de in het derde lid bedoelde loondervingsuitkering geldt voor de berekening van het
      vervolgdagloon, in afwijking van [artikel 21b, derde lid][ref6], een percentage van 2 maal het aantal verstreken
      jaren tussen het 15e jaar en de leeftijd van de betrokkene op de dag van ingang van de herziening van de
      arbeidsongeschiktheidsuitkering.

      5 Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld.


