      1 De arbeidsongeschiktheidsuitkering neemt een einde met ingang van de dag waarop de betrokkene de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], bereikt.

      2 Toekenning of heropening van arbeidsongeschiktheidsuitkering vindt niet plaats, indien de uitkering
      onderscheidenlijk de heropening zou ingaan op of na de in het eerste lid bedoelde dag.


