  - number: '7'
    text: |-
      Voor de toepassing van deze wet wordt als werknemer beschouwd:

      a. degene, die krachtens de verplichte verzekering op grond van de [Werkloosheidswet][ref1] (*Stb.* 1986, 566)
      uitkering ontvangt;

      b. in door Onze Minister aan te wijzen gevallen degene, die ten minste vijf of ten
      minste de helft van zijn arbeidsuren per kalenderweek heeft verloren als bedoeld in
      [artikel 16, eerste lid, onderdeel a, van de Werkloosheidswet][ref2], doch aan wie geen uitkering wordt verleend
      op grond van enige bepaling van die wet of van het uitkeringsreglement werkloosheidsverzekeringen van het
      Uitvoeringsinstituut werknemersverzekeringen of van een regeling als bedoeld in onderdeel c;

      c. degene, die wegens werkloosheid niet werkt en die ingevolge een door Onze Minister aan te wijzen, van
      overheidswege getroffen regeling uitkering ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '16'
  - number: 7a
    text: |-
      Voor de toepassing van deze wet wordt mede als werknemer beschouwd:

      a. degene, die krachtens de verplichte verzekering ingevolge de [Ziektewet][ref1] ziekengeld ontvangt;

      b. in door Onze Minister aan te wijzen gevallen degene, die wegens arbeidsongeschiktheid niet werkt, doch aan wie
      geen ziekengeld wordt verleend op grond van enige bepaling van de [Ziektewet][ref2];

      c. degene, die wegens arbeidsongeschiktheid niet werkt, doch aan wie geen ziekengeld wordt betaald op grond van
      [artikel 29, eerste lid, van de Ziektewet][ref3] maar wel een toeslag op grond van de [Toeslagenwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29
