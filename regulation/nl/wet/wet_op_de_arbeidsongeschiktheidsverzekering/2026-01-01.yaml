  - number: '21'
    text: |-
      1 De arbeidsongeschiktheidsuitkering op grond van deze wet bestaat achtereenvolgens uit een loondervingsuitkering,
      waarvoor het dagloon als maatstaf geldt en een vervolguitkering, waarvoor het vervolgdagloon als maatstaf geldt.

      2 De arbeidsongeschiktheidsuitkering bedraagt per dag, de zaterdagen en zondagen niet meegerekend, bij een
      arbeidsongeschiktheid van:









                    15-25%


                    14%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    25-35%


                    21%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    35-45%


                    28%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    45-55%


                    35%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    55-65%


                    42%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    65-80%


                    50,75%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    80% of meer


                    75%


                    van 100/108 maal het dagloon of het vervolgdagloon






      3 Bij de vaststelling van de mate van arbeidsongeschiktheid wordt, zoveel doenlijk, rekening gehouden met verkregen
      nieuwe bekwaamheden.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel21
  - number: 21a
    text: |-
      De duur van de loondervingsuitkering is voor degene, die op de datum met ingang waarvan hem een
      arbeidsongeschiktheidsuitkering wordt toegekend:

      58 jaar of ouder is zes jaar;

      53 jaar of ouder is drie jaar;

      48 jaar of ouder is twee jaar;

      43 jaar of ouder is anderhalf jaar;

      38 jaar of ouder is één jaar;

      33 jaar of ouder is een half jaar, en

      jonger is dan 33 jaar nihil.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel21a
  - number: 21b
    text: |-
      1 Na afloop van de in [artikel 21a][ref1] bedoelde periode bestaat recht op vervolguitkering met als maatstaf het
      vervolgdagloon.

      2 Het vervolgdagloon is gelijk aan het minimumloon verhoogd met een percentage van het verschil tussen het dagloon
      en het minimumloon.

      3 Voor de berekening van het vervolgdagloon geldt een percentage van 2 maal het aantal verstreken jaren tussen het
      15e jaar en de leeftijd van de betrokkene op de datum met ingang waarvan hem een arbeidsongeschiktheidsuitkering
      wordt toegekend.

      4 Indien het dagloon lager is dan het minimumloon wordt het vervolgdagloon vastgesteld op het dagloon.

      5 Voor de toepassing van [artikel 21a][ref2] en het derde lid wordt voor degene ten aanzien van wie
      [artikel 35, tweede lid][ref3], wordt toegepast als datum met ingang waarvan de arbeidsongeschiktheidsuitkering
      wordt toegekend in aanmerking genomen de datum waarop de arbeidsongeschiktheidsuitkering zou zijn toegekend als dat
      lid niet was toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel21a
