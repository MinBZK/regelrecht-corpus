  - number: 34a
    text: |-
      1 De aanvraag voor de toekenning van de uitkering gaat vergezeld van een reïntegratieverslag als bedoeld in
      [artikel 71a][ref1]. De eerste volzin is niet van toepassing voorzover [artikel 71b, eerste lid][ref2], toepassing
      vindt. Het Uitvoeringsinstituut werknemersverzekeringen beoordeelt of de werkgever en de verzekerde dan wel de
      eigenrisicodrager, bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref3] en de personen, bedoeld
      in [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref4], die laatstelijk tot hem in dienstbetrekking
      stonden, in redelijkheid hebben kunnen komen tot de reïntegratie- inspanningen, die zijn verricht.

      2 Indien het Uitvoeringsinstituut werknemersverzekeringen toepassing heeft gegeven aan
      [artikel 71a, negende lid][ref5], of [artikel 71b, derde lid, tweede zin][ref6], wijst het Uitvoeringsinstituut
      werknemersverzekeringen de aanvraag af.

      3 Bij de bekendmaking van de beschikking, bedoeld in het tweede lid, maakt het Uitvoeringsinstituut
      werknemersverzekeringen melding van de mogelijkheid tot het doen van een nieuwe aanvraag voor de toekenning van de
      uitkering alsmede van de termijn binnen welke die aanvraag wordt gedaan.

      4 De termijn, waarbinnen de belanghebbende een nieuwe aanvraag voor de toekenning van de uitkering doet, is:

      a. uiterlijk dertien weken voor het verstrijken van het tijdvak waarover de werkgever op grond van
      [artikel 629 lid 11, onderdeel d, van Boek 7 van het Burgerlijk Wetboek][ref7], verplicht is het loon te betalen
      dan wel op grond van [artikel 76a, zesde lid, onderdeel c, van de Ziektewet][ref8], verplicht is bezoldiging te
      betalen.

      b. zo spoedig mogelijk, indien het tijdvak waarover de werkgever op grond van
      [artikel 629 lid 11, onderdeel d, van Boek 7 van het Burgerlijk Wetboek][ref9], verplicht is het loon te betalen
      dan wel op grond van [artikel 76a, zesde lid, onderdeel c, van de Ziektewet][ref10], verplicht is bezoldiging te
      betalen, minder bedraagt dan 13 weken of indien de werkgever vóór het verstrijken van dat tijdvak geen loon meer
      verschuldigd is;

      c. uiterlijk dertien weken voor het verstrijken van het tijdvak waarover de eigenrisicodrager,
      bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref11], op grond van
      [artikel 29, tiende lid, van die wet][ref12] verplicht is het ziekengeld te betalen;

      d. zo spoedig mogelijk, indien het tijdvak waarover de eigenrisicodrager, bedoeld
      in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref13], op grond van
      [artikel 29, tiende lid, van die wet][ref14] verplicht is het ziekengeld te betalen, minder bedraagt dan 13 weken.


