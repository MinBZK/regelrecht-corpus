  - number: '14'
    text: |-
      1 Voor de berekening van een arbeidsongeschiktheidsuitkering waarop op grond van deze wet recht
      bestaat wordt als dagloon beschouwd 1/261 deel van het loon dat de werknemer in de periode van één
      jaar, die eindigt op de laatste dag van het aangiftetijdvak voorafgaande aan het aangiftetijdvak
      waarin de arbeidsongeschiktheid is ingetreden, verdiende, doch ten hoogste het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1], met betrekking tot een loontijdvak
      van een dag.

      2 Bij algemene maatregel van bestuur worden ten aanzien van de vaststelling van het dagloon, bedoeld in het eerste
      lid, en de herziening ervan nadere en zo nodig afwijkende regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
  - number: '15'
    text: |-
      1 De daglonen worden herzien met ingang van de dag waarop en in de mate waarin het bedrag genoemd in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref1] wordt herzien.

      2 Door of namens Onze Minister wordt in de Staatscourant medegedeeld met ingang van welke dag en met welk
      percentage een herziening als bedoeld in het eerste lid plaatsvindt.

      3 Een herziening van de uitkering als gevolg van een herziening van het dagloon vindt plaats zonder dat dit bij
      beschikking is vastgesteld.

      4 Het Uitvoeringsinstituut werknemersverzekeringen betaalt de herziene uitkering, bedoeld in het derde lid, bij de
      eerstvolgende uitkeringsbetaling nadat de herziening, bedoeld in het eerste lid, heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
