  - number: '12'
    text: |-
      De werkgever is verplicht de verzekerde gelegenheid te geven tot het uitoefenen van de hem bij of krachtens deze
      wet toegekende bevoegdheden en tot het nakomen van de hem bij of krachtens deze wet opgelegde verplichtingen, voor
      zover de uitoefening van die bevoegdheden en de nakoming van die verplichtingen niet buiten de arbeidstijd kan
      geschieden.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel12
  - number: '13'
    text: |-
      1 Deze wet, met uitzondering van [artikel 44][ref1], verstaat onder loon het loon in de zin van
      [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref2].

      2 Minimumloon is het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref3] of, indien het een
      werknemer jonger dan 21 jaar betreft, het op grond van de [artikelen 7, derde lid][ref4], en 8, derde lid, van die
      wet voor zijn leeftijd geldende minimumloon, beide vermeerderd met de daarover berekende vakantietoeslag, bedoeld
      in [artikel 15 van die wet][ref5], en vervolgens gedeeld door 21,75.

      3 Loon, door verschillende personen tezamen onverdeeld genoten, wordt, voor zover niet blijkt van een andere
      verdeling, geacht door ieder van hen voor een gelijk deel te zijn genoten.

      4 Degene, die krachtens een regeling als bedoeld in [artikel 7, onderdeel c][ref6], uitkering ontvangt, wordt
      geacht op elke dag, waarover hij die uitkering ontvangt, een loon te ontvangen, gelijk aan die uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel44
