  - number: 30a
    text: |-
      Indien voor het vaststellen van het recht op uitkering op grond van deze wet, in het kader van een aanvraag
      voor de toekenning van een uitkering op grond van deze wet, naar het oordeel van het Uitvoeringsinstituut
      werknemersverzekeringen een medisch onderzoek nodig is en de betrokkene niet meewerkt aan dat onderzoek, blijven
      eventuele uit deze wet voortvloeiende aanspraken op een uitkering op grond van deze wet buiten aanmerking, voor
      zolang het recht op uitkering niet kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel30a
  - number: '31'
    text: |-
      Zolang het Uitvoeringsinstituut werknemersverzekeringen ingevolge de [artikelen 25][ref1], [28][ref2],
      [30][ref3], en [30a][ref4] arbeidsongeschiktheid buiten aanmerking laat, vindt [artikel 18, tweede lid][ref5],
      overeenkomstige toepassing met betrekking tot de door de betrokkene aan deze wet nog te ontlenen aanspraken, met
      dien verstande, dat voor de aanvang van de verzekering in de plaats treedt het tijdstip, met ingang waarvan het
      Uitvoeringsinstituut werknemersverzekeringen arbeidsongeschiktheid buiten aanmerking laat.


