        paragraaf: '2'
  - number: '43'
    text: |-
      1 De arbeidsongeschiktheidsuitkering wordt ingetrokken wanneer de arbeidsongeschiktheid is geëindigd of beneden 15
      % is gedaald.

      2 De intrekking van de arbeidsongeschiktheidsuitkering gaat in op de dag, welke in de beschikking wordt genoemd als
      de dag, waarop de arbeidsongeschiktheid was geëindigd of beneden 15 % was gedaald.

      3 Indien intrekking van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide opleiding of scholing,
      is [artikel 42, vierde lid][ref1], van overeenkomstige toepassing.

      4 De arbeidsongeschiktheidsuitkering van degene die deelneemt aan een opleiding of scholing, wordt gedurende
      deze opleiding of scholing niet ingetrokken of herzien in verband met een daaruit voortvloeiende afname van
      de arbeidsongeschiktheid. Indien de belanghebbende tijdens de opleiding of scholing inkomen verwerft, is
      [artikel 44, eerste lid][ref2], van overeenkomstige toepassing.

      5 De arbeidsongeschiktheidsuitkering wordt ingetrokken, indien degene die recht heeft op
      arbeidsongeschiktheidsuitkering rechtens zijn vrijheid is ontnomen, vanaf de dag dat deze vrijheidsontneming één
      maand heeft geduurd.

      6 De arbeidsongeschiktheidsuitkering wordt ingetrokken, indien degene die recht heeft op
      arbeidsongeschiktheidsuitkering zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
      maatregel.

      7 Voor de verzekerde die op de dag voorafgaande aan de vrijheidsontneming geen recht heeft op
      arbeidsongeschiktheidsuitkering op grond van het zesde lid, eindigt het recht op arbeidsongeschiktheidsuitkering,
      in afwijking van het vijfde lid, vanaf de dag dat de vrijheidsontneming ingaat.

      8 Voor de toepassing van het vijfde lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met
      een onderbreking van minder dan vier weken opvolgen.

      9 De arbeidsongeschiktheidsuitkering wordt ingetrokken, indien degene die recht heeft op een
      arbeidsongeschiktheidsuitkering een uitreiziger is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel44
