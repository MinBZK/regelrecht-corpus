  - number: 43d
    text: |-
      De arbeidsongeschiktheidsuitkering, onderscheidenlijk de verhoging van de arbeidsongeschiktheidsuitkering
      in geval van herziening van die uitkering op grond van de [artikelen 37][ref1], [38][ref2],
      [39][ref3], [39a][ref4] en [39c][ref5], wordt niet uitbetaald gedurende het verlengde tijdvak waarin recht
      bestaat op ziekengeld op grond van [artikel 29, tiende lid, van de Ziektewet][ref6], op loon op grond van
      [artikel 629 lid 11, onderdeel d, van Boek 7 van het Burgerlijk Wetboek][ref7], dan wel op bezoldiging op grond van
      [artikel 76a, zesde lid, van de Ziektewet][ref8].


