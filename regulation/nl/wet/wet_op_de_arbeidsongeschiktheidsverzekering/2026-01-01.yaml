  - number: '42'
    text: |-
      1 De herziening van de arbeidsongeschiktheidsuitkering gaat in op de dag, met ingang van welke de belanghebbende
      ingevolge het bij of krachtens deze wet bepaalde voor een hogere of lagere uitkering in aanmerking komt.

      2 Met betrekking tot de herziening van de arbeidsongeschiktheidsuitkering, welke een verhoging van die uitkering
      tot gevolg heeft, is het bepaalde in [artikel 35, tweede lid][ref1], van overeenkomstige toepassing.

      3 De herziening van een arbeidsongeschiktheidsuitkering ter zake van afneming van de arbeidsongeschiktheid gaat in
      op de dag, welke in de beschikking wordt genoemd als de dag, waarop de arbeidsongeschiktheid was afgenomen.

      4 Indien herziening van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide scholing of opleiding,
      gaat deze herziening niet eerder in dan één jaar na voltooiing van die scholing of opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel35
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel42
