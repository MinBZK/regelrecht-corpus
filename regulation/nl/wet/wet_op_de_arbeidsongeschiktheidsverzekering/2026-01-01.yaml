  - number: 65c
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen kan aan de verzekerde die recht heeft op een
      arbeidsongeschiktheidsuitkering en die arbeid in dienstbetrekking aanvaardt of verricht, op aanvraag loonsuppletie
      toekennen, indien zijn loon lager is dan zijn resterende verdiencapaciteit.

      2 De loonsuppletie wordt verstrekt over perioden waarin loon uit dienstbetrekking wordt ontvangen, doch ten hoogste
      over een periode van vier jaar te rekenen vanaf de dag met ingang waarvan voor de eerste maal loonsuppletie is
      toegekend.

      3 Als perioden waarin loon uit dienstbetrekking wordt ontvangen als bedoeld in het tweede lid worden
      eveneens aangemerkt, perioden waarin een uitkering op grond van de [Ziektewet][ref1] of op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref2] wordt ontvangen, tenzij de dienstbetrekking
      is geëindigd.

      4 De loonsuppletie wordt voor de toepassing van de wettelijke bepalingen inzake premieheffing aangemerkt als een
      uitkering op grond van deze wet.

      5 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de hoogte van de
      loonsuppletie.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel65c
