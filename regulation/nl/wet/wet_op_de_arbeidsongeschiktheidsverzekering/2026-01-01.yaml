  - number: '41'
    text: |-
      1 Verhoging van de arbeidsongeschiktheidsuitkering vindt op aanvraag of ambtshalve plaats.

      2 Verhoging van de arbeidsongeschiktheidsuitkering ter zake van toeneming van de
      arbeidsongeschiktheid vindt in elk geval ambtshalve plaats, indien de betrokkene aansluitend
      aan de uitkering van ziekengeld krachtens de [Ziektewet][ref1] dan wel na afloop van
      het in [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2] of in
      [artikel 76a, eerste lid, van de Ziektewet][ref3] bedoelde tijdvak van 104 weken in aanmerking komt voor een hogere
      arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
