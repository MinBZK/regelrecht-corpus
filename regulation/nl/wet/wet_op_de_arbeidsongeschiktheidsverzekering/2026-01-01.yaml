  - number: '56'
    text: |-
      De termijnen van de arbeidsongeschiktheidsuitkering, welke niet zijn ingevorderd binnen twee jaren na de dag der
      betaalbaarstelling, worden niet meer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel56
  - number: '57'
    text: |-
      1 De uitkering, de loonsuppletie, bedoeld in [artikel 65c][ref1], en de inkomenssuppletie, bedoeld in
      [artikel 65d][ref2], die als gevolg van een beschikking als bedoeld in [artikel 36a][ref3] onverschuldigd
      is betaald, alsmede hetgeen anderszins onverschuldigd is betaald, wordt door het Uitvoeringsinstituut
      werknemersverzekeringen teruggevorderd.

      2 De uitkering die onverschuldigd aan de werkgever is betaald, wordt door het Uitvoeringsinstituut
      werknemersverzekeringen van de werkgever teruggevorderd, indien de werkgever de uitkering op grond van
      [artikel 629, vijfde lid, van Boek 7 van het Burgerlijk Wetboek][ref4] in mindering heeft kunnen brengen op het
      loon.

      3 In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van terugvordering
      of van verdere terugvordering af te zien, indien degene van wie wordt teruggevorderd:

      a. gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;

      b. gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;

      c. gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of

      d. een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.

      4 De in het derde lid, onderdelen a, b en c, genoemde termijn is tien jaar indien de terugvordering het gevolg is
      van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 80][ref5].

      5 De in het derde lid, onder a en b, genoemde termijn is drie jaar indien:

      a. het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref6] niet te boven is gegaan; en

      b. de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 80][ref7].

      6 Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van terugvordering af te zien.

      7 Degene van wie wordt teruggevorderd is verplicht desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen
      de inlichtingen te verstrekken die voor de terugvordering van belang zijn.

      8 In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen, onder voorwaarden die Onze
      Minister kan stellen, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze
      Minister vast te stellen bedrag niet te boven gaat.


