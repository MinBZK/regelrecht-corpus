      1 De [artikelen 20][ref1], [43b][ref2], en [47a][ref3], zijn niet van toepassing op de persoon die:

      a) op 31 december 1999 op grond van [artikel 18][ref4] recht heeft op een arbeidsongeschiktheidsuitkering en op die
      dag niet in Nederland woont, en

      b) op 19 december 2005 dit recht op uitkering uitsluitend nog heeft op grond van [artikel 2 van de wet van
      9 december 2004](onbekend), houdende goedkeuring van het voornemen tot opzegging van het op 28 juni 1962 te
      Genève totstandgekomen Verdrag betreffende de gelijkheid van behandeling van eigen onderdanen en vreemdelingen met
      betrekking tot de sociale zekerheid (Verdrag Nr. 118 aangenomen door de Internationale Arbeidsconferentie in haar
      zesenveertigste zitting; Trb. 1962, 122 en Trb. 1964, 23) (Stb. 2004, 715).

      2 Het eerste lid blijft van toepassing zolang deze persoon blijft wonen in hetzelfde land als het land
      waar hij op 19 december 2005 woonde en blijft voldoen aan de overige voorwaarden voor het recht op
      arbeidsongeschiktheidsuitkering.


