  - number: '10'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen wordt als werkgever beschouwd in de gevallen,
      bedoeld in [artikel 7, onderdeel a][ref1], [artikel 7a, onderdelen a en c][ref2], [artikel 7b][ref3] en
      [artikel 7c, onderdelen a en c][ref4].

      2 In de gevallen, bedoeld in [artikel 7, onderdeel b en c][ref5], [artikel 7a, onderdeel b][ref6], en
      [artikel 7c, onderdeel b][ref7], wordt als werkgever beschouwd degene, die door Onze Minister als werkgever wordt
      aangewezen.

      3 Ingeval het Uitvoeringsinstituut werknemersverzekeringen de uitkering of toeslag, bedoeld in de artikelen genoemd
      in het eerste lid, vermeerderd met de daarover door de werkgever verschuldigde premies en de inkomensafhankelijke
      bijdrage, bedoeld in [artikel 42 van de Zorgverzekeringswet][ref8], betaalt aan de werkgever, bedoeld in
      [artikel 8][ref9], [9][ref10] of [11][ref11], teneinde deze uitkering of toeslag door diens tussenkomst te
      doen uitbetalen, treedt voor de toepassing van het eerste lid, deze in de plaats van het Uitvoeringsinstituut
      werknemersverzekeringen, onafhankelijk van het voortbestaan van de dienstbetrekking met die werkgever.

      4 Bij ministeriële regeling kunnen met betrekking tot de door de werkgever verschuldigde premies, bedoeld in het
      derde lid, nadere regels worden gesteld.


