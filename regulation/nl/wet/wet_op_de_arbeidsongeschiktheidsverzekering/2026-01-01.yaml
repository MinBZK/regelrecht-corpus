  - number: '34'
    text: |-
      1 De arbeidsongeschiktheidsuitkering wordt op aanvraag toegekend.

      2 Het Uitvoeringsinstituut werknemersverzekeringen stelt de belanghebbende van de mogelijkheid van het doen van een
      aanvraag schriftelijk in kennis uiterlijk vier maanden vóór de datum waarop de wachttijd van 104 weken, bedoeld in
      [artikel 19, eerste lid][ref1], verstrijkt.

      3 De belanghebbende, die in aanmerking wenst te komen voor toekenning van de uitkering, dient zijn aanvraag
      te doen binnen 21 maanden na aanvang van zijn arbeidsongeschiktheid. Indien de wachttijd, bedoeld in
      [artikel 19, eerste lid][ref2], is verlengd op grond van het zevende lid van dat artikel wordt de aanvraag voor de
      toekenning van de uitkering, in afwijking van de eerste zin, uiterlijk 13 weken voor het verstrijken van de door
      het Uitvoeringsinstituut werknemersverzekeringen vastgestelde verlengde wachttijd gedaan.

      4 Onverminderd het in deze wet terzake van herziening of intrekking van de arbeidsongeschiktheidsuitkering
      bepaalde wordt ten aanzien van personen die na 1 juli 1954 zijn geboren, op een bij of krachtens algemene
      maatregel van bestuur bepaald tijdstip door het Uitvoeringsinstituut werknemersverzekeringen bezien of er in
      verband met wijziging van de mate van arbeidsongeschiktheid gronden zijn voor herziening of intrekking van de
      arbeidsongeschiktheidsuitkering. Het tijdstip kan voor verschillende groepen van personen verschillend worden
      vastgesteld. Bij algemene maatregel van bestuur kan worden bepaald dat de eerste zin niet van toepassing is op
      bepaalde groepen van personen.

      5 Een aanvraag wordt geacht tijdig te zijn ingediend, indien het Uitvoeringsinstituut werknemersverzekeringen
      de kennisgeving als bedoeld in het tweede lid, niet heeft gedaan dan wel indien bij een latere kennisgeving dan
      bedoeld in het tweede lid de aanvraag wordt ingediend binnen vier weken nadat deze kennisgeving is ontvangen.

      6 Indien de toepassing van het derde lid zou leiden tot kennelijke hardheid, is het Uitvoeringsinstituut
      werknemersverzekeringen bevoegd de uitkering ambtshalve toe te kennen.

      7 Indien de wachttijd, bedoeld in [artikel 19, eerste lid][ref3], is verlengd op grond van het
      [zevende lid van dat artikel][ref4], besluit het Uitvoeringsinstituut werknemersverzekeringen de aanvraag, bedoeld
      in het derde lid, niet te behandelen, indien deze is ingediend vóór het verzoek tot de verlenging.


