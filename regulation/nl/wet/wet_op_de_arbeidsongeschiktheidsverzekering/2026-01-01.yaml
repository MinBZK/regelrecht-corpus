  - number: '20'
    text: |-
      1 De verzekerde, bedoeld in [artikel 19][ref1], heeft geen recht op toekenning van arbeidsongeschiktheidsuitkering
      indien de dag waarop het recht op arbeidsongeschiktheidsuitkering zou ingaan, is gelegen in een periode dat hij
      niet in Nederland woont.

      2 Het eerste lid is niet van toepassing indien de verzekerde op die dag woont in een land waarin op
      grond van een verdrag of een besluit van een volkenrechtelijke organisatie recht op toekenning van
      arbeidsongeschiktheidsuitkering kan bestaan.

      3 De persoon, die op grond van het eerste lid geen recht op toekenning van arbeidsongeschiktheidsuitkering
      heeft alsmede de persoon die voor 1 januari 2004 arbeidsongeschikt is, maar op grond van
      [artikel 19a van de Ziektewet][ref2] geen recht heeft op ziekengeld, wordt vanaf de dag:

      a. dat hij in Nederland woont; of

      b. dat hij in een land woont waarmee een verdrag in werking is getreden dan wel een besluit van
      een volkenrechtelijke organisatie van kracht is geworden, op grond waarvan recht op toekenning van
      arbeidsongeschiktheidsuitkering kan bestaan;

      weer als verzekerde aangemerkt en heeft met inachtneming van de bepalingen van deze wet recht op toekenning van
      arbeidsongeschiktheidsuitkering, indien hij op die dag arbeidsongeschikt is. [Artikel 19, vierde lid][ref3],
      is van overeenkomstige toepassing. De [artikelen 18, tweede tot en met vierde lid][ref4], en
      [30, eerste lid, onderdeel a][ref5], zijn niet van toepassing.

      4 De persoon, bedoeld in het derde lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is,
      doch ten aanzien van wie dit wel het geval is binnen vier weken na die dag, wordt vanaf die dag weer
      als verzekerde aangemerkt en heeft met inachtneming van de bepalingen van deze wet recht op toekenning
      van arbeidsongeschiktheidsuitkering. [Artikel 19, vierde lid][ref6], is van overeenkomstige toepassing.
      [Artikel 30, eerste lid, onderdeel b][ref7], is niet van toepassing.

      5 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat de verzekerde, bedoeld in
      [artikel 19][ref8], recht heeft op toekenning van arbeidsongeschiktheidsuitkering, indien de dag waarop het recht
      op arbeidsongeschiktheidsuitkering zou ingaan is gelegen in een periode dat de verzekerde niet in Nederland woont
      ingeval van:

      a. een verzekerde die werkzaamheden verricht in het algemeen belang;

      b. een verzekerde die in Aruba, Curaçao, Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en Saba
      woont; of

      c. de gezinsleden van de in de onderdelen a of b bedoelde verzekerde.


