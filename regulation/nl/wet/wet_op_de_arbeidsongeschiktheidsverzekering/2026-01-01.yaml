  - number: '22'
    text: |-
      Een arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van 80% of meer, wordt, indien
      de betrokkene in een althans voorlopig blijvende toestand van hulpbehoevendheid, welke geregeld oppassing en
      verzorging nodig maakt, verkeert, voor de duur van die hulpbehoevendheid tot ten hoogste 100/108 maal zijn dagloon
      of zijn vervolgdagloon verhoogd. Het bepaalde in de vorige volzin vindt geen toepassing, indien de betrokkene in
      een inrichting is opgenomen en de kosten van verblijf ten laste van een zorgverzekering of een verzekering inzake
      ziektekosten komen.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel22
  - number: '23'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen kan, zo vaak hij dat nodig oordeelt de persoon die aanspraak
      maakt op of in het genot is van een arbeidsongeschiktheidsuitkering, oproepen of doen oproepen en op een door
      of vanwege het Uitvoeringsinstituut werknemersverzekeringen te bepalen plaats ondervragen of doen ondervragen
      in verband met de aanspraak op of het genot van een arbeidsongeschiktheidsuitkering of de toekenning dan wel
      verstrekking van een reïntegratie-instrument als bedoeld in [hoofdstuk IIB][ref1].

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan de in het eerste lid bedoelde personen op een door of
      vanwege het Uitvoeringsinstituut werknemersverzekeringen te bepalen plaats door een of meer daartoe door hem
      aangewezen deskundigen doen onderzoeken.

      3 De daartoe door het Uitvoeringsinstituut werknemersverzekeringen aangewezen deskundige kan, ook zonder opdracht
      van het Uitvoeringsinstituut werknemersverzekeringen, de in het eerste lid bedoelde personen oproepen, ondervragen,
      onderzoeken, doen oproepen, doen ondervragen en doen onderzoeken door een of meer door hem daartoe aangewezen
      deskundigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukIIB
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: IIB
  - number: '24'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen en de door hem daartoe aangewezen deskundige
      kunnen de persoon die aanspraak maakt op of in het genot is van een arbeidsongeschiktheidsuitkering
      voorschriften geven in het belang van een behandeling of van genezing dan wel voorzover dit
      voortvloeit uit de taak tot bevordering van de inschakeling in het arbeidsproces, bedoeld in
      [artikel 30a, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan in het kader van de uitvoering van het eerste lid
      voorschrijven dat de persoon, bedoeld in het eerste lid, zich laat registreren als werkzoekende bij het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
  - number: '25'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen weigert de uitkering tijdelijk of blijvend, geheel of
      gedeeltelijk indien een persoon als bedoeld in [artikel 23, eerste lid][ref1], na tijdig opgeroepen te zijn, niet
      verscheen of weigerde:

      a. vragen te beantwoorden die zijn gesteld door het Uitvoeringsinstituut werknemersverzekeringen of de door hem
      daartoe aangewezen deskundige;

      b. zich te laten onderzoeken door de door het Uitvoeringsinstituut werknemersverzekeringen daartoe aangewezen
      deskundige; of

      c. te voldoen aan het voorschrift, gegeven door het Uitvoeringsinstituut werknemersverzekeringen of de daartoe
      aangewezen deskundige, om zich ter observatie te doen opnemen of te verblijven in een aangewezen inrichting.

      2 Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig het bepaalde in het eerste lid bij
      toeneming van de arbeidsongeschiktheid, voor zover deze toeneming kennelijk is voortgekomen uit dezelfde oorzaak
      als de arbeidsongeschiktheid, ter zake waarvan het niet voldoen aan de oproeping of de weigering plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel23
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '23'
        hoofdstuk: II
        paragraaf: '1'
  - number: '26'
    text: |-
      Opgeroepenen en, indien hun toestand geleide nodig maakt, mede hun geleiders, worden reiskosten, verblijfkosten en
      tijdverlies vergoed in de gevallen en volgens regels, door het Uitvoeringsinstituut werknemersverzekeringen vast
      te stellen.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel26
  - number: '27'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd controlevoorschriften vast te stellen. Deze
      voorschriften mogen niet verder gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel27
  - number: '28'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig het bepaalde in [artikel 25][ref1]:

      a. indien de belanghebbende de door het Uitvoeringsinstituut werknemersverzekeringen of de door hem daartoe
      aangewezen deskundige krachtens [artikel 24][ref2] in het belang van een behandeling of genezing of tot behoud,
      herstel of bevordering van de mogelijkheid tot het verrichten van arbeid en tot registratie als werkzoekende bij
      het Uitvoeringsinstituut werknemersverzekeringen gegeven voorschriften zonder deugdelijke grond niet opvolgt;

      b. indien de belanghebbende zich niet, zolang als het Uitvoeringsinstituut werknemersverzekeringen of de door hem
      daartoe aangewezen deskundige te kennen heeft gegeven dit noodzakelijk te achten, onder geneeskundige behandeling
      stelt of indien hij de voorschriften van de behandelende arts niet opvolgt;

      c. indien de belanghebbende zich schuldig maakt aan gedragingen, waardoor zijn genezing wordt belemmerd of nalaat
      voldoende mede te werken om aanpassing aan zijn ziekte of gebrek te verkrijgen;

      d. indien de belanghebbende de controlevoorschriften, bedoeld in [artikel 27][ref3], of de verplichting
      bedoeld in [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4], niet
      of niet behoorlijk is nagekomen dan wel de verplichting bedoeld in [artikel 80][ref5] niet binnen de door het
      Uitvoeringsinstituut werknemersverzekeringen daarvoor vastgestelde termijn is nagekomen;

      e. indien de belanghebbende zijn arbeidsongeschiktheid opzettelijk heeft veroorzaakt;

      f. indien belanghebbende zich niet houdt aan de voorschriften, bedoeld in [artikel 34, derde lid][ref6],
      [artikel 34a, eerste lid][ref7], of [artikel 34a, vierde lid][ref8];

      g. indien de belanghebbende zonder redelijke gronden niet meewerkt aan een scholing of opleiding die door
      zijn werkgever of het Uitvoeringsinstituut werknemersverzekeringen uit hoofde van de uitoefening van hun
      taak op grond van [artikel 658a, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref9] respectievelijk
      [artikel 30, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref10] wenselijk wordt geacht
      voor zijn inschakeling in de arbeid;

      h. indien de belanghebbende zonder deugdelijke grond weigert of heeft geweigerd mee te werken aan door zijn
      werkgever of door een door die werkgever aangewezen deskundige gegeven redelijke voorschriften of getroffen
      maatregelen die erop gericht zijn om de belanghebbende in staat te stellen passende arbeid te verrichten dan wel
      indien bij de behandeling van de aanvraag, bedoeld in [artikel 34, derde lid][ref11], en bij de beoordeling als
      bedoeld in [artikel 34a, eerste lid][ref12], blijkt dat de belanghebbende zonder deugdelijke grond onvoldoende
      reïntegratie-inspanningen heeft verricht. Voor de toepassing van dit onderdeel wordt onder werkgever mede verstaan
      de eigenrisicodrager, bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref13];

      i. indien de belanghebbende zonder redelijke gronden niet meewerkt aan het opstellen van de re-integratievisie,
      bedoeld in [artikel 30a, vierde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref14], of het
      re-integratieplan, bedoeld in artikel 30a, zesde lid, van die wet;

      j. indien de belanghebbende de verplichtingen die zijn opgenomen in de reïntegratievisie, bedoeld in
      [artikel 30a, vierde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref15], of in het
      reïntegratieplan, bedoeld in artikel 30a, zesde lid, van die wet, niet of niet behoorlijk is nagekomen;

      k. indien de belanghebbende die bij deelname aan een reïntegratietraject zijn reïntegratieverplichtingen niet
      naleeft, de reden daarvan niet onmiddellijk aan het reïntegratiebedrijf heeft medegedeeld;

      l. indien de belanghebbende zich niet onthoudt van zeer ernstige misdragingen jegens de met de uitvoering van deze
      wet belaste personen en instanties tijdens het verrichten van hun werkzaamheden.


