    text: |-
      1 Degene, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45 %, in
      verband met het bepaalde in [artikel 43, eerste lid][ref1], is ingetrokken, heeft, indien hij binnen vier weken na
      de dag, met ingang van welke de uitkering is ingetrokken, weer arbeidsongeschikt wordt, aanspraak op heropening van
      de arbeidsongeschiktheidsuitkering.

      2 Het bepaalde in het vorige lid is mede van toepassing met betrekking tot degene, wiens
      arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan 45 %, in verband met het
      bepaalde in [artikel 43, eerste lid][ref2], is ingetrokken, indien hij weer arbeidsongeschikt wordt binnen 4 weken
      na de dag, met ingang van welke die uitkering, welke voordien was berekend naar een arbeidsongeschiktheid van ten
      minste 45 %, wegens afneming van de arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder
      dan 45%.

      3 Degene, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan 45
      %, in verband met het bepaalde in [artikel 43, eerste lid][ref3], is ingetrokken met ingang van een dag, die
      gelegen is binnen vier weken na de dag, met ingang waarvan die uitkering werd toegekend of wegens toegenomen
      arbeidsongeschiktheid werd herzien, heeft, indien hij binnen die periode van vier weken weer arbeidsongeschikt
      wordt, aanspraak op heropening van de arbeidsongeschiktheidsuitkering. [Artikel 39, tweede lid][ref4], is van
      overeenkomstige toepassing.

      4 Degene, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan 45 %, in
      verband met het bepaalde in [artikel 43, eerste lid][ref5], is ingetrokken, heeft, onverminderd het bepaalde in het
      tweede en het derde lid, indien hij binnen vier weken na de dag, met ingang van welke de uitkering is ingetrokken,
      weer arbeidsongeschikt wordt, niet kennelijk uit een andere oorzaak dan die, waaruit de arbeidsongeschiktheid,
      ter zake waarvan de ingetrokken uitkering werd genoten, is voortgekomen, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering.

      5 Ten aanzien van degene wiens arbeidsongeschiktheidsuitkering is ingetrokken in verband met
      [artikel 43, eerste lid][ref6], en die weer arbeidsongeschikt is geworden op grond van een herbeoordeling als
      bedoeld in [artikel 34, vijfde lid][ref7], vindt heropening van de arbeidsongeschiktheidsuitkering plaats met
      ingang van 22 februari 2007.

      6 De heropening gaat in op de dag, met ingang van welke de betrokkene weer arbeidsongeschikt is geworden en vindt
      plaats naar de mate van arbeidsongeschiktheid op die dag.

      7 Indien zowel recht bestaat of is ontstaan op heropening van de arbeidsongeschiktheidsuitkering op grond van
      dit artikel als op ziekengeld op grond van de Ziektewet, wordt de arbeidsongeschiktheidsuitkering uitbetaald voor
      zover deze het ziekengeld overtreft, danwel zou overtreffen, indien het ziekengeld op grond van artikel 45 van de
      Ziektewet geheel of gedeeltelijk is geweigerd.

      8 De [artikelen 17, tweede lid][ref8], [19, vierde lid][ref9], [19a][ref10], [19b][ref11] en de daarop berustende
      bepalingen, en [35, tweede lid][ref12], zijn van overeenkomstige toepassing.

      9 De arbeidsongeschiktheidsuitkering wordt op aanvraag of ambtshalve heropend.


