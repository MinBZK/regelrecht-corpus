  - number: 91b
    text: |-
      1 Ten aanzien van de persoon wiens eerste dag van arbeidsongeschiktheid is gelegen voor 1 januari 2004 blijven de
      [artikelen 19, met uitzondering van het tweede lid, laatste zin][ref1], [34][ref2] en [75a][ref3] van toepassing
      zoals deze luidden op 31 december 2003, met dien verstande dat het krachtens artikel 75a, vierde lid, tweede zin,
      te verhalen bedrag respectievelijk het krachtens artikel 75a, vijfde lid, aan 's Rijks kas af te dragen bedrag
      wordt vermeerderd met de inkomensafhankelijke bijdrage, bedoeld in [artikel 42 van de Zorgverzekeringswet][ref4],
      over de uitkering.

      2 Indien de arbeidsongeschiktheidsuitkering wordt herzien in verband met een
      voor 1 januari 2004 ingetreden toeneming van de arbeidsongeschiktheid, zijn de
      [artikelen 37, met uitzondering van het derde lid, laatste zin][ref5], [40][ref6] en [41][ref7] van toepassing,
      zoals deze luidden op 31 december 2003.

      3 Voor de toepassing van het eerste en tweede lid worden perioden van ongeschiktheid tot werken geacht
      eenzelfde, niet onderbroken periode van ongeschiktheid te vormen, indien zij elkaar met een onderbreking
      van minder dan vier weken opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin
      uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref8], [3:8][ref9] of
      [3:10, eerste lid, van de Wet arbeid en zorg][ref10] wordt genoten, tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.


