        artikel: 1:2
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 86b
    text: |-
      Indien in verband met het geven van een beschikking een in het buitenland wonende persoon
      is opgeroepen en om die reden de beschikking niet binnen de redelijke termijn, bedoeld in
      [artikel 4:13, eerste lid, van de Algemene wet bestuursrecht][ref1], gegeven kan worden, wordt die termijn verlengd
      met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel413
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel86b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:13
  - number: '87'
    text: |-
      1 Een aanvraag tot het geven van een beschikking over het verzekerd zijn op grond van deze wet kan door
      de werknemer uitsluitend bij het Uitvoeringsinstituut werknemersverzekeringen worden ingediend. Het
      Uitvoeringsinstituut werknemersverzekeringen geeft de beschikking binnen dertien weken na ontvangst van de
      aanvraag.

      2 Indien een beschikking als bedoeld in het eerste lid niet binnen dertien weken kan worden gegeven, wordt de
      aanvrager daarvan schriftelijk in kennis gesteld onder vermelding van een zo kort mogelijke termijn waarbinnen de
      beschikking wel tegemoet kan worden gezien.

      3 Een beschikking over verlenging van de wachttijd, bedoeld in [artikel 19, eerste lid][ref1], op grond van het
      zevende lid van dat artikel wordt gegeven binnen twee weken na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel87
    references:
