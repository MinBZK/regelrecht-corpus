  - number: '65'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regels worden gesteld ter voorkoming of beperking van samenloop van
      arbeidsongeschiktheidsuitkering met arbeidsongeschiktheidsuitkering op grond van andere wetten.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld ter voorkoming of beperking van samenloop van
      arbeidsongeschiktheidsuitkering met uitkering op grond van de sociale wetgeving van Aruba, Curaçao, Sint Maarten,
      de sociale wetgeving van Nederland ten behoeve van de openbare lichamen Bonaire, Sint Eustatius en Saba of van een
      andere Mogendheid.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel65
  - number: 65a
    text: |-
      1 Onvervreemdbaar en niet vatbaar voor verpanding en belening zijn:

      a. de arbeidsongeschiktheidsuitkering;

      b. de vakantie-uitkering;

      c. de loonsuppletie, bedoeld in [artikel 65c][ref1];

      d. de inkomenssuppletie, bedoeld in [artikel 65d][ref2].

      2 Volmacht tot ontvangst van een uitkering onder welke vorm of benaming ook verleend, is steeds herroepelijk.

      3 Elk beding, strijdig met dit artikel, is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel65c
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel65d
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel65a
