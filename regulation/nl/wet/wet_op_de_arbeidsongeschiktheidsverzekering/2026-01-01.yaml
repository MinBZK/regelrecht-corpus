  - number: '83'
    text: |-
      1 Het verzoek tot toelating tot de vrijwillige verzekering wordt binnen dertien weken na de dagtekening
      van de beschikking waarbij de arbeidsongeschiktheidsuitkering werd toegekend of herzien ingediend bij het
      Uitvoeringsinstituut werknemersverzekeringen.

      2 Een verzoek tot toelating wordt geacht binnen dertien weken na de dagtekening van het besluit te zijn
      gedaan, indien dit verzoek geschiedt binnen vier weken na de dag waarop de persoon die het verzoek heeft gedaan
      redelijkerwijze kennis heeft kunnen nemen van het besluit.

      3 Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd te verklaren dat een verzoek tot toelating tot de
      vrijwillige verzekering, ingediend na de daartoe op grond van deze wet gestelde termijn, geacht wordt tijdig te
      zijn gedaan, indien de persoon die het verzoek heeft gedaan, redelijkerwijs niet geacht kan worden in verzuim te
      zijn geweest.

      4 De vrijwillige verzekering vangt aan op de dag met ingang waarvan de arbeidsongeschiktheidsuitkering wordt
      toegekend of herzien.
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel83
  - number: 83b
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beëindigt de vrijwillige verzekering:

      a. op verzoek van de vrijwillig verzekerde met ingang van een door hem te bepalen datum;

      b. met ingang van de dag waarop de vrijwillig verzekerde op grond van deze wet als werknemer wordt beschouwd;

      c. indien de verschuldigde premie over een periode van twee volle kalendermaanden niet, niet volledig of niet
      tijdig wordt betaald; of

      d. indien niet langer wordt voldaan aan de vereisten, bedoeld in [artikel 81][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2026-01-01#Artikel83b
    references:
