        artikel: '81'
        hoofdstuk: VI
  - number: '84'
    text: |-
      1 De persoon, die om toelating tot de vrijwillige verzekering verzoekt, bepaalt bij de aanvang van de vrijwillige
      verzekering de hoogte van het dagloon, met dien verstande dat dit niet meer kan bedragen dan:

      a. het bedrag, bedoeld in [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1], met
      betrekking tot een loontijdvak van een dag eventueel verhoogd of verlaagd krachtens [artikel 18 van die wet][ref2];
      en

      b. het loon of het inkomen dat hij in geval van arbeidsongeschiktheid naar het oordeel van het Uitvoeringsinstituut
      werknemersverzekeringen derft.

      2 De uitkering op grond van de vrijwillige verzekering wordt tijdens de duur, bedoeld in [artikel 21a][ref3],
      berekend naar het in het eerste lid bedoelde dagloon. Dit dagloon wordt eveneens in aanmerking genomen bij de
      berekening van het vervolgdagloon, bedoeld in [artikel 21b][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel18
