---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_arbeidsongeschiktheidsverzekering
regulatory_layer: WET
publication_date: '2026-02-03'
valid_from: '2013-01-01'
bwb_id: BWBR0002524
url: https://wetten.overheid.nl/BWBR0002524/2013-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen vast te stellen inzake een verplichte
    verzekering van loontrekkenden tegen geldelijke gevolgen van langdurige arbeidsongeschiktheid;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: 1.1.b
    text: |-
      Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 1.1.c
    text: |-
      Arbeidsongeschiktheidsfonds: het fonds genoemd in [artikel 112 van de Wet financiering sociale verzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel112
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '112'
  - number: 1.1.d
    text: |-
      lichamen: rechtspersonen, maat- en vennootschappen, samenwerkingsvormen zonder rechtspersoonlijkheid die
      maatschappelijk kunnen worden gelijkgesteld met verenigingen, ondernemingen van publiekrechtelijke rechtspersonen
      en doelvermogens;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: 1.1.g
    text: |-
      vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 1.1.h
    text: |-
      onbetaald verlof: een tussen werkgever en werknemer voor een gedeelte of het geheel van de arbeidstijd
      overeengekomen verlof, waarin de werknemer geen arbeid jegens de werkgever verricht;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: 1.1.i
    text: |-
      rechtens zijn vrijheid is ontnomen: rechtens zijn vrijheid is ontnomen, behoudens de
      gevallen, bedoeld in de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1] en in
      [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005700
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005700
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '37'
  - number: 1.1.j
    text: |-
      justitiële inrichting: een penitentiaire inrichting, een inrichting voor verpleging van ter beschikking gestelden,
      of een inrichting als bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: 1.1.k
    text: |-
      reïntegratiebedrijf: een natuurlijke persoon dan wel rechtspersoon die in het kader van de uitoefening van beroep
      of bedrijf de inschakeling van personen in de arbeid bevordert;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: 1.1.l
    text: |-
      resterende verdiencapaciteit: datgene dat de verzekerde, die recht heeft op een arbeidsongeschiktheidsuitkering nog
      met arbeid kan verdienen zoals dat bij of krachtens [artikel 18][ref1] is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
  - number: 1.1.m
    text: |-
      overheidswerkgever: de overheidswerkgever, bedoeld in
      [artikel 1, onderdeel k, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009267#Artikel1
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009267
        artikel: '1'
  - number: 1.1.n
    text: |-
      vrijheidsstraf of vrijheidsbenemende maatregel: een bij onherroepelijk geworden vonnis opgelegde vrijheidsstraf of
      vrijheidsbenemende maatregel als bedoeld in het [Wetboek van Strafrecht][ref1], behoudens de gevallen, bedoeld in
      [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '37'
  - number: '1.2'
    text: 'Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: 1.2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: 1.2.b
    text: 'echtgenoten: geregistreerde partners;'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: 1.2.c
    text: 'gehuwd: als partner geregistreerd.'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: '1.3'
    text: 'Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: 1.3.a
    text: |-
      als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde meerderjarige
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: 1.3.b
    text: als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: '1.4'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: '1.5'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: 1.5.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: 1.5.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: 1.5.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: 1.5.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: '1.6'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: '1.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: '1.8'
    text: |-
      Onder bloedverwant in de eerste graad als bedoeld in het derde lid, onderdeel a, wordt mede verstaan een
      meerderjarig aangehuwd kind of een meerderjarig voormalig pleegkind van de ongehuwde meerderjarige.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
  - number: '1.9'
    text: |-
      Onder voormalig pleegkind als bedoeld in het achtste lid wordt verstaan een pleegkind waarvoor de ongehuwde
      meerderjarige een pleegvergoeding ontving of ontvangt op grond van de [Wet op de jeugdzorg][ref1] of kinderbijslag
      ontving op grond van de [Algemene Kinderbijslagwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637
      [ref2]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016637
      - id: ref2
        bwb_id: BWBR0002368
  - number: '2.1'
    text: Waar iemand woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel2
  - number: '2.2'
    text: |-
      Voor de toepassing van het eerste lid worden schepen die binnen Nederland hun thuishaven hebben, beschouwd als deel
      van Nederland.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      Werknemer is de natuurlijke persoon die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], nog niet heeft bereikt, die in privaatrechtelijke of
      in publiekrechtelijke dienstbetrekking staat.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '3.2'
    text: |-
      Wie zijn dienstbetrekking buiten Nederland vervult, wordt niet als werknemer beschouwd, tenzij hij in Nederland
      woont en zijn werkgever eveneens in Nederland woont of gevestigd is. Voor zover een werkgever:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3
  - number: 3.2.a
    text: |-
      in Nederland een vaste inrichting voor de uitoefening van zijn bedrijf of beroep of een in Nederland wonende of
      gevestigde vaste vertegenwoordiger heeft; of
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3
  - number: 3.2.b
    text: in Nederland een of meer personen in dienst heeft en hij door of vanwege Onze Minister als werkgever is aangewezen,
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3
  - number: '3.3'
    text: |-
      In afwijking van het eerste en tweede lid wordt niet als werknemer beschouwd de vreemdeling die niet rechtmatig in
      Nederland verblijf houdt in de zin van [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '3.4'
    text: 'Bij of krachtens algemene maatregel van bestuur kan worden bepaald, dat:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3
  - number: 3.4.a
    text: |-
      personen, die buiten Nederland wonen ook als werknemer worden beschouwd, voor zover zij hun dienstbetrekking buiten
      Nederland vervullen;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3
  - number: 3.4.b
    text: |-
      personen, die in Nederland wonen, ook als werknemer worden beschouwd, voor zover zij hun dienstbetrekking buiten
      Nederland vervullen en hun werkgever buiten Nederland woont of gevestigd is.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3
  - number: '3.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan van het eerste, tweede en derde lid worden afgeweken ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3
  - number: 3.5.a
    text: vreemdelingen;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3
  - number: 3.5.b
    text: |-
      personen, op wie een regeling van toepassing is inzake verzekering tegen geldelijke gevolgen van langdurige
      arbeidsongeschiktheid van Aruba, Curaçao, Sint Maarten of de sociale wetgeving van Nederland ten behoeve van
      de openbare lichamen Bonaire, Sint Eustatius en Saba, van een andere mogendheid, of van een volkenrechtelijke
      organisatie; en
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3
  - number: 3.5.c
    text: personen, die slechts tijdelijk in Nederland verblijven of tijdelijk in Nederland werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3
  - number: '3.6'
    text: 'Bij een maatregel, als bedoeld in het vijfde lid, kan worden afgeweken van het derde lid ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3
  - number: 3.6.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3
  - number: 3.6.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3a
    text: |-
      Zo nodig in afwijking van [artikel 3][ref1] en de daarop berustende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: 3a.a
    text: |-
      wordt als werknemer beschouwd de persoon van wie de verzekering op grond van deze wet voortvloeit uit de toepassing
      van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3a
  - number: 3a.b
    text: |-
      wordt niet als werknemer beschouwd de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel3a
  - number: '4.1'
    text: 'Als dienstbetrekking wordt mede beschouwd de arbeidsverhouding van:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: 4.1.a
    text: |-
      degene, die anders dan als zelfstandige en anders dan als thuiswerker, ingevolge een overeenkomst tot aanneming
      van werk als bedoeld in [artikel 750 van Boek 7 van het Burgerlijk Wetboek][ref1], persoonlijk een werk tot stand
      brengt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel750
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '750'
  - number: 4.1.b
    text: degene, die de onder *a* bedoelde persoon bij het tot stand brengen van dat werk bijstaat;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: 4.1.c
    text: |-
      degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en die ander, mits hij de bedoelde
      bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een voor hem bijkomstige
      werkzaamheid is en hij zich daarbij doorgaans niet door meer dan twee andere personen laat bijstaan;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: 4.1.d
    text: |-
      degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander,
      mits hij de bedoelde bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een
      voor hem bijkomstige werkzaamheid is en hij zich daarbij doorgaans niet door meer dan twee andere personen laat
      bijstaan;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: 4.1.f
    text: |-
      degene, die als lid van de bemanning van een vissersvaartuig aanspraak heeft op een aandeel in de besomming, tenzij
      hij
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: 4.1.f.1
    text: |-
      als zodanig tegen geldelijke gevolgen van arbeidsongeschiktheid verzekerd is bij het Sociaal Fonds voor de
      Maatschapsvisserij of
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: 4.1.f.2
    text: exploitant of mede-exploitant van het vaartuig is;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: 4.1.h
    text: |-
      degene, die als bestuurder werkzaam is ten behoeve van een coöperatie die met haar leden uitsluitend
      arbeidsovereenkomsten als bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] sluit,
      indien hij lid is van de coöperatie en deze blijkens haar statuten en met inachtneming van de vereisten gesteld in
      het derde lid en krachtens het vierde lid kan worden beschouwd als een coöperatie met werknemerszelfbestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: '4.2'
    text: |-
      Het bepaalde in het vorige lid, onder *a* en *b*, blijft buiten toepassing, indien de onder *a* bedoelde
      overeenkomst rechtstreeks is aangegaan met een natuurlijk persoon ten behoeve van diens persoonlijke
      aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: '4.3'
    text: 'Een coöperatie als bedoeld in het eerste lid, onderdeel *h*, dient te voldoen aan de vereisten, dat:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: 4.3.a
    text: |-
      doorgaans ten minste twee derde deel van het aantal personen met wie de coöperatie een arbeidsovereenkomst als
      bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] heeft gesloten, lid van de
      coöperatie is;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 4.3.b
    text: |-
      het lidmaatschap van de coöperatie door ieder van de in onderdeel *a* bedoelde personen onder dezelfde voorwaarden
      kan worden verkregen en voorwaarden van geldelijke aard geen wezenlijke belemmering vormen voor de verkrijging van
      het lidmaatschap;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: 4.3.c
    text: de leden van de coöperatie ieder één stem hebben;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: 4.3.d
    text: |-
      de arbeidsvoorwaarden van de leden van de coöperatie niet wezenlijk verschillen van hetgeen gebruikelijk is bij
      gelijksoortige ondernemingen in de desbetreffende sector;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: 4.3.e
    text: |-
      een lid van de coöperatie, behoudens in geval van liquidatie van de coöperatie, bij beëindiging van zijn
      lidmaatschap ten hoogste aanspraak kan maken op het door hem uit hoofde van een geldelijke voorwaarde als bedoeld
      in onderdeel *b*, hetzij uit anderen hoofde aan de coöperatie betaalde bedrag, herrekend naar geldontwaarding.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: '4.4'
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld waarbij de in het derde lid genoemde vereisten
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: 4.4.a
    text: nader worden bepaald;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: 4.4.b
    text: |-
      worden aangevuld met andere vereisten op grond waarvan de coöperatie kan worden beschouwd als een coöperatie met
      werknemerszelfbestuur.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: '4.5'
    text: 'Voor de toepassing van het eerste lid, onderdeel a, wordt onder zelfstandige verstaan de persoon die:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
  - number: 4.5.a
    text: |-
      in Nederland woont en die belastbare winst uit onderneming geniet als bedoeld in
      [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref1], tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.1
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        paragraaf: 3.2.1
  - number: 4.5.b
    text: |-
      niet in Nederland woont en die belastbare winst uit Nederlandse onderneming geniet als bedoeld in
      [afdeling 7.2 van de Wet inkomstenbelasting 2001][ref1], tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling7.2
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '7.2'
  - number: 4.5.c
    text: |-
      directeur-grootaandeelhouder is als bedoeld in [artikel 6, eerste lid, onderdeel d][ref1], en het werk tot
      stand brengt uitsluitend voor rekening en risico van de onderneming van de rechtspersoon waarvan hij directeur-
      grootaandeelhouder is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel6
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '6'
        hoofdstuk: I
        paragraaf: '2'
  - number: '5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld, ingevolge welke eveneens als
      dienstbetrekking wordt beschouwd de arbeidsverhouding van:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel5
  - number: 5.a
    text: degene, die als thuiswerker arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel5
  - number: 5.b
    text: degene, die de onder *a* bedoelde persoon als hulp bij het verrichten van de arbeid bijstaat;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel5
  - number: 5.c
    text: degene, die als musicus of anderszins als artiest optreedt dan wel als beroep een tak van sport beoefent;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel5
  - number: 5.d
    text: |-
      degene, die tegen beloning persoonlijk arbeid verricht en wiens arbeidsverhouding niet reeds ingevolge de
      voorgaande bepalingen als dienstbetrekking wordt beschouwd, doch hiermede maatschappelijk gelijk kan worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel5
  - number: '6.1'
    text: 'Als dienstbetrekking wordt niet beschouwd de arbeidsverhouding van:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
  - number: 6.1.a
    text: |-
      degene, die minister, staatssecretaris, Nationale ombudsman, substituut-ombudsman, lid van gedeputeerde staten of
      wethouder, waaronder begrepen een lid van het dagelijks bestuur van een deelgemeente, is;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
  - number: 6.1.b
    text: |-
      degene, die een verplichting naleeft, hem opgelegd door de wet of voortvloeiende uit een verbintenis anders dan bij
      arbeidsovereenkomst door hem jegens de Overheid aangegaan ten aanzien van ’s lands verdediging of ter bescherming
      van de openbare orde en de veiligheid der bevolking, alsmede van degene, die als vrijwilliger al dan niet tegen
      loon werkzaamheden verricht bij de brandweer;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
  - number: 6.1.c
    text: |-
      degene die doorgaans op minder dan vier dagen per week uitsluitend of nagenoeg uitsluitend diensten verricht ten
      behoeve van het huishouden van de natuurlijke persoon tot wie hij in dienstbetrekking staat;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
  - number: 6.1.d
    text: de directeur-grootaandeelhouder;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
  - number: 6.1.e
    text: |-
      een persoon, indien degene met wie hij de arbeidsverhouding heeft, met betrekking tot die arbeidsverhouding op
      grond van [artikel 6a van de Wet op de loonbelasting 1964][ref1] niet als inhoudingsplichtige wordt beschouwd;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel6a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 6a
  - number: 6.1.f
    text: |-
      degene die als vrijwilliger als bedoeld in [artikel 2, zesde lid, van de Wet op de loonbelasting 1964][ref1],
      uitsluitend vergoedingen of verstrekkingen als bedoeld in dat lid ontvangt met een gezamenlijke waarde van ten
      hoogste € 150 per maand en € 1 500 per kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
  - number: '6.2'
    text: |-
      Geen dienstbetrekking wordt geacht aanwezig te zijn op dagen, waarop geen arbeid wordt verricht en geen uitkering
      of een uitkering van minder dan de helft van het normale loon van de werkgever wordt genoten, tenzij het niet
      verrichten van de arbeid zijn oorzaak vindt in:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
  - number: 6.2.a
    text: |-
      een normale onderbreking van of verhindering tot het verrichten van de arbeid, zolang deze onderbreking of
      verhindering niet langer dan een maand heeft geduurd;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
  - number: 6.2.b
    text: weersinvloeden, gebrek aan materialen of dergelijke omstandigheden;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
  - number: 6.2.d
    text: |-
      de omstandigheid, dat de dienstbetrekking er toe strekt, dat slechts een gedeelte van een normale werkweek arbeid
      wordt verricht;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
  - number: 6.2.e
    text: |-
      de omstandigheid, dat de dienstbetrekking er toe strekt, dat niet regelmatig in elke kalenderweek arbeid wordt
      verricht, voor zover het betreft de kalenderweek waarin arbeid wordt verricht of arbeid zou worden verricht, indien
      de betrokkene niet arbeidsongeschikt was geworden;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
  - number: 6.2.f
    text: |-
      arbeidsongeschiktheid, ter zake waarvan ziekengeld ingevolge de [Ziektewet][ref1] of
      arbeidsongeschiktheidsuitkering ingevolge deze wet is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '6.3'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel c, wordt onder het verrichten van diensten ten behoeve van een
      huishouden mede verstaan het verlenen van zorg aan de leden van dat huishouden.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
  - number: '6.4'
    text: Het eerste en tweede lid zijn alleen van toepassing op de aldaar bedoelde arbeidsverhoudingen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
  - number: '6.5'
    text: |-
      Door Onze Minister worden, in overeenstemming met Onze Minister van Financiën, regels gesteld omtrent hetgeen onder
      directeur-grootaandeelhouder, bedoeld in het eerste lid, onderdeel d, wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel6
  - number: '7'
    text: 'Voor de toepassing van deze wet wordt als werknemer beschouwd:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel7
  - number: 7.a
    text: |-
      degene, die krachtens de verplichte verzekering op grond van de [Werkloosheidswet][ref1] (*Stb.* 1986, 566)
      uitkering ontvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 7.b
    text: |-
      in door Onze Minister aan te wijzen gevallen degene, die ten minste vijf of ten
      minste de helft van zijn arbeidsuren per kalenderweek heeft verloren als bedoeld in
      [artikel 16, eerste lid, onderdeel a, van de Werkloosheidswet][ref1], doch aan wie geen uitkering wordt verleend
      op grond van enige bepaling van die wet of van het uitkeringsreglement werkloosheidsverzekeringen van het
      Uitvoeringsinstituut werknemersverzekeringen of van een regeling als bedoeld in onderdeel c;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
  - number: 7.c
    text: |-
      degene, die wegens werkloosheid niet werkt en die ingevolge een door Onze Minister aan te wijzen, van overheidswege
      getroffen regeling uitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel7
  - number: 7a
    text: 'Voor de toepassing van deze wet wordt mede als werknemer beschouwd:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel7a
  - number: 7a.a
    text: |-
      degene, die krachtens de verplichte verzekering ingevolge de [Ziektewet][ref1] ziekengeld ontvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 7a.b
    text: |-
      in door Onze Minister aan te wijzen gevallen degene, die wegens arbeidsongeschiktheid niet werkt, doch aan wie geen
      ziekengeld wordt verleend op grond van enige bepaling van de [Ziektewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 7a.c
    text: |-
      degene, die wegens arbeidsongeschiktheid niet werkt, doch aan wie geen ziekengeld wordt betaald op grond van
      [artikel 29, eerste lid, van de Ziektewet][ref1] maar wel een toeslag op grond van de [Toeslagenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0004043
  - number: 7b.1
    text: |-
      Voor de toepassing van deze wet wordt mede als werknemer beschouwd degene, die op grond van de verplichte
      verzekering ingevolge deze wet uitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel7b
  - number: 7b.2
    text: Het eerste lid is niet van toepassing op diegene die niet in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel7b
  - number: 7c
    text: 'Voor de toepassing van deze wet wordt mede als werknemer beschouwd:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel7c
  - number: 7c.a
    text: |-
      de werknemer of gelijkgestelde, bedoeld in [artikel 3:6, eerste lid, van de Wet arbeid en zorg][ref1] aan wie
      uitkering wordt betaald op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van die wet](onbekend);


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 7c.b
    text: |-
      in door Onze Minister aan te wijzen gevallen, degene die in verband met zwangerschap en bevalling niet werkt,
      anders dan bedoeld in [artikel 29a van de Ziektewet][ref1], doch aan wie geen uitkering wordt betaald op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 29a
  - number: '8'
    text: |-
      Werkgever is de overheidswerkgever onderscheidenlijk de natuurlijke persoon tot wie of het lichaam tot welk een of
      meer natuurlijke personen in dienstbetrekking staan.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel8
  - number: '9'
    text: 'Als werkgever wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel9
  - number: 9.1°
    text: |-
      in de gevallen, bedoeld in [artikel 4, eerste lid][ref1], onder: *a* en *b:* de aanbesteder; *c* en *d:* degene,
      met wie de overeenkomst tot bemiddeling is gesloten; *e:* *f:* de exploitant of mede-exploitant van het vaartuig;
      *g:* *h*: de coöperatie;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel4
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '4'
        hoofdstuk: I
        paragraaf: '2'
  - number: 9.2°
    text: |-
      in de gevallen, bedoeld in [artikel 5][ref1], onder: *a:* de opdrachtgever; *b:* de thuiswerker; *c:* degene, met
      wie het optreden of de sportbeoefening is overeengekomen; *d:* degene, die bij de in [artikel 5][ref2] bedoelde
      algemene maatregel van bestuur als werkgever wordt aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel5
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '5'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '5'
        hoofdstuk: I
        paragraaf: '2'
  - number: 9.3°
    text: |-
      de aangewezen inhoudingsplichtige, bedoeld in [artikel 6, zesde lid, van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel6
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '6'
  - number: '10.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen wordt als werkgever beschouwd in de gevallen, bedoeld
      in [artikel 7, onderdeel a][ref1], [artikel 7a, onderdelen a en c][ref2], [artikel 7b][ref3] en
      [artikel 7c, onderdeel a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel7b
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel7c
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 7a
        hoofdstuk: I
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 7b
        hoofdstuk: I
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 7c
        hoofdstuk: I
        paragraaf: '2'
  - number: '10.2'
    text: |-
      In de gevallen, bedoeld in [artikel 7, onderdeel b en c][ref1], [artikel 7a, onderdeel b][ref2], en
      [artikel 7c, onderdeel b][ref3], wordt als werkgever beschouwd degene, die door Onze Minister als werkgever wordt
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel7c
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 7a
        hoofdstuk: I
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 7c
        hoofdstuk: I
        paragraaf: '2'
  - number: '10.3'
    text: |-
      Ingeval het Uitvoeringsinstituut werknemersverzekeringen de uitkering of toeslag, bedoeld in de artikelen genoemd
      in het eerste lid, vermeerderd met de daarover door de werkgever verschuldigde premies en de inkomensafhankelijke
      bijdrage, bedoeld in [artikel 42 van de Zorgverzekeringswet][ref1], betaalt aan de werkgever, bedoeld in
      [artikel 8][ref2], [9][ref3] of [11][ref4], teneinde deze uitkering of toeslag door diens tussenkomst te
      doen uitbetalen, treedt voor de toepassing van het eerste lid, deze in de plaats van het Uitvoeringsinstituut
      werknemersverzekeringen, onafhankelijk van het voortbestaan van de dienstbetrekking met die werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel11
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '8'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '9'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '11'
        hoofdstuk: I
        paragraaf: '3'
  - number: '10.4'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot de door de werkgever verschuldigde premies, bedoeld in het
      derde lid, nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel10
  - number: '11'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Financiën, in afwijking van het bepaalde in de
      [artikelen 8][ref1] en [9][ref2] een ander dan de aldaar bedoelde personen aanwijzen als werkgever met betrekking
      tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel9
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '8'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '9'
        hoofdstuk: I
        paragraaf: '3'
  - number: 11.a
    text: |-
      degene, die krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot
      stand komen van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel11
  - number: 11.b
    text: degene, die een thuiswerker als hulp bij het verrichten van de arbeid bijstaat;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel11
  - number: 11.c
    text: degene, die als musicus of anderszins als artiest optreedt dan wel als beroep een tak van sport beoefent.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel11
  - number: '12'
    text: |-
      De werkgever is verplicht de verzekerde gelegenheid te geven tot het uitoefenen van de hem bij of krachtens deze
      wet toegekende bevoegdheden en tot het nakomen van de hem bij of krachtens deze wet opgelegde verplichtingen, voor
      zover de uitoefening van die bevoegdheden en de nakoming van die verplichtingen niet buiten de arbeidstijd kan
      geschieden.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel12
  - number: '13.1'
    text: |-
      Deze wet verstaat onder loon het loon in de zin van
      [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
  - number: '13.2'
    text: |-
      Minimumloon is het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1] (*Stb.* 1968, 657)
      of, indien het een werknemer jonger dan 23 jaar betreft, het voor zijn leeftijd geldende minimumloon per maand,
      bedoeld in [artikel 7, derde lid][ref2], en [artikel 8, derde lid, van genoemde wet][ref3], beide vermeerderd met
      de daarover berekende vakantietoeslag, bedoeld in [artikel 15 van die wet][ref4], en vervolgens gedeeld door 21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '13.3'
    text: |-
      Loon, door verschillende personen tezamen onverdeeld genoten, wordt, voor zover niet blijkt van een andere
      verdeling, geacht door ieder van hen voor een gelijk deel te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel13
  - number: '13.4'
    text: |-
      Degene, die krachtens een regeling als bedoeld in [artikel 7, onderdeel c][ref1], uitkering ontvangt, wordt geacht
      op elke dag, waarover hij die uitkering ontvangt, een loon te ontvangen, gelijk aan die uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel7
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
  - number: '14.1'
    text: |-
      Voor de berekening van een arbeidsongeschiktheidsuitkering waarop op grond van deze wet recht
      bestaat wordt als dagloon beschouwd 1/261 deel van het loon dat de werknemer in de periode van één
      jaar, die eindigt op de laatste dag van het aangiftetijdvak voorafgaande aan het aangiftetijdvak
      waarin de arbeidsongeschiktheid is ingetreden, verdiende, doch ten hoogste het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1], met betrekking tot een loontijdvak
      van een dag.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
  - number: '14.2'
    text: |-
      Bij algemene maatregel van bestuur worden ten aanzien van de vaststelling van het dagloon, bedoeld in het eerste
      lid, en de herziening ervan nadere en zo nodig afwijkende regels gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel14
  - number: '15.1'
    text: |-
      De daglonen worden herzien met ingang van de dag waarop en in de mate waarin het bedrag genoemd in
      [artikel 8, eerste lid, onder c, van de Wet minimumloon en minimumvakantiebijslag][ref1] (*Stb.* 1968, 657) wordt
      herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '15.2'
    text: |-
      Onze Minister maakt in de *Staatscourant* bekend met ingang van welke dag en met welk percentage een herziening als
      bedoeld in het eerste lid plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel15
  - number: '15.3'
    text: |-
      Een herziening van de uitkering als gevolg van een herziening van het dagloon vindt plaats zonder dat dit bij
      beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel15
  - number: '15.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen betaalt de herziene uitkering, bedoeld in het derde lid, bij de
      eerstvolgende uitkeringsbetaling nadat de herziening, bedoeld in het eerste lid, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel15
  - number: '16.1'
    text: |-
      De persoon die voor 1 januari 2004 arbeidsongeschikt is geworden en op het tijdstip waarop hij arbeidsongeschikt
      werd, verzekerd was op grond van de verplichte verzekering blijft verzekerd:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel16
  - number: 16.1.a
    text: |-
      gedurende de wachttijd, bedoeld in [artikel 19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 16.1.b
    text: |-
      gedurende vier weken na afloop van de wachttijd, bedoeld in [artikel 19][ref1], indien hij na afloop van die
      wachttijd minder dan 15% arbeidsongeschikt is, doch binnen die vier weken 15% of meer arbeidsongeschikt is;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 16.1.c
    text: gedurende de periode waarover hij recht heeft op arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel16
  - number: '16.2'
    text: |-
      De persoon die arbeidsongeschikt is geworden en op het tijdstip waarop hij arbeidsongeschikt werd, verzekerd was op
      grond van de verplichte verzekering blijft verzekerd:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel16
  - number: 16.2.a
    text: |-
      gedurende vijf jaar na de intrekking, bedoeld in [artikel 43][ref1], indien [artikel 43a, eerste lid][ref2], geen
      toepassing vindt omdat [artikel 43a, vierde lid][ref3], van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
  - number: 16.2.b
    text: |-
      gedurende vijf jaar na het bereiken van het einde van de wachttijd, bedoeld in [artikel 19][ref1], na welke
      wachttijd hij ongeschikt was tot het verrichten van zijn arbeid wegens ziekte of gebreken, maar geen recht
      had op toekenning van een arbeidsongeschiktheidsuitkering omdat hij niet arbeidsongeschikt was, indien
      [artikel 43a, eerste lid][ref2], geen toepassing vindt omdat [artikel 43a, vierde lid][ref3], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
  - number: '17.1'
    text: |-
      De persoon die binnen vier weken na het einde van zijn verzekering meer arbeidsongeschikt wordt, wordt voor het
      recht op herziening van een arbeidsongeschiktheidsuitkering beschouwd alsof hij verzekerd was gebleven. Indien de
      verzekering berust op een dienstbetrekking als bedoeld in [artikel 3][ref1] ontstaat de in de eerste zin bedoelde
      aanspraak op herziening van de uitkering eerst na het beëindigen van de dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: '17.2'
    text: |-
      Het eerste lid blijft buiten toepassing ten aanzien van degene, die in verband met
      [artikel 6, eerste lid, onder a of b][ref1], niet verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel6
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '6'
        hoofdstuk: I
        paragraaf: '2'
  - number: '17.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld op grond waarvan personen die
      niet verzekerd zijn en die arbeidsongeschikt of, die in gevallen als bedoeld in [artikel 37, tweede lid][ref1],
      meer arbeidsongeschikt worden als gevolg van bij die maatregel aan te wijzen beroepsziekten, voor het recht
      op toekenning, onderscheidenlijk herziening van een arbeidsongeschiktheidsuitkering worden beschouwd alsof ze
      verzekerd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel37
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '37'
        hoofdstuk: II
        paragraaf: '2'
  - number: '18.1'
    text: |-
      Arbeidsongeschikt, geheel of gedeeltelijk, is hij die als rechtstreeks en objectief medisch vast te stellen gevolg
      van ziekte, gebreken, zwangerschap of bevalling geheel of gedeeltelijk niet in staat is om met arbeid te verdienen,
      hetgeen gezonde personen, met soortgelijke opleiding en ervaring, ter plaatse waar hij arbeid verricht of het
      laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel18
  - number: '18.2'
    text: |-
      Degene die op en sedert het tijdstip dat zijn verzekering een aanvang neemt, reeds gedeeltelijk arbeidsongeschikt
      is in de zin van het eerste lid, wordt voor wat de door hem aan deze wet te ontlenen aanspraken betreft als
      geheel of gedeeltelijk arbeidsongeschikt aangemerkt, indien hij als rechtstreeks en objectief medisch vast te
      stellen gevolg van ziekte of gebreken geheel of gedeeltelijk niet in staat is om met arbeid te verdienen, hetgeen
      soortgelijke personen, die in dezelfde mate arbeidsongeschikt zijn in de zin van het eerste lid, ter plaatse waar
      hij arbeid verricht of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen.
      De eerste zin blijft buiten toepassing ten aanzien van degene die onmiddellijk voorafgaande aan het tijdstip,
      waarop de verzekering een aanvang nam, ononderbroken onbetaald verlof, tot een maximum van achttien maanden,
      heeft genoten, behoudens voorzover het betreft gedeeltelijke arbeidsongeschiktheid in de zin van het eerste lid,
      die bestond op de dag, voorafgaande aan de eerste dag van dit verlof. Als ononderbroken onbetaald verlof wordt
      aangemerkt perioden van onbetaald verlof die elkaar met een onderbreking van minder dan een maand opvolgen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel18
  - number: '18.3'
    text: |-
      Indien de bij de aanvang van de verzekering aanwezige arbeidsongeschiktheid in de zin van het eerste lid naderhand
      is afgenomen vindt het tweede lid vervolgens overeenkomstige toepassing, met dien verstande dat voor de aanvang
      van de verzekering in de plaats treedt het tijdstip waarop de arbeidsongeschiktheid in de zin van het eerste lid
      is afgenomen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel18
  - number: '18.4'
    text: |-
      Het tweede en derde lid vinden geen toepassing indien bij de aanvang van de verzekering de betrokkene uit hoofde
      van een vroegere verzekeringsperiode reeds een arbeidsongeschiktheidsuitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel18
  - number: '18.5'
    text: |-
      In het eerste en tweede lid wordt onder de eerstgenoemde arbeid verstaan alle algemeen geaccepteerde arbeid waartoe
      de verzekerde met zijn krachten en bekwaamheden in staat is.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel18
  - number: '18.6'
    text: |-
      Bij de vaststelling van de mate van arbeidsongeschiktheid wordt buiten beschouwing gelaten of de verzekerde de
      arbeid feitelijk kan verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel18
  - number: '18.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het bepaalde in dit artikel nadere en zo
      nodig afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel18
  - number: '18.9'
    text: |-
      De voordracht voor een krachtens het achtste lid vast te stellen algemene maatregel van bestuur, dan wel de
      vaststelling van een ministeriële regeling op basis van een dergelijke algemene maatregel van bestuur, wordt
      niet gedaan dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden
      om binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze
      Minister te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers van de Staten-Generaal
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel18
  - number: '18.10'
    text: |-
      Bij de beoordeling van arbeidsongeschiktheid als bedoeld in deze wet maakt de verzekeringsarts zo veel mogelijk
      gebruik van de bij ministeriële regeling vastgelegde wetenschappelijke inzichten die de beoordeling van
      arbeidsongeschiktheid kunnen ondersteunen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel18
  - number: '19.1'
    text: |-
      De verzekerde, die arbeidsongeschikt wordt, heeft, zodra hij onafgebroken 104 weken arbeidsongeschikt is
      geweest, recht op toekenning van arbeidsongeschiktheidsuitkering, indien hij na afloop van deze periode nog
      arbeidsongeschikt is. Als eerste dag van de arbeidsongeschiktheid geldt de eerste werkdag waarop wegens ziekte niet
      is gewerkt of het werken tijdens de werktijd is gestaakt. Bij ministeriële regeling kunnen nadere regels worden
      gesteld en kunnen dagen waarop niet zou worden gewerkt als werkdag worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel19
  - number: '19.2'
    text: |-
      Voor het bepalen van het tijdvak van 104 weken, bedoeld in het vorige lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier
      weken opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering in
      verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2] of
      [3:10, eerste lid, van de Wet arbeid en zorg][ref3] wordt genoten, tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '19.3'
    text: |-
      Recht op toekenning van arbeidsongeschiktheidsuitkering heeft eveneens de verzekerde, bedoeld in het eerste lid,
      die na afloop van het in het eerste, tweede, en zevende lid bedoelde tijdvak niet arbeidsongeschikt is, doch ten
      aanzien van wie dit wel het geval is binnen vier weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel19
  - number: '19.4'
    text: |-
      Voor de toepassing van het bepaalde in de vorige leden wordt niet als arbeidsongeschikt beschouwd degene, die
      minder dan 15% arbeidsongeschikt is.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel19
  - number: '19.5'
    text: |-
      Voor het bepalen van het tijdvak van 104 weken, bedoeld in de vorige leden, worden steeds in aanmerking genomen
      tijdvakken, gedurende welke aanspraak bestaat op ziekengeld krachtens de [Ziektewet][ref1] en worden niet in
      aanmerking genomen tijdvakken gedurende welke een uitkering wordt genoten als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '19.6'
    text: |-
      Voor de toepassing van het bepaalde in het vorige lid wordt een belanghebbende geacht aanspraak te hebben op
      ziekengeld krachtens de [Ziektewet][ref1], indien hem in verband met de [artikelen 19a][ref2], [19b][ref3],
      [19c][ref4], [29][ref5], [30][ref6], [31][ref7], [44][ref8] en [45 van de Ziektewet][ref9] geen ziekengeld wordt
      uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel19b
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel19c
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref6]: https://wetten.overheid.nl/BWBR0001888#Artikel30
      [ref7]: https://wetten.overheid.nl/BWBR0001888#Artikel31
      [ref8]: https://wetten.overheid.nl/BWBR0001888#Artikel44
      [ref9]: https://wetten.overheid.nl/BWBR0001888#Artikel45
