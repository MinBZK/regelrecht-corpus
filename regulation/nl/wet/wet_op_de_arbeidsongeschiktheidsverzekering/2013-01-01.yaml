  - number: 98c
    text: |-
      Onze Minister kan ter bevordering van de veiligheid van de arbeid van verzekerden alsmede van de gezondheid van
      verzekerden bij de arbeid, regelen stellen inzake het door de werkgever vastleggen van gegevens en het verstrekken
      van inlichtingen door de werkgever aan het Uitvoeringsinstituut werknemersverzekeringen en een bij die regelen aan
      te wijzen instelling omtrent bedrijfsongevallen en beroepsziekten.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel98c
  - number: 98d
    text: |-
      [Artikel 14][ref1] en de daarop berustende bepalingen, zoals die luidden op de dag voorafgaand aan de dag van
      inwerkingtreding van artikel V, onderdeel A, van de Wet administratieve lastenverlichting en vereenvoudiging in
      socialeverzekeringswetten, blijven van toepassing op de persoon wiens recht op arbeidsongeschiktheidsuitkering
      is ontstaan voor de datum van inwerkingtreding van dat artikel, met betrekking tot die
      arbeidsongeschiktheidsuitkering. Met betrekking tot de [artikelen 40, eerste lid][ref2], en [48, derde lid][ref3],
      is de eerste zin niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel48
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel98d
