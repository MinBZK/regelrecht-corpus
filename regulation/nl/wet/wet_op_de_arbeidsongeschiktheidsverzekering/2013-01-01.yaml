  - number: 43a.4
    text: |-
      Dit artikel vindt geen toepassing, indien op grond van [artikel 47][ref1] aanspraak bestaat op heropening van de
      arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel47
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '47'
        hoofdstuk: II
        paragraaf: '2'
  - number: 43a.5
    text: |-
      De [artikelen 19a][ref1] en [19b][ref2] en de daarop berustende bepalingen zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19b
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 19a
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 19b
        hoofdstuk: II
        paragraaf: '1'
  - number: 43a.6
    text: |-
      Indien de arbeidsongeschiktheidsuitkering op grond van dit artikel wordt toegekend en tevens recht op
      ziekengeld op grond van de [Ziektewet][ref1] bestaat, wordt de arbeidsongeschiktheidsuitkering uitbetaald
      voor zover deze het ziekengeld overtreft, danwel zou overtreffen, indien het ziekengeld op grond van
      [artikel 45 van de Ziektewet][ref2] geheel of gedeeltelijk is geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel45
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '45'
  - number: 43b.1
    text: De arbeidsongeschiktheidsuitkering wordt ingetrokken indien de verzekerde niet meer in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43b
  - number: 43b.2
    text: |-
      [Artikel 20, tweede, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel20
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '20'
        hoofdstuk: II
        paragraaf: '1'
  - number: 43c
    text: |-
      In de gevallen waarin [artikel 43a][ref1] toepassing vindt wordt het aan de toe te kennen
      arbeidsongeschiktheidsuitkering ten grondslag te leggen dagloon niet lager gesteld dan het dagloon dat voor de
      berekening van de laatstelijk ontvangen loondervingsuitkering in aanmerking werd genomen, dan wel het dagloon
      dat in aanmerking zou zijn genomen indien na het einde van de in [artikel 19][ref2], bedoelde wachttijd recht zou
      hebben bestaan op een loondervingsuitkering, zoals dat sinds de beëindiging van de uitkering onderscheidenlijk
      sinds het einde van die wachttijd op grond van [artikel 15][ref3] zou zijn herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel15
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '19'
