  - number: '44.1'
    text: |-
      Indien degene, die recht heeft op een arbeidsongeschiktheidsuitkering, inkomen geniet doordat hij arbeid is gaan
      verrichten, wordt die arbeid gedurende een aaneengesloten tijdvak van vijf jaar niet aangemerkt als arbeid als
      bedoeld in [artikel 18, vijfde lid][ref1], en wordt de arbeidsongeschiktheidsuitkering niet ingetrokken of herzien,
      doch wordt de uitkering:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
  - number: 44.1.a
    text: |-
      niet uitbetaald indien het inkomen zodanig is, dat als die arbeid wel de in [artikel 18, vijfde lid][ref1],
      bedoelde arbeid zou zijn, niet langer sprake zou zijn van een arbeidsongeschiktheid van ten minste 15%; of


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
  - number: 44.1.b
    text: |-
      indien het bepaalde onder a niet van toepassing is, uitbetaald tot een bedrag ter grootte van
      de arbeidsongeschiktheidsuitkering, zoals deze zou zijn vastgesteld, indien die arbeid wel de in
      [artikel 18, vijfde lid][ref1], bedoelde arbeid zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
  - number: '44.2'
    text: |-
      Het in het eerste lid genoemde tijdvak van vijf jaar vangt aan op de eerste dag waarop arbeid wordt verricht,
      waarbij een nieuw tijdvak als bedoeld in het eerste lid aanvangt indien diegene andere arbeid gaat verrichten.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel44
  - number: '44.3'
    text: |-
      Indien op de laatste dag van het in het eerste lid genoemde tijdvak van vijf jaar inkomen wordt genoten, maar geen
      arbeid wordt verricht, wordt dit tijdvak verlengd tot en met de laatste dag waarop dat inkomen wordt genoten.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel44
  - number: '44.4'
    text: |-
      Indien degene, die recht heeft op een arbeidsongeschiktheidsuitkering, inkomen geniet, dat
      bestaat uit loon ingevolge een arbeidsovereenkomst als bedoeld in de [hoofdstukken 2][ref1] en
      [3 van de Wet sociale werkvoorziening][ref2], is het eerste lid voor onbeperkte duur van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        hoofdstuk: '3'
  - number: '44.5'
    text: |-
      Onze Minister kan bepalen dat het eerste lid voor onbeperkte duur toepassing vindt ten aanzien van bepaalde groepen
      personen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel44
  - number: '44.6'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het eerste lid. Deze regels hebben in elk geval
      betrekking op de gevallen waarin het eerste lid buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel44
  - number: '44.7'
    text: |-
      Bij ministeriële regeling wordt bepaald wat onder inkomen als bedoeld in dit artikel wordt verstaan. Daarbij kan
      tevens worden bepaald dat nader te bepalen inkomen dat gedeeltelijk, niet, of niet langer wordt genoten als gevolg
      van gewijzigde omstandigheden of enig handelen of nalaten van betrokkene in aanmerking wordt genomen alsof het wel
      volledig wordt genoten.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel44
  - number: '47.1'
    text: |-
      Degene, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45 %, in
      verband met het bepaalde in [artikel 43, eerste lid][ref1], is ingetrokken, heeft, indien hij binnen vier weken na
      de dag, met ingang van welke de uitkering is ingetrokken, weer arbeidsongeschikt wordt, aanspraak op heropening van
      de arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
  - number: '47.2'
    text: |-
      Het bepaalde in het vorige lid is mede van toepassing met betrekking tot degene, wiens
      arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan 45 %, in verband met het
      bepaalde in [artikel 43, eerste lid][ref1], is ingetrokken, indien hij weer arbeidsongeschikt wordt binnen 4 weken
      na de dag, met ingang van welke die uitkering, welke voordien was berekend naar een arbeidsongeschiktheid van ten
      minste 45 %, wegens afneming van de arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder
      dan 45%.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
  - number: '47.3'
    text: |-
      Degene, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan 45 %,
      in verband met het bepaalde in [artikel 43, eerste lid][ref1], is ingetrokken met ingang van een dag, die
      gelegen is binnen vier weken na de dag, met ingang waarvan die uitkering werd toegekend of wegens toegenomen
      arbeidsongeschiktheid werd herzien, heeft, indien hij binnen die periode van vier weken weer arbeidsongeschikt
      wordt, aanspraak op heropening van de arbeidsongeschiktheidsuitkering. [Artikel 39, tweede lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel39
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '39'
        hoofdstuk: II
        paragraaf: '2'
  - number: '47.4'
    text: |-
      Degene, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan 45 %, in
      verband met het bepaalde in [artikel 43, eerste lid][ref1], is ingetrokken, heeft, onverminderd het bepaalde in het
      tweede en het derde lid, indien hij binnen vier weken na de dag, met ingang van welke de uitkering is ingetrokken,
      weer arbeidsongeschikt wordt, niet kennelijk uit een andere oorzaak dan die, waaruit de arbeidsongeschiktheid,
      ter zake waarvan de ingetrokken uitkering werd genoten, is voortgekomen, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
  - number: '47.5'
    text: |-
      Ten aanzien van degene wiens arbeidsongeschiktheidsuitkering is ingetrokken in verband met
      [artikel 43, eerste lid][ref1], en die weer arbeidsongeschikt is geworden op grond van een herbeoordeling als
      bedoeld in [artikel 34, vijfde lid][ref2], vindt heropening van de arbeidsongeschiktheidsuitkering plaats met
      ingang van 22 februari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel34
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
  - number: '47.6'
    text: |-
      De heropening gaat in op de dag, met ingang van welke de betrokkene weer arbeidsongeschikt is geworden en vindt
      plaats naar de mate van arbeidsongeschiktheid op die dag.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47
  - number: '47.7'
    text: |-
      Indien zowel recht bestaat of is ontstaan op heropening van de arbeidsongeschiktheidsuitkering op grond van dit
      artikel als op ziekengeld op grond van de Ziektewet, wordt de arbeidsongeschiktheidsuitkering uitbetaald voor
      zover deze het ziekengeld overtreft, danwel zou overtreffen, indien het ziekengeld op grond van artikel 45 van de
      Ziektewet geheel of gedeeltelijk is geweigerd.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47
  - number: '47.8'
    text: |-
      De [artikelen 17, tweede lid][ref1], [19, vierde lid][ref2], [19a][ref3], [19b][ref4] en de daarop berustende
      bepalingen, en [35, tweede lid][ref5], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel19a
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel19b
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel35
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '17'
        hoofdstuk: I
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 19a
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 19b
        hoofdstuk: II
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
  - number: '47.9'
    text: De arbeidsongeschiktheidsuitkering wordt op aanvraag of ambtshalve heropend.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47
  - number: 47a.1
    text: |-
      De persoon, wiens arbeidsongeschiktheidsuitkering op grond van [artikel 43b, eerste lid][ref1], is ingetrokken,
      heeft vanaf de dag:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43b
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43b
        hoofdstuk: II
        paragraaf: '2'
  - number: 47a.1.a
    text: dat hij in Nederland woont; of
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47a
  - number: 47a.1.b
    text: |-
      waarop een verdrag in werking is getreden dan wel een besluit van een volkenrechtelijke organisatie van kracht is
      geworden in het land waar betrokkene woont, op grond waarvan recht op arbeidsongeschiktheidsuitkering kan bestaan;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47a
  - number: 47a.2
    text: |-
      Aanspraak op heropening van de arbeidsongeschiktheidsuitkering heeft eveneens de persoon, bedoeld in het eerste
      lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval is
      binnen vier weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47a
  - number: 47a.3
    text: |-
      De [artikelen 19, vierde lid][ref1], [35][ref2] en [47, achtste lid][ref3], zijn van overeenkomstige toepassing met
      betrekking tot de aanspraak op heropening van de arbeidsongeschiktheidsuitkering, bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel47
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '47'
        hoofdstuk: II
        paragraaf: '2'
  - number: 47b.1
    text: |-
      De persoon, wiens arbeidsongeschiktheidsuitkering op grond van [artikel 43, vijfde lid][ref1], is ingetrokken,
      heeft vanaf de dag dat hij in vrijheid wordt gesteld met inachtneming van de bepalingen van deze wet aanspraak op
      heropening van de arbeidsongeschiktheidsuitkering, indien hij op die dag arbeidsongeschikt is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
  - number: 47b.2
    text: |-
      Aanspraak op heropening van de arbeidsongeschiktheidsuitkering heeft eveneens de persoon, bedoeld in het eerste
      lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval is
      binnen vier weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47b
  - number: 47b.3
    text: |-
      De [artikelen 19, vierde lid][ref1], [35][ref2], en [47, achtste lid][ref3], zijn van overeenkomstige toepassing
      met betrekking tot de aanspraak op heropening van de arbeidsongeschiktheidsuitkering, bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel47
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '47'
        hoofdstuk: II
        paragraaf: '2'
  - number: 47b.4
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op bij algemene maatregel van bestuur aan te wijzen
      categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel buiten een
      justitiële inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47b
  - number: 47c.1
    text: |-
      De persoon, wiens arbeidsongeschiktheidsuitkering op grond van [artikel 43, zesde lid][ref1], is ingetrokken,
      heeft vanaf de dag dat hij zich niet langer onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of
      vrijheidsbenemende maatregel met inachtneming van de bepalingen van deze wet aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering, indien hij op die dag arbeidsongeschikt is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
  - number: 47c.2
    text: |-
      Aanspraak op heropening van de arbeidsongeschiktheidsuitkering heeft eveneens de persoon, bedoeld in het eerste
      lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval is
      binnen vier weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47c
  - number: 47c.3
    text: |-
      De [artikelen 19, vierde lid][ref1], [35][ref2], en [47, achtste lid][ref3], zijn van overeenkomstige toepassing
      met betrekking tot de aanspraak op heropening van de arbeidsongeschiktheidsuitkering, bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel47
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel47c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '47'
        hoofdstuk: II
        paragraaf: '2'
  - number: '48.1'
    text: De arbeidsongeschiktheidsuitkering wordt heropend door het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel48
  - number: '48.2'
    text: |-
      De heropende arbeidsongeschiktheidsuitkering wordt beschouwd als een voortzetting van de ingetrokken uitkering.
      Voor de toepassing van de [artikelen 38, derde lid][ref1], [39, eerste lid, onderdeel c][ref2], en [39a][ref3]
      wordt daarbij met herziening van de arbeidsongeschiktheidsuitkering wegens afneming van de arbeidsongeschiktheid
      gelijk gesteld intrekking van de arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel39a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '38'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '39'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 39a
        hoofdstuk: II
        paragraaf: '2'
  - number: '48.3'
    text: |-
      Voor de berekening van de heropende arbeidsongeschiktheidsuitkering wordt als dagloon of vervolgdagloon beschouwd
      het dagloon of vervolgdagloon, waarnaar de ingetrokken uitkering op de dag van ingang van de heropende uitkering
      zou zijn berekend, indien de uitkering niet was ingetrokken, tenzij hernieuwde vaststelling van een dagloon
      overeenkomstig het bepaalde bij of krachtens [artikel 14][ref1] en met inachtneming van [artikel 15][ref2] tot
      een hoger dagloon of vervolgdagloon leidt, in welk geval de heropende uitkering aan de hand van dit dagloon of
      vervolgdagloon wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel15
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '14'
        hoofdstuk: I
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '15'
        hoofdstuk: I
        paragraaf: '4'
  - number: '49.1'
    text: |-
      De arbeidsongeschiktheidsuitkering neemt een einde met ingang van de dag waarop de betrokkene de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '49.2'
    text: |-
      Toekenning of heropening van arbeidsongeschiktheidsuitkering vindt niet plaats, indien de uitkering
      onderscheidenlijk de heropening zou ingaan op of na de in het eerste lid bedoelde dag.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel49
  - number: '50.1'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt betaalbaar gesteld door het Uitvoeringsinstituut werknemersverzekeringen.
      De betaling geschiedt als regel in termijnen van niet langer dan een maand.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel50
  - number: '50.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van de arbeidsongeschiktheidsuitkering op of
      schorst het de betaling, indien het op grond van duidelijke aanwijzingen van oordeel is of het gegronde vermoeden
      heeft dat:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel50
  - number: 50.2.a
    text: het recht op uitkering niet of niet meer bestaat;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel50
  - number: 50.2.b
    text: recht op een lagere uitkering bestaat;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel50
  - number: 50.2.c
    text: |-
      degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend of zijn wettelijke vertegenwoordiger een
      verplichting als bedoeld in [artikel 25][ref1], [28][ref2] of [80][ref3] niet of niet behoorlijk is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '25'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '28'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: '50.3'
    text: |-
      Indien de arbeidsongeschiktheidsuitkering in het buitenland wordt uitbetaald, geschiedt de betaling in afwijking
      van [artikel 4:89, derde lid, van de Algemene wet bestuursrecht][ref1] op het tijdstip waarop de rekening van de
      daartoe door de schuldeiser aangewezen bank wordt gecrediteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '50.4'
    text: |-
      Wanneer degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend, een ander machtigt om de uitkering in
      ontvangst te nemen, onderscheidenlijk een verleende machtiging intrekt, wordt daaraan gevolg gegeven met ingang van
      een betalingstermijn, aanvangende na de dag waarop de machtiging wordt ingediend, onderscheidenlijk waarop van haar
      intrekking mededeling wordt gedaan, doch niet later dan de eerste dag van de tweede maand na de dag van indiening
      onderscheidenlijk intrekking der machtiging.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel50
  - number: '50.5'
    text: |-
      Onze Minister kan regelen vaststellen inzake de betaalbaarstelling van de arbeidsongeschiktheidsuitkering door
      organen, welke belast zijn met de uitbetaling van invaliditeitsuitkering of van pensioen uit anderen hoofde dan
      ingevolge deze wet.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel50
  - number: '50.6'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd om, onder door hem te stellen voorwaarden, op
      verzoek van de in het vorige lid bedoelde organen, gelijktijdig met de arbeidsongeschiktheidsuitkering,
      invaliditeitsuitkeringen of pensioenen, verschuldigd door die organen, betaalbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel50
  - number: '50.7'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt regels omtrent de betaalbaarstelling van de
      arbeidsongeschiktheidsuitkering in gevallen waarin de verzekerde recht heeft op een arbeidsongeschiktheidsuitkering
      over een periode waarover hij tevens een uitkering op grond van de [Werkloosheidswet][ref1] ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '50.8'
    text: |-
      Indien een reïntegratiebedrijf aan het Uitvoeringsinstituut werknemersverzekeringen heeft gemeld dat het
      gegronde vermoeden bestaat dat een persoon aan wie een uitkering op grond van deze wet is toegekend, onvoldoende
      medewerking verleent aan de op hem betrekking hebbende werkzaamheden van het reïntegratiebedrijf, neemt het
      Uitvoeringsinstituut werknemersverzekeringen een beschikking omtrent de gehele of gedeeltelijke opschorting of
      schorsing van de betaling van de uitkering aan die persoon voor de duur van ten hoogste acht weken.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel50
  - number: '50.9'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt het reïntegratiebedrijf in kennis van een beschikking tot
      opschorting of schorsing als bedoeld in het achtste lid.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel50
  - number: 50a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van een uitkering ingevolge deze wet op indien
      degene aan wie uitkering is toegekend een vreemdeling is die niet rechtmatig in Nederland verblijf houdt als
      bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 50a.2
    text: |-
      De betaling van een uitkering ingevolge deze wet wordt hervat indien betrokkene daartoe een aanvraag indient en het
      het Uitvoeringsinstituut werknemersverzekeringen is gebleken dat hij feitelijk buiten Nederland woont of verblijf
      houdt.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel50a
  - number: '51'
    text: |-
      Voor zover betreft het in ontvangst nemen van een uitkering ingevolge deze wet en het verlenen van kwijting
      voor de betaling daarvan, wordt een minderjarige met een meerderjarige gelijkgesteld. Indien de wettelijke
      vertegenwoordiger zich tegen de betaling aan de minderjarige schriftelijk verzet bij het Uitvoeringsinstituut
      werknemersverzekeringen geschiedt de uitbetaling aan de wettelijke vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel51
  - number: '53.1'
    text: |-
      Na het overlijden van degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend, wordt met ingang van de dag
      na het overlijden, de arbeidsongeschiktheidsuitkering in de vorm van een overlijdensuitkering uitbetaald:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel53
  - number: 53.1.a
    text: aan de langstlevende van de echtgenoten;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel53
  - number: 53.1.b
    text: |-
      bij ontstentenis van de in onderdeel *a* bedoelde persoon, aan de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel53
  - number: 53.1.c
    text: |-
      bij ontstentenis van de in de onderdelen *a* en *b* bedoelde personen, aan degenen met wie de overledene in
      gezinsverband leefde.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel53
  - number: '53.2'
    text: |-
      De overlijdensuitkering is gelijk aan het bedrag van de arbeidsongeschiktheidsuitkering over één maand, doch niet
      over de zaterdagen en zondagen, berekend naar de hoogte van die uitkering op de dag of laatstelijk voor de dag van
      overlijden, van degene aan wie die arbeidsongeschiktheidsuitkering is toegekend.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel53
  - number: '53.3'
    text: |-
      In verband met het overlijden van degene aan wie een arbeidsongeschiktheidsuitkering is toegekend, is
      [artikel 49, eerste lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel49
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '49'
        hoofdstuk: II
        paragraaf: '2'
  - number: '53.4'
    text: |-
      De overlijdensuitkering wordt ambtshalve of op verzoek aan de rechthebbende of rechthebbenden genoemd in het eerste
      lid, door het Uitvoeringsinstituut werknemersverzekeringen uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel53
  - number: '53.5'
    text: De overlijdensuitkering wordt in een bedrag ineens uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel53
  - number: '53.6'
    text: |-
      Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan arbeidsongeschiktheidsuitkering dat,
      over na het overlijden gelegen dagen reeds is uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel53
  - number: '54.1'
    text: |-
      Indien de degene aan wie een arbeidsongeschiktheidsuitkering is toegekend, aanspraak heeft op verstrekking
      of vergoeding van zorg als bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref1] en op grond van
      [die wet][ref2] een bijdrage voor die zorg verschuldigd is, is het Uitvoeringsinstituut werknemersverzekeringen
      bevoegd de arbeidsongeschiktheidsuitkering tot het bedrag van die bijdrage in plaats van aan degene aan wie
      de arbeidsongeschiktheidsuitkering is toegekend, zonder diens machtiging uit te betalen aan het College voor
      zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002614
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0002614
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '54.2'
    text: |-
      Indien degene, aan wie een arbeidsongeschiktheidsuitkering is toegekend, in een inrichting ter verpleging van
      geesteszieken of van zwakzinnigen is opgenomen en het Uitvoeringsinstituut werknemersverzekeringen, van de
      desbetreffende inrichting of van het college van burgemeester en wethouders van de gemeente die de opnamekosten
      betaalt, het verzoek ontvangt om de arbeidsongeschiktheidsuitkering aan die inrichting of die gemeente uit te
      betalen, is het Uitvoeringsinstituut werknemersverzekeringen bevoegd dat verzoek zonder het stellen van andere
      voorwaarden in te willigen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel54
  - number: '54.3'
    text: |-
      Indien het eerste lid toepassing vindt, heeft de in het tweede lid bedoelde bevoegdheid betrekking op het gedeelte
      van de arbeidsongeschiktheidsuitkering, dat niet aan het College voor zorgverzekeringen wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel54
  - number: '54.4'
    text: |-
      Een herziening van de uitkering op grond van het eerste lid als gevolg van een wijziging van de verschuldigde
      bijdrage vindt plaats zonder dat dit bij beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel54
  - number: '56'
    text: |-
      De termijnen van de arbeidsongeschiktheidsuitkering, welke niet zijn ingevorderd binnen twee jaren na de dag der
      betaalbaarstelling, worden niet meer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel56
  - number: '57.1'
    text: |-
      De uitkering, de loonsuppletie, bedoeld in [artikel 65c][ref1], en de inkomenssuppletie, bedoeld in
      [artikel 65d][ref2], die als gevolg van een beschikking als bedoeld in [artikel 36a][ref3] onverschuldigd
      is betaald, alsmede hetgeen anderszins onverschuldigd is betaald, wordt door het Uitvoeringsinstituut
      werknemersverzekeringen teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel65c
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel65d
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel36a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 65c
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 65d
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 36a
        hoofdstuk: II
        paragraaf: '2'
  - number: '57.2'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van terugvordering
      of van verdere terugvordering af te zien, indien degene van wie wordt teruggevorderd:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57
  - number: 57.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57
  - number: 57.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57
  - number: 57.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57
  - number: 57.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57
  - number: '57.3'
    text: |-
      De in het tweede lid, onderdelen a, b en c, genoemde termijn is tien jaar indien de terugvordering het gevolg is
      van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 80][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: '57.4'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57
  - number: 57.4.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de artikelen [475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 57.4.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 80][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: '57.5'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57
  - number: '57.6'
    text: |-
      Degene van wie wordt teruggevorderd is verplicht desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen
      de inlichtingen te verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57
  - number: '57.7'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen, onder voorwaarden die Onze
      Minister kan stellen, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze
      Minister vast te stellen bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57
  - number: 57a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan de onverschuldigd betaalde uitkering, bedoeld in
      [artikel 57, eerste lid][ref1], invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel57
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '57'
        hoofdstuk: II
        paragraaf: '2'
  - number: 57a.2
    text: |-
      [Artikel 29g][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de artikelen [475c][ref2] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan, het Uitvoeringsinstituut
      werknemersverzekeringen de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel29g
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 29g
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 57b
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij is vastgesteld dat onverschuldigd is betaald.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel57b
  - number: '58.1'
    text: |-
      In afwijking van [artikel 57, eerste lid][ref1], kan het Uitvoeringsinstituut werknemersverzekeringen, op
      verzoek van de belanghebbende of zijn wettelijke vertegenwoordiger, besluiten gedeeltelijk van terugvordering of
      gedeeltelijk van verdere terugvordering af te zien door medewerking aan een schuldregeling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel57
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '57'
        hoofdstuk: II
        paragraaf: '2'
  - number: 58.1.a
    text: |-
      redelijkerwijs te voorzien is dat de belanghebbende niet zal kunnen voortgaan met het betalen van zijn schulden of
      indien hij in de toestand verkeert dat hij heeft opgehouden te betalen;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel58
  - number: 58.1.b
    text: |-
      redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde vorderingen, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel58
  - number: 58.1.c
    text: |-
      de vordering van het Uitvoeringsinstituut werknemersverzekeringen wegens onverschuldigde betaling ten minste zal
      worden voldaan naar evenredigheid met de vorderingen van de schuldeisers van gelijke rang;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel58
  - number: 58.1.d
    text: |-
      een naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen betrouwbaar voorstel voor
      een schuldregeling tot stand is gekomen door tussenkomst van een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel48
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '48'
  - number: 58.1.e
    text: aannemelijk is dat medewerking aan een schuldregeling niet concurrentieverstorend werkt; en
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel58
  - number: 58.1.f
    text: |-
      uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel349
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '349'
  - number: '58.2'
    text: |-
      Het eerste lid is niet van toepassing indien een vordering is ontstaan door het niet nakomen door de belanghebbende
      van de verplichting, bedoeld in [artikel 80][ref1], en hiervoor een boete als bedoeld in [artikel 29a][ref2] is
      opgelegd, dan wel indien hiervoor aangifte is gedaan op grond van het [Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel29a
      [ref3]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 29a
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0001854
  - number: '58.3'
    text: |-
      Het besluit tot het afzien van terugvordering of van verdere terugvordering wordt ingetrokken of ten nadele van
      belanghebbende gewijzigd indien:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel58
  - number: 58.3.a
    text: |-
      niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling tot stand is gekomen die voldoet
      aan de eisen, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel58
  - number: 58.3.b
    text: |-
      de belanghebbende zijn schuld aan het Uitvoeringsinstituut werknemersverzekeringen niet overeenkomstig de
      schuldregeling voldoet; of
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel58
  - number: 58.3.c
    text: |-
      onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een ander
      besluit zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel58
  - number: '58.4'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld ten aanzien van de
      bevoegdheid om mee te werken aan schuldregelingen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel58
  - number: '59'
    text: |-
      Een vordering van het Uitvoeringsinstituut werknemersverzekeringen als bedoeld in
      [artikel 57][ref1] en [58][ref2] is bevoorrecht en volgt onmiddellijk na de vorderingen, bedoeld in
      [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel288
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '57'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '58'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '288'
  - number: 59a
    text: Degene, die recht heeft op arbeidsongeschiktheidsuitkering, heeft recht op een vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel59a
  - number: 59b.1
    text: |-
      De vakantie-uitkering bedraagt 8 pct. van het bedrag aan arbeidsongeschiktheidsuitkering, waarop recht bestond in
      de periode van twaalf maanden, voorafgaande aan de maand mei.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel59b
  - number: 59b.2
    text: |-
      Indien [artikel 44][ref1] is toegepast, wordt onder het bedrag aan arbeidsongeschiktheidsuitkering als bedoeld in
      het eerste lid verstaan het bedrag van de arbeidsongeschiktheidsuitkering, nadat [artikel 44][ref2] is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel44
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
  - number: 59b.3
    text: De uitbetaling van de vakantie-uitkering vindt eenmaal per jaar ambtshalve plaats in de maand mei.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel59b
  - number: 59b.4
    text: |-
      Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1], wordt gewijzigd, wordt
      het percentage van de in het eerste lid bedoelde vakantie-uitkering, alsmede de noemer van de in de
      [artikelen 21, tweede lid][ref2] en [22][ref3], bedoelde breuk dienovereenkomstig aangepast. Het gewijzigde
      percentage wordt in aanmerking genomen over de uitkering waarop recht bestaat over de periode aanvangende met de
      dag waarop de wijziging ingaat. Het aldus gewijzigde percentage en de aldus gewijzigde noemer treden in de plaats
      van het in het eerste lid genoemde percentage onderscheidenlijk de in de artikelen 21, tweede lid en 22, genoemde
      noemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel22
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '21'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '22'
        hoofdstuk: II
        paragraaf: '1'
  - number: 59b.5
    text: De vakantie-uitkering wordt betaald zonder dat dit bij beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel59b
  - number: 59b.6
    text: |-
      In afwijking van het derde lid vindt, indien de arbeidsongeschiktheidsuitkering wordt beëindigd en het niet
      aannemelijk is dat binnen korte tijd wederom recht op een arbeidsongeschiktheidsuitkering zal ontstaan,
      uitbetaling van de vakantieuitkering plaats gelijktijdig met de uitbetaling van de laatste termijn van de
      arbeidsongeschiktheidsuitkering of zo spoedig mogelijk daarna.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel59b
  - number: 59b.7
    text: |-
      Indien na de toepassing van het zesde lid wederom recht op een arbeidsongeschiktheidsuitkering ontstaat en
      dientengevolge het derde lid of het zesde lid moet worden toegepast, wordt daarbij rekening gehouden met hetgeen
      met toepassing van het zesde lid reeds werd uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel59b
  - number: 59c
    text: |-
      Onze Minister kan nadere regelen stellen ter berekening van de vakantie-uitkering van degene, wiens
      arbeidsongeschiktheidsuitkering met toepassing van het bepaalde krachtens [artikel 65][ref1] niet of niet ten volle
      wordt uitbetaald en die naast de uitkering ingevolge de wetgeving van een andere Mogendheid eveneens recht heeft op
      een vakantie-uitkering ingevolge die wetgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel65
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel59c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '65'
        hoofdstuk: IIA
  - number: 59d
    text: |-
      Het bepaalde bij of krachtens de [artikelen 50][ref1], [53][ref2], [54][ref3], [56][ref4], [57][ref5] en [80][ref6]
      vindt overeenkomstige toepassing ten aanzien van de vakantie-uitkering voor zover bij of krachtens deze paragraaf
      niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel56
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel57
      [ref6]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel59d
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '50'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '53'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '54'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '56'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: '57'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: 59e
    text: Onze Minister kan met betrekking tot het bepaalde in deze paragraaf nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel59e
  - number: '61'
    text: |-
      Indien een persoon die recht heeft op een arbeidsongeschiktheidsuitkering en op of na de dag waarop hij de
      leeftijd van 45 jaar heeft bereikt inkomen gaat verdienen in verband waarmee zijn arbeidsongeschiktheidsuitkering
      wordt beëindigd, binnen vijf jaar na de datum van die beëindiging opnieuw recht heeft op toekenning van een
      arbeidsongeschiktheidsuitkering, wordt het aan die uitkering ten grondslag te leggen dagloon niet lager gesteld
      dan het dagloon of vervolgdagloon dat voor de berekening van de laatstelijk ontvangen loondervingsuitkering
      of vervolguitkering in aanmerking werd genomen, zoals dat vanaf de beëindiging tot aan de datum van de in
      dit artikel bedoelde toekenning op grond van [artikel 15 van deze wet][ref1], al dan niet in verbinding
      met [artikel 14 van de Wet minimumloon en minimumvakantiebijslag][ref2], zou zijn herzien indien de
      arbeidsongeschiktheidsuitkering niet was beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '15'
        hoofdstuk: I
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '65.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ter voorkoming of beperking van samenloop van
      arbeidsongeschiktheidsuitkering met arbeidsongeschiktheidsuitkering op grond van andere wetten.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65
  - number: '65.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ter voorkoming of beperking van samenloop van
      arbeidsongeschiktheidsuitkering met uitkering op grond van de sociale wetgeving van Aruba, Curaçao, Sint Maarten,
      de sociale wetgeving van Nederland ten behoeve van de openbare lichamen Bonaire, Sint Eustatius en Saba of van een
      andere Mogendheid.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65
  - number: 65a.1
    text: 'Onvervreemdbaar en niet vatbaar voor verpanding en belening zijn:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65a
  - number: 65a.1.a
    text: de arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65a
  - number: 65a.1.b
    text: de vakantie-uitkering;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65a
  - number: 65a.1.c
    text: |-
      de loonsuppletie, bedoeld in [artikel 65c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel65c
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 65c
        hoofdstuk: IIB
  - number: 65a.1.d
    text: |-
      de inkomenssuppletie, bedoeld in [artikel 65d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel65d
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 65d
        hoofdstuk: IIB
  - number: 65a.2
    text: Volmacht tot ontvangst van een uitkering onder welke vorm of benaming ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65a
  - number: 65a.3
    text: Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65a
  - number: 65b
    text: 'Niet vatbaar voor beslag zijn:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65b
  - number: 65b.a
    text: |-
      de verhoging, bedoeld in [artikel 22][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel22
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '22'
        hoofdstuk: II
        paragraaf: '1'
  - number: 65b.b
    text: |-
      de overlijdensuitkering, bedoeld in [artikel 53][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '53'
        hoofdstuk: II
        paragraaf: '2'
  - number: 65c.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan aan de verzekerde die recht heeft op een
      arbeidsongeschiktheidsuitkering en die arbeid in dienstbetrekking aanvaardt of verricht, op aanvraag loonsuppletie
      toekennen, indien zijn loon lager is dan zijn resterende verdiencapaciteit.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65c
  - number: 65c.2
    text: |-
      De loonsuppletie wordt verstrekt over perioden waarin loon uit dienstbetrekking wordt ontvangen, doch ten hoogste
      over een periode van vier jaar te rekenen vanaf de dag met ingang waarvan voor de eerste maal loonsuppletie is
      toegekend.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65c
  - number: 65c.3
    text: |-
      Als perioden waarin loon uit dienstbetrekking wordt ontvangen als bedoeld in het tweede lid worden
      eveneens aangemerkt, perioden waarin een uitkering op grond van de [Ziektewet][ref1] of op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref2] wordt ontvangen, tenzij de dienstbetrekking
      is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65c
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
        paragraaf: '1'
  - number: 65c.4
    text: |-
      De loonsuppletie wordt voor de toepassing van de wettelijke bepalingen inzake premieheffing aangemerkt als een
      uitkering op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65c
  - number: 65c.5
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de hoogte van de loonsuppletie.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65c
  - number: 65d.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan aan de verzekerde die recht heeft op een
      arbeidsongeschiktheidsuitkering, die arbeid als zelfstandige verricht of gaat verrichten, op aanvraag
      inkomenssuppletie toekennen, indien zijn inkomen uit het bedrijf of beroep lager is dan zijn resterende
      verdiencapaciteit.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65d
  - number: 65d.2
    text: |-
      De inkomenssuppletie wordt verstrekt over perioden waarin het bedrijf of beroep wordt uitgeoefend, doch ten hoogste
      over een periode van vier jaar te rekenen vanaf de dag met ingang waarvan voor de eerste maal inkomenssuppletie
      is toegekend.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65d
  - number: 65d.3
    text: |-
      De inkomenssuppletie wordt voor de toepassing van de wettelijke bepalingen inzake premieheffing aangemerkt als een
      uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65d
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 65d.4
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de hoogte van de
      inkomenssuppletie.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65d
  - number: 65f
    text: |-
      De verzekerde die recht heeft op een arbeidsongeschiktheidsuitkering, heeft recht op ondersteuning bij
      arbeidsinschakeling en, met inachtneming van de daarvoor geldende wettelijke bepalingen, op de naar het oordeel van
      het Uitvoeringsinstituut werknemersverzekeringen noodzakelijk geachte voorziening gericht op arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65f
  - number: 65g.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, in het kader van de bevordering van de inschakeling in de
      arbeid, toestemming verlenen aan de verzekerde die recht heeft op een arbeidsongeschiktheidsuitkering, om op een
      proefplaats bij een werkgever gedurende maximaal zes maanden onbeloonde werkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65g
  - number: 65g.2
    text: |-
      Tijdens het verrichten van werkzaamheden op een proefplaats als bedoeld in het eerste lid wordt de
      arbeidsongeschiktheidsuitkering niet ingetrokken of herzien.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65g
  - number: 65g.3
    text: 'De onbeloonde werkzaamheden op een proefplaats als bedoeld in het eerste lid zijn:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65g
  - number: 65g.3.a
    text: werkzaamheden, waartoe de verzekerde, bedoeld in het eerste lid, met zijn krachten en bekwaamheden in staat is;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65g
  - number: 65g.3.b
    text: |-
      werkzaamheden, waarbij de werkgever, bij wie de proefplaatsing geschiedt, een aansprakelijkheids- en
      ongevallenverzekering ten behoeve van de verzekerde, bedoeld in het eerste lid, heeft afgesloten;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65g
  - number: 65g.3.c
    text: |-
      werkzaamheden, die de verzekerde, bedoeld in het eerste lid, niet reeds eerder onbeloond op een proefplaats bij die
      werkgever of diens rechtsvoorganger heeft verricht; en
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65g
  - number: 65g.3.d
    text: |-
      werkzaamheden waarbij er, naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen, een reëel uitzicht
      is op een op de onbeloonde werkzaamheden aansluitende dienstbetrekking van dezelfde of grotere omvang voor ten
      minste 6 maanden.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65g
  - number: 65g.4
    text: |-
      Indien de werkzaamheden, bedoeld in het eerste lid, wegens ziekte worden onderbroken, wordt de periode waarin een
      uitkering bij ziekte wordt ontvangen, voor de toepassing van dat lid buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65g
  - number: 65g.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65g
  - number: 65h
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de aanvraag van loonsuppletie,
      bedoeld in [artikel 65c][ref1], van inkomenssuppletie, bedoeld in [artikel 65d][ref2], de termijn waarbinnen die
      aanvraag wordt ingediend, alsmede omtrent de rechtsgevolgen die aan overschrijding van die termijn zijn verbonden,
      en met betrekking tot de aanvraag en van toestemming als bedoeld in [artikel 65g][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel65c
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel65d
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel65g
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65h
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 65c
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 65d
        hoofdstuk: IIB
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 65g
        hoofdstuk: IIB
  - number: 65k
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan de verzekerde, die recht heeft op een
      arbeidsongeschiktheidsuitkering, en voor wie de kans op inschakeling in het arbeidsproces gering is en die
      daardoor vooralsnog niet bemiddelbaar is op de arbeidsmarkt, onbeloonde additionele werkzaamheden laten verrichten
      gedurende maximaal twee jaar. [Artikel 10a, tweede tot en met tiende lid, van de Wet werk en bijstand][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel65k
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 10a
  - number: '66'
    text: De verzekerde is verzekerd bij het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel66
  - number: '67'
    text: |-
      Voor de toepassing van deze wet gelden aaneensluitende verzekeringen bij het Uitvoeringsinstituut
      werknemersverzekeringen als één verzekering.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel67
  - number: 71a.1
    text: |-
      De werkgever jegens wie de verzekerde, bij ongeschiktheid tot het verrichten van arbeid wegens ziekte, recht
      heeft op loon als bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1] dan wel aanspraak heeft op
      bezoldiging op grond van [artikel 76a, eerste lid, van de Ziektewet][ref2] houdt aantekening van het verloop van de
      arbeidsongeschiktheid en de reïntegratie van de verzekerde.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 76a
  - number: 71a.2
    text: |-
      De werkgever, bedoeld in het eerste lid, stelt binnen een door Onze Minister nader te bepalen termijn, in
      overeenstemming met de verzekerde een plan van aanpak op. De afspraken die in het plan van aanpak zijn gemaakt
      worden door werkgever en verzekerde nageleefd. Het plan van aanpak wordt periodiek geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71a
  - number: 71a.3
    text: |-
      Uiterlijk twee weken voordat de termijn is verstreken waarbinnen de belanghebbende op grond van
      [artikel 34, derde lid, eerste volzin][ref1], zijn aanvraag voor toekenning van de arbeidsongeschiktheidsuitkering
      dient te doen stelt de werkgever, bedoeld in het eerste lid, in overleg met de verzekerde een reïntegratieverslag
      op en verstrekt de werkgever hiervan een afschrift aan de verzekerde.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
  - number: 71a.4
    text: |-
      Indien [artikel 19, zevende lid][ref1], toepassing heeft gevonden:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 71a.4.a
    text: |-
      stelt de werkgever in overleg met de verzekerde, indien hij nog geen reïntegratieverslag heeft opgesteld,
      in afwijking van het derde lid, het reïntegratieverslag uiterlijk 14 weken voor het verstrijken van
      de door het Uitvoeringsinstituut werknemersverzekeringen vastgestelde verlengde wachttijd, bedoeld in
      [artikel 19, zevende lid][ref1], op en verstrekt een afschrift daarvan aan de verzekerde;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 71a.4.b
    text: |-
      vult de werkgever in overleg met de verzekerde, indien hij reeds een reïntegratieverslag heeft opgesteld
      dit reïntegratieverslag uiterlijk 14 weken voor het verstrijken van de door het Uitvoeringsinstituut
      werknemersverzekeringen vastgestelde verlengde wachttijd, bedoeld in [artikel 19, zevende lid][ref1], aan en
      verstrekt een afschrift daarvan aan de verzekerde, tenzij de verzekerde verzoekt dit, in verband met het doen van
      een aanvraag als bedoeld in [artikel 34, derde lid][ref2], eerder te doen. De werkgever komt binnen twee weken aan
      dit verzoek tegemoet. Dit lid is van overeenkomstige toepassing bij een aanvraag voor de uitkering na toepassing
      van [artikel 34a, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel34a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 34a
        hoofdstuk: II
        paragraaf: '2'
  - number: 71a.5
    text: |-
      Bij de uitvoering van het eerste tot en met het vierde lid laat de werkgever zich bijstaan door een persoon,
      als bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref1] die belast is met de bijstand,
      bedoeld in [artikel 14, eerste lid, onderdeel b, van die wet][ref2] of een arbodienst als bedoeld in de
      [Arbeidsomstandighedenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0010346
  - number: 71a.6
    text: |-
      De verzekerde verleent zijn medewerking bij het opstellen van het plan van aanpak en het opstellen van het
      reïntegratieverslag.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71a
  - number: 71a.7
    text: Bij ministeriële regeling kunnen regels met betrekking tot het eerste tot en met zesde lid worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71a
  - number: 71a.8
    text: |-
      Indien bij de behandeling van de aanvraag, bedoeld in [artikel 34, derde lid][ref1], blijkt dat de werkgever
      zijn verplichting om een reïntegratieverslag op te stellen niet of niet volledig is nagekomen, stelt het
      Uitvoeringsinstituut werknemersverzekeringen aan de werkgever een termijn waarbinnen het reïntegratieverslag wordt
      verstrekt of aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
  - number: 71a.9
    text: |-
      Indien bij de behandeling van de aanvraag, bedoeld in [artikel 34, derde lid][ref1], en de beoordeling als
      bedoeld in [artikel 34a][ref2] blijkt dat de werkgever zonder deugdelijke grond zijn verplichtingen op grond
      van het eerste, tweede, derde, vierde of vijfde lid dan wel de krachtens het zevende lid gestelde regels niet
      of niet volledig nakomt of onvoldoende reïntegratie-inspanningen heeft verricht stelt het Uitvoeringsinstituut
      werknemersverzekeringen een tijdvak vast, gedurende welke de verzekerde jegens die werkgever recht op loon heeft
      op grond van [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref3] dan wel aanspraak op bezoldiging op grond
      van [artikel 76a, eerste lid, van de Ziektewet][ref4]. Dit tijdvak is ten hoogste 52 weken en wordt afgestemd op de
      periode die nodig wordt geacht om alsnog voldoende reïntegratie-inspanningen te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel34a
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 34a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: 76a
  - number: 71a.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor de toepassing van het negende lid nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71a
  - number: 71b.1
    text: |-
      In afwijking van [artikel 71a][ref1], is op het Uitvoeringsinstituut werknemersverzekeringen ten aanzien
      van de verzekerde die op grond van [artikel 29, tweede lid, onderdeel a, b, c of d, van de Ziektewet][ref2]
      recht heeft op ziekengeld, [artikel 71a, tweede tot en met het tiende lid][ref3] niet van toepassing en is
      [artikel 71a, eerste lid][ref4], van overeenkomstige toepassing. Het Uitvoeringsinstituut werknemersverzekeringen
      stelt, binnen een door Onze Minister nader te bepalen termijn, in overleg met die verzekerde, een plan van aanpak
      op. Het plan van aanpak wordt periodiek geëvalueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
  - number: 71b.2
    text: |-
      In afwijking van [artikel 71a][ref1], is [artikel 71a, vierde, achtste, negende en tiende lid][ref2],
      niet van toepassing op de werkgever, wiens verzekerde op grond van
      [artikel 29, tweede lid, onderdeel e, f of g , van de Ziektewet][ref3] dan wel op grond van
      [artikel 29a, eerste of vierde lid, van die wet][ref4] recht heeft op ziekengeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: 29a
  - number: 71b.3
    text: |-
      In afwijking van het eerste lid is
      [artikel 71a, eerste, tweede, derde, vijfde, zesde, zevende en achtste lid][ref1], van overeenkomstige toepassing
      op de eigenrisicodrager, bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref2] ten aanzien van de
      personen, bedoeld in [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref3], die laatstelijk tot hem in
      dienstbetrekking stonden. Indien bij de behandeling van de aanvraag, bedoeld in [artikel 34, derde lid][ref4], en
      de beoordeling, bedoeld in [artikel 34a][ref5], blijkt dat de eigenrisicodrager, bedoeld in de eerste zin, zonder
      deugdelijke grond de uit die zin voortvloeiende verplichtingen dan wel de krachtens het zevende lid gestelde regels
      niet of niet volledig nakomt of onvoldoende reïntegratie-inspanningen heeft verricht stelt het Uitvoeringsinstituut
      werknemersverzekeringen een tijdvak vast, gedurende welke de persoon, bedoeld in de eerste zin, recht op ziekengeld
      heeft op grond van [artikel 29 van de Ziektewet][ref6]. Dit tijdvak is ten hoogste 52 weken en wordt afgestemd op
      de aard en de ernst van het verzuim, alsmede op de periode die nodig wordt geacht om alsnog voldoende reïntegratie-
      inspanningen te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel34a
      [ref6]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71b
    references:
      - id: ref1
