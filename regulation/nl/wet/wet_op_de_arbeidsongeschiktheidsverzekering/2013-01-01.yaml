  - number: 71b.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel71b
  - number: '80.1'
    text: |-
      Degene, die de wachttijd, bedoeld in [artikel 19][ref1] doormaakt, dan wel aanspraak maakt op of in het genot
      is van een arbeidsongeschiktheidsuitkering, diens wettelijke vertegenwoordiger alsmede de instelling aan
      welke ingevolge [artikel 54][ref2] de arbeidsongeschiktheidsuitkering wordt uitbetaald, zijn verplicht aan het
      Uitvoeringsinstituut werknemersverzekeringen, op zijn verzoek of onverwijld uit eigen beweging mededeling te doen
      van alle feiten of omstandigheden, waarvan het hun redelijkerwijs duidelijk is, dat zij van invloed kunnen zijn op
      het recht op of de hoogte van de arbeidsongeschiktheidsuitkering of het bedrag, dat daarvan wordt uitbetaald. Deze
      verplichting geldt niet indien die feiten en omstandigheden door het Uitvoeringsinstituut werknemersverzekeringen
      kunnen worden vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte gegevens of kunnen
      worden verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij ministeriële regeling wordt
      bepaald voor welke gegevens de tweede zin van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel54
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '54'
        hoofdstuk: II
        paragraaf: '2'
  - number: '80.2'
    text: |-
      Degene aan wie een reïntegratie-instrument als bedoeld in [hoofdstuk IIB][ref1] is verstrekt of toegekend, of aan
      wie verstrekking of toekenning daarvan wordt overwogen, alsmede diens wettelijk vertegenwoordiger, is verplicht
      aan het Uitvoeringsinstituut werknemersverzekeringen op zijn verzoek of onverwijld uit eigen beweging mededeling te
      doen van alle feiten en omstandigheden waarvan het hem redelijkerwijs duidelijk is dat zij van invloed kunnen zijn
      op de verstrekking of toekenning of op de duur of de hoogte van het reïntegratie-instrument.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukIIB
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: IIB
  - number: '81.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen laat op verzoek tot de vrijwillige verzekering toe, mits hij hier
      te lande woont:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel81
  - number: 81.1.a
    text: |-
      de persoon aan wie een arbeidsongeschiktheidsuitkering is toegekend, berekend naar een arbeidsongeschiktheid van
      minder dan 45%;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel81
  - number: 81.1.b
    text: |-
      de persoon wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45%,
      wegens afneming van de arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder dan 45%.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel81
  - number: '81.2'
    text: |-
      Op de persoon die voor 1 januari 2004 arbeidsongeschikt is geworden en op het tijdstip waarop hij arbeidsongeschikt
      werd verzekerde was op grond van de vrijwillige verzekering, blijft de vrijwillige verzekering op grond van dit
      hoofdstuk van toepassing:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel81
  - number: 81.2.a
    text: |-
      gedurende de wachttijd, bedoeld in [artikel 19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 81.2.b
    text: |-
      gedurende vier weken na afloop van de wachttijd, bedoeld in [artikel 19][ref1], indien hij na afloop van die
      wachttijd minder dan 15% arbeidsongeschikt is, doch binnen die vier weken 15% of meer arbeidsongeschikt is;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 81.2.c
    text: gedurende de periode waarover hij recht heeft op arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel81
  - number: '83.1'
    text: |-
      Het verzoek tot toelating tot de vrijwillige verzekering wordt binnen dertien weken na de dagtekening
      van de beschikking waarbij de arbeidsongeschiktheidsuitkering werd toegekend of herzien ingediend bij het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel83
  - number: '83.2'
    text: |-
      Een verzoek tot toelating wordt geacht binnen dertien weken na de dagtekening van het besluit te zijn gedaan,
      indien dit verzoek geschiedt binnen vier weken na de dag waarop de persoon die het verzoek heeft gedaan
      redelijkerwijze kennis heeft kunnen nemen van het besluit.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel83
  - number: '83.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd te verklaren dat een verzoek tot toelating tot de
      vrijwillige verzekering, ingediend na de daartoe op grond van deze wet gestelde termijn, geacht wordt tijdig te
      zijn gedaan, indien de persoon die het verzoek heeft gedaan, redelijkerwijs niet geacht kan worden in verzuim te
      zijn geweest.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel83
  - number: '83.4'
    text: |-
      De vrijwillige verzekering vangt aan op de dag met ingang waarvan de arbeidsongeschiktheidsuitkering wordt
      toegekend of herzien.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel83
  - number: 83b
    text: 'Het Uitvoeringsinstituut werknemersverzekeringen beëindigt de vrijwillige verzekering:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel83b
  - number: 83b.a
    text: op verzoek van de vrijwillig verzekerde met ingang van een door hem te bepalen datum;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel83b
  - number: 83b.b
    text: met ingang van de dag waarop de vrijwillig verzekerde op grond van deze wet als werknemer wordt beschouwd;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel83b
  - number: 83b.c
    text: |-
      indien de verschuldigde premie over een periode van twee volle kalendermaanden niet, niet volledig of niet tijdig
      wordt betaald; of
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel83b
  - number: 83b.d
    text: |-
      indien niet langer wordt voldaan aan de vereisten, bedoeld in [artikel 81][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel83b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
        hoofdstuk: VI
  - number: '84.1'
    text: |-
      De persoon, die om toelating tot de vrijwillige verzekering verzoekt, bepaalt bij de aanvang van de vrijwillige
      verzekering de hoogte van het dagloon, met dien verstande dat dit niet meer kan bedragen dan:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel84
  - number: 84.1.a
    text: |-
      het bedrag, bedoeld in [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1], met
      betrekking tot een loontijdvak van een dag eventueel verhoogd of verlaagd krachtens [artikel 18 van die wet][ref2];
      en


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel18
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '18'
  - number: 84.1.b
    text: |-
      het loon of het inkomen dat hij in geval van arbeidsongeschiktheid naar het oordeel van het Uitvoeringsinstituut
      werknemersverzekeringen derft.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel84
  - number: '84.2'
    text: |-
      De uitkering op grond van de vrijwillige verzekering wordt tijdens de duur, bedoeld in [artikel 21a][ref1],
      berekend naar het in het eerste lid bedoelde dagloon. Dit dagloon wordt eveneens in aanmerking genomen bij de
      berekening van het vervolgdagloon, bedoeld in [artikel 21b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel21b
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 21a
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 21b
        hoofdstuk: II
        paragraaf: '1'
  - number: '85'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt nadere regels met betrekking tot de vrijwillige verzekering.
      Deze regels bevatten in ieder geval bepalingen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel85
  - number: 85.a
    text: de toelating tot de vrijwillige verzekering;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel85
  - number: 85.b
    text: het einde van de vrijwillige verzekering; en
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel85
  - number: 85.c
    text: |-
      het dagloon, bedoeld in [artikel 84, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel84
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '84'
        hoofdstuk: VI
  - number: '86'
    text: |-
      Met betrekking tot het bepaalde bij of krachtens dit hoofdstuk zijn, met inachtneming van de wijzigingen, welke de
      aard van het onderwerp vordert, de bepalingen van de overige hoofdstukken en de ter uitvoering van die bepalingen
      genomen besluiten, voor zoveel nodig, van overeenkomstige toepassing, voor zover daarvan in het bij of krachtens
      dit hoofdstuk bepaalde niet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel86
  - number: 86a
    text: |-
      In afwijking van [artikel 1:2 van de Algemene wet bestuursrecht][ref1] is de werkgever geen belanghebbende bij
      een besluit van het Uitvoeringsinstituut werknemersverzekeringen over het verzekerd zijn op grond van deze wet als
      bedoeld in [artikel 87, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel87
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel86a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 86b.1
    text: |-
      Onverminderd [artikel 87][ref1], worden de beschikkingen op grond van deze wet en de daarop berustende bepalingen
      gegeven binnen een redelijke termijn na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel87
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel86b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 86b.2
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel86b
  - number: 86b.3
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel86b
  - number: 86b.4
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid een in het buitenland wonende
      persoon is opgeroepen en om die reden de beschikking niet binnen acht weken gegeven kan worden, wordt die termijn
      verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel86b
  - number: '87.1'
    text: |-
      Een aanvraag tot het geven van een beschikking over het verzekerd zijn op grond van deze wet kan door de werknemer
      uitsluitend bij het Uitvoeringsinstituut werknemersverzekeringen worden ingediend. Het Uitvoeringsinstituut
      werknemersverzekeringen geeft de beschikking binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel87
  - number: '87.2'
    text: |-
      Indien een beschikking als bedoeld in het eerste lid om andere dan de in het tweede lid bedoelde redenen niet
      binnen dertien weken kan worden gegeven, wordt de aanvrager daarvan schriftelijk in kennis gesteld onder vermelding
      van een zo kort mogelijke termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel87
  - number: '87.3'
    text: |-
      Een beschikking over verlenging van de wachttijd, bedoeld in [artikel 19, eerste lid][ref1], op grond van het
      zevende lid van dat artikel wordt gegeven binnen twee weken na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 87b
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de behandeling van bezwaarschriften
      tegen beschikkingen waaraan een medische of arbeidskundige beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel87b
  - number: 87c
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken gerekend vanaf de dag na die waarop de termijn
      voor het indienen van het bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel87c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 87d.1
    text: |-
      Indien bezwaar wordt gemaakt tegen een beschikking waaraan een medische of arbeidskundige beoordeling
      ten grondslag ligt, beslist het Uitvoeringsinstituut werknemersverzekeringen, in afwijking van
      [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1], binnen zeventien weken of, indien het advies
      vraagt aan een deskundige die niet onder zijn verantwoordelijkheid werkzaam is binnen eenentwintig weken, gerekend
      vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel87d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 87d.2
    text: |-
      Indien in verband met het geven van een beslissing op bezwaar een in het buitenland wonende persoon is opgeroepen
      en om die reden de beslissing op bezwaar niet binnen de in het eerste lid bedoelde termijn gegeven kan worden,
      wordt de beslissing, in afwijking van [artikel 7:10, derde lid, van de Algemene wet bestuursrecht][ref1], verdaagd
      met ten hoogste zes maanden en wordt de aanvrager van deze verdaging schriftelijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel87d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 87e
    text: |-
      Het bezwaar of beroep van een werkgever tegen de in
      [artikel 38, tweede of derde lid, van de Wet financiering sociale verzekeringen][ref1] bedoelde opslag of korting
      kan niet zijn gegrond op de grief, dat de arbeidsongeschiktheidsuitkering ten onrechte of tot een te hoog bedrag
      is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel87e
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '38'
  - number: 87f.1
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van de [artikelen 1, derde tot en met zevende lid][ref1], [2 tot en met 11][ref2]
      en [13, eerste lid][ref3], en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel13
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel87f
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '2'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '13'
        hoofdstuk: I
        paragraaf: '4'
  - number: 87f.2
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen de uitspraken van de gerechtshoven
      inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats
      inneemt van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel87f
  - number: '88'
    text: 'Voor de toepassing van deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88
  - number: 88.a
    text: 'medische beschikking: een beschikking waaraan een beoordeling van medische gegevens ten grondslag ligt;'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88
  - number: 88.b
    text: 'werknemer: de persoon op wiens medische gegevens de beoordeling betrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88
  - number: 88.c
    text: 'werkgever: de belanghebbende bij een medische beschikking, die niet de werknemer is.'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88
  - number: 88a.1
    text: |-
      Stukken die medische gegevens bevatten worden door het Uitvoeringsinstituut werknemersverzekeringen niet aan
      de werkgever ter inzage of ter kennisname gegeven of toegezonden, tenzij de werknemer hiervoor schriftelijk
      toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88a
  - number: 88a.2
    text: De toestemming kan te allen tijde schriftelijk worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88a
  - number: 88a.3
    text: Tijdens het horen in bezwaar kan de toestemming ook mondeling worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88a
  - number: 88b.1
    text: |-
      Indien door de werknemer geen toestemming is gegeven als bedoeld in [artikel 88a][ref1], is de inzage, dan wel
      kennisname of toezending van stukken die medische gegevens bevatten, voorbehouden aan een gemachtigde van de
      werkgever die advocaat of arts is dan wel daarvoor van het Uitvoeringsinstituut werknemersverzekeringen bijzondere
      toestemming heeft gekregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel88a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 88a
        hoofdstuk: VII
        paragraaf: '2'
  - number: 88b.2
    text: 'De gemachtigde, bedoeld in het eerste lid, treedt in de plaats van de werkgever bij:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88b
  - number: 88b.2.a
    text: de voorbereiding van een medische beschikking;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88b
  - number: 88b.2.b
    text: het opstellen van een bezwaar- of beroepschrift; en
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88b
  - number: 88b.2.c
    text: de behandeling van een bezwaar;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88b
  - number: 88b.3
    text: |-
      [Artikel 7:4, tweede, vierde en zesde lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing op
      stukken of inlichtingen die medische gegevens bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 88c.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen vermeldt de motivering van een medische beschikking, voorzover
      betrekking hebbend op medische gegevens, in een aparte bijlage.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88c
  - number: 88c.2
    text: |-
      Indien de werknemer geen toestemming heeft gegeven als bedoeld in [artikel 88a][ref1] wordt de bijlage, bedoeld in
      het eerste lid, niet aan de werkgever verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel88a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 88a
        hoofdstuk: VII
        paragraaf: '2'
  - number: 88c.3
    text: |-
      De bijlage wordt verstrekt aan de gemachtigde van de werkgever, bedoeld in [artikel 88b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel88b
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 88b
        hoofdstuk: VII
        paragraaf: '2'
  - number: 88c.4
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing op een rapport of een advies van een arts of een
      psycholoog, waarnaar bij de motivering van een medische beschikking wordt verwezen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88c
  - number: 88d
    text: |-
      Bij de bekendmaking van een medische beschikking wordt gewezen op de [artikelen 88a][ref1], [88b][ref2],
      [88c][ref3] en [88e][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel88a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel88b
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel88c
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel88e
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88d
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 88a
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 88b
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 88c
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 88e
        hoofdstuk: VII
        paragraaf: '2'
  - number: 88e
    text: |-
      De gronden van het bezwaar of beroep, bedoeld in
      [artikel 6:5, eerste lid, onderdeel d, van de Algemene wet bestuursrecht][ref1], worden in een aparte bijlage
      vermeld voorzover ze betrekking hebben op medische gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 88f.1
    text: |-
      Indien [artikel 8:32, tweede lid, van de Algemene wet bestuursrecht][ref1] is toegepast, vindt in afwijking van
      [artikel 8:62, eerste lid, van die wet][ref2] het onderzoek ter zitting, voorzover betrekking hebbend op medische
      gegevens, met gesloten deuren plaats, tenzij de rechtbank ambtshalve of op verzoek van een van de partijen bepaalt
      dat het onderzoek openbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 88f.2
    text: |-
      In de uitnodiging, bedoeld in [artikel 8:56 van de Algemene wet bestuursrecht][ref1], wordt mededeling gedaan van
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 88g
    text: |-
      [Artikel 88f][ref1] is van overeenkomstige toepassing bij de behandeling van het hoger beroep en bij de behandeling
      van een verzoek om een voorlopige voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel88f
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel88g
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 88f
        hoofdstuk: VII
        paragraaf: '2'
  - number: '89'
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de verzekerde naar burgerlijk recht aanspraak kan maken ter
      zake van zijn arbeidsongeschiktheid, houdt de rechter rekening met de aanspraken, die hij krachtens deze wet heeft.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel89
  - number: '90.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft voor de krachtens deze wet gemaakte kosten verhaal op
      degene, die in verband met het veroorzaken van arbeidsongeschiktheid jegens de verzekerde naar burgerlijk recht tot
      schadevergoeding is verplicht, doch ten hoogste tot het bedrag, waarvoor deze bij het ontbreken van de aanspraken
      krachtens deze wet naar burgerlijk recht aansprakelijk zou zijn, verminderd met een bedrag, gelijk aan dat van
      de schadevergoeding tot betaling waarvan de aansprakelijke persoon jegens de verzekerde naar burgerlijk recht is
      gehouden.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel90
  - number: '90.2'
    text: |-
      Overeenkomstig door Onze Minister te stellen regelen kan het Uitvoeringsinstituut werknemersverzekeringen in plaats
      van het bedrag der periodieke verstrekkingen de contante waarde daarvan vorderen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel90
  - number: '90.3'
    text: |-
      De in het eerste lid bedoelde aansprakelijke is eveneens verplicht tot vergoeding van de door
      het Uitvoeringsinstituut werknemersverzekeringen gemaakte redelijke kosten ter nakoming van de
      verplichtingen tot inschakeling in de arbeid van de verzekerde, die op het Uitvoeringsinstituut
      werknemersverzekeringen rusten op grond van deze wet en de daarop rustende bepalingen alsmede de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] en de daarop berustende bepalingen. De aansprakelijke
      kan hetzelfde verweer voeren dat hem jegens de verzekerde ten dienste zou hebben gestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: '91.1'
    text: |-
      Het bepaalde in het [vorige artikel][ref1] geldt ten aanzien van de naar burgerlijk recht tot schadevergoeding
      verplichte werkgever van de verzekerde, onderscheidenlijk ten aanzien van de naar burgerlijk recht tot
      schadevergoeding verplichte verzekerde, die in dienstbetrekking staat tot dezelfde werkgever als de verzekerde
      jegens wie naar burgerlijk recht verplichting tot schadevergoeding bestaat, slechts indien de arbeidsongeschiktheid
      is te wijten aan opzet of bewuste roekeloosheid van die werkgever onderscheidenlijk verzekerde.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel90
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '90'
        hoofdstuk: VIII
  - number: '91.2'
    text: |-
      Voor de toepassing van het vorige lid wordt mede als werkgever beschouwd de inlener, bedoeld in
      [artikel 34 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel34
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '34'
  - number: 91a
    text: |-
      De [artikelen 20][ref1], [43b][ref2], en [47a][ref3], zijn niet van toepassing op de persoon die:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43b
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel47a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '20'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 43b
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 47a
        hoofdstuk: II
        paragraaf: '2'
  - number: 91a.a)
    text: |-
      op 31 december 1999 op grond van [artikel 18][ref1] recht heeft op een arbeidsongeschiktheidsuitkering en op die
      dag niet in Nederland woont, en


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
  - number: 91a.b)
    text: |-
      op 19 december 2005 dit recht op uitkering uitsluitend nog heeft op grond van [artikel 2 van de wet van
      9 december 2004](onbekend), houdende goedkeuring van het voornemen tot opzegging van het op 28 juni 1962 te
      Genève totstandgekomen Verdrag betreffende de gelijkheid van behandeling van eigen onderdanen en vreemdelingen met
      betrekking tot de sociale zekerheid (Verdrag Nr. 118 aangenomen door de Internationale Arbeidsconferentie in haar
      zesenveertigste zitting; Trb. 1962, 122 en Trb. 1964, 23) (Stb. 2004, 715).
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel91a
  - number: 91b.1
    text: |-
      Ten aanzien van de persoon wiens eerste dag van arbeidsongeschiktheid is gelegen voor 1 januari 2004 blijven de
      [artikelen 19, met uitzondering van het tweede lid, laatste zin][ref1], [34][ref2] en [75a][ref3] van toepassing
      zoals deze luidden op 31 december 2003, met dien verstande dat het krachtens artikel 75a, vierde lid, tweede zin,
      te verhalen bedrag respectievelijk het krachtens artikel 75a, vijfde lid, aan 's Rijks kas af te dragen bedrag
      wordt vermeerderd met de inkomensafhankelijke bijdrage, bedoeld in [artikel 42 van de Zorgverzekeringswet][ref4],
      over de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel42
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel91b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '42'
  - number: 91b.2
    text: |-
      Indien de arbeidsongeschiktheidsuitkering wordt herzien in verband met een voor 1 januari 2004 ingetreden toeneming
      van de arbeidsongeschiktheid, zijn de [artikelen 37, met uitzondering van het derde lid, laatste zin][ref1],
      [40][ref2] en [41][ref3] van toepassing, zoals deze luidden op 31 december 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel41
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel91b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '37'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '40'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '41'
        hoofdstuk: II
        paragraaf: '2'
  - number: 91b.3
    text: |-
      Voor de toepassing van het eerste en tweede lid worden perioden van ongeschiktheid tot werken geacht eenzelfde,
      niet onderbroken periode van ongeschiktheid te vormen, indien zij elkaar met een onderbreking van minder
      dan vier weken opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering
      in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2] of
      [3:10, eerste lid, van de Wet arbeid en zorg][ref3] wordt genoten, tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel91b
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 91c
    text: |-
      Zo nodig in afwijking van de overige artikelen van dit hoofdstuk blijven de [artikelen 75a, derde lid][ref1],
      en [76f, vijfde lid][ref2], zoals deze luidden op de dag voor inwerkingtreding van de
      __REF002___________________________________________________________________________________________________________
      ________________________________________________________________________________________________ (Stb. 274) van
      toepassing voor de duur van de periode waarin op grond van [artikel IXa van die wet][ref4] recht bestaat op een
      financiële tegemoetkoming op grond van [hoofdstuk 7 van de Wet arbeid en zorg][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel76f
      [ref3]: https://wetten.overheid.nl/BWBR0018262
      [ref4]: https://wetten.overheid.nl/BWBR0018262#ArtikelIXa
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel91c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75a
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 76f
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018262
      - id: ref4
        bwb_id: BWBR0018262
        artikel: IXa
      - id: ref5
        bwb_id: BWBR0013008
        hoofdstuk: '7'
  - number: 91d.1
    text: |-
      Een beschikking tot toekenning van inkomenssuppletie op grond van
      [artikel 29 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] aan de
      persoon die op de dag voorafgaand aan de dag waarop dat artikel op grond van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref2] vervalt,
      recht had op een arbeidsongeschiktheidsuitkering, wordt voor de duur waarvoor die inkomenssuppletie was toegekend
      aangemerkt als een beschikking tot toekenning van inkomenssuppletie als bedoeld in [artikel 65d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel65d
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel91d
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0019058
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 65d
        hoofdstuk: IIB
  - number: 91d.2
    text: |-
      Een beschikking tot toekenning van loonsuppletie op grond van
      [artikel 32 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] aan
      de persoon die op dag voorafgaand aan de dag waarop dat artikel op grond van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref2] vervalt, recht
      had op een arbeidsongeschiktheidsuitkering, wordt voor de duur waarvoor die loonsuppletie was toegekend aangemerkt
      als een beschikking tot toekenning van loonsuppletie als bedoeld in [artikel 65c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel65c
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel91d
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0019058
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 65c
        hoofdstuk: IIB
  - number: 91d.3
    text: |-
      De persoon wiens arbeidsongeschiktheidsuitkering is ingetrokken als
      gevolg van de toepassing van [artikel 34, vierde lid][ref1], van deze wet,
      [artikel 35, vijfde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] of
      [artikel 3:28, vijfde lid, van de Wet werk en arbeidsondersteuning jonggehandicapten][ref3], of de persoon,
      bedoeld in [artikel 2, derde lid, van het Besluit eenmalige herbeoordelingen arbeidsongeschiktheidswetten][ref4],
      wiens arbeidsongeschiktheidsuitkering is ingetrokken, wordt gedurende vijf jaar na de dag van intrekking van de
      arbeidsongeschiktheidsuitkering aangemerkt als verzekerde in de zin van [artikel 65c][ref5] en [65d][ref6].


