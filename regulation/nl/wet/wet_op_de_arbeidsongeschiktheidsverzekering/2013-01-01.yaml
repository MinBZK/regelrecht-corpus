  - number: 19a.1
    text: |-
      De verzekerde, bedoeld in [artikel 19][ref1], heeft geen recht op toekenning van arbeidsongeschiktheidsuitkering
      indien de dag waarop het recht op arbeidsongeschiktheidsuitkering zou ingaan dan wel de dag na afloop van de
      toepassing van [artikel 19b][ref2] met betrekking tot dat recht op uitkering, is gelegen in een periode dat hem
      rechtens zijn vrijheid is ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19b
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 19b
        hoofdstuk: II
        paragraaf: '1'
  - number: 19a.2
    text: |-
      De persoon, die op grond van het eerste lid geen recht op toekenning van arbeidsongeschiktheidsuitkering
      heeft alsmede de persoon die voor 1 januari 2004 arbeidsongeschikt is, maar op grond van
      [artikel 19b van de Ziektewet][ref1] geen recht heeft op ziekengeld, wordt vanaf de dag dat hij in vrijheid wordt
      gesteld weer als verzekerde aangemerkt en heeft met inachtneming van de bepalingen van deze wet recht op toekenning
      van arbeidsongeschiktheidsuitkering, indien hij op die dag arbeidsongeschikt is. [Artikel 19, vierde lid][ref2],
      is van overeenkomstige toepassing. De [artikelen 18, tweede tot en met vierde lid][ref3], en
      [30, eerste lid, onderdeel a][ref4] zijn niet van toepassing, behoudens voorzover het betreft de op de dag
      voorafgaande aan de eerste dag dat die persoon rechtens zijn vrijheid is ontnomen aanwezige arbeidsongeschiktheid
      in de zin van [artikel 18, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19b
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel19a
