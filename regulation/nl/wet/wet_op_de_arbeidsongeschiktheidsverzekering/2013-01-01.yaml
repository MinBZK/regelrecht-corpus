  - number: 98a.1
    text: |-
      Een overeenkomst met betrekking tot de verzekering van geldelijke gevolgen van langdurige arbeidsongeschiktheid,
      gesloten door degene, die verplicht verzekerd wordt, vervalt met ingang van de dag, waarop de verzekeraar van de
      verzekerde mededeling van het verplicht verzekerd worden ontvangt, voor zover aan de overeenkomst rechten kunnen
      worden ontleend, gelijkwaardig aan die, welke uit de in deze wet geregelde verplichte verzekering voortvloeien.
      Bereikt deze mededeling de verzekeraar vóór de dag, waarop de betrokkene verplicht verzekerd wordt, dan vervalt de
      overeenkomst met ingang van die dag.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel98a
  - number: 98a.2
    text: |-
      De premie, welke degene, wiens verzekering krachtens het bepaalde in het eerste lid geheel of gedeeltelijk
      is vervallen, heeft vooruitbetaald, wordt door de verzekeraar al naar gelang van het vervallen gedeelte
      der overeenkomst terugbetaald, onder aftrek van ten hoogste 25 procent van het terug te betalen bedrag voor
      administratiekosten.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel98a
  - number: 98b
    text: |-
