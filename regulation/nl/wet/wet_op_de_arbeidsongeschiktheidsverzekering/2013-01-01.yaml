        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '15'
        hoofdstuk: I
        paragraaf: '4'
  - number: 43d
    text: |-
      De arbeidsongeschiktheidsuitkering, onderscheidenlijk de verhoging van de arbeidsongeschiktheidsuitkering
      in geval van herziening van die uitkering op grond van de [artikelen 37][ref1], [38][ref2], [39][ref3]
      en [39a][ref4], wordt niet uitbetaald gedurende het verlengde tijdvak waarin recht bestaat op
      ziekengeld op grond van [artikel 29, negende lid, van de Ziektewet][ref5], op loon op grond van
      [artikel 629 lid 11, onderdeel d, van Boek 7 van het Burgerlijk Wetboek][ref6], dan wel op bezoldiging op grond van
      [artikel 76a, zesde lid, van de Ziektewet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel39a
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref7]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
