      - id: ref5
        bwb_id: BWBR0002524
        artikel: '14'
        hoofdstuk: I
        paragraaf: '4'
  - number: '40.2'
    text: |-
      Voor de toepassing van het eerste lid wordt in [artikel 14, eerste lid][ref1], in plaats van de woorden
      «voorafgaande aan het aangiftetijdvak waarin de arbeidsongeschiktheid is ingetreden» gelezen: voorafgaande aan het
      aangiftetijdvak waarin de arbeidsongeschiktheid is toegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel14
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '14'
        hoofdstuk: I
        paragraaf: '4'
  - number: '40.3'
    text: |-
      Ingeval van herziening van een arbeidsongeschiktheidsuitkering in verband met toegenomen arbeidsongeschiktheid
      tijdens het ontvangen van een vervolguitkering wordt, met inachtneming van de tweede tot en met vierde volzin van
      dit lid, met ingang van de dag waarop het recht op die herziening bestaat, een loondervingsuitkering toegekend.
      Voor de duur van die loondervingsuitkering is, in afwijking van [artikel 21a][ref1], de leeftijd van de betrokkene
      op de dag van ingang van de herziening van de arbeidsongeschiktheidsuitkering bepalend. Toekenning van een
      loondervingsuitkering is slechts mogelijk indien de betrokkene bij de toeneming van de arbeidsongeschiktheid
      terzake van het verrichten van werkzaamheden op grond van deze wet verzekerd was en de duur van die uitkering
      langer is dan de duur van de loondervingsuitkering, waarop recht bestond onmiddellijk voorafgaande aan de datum van
      ingang van de vervolguitkering. De duur van de toe te kennen loondervingsuitkering wordt verminderd met de duur van
      de laatstelijk ontvangen loondervingsuitkering. Tijdens de duur van die loondervingsuitkering bestaat geen recht
      op vervolguitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 21a
        hoofdstuk: II
        paragraaf: '1'
  - number: '40.4'
    text: |-
      Na afloop van de in het derde lid bedoelde loondervingsuitkering geldt voor de berekening van het
      vervolgdagloon, in afwijking van [artikel 21b, derde lid][ref1], een percentage van 2 maal het aantal verstreken
      jaren tussen het 15e jaar en de leeftijd van de betrokkene op de dag van ingang van de herziening van de
      arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21b
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 21b
        hoofdstuk: II
        paragraaf: '1'
  - number: '40.5'
    text: Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel40
  - number: '41.1'
    text: Verhoging van de arbeidsongeschiktheidsuitkering vindt op aanvraag of ambtshalve plaats.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel41
  - number: '41.2'
    text: |-
      Verhoging van de arbeidsongeschiktheidsuitkering ter zake van toeneming van de
      arbeidsongeschiktheid vindt in elk geval ambtshalve plaats, indien de betrokkene aansluitend
      aan de uitkering van ziekengeld krachtens de [Ziektewet][ref1] dan wel na afloop van
      het in [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2] of in
      [artikel 76a, eerste lid, van de Ziektewet][ref3] bedoelde tijdvak van 104 weken in aanmerking komt voor een hogere
      arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 76a
  - number: '42.1'
    text: |-
      De herziening van de arbeidsongeschiktheidsuitkering gaat in op de dag, met ingang van welke de belanghebbende
      ingevolge het bij of krachtens deze wet bepaalde voor een hogere of lagere uitkering in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel42
  - number: '42.2'
    text: |-
      Met betrekking tot de herziening van de arbeidsongeschiktheidsuitkering, welke een verhoging van die uitkering tot
      gevolg heeft, is het bepaalde in [artikel 35, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel35
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
  - number: '42.3'
    text: |-
      De herziening van een arbeidsongeschiktheidsuitkering ter zake van afneming van de arbeidsongeschiktheid gaat in op
      de dag, welke in de beschikking wordt genoemd als de dag, waarop de arbeidsongeschiktheid was afgenomen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel42
  - number: '42.4'
    text: |-
      Indien herziening van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide scholing of opleiding,
      gaat deze herziening niet eerder in dan één jaar na voltooiing van die scholing of opleiding.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel42
  - number: '43.1'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt ingetrokken wanneer de arbeidsongeschiktheid is geëindigd of beneden 15 %
      is gedaald.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43
  - number: '43.2'
    text: |-
      De intrekking van de arbeidsongeschiktheidsuitkering gaat in op de dag, welke in de beschikking wordt genoemd als
      de dag, waarop de arbeidsongeschiktheid was geëindigd of beneden 15 % was gedaald.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43
  - number: '43.3'
    text: |-
      Indien intrekking van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide opleiding of scholing, is
      [artikel 42, vierde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel42
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '42'
        hoofdstuk: II
        paragraaf: '2'
  - number: '43.4'
    text: |-
      De arbeidsongeschiktheidsuitkering van degene die deelneemt aan een opleiding of scholing, wordt gedurende
      deze opleiding of scholing niet ingetrokken of herzien in verband met een daaruit voortvloeiende afname van
      de arbeidsongeschiktheid. Indien de belanghebbende tijdens de opleiding of scholing inkomen verwerft, is
      [artikel 44, eerste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel44
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
  - number: '43.5'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt ingetrokken, indien degene die recht heeft op
      arbeidsongeschiktheidsuitkering rechtens zijn vrijheid is ontnomen, vanaf de dag dat deze vrijheidsontneming één
      maand heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43
  - number: '43.6'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt ingetrokken, indien degene die recht heeft op
      arbeidsongeschiktheidsuitkering zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
      maatregel.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43
  - number: '43.7'
    text: |-
      Voor de verzekerde die op de dag voorafgaande aan de vrijheidsontneming geen recht heeft op
      arbeidsongeschiktheidsuitkering op grond van het zesde lid, eindigt het recht op arbeidsongeschiktheidsuitkering,
      in afwijking van het vijfde lid, vanaf de dag dat de vrijheidsontneming ingaat.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43
  - number: '43.8'
    text: |-
      Voor de toepassing van het vijfde lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43
  - number: 43a.1
    text: Indien degene
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43a
  - number: 43a.1.a
    text: |-
      wiens arbeidsongeschiktheidsuitkering wegens afneming van arbeidsongeschiktheid op grond van
      [artikel 43, eerste lid][ref1], is ingetrokken, of


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '43'
        hoofdstuk: II
        paragraaf: '2'
  - number: 43a.1.b
    text: |-
      die aan het einde van de in [artikel 19][ref1], bedoelde wachttijd ongeschikt was tot het verrichten van zijn
      arbeid wegens ziekte of gebreken, maar geen recht had op toekenning van arbeidsongeschiktheidsuitkering omdat hij
      niet arbeidsongeschikt was,


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 43a.2
    text: |-
      Voor het bepalen van de periode van vier weken, bedoeld in het eerste lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier
      weken opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering in
      verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2] of
      [3:10, eerste lid, van de Wet arbeid en zorg][ref3] wordt genoten, tenzij de ongeschiktheid redelijkerwijs
      niet geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de vaststelling van de eerstgenoemde periode
      van vier weken blijven perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van
      [artikel 3:7, eerste lid][ref4], [3:8][ref5], of [3:10, eerste lid, van de Wet arbeid en zorg][ref6] wordt genoten,
      buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 43a.3
    text: |-
      In de gevallen, waarin [artikel 20 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1]
      onderscheidenlijk [artikel 3:21 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref2] geen
      toepassing vindt omdat [artikel 29b van de Ziektewet][ref3] toepassing kan vinden, wordt het aan de
      arbeidsongeschiktheidsuitkering ten grondslag te leggen dagloon niet lager gesteld dan 108/100 maal
      de grondslag die voor de berekening van de laatstelijk ontvangen arbeidsongeschiktheidsuitkering
      op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4] onderscheidenlijk de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref5] in aanmerking werd genomen, dan wel 108/100
      maal de grondslag die in aanmerking zou zijn genomen, indien na het einde van de wachttijd, bedoeld in
      [artikel 7, eerste lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6] onderscheidenlijk
      [artikel 3:3, eerste lid, van de Wet werk en arbeidsondersteuning jonggehandicapten][ref7], recht zou
      hebben bestaan op een arbeidsongeschiktheidsuitkering op grond van een laatstbedoelde wet, zoals die
      sinds de beëindiging van die uitkering onderscheidenlijk sinds het einde van die wachttijd op grond
      van [artikel 8 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8] onderscheidenlijk
      [artikel 3:7 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref9] zou zijn herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
      [ref4]: https://wetten.overheid.nl/BWBR0008656
