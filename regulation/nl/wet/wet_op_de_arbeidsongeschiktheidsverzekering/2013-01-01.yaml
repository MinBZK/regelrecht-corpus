        bwb_id: BWBR0001888
        artikel: '45'
  - number: '40.1'
    text: |-
      Indien terzake van toeneming van de arbeidsongeschiktheid herziening van de arbeidsongeschiktheidsuitkering alsmede
      toekenning van ziekengeld krachtens de [Ziektewet][ref1] heeft plaatsgevonden dan wel loondoorbetaling heeft
      plaatsgevonden op grond van [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2] of betaling
      van bezoldiging op grond van [artikel 76a, eerste lid, van de Ziektewet][ref3], wordt met ingang van de dag na
      beëindiging van het ziekengeld op grond van [artikel 29, vijfde lid, van de Ziektewet][ref4] dan wel na afloop
      van het in artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek of in artikel 76a, eerste lid, van
      de Ziektewet bedoelde tijdvak van 104 weken het dagloon opnieuw vastgesteld overeenkomstig het bepaalde bij of
      krachtens [artikel 14][ref5], mits dat leidt tot een hoger dagloon, dan het dagloon dat voor de berekening van de
      laatstelijk ontvangen loondervingsuitkering of vervolguitkering in aanmerking werd genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel14
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref3
