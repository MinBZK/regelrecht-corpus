        artikel: 91b
        hoofdstuk: VIIIA
  - number: 98f.1
    text: |-
      De [artikelen 39b][ref1] en [43a, zesde lid][ref2], alsmede [47, zevende lid][ref3], zoals die zijn komen te luiden
      na inwerkingtreding van de Wet harmonisatie en vereenvoudiging socialezekerheidswetgeving, zijn niet van toepassing
      op de persoon wiens arbeidsongeschiktheid voor de dag van inwerkingtreding van die wet is toegenomen als bedoeld
      in de [artikelen 38 tot en met 39a][ref4], 43a of 47, tot het moment waarop in verband met diezelfde toename van de
      arbeidsongeschiktheid geen recht meer bestaat op ziekengeld op grond van de [Ziektewet][ref5].


