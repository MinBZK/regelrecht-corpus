  - number: 19a.3
    text: |-
      Voor de toepassing van het eerste lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel19a
  - number: 19a.4
    text: |-
      De persoon, bedoeld in het tweede lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten
      aanzien van wie dit wel het geval is binnen vier weken na die dag, wordt vanaf de dag dat hij in vrijheid
      is gesteld weer als verzekerde aangemerkt en heeft met inachtneming van de bepalingen van deze wet recht op
      toekenning van arbeidsongeschiktheidsuitkering. [Artikel 19, vierde lid][ref1], is van overeenkomstige toepassing.
      [Artikel 30, eerste lid, onderdeel b][ref2], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel30
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '30'
        hoofdstuk: II
        paragraaf: '1'
  - number: 19a.5
    text: |-
      Het eerste lid is niet van toepassing en het tweede en vierde lid zijn van overeenkomstige toepassing op bij
      algemene maatregel van bestuur aan te wijzen categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf
      of vrijheidsbenemende maatregel buiten een justitiële inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel19a
  - number: 19b
    text: |-
      De verzekerde, bedoeld in [artikel 19][ref1], heeft geen recht op toekenning van arbeidsongeschiktheidsuitkering
      indien en voor zolang hij zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
      maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '20.1'
    text: |-
      De verzekerde, bedoeld in [artikel 19][ref1], heeft geen recht op toekenning van arbeidsongeschiktheidsuitkering
      indien de dag waarop het recht op arbeidsongeschiktheidsuitkering zou ingaan, is gelegen in een periode dat hij
      niet in Nederland woont.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '20.2'
    text: |-
      Het eerste lid is niet van toepassing indien de verzekerde op die dag woont in een land waarin op
      grond van een verdrag of een besluit van een volkenrechtelijke organisatie recht op toekenning van
      arbeidsongeschiktheidsuitkering kan bestaan.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel20
  - number: '20.3'
    text: |-
      De persoon, die op grond van het eerste lid geen recht op toekenning van arbeidsongeschiktheidsuitkering
      heeft alsmede de persoon die voor 1 januari 2004 arbeidsongeschikt is, maar op grond van
      [artikel 19a van de Ziektewet][ref1] geen recht heeft op ziekengeld, wordt vanaf de dag:


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 19a
  - number: 20.3.a
    text: dat hij in Nederland woont; of
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel20
  - number: 20.3.b
    text: |-
      dat hij in een land woont waarmee een verdrag in werking is getreden dan wel een besluit van een volkenrechtelijke
      organisatie van kracht is geworden, op grond waarvan recht op toekenning van arbeidsongeschiktheidsuitkering kan
      bestaan;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel20
  - number: '20.4'
    text: |-
      De persoon, bedoeld in het derde lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien
      van wie dit wel het geval is binnen vier weken na die dag, wordt vanaf die dag weer als verzekerde aangemerkt en
      heeft met inachtneming van de bepalingen van deze wet recht op toekenning van arbeidsongeschiktheidsuitkering.
      [Artikel 19, vierde lid][ref1], is van overeenkomstige toepassing. [Artikel 30, eerste lid, onderdeel b][ref2], is
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel30
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '30'
        hoofdstuk: II
        paragraaf: '1'
  - number: '20.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat de verzekerde, bedoeld in
      [artikel 19][ref1], recht heeft op toekenning van arbeidsongeschiktheidsuitkering, indien de dag waarop het recht
      op arbeidsongeschiktheidsuitkering zou ingaan is gelegen in een periode dat de verzekerde niet in Nederland woont
      ingeval van:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 20.5.a
    text: een verzekerde die werkzaamheden verricht in het algemeen belang;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel20
  - number: 20.5.b
    text: |-
      een verzekerde die in Aruba, Curaçao, Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en Saba
      woont; of
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel20
  - number: 20.5.c
    text: de gezinsleden van de in de onderdelen a of b bedoelde verzekerde.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel20
  - number: '20.6'
    text: |-
      Onze Minister deelt mede in welke landen op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op toekenning van arbeidsongeschiktheidsuitkering kan bestaan. In deze mededeling wordt tevens
      opgenomen:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel20
  - number: 20.6.a
    text: de vindplaats van het desbetreffende verdrag of besluit, en
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel20
  - number: 20.6.b
    text: de eventueel in dat verdrag of besluit aanwezige beperkingen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel20
  - number: '21.1'
    text: |-
      De arbeidsongeschiktheidsuitkering op grond van deze wet bestaat achtereenvolgens uit een loondervingsuitkering,
      waarvoor het dagloon als maatstaf geldt en een vervolguitkering, waarvoor het vervolgdagloon als maatstaf geldt.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel21
  - number: '21.2'
    text: |-
      De arbeidsongeschiktheidsuitkering bedraagt per dag, de zaterdagen en zondagen niet meegerekend, bij een
      arbeidsongeschiktheid van:







                    15-25%


                    14%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    25-35%


                    21%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    35-45%


                    28%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    45-55%


                    35%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    55-65%


                    42%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    65-80%


                    50,75%


                    van 100/108 maal het dagloon of het vervolgdagloon




                    80% of meer


                    75%


                    van 100/108 maal het dagloon of het vervolgdagloon
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel21
  - number: '21.3'
    text: |-
      Bij de vaststelling van de mate van arbeidsongeschiktheid wordt, zoveel doenlijk, rekening gehouden met verkregen
      nieuwe bekwaamheden.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel21
  - number: 21a
    text: |-
      De duur van de loondervingsuitkering is voor degene, die op de datum met ingang waarvan hem een
      arbeidsongeschiktheidsuitkering wordt toegekend: 58 jaar of ouder is zes jaar; 53 jaar of ouder is drie jaar; 48
      jaar of ouder is twee jaar; 43 jaar of ouder is anderhalf jaar; 38 jaar of ouder is één jaar; 33 jaar of ouder is
      een half jaar, en jonger is dan 33 jaar nihil.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel21a
  - number: 21b.1
    text: |-
      Na afloop van de in [artikel 21a][ref1] bedoelde periode bestaat recht op vervolguitkering met als maatstaf het
      vervolgdagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 21a
        hoofdstuk: II
        paragraaf: '1'
  - number: 21b.2
    text: |-
      Het vervolgdagloon is gelijk aan het minimumloon verhoogd met een percentage van het verschil tussen het dagloon en
      het minimumloon.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel21b
  - number: 21b.3
    text: |-
      Voor de berekening van het vervolgdagloon geldt een percentage van 2 maal het aantal verstreken jaren tussen het
      15e jaar en de leeftijd van de betrokkene op de datum met ingang waarvan hem een arbeidsongeschiktheidsuitkering
      wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel21b
  - number: 21b.4
    text: Indien het dagloon lager is dan het minimumloon wordt het vervolgdagloon vastgesteld op het dagloon.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel21b
  - number: 21b.5
    text: |-
      Voor de toepassing van [artikel 21a][ref1] en het derde lid wordt voor degene ten aanzien van wie
      [artikel 35, tweede lid][ref2], wordt toegepast als datum met ingang waarvan de arbeidsongeschiktheidsuitkering
      wordt toegekend in aanmerking genomen de datum waarop de arbeidsongeschiktheidsuitkering zou zijn toegekend als dat
      lid niet was toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel35
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 21a
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
  - number: '22'
    text: |-
      Een arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van 80% of meer, wordt, indien
      de betrokkene in een althans voorlopig blijvende toestand van hulpbehoevendheid, welke geregeld oppassing en
      verzorging nodig maakt, verkeert, voor de duur van die hulpbehoevendheid tot ten hoogste 100/108 maal zijn dagloon
      of zijn vervolgdagloon verhoogd. Het bepaalde in de vorige volzin vindt geen toepassing, indien de betrokkene in
      een inrichting is opgenomen en de kosten van verblijf ten laste van een zorgverzekering of een verzekering inzake
      ziektekosten komen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel22
  - number: '23.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, zo vaak hij dat nodig oordeelt de persoon die aanspraak maakt
      op of in het genot is van een arbeidsongeschiktheidsuitkering, oproepen of doen oproepen en op een door of vanwege
      het Uitvoeringsinstituut werknemersverzekeringen te bepalen plaats ondervragen of doen ondervragen in verband met
      de aanspraak op of het genot van een arbeidsongeschiktheidsuitkering of de toekenning dan wel verstrekking van een
      reïntegratie-instrument als bedoeld in [hoofdstuk IIB][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukIIB
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: IIB
  - number: '23.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan de in het eerste lid bedoelde personen op een door of vanwege
      het Uitvoeringsinstituut werknemersverzekeringen te bepalen plaats door een of meer daartoe door hem aangewezen
      deskundigen doen onderzoeken.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel23
  - number: '23.3'
    text: |-
      De daartoe door het Uitvoeringsinstituut werknemersverzekeringen aangewezen deskundige kan, ook zonder opdracht
      van het Uitvoeringsinstituut werknemersverzekeringen, de in het eerste lid bedoelde personen oproepen, ondervragen,
      onderzoeken, doen oproepen, doen ondervragen en doen onderzoeken door een of meer door hem daartoe aangewezen
      deskundigen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel23
  - number: '24.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de door hem daartoe aangewezen deskundige
      kunnen de persoon die aanspraak maakt op of in het genot is van een arbeidsongeschiktheidsuitkering
      voorschriften geven in het belang van een behandeling of van genezing dan wel voorzover dit
      voortvloeit uit de taak tot bevordering van de inschakeling in het arbeidsproces, bedoeld in
      [artikel 30, eerste lid, onderdeel b, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
  - number: '24.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan in het kader van de uitvoering van het eerste lid
      voorschrijven dat de persoon, bedoeld in het eerste lid, zich laat registreren als werkzoekende bij het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel24
  - number: '25.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen weigert de uitkering tijdelijk of blijvend, geheel of gedeeltelijk
      indien een persoon als bedoeld in [artikel 23, eerste lid][ref1], na tijdig opgeroepen te zijn, niet verscheen
      of weigerde:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel23
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '23'
        hoofdstuk: II
        paragraaf: '1'
  - number: 25.1.a
    text: |-
      vragen te beantwoorden die zijn gesteld door het Uitvoeringsinstituut werknemersverzekeringen of de door hem
      daartoe aangewezen deskundige;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel25
  - number: 25.1.b
    text: |-
      zich te laten onderzoeken door de door het Uitvoeringsinstituut werknemersverzekeringen daartoe aangewezen
      deskundige; of
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel25
  - number: 25.1.c
    text: |-
      te voldoen aan het voorschrift, gegeven door het Uitvoeringsinstituut werknemersverzekeringen of de daartoe
      aangewezen deskundige, om zich ter observatie te doen opnemen of te verblijven in een aangewezen inrichting.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel25
  - number: '25.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig het bepaalde in het eerste lid bij
      toeneming van de arbeidsongeschiktheid, voor zover deze toeneming kennelijk is voortgekomen uit dezelfde oorzaak
      als de arbeidsongeschiktheid, ter zake waarvan het niet voldoen aan de oproeping of de weigering plaatsvond.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel25
  - number: '26'
    text: |-
      Opgeroepenen en, indien hun toestand geleide nodig maakt, mede hun geleiders, worden reiskosten, verblijfkosten en
      tijdverlies vergoed in de gevallen en volgens regels, door het Uitvoeringsinstituut werknemersverzekeringen vast
      te stellen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel26
  - number: '27'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd controlevoorschriften vast te stellen. Deze
      voorschriften mogen niet verder gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel27
  - number: '28'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig het bepaalde in [artikel 25][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel25
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '25'
        hoofdstuk: II
        paragraaf: '1'
  - number: 28.a
    text: |-
      indien de belanghebbende de door het Uitvoeringsinstituut werknemersverzekeringen of de door hem daartoe aangewezen
      deskundige krachtens [artikel 24][ref1] in het belang van een behandeling of genezing of tot behoud, herstel
      of bevordering van de mogelijkheid tot het verrichten van arbeid en tot registratie als werkzoekende bij het
      Uitvoeringsinstituut werknemersverzekeringen gegeven voorschriften zonder deugdelijke grond niet opvolgt;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel24
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '24'
        hoofdstuk: II
        paragraaf: '1'
  - number: 28.b
    text: |-
      indien de belanghebbende zich niet, zolang als het Uitvoeringsinstituut werknemersverzekeringen of de door hem
      daartoe aangewezen deskundige te kennen heeft gegeven dit noodzakelijk te achten, onder geneeskundige behandeling
      stelt of indien hij de voorschriften van de behandelende arts niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel28
  - number: 28.c
    text: |-
      indien de belanghebbende zich schuldig maakt aan gedragingen, waardoor zijn genezing wordt belemmerd of nalaat
      voldoende mede te werken om aanpassing aan zijn ziekte of gebrek te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel28
  - number: 28.d
    text: |-
      indien de belanghebbende de controlevoorschriften, bedoeld in [artikel 27][ref1], of de verplichting bedoeld
      in [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], niet of
      niet behoorlijk is nagekomen dan wel de verplichting bedoeld in [artikel 80][ref3] niet binnen de door het
      Uitvoeringsinstituut werknemersverzekeringen daarvoor vastgestelde termijn is nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '27'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: 28.e
    text: indien de belanghebbende zijn arbeidsongeschiktheid opzettelijk heeft veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel28
  - number: 28.f
    text: |-
      indien belanghebbende zich niet houdt aan de voorschriften, bedoeld in [artikel 34, derde lid][ref1],
      [artikel 34a, eerste lid][ref2], of [artikel 34a, vierde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel34a
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel34a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 34a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 34a
        hoofdstuk: II
        paragraaf: '2'
  - number: 28.g
    text: |-
      indien de belanghebbende zonder redelijke gronden niet meewerkt aan een scholing of opleiding die door
      zijn werkgever of het Uitvoeringsinstituut werknemersverzekeringen uit hoofde van de uitoefening van hun
      taak op grond van [artikel 658a, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] respectievelijk
      [artikel 30, eerste lid, onderdeel b, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] wenselijk
      wordt geacht voor zijn inschakeling in de arbeid;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
  - number: 28.h
    text: |-
      indien de belanghebbende zonder deugdelijke grond weigert of heeft geweigerd mee te werken aan door zijn werkgever
      of door een door die werkgever aangewezen deskundige gegeven redelijke voorschriften of getroffen maatregelen
      die erop gericht zijn om de belanghebbende in staat te stellen passende arbeid te verrichten dan wel indien bij
      de behandeling van de aanvraag, bedoeld in [artikel 34, derde lid][ref1], en bij de beoordeling als bedoeld in
      [artikel 34a, eerste lid][ref2], blijkt dat de belanghebbende zonder deugdelijke grond onvoldoende reïntegratie-
      inspanningen heeft verricht. Voor de toepassing van dit onderdeel wordt onder werkgever mede verstaan de
      eigenrisicodrager, bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel34a
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel1
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 34a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '1'
  - number: 28.i
    text: |-
      indien de belanghebbende zonder redelijke gronden niet meewerkt aan het opstellen van de reïntegratievisie,
      bedoeld in [artikel 30a, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], of het
      reïntegratieplan, bedoeld in [artikel 30a, derde lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
  - number: 28.j
    text: |-
      indien de belanghebbende de verplichtingen die zijn opgenomen in de reïntegratievisie, bedoeld in
      [artikel 30a, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], of in het
      reïntegratieplan, bedoeld in [artikel 30a, derde lid, van die wet][ref2], niet of niet behoorlijk is nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
  - number: 28.k
    text: |-
      indien de belanghebbende die bij deelname aan een reïntegratietraject zijn reïntegratieverplichtingen niet naleeft,
      de reden daarvan niet onmiddellijk aan het reïntegratiebedrijf heeft medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel28
  - number: '29.1'
    text: |-
      Een maatregel als bedoeld in [artikel 25][ref1] of [28][ref2] wordt afgestemd op de ernst van de gedraging en de
      mate waarin de belanghebbende de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in elk
      geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel28
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '25'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '28'
        hoofdstuk: II
        paragraaf: '1'
  - number: '29.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een maatregel als bedoeld in
      [artikel 28][ref1] en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet tijdig
      nakomen van de verplichting, bedoeld in [artikel 80][ref2], indien het niet tijdig nakomen van de verplichting
      niet heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering, of ter zake van het zich
      niet houden aan de voorschriften, bedoeld in [artikel 34, derde lid][ref3], of in [artikel 34a, eerste lid][ref4],
      tenzij het niet tijdig nakomen van de verplichting of het zich niet houden aan de voorschriften plaatsvindt binnen
      een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de belanghebbende een zodanige waarschuwing
      is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel34a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '28'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 34a
        hoofdstuk: II
        paragraaf: '2'
  - number: '29.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een maatregel indien daarvoor
      dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29
  - number: '29.4'
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als bedoeld
      in [artikel 29a][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel29a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 29a
        hoofdstuk: II
        paragraaf: '1'
  - number: '29.5'
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29
  - number: 29a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op van ten hoogste het
      benadelingsbedrag wegens het niet of niet behoorlijk nakomen door de belanghebbende of zijn wettelijke
      vertegenwoordiger van de verplichtingen, bedoeld in [artikel 80][ref1]. De bestuurlijke boete is niet lager dan de
      boete die op grond van het derde lid zou worden opgelegd indien er geen sprake was van een benadelingsbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: 29a.2
    text: |-
      In dit artikel wordt onder benadelingsbedrag verstaan het brutobedrag dat als gevolg van het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in [artikel 80][ref1], ten onrechte of tot een te hoog bedrag aan
      uitkering is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: 29a.3
    text: |-
      Indien het niet of niet behoorlijk nakomen door de belanghebbende of diens wettelijke vertegenwoordiger
      van de verplichting, bedoeld in [artikel 80][ref1], niet heeft geleid tot een benadelingsbedrag, legt het
      Uitvoeringsinstituut werknemersverzekeringen een bestuurlijke boete op van ten hoogste het bedrag van de tweede
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 29a.4
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een bestuurlijke boete als
      bedoeld in het derde lid en volstaan met het geven van een schriftelijke waarschuwing wegens het niet of niet
      behoorlijk nakomen door de belanghebbende of diens wettelijke vertegenwoordiger van de verplichting, bedoeld in
      [artikel 80][ref1], tenzij het niet of niet behoorlijk nakomen van de verplichting plaatsvindt binnen een periode
      van twee jaar te rekenen vanaf de datum waarop eerder aan de werknemer een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: 29a.5
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op wegens het niet of niet
      behoorlijk nakomen door de belanghebbende of zijn wettelijke vertegenwoordiger van de verplichtingen, bedoeld in
      [artikel 80][ref1], als gevolg waarvan ten onrechte of tot een te hoog bedrag aan uitkering is ontvangen, van ten
      hoogste 150 procent van het benadelingsbedrag indien binnen een tijdvak van vijf jaar voorafgaand aan de dag van
      het begaan van de overtreding een eerdere bestuurlijke boete of strafrechtelijke sanctie is opgelegd wegens een
      eerdere overtreding, bestaande uit eenzelfde gedraging, die onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: 29a.6
    text: |-
      Onder eenzelfde gedraging als bedoeld in het vijfde lid wordt verstaan het niet of niet behoorlijk nakomen
      van de verplichting, bedoeld in de [artikelen 80][ref1] van deze wet, [25 van de Werkloosheidswet][ref2],
      [12 van de Toeslagenwet][ref3], [12, eerste lid, van de Wet inkomensvoorziening oudere werklozen][ref4],
      [31, eerste lid][ref5], of [49 van de Ziektewet][ref6], als gevolg waarvan ten onrechte of tot een te hoog bedrag
      aan uitkering, ziekengeld of toeslag is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004043#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0024394#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel31
      [ref6]: https://wetten.overheid.nl/BWBR0001888#Artikel49
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0004043
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0024394
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0001888
        artikel: '31'
      - id: ref6
        bwb_id: BWBR0001888
        artikel: '49'
  - number: 29a.7
    text: |-
      In afwijking van het vijfde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens de eerdere
      overtreding, bedoeld in het vijfde lid, de belanghebbende of zijn wettelijke vertegenwoordiger is gestraft met een
      onvoorwaardelijke gevangenisstraf.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29a
  - number: 29a.8
    text: 'Het Uitvoeringsinstituut werknemersverzekeringen kan:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29a
  - number: 29a.8.a
    text: de bestuurlijke boete verlagen indien sprake is van verminderde verwijtbaarheid;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29a
  - number: 29a.8.b
    text: afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29a
  - number: 29a.9
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van
      belang zijn.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29a
  - number: 29a.10
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29a
  - number: 29a.11
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij de bestuurlijk boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29a
  - number: 29a.12
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de bestuurlijk boete is vastgesteld ook ten nadele van de belanghebbende of diens wettelijke
      vertegenwoordiger wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 29g.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verrekent de bestuurlijke boete met een
      uitkering op grond van deze wet, de [Werkloosheidswet][ref1], de [Ziektewet][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4],
      de [Wet werk en arbeidsondersteuning jonggehandicapten][ref5], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref6], de [Wet inkomensvoorziening oudere werklozen][ref7],
      de [Wet arbeid en zorg][ref8] of een toeslag op grond van de [Toeslagenwet][ref9], die de degene aan wie een
      bestuurlijke boete is opgelegd ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0008656
      [ref5]: https://wetten.overheid.nl/BWBR0008657
      [ref6]: https://wetten.overheid.nl/BWBR0002822
      [ref7]: https://wetten.overheid.nl/BWBR0024394
      [ref8]: https://wetten.overheid.nl/BWBR0013008
      [ref9]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0008656
      - id: ref5
        bwb_id: BWBR0008657
      - id: ref6
        bwb_id: BWBR0002822
      - id: ref7
        bwb_id: BWBR0024394
      - id: ref8
        bwb_id: BWBR0013008
      - id: ref9
        bwb_id: BWBR0004043
  - number: 29g.2
    text: |-
      De Sociale verzekeringsbank onderscheidenlijk de gemeente betaalt het bedrag van de bestuurlijke boete, zonder
      dat daarvoor een machtiging nodig is, op zijn verzoek aan het Uitvoeringsinstituut werknemersverzekeringen
      indien degene aan wie een bestuurlijke boete is opgelegd een uitkering ontvangt op grond van de
      [Algemene Ouderdomswet][ref1], de [Algemene nabestaandenwet][ref2], de [Wet werk en bijstand][ref3],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0015703
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
  - number: 29g.3
    text: |-
      De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref1] aan de raad voor de kinderbescherming
      toegekende bevoegdheid komt gelijkelijk toe aan het Uitvoeringsinstituut werknemersverzekeringen. Indien het
      Uitvoeringsinstituut werknemersverzekeringen gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het
      dwangbevel, in afwijking van [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref2], door middel van
      toezending per post aan degene aan wie de boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 29g.4
    text: |-
      Zolang de belanghebbende of zijn wettelijke vertegenwoordiger zijn verplichting, bedoeld in
      [artikel 29a, negende lid][ref1], niet of niet behoorlijk nakomt:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel29a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 29a
        hoofdstuk: II
        paragraaf: '1'
  - number: 29g.4.a
    text: |-
      is het Uitvoeringsinstituut werknemersverzekeringen in afwijking van
      [artikel 4.93, vierde lid, van de Algemene wet bestuursrecht][ref1] bevoegd tot verrekening van de bestuurlijke
      boete voor zover beslag op de vordering van de schuldeiser nietig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 29g.4.b
    text: |-
      geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref2], niet bij de invordering van een bestuurlijke boete bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 29h.1
    text: |-
      Bij de verrekening, bedoeld in [artikel 29g, eerste lid][ref1], wordt de bestuurlijke boete, bedoeld in
      [artikel 29a, vijfde lid][ref2], door het Uitvoeringsinstituut werknemersverzekeringen, in afwijking van
      [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref3], verrekend gedurende een tijdvak van ten
      hoogste vijf jaar vanaf het moment van de dagtekening waarop de bestuurlijke boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel29g
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel29a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29h
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 29g
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 29a
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 29h.2
    text: |-
      [Artikel 29g, eerste lid][ref1], en het eerste lid zijn van overeenkomstige toepassing op de verrekening van de
      bestuurlijke boete wegens eenzelfde gedraging als bedoeld in [artikel 29a, zesde lid][ref2], indien en voor zover
      op het moment van verrekening, bedoeld in het eerste lid, de bestuurlijke boete door de overtreder niet is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel29g
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel29a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29h
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 29g
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 29a
        hoofdstuk: II
        paragraaf: '1'
  - number: 29h.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan op verzoek van de overtreder besluiten het eerste lid en
      tweede lid niet of niet meer toe te passen indien, gelet op bijzondere omstandigheden, dringende redenen daartoe
      noodzaken.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29h
  - number: 29h.4
    text: |-
      De voorgaande leden laten de verrekening van de bestuurlijke boete op grond van [artikel 29g, eerste lid][ref1],
      na het tijdvak, bedoeld in het eerste lid, onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel29g
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29h
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 29g
        hoofdstuk: II
        paragraaf: '1'
  - number: 29h.5
    text: |-
      Indien als gevolg van de verrekening, bedoeld in het eerste en tweede lid, algemene bijstand op grond van de
      [Wet werk en bijstand][ref1] wordt toegekend, wordt bij de verrekening een bij ministeriële regeling bepaald deel
      van de uitkering op grond van deze wet vrijgelaten in verband met zorgkosten, woonkosten en de kosten van kinderen.
      Het vrij te laten deel van de uitkering kan afhankelijk worden gesteld van de leefsituatie.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29h
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 29i
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen de verzekerde de uitkering op grond van deze wet tijdelijk
      of blijvend, geheel of gedeeltelijk heeft geweigerd dan wel hem een bestuurlijke boete heeft opgelegd, stelt
      het Uitvoeringsinstituut werknemersverzekeringen het reïntegratiebedrijf dat ten behoeve van die verzekerde
      werkzaamheden gericht op vergroting van de mogelijkheden tot het verrichten van arbeid of op inschakeling in arbeid
      verricht, van die beschikking in kennis voorzover dat noodzakelijk is voor de uitvoering van de werkzaamheden door
      het reïntegratiebedrijf.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel29i
  - number: '30.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd met betrekking tot uit deze wet voortvloeiende
      aanspraken geheel of ten dele, tijdelijk of blijvend, buiten aanmerking te laten:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel30
  - number: 30.1.a
    text: algehele arbeidsongeschiktheid, welke bestond op het tijdstip, dat de verzekering een aanvang nam;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel30
  - number: 30.1.b
    text: |-
      arbeidsongeschiktheid, welke binnen een half jaar na het tijdstip, dat de verzekering een aanvang nam, is
      ingetreden, terwijl de gezondheidstoestand van de betrokkene ten tijde van de aanvang van zijn verzekering het
      intreden van arbeidsongeschiktheid binnen een half jaar kennelijk moest doen verwachten.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel30
  - number: '30.2'
    text: |-
      Het eerste lid blijft buiten toepassing ten aanzien van degene die onmiddellijk voorafgaande aan het tijdstip,
      waarop de verzekering een aanvang nam, ononderbroken onbetaald verlof, tot een maximum van achttien maanden, heeft
      genoten, behoudens voorzover het betreft arbeidsongeschiktheid in de zin van het eerste lid, die bestond op de dag,
      voorafgaande aan de eerste dag van dit verlof. Als ononderbroken onbetaald verlof wordt aangemerkt perioden van
      onbetaald verlof die elkaar met een onderbreking van minder dan een maand opvolgen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel30
  - number: '30.3'
    text: |-
      De in het eerste lid, onder *b*, bedoelde bevoegdheid strekt zich mede uit tot toeneming van de
      arbeidsongeschiktheid, voor zover deze toeneming kennelijk is voortgekomen uit dezelfde oorzaak als de
      arbeidsongeschiktheid, welke binnen een half jaar na de aanvang van de verzekering is ingetreden.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel30
  - number: '30.4'
    text: |-
      Het bepaalde in het eerste lid, onder *b*, blijft buiten toepassing ten aanzien van degene, die onmiddellijk
      voorafgaande aan het tijdstip, dat de verzekering een aanvang nam, in verband met het bepaalde in
      [artikel 6, eerste lid, onder a of b][ref1], niet verzekerd was.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel6
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '6'
        hoofdstuk: I
        paragraaf: '2'
  - number: '30.5'
    text: |-
      Onze Minister kan met betrekking tot de bij dit artikel aan het Uitvoeringsinstituut werknemersverzekeringen
      gegeven bevoegdheid nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel30
  - number: 30a
    text: |-
      Indien voor het vaststellen van het recht op uitkering op grond van deze wet, in het kader van een aanvraag
      voor de toekenning van een uitkering op grond van deze wet, naar het oordeel van het Uitvoeringsinstituut
      werknemersverzekeringen een medisch onderzoek nodig is en de betrokkene niet meewerkt aan dat onderzoek, blijven
      eventuele uit deze wet voortvloeiende aanspraken op een uitkering op grond van deze wet buiten aanmerking, voor
      zolang het recht op uitkering niet kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel30a
  - number: '31'
    text: |-
      Zolang het Uitvoeringsinstituut werknemersverzekeringen ingevolge de [artikelen 25][ref1], [28][ref2],
      [30][ref3], en [30a][ref4] arbeidsongeschiktheid buiten aanmerking laat, vindt [artikel 18, tweede lid][ref5],
      overeenkomstige toepassing met betrekking tot de door de betrokkene aan deze wet nog te ontlenen aanspraken, met
      dien verstande, dat voor de aanvang van de verzekering in de plaats treedt het tijdstip, met ingang waarvan het
      Uitvoeringsinstituut werknemersverzekeringen arbeidsongeschiktheid buiten aanmerking laat.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel30a
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '25'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '28'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '30'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 30a
        hoofdstuk: II
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
  - number: '33.1'
    text: |-
      Met betrekking tot uit deze wet voortvloeiende aanspraken wordt buiten aanmerking gelaten
      arbeidsongeschiktheid, welke is ingetreden tijdens een periode, gedurende welke de verzekerde op grond van
      [artikel 64 van de Wet financiering sociale verzekeringen][ref1] ontheffing was verleend van verplichtingen op
      grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel64
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '64'
  - number: '33.2'
    text: |-
      [Artikel 30, tweede lid][ref1], en [artikel 31][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel31
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '30'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '31'
        hoofdstuk: II
        paragraaf: '1'
  - number: '34.1'
    text: De arbeidsongeschiktheidsuitkering wordt op aanvraag toegekend.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34
  - number: '34.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt de belanghebbende van de mogelijkheid van het doen van een
      aanvraag schriftelijk in kennis uiterlijk vier maanden vóór de datum waarop de wachttijd van 104 weken, bedoeld in
      [artikel 19, eerste lid][ref1], verstrijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '34.3'
    text: |-
      De belanghebbende, die in aanmerking wenst te komen voor toekenning van de uitkering, dient zijn aanvraag
      te doen binnen 21 maanden na aanvang van zijn arbeidsongeschiktheid. Indien de wachttijd, bedoeld in
      [artikel 19, eerste lid][ref1], is verlengd op grond van het zevende lid van dat artikel wordt de aanvraag voor de
      toekenning van de uitkering, in afwijking van de eerste zin, uiterlijk 13 weken voor het verstrijken van de door
      het Uitvoeringsinstituut werknemersverzekeringen vastgestelde verlengde wachttijd gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '34.4'
    text: |-
      Onverminderd het in deze wet terzake van herziening of intrekking van de arbeidsongeschiktheidsuitkering
      bepaalde wordt ten aanzien van personen die na 1 juli 1954 zijn geboren, op een bij of krachtens algemene
      maatregel van bestuur bepaald tijdstip door het Uitvoeringsinstituut werknemersverzekeringen bezien of er in
      verband met wijziging van de mate van arbeidsongeschiktheid gronden zijn voor herziening of intrekking van de
      arbeidsongeschiktheidsuitkering. Het tijdstip kan voor verschillende groepen van personen verschillend worden
      vastgesteld. Bij algemene maatregel van bestuur kan worden bepaald dat de eerste zin niet van toepassing is op
      bepaalde groepen van personen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34
  - number: '34.5'
    text: |-
      Ten aanzien van personen die na 1 juli 1954 maar voor 2 juli 1959 zijn geboren en die voor 22 februari 2007 op
      grond van het vierde lid zijn herbeoordeeld, wordt door het Uitvoeringsinstituut werknemersverzekeringen bezien
      of er per 22 februari 2007 in verband met een wijziging van de mate van arbeidsongeschiktheid gronden zijn voor
      herziening, heropening of intrekking van de arbeidsongeschiktheidsuitkering. De eerste zin is niet van toepassing
      op personen die op 22 februari 2007 reeds in de hoogste arbeidsongeschiktheidsklasse zijn ingedeeld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34
  - number: '34.6'
    text: |-
      Op grond van de beoordeling, bedoeld in het vijfde lid, wordt de mate van arbeidsongeschiktheid van de persoon,
      bedoeld in het vijfde lid, die niet heeft verzocht om een nieuwe medische beoordeling, niet lager vastgesteld dan
      de mate van arbeidsongeschiktheid die voor die persoon gold op 21 februari 2007.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34
  - number: '34.7'
    text: |-
      Een aanvraag wordt geacht tijdig te zijn ingediend, indien het Uitvoeringsinstituut werknemersverzekeringen de
      kennisgeving als bedoeld in het tweede lid, niet heeft gedaan dan wel indien bij een latere kennisgeving dan
      bedoeld in het tweede lid de aanvraag wordt ingediend binnen vier weken nadat deze kennisgeving is ontvangen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34
  - number: '34.8'
    text: |-
      Indien de toepassing van het derde lid zou leiden tot kennelijke hardheid, is het Uitvoeringsinstituut
      werknemersverzekeringen bevoegd de uitkering ambtshalve toe te kennen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34
  - number: '34.9'
    text: |-
      Indien de wachttijd, bedoeld in [artikel 19, eerste lid][ref1], is verlengd op grond van het
      [zevende lid van dat artikel][ref2], besluit het Uitvoeringsinstituut werknemersverzekeringen de aanvraag, bedoeld
      in het derde lid, niet te behandelen, indien deze is ingediend vóór het verzoek tot de verlenging.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 34a.1
    text: |-
      De aanvraag voor de toekenning van de uitkering gaat vergezeld van een reïntegratieverslag als bedoeld in
      [artikel 71a][ref1]. De eerste volzin is niet van toepassing voorzover [artikel 71b, eerste lid][ref2], toepassing
      vindt. Het Uitvoeringsinstituut werknemersverzekeringen beoordeelt of de werkgever en de verzekerde dan wel de
      eigenrisicodrager, bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref3] en de personen, bedoeld
      in [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref4], die laatstelijk tot hem in dienstbetrekking
      stonden, in redelijkheid hebben kunnen komen tot de reïntegratie- inspanningen, die zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel71b
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 71b
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 34a.2
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen toepassing heeft gegeven aan
      [artikel 71a, negende lid][ref1], of [artikel 71b, derde lid, tweede zin][ref2], wijst het Uitvoeringsinstituut
      werknemersverzekeringen de aanvraag af.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel71b
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 71b
        hoofdstuk: III
        paragraaf: '1'
  - number: 34a.3
    text: |-
      Bij de bekendmaking van de beschikking, bedoeld in het tweede lid, maakt het Uitvoeringsinstituut
      werknemersverzekeringen melding van de mogelijkheid tot het doen van een nieuwe aanvraag voor de toekenning van de
      uitkering alsmede van de termijn binnen welke die aanvraag wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34a
  - number: 34a.4
    text: 'De termijn, waarbinnen de belanghebbende een nieuwe aanvraag voor de toekenning van de uitkering doet, is:'
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34a
  - number: 34a.4.a
    text: |-
      uiterlijk dertien weken voor het verstrijken van het tijdvak waarover de werkgever op grond van
      [artikel 629 lid 11, onderdeel d, van Boek 7 van het Burgerlijk Wetboek][ref1], verplicht is het loon te betalen
      dan wel op grond van [artikel 76a, zesde lid, onderdeel c, van de Ziektewet][ref2], verplicht is bezoldiging te
      betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 76a
  - number: 34a.4.b
    text: |-
      zo spoedig mogelijk, indien het tijdvak waarover de werkgever op grond van
      [artikel 629 lid 11, onderdeel d, van Boek 7 van het Burgerlijk Wetboek][ref1], verplicht is het loon te betalen
      dan wel op grond van [artikel 76a, zesde lid, onderdeel c, van de Ziektewet][ref2], verplicht is bezoldiging te
      betalen, minder bedraagt dan 13 weken of indien de werkgever vóór het verstrijken van dat tijdvak geen loon meer
      verschuldigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 76a
  - number: 34a.4.c
    text: |-
      uiterlijk dertien weken voor het verstrijken van het tijdvak waarover de eigenrisicodrager,
      bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref1], op grond van
      [artikel 29, negende lid, van die wet][ref2] verplicht is het ziekengeld te betalen;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 34a.4.d
    text: |-
      zo spoedig mogelijk, indien het tijdvak waarover de eigenrisicodrager, bedoeld
      in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref1], op grond van
      [artikel 29, negende lid, van die wet][ref2] verplicht is het ziekengeld te betalen, minder bedraagt dan 13 weken.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
  - number: '35.1'
    text: |-
      De arbeidsongeschiktheidsuitkering gaat in op de dag, met ingang van welke de belanghebbende aan de vereisten voor
      het recht op toekenning van die uitkering voldoet.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel35
  - number: '35.2'
    text: |-
      In afwijking van het bepaalde in het vorige lid kan de arbeidsongeschiktheidsuitkering niet vroeger ingaan dan
      een jaar vóór de dag, waarop de aanvraag werd ingediend. Het Uitvoeringsinstituut werknemersverzekeringen kan voor
      bijzondere gevallen van het bepaalde in de vorige volzin afwijken.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel35
  - number: '36.1'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt herzien wanneer degene, aan wie zij is toegekend, ingevolge het bij of
      krachtens deze wet bepaalde voor een hogere of lagere uitkering in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel36
  - number: '36.2'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van de arbeidsongeschiktheidsuitkering plaats
      met inachtneming van het bepaalde in de [artikelen 37 tot en met 40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel37
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '37'
        hoofdstuk: II
        paragraaf: '2'
  - number: 36a.1
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een beschikking tot
      toekenning van arbeidsongeschiktheidsuitkering en terzake van weigering van een zodanige uitkering, herziet het
      Uitvoeringsinstituut werknemersverzekeringen een dergelijke beschikking of trekt hij die in:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel36a
  - number: 36a.1.a
    text: |-
      ter uitvoering van een beschikking als bedoeld in [artikel 30][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel30
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '30'
        hoofdstuk: II
        paragraaf: '1'
  - number: 36a.1.b
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 25][ref1], [28][ref2] of
      [80][ref3] heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '25'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '28'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: 36a.1.c
    text: indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel36a
  - number: 36a.1.d
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 25][ref1], [28][ref2] of
      [80][ref3] ertoe leidt dat niet kan worden vastgesteld of nog recht op uitkering bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel80
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '25'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '28'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '80'
        hoofdstuk: V
  - number: 36a.2
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van herziening of intrekking als bedoeld in het eerste lid af te zien.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel36a
  - number: 36a.3
    text: |-
      Een beschikking tot toekenning van loonsuppletie als bedoeld in [artikel 65c][ref1], of van inkomenssuppletie
      als bedoeld in [artikel 65d][ref2] wordt ingetrokken of herzien indien onderscheidenlijk de loonsuppletie, de
      inkomenssuppletie of de voorziening ten onrechte of tot een te hoog bedrag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel65c
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel65d
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 65c
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 65d
        hoofdstuk: IIB
  - number: 36b.1
    text: |-
      De intrekking of verlaging van een arbeidsongeschiktheidsuitkering, die voortvloeit uit het door de werkgever
      ingesteld bezwaar of beroep, vindt niet eerder plaats dan zes weken na de dag waarop de beslissing op bezwaar is
      bekendgemaakt of de uitspraak is gedaan. De eerste zin is van overeenkomstige toepassing in geval van intrekking
      van het bezwaar of beroep omdat het Uitvoeringsinstituut werknemersverzekeringen geheel of gedeeltelijk is tegemoet
      gekomen aan het bezwaar of beroep van de werkgever.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel36b
  - number: 36b.2
    text: |-
      Het eerste lid geldt niet, indien de uitkering door eigen schuld of toedoen van de verzekerde ten onrechte of tot
      een te hoog bedrag is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel36b
  - number: '37.1'
    text: |-
      Terzake van toeneming van arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering, berekend
      naar een arbeidsongeschiktheid van minder dan 45%, onverminderd de [artikelen 39][ref1] en [39a][ref2], plaats
      zodra de toegenomen arbeidsongeschiktheid onafgebroken 104 weken heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel39a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '39'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 39a
        hoofdstuk: II
        paragraaf: '2'
  - number: '37.2'
    text: |-
      De in het eerste lid bedoelde herziening vindt niet plaats indien de uitkeringsgerechtigde bij het intreden van de
      toegenomen arbeidsongeschiktheid uitsluitend op grond van [artikel 7b][ref1] als werknemer wordt beschouwd en de
      toeneming kennelijk is voortgekomen uit een andere oorzaak dan die waaruit de ongeschiktheid, terzake waarvan de
      arbeidsongeschiktheidsuitkering wordt ontvangen, is voortgekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel7b
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 7b
        hoofdstuk: I
        paragraaf: '2'
  - number: '37.3'
    text: |-
      Voor het bepalen van het tijdvak van 104 weken, bedoeld in het eerste lid, worden perioden van
      toegenomen arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan
      vier weken opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering
      in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2] of
      [3:10, eerste lid, van de Wet arbeid en zorg][ref3] wordt genoten, tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de vaststelling van het tijdvak van 104 weken blijven
      perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref4],
      [3:8][ref5], of [3:10, eerste lid, van de Wet arbeid en zorg][ref6] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '38.1'
    text: |-
      Terzake van toeneming van arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering, berekend
      naar een arbeidsongeschiktheid van ten minste 45%, onverminderd [artikel 39][ref1], plaats zodra de toegenomen
      arbeidsongeschiktheid onafgebroken vier weken heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel39
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '39'
        hoofdstuk: II
        paragraaf: '2'
  - number: '38.2'
    text: |-
      Indien de arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45%, doch minder
      dan 80%, wegens afneming van de arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder dan
      45%, doch binnen vier weken na de dag, met ingang waarvan die uitkering is herzien, de arbeidsongeschiktheid weer
      toeneemt, is het eerste lid van toepassing, onder afwijking van [artikel 37][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel37
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '37'
        hoofdstuk: II
        paragraaf: '2'
  - number: '38.3'
    text: |-
      Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste lid, worden perioden van
      toegenomen arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan
      vier weken opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering
      in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2] of
      [3:10, eerste lid, van de Wet arbeid en zorg][ref3] wordt genoten, tenzij de ongeschiktheid redelijkerwijs
      niet geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de vaststelling van de eerstgenoemde periode
      van vier weken blijven perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van
      [artikel 3:7, eerste lid][ref4], [3:8][ref5], of [3:10, eerste lid, van de Wet arbeid en zorg][ref6] wordt genoten,
      buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '39.1'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering steeds
      plaats zodra de toeneming van de arbeidsongeschiktheid intreedt, indien deze intreedt:
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel39
  - number: 39.1.a
    text: binnen vier weken na de dag, met ingang van welke de arbeidsongeschiktheidsuitkering werd toegekend;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel39
  - number: 39.1.b
    text: |-
      binnen vier weken na de dag, met ingang van welke de arbeidsongeschiktheidsuitkering reeds eerder wegens toegenomen
      arbeidsongeschiktheid werd herzien;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel39
  - number: 39.1.c
    text: |-
      binnen vier weken na de dag, met ingang van welke de arbeidsongeschiktheidsuitkering, welke voordien was berekend
      naar een arbeidsongeschiktheid van 80 % of meer, wegens afneming van de arbeidsongeschiktheid is herzien naar een
      arbeidsongeschiktheid van minder dan 80 %;
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel39
  - number: 39.1.d
    text: binnen een door Onze Minister aan te geven termijn in door Onze Minister aan te wijzen gevallen.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel39
  - number: '39.2'
    text: |-
      Indien de arbeidsongeschiktheidsuitkering werd toegekend, onderscheidenlijk eerder wegens toegenomen
      arbeidsongeschiktheid werd herzien, met toepassing van [artikel 35, tweede lid][ref1], onderscheidenlijk
      [artikel 42, tweede lid][ref2], geldt met betrekking tot het bepaalde in het vorige lid, onder *a* en *b*, als
      dag met ingang van welke de arbeidsongeschiktheidsuitkering werd toegekend onderscheidenlijk herzien de dag, met
      ingang van welke die uitkering zou zijn toegekend onderscheidenlijk herzien, indien [artikel 35, tweede lid][ref3],
      onderscheidenlijk [artikel 42, tweede lid][ref4], geen toepassing zou hebben gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel42
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel39
    references:
