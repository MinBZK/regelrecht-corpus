  - number: 91g.1
    text: |-
      Ten aanzien van dienstbetrekkingen die voorafgaand aan 1 januari 2012 zijn ingegaan en waarvoor
      voorafgaand aan 1 januari 2012 een aanvraag voor subsidie voor loonkosten is ingediend, blijven
      de [artikelen 65i][ref1] en [65j][ref2] van deze wet, de daarop berustende bepalingen en
      [artikel 30e van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] zoals die luidden op 31 december
      2011 gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel65i
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel65j
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30e
