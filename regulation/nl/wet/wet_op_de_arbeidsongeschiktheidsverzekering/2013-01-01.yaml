        hoofdstuk: II
        paragraaf: '2'
  - number: '39.3'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering op
      grond van een herbeoordeling als bedoeld in [artikel 34, vijfde lid][ref1], plaats met ingang van 22 februari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
  - number: '39.4'
    text: |-
      Onze Minister is bevoegd regels te stellen voor gevallen waarbij direct herziening van de
      arbeidsongeschiktheidsuitkering plaatsvindt. Ingevolge deze regels kan bedoelde herziening slechts plaatsvinden ten
      behoeve van degene die bij hervatting van de arbeid inkomen geniet, dat minder bedraagt dan evenredig is aan zijn
      nog bestaande arbeidsgeschiktheid.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel39
  - number: 39a.1
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid die intreedt binnen vijf jaar na de datum van
      toekenning of herziening van de arbeidsongeschiktheidsuitkering en die voortkomt uit dezelfde oorzaak
      als de arbeidsongeschiktheid ter zake waarvan uitkering wordt genoten, vindt herziening van de
      arbeidsongeschiktheidsuitkering steeds plaats, zodra de toegenomen arbeidsongeschiktheid onafgebroken vier weken
      heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel39a
  - number: 39a.2
    text: |-
      Voor het bepalen van de periode van vier weken, bedoeld in het eerste lid, worden perioden van
      toegenomen arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan
      vier weken opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering
      in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2] of
      [3:10, eerste lid, van de Wet arbeid en zorg][ref3] wordt genoten, tenzij de ongeschiktheid redelijkerwijs
      niet geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de vaststelling van de eerstgenoemde periode
      van vier weken blijven perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van
      [artikel 3:7, eerste lid][ref4], [3:8][ref5], of [3:10, eerste lid, van de Wet arbeid en zorg][ref6] wordt genoten,
      buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel39a
    references:
      - id: ref1
