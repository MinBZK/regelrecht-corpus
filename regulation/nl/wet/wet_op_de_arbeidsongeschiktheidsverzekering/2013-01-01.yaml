  - number: 98f.2
    text: |-
      [Artikel 43a, vierde lid, onderdeel b][ref1], zoals dat luidde op de dag voor inwerkingtreding van de Wet
      harmonisatie en vereenvoudiging socialezekerheidswetgeving blijft van toepassing op de persoon die op of voor de
      dag van inwerkingtreding van die wet arbeidsongeschikt werd als bedoeld in artikel 43a, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel98f
