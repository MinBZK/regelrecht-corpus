        artikel: '3'
  - number: 39a.3
    text: |-
      Dit artikel vindt geen toepassing, indien recht bestaat op herziening van de arbeidsongeschiktheidsuitkering op
      grond van [artikel 38][ref1] of [39, eerste lid, onderdelen a tot en met c, of derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel39
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '38'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '39'
        hoofdstuk: II
        paragraaf: '2'
  - number: 39b
    text: |-
      Indien als gevolg van de toeneming van de arbeidsongeschiktheid zowel recht op herziening van de
      arbeidsongeschiktheidsuitkering bestaat of is ontstaan op grond van de [artikelen 38][ref1], [39][ref2]
      of [39a][ref3], als op ziekengeld op grond van de [Ziektewet][ref4], wordt het bedrag waarmee de
      arbeidsongeschiktheidsuitkering is of wordt verhoogd uitbetaald voor zover dit het ziekengeld overtreft, danwel
      zou overtreffen, indien het ziekengeld op grond van [artikel 45 van de Ziektewet][ref5] geheel of gedeeltelijk
      is geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel39a
      [ref4]: https://wetten.overheid.nl/BWBR0001888
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel45
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel39b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '38'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '39'
        hoofdstuk: II
        paragraaf: '2'
