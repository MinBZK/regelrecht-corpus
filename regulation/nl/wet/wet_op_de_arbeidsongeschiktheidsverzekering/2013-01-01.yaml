  - number: 98e
    text: |-
      Arbeidsongeschiktheidsuitkeringen die zijn toegekend voor de inwerkingtreding van de Wet wijziging systematiek
      herbeoordelingen arbeidsongeschiktheidswetten, dan wel daarna met toepassing van [artikel 91b][ref1], worden geacht
      te zijn toegekend voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel91b
    url: https://wetten.overheid.nl/BWBR0002524/2013-01-01#Artikel98e
    references:
