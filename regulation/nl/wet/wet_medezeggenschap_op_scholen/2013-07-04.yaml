  - number: '15.1'
    text: |-
      Een besluit met betrekking tot een aangelegenheid als bedoeld in [artikel 11, onder c, d, e en m][ref1], wordt
      niet ten uitvoer gelegd voordat een definitief besluit is genomen over de regeling van de gevolgen van dat besluit
      voor het personeel, dan wel voor de ouders of leerlingen, tenzij dringende redenen in het belang van de school een
      eerdere tenuitvoerlegging noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel11
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '11'
        hoofdstuk: '3'
  - number: '15.2'
    text: |-
      Een besluit met betrekking tot een aangelegenheid als bedoeld in [artikel 11, onderdeel b][ref1], wordt niet
      genomen dan na afweging van in elk geval de onderwijskundige, de personele en de materiële belangen van de school,
      welke afweging schriftelijk in de motivering van het besluit tot uitdrukking wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel11
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '11'
        hoofdstuk: '3'
  - number: '15.3'
    text: |-
      Een besluit met betrekking tot een aangelegenheid als bedoeld in de [artikelen 11, onderdeel p][ref1], en
      [13, onderdeel h][ref2], wordt niet genomen dan na raadpleging van de ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel13
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel15
