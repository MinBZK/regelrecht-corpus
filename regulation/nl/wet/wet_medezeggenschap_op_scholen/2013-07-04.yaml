        artikel: '12'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0020685
        artikel: '13'
        hoofdstuk: '3'
      - id: ref6
        bwb_id: BWBR0020685
        artikel: '14'
        hoofdstuk: '3'
  - number: 8.2.f
    text: |-
      ten minste eenmaal per jaar schriftelijk gegevens over de hoogte en inhoud van de arbeidsvoorwaardelijke regelingen
      en afspraken per groep van de in de school werkzame personen en de leden van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel8
  - number: 8.2.g
    text: |-
      ten minste eenmaal per jaar schriftelijk gegevens over de hoogte en inhoud van de arbeidsvoorwaardelijke regelingen
      en afspraken met het orgaan van de rechtspersoon dat is belast met het toezicht op het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel8
  - number: 8.2.h
    text: |-
      aan het begin van het schooljaar schriftelijk de gegevens met betrekking tot de samenstelling van het bevoegd
      gezag, de organisatie binnen de school, het managementstatuut en de hoofdpunten van het reeds vastgestelde beleid.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel8
  - number: '8.3'
    text: |-
      Het tweede lid, onderdeel f, is uitsluitend van toepassing op bevoegde gezagsorganen waarbij in de regel
      ten minste 100 personen werkzaam zijn. Voor de toepassing van de eerste volzin wordt voor het bevoegd
      gezag van een school uitgegaan van alle scholen als bedoeld in de [Wet op het primair onderwijs][ref1], de
      [Wet op de expertisecentra][ref2] respectievelijk de [Wet op het voortgezet onderwijs][ref3] van dat bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
  - number: '8.4'
    text: |-
      Ten aanzien van het tweede lid, onderdelen f en g wordt inzichtelijk gemaakt met welk percentage deze
      arbeidsvoorwaardelijke regelingen en afspraken zich verhouden tot elkaar en tot die van het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel8
  - number: '8.5'
    text: |-
      Indien een groep van de in de school werkzame personen als bedoeld in het tweede lid, onderdeel f, of het orgaan
      van de rechtspersoon, bedoeld in het tweede lid, onderdeel g, uit minder dan vijf personen bestaat, kunnen voor
      de toepassing van die onderdelen twee of meer functies worden samengevoegd, zodat een groep van ten minste vijf
      personen ontstaat.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel8
  - number: '8.6'
    text: |-
      Indien het bevoegd gezag een voorstel voor advies of instemming voorlegt aan een geleding van de
      medezeggenschapsraad, wordt dat voorstel gelijktijdig ter kennisneming aan de andere geleding of geledingen
      aangeboden. Daarbij wordt tevens een overzicht verstrekt van de beweegredenen voor het voorstel, alsmede van de
      gevolgen die de uitwerking van het voorstel naar verwachting zal hebben voor het personeel, ouders en leerlingen en
      van de naar aanleiding daarvan genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel8
  - number: '9'
    text: |-
      De [artikelen 6][ref1], [7][ref2] en [8][ref3] zijn van overeenkomstige toepassing op de gemeenschappelijke
      medezeggenschapsraad, met dien verstande dat het de algemene gang van zaken in alle scholen of de meerderheid
      van de scholen vallend onder dezelfde onderwijswet betreft, op de medezeggenschapsraad van een regionaal
      expertisecentrum, een centrale dienst en de medezeggenschapsraad, bedoeld in [artikel 3, zesde lid][ref4], en op
      de ondersteuningsplanraad.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0020685#Artikel3
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '7'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '8'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0020685
        artikel: '3'
        hoofdstuk: '1'
  - number: '10'
    text: |-
      Het bevoegd gezag behoeft de voorafgaande instemming van de medezeggenschapsraad voor elk door het bevoegd gezag te
      nemen besluit met betrekking tot in ieder geval de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel10
  - number: 10.a
    text: verandering van de onderwijskundige doelstellingen van de school;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel10
  - number: 10.b
    text: |-
      vaststelling of wijziging van het schoolplan dan wel het leerplan of de onderwijs- en examenregeling en het
      zorgplan;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel10
  - number: 10.c
    text: vaststelling of wijziging van een mogelijk schoolreglement;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel10
  - number: 10.d
    text: |-
      vaststelling of wijziging van het beleid met betrekking tot het verrichten van ondersteunende werkzaamheden door
      ouders ten behoeve van de school en het onderwijs;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel10
  - number: 10.e
    text: |-
      vaststelling of wijziging van regels op het gebied van het veiligheids-, gezondheids- en welzijnsbeleid, voor zover
      niet behorend tot de bevoegdheid van de personeelsgeleding;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel10
  - number: 10.f
    text: |-
      de aanvaarding van materiële bijdragen of geldelijke bijdragen anders dan in [artikel 13, onderdeel c][ref1],
      en [artikel 14, tweede lid, onderdeel c][ref2], bedoeld en niet gebaseerd op de onderwijswetgeving indien het
      bevoegd gezag daarbij verplichtingen op zich neemt waarmee de leerlingen binnen de schooltijden respectievelijk
      het onderwijs en tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid van het bevoegd gezag,
      alsmede tijdens het overblijven, zullen worden geconfronteerd;


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel14
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '14'
        hoofdstuk: '3'
  - number: 10.g
    text: de vaststelling of wijziging van de voor de school geldende klachtenregeling;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel10
  - number: 10.h
    text: |-
      overdracht van de school of van een onderdeel daarvan, respectievelijk fusie van de school met een andere school,
      dan wel vaststelling of wijziging van het beleid ter zake, waaronder begrepen de fusie-effectrapportage, bedoeld
      in [artikel 64b van de Wet op het primair onderwijs][ref1], [artikel 66b van de Wet op de expertisecentra][ref2] en
      [artikel 53f van de Wet op het voortgezet onderwijs][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel66b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel53f
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 64b
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 66b
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 53f
  - number: 10.i
    text: |-
      de verzelfstandiging van een nevenvestiging, of een deel van de school of nevenvestiging dat zich op
      een andere locatie bevindt dan de plaats van vestiging van die school of nevenvestiging op grond van
      [artikel 84a van de Wet op het primair onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel84a
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 84a
  - number: '11'
    text: |-
      De medezeggenschapsraad wordt vooraf in de gelegenheid gesteld om advies uit te brengen over elk door het bevoegd
      gezag te nemen besluit met betrekking tot in ieder geval de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
  - number: 11.a
    text: vaststelling of wijziging van het lesrooster in het voortgezet onderwijs;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
  - number: 11.b
    text: |-
      vaststelling of wijziging van de hoofdlijnen van het meerjarig financieel beleid voor de school, waaronder
      de voorgenomen bestemming van de middelen die door het bevoegd gezag ten behoeve van de school uit de
      openbare kas zijn toegekend of van anderen zijn ontvangen, met uitzondering van de middelen, bedoeld in
      [artikel 13, onderdeel c][ref1], en [artikel 14, tweede lid, onderdeel c][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel14
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '14'
        hoofdstuk: '3'
  - number: 11.c
    text: |-
      beëindiging, belangrijke inkrimping, niet zijnde een verzelfstandiging als bedoeld in
      [artikel 84a, eerste lid, van de Wet op het primair onderwijs][ref1], of uitbreiding van de werkzaamheden van de
      school of van een belangrijk onderdeel daarvan, dan wel vaststelling of wijziging van het beleid ter zake;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel84a
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 84a
  - number: 11.d
    text: |-
      het aangaan, verbreken of belangrijk wijzigen van een duurzame samenwerking met een andere instelling, dan wel
      vaststelling of wijziging van het beleid ter zake;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
  - number: 11.e
    text: |-
      deelneming of beëindiging van deelneming aan een onderwijskundig project of experiment, dan wel vaststelling of
      wijziging van het beleid ter zake;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
  - number: 11.f
    text: vaststelling of wijziging van het beleid met betrekking tot de organisatie van de school;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
  - number: 11.g
    text: |-
      vaststelling of wijziging van een regeling op het gebied van aanstellings- of ontslagbeleid voor zover die
      vaststelling of wijziging verband houdt met de grondslag van de school of de wijziging daarvan;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
  - number: 11.h
    text: aanstelling of ontslag van de schoolleiding;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
  - number: 11.i
    text: |-
      vaststelling of wijziging van de concrete taakverdeling binnen de schoolleiding, alsmede vaststelling of wijziging
      van het managementstatuut;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
  - number: 11.j
    text: vaststelling of wijziging van het beleid met betrekking tot de toelating en verwijdering van leerlingen;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
  - number: 11.k
    text: |-
      vaststelling of wijziging van het beleid met betrekking tot de toelating van studenten die elders in opleiding zijn
      voor een functie in het onderwijs;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
  - number: 11.l
    text: regeling van de vakantie;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
  - number: 11.m
    text: het oprichten van een centrale dienst;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
  - number: 11.n
    text: nieuwbouw of belangrijke verbouwing van de school;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
  - number: 11.o
    text: vaststelling of wijziging van het beleid met betrekking tot het onderhoud van de school;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
  - number: 11.p
    text: |-
      vaststelling of wijziging van de wijze waarop de voorziening, bedoeld in
      [artikel 45, tweede lid, van de Wet op het primair onderwijs][ref1], wordt georganiseerd; en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel45
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '45'
  - number: 11.q
    text: vaststelling van de competentieprofielen van de toezichthouders en het toezichthoudend orgaan.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel11
  - number: '12.1'
    text: |-
      Het bevoegd gezag behoeft de voorafgaande instemming van het deel van de medezeggenschapsraad dat uit en door
      het personeel is gekozen, voor elk door het bevoegd gezag te nemen besluit met betrekking tot de volgende
      aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel12
  - number: 12.1.a
    text: |-
      regeling van de gevolgen voor het personeel van een besluit met betrekking tot een aangelegenheid als bedoeld in
      [artikel 10, onder i][ref1], of [artikel 11, onder c, d, e en m][ref2];


