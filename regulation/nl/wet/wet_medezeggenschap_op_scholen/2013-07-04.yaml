        artikel: '3'
        hoofdstuk: '1'
  - number: '2'
    text: |-
      De bij of krachtens deze wet gegeven voorschriften, voor zover zij de scholen en de regionale expertisecentra
      betreffen, zijn regels voor het openbaar onderwijs en voorwaarden voor bekostiging van het bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel2
  - number: '3.1'
    text: Aan een school, een centrale dienst en een regionaal expertisecentrum is een medezeggenschapsraad verbonden.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: '3.2'
    text: |-
      De medezeggenschapsraad van een school bestaat uit ten minste 4 en van een centrale dienst en een regionaal
      expertisecentrum uit ten minste 2 leden.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: '3.3'
    text: 'De medezeggenschapsraad van een school bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: 3.3.a
    text: leden die uit en door het personeel worden gekozen; en
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: 3.3.b
    text: 'leden die worden gekozen:'
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: 3.3.b.1°
    text: uit en door de ouders, voor zover het betreft een basisschool of een speciale school voor basisonderwijs;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: 3.3.b.2°
    text: |-
      uit en door de ouders, dan wel deels uit en door de ouders en deels uit en door de leerlingen die de leeftijd van
      dertien jaar hebben bereikt, voor zover het betreft een school voor speciaal onderwijs, een school voor speciaal en
      voortgezet speciaal onderwijs, dan wel een instelling voor speciaal en voortgezet speciaal onderwijs;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: 3.3.b.3°
    text: |-
      deels uit en door de ouders en deels uit en door de leerlingen, voor zover het betreft een school voor voortgezet
      onderwijs, een school voor voortgezet speciaal onderwijs of een door Onze Minister aangewezen inrichting voor
      voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: '3.4'
    text: |-
      De aantallen leden, bedoeld in het derde lid, onderdeel a en onderdeel b, zijn aan elkaar gelijk. Voor zover
      het betreft een school voor voortgezet onderwijs, een school voor voortgezet speciaal onderwijs of een door Onze
      Minister aangewezen instelling voor voortgezet onderwijs zijn tevens de aantallen leden uit en door de ouders en
      uit en door de leerlingen aan elkaar gelijk. Indien niet aan de tweede volzin kan worden voldaan, omdat onvoldoende
      ouders dan wel leerlingen bereid zijn lid te worden, kan de niet door de desbetreffende groep te vervullen plaats
      worden toegedeeld aan de andere groep.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: '3.5'
    text: |-
      De medezeggenschapsraad van een centrale dienst en van een regionaal expertisecentrum bestaat uit leden die uit en
      door het personeel worden gekozen.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: '3.6'
    text: |-
      Indien het bevoegd gezag personeel heeft benoemd of te werk gesteld zonder benoeming dat werkzaamheden verricht
      ten behoeve van meer dan een school, kan een medezeggenschapsraad worden ingesteld die bestaat uit leden die uit en
      door dat personeel worden gekozen. De medezeggenschapsraad bestaat in dat geval uit ten minste 2 leden.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: '3.7'
    text: Geen lid van de medezeggenschapsraad kunnen zijn degenen die deel uitmaken van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: '3.8'
    text: |-
      Een personeelslid dat is opgedragen om namens het bevoegd gezag op te treden in besprekingen met de
      medezeggenschapsraad kan niet tevens lid zijn van de medezeggenschapsraad.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: '3.9'
    text: |-
      Kandidaten voor de verkiezing van het deel van de medezeggenschapsraad dat uit en door het personeel wordt gekozen,
      kunnen worden gesteld door personeelsleden en door organisaties van personeel. Kandidaten voor de verkiezing
      van het deel van de medezeggenschapsraad dat uit en door de ouders of de leerlingen wordt gekozen, kunnen worden
      gesteld door ouders of leerlingen en door organisaties van ouders of leerlingen.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: '3.10'
    text: De verkiezing van de leden van de medezeggenschapsraad geschiedt bij geheime schriftelijke stemming.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: '3.11'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven over de periode waarin de verkiezing van de
      leden van de medezeggenschapsraad plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: '3.12'
    text: |-
      Het bevoegd gezag draagt er zorg voor, dat de leden van de medezeggenschapsraad niet uit hoofde van hun
      lidmaatschap van de raad worden benadeeld in hun positie met betrekking tot de school, het regionaal
      expertisecentrum en de centrale dienst. De eerste volzin is van overeenkomstige toepassing ten aanzien van
      kandidaatleden en voormalige leden.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: '3.13'
    text: |-
      De beëindiging anders dan op eigen verzoek van de betrekking van een lid van het personeel mag geen verband houden
      met de kandidaatstelling voor het lidmaatschap, het lidmaatschap of het voormalig lidmaatschap van de betrokkene
      van de medezeggenschapsraad. Een beëindiging van de betrekking in strijd met dit lid is nietig.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel3
  - number: '4.1'
    text: |-
      Indien het bevoegd gezag meer dan een school als bedoeld in de [Wet op het primair onderwijs][ref1], dan wel als
      bedoeld in de [Wet op de expertisecentra][ref2] dan wel als bedoeld in de [Wet op het voortgezet onderwijs][ref3]
      in stand houdt, stelt het bevoegd gezag een gemeenschappelijke medezeggenschapsraad in voor de scholen als
      bedoeld in de [Wet op het primair onderwijs][ref4], de [Wet op de expertisecentra][ref5] respectievelijk
      de [Wet op het voortgezet onderwijs][ref6]. Het bevoegd gezag kan ten behoeve van scholen als bedoeld in
      de [Wet op het primair onderwijs][ref7] en de [Wet op de expertisecentra][ref8] één gemeenschappelijke
      medezeggenschapsraad instellen, indien de instemming van twee derden van de leden van de desbetreffende
      medezeggenschapsraden is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
      [ref4]: https://wetten.overheid.nl/BWBR0003420
      [ref5]: https://wetten.overheid.nl/BWBR0003549
      [ref6]: https://wetten.overheid.nl/BWBR0002399
      [ref7]: https://wetten.overheid.nl/BWBR0003420
      [ref8]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
      - id: ref4
        bwb_id: BWBR0003420
      - id: ref5
        bwb_id: BWBR0003549
      - id: ref6
        bwb_id: BWBR0002399
      - id: ref7
        bwb_id: BWBR0003420
      - id: ref8
        bwb_id: BWBR0003549
  - number: '4.2'
    text: |-
      In een gemeenschappelijke medezeggenschapsraad is elke medezeggenschapsraad van de betrokken scholen
      vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel4
  - number: '4.3'
    text: |-
      De leden van de gemeenschappelijke medezeggenschapsraad worden gekozen door de leden van de desbetreffende
      afzonderlijke medezeggenschapsraden en wel zo dat het aantal leden, gekozen uit personeel onderscheidenlijk uit
      ouders of leerlingen, elk de helft van het aantal leden van de gemeenschappelijke medezeggenschapsraad bedraagt.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel4
  - number: '4.4'
    text: |-
      [Artikel 3, tweede, derde, vierde en zevende tot en met dertiende lid][ref1], is van overeenkomstige toepassing op
      de gemeenschappelijke medezeggenschapsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel3
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '3'
        hoofdstuk: '1'
  - number: 4a.1
    text: |-
      Het samenwerkingsverband stelt naast de medezeggenschapsraad, bedoeld in [artikel 3, vijfde lid][ref1], een
      ondersteuningsplanraad in.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel3
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '3'
        hoofdstuk: '1'
  - number: 4a.2
    text: |-
      De leden van de ondersteuningsplanraad worden afgevaardigd door de leden van de afzonderlijke medezeggenschapsraden
      van de in [artikel 18a, tweede lid van de Wet op het primair onderwijs][ref1], respectievelijk van de in
      [artikel 17a, tweede lid, van de Wet op het voortgezet onderwijs][ref2], bedoelde scholen en wel zo dat het aantal
      leden, gekozen uit personeel onderscheidenlijk uit ouders of leerlingen, elk de helft van het aantal leden van de
      raad bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 17a
  - number: 4a.3
    text: |-
      [Artikel 3, zevende, achtste, twaalfde en dertiende lid][ref1], is van overeenkomstige toepassing op de
      ondersteuningsplanraad.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel3
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '3'
        hoofdstuk: '1'
  - number: '5'
    text: |-
      De medezeggenschapsraad en de gemeenschappelijke medezeggenschapsraad kiezen uit hun midden een voorzitter en een
      of meer plaatsvervangende voorzitters. De voorzitter, of bij diens verhindering een plaatsvervangende voorzitter,
      vertegenwoordigt de raad in rechte.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel5
  - number: '6.1'
    text: |-
      Het bevoegd gezag en de medezeggenschapsraad komen bijeen, indien daarom onder opgave van redenen wordt verzocht
      door de medezeggenschapsraad, een geleding of het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel6
  - number: '6.2'
    text: |-
      De medezeggenschapsraad en een geleding zijn bevoegd tot bespreking van alle aangelegenheden, de school
      betreffende. De medezeggenschapsraad en een geleding zijn bevoegd over deze aangelegenheden aan het bevoegd gezag
      voorstellen te doen en standpunten kenbaar te maken. Het bevoegd gezag brengt op de voorstellen, bedoeld in de
      tweede volzin, binnen drie maanden een schriftelijke, met redenen omklede reactie uit aan de medezeggenschapsraad
      respectievelijk de geleding. Alvorens over te gaan tot het uitbrengen van de in de vorige volzin bedoelde reactie,
      stelt het bevoegd gezag de medezeggenschapsraad respectievelijk de geleding ten minste eenmaal in de gelegenheid
      met hem overleg te plegen over de voorstellen, bedoeld in de tweede volzin.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel6
  - number: '6.3'
    text: |-
      Indien twee derden van de leden van de medezeggenschapsraad en de meerderheid van elke geleding dat wensen, worden
      de besprekingen, bedoeld in het eerste en het tweede lid, met de medezeggenschapsraad gevoerd door middel van
      overleg met elke geleding afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel6
  - number: '6.4'
    text: |-
      Indien bij een bepaalde vergadering of een onderdeel daarvan een persoonlijk belang van een van de leden van
      de medezeggenschapsraad in het geding is, kan de medezeggenschapsraad besluiten dat het betrokken lid aan
      die vergadering, of dat onderdeel daarvan, niet deelneemt. De medezeggenschapsraad besluit dan tevens dat de
      behandeling van de desbetreffende aangelegenheid in een besloten vergadering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel6
  - number: '6.5'
    text: |-
      De besprekingen in de medezeggenschapsraad kunnen namens het bevoegd gezag worden gevoerd. Het bevoegd gezag
      kan een lid van de schoolleiding dan wel een personeelslid dat managementtaken verricht ten behoeve van meer
      dan een school opdragen de besprekingen met de medezeggenschapsraad dan wel bepaalde besprekingen met de
      medezeggenschapsraad namens hem te voeren. Op verzoek van het lid dat namens het bevoegd gezag het overleg voert
      of op verzoek van de medezeggenschapsraad kan het bevoegd gezag dit lid ontheffen van de taak om een bespreking
      namens het bevoegd gezag te voeren. Op verzoek van de medezeggenschapsraad voert het bevoegd gezag in bijzondere
      gevallen naast de gevallen, bedoeld in [artikel 24, eerste lid, onderdeel e][ref1], zelf de besprekingen met de
      medezeggenschapsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel24
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '24'
        hoofdstuk: '4'
  - number: '7.1'
    text: De medezeggenschapsraad bevordert naar vermogen openheid en onderling overleg in de school.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel7
  - number: '7.2'
    text: |-
      De medezeggenschapsraad waakt voorts in de school tegen discriminatie op welke grond dan ook en bevordert gelijke
      behandeling in gelijke gevallen en in het bijzonder de gelijke behandeling van mannen en vrouwen alsmede de
      inschakeling van gehandicapten en allochtone werknemers.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel7
  - number: '7.3'
    text: |-
      De medezeggenschapsraad doet aan alle bij de school betrokkenen schriftelijk verslag van zijn werkzaamheden en
      stelt de geledingen en de eventuele raden, bedoeld in [artikel 20][ref1], in de gelegenheid om over aangelegenheden
      die de betrokken geleding of raden in het bijzonder aangaan, met hem overleg te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel20
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '20'
        hoofdstuk: '4'
  - number: '8.1'
    text: |-
      De medezeggenschapsraad ontvangt van het bevoegd gezag, al dan niet gevraagd, tijdig alle inlichtingen die deze
      voor de vervulling van zijn taak redelijkerwijze nodig heeft.
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel8
  - number: '8.2'
    text: 'De medezeggenschapsraad ontvangt in elk geval:'
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel8
  - number: 8.2.a
    text: jaarlijks de begroting en bijbehorende beleidsvoornemens op financieel, organisatorisch en onderwijskundig gebied;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel8
  - number: 8.2.b
    text: |-
      jaarlijks voor 1 mei informatie over de berekening die ten grondslag ligt aan de middelen uit 's Rijks kas die
      worden toegerekend aan het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel8
  - number: 8.2.c
    text: |-
      jaarlijks voor 1 juli een jaarverslag als bedoeld in [artikel 171 van de Wet op het primair onderwijs][ref1],
      [artikel 157 van de Wet op de expertisecentra][ref2] of de gegevens, bedoeld in
      [artikel 106, eerste lid, van de Wet op het voortgezet onderwijs][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel157
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel106
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '157'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '106'
  - number: 8.2.d
    text: de uitgangspunten die het bevoegd gezag hanteert bij de uitoefening van zijn bevoegdheden;
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel8
  - number: 8.2.e
    text: |-
      terstond informatie over elk oordeel van de klachtencommissie, bedoeld in
      [artikel 14 van de Wet op het primair onderwijs][ref1], [artikel 23 van de Wet op de expertisecentra][ref2]
      en [artikel 24b van de Wet op het voortgezet onderwijs][ref3], waarbij de commissie een klacht gegrond heeft
      geoordeeld en over de eventuele maatregelen die het bevoegd gezag naar aanleiding van dat oordeel zal nemen,
      een en ander met inachtneming van de regelingen, bedoeld in de [artikelen 12, eerste lid, onderdeel m][ref4],
      [13, onderdeel i][ref5] en [14, tweede lid, onderdeel f en derde lid, onderdeel d][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel24b
      [ref4]: https://wetten.overheid.nl/BWBR0020685#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0020685#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0020685#Artikel14
    url: https://wetten.overheid.nl/BWBR0020685/2013-07-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 24b
      - id: ref4
