  - number: 8.2.f
    text: |-
      ten minste eenmaal per jaar schriftelijk gegevens over de hoogte en inhoud van de arbeidsvoorwaardelijke regelingen
      en afspraken per groep van de in de school werkzame personen en de leden van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel8
  - number: 8.2.g
    text: |-
      ten minste eenmaal per jaar schriftelijk gegevens over de hoogte en inhoud van de arbeidsvoorwaardelijke regelingen
      en afspraken met het orgaan van de rechtspersoon dat is belast met het toezicht op het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel8
  - number: 8.2.h
    text: |-
      aan het begin van het schooljaar schriftelijk de gegevens met betrekking tot de samenstelling van het bevoegd
      gezag, de organisatie binnen de school, het managementstatuut en de hoofdpunten van het reeds vastgestelde beleid;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel8
  - number: 8.2.i
    text: |-
      jaarlijks na afloop van het schooljaar doch uiterlijk 1 oktober daaropvolgend gegevens over
      het aantal daadwerkelijk verzorgde uren van een op de school verzorgd onderwijsprogramma
      als bedoeld in [artikel 6g, zesde lid, van de Wet op het voortgezet onderwijs][ref1] en
      [artikel 25 van de Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel25
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6g
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '25'
  - number: '8.3'
    text: |-
      Het tweede lid, onderdeel f, is uitsluitend van toepassing op bevoegde gezagsorganen waarbij in de regel
      ten minste 100 personen werkzaam zijn. Voor de toepassing van de eerste volzin wordt voor het bevoegd
      gezag van een school uitgegaan van alle scholen als bedoeld in de [Wet op het primair onderwijs][ref1], de
      [Wet op de expertisecentra][ref2] respectievelijk de [Wet op het voortgezet onderwijs][ref3] van dat bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
  - number: '8.4'
    text: |-
      Ten aanzien van het tweede lid, onderdelen f en g wordt inzichtelijk gemaakt met welk percentage deze
      arbeidsvoorwaardelijke regelingen en afspraken zich verhouden tot elkaar en tot die van het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel8
  - number: '8.5'
    text: |-
      Indien een groep van de in de school werkzame personen als bedoeld in het tweede lid, onderdeel f, of het orgaan
      van de rechtspersoon, bedoeld in het tweede lid, onderdeel g, uit minder dan vijf personen bestaat, kunnen voor
      de toepassing van die onderdelen twee of meer functies worden samengevoegd, zodat een groep van ten minste vijf
      personen ontstaat.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel8
  - number: '8.6'
    text: |-
      Indien het bevoegd gezag een voorstel voor advies of instemming voorlegt aan een geleding van de
      medezeggenschapsraad, wordt dat voorstel gelijktijdig ter kennisneming aan de andere geleding of geledingen
      aangeboden. Daarbij wordt tevens een overzicht verstrekt van de beweegredenen voor het voorstel, alsmede van de
      gevolgen die de uitwerking van het voorstel naar verwachting zal hebben voor het personeel, ouders en leerlingen en
      van de naar aanleiding daarvan genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel8
  - number: '9'
    text: |-
      De [artikelen 6][ref1], [7][ref2] en [8][ref3] zijn van overeenkomstige toepassing op de gemeenschappelijke
      medezeggenschapsraad, met dien verstande dat het de algemene gang van zaken in alle scholen of de meerderheid van
      de scholen vallend onder dezelfde onderwijswet betreft, op de medezeggenschapsraad van een samenwerkingsverband,
      een centrale dienst en de medezeggenschapsraad, bedoeld in [artikel 3, zesde lid][ref4], en op de
      ondersteuningsplanraad.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0020685#Artikel3
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '6'
