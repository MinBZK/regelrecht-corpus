    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel13
  - number: '13.2'
    text: |-
      Het bevoegd gezag van een school als bedoeld in de [Wet op de expertisecentra][ref1], met uitzondering van scholen
      voor voortgezet speciaal onderwijs, behoeft, ten aanzien van voortgezet speciaal onderwijs als bedoeld in de Wet
      op de expertisecentra, voorafgaand aan instemming met betrekking tot de vaststelling van de gehele schoolgids
      als bedoeld in het eerste lid, onderdeel g, afzonderlijk instemming van het deel van de medezeggenschapsraad dat
      uit en door de ouders en de leerlingen is gekozen voor het in die schoolgids opgenomen onderdeel met betrekking
      tot de jaarlijkse vaststelling van het totaal aantal uren en het soort activiteiten dat als onderwijstijd
      als bedoeld in [artikel 6g, eerste tot en met vijfde lid, van de Wet op het voortgezet onderwijs][ref2]
      dan wel [artikel 25, eerste lid, van de Wet op de expertisecentra][ref3] wordt geprogrammeerd
      alsmede voor het onderdeel met betrekking tot het beleid ten aanzien van lesuitval als bedoeld in
      [artikel 22, eerste lid, onderdeel c, onder 2°, van de Wet op de expertisecentra][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel22
