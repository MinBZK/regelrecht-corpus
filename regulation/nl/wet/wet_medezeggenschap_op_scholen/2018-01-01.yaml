  - number: '10.1'
    text: |-
      Het bevoegd gezag behoeft de voorafgaande instemming van de medezeggenschapsraad voor elk door het bevoegd gezag te
      nemen besluit met betrekking tot in ieder geval de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel10
  - number: 10.1.a
    text: verandering van de onderwijskundige doelstellingen van de school;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel10
  - number: 10.1.b
    text: vaststelling of wijziging van het schoolplan dan wel het leerplan of de onderwijs- en examenregeling;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel10
  - number: 10.1.c
    text: vaststelling of wijziging van een mogelijk schoolreglement;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel10
  - number: 10.1.d
    text: |-
      vaststelling of wijziging van het beleid met betrekking tot het verrichten van ondersteunende werkzaamheden door
      ouders ten behoeve van de school en het onderwijs;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel10
  - number: 10.1.e
    text: |-
      vaststelling of wijziging van regels op het gebied van het veiligheids-, gezondheids- en welzijnsbeleid, voor zover
      niet behorend tot de bevoegdheid van de personeelsgeleding;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel10
  - number: 10.1.f
    text: |-
      de aanvaarding van materiële bijdragen of geldelijke bijdragen anders dan in
      [artikel 13, eerste lid, onderdeel c][ref1], en [artikel 14, tweede lid, onderdeel c][ref2], bedoeld en niet
      gebaseerd op de onderwijswetgeving indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee de
      leerlingen binnen de schooltijden respectievelijk het onderwijs en tijdens de activiteiten die worden georganiseerd
      onder verantwoordelijkheid van het bevoegd gezag, alsmede tijdens het overblijven, zullen worden geconfronteerd;


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel14
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '13'
