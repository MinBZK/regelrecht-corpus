  - number: '12.2'
    text: |-
      Het bevoegd gezag van een speciale school voor basisonderwijs dat tevens bevoegd gezag is van een of meer
      basisscholen behoeft de voorafgaande instemming van het deel van de medezeggenschapsraad dat uit en door het
      personeel van eerstgenoemde school is gekozen voor elk door hem te nemen besluit met betrekking tot de inzet van de
      bekostiging die op grond van [artikel 120, vierde lid, van de Wet op het primair onderwijs][ref1] aan eerstgenoemde
      school is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: '13.1'
    text: |-
      Het bevoegd gezag van een school als bedoeld in de [Wet op het primair onderwijs][ref1] en de
      [Wet op de expertisecentra][ref2], met uitzondering van scholen voor voortgezet speciaal onderwijs, behoeft de
      voorafgaande instemming van het deel van de medezeggenschapsraad dat uit en door de ouders of de leerlingen is
      gekozen, voor elk door het bevoegd gezag te nemen besluit met betrekking tot de volgende aangelegenheden:


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
