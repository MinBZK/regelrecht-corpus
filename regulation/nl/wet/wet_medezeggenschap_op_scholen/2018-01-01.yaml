        bwb_id: BWBR0020685
        artikel: '11'
        hoofdstuk: '3'
  - number: 14.3.b
    text: |-
      vaststelling of wijziging van het leerlingenstatuut, bedoeld in
      [artikel 24g van de Wet op het voortgezet onderwijs][ref1] dan wel een mogelijk leerlingenstatuut anders dan
      bedoeld in [artikel 24g van de Wet op het voortgezet onderwijs][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24g
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel24g
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 24g
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 24g
  - number: 14.3.c
    text: vaststelling of wijziging van het beleid met betrekking tot voorzieningen ten behoeve van de leerlingen;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel14
  - number: 14.3.d
    text: |-
      vaststelling of wijziging van een regeling over het verwerken van en de bescherming van persoonsgegevens van
      leerlingen;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel14
  - number: 14.3.e
    text: |-
      vaststelling of wijziging van het leerlingenparticipatiebeleid, bedoeld in
      [artikel 24a, eerste lid, onderdeel ia, van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24a
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 24a
  - number: '14.4'
    text: |-
      Het bevoegd gezag van een school als bedoeld in de [Wet op het voortgezet onderwijs][ref1] en van een
      school voor voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref2] behoeft
      voorafgaand aan instemming met betrekking tot de vaststelling van de gehele schoolgids als bedoeld in
      het eerste lid, onderdeel a, afzonderlijk instemming van het deel van de medezeggenschapsraad dat uit en
      door de ouders en de leerlingen is gekozen voor het in die schoolgids opgenomen onderdeel met betrekking
      tot de jaarlijkse vaststelling van het totaal aantal uren en het soort activiteiten dat als onderwijstijd
      als bedoeld in [artikel 6g, eerste tot en met vijfde lid, van de Wet op het voortgezet onderwijs][ref3]
      dan wel [artikel 25, eerste lid, van de Wet op de expertisecentra][ref4] wordt geprogrammeerd
      alsmede voor het onderdeel met betrekking tot het beleid ten aanzien van lesuitval als bedoeld in
      [artikel 24a, eerste lid, onderdeel c, onder 1°, van de Wet op het voortgezet onderwijs][ref5] onderscheidenlijk
      [artikel 22, eerste lid, onderdeel c, onder 2°, van de Wet op de expertisecentra][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel24a
      [ref6]: https://wetten.overheid.nl/BWBR0003549#Artikel22
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 6g
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '25'
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 24a
      - id: ref6
        bwb_id: BWBR0003549
        artikel: '22'
  - number: 14a
    text: |-
      Het samenwerkingsverband behoeft de voorafgaande instemming van de ondersteuningsplanraad voor elk
      door het samenwerkingsverband te nemen besluit met betrekking tot vaststelling of wijziging van het
      ondersteuningsplan, bedoeld in [artikel 18a van de Wet op het primair onderwijs][ref1], respectievelijk
      [artikel 17a van de Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 17a
  - number: '15.1'
    text: |-
      Een besluit met betrekking tot een aangelegenheid als bedoeld in
      [artikel 11, eerste lid, onderdelen c, d, e en m][ref1], wordt niet ten uitvoer gelegd voordat een definitief
      besluit is genomen over de regeling van de gevolgen van dat besluit voor het personeel, dan wel voor de ouders of
      leerlingen, tenzij dringende redenen in het belang van de school een eerdere tenuitvoerlegging noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel11
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '11'
        hoofdstuk: '3'
  - number: '15.2'
    text: |-
      Een besluit met betrekking tot een aangelegenheid als bedoeld in [artikel 11, eerste lid, onderdeel b][ref1], wordt
      niet genomen dan na afweging van in elk geval de onderwijskundige, de personele en de materiële belangen van de
      school, welke afweging schriftelijk in de motivering van het besluit tot uitdrukking wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel11
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '11'
        hoofdstuk: '3'
  - number: '15.3'
    text: |-
      Een besluit met betrekking tot een aangelegenheid als bedoeld in de [artikelen 10, eerste lid, onderdeel h][ref1],
      [11, eerste lid, onderdeel c][ref2], voor zover het de beëindiging van de school betreft, en onderdeel p, en
      [13, eerste lid, onderdelen b en h][ref3], wordt niet genomen dan na raadpleging van de ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel13
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '11'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '13'
        hoofdstuk: '3'
  - number: '16.1'
    text: |-
      De gemeenschappelijke medezeggenschapsraad treedt, indien het aangelegenheden betreft die van gemeenschappelijk
      belang zijn voor alle scholen of voor de meerderheid van de scholen, in de plaats van de medezeggenschapsraad
      van die scholen. De eerste volzin is van overeenkomstige toepassing op de onderscheiden geledingen van de
      gemeenschappelijke medezeggenschapsraad indien het bevoegdheden van een geleding van de medezeggenschapsraad
      betreft.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel16
  - number: '16.2'
    text: |-
      De gemeenschappelijke medezeggenschapsraad wordt tevens vooraf in de gelegenheid gesteld om advies uit te brengen
      over elk door het bevoegd gezag te nemen besluit met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel16
  - number: 16.2.a
    text: |-
      vaststelling of wijziging van de hoofdlijnen van het meerjarig financieel beleid voor de desbetreffende scholen,
      waaronder de voorgenomen bestemming van de middelen die aan het bevoegd gezag ten behoeve van elk van de scholen
      uit de openbare kas zijn toegerekend of van anderen zijn ontvangen;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel16
  - number: 16.2.b
    text: |-
      de criteria die worden toegepast bij de verdeling van deze middelen over voorzieningen op bovenschools niveau en
      op schoolniveau;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel16
  - number: 16.2.c
    text: de aanstelling of het ontslag van personeel dat is belast met managementtaken ten behoeve van meer dan een school.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel16
  - number: '16.3'
    text: |-
      Het bevoegd gezag behoeft de voorafgaande instemming van het deel van de gemeenschappelijke medezeggenschapsraad
      dat uit en door het personeel is gekozen voor elk door het bevoegd gezag te nemen besluit met betrekking tot
      vaststelling of wijziging van de samenstelling van de formatie van personeel dat is benoemd of te werk gesteld
      zonder benoeming dat werkzaamheden verricht ten behoeve van meer dan een school.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel16
  - number: '17'
    text: |-
      Indien een te nemen besluit ingevolge [artikel 11][ref1], dan wel op grond van het medezeggenschapsreglement
      krachtens [artikel 24, tweede en derde lid][ref2], vooraf voor advies dient te worden voorgelegd aan de
      medezeggenschapsraad, draagt het bevoegd gezag er zorg voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel24
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '24'
        hoofdstuk: '4'
  - number: 17.a
    text: advies wordt gevraagd op een zodanig tijdstip, dat het advies van wezenlijke invloed kan zijn op de besluitvorming;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel17
  - number: 17.b
    text: de medezeggenschapsraad in de gelegenheid wordt gesteld met hem overleg te voeren voordat advies wordt uitgebracht;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel17
  - number: 17.c
    text: |-
      de medezeggenschapsraad zo spoedig mogelijk schriftelijk in kennis wordt gesteld van de wijze waarop aan het
      uitgebrachte advies gevolg wordt gegeven; en
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel17
  - number: 17.d
    text: |-
      de medezeggenschapsraad, indien het bevoegd gezag het advies niet of niet geheel wil volgen, in de gelegenheid
      wordt gesteld nader overleg met hem te voeren alvorens het besluit definitief wordt genomen.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel17
  - number: '18.1'
    text: |-
      De bevoegdheden op grond van de [artikelen 10 tot en met 14][ref1], dan wel op grond van het bepaalde in het
      medezeggenschapsreglement krachtens [artikel 24, tweede en derde lid][ref2], zijn niet van toepassing, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel24
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '24'
        hoofdstuk: '4'
  - number: 18.1.a
    text: |-
      de desbetreffende aangelegenheid voor de school reeds inhoudelijk is geregeld in een bij of krachtens wet gegeven
      voorschrift;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel18
  - number: 18.1.b
    text: |-
      het betreft een aangelegenheid als bedoeld in [artikel 38 van de Wet op het primair onderwijs][ref1],
      [artikel 38 van de Wet op de expertisecentra][ref2] en [artikel 40a van de Wet op het voortgezet onderwijs][ref3],
      voor zover het in deze artikelen bedoelde overleg niet besluit de aangelegenheid ter behandeling aan het
      personeelsdeel van de medezeggenschapsraad over te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel40a
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 40a
  - number: '18.2'
    text: |-
      De bevoegdheden van het deel van de medezeggenschapsraad dat uit en door het personeel is gekozen, zijn niet
      van toepassing, voor zover de desbetreffende aangelegenheid voor de school reeds inhoudelijk is geregeld in een
      collectieve arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel18
  - number: '19'
    text: |-
      De [artikelen 15][ref1], [17][ref2] en [18][ref3] zijn van overeenkomstige toepassing op de gemeenschappelijke
      medezeggenschapsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel18
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '15'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '17'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '18'
        hoofdstuk: '3'
  - number: '20.1'
    text: |-
      Op verzoek van de medezeggenschapsraad en met instemming van het bevoegd gezag kan met instemming van twee derden
      van de leden van de medezeggenschapsraad een deelraad worden verbonden aan een deel van een school. De deelraad
      treedt in dat geval in de bevoegdheden van de medezeggenschapsraad voor zover uitoefening van die bevoegdheden geen
      betrekking heeft op een ander deel van de school.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel20
  - number: '20.2'
    text: |-
      Op verzoek van de gemeenschappelijke medezeggenschapsraad en met instemming van het bevoegd gezag kan met instemming
      van twee derden van de leden van de gemeenschappelijke medezeggenschapsraad een groepsmedezeggenschapsraad
      worden verbonden aan een groep van scholen als bedoeld in de [Wet op het primair onderwijs][ref1],
      de [Wet op de expertisecentra][ref2] en de [Wet op het voortgezet onderwijs][ref3] afzonderlijk. De
      groepsmedezeggenschapsraad treedt in dat geval in de bevoegdheden van de gemeenschappelijke medezeggenschapsraad,
      behoudens de bevoegdheden, bedoeld in [artikel 16, tweede en derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
      [ref4]: https://wetten.overheid.nl/BWBR0020685#Artikel16
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
      - id: ref4
        bwb_id: BWBR0020685
        artikel: '16'
        hoofdstuk: '3'
  - number: '20.3'
    text: |-
      De [artikelen 3][ref1], [23][ref2] en [24][ref3] zijn van overeenkomstige toepassing op de deelraad, bedoeld in het
      eerste lid, en de groepsmedezeggenschapsraad, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel24
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '23'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '24'
        hoofdstuk: '4'
  - number: '20.4'
    text: |-
      De medezeggenschapsraad en de gemeenschappelijke medezeggenschapsraad kunnen met instemming van het bevoegd
      gezag en met instemming van twee derden van de leden van de medezeggenschapsraad of de gemeenschappelijke
      medezeggenschapsraad voor een of meer van de aangelegenheden, bedoeld in [artikel 10][ref1] en [artikel 11][ref2]
      dan wel [artikel 16][ref3], een themaraad instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel16
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '11'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '16'
        hoofdstuk: '3'
  - number: '20.5'
    text: |-
      Indien van elk bevoegd gezag van scholen als bedoeld in de [Wet op het primair onderwijs][ref1], of de
      [Wet op de expertisecentra][ref2] of de [Wet op het voortgezet onderwijs][ref3] de gemeenschappelijke
      medezeggenschapsraden dan wel bij het ontbreken van een gemeenschappelijke medezeggenschapsraad alle
      medezeggenschapsraden, daarmee instemmen kan een bovenbestuurlijke medezeggenschapsraad worden ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
  - number: '21.1'
    text: |-
      Het bevoegd gezag stelt, met inachtneming van de voorschriften bij of krachtens deze wet, ten minste eenmaal in de
      twee jaar een medezeggenschapsstatuut vast.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel21
  - number: '21.2'
    text: |-
      Het bevoegd gezag legt het medezeggenschapsstatuut, daaronder elke wijziging ervan mede begrepen, als voorstel
      aan de gemeenschappelijke medezeggenschapsraad of bij het ontbreken daarvan aan de medezeggenschapsraad
      voor en stelt het slechts vast indien het voorstel de instemming van twee derden van het aantal leden van de
      gemeenschappelijke medezeggenschapsraad of bij het ontbreken van een gemeenschappelijke medezeggenschapsraad van de
      medezeggenschapsraad heeft verworven.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel21
  - number: '22'
    text: 'In het medezeggenschapsstatuut wordt in ieder geval geregeld:'
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel22
  - number: 22.a
    text: |-
      de wijze waarop gebruik is gemaakt van [artikel 20][ref1] en de bevoegdheden van de themaraden;


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel20
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '20'
        hoofdstuk: '4'
  - number: 22.b
    text: |-
      de samenstelling van de medezeggenschapsraad, de gemeenschappelijke medezeggenschapsraad en de raden, bedoeld in
      [artikel 20][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel20
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '20'
        hoofdstuk: '4'
  - number: 22.c
    text: |-
      de wijze waarop en de termijnen waarbinnen aan de medezeggenschapsraad, de gemeenschappelijke medezeggenschapsraad,
      de geledingen dan wel de raden, bedoeld in [artikel 20][ref1], informatie beschikbaar wordt gesteld, die
      noodzakelijk is voor het uitoefenen van de medezeggenschap;


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel20
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '20'
        hoofdstuk: '4'
  - number: 22.d
    text: |-
      de wijze waarop de medezeggenschapsraad, de gemeenschappelijke medezeggenschapsraad, de geledingen dan wel de
      raden, bedoeld in [artikel 20][ref1], elkaar en de geledingen waaruit zij zijn gekozen informatie verstrekken over
      hun activiteiten;


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel20
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '20'
        hoofdstuk: '4'
  - number: 22.e
    text: |-
      de wijze waarop met inachtneming van [artikel 28][ref1] invulling wordt gegeven aan de beschikbaarstelling van
      faciliteiten aan ouders, leerlingen en personeel, die deelnemen in de medezeggenschapsraad, de gemeenschappelijke
      medezeggenschapsraad, de geledingen dan wel de raden, bedoeld in [artikel 20][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel20
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '28'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '20'
        hoofdstuk: '4'
  - number: 22.f
    text: |-
      indien besprekingen als bedoeld in [artikel 6, eerste lid][ref1], namens het bevoegd gezag worden gevoerd, in welke
      gevallen en door wie dat geschiedt en in welke gevallen die persoon op zijn verzoek van die taak wordt ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel6
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '6'
        hoofdstuk: '2'
  - number: '23.1'
    text: |-
      Het bevoegd gezag stelt, met inachtneming van de voorschriften bij of krachtens deze wet, een
      medezeggenschapsreglement voor de medezeggenschapsraad en de gemeenschappelijke medezeggenschapsraad vast.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel23
  - number: '23.2'
    text: |-
      Het bevoegd gezag stelt het reglement, daaronder elke wijziging ervan mede begrepen, slechts vast voor zover het
      voorstel de instemming van twee derden van het aantal leden van de medezeggenschapsraad onderscheidenlijk van
      de gemeenschappelijke medezeggenschapsraad heeft verworven. Indien het een omzetting dan wel een overdracht als
      bedoeld in [artikel 24, tweede lid][ref1] betreft, behoeft dat deel van het reglement tevens de instemming van de
      geleding die de bevoegdheden omzet dan wel overdraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel24
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '24'
        hoofdstuk: '4'
  - number: '24.1'
    text: 'In het reglement wordt in ieder geval geregeld:'
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
  - number: 24.1.a
    text: het aantal leden van de medezeggenschapsraad;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
  - number: 24.1.b
    text: |-
      de wijze waarop aan de desbetreffende scholen toepassing wordt gegeven aan
      [artikel 3, derde lid, onderdeel b, sub 2°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel3
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '3'
        hoofdstuk: '1'
  - number: 24.1.c
    text: de wijze en organisatie van de verkiezingen van de leden van de medezeggenschapsraad;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
  - number: 24.1.d
    text: de zittingsduur van de leden van de medezeggenschapsraad;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
  - number: 24.1.e
    text: |-
      indien een lid van de schoolleiding dan wel een personeelslid dat is benoemd of te werk gesteld en is belast met
      managementtaken ten behoeve van meer dan een school is opgedragen om namens het bevoegd gezag op te treden in
      besprekingen met de medezeggenschapsraad, in welke gevallen op verzoek van de medezeggenschapsraad het bevoegd
      gezag zelf deze besprekingen met de raad voert;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
  - number: 24.1.f
    text: de wijze waarop het bevoegd gezag informatie verschaft aan de medezeggenschapsraad;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
  - number: 24.1.g
    text: |-
      de termijnen binnen welke tot instemming of onthouding van instemming dient te worden besloten, en de termijnen
      binnen welke advies dient te worden uitgebracht;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
  - number: 24.1.h
    text: |-
      de bevoegdheden van de medezeggenschapsraad die aan de themaraad worden overgedragen dan wel de bevoegdheden van de
      medezeggenschapsraad waarin de deelraad treedt;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
  - number: 24.1.i
    text: |-
      in welke gevallen en op welke wijze de medezeggenschapsraad alle bij de school betrokkenen betrekt bij de
      werkzaamheden van de medezeggenschapsraad;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
  - number: 24.1.j
    text: in welke gevallen geheimhouding wordt betracht;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
  - number: 24.1.k
    text: |-
      de procedure voor de beslechting van die geschillen tussen het bevoegd gezag en de medezeggenschapsraad waarvoor
      deze wet niet in een geschillenregeling voorziet.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
  - number: '24.2'
    text: |-
      Indien de medezeggenschapsraad een aan de raad toekomende adviesbevoegdheid wenst om te zetten in een
      instemmingsbevoegdheid, dan wel een instemmingsbevoegdheid in een adviesbevoegdheid, of een geleding een aan
      die geleding toekomende instemmingsbevoegdheid wenst om te zetten in een adviesbevoegdheid, respectievelijk een
      geleding een aan die geleding toekomende bevoegdheid wenst over te dragen aan de medezeggenschapsraad, wordt
      die omzetting respectievelijk die overdracht in het reglement geregeld. Voor een omzetting en een overdracht als
      bedoeld in de eerste volzin is de instemming van het bevoegd gezag vereist.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
  - number: '24.3'
    text: |-
      In het reglement kan tevens worden geregeld dat door het bevoegd gezag te nemen besluiten met betrekking tot nader
      in het reglement te omschrijven aangelegenheden die niet reeds in de wet worden genoemd, instemming dan wel advies
      behoeven als bedoeld in de [artikelen 10][ref1], [11][ref2], [12][ref3], [13][ref4] of [14][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0020685#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0020685#Artikel14
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '11'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '12'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0020685
        artikel: '13'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0020685
        artikel: '14'
        hoofdstuk: '3'
  - number: '24.4'
    text: 'In het reglement kan voorts worden geregeld:'
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
  - number: 24.4.a
    text: |-
      de voorwaarde dat leerlingen, die tot de school zijn toegelaten met toepassing
      van [artikel 58, eerste lid, van de Wet op het primair onderwijs][ref1],
      [artikel 60, eerste lid, van de Wet op de expertisecentra][ref2] of
      [artikel 48, eerste lid, van de Wet op het voortgezet onderwijs][ref3], alsmede hun ouders, slechts kandidaat
      kunnen worden gesteld voor verkiezing tot lid van de medezeggenschapsraad, indien zij hebben verklaard de grondslag
      en de doelstellingen van de school te respecteren;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel48
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '60'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '48'
  - number: 24.4.b
    text: |-
      over welke aangelegenheden op grond van [artikel 6, derde lid][ref1], wordt overlegd met elk van de geledingen
      afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel6
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '6'
        hoofdstuk: '2'
  - number: '24.5'
    text: |-
      De voorwaarde, bedoeld in het vierde lid, onderdeel a, kan slechts worden toegepast, indien zij door of namens het
      bevoegd gezag voorafgaand aan de toelating aan de betrokkenen bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel24
  - number: '25.1'
    text: |-
      De geldigheidsduur van de instelling van een bovenbestuurlijke gemeenschappelijke medezeggenschapsraad, bedoeld
      in [artikel 20, vijfde lid][ref1], bedraagt ten hoogste twee jaren. De in de eerste volzin bedoelde termijn kan
      telkens met ten hoogste twee jaren worden verlengd indien alle gemeenschappelijke medezeggenschapsraden daarmee
      instemmen dan wel bij ontbreken van een gemeenschappelijke medezeggenschapsraad alle medezeggenschapsraden.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel20
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '20'
        hoofdstuk: '4'
  - number: '25.2'
    text: |-
      De geldigheidsduur van advies- en instemmingsbevoegdheden die ingevolge de toepassing van
      [artikel 24, tweede en derde lid][ref1], in het medezeggenschapsreglement zijn opgenomen, bedraagt ten hoogste twee
      jaren. De in de eerste volzin bedoelde termijn kan telkens worden verlengd met ten hoogste twee jaren, indien ten
      minste twee derden van het aantal leden van de medezeggenschapsraad daartoe besluiten ten aanzien van alle of een
      aantal van de in de eerste volzin bedoelde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel24
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '24'
        hoofdstuk: '4'
  - number: '26'
    text: |-
      De [artikelen 23][ref1] en [24][ref2] zijn van overeenkomstige toepassing op het reglement van de
      gemeenschappelijke medezeggenschapsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel24
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '23'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '24'
        hoofdstuk: '4'
  - number: '27'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden vastgesteld voor specifieke situaties bij een categorie
      van scholen. De voordracht voor een krachtens de eerste volzin vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan de Tweede Kamer der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel27
  - number: '28.1'
    text: |-
      Het bevoegd gezag staat de medezeggenschapsraad het gebruik toe van de voorzieningen waarover het kan beschikken en
      die de medezeggenschapsraad voor de vervulling van zijn taak redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel28
  - number: '28.2'
    text: |-
      De kosten die redelijkerwijs noodzakelijk zijn voor de vervulling van de taak van de medezeggenschapsraad,
      scholingskosten daaronder begrepen, komen ten laste van het bevoegd gezag. De redelijkerwijs noodzakelijke kosten
      van het raadplegen van een deskundige en van het voeren van rechtsgedingen door de medezeggenschapsraad komen
      slechts ten laste van het bevoegd gezag indien het bevoegd gezag vooraf in kennis is gesteld van de te maken
      kosten. Het bevoegd gezag kan in overeenstemming met de medezeggenschapsraad de kosten die de medezeggenschapsraad
      in enig jaar zal maken, vaststellen op een bepaald bedrag dat de medezeggenschapsraad naar eigen inzicht kan
      besteden. Kosten waardoor het hier bedoelde bedrag zou worden overschreden, komen slechts ten laste van het bevoegd
      gezag voor zover dat bevoegd gezag in het dragen daarvan toestemt.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel28
  - number: '28.3'
    text: |-
      Het bevoegd gezag treft een regeling voor de leden van de medezeggenschapsraad afkomstig uit het personeel voor
      faciliteiten in tijd ten behoeve van het voeren van overleg, scholing en overige medezeggenschapsactiviteiten. De
      in de eerste volzin bedoelde faciliteiten worden vastgesteld op een zodanige omvang als redelijkerwijs noodzakelijk
      is voor de taakvervulling door de leden van de medezeggenschapsraad.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel28
  - number: '28.4'
    text: |-
      Het bevoegd gezag kan een vacatievergoeding toekennen aan ouders en leerlingen die lid zijn van de
      medezeggenschapsraad.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel28
  - number: '28.5'
    text: Tevens kan het bevoegd gezag bijdragen in de kosten voor administratieve ondersteuning van de medezeggenschapsraad.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel28
  - number: '28.6'
    text: |-
      Het eerste, tweede, derde, vierde en vijfde lid zijn van overeenkomstige toepassing op de leden van de
      gemeenschappelijke medezeggenschapsraad en van een raad als bedoeld in [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel20
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '20'
        hoofdstuk: '4'
  - number: '29.1'
    text: |-
      Op gronden die verband houden met de godsdienstige of levensbeschouwelijke overtuiging die aan de
      school ten grondslag ligt, kan het bevoegd gezag in het medezeggenschapsreglement in afwijking van
      [artikel 24, tweede lid][ref1], een aan de medezeggenschapsraad of een geleding toekomend instemmingsrecht omzetten
      in een adviesrecht dan wel een aan een geleding toekomend instemmingsrecht overdragen aan de medezeggenschapsraad
      dan wel een aan de leerlinggeleding toekomend instemmingsrecht overdragen aan de oudergeleding dan wel een aan
      de gezamenlijke ouder- en leerlinggeleding toekomend instemmingsrecht, omzetten in een instemmingsrecht voor de
      oudergeleding en een adviesrecht voor de leerlinggeleding. In afwijking van de [artikelen 21][ref2] en [23][ref3]
      stelt het bevoegd gezag in dat geval het medezeggenschapsstatuut, respectievelijk het medezeggenschapsreglement,
      daaronder elke wijziging ervan mede begrepen, slechts vast nadat het hierover advies heeft ontvangen van de
      medezeggenschapsraad onderscheidenlijk van de gemeenschappelijke medezeggenschapsraad. Het bevoegd gezag kan
      slechts toepassing geven aan de eerste volzin indien een meerderheid van twee derden zowel van het personeel van de
      school als van de ouders en leerlingen dat ondersteunt.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel23
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '24'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '21'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '23'
        hoofdstuk: '4'
  - number: '29.2'
    text: |-
      De mogelijkheid tot afwijking, bedoeld in het eerste lid, komt te vervallen indien de gronden waarop zij berustte
      niet langer aanwezig zijn dan wel indien zij niet langer worden ondersteund door een meerderheid van twee derden
      van elk van de in het eerste lid bedoelde categorieën.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel29
  - number: '29.3'
    text: |-
      Het bevoegd gezag toetst elke vijf jaar de stand van zaken met betrekking tot de gronden van de afwijking en de
      ondersteuning ervan.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel29
  - number: 29a
    text: |-
      De [artikelen 21][ref1], [22][ref2], [23][ref3], [24, eerste lid][ref4], [28][ref5] en [29][ref6] zijn van
      overeenkomstige toepassing op de ondersteuningsplanraad, met dien verstande dat artikel 29 van toepassing is
      indien ten minste tweederde van het aantal scholen in het samenwerkingsverband gebruik maakt van de in dat artikel
      genoemde mogelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0020685#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0020685#Artikel28
      [ref6]: https://wetten.overheid.nl/BWBR0020685#Artikel29
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '21'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '22'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '23'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0020685
        artikel: '24'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0020685
        artikel: '28'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0020685
        artikel: '29'
        hoofdstuk: '4'
  - number: '30.1'
    text: |-
      Er is een landelijke commissie voor geschillen waarbij elke school, samenwerkingsverband en centrale dienst is
      aangesloten. Tot voorzitter en tot plaatsvervangend voorzitter kunnen alleen personen worden benoemd die voldoen
      aan de bij of krachtens [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref1] gestelde vereisten om te
      kunnen worden benoemd tot rechterlijk ambtenaar met rechtspraak belast.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '5'
  - number: '30.2'
    text: |-
      De commissie bestaat uit 3 leden en ten minste 3 plaatsvervangende leden, van wie een lid en diens plaatsvervangers
      worden benoemd op bindende voordracht van de landelijke besturenorganisaties en een lid en diens plaatsvervangers
      op bindende voordracht van landelijke personeelsvak- onderscheidelijk ouder- of leerlingenorganisaties. De leden
      doen een bindende voordracht voor de benoeming van het derde lid, tevens voorzitter en diens plaatsvervangers. Het
      aantal plaatsvervangers van elk lid en van de voorzitter is aan elkaar gelijk. De benoeming geschiedt door Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel30
  - number: '30.3'
    text: |-
      De leden en de plaatsvervangende leden mogen niet deel uitmaken van het bevoegd gezag of van de
      medezeggenschapsraad van een school, samenwerkingsverband en centrale dienst.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel30
  - number: '31.1'
    text: |-
      De commissie neemt kennis van de geschillen, bedoeld in de [artikelen 32][ref1], [33][ref2], [34][ref3] en
      [35][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0020685#Artikel35
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '32'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '33'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '34'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0020685
        artikel: '35'
        hoofdstuk: '5'
  - number: '31.2'
    text: |-
      De commissie is in geval van een geschil als bedoeld in het eerste lid bevoegd een bemiddelingsvoorstel voor te
      leggen aan het bevoegd gezag en de medezeggenschapsraad, tenzij het bevoegd gezag of de medezeggenschapsraad te
      kennen geven daarop geen prijs te stellen.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel31
  - number: '31.3'
    text: |-
      Uitspraken van de commissie in geschillen als bedoeld in het eerste lid, waaronder begrepen bemiddelingsvoorstellen
      waarover overeenstemming is bereikt, zijn bindend voor het bevoegd gezag en de medezeggenschapsraad.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel31
  - number: '31.4'
    text: |-
      De bepalingen van de derde afdeling van de vijfde titel van het tweede boek van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] zijn van overeenkomstige toepassing, met dien verstande dat in
      geval van een geschil als bedoeld in [artikel 35][ref2] een dwangsom uitsluitend kan worden opgelegd aan het
      bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel35
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '35'
        hoofdstuk: '5'
  - number: '32.1'
    text: |-
      Indien de medezeggenschapsraad aan een besluit van het bevoegd gezag de instemming onthoudt die is vereist
      ingevolge de [artikelen 10][ref1], [12][ref2], [13][ref3] en [14][ref4] dan wel ingevolge de toepassing van artikel
      24, tweede en derde lid, kan het bevoegd gezag de commissie binnen zes weken na de onthouding van de instemming
      toestemming vragen om het besluit te nemen. De commissie geeft slechts toestemming indien de medezeggenschapsraad
      niet in redelijkheid tot het onthouden van instemming heeft kunnen komen of indien sprake is van zwaarwegende
      omstandigheden die het te nemen besluit van het bevoegd gezag rechtvaardigen.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0020685#Artikel14
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '12'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '13'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0020685
        artikel: '14'
        hoofdstuk: '3'
  - number: '32.2'
    text: |-
      Het bevoegd gezag vraagt toestemming als bedoeld in het eerste lid onder overlegging van de door het bevoegd gezag
      gemaakte afweging van de belangen die daarbij voor het bevoegd gezag onderscheidenlijk de medezeggenschapsraad aan
      de orde zijn. De commissie stelt de medezeggenschapsraad in de gelegenheid, zijn argumenten voor het onthouden van
      zijn instemming bij de commissie naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel32
  - number: '32.3'
    text: |-
      Een besluit als bedoeld in het eerste lid dat is genomen zonder de instemming van de medezeggenschapsraad of
      zonder de toestemming van de commissie, is nietig indien de medezeggenschapsraad tegenover het bevoegd gezag
      schriftelijk een beroep op de nietigheid heeft gedaan. De medezeggenschapsraad kan een beroep op de nietigheid
      slechts doen binnen zes weken nadat het bevoegd gezag zijn besluit heeft genomen. Bij gebreke van een kennisgeving
      aan de medezeggenschapsraad van een door het bevoegd gezag genomen besluit gaat de termijn van zes weken pas in
      op het moment dat de medezeggenschapsraad is gebleken dat het bevoegd gezag uitvoering of toepassing geeft aan
      het besluit.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel32
  - number: '32.4'
    text: |-
      De medezeggenschapsraad kan de commissie verzoeken aan het bevoegd gezag de plicht op te leggen, zich te onthouden
      van handelingen die strekken tot uitvoering of toepassing van een nietig besluit als bedoeld in het derde lid. Het
      bevoegd gezag kan de commissie verzoeken te verklaren dat de medezeggenschapsraad ten onrechte een beroep heeft
      gedaan op nietigheid als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel32
  - number: '33.1'
    text: |-
      Indien de medezeggenschapsraad het bevoegd gezag de instemming voor vaststelling of wijziging van het
      medezeggenschapsstatuut, of van het medezeggenschapsreglement, voor wat betreft onderwerpen als bedoeld in
      [artikel 24, eerste, derde en vierde lid][ref1], onthoudt, kan het bevoegd gezag de commissie binnen zes weken
      na de onthouding van de instemming toestemming vragen het statuut of reglement vast te stellen of te wijzigen. De
      commissie geeft toestemming, tenzij het bevoegd gezag bij afweging van de betrokken belangen niet in redelijkheid
      tot zijn voorstel heeft kunnen komen.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel24
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '24'
        hoofdstuk: '4'
  - number: '33.2'
    text: |-
      De commissie geeft voor zover zij van oordeel is dat het bevoegd gezag bij afweging van de betrokken belangen
      niet in redelijkheid tot zijn voorstel heeft kunnen komen, in haar uitspraak aan hoe het voorstel dient te worden
      gewijzigd. Na de uitspraak van de commissie stelt het bevoegd gezag het medezeggenschapsreglement dan wel het
      medezeggenschapsstatuut vast overeenkomstig de uitspraak van de commissie.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel33
  - number: '33.3'
    text: |-
      Op het vragen van toestemming als bedoeld in het eerste lid is [artikel 32, tweede lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel32
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '32'
        hoofdstuk: '5'
  - number: '33.4'
    text: |-
      Een vaststelling of wijziging als bedoeld in het eerste lid, gedaan zonder de instemming door de
      medezeggenschapsraad of zonder de toestemming van de commissie, is nietig indien de medezeggenschapsraad tegenover
      het bevoegd gezag schriftelijk een beroep op de nietigheid heeft gedaan. De medezeggenschapsraad kan een beroep op
      de nietigheid slechts doen binnen zes weken nadat het bevoegd gezag zijn vaststelling of wijziging heeft gedaan.
      Bij gebreke van kennisgeving van een vaststelling of wijziging aan de medezeggenschapsraad gaat de termijn van zes
      weken pas in op het moment dat de medezeggenschapsraad is gebleken dat het bevoegd gezag uitvoering of toepassing
      geeft aan het besluit.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel33
  - number: '33.5'
    text: |-
      De medezeggenschapsraad kan de commissie verzoeken het bevoegd gezag te verplichten zich te onthouden van
      handelingen die strekken tot uitvoering of toepassing van een nietig besluit als bedoeld in het vierde lid. Het
      bevoegd gezag kan de commissie verzoeken te verklaren dat de medezeggenschapsraad ten onrechte een beroep heeft
      gedaan op nietigheid als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel33
  - number: '34.1'
    text: |-
      Indien het bevoegd gezag een besluit neemt waarbij het een advies van de medezeggenschapsraad, vereist ingevolge
      [artikel 11][ref1], dan wel ingevolge de toepassing van [artikel 24, tweede en derde lid][ref2], niet of niet
      geheel volgt, wordt de uitvoering van het besluit opgeschort met zes weken, tenzij de medezeggenschapsraad tegen
      onmiddellijke uitvoering van het besluit geen bedenkingen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel24
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '24'
        hoofdstuk: '4'
  - number: '34.2'
    text: |-
      De medezeggenschapsraad kan in het geval, bedoeld in het eerste lid, een geschil voorleggen aan de commissie binnen
      zes weken nadat het betrokken besluit door het bevoegd gezag is genomen.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel34
  - number: '34.3'
    text: |-
      De medezeggenschapsraad kan in het geval waarin het bevoegd gezag ten onrechte geen advies heeft gevraagd, binnen
      zes weken nadat is gebleken dat het bevoegd gezag uitvoering of toepassing geeft aan dat besluit een geschil
      voorleggen aan de commissie. De medezeggenschapsraad verstrekt daarbij het advies dat zou zijn gegeven indien
      advies zou zijn gevraagd. Voor de behandeling van het geschil geldt dit advies als niet of niet geheel gevolgd. Het
      eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel34
  - number: '34.4'
    text: |-
      Het voorleggen van een geschil als bedoeld in het tweede of derde lid geschiedt onder overlegging van de argumenten
      voor het advies en de argumenten voor het oordeel dat door het niet of niet geheel volgen van het advies de
      belangen van de school of van de medezeggenschapsraad ernstig worden geschaad. De commissie stelt het bevoegd gezag
      in de gelegenheid, zijn argumenten voor het niet of niet geheel volgen van het advies bij de commissie naar voren
      te brengen. De behandeling van het verzoek verlengt de opschorting, bedoeld in het eerste lid, niet.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel34
  - number: '34.5'
    text: |-
      De commissie beoordeelt of het bevoegd gezag bij niet of niet geheel volgen van het advies van de
      medezeggenschapsraad bij afweging van de betrokken belangen niet in redelijkheid tot zijn voorstel heeft kunnen
      komen.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel34
  - number: '34.6'
    text: |-
      De commissie doet vervolgens de uitspraak of het betrokken besluit al dan niet in stand kan blijven. De commissie
      is daarbij bevoegd, indien de medezeggenschapsraad daarom heeft verzocht, een of meer van de volgende voorzieningen
      te treffen:
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel34
  - number: 34.6.a
    text: het opleggen van de verplichting aan het bevoegd gezag om aan te wijzen gevolgen van dat besluit ongedaan te maken;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel34
  - number: 34.6.b
    text: |-
      het opleggen van een verplichting aan het bevoegd gezag tot nalaten om handelingen te verrichten of te doen
      verrichten ter uitvoering van het besluit of van onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel34
  - number: '35.1'
    text: |-
      De medezeggenschapsraad kan aan de commissie een geschil voorleggen inzake naleving door het bevoegd gezag van de
      bij of krachtens deze wet of een onderwijswet geldende verplichtingen jegens de medezeggenschapsraad.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel35
  - number: '35.2'
    text: |-
      Het bevoegd gezag kan aan de commissie een geschil voorleggen inzake naleving door de medezeggenschapsraad van de
      bij of krachtens deze wet of een onderwijswet geldende verplichtingen jegens het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel35
  - number: '35.3'
    text: |-
      De commissie kan in haar uitspraak aan de medezeggenschapsraad onderscheidenlijk het bevoegd gezag de verplichting
      opleggen om bepaalde handelingen te verrichten of na te laten. Wanneer de medezeggenschapsraad een zodanige
      verplichting niet nakomt, kan de commissie de medezeggenschapsraad ontbinden, onder oplegging aan het bevoegd
      gezag van de verplichting tot het doen verkiezen van een nieuwe medezeggenschapsraad dan wel, na toepassing van
      [artikel 37][ref1], onder oplegging aan het samenwerkingsverband van de verplichting tot het doen afvaardigen van
      een nieuwe ondersteuningsplanraad.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel37
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '37'
        hoofdstuk: '5'
  - number: 35a.1
    text: |-
      De tenuitvoerlegging van een uitspraak van de commissie waaraan een dwangsom als bedoeld in
      [artikel 31, vierde lid][ref1], is verbonden kan plaatsvinden nadat de voorzieningenrechter van de rechtbank van
      het arrondissement waarin het bevoegd gezag is gevestigd, ter griffie van welke rechtbank het origineel van de
      uitspraak is neergelegd, daartoe op verzoek van de medezeggenschapsraad verlof heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel31
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '31'
        hoofdstuk: '5'
  - number: 35a.2
    text: |-
      Neerleggen ter griffie als bedoeld in het eerste lid vindt plaats door de commissie na een schriftelijk verzoek van
      de medezeggenschapsraad daartoe. Het verzoek van de medezeggenschapsraad tot neerleggen ter griffie vindt plaats
      uiterlijk twee jaar na de datum waarop de uitspraak door de commissie is gedaan.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel35a
  - number: 35a.3
    text: |-
      Het verlof, bedoeld in het eerste lid, wordt aangetekend op het origineel van de uitspraak. De griffier zendt
      ten spoedigste aan de partijen een gewaarmerkt afschrift van de uitspraak met het daarop aangetekend verlof tot
      tenuitvoerlegging.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel35a
  - number: 35a.4
    text: |-
      Verlof als bedoeld in het eerste lid, kan eerst worden verleend nadat de op grond van
      [artikel 36, tweede lid][ref1], geldende termijn voor hoger beroep ongebruikt is verstreken, dan wel eerder indien
      schriftelijk van hoger beroep afstand is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel36
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '36'
        hoofdstuk: '5'
  - number: 35a.5
    text: |-
      De voorzieningenrechter van de rechtbank kan de tenuitvoerlegging van de uitspraak slechts weigeren indien
      hem na summierlijk onderzoek is gebleken dat de uitspraak of de wijze waarop die tot stand is gekomen
      kennelijk in strijd is met de openbare orde of dat de aan de uitspraak verbonden dwangsom is opgelegd in
      strijd met [artikel 31, vierde lid][ref1], of de bepalingen van de derde afdeling van de vijfde titel van het
      [tweede boek van het Wetboek van Burgerlijke Rechtsvordering][ref2]. In dit laatste geval betreft de weigering
      alleen de tenuitvoerlegging van de dwangsom.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '31'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0001827
  - number: '36.1'
    text: |-
      De medezeggenschapsraad dan wel het bevoegd gezag kan bij de ondernemingskamer van het gerechtshof Amsterdam beroep
      instellen tegen een uitspraak van de commissie als bedoeld in de [artikelen 32][ref1], [33][ref2], [34][ref3] en
      [35][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0020685#Artikel35
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '32'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '33'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '34'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0020685
        artikel: '35'
        hoofdstuk: '5'
  - number: '36.2'
    text: |-
      Het beroep wordt ingediend bij verzoekschrift binnen een maand nadat de verzoekende partij van de in het eerste lid
      bedoelde uitspraak op de hoogte is gesteld. De wederpartij wordt van het beroep in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel36
  - number: '36.3'
    text: De ondernemingskamer behandelt het verzoek met de meeste spoed.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel36
  - number: '36.4'
    text: Tegen een uitspraak van de ondernemingskamer kan geen beroep in cassatie worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel36
  - number: '36.5'
    text: |-
      In afwijking van [artikel 237 van het Wetboek van Burgerlijke Rechtsvordering][ref1] kan de medezeggenschapsraad,
      de gemeenschappelijke medezeggenschapsraad, een geleding onderscheidenlijk een raad als bedoeld in
      [artikel 20][ref2] niet in de proceskosten worden veroordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel20
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '237'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '20'
        hoofdstuk: '4'
  - number: '37'
    text: |-
      De [artikelen 31][ref1], [32][ref2], [33][ref3], [34][ref4], [35][ref5], [35a][ref6] en [36][ref7] zijn van
      overeenkomstige toepassing op de gemeenschappelijke medezeggenschapsraad, de geledingen, de raden, bedoeld
      in [artikel 20, eerste en tweede lid][ref8], de raad, bedoeld in artikel 20, vierde lid, voor zover het een
      aangelegenheid betreft waarvoor de raad is ingesteld en de ondersteuningsplanraad.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0020685#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0020685#Artikel35
      [ref6]: https://wetten.overheid.nl/BWBR0020685#Artikel35a
      [ref7]: https://wetten.overheid.nl/BWBR0020685#Artikel36
      [ref8]: https://wetten.overheid.nl/BWBR0020685#Artikel20
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '31'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '32'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '33'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0020685
        artikel: '34'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0020685
        artikel: '35'
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0020685
        artikel: 35a
        hoofdstuk: '5'
      - id: ref7
        bwb_id: BWBR0020685
        artikel: '36'
        hoofdstuk: '5'
      - id: ref8
        bwb_id: BWBR0020685
        artikel: '20'
        hoofdstuk: '4'
  - number: '38.1'
    text: |-
      Indien het bevoegd gezag van een school of een samenwerkingsverband de bij of krachtens deze wet gegeven
      voorschriften niet nakomt, kan Onze Minister besluiten dat de bekostiging uit de openbare kas geheel of
      gedeeltelijk wordt ingehouden of opgeschort.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel38
  - number: '38.2'
    text: |-
      De bekostiging wordt wederom toegekend, indien Onze Minister blijkt, dat de reden voor de toepassing van het eerste
      lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel38
  - number: '39'
    text: |-
      De [Wet op de ondernemingsraden][ref1] is niet van toepassing op de scholen, samenwerkingsverbanden en centrale
      diensten in de zin van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: '40.1'
    text: |-
      De [Wet medezeggenschap onderwijs 1992][ref1] is niet van toepassing op scholen als bedoeld
      in de [Wet op het primair onderwijs][ref2], de [Wet op de expertisecentra][ref3], de
      [Wet op het voortgezet onderwijs][ref4] en de [Experimentenwet onderwijs][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005746
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0003549
      [ref4]: https://wetten.overheid.nl/BWBR0002399
      [ref5]: https://wetten.overheid.nl/BWBR0002718
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005746
      - id: ref2
        bwb_id: BWBR0003420
      - id: ref3
        bwb_id: BWBR0003549
      - id: ref4
        bwb_id: BWBR0002399
      - id: ref5
        bwb_id: BWBR0002718
  - number: '40.2'
    text: |-
      Het [Besluit medezeggenschap onderwijs][ref1] blijft van kracht totdat de algemene maatregel van bestuur
      op grond van [artikel 27][ref2] tot stand is gekomen. Het geldt tot dat tijdstip als besluit, gebaseerd op
      [artikel 27][ref3] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003710
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel27
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003710
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '27'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '27'
        hoofdstuk: '4'
  - number: '41.1'
    text: |-
      Binnen 4 maanden na de inwerkingtreding van deze wet legt het bevoegd gezag een voorstel van het reglement, bedoeld
      in [artikel 23][ref1] en [26][ref2], en van het medezeggenschapsstatuut, bedoeld in [artikel 21][ref3], voor
      aan de medezeggenschapsraad respectievelijk de gemeenschappelijke medezeggenschapsraad. De medezeggenschapsraad
      respectievelijk de gemeenschappelijke medezeggenschapsraad spreekt zich binnen 4 maanden uit over de voorstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel21
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '23'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '26'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '21'
        hoofdstuk: '4'
  - number: '41.2'
    text: |-
      Het medezeggenschapsreglement, bedoeld in de [Wet medezeggenschap onderwijs 1992][ref1], vervalt met ingang van 1
      augustus van het tweede jaar volgend op de datum van inwerkingtreding van deze wet, indien het bevoegd gezag niet
      met instemming van de medezeggenschapsraad respectievelijk de gemeenschappelijke medezeggenschapsraad bepaalt dat
      het geheel of gedeeltelijk op een eerder tijdstip vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005746
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005746
  - number: '42'
    text: |-
      Tot 1 augustus 2009 of zoveel eerder als de mededeling, bedoeld in
      [artikel 31, derde lid, van de Wet medezeggenschap onderwijs 1992][ref1] zoals dat luidde op de
      datum voor de inwerkingtreding van deze wet, zou moeten worden gedaan, gelden een ontheffing en een
      toestemming die zijn verleend op grond van [artikel 31 van de Wet medezeggenschap onderwijs 1992][ref2]
      als een ontheffing van de voorschriften van deze wet respectievelijk een toestemming voor het kiezen
      van de leden, bedoeld in [artikel 3, derde lid, onderdeel b, onder 2° en 3°][ref3] uit de ouders.
      [Artikel 31, tweede lid, van de Wet medezeggenschap onderwijs 1992][ref4] zoals dat luidde op de datum voor de
      inwerkingtreding van deze wet blijft van toepassing op de ontheffing dan wel toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005746#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005746#Artikel31
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005746
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0005746
        artikel: '31'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '3'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0005746
        artikel: '31'
  - number: '43.1'
    text: |-
      Tot een jaar na de inwerkingtreding van deze wet worden geschillen op grond van deze wet, in
      afwijking van [artikel 30][ref1], beslist door de commissies voor geschillen, bedoeld in de
      [Wet medezeggenschap onderwijs 1992][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0005746
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '30'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005746
  - number: '43.2'
    text: |-
      De op de dag voor de datum van inwerkingtreding van deze wet nog niet besliste geschillen, door
      het bevoegd gezag van een school voorgelegd aan een commissie voor geschillen als bedoeld in de
      [Wet medezeggenschap onderwijs 1992][ref1], gelden met ingang van de datum van inwerkingtreding van deze wet als
      geschillen die krachtens deze wet aanhangig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005746
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005746
  - number: '43.3'
    text: |-
      Een jaar na de inwerkingtreding van deze wet dragen de commissies, bedoeld in het eerste lid, de onder hen
      berustende dossiers terstond over aan de landelijke commissie voor geschillen bedoeld in [artikel 30][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel30
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '30'
        hoofdstuk: '5'
  - number: '44.1'
    text: |-
      Indien aan een school nog geen medezeggenschapsraad is verbonden, wordt aan de school binnen een half jaar een
      voorlopige medezeggenschapsraad gekozen.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel44
  - number: '44.2'
    text: |-
      [Artikel 3, derde tot en met negende lid][ref1], is van overeenkomstige toepassing op de voorlopige raad.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel3
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '3'
        hoofdstuk: '1'
  - number: '44.3'
    text: |-
      Het bevoegd gezag legt binnen drie maanden na de verkiezing van de voorlopige raad een medezeggenschapsreglement
      als voorstel aan deze raad voor. Vervolgens spreekt de voorlopige raad zich, na overleg met het bevoegd gezag,
      binnen drie maanden over het voorstel uit. De [artikelen 23, tweede lid][ref1], [31, aanhef en onderdeel b][ref2],
      en [33][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel33
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '23'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '31'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: '33'
        hoofdstuk: '5'
  - number: '44.4'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing indien aan scholen nog geen gemeenschappelijke
      medezeggenschapsraad is verbonden.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel44
  - number: '46'
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap zendt, in overeenstemming met Onze Minister van Economische
      Zaken vijf jaar na inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel46
  - number: '47'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel47
  - number: '48'
    text: Deze wet wordt aangehaald als «Wet medezeggenschap op scholen».
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel48
