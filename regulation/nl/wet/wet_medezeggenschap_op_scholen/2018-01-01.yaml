        artikel: 53f
  - number: 10.1.i
    text: |-
      de verzelfstandiging van een nevenvestiging, of een deel van de school of nevenvestiging dat zich op
      een andere locatie bevindt dan de plaats van vestiging van die school of nevenvestiging op grond van
      [artikel 84a van de Wet op het primair onderwijs][ref1];


