preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet medezeggenschap onderwijs 1992 te vervangen
    door een nieuwe wet, aangezien het, in het belang van het goed functioneren van de school, bedoeld in de Wet op het
    primair onderwijs, de Wet op de expertisecentra en de Wet op het voortgezet onderwijs, wenselijk is het overleg met
    en de vertegenwoordiging van het personeel en de ouders en leerlingen van de school te verbeteren mede in het licht
    van de vergroting van de autonomie van besturen van die scholen, dat het tevens wenselijk is de medezeggenschap
    bij centrale diensten als bedoeld in genoemde wetten en regionale expertisecentra als bedoeld in de Wet op de
    expertisecentra zoveel mogelijk dienovereenkomstig te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#ArtikelAanhef
