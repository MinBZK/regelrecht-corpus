  - number: '10.2'
    text: 'Voor het benoemen van een bestuurder wordt een sollicitatiecommissie ingesteld waarvan in elk geval deel uitmaken:'
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel10
  - number: 10.2.a
    text: |-
      een lid dat afkomstig is uit of namens het deel van de medezeggenschapsraad dat uit en door het personeel is
      gekozen, en
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel10
  - number: 10.2.b
    text: |-
      een lid dat afkomstig is uit of namens het deel van de medezeggenschapsraad dat uit en door de ouders of de
      leerlingen is gekozen.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel10
  - number: '11.1'
    text: |-
      De medezeggenschapsraad wordt vooraf in de gelegenheid gesteld om advies uit te brengen over elk door het bevoegd
      gezag te nemen besluit met betrekking tot in ieder geval de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel11
  - number: 11.1.a
    text: vaststelling of wijziging van het lesrooster in het voortgezet onderwijs;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel11
  - number: 11.1.b
    text: |-
      vaststelling of wijziging van de hoofdlijnen van het meerjarig financieel beleid voor de school, waaronder
      de voorgenomen bestemming van de middelen die door het bevoegd gezag ten behoeve van de school uit de
      openbare kas zijn toegekend of van anderen zijn ontvangen, met uitzondering van de middelen, bedoeld in
      [artikel 13, eerste lid, onderdeel c][ref1], en [artikel 14, tweede lid, onderdeel c][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel14
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '14'
        hoofdstuk: '3'
  - number: 11.1.c
    text: |-
      beëindiging, belangrijke inkrimping, niet zijnde een verzelfstandiging als bedoeld in
      [artikel 84a, eerste lid, van de Wet op het primair onderwijs][ref1], of uitbreiding van de werkzaamheden van de
      school of van een belangrijk onderdeel daarvan, dan wel vaststelling of wijziging van het beleid ter zake;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel84a
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 84a
  - number: 11.1.d
    text: |-
      het aangaan, verbreken of belangrijk wijzigen van een duurzame samenwerking met een andere instelling, dan wel
      vaststelling of wijziging van het beleid ter zake;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel11
  - number: 11.1.e
    text: |-
      deelneming of beëindiging van deelneming aan een onderwijskundig project of experiment, dan wel vaststelling of
      wijziging van het beleid ter zake;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel11
  - number: 11.1.f
    text: vaststelling of wijziging van het beleid met betrekking tot de organisatie van de school;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel11
  - number: 11.1.g
    text: |-
