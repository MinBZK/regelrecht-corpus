        artikel: '14'
        hoofdstuk: '3'
  - number: 10.1.g
    text: de vaststelling of wijziging van de voor de school geldende klachtenregeling;
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel10
  - number: 10.1.h
    text: |-
      overdracht van de school of van een onderdeel daarvan, respectievelijk fusie van de school met een andere school,
      dan wel vaststelling of wijziging van het beleid ter zake, waaronder begrepen de fusie-effectrapportage, bedoeld
      in [artikel 64b van de Wet op het primair onderwijs][ref1], [artikel 66b van de Wet op de expertisecentra][ref2] en
      [artikel 53f van de Wet op het voortgezet onderwijs][ref3];


