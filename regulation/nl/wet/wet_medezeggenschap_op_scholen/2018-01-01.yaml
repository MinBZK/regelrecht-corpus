    text: Het eerste lid, onderdeel q, is niet van toepassing op de medezeggenschapsraad van het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel11
  - number: 11a
    text: |-
      De ondersteuningsplanraad wordt vooraf in de gelegenheid gesteld om advies uit te brengen over elk door het
      samenwerkingsverband te nemen besluit met betrekking tot in ieder geval de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel11a
  - number: 11a.a
    text: |-
      de vaststelling van de competentieprofielen van de toezichthouders en het toezichthoudend orgaan, alsmede van de
      leden van het bestuur van het samenwerkingsverband; en
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel11a
  - number: 11a.b
    text: aanstelling of ontslag van de leden van het bestuur van het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel11a
  - number: '12.1'
    text: |-
      Het bevoegd gezag behoeft de voorafgaande instemming van het deel van de medezeggenschapsraad dat uit en door
      het personeel is gekozen, voor elk door het bevoegd gezag te nemen besluit met betrekking tot de volgende
      aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel12
  - number: 12.1.a
    text: |-
      regeling van de gevolgen voor het personeel van een besluit met betrekking tot een aangelegenheid als bedoeld in
      [artikel 10, eerste lid, onderdeel i][ref1], of [artikel 11, eerste lid, onderdelen c, d, e en m][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel11
    url: https://wetten.overheid.nl/BWBR0020685/2018-01-01#Artikel12
