  - number: '2'
    text: |-
      1 De metingen en andere werkzaamheden, nodig voor het inrichten en instandhouden van het kadaster, worden door de
      ambtenaren van het Kadaster verricht.

      2 Het bestuurscollege van het openbaar lichaam Sint Eustatius of Saba kan de Stichting kadaster en hypotheekwezen
      op Sint Maarten mandateren tot het verrichten van metingen op Sint Eustatius, respectievelijk op Saba.
    url: https://wetten.overheid.nl/BWBR0028509/2010-10-10#Artikel2
  - number: '3'
    text: |-
      De kosten van verrichtingen, welke ten behoeve van de inrichting van het kadaster geschieden komen voor rekening
      van het betrokken openbaar lichaam, terwijl die, welke op aanvraag van belanghebbenden geschieden, voor rekening
      komen van de aanvragers, volgens een nader, bij eilandsbesluit, houdende algemene maatregelen, vast te stellen
      tarief.
    url: https://wetten.overheid.nl/BWBR0028509/2010-10-10#Artikel3
  - number: '4'
    text: |-
      1 Personen die door het Kadaster of een daartoe op grond van een wettelijk voorschrift bevoegde functionaris zijn
      belast met het verrichten van metingen en andere werkzaamheden als bedoeld in [artikel 2, eerste lid][ref1], zijn
      bevoegd, met medeneming van de benodigde apparatuur en andere hulpmiddelen, elke plaats te betreden, onverminderd
      de [artikelen 155 tot en met 163 van het Wetboek van Strafvordering BES][ref2], en daar een waarneming, meting of
      graving te verrichten en daarop een teken te stellen, voor zover het redelijkerwijs nodig is voor het verrichten
      van een meting of een andere werkzaamheid als bedoeld in [artikel 2, eerste lid][ref3].

      2 De eigenaar, de beperkt gerechtigde en de gebruiker van een registergoed zijn verplicht aan een persoon als
      bedoeld in het eerste lid binnen de door hem gestelde redelijke termijn alle medewerking te verlenen die deze
      redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden, genoemd in het eerste lid, met dien verstande
      dat de toegang slechts wordt verleend tussen zeven uur ’s morgens en zes uur ’s avonds en dat die niet behoeft te
      worden verleend op zaterdagen, zondagen en algemeen erkende feestdagen.

      3 Indien de toegang wordt geweigerd, verschaffen de personen, bedoeld in het eerste lid, zich zonodig toegang
      met behulp van de sterke arm. Indien het verrichten van de handelingen, bedoeld in het eerste lid, niet wordt
      toegestaan of de medewerking, bedoeld in het tweede lid, niet wordt verleend, zijn de personen, bedoeld in het
      eerste lid, bevoegd het verrichten van voornoemde handelingen zo nodig met behulp van de sterke arm mogelijk te
      maken.


      [ref1]: https://wetten.overheid.nl/BWBR0028509#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0028509#Artikel2
    url: https://wetten.overheid.nl/BWBR0028509/2010-10-10#Artikel4
