  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Kadaster:* door het bestuurscollege opgerichte stichting belast met de taken, bedoeld in [artikel 2][ref1];
        - *kadaster:* kadastrale registratie;
        - *Openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028509#Artikel2
    url: https://wetten.overheid.nl/BWBR0028509/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028509
        artikel: '2'
  - number: 1a
    text: |-
      1 De gebouwde en ongebouwde eigendommen worden aangeduid door de opgave van de kadastrale afdeling, de sectie en
      het nummer, waaronder zij in de schrifturen van het kadaster bekend zijn en worden kadastrale percelen genaamd.

      2 In de kadastrale aanduiding wordt de afkorting van het openbaar lichaam vermeld, de gemeente, het dorp of
      gehucht, waar de onroerende zaak is gelegen. Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld
      met betrekking tot de kadastrale aanduiding. Bij die maatregel kan de kadastrale aanduiding per openbaar lichaam
      verschillend worden geregeld.

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de in de kadastrale registratie op
      te nemen gegevens. De kadastrale registratie kan geen andere gegevens bevatten dan de gegevens, bedoeld in
      [artikel 48, tweed lid, van de Kadasterwet][ref1]. Het bestuurscollege kan regels stellen omtrent de bijhouding van
      de kadastrale registratie.

      4 De kadastrale registratie bevat een kadastrale kaart. De kadastrale kaart bevat gegevens overeenkomstig
      [artikel 48, derde lid, van de Kadasterwet][ref2].

      5 Bij algemene maatregel van bestuur kan worden bepaald dat de kadastrale registratie en de kadastrale kaart
      van een openbaar lichaam worden aangemerkt als basisregistratie en welke gegevens daarvan als authentiek worden
      aangemerkt. De algemene maatregel van bestuur kan geen andere voorschriften geven dan voorschriften overeenkomstig
      de [artikelen 7f tot en met 7w van de Kadasterwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel7f
