  - number: '5'
    text: |-
      De eigenaren, beperkt gerechtigden en gebruikers van gebouwde en ongebouwde eigendommen zijn verplicht te dulden
      dat door het Kadaster grenstekenen worden gesteld, alsmede ten behoeve van de opmeting van grenzen, signalen of
      andere duurzame tekenen.
    url: https://wetten.overheid.nl/BWBR0028509/2010-10-10#Artikel5
  - number: '6'
    text: |-
      1 De percelen gronds, welke op aanvraag van belanghebbenden zijn opgemeten, worden op hunne kosten, ten genoegen
      van het Kadaster, van duurzame officiële grenstekenen voorzien, welke grenstekenen zullen bestaan uit baksteen,
      betonnen of ijzeren kenteekenen.

      2 De percelen gronds, welke ten behoeve van de inrichting van het kadaster zijn opgemeten, worden op kosten van het
      betrokken openbaar lichaam van gelijke grenstekenen voorzien.

      3 Verplaatsing van eenmaal aangebrachte grenstekenen, zonder toestemming van het Kadaster, is verboden.
    url: https://wetten.overheid.nl/BWBR0028509/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 Hij, die handelt in strijd met het bepaalde bij het laatste lid van [artikel 6][ref1] wordt, indien het feit niet
      als misdrijf is aan te merken, gestraft met een geldboete van de tweede categorie.

      2 Met dezelfde straf wordt gestraft hij, die opdracht heeft gegeven tot verplaatsing van eenmaal aangebrachte
      grenstekenen zonder toestemming van het Kadaster, indien de verplaatsing ingevolge die opdracht is geschied.

      3 De in dit artikel strafbaar gestelde feiten, worden beschouwd als overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028509#Artikel6
    url: https://wetten.overheid.nl/BWBR0028509/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028509
        artikel: '6'
  - number: '8'
    text: |-
      De eisen waaraan de te plaatsen merktekenen moeten voldoen, zijn de volgende:

      a. bij verzekering van eigendomsgrenzen in muren moet worden gebezigd een ijzeren bout met een minimum diameter van
      25 mm, en een minimum lengte van 150 mm, terwijl de bout voorzien moet zijn van een kop met een minimum diameter
      van 40 mm en een lengte van minstens 10 mm.

      b. in andere dan onder a genoemde gevallen dient te worden gebezigd:

      I. een gasbuis of ijzeren staaf van minstens tachtig centimeter lengte en een diameter van minstens drie en een
      kwart centimeter, terwijl het gedeelte, dat boven den grond uitsteekt (twee decimeter), van een sluitstuk of kop
      wordt voorzien en rood wordt geverfd met menie dan wel

      II. stenen of betonnen merktekenen van minstens drie decimeter in het vierkant en zes decimeter hoogte, welke
      pilaren behoren te staan op een fundering van twee decimeter hoogte en vier decimeter in het vierkant.
    url: https://wetten.overheid.nl/BWBR0028509/2010-10-10#Artikel8
  - number: '9'
    text: |-
      Waar, in verband met de gesteldheid van den bodem, de in [artikel 8][ref1] voorgeschreven merktekenen ongeschikt
      worden geacht voor de verzekering van grenzen, bepaalt het Kadaster welke andere duurzame merktekenen gebezigd
      zullen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0028509#Artikel8
    url: https://wetten.overheid.nl/BWBR0028509/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028509
        artikel: '8'
  - number: '10'
    text: |-
      1 De rechthebbende op den grond is verplicht de tot verzekering der grenzen dienende merktekenen in behoorlijke
      staat, ter beoordeling van het Kadaster, te onderhouden.

      2 Door het Kadaster wordt, indien na schriftelijke aanmaning op een termijn van een maand niet het nodig
      geoordeelde bijzonderlijk omschreven onderhoud is geschied, op kosten van den nalatige daarin voorzien.
    url: https://wetten.overheid.nl/BWBR0028509/2010-10-10#Artikel10
  - number: '11'
    text: |-
      Het kadaster omvat mede het Kadaster, bedoeld in artikel 1 van de Kadasterlandsverordening, voor zover zij
      betrekking heeft op gebouwde en ongebouwde eigendommen in het betreffende openbaar lichaam en zoals het luidde
      onmiddellijk voorafgaand aan het tijdstip van de inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0028509/2010-10-10#Artikel11
  - number: '12'
    text: 'Deze wet wordt aangehaald als: Wet kadaster en registratie onroerende zaken en beperkte rechten BES.'
    url: https://wetten.overheid.nl/BWBR0028509/2010-10-10#Artikel12
