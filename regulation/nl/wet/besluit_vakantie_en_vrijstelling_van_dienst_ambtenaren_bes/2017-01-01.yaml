articles:
  - number: '1'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel1
  - number: '2.1'
    text: |-
      Dit besluit is niet van toepassing op de ambtenaar van politie, bedoeld in
      [artikel 1, onderdeel c, van het Besluit rechtspositie korps politie BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel1
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028767
        artikel: '1'
  - number: '2.2'
    text: |-
      Voor de toepassing van [hoofdstuk II][ref1] van dit besluit worden niet als ambtenaar beschouwd:


      [ref1]: https://wetten.overheid.nl/BWBR0028606#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028606
        hoofdstuk: II
  - number: 2.2.a
    text: |-
      het onderwijzend personeel bij het van overheidswege gegeven openbaar onderwijs. Onder onderwijzend personeel wordt
      mede begrepen de amanuensis werkzaam bij het van overheidswege gegeven openbaar onderwijs;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel2
  - number: 2.2.b
    text: de met volledige dagtaak aan een politieopleidingschool verbonden leerkracht.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel2
  - number: '3'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel3
  - number: '4'
    text: |-
      Voor de toepassing van dit besluit en de uit kracht daarvan gegeven voor schriften wordt verstaan onder: - *bevoegd
      gezag:* a. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, voor wat betreft hoofden van dienst in
      dienst van de staat; b. het bestuurscollege, voor wat betreft de hoofden van dienst in dienst van een openbaar
      lichaam; c. de Rijksvertegenwoordiger, voor wat betreft het personeel van het Bureau van de Rijksvertegenwoordiger;
      d. het hoofd van de dienst voor wat betreft de bij zijn dienst werkzaam gestelde ambtenaren.
        - *hoofd van dienst:* de bij besluit van het bevoegd gezag als zodanig aangewezen ambtenaren.
        - *gezin:* a. de echtgenote van de betrokken ambtenaar; b. de kinderen tot wie de betrokken ambtenaar in
      familierechtelijke betrekking staat die de leeftijd van 21 jaar nog niet hebben bereikt en niet gehuwd zijn of
      gehuwd geweest zijn, de stief- en pleegkinderen van de betrokken ambtenaar die de leeftijd van 21 jaar nog niet
      hebben bereikt en niet gehuwd zijn of gehuwd geweest zijn, de laatsten voor zover de betrokken ambtenaar ten
      behoeve van deze pleegkinderen kindertoelage geniet; c. de overige kinderen tot wie de betrokken ambtenaar in
      familie-rechtelijke betrekking staat, de overige stief- en pleegkinderen van de betrokken ambtenaar, voor zover de
      betrokken ambtenaar ten behoeve van deze kinderen kindertoelage geniet;
        - *inkomen:* de bezoldiging van de ambtenaar, vermeerderd met een eventuele kindertoelage, de bijzondere
      individuele vergoedingen en de verhogingen en persoonlijke toelagen met een periodiek karakter welke op grond van
      een organieke regeling van de bezoldiging worden genoten. Voor het onderwijzend personeel bij het van overheidswege
      gegeven openbare onderwijs wordt mede als inkomen aangemerkt de aan dit personeel op grond van geldende wettelijke
      regelingen toegekende vaste toelagen. Voor de berekening van de vakantie-uitkering bedoeld in [hoofdstuk IV][ref1]
      wordt de compensatietoeslag hiervoor bedoeld niet als deel van het inkomen aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028606
        hoofdstuk: IV
  - number: '5.1'
    text: |-
      De ambtenaar heeft per kalenderjaar aanspraak op vakantie met behoud van vol inkomen, op de voorwaarden en met
      inachtneming van de regelen gesteld in dit hoofdstuk. Hij is gerechtigd zijn vakantie geheel of gedeeltelijk in het
      buitenland door te brengen.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel5
  - number: '5.2'
    text: |-
      De vakantie bedoeld in het eerste lid, wordt aan de ambtenaar op zijn daartoe strekkend schriftelijk verzoek
      aaneengesloten verleend door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel5
  - number: '5.3'
    text: |-
      Wanneer de ambtenaar dit verzoekt en de dienst het toelaat, kan in een kalenderjaar ten hoogste de helft van
      het aantal vakantieuren waarop de ambtenaar per kalenderjaar aanspraak heeft gesplitst worden verleend. Door
      of namens het bevoegd gezag kan voor een bepaalde dienst of een bepaald dienstvak of bedrijf het minimum-aantal
      aaneengesloten uren worden vastgesteld dat op een zelfde dag als vakantieuren kan worden toegekend. Dit aantal mag
      niet hoger gesteld worden dan het voor een ambtenaar volgens de voor hem geldende werktijd op één dag vastgestelde
      aantal werkuren.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel5
  - number: '5.4'
    text: |-
      Omtrent de tijdstippen, waarop de vakantie zal ingaan, alsmede omtrent de tijdvakken waarin deze eventueel zal
      worden gesplitst, beslist het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel5
  - number: '5.5'
    text: |-
      Bij het nemen van de beslissing bedoeld in het vorige lid, wordt met inachtneming van de belangen van de dienst
      zoveel mogelijk rekening gehouden met de wensen van de ambtenaar, waartoe deze kenbaar maakt, wanneer hij bij
      voorkeur de hem toekomende vakantie wenst te genieten.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel5
  - number: 5a.1
    text: |-
      Het bevoegd gezag kan aan het begin van het kalenderjaar voor dat jaar twee dagen als brugdag aanwijzen. Onder
      brugdag wordt verstaan een dag tussen een feestdag en een weekend of tussen een weekend en een feestdag, waarop de
      ambtelijke dienst gesloten is en de ambtenaar zijn werkzaamheden niet kan verrichten. De niet gewerkte uren worden
      in mindering gebracht op het aantal vakantie-uren waarop de ambtenaar dat kalenderjaar aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel5a
  - number: 5a.2
    text: |-
      De aanwijzing van brugdagen vindt niet plaats dan nadat daarover door of namens Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties overleg is gepleegd met de Sectorale Overlegcommissie BES, bedoeld in
      [artikel 2.1 van het Besluit overlegstelsel BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
  - number: '6.1'
    text: |-
      Voorzover aan de ambtenaar in een kalenderjaar het hem volgens dit hoofdstuk toekomende aantal vakantieuren niet is
      verleend, wordt hem de niet genoten vakantie in het daaropvolgend kalenderjaar aaneengesloten verleend. De vakantie
      van het voorgaande jaar en de vakantie van het lopende jaar worden aaneengesloten genoten, tenzij de ambtenaar te
      kennen geeft laatstbedoelde vakantie in het daarop volgende kalenderjaar te willen opnemen. [Artikel 5 lid 3][ref1]
      blijft in dit laatste geval onverminderd van toepassing. Vakantie over meer dan twee kalenderjaren kan niet
      aaneengesloten worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel5
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '5'
        hoofdstuk: II
  - number: '6.2'
    text: |-
      Behoudens het bepaalde in [artikel 7][ref1] verliest de ambtenaar zijn aanspraak op het door hem niet genoten
      aantal vakantieuren betrekking hebbende op het kalenderjaar voorafgaande aan het afgelopen kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel7
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '7'
        hoofdstuk: II
  - number: 6a
    text: |-
      Voor zover de ambtenaar ten aanzien van wie een dienstrooster als bedoeld in
      [artikel 37 van het Rechtspositiebesluit ambtenaren BES][ref1] is vastgesteld, vakantie is verleend op een tijd
      waarop hij volgens het dienstrooster niet gehouden is werkzaamheden te verrichten, maar wel op de werkplaats
      beschikbaar moet zijn, wordt slechts de helft van die tijd als genoten vakantie-uren aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel37
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '37'
  - number: '7.1'
    text: |-
      De in dit hoofdstuk bedoelde vakantie kan wegens dringende redenen van dienstbelang geheel of gedeeltelijk worden
      geweigerd of ingetrokken bij gemotiveerde beschikking van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel7
  - number: '7.2'
    text: |-
      Indien de vakantie krachtens het vorige lid geheel of gedeeltelijk is geweigerd of ingetrokken behoudt de ambtenaar
      zijn aanspraak op het aantal door hem niet genoten vakantieuren. Weigering of intrekking kan voor ten hoogste 12
      maanden uitstel van de desbetreffende vakantie tot gevolg hebben. Behalve in het geval dat de dienstverhouding tot
      de overheid wegens ontslag eindigt, kan aan de ambtenaar in enig kalenderjaar nimmer een langere vakantie worden
      verleend dan tweemaal het hem volgens [artikel 8][ref1] toekomende aantal vakantieuren.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel8
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '8'
        hoofdstuk: II
  - number: '7.3'
    text: |-
      In geval van intrekking van de vakantie zoals bedoeld in het voorgaande lid wordt, indien de ambtenaar als gevolg
      daarvan van de hem op een bepaalde dag toegekende vakantieuren er een deel niet heeft kunnen genieten, geen van
      de op die dag vallende vakantieuren als zodanig aangemerkt. Indien de ambtenaar tengevolge van de intrekking van
      vakantie geldelijke schade lijdt, wordt deze schade hem vergoed. In het geval de ambtenaar zijn vakantie doorbrengt
      buiten het eiland waar hij werkzaam is, wordt hem, indien hij op het tijdstip waarop hij zijn werkzaamheden hervat
      minder dan 3/4 gedeelte van het aantal vakantieuren dat hij buiten het eiland waar hij werkzaam is zou doorbrengen
      heeft genoten, bovendien vergoed de door hem voor zich en zijn gezin gemaakte reiskosten naar de plaats waar hij
      op het tijdstip van de intrekking met vakantie vertoeft, vermeerderd met een vergoeding van de door hem gemaakte
      kosten van een rechtstreekse reis van die plaats naar het eiland waar hij werkzaam is.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel7
  - number: '8.1'
    text: Het aantal vakantie-uren waarop de ambtenaar per kalenderjaar aanspraak heeft, bedraagt 184 werkuren.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel8
  - number: '8.2'
    text: |-
      Aan de ambtenaar die ingevolge het voor hem geldende werkrooster avond- en/of nachtdienst en dienst op zon- en
      feestdagen moet verrichten wordt per kalenderjaar 24 extra vakantie-uren verleend.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel8
  - number: '8.3'
    text: |-
      Voor een ambtenaar voor wie de geldende werktijd korter is dan de gebruikelijke volledige werktijd, wordt het in
      het eerste lid genoemde aantal vakantie-uren vermenigvuldigd met een breuk waarvan de teller bestaat uit het aantal
      uren van de voor die ambtenaar geldende werktijd en de noemer uit het aantal uren van de voor zijn functie geldende
      gebruikelijke volledige werktijd.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel8
  - number: '8.4'
    text: |-
      Indien gedurende een kalenderjaar wijziging optreedt in de omvang van de voor een ambtenaar geldende werktijd,
      wordt het aantal vakantieuren waarop de ambtenaar gedurende dat jaar aanspraak heeft, bepaald door het aantal
      vakantieuren voor elk tijdvak van het kalenderjaar waarin de voor de ambtenaar geldende werktijd gelijk is,
      afzonderlijk te berekenen en hiervan de som te bepalen. Het aantal vakantieuren waarop de ambtenaar gedurende elk
      tijdvak van het kalenderjaar aanspraak heeft, wordt berekend door het aantal maanden dat het tijdvak heeft geduurd,
      te delen door 12 en het quotiënt te vermenigvuldigen met het aantal vakantieuren waarop de ambtenaar aanspraak zou
      hebben als het tijdvak een vol kalenderjaar zou hebben gevormd.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel8
  - number: '8.5'
    text: |-
      Het aantal uren waarvoor ingevolge dit artikel aanspraak op vakantie bestaat, wordt zo nodig naar boven afgerond op
      hele uren.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel8
  - number: 8a
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel8a
  - number: '9.1'
    text: |-
      Indien een ambtenaar tijdens zijn vakantie blijkens een geneeskundige verklaring gedurende een of meer dagen
      arbeidsongeschikt is geweest, wordt het aantal hem verleende vakantieuren dat overeenkomt met het aantal werkuren
      gedurende welke hij arbeidsongeschikt was, beschouwd niet als vakantie te zijn genoten en wordt hem voor de duur
      van zijn arbeidsongeschiktheid met inachtneming van de bepalingen van [hoofdstuk VI][ref1] vrijstelling van dienst
      wegens ziekte verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028606
        hoofdstuk: VI
  - number: '9.2'
    text: |-
      Voor het aantal werkuren volgens de voor de ambtenaar geldende werktijd, waarop hij in verband met de toepassing
      van het eerste lid geen vakantie heeft genoten, wordt hem opnieuw vakantie verleend met inachtneming van de
      bepalingen van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel9
  - number: '10.1'
    text: |-
      De aanspraken van de ambtenaar op vakantie worden in alle gevallen waarin de ambtenaar in een kalenderjaar dertig
      dagen of meer al dan niet aaneengesloten anders dan tengevolge van verleende vakantie, vrijstelling van dienst
      wegens ziekte, vrijstelling van dienst wegens bijzondere omstandigheden met behoud van vol inkomen of vergoeding
      in vrije tijd wegens verricht overwerk, geen werkelijke dienst doet, verminderd naar reden van 1/12 gedeelte van
      het hem ingevolge [artikel 8][ref1] toekomende aantal vakantieuren voor elk aantal van dertig dagen waarop hij geen
      werkelijke dienst heeft vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel8
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '8'
        hoofdstuk: II
  - number: '10.2'
    text: |-
      Indien de tijd, gedurende welke de ambtenaar geen werkelijke dienst doet, zich over meer dan één kalenderjaar
      uitstrekt, worden de aanspraken op vakantie bij toepassing van het vorige lid, over de desbetreffende kalenderjaren
      naar evenredigheid verminderd.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel10
  - number: '10.3'
    text: |-
      Indien de vermindering bedoeld in het eerste lid niet kan worden toegepast omdat de aan de ambtenaar toekomende
      vakantie in het desbetreffende kalenderjaar reeds geheel is genoten of daarvoor niet toereikend is, geschiedt de
      vermindering of verdere vermindering in het eerstvolgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel10
  - number: '10.4'
    text: |-
      Het aantal uren, waarop de ambtenaar ingevolge dit artikel over enig kalenderjaar aanspraak blijft houden op
      vakantie, wordt zo nodig naar boven afgerond op hele uren.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel10
  - number: '11.1'
    text: |-
      Onverminderd het bepaalde in de [leden 2, 3, 4 en 5 van artikel 5][ref1] heeft de ambtenaar gedurende de eerste
      zes maanden na aanvaarding van zijn ambt slechts aanspraak op vakantie naar reden van 1/12 gedeelte van het in
      [artikel 8][ref2] vastgestelde aantal vakantieuren en wel voor iedere volle kalendermaand, dat hij in genoemd
      tijdvak werkelijke dienst heeft vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028606#Artikel8
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028606
        artikel: '8'
        hoofdstuk: II
  - number: '11.2'
    text: |-
      Het aantal uren, waarop ingevolge het voorgaande lid aanspraak op vakantie bestaat, wordt zo nodig naar beneden
      afgerond op hele uren.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel11
  - number: '12.1'
    text: |-
      Degene die onmiddellijk vóór zijn aanstelling tot ambtenaar in overheidsdienst werkzaam was, anders dan als
      ambtenaar behorende tot het onderwijzend personeel bedoeld in [hoofdstuk III][ref1] of behorende tot het personeel
      van het gesubsidieerd bijzonder onderwijs, alsmede degene die bij een publiekrechtelijke instelling, dan wel
      bij een door de overheid in het leven geroepen privaatrechtelijke rechtspersoon werkzaam was, behoudt bij zijn
      aanstelling aanspraak op het aantal door hem niet genoten vakantieuren waarop hij tot en met ultimo december van
      het kalenderjaar voorafgaande aan het kalenderjaar waarin zijn aanstelling plaatsvindt aanspraak kon doen gelden
      overeenkomstig de voor hem vóór zijn aanstelling tot ambtenaar geldende voorschriften. De in de vorige zin bedoelde
      vakantie wordt hem verleend met inachtneming van de voorschriften van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028606
        hoofdstuk: III
  - number: '12.2'
    text: |-
      Indien de aanstelling in het vorige lid bedoeld plaatsvindt in de loop van een kalenderjaar kan de ambtenaar over
      dat kalenderjaar voor elk aantal van dertig dagen dat hij werkelijke dienst vervult aanspraak maken op:
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel12
  - number: 12.2.a
    text: |-
      over het gedeelte van dat kalenderjaar voorafgaande aan zijn aanstelling: 1/12 gedeelte van het aantal vakantieuren
      dat hem overeenkomstig de voor hem vóór zijn aanstelling tot ambtenaar geldende voorschriften toekwam;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel12
  - number: 12.2.b
    text: |-
      over het gedeelte van dat kalenderjaar vanaf zijn aanstelling: 1/12 gedeelte van het hem ingevolge
      [artikel 8][ref1] toekomende aantal vakantieuren. Indien de aanstelling plaatsvindt in de loop van een
      kalendermaand wordt deze voor de toepassing van het bepaalde onder b geacht te zijn ingegaan op de eerste van die
      maand. Het aantal uren, waarop de ambtenaar ingevolge de berekening bedoeld onder a en b aanspraak kan doen gelden
      op vakantie, wordt zo nodig naar boven afgerond op hele uren.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel8
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '8'
        hoofdstuk: II
  - number: '13'
    text: |-
      [Artikel 12][ref1] is van overeenkomstige toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel12
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '12'
        hoofdstuk: II
  - number: 13.a
    text: de ambtenaar in dienst van de Staat die in dienst van een openbaar lichaam overgaat;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel13
  - number: 13.b
    text: de ambtenaar in dienst van een openbaar lichaam die in dienst van de Staat n overgaat;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel13
  - number: 13.c
    text: de ambtenaar in dienst van een openbaar lichaam die in dienst van een ander openbaar lichaam overgaat;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel13
  - number: 13.d
    text: |-
      degene die werkzaam is bij een publiekrechtelijke instelling, dan wel bij een door de overheid in het leven
      geroepen privaatrechtelijke rechtspersoon en die in dienst van de Staat of een openbaar lichaam overgaat.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel13
  - number: '14.1'
    text: |-
      Degene behorende tot het onderwijzend personeel bedoeld in [hoofdstuk III][ref1] alsmede degene behorende tot het
      personeel bij het gesubsidieerd bijzonder onderwijs die tot ambtenaar wordt aangesteld kan in dat kalenderjaar voor
      elk aantal van dertig dagen dat hij in laatstbedoelde hoedanigheid werkelijke dienst vervult aanspraak doen gelden
      op 1/12 gedeelte van het aantal vakantieuren dat hem ingevolge [artikel 8][ref2] toekomt. Indien de aanstelling
      plaatsvindt in de loop van een kalendermaand wordt deze voor de toepassing van het bepaalde in de vorige zin geacht
      te zijn ingegaan op de eerste van die maand. Het aantal uren, waarop de ambtenaar ingevolge de hiervoor bedoelde
      berekening aanspraak kan doen gelden op vakantie wordt zo nodig naar boven afgerond op hele uren.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0028606#Artikel8
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028606
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028606
        artikel: '8'
        hoofdstuk: II
  - number: '14.2'
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing op de adspirant-agent die geen leerling meer is,
      en de leerkracht wanneer zijn plaatsing aan de politieopleidingsschool eindigt.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel14
  - number: '15.1'
    text: |-
      Indien de ambtenaar in enig kalenderjaar meer vakantie heeft genoten dan hem ingevolge dit hoofdstuk toekomt, wordt
      dit meerdere verrekend met de hem over een of meer volgende kalenderjaren toekomende vakantie.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel15
  - number: '15.2'
    text: |-
      Het bepaalde in het eerste lid geldt met dien verstande, dat uit dien hoofde in enig kalenderjaar de vakantie
      nimmer met meer dan een derde gedeelte van hetgeen de ambtenaar ingevolge het bepaalde in [artikel 8][ref1] over
      dat jaar toekomt, mag worden verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel8
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '8'
        hoofdstuk: II
  - number: '15.3'
    text: |-
      Het bepaalde in het [vierde lid van artikel 10][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel10
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '10'
        hoofdstuk: II
  - number: '16.1'
    text: |-
      Ter compensatie van de door de ambtenaar bij zijn overlijden niet genoten of gedeeltelijk niet genoten vakantie,
      wordt door de overheid aan de weduwe of weduwnaar een geldsbedrag uitbetaald gelijk aan het bedrag dat aan de
      ambtenaar aan inkomen zou zijn uitgekeerd gedurende de vakantie, indien de vakantie zou zijn genoten. Bij de
      vaststelling van het aantal niet genoten vakantieuren vindt [artikel 10][ref1] geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel10
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '10'
        hoofdstuk: II
  - number: '16.2'
    text: |-
      Indien de overledene geen weduwe of weduwnaar nalaat, geschiedt de uitbetaling ten behoeve van de kinderen tot
      wie de overledene in familierechtelijke betrekking stond die de leeftijd van 21 jaar nog niet hebben bereikt en
      niet gehuwd zijn of gehuwd geweest zijn. Ontbreken ook zodanige kinderen, dan geschiedt de uitbetaling, indien de
      overledene kostwinner was van ouders, broeders, zusters, overige kinderen of stiefkinderen, ten behoeve van deze
      betrekkingen.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel16
  - number: '16.3'
    text: |-
      Laat de overledene ook geen betrekkingen, als bedoeld in het tweede lid na, dan wordt het in het eerste lid
      bedoelde bedrag geheel of ten dele aangewend voor de betaling van de kosten van de laatste ziekte en van de
      lijkbezorging.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel16
  - number: '17.1'
    text: |-
      Het onderwijzend personeel bij het van overheidswege gegeven openbare onderwijs geniet vakantie, met behoud van vol
      inkomen, op dezelfde dagen als waarop voor de leerlingen van de inrichting van onderwijs waaraan het is verbonden
      de schoolvakanties zijn of zullen worden vastgesteld. Dit personeel kan, indien het dit wenst, in de tijdvakken
      waarin het vakantie geniet in het buitenland verblijven.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel17
  - number: '17.2'
    text: |-
      Het onderwijzend personeel houdt zich zo nodig gedurende ten hoogste 6 dagen van de vakantie ter beschikking van
      het bestuurscollege, ten behoeve van werkzaamheden van onderwijskundige en/of schoolorganisatorische aard. Door
      of vanwege het bestuurscollege wordt aan het onderwijzend personeel tijdig medegedeeld op welke dagen het zich ter
      beschikking moet houden. Tenminste een der tijdvakken waarin het onderwijzend personeel vakantie geniet dient een
      aaneengesloten periode van ten minste vier weken te omvatten.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel17
  - number: '18.1'
    text: |-
      Voor het aantal werkuren gedurende welke de directeur of het hoofd van een school met voorafgaande schriftelijke
      toestemming van of vanwege het bestuurscollege gedurende de tijd dat het onderwijzend personeel vakantie geniet
      werkzaamheden verricht van onderwijskundige en/of schoolorganisatorische aard waardoor hij op die dagen geen
      vakantie heeft genoten, worden hem op zijn schriftelijk verzoek extra vrije uren aaneengesloten toegekend
      onmiddellijk voorafgaande aan of aansluitende op een schoolvakantie. Het aantal extra vrije uren waarop
      belanghebbende aanspraak kan doen gelden wordt bij beschikking van het bestuurscollege vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het verzoek bedoeld in het eerste lid kan in het belang van het onderwijs worden geweigerd. Indien deze weigering
      tot gevolg heeft dat de extra vrije uren waarop de belanghebbende aanspraak kan doen gelden niet in het lopende
      schooljaar kunnen worden genoten, worden deze extra vrije uren in het daaropvolgende schooljaar toegekend. Mocht
      ook in laatstbedoeld schooljaar toekenning van de extra vrije uren in het belang van het onderwijs niet mogelijk
      zijn, dan wordt hem in plaats daarvan een uitkering toegekend. Deze uitkering is gelijk aan het inkomen waarop
      belanghebbende gedurende deze extra vrije uren aanspraak zou hebben kunnen doen gelden indien de niet genoten vrije
      uren onmiddellijk voorafgaande aan de laatste schoolvakantie in laatstbedoeld schooljaar zouden zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel18
  - number: '19.1'
    text: |-
      Indien een lid van het onderwijzend personeel in de tijd dat hij vakantie geniet, blijkens een geneeskundige
      verklaring, gedurende een of meer dagen arbeidsongeschikt is geweest, wordt elk werkuur gedurende welke hij op
      een bepaalde dag arbeidsongeschikt was die wanneer de school niet gesloten zou zijn geweest een schooldag zou
      zijn, beschouwd niet als vakantie te zijn genoten en wordt hem voor de duur van zijn arbeidsongeschiktheid met
      inachtneming van de bepalingen van [hoofdstuk VI][ref1] vrijstelling van dienst wegens ziekte verleend. Voor
      het aantal werkuren gedurende welke het lid van het onderwijzend personeel in verband met de toepassing van
      het bepaalde in de vorige zin geen vakantie heeft genoten, worden hem op zijn verzoek bij beschikking van het
      bestuurscollege extra vrije uren aaneengesloten toegekend onmiddellijk voorafgaande aan of aansluitende op een
      volgende schoolvakantie. Het aantal extra vrije uren waarop belanghebbende na een ziekteperiode aanspraak kan doen
      gelden wordt bij beschikking van het bestuurscollege vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028606
        hoofdstuk: VI
  - number: '19.2'
    text: |-
      Het verzoek bedoeld in het eerste lid kan in het belang van het onderwijs worden geweigerd. Het uitstel dat deze
      weigering tot gevolg heeft mag zich ten hoogste over twee achtereenvolgende schooljaren uitstrekken, met dien
      verstande dat bij de toekenning in enig schooljaar niet meer extra vrije uren kunnen worden toegekend dan het
      aantal werkuren dat belanghebbende op grond van [artikel 17][ref1] over twee achtereenvolgende schooljaren aan
      vakantie kan genieten.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel17
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '17'
        hoofdstuk: III
  - number: '19.3'
    text: |-
      De belanghebbende verliest zijn aanspraak op het aantal extra vrije uren bedoeld in de vorige leden voor de
      toekenning waarvan hij geen verzoek of nader verzoek tot toekenning heeft ingediend voor zover het betreft extra
      vrije uren welke in het schooljaar voorafgaande aan het afgelopen schooljaar konden worden aangevraagd.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel19
  - number: '20.1'
    text: |-
      Ter compensatie van het door het lid van het onderwijzend personeel bij zijn overlijden niet genoten aantal extra
      vrije uren bedoeld in de [artikelen 18][ref1] en [19][ref2], wordt door het openbaar lichaam aan de weduwe of
      weduwnaar een geldsbedrag uitbetaald gelijk aan het bedrag dat aan dat lid van het onderwijzend personeel aan
      inkomen zou zijn uitgekeerd indien deze extra vrije uren zouden zijn genoten. Indien een lid van het onderwijzend
      personeel overlijdt in een tijdvak waarin hij op grond van [artikel 17][ref3] vakantie geniet, is het bepaalde in
      de vorige zin van overeenkomstige toepassing met betrekking tot het aantal uren gedurende welke hij, ware hij niet
      overleden, in dat tijdvak vakantie zou hebben genoten


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028606#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0028606#Artikel17
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '18'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028606
        artikel: '19'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0028606
        artikel: '17'
        hoofdstuk: III
  - number: '20.2'
    text: |-
      Indien de overledene geen weduwe of weduwnaar nalaat, geschiedt de uitbetaling ten behoeve van de kinderen tot
      wie de overledene in familierechtelijke betrekking stond die de leeftijd van 21 jaar nog niet hebben bereikt en
      niet gehuwd zijn of gehuwd geweest zijn. Ontbreken ook zodanige kinderen, dan geschiedt de uitbetaling, indien de
      overledene kostwinner was van ouders, broeders, zusters, overige kinderen of stiefkinderen, ten behoeve van deze
      betrekkingen.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel20
  - number: '20.3'
    text: |-
      Laat de overledene ook geen betrekkingen, als bedoeld in het tweede lid na, dan wordt het in het eerste lid
      bedoelde bedrag geheel of ten dele aangewend voor de betaling van de kosten van de laatste ziekte en van de
      lijkbezorging.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel20
  - number: 20a
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel20a
  - number: 20b
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel20b
  - number: 20c.1
    text: |-
      De in [artikel 2 lid 3 onder b][ref1] bedoelde leerkracht geniet vakantie met behoud van vol inkomen op dezelfde
      dagen als waarop voor de leerling de vakanties zijn of zullen worden vastgesteld. Hij kan, indien hij dit wenst, in
      de tijdvakken waarin hij vakantie geniet in het buitenland verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel2
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel20c
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '2'
        hoofdstuk: I
  - number: 20c.2
    text: |-
      Boven de in het vorige lid bedoelde vakantiedagen kan aan de leerkracht per kalenderjaar ten hoogste twee keer één
      werkdag gesplitst worden verleend als vakantiedag.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel20c
  - number: 20d
    text: |-
      Degene die met een volledige dagtaak als leerkracht aan de politieopleidingsschool wordt verbonden behoudt zijn
      aanspraak op het aantal door hem niet genoten vakantiedagen waarop hij aanspraak kan doen gelden overeenkomstig de
      voor hem vóór zijn plaatsing als leerkracht geldende voorschriften.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel20d
  - number: 20e
    text: |-
      Indien een leerkracht in de tijd dat hij vakantie geniet, blijkens een geneeskundige verklaring gedurende één of
      meer dagen arbeidsongeschikt is geweest wordt elke werkdag gedurende welke hij arbeidsongeschikt was en die wanneer
      de school niet gesloten zou zijn geweest een schooldag zou zijn, beschouwd niet als vakantie te zijn genoten en
      wordt hem voor de duur van zijn arbeidsongeschiktheid met inachtneming van de bepalingen van [hoofdstuk VI][ref1]
      vrijstelling van dienst wegens ziekte verleend. Voor het aantal werkdagen dat de leerkracht in verband met de
      toepassing van het bepaalde in de vorige zin geen vakantie heeft genoten, wordt hem opnieuw vakantie verleend in de
      loop van hetzelfde of het daarop volgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel20e
    references:
      - id: ref1
        bwb_id: BWBR0028606
        hoofdstuk: VI
  - number: 20f.1
    text: |-
      Wegens dringende redenen van dienstbelang kan bij met redenen omklede beschikking van de hoofdcommissaris van
      politie worden bepaald, dat de vakantie, bedoeld in [artikel 20c, eerste lid][ref1], geheel of gedeeltelijk niet
      kan worden genoten danwel dat de vakantie geheel of gedeeltelijk wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel20c
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel20f
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: 20c
        hoofdstuk: IIIa
  - number: 20f.2
    text: |-
      In de in het eerste lid bedoelde gevallen behoudt de leerkracht zijn aanspraak op het aantal door hem niet genoten
      vakantiedagen.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel20f
  - number: 20f.3
    text: |-
      In geval van intrekking van de vakantie als bedoeld in het eerste lid wordt een dag waarop de leerkracht
      dientengevolge slechts gedeeltelijk vakantie heeft genoten niet als een vakantiedag aangemerkt. Indien de
      leerkracht tengevolge van de intrekking van vakantie geldelijke schade lijdt, wordt deze schade hem vergoed.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel20f
  - number: 20f.4
    text: |-
      Een vakantie, welke ingevolge het eerste lid niet is genoten, of de vakantie, welke of het gedeelte van een
      vakantie, dat krachtens het eerste lid is ingetrokken, wordt zo spoedig mogelijk opnieuw verleend nadat de redenen,
      welke daartoe hebben geleid, hebben opgehouden te bestaan.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel20f
  - number: 20g
    text: |-
      Het bepaalde in [artikel 20][ref1] is van overeenkomstige toepassing op de nagelaten betrekkingen van een overleden
      leerkracht aan de politieopleidingsschool.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel20
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel20g
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '20'
        hoofdstuk: III
  - number: '26.1'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt aan de ambtenaar op zijn daartoe strekkend
      mondeling of schriftelijk verzoek door het bevoegd gezag vrijstelling van dienst wegens bijzondere omstandigheden,
      met behoud van vol inkomen, verleend:
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.1.I.a
    text: op de dag van zijn ondertrouw;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.1.I.b
    text: 'bij zijn huwelijk: vier werkdagen;'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.1.I.c
    text: op de dag van het huwelijk van bloed- en aanverwanten in de eerste, tweede en derde graad;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.1.I.d
    text: 'bij bevalling van zijn echtgenote: twee werkdagen;'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.1.I.e
    text: |-
      op de dag van zijn kerkelijke bevestiging en Eerste Heilige Communie en op die van zijn echtgenote, kinderen,
      stief- of pleegkinderen;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.1.I.f
    text: op de dag van zijn 10-, 20-, 30- en 40-jarig ambtsjubileum;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.1.I.g
    text: op de dag van herdenking van zijn 25- en 40-jarig huwelijks-jubileum;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.1.I.h
    text: |-
      op de dag van herdenking van het 25-, 40-, 50- en 60-jarig huwelijksjubileum van zijn ouders, stief-, schoon-,
      pleeg- of grootouders;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.1.I.i
    text: |-
      bij ernstige ziekte van zijn echtgenote, ouders, stief-, schoon- of pleegouders, kinderen, stief- of pleegkinderen:
      ten hoogste vijftien dagen; mocht blijken dat dit aantal in bepaalde omstandigheden niet toereikend is, dan kan
      [artikel 29][ref1] toepassing vinden;


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel29
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '29'
        hoofdstuk: V
  - number: 26.1.I.j
    text: |-
      bij overlijden van echtgenote, ouders, stief-, schoon- of pleegouders, kinderen, stief- of pleegkinderen: twee
      werkdagen;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.1.I.k
    text: 'bij overlijden van grootouders, huisgenoten en bloed- en aanverwanten tot en met de derde graad: één werkdag;'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.1.I.l
    text: op de dag vóór en op de dagen waarop een examen ter verkrijging van een wettelijk erkend diploma wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.1.II.a
    text: |-
      indien hij gehuwd is of een eigen huishouding heeft, bij verhuizing op het eiland waar hij zijn standplaats
      heeft; twee dagen, en in geval van verhuizing naar een ander eiland: twee dagen zowel vóór het vertrek naar als na
      aankomst op de nieuwe standplaats;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.1.II.b
    text: |-
      indien hij ongehuwd is en geen eigen huishouding heeft, bij verhuizing naar een ander eiland: één dag vóór het
      vertrek naar de nieuwe standplaats.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.1.III.a
    text: |-
      voor het bijwonen van vergaderingen of zittingen van of het verrichten van werkzaamheden voor publiekrechtelijke
      colleges of commissies, waarin de ambtenaar is benoemd of aangewezen, en voor zover zulks niet in vrije tijd kan
      geschieden;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.1.III.b
    text: |-
      voor het voldoen aan een wettelijke verplichting, een en ander voor zover dit niet in vrije tijd kan geschieden en
      omzetting van dienst niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: '26.2'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten wordt jaarlijks op de daartoe strekkend mondeling of
      schriftelijk verzoek van de ambtenaar door het bevoegd gezag ten hoogste vijftien dagen vrijstelling van dienst
      wegens bijzondere omstandigheden, met behoud van vol inkomen, verleend voor het bijwonen van vergaderingen van
      statutaire organen van verenigingen van ambtenaren, van centrale organisaties waarbij deze verenigingen zijn
      aangesloten of van internationale ambtenarenorganisaties, mits de ambtenaar hieraan deelneemt:
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.2.a
    text: |-
      voor zover betreft vergaderingen van verenigingen van ambtenaren als bestuurslid van die vereniging dan wel als
      afgevaardigde of bestuurslid van een onderdeel daarvan;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.2.b
    text: |-
      voor zover betreft vergaderingen van centrale organisaties waarbij verenigingen van ambtenaren zijn aangesloten,
      als bestuurslid van die centrale organisatie dan wel als afgevaardigde of bestuurslid van een bij die organisatie
      aangesloten vereniging van ambtenaren;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: 26.2.c
    text: |-
      voor zover betreft vergaderingen van een internationale ambtenarenorganisatie als bestuurslid van deze organisatie
      dan wel als afgevaardigde of bestuurslid van een bij die organisatie aangesloten vereniging van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel26
  - number: '27.1'
    text: |-
      De dagen gedurende welke de ambtenaar op grond van [artikel 43 van het Rechtspositiebesluit ambtenaren BES][ref1]
      de toegang tot de dienstlokalen, dienstgebouwen of het werk, dan wel het verblijf aldaar, is ontzegd, anders dan
      wegens hinderlijke gedragingen of het gebruik van alcoholhoudende drank, worden als vrijstelling van dienst wegens
      bijzondere omstandigheden, met behoud van vol inkomen, aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel43
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '43'
  - number: '27.2'
    text: |-
      De dagen gedurende welke het de ambtenaar op grond van
      [artikel 46 van het Rechtspositiebesluit ambtenaren BES][ref1] wegens besmettelijke ziekte van een persoon als in
      dat artikel bedoeld, verboden is aan de dienst deel te nemen, worden als vrijstelling van dienst wegens bijzondere
      omstandigheden, met behoud van vol inkomen, aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel46
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '46'
  - number: '29.1'
    text: |-
      Vrijstelling van dienst wegens bijzondere omstandigheden kan bovendien op daartoe strekkend schriftelijk verzoek
      van de ambtenaar worden verleend in de gevallen waarin het bevoegd gezag oordeelt dat daartoe aanleiding bestaat.
      Deze vrijstelling van dienst wordt verleend voor de duur van ten hoogste drie maanden en kan geheel of gedeeltelijk
      in het buitenland worden doorgebracht.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel29
  - number: '29.2'
    text: |-
      Indien de vrijstelling van dienst bedoeld in het eerste lid van dit artikel van langere duur is dan 15 dagen of
      voor geheel of gedeeltelijk verblijf in het buitenland wordt verleend, wordt deze bij beschikking van het bevoegde
      gezag verleend. Indien de vrijstelling bedoeld in het eerste lid niet van langere duur is dan 15 dagen noch voor
      geheel of gedeeltelijk verblijf in het buitenland wordt verleend, wordt deze door het bevoegd gezag verleend.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel29
  - number: '29.3'
    text: |-
      Gedurende de vrijstelling van dienst bedoeld in het eerste lid van dit artikel heeft de ambtenaar aanspraak op
      zijn bezoldiging, vermeerderd met de toelagen, die tot het ambtelijk inkomen worden gerekend voor de berekening
      van het pensioengevend inkomen gedurende de eerste maand en naar reden van vijftig ten honderd van zijn
      bezoldiging, vermeerderd met de toelagen, die tot het ambtelijk inkomen worden gerekend voor de berekening van het
      pensioengevend inkomen gedurende elk der volgende twee maanden.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel29
  - number: '29.4'
    text: |-
      De vrijstelling van dienst bedoeld in het eerste lid van dit artikel kan, voor zover deze is verleend voor een
      langere duur dan 30 dagen en indien dringende redenen van dienstbelang zulks vorderen, worden ingekort tot minimaal
      30 dagen, bij een met redenen omklede beschikking van het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel29
  - number: '29.5'
    text: |-
      Indien de ambtenaar tengevolge van de inkorting bedoeld in het voorgaande lid geldelijke schade lijdt, wordt deze
      schade hem vergoed.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel29
  - number: '29.6'
    text: |-
      Voor zover de vrijstelling van dienst bedoeld in het eerste lid van dit artikel verleend is voor een langere duur
      dan 15 dagen of voor geheel of gedeeltelijk verblijf in het buitenland geschiedt herstel in activiteit na eindiging
      van de vrijstelling van dienst bij beschikking van het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel29
  - number: '29.7'
    text: |-
      Tijdens de vrijstelling van dienst wegens bijzondere omstandigheden bedoeld in het eerste lid van dit artikel,
      ondergaat het inkomen van de ambtenaar dezelfde wijzigingen welke het zou hebben ondergaan indien deze vrijstelling
      van dienst niet zou zijn verleend.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel29
  - number: '30.1'
    text: |-
      Vrijstelling van dienst wegens bijzondere omstandigheden kan ook zonder behoud van inkomen op daartoe strekkend
      schriftelijk verzoek van de ambtenaar bij beschikking van het bevoegde gezag worden verleend in de gevallen waarin
      dit gezag oordeelt dat daartoe aanleiding bestaat. Deze vrijstelling van dienst wordt verleend voor de duur van ten
      hoogste vijf jaren en kan geheel of gedeeltelijk in het buitenland worden doorgebracht.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel30
  - number: '30.2'
    text: |-
      De vrijstelling van dienst bedoeld in het eerste lid van dit artikel kan, voor zover deze is verleend voor een
      langere duur dan drie maanden en indien dringende redenen van dienstbelang zulks vorderen, worden ingekort tot
      minimaal drie maanden bij een met redenen omklede beschikking van het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel30
  - number: '30.3'
    text: |-
      Indien de ambtenaar tengevolge van de inkorting bedoeld in het voorgaande lid geldelijke schade lijdt, wordt deze
      schade hem vergoed.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel30
  - number: '30.4'
    text: |-
      Herstel in activiteit na eindiging van de vrijstelling van dienst bedoeld in het eerste lid geschiedt bij
      beschikking van het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel30
  - number: '31.1'
    text: |-
      De ambtenaar die wegens ziekte verhinderd is zijn dienst uit te oefenen, heeft tot herstel van zijn gezondheid
      aanspraak op vrijstelling van dienst wegens ziekte.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31
  - number: '31.2'
    text: |-
      De duur van een vrijstelling van dienst wegens ziekte, verlenging daarvan inbegrepen, is ten hoogste vier jaren
      voor een ambtenaar in vaste dienst en ten hoogste een jaar voor een ambtenaar in tijdelijke dienst.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31
  - number: '31.3'
    text: |-
      De aanvankelijke duur van een vrijstelling van dienst wegens ziekte wordt gesteld op ten hoogste zes maanden.
      Deze termijn kan met inachtneming van het bepaalde in het vorige lid, telkens met ten hoogste zes maanden worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31
  - number: '31.4'
    text: 'Gedurende een vrijstelling van dienst wegens ziekte heeft de ambtenaar aanspraak op een inkomen naar reden van:'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31
  - number: 31.4.I
    text: 'Voor een ambtenaar in vaste dienst:'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31
  - number: 31.4.I.a
    text: zijn vol inkomen gedurende de eerste vierentwintig maanden;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31
  - number: 31.4.I.b
    text: negentig ten honderd van zijn vol inkomen gedurende de daaropvolgende twaalf maanden;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31
  - number: 31.4.I.c
    text: tachtig ten honderd van zijn vol inkomen gedurende de resterende maanden.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31
  - number: 31.4.II
    text: voor een ambtenaar in tijdelijke dienst zijn vol inkomen.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31
  - number: '31.5'
    text: |-
      Ingeval de vrijstelling van dienst wegens ziekte langer duurt dan dertig dagen, worden voor de toepassing van
      het vierde lid, in afwijking van [artikel 4][ref1], de bijzondere individuele vergoedingen welke strekken tot
      vergoeding van onkosten na die eerste dertig dagen niet langer tot het inkomen gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel4
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '4'
        hoofdstuk: I
  - number: '31.6'
    text: |-
      Gedurende een vrijstelling van dienst wegens ziekte heeft de ambtenaar gedurende de eerste
      dertig dagen voorts aanspraak op de vergoeding die hij ingevolge [artikel 25a][ref1] of
      [25b van het Rechtspositiebesluit ambtenaren BES][ref2] genoten zou hebben, indien hij niet door ziekte verhinderd
      zou zijn geweest zijn dienst te verrichten. Na die eerste dertig dagen heeft hij aanspraak op een vergoeding ter
      grootte van de gemiddeld over de voorgaande twaalf maanden genoten vergoeding ingevolge [artikel 25a][ref3] of
      [25b van het Rechtspositiebesluit ambtenaren BES][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel25b
      [ref3]: https://wetten.overheid.nl/BWBR0028693#Artikel25a
      [ref4]: https://wetten.overheid.nl/BWBR0028693#Artikel25b
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 25a
      - id: ref2
        bwb_id: BWBR0028693
        artikel: 25b
      - id: ref3
        bwb_id: BWBR0028693
        artikel: 25a
      - id: ref4
        bwb_id: BWBR0028693
        artikel: 25b
  - number: '31.7'
    text: |-
      Een opnieuw ingetreden verhindering tot dienstverrichting wegens ziekte wordt voor het bepalen van de in het tweede
      en vierde lid genoemde termijnen als een voortzetting van de vorige verhindering beschouwd, tenzij die verhindering
      zich voordoet, nadat tenminste dertig kalenderdagen zijn verstreken sedert de ambtenaar zijn dienst volledig heeft
      hervat.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31
  - number: '31.8'
    text: |-
      Het inkomen bedoeld onder lid 4, letters b en c, wordt naar boven afgerond tot het naaste bedrag in gehele dollars
      dat een veelvoud is van twaalf.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31
  - number: '31.9'
    text: |-
      Tijdens de vrijstelling van dienst wegens ziekte ondergaat het inkomen van de ambtenaar dezelfde wijzigingen, welke
      het zou hebben ondergaan indien de ambtenaar niet verhinderd zou zijn geweest zijn dienst uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31
  - number: 31a
    text: 'Geen aanspraak op doorbetaling van inkomen bestaat:'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31a
  - number: 31a.a
    text: |-
      indien de ziekte is voorgewend althans zodanig overdreven voorgesteld, dat verhindering tot dienstverrichting niet
      kan worden aangenomen;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31a
  - number: 31a.b
    text: |-
      indien de ambtenaar de verhindering tot dienstverrichting opzettelijk heeft veroorzaakt, tenzij hem daarvan op
      grond van zijn psychische toestand geen verwijt kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31a
  - number: 31a.c
    text: |-
      indien het ziekteverzuim is veroorzaakt door of het gevolg is van een kwaal of lichaamsgebrek, waarover de
      ambtenaar bij of vóór zijn indiensttreding opzettelijk het stilzwijgen heeft bewaard of waaromtrent hij opzettelijk
      valse inlichtingen heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31a
  - number: 31b.1
    text: 'De doorbetaling van inkomen wordt gestaakt, wanneer en voor zolang de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31b
  - number: 31b.1.a
    text: |-
      weigert zich te onderwerpen aan een geneeskundig onderzoek vanwege de dienst of, na voor zulk een onderzoek te zijn
      opgeroepen, zonder geldige reden niet verschijnt;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31b
  - number: 31b.1.b
    text: |-
      zonder voldoende gronden nalaat zich onder geneeskundige behandeling te stellen of te blijven stellen, dan wel zich
      niet houdt aan de voorschriften hem door de behandelende geneeskundige gegeven, met dien verstande dat te dezen
      voorschriften tot het verlenen van medewerking aan een ingreep van heelkundige aard zijn uitgezonderd;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31b
  - number: 31b.1.c
    text: zich zodanig gedraagt, dat zijn genezing wordt belemmerd of vertraagd;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31b
  - number: 31b.1.d
    text: |-
      tijdens de verhindering om dienst te verrichten voor zichzelf of voor derden arbeid verricht, tenzij dit door
      de geneeskundige of geneeskundigen, bedoeld in [artikel 33, vierde lid][ref1], in het belang van zijn genezing
      wenselijk wordt geacht;


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel33
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '33'
        hoofdstuk: VI
  - number: 31b.1.e
    text: |-
      in gebreke blijft op het door de geneeskundige of geneeskundigen, bedoeld in [artikel 33, vierde lid][ref1],
      bepaalde tijdstip en in de door bedoelde geneeskundige(n) bepaalde mate zijn dienst te hervatten, tenzij hij
      daarvoor een inmiddels opgekomen, door bedoelde geneeskundige(n) als geldig erkende reden heeft opgegeven. De in
      dit lid bedoelde aanspraak vervalt met ingang van de dag waarop de reden daarvoor voor het eerst aanwezig was.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel33
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '33'
        hoofdstuk: VI
  - number: 31b.2
    text: |-
      De doorbetaling van inkomen kan geheel of ten dele worden gestaakt, indien de ambtenaar de controle-voorschriften
      overtreedt, die zijn vastgesteld:
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31b
  - number: 31b.2.a
    text: bij ministeriële regeling voor ambtenaren in dienst van de Staat;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31b
  - number: 31b.2.b
    text: bij eilandsbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31b
  - number: 31c
    text: |-
      In de gevallen bedoeld in de [artikelen 31A][ref1] en [31B][ref2] kan het bevoegde gezag op grond van bijzondere
      omstandigheden bepalen, dat het bedrag van het ingehouden inkomen geheel of ten dele aan anderen dan aan de
      ambtenaar zal worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel31a
      [ref2]: https://wetten.overheid.nl/BWBR0028606#Artikel31b
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel31c
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: 31a
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0028606
        artikel: 31b
        hoofdstuk: VI
  - number: '32.1'
    text: |-
      Vrijstelling van dienst wegens ziekte wordt door het bevoegd gezag verleend. Deze vrijstelling van dienst kan,
      onverminderd het bepaalde in [artikel 34][ref1], met schriftelijke toestemming van het bevoegde gezag geheel of
      gedeeltelijk in het buitenland worden doorgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel34
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '34'
        hoofdstuk: VI
  - number: '32.2'
    text: |-
      Indien de vrijstelling van dienst bedoeld in het eerste lid van dit artikel van langere duur is dan dertig dagen of
      voor verblijf in het buitenland wordt verleend, wordt deze bij beschikking van het bevoegde gezag verleend. Indien
      de vrijstelling van dienst bedoeld in het eerste lid niet van langere duur is dan dertig dagen noch voor verblijf
      in het buitenland wordt verleend, wordt deze door het bevoegd gezag verleend.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel32
  - number: '33.1'
    text: |-
      De ambtenaar die wegens ziekte verhinderd is zijn dienst uit te oefenen, geeft daarvan onverwijld kennis aan het
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel33
  - number: '33.2'
    text: |-
      Het bevoegd gezag kan van de ambtenaar overlegging van een geneeskundige verklaring vorderen of hem door een
      geneeskundige laten onderzoeken.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel33
  - number: '33.3'
    text: |-
      Ter verkrijging van een vrijstelling van dienst wegens ziekte van meer dan drie achtereenvolgende dagen, is
      overlegging van een geneeskundige verklaring door de ambtenaar verplicht.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel33
  - number: '33.4'
    text: |-
      Vrijstelling van dienst wegens ziekte van meer dan dertig dagen of verlenging daarvan waardoor deze vrijstelling
      van dienst van langere duur wordt dan dertig dagen, wordt door het bevoegde gezag slechts verleend indien uit een
      schriftelijke verklaring, afgegeven door één of meerdere door de overheid aangewezen geneeskundigen, blijkt dat de
      betrokken ambtenaar wegens ziekte verhinderd is zijn dienst uit te oefenen. In de door deze geneeskundige afgegeven
      verklaring wordt, met inachtneming van het gestelde in [artikel 31, derde lid][ref1], het tijdvak aangegeven waarin
      de ambtenaar vermoedelijk zijn dienst niet zal kunnen uitoefenen. Indien verblijf in het buitenland noodzakelijk
      blijkt, wordt tevens hiervan, met vermelding van de plaats van verblijf en de wijze waarop de reis moet worden
      volbracht, mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel31
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '31'
        hoofdstuk: VI
  - number: '33.5'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel33
  - number: '33.6'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel33
  - number: '34'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel34
  - number: '35.1'
    text: |-
      Van een uitspraak krachtens [artikel 33, vierde lid][ref1] of krachtens [artikel 36, eerste lid][ref2], staat,
      binnen 30 dagen nadat de ambtenaar van de uitspraak schriftelijk in kennis is gesteld, beroep open bij een
      herkeuringscommissie, bestaande uit tenminste drie geneeskundigen. Een van deze geneeskundigen wordt aangewezen
      door de betrokken ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0028606#Artikel36
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '33'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0028606
        artikel: '36'
        hoofdstuk: VI
  - number: '35.2'
    text: |-
      Het krachtens het eerste lid in te dienen beroepschrift wordt aangeboden aan het bevoegd gezag dat ingevolge het
      vierde lid de herkeuringscommissie moet benoemen. Het beroepschrift vermeldt tevens de naam en het adres van de
      geneeskundige die door de betrokken ambtenaar voor benoeming in de herkeuringscommissie is aangewezen.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35
  - number: '35.3'
    text: |-
      De leden van de herkeuringscommissie mogen niet bij een uitspraak, bedoeld in het eerste lid van dit artikel,
      betrokken zijn geweest.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35
  - number: '35.4'
    text: 'De leden van de herkeuringscommissie worden benoemd:'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35
  - number: 35.4.a
    text: door het bevoegde gezag, indien de ambtenaar zich in de openbare lichamen bevindt;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35
  - number: 35.4.b
    text: |-
      door of vanwege Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties indien de ambtenaar zich buiten de
      openbare lichamen bevindt;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35
  - number: 35.4.c
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35
  - number: 35a.1
    text: 'De ambtenaar kan aan een geneeskundig onderzoek vanwege de dienst worden onderworpen ter beoordeling van de vraag:'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35a
  - number: 35a.1.a
    text: of er sprake is van verhindering tot dienstverrichting wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35a
  - number: 35a.1.b
    text: |-
      of zich een omstandigheid voordoet, als bedoeld in [artikel 31A][ref1] of in
      [artikel 31B eerste lid, onder b of c][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel31a
      [ref2]: https://wetten.overheid.nl/BWBR0028606#Artikel31b
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: 31a
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0028606
        artikel: 31b
        hoofdstuk: VI
  - number: 35a.1.c
    text: of verdere maatregelen in het belang van het herstel nodig zijn;
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35a
  - number: 35a.1.d
    text: wanneer en in welke mate de dienst kan worden hervat.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35a
  - number: 35a.2
    text: |-
      De vanwege de dienst optredende geneeskundige deelt het oordeel terstond mede aan de ambtenaar en stelt het gezag
      dat het onderzoek aanvroeg, daarvan zo spoedig mogelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35a
  - number: 35b.1
    text: |-
      De ambtenaar, die zich met het oordeel van de in [artikel 35A, tweede lid][ref1], bedoelde geneeskundige, niet
      kan verenigen, kan hiervan, mits binnen de kortst mogelijke tijd, doch in ieder geval binnen 3 maal 24 uur nadat
      dit oordeel te zijner kennis is gebracht, onder opgave van redenen aan het gezag dat het onderzoek aanvroeg,
      schriftelijk mededeling doen. Hij kan ter ondersteuning van zijn bezwaar een verklaring overleggen van een
      geneeskundige, die alsdan door de in het tweede lid bedoelde commissie in de gelegenheid wordt gesteld tot het
      geven van een nadere mondelinge toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel35a
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: 35a
        hoofdstuk: VI
  - number: 35b.2
    text: |-
      Behalve indien, na overleg met de geneeskundige, bedoeld in het [tweede lid van artikel 35A][ref1], door het gezag
      dat het onderzoek aanvroeg, het bezwaar van de ambtenaar reeds aanstonds voldoende gegrond wordt geacht, wordt
      binnen 14 dagen na ontvangst van het bezwaarschrift door een commissie van geneeskundigen – waarin geen zitting
      zal mogen hebben de in artikel 35A, tweede lid, bedoelde geneeskundige – een hernieuwd onderzoek ingesteld. De
      commissie deelt haar oordeel zo spoedig mogelijk mede aan het bevoegde gezag, dat vervolgens de ambtenaar daarvan
      in kennis stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel35a
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: 35a
        hoofdstuk: VI
  - number: 35b.3
    text: De kosten van het hernieuwde onderzoek komen voor rekening van de overheid.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel35b
  - number: '36.1'
    text: |-
      De ambtenaar aan wie vrijstelling van dienst wegens ziekte is verleend van drie maanden of meer, mag de
      uitoefening van zijn dienst niet hervatten, dan nadat uit een verklaring van de geneeskundige(n), bedoeld in
      [artikel 33, vierde lid][ref1], blijkt, dat de betrokken ambtenaar is onderzocht en in staat is bevonden tot
      hervatting van zijn dienstuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel33
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '33'
        hoofdstuk: VI
  - number: '36.2'
    text: |-
      De ambtenaar die aan het einde van een tot de maximumduur genoemd in [artikel 31][ref1] verlengde vrijstelling van
      dienst wegens ziekte volgens een verklaring afgegeven door de geneeskundige(n), bedoeld in het eerste lid, niet
      geschikt is bevonden om zijn dienstuitoefening te hervatten, wordt, behoudens het bepaalde in het volgende lid,
      eervol ontslag uit de overheidsdienst verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel31
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '31'
        hoofdstuk: VI
  - number: '36.3'
    text: |-
      Indien de geneeskundige(n), bedoeld in het eerste lid, van oordeel is dat hervatting van de dienstuitoefening door
      de betrokken ambtenaar niet mogelijk is wegens een opgekomen ziekte van voorbijgaande aard, wordt hem voor de duur
      van die ziekte vrijstelling van dienst wegens bijzondere omstandigheden met behoud van zeventig ten honderd van
      zijn vol inkomen verleend.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel36
  - number: '37'
    text: |-
      Na eindiging van een vrijstelling van dienst wegens ziekte van meer dan dertig dagen of van een vrijstelling
      van dienst wegens ziekte voor verblijf in het buitenland, is herstel in activiteit bij beschikking vereist. Deze
      inactiviteitherstelling geschiedt door het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel37
  - number: 37a.1
    text: De ambtenaar heeft in verband met haar bevalling aanspraak op zwangerschaps- en bevallingsverlof.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel37a
  - number: 37a.2
    text: |-
      De ambtenaar heeft recht op zwangerschapsverlof vanaf de dag waarop de bevalling blijkens een schriftelijke
      verklaring van een genees- of verloskundige waarin de vermoedelijke datum van de bevalling wordt aangegeven, binnen
      zes weken te verwachten is. Het verlof begint in ieder geval twee weken vóór deze datum.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel37a
  - number: 37a.3
    text: |-
      De ambtenaar heeft recht op bevallingsverlof van zes weken vanaf de dag volgend op die van de bevalling. Dit
      verlof wordt verlengd tot ten hoogste twaalf weken, voor zover het zwangerschapsverlof minder dan zes weken heeft
      bedragen.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel37a
  - number: 37a.4
    text: |-
      Het verlof, bedoeld in het tweede en derde lid, wordt voor de toepassing van dit besluit gelijkgesteld met
      verhindering tot dienstverrichting wegens ziekte.
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel37a
  - number: '38'
    text: 'Dit besluit wordt aangehaald als: Besluit vakantie en vrijstelling van dienst ambtenaren BES.'
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel38
  - number: '39'
    text: |-
      Dit besluit berust op [artikel 43 van de Ambtenarenwet BES][ref1] en
      [artikel 21, tweede lid, onder a, van de Veiligheidswet BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0028586#Artikel21
    url: https://wetten.overheid.nl/BWBR0028606/2017-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0028586
        artikel: '21'
