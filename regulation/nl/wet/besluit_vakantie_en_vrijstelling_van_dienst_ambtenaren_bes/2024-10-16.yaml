  - number: '2.1'
    text: |-
      Dit besluit is niet van toepassing op de ambtenaar van politie, bedoeld in
      [artikel 1, onderdeel c, van het Besluit rechtspositie korps politie BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel1
    url: https://wetten.overheid.nl/BWBR0028606/2024-10-16#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028767
        artikel: '1'
  - number: '2.2'
    text: |-
      Voor de toepassing van [hoofdstuk II][ref1] van dit besluit worden niet als ambtenaar beschouwd:


      [ref1]: https://wetten.overheid.nl/BWBR0028606#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0028606/2024-10-16#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028606
        hoofdstuk: II
  - number: 2.2.a
    text: |-
      het onderwijzend personeel bij het van overheidswege gegeven openbaar onderwijs. Onder onderwijzend personeel wordt
      mede begrepen de amanuensis werkzaam bij het van overheidswege gegeven openbaar onderwijs;
    url: https://wetten.overheid.nl/BWBR0028606/2024-10-16#Artikel2
  - number: 2.2.b
    text: de met volledige dagtaak aan een politieopleidingschool verbonden leerkracht.
    url: https://wetten.overheid.nl/BWBR0028606/2024-10-16#Artikel2
  - number: '3'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028606/2024-10-16#Artikel3
  - number: '4.1'
    text: |-
      Voor de toepassing van dit besluit en de uit kracht daarvan gegeven voorschriften wordt verstaan onder: - *bevoegd
      gezag:* a. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, voor wat betreft hoofden van dienst in
      dienst van de staat; b. het bestuurscollege, voor wat betreft de hoofden van dienst in dienst van een openbaar
      lichaam; c. de Rijksvertegenwoordiger, voor wat betreft het personeel van het Bureau van de Rijksvertegenwoordiger;
      d. het hoofd van de dienst voor wat betreft de bij zijn dienst werkzaam gestelde ambtenaren.
        - *hoofd van dienst:* de bij besluit van het bevoegd gezag als zodanig aangewezen ambtenaren.
        - *gezin:* a. de echtgenoot of echtgenote van de betrokken ambtenaar; b. de kinderen tot wie de betrokken ambtenaar
      in familierechtelijke betrekking staat die de leeftijd van 21 jaar nog niet hebben bereikt en niet gehuwd zijn
      of gehuwd geweest zijn, de stief- en pleegkinderen van de betrokken ambtenaar die de leeftijd van 21 jaar nog
      niet hebben bereikt en niet gehuwd zijn of gehuwd geweest zijn, de laatsten voor zover de betrokken ambtenaar
      ten behoeve van deze pleegkinderen kindertoelage geniet; c. de overige kinderen tot wie de betrokken ambtenaar in
      familie-rechtelijke betrekking staat, de overige stief- en pleegkinderen van de betrokken ambtenaar, voor zover de
      betrokken ambtenaar ten behoeve van deze kinderen kindertoelage geniet;
        - *inkomen:* de bezoldiging van de ambtenaar, vermeerderd met de vakantie-uitkering, bedoeld in
      [artikel 36a van het Rechtspositiebesluit ambtenaren BES][ref1], de eindejaarsuitkering, bedoeld in
      [artikel 9a van het Bezoldigingsbesluit 1998 BES][ref2] of een daarmee vergelijkbare bepaling, een eventuele
      kindertoelage, de bijzondere individuele vergoedingen en de verhogingen en persoonlijke toelagen met een periodiek
      karakter welke op grond van een organieke regeling van de bezoldiging worden genoten.
        - *arbeidsduurfactor:* een breuk waarvan de teller bestaat uit het aantal uren van de voor die ambtenaar geldende
      werktijd en de noemer uit 36.
        - *bezoldiging per uur:* 1/150 deel van de bezoldiging per maand bij een volledige betrekking.
        - *levensfaseverlof:* levensfaseverlof, bedoeld in [artikel 8b][ref3].
        - *vakantie-uren:* uren waarop op grond van [artikel 5][ref4] aanspraak op vakantie bestaat.
        - *Sectorale Overlegcommissie BES:* de Sectorale Overlegcommissie Bonaire, Sint Eustatius en Saba, genoemd in
      [artikel 2.1, eerste lid, van het Besluit overlegstelsel BES][ref5]. Voor het onderwijzend personeel bij het
      van overheidswege gegeven openbare onderwijs wordt mede als inkomen aangemerkt de aan dit personeel op grond van
      geldende wettelijke regelingen toegekende vaste toelagen. Voor de berekening van de vakantie-uitkering bedoeld in
      [hoofdstuk IV][ref6] wordt de compensatietoeslag hiervoor bedoeld niet als deel van het inkomen aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel36a
      [ref2]: https://wetten.overheid.nl/BWBR0028491#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0028606#Artikel8b
      [ref4]: https://wetten.overheid.nl/BWBR0028606#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0028779#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0028606#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0028606/2024-10-16#Artikel4
