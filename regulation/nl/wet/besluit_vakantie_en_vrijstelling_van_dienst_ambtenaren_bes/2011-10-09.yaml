  - number: '7'
    text: |-
      1 De in dit hoofdstuk bedoelde vakantie kan wegens dringende redenen van dienstbelang geheel of gedeeltelijk worden
      geweigerd of ingetrokken bij gemotiveerde beschikking van de bevoegde autoriteit.

      2 Indien de vakantie krachtens het vorige lid geheel of gedeeltelijk is geweigerd of ingetrokken behoudt de
      ambtenaar zijn aanspraak op het aantal door hem niet genoten vakantieuren. Weigering of intrekking kan voor
      ten hoogste 12 maanden uitstel van de desbetreffende vakantie tot gevolg hebben. Behalve in het geval dat de
      dienstverhouding tot de overheid wegens ontslag eindigt, kan aan de ambtenaar in enig kalenderjaar nimmer een
      langere vakantie worden verleend dan tweemaal het hem volgens [artikel 8][ref1] toekomende aantal vakantieuren.

      3 In geval van intrekking van de vakantie zoals bedoeld in het voorgaande lid wordt, indien de ambtenaar als gevolg
      daarvan van de hem op een bepaalde dag toegekende vakantieuren er een deel niet heeft kunnen genieten, geen van
      de op die dag vallende vakantieuren als zodanig aangemerkt. Indien de ambtenaar tengevolge van de intrekking van
      vakantie geldelijke schade lijdt, wordt deze schade hem vergoed. In het geval de ambtenaar zijn vakantie doorbrengt
      buiten het eiland waar hij werkzaam is, wordt hem, indien hij op het tijdstip waarop hij zijn werkzaamheden hervat
      minder dan 3/4 gedeelte van het aantal vakantieuren dat hij buiten het eiland waar hij werkzaam is zou doorbrengen
      heeft genoten, bovendien vergoed de door hem voor zich en zijn gezin gemaakte reiskosten naar de plaats waar hij
      op het tijdstip van de intrekking met vakantie vertoeft, vermeerderd met een vergoeding van de door hem gemaakte
      kosten van een rechtstreekse reis van die plaats naar het eiland waar hij werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel8
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel7
    references:
      - id: ref1
