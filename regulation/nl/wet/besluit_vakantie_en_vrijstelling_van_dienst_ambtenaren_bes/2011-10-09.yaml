  - number: '13'
    text: |-
      Het bepaalde in het [vorige artikel][ref1] is van overeenkomstige toepassing op:

      a. de ambtenaar in dienst van de Staat die in dienst van een openbaar lichaam overgaat;

      b. de ambtenaar in dienst van een openbaar lichaam die in dienst van de Staat n overgaat;

      c. de ambtenaar in dienst van een openbaar lichaam die in dienst van een ander openbaar lichaam overgaat;

      d. degene die werkzaam is bij een publiekrechtelijke instelling, dan wel bij een door de overheid in het leven
      geroepen privaatrechtelijke rechtspersoon en die in dienst van de Staat of een openbaar lichaam overgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel12
