        hoofdstuk: II
  - number: '11'
    text: |-
      1 Onverminderd het bepaalde in de [leden 2, 3, 4 en 5 van artikel 5][ref1] heeft de ambtenaar gedurende de eerste
      zes maanden na aanvaarding van zijn ambt slechts aanspraak op vakantie naar reden van 1/12 gedeelte van het in
      [artikel 8][ref2] vastgestelde aantal vakantieuren voor de categorie waartoe hij behoort en wel voor iedere volle
      kalendermaand, dat hij in genoemd tijdvak werkelijke dienst heeft vervuld.

      2 Het aantal uren, waarop ingevolge het voorgaande lid aanspraak op vakantie bestaat, wordt zo nodig naar beneden
      afgerond op hele uren.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel5
