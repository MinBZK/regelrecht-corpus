  - number: '32'
    text: |-
      1 Vrijstelling van dienst wegens ziekte wordt door het in het tweede lid bedoelde gezag of de in dat lid bedoelde
      autoriteit verleend. Deze vrijstelling van dienst kan, onverminderd het bepaalde in [artikel 34][ref1], met
      schriftelijke toestemming van het bevoegde gezag geheel of gedeeltelijk in het buitenland worden doorgebracht.

      2 Indien de vrijstelling van dienst bedoeld in het eerste lid van dit artikel van langere duur is dan dertig dagen
      of voor verblijf in het buitenland wordt verleend, wordt deze bij beschikking van het bevoegde gezag verleend.

      Indien de vrijstelling van dienst bedoeld in het eerste lid niet van langere duur is dan dertig dagen noch voor
      verblijf in het buitenland wordt verleend, wordt deze door de bevoegde autoriteit verleend.


