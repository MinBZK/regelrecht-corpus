        bwb_id: BWBR0028606
        artikel: '20'
        hoofdstuk: III
  - number: '21'
    text: |-
      De ambtenaar heeft aanspraak op een vakantie-uitkering voor elke kalendermaand, waarin hij als zodanig ten laste
      van de overheid inkomen heeft genoten.
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel21
  - number: '22'
    text: |-
      De vakantie-uitkering bedraagt voor elke daarvoor in aanmerking komende kalendermaand zeven ten honderd van het
      inkomen, voor de ambtenaar geldende op de eerste april van het jaar van uitbetaling, dan wel, bij indiensttreding
      in de loop van de maand april of de maand mei van dat jaar, op de datum van indiensttreding.
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel22
  - number: '23'
    text: |-
      1 [Artikel 21][ref1] is niet van toepassing ten aanzien van een kalendermaand:

      a. waarin de ambtenaar minder dan 15 dagen in dienstverhouding tot de overheid heeft gestaan;

      b. waarin de ambtenaar tengevolge van aan hem verleende vrijstelling van dienst wegens bijzondere omstandigheden
      voor langer dan 15 dagen geen of gedeeltelijk inkomen ten laste van de overheid heeft genoten;

      c. waarin de ambtenaar over meer dan 15 dagen tengevolge van aan hem opgelegde disciplinaire straf of schorsing
      geen of gedeeltelijk inkomen ten laste van de overheid heeft genoten;

      d. waarin de ambtenaar over meer dan 15 dagen gedurende welke hij in strijd met zijn verplichtingen opzettelijk
      heeft nagelaten zijn dienst te verrichten, geen inkomen ten laste van de overheid heeft genoten.

      2 Ten aanzien van de ambtenaar voor wie de geldende werktijd korter is dan de gebruikelijke volledige werktijd
      wordt het getal 15, voorkomend in het voorgaande lid, telkens vermenigvuldigd met een breuk waarvan de teller
      bestaat uit het aantal uren van de voor die ambtenaar geldende werktijd en de noemer uit het aantal uren van de
      voor zijn functie geldende gebruikelijke volledige werktijd.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel21
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '21'
        hoofdstuk: IV
  - number: '24'
    text: |-
      1 De vakantie-uitkering wordt eenmaal per kalenderjaar, in de tweede helft van de maand juni, uitbetaald over de
      periode van twaalf maanden aangevangen met de maand juni van het voorafgegane kalenderjaar.

      2 In afwijking van het bepaalde in het eerste lid vindt de uitbetaling van de vakantie-uitkering ook plaats bij
      ontslag of overlijden van de ambtenaar – tenzij het ontslag zonder onderbreking door een andere benoeming als
      ambtenaar bij dezelfde overheid wordt gevolgd – en wel over het tijdvak, gelegen tussen het einde van de laatst
      verstreken periode waarover vakantie-uitkering werd uitbetaald en de datum van het ontslag of het overlijden.

      3 Bij overlijden van de ambtenaar geschiedt de uitbetaling van de vakantie-uitkering aan de weduwe of weduwnaar.

      4 Indien de overledene geen weduwe of weduwnaar nalaat, geschiedt de uitbetaling ten behoeve van de kinderen tot
      wie de overledene in familierechtelijke betrekking stond die de leeftijd van 21 jaar nog niet hebben bereikt en
      niet gehuwd zijn of gehuwd geweest zijn. Ontbreken ook zodanige kinderen, dan geschiedt de uitbetaling, indien de
      overledene kostwinner was van ouders, broeders, zusters, overige kinderen of stiefkinderen, ten behoeve van deze
      betrekkingen.

      5 Laat de overledene ook geen betrekkingen, als bedoeld in het vierde lid na, dan wordt de vakantie-uitkering
      geheel of ten dele aangewend voor de betaling van de kosten van de laatste ziekte en van de lijkbezorging.

      6 Bij toepassing van het tweede lid wordt het tijdstip van [artikel 22][ref1] vervangen door de datum, voorafgaande
      aan die van ingang van het ontslag of aan die van het overlijden.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel22
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '22'
        hoofdstuk: IV
  - number: '25'
    text: |-
      Ter uitvoering van het bepaalde in dit hoofdstuk kunnen nadere voorschriften worden vastgesteld:

      a. bij ministeriële regeling voor ambtenaren in dienst van de Staat;

      b. bij eilandsbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel25
  - number: '26'
    text: |-
      1 Tenzij de belangen van de dienst zich daartegen verzetten, wordt aan de ambtenaar op zijn daartoe strekkend
      mondeling of schriftelijk verzoek door de bevoegde autoriteit vrijstelling van dienst wegens bijzondere
      omstandigheden, met behoud van vol inkomen, verleend:

      I. a. op de dag van zijn ondertrouw;

      b. bij zijn huwelijk: vier werkdagen;

      c. op de dag van het huwelijk van bloed- en aanverwanten in de eerste, tweede en derde graad;

      d. bij bevalling van zijn echtgenote: twee werkdagen;

      e. op de dag van zijn kerkelijke bevestiging en Eerste Heilige Communie en op die van zijn echtgenote, kinderen,
      stief- of pleegkinderen;

      f. op de dag van herdenking van zijn 25-, 30-, 35- en 40-jarig ambtsjubileum;

      g. op de dag van herdenking van zijn 25- en 40-jarig huwelijks-jubileum;

      h. op de dag van herdenking van het 25-, 40-, 50- en 60-jarig huwelijksjubileum van zijn ouders, stief-, schoon-,
      pleeg- of grootouders;

      i. bij ernstige ziekte van zijn echtgenote, ouders, stief-, schoon- of pleegouders, kinderen, stief- of
      pleegkinderen: ten hoogste vijftien dagen; mocht blijken dat dit aantal in bepaalde omstandigheden niet toereikend
      is, dan kan [artikel 29][ref1] toepassing vinden;

      j. bij overlijden van echtgenote, ouders, stief-, schoon- of pleegouders, kinderen, stief- of pleegkinderen: twee
      werkdagen;

      k. bij overlijden van grootouders, huisgenoten en bloed- en aanverwanten tot en met de derde graad: één werkdag;

      l. op de dag vóór en op de dagen waarop een examen ter verkrijging van een wettelijk erkend diploma wordt afgelegd.

      II. a. indien hij gehuwd is of een eigen huishouding heeft, bij verhuizing op het eiland waar hij zijn standplaats
      heeft; twee dagen, en in geval van verhuizing naar een ander eiland: twee dagen zowel vóór het vertrek naar als na
      aankomst op de nieuwe standplaats;

      b. indien hij ongehuwd is en geen eigen huishouding heeft, bij verhuizing naar een ander eiland: één dag vóór het
      vertrek naar de nieuwe standplaats.

      III. a. voor het bijwonen van vergaderingen of zittingen van of het verrichten van werkzaamheden voor
      publiekrechtelijke colleges of commissies, waarin de ambtenaar is benoemd of aangewezen, en voor zover zulks niet
      in vrije tijd kan geschieden;

      b. voor het voldoen aan een wettelijke verplichting, een en ander voor zover dit niet in vrije tijd kan geschieden
      en omzetting van dienst niet mogelijk is.

      2 Tenzij de belangen van de dienst zich daartegen verzetten wordt jaarlijks op de daartoe strekkend mondeling
      of schriftelijk verzoek van de ambtenaar door de bevoegde autoriteit ten hoogste vijftien dagen vrijstelling van
      dienst wegens bijzondere omstandigheden, met behoud van vol inkomen, verleend voor het bijwonen van vergaderingen
      van statutaire organen van verenigingen van ambtenaren, van centrale organisaties waarbij deze verenigingen zijn
      aangesloten of van internationale ambtenarenorganisaties, mits de ambtenaar hieraan deelneemt:

      a. voor zover betreft vergaderingen van verenigingen van ambtenaren als bestuurslid van die vereniging dan wel als
      afgevaardigde of bestuurslid van een onderdeel daarvan;

      b. voor zover betreft vergaderingen van centrale organisaties waarbij verenigingen van ambtenaren zijn aangesloten,
      als bestuurslid van die centrale organisatie dan wel als afgevaardigde of bestuurslid van een bij die organisatie
      aangesloten vereniging van ambtenaren;

      c. voor zover betreft vergaderingen van een internationale ambtenarenorganisatie als bestuurslid van deze
      organisatie dan wel als afgevaardigde of bestuurslid van een bij die organisatie aangesloten vereniging van
      ambtenaren.

      De vrijstelling van dienst wegens bijzondere omstandigheden in de vorige zin bedoeld, wordt slechts verleend
      aan ambtenaren, die lid zijn van verenigingen van ambtenaren, welke zijn vertegenwoordigd in een Commissie voor
      Georganiseerd Overleg in Ambtenarenzaken, of van verenigingen van onderwijzend personeel, die het personeel van
      het bijzonder, uit de openbare kas bekostigde onderwijs mede omvatten, en naar het oordeel van Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties ten minste voor het onderwijzend personeel van het openbaar onderwijs
      voldoende representatief zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel29
