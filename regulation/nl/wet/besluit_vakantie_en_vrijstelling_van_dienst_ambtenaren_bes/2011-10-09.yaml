  - number: 20c
    text: |-
      1 De in [artikel 2 lid 3 onder b][ref1] bedoelde leerkracht geniet vakantie met behoud van vol inkomen op dezelfde
      dagen als waarop voor de leerling de vakanties zijn of zullen worden vastgesteld. Hij kan, indien hij dit wenst, in
      de tijdvakken waarin hij vakantie geniet in het buitenland verblijven.

      2 Boven de in het vorige lid bedoelde vakantiedagen kan aan de leerkracht per kalenderjaar ten hoogste twee keer
      één werkdag gesplitst worden verleend als vakantiedag.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel2
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel20c
