  - number: '16'
    text: |-
      1 Ter compensatie van de door de ambtenaar bij zijn overlijden niet genoten of gedeeltelijk niet genoten vakantie,
      wordt door de overheid aan de weduwe of weduwnaar een geldsbedrag uitbetaald gelijk aan het bedrag dat aan de
      ambtenaar aan inkomen zou zijn uitgekeerd gedurende de vakantie, indien de vakantie zou zijn genoten. Bij de
      vaststelling van het aantal niet genoten vakantieuren vindt [artikel 10][ref1] geen toepassing.

      2 Indien de overledene geen weduwe of weduwnaar nalaat, geschiedt de uitbetaling ten behoeve van de kinderen tot
      wie de overledene in familierechtelijke betrekking stond die de leeftijd van 21 jaar nog niet hebben bereikt en
      niet gehuwd zijn of gehuwd geweest zijn. Ontbreken ook zodanige kinderen, dan geschiedt de uitbetaling, indien de
      overledene kostwinner was van ouders, broeders, zusters, overige kinderen of stiefkinderen, ten behoeve van deze
      betrekkingen.

      3 Laat de overledene ook geen betrekkingen, als bedoeld in het tweede lid na, dan wordt het in het eerste lid
      bedoelde bedrag geheel of ten dele aangewend voor de betaling van de kosten van de laatste ziekte en van de
      lijkbezorging.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel10
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel16
