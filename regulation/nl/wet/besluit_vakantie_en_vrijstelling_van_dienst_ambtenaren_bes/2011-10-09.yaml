  - number: 31c
    text: |-
      In de gevallen bedoeld in de [artikelen 31A][ref1] en [31B][ref2] kan het bevoegde gezag op grond van bijzondere
      omstandigheden bepalen, dat het bedrag van het ingehouden inkomen geheel of ten dele aan anderen dan aan de
      ambtenaar zal worden uitbetaald.


