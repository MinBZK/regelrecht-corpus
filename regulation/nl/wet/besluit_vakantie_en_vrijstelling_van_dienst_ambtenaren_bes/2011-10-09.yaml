  - number: '5'
    text: |-
      1 De ambtenaar heeft per kalenderjaar aanspraak op vakantie met behoud van vol inkomen, op de voorwaarden en met
      inachtneming van de regelen gesteld in dit hoofdstuk. Hij is gerechtigd zijn vakantie geheel of gedeeltelijk in het
      buitenland door te brengen.

      2 De vakantie bedoeld in het eerste lid, wordt aan de ambtenaar op zijn daartoe strekkend schriftelijk verzoek
      aaneengesloten verleend door de bevoegde autoriteit.

      3 Wanneer de ambtenaar dit verzoekt en de dienst het toelaat, kan in een kalenderjaar ten hoogste de helft van
      het aantal vakantieuren waarop de ambtenaar per kalenderjaar aanspraak heeft gesplitst worden verleend. Door
      of namens het bevoegd gezag kan voor een bepaalde dienst of een bepaald dienstvak of bedrijf het minimum-aantal
      aaneengesloten uren worden vastgesteld dat op een zelfde dag als vakantieuren kan worden toegekend. Dit aantal mag
      niet hoger gesteld worden dan het voor een ambtenaar volgens de voor hem geldende werktijd op één dag vastgestelde
      aantal werkuren.

      4 Omtrent de tijdstippen, waarop de vakantie zal ingaan, alsmede omtrent de tijdvakken waarin deze eventueel zal
      worden gesplitst, beslist de bevoegde autoriteit.

      5 Bij het nemen van de beslissing bedoeld in het vorige lid, wordt met inachtneming van de belangen van de dienst
      zoveel mogelijk rekening gehouden met de wensen van de ambtenaar, waartoe deze kenbaar maakt, wanneer hij bij
      voorkeur de hem toekomende vakantie wenst te genieten.
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel5
  - number: '6'
    text: |-
      1 Voorzover aan de ambtenaar in een kalenderjaar het hem volgens dit hoofdstuk toekomende aantal vakantieuren
      niet is verleend, wordt hem de niet genoten vakantie in het daaropvolgend kalenderjaar aaneengesloten verleend.
      De vakantie van het voorgaande jaar en de vakantie van het lopende jaar worden aaneengesloten genoten, tenzij
      de ambtenaar te kennen geeft laatstbedoelde vakantie in het daarop volgende kalenderjaar te willen opnemen.
      [Artikel 5 lid 3][ref1] blijft in dit laatste geval onverminderd van toepassing.

      Vakantie over meer dan twee kalenderjaren kan niet aaneengesloten worden verleend.

      2 Behoudens het bepaalde in [artikel 7][ref2] verliest de ambtenaar zijn aanspraak op het door hem niet genoten
      aantal vakantieuren betrekking hebbende op het kalenderjaar voorafgaande aan het afgelopen kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028606#Artikel7
