  - number: '9'
    text: |-
      1 Indien een ambtenaar tijdens zijn vakantie blijkens een geneeskundige verklaring gedurende een of meer dagen
      arbeidsongeschikt is geweest, wordt het aantal hem verleende vakantieuren dat overeenkomt met het aantal werkuren
      gedurende welke hij arbeidsongeschikt was, beschouwd niet als vakantie te zijn genoten en wordt hem voor de duur
      van zijn arbeidsongeschiktheid met inachtneming van de bepalingen van [hoofdstuk VI][ref1] vrijstelling van dienst
      wegens ziekte verleend.

      2 Voor het aantal werkuren volgens de voor de ambtenaar geldende werktijd, waarop hij in verband met de toepassing
      van het eerste lid geen vakantie heeft genoten, wordt hem opnieuw vakantie verleend met inachtneming van de
      bepalingen van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028606
        hoofdstuk: VI
  - number: '10'
    text: |-
      1 De aanspraken van de ambtenaar op vakantie worden in alle gevallen waarin de ambtenaar in een kalenderjaar dertig
      dagen of meer al dan niet aaneengesloten anders dan tengevolge van verleende vakantie, vrijstelling van dienst
      wegens ziekte, vrijstelling van dienst wegens bijzondere omstandigheden met behoud van vol inkomen of vergoeding in
      vrije tijd wegens verricht overwerk, geen werkelijke dienst doet, verminderd naar reden van 1/12 gedeelte van het
      hem ingevolge [artikel 8][ref1] toekomende aantal vakantieuren voor elk aantal van dertig dagen waarop hij geen
      werkelijke dienst heeft vervuld.

      2 Indien de tijd, gedurende welke de ambtenaar geen werkelijke dienst doet, zich over meer dan één kalenderjaar
      uitstrekt, worden de aanspraken op vakantie bij toepassing van het vorige lid, over de desbetreffende kalenderjaren
      naar evenredigheid verminderd.

      3 Indien de vermindering bedoeld in het eerste lid niet kan worden toegepast omdat de aan de ambtenaar toekomende
      vakantie in het desbetreffende kalenderjaar reeds geheel is genoten of daarvoor niet toereikend is, geschiedt de
      vermindering of verdere vermindering in het eerstvolgende kalenderjaar.

      4 Het aantal uren, waarop de ambtenaar ingevolge dit artikel over enig kalenderjaar aanspraak blijft houden op
      vakantie, wordt zo nodig naar boven afgerond op hele uren.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel8
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel10
