  - number: '15'
    text: |-
      1 Indien de ambtenaar in enig kalenderjaar meer vakantie heeft genoten dan hem ingevolge dit hoofdstuk toekomt,
      wordt dit meerdere verrekend met de hem over een of meer volgende kalenderjaren toekomende vakantie.

      2 Het bepaalde in het eerste lid geldt met dien verstande, dat uit dien hoofde in enig kalenderjaar de vakantie
      nimmer met meer dan een derde gedeelte van hetgeen de ambtenaar ingevolge het bepaalde in [artikel 8][ref1] over
      dat jaar toekomt, mag worden verminderd.

      3 Het bepaalde in het [vierde lid van artikel 10][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028606#Artikel10
