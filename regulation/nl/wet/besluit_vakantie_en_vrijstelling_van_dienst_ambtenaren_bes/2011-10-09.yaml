        artikel: 20c
        hoofdstuk: IIIa
  - number: 20g
    text: |-
      Het bepaalde in [artikel 20][ref1] is van overeenkomstige toepassing op de nagelaten betrekkingen van een overleden
      leerkracht aan de politieopleidingsschool.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel20
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel20g
