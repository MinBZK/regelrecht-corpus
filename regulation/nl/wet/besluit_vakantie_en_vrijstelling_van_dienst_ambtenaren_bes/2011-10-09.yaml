  - number: 35a
    text: |-
      1 De ambtenaar kan aan een geneeskundig onderzoek vanwege de dienst worden onderworpen ter beoordeling van de
      vraag:

      a. of er sprake is van verhindering tot dienstverrichting wegens ziekte;

      b. of zich een omstandigheid voordoet, als bedoeld in [artikel 31A][ref1] of in
      [artikel 31B eerste lid, onder b of c][ref2];

      c. of verdere maatregelen in het belang van het herstel nodig zijn;

      d. wanneer en in welke mate de dienst kan worden hervat.

      2 De vanwege de dienst optredende geneeskundige deelt het oordeel terstond mede aan de ambtenaar en stelt het gezag
      dat of de autoriteit die het onderzoek aanvroeg, daarvan zo spoedig mogelijk in kennis.


