  - number: '28'
    text: |-
      Indien de ambtenaar op een dag waarop de overheidsdiensten voorzover de belangen van de dienst dit toelaten zijn
      gesloten, gehouden is dienst te verrichten binnen de vastgestelde werktijden dan wel, in geheel of gedeeltelijk
      afwisselende dienst werkzaam zijnde, op die dag volgens rooster vrij van dienst is of uit hoofde van ziekte
      of vakantie niet tot dienstverrichting is gehouden, geniet hij op een andere werkdag vrijstelling van dienst
      wegens bijzondere omstandigheden. Al naar gelang hij op de dag waarop de overheidsdienst gesloten is gedurende
      langer dan vier uur onderscheidenlijk gedurende vier uur of korter dienst heeft verricht dan wel, in geheel of
      gedeeltelijk afwisselende dienst werkzaam zijnde, volgens rooster vrij van dienst is geweest of uit hoofde van
      ziekte of vakantie niet tot dienstverrichting was gehouden, wordt hem vrijstelling van dienst wegens bijzondere
      omstandigheden verleend gedurende een aantal uren, overeenkomend met de gebruikelijke werktijd op een gehele,
      onderscheidenlijk een halve dag.
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel28
  - number: '29'
    text: |-
      1 Vrijstelling van dienst wegens bijzondere omstandigheden kan bovendien op daartoe strekkend schriftelijk verzoek
      van de ambtenaar worden verleend in de gevallen waarin het in het tweede lid bedoelde gezag of de in dat lid
      bedoelde autoriteit oordeelt dat daartoe aanleiding bestaat. Deze vrijstelling van dienst wordt verleend voor de
      duur van ten hoogste drie maanden en kan geheel of gedeeltelijk in het buitenland worden doorgebracht.

      2 Indien de vrijstelling van dienst bedoeld in het eerste lid van dit artikel van langere duur is dan 15 dagen of
      voor geheel of gedeeltelijk verblijf in het buitenland wordt verleend, wordt deze bij beschikking van het bevoegde
      gezag verleend.

      Indien de vrijstelling bedoeld in het eerste lid niet van langere duur is dan 15 dagen noch voor geheel of
      gedeeltelijk verblijf in het buitenland wordt verleend, wordt deze door de bevoegde autoriteit verleend.

      3 Gedurende de vrijstelling van dienst bedoeld in het eerste lid van dit artikel heeft de ambtenaar aanspraak op
      zijn vol inkomen gedurende de eerste maand en naar reden van vijftig ten honderd van zijn vol inkomen gedurende elk
      der volgende twee maanden.

      4 De vrijstelling van dienst bedoeld in het eerste lid van dit artikel kan, voor zover deze is verleend voor een
      langere duur dan 30 dagen en indien dringende redenen van dienstbelang zulks vorderen, worden ingekort tot minimaal
      30 dagen, bij een met redenen omklede beschikking van het bevoegde gezag.

      5 Indien de ambtenaar tengevolge van de inkorting bedoeld in het voorgaande lid geldelijke schade lijdt, wordt deze
      schade hem vergoed.

      6 Voor zover de vrijstelling van dienst bedoeld in het eerste lid van dit artikel verleend is voor een langere duur
      dan 15 dagen of voor geheel of gedeeltelijk verblijf in het buitenland geschiedt herstel in activiteit na eindiging
      van de vrijstelling van dienst bij beschikking van het bevoegde gezag.

      7 Tijdens de vrijstelling van dienst wegens bijzondere omstandigheden bedoeld in het eerste lid van dit artikel,
      ondergaat het inkomen van de ambtenaar dezelfde wijzigingen welke het zou hebben ondergaan indien deze vrijstelling
      van dienst niet zou zijn verleend.
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel29
  - number: '30'
    text: |-
      1 Vrijstelling van dienst wegens bijzondere omstandigheden kan ook zonder behoud van inkomen op daartoe strekkend
      schriftelijk verzoek van de ambtenaar bij beschikking van het bevoegde gezag worden verleend in de gevallen waarin
      dit gezag oordeelt dat daartoe aanleiding bestaat. Deze vrijstelling van dienst wordt verleend voor de duur van ten
      hoogste vijf jaren en kan geheel of gedeeltelijk in het buitenland worden doorgebracht.

      2 De vrijstelling van dienst bedoeld in het eerste lid van dit artikel kan, voor zover deze is verleend voor een
      langere duur dan drie maanden en indien dringende redenen van dienstbelang zulks vorderen, worden ingekort tot
      minimaal drie maanden bij een met redenen omklede beschikking van het bevoegde gezag.

      3 Indien de ambtenaar tengevolge van de inkorting bedoeld in het voorgaande lid geldelijke schade lijdt, wordt deze
      schade hem vergoed.

      4 Herstel in activiteit na eindiging van de vrijstelling van dienst bedoeld in het eerste lid geschiedt bij
      beschikking van het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel30
  - number: '31'
    text: |-
      1 De ambtenaar die wegens ziekte verhinderd is zijn dienst uit te oefenen, heeft tot herstel van zijn gezondheid
      aanspraak op vrijstelling van dienst wegens ziekte.

      2 De duur van een vrijstelling van dienst wegens ziekte, verlenging daarvan inbegrepen, is ten hoogste vier jaren
      voor een ambtenaar in vaste dienst en ten hoogste een jaar voor een ambtenaar in tijdelijke dienst.

      3 De aanvankelijke duur van een vrijstelling van dienst wegens ziekte wordt gesteld op ten hoogste zes maanden.
      Deze termijn kan met inachtneming van het bepaalde in het vorige lid, telkens met ten hoogste zes maanden worden
      verlengd.

      4 Gedurende een vrijstelling van dienst wegens ziekte heeft de ambtenaar aanspraak op een inkomen naar reden van:

      I. Voor een ambtenaar in vaste dienst:

      a. zijn vol inkomen gedurende de eerste vierentwintig maanden;

      b. negentig ten honderd van zijn vol inkomen gedurende de daaropvolgende twaalf maanden;

      c. tachtig ten honderd van zijn vol inkomen gedurende de resterende maanden.

      II. voor een ambtenaar in tijdelijke dienst zijn vol inkomen.

      5 Een opnieuw ingetreden verhindering tot dienstverrichting wegens ziekte wordt voor het bepalen van de in het
      tweede en vierde lid genoemde termijnen als een voortzetting van de vorige verhindering beschouwd, tenzij die
      verhindering zich voordoet, nadat tenminste dertig kalenderdagen zijn verstreken sedert de ambtenaar zijn dienst
      volledig heeft hervat.

      6 Het inkomen bedoeld onder lid 4, letters b en c, wordt naar boven afgerond tot het naaste bedrag in gehele
      dollars dat een veelvoud is van twaalf.

      7 Tijdens de vrijstelling van dienst wegens ziekte ondergaat het inkomen van de ambtenaar dezelfde wijzigingen,
      welke het zou hebben ondergaan indien de ambtenaar niet verhinderd zou zijn geweest zijn dienst uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel31
  - number: 31a
    text: |-
      Geen aanspraak op doorbetaling van inkomen bestaat:

      a. indien de ziekte is voorgewend althans zodanig overdreven voorgesteld, dat verhindering tot dienstverrichting
      niet kan worden aangenomen;

      b. indien de ambtenaar de verhindering tot dienstverrichting opzettelijk heeft veroorzaakt, tenzij hem daarvan op
      grond van zijn psychische toestand geen verwijt kan worden gemaakt;

      c. indien het ziekteverzuim is veroorzaakt door of het gevolg is van een kwaal of lichaamsgebrek, waarover de
      ambtenaar bij of vóór zijn indiensttreding opzettelijk het stilzwijgen heeft bewaard of waaromtrent hij opzettelijk
      valse inlichtingen heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel31a
  - number: 31b
    text: |-
      1 De doorbetaling van inkomen wordt gestaakt, wanneer en voor zolang de ambtenaar:

      a. weigert zich te onderwerpen aan een geneeskundig onderzoek vanwege de dienst of, na voor zulk een onderzoek te
      zijn opgeroepen, zonder geldige reden niet verschijnt;

      b. zonder voldoende gronden nalaat zich onder geneeskundige behandeling te stellen of te blijven stellen, dan wel
      zich niet houdt aan de voorschriften hem door de behandelende geneeskundige gegeven, met dien verstande dat te
      dezen voorschriften tot het verlenen van medewerking aan een ingreep van heelkundige aard zijn uitgezonderd;

      c. zich zodanig gedraagt, dat zijn genezing wordt belemmerd of vertraagd;

      d. tijdens de verhindering om dienst te verrichten voor zichzelf of voor derden arbeid verricht, tenzij dit door
      de geneeskundige of geneeskundigen, bedoeld in [artikel 33, vierde lid][ref1], in het belang van zijn genezing
      wenselijk wordt geacht;

      e. in gebreke blijft op het door de geneeskundige of geneeskundigen, bedoeld in [artikel 33, vierde lid][ref2],
      bepaalde tijdstip en in de door bedoelde geneeskundige(n) bepaalde mate zijn dienst te hervatten, tenzij hij
      daarvoor een inmiddels opgekomen, door bedoelde geneeskundige(n) als geldig erkende reden heeft opgegeven. De in
      dit lid bedoelde aanspraak vervalt met ingang van de dag waarop de reden daarvoor voor het eerst aanwezig was.

      2 De doorbetaling van inkomen kan geheel of ten dele worden gestaakt, indien de ambtenaar de controle-voorschriften
      overtreedt, die zijn vastgesteld:

      a. bij ministeriële regeling voor ambtenaren in dienst van de Staat;

      b. bij eilandsbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.


