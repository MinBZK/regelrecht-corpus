        artikel: '8'
        hoofdstuk: II
  - number: '8'
    text: |-
      1 Het aantal vakantieuren waarop de ambtenaar per kalenderjaar aanspraak heeft, bedraagt voor de ambtenaar die
      ingevolge het [Bezoldigingsbesluit 1998 BES][ref1] of volgens daarmee in andere organieke bezoldigingsregelingen
      voorkomende overeenkomstige bezoldigingsschalen ingeschaald is in:

      a. schaal 1 tot en met 5: 152 werkuren;

      b. schaal 6 tot en met 9: 176 werkuren;

      c. schaal 10 tot en met 13: 200 werkuren;

      d. schaal 14 tot en met 17: 224 werkuren.

      De ambtenaar die niet in een van de bedoelde schalen ingeschaald is, maar eenzelfde bezoldiging geniet
      overeenkomstig een van de genoemde schalen, dan wel een bezoldiging geniet waarvan de hoogte niet in een van
      genoemde schalen voorkomt, heeft aanspraak op het aantal werkuren vakantie dat behoort bij de naast-hogere schaal.
      De ambtenaar die niet ingeschaald is en een hogere bezoldiging geniet dan de ambtenaar die bezoldigd is in schaal
      17, heeft aanspraak op 240 werkuren vakantie.

      2 Aan de ambtenaar die ingevolge het voor hem geldende werkrooster avond- en/of nachtdienst en dienst op zon- en
      feestdagen moet verrichten wordt, in afwijking van het bepaalde in het eerste lid, het totaal aantal vakantieuren
      verleend, hetwelk is vastgesteld voor de categorie onmiddellijk volgende op die waartoe hij ingevolge het bepaalde
      in het eerste lid van dit artikel behoort.

      3 Voor de toepassing van het eerste en tweede lid geldt de categorie waartoe de ambtenaar op 1 januari van het
      kalenderjaar, waarover hij aanspraak op vakantie kan doen gelden behoort, of in geval van indiensttreding in de
      loop van het kalenderjaar, de categorie waartoe hij behoort op het tijdstip van indiensttreding.

      4 Voor een ambtenaar voor wie de geldende werktijd korter is dan de gebruikelijke volledige werktijd, wordt het
      ingevolge het eerste tot en met derde lid van toepassing zijnde aantal vakantieuren vermenigvuldigd met een breuk
      waarvan de teller bestaat uit het aantal uren van de voor die ambtenaar geldende werktijd en de noemer uit het
      aantal uren van de voor zijn functie geldende gebruikelijke volledige werktijd.

      5 Indien gedurende een kalenderjaar wijziging optreedt in de omvang van de voor een ambtenaar geldende werktijd,
      wordt het aantal vakantieuren waarop de ambtenaar gedurende dat jaar aanspraak heeft, bepaald door het aantal
      vakantieuren voor elk tijdvak van het kalenderjaar waarin de voor de ambtenaar geldende werktijd gelijk is,
      afzonderlijk te berekenen en hiervan de som te bepalen. Het aantal vakantieuren waarop de ambtenaar gedurende elk
      tijdvak van het kalenderjaar aanspraak heeft, wordt berekend door het aantal maanden dat het tijdvak heeft geduurd,
      te delen door 12 en het quotiënt te vermenigvuldigen met het aantal vakantieuren waarop de ambtenaar aanspraak zou
      hebben als het tijdvak een vol kalenderjaar zou hebben gevormd.

      6 Het aantal uren waarvoor ingevolge dit artikel aanspraak op vakantie bestaat, wordt zo nodig naar boven afgerond
      op hele uren.


      [ref1]: https://wetten.overheid.nl/BWBR0028491
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel8
