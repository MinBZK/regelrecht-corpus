  - number: '38'
    text: 'Dit besluit wordt aangehaald als: Besluit vakantie en vrijstelling van dienst ambtenaren BES.'
    url: https://wetten.overheid.nl/BWBR0028606/2011-10-09#Artikel38
  - number: '39'
    text: |-
      Dit besluit berust op [artikel 43 van de Ambtenarenwet BES][ref1] en
