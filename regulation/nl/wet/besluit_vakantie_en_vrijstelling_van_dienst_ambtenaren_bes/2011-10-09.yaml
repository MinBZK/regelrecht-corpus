  - number: '4'
    text: |-
      Voor de toepassing van dit besluit en de uit kracht daarvan gegeven voor schriften wordt verstaan onder:

        - *bevoegde autoriteit:* a. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, voor wat betreft
      hoofden van dienst in dienst van de staat; b. het bestuurscollege, voor wat betreft de hoofden van dienst in
      dienst van een openbaar lichaam; c. de Rijksvertegenwoordiger, voor wat betreft het personeel van het Bureau
      van de Rijksvertegenwoordiger; d. het hoofd van de dienst voor wat betreft de bij zijn dienst werkzaam gestelde
      ambtenaren.
        - *hoofd van dienst:* de bij besluit van het bevoegd gezag als zodanig aangewezen ambtenaren.
        - *gezin:* a. de echtgenote van de betrokken ambtenaar; b. de kinderen tot wie de betrokken ambtenaar in
      familierechtelijke betrekking staat die de leeftijd van 21 jaar nog niet hebben bereikt en niet gehuwd zijn of
      gehuwd geweest zijn, de stief- en pleegkinderen van de betrokken ambtenaar die de leeftijd van 21 jaar nog niet
      hebben bereikt en niet gehuwd zijn of gehuwd geweest zijn, de laatsten voor zover de betrokken ambtenaar ten
      behoeve van deze pleegkinderen kindertoelage geniet; c. de overige kinderen tot wie de betrokken ambtenaar in
      familie-rechtelijke betrekking staat, de overige stief- en pleegkinderen van de betrokken ambtenaar, voor zover de
      betrokken ambtenaar ten behoeve van deze kinderen kindertoelage geniet;
        - *inkomen:* de bezoldiging van de ambtenaar, vermeerderd met een eventuele kindertoelage, de bijzondere
      individuele vergoedingen en de verhogingen en persoonlijke toelagen met een periodiek karakter
      welke op grond van een organieke regeling van de bezoldiging en ingevolge de [artikelen 17][ref1]
      en [24 van het Rechtspositiebesluit ambtenaren BES][ref2] worden genoten, de continutoelage en
      vergoedingen van onkosten daaronder niet begrepen; voorts de compensatietoeslag krachtens de
      [Wet Algemene Ouderdomsverzekering BES][ref3] en de [Wet Algemene Weduwen en Wezenverzekering BES][ref4],
      en de vergoeding voor overwerk, indien deze krachtens een wettelijke regeling in afwijking van
      [artikel 27, derde lid][ref5], als een vaste vergoeding wordt genoten, alsmede de vaste vergoedingen voor dienst op
      zon- en feestdagen en voor onregelmatige dienst.

      Voor het onderwijzend personeel bij het van overheidswege gegeven openbare onderwijs wordt mede als inkomen
      aangemerkt de aan dit personeel op grond van geldende wettelijke regelingen toegekende vaste toelagen.

      Voor de berekening van de vakantie-uitkering bedoeld in [hoofdstuk IV][ref6] wordt de compensatietoeslag hiervoor
      bedoeld niet als deel van het inkomen aangemerkt.


