  - number: 35b
    text: |-
      1 De ambtenaar, die zich met het oordeel van de in [artikel 35A, tweede lid][ref1], bedoelde geneeskundige,
      niet kan verenigen, kan hiervan, mits binnen de kortst mogelijke tijd, doch in ieder geval binnen 3 maal 24 uur
      nadat dit oordeel te zijner kennis is gebracht, onder opgave van redenen aan het gezag dat, of autoriteit, die
      het onderzoek aanvroeg, schriftelijk mededeling doen. Hij kan ter ondersteuning van zijn bezwaar een verklaring
      overleggen van een geneeskundige, die alsdan door de in het tweede lid bedoelde commissie in de gelegenheid wordt
      gesteld tot het geven van een nadere mondelinge toelichting.

      2 Behalve indien, na overleg met de geneeskundige, bedoeld in het [tweede lid van artikel 35A][ref2], door
      het gezag dat, of de autoriteit, die het onderzoek aanvroeg, het bezwaar van de ambtenaar reeds aanstonds
      voldoende gegrond wordt geacht, wordt binnen 14 dagen na ontvangst van het bezwaarschrift door een commissie van
      geneeskundigen – waarin geen zitting zal mogen hebben de in artikel 35A, tweede lid, bedoelde geneeskundige – een
      hernieuwd onderzoek ingesteld. De commissie deelt haar oordeel zo spoedig mogelijk mede aan het bevoegde gezag, dat
      vervolgens de ambtenaar daarvan in kennis stelt.

      3 De kosten van het hernieuwde onderzoek komen voor rekening van de overheid.


