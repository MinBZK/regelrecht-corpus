  - number: 31a
    text: |-
      Geen aanspraak op doorbetaling van inkomen bestaat:

      a. indien de ziekte is voorgewend althans zodanig overdreven voorgesteld, dat verhindering tot dienstverrichting
      niet kan worden aangenomen;

      b. indien de ambtenaar de verhindering tot dienstverrichting opzettelijk heeft veroorzaakt, tenzij hem daarvan op
      grond van zijn psychische toestand geen verwijt kan worden gemaakt;

      c. indien het ziekteverzuim is veroorzaakt door of het gevolg is van een kwaal of lichaamsgebrek, waarover de
      ambtenaar bij of vóór zijn indiensttreding opzettelijk het stilzwijgen heeft bewaard of waaromtrent hij opzettelijk
      valse inlichtingen heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0028606/2022-01-01#Artikel31a
  - number: 31b
    text: |-
      1 De doorbetaling van inkomen wordt gestaakt, wanneer en voor zolang de ambtenaar:

      a. weigert zich te onderwerpen aan een geneeskundig onderzoek vanwege de dienst of, na voor zulk een onderzoek te
      zijn opgeroepen, zonder geldige reden niet verschijnt;

      b. zonder voldoende gronden nalaat zich onder geneeskundige behandeling te stellen of te blijven stellen, dan wel
      zich niet houdt aan de voorschriften hem door de behandelende geneeskundige gegeven, met dien verstande dat te
      dezen voorschriften tot het verlenen van medewerking aan een ingreep van heelkundige aard zijn uitgezonderd;

      c. zich zodanig gedraagt, dat zijn genezing wordt belemmerd of vertraagd;

      d. tijdens de verhindering om dienst te verrichten voor zichzelf of voor derden arbeid verricht, tenzij dit door
      de geneeskundige of geneeskundigen, bedoeld in [artikel 33, vierde lid][ref1], in het belang van zijn genezing
      wenselijk wordt geacht;

      e. in gebreke blijft op het door de geneeskundige of geneeskundigen, bedoeld in [artikel 33, vierde lid][ref2],
      bepaalde tijdstip en in de door bedoelde geneeskundige(n) bepaalde mate zijn dienst te hervatten, tenzij hij
      daarvoor een inmiddels opgekomen, door bedoelde geneeskundige(n) als geldig erkende reden heeft opgegeven. De in
      dit lid bedoelde aanspraak vervalt met ingang van de dag waarop de reden daarvoor voor het eerst aanwezig was.

      2 De doorbetaling van inkomen kan geheel of ten dele worden gestaakt, indien de ambtenaar de controle-voorschriften
      overtreedt, die zijn vastgesteld:

      a. bij ministeriële regeling voor ambtenaren in dienst van de Staat;

      b. bij eilandsbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0028606#Artikel33
