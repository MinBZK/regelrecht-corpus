  - number: '12'
    text: |-
      1 Degene die onmiddellijk voor zijn aanstelling tot ambtenaar waarop dit hoofdstuk van toepassing is, werkzaam
      was als ambtenaar in dienst van een openbaar lichaam dan wel als ambtenaar van politie of aspirant, bedoeld in
      [artikel 1, eerste lid, onderdelen c en d, van het Besluit rechtspositie korps politie BES][ref1], behoudt bij zijn
      aanstelling op zijn verzoek aanspraak op de vakantie-uren die tijdens zijn vorige dienstverband in het lopende en
      het voorgaande kalenderjaar waarin zijn aanstelling plaatsvindt, op grond van de [artikelen 5][ref2] of [8a][ref3],
      onderscheidenlijk de [artikelen 33][ref4] of [37c van het Besluit rechtspositie korps politie BES][ref5] zijn
      ontstaan of gespaard en nog niet genoten.

      2 Het eerste lid is van overeenkomstige toepassing op degene die onmiddellijk voor zijn aanstelling tot ambtenaar
      van een openbaar lichaam werkzaam was als ambtenaar in dienst van de staat of als ambtenaar in dienst van een ander
      openbaar lichaam.


