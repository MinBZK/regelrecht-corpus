  - number: '37'
    text: |-
      Na eindiging van een vrijstelling van dienst wegens ziekte van meer dan dertig dagen of van een vrijstelling
      van dienst wegens ziekte voor verblijf in het buitenland, is herstel in activiteit bij beschikking vereist. Deze
      inactiviteitherstelling geschiedt door het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028606/2022-01-01#Artikel37
  - number: 37a
    text: |-
      1 De vrouwelijke ambtenaar heeft in verband met haar bevalling recht op zwangerschaps- en bevallingsverlof met
      doorbetaling van het volle inkomen.

      2 Het recht op het zwangerschapsverlof bestaat vanaf zes weken voor de dag na de vermoedelijke datum van bevalling,
      zoals aangegeven in een schriftelijke verklaring van een arts of verloskundige, tot en met de dag van de bevalling.
      Het zwangerschapsverlof gaat in uiterlijk vier weken voor de dag na de vermoedelijke datum van bevalling.

      3 Het recht op bevallingsverlof gaat in op de dag na de dag van de bevalling en bedraagt tien aaneengesloten weken
      vermeerderd met het aantal dagen dat het zwangerschapsverlof tot en met de vermoedelijke datum van bevalling, dan
      wel, indien eerder gelegen, tot en met de werkelijke datum van bevalling, minder dan zes weken heeft bedragen.

      4 Het verlof, bedoeld in het tweede en derde lid, wordt voor de toepassing van dit besluit gelijkgesteld met
      verhindering tot dienstverrichting wegens ziekte.
    url: https://wetten.overheid.nl/BWBR0028606/2022-01-01#Artikel37a
  - number: '38'
    text: 'Dit besluit wordt aangehaald als: Besluit vakantie en vrijstelling van dienst ambtenaren BES.'
    url: https://wetten.overheid.nl/BWBR0028606/2022-01-01#Artikel38
