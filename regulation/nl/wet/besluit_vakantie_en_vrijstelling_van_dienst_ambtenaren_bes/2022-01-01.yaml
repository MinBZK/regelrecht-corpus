  - number: '27'
    text: |-
      1 De dagen gedurende welke de ambtenaar op grond van [artikel 43 van het Rechtspositiebesluit ambtenaren BES][ref1]
      de toegang tot de dienstlokalen, dienstgebouwen of het werk, dan wel het verblijf aldaar, is ontzegd, anders dan
      wegens hinderlijke gedragingen of het gebruik van alcoholhoudende drank, worden als vrijstelling van dienst wegens
      bijzondere omstandigheden, met behoud van vol inkomen, aangemerkt.

      2 De dagen gedurende welke het de ambtenaar op grond van
      [artikel 46 van het Rechtspositiebesluit ambtenaren BES][ref2] wegens besmettelijke ziekte van een persoon als in
      dat artikel bedoeld, verboden is aan de dienst deel te nemen, worden als vrijstelling van dienst wegens bijzondere
      omstandigheden, met behoud van vol inkomen, aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel46
