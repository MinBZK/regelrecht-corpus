  - number: '17'
    text: |-
      1 Het onderwijzend personeel bij het van overheidswege gegeven openbare onderwijs geniet vakantie, met behoud
      van vol inkomen, op dezelfde dagen als waarop voor de leerlingen van de inrichting van onderwijs waaraan het is
      verbonden de schoolvakanties zijn of zullen worden vastgesteld. Dit personeel kan, indien het dit wenst, in de
      tijdvakken waarin het vakantie geniet in het buitenland verblijven.

      2 Het onderwijzend personeel houdt zich zo nodig gedurende ten hoogste 6 dagen van de vakantie ter beschikking van
      het bestuurscollege, ten behoeve van werkzaamheden van onderwijskundige en/of schoolorganisatorische aard. Door
      of vanwege het bestuurscollege wordt aan het onderwijzend personeel tijdig medegedeeld op welke dagen het zich ter
      beschikking moet houden. Tenminste een der tijdvakken waarin het onderwijzend personeel vakantie geniet dient een
      aaneengesloten periode van ten minste vier weken te omvatten.
    url: https://wetten.overheid.nl/BWBR0028606/2022-01-01#Artikel17
  - number: '18'
    text: |-
      1 Voor het aantal werkuren gedurende welke de directeur of het hoofd van een school met voorafgaande schriftelijke
      toestemming van of vanwege het bestuurscollege gedurende de tijd dat het onderwijzend personeel vakantie geniet
      werkzaamheden verricht van onderwijskundige en/of schoolorganisatorische aard waardoor hij op die dagen geen
      vakantie heeft genoten, worden hem op zijn schriftelijk verzoek extra vrije uren aaneengesloten toegekend
      onmiddellijk voorafgaande aan of aansluitende op een schoolvakantie. Het aantal extra vrije uren waarop
      belanghebbende aanspraak kan doen gelden wordt bij beschikking van het bestuurscollege vastgesteld.

      2 Het verzoek bedoeld in het eerste lid kan in het belang van het onderwijs worden geweigerd. Indien deze weigering
      tot gevolg heeft dat de extra vrije uren waarop de belanghebbende aanspraak kan doen gelden niet in het lopende
      schooljaar kunnen worden genoten, worden deze extra vrije uren in het daaropvolgende schooljaar toegekend. Mocht
      ook in laatstbedoeld schooljaar toekenning van de extra vrije uren in het belang van het onderwijs niet mogelijk
      zijn, dan wordt hem in plaats daarvan een uitkering toegekend. Deze uitkering is gelijk aan het inkomen waarop
      belanghebbende gedurende deze extra vrije uren aanspraak zou hebben kunnen doen gelden indien de niet genoten vrije
      uren onmiddellijk voorafgaande aan de laatste schoolvakantie in laatstbedoeld schooljaar zouden zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0028606/2022-01-01#Artikel18
  - number: '19'
    text: |-
      1 Indien een lid van het onderwijzend personeel in de tijd dat hij vakantie geniet, blijkens een geneeskundige
      verklaring, gedurende een of meer dagen arbeidsongeschikt is geweest, wordt elk werkuur gedurende welke hij op
      een bepaalde dag arbeidsongeschikt was die wanneer de school niet gesloten zou zijn geweest een schooldag zou
      zijn, beschouwd niet als vakantie te zijn genoten en wordt hem voor de duur van zijn arbeidsongeschiktheid met
      inachtneming van de bepalingen van [hoofdstuk VI][ref1] vrijstelling van dienst wegens ziekte verleend. Voor
      het aantal werkuren gedurende welke het lid van het onderwijzend personeel in verband met de toepassing van
      het bepaalde in de vorige zin geen vakantie heeft genoten, worden hem op zijn verzoek bij beschikking van het
      bestuurscollege extra vrije uren aaneengesloten toegekend onmiddellijk voorafgaande aan of aansluitende op een
      volgende schoolvakantie. Het aantal extra vrije uren waarop belanghebbende na een ziekteperiode aanspraak kan doen
      gelden wordt bij beschikking van het bestuurscollege vastgesteld.

      2 Het verzoek bedoeld in het eerste lid kan in het belang van het onderwijs worden geweigerd. Het uitstel dat
      deze weigering tot gevolg heeft mag zich ten hoogste over twee achtereenvolgende schooljaren uitstrekken, met
      dien verstande dat bij de toekenning in enig schooljaar niet meer extra vrije uren kunnen worden toegekend dan
      het aantal werkuren dat belanghebbende op grond van [artikel 17][ref2] over twee achtereenvolgende schooljaren aan
      vakantie kan genieten.

      3 De belanghebbende verliest zijn aanspraak op het aantal extra vrije uren bedoeld in de vorige leden voor de
      toekenning waarvan hij geen verzoek of nader verzoek tot toekenning heeft ingediend voor zover het betreft extra
      vrije uren welke in het schooljaar voorafgaande aan het afgelopen schooljaar konden worden aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0028606#Artikel17
