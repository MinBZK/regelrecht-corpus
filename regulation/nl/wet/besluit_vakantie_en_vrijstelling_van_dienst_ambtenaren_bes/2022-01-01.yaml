  - number: 8a
    text: |-
      1 De ambtenaar in dienst van de Staat kan per kalenderjaar ten hoogste 26 van de vakantie-uren waarop hij aanspraak
      heeft op grond van [artikel 5, tweede lid][ref1], sparen ten behoeve van levensfaseverlof.

      2 In afwijking van het eerste lid kan de ambtenaar in dienst van de Staat aan het einde van elk kalenderjaar ten
      hoogste 65,5 van de vakantie-uren waarop hij aanspraak heeft op grond van [artikel 5, tweede lid][ref2], sparen
      ten behoeve van levensfaseverlof, op voorwaarde dat hij in dat kalenderjaar ten minste 118,5 vakantie-uren heeft
      genoten.

      3 De ambtenaar aan wie op grond van [artikel 5, derde lid][ref3], extra vakantie-uren zijn verleend, kan een derde
      deel van die extra-vakantie-uren sparen ten behoeve van levensfaseverlof.

      4 Onverminderd [artikel 8, tweede lid][ref4], kan het bevoegd gezag op aanvraag van de ambtenaar zijn aanspraak op
      vakantie-uren met ten hoogste 31,6 uren verhogen, welke uren de ambtenaar spaart ten behoeve van levensfaseverlof.
      Artikel 8, zesde lid, is van overeenkomstige toepassing.

      5 Het aantal op grond van dit artikel in totaal door een ambtenaar gespaarde en nog niet op grond van
      [artikel 8b][ref5] opgenomen vakantie-uren bedraagt ten hoogste 1975.

      6 Ten aanzien van de in het eerste, tweede, vierde en vijfde lid genoemde aantallen vakantie-uren is
      [artikel 5, vierde tot en met zevende lid][ref6], van overeenkomstige toepassing.

      7 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan nadere regels stellen ter uitvoering van dit
      artikel.


