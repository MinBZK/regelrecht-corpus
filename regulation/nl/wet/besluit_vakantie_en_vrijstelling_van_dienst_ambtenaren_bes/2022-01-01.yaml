  - number: '5'
    text: |-
      1 De ambtenaar heeft jaarlijks aanspraak op vakantie met behoud van zijn volle inkomen.

      2 Voor de ambtenaar met volledige werktijd bedraagt de aanspraak op vakantie per kalenderjaar 184 werkuren.

      3 Aan de ambtenaar die ingevolge het voor hem geldende werkrooster avond- of nachtdienst en dienst op zon- en
      feestdagen moet verrichten, wordt per kalenderjaar 24 extra vakantie-uren verleend.

      4 Voor de ambtenaar voor wie de geldende werktijd korter is dan de gebruikelijke volledige werktijd, worden
      de in het tweede en derde lid genoemde aantallen uren vermenigvuldigd met de voor de ambtenaar geldende
      arbeidsduurfactor.

      5 Bij beëindiging of aanvang van het dienstverband in de loop van een kalenderjaar, wordt de aanspraak op vakantie
      vastgesteld naar evenredigheid van de dienst, die de ambtenaar in dat jaar verricht heeft of zal verrichten.

      6 Indien gedurende een kalenderjaar wijziging optreedt in de omvang van de voor een ambtenaar geldende werktijd,
      wordt de aanspraak op vakantie die gedurende het gedeelte van dat kalenderjaar na die wijziging ontstaat, opnieuw
      vastgesteld, rekening houdend met de nieuwe werktijd. De tot aan de datum van ingang van de wijziging van de
      werktijd verworven aanspraak op vakantie blijft ongewijzigd gehandhaafd.

      7 Het aantal uren waarvoor ingevolge dit artikel aanspraak op vakantie bestaat, wordt zo nodig naar boven afgerond
      op hele uren.
