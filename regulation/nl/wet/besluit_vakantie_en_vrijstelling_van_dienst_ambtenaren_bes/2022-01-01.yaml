  - number: '8'
    text: |-
      1 Tenzij gewichtige redenen van dienstbelang zich daartegen verzetten, kan het bevoegd gezag op aanvraag van de
      ambtenaar in dienst van de Staat zijn aanspraak op vakantie-uren eenmaal per kalenderjaar met ten hoogste 39,5
      vakantie-uren verlagen.

      2 Tenzij gewichtige redenen van dienstbelang zich daartegen verzetten, kan het bevoegd gezag op aanvraag van
      de ambtenaar in dienst van de Staat eenmaal per kalenderjaar zijn aanspraak op vakantie-uren met ten hoogste 79
      vakantie-uren verhogen.

      3 Ten aanzien van het in het eerste en tweede lid genoemde aantal vakantie-uren is
      [artikel 5, vierde en vijfde lid][ref1], van overeenkomstige toepassing.

      4 Een aanvraag als bedoeld in het eerste of tweede lid wordt voor 1 november van het lopende kalenderjaar
      ingediend. Het bevoegd gezag beslist op of na 1 november en voor het einde van dat kalenderjaar gelijktijdig over
      alle voor die datum ingediende aanvragen.

      5 De ambtenaar wordt een vergoeding toegekend voor elk uur waarmee zijn aanspraak op vakantie-uren ingevolge het
      eerste lid wordt verlaagd, ten bedrage van de bezoldiging per uur die hij geniet op de dag waarop de aanvraag,
      bedoeld in het eerste lid, is goedgekeurd.

      6 De ambtenaar is een vergoeding verschuldigd voor elk uur waarmee zijn aanspraak op vakantie-uren ingevolge het
      tweede lid wordt verhoogd ten bedrage van de bezoldiging per uur die hij geniet op de dag waarop de aanvraag,
      bedoeld in het tweede lid, is goedgekeurd.

      7 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan nadere regels stellen ter uitvoering van dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel5
