  - number: '10'
    text: |-
      1 In alle gevallen waarin de ambtenaar in een kalenderjaar dertig dagen of meer al dan niet aaneengesloten anders
      dan ten gevolge van verleende vakantie, levensfaseverlof, vrijstelling van dienst wegens ziekte, vrijstelling van
      dienst wegens bijzondere omstandigheden met behoud van vol inkomen of vergoeding in vrije tijd wegens verricht
      overwerk geen werkelijke dienst doet, worden zijn aanspraken op vakantie op grond van [artikel 5][ref1] naar
      evenredigheid verminderd.

      2 Indien de tijd, gedurende welke de ambtenaar geen werkelijke dienst doet, zich over meer dan één kalenderjaar
      uitstrekt, worden de aanspraken op vakantie bij toepassing van het vorige lid, over de desbetreffende kalenderjaren
      naar evenredigheid verminderd.

      3 Indien de vermindering bedoeld in het eerste lid niet kan worden toegepast omdat de aan de ambtenaar toekomende
      vakantie in het desbetreffende kalenderjaar reeds geheel is genoten of daarvoor niet toereikend is, geschiedt de
      vermindering of verdere vermindering in het eerstvolgende kalenderjaar.

      4 Het aantal uren, waarop de ambtenaar ingevolge dit artikel over enig kalenderjaar aanspraak blijft houden op
      vakantie, wordt zo nodig naar boven afgerond op hele uren.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel5
