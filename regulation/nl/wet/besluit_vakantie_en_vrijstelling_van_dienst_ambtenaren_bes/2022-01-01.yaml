    text: |-
      1 Vrijstelling van dienst wegens ziekte wordt door het bevoegd gezag verleend. Deze vrijstelling van dienst kan,
      onverminderd het bepaalde in [artikel 34][ref1], met schriftelijke toestemming van het bevoegde gezag geheel of
      gedeeltelijk in het buitenland worden doorgebracht.

      2 Indien de vrijstelling van dienst bedoeld in het eerste lid van dit artikel van langere duur is dan dertig dagen
      of voor verblijf in het buitenland wordt verleend, wordt deze bij beschikking van het bevoegde gezag verleend.

      Indien de vrijstelling van dienst bedoeld in het eerste lid niet van langere duur is dan dertig dagen noch voor
      verblijf in het buitenland wordt verleend, wordt deze door het bevoegd gezag verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel34
