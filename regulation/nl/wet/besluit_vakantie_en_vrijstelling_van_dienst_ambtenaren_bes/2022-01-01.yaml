  - number: '35'
    text: |-
      1 Van een uitspraak krachtens [artikel 33, vierde lid][ref1] of krachtens [artikel 36, eerste lid][ref2], staat,
      binnen 30 dagen nadat de ambtenaar van de uitspraak schriftelijk in kennis is gesteld, beroep open bij een
      herkeuringscommissie, bestaande uit tenminste drie geneeskundigen. Een van deze geneeskundigen wordt aangewezen
      door de betrokken ambtenaar.

      2 Het krachtens het eerste lid in te dienen beroepschrift wordt aangeboden aan het bevoegd gezag dat ingevolge het
      vierde lid de herkeuringscommissie moet benoemen. Het beroepschrift vermeldt tevens de naam en het adres van de
      geneeskundige die door de betrokken ambtenaar voor benoeming in de herkeuringscommissie is aangewezen.

      3 De leden van de herkeuringscommissie mogen niet bij een uitspraak, bedoeld in het eerste lid van dit artikel,
      betrokken zijn geweest.

      4 De leden van de herkeuringscommissie worden benoemd:

      a. door het bevoegde gezag, indien de ambtenaar zich in de openbare lichamen bevindt;

      b. door of vanwege Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties indien de ambtenaar zich buiten de
      openbare lichamen bevindt;

      c. [vervallen]


