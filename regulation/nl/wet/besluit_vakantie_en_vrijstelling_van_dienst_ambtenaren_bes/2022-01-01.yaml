    text: |-
      1 Dit besluit is niet van toepassing op de ambtenaar van politie, bedoeld in
      [artikel 1, onderdeel c, van het Besluit rechtspositie korps politie BES][ref1].

      2 Voor de toepassing van [hoofdstuk II][ref2] van dit besluit worden niet als ambtenaar beschouwd:

      a. het onderwijzend personeel bij het van overheidswege gegeven openbaar onderwijs. Onder onderwijzend personeel
      wordt mede begrepen de amanuensis werkzaam bij het van overheidswege gegeven openbaar onderwijs;

      b. de met volledige dagtaak aan een politieopleidingschool verbonden leerkracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028606#HoofdstukII
