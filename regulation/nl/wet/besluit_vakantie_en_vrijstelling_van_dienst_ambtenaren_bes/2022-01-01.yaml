  - number: '26'
    text: |-
      1 Tenzij de belangen van de dienst zich daartegen verzetten, wordt aan de ambtenaar op zijn daartoe strekkend
      mondeling of schriftelijk verzoek door het bevoegd gezag vrijstelling van dienst wegens bijzondere omstandigheden,
      met behoud van vol inkomen, verleend:

      I. a. op de dag van zijn ondertrouw;

      b. bij zijn huwelijk: vier werkdagen;

      c. op de dag van het huwelijk van bloed- en aanverwanten in de eerste, tweede en derde graad;

      d. bij bevalling van zijn echtgenote: twee werkdagen;

      e. op de dag van zijn kerkelijke bevestiging en Eerste Heilige Communie en op die van zijn echtgenote, kinderen,
      stief- of pleegkinderen;

      f. op de dag van zijn 10-, 20-, 30- en 40-jarig ambtsjubileum;

      g. op de dag van herdenking van zijn 25- en 40-jarig huwelijks-jubileum;

      h. op de dag van herdenking van het 25-, 40-, 50- en 60-jarig huwelijksjubileum van zijn ouders, stief-, schoon-,
      pleeg- of grootouders;

      i. bij ernstige ziekte van zijn echtgenote, ouders, stief-, schoon- of pleegouders, kinderen, stief- of
      pleegkinderen: ten hoogste vijftien dagen; mocht blijken dat dit aantal in bepaalde omstandigheden niet toereikend
      is, dan kan [artikel 29][ref1] toepassing vinden;

      j. bij overlijden van echtgenote, ouders, stief-, schoon- of pleegouders, kinderen, stief- of pleegkinderen: twee
      werkdagen;

      k. bij overlijden van grootouders, huisgenoten en bloed- en aanverwanten tot en met de derde graad: één werkdag;

      l. op de dag vóór en op de dagen waarop een examen ter verkrijging van een wettelijk erkend diploma wordt afgelegd.

      II. a. indien hij gehuwd is of een eigen huishouding heeft, bij verhuizing op het eiland waar hij zijn standplaats
      heeft; twee dagen, en in geval van verhuizing naar een ander eiland: twee dagen zowel vóór het vertrek naar als na
      aankomst op de nieuwe standplaats;

      b. indien hij ongehuwd is en geen eigen huishouding heeft, bij verhuizing naar een ander eiland: één dag vóór het
      vertrek naar de nieuwe standplaats.

      III. a. voor het bijwonen van vergaderingen of zittingen van of het verrichten van werkzaamheden voor
      publiekrechtelijke colleges of commissies, waarin de ambtenaar is benoemd of aangewezen, en voor zover zulks niet
      in vrije tijd kan geschieden;

      b. voor het voldoen aan een wettelijke verplichting, een en ander voor zover dit niet in vrije tijd kan geschieden
      en omzetting van dienst niet mogelijk is.

      2 Tenzij de belangen van de dienst zich daartegen verzetten wordt jaarlijks op de daartoe strekkend mondeling of
      schriftelijk verzoek van de ambtenaar door het bevoegd gezag ten hoogste vijftien dagen vrijstelling van dienst
      wegens bijzondere omstandigheden, met behoud van vol inkomen, verleend voor het bijwonen van vergaderingen van
      statutaire organen van verenigingen van ambtenaren, van centrale organisaties waarbij deze verenigingen zijn
      aangesloten of van internationale ambtenarenorganisaties, mits de ambtenaar hieraan deelneemt:

      a. voor zover betreft vergaderingen van verenigingen van ambtenaren als bestuurslid van die vereniging dan wel als
      afgevaardigde of bestuurslid van een onderdeel daarvan;

      b. voor zover betreft vergaderingen van centrale organisaties waarbij verenigingen van ambtenaren zijn aangesloten,
      als bestuurslid van die centrale organisatie dan wel als afgevaardigde of bestuurslid van een bij die organisatie
      aangesloten vereniging van ambtenaren;

      c. voor zover betreft vergaderingen van een internationale ambtenarenorganisatie als bestuurslid van deze
      organisatie dan wel als afgevaardigde of bestuurslid van een bij die organisatie aangesloten vereniging van
      ambtenaren.

      De vrijstelling van dienst wegens bijzondere omstandigheden in de vorige zin bedoeld, wordt slechts verleend
      aan ambtenaren, die lid zijn van verenigingen van ambtenaren, welke zijn vertegenwoordigd in een Commissie voor
      Georganiseerd Overleg in Ambtenarenzaken, of van verenigingen van onderwijzend personeel, die het personeel van
      het bijzonder, uit de openbare kas bekostigde onderwijs mede omvatten, en naar het oordeel van Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties ten minste voor het onderwijzend personeel van het openbaar onderwijs
      voldoende representatief zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel29
    url: https://wetten.overheid.nl/BWBR0028606/2022-01-01#Artikel26
