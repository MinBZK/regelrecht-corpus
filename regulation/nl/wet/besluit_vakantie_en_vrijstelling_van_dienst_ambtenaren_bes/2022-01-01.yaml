  - number: '36'
    text: |-
      1 De ambtenaar aan wie vrijstelling van dienst wegens ziekte is verleend van drie maanden of meer, mag de
      uitoefening van zijn dienst niet hervatten, dan nadat uit een verklaring van de geneeskundige(n), bedoeld in
      [artikel 33, vierde lid][ref1], blijkt, dat de betrokken ambtenaar is onderzocht en in staat is bevonden tot
      hervatting van zijn dienstuitoefening.

      2 De ambtenaar die aan het einde van een tot de maximumduur genoemd in [artikel 31][ref2] verlengde vrijstelling
      van dienst wegens ziekte volgens een verklaring afgegeven door de geneeskundige(n), bedoeld in het eerste lid, niet
      geschikt is bevonden om zijn dienstuitoefening te hervatten, wordt, behoudens het bepaalde in het volgende lid,
      eervol ontslag uit de overheidsdienst verleend.

      3 Indien de geneeskundige(n), bedoeld in het eerste lid, van oordeel is dat hervatting van de dienstuitoefening
      door de betrokken ambtenaar niet mogelijk is wegens een opgekomen ziekte van voorbijgaande aard, wordt hem voor de
      duur van die ziekte vrijstelling van dienst wegens bijzondere omstandigheden met behoud van zeventig ten honderd
      van zijn vol inkomen verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel33
