  - number: 6a
    text: |-
      Voor zover de ambtenaar ten aanzien van wie een dienstrooster als bedoeld in
      [artikel 37 van het Rechtspositiebesluit ambtenaren BES][ref1] is vastgesteld, vakantie is verleend op een tijd
      waarop hij volgens het dienstrooster niet gehouden is werkzaamheden te verrichten, maar wel op de werkplaats
      beschikbaar moet zijn, wordt slechts de helft van die tijd als genoten vakantie-uren aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel37
