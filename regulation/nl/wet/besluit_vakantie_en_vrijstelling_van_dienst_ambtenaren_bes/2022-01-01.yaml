  - number: '16'
    text: |-
      1 Ter compensatie van de door de ambtenaar bij zijn overlijden niet genoten vakantie-uren, daaronder begrepen door
      de overledene ten behoeve van levensfaseverlof gespaarde vakantie-uren, wordt door de overheid aan de weduwe of
      weduwnaar een geldsbedrag uitbetaald gelijk aan het bedrag dat aan de ambtenaar aan inkomen zou zijn uitgekeerd
      gedurende de vakantie of het levensfaseverlof, indien de vakantie of het levensfaseverlof zou zijn genoten. Bij de
      vaststelling van het aantal niet genoten vakantieuren vindt [artikel 10][ref1] geen toepassing.

      2 Indien de overledene geen weduwe of weduwnaar nalaat, geschiedt de uitbetaling ten behoeve van de minderjarige
      kinderen. Onder kinderen worden in dit lid verstaan natuurlijke kinderen en kinderen waarover de overledene de
      pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt in dit lid verstaan de zorg voor het onderhoud en de
      opvoeding van een kind als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten
      van een vergoeding daarvoor. Ontbreken ook kinderen, dan geschiedt de betaling van de vakantie-uitkering aan
      degenen die geheel of grotendeels afhankelijk waren van de bezoldiging van de overledene. Laat de overledene ook
      geen betrekkingen na als bedoeld in de vorige volzin, dan wordt de vakantie-uitkering geheel of ten dele aangewend
      voor de betaling van de kosten van de laatste ziekte en van de lijkbezorging, voor zover de nalatenschap van de
      overledene voor de betaling van die kosten ontoereikend is.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel10
