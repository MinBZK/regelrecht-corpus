  - number: '6'
    text: |-
      1 Behoudens het bepaalde in [artikel 7][ref1] vervalt de aanspraak op vakantie-uren na verloop van een jaar na de
      laatste dag van het kalenderjaar waarin de aanspraak is ontstaan.

      2 Dit artikel is niet van toepassing op vakantie-uren die de ambtenaar op grond van [artikel 8a][ref2] heeft
      gespaard ten behoeve van levensfaseverlof.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel7
