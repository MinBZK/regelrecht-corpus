  - number: '15'
    text: |-
      1 Het bevoegd gezag kan toestaan, dat een ambtenaar in enig kalenderjaar meer uren vakantie opneemt dan zijn
      aanspraak tot en met het lopende jaar bedraagt, met dien verstande, dat de opgenomen vakantie de aanspraak tot en
      met het lopende jaar nooit met meer dan 39,5 uren mag overschrijden.

      2 Voor de ambtenaar voor wie de geldende werktijd korter is dan de gebruikelijke volledige werktijd, wordt het in
      het eerste lid genoemde aantal uren vermenigvuldigd met de voor de ambtenaar geldende arbeidsduurfactor.

      3 De in een kalenderjaar te veel genoten vakantie wordt in mindering gebracht op de aanspraak op de vakantie-uren
      waarop betrokkene op grond van [artikel 5][ref1] aanspraak heeft over het eerstvolgende kalenderjaar.

      4 Indien op de dag van zijn ontslag blijkt, dat de ambtenaar te veel vakantie heeft genoten, is hij voor ieder uur
      teveel genoten vakantie een bedrag verschuldigd ten bedrage van de bezoldiging per uur.

      5 [Artikel 10, vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028606#Artikel10
