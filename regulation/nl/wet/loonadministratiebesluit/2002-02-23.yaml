  - number: '9'
    text: Het model van de jaaropgavekaart wordt door het Uitvoeringsinstituut werknemersverzekeringen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004265/2002-02-23#Artikel9
  - number: '10'
    text: Het Uitvoeringsinstituut werknemersverzekeringen verstrekt de werkgever de bedoelde jaaropgavenkaarten.
    url: https://wetten.overheid.nl/BWBR0004265/2002-02-23#Artikel10
  - number: '11'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd van een werkgever, die niet hier te lande is gevestigd
      en naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen niet regelmatig zijn werkzaamheden hier
      te lande uitoefent, binnen de door het Uitvoeringsinstituut werknemersverzekeringen schriftelijk te stellen termijn
      loonopgaven te vorderen.
    url: https://wetten.overheid.nl/BWBR0004265/2002-02-23#Artikel11
  - number: '12'
    text: |-
      1 De werkgever is verplicht de jaaropgavekaarten in te leveren in de maand januari van het kalenderjaar, volgende
      op dat, waarvoor zij gelden.

      2 Indien de werkgever in de loop van een kalenderjaar zijn bedrijf of beroep definitief staakt, is hij verplicht
      binnen 14 dagen na die staking de jaaropgavekaarten in te leveren.

      3 De inlevering van de jaaropgavekaart dient te geschieden bij Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004265/2002-02-23#Artikel12
  - number: '13'
    text: |-
      1 Onverminderd het bepaalde in [artikel 8][ref1], is de werkgever verplicht, over een door het Uitvoeringsinstituut
      werknemersverzekeringen schriftelijk aan te geven periode:

      a. opgave te doen van het totaal aan loon van de bij hem in dienst zijnde werknemers;

      b. opgave te doen van alle gegevens die noodzakelijk zijn voor de vaststelling van het loon van elk van de bij hem
      in dienst zijnde werknemers. Deze opgave bevat tenminste: naam en voorletter(s); geboortedatum; het aantal gewerkte
      dagen in de in het verzoek aangegeven periode; de data van de dagen waarop is gewerkt, dan wel, indien dit in het
      verzoek is aangegeven, het aantal dagen waarover loon is genoten; het voor premieberekening sociale verzekering in
      aanmerking komende loon, desgevraagd gesplitst per wet, genoten in de in het verzoek aangegeven periode.

      2 De werkgever is verplicht de in het eerste lid bedoelde opgaven schriftelijk aan het Uitvoeringsinstituut
      werknemersverzekeringen te doen toekomen binnen 10 dagen na afloop van de periode, waarop deze opgaven betrekking
      hebben, dan wel binnen een andere door het Uitvoeringsinstituut werknemersverzekeringen schriftelijk te stellen
      termijn.

      3 De werkgever is verplicht aan het Uitvoeringsinstituut werknemersverzekeringen uit eigen beweging mededeling
      te doen van elke verandering in de loonsom gedurende het premiebetalingstijdvak, welke er toe leidt dat het
      feitelijk verloonde bedrag meer dan 5%, doch ten minste een bedrag van € 2269 hoger is dan het loonbedrag waarop de
      voorschotnota is gebaseerd.

      Deze mededeling dient te geschieden binnen drie maanden na bedoelde verandering.


      [ref1]: https://wetten.overheid.nl/BWBR0004265#Artikel8
