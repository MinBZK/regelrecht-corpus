  - number: '2'
    text: Het model van de loonstaat wordt door het Uitvoeringsinstituut werknemersverzekeringen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004265/2002-02-23#Artikel2
  - number: '3'
    text: |-
      1 De werkgever is bevoegd een loonstaat bij te houden, welke afwijkt van het op grond van [artikel 2][ref1]
      vastgestelde model, mits deze loonstaat ten minste voldoet aan de eisen, waaraan blijkens de modelloonstaat moet
      worden voldaan.

      2 De inspecteur der belastingen, onder wiens inspectie de loonboekhouding wordt gehouden, is bevoegd, in
      overeenstemming met het Uitvoeringsinstituut werknemersverzekeringen, de in het eerste lid genoemde bevoegdheid aan
      de werkgever te ontnemen, indien naar zijn oordeel de administratie zodanig is ingericht of op zodanige wijze wordt
      gevoerd, dat een behoorlijke controle niet gewaarborgd is.


      [ref1]: https://wetten.overheid.nl/BWBR0004265#Artikel2
    url: https://wetten.overheid.nl/BWBR0004265/2002-02-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004265
        artikel: '2'
        paragraaf: '1'
  - number: '4'
    text: |-
      De in [artikel 3][ref1] bedoelde inspecteur kan, in overeenstemming met het Uitvoeringsinstituut
      werknemersverzekeringen, onder door hem te stellen voorwaarden, goedkeuren dat de werkgever een loonstaat bijhoudt,
      die niet voldoet aan de eisen van het op grond van [artikel 2][ref2] vastgestelde model. De goedkeuring kan te
      allen tijde worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004265#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004265#Artikel2
    url: https://wetten.overheid.nl/BWBR0004265/2002-02-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004265
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004265
        artikel: '2'
        paragraaf: '1'
  - number: '5'
    text: |-
      De loonstaten, of de bescheiden die in de plaats daarvan moeten worden bijgehouden, moeten worden gehouden ten
      kantore van de werkgever, waar de loonadministratie wordt gevoerd, tenzij door de in [artikel 3][ref1] bedoelde
      inspecteur, in overeenstemming met het Uitvoeringsinstituut werknemersverzekeringen, daartoe een andere plaats is
      aangewezen, in welk geval zij daar ter plaatse moeten worden bijgehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004265#Artikel3
    url: https://wetten.overheid.nl/BWBR0004265/2002-02-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004265
        artikel: '3'
        paragraaf: '1'
  - number: '7'
    text: |-
      De werkgever is verplicht het Uitvoeringsinstituut werknemersverzekeringen op diens verzoek en binnen een door
      dat orgaan schriftelijk te stellen termijn de loonstaten tijdelijk ter beschikking te stellen. Indien het verzoek
      loonstaten betreft van het lopende kalenderjaar, kan de werkgever volstaan met het toesturen van afschriften van de
      gevraagde loonstaten.
    url: https://wetten.overheid.nl/BWBR0004265/2002-02-23#Artikel7
  - number: '8'
    text: |-
      1 De werkgever is verplicht na het einde van het kalenderjaar voor iedere werknemer een jaaropgavekaart in
      te vullen conform de aanwijzingen van het bij [artikel 9][ref1] van dit besluit vastgestelde model, tenzij
      de op de jaaropgavekaart te verstrekken gegevens overeenkomstig daartoe door het Uitvoeringsinstituut
      werknemersverzekeringen gegeven aanwijzingen worden verstrekt met behulp van geautomatiseerd te verwerken
      gegevensdragers.

      2 In afwijking van het eerste lid is het Uitvoeringsinstituut werknemersverzekeringen bevoegd aan een werkgever
      die naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen de verplichtingen neergelegd in het
      [Besluit melding sociale verzekeringen][ref2] correct nakomt, toe te staan een door het Uitvoeringsinstituut
      werknemersverzekeringen vastgesteld model vereenvoudigde jaaropgave in te dienen, onder daartoe door het
      Uitvoeringsinstituut werknemersverzekeringen nader te stellen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0004265#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004559
    url: https://wetten.overheid.nl/BWBR0004265/2002-02-23#Artikel8
    references:
