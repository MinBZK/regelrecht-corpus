  text: |-
    Gelet op artikel 10 van de Coördinatiewet Sociale Verzekering (Stb. 1987, 552);

    Gehoord de Sociale Verzekeringsraad,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004265/2002-02-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De werkgever is verplicht voor iedere werknemer vóór de eerste loonverstrekking een loonstaat aan te leggen en
      deze vervolgens bij te houden overeenkomstig de aanwijzingen van het op grond van [artikel 2][ref1] vastgestelde
      model.

      2 De in het eerste lid bedoelde verplichting geldt niet:

      a. indien reeds op grond van de [Uitvoeringsregeling loonbelasting 2001][ref2] een zodanige loonstaat dient te
      worden aangelegd en bijgehouden dan wel

      b. indien en voor zo lang de werkgever op grond van een besluit van de Minister van Financiën gebruik maakt van
      zijn bevoegdheid als inhoudingsplichtige voor de [Wet op de loonbelasting 1964][ref3] (Stb. 1990, 104) tot het
      vertraagd aanleggen en/of bijhouden van een loonstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004265#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012059
      [ref3]: https://wetten.overheid.nl/BWBR0002471
