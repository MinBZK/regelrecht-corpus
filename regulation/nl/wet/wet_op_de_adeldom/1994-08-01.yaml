$id: wet_op_de_adeldom
regulatory_layer: WET
publication_date: '2002-06-11'
valid_from: '1994-08-01'
bwb_id: BWBR0006667
url: https://wetten.overheid.nl/BWBR0006667/1994-08-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat op grond van additioneel artikel XXV van de Grondwet een voorziening
    moet worden getroffen ter zake van de adeldom;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006667/1994-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: Adeldom wordt verleend bij koninklijk besluit. De verlening kan uitsluitend geschieden aan Nederlanders.
    url: https://wetten.overheid.nl/BWBR0006667/1994-08-01#Artikel1
  - number: '2'
    text: |-
      1 De verlening van adeldom geschiedt door verheffing, inlijving of erkenning.

      2 Verheffing in de adel bij koninklijk besluit kan uitsluitend plaatsvinden ten aanzien van leden van het
      koninklijk huis.

      3 Inlijving in de Nederlandse adel kan slechts plaatsvinden ten aanzien van personen wier geslacht behoort tot de
      wettelijk erkende adel van een staat met een vergelijkbaar adelsstatuut en die het verzoek tot inlijving hebben
      gedaan.

      a. te zamen met het verzoek tot verlening van het Nederlanderschap;

      b. te zamen met het afleggen van de verklaring ter verkrijging van het Nederlanderschap door optie;

      c. te zamen met het bereiken van de meerderjarigheid bij de verkrijging van het Nederlanderschap van rechtswege
      indien de vader van de verzoeker het Nederlanderschap niet van rechtswege heeft verkregen.

      4 Erkenning te behoren tot de Nederlandse adel kan uitsluitend plaatsvinden ten aanzien van personen die behoren
      tot een geslacht dat voor 1795 reeds tot de inheemse adel behoorde.
    url: https://wetten.overheid.nl/BWBR0006667/1994-08-01#Artikel2
  - number: '3'
    text: |-
      Adeldom gaat ook volgens de bestaande regelingen met betrekking tot adeldom over op buiten het huwelijk geboren
      kinderen.
    url: https://wetten.overheid.nl/BWBR0006667/1994-08-01#Artikel3
  - number: '4'
    text: |-
      Bij de verlening van adeldom zijn taxa verschuldigd. Bij algemene maatregel van bestuur worden nadere regels
      omtrent de taxa gesteld.
    url: https://wetten.overheid.nl/BWBR0006667/1994-08-01#Artikel4
  - number: '5'
    text: |-
      Adeldom wordt vermeld op officiële documenten waar dit vereist is, tenzij de betrokken persoon verzoekt, de
      vermelding achterwege te laten of te verwijderen.
    url: https://wetten.overheid.nl/BWBR0006667/1994-08-01#Artikel5
  - number: '6'
    text: |-
      1 Er is een Hoge Raad van Adel.

      2 De Raad heeft tot taak Onze Minister van Binnenlandse Zaken te adviseren over verzoeken tot verlening van
      adeldom.

      3 De Raad is samengesteld uit vijf leden, die bij koninklijk besluit worden benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0006667/1994-08-01#Artikel6
  - number: '7'
    text: |-
      1

      2 De bestaande regelingen met betrekking tot adeldom en de Hoge Raad van Adel kunnen worden gewijzigd bij algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0006667/1994-08-01#Artikel7
  - number: '8'
    text: |-
      Inlijving in de Nederlandse adel kan plaatsvinden ten aanzien van personen wier geslacht behoort tot de wettelijk
      erkende adel van een staat met een vergelijkbaar adelsstatuut en daartoe een verzoek om inlijving hebben gedaan
      binnen vijf jaar na de datum van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0006667/1994-08-01#Artikel8
  - number: '9'
    text: Deze wet kan worden aangehaald als Wet op de adeldom.
    url: https://wetten.overheid.nl/BWBR0006667/1994-08-01#Artikel9
