  - number: '2'
    text: |-
      Er is een Protocol mijnbouwschade Groningen voor de afwikkeling van aanvragen tot vergoeding van schade. Dit
      protocol is opgenomen in [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040584
    url: https://wetten.overheid.nl/BWBR0040584/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0040584
  - number: '3'
    text: |-
      1 Er is een Tijdelijke commissie mijnbouwschade Groningen.

      2 De Commissie heeft tot taak:

        - te besluiten op aanvragen tot vergoeding van schade en de overlastvergoeding als bedoeld in [bijlage 2][ref1],
      met overeenkomstige toepassing van het civielrechtelijke aansprakelijkheids- en schadevergoedingsrecht;
        - het nemen van beslissingen op bezwaar tegen besluiten als hiervoor bedoeld;
        - het voeren van beroepsprocedures tegen beslissingen op bezwaar en het voeren van hoger beroepsprocedures tegen
      uitspraken van de rechtbank over de genomen beslissingen op bezwaar.

      3 De Commissie kan zich laten bijstaan door deskundigen.

      4 De Commissie kan aan de Minister van Economische Zaken en Klimaat aanbevelingen doen die zij wenselijk acht met
      het oog op een doelmatige en voortvarende uitvoering van haar taken.

      5 De Minister van Economische Zaken en Klimaat stelt personeel en huisvesting ter beschikking aan de Commissie.

      6 De Commissie bestaat uit een voorzitter, tevens lid, en ten minste twee andere leden.

      7 Aan de leden van de Commissie wordt, ieder voor zich mandaat, volmacht en machtiging verleend voor
      aangelegenheden die verband houden met de in het tweede respectievelijk derde lid bedoelde taken waaronder
      begrepen het nemen van besluiten, het verrichten van privaatrechtelijke rechtshandelingen en overige handelingen
      op het gebied van de [Wet openbaarheid van bestuur][ref2], de Algemene verordening gegevensbescherming, de
      [Wet hergebruik overheidsinformatie][ref3] en voor de afhandeling van interne klachten en verzoeken van de
      Nationale Ombudsman.

      8 Aan de voorzitter van de Commissie wordt tevens mandaat, volmacht en machtiging verleend voor het nemen van
      besluiten voor de personele aangelegenheden van de Commissie.

      10 De voorzitter van de Commissie kan aan een lid van de Commissie ondermandaat, volmacht en machtiging verlenen
      binnen zijn werkterrein voor het nemen van besluiten voor personele aangelegenheden van de Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0040584
      [ref2]: https://wetten.overheid.nl/BWBR0005252
      [ref3]: https://wetten.overheid.nl/BWBR0036795
    url: https://wetten.overheid.nl/BWBR0040584/2020-07-01#Artikel3
