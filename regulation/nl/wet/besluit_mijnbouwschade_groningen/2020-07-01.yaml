  - number: '14'
    text: |-
      1 Aanvragen tot vergoeding van schade waarvoor door de vergunninghouder al schade is vergoed of waarvoor door de
      vergunninghouder geen schadevergoeding is toegekend dan wel waarvoor een schademelding die voor 31 maart 2017,
      12:00 uur is voorgelegd aan de Commissie Veilig Wonen of een schademelding of -claim die bij vergunninghouder in
      behandeling is of hiertoe een vordering bij de burgerlijke rechter is ingesteld, worden door de Commissie niet in
      behandeling genomen.

      2 De Commissie kan afwijken van het eerste lid ten einde onbillijkheden van overwegende aard te voorkomen.
    url: https://wetten.overheid.nl/BWBR0040584/2020-07-01#Artikel14
