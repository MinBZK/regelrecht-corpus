articles:
  - number: '1'
    text: |-
      In dit besluit en de hierbij behorende bijlagen wordt verstaan onder:

        - *Commissie:* de Tijdelijke commissie mijnbouwschade Groningen, bedoeld in [artikel 3][ref1];
        - *Commissie advisering bezwaarschriften:* de Tijdelijke commissie advisering bezwaarschriften mijnbouwschade
      Groningen, bedoeld in [artikel 9][ref2];
        - *gebouwen en werken:* gebouwen en werken met uitzondering van: a. industriegebouwen zoals gebouwen voor
      de vervaardiging van chemische producten; b. infrastructurele werken zoals openbare wegen, openbare bruggen,
      openbare riolering, dijken en netten als bedoeld in [artikel 1 van de Elektriciteitswet 1998][ref3] en
      [artikel 1 van de Gaswet][ref4];
        - *schade:* a. fysieke schade aan gebouwen en werken die is ontstaan door beweging van de bodem als gevolg van
      de aanleg of de exploitatie van een mijnbouwwerk ten behoeve van het winnen van gas uit het Groningenveld of als
      gevolg van de gasopslag Norg, en b. materiële schade die het gevolg is van deze fysieke schade;
        - *Protocol:* het Protocol mijnbouwschade Groningen, bedoeld in [artikel 2][ref5];
        - *vergunninghouder:* de houder van de bij koninklijk besluit van 30 mei 1963, nr. 39 (Stcrt. 126) verleende
      winningsvergunning en de houder van de opslagvergunning voor de gasopslag Norg.


