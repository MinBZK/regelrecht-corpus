  - number: '7'
    text: |-
      1 De leden van de Commissie, het aan haar ter beschikking gestelde personeel en de door de Commissie ingeschakelde
      deskundigen verlangen of ontvangen geen instructies van derden die op een individuele zaak betrekking hebben.

      2 De leden brengen op persoonlijke titel hun kennis en ervaring in en treden niet op als vertegenwoordiger van een
      specifieke belangengroep.
    url: https://wetten.overheid.nl/BWBR0040584/2020-07-01#Artikel7
  - number: '8'
    text: |-
      1 De Commissie brengt periodiek en in elk geval een maal per jaar aan de Minister van Economische Zaken en
      Klimaat en de Minister voor Rechtsbescherming een verslag uit over haar werkzaamheden van het afgelopen jaar.
      In dit verslag wordt in elk geval aandacht besteed aan de door de Commissie gehanteerde werkwijze, procedures en
      beoordelingsmethodiek.

      2 De Commissie verstrekt desgevraagd aan de Minister van Economische Zaken en Klimaat en de Minister voor
      Rechtsbescherming de voor de uitoefening van hun taken benodigde inlichtingen. De ministers kunnen, voor zover dat
      voor de vervulling van hun taak redelijkerwijs nodig is, inzage vorderen van zakelijke gegevens en bescheiden.

      3 Het beheer van de bescheiden betreffende de werkzaamheden van de Commissie geschiedt op overeenkomstige wijze als
      bij het Ministerie van Economische Zaken en Klimaat. De bescheiden worden na beëindiging van de werkzaamheden van
      de Commissie bewaard in het archief van dat ministerie.
    url: https://wetten.overheid.nl/BWBR0040584/2020-07-01#Artikel8
  - number: '9'
    text: |-
      1 Er is een Tijdelijke commissie advisering bezwaarschriften mijnbouwschade Groningen.

      2 De Commissie advisering bezwaarschriften heeft tot taak de Commissie te adviseren over te nemen beslissingen op
      bezwaar in verband met besluiten als bedoeld in [artikel 3, tweede lid][ref1].

      3 Aan de voorzitter van de Commissie advisering bezwaarschriften mijnbouwschade Groningen wordt mandaat, volmacht
      en machtiging verleend voor het nemen van besluiten en het verrichten van privaatrechtelijke rechtshandelingen en
      overige handelingen die verband houden met de in het tweede lid bedoelde taken.

      4 Aan de voorzitter van de Commissie advisering bezwaarschriften mijnbouwschade Groningen wordt tevens mandaat,
      volmacht en machtiging verleend voor het nemen van besluiten voor de personele aangelegenheden van de Commissie
      advisering bezwaarschriften mijnbouwschade Groningen.

      5 De voorzitter van de Commissie advisering bezwaarschriften mijnbouwschade Groningen kan binnen zijn werkterrein
      aan een lid van de Commissie advisering bezwaarschriften mijnbouwschade Groningen, ondermandaat, volmacht en
      machtiging verlenen voor het nemen van besluiten en het verrichten van privaatrechtelijke rechtshandelingen en
      overige handelingen die verband houden met de in het tweede lid bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0040584#Artikel3
