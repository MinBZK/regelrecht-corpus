  - number: '4'
    text: |-
      1 De voorzitter van de Commissie en de andere leden worden, na consultatie, door de Minister voor Rechtsbescherming
      benoemd voor een termijn van twee jaar.

      2 De voorzitter van de Commissie is, evenals één van de leden, meester in de rechten en kan bogen op ruime ervaring
      in de rechtspraak. Het andere lid dient te beschikken over een technische achtergrond, waarbij dient te worden
      beschikt over diepgaande en actuele kennis van de oorzaken en gevolgen van de aardbevingen in Groningen.

      3 De voorzitter en leden van de Commissie zijn onafhankelijk en bij hun benoeming wordt aandacht besteed aan de
      eventuele betrokkenheid van leden bij de aardbevingsproblematiek in Groningen.

      4 De voorzitter en de andere leden kunnen door de Minister voor Rechtsbescherming worden geschorst en ontslagen.

      5 Schorsing en ontslag vindt plaats:

      a. wegens ongeschiktheid of onbekwaamheid voor de vervulde functie dan wel wegens andere zwaarwegende in de persoon
      van de betrokkene gelegen redenen; of

      b. op eigen verzoek van de voorzitter of andere leden.

      6 Er kunnen voor de voorzitter van de Commissie en andere leden plaatsvervangers worden benoemd. Het eerste tot en
      met het vijfde lid en het zevende lid zijn van overeenkomstige toepassing.

      7 De uit dit besluit voor de voorzitter van de Commissie voortvloeiende bevoegdheden gaan in geval van zijn
      afwezigheid over op zijn plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0040584/2020-07-01#Artikel4
  - number: '5'
    text: |-
      1 Aan de voorzitter, andere leden en deskundigen wordt een vaste vergoeding per maand toegekend, waarbij:

      a. voor de voorzitter en niet-technische leden de salarisschaal wordt vastgesteld op schaal 18 van
      [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1];

      b. voor de technische leden en deskundigen een uurtarief wordt vastgesteld van € 175.

      2 De arbeidsduurfactor wordt vastgesteld op 0,444 en kan worden aangepast door de Minister van Economische Zaken en
      Klimaat indien hiertoe aanleiding is. Onze Minister van Economische Zaken en Klimaat maakt de aanpassing bekend in
      de Staatscourant.

      3 Personen die een functie vervullen bij instellingen of organisaties als bedoeld in de
      __REF000___________________________________________________________________________________________________________
      _____ ontvangen geen vergoeding op grond van de [Wet vergoedingen adviescolleges en commissies][ref3].


