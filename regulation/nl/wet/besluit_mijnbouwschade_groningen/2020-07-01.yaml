  - number: '6'
    text: |-
      1 De Commissie stelt haar eigen werkwijze vast met inachtneming van het Protocol en maakt deze werkwijze bekend.

      2 Door de vaststelling van verschillende procedures voor verschillende gevallen streeft de Commissie naar een
      korte doorlooptijd, naar beheersbare proceskosten, naar de benodigde inhoudelijke zorgvuldigheid en uitkomsten die
      redelijk en billijk zijn. De Commissie onderbouwt haar keuzes en stelt hierover eens per jaar een verslag op als
      bedoeld in [artikel 8][ref1].

      3 De Commissie baseert de procedures op de opgetreden bodembeweging, de aard of de omvang van de schade dan wel een
      combinatie hiervan, een en ander steeds met inachtneming van het belang van veiligheid van gebouwen en werken als
      bedoeld in [artikel 1][ref2].

      4 De werkwijze omvat een prioritering van de te behandelen zaken met als uitgangspunt dat zaken zo snel mogelijk
      afgehandeld kunnen worden.

      5 De werkwijze omvat voorts de wijze waarop onderzoek wordt verricht, de kwaliteitseisen die gesteld worden aan de
      door de Commissie ingeschakelde deskundigen, de werkwijze van de deskundigen en de vergoeding van hun kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0040584#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0040584#Artikel1
