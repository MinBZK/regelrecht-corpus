  - number: '11'
    text: |-
      1 Schademeldingen die in de van periode 31 maart 2017, 12:00 uur tot 19 maart 2018 zijn voorgelegd aan het Centrum
      Veilig Wonen en bij het Centrum in behandeling zijn, worden geacht een aanvraag tot vergoeding van schade als
      bedoeld in [artikel 2][ref1] te zijn.

      2 De Commissie neemt de zaken bedoeld in het eerste lid over in de staat waarin deze zich bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0040584#Artikel2
