  - number: '12'
    text: |-
      Geschillen die voor 19 maart 2018 door de Raad van Arbiters Bodembeweging in behandeling zijn genomen en op
      19 maart 2018 nog in behandeling zijn, worden door de Raad van Arbiters Bodembeweging afgehandeld, tenzij de
      geschilbeslechtingsprocedure door de eigenaar wordt beëindigd volgens de procedure van artikel 16 van het Reglement
      arbiter bodembeweging. In dat geval kan voor hetzelfde geschil een aanvraag worden ingediend bij de Commissie.
      De Commissie behandelt deze aanvraag met inachtneming van de reeds in de geschilbeslechtingsprocedure gewisselde
      stukken.
    url: https://wetten.overheid.nl/BWBR0040584/2020-07-01#Artikel12
  - number: 12a
    text: |-
      Geschillen over schademeldingen die voor 31 maart 2017, 12:00 uur zijn voorgelegd aan het Centrum Veilig Wonen
      en op 19 maart 2018 bij het Centrum in behandeling zijn kunnen aan de Raad van Arbiters Bodembeweging worden
      voorgelegd.
    url: https://wetten.overheid.nl/BWBR0040584/2020-07-01#Artikel12a
  - number: '13'
    text: |-
      De Commissie kan, vooruitlopend op een volledige werkwijze als bedoeld in [artikel 6][ref1], een werkwijze
      vaststellen om aanvragen te behandelen waarvan eenvoudig is vast te stellen dat de schade is veroorzaakt door
      bodembeweging als gevolg van de aanleg of de exploitatie van een mijnbouwwerk ten behoeve van het winnen van gas
      uit het Groningenveld of als gevolg van de gasopslag Norg.


      [ref1]: https://wetten.overheid.nl/BWBR0040584#Artikel6
