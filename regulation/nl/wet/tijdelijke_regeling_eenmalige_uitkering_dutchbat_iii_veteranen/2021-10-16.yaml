preamble:
  text: |-
    Gelet op artikel 115 van het Algemeen militair ambtenarenreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0045697/2021-10-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *Dutchbat-III-veteraan:* de militair of gewezen militair van de Nederlandse krijgsmacht die in de periode van
      6 januari 1995 tot en met 14 juli 1995 aan de VN-operatie in en nabij Srebrenica deel heeft genomen en op grond
      daarvan in aanmerking is gebracht voor het draaginsigne DB-III;
        - *Nabestaande:* degene die ten tijde van het overlijden van de Dutchbat-III-veteraan de echtgenoot, echtgenote
      of geregistreerd partner van de overleden Dutchbat-III-veteraan is of degene die door de Dutchbat-III-veteraan bij
      diens pensioenfonds is aangemeld als partner en door dit pensioenfonds als zodanig is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0045697/2021-10-16#Artikel1
  - number: '2'
    text: |-
      De Dutchbat-III-veteraan ontvangt ambtshalve een eenmalige uitkering ter hoogte van het bedrag genoemd in
      [artikel 5][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0045697#Artikel5
    url: https://wetten.overheid.nl/BWBR0045697/2021-10-16#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0045697
        artikel: '5'
  - number: '3'
    text: |-
      Indien de Dutchbat-III veteraan ten tijde van inwerkingtreden van deze regeling is overleden ontvangt de
      nabestaande de eenmalige uitkering bedoeld in [artikel 2][ref1]. Indien de nabestaande reeds is overleden, wordt
      voor de toepassing van deze regeling het bedrag zoals genoemd in [artikel 5][ref2] toegekend aan het kind van de
      Dutchbat-III-veteraan, of bij meerdere kinderen aan hen gezamenlijk, op voorwaarde dat een verklaring van erfrecht
      wordt overgelegd. Indien de overleden Dutchbat-III-veteraan noch kinderen noch een nabestaande heeft in de zin van
      deze regeling, zijn diens ouders gezamenlijk gerechtigd tot het ontvangen van deze eenmalige uitkering. Voor het
      geval dat de Dutchbat-III-veteraan geen kinderen heeft nagelaten, en zowel de nabestaande als ook de ouders van de
      Dutchbat-III-veteraan zijn overleden, bestaat geen aanspraak op het in artikel 5 genoemde geldbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0045697#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045697#Artikel5
    url: https://wetten.overheid.nl/BWBR0045697/2021-10-16#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0045697
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045697
        artikel: '5'
  - number: '4'
    text: |-
      Voor zover er meer dan één gerechtigde is tot het ontvangen van de eenmalige uitkering, dragen zij er zorg voor dat
      aan één van hen een volmacht wordt verleend tot vertegenwoordiging ten behoeve van de uitvoering van deze regeling.
      De volmacht is schriftelijk, ondubbelzinnig en door alle betrokkenen ondertekend.
    url: https://wetten.overheid.nl/BWBR0045697/2021-10-16#Artikel4
  - number: '5'
    text: |-
      Het bedrag bedraagt eenmalig €5.000,- netto per Dutchbat-III-veteraan. Eventueel verschuldigde loonbelasting en
      premies komen ten laste van het Ministerie van Defensie.
    url: https://wetten.overheid.nl/BWBR0045697/2021-10-16#Artikel5
  - number: '6'
    text: |-
      Deze uitkering houdt geen erkenning in van enige juridische aansprakelijkheid en komt niet in mindering op, of
      erkent aanspraak op eerder reeds toegekende of nog toe te kennen individuele vergoedingen op grond van afspraken of
      regelingen zoals de Regeling ereschuld veteranen.
    url: https://wetten.overheid.nl/BWBR0045697/2021-10-16#Artikel6
  - number: '7'
    text: |-
      In de gevallen waarin deze regeling niet voorziet, kan Onze Minister op grond van redelijkheid en billijkheid een
      besluit nemen.
    url: https://wetten.overheid.nl/BWBR0045697/2021-10-16#Artikel7
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van publicatie van de Staatscourant waarin zij
      wordt geplaatst, werkt terug tot en met 1 mei 2021 en vervalt 5 jaar na het tijdstip van inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0045697/2021-10-16#Artikel8
  - number: '9'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke Regeling eenmalige uitkering Dutchbat-III-veteranen.'
    url: https://wetten.overheid.nl/BWBR0045697/2021-10-16#Artikel9
