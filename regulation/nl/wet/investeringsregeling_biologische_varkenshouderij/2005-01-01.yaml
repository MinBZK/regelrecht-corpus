  - number: '5'
    text: |-
      1 De subsidie wordt verleend voor investeringen in productiemiddelen:

      a. waarvan de aanvrager de eerste gebruiker is, en

      b. die gericht zijn op het houden van varkens volgens de normen van de biologische productiemethode en
      in overeenstemming met de op [Landbouwkwaliteitsbesluit biologische productiemethode][ref1] gebaseerde
      publiekrechtelijke voorschriften van Stichting Skal.

      2 Geen subsidie wordt verleend voor:

      a. investeringen die dienen ter vervanging van productiemiddelen die reeds het eigendom zijn van de aanvrager,

      b. de aankoop van varkensrechten, of

      c. investeringen in bedrijfsmiddelen of onderdelen daarvan, gericht op productieverhoging, waarvoor geen
      afnamecontract bestaat.

      3 Geen subsidie wordt verleend voor investeringsprojecten met de uitvoering waarvan een aanvang is gemaakt alvorens
      de ontvangst van de aanvraag tot subsidieverlening schriftelijk aan de aanvrager is bevestigd. Onder het maken van
      een aanvang met de uitvoering van een investering wordt in ieder geval verstaan het aangaan van verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005740
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005740
  - number: '6'
    text: |-
      Als subsidiabele kosten worden uitsluitend in aanmerking genomen de volgende door de aanvrager gemaakte en
      betaalde kosten, voorzover zij noodzakelijk zijn en rechtstreeks zijn toe te rekenen aan de onderdelen van het
      investeringsproject waarop de beschikking tot subsidieverlening betrekking heeft:

      a. de kosten van aangeschafte machines en apparatuur, gebaseerd op de historische aanschafprijzen,

      b. de kosten van de bouw van onroerende zaken, en

      c. de algemene kosten, met name de kosten voor architecten, ingenieurs en adviseurs en installatiekosten, tot een
      maximum van 12% van de onder a en b bedoelde kosten.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel6
  - number: '7'
    text: |-
      1 De subsidie bedraagt 30% van de subsidiabele kosten.

      2 De subsidie bedraagt ten hoogste € 250.000,-.

      3 Indien voor de subsidiabele kosten of een gedeelte daarvan reeds uit anderen hoofde een subsidie of ander
      geldelijk voordeel is of zal worden verleend, wordt slechts een zodanig bedrag aan subsidie verleend dat het totale
      subsidiebedrag niet meer bedraagt dan 40% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel7
  - number: '8'
    text: |-
      1 De aanvraag tot subsidieverlening wordt bij Dienst Regelingen ingediend.

      2 Voor de aanvraag tot subsidieverlening, bedoeld in het eerste lid, maakt de aanvrager gebruik van een daartoe
      vastgesteld formulier.

      3 Door het indienen van het aanvraagformulier verplicht de aanvrager zich tot nakoming van de daarin gestelde
      voorwaarden en verplichtingen en stemt hij in met een doorgifte door Stichting Skal aan Dienst Regelingen van alle
      gegevens betrekking hebbende op de uitoefening van de biologische productiemethode op zijn landbouwbedrijf.

      4 De aanvraag tot subsidieverlening gaat vergezeld van:

      a. een verklaring van een financierende derde waaruit blijkt dat deze de voorgenomen investeringen geheel of voor
      een substantieel deel zal financieren;

      b. een beschrijving van de economische positie van het landbouwbedrijf inhoudende een weergave van het eigen
      vermogen van het bedrijf, een opgave van de beschikbare liquide middelen en de schuldpositie,

      c. een investeringsprojectplan, inhoudende een beschrijving van de begintoestand, de doelstellingen en
      achtergronden van het investeringsproject, de toestand na voltooiing van het investeringsprojectplan, de
      activiteiten, een tijdsplanning van de activiteiten en de wijze van uitvoering;

      d. een gespecificeerde begroting van de beoogde investeringen en een opgave van de financieringswijze van het
      investeringsproject,

      e. in voorkomend geval, de statuten van de rechtspersoon,

      f. in voorkomend geval, het getuigschrift van de landbouwkundige opleiding,

      g. een bedrijfsaansluitingsbevestiging,

      h. een opgaaf van het aantal varkensrechten dat het bedrijf heeft,

      i. een afschrift van het afnamecontract.

      5 Indien geen verklaring als bedoeld in het vierde lid, onderdeel a, wordt overlegd, wordt bij de aanvraag tot
      subsidieverlening overlegd:

      a. een exploitatiebegroting en andere financiële bescheiden over de twee boekjaren volgend op het jaar waarin de
      subsidieaanvraag plaatsvindt waaruit kan worden afgeleid dat het eigen vermogen niet minder dan 15 procent van het
      totale vermogen uitmaakt, nadat de investering, waarvoor de aanvraag tot subsidieverlening wordt ingediend, heeft
      plaatsgevonden,

      b. een meerjarenbegroting over een periode van 5 jaar volgend op het jaar waarin de subsidieaanvraag plaatsvindt,
      en

      c. financiële gegevens, met inbegrip van een jaarrekening, waaruit dient te blijken dat de subsidieaanvrager
      gedurende de drie jaar voorafgaand aan de subsidieaanvraag niet meer dan gedurende één jaar verlies heeft geleden.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: '9'
    text: |-
      De minister geeft de beschikking tot subsidieverlening binnen vier maanden na afloop van de aanvraagperiode waarin
      de aanvraag tot subsidieverlening is ingediend.

      Indien deze termijn niet kan worden gehaald, stelt de minister de aanvrager daarvan in kennis en noemt hij daarbij
      een redelijke termijn waarop de beschikking tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel9
  - number: '10'
    text: |-
      De subsidieverlening kan worden geweigerd indien een gegronde reden bestaat om aan te nemen dat de financiering van
      het project niet toereikend zal zijn.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel10
  - number: '11'
    text: |-
      1 De subsidieontvanger voert het investeringsproject uit:

      a. overeenkomstig het investeringsplan waarop de beschikking tot subsidieverlening betrekking heeft,

      b. in Nederland, behoudens toestemming van de minister tot gedeeltelijke uitvoering buiten Nederland,

      c. binnen achttien maanden na de beschikking tot subsidieverlening.

      2 Wijzigingen in het investeringsplan gedurende de looptijd van het investeringsproject worden aan Dienst
      Regelingen gemeld. De minister kan deze wijzigingen goedkeuren, tenzij het wijzigingen ten aanzien van de
      doelstelling van het investeringsproject betreft.

      3 De subsidieontvanger is verplicht een administratie te voeren die zodanig is ingericht dat daaruit te allen tijde
      op eenvoudige en duidelijke wijze alle kosten voor het investeringsproject kunnen worden afgelezen, gespecificeerd
      overeenkomstig de in [artikel 6][ref1] onderscheiden kostensoorten.

      4 De subsidieontvanger is verplicht handelsdocumenten te bewaren gedurende een periode van drie jaar nadat de
      beschikking tot subsidievaststelling is vastgesteld.

      5 In afwijking van het eerste lid, onderdeel c, kan de minister op verzoek van de subsidieontvanger wegens
      gewijzigde marktomstandigheden eenmalig een nieuwe termijn vaststellen waarbinnen het investeringsproject wordt
      uitgevoerd.

      6 Een verzoek als bedoeld in het vorige lid, wordt door de subsidieontvanger met redenen omkleed en bevat in ieder
      geval de volgende onderdelen:

      a. een weergave van de marktomstandigheden waarom het investeringsproject niet binnen achttien maanden na de
      beschikking tot subsidieverlening kan worden uitgevoerd,

      b. eventuele aanpassingen in het investeringsplan, en

      c. een voorstel voor een termijn waarbinnen het investeringsproject alsnog wordt uitgevoerd.

      7 Een termijn als bedoeld in het vijfde lid bedraagt ten hoogste 30 maanden vanaf de datum van de beschikking tot
      subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0013021#Artikel6
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel11
    references:
