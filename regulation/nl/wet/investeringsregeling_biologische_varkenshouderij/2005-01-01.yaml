articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. *biologische productiemethode:* productiemethode als bedoeld in
      [artikel 1, eerste lid, van het Landbouwkwaliteitsbesluit biologische productiemethode][ref1];

      c. *biologische varkenshouderij:* het houden van varkens overeenkomstig de biologische productiemethode;

      d. *landbouwbedrijf:* geheel van productie-eenheden in Nederland bestaande uit een of meer gebouwen of gedeelten
      daarvan en daarbijbehorende landbouwgrond, uitsluitend of onder meer dienende tot de uitoefening van de landbouw;

      e. *Stichting Skal:* controle-instelling belast met het toezicht op de naleving van het bij of krachtens het
      [Landbouwkwaliteitsbesluit biologische productiemethode][ref2] bepaalde;

      f. *varkensrecht:* varkensrechten onderscheidenlijk fokzeugenrechten als bedoeld in
      [artikel 1, onderdelen h en i, van de Wet herstructurering varkenshouderij][ref3];

      g. *investeringsproject:* samenhangend geheel van investeringen in productiemiddelen die in een productieproces
      meer jaren meegaan en waarop doorgaans wordt afgeschreven;

      h. *rechtspersoon:* rechtspersoon, anders dan een publiekrechtelijke rechtspersoon;

      i. *varken:* big, fokzeug, mestvarken of ander varken;

      j. *afnamecontract:* juridisch afdwingbare verbintenis waarin een landbouwbedrijf met een of meerdere afnemers is
      overeengekomen om gedurende een periode van ten minste twee jaar een minimumaantal biologische varkens te leveren
      voor een prijs die ten minste niet lager is dan de bij de verbintenis vastgelegde minimumprijs;

      k. *bedrijfsaansluitingsbevestiging:* bedrijfsaansluitingsbevestiging als bedoeld in artikel 2, derde lid, van het
      Controlereglement biologische productiemethode onderscheidenlijk artikel 2, derde lid van het Controlereglement
      Skal-controle van de stichting Skal;

      l. *bedrijfsaansluitingscertificaat:* bedrijfsaansluitingscertificaat als bedoeld in artikel 2, achtste lid,
      van het Controlereglement biologische productiemethode onderscheidenlijk artikel 2, achtste lid, van het
      Controlereglement Skal-controle van de stichting Skal;

      m. *economische levensvatbaarheid:* de omstandigheid dat een onderneming solvabel, liquide en niet structureel
      verliesgevend is onderscheidenlijk zal zijn, hetgeen blijkt uit de verklaring onderscheidenlijk de gegevens als
      bedoeld in respectievelijk [artikel 8, vierde lid, onderdeel a][ref4], en [artikel 8, vijfde lid][ref5];

      n. *handelsdocumenten:* alle documenten als bedoeld in artikel 1, tweede lid, en artikel 3 van [verordening (EEG)
      nr. 4045/89](31989R4045) van de Raad van 21 december 1989 inzake de door de Lid-Staten uit te voeren controles op
      de verrichtingen in het kader van de financieringsregeling van de afdeling Garantie van het Europees Oriëntatie- en
      Garantiefonds voor de Landbouw en houdende intrekking van [Richtlijn 77/435/EEG](31977L0435) (PbEG L 388);

      o. *Dienst Regelingen:*Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.


