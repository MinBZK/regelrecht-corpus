        artikel: '6'
        paragraaf: II
  - number: '12'
    text: |-
      De subsidieontvanger is verplicht uiterlijk binnen acht maanden nadat het investeringsproject is voltooid een
      bedrijfsaansluitingscertificaat voor de biologische varkenshouderij van Stichting Skal te hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel12
  - number: '13'
    text: |-
      1 De aanvraag tot subsidievaststelling wordt uiterlijk binnen acht maanden na afloop van het investeringsproject
      ingediend bij Dienst Regelingen, op een daartoe vastgesteld formulier.

      2 De aanvraag tot subsidievaststelling gaat vergezeld van:

      a. een verslag dat bestaat uit een beschrijving van de verrichte investeringen;

      b. indien van toepassing, een afschrift van de bouwvergunningen en andere vergunningen die zijn verkregen voor de
      uitvoering van het investeringsproject;

      c. een financiële verantwoording bestaande uit een rekening alsmede een verklaring van een accountant of een
      accountant-administratieconsulent als bedoeld in [artikel 2:393, eerste lid, van het Burgerlijk Wetboek][ref1]
      waaruit blijkt dat is voldaan aan de in deze regeling gestelde voorwaarden en verplichtingen;

      d. een afschrift van het vigerende bestemmingsplan;

      e. een afschrift van het bedrijfsaansluitingscertificaat voor de biologische varkenshouderij afgegeven door
      Stichting Skal.

      3 De accountant of accountant-administratieconsulent, bedoeld in het tweede lid, onderdeel b, controleert met
      inachtneming van het in [bijlage 1 bij deze regeling][ref2] opgenomen controleprotocol.

      4 De minister geeft een beschikking tot subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0013021
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel13
    references:
