---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: investeringsregeling_biologische_varkenshouderij
regulatory_layer: WET
publication_date: '2007-02-15'
valid_from: '2005-01-01'
bwb_id: BWBR0013021
url: https://wetten.overheid.nl/BWBR0013021/2005-01-01
preamble:
  text: |-
    Gelet op artikel 87, derde lid, onderdeel c, EG,

    Gelet op de artikelen 2 en 4 van de Kaderwet LNV-subsidies,

    Gelet op de communautaire richtsnoeren voor staatssteun in de landbouwsector (PbEG C 232 van 1 februari 2000),

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
  - number: 1.a
    text: '*minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
  - number: 1.b
    text: |-
      *biologische productiemethode:* productiemethode als bedoeld in
      [artikel 1, eerste lid, van het Landbouwkwaliteitsbesluit biologische productiemethode][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005740#Artikel1
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005740
        artikel: '1'
  - number: 1.c
    text: '*biologische varkenshouderij:* het houden van varkens overeenkomstig de biologische productiemethode;'
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
  - number: 1.d
    text: |-
      *landbouwbedrijf:* geheel van productie-eenheden in Nederland bestaande uit een of meer gebouwen of gedeelten
      daarvan en daarbijbehorende landbouwgrond, uitsluitend of onder meer dienende tot de uitoefening van de landbouw;
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
  - number: 1.e
    text: |-
      *Stichting Skal:* controle-instelling belast met het toezicht op de naleving van het bij of krachtens het
      [Landbouwkwaliteitsbesluit biologische productiemethode][ref1] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0005740
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005740
  - number: 1.f
    text: |-
      *varkensrecht:* varkensrechten onderscheidenlijk fokzeugenrechten als bedoeld in
      [artikel 1, onderdelen h en i, van de Wet herstructurering varkenshouderij][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel1
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '1'
  - number: 1.g
    text: |-
      *investeringsproject:* samenhangend geheel van investeringen in productiemiddelen die in een productieproces meer
      jaren meegaan en waarop doorgaans wordt afgeschreven;
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
  - number: 1.h
    text: '*rechtspersoon:* rechtspersoon, anders dan een publiekrechtelijke rechtspersoon;'
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
  - number: 1.i
    text: '*varken:* big, fokzeug, mestvarken of ander varken;'
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
  - number: 1.j
    text: |-
      *afnamecontract:* juridisch afdwingbare verbintenis waarin een landbouwbedrijf met een of meerdere afnemers is
      overeengekomen om gedurende een periode van ten minste twee jaar een minimumaantal biologische varkens te leveren
      voor een prijs die ten minste niet lager is dan de bij de verbintenis vastgelegde minimumprijs;
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
  - number: 1.k
    text: |-
      *bedrijfsaansluitingsbevestiging:* bedrijfsaansluitingsbevestiging als bedoeld in artikel 2, derde lid, van het
      Controlereglement biologische productiemethode onderscheidenlijk artikel 2, derde lid van het Controlereglement
      Skal-controle van de stichting Skal;
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
  - number: 1.l
    text: |-
      *bedrijfsaansluitingscertificaat:* bedrijfsaansluitingscertificaat als bedoeld in artikel 2, achtste lid, van het
      Controlereglement biologische productiemethode onderscheidenlijk artikel 2, achtste lid, van het Controlereglement
      Skal-controle van de stichting Skal;
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
  - number: 1.m
    text: |-
      *economische levensvatbaarheid:* de omstandigheid dat een onderneming solvabel, liquide en niet structureel
      verliesgevend is onderscheidenlijk zal zijn, hetgeen blijkt uit de verklaring onderscheidenlijk de gegevens als
      bedoeld in respectievelijk [artikel 8, vierde lid, onderdeel a][ref1], en [artikel 8, vijfde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013021#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013021#Artikel8
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013021
        artikel: '8'
        paragraaf: III
      - id: ref2
        bwb_id: BWBR0013021
        artikel: '8'
        paragraaf: III
  - number: 1.n
    text: |-
      *handelsdocumenten:* alle documenten als bedoeld in artikel 1, tweede lid, en artikel 3 van [verordening (EEG) nr.
      4045/89](31989R4045) van de Raad van 21 december 1989 inzake de door de Lid-Staten uit te voeren controles op de
      verrichtingen in het kader van de financieringsregeling van de afdeling Garantie van het Europees Oriëntatie- en
      Garantiefonds voor de Landbouw en houdende intrekking van [Richtlijn 77/435/EEG](31977L0435) (PbEG L 388);
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
  - number: 1.o
    text: '*Dienst Regelingen:*Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.'
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel1
  - number: '2'
    text: |-
      De minister kan ter vermindering van de belasting voor het milieu en de natuur door de varkenshouderij op grond
      van de volgende bepalingen een subsidie verstrekken voor de investeringen ten behoeve van de omschakeling van de
      varkenshouderij naar de biologische productiemethode.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel2
  - number: '3.1'
    text: |-
      De minister kan per kalenderjaar één of meer aanvraagperioden vaststellen voor subsidieaanvragen op grond van deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel3
  - number: '3.2'
    text: |-
      De minister stelt voor iedere aanvraagperiode een subsidieplafond vast voor de op grond van deze regeling te
      verstrekken subsidies.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel3
  - number: '3.3'
    text: |-
      De minister verdeelt het beschikbare bedrag op volgorde van de datum van ontvangst van de aanvragen door Dienst
      Regelingen.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel3
  - number: '3.4'
    text: |-
      Indien dit noodzakelijk is in verband met het bereiken van het subsidieplafond wordt door middel van loting beslist
      over de rangschikking van de op één dag ontvangen aanvragen.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel3
  - number: '4.1'
    text: 'De subsidie kan slechts worden verleend aan een natuurlijke persoon of rechtspersoon, indien deze:'
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel4
  - number: 4.1.a
    text: 'op het tijdstip van indienen van de aanvraag tot subsidieverlening voor eigen rekening en risico:'
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel4
  - number: 4.1.a.1
    text: als eigenaar, gerechtigde of als pachter een landbouwbedrijf exploiteert, of
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel4
  - number: 4.1.a.2
    text: blijkens de van kracht zijnde statuten de exploitatie van een landbouwbedrijf ten doel heeft,
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel4
  - number: 4.1.b
    text: |-
      als eigenaar, gerechtigde onderscheidenlijk pachter op het tijdstip van het indienen van de aanvraag tot
      subsidieverlening geen recht heeft op een ouderdomspensioen ingevolge de [Algemene Ouderdomswet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 4.1.c
    text: |-
      als eigenaar, gerechtigde, of pachter dan wel als directeur/bedrijfsleider beschikt over voldoende agrarische
      vakbekwaamheid, hetgeen blijkt uit:
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel4
  - number: 4.1.c.1
    text: |-
      het bezit van een getuigschrift van een erkende landbouwkundige opleiding onderscheidenlijk van een opleiding van
      een hiermee gelijkwaardig niveau, of
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel4
  - number: 4.1.c.2
    text: de omstandigheid dat hij ten minste drie jaren op een landbouwbedrijf werkzaam is geweest,
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel4
  - number: 4.1.d
    text: |-
      voldoet aan de geldende nationale en Europese minimumnormen op het gebied van milieu, hygiëne
      en dierenwelzijn, hetgeen betekent dat hij op het tijdstip van het indienen van de aanvraag tot
      subsidieverlening het landbouwbedrijf uitoefent met inachtneming van de geldende nationale en Europese
      minimumnormen op het gebied van milieu, dierenwelzijn en hygiëne, hetgeen in ieder geval omvat de geldende
      normen bij of krachtens de [Wet milieubeheer][ref1], de [Wet verontreiniging oppervlaktewater][ref2],
      de [Meststoffenwet][ref3], de [Wet bodembescherming][ref4], de [Bestrijdingsmiddelenwet 1962][ref5], de
      [Gezondheids- en welzijnswet voor dieren][ref6], de [Diergeneesmiddelenwet][ref7] en de [Plantenziektewet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0002682
      [ref3]: https://wetten.overheid.nl/BWBR0004054
      [ref4]: https://wetten.overheid.nl/BWBR0003994
      [ref5]: https://wetten.overheid.nl/BWBR0002380
      [ref6]: https://wetten.overheid.nl/BWBR0005662
      [ref7]: https://wetten.overheid.nl/BWBR0003818
      [ref8]: https://wetten.overheid.nl/BWBR0002075
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0002682
      - id: ref3
        bwb_id: BWBR0004054
      - id: ref4
        bwb_id: BWBR0003994
      - id: ref5
        bwb_id: BWBR0002380
      - id: ref6
        bwb_id: BWBR0005662
      - id: ref7
        bwb_id: BWBR0003818
      - id: ref8
        bwb_id: BWBR0002075
  - number: 4.1.e
    text: |-
      in het bezit is van een of meerdere afnamecontracten die voor het totaal aantal te produceren varkens op het
      landbouwbedrijf, de afzet garandeert;
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel4
  - number: 4.1.f
    text: in het bezit is van een bedrijfsaansluitingsbevestiging;
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel4
  - number: 4.1.g
    text: |-
      een landbouwbedrijf exploiteert waarvan de economische levensvatbaarheid op het tijdstip van indiening van de
      aanvraag tot subsidieverlening kan worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel4
  - number: '4.2'
    text: |-
      Indien meer dan een natuurlijke persoon voor gezamenlijke rekening en risico een landbouwbedrijf exploiteren, kan
      een subsidie worden verleend indien ten minste een van de natuurlijke personen die het landbouwbedrijf exploiteren
      op het tijdstip van het indienen van de aanvraag tot subsidieverlening eigenaar, gerechtigde of pachter van
      dit landbouwbedrijf is en voldoet aan het bepaalde in het eerste lid. Indien meer dan een rechtspersoon voor
      gezamenlijke rekening en risico een landbouwbedrijf exploiteert, kan een subsidie worden verleend indien tenminste
      een directeur/bedrijfsleider van één van de deelnemende rechtspersonen voldoet aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel4
  - number: '5.1'
    text: 'De subsidie wordt verleend voor investeringen in productiemiddelen:'
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel5
  - number: 5.1.a
    text: waarvan de aanvrager de eerste gebruiker is, en
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel5
  - number: 5.1.b
    text: |-
      die gericht zijn op het houden van varkens volgens de normen van de biologische productiemethode en
      in overeenstemming met de op [Landbouwkwaliteitsbesluit biologische productiemethode][ref1] gebaseerde
      publiekrechtelijke voorschriften van Stichting Skal.


      [ref1]: https://wetten.overheid.nl/BWBR0005740
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005740
  - number: '5.2'
    text: 'Geen subsidie wordt verleend voor:'
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel5
  - number: 5.2.a
    text: investeringen die dienen ter vervanging van productiemiddelen die reeds het eigendom zijn van de aanvrager,
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel5
  - number: 5.2.b
    text: de aankoop van varkensrechten, of
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel5
  - number: 5.2.c
    text: |-
      investeringen in bedrijfsmiddelen of onderdelen daarvan, gericht op productieverhoging, waarvoor geen
      afnamecontract bestaat.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel5
  - number: '5.3'
    text: |-
      Geen subsidie wordt verleend voor investeringsprojecten met de uitvoering waarvan een aanvang is gemaakt alvorens
      de ontvangst van de aanvraag tot subsidieverlening schriftelijk aan de aanvrager is bevestigd. Onder het maken van
      een aanvang met de uitvoering van een investering wordt in ieder geval verstaan het aangaan van verplichtingen.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel5
  - number: '6'
    text: |-
      Als subsidiabele kosten worden uitsluitend in aanmerking genomen de volgende door de aanvrager gemaakte en
      betaalde kosten, voorzover zij noodzakelijk zijn en rechtstreeks zijn toe te rekenen aan de onderdelen van het
      investeringsproject waarop de beschikking tot subsidieverlening betrekking heeft:
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel6
  - number: 6.a
    text: de kosten van aangeschafte machines en apparatuur, gebaseerd op de historische aanschafprijzen,
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel6
  - number: 6.b
    text: de kosten van de bouw van onroerende zaken, en
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel6
  - number: 6.c
    text: |-
      de algemene kosten, met name de kosten voor architecten, ingenieurs en adviseurs en installatiekosten, tot een
      maximum van 12% van de onder a en b bedoelde kosten.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel6
  - number: '7.1'
    text: De subsidie bedraagt 30% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel7
  - number: '7.2'
    text: De subsidie bedraagt ten hoogste € 250.000,-.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien voor de subsidiabele kosten of een gedeelte daarvan reeds uit anderen hoofde een subsidie of ander
      geldelijk voordeel is of zal worden verleend, wordt slechts een zodanig bedrag aan subsidie verleend dat het totale
      subsidiebedrag niet meer bedraagt dan 40% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel7
  - number: '8.1'
    text: De aanvraag tot subsidieverlening wordt bij Dienst Regelingen ingediend.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: '8.2'
    text: |-
      Voor de aanvraag tot subsidieverlening, bedoeld in het eerste lid, maakt de aanvrager gebruik van een daartoe
      vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: '8.3'
    text: |-
      Door het indienen van het aanvraagformulier verplicht de aanvrager zich tot nakoming van de daarin gestelde
      voorwaarden en verplichtingen en stemt hij in met een doorgifte door Stichting Skal aan Dienst Regelingen van alle
      gegevens betrekking hebbende op de uitoefening van de biologische productiemethode op zijn landbouwbedrijf.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: '8.4'
    text: 'De aanvraag tot subsidieverlening gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: 8.4.a
    text: |-
      een verklaring van een financierende derde waaruit blijkt dat deze de voorgenomen investeringen geheel of voor een
      substantieel deel zal financieren;
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: 8.4.b
    text: |-
      een beschrijving van de economische positie van het landbouwbedrijf inhoudende een weergave van het eigen vermogen
      van het bedrijf, een opgave van de beschikbare liquide middelen en de schuldpositie,
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: 8.4.c
    text: |-
      een investeringsprojectplan, inhoudende een beschrijving van de begintoestand, de doelstellingen en achtergronden
      van het investeringsproject, de toestand na voltooiing van het investeringsprojectplan, de activiteiten, een
      tijdsplanning van de activiteiten en de wijze van uitvoering;
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: 8.4.d
    text: |-
      een gespecificeerde begroting van de beoogde investeringen en een opgave van de financieringswijze van het
      investeringsproject,
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: 8.4.e
    text: in voorkomend geval, de statuten van de rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: 8.4.f
    text: in voorkomend geval, het getuigschrift van de landbouwkundige opleiding,
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: 8.4.g
    text: een bedrijfsaansluitingsbevestiging,
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: 8.4.h
    text: een opgaaf van het aantal varkensrechten dat het bedrijf heeft,
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: 8.4.i
    text: een afschrift van het afnamecontract.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: '8.5'
    text: |-
      Indien geen verklaring als bedoeld in het vierde lid, onderdeel a, wordt overlegd, wordt bij de aanvraag tot
      subsidieverlening overlegd:
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: 8.5.a
    text: |-
      een exploitatiebegroting en andere financiële bescheiden over de twee boekjaren volgend op het jaar waarin de
      subsidieaanvraag plaatsvindt waaruit kan worden afgeleid dat het eigen vermogen niet minder dan 15 procent van het
      totale vermogen uitmaakt, nadat de investering, waarvoor de aanvraag tot subsidieverlening wordt ingediend, heeft
      plaatsgevonden,
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: 8.5.b
    text: een meerjarenbegroting over een periode van 5 jaar volgend op het jaar waarin de subsidieaanvraag plaatsvindt, en
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: 8.5.c
    text: |-
      financiële gegevens, met inbegrip van een jaarrekening, waaruit dient te blijken dat de subsidieaanvrager gedurende
      de drie jaar voorafgaand aan de subsidieaanvraag niet meer dan gedurende één jaar verlies heeft geleden.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel8
  - number: '9'
    text: |-
      De minister geeft de beschikking tot subsidieverlening binnen vier maanden na afloop van de aanvraagperiode waarin
      de aanvraag tot subsidieverlening is ingediend. Indien deze termijn niet kan worden gehaald, stelt de minister de
      aanvrager daarvan in kennis en noemt hij daarbij een redelijke termijn waarop de beschikking tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel9
  - number: '10'
    text: |-
      De subsidieverlening kan worden geweigerd indien een gegronde reden bestaat om aan te nemen dat de financiering van
      het project niet toereikend zal zijn.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel10
  - number: '11.1'
    text: 'De subsidieontvanger voert het investeringsproject uit:'
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel11
  - number: 11.1.a
    text: overeenkomstig het investeringsplan waarop de beschikking tot subsidieverlening betrekking heeft,
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel11
  - number: 11.1.b
    text: in Nederland, behoudens toestemming van de minister tot gedeeltelijke uitvoering buiten Nederland,
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel11
  - number: 11.1.c
    text: binnen achttien maanden na de beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel11
  - number: '11.2'
    text: |-
      Wijzigingen in het investeringsplan gedurende de looptijd van het investeringsproject worden aan Dienst Regelingen
      gemeld. De minister kan deze wijzigingen goedkeuren, tenzij het wijzigingen ten aanzien van de doelstelling van het
      investeringsproject betreft.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel11
  - number: '11.3'
    text: |-
      De subsidieontvanger is verplicht een administratie te voeren die zodanig is ingericht dat daaruit te allen tijde
      op eenvoudige en duidelijke wijze alle kosten voor het investeringsproject kunnen worden afgelezen, gespecificeerd
      overeenkomstig de in [artikel 6][ref1] onderscheiden kostensoorten.


      [ref1]: https://wetten.overheid.nl/BWBR0013021#Artikel6
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013021
        artikel: '6'
        paragraaf: II
  - number: '11.4'
    text: |-
      De subsidieontvanger is verplicht handelsdocumenten te bewaren gedurende een periode van drie jaar nadat de
      beschikking tot subsidievaststelling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel11
  - number: '11.5'
    text: |-
      In afwijking van het eerste lid, onderdeel c, kan de minister op verzoek van de subsidieontvanger wegens gewijzigde
      marktomstandigheden eenmalig een nieuwe termijn vaststellen waarbinnen het investeringsproject wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel11
  - number: '11.6'
    text: |-
      Een verzoek als bedoeld in het vorige lid, wordt door de subsidieontvanger met redenen omkleed en bevat in ieder
      geval de volgende onderdelen:
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel11
  - number: 11.6.a
    text: |-
      een weergave van de marktomstandigheden waarom het investeringsproject niet binnen achttien maanden na de
      beschikking tot subsidieverlening kan worden uitgevoerd,
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel11
  - number: 11.6.b
    text: eventuele aanpassingen in het investeringsplan, en
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel11
  - number: 11.6.c
    text: een voorstel voor een termijn waarbinnen het investeringsproject alsnog wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel11
  - number: '11.7'
    text: |-
      Een termijn als bedoeld in het vijfde lid bedraagt ten hoogste 30 maanden vanaf de datum van de beschikking tot
      subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel11
  - number: '12'
    text: |-
      De subsidieontvanger is verplicht uiterlijk binnen acht maanden nadat het investeringsproject is voltooid een
      bedrijfsaansluitingscertificaat voor de biologische varkenshouderij van Stichting Skal te hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel12
  - number: '13.1'
    text: |-
      De aanvraag tot subsidievaststelling wordt uiterlijk binnen acht maanden na afloop van het investeringsproject
      ingediend bij Dienst Regelingen, op een daartoe vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel13
  - number: '13.2'
    text: 'De aanvraag tot subsidievaststelling gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel13
  - number: 13.2.a
    text: een verslag dat bestaat uit een beschrijving van de verrichte investeringen;
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel13
  - number: 13.2.b
    text: |-
      indien van toepassing, een afschrift van de bouwvergunningen en andere vergunningen die zijn verkregen voor de
      uitvoering van het investeringsproject;
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel13
  - number: 13.2.c
    text: |-
      een financiële verantwoording bestaande uit een rekening alsmede een verklaring van een accountant of een
      accountant-administratieconsulent als bedoeld in [artikel 2:393, eerste lid, van het Burgerlijk Wetboek][ref1]
      waaruit blijkt dat is voldaan aan de in deze regeling gestelde voorwaarden en verplichtingen;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 13.2.d
    text: een afschrift van het vigerende bestemmingsplan;
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel13
  - number: 13.2.e
    text: |-
      een afschrift van het bedrijfsaansluitingscertificaat voor de biologische varkenshouderij afgegeven door Stichting
      Skal.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel13
  - number: '13.3'
    text: |-
      De accountant of accountant-administratieconsulent, bedoeld in het tweede lid, onderdeel b, controleert met
      inachtneming van het in [bijlage 1 bij deze regeling][ref1] opgenomen controleprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0013021
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013021
  - number: '13.4'
    text: De minister geeft een beschikking tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel13
  - number: '15'
    text: |-
      De Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit is belast met het toezicht
      op de naleving van de in deze regeling gestelde voorschriften. Zij kan daartoe gebruik maken van de diensten van de
      stichting Skal.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel15
  - number: '16'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref1] of
      [artikel 6 van de Kaderwet LNV-subsidies][ref2] kunnen terug te vorderen bedragen worden vermeerderd met de
      wettelijke rente over de periode vanaf de uitbetaling van het subsidiebedrag tot aan het moment van algehele
      voldoening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel6
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009194
        artikel: '6'
  - number: '17.1'
    text: |-
      [Artikel 4:49, eerste lid, onderdeel c, Algemene wet bestuursrecht][ref1] vindt geen toepassing ten aanzien van de
      reeds uitbetaalde subsidie indien niet-nakoming van de uit deze regeling voortvloeiende verplichtingen het gevolg
      is van:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 17.1.a
    text: overlijden van de subsidieontvanger,
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel17
  - number: 17.1.b
    text: overmacht, of
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel17
  - number: 17.1.c
    text: |-
      onteigening of gedwongen verkoop in de zin van de [Onteigeningswet][ref1], voorzover deze onteigening of gedwongen
      verkoop niet te voorzien was op de dag waarop de aanvraag tot subsidieverlening is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001842
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001842
  - number: '17.2'
    text: |-
      Een subsidieontvanger dient het beroep op een van de in het eerste lid bedoelde gevallen bij Dienst Regelingen in
      binnen een termijn van een maand, te rekenen vanaf het tijdstip waarop dit voor hem mogelijk is. Dit beroep gaat
      vergezeld van bewijzen.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel17
  - number: '20'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel20
  - number: '21'
    text: 'Deze regeling wordt aangehaald als: Investeringsregeling biologische varkenshouderij.'
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel21
