  - number: '2'
    text: |-
      De minister kan ter vermindering van de belasting voor het milieu en de natuur door de varkenshouderij op grond
      van de volgende bepalingen een subsidie verstrekken voor de investeringen ten behoeve van de omschakeling van de
      varkenshouderij naar de biologische productiemethode.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel2
  - number: '3'
    text: |-
      1 De minister kan per kalenderjaar één of meer aanvraagperioden vaststellen voor subsidieaanvragen op grond van
      deze regeling.

      2 De minister stelt voor iedere aanvraagperiode een subsidieplafond vast voor de op grond van deze regeling te
      verstrekken subsidies.

      3 De minister verdeelt het beschikbare bedrag op volgorde van de datum van ontvangst van de aanvragen door Dienst
      Regelingen.

      4 Indien dit noodzakelijk is in verband met het bereiken van het subsidieplafond wordt door middel van loting
      beslist over de rangschikking van de op één dag ontvangen aanvragen.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel3
  - number: '4'
    text: |-
      1 De subsidie kan slechts worden verleend aan een natuurlijke persoon of rechtspersoon, indien deze:

      a. op het tijdstip van indienen van de aanvraag tot subsidieverlening voor eigen rekening en risico:

      1° als eigenaar, gerechtigde of als pachter een landbouwbedrijf exploiteert, of

      2° blijkens de van kracht zijnde statuten de exploitatie van een landbouwbedrijf ten doel heeft,

      b. als eigenaar, gerechtigde onderscheidenlijk pachter op het tijdstip van het indienen van de aanvraag tot
      subsidieverlening geen recht heeft op een ouderdomspensioen ingevolge de [Algemene Ouderdomswet][ref1],

      c. als eigenaar, gerechtigde, of pachter dan wel als directeur/bedrijfsleider beschikt over voldoende agrarische
      vakbekwaamheid, hetgeen blijkt uit:

      1° het bezit van een getuigschrift van een erkende landbouwkundige opleiding onderscheidenlijk van een opleiding
      van een hiermee gelijkwaardig niveau, of

      2° de omstandigheid dat hij ten minste drie jaren op een landbouwbedrijf werkzaam is geweest,

      d. voldoet aan de geldende nationale en Europese minimumnormen op het gebied van milieu, hygiëne
      en dierenwelzijn, hetgeen betekent dat hij op het tijdstip van het indienen van de aanvraag tot
      subsidieverlening het landbouwbedrijf uitoefent met inachtneming van de geldende nationale en Europese
      minimumnormen op het gebied van milieu, dierenwelzijn en hygiëne, hetgeen in ieder geval omvat de geldende
      normen bij of krachtens de [Wet milieubeheer][ref2], de [Wet verontreiniging oppervlaktewater][ref3],
      de [Meststoffenwet][ref4], de [Wet bodembescherming][ref5], de [Bestrijdingsmiddelenwet 1962][ref6], de
      [Gezondheids- en welzijnswet voor dieren][ref7], de [Diergeneesmiddelenwet][ref8] en de [Plantenziektewet][ref9].

      e. in het bezit is van een of meerdere afnamecontracten die voor het totaal aantal te produceren varkens op het
      landbouwbedrijf, de afzet garandeert;

      f. in het bezit is van een bedrijfsaansluitingsbevestiging;

      g. een landbouwbedrijf exploiteert waarvan de economische levensvatbaarheid op het tijdstip van indiening van de
      aanvraag tot subsidieverlening kan worden aangetoond.

      2 Indien meer dan een natuurlijke persoon voor gezamenlijke rekening en risico een landbouwbedrijf exploiteren,
      kan een subsidie worden verleend indien ten minste een van de natuurlijke personen die het landbouwbedrijf
      exploiteren op het tijdstip van het indienen van de aanvraag tot subsidieverlening eigenaar, gerechtigde of pachter
      van dit landbouwbedrijf is en voldoet aan het bepaalde in het eerste lid. Indien meer dan een rechtspersoon voor
      gezamenlijke rekening en risico een landbouwbedrijf exploiteert, kan een subsidie worden verleend indien tenminste
      een directeur/bedrijfsleider van één van de deelnemende rechtspersonen voldoet aan het eerste lid.


