  - number: '17'
    text: |-
      1 [Artikel 4:49, eerste lid, onderdeel c, Algemene wet bestuursrecht][ref1] vindt geen toepassing ten aanzien
      van de reeds uitbetaalde subsidie indien niet-nakoming van de uit deze regeling voortvloeiende verplichtingen het
      gevolg is van:

      a. overlijden van de subsidieontvanger,

      b. overmacht, of

      c. onteigening of gedwongen verkoop in de zin van de [Onteigeningswet][ref2], voorzover deze onteigening of
      gedwongen verkoop niet te voorzien was op de dag waarop de aanvraag tot subsidieverlening is ingediend.

      2 Een subsidieontvanger dient het beroep op een van de in het eerste lid bedoelde gevallen bij Dienst Regelingen
      in binnen een termijn van een maand, te rekenen vanaf het tijdstip waarop dit voor hem mogelijk is. Dit beroep gaat
      vergezeld van bewijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel449
      [ref2]: https://wetten.overheid.nl/BWBR0001842
