  - number: '15'
    text: |-
      De Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit is belast met het toezicht
      op de naleving van de in deze regeling gestelde voorschriften. Zij kan daartoe gebruik maken van de diensten van de
      stichting Skal.
    url: https://wetten.overheid.nl/BWBR0013021/2005-01-01#Artikel15
  - number: '16'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref1] of
      [artikel 6 van de Kaderwet LNV-subsidies][ref2] kunnen terug te vorderen bedragen worden vermeerderd met de
      wettelijke rente over de periode vanaf de uitbetaling van het subsidiebedrag tot aan het moment van algehele
      voldoening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel6
