preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met betrekking tot het
    conflictenrecht inzake het geregistreerd partnerschap;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het aangaan van een geregistreerd partnerschap in Nederland is onderworpen aan de bepalingen van
      [artikel 80a van Boek 1 van het Burgerlijk Wetboek][ref1].

      2 De bevoegdheid van elk van de partners om in Nederland een geregistreerd partnerschap aan te gaan wordt beheerst
      door het Nederlandse recht.

      3 Wat de vorm betreft kan een geregistreerd partnerschap in Nederland slechts rechtsgeldig worden aangegaan ten
      overstaan van de ambtenaar van de burgerlijke stand met inachtneming van het Nederlandse recht, behoudens de
      bevoegdheid van buitenlandse diplomatieke en consulaire ambtenaren om, in overeenstemming met de voorschriften
      van het recht van de door hen vertegenwoordigde staat, aan het aangaan van geregistreerde partnerschappen mede te
      werken indien geen der partijen uitsluitend of mede de Nederlandse nationaliteit bezit.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80a
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80a
  - number: '2'
    text: |-
      1 Een buiten Nederland aangegaan geregistreerd partnerschap dat ingevolge het recht van de staat waar het
      geregistreerd partnerschap is aangegaan rechtsgeldig is of nadien rechtsgeldig is geworden, wordt als zodanig
      erkend.

      2 Een buiten Nederland ten overstaan van een diplomatieke of consulaire ambtenaar aangegaan geregistreerd
      partnerschap dat voldoet aan de vereisten van het recht van de staat die die ambtenaar vertegenwoordigt, wordt als
      rechtsgeldig erkend tenzij het aangaan in de staat waar zij plaatsvond niet was toegestaan.

      3 Voor de toepassing van het eerste en tweede lid wordt onder recht mede begrepen de regels van internationaal
      privaatrecht.

      4 Een geregistreerd partnerschap wordt vermoed rechtsgeldig te zijn, indien een verklaring omtrent het
      geregistreerd partnerschap is afgegeven door een bevoegde autoriteit.

      5 Ongeacht het eerste en tweede lid kan een buiten Nederland aangegaan geregistreerd partnerschap slechts als
      zodanig worden erkend indien het een wettelijk geregelde samenlevingsvorm betreft van twee personen die een nauwe
      persoonlijke betrekking onderhouden, welke samenlevingsvorm ten minste:

      a. door een ter plaatse van het aangaan bevoegde autoriteit is geregistreerd;

      b. het bestaan van een huwelijk of andere wettelijk geregelde samenlevingsvorm met een derde uitsluit; en

      c. verplichtingen tussen de partners in het leven roept die in hoofdzaak overeenstemmen met die welke verbonden
      zijn aan het huwelijk.
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel2
  - number: '3'
    text: |-
      Ongeacht [artikel 2][ref1] wordt aan een buiten Nederland aangegaan geregistreerd partnerschap erkenning onthouden,
      indien deze erkenning onverenigbaar zou zijn met de openbare orde.


      [ref1]: https://wetten.overheid.nl/BWBR0016986#Artikel2
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016986
        artikel: '2'
        hoofdstuk: '2'
  - number: '4'
    text: |-
      De [artikelen 2][ref1] en [3][ref2] zijn van toepassing, ongeacht of over de erkenning van de rechtsgeldigheid van
      een geregistreerd partnerschap als hoofdvraag, dan wel als voorvraag in verband met een andere vraag wordt beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0016986#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016986#Artikel3
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016986
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0016986
        artikel: '3'
        hoofdstuk: '2'
  - number: '5'
    text: |-
      1 Op de persoonlijke rechtsbetrekkingen tussen partners die in Nederland een geregistreerd partnerschap zijn
      aangegaan is het Nederlandse recht van toepassing.

      2 Op de persoonlijke rechtsbetrekkingen tussen partners die buiten Nederland een geregistreerd partnerschap zijn
      aangegaan is het recht, met inbegrip van het internationaal privaatrecht, van de staat waar het geregistreerd
      partnerschap is aangegaan van toepassing.

      3 De vraag of en in hoeverre de ene partner aansprakelijk is voor verbintenissen ten behoeve van de gewone gang
      van het huishouden welke door de andere partner zijn aangegaan, wordt, indien die andere partner en de wederpartij
      ten tijde van het aangaan van de verbintenis hun gewone verblijfplaats hadden in Nederland, beheerst door het
      Nederlandse recht.

      4 De vraag of de ene partner voor een rechtshandeling de toestemming van de andere partner behoeft, en zo ja, in
      welke vorm deze toestemming moet worden verleend, of zij kan worden vervangen door een beslissing van de rechter of
      een andere autoriteit, alsmede welke de gevolgen zijn van het ontbreken van deze toestemming, wordt beheerst door
      het Nederlandse recht indien de andere partner ten tijde van het verrichten van die rechtshandeling zijn gewone
      verblijfplaats heeft in Nederland.

      5 Het derde en vierde lid gelden ongeacht het recht dat het partnerschapsvermogensregime van de partners beheerst,
      en ongeacht het recht dat van toepassing is op de persoonlijke rechtsbetrekkingen tussen de partners.
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel5
  - number: '6'
    text: |-
      1 Op het vermogensregime van een in Nederland of buiten Nederland aangegaan geregistreerd partnerschap is van
      toepassing het recht dat de partners vóór het geregistreerd partnerschap hebben aangewezen.

      2 De partners kunnen uitsluitend een rechtsstelsel aanwijzen dat het instituut van het geregistreerd partnerschap
      kent.

      3 Het aldus aangewezen recht is van toepassing op hun gehele vermogen.

      4 De partners kunnen echter, ongeacht of zij tot de aanwijzing, bedoeld in het eerste lid, zijn overgegaan, met
      betrekking tot het geheel of een gedeelte van de onroerende zaken het recht aanwijzen van de plaats waar die zaken
      zijn gelegen, mits dit rechtsstelsel het instituut van het geregistreerd partnerschap kent. Zij kunnen eveneens
      bepalen dat op onroerende zaken die later worden verkregen, het recht van de plaats waar die zaken zijn gelegen van
      toepassing zal zijn, mits dit rechtsstelsel het instituut van het geregistreerd partnerschap kent.
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel6
  - number: '7'
    text: |-
      1 Indien het geregistreerd partnerschap in Nederland is aangegaan en de partners vóór het geregistreerd
      partnerschap het toepasselijke recht niet hebben aangewezen, wordt hun partnerschapsvermogensregime beheerst door
      het Nederlandse recht.

      2 Indien het geregistreerd partnerschap buiten Nederland is aangegaan en de partners vóór het geregistreerd
      partnerschap het toepasselijke recht niet hebben aangewezen, wordt hun partnerschapsvermogensregime beheerst door
      het recht, met inbegrip van het internationaal privaatrecht, van de staat waar het geregistreerd partnerschap is
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel7
  - number: '8'
    text: |-
      1 Tijdens het in Nederland of buiten Nederland aangegane geregistreerd partnerschap kunnen de partners hun
      partnerschapsvermogensregime onderwerpen aan een ander intern recht dan het recht dat tot dusver van toepassing
      was.

      2 De partners kunnen uitsluitend een rechtsstelsel aanwijzen dat het instituut van het geregistreerd partnerschap
      kent.

      3 Het aldus aangewezen recht is van toepassing op hun gehele vermogen.

      4 De partners kunnen echter, ongeacht of zij tot de aanwijzing, bedoeld in het eerste lid of [artikel 6][ref1],
      zijn overgegaan, met betrekking tot het geheel of een gedeelte van de onroerende zaken het recht aanwijzen van de
      plaats waar die zaken zijn gelegen, mits dit rechtsstelsel het instituut van het geregistreerd partnerschap kent.
      Zij kunnen eveneens bepalen dat op onroerende zaken die later worden verkregen, het recht van de plaats waar die
      zaken zijn gelegen van toepassing zal zijn, mits dit rechtsstelsel het instituut van het geregistreerd partnerschap
      kent.


      [ref1]: https://wetten.overheid.nl/BWBR0016986#Artikel6
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016986
        artikel: '6'
        hoofdstuk: '4'
  - number: '9'
    text: |-
      1 Het recht dat op grond van de bepalingen van deze wet van toepassing is op het partnerschapsvermogensregime van
      een in Nederland of buiten Nederland aangegaan geregistreerd partnerschap, blijft van toepassing zolang de partners
      geen ander toepasselijk recht hebben aangewezen, zelfs in geval van wijziging van hun nationaliteit of gewone
      verblijfplaats.

      2 Het recht dat de partners rechtsgeldig als toepasselijk hebben aangewezen op het partnerschapsvermogensregime
      van hun buiten Nederland aangegane geregistreerd partnerschap, blijft van toepassing zolang de partners geen ander
      toepasselijk recht hebben aangewezen, zelfs in geval van wijziging van hun nationaliteit of gewone verblijfplaats.
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel9
  - number: '10'
    text: |-
      De voorwaarden voor de wilsovereenstemming van de partners inzake het recht dat zij als toepasselijk aanwijzen op
      hun partnerschapsvermogensregime, worden door dat recht bepaald.
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel10
  - number: '11'
    text: |-
      De aanwijzing van het toepasselijke recht op het partnerschapsvermogensregime moet uitdrukkelijk zijn
      overeengekomen of ondubbelzinnig voortvloeien uit partnerschapsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel11
  - number: '12'
    text: |-
      Partnerschapsvoorwaarden zijn, wat de vorm betreft, geldig indien zij in overeenstemming zijn, hetzij met het
      interne recht dat van toepassing is op het partnerschapsvermogensregime, hetzij met het interne recht van de plaats
      waar zij zijn aangegaan. Zij dienen in elk geval te worden neergelegd in een gedagtekend en door beide partners
      ondertekend schriftelijk stuk.
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel12
  - number: '13'
    text: |-
      Een uitdrukkelijk overeengekomen aanwijzing van het op het partnerschapsvermogensregime toepasselijke recht dient
      te geschieden in de vorm welke voor partnerschapsvoorwaarden is voorgeschreven, hetzij door het aangewezen interne
      recht, hetzij door het interne recht van de plaats waar die aanwijzing geschiedt. De aanwijzing dient in elk geval
      te worden neergelegd in een gedagtekend en door beide partners ondertekend schriftelijk stuk.
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel13
  - number: '14'
    text: |-
      De gevolgen van het partnerschapsvermogensregime ten aanzien van een rechtsbetrekking tussen een partner en een
      derde worden beheerst door het recht dat op het partnerschapsvermogensregime toepasselijk is.
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel14
  - number: '15'
    text: |-
      Een partner wiens partnerschapsvermogensregime wordt beheerst door vreemd recht, kan in het in
      [artikel 116 van Boek 1 van het Burgerlijk Wetboek][ref1] bedoelde register een notariële akte doen inschrijven,
      inhoudende een verklaring dat het partnerschapsvermogensregime niet wordt beheerst door het Nederlandse recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
  - number: '16'
    text: |-
      1 Een derde die tijdens het geregistreerd partnerschap een rechtshandeling heeft verricht met een partner wiens
      partnerschapsvermogensregime wordt beheerst door vreemd recht kan, indien zowel hij als de beide partners ten
      tijde van die rechtshandeling hun gewone verblijfplaats in Nederland hadden, voor de uit die rechtshandeling
      voortvloeiende schuld ook na de beëindiging van het geregistreerd partnerschap verhaal nemen alsof tussen de
      partners naar Nederlands recht algehele gemeenschap van goederen bestond.

      2 Het bepaalde in het eerste lid geldt niet indien de derde ten tijde van de rechtshandeling wist of behoorde te
      weten dat het partnerschapsvermogensregime van de partners werd beheerst door vreemd recht. Zulks wordt geacht het
      geval te zijn indien de rechtshandeling werd verricht na verloop van veertien dagen nadat een akte als bedoeld in
      [artikel 15][ref1] was ingeschreven in het aldaar bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0016986#Artikel15
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016986
        artikel: '15'
        hoofdstuk: '4'
  - number: '17'
    text: |-
      Heeft een der partners, door de toepassing op een buitenslands gelegen vermogensbestanddeel van een krachtens
      het internationaal privaatrecht van het land van ligging aangewezen recht, ten opzichte van de andere partner
      een voordeel genoten dat hem niet zou zijn toegekomen indien het op grond van deze wet aangewezen recht zou
      zijn toegepast, dan kan die andere partner daarvan verrekening of vergoeding vorderen bij de in verband met de
      beëindiging of wijziging van het partnerschapsvermogensregime tussen de partners plaats vindende afrekening.
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel17
  - number: '18'
    text: |-
      [Artikel 92, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref1] is uitsluitend van toepassing terzake van
      verhaal dat in Nederland wordt uitgeoefend op:

      a. een partner wiens partnerschapsvermogensregime wordt beheerst door het Nederlandse recht, of

      b. een partner op wie ingevolge het bepaalde in [artikel 16][ref2] van deze wet verhaal mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0016986#Artikel16
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '92'
      - id: ref2
        bwb_id: BWBR0016986
        artikel: '16'
        hoofdstuk: '4'
  - number: '19'
    text: |-
      Het bepaalde in [artikel 119 van Boek 1 van het Burgerlijk Wetboek][ref1] is niet van toepassing indien de partners
      een ander recht op hun partnerschapsvermogensregime aanwijzen dan het recht dat tevoren daarop toepasselijk was.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel119
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '119'
  - number: '20'
    text: |-
      Het bepaalde in [artikel 131 van Boek 1 van het Burgerlijk Wetboek][ref1] is ook van toepassing wanneer het
      partnerschapsvermogensregime van de partners door een vreemd recht wordt beheerst.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel131
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '131'
  - number: '21'
    text: |-
      Of een partner bij beëindiging van het geregistreerd partnerschap met wederzijds goedvinden of door ontbinding
      recht heeft op een gedeelte van de door de andere partner opgebouwde pensioenrechten, wordt beheerst door het
      recht dat van toepassing is op het partnerschapsvermogensregime van de partners, behoudens het bepaalde in
      [artikel 1, zevende lid, van de Wet verevening pensioenrechten bij scheiding][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel1
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '1'
  - number: '22'
    text: |-
      Of een in Nederland aangegaan geregistreerd partnerschap kan worden beëindigd met wederzijds goedvinden of door
      ontbinding en op welke gronden, wordt bepaald door het Nederlandse recht.
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel22
  - number: '23'
    text: |-
      1 Of een buiten Nederland aangegaan geregistreerd partnerschap kan worden beëindigd met wederzijds goedvinden of
      door ontbinding en op welke gronden, wordt bepaald door het Nederlandse recht.

      2 In afwijking van het bepaalde in het eerste lid is het recht van de staat waar het geregistreerd partnerschap
      is aangegaan toegepasselijk indien in de door partners gesloten overeenkomst omtrent de beëindiging met wederzijds
      goedvinden van het geregistreerd partnerschap gezamenlijk een keuze voor dit recht is gedaan.

      3 Ten aanzien van de beëindiging door ontbinding wordt in afwijking van het bepaalde in het eerste lid het recht
      van de staat waar het geregistreerd partnerschap is aangegaan toegepast, indien in het geding:

      a. door de partners gezamenlijk een keuze voor dit recht is gedaan of een dergelijke keuze door een van de partners
      onweersproken is gebleven; of

      b. door een van beide partners een keuze voor dit recht is gedaan en beide partners een werkelijke maatschappelijke
      band met de staat waar het geregistreerd partnerschap is aangegaan hebben.

      4 Het Nederlandse recht bepaalt de wijze waarop de beëindiging met wederzijds goedvinden of de ontbinding van het
      buiten Nederland aangegane geregistreerd partnerschap geschiedt.
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel23
  - number: '24'
    text: |-
      1 Een buiten Nederland tot stand gekomen beëindiging met wederzijds goedvinden van het geregistreerd partnerschap
      wordt erkend indien zij aldaar rechtsgeldig tot stand is gebracht.

      2 Een buiten Nederland na een behoorlijke rechtspleging verkregen ontbinding van het geregistreerd partnerschap
      wordt in Nederland erkend indien zij is tot stand gekomen door de beslissing van een rechter of andere autoriteit
      aan wie daartoe rechtsmacht toekwam.

      3 Een buiten Nederland verkregen ontbinding van het geregistreerd partnerschap, die niet voldoet aan een of meer
      van de voorwaarden in het vorige lid gesteld, wordt toch in Nederland erkend, indien duidelijk blijkt dat de
      wederpartij in de buitenlandse procedure uitdrukkelijk of stilzwijgend hetzij tijdens die procedure heeft ingestemd
      met, hetzij zich na die procedure heeft neergelegd bij de ontbinding.
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel24
  - number: '25'
    text: |-
      Ten aanzien van een in Nederland of buiten Nederland aangegaan geregistreerd partnerschap wordt het recht dat van
      toepassing is op verplichtingen tot levensonderhoud gedurende het geregistreerd partnerschap en na beëindiging met
      wederzijds goedvinden of door ontbinding van het geregistreerd partnerschap bepaald door het op 2 oktober 1973 te
      's-Gravenhage tot stand gekomen [Verdrag inzake de wet die van toepassing is op onderhoudsverplichtingen](onbekend)
      (Trb. 1974, 86).
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel25
  - number: '29'
    text: |-
      1 Deze wet is niet van toepassing op geregistreerde partnerschappen die voor het tijdstip van haar inwerkingtreding
      zijn aangegaan.

      2 In afwijking van het eerste lid is [artikel 21][ref1] van deze wet van toepassing op de verevening van
      pensioenrechten ingeval het geregistreerde partnerschap na het tijdstip van de inwerkingtreding van deze wet is
      beëindigd of ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0016986#Artikel21
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0016986
        artikel: '21'
        hoofdstuk: '4'
  - number: '30'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel30
  - number: '31'
    text: 'Deze wet wordt aangehaald als: Wet conflictenrecht geregistreerd partnerschap.'
    url: https://wetten.overheid.nl/BWBR0016986/2005-01-01#Artikel31
