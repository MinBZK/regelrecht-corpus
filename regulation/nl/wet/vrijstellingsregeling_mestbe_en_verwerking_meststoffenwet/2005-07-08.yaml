---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: vrijstellingsregeling_mestbe_en_verwerking_meststoffenwet
regulatory_layer: WET
publication_date: '2005-11-21'
valid_from: '2005-07-08'
bwb_id: BWBR0008485
url: https://wetten.overheid.nl/BWBR0008485/2005-07-08
preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op artikel 17 van de Meststoffenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a)
             wet:

              [Meststoffenwet][ref1];



            b)
            Dienst Regelingen:

              Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



            c)
            vracht:

              hoeveelheid die als eenheid in een afzonderlijk transportvoertuig al dan niet met aanhanger wordt afgevoerd
      van een bedrijf;



            d)
            monsternemer:

              op grond van de Regeling erkenning monsternemers Meststoffenwet erkend of voorlopig erkend monsternemer,
      zijnde een onafhankelijk persoon, of een persoon die werkzaam is bij een op grond van de Regeling erkenning
      monsternemers Meststoffenwet erkend of voorlopig erkend monsternemer, zijnde een intermediaire onderneming, en
      voldoet aan de in die regeling gestelde eisen;



            e)
            analyse:

              bepaling van het fosfaatgehalte en het stikstofgehalte in monsters;



            f)
             reinigingsvloeistof:

              vloeistof die overblijft na de reiniging van de bij verbranding, thermische droging of gesloten
      compostering van dierlijke meststoffen vrijkomende gassen door middel van water of een zuur;



            g)
            installatie:

              installatie, als bedoeld in bijlage 1 bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '2'
    text: |-
      Bedrijven die in enig kalenderjaar aan de voorwaarden van deze regeling voldoen, zijn in het betreffende jaar
      vrijgesteld van de heffingen, bedoeld in [titel 2][ref1] van [hoofdstuk IV van de Meststoffenwet][ref2], tot een
      belastbare hoeveelheid mineralen uitgedrukt in kilogrammen fosfaat, onderscheidenlijk stikstof als bedoeld in
      [artikel 13i van de wet][ref3], vastgesteld overeenkomstig de bepalingen van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel13i
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0004054
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004054
        artikel: 13i
  - number: '3.1'
    text: |-
      Op de bedrijven, bedoeld in [artikel 2][ref1], vindt be- of verwerking van dierlijke meststoffen plaats met behulp
      van een installatie.


      [ref1]: https://wetten.overheid.nl/BWBR0008485#Artikel2
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008485
        artikel: '2'
  - number: '3.2'
    text: |-
      Bij aanvang van het desbetreffende kalenderjaar of, ingeval eerst in het kalenderjaar is aangevangen met de be-
      of verwerking, bij aanvang van de be- of verwerking is een milieuvergunning of door het bevoegd gezag afgegeven
      gedoogbeschikking van kracht die mede betrekking heeft op de installatie met bijbehorende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel3
  - number: '4.1'
    text: |-
      De heffingplichtige dient voorafgaand aan het betreffende kalenderjaar bij de Dienst Regelingen het overeenkomstig
      de daarbij aangegeven wijze volledig en naar waarheid ingevulde, ondertekende en gedagtekende formulier, zoals
      opgenomen in bijlage 2 bij deze regeling, in waarop hij:
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel4
  - number: 4.1.a)
    text: een omschrijving geeft van de kenmerken, werking en afmetingen van de op het bedrijf aanwezige installatie,
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel4
  - number: 4.1.b)
    text: |-
      opgave doet van de naar mestvorm, diercategorie en bedrijfssysteem onderscheiden hoeveelheid dierlijke meststoffen
      in kilogrammen die de installatie ten hoogste in een kalenderjaar kan be- of verwerken, en
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel4
  - number: 4.1.c)
    text: |-
      opgave doet van de naar mestvorm, diercategorie en bedrijfssysteem onderscheiden hoeveelheid dierlijke meststoffen
      in kilogrammen die de heffingplichtige voornemens is met behulp van de installatie te be- of verwerken.
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel4
  - number: '4.2'
    text: |-
      Het formulier wordt ingediend tezamen met een afschrift van de milieuvergunning of gedoogbeschikking, bedoeld in
      [artikel 3, tweede lid][ref1]. De indiening van een dergelijk afschrift kan achterwege blijven indien zodanige
      indiening reeds met betrekking tot een eerder kalenderjaar heeft plaatsgevonden en de betreffende milieuvergunning,
      onderscheidenlijk gedoogbeschikking nog steeds van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0008485#Artikel3
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008485
        artikel: '3'
  - number: '4.3'
    text: |-
      In afwijking van het eerste lid wordt het formulier, betrekking hebbend op het kalenderjaar 1998, vóór 1 februari
      van dat jaar ingediend.
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel4
  - number: '4.4'
    text: |-
      In afwijking van het eerste lid wordt het formulier, betrekking hebbend op het kalenderjaar 1999, vóór 15 maart van
      dat jaar ingediend.
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel4
  - number: '4.5'
    text: |-
      Indien op het bedrijf eerst in het kalenderjaar is aangevangen met be- of verwerking, wordt in afwijking van het
      eerste lid het formulier vóór 1 oktober van het desbetreffende kalenderjaar ingediend.
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel4
  - number: '4.6'
    text: |-
      Van een wijziging in de gegevens bedoeld in het eerste lid, onderdelen a, b en c, doet de heffingplichtige
      onverwijld mededeling aan de Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel4
  - number: '5.1'
    text: |-
      Ingeval sprake is van een installatie als bedoeld in bijlage 1, onderdelen a, b, c, d of e, bij deze regeling,
      draagt de heffingplichtige ervoor zorg dat:
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel5
  - number: 5.1.a)
    text: |-
      per vracht afgevoerde eendekroos, algen, as, onderscheidenlijk reinigingsvloeistof bepaling van het gewicht
      uitgedrukt in kilogrammen plaatsvindt door weging met behulp van een weegwerktuig, op zodanige wijze dat daarbij
      het gewicht van het transportmiddel buiten beschouwing blijft;
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel5
  - number: 5.1.b)
    text: |-
      tenminste eenmaal per kwartaal bemonstering en analyse van een homogene of gehomogeniseerde vracht eendekroos,
      algen, as, onderscheidenlijk reinigingsvloeistof plaatsvindt, welke vracht representatief dient te zijn voor de
      andere vrachten van dat kwartaal.
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel5
  - number: '5.2'
    text: |-
      De weging en de bemonstering worden uitgevoerd door een monsternemer. Bij de bemonstering wordt een voor de
      betreffende vracht representatief monster genomen.
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel5
  - number: '5.3'
    text: |-
      Het monster wordt geanalyseerd door een laboratorium als bedoeld in artikel 8 van de Regeling hoeveelheidsbepaling
      dierlijke meststoffen en overige organische meststoffen.
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel5
  - number: '5.4'
    text: 'De analyse geschiedt door achtereenvolgens de volgende handelingen te verrichten:'
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel5
  - number: 5.4.a)
    text: |-
      een voorbehandeling van het monster, hetgeen bij eendekroos, natte algen en reinigingsvloeistof geschiedt door
      homogeniseren conform NEN 7430, en bij as en gedroogde algen door mengen, drogen en malen conform NEN 7431;
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel5
  - number: 5.4.b)
    text: bereiding van een destruaat, hetgeen geschiedt conform NEN 7433 of een daaraan gelijkwaardige methode;
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel5
  - number: 5.4.c)
    text: |-
      bepaling van de hoeveelheid fosfaat, onderscheidenlijk stikstof in het destruaat, hetgeen geschiedt conform NEN
      7435, onderscheidenlijk NEN 7434 of een daaraan gelijkwaardige methode.
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel5
  - number: '5.5'
    text: |-
      Binnen tien dagen na de verzending van de resultaten van de analyse door het laboratorium aan de heffingplichtige,
      kan de heffingplichtige heranalyse aanvragen. Er vindt ten hoogste eenmaal een heranalyse van hetzelfde monster
      plaats. De heranalyse wordt uitgevoerd door het laboratorium dat de analyse heeft uitgevoerd. Indien de heranalyse
      de resultaten van de analyse niet bevestigt, treden de resultaten van de heranalyse voor de toepassing van de
      [artikelen 6 tot en met 9][ref1] in de plaats van de resultaten van de analyse.


      [ref1]: https://wetten.overheid.nl/BWBR0008485#Artikel6
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008485
        artikel: '6'
  - number: '6.1'
    text: |-
      De belastbare hoeveelheid mineralen uitgedrukt in kilogrammen stikstof, bedoeld in [artikel 2][ref1], is de som
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0008485#Artikel2
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008485
        artikel: '2'
  - number: 6.1.a)
    text: |-
      de hoeveelheid stikstof die wordt bepaald door het betreffende in het tweede lid genoemde percentage te nemen van
      de uitkomst van de vermenigvuldiging van de hoeveelheid stikstof per kilogram dierlijke meststoffen met het aantal
      kilogrammen dierlijke meststoffen dat in het betreffende kalenderjaar is be- of verwerkt in de installatie, en
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel6
  - number: 6.1.b)
    text: |-
      de hoeveelheid stikstof die in het betreffende kalenderjaar is afgevoerd in eendekroos, algen, onderscheidenlijk
      reinigingsvloeistof met uitzondering van de reinigingsvloeistof afkomstig van een installatie als bedoeld in
      [bijlage 1][ref1], [onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008485
      [ref2]: https://wetten.overheid.nl/BWBR0008485
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008485
      - id: ref2
        bwb_id: BWBR0008485
  - number: '6.2'
    text: |-
      Het percentage, bedoeld in het eerste lid, onderdeel a, is voor de installatie bedoeld in: [bijlage 1][ref1],
      [onderdeel a][ref2]: 0; [bijlage 1][ref3], [onderdeel b][ref4]: 0; [bijlage 1][ref5], [onderdeel c][ref6]: 100;
      [bijlage 1][ref7], [onderdeel d][ref8]: 0 In afwijking hiervan bedraagt het percentage 10 indien de gasreiniging
      geheel of gedeeltelijk plaatsvindt met behulp van een naverbrander; [bijlage 1][ref9], [onderdeel e][ref10]:
      0; [bijlage 1][ref11], [onderdeel f][ref12]: 70. In afwijking hiervan bedraagt het percentage 0 indien het
      elektriciteitsverbruik van de beluchtingsapparatuur per kilogram stikstof in de dierlijke meststoffen die worden
      belucht, gemiddeld niet tenminste 3 kWh bedraagt. Indien dierlijke meststoffen volgtijdelijk worden be- of verwerkt
      met gebruikmaking van meer dan één installatie, is het percentage het hoogste van de percentages behorend bij de
      gebruikte installaties.


      [ref1]: https://wetten.overheid.nl/BWBR0008485
      [ref2]: https://wetten.overheid.nl/BWBR0008485
      [ref3]: https://wetten.overheid.nl/BWBR0008485
      [ref4]: https://wetten.overheid.nl/BWBR0008485
      [ref5]: https://wetten.overheid.nl/BWBR0008485
      [ref6]: https://wetten.overheid.nl/BWBR0008485
      [ref7]: https://wetten.overheid.nl/BWBR0008485
      [ref8]: https://wetten.overheid.nl/BWBR0008485
      [ref9]: https://wetten.overheid.nl/BWBR0008485
      [ref10]: https://wetten.overheid.nl/BWBR0008485
      [ref11]: https://wetten.overheid.nl/BWBR0008485
      [ref12]: https://wetten.overheid.nl/BWBR0008485
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008485
      - id: ref2
        bwb_id: BWBR0008485
      - id: ref3
        bwb_id: BWBR0008485
      - id: ref4
        bwb_id: BWBR0008485
      - id: ref5
        bwb_id: BWBR0008485
      - id: ref6
        bwb_id: BWBR0008485
      - id: ref7
        bwb_id: BWBR0008485
      - id: ref8
        bwb_id: BWBR0008485
      - id: ref9
        bwb_id: BWBR0008485
      - id: ref10
        bwb_id: BWBR0008485
      - id: ref11
        bwb_id: BWBR0008485
      - id: ref12
        bwb_id: BWBR0008485
  - number: '6.3'
    text: |-
      De hoeveelheid stikstof per kilogram dierlijke meststoffen, bedoeld in het eerste lid, onderdeel a, is een
      duizendste van de naar mestsoort, diercategorie en bedrijfssysteem onderscheiden forfaitaire omrekennormen,
      opgenomen in [bijlage C bij de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '6.4'
    text: |-
      De hoeveelheid stikstof, bedoeld in het eerste lid, onderdeel b, wordt vastgesteld door de som van de
      gewichten in kilogrammen, bedoeld in [artikel 5, eerste lid, onderdeel a][ref1], te vermenigvuldigen
      met het gemiddelde van de hoeveelheden stikstof, vastgesteld door middel van de analyses, bedoeld in
      [artikel 5, eerste lid, onderdeel b][ref2], met dien verstande dat de hoeveelheid stikstof afgevoerd in
      reinigingsvloeistof niet meer bedraagt dan 20 procent van de uitkomst van de vermenigvuldiging, bedoeld in het
      eerste lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0008485#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008485#Artikel5
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008485
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008485
        artikel: '5'
  - number: '7'
    text: |-
      De belastbare hoeveelheid mineralen, uitgedrukt in kilogrammen fosfaat, bedoeld in [artikel 2][ref1],
      is de hoeveelheid fosfaat afgevoerd in eendekroos, algen, onderscheidenlijk as die wordt vastgesteld
      door de som van de gewichten van de in het betreffende jaar afgevoerde vrachten, bepaald overeenkomstig
      [artikel 5, eerste lid, onderdeel a][ref2], te vermenigvuldigen met het gemiddelde van de hoeveelheden fosfaat,
      vastgesteld door middel van de analyses, bedoeld in [artikel 5, eerste lid, onderdeel b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008485#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008485#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0008485#Artikel5
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008485
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008485
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0008485
        artikel: '5'
  - number: '8.1'
    text: |-
      De heffingplichtige houdt gedurende het betreffende kalenderjaar een administratie bij waarin hij steeds onverwijld
      opneemt:
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel8
  - number: 8.1.a)
    text: |-
      per kwartaal de naar mestsoort, diercategorie en bedrijfssysteem onderscheiden hoeveelheden dierlijke meststoffen
      in kilogrammen die zijn be- of verwerkt in de installatie;
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel8
  - number: 8.1.b)
    text: |-
      de resultaten van de weging, bedoeld in [artikel 5, eerste lid, onderdeel a][ref1], onderscheiden naar vracht;


      [ref1]: https://wetten.overheid.nl/BWBR0008485#Artikel5
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008485
        artikel: '5'
  - number: 8.1.c)
    text: |-
      de resultaten van de analyse, bedoeld in [artikel 5, eerste lid, onderdeel b][ref1], onderscheiden naar vracht;


      [ref1]: https://wetten.overheid.nl/BWBR0008485#Artikel5
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008485
        artikel: '5'
  - number: 8.1.d)
    text: |-
      wat betreft de installatie, bedoeld in [bijlage 1][ref1], [onderdeel f][ref2], per kwartaal het verbruik van
      elektriciteit van de beluchtingsapparatuur en de standen van de meter die dit verbruik aangeeft;


      [ref1]: https://wetten.overheid.nl/BWBR0008485
      [ref2]: https://wetten.overheid.nl/BWBR0008485
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008485
      - id: ref2
        bwb_id: BWBR0008485
  - number: 8.1.e)
    text: |-
      alle gegevens, bescheiden en bewijsstukken met betrekking tot de hoeveelheden en resultaten, bedoeld in de
      onderdelen a, b, c en d.
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel8
  - number: '8.2'
    text: |-
      De in onderdeel a bedoelde gegevens houdt de heffingplichtige in zijn administratie bij overeenkomstig het model,
      opgenomen in bijlage 3 bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel8
  - number: '10'
    text: |-
      Indien be- of verwerking plaatsvindt van een na mestscheiding ontstane dikke of waterige
      fractie, wordt voor de toepassing van de [artikelen 4, eerste lid, onderdelen b en c][ref1],
      [6, eerste lid, onderdeel a, tweede en derde lid][ref2], en [8, eerste lid, onderdeel a][ref3], niet uitgegaan van
      die dikke of waterige fractie doch wordt onder dierlijke meststoffen bedoeld in die artikelen verstaan: dierlijke
      meststoffen waaruit de dikke of waterige fractie is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008485#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008485#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008485#Artikel8
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008485
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008485
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0008485
        artikel: '8'
  - number: '11'
    text: |-
      De bijlagen 2, 3 en 4 bij deze regeling liggen ter inzage in de bibliotheek van het Ministerie van Landbouw, Natuur
      en Voedselkwaliteit alsmede bij de Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel11
  - number: '12'
    text: Deze regeling treedt in werking met ingang van 1 januari 1998.
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel12
  - number: '13'
    text: 'Deze regeling wordt aangehaald als: Vrijstellingsregeling mestbe- en verwerking Meststoffenwet.'
    url: https://wetten.overheid.nl/BWBR0008485/2005-07-08#Artikel13
