  - number: '113'
    text: Hetgeen krachtens het voorgaande artikel verschuldigd is, kan worden ingevorderd bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel113
  - number: 113a.1
    text: |-
      Deze paragraaf is niet van toepassing met betrekking tot de handhaving van het bij of krachtens [afdeling 2a][ref1]
      bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel113a
    references:
      - id: ref1
        bwb_id: BWBR0009640
        hoofdstuk: V
        afdeling: 2a
  - number: 113a.2
    text: |-
      Met betrekking tot de kwaliteit van de uitvoering van taken en bevoegdheden en
      tot de handhaving van het bij of krachtens [afdeling 2a][ref1] bepaalde zijn de
      [artikelen 5.3 tot en met 5.23 van de Wet algemene bepalingen omgevingsrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel113a
    references:
      - id: ref1
        bwb_id: BWBR0009640
        hoofdstuk: V
        afdeling: 2a
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '5'
  - number: 113a.3
    text: |-
      Het in [artikel 5.2 van de Wet algemene bepalingen omgevingsrecht][ref1] bedoelde bestuursorgaan heeft tot taak
      zorg te dragen voor de bestuursrechtelijke handhaving van de op grond van [afdeling 2a][ref2] voor degene die de
      betrokken activiteit verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009640#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel113a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009640
        hoofdstuk: V
        afdeling: 2a
  - number: '114.1'
    text: |-
      Vergunningen en ontheffingen verleend krachtens de Vogelwet 1936, de [Jachtwet][ref1],
      [artikel 25 van de Natuurbeschermingswet][ref2] of de Wet bedreigde uitheemse dier- en plantensoorten blijven van
      kracht voor de tijd dat zij zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002155
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel25
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0002155
      - id: ref2
        bwb_id: BWBR0002611
        artikel: '25'
  - number: '114.2'
    text: |-
      Op vergunningen en ontheffingen als bedoeld in het eerste lid is het bepaalde in [artikel 80][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel80
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '80'
        hoofdstuk: V
        afdeling: '3'
  - number: '115.1'
    text: |-
      Ten aanzien van degene aan wie voor het tijdstip van inwerkingtreding van de [artikelen 38 tot en met 44][ref1] te
      rekenen vanaf 1 januari 1977 in enig jaar een jachtakte als bedoeld in de [Jachtwet][ref2], dan wel een vergunning
      als bedoeld in artikel 11 van de Vogelwet 1936 inzake haviken of slechtvalken is uitgereikt, is het bepaalde in
      [artikel 39, eerste lid, onderdeel c][ref3], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002155
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel39
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '38'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002155
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '39'
        hoofdstuk: V
        afdeling: '3'
  - number: '115.2'
    text: |-
      Gedurende een periode van twee jaar en zes maanden na inwerkingtreding van de
      [artikelen 38 tot en met 44 van de wet][ref1] is het bepaalde in [artikel 39, eerste lid, onderdeel c][ref2], niet
      van toepassing indien een jachtexamen als erkend onder de [Jachtwet][ref3] met gunstig gevolg is behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0002155
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '38'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '39'
        hoofdstuk: V
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0002155
  - number: '115.3'
    text: |-
      Ten aanzien van degene aan wie op grond van het tweede lid een jachtakte is uitgereikt, is het bepaalde in
      [artikel 39, eerste lid, onderdeel c][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel39
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '39'
        hoofdstuk: V
        afdeling: '3'
  - number: '116'
    text: |-
      Ten aanzien van degene aan wie voor het tijdstip van inwerkingtreding van [artikel 62][ref1], op grond van artikel
      15 van de Vogelwet 1936 vergunning is verleend, ten behoeve van het prepareren van beschermde vogels, is het
      bepaalde in [artikel 62, tweede lid][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel62
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel116
    references:
