preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de verspreide wettelijke regels inzake de bescherming
    van in het wild levende planten- en diersoorten in één wet onder te brengen, dit vooral teneinde een betere
    afstemming tussen die regels te bewerkstelligen als ook in verband met de uitvoering van internationale
    verplichtingen en van besluiten van volkenrechtelijke organisaties inzake de bescherming van die soorten, zulks in
    het belang van de bescherming van die planten- en diersoorten en, voorzover het die diersoorten betreft, mede onder
    erkenning van de intrinsieke waarde van de daartoe behorende dieren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: Onze Minister: Onze Minister van Economische
      Zaken; Faunafonds: fonds, bedoeld in [artikel 83][ref1]; dieren: dieren in al hun ontwikkelingsstadia, met
      uitzondering van eieren; planten: planten in al hun ontwikkelingsstadia; producten van dieren: dode dieren,
      delen van levende of dode dieren en alle van dieren afgeleide producten, al dan niet in andere zaken vervat,
      alsmede alle zaken waarvan uit een begeleidend document, de verpakking, een merkteken of etiket of enige
      andere omstandigheid moet worden aangenomen dat zij afgeleide producten of delen van dieren bevatten of
      daaruit bestaan; producten van planten: dode planten, delen van levende of dode planten en alle van planten
      afgeleide producten, al dan niet in andere zaken vervat, alsmede alle zaken waarvan uit een begeleidend
      document, de verpakking, een merkteken of etiket of enige andere omstandigheid moet worden aangenomen dat
      zij afgeleide producten of delen van planten bevatten of daaruit bestaan; beschermde inheemse plantensoort:
      plantensoort aangewezen krachtens [artikel 3][ref2]; beschermde inheemse diersoort: diersoort als bedoeld in
      [artikel 4, eerste lid][ref3], of aangewezen krachtens [artikel 4, tweede of derde lid][ref4]; beschermde uitheemse
      plantensoort: 'plantensoort aangewezen krachtens [artikel 5][ref5]; beschermde uitheemse diersoort: diersoort'
      aangewezen krachtens [artikel 5][ref6]; wild: dieren behorende tot één der in [artikel 32, eerste lid][ref7],
      bedoelde diersoorten, die in de voor hun aard natuurlijke vrijheid leven; jagen: bemachtigen, doden of
      het met het oog daarop opsporen van wild alsmede het doen van pogingen daartoe; jachthouder: degene die
      overeenkomstig het in de [artikelen 33][ref8] of [34][ref9] bepaalde gerechtigd is tot het gehele of
      gedeeltelijke genot van de jacht; jachtakte: akte als bedoeld in [artikel 38, eerste lid, onderdeel a][ref10];
      valkeniersakte: 'akte als bedoeld in [artikel 38, eerste lid, onderdeel b][ref11]; kooikersakte: akte als'
      bedoeld in [artikel 38, eerste lid, onderdeel c][ref12]; jachtvogel: vogel met behulp waarvan de jacht
      krachtens [artikel 50, eerste lid][ref13], mag worden uitgeoefend; grondgebruiker: degene die gerechtigd
      is de grond te gebruiken, hetzij als eigenaar, hetzij krachtens een beperkt recht, hetzij krachtens een
      pachtovereenkomst; faunabeheereenheid: overeenkomstig [artikel 29][ref14] erkend samenwerkingsverband
      van jachthouders; faunabeheerplan: overeenkomstig [artikel 30][ref15] goedgekeurd faunabeheerplan;
      wildbeheereenheid: een rechtspersoonlijkheid bezittend samenwerkingsverband van jacht(akte)houders en
      anderen dat tot doel heeft te bevorderen dat jacht, beheer en schadebestrijding, al dan niet ter uitvoering
      van het door de faunabeheereenheid opgestelde faunabeheerplan, wordt uitgevoerd mede in samenwerking met
      en mede ten dienste van grondgebruikers of terreinbeheerders; jachtopzichter: degene die zorg draagt voor
      de bescherming van de jachtbelangen van een jachthouder en tevens als buitengewoon opsporingsambtenaar
      belast is met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten en van de overige in
      de akte of aanwijzing als bedoeld in [artikel 142, tweede lid, van het Wetboek van Strafvordering][ref16]
      aangeduide strafbare feiten; kooiker: degene die ingevolge het bepaalde in [artikel 57][ref17] als zodanig is
      geregistreerd; walvissen: baleinwalvissen en potvissen; richtlijn nr. 2009/147/EG van het Europees Parlement
      en de Raad van de Europese Unie van 30 november 2009 inzake het behoud van de vogelstand (PbEU 2010, L 20);
      richtlijn 92/43/EEG: richtlijn 92/43/EEG van de Raad van de Europese Gemeenschappen van 21 mei 1992 inzake
      de instandhouding van de natuurlijke habitats en de wilde flora en fauna (PbEG L 206); omgevingsvergunning:
      omgevingsvergunning als bedoeld in [artikel 1.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref18];
      exclusieve economische zone: exclusieve economische zone van Nederland als bedoeld in de
      [Rijkswet instelling exclusieve economische zone][ref19].


