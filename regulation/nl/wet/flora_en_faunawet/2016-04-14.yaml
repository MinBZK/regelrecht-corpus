  - number: '104.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren, de bij besluit van gedeputeerde staten aangewezen ambtenaren, alsmede de door Onze
      Minister van Veiligheid en Justitie op grond van [artikel 17 van de Wet op de economische delicten][ref1] met de
      opsporing van de bij of krachtens deze wet strafbaar gestelde feiten belaste ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel17
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '17'
  - number: '104.2'
    text: |-
      Van een besluit van Onze Minister, bedoeld in het eerste lid, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel104
  - number: '112.1'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bij of krachtens
      deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel112
  - number: '112.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid en [artikel 117 van het Wetboek van Strafvordering][ref1] kan Onze
      Minister bepalen, dat planten of dieren of producten van planten of dieren die in strijd met het bepaalde bij
      of krachtens deze wet binnen het grondgebied van Nederland zijn gebracht, op kosten van de eigenaar, vervoerder,
      importeur of diens gemachtigde, worden teruggezonden naar het land van uitvoer of herkomst of naar enige andere
      plaats buiten Nederland worden gebracht die daarvoor naar het oordeel van Onze Minister geschikt is en in
      overeenstemming is met de doeleinden van de Overeenkomst inzake de internationale handel in bedreigde in het wild
      levende dier- en plantesoorten.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel117
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '117'
  - number: '112.3'
    text: |-
      Onverminderd het bepaalde in het eerste lid kan Onze Minister bepalen dat levende dieren, behorend tot een
      beschermde inheemse diersoort, waarvan kan worden aangenomen dat zij zich in de natuur kunnen handhaven en die in
      strijd met het bepaalde bij of krachtens deze wet worden gehouden, op kosten van de eigenaar of van degene die deze
      dieren onder zich heeft, in hun natuurlijke leefomgeving in vrijheid worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel112
  - number: '112.4'
    text: |-
      Onder de in het tweede en derde lid bedoelde kosten kunnen mede zijn begrepen de kosten van bewaring in verband met
      het transport naar de plaats van bestemming.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel112
  - number: '112.5'
    text: |-
      Indien niet tot terugzending of tot invrijheidstelling in de natuurlijke leefomgeving als bedoeld in het tweede
      onderscheidenlijk derde lid wordt besloten, kunnen de kosten van verzorging, huisvesting of opslag binnen Nederland
      geheel of gedeeltelijk in rekening worden gebracht bij de eigenaar, vervoerder, importeur of diens gemachtigde,
      bedoeld in het tweede lid. Bij ministeriële regeling kunnen terzake nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel112
  - number: 112a
    text: |-
      De Nederlandse strafwet is van toepassing op een ieder die zich in de exclusieve economische zone schuldig maakt
      aan overtreding van:
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel112a
  - number: 112a.a
    text: |-
      regels gesteld bij of krachtens [artikel 13, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel112a
