  - number: '79.1'
    text: |-
      Aan vrijstellingen, ontheffingen of vergunningen kunnen voorschriften worden verbonden. Zij kunnen onder
      beperkingen worden verleend. De voorschriften en beperkingen kunnen worden gewijzigd. Vergunningen en ontheffingen
      kunnen worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel79
  - number: '79.2'
    text: |-
      Het is verboden te handelen in strijd met de bij een vrijstelling, ontheffing of vergunning gestelde voorschriften
      en beperkingen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel79
  - number: '79.3'
    text: Vergunningen en ontheffingen kunnen aan een geldigheidsduur worden gebonden.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel79
  - number: '80'
    text: 'Een vergunning of ontheffing kan worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel80
  - number: 80.a
    text: |-
      de houder van een vergunning of ontheffing, nadat deze is verleend onherroepelijk is veroordeeld wegens een bij
      deze wet strafbaar gesteld feit of indien tegen hem deswege een strafbeschikking is uitgevaardigd;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel80
  - number: 80.b
    text: |-
      de houder van een vergunning of ontheffing, nadat deze is verleend, onherroepelijk is veroordeeld wegens een feit
      strafbaar gesteld bij de [Wet dieren][ref1] voorzover het gedragingen als bedoeld in de [artikelen 2.1][ref2],
      [2.2][ref3], [2.3][ref4], [2.5][ref5], [2.6][ref6], [2.7][ref7], [2.8][ref8], [2.9][ref9], [2.10][ref10],
      [2.13][ref11], [2.14][ref12] of [2.15 van die wet][ref13] betreft, dan wel deswege hem een strafbeschikking
      is uitgevaardigd, of indien hij vervolging deswege heeft voorkomen overeenkomstig de bepalingen van
      [artikel 74 van het Wetboek van Strafrecht][ref14] of hem wegens overtreding van het krachtens de voornoemde
      artikelen van de Wet dieren bepaalde een bestuurlijke boete als bedoeld in [artikel 8.7 van de Wet dieren][ref15]
      is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0030250
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0030250#Artikel2
