        paragraaf: '2'
        afdeling: '1'
  - number: '123.1'
    text: |-
      De artikelen van de Vogelwet 1936, de [Jachtwet][ref1] en de Wet bedreigde uitheemse dier- en plantensoorten
      vervallen op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen van genoemde
      wetten, of onderdelen daarvan, verschillend kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002155
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002155
  - number: '123.2'
    text: |-
      De artikelen[ 22 tot en met 25 van de Natuurbeschermingswet][ref1] vervallen op een bij koninklijk besluit te
      bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel22
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '22'
  - number: '123.3'
    text: |-
      De Vogelwet 1936, de [Jachtwet][ref1], de Nuttige Dierenwet 1914 en de Wet bedreigde uitheemse dier- en
      plantensoorten worden ingetrokken op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      wetten verschillend kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002155
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002155
  - number: '123.4'
    text: |-
      Ten aanzien van zaken betreffende overtredingen van ingevolge de voorafgaande leden vervallen onderscheidenlijk
      ingetrokken voorschriften die op het tijdstip van vervallen onderscheidenlijk intrekking bij de tot dat tijdstip
      bevoegde rechter aanhangig waren, blijft deze rechter bevoegd.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel123
  - number: '123.5'
    text: |-
      De in het vierde lid bedoelde zaken worden onverminderd
      [artikel 1, tweede lid, van het Wetboek van Strafrecht][ref1], afgedaan volgens op het in het derde lid bedoelde
      tijdstip geldende regels.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel1
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '1'
  - number: '125'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vier jaar,
      aan de beide kamers der Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de
      praktijk.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel125
  - number: '126'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel126
  - number: '127'
    text: 'Deze wet kan worden aangehaald als: Flora- en faunawet.'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel127
