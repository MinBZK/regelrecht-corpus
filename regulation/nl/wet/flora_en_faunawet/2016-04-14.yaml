        paragraaf: '3'
        afdeling: '1'
  - number: '75.4'
    text: |-
      Onze Minister kan bij verlening van een ontheffing als bedoeld in het derde lid niet afwijken van het bepaalde
      bij of krachtens [artikel 72, vijfde lid][ref1], voor het toestaan van middelen die onnodig lijden van dieren
      veroorzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel72
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '72'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: '75.5'
    text: |-
      Vrijstellingen en ontheffingen worden tenzij uitvoering van internationale verplichtingen of bindende besluiten van
      organen van de Europese Unie of andere volkenrechtelijke organisaties noodzaakt tot het verlenen van vrijstelling
      of ontheffing om andere redenen, slechts verleend indien geen afbreuk wordt gedaan aan een gunstige staat van
      instandhouding van de soort.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75
  - number: '75.6'
    text: |-
      Onverminderd het vijfde lid, worden voor soorten genoemd in bijlage IV van richtlijn 92/43/EEG, voor soorten vogels
      als bedoeld in [artikel 4, eerste lid, onderdeel b][ref1], en voor bij algemene maatregel van bestuur aangewezen
      beschermde inheemse dier- of plantensoorten vrijstelling of ontheffing slechts verleend wanneer er geen andere
      bevredigende oplossing bestaat:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel4
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '4'
        hoofdstuk: II
  - number: 75.6.a
    text: |-
      ten behoeve van onderzoek en onderwijs, repopulatie en herintroductie, alsmede voor de daartoe benodigde kweek, met
      inbegrip van de kunstmatige vermeerdering van planten;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75
  - number: 75.6.b
    text: |-
      teneinde het onder strikt gecontroleerde omstandigheden mogelijk te maken op selectieve wijze en binnen bepaalde
      grenzen een bij algemene maatregel van bestuur te bepalen aantal van bij die maatregel aan te wijzen soorten te
      vangen, te plukken of in bezit te hebben of,
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75
  - number: 75.6.c
    text: met het oog op andere, bij algemene maatregel van bestuur aan te wijzen, belangen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75
  - number: '75.7'
    text: |-
      Vrijstellingen kunnen in ieder geval verschillend worden vastgesteld naar gelang de soorten of categorieën van
      soorten en handelingen welke de vrijstelling betreffen. Voorts kan onderscheid worden gemaakt naar wilde of
      gekweekte planten of producten van die planten, en naar wilde of gefokte dieren dan wel eieren, nesten of producten
      van die dieren.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75
  - number: 75a.1
    text: |-
      Indien daartoe door Onze Minister van Infrastructuur en Milieu is verzocht, geschiedt de behandeling van de
      aanvraag om de in [artikel 75, derde lid][ref1], bedoelde ontheffing, tezamen met de voorbereiding en vaststelling
      van het tracébesluit, bedoeld in [artikel 9, eerste lid, van de Tracéwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel9
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '75'
        hoofdstuk: V
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '9'
  - number: 75a.2
    text: |-
      In de in het eerste lid bedoelde gevallen is op de voorbereiding van de beschikking
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Zienswijzen kunnen naar voren worden
      gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 75a.3
    text: |-
      Ten aanzien van het beroep tegen een met toepassing van het eerste lid verleende ontheffing zijn de
      [artikelen 25][ref1] en [26 van de Tracéwet][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel26
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '26'
  - number: 75b.1
    text: 'Deze afdeling is van toepassing op handelingen:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75b
  - number: 75b.1.a
    text: waarvoor een omgevingsvergunning is vereist en
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75b
  - number: 75b.1.b
    text: |-
      die tevens zijn aan te merken als handelingen waarvoor een of meer van de bij of krachtens de
      [artikelen 8 tot en met 13, eerste lid][ref1], [17][ref2] en [18][ref3] gestelde verboden gelden en ten aanzien
      waarvan Onze Minister op grond van [artikel 75, derde lid][ref4], bevoegd is ontheffing te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0009640#Artikel75
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75b
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '17'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '18'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0009640
        artikel: '75'
        hoofdstuk: V
        afdeling: '2'
  - number: 75b.2
    text: |-
      Deze afdeling is niet van toepassing op handelingen die zijn toegestaan krachtens een ontheffing als bedoeld in
      [artikel 75, derde lid][ref1], of waarvoor een zodanige ontheffing is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75b
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '75'
        hoofdstuk: V
        afdeling: '2'
  - number: 75b.3
    text: |-
      De bij of krachtens de [artikelen 8 tot en met 13, eerste lid][ref1], [17][ref2] en [18][ref3] gestelde verboden
      gelden niet voor handelingen die zijn toegestaan krachtens een omgevingsvergunning die met toepassing van deze
      afdeling is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel18
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75b
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '17'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '18'
        hoofdstuk: III
        paragraaf: '4'
  - number: 75c.1
    text: |-
      De aanvrager van een omgevingsvergunning draagt er zorg voor dat de aanvraag tevens betrekking heeft op de
      handelingen die voldoen aan de criteria, bedoeld in [artikel 75b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75b
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75c
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: 75b
        hoofdstuk: V
        afdeling: 2a
  - number: 75c.2
    text: |-
      Indien toepassing wordt gegeven aan [artikel 2.5 van de Wet algemene bepalingen omgevingsrecht][ref1], is
      [artikel 75d][ref2] van overeenkomstige toepassing op de beschikking met betrekking tot de eerste en tweede fase.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel75d
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75c
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: 75d
        hoofdstuk: V
        afdeling: 2a
  - number: 75d.1
    text: |-
      Een omgevingsvergunning die betrekking heeft op handelingen als bedoeld in [artikel 75b, eerste lid][ref1], wordt
      niet verleend dan nadat Onze Minister heeft verklaard dat hij daartegen geen bedenkingen heeft als bedoeld in
      [artikel 2.27, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75b
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75d
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: 75b
        hoofdstuk: V
        afdeling: 2a
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 75d.2
    text: |-
      [Artikel 75, vierde tot en met zesde lid][ref1], is van overeenkomstige toepassing met betrekking tot de
      verklaring, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75d
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '75'
        hoofdstuk: V
        afdeling: '2'
  - number: 75d.3
    text: |-
      Onze Minister kan een verzoek als bedoeld in
      [artikel 2.29, eerste lid, tweede volzin, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref1]
      slechts doen indien de omstandigheden sinds het tijdstip waarop de verklaring is gegeven zodanig zijn gewijzigd,
      dat deze niet zou zijn gegeven of niet zonder daarbij te bepalen dat aan de omgevingsvergunning daarbij aangegeven
      voorschriften worden verbonden, indien deze omstandigheden op het bedoelde tijdstip zouden hebben bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75d
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 75e
    text: |-
      Het is verboden te handelen in strijd met een voorschrift van een omgevingsvergunning dat betrekking heeft op
      handelingen als bedoeld in [artikel 75b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75b
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75e
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: 75b
        hoofdstuk: V
        afdeling: 2a
  - number: 75f
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag tot ontheffing
      als bedoeld in de [artikelen 68, eerste lid][ref3], en [75, derde lid][ref4], van het verbod bedoeld in
      [artikel 13][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel68
      [ref4]: https://wetten.overheid.nl/BWBR0009640#Artikel75
      [ref5]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75f
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '68'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0009640
        artikel: '75'
        hoofdstuk: V
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0009640
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '76.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende vrijstellingen,
      ontheffingen of vergunningen, mede voorzover dit noodzakelijk is ter uitvoering van internationale verplichtingen
      of bindende besluiten van organen van de Europese Unie of andere volkenrechtelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel76
  - number: '76.2'
    text: 'Tot deze regels kunnen behoren regels omtrent:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel76
  - number: 76.2.a
    text: |-
      de documenten, gegevens of bewijsstukken die bij het aanvragen van ontheffingen of vergunningen of in verband met
      een vrijstelling dienen te worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel76
  - number: 76.2.b
    text: |-
      de aanwijzing van de ambtenaren aan wie de documenten waarvan zendingen van planten of producten van planten of van
      dieren, eieren, nesten of producten van dieren vergezeld gaan, dienen te worden getoond of ter hand gesteld;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel76
  - number: 76.2.c
    text: vakbekwaamheid ten aanzien van het vervoeren, houden of verzorgen van planten of dieren;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel76
  - number: 76.2.d
    text: de wijze waarop en de omstandigheden waaronder planten of dieren worden vervoerd of gehouden;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel76
  - number: 76.2.e
    text: |-
      het aanbrengen van merken of merktekens aan planten of producten van planten of van ringen of merktekens aan dieren
      of aan producten van dieren;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel76
  - number: 76.2.f
    text: de registratie van planten, producten van planten, dieren, eieren, nesten of producten van dieren;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel76
  - number: 76.2.g
    text: de termijn waarbinnen een vergunning of ontheffing wordt verleend.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel76
  - number: '77'
    text: |-
      Bij algemene maatregel van bestuur kan het aantal ontheffingen voor het onder zich hebben van jachtvogels alsmede
      het aantal vogels per ontheffing, aan een maximum worden gebonden.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel77
  - number: '78'
    text: |-
      Onze Minister kan een vergoeding van kosten vragen overeenkomstig een door hem vast te stellen tarief voor de
      afgifte van:
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel78
  - number: 78.a
    text: |-
      ontheffingen als bedoeld in [artikel 75][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '75'
        hoofdstuk: V
        afdeling: '2'
  - number: 78.b
    text: |-
      vergunningen als bedoeld in [artikel 63, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel63
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '63'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '1'
  - number: 78.c
    text: |-
      op grond van vrijstellingen als bedoeld in de [artikelen 63][ref1] en [75][ref2] benodigde documenten, ringen,
      merken of merktekens.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel75
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '63'
        hoofdstuk: V
