  - number: '7.1'
    text: |-
      Onze Minister stelt, mede ter uitvoering van internationale verplichtingen of bindende besluiten van organen van
      de Europese Unie of andere volkenrechtelijke organisaties, lijsten vast van met uitroeiing bedreigde of speciaal
      gevaar lopende in ons land van nature voorkomende planten- of diersoorten.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister bevordert in ieder geval ten aanzien van soorten, vermeld op de lijsten, bedoeld in het eerste lid,
      onderzoek en werkzaamheden, nodig voor bescherming en beheer.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel7
  - number: '7.3'
    text: Tot de werkzaamheden, bedoeld in het tweede lid, kan behoren het opstellen van beschermingsplannen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel7
  - number: '7.4'
    text: Onze Minister maakt de lijsten, bedoeld in het eerste lid, bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel7
  - number: '8'
    text: |-
      Het is verboden planten, behorende tot een beschermde inheemse plantensoort, te plukken, te verzamelen, af
      te snijden, uit te steken, te vernielen, te beschadigen, te ontwortelen of op enigerlei andere wijze van hun
      groeiplaats te verwijderen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel8
  - number: '9'
    text: |-
      Het is verboden dieren, behorende tot een beschermde inheemse diersoort, te doden, te verwonden, te vangen, te
      bemachtigen of met het oog daarop op te sporen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel9
  - number: '10'
    text: Het is verboden dieren, behorende tot een beschermde inheemse diersoort, opzettelijk te verontrusten.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel10
  - number: '11'
    text: |-
      Het is verboden nesten, holen of andere voortplantings- of vaste rust- of verblijfplaatsen van dieren, behorende
      tot een beschermde inheemse diersoort, te beschadigen, te vernielen, uit te halen, weg te nemen of te verstoren.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel11
  - number: '12'
    text: |-
      Het is verboden eieren van dieren, behorende tot een beschermde inheemse diersoort, te zoeken, te rapen, uit het
      nest te nemen, te beschadigen of te vernielen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel12
  - number: 12a.1
    text: |-
      Onverminderd [artikel 9][ref1] is het verboden zonder vergunning van Onze Minister van een Nederlands schip uit
      walvissen te vangen of te doden dan wel aan boord van een zodanig schip walvissen te verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel9
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
  - number: 12a.2
    text: |-
      Aan een vergunning als bedoeld in het eerste lid worden voorschriften verbonden ter bescherming van de walvisstand
      dan wel ter bevordering van het wetenschappelijk onderzoek met betrekking tot walvissen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel12a
  - number: 12a.3
    text: 'Bij de voorschriften, bedoeld in het tweede lid, wordt verboden:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel12a
  - number: 12a.3.a
    text: |-
      walvissen van bepaalde soorten, walvissen die een bepaalde lengte niet hebben bereikt en vrouwelijke walvissen die
      vergezeld worden door jonge walvissen, te vangen of te doden;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel12a
  - number: 12a.3.b
    text: walvissen in bepaalde zeegebieden te vangen, te doden of te verwerken;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel12a
  - number: 12a.3.c
    text: gedode walvissen niet, niet tijdig of niet volledig te verwerken.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel12a
  - number: 12a.4
    text: |-
      De voorschriften, bedoeld in het derde lid, kunnen voorts onder meer regels inhouden omtrent het vangen, doden of
      verwerken van walvissen in bepaalde tijdvakken, omtrent het tijdstip, waarop de walvisvangst ieder seizoen moet
      worden gestaakt, omtrent de wijze van beloning van de harpoeniers en de bemanningen van de vaartuigen waarmee de
      walvisvangst wordt uitgeoefend, dan wel omtrent de door de vergunningplichtige met betrekking tot de walvisvangst
      te verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel12a
  - number: 12a.5
    text: |-
      Onze Minister kan aan de vergunning verbonden voorschriften wijzigen of intrekken dan wel aan die voorschriften
      nieuwe toevoegen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel12a
  - number: '13.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel13
  - number: 13.1.a
    text: |-
      planten of producten van planten, of dieren dan wel eieren, nesten of producten van dieren, behorende tot een
      beschermde inheemse of beschermde uitheemse plantensoort onderscheidenlijk een beschermde inheemse of beschermde
      uitheemse diersoort, of
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel13
  - number: 13.1.b
    text: |-
      te koop te vragen, te kopen of te verwerven, ten verkoop voorhanden of in voorraad te hebben, te verkopen of
      ten verkoop aan te bieden, te vervoeren, ten vervoer aan te bieden, af te leveren, te gebruiken voor commercieel
      gewin, te huren of te verhuren, te ruilen of in ruil aan te bieden, uit te wisselen of tentoon te stellen voor
      handelsdoeleinden, binnen of buiten het grondgebied van Nederland te brengen of onder zich te hebben.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel13
  - number: '13.4'
    text: |-
      Met uitzondering van het verbod op het binnen of buiten het grondgebied van Nederland brengen, gelden de
      in het eerste lid bedoelde verboden noch ten aanzien van planten of producten van planten, noch ten aanzien
      van dieren of eieren, nesten of producten van dieren behorende tot een beschermde uitheemse plantensoort
      onderscheidenlijk een beschermde uitheemse diersoort, die is aangewezen om redenen als bedoeld in
      [artikel 5, eerste lid, onderdeel b][ref1], indien kan worden aangetoond dat zij:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel5
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '5'
        hoofdstuk: II
  - number: 13.4.a
    text: overeenkomstig het bij of krachtens deze wet bepaalde in Nederland zijn gebracht of
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel13
  - number: 13.4.b
    text: |-
      overeenkomstig de Wet bedreigde uitheemse dier- en plantensoorten zijn verworven voor het tijdstip van
      inwerkingtreding van dit artikel.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel13
  - number: '14.1'
    text: Het is verboden dieren of eieren van dieren in de vrije natuur uit te zetten.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel14
  - number: '14.2'
    text: |-
      Het is verboden planten behorende tot bij algemene maatregel van bestuur aangewezen soorten in de vrije natuur te
      planten of uit te zaaien.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel14
  - number: '14.3'
    text: |-
      Het is verboden planten of dieren, behorende tot bij algemene maatregel van bestuur aangewezen soorten, onder zich
      te hebben, binnen of buiten het grondgebied van Nederland te brengen, te koop te vragen, te kopen of te verwerven,
      ten verkoop voorradig of voorhanden te hebben, te verkopen of ten verkoop aan te bieden, te vervoeren, ten vervoer
      aan te bieden of af te leveren, te gebruiken voor commercieel gewin, te huren of te verhuren, te ruilen of in ruil
      aan te bieden.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel14
  - number: '14.4'
    text: |-
      Krachtens het tweede en derde lid kunnen slechts worden aangewezen soorten die een gevaar kunnen opleveren voor het
      voortbestaan van beschermde inheemse dier- of plantensoorten of die aanmerkelijke verslechtering kunnen veroorzaken
      van omstandigheden die voor het voortbestaan van die soorten noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel14
  - number: '14.5'
    text: |-
      Het verbod, bedoeld in het eerste lid, geldt niet voor het uitzetten van bij algemene maatregel van bestuur
      aangewezen vissoorten, waarop de [Visserijwet 1963][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002416
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002416
  - number: '15.1'
    text: |-
      Het is verboden bij algemene maatregel van bestuur aangewezen middelen die geschikt en bestemd zijn voor het doden
      of vangen van dieren, onder zich te hebben, binnen of buiten het grondgebied van Nederland te brengen, te koop te
      vragen, te kopen of te verwerven, ten verkoop voorradig of voorhanden te hebben, te verkopen of ten verkoop aan te
      bieden, te vervoeren, ten vervoer aan te bieden of af te leveren, te gebruiken voor commercieel gewin, te huren of
      te verhuren, te ruilen of in ruil aan te bieden.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel15
  - number: '15.2'
    text: |-
      Het is verboden zich buiten gebouwen te bevinden met bij algemene maatregel van bestuur aangewezen middelen die
      geschikt zijn voor het doden of vangen van dieren, of met materialen ter onmiddellijke vervaardiging van die
      middelen of van de krachtens het eerste lid aangewezen middelen, indien redelijkerwijs moet worden aangenomen dat
      die middelen of materialen voor het doden of vangen van dieren zullen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel15
  - number: '15.3'
    text: |-
      Bij een aanwijzing als bedoeld in het eerste of tweede lid, wordt mede rekening gehouden met het belang te
      voorkomen dat een onnodig grote inbreuk op het welzijn van het te doden of te vangen dier wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel15
  - number: 15a.1
    text: |-
      Onverminderd het bepaalde in de [artikelen 15][ref1] en [72][ref2] is het, ingeval op grond van
      [Hoofdstuk V, titel III][ref3], een afwijking van [artikel 9][ref4] wordt toegepast, verboden gebruik te maken van
      alle middelen, installaties of methoden voor het massale of niet-selectieve bemachtigen, vangen of doden van vogels
      als bedoeld in [artikel 4, eerste lid, onderdeel b][ref5], of die de plaatselijke verdwijning van deze soorten tot
      gevolg kunnen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0009640#HoofdstukV
      [ref4]: https://wetten.overheid.nl/BWBR0009640#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0009640#Artikel4
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '15'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '72'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0009640
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0009640
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0009640
        artikel: '4'
        hoofdstuk: II
  - number: 15a.2
    text: 'Tot de middelen, bedoeld in het eerste lid, behoren in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel15a
  - number: 15a.2.a
    text: de middelen, bedoeld in bijlage IV, onderdeel a, van richtlijn 2009/147/EG; en
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel15a
  - number: 15a.2.b
    text: |-
      elke achtervolging met behulp van de vervoersmiddelen, bedoeld in bijlage IV, onderdeel b, van richtlijn 2009/147/
      EG, op de in de bijlage omschreven wijze.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel15a
  - number: 15b.1
    text: |-
      Onverminderd het bepaalde in de [artikelen 15][ref1] en [72][ref2] is het, ingeval op grond van
      [Hoofdstuk V, titel III][ref3], een afwijking van [artikel 9][ref4] wordt toegepast, verboden om dieren die
      behoren tot de soorten, genoemd in bijlage IV, onderdeel a, of bijlage V, onderdeel a, van richtlijn 92/43/EEG, te
      bemachtigen, te vangen of te doden met gebruikmaking van niet-selectieve middelen die de plaatselijke verdwijning
      of ernstige verstoring van de rust van de populaties van deze soorten tot gevolg kunnen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0009640#HoofdstukV
      [ref4]: https://wetten.overheid.nl/BWBR0009640#Artikel9
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '15'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '72'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0009640
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0009640
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
  - number: 15b.2
    text: 'Tot de middelen, bedoeld in het eerste lid, behoren in in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel15b
  - number: 15b.2.a
    text: de middelen, bedoeld in bijlage VI, onderdeel a, van richtlijn 92/43/EEG; en
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel15b
  - number: 15b.2.b
    text: |-
      elke vorm van vangen en doden, vanuit de vervoersmiddelen, bedoeld in bijlage VI, onderdeel b, van richtlijn 92/43/
      EEG.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel15b
  - number: '16.1'
    text: |-
      Het is degene die niet voorzien is van een jachtakte, verboden in het veld een geweer of een gedeelte van een
      geweer te dragen tenzij hij uit andere hoofde tot het gebruik van een geweer ter plaatse gerechtigd is.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel16
  - number: '16.2'
    text: |-
      Het is degene die zich in het veld ophoudt, verboden zich zonder gegronde reden met een fret, een buidel of een
      kastval te bevinden op gronden, waarop hij niet bevoegd is van die middelen gebruik te maken voor de uitoefening
      van de jacht of in verband met beheer en bestrijding van schade als bedoeld in de [artikelen 65][ref1], [67][ref2]
      en [68][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel68
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '65'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '67'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '68'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: '16.3'
    text: |-
      Een ieder is verplicht te verhinderen dat een dier dat hem toebehoort of onder zijn toezicht staat, in het veld
      dieren opspoort, doodt, verwondt, vangt of bemachtigt.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel16
  - number: '17'
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van de instandhouding van beschermde inheemse plantensoorten
      of beschermde inheemse diersoorten het verrichten van bij die maatregel aangewezen handelingen worden verboden of
      aan beperkingen worden gebonden, voorzover die handelingen een ernstige bedreiging kunnen vormen voor planten of
      dieren behorende tot die soorten, dan wel kunnen leiden tot aanmerkelijke verslechtering van omstandigheden die
      voor het voortbestaan van die soorten noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel17
  - number: '18.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter uitvoering van internationale verplichtingen of van bindende
      besluiten van organen van de Europese Unie of andere volkenrechtelijke organisaties de verboden, bedoeld in de
      [artikelen 8 tot en met 16][ref1], worden gewijzigd en kunnen nieuwe verboden worden gesteld inzake de in die
      artikelen geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel8
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '18.2'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid blijft, behoudens eerdere intrekking, van kracht
      voor een termijn van ten hoogste één jaar, tenzij binnen die termijn een wetsvoorstel dat hetzelfde onderwerp
      regelt, bij de Tweede Kamer der Staten-Generaal wordt ingediend. In dat geval blijft dat besluit van kracht totdat
      bij wet in dat onderwerp is voorzien of totdat het voorstel van wet wordt ingetrokken of één van beide Kamers der
      Staten-Generaal besluit het voorstel niet aan te nemen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel18
  - number: '19.1'
    text: |-
      Gedeputeerde staten kunnen een plaats die van wezenlijke betekenis is als leefomgeving voor een beschermde inheemse
      plantensoort of een beschermde inheemse diersoort, met het oog op instandhouding van die plaats ten behoeve van die
      soort, aanwijzen als beschermde leefomgeving. Het besluit bevat de kadastrale aanduiding van de percelen waarop de
      aangewezen plaats is gelegen en gaat vergezeld van een kaart waarop de plaats is aangegeven.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel19
  - number: '19.2'
    text: |-
      Een plaats als bedoeld in het eerste lid, kan niet worden aangewezen als beschermde leefomgeving, indien die
      gelegen is in een krachtens de [Natuurbeschermingswet 1998][ref1] aangewezen beschermd natuurmonument dan wel in
      een gebied ten aanzien waarvan een besluit tot aanwijzing als beschermd natuurmonument wordt voorbereid.


      [ref1]: https://wetten.overheid.nl/BWBR0009641
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009641
  - number: '19.3'
    text: |-
      Een plaats als bedoeld in het eerste lid, kan niet worden aangewezen als beschermde leefomgeving voor een
      beschermde inheemse plantensoort of een beschermde inheemse diersoort, indien die gelegen is in een krachtens
      [artikel 10a van de Natuurbeschermingswet 1998][ref1] aangewezen gebied of in een gebied waarvan de aanwijzing als
      zodanig in overweging is genomen als bedoeld in [artikel 12, derde lid, van de Natuurbeschermingswet 1998][ref2]
      en de instandhoudingsdoelstelling van dit gebied betrekking of mede betrekking heeft op de leefomgeving van die
      beschermde inheemse planten- of diersoort.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '12'
  - number: '20'
    text: |-
      Een besluit tot aanwijzing van een plaats als beschermde leefomgeving vermeldt handelingen die een aantasting van
      de betekenis van de aangewezen plaats als leefomgeving van de in dat besluit genoemde beschermde inheemse planten-
      of diersoort ten gevolge kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel20
  - number: '21.1'
    text: |-
      Op de voorbereiding van een besluit als bedoeld in [artikel 19, eerste lid][ref1], is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '19'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '21.2'
    text: Zienswijzen kunnen naar voren worden gebracht door een ieder.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel21
  - number: '22'
    text: |-
      Gedeputeerde staten stellen de provinciale planologische commissie in de gelegenheid advies uit te brengen over
      het ontwerp van een besluit tot aanwijzing van een plaats als beschermde leefomgeving en de daarover ontvangen
      zienswijzen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel22
  - number: '23'
    text: |-
      Van een besluit als bedoeld in [artikel 19, eerste lid][ref1], wordt in ieder geval mededeling gedaan aan de
      gebruiker van de percelen waarop de plaats waarop het besluit betrekking heeft, is gelegen en, indien deze niet
      tevens eigenaar is van deze percelen, ook aan deze laatste.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel19
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '19'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '24.1'
    text: |-
      In geval van dringende noodzaak kunnen gedeputeerde staten gelijktijdig bij het vaststellen van het ontwerp
      van een besluit tot aanwijzing van een plaats als beschermde leefomgeving of op een nadien gelegen tijdstip, de
      plaats waarop dat ontwerp betrekking heeft, aanwijzen als beschermde leefomgeving voor de bij dat besluit genoemde
      beschermde inheemse plantensoort of beschermde inheemse diersoort.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel24
  - number: '24.2'
    text: |-
      Een besluit als bedoeld in het eerste lid, vervalt zodra gedeputeerde staten op het ontwerp van een besluit
      beslissen doch in ieder geval na verloop van een jaar na de vaststelling van dat ontwerp.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel24
  - number: '24.3'
    text: |-
      Op de bekendmaking van een besluit als bedoeld in het eerste lid, is het bepaalde in [artikel 23][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel23
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '23'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '25.1'
    text: |-
      Gedeputeerde staten kunnen de aanwijzing van een plaats als beschermde leefomgeving geheel of gedeeltelijk
      intrekken. De percelen waarop de intrekking betrekking heeft, worden kadastraal omschreven. In geval van
      gedeeltelijke intrekking gaat het besluit vergezeld van een kaart waarop is aangegeven op welk gedeelte van de
      plaats de intrekking betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel25
  - number: '25.2'
    text: |-
      Het bepaalde in de [artikelen 21][ref1], [22][ref2] en [23][ref3] is van overeenkomstige toepassing ten aanzien van
      een besluit als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel23
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '21'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '22'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '23'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '25.3'
    text: |-
      Een besluit houdende de aanwijzing van een plaats als beschermde leefomgeving vervalt met ingang van het tijdstip
      waarop die plaats deel uitmaakt van een onherroepelijk aangewezen beschermd natuurmonument als bedoeld in de
      [Natuurbeschermingswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009641
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009641
  - number: '26.1'
    text: |-
      Degene die het voornemen heeft één of meer van de in een besluit tot aanwijzing van een plaats als beschermde
      leefomgeving krachtens [artikel 20][ref1] vermelde handelingen te verrichten of te doen verrichten, is verplicht
      van dat voornemen ten minste één maand, doch niet langer dan één jaar voor de dag van de voorgenomen uitvoering van
      die handeling of handelingen, kennis te geven aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel20
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '20'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '26.2'
    text: |-
      Gedeputeerde staten kunnen voorschriften verbinden aan het verrichten of doen verrichten van de handelingen,
      bedoeld in het eerste lid, welke voorschriften er mede toe kunnen strekken dat door die handelingen aangerichte
      schade aan de beschermde leefomgeving op een door hen te bepalen wijze wordt hersteld.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel26
  - number: '26.3'
    text: |-
      Het is verboden de in een besluit tot aanwijzing van een plaats als beschermde leefomgeving krachtens
      [artikel 20][ref1] vermelde handelingen te verrichten of te doen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel20
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '20'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '26.4'
    text: 'Het verbod, bedoeld in het derde lid, geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel26
  - number: 26.4.a
    text: een kennisgeving als bedoeld in het eerste lid is gedaan;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel26
  - number: 26.4.b
    text: |-
      gedeputeerde staten niet uiterlijk op de dag voorafgaand aan die waarop de uitvoering van de voorgenomen handeling
      of handelingen zal plaatsvinden, schriftelijk hebben meegedeeld bezwaar te hebben tegen de voorgenomen handeling of
      handelingen en
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel26
  - number: 26.4.c
    text: wordt gehandeld overeenkomstig de door gedeputeerde staten krachtens het tweede lid gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel26
  - number: '26.5'
    text: |-
      In afwijking van het bepaalde in [artikel 65][ref1] is het verrichten of doen verrichten van de in dat artikel
      bedoelde handelingen, voorzover het handelingen betreft die krachtens [artikel 20][ref2] zijn vermeld in een
      besluit tot aanwijzing van een plaats als beschermde leefomgeving, op een plaats waarvoor het rechtsgevolg, bedoeld
      in het derde lid, is ingetreden, slechts toegestaan indien van het voornemen daartoe op de in het eerste lid
      bepaalde wijze kennis is gegeven aan gedeputeerde staten. Het tweede tot en met vierde lid zijn ten aanzien van die
      handelingen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel20
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '65'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '20'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '27'
    text: |-
      Gedeputeerde staten doen de in [artikel 26, vierde lid, onderdeel b][ref1], bedoelde mededeling indien het
      achterwege laten van die mededeling strijd oplevert met internationale verplichtingen waaraan de Nederlandse
      overheid is gebonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel26
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '28'
    text: |-
      Voorzover blijkt dat een belanghebbende ten gevolge van de aanwijzing van een plaats als beschermde leefomgeving,
      een mededeling, als bedoeld in [artikel 26, vierde lid, onderdeel b][ref1], of voorschriften als bedoeld in
      [artikel 26, tweede lid][ref2], schade lijdt of zal lijden, welke redelijkerwijs niet of niet geheel te zijnen
      laste behoort te blijven, kennen gedeputeerde staten hem op zijn verzoek een naar billijkheid te bepalen
      schadevergoeding toe.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel26
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '29.1'
    text: |-
      Gedeputeerde staten kunnen samenwerkingsverbanden van jachthouders erkennen als faunabeheereenheden ten behoeve
      van:
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel29
  - number: 29.1.a
    text: het beheer van diersoorten of
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel29
  - number: 29.1.b
    text: de bestrijding van schade aangericht door dieren.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel29
  - number: '29.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld waaraan samenwerkingsverbanden, bedoeld in
      het eerste lid, dienen te voldoen teneinde voor erkenning in aanmerking te kunnen komen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel29
  - number: '29.3'
    text: 'De regels, bedoeld in het tweede lid, betreffen in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel29
  - number: 29.3.a
    text: de rechtsvorm van de samenwerkingsverbanden;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel29
  - number: 29.3.b
    text: de omvang en begrenzing van het gebied waarover zich de zorg van het samenwerkingsverband kan uitstrekken;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel29
  - number: 29.3.c
    text: de jachtrechten in het gebied, bedoeld onder b.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel29
  - number: '30.1'
    text: |-
      Voorzover krachtens de [artikelen 67][ref1] of [68][ref2] faunabeheerplannen worden geëist, behoeven deze de
      goedkeuring van gedeputeerde staten, gehoord het Faunafonds.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel68
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '67'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '68'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: '30.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld waaraan faunabeheerplannen dienen te voldoen
      teneinde voor goedkeuring in aanmerking te kunnen komen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel30
  - number: '30.3'
    text: 'De regels, bedoeld in het tweede lid, betreffen in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel30
  - number: 30.3.a
    text: de omvang en begrenzing van het gebied waarop het faunabeheerplan betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel30
  - number: 30.3.b
    text: het duurzaam beheer van diersoorten in dat gebied;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel30
  - number: 30.3.c
    text: de aard, omvang en noodzaak van de te verrichten handelingen ten aanzien van die diersoorten en
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel30
  - number: 30.3.d
    text: de wijzen waarop en de perioden waarin, onderscheiden naar die diersoorten, die handelingen worden verricht.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel30
  - number: '30.4'
    text: |-
      Faunabeheerplannen die de goedkeuring van gedeputeerde staten behoeven, worden door gedeputeerde staten voor een
      ieder ter inzage gelegd op het provinciehuis.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel30
  - number: '31.1'
    text: |-
      In afwijking van het bepaalde in [artikel 9][ref1] is het toegestaan te jagen op wild voorzover dit
      geschiedt in overeenstemming met het bepaalde bij of krachtens de [artikelen 15a][ref2], [15b][ref3] en
      [32 tot en met 59][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel15b
      [ref4]: https://wetten.overheid.nl/BWBR0009640#Artikel32
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: 15a
        hoofdstuk: III
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: 15b
        hoofdstuk: III
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0009640
        artikel: '32'
        hoofdstuk: V
        afdeling: '1'
  - number: '31.2'
    text: |-
      Het bepaalde in [artikel 10][ref1] is niet van toepassing voorzover wild waarop het is toegestaan te jagen,
      opzettelijk wordt verontrust bij de uitoefening van de jacht.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel10
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
  - number: '31.3'
    text: |-
      Het bepaalde in [artikel 16, derde lid][ref1], is niet van toepassing bij de uitoefening van de jacht voorzover de
      jacht is toegestaan met behulp van dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel16
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '16'
        hoofdstuk: III
        paragraaf: '4'
  - number: '32.1'
    text: |-
      Als wild worden de volgende diersoorten aangewezen: haas (Lepus europaeus), fazant (Phasianus colchicus), patrijs
      (Perdix perdix), wilde eend (Anas platyrhynchos), konijn (Oryctolagus cuniculus) en houtduif (Columba palumbus).
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel32
  - number: '32.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen de in het eerste lid gegeven omschrijvingen worden beperkt ter
      uitvoering van internationale verplichtingen of bindende besluiten van organen van de Europese Unie of andere
      volkenrechtelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel32
  - number: '32.3'
    text: |-
      De jacht wordt niet geopend op in het eerste lid aangewezen diersoorten voorzover zij staan vermeld op een door
      Onze Minister vastgestelde nationale lijst van met uitroeiing bedreigde of speciaal gevaar lopende soorten.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel32
  - number: '33'
    text: 'Gerechtigd tot het genot van de jacht is:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel33
  - number: 33.a
    text: |-
      de eigenaar van de grond indien niet ingevolge het in onderdeel b of c bepaalde de erfpachter, vruchtgebruiker,
      beklemde meier of pachter gerechtigd is tot het genot van de jacht en voorzover het genot van de jacht niet is
      verhuurd;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel33
  - number: 33.b
    text: |-
      de erfpachter, vruchtgebruiker of beklemde meier van de grond indien de eigenaar van de grond zich bij het vestigen
      van het beperkt recht het genot van de jacht niet heeft voorbehouden of de pachter ingevolge het in onderdeel c
      bepaalde niet gerechtigd is tot het genot van de jacht en voorzover het genot van de jacht niet is verhuurd;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel33
  - number: 33.c
    text: |-
      de pachter indien hij pacht van een verpachter die ten tijde van het aangaan van de pachtovereenkomst ingevolge
      het in onderdeel a of b bepaalde gerechtigd was tot het genot van de jacht en die verpachter zich dit genot bij het
      aangaan van de pachtovereenkomst niet heeft voorbehouden en voorzover het genot van de jacht niet is verhuurd;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel33
  - number: 33.d
    text: |-
      de huurder van het genot van de jacht voorzover hij dat overeenkomstig [artikel 34, eerste lid][ref1], heeft
      gehuurd en voorzover hij dat niet overeenkomstig het tweede lid van dat artikel heeft verhuurd;


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel34
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '34'
        hoofdstuk: V
        afdeling: '2'
  - number: 33.e
    text: |-
      de huurder van het genot van de jacht voorzover hij dat overeenkomstig [artikel 34, tweede lid][ref1], heeft
      gehuurd.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel34
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '34'
        hoofdstuk: V
        afdeling: '2'
  - number: '34.1'
    text: |-
      Degene die ingevolge het bepaalde in [artikel 33, onderdeel a, b of c][ref1], gerechtigd is tot het genot van de
      jacht, kan dat genot geheel of gedeeltelijk aan één ander verhuren, mits bij een schriftelijke en gedagtekende
      huurovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel33
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '33'
        hoofdstuk: V
        afdeling: '2'
  - number: '34.2'
    text: |-
      Degene die het gehele of gedeeltelijke genot van de jacht op de in het eerste lid bepaalde wijze heeft gehuurd, kan
      dat genot slechts in zijn geheel weder verhuren aan één ander, mits met schriftelijke toestemming van de verhuurder
      en bij schriftelijke en gedagtekende huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel34
  - number: '34.3'
    text: |-
      Een overeenkomst als bedoeld in de vorige leden, is nietig voorzover het genot van de jacht op de betreffende grond
      reeds aan een ander is verhuurd of de verhuurder niet toekwam.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel34
  - number: '34.4'
    text: |-
      De eigenaar of verpachter die zich het genot van de jacht heeft voorbehouden, is niet bevoegd dit genot bij een
      overeenkomst als bedoeld in het eerste lid, geheel of gedeeltelijk te verhuren, tenzij met toestemming van de
      grondgebruiker.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel34
  - number: '34.5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld ten aanzien van de duur waarvoor overeenkomsten als
      bedoeld in de vorige leden, moeten worden aangegaan. Deze duur bedraagt ten hoogste twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel34
  - number: '35'
    text: |-
      Voorzover en voor zolang het genot van de jacht ten tijde van de eigendomsovergang van de grond, het vestigen dan
      wel tenietgaan van een beperkt recht of het aangaan dan wel beëindigen van een pachtovereenkomst op die grond, op
      de in [artikel 34][ref1] bepaalde wijze is verhuurd, blijft deze huurovereenkomst in stand.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel34
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '34'
        hoofdstuk: V
        afdeling: '2'
  - number: '36.1'
    text: |-
      De jachthouder kan, indien hij is voorzien van een jachtakte of een valkeniersakte, aan anderen toestaan het hem
      toekomende genot van de jacht in zijn gezelschap uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel36
  - number: '36.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld op grond waarvan de jachthouder bij wege van
      schriftelijke en gedagtekende toestemming de uitoefening, anders dan in zijn gezelschap, van het hem toekomende
      genot van de jacht of een deel daarvan kan toestaan aan de jachtopzichter of aan anderen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel36
  - number: '37.1'
    text: |-
      De jachthouder is verplicht datgene te doen wat een goed jachthouder betaamt om een redelijke stand van het in zijn
      jachtveld aanwezige wild te handhaven dan wel, bij het ontbreken daarvan, te bereiken en om schade door in zijn
      jachtveld aanwezig wild te voorkomen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel37
  - number: '37.2'
    text: |-
      Het bevorderen van de wildstand door middel van bijvoeren is verboden, behoudens bijzondere weersomstandigheden als
      bedoeld in [artikel 46, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel46
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '46'
        hoofdstuk: V
        afdeling: '4'
  - number: '37.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het handhaven van
      een redelijke wildstand.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel37
  - number: '38.1'
    text: 'Het is verboden te jagen zonder voorzien te zijn van:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel38
  - number: 38.1.a
    text: een geldige jachtakte, voorzover het betreft het jagen met een geweer;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel38
  - number: 38.1.b
    text: een geldige valkeniersakte, voorzover het betreft het jagen met één of meer jachtvogels;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel38
  - number: 38.1.c
    text: een geldige kooikersakte, voorzover het betreft het jagen met een eendenkooi.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel38
  - number: '38.2'
    text: Het model van de akten wordt door Onze Minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel38
  - number: '39.1'
    text: 'Een jachtakte, valkeniersakte of kooikersakte wordt geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel39
  - number: 39.1.a
    text: de aanvrager de leeftijd van achttien jaar nog niet heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel39
  - number: 39.1.b
    text: |-
      de aanvrager niet genoegzaam heeft aangetoond in de gelegenheid te zijn om met gebruikmaking van een geweer of met
      een jachtvogel te jagen in een jachtveld, waarin hem het genot van de jacht overeenkomstig de [artikelen 33][ref1]
      of [34][ref2] toekomt of waarin hem de uitoefening van dat genot overeenkomstig het bepaalde bij of krachtens
      [artikel 36][ref3] is toegestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel36
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '33'
        hoofdstuk: V
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '34'
        hoofdstuk: V
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '36'
        hoofdstuk: V
        afdeling: '2'
  - number: 39.1.c
    text: de aanvrager niet heeft aangetoond met gunstig gevolg een door Onze Minister erkend jachtexamen te hebben afgelegd;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel39
  - number: 39.1.d
    text: |-
      de aanvrager geen geldig bewijs van verzekering als bedoeld in [artikel 54, zesde lid][ref1], heeft overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel54
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '54'
        hoofdstuk: V
        afdeling: '5'
  - number: 39.1.e
    text: |-
      er grond is om aan te nemen dat de aanvrager van de bevoegdheid om wapens en munitie voorhanden te hebben misbruik
      zal maken of hierdoor een gevaar voor zichzelf, de openbare orde of de veiligheid kan gaan vormen;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel39
  - number: 39.1.f
    text: |-
      er grond is om aan te nemen dat de aanvrager van de bevoegdheid om te jagen misbruik zal maken of hierdoor een
      gevaar voor zichzelf, de openbare orde of de veiligheid kan gaan vormen;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel39
  - number: 39.1.g
    text: |-
      er grond is om aan te nemen dat de aanvrager van de bevoegdheden in het kader van beheer en schadebestrijding
      als bedoeld in [Hoofdstuk V, titel III, afdeling 1, § 3][ref1], misbruik zal maken of hierdoor een gevaar voor
      zichzelf, de openbare orde of de veiligheid kan gaan vormen;


      [ref1]: https://wetten.overheid.nl/BWBR0009640#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009640
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: 39.1.h
    text: |-
      er grond is om aan te nemen dat de aanvrager nalatig zal zijn te doen wat een goed jager betaamt bij de uitoefening
      van de jacht;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel39
  - number: 39.1.i
    text: |-
      aan de aanvrager de bevoegdheid om te jagen is ontzegd bij een rechterlijke uitspraak, welke voor tenuitvoerlegging
      vatbaar is geworden, en de tijd, voor welke die bevoegdheid is ontzegd, nog niet is verstreken of
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel39
  - number: 39.1.j
    text: |-
      de aanvrager in de twee jaren, voorafgaande aan het verzoek tot het verkrijgen van een jachtakte,
      valkeniersakte of kooikersakte wegens één der bij of krachtens deze wet strafbaar gestelde feiten, dan wel
      wegens een feit strafbaar gesteld bij de [Wet dieren][ref1] voorzover het gedragingen als bedoeld in de
      [artikelen 2.1][ref2], [2.2][ref3], [2.3][ref4], [2.5][ref5], [2.6][ref6], [2.7][ref7], [2.8][ref8], [2.9][ref9],
      [2.10][ref10], [2.13][ref11], [2.14][ref12] of [2.15 van die wet][ref13] is veroordeeld, dan wel deswege
      hem een strafbeschikking is uitgevaardigd, of indien hij vervolging deswege heeft voorkomen overeenkomstig
      de bepalingen van [artikel 74 van het Wetboek van Strafrecht][ref14] of hem wegens overtreding van het
      krachtens de voornoemde artikelen van de [Wet dieren][ref15] bepaalde een bestuurlijke boete als bedoeld in
      [artikel 8.7 van de Wet dieren][ref16] is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0030250
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel2
