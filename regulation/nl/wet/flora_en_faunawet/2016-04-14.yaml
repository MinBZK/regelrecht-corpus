  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt mede verstaan onder: soort: ondersoort, geografisch
      onderscheiden populatie van een soort of kruisingen; planten: geënte planten; dode dieren: geprepareerde dieren
      alsmede dieren die op enigerlei wijze geschikt zijn gemaakt om duurzaam te worden bewaard; dode planten: planten
      die op enigerlei wijze geschikt zijn gemaakt om duurzaam te worden bewaard; eieren: schalen van eieren; grond:
      wateren; veld: stranden, schorren, gorzen, kwelders, slikken, wadden, binnenwateren en territoriale wateren
      alsmede wegen en paden, voorzover deze geacht kunnen worden deel uit te maken van een voor de uitoefening van de
      jacht bestemd of geschikt terrein; binnen of buiten het grondgebied van Nederland brengen: iedere handeling die
      is gericht op het bewerkstelligen van het binnen of buiten het grondgebied van Nederland brengen; ten verkoop
      aanbieden: elke handeling die redelijkerwijs als het ten verkoop aanbieden kan worden uitgelegd waaronder het maken
      of doen maken van handelspubliciteit en het uitnodigen tot zaken doen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel1
  - number: 1a.1
    text: |-
      Deze wet is mede van toepassing in de exclusieve economische zone, met uitzondering van [hoofdstuk IV][ref1],
      [hoofdstuk V, titels I][ref2], [II][ref3] en [III, afdeling 1, paragraaf 1][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0009640#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0009640#HoofdstukV
      [ref4]: https://wetten.overheid.nl/BWBR0009640#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0009640
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0009640
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0009640
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0009640
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: 1a.2
    text: |-
      Deze wet is niet van toepassing op activiteiten die onderwerp zijn van het gemeenschappelijk visserijbeleid,
      bedoeld in artikel 38 van het Verdrag betreffende de werking van de Europese Unie, voor zover zij plaatsvinden in
      de exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel1a
  - number: '2.1'
    text: |-
      Een ieder neemt voldoende zorg in acht voor de in het wild levende dieren en planten, alsmede voor hun directe
      leefomgeving.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel2
  - number: '2.2'
    text: |-
      De zorg, bedoeld in het eerste lid, houdt in ieder geval in dat een ieder die weet of redelijkerwijs kan vermoeden
      dat door zijn handelen of nalaten nadelige gevolgen voor flora of fauna kunnen worden veroorzaakt, verplicht is
      dergelijk handelen achterwege te laten voorzover zulks in redelijkheid kan worden gevergd, dan wel alle maatregelen
      te nemen die redelijkerwijs van hem kunnen worden gevergd teneinde die gevolgen te voorkomen of, voorzover die
      gevolgen niet kunnen worden voorkomen, deze zoveel mogelijk te beperken of ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel2
  - number: '3.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen als beschermde inheemse plantensoort worden aangewezen plantensoorten die
      van nature in Nederland voorkomen en die:
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel3
  - number: 3.1.a
    text: in hun voortbestaan worden bedreigd of het gevaar lopen in hun voortbestaan te worden bedreigd;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel3
  - number: 3.1.b
    text: |-
      niet noodzakelijkerwijs in hun voortbestaan worden bedreigd of dat gevaar lopen, doch ter bescherming waarvan
      maatregelen noodzakelijk zijn ter voorkoming van overmatige benutting;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel3
  - number: 3.1.c
    text: uit Nederland zijn verdwenen doch ten aanzien waarvan gerede kans op terugkeer bestaat of
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel3
  - number: 3.1.d
    text: |-
      zodanige gelijkenis vertonen met soorten die zijn aangewezen op grond van het bepaalde in de onderdelen a, b of c,
      dat aanwijzing ervan noodzakelijk is ter bescherming van die soorten.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel3
  - number: '3.2'
    text: |-
      De aanwijzing van een plantensoort als beschermde inheemse plantensoort geschiedt in afwijking van het bepaalde in
      het eerste lid bij ministeriële regeling indien die aanwijzing noodzakelijk is ter uitvoering van internationale
      verplichtingen of bindende besluiten van organen van de Europese Unie of andere volkenrechtelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel3
  - number: '4.1'
    text: 'Als beschermde inheemse diersoort worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel4
  - number: 4.1.a
    text: |-
      alle van nature in Nederland voorkomende soorten zoogdieren, met uitzondering van gedomesticeerde dieren behorende
      tot bij algemene maatregel van bestuur aangewezen soorten en met uitzondering van de zwarte rat, de bruine rat en
      de huismuis;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel4
  - number: 4.1.b
    text: |-
      alle van nature op het Europese grondgebied van de Lid-Staten van de Europese Unie voorkomende soorten vogels met
      uitzondering van gedomesticeerde vogels behorende tot bij algemene maatregel van bestuur aangewezen soorten;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel4
  - number: 4.1.c
    text: alle van nature in Nederland voorkomende soorten amfibieën en reptielen en
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel4
  - number: 4.1.d
    text: |-
      alle van nature in Nederland voorkomende soorten vissen, met uitzondering van de soorten waarop de
      [Visserijwet 1963][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002416
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002416
  - number: '4.2'
    text: |-
      Als beschermde inheemse diersoort kunnen voorts bij algemene maatregel van bestuur worden aangewezen diersoorten
      die van nature in Nederland voorkomen en die:
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel4
  - number: 4.2.a
    text: in hun voortbestaan worden bedreigd of het gevaar lopen in hun voortbestaan te worden bedreigd;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel4
  - number: 4.2.b
    text: |-
      niet noodzakelijkerwijs in hun voortbestaan worden bedreigd of dat gevaar lopen, doch ter bescherming waarvan
      maatregelen noodzakelijk zijn ter voorkoming van overmatige benutting;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel4
  - number: 4.2.c
    text: uit Nederland zijn verdwenen doch ten aanzien waarvan gerede kans op terugkeer bestaat of
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel4
  - number: 4.2.d
    text: |-
      zodanige gelijkenis vertonen met soorten die zijn aangewezen op grond van het bepaalde in de onderdelen a, b of c,
      dat aanwijzing ervan noodzakelijk is ter bescherming van die soorten.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel4
  - number: '4.3'
    text: |-
      De aanwijzing van een diersoort als beschermde inheemse diersoort geschiedt in afwijking van het bepaalde in
      het tweede lid bij ministeriële regeling indien die aanwijzing noodzakelijk is ter uitvoering van internationale
      verplichtingen of bindende besluiten van organen van de Europese Unie of andere volkenrechtelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel4
  - number: '4.4'
    text: Onze Minister maakt in de Staatscourant bekend welke de soorten, bedoeld in het eerste lid, zijn.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel4
  - number: '5.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen als beschermde uitheemse plantensoort of beschermde uitheemse diersoort
      worden aangewezen plantensoorten onderscheidenlijk diersoorten die niet van nature in Nederland voorkomen en die:
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel5
  - number: 5.1.a
    text: |-
      in hun voortbestaan worden bedreigd of het gevaar lopen in hun voortbestaan te worden bedreigd, dan wel die
      zodanige gelijkenis vertonen met bedoelde soorten dat aanwijzing ervan noodzakelijk is ter bescherming van die
      soorten, of
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel5
  - number: 5.1.b
    text: |-
      niet noodzakelijkerwijs in hun voortbestaan worden bedreigd of dat gevaar lopen, doch ter bescherming waarvan
      maatregelen noodzakelijk zijn ter voorkoming van overmatige benutting, dan wel die zodanige gelijkenis vertonen met
      bedoelde soorten dat aanwijzing ervan noodzakelijk is ter bescherming van die soorten.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel5
  - number: '5.2'
    text: |-
      De aanwijzing van een plantensoort of van een diersoort als beschermde uitheemse plantensoort onderscheidenlijk als
      beschermde uitheemse diersoort geschiedt in afwijking van het bepaalde in het eerste lid bij ministeriële regeling
      indien die aanwijzing noodzakelijk is ter uitvoering van internationale verplichtingen of bindende besluiten van
      organen van de Europese Unie of andere volkenrechtelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel5
  - number: '5.3'
    text: |-
      Bij de aanwijzing van soorten, bedoeld in het eerste of tweede lid, worden deze soorten onderscheiden in
      categorieën van soorten als bedoeld in onderdeel a onderscheidenlijk onderdeel b van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel5
  - number: '6'
    text: |-
      Aanwijzingen van soorten als bedoeld in de [artikelen 3][ref1], [4][ref2] en [5][ref3], kunnen worden beperkt
      naar gelang van de ontwikkelingsstadia van dieren en planten behorende tot die soorten. De aanwijzingen kunnen
      voorts worden beperkt tot de onderscheiden producten van dieren en planten, behorende tot de soorten bedoeld in de
      [artikelen 3][ref4], [4][ref5] en [5][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0009640#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0009640#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0009640#Artikel5
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel6
