  - number: '39.2'
    text: |-
      Het bepaalde in het eerste lid, onderdeel d, is niet van toepassing voorzover de aanvrage een valkeniersakte
      betreft.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel39
  - number: '39.3'
    text: |-
      Het bepaalde in het eerste lid, onderdelen b en d, is niet van toepassing voorzover de aanvrage een kooikersakte
      betreft.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel39
  - number: '40.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels vastgesteld met betrekking tot de aanvraag van
      een erkenning van een jachtexamen alsmede de eisen, waaraan het in [artikel 39, eerste lid, onderdeel c][ref1],
      bedoelde examen moet voldoen om te worden erkend. Deze eisen worden verschillend vastgesteld naar gelang het
      betreft de jacht met het geweer, met jachtvogels of met de eendenkooi.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel39
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '39'
        hoofdstuk: V
        afdeling: '3'
  - number: '40.2'
    text: |-
      In afwijking van het bepaalde in [artikel 39, eerste lid, aanhef en onderdeel c][ref1], is het afleggen van een
      jachtexamen niet vereist indien de aanvrager met gunstig gevolg een door de bevoegde autoriteit van een andere
      staat erkend jachtexamen heeft afgelegd en dat examen door Onze Minister als gelijkwaardig aan het in het eerste
      lid bedoelde jachtexamen is erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel39
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '39'
        hoofdstuk: V
        afdeling: '3'
  - number: '41.1'
    text: 'Een jachtakte, valkeniersakte of kooikersakte wordt in ieder geval ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel41
  - number: 41.1.a
    text: |-
      de ter verkrijging van de akte verstrekte gegevens zodanig onjuist of onvolledig blijken, dat, waren de juiste
      gegevens verstrekt, de akte zou zijn geweigerd;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel41
  - number: 41.1.b
    text: |-
      blijkt dat de burgerrechtelijke aansprakelijkheid als bedoeld in [artikel 54, eerste lid][ref1], niet langer
      overeenkomstig het bepaalde bij of krachtens dat artikel is gedekt of


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel54
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '54'
        hoofdstuk: V
        afdeling: '5'
  - number: 41.1.c
    text: |-
      de houder misbruik heeft gemaakt van wapens of munitie dan wel van de bevoegdheid om wapens of munitie voorhanden
      te hebben, of indien er anderszins aanwijzingen zijn dat aan hem het voorhanden hebben van wapens en munitie niet
      langer kan worden toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel41
  - number: '41.2'
    text: 'Een jachtakte, valkeniersakte of kooikersakte kan worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel41
  - number: 41.2.a
    text: er grond is om aan te nemen dat de houder van zijn bevoegdheid om te jagen misbruik maakt;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel41
  - number: 41.2.b
    text: de houder nalatig is te doen wat een goed jager betaamt bij de uitoefening van de jacht;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel41
  - number: 41.2.c
    text: |-
      er grond is om aan te nemen dat de houder van zijn bevoegdheden in het kader van beheer en schadebestrijding als
      bedoeld in [Hoofdstuk V, titel III, afdeling 1, § 3][ref1], misbruik maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009640
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: '41.3'
    text: |-
      De valkeniersakte kan voorts worden ingetrokken indien een ontheffing als bedoeld in [artikel 75, derde lid][ref1],
      om jachtvogels onder zich te hebben, is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '75'
        hoofdstuk: V
        afdeling: '2'
  - number: '41.4'
    text: |-
      Het bepaalde in het eerste lid, aanhef en de onderdelen b en c, is niet van toepassing ten aanzien van de
      valkeniersakte of de kooikersakte.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel41
  - number: '42.1'
    text: |-
      De bevoegdheid tot het nemen van beschikkingen omtrent het verlenen van jachtakten berust bij de korpschef, bedoeld
      in [artikel 27, van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel27
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '27'
  - number: '42.2'
    text: De bevoegdheid tot het nemen van beschikkingen tot intrekking van jachtakten berust bij de korpschef.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel42
  - number: '42.3'
    text: |-
      De in het tweede lid bedoeld bevoegdheid komt tevens toe aan Onze Minister van Veiligheid en Justitie in gevallen
      als bedoeld in [artikel 41, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel41
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '41'
        hoofdstuk: V
        afdeling: '3'
  - number: '42.4'
    text: |-
      Tegen beschikkingen van de korpschef staat administratief beroep open bij Onze Minister van Veiligheid
      en Justitie indien de jachtakte is geweigerd of ingetrokken of mede is geweigerd of ingetrokken
      om redenen als bedoeld in [artikel 39, eerste lid, aanhef en onderdeel e][ref1], onderscheidenlijk
      [artikel 41, eerste lid, aanhef en onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel41
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '39'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '41'
        hoofdstuk: V
        afdeling: '3'
  - number: '43'
    text: |-
      De bevoegdheid tot het nemen van beschikkingen omtrent het verlenen en intrekken van valkeniersakten en
      kooikersakten berust bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel43
  - number: '44'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld betreffende de akten, bedoeld in
      [artikel 38][ref1]. Tot deze regels behoren in ieder geval regels betreffende het betalen van een voor een akte
      verschuldigde geldsom waarvan de hoogte bij of krachtens die maatregel wordt vastgesteld, en betreffende de
      geldigheid en de inlevering van de akten.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel38
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '38'
        hoofdstuk: V
        afdeling: '3'
  - number: '45.1'
    text: |-
      In afwijking van het bepaalde in [artikel 39, eerste lid, aanhef en onderdeel c][ref1], kan degene die geen
      woonplaats in Nederland heeft een jachtakte of een valkeniersakte verkrijgen, die geldig is gedurende zes
      opeenvolgende in de akte vermelde dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel39
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '39'
        hoofdstuk: V
        afdeling: '3'
  - number: '45.2'
    text: |-
      Een akte als bedoeld in het eerste lid wordt slechts verleend indien de aanvrager genoegzaam aantoont dat hij
      gerechtigd is te jagen in het land waarin hij zijn woon- of verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel45
  - number: '45.3'
    text: |-
      De in het eerste lid bedoelde akten zijn slechts geldig indien de houder zich bevindt in gezelschap van een in
      Nederland woonachtige houder van een geldige akte.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel45
  - number: '46.1'
    text: Bij ministeriële regeling wordt bepaald in hoeverre de jacht op wild zal zijn geopend.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel46
  - number: '46.2'
    text: |-
      De jacht wordt niet geopend gedurende het tijdvak van 1 februari tot 15 augustus, tenzij er naar het oordeel
      van Onze Minister geen andere bevredigende oplossing bestaat dan het openstellen van de jacht met het oog op bij
      algemene maatregel van bestuur aangewezen belangen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel46
  - number: '46.3'
    text: 'De jacht wordt niet geopend in de volgende gebieden of categorieën van gebieden:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel46
  - number: 46.3.a
    text: |-
      gebieden die krachtens de [Natuurbeschermingswet 1998][ref1] zijn aangewezen als beschermd natuurmonument dan wel
      gebieden waarvan de aanwijzing als beschermd natuurmonument in overweging is genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0009641
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009641
  - number: 46.3.b
    text: |-
      gebieden die krachtens de op 2 februari 1971 te Ramsar tot stand gekomen Overeenkomst inzake watergebieden van
      internationale betekenis, in het bijzonder als verblijfplaats voor watervogels (Trb. 1975, 84), zijn aangemeld als
      watergebied van internationale betekenis;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel46
  - number: 46.3.c
    text: gebieden die ter uitvoering van richtlijn 2009/147/EG zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel46
  - number: 46.3.d
    text: |-
      natuurmonumenten als bedoeld in [artikel 1 van de Natuurbeschermingswet 1998][ref1], behorende tot een op grond
      van [artikel 10a van de Natuurbeschermingswet 1998][ref2] aangewezen gebied ter uitvoering van richtlijn 92/43/EEG
      en waarvoor ingevolge [artikel 15a, tweede lid, van de Natuurbeschermingswet 1998][ref3] het besluit houdende de
      aanwijzing van dat natuurmonument als beschermd natuurmonument is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel15a
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
      - id: ref3
        bwb_id: BWBR0009641
        artikel: 15a
  - number: '46.4'
    text: |-
      Ter uitvoering van internationale verplichtingen of bindende besluiten van organen van de Europese Unie of andere
      volkenrechtelijke organisaties kan bij algemene maatregel van bestuur worden bepaald in hoeverre de jacht slechts
      zal kunnen worden geopend.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel46
  - number: '46.5'
    text: |-
      Gedeputeerde staten kunnen, zolang bijzondere weersomstandigheden dat naar hun oordeel met het oog op de
      instandhouding van wild vergen, de jacht voor de hele provincie of een deel daarvan, voor een bepaalde tijd
      sluiten.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel46
  - number: '47'
    text: De jager dient het wild tegen onnodig lijden als gevolg van de uitoefening van de jacht te beschermen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel47
  - number: '48'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent hetgeen een goed jager betaamt bij de
      uitoefening van de jacht.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel48
  - number: '49'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de eisen waaraan jachtvelden waarop het
      genot van de jacht mag worden uitgeoefend, moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel49
  - number: '50.1'
    text: 'Tot jagen geoorloofde middelen zijn:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel50
  - number: 50.1.a
    text: geweren;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel50
  - number: 50.1.b
    text: honden, niet zijnde lange honden;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel50
  - number: 50.1.c
    text: gefokte jachtvogels, te weten slechtvalken (Falco peregrinus) en haviken (Accipiter gentilis);
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel50
  - number: 50.1.d
    text: geregistreerde eendenkooien als bedoeld in artikel 56;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel50
  - number: 50.1.e
    text: lokeenden of lokduiven, mits niet blind of verminkt;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel50
  - number: 50.1.f
    text: fretten;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel50
  - number: 50.1.g
    text: buidels.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel50
  - number: '50.2'
    text: |-
      Bij algemene maatregel van bestuur kan het gebruik van de in het eerste lid genoemde middelen worden uitgesloten of
      beperkt. Daarbij kunnen tevens regels worden gesteld betreffende de eisen waaraan die middelen dienen te voldoen,
      alsmede betreffende het gebruik van munitie, waarbij ook rekening kan worden gehouden met belangen van veiligheid,
      volksgezondheid, welzijn en milieu.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel50
  - number: '50.3'
    text: |-
      Het is verboden zich ter uitoefening van de jacht in het veld te bevinden met andere dan tot jagen geoorloofde
      middelen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel50
  - number: '50.4'
    text: |-
      Degene die zich in het veld bevindt met een of meer tot jagen geoorloofde middelen, bedoeld in het eerste lid,
      alsmede met andere middelen waarmede kan worden gejaagd, wordt geacht zich daarmede ter uitoefening van de jacht in
      het veld te bevinden tenzij het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel50
  - number: '51'
    text: |-
      Het is de houder van een jachtakte verboden een geweer te dragen op gronden waarop hij niet tot het gebruik van een
      geweer gerechtigd is.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel51
  - number: '52'
    text: |-
      Onverminderd het bepaalde bij of krachtens de [artikelen 65 tot en met 70][ref1] en [72][ref2], is het de houder
      van een jachtakte of valkeniersakte slechts toegestaan gebruik te maken van geweren of jachtvogels voor het
      uitoefenen van de jacht of het schieten van kleiduiven.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel72
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '65'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '72'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: '53.1'
    text: 'Het is verboden te jagen:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: 53.1.a
    text: |-
      op wild waarop de jacht niet is geopend of in strijd met beperkingen waaronder krachtens [artikel 46][ref1] de
      jacht is geopend;


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel46
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '46'
        hoofdstuk: V
        afdeling: '4'
  - number: 53.1.b
    text: |-
      met andere dan de tot jagen geoorloofde middelen, bedoeld in [artikel 50, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel50
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '50'
        hoofdstuk: V
        afdeling: '4'
  - number: 53.1.c
    text: |-
      met een geweer of een jachtvogel in een jachtveld dat niet voldoet aan de krachtens [artikel 49][ref1] gestelde
      regels;


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel49
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '49'
        hoofdstuk: V
        afdeling: '4'
  - number: 53.1.d
    text: op zondagen, de nieuwjaarsdag, de tweede paas- en pinksterdag, de beide kerstdagen en de hemelvaartsdag;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: 53.1.e
    text: op begraafplaatsen;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: 53.1.f
    text: voor zonsopgang en na zonsondergang;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: 53.1.g
    text: indien de grond met sneeuw is bedekt;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: 53.1.h
    text: op wild dat zich ten gevolge van hoge waterstand ophoudt op hoog gelegen gedeelten van het terrein;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: 53.1.i
    text: op wild voorzover dat zich bevindt in of in de nabijheid van wakken of bijten in het ijs;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: 53.1.j
    text: op wild voorzover dat als gevolg van onvoldoende bevedering niet in staat is te vliegen;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: 53.1.k
    text: op wild dat als gevolg van weersomstandigheden in uitgeputte toestand verkeert;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: 53.1.l
    text: |-
      binnen een straal van 200 meter rond plaatsen waar voer of aas is of wordt verstrekt met als oogmerk wild te
      lokken;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: 53.1.m
    text: met het geweer in de bebouwde kommen der gemeenten en in de onmiddellijk aan die kommen grenzende terreinen;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: 53.1.n
    text: vanaf of vanuit een motorrijtuig dan wel een ander voertuig;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: 53.1.o
    text: vanaf of vanuit een vaartuig;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: 53.1.p
    text: vanuit een luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: 53.1.q
    text: met een geweer binnen de afpalingskring van een geregistreerde eendenkooi;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: '53.2'
    text: |-
      Bij algemene maatregel van bestuur kan de uitoefening van de jacht aan andere beperkingen dan bepaald in het eerste
      lid, worden gebonden voorzover dit noodzakelijk is ter uitvoering van internationale verplichtingen of bindende
      besluiten van organen van de Europese Unie of andere volkenrechtelijke organisaties, of indien dit noodzakelijk is
      in verband met de instandhouding van wild of de veiligheid.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: '53.3'
    text: |-
      Ieder, die door middel van een geregistreerde eendenkooi dieren, behorend tot soorten waarop met een eendenkooi
      mag worden gejaagd, heeft gevangen, is verplicht die dieren, tenzij zij na het vangen terstond worden gedood,
      onverwijld in vrijheid te stellen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel53
  - number: '54.1'
    text: |-
      Degene die met een geweer jaagt, is gehouden er zorg voor te dragen dat zijn burgerrechtelijke aansprakelijkheid
      voor schade waartoe het verrichten van die handelingen met gebruikmaking van een geweer aanleiding kan geven door
      een verzekering is gedekt in overeenstemming met de bij of krachtens deze wet gestelde regels. De in de vorige zin
      bedoelde verzekeringsplicht betreft niet de aansprakelijkheid welke voor de jachthouder kan voortvloeien uit het
      niet-nakomen van de verplichting als bedoeld in [artikel 37][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel37
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '37'
        hoofdstuk: V
        afdeling: '2'
  - number: '54.2'
    text: |-
      De verzekering van de houder van een jachtakte als bedoeld in [artikel 38, eerste lid, onderdeel a][ref1], dient
      eveneens de burgerrechtelijke aansprakelijkheid, bedoeld in het eerste lid, te dekken van ieder die in zijn
      gezelschap met een geweer jaagt en beschikt over een jachtakte als bedoeld in [artikel 45][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel45
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '38'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '45'
        hoofdstuk: V
        afdeling: '3'
  - number: '54.3'
    text: |-
      De verzekering moet niet alleen dekken de aansprakelijkheid van de verzekerden jegens derden, maar ook de
      aansprakelijkheid van de verzekerden jegens elkaar.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel54
  - number: '54.4'
    text: |-
      De verzekering moet de aansprakelijkheid dekken ter zake van voorvallen, welke plaatsvinden gedurende een bij
      algemene maatregel van bestuur te bepalen periode. De verplichtingen van de verzekeraar jegens de benadeelde
      eindigen slechts door verloop van de in de vorige zin bedoelde periode.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel54
  - number: '54.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de verzekering en wordt een
      bedrag vastgesteld waarboven de verzekeringsplicht zich niet uitstrekt.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel54
  - number: '54.6'
    text: |-
      De verzekeraar geeft aan de verzekerde een bewijs van de verzekering af, dat de aansprakelijkheid van de verzekerde
      overeenkomstig de bij en krachtens deze wet gestelde regels is gedekt. Onze Minister stelt het model van dit bewijs
      vast.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel54
  - number: '55.1'
    text: |-
      De benadeelde heeft jegens de verzekeraar, door wie de aansprakelijkheid volgens deze wet is gedekt, een eigen
      recht op schadevergoeding tot het beloop van het in [artikel 54, vijfde lid][ref1], bedoelde bedrag. Het teniet
      gaan van zijn schuld aan de verzekerde bevrijdt de verzekeraar niet jegens de benadeelde, tenzij deze schadeloos
      is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel54
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '54'
        hoofdstuk: V
        afdeling: '5'
  - number: '55.2'
    text: |-
      Indien er bij een ongeval meer dan één benadeelde is en het totaalbedrag van de verschuldigde schadeloosstellingen
      de verzekerde som overschrijdt, worden de rechten van de benadeelden tegen de verzekeraar naar evenredigheid
      teruggebracht tot het beloop van die som. Niettemin blijft de verzekeraar die, onbekend met het bestaan van
      vorderingen van andere benadeelden, te goeder trouw aan een benadeelde een groter bedrag dan het aan deze
      toekomende heeft uitgekeerd, jegens die anderen slechts gehouden tot het beloop van het overblijvende gedeelte van
      de verzekerde som.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel55
  - number: '55.3'
    text: |-
      Geen uit de wettelijke bepalingen omtrent de verzekeringsovereenkomst of uit deze overeenkomst zelf voortvloeiende
      nietigheid, verweer of verval kan door een verzekeraar aan een benadeelde worden tegengeworpen. De verzekeraar die
      ingevolge deze wet de schade van een benadeelde geheel of ten dele vergoedt, ofschoon de aansprakelijkheid voor die
      schade niet door een met hem gesloten overeenkomst was gedekt, heeft voor het bedrag der schadevergoeding verhaal
      op de aansprakelijke persoon.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel55
  - number: '55.4'
    text: |-
      Indien de overeenkomst een beding inhoudt dat de verzekerde persoonlijk voor een deel in de vergoeding van
      de schade zal bijdragen, blijft de verzekeraar niettemin jegens de benadeelde gehouden tot betaling van de
      schadeloosstelling die krachtens de overeenkomst ten laste van de verzekerde blijft.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel55
  - number: '55.5'
    text: |-
      Iedere uit deze wet voortvloeiende rechtsvordering van de benadeelde tegen de verzekeraar verjaart door verloop
      van drie jaar te rekenen vanaf de datum van het feit waaruit de schade is ontstaan. Handelingen die de verjaring
      van de rechtsvordering van een benadeelde tegen een verzekerde stuiten, stuiten tevens de verjaring van de
      rechtsvordering van die benadeelde tegen de verzekeraar. Handelingen die de verjaring van de rechtsvordering van de
      benadeelde tegen de verzekeraar stuiten, stuiten tevens de verjaring van de rechtsvordering van de benadeelde tegen
      de verzekerde. De verjaring wordt ten opzichte van een verzekeraar gestuit door iedere onderhandeling tussen de
      verzekeraar en de benadeelde. Een nieuwe termijn van drie jaar begint te lopen te rekenen vanaf het ogenblik waarop
      een van de partijen bij deurwaardersexploit of aangetekende brief aan de andere partij heeft kennis gegeven dat zij
      de onderhandelingen afbreekt.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel55
  - number: '55.6'
    text: |-
      De verzekerde moet aan de verzekeraar mededeling doen van ieder ongeval, dat aanleiding kan geven tot
      aansprakelijkheid van de verzekerde voor de bij dat ongeval verzekerde schade en waaruit voor de verzekeraar op
      grond van het eerste lid van dit artikel een verplichting tot schadevergoeding jegens de benadeelde zou kunnen
      ontstaan. De verzekeringnemer moet aan de verzekeraar alle door de verzekeringsovereenkomst voorgeschreven
      inlichtingen en bescheiden verschaffen. De overige verzekerden moeten aan de verzekeraar op zijn verzoek alle
      nodige inlichtingen en bescheiden verschaffen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel55
  - number: '56.1'
    text: |-
      Eendenkooien die voldoen aan bij algemene maatregel van bestuur te stellen regels en die op 1 april 1984 waren
      geregistreerd, worden op verzoek van de eigenaar elke vijf jaar opnieuw geregistreerd.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel56
  - number: '56.2'
    text: |-
      De in het eerste lid bedoelde registratie, waarvan een bewijs wordt verstrekt, geldt voor vijf jaar, en wel van 1
      april tot 1 april.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel56
  - number: '57'
    text: |-
      Bij de registratie worden tevens geregistreerd de naam en het adres van de houder of houders van een kooikersakte,
      die volgens opgave van de eigenaar als kooikers zullen optreden.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel57
  - number: '58'
    text: |-
      Gedurende het tijdvak waarin de jacht op eenden ingevolge het bepaalde krachtens [artikel 46][ref1] is gesloten, is
      het verboden een geregistreerde eendenkooi vangklaar te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel46
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '46'
        hoofdstuk: V
        afdeling: '4'
  - number: '59.1'
    text: |-
      Onze Minister stelt het opschrift vast dat dient te worden aangebracht op de palen waarmee de eigenaar van een
      geregistreerde eendenkooi de ingevolge zijn recht op afpaling bestaande afpalingskring van die kooi kan afpalen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel59
  - number: '59.2'
    text: |-
      Het is ieder ander dan de kooiker van een geregistreerde eendenkooi of degene die handelt met toestemming van
      die kooiker, verboden binnen de afpalingskring van die kooi handelingen te verrichten waardoor eenden binnen de
      afpalingskring kunnen worden verontrust.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel59
  - number: '59.3'
    text: |-
      Het verbod, bedoeld in het tweede lid, is niet van toepassing op handelingen verricht ter uitvoering van openbare
      werken noch op handelingen verricht bij het gebruik en onderhoud van hetgeen door die werken is tot stand gebracht,
      noch op handelingen verricht ter uitoefening van beroep of bedrijf, indien redelijkerwijs niet kan worden gevergd
      dat de handelingen niet of op andere wijze dan wel op een ander tijdstip kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel59
  - number: '59.4'
    text: |-
      Degene die opdracht heeft gegeven tot uitvoering van de in het vorige lid bedoelde openbare werken, is verplicht
      de schade, welke uit de daartoe noodzakelijke handelingen voor het gebruik van de eendenkooi voortvloeit, aan de
      benadeelde te vergoeden.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel59
  - number: '59.5'
    text: Het verbod, gesteld in het tweede lid, geldt niet, voorzover op 1 april 1977 een recht op afpaling niet bestond.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel59
  - number: '60.1'
    text: |-
      Voorzover naar het oordeel van Onze Minister de belangen van natuurbehoud zich daartegen niet verzetten, kan
      Onze Minister een periode liggende tussen 1 maart en 9 april vaststellen, waarbinnen gedeputeerde staten aan
      samenwerkingsverbanden van weidevogelbeschermers die overeenkomstig het tweede lid zijn erkend, ontheffing kunnen
      verlenen van het verbod van [artikel 12][ref1] ten behoeve van het zoeken en rapen van eieren van de kievit
      (Vanellus vanellus).


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel12
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '60.2'
    text: |-
      Gedeputeerde staten kunnen samenwerkingsverbanden van weidevogelbeschermers erkennen indien zij voldoen aan bij
      ministeriële regeling gestelde regels. Deze regels betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel60
  - number: 60.2.a
    text: de rechtsvorm van de samenwerkingsverbanden en
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel60
  - number: 60.2.b
    text: de omvang en begrenzing van het gebied waarover zich de zorg van het samenwerkingsverband kan uitstrekken.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel60
  - number: '60.3'
    text: |-
      Aan een ontheffing als bedoeld in het eerste lid wordt het voorschrift verbonden dat degene die eieren zoekt en
      raapt, de nesten en legsels van weidevogels beschermt, dan wel ervoor zorgdraagt dat deze worden beschermd. Overige
      voorschriften en beperkingen kunnen in ieder geval inhouden:
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel60
  - number: 60.3.a
    text: |-
      het voorschrift dat het zoeken en rapen van kievitseieren op eens anders grond buiten tegenwoordigheid van de
      gebruiker van die grond slechts is toegestaan indien de gebruiker van de grond hiervoor schriftelijk toestemming
      heeft verleend en
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel60
  - number: 60.3.b
    text: |-
      de beperking dat het zoeken en rapen van kievitseieren slechts gedurende een deel van de in het eerste lid bedoelde
      periode is toegestaan.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel60
  - number: '60.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot voorschriften en beperkingen
      waaronder de in het eerste lid bedoelde ontheffingen kunnen worden verleend.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel60
  - number: '60.5'
    text: Het is verboden zich bij het zoeken en rapen van kievitseieren door één of meer honden te doen vergezellen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel60
  - number: '61.1'
    text: |-
      In afwijking van de verboden, bedoeld in [artikel 13, eerste lid][ref1], is het toegestaan met inachtneming van het
      bepaalde in het tweede lid, eieren van kieviten onder zich te hebben, te vervoeren of af te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '61.2'
    text: |-
      Het vervoeren of afleveren van de in het eerste lid bedoelde eieren is slechts toegestaan voorzover de eieren zijn
      verkregen overeenkomstig een ontheffing als bedoeld in [artikel 60, eerste lid][ref1], en slechts gedurende de voor
      de betrokken eieren toegestane raaptijd of de twee daarop volgende dagen, met dien verstande dat het vervoeren van
      de eieren gedurende deze twee dagen slechts binnen de bebouwde kom van gemeenten of langs openbare wegen of paden
      is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel60
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '60'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: '62.1'
    text: Het is verboden dode dieren, behorende tot soorten waarop deze wet van toepassing is, te prepareren.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel62
  - number: '62.2'
    text: |-
      Het verbod in het eerste lid is niet van toepassing als een door Onze Minister erkend preparateursexamen met
      gunstig gevolg is afgelegd. Het bepaalde in [artikel 40, eerste lid][ref1], is ten aanzien van dat examen van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel40
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '40'
        hoofdstuk: V
        afdeling: '3'
  - number: '62.3'
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing voor de houder van een vergunning of een
      ontheffing als bedoeld in artikel 15 of 21 van de Vogelwet 1936, [artikel 60 van de Jachtwet][ref1] of
      [artikel 25 van de Natuurbeschermingswet][ref2], voor zover deze is verleend met het oog op de preparatie van
      dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0002155#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel25
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002155
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0002611
        artikel: '25'
  - number: '62.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen diersoorten worden aangewezen ten aanzien waarvan het verbod, bedoeld in
      het eerste lid, niet geldt.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel62
  - number: '63.1'
    text: |-
      Bij algemene maatregel van bestuur kan, in afwijking van de verboden, bedoeld in
      [artikel 13, eerste lid, het onder][ref1] zich hebben, het vervoeren, het afleveren of het binnen of buiten
      het grondgebied van Nederland brengen van te prepareren of geprepareerde producten van dieren worden toegestaan
      overeenkomstig bij die maatregel gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '63.2'
    text: 'Tot de regels, bedoeld in het eerste lid, behoren in ieder geval verplichtingen tot:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel63
  - number: 63.2.a
    text: het aanbrengen van ringen of merktekens aan de ter preparatie aangeboden en geprepareerde producten van dieren;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel63
  - number: 63.2.b
    text: |-
      het houden van een registratie van de ter preparatie ontvangen en geprepareerde producten van dieren alsmede van de
      namen en adressen van degenen van wie deze producten van dieren zijn ontvangen en aan wie zij zijn geleverd;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel63
  - number: 63.2.c
    text: onderzoek van ter preparatie aangeboden producten van dieren en
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel63
  - number: 63.2.d
    text: het doen van periodiek verslag aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel63
  - number: '63.3'
    text: |-
      Voorzover aan een onderzoek, bedoeld in het tweede lid, onderdeel c, kosten zijn verbonden, komen deze voor
      rekening van degene, die de prepareerwerkzaamheden uitvoert, of van degene die aan hem producten van dieren ter
      preparatie aanbiedt.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel63
  - number: '63.4'
    text: |-
      Ter uitvoering van internationale verplichtingen of van bindende besluiten van organen van de Europese Unie of
      andere volkenrechtelijke organisaties kan bij de regels, bedoeld in het eerste lid, tevens worden bepaald dat het
      verrichten van in het eerste lid genoemde handelingen slechts kan worden toegestaan bij vergunning.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel63
  - number: '64.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen diersoorten worden aangewezen die uit het oogpunt van natuurbehoud niet
      mogen worden geprepareerd.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel64
  - number: '64.2'
    text: Het prepareren van dieren, behorende tot soorten, aangewezen krachtens het eerste lid, is verboden.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel64
  - number: '65.1'
    text: |-
      Bij algemene maatregel van bestuur worden beschermde inheemse diersoorten aangewezen, die niet in hun voortbestaan
      worden bedreigd of dat gevaar lopen. Daarbij wordt onderscheid gemaakt tussen soorten die:
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel65
  - number: 65.1.a
    text: in het gehele land schade aanrichten;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel65
  - number: 65.1.b
    text: in delen van het land schade aanrichten.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel65
  - number: '65.2'
    text: |-
      Slechts wanneer er geen andere bevredigende oplossing bestaat en indien geen afbreuk wordt gedaan aan een gunstige
      staat van instandhouding van de soort, kan de aanwijzing bedoeld in het eerste lid worden gedaan ter voorkoming
      van:
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel65
  - number: 65.2.a
    text: belangrijke schade aan gewassen, vee, bossen, bedrijfsmatige visserij en wateren, of
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel65
  - number: 65.2.b
    text: schade aan de fauna.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel65
  - number: '65.3'
    text: |-
      Voorzover overeenkomstig het eerste lid, onderdeel a, soorten zijn aangewezen, kan bij ministeriële regeling worden
      toegestaan dat de grondgebruiker, in afwijking van de [artikelen 9][ref1], [10][ref2], [11][ref3] en [12][ref4],
      handelingen, bedoeld in die artikelen, verricht op de door hem gebruikte gronden of in of aan door hem gebruikte
      opstallen ter voorkoming van in het huidige of komende jaar dreigende schade als bedoeld in het tweede lid, binnen
      de grenzen van het werkgebied van de wildbeheereenheid waarin die gronden of opstallen zijn gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0009640#Artikel12
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009640
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '65.4'
    text: |-
      Voorzover overeenkomstig het eerste lid, onderdeel b, soorten zijn aangewezen, kan bij provinciale verordening
      worden toegestaan dat de grondgebruiker, in afwijking van de [artikelen 9][ref1], [10][ref2], [11][ref3] en
      [12][ref4], handelingen, bedoeld in die artikelen, verricht op de door hem gebruikte gronden of in of aan door hem
      gebruikte opstallen ter voorkoming van in het huidige of komende jaar dreigende schade als bedoeld in het tweede
      lid, binnen de grenzen van het werkgebied van de wildbeheereenheid waarin die gronden of opstallen zijn gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0009640#Artikel12
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009640
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '65.5'
    text: |-
      Slechts wanneer er geen andere bevredigende oplossing bestaat en indien geen afbreuk wordt gedaan aan een gunstige
      staat van instandhouding van de soort, kan het krachtens het derde en vierde lid worden toegestaan de in die leden
      bedoelde handelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel65
  - number: '65.6'
    text: |-
      De grondgebruiker kan bij schriftelijke toestemming het hem ingevolge het derde of vierde lid toekomende recht door
      anderen doen uitoefenen. Indien die toestemming wordt verleend aan een houder van een jachtakte of valkeniersakte
      is deze gerechtigd, behalve de middelen, bedoeld in [artikel 72, eerste lid][ref1], tevens de middelen te gebruiken
      waarvan hem het gebruik is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel72
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '72'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: '65.7'
    text: |-
      Voorzover krachtens het derde en vierde lid regels zijn gesteld, is nietig elk beding dat de grondgebruiker de
      uitoefening belet van de rechten die hem krachtens die regels toekomen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel65
  - number: '65.8'
    text: |-
      Alvorens Ons een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als
      bedoeld in het eerste lid te doen, stelt Onze Minister het Faunafonds in de gelegenheid over het ontwerp daarvan
      zijn oordeel te geven.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel65
  - number: '65.9'
    text: |-
      Alvorens een ministeriële regeling als bedoeld in het derde lid of een provinciale verordening als bedoeld in het
      vierde lid vast te stellen, te wijzigen of in te trekken, stelt Onze Minister onderscheidenlijk provinciale staten
      het Faunafonds in de gelegenheid over het ontwerp daarvan zijn oordeel te geven.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel65
  - number: '65.10'
    text: |-
      De begrenzing van het werkgebied van een wildbeheereenheid als bedoeld in het derde en vierde lid, wordt door de
      desbetreffende wildbeheereenheid vastgesteld en aangegeven op een kaart. Het werkgebied van een wildbeheereenheid
      strekt zich niet uit tot een gebied waarover zich de zorg van een andere wildbeheereenheid uitstrekt. Door de
      tussenkomst van gedeputeerde staten van de provincie of provincies waarin het desbetreffende gebied is gelegen
      wordt de begrenzing van het werkgebied van een wildbeheereenheid bekendgemaakt in het provinciaal blad.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel65
  - number: '66'
    text: |-
      Het bepaalde in [artikel 65][ref1] is van overeenkomstige toepassing voor de gebruiker van opstallen, niet zijnde
      grondgebruiker, voorzover het de door hem gebruikte opstallen en de daarbij behorende erven betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel65
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '65'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: '67.1'
    text: |-
      Gedeputeerde staten kunnen bepalen dat, wanneer er geen andere bevredigende oplossing bestaat, in afwijking van
      het bepaalde bij of krachtens de [artikelen 9][ref1], [11][ref2], [12][ref3], [50][ref4], [51][ref5], [53][ref6],
      [72, vijfde lid][ref7], en [74][ref8], door door hen aan te wijzen personen of categorieën van personen de stand
      van bij ministeriële regeling aangewezen beschermde inheemse diersoorten of andere diersoorten of verwilderde
      dieren op door gedeputeerde staten aan te wijzen gronden kan worden beperkt:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0009640#Artikel50
      [ref5]: https://wetten.overheid.nl/BWBR0009640#Artikel51
      [ref6]: https://wetten.overheid.nl/BWBR0009640#Artikel53
      [ref7]: https://wetten.overheid.nl/BWBR0009640#Artikel72
      [ref8]: https://wetten.overheid.nl/BWBR0009640#Artikel74
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009640
        artikel: '50'
        hoofdstuk: V
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0009640
        artikel: '51'
        hoofdstuk: V
        afdeling: '4'
      - id: ref6
        bwb_id: BWBR0009640
        artikel: '53'
        hoofdstuk: V
        afdeling: '4'
      - id: ref7
        bwb_id: BWBR0009640
        artikel: '72'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref8
        bwb_id: BWBR0009640
        artikel: '74'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: 67.1.a
    text: in het belang van de volksgezondheid en openbare veiligheid;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel67
  - number: 67.1.b
    text: in het belang van de veiligheid van het luchtverkeer;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel67
  - number: 67.1.c
    text: ter voorkoming van belangrijke schade aan gewassen, vee, bossen, bedrijfsmatige visserij en wateren of
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel67
  - number: 67.1.d
    text: ter voorkoming van schade aan flora en fauna.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel67
  - number: '67.2'
    text: |-
      Gedeputeerde staten kunnen bij het treffen van een bepaling als bedoeld in het eerste lid niet afwijken van het
      bepaalde bij of krachtens [artikel 72, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel72
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '72'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: 67.2.a
    text: |-
      voorzover de bepaling ziet op het beperken van de stand van bij de in het eerste lid bedoelde ministeriële regeling
      aangewezen vogelsoorten, bedoeld in [artikel 4, eerste lid, onderdeel b][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel4
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '4'
        hoofdstuk: II
  - number: 67.2.b
    text: voor het toestaan van middelen die onnodig lijden van dieren veroorzaken.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel67
  - number: '67.3'
    text: |-
      Voorzover het beschermde inheemse diersoorten betreft, kan een bepaling als bedoeld in het eerste lid slechts
      worden getroffen indien geen afbreuk wordt gedaan aan een gunstige staat van instandhouding van de soort.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel67
  - number: '67.4'
    text: Gedeputeerde staten kunnen hun besluit, bedoeld in het eerste lid, afhankelijk stellen van een faunabeheerplan.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel67
  - number: '67.5'
    text: |-
      Gedeputeerde staten kunnen ten aanzien van één of meer van de door hen krachtens het eerste lid aangewezen personen
      of categorieën van personen bepalen dat zij toegang hebben tot alle krachtens het eerste lid aangewezen gronden. In
      dat geval zijn deze personen gerechtigd zich daartoe zonodig met behulp van de sterke arm toegang te verschaffen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel67
  - number: '67.6'
    text: Gedeputeerde staten kunnen bepalen hetgeen met de ingevolge het eerste lid bemachtigde dieren dient te geschieden.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel67
  - number: '67.7'
    text: |-
      Bij een regeling als bedoeld in het eerste lid, kan worden bepaald dat het verboden is dieren behorende tot een
      krachtens dat lid aangewezen soort onder zich te hebben.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel67
  - number: '67.8'
    text: |-
      Alvorens een ministeriële regeling als bedoeld in het eerste lid vast te stellen, te wijzigen of in te trekken,
      stelt Onze Minister het Faunafonds in de gelegenheid over het ontwerp daarvan zijn oordeel te geven.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel67
  - number: '68.1'
    text: |-
      Wanneer er geen andere bevredigende oplossing bestaat en indien geen afbreuk wordt gedaan aan een gunstige
      staat van instandhouding van de soort, kunnen gedeputeerde staten, voorzover niet bij of krachtens enig ander
      artikel van deze wet vrijstelling is of kan worden verleend, ten aanzien van beschermde inheemse diersoorten, het
      Faunafonds gehoord, ontheffing verlenen van het bepaalde bij of krachtens de [artikelen 9 tot en met 15][ref1],
      [15a][ref2], [15b, tweede lid in samenhang met het eerste lid][ref3], [16][ref4], [17][ref5], [18][ref6],
      [53, eerste lid, onderdelen c en d][ref7], [72, vijfde lid][ref8], en [74][ref9]:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel15b
      [ref4]: https://wetten.overheid.nl/BWBR0009640#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0009640#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0009640#Artikel18
      [ref7]: https://wetten.overheid.nl/BWBR0009640#Artikel53
      [ref8]: https://wetten.overheid.nl/BWBR0009640#Artikel72
      [ref9]: https://wetten.overheid.nl/BWBR0009640#Artikel74
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: 15a
        hoofdstuk: III
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: 15b
        hoofdstuk: III
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0009640
        artikel: '16'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0009640
        artikel: '17'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0009640
        artikel: '18'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref7
        bwb_id: BWBR0009640
        artikel: '53'
        hoofdstuk: V
        afdeling: '4'
      - id: ref8
        bwb_id: BWBR0009640
        artikel: '72'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref9
        bwb_id: BWBR0009640
        artikel: '74'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: 68.1.a
    text: in het belang van de volksgezondheid en openbare veiligheid;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel68
  - number: 68.1.b
    text: in het belang van de veiligheid van het luchtverkeer;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel68
  - number: 68.1.c
    text: ter voorkoming van belangrijke schade aan gewassen, vee, bossen, bedrijfsmatige visserij en wateren;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel68
  - number: 68.1.d
    text: ter voorkoming van schade aan flora en fauna of
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel68
  - number: 68.1.e
    text: met het oog op andere, bij algemene maatregel van bestuur aan te wijzen, belangen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel68
  - number: '68.2'
    text: |-
      Een ontheffing die betrekking heeft op vogels als bedoeld in [artikel 4, eerste lid, onderdeel b][ref1],
      of op soorten als bedoeld in bijlage IV, onderdeel a, of, voorzover de ontheffing betrekking heeft op
      [artikel 15b][ref2], soorten als bedoeld in bijlage V, onderdeel a, van richtlijn 92/43/EEG, wordt uitsluitend
      verleend voor zover de grond als bedoeld in het eerste lid, onderdeel a tot en met e, overeenstemt met een van de
      gronden, genoemd in artikel 9 van richtlijn 2009/147/EG onderscheidenlijk artikel 16 van richtlijn 92/43/EEG.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel15b
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009640
        artikel: 15b
        hoofdstuk: III
        paragraaf: '4'
  - number: '68.3'
    text: |-
      Gedeputeerde staten kunnen bij verlening van een ontheffing als bedoeld in het eerste lid niet afwijken van het
      bepaalde bij of krachtens [artikel 72, vijfde lid][ref1], voor het toestaan van middelen die onnodig lijden van
      dieren veroorzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel72
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '72'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: '68.4'
    text: |-
      De ontheffing, bedoeld in het eerste lid, wordt slechts verleend aan een faunabeheereenheid op basis van een
      faunabeheerplan.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel68
  - number: '68.5'
    text: |-
      Onverminderd het bepaalde in [artikel 80, onderdeel e][ref1], worden ontheffingen als bedoeld in het eerste lid,
      verleend voor een periode van ten hoogste vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel80
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '80'
        hoofdstuk: V
        afdeling: '3'
  - number: '68.6'
    text: |-
      In afwijking van het derde lid kan de ontheffing, bedoeld in het eerste lid, ook aan anderen dan een
      faunabeheereenheid worden verleend indien:
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel68
  - number: 68.6.a
    text: |-
      de noodzaak ontbreekt voor een faunabeheerplan gelet op de soort dan wel de aard of omvang van te verrichten
      handelingen;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel68
  - number: 68.6.b
    text: de noodzaak ontbreekt dat de te verrichten handelingen worden verricht door tussenkomst van een faunabeheereenheid;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel68
  - number: 68.6.c
    text: |-
      het gebied waar de handelingen worden verricht niet is gelegen in een gebied waarover zich de zorg van een
      faunabeheereenheid uitstrekt.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel68
  - number: '68.7'
    text: |-
      Gedeputeerde staten doen tegelijkertijd met of zo spoedig mogelijk na de bekendmaking van besluiten als bedoeld in
      het eerste en vijfde lid mededeling van deze besluiten in één of meer dag-, nieuws- of huis-aan-huisbladen of op
      andere geschikte wijze. Van besluiten als bedoeld in het eerste juncto derde lid wordt tevens tegelijkertijd met of
      zo spoedig mogelijk na de bekendmaking van deze besluiten mededeling gedaan in de Staatscourant. Een afschrift van
      deze besluiten sturen zij aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel68
  - number: '69.1'
    text: |-
      Een faunabeheereenheid waaraan een ontheffing als bedoeld in [artikel 68, eerste lid][ref1], is verleend, brengt
      jaarlijks aan gedeputeerde staten verslag uit van de wijze waarop zij van de ontheffing heeft gebruik gemaakt en
      van de uitvoering van het faunabeheerplan.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel68
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '68'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: '69.2'
    text: Het verslag wordt door gedeputeerde staten voor een ieder ter inzage gelegd op het provinciehuis.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel69
  - number: '69.3'
    text: |-
      Gedeputeerde staten doen mededeling van de terinzagelegging in één of meer dag-, nieuws- of huis-aan-huisbladen of
      op andere geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel69
  - number: '70'
    text: |-
      In afwijking van de [artikelen 29][ref1], [30][ref2], [46, vijfde lid][ref3], [67][ref4], [68][ref5] en
      [74a, tweede lid][ref6], neemt Onze Minister besluiten als bedoeld in die artikelen voorzover het terreinen betreft
      waar het genot van de jacht berust bij de Kroondrager.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0009640#Artikel67
      [ref5]: https://wetten.overheid.nl/BWBR0009640#Artikel68
      [ref6]: https://wetten.overheid.nl/BWBR0009640#Artikel74a
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '29'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '30'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '46'
        hoofdstuk: V
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0009640
        artikel: '67'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0009640
        artikel: '68'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref6
        bwb_id: BWBR0009640
        artikel: 74a
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: '71'
    text: |-
      Gedeputeerde staten verschaffen Onze Minister desgevraagd alle inlichtingen met betrekking tot het nemen van
      besluiten als bedoeld in de[ artikelen 65][ref1], [67][ref2] en [68][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel68
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '65'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '67'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '68'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: '72.1'
    text: |-
      Bij algemene maatregel van bestuur worden, voorzover noodzakelijk in afwijking van [artikel 15][ref1], de middelen
      aangewezen waarmee, met inachtneming van het bepaalde bij of krachtens de [artikelen 65 tot en met 70][ref2],
      dieren mogen worden gevangen of gedood. Als middelen worden slechts aangewezen middelen die geen onnodig lijden van
      dieren veroorzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel65
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '15'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '65'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: '72.2'
    text: |-
      Bij de maatregel, bedoeld in het eerste lid, worden tevens de middelen aangewezen waarmede de zwarte rat, de bruine
      rat en de huismuis mogen worden bestreden. Naast middelen als bedoeld in het eerste lid zijn tevens toegelaten
      middelen die krachtens de [Wet gewasbeschermingsmiddelen en biociden][ref1] zijn toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0021670
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0021670
  - number: '72.3'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, worden regels gesteld met betrekking tot het
      gebruik van de in het eerste en tweede lid bedoelde middelen. Deze regels betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel72
  - number: 72.3.a
    text: de soorten waarop de middelen betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel72
  - number: 72.3.b
    text: de afmetingen van de gronden waarop de middelen gebruikt mogen worden en
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel72
  - number: 72.3.c
    text: de vaardigheden waarover bij het gebruik van de middelen beschikt moet worden.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel72
  - number: '72.4'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kan tevens worden bepaald dat het gebruik van
      middelen afhankelijk kan worden gesteld van de toestemming daartoe van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel72
  - number: '72.5'
    text: |-
      Het is verboden dieren te vangen of te doden met andere dan de in het eerste of tweede lid bedoelde middelen of in
      strijd met de toestemming, bedoeld in het vierde lid of de regels die op grond van het derde lid worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel72
  - number: '72.6'
    text: |-
      Voorzover het bij of krachtens het eerste tot en met het derde lid is toegestaan gebruik te maken van het geweer,
      is het bepaalde bij of krachtens de [artikelen 54][ref1] en [55][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel55
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '54'
        hoofdstuk: V
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '55'
        hoofdstuk: V
        afdeling: '5'
  - number: '73'
    text: |-
      Bij de bestrijding van schade en overlast bij of krachtens de [artikelen 65 tot en met 70][ref1] dan wel krachtens
      een ontheffing als bedoeld in [artikel 75][ref2], dient onnodig lijden van dieren te worden voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel75
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '65'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '75'
        hoofdstuk: V
        afdeling: '2'
  - number: '74.1'
    text: |-
      Het is verboden bij de uitoefening van bevoegdheden toegekend bij of krachtens de
      [artikelen 65 tot en met 70][ref1], dieren te vangen of te doden:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel65
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '65'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: 74.1.a
    text: |-
      met een geweer of een jachtvogel in een veld dat niet voldoet aan de krachtens [artikel 49][ref1] gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel49
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '49'
        hoofdstuk: V
        afdeling: '4'
  - number: 74.1.b
    text: door middel van drijven, voorzover het edelherten, damherten, reeën of wilde zwijnen betreft;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel74
  - number: 74.1.c
    text: op zondagen, de nieuwjaarsdag, de tweede paas- en pinksterdag, de beide kerstdagen en hemelvaartsdag;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel74
  - number: 74.1.d
    text: op begraafplaatsen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel74
  - number: '74.2'
    text: |-
      In afwijking van het eerste lid, onderdeel b, is het doden van wilde zwijnen toegestaan, voorzover bepaald
      bij algemene maatregel van bestuur, door middel van een methode, waarbij één persoon wilde zwijnen opzettelijk
      verontrust met het oogmerk bedoelde dieren binnen het schootsveld van één geweerdrager te drijven opdat deze de
      dieren kan doden en voorzover hierbij geen hond wordt ingezet.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel74
  - number: '74.3'
    text: |-
      Bij algemene maatregel van bestuur kan de uitoefening van de in het eerste lid bedoelde bevoegdheden aan andere
      beperkingen dan bepaald in het eerste lid, worden gebonden voorzover dit noodzakelijk is ter uitvoering van
      internationale verplichtingen of bindende besluiten van de Europese Unie of andere volkenrechtelijke organisaties,
      of indien dit noodzakelijk is in verband met de instandhouding van soorten of de veiligheid.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel74
  - number: 74a.1
    text: |-
      Het bevorderen van de stand van edelherten, damherten, reeën en wilde zwijnen door middel van bijvoeren is
      verboden.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel74a
  - number: 74a.2
    text: 'Gedeputeerde staten kunnen ontheffing verlenen van het verbod, bedoeld in het eerste lid, indien sprake is van:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel74a
  - number: 74a.2.a
    text: bijzondere weersomstandigheden of
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel74a
  - number: 74a.2.b
    text: een tijdelijk natuurlijk voedseltekort en het welzijn van de dieren in het geding is.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel74a
  - number: '75.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, voorzover niet bij of krachtens enig ander artikel van
      deze wet vrijstelling is of kan worden verleend, vrijstelling worden verleend van de bij of krachtens de
      [artikelen 8 tot en met 18][ref1] bepaalde verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel8
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '75.2'
    text: |-
      Indien een vrijstelling als bedoeld in het eerste lid strekt tot uitvoering van internationale verplichtingen of
      bindende besluiten van organen van de Europese Unie of andere volkenrechtelijke organisaties, kan de vrijstelling
      bij ministeriële regeling worden verleend.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75
  - number: '75.3'
    text: |-
      Onze Minister kan, voorzover niet overeenkomstig [artikel 68][ref1] van deze wet door gedeputeerde
      staten ontheffing is of kan worden verleend, ontheffing verlenen van het bepaalde bij of krachtens de
      [artikelen 8 tot en met 15a][ref2], [15b, tweede lid in samenhang met het eerste lid][ref3], [16][ref4],
      [17][ref5], [18][ref6], [50][ref7], [51][ref8], [52][ref9], [53][ref10], [58][ref11], [59, tweede lid][ref12],
      [64, tweede lid][ref13], en [72, vijfde lid][ref14].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel15b
