  - number: 80.c
    text: |-
      de houder van een vergunning of ontheffing handelt in strijd met de hem verleende vergunning of ontheffing of met
      daaraan verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel80
  - number: 80.d
    text: |-
      de gegevens op grond waarvan de vergunning of ontheffing is verleend zodanig onjuist blijken te zijn dat, waren de
      juiste gegevens bekend geweest, een andere beslissing zou zijn genomen of
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel80
  - number: 80.e
    text: |-
      de omstandigheden sedert het tijdstip waarop de vergunning of ontheffing is verleend zodanig zijn gewijzigd, dat
      deze niet zouden zijn verleend indien deze omstandigheden op het tijdstip waarop zij zijn verleend zouden hebben
      bestaan.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel80
  - number: '81.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, voorzover dit noodzakelijk is voor een goede uitvoering van
      het bij of krachtens deze wet bepaalde, ter uitvoering van internationale verplichtingen of bindende besluiten van
      organen van de Europese Unie of andere volkenrechtelijke organisaties, nadere regels worden gesteld ten aanzien van
      de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel81
  - number: '81.2'
    text: 'Tot de regels, bedoeld in het eerste lid, kunnen in ieder geval behoren:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel81
  - number: 81.2.a
    text: |-
      regels over het voeren van een administratie en verstrekken van gegevens met betrekking tot het onder zich hebben,
      ontvangen, verkopen, ten verkoop voorradig of voorhanden hebben en afleveren van dieren of planten, behorende tot
      soorten waarop deze wet van toepassing is, alsmede van producten van die planten of producten of eieren van die
      dieren;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel81
  - number: 81.2.b
    text: |-
      het aanwijzen van adviseurs die zijn belast met advisering over de uitvoering van het beleid ten aanzien van
      vergunningen en ontheffingen;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel81
  - number: 81.2.c
    text: |-
      het aanwijzen van plaatsen waar planten behorende tot beschermde inheemse of uitheemse plantensoorten of dieren
      behorende tot beschermde inheemse of uitheemse diersoorten alsmede producten van die planten of producten of eieren
      van die dieren het grondgebied van Nederland dienen te worden binnengebracht;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel81
  - number: 81.2.d
    text: regels over voorzieningen voor de opvang van levende dieren en planten.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel81
  - number: '82.1'
    text: |-
      Er is een Commissie bedreigde uitheemse dier- en plantensoorten, verder te noemen commissie, die tot taak heeft
      de regering en de beide kamers der Staten-Generaal te adviseren over het beleid inzake de uitvoering van deze wet
      en de afstemming met de [Wet dieren][ref1] en de totstandkoming en uitvoering van besluiten van organen van de
      Europese Unie verband houdende met in het wild levende dier- en plantensoorten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0030250
  - number: '82.2'
    text: |-
      De commissie fungeert als wetenschappelijke autoriteit als bedoeld in artikel IX van de op 3 maart te Washington
      tot stand gekomen Overeenkomst inzake de internationale handel in bedreigde in het wild levende dier- en
      plantesoorten (Trb. 1975, 23).
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel82
  - number: '82.3'
    text: |-
      De commissie bestaat uit ten minste vijf en ten hoogste negen leden, de voorzitter daaronder begrepen, die ook
      deskundigheid bezitten op het gebied van natuurbescherming, welzijn van dieren en de opvang van dieren.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel82
  - number: '83.1'
    text: 'Er is een Faunafonds, dat tot taak heeft:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel83
  - number: 83.1.a
    text: |-
      het bevorderen van maatregelen ter voorkoming en bestrijding van schade door dieren behorende tot bij algemene
      maatregel van bestuur aangewezen soorten;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel83
  - number: 83.1.b
    text: |-
      het in de daarvoor in aanmerking komende gevallen verlenen van tegemoetkomingen in geleden schade, aangericht door
      dieren behorende tot beschermde inheemse diersoorten;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel83
  - number: 83.1.c
    text: |-
      gedeputeerde staten van de provincies van advies te dienen over de uitvoering van taken, hen bij of krachtens deze
      wet opgedragen en
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel83
  - number: 83.1.d
    text: |-
      Onze Minister van advies te dienen over het ontwerp van een algemene maatregel van bestuur als bedoeld
      in [artikel 65, eerste lid][ref1], en over het ontwerp van een ministeriële regeling als bedoeld in de
      [artikelen 65, derde lid][ref2], en [67, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel67
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '65'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '65'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '67'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '1'
  - number: '83.2'
    text: |-
      Het Faunafonds tracht de in het eerste lid omschreven doelen te bereiken door het ter hand nemen of bevorderen
      van wetenschappelijk onderzoek, het bevorderen van voorlichting en opleiding en door het treffen van andere
      maatregelen, die voor de verwezenlijking van de in het eerste lid omschreven doelen van belang kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel83
  - number: '83.3'
    text: Het Faunafonds bezit rechtspersoonlijkheid en heeft zijn zetel te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel83
  - number: '84.1'
    text: |-
      Een tegemoetkoming als bedoeld in [artikel 83, eerste lid, onderdeel b][ref1], wordt slechts verleend voorzover een
      belanghebbende schade lijdt of zal lijden aangericht door dieren, behorende tot een beschermde inheemse diersoort,
      en die schade redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven. Een tegemoetkoming wordt naar
      billijkheid bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel83
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '83'
        hoofdstuk: VI
  - number: '84.2'
    text: |-
      Voor de behandeling van een aanvraag voor een tegemoetkoming als bedoeld in het eerste lid kan een vergoeding van
      kosten gevraagd worden overeenkomstig een bij ministeriële regeling te bepalen tarief.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel84
  - number: '84.3'
    text: |-
      Bij ministeriële regeling kunnen, in overeenstemming met gedeputeerde staten van de provincies, regels worden
      gesteld met inachtneming waarvan het Faunafonds beslist over een aanvraag voor een tegemoetkoming als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel84
  - number: '85.1'
    text: Het bestuur van het Faunafonds bestaat uit negen leden, waaronder de voorzitter.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel85
  - number: '85.2'
    text: |-
      De leden van het bestuur hebben op persoonlijke titel zitting in het bestuur en oefenen hun functie uit zonder last
      of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel85
  - number: '85.3'
    text: De leden bezitten deskundigheid op het gebied van jacht, landbouw, natuurbescherming en dierenwelzijn.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel85
  - number: '86.1'
    text: Onze Minister benoemt in overeenstemming met gedeputeerde staten van de provincies de leden van het bestuur.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel86
  - number: '86.2'
    text: |-
      Het bestuur bestaat uit ten minste zes leden die naar evenredigheid afkomstig zijn uit de kringen van de jacht, de
      landbouw en de natuurbescherming en die in het bijzonder deskundig zijn ten aanzien van het beheer van soorten en
      de bestrijding van schade, alsmede uit één lid uit de kringen van de wetenschap met deskundigheid ten aanzien van
      dieroecologie en één lid uit de kringen van de dierenbescherming met deskundigheid ten aanzien van dierenwelzijn.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel86
  - number: '86.3'
    text: |-
      Onze Minister en gedeputeerde staten van de provincies gezamenlijk kunnen ieder één adviseur benoemen die de
      vergaderingen van het bestuur van het Faunafonds kan bijwonen.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel86
  - number: '87.1'
    text: De leden van het bestuur worden benoemd voor een periode van vier jaren. Zij kunnen tweemaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel87
  - number: '87.2'
    text: |-
      De leden van het bestuur worden op eigen verzoek ontslagen door Onze Minister in overeenstemming met gedeputeerde
      staten van de provincies. Zij kunnen voorts worden geschorst of ontslagen wegens ongeschiktheid, onbekwaamheid of
      op andere zwaarwegende gronden.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel87
  - number: '87.3'
    text: |-
      Onze Minister kent aan de leden van het bestuur een vergoeding toe volgens door hem in overeenstemming met
      gedeputeerde staten van de provincies te stellen regels.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel87
  - number: '88.1'
    text: Het Faunafonds stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel88
  - number: '88.2'
    text: |-
      Het bestuursreglement voorziet in ieder geval in een regeling van de openbaarheid van de vergaderingen van het
      Faunafonds.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel88
  - number: '88.3'
    text: Het bestuursreglement behoeft de goedkeuring van Onze Minister en gedeputeerde staten van de provincies.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel88
  - number: '89'
    text: 'Aan de voorafgaande goedkeuring van Onze Minister zijn onderworpen besluiten van het Faunafonds tot:'
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel89
  - number: 89.a
    text: het doen van investeringen;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel89
  - number: 89.b
    text: het verwerven van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel89
  - number: 89.c
    text: het sluiten van huur- en lease-overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel89
  - number: 89.d
    text: |-
      het oprichten of mede-oprichten dan wel ontbinden van privaatrechtelijke rechtspersonen of het deelnemen in een
      vennootschap.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel89
  - number: '90.1'
    text: Het Faunafonds stelt voor 1 september een begroting vast voor het volgende boekjaar.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel90
  - number: '90.2'
    text: De begroting behoeft de goedkeuring van Onze Minister en gedeputeerde staten van de provincies.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel90
  - number: '91.1'
    text: |-
      Het Faunafonds brengt jaarlijks aan Onze Minister en gedeputeerde staten van de provincies voor 1 mei een
      financieel verslag uit dat vergezeld gaat van een verklaring omtrent de getrouwheid en rechtmatigheid, afgegeven
      door een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '91.2'
    text: Het Faunafonds stelt de in het eerste lid bedoelde stukken algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel91
  - number: '91.3'
    text: Onze Minister zendt de stukken, bedoeld in het eerste lid, in afschrift aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel91
  - number: '92'
    text: |-
      Onze Minister kan, in overeenstemming met gedeputeerde staten van de provincies, regels stellen over de inrichting
      van de begroting, het financieel verslag en aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel92
  - number: '93.1'
    text: |-
      Het Faunafonds stelt jaarlijks voor 1 mei een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen
      en de doelmatigheid en doeltreffendheid van zijn werkzaamheden en werkwijze in het bijzonder in het afgelopen
      kalenderjaar. Het verslag wordt aan Onze Minister en aan gedeputeerde staten van de provincies toegezonden.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel93
  - number: '93.2'
    text: Het Faunafonds stelt het in het eerste lid bedoelde verslag algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel93
  - number: '93.3'
    text: Onze Minister zendt het verslag, bedoeld in het eerste lid, in afschrift aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel93
  - number: '94.1'
    text: |-
      Ten behoeve van het Faunafonds wordt van hen aan wie een jachtakte, valkeniersakte of kooikersakte wordt
      uitgereikt, een door Onze Minister, het Faunafonds gehoord, vastgestelde bijdrage geheven. Zij geldt voor het
      tijdvak waarvoor de betreffende akte is verleend.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel94
  - number: '94.2'
    text: De bijdrage kan verschillend zijn per soort akte die wordt uitgereikt.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel94
  - number: '94.3'
    text: De bijdrage dient te worden voldaan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel94
  - number: '94.4'
    text: Uitreiking van de akte vindt niet plaats alvorens de bijdrage is voldaan.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel94
  - number: '95'
    text: |-
      De ingevolge [artikel 94][ref1] ontvangen bijdragen worden met inachtneming van bij algemene maatregel van bestuur
      te stellen regels verantwoord aan en ter beschikking gesteld van het Faunafonds.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel94
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '94'
        hoofdstuk: VI
  - number: '96.1'
    text: Onze Minister verleent een bijdrage ten behoeve van het Faunafonds.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel96
  - number: '96.2'
    text: |-
      Ten behoeve van het Faunafonds verlenen gedeputeerde staten van de provincies een bijdrage volgens regels, gesteld
      bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel96
  - number: '96.3'
    text: |-
      De bijdrage, bedoeld in het eerste lid, strekt tot vergoeding van de kosten van het Faunafonds voorzover de
      bijdrage van gedeputeerde staten van de provincies, bedoeld in het tweede lid, daarop geen betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel96
  - number: '97'
    text: |-
      Het Faunafonds verstrekt desgevraagd aan Onze Minister of aan gedeputeerde staten de voor de uitoefening van hun
      taak benodigde inlichtingen. Onze Minister en gedeputeerde staten kunnen inzage vorderen van zakelijke gegevens en
      bescheiden, voorzover dat voor de vervulling van hun taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel97
  - number: '98'
    text: |-
      Indien het Faunafonds zijn taken, voortvloeiend uit [artikel 83][ref1], naar het oordeel van Onze Minister of
      gedeputeerde staten van de provincies verwaarloost, kan Onze Minister, na overleg met gedeputeerde staten van de
      provincies, de noodzakelijke voorzieningen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel83
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '83'
        hoofdstuk: VI
  - number: '99'
    text: |-
      Voorzover in dit hoofdstuk is voorzien in besluiten van Onze Minister en gedeputeerde staten van de provincies,
      neemt Onze Minister die besluiten indien niet binnen drie maanden overeenstemming is bereikt over gelijkluidende
      besluiten.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel99
  - number: '100.1'
    text: Onze Minister voegt aan het Faunafonds een secretariaat toe ten behoeve van de werkzaamheden van het bestuur.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel100
  - number: '100.2'
    text: |-
      De leden van het secretariaat zijn voor de uitoefening van hun taak uitsluitend verantwoording schuldig aan het
      bestuur van het Faunafonds.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel100
  - number: '102.1'
    text: |-
      Onze Minister kan door hem erkende rechtspersoonlijkheid bezittende organisaties belasten met de taak
      overeenkomstig door hem gestelde regels ringen of merktekens uit te reiken ten behoeve van het onder zich hebben
      van jachtvogels of van beschermde inheemse diersoorten.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel102
  - number: '102.2'
    text: |-
      Een organisatie als bedoeld in het eerste lid, kan voor het verstrekken van ringen of merktekens een vergoeding van
      kosten vragen waarvan de hoogte door Onze Minister wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel102
  - number: '103'
    text: |-
      Een krachtens de [artikelen 15][ref1], [30, tweede lid][ref2], [37, derde lid][ref3], [48][ref4], [49][ref5],
      [50, tweede lid][ref6], [65, eerste lid][ref7], [68, eerste lid, onderdeel e][ref8], [72, eerste lid][ref9],
      [75, eerste en zesde lid, onderdeel c][ref10], vast te stellen algemene maatregel van bestuur treedt niet eerder in
      werking dan acht weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt
      onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel37
