      [ref10]: https://wetten.overheid.nl/BWBR0009640#Artikel53
      [ref11]: https://wetten.overheid.nl/BWBR0009640#Artikel58
      [ref12]: https://wetten.overheid.nl/BWBR0009640#Artikel59
      [ref13]: https://wetten.overheid.nl/BWBR0009640#Artikel64
      [ref14]: https://wetten.overheid.nl/BWBR0009640#Artikel72
    url: https://wetten.overheid.nl/BWBR0009640/2016-04-14#Artikel75
