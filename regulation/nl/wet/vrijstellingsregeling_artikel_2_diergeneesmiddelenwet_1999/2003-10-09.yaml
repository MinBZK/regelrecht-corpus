  - number: '5'
    text: |-
      1 In afwijking van [artikel 2, eerste lid, van de wet][ref1] mogen dierenartsen de in
      [artikel 4, eerste lid][ref2], bedoelde middelen voorhanden of in voorraad hebben met het oog op de in dat lid
      bedoelde toepassing. De voorraad moet in redelijke verhouding staan tot de omvang van het dierenbestand van de
      praktijk van de betreffende dierenarts;

      2 In afwijking van [artikel 2, eerste lid, van de wet][ref3] mogen apothekers middelen, als bedoeld in
      [artikel 4, eerste lid][ref4], voorhanden of in voorraad hebben of afleveren aan dierenartsen ten behoeve van de in
      [artikel 4][ref5] bedoelde toepassing.


