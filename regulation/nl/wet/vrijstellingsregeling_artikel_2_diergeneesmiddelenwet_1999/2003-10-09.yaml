  - number: '3'
    text: |-
      1 In afwijking van [artikel 2, eerste lid, van de wet][ref1] mogen dierenartsen de in
      [artikel 2, eerste lid, onderdeel b][ref2], bedoelde middelen voorhanden of in voorraad hebben met het oog op
      de in dat onderdeel bedoelde toepassing. De voorraad moet in redelijke verhouding staan tot de omvang van het
      dierenbestand van de praktijk van de betreffende dierenarts.

      2 In afwijking van [artikel 2, eerste lid, van de wet][ref3] mogen dierenartsen de in
      [artikel 2, eerste lid, onderdeel c][ref4], bedoelde middelen voorhanden hebben ten behoeve van de in
      [artikel 2][ref5] bedoelde toepassing.

      3 In afwijking van [artikel 2, eerste lid, van de wet][ref6] mogen apothekers middelen, als bedoeld in
      [artikel 2, eerste lid, onderdeel b][ref7], voorhanden of in voorraad hebben of afleveren aan dierenartsen ten
      behoeve van de in [artikel 2][ref8] bedoelde toepassing.

      4 In afwijking van [artikel 2, eerste lid, van de wet][ref9] mogen apothekers middelen, als bedoeld in
      [artikel 2, eerste lid, onderdeel c][ref10], voorhanden hebben of afleveren aan dierenartsen ten behoeve van de in
      [artikel 2][ref11] bedoelde toepassing.


