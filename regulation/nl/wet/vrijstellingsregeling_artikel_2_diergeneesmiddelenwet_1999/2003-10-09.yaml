  - number: '4'
    text: |-
      1 In afwijking van [artikel 2, eerste lid, van de wet][ref1] mogen dierenartsen de diergeneesmiddelen die
      zijn opgenomen in de bijlage bij deze regeling, met inachtneming van het daarin bepaalde, toepassen bij
      voedselproducerende dieren, indien dat uit diergeneeskundig oogpunt noodzakelijk is en voor de toepassing geen
      diergeneesmiddelen beschikbaar zijn.

      2 [Artikel 2, vierde lid][ref2], is van overeenkomstige toepassing op dieren en producten van dieren waarbij een in
      het eerste lid bedoeld diergeneesmiddel is toegepast.

      3 Diergeneesmiddelen worden slechts in de bijlage opgenomen:

      a. indien er voor de betreffende toepassing en diersoort geen diergeneesmiddel beschikbaar is;

      b. voor een periode van ten hoogste 5 jaar;

      c. voor zover zij voor enigerlei toepassing zijn geregistreerd, en

      d. voor zover het toepassing bij runderen, varkens of kippen betreft, voor toepassing bij incidenteel voorkomende
      indicaties.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010809#Artikel2
