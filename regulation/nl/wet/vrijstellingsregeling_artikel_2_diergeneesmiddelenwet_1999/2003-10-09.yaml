  - number: '7'
    text: |-
      Bij toepassing van middelen ingevolge de [artikelen 2][ref1] of [4][ref2] melden dierenartsen vermoedelijke
      bijwerkingen binnen 15 dagen nadat deze aan hen bekend zijn geworden aan het Bureau Bijwerkingen
      Diergeneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0010809#Artikel2
