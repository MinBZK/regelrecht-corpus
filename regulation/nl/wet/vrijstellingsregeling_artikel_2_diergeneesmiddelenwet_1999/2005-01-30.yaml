  - number: 4a
    text: |-
      1 In afwijking van [artikel 2, eerste lid, van de wet][ref1] mogen de diergeneesmiddelen die zijn opgenomen in
      [bijlage 2][ref2] bij deze regeling, met inachtneming van het daarin bepaalde, worden toegepast bij de diersoorten,
      genoemd bij de betreffende middelen in die [bijlage][ref3], indien dat uit diergeneeskundig oogpunt noodzakelijk is
      en voor de toepassing geen diergeneesmiddelen beschikbaar zijn.

      2 [Artikel 2, vierde lid][ref4], is van overeenkomstige toepassing op voedselproducerende dieren en producten
      van dieren waarbij een in het eerste lid bedoeld diergeneesmiddel is toegepast, tenzij op de recipiënt of de
      buitenverpakking als bedoeld in [artikel 4 van het Besluit verpakking en etikettering diergeneesmiddelen][ref5] een
      wachttermijn voor de betrokken diersoort is aangegeven.

      3 Een diergeneesmiddel wordt slechts in [bijlage 2][ref6] opgenomen indien het in een andere lidstaat is
      toegelaten als diergeneesmiddel op grond van een vergunning als bedoeld in artikel 5 van [richtlijn nr. 2001/82/
      EG](32001L0082).

      4 Een diergeneesmiddel dat is bestemd om te worden toegepast bij een voedselproducerend dier wordt slechts in
      [bijlage 2][ref7] opgenomen indien de werkzame stof van het middel is opgenomen in bijlage I, II of III bij
      [verordening (EEG) nr. 2377/90](31990R2377).

      5 De diergeneesmiddelen, opgenomen in [bijlage 2][ref8], worden aangewezen als diergeneesmiddel als bedoeld in:

      a. [artikel 29, eerste lid, van de wet][ref9];

      b. [artikel 30, vierde lid, van de wet][ref10], tenzij in de bijlage bij het desbetreffende diergeneesmiddel ‘UDA’
      is vermeld.


