    text: |-
      Bij toepassing van middelen ingevolge de [artikelen 2][ref1], [4][ref2] of [4a][ref3] melden dierenartsen
      vermoedelijke bijwerkingen binnen 15 dagen nadat deze aan hen bekend zijn geworden aan het Bureau Bijwerkingen
      Diergeneesmiddelen.


