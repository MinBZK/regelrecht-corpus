preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Volksgezondheid, Welzijn en Sport,

    Gelet op artikel 4, vierde lid, van richtlijn nr. 81/851/ EEG van de Raad van de Europese Unie van 28
    september 1981 betreffende de onderlinge aanpassing van de wetgevingen der lidstaten inzake geneesmiddelen voor
    diergeneeskundig gebruik (PbEG L 317), alsmede op de artikelen 29 en 45 van de Diergeneesmiddelenwet;

    Gezien de adviezen van de Koninklijke Maatschappij voor Diergeneeskunde, het Productschap Diervoeder, de
    Nederlandse vereniging van viskwekers, de Productschappen Vee, Vlees en Eieren en de Vereniging van Fabrikanten en
    de Importeurs van Diergeneesmiddelen In Nederland;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010809/2005-01-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:




              *wet:*


              [Diergeneesmiddelenwet][ref1] ;




              *beschikbaar:*


              geregistreerd en voorhanden op de Nederlandse markt;




              *indicatie:*


              ziekte, ziekteverschijnsel, pijn, verwonding, gebrek of suboptimale prestatie van een dier waarbij de
      noodzaak aanwezig is tot behandeling, of
      het onderkennen van een ziekte of gebrek bij een dier door toepassing van een diergeneesmiddel;




              *bijwerking:*


              reactie die schadelijk en ongewild is en die optreedt bij doses die normaal bij het dier voor preventie,
      voor het stellen van een diagnose, voor de behandeling van een ziekte, of voor de wijziging van een fysiologische
      functie worden gebruikt;




              *ondraaglijk lijden:*


              niet aflatende aandoening of pijn die het dier kennelijk veel ongemak toebrengt;




              *MRL:*


              maximumwaarde voor residuen;




              *Bureau Bijwerkingen Diergeneesmiddelen:*


              Bureau Bijwerkingen Diergeneesmiddelen, Postbus 10, 6700 AA Wageningen;




              *verordening (EEG) nr. 2377/90:*


              [verordening (EEG) nr. 2377/90](31990R2377) van de Raad van de Europese Unie van 26 juni 1990 houdende een
      communautaire procedure tot vaststelling van maximumwaarden voor residuen van genees-middelen voor diergeneeskundig
      gebruik in levensmiddelen van dierlijke oorsprong (PbEG L 224);




              [richtlijn nr. 2001/82/EG](32001L0082):

              [richtlijn nr. 2001/82/EG](32001L0082) van het Europees Parlement en de Raad van de Europese Unie van
      6 november 2001 tot vaststelling van een communautair wetboek betreffende geneesmiddelen voor diergeneeskundig
      gebruik (PbEG L 311).


      [ref1]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0010809/2005-01-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
  - number: '2'
    text: |-
      1 In afwijking van [artikel 2, eerste lid, van de wet][ref1] mogen dierenartsen, indien het niet toepassen
      van diergeneesmiddelen ondraaglijk lijden voor het betrokken dier met zich brengt en voor de toepassing geen
      diergeneesmiddelen beschikbaar zijn de volgende middelen bij een dier of een klein aantal dieren toepassen:

      a. geregistreerde diergeneesmiddelen voor andere diersoorten of indicaties dan in de registratiebeschikking van het
      middel vermeld;

      b. geneesmiddelen die ingevolge de [Wet op de Geneesmiddelenvoorziening][ref2] zijn toegelaten, voor zover geen
      middelen als bedoeld in onderdeel a beschikbaar zijn, of

      c. magistraal bereide diergeneesmiddelen, voor zover geen middelen, als bedoeld in onderdelen a en b beschikbaar
      zijn.

      2

      3 Het is verboden ingevolge het eerste lid middelen toe te passen bij voedselproducerende dieren tenzij de werkzame
      stof of stoffen van het middel voorkomen in voor voedsel-producerende dieren geregistreerde diergeneesmiddelen of
      met betrekking tot de werkzame stof of stoffen op grond van [verordening (EEG) nr. 2377/90](31990R2377) een MRL is
      vastgesteld of op grond van die verordening is vastgesteld dat een MRL niet nodig is.

      4 Voor dieren en producten van dieren waarbij middelen, als bedoeld in het eerste lid, zijn toegepast, geldt een
      wachttermijn van:

      a. 28 dagen voor zover het vlees van pluimvee en zoogdieren, met inbegrip van vet en afval, betreft;

      b. 7 dagen voor zover het melk en eieren betreft;

      c. 500 graaddagen voor zover het visvlees betreft,

      tenzij door de dierenarts op grond van diergeneeskundige inzichten een langere wachttermijn noodzakelijk wordt
      geacht teneinde te garanderen dat de van de behandelende dieren afkomstige producten geen residuen bevatten die
      gevaarlijk zijn voor de consument.

      5 Het eerste lid is niet van toepassing op middelen die niet bij een dier van de betrokken diersoort mogen worden
      toegepast ingevolge het [Besluit verboden stoffen Diergeneesmiddelenwet][ref3]


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
