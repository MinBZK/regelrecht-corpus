  - number: '6'
    text: |-
      1 Onverminderd artikel 3, eerste lid, van de Regeling administratie voorschriften ingevolge de
      [Diergeneesmiddelenwet][ref1] vermelden dierenartsen na het toepassen van een middel ingevolge de
      [artikelen 2][ref2] of [4][ref3], in hun administratie:

      a. de naam en voor zover aanwezig het registratienummer van het middel;

      b. de diersoort;

      c. het aantal behandelde dieren;

      d. de naam en het adres van de houder van het dier;

      e. de indicatie waarvoor het middel wordt toegepast;

      f. de gebruikte hoeveelheid, de dosering en de duur van de behandeling;

      g. de datum waarop het dier is onderzocht alsmede de datum waarop het middel is toegepast;

      h. de aanbevolen wachttermijn;

      i. de diergeneeskundige motivatie voor de toepassing van het middel.

      2 Onverminderd de artikelen 4 en 5 van de regeling, bedoeld in het eerste lid, doen dierenartsen onmiddellijk na
      het toepassen van een middel ingevolge de [artikelen 2][ref4] of [4][ref5] schriftelijk opgave aan degene die
      consumptiedieren houdt van de in het eerste lid bedoelde gegevens.

      3 Voorafgaand aan de toepassing informeren dierenartsen de houder van dieren over de toepassing van middelen in
      afwijking van de in de registratiebeschikking vermelde toepassing en van de mogelijk daaraan verbonden risico’s.

      4 De administratie en de bescheiden die verband houden met de aantekeningen in de administratie worden vijf jaar
      bewaard.


