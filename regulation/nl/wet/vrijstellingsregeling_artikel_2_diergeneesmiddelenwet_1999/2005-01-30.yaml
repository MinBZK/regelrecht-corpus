    text: |-
      1 In afwijking van [artikel 2, eerste lid, van de wet][ref1] mogen dierenartsen de in de
      [artikelen 4, eerste lid][ref2], en [4a, eerste lid][ref3], bedoelde middelen voorhanden of in voorraad hebben met
      het oog op de in dat lid bedoelde toepassing. De voorraad moet in redelijke verhouding staan tot de omvang van het
      dierenbestand van de praktijk van de betreffende dierenarts;

      2 In afwijking van [artikel 2, eerste lid, van de wet][ref4] mogen apothekers middelen, als bedoeld in de
      [artikelen 4, eerste lid][ref5], en [4a, eerste lid][ref6], voorhanden of in voorraad hebben of afleveren aan
      dierenartsen ten behoeve van de in de [artikelen 4][ref7] en [4a][ref8] bedoelde toepassing.


