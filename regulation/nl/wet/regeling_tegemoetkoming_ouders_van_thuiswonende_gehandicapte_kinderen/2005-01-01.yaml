  - number: '5'
    text: De tegemoetkoming voor het kind bedraagt € 199,28 per kalenderkwartaal.
    url: https://wetten.overheid.nl/BWBR0010997/2005-01-01#Artikel5
  - number: '6'
    text: |-
      1 De SVB stelt op aanvraag vast of recht op een tegemoetkoming bestaat.

      2 De aanvraag wordt ingediend door middel van een door de SVB beschikbaar gesteld aanvraagformulier.

      3 De tegemoetkoming kan niet eerder ingaan dan een jaar voorafgaand aan de eerste dag van het kalenderkwartaal
      tijdens welk de aanvraag om een tegemoetkoming werd ingediend. De SVB kan in bijzondere gevallen van de eerste
      zin afwijken.
    url: https://wetten.overheid.nl/BWBR0010997/2005-01-01#Artikel6
  - number: '7'
    text: |-
      1 Om te bepalen of het kind gehandicapt is wint de SVB medisch advies in bij een organisatie waarmee de Minister
      van VWS vooraf heeft ingestemd.

      2 Om te bepalen of het kind nog steeds gehandicapt is kan de SVB opnieuw een medisch advies inwinnen.

      3 Het medisch advies wordt ingewonnen bij een landelijk opererende, onafhankelijke en daartoe deskundige
      organisatie.
    url: https://wetten.overheid.nl/BWBR0010997/2005-01-01#Artikel7
  - number: '8'
    text: |-
      1 De artikelen 14a tot en met 16, 18, eerste, tweede, derde en zevende lid, 19, 19a, 20, 22 tot en met 24, 24a,
      eerste lid, 24b, 30 en 31 van de AKW en de daarop berustende bepalingen zijn van overeenkomstige toepassing op
      een tegemoetkoming.

      2 2. De artikelen 35, derde lid, 38, tweede lid, 46, 47, 48, 49, 52 en hoofdstuk 9 van de Wet SUWI zijn van
      overeenkomstige toepassing bij de uitvoering van deze regeling.
    url: https://wetten.overheid.nl/BWBR0010997/2005-01-01#Artikel8
  - number: 8a
    text: |-
      1 De SVB stelt binnen dertien weken na ontvangst van de aanvraag vast of recht op een tegemoetkoming bestaat.

      2 Indien de SVB niet in staat is tijdig een besluit te nemen, stelt de SVB de aanvrager daarvan in kennis en kan de
      termijn, bedoeld in het eerste lid, met ten hoogste vier weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0010997/2005-01-01#Artikel8a
  - number: '9'
    text: |-
      De SVB kan aan een persoon ten onrechte betaalde tegemoetkoming verrekenen met kinderbijslag waarop de persoon als
      verzekerde voor hetzelfde kind op grond van de [AKW][ref1] aanspraak maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0010997/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '10'
    text: |-
      1 In de middelen tot dekking van de uitgaven verbonden aan deze regeling wordt voorzien door het Rijk.

      2 Jaarlijks zendt de SVB de rapportage en de begroting, bedoeld in artikel 52, eerste lid, van de Wet SUWI tevens
      aan de Minister van VWS.

      3 De SVB beheert en administreert afzonderlijk de middelen, bedoeld in het eerste lid.

      4 Met inachtneming van het vijfde lid brengt de SVB:

      a. de uitgaven voor de tegemoetkomingen en de uitvoeringskosten van de SVB, met uitzondering van de kosten
      verbonden aan het advies, bedoeld in artikel 7, in rekening bij Onze Minister; en

      b. de kosten verbonden aan het advies in rekening bij de Minister van VWS.

      5 Voor de tiende dag van de maand voorafgaande aan het begin van een kalenderkwartaal verstrekt de SVB aan Onze
      Minister onderscheidenlijk de Minister van VWS:

      a. een raming van de uitgaven verbonden aan de uitvoering van deze regeling voor het komende kalenderkwartaal;

      b. een opgave van de werkelijke uitgaven in het vorige kalenderkwartaal.

      6 De ramings- en kostenopgaven, bedoeld in het vijfde lid, worden gespecificeerd naar uitgaven voor
      tegemoetkomingen, kosten verbonden aan het advies, bedoeld in artikel 7, en overige uitvoeringskosten van de SVB,
      eventuele ontvangsten, alsmede het aantal kinderen waarvoor aanspraak wordt gemaakt op een tegemoetkoming.

      7 Op de eerste dag van elk kalenderkwartaal dragen Onze Minister respectievelijk de Minister van VWS de geraamde
      uitgaven over dat kalenderkwartaal verbonden aan de uitvoering van deze regeling af aan de SVB. In bijzondere
      gevallen kan een hoger of een lager voorschot worden verstrekt.

      8 Op de eerste dag van elk kalenderkwartaal verrekenen Onze Minister respectievelijk de Minister van VWS het
      verschil tussen de werkelijke uitgaven en de geraamde uitgaven over het kalenderkwartaal gelegen voor het
      voorafgaande kalenderkwartaal.

      9 Indien de in het zevende en achtste lid bedoelde dag een zaterdag, zondag of een algemeen erkende feestdag
      is, wordt de eerstvolgende dag die niet een zaterdag, zondag of een algemeen erkende feestdag is, in aanmerking
      genomen.

      10 Onze Minister zendt zo spoedig mogelijk na ontvangst van het verslag, bedoeld in artikel 38, tweede lid, dat
      verslag en de jaarrekening en het jaarverslag van de SVB, bedoeld in artikel 49, eerste lid, van de Wet SUWI,
      voorzover deze stukken betrekking hebben op deze regeling, aan de Minister van VWS.

      11 Zo spoedig mogelijk na ontvangst van de jaarrekening vindt een voorlopige afrekening door Onze Minister
      respectievelijk de Minister van VWS met de SVB plaats.

      12 Zo spoedig mogelijk na ontvangst van het verslag, bedoeld in artikel 38, tweede lid van Wet structuur
      uitvoeringsorganisatie werk en inkomen vindt een definitieve afrekening plaats.
    url: https://wetten.overheid.nl/BWBR0010997/2005-01-01#Artikel10
  - number: '11'
    text: |-
      De Regeling tegemoetkoming onderhoudskosten thuiswonende meervoudig en ernstig lichamelijk gehandicapte kinderen
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010997/2005-01-01#Artikel11
  - number: '12'
    text: |-
      De natuurlijke persoon die op de dag voorafgaand aan de inwerkingtreding van deze regeling recht had op een
      tegemoetkoming op grond van de Regeling tegemoetkoming onderhoudskosten thuiswonende meervoudig en ernstig
      lichamelijk gehandicapte kinderen heeft op grond van deze regeling recht op een tegemoetkoming. Tot het moment dat
      het kind niet meer blijvend of voorlopig blijvend gehandicapt is, wordt er, voor de toepassing van de eerste zin,
      van uitgegaan dat het kind dat meervoudig gehandicapt dan wel ernstig lichamelijk gehandicapt of chronisch ziek is
      als bedoeld in artikel 3 en 4 van de Regeling tegemoetkoming onderhoudskosten thuiswonende meervoudig en ernstig
      lichamelijk gehandicapte kinderen, gehandicapt is als bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010997#Artikel3
    url: https://wetten.overheid.nl/BWBR0010997/2005-01-01#Artikel12
    references:
      - id: ref1
