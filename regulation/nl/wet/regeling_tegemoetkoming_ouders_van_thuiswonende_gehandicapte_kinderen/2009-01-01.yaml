  - number: 10b
    text: |-
      1 Met als valutadag de eerste dag van elk kwartaal storten Onze Minister respectievelijk de Minister van VWS op de
      rekening-courant ten name van de SVB bij de Minister van Financiën:

      a. het bedrag van de geraamde tegemoetkomingen in dat kwartaal;

      b. het bedrag van de geraamde kosten, verbonden aan het advies, bedoeld in [artikel 7][ref1], in dat kwartaal;

      c. éénvierde van het bedrag aan geraamde uitvoeringskosten per jaar.

      Onze Minister en de Minister van VWS kunnen, na overleg met de SVB, van het geraamde bedrag afwijken.

      2 Met als valutadag de eerste dag van elk kwartaal verrekent Onze Minister het verschil tussen de gerealiseerde en
      de geraamde tegemoetkomingen over het kwartaal gelegen twee kwartalen voor dat kwartaal met het bedrag, bedoeld in
      het eerste lid, onderdeel a.

      3 Met als valutadag de eerste dag van elk kwartaal verrekent de Minister van VWS het verschil tussen de
      gerealiseerde en de geraamde kosten, verbonden aan het advies, bedoeld in [artikel 7][ref2], over het kwartaal
      gelegen twee kwartalen voor dat kwartaal met het bedrag, bedoeld in het eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0010997#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010997#Artikel7
    url: https://wetten.overheid.nl/BWBR0010997/2009-01-01#Artikel10b
