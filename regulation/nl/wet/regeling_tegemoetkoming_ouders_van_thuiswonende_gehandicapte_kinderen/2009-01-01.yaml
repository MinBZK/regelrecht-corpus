  - number: '5'
    text: De tegemoetkoming voor het kind bedraagt € 211,45 per kwartaal.
    url: https://wetten.overheid.nl/BWBR0010997/2009-01-01#Artikel5
  - number: '6'
    text: |-
      1 De SVB stelt op aanvraag vast of recht op een tegemoetkoming bestaat.

      2 De aanvraag wordt ingediend door middel van een door de SVB beschikbaar gesteld aanvraagformulier.

      3 De tegemoetkoming kan niet eerder ingaan dan een jaar voorafgaand aan de eerste dag van het kwartaal tijdens welk
      de aanvraag om een tegemoetkoming werd ingediend. De SVB kan in bijzondere gevallen van de eerste zin afwijken.
    url: https://wetten.overheid.nl/BWBR0010997/2009-01-01#Artikel6
  - number: '7'
    text: |-
      1 Om te bepalen of het kind gehandicapt is wint de SVB medisch advies in bij een organisatie waarmee de Minister
      van VWS vooraf heeft ingestemd.

      2 Om te bepalen of het kind nog steeds gehandicapt is kan de SVB opnieuw een medisch advies inwinnen.

      3 Het medisch advies wordt ingewonnen bij een landelijk opererende, onafhankelijke en daartoe deskundige
      organisatie.
    url: https://wetten.overheid.nl/BWBR0010997/2009-01-01#Artikel7
  - number: '8'
    text: |-
      1 De [artikelen 14a tot en met 16][ref1], [18, eerste, tweede, derde en zevende lid][ref2], [19][ref3],
      [19a][ref4], [20][ref5], [22 tot en met 24][ref6], [24a, eerste lid][ref7], [24b][ref8], [30][ref9] en
      [31 van de AKW][ref10] en de daarop berustende bepalingen zijn van overeenkomstige toepassing op een
      tegemoetkoming.

      2 De [artikelen 35, zesde lid][ref11], [38, tweede lid][ref12], [46][ref13], [48][ref14], [49][ref15] en
      [hoofdstuk 9 van de Wet SUWI][ref16] en [artikel 121 van de Wet financiering sociale verzekeringen][ref17] zijn van
      overeenkomstige toepassing bij de uitvoering van deze regeling.


