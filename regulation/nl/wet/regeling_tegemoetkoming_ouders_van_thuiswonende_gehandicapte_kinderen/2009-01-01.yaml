    text: |-
      In deze regeling wordt verstaan onder:



            a
             Onze Minister:

              de Minister van Sociale Zaken en Werkgelegenheid;



            b
             Minister van VWS:

              de Minister van Volksgezondheid, Welzijn en Sport;



            c
             AKW:

              [Algemene Kinderbijslagwet][ref1];



            d
             AWBZ:

              [ Algemene Wet Bijzondere Ziektekosten][ref2];



            e
            Wet SUWI:

              [ Wet structuur uitvoeringsorganisatie werk en inkomen][ref3];



            f
            SVB:

              Sociale verzekeringsbank, genoemd in [hoofdstuk 6 van de Wet SUWI][ref4];



            g
             kind:

              het kind, bedoeld in [artikel 2][ref5];



            h
             tegemoetkoming:

              de tegemoetkoming in de onderhoudskosten, bedoeld in [artikel 4][ref6];



            i
             peildag:

              de eerste dag van een kwartaal zijnde 1 januari, 1 april, 1 juli of 1 oktober;



            j
             vreemdeling:

              hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref7];



            k
            valutadag:

              de op de rekening-courantafschriften aangegeven dag van betaling;



            l
            overige posten met betrekking tot de uitvoering van deze regeling:

              de uitgaven en ontvangsten met betrekking tot de interesten en diversen.


