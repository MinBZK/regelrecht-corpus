  - number: 10a
    text: |-
      1 Uiterlijk op de tiende dag van de maand voorafgaande aan het begin van een kwartaal verstrekt de SVB aan Onze
      Minister onderscheidenlijk de Minister van VWS een opgave van:

      a. het totaalbedrag aan geraamde tegemoetkomingen voor het komende kwartaal;

      b. het totaalbedrag aan geraamde kosten, verbonden aan het advies, bedoeld in [artikel 7][ref1], voor het komende
      kwartaal;

      c. het totaalbedrag aan uitbetaalde tegemoetkomingen in het vorige kwartaal;

      d. het totaalbedrag aan gerealiseerde uitgaven, verbonden aan het advies, bedoeld in [artikel 7][ref2], in het
      vorige kwartaal.

      2 Indien de dag, bedoeld in het eerste lid, een zaterdag, zondag of algemeen erkende feestdag is, vindt de
      verstrekking plaats op de eerstvolgende dag die niet een zaterdag, zondag of algemeen erkende feestdag is.

      3 Het bedrag, bedoeld in het eerste lid, onderdeel a, wordt nader gespecificeerd in een bedrag dat betrekking heeft
      op het komende kwartaal en op bedragen die betrekking hebben op daaraan voorafgaande kwartalen. Deze specificatie
      wordt voorzien van de bij de bedragen behorende aantallen tegemoetkomingen.

      4 Het bedrag, bedoeld in het eerste lid, onderdeel c, wordt nader gespecificeerd in een bedrag dat betrekking heeft
      op het vorige kwartaal en in bedragen die betrekking hebben op daaraan voorafgaande kwartalen. Deze specificatie
      wordt voorzien van de bij de bedragen behorende aantallen tegemoetkomingen.

      5 In het jaarplan met begroting verstrekt de SVB elk jaar aan Onze Minister onderscheidenlijk de Minister van VWS
      een opgave van het totaalbedrag aan geraamde uitvoeringskosten op grond van deze regeling in het komende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010997#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010997#Artikel7
    url: https://wetten.overheid.nl/BWBR0010997/2009-01-01#Artikel10a
