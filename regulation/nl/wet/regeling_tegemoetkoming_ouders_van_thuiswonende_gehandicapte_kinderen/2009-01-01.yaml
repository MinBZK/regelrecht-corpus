  - number: 8a
    text: |-
      1 De SVB stelt binnen dertien weken na ontvangst van de aanvraag vast of recht op een tegemoetkoming bestaat.

      2 Indien de SVB niet in staat is tijdig een besluit te nemen, stelt de SVB de aanvrager daarvan in kennis en kan de
      termijn, bedoeld in het eerste lid, met ten hoogste vier weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0010997/2009-01-01#Artikel8a
  - number: '9'
    text: |-
      De SVB kan aan een persoon ten onrechte betaalde tegemoetkoming verrekenen met kinderbijslag waarop de persoon als
      verzekerde voor hetzelfde kind op grond van de [AKW][ref1] aanspraak maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0010997/2009-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '10'
    text: |-
      1 In de middelen tot dekking van de uitgaven verbonden aan deze regeling wordt voorzien door het Rijk.

      2 De SVB beheert en administreert afzonderlijk de middelen, bedoeld in het eerste lid.

      3 Met inachtneming van [artikel 10a][ref1], eerste lid, brengt de SVB:

      a. de uitgaven voor de tegemoetkomingen en de uitvoeringskosten van de SVB, met uitzondering van de kosten
      verbonden aan het advies, bedoeld in [artikel 7][ref2], in rekening bij Onze Minister, en

      b. de kosten verbonden aan het advies, bedoeld in [artikel 7][ref3], in rekening bij de Minister van VWS.


      [ref1]: https://wetten.overheid.nl/BWBR0010997#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0010997#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0010997#Artikel7
