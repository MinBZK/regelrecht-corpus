  - number: 10e
    text: |-
      1 Uiterlijk op 1 juli dient de SVB de afrekening van de tegemoetkomingen, de kosten, verbonden aan het advies,
      bedoeld in [artikel 7][ref1], en de uitvoeringskosten over het afgelopen kalenderjaar bij Onze Minister en de
      Minister van VWS in.

      2 In de afrekening van de tegemoetkomingen, de kosten, verbonden aan het advies, bedoeld in [artikel 7][ref2],
      en de uitvoeringskosten wordt, op basis van de jaarrekening, bedoeld in [artikel 49 van de Wet SUWI][ref3], de
      kasstroom inzichtelijk gemaakt en wordt deze afzonderlijk vermeld voor de uitgaven en overige posten met betrekking
      tot de uitvoering van deze regeling.

      3 Op grond van de afrekening van de tegemoetkomingen, de kosten, verbonden aan het advies, bedoeld in
      [artikel 7][ref4], en de uitvoeringskosten vindt voor 15 augustus een betaling plaats ten gunste of ten laste van
      de SVB.


