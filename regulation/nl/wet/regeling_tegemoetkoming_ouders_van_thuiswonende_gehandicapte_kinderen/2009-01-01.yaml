  - number: '2'
    text: |-
      Kind is de persoon die de leeftijd van 3 jaar maar nog niet van 18 jaar heeft bereikt en die ernstig beperkt is in
      het dagelijks functioneren als gevolg van een ziekte of stoornis van lichamelijke, verstandelijke of geestelijke
      aard waardoor hij blijvend of voorlopig blijvend gehandicapt is.
    url: https://wetten.overheid.nl/BWBR0010997/2009-01-01#Artikel2
  - number: '3'
    text: |-
      In deze regeling wordt als blijvend of voorlopig blijvend gehandicapt aangemerkt het kind dat als gevolg van zijn
      beperkingen:

      a. aanzienlijk meer afhankelijk is van geregelde verzorging of oppassing dan een gezond kind van dezelfde leeftijd;
      en

      b. aanspraak kan maken op opname in een in de [AWBZ][ref1] of in de daarop berustende bepalingen geregelde
      intramurale instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0010997/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '4'
    text: |-
      1 De natuurlijke persoon die hier te lande woont en tot wiens huishouden het kind hier te lande op de peildag
      behoort heeft over dat kwartaal recht op een tegemoetkoming in de onderhoudskosten van dat kind op grond van deze
      regeling.

      2 Waar de natuurlijke persoon woont wordt naar de omstandigheden beoordeeld.

      3 Geen recht op een tegemoetkoming heeft de persoon:

      a. die ten behoeve van het kind een Nederlandse of buitenlandse vergoeding ontvangt die qua doelstelling en hoogte
      vergelijkbaar is met de tegemoetkoming, bedoeld in deze regeling;

      b. in wiens huishouden het kind op commerciële basis is opgenomen.

      4 Geen recht op een tegemoetkoming heeft de vreemdeling die niet rechtmatig in Nederland verblijf houdt in de zin
      van [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref1].

      5 In afwijking van het vierde lid heeft wel recht op een tegemoetkoming de
      vreemdeling die na rechtmatig in Nederland verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref2]:

      a. voor de beëindiging van dit verblijf een aanvraag heeft ingediend om voortgezette toelating; of

      b. binnen de termijn, genoemd in de [artikelen 69, eerste lid, van de Vreemdelingenwet 2000][ref3], of
      buiten die termijn, in geval [artikel 6.11 van de Algemene wet bestuursrecht][ref4] toepassing heeft
      gevonden, bezwaar heeft gemaakt of beroep heeft ingesteld tegen intrekking van de toelating in de zin van
      [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref5].

      6 Het recht op een tegemoetkoming aan de vreemdeling, bedoeld in het vijfde lid, eindigt met ingang van de dag
      waarop:

      a. onherroepelijk voor de vreemdeling negatief op de aanvraag, het bezwaar of het beroep is beslist; of

      b. de uitzetting van de vreemdeling is gelast, tenzij die uitzetting op grond van de [Vreemdelingenwet 2000][ref6]
      of op grond van een rechterlijke beslissing achterwege dient te blijven.


