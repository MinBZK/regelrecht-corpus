  - number: 10f
    text: |-
      Onze Minister stelt jaarlijks voor 31 oktober de omvang van de middelen tot dekking van de uitgaven verbonden aan
      de uitvoering van deze regeling over het afgelopen kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0010997/2009-01-01#Artikel10f
