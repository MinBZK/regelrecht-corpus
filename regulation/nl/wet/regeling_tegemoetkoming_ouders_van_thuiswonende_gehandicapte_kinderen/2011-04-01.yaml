  - number: '10'
    text: |-
      1 In de middelen tot dekking van de uitgaven verbonden aan deze regeling wordt voorzien door het Rijk.

      2 De SVB beheert en administreert afzonderlijk de middelen, bedoeld in het eerste lid.

      3 Met inachtneming van [artikel 10a, eerste lid][ref1], brengt de SVB de uitgaven voor de tegemoetkomingen en de
      uitvoeringskosten van de SVB, in rekening bij de Minister van SZW.


      [ref1]: https://wetten.overheid.nl/BWBR0010997#Artikel10a
    url: https://wetten.overheid.nl/BWBR0010997/2011-04-01#Artikel10
