  - number: 10e
    text: |-
      1 Uiterlijk op 1 juli dient de SVB bij de Minister van SZW over het afgelopen jaar in:

      a. de afrekening van de tegemoetkomingen, bedoeld in [artikel 5][ref1];

      b. de afrekening van de extra tegemoetkomingen, bedoeld in [artikel 5a][ref2];

      c. de afrekening van de uitvoeringskosten.

      2 In de afrekening van de tegemoetkomingen en de uitvoeringskosten wordt, op basis van de jaarrekening, bedoeld in
      [artikel 49 van de Wet SUWI][ref3], de kasstroom inzichtelijk gemaakt en wordt deze afzonderlijk vermeld voor de
      uitgaven en overige posten met betrekking tot de uitvoering van deze regeling.

      3 Op grond van de afrekening van de tegemoetkomingen en de uitvoeringskosten vindt voor 15 augustus een betaling
      plaats ten gunste of ten laste van de SVB.


      [ref1]: https://wetten.overheid.nl/BWBR0010997#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010997#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel49
