  - number: '12'
    text: |-
      1 Tot 1 oktober 2010 wordt onder kind mede verstaan de persoon die de leeftijd van drie jaar maar nog niet die
      van achttien jaar heeft bereikt en ten behoeve van wie over het eerste kwartaal van 2010, op grond van de Regeling
      tegemoetkoming onderhoudskosten thuiswonende gehandicapte kinderen 2000 recht op tegemoetkoming bestond en ten
      behoeve van wie dat recht niet met ingang van 1 april 2010 op grond van genoemde regeling is beëindigd. Voorts
      wordt tot 1 oktober 2010 onder kind verstaan de persoon die de leeftijd van drie jaar maar nog niet die van 18 jaar
      heeft bereikt en ten behoeve van wie in het vierde kwartaal van 2009 of in het eerste kwartaal van 2010 is bepaald
      dat met ingang van 1 april 2010 recht bestaat op een tegemoetkoming op grond van genoemde regeling.

      2 De persoon tot wiens huishouden een kind behoort en ten behoeve van welk kind over het eerste kwartaal van
      2010 recht op tegemoetkoming op grond van de Regeling tegemoetkoming onderhoudskosten thuiswonende gehandicapte
      kinderen 2000 bestond, maar ten behoeve van wie geen recht op tegemoetkoming bestaat over het vierde kwartaal van
      2010 omdat er in dat kwartaal geen indicatiebesluit geldt als bedoeld in [artikel 2][ref1], heeft over het vierde
      kwartaal van 2010 en het eerste kwartaal van 2011 recht op een uitkering die per kwartaal de helft bedraagt van de
      tegemoetkoming, bedoeld in [artikel 5][ref2].

      3 Indien een persoon recht heeft op een uitkering als bedoeld in het tweede lid, en met ingang van 1 januari
      2011 recht heeft op een tegemoetkoming, heeft, in afwijking van het tweede lid, over dat kwartaal geen recht op
      uitkering.

      4 Voor de toepassing van de [paragrafen 3][ref3] en [4][ref4] wordt de uitkering, bedoeld in het tweede lid,
      gelijkgesteld met de tegemoetkoming, bedoeld in [artikel 5][ref5].

      5 [Paragraaf 4][ref6] van deze regeling, zoals die luidde op de dag voor inwerkingtreding van de Regeling van de
      Minister van Sociale Zaken en Werkgelegenheid en de Minister voor Jeugd en Gezin, tot wijziging van de Regeling
      tegemoetkoming onderhoudskosten thuiswonende gehandicapte kinderen 2000 in verband met de wijziging van de
      indicatiestelling en de invoering van een extra tegemoetkoming voor alleenverdieners blijft van toepassing met
      betrekking tot tegemoetkomingen die in 2009 en in het eerste kwartaal van 2010 zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0010997#Artikel2
