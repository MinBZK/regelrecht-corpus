  - number: 8a
    text: >-
      1 De SVB stelt binnen dertien weken na ontvangst van de aanvraag vast of recht op een tegemoetkoming bestaat.


      2 Indien de SVB niet in staat is tijdig een besluit te nemen, stelt de SVB de aanvrager daarvan in kennis en kan de
      termijn, bedoeld in het eerste lid, met ten hoogste vier weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0010997/2011-04-01#Artikel8a
  - number: '9'
    text: |-
      De SVB kan een aan een persoon ten onrechte betaalde tegemoetkoming als bedoeld in de [artikelen 5][ref1] en
      [5a][ref2], verrekenen met een andere tegemoetkoming of met de kinderbijslag die die persoon of een andere persoon
      die tot dat huishouden behoort voor een kind ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0010997#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010997#Artikel5a
    url: https://wetten.overheid.nl/BWBR0010997/2011-04-01#Artikel9
