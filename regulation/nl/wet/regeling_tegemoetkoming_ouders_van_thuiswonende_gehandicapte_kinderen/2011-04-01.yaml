  - number: 10b
    text: |-
      Met als valutadag de eerste dag van elk kwartaal stort de Minister van SZW op de rekening-courant ten name van de
      SVB bij de Minister van Financiën:

      a. een periodiek voorschot op het bedrag, bedoeld in [artikel 10a, eerste lid][ref1];

      b. éénvierde van het bedrag, bedoeld in [artikel 10a, tweede lid][ref2].

      De Minister van SZW kan, na overleg met de SVB, van deze bedragen afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0010997#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0010997#Artikel10a
    url: https://wetten.overheid.nl/BWBR0010997/2011-04-01#Artikel10b
