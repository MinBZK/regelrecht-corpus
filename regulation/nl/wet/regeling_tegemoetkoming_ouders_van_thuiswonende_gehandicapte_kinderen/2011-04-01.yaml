  - number: 10f
    text: >-
      De Minister van SZW stelt jaarlijks voor 31 oktober de omvang van de middelen tot dekking van de uitgaven verbonden
      aan de uitvoering van deze regeling over het afgelopen kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0010997/2011-04-01#Artikel10f
  - number: 10g
    text: |-
      [Artikel 16, eerste lid, van de Algemene Regeling SZW-subsidies][ref1] is niet van toepassing op verstrekking van
      tegemoetkomingen krachtens deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009211#Artikel16
    url: https://wetten.overheid.nl/BWBR0010997/2011-04-01#Artikel10g
