  - number: '2'
    text: |-
      1 Kind is de persoon die de leeftijd van drie jaar maar nog niet die van achttien jaar heeft
      bereikt en die blijkens een geldig indicatiebesluit is aangewezen op tien of meer uren per week
      zorg als bedoeld in de [artikelen 4][ref1], [5][ref2], [6][ref3], [8][ref4], [9][ref5] en
      [13 van het Besluit zorgaanspraken AWBZ][ref6], waarbij voor behandeling, begeleiding, verblijf of voortgezet
      verblijf een dagdeel geldt als 4 uren en een etmaal als 24 uren.

      2 Met een indicatiebesluit als bedoeld in het eerste lid, wordt gelijkgesteld een medisch advies van een door de
      SVB aan te wijzen onafhankelijke en daartoe deskundige organisatie, waaruit blijkt dat een persoon die de leeftijd
      van drie jaar maar nog niet die van achttien jaar heeft bereikt en die in het buitenland woont, een vergelijkbare
      zorgbehoefte heeft als de persoon, bedoeld in het eerste lid.


