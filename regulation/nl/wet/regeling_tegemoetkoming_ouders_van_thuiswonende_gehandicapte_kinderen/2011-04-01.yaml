  - number: '6'
    text: |-
      1 De SVB stelt op aanvraag vast of recht op een tegemoetkoming bestaat.

      2 De aanvraag wordt ingediend door middel van een door de SVB beschikbaar gesteld aanvraagformulier.

      3 De aanvraag wordt ingediend binnen acht weken nadat de SVB het aanvraagformulier aan de aanvrager ter beschikking
      heeft gesteld.

      4 De vaststelling, bedoeld in het eerste lid, geschiedt mede op grond van de door een indicatieorgaan als bedoeld
      in [artikel 9a][ref1], onderscheidenlijk een stichting als bedoeld in [artikel 9b, vierde lid, AWBZ][ref2],
      op grond van artikel 5.18a van het Besluit SUWI aan de SVB verstrekte gegevens. Bij de aanvraag wordt het
      indicatiebesluit, bedoeld in [artikel 2, eerste lid][ref3], slechts overgelegd indien de SVB daarom verzoekt.

      5 Indien de aanvraag niet is ingediend binnen de in het derde lid bedoelde termijn, gaat het recht op
      tegemoetkoming in met ingang van het kwartaal waarin de aanvraag door de SVB is ontvangen. De SVB is bevoegd in
      bijzondere gevallen af te wijken van de eerste zin.

      6 Indien de SVB medisch advies als bedoeld in [artikel 2, tweede lid][ref4], inwint, geschiedt de vaststelling,
      bedoeld in het eerste lid, in afwijking van het vierde lid mede op grond van dit advies. Het derde en vijfde lid
      zijn niet van toepassing.


