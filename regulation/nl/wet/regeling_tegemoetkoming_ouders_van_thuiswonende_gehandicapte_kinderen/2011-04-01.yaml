        artikel: 10a
        paragraaf: '4'
  - number: 10a
    text: |-
      1 Uiterlijk op 1 oktober van elk jaar verstrekt de SVB aan de Minister van SZW, met een uitsplitsing naar kwartaal:

      a. een opgave van het totaalbedrag aan geraamde uitgaven voor de tegemoetkomingen, bedoeld in [artikel 5][ref1], in
      het komende jaar;

      b. een opgave van het totaalbedrag aan geraamde uitgaven voor de extra tegemoetkomingen, bedoeld in
      [artikel 5a][ref2], in het komende jaar.

      2 In het jaarplan met begroting verstrekt de SVB elk jaar aan de Minister van SZW een opgave van het totaalbedrag
      aan geraamde uitvoeringskosten op grond van deze regeling in het komende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010997#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010997#Artikel5a
    url: https://wetten.overheid.nl/BWBR0010997/2011-04-01#Artikel10a
