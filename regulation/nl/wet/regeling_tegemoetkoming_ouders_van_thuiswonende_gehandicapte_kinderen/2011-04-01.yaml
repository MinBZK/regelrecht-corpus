  - number: '11'
    text: |-
      Deze regeling berust mede op de [artikelen 121, tweede lid][ref1], en
      [122 van de Wet financiering sociale verzekeringen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel121
