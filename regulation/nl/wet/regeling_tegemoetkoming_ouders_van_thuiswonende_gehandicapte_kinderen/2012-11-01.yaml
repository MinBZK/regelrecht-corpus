  - number: 12a
    text: |-
      1 De tegemoetkoming die wordt toegekend naar aanleiding van een aanvraag waarbij een verklaring als bedoeld in
      [artikel 2, derde lid][ref1], wordt overgelegd kan, in afwijking van [artikel 6, vijfde lid][ref2], ingaan vanaf de
      eerste dag van het tweede kwartaal 2011.

      2 De aanvraag om een tegemoetkoming waarbij een verklaring als bedoeld in [artikel 2, derde lid][ref3], wordt
      overgelegd en die met terugwerkende kracht betrekking heeft op kwartalen vanaf het tweede kwartaal 2011 wordt
      ingediend voor 1 januari 2013.


