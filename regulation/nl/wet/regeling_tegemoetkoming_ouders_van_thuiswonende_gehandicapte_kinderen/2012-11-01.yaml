  - number: '5'
    text: De tegemoetkoming voor het kind bedraagt € 215,80 per kwartaal.
    url: https://wetten.overheid.nl/BWBR0010997/2012-11-01#Artikel5
  - number: 5a
    text: |-
      1 Indien een persoon:

      a. over de vier kwartalen van een kalenderjaar gerekend vanaf 1 januari 2010 recht heeft gehad op een
      tegemoetkoming, bedoeld in [artikel 5][ref1];

      b. met betrekking tot dat kalenderjaar een partner heeft als bedoeld in
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref2]; en

      c. deze persoon of diens partner in dat kalenderjaar belastbare winst uit een of meer ondernemingen
      als bedoeld in [artikel 3.2 van de Wet inkomstenbelasting 2001][ref3], belastbaar loon als bedoeld in
      [artikel 3.80 van de Wet inkomstenbelasting 2001][ref4] of belastbaar resultaat uit een of meer werkzaamheden
      als bedoeld in [artikel 3.90 van de Wet inkomstenbelasting 2001][ref5] heeft genoten niet meer is dan het bedrag,
      genoemd in [artikel 8.14a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref6];

      heeft deze persoon in aanvulling op de tegemoetkoming, bedoeld in [artikel 5][ref7], recht op een extra
      tegemoetkoming van € 1460 over dat kalenderjaar.

      2 Indien een persoon of diens partner voldoet aan de voorwaarden, bedoeld in het eerste lid, en recht heeft op meer
      dan een tegemoetkoming als bedoeld in [artikel 5][ref8], heeft hij dan wel zijn partner recht op ten hoogste een
      extra tegemoetkoming, bedoeld in het eerste lid.

      3 De SVB betaalt de in het eerste lid bedoelde extra tegemoetkoming zo spoedig mogelijk, doch uiterlijk binnen drie
      maanden na afloop van het kalenderjaar waarover recht op de desbetreffende extra tegemoetkoming bestaat.


