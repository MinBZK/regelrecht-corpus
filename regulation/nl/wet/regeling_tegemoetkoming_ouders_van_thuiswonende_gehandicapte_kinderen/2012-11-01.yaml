  - number: 10e
    text: |-
      1 In de jaarrekening, bedoeld in [artikel 49 van de Wet SUWI][ref1], worden de baten en lasten, alsmede de
      ontvangen voorschotten, bedoeld in [artikel 10b, eerste lid][ref2], uitgesplitst naar tegemoetkomingen als bedoeld
      in [artikel 5][ref3], en extra tegemoetkomingen als bedoeld in [artikel 5a][ref4] en uitvoeringskosten, met
      betrekking tot deze regeling opgenomen.

      2 Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref5], rekent de Minister van SZW de baten
      en lasten, alsmede de ontvangen voorschotten, met betrekking tot het desbetreffende kalenderjaar af, met als
      valutadatum 1 juni van het hierop volgende kalenderjaar.


