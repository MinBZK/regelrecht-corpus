  - number: 10b
    text: |-
      1 De Minister van SZW stort op de rekening-courant, bedoeld in
      [artikel 5.16, onderdeel a, van de Regeling Wfsv][ref1], een periodiek voorschot op het bedrag, bedoeld in
      [artikel 10a][ref2], van:

      a. geraamde uitkeringslasten met als valutadatum de eerste dag van elke maand, en

      b. 1/12de deel van de geraamde uitvoeringskosten met als valutadatum de vijftiende dag van elke maand.

      2 De Minister van SZW kan, na overleg met de SVB, van de in het eerste lid, onderdelen a en b, bedoelde bedragen
      afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5.16
      [ref2]: https://wetten.overheid.nl/BWBR0010997#Artikel10a
