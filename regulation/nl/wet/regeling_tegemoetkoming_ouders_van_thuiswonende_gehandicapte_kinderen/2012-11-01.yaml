  - number: '6'
    text: |-
      1 De SVB stelt op aanvraag vast of recht op een tegemoetkoming bestaat.

      2 De aanvraag wordt ingediend door middel van een door de SVB beschikbaar gesteld aanvraagformulier.

      3 Bij de aanvraag wordt het indicatiebesluit, bedoeld in [artikel 2, eerste lid][ref1], overgelegd, tenzij de SVB
      het medisch advies, bedoeld in artikel 2, tweede lid, inwint.

      4 De vaststelling, bedoeld in het eerste lid, geschiedt mede op grond van de door een indicatieorgaan
      als bedoeld in [artikel 9a van de AWBZ][ref2], onderscheidenlijk een stichting als bedoeld in
      [artikel 9b, vierde lid, van de AWBZ][ref3], aan de SVB verstrekte gegevens, indien dat wettelijk is toegestaan. In
      dat geval wordt bij de aanvraag het indicatiebesluit, bedoeld in [artikel 2, eerste lid][ref4], overgelegd indien
      de SVB daarom verzoekt.

      5 De tegemoetkoming, bedoeld in [artikel 5][ref5], kan niet eerder ingaan dan de eerste dag van het kwartaal
      tijdens welk de aanvraag om een tegemoetkoming werd ingediend. De SVB is bevoegd in bijzondere gevallen van de
      eerste zin af te wijken.

      6 Indien de SVB medisch advies als bedoeld in [artikel 2, tweede lid][ref6], inwint, geschiedt de vaststelling,
      bedoeld in het eerste lid, in afwijking van het vierde lid mede op grond van dit advies. Het derde en vijfde lid
      zijn niet van toepassing.

      7 De aanvraag om de extra tegemoetkoming wordt ingediend voor 1 december van het kalenderjaar na het kalenderjaar
      waarover recht op de extra tegemoetkoming bestaat.


