preamble:
  text: |-
    Gelet op artikel 3, eerste lid, juncto artikel 9 Kaderwet SZW-subsidies en de artikelen 25, eerste lid, onderdeel
    f, 28, vijfde lid, en 86 van de Organisatiewet sociale verzekeringen 1997.

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010997/2012-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *AKW:* [Algemene Kinderbijslagwet][ref1];
        - *AWBZ:* [Algemene Wet Bijzondere Ziektekosten][ref2];
        - *indicatiebesluit:* een besluit van een indicatieorgaan als bedoeld in [artikel 9a van de AWBZ][ref3],
      onderscheidenlijk van de stichting, bedoeld in [artikel 9b, vierde lid, van de AWBZ][ref4], waarbij beoordeeld
      wordt of en in welke omvang een zorgvrager, ten behoeve van wie een aanvraag om een indicatiebesluit is ingediend,
      is aangewezen op een of meer vormen van zorg als bedoeld in [artikel 2 van het Zorgindicatiebesluit][ref5],
      onderscheidenlijk [artikel 9, onderdeel a, van het Uitvoeringsbesluit Wet op de jeugdzorg][ref6];
        - *kind:* het kind, bedoeld in [artikel 2][ref7];
        - *Minister van SZW:* Minister van Sociale Zaken en Werkgelegenheid;
        - *overige posten met betrekking tot de uitvoering van deze regeling:* de uitgaven en ontvangsten met betrekking
      tot de interesten en ontvangsten;
        - *peildag:* de eerste dag van een kwartaal zijnde 1 januari, 1 april, 1 juli of 1 oktober;
        - *SVB:* Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet Structuur uitvoeringsorganisatie werk en inkomen][ref8];
        - *valutadag:* de op de rekening-courantafschriften aangegeven dag van betaling;
        - *vreemdeling:* hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref9];
        - *Wet Suwi:* [Wet structuur uitvoeringsorganisatie werk en inkomen][ref10].


