        artikel: 10a
        paragraaf: '4'
  - number: 10a
    text: |-
      1 Voor 1 oktober van elk jaar verstrekt de SVB aan de Minister van SZW in het jaarplan met begroting een opgave
      van het totaalbedrag aan de voor het komende jaar geraamde baten en lasten met betrekking tot deze regeling,
      uitgesplitst naar uitkeringslasten per maand en uitvoeringskosten per jaar.

      2 De uitkeringslasten in de opgave, bedoeld in het eerste lid, worden gespecificeerd naar tegemoetkomingen als
      bedoeld in [artikel 5][ref1], en extra tegemoetkomingen als bedoeld in [artikel 5a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010997#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010997#Artikel5a
