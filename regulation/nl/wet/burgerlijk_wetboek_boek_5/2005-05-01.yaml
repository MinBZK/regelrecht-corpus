bwb_id: BWBR0005288
url: https://wetten.overheid.nl/BWBR0005288/2005-05-01
articles:
  - number: '1.1'
    text: Eigendom is het meest omvattende recht dat een persoon op een zaak kan hebben.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel1
  - number: '1.2'
    text: |-
      Het staat de eigenaar met uitsluiting van een ieder vrij van de zaak gebruik te maken, mits dit gebruik niet
      strijdt met rechten van anderen en de op wettelijke voorschriften en regels van ongeschreven recht gegronde
      beperkingen daarbij in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel1
  - number: '1.3'
    text: De eigenaar van de zaak wordt, behoudens rechten van anderen, eigenaar van de afgescheiden vruchten.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel1
  - number: '2'
    text: De eigenaar van een zaak is bevoegd haar van een ieder die haar zonder recht houdt, op te eisen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel2
  - number: '3'
    text: Voor zover de wet niet anders bepaalt, is de eigenaar van een zaak eigenaar van al haar bestanddelen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel3
  - number: '4'
    text: Hij die een aan niemand toebehorende roerende zaak in bezit neemt, verkrijgt daarvan de eigendom.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel4
  - number: '5.1'
    text: 'Hij die een onbeheerde zaak vindt en onder zich neemt, is verplicht:'
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel5
  - number: 5.1.a
    text: |-
      met bekwame spoed overeenkomstig lid 2, eerste zin, van de vondst aangifte te doen, tenzij hij terstond na
      de vondst daarvan mededeling heeft gedaan aan degene die hij als eigenaar of als tot ontvangst bevoegd mocht
      beschouwen;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel5
  - number: 5.1.b
    text: |-
      met bekwame spoed tevens overeenkomstig lid 2, tweede zin, mededeling van de vondst te doen, indien deze is gedaan
      in een woning, een gebouw of een vervoermiddel, tenzij hij krachtens het bepaalde onder *a*, slot ook niet tot
      aangifte verplicht was;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel5
  - number: 5.1.c
    text: de zaak in bewaring te geven aan de gemeente die dit vordert.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel5
  - number: '5.2'
    text: |-
      De in lid 1 onder *a* bedoelde aangifte kan in iedere gemeente worden gedaan bij de daartoe aangewezen ambtenaar.
      De in lid 1 onder *b* bedoelde mededeling geschiedt bij degene die de woning bewoont of het gebouw of vervoermiddel
      in gebruik of exploitatie heeft, dan wel bij degene die daar voor hem toezicht houdt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel5
  - number: '5.3'
    text: |-
      De vinder is te allen tijde bevoegd de zaak aan enige gemeente in bewaring te geven. Zolang hij dit niet doet, is
      hij verplicht zelf voor bewaring en onderhoud zorg te dragen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel5
  - number: '5.4'
    text: |-
      De vinder kan van de in lid 2, eerste zin, bedoelde ambtenaar een bewijs van aangifte of van inbewaringgeving
      verlangen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel5
  - number: '6.1'
    text: |-
      De vinder die aan de hem in [artikel 5 lid 1][ref1] gestelde eisen heeft voldaan, verkrijgt de eigendom van de zaak
      één jaar na de in [artikel 5 lid 1 onder ][ref2] bedoelde aangifte of mededeling, mits de zaak zich op dat tijdstip
      nog bevindt in de macht van de vinder of van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel5
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '5'
  - number: '6.2'
    text: |-
      Is de zaak anders dan op haar vordering aan de gemeente in bewaring gegeven en valt zij onder de niet-kostbare
      zaken, aangewezen bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 12 onder ][ref1],
      dan is lid 1 niet van toepassing en is de burgemeester drie maanden na de inbewaringgeving bevoegd de zaak voor
      rekening van de gemeente te verkopen of haar om niet aan een derde over te dragen of te vernietigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel12
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '12'
  - number: '6.3'
    text: |-
      Is de zaak in bewaring gegeven aan de gemeente en is noch lid 1, noch lid 2 van toepassing, dan is de burgemeester
      één jaar na de inbewaringgeving bevoegd de zaak voor rekening van de gemeente te verkopen of haar om niet aan een
      derde over te dragen of te vernietigen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel6
  - number: '6.4'
    text: |-
      De vorige leden gelden niet, wanneer de eigenaar of een ander die tot ontvangst van de zaak bevoegd is, zich
      daartoe heeft aangemeld bij degene die de zaak in bewaring heeft vóórdat de toepasselijke termijn is verstreken of,
      in de gevallen van de leden 2 en 3, op een tijdstip na het verstrijken van de termijn, waarop de gemeente de zaak
      redelijkerwijs nog te zijner beschikking kan stellen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel6
  - number: '7'
    text: |-
      De vinder kan, door de zaak onverwijld af te geven aan de bewoner van de woning of de gebruiker of exploitant van
      de ruimte waar de vondst is gedaan, dan wel aan degene die daar voor hem toezicht houdt, zijn rechtspositie met
      alle daaraan verbonden verplichtingen doen overgaan op die bewoner, gebruiker of exploitant met dien verstande dat
      geen recht op beloning bestaat.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel7
  - number: '8.1'
    text: |-
      Indien een aan de gemeente in bewaring gegeven zaak aan snel tenietgaan of achteruitgang onderhevig is of wegens de
      onevenredig hoge kosten of ander nadeel de bewaring daarvan niet langer van de gemeente kan worden gevergd, is de
      burgemeester bevoegd haar te verkopen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel8
  - number: '8.2'
    text: |-
      Indien de zaak zich niet voor verkoop leent, is de burgemeester bevoegd haar om niet aan een derde in eigendom over
      te dragen of te vernietigen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel8
  - number: '8.3'
    text: |-
      Indien de gevonden zaak een dier is, is de burgemeester na verloop van twee weken, nadat het dier door de gemeente
      in bewaring is genomen, bevoegd het zo mogelijk tegen betaling van een koopprijs, en anders om niet, aan een derde
      in eigendom over te dragen. Mocht ook dit laatste zijn uitgesloten, dan is de burgemeester bevoegd het dier te doen
      afmaken. De termijn van twee weken behoeft niet te worden in acht genomen, indien het dier slechts met onevenredig
      hoge kosten gedurende dat tijdvak kan worden bewaard, of afmaking om geneeskundige redenen vereist is.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel8
  - number: '8.4'
    text: De opbrengst treedt in de plaats van de zaak.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel8
  - number: '9'
    text: |-
      Bestaat de aan de gemeente in bewaring gegeven zaak in geld, dan is de gemeente slechts verplicht aan degene die
      haar kan opeisen, een gelijk bedrag uit te keren, en vervalt deze verplichting zodra de burgemeester tot verkoop
      voor rekening van de gemeente bevoegd zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel9
  - number: '10.1'
    text: |-
      Hij die de zaak opeist van de gemeente of van de vinder die aan de hem in [artikel 5 lid 1][ref1] gestelde eisen
      heeft voldaan, is verplicht de kosten van bewaring en onderhoud en tot opsporing van de eigenaar of een andere
      tot ontvangst bevoegde te vergoeden. De gemeente of de vinder is bevoegd de afgifte op te schorten totdat deze
      verplichting is nagekomen. Indien degene die de zaak opeist, de verschuldigde kosten niet binnen een maand nadat ze
      hem zijn opgegeven, heeft voldaan, wordt hij geacht zijn recht op de zaak te hebben prijsgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel5
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '5'
  - number: '10.2'
    text: |-
      De vinder die aan de op hem rustende verplichtingen heeft voldaan, heeft naar omstandigheden recht op een redelijke
      beloning.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel10
  - number: '11'
    text: |-
      Indien een vinder die op grond van [artikel 6 lid 1][ref1] eigenaar is geworden van een aan de gemeente in
      bewaring gegeven zaak, zich niet binnen één maand na zijn verkrijging bij de gemeente heeft aangemeld om de zaak in
      ontvangst te nemen, is de burgemeester bevoegd de zaak voor rekening van de gemeente te verkopen, om niet aan een
      derde over te dragen of te vernietigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel6
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '6'
  - number: '12'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen:'
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel12
  - number: 12.a
    text: |-
      nadere regels worden gesteld omtrent de uitoefening van de uit de [artikelen 5-11][ref1] voor de gemeenten
      voortvloeiende bevoegdheden;


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel5
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '5'
  - number: 12.b
    text: |-
      groepen van niet-kostbare zaken worden aangewezen, waarvoor [artikel 6 lid 2][ref1] geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel6
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '6'
  - number: 12.c
    text: |-
      nadere regels worden gesteld omtrent de aanwijzing van bepaalde soorten personen en instellingen, waarbij deze,
      geheel of gedeeltelijk en al dan niet onder nadere voorwaarden, worden vrijgesteld van de aangifteplicht van
      [artikel 5 lid 1 onder ][ref1] of voor de afwikkeling van vondsten worden gelijkgesteld met een gemeente;


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel5
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '5'
  - number: 12.d
    text: |-
      voor de afwikkeling van vondsten door personen of instellingen als bedoeld onder *c* groepen van niet afgehaalde
      zaken met gevonden zaken worden gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel12
  - number: '13.1'
    text: |-
      Een schat komt voor gelijke delen toe aan degene die hem ontdekt, en aan de eigenaar van de onroerende of roerende
      zaak, waarin de schat wordt aangetroffen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel13
  - number: '13.2'
    text: |-
      Een schat is een zaak van waarde, die zolang verborgen is geweest dat daardoor de eigenaar niet meer kan worden
      opgespoord.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel13
  - number: '13.3'
    text: |-
      De ontdekker is verplicht van zijn vondst aangifte te doen overeenkomstig [artikel 5 lid 1 onder ][ref1]
      Indien geen aangifte is gedaan of onzeker is aan wie de zaak toekomt, kan de gemeente overeenkomstig
      [artikel 5 lid 1 onder ][ref2] vorderen dat deze aan haar in bewaring wordt gegeven, totdat vaststaat wie
      rechthebbende is.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel5
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '5'
  - number: '14.1'
    text: |-
      De eigendom van een roerende zaak die een bestanddeel wordt van een andere roerende zaak die als hoofdzaak is aan
      te merken, gaat over aan de eigenaar van deze hoofdzaak.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel14
  - number: '14.2'
    text: |-
      Indien geen der zaken als hoofdzaak is aan te merken en zij toebehoren aan verschillende eigenaars, worden deze
      mede-eigenaars van de nieuwe zaak, ieder voor een aandeel evenredig aan de waarde van de zaak.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel14
  - number: '14.3'
    text: |-
      Als hoofdzaak is aan te merken de zaak waarvan de waarde die van de andere zaak aanmerkelijk overtreft of die
      volgens verkeersopvatting als zodanig wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel14
  - number: '15'
    text: |-
      Worden roerende zaken die aan verschillende eigenaars toebehoren door vermenging tot één zaak verenigd, dan is het
      vorige artikel van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel15
  - number: '16.1'
    text: |-
      Indien iemand uit een of meer roerende zaken een nieuwe zaak vormt, wordt deze eigendom van de eigenaar van de
      oorspronkelijke zaken. Behoorden deze toe aan verschillende eigenaars, dan zijn de vorige twee artikelen van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel16
  - number: '16.2'
    text: |-
      Indien iemand voor zichzelf een zaak vormt of doet vormen uit of mede uit een of meer hem niet toebehorende
      roerende zaken, wordt hij eigenaar van de nieuwe zaak, tenzij de kosten van de vorming dit wegens hun geringe
      omvang niet rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel16
  - number: '16.3'
    text: |-
      Bij het verwerken van stoffen tot een nieuwe stof of het kweken van planten zijn de vorige leden van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel16
  - number: '17'
    text: |-
      Degene die krachtens zijn genotsrecht op een zaak gerechtigd is tot de vruchten daarvan, verkrijgt de eigendom der
      vruchten door haar afscheiding.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel17
  - number: '18'
    text: |-
      De eigendom van een roerende zaak wordt verloren, wanneer de eigenaar het bezit prijsgeeft met het oogmerk om zich
      van de eigendom te ontdoen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel18
  - number: '19.1'
    text: |-
      De eigenaar van tamme dieren verliest daarvan de eigendom, wanneer zij, nadat zij uit zijn macht zijn gekomen,
      zijn verwilderd.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel19
  - number: '19.2'
    text: |-
      De eigenaar van andere dieren verliest daarvan de eigendom, wanneer zij de vrijheid verkrijgen en de eigenaar niet
      terstond beproeft ze weder te vangen of zijn pogingen daartoe staakt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel19
  - number: '20'
    text: 'De eigendom van de grond omvat, voor zover de wet niet anders bepaalt:'
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel20
  - number: 20.a
    text: de bovengrond;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel20
  - number: 20.b
    text: de daaronder zich bevindende aardlagen;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel20
  - number: 20.c
    text: het grondwater dat door een bron, put of pomp aan de oppervlakte is gekomen;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel20
  - number: 20.d
    text: het water dat zich op de grond bevindt en niet in open gemeenschap met water op eens anders erf staat;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel20
  - number: 20.e
    text: |-
      gebouwen en werken die duurzaam met de grond zijn verenigd, hetzij rechtstreeks, hetzij door vereniging met andere
      gebouwen en werken, voor zover ze geen bestanddeel zijn van eens anders onroerende zaak;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel20
  - number: 20.f
    text: met de grond verenigde beplantingen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel20
  - number: '21.1'
    text: |-
      De bevoegdheid van de eigenaar van de grond om deze te gebruiken, omvat de bevoegdheid tot gebruik van de ruimte
      boven en onder de oppervlakte.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel21
  - number: '21.2'
    text: |-
      Het gebruik van de ruimte boven en onder de oppervlakte is aan anderen toegestaan, indien dit zo hoog boven of zo
      diep onder de oppervlakte plaats vindt, dat de eigenaar geen belang heeft zich daartegen te verzetten.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel21
  - number: '21.3'
    text: De vorige leden zijn niet van toepassing op de bevoegdheid tot vliegen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel21
  - number: '22'
    text: |-
      Wanneer een erf niet is afgesloten, mag ieder er zich op begeven, tenzij de eigenaar schade of hinder hiervan kan
      ondervinden of op duidelijke wijze kenbaar heeft gemaakt, dat het verboden is zonder zijn toestemming zich op het
      erf te bevinden, een en ander onverminderd hetgeen omtrent openbare wegen is bepaald.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel22
  - number: '23.1'
    text: |-
      Is een voorwerp of een dier anders dan door opzet of grove nalatigheid van de eigenaar op de grond van een ander
      terecht gekomen, dan moet de eigenaar van de grond hem op zijn verzoek toestaan het voorwerp of het dier op te
      sporen en weg te voeren.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel23
  - number: '23.2'
    text: |-
      De bij de opsporing en wegvoering aangerichte schade moet door de eigenaar van het voorwerp of het dier aan de
      eigenaar van de grond worden vergoed. Voor deze vordering heeft laatstgenoemde een retentierecht op het voorwerp of
      het dier.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel23
  - number: '24'
    text: Aan de Staat behoren onroerende zaken die geen andere eigenaar hebben.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel24
  - number: '25'
    text: De bodem van de territoriale zee en van de Waddenzee is eigendom van de Staat.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel25
  - number: '26'
    text: De stranden der zee tot aan de duinvoet worden vermoed eigendom van de Staat te zijn.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel26
  - number: '27.1'
    text: De grond waarop zich openbare vaarwateren bevinden, wordt vermoed eigendom van de Staat te zijn.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel27
  - number: '27.2'
    text: 'Dit vermoeden werkt niet tegenover een openbaar lichaam:'
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel27
  - number: 27.2.a
    text: dat die wateren onderhoudt en het onderhoud niet van de Staat heeft overgenomen;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel27
  - number: 27.2.b
    text: |-
      dat die wateren onderhield en waarvan dit onderhoud door de Staat of door een ander openbaar lichaam is
      overgenomen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel27
  - number: '28.1'
    text: |-
      Onroerende zaken die openbaar zijn, met uitzondering van de stranden der zee, worden, wanneer zij door een openbaar
      lichaam worden onderhouden, vermoed eigendom van dat openbare lichaam te zijn.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel28
  - number: '28.2'
    text: Dit vermoeden werkt niet tegenover hem aan wie het onderhoud is overgenomen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel28
  - number: '29'
    text: |-
      De grens van een langs een water liggend erf verplaatst zich met de oeverlijn, behalve in geval van opzettelijke
      drooglegging of tijdelijke overstroming. Een overstroming is niet tijdelijk, indien tien jaren na de overstroming
      het land nog door het water wordt overspoeld en de drooglegging niet is begonnen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel29
  - number: '30.1'
    text: |-
      Een verplaatsing van de oeverlijn wijzigt de grens niet meer, nadat deze is vastgelegd, hetzij door de eigenaars
      van land en water overeenkomstig [artikel 31][ref1], hetzij door de rechter op vordering van een hunner tegen de
      ander overeenkomstig [artikel 32][ref2]. De vastlegging geldt jegens een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel32
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '32'
  - number: '30.2'
    text: |-
      Indien bij de vastlegging in plaats van de werkelijke eigenaar van een erf iemand die als zodanig in de openbare
      registers was ingeschreven, partij is geweest, is niettemin het vorige lid van toepassing, tenzij de werkelijke
      eigenaar tegen inschrijving van de akte of het vonnis verzet heeft gedaan voordat zij is geschied.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel30
  - number: '31.1'
    text: |-
      De vastlegging van de grens door de eigenaars van land en water geschiedt bij een daartoe bestemde notariële akte,
      binnen veertien dagen gevolgd door de inschrijving daarvan in de openbare registers.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel31
  - number: '31.2'
    text: |-
      De bewaarder der registers is bevoegd van de inschrijving kennis te geven aan ieder die als rechthebbende of
      beslaglegger op een der erven staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel31
  - number: '31.3'
    text: |-
      Voor zover de in de akte beschreven grens van de toenmalige oeverlijn afwijkt, kan een derde die op het ogenblik
      van de inschrijving een recht op een der erven heeft, daarvan huurder of pachter is of daarop een beslag heeft doen
      inschrijven, de toenmalige oeverlijn als vastgelegde grens aanmerken.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel31
  - number: '32.1'
    text: |-
      Een vordering tot vastlegging van de grens wordt slechts toegewezen, indien de instelling ervan in de openbare
      registers is ingeschreven en allen die toen als rechthebbende of beslaglegger op een der erven stonden
      ingeschreven, tijdig in het geding zijn geroepen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel32
  - number: '32.2'
    text: |-
      De rechter bepaalt de grens overeenkomstig de oeverlijn op het tijdstip van de inschrijving van de vordering.
      Alvorens de eis toe te wijzen, kan hij de maatregelen bevelen en de bewijsopdrachten doen, die hij in het belang
      van niet-verschenen belanghebbenden nuttig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel32
  - number: '32.3'
    text: De kosten van de vordering komen ten laste van de eiser.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel32
  - number: '32.4'
    text: |-
      Verzet, hoger beroep en cassatie moeten op straffe van niet-ontvankelijkheid binnen acht
      dagen na het instellen van het rechtsmiddel worden ingeschreven in de registers, bedoeld
      in [artikel 433 van het Wetboek van Burgerlijke Rechtsvordering][ref1]. In afwijking van
      [artikel 143 van dat wetboek][ref2] begint de verzettermijn te lopen vanaf de betekening van het vonnis aan
      de ingeschrevene, ook als de betekening niet aan hem in persoon geschiedt, tenzij de rechter hiertoe nadere
      maatregelen heeft bevolen en aan dat bevel niet is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel433
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel143
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '433'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '143'
  - number: '32.5'
    text: |-
      De vastlegging treedt in op het tijdstip dat het vonnis waarbij de vordering is toegewezen, in de openbare
      registers wordt ingeschreven. Deze inschrijving geschiedt niet voordat het vonnis in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel32
  - number: '33.1'
    text: |-
      Verplaatst zich, nadat de grens is vastgelegd, de oeverlijn van een openbaar water landinwaarts, dan moet de
      eigenaar van het overspoelde erf het gebruik van het water overeenkomstig de bestemming dulden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel33
  - number: '33.2'
    text: |-
      Verplaatst zich, nadat de grens is vastgelegd, de oeverlijn van een water dat de eigenaar van het aanliggende erf
      voor enig doel mag gebruiken, in de richting van het water, dan kan de eigenaar van dat erf vorderen dat hem op de
      drooggekomen grond een of meer erfdienstbaarheden worden verleend, waardoor hij zijn bevoegdheden ten aanzien van
      het water kan blijven uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel33
  - number: '33.3'
    text: |-
      Het vorige lid is van overeenkomstige toepassing ten behoeve van hem die het water voor enig doel mag gebruiken en
      daartoe een erfdienstbaarheid op het aan het water liggende erf heeft.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel33
  - number: '33.4'
    text: |-
      In geval van grensvastlegging overeenkomstig [artikel 32][ref1] zijn de vorige leden reeds van toepassing, wanneer
      de oeverlijn zich na de inschrijving van de vordering verplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel32
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '32'
  - number: '34'
    text: |-
      De oeverlijn in de zin van de vorige vijf artikelen wordt bepaald door de normale waterstand, of, bij wateren
      waarvan het peil periodiek wisselt, door de normale hoogwaterstand. Grond, met andere dan gewoonlijk in het water
      levende planten begroeid, wordt echter gerekend aan de landzijde van de oeverlijn te liggen, ook al wordt die grond
      bij hoogwater overstroomd.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel34
  - number: '35.1'
    text: |-
      Nieuw duin dat zich op het strand vormt, behoort aan de eigenaar van het aan het strand grenzende duin, wanneer
      beide duinen een geheel zijn geworden, zodanig dat zij niet meer van elkander kunnen worden onderscheiden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel35
  - number: '35.2'
    text: Daarentegen verliest deze eigenaar de grond welke door afneming van het duin deel van het strand wordt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel35
  - number: '35.3'
    text: |-
      Uitbreiding of afneming van een duin als bedoeld in de leden 1 en 2 brengt geen wijziging meer in de eigendom nadat
      de grens is vastgesteld, hetzij door de eigenaars van strand en duin, hetzij door de rechter op vordering van een
      hunner tegen de ander. De[ artikelen 30-32][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel30
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '30'
  - number: '35.4'
    text: Buiten het geval van de leden 1 en 2 brengt uitbreiding of afneming van een duin geen wijziging in de eigendom.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel35
  - number: '36'
    text: |-
      Dient een muur, hek, heg of greppel, dan wel een niet bevaarbaar stromend water, een sloot, gracht of dergelijke
      watergang als afscheiding van twee erven, dan wordt het midden van deze afscheiding vermoed de grens tussen deze
      erven te zijn. Dit vermoeden geldt niet, indien een muur slechts aan één zijde een gebouw of werk steunt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel36
  - number: '37'
    text: |-
      De eigenaar van een erf mag niet in een mate of op een wijze die volgens [artikel 162 van Boek 6][ref1]
      onrechtmatig is, aan eigenaars van andere erven hinder toebrengen zoals door het verspreiden van rumoer,
      trillingen, stank, rook of gassen, door het onthouden van licht of lucht of door het ontnemen van steun.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel162
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '162'
  - number: '38'
    text: Lagere erven moeten het water ontvangen dat van hoger gelegen erven van nature afloopt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel38
  - number: '39'
    text: |-
      De eigenaar van een erf mag niet in een mate of op een wijze die volgens [artikel 162 van Boek 6][ref1]
      onrechtmatig is, aan eigenaars van andere erven hinder toebrengen door wijziging te brengen in de loop, hoeveelheid
      of hoedanigheid van over zijn erf stromend water of van het grondwater, dan wel door gebruik van water dat zich op
      zijn erf bevindt en in open gemeenschap staat met het water op eens anders erf.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel162
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '162'
  - number: '40.1'
    text: |-
      De eigenaar van een erf dat aan een openbaar of stromend water grenst, mag van het water gebruik maken tot
      bespoeling, tot drenking van vee of tot andere dergelijke doeleinden, mits hij daardoor aan eigenaars van andere
      erven geen hinder toebrengt in een mate of op een wijze die volgens [artikel 162 van Boek 6][ref1] onrechtmatig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel162
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '162'
  - number: '40.2'
    text: |-
      Betreft het een openbaar water, dan is het vorige lid slechts van toepassing voor zover de bestemming van het water
      zich er niet tegen verzet.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel40
  - number: '41'
    text: |-
      Van de [artikelen 38][ref1], [39][ref2] en [40 lid 1][ref3] kan bij verordening worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel40
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '39'
      - id: ref3
        bwb_id: BWBR0005288
        artikel: '40'
  - number: '42.1'
    text: |-
      Het is niet geoorloofd binnen de in lid 2 bepaalde afstand van de grenslijn van eens anders erf bomen, heesters of
      heggen te hebben, tenzij de eigenaar daartoe toestemming heeft gegeven of dat erf een openbare weg of een openbaar
      water is.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel42
  - number: '42.2'
    text: |-
      De in lid 1 bedoelde afstand bedraagt voor bomen twee meter te rekenen vanaf het midden van de voet van de boom
      en voor de heesters en heggen een halve meter, tenzij ingevolge een verordening of een plaatselijke gewoonte een
      kleinere afstand is toegelaten.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel42
  - number: '42.3'
    text: |-
      De nabuur kan zich niet verzetten tegen de aanwezigheid van bomen, heesters of heggen die niet hoger reiken dan de
      scheidsmuur tussen de erven.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel42
  - number: '42.4'
    text: |-
      Ter zake van een volgens dit artikel ongeoorloofde toestand is slechts vergoeding verschuldigd van de schade,
      ontstaan na het tijdstip waartegen tot opheffing van die toestand is aangemaand.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel42
  - number: '43'
    text: |-
      Onder muur wordt in deze en de volgende titel verstaan iedere van steen, hout of andere daartoe geschikte stof
      vervaardigde, ondoorzichtige afsluiting.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel43
  - number: '44.1'
    text: |-
      Indien een nabuur wiens beplantingen over eens anders erf heenhangen, ondanks aanmaning van de eigenaar van dit
      erf, nalaat het overhangende te verwijderen, kan laatstgenoemde eigenaar eigenmachtig het overhangende wegsnijden
      en zich toeëigenen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel44
  - number: '44.2'
    text: |-
      Degene op wiens erf wortels van een ander erf doorschieten, mag deze voor zover ze doorgeschoten zijn weghakken en
      zich toeëigenen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel44
  - number: '45'
    text: |-
      Vruchten die van de bomen van een erf op een naburig erf vallen, behoren aan hem wie de vruchten van dit laatste
      erf toekomen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel45
  - number: '46'
    text: |-
      De eigenaar van een erf kan te allen tijde van de eigenaar van het aangrenzende erf vorderen dat op de grens van
      hun erven behoorlijk waarneembare afpalingstekens gesteld of de bestaande zo nodig vernieuwd worden. De eigenaars
      dragen in de kosten hiervan voor gelijke delen bij.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel46
  - number: '47.1'
    text: |-
      Indien de loop van de grens tussen twee erven onzeker is, kan ieder der eigenaars te allen tijde vorderen dat de
      rechter de grens bepaalt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel47
  - number: '47.2'
    text: |-
      In geval van onzekerheid waar de grens tussen twee erven ligt, geldt niet het wettelijk vermoeden dat de bezitter
      eigenaar is.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel47
  - number: '47.3'
    text: |-
      Bij het bepalen van de grens kan de rechter naar gelang van de omstandigheden het gebied waarover onzekerheid
      bestaat, in gelijkwaardige of ongelijkwaardige delen verdelen dan wel het in zijn geheel aan een der partijen
      toewijzen, al dan niet met toekenning van een schadevergoeding aan een der partijen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel47
  - number: '48'
    text: De eigenaar van een erf is bevoegd dit af te sluiten.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel48
  - number: '49.1'
    text: |-
      Ieder der eigenaars van aangrenzende erven in een aaneengebouwd gedeelte van een gemeente kan te allen tijde
      vorderen dat de andere eigenaar ertoe meewerkt, dat op de grens van de erven een scheidsmuur van twee meter hoogte
      wordt opgericht, voor zover een verordening of een plaatselijke gewoonte de wijze of de hoogte der afscheiding niet
      anders regelt. De eigenaars dragen in de kosten van de afscheiding voor gelijke delen bij.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel49
  - number: '49.2'
    text: Het vorige lid is niet toepasselijk, indien een der erven een openbare weg of een openbaar water is.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel49
  - number: '50.1'
    text: |-
      Tenzij de eigenaar van het naburige erf daartoe toestemming heeft gegeven, is het niet geoorloofd binnen twee meter
      van de grenslijn van dit erf vensters of andere muuropeningen, dan wel balkons of soortgelijke werken te hebben,
      voor zover deze op dit erf uitzicht geven.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel50
  - number: '50.2'
    text: |-
      De nabuur kan zich niet verzetten tegen de aanwezigheid van zodanige openingen of werken, indien zijn erf een
      openbare weg of een openbaar water is, indien zich tussen de erven openbare wegen of openbare wateren bevinden
      of indien het uitzicht niet verder reikt dan tot een binnen twee meter van de opening of het werk zich bevindende
      muur. Uit dezen hoofde geoorloofde openingen of werken blijven geoorloofd, ook nadat de erven hun openbare
      bestemming hebben verloren of de muur is gesloopt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel50
  - number: '50.3'
    text: |-
      De in dit artikel bedoelde afstand wordt gemeten rechthoekig uit de buitenkant van de muur daar, waar de opening
      is gemaakt, of uit de buitenste naar het naburige erf gekeerde rand van het vooruitspringende werk tot aan de
      grenslijn der erven of de muur.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel50
  - number: '50.4'
    text: |-
      Wanneer de nabuur als gevolg van verjaring geen wegneming van een opening of werk meer kan vorderen, is hij
      verplicht binnen een afstand van twee meter daarvan geen gebouwen of werken aan te brengen die de eigenaar van het
      andere erf onredelijk zouden hinderen, behoudens voor zover zulk een gebouw of werk zich daar reeds op het tijdstip
      van de voltooiing van de verjaring bevond.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel50
  - number: '50.5'
    text: |-
      Ter zake van een volgens dit artikel ongeoorloofde toestand is slechts vergoeding verschuldigd van schade, ontstaan
      na het tijdstip waartegen opheffing van die toestand is aangemaand.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel50
  - number: '51'
    text: |-
      In muren, staande binnen de in het vorige artikel aangegeven afstand, mogen steeds lichtopeningen worden gemaakt,
      mits zij van vaststaande en ondoorzichtige vensters worden voorzien.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel51
  - number: '52.1'
    text: |-
      Een eigenaar is verplicht de afdekking van zijn gebouwen en werken zodanig in te richten, dat daarvan het water
      niet op eens anders erf afloopt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel52
  - number: '52.2'
    text: Afwatering op de openbare weg is geoorloofd, indien zij niet bij de wet of verordening verboden is.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel52
  - number: '53'
    text: |-
      Een eigenaar is verplicht er voor te zorgen dat geen water of vuilnis van zijn erf in de goot van eens anders erf
      komt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel53
  - number: '54.1'
    text: |-
      Is een gebouw of werk ten dele op, boven of onder het erf van een ander gebouwd en zou de eigenaar van het gebouw
      of werk door wegneming van het uitstekende gedeelte onevenredig veel zwaarder benadeeld worden dan de eigenaar van
      het erf door handhaving daarvan, dan kan de eigenaar van het gebouw of werk te allen tijde vorderen dat hem tegen
      schadeloosstelling een erfdienstbaarheid tot het handhaven van de bestaande toestand wordt verleend of, ter keuze
      van de eigenaar van het erf, een daartoe benodigd gedeelte van het erf wordt overgedragen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel54
  - number: '54.2'
    text: |-
      Het vorige lid is van overeenkomstige toepassing, wanneer een gebouw of werk na verloop van tijd over andermans erf
      is gaan overhellen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel54
  - number: '54.3'
    text: |-
      De vorige leden zijn niet van toepassing, indien dit voortvloeit uit een op de wet of rechtshandeling gegronde
      verplichting tot het dulden van de bestaande toestand of indien de eigenaar van het gebouw of werk ter zake van de
      bouw of zijn verkrijging kwade trouw of grove schuld verweten kan worden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel54
  - number: '55'
    text: |-
      Indien door een dreigende instorting van een gebouw of werk een naburig erf in gevaar wordt gebracht, kan de
      eigenaar van dat erf te allen tijde vorderen dat maatregelen worden genomen teneinde het gevaar op te heffen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel55
  - number: '56'
    text: |-
      Wanneer het voor het verrichten van werkzaamheden ten behoeve van een onroerende zaak noodzakelijk is van een
      andere onroerende zaak tijdelijk gebruik te maken, is de eigenaar van deze zaak gehouden dit na behoorlijke
      kennisgeving en tegen schadeloosstelling toe te staan, tenzij er voor deze eigenaar gewichtige redenen bestaan dit
      gebruik te weigeren of tot een later tijdstip te doen uitstellen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel56
  - number: '57.1'
    text: |-
      De eigenaar van een erf dat geen behoorlijke toegang heeft tot een openbare weg of een openbaar vaarwater, kan
      van de eigenaars van de naburige erven te allen tijde aanwijzing van een noodweg ten dienste van zijn erf vorderen
      tegen vooraf te betalen of te verzekeren vergoeding van de schade welke hun door die noodweg wordt berokkend.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel57
  - number: '57.2'
    text: |-
      Indien zich na de aanwijzing van de noodweg onvoorziene omstandigheden voordoen, waardoor die weg een grotere
      last aan de eigenaar van het erf veroorzaakt dan waarmee bij het bepalen van de in lid 1 bedoelde vergoeding was
      gerekend, kan de rechter het bedrag van de vergoeding verhogen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel57
  - number: '57.3'
    text: |-
      Bij de aanwijzing van de noodweg wordt rekening gehouden met het belang van het ingesloten erf, dat langs die
      weg de openbare weg of het openbare water zo snel mogelijk kan worden bereikt, en met het belang van de bezwaarde
      erven om zo weinig mogelijk overlast van die weg te ondervinden. Is een erf van de openbare weg afgesloten geraakt,
      doordat het ten gevolge van een rechtshandeling een andere eigenaar heeft gekregen dan een vroeger daarmee verenigd
      gedeelte dat aan de openbare weg grenst of een behoorlijke toegang daartoe heeft, dan komt dit afgescheiden
      gedeelte het eerst voor de belasting met een noodweg in aanmerking.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel57
  - number: '57.4'
    text: |-
      Wanneer een wijziging in de plaatselijke omstandigheden dat wenselijk maakt, kan een noodweg op vordering van een
      onmiddellijk belanghebbende eigenaar worden verlegd.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel57
  - number: '57.5'
    text: Een noodweg vervalt, hoelang hij ook heeft bestaan, zodra hij niet meer nodig is.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel57
  - number: '58.1'
    text: |-
      De eigenaar van een erf die water dat elders te zijner beschikking staat, door een leiding wil aanvoeren, kan tegen
      vooraf te betalen of te verzekeren schadevergoeding van de eigenaars der naburige erven vorderen te gedogen dat
      deze leiding door of over hun erven gaat.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel58
  - number: '58.2'
    text: De laatste vier leden van het vorige artikel vinden daarbij overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel58
  - number: '59.1'
    text: |-
      Wanneer de grens van twee erven in de lengterichting onder een niet bevaarbaar stromend water, een sloot, gracht
      of dergelijke watergang doorloopt, heeft de eigenaar van elk dier erven met betrekking tot die watergang in zijn
      gehele breedte dezelfde bevoegdheden en verplichtingen als een mede-eigenaar. Iedere eigenaar is verplicht de op
      zijn erf gelegen kant van het water, de sloot, de gracht of de watergang te onderhouden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel59
  - number: '59.2'
    text: |-
      Iedere eigenaar is gerechtigd en verplicht hetgeen tot onderhoud daaruit wordt verwijderd, voor zijn deel op zijn
      erf te ontvangen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel59
  - number: '59.3'
    text: Een door de eigenaars overeengekomen afwijkende regeling is ook bindend voor hun rechtverkrijgenden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel59
  - number: '60'
    text: |-
      Mandeligheid ontstaat, wanneer een onroerende zaak gemeenschappelijk eigendom is van de eigenaars van twee of meer
      erven en door hen tot gemeenschappelijk nut van die erven wordt bestemd bij een tussen hun opgemaakte notariële
      akte, gevolgd door inschrijving daarvan in de openbare registers.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel60
  - number: '61.1'
    text: 'Mandeligheid die is ontstaan ingevolge het vorige artikel, eindigt:'
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel61
  - number: 61.1.a
    text: wanneer de gemeenschap eindigt;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel61
  - number: 61.1.b
    text: |-
      wanneer de bestemming van de zaak tot gemeenschappelijk nut van de erven wordt opgeheven bij een tussen de mede-
      eigenaars opgemaakte notariële akte, gevolgd door inschrijving daarvan in de openbare registers;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel61
  - number: 61.1.c
    text: zodra het nut van de zaak voor elk van de erven is geëindigd.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel61
  - number: '61.2'
    text: |-
      Het feit dat het nut van de zaak voor elk van de erven is geëindigd, kan in de openbare registers worden
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel61
  - number: '62.1'
    text: |-
      Een vrijstaande scheidsmuur, een hek of een heg is gemeenschappelijk eigendom en mandelig, indien de grens van twee
      erven die aan verschillende eigenaars toebehoren, er in de lengterichting onderdoor loopt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel62
  - number: '62.2'
    text: |-
      De scheidsmuur die twee gebouwen of werken, welke aan verschillende eigenaars toebehoren, gemeen hebben, is
      eveneens gemeenschappelijk eigendom en mandelig.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel62
  - number: '63.1'
    text: Het recht op een mandelige zaak kan niet worden gescheiden van de eigendom der erven.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel63
  - number: '63.2'
    text: Een vordering tot verdeling van een mandelige zaak is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel63
  - number: '64'
    text: |-
      Mandeligheid brengt mede dat ieder mede-eigenaar aan de overige mede-eigenaars toegang tot de mandelige zaak moet
      geven.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel64
  - number: '65'
    text: Mandelige zaken moeten op kosten van alle mede-eigenaars worden onderhouden, gereinigd en, indien nodig, vernieuwd.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel65
  - number: '66.1'
    text: |-
      Een mede-eigenaar van een mandelige zaak kan zijn aandeel in die zaak ook afzonderlijk van zijn erf aan de overige
      mede-eigenaars overdragen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel66
  - number: '66.2'
    text: |-
      Indien een mede-eigenaar hiertoe op zijn kosten wil overgaan uit hoofde van de lasten van onderhoud, reiniging en
      vernieuwing in de toekomst, zijn de overige mede-eigenaars gehouden tot die overdracht mede te werken, mits hij hun
      zo nodig een recht van opstal of erfdienstbaarheid verleent, waardoor zij met betrekking tot de zaak hun rechten
      kunnen blijven uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel66
  - number: '66.3'
    text: |-
      De vorige leden zijn niet van toepassing op een muur die twee gebouwen of werken gemeen hebben, noch op een muur,
      hek of heg waardoor twee erven in een aaneengebouwd gedeelte van een gemeente van elkaar worden gescheiden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel66
  - number: '67.1'
    text: |-
      Iedere mede-eigenaar mag tegen de mandelige scheidsmuur aanbouwen en daarin tot op de helft der dikte balken,
      ribben, ankers en andere werken aanbrengen, mits hij aan de muur en aan de door de muur bevoegdelijk daarmee
      verbonden werken geen nadeel toebrengt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel67
  - number: '67.2'
    text: |-
      Behalve in noodgevallen kan een mede-eigenaar vorderen dat, vóór de andere mede-eigenaar begint met aanbrengen
      van het werk, deskundigen zullen vaststellen op welke wijze dit kan geschieden zonder nadeel voor de muur of voor
      bevoegd aangebrachte werken van de eerst vermelde eigenaar.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel67
  - number: '68'
    text: |-
      Iedere mede-eigenaar mag op de mandelige scheidsmuur tot op de helft der dikte een goot aanleggen, mits het water
      niet op het erf van de andere mede-eigenaar uitloost.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel68
  - number: '69'
    text: |-
      De [artikelen 64][ref1], [65][ref2], [66 lid 2][ref3], [67][ref4] en [68][ref5] vinden geen toepassing voorzover
      een overeenkomstig [artikel 168 van boek 3][ref6] getroffen regeling anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel66
      [ref4]: https://wetten.overheid.nl/BWBR0005288#Artikel67
      [ref5]: https://wetten.overheid.nl/BWBR0005288#Artikel68
      [ref6]: https://wetten.overheid.nl/BWBR0005291#Artikel168
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '65'
      - id: ref3
        bwb_id: BWBR0005288
        artikel: '66'
      - id: ref4
        bwb_id: BWBR0005288
        artikel: '67'
      - id: ref5
        bwb_id: BWBR0005288
        artikel: '68'
      - id: ref6
        bwb_id: BWBR0005291
        artikel: '168'
  - number: '70.1'
    text: |-
      Een erfdienstbaarheid is een last, waarmede een onroerende zaak - het dienende erf - ten behoeve van een andere
      onroerende zaak - het heersende erf - is bezwaard.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel70
  - number: '70.2'
    text: |-
      In de akte van vestiging van een erfdienstbaarheid kan aan de eigenaar van het heersende erf de verplichting worden
      opgelegd aan de eigenaar van het dienende erf op al dan niet regelmatig terugkerende tijdstippen een geldsom - de
      retributie - te betalen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel70
  - number: '71.1'
    text: |-
      De last die een erfdienstbaarheid op het dienende erf legt, bestaat in een verplichting om op, boven of onder een
      der beide erven iets te dulden of niet te doen. In de akte van vestiging kan worden bepaald dat de last bovendien
      een verplichting inhoudt tot het aanbrengen van gebouwen, werken of beplantingen die voor de uitoefening van
      die erfdienstbaarheid nodig zijn, mits deze gebouwen, werken en beplantingen zich geheel of gedeeltelijk op het
      dienende erf zullen bevinden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel71
  - number: '71.2'
    text: |-
      De last die een erfdienstbaarheid op het dienende erf legt, kan ook bestaan in een verplichting tot onderhoud
      van het dienende erf of van gebouwen, werken of beplantingen die zich geheel of gedeeltelijk op het dienende erf
      bevinden of zullen bevinden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel71
  - number: '72'
    text: Erfdienstbaarheden kunnen ontstaan door vestiging en door verjaring.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel72
  - number: '73.1'
    text: |-
      De inhoud van de erfdienstbaarheid en de wijze van uitoefening worden bepaald door de akte van vestiging en, voor
      zover in die akte regelen daaromtrent ontbreken, door de plaatselijke gewoonte. Is een erfdienstbaarheid te goeder
      trouw geruime tijd zonder tegenspraak op een bepaalde wijze uitgeoefend, dan is in geval van twijfel deze wijze van
      uitoefening beslissend.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel73
  - number: '73.2'
    text: |-
      Niettemin kan de eigenaar van het dienende erf voor de uitoefening van de erfdienstbaarheid een ander gedeelte van
      het erf aanwijzen dan waarop de erfdienstbaarheid ingevolge het vorige lid dient te worden uitgeoefend, mits deze
      verplaatsing zonder vermindering van genot voor de eigenaar van het heersende erf mogelijk is. Kosten, noodzakelijk
      voor zodanige verandering, komen ten laste van de eigenaar van het dienende erf.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel73
  - number: '74'
    text: De uitoefening der erfdienstbaarheid moet op de voor het dienende erf minst bezwarende wijze geschieden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel74
  - number: '75.1'
    text: |-
      De eigenaar van het heersende erf is bevoegd om op zijn kosten op het dienende erf alles te verrichten wat voor de
      uitoefening van de erfdienstbaarheid noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel75
  - number: '75.2'
    text: |-
      Hij is eveneens bevoegd om op zijn kosten op het dienende erf gebouwen, werken en beplantingen aan te brengen, die
      voor de uitoefening van de erfdienstbaarheid noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel75
  - number: '75.3'
    text: |-
      Hij is verplicht het door hem op het dienende erf aangebrachte te onderhouden, voor zover dit in het belang van het
      dienende erf nodig is; hij is bevoegd het weg te nemen, mits hij het erf in de oude toestand terugbrengt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel75
  - number: '75.4'
    text: |-
      De eigenaar van het dienende erf heeft geen recht van gebruik van de gebouwen, werken en beplantingen, die daarop
      door de eigenaar van het heersende erf rechtmatig zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel75
  - number: '75.5'
    text: In de akte van vestiging kan van de vorige leden worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel75
  - number: '75.6'
    text: In geval van mandeligheid zijn in plaats van de leden 3 en 4 de uit dien hoofde geldende regels van toepassing.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel75
  - number: '76.1'
    text: |-
      Wanneer het heersende erf wordt verdeeld, blijft de erfdienstbaarheid bestaan ten behoeve van ieder gedeelte, ten
      voordele waarvan zij kan strekken.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel76
  - number: '76.2'
    text: |-
      Wanneer het dienende erf wordt verdeeld, blijft de last rusten op ieder gedeelte, ten aanzien waarvan naar de akte
      van vestiging en de aard der erfdienstbaarheid de uitoefening mogelijk is.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel76
  - number: '76.3'
    text: In de akte van vestiging kan van de vorige leden worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel76
  - number: '77.1'
    text: |-
      Behoort het heersende of het dienende erf toe aan twee of meer personen, hetzij als deelgenoten, hetzij als
      eigenaars van verschillende gedeelten daarvan, dan zijn zij hoofdelijk verbonden tot nakoming van de uit de
      erfdienstbaarheid voortvloeiende geldelijke verplichtingen die tijdens hun recht opeisbaar worden, voor zover deze
      niet over hun rechten zijn verdeeld.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel77
  - number: '77.2'
    text: |-
      Na overdracht of toedeling van het heersende of het dienende erf of van een gedeelte daarvan of een aandeel
      daarin zijn de verkrijger en zijn rechtsvoorganger hoofdelijk verbonden voor de in lid 1 bedoelde geldelijke
      verplichtingen die in de voorafgaande twee jaren opeisbaar zijn geworden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel77
  - number: '77.3'
    text: |-
      In de akte van vestiging kan van de vorige leden worden afgeweken, doch van het tweede lid niet ten nadele van
      de verkrijger.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel77
  - number: '78'
    text: 'De rechter kan op vordering van de eigenaar van het dienende erf een erfdienstbaarheid wijzigen of opheffen:'
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel78
  - number: 78.a
    text: |-
      op grond van onvoorziene omstandigheden welke van dien aard zijn dat naar maatstaven van redelijkheid en
      billijkheid ongewijzigde instandhouding van de erfdienstbaarheid niet van de eigenaar van het dienende erf kan
      worden gevergd:
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel78
  - number: 78.b
    text: |-
      indien ten minste twintig jaren na het ontstaan van de erfdienstbaarheid zijn verlopen en het ongewijzigd
      voortbestaan van de erfdienstbaarheid in strijd is met het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel78
  - number: '79'
    text: |-
      De rechter kan op vordering van de eigenaar van het dienende erf een erfdienstbaarheid opheffen, indien de
      uitoefening daarvan onmogelijk is geworden of de eigenaar van het heersende erf geen redelijk belang bij de
      uitoefening meer heeft, en het niet aannemelijk is dat de mogelijkheid van uitoefening of het redelijk belang
      daarbij zal terugkeren.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel79
  - number: '80'
    text: |-
      De rechter kan op vordering van de eigenaar van het heersende erf de inhoud van een erfdienstbaarheid, wanneer
      door onvoorziene omstandigheden de uitoefening blijvend of tijdelijk onmogelijk is geworden of het belang van de
      eigenaar van het heersende erf aanzienlijk is verminderd, zodanig wijzigen dat de mogelijkheid van uitoefening of
      het oorspronkelijke belang wordt hersteld, mits deze wijziging naar maatstaven van redelijkheid en billijkheid van
      de eigenaar van het dienende erf kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel80
  - number: '81.1'
    text: |-
      De rechter kan een vordering als bedoeld in de [artikelen 78-80][ref1] toewijzen onder door hem te stellen
      voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel78
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '78'
  - number: '81.2'
    text: |-
      Rust op een der erven beperkt recht, dan is de vordering slechts toewijsbaar, indien de beperkt gerechtigde in
      het geding is geroepen. Bij het oordeel of aan de maatstaven van de [artikelen 78 onder ][ref1], [79][ref2] en
      [80][ref3] is voldaan, dient mede met zijn belangen rekening te worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel80
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '78'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '79'
      - id: ref3
        bwb_id: BWBR0005288
        artikel: '80'
  - number: '82.1'
    text: |-
      Indien de eigenaar van het heersende erf uit hoofde van de aan de erfdienstbaarheid verbonden lasten en
      verplichtingen op zijn kosten afstand van zijn recht wil doen, is de eigenaar van het dienende erf gehouden hieraan
      mede te werken.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel82
  - number: '82.2'
    text: In de akte van vestiging kan voor de eerste twintig jaren anders worden bepaald.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel82
  - number: '83'
    text: |-
      Indien op het tijdstip waarop het heersende en het dienende erf één eigenaar verkrijgen, een derde een der erven
      in huur of pacht of uit hoofde van een ander persoonlijk recht in gebruik heeft, gaat de erfdienstbaarheid pas door
      vermenging teniet bij het einde van dit gebruiksrecht.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel83
  - number: '84.1'
    text: |-
      Hij die een recht van erfpacht, opstal of vruchtgebruik op een onroerende zaak heeft, kan een erfdienstbaarheid ten
      behoeve van deze zaak bedingen. Hij kan haar ook met een erfdienstbaarheid belasten.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel84
  - number: '84.2'
    text: |-
      Erfdienstbaarheden, bedongen door een beperkt gerechtigde ten behoeve van de zaak waarop zijn recht rust of door
      een opstaller ten behoeve van de opstal, gaan bij het einde van het beperkte recht slechts teniet, indien dit in
      de akte van vestiging van de erfdienstbaarheid is bepaald. Blijft de erfdienstbaarheid voortbestaan, dan staat een
      beding als bedoeld in [artikel 82 lid 2][ref1] niet langer aan afstand van de erfdienstbaarheid in de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel82
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '82'
  - number: '84.3'
    text: |-
      Erfdienstbaarheden, gevestigd door een beperkt gerechtigde ten laste van de zaak waarop zijn recht rust of door
      een opstaller ten laste van de opstal, gaan teniet bij het einde van het beperkte recht, tenzij dit eindigt door
      vermenging of afstand of de eigenaar van de zaak waarop het beperkte recht rustte bij een in de openbare registers
      ingeschreven akte heeft verklaard met de vestiging van de erfdienstbaarheid in te stemmen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel84
  - number: '84.4'
    text: |-
      De erfpachter, opstaller of vruchtgebruiker wordt voor de toepassing van de overige artikelen van deze titel
      aangemerkt als eigenaar van het heersende, onderscheidenlijk het dienende erf.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel84
  - number: '85.1'
    text: |-
      Erfpacht is een zakelijk recht dat de erfpachter de bevoegdheid geeft eens anders onroerende zaak te houden en
      te gebruiken.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel85
  - number: '85.2'
    text: |-
      In de akte van vestiging kan aan de erfpachter de verplichting worden opgelegd aan de eigenaar op al dan niet
      regelmatig terugkerende tijdstippen een geldsom - de canon - te betalen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel85
  - number: '86'
    text: Partijen kunnen in de akte van vestiging de duur van de erfpacht regelen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel86
  - number: '87.1'
    text: Een erfpacht kan door de erfpachter worden opgezegd, tenzij in de akte van vestiging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel87
  - number: '87.2'
    text: |-
      Een erfpacht kan door de eigenaar worden opgezegd, indien de erfpachter in verzuim is de canon over twee
      achtereenvolgende jaren te betalen of in ernstige mate tekortschiet in de nakoming van zijn andere verplichtingen.
      Deze opzegging moet op straffe van nietigheid binnen acht dagen worden betekend aan degenen die als beperkt
      gerechtigde of beslaglegger op de erfpacht in de openbare registers staan ingeschreven. Na het einde van de
      erfpacht is de eigenaar verplicht de waarde die de erfpacht dan heeft aan de erfpachter te vergoeden, na aftrek van
      hetgeen hij uit hoofde van de erfpacht van de erfpachter te vorderen heeft, de kosten daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel87
  - number: '87.3'
    text: |-
      Een beding dat ten nadele van de erfpachter van het vorige lid afwijkt is nietig. In de akte van vestiging kan aan
      de eigenaar de bevoegdheid worden toegekend tot opzegging, behoudens op grond van tekortschieten van de erfpachter
      in de nakoming van zijn verplichtingen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel87
  - number: '88.1'
    text: |-
      Iedere opzegging geschiedt bij exploit. Zij geschiedt tenminste een jaar voor het tijdstip waartegen wordt
      opgezegd, doch in het geval van [artikel 87 lid 2][ref1] tenminste een maand voor dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel87
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '87'
  - number: '88.2'
    text: |-
      In het geval van [artikel 87 lid 2][ref1] weigert de bewaarder de inschrijving van de opzegging als niet tevens
      wordt overgelegd de betekening daarvan aan degenen die in de openbare registers als beperkt gerechtigde of
      beslaglegger op de erfpacht stonden ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel87
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '87'
  - number: '89.1'
    text: |-
      Voor zover niet in de akte van vestiging anders is bepaald, heeft de erfpachter hetzelfde genot van de zaak als
      een eigenaar.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel89
  - number: '89.2'
    text: |-
      Hij mag echter zonder toestemming van de eigenaar niet een andere bestemming aan de zaak geven of een handeling in
      strijd met de bestemming van de zaak verrichten.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel89
  - number: '89.3'
    text: |-
      Voor zover niet in de akte van vestiging anders is bepaald, heeft de erfpachter, zowel tijdens de duur van de
      erfpacht als bij het einde daarvan, de bevoegdheid gebouwen, werken en beplantingen, die door hemzelf of een
      rechtsvoorganger onverplicht zijn aangebracht of van de eigenaar tegen vergoeding der waarde zijn overgenomen, weg
      te nemen, mits hij de in erfpacht gegeven zaak in de oude toestand terugbrengt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel89
  - number: '90.1'
    text: |-
      Voor zover niet in de akte van vestiging anders is bepaald, behoren vruchten die tijdens de duur der erfpacht zijn
      afgescheiden of opeisbaar geworden, en voordelen van roerende aard, die de zaak oplevert, aan de erfpachter.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel90
  - number: '90.2'
    text: |-
      Voordelen van onroerende aard behoren aan de eigenaar toe. Zij zijn eveneens aan de erfpacht onderworpen, tenzij in
      de akte van vestiging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel90
  - number: '91.1'
    text: |-
      In de akte van vestiging kan worden bepaald dat de erfpacht niet zonder toestemming van de eigenaar kan worden
      overgedragen of toebedeeld. Een zodanige bepaling staat aan executie door schuldeisers niet in de weg.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel91
  - number: '91.2'
    text: |-
      In de akte van vestiging kan ook worden bepaald, dat de erfpachter zijn recht niet zonder toestemming van de
      eigenaar kan splitsen door overdracht of toedeling van de erfpacht op een gedeelte van de zaak.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel91
  - number: '91.3'
    text: |-
      Een beding als in de vorige leden bedoeld kan ook worden gemaakt ten aanzien van de appartementsrechten, waarin een
      gebouw door de erfpachter wordt gesplitst. Het kan slechts aan een verkrijger onder bijzondere titel van een recht
      op het appartementsrecht worden tegengeworpen, indien het in de akte van splitsing is omschreven.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel91
  - number: '91.4'
    text: |-
      Indien de eigenaar de vereiste toestemming zonder redelijke gronden weigert of zich niet verklaart, kan zijn
      toestemming op verzoek van degene die haar behoeft, worden vervangen door een machtiging van de kantonrechter van
      de rechtbank van het arrondissement waarin de zaak of het grootste gedeelte daarvan is gelegen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel91
  - number: '92.1'
    text: |-
      Behoort de erfpacht toe aan twee of meer personen, hetzij als deelgenoten hetzij als erfpachter van verschillende
      gedeelten van de zaak, dan zijn zij hoofdelijk verbonden voor de gehele canon die tijdens hun recht opeisbaar
      wordt, voor zover deze niet over hun rechten verdeeld is.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel92
  - number: '92.2'
    text: |-
      Na overdracht of toedeling van de erfpacht op de zaak of een gedeelte daarvan of van een aandeel in de erfpacht
      zijn de verkrijger en zijn rechtsvoorganger hoofdelijk verbonden voor de door laatstgenoemde verschuldigde canon
      die in de voorafgaande vijf jaren opeisbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel92
  - number: '92.3'
    text: |-
      In de akte van vestiging kan van de vorige leden worden afgeweken, doch van het tweede lid niet ten nadele van
      de verkrijger.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel92
  - number: '93.1'
    text: |-
      De erfpachter is bevoegd de zaak waarop het recht van erfpacht rust, geheel of ten dele in ondererfpacht te geven,
      voor zover in de akte van vestiging niet anders is bepaald. Aan de ondererfpachter komen ten aanzien van de zaak
      niet meer bevoegdheden toe dan de erfpachter jegens de eigenaar heeft.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel93
  - number: '93.2'
    text: |-
      De ondererfpacht gaat bij het einde van de erfpacht teniet, tenzij deze eindigt door vermenging of afstand. De
      eigenaar kan voor de ter zake van de erfpacht verschuldigde canon het recht van erfpacht vrij van ondererfpacht
      uitwinnen. Het in de vorige zinnen van dit lid bepaalde geldt niet, indien de eigenaar bij een in de openbare
      registers ingeschreven notariële akte heeft verklaard met de vestiging van de ondererfpacht in te stemmen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel93
  - number: '93.3'
    text: |-
      Voor de toepassing van de overige artikelen van deze titel wordt de erfpachter in zijn verhouding tot de
      ondererfpachter als eigenaar aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel93
  - number: '94.1'
    text: |-
      De erfpachter is bevoegd de zaak waarop het recht van erfpacht rust, te verhuren of te verpachten, voor zover in de
      akte van vestiging niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel94
  - number: '94.2'
    text: |-
      Na het einde van de erfpacht is de eigenaar verplicht een bevoegdelijk aangegane verhuur of verpachting gestand
      te doen. Hij kan nochtans gestanddoening weigeren, voor zover zonder zijn toestemming hetzij de overeengekomen
      tijdsduur van de huur langer is dan met het plaatselijk gebruik overeenstemt of bedrijfsruimte in de zin van
      de [zesde afdeling van titel 4 van Boek 7][ref1] is verhuurd voor een langere tijd dan vijf jaren, hetzij de
      verpachting is geschied voor een langere duur dan twaalf jaren voor hoeven en zes jaren voor los land, hetzij de
      verhuring of verpachting is geschied op ongewone voor hem bezwarende voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling6
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '6'
  - number: '94.3'
    text: |-
      Hij verliest de bevoegdheid gestanddoening te weigeren, wanneer de huurder of pachter hem een redelijke
      termijn heeft gesteld om zich omtrent de gestanddoening te verklaren en hij zich niet binnen deze termijn heeft
      uitgesproken.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel94
  - number: '94.4'
    text: |-
      Indien de eigenaar volgens de vorige leden niet verplicht is tot gestanddoening van een door de erfpachter
      aangegane verhuring van woonruimte waarin de huurder bij het eindigen van de erfpacht zijn hoofdverblijf heeft
      en waarop de [artikelen 271 tot en met 277 van Boek 7][ref1] van toepassing zijn, moet hij de huurovereenkomst
      niettemin met de huurder voortzetten met dien verstande dat [artikel 269 lid 2 van Boek 7][ref2], van
      overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel271
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel269
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '271'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '269'
  - number: '95'
    text: |-
      Tot het instellen van rechtsvorderingen en het indienen van verzoekschriften ter verkrijging van een rechterlijke
      uitspraak die zowel het recht van de eigenaar als dat van de erfpachter betreft, is ieder van hen bevoegd, mits hij
      zorg draagt dat de ander tijdig in het geding wordt geroepen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel95
  - number: '96.1'
    text: |-
      Gewone lasten en herstellingen worden door de erfpachter gedragen en verricht. De erfpachter is verplicht, wanneer
      buitengewone herstellingen nodig zijn, aan de eigenaar van deze noodzakelijkheid kennis te geven en hem gelegenheid
      te verschaffen tot het doen van deze herstellingen. De eigenaar is niet tot het doen van enige herstelling
      verplicht.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel96
  - number: '96.2'
    text: De erfpachter is verplicht de buitengewone lasten die op de zaak drukken te voldoen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel96
  - number: '96.3'
    text: In de akte van vestiging kan van de vorige leden worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel96
  - number: '97.1'
    text: |-
      Indien vijf en twintig jaren na de vestiging van de erfpacht zijn verlopen, kan de rechter op vordering van de
      eigenaar of de erfpachter de erfpacht wijzigen of opheffen op grond van onvoorziene omstandigheden, welke van dien
      aard zijn dat naar maatstaven van redelijkheid en billijkheid ongewijzigde instandhouding van de akte van vestiging
      niet van de eigenaar of de erfpachter kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel97
  - number: '97.2'
    text: De rechter kan de vordering onder door hem vast te stellen voorwaarden toewijzen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel97
  - number: '97.3'
    text: |-
      Rust op de erfpacht of op de zaak een beperkt recht, dan is de vordering slechts toewijsbaar, indien de beperkt
      gerechtigde in het geding is geroepen en ook te zijnen aanzien aan de maatstaf van lid 1 is voldaan.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel97
  - number: '98.1'
    text: |-
      Wanneer de tijd waarvoor de erfpacht is gevestigd, is verstreken en de erfpachter de zaak niet op dat tijdstip
      heeft ontruimd, blijft de erfpacht doorlopen, tenzij de eigenaar uiterlijk zes maanden na dat tijdstip doet blijken
      dat hij haar als geëindigd beschouwt. De eigenaar en de erfpachter kunnen de verlengde erfpacht opzeggen op de
      wijze en met inachtneming van de termijn vermeld in [artikel 88][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel88
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '88'
  - number: '98.2'
    text: Ieder beding dat ten nadele van de erfpachter van dit artikel afwijkt, is nietig.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel98
  - number: '99.1'
    text: |-
      Na het einde van de erfpacht heeft de voormalige erfpachter recht op vergoeding van de waarde van nog aanwezige
      gebouwen, werken en beplantingen, die door hemzelf of een rechtsvoorganger zijn aangebracht of van de eigenaar
      tegen vergoeding der waarde zijn overgenomen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel99
  - number: '99.2'
    text: |-
      In de akte van vestiging kan worden bepaald dat de erfpachter geen recht heeft op de in het eerste lid bedoelde
      vergoeding:
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel99
  - number: 99.2.a
    text: indien de in erfpacht gegeven grond een andere bestemming had dan die van woningbouw;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel99
  - number: 99.2.b
    text: indien de erfpachter de gebouwen, werken en beplantingen niet zelf heeft bekostigd;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel99
  - number: 99.2.c
    text: indien de erfpacht geëindigd is door opzegging door de erfpachter;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel99
  - number: 99.2.d
    text: |-
      voor zover de gebouwen, werken en beplantingen onverplicht waren aangebracht en hij ze bij het einde van de
      erfpacht mocht wegnemen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel99
  - number: '99.3'
    text: |-
      De eigenaar is bevoegd van de door hem ingevolge dit artikel verschuldigde vergoeding af te houden hetgeen hij uit
      hoofde van de erfpacht van de erfpachter te vorderen heeft.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel99
  - number: '100.1'
    text: |-
      De erfpachter heeft een retentierecht op de in erfpacht uitgegeven zaak totdat hem de verschuldigde vergoeding
      is betaald.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel100
  - number: '100.2'
    text: Ieder van het vorige lid afwijkend beding is nietig.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel100
  - number: '100.3'
    text: |-
      De eigenaar heeft een retentierecht op hetgeen de erfpachter mocht hebben afgebroken, totdat hem hetgeen hij uit
      hoofde van de erfpacht heeft te vorderen is voldaan.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel100
  - number: '101.1'
    text: |-
      Het recht van opstal is een zakelijk recht om in, op of boven een onroerende zaak van een ander gebouwen, werken of
      beplantingen in eigendom te hebben of te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel101
  - number: '101.2'
    text: |-
      Het recht van opstal kan zelfstandig dan wel afhankelijk van een ander zakelijk recht of van een recht van huur of
      pacht op de onroerende zaak worden verleend.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel101
  - number: '101.3'
    text: |-
      In de akte van vestiging kan de opstaller de verplichting worden opgelegd aan de eigenaar op al dan niet regelmatig
      terugkerende tijdstippen een geldsom - de retributie - te betalen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel101
  - number: '102'
    text: |-
      De bevoegdheden van de opstaller tot het gebruiken, aanbrengen en wegnemen van de gebouwen, werken en beplantingen
      kunnen in de akte van vestiging worden beperkt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel102
  - number: '103'
    text: |-
      Bij gebreke van een regeling daaromtrent in de akte van vestiging heeft de opstaller ten aanzien van de zaak waarop
      zijn recht rust, de bevoegdheden die voor het volle genot van zijn recht nodig zijn.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel103
  - number: '104.1'
    text: |-
      De [artikelen 92][ref1] en [95][ref2] zijn van overeenkomstige toepassing op het recht van opstal.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel95
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '92'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '95'
  - number: '104.2'
    text: |-
      De [artikelen 86][ref1], [87][ref2], [88][ref3], [91][ref4], [93][ref5], [94][ref6], [97][ref7] en [98][ref8] zijn
      van overeenkomstige toepassing op een zelfstandig recht van opstal.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel87
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel88
      [ref4]: https://wetten.overheid.nl/BWBR0005288#Artikel91
      [ref5]: https://wetten.overheid.nl/BWBR0005288#Artikel93
      [ref6]: https://wetten.overheid.nl/BWBR0005288#Artikel94
      [ref7]: https://wetten.overheid.nl/BWBR0005288#Artikel97
      [ref8]: https://wetten.overheid.nl/BWBR0005288#Artikel98
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '86'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '87'
      - id: ref3
        bwb_id: BWBR0005288
        artikel: '88'
      - id: ref4
        bwb_id: BWBR0005288
        artikel: '91'
      - id: ref5
        bwb_id: BWBR0005288
        artikel: '93'
      - id: ref6
        bwb_id: BWBR0005288
        artikel: '94'
      - id: ref7
        bwb_id: BWBR0005288
        artikel: '97'
      - id: ref8
        bwb_id: BWBR0005288
        artikel: '98'
  - number: '105.1'
    text: |-
      Wanneer het recht van opstal tenietgaat, gaat de eigendom van de gebouwen, werken en beplantingen van rechtswege
      over op de eigenaar van de onroerende zaak waarop het rustte.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel105
  - number: '105.2'
    text: |-
      Voor zover niet in de akte van vestiging anders is bepaald, heeft de opstaller bij het einde van zijn recht de
      bevoegdheid gebouwen, werken en beplantingen die door hemzelf of een rechtsvoorganger onverplicht zijn aangebracht
      dan wel van de eigenaar tegen vergoeding der waarde zijn overgenomen weg te nemen, mits hij de onroerende zaak
      waarop het recht rustte in de oude toestand terugbrengt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel105
  - number: '105.3'
    text: |-
      De [artikelen 99][ref1] en [100][ref2] zijn van overeenkomstige toepassing, met dien verstande dat het aan de
      opstaller toekomende retentierecht slechts de gebouwen, werken en beplantingen omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel100
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '99'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '100'
  - number: '106.1'
    text: |-
      Een eigenaar, erfpachter of opstaller is bevoegd zijn recht op een gebouw met toebehoren en op de daarbij behorende
      grond met toebehoren te splitsen in appartementsrechten.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel106
  - number: '106.2'
    text: |-
      Een eigenaar, erfpachter of opstaller is eveneens bevoegd zijn recht op een stuk grond te splitsen in
      appartementsrechten.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel106
  - number: '106.3'
    text: |-
      Een appartementsrecht is op zijn beurt voor splitsing in appartementsrechten vatbaar. Een appartementseigenaar is
      tot deze ondersplitsing bevoegd, voor zover in de akte van splitsing niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel106
  - number: '106.4'
    text: |-
      Onder appartementsrecht wordt verstaan een aandeel in de goederen die in de splitsing zijn betrokken, dat de
      bevoegdheid omvat tot het uitsluitend gebruik van bepaalde gedeelten van het gebouw die blijkens hun inrichting
      bestemd zijn of worden om als afzonderlijk geheel te worden gebruikt. Het aandeel kan mede omvatten de bevoegdheid
      tot het uitsluitend gebruik van bepaalde gedeelten van de bij het gebouw behorende grond. In het geval van lid
      2 omvat het aandeel de bevoegdheid tot het uitsluitend gebruik van bepaalde gedeelten van het stuk grond, die
      blijkens hun inrichting of aanduiding bestemd zijn of worden om als afzonderlijk geheel te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel106
  - number: '106.5'
    text: Onder appartementseigenaar wordt verstaan de gerechtigde tot een appartementsrecht.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel106
  - number: '106.6'
    text: Onder gebouw wordt in deze titel mede verstaan een groep van gebouwen die in één splitsing zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel106
  - number: '106.7'
    text: |-
      Een erfpachter of opstaller is tot een splitsing in appartementsrechten slechts bevoegd na verkregen toestemming
      van de grondeigenaar. Indien deze de vereiste toestemming kennelijk zonder redelijke grond weigert of zich niet
      verklaart, kan de toestemming op verzoek van degene die haar behoeft worden vervangen door een machtiging van
      de kantonrechter van de rechtbank van het arrondissement waarin het gebouw of het grootste gedeelte daarvan is
      gelegen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel106
  - number: '107'
    text: |-
      Een eigenaar, erfpachter of opstaller is ook bevoegd in verband met een door hem beoogde stichting of gewijzigde
      inrichting van een gebouw zijn recht op het gebouw met toebehoren en de daarbij behorende grond met toebehoren
      te splitsen in appartementsrechten. Ook in geval van zodanige splitsing ontstaan de appartementsrechten op het
      tijdstip van inschrijving van de akte van splitsing.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel107
  - number: '108.1'
    text: |-
      De appartementseigenaars zijn jegens elkander verplicht de bouw, de inrichting van het gebouw of de inrichting of
      aanduiding van de grond tot stand te brengen en in stand te houden in overeenstemming met het daaromtrent in de
      akte van splitsing bepaalde.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel108
  - number: '108.2'
    text: |-
      De rechter kan de uitspraak op een vordering, gegrond op het vorige lid, aanhouden wanneer een op
      [artikel 144 lid 1 onder ][ref1] gegrond verzoek aanhangig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel144
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '144'
        afdeling: '4'
  - number: '109.1'
    text: |-
      De splitsing geschiedt door een daartoe bestemde notariële akte, gevolgd door inschrijving van die akte in de
      openbare registers.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel109
  - number: '109.2'
    text: |-
      Aan de minuut van de akte van splitsing wordt een tekening gehecht, aangevende de begrenzing van de onderscheidene
      gedeelten van het gebouw en de grond, die bestemd zijn als afzonderlijk geheel te worden gebruikt en waarvan
      volgens de akte het uitsluitend gebruik in een appartementsrecht zal zijn begrepen. De tekening dient te voldoen
      aan de eisen, krachtens de wet bedoeld in [artikel 16 lid 2 van Boek 3][ref1] voor de inschrijving daarvan te
      stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel16
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '16'
  - number: '109.3'
    text: |-
      Waar in de bepalingen van deze titel wordt gesproken van de akte van splitsing, is hieronder de tekening begrepen,
      tenzij uit de bepaling het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel109
  - number: '110.1'
    text: |-
      Ondanks onbevoegdheid van degene die de splitsing heeft verricht, om over een daarin betrokken registergoed te
      beschikken, is de splitsing geldig, indien zij is gevolgd door een geldige overdracht van een appartementsrecht of
      vestiging van een beperkt recht op een appartementsrecht.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel110
  - number: '110.2'
    text: |-
      Een ongeldige splitsing wordt eveneens als geldig aangemerkt, wanneer een appartementsrecht is verkregen door
      verjaring.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel110
  - number: '111'
    text: 'De akte van splitsing moet inhouden:'
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel111
  - number: 111.a
    text: de vermelding van de plaatselijke ligging van het gebouw of de grond;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel111
  - number: 111.b
    text: |-
      een nauwkeurige omschrijving van de onderscheiden gedeelten van het gebouw of de grond, die bestemd zijn
      om als afzonderlijk geheel te worden gebruikt, welke omschrijving kan plaatsvinden door verwijzing naar
      de in [artikel 109 lid 2][ref1] bedoelde tekening, alsmede de vermelding voor elk dier gedeelten, tot welk
      appartementsrecht de bevoegdheid tot gebruik daarvan behoort;


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel109
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '109'
        afdeling: '1'
  - number: 111.c
    text: de kadastrale aanduiding van de appartementsrechten en de vermelding van de appartementseigenaar;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel111
  - number: 111.d
    text: |-
      een reglement, waartoe geacht worden te behoren de bepalingen van een nauwkeurig aangeduid modelreglement dat is
      ingeschreven in de openbare registers ter plaatse waar de akte moet worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel111
  - number: '112.1'
    text: 'Het reglement moet inhouden:'
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel112
  - number: 112.1.a
    text: welke schulden en kosten voor rekening van de gezamenlijke appartementseigenaars komen;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel112
  - number: 112.1.b
    text: |-
      een regeling omtrent een jaarlijks op te stellen exploitatierekening, lopende over het voorafgaande jaar, en de
      door de appartementseigenaars te storten bijdragen;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel112
  - number: 112.1.c
    text: |-
      een regeling omtrent het gebruik, het beheer en het onderhoud van de gedeelten die niet bestemd zijn om als
      afzonderlijk geheel te worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel112
  - number: 112.1.d
    text: |-
      door wiens zorg en tegen welke gevaren het gebouw ten behoeve van de gezamenlijke appartementseigenaars moet worden
      verzekerd;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel112
  - number: 112.1.e
    text: |-
      de oprichting van een vereniging van eigenaars, die ten doel heeft het behartigen van gemeenschappelijke belangen
      van de appartementseigenaars, en de statuten van de vereniging.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel112
  - number: '112.2'
    text: 'De statuten van de vereniging van eigenaars moeten bevatten:'
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel112
  - number: 112.2.a
    text: |-
      de naam van de vereniging en de gemeente waar zij haar zetel heeft. De naam van de vereniging moet aanvangen met
      de woorden: "Vereniging van Eigenaars", hetzij voluit geschreven, hetzij afgekort tot "V. v. E.", en voorts melding
      maken van de ligging van het gebouw;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel112
  - number: 112.2.b
    text: het doel van de vereniging;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel112
  - number: 112.2.c
    text: |-
      een regeling omtrent door de appartementseigenaars periodiek, tenminste jaarlijks, aan de vereniging verschuldigde
      bijdragen;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel112
  - number: 112.2.d
    text: |-
      de wijze van bijeenroeping van de vergadering van eigenaars en de bepaling van het aantal stemmen dat ieder der
      appartementseigenaars in de vergadering kan uitbrengen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel112
  - number: '112.3'
    text: |-
      Het reglement kan een regeling inhouden, krachtens welke aan alle of bepaalde appartementsrechten mede verbonden
      is het lidmaatschap van een andere, nader in het reglement omschreven vereniging of coöperatie, voor zover dit
      lidmaatschap in overeenstemming is met de statuten van die vereniging of coöperatie.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel112
  - number: '112.4'
    text: |-
      Het reglement kan inhouden een regeling omtrent het gebruik, het beheer en het onderhoud van de gedeelten die
      bestemd zijn om als afzonderlijk geheel te worden gebruikt. Een zodanige regeling kan inhouden dat de vergadering
      van eigenaars bevoegd is een appartementseigenaar of degene die zijn rechten uitoefent, om nader in het reglement
      aangegeven gewichtige redenen het gebruik van deze gedeelten te ontzeggen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel112
  - number: '113.1'
    text: |-
      De aandelen die door de splitsing in appartementsrechten ontstaan, zijn gelijk, tenzij bij de akte van splitsing
      een andere verhouding is bepaald. In het laatste geval blijkt uit de akte op welke grondslag die verhouding berust.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel113
  - number: '113.2'
    text: |-
      In de schulden en kosten die ingevolge de wet of het reglement voor rekening van de gezamenlijke
      appartementseigenaars komen, moeten zij onderling en jegens de vereniging van eigenaars voor elk appartementsrecht
      een gelijk deel bijdragen, tenzij daarvoor bij het reglement een andere verhouding is bepaald.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel113
  - number: '113.3'
    text: |-
      Indien de appartementseigenaars voor een in het vorige lid genoemde schuld jegens de schuldeisers gezamenlijk
      aansprakelijk zijn en de verschuldigde prestatie deelbaar is, zijn zij ieder verbonden voor een deel, in de
      verhouding bedoeld in het vorige lid.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel113
  - number: '113.4'
    text: |-
      Indien de appartementseigenaars voor een in lid 2 genoemde schuld gezamenlijk aansprakelijk zijn, is de vereniging
      voor die schuld hoofdelijk verbonden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel113
  - number: '113.5'
    text: |-
      Voor de schulden der vereniging zijn zij die appartementseigenaar waren ten tijde van het ontstaan van de schuld,
      met de vereniging hoofdelijk verbonden, en wel, indien de prestatie deelbaar is, ieder voor een deel in de
      verhouding bedoeld in lid 2.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel113
  - number: '114.1'
    text: |-
      Rust op het ogenblik van de inschrijving van de akte van splitsing een hypotheek, een beslag of een voorrecht op
      alle in de splitsing betrokken registergoederen, dan rust dit verband, beslag of voorrecht van dat ogenblik af op
      elk der appartementsrechten voor de gehele schuld.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel114
  - number: '114.2'
    text: |-
      Rust op het ogenblik van de inschrijving van de akte van splitsing een hypotheek, een beslag of een voorrecht
      op slechts een deel van de registergoederen, dan blijft de bevoegdheid tot uitwinning van dit deel ondanks de
      splitsing bestaan; door de uitwinning wordt met betrekking tot dat deel de splitsing beëindigd.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel114
  - number: '114.3'
    text: |-
      Een recht van erfdienstbaarheid, erfpacht, opstal of vruchtgebruik, dat op dat ogenblik van de inschrijving van de
      akte van splitsing rust op de registergoederen of een deel daarvan, bestaat daarna ongewijzigd voort.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel114
  - number: '115.1'
    text: |-
      Wanneer een recht van erfpacht of opstal in de splitsing wordt betrokken, wordt de canon of retributie die daarna
      opeisbaar wordt, over de appartementsrechten verdeeld in een verhouding als bedoeld in [artikel 113 lid 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel113
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '113'
        afdeling: '1'
  - number: '115.2'
    text: |-
      De vereniging van eigenaars is hoofdelijk verbonden voor de door een of meer appartementseigenaars verschuldigde
      canon of retributie.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel115
  - number: '116.1'
    text: |-
      Wanneer een recht van erfpacht of opstal in de splitsing betrokken is, geldt ter aanvulling van de
      [artikelen 87 leden 2 en 3][ref1] en [88][ref2] het in de volgende leden bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel88
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '87'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '88'
  - number: '116.2'
    text: |-
      Opzegging van het recht wegens verzuim in de betaling van de canon of retributie kan slechts geschieden, wanneer de
      gehele canon of retributie over twee achtereenvolgende jaren onbetaald is gebleven.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel116
  - number: '116.3'
    text: |-
      Rust op een of meer appartementsrechten een beperkt recht of een beslag dan zijn
      [artikel 87 lid 2, tweede zin][ref1], en [artikel 88 lid 2][ref2] mede van overeenkomstige toepassing met
      betrekking tot dit beperkte recht of dit beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel88
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '87'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '88'
  - number: '116.4'
    text: |-
      Is het voor een appartementsrecht verschuldigde deel van de canon of retributie over de twee achtereenvolgende
      jaren onbetaald gebleven, dan kan het appartementsrecht door de rechter op vordering van de grondeigenaar aan
      deze worden toegewezen. De dagvaarding moet op straffe van niet-ontvankelijkheid binnen acht dagen worden betekend
      aan hen die als beperkt gerechtigde of beslaglegger op het appartementsrecht in de openbare registers staan
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel116
  - number: '116.5'
    text: |-
      Door inschrijving in de openbare registers van het vonnis waarbij de toewijzing is uitgesproken, gaat het
      appartementsrecht op de grondeigenaar over en gaan de daarop rustende beperkte rechten en beslagen teniet. Deze
      inschrijving geschiedt niet, voordat het vonnis in kracht van gewijsde is gegaan. Na deze inschrijving is de
      grondeigenaar verplicht de waarde die het appartementsrecht heeft op het tijdstip van de inschrijving aan de
      gewezen appartementseigenaar te vergoeden, na aftrek van hetgeen hij uit hoofde van de erfpacht van de gewezen
      appartementseigenaar te vorderen heeft, de kosten daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel116
  - number: '116.6'
    text: |-
      In de akte van vestiging kan worden aangegeven op welke wijze de waarde als bedoeld in het vorige lid zal worden
      bepaald.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel116
  - number: '116.7'
    text: Ieder beding dat ten nadele van een appartementseigenaar van dit artikel afwijkt, is nietig.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel116
  - number: '117.1'
    text: |-
      Een appartementsrecht kan als een zelfstandig registergoed worden overgedragen, toegedeeld, bezwaard en
      uitgewonnen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel117
  - number: '117.2'
    text: |-
      Onverminderd het in [artikel 114 lid 2][ref1] bepaalde kunnen goederen die in de splitsing betrokken zijn niet
      geheel of voor een deel worden overgedragen, verdeeld, bezwaard of uitgewonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel114
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '114'
        afdeling: '1'
  - number: '117.3'
    text: |-
      Beëindiging van de splitsing met betrekking tot een gedeelte van de in de splitsing betrokken registergoederen kan
      slechts geschieden door wijziging van de akte van splitsing.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel117
  - number: '117.4'
    text: |-
      In afwijking van lid 2 kunnen in de splitsing betrokken onroerende zaken door de gezamenlijke appartementseigenaars
      belast worden met een erfdienstbaarheid.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel117
  - number: '118.1'
    text: |-
      Een appartementseigenaar kan, voor zover in de akte van splitsing niet anders is bepaald, zonder medewerking van
      de overige appartementseigenaars op het gedeelte van de onroerende zaken dat bestemd is om als afzonderlijk geheel
      door hem te worden gebruikt, een erfdienstbaarheid vestigen ten behoeve van een ander gedeelte van die zaken of van
      een andere onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel118
  - number: '118.2'
    text: |-
      Een appartementseigenaar kan, voor zover in de akte van splitsing niet anders is bepaald, zonder medewerking van
      de overige appartementseigenaars de vestiging van een erfdienstbaarheid die uitsluitend strekt ten behoeve van een
      gedeelte van de onroerende zaken dat bestemd is om als afzonderlijk geheel door hem te worden gebruikt, aannemen en
      van zodanige erfdienstbaarheid afstand doen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel118
  - number: '118.3'
    text: |-
      De in dit artikel bedoelde erfdienstbaarheden gaan teniet, wanneer de bevoegdheid tot uitsluitend gebruik van het
      gedeelte dat met de erfdienstbaarheid is belast of ten behoeve waarvan de erfdienstbaarheid is bedongen eindigt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel118
  - number: 118a.1
    text: |-
      Een appartementseigenaar kan, voor zover in de akte van splitsing niet anders is bepaald, zonder medewerking van de
      overige appartementseigenaars en beperkt gerechtigden op het gedeelte van de onroerende zaken dat bestemd is om als
      afzonderlijk geheel door hem te worden gebruikt, een recht van erfpacht en, behoudens voor zover het betreft in de
      splitsing betrokken gebouwen, werken en beplantingen, een recht van opstal vestigen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel118a
  - number: 118a.2
    text: |-
      In de akte van vestiging van het recht wordt bepaald in hoeverre de gerechtigde naast de appartementseigenaar
      hoofdelijk aansprakelijk is voor de ter zake van het appartementsrecht verschuldigde bijdragen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel118a
  - number: 118a.3
    text: |-
      Tenzij bij de vestiging van het recht van erfpacht anders wordt bepaald, wordt het aan een appartementsrecht
      verbonden stemrecht in de vergadering van eigenaars uitgeoefend door de erfpachter. Tenzij bij de vestiging van het
      recht van opstal anders wordt bepaald, behoudt de appartementseigenaar die een recht van opstal heeft gevestigd,
      het aan zijn appartementsrecht verbonden stemrecht in de vergadering van eigenaars.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel118a
  - number: '119.1'
    text: |-
      Een appartementseigenaar mag zonder toestemming van de overige appartementseigenaars in een gedeelte dat bestemd
      is om als afzonderlijk geheel door hem te worden gebruikt, veranderingen aanbrengen, mits deze geen nadeel aan een
      ander gedeelte toebrengen. Van hetgeen hij bij een geoorloofde verandering wegneemt wordt hij enig eigenaar.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel119
  - number: '119.2'
    text: |-
      Hij is verplicht de vereniging van eigenaars onverwijld van een verandering kennis te geven. Leidt de verandering
      tot een wijziging van de verzekeringspremie, dan komt het verschil voor rekening van hem en zijn rechtsopvolgers.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel119
  - number: '119.3'
    text: |-
      Blijkt ten gevolge van een verandering de waarde van de in de splitsing betrokken goederen bij de opheffing van
      de splitsing te zijn verminderd, dan wordt hiermede, ook al was de verandering geoorloofd, bij de verdeling van de
      gemeenschap rekening gehouden ten laste van hem die de verandering heeft aangebracht of zijn rechtsopvolger.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel119
  - number: '119.4'
    text: |-
      Bij het reglement kan van dit artikel worden afgeweken en kunnen voor de toepassing van lid 2 wijzigingen in de
      wijze van gebruik met veranderingen worden gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel119
  - number: '120.1'
    text: |-
      Onverminderd het in [artikel 112 lid 4][ref1] bepaalde is een appartementseigenaar bevoegd het gedeelte dat bestemd
      is om als afzonderlijk geheel door hem te worden gebruikt, zelf te gebruiken of aan een ander in gebruik te geven,
      met inbegrip van het hem toekomende medegebruik van de gedeelten die niet bestemd zijn om als afzonderlijk geheel
      te worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel112
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '112'
        afdeling: '1'
  - number: '120.2'
    text: |-
      Voorschriften van het reglement omtrent gebruik, beheer en onderhoud zijn ook van toepassing op degeen die het
      gebruik verkrijgt. Andere bepalingen van het reglement kunnen in het reglement op de gebruiker van toepassing
      worden verklaard.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel120
  - number: '120.3'
    text: |-
      Ten aanzien van een huurder geldt een na het tot stand komen van de huurovereenkomst ingeschreven
      reglementsbepaling niet, tenzij hij daarin heeft toegestemd. Weigert hij zijn toestemming of verklaart hij zich
      niet, dan kan de kantonrechter van de rechtbank van het arrondissement waarin het gebouw of het grootste deel
      daarvan is gelegen, op verzoek van iedere appartementseigenaar beslissen dat de reglementsbepaling ten aanzien van
      de huurder komt te gelden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel120
  - number: '120.4'
    text: |-
      Na opheffing van de splitsing zijn de gerechtigden tot de goederen die in de splitsing waren betrokken, verplicht
      een verhuur gestand te doen, mits de tijd van de verhuur in overeenstemming is met het plaatselijk gebruik en de
      verhuur niet op ongewone, voor hen bezwarende voorwaarden is geschied.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel120
  - number: '121.1'
    text: |-
      In alle gevallen waarin een appartementseigenaar voor het verrichten van een bepaalde handeling met betrekking
      tot de gedeelten die niet bestemd zijn als afzonderlijk geheel gebruikt te worden en, in het geval van een beding
      als bedoeld in [artikel 112 lid 4][ref1], met betrekking tot gedeelten die bestemd zijn als afzonderlijk geheel
      gebruikt te worden, medewerking of toestemming behoeft van een of meer andere appartementseigenaars, van de
      vereniging van eigenaars of van haar organen, of waarin de vereniging of haar organen voor het verrichten van
      zodanige handeling toestemming behoeven van een of meer appartementseigenaars, kan die medewerking of toestemming
      op verzoek van degeen die haar behoeft, worden vervangen door een machtiging van de kantonrechter van de rechtbank
      van het arrondissement waarin het gebouw of het grootste gedeelte daarvan is gelegen. De machtiging kan worden
      verleend, indien de medewerking of toestemming zonder redelijke grond wordt geweigerd of degene die haar moet geven
      zich niet verklaart.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel112
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '112'
        afdeling: '1'
  - number: '121.2'
    text: |-
      Gaat de handeling met kosten gepaard, dan kan de kantonrechter op verzoek van een appartementseigenaar of van de
      vereniging van eigenaars tevens bepalen in welke verhouding alle of bepaalde appartementseigenaars of de vereniging
      van eigenaars in de kosten moeten bijdragen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel121
  - number: '121.3'
    text: |-
      Betreft het de aanbrenging van een nieuw werk of nieuwe installatie, dan kan de kantonrechter desverzocht ook
      een regeling vaststellen, bepalende dat en in welke verhouding de appartementseigenaars van alle of bepaalde
      appartementsrechten de kosten van onderhoud van het werk of de installatie in de toekomst zullen dragen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel121
  - number: '122.1'
    text: |-
      Overgang onder bijzondere titel of toedeling van een appartementsrecht omvat, voor zover niet anders is bepaald,
      mede de als appartementseigenaar verkregen rechten.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel122
  - number: '122.2'
    text: |-
      Na de overgang of toedeling moet de verkrijger onverwijld schriftelijk aan de vereniging van eigenaars mededeling
      doen van zijn verkrijging.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel122
  - number: '122.3'
    text: |-
      Voor de ter zake van het verkregene verschuldigde bijdragen die in het lopende of het voorafgaande boekjaar
      opeisbaar zijn geworden of nog zullen worden, zijn de verkrijger en de vroegere appartementseigenaar hoofdelijk
      aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel122
  - number: '122.4'
    text: |-
      In het reglement kan worden bepaald in hoeverre voor bijdragen, genoemd in het vorige lid, alleen de vroegere
      eigenaar of alleen de verkrijger aansprakelijk zal zijn. In het reglement kan ook worden bepaald dat voor bepaalde
      bijdragen die later opeisbaar worden de vroegere appartementseigenaar in plaats van de verkrijger verbonden zal
      zijn.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel122
  - number: '122.5'
    text: |-
      De notaris draagt zorg dat aan de akte van overdracht of toedeling een door het bestuur van de vereniging van
      eigenaars afgegeven verklaring wordt gehecht, die met betrekking tot de in lid 3 genoemde bijdragen waarvoor de
      verkrijger aansprakelijk zal zijn, een opgave inhoudt van hetgeen de betrokken appartementseigenaar op de dag
      van de overdracht of toedeling aan de vereniging schuldig is. De verkrijger is jegens de vereniging niet verder
      aansprakelijk dan tot het bedrag dat uit de opgave blijkt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel122
  - number: '122.6'
    text: |-
      De verklaring houdt tevens een opgave in van de omvang van het reservefonds van de vereniging, bedoeld in
      [artikel 126 lid 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel126
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '126'
        afdeling: '2'
  - number: '123.1'
    text: |-
      In geval van vruchtgebruik van een appartementsrecht treedt de vruchtgebruiker in de plaats van de
      appartementseigenaar ten aanzien van de aansprakelijkheid voor de gezamenlijke schulden en de aan de gezamenlijke
      appartementseigenaars en de vereniging van eigenaars verschuldigde bijdragen. De vruchtgebruiker is echter bevoegd
      de door hem betaalde bedragen, voor zover zij niet betrekking hebben op de gewone lasten en herstellingen, bij het
      einde van het vruchtgebruik van de appartementseigenaar terug te vorderen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel123
  - number: '123.2'
    text: |-
      Wanneer de appartementseigenaar schulden of bijdragen als bedoeld in lid 1 heeft voldaan, kan hij van
      de vruchtgebruiker vorderen dat deze hem de betaalde bedragen, vermeerderd met de rente vanaf de dag der
      betaling, teruggeeft voor zover zij op gewone lasten en herstellingen betrekking hebben. Van de andere door de
      appartementseigenaar betaalde bedragen is de vruchtgebruiker slechts de rente van de dag der betaling tot het einde
      van het vruchtgebruik verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel123
  - number: '123.3'
    text: |-
      Tenzij bij de instelling van het vruchtgebruik anders wordt bepaald wordt het aan een appartementsrecht verbonden
      stemrecht in de vergadering van eigenaars uitgeoefend door de vruchtgebruiker.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel123
  - number: '123.4'
    text: |-
      [Artikel 122][ref1] is van overeenkomstige toepassing bij de vestiging, bij overdracht en bij het einde van het
      vruchtgebruik van een appartementsrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel122
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '122'
        afdeling: '1'
  - number: '124.1'
    text: De vereniging van eigenaars is een rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel124
  - number: '124.2'
    text: |-
      [Titel 1 van Boek 2][ref1] is van toepassing behoudens de [artikelen 4][ref2], [6][ref3], [13 lid 2][ref4],
      [17][ref5], [18][ref6], [19 leden 1-3, lid 4, tweede zin, lid 6, tweede zin, en lid 7][ref7], [20][ref8],
      [21][ref9] en [22][ref10] en met inachtneming van de in de volgende artikelen van de onderhavige titel aangegeven
      afwijkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Artikel18
      [ref7]: https://wetten.overheid.nl/BWBR0003045#Artikel19
      [ref8]: https://wetten.overheid.nl/BWBR0003045#Artikel20
      [ref9]: https://wetten.overheid.nl/BWBR0003045#Artikel21
      [ref10]: https://wetten.overheid.nl/BWBR0003045#Artikel22
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '13'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '17'
      - id: ref6
        bwb_id: BWBR0003045
        artikel: '18'
      - id: ref7
        bwb_id: BWBR0003045
        artikel: '19'
      - id: ref8
        bwb_id: BWBR0003045
        artikel: '20'
      - id: ref9
        bwb_id: BWBR0003045
        artikel: '21'
      - id: ref10
        bwb_id: BWBR0003045
        artikel: '22'
  - number: '124.3'
    text: |-
      [Titel 2 van Boek 2][ref1] is slechts van toepassing voor zover de onderhavige afdeling daarnaar verwijst.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '125.1'
    text: |-
      Aan de vergadering van eigenaars komen in de vereniging alle bevoegdheden toe, die niet door wet of statuten aan
      andere organen zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel125
  - number: '125.2'
    text: |-
      Iedere appartementseigenaar is van rechtswege lid van de vereniging van eigenaars. Wanneer een lid ophoudt
      appartementseigenaar te zijn, eindigt zijn lidmaatschap van rechtswege.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel125
  - number: '125.3'
    text: |-
      [Artikel 40 lid 2 van Boek 2][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel40
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '40'
  - number: '126.1'
    text: |-
      De vereniging van eigenaars voert het beheer over de gemeenschap, met uitzondering van de gedeelten die bestemd
      zijn als afzonderlijk geheel te worden gebruikt. De vereniging houdt een reservefonds in stand ter bestrijding van
      andere dan de gewone jaarlijkse kosten.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel126
  - number: '126.2'
    text: |-
      De vereniging kan binnen de grenzen van haar bevoegdheid de gezamenlijke appartementseigenaars in en buiten rechte
      vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel126
  - number: '126.3'
    text: |-
      De vereniging ziet toe op de nakoming van de verplichtingen die voor de appartementseigenaars uit het bij of
      krachtens de wet en het reglement bepaalde jegens elkander voortvloeien en kan te dien einde in rechte tegen hen
      optreden. Onder appartementseigenaars wordt hier begrepen hij die een gebruiksrecht aan een appartementseigenaar
      ontleent.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel126
  - number: '127.1'
    text: |-
      Alle appartementseigenaars hebben toegang tot de vergadering van eigenaars. De besluiten worden genomen bij
      volstrekte meerderheid van de uitgebrachte stemmen, voor zover de statuten niet anders bepalen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel127
  - number: '127.2'
    text: |-
      Tenzij de statuten anders bepalen, wordt de voorzitter van de vergadering van eigenaars door de vergadering uit
      de leden der vereniging benoemd. Zowel de voorzitter als het bestuur van de vereniging zijn bevoegd de vergadering
      bijeen te roepen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel127
  - number: '127.3'
    text: |-
      In geval van ondersplitsing komen de stemmen van de appartementseigenaar wiens recht is gesplitst, toe aan de
      gerechtigden tot de door de ondersplitsing ontstane appartementsrechten. Deze stemmen worden in de vergadering
      van eigenaars uitgebracht door het bestuur van de bij de ondersplitsing opgerichte vereniging van eigenaars. De
      stemmen behoeven niet eensluidend te worden uitgebracht. De gerechtigden tot de door de ondersplitsing ontstane
      appartementsrechten zijn bevoegd de vergadering van eigenaars bij te wonen. Het bestuur, bedoeld in de tweede zin,
      is bevoegd om in de vergadering het woord te voeren.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel127
  - number: '128.1'
    text: |-
      De vergadering van eigenaars is bevoegd regels te stellen betreffende het gebruik van de gedeelten die niet bestemd
      zijn als afzonderlijk geheel te worden gebruikt, voor zover het reglement daarover geen bepalingen bevat.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel128
  - number: '128.2'
    text: |-
      Iedere appartementseigenaar kan een gebruiker vragen te verklaren of hij bereid is een in het vorige lid bedoelde
      regel na te leven. Is de gebruiker daartoe niet bereid of verklaart hij zich niet, dan kan de kantonrechter
      binnen wiens rechtsgebied het gebouw of het grootste gedeelte daarvan is gelegen, op verzoek van iedere
      appartementseigenaar beslissen dat de regel ten aanzien van de gebruiker komt te gelden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel128
  - number: '129.1'
    text: |-
      Voor de toepassing van [artikel 14 van Boek 2][ref1] wordt de akte van splitsing gelijkgesteld met de statuten.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel14
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '14'
  - number: '129.2'
    text: |-
      Voor de toepassing van [artikel 15 lid 1 onder ][ref1] geldt het reglement dat krachtens [artikel 111 onder ][ref2]
      deel van de akte van splitsing uitmaakt, niet als een reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel111
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '111'
        afdeling: '1'
  - number: '130.1'
    text: |-
      In afwijking van [artikel 15 lid 3 van Boek 2][ref1] geschiedt de vernietiging van een besluit van een orgaan van
      de vereniging van eigenaars door een uitspraak van de kantonrechter van de rechtbank van het arrondissement waarin
      het gebouw of het grootste gedeelte daarvan is gelegen, op verzoek van degene die de vernietiging krachtens dit lid
      kan vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel15
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '15'
  - number: '130.2'
    text: |-
      Het verzoek tot vernietiging moet worden gedaan binnen een maand na de dag waarop de verzoeker van het besluit
      heeft kennis genomen of heeft kunnen kennis nemen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel130
  - number: '130.3'
    text: |-
      De verzoeker, alle andere stemgerechtigden en de vereniging van eigenaars worden bij name opgeroepen om op het
      verzoek te worden gehoord. Hoger beroep kan slechts worden ingesteld binnen een maand na de dagtekening der
      eindbeschikking.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel130
  - number: '130.4'
    text: |-
      De rechter voor wie het verzoek aanhangig is, is bevoegd het besluit te schorsen totdat op het verzoek
      onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel130
  - number: '131.1'
    text: |-
      Het bestuur van de vereniging wordt gevormd door één bestuurder, tenzij de statuten bepalen dat er twee of meer
      zullen zijn. In het laatste geval wordt de vereniging, voor zover in de statuten niet anders is bepaald, tegenover
      derden door ieder der bestuurders vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel131
  - number: '131.2'
    text: |-
      Het bestuur wordt door de vergadering van eigenaars, al dan niet uit de leden, benoemd en kan te allen tijde door
      haar worden geschorst of ontslagen. Een veroordeling tot herstel van de dienstbetrekking tussen de vereniging en
      een bestuurder kan door de rechter niet worden uitgesproken.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel131
  - number: '131.3'
    text: |-
      Voor zover de statuten niet anders bepalen, beheert het bestuur de middelen der vereniging en draagt het zorg voor
      de tenuitvoerlegging van de besluiten van de vergadering van eigenaars.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel131
  - number: '131.4'
    text: |-
      Bij besluit van de vergadering van eigenaars kan van het vorige lid worden afgeweken en kunnen aan het bestuur
      aanwijzingen met betrekking tot de uitoefening van zijn taak worden gegeven. Deze besluiten kunnen niet worden
      ingeroepen tegen de wederpartij, tenzij zij haar bekend waren of behoorden te zijn.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel131
  - number: '132'
    text: |-
      De appartementseigenaars en de gebruikers van de voor het gebruik als afzonderlijk geheel bestemde gedeelten zijn
      verplicht een bestuurder en door hem aan te wijzen personen toegang tot die gedeelten te verschaffen, wanneer dit
      voor de vervulling van de taak van het bestuur noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel132
  - number: '133.1'
    text: |-
      Bij belet of ontstentenis van het bestuur wordt dit vervangen door de voorzitter van de vergadering van eigenaars,
      tenzij in de statuten of door de vergadering een andere voorziening is getroffen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel133
  - number: '133.2'
    text: |-
      In gevallen waarin de vereniging of de gezamenlijke appartementseigenaars een belang hebben, tegenstrijdig met
      dat van een bestuurder, treedt de voorzitter van de vergadering van eigenaars bij belet of ontstentenis van andere
      bestuurders eveneens in de plaats van het bestuur.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel133
  - number: '134.1'
    text: |-
      Exploiten en kennisgevingen, gericht tot de gezamenlijke appartementseigenaars, kunnen aan de persoon of de
      woonplaats van een bestuurder van de vereniging worden gedaan; zij behoeven dan niet de namen en de woonplaatsen
      van de appartementseigenaars te bevatten.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel134
  - number: '134.2'
    text: De bestuurder deelt de appartementseigenaars onverwijld de inhoud van het exploit of de kennisgeving mede.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel134
  - number: '135'
    text: |-
      De [artikelen 45 lid 4][ref1] en [48 van Boek 2][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel48
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '48'
  - number: '136.1'
    text: |-
      Hij, die krachtens het reglement verplicht is het gebouw te doen verzekeren, vertegenwoordigt de gezamenlijke
      appartementseigenaars bij de uitoefening van de rechten die uit de verzekeringsovereenkomst voortvloeien, en voert
      voor hen het beheer over de ontvangen verzekeringspenningen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel136
  - number: '136.2'
    text: |-
      Zodra tot herstel is besloten, worden de verzekeringspenningen tot dit doel aangewend, met dien verstande dat
      de verhouding van de waarde van de appartementsrechten na het herstel dezelfde moet zijn als tevoren. Bij de
      berekening van die waarde mag echter geen rekening worden gehouden met veranderingen die een appartementseigenaar
      in het gedeelte dat bestemd is om als afzonderlijk geheel door hem te worden gebruikt, heeft aangebracht, tenzij
      hij hiervan tijdig aan de vereniging van eigenaars had kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel136
  - number: '136.3'
    text: |-
      Herstel van schade aan gedeelten die bestemd zijn om als afzonderlijk geheel te worden gebruikt, geschiedt zoveel
      mogelijk volgens de aanwijzingen van de appartementseigenaars die het aangaat.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel136
  - number: '136.4'
    text: |-
      Uitkering aan ieder der appartementseigenaars van het hem toekomende aandeel in de assurantiepenningen geschiedt
      slechts:
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel136
  - number: 136.4.a
    text: indien na het herstel van de schade een overschot aanwezig blijkt te zijn;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel136
  - number: 136.4.b
    text: |-
      indien drie maanden zijn verlopen nadat de vergadering van eigenaars heeft besloten van herstel of verder herstel
      af te zien;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel136
  - number: 136.4.c
    text: in geval van opheffing van de splitsing.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel136
  - number: '136.5'
    text: Van het bepaalde in dit artikel kan in het reglement worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel136
  - number: '138'
    text: |-
      Geschillen over herstel of de wijze van herstel beslist de kantonrechter van de rechtbank van het arrondissement
      waarin het gebouw of het grootste gedeelte daarvan is gelegen, op verzoek van de meest gerede partij. Hoger beroep
      kan slechts worden ingesteld binnen een maand na de dagtekening van de eindbeschikking.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel138
  - number: '139.1'
    text: De akte van splitsing kan worden gewijzigd met medewerking van alle appartementseigenaars.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel139
  - number: '139.2'
    text: |-
      De wijziging kan ook met medewerking van het bestuur geschieden, indien het tot de wijziging strekkende
      besluit is genomen in de vergadering van eigenaars met een meerderheid van ten minste vier vijfden van het
      aantal stemmen dat aan de appartementseigenaars toekomt of met een zodanige grotere meerderheid als in de akte
      van splitsing is bepaald. De termijn voor oproeping tot de vergadering bedraagt ten minste vijftien dagen.
      [Artikel 42 leden 1, eerste zin, 2, eerste zin, en 3 van Boek 2][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel42
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '42'
  - number: '139.3'
    text: |-
      Wijziging van de akte van splitsing behoeft de toestemming van hen die een beperkt recht op een appartementsrecht
      hebben, van hen die daarop beslag hebben gelegd alsmede, indien een recht van erfpacht of opstal in de splitsing is
      betrokken, van de grondeigenaar. Ook is toestemming nodig van de gerechtigden tot een erfdienstbaarheid, indien hun
      recht door de wijziging wordt verkort.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel139
  - number: '139.4'
    text: |-
      Indien de wijziging uitsluitend betrekking heeft op het reglement, is de toestemming van de beslagleggers niet
      nodig.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel139
  - number: '139.5'
    text: |-
      De wijziging geschiedt door een daartoe bestemde notariële akte, gevolgd door inschrijving van die akte in de
      openbare registers. Indien de wijziging betrekking heeft op de begrenzing van gedeelten van het gebouw of de grond
      die bestemd zijn als afzonderlijk geheel te worden gebruikt, is [artikel 109 lid 2][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel109
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '109'
        afdeling: '1'
  - number: '140.1'
    text: |-
      Indien een of meer der in de [leden 1 en 3 van het vorige artikel][ref1] genoemden zich niet verklaren of zonder
      redelijke grond weigeren hun medewerking of toestemming te verlenen, kan deze worden vervangen door een machtiging
      van de kantonrechter van de rechtbank van het arrondissement waarin het gebouw of het grootste gedeelte daarvan
      is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel139
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '139'
        afdeling: '4'
  - number: '140.2'
    text: |-
      De machtiging kan slechts worden verleend op verzoek van een of meer appartementseigenaars aan wie ten minste de
      helft van het aantal stemmen in de vergadering van eigenaars toekomt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel140
  - number: '140.3'
    text: |-
      De machtiging kan ook op verzoek van twee appartementseigenaars, of op verzoek van een appartementseigenaar aan
      wie verschillende appartementsrechten toebehoren worden verleend, wanneer de wijziging uitsluitend strekt tot
      een verandering van de onderlinge begrenzing der gedeelten die bestemd zijn door hen als afzonderlijk geheel te
      worden gebruikt, al dan niet gepaard gaande met een verandering in de onderlinge verhouding van hun aandelen in de
      goederen die in de splitsing zijn betrokken, of van hun bijdragen in de schulden en kosten die ingevolge de wet of
      het reglement voor rekening van de gezamenlijke appartementseigenaars komen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel140
  - number: '140.4'
    text: |-
      Alle personen wier medewerking of toestemming ingevolge [artikel 139][ref1] is vereist, worden bij name opgeroepen
      om op een verzoek als in de vorige leden bedoeld te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel139
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '139'
        afdeling: '4'
  - number: 140a.1
    text: |-
      Op vordering van een appartementseigenaar die niet voor een overeenkomstig [artikel 139 lid 2][ref1] bij
      meerderheid van stemmen genomen besluit tot wijziging van de akte van splitsing heeft gestemd, wordt het besluit
      bij rechterlijke uitspraak vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel139
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel140a
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '139'
        afdeling: '4'
  - number: 140a.2
    text: |-
      De bevoegdheid om vernietiging te vorderen verjaart door verloop van drie maanden, welke termijn begint met de
      aanvang van de dag, volgende op die waarop het besluit door de vergadering van eigenaars is genomen.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel140a
  - number: 140a.3
    text: |-
      De rechter kan de vordering afwijzen, wanneer de eiser geen schade lijdt of hem een redelijke schadeloosstelling
      wordt aangeboden en voor de betaling hiervan voldoende zekerheid is gesteld.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel140a
  - number: '141.1'
    text: |-
      Bij gebreke van de in de [artikelen 139][ref1] en [140][ref2] bedoelde toestemming of daarvoor in de plaats
      tredende machtiging wordt de wijziging vernietigd bij rechterlijke uitspraak op vordering van degeen wiens
      toestemming achterwege is gebleven.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel140
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '139'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '140'
        afdeling: '4'
  - number: '141.2'
    text: |-
      De bevoegdheid om vernietiging te vorderen verjaart door verloop van een jaar, welke termijn begint met de aanvang
      van de dag, volgende op die waarop degeen die de vernietiging kan vorderen kennis heeft genomen van de wijziging
      dan wel hem schriftelijk van die wijziging mededeling is gedaan.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel141
  - number: '141.3'
    text: |-
      De rechter kan de vordering afwijzen, wanneer de eiser geen schade lijdt of hem een redelijke schadeloosstelling
      wordt aangeboden en voor de betaling hiervan voldoende zekerheid is gesteld.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel141
  - number: '142.1'
    text: |-
      Beperkte rechten en beslagen, waarmee de appartementsrechten zijn belast, rusten na de wijziging van de akte van
      splitsing op de gewijzigde appartementsrechten, tenzij de akte van wijziging anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel142
  - number: '142.2'
    text: Voorrechten blijven na de wijziging bestaan.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel142
  - number: '143.1'
    text: 'De splitsing wordt van rechtswege opgeheven:'
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel143
  - number: 143.1.a
    text: |-
      bij het eindigen van een in de splitsing betrokken recht van erfpacht of opstal, wanneer naast dit recht geen
      andere registergoederen in de splitsing betrokken zijn en de beëindiging niet gepaard gaat met de vestiging van een
      nieuw recht van erfpacht of opstal van de appartementseigenaars op dezelfde onroerende zaak;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel143
  - number: 143.1.b
    text: |-
      door inschrijving in de openbare registers van het vonnis waarbij een in de splitsing betrokken kadastraal perceel
      in zijn geheel is onteigend, wanneer geen andere percelen in de splitsing betrokken zijn.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel143
  - number: '143.2'
    text: |-
      In alle andere gevallen geschiedt de opheffing van de splitsing door een daartoe bestemde notariële akte,
      gevolgd door inschrijving van die akte in de openbare registers. De [artikelen 139 leden 1 en 3][ref1],
      [140 leden 1, 2 en 4][ref2] en [141][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel141
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '139'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '140'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005288
        artikel: '141'
        afdeling: '4'
  - number: '144.1'
    text: |-
      Op verzoek van een persoon wiens medewerking of toestemming tot de wijziging van de akte van splitsing of tot
      opheffing van de splitsing is vereist, kan de kantonrechter van de rechtbank van het arrondissement waarin het
      gebouw of het grootste gedeelte daarvan is gelegen, bevelen dat de akte van splitsing wordt gewijzigd dan wel de
      splitsing wordt opgeheven:
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel144
  - number: 144.1.a
    text: |-
      wanneer de akte van splitsing niet voldoet aan de in de [artikelen 111][ref1] en [112][ref2] gestelde vereisten;


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel112
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '111'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '112'
        afdeling: '1'
  - number: 144.1.b
    text: |-
      wanneer uit de inrichting van de gedeelten van het gebouw of uit de inrichting of aanduiding van de gedeelten van
      de grond die bestemd zijn als afzonderlijk geheel te worden gebruikt, deze bestemming niet blijkt;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel144
  - number: 144.1.c
    text: |-
      wanneer de bouw of inrichting van het gebouw dan wel de inrichting of aanduiding van de grond niet of niet meer
      beantwoordt aan de omschrijving in de akte van splitsing;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel144
  - number: 144.1.d
    text: |-
      in geval van splitsing met toepassing van [artikel 107][ref1], wanneer de stichting of de gewijzigde inrichting van
      het gebouw niet binnen een termijn van drie jaren te rekenen vanaf de dag van de inschrijving is voltooid;


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel107
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '107'
        afdeling: '1'
  - number: 144.1.e
    text: |-
      wanneer een recht van erfpacht of opstal dat naast een of meer andere registergoederen in de splitsing betrokken
      is, eindigt;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel144
  - number: 144.1.f
    text: |-
      wanneer een deel der in de splitsing betrokken registergoederen is uitgewonnen, een gedeelte van de kadastrale
      percelen is onteigend, of degene die de splitsing verricht heeft onbevoegd was over een deel der in de splitsing
      betrokken registergoederen te beschikken;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel144
  - number: 144.1.g
    text: |-
      wanneer het gebouw ernstig is beschadigd of geheel of gedeeltelijk is gesloopt, tenzij herstel binnen redelijke
      tijd is te verwachten;
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel144
  - number: 144.1.h
    text: wanneer alle appartementseigenaars zich bij een overeenkomst tot de wijziging of opheffing hebben verbonden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel144
  - number: '144.2'
    text: Aan de toewijzing van het verzoek kan de rechter voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel144
  - number: '144.3'
    text: |-
      [Artikel 140 lid 4][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel140
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '140'
        afdeling: '4'
  - number: '145.1'
    text: |-
      De appartementseigenaars zijn verplicht aan een bevel als bedoeld in het vorige artikel uitvoering te geven, zodra
      de beschikking in kracht van gewijsde is gegaan. De in de artikelen [139 leden 1 en 3][ref1] en [143 lid 2][ref2]
      bedoelde toestemming is in dit geval niet vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel143
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '139'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '143'
        afdeling: '4'
  - number: '145.2'
    text: |-
      Indien de kantonrechter met toepassing van [artikel 300 van Boek 3][ref1] een vertegenwoordiger heeft aangewezen,
      stelt hij op verzoek van de meest gerede partij of ambtshalve diens salaris vast; het salaris komt ten laste van
      de vertegenwoordigde.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel300
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '300'
  - number: '146'
    text: |-
      Beperkte rechten, beslagen en voorrechten op een appartementsrecht rusten na opheffing van de splitsing op het
      aandeel van de gewezen appartementseigenaar in de goederen die in de splitsing betrokken waren.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel146
  - number: '147.1'
    text: De vereniging van eigenaars wordt door opheffing van de splitsing van rechtswege ontbonden.
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel147
  - number: '147.2'
    text: |-
      De vereffening geschiedt met inachtneming van de volgende afwijkingen van de [artikelen 23-24 van Boek 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel23
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '23'
  - number: '147.3'
    text: |-
      De vereffenaar draagt hetgeen na voldoening der schuldeisers van het vermogen van de ontbonden vereniging is
      overgebleven, over aan hen die bij de opheffing van de splitsing appartementseigenaar waren, ieder voor een aandeel
      als bedoeld in [artikel 113 lid 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel113
    url: https://wetten.overheid.nl/BWBR0005288/2005-05-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '113'
        afdeling: '1'
  - number: '147.4'
    text: |-
      De [artikelen 23 lid 1, derde zin, en lid 4][ref1] en [23c, lid 1, van Boek 2][ref2] zijn niet van toepassing.
      De in [artikel 23b lid 4 van Boek 2][ref3] bedoelde nederlegging geschiedt binnen het arrondissement waar het
      gebouw of het grootste gedeelte daarvan is gelegen. In plaats van de in [artikel 24, lid 2, van Boek 2][ref4]
      en [artikel 995, eerste lid, tweede volzin, van het Wetboek van Burgerlijke Rechtsvordering][ref5] aangewezen
      rechter geldt als bevoegd diezelfde rechter binnen wiens rechtsgebied het gebouw of het grootste gedeelte daarvan
      is gelegen.


