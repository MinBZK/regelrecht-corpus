---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitvoeringsbeschikking_registratiewet_1970
regulatory_layer: WET
publication_date: '2013-10-14'
valid_from: '2013-03-12'
bwb_id: BWBR0002772
url: https://wetten.overheid.nl/BWBR0002772/2013-03-12
preamble:
  text: |-
    Gelet op de artikelen 1, 8 en 13 van de Registratiewet 1970 (Stb. 610) en artikel 6, tweede lid, van de Wet op het
    centraal testamentenregister (Stb. 1977, 25);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#ArtikelAanhef
articles:
  - number: '1'
    text: 'Deze beschikking verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel1
  - number: 1.a
    text: |-
      *wet:* [Registratiewet 1970][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002739
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002739
  - number: 1.b
    text: |-
      *inspecteur:* de landelijk directeuren en de directeur van de organisatieonderdelen, genoemd in
      [artikel 3, eerste lid, onderdelen a1 en a2, van de Uitvoeringsregeling Belastingdienst 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel3
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014506
        artikel: '3'
  - number: 1.c
    text: |-
      *inspectie:* een organisatieonderdeel als genoemd in
      [artikel 3, eerste lid, onderdelen a1 en a2, van de Uitvoeringsregeling Belastingdienst 2003][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel3
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014506
        artikel: '3'
  - number: '2'
    text: De in artikel 1 van de wet bedoelde registers worden gehouden door de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel2
  - number: '4'
    text: 'De aanbieding ter registratie geschiedt:'
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel4
  - number: 4.a
    text: |-
      van de in de [artikelen 3][ref1] en [4, eerste lid, van de wet][ref2] bedoelde akten bij de inspecteur onder wie de
      standplaats van de notaris ressorteert;


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002739#Artikel4
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002739
        artikel: '4'
  - number: 4.b
    text: |-
      van de onderhandse akten welke zijn opgemaakt op de voet van artikel II van de wet van 28 juni 1956 (Stb. 376),
      bij de inspecteur onder wie de vaste plaats ressorteert waarop de persoon die de akte heeft opgesteld, zijn beroep
      uitoefent;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel4
  - number: 4.c
    text: |-
      van andere akten bij een inspecteur ter keuze van de aanbieder, met inachtneming van de daartoe opengestelde
      kantoren door de Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel4
  - number: '6'
    text: Ten aanzien van de in de wet genoemde verplichtingen van notarissen is iedere inspecteur bevoegd.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel6
  - number: '7'
    text: |-
      De in [artikel 4][ref1] bedoelde inspecties zijn voor het aanbieden van de akten ter registratie dagelijks van 9.00
      uur tot 17.00 uur geopend, met uitzondering van de zaterdag, de zondag, algemeen erkende feestdagen in de zin van
      de [Algemene termijnenwet][ref2] en de bij of krachtens [artikel 3 van die wet][ref3] daarmee gelijkgestelde dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002772#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002448
      [ref3]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002772
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002448
      - id: ref3
        bwb_id: BWBR0002448
        artikel: '3'
  - number: '8.1'
    text: |-
      De registratie geschiedt in een van de registers Registratie nrs. 3, 4 of 5, bevattende 100 bladen, welke in
      overeenstemming zijn met de in de [bijlagen A][ref1], [B][ref2] en C opgenomen modellen. De bladen kunnen tevens
      andere kolommen of gegevens inhouden dan uit die modellen voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0002772
      [ref2]: https://wetten.overheid.nl/BWBR0002772
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002772
      - id: ref2
        bwb_id: BWBR0002772
  - number: '8.2'
    text: |-
      In het register Registratie nr. 3 worden geregistreerd de door een notaris opgemaakte akten, alsmede daaraan
      gehechte of daarin vermelde akten welke tegelijk met de notariële akte ter registratie worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel8
  - number: '8.3'
    text: |-
      In het register Registratie nr. 5 worden geregistreerd de akten van verhuring en verpachting welke niet vallen
      onder het tweede lid, tenzij de inspecteur om bijzondere redenen registratie in het register Registratie nr. 4
      gewenst acht.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel8
  - number: '8.4'
    text: |-
      In het register Registratie nr. 4 worden geregistreerd de akten welke niet vallen onder het tweede of het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel8
  - number: '9'
    text: |-
      Van de registers van Registratie kan aan de inspectie meer dan één deel tegelijk worden aangehouden. De delen
      worden per register doorlopend genummerd.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel9
  - number: '10'
    text: |-
      In de registers Registratie nrs. 3 en 4 wordt boven de eerste registratie betreffende de op eenzelfde dag aan de
      inspecteur aangeboden akten de datum van aanbieding vermeld en wel – met uitzondering van het jaartal – in letters.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel10
  - number: '11.1'
    text: 'De registratie in het register Registratie nr. 3 omvat voor elke akte ten minste:'
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel11
  - number: 11.1.a
    text: een per deel doorlopend volgnummer;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel11
  - number: 11.1.b
    text: het volgnummer waaronder de akte in het repertorium is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel11
  - number: 11.1.c
    text: de naam en de standplaats van de notaris;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel11
  - number: 11.1.d
    text: de aard van de akte;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel11
  - number: 11.1.e
    text: de naam, voorletters en woonplaats van ten minste één van de bij de akte optredende partijen;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel11
  - number: 11.1.f
    text: de dagtekening van de akte;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel11
  - number: 11.1.g
    text: |-
      het aantal exemplaren van de akte dat tegelijk ter registratie is aangeboden, indien dat aantal meer dan een
      bedraagt;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel11
  - number: 11.1.h
    text: het aantal bladen van de akte;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel11
  - number: 11.1.i
    text: het aantal in de akte aangebrachte renvooien;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel11
  - number: 11.1.j
    text: het aantal door middel van het ambtszegel van de notaris aangehechte akten (annexen), indien deze er zijn.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel11
  - number: '11.2'
    text: |-
      De akten welke zijn gehecht aan of vermeld in een door een notaris opgemaakte akte en tegelijk met die akte
      ter registratie worden aangeboden, worden geregistreerd onder hetzelfde volgnummer als de notariële akte onder
      toevoeging van de letter a, b en zo vervolgens.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel11
  - number: '12'
    text: |-
      De registratie in het register Registratie nr. 4 omvat voor elke akte ten minste de gegevens, bedoeld in
      [artikel 11, eerste lid, onderdelen a, d, e, g, h][ref1], en i.


      [ref1]: https://wetten.overheid.nl/BWBR0002772#Artikel11
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002772
        artikel: '11'
  - number: '13'
    text: |-
      De registratie in het register Registratie nr. 5 omvat voor elke akte, behalve de gegevens, bedoeld in
      [artikel 11, eerste lid, onderdelen a, g, h][ref1] en i, ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0002772#Artikel11
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002772
        artikel: '11'
  - number: 13.a
    text: de datum van aanbieding ter registratie en wel – met uitzondering van het jaartal – in letters;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel13
  - number: 13.b
    text: de naam, voorletters en adres van de verhuurder en huurder dan wel verpachter en pachter;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel13
  - number: 13.c
    text: een omschrijving van het verhuurde of verpachte;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel13
  - number: 13.d
    text: het tijdvak van de verhuring of verpachting en de datum van ingang;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel13
  - number: 13.e
    text: de bedongen huur- of pachtprijs.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel13
  - number: '14'
    text: |-
      Ingeval de akte niet of niet door alle daarin als ondertekenaren aangeduide personen is ondertekend, wordt dit bij
      de registratie vermeld.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel14
  - number: '15.1'
    text: |-
      Tegelijk ter registratie aangeboden gelijksoortige akten welke door dezelfde persoon zijn aangeboden of door
      dezelfde notaris zijn opgemaakt, kunnen te zamen worden geregistreerd onder een aantal volgnummers dat overeenkomt
      met het aantal akten. In dat geval worden de in de [artikelen 11][ref1], [12][ref2] en [13][ref3] bedoelde gegevens
      slechts eenmaal vermeld, voor zover deze voor de verschillende akten gelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002772#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002772#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0002772#Artikel13
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002772
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002772
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0002772
        artikel: '13'
  - number: '15.2'
    text: |-
      Het eerste lid blijft buiten toepassing ten aanzien van door een notaris opgemaakte akten, indien ter gelegenheid
      van de aanbieding ter registratie overdrachtsbelasting moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel15
  - number: '16'
    text: De registratie van een in de Friese of in een vreemde taal opgemaakte akte geschiedt in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel16
  - number: '17'
    text: 'Bij de registratie worden door de inspecteur:'
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel17
  - number: 17.a
    text: de in de akte aangebrachte renvooien gewaarmerkt;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel17
  - number: 17.b
    text: 'genummerd en gewaarmerkt:'
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel17
  - number: 17.b.1º
    text: de bladen ° van uit meer dan één blad bestaande akten;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel17
  - number: 17.b.2º
    text: de annexen.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel17
  - number: '18.1'
    text: |-
      De inspecteur stelt ten blijke van de registratie op de akte of, indien meer dan één exemplaar van de akte tegelijk
      ter registratie is aangeboden, op alle exemplaren een door hem ondertekende verklaring van registratie.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel18
  - number: '18.2'
    text: 'In de verklaring worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel18
  - number: 18.2.a
    text: de plaats en dagtekening van de registratie;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel18
  - number: 18.2.b
    text: het nummer en deel van het register waarin, alsmede het volgnummer waaronder de registratie heeft plaatsgehad;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel18
  - number: 18.2.c
    text: |-
      het aantal exemplaren van de akte dat tegelijk ter registratie is aangeboden, indien dat aantal meer dan een
      bedraagt;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel18
  - number: 18.2.d
    text: het aantal renvooien en annexen;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel18
  - number: 18.2.e
    text: |-
      de omstandigheid, bedoeld in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002772#Artikel14
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002772
        artikel: '14'
  - number: '18.3'
    text: |-
      Bij authentieke akten en annexen wordt de dagtekening van de registratie – met uitzondering van de maand – in
      cijfers vermeld; bij andere akten wordt die dagtekening – met uitzondering van de eeuw – in letters gesteld.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel18
  - number: '18.4'
    text: |-
      Voor zover voor het stellen van de verklaring op de akte geen voldoende open ruimte is, wordt zij gesteld op een
      aan de akte te hechten vel papier.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel18
  - number: '18.5'
    text: |-
      Ter zake van de voldoening van de kosten van registratie of van overdrachtsbelasting, indien deze ter gelegenheid
      van de aanbieding van de akte ter registratie moet worden voldaan, stelt de ontvanger een aantekening onder de
      verklaring van registratie.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel18
  - number: '19'
    text: 'Onder renvooien worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel19
  - number: 19.a
    text: |-
      bij een door een notaris opgemaakte akte de bijvoegingen, veranderingen en doorhalingen, welke met inachtneming van
      de wettelijke bepalingen zijn ondertekend of gewaarmerkt;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel19
  - number: 19.b
    text: |-
      bij een andere akte de bijvoegingen, veranderingen en doorhalingen, welke op de kant of aan de voet van de akte
      zijn vermeld, mits daarbij de plaats in de akte is aangegeven waarop zij betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel19
  - number: '20.1'
    text: |-
      De bladen van het repertorium van de notaris moeten door de inspecteur zijn genummerd en gewaarmerkt en hiervan
      moet door hem aan het hoofd van het repertorium een gedagtekende en ondertekende verklaring zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel20
  - number: '20.2'
    text: 'De inschrijvingen vermelden kolomsgewijs voor elke akte:'
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel20
  - number: 20.2.a
    text: een per jaar doorlopend volgnummer;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel20
  - number: 20.2.b
    text: de dagtekening,
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel20
  - number: 20.2.c
    text: de aard van de akte;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel20
  - number: 20.2.d
    text: de naam, voornamen en woonplaats van ten minste één van de bij de akte opgetreden partijen;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel20
  - number: 20.2.e
    text: of het een in minuut dan wel een in originali verleden akte betreft;
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel20
  - number: 20.2.f
    text: de dagtekening van de registratie, wanneer deze heeft plaatsgehad.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel20
  - number: '20.3'
    text: |-
      De inschrijvingen moeten duidelijk en zonder het openlaten van tussenruimten geschieden. Er mogen geen letters of
      cijfers uit worden weggeschrapt of op andere wijze uit worden verwijderd, geen overschrijvingen in geschieden en
      geen doorhalingen in worden aangebracht zonder dat het doorgehaalde behoorlijk leesbaar blijft.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel20
  - number: '20.4'
    text: Aan het begin van ieder jaar wordt een nieuw repertorium aangelegd.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel20
  - number: '20.5'
    text: |-
      Een opvolger van de notaris legt een nieuw repertorium aan; een plaatsvervanger zet het repertorium voor het
      lopende jaar voort.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel20
  - number: '20.6'
    text: |-
      De inspecteur stelt van de naziening, bedoeld in artikel 7, tweede lid, van de wet, een verklaring in het
      repertorium.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel20
  - number: '21'
    text: |-
      Als inspecteurs van de rijksbelastingen, bedoeld in
      [artikel 6, tweede lid, van de Wet op het centraal testamentenregister][ref1], worden
      aangewezen de landelijk directeuren en de directeur van de organisatieonderdelen, genoemd in
      [artikel 3, eerste lid, onderdelen a1 en a2, van de Uitvoeringsregeling Belastingdienst 2003][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003080#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014506#Artikel3
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003080
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014506
        artikel: '3'
  - number: '22.1'
    text: Deze beschikking treedt in werking met ingang van 1 januari 1972.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel22
  - number: '22.2'
    text: Deze beschikking kan worden aangehaald als Uitvoeringsbeschikking Registratiewet 1970.
    url: https://wetten.overheid.nl/BWBR0002772/2013-03-12#Artikel22
