  - number: '8'
    text: |-
      1 De Autoriteit Consument en Markt is belast met het toezicht op de naleving van het gestelde bij of krachtens
      deze wet.

      2 De Autoriteit Consument en Markt kan een bindende gedragslijn opleggen in verband met de naleving van het
      gestelde bij of krachtens deze wet.

      3 De Autoriteit Consument en Markt kan in geval van overtreding van het bepaalde bij of krachtens deze wet, met
      uitzondering van [artikel 3][ref1], de overtreder een last onder dwangsom opleggen.

      4 De Autoriteit Consument en Markt kan in geval van overtreding van het bij of krachtens de [artikelen 4][ref2],
      [5][ref3] en [7][ref4] bepaalde, de overtreder per overtreding een bestuurlijke boete opleggen van ten hoogste
      € 900.000 of, indien dat meer is, 1% van de omzet van de overtreder.


