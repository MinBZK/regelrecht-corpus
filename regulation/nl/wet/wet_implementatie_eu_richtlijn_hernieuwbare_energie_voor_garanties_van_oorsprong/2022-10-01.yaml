        artikel: '1'
  - number: '2'
    text: |-
      Een garantie van oorsprong voor ander gas uit hernieuwbare bronnen toont bij uitsluiting aan dat een producent de
      daarop aangegeven hoeveelheid van dat gas heeft opgewekt uit hernieuwbare bronnen of met energie uit hernieuwbare
      bronnen.
    url: https://wetten.overheid.nl/BWBR0046743/2022-10-01#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister is belast met het uitgeven, overdragen en innemen via een elektronisch systeem van garanties van
      oorsprong voor ander gas uit hernieuwbare bronnen.

      2 Onze Minister opent op aanvraag van een in Nederland gevestigde producent, leverancier, handelaar of de
      Nederlandse Emissieautoriteit, bedoeld in [artikel 2.1 van de Wet milieubeheer][ref1], een rekening voor
      garanties van oorsprong. Bij deze aanvraag overlegt de producent het resultaat van de vaststelling, bedoeld in
      [artikel 4][ref2].

      3 Onze Minister boekt op aanvraag garanties van oorsprong voor ander gas uit hernieuwbare bronnen op een daarbij
      aangegeven rekening voor garanties van oorsprong, indien een in Nederland gevestigde producent bij deze aanvraag de
      gegevens overlegt omtrent:

      a. de gemeten hoeveelheid ander gas uit hernieuwbare bronnen; of

      b. indien een producent gebruik maakt van conversie:

      1°. de gemeten hoeveelheid ander gas uit hernieuwbare bronnen;

      2°. de gemeten hoeveelheid energie uit hernieuwbare bronnen die is gebruikt voor de opwekking van de hoeveelheid,
      bedoeld onder 1°; en

      3°. het bewijs van afboeking of verzoek tot afboeking van garanties van oorsprong van een Nederlandse rekening voor
      garanties van oorsprong voor de gemeten hoeveelheid, bedoeld onder 2°.

      4 Onze Minister kan de taken, bedoeld in het eerst tot en met derde lid, mandateren aan een niet-ondergeschikte die
      onafhankelijk is van producenten, leveranciers en handelaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0046743#Artikel4
    url: https://wetten.overheid.nl/BWBR0046743/2022-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '2.1'
      - id: ref2
        bwb_id: BWBR0046743
        artikel: '4'
  - number: '4'
    text: |-
      Een meetbedrijf stelt op verzoek van een producent vast:

      a. of diens productie-installatie geschikt is voor de opwekking van ander gas uit hernieuwbare bronnen;

      b. of de inrichting om te meten geschikt is voor de meting van ander gas uit hernieuwbare bronnen die met de
      productie-installatie wordt opgewekt;

      c. bij conversie of de inrichting om te meten geschikt is voor de meting van energie uit hernieuwbare bronnen
      die wordt gebruikt in de productie-installatie, bedoeld onder a, voor de opwekking van ander gas uit hernieuwbare
      bronnen.
    url: https://wetten.overheid.nl/BWBR0046743/2022-10-01#Artikel4
  - number: '5'
    text: |-
      Een leverancier zorgt ervoor dat als bewijs van levering van ander gas uit hernieuwbare bronnen aan een in
      Nederland gevestigde eindafnemer, binnen één maand na de levering een corresponderende hoeveelheid garanties van
      oorsprong voor ander gas uit hernieuwbare bronnen van een Nederlandse rekening voor garanties van oorsprong wordt
      afgeboekt.
    url: https://wetten.overheid.nl/BWBR0046743/2022-10-01#Artikel5
  - number: '6'
    text: |-
      1 Garanties van oorsprong voor ander gas uit hernieuwbare bronnen uitgegeven door een onafhankelijke instantie
      in een andere lidstaat van de Europese Unie, die naar aard en strekking overeenkomen met in Nederland uitgegeven
      garanties van oorsprong, worden daarmee gelijkgesteld.

      2 Garanties van oorsprong voor ander gas uit hernieuwbare bronnen uitgegeven door een onafhankelijke instantie in
      een derde land, die naar aard en strekking overeenkomen met in Nederland uitgegeven garanties van oorsprong, worden
      niet erkend, behalve indien de Europese Unie daarvoor een overeenkomst heeft afgesloten met het derde land en de
      energie rechtstreeks uit dat land wordt ingevoerd of uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0046743/2022-10-01#Artikel6
  - number: '7'
    text: |-
      1 Bij ministeriële regeling worden tarieven vastgesteld ter dekking van de kosten die worden gemaakt met betrekking
      tot de activiteiten, bedoeld in [artikel 3][ref1].

      2 Bij ministeriële regeling worden regels gesteld over:

      a. de informatie die een producent, leverancier, handelaar of meetbedrijf verstrekt aan Onze Minister;

      b. de uitgifte en de geldigheidsduur van garanties van oorsprong voor ander gas uit hernieuwbare bronnen;

      c. de gegevens die worden vermeld op garanties van oorsprong voor ander gas uit hernieuwbare bronnen;

      d. de voorwaarden waaronder en de wijze waarop een producent, leverancier of handelaar gebruik kan maken van de
      door hen verkregen garanties van oorsprong voor ander gas uit hernieuwbare bronnen of deze kunnen verhandelen;

      e. de vaststelling, bedoeld in [artikel 4][ref2];

      f. het meten van de hoeveelheid, bedoeld in [artikel 3, derde lid][ref3].

      3 De regels, bedoeld in het tweede lid, kunnen verschillen voor de verschillende soorten garanties van oorsprong.


      [ref1]: https://wetten.overheid.nl/BWBR0046743#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0046743#Artikel4
