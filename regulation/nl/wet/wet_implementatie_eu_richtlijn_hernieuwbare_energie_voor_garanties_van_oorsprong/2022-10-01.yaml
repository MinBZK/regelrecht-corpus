preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om regels te stellen over garanties van oorsprong ter
    uitvoering van Richtlijn (EU) 2018/2001 van het Europees Parlement en de Raad van 11 december 2018 ter bevordering
    van het gebruik van energie uit hernieuwbare bronnen (herschikking) (PbEU 2018, L 328);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0046743/2022-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *ander gas uit hernieuwbare bronnen:* stof, niet zijnde een gas als bedoeld in
      [artikel 1, eerste lid, onderdeel b, onder 2°, van de Gaswet][ref1], die bij een temperatuur van 15° Celsius
      en bij een druk van 1,0325 bar in gasvormige toestand verkeert en die: a. is opgewekt in een productie-installatie
      die uitsluitend gebruik maakt van hernieuwbare bronnen of energie uit hernieuwbare bronnen, of b. is opgewekt met
      gebruik van hernieuwbare bronnen of energie uit hernieuwbare bronnen in een hybride productie-installatie die ook
      gebruik maakt van energie uit fossiele bronnen;
        - *conversie:* omzetting van energie uit hernieuwbare bronnen in een andere vorm van energie uit hernieuwbare
      bronnen;
        - *eindafnemer:* natuurlijke persoon of rechtspersoon aan wie uitsluitend voor eigen verbruik ander gas uit
      hernieuwbare bronnen wordt geleverd;
        - *energie uit hernieuwbare bronnen:* energie die is opgewekt uit hernieuwbare bronnen en energie die is opgewekt
      met gebruik van energie uit hernieuwbare bronnen;
        - *garantie van oorsprong:* een garantie van oorsprong voor duurzame elektriciteit, een garantie van oorsprong voor
      elektriciteit opgewekt in een installatie voor hoogrenderende warmtekrachtkoppeling, een garantie van oorsprong
      voor gas uit hernieuwbare energiebronnen, een garantie van oorsprong voor ander gas uit hernieuwbare bronnen of een
      garantie van oorsprong voor thermische energie uit hernieuwbare bronnen;
        - *garantie van oorsprong voor ander gas uit hernieuwbare bronnen:* gegevens op een rekening voor garanties van
      oorsprong die betrekking hebben op ander gas uit hernieuwbare bronnen en waarmee wordt aangetoond dat een producent
      met zijn installatie een hoeveelheid ander gas uit hernieuwbare bronnen heeft opgewekt;
        - *handelaar:* natuurlijke persoon of rechtspersoon die zich bezighoudt met het verhandelen van garanties van
      oorsprong;
        - *hernieuwbare bronnen:* hernieuwbare niet-fossiele bronnen waarmee hernieuwbare energie als bedoeld in artikel 2,
      eerste onderdeel, van [Richtlijn (EU) 2018/2001](32018L2001) van het Europees Parlement en de Raad van 11 december
      2018 ter bevordering van het gebruik van energie uit hernieuwbare bronnen (PbEU 2018, L 328) kan worden opgewekt;
        - *leverancier:* natuurlijke persoon of rechtspersoon die zich bezighoudt met de levering van ander gas uit
      hernieuwbare bronnen;
        - *meetbedrijf:* natuurlijke persoon of rechtspersoon die zich bezig houdt met het collecteren, valideren en
      vaststellen van meetgegevens betreffende ander gas uit hernieuwbare bronnen;
        - *Onze Minister:* Onze Minister van Economische Zaken en Klimaat;
        - *producent:* natuurlijke persoon of rechtspersoon die zich bezighoudt met de productie van ander gas uit
      hernieuwbare bronnen;
        - *productie-installatie:* installatie bestemd voor het opwekken van ander gas uit hernieuwbare bronnen, bestaande
      uit één of meer productie-eenheden, die is gelegen in Nederland of binnen de Nederlandse exclusieve economische
      zone;
        - *rekening voor garanties van oorsprong:* staat waarop een tegoed van garanties van oorsprong kan worden geboekt
      in het elektronische systeem voor het uitgeven en innemen van garanties van oorsprong voor andere gassen uit
      hernieuwbare bronnen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0046743/2022-10-01#Artikel1
    references:
      - id: ref1
