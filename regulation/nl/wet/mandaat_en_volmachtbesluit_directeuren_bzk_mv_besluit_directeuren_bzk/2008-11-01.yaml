  - number: '8.2'
    text: |-
      1 De uitoefening door de directeur onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en
      gevolmachtigde van diens mandaat en volmacht, geschiedt binnen de door de secretaris-generaal vastgestelde kaders
      met betrekking tot het beleid en beheer inzake de bedrijfsvoering van het Ministerie.

      2 Afwijking van het eerste lid is slechts mogelijk in overeenstemming met de secretaris-generaal, het diensthoofd,
      de directeur Financieel-economische Zaken en de directeur van het dienstonderdeel binnen de Staf die het aangaat,
      en wordt schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel8.2
  - number: '8.3'
    text: |-
      De uitoefening door de directeur onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en
      gevolmachtigde van diens mandaat en volmacht, geschiedt met inachtneming van de departementale procedures en
      richtlijnen.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel8.3
  - number: '8.4'
    text: |-
      1 De directeur legt op verzoek van de Minister, de secretaris-generaal of het diensthoofd mondeling of schriftelijk
      verantwoording af over de uitoefening van zijn mandaat en volmacht krachtens dit besluit.

      2 De gemandateerde of gevolmachtigde, bedoeld in [artikel 7.3][ref1], legt op verzoek van de Minister, de
      secretaris-generaal, het diensthoofd of de directeur mondeling of schriftelijk verantwoording af over de
      uitoefening van zijn mandaat en volmacht krachtens dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0023184#Artikel7.3
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0023184
        artikel: '7.3'
        paragraaf: '7'
  - number: '8.5'
    text: |-
      1 De directeur onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en gevolmachtigde, is
      verantwoordelijk voor het bijhouden van een of meer doelmatig ingerichte administraties die inzicht bieden in
      het door en namens de directeur gevoerde financiële beheer en beheer van niet-geldelijke zaken op grond van diens
      mandaat en volmacht.

      2 De directeur Financieel-economische Zaken en de directeur Auditdienst zijn bevoegd om de administraties,
      bedoeld in het eerste lid, te onderzoeken ten behoeve van de uitvoering van hun taken overeenkomstig het
      [Organisatiebesluit BZK 2006][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0020525
  - number: '8.6'
    text: |-
      In gevallen waarin dit besluit niet voorziet, beslist de Minister, de secretaris-generaal of het diensthoofd over
      de verlening van mandaat en volmacht.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel8.6
  - number: '9.1'
    text: |-
      Verlening en doorverlening van (onder)mandaat en volmacht op grond van of krachtens dit besluit wordt geregistreerd
      overeenkomstig het [MV-besluit secretaris-generaal BZK][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017562
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0017562
  - number: '9.2'
    text: |-
      1 De directeur Personeel en Organisatie is belast met het beheer van dit besluit.

      2 De secretaris-generaal, de diensthoofden en de directeuren, ieder voor zover het hem aangaat, zijn
      verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de directeur Personeel en Organisatie van de
      gegevens die een goed beheer van dit besluit onderscheidenlijk het mandaat- en volmachtregister BZK mogelijk maken.

      3 Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.

      4 De directeur Personeel en Organisatie rapporteert aan de secretaris-generaal en de diensthoofden over het beheer
      van dit besluit.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel9.2
  - number: '9.3'
    text: |-
      1 Wijziging van dit besluit is voorbehouden aan de secretaris-generaal.

      2 Wijziging van dit besluit geschiedt op initiatief van de directeur Personeel en Organisatie na advies van de
      directeur Financieel-economische Zaken en de directeur Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel9.3
  - number: '10.1'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 1 oktober 2006.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel10.1
  - number: '10.2'
    text: 'Dit besluit wordt aangehaald als: Mandaat- en volmachtbesluit directeuren BZK (MV-besluit directeuren BZK).'
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel10.2
  - number: '10.3'
    text: |-
      Het [Mandaat- en volmachtbesluit directeuren BZK (MV-besluit directeuren BZK)][ref1] van 27 december 2004 wordt
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0017847
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0017847
