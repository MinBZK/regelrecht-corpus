preamble:
  text: |-
    Gelet op het Mandaat- en volmachtbesluit secretaris-generaal BZK en het Mandaat- en volmachtbesluit diensthoofden
    BZK;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder:

        - Ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - Minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - stuk: een stuk dat een besluit inhoudt of een ander stuk dat wordt toegerekend aan de Minister;
        - diensthoofd: de plaatsvervangend secretaris-generaal, een directeur-generaal, het hoofd van de Algemene
      Inlichtingen- en Veiligheidsdienst of het hoofd van de Inspectie Openbare Orde en Veiligheid van het Ministerie.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel1.1
  - number: '1.2'
    text: |-
      1 Onder directeur wordt in dit besluit verstaan: de leidinggevende van een in het
      [Organisatiebesluit BZK 2006][ref1] genoemd dienstonderdeel die rechtstreeks ressorteert onder een directeur-
      generaal, de plaatsvervangend secretaris-generaal, het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst of
      het hoofd van de Inspectie Openbare Orde en Veiligheid.

      2 Het eerste lid is niet van toepassing op het Korps landelijke politiediensten.


      [ref1]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0020525
  - number: '2.1'
    text: |-
      1 De directeur is bevoegd om namens de Minister besluiten te nemen en stukken af te doen en te ondertekenen.

      2 De directeur is bevoegd om namens de Minister voor de Staat privaatrechtelijke rechtshandelingen te verrichten.

      3 De bevoegdheden, bedoeld in het eerste lid, worden aangeduid als het mandaat en de bevoegdheid, bedoeld in het
      tweede lid, worden aangeduid als de volmacht van de directeur.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel2.1
  - number: '2.2'
    text: |-
      Het mandaat en de volmacht van de directeur worden uitgeoefend ten aanzien van aangelegenheden die behoren tot
      het werkterrein van de directeur overeenkomstig het [Organisatiebesluit BZK 2006][ref1] en die, onverminderd
      het bepaalde in het [MV-besluit secretaris-generaal BZK][ref2], het [MV-besluit diensthoofden BZK][ref3]
      onderscheidenlijk dit besluit, redelijkerwijs niet behoren te worden voorgelegd aan de Minister, de secretaris-
      generaal of het diensthoofd die het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020525
      [ref2]: https://wetten.overheid.nl/BWBR0017562
      [ref3]: https://wetten.overheid.nl/BWBR0023183
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0020525
      - id: ref2
        bwb_id: BWBR0017562
      - id: ref3
        bwb_id: BWBR0023183
  - number: '2.3'
    text: |-
      Onverminderd het bepaalde in het [MV-besluit secretaris-generaal BZK][ref1], het
      [MV-besluit diensthoofden BZK][ref2] onderscheidenlijk dit besluit, heeft het mandaat en de volmacht van de
      directeur in ieder geval betrekking op:

      a. de taken van de directeur en de onder de directeur ressorterende functionarissen en dienstonderdelen, genoemd
      in het [Organisatiebesluit BZK 2006][ref3] en het daarop gebaseerde organisatiebesluit, en het uitoefenen van
      integraal management dienaangaande met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en
      materieel gebied en aangelegenheden met betrekking tot het verrichten van privaatrechtelijke rechtshandelingen;

      b. het leiding geven aan de rechtstreeks onder de directeur ressorterende functionarissen;

      c. het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref4] in het overleg met de
      ondernemingsraad van het desbetreffende dienstonderdeel, voor zover het diensthoofd niet als zodanig optreedt;

      d. het vertegenwoordigen van de Minister namens de Staat in gerechtelijke procedures waarbij het dienstonderdeel
      is betrokken;

      e. het afnemen van de eed of de belofte van ambtenaren bij het dienstonderdeel waarover de directeur de leiding
      voert voor zover het een buitendienst of agentschap betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0017562
      [ref2]: https://wetten.overheid.nl/BWBR0023183
      [ref3]: https://wetten.overheid.nl/BWBR0020525
      [ref4]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0017562
      - id: ref2
        bwb_id: BWBR0023183
      - id: ref3
        bwb_id: BWBR0020525
      - id: ref4
        bwb_id: BWBR0002747
  - number: '3.1'
    text: |-
      De directeur Informatie en Communicatietechnologie is met inachtneming van dit besluit bevoegd om stukken af
      te doen en te ondertekenen met betrekking tot het aangaan van raamovereenkomsten inzake departementale ICT-
      aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel3.1
  - number: '3.2'
    text: |-
      De directeur Financieel-economische Zaken is bevoegd

      a. tot het af doen en ondertekenen van stukken in verband met de uitvoering van
      [artikel 21 van de Comptabiliteitswet][ref1] en het [Besluit taak FEZ][ref2];

      b. tot het geven van instructies aan de onderdelen die verantwoordelijk zijn voor de financiële bedrijfsvoering
      en control;

      c. tot het inhoudelijk aansturen van onderdelen die zijn betrokken bij het bewaken van en adviseren over de
      uitvoering van de bedrijfsvoering in brede zin;

      d. tot het met inachtneming van dit besluit tekenen en afdoen van stukken met betrekking tot het aangaan van
      (raam)overeenkomsten inzake departementale inkoop, bewaking en beveiliging, bedrijfshulpverlening, schoonmaak,
      vervoer, groenvoorziening en catering, en met betrekking tot de in het [Organisatiebesluit BZK 2006][ref3] genoemde
      taken van de Centrale Directeur Inkoop.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005333
      [ref3]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0005333
      - id: ref3
        bwb_id: BWBR0020525
  - number: '3.3'
    text: |-
      De directeur Personeel en Organisatie is met inachtneming van dit besluit bevoegd:

      a. tot het ondertekenen van procedurele stukken in het kader van de behandeling van bezwaarschriften tegen
      besluiten van of namens de Minister met betrekking tot een personele aangelegenheid;

      b. tot het inschakelen van de landsadvocaat voor ondersteuning of vertegenwoordiging van het Ministerie inzake
      rechtspositionele vraagstukken;

      c. tot het namens de secretaris-generaal ondertekenen van stukken aan de Groepsondernemingsraad
      onderscheidenlijk de centrales van verenigingen van ambtenaren, bedoeld in
      [artikel 113 van het Algemeen Rijksambtenarenreglement][ref1];

      d. tot het ondertekenen van brieven met betrekking tot het voeren van de salarisadministratie bij de directie;

      e. tot het afdoen en ondertekenen van stukken met betrekking tot het aangaan van raamovereenkomsten inzake
      organisatie-advisering, opleiding, scholing, training en assessments bij het Ministerie, en overeenkomsten inzake
      departementale vervoersregelingen, arbeidsomstandigheden, bedrijfsmaatschappelijk werk en kinderopvang;

      f. tot het afdoen en ondertekenen van stukken met betrekking tot de vergoeding van representatiekosten op grond van
      het [Besluit representatiekosten rijkspersoneel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0006102
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '113'
      - id: ref2
        bwb_id: BWBR0006102
  - number: '3.4'
    text: |-
      De directeur Auditdienst is bevoegd om stukken af te doen en te ondertekenen in verband met de uitvoering van
      [artikel 66 van de Comptabiliteitswet 2001][ref1] en het [Besluit taak DAD][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0007535
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0007535
  - number: '3.5'
    text: |-
      De directeur Communicatie en Informatie is met inachtneming van dit besluit bevoegd om stukken af te doen en
      te ondertekenen met betrekking tot het aangaan van raamovereenkomsten inzake de inzet van media ten behoeve van
      departementale voorlichting en communicatie.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel3.5
  - number: '3.7'
    text: |-
      De directeur Financiële Bedrijfsvoering is met inachtneming van dit besluit bevoegd om namens de Minister:

      a. besluiten te nemen ter verdeling van de algemene uitkering uit het gemeentefonds onder de gemeenten;

      b. besluiten te nemen ter verdeling van de algemene uitkering uit het provinciefonds onder de provincies;

      c. stukken aan de gemeenten en provincies die direct op de verdeling van de algemene uitkeringen uit het
      gemeentefonds en uit het provinciefonds betrekking hebben af te doen en te ondertekenen.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel3.7
  - number: '4'
    text: |-
      1 Ondertekening van besluiten en stukken op grond van het mandaat van de directeur vindt plaats op de volgende
      wijze:

      (aanduiding Minister),

      voor deze,

      (aanduiding directeur),

      (handtekening)

      (naam)

      2 Bij ondertekening van besluiten en stukken op grond van de volmacht van de directeur wordt de aanduiding van de
      Minister voorafgegaan door: Namens de Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel4
  - number: '5.1'
    text: |-
      Het mandaat en de volmacht van de directeur is niet van toepassing:

      a. indien bij wettelijk voorschrift anders is bepaald;

      b. indien de aard van de bevoegdheid of het stuk zich daartegen verzet;

      c. indien het een stuk betreft dat bij de ontvanger de indruk kan wekken dat de ondertekenaar persoonlijk een
      beslissing neemt die door de Minister behoort te worden genomen;

      d. op besluiten en stukken met betrekking tot politieke of maatschappelijke aangelegenheden van principiële aard;

      e. het beslissen op bezwaarschriften.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel5.1
  - number: '5.2'
    text: |-
      [Artikel 4.2, eerste en tweede lid][ref1], en [artikel 4.3 van het MV-besluit secretaris-generaal BZK][ref2],
      inzake aan de ministers voorbehouden aangelegenheden, zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017562#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0017562#Artikel43
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0017562
        artikel: 4:2
      - id: ref2
        bwb_id: BWBR0017562
        artikel: 4:3
  - number: '5.3'
    text: |-
      1 [Artikel 5.3 van het MV-besluit diensthoofden BZK,][ref1] inzake aan de secretaris-generaal voorbehouden
      aangelegenheden, is van toepassing.

      2 Het mandaat en de volmacht van de directeur is niet van toepassing op de aangelegenheden, bedoeld in
      [artikel 7.2 van het MV-besluit diensthoofden BZK][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023183#Artikel5.3
      [ref2]: https://wetten.overheid.nl/BWBR0023183#Artikel7.2
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0023183
        artikel: '5.3'
      - id: ref2
        bwb_id: BWBR0023183
        artikel: '7.2'
  - number: '5.4'
    text: |-
      Het mandaat en de volmacht van de directeur is niet van toepassing voor zover het diensthoofd die het aangaat dit
      met toepassing van [artikel 7.1, tweede lid, van het MV-besluit diensthoofden BZK][ref1] heeft bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0023183#Artikel7.1
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0023183
        artikel: '7.1'
  - number: '5.5'
    text: |-
      1 Het mandaat en de volmacht van de directeur met betrekking tot het aangaan van financiële verplichtingen en het
      doen van uitgaven is beperkt tot het budget dat aan de directeur ter beschikking is gesteld op basis van een door
      het diensthoofd en de DG-Controller goedgekeurde budgettaire uitwerking van dat deel van de begroting waarvoor de
      directeur verantwoordelijk is.

      2 De directeur is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan en uitgaven te
      doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat of volmacht is verleend door de Minister, de
      secretaris-generaal of het diensthoofd, met instemming van de DG-Controller en binnen het vastgestelde budget dat
      aan het diensthoofd ter beschikking is gesteld.

      3 In afwijking van het bepaalde in het eerste en tweede lid is de bevoegdheid van de directeur inzake de inkoop van
      diensten, vallende onder de raamovereenkomsten concernbrede inhuur, beperkt tot € 50.000,– per inkoop.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel5.5
  - number: '5.6'
    text: |-
      Het buiten invordering stellen of kwijtschelden van een privaatrechtelijke vordering geschiedt met medeparaaf van
      of namens de directeur Financieel-economische Zaken bij een bedrag van ten minste € 5.000,– en met inachtneming van
      de door de Minister van Financiën gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel5.6
  - number: '5.7'
    text: |-
      Het aanstellen en tewerkstellen van een leidinggevende die onder de rechtstreekse leiding van een directeur valt,
      geschiedt in overeenstemming met het diensthoofd.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel5.7
  - number: '6'
    text: |-
      1 Bij tijdelijke afwezigheid of verhindering van de directeur wordt diens mandaat en volmacht volledig uitgeoefend
      door de plaatsvervangend directeur.

      2 Bij gelijktijdige tijdelijke afwezigheid of verhindering van de directeur en de plaatsvervangend directeur wordt
      het mandaat en de volmacht van de directeur bij wijze van waarneming volledig uitgeoefend door de functionaris die
      daartoe door de directeur in overeenstemming met het diensthoofd is aangewezen.

      3 Ondertekening van besluiten en stukken ingevolge dit artikel vindt plaats overeenkomstig [artikel 4][ref1], met
      dien verstande dat de handtekening voorafgegaan wordt door: b/a.


      [ref1]: https://wetten.overheid.nl/BWBR0023184#Artikel4
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0023184
        artikel: '4'
        paragraaf: '4'
  - number: '7.1'
    text: |-
      De directeur is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat en het doorverlenen
      van zijn volmacht, respectievelijk tot het beperken of het intrekken daarvan, aan onder hem ressorterende
      functionarissen ten aanzien van aangelegenheden op hun werkterrein overeenkomstig het desbetreffende
      organisatiebesluit.
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel7.1
  - number: '7.2'
    text: |-
      De rechtstreeks onder de directeur ressorterende leidinggevenden zijn, voor zover door de directeur met toepassing
      van [artikel 7.1][ref1] niet anders is bepaald, ten aanzien van de onder hen ressorterende functionarissen bevoegd
      tot:

      a. het vaststellen van het wekelijkse werkrooster;

      b. het verlenen van vakantieverlof;

      c. het verlenen van buitengewoon verlof van korte duur;

      d. het accorderen van binnenlandse dienstreizen en daarbij gebruikte vervoermiddel;

      e. het voeren respectievelijk de verslaglegging van het gesprek, bedoeld in
      [artikel 71 van het Algemeen Rijksambtenarenreglement][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023184#Artikel7.1
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel71
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0023184
        artikel: '7.1'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '71'
  - number: '7.3'
    text: |-
      De directeur kan, voor zover niet anders is bepaald, bij toepassing van de bevoegdheid, bedoeld in
      [artikel 7.1][ref1], tevens de bevoegdheid toekennen tot het verlenen van ondermandaat en het doorverlenen van de
      volmacht aan een rechtstreeks onder de gemandateerde of gevolmachtigde ressorterende functionaris ten aanzien van
      aangelegenheden op het werkterrein van de functionaris overeenkomstig het desbetreffende organisatiebesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0023184#Artikel7.1
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0023184
        artikel: '7.1'
        paragraaf: '7'
  - number: '7.4'
    text: |-
      1 De uitoefening door de directeur van de bevoegdheden, bedoeld in [artikel 7.1][ref1] en [artikel 7.3][ref2],
      geschiedt bij schriftelijk besluit, in overeenstemming met het diensthoofd en met kennisgeving aan de directeur
      Personeel en Organisatie en de directeur Financieel-economische Zaken.

      2 De uitoefening door de gemandateerde of gevolmachtigde, bedoeld in [artikel 7.3][ref3], van diens bevoegdheid
      geschiedt bij schriftelijk besluit, in overeenstemming met de directeur en met kennisgeving aan de directeur
      Personeel en Organisatie en aan de directeur Financieel-economische Zaken.

      3 Voor de besluiten, bedoeld in het eerste en tweede lid, wordt gebruik gemaakt van het model, bedoeld in
      [artikel 7.3, tweede lid, van het MV-besluit diensthoofden BZK][ref4]. In overeenstemming met de directeur
      Personeel en Organisatie kan daarvan worden afgeweken indien daartoe bijzondere aanleiding bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0023184#Artikel7.1
      [ref2]: https://wetten.overheid.nl/BWBR0023184#Artikel7.3
      [ref3]: https://wetten.overheid.nl/BWBR0023184#Artikel7.3
      [ref4]: https://wetten.overheid.nl/BWBR0023183#Artikel7.3
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0023184
        artikel: '7.1'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0023184
        artikel: '7.3'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0023184
        artikel: '7.3'
        paragraaf: '7'
      - id: ref4
        bwb_id: BWBR0023183
        artikel: '7.3'
  - number: '7.5'
    text: |-
      De directeur is bevoegd om in bijzondere gevallen, naast of in plaats van het bepaalde in [artikel 7.1][ref1]
      en [artikel 7.3][ref2], mondeling of schriftelijk ondermandaat te verlenen onderscheidenlijk zijn volmacht
      door te verlenen aan een onder hem ressorterende functionaris voor een bepaald geval, met inachtneming van
      [artikel 1, derde lid, van het Besluit privaatrechtelijke rechtshandelingen 1996][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023184#Artikel7.1
      [ref2]: https://wetten.overheid.nl/BWBR0023184#Artikel7.3
      [ref3]: https://wetten.overheid.nl/BWBR0007804#Artikel1
    url: https://wetten.overheid.nl/BWBR0023184/2008-11-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0023184
        artikel: '7.1'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0023184
        artikel: '7.3'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0007804
        artikel: '1'
  - number: '8.1'
    text: |-
      1 De uitoefening door de directeur van diens mandaat en volmacht, geschiedt onder verantwoordelijkheid van het
      diensthoofd waaronder de directeur ressorteert.

      2 De uitoefening door de directeur onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en
      gevolmachtigde van diens mandaat en volmacht, geschiedt met inachtneming van:

      a. algemene en bijzondere aanwijzingen van hiërarchisch hoger geplaatsten ten aanzien van de uitoefening van het
      mandaat en de volmacht;

      b. departementale richtlijnen met betrekking tot paraaf en medeparaaf en het voorleggen en afdoen van stukken;

      c. de van toepassing zijnde wet- en regelgeving en overige departementale richtlijnen, in
      het bijzonder de [Comptabiliteitswet][ref1], de [Wet op de ondernemingsraden][ref2], het
      [Besluit privaatrechtelijke rechtshandelingen 1996][ref3], het [Besluit taak FEZ][ref4], het
      [Organisatiebesluit BZK 2006][ref5] en (de richtlijnen inzake) administratieve organisatiebeschrijvingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891
      [ref2]: https://wetten.overheid.nl/BWBR0002747
      [ref3]: https://wetten.overheid.nl/BWBR0007804
      [ref4]: https://wetten.overheid.nl/BWBR0005333
      [ref5]: https://wetten.overheid.nl/BWBR0020525
