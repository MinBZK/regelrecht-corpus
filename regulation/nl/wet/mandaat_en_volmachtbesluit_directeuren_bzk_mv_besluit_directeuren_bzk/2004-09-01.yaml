---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mandaat_en_volmachtbesluit_directeuren_bzk_mv_besluit_directeuren_bzk
regulatory_layer: WET
publication_date: '2005-02-23'
valid_from: '2004-09-01'
bwb_id: BWBR0015582
url: https://wetten.overheid.nl/BWBR0015582/2004-09-01
preamble:
  text: |-
    Gelet op het Mandaat- en volmachtbesluit secretaris-generaal BZK en het Mandaat- en volmachtbesluit diensthoofden
    BZK;

    Gezien het advies van de Groepsondernemingsraad;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      In dit besluit wordt verstaan onder: - ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties onderscheidenlijk de Minister voor
      Bestuurlijke Vernieuwing en Koninkrijksrelaties;
        - stuk: een stuk dat een besluit inhoudt of een ander stuk dat wordt toegerekend aan de minister;
        - diensthoofd: de plaatsvervangend secretaris-generaal, een directeur-generaal, het hoofd van de Algemene
      Inlichtingen- en Veiligheidsdienst of het hoofd van de Inspectie Openbare Orde en Veiligheid van het ministerie.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel11
  - number: 1:2.1
    text: |-
      Onder directeur wordt in dit besluit verstaan: de leidinggevende van een in het [Organisatiebesluit BZK 2003][ref1]
      genoemd dienstonderdeel dat deel uitmaakt van een directoraat-generaal, de onderdelen die onder de
      verantwoordelijkheid van de plaatsvervangend secretaris-generaal vallen en de onderdelen die deel uitmaken van de
      Algemene Inlichtingen- en Veiligheidsdienst en de Inspectie Openbare Orde en Veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0015590
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015590
  - number: 1:2.2
    text: |-
      Het eerste lid is niet van toepassing op het Korps landelijke politiediensten en de Informatie- en
      communicatietechnologie Organisatie.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel12
  - number: 2:1.1
    text: De directeur is bevoegd om namens de minister besluiten te nemen en stukken af te doen en te ondertekenen.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel21
  - number: 2:1.2
    text: De directeur is bevoegd om namens de minister voor de Staat privaatrechtelijke rechtshandelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel21
  - number: 2:1.3
    text: |-
      De bevoegdheden, bedoeld in het eerste en tweede lid, worden aangeduid als het mandaat en de volmacht van de
      directeur.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel21
  - number: 2:2
    text: |-
      Het mandaat en de volmacht van de directeur wordt uitgeoefend ten aanzien van aangelegenheden die behoren tot
      het werkterrein van de directeur overeenkomstig het [Organisatiebesluit BZK 2003][ref1] en die, onverminderd
      het bepaalde in het [MV-besluit secretaris-generaal BZK][ref2], het [MV-besluit diensthoofden BZK][ref3]
      onderscheidenlijk dit besluit, redelijkerwijs niet behoren te worden voorgelegd aan de minister, de secretaris-
      generaal of het diensthoofd die het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0015590
      [ref2]: https://wetten.overheid.nl/BWBR0015591
      [ref3]: https://wetten.overheid.nl/BWBR0015584
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0015590
      - id: ref2
        bwb_id: BWBR0015591
      - id: ref3
        bwb_id: BWBR0015584
  - number: 2:3
    text: |-
      Onverminderd het bepaalde in het [MV-besluit secretaris-generaal BZK][ref1], het
      [MV-besluit diensthoofden BZK][ref2] onderscheidenlijk dit besluit, heeft het mandaat en de volmacht van de
      directeur in ieder geval betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0015591
      [ref2]: https://wetten.overheid.nl/BWBR0015584
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0015591
      - id: ref2
        bwb_id: BWBR0015584
  - number: 2:3.a)
    text: |-
      de taken van de directeur en de onder de directeur ressorterende functionarissen en dienstonderdelen, genoemd
      in het [Organisatiebesluit BZK 2003][ref1] en het daarop gebaseerde organisatiebesluit, en het uitoefenen van
      integraal management dienaangaande met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en
      materieel gebied en aangelegenheden met betrekking tot het verrichten van privaatrechtelijke rechtshandelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0015590
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0015590
  - number: 2:3.b)
    text: het leiding geven aan de rechtstreeks onder de directeur ressorterende functionarissen;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel23
  - number: 2:3.c)
    text: |-
      het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref1] in het overleg met de
      ondernemingsraad van het desbetreffende dienstonderdeel, voor zover het diensthoofd niet als zodanig optreedt;


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 2:3.d)
    text: |-
      het vertegenwoordigen van de minister namens de Staat in gerechtelijke procedures waarbij het dienstonderdeel is
      betrokken;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel23
  - number: 2:3.e)
    text: |-
      het afnemen van de eed of de belofte van ambtenaren bij het dienstonderdeel waarover de directeur de leiding voert
      voor zover het een buitendienst of agentschap betreft.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel23
  - number: 3:1
    text: |-
      De directeur Informatievoorziening is met inachtneming van dit besluit bevoegd om stukken af te doen en te
      ondertekenen met betrekking tot het aangaan van mantelovereenkomsten inzake departementale ICT-aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel31
  - number: 3:2
    text: |-
      De directeur Financieel-Economische Zaken is bevoegd om stukken af te doen en te ondertekenen in verband met de
      uitvoering van [artikel 21 van de Compatibiliteitswet][ref1] en het [Besluit taak FEZ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005333
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0005333
  - number: 3:3
    text: 'De directeur Personeel en Organisatie is met inachtneming van dit besluit bevoegd:'
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel33
  - number: 3:3.a)
    text: |-
      tot het ondertekenen van procedurele stukken in het kader van de behandeling van bezwaarschriften tegen besluiten
      van of namens de minister met betrekking tot een personele aangelegenheid;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel33
  - number: 3:3.b)
    text: |-
      tot het inschakelen van de landsadvocaat voor ondersteuning of vertegenwoordiging van het ministerie inzake
      rechtspositionele vraagstukken;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel33
  - number: 3:3.c)
    text: |-
      tot het namens de secretaris-generaal ondertekenen van stukken aan de Groepsondernemingsraad onderscheidenlijk de
      centrales van verenigingen van ambtenaren, bedoeld in [artikel 113 van het Algemeen Rijksambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel113
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '113'
  - number: 3:3.d)
    text: tot het ondertekenen van brieven met betrekking tot het voeren van de salarisadministratie bij de directie;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel33
  - number: 3:3.e)
    text: |-
      tot het afdoen en ondertekenen van stukken met betrekking tot het aangaan van mantelovereenkomsten inzake
      organisatie-advisering, opleiding, scholing, training en assessments bij het ministerie, en overeenkomsten inzake
      departementale vervoersregelingen, arbeidsomstandigheden, bedrijfsmaatschappelijk werk en kinderopvang;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel33
  - number: 3:3.f)
    text: |-
      tot het afdoen en ondertekenen van stukken met betrekking tot de vergoeding van representatiekosten op grond van
      het [Besluit representatiekosten rijkspersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006102
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006102
  - number: 3:4
    text: |-
      De directeur Auditdienst is bevoegd om stukken af te doen en te ondertekenen in verband met de uitvoering van
      [artikel 66 van de Compatibiliteitswet 2001][ref1] en het [Besluit taak DAD][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0007535
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0007535
  - number: 3:5
    text: |-
      De directeur Voorlichting en Communicatie is met inachtneming van dit besluit bevoegd om stukken af te doen en te
      ondertekenen met betrekking tot het aangaan van mantelovereenkomsten inzake publiekscampagnes en de inzet van media
      ten behoeve van departementale voorlichting en communicatie.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel35
  - number: 3:6
    text: |-
      De directeur Facilitaire Zaken is met inachtneming van dit besluit bevoegd om stukken af te doen en te ondertekenen
      met betrekking tot het aangaan van (mantel)overeenkomsten inzake departementale inkoop, bewaking en beveiliging,
      bedrijfshulpverlening, schoonmaak, vervoer, groenvoorziening en catering, en met betrekking tot de in het
      [Organisatiebesluit BZK 2003][ref1] genoemde taken van de Centrale Directeur Inkoop.


      [ref1]: https://wetten.overheid.nl/BWBR0015590
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0015590
  - number: '4.1'
    text: |-
      Ondertekening van besluiten en stukken op grond van het mandaat van de directeur vindt plaats op de volgende wijze:
      (aanduiding minister), voor deze: (aanduiding directeur), (handtekening) (naam)
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel4
  - number: '4.2'
    text: |-
      Bij ondertekening van besluiten en stukken op grond van de volmacht van de directeur wordt de aanduiding van de
      minister voorafgegaan door: Namens de Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel4
  - number: 5:1
    text: 'Het mandaat en de volmacht van de directeur is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel51
  - number: 5:1.a)
    text: indien bij wettelijk voorschrift anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel51
  - number: 5:1.b)
    text: indien de aard van de bevoegdheid of het stuk zich daartegen verzet;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel51
  - number: 5:1.c)
    text: |-
      indien het een stuk betreft dat bij de ontvanger de indruk kan wekken dat de ondertekenaar persoonlijk een
      beslissing neemt die door de minister behoort te worden genomen;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel51
  - number: 5:1.d)
    text: op besluiten en stukken met betrekking tot politieke of maatschappelijke aangelegenheden van principiële aard;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel51
  - number: 5:1.e)
    text: het beslissen op bezwaarschriften.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel51
  - number: 5:2
    text: |-
      [Artikel 4:2, eerste en tweede lid][ref1], en [artikel 4:3 van het MV-besluit secretaris-generaal BZK][ref2],
      inzake aan de ministers voorbehouden aangelegenheden, zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015591#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015591#Artikel4
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0015591
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0015591
        artikel: '4'
  - number: 5:3.1
    text: |-
      [Artikel 5:3 van het MV-besluit diensthoofden BZK][ref1], inzake aan de secretaris-generaal voorbehouden
      aangelegenheden, is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015584#Artikel5
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0015584
        artikel: '5'
  - number: 5:3.2
    text: |-
      Het mandaat en de volmacht van de directeur is niet van toepassing op de aangelegenheden, bedoeld in
      [artikel 7:2 van het MV-besluit diensthoofden BZK][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015584#Artikel7
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0015584
        artikel: '7'
  - number: 5:4
    text: |-
      Het mandaat en de volmacht van de directeur is niet van toepassing voor zover het diensthoofd die het aangaat dit
      met toepassing van [artikel 7:1, tweede lid, van het MV-besluit diensthoofden BZK][ref1] heeft bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0015584#Artikel7
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0015584
        artikel: '7'
  - number: 5:5.1
    text: |-
      Het mandaat en de volmacht van de directeur met betrekking tot het aangaan van financiële verplichtingen en het
      doen van uitgaven is beperkt tot het budget dat aan de directeur ter beschikking is gesteld op basis van een door
      het diensthoofd en de directeur Financieel-Economische Zaken goedgekeurd bestedingsplan.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel55
  - number: 5:5.2
    text: |-
      De directeur is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan en uitgaven te
      doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat of volmacht is verleend door de minister, de
      secretaris-generaal of het diensthoofd, met medeparaaf van de directeur Financieel-Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel55
  - number: 5:6
    text: |-
      Het buiteninvorderingstellen of kwijtschelden van een privaatrechtelijke vordering geschiedt met medeparaaf van of
      namens de directeur Financieel-Economische Zaken bij een bedrag van ten minste € 5.000,– en met inachtneming van de
      door de Minister van Financiën gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel56
  - number: 5:7
    text: |-
      Het aanstellen en tewerkstellen van een leidinggevende die onder de rechtstreekse leiding van een directeur valt,
      geschiedt in overeenstemming met het diensthoofd.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel57
  - number: '6.1'
    text: |-
      Bij tijdelijke afwezigheid of verhindering van de directeur wordt diens mandaat en volmacht volledig uitgeoefend
      door de plaatsvervangend directeur.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel6
  - number: '6.2'
    text: |-
      Bij gelijktijdige tijdelijke afwezigheid of verhindering van de directeur en de plaatsvervangend directeur wordt
      het mandaat en de volmacht van de directeur bij wijze van waarneming volledig uitgeoefend door de functionaris die
      daartoe door de directeur in overeenstemming met het diensthoofd is aangewezen.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel6
  - number: '6.3'
    text: |-
      Ondertekening van besluiten en stukken ingevolge dit artikel vindt plaats overeenkomstig [artikel 4][ref1], met
      dien verstande dat de handtekening voorafgegaan wordt door: b/a.


      [ref1]: https://wetten.overheid.nl/BWBR0015582#Artikel4
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015582
        artikel: '4'
        paragraaf: '4'
  - number: 7:1
    text: |-
      De directeur is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat en het doorverlenen
      van zijn volmacht, respectievelijk tot het beperken of het intrekken daarvan, aan onder hem ressorterende
      functionarissen ten aanzien van aangelegenheden op hun werkterrein overeenkomstig het desbetreffende
      organisatiebesluit.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel71
  - number: 7:2
    text: |-
      Reeds op grond van het onderhavige besluit zijn, voor zover door de directeur met toepassing van
      [artikel 7:1][ref1] niet anders is bepaald, de rechtstreeks onder de directeur ressorterende leidinggevenden ten
      aanzien van de onder hen ressorterende functionarissen bevoegd tot:


      [ref1]: https://wetten.overheid.nl/BWBR0015582#Artikel7
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0015582
        artikel: '7'
        paragraaf: '7'
  - number: 7:2.a)
    text: het vaststellen van het wekelijkse werkrooster;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel72
  - number: 7:2.b)
    text: het verlenen van vakantieverlof;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel72
  - number: 7:2.c)
    text: het verlenen van buitengewoon verlof van korte duur;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel72
  - number: 7:2.d)
    text: het accorderen van binnenlandse dienstreizen en daarbij gebruikte vervoermiddel;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel72
  - number: 7:2.e)
    text: |-
      het voeren respectievelijk de verslaglegging van het gesprek, bedoeld in
      [artikel 71 van het Algemeen Rijksambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel71
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '71'
  - number: 7:3
    text: |-
      De directeur kan, voor zover niet anders is bepaald, bij toepassing van de bevoegdheid, bedoeld in
      [artikel 7:1][ref1], tevens de bevoegdheid toekennen tot het verlenen van ondermandaat en het doorverlenen van de
      volmacht aan een rechtstreeks onder de gemandateerde of gevolmachtigde ressorterende functionaris ten aanzien van
      aangelegenheden op het werkterrein van de functionaris overeenkomstig het desbetreffende organisatiebesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0015582#Artikel7
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0015582
        artikel: '7'
        paragraaf: '7'
  - number: 7:4.1
    text: |-
      De uitoefening door de directeur van de bevoegdheden, bedoeld in [artikel 7:1][ref1] en [artikel 7:3][ref2],
      geschiedt bij schriftelijk besluit, in overeenstemming met het diensthoofd en met kennisgeving aan de directeur
      Personeel en Organisatie en de directeur Financieel-Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0015582#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0015582#Artikel7
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0015582
        artikel: '7'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0015582
        artikel: '7'
        paragraaf: '7'
  - number: 7:4.2
    text: |-
      De uitoefening door de gemandateerde of gevolmachtigde, bedoeld in [artikel 7:3][ref1], van diens bevoegdheid
      geschiedt bij schriftelijk besluit, in overeenstemming met de directeur en met kennisgeving aan de directeur
      Personeel en Organisatie en aan de directeur Financieel-Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0015582#Artikel7
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0015582
        artikel: '7'
        paragraaf: '7'
  - number: 7:4.3
    text: |-
      Voor de besluiten, bedoeld in het eerste en tweede lid, wordt gebruik gemaakt van het model, bedoeld in
      [artikel 7:3, tweede lid, van het MV-besluit diensthoofden BZK][ref1]. In overeenstemming met de directeur
      Personeel en Organisatie kan daarvan worden afgeweken indien daartoe bijzondere aanleiding bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0015584#Artikel7
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0015584
        artikel: '7'
  - number: 7:5
    text: |-
      De directeur is bevoegd om in bijzondere gevallen, naast of in plaats van het bepaalde in [artikel 7:1][ref1]
      en [artikel 7:3][ref2], mondeling of schriftelijk ondermandaat te verlenen onderscheidenlijk zijn volmacht
      door te verlenen aan een onder hem ressorterende functionaris voor een bepaald geval, met inachtneming van
      [artikel 1, derde lid, van het Besluit privaatrechtelijke rechtshandelingen 1996][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015582#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0015582#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007804#Artikel1
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0015582
        artikel: '7'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0015582
        artikel: '7'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0007804
        artikel: '1'
  - number: 8:1.1
    text: |-
      De uitoefening door de directeur van diens mandaat en volmacht, geschiedt onder verantwoordelijkheid van het
      diensthoofd waaronder de directeur ressorteert.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel81
  - number: 8:1.2
    text: |-
      De uitoefening door de directeur onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en
      gevolmachtigde van diens mandaat en volmacht, geschiedt met inachtneming van:
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel81
  - number: 8:1.2.a)
    text: |-
      algemene en bijzondere aanwijzingen van hiërarchisch hogergeplaatsten ten aanzien van de uitoefening van het
      mandaat en de volmacht;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel81
  - number: 8:1.2.b)
    text: departementale richtlijnen met betrekking tot paraaf en medeparaaf en het voorleggen en afdoen van stukken;
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel81
  - number: 8:1.2.c)
    text: |-
      de van toepassing zijnde wet- en regelgeving en overige departementale richtlijnen, in
      het bijzonder de [Comptabiliteitswet][ref1], de [Wet op de ondernemingsraden][ref2], het
      [Besluit privaatrechtelijke rechtshandelingen 1996][ref3], het [Besluit taak FEZ][ref4], het
      [Organisatiebesluit BZK 2003][ref5] en (de richtlijnen inzake) administratieve organisatiebeschrijvingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891
      [ref2]: https://wetten.overheid.nl/BWBR0002747
      [ref3]: https://wetten.overheid.nl/BWBR0007804
      [ref4]: https://wetten.overheid.nl/BWBR0005333
      [ref5]: https://wetten.overheid.nl/BWBR0015590
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0013891
      - id: ref2
        bwb_id: BWBR0002747
      - id: ref3
        bwb_id: BWBR0007804
      - id: ref4
        bwb_id: BWBR0005333
      - id: ref5
        bwb_id: BWBR0015590
  - number: 8:2.1
    text: |-
      De uitoefening door de directeur onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en
      gevolmachtigde van diens mandaat en volmacht, geschiedt binnen de door de secretaris-generaal vastgestelde kaders
      met betrekking tot het beleid en beheer inzake de bedrijfsvoering van het ministerie.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel82
  - number: 8:2.2
    text: |-
      Afwijking van het eerste lid is slechts mogelijk in overeenstemming met de secretaris-generaal, het diensthoofd, de
      directeur Financieel-Economische Zaken en de directeur van het dienstonderdeel binnen de Centrale Stafdiensten die
      het aangaat en wordt schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel82
  - number: 8:3
    text: |-
      De uitoefening door de directeur onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en
      gevolmachtigde van diens mandaat en volmacht, geschiedt met inachtneming van de departementale procedures en
      richtlijnen met betrekking tot onder meer: - administratieve organisatiebeschrijvingen;
        - documentaire informatievoorziening;
        - financiële verplichtingen, informatie en administratie;
        - totstandbrenging van wet- en regelgeving;
        - personele besluiten;
        - behandeling van topstukken;
        - behandeling van en het beslissen op verzoeken op grond van de [Wet openbaarheid van bestuur][ref1], met inbegrip
      van bezwaarschriften dienaangaande;
        - ontslagverlening op grond van [artikel 99 van het Algemeen Rijksambtenarenreglement][ref2] onderscheidenlijk
      [artikel 95 van het Besluit algemene rechtspositie politie][ref3];
        - aanleg en bijhouding van persoonsregistraties;
        - inkoop, verwerving en Europese aanbesteding;
        - het aangaan en het gebruik van (mantel)contracten;
        - werving, selectie, aanstelling en herplaatsing in het kader van reorganisatie;
        - aanpassing van de organisatie of formatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel95
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '99'
      - id: ref3
        bwb_id: BWBR0006516
        artikel: '95'
  - number: 8:4.1
    text: |-
      De directeur legt op verzoek van de minister, de secretaris-generaal of het diensthoofd mondeling of schriftelijk
      verantwoording af over de uitoefening van zijn mandaat en volmacht krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel84
  - number: 8:4.2
    text: |-
      De gemandateerde of gevolmachtigde, bedoeld in [artikel 7:3][ref1], legt op verzoek van de minister, de secretaris-
      generaal, het diensthoofd of de directeur mondeling of schriftelijk verantwoording af over de uitoefening van zijn
      mandaat en volmacht krachtens dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0015582#Artikel7
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0015582
        artikel: '7'
        paragraaf: '7'
  - number: 8:5.1
    text: |-
      De directeur onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en gevolmachtigde, is
      verantwoordelijk voor het bijhouden van een of meer doelmatig ingerichte administraties die inzicht bieden in
      het door en namens de directeur gevoerde financiële beheer en beheer van niet-geldelijke zaken op grond van diens
      mandaat en volmacht.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel85
  - number: 8:5.2
    text: |-
      De directeur Financieel-Economische Zaken en de directeur Auditdienst zijn bevoegd om de administraties,
      bedoeld in het eerste lid, te onderzoeken ten behoeve van de uitvoering van hun taken overeenkomstig het
      [Organisatiebesluit BZK 2003][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015590
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0015590
  - number: 8:6
    text: |-
      In gevallen waarin dit besluit niet voorziet, beslist de minister die het aangaat, de secretaris-generaal of het
      diensthoofd over de verlening van mandaat en volmacht.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel86
  - number: 9:1
    text: |-
      Verlening en doorverlening van (onder)mandaat en volmacht op grond van of krachtens dit besluit wordt geregistreerd
      overeenkomstig het [MV-besluit secretaris-generaal BZK][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015591
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0015591
  - number: 9:2.1
    text: De directeur Personeel en Organisatie is belast met het beheer van dit besluit.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel92
  - number: 9:2.2
    text: |-
      De secretaris-generaal, de diensthoofden en de directeuren, ieder voor zover het hem aangaat, zijn verantwoordelijk
      voor een juiste, volledige en tijdige aanlevering aan de directeur Personeel en Organisatie van de gegevens die een
      goed beheer van dit besluit onderscheidenlijk het mandaat- en volmachtregister BZK mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel92
  - number: 9:2.3
    text: |-
      Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel92
  - number: 9:2.4
    text: |-
      De directeur Personeel en Organisatie rapporteert aan de secretaris-generaal en de diensthoofden over het beheer
      van dit besluit.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel92
  - number: 9:3.1
    text: Wijziging van dit besluit is voorbehouden aan de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel93
  - number: 9:3.2
    text: |-
      Wijziging van dit besluit geschiedt op voordracht van de directeur Personeel en Organisatie na advies van de
      directeur Financieel-Economische Zaken en de directeur Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel93
  - number: 10:1
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing van dit besluit in de Staatscourant en
      werkt terug tot en met 1 september 2003
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel101
  - number: 10:2
    text: 'Dit besluit wordt aangehaald als: Mandaat- en volmachtbesluit directeuren BZK (MV-besluit directeuren BZK).'
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel102
  - number: 10:3
    text: |-
      Het [Mandaat- en volmachtbesluit directeuren BZK (MV-besluit directeuren BZK)][ref1] van 13 december 2001, kenmerk
      P&O2001U100142, wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0013171
    url: https://wetten.overheid.nl/BWBR0015582/2004-09-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0013171
