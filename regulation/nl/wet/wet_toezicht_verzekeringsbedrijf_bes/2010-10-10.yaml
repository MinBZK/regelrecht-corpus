      [artikelen 4, vijfde en zevende lid][ref1]; [7][ref2]; [8][ref3]; [9][ref4]; [20, eerste lid][ref5];
      [22, tweede lid][ref6]; [26, eerste lid en tweede lid, eerste en derde volzin, en zevende lid,][ref7] ;
      [31, tweede en vijfde lid, eerste volzin][ref8]; [33, eerste en tweede lid][ref9]; [35][ref10];
      [40, tweede lid][ref11]; [41][ref12]; [42][ref13]; [43, eerste lid][ref14]; [44, eerste en zesde lid][ref15];
      [51, eerste lid][ref16]; [53, eerste lid][ref17]; [58 eerste lid][ref18];[ 63, derde lid][ref19]; [74][ref20];
      [75, eerste lid][ref21]; [76, eerste tot en met derde lid][ref22], en [78][ref23], wordt gestraft hetzij met
      hechtenis van ten hoogste zes maanden en geldboete van de vijfde categorie, hetzij met een van deze straffen.


