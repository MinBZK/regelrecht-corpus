$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_toezicht_verzekeringsbedrijf_bes
regulatory_layer: WET
publication_date: '2011-12-20'
valid_from: '2010-10-10'
bwb_id: BWBR0028495
url: https://wetten.overheid.nl/BWBR0028495/2010-10-10
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt – voorzover niet anders blijkt – verstaan onder: -
      *overeenkomsten van levensverzekering:* overeenkomsten van verzekering tot het doen van geldelijke uitkeringen in
      verband met het leven of de dood van de mens, met dien verstande dat overeenkomsten van ongevallenverzekering niet
      als overeenkomsten van levensverzekering worden beschouwd;
        - *overeenkomsten van schadeverzekering:* overeenkomsten van verzekering die niet zijn overeenkomsten in verband
      met het leven of de dood van de mens, met dien verstande dat overeenkomsten van ongevallenverzekering als
      overeenkomsten van schadeverzekering worden beschouwd;
        - *premie:* de in geld uitgedrukte prestatie, door de verzekeringnemer verschuldigd uit hoofde van een overeenkomst
      van verzekering;
        - *levensverzekeringsbedrijf:* het als bedrijf sluiten van overeenkomsten van levensverzekering voor eigen
      rekening, met inbegrip van het afwikkelen van de in dat bedrijf gesloten overeenkomsten van levensverzekering, ook
      al wordt daarmee niet beoogd het maken van winst;
        - *schadeverzekeringsbedrijf:* het als bedrijf sluiten van overeenkomsten van schadeverzekering voor eigen
      rekening, met inbegrip van het afwikkelen van de in dat bedrijf gesloten overeenkomsten van schadeverzekering, ook
      al wordt daarmee niet beoogd het maken van winst;
        - *verzekeringsbedrijf:* het levensverzekeringsbedrijf of het schadeverzekeringsbedrijf;
        - *verzekeraar:* ieder die het verzekeringsbedrijf uitoefent;
        - *vertegenwoordiger:* degene die door een verzekeraar met zetel in het buitenland is aangesteld om hem in
      de openbare lichamen te vertegenwoordigen in de uitoefening van zijn bevoegdheden en in de naleving van de
      voorschriften die ingevolge deze wet voor hem gelden;
        - *zetel:* de plaats waar een rechtspersoon blijkens haar statuten is gevestigd;
        - *vestiging:* zetel, agentschap of bijkantoor alsmede elke andere duurzame aanwezigheid van een verzekeraar op het
      grondgebied van een staat in de vorm van een inrichting, beheerd door eigen personeel van de verzekeraar of door
      een zelfstandig persoon die gemachtigd is om voor rekening van verzekeraar het verzekeringsbedrijf uit te oefenen;*
        - *jaarrekening:* de balans en de winst- en verliesrekening van een verzekeraar met als bijlage de toelichting
      op deze stukken, zowel in de vorm waarin zij door het bestuur zijn opgemaakt, als in de vorm waarin zij door het
      daartoe bevoegde orgaan zijn vastgesteld of goedgekeurd;
        - *Onze Minister:* Onze Minister van Financiën;
        - *Bank:* De Nederlandsche Bank N.V.;
        - *Hof:* Gemeenschappelijk Hof van Justitie van Aruba, Curaçao en Sint Maarten en van Bonaire, Sint Eustatius en
      Saba;
        - *Gerecht:* Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba;
        - *openbaar lichaam:* het openbaar lichaam Bonaire, Sint Eustatius of Saba;
        - *buitenland:* een deel van het Koninkrijk, niet zijnde een openbaar lichaam, dan wel een andere Staat;
        - *deelneming:* een rechtstreeks of middellijk belang van meer dan 5% van het geplaatste aandelenkapitaal van een
      onderneming of instelling of het rechtstreeks of middellijk kunnen uitoefenen van meer dan 5% van de stemrechten
      in een onderneming of instelling of het rechtstreeks of middellijk kunnen uitoefenen van een daarmee vergelijkbare
      zeggenschap in een onderneming of instelling.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel1
  - number: '1.2'
    text: |-
      Het levensverzekeringsbedrijf verliest zijn karakter als zodanig niet, indien bij overeenkomsten van
      levensverzekering naast de verplichting tot het doen van geldelijke uitkeringen verplichtingen van andere aard
      worden aanvaard, of daarbij verplichtingen worden aanvaard in verband met voorvallen waarvan het ontstaan onzeker
      is en die de persoon van de mens treffen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel1
  - number: '2.1'
    text: Het toezicht op de verzekeraars, zoals dit uit deze wet voortvloeit, berust bij de Bank.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur, wordt een instructie vastgesteld voor de directie van de Bank ter zake van de
      uitoefening van haar taak bij de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel2
  - number: '2.3'
    text: |-
      De commissarissen, de president en de direkteuren van de Bank noch het personeel van de Bank mogen op generlei
      wijze verbonden zijn aan of, anders dan uit hoofde van een overeenkomst van verzekering, belang hebben bij enige
      verzekeraar.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel2
  - number: '3'
    text: 'Het schadeverzekeringsbedrijf wordt onderscheiden naar de volgende schadegroepen:'
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel3
  - number: 3.a
    text: Ongevallen- en ziekteverzekering;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel3
  - number: 3.b
    text: Motorrijtuigverzekering;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel3
  - number: 3.c
    text: Zee-, transport- en luchtvaartverzekering;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel3
  - number: 3.d
    text: Verzekering van brandschade en andere schade aan goederen;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel3
  - number: 3.e
    text: Overige schadeverzekeringen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel3
  - number: '4.1'
    text: |-
      De Bank beslist voor de toepassing van deze wet of een handeling of een samenstel van handelingen al dan niet
      uitoefening van het levensverzekeringsbedrijf, het schadeverzekeringsbedrijf of een andersoortig bedrijf vormt
      en of een handeling of samenstel van handelingen al dan niet uitoefening van het verzekeringsbedrijf vanuit een
      vestiging in een openbaar lichaam vormt. Zij beslist ambtshalve dan wel op schriftelijk verzoek van degene die de
      handeling of het samenstel van handelingen verricht of voornemens is te verrichten.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel4
  - number: '4.2'
    text: |-
      De Bank beslist tot welke van de in [artikel 3][ref1] genoemde schadegroepen een overeenkomst van schadeverzekering
      behoort. Zij beslist ambtshalve dan wel op schriftelijk verzoek van de verzekeraar die de overeenkomst van
      schadeverzekering sluit of voornemens is te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel3
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '3'
        hoofdstuk: I
  - number: '4.3'
    text: |-
      De Bank deelt haar ingevolge het eerste of tweede lid genomen beslissing bij aangetekende brief aan de betrokkene
      mee.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel4
  - number: '4.4'
    text: |-
      De Bank is bevoegd bij een ieder van wie zij vermoedt dat hij het verzekeringsbedrijf uitoefent, alle inlichtingen
      in te winnen die redelijkerwijze nodig geacht kunnen worden om zulks te beoordelen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel4
  - number: '4.5'
    text: |-
      Een ieder is verplicht de inlichtingen die ingevolge het vierde lid bij hem worden ingewonnen, binnen een door de
      Bank te stellen termijn te verstrekken.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel4
  - number: '4.6'
    text: |-
      De Bank is ter verkrijging van de in het vierde lid bedoelde inlichtingen bevoegd inzage te nemen of door personen,
      door haar bij uitdrukkelijke en bijzondere volmacht aangewezen, te doen nemen van de boeken en zakelijke bescheiden
      van degene van wie de Bank vermoedt dat hij het verzekeringsbedrijf uitoefent.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel4
  - number: '4.7'
    text: |-
      Hij die de in het zesde lid bedoelde boeken en zakelijke bescheiden onder zich heeft, is desgevorderd verplicht
      deze tot inzage over te leggen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel4
  - number: '5'
    text: 'Deze wet is, tenzij daaruit anders voortvloeit, van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel5
  - number: 5.a
    text: verzekeraars met zetel in een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel5
  - number: 5.b
    text: |-
      verzekeraars met zetel in het buitenland voor wat betreft het verzekeringsbedrijf dat zij vanuit een vestiging in
      een openbaar lichaam uitoefenen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel5
  - number: 5a
    text: |-
      Deze wet is niet van toepassing op de uitvoering van socialezekerheidsregelingen en zorgverzekeringen onder
      verantwoordelijkheid van Onze Minister van Sociale Zaken en Werkgelegenheid of Onze Minister van Volksgezondheid,
      Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel5a
  - number: '6.1'
    text: |-
      Als verzekeraars worden niet beschouwd fondsen, ingesteld door of vanwege het daartoe bevoegde gezag van het Rijk
      of een openbaar lichaam, die uitsluitend strekken ten bate van hen die in dienst van het gezag staan of gestaan
      hebben en hun betrekkingen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel6
  - number: '6.2'
    text: |-
      Als uitoefening van het schadeverzekeringsbedrijf wordt niet beschouwd het sluiten of afwikkelen van overeenkomsten
      als bedoeld in [artikel 1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel1
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '1'
        hoofdstuk: I
  - number: '6.3'
    text: |-
      Als uitoefening van het verzekeringsbedrijf wordt, met inachtneming van het vierde lid, niet beschouwd het sluiten
      of afwikkelen van overeenkomsten van verzekering voor eigen rekening door ondernemingspensioenfondsen als bedoeld
      in [artikel 1, eerste lid, onder b, van de Pensioenwet BES][ref1], die krachtens die wet aan het toezicht van de
      Bank zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel1
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '1'
  - number: '6.4'
    text: |-
      Het bepaalde in het derde lid is slechts van toepassing voor zover een ondernemingspensioenfonds handelt ter
      uitvoering van:
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel6
  - number: 6.4.a
    text: |-
      een toezegging omtrent pensioen als bedoeld in [artikel 2 van de Pensioenwet BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel2
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '2'
  - number: 6.4.b
    text: |-
      een vrijwillige pensioenvoorziening ten behoeve van een deelnemer in het ondernemingspensioenfonds, mits die
      voorziening past binnen het raam van de regeling die voor de categorie waartoe de deelnemer behoort, in het
      ondernemingspensioenfonds geldt ter uitvoering van een toezegging als in onder a bedoeld;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel6
  - number: 6.4.c
    text: |-
      een regeling krachtens welke de voor een deelnemer bestaande pensioenvoorziening bij beëindiging van diens
      deelnemerschap vrijwillig wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel6
  - number: '7.1'
    text: |-
      Bij algemene maatregel van bestuur, kunnen categorieën van verzekeraars worden aangewezen, waarop deze wet
      geheel of gedeeltelijk niet van toepassing is. Deze aanwijzing kan onder voorwaarden geschieden en zij kan worden
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister kan verzekeraars met zetel in het buitenland die naar het recht van hun zetel bevoegd zijn het
      verzekeringsbedrijf uit te oefenen, vrijstelling verlenen van de bij of krachtens deze wet gestelde regels, indien
      de belangen die deze wet beoogt te beschermen, in voldoende mate gewaarborgd worden door het toezicht dat in dat
      andere deel van het Koninkrijk, onderscheidenlijk die andere Staat, op die verzekeraars wordt uitgeoefend. Aan de
      vrijstelling kunnen voorschriften worden verbonden en beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel7
  - number: '8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur, kunnen regels worden gesteld, waarbij aan de ondernemingen of
      een nader te omschrijven categorie van de ondernemingen die voor eigen rekening overeenkomsten van verzekering
      sluiten tot het doen van uitkeringen in natura in verband met het overlijden van de mens, ook al wordt met
      de bedrijfsuitoefening het maken van winst niet beoogd, de verplichting wordt opgelegd, zich bij de Bank aan
      te melden en aan de Bank de door haar te bepalen financiële gegevens over te leggen. Daarbij kunnen tevens de
      [artikelen 28][ref1], [32][ref2] en [76][ref3] van overeenkomstige toepassing worden verklaard. Bij of krachtens
      algemene maatregel van bestuur, kunnen ten aanzien van de betrokken ondernemingen nadere voorschriften worden
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0028495#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0028495#Artikel76
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '28'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028495
        artikel: '32'
        hoofdstuk: III
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0028495
        artikel: '76'
        hoofdstuk: IX
  - number: '9.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel9
  - number: 9.1.a
    text: zonder vergunning van de Bank het verzekeringsbedrijf uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel9
  - number: 9.1.b
    text: het schadeverzekeringsbedrijf uit te oefenen in een schadegroep waarvoor de Bank geen vergunning heeft verleend;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel9
  - number: 9.1.c
    text: een ander bedrijf dan hetzij het levensverzekeringsbedrijf hetzij het schadeverzekeringsbedrijf uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel9
  - number: '9.2'
    text: |-
      Het bepaalde in het eerste lid, aanhef en onderdelen b en c, is niet van toepassing met betrekking tot het
      herverzekeren door een direkte verzekeraar van risico's die door een andere verzekeraar zijn gedekt.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel9
  - number: '10.1'
    text: Een vergunning voor de uitoefening van het schadeverzekeringsbedrijf wordt per schadegroep verleend.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel10
  - number: '10.2'
    text: |-
      In afwijking van [artikel 9, eerste lid, aanhef en onderdeel b][ref1], mogen in de uitoefening van het
      schadeverzekeringsbedrijf naast de risico’s die behoren tot de schadegroep waarvoor een vergunning is verleend,
      tevens risico's worden verzekerd die behoren tot schadegroepen waarvoor geen vergunning is verleend, mits deze
      risico’s naar het oordeel van de Bank als bijkomende risico's kunnen worden beschouwd omdat zij:


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel9
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '9'
        hoofdstuk: II
        afdeling: '1'
  - number: 10.2.a
    text: samenhangen met het hoofdrisico dat behoort tot de schadegroep waarvoor een vergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel10
  - number: 10.2.b
    text: betrekking hebben op het belang of het gevaarsobject dat is verzekerd tegen het hoofdrisico; en
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel10
  - number: 10.2.c
    text: worden verzekerd bij dezelfde overeenkomst als het hoofdrisico.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel10
  - number: '10.3'
    text: |-
      Kredietverzekering, borgtochtverzekering en rechtsbijstandverzekering mogen elk slechts worden gesloten bij een
      overeenkomst waarbij uitsluitend de onder de betrokken verzekering gedekte risico's zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      De Bank verleent een vergunning aan ieder die te haren genoegen heeft aangetoond dat hij voldoet aan de bij of
      krachtens deze wet gestelde eisen voor het verkrijgen van de vergunning.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel11
  - number: '11.2'
    text: |-
      Een vergunning wordt aangevraagd door indiening van een aanvraagformulier bij de Bank. De Bank stelt het model van
      het aanvraagformulier vast.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel11
  - number: '11.3'
    text: |-
      Indien voor de eerste maal een vergunning wordt aangevraagd, legt de aanvrager aan de Bank over een authentiek
      afschrift van zijn akte van oprichting en van zijn statuten, een exemplaar van zijn reglementen alsmede een lijst
      met namen en adressen van zijn bestuurders en commissarissen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel11
  - number: '12.1'
    text: |-
      Bij het aanvragen van een vergunning legt de aanvrager aan de Bank een programma van werkzaamheden ter beoordeling
      voor.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      Met betrekking tot het programma van werkzaamheden worden bij algemene maatregel van bestuur, nadere regelen
      gesteld, die kunnen verschillen naar gelang:
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel12
  - number: 12.2.a
    text: het deel van het Koninkrijk of de Staat waar de zetel van de aanvrager zich bevindt;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel12
  - number: 12.2.b
    text: |-
      een vergunning wordt aangevraagd voor de uitoefening van het levensverzekeringsbedrijf dan wel voor de uitoefening
      van het schadeverzekeringsbedrijf.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel12
  - number: '13'
    text: |-
      Een aanvrager die voornemens is overeenkomsten te sluiten tot dekking van de wettelijke
      aansprakelijkheid, voortvloeiende uit het gebruik van motorrijtuigen, voegt bij zijn aanvraag
      eveneens een door hem ondertekende verklaring dat zijn voorwaarden van verzekering in de zin van de
      [Wet aansprakelijkheidsverzekering motorrijtuigen BES][ref1] voldoen aan de in die wet gestelde eisen. De Bank
      stelt het model van de verklaring vast.


      [ref1]: https://wetten.overheid.nl/BWBR0028254
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028254
  - number: '14'
    text: |-
      Indien de stukken die bij het aanvragen van een vergunning zijn overgelegd, de Bank aanleiding geven tot het maken
      van opmerkingen, stelt zij de aanvrager in de gelegenheid op deze opmerkingen binnen een door haar te stellen
      redelijke termijn te antwoorden.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      De Bank deelt binnen 13 weken na ontvangst van de vereiste gegevens, bewijsstukken en inlichtingen, haar beslissing
      op de aanvraag van een vergunning bij aangetekende brief aan de aanvrager mee.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel15
  - number: '15.2'
    text: |-
      De vergunning wordt geweigerd indien de Bank van oordeel is dat de aanvrager niet heeft aangetoond dat hij aan de
      bij of krachtens deze wet gestelde eisen voor het verkrijgen van de vergunning voldoet. De beslissing van de Bank
      is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel15
  - number: '15.3'
    text: De Bank maakt haar beslissing tot het verlenen van een vergunning bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel15
  - number: '15.4'
    text: |-
      In de maand januari van elk jaar plaatst de Bank in de Staatscourant, een lijst van verzekeraars, onder vermelding
      van hun zetel, die op 31 december daaraanvoorafgaand in het bezit waren van de vereiste vergunningen. Bij de
      verzekeraars die het schadeverzekeringsbedrijf uitoefenen, worden de schadegroepen vermeld waarvoor vergunning is
      verleend. Bij de verzekeraars met zetel in het buitenland wordt tevens de naam en de plaats van kantoorvestiging
      van de vertegenwoordiger vermeld.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel15
  - number: '16.1'
    text: |-
      Een onderneming tot uitoefening van het verzekeringsbedrijf, met zetel in een openbaar lichaam, dient de rechtsvorm
      van naamloze vennootschap, besloten vennootschap of onderlinge waarborgmaatschappij te bezitten.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel16
  - number: '16.2'
    text: Het dagelijks beleid van een verzekeraar wordt bepaald door tenminste twee personen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel16
  - number: '16.3'
    text: |-
      Een verzekeraar die de rechtsvorm van naamloze vennootschap of besloten vennootschap bezit, heeft een raad van
      commissarissen, die uit drie of meer natuurlijke personen bestaat.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel16
  - number: '16.4'
    text: |-
      De in het derde lid bedoelde raad van commissarissen heeft tot taak toezicht te houden op het beleid van
      het bestuur van de verzekeraar en op de algemene gang van zaken in de vennootschap en de met haar verbonden
      onderneming. Hij staat het bestuur met raad terzijde. Bij de vervulling van hun taak richten de commissarissen zich
      naar het belang van de vennootschap en de met haar verbonden onderneming.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel16
  - number: '16.5'
    text: |-
      Omtrent de taak en de bevoegdheid van de raad van commissarissen en zijn leden kunnen de statuten van de
      verzekeraar aanvullende bepalingen bevatten.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel16
  - number: '16.6'
    text: |-
      De Bank kan aan een verzekeraar van het bepaalde in het tweede of derde lid geheel of gedeeltelijk ontheffing
      verlenen en aan deze ontheffing voorwaarden verbinden. Een ontheffing kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel16
  - number: '17.1'
    text: |-
      De personen die het dagelijkse beleid van een verzekeraar bepalen, dienen naar het oordeel van de Bank te
      beschikken over voldoende bekwaamheid tot het uitoefenen van het verzekeringsbedrijf.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel17
  - number: '17.2'
    text: |-
      De handelingen en de antecedenten van de personen die het beleid van de verzekeraar bepalen of mede bepalen,
      en van houders van een deelneming in de verzekeraar mogen de Bank geen aanleiding geven tot het oordeel dat hun
      betrouwbaarheid niet buiten twijfel staat, of dat de belangen van hen die als verzekeringnemers, verzekerden of
      gerechtigden op uitkeringen betrokken zijn of zullen worden bij overeenkomsten van verzekering, gesloten of te
      sluiten met de verzekeraar, in gevaar zouden kunnen komen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel17
  - number: 17a
    text: |-
      Een verzekeraar voert een adequaat beleid dat een integere uitoefening van zijn bedrijf waarborgt. Bij ministeriële
      regeling kunnen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel17a
  - number: '18'
    text: |-
      Ingeval het waarborgkapitaal van een onderlinge waarborgmaatschappij in aandelen is verdeeld, mogen aandeelbewijzen
      niet worden uitgegeven tenzij, indien het een aandeel op naam betreft, tenminste een tiende gedeelte van het volle
      bedrag, en indien het aandeel toonder betreft, tenminste het volle bedrag, is gestort.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel18
  - number: '19'
    text: |-
      Een onderneming tot uitoefening van het verzekeringsbedrijf met zetel in een openbaar lichaam, die een vergunning
      aanvraagt, dient te beschikken over:
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel19
  - number: 19.a
    text: |-
      het minimum bedrag van de solvabiliteitsmarge, bedoeld in [artikel 36, derde lid][ref1], danwel – ingeval de
      onderneming reeds een of meer vergunningen voor de uitoefening van het schadeverzekeringsbedrijf bezit – over de
      ingevolge artikel 36, tweede lid, vereiste solvabiliteitsmarge indien deze hoger is dan bedoeld minimum bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel36
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '36'
        hoofdstuk: III
        afdeling: '3'
  - number: 19.b
    text: |-
      voldoende financiële middelen tot dekking van de te verwachten kosten, verbonden aan de inrichting van de
      administratie en van het produktienet voor de bedrijfsuitoefening waarvoor de vergunning wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel19
  - number: 19a
    text: |-
      Een verzekeraar met zetel in het buitenland die voorafgaand aan het ingevolge artikel 2, eerste lid, van
      de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba van toepassing worden van deze wet in de
      openbare lichamen, op grond van artikel 19a van de Landsverordening Toezicht Verzekeringsbedrijf vanuit zijn
      vestigingen in de Nederlandse Antillen zowel het levensverzekeringsbedrijf als het schadeverzekeringsbedrijf
      in de schadegroep Ongevallen- en ziekteverzekering mocht uitoefenen, mag dit in afwijking van
      [artikel 9, eerste lid, aanhef en onderdeel c][ref1], na genoemde datum blijven doen, mits het beheer van de
      werkzaamheden in de uitoefening van het levensverzekeringsbedrijf ten genoegen van de Bank is gescheiden van het
      beheer van de werkzaamheden in de uitoefening van het schadeverzekeringsbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel9
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '9'
        hoofdstuk: II
        afdeling: '1'
  - number: '20.1'
    text: |-
      Het is een verzekeraar met zetel in het buitenland, die buiten de openbare lichamen zowel het
      levensverzekeringsbedrijf als het schadeverzekeringsbedrijf uitoefent, verboden vanuit een vestiging in een
      openbaar lichaam het levensverzekeringsbedrijf uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel20
  - number: '20.2'
    text: 'Het in het eerste lid bedoelde verbod geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel20
  - number: 20.2.a
    text: |-
      een verzekeraar als bedoeld in [artikel 19a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel19a
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: 19a
        hoofdstuk: II
        afdeling: '3'
  - number: 20.2.b
    text: |-
      een verzekeraar die sinds 1 december 1991 tot het tijdstip waarop ingevolge
      [artikel 2, eerste lid, van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] deze wet
      van toepassing werd in de openbare lichamen, vanuit vestigingen in de Nederlandse Antillen en na die datum vanuit
      vestigingen in de openbare lichamen uitsluitend het levensverzekeringsbedrijf heeft uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel2
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028063
        artikel: '2'
  - number: '21'
    text: 'Een verzekeraar met zetel in het buitenland, die een vergunning aanvraagt, dient:'
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel21
  - number: 21.a
    text: |-
      naar het recht van het deel van het Koninkrijk waar zijn zetel is gevestigd, dan wel van de Staat van zijn zetel
      rechtspersoon te zijn;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel21
  - number: 21.b
    text: |-
      in het deel van het Koninkrijk waar zijn zetel is gevestigd, dan wel in de Staat van zijn zetel bevoegd te zijn
      tot uitoefening van het verzekeringsbedrijf waarop zijn aanvraag van een vergunning betrekking heeft en dit bedrijf
      aldaar daadwerkelijk uit te oefenen sedert tenminste vijf jaren, direct voorafgaande aan het tijdstip waarop de
      aanvraag wordt ingediend;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel21
  - number: 21.c
    text: |-
      met betrekking tot zijn gehele verzekeringsbedrijf, waar dit ook wordt uitgeoefend, over een solvabiliteitsmarge
      te beschikken, die tenminste overeenkomt met de krachtens [artikel 36, eerste tot en met derde lid][ref1], vereiste
      solvabiliteitsmarge.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel36
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '36'
        hoofdstuk: III
        afdeling: '3'
  - number: '22.1'
    text: 'Een verzekeraar met zetel in het buitenland, die een vergunning aanvraagt, dient voorts:'
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel22
  - number: 22.1.a
    text: |-
      bij algemene maatregel van bestuur, te bepalen waarden volgens de daarbij te stellen regelen als
      solvabiliteitsfonds aan te houden in de openbare lichamen, zulks ten belope van een bij die maatregel voor het
      levensverzekeringsbedrijf, het schadeverzekeringsbedrijf en de verzekeraars, bedoeld in [artikel 19a][ref1],
      afzonderlijk vast te stellen bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel19a
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: 19a
        hoofdstuk: II
        afdeling: '3'
  - number: 22.1.b
    text: |-
      te beschikken over voldoende financiële middelen tot dekking van de te verwachten kosten, verbonden aan de
      inrichting van de administratie en van het produktienet in de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel22
  - number: '22.2'
    text: |-
      In de algemene maatregel van bestuur, bedoeld in het eerste lid, onderdeel a, kan worden voorgeschreven dat de
      verzekeraar voor bepaalde handelingen, betreffende het solvabiliteitsfonds, bedoeld in het eerste lid onder a,
      toestemming van de Bank behoeft.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel22
  - number: '23.1'
    text: |-
      De verzekeraar met zetel in het buitenland stelt als zijn vertegenwoordiger een natuurlijk persoon of een
      rechtspersoon aan, die zijn woonplaats onderscheidenlijk zijn zetel in een openbaar lichaam heeft.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel23
  - number: '23.2'
    text: |-
      De vertegenwoordiger heeft ten aanzien van de uitoefening van het verzekeringsbedrijf vanuit de vestigingen in de
      openbare lichamen van rechtswege alle bevoegdheden die de verzekeraar bezit. Hij is verplicht daarvan gebruik te
      maken voor zover de Bank dat van hem eist.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel23
  - number: '23.3'
    text: |-
      De vertegenwoordiger is gehouden namens de verzekeraar tot voldoen aan de bij krachtens deze wet gegeven
      voorschriften. Het ontbreken van de vertegenwoordiger of zijn in gebreke zijn ontslaat de verzekeraar niet van de
      verplichting te voldoen aan deze voorschriften.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel23
  - number: '23.4'
    text: |-
      Is de vertegenwoordiger rechtspersoon, dan wijst hij op zijn beurt een natuurlijk persoon aan, die in de openbare
      lichamen zijn woonplaats heeft en die hem bij uitsluiting van ieder ander vertegenwoordigt in de uitoefening van
      zijn bevoegdheden en in de nakoming van zijn uit deze wet voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel23
  - number: '23.5'
    text: Als plaats van vestiging van de verzekeraar in de openbare lichamen geldt het kantoor van zijn vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel23
  - number: '23.6'
    text: |-
      [Artikel 17][ref1] is van overeenkomstige toepassing op de natuurlijke persoon die als vertegenwoordiger is
      aangesteld en op de natuurlijke persoon, bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel17
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '17'
        hoofdstuk: II
        afdeling: '2'
  - number: '24.1'
    text: |-
      Bij het aanvragen van de eerste vergunning legt de verzekeraar aan de Bank over, de akte van aanstelling van zijn
      vertegenwoordiger alsook, indien de vertegenwoordiger rechtspersoon is, een authentiek afschrift van de akte van
      oprichting en van de statuten van deze rechtspersoon, een uittreksel uit diens inschrijving in het handelsregister
      en de akte van aanstelling van de natuurlijke persoon, bedoeld in [artikel 23, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel23
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '23'
        hoofdstuk: II
        afdeling: '3'
  - number: '24.2'
    text: De modellen van de akten van aanstelling, bedoeld in het eerste lid, worden door de Bank vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel24
  - number: 24a
    text: |-
      [Artikel 17a][ref1] is van overeenkomstige toepassing op in de openbare lichamen gelegen bijkantoren van
      verzekeraars met zetel in het buitenland.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel17a
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: 17a
        hoofdstuk: II
        afdeling: '2'
  - number: '25.1'
    text: Een verzekeraar doet het boekjaar gelijk lopen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel25
  - number: '25.2'
    text: |-
      De Bank is bevoegd van het bepaalde in het eerste lid ontheffing te verlenen. Aan een ontheffing kunnen voorwaarden
      worden verbonden en zij kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel25
  - number: '26.1'
    text: |-
      Een verzekeraar dient binnen zes maanden na afloop van elk boekjaar bij de Bank staten in, die te zamen een
      duidelijk beeld geven van het door de verzekeraar gevoerde beheer en van zijn financiële toestand. Een verzekeraar
      dient voorts binnen de door de Bank te bepalen termijn een of meer van deze staten in, indien de Bank zulks voor de
      vervulling van de haar bij of krachtens deze wet opgelegde taak mocht verlangen. De indiening geschiedt in tweevoud
      en voor wat betreft de staten die ingevolge het zesde lid, laatste volzin, openbaar worden gemaakt, in drievoud,
      tenzij de Bank andere aantallen vaststelt.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel26
  - number: '26.2'
    text: |-
      Een verzekeraar doet de staten vergezeld gaan van een verklaring van een externe deskundige als bedoeld in
      [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1]. Ten bewijze dat de staten door hem zijn onderzocht
      of, indien het staten betreft als bedoeld in het derde lid, in zijn onderzoek zijn betrokken, waarmerkt de
      deskundige de staten. De verzekeraar is verplicht bij de opdracht tot het onderzoek de deskundige schriftelijk te
      machtigen aan de Bank onverwijld schriftelijk alle inlichtingen te verstrekken, die redelijkerwijs geacht kunnen
      worden nodig te zijn voor de vervulling van de aan de Bank bij of krachtens deze wet opgelegde taak. De Bank doet
      de verzekeraar afschrift toekomen van alle ontvangen stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '26.3'
    text: |-
      Met betrekking tot het levensverzekeringsbedrijf behelst een der staten het actuariële verslag, terwijl in een
      andere staat de sterftevergelijking is opgenomen. Deze staten worden voorzien van een verklaring van de actuaris,
      waarmee deze bevestigt dat hij zich ervan heeft overtuigd dat de in het actuariële verslag genoemde voorzieningen
      juist zijn vastgesteld en de sterftevergelijking juist is weergegeven. Ten bewijze van een en ander waarmerkt de
      actuaris de betrokken staten. Hij is bevoegd zijn verklaring nader toe te lichten of op enig punt een voorbehoud
      te maken.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel26
  - number: '26.4'
    text: |-
      Tot het afgeven van de verklaring, bedoeld in het tweede, onderscheidenlijk derde lid, is slechts een deskundige
      onderscheidenlijk een actuaris bevoegd, tegen wie de Bank bij de verzekeraar geen bezwaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel26
  - number: '26.5'
    text: |-
      De Bank kan tegen de aanwijzing of handhaving van een deskundige of een actuaris bezwaar maken indien de betrokkene
      naar haar oordeel niet of niet meer de nodige waarborgen biedt dat hij de hem toevertrouwde taak naar behoren zal
      vervullen. Het bezwaar wordt schriftelijk ter kennis gebracht van de betrokken verzekeraar en van de betrokken
      deskundige of actuaris.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel26
  - number: '26.6'
    text: |-
      De modellen van de staten worden voor het levensverzekeringsbedrijf en voor het schadeverzekeringsbedrijf bij
      ministeriële regeling vastgesteld. Daarbij wordt bepaald welke staten openbaar moeten worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel26
  - number: '26.7'
    text: |-
      De verzekeraar legt de openbaar te maken staten op zijn kantoren in de openbare lichamen ter inzage van een ieder
      tot achttien maanden na afloop van het boekjaar waarop de staten betrekking hebben. Tot zolang verstrekt hij een
      ieder op diens verzoek een afschrift tegen ten hoogste de kostprijs daarvan.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel26
  - number: '27.1'
    text: |-
      Een verzekeraar met zetel in een openbaar lichaam dient binnen zes maanden na afloop van elk boekjaar een
      jaarverslag in tweevoud bij de Bank in. Het jaarverslag geeft een getrouw beeld van de toestand op de balansdatum
      en de gang van zaken gedurende het boekjaar. Het bevat mede inlichtingen omtrent gebeurtenissen van bijzondere
      betekenis, die na het einde van het boekjaar hebben plaatsgevonden, terwijl voorts mededelingen worden gedaan over
      de verwachte gang van zaken. Het jaarverslag mag niet in strijd zijn met de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel27
  - number: '27.2'
    text: |-
      Een verzekeraar met zetel in het buitenland dient zijn jaarrekening en jaarverslag, betreffende zijn gehele
      bedrijf, waar dit ook wordt uitgeoefend, in tweevoud bij de Bank in zodra hij deze jaarstukken openbaar moet hebben
      gemaakt of krachtens het recht van het deel van het Koninkrijk waar zijn zetel is gevestigd, dan wel van de Staat
      van zijn zetel openbaar moet hebben gemaakt.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel27
  - number: '27.3'
    text: |-
      Ten aanzien van de jaarstukken, bedoeld in het eerste en tweede lid, is [artikel 26, zevende lid,][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel26
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '26'
        hoofdstuk: III
        afdeling: '1'
  - number: '28'
    text: |-
      De Bank beschikt over de bevoegdheden van de [artikelen 5:16][ref1] en
      [5:17 van de Algemene wet bestuursrecht][ref2]. De [artikelen 5:13][ref3] en [5:20 van die wet][ref4] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '29'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel29
  - number: '30'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel30
  - number: '31.1'
    text: |-
      Indien een verzekeraar niet voldoet aan het bij of krachtens deze wet bepaalde, of indien de Bank zulks
      noodzakelijk acht in het belang van degenen die als verzekeringnemers, verzekerden of gerechtigden op uitkeringen
      betrokken zijn of zullen worden bij overeenkomsten van verzekering, gesloten of te sluiten door een verzekeraar,
      kan zij deze verzekeraar bij aangetekende brief een met redenen omklede aanwijzing geven.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel31
  - number: '31.2'
    text: De verzekeraar is verplicht de aanwijzing binnen de door de Bank gestelde termijn op te volgen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel31
  - number: '31.3'
    text: |-
      Indien de Bank niet binnen veertien dagen na dagtekening van de aanwijzing een haar bevredigend antwoord van de
      verzekeraar heeft ontvangen of naar het oordeel van de Bank niet of onvoldoende aan haar aanwijzing is gevolg
      gegeven, kan zij:
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel31
  - number: 31.3.a
    text: |-
      de verzekeraar bij aangetekende brief aanzeggen, dat vanaf een bepaald tijdstip alle of bepaalde organen van de
      verzekeraar, daaronder voor de toepassing van dit artikel de vertegenwoordiger begrepen, hun bevoegdheden slechts
      mogen uitoefenen na goedkeuring door een of meer door de Bank aangewezen personen, welke aanzegging terstond van
      kracht wordt;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel31
  - number: 31.3.b
    text: |-
      de verzekeraar bij aangetekende brief aanzeggen, dat de Bank zal overgaan tot bekendmaking van de aanwijzing,
      bedoeld in het eerste lid. Deze bekendmaking geschiedt in de Staatscourant alsook in een of meer dagbladen ter
      keuze van de Bank. Bij de bekendmaking wordt, indien de verzekeraar zulks verlangt, tevens de correspondentie
      bekend gemaakt, die naar aanleiding van de aanwijzing tussen de Bank en de verzekeraar is gevoerd.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel31
  - number: '31.4'
    text: |-
      Indien het in het eerste lid bedoelde belang onverwijld ingrijpen noodzakelijk maakt, kan de Bank zonder toepassing
      van het eerste lid onmiddellijk uitvoering geven aan onderdeel a van het derde lid, nadat zij de verzekeraar in de
      gelegenheid heeft gesteld zijn mening over de onmiddellijke uitvoering te geven. In dat geval is een aanzegging als
      bedoeld in het derde lid, onderdeel a, met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel31
  - number: '31.5'
    text: |-
      De organen van de verzekeraar zijn verplicht de door de Bank aangewezen personen alle medewerking te verlenen.
      De Bank kan de betrokken organen van de verzekeraar toestaan bepaalde handelingen zonder haar machtiging te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel31
  - number: '31.6'
    text: |-
      De door de Bank aangewezen personen oefenen hun bevoegdheden uit gedurende ten hoogste twee jaren na verzending
      van de aanzegging, bedoeld in het derde lid, onderdeel a, behoudens de bevoegdheid van de Bank om deze termijn te
      verlengen telkens voor ten hoogste een jaar. Van zodanige verlenging doet de Bank aan de verzekeraar mededeling
      bij aangetekende brief. De verlenging wordt terstond van kracht. De Bank kan te allen tijde de door haar aangewezen
      personen door andere vervangen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel31
  - number: '31.7'
    text: |-
      Voor schade tengevolge van handelingen die zijn verricht in strijd met een aanzegging als bedoeld in het derde lid,
      onderdeel a, zijn degenen die deze handelingen als orgaan van de verzekeraar verrichten, persoonlijk aansprakelijk
      tegenover de verzekeraar. De verzekeraar – of de Bank namens de verzekeraar – kan de ongeldigheid van deze
      handelingen inroepen, indien de wederpartij wist dat de vereiste goedkeuring ontbrak of daarvan niet onkundig kon
      zijn.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel31
  - number: '31.8'
    text: |-
      De Bank trekt in elk geval de maatregel, bedoeld in het derde lid, onderdeel a, in zodra zij van oordeel is, dat
      het in het eerste lid bedoelde belang deze maatregel niet langer noodzakelijk maakt. Zij stelt de verzekeraar van
      de intrekking bij aangetekende brief in kennis.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel31
  - number: '31.9'
    text: |-
      Het besluit tot bekendmaking van een aanwijzing, bedoeld in het derde lid, onderdeel b, wordt eerst van kracht,
      wanneer het onherroepelijk is geworden. Indien de verzekeraar na de bekendmaking alsnog voldoet aan de aanwijzing
      dan wel indien de Bank de aanwijzing intrekt, zal de Bank hiervan op dezelfde wijze als bij de voorafgegane
      bekendmaking kennis geven.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel31
  - number: '31.10'
    text: |-
      De kosten en beloning van de door de Bank aangewezen personen, bedoeld in het derde lid, onderdeel a, en de kosten
      van de bekendmakingen bedoeld in het derde lid, onderdeel b, en het negende lid, laatste volzin, komen ten laste
      van de betrokken verzekeraar.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel31
  - number: '32.1'
    text: |-
      Een verzekeraar met zetel in een openbaar lichaam legt elke voorgenomen wijziging van zijn statuten en reglementen
      en elke wijziging in de samenstelling van zijn bestuur, raad van commissarissen of degenen die anderszins zijn
      beleid bepalen, alsmede elke ingrijpende wijziging van zijn beleid betreffende de integere uitoefening van het
      bedrijf vooraf ter goedkeuring voor aan de Bank.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel32
  - number: '32.2'
    text: |-
      Een verzekeraar met zetel in het buitenland legt elke ingrijpende wijziging van zijn beleid betreffende de
      integere uitoefening van het bedrijf met betrekking tot zijn bijkantoor in een openbaar lichaam, elk voornemen
      tot aanstelling van een vertegenwoordiger als bedoeld in [artikel 23, eerste lid][ref1], en elk voornemen tot
      aanwijzing van een natuurlijk persoon als bedoeld in artikel 23, vierde lid, vooraf ter goedkeuring voor aan de
      Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel23
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '23'
        hoofdstuk: II
        afdeling: '3'
  - number: '32.3'
    text: |-
      Een verzekeraar legt een authentiek afschrift van elke wijziging van zijn statuten en een door zijn bestuur
      gewaarmerkt afschrift van elke wijziging van zijn reglementen aan de Bank over en brengt elke wijziging in de
      samenstelling van zijn bestuur en raad van commissarissen ter kennis van de Bank, een en ander binnen veertien
      dagen na de totstandkoming van de wijziging.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel32
  - number: '32.4'
    text: |-
      Een verzekeraar die het levensverzekeringsbedrijf uitoefent, doet van elke wijziging van zijn algemene en
      bijzondere polisvoorwaarden, van zijn tarieven en van de technische grondslagen voor de berekening van zijn
      tarieven binnen veertien dagen na de totstandkoming daarvan opgave aan de Bank.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel32
  - number: '33.1'
    text: |-
      De Bank brengt jaarlijks, vóór 1 september, verslag uit aan Onze Minister over haar werkzaamheden en
      bevindingen in de uitoefening van de haar bij deze wet opgedragen taak. In het verslag worden niet opgenomen
      de door haar uitgebrachte adviezen die niet bekend zijn gemaakt, noch wordt ten aanzien van afzonderlijke
      verzekeraars melding gemaakt van inlichtingen die niet in de openbaar te maken staten, bedoeld in
      [artikel 26, zesde lid, laatste volzin][ref1], zijn opgenomen. Een oordeel over enige verzekeraar wordt in dit
      verslag niet kenbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel26
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '26'
        hoofdstuk: III
        afdeling: '1'
  - number: '33.2'
    text: Het verslag wordt door de zorg van de Bank openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel33
  - number: '34.1'
    text: |-
      Een verzekeraar is verplicht toereikende technische voorzieningen aan te houden. Bij of krachtens algemene
      maatregel van bestuur, kunnen terzake voor het levensverzekeringsbedrijf en voor het schadeverzekeringsbedrijf
      nadere regelen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel34
  - number: '34.2'
    text: |-
      De technische voorzieningen dienen volledig door waarden te zijn gedekt. De Bank kan tegen de aard en de waardering
      van deze waarden bezwaar maken, aan welk bezwaar de verzekeraar dient tegemoet te komen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel34
  - number: '34.3'
    text: |-
      De waarden die dienen tot dekking van de technische voorzieningen moeten in dezelfde muntsoort kunnen worden te
      gelde gemaakt of geïnd als die waarin de verplichtingen luiden. Zij moeten in de openbare lichamen aanwezig zijn,
      met dien verstande dat zulks ten aanzien van verzekeraars met zetel in een openbaar lichaam slechts geldt voor
      de waarden die dienen tot dekking van de technische voorzieningen voor de vanuit de vestigingen in de openbare
      lichamen aangegane verplichtingen. Waarden die bestaan uit schuldvorderingen, zijn in de openbare lichamen aanwezig
      indien zij aldaar kunnen worden geïnd.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel34
  - number: '34.4'
    text: |-
      De Bank verleent een verzekeraar op diens verzoek ontheffing van het bepaalde in de eerste of tweede volzin van
      het derde lid mits de belangen van de verzekeringnemers, verzekerden of gerechtigden op uitkeringen zich naar haar
      oordeel daarentegen [bedoeld zal zijn: daartegen] niet verzetten. Aan een ontheffing kunnen voorwaarden worden
      verbonden en zij kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel34
  - number: '34.5'
    text: |-
      Een vordering op een herverzekeraar uit hoofde van een door een verzekeraar als verzekeringnemer gesloten
      overeenkomst van herverzekering komt als waarde, bedoeld in het derde lid, in aanmerking voor zover het naar
      het oordeel van de Bank aannemelijk is dat de vordering in de openbare lichamen zal worden voldaan of anders de
      desbetreffende schade door de verzekeraar in het buitenland moet worden vergoed. Het bepaalde in de vorige volzin
      is eveneens van toepassing op een toekomstige vordering op de herverzekeraar mits de vordering betrekking heeft
      op een reeds bekende maar nog niet afgewikkelde schade. Bij de berekening van de hoogte van de vorderingen op de
      herverzekeraar worden de bedragen die de verzekeraar aan de herverzekeraar verschuldigd is, in mindering gebracht
      op het totale bedrag van de vorderingen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel34
  - number: '34.6'
    text: |-
      Ten aanzien van vorderingen op herverzekeraar als bedoeld in het vijfde lid, is het bepaalde in het derde lid,
      tweede volzin, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel34
  - number: '35.1'
    text: |-
      De waarden die dienen tot dekking van de technische voorzieningen voor de vanuit de vestigingen in de openbare
      lichamen aangegane verplichtingen, worden door de verzekeraar als zodanig geadministreerd. Een verzekeraar als
      in [artikel 19a][ref1], onderscheidt in deze administratie de waarden, behorende tot het door hem uitgeoefende
      levensverzekeringsbedrijf, van de waarden, behorende tot het door hem uitgeoefende schadeverzekeringsbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel19a
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: 19a
        hoofdstuk: II
        afdeling: '3'
  - number: '35.2'
    text: |-
      In een der staten, bedoeld in [artikel 26][ref1], vermeldt de verzekeraar de bedragen die de in het eerste lid
      bedoelde waarden per categorie, als aangegeven in de staat, in totaal belopen.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel26
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '26'
        hoofdstuk: III
        afdeling: '1'
  - number: '36.1'
    text: |-
      Een verzekeraar met zetel in een openbaar lichaam die het levensverzekeringsbedrijf uitoefent, dient te beschikken
      over een solvabiliteitsmarge die tenminste vier procent van de voorziening voor verzekeringsverplichtingen aan
      het einde van het voorgaande boekjaar beloopt, zonder dat rekening wordt gehouden met de herverzekering van deze
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel36
  - number: '36.2'
    text: |-
      Een verzekeraar met zetel in een openbaar lichaam die het schadeverzekeringsbedrijf uitoefent, dient te beschikken
      over een solvabiliteitsmarge die tenminste vijftien procent van de in het voorgaande boekjaar geboekte bruto premie
      beloopt.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel36
  - number: '36.3'
    text: |-
      De solvabiliteitsmarge beloopt evenwel tenminste een bij algemene maatregel van bestuur voor levensverzekeraars
      onderscheidenlijk schadeverzekeraars vast te stellen bedrag.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel36
  - number: '36.4'
    text: |-
      In een krachtens [artikel 26, zesde lid][ref1], vast te stellen model van een staat wordt bepaald welke
      vermogensbestanddelen de solvabiliteitsmarge kunnen vormen, welke vermogensbestanddelen daarbij een aftrek
      dienen te vormen, alsmede de mate waarin en de voorwaarden waaronder een en ander geschiedt. De Bank kan tegen de
      waardering van de vermogensbestanddelen bezwaar maken.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel26
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '26'
        hoofdstuk: III
        afdeling: '1'
  - number: '36.5'
    text: |-
      Indien een verzekeraar met zetel in een openbaar lichaam weet of redelijkerwijze kan voorzien dat zijn
      solvabiliteitsmarge niet voldoet of zal voldoen aan de eisen die daaraan krachtens het eerste tot en met derde lid
      zijn gesteld, doet hij hiervan terstond aan de Bank mededeling.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel36
  - number: '37'
    text: |-
      Een verzekeraar met zetel in het buitenland voert ten kantore van zijn vertegenwoordiger de boekhouding van het
      bedrijf dat hij in de openbare lichamen uitoefent en bewaart aldaar de zakelijke bescheiden met betrekking tot
      dat bedrijf.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel37
  - number: '38.1'
    text: |-
      Ontslag van de vertegenwoordiger is niet geldig tenzij het gepaard gaat met de aanstelling van een opvolger. Het
      ontslag gaat niet in voordat de akten van ontslag en van aanstelling van de opvolger aan de Bank zijn overgelegd en
      deze aan het bestuur van de verzekeraar schriftelijk heeft meegedeeld dat zij daartegen geen bezwaar heeft.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel38
  - number: '38.2'
    text: |-
      De vertegenwoordiger die heeft bedankt, behoudt zijn hoedanigheid totdat hij van zijn bedanken kennis heeft gegeven
      aan de Bank en deze aan het bestuur van de verzekeraar schriftelijk heeft aangedeeld [bedoeld zal zijn: meegedeeld]
      dat zij daartegen geen bezwaar heeft.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel38
  - number: '39.1'
    text: |-
      Een vertegenwoordiger houdt vanaf de dag van zijn faillietverklaring of ondercuratelestelling van rechtswege op
      vertegenwoordiger te zijn.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel39
  - number: '39.2'
    text: |-
      De aanwijzing, bedoeld in [artikel 23, vierde lid][ref1], vervalt van rechtswege vanaf de dag van
      faillietverklaring of ondercuratelestelling van de aangewezen natuurlijke persoon alsmede vanaf de dag van
      faillietverklaring van de vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel23
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '23'
        hoofdstuk: II
        afdeling: '3'
  - number: '40.1'
    text: |-
      Van het overlijden, de faillietverklaring of de ondercuratelestelling van de vertegenwoordiger of de natuurlijke
      persoon, bedoeld in [artikel 23, vierde lid][ref1], alsmede van het ontslag van deze natuurlijke persoon, geeft de
      verzekeraar onderscheidenlijk de vertegenwoordiger binnen acht dagen aan de Bank kennis. Dezelfde verplichting rust
      op de verzekeraar ingeval hij een rechtspersoon als zijn vertegenwoordiger heeft aangewezen en deze rechtspersoon
      is ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel23
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '23'
        hoofdstuk: II
        afdeling: '3'
  - number: '40.2'
    text: |-
      In de gevallen, genoemd in het eerste lid, alsook in het geval dat de vertegenwoordiger heeft bedankt, stelt de
      verzekeraar of wijst de vertegenwoordiger binnen een door de Bank te bepalen termijn een nieuwe vertegenwoordiger
      onderscheidenlijk een andere natuurlijke persoon aan. Het bepaalde in [artikel 24, eerste lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel24
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '24'
        hoofdstuk: II
        afdeling: '3'
  - number: '40.3'
    text: |-
      Zolang de vertegenwoordiger ontbreekt, wordt de verzekeraar geacht te zijn gevestigd ten parkette van de officier
      van justitie bij het Gerecht.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel40
  - number: '41'
    text: |-
      Een vertegenwoordiger die rechtspersoon is, legt een authentiek afschrift van elke wijziging van zijn statuten aan
      de Bank over binnen veertien dagen na de totstandkoming van de wijziging.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel41
  - number: '42'
    text: |-
      Indien een verzekeraar de beschikkingsbevoegdheid van zijn vertegenwoordiger ten aanzien van de waarden, behorende
      tot het in de openbare lichamen uitgeoefende verzekeringsbedrijf, heeft beperkt, brengt de verzekeraar elke
      wijziging daarin binnen veertien dagen van de totstandkoming van de wijziging ter kennis van de Bank. Eenzelfde
      verplichting tot kennisgeving rust op de verzekeraar die de beschikkingsbevoegdheid van zijn vertegenwoordiger na
      diens aanstelling beperkt.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel42
  - number: '43.1'
    text: |-
      De Bank kan ieder die in de openbare lichamen bemiddelt bij of op soortgelijke wijze meewerkt aan de
      totstandkoming van overeenkomsten van verzekering die verzekeraars met zetel in het buitenland in hun in het
      buitenland uitgeoefende bedrijf sluiten met in de openbare lichamen woonachtige of gevestigde verzekeringnemers,
      verplichten aan de Bank periodiek schriftelijk opgave te doen van de aldus met zijn medewerking tot stand gekomen
      overeenkomsten. In deze opgave worden met betrekking tot elke overeenkomst vermeld de datum van sluiting, de naam
      en het adres van de betrokken verzekeraar en de bij de overeenkomst gedekte risico's en verschuldigde premies.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel43
  - number: '43.2'
    text: De Bank stelt het model van de in het eerste lid bedoelde opgave vast.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel43
  - number: '44.1'
    text: |-
      Onze Minister kan, de Bank gehoord, aan een verzekeraar met zetel in het buitenland voorschriften of een verbod
      opleggen ter zake van acquisitie in de openbare lichamen van in de bedrijfsuitoefening vanuit een vestiging buiten
      de openbare lichamen te sluiten overeenkomsten van verzekering.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel44
  - number: '44.2'
    text: |-
      Onder acquisitie worden verstaan alle handelingen, strekkende tot het voorbereiden of tot stand brengen van
      overeenkomsten van verzekering.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel44
  - number: '44.3'
    text: |-
      Onze Minister vaardigt voorschriften of een verbod ter zake van acquisitie niet uit dan nadat de betrokken
      verzekeraar in de gelegenheid is gesteld zijn gevoelens daaromtrent schriftelijk aan Onze Minister kenbaar te
      maken.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel44
  - number: '44.4'
    text: |-
      Besluiten van Onze Minister, houdende voorschriften of een verbod ter zake van acquisitie, en de intrekking
      daarvan, worden aan de verzekeraar bij aangetekende brief meegedeeld en bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel44
  - number: '44.5'
    text: |-
      Indien de verzekeraar beroep instelt tegen een besluit van Onze Minister, houdende voorschriften of een verbod ter
      zake van acquisitie, wordt de bekendmaking van het besluit opgeschort.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel44
  - number: '44.6'
    text: |-
      Het is verboden in de openbare lichamen te bemiddelen bij of op enige andere wijze mee te werken aan de
      voorbereiding of de totstandkoming van overeenkomsten van verzekering met een verzekeraar aan wie een verbod van
      acquisitie is opgelegd, dan wel te handelen in strijd met de op grond van het eerste lid gegeven voorschriften
      omtrent acquisitie.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel44
  - number: '45.1'
    text: |-
      Een verzekeraar kan zijn rechten en verplichtingen uit alle of een deel van de overeenkomsten van levensverzekering
      slechts bij schriftelijke overeenkomst en met schriftelijke toestemming van de Bank aan een andere verzekeraar
      overdragen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel45
  - number: '45.2'
    text: |-
      In afwijking van het eerste lid is een verzekeraar bevoegd zijn rechten en verplichtingen uit een individuele
      overeenkomst van levensverzekering op schriftelijk verzoek van de verzekeringnemer over te dragen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel45
  - number: '46.1'
    text: |-
      Een aanvraag ter verklaring van toestemming van de Bank tot overdracht van rechten en verplichtingen gaat vergezeld
      van een ontwerp-overeenkomst met alle ter toelichting dienende stukken. De verzekeraar verstrekt tevens de door de
      Bank verlangde aanvullende gegevens.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel46
  - number: '46.2'
    text: |-
      Indien de Bank aanvankelijk geen bezwaren heeft tegen het ontwerp van tot de overdracht strekkende overeenkomst,
      geeft zij daarvan zo spoedig mogelijk na de ontvangst aan de verzekeraar kennis. Heeft zij aanvankelijk wel
      bezwaren, dan brengt zij deze bezwaren, met redenen omkleed, eveneens zo spoedig mogelijk schriftelijk ter kennis
      van de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel46
  - number: '47.1'
    text: |-
      Indien de Bank tegen het ontwerp aanvankelijk geen bezwaren heeft of nadat aan deze bezwaren is tegemoetgekomen,
      maakt de verzekeraar zijn voornemen tot overdracht van rechten en verplichtingen bekend in de Staatscourant en op
      andere door de Bank in het belang van de polishouders te bepalen wijze. Daarbij wordt mededeling gedaan van een
      door de Bank vast te stellen termijn, binnen welke de betrokken polishouders zich bij de Bank schriftelijk tegen de
      overdracht kunnen verzetten.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel47
  - number: '47.2'
    text: |-
      Indien polishouders, vertegenwoordigende een vierde of meer van het betrokken verzekerde bedrag, zich binnen de
      gestelde termijn tegen de overdracht hebben verzet, kan een overdracht niet volgen, ook niet ten aanzien van hen
      die zich tegen de overdracht niet hebben verzet. De Bank doet daarvan mededeling aan de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel47
  - number: '47.3'
    text: |-
      Heeft de Bank alsnog bezwaren tegen de overdracht dan brengt zij deze bezwaren, met redenen omkleed, zo spoedig
      mogelijk na afloop van de gestelde termijn schriftelijk ter kennis van de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel47
  - number: '47.4'
    text: |-
      Indien zich niet binnen de gestelde termijn polishouders, vertegenwoordigende een vierde of meer van het betrokken
      verzekerde bedrag, tegen de overdracht verzet en tegen de overdracht ook bij de Bank geen bezwaren bestaan of aan
      deze bezwaren is tegemoetgekomen, verleent de Bank de verzekeraar schriftelijk toestemming tot de overdracht. De
      overdracht kan dan volgen en is van kracht ten aanzien van alle belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel47
  - number: '47.5'
    text: |-
      De verzekeraar die zijn rechten en verplichtingen heeft overgedragen, maakt de overdracht bekend in de
      Staatscourant, met vermelding van de datum waarop zij is geschied.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel47
  - number: '47.6'
    text: |-
      In het tweede en vierde lid wordt onder het verzekerde bedrag verstaan het verzekerd kapitaal, vermeerderd met
      tienmaal de verzekerde jaarlijkse renten.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel47
  - number: '47.7'
    text: |-
      Voor de toepassing van het eerste, tweede en vierde lid wordt onder polishouder verstaan de verzekeringnemer of
      zijn rechtsopvolger, doch indien een uitkering uit de verzekering opeisbaar is, de tot uitkering gerechtigde.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel47
  - number: '48'
    text: |-
      Bij schriftelijke overeenkomst en met schriftelijke toestemming van de Bank kan een verzekeraar zonder toestemming
      van degenen die aan die overeenkomsten rechten kunnen ontlenen, zijn rechten en verplichtingen uit of krachtens
      overeenkomsten van schadeverzekering aan een andere verzekeraar overdragen. De overdracht kan betrekking hebben op
      alle of een deel van de overeenkomsten van schadeverzekering.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel48
  - number: '49.1'
    text: |-
      Op de aanvraag ter verkrijging van toestemming van de Bank tot de overdracht is [artikel 46, eerste lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel46
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '46'
        hoofdstuk: IV
  - number: '49.2'
    text: |-
      De Bank deelt zo spoedig mogelijk haar beslissing schriftelijk aan de verzekeraar mee. Een afwijzende beslissing
      wordt met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel49
  - number: '50.1'
    text: |-
      Indien met toestemming van de Bank overdracht van rechten en verplichtingen heeft plaatsgevonden, maakt de
      verzekeraar die zijn rechten en verplichtingen heeft overgedragen, de overdracht bekend in de Staatscourant
      en op andere wijze, door de Bank te bepalen in het belang van diegenen die aan de betrokken overeenkomsten van
      schadeverzekering rechten kunnen ontlenen. De inhoud van deze bekendmakingen behoeft de voorafgaande goedkeuring
      van de Bank.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel50
  - number: '50.2'
    text: |-
      De overdracht wordt ten aanzien van alle andere belanghebbenden dan de betrokken verzekeraars van kracht met ingang
      van de dag, volgende op die van de dagtekening van de in het eerste lid bedoelde bekendmaking.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel50
  - number: '50.3'
    text: |-
      De bij een overdracht betrokken verzekeringnemers zijn gedurende zestig dagen na dagtekening van de in het eerste
      lid bedoelde bekendmaking bevoegd, de overeenkomst van schadeverzekering schriftelijk te beëindigen met ingang
      van de eenenzestigste dag na die dagtekening. De verzekeraar geeft alsdan de vooruitbetaalde premie terug voor het
      gedeelte dat evenredig is aan het op genoemde dag nog niet verstreken gedeelte van de termijn waarvoor de premie
      werd betaald.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel50
  - number: '51.1'
    text: |-
      Indien een verzekeraar met zetel in het buitenland niet voldoet aan de bij of krachtens [artikel 34][ref1] gestelde
      eisen met betrekking tot de technische voorzieningen, is de Bank bevoegd hem te verbieden om anders dan met
      schriftelijke machtiging van de Bank te beschikken over de in de openbare lichamen aanwezige waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel34
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '34'
        hoofdstuk: III
        afdeling: '2'
  - number: '51.2'
    text: |-
      De beslissing waarbij het verbod wordt opgelegd, is met redenen omkleed en wordt door de Bank door middel van een
      deurwaardersexploit ter kennis van de verzekeraar gebracht.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel51
  - number: '51.3'
    text: |-
      De verzekeraar dan wel de Bank, namens de verzekeraar, kan de ongeldigheid van een rechtshandeling, door de
      verzekeraar verricht in strijd met het verbod, inroepen indien de wederpartij het verbod kende of daarvan niet
      onkundig kon zijn.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel51
  - number: '51.4'
    text: |-
      De Bank heft het verbod op zodra de verzekeraar weer voldoet aan de in het eerste lid bedoelde eisen. De Bank
      brengt de opheffing van het verbod bij aangetekende brief ter kennis van de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel51
  - number: '52.1'
    text: |-
      Indien een verzekeraar met zetel in een openbaar lichaam niet meer beschikt over de ingevolge
      [artikel 36, eerste of tweede lid][ref1], vereiste solvabiliteitsmarge, dient hij – tenzij het tweede lid van
      toepassing is – binnen een door de Bank te bepalen termijn bij de Bank een saneringsplan ter goedkeuring in, dat
      aangeeft op welke wijze en binnen welke termijn de solvabiliteitsmarge weer op vereiste omvang zal worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel36
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '36'
        hoofdstuk: III
        afdeling: '3'
  - number: '52.2'
    text: |-
      Indien de solvabiliteitsmarge is gedaald of naar het oordeel van de Bank zal dalen beneden het krachtens
      [artikel 36, derde lid][ref1], vereiste minimum bedrag, dient de verzekeraar bij de Bank binnen een door deze te
      bepalen termijn een financieringsplan ter goedkeuring in, dat aangeeft hoe op korte termijn de solvabiliteitsmarge
      weer op vereiste omvang zal worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel36
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '36'
        hoofdstuk: III
        afdeling: '3'
  - number: '52.3'
    text: |-
      Ingeval het eerste lid reeds toepassing vond, geeft het financieringsplan tevens aan hoe het saneringsplan daarin
      is verwerkt.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel52
  - number: '52.4'
    text: |-
      De Bank kan op verzoek van de verzekeraar wijzigingen in een goedgekeurd plan toestaan dan wel, bij gewijzigde
      omstandigheden, wijziging van het plan eisen of de goedkeuring intrekken.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel52
  - number: '53.1'
    text: |-
      De Bank is bevoegd in het geval, bedoeld in [artikel 52, tweede lid][ref1], de vrije beschikking door de
      verzekeraar over zijn waarden, waar deze zich ook bevinden, te beperken of de verzekeraar te verbieden om anders
      dan met schriftelijke machtiging van de Bank te beschikken over deze waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel52
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '52'
        hoofdstuk: VI
  - number: '53.2'
    text: |-
      Met betrekking tot de beperking en het verbod, bedoeld in het eerste lid, is
      [artikel 51, tweede tot en met vierde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel51
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '51'
        hoofdstuk: VI
  - number: '54'
    text: |-
      Een verzekeraar wiens solvabiliteitsmarge niet voldoet aan de in [artikel 36, eerste tot en met derde lid][ref1],
      gestelde eisen, doet aan de Bank binnen de door deze te bepalen termijn en op de door deze te bepalen wijze opgave
      van de in [artikel 35][ref2] bedoelde waarden. Van elke wijziging die vervolgens in deze waarden wordt aangebracht,
      doet hij terstond schriftelijk mededeling aan de Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0028495#Artikel35
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '36'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028495
        artikel: '35'
        hoofdstuk: III
        afdeling: '2'
  - number: '55'
    text: 'De Bank is bevoegd een vergunning in te trekken indien de verzekeraar:'
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel55
  - number: 55.a
    text: de bedrijfsuitoefening niet binnen zes maanden na de dag van afgifte van de vergunning heeft aangevangen;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel55
  - number: 55.b
    text: om intrekking verzoekt;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel55
  - number: 55.c
    text: niet meer voldoet aan de eisen die voor het verkrijgen van de vergunning zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel55
  - number: 55.d
    text: |-
      niet binnen de ingevolge [artikel 52][ref1] door de Bank goedgekeurde termijn de solvabiliteitsmarge op de vereiste
      omvang heeft gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel52
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '52'
        hoofdstuk: VI
  - number: 55.e
    text: ernstig in gebreke blijft aan wettelijke voorschriften te voldoen; of
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel55
  - number: 55.f
    text: |-
      de uitoefening van het levensverzekeringsbedrijf dan wel de bedrijfsuitoefening in de betrokken schadegroep heeft
      gestaakt.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel55
  - number: '56.1'
    text: |-
      Het besluit tot intrekking van een vergunning is met redenen omkleed en wordt door de Bank door middel van een
      deurwaardersexploit ter kennis van de verzekeraar gebracht.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel56
  - number: '56.2'
    text: De intrekking wordt eerst van kracht wanneer het daartoe strekkende besluit onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel56
  - number: '56.3'
    text: |-
      De Bank maakt, zodra de intrekking van kracht is geworden, het besluit bekend in de Staatscourant. Zij kan,
      indien zij dit in het belang van verzekeringnemers, verzekerden of gerechtigden op uitkeringen acht, het besluit
      eveneens op andere door haar te bepalen wijze bekend maken. De kosten van de bekendmakingen komen ten laste van
      de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel56
  - number: '57'
    text: |-
      De intrekking van een vergunning verplicht de verzekeraar het betrokken gedeelte van zijn bedrijf af te wikkelen.
      Hij blijft daarbij onderworpen aan de bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel57
  - number: '58.1'
    text: |-
      Indien de Bank een vergunning intrekt op grond van [artikel 55, onder c, d of e][ref1], beperkt zij de uitoefening
      van de bevoegdheid van de verzekeraar om over zijn waarden te beschikken of verbiedt zij hem om anders dan
      met haar schriftelijke machtiging over deze waarden te beschikken, voor zover zulks niet reeds ingevolge
      [artikel 51, eerste lid][ref2], of [artikel 53, eerste lid][ref3], is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0028495#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0028495#Artikel53
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '55'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0028495
        artikel: '51'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0028495
        artikel: '53'
        hoofdstuk: VI
  - number: '58.2'
    text: |-
      De Bank brengt de beperking of het verbod, opgelegd ingevolge het eerste lid, bij het besluit tot intrekking van de
      vergunning ter kennis van de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel58
  - number: '58.3'
    text: |-
      De Bank maakt de beperking of het verbod, opgelegd ingevolge het eerste lid, [artikel 51, eerste lid][ref1] of
      [artikel 53, eerste lid][ref2], openbaar bij de bekendmaking, bedoeld in [artikel 56, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0028495#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0028495#Artikel56
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '51'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0028495
        artikel: '53'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0028495
        artikel: '56'
        hoofdstuk: VII
  - number: '58.4'
    text: |-
      De Bank kan namens de verzekeraar de ongeldigheid inroepen van een rechtshandeling, door de verzekeraar in strijd
      met de beperking of het verbod verricht. Is de rechtshandeling verricht voor de openbaarmaking van de beperking
      of het verbod, dan kan de verzekeraar dan wel de Bank namens hem de ongeldigheid van de rechtshandeling inroepen
      indien de wederpartij de beperking onderscheidenlijk het verbod kende of daarvan niet onkundig kon zijn.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel58
  - number: '58.5'
    text: |-
      De Bank heft de beperking of het verbod, opgelegd ingevolge het eerste lid, op zodra het besluit tot intrekking van
      de vergunning is vernietigd.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel58
  - number: '59.1'
    text: |-
      Een vordering of verzoek tot faillietverklaring van een verzekeraar – eigen aangifte daaronder begrepen –
      wordt niet in behandeling genomen zolang de verzekeraar in het bezit is van een vergunning als bedoeld in
      [artikel 9, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel9
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '9'
        hoofdstuk: II
        afdeling: '1'
  - number: '59.2'
    text: |-
      Indien alle vergunningen van een verzekeraar zijn ingetrokken, wordt op het verzoek of de vordering tot
      faillietverklaring niet beslist dan nadat de rechter de Bank in de gelegenheid heeft gesteld haar gevoelen
      daaromtrent kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel59
  - number: '59.3'
    text: De wettelijke bepalingen inzake surséance van betaling zijn op verzekeraars niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel59
  - number: '60.1'
    text: |-
      Wanneer het belang der gezamenlijke schuldeisers bij de afwikkeling van het bedrijf van een verzekeraar, wiens
      vergunningen alle zijn ingetrokken, een bijzondere voorziening vordert, kan het Gerecht op verzoek van de Bank de
      noodregeling uitspreken.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel60
  - number: '60.2'
    text: |-
      Bij het uitspreken van de noodregeling machtigt het Gerecht de Bank zowel tot vereffening van het geheel of van
      een gedeelte van de portefeuille van de verzekeraar als tot overdracht van alle of van een deel van zijn rechten
      en verplichtingen uit of krachtens overeenkomsten van verzekering. Zolang de Bank nog niet is gebleken dat de
      verzekeraar een negatief eigen vermogen heeft, strekt de machtiging mede tot vereffening van het vermogen van de
      onderneming van de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel60
  - number: '60.3'
    text: |-
      Ten aanzien van een verzekeraar met zetel in het buitenland heeft de machtiging betrekking op het vanuit de
      vestigingen in de openbare lichamen uitgeoefende verzekeringsbedrijf.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel60
  - number: '60.4'
    text: |-
      Het Gerecht behandelt het verzoek van de Bank tot het uitspreken van de noodregeling met de meeste spoed op een
      openbare terechtzitting op de voet van de rechtspleging in burgerlijke zaken, voor zover daarvan bij deze wet niet
      is afgeweken.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel60
  - number: '60.5'
    text: |-
      Het Gerecht is bevoegd inzage te nemen of te doen nemen van de boeken en zakelijke bescheiden van de verzekeraar.
      [Artikel 30][ref1] is daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel30
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '30'
        hoofdstuk: III
        afdeling: '1'
  - number: '60.6'
    text: |-
      Het Gerecht geeft geen beschikking dan nadat de verzekeraar en de Bank zijn gehoord althans behoorlijk zijn
      opgeroepen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel60
  - number: '60.7'
    text: |-
      Een door de verzekeraar tegen de intrekking van een vergunning ingesteld beroep schorst de handeling van het
      verzoek van de Bank tot het uitspreken van de noodregeling.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel60
  - number: '60.8'
    text: |-
      De beschikking van het Gerecht wordt met redenen omkleed en wordt, zo het verzoek van de Bank wordt toegewezen,
      op een openbare terechtzitting uitgesproken. De griffier maakt de zakelijke inhoud van de beschikking bekend in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel60
  - number: '60.9'
    text: Tegen de beschikking staat generlei voorziening open behoudens cassatie in het belang der wet.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel60
  - number: '61.1'
    text: |-
      Wanneer een verzoek van de Bank tot het uitspreken van de noodregeling aanhangig is tegelijk met een verzoek of
      vordering tot faillietverklaring, wordt de behandeling van het verzoek of de vordering tot faillietverklaring
      geschorst totdat op het verzoek van de Bank is beschikt. Indien het Gerecht de noodregeling uitspreekt, vervalt het
      verzoek of de vordering tot faillietverklaring van rechtswege.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel61
  - number: '61.2'
    text: |-
      Het uitspreken van de noodregeling heeft mede tot gevolg dat de verzekeraar slechts in staat van faillissement kan
      worden verklaard overeenkomstig [artikel 71][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel71
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '71'
        hoofdstuk: VIII
  - number: '61.3'
    text: |-
      Het Gerecht kan op verzoek van de Bank de noodregeling intrekken. De griffier maakt de intrekking bekend in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel61
  - number: '62'
    text: |-
      Vanaf de dag van het uitspreken van de noodregeling mogen aan de in [artikel 35][ref1] bedoelde waarden geen
      andere waarden worden toegevoegd dan de sindsdien ontvangen premies of de met die premies verkregen waarden, voor
      zover deze dienen tot dekking van de technische voorzieningen. Indien faillissement wordt uitgesproken zonder
      voorafgaande noodregeling of later dan een maand na de beëindiging van de noodregeling, geldt hetzelfde verbod
      vanaf de dag van faillietverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel35
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '35'
        hoofdstuk: III
        afdeling: '2'
  - number: '63.1'
    text: |-
      Indien het Gerecht de noodregeling uitspreekt, oefent de Bank bij uitsluiting alle bevoegdheden van de bestuurders,
      de commissarissen of de vertegenwoordiger van de verzekeraar uit.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel63
  - number: '63.2'
    text: De Bank waakt voor de belangen van de gezamenlijke schuldeisers.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel63
  - number: '63.3'
    text: |-
      De bestuurders, de commissarissen of de vertegenwoordiger van de verzekeraar zijn verplicht bij de uitoefening door
      de Bank van de in het eerste lid bedoelde bevoegdheden alle door de Bank gevraagde medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel63
  - number: '63.4'
    text: |-
      De Bank is bevoegd de bestuurders of de vertegenwoordiger van de verzekeraar te machtigen bepaalde handelingen
      te verrichten.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel63
  - number: '63.5'
    text: |-
      De Bank is bevoegd bestuurders, commissarissen of de vertegenwoordiger namens de verzekeraar te ontslaan. Bij dit
      ontslag worden de overeengekomen of wettelijke termijnen in acht genomen, met dien verstande dat een termijn van
      zes weken in elk geval voldoende is.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel63
  - number: '63.6'
    text: |-
      Indien de verzekeraar zijn zetel in een openbaar lichaam heeft, behoeft een besluit van zijn aandeelhouders of
      leden om van kracht te zijn de goedkeuring van de Bank.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel63
  - number: '63.7'
    text: |-
      Wordt een besluit van aandeelhouders of leden, dat ingevolge de statuten van de in het zesde lid bedoelde
      verzekeraar voor een handeling is vereist, niet genomen of verkrijgt dit besluit niet de volgens de statuten
      vereiste goedkeuring, dan kan de Bank dit besluit nemen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel63
  - number: '63.8'
    text: |-
      De Bank kan personen machtigen alle of een deel van de bevoegdheden uit te oefenen, die zij ingevolge het eerste
      lid heeft. De Bank kan het Gerecht verzoeken een beloning voor de gemachtigden vast te stellen. De Bank maakt naam
      en woonplaats van een door haar gemachtigde alsook de intrekking van een machtiging bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel63
  - number: '64'
    text: |-
      Ingevolge de haar verleende machtiging is de Bank, ongeacht hetgeen daaromtrent bij de statuten van de verzekeraar
      is bepaald, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel64
  - number: 64.a
    text: |-
      alle nog niet gedane stortingen op de aandelen in het geplaatste kapitaal onderscheidenlijk het waarborgkapitaal
      van de verzekeraar uit te schrijven en te innen;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel64
  - number: 64.b
    text: |-
      naheffingen op te leggen en te innen tot het in de statuten bepaalde maximum indien de verzekeraar de rechtsvorm
      van onderlinge waarborgmaatschappij bezit.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel64
  - number: '65.1'
    text: |-
      Het uitspreken van de noodregeling heeft tot gevolg dat de verzekeraar niet kan worden genoodzaakt tot nakoming
      van zijn schulden die voor de uitspraak zijn ontstaan, zomin als tot nakoming van zijn schulden, na de uitspraak
      ontstaan terzake van uitkeringen krachtens lopende overeenkomsten van verzekering. Aangevangen executiën worden
      geschorst en gelegde beslagen vervallen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel65
  - number: '65.2'
    text: 'Het in het eerste lid bepaalde geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel65
  - number: 65.2.a
    text: vorderingen die door pand of hypotheek op goederen van de verzekeraar zijn gedekt;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel65
  - number: 65.2.b
    text: termijnen van huurkoop.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel65
  - number: '65.3'
    text: |-
      Voor zover vorderingen die door pand of hypotheek zijn gedekt, niet op de verbonden zaak kunnen worden verhaald,
      werkt de uitspraak wel ten aanzien van deze vorderingen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel65
  - number: '65.4'
    text: Het uitspreken van de noodregeling werkt niet ten voordele van de medeschuldenaren en borgen van de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel65
  - number: '66.1'
    text: |-
      Met betrekking tot schuldvergelijking en schuldoverneming vinden de [artikelen 224](onbekend) en [225 van
      de Faillissementswet BES](onbekend) overeenkomstige toepassing, met dien verstande dat de schuldenaar van de
      verzekeraar die zijn schuld wil vergelijken met een schuldvordering aan order of toonder, gehouden is te bewijzen
      dat hij reeds op het ogenblik der uitspraak waarbij het verzoek tot machtiging werd toegewezen, te goeder trouw
      eigenaar was van het order- of toonderpapier.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel66
  - number: '66.2'
    text: |-
      Met betrekking tot wederkerige overeenkomsten in het algemeen en tot termijnzaken, overeenkomsten van huurkoop,
      huurovereenkomsten en arbeidsovereenkomsten in het bijzonder, waarbij de verzekeraar ten aanzien waarvan de
      machtiging is verleend, partij is, vinden de [artikelen 226](onbekend), [227](onbekend), [227a](onbekend), [228]
      (onbekend) en [229 van de Faillissementswet BES](onbekend) overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel66
  - number: '66.3'
    text: |-
      Met betrekking tot de voldoening van een schuld aan de verzekeraar nadat de noodregeling is uitgesproken, vindt
      [artikel 230 van de Faillissementswet BES](onbekend) overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel66
  - number: '67.1'
    text: |-
      Het Gerecht kan tegelijk met de in [artikel 60, tweede lid][ref1], bedoelde machtiging of daarna de Bank op haar
      verzoek een bijzondere machtiging verlenen die strekt tot een of meer van de volgende handelingen:


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel60
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '60'
        hoofdstuk: VIII
  - number: 67.1.a
    text: |-
      wijziging, bij de overdracht van rechten en verplichtingen uit of krachtens overeenkomsten van verzekering, van
      die overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel67
  - number: 67.1.b
    text: verkorting van de duur van overeenkomsten van verzekering.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel67
  - number: '67.2'
    text: |-
      Wijzigingen, als bedoeld in het eerste lid, deel a, die op overeenkomsten van levensverzekering betrekking hebben,
      kunnen niet tot gevolg hebben dat aan verzekeringnemers meer verplichtingen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel67
  - number: '67.3'
    text: |-
      Ten aanzien van de bijzondere machtiging is
      [artikel 60, derde tot en met zevende lid, achtste lid, eerste volzin, en negende lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel60
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '60'
        hoofdstuk: VIII
  - number: '67.4'
    text: |-
      Zodra overdracht van rechten en verplichtingen krachtens de in [artikel 60, tweede lid][ref1], bedoelde machtiging
      heeft plaatsgevonden, maakt de Bank deze overdracht en, zo handelingen door haar zijn verricht krachtens de in het
      eerste lid bedoelde bijzondere machtiging, die handelingen bekend in de Staatscourant en in tenminste twee door het
      Gerecht aan te wijzen dagbladen. De Bank kan, indien zij dit in het belang van verzekeringnemers, verzekerden of
      gerechtigden op uitkeringen acht, de bedoelde overdracht en handelingen tevens op andere wijze bekendmaken.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel60
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '60'
        hoofdstuk: VIII
  - number: '67.5'
    text: |-
      De overdracht alsmede de wijziging, bedoeld in het eerste lid, deel a, worden ten aanzien van alle andere
      belanghebbenden dan de betrokken verzekeraars van kracht met ingang van de dag, volgende op die waarop de
      bekendmaking in de Staatscourant, is geschied.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel67
  - number: '68'
    text: |-
      Een overdracht van rechten en verplichtingen ingevolge dit hoofdstuk mag geen nadeel toebrengen aan de rechten van
      de overblijvende schuldeisers.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel68
  - number: '69.1'
    text: |-
      Het Gerecht stelt het bedrag vast van de kosten van de noodregeling. Deze kosten komen ten laste van de
      verzekeraar.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel69
  - number: '69.2'
    text: |-
      De kosten van de noodregeling omvatten de door of namens de Bank terzake gedane uitgaven en de vergoeding van de
      door of namens haar terzake verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel69
  - number: '70'
    text: |-
      Voor de toepassing van de [artikelen 200][ref1], [355][ref2], [356][ref3] en
      [360 van het Wetboek van Strafrecht BES][ref4] wordt met faillissement gelijkgesteld de rechtstoestand waarin een
      verzekeraar verkeert zolang te zijnen aanzien de noodregeling van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel200
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel355
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel356
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel360
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '200'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '355'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '356'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '360'
  - number: '71.1'
    text: |-
      De Bank dient een verzoek tot faillietverklaring van de verzekeraar in, indien haar blijkt dat de verzekeraar
      een negatief eigen vermogen heeft en hetzij het met de noodregeling te bereiken doel is of niet meer kan worden
      verwezenlijkt, hetzij – indien niet tevoren de noodregeling werd uitgesproken – geen redelijk vooruitzicht meer
      bestaat dat het met de noodregeling te bereiken doel alsnog kan worden verwezenlijkt.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel71
  - number: '71.2'
    text: |-
      Bij de beoordeling van de omvang van het eigen vermogen van een verzekeraar met zetel in het buitenland worden
      uitsluitend de activa en passiva in aanmerking genomen die naar het oordeel van de Bank behoren tot het vanuit de
      vestigingen in de openbare lichamen uitgeoefende verzekeringsbedrijf.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel71
  - number: '71.3'
    text: |-
      De faillietverklaring wordt uitgesproken ongeacht of de verzekeraar verkeert in een toestand van te hebben
      opgehouden te betalen. Het bepaalde in de [eerste titel van de Faillissementswet BES][ref1] is overigens van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0028917
  - number: '71.4'
    text: |-
      De noodregeling houdt van rechtswege op van kracht te zijn ingeval de verzekeraar in staat van faillissement wordt
      verklaard. Alsdan, zomede indien de faillietverklaring wordt uitgesproken binnen een maand na het intrekken van de
      noodregeling, gelden de volgende bepalingen:
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel71
  - number: 71.4.a
    text: |-
      het tijdstip waarop de termijnen, in de [artikelen 39][ref1] en [41 van de Faillissementswet BES][ref2] vermeld,
      aanvangen, wordt berekend vanaf het tijdstip waarop de beschikking, houdende het uitspreken van de noodregeling,
      uitvoerbaar is geworden;


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel41
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '41'
  - number: 71.4.b
    text: |-
      een beroep op schuldvergelijking kan in afwijking van [artikel 49 van de Faillissementswet BES][ref1] slechts
      worden gedaan indien de schuldvordering en de schuldplichtigheid beide zijn ontstaan voor het tijdstip waarop
      de beschikking, houdende het uitspreken van de noodregeling uitvoerbaar is geworden dan wel voortvloeien uit een
      handeling voor dat tijdstip met de gefailleerde verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel49
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '49'
  - number: 71.4.c
    text: |-
      handelingen, ingevolge [artikel 63][ref1] door of namens de Bank verricht gedurende de tijd dat de noodregeling van
      kracht was, worden beschouwd als handelingen van de curator, terwijl boedelschulden, gedurende die tijd ontstaan,
      ook in het faillissement als boedelschulden zullen gelden;


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel63
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '63'
        hoofdstuk: VIII
  - number: 71.4.d
    text: |-
      de boedel is niet aansprakelijk voor verbintenissen van de verzekeraar die in strijd met
      [artikel 63, eerste en vierde lid][ref1], zijn aangegaan gedurende de tijd dat de noodregeling van kracht was, dan
      voor zover deze daardoor is gebaat;


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel63
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '63'
        hoofdstuk: VIII
  - number: 71.4.e
    text: |-
      vorderingen uit overeenkomsten van levensverzekering kunnen in afwijking van
      [artikel 105, eerste lid, van de Faillissementswet BES][ref1] worden ingediend door overlegging van de polis of
      een afschrift daarvan, zonder dat het bedrag van de vordering behoeft te worden vermeld. Voor zover de curator de
      vordering erkent, stelt hij de omvang daarvan vast.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel105
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '105'
  - number: '72'
    text: |-
      De Bank brengt na beëindiging van en desgevraagd tijdens de noodregeling daaromtrent zo spoedig mogelijk verslag
      uit aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel72
  - number: '73.1'
    text: |-
      In geval van noodregeling overeenkomstig dit hoofdstuk of van faillissement van een verzekeraar worden de
      boedelschulden, overeenkomstig de bepalingen van de [Faillissementswet BES][ref1], al naar gelang de aard van de
      betrokken boedelschuld hetzij mede over de in [artikel 35][ref2] bedoelde waarden omgeslagen, hetzij uitsluitend
      van een bepaalde bate van de boedel afgetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028917
      [ref2]: https://wetten.overheid.nl/BWBR0028495#Artikel35
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0028917
      - id: ref2
        bwb_id: BWBR0028495
        artikel: '35'
        hoofdstuk: III
        afdeling: '2'
  - number: '73.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid dienen in geval van noodregeling of van faillissement van een
      verzekeraar de in het eerste lid bedoelde waarden uitsluitend tot voldoening van de vorderingen ten laste van
      de verzekeraar terzake van uitkeringen krachtens de vanuit de vestigingen in de openbare lichamen gesloten
      overeenkomsten van verzekering, niet zijnde uitkeringen, krachtens overeenkomst van herverzekering aan een andere
      verzekeraar verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel73
  - number: '73.3'
    text: |-
      Op de in het eerste lid bedoelde waarden zijn behoudens vorderingen die door pand of hypotheek op deze waarden
      zijn gedekt, geen andere vorderingen verhaalbaar, tenzij vaststaat dat alle vorderingen, genoemd in het tweede lid,
      zullen kunnen worden voldaan en dat in de toekomst zodanige vorderingen niet meer zullen ontstaan.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel73
  - number: '73.4'
    text: |-
      Ingeval de in het tweede lid bedoelde vorderingen niet volledig uit de in het eerste lid bedoelde waarden zijn
      voldaan, nemen de betrokken schuldeisers voor het overblijvende deel van hun vorderingen rang na de overige
      schuldeisers bij de verdeling van de opbrengst van de overige goederen van de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel73
  - number: '74'
    text: |-
      Het is verboden in de openbare lichamen te bemiddelen bij of op andere soortgelijke wijze mee te werken aan
      de voorbereiding of de totstandkoming van overeenkomsten van verzekering met een verzekeraar die vanuit zijn
      vestigingen in de openbare lichamen het verzekeringsbedrijf uitoefent zonder in het bezit te zijn van de daarvoor
      vereiste vergunningen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel74
  - number: '75.1'
    text: |-
      Het is een verzekeraar verboden overeenkomsten van verzekering, gesloten vanuit een vestiging in de openbare
      lichamen, over te boeken naar een vestiging die hij buiten de openbare lichamen bezit.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel75
  - number: '75.2'
    text: |-
      De Bank kan ontheffing verlenen van het in het eerste lid gegeven verbod indien de verzekeraar aannemelijk maakt
      dat de belangen van degenen die aan de betrokken overeenkomsten rechten kunnen ontlenen, zich daartegen niet
      verzetten. Aan de ontheffing kan de Bank voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel75
  - number: '76.1'
    text: |-
      Degene die als gemachtigde van een verzekeraar voor diens rekening een overeenkomst van verzekering in de openbare
      lichamen heeft gesloten draagt er zorg voor dat in de polis dan wel in een daaraan toegevoegd aanhangsel de naam
      van de verzekeraar en, in geval van co-assurantie, het aandeel dat hij namens de verzekeraar heeft geaccepteerd,
      wordt vermeld. Hij draagt er tevens zorg voor dat elke wijziging in het door hem namens de verzekeraar
      geaccepteerde aandeel in een aanhangsel wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel76
  - number: '76.2'
    text: |-
      Wordt, nadat de gemachtigde de overeenkomst van verzekering heeft gesloten of, in geval van een overeenkomst
      van schadeverzekering, het door de gemachtigde geaccepteerde aandeel in de overeenkomst is gewijzigd, niet
      of niet terstond aan de verzekeringnemer een polis of een aanhangsel afgegeven, dan stelt de gemachtigde de
      verzekeringnemer binnen een maand na het sluiten van de overeenkomst of na het aanbrengen van de wijziging,
      schriftelijk in kennis van de in het eerste lid bedoelde gegevens. Behoort de overeenkomst evenwel tot de
      portefeuille van een assurantiebemiddelaar, dan doet de gemachtigde de in het eerste lid bedoelde kennisgevingen
      aan deze bemiddelaar binnen twee weken na de totstandkoming van de overeenkomst van verzekering onderscheidenlijk
      wijziging in het namens de verzekeraar geaccepteerde aandeel.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel76
  - number: '76.3'
    text: |-
      Wordt, nadat een overeenkomst van verzekering is gesloten of het door de verzekeraar geaccepteerde aandeel in de
      overeenkomst is gewijzigd, niet of niet terstond aan de verzekeringnemer een polis of een aanhangsel afgegeven,
      waarin de naam van de verzekeraar en, in geval van co-assurantie, diens aandeel onderscheidenlijk de daarin
      aangebrachte wijziging is vermeld, dan stelt de assurantiebemiddelaar tot wiens portefeuille de overeenkomst
      behoort de verzekeringnemer binnen een maand na het totstandkomen van de overeenkomst onderscheidenlijk het
      aanbrengen van de wijziging schriftelijk van deze gegevens in kennis.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel76
  - number: '76.4'
    text: |-
      Het tweede en derde lid zijn niet van toepassing indien binnen de betrokken termijn de overeenkomst van verzekering
      is tenietgegaan en daaraan door de verzekeringnemer of andere belanghebbenden geen rechten meer kunnen worden
      ontleend.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel76
  - number: '76.5'
    text: |-
      Met betrekking tot overeenkomsten van schadeverzekering die een gemachtigde namens een of meer verzekeraars heeft
      gesloten, kan de Bank goedkeuren dat – in afwijking van het eerste, tweede en derde lid – in de polis of een
      aanhangsel, dan wel in een schriftelijke kennisgeving als bedoeld in het tweede en derde lid, wordt volstaan met de
      vermelding van het aandeel dat de gemachtigde namens de gezamenlijke door hem vertegenwoordigde verzekeraars in de
      overeenkomst heeft geaccepteerd of van de wijziging die in dat aandeel is aangebracht, mits:
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel76
  - number: 76.5.a
    text: |-
      de gemachtigde onder door de Bank te stellen voorwaarden en op een door deze goed te keuren plaats de in het eerste
      lid bedoelde gegevens deponeert; en
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel76
  - number: 76.5.b
    text: |-
      in de polis of het aanhangsel en in de schriftelijke kennisgeving wordt verwezen naar de in onder a bedoelde
      deponering.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel76
  - number: '77.1'
    text: |-
      De aanvrager van een besluit op grond van deze wet is voor het in behandeling nemen van de aanvraag een vergoeding
      verschuldigd van de met de behandeling van de aanvraag verband houdende kosten.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel77
  - number: '77.2'
    text: Bij ministeriële regeling worden de tarieven vastgesteld ter vergoeding van de in het eerste lid bedoelde kosten.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel77
  - number: '77.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de doorberekening van
      kosten, verband houdend met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel77
  - number: '78.1'
    text: |-
      Ieder die betrokken is bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn taak bij de uitvoering
      van deze wet de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel78
  - number: '78.2'
    text: |-
      In afwijking van het eerste lid is de Bank bevoegd aan de Stichting Autoriteit Financiële Markten gegevens te
      verstrekken of op grondslag van wederkerigheid aan het administratieve orgaan dat in het buitenland met het
      toezicht op het verzekeringsbedrijf is belast, desgevraagd de gegevens te verstrekken, die dat orgaan voor
      vervulling van de ingevolge zijn nationale wetgeving op hem rustende taak nodig heeft, mits bedoeld orgaan zich
      tegenover de Bank heeft verplicht tot geheimhouding van de door de Bank verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel78
  - number: '79'
    text: |-
      Voor de uitvoering van deze wet kunnen bij of krachtens algemene maatregel van bestuur, nadere regelen worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel79
  - number: '80'
    text: |-
      De Bank kan voor de uitvoering van verdragen tot uitwisseling van gegevens of inlichtingen, dan
      wel voor de uitvoering van met toezichthoudende instanties gesloten overeenkomsten tot uitwisseling
      van gegevens of inlichtingen, van een ieder inlichtingen vorderen. De [artikelen 5:13][ref1] en
      [5:20 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '81.1'
    text: |-
      Het is verboden, anders dan na verkregen verklaring van geen bezwaar van de Bank, een deelneming in een onderneming
      of instelling waaraan een vergunning als bedoeld in [artikel 9, eerste lid][ref1], is verleend, te houden, te
      verwerven of te vergroten dan wel enige zeggenschap, verbonden aan een dergelijke deelneming, uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel9
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '9'
        hoofdstuk: II
        afdeling: '1'
  - number: '81.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld betreffende de voorwaarden waaraan moet worden voldaan ter
      verkrijging van de verklaring van geen bezwaar.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel81
  - number: '81.3'
    text: |-
      De Bank kan een verklaring van geen bezwaar geheel of gedeeltelijk intrekken, indien niet langer wordt voldaan aan
      de in het tweede lid bedoelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel81
  - number: '120.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe bij besluit van
      de Bank aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel120
  - number: '120.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel120
  - number: '120.3'
    text: |-
      [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van toepassing, met uitzondering van de
      [artikelen 5:18][ref2] en [5:19][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '121'
    text: |-
      De bij of krachtens deze wet strafbaar gestelde feiten zijn overtredingen, uitgezonderd die, strafbaar gesteld in
      [artikel 122, tweede lid][ref1], welke misdrijven zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel122
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '122'
        hoofdstuk: XII
  - number: '122.1'
    text: |-
