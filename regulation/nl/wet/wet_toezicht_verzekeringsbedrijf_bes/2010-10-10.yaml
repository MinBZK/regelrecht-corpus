  - number: '123.1'
    text: |-
      Met de opsporing van de in deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde ambtenaren, belast de daartoe bij besluit van
      Onze Minister van Justitie in overeenstemming met Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '123.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel123
  - number: '124.1'
    text: |-
      Onverminderd [artikel 122][ref1] kan de Bank een onderneming of instelling die niet of niet tijdig voldoet aan een
      uit deze wet voortvloeiende verplichting, een geldboete opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel122
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '122'
        hoofdstuk: XII
  - number: '124.2'
    text: |-
      De hoogte van de boete voor de verscheidene overtredingen wordt bepaald bij algemene maatregel van bestuur, met
      dien verstande dat de boete voor een afzonderlijke overtreding ten hoogste USD 250.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel124
  - number: '124.3'
    text: |-
      Alvorens over te gaan tot oplegging van een boete stelt de Bank de betrokken onderneming of instelling schriftelijk
      op de hoogte van het voornemen een boete op te leggen, onder vermelding van de gronden waarop dat voornemen berust.
    url: https://wetten.overheid.nl/BWBR0028495/2010-10-10#Artikel124
  - number: '125.1'
    text: |-
      De Bank stelt jaarlijks een begroting, een verantwoording en een jaarverslag op terzake van de haar op grond van
      deze wet opgedragen taken en de daaruit voortvloeiende werkzaamheden. De [artikelen 1:30 tot en met 1:32][ref1] en
      [1:34 tot en met 1:36 van de Wet op het financieel toezicht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
