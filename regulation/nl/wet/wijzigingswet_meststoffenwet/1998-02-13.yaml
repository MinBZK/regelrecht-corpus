preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is te voorzien in regels waarmee een nieuw stelsel van
    heffingen in de Meststoffenwet wordt geïntroduceerd;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008670/1998-02-13#ArtikelAanhef
articles:
  - number: IV
    text: |-
      De ingevolge [artikel 14a van de Meststoffenwet][ref1], zoals dit op de dag vóór inwerkingtreding van
      [artikel I, onderdeel G][ref2] van deze wet luidde, geldende hoeveelheid mestproductierechten voor varkens
      en kippen, is na inwerkingtreding van genoemd artikelonderdeel de hoeveelheid verplaatsbare niet-gebonden
      mestproductierechten voor varkens en kippen en de hoeveelheid niet-verplaatsbare niet-gebonden mestproductierechten
      voor varkens en kippen die voor deze bedrijven op de dag voor inwerkingtreding van het genoemde artikelonderdeel
      gold ingevolge [artikel 1, derde lid, en 6, eerste lid, van de Wet verplaatsing mestproduktie][ref3],
      vermenigvuldigd met 10/7.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0008670#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0006285#Artikel1
    url: https://wetten.overheid.nl/BWBR0008670/1998-02-13#ArtikelIV
