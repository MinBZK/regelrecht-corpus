  - number: V
    text: |-
      De wijzigingen van de [Meststoffenwet][ref1], voorzien in [artikel I, onderdelen F, G en H][ref2], de wijzigingen
      van de [Wet verplaatsing mestproduktie][ref3], voorzien in [artikel II][ref4], en de wijzigingen van de
      [Wet op de economische delicten][ref5], voorzien in [artikel III][ref6], zijn niet van toepassing op gedragingen
      die hebben plaatsgevonden voor de dag waarop deze wet in werking treedt.


