preamble:
  text: |-
    Gelet op artikel 22, eerste en derde lid, van het Organisatie-, mandaat- en volmachtbesluit SZW 2004;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0021746/2007-04-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Aan de directeur van het Agentschap SZW wordt mandaat en machtiging verleend tot het nemen van besluiten
      over en het vaststellen en ondertekenen van stukken die betrekking hebben op de uitvoering van de
      [Regeling schoonmaakdiensten particulieren][ref1], de [Regeling schoonmaakdiensten particulieren 2005][ref2] en
      de [Tijdelijke subsidieregeling beëindiging subsidiëring schoonmaakdiensten particulieren][ref3], waaronder
      begrepen:

      a. het beoordelen en vaststellen van de jaaropgaven of einddeclaraties voor de subsidies;

      b. beslissingen in bezwaar- en beroepsprocedures, met uitzondering van de beslissing op een beroepschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0009136
      [ref2]: https://wetten.overheid.nl/BWBR0018541
      [ref3]: https://wetten.overheid.nl/BWBR0018726
    url: https://wetten.overheid.nl/BWBR0021746/2007-04-26#Artikel1
