  - number: 70k
    text: |-
      1 De Dienst Wegverkeer houdt een register van fietsen.

      2 Bij ministeriële regeling worden regels gesteld omtrent de inhoud van het register alsmede de verwerking, het
      gebruik en de verstrekking van de gegevens daaruit.

      3 Het verzamelen van gegevens ten behoeve van het in het eerste lid bedoelde register geschiedt ter voorkoming van
      diefstal en heling van fietsen, alsmede ten behoeve van de opsporing van gestolen fietsen.

      4 Registratie van gegevens in het register geschiedt op de door de Dienst Wegverkeer te bepalen wijze. In door de
      Dienst Wegverkeer te bepalen gevallen kan een door deze dienst te bepalen aansluittarief verschuldigd zijn.

      5 In door de Dienst Wegverkeer te bepalen gevallen geschiedt de registratie van gegevens in, dan wel verstrekking
      van gegevens uit het register tegen betaling van een door deze dienst te bepalen tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel70k
  - number: 70l
    text: |-
      1 De Dienst Wegverkeer houdt een register van bij ministeriële regeling aan te wijzen categorieën van mobiele
      objecten anders dan fietsen waarvoor op grond van deze wet geen kenteken is opgegeven.

      2 Bij ministeriële regeling worden regels gesteld omtrent de inhoud van het register alsmede de verwerking, het
      gebruik en de verstrekking van de gegevens daaruit.

      3 Het verzamelen van gegevens ten behoeve van het in het eerste lid bedoelde register geschiedt ter voorkoming van
      diefstal en heling van mobiele objecten, ten behoeve van de opsporing van gestolen mobiele objecten, alsmede ten
      behoeve van andere, bij ministeriële regeling te bepalen doeleinden, met inachtneming van [artikel 2][ref1].

      4 Het [vierde en vijfde lid van artikel 70k][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel70k
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel70l
