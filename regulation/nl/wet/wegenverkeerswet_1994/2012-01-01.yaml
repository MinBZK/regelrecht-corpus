        artikel: '170'
        hoofdstuk: X
  - number: '172'
    text: |-
      1 Tot de kosten, verbonden aan de oplegging van een last onder bestuursdwang als bedoeld in
      [artikel 170, eerste lid][ref1], worden gerekend:

      a. de kosten die verband houden met de overbrenging en bewaring;

      b. de kosten die verband houden met de bekendmaking van de beschikking tot overbrenging en inbewaringstelling, en

      c. de kosten van verkoop, eigendomsoverdracht om niet of vernietiging.

      2 Verkoop, eigendomsoverdracht om niet of vernietiging vindt niet plaats binnen twee weken na
      de bekendmaking van de beschikking tot oplegging van een last onder bestuursdwang krachtens
      [artikel 171, eerste lid, onderdeel b][ref2]. De opbrengst van verkoop of de geschatte sloopwaarde bij vernietiging
      wordt in mindering gebracht op de kosten, verbonden aan de oplegging van een last onder bestuursdwang.

      3 Burgemeester en wethouders betalen het bedrag van de kosten, verbonden aan de oplegging van een last onder
      bestuursdwang, terug, indien:

      a. niet tot overbrenging en inbewaringstelling had mogen worden overgegaan;

      b. de omstandigheden waaronder de overtreding is begaan, van dien aard waren dat de kosten redelijkerwijs niet
      verschuldigd zijn, of

      c. aannemelijk is dat het voertuig tegen de wil van de rechthebbende is gebruikt en hij dit gebruik redelijkerwijs
      niet heeft kunnen voorkomen.

      4 In een geval als bedoeld in het derde lid, onderdeel c, zijn de kosten verschuldigd door degene
      die de overtreding heeft begaan. De [artikelen 4:116][ref3], [4:118 tot en met 4:124][ref4] en
      [5:10 van de Algemene wet bestuursrecht][ref5] zijn van toepassing.

      5 Indien de kosten, verbonden aan de oplegging van een last onder bestuursdwang, die door de rechthebbende zijn
      betaald, te hoog zijn berekend, betalen burgemeester en wethouders het te veel betaalde terug.

      6 Indien de in het derde lid, onderdeel *b*, bedoelde omstandigheden van dien aard waren dat de kosten
      redelijkerwijs niet volledig verschuldigd zijn, betalen burgemeester en wethouders het niet verschuldigde bedrag
      terug.

      7 Bij toepassing van het derde lid, onderdeel a, betalen burgemeester en wethouders tevens een redelijke
      schadeloosstelling aan de rechthebbende die het voertuig heeft afgehaald. Indien het voertuig ten tijde van de
      overtreding in gebruik was bij een ander dan de rechthebbende die het voertuig heeft afgehaald, treedt die ander
      voor de toepassing van dit lid in de plaats van de rechthebbende die het voertuig heeft afgehaald.

      8 Indien aantoonbaar is dat tijdens de overbrenging en bewaring schade aan het voertuig is toegebracht, is de
      gemeente gehouden deze schade te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
