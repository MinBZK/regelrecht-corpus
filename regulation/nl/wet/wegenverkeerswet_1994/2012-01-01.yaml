  - number: '107'
    text: |-
      1 Aan de bestuurder van een motorrijtuig op de weg dient door de daartoe bevoegde autoriteit een rijbewijs te zijn
      afgegeven voor het besturen van motorrijtuigen van de categorie waartoe dat motorrijtuig behoort.

      2 Het rijbewijs dient:

      a. te voldoen aan de bij ministeriële regeling vastgestelde eisen inzake inrichting, uitvoering en invulling,

      b. zijn geldigheid niet te hebben verloren, en

      c. behoorlijk leesbaar te zijn.

      3 Indien de aanvrager als ingezetene is ingeschreven in de basisadministratie persoonsgegevens
      van een gemeente, wordt het in de basisadministratie opgenomen burgerservicenummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1], op de bij ministeriële regeling
      vastgestelde wijze op het rijbewijs vermeld. Indien de aanvrager niet als ingezetene is ingeschreven in de
      basisadministratie persoonsgegevens van een gemeente, wordt op het rijbewijs een bij ministeriële regeling
      vastgestelde aanduiding vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: '108'
    text: |-
      1 [Artikel 107][ref1] is niet van toepassing op bestuurders van:

      a. bromfietsen als bedoeld in [artikel 1, eerste lid, onderdeel e, subonderdeel d][ref2], en
      gehandicaptenvoertuigen die zijn uitgerust met een motor, landbouw- of bosbouwtrekkers en motorrijtuigen met
      beperkte snelheid;

      b. motorrijtuigen, gedurende de tijd dat aan die bestuurders rijonderricht in de zin van de
      [Wet rijonderricht motorrijtuigen 1993][ref3] wordt gegeven, voor zover het motorrijtuig daarbij niet onder
      toezicht wordt bestuurd en overigens is voldaan aan de bij algemene maatregel van bestuur gestelde voorwaarden;

      c. motorrijtuigen, gedurende de tijd dat door die bestuurders een rijproef wordt afgelegd in het kader van
      een onderzoek, door of vanwege de overheid ingesteld, naar hun rijvaardigheid of geschiktheid, voor zover het
      motorrijtuig daarbij niet onder toezicht wordt bestuurd en overigens is voldaan aan de bij algemene maatregel van
      bestuur gestelde voorwaarden;

      d. motorrijtuigen, indien die bestuurders vreemdelingen in de zin van de [Vreemdelingenwet 2000][ref4] zijn, die
      op grond van hun hoedanigheid van of betrekking tot diplomatiek of consulair personeel dan wel op grond van hun
      hoedanigheid van of betrekking tot personeel in dienst van een in Nederland gevestigde internationale organisatie
      houder zijn van een door Onze Minister van Buitenlandse Zaken verstrekt identiteitsbewijs voor geprivilegieerden en
      aan wie, tenzij het een bestuurder van een bromfiets betreft, door het daartoe bevoegde gezag buiten Nederland een
      rijbewijs is afgegeven dat geldig is voor het besturen van een motorrijtuig als waarmee wordt gereden;

      e. motorrijtuigen, indien die bestuurders lid zijn van een krijgsmacht of behoren tot de civiele dienst van een
      krijgsmacht die in het kader van het op 19 juni 1951 te Londen gesloten Verdrag tussen de Staten die partij zijn
      bij het Noord-Atlantisch Verdrag nopens de rechtspositie van hun krijgsmachten, in Nederland is gelegerd, dan wel
      behoren tot het gezin van een lid van een krijgsmacht als hiervoor bedoeld of tot het gezin van een tot de civiele
      dienst van zodanige krijgsmacht behorende persoon, en aan wie, tenzij het een bestuurder van een bromfiets betreft,
      door het daartoe bevoegde gezag in de Staat van herkomst of één van zijn samenstellende delen een rijbewijs is
      afgegeven dat geldig is voor het besturen van een motorrijtuig als waarmee wordt gereden;

      f. motorrijtuigen, anders dan bromfietsen, indien die bestuurders buiten Nederland woonachtig zijn en zij zich
      bevinden in het internationaal verkeer, mits aan hen door het daartoe bevoegde gezag buiten Nederland een rijbewijs
      is afgegeven dat geldig is voor het besturen van een motorrijtuig als waarmee wordt gereden alsmede, in de gevallen
      waarin zulks is vereist op grond van internationale overeenkomsten die Nederland binden, aan hen buiten Nederland
      een internationaal rijbewijs is afgegeven dat geldig is voor het besturen van een motorrijtuig als waarmee wordt
      gereden;

      g. motorrijtuigen, anders dan bromfietsen, indien die bestuurders in Nederland woonachtig zijn en aan hen door
      het daartoe bevoegde gezag buiten Nederland, anders dan in een andere Lid-Staat van de Europese Gemeenschappen of
      in een andere Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland,
      een rijbewijs is afgegeven dat geldig is voor het besturen van een motorrijtuig als waarmee wordt gereden, zo lang
      sedert de dag waarop zij zich in Nederland hebben gevestigd, nog geen 185 dagen zijn verstreken;

      h. motorrijtuigen, indien die bestuurders in Nederland woonachtig zijn en aan hen door het daartoe bevoegde gezag
      in een andere Lid-Staat van de Europese Gemeenschappen of in een andere Staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland, een rijbewijs is afgegeven dat geldig is voor het
      besturen van een motorrijtuig als waarmee wordt gereden, gedurende de periode die is gelegen tussen de datum van
      vestiging van die bestuurders in Nederland en de datum waarop sedert de datum van afgifte van dat rijbewijs tien
      jaren zijn verstreken dan wel, indien die periode korter is dan een jaar, gedurende een jaar vanaf het moment van
      vestiging van die bestuurders in Nederland;

      i. bromfietsen, indien:

      1°. die bestuurders buiten Nederland woonachtig zijn en zij zich bevinden in het internationaal verkeer;

      2°. die bestuurders die afkomstig zijn uit een Staat anders dan een andere Lid-Staat van de Europese
      Gemeenschappen, een andere Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      of Zwitserland en die in Nederland woonachtig zijn, zo lang sedert de dag waarop zij zich in Nederland hebben
      gevestigd, nog geen 185 dagen zijn verstreken;

      3°. die bestuurders die afkomstig zijn uit een andere Lid-Staat van de Europese Gemeenschappen, een andere Staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland en in Nederland
      woonachtig zijn, en die niet beschikken over een rijbewijs dat de bevoegdheid geeft tot het besturen van
      motorrijtuigen van een andere categorie dan bromfietsen, zolang sedert de dag waarop zij zich in Nederland hebben
      gevestigd, nog geen 185 dagen zijn verstreken.

      2 Bij ministeriële regeling worden voorschriften vastgesteld ter uitvoering van de in het eerste lid, onderdelen
      *b* en *c*, bedoelde algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006073
      [ref4]: https://wetten.overheid.nl/BWBR0011823
