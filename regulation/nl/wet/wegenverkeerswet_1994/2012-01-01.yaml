  - number: '87'
    text: |-
      1 De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie die erkenning is verleend, daarom verzoekt.

      2 De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:

      a. niet meer voldoet aan de voor de erkenning gestelde eisen,

      b. in strijd met de eisen, bedoeld in [artikel 75, eerste lid][ref1], of de regels, bedoeld in
      [artikel 76, derde lid][ref2], een keuringsbewijs afgeeft voor een motorrijtuig of een aanhangwagen,

      c. een keuringsrapport afgeeft voor een motorrijtuig of een aanhangwagen, waarvoor de erkenning niet geldt,

      d. de verplichting, vervat in [artikel 85][ref3], [86, zesde lid][ref4], [90, vierde lid][ref5], of
      [91, vierde lid][ref6], niet nakomt,

      e. weigert een keuringsbewijs af te geven voor een motorrijtuig of een aanhangwagen, waarvoor de
      erkenning geldt, hoewel dat voertuig bij een keuring, verricht met inachtneming van de regels, bedoeld in
      [artikel 76, derde lid][ref7], voldoet aan de eisen, bedoeld in [artikel 75, eerste lid][ref8], of

      f. handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.

      3 De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, onderdelen *a, d* en *f*, een erkenning
      schorsen voor een door hem daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.

      4 De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, bepalen dat een wachttijd geldt voor het
      aanvragen van een erkenning van maximaal 30 maanden.


