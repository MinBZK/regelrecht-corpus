  - number: 151b
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. richtlijn vakbekwaamheid bestuurders: de bij ministeriële regeling aangewezen richtlijn;

      b. bestuurder: degene die vervoer over de weg verricht met een voertuig dat behoort tot een categorie waarop de
      richtlijn vakbekwaamheid bestuurders van toepassing is en die:

      1°. ingezetene is van een lidstaat van de Europese Unie, dan wel

      2°. ingezetene is van een land buiten de Europese Unie en werkzaam is voor een binnen de Europese Unie gevestigde
      onderneming;

      c. basiskwalificatie: het opleidings- en kennisniveau dat de in de richtlijn vakbekwaamheid bestuurders aangewezen
      onderwerpen en praktische vaardigheden omvat;

      d. getuigschrift van vakbekwaamheid: document dat dient als bewijs dat de houder de basiskwalificatie heeft
      behaald;

      e. nascholing: periodiek opleidingstraject dat in de richtlijn vakbekwaamheid bestuurders aangewezen onderwerpen en
      praktische vaardigheden omvat;

      f. getuigschrift van nascholing: document dat dient als bewijs dat de houder de nascholing met goed gevolg heeft
      voltooid;

      g. aangewezen exameninstantie: persoon of instelling als bedoeld in [artikel 151f, eerste lid][ref1];

      h. erkend opleidingscentrum: opleidingscentrum als bedoeld in [artikel 151f, tweede lid][ref2];

      i. gewone verblijfplaats: de verblijfplaats zoals omschreven in artikel 14, derde lid, van verordening (EEG) nr.
      3821/85 van de Raad van de Europese Gemeenschappen van 20 december 1985 betreffende het controleapparaat in het
      wegvervoer (PbEG L 370).


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151f
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel151f
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel151b
