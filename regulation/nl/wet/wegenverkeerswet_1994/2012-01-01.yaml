  - number: 132o
    text: |-
      Het is eenieder aan wie niet een erkenning als bedoeld in [artikel 132k][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel132o
