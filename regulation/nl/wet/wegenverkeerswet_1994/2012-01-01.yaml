  - number: 132a
    text: |-
      1 In de in [artikel 131, eerste lid, aanhef en onderdeel a][ref1], bedoelde gevallen legt het CBR bij het in dat
      artikel bedoelde besluit betrokkene overeenkomstig de bij algemene maatregel van bestuur vastgestelde regels de
      verplichting op zich binnen een daarbij vast te stellen termijn te onderwerpen aan educatieve maatregelen ter
      bevordering van de rijvaardigheid of geschiktheid.

      2 De kosten verbonden aan het opleggen van een educatieve maatregel ter bevordering van de rijvaardigheid
      of geschiktheid komen ten laste van iedereen aan wie overeenkomstig het eerste lid de verplichting tot
      deelname aan een dergelijke maatregel is opgelegd. De hoogte van deze kosten wordt bij ministeriële
      regeling vastgelegd. In geval van niet, niet geheel of niet op aangegeven wijze of binnen de aangegeven
      termijnen betalen van deze kosten vaardigt het CBR een dwangbevel uit aan de nalatige. Voor de
      toepassing van [titel 4.4. van de Algemene wet bestuursrecht][ref2] wordt het besluit als bedoeld
      in [artikel 131, eerste lid, aanhef en onderdeel a][ref3], aangemerkt als beschikking als bedoeld in
      [artikel 4.86 van de Algemene wet bestuursrecht][ref4].

      3 De kosten verbonden aan het uitvoeren van de educatieve maatregelen komen ten laste van betrokkene. De hoogte van
      deze kosten worden bij ministeriële regeling vastgesteld.

      4 Het CBR bepaalt de aard van de educatieve maatregelen en wijst een of meer tot toepassing van die maatregelen
      bevoegde deskundigen aan.

      5 Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste en tweede lid.

      6 Voor de toepassing van het eerste lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door het
      daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel486
