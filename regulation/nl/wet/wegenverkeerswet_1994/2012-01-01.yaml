    text: |-
      1 De Dienst Wegverkeer houdt een register betreffende gegevens inzake het alcoholslotprogramma. Onder gegevens
      worden mede begrepen persoonsgegevens of bijzondere persoonsgegevens.

      2 Het verzamelen van gegevens als bedoeld in [artikel 129 c, eerste lid][ref1], geschiedt voor de volgende
      doeleinden:

      a. een goede en adequate uitvoering van deze wet, voor zover het gaat om het alcoholslotprogramma;

      b. de handhaving van bij of krachtens deze wet vastgestelde voorschriften, voor zover het gaat om het
      alcoholslotprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel129c
