  - number: '77'
    text: |-
      Het voor afgifte van een keuringsrapport aangeboden voertuig dient overeen te stemmen met de in het daarbij
      behorende kentekenbewijs en de in het kentekenregister vermelde gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel77
  - number: '78'
    text: |-
      1 Keuringsrapporten worden overeenkomstig bij algemene maatregel van bestuur vastgestelde regels afgegeven door:

      a. de Dienst Wegverkeer in het kader van een door deze dienst verrichte keuring van het voertuig waarvoor de
      afgifte wordt gevraagd;

      b. een ingevolge [artikel 84][ref1] erkende natuurlijke persoon of rechtspersoon in het kader van een door deze
      verrichte keuring van het voertuig waarvoor de afgifte wordt gevraagd.

      2 De Dienst Wegverkeer draagt er zorg voor dat indien in onvoldoende mate keuringsrapporten kunnen worden
      afgegeven door andere natuurlijke personen of rechtspersonen als bedoeld in het eerste lid, onderdeel b, dan die
      zich bezighouden met het verrichten van onderhoud of reparaties aan motorrijtuigen of aanhangwagens, de Dienst
      Wegverkeer kan voorzien in zodanige afgifte.

      3 De Dienst Wegverkeer geeft geen keuringsrapporten af voor zover in voldoende mate keuringsrapporten kunnen worden
      afgegeven door natuurlijke personen of rechtspersonen als bedoeld in het eerste lid, onderdeel b, die zich niet
      bezighouden met het verrichten van onderhoud of reparaties aan motorrijtuigen of aanhangwagens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel84
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '84'
        hoofdstuk: V
        paragraaf: '5'
  - number: '79'
    text: |-
      Degene die ingevolge [artikel 78][ref1] met de afgifte van keuringsbewijzen is belast, doet van het voornemen
      tot de afgifte van zodanig bewijs op de bij ministeriële regeling te bepalen wijze mededeling aan de beheerder
      van het kentekenregister. Van de weigering van de afgifte van een keuringsbewijs wordt mededeling gedaan in bij
      ministeriële regeling vast te stellen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: '80'
    text: |-
      1 De Dienst Wegverkeer geeft voor keuringsbewijzen die versleten of geheel of ten dele onleesbaar zijn, dan wel
      verloren zijn geraakt of teniet zijn gegaan, op aanvraag en tegen betaling, op de door deze dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief vervangende keuringsbewijzen af.

      2 Een vervangend keuringsbewijs wordt niet afgegeven dan nadat het versleten of geheel of ten dele onleesbaar
      geworden bewijs is ingeleverd bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel80
  - number: '81'
    text: |-
      1 Bij algemene maatregel van bestuur wordt, voorzover nodig onder daarbij te stellen voorwaarden, bepaald op
      welk tijdstip een keuringsbewijs geldigheid verkrijgt en voor welke duur een keuringsbewijs geldig is. Deze duur
      kan voor verschillende groepen van voertuigen, alsmede voor voertuigen die voor, onderscheidenlijk na een bij
      algemene maatregel van bestuur te bepalen tijdstip voor het eerst op de weg zijn toegelaten, verschillend worden
      vastgesteld.

      2 Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot de in het eerste lid
      bedoelde voorwaarden en groepen van motorrijtuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel81
  - number: '82'
    text: |-
      Onverminderd de [artikelen 81][ref1], [86, vierde lid][ref2], en [91, vierde lid][ref3], verliest een
      keuringsbewijs zijn geldigheid:

      a. door afgifte van een vervangend keuringsbewijs;

      b. door het onbevoegd daarin aanbrengen van wijzigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel91
