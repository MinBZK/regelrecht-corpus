  - number: 129c
    text: |-
      1 In het alcoholslotregister worden de volgende gegevens verwerkt:

      a. gegevens betreffende de oplegging van een alcoholslotprogramma aan de betrokken rijbewijshouder;

      b. gegevens betreffende de erkenninghouder, bedoeld in [artikel 132k, eerste lid][ref1], alsmede de persoon door
      wie de in dat lid bedoelde werkzaamheden zijn verricht;

      c. het kenteken van het motorrijtuig waarin een alcoholslot is ingebouwd;

      d. gegevens betreffende het inbouwen, het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen en
      het verwijderen van het alcoholslot;

      e. gegevens betreffende de betaling van de kosten verbonden aan het alcoholslotprogramma;

      f. gegevens voortvloeiende uit de periodieke uitlezing van het alcoholslot.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de inrichting en het beheer
      van het register.


