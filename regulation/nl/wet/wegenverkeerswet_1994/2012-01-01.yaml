  - number: '90'
    text: |-
      1 Tegen een beschikking tot weigering van de afgifte van een keuringsbewijs kan een belanghebbende bezwaar maken of
      administratief beroep instellen bij de Dienst Wegverkeer.

      2 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] kan tegen een beschikking tot weigering
      van de afgifte van een keuringsbewijs slechts bezwaar worden gemaakt of administratief beroep worden ingesteld
      terstond nadat de beschikking is bekendgemaakt.

      3 Het bezwaar of administratief beroep wordt slechts in behandeling genomen indien het voertuig in de staat
      waarin het zich ten tijde van de keuring bevond, onmiddellijk op een door de Dienst Wegverkeer bepaalde plaats ter
      beschikking wordt gesteld ten behoeve van een herkeuring door een door de Dienst Wegverkeer aangewezen deskundige.

      4 In afwijking van de [artikelen 7:15][ref2] en [7:28 van de Algemene wet bestuursrecht][ref3] dient bij de
      indiening van het bezwaar- of beroepschrift een bedrag ter vergoeding van de aan de herkeuring verbonden kosten te
      worden betaald. De hoogte van het bedrag en de wijze van betaling worden vastgesteld door de Dienst Wegverkeer.

      5 Degene die de beschikking tot weigering van de afgifte van een keuringsbewijs heeft gegeven, wordt in de
      gelegenheid gesteld bij de herkeuring aanwezig te zijn.

      6 Indien het voertuig volgens het oordeel van de deskundige voldoet aan de in [artikel 75][ref4] bedoelde eisen,
      geeft de Dienst Wegverkeer alsnog het aangevraagde keuringsbewijs af en wordt het in het vierde lid bedoelde
      bedrag terugbetaald aan de indiener van het bezwaar- of beroepschrift. Is in dit geval de beschikking tot weigering
      van de afgifte van een keuringsbewijs gegeven door een erkende natuurlijke persoon of rechtspersoon, dan is
      deze vorenbedoeld bedrag verschuldigd aan de Dienst Wegverkeer en gehouden dit te betalen op de door deze dienst
      vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel715
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel728
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel75
