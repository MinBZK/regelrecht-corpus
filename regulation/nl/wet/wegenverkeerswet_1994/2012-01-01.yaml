      1 Overtreding van [artikel 6][ref1] wordt gestraft met:

      a. gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, indien het een ongeval betreft
      waardoor een ander wordt gedood;

      b. gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde categorie, indien het een
      ongeval betreft waardoor een ander lichamelijk letsel wordt toegebracht.

      2 Indien de schuld bestaat in roekeloosheid, wordt overtreding van [artikel 6 ][ref2]gestraft met:

      a. gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie, indien het een ongeval betreft
      waardoor een ander wordt gedood;

      b. gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, indien het een ongeval betreft
      waardoor een ander lichamelijk letsel wordt toegebracht.

      3 Indien de schuldige verkeerde in de toestand, bedoeld in [artikel 8, eerste, tweede, derde of vierde lid][ref3],
      dan wel na het feit niet heeft voldaan aan een bevel, gegeven krachtens
      [artikel 163, tweede, zesde, achtste of negende lid][ref4], of indien het feit is veroorzaakt of mede is
      veroorzaakt doordat hij een krachtens deze wet vastgestelde maximumsnelheid in ernstige mate heeft overschreden,
      dan wel zeer dicht achter een ander voertuig is gaan rijden, geen voorrang heeft verleend of gevaarlijk heeft
      ingehaald kunnen de in het eerste en tweede lid bepaalde gevangenisstraffen met de helft worden verhoogd.


