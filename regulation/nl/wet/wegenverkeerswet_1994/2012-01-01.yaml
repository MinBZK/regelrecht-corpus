  - number: '130'
    text: |-
      1 Indien bij de bij algemene maatregel van bestuur aangewezen personen een vermoeden bestaat dat de houder
      van een rijbewijs niet langer beschikt over de rijvaardigheid dan wel over de lichamelijke of geestelijke
      geschiktheid, vereist voor het besturen van een of meer categorieën van motorrijtuigen waarvoor dat rijbewijs
      is afgegeven, doen zij daarvan zo spoedig mogelijk schriftelijk mededeling aan het CBR onder vermelding van de
      feiten en omstandigheden die aan het vermoeden ten grondslag liggen. Bij ministeriële regeling worden de feiten
      en omstandigheden aangewezen die aan het vermoeden ten grondslag dienen te liggen en worden ter zake van de
      uitoefening van deze bevoegdheid nadere regels vastgesteld.

      2 Op de eerste vordering van de in [artikel 159, onderdeel a][ref1], bedoelde personen is de bestuurder van een
      motorrijtuig, ten aanzien van wie een vermoeden als bedoeld in het eerste lid bestaat, verplicht tot overgifte van
      het hem afgegeven rijbewijs.

      3 De in het tweede lid bedoelde vordering wordt gedaan indien de betrokken bestuurder de veiligheid op de weg
      zodanig in gevaar kan brengen dat hem met onmiddellijke ingang de bevoegdheid dient te worden ontnomen langer als
      bestuurder van een of meer categorieën van motorrijtuigen, waarvoor het rijbewijs is afgegeven, aan het verkeer
      deel te nemen. Bij ministeriële regeling worden de gevallen aangewezen waarin daarvan sprake is. De in het tweede
      lid bedoelde vordering wordt tevens gedaan in bij ministeriële regeling aangegeven gevallen van overtreding van
      de voorwaarden van deelname aan het alcoholslotprogramma. Het ingevorderde rijbewijs wordt gelijktijdig met de
      schriftelijke mededeling, bedoeld in het eerste lid, aan het CBR toegezonden.

      4 In geval van toepassing van het tweede lid kan het motorrijtuig, voor zover geen andere bestuurder
      beschikbaar is of de bestuurder niet aanstonds voldoet aan de vordering, onder toezicht of, voor zover degene
      die de vordering heeft gedaan, zulks nodig oordeelt, in bewaring worden gesteld. In het laatste geval zijn
      de [artikelen 170, tweede lid, tweede en derde volzin, vierde en vijfde lid][ref2], [171][ref3], [172][ref4]
      en [173, eerste lid][ref5], van deze wet en de [artikelen 4:116][ref6], [4:118 tot en met 4:124][ref7],
      [5:10][ref8], [5:25, eerste en zesde lid][ref9], [5:29, tweede en derde lid][ref10],
      [5:30, eerste, tweede, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref11] van overeenkomstige
      toepassing. Teruggave van het motorrijtuig vindt slechts plaats, indien aan de vordering is voldaan.

      5 Voor de toepassing van het eerste, tweede en derde lid wordt onder rijbewijs mede verstaan een rijbewijs,
      afgegeven door het daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.


