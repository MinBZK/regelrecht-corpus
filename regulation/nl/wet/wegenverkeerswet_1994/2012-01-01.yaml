  - number: '124'
    text: |-
      1 Onverminderd de [artikelen 132, tweede lid][ref1], [132b, tweede lid][ref2], en [134, vierde lid][ref3], wordt
      een rijbewijs overeenkomstig bij algemene maatregel van bestuur vastgestelde regels voor een of meer categorieën
      van motorrijtuigen of voor een deel van de geldigheidsduur ongeldig verklaard indien:

      a. het rijbewijs is afgegeven op grond van door de houder verschafte onjuiste gegevens en het niet zou zijn
      afgegeven indien de onjuistheid van die gegevens ten tijde van de aanvraag bekend zou zijn geweest;

      b. na afgifte van het rijbewijs blijkt dat het kennelijk abusievelijk aan de houder is afgegeven;

      c. de houder een schriftelijke verklaring overlegt, waarin hij afstand doet van de bevoegdheid tot het besturen van
      een of meer categorieën van motorrijtuigen waarvoor het rijbewijs is afgegeven;

      d. de houder blijkens een op diens verzoek uitgevoerd onderzoek niet langer beschikt over de lichamelijke of
      geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen van de categorie of categorieën
      waarop het onderzoek betrekking heeft, voor die categorie of categorieën en, indien bij dat onderzoek blijkt dat
      hij tevens niet beschikt over de lichamelijke of geestelijke geschiktheid die is vereist voor het besturen van
      motorrijtuigen van een andere categorie of andere categorieën dan waarop het onderzoek betrekking heeft, tevens
      voor die andere categorie of categorieën;

      e. het als gevonden voorwerp is ontvangen en teruggave aan de houder niet mogelijk is gebleken, mits de houder nog
      geen aanvraag voor een vervangend rijbewijs heeft ingediend.

      2 De ongeldigverklaring geschiedt:

      a. in de in het eerste lid, onderdelen a en b, bedoelde gevallen door de Dienst Wegverkeer, indien de
      ongeldigverklaring betrekking heeft op een door deze dienst of een door Onze Minister afgegeven rijbewijs;

      b. in de in het eerste lid, onderdelen d en e, bedoelde gevallen door de Dienst Wegverkeer, indien de
      ongeldigverklaring betrekking heeft op een rijbewijs, afgegeven door het daartoe bevoegde gezag in een andere
      Lid-Staat van de Europese Gemeenschappen of in een andere Staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland, waarvan de houder in Nederland woonachtig is;

      c. in de in het eerste lid, onderdelen a en b, bedoelde gevallen door degene die is belast met de afgifte van
      rijbewijzen, indien de ongeldigverklaring betrekking heeft op een rijbewijs dat niet is afgegeven door de Dienst
      Wegverkeer of door Onze Minister, dan wel door het daartoe bevoegde gezag in een andere Lid-Staat van de Europese
      Gemeenschappen of in een andere Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      of Zwitserland;

      d. in het in het eerste lid, onderdeel c, bedoelde geval

      I. indien de verklaring wordt overgelegd door een houder die zich ingevolge het in
      [artikel 131, eerste lid, onderdeel c][ref4], bedoelde besluit dient te onderwerpen aan een onderzoek naar zijn
      rijvaardigheid of geschiktheid, door het CBR;

      II. buiten de gevallen waarin de verklaring wordt overgelegd door een houder die zich ingevolge het in
      [artikel 131, eerste lid, onderdeel c][ref5], bedoelde besluit dient te onderwerpen aan een onderzoek naar
      zijn rijvaardigheid of geschiktheid, door degene die is belast met de afgifte van rijbewijzen, indien de
      ongeldigverklaring betrekking heeft op een rijbewijs dat niet is afgegeven door de Dienst Wegverkeer of door Onze
      Minister dan wel door de Dienst Wegverkeer, indien de ongeldigverklaring betrekking heeft op een door deze dienst
      of een door Onze Minister afgegeven rijbewijs;

      e. in de in het eerste lid, onderdeel d, bedoelde gevallen door het CBR;

      f. in het in het eerste lid, onderdeel e, bedoelde geval door degene die is belast met de afgifte van rijbewijzen,
      indien de ongeldigverklaring betrekking heeft op een rijbewijs dat niet is afgegeven door het daartoe bevoegde
      gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere Staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland.

      3 De ongeldigverklaring is van kracht met ingang van de zevende dag na die waarop het besluit tot
      ongeldigverklaring aan de houder van het rijbewijs is bekend gemaakt.

      4 De houder van het ongeldig verklaarde rijbewijs dient dat rijbewijs zodra de ongeldigverklaring van kracht is
      geworden, in te leveren bij degene die het ongeldig heeft verklaard.

      5 Bij ministeriële regeling kunnen nadere regels worden vastgesteld omtrent de wijze waarop de inlevering van
      ongeldig verklaarde rijbewijzen dient plaats te vinden.

      6 Indien het rijbewijs dat voor ongeldigverklaring op grond van het eerste lid, onderdeel c, in aanmerking komt,
      zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur, plaatst degene die ingevolge het tweede
      lid is belast met de ongeldigverklaring:

      a. in het in het tweede lid, onderdeel d, aanhef en onder I, bedoelde geval een aantekening in het
      rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op de bij algemene
      maatregel van bestuur vastgestelde wijze dient aan te tonen dat hij, al naar gelang de aard van het onderzoek
      waarop het in [artikel 131, eerste lid, onderdeel c][ref6], bedoelde besluit betrekking heeft, beschikt over
      de rijvaardigheid, de lichamelijke en geestelijke geschiktheid dan wel de rijvaardigheid en de lichamelijke en
      geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen van de categorie of categorieën waarop
      de door de houder overgelegde verklaring betrekking heeft;

      b. in het in het tweede lid, onderdeel d, aanhef en onder II, bedoelde geval een aantekening in het
      rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op de bij algemene
      maatregel van bestuur vastgestelde wijze dient aan te tonen dat hij beschikt over de rijvaardigheid en de
      lichamelijke en geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen van de categorie of
      categorieën waarop de door de houder overgelegde verklaring betrekking heeft.

      7 Indien het rijbewijs dat voor ongeldigverklaring op grond van het eerste lid, onderdeel d, in aanmerking komt,
      zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur, plaatst degene die ingevolge het tweede
      lid is belast met de ongeldigverklaring, een aantekening in het rijbewijzenregister waaruit blijkt dat de houder
      bij de aanvraag van een nieuw rijbewijs op de bij algemene maatregel van bestuur vastgestelde wijze dient aan
      te tonen dat hij beschikt over de lichamelijke en geestelijke geschiktheid die is vereist voor het besturen van
      motorrijtuigen van de categorie of categorieën waarop het onderzoek betrekking heeft.

      8 Indien bij het op grond van het eerste lid, onderdeel d, uitgevoerde onderzoek is gebleken dat de resterende
      geldigheidsduur van het rijbewijs korter is dan de termijn waarvoor de houder blijkens het onderzoek naar
      verwachting geschikt zal zijn voor het besturen van motorrijtuigen, plaatst het CBR een aantekening in het
      rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op de bij algemene
      maatregel van bestuur vastgestelde wijze dient aan te tonen dat hij beschikt over de lichamelijke en geestelijke
      geschiktheid die is vereist voor het besturen van motorrijtuigen van de categorie of categorieën waarop het
      onderzoek betrekking heeft.

      9 Voor de toepassing van het eerste lid, aanhef en onderdelen c, d en e, het derde tot en met het achtste lid wordt
      onder rijbewijs mede verstaan een rijbewijs, afgegeven door het daartoe bevoegde gezag in een andere Lid-Staat
      van de Europese Gemeenschappen of in een andere Staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of Zwitserland, waarvan de houder in Nederland woonachtig is.


