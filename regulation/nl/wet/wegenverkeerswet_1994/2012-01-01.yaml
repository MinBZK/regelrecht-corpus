  - number: 4c
    text: |-
      Onze Minister kan de Dienst Wegverkeer aanwijzingen van algemene aard geven omtrent de uitoefening van de
      aan de Dienst opgedragen taken. Aanwijzingen omtrent de uitoefening van de bij of krachtens andere wetten dan
      deze wet opgedragen taken worden door Onze Minister gegeven in overeenstemming met Onze voor die wetten eerst
      verantwoordelijke Ministers.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4c
  - number: 4d
    text: De Dienst Wegverkeer heeft een directie en een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4d
  - number: 4e
    text: |-
      1 De directie bestaat uit maximaal 3 leden.

      2 Het lidmaatschap van de directie is onverenigbaar met het lidmaatschap van de raad van toezicht.

      3 De leden van de directie worden aangesteld, geschorst en ontslagen door de raad van toezicht.

      4 De leden van de directie worden aangesteld voor een periode van 5 jaren en kunnen terstond opnieuw worden
      aangesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4e
  - number: 4f
    text: |-
      1 De directie is belast met de dagelijkse leiding van de Dienst Wegverkeer.

      2 Alle bevoegdheden van de Dienst Wegverkeer die niet bij of krachtens de wet aan de raad van toezicht zijn
      opgedragen, komen toe aan de directie.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4f
  - number: 4g
    text: |-
      1 De directie vertegenwoordigt de Dienst Wegverkeer in en buiten rechte.

      2 De directie kan onder haar verantwoordelijkheid de vertegenwoordiging, bedoeld in het eerste lid, opdragen aan
      een of meer directieleden of andere personen. Zij kan bepalen dat deze vertegenwoordiging uitsluitend betrekking
      heeft op bepaalde onderdelen van de taak van de Dienst Wegverkeer dan wel op bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4g
  - number: 4h
    text: |-
      In geval van schorsing of ontstentenis van een lid van de directie voorziet de raad van toezicht in de waarneming
      van diens functie.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4h
  - number: 4i
    text: |-
      1 De directie verstrekt de raad van toezicht tijdig de voor de uitoefening van diens taak benodigde inlichtingen en
      andere gegevens.

      2 De directie legt jaarlijks, en voorts tussentijds indien hiertoe naar het oordeel van de raad van toezicht
      aanleiding bestaat, aan de raad van toezicht verantwoording af over het door haar gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4i
  - number: 4j
    text: |-
      1 De raad van toezicht bestaat uit vijf leden, waaronder de voorzitter.

      2 Onze Minister benoemt, schorst en ontslaat de leden van de raad van toezicht.

      3 De voorzitter wordt benoemd, gehoord de raad van toezicht.

      4 De leden van de raad van toezicht hebben op persoonlijke titel zitting in de raad en oefenen hun functie uit
      zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4j
  - number: 4k
    text: |-
      1 De voorzitter en de overige leden van de raad van toezicht worden benoemd voor een tijdvak van vier jaren en zijn
      voor een aansluitende periode éénmaal herbenoembaar.

      2 De leden van de raad van toezicht kan tussentijds op eigen verzoek, dan wel om zwaarwichtige redenen ontslag
      worden verleend.

      3 Zolang in een vacature van de raad van toezicht niet is voorzien, vormen de overblijvende leden de raad van
      toezicht, met de bevoegdheid van de volledige raad. Binnen twee maanden na het openvallen van een vacature wordt
      een nieuw lid benoemd. Betreft het de vacature van de voorzitter dan wijzen de overblijvende leden uit hun midden
      een lid aan dat tijdelijk als voorzitter fungeert.

      4 Degene die is benoemd ter vervanging van een tussentijds opengevallen plaats treedt af op het tijdstip waarop
      degene in wiens plaats hij is benoemd, zou moeten aftreden en is vervolgens voor een aansluitende periode éénmaal
      herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4k
  - number: 4l
    text: |-
      1 De raad van toezicht ziet toe op de werkzaamheden van de directie en staat die met raad terzijde.

      2 Goedkeuring door de raad van toezicht behoeven in ieder geval de besluiten van de directie betreffende:

      a. de reglementen, bedoeld in de [artikelen 4n][ref1], [4o][ref2] en [4r][ref3];

      b. vaststelling van de tarieven, bedoeld in [artikel 4b, eerste lid, onderdeel n][ref4], de tarieven die
      voortvloeien uit [artikel 4b, tweede lid, onderdeel a][ref5], alsmede van de wijze van betaling van deze tarieven;

      c. investeringen die een door de raad van toezicht vast te stellen bedrag te boven gaan;

      d. de financiële begroting;

      e. het jaarverslag en de jaarrekening;

      f. het aangaan of garanderen van geldleningen die een door de raad van toezicht vast te stellen bedrag te boven
      gaan;

      g. wijzigingen in de rechtspositie van het personeel;

      h. de bij of krachtens deze wet aan Onze Minister uit te brengen rapportages;

      i. het financiële meerjarenbeleidsplan;

      j. uitbreiding van de keuringscapaciteit als bedoeld in [artikel 78, tweede lid][ref6];

      k. het oprichten of mede-oprichten van dan wel het deelnemen in rechtspersonen of vennootschappen;

      l. het sluiten van overeenkomsten van zwaarwegend belang.

      3 Het aangaan of garanderen van geldleningen die een door Onze Minister vast te stellen bedrag te boven gaan, de
      in het tweede lid, onderdelen b, d, i, j, k en l genoemde besluiten, het in [artikel 4n][ref7] bedoelde reglement,
      alsmede het in [artikel 4o][ref8] bedoelde reglement voor zover het betreft de bezoldiging van de directie van
      de Dienst Wegverkeer, behoeven bovendien de goedkeuring van Onze Minister. Bij de goedkeuring van het hier in
      [artikel 4o][ref9] bedoelde reglement zal Onze Minister als richtsnoer de bezoldigingsniveaus van functies van
      vergelijkbare zwaarte bij de ministeries hanteren.

      4 De raad van toezicht kan geen rechtsgeldige besluiten nemen indien niet ten minste vier leden ter vergadering
      aanwezig zijn.

      5 De raad van toezicht stelt bij reglement zijn werkwijze vast. Het reglement behoeft de goedkeuring van Onze
      Minister.

      6 De vergaderingen van de raad van toezicht zijn niet openbaar.


