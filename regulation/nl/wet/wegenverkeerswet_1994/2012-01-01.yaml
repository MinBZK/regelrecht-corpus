  - number: '116'
    text: |-
      1 Een rijbewijs wordt overeenkomstig bij algemene maatregel van bestuur vastgestelde regels afgegeven door de
      burgemeester van de gemeente waar de aanvrager op het tijdstip van de aanvraag als ingezetene was ingeschreven
      in de basisadministratie persoonsgegevens of, in de bij algemene maatregel van bestuur bepaalde gevallen, door de
      Dienst Wegverkeer.

      2 De in het eerste lid bedoelde regels kunnen mede betrekking hebben op de bestelling, het transport en de
      beveiliging van rijbewijzen, de met betrekking tot de afgifte van rijbewijzen te voeren administratie en de in het
      kader van de afgifteprocedure te treffen beveiligingsmaatregelen. Bij ministeriële regeling kunnen ter uitvoering
      van die regels nadere regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel116
  - number: '117'
    text: |-
      De burgemeester van de gemeente waar de aanvrager op het tijdstip van de aanvraag als ingezetene was ingeschreven
      in de basisadministratie persoonsgegevens, is bevoegd tot het afgeven van internationale rijbewijzen ten behoeve
      van het verkeer met motorrijtuigen in het buitenland. Gelijke bevoegdheid kan door Onze Minister worden verleend
      aan besturen van verenigingen met volledige rechtsbevoegdheid, die behartiging van verkeersbelangen ten doel
      hebben.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel117
  - number: '118'
    text: |-
      1 Een rijbewijs wordt afgegeven voor het besturen van een of meer in dat bewijs aangeduide categorieën van
      motorrijtuigen.

      2 De categorieën worden vastgesteld bij algemene maatregel van bestuur.

      3 De uit de categorieën voortvloeiende bevoegdheden kunnen overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels worden beperkt door het stellen van eisen aan het motorrijtuig of aan de bestuurder daarvan.
      Deze eisen kunnen mede omvatten het opleggen van de verplichting tot deelname aan het alcoholslotprogramma.
      In dat geval is het gestelde bij of krachtens de [artikelen 129a tot en met 129e][ref1], [132][ref2] en
      [132b tot en met 132o][ref3] van overeenkomstige toepassing.

      4 Bij ministeriële regeling worden voorschriften vastgesteld met betrekking tot de wijze waarop beperkingen als
      bedoeld in het derde lid worden aangegeven in het rijbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel129a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
