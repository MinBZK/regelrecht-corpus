  - number: '152'
    text: |-
      1 Verkeerstekens die worden geplaatst of verwijderd krachtens een verkeersbesluit, worden geplaatst en verwijderd
      op kosten van het gezag dat het verkeersbesluit heeft genomen.

      2 Maatregelen ter regeling van het verkeer als bedoeld in [artikel 15, tweede lid][ref1], geschieden op kosten van
      het gezag dat het verkeersbesluit heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
  - number: '153'
    text: |-
      Verkeerstekens die niet worden geplaatst of verwijderd krachtens een verkeersbesluit, worden geplaatst en
      verwijderd op kosten van het openbaar lichaam dat het beheer heeft over de weg of, indien geen openbaar lichaam het
      beheer heeft, de eigenaar van de weg.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel153
  - number: '154'
    text: |-
      In afwijking van [artikel 152][ref1] geschiedt de plaatsing en verwijdering van verkeerstekens, strekkende tot het
      instandhouden van de weg en het waarborgen van de bruikbaarheid daarvan op kosten van het openbaar lichaam dat het
      beheer heeft over de weg of, indien geen openbaar lichaam het beheer heeft, van de eigenaar van de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel152
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '152'
        hoofdstuk: VIII
  - number: '155'
    text: |-
      De kosten, verbonden aan de plaatsing van verkeerstekens en de uitvoering van maatregelen in dringende
      omstandigheden, komen ten laste van degene die deze uitvoert.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel155
  - number: '156'
    text: |-
      Bij algemene maatregel van bestuur kunnen kosten, verbonden aan de plaatsing of verwijdering van verkeerstekens,
      worden doorberekend aan degene ten behoeve van wie het verkeersteken is geplaatst of verwijderd.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel156
  - number: 156a
    text: |-
      Door burgemeester en wethouders worden op kosten van de gemeente de grenzen van de bebouwde kom of kommen aangeduid
      voor zover en op de wijze als bij ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel156a
  - number: '157'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen en op welke wijze tarieven, verschuldigd op
      grond van deze wet, gedeeltelijk worden terugbetaald.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel157
  - number: '158'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, met uitzondering van de
      [hoofdstukken IA][ref1], [IB][ref2] en [IC][ref3], zijn belast de in [artikel 159][ref4] bedoelde personen en de
      bij besluit van Onze Minister aangewezen personen, voor zover bij dat besluit is bepaald. Zij beschikken daartoe
      over de in [artikel 160, vierde lid][ref5], genoemde bevoegdheid met betrekking tot het vervoeren van personen en
      over de bevoegdheid, genoemd in [artikel 160, vijfde lid][ref6].

      2 Met het toezicht op de naleving van het bepaalde bij of krachtens de [artikelen 34][ref7] en [35][ref8]
      zijn voorts belast de bij besluit van Onze Minister in overeenstemming met Onze Minister van Economische Zaken
      aangewezen ambtenaren.

      3 Van een besluit als bedoeld in het eerste of tweede lid wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.


