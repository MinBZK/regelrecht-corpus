    text: |-
      1 Een vrijstelling of ontheffing kan onder beperkingen worden verleend. Aan een vrijstelling of ontheffing kunnen
      voorschriften worden verbonden.

      2 Het is verboden te handelen in strijd met de aan een vrijstelling of ontheffing verbonden voorschriften.
