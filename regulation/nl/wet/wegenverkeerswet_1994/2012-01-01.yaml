  - number: '61'
    text: |-
      1 Het is verboden:

      a.

      b.

      c. ten opzichte van een motorrijtuig of een aanhangwagen opzettelijk gebruik te maken van een kentekenbewijs dat
      niet aan de eigenaar of houder voor dat motorrijtuig of die aanhangwagen is afgegeven, als ware het aan deze voor
