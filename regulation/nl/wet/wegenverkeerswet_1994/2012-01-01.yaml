  - number: '171'
    text: |-
      1 Een beschikking tot oplegging van een last onder bestuursdwang overeenkomstig [artikel 170, eerste lid][ref1],
      wordt bekendgemaakt:

      a. aan de rechthebbende die het voertuig afhaalt, of

      b. indien het voertuig binnen achtenveertig uur na de inbewaringstelling niet is afgehaald, zo mogelijk binnen
      een week:

      1°. aan degene aan wie het kenteken is opgegeven, indien het voertuig een kenteken voert;

      2°. aan degene die aangifte heeft gedaan, indien blijkt dat ter zake van het voertuig aangifte van vermissing is
      gedaan, of

      3°. in nader bij ministeriële regeling vast te stellen gevallen op de daarbij aangegeven wijze.

      2 Bij de bekendmaking krachtens het eerste lid, onderdeel *b*, wordt gewezen op het verschuldigd zijn van kosten,
      verbonden aan de oplegging van een last onder bestuursdwang.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel171
