  - number: 4r
    text: |-
      De directie stelt bij reglement richtlijnen vast voor het voeren van een ordelijk financieel beheer van de Dienst
      Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4r
  - number: 4s
    text: |-
      1 De directie stelt jaarlijks een jaarverslag en een jaarrekening op.

      2 Het boekjaar van de Dienst Wegverkeer valt samen met het kalenderjaar.

      3 De directie zendt jaarlijks binnen vier maanden na afloop van het boekjaar de jaarstukken aan de raad van
      toezicht.

      4 De jaarstukken omvatten:

      a. het jaarverslag;

      b. de jaarrekening;

      c. de verklaring van de door de raad van toezicht aangewezen externe registeraccountant;

      d. een opgave over de toepassing van de arbeidsvoorwaarden.

      5 De directie zendt binnen zes maanden na afloop van het boekjaar de jaarstukken met een document, houdende de
      goedkeuring door de raad van toezicht van het jaarverslag en de jaarrekening ter kennisneming aan Onze Minister.
      De directie stelt te zelfder tijd de in het vierde lid, onderdelen *a*, *b* en *c*, bedoelde stukken algemeen
      verkrijgbaar en maakt hiervan melding in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4s
  - number: 4t
    text: |-
      1 De directie dient het financiële meerjarenbeleidsplan en de goedkeuring daarvan door de raad van toezicht voor 1
      oktober voorafgaand aan het boekjaar, in bij Onze Minister.

      2 De directie verstrekt Onze Minister voor 15 januari van het jaar voorafgaand aan het begrotingsjaar de door Onze
      Minister voor het opstellen van de Rijksbegroting vereiste gegevens.

      3 Onze Minister kan regels stellen over de inrichting van de begroting, het financiële meerjarenbeleidsplan en de
      jaarstukken, en kan aandachtspunten vaststellen voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4t
  - number: 4u
    text: |-
      1 De directie verstrekt Onze Minister de inlichtingen die deze ten behoeve van zijn taakuitoefening nodig oordeelt.

      2 Onze Minister verstrekt de Dienst Wegverkeer de inlichtingen die deze voor zijn taakuitoefening redelijkerwijs
      nodig heeft.

      3 Onze Minister stelt een informatiestatuut vast. Het informatiestatuut bevat inhoudelijke en procedurele
      voorschriften met betrekking tot de in dit hoofdstuk bedoelde informatie-uitwisseling tussen Onze Minister en de
      Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4u
  - number: 4v
    text: |-
      1 Waar in deze wet de goedkeuring van Onze Minister is vereist, verleent dan wel onthoudt deze die goedkeuring
      binnen zes weken na de datum van ontvangst van de aan goedkeuring onderhevige stukken.

      2 Met goedkeuring wordt gelijkgesteld het verstrijken van de in het eerste lid bedoelde termijn zonder dat de
      goedkeuring is verleend of onthouden.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4v
  - number: 4w
    text: |-
      1 Waar ingevolge deze wet de goedkeuring dan wel de vaststelling door de raad van toezicht is vereist, verleent of
      onthoudt deze die goedkeuring dan wel stelt deze vast of weigert die vaststelling binnen zes weken na de datum van
      ontvangst van de aan goedkeuring onderhevige dan wel vast te stellen stukken.

      2 Met goedkeuring dan wel vaststelling wordt gelijkgesteld het verstrijken van de in het eerste lid bedoelde
      termijn zonder dat de goedkeuring is verleend of onthouden dan wel de vaststelling heeft plaatsgevonden of is
      geweigerd.

      3 Indien de raad van toezicht goedkeuring onthoudt aan de financiële begroting, is de directie gerechtigd gedurende
      ten hoogste zes maanden voor iedere maand gedurende welke de goedkeuring wordt onthouden, uitgaven te doen ter
      grootte van maximaal een twaalfde deel van de begroting van het voorafgaande boekjaar.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4w
  - number: 4x
    text: |-
      1 Indien naar het oordeel van Onze Minister de Dienst Wegverkeer zijn taken, omschreven in
      [artikel 4b, eerste lid en tweede lid, onderdeel b][ref1], niet langer naar behoren verricht, kan Onze Minister
      bepalen dat de bevoegdheden die met die taken verband houden niet langer aan de Dienst Wegverkeer toekomen. De
      betrokken bevoegdheden gaan in dat geval over op Onze Minister.

      2 Indien de Dienst Wegverkeer een bij of krachtens een andere wet dan deze wet opgedragen taak naar het oordeel
      van Onze Minister en Onze voor die wet eerst verantwoordelijke Minister niet langer naar behoren verricht, kunnen
      zij gezamenlijk bepalen dat de bevoegdheden die met die taak verband houden niet langer aan de Dienst Wegverkeer
      toekomen. De betrokken bevoegdheden gaan in dat geval over op Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4x
