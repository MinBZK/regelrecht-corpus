  - number: 42a
    text: |-
      1 De gegevens in het kentekenregister worden onderscheiden in:

      a. authentieke en niet-authentieke gegevens;

      b. gevoelige en niet-gevoelige gegevens.

      2 Als authentieke gegevens worden aangemerkt:

      a. gegevens die op grond van een bindend besluit van de Raad van de Europese Unie, van het Europees Parlement en de
      Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen verplicht op het kentekenbewijs zijn opgenomen
      voor zover de desbetreffende gegevens niet reeds op grond van een andere wettelijke bepaling als authentiek zijn
      aangemerkt;

      b. de voertuigcategorieën genoemd in [artikel 21, eerste lid][ref1];

      c. de tenaamstelling van een motorrijtuig of aanhangwagen.

      3 Bij algemene maatregel van bestuur kunnen andere authentieke gegevens of categorieën daarvan worden aangewezen.
      Bij algemene maatregel van bestuur kan tevens als authentiek worden aangewezen de samenstelling van een uit een
      andere basisregistratie afkomstig gegeven met een of meer gegevens uit het kentekenregister.

      4 Bij algemene maatregel van bestuur worden gevoelige en niet-gevoelige gegevens of categorieën daarvan aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: '43'
    text: |-
      1 De Dienst Wegverkeer verstrekt uit het kentekenregister gegevens aan overheidsorganen, voor zover zij aangeven
      deze gegevens nodig te hebben voor een goede uitoefening van hun publieke taak.

      2 De Dienst Wegverkeer verstrekt uit het kentekenregister gegevens aan autoriteiten buiten Nederland en
      instellingen van volkenrechtelijke organisaties in bij of krachtens algemene maatregel van bestuur te bepalen
      gevallen.

      3 De Dienst Wegverkeer kan in bij of krachtens algemene maatregel van bestuur te bepalen gevallen gevoelige
      gegevens uit het kentekenregister verstrekken aan andere personen en instanties dan bedoeld in het eerste en tweede
      lid.

      4 Niet-gevoelige gegevens kunnen aan een ieder worden verstrekt.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de
      verstrekkingen als bedoeld in het eerste tot en met vierde lid. Deze verstrekkingen geschieden op aanvraag en op
      een door de Dienst Wegverkeer te bepalen wijze.

      6 Onverminderd het vijfde lid geschiedt de verstrekking van gegevens, als bedoeld in het derde en vierde lid, tegen
      betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het voor de behandeling van de aanvraag door deze
      dienst vastgestelde tarief.

      7 Onverminderd het zesde lid is degene die op grond van het eerste tot en met vierde lid een aanvraag tot
      verstrekking van gegevens indient, in door de Dienst Wegverkeer te bepalen gevallen, een door deze dienst te
      bepalen aansluittarief verschuldigd.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel43
  - number: 43a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het gebruik van de
      ingevolge [artikel 43, derde lid][ref1], verstrekte gegevens. Daarbij kunnen beperkingen aan het gebruik van de
      verstrekte gegevens worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 43b
    text: |-
      1 Een overheidsorgaan dat bij de vervulling van zijn publieke taak een gegeven nodig heeft dat bij of krachtens
      deze wet als authentiek gegeven is aangewezen en in het kentekenregister is opgenomen, maakt gebruik van dat
      gegeven.

      2 Het eerste lid is niet van toepassing indien:

      a. het overheidsorgaan ten aanzien van het betreffende gegeven een melding heeft gedaan als bedoeld in
      [artikel 43c, eerste lid][ref1];

      b. bij het betreffende gegeven een aantekening is geplaatst als bedoeld in [artikel 43c, derde lid][ref2];

      c. bij wettelijk voorschrift anders is bepaald;

      d. een goede vervulling van de publieke taak van het overheidsorgaan door de onverkorte toepassing van het eerste
      lid wordt belet.

      3 Een natuurlijke persoon of rechtspersoon aan wie door een overheidsorgaan een gegeven wordt gevraagd, waarop het
      eerste lid van toepassing is, behoeft dat gegeven niet mede te delen, behoudens voor zover het gegeven noodzakelijk
      wordt geacht voor een deugdelijke vaststelling van de identiteit van betrokkene of van het voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43c
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel43c
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel43b
    references:
      - id: ref1
