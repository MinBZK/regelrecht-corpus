  - number: 35a
    text: |-
      In de ingevolge de [artikelen 21, eerste en derde lid][ref1], [22, eerste lid][ref2], [25a, eerste lid][ref3],
      [26, eerste lid][ref4], en [34, eerste lid][ref5], vastgestelde regels kan ter uitvoering van verdragen of van
      besluiten van volkenrechtelijke organisaties of van één of meer instellingen van de Europese Unie, al dan niet
      gezamenlijk, worden bepaald dat zij mede betrekking hebben op de goedkeuring van voertuigen, systemen, onderdelen,
      technische eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers voor
      gebruik buiten de weg.


