  - number: 118a
    text: |-
      Als datum van afgifte wordt in het rijbewijs en in het rijbewijzenregister vermeld de datum waarop het besluit tot
      afgifte is genomen.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel118a
  - number: '119'
    text: |-
      1 Degene die is belast met de afgifte van rijbewijzen geeft overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels een nieuw rijbewijs af:

      a. bij vernieuwing van het eerder aan de aanvrager afgegeven rijbewijs;

      b. bij wijziging van de omvang van de uit het eerder afgegeven rijbewijs voortvloeiende bevoegdheden, met
      uitzondering van de in [artikel 131, tweede lid, onderdeel a][ref1], bedoelde schorsing van de geldigheid;

      c. bij wijziging van de personalia van de houder;

      d. na ongeldigverklaring van het eerder afgegeven rijbewijs op grond van
      [artikel 124, eerste lid, onderdeel e,][ref2] of [132b, tweede lid][ref3];

      e. in geval het eerder afgegeven rijbewijs versleten of geheel of ten dele onleesbaar is;

      f. in geval het eerder afgegeven rijbewijs verloren is geraakt of teniet is gegaan.

      2 Het nieuwe rijbewijs wordt niet afgegeven dan nadat het eerder afgegeven rijbewijs waarvoor het wordt afgegeven,
      is ingeleverd bij degene die is belast met de afgifte van het nieuwe rijbewijs.

      3 Voor de toepassing van het eerste en het tweede lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven
      door het daartoe bevoegde gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere Staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in
      Nederland woonachtig is.

      4 Indien de houder van een verloren geraakt rijbewijs waarvoor een nieuw rijbewijs is afgegeven, na de afgifte
      van het nieuwe rijbewijs weer in het bezit komt van dat verloren geraakte rijbewijs, dient hij dat rijbewijs in te
      leveren bij degene die het nieuwe rijbewijs heeft afgegeven.

      5 Het eerste lid, aanhef, onderdelen e en f, gelden niet in bij algemene maatregel van bestuur vastgestelde
      gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel124
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
