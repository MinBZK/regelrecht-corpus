  - number: 149b
    text: |-
      1 De wegbeheerder verstrekt aan de Dienst Wegverkeer ten behoeve van de ontheffingverlening, bedoeld in
      [artikel 149a, tweede lid][ref1], de bij of krachtens algemene maatregel van bestuur vastgestelde gegevens
      betreffende de infrastructuur en overige informatie op de bij of krachtens die algemene maatregel van bestuur
      vastgestelde wijze.

      2 In de bij of krachtens algemene maatregel van bestuur aangewezen gevallen behoeft de Dienst Wegverkeer voor de in
      [artikel 149a, tweede lid][ref2], bedoelde ontheffing de toestemming van de wegbeheerder. In deze gevallen wordt de
      toestemming verleend op basis van een door de Dienst Wegverkeer in overleg met de betrokken wegbeheerder opgestelde
      ontwerp-ontheffing.

      3 De wegbeheerder kan uitsluitend de toestemming weigeren, indien dat gerechtvaardigd is met het oog op de in
      [artikel 2, eerste en tweede lid][ref3], omschreven belangen.

      4 Bij het verstrekken van gegevens en informatie, bedoeld in het eerste lid, kan de wegbeheerder aangeven dat
      aan de door de Dienst Wegverkeer te verlenen ontheffing beperkingen of voorschriften worden verbonden, indien dat
      gerechtvaardigd is met het oog op de bescherming van de in [artikel 2, eerste en tweede lid][ref4], omschreven
      belangen.

      5 De Dienst Wegverkeer trekt verleende ontheffingen in of wijzigt deze voorzover de door de wegbeheerder ingevolge
      het eerste lid verstrekte gegevens of andere door hem aan de Dienst Wegverkeer verstrekte informatie daartoe
      aanleiding geeft.

      6 Voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref5] worden
      als één besluit aangemerkt de ontheffing of de weigering daarvan door de Dienst Wegverkeer en de toestemming
      onderscheidenlijk de weigering daarvan door de wegbeheerder.

      7 De wegbeheerder ontvangt voor het verstrekken van gegevens en informatie, bedoeld in het eerste lid, en voor
      het verlenen van toestemming, bedoeld in het tweede lid, van de Dienst Wegverkeer een bij ministeriële regeling
      vastgestelde vergoeding, die is gebaseerd op het aantal en de aard van de verleende ontheffingen voor wegen die
      onder zijn beheer staan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
