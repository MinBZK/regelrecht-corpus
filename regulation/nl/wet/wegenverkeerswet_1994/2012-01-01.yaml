  - number: '83'
    text: |-
      1 De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is keuringsrapporten af te geven voor motorrijtuigen en aanhangwagens, waarvoor [artikel 72][ref1]
      geldt, met uitzondering van bussen als bedoeld in de [Wet personenvervoer 2000][ref2].

      2 Een erkenning geldt voor motorrijtuigen en aanhangwagens, die behoren tot een in de erkenning aangewezen groep,
      en kan gelden voor bepaalde of voor onbepaalde tijd. De aanwijzing kan geen betrekking hebben op de leeftijd of het
      merk van motorrijtuigen en aanhangwagens.

      3 Een erkenning, verleend aan een natuurlijke persoon of rechtspersoon, die een keuringsdienst of een
      onderhoudsdienst voor het eigen wagenpark exploiteert, geldt slechts voor de eigen voertuigen.

      4 Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en
      kunnen met betrekking tot die voorschriften regels worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
  - number: '84'
    text: |-
      1 De erkenning wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief verleend indien de natuurlijke persoon of rechtspersoon voldoet
      aan de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de voor de keuringen
      benodigde apparatuur en ruimte alsmede de deskundigheid van de voor de keuringen beschikbare personen. Ten
      aanzien van de voor de keuringen benodigde apparatuur kan bij die ministeriële regeling de eis worden gesteld
      dat die apparatuur is goedgekeurd door een door Onze Minister aan te wijzen keuringsinstelling en met de in
      die regeling vast te stellen periodiciteit is onderzocht door deze keuringsinstelling dan wel door een door
      deze keuringsinstelling erkende onderzoeksgerechtigde en kunnen regels worden vastgesteld met betrekking tot de
      erkenning van onderzoeksgerechtigden. Bij ministeriële regeling kan worden bepaald dat middelen die worden gebruikt
      om deze apparatuur voor gebruik geschikt te maken zijn gecertificeerd door een door die keuringsinstelling erkende
      instelling en kunnen regels worden vastgesteld met betrekking tot die erkenning.

      2 Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot de aanvraag van een erkenning.

      3 De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning op grond van
      [artikel 87, tweede lid][ref1], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel van zes maanden ingeval reeds twee of meer malen een dergelijke aan
      de aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel87
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '87'
        hoofdstuk: V
        paragraaf: '5'
  - number: '85'
    text: |-
      De erkende natuurlijke personen of rechtspersonen zijn verplicht het door de aanvrager ter keuring aangeboden
      voertuig te keuren, indien zij daartoe gerechtigd zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel85
  - number: 85a
    text: |-
      1 De Dienst Wegverkeer kan aan een natuurlijke persoon de bevoegdheid verlenen motorrijtuigen en aanhangwagens,
      waarvoor [artikel 72][ref1] geldt, met uitzondering van bussen als bedoeld in de Wet personenvervoer, aan een
      keuring te onderwerpen. Ten bewijze van deze bevoegdheid verstrekt de Dienst Wegverkeer de betrokken persoon een
      bevoegdheidspas.

      2 De bevoegdheid voertuigen aan een keuring te onderwerpen geldt voor motorrijtuigen en aanhangwagens die behoren
      tot een in de verlening van de bevoegdheid voertuigen aan een keuring te onderwerpen aangewezen groep, en kan
      gelden voor bepaalde of onbepaalde tijd.

      3 De bevoegdheid voertuigen aan een keuring te onderwerpen wordt verleend indien de natuurlijke persoon beschikt
      over een examencertificaat van een door Onze Minister aangewezen exameninstantie en overigens voldoet aan bij
      ministeriële regeling vastgestelde eisen. Daarbij kan aan de Dienst Wegverkeer de bevoegdheid worden verleend
      voorwaarden vast te stellen ten aanzien van het voldoen aan deze eisen.

      4 Bij ministeriële regeling worden regels vastgesteld met betrekking tot de aanvraag tot het verlenen van de
      bevoegdheid voertuigen aan een keuring te onderwerpen en met betrekking tot de bevoegdheidspas.

      5 Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan de bevoegdheid voertuigen aan een
      keuring te onderwerpen worden verbonden en kunnen met betrekking tot die voorschriften regels worden vastgesteld.

      6 Het tarief voor het examen dat de natuurlijke persoon dient af te leggen om het in het derde lid bedoelde
      certificaat te verkrijgen, behoeft de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel85a
