  - number: '102'
    text: |-
      1 Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing
      in de *Staatscourant*. Tot dit toezicht kan behoren het steekproefsgewijs keuren van door een erkende natuurlijke
      persoon of rechtspersoon aangebrachte wijzigingen in de bouw of inrichting van voertuigen. Voorts kan tot het
      toezicht behoren het periodiek controleren van de organisatie van degene aan wie de erkenning is verleend alsmede
      het proces volgens hetwelk hij zijn werkzaamheden verricht.

      2 Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.

      3 Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop het toezicht wordt
      gehouden en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend en van de eigenaar
      of houder van het voertuig waarvoor een keuring wordt geëist. Deze regels kunnen inhouden dat een verscherpt
      toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit de erkenning voortvloeiende
      verplichtingen.

      4 De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie. In dat
      geval wordt de kennisgeving na daartoe strekkend verzoek van de belanghebbende in een beschikking vastgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel102
  - number: '103'
    text: |-
      1 De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie de erkenning is verleend, daarom verzoekt.

      2 De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:

      a. niet meer voldoet aan de voor de erkenning gestelde eisen,

      b. de verplichtingen, vervat in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] en
      [artikel 102, tweede lid][ref2], niet nakomt, of

      c. handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.

      3 De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel520
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel102
