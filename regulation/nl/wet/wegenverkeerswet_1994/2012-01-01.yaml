  - number: 129b
    text: |-
      Ten aanzien van de verwerkingen ten behoeve van het alcoholslotregister is de Dienst Wegverkeer de
      verantwoordelijke in de zin van [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
