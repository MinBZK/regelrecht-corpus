  - number: '38'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat bepaalde categorieën van kentekens slechts worden
      opgegeven aan bij die algemene maatregel van bestuur aan te wijzen personen of groepen van personen dan wel voor
      daarbij aan te wijzen voertuigen of groepen van voertuigen, zulks onder daarbij te stellen voorwaarden.

      2 Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel38
  - number: '40'
    text: |-
      1 Het kenteken dient behoorlijk zichtbaar op of aan het motorrijtuig of de aanhangwagen aanwezig te zijn.

      2 Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de inrichting, het aanbrengen en
      de verlichting van het kenteken en worden regels vastgesteld omtrent de kentekenplaat en de onderdelen daarvan,
      alsmede de daarop aan te brengen merken.

      3 Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het bepaalde krachtens het tweede
      lid.

      4 Voor overtreding van het eerste lid dan wel het bepaalde krachtens het tweede of derde lid zijn aansprakelijk:

      a. voor zover het betreft een motorrijtuig, de eigenaar of houder die het motorrijtuig op de weg laat staan of
      daarmee over de weg laat rijden, alsmede in het geval dat met dat motorrijtuig over de weg wordt gereden, de
      bestuurder, en

      b. voor zover het betreft een aanhangwagen, de eigenaar of houder die de aanhangwagen op de weg laat staan of deze
      met een motorrijtuig over de weg laat voortbewegen, alsmede in het geval dat de aanhangwagen met een motorrijtuig
      over de weg wordt voortbewogen, de bestuurder van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel40
  - number: '41'
    text: |-
      1 Het is verboden:

      a. op een motorrijtuig of een aanhangwagen enig teken of middel aan te brengen of te doen aanbrengen met het
      oogmerk de herkenning, daaronder begrepen de herkenning met behulp van technische voorzieningen, van het ingevolge
      [artikel 40][ref1] gevoerde kenteken te bemoeilijken;

      b. een motorrijtuig op de weg te laten staan of daarmee over de weg te rijden dan wel een aanhangwagen op de weg te
      laten staan of met een motorrijtuig over de weg voort te bewegen, wanneer op dat motorrijtuig of die aanhangwagen
      enig teken of middel is aangebracht, waardoor de herkenning, daaronder begrepen de herkenning met behulp van
      technische voorzieningen, van het ingevolge [artikel 40][ref2] gevoerde kenteken wordt bemoeilijkt;

      c. op een motorrijtuig of een aanhangwagen een teken, niet zijnde een ingevolge [artikel 36][ref3] aan de eigenaar
      of houder voor dat motorrijtuig of die aanhangwagen opgegeven kenteken, aan te brengen of te doen aanbrengen met
      het oogmerk dat teken te doen doorgaan voor een zodanig kenteken dan wel met de kennelijke bedoeling dat teken te
      doen doorgaan voor een overeenkomstig de daarvoor geldende voorschriften opgegeven buitenlands kenteken dan wel een
      met toepassing van [artikel 37, derde lid][ref4], opgegeven kenteken;

      d. een motorrijtuig op de weg te laten staan of daarmee over de weg te rijden dan wel een aanhangwagen op de
      weg te laten staan of met een motorrijtuig over de weg voort te bewegen, wanneer op dat motorrijtuig of die
      aanhangwagen een teken is aangebracht dat, niet zijnde een ingevolge [artikel 36][ref5] aan de eigenaar of houder
      voor dat motorrijtuig of die aanhangwagen opgegeven kenteken, door kan gaan voor een zodanig kenteken dan wel voor
      een overeenkomstig de daarvoor geldende voorschriften opgegeven buitenlands kenteken of een met toepassing van
      [artikel 37, derde lid][ref6], opgegeven kenteken;

      e. op een in het buitenland geregistreerd motorrijtuig of een in het buitenland geregistreerde aanhangwagen een
      teken, niet zijnde een aldaar voor dat voertuig of aan de eigenaar of houder daarvan opgegeven kenteken, aan te
      brengen of te doen aanbrengen met het oogmerk dat teken te doen doorgaan voor een zodanig kenteken;

      f. een in het buitenland geregistreerd motorrijtuig op de weg te laten staan of daarmee over de weg te rijden dan
      wel een in het buitenland geregistreerde aanhangwagen op de weg te laten staan of met een motorrijtuig over de weg
      voort te bewegen, wanneer op dat motorrijtuig of die aanhangwagen een teken is aangebracht dat, niet zijnde een in
      het buitenland voor dat voertuig of aan de eigenaar of houder daarvan opgegeven kenteken, door kan gaan voor een
      zodanig kenteken.

      2 Voor overtreding van het eerste lid, onderdelen b, d en f, zijn aansprakelijk:

      a. voor zover het betreft een motorrijtuig, de eigenaar of houder die het motorrijtuig op de weg laat staan of
      daarmee over de weg laat rijden, alsmede in het geval dat met dat motorrijtuig over de weg wordt gereden, de
      bestuurder, een en ander echter slechts indien de eigenaar, houder of bestuurder weet of redelijkerwijze kan
      vermoeden dat op het motorrijtuig een teken of middel als bedoeld in het eerste lid, onderdeel b, dan wel een teken
      als bedoeld in het eerste lid, onderdeel d of f, is aangebracht, en

      b. voor zover het betreft een aanhangwagen, de eigenaar of houder die de aanhangwagen op de weg laat staan of deze
      met een motorrijtuig over de weg laat voortbewegen, alsmede in het geval dat de aanhangwagen met een motorrijtuig
      over de weg wordt voortbewogen, de bestuurder van dat motorrijtuig, een en ander echter slechts indien de eigenaar,
      houder of bestuurder weet of redelijkerwijze kan vermoeden dat op de aanhangwagen een teken of middel als bedoeld
      in het eerste lid, onderdeel b, dan wel een teken als bedoeld in het eerste lid, onderdeel d of f, is aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
