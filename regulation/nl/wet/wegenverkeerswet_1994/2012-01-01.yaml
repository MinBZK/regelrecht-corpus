        hoofdstuk: IX
  - number: '52'
    text: |-
      1 Indien voor het voertuig waarvoor de afgifte van een kentekenbewijs wordt verlangd, een kentekenbewijs als
      bedoeld in [artikel 56][ref1] is afgegeven, kan de Dienst Wegverkeer verlangen dat, alvorens een kentekenbewijs
      wordt afgegeven, dat eerder afgegeven kentekenbewijs dient te worden ingeleverd.

      2 Aan de afgifte van een kentekenbewijs kunnen door de Dienst Wegverkeer voorschriften worden verbonden, zulks
      onder aantekening daarvan in het bewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel56
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '56'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '53'
    text: |-
      De Dienst Wegverkeer geeft bij de afgifte van een kentekenbewijs tevens een keuringsbewijs voor het betrokken
      voertuig af indien:

      a. het voertuig is onderworpen aan een onderzoek dat ten minste een controle inhoudt op de eisen, bedoeld in
      [artikel 75, eerste lid][ref1], en

      b. [artikel 72][ref2] voor dat voertuig geldt of binnen een jaar zal gaan gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel53
