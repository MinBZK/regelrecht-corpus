  - number: 70a
    text: |-
      1 De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is een of meer van de in [artikel 40, tweede lid][ref1], bedoelde bij de erkenning aangewezen merken aan
      te brengen.

      2 Het is verboden om zonder de in het eerste lid bedoelde erkenning de aldaar bedoelde merken aan te brengen.

      3 Bij ministeriële regeling worden voorschriften vastgesteld die aan de erkenning worden verbonden en worden met
      betrekking tot die voorschriften regels vastgesteld. Die regels hebben in ieder geval betrekking op:

      a. de fabricage en levering van kentekenplaten en onderdelen daarvan en de daarbij te volgen procedure;

      b. de registratie van gegevens met betrekking tot de ingekochte materialen, de productie, de af- en uitval, de
      voorraad en de aflevering van kentekenplaten en onderdelen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 70b
    text: |-
      1 De fabrikant van kentekenplaten is in geval van levering van kentekenplaten verplicht tot het vastleggen van
      gegevens omtrent: van:

      a. het betrokken kenteken;

      b. de aard en het nummer van het identiteitsdocument van degene door, respectievelijk namens wie de kentekenplaten
      worden aangevraagd, en

      c. het aantal afgegeven kentekenplaten.

      2 Indien de kentekenplaten worden aangevraagd namens een rechtspersoon of door een daartoe bij ministeriële
      regeling aangewezen erkend bedrijf als bedoeld in [artikel 62][ref1], worden in plaats van de gegevens, bedoeld in
      het eerste lid, onder b, vastgelegd de bij ministeriële regeling aangewezen gegevens.

      3 Indien bij de levering van kentekenplaten die door, respectievelijk namens een natuurlijk persoon zijn
      aangevraagd, een ander identiteitsdocument dan een rijbewijs of paspoort wordt overgelegd, wordt tevens vastgelegd
      de naam, de beginletters van de voornaam of voornamen en het adres van degene door, respectievelijk namens wie de
      kentekenplaten worden aangevraagd.

      4 De fabrikant verstrekt gegevens die zijn vastgelegd op grond van het eerste tot en met derde lid in een
      registratie, uitsluitend en desgevraagd aan de ambtenaren van de Dienst Wegverkeer, belast met het toezicht op
      de naleving van de uit de erkenning voortvloeiende verplichtingen, en aan de ambtenaren van politie belast met de
      handhaving van de uit de erkenning voortvloeiende verplichtingen en van de verboden, bedoeld in [artikel 41][ref2],
      voor zover deze gegevens noodzakelijk zijn voor de goede vervulling van hun taak.

      5 De vastgelegde gegevens worden gedurende één jaar na de vastlegging bewaard.

      6 Bij ministeriële regeling worden nadere regels vastgesteld omtrent de inrichting en het beheer van het register.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel41
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel70b
