        paragraaf: '2'
  - number: '86'
    text: |-
      1 De Dienst Wegverkeer onderwerpt ten minste drie van elke honderd voertuigen na een verrichte keuring
      steekproefsgewijs aan een herkeuring met het oog op het toezicht op:

      a. de juiste uitvoering van de keuring;

      b. het aan een keuring onderwerpen door daartoe bevoegde natuurlijke personen.

      2 De eigenaar of houder van een motorrijtuig of een aanhangwagen, waarvoor een herkeuring wordt geëist, is
      verplicht het voertuig op de plaats van de keuring beschikbaar te houden totdat de herkeuring heeft plaatsgevonden.
      Deze verplichting geldt voor een periode van ten hoogste 90 minuten na de in [artikel 79][ref1] bedoelde
      mededeling.

      3 Het keuringsrapport van een motorrijtuig of een aanhangwagen waarvoor een herkeuring wordt geëist wordt pas
      afgegeven op het moment dat de periode genoemd in het vorige lid is verstreken of nadat de herkeuring heeft
      plaatsgevonden.

      4 De geldigheid van het keuringsbewijs vervalt indien de eigenaar of houder niet voldoet aan de in het tweede lid
      bedoelde verplichtingen of indien het motorrijtuig of de aanhangwagen bij de herkeuring niet voldoet aan de eisen,
      bedoeld in [artikel 75, eerste lid][ref2].

      5 Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de Staatscourant.

      6 Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.

      7 Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop de steekproef wordt
      uitgevoerd, alsmede betreffende de verplichting tot medewerking daaraan van de eigenaar of houder. Deze regels
      kunnen inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of
      meer uit de erkenning voortvloeiende verplichtingen of in strijd met een of meer uit de bevoegdheid voertuigen aan
      een keuring te onderwerpen voortvloeiende verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel75
