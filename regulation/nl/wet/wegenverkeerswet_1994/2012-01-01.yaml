  - number: '161'
    text: |-
      1 De in [artikel 159, onderdeel a][ref1], bedoelde personen die bij de uitoefening van de bij of
      krachtens deze wet, krachtens [artikel 2 van de Wet op de identificatieplicht][ref2] dan wel krachtens
      [artikel 5:19, derde lid, van de Algemene wet bestuursrecht][ref3] aan hen verleende bevoegdheden de beschikking
      krijgen over een rijbewijs waarvan ingevolge een der [artikelen 130, tweede lid][ref4], of [164][ref5] de
      overgifte is gevorderd, waarvan ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref6]
      de inlevering is gevorderd of ten aanzien waarvan ingevolge een der [artikelen 120, derde lid][ref7],
      [123b, vierde lid][ref8], [124, vierde lid][ref9], [131, tweede lid, onderdeel b][ref10], [132, vijfde lid][ref11],
      [132b, tweede lid][ref12], en [134, vierde lid][ref13], of [180, vierde lid][ref14], van deze wet een verplichting
      tot inlevering bestaat, zijn bevoegd dat rijbewijs in te nemen en het door te geleiden naar het betrokken parket
      van het openbaar ministerie dan wel naar degene bij wie de houder dat rijbewijs had dienen in te leveren.

      2 De in [artikel 159, onderdeel a][ref15], bedoelde personen die bij de uitoefening van de bij of krachtens deze
      wet aan hen verleende bevoegdheden de beschikking krijgen over een rijbewijs dat zijn geldigheid heeft verloren
      ingevolge [artikel 123, eerste lid, aanhef en onderdeel d][ref16], zijn bevoegd dat rijbewijs in te nemen en door
      te geleiden naar de instantie die het heeft afgegeven.

      3 Voor de toepassing van het eerste en het tweede lid wordt onder een rijbewijs mede verstaan een rijbewijs,
      afgegeven door het daartoe bevoegde gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de
      houder in Nederland woonachtig is.

      4 Bij ministeriële regeling kunnen voorschriften worden vastgesteld ter uitvoering van het eerste, tweede en derde
      lid.


