  - number: 132e1
    text: |-
      1 Bij ministeriële regeling wordt bepaald wanneer een typegoedkeuring vervalt.

      2 Intrekking van de typegoedkeuring vindt plaats indien:

      a. de producent van het desbetreffende type alcoholslot daarom verzoekt, of

      b. de erkenning als bedoeld in [artikel 132f, eerste lid][ref1], door de Dienst Wegverkeer wordt ingetrokken.

      3 Indien de steekproefsgewijze keuring als bedoeld in [artikel 132e, eerste of vierde lid][ref2], daartoe
      aanleiding geeft, dan wel indien een typegoedkeuring wordt ingetrokken, bepaalt de Dienst Wegverkeer de gevolgen
      voor reeds ingebouwde alcoholsloten van dat type. Indien wordt besloten dat reeds ingebouwde alcoholsloten
      moeten worden vervangen, dan bepaalt de Dienst Wegverkeer tevens de termijn waarbinnen die vervanging moet zijn
      gerealiseerd.

      4 Vanaf de datum waarop de eisen waaraan alcoholsloten moeten voldoen, zijn aangepast, mogen alcoholsloten van
      een overeenkomstig de oude eisen goedgekeurd type in het kader van het alcoholslotprogramma nog worden ingebouwd
      gedurende een bij ministeriële regeling vastgestelde periode.

      5 Bij ministeriële regeling wordt vastgelegd met ingang van welk tijdstip na de aanpassing van de in het vierde lid
      bedoelde eisen alle alcoholsloten moeten voldoen aan de aangepaste eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
