  - number: 120a
    text: |-
      1 Het nieuwe of vervangende rijbewijs wordt niet uitgereikt indien zich tussen de aanvraag en de uitreiking één van
      de gevallen als bedoeld in [artikel 112, eerste lid][ref1], heeft voorgedaan, maar blijft bij degene die is belast
      met de afgifte van rijbewijzen.

      2 Het wordt niet uitgereikt indien tussen de aanvraag en de uitreiking omstandigheden bekend zijn geworden die,
      indien zij bekend waren geweest bij de aanvraag ertoe hadden geleid dat geen besluit van afgifte was genomen. Het
      nieuwe of vervangende rijbewijs blijft bij degene die is belast met de afgifte van rijbewijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel112
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel120a
