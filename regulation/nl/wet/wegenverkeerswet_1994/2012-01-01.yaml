  - number: 4a
    text: |-
      Er is een Dienst Wegverkeer, in het maatschappelijk verkeer aangeduid als RDW. De dienst bezit
      rechtspersoonlijkheid en is gevestigd te Zoetermeer.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4a
  - number: 4b
    text: |-
      1 De Dienst Wegverkeer is belast met de volgende taken:

      a. het in het kader van de toelating tot het verkeer op de weg verlenen van typegoedkeuringen voor voertuigen,
      systemen, onderdelen, technische eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers
      en passagiers, het verlenen van individuele goedkeuringen voor voertuigen, alsmede het intrekken van
      typegoedkeuringen,

      a1. het ter uitvoering van verdragen of besluiten van volkenrechtelijke organisaties of van één of meer
      instellingen van de Europese Unie, al dan niet gezamenlijk, verlenen van typegoedkeuringen voor voertuigen,
      systemen, onderdelen, technische eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers
      en passagiers,

      a2. het verlenen van toestemming om onderdelen of uitrustingsstukken te verkopen, te koop aan te bieden, of het in
      het verkeer brengen, alsmede het intrekken van toestemmingen,

      b. het houden van toezicht op het overeenstemmen van voertuigen, systemen, onderdelen, technische eenheden,
      uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers met het type waarvoor de
      goedkeuring is verleend en op het overeenstemmen van onderdelen en uitrustingsstukken waarvoor een toestemming is
      verleend met de verleende toestemming,

      b1. het houden van toezicht op het terugroepen van reeds in de handel gebrachte voertuigen, onderdelen of
      uitrustingsstukken door de fabrikant,

      b2. het in verband met het alcoholslotprogramma verlenen van typegoedkeuringen voor alcoholsloten en voor de
      productieprocessen van die alcoholsloten ingevolge [artikel 132e, eerste lid][ref1],

      b3. het ter uitvoering van verdragen of besluiten van volkenrechtelijke organisaties of van één of meer
      instellingen van de Europese Unie, al dan niet gezamenlijk, verlenen van typegoedkeuringen voor alcoholsloten en
      productieprocessen van die alcoholsloten,

      b4. het houden van toezicht op het overeenstemmen van de alcoholsloten met het type waarvoor de goedkeuring is
      verleend,

      b5. het verwerken van gegevens in verband met het alcoholslotprogramma,

      b6. het vaststellen en vastleggen van manipulatie van voertuigsystemen en het melden hiervan aan de bevoegde
      autoriteiten,

      c. het opgeven van kentekens voor motorrijtuigen en aanhangwagens en het ter zake van die opgaven afgeven
      van kentekenbewijzen, het schorsen van de geldigheid van kentekenbewijzen, het ongeldigverklaren van
      kentekenbewijzen, het geldig verklaren van kentekenbewijzen, alsmede het houden van toezicht als bedoeld in
      [artikel 37, vierde lid][ref2],

      d. het afgeven van keuringsrapporten voor motorrijtuigen en aanhangwagens,

      e. het behandelen van bezwaren tegen afgegeven keuringsrapporten,

      f. het in het kader van de toelating tot het verkeer op de weg verlenen van goedkeuringen voor motorrijtuigen en
      aanhangwagens waarvan de constructie is gewijzigd dan wel waarvan het kentekenbewijs is ingevorderd,

      g. het afgeven van rijbewijzen in de gevallen, bedoeld in [artikel 116, eerste lid][ref3], alsmede het
      ongeldigverklaren van rijbewijzen in de in deze wet bepaalde gevallen,

      h. het verwerken van gegevens met betrekking tot opgegeven kentekens, afgegeven kentekenbewijzen, afgegeven
      keuringsrapporten, krachtens [artikel 149a][ref4] verleende ontheffingen, afgegeven rijbewijzen , fietsen en de
      mobiele objecten, bedoeld in [artikel 70l, eerste lid][ref5], alsmede met betrekking tot rechterlijke uitspraken
      houdende ontzegging van de bevoegdheid tot het besturen van motorrijtuigen,

      i. het overeenkomstig de bij of krachtens deze wet vastgestelde bepalingen verstrekken van gegevens uit de in
      onderdeel h bedoelde registers alsmede het houden van toezicht als bedoeld in [artikel 45a, eerste lid][ref6],

      j. het verlenen van erkenningen als bedoeld in de [artikelen 62][ref7], [70a][ref8], [83][ref9] en [101][ref10],
      en het verlenen van de bevoegdheid voertuigen aan een keuring te onderwerpen als bedoeld in [artikel 85a][ref11]
      alsmede het schorsen, wijzigen en intrekken van erkenningen en van de bevoegdheid voertuigen aan een keuring te
      onderwerpen,

      j1: de bevoegdheid tot het aanwijzen van een technische dienst voor het uitvoeren van bepaalde tests ten
      behoeve van het verlenen van typegoedkeuringen of individuele goedkeuringen of voor het uitvoeren van bepaalde
      toezichtstaken,

      k. het houden van toezicht op de naleving van de verplichtingen die voortvloeien uit de in onderdeel j bedoelde
      erkenningen en van de bevoegdheid voertuigen aan een keuring te onderwerpen alsmede op de verplichtingen die
      voortvloeien uit de in onderdeel j1 bedoelde aanwijzing als technische dienst,

      l. het verlenen van ontheffingen als bedoeld in [artikel 149a][ref12],

      m. het opsporen van bij of krachtens deze wet strafbaar gestelde feiten, voor zover de ambtenaren van de Dienst
      Wegverkeer daarmee ingevolge [artikel 159][ref13] zijn belast, en

      n. het met inachtneming van het bepaalde in [artikel 4q][ref14] vaststellen van de tarieven, bedoeld in de
      [artikelen 22, eerste lid][ref15], [22a, eerste lid][ref16], [22b, tweede lid][ref17], [23, tweede lid][ref18],
      [23a, tweede lid][ref19], [25a, eerste lid][ref20], [25b, tweede lid][ref21][26, eerste lid][ref22],
      [26a, tweede lid][ref23], [29, tweede lid][ref24], 30, 31, [37, vierde lid][ref25],
      [43, zesde en zevende lid][ref26], [45a, derde lid][ref27], [48, eerste lid][ref28], [55, eerste lid][ref29],
      [63, eerste lid][ref30], [64, tweede lid][ref31], [67, eerste lid][ref32], [70, tweede lid][ref33],
      [70d, eerste lid][ref34], [70e, tweede lid][ref35], [70k, vierde en vijfde lid][ref36],
      [70l, vierde lid][ref37],[75, eerste lid][ref38], [80, eerste lid][ref39], [84, eerste lid][ref40],
      [86, vijfde lid][ref41], [90, vierde lid][ref42], [91, vierde lid][ref43], [99, eerste lid][ref44],
      [101, eerste lid][ref45], [102, tweede lid][ref46], [106, eerste lid][ref47], [106a, derde lid][ref48],
      jo. [101, eerste lid][ref49], respectievelijk jo. [102, eerste lid][ref50], [111, vijfde lid][ref51],
      [128, eerste lid][ref52], [132e, eerste en tweede lid][ref53], [132g, eerste lid][ref54], [132h, derde lid][ref55],
      [132l, eerste lid, en tweede lid, onderdeel f][ref56], [132m, vierde lid][ref57], [144, eerste lid][ref58], en
      [149a, vierde lid][ref59], alsmede het vaststellen van de wijze van betaling van deze tarieven,

      o. het sluiten van overeenkomsten met betrekking tot de productie van rijbewijzen, de aflevering ervan en het
      beheer van de daartoe benodigde voorzieningen;

      p. het attenderen van houders van een rijbewijs op het verloop van de geldigheidsduur.

      2 Voorts is de Dienst Wegverkeer belast met:

      a. de bij of krachtens andere wetten opgedragen taken, en

      b. andere door Onze Minister opgedragen taken.


