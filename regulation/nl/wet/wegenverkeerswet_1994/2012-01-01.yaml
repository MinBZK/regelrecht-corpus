  - number: '36'
    text: |-
      1 Aan de eigenaar of houder van een motorrijtuig of een aanhangwagen op de weg dient overeenkomstig bij algemene
      maatregel van bestuur vastgestelde regels door de Dienst Wegverkeer een kenteken voor dat voertuig te zijn
      opgegeven.

      2 Ter zake van de in het eerste lid bedoelde opgave dient overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels door de Dienst Wegverkeer een kentekenbewijs te zijn afgegeven aan de eigenaar of houder van
      het voertuig.

      3 Het kentekenbewijs dient:

      a. te voldoen aan de bij ministeriële regeling vastgestelde eisen inzake inrichting en uitvoering,

      b. zijn geldigheid niet te hebben verloren,

      c. niet te zijn ingevorderd, en

      d. behoorlijk leesbaar te zijn.

      4

      5 Motorrijtuigen en aanhangwagens dienen overeen te komen met de gegevens in het voor het betrokken voertuig
      afgegeven kentekenbewijs en met de gegevens die omtrent het voertuig zijn opgenomen in het kentekenregister, tenzij
      krachtens [artikel 71][ref1] een bepaalde afwijking van die gegevens is toegestaan.

      6 Voor overtreding van het eerste tot en met vijfde lid zijn aansprakelijk:

      a. voor zover het betreft een motorrijtuig, de eigenaar of houder die het motorrijtuig op de weg laat staan of
      daarmee over de weg laat rijden, alsmede in het geval dat met dat motorrijtuig over de weg wordt gereden, de
      bestuurder, en

      b. voor zover het betreft een aanhangwagen, de eigenaar of houder die de aanhangwagen op de weg laat staan of deze
      met een motorrijtuig over de weg laat voortbewegen, alsmede in het geval dat de aanhangwagen met een motorrijtuig
      over de weg wordt voortbewogen, de bestuurder van dat motorrijtuig.

      7 De in het derde lid, onderdeel *a*, bedoelde eisen kunnen mede dienstbaar zijn aan de heffing van de belasting
      van personenauto’s en motorrijwielen en van de motorrijtuigenbelasting.

      8 Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste en het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71
