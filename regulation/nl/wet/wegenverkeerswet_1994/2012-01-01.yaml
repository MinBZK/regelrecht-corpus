  - number: 124a
    text: |-
      1 Een overeenkomstig [artikel 151g, derde lid][ref1], op het rijbewijs vermeld getuigschrift van vakbekwaamheid of
      getuigschrift van nascholing en een in [artikel 151g, vierde lid][ref2], bedoeld certificaat, kan door de instantie
      die het getuigschrift onderscheidenlijk het certificaat heeft afgegeven ongeldig worden verklaard indien na afgifte
      blijkt dat:

      a. het getuigschrift onderscheidenlijk het certificaat is afgegeven op grond van door de houder verschafte onjuiste
      gegevens en het niet zou zijn afgegeven indien de onjuistheid van die gegevens ten tijde van de afgifte bekend zou
      zijn geweest;

      b. het getuigschrift onderscheidenlijk het certificaat kennelijk abusievelijk aan de houder is afgegeven.

      2 De ongeldigverklaring van het getuigschrift of certificaat is van kracht met ingang van de zevende dag na die
      waarop het besluit tot ongeldigverklaring aan de houder van het getuigschrift onderscheidenlijk het certificaat is
      bekend gemaakt.

      3 Zodra de ongeldigverklaring van een getuigschrift of van een certificaat van kracht is geworden, levert de houder
      van een getuigschrift het rijbewijs in bij de instantie die belast is met de afgifte van rijbewijzen en levert de
      houder van een certificaat dat document in bij de instantie die het ongeldig heeft verklaard.

      4 Onverminderd het eerste lid en [artikel 151g, vierde lid][ref3], verliest het certificaat zijn geldigheid:

      a. door het onbevoegd daarin aanbrengen van wijzigingen, of

      b. door het overlijden van de houder.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze van
      bekendmaking van de ongeldigverklaring van een getuigschrift of certificaat, de vernieuwing van rijbewijzen na
      ongeldigverklaring van het daarop vermelde getuigschrift en omtrent de wijze van inlevering van een ongeldig
      verklaard certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
