  - number: '169'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving
      van de bij of krachtens deze wet gestelde verplichtingen.

      2 De ambtenaren die een bevel hebben gegeven als bedoeld in [artikel 160, zesde lid][ref1], zijn bevoegd tot
      oplegging van een last onder bestuursdwang ter handhaving van het bevel.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel160
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel169
