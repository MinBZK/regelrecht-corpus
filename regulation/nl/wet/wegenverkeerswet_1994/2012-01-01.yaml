  - number: '20'
    text: |-
      Een belanghebbende kan tegen een verkeersbesluit tot plaatsing of verwijdering van verkeerstekens en onderborden of
      tot het treffen van maatregelen op of aan de weg ter regeling van het verkeer beroep instellen bij de rechtbank.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel20
  - number: 20a
    text: |-
      1 De grenzen van de bebouwde kom of kommen van een gemeente worden vastgesteld bij besluit van de gemeenteraad.

      2 Bij algemene maatregel van bestuur worden nadere regels inzake de vaststelling van bebouwde kommen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel20a
  - number: 20b
    text: |-
      1 Voorafgaande aan de toelating tot het verkeer op de weg kan Onze Minister een motorrijtuig met een door de
      constructie bepaalde maximumsnelheid van niet meer dan 25 km/h, uitgerust met een verbrandingsmotor met een
      cilinderinhoud van niet meer dan 50 cm3 of een elektromotor met een nominaal continu maximumvermogen van niet
      meer dan 4 kW, niet zijnde een gehandicaptenvoertuig, per type of individueel voertuig aanwijzen op grond van zijn
      veiligheidsaspecten, indien:

      a. de toelating overeenstemt met de in
      [artikel 2, eerste lid, onderdelen a en b, tweede lid en derde lid, onderdeel a][ref1], genoemde doeleinden; en

      b. er voor dit motorrijtuig niet een typegoedkeuring overeenkomstig in het kader van de Europese Unie tot stand
      gekomen voorschriften vereist is.

      2 Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: '21'
    text: |-
      1 Bij ministeriële regeling aan te wijzen categorieën van voertuigen, systemen, onderdelen, technische eenheden,
      uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers dienen te zijn goedgekeurd voor
      toelating tot het verkeer op de weg.

      2 De goedkeuring, bedoeld in het eerste lid, kan worden verleend als typegoedkeuring, dan wel, met betrekking tot
      voertuigen, als goedkeuring voor een individueel voertuig.

      3 Bij ministeriële regeling aan te wijzen productieprocessen van bepaalde categorieën voertuigen, systemen,
      onderdelen, technische eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers
      dienen te zijn goedgekeurd alvorens de producten voortkomend uit die productieprocessen worden toegelaten tot het
      verkeer op de weg.

      4 In afwijking van het eerste lid kunnen bij ministeriële regeling aan te wijzen categorieën van voertuigen,
      systemen, onderdelen, technische eenheden, uitrustingsstukken en voorzieningen ter bescherming van weggebruikers
      en passagiers worden aangewezen, waarvoor geen typegoedkeuring overeenkomstig in het kader van de Europese Unie tot
      stand gekomen voorschriften vereist is, worden toegelaten tot het verkeer op de weg zonder te zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel21
  - number: '22'
    text: |-
      1 Een typegoedkeuring wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze,
      van het daarvoor door deze dienst vastgestelde tarief door deze dienst verleend indien het voertuig, het systeem,
      het onderdeel, de technische eenheid, het uitrustingstuk of de voorziening ter bescherming van weggebruikers en
      passagiers waarvoor de goedkeuring wordt gevraagd, bij een door de dienst verrichte keuring heeft voldaan aan
      de bij ministeriële regeling vastgestelde eisen met betrekking tot de toelating tot het verkeer op de weg. Deze
      eisen kunnen betrekking hebben op de technische staat, de specificaties, de prestaties of de uitrusting van het
      voertuig, het systeem, het onderdeel, de technische eenheid, het uitrustingstuk of de voorziening ter bescherming
      van weggebruikers en passagiers.

      2 Met een typegoedkeuring wordt gelijkgesteld een typegoedkeuring:

      a. die is verleend door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een
      andere Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte en die is verleend
      overeenkomstig de op het betrokken voertuig, systeem, onderdeel, technische eenheid, uitrustingsstuk of voorziening
      ter bescherming van weggebruikers en passagiers betrekking hebbende, in het kader van de Europese Unie tot stand
      gekomen voorschriften, of die is verleend door het daartoe bevoegde gezag in Zwitserland indien dit voorvloeit
      uit de op 21 juni 1999 te Luxemburg tot stand gekomen Overeenkomst tussen de Europese Gemeenschap en de Zwitserse
      Bondsstaat inzake de wederzijdse erkenning van de overeenstemmingsbeoordeling (PbEG L 114);

      b. die is verleend door het daartoe bevoegde gezag in een Staat die partij is bij de Overeenkomst betreffende
      het aannemen van eenvormige technische voorschriften die van toepassing zijn op voertuigen op wielen,
      uitrustingsstukken en onderdelen die in een voertuig op wielen kunnen worden gemonteerd of gebruikt en is
      verleend overeenkomstig de voorwaarden voor wederzijdse erkenning van overeenkomstig deze voorschriften verleende
      goedkeuringen;

      c. als bedoeld in [artikel 22a, eerste lid][ref1].

      3 Bij ministeriële regeling kunnen regels worden vastgesteld betreffende de organisatie van de aanvrager, het
      proces volgens hetwelk de aanvrager zijn werkzaamheden verricht, het door de aanvrager voor de keuring ter
      beschikking stellen van voertuigen, systemen, onderdelen, technische eenheden, uitrustingstukken en voorzieningen
      ter bescherming van weggebruikers en passagiers, het door de aanvrager overleggen van bescheiden en verstrekken van
      inlichtingen ter zake van de keuring alsmede betreffende de wijze waarop de keuring wordt verricht.

      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot in het kader van een
      typegoedkeuringsprocedure op basis van in het kader van de Europese Unie tot stand gekomen voorschriften op de
      Dienst Wegverkeer of de fabrikant van een voertuig, systeem, onderdeel, technische eenheid, uitrustingstuk of
      voorziening ter bescherming van weggebruikers en passagiers rustende verplichtingen.

      5 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot op voertuigen, systemen, onderdelen,
      technische eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers, behorende
      tot een goedgekeurd type, aan te brengen keurmerken, aanduidingen of gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22a
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel22
