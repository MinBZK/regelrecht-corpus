  - number: '112'
    text: |-
      1 Onverminderd [artikel 111][ref1] wordt een rijbewijs niet afgegeven aan degene:

      a. aan wie de bevoegdheid tot het besturen van motorrijtuigen is ontzegd, voor de duur van de ontzegging;

      b. van wie ingevolge een der [artikelen 130, tweede lid][ref2], of [164][ref3] de overgifte van dat bewijs is
      gevorderd dan wel wiens rijbewijs is ingevorderd en aan wie dat bewijs niet is teruggegeven;

      c. ten aanzien van wie ingevolge [artikel 131, tweede lid, onderdeel a][ref4], de geldigheid van het rijbewijs is
      geschorst, voor de categorie of categorieën van motorrijtuigen waarop de schorsing betrekking heeft, voor de duur
      van de schorsing;

      d. van wie ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref5] de inlevering van
      het rijbewijs is gevorderd dan wel wiens rijbewijs krachtens die wet is ingenomen, of

      e. van wie is gebleken dat die houder is van een rijbewijs, afgegeven door het daartoe bevoegde gezag in een andere
      Lid-Staat van de Europese Gemeenschappen of in een andere Staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland, tenzij de afgifte van een rijbewijs plaatsvindt tegen overlegging van
      dat rijbewijs.

      2 Voor de toepassing van het eerste lid, onderdelen *b*, *c* en *d*, wordt onder rijbewijs mede verstaan een
      rijbewijs, afgegeven door het daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel130
