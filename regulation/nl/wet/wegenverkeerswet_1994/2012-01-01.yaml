  - number: '174'
    text: |-
      1 Indien ter zake van een overtreding van [artikel 40, eerste lid][ref1], proces-verbaal
      wordt opgemaakt door een ambtenaar, aangesteld voor de uitvoering van de politietaak,
      dan wel een op dat voorschrift betrekking hebbende gedraging, omschreven in de in
      [artikel 2, eerste lid, van de Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref2] bedoelde
      bijlage door hem wordt geconstateerd, begaan met een op de weg staand motorrijtuig, terwijl niet terstond blijkt
      wie de eigenaar of houder van dat motorrijtuig is, is de burgemeester bevoegd op verzoek van die ambtenaar dat
      motorrijtuig naar een door hem aangewezen plaats te doen overbrengen en in bewaring te doen stellen.

      2 Alvorens het in het eerste lid bedoelde verzoek te doen, kan de daar bedoelde ambtenaar door middel van een
      daartoe aan te brengen apparaat het rijden met het motorrijtuig voor ten hoogste twee dagen beletten. Het apparaat
      wordt binnen die termijn verwijderd, zodra bekend wordt wie de eigenaar of houder van het motorrijtuig is.

      3 De [artikelen 170, tweede lid, tweede en derde volzin, vierde, vijfde en zesde lid][ref3], [171][ref4],
      [172][ref5] en [173, eerste lid][ref6], van deze wet en de [artikelen 4:116][ref7], [4:118 tot en met 4:124][ref8],
      [5:10][ref9], [5:25, eerste en zesde lid][ref10], [5:29, tweede en derde lid][ref11], en
      [5:30, eerste, tweede, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref12] zijn van overeenkomstige
      toepassing.


