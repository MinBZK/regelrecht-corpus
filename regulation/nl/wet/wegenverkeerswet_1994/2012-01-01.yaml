  - number: 151d
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van de richtlijn vakbekwaamheid bestuurders
      regels worden gesteld omtrent:

      a. een stelsel van basiskwalificatie;

      b. een stelsel van nascholing.

      2 Bij de in het eerste lid bedoelde regels kan in elk geval worden bepaald dat:

      a. een bestuurder die het getuigschrift van vakbekwaamheid heeft behaald, bedoeld in richtlijn nr. 96/26/EG van
      de Raad van de Europese Unie van 29 april 1996 inzake de toegang tot het beroep van ondernemer van goederen-,
      respectievelijk personenvervoer over de weg, nationaal en internationaal, en inzake wederzijdse erkenning
      van diploma’s, certificaten en andere titels ter vergemakkelijking van de uitoefening van het recht van vrije
      vestiging van bedoelde vervoersondernemers (PbEG L 124), is vrijgesteld van bij die regels bepaalde examens tot het
      verkrijgen van het getuigschrift van vakbekwaamheid;

      b. een bestuurder die kan aantonen in Nederland een opleiding van ten minste zes maanden tot het verkrijgen van een
      getuigschrift van vakbekwaamheid te volgen, op Nederlands grondgebied voor ten hoogste drie jaar is vrijgesteld van
      de verplichting over een getuigschrift van vakbekwaamheid te beschikken.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel151d
  - number: 151e
    text: |-
      1 Toegang tot een examen gericht op het behalen van een getuigschrift van vakbekwaamheid of tot de opleiding
      gericht op het behalen van het getuigschrift van nascholing heeft degene die aan bij of krachtens algemene
      maatregel van bestuur gestelde eisen voldoet.

      2 Voor toegang tot een examen gericht op het behalen van een getuigschrift van vakbekwaamheid is het bezit van het
      overeenkomstige rijbewijs niet vereist.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel151e
  - number: 151f
    text: |-
      1 Een examen gericht op het behalen van de basiskwalificatie wordt afgelegd bij een bij ministeriële regeling
      aangewezen persoon of instelling, die onder zijn verantwoordelijkheid voor onderdelen van dat examen anderen kan
      inschakelen.

      2 Nascholing wordt georganiseerd door een door de aangewezen exameninstantie voor het verrichten van nascholing
      erkend opleidingscentrum.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de taken, bevoegdheden en werkwijze van de aangewezen exameninstantie;

      b. de wijze waarop erkenning als opleidingscentrum geschiedt;

      c. de eisen waaraan voldaan moet worden om de erkenning als opleidingscentrum te verkrijgen en te behouden.

      4 Nascholing georganiseerd door een erkend opleidingscentrum behoeft de certificering van de aangewezen
      exameninstantie.

      5 De in het vierde lid bedoelde certificering vindt plaats indien de nascholing voldoet aan de bij ministeriële
      regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel151f
  - number: 151g
    text: |-
      1 Een bestuurder behaalt de basiskwalificatie in Nederland indien:

      a. hij ingezetene is van een lidstaat van de Europese Unie en in Nederland zijn gewone verblijfplaats heeft, of

      b. hij ingezetene is van een land buiten de Europese Unie en werkzaam is voor een in Nederland gevestigde
      onderneming of beschikt over een tewerkstellingsvergunning als bedoeld in de [Wet arbeid vreemdelingen][ref1].

      2 Een bestuurder kan de nascholing in Nederland volgen indien hij in Nederland zijn gewone verblijfplaats heeft of
      in Nederland werkzaam is, dan wel in een andere lidstaat van de Europese Unie indien hij aldaar werkzaam is.

      3 Een bestuurder die in Nederland de basiskwalificatie behaalt of de nascholing met goed gevolg voltooit en
      houder is van een Nederlands rijbewijs ontvangt het daarbij behorende getuigschrift van vakbekwaamheid dan wel het
      getuigschrift van nascholing in de vorm van vermelding van de in de richtlijn vakbekwaamheid bestuurders bedoelde
      communautaire code naast de overeenkomstige rijbewijscategorieën op het rijbewijs.

      4 Een bestuurder die in Nederland de basiskwalificatie behaalt of de nascholing met goed gevolg voltooit en op dat
      moment geen houder is van een in Nederland afgegeven geldig rijbewijs ontvangt als bewijs daarvan een certificaat,
      met een geldigheidsduur gelijk aan die van een getuigschrift van vakbekwaamheid onderscheidenlijk een getuigschrift
      van nascholing, dat hij kan gebruiken om bij een bevoegde autoriteit van een lidstaat van de Europese Unie een
      verzoek in te dienen om op een door die lidstaat aan de desbetreffende bestuurder afgegeven of nog af te geven
      rijbewijs of kwalificatiekaart bestuurder de in de richtlijn vakbekwaamheid bestuurders bedoelde communautaire code
      te vermelden.

      5 Op een bij of krachtens algemene maatregel van bestuur te bepalen wijze wordt door de aangewezen exameninstantie
      in het in [artikel 126][ref2] bedoelde register geregistreerd dat een bestuurder die houder is van een Nederlands
      rijbewijs de basiskwalificatie heeft behaald onderscheidenlijk met goed gevolg de nascholing heeft voltooid.

      6 Een erkend opleidingscentrum meldt op een bij of krachtens algemene maatregel van bestuur te bepalen wijze aan de
      aangewezen exameninstantie welke onderdelen van de nascholing een bestuurder met goed gevolg heeft voltooid.

      7 Een in het derde lid bedoeld getuigschrift wordt afgegeven door de aangewezen exameninstantie en uitgereikt door
      degene die belast is met de afgifte van rijbewijzen.

      8 Het in het vierde lid bedoelde certificaat wordt afgegeven en uitgereikt door de aangewezen exameninstantie en
      door deze instantie geregistreerd in het in [artikel 126][ref3] bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel126
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel151g
