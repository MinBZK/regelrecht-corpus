  - number: '132'
    text: |-
      1 Behoudens de bij algemene maatregel van bestuur vastgestelde uitzonderingen is diegene verplicht zijn medewerking
      te verlenen aan de opgelegde maatregel, die zich:

      a. ingevolge [artikel 131, eerste lid, aanhef en onderdeel a][ref1], dient te onderwerpen aan een educatieve
      maatregel ter bevordering van de rijvaardigheid of geschiktheid,

      b. krachtens [artikel 118, derde lid][ref2], of ingevolge de
      [artikelen 131, eerste lid, aanhef en onderdeel b][ref3], of [134, zevende lid, onderdeel a][ref4], dient te
      onderwerpen aan een alcoholslotprogramma, of

      c. ingevolge [artikel 131, eerste lid, aanhef en onderdeel c][ref5], dient te onderwerpen aan een onderzoek naar de
      rijvaardigheid of geschiktheid.

      2 Bij gebreke van de in het eerste lid bedoelde medewerking besluit het CBR onverwijld tot ongeldigverklaring van
      het rijbewijs van de houder. Het CBR bepaalt daarbij op welke categorie of categorieën van motorrijtuigen waarvoor
      het rijbewijs is afgegeven, de ongeldigverklaring betrekking heeft. Bij ministeriële regeling wordt vastgesteld in
      welke gevallen sprake is van het niet verlenen van medewerking. Als het niet verlenen van de vereiste medewerking
      wordt mede aangemerkt het niet voldoen van de kosten verbonden aan het huren of kopen, het inbouwen, het uitlezen,
      het testen, het kalibreren, het onderhouden en het verwijderen van het alcoholslot op de in het huur- dan wel
      koopcontract van het alcoholslot aangegeven wijze of binnen de in dat huur- dan wel koopcontract aangegeven termijn
      of termijnen, alsmede het niet voldoen van de kosten binnen de termijn of termijnen die is of zijn aangegeven bij
      het besluit waarbij de verplichting tot een van de hierna genoemde maatregelen is opgelegd, of het niet voldoen van
      de kosten op de in dat besluit aangegeven wijze, van:

      a. de bij ministeriële regeling aangewezen educatieve maatregelen ter bevordering van de rijvaardigheid of
      geschiktheid,

      b. het alcoholslotprogramma, of

      c. het onderzoek naar de rijvaardigheid of geschiktheid, indien deze kosten op grond van
      [artikel 133, vierde lid][ref6], voor rekening van betrokkene komen.

      3 Het CBR doet van het besluit mededeling aan bij algemene maatregel van bestuur aangewezen personen of instanties.

      4 De ongeldigverklaring is van kracht met ingang van de zevende dag na die waarop het besluit tot
      ongeldigverklaring aan de houder van het rijbewijs is bekend gemaakt.

      5 De houder van het ongeldig verklaarde rijbewijs dient dat rijbewijs, zodra de ongeldigverklaring van kracht is
      geworden, in te leveren bij het CBR, ook indien de ongeldigverklaring niet alle categorieën betreft waarvoor het
      rijbewijs geldig was.

      6 Indien het rijbewijs dat voor ongeldigverklaring op grond van het tweede lid in aanmerking komt, zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur, plaatst het CBR een aantekening in het
      rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op de bij algemene
      maatregel van bestuur vastgestelde wijze dient aan te tonen dat hij, al naar gelang de aard van het onderzoek
      waarop het in [artikel 131, eerste lid][ref7], bedoelde besluit betrekking heeft, beschikt over de rijvaardigheid
      dan wel de lichamelijke en geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen van de
      categorie of categorieën waarop dat besluit betrekking heeft.

      7 Voor de toepassing van het tweede, vijfde en zesde lid wordt onder rijbewijs mede verstaan een rijbewijs,
      afgegeven door het daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.


