  - number: 132l
    text: |-
      1 De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door de dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend indien de natuurlijke persoon of
      rechtspersoon voldoet aan de bij ministeriële regeling vastgestelde eisen.

      2 De in het eerste lid bedoelde eisen betreffen onder meer:

      a. het contract dat is afgesloten met de erkenninghouder, bedoeld in [artikel 132f, tweede lid][ref1];

      b. de administratieve organisatie van de aanvrager;

      c. het proces volgens hetwelk de aanvrager zijn werkzaamheden verricht;

      d. de eisen waaraan de werkplaats of werkplaatsen van de aanvrager dient of dienen te voldoen, eisen ten aanzien
      van datacommunicatie hieronder begrepen;

      e. de wijze waarop de aanvrager er voor zorg draagt dat de personen die door hem belast zijn met het inbouwen,
      het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen of het verwijderen van alcoholsloten,
      alsmede de daarmee samenhangende werkzaamheden, adequaat zijn opgeleid en worden geïnformeerd over de laatste
      ontwikkelingen;

      f. de beschikbaarheid van een persoon of personen, die in het bezit is of zijn van een tegen betaling
      van een door de Dienst Wegverkeer vastgesteld tarief door die dienst afgegeven bewijs dat zij de in
      [artikel 132k, eerste lid][ref2], bedoelde werkzaamheden mogen verrichten;

      g. de aan- en afmelding bij de Dienst Wegverkeer van de personen die bevoegd zijn tot het inbouwen, het uitlezen,
      het testen, het kalibreren, het onderhouden, het vervangen of het verwijderen van alcoholsloten, en de daarmee
      samenhangende werkzaamheden.

      3 De bij ministeriële regeling gestelde eisen, bedoeld in het eerste lid, kunnen betrekking hebben op de op de voor
      de werkzaamheden benodigde apparatuur.

      4 Bij het inbouwen, het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen of het verwijderen van
      het alcoholslot worden de bij of krachtens algemene maatregel van bestuur aangegeven gegevens vastgelegd in het in
      [artikel 129a][ref3] bedoelde register.

      5 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de aanvraag van een erkenning.

      6 De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning is ingetrokken op grond van
      [artikel 132n, tweede lid][ref4], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel zes maanden ingeval reeds twee of meermalen een dergelijke aan de
      aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel129a
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel132n
