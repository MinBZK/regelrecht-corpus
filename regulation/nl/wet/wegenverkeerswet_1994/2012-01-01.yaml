  - number: 132g
    text: |-
      1 De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door de dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend indien de natuurlijke persoon of
      rechtspersoon voldoet aan de bij ministeriële regeling vastgestelde eisen.

      2 De in het eerste lid bedoelde eisen betreffen onder meer:

      a. de aanwezigheid van een mandaat namens de producent te mogen optreden;

      b. de aanwezigheid van een typegoedkeuring of een afschrift daarvan, afgegeven door de Dienst Wegverkeer van het
      door of namens de aanvrager geproduceerd alcoholslot;

      c. de aanwezigheid van een productieproces dat op basis van [artikel 132e, eerste of vijfde lid][ref1], door de
      Dienst Wegverkeer is goedgekeurd;

      d. het beschikken over een netwerk van werkplaatsen met een erkenning als bedoeld in [artikel 132k][ref2], waar
      het inbouwen, het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen of het verwijderen van
      alcoholsloten, alsmede de daarmee samenhangende werkzaamheden kunnen plaatsvinden. Dit netwerk dient een landelijke
      spreiding te hebben;

      e. de administratieve organisatie van de aanvrager;

      f. de wijze waarop de aanvrager ervoor zorg draagt dat de personen die de in [artikel 132k, eerste lid][ref3],
      bedoelde werkzaamheden verrichten of gaan verrichten, adequaat zijn opgeleid en periodiek worden bijgeschoold over
      de laatste ontwikkelingen, en dat ten bewijze hiervan een bewijs wordt afgegeven;

      g. andere instrumenten en hulpmiddelen die nodig zijn voor of gebruikt worden bij de uitvoering van de
      werkzaamheden als bedoeld in [artikel 132k, eerste lid][ref4].

      h. de maatregelen die zullen worden getroffen voor het geval de erkenning geheel wordt ingetrokken op het terrein
      van de beschikbaarstelling van gegevens betreffende het alcoholslot vereist voor het uitlezen, het testen,
      het kalibreren, het onderhouden of het verwijderen van alcoholsloten, alsmede voor de daarmee samenhangende
      werkzaamheden.

      3 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de aanvraag van de erkenning.

      4 De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning is ingetrokken op grond van
      [artikel 132i, tweede lid][ref5], binnen een direct aan de datum van indiening van de aanvraag voorafgaande periode
      van twaalf weken, dan wel zes maanden ingeval reeds twee of meermalen een dergelijke aan de aanvrager verleende
      erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
