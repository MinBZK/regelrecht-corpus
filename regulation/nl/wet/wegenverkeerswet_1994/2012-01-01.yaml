  - number: 132n
    text: |-
      1 De Dienst Wegverkeer trekt een erkenning als bedoeld in [artikel 132k][ref1], eerste lid in:

      a. indien degene aan wie de erkenning is verleend, daarom verzoekt;

      b. indien de erkenning, bedoeld in [artikel 132f, eerste lid][ref2], wordt ingetrokken.

      2 De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend niet
      meer voldoet aan de aan de erkenning gestelde eisen of voorschriften.

      3 De Dienst Wegverkeer kan in een geval als bedoeld in het tweede lid een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.

      4 Bij de schorsing of de intrekking van de erkenning in de gevallen, bedoeld in het eerste lid, onderdeel
      a, en het tweede lid, worden de lopende verplichtingen van de erkenninghouder betreffende het uitlezen, het
      testen, het kalibreren, het onderhouden en het verwijderen van het alcoholslot, alsmede de daarmee samenhangende
      informatieverplichtingen, voortvloeiend uit het bij of krachtens deze wet bepaalde, verricht door een door
      erkenninghouder als bedoeld in [artikel 132f, eerste lid][ref3], te bepalen natuurlijke persoon of rechtspersoon of
      instantie die beschikt over de in [artikel 132k, eerste lid][ref4], bedoelde erkenning.

      5 Bij intrekking van de erkenning, bedoeld in [artikel 132f, eerste lid][ref5], worden de lopende verplichtingen
      van de erkenninghouder betreffende het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen en
      het verwijderen van het alcoholslot, alsmede de daarmee samenhangende informatieverplichtingen, voortvloeiend uit
      het bij of krachtens deze wet bepaalde verricht door een daartoe door de Dienst Wegverkeer aangewezen instantie of
      instanties. [Artikel 132i, vijfde lid][ref6], is van overeenkomstige toepassing.

      6 De Dienst Wegverkeer kan in de door de dienst vastgestelde gevallen de in [artikel 132e][ref7] bedoelde
      keuringsinstelling in kennis stellen van een opgelegde schorsing of een ingetrokken erkenning.

      7 De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, bepalen dat een wachttijd geldt voor het
      aanvragen van een erkenning van maximaal 30 maanden.

      8 Bij ministeriële regeling kunnen nadere regels worden vastgesteld ter uitvoering van dit artikel.


