  - number: '10'
    text: |-
      1 Het is verboden op de weg een wedstrijd met voertuigen te houden of daaraan deel te nemen.

      2 Onder wedstrijd wordt voor de toepassing van dit artikel verstaan elk rijden met voertuigen ter vaststelling
      of vergelijking van prestaties hetzij van de deelnemers, hetzij van de voertuigen, hetzij van onderdelen daarvan,
      hetzij van bedrijfsstoffen.

      3 Als deelnemer wordt beschouwd de bestuurder van een voertuig waarmee aan een wedstrijd wordt deelgenomen, en de
      eigenaar of houder van een voertuig, die daarmee aan een wedstrijd doet of laat deelnemen.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel10
  - number: '11'
    text: Het is verboden opzettelijk wederrechtelijk een aan een ander toebehorend motorrijtuig op de weg te gebruiken.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel11
  - number: '12'
    text: |-
      1 Weggebruikers zijn verplicht gevolg te geven aan de aanwijzingen die door de in [artikel 159][ref1] bedoelde
      personen dan wel door andere bij algemene maatregel van bestuur aangewezen categorieën van personen ter zake van
      het verkeer op de weg worden gegeven.

      2 De in het eerste lid bedoelde aanwijzingen mogen slechts worden gegeven in het belang van de veiligheid op de
      weg, de instandhouding van de weg en de bruikbaarheid daarvan, of de vrijheid van het verkeer dan wel in het belang
      van met toestemming van Onze Minister verrichte onderzoeken ten behoeve van het verkeer.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het bepaalde in het eerste
      lid, alsmede met betrekking tot:

      a. de opleiding en examinering van verkeersregelaars en de afgifte, of weigering daarvan, en geldigheidsduur van
      examencertificaten en herhalingscertificaten;

      b. de erkenning, of de weigering daarvan, door Onze Minister van examencertificaten of herhalingscertificaten, de
      voorschriften die aan die erkenning kunnen worden verbonden en de intrekking van die erkenning;

      c. de opleiding van verkeersbrigadiers;

      d. de aanstelling van verkeersregelaars, de verlenging en intrekking van die aanstelling, de afgifte van het
      bevoegdheidsbewijs aan verkeersregelaars, de schorsing van de aanstelling van verkeersregelaars in gevallen waarin
      het verkeer in gevaar is of kan worden gebracht, alsmede de aanstelling van verkeersbrigadiers;

      e. de uitrusting, de verzekering, de wijze en plaats van taakuitoefening, en het toezicht op verkeersregelaars
      en verkeersbrigadiers.

      4 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref2] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref3] niet van toepassing op een verzoek tot aanstelling tot
      verkeersregelaar en verlenging van die aanstelling als bedoeld in het derde lid, onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
