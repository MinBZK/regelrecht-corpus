    text: |-
      De in [artikel 22, eerste lid][ref1], of [26, eerste lid][ref2], bedoelde goedkeuring wordt eerst
      verleend indien het voertuig bij de keuring tevens heeft voldaan aan de eisen, gesteld krachtens de
      [Wet inzake de luchtverontreiniging][ref3] en de [Wet geluidhinder][ref4].


