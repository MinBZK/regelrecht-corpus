  - number: 4m
    text: |-
      1 De raad van toezicht heeft een eigen secretariaat; de kosten daarvan komen ten laste van de Dienst Wegverkeer.

      2 Onze Minister kan aan de leden van de raad van toezicht, ten laste van de Dienst Wegverkeer, een vergoeding
      toekennen voor hun werkzaamheden.

      3 De leden van de raad van toezicht hebben aanspraak op vergoeding van de door hen in de uitoefening van hun
      functie gemaakte reis- en verblijfskosten.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4m
  - number: 4n
    text: De directie stelt bij reglement zijn werkwijze vast.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4n
  - number: 4o
    text: |-
      1 Het personeel van de Dienst Wegverkeer, de leden van de directie daaronder begrepen, is ambtenaar in de zin van
      de [Ambtenarenwet][ref1], behoudens degenen met wie een arbeidsovereenkomst is gesloten naar burgerlijk recht.

      2 De directie stelt bij reglement de regeling van de rechtstoestand van het personeel vast.

      3 Onverminderd hetgeen reeds bij of krachtens de wet is geregeld, geeft het reglement, bedoeld in het tweede lid,
      in ieder geval voorschriften betreffende de volgende onderwerpen:

      a. aanstelling;

      b. schorsing;

      c. ontslag;

      d. het onderzoek naar de geschiktheid en de bekwaamheid;

      e. bezoldiging;

      f. wachtgeld;

      g. diensttijden;

      h. verlof en vakantie;

      i. voorzieningen in verband met ziekte;

      j. bescherming bij de arbeid;

      k. woon-, verblijfs- en bereikbaarheidsverplichtingen;

      l. medezeggenschap;

      m. overige rechten en verplichtingen van het personeel;

      n. disciplinaire maatregelen;

      o. de wijze waarop met de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel overleg wordt
      gevoerd over aangelegenheden van algemeen belang voor de rechtstoestand en de bezoldiging van het personeel van de
      Dienst Wegverkeer;

      p. een geschillenregeling met betrekking tot de in de onderdelen *l* en *o* genoemde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4o
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: 4p
    text: |-
      De inkomsten van de Dienst Wegverkeer bestaan uit:

      a. de opbrengst van de heffingen;

      b. vergoedingen voor verrichte diensten;

      c. andere baten hoe ook genoemd.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4p
  - number: 4q
    text: |-
      1 De hoogte van de tarieven, bedoeld in [artikel 4b, eerste lid, onderdeel n][ref1], dient te worden gerelateerd
      aan de met de uitoefening van de taak gemoeide kosten.

      2 Het tarief, bedoeld in [artikel 48, eerste lid][ref2], voor de aanvraag van een bij algemene maatregel van
      bestuur aan te wijzen deel van het kentekenbewijs omvat mede een bij ministeriële regeling vastgesteld bedrag dat
      strekt ter dekking van de kosten van:

      a. het registreren van keuringsrapporten,

      b. het ongeldig verklaren van kentekenbewijzen,

      c. het verstrekken van gegevens uit het kentekenregister als bedoeld in [artikel 43, eerste en tweede lid][ref3],
      en bij algemene maatregel van bestuur te bepalen verstrekkingen,

      d. het behandelen van klachten en ingevolge de [Algemene wet bestuursrecht][ref4] ingediende bezwaarschriften en
      beroepsschriften gericht op het handelen van de Dienst Wegverkeer,

      e. het opsporen van bij of krachtens deze wet strafbaar gestelde feiten voor zover ambtenaren van de Dienst
      Wegverkeer daarmee ingevolge [artikel 159][ref5] zijn belast,

      f. het beheer en instandhouding van het in
      [artikel 13, tweede lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref6] bedoelde register,

      g. het verstrekken van gegevens uit het in onderdeel f genoemde register aan degenen die ingevolge de in
      [artikel 38, tweede lid van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref7] bedoelde algemene maatregel
      van bestuur niet tot betaling van het ter zake vastgestelde tarief zijn gehouden,

      h. de inspectie bedoeld in [artikel 45a, tweede lid][ref8], indien naar het oordeel van de Dienst Wegverkeer blijkt
      dat de gegevens juist in het kentekenregister zijn opgenomen dan wel de onjuistheid van een gegeven degene aan wie
      het kentekenbewijs voor het geïnspecteerde voertuig is afgegeven niet kan worden tegengeworpen, en

      i. het toezicht op het terugroepen door de fabrikant van reeds in de handel gebrachte voertuigen.


