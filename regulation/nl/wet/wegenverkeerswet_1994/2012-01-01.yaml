preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regels inzake het verkeer op de weg opnieuw vast
    te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      b. wegen: alle voor het openbaar verkeer openstaande wegen of paden met inbegrip van de daarin liggende bruggen en
      duikers en de tot die wegen behorende paden en bermen of zijkanten;

      c. motorrijtuigen: alle voertuigen, bestemd om anders dan langs spoorstaven te worden voortbewogen uitsluitend
      of mede door een mechanische kracht, op of aan het voertuig zelf aanwezig dan wel door elektrische tractie met
      stroomtoevoer van elders, met uitzondering van fietsen met trapondersteuning;

      d. aanhangwagen: voertuig dat kennelijk is bestemd om te worden voortbewogen door een motorrijtuig. In het bepaalde
      krachtens deze wet kan onder aanhangwagen tevens worden verstaan een voertuig dat door een ander voertuig wordt
      voortbewogen of kennelijk is bestemd om door een ander voertuig te worden voortbewogen;

      e. bromfiets:

      a. motorrijtuig op twee wielen, met een door de constructie bepaalde maximumsnelheid van niet meer dan 45 km/h,
      uitgerust met een verbrandingsmotor met een cilinderinhoud van niet meer dan 50 cm3 of een elektromotor met een
      nominaal continu maximumvermogen van niet meer dan 4 kW, niet zijnde een gehandicaptenvoertuig of een motorrijtuig
      als bedoeld in subonderdeel d;

      b. motorrijtuig op drie wielen, met een door de constructie bepaalde maximumsnelheid van niet meer dan 45 km/h,
      niet zijnde een gehandicaptenvoertuig of een motorrijtuig als bedoeld in subonderdeel d, uitgerust met:

      1°. een motor met elektrische ontsteking met een cilinderinhoud van niet meer dan 50 cm3,

      2°. een motor met inwendige verbranding en een netto maximumvermogen van niet meer dan 4 kW voor andere dan onder
      1° genoemde motoren, of

      3°. een elektromotor met een nominaal continu maximumvermogen van niet meer dan 4 kW; dan wel

      c. motorrijtuig op vier wielen, niet zijnde een gehandicaptenvoertuig of een motorrijtuig als bedoeld in
      subonderdeel d, met een door de constructie bepaalde maximumsnelheid van niet meer dan 45 km/h en een ledige massa
      van minder dan 350 kg, de massa van de batterijen in elektrische voertuigen niet inbegrepen, uitgerust met:

      1°. een motor met elektrische ontsteking met een cilinderinhoud van niet meer dan 50 cm3,

      2°. een motor met inwendige verbranding en een netto maximumvermogen van niet meer dan 4 kW voor andere dan onder
      1° genoemde motoren, of

      3°. een elektromotor met een nominaal continu maximumvermogen van niet meer dan 4 kW;

      d. een motorrijtuig als bedoeld in [artikel 20b][ref1].

      In ieder geval wordt als bromfiets aangemerkt een voertuig dat blijkens het afgegeven kentekenbewijs als bromfiets
      is aangeduid;

      ea. fietsen met trapondersteuning: fietsen die zijn voorzien van een elektrische hulpmotor met een nominaal continu
      vermogen van maximaal 0,25 kW en waarvan de aandrijfkracht geleidelijk vermindert en tenslotte wordt onderbroken
      wanneer het voertuig een snelheid van 25 km/h bereikt, of eerder, indien de bestuurder ophoudt met trappen;

      f. typegoedkeuring: goedkeuring van tot een bepaald type behorende voertuigen, voertuigonderdelen,
      uitrustingsstukken of voorzieningen ter bescherming van weggebruikers en passagiers;

      g. kenteken: kenteken als bedoeld in [artikel 36][ref2] of [artikel 37, derde lid][ref3];

      h. kentekenbewijs: kentekenbewijs als bedoeld in [artikel 36][ref4] dan wel een kentekenbewijs, afgegeven ter zake
      van de opgave van een kenteken als bedoeld in [artikel 37, derde lid][ref5];

      i. kentekenregister: register, bedoeld in [artikel 42][ref6];

      j. keuringsbewijs: keuringsbewijs als bedoeld in [artikel 72][ref7];

      k. keuringsrapport: keuringsbewijs of een beschikking tot weigering van de afgifte van een keuringsbewijs;

      l. rijbewijs: rijbewijs, bedoeld in [artikel 107][ref8];

      m. rijbewijzenregister: register, bedoeld in [artikel 126][ref9];

      n. bestuurder van een motorrijtuig: degene die het motorrijtuig bestuurt of degene die, overeenkomstig de bij
      algemene maatregel van bestuur gestelde voorwaarde, wordt geacht het motorrijtuig onder zijn onmiddellijk toezicht
      te doen besturen;

      o. houder van een motorrijtuig of een aanhangwagen: degene die het voertuig:

      1°. op grond van een overeenkomst van huurkoop onder zich heeft,

      2°. in vruchtgebruik heeft, of

      3°. anderszins, anders dan als eigenaar of bezitter, tot duurzaam gebruik onder zich heeft;

      p. verwerken van gegevens: verwerken als bedoeld in
      [artikel 1, onderdeel b, van de Wet bescherming persoonsgegevens][ref10];

      q. Dienst Wegverkeer: de in [artikel 4a][ref11] bedoelde dienst;

      r. het CBR: de Stichting Centraal Bureau Rijvaardigheidsbewijzen;

      s. goedkeuring van een productieproces: ter uitvoering van verdragen of van besluiten van volkenrechtelijke
      organisaties of van één of meer instellingen van de Europese Unie, al dan niet gezamenlijk, verleende goedkeuring
      van een productieproces van voertuigen, systemen, onderdelen, technische eenheden, uitrustingstukken en
      voorzieningen ter bescherming van weggebruikers en passagiers;

      t. fabrikant: persoon of instantie die tegenover een goedkeuringsinstantie verantwoordelijk is voor alle aspecten
      van een typegoedkeurings- of toestemmingsprocedure en instaat voor de overeenstemming van de productie met de
      verleende goedkeuring of toestemming;

      u. schadevoertuig: voertuig dat ten gevolge van een beschadiging niet langer deugdelijk van bouw en inrichting is;

      v. alcoholslot: het geheel van ademalcoholtester, startonderbreker en registratie-eenheid, dat in een motorrijtuig
      wordt ingebouwd, waardoor het motorrijtuig waarin het is ingebouwd alleen kan worden gestart nadat in de
      ademalcoholtester is geblazen en indien het daarin gemeten en weergegeven ademalcoholgehalte ligt onder de voor de
      betrokkene ingevolge [artikel 8, vierde lid, onderdeel b][ref12], geldende, wettelijke alcohollimiet;

      w. alcoholslotprogramma: het samenstel van de verplichting tot inbouw van een alcoholslot en de daarbij behorende
      registratie-eenheid in een door betrokkene gebruikt motorrijtuig, het periodiek laten uitlezen van de registratie-
      eenheid en het volgen van een begeleidingsprogramma;

      x. alcoholslotregister: het register als bedoeld in [artikel 129a][ref13].

      2 Indien de eigenaar van een motorrijtuig of een aanhangwagen niet tevens bezitter is, treedt de bezitter voor de
      toepassing van het bepaalde bij of krachtens deze wet voor de eigenaar in de plaats.

      3 Degene aan wie een kenteken is opgegeven voor een motorrijtuig of een aanhangwagen wordt, tenzij anders blijkt,
      voor de toepassing van het bepaalde bij of krachtens deze wet beschouwd als eigenaar of houder van dat motorrijtuig
      of die aanhangwagen.

      4 Voor de toepassing van de [hoofdstukken III tot en met V][ref14] van deze wet worden vennootschappen zonder
      rechtspersoonlijkheid mede als rechtspersoon aangemerkt.


