        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: '54'
    text: |-
      Onze Minister kan aan besturen van verenigingen met volledige rechtsbevoegdheid, die behartiging van
      verkeersbelangen ten doel hebben, de bevoegdheid verlenen tot het afgeven van internationale bewijzen voor
      motorrijtuigen en aanhangwagens, bedoeld in internationale overeenkomsten, ten behoeve van het verkeer met
      motorrijtuigen en aanhangwagens in het buitenland.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel54
  - number: '55'
    text: |-
      1 Op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door deze
      dienst vastgestelde tarief, geeft deze dienst overeenkomstig bij algemene maatregel van bestuur vastgestelde regels
      vervangende bewijzen af voor:

      a. kentekenbewijzen of delen daarvan, die versleten, geheel of ten dele onleesbaar, verloren geraakt of teniet
      gegaan zijn;

      b. kentekenbewijzen in geval van vermissing van de bijbehorende kentekenplaten.

      2 Het vervangende bewijs treedt in de plaats van het eerder afgegeven kentekenbewijs of deel daarvan en wordt
      niet afgegeven dan nadat het versleten of geheel of ten dele onleesbaar geworden kentekenbewijs of deel daarvan,
      waarvoor het wordt afgegeven, is ingeleverd bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel55
  - number: '56'
    text: |-
      In bij algemene maatregel van bestuur vast te stellen gevallen kan een kentekenbewijs met een beperkte
      geldigheidsduur worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel56
  - number: '57'
    text: |-
      1 Onverminderd [artikel 56][ref1] verliest een kentekenbewijs zijn geldigheid door:

      a.

      b. afgifte van een nieuw kentekenbewijs dan wel een vervangend kentekenbewijs;

      c. het onbevoegd daarin aanbrengen van wijzigingen;

      d. schorsing als bedoeld in [artikel 67, eerste lid][ref2], voor de duur van de schorsing;

      e. ongeldigverklaring.

      2 In de gevallen waarin overeenkomstig [artikel 55][ref3] een vervangend bewijs is afgegeven voor een deel van het
      kentekenbewijs, verliest het deel waarvoor dat vervangend bewijs is afgegeven, zijn geldigheid.

      3 De Dienst Wegverkeer kan verlangen dat een kentekenbewijs dat zijn geldigheid heeft verloren binnen een daarbij
      bepaalde termijn bij deze dienst dient te worden ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel55
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel57
