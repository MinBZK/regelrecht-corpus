  - number: '165'
    text: |-
      1 Indien een bij deze wet als misdrijf strafbaar gesteld feit wordt begaan door een bij de ontdekking van het
      feit onbekend gebleven bestuurder van een motorrijtuig, is de eigenaar of houder van dat motorrijtuig verplicht
      op vordering van een der in [artikel 159][ref1] bedoelde personen binnen een daarbij te stellen termijn, die ten
      minste achtenveertig uren bedraagt, de naam en het volledige adres van de bestuurder bekend te maken.

      2 Het eerste lid geldt niet, indien de eigenaar of houder niet heeft kunnen vaststellen wie de bestuurder was en
      hem daarvan redelijkerwijs geen verwijt kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel165
