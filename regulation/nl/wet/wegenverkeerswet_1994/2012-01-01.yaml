  - number: 151h
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent:

      a. de vermelding op het rijbewijs van de communautaire code, bedoeld in de richtlijn vakbekwaamheid bestuurders;

      b. het in overeenstemming met de richtlijn vakbekwaamheid bestuurders vastgestelde tijdschema dat een bestuurder
      moet volgen bij de nascholing;

      c. de certificering bedoeld in [artikel 151f, vijfde lid][ref1];

      d. het model voor een certificaat als bedoeld in [artikel 151g, vierde lid][ref2];

      e. de wijze waarop een bestuurder die in een van de andere lidstaten van de Europese Unie de basiskwalificatie
      heeft behaald of de nascholing met goed gevolg heeft voltooid door middel van de daarbij behorende bewijsstukken,
      afgegeven door bevoegde autoriteiten van die lidstaten, via de aangewezen exameninstantie een aanvraag kan indienen
      om in Nederland een getuigschrift als bedoeld in [artikel 151g, derde lid][ref3], te verkrijgen;

      f. de wijze waarop de bevoegde autoriteiten van de andere lidstaten van de Europese Unie via de aangewezen
      exameninstantie geautoriseerde informatie kunnen verkrijgen over de door een bestuurder in Nederland behaalde
      basiskwalificatie en over een door hem in Nederland geheel of gedeeltelijk met goed gevolg voltooide nascholing;

      g. het model voor een nationaal certificaat als bedoeld in [artikel 151c, vierde lid, onderdeel b][ref4], de
      afgifte en de kosten van een dergelijk certificaat en de wijze waarop de erkenning van nationale certificaten die
      zijn afgegeven door andere lidstaten van de Europese Unie tot stand komt;

      h. de mate waarin en de wijze waarop de aangewezen exameninstantie in verband met de haar in dit hoofdstuk
      opgedragen taken toegang heeft tot het in [artikel 126][ref5] bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151f
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
