  - number: '159'
    text: |-
      Met de opsporing van de feiten, strafbaar gesteld bij of krachtens deze wet, zijn belast:

      a. de in de [artikelen 141][ref1] en [142 van het Wetboek van Strafvordering][ref2] bedoelde personen;

      b. de bij algemene maatregel van bestuur aangewezen ambtenaren van de Rijksbelastingdienst, van de Rijks- en de
      provinciale waterstaat, van de Dienst Wegverkeer en van de verkeersinspecties, een en ander voor zover bij die
      algemene maatregel van bestuur is bepaald;

      c. de in de [artikelen 87][ref3] en [89 van de Wet personenvervoer 2000][ref4] bedoelde personen, voor zover het
      betreft de eisen die met betrekking tot voertuigen als bedoeld in die wet worden gesteld bij of krachtens deze wet.


