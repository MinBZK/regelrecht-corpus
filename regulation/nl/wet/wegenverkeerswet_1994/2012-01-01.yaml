  - number: 70c
    text: |-
      1 Na afloop van de termijn, bedoeld in [artikel 70b, vijfde lid][ref1], worden de daar bedoelde vastgelegde
      gegevens overgedragen aan de Dienst Wegverkeer.

      2 Uit de registratie worden door de Dienst Wegverkeer uitsluitend en desgevraagd aan de ambtenaren van politie
      belast met de handhaving van de uit de erkenning voortvloeiende verplichtingen en van de verboden, bedoeld in
      [artikel 41][ref2], gegevens verstrekt voor zover deze noodzakelijk zijn voor de goede vervulling van hun taak.

      3 De vastgelegde gegevens worden door de Dienst Wegverkeer maximaal vijf jaar na de overdracht, bedoeld in het
      eerste lid, bewaard.

      4 De Dienst Wegverkeer stelt ten aanzien van het verwerken van de persoonsgegevens als bedoeld in het eerste lid,
      een reglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70b
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel41
