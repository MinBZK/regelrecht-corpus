        artikel: 43c
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 43c
        hoofdstuk: IV
        paragraaf: '3'
  - number: 43c
    text: |-
      1 Een overheidsorgaan dat gerede twijfel heeft over de juistheid van een in het kentekenregister opgenomen
      authentiek gegeven, meldt die twijfel, onder opgave van redenen, aan de Dienst Wegverkeer.

      2 Indien een melding als bedoeld in het eerste lid betrekking heeft op een gegeven dat afkomstig is uit een
      andere basisregistratie zendt de Dienst Wegverkeer de melding door aan de beheerder van dat register, tenzij met
      het overheidsorgaan dat een melding als bedoeld in het eerste lid doet is afgesproken dat dit overheidsorgaan de
      melding rechtstreeks doet aan de beheerder van het register waaruit het authentieke gegeven afkomstig is.

      3 De Dienst Wegverkeer tekent na ontvangst van een melding als bedoeld in het eerste lid, op de door deze dienst te
      bepalen wijze, in het kentekenregister aan dat het desbetreffende gegeven «in onderzoek» is, tenzij het een melding
      betreft die op grond van het tweede lid wordt doorgezonden aan de beheerder van een andere basisregistratie.

      4 Indien een melding als bedoeld in het eerste lid betrekking heeft op een gegeven dat bij of krachtens deze wet
      als authentiek is aangewezen, besluit de Dienst Wegverkeer over wijziging van het gegeven en bericht deze dienst
      het overheidsorgaan dat de melding heeft gedaan onverwijld over deze beslissing.

      5 Indien het besluit, bedoeld in het vierde lid, leidt tot wijziging van het authentieke gegeven doet de Dienst
      Wegverkeer onverwijld mededeling aan degene op wie het authentieke gegeven betrekking heeft, dan wel aan degene aan
      wie het kentekenbewijs is afgegeven voor het motorrijtuig of de aanhangwagen waarop het desbetreffende authentieke
      gegeven betrekking heeft.

      6 De Dienst Wegverkeer verwijdert de aantekening dat een gegeven in onderzoek is wanneer het besluit omtrent
      wijziging onherroepelijk is.

      7 Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van dit artikel nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel43c
  - number: 43d
    text: |-
      1 Indien de Dienst Wegverkeer constateert dat een door deze dienst in het kentekenregister geplaatst gegeven
      onjuist of ten onrechte in het kentekenregister is opgenomen, wijzigt of verwijdert deze dienst dat gegeven.

      2 Indien de Dienst Wegverkeer constateert dat een gegeven ten onrechte niet in het kentekenregister is opgenomen,
      neemt deze dienst dat gegeven alsnog in het kentekenregister op.

      3 Van de beslissing tot wijzigen, verwijderen, dan wel alsnog opnemen van een authentiek gegeven in het
      kentekenregister doet de Dienst Wegverkeer onverwijld mededeling aan degene op wie het authentieke gegeven
      betrekking heeft, dan wel aan degene aan wie het kentekenbewijs is afgegeven voor het motorrijtuig of de
      aanhangwagen waarop het desbetreffende authentieke gegeven betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel43d
  - number: 43e
    text: |-
      1 Indien een belanghebbende gegronde redenen heeft om aan te nemen dat een gegeven dat bij of krachtens deze wet
      als authentiek is aangemerkt of een niet-authentiek gegeven onjuist of ten onrechte wel, dan wel ten onrechte niet
      in het kentekenregister is opgenomen, kan hij onder opgave van die redenen aan de Dienst Wegverkeer een verzoek
      doen tot wijziging, verwijdering of opneming van dat gegeven.

      2 De Dienst Wegverkeer beslist naar aanleiding van een verzoek als bedoeld in het eerste lid over wijziging,
      verwijdering of opneming van het betreffende gegeven en bericht de belanghebbende die het verzoek heeft gedaan over
      deze beslissing.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel43e
  - number: 43f
    text: |-
      Onverminderd [artikel 43c][ref1] zijn overheidsorganen gehouden om aan de Dienst Wegverkeer op de door deze dienst
      te bepalen wijze mededeling te doen van de hen in de uitoefening van hun functie ter kennis gekomen feiten, ingeval
      deze feiten aanleiding kunnen zijn om tot wijziging of aanvulling van de in het kentekenregister opgenomen gegevens
      over te gaan, dan wel anderszins van belang kunnen zijn voor de juistheid van deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43c
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel43f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 43c
        hoofdstuk: IV
        paragraaf: '3'
  - number: '44'
    text: |-
      1 De Dienst Wegverkeer neemt maatregelen met het oog op het waarborgen van de juistheid, de actualiteit en de
      volledigheid van het kentekenregister.

      2 De Dienst Wegverkeer laat ten minste eenmaal in de drie jaar een registeraccountant,
      dan wel een accountant die is ingeschreven in het register bedoeld in
      [artikel 36, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref1], een oordeel geven over de
      opzet en werking van het stelsel van interne beheersmaatregelen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitvoering van het eerste
      en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
  - number: '45'
    text: |-
      De Dienst Wegverkeer stelt ten aanzien van het verwerken van gegevens als bedoeld in [artikel 42][ref1] een
      reglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel42
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '42'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 45a
    text: |-
      1 Met het toezicht op het gebruik van uit het kentekenregister verstrekte gegevens zijn belast de bij besluit van
      de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.

      2 Indien de Dienst Wegverkeer gerede twijfel heeft over de juistheid van een gegeven uit het kentekenregister dat
      betrekking heeft op een motorrijtuig of aanhangwagen, kan deze dienst degene aan wie het kentekenbewijs voor het
      betreffende motorrijtuig of aanhangwagen is afgegeven gelasten dat voertuig ter inspectie aan de Dienst Wegverkeer
      ter beschikking te stellen.

      3 Bij of krachtens algemene maatregel van bestuur wordt bepaald in welke gevallen door de Dienst Wegverkeer een
      door deze dienst vastgesteld tarief ter zake van de kosten van toezicht als bedoeld in het eerste lid of van de
      inspectie bedoeld in het tweede lid in rekening wordt gebracht. Dit tarief wordt op door de Dienst Wegverkeer te
      bepalen wijze in rekening gebracht.

      4 Verstrekking van gegevens uit het kentekenregister kan achterwege worden gelaten indien naar het oordeel van
      de Dienst Wegverkeer sprake is van handelen in strijd met de doeleinden waarvoor dan wel de voorwaarden waaronder
      is verstrekt.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel45a
  - number: '46'
    text: |-
      1 Bij algemene maatregel van bestuur worden regels vastgesteld betreffende de met de registratie van kentekens
      samenhangende verplichtingen van degene:

      a. die de eigendom, het bezit of het houderschap van een motorrijtuig of een aanhangwagen, waarvoor nog geen
      kenteken is opgegeven, heeft verkregen;

      b. aan wie een kenteken is opgegeven;

      c. die de eigendom, het bezit of het houderschap van een motorrijtuig of een aanhangwagen, waarvoor een kenteken is
      opgegeven, heeft verkregen.

      2 Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel46
  - number: '47'
    text: Een kentekenbewijs bestaat uit een of meer bij algemene maatregel van bestuur aan te wijzen delen.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel47
  - number: '48'
    text: |-
      1 Een kentekenbewijs wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze,
      van het daarvoor door deze dienst vastgestelde tarief slechts afgegeven aan in Nederland woonachtige natuurlijke
      personen die de leeftijd van achttien jaren dan wel, indien de aanvraag betrekking heeft op een kentekenbewijs
      voor een bromfiets, de leeftijd van zestien jaren hebben bereikt en aan in Nederland gevestigde rechtspersonen,
      indien het motorrijtuig of de aanhangwagen waarvoor de afgifte wordt verlangd, overeenkomstig [artikel 22][ref1]
      of [26][ref2] is goedgekeurd voor toelating tot het verkeer op de weg en, indien na die toelating wijziging is
      aangebracht in de bouw of inrichting van dat voertuig, die wijziging, behoudens in het geval dat geen goedkeuring
      is vereist, overeenkomstig [artikel 99, eerste lid][ref3], of [100, eerste lid][ref4], is goedgekeurd voor
      toelating van het gewijzigde voertuig tot het verkeer op de weg.

      2 In bepaalde uitzonderingsgevallen kan door de Dienst Wegverkeer een kentekenbewijs worden afgegeven, indien ten
      aanzien van het motorrijtuig of de aanhangwagen, waarvoor de afgifte wordt verlangd, niet is voldaan aan het eerste
      lid.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat de ingevolge het eerste lid gestelde eisen aan de
      aanvrager van een kentekenbewijs niet gelden ten aanzien van de aanvrager van een kentekenbewijs, afgegeven ter
      zake van de opgave van een kenteken als bedoeld in [artikel 38][ref5].

      4 Indien een kentekenbewijs is afgegeven aan een in Nederland gevestigde rechtspersoon die niet behoeft te
      zijn ingeschreven in een daartoe bij de wet aangewezen register of waarvan de onderneming niet behoeft te zijn
      ingeschreven in het handelsregister, wordt degene die bij de aanvraag als gemachtigde van die rechtspersoon is
      opgetreden, voor de toepassing van het bepaalde bij of krachtens deze wet mede als houder van het motorrijtuig of
      de aanhangwagen aangemerkt in de zin van [artikel 1, eerste lid, onderdeel o][ref6].

      5 De in het vierde lid bedoelde gemachtigde dient in Nederland woonachtig te zijn en dient de leeftijd van achttien
      jaren te hebben bereikt.

      6 Ingeval de aanvrager van een kentekenbewijs voor een bromfiets de leeftijd heeft van zestien of zeventien jaar,
      wordt voor wat betreft de aanvraag de toestemming van diens wettelijke vertegenwoordiger verondersteld te zijn
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel99
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel100
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel38
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel1
