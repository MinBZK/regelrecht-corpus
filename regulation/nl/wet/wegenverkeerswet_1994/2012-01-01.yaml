  - number: 132m
    text: |-
      1 Met het toezicht op de naleving van de uit de erkenning, bedoeld in [artikel 132k, eerste lid][ref1],
      voortvloeiende verplichtingen zijn belast de bij besluit van de Dienst Wegverkeer aangewezen ambtenaren. Van een
      zodanig besluit wordt mededeling gedaan door plaatsing in de Staatscourant.

      2 Tot het in het eerste lid bedoelde toezicht kan behoren het periodiek controleren van de organisatie van de
      erkenninghouder, alsmede het uitvoeren van steekproeven op de wijze waarop de erkenninghouder, alsmede de bij
      hem in dienst zijnde personen die overeenkomstig [artikel 132l][ref2] zijn belast met de uitvoering van de
      werkzaamheden als bedoeld in [artikel 132k, eerste lid][ref3], die taken uitvoeren.

      3 De eigenaar of houder van een motorrijtuig dat voorwerp is van het in het tweede lid bedoelde toezicht is
      verplicht het motorrijtuig beschikbaar te houden op de plaats waar de in het eerste lid bedoelde werkzaamheden
      worden uitgevoerd. Deze verplichting geldt tot ten hoogste 90 minuten nadat de erkenninghouder de daarvoor in
      aanmerking komende gegevens heeft geregistreerd in het in [artikel 129a][ref4] bedoelde register.

      4 Het derde lid en het zesde lid, eerste volzin, zijn van overeenkomstige toepassing in geval het toezicht door de
      Dienst Wegverkeer plaatsvindt op grond van [artikel 158][ref5].

      5 De erkenninghouder is gehouden tot betaling, op door de Dienst Wegverkeer vastgestelde wijze, van het door deze
      dienst ter zake van de kosten van het toezicht vastgestelde tarief.

      6 Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop het toezicht wordt
      gehouden en de wijze waarop de steekproef wordt georganiseerd. Deze regels kunnen inhouden dat een verscherpt
      toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit de erkenning voortvloeiende
      de verplichtingen en op welke wijze dat verscherpte toezicht dan plaatsvindt.

      7 De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie. In dat
      geval wordt de kennisgeving na daartoe strekkend verzoek van de belanghebbende in een beschikking vastgelegd.


