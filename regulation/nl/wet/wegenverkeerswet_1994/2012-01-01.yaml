  - number: '122'
    text: |-
      1 Behoudens [artikel 123][ref1] of [123b][ref2] is een rijbewijs, afgegeven aan een aanvrager die de leeftijd van

      a. 60 jaren nog niet heeft bereikt, geldig voor de duur van tien achtereenvolgende jaren, gerekend vanaf de in het
      rijbewijs vermelde datum van afgifte;

      b. 60 jaren doch nog niet die van 65 jaren heeft bereikt, geldig vanaf de in het rijbewijs vermelde datum van
      afgifte tot de dag waarop hij de leeftijd van 70 jaren bereikt;

      c. 65 jaren heeft bereikt, geldig voor de duur van vijf achtereenvolgende jaren, gerekend vanaf de in het rijbewijs
      vermelde datum van afgifte.

      2 In afwijking van het eerste lid is een rijbewijs, afgegeven aan degene die naar verwachting op grond van
      zijn lichamelijke of geestelijke geschiktheid voor een beperkte termijn geschikt zal zijn voor het besturen van
      motorrijtuigen, geldig vanaf de in het rijbewijs vermelde datum van afgifte tot de dag waarop de termijn waarvoor
      de houder naar verwachting geschikt zal zijn voor het besturen van motorrijtuigen, verstrijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
