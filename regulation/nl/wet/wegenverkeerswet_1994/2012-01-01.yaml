  - number: '72'
    text: |-
      1 Voor een motorrijtuig of een aanhangwagen, waarvoor een kenteken is opgegeven dan wel dient te zijn opgegeven,
      dient een keuringsbewijs te zijn afgegeven.

      2 Het keuringsbewijs dient:

      a. te voldoen aan de door de Dienst Wegverkeer vastgestelde eisen inzake inrichting en uitvoering,

      b. zijn geldigheid niet te hebben verloren, en

      c. behoorlijk leesbaar te zijn.

      3 Voor overtreding van het eerste lid en het bepaalde bij of krachtens het tweede lid zijn aansprakelijk:

      a. voor zover het betreft een motorrijtuig, de eigenaar of houder, alsmede in het geval dat met dat motorrijtuig
      over de weg wordt gereden, de bestuurder, en

      b. voor zover het betreft een aanhangwagen, de eigenaar of houder, alsmede in het geval dat de aanhangwagen met een
      motorrijtuig over de weg wordt voortbewogen, de bestuurder van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel72
  - number: '73'
    text: |-
      1 [Artikel 72][ref1] geldt niet indien:

      a. voor het motorrijtuig of de aanhangwagen ter zake van een keuring die ingevolge een andere dan deze wet is
      voorgeschreven en blijkens aanwijzing bij ministeriële regeling ten minste een controle inhoudt op de eisen,
      bedoeld in [artikel 75, eerste lid][ref2], een keuringsdocument waarvan de geldigheidsduur niet is verstreken, is
      afgegeven, dan wel

      b. de geldigheid van het voor het betrokken voertuig afgegeven kentekenbewijs is geschorst overeenkomstig
      [paragraaf 6 van hoofdstuk IV][ref3].

      2 Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat:

      a. [artikel 72][ref4] niet geldt voor motorrijtuigen en aanhangwagens zolang gerekend vanaf het tijdstip
      waarop deze voertuigen voor het eerst op de weg zijn toegelaten, nog geen bij algemene maatregel van bestuur te
      bepalen termijn is verstreken, die voor verschillende groepen van voertuigen, alsmede voor voertuigen die voor,
      onderscheidenlijk na een bij algemene maatregel van bestuur te bepalen tijdstip voor het eerst op de weg zijn
      toegelaten verschillend kan worden vastgesteld; bij algemene maatregel van bestuur kan nader worden bepaald op welk
      tijdstip een voertuig geacht wordt voor het eerst op de weg te zijn toegelaten;

      b. [artikel 72][ref5] niet geldt voor nader aangewezen groepen van motorrijtuigen of aanhangwagens. Hieronder
      vallen in ieder geval aanhangwagens met een toegestane maximum massa van niet meer dan 3500 kg;

      c. in bepaalde uitzonderingsgevallen tijdelijk wordt of kan worden afgeweken van [artikel 72][ref6];

      d. [artikel 72][ref7] gedurende een nader te bepalen termijn na het tijdstip van verstrijken van de geldigheidsduur
      van het voor het voertuig afgegeven keuringsbewijs niet geldt voor het op de weg staan van dat voertuig.

      3 Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot het tweede lid, onderdelen
      *b* en *c*.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIV
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel72
