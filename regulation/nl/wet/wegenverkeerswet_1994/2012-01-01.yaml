  - number: 186a
    text: |-
      1 De verplichting, bedoeld in [artikel 151c, eerste lid][ref1], geldt voor een bestuurder van:

      a. een voertuig waarvoor een rijbewijs van een van de categorieën D1, E bij D1, D of E bij D, bedoeld in artikel 3
      van richtlijn nr. 91/439/EEG van de Raad van de Europese Gemeenschappen van 29 juli 1991 betreffende het rijbewijs
      (PbEG L 237), of een als gelijkwaardig erkend rijbewijs vereist is: met ingang van 10 september 2008;

      b. een voertuig waarvoor een rijbewijs van een van de categorieën C1, E bij C1, C of E bij C, bedoeld in artikel 3
      van de in onderdeel a genoemde richtlijn, of een als gelijkwaardig erkend rijbewijs vereist is: met ingang van 10
      september 2009.

      2 Een wijziging van de in het eerste lid, onderdeel a, genoemde richtlijn en van de in
      [artikel 151b, onderdeel a][ref2], bedoelde richtlijn vakbekwaamheid bestuurders gaat voor de toepassing van dit
      artikel gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151c
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel151b
