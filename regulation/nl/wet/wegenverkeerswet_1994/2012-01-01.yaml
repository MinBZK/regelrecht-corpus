  - number: 132i
    text: |-
      1 De Dienst Wegverkeer trekt de erkenning, bedoeld in [artikel 132f, eerste lid][ref1], in indien degene aan wie de
      erkenning is verleend, daarom verzoekt.

      2 De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend niet
      meer voldoet aan de voor de erkenning gestelde eisen of voorwaarden.

      3 De Dienst Wegverkeer kan in een geval als bedoeld in het tweede lid een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.

      4 In geval van schorsing van de erkenning stelt degene van wie de erkenning wordt geschorst in de bij ministeriële
      regeling aangegeven gevallen onverwijld de vereiste informatie en instrumenten benodigd voor het uitlezen, het
      testen, het kalibreren, het onderhouden en het verwijderen van de in [artikel 132f, eerste lid][ref2], bedoelde
      alcoholsloten ter beschikking van de Dienst Wegverkeer, alsmede de daartoe door de Dienst Wegverkeer aangewezen
      instantie of instanties.

      5 Degene van wie de erkenning wordt ingetrokken stelt onverwijld de vereiste informatie en instrumenten
      benodigd voor het uitlezen, het testen, het kalibreren, het onderhouden en het verwijderen van de in
      [artikel 132f, eerste lid][ref3], bedoelde alcoholsloten ter beschikking van de Dienst Wegverkeer, alsmede de
      daartoe door de Dienst Wegverkeer aangewezen instantie of instanties.

      6 De Dienst Wegverkeer stelt onverwijld het CBR in kennis van een opgelegde schorsing of een ingetrokken erkenning.

      7 De Dienst Wegverkeer kan in de door de dienst vastgestelde gevallen de keuringsinstelling, bedoeld in
      [artikel 132e, eerste lid][ref4], in kennis stellen van een opgelegde schorsing of een ingetrokken erkenning.

      8 De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, bepalen dat een wachttijd geldt voor het
      aanvragen van een erkenning van maximaal 30 maanden.

      9 Bij ministeriële regeling kunnen nadere regels worden vastgesteld ter uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
