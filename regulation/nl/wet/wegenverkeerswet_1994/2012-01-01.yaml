  - number: 25d
    text: |-
      1 De Dienst Wegverkeer trekt een goedkeuring van een productieproces in, indien degene aan wie de goedkeuring is
      verleend, daarom verzoekt.

      2 De Dienst Wegverkeer kan een goedkeuring van een productieproces intrekken, indien:

      a. degene aan wie de goedkeuring is verleend een voertuig, systeem, onderdeel, technische eenheid, uitrustingstuk
      of voorziening ter bescherming van weggebruikers en passagiers doet of laat doorgaan voor vervaardigd volgens
      een goedgekeurd productieproces, terwijl dat voertuig, dat systeem, dat onderdeel, die technische eenheid,
      dat uitrustingsstuk of die voorziening ter bescherming van weggebruikers en passagiers niet is vervaardigd
      overeenkomstig het goedgekeurde productieproces,

      b. degene aan wie de goedkeuring is verleend, de verplichting, vervat in [artikel 25b, tweede lid][ref1], niet
      nakomt,

      c. degene aan wie de goedkeuring is verleend, handelt in strijd met een of meer andere uit de goedkeuring
      voortvloeiende verplichtingen, of

      d. blijkt dat de goedkeuring ten onrechte is verleend.


