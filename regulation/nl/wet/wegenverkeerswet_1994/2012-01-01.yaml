  - number: '120'
    text: |-
      1 Degene die is belast met de afgifte van rijbewijzen geeft overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels een vervangend rijbewijs af voor:

      a. versleten of geheel of ten dele onleesbare rijbewijzen buiten de gevallen waarin daarvoor ingevolge
      [artikel 119][ref1] een nieuw rijbewijs wordt afgegeven;

      b. verloren geraakte of tenietgegane rijbewijzen buiten de gevallen waarin daarvoor ingevolge [artikel 119][ref2]
      een nieuw rijbewijs wordt afgegeven.

      2 Het vervangende rijbewijs treedt in de plaats van het eerder afgegeven rijbewijs en wordt niet afgegeven dan
      nadat het versleten of geheel of ten dele onleesbaar geworden rijbewijs waarvoor het wordt afgegeven, is ingeleverd
      bij degene die belast is met de afgifte van het vervangende rijbewijs.

      3 Indien de houder van een verloren geraakt rijbewijs waarvoor een vervangend rijbewijs is afgegeven, na de afgifte
      van het vervangende rijbewijs weer in het bezit komt van dat verloren geraakte rijbewijs, dient hij dat rijbewijs
      in te leveren bij degene die het vervangende rijbewijs heeft afgegeven.

      4 Voor de toepassing van het eerste tot en met het derde lid wordt onder rijbewijs mede verstaan een rijbewijs,
      afgegeven door het daartoe bevoegde gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere
      Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de
      houder in Nederland woonachtig is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel119
