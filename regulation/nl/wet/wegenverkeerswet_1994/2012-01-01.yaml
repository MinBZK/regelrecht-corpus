  - number: '106'
    text: |-
      1 De goedkeuring wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief door deze dienst verleend, indien het voertuig bij een door de dienst
      verrichte keuring heeft beantwoord aan de bij of krachtens deze wet vastgestelde eisen.

      2 Bij ministeriële regeling kunnen regels worden vastgesteld betreffende het door de aanvrager voor de keuring
      ter beschikking stellen van het voertuig, het door de aanvrager overleggen van bescheiden en verstrekken van
      inlichtingen ter zake van de keuring alsmede betreffende de wijze waarop de keuring wordt verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel106
  - number: 106a
    text: |-
      1 De goedkeuring van een schadevoertuig na ongeldigverklaring of invordering van het kentekenbewijs kan door de
      Dienst Wegverkeer worden verleend zonder dat de in [artikel 106][ref1] bedoelde keuring heeft plaatsgevonden,
      indien door een daartoe door de Dienst Wegverkeer erkende natuurlijk persoon of rechtspersoon wordt gewaarborgd dat
      het voertuig voldoet aan de eisen, bedoeld in [artikel 106, eerste lid][ref2].

      2 De erkenning geldt voor de in de erkenning aangegeven werkzaamheden ter zake van voertuigen die behoren tot een
      in de erkenning aangewezen groep. De erkenning kan gelden voor bepaalde of onbepaalde tijd.

      3 De [artikelen 100, derde lid][ref3], en [101 tot en met 103][ref4] zijn van overeenkomstige toepassing.


