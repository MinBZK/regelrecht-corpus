  - number: '163'
    text: |-
      1 Bij verdenking dat de bestuurder van een voertuig heeft gehandeld in strijd met [artikel 8][ref1],
      kan de opsporingsambtenaar hem bevelen zijn medewerking te verlenen aan een onderzoek als bedoeld in
      [artikel 8, tweede lid, onderdeel a][ref2], en [artikel 8, derde lid, onderdeel a][ref3].

      2 De bestuurder aan wie het in het eerste lid bedoelde bevel is gegeven, is verplicht ademlucht te blazen in een
      voor het onderzoek bestemd apparaat en gevolg te geven aan alle door de opsporingsambtenaar ten dienste van het
      onderzoek gegeven aanwijzingen.

      3 De in het tweede lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat het
      verlenen van medewerking aan een ademonderzoek voor hem om bijzondere geneeskundige redenen onwenselijk is.

      4 In het geval, bedoeld in het derde lid, dan wel indien de medewerking van de verdachte niet heeft geleid
      tot een voltooid ademonderzoek, kan de opsporingsambtenaar de verdachte vragen of hij zijn toestemming
      geeft tot het verrichten van een onderzoek als bedoeld in [artikel 8, tweede lid, onderdeel b][ref4], en
      [artikel 8, derde lid, onderdeel b][ref5]. Gelijke bevoegdheid heeft de opsporingsambtenaar, indien het vermoeden
      bestaat dat de verdachte onder invloed van een andere in [artikel 8, eerste lid][ref6], bedoelde stof dan
      alcoholhoudende drank verkeert.

      5 Indien de bestuurder zijn op grond van het vierde lid gevraagde toestemming niet verleent, kan de officier
      van justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen ambtenaren, aangesteld voor de uitvoering van de politietaak, hem bevelen zich te onderwerpen aan een
      bloedonderzoek.

      6 De bestuurder wie is bevolen zich aan een bloedonderzoek te onderwerpen, is verplicht aan dit bevel gevolg
      te geven en zijn medewerking te verlenen. Hem wordt door een arts zoveel bloed afgenomen als voor het onderzoek
      noodzakelijk is.

      7 De in het zesde lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat afname van
      bloed bij hem om bijzondere geneeskundige redenen onwenselijk is.

      8 De krachtens het zevende lid van de in het zesde lid genoemde verplichtingen vrijgestelde personen zijn
      verplicht mee te werken aan een door de officier van justitie, door een hulpofficier van justitie of door een
      van de daartoe bij regeling van Onze Minister van Justitie aangewezen ambtenaren, aangesteld voor de uitvoering
      van de politietaak, bevolen onderzoek teneinde op andere wijze dan door bloed- of ademonderzoek het gebruik van
      de in [artikel 8, eerste lid][ref7], bedoelde stoffen of het in [artikel 8, tweede lid, onderdeel b][ref8], en
      [artikel 8, derde lid, onderdeel b][ref9], genoemde gehalte vast te stellen.

      9 Indien de verdachte niet in staat is zijn wil kenbaar te maken, kan hem met toestemming van de officier
      van justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen ambtenaren, aangesteld voor de uitvoering van de politietaak, door een arts de in het zesde lid bedoelde
      hoeveelheid bloed worden afgenomen, tenzij aannemelijk is dat dit bij hem om bijzondere geneeskundige redenen
      onwenselijk is. Een onderzoek van het bloed vindt niet plaats dan nadat de verdachte in de gelegenheid is gesteld
      zijn toestemming daartoe te geven. Zo nodig kan hem overeenkomstig het vijfde lid worden bevolen zijn medewerking
      te verlenen. De verdachte aan wie een zodanig bevel is gegeven, is verplicht zijn medewerking te verlenen. Indien
      de verdachte weigert zijn medewerking te verlenen, wordt het bloedmonster vernietigd.

      10 Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de wijze van uitvoering van
      [artikel 160, vijfde lid][ref10], en van dit artikel. Deze regels kunnen mede betrekking hebben op de mogelijkheid
      tot het doen verrichten van een tegenonderzoek. Bij regeling van Onze Minister van Justitie worden in de bij die
      algemene maatregel van bestuur aangegeven gevallen voorschriften ter uitvoering van die regels vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
