    text: |-
      1 De Dienst Wegverkeer kan met het oog op het verlenen van een goedkeuring voor een individueel voertuig een
      technische dienst aanwijzen om namens hem bepaalde voor de goedkeuring noodzakelijke tests te verrichten, indien
      uit een door de Dienst Wegverkeer opgesteld beoordelingsverslag of uit een door een accrediteringsinstantie
      afgegeven accrediteringscertificaat blijkt dat deze dienst voldoet aan de daarvoor bij ministeriële regeling
      gestelde eisen.

      2 [Artikel 22b, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22b
