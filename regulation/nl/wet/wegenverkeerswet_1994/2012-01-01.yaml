  - number: '34'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regels worden vastgesteld, inhoudende een verbod om voertuigen,
      voertuigonderdelen, uitrustingsstukken en voorzieningen ter bescherming van weggebruikers en passagiers, die niet
      ingevolge [artikel 22][ref1], [25a][ref2] of [26][ref3] zijn toegelaten tot het verkeer op de weg, te vervaardigen,
      in te voeren, in voorraad te hebben, te koop aan te bieden, af te leveren of te vervoeren.

      2 Ter uitvoering van verdragen of van besluiten van volkenrechtelijke organisaties of van één of meer instellingen
      van de Europese Unie, al dan niet gezamenlijk, worden de in het eerste lid bedoelde regels vastgesteld bij regeling
      van Onze Minister.

      3 De in het eerste lid bedoelde regels betreffen het aanwijzen van de categorie van voertuigen, voertuigonderdelen,
      uitrustingsstukken of voorzieningen ter bescherming van weggebruikers en passagiers, waarop het verbod betrekking
      heeft, de handelingen waarop het verbod betrekking heeft alsmede de uitzonderingen op het verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel26
