        afdeling: '9'
  - number: '133'
    text: |-
      1 In de in [artikel 131, eerste lid, aanhef en onderdeel c][ref1], bedoelde gevallen legt het CBR bij het in
      dat artikel bedoelde besluit betrokkene de verplichting op zich te onderwerpen aan een onderzoek naar zijn
      rijvaardigheid of geschiktheid.

      2 Het CBR bepaalt de aard van het onderzoek en bepaalt door welke deskundige of deskundigen het onderzoek zal
      worden verricht.

      3 Het onderzoek kan in gedeelten plaatsvinden. Tijd en plaats van het onderzoek dan wel de delen daarvan worden
      overeenkomstig bij algemene maatregel van bestuur vastgestelde regels door het CBR vastgesteld.

      4 De kosten verbonden aan het opleggen van een onderzoek naar de rijvaardigheid of de geschiktheid komen ten laste
      van iedereen aan wie overeenkomstig het eerste lid de verplichting tot deelname aan zo’n onderzoek is opgelegd.
      De hoogte van deze kosten wordt bij ministeriële regeling vastgelegd. In geval van niet, niet geheel of niet op
      aangegeven wijze of binnen de aangegeven termijnen betalen van deze kosten vaardigt het CBR een dwangbevel uit
      aan de nalatige. Voor de toepassing van [titel 4.4. van de Algemene wet bestuursrecht][ref2] wordt het besluit
      als bedoeld in [artikel 131, eerste lid, aanhef en onderdeel b][ref3], aangemerkt als beschikking als bedoeld in
      [artikel 4.86 van de Algemene wet bestuursrecht][ref4].

      5 De kosten verbonden aan de uitvoering van het onderzoek, waarvan de hoogte bij ministeriële regeling wordt
      vastgesteld, komen in de bij ministeriële regeling bedoelde gevallen ten laste van betrokkene.

      6 Het onderzoek vangt zo spoedig mogelijk aan.

      7 De bevindingen van het onderzoek worden door de deskundige of de deskundigen zo spoedig mogelijk, doch uiterlijk
      acht weken na aanvang van het onderzoek, dan wel van het eerste gedeelte daarvan, schriftelijk meegedeeld aan het
      CBR.

      8 Het CBR kan in bijzondere gevallen toestaan dat door de deskundige of de deskundigen van de in het zesde lid
      bedoelde termijn wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel486
