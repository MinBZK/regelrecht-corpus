  - number: 25e
    text: |-
      1 Wanneer een fabrikant reeds verkochte, geregistreerde of in het verkeer gebrachte voertuigen, dan
      wel reeds verkochte onderdelen of uitrustingsstukken, waarvoor een overeenkomstig in het kader van
      de Europese Unie tot stand gekomen voorschriften afgegeven typegoedkeuring is verleend, op grond van
      [artikel 21, tweede lid, van de Warenwet][ref1] dient terug te roepen omdat het voertuig een ernstig gevaar vormt
      voor de verkeersveiligheid, de volksgezondheid of het milieu, stelt de fabrikant de goedkeuringsinstantie die de
      typegoedkeuring heeft verleend hiervan onmiddellijk in kennis.

      2 De fabrikant stelt de goedkeuringsinstantie maatregelen voor om het in het eerste lid bedoelde gevaar te
      neutraliseren.

      3 De Dienst Wegverkeer houdt toezicht op het terugroepen van voertuigen, onderdelen en uitrustingsstukken.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel25e
