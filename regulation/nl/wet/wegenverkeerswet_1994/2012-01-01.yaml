  - number: 132c
    text: |-
      1 Degene aan wie deelname aan het alcoholslotprogramma is opgelegd dient:

      a. overeenkomstig de bij of krachtens algemene maatregel van bestuur vastgestelde bepalingen een alcoholslot te
      doen inbouwen in ten minste één motorrijtuig dat voldoet aan de bij algemene maatregel van bestuur gestelde eisen;

      b. de aangegeven kosten op de aangegeven wijze te hebben betaald aan het CBR;

      c. het bij het besluit, bedoeld in [artikel 132b, eerste lid][ref1], meegezonden, door het CBR vastgestelde,
      aanmeldformulier te hebben teruggezonden aan het CBR, en

      d. overeenkomstig bij algemene maatregel van bestuur vastgestelde wijze de feitelijke beschikking te hebben
      gekregen over een nieuw rijbewijs, waarop voor de toepasselijke rijbewijscategorie, met uitzondering van de
      categorie AM, de bij ministeriële regeling vastgestelde codering voor het rijden met een alcoholslot is vermeld.

      2 Per motorrijtuig kan slechts één alcoholslot tegelijk zijn ingebouwd.

      3 Een ingebouwd alcoholslot kan slechts door één bestuurder worden gebruikt aan wie het CBR overeenkomstig de
      [artikelen 131, eerste lid, onderdeel b][ref2], en [132b, eerste lid][ref3], de verplichting heeft opgelegd tot
      deelname aan het alcoholslotprogramma.

      4 Onverminderd [artikel 132d, tweede of vierde lid][ref4], is de duur van het alcoholslotprogramma twee jaar. Deze
      termijn neemt een aanvang op de dag waarop degene aan wie de verplichting tot deelname aan het alcoholslotprogramma
      is opgelegd heeft voldaan aan het eerste lid, onderdeel d.

      5 Degene aan wie deelname aan het alcoholslotprogramma is opgelegd, is verplicht het door het CBR bepaalde
      begeleidingsprogramma te volgen en daartoe het alcoholslot periodiek te laten uitlezen bij een erkenninghouder als
      bedoeld in [artikel 132k, eerste lid][ref5]. Bij ministeriële regeling wordt de termijn vastgelegd waarbinnen de
      uitlezing uiterlijk dient plaats te vinden. In bij ministeriële regeling aangegeven gevallen kan het CBR in het
      kader van het begeleidingsprogramma een kortere termijn vaststellen.

      6 De kosten verbonden aan het opleggen van het alcoholslotprogramma komen ten laste van iedereen aan wie
      overeenkomstig [artikel 132b, eerste lid][ref6], de verplichting tot deelname aan het alcoholslotprogramma is
      opgelegd. De hoogte van deze kosten wordt bij ministeriële regeling vastgelegd. In geval van niet, niet geheel of
      niet op aangegeven wijze of binnen de aangegeven termijnen betalen van deze kosten vaardigt het CBR een dwangbevel
      uit aan de nalatige. Voor de toepassing van [titel 4.4. van de Algemene wet bestuursrecht][ref7] wordt het besluit
      als bedoeld in [artikel 131, eerste lid, aanhef en onderdeel b][ref8], aangemerkt als beschikking als bedoeld in
      [artikel 4.86 van de Algemene wet bestuursrecht][ref9].

      7 De kosten van verbonden aan:

      a. het uitvoeren van het alcoholslotprogramma, alsmede de kosten verbonden aan het beheer en het in
      stand houden van het alcoholslotregister en het verstrekken van gegevens uit dat register overeenkomstig
      [artikel 129d, eerste lid][ref10], en aan

      b. het huren dan wel kopen, het inbouwen, het uitlezen, het testen, het kalibreren het onderhouden en het
      verwijderen van het alcoholslot, komen ten laste van betrokkene. De hoogte van de in onderdeel a genoemde kosten
      die door het CBR worden geïnd, worden bij ministeriële regeling vastgesteld.

      8 De gegevens die periodiek worden uitgelezen uit het alcoholslot worden toegerekend aan degene aan wie deelname
      aan een alcoholslotprogramma is opgelegd.

      9 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het eerste, vijfde en zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
