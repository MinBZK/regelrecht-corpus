      Een wijziging van de richtlijn vakbekwaamheid bestuurders gaat voor de toepassing van [hoofdstuk VIIA][ref1] gelden
      met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


