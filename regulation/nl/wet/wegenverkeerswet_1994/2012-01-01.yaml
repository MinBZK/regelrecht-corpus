  - number: '110'
    text: |-
      1 Motorrijtuigen mogen slechts worden bestuurd door personen die de leeftijd van achttien jaren of, voor zover
      het betreft motorrijtuigen, al dan niet met aanhangwagen, die zijn ingericht voor het vervoer van meer dan acht
      personen, de bestuurder daaronder niet begrepen, de leeftijd van eenentwintig jaren hebben bereikt.

      2 Bij algemene maatregel van bestuur kan een lagere minimumleeftijd dan die in het eerste lid genoemd, worden
      vastgesteld voor het besturen van bromfietsen, gehandicaptenvoertuigen, landbouw- of bosbouwtrekkers en
      motorrijtuigen met beperkte snelheid, niet zijnde stoom- en motorwalsen.

      3 Het eerste lid geldt niet voor degene aan wie rijonderricht wordt gegeven in het kader van een opleiding voor
      beroepschauffeur, mits is voldaan aan de bij algemene maatregel van bestuur gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel110
  - number: 110a
    text: |-
      1 Bij algemene maatregel van bestuur worden eisen vastgesteld met betrekking tot motorrijtuigen waarmee:

      a. rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven;

      b. in het kader van een door of vanwege de overheid ingesteld onderzoek naar de rijvaardigheid of geschiktheid een
      rijproef wordt afgelegd.

      2 Bij ministeriële regeling kunnen nadere regels ter uitvoering van het eerste lid worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 110b
    text: |-
      1 Het is degene die rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] geeft, verboden
      zodanig rijonderricht te geven indien:

      a. het motorrijtuig waarmee rijonderricht wordt gegeven, niet voldoet aan de daaraan ingevolge [artikel 110a][ref2]
      gestelde eisen;

      b. degene aan wie rijonderricht wordt gegeven, de leeftijd van achttien jaren of, voor zover het betreft
      motorrijtuigen, al dan niet met aanhangwagen, die zijn ingericht voor het vervoer van meer dan acht personen,
      de bestuurder daaronder niet begrepen, de leeftijd van eenentwintig jaren, dan wel, voor zover het bromfietsen
      betreft, de leeftijd van zestien jaren nog niet heeft bereikt;

      c. niet wordt voldaan aan de overigens bij algemene maatregel van bestuur ten aanzien van het geven van
      rijonderricht gestelde eisen.

      2 Het eerste lid, aanhef en onderdeel b, geldt niet voor zover het rijonderricht betreft dat plaatsvindt in het
      kader van een opleiding voor beroepschauffeur, mits is voldaan aan de bij algemene maatregel van bestuur gestelde
      voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0006073
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel110a
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel110b
    references:
      - id: ref1
        bwb_id: BWBR0006073
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 110a
        hoofdstuk: VI
        afdeling: '2'
  - number: '111'
    text: |-
      1 Een rijbewijs wordt op aanvraag en tegen betaling van het daarvoor vastgestelde tarief, slechts afgegeven aan
      degene die:

      a. de leeftijd van achttien jaren of, voor zover het betreft een rijbewijs voor het besturen van motorrijtuigen, al
      dan niet met aanhangwagen, die zijn ingericht voor het vervoer van meer dan acht personen, de bestuurder daaronder
      niet begrepen, de leeftijd van eenentwintig jaren heeft bereikt, dan wel, indien de aanvraag betrekking heeft op
      afgifte van een rijbewijs dat geldig is voor het besturen van bromfietsen, de leeftijd van zestien jaren heeft
      bereikt en

      b. blijkens een overeenkomstig bij algemene maatregel van bestuur vastgestelde regels door of vanwege de overheid
      ingesteld onderzoek dan wel blijkens een eerder aan hem afgegeven rijbewijs of een hem door het daartoe bevoegde
      gezag buiten Nederland afgegeven rijbewijs dat voldoet aan de bij algemene maatregel van bestuur vastgestelde
      eisen, beschikt over een voldoende mate van rijvaardigheid en geschiktheid, dan wel, indien de aanvraag betrekking
      heeft op afgifte van een rijbewijs dat geldig is voor het besturen van bromfietsen, over een voldoende mate van
      rijvaardigheid.

      2 De aanvrager van een rijbewijs dient zich zowel bij de indiening van de aanvraag als bij de uitreiking
      van het rijbewijs te identificeren met een op zijn naam gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3° van de Wet op de identificatieplicht][ref1], een geldig rijbewijs,
      dan wel een eerder aan hem afgegeven rijbewijs dat zijn geldigheid heeft verloren door het verstrijken van
      de geldigheidsduur. Degene ten aanzien van wie een onderzoek als bedoeld in het eerste lid, onderdeel b,
      wordt ingesteld, dient zich te identificeren met een op zijn naam gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3° van de Wet op de identificatieplicht][ref2], een geldig rijbewijs
      dan wel een eerder aan hem afgegeven rijbewijs dat zijn geldigheid heeft verloren door het verstrijken van de
      geldigheidsduur.

      3 Aan degene die vreemdeling in de zin van de [Vreemdelingenwet 2000][ref3] is, en geen onderdaan van een Lid-
      Staat van de Europese Gemeenschappen of een andere Staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of Zwitserland, wordt een rijbewijs slechts afgegeven indien hij rechtmatig in Nederland
      verblijft als bedoeld in [artikel 8, onder a tot en met d en l van die wet][ref4]. Voor de uitvoering hiervan is de
      korpschef in de zin van de [Vreemdelingenwet 2000][ref5] verplicht aan degene die is belast met de afgifte van het
      rijbewijs, kosteloos de noodzakelijke opgaven en inlichtingen te verstrekken.

      4 Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid, onderdeel *b*.

      5 In de gevallen waarin het rijbewijs overeenkomstig [artikel 116][ref6] wordt afgegeven door de burgemeester
      dan wel de aanvraag overeenkomstig het bepaalde krachtens [artikel 113, eerste lid][ref7], wordt ingediend bij de
      burgemeester, wordt het in het eerste lid bedoelde tarief vastgesteld bij plaatselijke verordening. In de overige
      gevallen worden het tarief en de wijze van betaling daarvan vastgesteld door de Dienst Wegverkeer.

      6 Voor zover dit noodzakelijk is ten behoeve van het onderzoek naar de rijvaardigheid en geschiktheid, bedoeld
      in het eerste lid, onder b, worden door het met dat onderzoek belaste gezag persoonsgegevens betreffende iemands
      rijvaardigheid en gezondheid verwerkt.


