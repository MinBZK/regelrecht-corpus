  - number: '91'
    text: |-
      1 Tegen een beschikking tot afgifte van een keuringsbewijs kan een belanghebbende bezwaar maken of administratief
      beroep instellen bij de Dienst Wegverkeer.

      2 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] kan tegen een beschikking tot afgifte
      van een keuringsbewijs bezwaar worden gemaakt of administratief beroep worden ingesteld gedurende een bij algemene
      maatregel van bestuur te stellen termijn.

      3 Het bezwaar of administratief beroep wordt slechts in behandeling genomen indien het voertuig op een door de
      Dienst Wegverkeer bepaalde plaats ter beschikking wordt gesteld ten behoeve van een onderzoek door een door de
      Dienst Wegverkeer aangewezen deskundige.

      4 In afwijking van de [artikelen 7:15][ref2] en [7:28 van de Algemene wet bestuursrecht][ref3] dient bij de
      indiening van het bezwaar- of beroepschrift een bedrag ter vergoeding van de aan het onderzoek verbonden kosten te
      worden betaald. De hoogte van het bedrag en de wijze van betaling worden vastgesteld door de Dienst Wegverkeer.

      5 Degene die de beschikking tot afgifte van een keuringsbewijs heeft gegeven, wordt in de gelegenheid gesteld bij
      het onderzoek aanwezig te zijn.

      6 Indien het voertuig volgens het oordeel van de deskundige ten tijde van de keuring op grond waarvan het
      keuringsbewijs is afgegeven, redelijkerwijze niet aan de keuringseisen kan hebben voldaan, daarbij in het
      bijzonder gelet op de termijn die is verstreken tussen de keuring en het onderzoek, verklaart de Dienst Wegverkeer
      het voor het voertuig afgegeven keuringsbewijs alsnog ongeldig en wordt het in het vierde lid bedoelde bedrag
      terugbetaald aan de indiener van het bezwaar- of beroepschrift. Is in dit geval de beschikking tot afgifte van
      een keuringsbewijs gegeven door een erkende natuurlijke persoon of rechtspersoon, dan is deze vorenbedoeld bedrag
      verschuldigd aan de Dienst Wegverkeer en gehouden dit te betalen op de door deze dienst vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel715
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel728
