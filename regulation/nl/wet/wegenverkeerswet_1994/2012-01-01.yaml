  - number: 87a
    text: |-
      1 De Dienst Wegverkeer trekt de bevoegdheid voertuigen aan een keuring te onderwerpen in, indien degene aan wie die
      bevoegdheid is verleend, daarom verzoekt.

      2 De Dienst Wegverkeer kan de bevoegdheid voertuigen aan een keuring te onderwerpen intrekken of de daaraan
      verbonden voorschriften wijzigen, indien degene aan wie die bevoegdheid is verleend:

      a. niet meer voldoet aan de voor de bevoegdheid voertuigen aan een keuring te onderwerpen gestelde eisen,

      b. in strijd met de regels, bedoeld in [artikel 76, derde lid][ref1], een voertuig aan een onderzoek onderwerpt,

      c. handelt in strijd met een of meer andere uit de bevoegdheid voertuigen aan een keuring te onderwerpen
      voortvloeiende verplichtingen.

      3 De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, onderdelen a en c, de bevoegdheid voertuigen
      aan een keuring te onderwerpen schorsen voor een door deze dienst daarbij vast te stellen termijn die ten hoogste
      twaalf weken bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel76
