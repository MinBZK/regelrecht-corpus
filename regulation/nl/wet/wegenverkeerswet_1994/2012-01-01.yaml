  - number: '5'
    text: |-
      Het is een ieder verboden zich zodanig te gedragen dat gevaar op de weg wordt veroorzaakt of kan worden veroorzaakt
      of dat het verkeer op de weg wordt gehinderd of kan worden gehinderd.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel5
  - number: '6'
    text: |-
      Het is een ieder die aan het verkeer deelneemt verboden zich zodanig te gedragen dat een aan zijn schuld te wijten
      verkeersongeval plaatsvindt waardoor een ander wordt gedood of waardoor een ander zwaar lichamelijk letsel wordt
      toegebracht of zodanig lichamelijk letsel dat daaruit tijdelijke ziekte of verhindering in de uitoefening van de
      normale bezigheden ontstaat.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel6
  - number: '7'
    text: |-
      1 Het is degene die bij een verkeersongeval is betrokken of door wiens gedraging een verkeersongeval is
      veroorzaakt, verboden de plaats van het ongeval te verlaten indien:

      a. bij dat ongeval, naar hij weet of redelijkerwijs moet vermoeden, een ander is gedood dan wel letsel of schade
      aan een ander is toegebracht;

      b. daardoor, naar hij weet of redelijkerwijs moet vermoeden, een ander aan wie bij dat ongeval letsel is
      toegebracht, in hulpeloze toestand wordt achtergelaten.

      2 Het eerste lid, aanhef en onderdeel *a*, is niet van toepassing op degene die op de plaats van het ongeval
      behoorlijk de gelegenheid heeft geboden tot vaststelling van zijn identiteit en, voor zover hij een motorrijtuig
      bestuurde, tevens van de identiteit van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel7
  - number: '8'
    text: |-
      1 Het is een ieder verboden een voertuig te besturen of als bestuurder te doen besturen, terwijl hij verkeert onder
      zodanige invloed van een stof, waarvan hij weet of redelijkerwijs moet weten, dat het gebruik daarvan - al dan niet
      in combinatie met het gebruik van een andere stof - de rijvaardigheid kan verminderen, dat hij niet tot behoorlijk
      besturen in staat moet worden geacht.

      2 Het is een ieder verboden een voertuig te besturen of als bestuurder te doen besturen na zodanig gebruik van
      alcoholhoudende drank, dat:

      a. het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan 220 microgram alcohol per liter
      uitgeademde lucht, dan wel

      b. het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan 0,5 milligram alcohol per
      milliliter bloed.

      3 In afwijking van het tweede lid is het de bestuurder van een motorrijtuig voor het besturen waarvan een
      rijbewijs is vereist, indien sedert de datum waarop aan hem voor de eerste maal een rijbewijs is afgegeven nog
      geen vijf jaren zijn verstreken, dan wel, indien het voor het eerst afgegeven rijbewijs een rijbewijs betreft
      dat de bevoegdheid geeft tot het besturen van bromfietsen en dit rijbewijs is afgegeven aan een persoon die op
      het ogenblik van die afgifte de leeftijd van achttien jaren nog niet heeft bereikt, nog geen zeven jaar zijn
      verstreken, en de eerste afgifte van het rijbewijs op of na 30 maart 2002 heeft plaatsgevonden, verboden dat
      motorrijtuig te besturen of als bestuurder te doen besturen na zodanig gebruik van alcoholhoudende drank, dat:

      a. het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan 88 microgram alcohol per liter
      uitgeademde lucht, dan wel

      b. het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan 0,2 milligram per milliliter bloed.

      4 In afwijking van het tweede lid is het derde lid van overeenkomstige toepassing op de bestuurder van een
      motorrijtuig:

      a. die zonder dat aan hem een rijbewijs is afgegeven een motorrijtuig bestuurt voor het besturen waarvan een
      rijbewijs vereist is, of

      b. aan wie deelname aan het alcoholslotprogramma is opgelegd, tot het tijdstip waarop hij na beëindiging
      van het alcoholslotprogramma overeenkomstig [artikel 132d, eerste of derde lid][ref1], overeenkomstig de
      daarvoor bij algemene maatregel van bestuur vastgestelde regels een rijbewijs zonder de voor deelname aan het
      alcoholslotprogramma vastgestelde codering heeft verkregen.

      5 Het is verboden een motorrijtuig als bestuurder te doen besturen door een persoon waarvan men weet of
      redelijkerwijs moet weten dat deze verkeert in een toestand als in het eerste, tweede of derde lid is omschreven.

      6 Voor de toepassing van het derde lid wordt onder een rijbewijs mede verstaan een rijbewijs, afgegeven door het
      daartoe bevoegde gezag buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132d
