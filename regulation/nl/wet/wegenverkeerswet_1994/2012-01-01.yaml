  - number: '105'
    text: |-
      Indien het voor een motorrijtuig of een aanhangwagen afgegeven kentekenbewijs ingevolge
      [artikel 58, tweede lid, onderdeel b of d][ref1], ongeldig is verklaard of is ingevorderd ingevolge
      [artikel 60, eerste lid, onderdeel b of c][ref2], dient het voertuig alvorens het kentekenbewijs door de Dienst
      Wegverkeer geldig kan worden verklaard of kan worden teruggegeven, te zijn goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel58
