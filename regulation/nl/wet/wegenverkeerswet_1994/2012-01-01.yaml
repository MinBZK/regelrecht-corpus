  - number: '131'
    text: |-
      1 Indien een schriftelijke mededeling als bedoeld in [artikel 130, eerste lid][ref1], is gedaan, besluit het CBR in
      de bij ministeriële regeling aangewezen gevallen respectievelijk tot:

      a. oplegging van een educatieve maatregel ter bevordering van de rijvaardigheid of geschiktheid,

      b. oplegging van een alcoholslotprogramma, of

      c. een onderzoek naar de rijvaardigheid of geschiktheid.

      Het besluit wordt zo spoedig mogelijk, maar uiterlijk binnen vier weken na ontvangst van de mededeling, genomen.

      2 Bij het besluit, bedoeld in het eerste lid, wordt:

      a. in de gevallen, bedoeld in [artikel 130, derde lid][ref2], de geldigheid van het rijbewijs
      van betrokkene voor één of meer categorieën van motorrijtuigen geschorst tot de dag waarop het in
      [artikel 134, vierde of zevende lid][ref3], bedoelde besluit van kracht wordt;

      b. indien de geldigheid van het rijbewijs van betrokkene overeenkomstig onderdeel a wordt geschorst, en diens
      rijbewijs niet overeenkomstig [artikel 130, derde lid][ref4], is ingevorderd, bepaald dat betrokkene zijn rijbewijs
      dient in te leveren bij het CBR;

      c. indien de geldigheid van het rijbewijs van betrokkene niet overeenkomstig onderdeel a, wordt geschorst, doch
      diens rijbewijs wel overeenkomstig [artikel 130, derde lid][ref5], is ingevorderd, bepaald dat het rijbewijs
      onverwijld aan betrokkene wordt teruggegeven.

      3 Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid.

      4 Voor de toepassing van het tweede lid wordt onder rijbewijs mede verstaan een rijbewijs afgegeven door het
      daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.


