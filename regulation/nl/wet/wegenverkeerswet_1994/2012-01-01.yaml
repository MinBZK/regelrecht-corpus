        artikel: '112'
        hoofdstuk: VI
        afdeling: '3'
  - number: '121'
    text: |-
      1 De gemeenten zijn ter zake van de afgifte van rijbewijzen door de burgemeester en de afgifte van rijbewijzen
      door de Dienst Wegverkeer, waarvoor de aanvraag bij de burgemeester is ingediend, een bij ministeriële regeling
      vastgestelde vergoeding aan de Dienst Wegverkeer verschuldigd ter zake van de kosten die verband houden met de
      productie en aflevering van rijbewijzen alsmede het attenderen van de houders van een rijbewijs op het verloop
      van de geldigheidsduur door de Dienst Wegverkeer, het beheer en de instandhouding van het rijbewijzenregister,
      het verstrekken van gegevens uit dat register aan de in [artikel 127, eerste en tweede lid][ref1], bedoelde
      autoriteiten, het ongeldig verklaren van rijbewijzen door de Dienst Wegverkeer, de kosten die verband
      houden met de afgifte van rijbewijzen door de Dienst Wegverkeer, waarvoor de aanvraag bij de burgemeester
      is ingediend alsmede terzake van de kosten die verband houden met het registreren van getuigschriften
      als bedoeld in [artikel 151c, eerste lid][ref2], en met de registratie van certificaten als bedoeld in
      [artikel 151g, vierde lid][ref3].

      2 Bij algemene maatregel van bestuur worden regels vastgesteld met betrekking tot de wijze van afdracht van de
      vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel151c
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
