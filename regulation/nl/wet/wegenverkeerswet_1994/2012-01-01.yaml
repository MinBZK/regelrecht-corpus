  - number: '98'
    text: |-
      Indien in de bouw of inrichting van een voertuig dat ingevolge [hoofdstuk III][ref1] tot het verkeer op de weg is
      toegelaten, na die toelating wijziging is aangebracht, dient die wijziging, voorzover dit bij ministeriële regeling
      is bepaald, te zijn goedgekeurd voor toelating van het gewijzigde voertuig tot het verkeer op de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: '99'
    text: |-
      1 Goedkeuring wordt op aanvraag en tegen betaling op door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor
      door deze dienst vastgestelde tarief door deze dienst verleend, indien de aangebrachte wijziging bij een door deze
      dienst verrichte keuring heeft voldaan aan de ingevolge [hoofdstuk III][ref1] en [hoofdstuk V][ref2] voor deze
      goedkeuring vastgestelde eisen. De keuring kan mede omvatten die delen van het voertuig waarvoor de aangebrachte
      wijziging gevolgen heeft.

      2 Bij ministeriële regeling kunnen regels worden vastgesteld betreffende het door de aanvrager voor de keuring
      ter beschikking stellen van het voertuig, het door de aanvrager overleggen van bescheiden en verstrekken van
      inlichtingen ter zake van de keuring alsmede betreffende de wijze waarop de keuring wordt verricht.

      3 In de bij ministeriële regeling aan te wijzen gevallen wordt voor het gewijzigde voertuig een nieuw
      kentekenbewijs afgegeven waarop melding wordt gemaakt van de goedgekeurde wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006622
        hoofdstuk: V
  - number: '100'
    text: |-
      1 De goedkeuring voor een wijziging in de bouw of inrichting van een voertuig wordt door de Dienst Wegverkeer
      verleend zonder dat de in [artikel 99][ref1] bedoelde keuring heeft plaatsgevonden, indien door een daartoe door
      de Dienst Wegverkeer erkende natuurlijke persoon of rechtspersoon wordt gewaarborgd dat de aangebrachte wijziging
      voldoet aan de ingevolge [hoofdstuk III][ref2] en [hoofdstuk V][ref3] voor deze goedkeuring vastgestelde eisen.

      2 De erkenning geldt voor de in de erkenning aangegeven werkzaamheden ter zake van het wijzigen van de bouw of
      inrichting van voertuigen die behoren tot een in de erkenning aangewezen groep. De erkenning kan gelden voor
      bepaalde of voor onbepaalde tijd.

      3 Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en
      kunnen met betrekking tot die voorschriften regels worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
