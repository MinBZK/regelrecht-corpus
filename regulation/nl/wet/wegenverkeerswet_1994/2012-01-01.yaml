  - number: '123'
    text: |-
      1 Onverminderd de [artikelen 122][ref1] en [131, tweede lid][ref2], verliest een rijbewijs zijn geldigheid:

      a. door uitreiking van een nieuw of vervangend rijbewijs;

      b. door omwisseling tegen een rijbewijs dat aan de houder door het daartoe bevoegde gezag buiten Nederland is
      afgegeven, voor de categorie of categorieën van motorrijtuigen waarop de omwisseling betrekking heeft;

      c. gedurende de tijd dat aan de houder de bevoegdheid tot het besturen van motorrijtuigen is ontzegd;

      d. door het onbevoegd daarin aanbrengen van wijzigingen;

      e. door het overlijden van de houder;

      f. door ongeldigverklaring, voor de categorie of categorieën waarop de ongeldigverklaring betrekking heeft dan
      wel, indien de ongeldigverklaring betrekking heeft op een deel van de geldigheidsduur, voor dat deel van de
      geldigheidsduur;

      g. door wijziging van de geslachtsnaam, de voornamen, de plaats of datum van geboorte of het geslacht van de houder
      of

      h. door aangifte van vermissing van het rijbewijs.

      2 Voor de toepassing van het eerste lid, aanhef, wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door
      het daartoe bevoegde gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere Staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in Nederland
      woonachtig is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel131
