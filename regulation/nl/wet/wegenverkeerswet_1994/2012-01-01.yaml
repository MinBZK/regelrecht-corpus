  - number: '134'
    text: |-
      1 Het CBR stelt zo spoedig mogelijk, doch uiterlijk binnen vier weken na ontvangst van de bevindingen van de
      deskundige of deskundigen, de uitslag van het onderzoek vast. Van deze uitslag doet het CBR mededeling aan
      betrokkene. Indien een of meer deskundigen bij hun bevindingen hebben aangetekend dat inzage daarvan naar hun
      oordeel kennelijk ernstig nadeel voor betrokkene zou opleveren, deelt het CBR de bevindingen schriftelijk mede aan
      de door betrokkene aangewezen vertrouwensarts.

      2 Het CBR besluit tot ongeldigverklaring van het rijbewijs indien de uitslag van het onderzoek daartoe aanleiding
      geeft. Bij ministeriële regeling worden de gevallen aangewezen waarin daarvan sprake is.

      3 Indien het CBR voornemens is het rijbewijs ongeldig te verklaren, deelt het dit mede aan de houder, tevens onder
      mededeling van de bevoegdheid van betrokkene om binnen twee weken een tweede onderzoek te verlangen. De aan dit
      tweede onderzoek verbonden kosten, waarvan de hoogte bij ministeriële regeling wordt vastgesteld, komen ten laste
      van betrokkene. De [artikelen 132][ref1] en [133][ref2] alsmede het eerste en het vierde lid van dit artikel zijn
      van overeenkomstige toepassing. De in de eerste volzin bedoelde mededeling wordt niet gedaan, indien het rijbewijs
      van de houder inmiddels op grond van [artikel 123b][ref3] ongeldig is geworden.

      4 Indien het CBR besluit dat het rijbewijs van de houder ongeldig wordt verklaard, wordt daarbij bepaald op welk
      deel van de geldigheidsduur alsmede op welke categorie of categorieën van motorrijtuigen waarvoor het rijbewijs
      is afgegeven de ongeldigverklaring betrekking heeft. [Artikel 132, vierde tot en met zevende lid][ref4], is van
      overeenkomstige toepassing.

      5 Indien de uitslag van het onderzoek aanleiding geeft tot ongeldigverklaring van het rijbewijs van betrokkene,
      plaatst het CBR, indien dat rijbewijs zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur,
      een aantekening in het rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op
      de bij algemene maatregel van bestuur vastgestelde wijze dient aan te tonen dat hij, al naar gelang de aard van het
      onderzoek, beschikt over de lichamelijke en geestelijke geschiktheid dan wel de rijvaardigheid die is vereist voor
      het besturen van motorrijtuigen van de categorie of categorieën waarop het onderzoek betrekking had.

      6 Indien bij een op grond van het in [artikel 131, eerste lid][ref5], bedoelde besluit gevorderd onderzoek
      naar de geschiktheid is gebleken dat de resterende geldigheidsduur van het rijbewijs korter is dan de termijn
      waarvoor de houder blijkens de uitslag van het onderzoek naar verwachting geschikt zal zijn voor het besturen van
      motorrijtuigen, plaatst het CBR een aantekening in het rijbewijzenregister waaruit blijkt dat de houder bij de
      aanvraag van een nieuw rijbewijs op de bij algemene maatregel van bestuur vastgestelde wijze dient aan te tonen dat
      hij beschikt over de lichamelijke en geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen
      van de categorie of categorieën waarop het onderzoek betrekking heeft.

      7 Indien het CBR van oordeel is dat op grond van de uitslag van het onderzoek betrokkene niet als niet rijvaardig
      of ongeschikt moet worden beoordeeld, legt het aan betrokkene in bij ministeriële regeling vastgestelde gevallen
      overeenkomstig bij algemene maatregel van bestuur vastgestelde regels de verplichting op deel te nemen aan een
      educatieve maatregel gedrag en verkeer dan wel aan het alcoholslotprogramma. Indien het CBR besluit tot oplegging
      van de educatieve maatregel gedrag en verkeer zijn de [artikelen 132][ref6] en [132a][ref7] van overeenkomstige
      toepassing. In het geval van oplegging van de verplichting tot deelname aan het alcoholslotprogramma zijn de
      [artikelen 132b tot en met 132o][ref8] van overeenkomstige toepassing.

      8 Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het derde, het vierde en het
      zevende lid.

      9 Voor de toepassing van dit artikel wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door het daartoe
      bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel133
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
