  - number: 22b
    text: |-
      1 De Dienst Wegverkeer kan met het oog op het verlenen van een typegoedkeuring als bedoeld in
      [artikel 22, eerste lid][ref1], op aanvraag een technische dienst aanwijzen om namens hem bepaalde voor goedkeuring
      noodzakelijke tests te verrichten, indien uit een door de Dienst Wegverkeer opgesteld beoordelingsverslag of uit
      een door een accrediteringsinstantie afgegeven accrediteringscertificaat blijkt dat deze dienst voldoet aan de
      daarvoor bij ministeriële regeling gestelde eisen.

      2 De Dienst Wegverkeer houdt toezicht op de op grond van het eerste lid aangewezen technische dienst. De aangewezen
      technische dienst is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het door de
      Dienst Wegverkeer ter zake van de kosten van het toezicht vastgestelde tarief.

      3 Met een technische dienst wordt gelijk gesteld een technische dienst die beschikt over een beoordelingsverslag
      opgesteld door de daartoe bevoegde instantie in een andere lidstaat van de Europese Unie, een staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, dan wel over een
      accrediteringscertificaat afgegeven door een accrediteringsinstantie uit die andere lidstaat van de Europese Unie,
      een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, voor zover
      hieruit blijkt dat deze dienst voldoet aan eisen die tenminste gelijkwaardig zijn aan de in het eerste lid bedoelde
      eisen.

      4 De aanwijzing wordt ingetrokken indien de technische dienst die was aangewezen, daarom verzoekt.

      5 De Dienst Wegverkeer kan een aanwijzing intrekken indien de aangewezen technische dienst niet meer voldoet aan de
      voor de aanwijzing gestelde eisen.

      6 De Dienst Wegverkeer kan een aanwijzing schorsen voor een door hem daarbij vast te stellen termijn die ten
      hoogste twaalf weken bedraagt.

      7 Bij ministeriële regeling kunnen bepalingen worden gesteld ter uitvoering van dit artikel. Hierbij kunnen
      tevens regels worden gesteld omtrent het door de aanvrager overleggen van bescheiden of verstrekken van nadere
      inlichtingen, betreffende de wijze waarop toezicht wordt gehouden en de verplichting tot medewerking daaraan van
      degene die is aangewezen als technische dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
