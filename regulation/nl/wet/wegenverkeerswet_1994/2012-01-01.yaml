  - number: '71'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent:

      a. de eisen waaraan voertuigen moeten voldoen waarmee over de weg wordt gereden, waarbij onderscheid kan worden
      gemaakt tussen verschillende wegen;

      b. de inrichting van voertuigen die op de weg staan;

      c. de eisen waaraan voertuigen moeten voldoen voor de afgifte van een keuringsbewijs;

      d. de eisen waaraan ter uitvoering van verdragen of van besluiten van volkenrechtelijke organisaties of van één
      of meer instellingen van de Europese Unie, al dan niet gezamenlijk, moet worden voldaan met betrekking tot het
      uitvoeren van onderhoud aan voertuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel71
  - number: 71a
    text: |-
      Bij ministeriële regeling kan worden bepaald dat:

      a. het voldoen aan de in [artikel 71][ref1] bedoelde voorschriften wordt aangetoond door middel van in die regels
      voorgeschreven apparatuur,

      b. die apparatuur is goedgekeurd door een door Onze Minister aangewezen keuringsinstelling,

      c. die apparatuur alleen kan worden goedgekeurd indien de in die regels genoemde technische specificaties van die
      apparatuur die noodzakelijk zijn om het periodiek onderzoek, bedoeld in onderdeel d, uit te kunnen voeren, op de in
      die regels aangegeven wijze bekend worden gemaakt,

      d. die apparatuur met een in die regels vast te stellen periodiciteit is onderzocht door deze keuringsinstelling,
      dan wel door een door Onze Minister of door deze keuringsinstelling erkende onderzoeksgerechtigde en dat middelen
      die worden gebruikt om die apparatuur voor gebruik geschikt te maken, zijn gecertificeerd door een door die
      keuringsinstelling erkende instelling, en

      e. bij de erkenning van een onderzoeksgerechtigde of instelling als bedoeld in onderdeel d, wordt voldaan aan de in
      die regels opgenomen voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel71a
