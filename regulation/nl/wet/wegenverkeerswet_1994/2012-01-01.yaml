  - number: '170'
    text: |-
      1 Tot de bevoegdheid van burgemeester en wethouders tot oplegging van een last onder bestuursdwang als bedoeld in
      [artikel 125 van de Gemeentewet][ref1], behoort de bevoegdheid tot het overbrengen en in bewaring stellen van een
      op een weg staand voertuig, indien met het voertuig een bij of krachtens deze wet vastgesteld voorschrift wordt
      overtreden en bovendien verwijdering van het voertuig noodzakelijk is in verband met

      a. het belang van de veiligheid op de weg, of

      b. het belang van de vrijheid van het verkeer, of

      c. het vrijhouden van aangewezen weggedeelten en wegen.

      2 De [artikelen 5:24][ref2], [5:25, tweede tot en met vierde lid][ref3], [5:29, vijfde lid][ref4],
      [5:30, derde lid][ref5], en [5:31 van de Algemene wet bestuursrecht][ref6] zijn niet van
      toepassing. Bij de toepassing van [artikel 5:25 van de Algemene wet bestuursrecht][ref7] treedt
      de rechthebbende die het voertuig afhaalt, in de plaats van de overtreder. Voor de toepassing van
      [artikel 5:30 van de Algemene wet bestuursrecht][ref8] wordt de omstandigheid dat een voertuig niet is afgehaald,
      gelijkgesteld met de omstandigheid dat het voertuig niet kan worden teruggegeven.

      3 Burgemeester en wethouders plegen regelmatig overleg met de officier van justitie over de uitoefening van de in
      het eerste lid bedoelde bevoegdheid.

      4 Burgemeester en wethouders dragen er zorg voor dat in een daartoe aangelegd register aantekening wordt gehouden
      van de gevallen waarin de in het eerste lid bedoelde bevoegdheid wordt uitgeoefend.

      5 Bij toepassing van het eerste lid wordt onder rechthebbende verstaan: degene die ofwel eigenaar is van het
      voertuig ofwel anders dan als bezitter het voertuig ten tijde van de overtreding ten gebruike onder zich had.
      Hierbij geldt [artikel 1, tweede lid][ref9], niet.

      6 De in het eerste lid bedoelde bevoegdheid wordt niet uitgeoefend, indien de rechthebbende het voertuig
      verwijdert voordat met de overbrenging een aanvang wordt gemaakt. Hij is alsdan de kosten verbonden aan de
      voorbereiding van de overbrenging, verschuldigd. De [artikelen 4:116][ref10], [4:118 tot en met 4:124][ref11], en
      [5:10 van de Algemene wet bestuursrecht][ref12] zijn van overeenkomstige toepassing.


