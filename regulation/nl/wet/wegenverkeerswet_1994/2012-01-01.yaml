  - number: 132j
    text: |-
      Het is eenieder aan wie niet een erkenning als bedoeld in [artikel 132f][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
