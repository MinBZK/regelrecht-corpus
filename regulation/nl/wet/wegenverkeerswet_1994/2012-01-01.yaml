  - number: '160'
    text: |-
      1 Op de eerste vordering van de in [artikel 159][ref1] bedoelde personen is de bestuurder van een motorrijtuig
      verplicht dat motorrijtuig te doen stilhouden alsmede de volgende bewijzen behoorlijk ter inzage af te geven:

      a. de bij algemene maatregel van bestuur aangewezen delen van het kentekenbewijs, dan wel het in
      [artikel 37, eerste lid, onderdeel b][ref2], bedoelde bewijs, en, indien met het motorrijtuig een aanhangwagen
      wordt voortbewogen, de bij algemene maatregel van bestuur aangewezen delen van het kentekenbewijs van de
      aanhangwagen, dan wel het in [artikel 37, eerste lid, onderdeel b][ref3], bedoelde bewijs voor de aanhangwagen;

      b. het rijbewijs dan wel het hem door het daartoe bevoegde gezag buiten Nederland afgegeven rijbewijs en, indien
      hem buiten Nederland een internationaal rijbewijs is afgegeven, dat bewijs;

      c. het ingevolge de richtlijn vakbekwaamheid bestuurders, bedoeld in [artikel 151b, onderdeel a][ref4], vereiste
      getuigschrift;

      d. indien hem ter zake van een bij of krachtens deze wet vastgesteld voorschrift ontheffing is verleend, de
      beschikking houdende verlening van ontheffing.

      2 Indien het kentekenbewijs is afgegeven voor een aanhangwagen die overeenkomstig het krachtens deze wet bepaalde
      is voorzien van een identificatieplaat, kan aan de vordering worden voldaan binnen een bij algemene maatregel van
      bestuur vastgestelde termijn.

      3 Op de eerste vordering van de in [artikel 159][ref5] bedoelde personen is de bestuurder van een voertuig,
      niet zijnde een motorrijtuig, verplicht dat voertuig te doen stilhouden en, indien hem ter zake van een bij of
      krachtens deze wet vastgesteld voorschrift ontheffing is verleend, de beschikking houdende verlening van ontheffing
      behoorlijk ter inzage af te geven.

      4 De in [artikel 159][ref6] bedoelde personen zijn bevoegd zich te vergewissen van de naleving van de bij of
      krachtens deze wet vastgestelde voorschriften en zo nodig een voertuig ten aanzien waarvan zij een onderzoek
      wensen in te stellen, naar een nabij gelegen plaats te voeren of te doen voeren. De bestuurder van het voertuig
      ten aanzien waarvan dit onderzoek wenselijk wordt geoordeeld, en de bestuurder van het voertuig waardoor een
      aanhangwagen wordt voortbewogen ten aanzien waarvan zodanig onderzoek wenselijk wordt geoordeeld, zijn verplicht
      desgevorderd hun tot het onderzoek noodzakelijke medewerking te verlenen en desverlangd de in [artikel 159][ref7]
      bedoelde personen in hun voertuig te vervoeren.

      5 Op de eerste vordering van een van de in [artikel 159, onderdeel a][ref8], bedoelde personen zijn de bestuurder
      van een voertuig en degene die aanstalten maakt een voertuig te gaan besturen, verplicht hun medewerking
      te verlenen aan een voorlopig onderzoek van uitgeademde lucht en daartoe volgens door die persoon te geven
      aanwijzingen ademlucht te blazen in een door die persoon aangewezen apparaat.

      6 Op eerste vordering van een van de in [artikel 159, onderdeel a][ref9], bedoelde personen zijn de bestuurder
      van een motorrijtuig en degene die aanstalten maakt een motorrijtuig te gaan besturen die op grond van
      [artikel 132c, eerste lid, onderdeel d][ref10], de feitelijke beschikking hebben gekregen over een rijbewijs
      waarop de bij ministeriële regeling vastgestelde codering voor het rijden met een alcoholslot is vermeld, verplicht
      het alcoholslot, dan wel de daarvan deel uitmakende ademalcoholtester te tonen of een blaastest op het in het
      motorrijtuig aanwezige alcoholslot uit te voeren.

      7 De bestuurder van een voertuig, die door een der in [artikel 159][ref11] bedoelde personen in overtreding wordt
      bevonden van een bij of krachtens deze wet vastgesteld voorschrift, is verplicht de hem door die persoon ter
      bescherming van bij het verkeer betrokken belangen gegeven bevelen op te volgen.


