        artikel: '65'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '64'
    text: |-
      1 Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de *Staatscourant*. Het toezicht omvat in ieder geval het periodiek controleren van de bedrijfsvoorraad van degene
      aan wie de erkenning is verleend en van de ter zake van die bedrijfsvoorraad door deze gevoerde administratie.

      2 Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.

      3 Bij ministeriële regeling worden nadere regels vastgesteld betreffende de wijze waarop het toezicht wordt
      gehouden en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend. Deze regels
      kunnen inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of
      meer uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel64
  - number: '65'
    text: |-
      1 De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie de erkenning is verleend, daarom verzoekt.

      2 De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:

      a. niet meer voldoet aan de voor de erkenning gestelde eisen,

      b. de verplichtingen, vervat in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] en
      [artikel 64, tweede lid][ref2], niet nakomt, of

      c. handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.

      3 De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.

      4 De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, bepalen dat een wachttijd geldt voor het
      aanvragen van een erkenning van maximaal 30 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel520
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel64
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel65
    references:
      - id: ref1
