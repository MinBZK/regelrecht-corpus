  - number: 179a
    text: |-
      1 Bij veroordeling wegens een der in de [artikelen 287][ref1] of [289 van het Wetboek van Strafrecht][ref2]
      omschreven misdrijven kan de schuldige die het feit heeft gepleegd met een motorrijtuig dat hij ten tijde van het
      feit bestuurde of deed besturen, de bevoegdheid tot het besturen van motorrijtuigen voor ten hoogste tien jaren
      worden ontzegd.

      2 Bij veroordeling wegens een der in de [artikelen 285][ref3], [301][ref4], [302][ref5] of
      [303 van het Wetboek van Strafrecht][ref6] omschreven misdrijven kan de schuldige die het feit heeft gepleegd met
      een motorrijtuig dat hij ten tijde van het feit bestuurde of deed besturen, de bevoegdheid tot het besturen van
      motorrijtuigen voor ten hoogste vijf jaren worden ontzegd.

      3 Voor de toepassing van het tweede lid wordt een strafbeschikking met een veroordeling gelijkgesteld.


