  - number: '58'
    text: |-
      1 Een kentekenbewijs wordt overeenkomstig bij algemene maatregel van bestuur vastgestelde regels ongeldig
      verklaard:

      a. indien het is afgegeven op grond van bij de aanvraag verschafte onjuiste gegevens en dat kentekenbewijs niet zou
      zijn afgegeven indien de onjuistheid van die gegevens ten tijde van de aanvraag bekend zou zijn geweest, dan wel

      b. indien blijkt dat het kennelijk abusievelijk is afgegeven.

      2 Een kentekenbewijs kan, overeenkomstig bij algemene maatregel van bestuur vastgestelde regels, ongeldig worden
      verklaard:

      a. indien de ter zake van het voertuig verschuldigde belastingen en rechten niet zijn voldaan;

      b. indien het voertuig waarvoor het is afgegeven, niet voldoet aan de bij of krachtens deze wet vastgestelde eisen,
      met uitzondering van de ingevolge [hoofdstuk III][ref1] met betrekking tot de toelating tot het verkeer op de weg
      vastgestelde eisen;

      c. indien in de bouw of inrichting van het voertuig waarvoor het is afgegeven, wijzigingen zijn aangebracht, die
      niet zijn goedgekeurd overeenkomstig het bepaalde bij of krachtens deze wet;

      d. indien het voertuig waarvoor het kentekenbewijs is afgegeven een schadevoertuig betreft dat voldoet aan bij
      ministeriële regeling vastgestelde kenmerken, dan wel indien het voertuig na herstel van de schade niet voldoet aan
      de bij ministeriële regeling te stellen eisen ten aanzien van de wijze waarop de schade is hersteld;

      e. indien de eigenaar of houder van een voertuig onvrijwillig de beschikkingsmacht over dat voertuig heeft
      verloren, mits wordt voldaan aan de bij algemene maatregel van bestuur vastgestelde voorwaarden, dan wel

      f. in andere bij algemene maatregel van bestuur vast te stellen gevallen.

      3 De ongeldigverklaring kan worden beperkt tot het rijden over de weg.

      4 De Dienst Wegverkeer kan een ongeldig verklaard kentekenbewijs geldig verklaren, dan wel geldig verklaren voor
      het rijden over de weg, indien de reden voor ongeldigverklaring is komen te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: '59'
    text: |-
      1 Bij algemene maatregel van bestuur worden regels vastgesteld omtrent het verval van de tenaamstelling in het
      kentekenregister. De tenaamstelling in het kentekenregister vervalt in ieder geval zodra het kentekenbewijs
      ongeldig is verklaard ingevolge [artikel 58, tweede lid, onderdeel e][ref1].

      2 Bij algemene maatregel van bestuur kunnen regels worden vastgesteld omtrent het herleven van een vervallen
      tenaamstelling in het kentekenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel58
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '58'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '60'
    text: |-
      1 De houder van een kentekenbewijs is op eerste vordering van de bij algemene maatregel van bestuur aangewezen
      personen verplicht tot overgifte van dat bewijs of van een of meer bij algemene maatregel van bestuur aan te wijzen
      delen daarvan, indien naar het oordeel van die personen:

      a. ter zake van het voertuig, waarvoor het kentekenbewijs is afgegeven, de verschuldigde belastingen en rechten
      niet zijn voldaan;

      b. het voertuig waarvoor het kentekenbewijs is afgegeven, niet voldoet aan de bij of krachtens deze wet
      vastgestelde eisen, met uitzondering van de ingevolge [hoofdstuk III][ref1] met betrekking tot de toelating tot het
      verkeer op de weg vastgestelde eisen;

      c. het voertuig waarvoor het kentekenbewijs is afgegeven een schadevoertuig betreft dat voldoet aan bij
      ministeriële regeling vastgestelde kenmerken, dan wel indien het voertuig na herstel van de schade niet voldoet aan
      de bij ministeriële regeling te stellen eisen ten aanzien van de wijze waarop de schade is hersteld.

      2 De in het eerste lid bedoelde vordering kan eveneens worden gedaan indien naar het oordeel van de daar bedoelde
      personen niet wordt voldaan aan de krachtens [artikel 52, tweede lid][ref2], in het kentekenbewijs vermelde
      voorschriften.

      3 Indien het een kentekenbewijs betreft dat is afgegeven voor een aanhangwagen die overeenkomstig het bij
      ministeriële regeling bepaalde is voorzien van een identificatieplaat, kan aan de vordering worden voldaan binnen
      een bij die maatregel vastgestelde termijn.

      4 De in het eerste lid bedoelde personen doen in de bij algemene maatregel van bestuur aangewezen gevallen het
      kentekenbewijs of de ingevorderde delen daarvan zo spoedig mogelijk toekomen aan de Dienst Wegverkeer.

      5 De Dienst Wegverkeer geeft het kentekenbewijs of de ingevorderde delen daarvan terug:

      a. in de gevallen, bedoeld in het eerste lid, onderdeel a, indien ter zake van het voertuig alsnog de verschuldigde
      belastingen en rechten zijn voldaan;

      b. in de gevallen, bedoeld in het eerste lid, onderdeel b, indien het voertuig ter zake van de eisen waaraan het
      niet voldeed, alsnog is goedgekeurd;

      c. in de gevallen, bedoeld in het eerste lid, onderdeel c, indien het schadevoertuig is goedgekeurd ingevolge bij
      ministeriële regeling vastgestelde eisen omtrent de wijze waarop de schade is hersteld;

      d. in het geval, bedoeld in het tweede lid, indien alsnog wordt voldaan aan de krachtens
      [artikel 52, tweede lid][ref3], in het kentekenbewijs vermelde voorschriften.

      6 De Dienst Wegverkeer geeft bij de teruggave van het kentekenbewijs of de ingevorderde delen daarvan tevens een
      keuringsbewijs voor het betrokken voertuig af, indien:

      a. het kentekenbewijs is ingevorderd omdat het voertuig niet voldoet aan de eisen bedoeld in het eerste lid,
      onderdeel b;

      b. het voertuig is onderworpen aan een onderzoek dat ten minste een controle inhoudt op de eisen, bedoeld in
      [artikel 75, eerste lid][ref4]; en

      c. [artikel 72][ref5] voor dat voertuig geldt en binnen een jaar zal gelden.

      7 Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de vordering van kentekenbewijzen.

      8 Bij ministeriële regeling, in overeenstemming met Onze Minister van Financiën, kunnen nadere regels worden
      vastgesteld omtrent het vijfde lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel52
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel75
