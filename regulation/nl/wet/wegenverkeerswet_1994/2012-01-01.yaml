  - number: 48a
    text: |-
      De Dienst Wegverkeer brengt aantekeningen aan op dan wel verwijdert aantekeningen van het kentekenbewijs voor zover
      dat bij of krachtens deze wet is voorgeschreven of mogelijk wordt gemaakt, dan wel voor de goede uitvoering van
      deze wet wenselijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel48a
  - number: '49'
    text: |-
      1 Onverminderd [artikel 48, eerste lid][ref1], wordt de afgifte van een kentekenbewijs geweigerd:

      a. indien bij een ingevolge [hoofdstuk V][ref2] verrichte keuring blijkt dat de op het voertuig aangebrachte
      gegevens op onrechtmatige wijze in overeenstemming zijn gebracht met de op het overgelegde kentekenbewijs vermelde
      gegevens,

      b. indien blijkt dat de ter zake van het voertuig verschuldigde belastingen en rechten niet zijn voldaan, dan wel

      c. indien blijkt dat de krachtens een algemeen verbindend verklaarde overeenkomst op grond van de
      [Wet milieubeheer][ref3] verschuldigde afvalbeheersbijdrage voor autowrakken niet is voldaan, dan wel

      d. in overige bij algemene maatregel van bestuur te bepalen gevallen overeenkomstig de bij die algemene maatregel
      vastgestelde regels.

      2 De afgifte van een kentekenbewijs kan worden geweigerd indien:

      a. voor het motorrijtuig of de aanhangwagen waarvoor de afgifte wordt verlangd, op grond van het bij of krachtens
      deze wet bepaalde geen kenteken behoeft te zijn opgegeven;

      b. uit het kentekenregister blijkt dat de eigenaar of houder van een motorrijtuig of een aanhangwagen onvrijwillig
      de beschikkingsmacht over dat voertuig heeft verloren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel49
