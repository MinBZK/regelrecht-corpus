  - number: '162'
    text: |-
      1 Een van de in [artikel 159, onderdeel a][ref1], bedoelde personen kan de bestuurder van een voertuig van
      wie, uit het in [artikel 160, vijfde lid][ref2], bedoelde onderzoek of op andere wijze, naar het oordeel
      van die persoon gebleken is dat hij onder zodanige invloed van het gebruik van een stof als bedoeld in
      [artikel 8, eerste lid][ref3], verkeert, dat hij onvoldoende in staat is een voertuig behoorlijk te besturen, een
      rijverbod opleggen voor de tijd gedurende welke redelijkerwijs verwacht mag worden dat deze toestand zal voortduren
      tot ten hoogste vierentwintig uren. De vorige volzin is van overeenkomstige toepassing op degene die aanstalten
      maakt een voertuig te gaan besturen.

      2 De opsporingsambtenaar die een rijverbod oplegt, legt dit vast in een beschikking die het tijdstip van ingang en
      de duur van het verbod bevat.

      3 Het is degene aan wie een rijverbod als bedoeld in het eerste lid is opgelegd, verboden een voertuig te besturen
      of als bestuurder te doen besturen gedurende de tijd waarvoor dat rijverbod geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel160
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel8
