  - number: 134a
    text: |-
      Voor zover dit noodzakelijk is voor de toepassing van deze paragraaf verwerkt het CBR persoonsgegevens betreffende
      iemands rijvaardigheid en gezondheid.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel134a
  - number: '142'
    text: |-
      1 De Dienst Wegverkeer houdt een register betreffende de afgifte van bromfietscertificaten.

      2 In het kader van het register verwerkt de Dienst Wegverkeer gegevens omtrent afgegeven bromfietscertificaten.

      3 Bij algemene maatregel van bestuur worden regels vastgesteld omtrent de inrichting en het beheer van het
      register.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel142
  - number: '143'
    text: |-
      1 Aan autoriteiten die betrokken zijn bij de uitvoering van deze wet of die zijn belast met de handhaving van de
      bij of krachtens deze wet vastgestelde voorschriften, worden op de door de Dienst Wegverkeer te bepalen wijze uit
      het register desgevraagd de gegevens verstrekt die zij voor de uitoefening van hun taak behoeven.

      2 De autoriteiten, bedoeld in het eerste lid, zijn gehouden om in bij algemene maatregel van bestuur te bepalen
      gevallen aan de Dienst Wegverkeer op de door deze dienst te bepalen wijze mededeling te doen van feiten die van
      belang zijn voor het bijhouden van het register.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel143
  - number: '144'
    text: |-
      1 Aan belanghebbenden kunnen, overeenkomstig bij algemene maatregel van bestuur vastgestelde regels, op aanvraag
      en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het door deze dienst voor de behandeling
      van de aanvraag vastgestelde tarief, uit het register gegevens worden verstrekt.

      2 Bij ministeriële regeling kan worden bepaald dat het verstrekken van gegevens aan belanghebbenden niet of slechts
      tot een beperkt aantal of in beperkte vorm of omvang geschiedt.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel144
  - number: '145'
    text: |-
      De Dienst Wegverkeer stelt ten aanzien van het verwerken van gegevens als bedoeld in
      [artikel 142, tweede lid][ref1], een reglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel142
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '142'
        hoofdstuk: VI
        afdeling: '10'
  - number: 145a
    text: |-
      1 In dit hoofdstuk wordt verstaan onder de richtlijn: de bij ministeriële regeling aangewezen richtlijn.

      2 Een wijziging van de richtlijn, bedoeld in het eerste lid, gaat voor de toepassing van dit hoofdstuk gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel145a
  - number: 145b
    text: |-
      1 Een elektronisch heffingssysteem als bedoeld in artikel 2, eerste lid, van de richtlijn, dat na 31 december 2006
      in gebruik wordt genomen, is gebaseerd op één of meer van de technologieën, bedoeld in artikel 2, eerste lid, van
      de richtlijn.

      2 Het eerste lid geldt niet voor een heffingssysteem als bedoeld in artikel 1, tweede lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel145b
  - number: 145c
    text: |-
      1 Op een weg waar tarieven voor het gebruik van de weg elektronisch worden geïnd, wordt een Europese elektronische
      tolheffingsdienst aangeboden, die voldoet aan de artikelen 1, derde lid, 3, eerste lid en 4, eerste, derde en
      achtste lid, van de richtlijn.

      2 Een Europese elektronische tolheffingssdienst wordt aangeboden uiterlijk met ingang van een bij ministeriële
      regeling te bepalen tijdstip, dat voor verschillende categorieën voertuigen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel145c
  - number: 145d
    text: |-
      Een exploitant stelt vanaf het in [artikel 145c, tweede lid][ref1], vastgestelde tijdstip aan gebruikers apparatuur
      ter beschikking die in het voertuig kan worden ingebouwd en voldoet aan de eisen, bedoeld in artikel 2, tweede lid,
      van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel145c
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel145d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 145c
        hoofdstuk: VIA
        paragraaf: '3'
  - number: 145e
    text: |-
      Bij ministeriële regeling kunnen ter uitvoering van de richtlijn aanvullende regels worden gesteld met betrekking
      tot de in dit hoofdstuk geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel145e
  - number: '146'
    text: |-
      Onze Minister kan, met inachtneming van verdragen en van besluiten van volkenrechtelijke organisaties of van één of
      meer instellingen van de Europese Unie, al dan niet gezamenlijk, van bepalingen van deze wet vrijstelling verlenen
      voor het gebruik van de weg ten behoeve van openbare diensten.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel146
  - number: '147'
    text: |-
      1 Onze Minister kan, met inachtneming van verdragen en van besluiten van volkenrechtelijke organisaties of van
      één of meer instellingen van de Europese Unie, al dan niet gezamenlijk, van het bepaalde krachtens deze wet
      vrijstelling verlenen voor het gebruik van de weg ten behoeve van openbare of door Onze Minister daarmee gelijk te
      stellen diensten.

      2 Onze Minister kan van het bepaalde krachtens deze wet vrijstelling verlenen voor het gebruik van de weg ten
      behoeve van particuliere geld- en waardetransportbedrijven waaraan een vergunning is verleend als bedoeld in
      [artikel 3, aanhef en onder c, van de Wet particuliere beveiligingsorganisaties en recherchebureaus][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel3
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '3'
  - number: '148'
    text: |-
      1 Van het in [artikel 10, eerste lid][ref1], vervatte verbod kan overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels ontheffing worden verleend:

      a. voor wegen onder beheer van het Rijk door Onze Minister;

      b. voor andere wegen door gedeputeerde staten. In afwijking hiervan wordt, indien de wegen waarvoor de ontheffing
      wordt gevraagd, alle zijn gelegen binnen één gemeente, de ontheffing verleend door burgemeester en wethouders.

      2 De in het eerste lid bedoelde ontheffing kan slechts worden verleend indien wordt aangetoond dat maatregelen
      zijn getroffen ter voorkoming van deelneming aan de wedstrijd zonder dat de burgerrechtelijke aansprakelijkheid
      voor de schade waartoe het gebruik van motorrijtuigen tijdens de wedstrijd aanleiding kan geven, is gedekt door een
      verzekering overeenkomstig de [Wet aansprakelijkheidsverzekering motorrijtuigen][ref2]. De verzekering dient mede
      te dekken de aansprakelijkheid van degenen die de wedstrijd organiseren. Deze voorwaarde geldt niet ten aanzien van
      degene wiens aansprakelijkheid ten laste van de Staat komt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002415
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '10'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002415
  - number: '149'
    text: |-
      1 Van het bepaalde krachtens deze wet kan in de krachtens deze wet aangewezen gevallen overeenkomstig krachtens
      deze wet vastgestelde regels ontheffing worden verleend:

      a. voor wegen onder beheer van het Rijk door Onze Minister;

      b. voor wegen onder beheer van een provincie door gedeputeerde staten;

      c. voor wegen onder beheer van een waterschap door het algemeen bestuur of, krachtens besluit van het algemeen
      bestuur, door het dagelijks bestuur;

      d. voor andere wegen door burgemeester en wethouders of krachtens besluit van hen, door een door hen ingestelde
      bestuurscommissie of het dagelijks bestuur van een deelgemeente.

      2 In afwijking van het eerste lid kan door Onze Minister ontheffing worden verleend van het gebruik van autogordels
      en kinderbeveiligingsmiddelen. Bij of krachtens algemene maatregel van bestuur kunnen terzake nadere regels worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel149
  - number: 149a
    text: |-
      1 In dit artikel, [artikel 149b][ref1] en de op deze artikelen berustende bepalingen wordt verstaan onder
      wegbeheerder: het ingevolge [artikel 149, eerste lid][ref2], tot het verlenen van een ontheffing bevoegde gezag.

      2 In afwijking van [artikel 149, eerste lid][ref3], kan uitsluitend door de Dienst Wegverkeer ontheffing worden
      verleend of geweigerd van het bepaalde krachtens [artikel 13][ref4] en [artikel 71][ref5], in de bij algemene
      maatregel van bestuur aangewezen gevallen overeenkomstig bij of krachtens algemene maatregel van bestuur
      vastgestelde regels.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de partijen waarmee en
      de wijze waarop de Dienst Wegverkeer periodiek overleg voert met betrekking tot de uitvoering van dit artikel en
      [artikel 149b][ref6].

      4 De kosten die samenhangen met de behandeling van de aanvraag en de verlening van de ontheffing, alsmede
      de kosten die samenhangen met het verrichten van onderzoeken en met daarbij behorende afgifte van documenten
      ten behoeve van de ontheffingverlening worden ten laste gebracht van de aanvrager. Bij de toepassing van
      [artikel 4b, eerste lid, onderdeel n][ref7], met betrekking tot deze kosten kan worden bepaald dat de vergoeding
      van de kosten voorafgaand aan de behandeling van de aanvraag wordt betaald.

      5 Ten behoeve van de ontheffingverlening, bedoeld in het tweede lid, verwerkt de Dienst Wegverkeer gegevens met
      betrekking tot aanvrager, voertuig en kenteken die zijn opgenomen in de aanvragen voor ontheffingen en in afgegeven
      ontheffingen.

      6 Aan de toezichthouders bedoeld in [artikel 158][ref8] en aan de wegbeheerders worden op de door de Dienst
      Wegverkeer te bepalen wijze desgevraagd de gegevens met betrekking tot de inhoud van de afgegeven en geweigerde
      ontheffingen en de gegevens met betrekking tot het aantal en de aard van de ontheffingen verstrekt, die zij voor de
      uitoefening van hun taak behoeven.


