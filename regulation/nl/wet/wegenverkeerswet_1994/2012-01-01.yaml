  - number: '18'
    text: |-
      1 Verkeersbesluiten worden genomen:

      a. voor zover zij betreffen het verkeer op wegen onder beheer van het Rijk door Onze Minister;

      b. voor zover zij betreffen het verkeer op wegen onder beheer van een provincie door gedeputeerde staten;

      c. voor zover zij betreffen het verkeer op wegen onder beheer van een waterschap door het algemeen bestuur of,
      krachtens besluit van het algemeen bestuur, door het dagelijks bestuur;

      d. voor zover zij betreffen het verkeer op andere wegen door burgemeester en wethouders, of krachtens besluit van
      hen, door een door hen ingestelde bestuurscommissie of het dagelijks bestuur van een deelgemeente.

      2 Indien het beheer over een weg wordt overgedragen, blijven de verkeersbesluiten die de oorspronkelijke
      wegbeheerder ten aanzien van het verkeer op die weg heeft vastgesteld, van kracht totdat zij zijn vervangen.

      3 Bij algemene maatregel van bestuur worden regels vastgesteld omtrent de eisen waaraan verkeersbesluiten dienen te
      voldoen alsmede omtrent de totstandkoming en de inwerkingtreding van die besluiten.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel18
  - number: '19'
    text: |-
      1 Gedeputeerde staten kunnen aan besturen van waterschappen en aan burgemeester en wethouders de aanwijzing
      geven om op buiten de bebouwde kom gelegen wegen, ten aanzien waarvan die organen bevoegd zijn tot het nemen van
      verkeersbesluiten, binnen dertien weken een verkeersbesluit van een daarbij aan te geven inhoud te nemen en uit
      te voeren.

      2 Het eerste lid mag worden toegepast, indien:

      a. op een buiten de bebouwde kom gelegen weg, die bij meerdere organen in beheer is, naar het oordeel van
      gedeputeerde staten een of meerdere niet op elkaar afgestemde verkeersbesluiten van kracht zijn, die zodanige
      afstemming behoeven met het oog op de belangen, omschreven in [artikel 2, eerste lid, onderdelen ][ref1], of

      b. gedeputeerde staten van oordeel zijn dat het nemen van een verkeersbesluit noodzakelijk is ter bescherming van
      de belangen, bedoeld in [artikel 2, tweede lid][ref2].

      3 Gedeputeerde staten dienen voorafgaande aan het geven van een aanwijzing als bedoeld in het eerste lid overleg te
      voeren met het betrokken bestuur.

      4 Het betrokken bestuur is verplicht een aanwijzing als bedoeld in het eerste lid op te volgen en uit te voeren.

      5 Indien een aanwijzing als bedoeld in het eerste lid niet wordt opgevolgd of uitgevoerd, gaan gedeputeerde staten
      op kosten van het betrokken bestuur tot het nemen van het verkeersbesluit en zo nodig tot de uitvoering daarvan
      over.

      6 Bij algemene maatregel van bestuur worden regels vastgesteld over de totstandkoming en de inhoud van de in het
      eerste lid bedoelde aanwijzingen alsmede over hetgeen verder voor de uitvoering van dit artikel noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel19
