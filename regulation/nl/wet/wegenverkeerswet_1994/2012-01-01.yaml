  - number: '76'
    text: |-
      1 Bij de aanvraag van een keuringsrapport dient de aanvrager de bij algemene maatregel van bestuur vastgestelde
      bescheiden over te leggen en inlichtingen te verschaffen.

      2 De aanvrager dient het motorrijtuig of de aanhangwagen waarvoor de afgifte van een keuringsrapport wordt
      verlangd, overeenkomstig bij algemene maatregel van bestuur vast te stellen regels ten behoeve van de afgifte
      van dat bewijs ter beschikking te stellen van degene die ingevolge [artikel 78][ref1] met de afgifte van
      keuringsrapporten is belast.

      3 Bij ministeriële regeling kunnen regels worden vastgesteld omtrent de wijze waarop wordt onderzocht of een
      voertuig voldoet aan de in [artikel 75][ref2] bedoelde eisen, alsmede omtrent hetgeen verder met betrekking tot de
      behandeling van de aanvraag van een keuringsrapport noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel76
