  - number: '179'
    text: |-
      1 Bij veroordeling van de bestuurder van een motorrijtuig wegens overtreding van de
      [artikelen 6][ref1], [7, eerste lid][ref2], [8][ref3], [9][ref4], [162, derde lid][ref5], of
      [163, tweede, zesde, achtste of negende lid][ref6], kan hem de bevoegdheid tot het besturen van motorrijtuigen voor
      ten hoogste vijf jaren worden ontzegd.

      2 Bij veroordeling van de bestuurder van een motorrijtuig wegens overtreding van de [artikelen 5][ref7],
      [10, eerste lid][ref8], [12, eerste lid][ref9], [41, eerste lid][ref10], [51, eerste lid][ref11], [61][ref12],
      [74][ref13] of [114][ref14], dan wel van de eigenaar of houder van een motorrijtuig of een aanhangwagen wegens
      overtreding van [artikel 165, eerste lid][ref15], of [artikel 166, eerste lid][ref16], kan hem de bevoegdheid tot
      het besturen van motorrijtuigen voor ten hoogste twee jaren worden ontzegd.

      3 Bij veroordeling van de bestuurder van een motorrijtuig wegens overtreding van het bepaalde krachtens deze wet
      kan hem in die gevallen, waarin dit bij algemene maatregel van bestuur is bepaald, de bevoegdheid tot het besturen
      van motorrijtuigen voor ten hoogste twee jaren worden ontzegd.

      4 Indien tijdens het plegen van een der strafbare feiten in het eerste lid genoemd, nog geen vijf jaren zijn
      verlopen na het einde van de tijdsduur waarvoor bij een vroegere onherroepelijke veroordeling wegens een van
      die strafbare feiten de betrokkene de bevoegdheid tot het besturen van motorrijtuigen is ontzegd, kan hem die
      bevoegdheid voor ten hoogste tien jaren worden ontzegd.

      5 Indien tijdens het plegen van een der strafbare feiten in het tweede lid genoemd of krachtens deze wet
      aangewezen, nog geen twee jaren zijn verlopen na het einde van de tijdsduur waarvoor bij een vroegere
      onherroepelijke veroordeling wegens een van die strafbare feiten of wegens een der in het eerste lid bedoelde
      strafbare feiten de betrokkene de bevoegdheid tot het besturen van motorrijtuigen is ontzegd, kan hem die
      bevoegdheid voor ten hoogste vier jaren worden ontzegd.

      6 Bij het opleggen van de bijkomende straf, bedoeld in het eerste tot en met het vijfde lid, wordt de tijd
      gedurende welke het rijbewijs van de veroordeelde ingevolge [artikel 164][ref17] vóór het tijdstip waarop de
      bijkomende straf ingaat, ingevorderd of ingehouden is geweest, op de duur van die straf geheel in mindering
      gebracht.

      7 Voor de toepassing van dit artikel wordt met de bestuurder van een motorrijtuig gelijkgesteld degene die
      overeenkomstig de in [artikel 1, eerste lid, onderdeel n][ref18], bedoelde voorwaarde geacht wordt het motorrijtuig
      onder onmiddellijk toezicht van de bestuurder te besturen.

      8 Voor de toepassing van het zesde lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door het
      daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.

      9 Voor de toepassing van dit artikel wordt een strafbeschikking met een veroordeling gelijkgesteld.

      10 Voor de toepassing van het vierde onderscheidenlijk het vijfde lid, wordt onder vroegere onherroepelijke
      veroordeling mede verstaan een vroegere onherroepelijke veroordeling door een strafrechter in een andere lidstaat
      van de Europese Unie wegens feiten soortgelijk aan de feiten, bedoeld in het vierde onderscheidenlijk het vijfde
      lid.


