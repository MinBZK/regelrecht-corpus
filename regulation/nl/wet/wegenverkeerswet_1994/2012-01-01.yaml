        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: '127'
    text: |-
      1 Aan autoriteiten die betrokken zijn bij de uitvoering van deze wet of die zijn belast met de handhaving van de
      bij of krachtens deze wet vastgestelde voorschriften, worden op de door de Dienst Wegverkeer te bepalen wijze uit
      het register desgevraagd de gegevens verstrekt die zij voor de uitoefening van hun taak behoeven.

      2 Aan bij algemene maatregel van bestuur aangewezen autoriteiten die betrokken zijn bij de uitvoering van een
      andere wet dan deze wet of zijn belast met de handhaving van de bij of krachtens een andere wet dan deze wet
      gestelde voorschriften, worden in de bij algemene maatregel van bestuur te bepalen gevallen op de door de Dienst
      Wegverkeer te bepalen wijze desgevraagd de gegevens verstrekt die zij voor de uitoefening van hun taak behoeven.

      3 Aan de met de afgifte van rijbewijzen belaste autoriteiten buiten Nederland worden in de bij algemene maatregel
      van bestuur te bepalen gevallen op de door de Dienst Wegverkeer te bepalen wijze en tegen betaling van het door
      deze dienst vastgestelde tarief, inlichtingen uit het register verstrekt.

      4 De autoriteiten, bedoeld in het eerste en tweede lid, zijn bevoegd tot het invoeren, wijzigen en verwijderen van
      de bij algemene maatregel van bestuur aangewezen gegevens die van belang zijn voor het bijhouden van het register.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel127
  - number: '128'
    text: |-
      1 Aan belanghebbenden kunnen, overeenkomstig bij algemene maatregel van bestuur vastgestelde regels, op aanvraag
      en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het door deze dienst voor de behandeling
      van de aanvraag vastgestelde tarief, uit het register gegevens worden verstrekt.

      2 Aan andere belanghebbenden dan degenen omtrent wie gegevens in het register zijn opgenomen, worden slechts
      gegevens verstrekt omtrent de afgifte en de geldigheid van rijbewijzen.

      3 Bij ministeriële regeling kan worden bepaald dat het verstrekken van gegevens aan belanghebbenden niet of slechts
      tot een beperkt aantal of in beperkte vorm of omvang geschiedt.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel128
  - number: '129'
    text: |-
      De Dienst Wegverkeer stelt ten aanzien van het verwerken van gegevens als bedoeld in
      [artikel 126, tweede lid][ref1], een reglement vast.


