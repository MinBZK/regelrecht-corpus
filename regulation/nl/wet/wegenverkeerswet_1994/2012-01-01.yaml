  - number: '173'
    text: |-
      1 Bij algemene maatregel van bestuur worden:

      a. de soorten van de in [artikel 170, eerste lid, onderdeel c][ref1], bedoelde weggedeelten en wegen aangewezen;

      b. nadere regels vastgesteld over de registratie van gegevens in geval van toepassing van
      [artikel 170, eerste lid][ref2];

      c. nadere regels vastgesteld over de berekening van de kosten, verbonden aan de oplegging van een last onder
      bestuursdwang, en

      d. de overige regels vastgesteld die voor de uitvoering van de [artikelen 170 tot en met 172][ref3] nodig worden
      geacht.

      2 Bij gemeentelijke verordening worden nadere regels gesteld ter uitvoering van de
      [artikelen 170 tot en met 172][ref4] en de in het eerste lid bedoelde algemene maatregel van bestuur. Die regels
      betreffen in elk geval

      a. de aanwijzing van de plaats, onderscheidenlijk de plaatsen, waar verwijderde voertuigen in bewaring worden
      gesteld, en

      b. de berekening van de kosten, verbonden aan de oplegging van een last onder bestuursdwang, en voorts

      c. de aanwijzing van de weggedeelten en wegen, voor de bevoegdheid tot oplegging van een last onder bestuursdwang,
      bedoeld in artikel [170, eerste lid, onderdeel c][ref5].


