        paragraaf: '2'
  - number: 4y
    text: Het Besluit voorschrift informatiebeveiliging rijksdienst 1994 is van toepassing op de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4y
  - number: 4z
    text: |-
      1 Het CBR verstrekt desgevraagd aan Onze Minister de inlichtingen die deze ten behoeve van zijn taakuitoefening
      nodig oordeelt. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.

      2 Onze Minister kan aan het CBR aanwijzingen van algemene aard geven met betrekking tot de uitvoering van de
      [artikelen 130 tot en met 134a][ref1] en [149, tweede lid, onderdeel a][ref2].

      3 Indien het CBR naar het oordeel van Onze Minister zijn taak ernstig verwaarloost of in gevaar brengt, kan Onze
      Minister, gehoord het CBR, de noodzakelijke voorzieningen treffen.

      4 Over de uitoefening van het toezicht op het CBR door Onze Minister kunnen bij of krachtens algemene maatregel van
      bestuur nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel149
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel4z
