  - number: '9'
    text: |-
      1 Het is degene die weet of redelijkerwijs moet weten dat hem bij rechterlijke uitspraak of strafbeschikking de
      bevoegdheid tot het besturen van motorrijtuigen is ontzegd, verboden gedurende de tijd dat hem die bevoegdheid is
      ontzegd, op de weg een motorrijtuig te besturen of als bestuurder te doen besturen.

      2 Het is degene die weet of redelijkerwijs moet weten dat een op zijn naam gesteld rijbewijs voor een of meer
      categorieën van motorrijtuigen dan wel voor een gedeelte van de geldigheidsduur ongeldig is verklaard of zijn
      geldigheid overeenkomstig [artikel 123b, eerste lid][ref1], heeft verloren, indien aan hem daarna geen ander
      rijbewijs voor het besturen van een motorrijtuig van de betrokken categorie of categorieën is afgegeven, verboden
      op de weg een motorrijtuig van die categorie of categorieën dan wel gedurende dat gedeelte van de geldigheidsduur
      te besturen of als bestuurder te doen besturen.

      3 Het tweede lid geldt niet ten aanzien van de bestuurder van een motorrijtuig gedurende de tijd dat aan hem ter
      verkrijging van een rijbewijs voor de categorie of categorieën van motorrijtuigen waarop de ongeldigverklaring
      betrekking heeft, rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref2] wordt gegeven en
      gedurende de tijd dat door hem een rijproef wordt afgelegd in het kader van een onderzoek, door of vanwege de
      overheid ingesteld, naar zijn rijvaardigheid of geschiktheid.

      4 Het is degene van wie ingevolge [artikel 130, tweede lid][ref3], de overgifte van een op zijn naam gesteld
      rijbewijs is gevorderd, dan wel wiens rijbewijs is ingevorderd en aan wie dat bewijs niet is teruggegeven, verboden
      op de weg een motorrijtuig van de categorie of categorieën waarvoor dat bewijs was afgegeven, te besturen of als
      bestuurder te doen besturen.

      5 Het is degene die weet of redelijkerwijs moet weten dat de geldigheid van een op zijn naam gesteld rijbewijs
      ingevolge [artikel 131, derde lid, onderdeel a][ref4], voor een of meer categorieën van motorrijtuigen is
      geschorst, verboden gedurende de tijd dat de schorsing van kracht is, op de weg een motorrijtuig van de categorie
      of categorieën waarop de schorsing betrekking heeft, te besturen of als bestuurder te doen besturen.

      6 Het vierde en het vijfde lid gelden niet ten aanzien van de bestuurder van een motorrijtuig gedurende de
      tijd dat door hem een rijproef wordt afgelegd in het kader van een ingevolge [artikel 131, eerste lid][ref5],
      gevorderd onderzoek. Voorts geldt het vijfde lid niet ten aanzien van de bestuurder van een motorrijtuig
      gedurende de tijd dat aan hem, ter voorbereiding op een onderzoek naar de rijvaardigheid in het kader
      van een ingevolge [artikel 133, eerste lid][ref6], gevorderd onderzoek, rijonderricht in de zin van de
      [Wet rijonderricht motorrijtuigen 1993][ref7] wordt gegeven.

      7 Het is degene van wie ingevolge [artikel 164][ref8] de overgifte van een op zijn naam gesteld rijbewijs, een hem
      door het daartoe bevoegde gezag buiten Nederland afgegeven rijbewijs of een internationaal rijbewijs is gevorderd,
      dan wel van wie zodanig bewijs is ingevorderd en aan wie dat bewijs niet is teruggegeven, verboden op de weg een
      motorrijtuig van de categorie of categorieën waarvoor dat bewijs was afgegeven, te besturen of als bestuurder te
      doen besturen.

      8 Het is degene van wie ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref9] de
      inlevering van het rijbewijs is gevorderd, dan wel wiens rijbewijs krachtens die wet is ingenomen, verboden op de
      weg een motorrijtuig, voor het besturen waarvan het rijbewijs is afgegeven, te besturen of als bestuurder te doen
      besturen met ingang van het tijdstip, bedoeld in [artikel 30, eerste lid, van die wet][ref10].

      9 Het is degene die op grond van [artikel 132c, eerste lid, onderdeel d][ref11], de feitelijke beschikking heeft
      gekregen over een rijbewijs waarop de bij ministeriële regeling vastgestelde codering voor deelname aan het
      alcoholslot is vermeld, verboden een motorrijtuig, niet zijnde een bromfiets, te besturen:

      a. dat niet is voorzien van een alcoholslot als bedoeld in [artikel 132e, eerste lid][ref12],

      b. waarvan het kenteken in het in [artikel 129a][ref13] bedoelde register aan hem is gekoppeld, terwijl het
      motorrijtuig is voorzien van een niet-werkend alcoholslot als bedoeld in [artikel 132e, eerste lid][ref14],

      c. waarin wel een alcoholslot als bedoeld in [artikel 132e, eerste lid][ref15], is ingebouwd, maar waarvan het
      kenteken in het in [artikel 129a][ref16] bedoelde register niet aan hem is gekoppeld, of

      d. terwijl een ander dan de bestuurder heeft geblazen in het alcoholslot als bedoeld in
      [artikel 132e, eerste lid][ref17], een en ander tot het tijdstip waarop hij na beëindiging van het
      alcoholslotprogramma overeenkomstig [artikel 132d, eerste of derde lid][ref18], overeenkomstig de daarvoor
      bij algemene maatregel van bestuur vastgestelde regels een rijbewijs zonder de voor deelname aan het
      alcoholslotprogramma vastgestelde codering heeft verkregen.

      10 Voor de toepassing van het tweede, vierde, vijfde, zesde en achtste lid wordt onder rijbewijs mede verstaan een
      rijbewijs, afgegeven door het daartoe bevoegde gezag buiten Nederland.


