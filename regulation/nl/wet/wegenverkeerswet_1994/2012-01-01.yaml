  - number: 151i
    text: |-
      1 De houder van een getuigschrift van vakbekwaamheid of een getuigschrift van nascholing dat zijn geldigheid heeft
      verloren doordat het niet binnen de in de richtlijn vakbekwaamheid bestuurders bedoelde termijn na afgifte is
      aangevuld met een met goed gevolg voltooide nascholing kan een nieuw getuigschrift van nascholing verwerven door de
      nascholing met goed gevolg te voltooien.

      2 De houder van een certificaat als bedoeld in [artikel 151g, vierde lid][ref1], dat zijn geldigheid heeft verloren
      doordat het niet binnen de op het certificaat vermelde periode van geldigheid is gebruikt om de in de richtlijn
      vakbekwaamheid bestuurders bedoelde communautaire code op een rijbewijs of een kwalificatiekaart bestuurder te
      laten vermelden, kan een nieuw certificaat verwerven door de nascholing met goed gevolg te voltooien.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
