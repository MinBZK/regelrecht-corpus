  - number: '181'
    text: |-
      1 Indien een bij of krachtens deze wet als overtreding strafbaar gesteld feit wordt begaan door een bij de
      ontdekking van het feit onbekend gebleven bestuurder van een motorrijtuig, kunnen de op het feit gestelde straffen
      worden opgelegd aan de eigenaar of houder van dat motorrijtuig voor zover deze niet reeds naast de bestuurder voor
      dat feit aansprakelijk is.

      2 Het eerste lid geldt bij een strafbeschikking niet, indien de eigenaar of houder:

      a. voor het uitvaardigen van de strafbeschikking de naam en het volledige adres van de bestuurder bekend heeft
      gemaakt,

      b. niet heeft kunnen vaststellen wie de bestuurder was en hem daarvan redelijkerwijs geen verwijt kan worden
      gemaakt.

      3 Het eerste lid geldt bij berechting niet, indien de eigenaar of houder:

      a. binnen twee weken na daartoe door een der in [artikel 159][ref1] bedoelde personen in de gelegenheid te zijn
      gesteld dan wel bij het instellen van verzet tegen een strafbeschikking, de naam en het volledige adres van de
      bestuurder heeft bekend gemaakt;

      b. uiterlijk op de dag vóór die der terechtzitting, schriftelijk en onder vermelding van de zaak en de dag der
      terechtzitting, de naam en het volledige adres van de bestuurder aan het openbaar ministerie bekend maakt;

      c. tijdens de terechtzitting, dadelijk na de ondervraging, bedoeld in
      [artikel 273, eerste lid, van het Wetboek van Strafvordering][ref2], de naam en het volledige adres van de
      bestuurder bekend maakt;

      d. niet heeft kunnen vaststellen wie de bestuurder was en hem daarvan redelijkerwijs geen verwijt kan worden
      gemaakt.

      4 Op straffe van nietigheid wijst de dagvaarding op het derde lid, onderdelen b en c. De strafbeschikking wijst de
      verdachte op de mogelijkheid bij het instellen van verzet gegevens te verstrekken die tot toepassing van het derde
      lid, onderdeel a of d, kunnen leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel273
