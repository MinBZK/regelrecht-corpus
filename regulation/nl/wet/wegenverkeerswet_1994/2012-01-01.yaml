  - number: '185'
    text: |-
      1 Indien een motorrijtuig waarmee op de weg wordt gereden, betrokken is bij een verkeersongeval waardoor schade
      wordt toegebracht aan, niet door dat motorrijtuig vervoerde, personen of zaken, is de eigenaar van het motorrijtuig
      of - indien er een houder van het motorrijtuig is - de houder verplicht om die schade te vergoeden, tenzij
      aannemelijk is dat het ongeval is te wijten aan overmacht, daaronder begrepen het geval dat het is veroorzaakt door
      iemand, voor wie onderscheidenlijk de eigenaar of de houder niet aansprakelijk is.

      2 De eigenaar of houder die het motorrijtuig niet zelf bestuurt, is aansprakelijk voor de gedragingen van degene
      door wie hij dat motorrijtuig doet of laat rijden.

      3 Het eerste en het tweede lid vinden geen toepassing ten aanzien van schade, door een motorrijtuig toegebracht aan
      loslopende dieren, aan een ander motorrijtuig in beweging of aan personen en zaken die daarmee worden vervoerd.

      4 Dit artikel laat onverkort de uit andere wettelijke bepalingen voortvloeiende aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel185
  - number: '186'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor een periode van ten hoogste zes
      jaar ten behoeve van experimenten met:

      a. verkeerstekens en maatregelen op of aan de weg;

      b. de eisen ten aanzien van voertuigen waarmee over de weg wordt gereden of voertuigen die op de weg staan;

      c. de eisen ten aanzien van rijvaardigheid en rijbevoegdheid.

      Daarbij kan worden afgeweken van [hoofdstuk II, paragraaf 2][ref1], [hoofdstuk V, paragraaf 1][ref2] en
      [hoofdstuk VI][ref3] van deze wet en van [hoofdstuk VI van de Wet geluidhinder][ref4], alsmede van de krachtens die
      paragrafen of die hoofdstukken gestelde regels, een en ander met inachtneming van verdragen en van besluiten van
      volkenrechtelijke organisaties of van één of meer instellingen van de Europese Unie, al dan niet gezamenlijk.

      2 In de in het eerste lid bedoelde algemene maatregel van bestuur wordt in elk geval bepaald:

      a. van welke van de in het eerste lid bedoelde bepalingen wordt afgeweken;

      b. het resultaat dat met een experiment, als bedoeld in het eerste lid, wordt beoogd.

      3 Onze Minister zendt uiterlijk zes maanden voor de beëindiging van een experiment, als bedoeld in het eerste lid,
      een verslag over de doeltreffendheid en de effecten ervan alsmede een standpunt inzake de voortzetting anders dan
      als experiment, aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0006622#HoofdstukVI
      [ref4]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
