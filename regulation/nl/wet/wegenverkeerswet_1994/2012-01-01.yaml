  - number: '37'
    text: |-
      1 [Artikel 36][ref1] is niet van toepassing op:

      a. de volgende categorieën motorrijtuigen alsmede de door die motorrijtuigen voortbewogen aanhangwagens:

      1°. bij algemene maatregel van bestuur vastgestelde categorieën bromfietsen, alsmede bromfietsen in het
      internationaal verkeer, afkomstig uit een land waar voor deze voertuigen geen kenteken is opgegeven,

      2°. landbouw- of bosbouwtrekkers,

      3°. gehandicaptenvoertuigen en

      4°. motorrijtuigen met beperkte snelheid;

      b. in het buitenland geregistreerde motorrijtuigen en aanhangwagens, die zich in het internationaal verkeer
      bevinden, mits ter zake van de registratie van het betrokken voertuig door het daartoe bevoegde gezag in het
      buitenland een bewijs is afgegeven dat voldoet aan de daaraan gestelde eisen in de tussen Nederland en het
      betrokken land van kracht zijnde internationale overeenkomst en het betrokken voertuig voldoet aan de eisen die in
      die overeenkomst dan wel bij algemene maatregel van bestuur ter uitvoering van die overeenkomst aan dat voertuig
      worden gesteld met betrekking tot de toelating tot het internationaal verkeer;

      c. motorrijtuigen en aanhangwagens, mits wordt voldaan aan nadere bij ministeriële regeling vast te stellen regels,
      die in eigendom toebehoren aan of worden gehouden door:

      1°. leden van een bij ministeriële regeling aangewezen krijgsmacht of civiele dienst in de zin van artikel I
      van het op 19 juni 1951 te Londen gesloten Verdrag tussen de landen die partij zijn bij het Noord-Atlantisch
      Verdrag nopens de rechtspositie van hun krijgsmachten (Trb. 1953, 10), dan wel in de zin van artikel 3 van het
      bij evenbedoeld verdrag behorende, op 28 augustus 1952 te Parijs gesloten, protocol nopens de rechtspositie van
      internationale militaire hoofdkwartieren ingesteld uit hoofde van het Noord-Atlantisch Verdrag (Trb. 1953, 11),
      alsmede

      2°. functionarissen van de Noord-Atlantische Verdragsorganisatie die in Nederland zijn op grond van de
      briefwisseling tussen de regering van het Koninkrijk der Nederlanden en de Noord-Atlantische Verdragsorganisatie
      van 31 augustus en 11 september 1979 (Trb.1979, 159) en op wie het Verdrag nopens de rechtspositie van de Noord-
      Atlantische Verdragsorganisatie, van de nationale vertegenwoordigers bij haar organen en van haar internationale
      staf (Trb.1951, 139), van toepassing is.

      2 Voor aanhangwagens met een toegestane maximum massa van niet meer dan 750 kg alsmede voor aanhangwagens met een
      toegestane maximum massa van meer dan 750 kg, afkomstig uit een land waar voor deze aanhangwagens geen afzonderlijk
      kenteken is opgegeven, geldt het vereiste dat een kenteken dient te zijn opgegeven niet. Indien een dergelijke
      aanhangwagen is verbonden met een in Nederland geregistreerd motorrijtuig, dient die aanhangwagen te zijn voorzien
      van het kenteken dat is opgegeven voor dat motorrijtuig.

      3 Voor motorrijtuigen en aanhangwagens, die behoren tot de bedrijfsvoorraad van een natuurlijke persoon of
      rechtspersoon aan wie een erkenning als bedoeld in [artikel 62][ref2] is verleend of die voor herstel of bewerking
      ter beschikking zijn gesteld van een natuurlijke persoon of rechtspersoon, geldt het vereiste dat een kenteken
      voor een bepaald voertuig dient te zijn opgegeven niet, mits overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels gebruik wordt gemaakt van een bij algemene maatregel van bestuur aangewezen, door de Dienst
      Wegverkeer aan die natuurlijke persoon of rechtspersoon dan wel aan een natuurlijke persoon of rechtspersoon aan
      wie een erkenning als bedoeld in [artikel 62][ref3] is verleend en die het voertuig ten behoeve van eerstbedoelde
      natuurlijke persoon of rechtspersoon ten verkoop voorhanden heeft, opgegeven kenteken. De Dienst Wegverkeer kan aan
      deze opgaven voorschriften verbinden. Bij ministeriële regeling kunnen met betrekking tot die voorschriften regels
      worden vastgesteld. Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen het gebruik van een
      zodanig kenteken verplicht is.

      4 Met het toezicht op de naleving van de uit het derde lid voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de Staatscourant. Het toezicht heeft in ieder geval betrekking op het gebruik van het in het derde lid bedoelde
      kenteken. De aldaar bedoelde natuurlijke persoon of rechtspersoon is gehouden tot betaling, op de door de Dienst
      Wegverkeer vastgestelde wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde
      tarief. Bij ministeriële regeling worden nadere regels omtrent het toezicht vastgesteld.

      5 Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat:

      a. in bepaalde uitzonderingsgevallen tijdelijk wordt of kan worden afgeweken van het in
      [artikel 36, derde lid, onderdeel b of c][ref4], bepaalde;

      b. een motorrijtuig of een aanhangwagen op de weg mag staan, indien het voor het betrokken voertuig afgegeven
      kentekenbewijs ongeldig is verklaard ingevolge [artikel 58, tweede lid, onderdeel b, c, d of f][ref5], dan wel is
      ingevorderd overeenkomstig [artikel 60][ref6].

      6 Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de omschrijving van de in het eerste
      lid, onderdeel a, bedoelde categorieën voertuigen alsmede de voor die categorieën vastgestelde maximumsnelheid.

      7 Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het derde lid en kunnen nadere
      regels worden vastgesteld ter uitvoering van het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel62
