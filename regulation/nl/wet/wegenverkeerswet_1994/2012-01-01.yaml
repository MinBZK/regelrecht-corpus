  - number: '24'
    text: Bij ministeriële regeling wordt bepaald wanneer een typegoedkeuring vervalt.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel24
  - number: '25'
    text: |-
      1 De Dienst Wegverkeer trekt een typegoedkeuring in, indien degene aan wie de goedkeuring is verleend, daarom
      verzoekt.

      2 De Dienst Wegverkeer kan een typegoedkeuring intrekken, indien:

      a. degene aan wie de goedkeuring is verleend een voertuig, systeem, onderdeel, technische eenheid, uitrustingstuk
      of voorziening ter bescherming van weggebruikers en passagiers doet of laat doorgaan voor goedgekeurd, terwijl
      dat voertuig, dat systeem, dat onderdeel, die technische eenheid, dat uitrustingstukken of die voorziening ter
      bescherming van weggebruikers en passagiers niet overeenstemt met het type waarvoor de goedkeuring is verleend,

      b. degene aan wie de goedkeuring is verleend, de verplichting, vervat in [artikel 23, tweede lid][ref1], niet
      nakomt,

      c. degene aan wie de goedkeuring is verleend, handelt in strijd met een of meer andere uit de goedkeuring
      voortvloeiende verplichtingen, of

      d. blijkt dat de goedkeuring ten onrechte is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel23
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel25
