  - number: '125'
    text: |-
      1 Indien het rijbewijs niet voor alle categorieën waarvoor het is afgegeven, ongeldig is verklaard dan wel indien
      de ongeldigverklaring betrekking heeft op een deel van de geldigheidsduur, wordt door degene die is belast met de
      afgifte van rijbewijzen een nieuw rijbewijs afgegeven dat geldig is voor de categorie of categorieën of voor dat
      deel van de geldigheidsduur waarop de ongeldigverklaring geen betrekking heeft.

      2 Indien de ongeldigverklaring verband houdt met de noodzaak de rijbevoegdheid die voortvloeit uit een of meer
      categorieën waarvoor het rijbewijs is afgegeven, te beperken door het stellen van eisen aan het motorrijtuig of
      aan de bestuurder daarvan, wordt door degene die is belast met de afgifte van rijbewijzen een nieuw rijbewijs
      afgegeven waarin de noodzakelijk geachte beperkingen ten aanzien van de rijbevoegdheid zijn aangeduid met een bij
      ministeriële regeling vastgestelde codering.

      3 Voor de toepassing van het eerste en het tweede lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven
      door het daartoe bevoegde gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere Staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in
      Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel125
  - number: '126'
    text: |-
      1 De Dienst Wegverkeer houdt een register betreffende de afgifte van rijbewijzen.

      2 In het kader van het register verwerkt de Dienst Wegverkeer gegevens, voor zover deze gegevens noodzakelijk
      zijn voor een goede uitvoering van deze wet en voor de handhaving van de bij of krachtens deze wet vastgestelde
      voorschriften, omtrent:

      a. de rijvaardigheid en geschiktheid van de aanvrager;

      b. de aanvraag van rijbewijzen;

      c. afgegeven rijbewijzen;

      d. de op het rijbewijs te vermelden getuigschriften van vakbekwaamheid en getuigschriften van nascholing;

      e. afgegeven certificaten als bedoeld in [artikel 151g, vierde lid][ref1];

      f. rechterlijke uitspraken houdende ontzegging van de bevoegdheid tot het besturen van motorrijtuigen;

      g. een opgelegd alcoholslotprogramma;

      h. de gezondheid van de aanvrager.

      3 Het verzamelen van gegevens als bedoeld in het tweede lid, geschiedt voor de volgende doeleinden:

      a. voor een goede uitvoering van deze wet en

      b. voor de handhaving van de bij of krachtens deze wet vastgestelde voorschriften.

      4 De Dienst Wegverkeer mag strafrechtelijke gegevens, gegevens ter vaststelling van mogelijk strafbaar gedrag en
      gegevens over onrechtmatig of hinderlijk gedrag in verband met een opgelegd verbod naar aanleiding van dat gedrag,
      verwerken voor zover dit verband houdt met de in het derde lid genoemde doeleinden.

      5 Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de inrichting en het beheer van het
      register.

      6 Voor de toepassing van het tweede lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door het
      daartoe bevoegde gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere Staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in Nederland
      woonachtig is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel126
    references:
