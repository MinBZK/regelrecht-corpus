    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel61
  - number: '62'
    text: |-
      1 De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is motorrijtuigen en aanhangwagens, waarvan hij de eigendom heeft verkregen, in zijn bedrijfsvoorraad op
      te nemen.

      2 Aan de erkenning kunnen bij algemene maatregel van bestuur aangewezen bevoegdheden worden verbonden; een
      zodanige bevoegdheid maakt deel uit van de erkenning. Het in de [artikelen 62 tot en met 66][ref1] ten aanzien van
      erkenningen bepaalde is van overeenkomstige toepassing op bedoelde bevoegdheden.

      3 De erkenning geldt voor de in de erkenning aangewezen groep of groepen van voertuigen en kan gelden voor bepaalde
      of voor onbepaalde tijd.

      4 Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en
      kunnen met betrekking tot die voorschriften regels worden vastgesteld.

      5 De in [artikel 50, eerste lid, aanhef][ref2] bedoelde verplichting om bij de aanvraag van een kentekenbewijs
      persoonlijk te verschijnen bij een bij ministeriële regeling aangewezen instantie, geldt niet voor natuurlijke
      personen of rechtspersonen aan wie een erkenning als bedoeld in het eerste lid is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel50
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel62
