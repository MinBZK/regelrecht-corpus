  - number: '164'
    text: |-
      1 Op de eerste vordering van de in [artikel 159, onderdelen a en b][ref1], bedoelde personen is de bestuurder van
      een motorrijtuig, tegen wie door een van die personen proces-verbaal wordt opgemaakt ter zake van overtreding van
      een bij of krachtens deze wet vastgesteld voorschrift, verplicht tot overgifte van het hem afgegeven rijbewijs
      dan wel het hem door het daartoe bevoegde gezag buiten Nederland afgegeven rijbewijs en, indien hem daar een
      internationaal rijbewijs is afgegeven, dat bewijs.

      2 De in het eerste lid bedoelde vordering wordt gedaan in geval van overtreding van:

      a. [artikel 8][ref2], indien bij een onderzoek als bedoeld in het tweede lid, van die bepaling blijkt of, bij
      ontbreken van een dergelijk onderzoek, een ernstig vermoeden bestaat dat het alcoholgehalte van de adem van de
      bestuurder hoger is dan 570 microgram alcohol per liter uitgeademde lucht, onderscheidenlijk het alcoholgehalte van
      het bloed van de bestuurder hoger blijkt te zijn dan 1,3 milligram alcohol per milliliter bloed;

      b. [artikel 8][ref3], indien bij een onderzoek als bedoeld in het derde of vierde lid van die bepaling blijkt of,
      bij het ontbreken van een dergelijk onderzoek, een ernstig vermoeden bestaat dat het alcoholgehalte van de adem van
      de bestuurder hoger is dan 350 microgram alcohol per liter uitgeademde lucht, onderscheidenlijk het alcoholgehalte
      van het bloed van de bestuurder hoger blijkt te zijn dan 0,8 milligram alcohol per milliliter bloed;

      c. [artikel 163, tweede, zesde, achtste of negende lid][ref4];

      d. overschrijding van een krachtens deze wet vastgestelde maximumsnelheid met vijftig kilometer of meer, door een
      bestuurder van een motorrijtuig anders dan een bromfiets, in geval van staandehouding van de bestuurder;

      e. overschrijding van een krachtens deze wet vastgestelde maximumsnelheid met dertig kilometer of meer door een
      bestuurder van een bromfiets, in geval van staandehouding van de bestuurder.

      3 De in het eerste lid bedoelde vordering kan worden gedaan indien door de overtreding de veiligheid op de weg
      ernstig in gevaar is gebracht.

      4 De ingevorderde bewijzen worden tegelijk met het proces-verbaal onverwijld opgezonden aan de officier van
      justitie. In de gevallen bedoeld in het tweede lid, onderdeel a, b, d, of e, of indien op grond van andere feiten
      of omstandigheden ernstig rekening moet worden gehouden met de mogelijkheid dat de bestuurder opnieuw een feit
      als bedoeld in het tweede of derde lid zal begaan, is de officier van justitie bevoegd de ingevorderde bewijzen
      onder zich te houden totdat de strafbeschikking onherroepelijk is geworden, de rechterlijke uitspraak in kracht van
      gewijsde is gegaan of, indien bij die strafbeschikking of uitspraak de bestuurder de bevoegdheid tot het besturen
      van motorrijtuigen onvoorwaardelijk is ontzegd, tot het tijdstip waarop de ontzegging is verstreken.

      5 De officier van justitie is bevoegd de toepassing van de in het vierde lid bedoelde bevoegdheid te schorsen
      indien:

      a. de geldigheid van de bewijzen ingevolge [artikel 131, derde lid, onderdeel a][ref5], voor alle categorieën van
      motorrijtuigen waarvoor zij zijn afgegeven, wordt geschorst;

      b. de bewijzen ingevolge [artikel 124][ref6] voor alle categorieën van motorrijtuigen waarvoor zij zijn afgegeven,
      ongeldig worden verklaard voor een bepaald deel van de geldigheidsduur;

      c. een rechterlijke uitspraak of strafbeschikking waarbij de bevoegdheid tot het besturen van motorrijtuigen is
      ontzegd, voor tenuitvoerlegging vatbaar is geworden.

      De schorsing duurt voort zolang de bewijzen ingevolge de onderdelen a, b en c ongeldig zijn.

      6 Indien de officier van justitie binnen tien dagen na de dag van invordering niet gebruik maakt van de
      in het vierde lid bedoelde bevoegdheid, geeft hij de ingevorderde bewijzen onverwijld terug aan de houder.
      Teruggave vindt eveneens plaats, indien ernstig rekening moet worden gehouden met de mogelijkheid dat aan
      de houder in geval van veroordeling door de rechter dan wel uitvaardiging van een strafbeschikking geen
      onvoorwaardelijke ontzegging van de bevoegdheid tot het besturen van motorrijtuigen zal worden opgelegd,
      dan wel geen onvoorwaardelijke ontzegging van langere duur dan de tijd gedurende welke de bewijzen zijn
      ingevorderd of ingehouden geweest. Teruggave vindt ten slotte plaats indien het onderzoek van de zaak op de
      terechtzitting niet binnen zes maanden na de dag van invordering is aangevangen, dan wel binnen die termijn geen
      strafbeschikking is uitgevaardigd. Het rijbewijs wordt niet aan betrokkene teruggegeven, indien het een rijbewijs
      betreft waarvan ingevolge een der [artikelen 130, tweede lid][ref7], of [164][ref8] de overgifte is gevorderd,
      waarvan ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref9] de inlevering is
      gevorderd of ten aanzien waarvan ingevolge een der [artikelen 120, derde lid][ref10], [124, vierde lid][ref11],
      [131, tweede lid, onderdeel b][ref12], [132, vijfde lid][ref13], [132b, tweede lid][ref14],
      [134, vierde lid][ref15], of [180, derde lid][ref16], een verplichting tot inlevering bestaat. Het rijbewijs wordt
      in dat geval doorgeleid naar degene bij wie de houder dat rijbewijs had dienen in te leveren.

      7 In geval van toepassing van het eerste lid kan het motorrijtuig, voor zover geen andere bestuurder
      beschikbaar is of de bestuurder niet aanstonds voldoet aan de vordering, onder toezicht of, voor zover degene
      die het proces-verbaal opmaakt zulks nodig oordeelt, in bewaring worden gesteld. In het laatste geval zijn de
      [artikelen 170, tweede lid, tweede en derde volzin, vierde en vijfde lid][ref17], [171][ref18], [172][ref19]
      en [173, eerste lid, van deze wet][ref20] en de [artikelen 4:116][ref21], [4:118 tot en met 4:124][ref22],
      [5:10][ref23], [5:25, eerste en zesde lid][ref24], [5:29, tweede en derde lid][ref25],
      [5:30, eerste, tweede, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref26] van overeenkomstige
      toepassing. Teruggave van het motorrijtuig vindt slechts plaats indien aan de vordering is voldaan of indien de
      officier van justitie zich niet langer tegen de teruggave verzet.

      8 In geval van toepassing van het eerste of vierde lid kan elke belanghebbende bij klaagschrift daartegen
      opkomen. Zolang in de zaak nog geen vervolging is ingesteld, wordt het klaagschrift ingediend ter griffie
      van de rechtbank in het arrondissement waar het in het eerste lid bedoelde feit werd begaan, en anders
      ter griffie van het gerecht in feitelijke aanleg waarvoor de vervolging plaatsvindt of, in geval van
      verzet tegen een uitgevaardigde strafbeschikking, zou worden voortgezet, dan wel het laatst plaatsvond.
      [Artikel 552a, vierde en zesde lid, van het Wetboek van Strafvordering][ref27] is verder van overeenkomstige
      toepassing. De raadkamer van het gerecht geeft zo spoedig mogelijk, na de belanghebbende, desverlangd bijgestaan
      door diens raadsman, te hebben gehoord, althans opgeroepen, zijn met redenen omklede beslissing, welke onverwijld
      aan de belanghebbende wordt betekend. Tegen de beslissing kan door het openbaar ministerie binnen veertien dagen
      daarna en door de belanghebbende binnen veertien dagen na de betekening beroep in cassatie worden ingesteld. De
      Hoge Raad beslist zo spoedig mogelijk.

      9 Indien de zaak eindigt zonder oplegging van straf of maatregel of met zodanige oplegging, doch op
      grond van een feit waarvoor de toepassing van het eerste of vierde lid niet is toegelaten, kan de rechter
      op verzoek van de gewezen verdachte hem een vergoeding ten laste van de Staat toekennen voor de schade
      die hij ten gevolge van die toepassing heeft geleden. Onder schade is begrepen het nadeel dat niet in
      vermogensschade bestaat. De [artikelen 89, derde tot en met zesde lid][ref28],[ 90][ref29], [91][ref30] en
      [93 van het Wetboek van Strafvordering][ref31] zijn van overeenkomstige toepassing.


