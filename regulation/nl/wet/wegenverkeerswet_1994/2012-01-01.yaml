      1 Het is de eigenaar of houder van een voertuig dat ingevolge [artikel 21, eerste lid][ref1], dient te zijn
      goedgekeurd voor toelating tot het verkeer op de weg verboden dit voertuig te laten staan op de weg of daarmee over
      de weg te rijden alsmede de bestuurder daarmee over de weg te laten rijden, indien het voertuig niet is goedgekeurd
      voor toelating tot het verkeer op de weg.

      2 Het eerste lid is niet van toepassing op een voertuig dat ingevolge [artikel 21, eerste lid][ref2], dient te zijn
      goedgekeurd voor toelating tot het verkeer op de weg, maar waarvoor een kentekenbewijs is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
