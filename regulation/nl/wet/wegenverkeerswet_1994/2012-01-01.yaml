  - number: '180'
    text: |-
      1 Voor wat betreft de bijkomende straf van ontzegging van de bevoegdheid tot het besturen van motorrijtuigen is
      [artikel 557, tweede lid, van het Wetboek van Strafvordering][ref1] op rechterlijke uitspraken niet van toepassing.
      Een strafbeschikking houdende deze bijkomende straf is in zoverre eerst voor tenuitvoerlegging vatbaar als geen
      verzet meer kan worden gedaan.

      2 De rechterlijke uitspraak of strafbeschikking is voor wat betreft de bijkomende straf niet voor tenuitvoerlegging
      vatbaar, zolang de termijn waarvoor de veroordeelde bij een andere rechterlijke uitspraak of strafbeschikking de
      bevoegdheid tot het besturen van motorrijtuigen is ontzegd, nog niet is verstreken.

      3 Indien de rechterlijke uitspraak of strafbeschikking voor wat betreft de bijkomende straf voor tenuitvoerlegging
      vatbaar is geworden, geschiedt de tenuitvoerlegging niet dan nadat aan de veroordeelde in persoon een schrijven
      is uitgereikt, volgens de [artikelen 587][ref2] en [588 van het Wetboek van Strafvordering][ref3], waarin het
      tijdstip van ingang en de duur van de ontzegging, de verplichting tot inlevering van het rijbewijs uiterlijk op dat
      tijdstip, alsmede het gevolg van niet tijdige inlevering worden medegedeeld.

      4 De houder van een rijbewijs is, tenzij het is ingevorderd en niet is teruggegeven, verplicht dat rijbewijs in
      te leveren op het parket van het openbaar ministerie vanwaar hij het schrijven, bedoeld in het derde lid, heeft
      ontvangen, uiterlijk op het tijdstip van ingang van de ontzegging.

      5 Teruggave vindt plaats zodra de termijn van de ontzegging is verstreken. Geen teruggave vindt plaats ten aanzien
      van het rijbewijs of de rijbewijzen waarvan ingevolge een der [artikelen 130, tweede lid][ref4], of [164][ref5] de
      overgifte is gevorderd, waarvan ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref6]
      de inlevering is gevorderd, ten aanzien waarvan ingevolge een der [artikelen 120, derde lid][ref7],
      [124, vierde lid][ref8], [131, tweede lid, onderdeel b][ref9], [132, vijfde lid][ref10], [132b, tweede lid][ref11],
      [134, vierde lid][ref12], of [180, derde lid][ref13], een verplichting tot inlevering bestaat. De officier van
      justitie geleidt in deze gevallen het rijbewijs of de rijbewijzen door naar degene bij wie de houder dat rijbewijs
      of die rijbewijzen had dienen in te leveren. Indien het rijbewijs op grond van [artikel 123b][ref14] ongeldig
      is dan wel indien een aantekening is geplaatst als bedoeld in dat artikel, geleidt de officier van justitie het
      rijbewijs of de rijbewijzen door naar de Dienst Wegverkeer.

      6 De termijn van ontzegging van de bevoegdheid tot het besturen van motorrijtuigen wordt van rechtswege verlengd
      met het aantal dagen dat is verstreken tussen het tijdstip waarop het rijbewijs ingevolge het vierde lid had moeten
      worden ingeleverd en het tijdstip waarop nadien die inlevering heeft plaatsgevonden.

      7 De termijn van de ontzegging wordt voorts verlengd met de tijd dat de veroordeelde gedurende de ontzegging
      rechtens zijn vrijheid is ontnomen.

      8 Voor de toepassing van het derde, vierde, vijfde en zesde lid wordt onder rijbewijs mede verstaan een rijbewijs,
      afgegeven door het daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel557
