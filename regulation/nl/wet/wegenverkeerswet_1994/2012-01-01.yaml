      Wegverkeer vastgestelde wijze, van het daarvoor door deze dienst vastgestelde tarief door deze dienst verleend
      indien het voertuig bij een door de dienst verrichte keuring heeft voldaan aan de bij ministeriële regeling
      vastgestelde eisen met betrekking tot de toelating tot het verkeer op de weg, welke eisen voor verschillende
      groepen van voertuigen verschillend kunnen worden gesteld.

      2 [Artikel 22, derde en vierde lid][ref1], is van overeenkomstige toepassing.


