  - number: '113'
    text: |-
      1 De aanvraag van een rijbewijs dient te geschieden overeenkomstig bij algemene maatregel van bestuur vastgestelde
      regels.

      2 Degene die is belast met de afgifte van rijbewijzen, verschaft zich de nodige zekerheid over de identiteit van
      de aanvrager. Hij is bevoegd te vorderen dat de aanvrager op een door hem te bepalen plaats en tijd persoonlijk
      verschijnt voor een door hem aangewezen persoon.

      3 Degene die is belast met de afgifte van rijbewijzen vergewist zich ervan dat de bij de aanvraag van een rijbewijs
      over te leggen bescheiden aan de daaraan gestelde eisen voldoen en dat ook overigens aan de met betrekking tot de
      aanvraag gestelde voorwaarden wordt voldaan.

      4 Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste tot en met het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel113
  - number: '114'
    text: |-
      Het is verboden voor het verkrijgen van een rijbewijs opzettelijk onjuiste opgaven te doen, onjuiste inlichtingen
      te verschaffen en onjuiste bewijsstukken en andere bescheiden over te leggen.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel114
  - number: '115'
    text: |-
      1 Degene die is belast met de afgifte van rijbewijzen, en die in het kader van de aanvraag of de uitreiking
      van een nieuw rijbewijs of een vervangend rijbewijs de beschikking krijgt over een rijbewijs waarvan ingevolge
      een der [artikelen 130, tweede lid][ref1], of [164][ref2] de overgifte is gevorderd, waarvan ingevolge de
      [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref3] de inlevering is gevorderd of ten aanzien
      waarvan ingevolge een der [artikelen 120, derde lid][ref4], [123b, vierde lid][ref5], [124, vierde lid][ref6],
      [131 tweede lid, onderdeel b][ref7], [132, vijfde lid][ref8], [132b, tweede lid][ref9], [134, vierde lid][ref10],
      of [180, derde lid][ref11], van deze wet een verplichting tot inlevering bestaat, is bevoegd dat rijbewijs in te
      nemen en het door te begeleiden naar het betrokken parket van het openbaar ministerie dan wel naar degene bij wie
      de houder dat rijbewijs had dienen in te leveren.

      2 Degene die is belast met de afgifte van rijbewijzen, en die in het kader van de aanvraag of de uitreiking van
      een nieuw rijbewijs of een vervangend rijbewijs de beschikking krijgt over een rijbewijs dat zijn geldigheid heeft
      verloren ingevolge [artikel 123, eerste lid, aanhef en onderdeel d][ref12], of [artikel 123b][ref13] is bevoegd dat
      rijbewijs in te nemen en door te geleiden naar degene bij wie de houder dat rijbewijs had dienen in te leveren.

      3 Voor de toepassing van het eerste en het tweede lid wordt onder een rijbewijs mede verstaan een rijbewijs,
      afgegeven door het daartoe bevoegde gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de
      houder in Nederland woonachtig is.

      4 Bij ministeriële regeling kunnen regels worden vastgesteld ter uitvoering van het eerste en het tweede lid.


