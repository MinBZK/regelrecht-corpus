  - number: '50'
    text: |-
      1 De aanvrager van een kentekenbewijs dient persoonlijk te verschijnen bij een bij ministeriële regeling aan te
      wijzen instantie, tenzij:

      a. de aanvraag namens hem wordt ingediend door degene aan wie door de Dienst Wegverkeer een erkenning als
      bedoeld in [artikel 62][ref1] is verleend dan wel, indien dit een rechtspersoon is, door diens gemachtigde,
      en deze voldoende zekerheid heeft verkregen over de identiteit van de aanvrager. Daartoe legt de aanvrager een
      document als bedoeld in [artikel 2, eerste lid, van de Paspoortwet][ref2], een geldig rijbewijs als bedoeld in
      [artikel 107][ref3] dan wel een rijbewijs als bedoeld in [artikel 108, eerste lid, onderdeel ][ref4] voor zover de
      aldaar bedoelde registratie heeft plaatsgevonden, over. Degene die namens de aanvrager de aanvraag indient, legt
      bij de bij ministeriële regeling aan te wijzen instantie het document bedoeld in de tweede volzin over, alsmede de
      volmacht en het bewijs dat aan hem een erkenning als bedoeld in [artikel 62][ref5] is verleend, of

      b. volgens bij algemene maatregel van bestuur vast te stellen regels op andere wijze voldoende zekerheid kan worden
      verkregen over de identiteit van de aanvrager.

      Indien bij de aanvraag, bedoeld onder *a*, gebruik wordt gemaakt van een document als bedoeld in
      [artikel 2 van de Paspoortwet][ref6], dient bij de aanvraag tevens een de aanvrager betreffend gewaarmerkt
      afschrift van de benodigde gegevens uit de basisadministratie persoonsgegevens te worden overgelegd dat niet
      langer dan drie maanden voor het tijdstip van de aanvraag is verstrekt. Onze Minister kan de bevoegdheid van de
      krachtens [artikel 62][ref7] erkende persoon om de aanvraag namens de aanvrager in te dienen beperken tot één of
      meer specifiek voor die persoon met name te noemen instanties. Bij algemene maatregel van bestuur worden regels
      vastgesteld ter zake van de voorwaarden waaraan degene aan wie ingevolge [artikel 62][ref8] een erkenning is
      verleend, dient te voldoen om als gemachtigde, bedoeld onder *a*, op te treden.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat de verplichting om persoonlijk te verschijnen niet
      geldt ten aanzien van de aanvrager van een kentekenbewijs, afgegeven ter zake van de opgave van een kenteken als
      bedoeld in [artikel 38][ref9].

      3 Indien de aanvraag geschiedt door een in Nederland gevestigde rechtspersoon die dient te zijn ingeschreven in een
      daartoe bij de wet aangewezen register of waarvan de onderneming dient te zijn ingeschreven in het handelsregister,
      geldt de verplichting om persoonlijk te verschijnen voor degene die krachtens de statuten bevoegd is de
      rechtspersoon te vertegenwoordigen. Indien er meerdere personen bevoegd zijn de rechtspersoon te vertegenwoordigen,
      geldt de verplichting voor een van hen. Een persoon die bevoegd is de rechtspersoon te vertegenwoordigen, kan bij
      gemachtigde verschijnen.

      4 Indien de aanvraag geschiedt door een in Nederland gevestigde rechtspersoon die niet behoeft te zijn ingeschreven
      in een daartoe bij de wet aangewezen register of waarvan de onderneming niet behoeft te zijn ingeschreven in het
      handelsregister, geldt de verplichting om persoonlijk te verschijnen voor degene die door die rechtspersoon is
      gemachtigd tot de aanvraag van het kentekenbewijs.

      5 De aanvraag van een kentekenbewijs dient te geschieden overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels. Bij ministeriële regeling worden voorschriften vastgesteld ter uitvoering van die regels.

      6 De in het vijfde lid bedoelde regels kunnen mede dienstbaar zijn aan de heffing van de belasting van
      personenauto’s en motorrijwielen en van de motorrijtuigenbelasting alsmede aan de afdracht van de krachtens
      een algemeen verbindend verklaarde overeenkomst op grond van de [Wet milieubeheer][ref10] verschuldigde
      afvalbeheersbijdrage voor autowrakken.

      7 Bij de in het vijfde lid bedoelde regels kan worden bepaald in welke gevallen het motorrijtuig of de
      aanhangwagen, waarvoor een kentekenbewijs wordt aangevraagd, voor een onderzoek ter beschikking moet worden
      gehouden.

      8 De Dienst Wegverkeer is bevoegd te vorderen dat de aanvrager van een kentekenbewijs een door of vanwege
      Onze Minister van Financiën afgegeven bewijs overlegt, waaruit blijkt dat ter zake van het motorrijtuig of de
      aanhangwagen verschuldigde belastingen en rechten zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel107
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel108
