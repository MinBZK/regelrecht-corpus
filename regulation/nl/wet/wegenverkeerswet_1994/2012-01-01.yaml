  - number: '2'
    text: |-
      1 De krachtens deze wet vastgestelde regels kunnen strekken tot:

      a. het verzekeren van de veiligheid op de weg;

      b. het beschermen van weggebruikers en passagiers;

      c. het in stand houden van de weg en het waarborgen van de bruikbaarheid daarvan;

      d. het zoveel mogelijk waarborgen van de vrijheid van het verkeer.

      2 De krachtens deze wet vastgestelde regels kunnen voorts strekken tot:

      a. het voorkomen of beperken van door het verkeer veroorzaakte overlast, hinder of schade alsmede de gevolgen voor
      het milieu, bedoeld in de [Wet milieubeheer][ref1];

      b. het voorkomen of beperken van door het verkeer veroorzaakte aantasting van het karakter of van de functie van
      objecten of gebieden.

      3 De krachtens deze wet vastgestelde regels kunnen voorts strekken tot:

      a. het bevorderen van een doelmatig of zuinig energiegebruik;

      b. het waarborgen van het op juiste wijze in rekening brengen van tarieven voor het gebruik van de weg;

      c. het gebruik en de waarborging van de juistheid van de registers die ingevolge deze wet worden bijgehouden;

      d. het voorkomen en bestrijden van fraude;

      e. de regeling van positie, inrichting en werkwijze, alsmede het uitoefenen van toezicht op zelfstandige
      bestuursorganen die taken verrichten op het terrein van deze wet.

      4 De krachtens deze wet vastgestelde regels kunnen voorts strekken ter uitvoering van verdragen of van besluiten
      van volkenrechtelijke organisaties of van één of meer instellingen van de Europese Unie, al dan niet gezamenlijk,
      op het terrein van de typegoedkeuring van voertuigen, systemen, onderdelen, technische eenheden, uitrustingstukken
      en voorzieningen ter bescherming van weggebruikers en passagiers, in verband met de toelating tot het verkeer op de
      weg of het gebruik buiten de weg.

      5 De vaststelling van regels bij ministeriële regeling ter uitvoering van het bij of krachtens deze wet bepaalde
      geschiedt in overeenstemming met Onze bij algemene maatregel van bestuur aangewezen ministers, indien deze regels
      strekken tot behartiging van de belangen, bedoeld in het tweede dan wel het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel2
