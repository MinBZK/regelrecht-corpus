        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '67'
    text: |-
      1 Indien met een voertuig geen gebruik van de weg wordt gemaakt, schorst de Dienst Wegverkeer op aanvraag van de
      eigenaar of houder van dat voertuig, tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief, de geldigheid van het kentekenbewijs.

      2 De hoogte van het in het eerste lid bedoelde tarief kan voor verschillende groepen voertuigen dan wel eigenaren
      of houders van voertuigen verschillend worden vastgesteld. Voor aanvragen die worden ingediend binnen een jaar na
      de aanvraag van een schorsing welke ingevolge [artikel 68, eerste lid, onderdelen a en d][ref1], is geëindigd, kan
      het tarief hoger worden vastgesteld dan het tarief voor laatstgenoemde aanvraag.

      3 De aanvraag van een schorsing dient te geschieden overeenkomstig bij algemene maatregel van bestuur vastgestelde
      regels.

      4 Bij ministeriële regeling worden nadere regels vastgesteld omtrent het krachtens het derde lid bepaalde.

      5 De Dienst Wegverkeer plaatst bij het verlenen van de schorsing overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels op het kentekenbewijs een aantekening waaruit blijkt dat schorsing is verleend.

      6 Bij ministeriële regeling worden nadere regels vastgesteld omtrent de aantekening van schorsing, bedoeld in het
      vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel68
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '68'
        hoofdstuk: IV
        paragraaf: '6'
  - number: '68'
    text: |-
      1 De schorsing eindigt:

      a. door opheffing als bedoeld in [artikel 69][ref1],

      b. door verloop van een jaar nadat de schorsing is verleend,

      c. door het verval van de tenaamstelling in het kentekenregister, of

      d. zodra met het voertuig gebruik van de weg wordt gemaakt.

      2 Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat in bepaalde
      uitzonderingsgevallen tijdelijk kan worden afgeweken van het eerste lid, aanhef en onderdeel *d*.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel69
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '69'
        hoofdstuk: IV
        paragraaf: '6'
  - number: '69'
    text: |-
      1 De schorsing wordt op aanvraag van de eigenaar of houder door de Dienst Wegverkeer opgeheven.

      2 De aanvraag van opheffing van de schorsing dient te geschieden overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels.

      3 Bij ministeriële regeling worden nadere regels vastgesteld omtrent het krachtens het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel69
  - number: '70'
    text: |-
      1 Bij de aanvraag van opheffing van de schorsing alsmede na het eindigen van de schorsing op grond van
      [artikel 68, eerste lid, aanhef en onderdeel b of d][ref1], dient degene aan wie de schorsing is verleend, een
      nieuw kentekenbewijs of een of meer bij algemene maatregel van bestuur aan te wijzen delen daarvan aan te vragen.

      2 De aanvraag dient te geschieden overeenkomstig bij algemene maatregel van bestuur vastgestelde regels tegen
      betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door deze dienst vastgestelde
      tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel68
