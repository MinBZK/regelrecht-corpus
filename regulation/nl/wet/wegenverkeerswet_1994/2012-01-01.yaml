  - number: 41a
    text: |-
      1 Voor de toepassing van deze paragraaf wordt verstaan onder:

      a. overheidsorgaan: bestuursorgaan als bedoeld in
      [artikel 1:1, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1] en personen of instanties als
      bedoeld in het tweede lid;

      b. basisregistratie: verzameling gegevens waarvan bij wet is bepaald dat deze authentieke gegevens bevat;

      c. authentiek gegeven: in een basisregistratie opgenomen gegeven dat bij of krachtens wet als authentiek is
      aangemerkt.

      2 Bij besluit van Onze Minister kunnen personen of instanties die een publieke taak uitoefenen worden aangewezen
      als overheidsorgaan, voor zover dit met het oog op hun publieke-taakuitoefening naar het oordeel van Onze Minister
      noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel11
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel41a
