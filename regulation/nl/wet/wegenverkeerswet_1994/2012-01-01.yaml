  - number: 70j
    text: |-
      1 Indien de betrokken kentekenplaten overeenkomstig [artikel 70i][ref1] worden ingeleverd bij de Dienst Wegverkeer
      onderscheidenlijk een erkend bedrijf als bedoeld in [artikel 62][ref2] is deze dienst, onderscheidenlijk dit
      bedrijf verplicht tot het vastleggen van gegevens omtrent van:

      a. het betrokken kenteken, en

      b. het aantal ingeleverde kentekenplaten.

      De [artikelen 70b, vierde tot en met zesde lid][ref3], en [70c][ref4] zijn van overeenkomstige toepassing

      2 De Dienst Wegverkeer, onderscheidenlijk het erkende bedrijf, is voorts, overeenkomstig bij ministeriële regeling
      vast te stellen regels, verplicht tot vernietiging van de ingeleverde kentekenplaten en tot registratie van de
      vernietiging.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70i
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel70b
