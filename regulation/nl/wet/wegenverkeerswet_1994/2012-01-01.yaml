  - number: '42'
    text: |-
      1 Er is een kentekenregister. Dit register is een basisregistratie.

      2 De Dienst Wegverkeer is de beheerder van het kentekenregister en verantwoordelijke als bedoeld in de
      [Wet bescherming persoonsgegevens][ref1].

      3 In het kentekenregister verwerkt de Dienst Wegverkeer gegevens omtrent motorrijtuigen en aanhangwagens waarvoor
      een kenteken is opgegeven en de tenaamstelling van die kentekens, alsmede omtrent andere motorrijtuigen en
      aanhangwagens.

      4 Het verzamelen van de gegevens, bedoeld in het derde lid, geschiedt voor de volgende doeleinden:

      a. voor een goede uitvoering van het bepaalde bij of krachtens deze wet en voor de handhaving van de bij of
      krachtens deze wet gestelde voorschriften,

      b. voor een goede uitvoering van het bepaalde bij of krachtens de [Wet op de motorrijtuigenbelasting 1994][ref2],
      de [Wet op de belasting van personenauto’s en motorrijwielen 1992][ref3], de
      [Wet belasting zware motorrijtuigen][ref4], de [Wet aansprakelijkheidsverzekering motorrijtuigen][ref5], de
      [Wet bereikbaarheid en mobiliteit][ref6], dan wel andere wettelijke regelingen ten aanzien van motorrijtuigen of
      aanhangwagens en voor de handhaving van het bepaalde bij of krachtens die wettelijke regelingen, en

      c. om overheidsorganen te voorzien van gegevens uit het kentekenregister voor zover zij aangeven deze gegevens
      nodig te hebben voor een goede uitoefening van hun publieke taak.

      5 De Dienst Wegverkeer mag strafrechtelijke persoonsgegevens en persoonsgegevens ter vaststelling van mogelijk
      strafbaar gedrag verwerken voor zover dit verband houdt met de in het vierde lid, onderdelen a en b, genoemde
      doeleinden.

      6 Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de inrichting en het beheer van het
      kentekenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0006324
      [ref3]: https://wetten.overheid.nl/BWBR0005806
      [ref4]: https://wetten.overheid.nl/BWBR0007678
      [ref5]: https://wetten.overheid.nl/BWBR0002415
      [ref6]: https://wetten.overheid.nl/BWBR0013854
