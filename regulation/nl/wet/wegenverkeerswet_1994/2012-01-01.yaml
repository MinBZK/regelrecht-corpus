  - number: 123a
    text: |-
      Een nieuw of vervangend rijbewijs verliest zijn geldigheid indien het drie maanden na de datum waarop het besluit
      tot afgifte is genomen niet is uitgereikt.
    url: https://wetten.overheid.nl/BWBR0006622/2012-01-01#Artikel123a
  - number: 123b
    text: |-
      1 Onverminderd de [artikelen 123, eerste lid][ref1], en [123a][ref2] verliest een rijbewijs zijn geldigheid voor
      alle categorieën waarvoor het is afgegeven en voor de resterende duur van de geldigheid, indien de houder bij
      onherroepelijke rechterlijke uitspraak als bestuurder van een motorrijtuig is veroordeeld wegens overtreding van:

      a. [artikel 6][ref3], voor zover de schuldige verkeerde in de toestand, bedoeld in
      [artikel 8, tweede, derde of vierde lid][ref4], en het alcoholgehalte van zijn adem bij een onderzoek
      hoger blijkt te zijn dan 570 microgram alcohol per liter uitgeademde lucht dan wel het alcoholgehalte
      van zijn bloed bij een onderzoek hoger blijkt te zijn dan 1,3 milligram alcohol per milliliter bloed,
      dan wel voor zover de schuldige na het feit niet heeft voldaan aan een bevel, gegeven krachtens
      [artikel 163, tweede, zesde, achtste of negende lid][ref5];

      b. [artikel 8, tweede, derde of vierde lid][ref6], indien het alcoholgehalte van zijn adem bij een onderzoek hoger
      blijkt te zijn dan 570 microgram alcohol per liter uitgeademde lucht dan wel het alcoholgehalte van zijn bloed bij
      een onderzoek hoger blijkt te zijn dan 1,3 milligram alcohol per milliliter bloed;

      c. [artikel 163, tweede, zesde, achtste of negende lid][ref7],

      een en ander voor zover ten tijde van het begaan van het strafbare feit nog geen vijf jaren zijn verlopen sedert de
      houder als bestuurder van een motorrijtuig onherroepelijk is veroordeeld wegens overtreding van

      1. [artikel 6][ref8], voor zover de schuldige verkeerde in de toestand, bedoeld in
      [artikel 8, tweede, derde of vierde lid][ref9], dan wel voor zover de schuldige na het feit niet heeft voldaan aan
      een bevel, gegeven krachtens [artikel 163, tweede, zesde, achtste of negende lid][ref10];

      2. [artikel 8, tweede, derde of vierde lid][ref11], of

      3. [artikel 163, tweede, zesde, achtste of negende lid][ref12].

      2 Voor de toepassing van het eerste lid wordt een strafbeschikking met een veroordeling gelijkgesteld.

      3 Indien een rijbewijs dat op grond van het eerste lid ongeldig zou zijn, reeds eerder zijn geldigheid
      heeft verloren door het verstrijken van de geldigheidsduur, of reeds eerder ongeldig is verklaard en deze
      ongeldigverklaring onherroepelijk is geworden, plaatst de officier van justitie een aantekening in het
      rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op bij algemene maatregel
      van bestuur vastgestelde wijze dient aan te tonen dat hij beschikt over de rijvaardigheid en de lichamelijke en
      geestelijke geschiktheid die is vereist voor het besturen van een motorrijtuig van de categorie of categorieën
      waarop de door de houder overgelegde aanvraag betrekking heeft.

      4 De houder van het ongeldige rijbewijs dient dat rijbewijs, voor zover inlevering niet reeds heeft plaatsgevonden
      op grond van een ander artikel, in te leveren bij de Dienst Wegverkeer.

      5 Voor de toepassing van dit artikel wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door het daartoe
      bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.


