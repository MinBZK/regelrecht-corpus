  - number: '179.2'
    text: |-
      Bij veroordeling van de bestuurder van een motorrijtuig wegens overtreding van de [artikelen 5][ref1],
      [10, eerste lid][ref2], [12, eerste lid][ref3], [41, eerste lid][ref4], [51, eerste lid][ref5], [61][ref6],
      [74][ref7] of [114][ref8], dan wel van de eigenaar of houder van een motorrijtuig of een aanhangwagen wegens
      overtreding van [artikel 165, eerste lid][ref9], of [artikel 166, eerste lid][ref10], kan hem de bevoegdheid tot
      het besturen van motorrijtuigen voor ten hoogste twee jaren worden ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel10
