  - number: '179.1'
    text: |-
      Bij veroordeling van de bestuurder van een motorrijtuig wegens overtreding van de
      [artikelen 6][ref1], [7, eerste lid][ref2], [8][ref3], [9][ref4], [162, derde lid][ref5], of
      [163, tweede, zesde, achtste of negende lid][ref6], kan hem de bevoegdheid tot het besturen van motorrijtuigen voor
      ten hoogste vijf jaren worden ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel7
