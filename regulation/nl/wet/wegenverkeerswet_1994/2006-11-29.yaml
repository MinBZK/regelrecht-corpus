        artikel: '5'
  - number: '175.1'
    text: |-
      Overtreding van [artikel 6][ref1] wordt gestraft met:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel6
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: 175.1.a
    text: |-
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, indien het een ongeval betreft
      waardoor een ander wordt gedood;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel175
  - number: 175.1.b
    text: |-
      gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde categorie, indien het een
      ongeval betreft waardoor een ander lichamelijk letsel wordt toegebracht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel175
  - number: '175.2'
    text: |-
      Indien de schuld bestaat in roekeloosheid, wordt overtreding van [artikel 6 ][ref1]gestraft met:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel6
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: 175.2.a
    text: |-
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie, indien het een ongeval betreft
      waardoor een ander wordt gedood;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel175
  - number: 175.2.b
    text: |-
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, indien het een ongeval betreft
      waardoor een ander lichamelijk letsel wordt toegebracht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel175
  - number: '175.3'
    text: |-
      Indien de schuldige verkeerde in de toestand, bedoeld in [artikel 8, eerste, tweede of derde lid][ref1],
      dan wel na het feit niet heeft voldaan aan een bevel, gegeven krachtens
      [artikel 163, tweede, zesde, achtste of negende lid][ref2], of indien het feit is veroorzaakt of mede is
      veroorzaakt doordat hij een krachtens deze wet vastgestelde maximumsnelheid in ernstige mate heeft overschreden,
      dan wel zeer dicht achter een ander voertuig is gaan rijden, geen voorrang heeft verleend of gevaarlijk heeft
      ingehaald kunnen de in het eerste en tweede lid bepaalde gevangenisstraffen met de helft worden verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel163
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '163'
        hoofdstuk: IX
  - number: '176.1'
    text: |-
      Overtreding van [artikel 41, eerste lid, onderdelen c en d][ref1], wordt gestraft hetzij met gevangenisstraf van
      ten hoogste zes maanden en geldboete van de derde categorie, hetzij met een van beide voormelde straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel41
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel176
    references:
