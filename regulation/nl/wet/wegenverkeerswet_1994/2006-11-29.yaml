  - number: '187'
    text: De inwerkingtreding van deze wet wordt nader bij de wet geregeld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel187
  - number: '188'
    text: 'Deze wet kan worden aangehaald als: Wegenverkeerswet 1994.'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel188
