      - id: ref10
        bwb_id: BWBR0006622
        artikel: '132'
        hoofdstuk: VI
        paragraaf: '9'
      - id: ref11
        bwb_id: BWBR0006622
        artikel: '180'
        hoofdstuk: XI
  - number: '161.2'
    text: |-
      De in [artikel 159, onderdeel a][ref1], bedoelde personen die bij de uitoefening van de bij of krachtens deze
      wet aan hen verleende bevoegdheden de beschikking krijgen over een rijbewijs dat zijn geldigheid heeft verloren
      ingevolge [artikel 123, eerste lid, aanhef en onderdeel d][ref2], zijn bevoegd dat rijbewijs in te nemen en door te
      geleiden naar de instantie die het heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel123
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '123'
        hoofdstuk: VI
        paragraaf: '7'
  - number: '161.3'
    text: |-
      Voor de toepassing van het eerste en het tweede lid wordt onder een rijbewijs mede verstaan een rijbewijs,
      afgegeven door het daartoe bevoegde gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de
      houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel161
  - number: '161.4'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld ter uitvoering van het eerste, tweede en derde
      lid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel161
  - number: '162.1'
    text: |-
      Een van de in [artikel 159, onderdeel a][ref1], bedoelde personen kan de bestuurder van een voertuig van
      wie, uit het in [artikel 160, vijfde lid][ref2], bedoelde onderzoek of op andere wijze, naar het oordeel
      van die persoon gebleken is dat hij onder zodanige invloed van het gebruik van een stof als bedoeld in
      [artikel 8, eerste lid][ref3], verkeert, dat hij onvoldoende in staat is een voertuig behoorlijk te besturen, een
      rijverbod opleggen voor de tijd gedurende welke redelijkerwijs verwacht mag worden dat deze toestand zal voortduren
      tot ten hoogste vierentwintig uren. De vorige volzin is van overeenkomstige toepassing op degene die aanstalten
      maakt een voertuig te gaan besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel160
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '160'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '162.2'
    text: |-
      De opsporingsambtenaar die een rijverbod oplegt, legt dit vast in een beschikking die het tijdstip van ingang en de
      duur van het verbod bevat.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel162
  - number: '162.3'
    text: |-
      Het is degene aan wie een rijverbod als bedoeld in het eerste lid is opgelegd, verboden een voertuig te besturen of
      als bestuurder te doen besturen gedurende de tijd waarvoor dat rijverbod geldt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel162
  - number: '163.1'
    text: |-
      Bij verdenking dat de bestuurder van een voertuig heeft gehandeld in strijd met [artikel 8][ref1],
      kan de opsporingsambtenaar hem bevelen zijn medewerking te verlenen aan een onderzoek als bedoeld in
      [artikel 8, tweede lid, onderdeel a][ref2], en [artikel 8, derde lid, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '163.2'
    text: |-
      De bestuurder aan wie het in het eerste lid bedoelde bevel is gegeven, is verplicht ademlucht te blazen in een
      voor het onderzoek bestemd apparaat en gevolg te geven aan alle door de opsporingsambtenaar ten dienste van het
      onderzoek gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel163
  - number: '163.3'
    text: |-
      De in het tweede lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat het verlenen
      van medewerking aan een ademonderzoek voor hem om bijzondere geneeskundige redenen onwenselijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel163
  - number: '163.4'
    text: |-
      In het geval, bedoeld in het derde lid, dan wel indien de medewerking van de verdachte niet heeft geleid
      tot een voltooid ademonderzoek, kan de opsporingsambtenaar de verdachte vragen of hij zijn toestemming
      geeft tot het verrichten van een onderzoek als bedoeld in [artikel 8, tweede lid, onderdeel b][ref1], en
      [artikel 8, derde lid, onderdeel b][ref2]. Gelijke bevoegdheid heeft de opsporingsambtenaar, indien het vermoeden
      bestaat dat de verdachte onder invloed van een andere in [artikel 8, eerste lid][ref3], bedoelde stof dan
      alcoholhoudende drank verkeert.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '163.5'
    text: |-
      Indien de bestuurder zijn op grond van het vierde lid gevraagde toestemming niet verleent, kan de officier
      van justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen ambtenaren, aangesteld voor de uitvoering van de politietaak, hem bevelen zich te onderwerpen aan een
      bloedonderzoek.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel163
  - number: '163.6'
    text: |-
      De bestuurder wie is bevolen zich aan een bloedonderzoek te onderwerpen, is verplicht aan dit bevel gevolg te geven
      en zijn medewerking te verlenen. Hem wordt door een arts zoveel bloed afgenomen als voor het onderzoek noodzakelijk
      is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel163
  - number: '163.7'
    text: |-
      De in het zesde lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat afname van
      bloed bij hem om bijzondere geneeskundige redenen onwenselijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel163
  - number: '163.8'
    text: |-
      De krachtens het zevende lid van de in het zesde lid genoemde verplichtingen vrijgestelde personen zijn verplicht
      mee te werken aan een door de officier van justitie, door een hulpofficier van justitie of door een van de
      daartoe bij regeling van Onze Minister van Justitie aangewezen ambtenaren, aangesteld voor de uitvoering van
      de politietaak, bevolen onderzoek teneinde op andere wijze dan door bloed- of ademonderzoek het gebruik van
      de in [artikel 8, eerste lid][ref1], bedoelde stoffen of het in [artikel 8, tweede lid, onderdeel b][ref2], en
      [artikel 8, derde lid, onderdeel b][ref3], genoemde gehalte vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '163.9'
    text: |-
      Indien de verdachte niet in staat is zijn wil kenbaar te maken, kan hem met toestemming van de officier van
      justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen ambtenaren, aangesteld voor de uitvoering van de politietaak, door een arts de in het zesde lid bedoelde
      hoeveelheid bloed worden afgenomen, tenzij aannemelijk is dat dit bij hem om bijzondere geneeskundige redenen
      onwenselijk is. Een onderzoek van het bloed vindt niet plaats dan nadat de verdachte in de gelegenheid is gesteld
      zijn toestemming daartoe te geven. Zo nodig kan hem overeenkomstig het vijfde lid worden bevolen zijn medewerking
      te verlenen. De verdachte aan wie een zodanig bevel is gegeven, is verplicht zijn medewerking te verlenen. Indien
      de verdachte weigert zijn medewerking te verlenen, wordt het bloedmonster vernietigd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel163
  - number: '163.10'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de wijze van uitvoering van
      [artikel 160, vijfde lid][ref1], en van dit artikel. Deze regels kunnen mede betrekking hebben op de mogelijkheid
      tot het doen verrichten van een tegenonderzoek. Bij regeling van Onze Minister van Justitie worden in de bij die
      algemene maatregel van bestuur aangegeven gevallen voorschriften ter uitvoering van die regels vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel160
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '160'
        hoofdstuk: IX
  - number: '164.1'
    text: |-
      Op de eerste vordering van de in [artikel 159, onderdelen a en b][ref1], bedoelde personen is de bestuurder van een
      motorrijtuig, tegen wie door een van die personen proces-verbaal wordt opgemaakt ter zake van overtreding van een
      bij of krachtens deze wet vastgesteld voorschrift, verplicht tot overgifte van het hem afgegeven rijbewijs dan wel
      het hem door het daartoe bevoegde gezag buiten Nederland afgegeven rijbewijs en, indien hem daar een internationaal
      rijbewijs is afgegeven, dat bewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '164.2'
    text: 'De in het eerste lid bedoelde vordering wordt gedaan in geval van overtreding van:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
  - number: 164.2.a
    text: |-
      [artikel 8][ref1], indien bij een onderzoek als bedoeld in het tweede lid, van die bepaling blijkt of, bij
      ontbreken van een dergelijk onderzoek, een ernstig vermoeden bestaat dat het alcoholgehalte van de adem van de
      bestuurder hoger is dan vijfhonderdzeventig microgram alcohol per liter uitgeademde lucht, onderscheidenlijk het
      alcoholgehalte van het bloed van de bestuurder hoger blijkt te zijn dan 1,3 milligram alcohol per milliliter bloed;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: 164.2.b
    text: |-
      [artikel 8][ref1], indien bij een onderzoek als bedoeld in het derde lid van die bepaling blijkt of, bij het
      ontbreken van een dergelijk onderzoek, een ernstig vermoeden bestaat dat het alcoholgehalte van de adem van de
      bestuurder hoger is dan 350 microgram alcohol per liter uitgeademde lucht, onderscheidenlijk het alcoholgehalte van
      het bloed van de bestuurder hoger blijkt te zijn dan 0,8 milligram alcohol per milliliter bloed;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: 164.2.c
    text: |-
      [artikel 163, tweede, zesde, achtste of negende lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel163
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '163'
        hoofdstuk: IX
  - number: 164.2.d
    text: |-
      overschrijding van een krachtens deze wet vastgestelde maximumsnelheid met vijftig kilometer of meer, door een
      bestuurder van een motorrijtuig anders dan een bromfiets, in geval van staandehouding van de bestuurder;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
  - number: 164.2.e
    text: |-
      overschrijding van een krachtens deze wet vastgestelde maximumsnelheid met dertig kilometer of meer door een
      bestuurder van een bromfiets, in geval van staandehouding van de bestuurder.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
  - number: '164.3'
    text: |-
      De in het eerste lid bedoelde vordering kan worden gedaan indien door de overtreding de veiligheid op de weg
      ernstig in gevaar is gebracht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
  - number: '164.4'
    text: |-
      De ingevorderde bewijzen worden tegelijk met het proces-verbaal onverwijld opgezonden aan de officier van justitie.
      De officier van justitie is bevoegd de ingevorderde bewijzen onder zich te houden totdat de rechterlijke uitspraak
      in kracht van gewijsde is gegaan of, indien bij de uitspraak de bestuurder de bevoegdheid tot het besturen van
      motorrijtuig onvoorwaardelijk is ontzegd, tot het tijdstip waarop de ontzegging is verstreken, indien:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
  - number: 164.4.a
    text: |-
      bij het in het tweede lid, onderdeel a, bedoelde onderzoek is gebleken of, bij ontbreken van een dergelijk
      onderzoek, een ernstig vermoeden bestaat dat het alcoholgehalte van de adem van de bestuurder hoger was dan 785
      microgram alcohol per liter uitgeademde lucht, onderscheidenlijk het alcoholgehalte van het bloed van de bestuurder
      hoger blijkt te zijn dan 1,8 milligram alcohol per milliliter bloed;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
  - number: 164.4.b
    text: |-
      bij het tweede lid, onderdeel b, bedoelde onderzoek is gebleken of, bij ontbreken van een dergelijk onderzoek, een
      ernstig vermoeden bestaat dat het alcoholgehalte van de adem van de bestuurder hoger was dan 570 microgram alcohol
      per liter uitgeademde lucht, onderscheidenlijk het alcoholgehalte van het bloed van de bestuurder hoger blijkt te
      zijn dan 1,3 milligram alcohol per milliliter bloed;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
  - number: 164.4.c
    text: |-
      de maximumsnelheid met 70 kilometer of meer is overschreden door een bestuurder van een motorrijtuig anders dan
      een bromfiets;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
  - number: 164.4.d
    text: |-
      indien de maximumsnelheid met dertig kilometer of meer is overschreden door een bestuurder van een bromfiets, dan
      wel;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
  - number: 164.4.e
    text: |-
      op grond van andere feiten of omstandigheden ernstig rekening moet worden gehouden met de mogelijkheid dat de
      bestuurder opnieuw een feit als bedoeld in het tweede of derde lid zal begaan.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
  - number: '164.5'
    text: 'De officier van justitie is bevoegd de toepassing van de in het vierde lid bedoelde bevoegdheid te schorsen indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
  - number: 164.5.a
    text: |-
      de geldigheid van de bewijzen ingevolge [artikel 131, derde lid, onderdeel a][ref1], voor alle categorieën van
      motorrijtuigen waarvoor zij zijn afgegeven, wordt geschorst;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '9'
  - number: 164.5.b
    text: |-
      de bewijzen ingevolge [artikel 124][ref1] voor alle categorieën van motorrijtuigen waarvoor zij zijn afgegeven,
      ongeldig worden verklaard voor een bepaald deel van de geldigheidsduur;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '124'
        hoofdstuk: VI
        paragraaf: '7'
  - number: 164.5.c
    text: |-
      een rechterlijke uitspraak waarbij de bevoegdheid tot het besturen van motorrijtuigen is ontzegd, voor
      tenuitvoerlegging vatbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
  - number: '164.6'
    text: |-
      Indien de officier van justitie binnen tien dagen na de dag van invordering niet gebruik maakt van de in het
      vierde lid bedoelde bevoegdheid, geeft hij de ingevorderde bewijzen onverwijld terug aan de houder. Teruggave vindt
      eveneens plaats, indien ernstig rekening moet worden gehouden met de mogelijkheid dat aan de houder in geval van
      veroordeling geen onvoorwaardelijke ontzegging van de bevoegdheid tot het besturen van motorrijtuigen zal worden
      opgelegd, dan wel geen onvoorwaardelijke ontzegging van langere duur dan de tijd gedurende welke de bewijzen zijn
      ingevorderd of ingehouden geweest, of indien het onderzoek van de zaak op de terechtzitting niet binnen zes maanden
      na de dag van invordering is aangevangen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
  - number: '164.7'
    text: |-
      In geval van toepassing van het eerste lid kan het motorrijtuig, voor zover geen andere bestuurder
      beschikbaar is of de bestuurder niet aanstonds voldoet aan de vordering, onder toezicht of, voor zover
      degene die het proces-verbaal opmaakt zulks nodig oordeelt, in bewaring worden gesteld. In het laatste
      geval zijn de [artikelen 170, tweede lid, tweede en derde volzin, vierde en vijfde lid][ref1], [171][ref2],
      [172][ref3] en [173, eerste lid, van deze wet][ref4] en de [artikelen 5:25, eerste lid][ref5],[ 5:26][ref6],
      [5:29, tweede en derde lid][ref7], [5:30, eerste, tweede en vierde lid, van de Algemene wet bestuursrecht][ref8]
      van overeenkomstige toepassing. Teruggave van het motorrijtuig vindt slechts plaats indien aan de vordering is
      voldaan of indien de officier van justitie zich niet langer tegen de teruggave verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel172
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel173
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '171'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '172'
        hoofdstuk: X
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '173'
        hoofdstuk: X
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
