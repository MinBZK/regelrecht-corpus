  - number: 4b.1.o
    text: |-
      het sluiten van overeenkomsten met betrekking tot de productie van rijbewijzen, de aflevering ervan en het beheer
      van de daartoe benodigde voorzieningen;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4b
  - number: 4b.1.p
    text: het attenderen van houders van een rijbewijs op het verloop van de geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4b
  - number: 4b.2
    text: 'Voorts is de Dienst Wegverkeer belast met:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4b
  - number: 4b.2.a
    text: de bij of krachtens andere wetten opgedragen taken, en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4b
  - number: 4b.2.b
    text: andere door Onze Minister opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4b
  - number: 4c
    text: |-
      Onze Minister kan de Dienst Wegverkeer aanwijzingen van algemene aard geven omtrent de uitoefening van de
      aan de Dienst opgedragen taken. Aanwijzingen omtrent de uitoefening van de bij of krachtens andere wetten dan
      deze wet opgedragen taken worden door Onze Minister gegeven in overeenstemming met Onze voor die wetten eerst
      verantwoordelijke Ministers.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4c
  - number: 4d
    text: De Dienst Wegverkeer heeft een directie en een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4d
  - number: 4e.1
    text: De directie bestaat uit maximaal 3 leden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4e
  - number: 4e.2
    text: Het lidmaatschap van de directie is onverenigbaar met het lidmaatschap van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4e
  - number: 4e.3
    text: De leden van de directie worden aangesteld, geschorst en ontslagen door de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4e
  - number: 4e.4
    text: |-
      De leden van de directie worden aangesteld voor een periode van 5 jaren en kunnen terstond opnieuw worden
      aangesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4e
  - number: 4f.1
    text: De directie is belast met de dagelijkse leiding van de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4f
  - number: 4f.2
    text: |-
      Alle bevoegdheden van de Dienst Wegverkeer die niet bij of krachtens de wet aan de raad van toezicht zijn
      opgedragen, komen toe aan de directie.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4f
  - number: 4g.1
    text: De directie vertegenwoordigt de Dienst Wegverkeer in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4g
  - number: 4g.2
    text: |-
      De directie kan onder haar verantwoordelijkheid de vertegenwoordiging, bedoeld in het eerste lid, opdragen aan een
      of meer directieleden of andere personen. Zij kan bepalen dat deze vertegenwoordiging uitsluitend betrekking heeft
      op bepaalde onderdelen van de taak van de Dienst Wegverkeer dan wel op bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4g
  - number: 4h
    text: |-
      In geval van schorsing of ontstentenis van een lid van de directie voorziet de raad van toezicht in de waarneming
      van diens functie.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4h
  - number: 4i.1
    text: |-
      De directie verstrekt de raad van toezicht tijdig de voor de uitoefening van diens taak benodigde inlichtingen en
      andere gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4i
  - number: 4i.2
    text: |-
      De directie legt jaarlijks, en voorts tussentijds indien hiertoe naar het oordeel van de raad van toezicht
      aanleiding bestaat, aan de raad van toezicht verantwoording af over het door haar gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4i
  - number: 4j.1
    text: De raad van toezicht bestaat uit vijf leden, waaronder de voorzitter.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4j
  - number: 4j.2
    text: Onze Minister benoemt, schorst en ontslaat de leden van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4j
  - number: 4j.3
    text: De voorzitter wordt benoemd, gehoord de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4j
  - number: 4j.4
    text: |-
      De leden van de raad van toezicht hebben op persoonlijke titel zitting in de raad en oefenen hun functie uit zonder
      last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4j
  - number: 4k.1
    text: |-
      De voorzitter en de overige leden van de raad van toezicht worden benoemd voor een tijdvak van vier jaren en zijn
      voor een aansluitende periode éénmaal herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4k
  - number: 4k.2
    text: |-
      De leden van de raad van toezicht kan tussentijds op eigen verzoek, dan wel om zwaarwichtige redenen ontslag worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4k
  - number: 4k.3
    text: |-
      Zolang in een vacature van de raad van toezicht niet is voorzien, vormen de overblijvende leden de raad van
      toezicht, met de bevoegdheid van de volledige raad. Binnen twee maanden na het openvallen van een vacature wordt
      een nieuw lid benoemd. Betreft het de vacature van de voorzitter dan wijzen de overblijvende leden uit hun midden
      een lid aan dat tijdelijk als voorzitter fungeert.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4k
  - number: 4k.4
    text: |-
      Degene die is benoemd ter vervanging van een tussentijds opengevallen plaats treedt af op het tijdstip waarop
      degene in wiens plaats hij is benoemd, zou moeten aftreden en is vervolgens voor een aansluitende periode éénmaal
      herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4k
  - number: 4l.1
    text: De raad van toezicht ziet toe op de werkzaamheden van de directie en staat die met raad terzijde.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
  - number: 4l.2
    text: 'Goedkeuring door de raad van toezicht behoeven in ieder geval de besluiten van de directie betreffende:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
  - number: 4l.2.a
    text: |-
      de reglementen, bedoeld in de [artikelen 4n][ref1], [4o][ref2] en [4r][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4n
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel4o
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel4r
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4n
        hoofdstuk: IA
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 4o
        hoofdstuk: IA
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 4r
        hoofdstuk: IA
        paragraaf: '6'
  - number: 4l.2.b
    text: |-
      vaststelling van de tarieven, bedoeld in [artikel 4b, eerste lid, onderdeel n][ref1], de tarieven die voortvloeien
      uit [artikel 4b, tweede lid, onderdeel a][ref2], alsmede van de wijze van betaling van deze tarieven;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4b
        hoofdstuk: IA
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 4b
        hoofdstuk: IA
        paragraaf: '2'
  - number: 4l.2.c
    text: investeringen die een door de raad van toezicht vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
  - number: 4l.2.d
    text: de financiële begroting;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
  - number: 4l.2.e
    text: het jaarverslag en de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
  - number: 4l.2.f
    text: het aangaan of garanderen van geldleningen die een door de raad van toezicht vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
  - number: 4l.2.g
    text: wijzigingen in de rechtspositie van het personeel;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
  - number: 4l.2.h
    text: de bij of krachtens deze wet aan Onze Minister uit te brengen rapportages;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
  - number: 4l.2.i
    text: het financiële meerjarenbeleidsplan;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
  - number: 4l.2.j
    text: |-
      uitbreiding van de keuringscapaciteit als bedoeld in [artikel 78, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: 4l.2.k
    text: het oprichten of mede-oprichten van dan wel het deelnemen in rechtspersonen of vennootschappen;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
  - number: 4l.2.l
    text: het sluiten van overeenkomsten van zwaarwegend belang.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
  - number: 4l.3
    text: |-
      Het aangaan of garanderen van geldleningen die een door Onze Minister vast te stellen bedrag te boven gaan, de in
      het tweede lid, onderdelen b, d, i, j, k en l genoemde besluiten, het in [artikel 4n][ref1] bedoelde reglement,
      alsmede het in [artikel 4o][ref2] bedoelde reglement voor zover het betreft de bezoldiging van de directie van
      de Dienst Wegverkeer, behoeven bovendien de goedkeuring van Onze Minister. Bij de goedkeuring van het hier in
      [artikel 4o][ref3] bedoelde reglement zal Onze Minister als richtsnoer de bezoldigingsniveaus van functies van
      vergelijkbare zwaarte bij de ministeries hanteren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4n
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel4o
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel4o
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4n
        hoofdstuk: IA
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 4o
        hoofdstuk: IA
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 4o
        hoofdstuk: IA
        paragraaf: '5'
  - number: 4l.4
    text: |-
      De raad van toezicht kan geen rechtsgeldige besluiten nemen indien niet ten minste vier leden ter vergadering
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
  - number: 4l.5
    text: |-
      De raad van toezicht stelt bij reglement zijn werkwijze vast. Het reglement behoeft de goedkeuring van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
  - number: 4l.6
    text: De vergaderingen van de raad van toezicht zijn niet openbaar.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4l
  - number: 4m.1
    text: De raad van toezicht heeft een eigen secretariaat; de kosten daarvan komen ten laste van de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4m
  - number: 4m.2
    text: |-
      Onze Minister kan aan de leden van de raad van toezicht, ten laste van de Dienst Wegverkeer, een vergoeding
      toekennen voor hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4m
  - number: 4m.3
    text: |-
      De leden van de raad van toezicht hebben aanspraak op vergoeding van de door hen in de uitoefening van hun functie
      gemaakte reis- en verblijfskosten.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4m
  - number: 4n
    text: De directie stelt bij reglement zijn werkwijze vast.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4n
  - number: 4o.1
    text: |-
      Het personeel van de Dienst Wegverkeer, de leden van de directie daaronder begrepen, is ambtenaar in de zin van de
      [Ambtenarenwet][ref1], behoudens degenen met wie een arbeidsovereenkomst is gesloten naar burgerlijk recht.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: 4o.2
    text: De directie stelt bij reglement de regeling van de rechtstoestand van het personeel vast.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3
    text: |-
      Onverminderd hetgeen reeds bij of krachtens de wet is geregeld, geeft het reglement, bedoeld in het tweede lid, in
      ieder geval voorschriften betreffende de volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.a
    text: aanstelling;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.b
    text: schorsing;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.c
    text: ontslag;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.d
    text: het onderzoek naar de geschiktheid en de bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.e
    text: bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.f
    text: wachtgeld;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.g
    text: diensttijden;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.h
    text: verlof en vakantie;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.i
    text: voorzieningen in verband met ziekte;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.j
    text: bescherming bij de arbeid;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.k
    text: woon-, verblijfs- en bereikbaarheidsverplichtingen;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.l
    text: medezeggenschap;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.m
    text: overige rechten en verplichtingen van het personeel;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.n
    text: disciplinaire maatregelen;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.o
    text: |-
      de wijze waarop met de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel overleg wordt gevoerd
      over aangelegenheden van algemeen belang voor de rechtstoestand en de bezoldiging van het personeel van de Dienst
      Wegverkeer;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4o.3.p
    text: een geschillenregeling met betrekking tot de in de onderdelen *l* en *o* genoemde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4o
  - number: 4p
    text: 'De inkomsten van de Dienst Wegverkeer bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4p
  - number: 4p.a
    text: de opbrengst van de heffingen;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4p
  - number: 4p.b
    text: vergoedingen voor verrichte diensten;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4p
  - number: 4p.c
    text: andere baten hoe ook genoemd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4p
  - number: 4q.1
    text: |-
      De hoogte van de tarieven, bedoeld in [artikel 4b, eerste lid, onderdeel n][ref1], dient te worden gerelateerd aan
      de met de uitoefening van de taak gemoeide kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4b
        hoofdstuk: IA
        paragraaf: '2'
  - number: 4q.2
    text: |-
      Het tarief, bedoeld in [artikel 48, eerste lid][ref1], voor de aanvraag van een bij algemene maatregel van bestuur
      aan te wijzen deel van een kentekenbewijs omvat mede een bij ministeriële regeling vastgesteld bedrag dat strekt
      ter dekking van de kosten van:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 4q.2.a
    text: het registreren van keuringsrapporten,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4q
  - number: 4q.2.b
    text: het ongeldig verklaren van kentekenbewijzen,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4q
  - number: 4q.2.c
    text: |-
      het verstrekken van gegevens uit het kentekenregister aan de in [artikel 43, eerste en tweede lid][ref1], bedoelde
      autoriteiten en instellingen van volkenrechtelijke organisaties,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 4q.2.d
    text: |-
      het behandelen van klachten en ingevolge de[ Algemene wet bestuursrecht][ref1] ingediende bezwaarschriften en
      beroepschriften, gericht op het handelen van de Dienst Wegverkeer,


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 4q.2.e
    text: |-
      het opsporen van bij of krachtens deze wet strafbaar gestelde feiten voor zover de ambtenaren van de Dienst
      Wegverkeer daarmee ingevolge [artikel 159][ref1] zijn belast,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: 4q.2.f
    text: |-
      het beheer en de instandhouding van het in
      [artikel 13, tweede lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1] bedoelde register, en


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel13
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '13'
  - number: 4q.2.g
    text: |-
      het verstrekken van gegevens uit het in onderdeel f bedoelde register aan degenen die ingevolge de in
      [artikel 38, tweede lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1] bedoelde algemene maatregel
      van bestuur niet tot betaling van het ter zake vastgestelde tarief zijn gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel38
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '38'
  - number: 4r
    text: |-
      De directie stelt bij reglement richtlijnen vast voor het voeren van een ordelijk financieel beheer van de Dienst
      Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4r
  - number: 4s.1
    text: De directie stelt jaarlijks een jaarverslag en een jaarrekening op.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4s
  - number: 4s.2
    text: Het boekjaar van de Dienst Wegverkeer valt samen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4s
  - number: 4s.3
    text: De directie zendt jaarlijks binnen vier maanden na afloop van het boekjaar de jaarstukken aan de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4s
  - number: 4s.4
    text: 'De jaarstukken omvatten:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4s
  - number: 4s.4.a
    text: het jaarverslag;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4s
  - number: 4s.4.b
    text: de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4s
  - number: 4s.4.c
    text: de verklaring van de door de raad van toezicht aangewezen externe registeraccountant;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4s
  - number: 4s.4.d
    text: een opgave over de toepassing van de arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4s
  - number: 4s.5
    text: |-
      De directie zendt binnen zes maanden na afloop van het boekjaar de jaarstukken met een document, houdende de
      goedkeuring door de raad van toezicht van het jaarverslag en de jaarrekening ter kennisneming aan Onze Minister.
      De directie stelt te zelfder tijd de in het vierde lid, onderdelen *a*, *b* en *c*, bedoelde stukken algemeen
      verkrijgbaar en maakt hiervan melding in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4s
  - number: 4t.1
    text: |-
      De directie dient het financiële meerjarenbeleidsplan en de goedkeuring daarvan door de raad van toezicht voor 1
      oktober voorafgaand aan het boekjaar, in bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4t
  - number: 4t.2
    text: |-
      De directie verstrekt Onze Minister voor 15 januari van het jaar voorafgaand aan het begrotingsjaar de door Onze
      Minister voor het opstellen van de Rijksbegroting vereiste gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4t
  - number: 4t.3
    text: |-
      Onze Minister kan regels stellen over de inrichting van de begroting, het financiële meerjarenbeleidsplan en de
      jaarstukken, en kan aandachtspunten vaststellen voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4t
  - number: 4u.1
    text: De directie verstrekt Onze Minister de inlichtingen die deze ten behoeve van zijn taakuitoefening nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4u
  - number: 4u.2
    text: |-
      Onze Minister verstrekt de Dienst Wegverkeer de inlichtingen die deze voor zijn taakuitoefening redelijkerwijs
      nodig heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4u
  - number: 4u.3
    text: |-
      Onze Minister stelt een informatiestatuut vast. Het informatiestatuut bevat inhoudelijke en procedurele
      voorschriften met betrekking tot de in dit hoofdstuk bedoelde informatie-uitwisseling tussen Onze Minister en de
      Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4u
  - number: 4v.1
    text: |-
      Waar in deze wet de goedkeuring van Onze Minister is vereist, verleent dan wel onthoudt deze die goedkeuring binnen
      zes weken na de datum van ontvangst van de aan goedkeuring onderhevige stukken.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4v
  - number: 4v.2
    text: |-
      Met goedkeuring wordt gelijkgesteld het verstrijken van de in het eerste lid bedoelde termijn zonder dat de
      goedkeuring is verleend of onthouden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4v
  - number: 4w.1
    text: |-
      Waar ingevolge deze wet de goedkeuring dan wel de vaststelling door de raad van toezicht is vereist, verleent of
      onthoudt deze die goedkeuring dan wel stelt deze vast of weigert die vaststelling binnen zes weken na de datum van
      ontvangst van de aan goedkeuring onderhevige dan wel vast te stellen stukken.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4w
  - number: 4w.2
    text: |-
      Met goedkeuring dan wel vaststelling wordt gelijkgesteld het verstrijken van de in het eerste lid bedoelde termijn
      zonder dat de goedkeuring is verleend of onthouden dan wel de vaststelling heeft plaatsgevonden of is geweigerd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4w
  - number: 4w.3
    text: |-
      Indien de raad van toezicht goedkeuring onthoudt aan de financiële begroting, is de directie gerechtigd gedurende
      ten hoogste zes maanden voor iedere maand gedurende welke de goedkeuring wordt onthouden, uitgaven te doen ter
      grootte van maximaal een twaalfde deel van de begroting van het voorafgaande boekjaar.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4w
  - number: 4x.1
    text: |-
      Indien naar het oordeel van Onze Minister de Dienst Wegverkeer zijn taken, omschreven in
      [artikel 4b, eerste lid en tweede lid, onderdeel b][ref1], niet langer naar behoren verricht, kan Onze Minister
      bepalen dat de bevoegdheden die met die taken verband houden niet langer aan de Dienst Wegverkeer toekomen. De
      betrokken bevoegdheden gaan in dat geval over op Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4x
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4b
        hoofdstuk: IA
        paragraaf: '2'
  - number: 4x.2
    text: |-
      Indien de Dienst Wegverkeer een bij of krachtens een andere wet dan deze wet opgedragen taak naar het oordeel
      van Onze Minister en Onze voor die wet eerst verantwoordelijke Minister niet langer naar behoren verricht, kunnen
      zij gezamenlijk bepalen dat de bevoegdheden die met die taak verband houden niet langer aan de Dienst Wegverkeer
      toekomen. De betrokken bevoegdheden gaan in dat geval over op Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4x
  - number: 4y
    text: Het Besluit voorschrift informatiebeveiliging rijksdienst 1994 is van toepassing op de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4y
  - number: 4z.1
    text: |-
      Het CBR verstrekt desgevraagd aan Onze Minister de inlichtingen die deze ten behoeve van zijn taakuitoefening nodig
      oordeelt. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling
      van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4z
  - number: 4z.2
    text: |-
      Onze Minister kan aan het CBR aanwijzingen van algemene aard geven met betrekking tot de uitvoering van de
      [artikelen 130 tot en met 134a][ref1] en [149, tweede lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel149
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4z
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '149'
        hoofdstuk: VII
  - number: 4z.3
    text: |-
      Indien het CBR naar het oordeel van Onze Minister zijn taak ernstig verwaarloost of in gevaar brengt, kan Onze
      Minister, gehoord het CBR, de noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4z
  - number: 4z.4
    text: |-
      Over de uitoefening van het toezicht op het CBR door Onze Minister kunnen bij of krachtens algemene maatregel van
      bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4z
  - number: 4aa.1
    text: |-
      Keuringsinstellingen, aangewezen ingevolge de [artikelen 71a][ref1], [84, eerste lid][ref2], en
      [artikel 101, eerste lid][ref3], en de ingevolge deze artikelen aangewezen onderzoeksgerechtigden verstrekken
      desgevraagd aan Onze Minister de inlichtingen die deze ten behoeve van zijn taakuitoefening nodig oordeelt. Onze
      Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijze noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel101
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4aa
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 71a
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '84'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '101'
        hoofdstuk: V
        paragraaf: '8'
  - number: 4aa.2
    text: |-
      Onze Minister kan aan de in het eerste lid bedoelde keuringsinstellingen en onderzoeksgerechtigden aanwijzingen van
      algemene aard geven met betrekking tot de uitvoering van de taak waarvoor zij zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4aa
  - number: 4aa.3
    text: |-
      Onze Minister kan tarieven vaststellen die de in het eerste lid bedoelde keuringsinstellingen en
      onderzoeksgerechtigden ten hoogste mogen berekenen voor de door hen verrichte werkzaamheden in het kader van de
      uitvoering van de taak waarvoor zij zijn aangewezen. Daarbij kunnen voor verschillende werkzaamheden verschillende
      tarieven worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4aa
  - number: 4aa.4
    text: |-
      Indien een keuringsinstelling als bedoeld in het eerste lid naar het oordeel van Onze Minister haar taak
      verwaarloost, kan Onze Minister de aanwijzing intrekken.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4aa
  - number: 4aa.5
    text: |-
      Over de uitoefening van het toezicht op keuringsinstellingen en onderzoeksgerechtigden als bedoeld in het eerste
      lid kunnen bij of krachtens algemene maatregel van bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4aa
  - number: '5'
    text: |-
      Het is een ieder verboden zich zodanig te gedragen dat gevaar op de weg wordt veroorzaakt of kan worden veroorzaakt
      of dat het verkeer op de weg wordt gehinderd of kan worden gehinderd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel5
  - number: '6'
    text: |-
      Het is een ieder die aan het verkeer deelneemt verboden zich zodanig te gedragen dat een aan zijn schuld te wijten
      verkeersongeval plaatsvindt waardoor een ander wordt gedood of waardoor een ander zwaar lichamelijk letsel wordt
      toegebracht of zodanig lichamelijk letsel dat daaruit tijdelijke ziekte of verhindering in de uitoefening van de
      normale bezigheden ontstaat.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel6
  - number: '7.1'
    text: |-
      Het is degene die bij een verkeersongeval is betrokken of door wiens gedraging een verkeersongeval is veroorzaakt,
      verboden de plaats van het ongeval te verlaten indien:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel7
  - number: 7.1.a
    text: |-
      bij dat ongeval, naar hij weet of redelijkerwijs moet vermoeden, een ander is gedood dan wel letsel of schade aan
      een ander is toegebracht;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel7
  - number: 7.1.b
    text: |-
      daardoor, naar hij weet of redelijkerwijs moet vermoeden, een ander aan wie bij dat ongeval letsel is toegebracht,
      in hulpeloze toestand wordt achtergelaten.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid, aanhef en onderdeel *a*, is niet van toepassing op degene die op de plaats van het ongeval
      behoorlijk de gelegenheid heeft geboden tot vaststelling van zijn identiteit en, voor zover hij een motorrijtuig
      bestuurde, tevens van de identiteit van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel7
  - number: '8.1'
    text: |-
      Het is een ieder verboden een voertuig te besturen of als bestuurder te doen besturen, terwijl hij verkeert onder
      zodanige invloed van een stof, waarvan hij weet of redelijkerwijs moet weten, dat het gebruik daarvan - al dan niet
      in combinatie met het gebruik van een andere stof - de rijvaardigheid kan verminderen, dat hij niet tot behoorlijk
      besturen in staat moet worden geacht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel8
  - number: '8.2'
    text: |-
      Het is een ieder verboden een voertuig te besturen of als bestuurder te doen besturen na zodanig gebruik van
      alcoholhoudende drank, dat:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel8
  - number: 8.2.a
    text: |-
      het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan 220 microgram alcohol per liter
      uitgeademde lucht, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel8
  - number: 8.2.b
    text: |-
      het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan 0,5 milligram alcohol per milliliter
      bloed.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel8
  - number: '8.3'
    text: |-
      In afwijking van het tweede lid is het de bestuurder van een motorrijtuig voor het besturen waarvan een
      rijbewijs is vereist, indien sedert de datum waarop aan hem voor de eerste maal een rijbewijs is afgegeven nog
      geen vijf jaren zijn verstreken, dan wel, indien het voor het eerst afgegeven rijbewijs een rijbewijs betreft
      dat de bevoegdheid geeft tot het besturen van bromfietsen en dit rijbewijs is afgegeven aan een persoon die op
      het ogenblik van die afgifte de leeftijd van achttien jaren nog niet heeft bereikt, nog geen zeven jaar zijn
      verstreken, en de eerste afgifte van het rijbewijs op of na 30 maart 2002 heeft plaatsgevonden, verboden dat
      motorrijtuig te besturen of als bestuurder te doen besturen na zodanig gebruik van alcoholhoudende drank, dat:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel8
  - number: 8.3.a
    text: |-
      het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan 88 microgram alcohol per liter
      uitgeademde lucht, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel8
  - number: 8.3.b
    text: het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan 0,2 milligram per milliliter bloed.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel8
  - number: '8.4'
    text: |-
      Het derde lid is van overeenkomstige toepassing op de bestuurder van een motorrijtuig die zonder rijbewijs een
      motorrijtuig bestuurt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel8
  - number: '8.5'
    text: |-
      Het is verboden een motorrijtuig als bestuurder te doen besturen door een persoon waarvan men weet of
      redelijkerwijs moet weten dat deze verkeert in een toestand als in het eerste, tweede of derde lid is omschreven.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel8
  - number: '8.6'
    text: |-
      Voor de toepassing van het derde lid wordt onder een rijbewijs mede verstaan een rijbewijs, afgegeven door het
      daartoe bevoegde gezag buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel8
  - number: '9.1'
    text: |-
      Het is degene die weet of redelijkerwijs moet weten dat hem bij rechterlijke uitspraak de bevoegdheid tot het
      besturen van motorrijtuigen is ontzegd, verboden gedurende de tijd dat hem die bevoegdheid is ontzegd, op de weg
      een motorrijtuig te besturen of als bestuurder te doen besturen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel9
  - number: '9.2'
    text: |-
      Het is degene die weet of redelijkerwijs moet weten dat een op zijn naam gesteld rijbewijs voor een of meer
      categorieën van motorrijtuigen dan wel voor een gedeelte van de geldigheidsduur ongeldig is verklaard, indien aan
      hem daarna geen ander rijbewijs voor het besturen van een motorrijtuig van de betrokken categorie of categorieën is
      afgegeven, verboden op de weg een motorrijtuig van die categorie of categorieën dan wel gedurende dat gedeelte van
      de geldigheidsduur te besturen of als bestuurder te doen besturen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel9
  - number: '9.3'
    text: |-
      Het tweede lid geldt niet ten aanzien van de bestuurder van een motorrijtuig gedurende de tijd dat aan hem ter
      verkrijging van een rijbewijs voor de categorie of categorieën van motorrijtuigen waarop de ongeldigverklaring
      betrekking heeft, rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven en
      gedurende de tijd dat door hem een rijproef wordt afgelegd in het kader van een onderzoek, door of vanwege de
      overheid ingesteld, naar zijn rijvaardigheid of geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: '9.4'
    text: |-
      Het is degene van wie ingevolge [artikel 130, tweede lid][ref1], de overgifte van een op zijn naam gesteld
      rijbewijs is gevorderd, dan wel wiens rijbewijs is ingevorderd en aan wie dat bewijs niet is teruggegeven, verboden
      op de weg een motorrijtuig van de categorie of categorieën waarvoor dat bewijs was afgegeven, te besturen of als
      bestuurder te doen besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '9'
  - number: '9.5'
    text: |-
      Het is degene die weet of redelijkerwijs moet weten dat de geldigheid van een op zijn naam gesteld rijbewijs
      ingevolge [artikel 131, derde lid, onderdeel ][ref1], voor een of meer categorieën van motorrijtuigen is geschorst,
      verboden gedurende de tijd dat de schorsing van kracht is, op de weg een motorrijtuig van de categorie of
      categorieën waarop de schorsing betrekking heeft, te besturen of als bestuurder te doen besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '9'
  - number: '9.6'
    text: |-
      Het vierde en het vijfde lid gelden niet ten aanzien van de bestuurder van een motorrijtuig gedurende de tijd dat
      door hem een rijproef wordt afgelegd in het kader van een ingevolge [artikel 131, eerste lid][ref1], gevorderd
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '9'
  - number: '9.7'
    text: |-
      Het is degene van wie ingevolge [artikel 164][ref1] de overgifte van een op zijn naam gesteld rijbewijs, een hem
      door het daartoe bevoegde gezag buiten Nederland afgegeven rijbewijs of een internationaal rijbewijs is gevorderd,
      dan wel van wie zodanig bewijs is ingevorderd en aan wie dat bewijs niet is teruggegeven, verboden op de weg een
      motorrijtuig van de categorie of categorieën waarvoor dat bewijs was afgegeven, te besturen of als bestuurder te
      doen besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel164
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '164'
        hoofdstuk: IX
  - number: '9.8'
    text: |-
      Het is degene van wie ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1] de
      inlevering van het rijbewijs is gevorderd, dan wel wiens rijbewijs krachtens die wet is ingenomen, verboden op de
      weg een motorrijtuig, voor het besturen waarvan het rijbewijs is afgegeven, te besturen of als bestuurder te doen
      besturen met ingang van het tijdstip, bedoeld in [artikel 30, eerste lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004581
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel30
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004581
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '30'
  - number: '9.9'
    text: |-
      Voor de toepassing van het tweede, vierde, vijfde, zesde en achtste lid wordt onder rijbewijs mede verstaan een
      rijbewijs, afgegeven door het daartoe bevoegde gezag buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel9
  - number: '10.1'
    text: Het is verboden op de weg een wedstrijd met voertuigen te houden of daaraan deel te nemen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel10
  - number: '10.2'
    text: |-
      Onder wedstrijd wordt voor de toepassing van dit artikel verstaan elk rijden met voertuigen ter vaststelling of
      vergelijking van prestaties hetzij van de deelnemers, hetzij van de voertuigen, hetzij van onderdelen daarvan,
      hetzij van bedrijfsstoffen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel10
  - number: '10.3'
    text: |-
      Als deelnemer wordt beschouwd de bestuurder van een voertuig waarmee aan een wedstrijd wordt deelgenomen, en de
      eigenaar of houder van een voertuig, die daarmee aan een wedstrijd doet of laat deelnemen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel10
  - number: '11'
    text: Het is verboden opzettelijk wederrechtelijk een aan een ander toebehorend motorrijtuig op de weg te gebruiken.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel11
  - number: '12.1'
    text: |-
      Weggebruikers zijn verplicht gevolg te geven aan de aanwijzingen die door de in [artikel 159][ref1] bedoelde
      personen dan wel door andere bij algemene maatregel van bestuur aangewezen personen ter zake van het verkeer op de
      weg worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '12.2'
    text: |-
      De in het eerste lid bedoelde aanwijzingen mogen slechts worden gegeven in het belang van de veiligheid op de weg,
      de instandhouding van de weg en de bruikbaarheid daarvan, of de vrijheid van het verkeer dan wel in het belang van
      met toestemming van Onze Minister verrichte onderzoeken ten behoeve van het verkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel12
  - number: '12.3'
    text: Omtrent het eerste lid kunnen nadere regels worden vastgesteld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel12
  - number: '13.1'
    text: Bij algemene maatregel van bestuur worden nadere regels vastgesteld betreffende het gedrag van verkeersdeelnemers.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel13
  - number: '13.2'
    text: |-
      In de bij die algemene maatregel van bestuur aangegeven gevallen kunnen bij ministeriële regeling voorschriften ter
      uitvoering van die regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel13
  - number: '14'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld omtrent het toepassen van verkeerstekens en
      onderborden alsmede omtrent het treffen van maatregelen op of aan de weg tot wijziging van de inrichting van de
      weg of tot het aanbrengen of verwijderen van voorzieningen ter regeling van het verkeer. Bij ministeriële regeling
      worden nadere regels vastgesteld betreffende het toepassen van verkeerstekens en onderborden. Bij ministeriële
      regeling worden voorschriften vastgesteld betreffende inrichting, plaatsing, kleur, afmeting en materiaal van
      verkeerstekens en onderborden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel14
  - number: '15.1'
    text: |-
      De plaatsing of verwijdering van de bij algemene maatregel van bestuur aangewezen verkeerstekens, en onderborden
      voor zover daardoor een gebod of verbod ontstaat of wordt gewijzigd, geschiedt krachtens een verkeersbesluit.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel15
  - number: '15.2'
    text: |-
      Maatregelen op of aan de weg tot wijziging van de inrichting van de weg of tot het aanbrengen of verwijderen van
      voorzieningen ter regeling van het verkeer geschieden krachtens een verkeersbesluit, indien de maatregelen leiden
      tot een beperking of uitbreiding van het aantal categorieën weggebruikers dat van een weg of weggedeelte gebruik
      kan maken.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel15
  - number: '16.1'
    text: |-
      De in [artikel 15][ref1] bedoelde verkeerstekens en onderborden worden geplaatst of verwijderd, en de daar bedoelde
      maatregelen worden getroffen, door de zorg van het gezag dat het verkeersbesluit heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
  - number: '16.2'
    text: |-
      Verkeerstekens en onderborden, die niet worden geplaatst of verwijderd krachtens een verkeersbesluit, worden
      geplaatst of verwijderd door de zorg van het openbaar lichaam dat het beheer heeft over de weg of, indien geen
      openbaar lichaam het beheer heeft, door de zorg van de eigenaar van de weg.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel16
  - number: '17'
    text: |-
      In de bij algemene maatregel van bestuur aangewezen gevallen kan bij de plaatsing en verwijdering van
      verkeerstekens en het treffen van maatregelen op of aan de weg, worden afgeweken van de [artikelen 15][ref1]
      en [16][ref2]. Indien het als gevolg van dringende omstandigheden niet mogelijk is de verkeerstekens in de
      voorgeschreven uitvoering te plaatsen, kan de door het teken aangeduide informatie op andere duidelijke wijze
      kenbaar worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel16
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
  - number: '18.1'
    text: 'Verkeersbesluiten worden genomen:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel18
  - number: 18.1.a
    text: voor zover zij betreffen het verkeer op wegen onder beheer van het Rijk door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel18
  - number: 18.1.b
    text: voor zover zij betreffen het verkeer op wegen onder beheer van een provincie door gedeputeerde staten;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel18
  - number: 18.1.c
    text: |-
      voor zover zij betreffen het verkeer op wegen onder beheer van een waterschap door het algemeen bestuur of,
      krachtens besluit van het algemeen bestuur, door het dagelijks bestuur;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel18
  - number: 18.1.d
    text: |-
      voor zover zij betreffen het verkeer op andere wegen door burgemeester en wethouders, of krachtens besluit van hen,
      door een door hen ingestelde bestuurscommissie of het dagelijks bestuur van een deelgemeente.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel18
  - number: '18.2'
    text: |-
      Indien het beheer over een weg wordt overgedragen, blijven de verkeersbesluiten die de oorspronkelijke wegbeheerder
      ten aanzien van het verkeer op die weg heeft vastgesteld, van kracht totdat zij zijn vervangen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel18
  - number: '18.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld omtrent de eisen waaraan verkeersbesluiten dienen te
      voldoen alsmede omtrent de totstandkoming en de inwerkingtreding van die besluiten.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel18
  - number: '19.1'
    text: |-
      Gedeputeerde staten kunnen aan besturen van waterschappen en aan burgemeester en wethouders de aanwijzing geven
      om op buiten de bebouwde kom gelegen wegen, ten aanzien waarvan die organen bevoegd zijn tot het nemen van
      verkeersbesluiten, binnen dertien weken een verkeersbesluit van een daarbij aan te geven inhoud te nemen en uit
      te voeren.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel19
  - number: '19.2'
    text: 'Het eerste lid mag worden toegepast, indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel19
  - number: 19.2.a
    text: |-
      op een buiten de bebouwde kom gelegen weg, die bij meerdere organen in beheer is, naar het oordeel van gedeputeerde
      staten een of meerdere niet op elkaar afgestemde verkeersbesluiten van kracht zijn, die zodanige afstemming
      behoeven met het oog op de belangen, omschreven in [artikel 2, eerste lid, onderdelen ][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: 19.2.b
    text: |-
      gedeputeerde staten van oordeel zijn dat het nemen van een verkeersbesluit noodzakelijk is ter bescherming van de
      belangen, bedoeld in [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: '19.3'
    text: |-
      Gedeputeerde staten dienen voorafgaande aan het geven van een aanwijzing als bedoeld in het eerste lid overleg te
      voeren met het betrokken bestuur.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel19
  - number: '19.4'
    text: Het betrokken bestuur is verplicht een aanwijzing als bedoeld in het eerste lid op te volgen en uit te voeren.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel19
  - number: '19.5'
    text: |-
      Indien een aanwijzing als bedoeld in het eerste lid niet wordt opgevolgd of uitgevoerd, gaan gedeputeerde staten op
      kosten van het betrokken bestuur tot het nemen van het verkeersbesluit en zo nodig tot de uitvoering daarvan over.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel19
  - number: '19.6'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld over de totstandkoming en de inhoud van de in het
      eerste lid bedoelde aanwijzingen alsmede over hetgeen verder voor de uitvoering van dit artikel noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel19
  - number: '20'
    text: |-
      Een belanghebbende kan tegen een verkeersbesluit tot plaatsing of verwijdering van verkeerstekens en onderborden of
      tot het treffen van maatregelen op of aan de weg ter regeling van het verkeer beroep instellen bij de rechtbank.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel20
  - number: 20a.1
    text: De grenzen van de bebouwde kom of kommen van een gemeente worden vastgesteld bij besluit van de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel20a
  - number: 20a.2
    text: Bij algemene maatregel van bestuur worden nadere regels inzake de vaststelling van bebouwde kommen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel20a
  - number: '21.1'
    text: |-
      Bij algemene maatregel van bestuur aan te wijzen categorieën van voertuigen, voertuigonderdelen, uitrustingsstukken
      en voorzieningen ter bescherming van weggebruikers en passagiers dienen te zijn goedgekeurd voor toelating tot
      het verkeer op de weg. Onder de aan te wijzen categorieën van voertuigen vallen in elk geval de nader bij algemene
      maatregel van bestuur omschreven:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel21
  - number: 21.1.a
    text: personenauto's,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel21
  - number: 21.1.b
    text: 'bedrijfsauto''s, waaronder: bestelwagens, vrachtwagens en bussen,'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel21
  - number: 21.1.c
    text: motorfietsen,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel21
  - number: 21.1.d
    text: driewielige motorrijtuigen,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel21
  - number: 21.1.e
    text: bromfietsen, en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel21
  - number: 21.1.f
    text: aanhangwagens met een toegestane maximum massa van meer dan 750 kg.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel21
  - number: '21.2'
    text: |-
      De goedkeuring kan worden verleend als typegoedkeuring, dan wel, met betrekking tot voertuigen, als goedkeuring
      voor een individueel voertuig.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel21
  - number: '22.1'
    text: |-
      Een typegoedkeuring wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van
      het daarvoor door deze dienst vastgestelde tarief door deze dienst verleend indien het voertuig, voertuigonderdeel,
      uitrustingsstuk of de voorziening ter bescherming van een weggebruiker of passagier, waarvoor de goedkeuring
      wordt gevraagd, bij een door de dienst verrichte keuring heeft voldaan aan de bij algemene maatregel van bestuur
      vastgestelde eisen met betrekking tot de toelating tot het verkeer op de weg. Bij ministeriële regeling kunnen ter
      uitvoering van die eisen voorschriften worden vastgesteld. In de gevallen, aangegeven in die algemene maatregel van
      bestuur, worden bij ministeriële regeling eisen vastgesteld met betrekking tot voertuigen die voor een daarbij aan
      te geven datum in gebruik zijn genomen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel22
  - number: '22.2'
    text: |-
      Met een typegoedkeuring wordt gelijkgesteld de goedkeuring die door het daartoe bevoegde gezag in een andere Lid-
      Staat van de Europese Gemeenschappen, een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of Zwitserland is verleend overeenkomstig de op het betrokken voertuig, voertuigonderdeel,
      uitrustingsstuk of de voorziening ter bescherming van een weggebruiker of passagier betrekking hebbende, in het
      kader van de Europese Gemeenschappen tot stand gekomen voorschriften.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel22
  - number: '22.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld betreffende de organisatie van de aanvrager, het proces
      volgens hetwelk de aanvrager zijn werkzaamheden verricht, het door de aanvrager voor de keuring ter beschikking
      stellen van voertuigen, voertuigonderdelen, uitrustingsstukken en voorzieningen ter bescherming van weggebruikers
      en passagiers, het door de aanvrager overleggen van bescheiden en verstrekken van inlichtingen ter zake van de
      keuring alsmede betreffende de wijze waarop de keuring wordt verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel22
  - number: '22.4'
    text: |-
      Onze Minister kan bepalen dat op nader aangeduide soorten voertuigen, voertuigonderdelen, uitrustingsstukken en
      voorzieningen ter bescherming van weggebruikers en passagiers, behorende tot een goedgekeurd type, overeenkomstig
      door hem vastgestelde regels een door hem vastgesteld keurmerk of een door hem bekendgemaakte aanduiding moet zijn
      vermeld dan wel door hem aangewezen gegevens moeten zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel22
  - number: '23.1'
    text: |-
      De Dienst Wegverkeer houdt toezicht op het overeenstemmen van voertuigen, voertuigonderdelen, uitrustingsstukken en
      voorzieningen ter bescherming van weggebruikers en passagiers, die doorgaan voor goedgekeurd, met het type waarvoor
      de goedkeuring is verleend. Tot dit toezicht kan behoren het steekproefsgewijs keuren van tot een type waarvoor
      de goedkeuring is verleend, behorende voertuigen, voertuigonderdelen, uitrustingsstukken of voorzieningen ter
      bescherming van weggebruikers en passagiers. Voorts kan tot het toezicht behoren het periodiek controleren van de
      organisatie van degene aan wie de goedkeuring is verleend alsmede het proces volgens hetwelk hij zijn werkzaamheden
      verricht. Degene aan wie de goedkeuring is verleend, is gehouden aan voor het houden van het toezicht noodzakelijke
      werkzaamheden medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel23
  - number: '23.2'
    text: |-
      Degene aan wie een goedkeuring is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel23
  - number: '23.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop het toezicht wordt
      gehouden en de verplichting tot medewerking daaraan van degene aan wie een goedkeuring is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel23
  - number: '24'
    text: |-
      Behoudens bij algemene maatregel van bestuur aangegeven uitzonderingen vervalt een verleende typegoedkeuring van
      rechtswege met ingang van de datum waarop zwaardere eisen van kracht worden voor de toelating tot het verkeer op
      de weg van voertuigen, voertuigonderdelen, uitrustingsstukken of voorzieningen ter bescherming van weggebruikers en
      passagiers als waarop de verleende typegoedkeuring betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel24
  - number: '25.1'
    text: |-
      De Dienst Wegverkeer trekt een typegoedkeuring in, indien degene aan wie de goedkeuring is verleend, daarom
      verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel25
  - number: '25.2'
    text: 'De Dienst Wegverkeer kan een typegoedkeuring intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel25
  - number: 25.2.a
    text: |-
      degene aan wie de goedkeuring is verleend een voertuig, voertuigonderdeel, uitrustingsstuk of voorziening ter
      bescherming van een weggebruiker of passagier doet of laat doorgaan voor goedgekeurd voor toelating tot het verkeer
      op de weg, terwijl dat voertuig, dat voertuigonderdeel, dat uitrustingsstuk of die voorziening niet overeenstemt
      met het type waarvoor de goedkeuring is verleend,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel25
  - number: 25.2.b
    text: |-
      degene aan wie de goedkeuring is verleend, de verplichting, vervat in [artikel 23, tweede lid][ref1], niet nakomt,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel23
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '23'
        hoofdstuk: III
        paragraaf: '2'
  - number: 25.2.c
    text: |-
      degene aan wie de goedkeuring is verleend, handelt in strijd met een of meer andere uit de goedkeuring
      voortvloeiende verplichtingen, of
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel25
  - number: 25.2.d
    text: blijkt dat de goedkeuring ten onrechte is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel25
  - number: '26.1'
    text: |-
      Een goedkeuring voor een individueel voertuig wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer
      vastgestelde wijze, van het daarvoor door deze dienst vastgestelde tarief door deze dienst verleend indien
      het voertuig bij een door de dienst verrichte keuring heeft voldaan aan de bij algemene maatregel van bestuur
      vastgestelde eisen met betrekking tot de toelating tot het verkeer op de weg, welke eisen voor verschillende
      groepen van voertuigen verschillend kunnen worden gesteld. Bij ministeriële regeling kunnen ter uitvoering van die
      eisen voorschriften worden vastgesteld. In de gevallen, aangegeven in die algemene maatregel van bestuur, worden
      bij ministeriële regeling eisen vastgesteld met betrekking tot voertuigen die voor een daarbij aan te geven datum
      in gebruik zijn genomen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel26
  - number: '26.2'
    text: |-
      [Artikel 22, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
  - number: '27'
    text: |-
      De in [artikel 22, eerste lid][ref1], of [26, eerste lid][ref2], bedoelde goedkeuring wordt eerst
      verleend indien het voertuig bij de keuring tevens heeft voldaan aan de eisen, gesteld krachtens de
      [Wet inzake de luchtverontreiniging][ref3] en de [Wet geluidhinder][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0002731
      [ref4]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002731
      - id: ref4
        bwb_id: BWBR0003227
  - number: '28.1'
    text: |-
      Indien het een voertuig betreft dat is bestemd om te worden gebruikt voor het vervoer van personen per bus
      waarop de [Wet personenvervoer 2000][ref1] betrekking heeft, wordt de in [artikel 22, eerste lid][ref2], of
      [26, eerste lid][ref3], bedoelde goedkeuring eerst verleend indien het voertuig bij de keuring tevens heeft voldaan
      aan de eisen die ingevolge [artikel 104, aanhef en onderdeel a, van de Wet personenvervoer 2000][ref4] voor wat
      betreft inrichting en uitrusting aan dat voertuig worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011470
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel104
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011470
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0011470
        artikel: '104'
  - number: '28.2'
    text: |-
      De keuring kan worden beperkt tot de in het eerste lid bedoelde eisen ingevolge de
      [Wet personenvervoer 2000][ref1], indien het voertuig reeds eerder overeenkomstig [paragraaf 2][ref2] of
      [paragraaf 3][ref3] is goedgekeurd voor toelating tot het verkeer op de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0011470
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011470
      - id: ref2
        bwb_id: BWBR0006622
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006622
        hoofdstuk: III
        paragraaf: '3'
  - number: '28.3'
    text: |-
      Op het voor het voertuig af te geven kentekenbewijs wordt melding gemaakt van goedkeuring als bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel28
  - number: '29.1'
    text: |-
      Een voertuig dat is bestemd om te worden gebruikt voor het vervoer van personen, anders dan per bus, waarop de
      [Wet personenvervoer 2000][ref1] betrekking heeft, kan worden gekeurd op het voldoen aan de eisen die ingevolge
      [artikel 104, aanhef en onderdeel a, van de Wet personenvervoer 2000][ref2] worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011470
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel104
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011470
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '104'
  - number: '29.2'
    text: |-
      Een keuring als bedoeld in het eerste lid wordt op aanvraag en tegen betaling op de door de Dienst Wegverkeer
      vastgestelde wijze, van het door deze dienst vastgestelde tarief, door deze dienst verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel29
  - number: '29.3'
    text: |-
      De [artikelen 22, derde en vierde lid][ref1], en [28, derde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel28
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '28'
        hoofdstuk: III
        paragraaf: '4'
  - number: '34.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden vastgesteld, inhoudende een verbod om voertuigen,
      voertuigonderdelen, uitrustingsstukken en voorzieningen ter bescherming van weggebruikers en passagiers, die
      niet ingevolge [artikel 22][ref1] of [26][ref2] zijn toegelaten tot het verkeer op de weg, te vervaardigen, in te
      voeren, in voorraad te hebben, te koop aan te bieden, af te leveren of te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel26
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
  - number: '34.2'
    text: |-
      De in het eerste lid bedoelde regels betreffen het aanwijzen van de categorie van voertuigen, voertuigonderdelen,
      uitrustingsstukken of voorzieningen ter bescherming van weggebruikers en passagiers, waarop het verbod betrekking
      heeft, de handelingen waarop het verbod betrekking heeft alsmede de uitzonderingen op het verbod.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel34
  - number: '35'
    text: |-
      Het is verboden een voertuig, voertuigonderdeel, uitrustingsstuk of voorziening ter bescherming van een
      weggebruiker of passagier, welk voertuig, voertuigonderdeel of uitrustingsstuk dan wel welke voorziening niet
      ingevolge [artikel 22][ref1] of [26][ref2] is toegelaten tot het verkeer op de weg, door het aanbrengen van een
      teken of tekens, het afgeven van een bewijs of bewijzen dan wel het doen van mededelingen te doen of laten doorgaan
      voor goedgekeurd voor zodanige toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel26
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
  - number: '36.1'
    text: |-
      Aan de eigenaar of houder van een motorrijtuig of een aanhangwagen op de weg dient overeenkomstig bij algemene
      maatregel van bestuur vastgestelde regels door de Dienst Wegverkeer een kenteken voor dat voertuig te zijn
      opgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel36
  - number: '36.2'
    text: |-
      Ter zake van de in het eerste lid bedoelde opgave dient overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels door de Dienst Wegverkeer een kentekenbewijs te zijn afgegeven aan de eigenaar of houder van
      het voertuig.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel36
  - number: '36.3'
    text: 'Het kentekenbewijs dient:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel36
  - number: 36.3.a
    text: te voldoen aan de bij ministeriële regeling vastgestelde eisen inzake inrichting en uitvoering,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel36
  - number: 36.3.b
    text: zijn geldigheid niet te hebben verloren,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel36
  - number: 36.3.c
    text: niet te zijn ingevorderd, en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel36
  - number: 36.3.d
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel36
  - number: '36.5'
    text: |-
      Motorrijtuigen en aanhangwagens dienen overeen te komen met de gegevens in het voor het betrokken voertuig
      afgegeven kentekenbewijs en met de gegevens die omtrent het voertuig zijn opgenomen in het kentekenregister, tenzij
      krachtens [artikel 71][ref1] een bepaalde afwijking van die gegevens is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
  - number: '36.6'
    text: 'Voor overtreding van het eerste tot en met vijfde lid zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel36
  - number: 36.6.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder die het motorrijtuig op de weg laat staan of daarmee
      over de weg laat rijden, alsmede in het geval dat met dat motorrijtuig over de weg wordt gereden, de bestuurder, en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel36
  - number: 36.6.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder die de aanhangwagen op de weg laat staan of deze met
      een motorrijtuig over de weg laat voortbewegen, alsmede in het geval dat de aanhangwagen met een motorrijtuig over
      de weg wordt voortbewogen, de bestuurder van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel36
  - number: '36.7'
    text: |-
      De in het derde lid, onderdeel *a*, bedoelde eisen kunnen mede dienstbaar zijn aan de heffing van de belasting van
      personenauto’s en motorrijwielen en van de motorrijtuigenbelasting. Op het kentekenbewijs wordt in ieder geval het
      verschuldigde bedrag van de belasting van personenauto’s en motorrijwielen vermeld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel36
  - number: '36.8'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel36
  - number: '37.1'
    text: |-
      [Artikel 36][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 37.1.a
    text: 'de volgende categorieën motorrijtuigen alsmede de door die motorrijtuigen voortbewogen aanhangwagens:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
  - number: 37.1.a.1°
    text: |-
      bij algemene maatregel van bestuur vastgestelde categorieën bromfietsen, alsmede bromfietsen in het internationaal
      verkeer, afkomstig uit een land waar voor deze voertuigen geen kenteken is opgegeven,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
  - number: 37.1.a.2°
    text: landbouwtrekkers,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
  - number: 37.1.a.3°
    text: gehandicaptenvoertuigen en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
  - number: 37.1.a.4°
    text: motorrijtuigen met beperkte snelheid;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
  - number: 37.1.b
    text: |-
      in het buitenland geregistreerde motorrijtuigen en aanhangwagens, die zich in het internationaal verkeer bevinden,
      mits ter zake van de registratie van het betrokken voertuig door het daartoe bevoegde gezag in het buitenland een
      bewijs is afgegeven dat voldoet aan de daaraan gestelde eisen in de tussen Nederland en het betrokken land van
      kracht zijnde internationale overeenkomst en het betrokken voertuig voldoet aan de eisen die in die overeenkomst
      dan wel bij algemene maatregel van bestuur ter uitvoering van die overeenkomst aan dat voertuig worden gesteld met
      betrekking tot de toelating tot het internationaal verkeer;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
  - number: 37.1.c
    text: |-
      motorrijtuigen en aanhangwagens, mits wordt voldaan aan nadere bij ministeriële regeling vast te stellen regels,
      die in eigendom toebehoren aan of worden gehouden door:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
  - number: 37.1.c.1°
    text: |-
      leden van een bij ministeriële regeling aangewezen krijgsmacht of civiele dienst in de zin van artikel I van het
      op 19 juni 1951 te Londen gesloten Verdrag tussen de landen die partij zijn bij het Noord-Atlantisch Verdrag nopens
      de rechtspositie van hun krijgsmachten (Trb. 1953, 10), dan wel in de zin van artikel 3 van het bij evenbedoeld
      verdrag behorende, op 28 augustus 1952 te Parijs gesloten, protocol nopens de rechtspositie van internationale
      militaire hoofdkwartieren ingesteld uit hoofde van het Noord-Atlantisch Verdrag (Trb. 1953, 11), alsmede
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
  - number: 37.1.c.2°
    text: |-
      functionarissen van de Noord-Atlantische Verdragsorganisatie die in Nederland zijn op grond van de briefwisseling
      tussen de regering van het Koninkrijk der Nederlanden en de Noord-Atlantische Verdragsorganisatie van 31 augustus
      en 11 september 1979 (Trb.1979, 159) en op wie het Verdrag nopens de rechtspositie van de Noord-Atlantische
      Verdragsorganisatie, van de nationale vertegenwoordigers bij haar organen en van haar internationale staf
      (Trb.1951, 139), van toepassing is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
  - number: '37.2'
    text: |-
      Voor aanhangwagens met een toegestane maximum massa van niet meer dan 750 kg alsmede voor aanhangwagens met een
      toegestane maximum massa van meer dan 750 kg, afkomstig uit een land waar voor deze aanhangwagens geen afzonderlijk
      kenteken is opgegeven, geldt het vereiste dat een kenteken dient te zijn opgegeven niet. Indien een dergelijke
      aanhangwagen is verbonden met een in Nederland geregistreerd motorrijtuig, dient die aanhangwagen te zijn voorzien
      van het kenteken dat is opgegeven voor dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
  - number: '37.3'
    text: |-
      Voor motorrijtuigen en aanhangwagens, die behoren tot de bedrijfsvoorraad van een natuurlijke persoon of
      rechtspersoon aan wie een erkenning als bedoeld in [artikel 62][ref1] is verleend of die voor herstel of bewerking
      ter beschikking zijn gesteld van een natuurlijke persoon of rechtspersoon, geldt het vereiste dat een kenteken
      voor een bepaald voertuig dient te zijn opgegeven, niet mits overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels gebruik wordt gemaakt van een bij algemene maatregel van bestuur aangewezen, door de Dienst
      Wegverkeer aan de natuurlijke persoon of rechtspersoon opgegeven, kenteken. Onze Minister kan aan laatstbedoelde
      opgave voorschriften verbinden. Bij ministeriële regeling kunnen met betrekking tot die voorschriften regels worden
      vastgesteld. Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen het gebruik van een zodanig
      kenteken verplicht is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '37.4'
    text: |-
      Met het toezicht op de naleving van de uit het derde lid voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de Staatscourant. Het toezicht heeft in ieder geval betrekking op het gebruik van het in het derde lid bedoelde
      kenteken. De aldaar bedoelde natuurlijke persoon of rechtspersoon is gehouden tot betaling, op de door de Dienst
      Wegverkeer vastgestelde wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde
      tarief. Bij ministeriële regeling worden nadere regels omtrent het toezicht vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
  - number: '37.5'
    text: 'Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
  - number: 37.5.a
    text: |-
      in bepaalde uitzonderingsgevallen tijdelijk wordt of kan worden afgeweken van het in
      [artikel 36, derde lid, onderdeel b of c][ref1], bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 37.5.b
    text: |-
      een motorrijtuig of een aanhangwagen op de weg mag staan, indien het voor het betrokken voertuig afgegeven
      kentekenbewijs ongeldig is verklaard ingevolge [artikel 58, tweede lid, onderdeel b, c, d of f][ref1], dan wel is
      ingevorderd overeenkomstig [artikel 60][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '58'
        hoofdstuk: IV
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '60'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '37.6'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de omschrijving van de in het eerste
      lid, onderdeel a, bedoelde categorieën voertuigen alsmede de voor die categorieën vastgestelde maximumsnelheid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
  - number: '37.7'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het derde lid en kunnen nadere regels
      worden vastgesteld ter uitvoering van het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel37
  - number: '38.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat bepaalde categorieën van kentekens slechts worden
      opgegeven aan bij die algemene maatregel van bestuur aan te wijzen personen of groepen van personen dan wel voor
      daarbij aan te wijzen voertuigen of groepen van voertuigen, zulks onder daarbij te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel38
  - number: '38.2'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel38
  - number: '40.1'
    text: Het kenteken dient behoorlijk zichtbaar op of aan het motorrijtuig of de aanhangwagen aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel40
  - number: '40.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de inrichting, het aanbrengen en
      de verlichting van het kenteken en worden regels vastgesteld omtrent de kentekenplaat en de onderdelen daarvan,
      alsmede de daarop aan te brengen merken.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel40
  - number: '40.3'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het bepaalde krachtens het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel40
  - number: '40.4'
    text: 'Voor overtreding van het eerste lid dan wel het bepaalde krachtens het tweede of derde lid zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel40
  - number: 40.4.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder die het motorrijtuig op de weg laat staan of daarmee
      over de weg laat rijden, alsmede in het geval dat met dat motorrijtuig over de weg wordt gereden, de bestuurder, en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel40
  - number: 40.4.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder die de aanhangwagen op de weg laat staan of deze met
      een motorrijtuig over de weg laat voortbewegen, alsmede in het geval dat de aanhangwagen met een motorrijtuig over
      de weg wordt voortbewogen, de bestuurder van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel40
  - number: '41.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel41
  - number: 41.1.a
    text: |-
      op een motorrijtuig of een aanhangwagen enig teken of middel aan te brengen of te doen aanbrengen met het oogmerk
      de herkenning, daaronder begrepen de herkenning met behulp van technische voorzieningen, van het ingevolge
      [artikel 40][ref1] gevoerde kenteken te bemoeilijken;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 41.1.b
    text: |-
      een motorrijtuig op de weg te laten staan of daarmee over de weg te rijden dan wel een aanhangwagen op de weg te
      laten staan of met een motorrijtuig over de weg voort te bewegen, wanneer op dat motorrijtuig of die aanhangwagen
      enig teken of middel is aangebracht, waardoor de herkenning, daaronder begrepen de herkenning met behulp van
      technische voorzieningen, van het ingevolge [artikel 40][ref1] gevoerde kenteken wordt bemoeilijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 41.1.c
    text: |-
      op een motorrijtuig of een aanhangwagen een teken, niet zijnde een ingevolge [artikel 36][ref1] aan de eigenaar of
      houder voor dat motorrijtuig of die aanhangwagen opgegeven kenteken, aan te brengen of te doen aanbrengen met het
      oogmerk dat teken te doen doorgaan voor een zodanig kenteken;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 41.1.d
    text: |-
      een motorrijtuig op de weg te laten staan of daarmee over de weg te rijden dan wel een aanhangwagen op de weg te
      laten staan of met een motorrijtuig over de weg voort te bewegen, wanneer op dat motorrijtuig of die aanhangwagen
      een teken is aangebracht dat, niet zijnde een ingevolge [artikel 36][ref1] aan de eigenaar of houder voor dat
      motorrijtuig of die aanhangwagen opgegeven kenteken, door kan gaan voor een zodanig kenteken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '41.2'
    text: 'Voor overtreding van het eerste lid, onderdelen *b* en *d*, zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel41
  - number: 41.2.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder die het motorrijtuig op de weg laat staan of daarmee
      over de weg laat rijden, alsmede in het geval dat met dat motorrijtuig over de weg wordt gereden, de bestuurder,
      een en ander echter slechts indien de eigenaar, houder of bestuurder weet of redelijkerwijze kan vermoeden dat op
      het motorrijtuig een teken of middel als bedoeld in het eerste lid, onderdeel *b*, dan wel een teken als bedoeld in
      het eerste lid, onderdeel *d*, is aangebracht, en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel41
  - number: 41.2.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder die de aanhangwagen op de weg laat staan of deze
      met een motorrijtuig over de weg laat voortbewegen, alsmede in het geval dat de aanhangwagen met een motorrijtuig
      over de weg wordt voortbewogen, de bestuurder van dat motorrijtuig, een en ander echter slechts indien de eigenaar,
      houder of bestuurder weet of redelijkerwijze kan vermoeden dat op de aanhangwagen een teken of middel als bedoeld
      in het eerste lid, onderdeel *b*, dan wel een teken als bedoeld in het eerste lid, onderdeel *d*, is aangebracht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel41
  - number: '42.1'
    text: De Dienst Wegverkeer houdt een register betreffende de opgave van kentekens.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel42
  - number: '42.2'
    text: |-
      In het kader van het register verwerkt de Dienst Wegverkeer gegevens omtrent motorrijtuigen en aanhangwagens,
      waarvoor een kenteken is opgegeven, en de tenaamstelling van die kentekens, alsmede omtrent andere motorrijtuigen
      en aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel42
  - number: '42.3'
    text: 'Het verzamelen van gegevens als bedoeld in het tweede lid, geschiedt voor de volgende doeleinden:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel42
  - number: 42.3.a
    text: |-
      voor een goede uitvoering van deze wet en voor de handhaving van de bij of krachtens deze wet vastgestelde
      voorschriften, of
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel42
  - number: 42.3.b
    text: |-
      voor een goede uitvoering van de [Wet op de motorrijtuigenbelasting 1994][ref1],
      de [Wet op de belasting van personenauto's en motorrijwielen 1992][ref2], de
      [Wet aansprakelijkheidsverzekering motorrijtuigen][ref3] , de [Wet bereikbaarheid en mobiliteit][ref4] dan wel
      andere wettelijke regelingen ten aanzien van motorrijtuigen en aanhangwagens, en voor de handhaving van de bij of
      krachtens die wettelijke regelingen vastgestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006324
      [ref2]: https://wetten.overheid.nl/BWBR0005806
      [ref3]: https://wetten.overheid.nl/BWBR0002415
      [ref4]: https://wetten.overheid.nl/BWBR0013854
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006324
      - id: ref2
        bwb_id: BWBR0005806
      - id: ref3
        bwb_id: BWBR0002415
      - id: ref4
        bwb_id: BWBR0013854
  - number: '42.4'
    text: |-
      De Dienst Wegverkeer mag strafrechtelijke gegevens, gegevens ter vaststelling van mogelijk strafbaar gedrag en
      gegevens over onrechtmatig of hinderlijk gedrag in verband met een opgelegd verbod naar aanleiding van dat gedrag,
      verwerken voor zover dit verband houdt met de in het derde lid genoemde doeleinden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel42
  - number: '42.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de inrichting en het beheer van het
      register.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel42
  - number: '43.1'
    text: |-
      Aan autoriteiten die betrokken zijn bij de uitvoering van deze wet dan wel de in [artikel 42, derde lid][ref1],
      bedoelde wettelijke regelingen of die zijn belast met de handhaving van de bij of krachtens deze wet dan wel de
      evenbedoelde wettelijke regelingen vastgestelde voorschriften, worden op de door de Dienst Wegverkeer te bepalen
      wijze desgevraagd uit het register de gegevens verstrekt die zij voor de uitoefening van hun taak behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel42
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '42'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '43.2'
    text: |-
      Aan autoriteiten buiten Nederland en instellingen van volkenrechtelijke organisaties worden in de bij algemene
      maatregel van bestuur te bepalen gevallen op de door de Dienst Wegverkeer te bepalen wijze uit het register
      gegevens verstrekt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel43
  - number: '43.3'
    text: |-
      De autoriteiten, bedoeld in het eerste lid, zijn gehouden om in bij algemene maatregel van bestuur te bepalen
      gevallen aan de Dienst Wegverkeer op de door deze dienst te bepalen wijze mededeling te doen van feiten die van
      belang zijn voor het bijhouden van het register.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel43
  - number: '44.1'
    text: |-
      Aan belanghebbenden kunnen, overeenkomstig bij algemene maatregel van bestuur vastgestelde regels, op aanvraag en
      tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het door deze dienst voor de behandeling
      van de aanvraag vastgestelde tarief, uit het register gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel44
  - number: '44.2'
    text: Aan belanghebbenden worden slechts gegevens verstrekt omtrent door hen opgegeven kentekens.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel44
  - number: '44.3'
    text: |-
      Bij ministeriële regeling kan in bijzondere gevallen, onder daarbij te stellen voorwaarden, worden toegestaan dat
      van het tweede lid wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel44
  - number: '44.4'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het verstrekken van gegevens aan belanghebbenden niet of slechts
      tot een beperkt aantal of in beperkte vorm of omvang geschiedt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel44
  - number: '44.5'
    text: |-
      In bij algemene maatregel van bestuur aan te geven gevallen worden beperkingen gesteld aan het verstrekken van
      gegevens dan wel aan het gebruik van gegevens nadat zij zijn verstrekt. In elk geval wordt daarbij geregeld welke
      beperkingen op verzoek van degene aan wie een kenteken is opgegeven, kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel44
  - number: '45'
    text: |-
      De Dienst Wegverkeer stelt ten aanzien van het verwerken van gegevens als bedoeld in
      [artikel 42, tweede lid][ref1], een reglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel42
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '42'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '46.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld betreffende de met de registratie van kentekens
      samenhangende verplichtingen van degene:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel46
  - number: 46.1.a
    text: |-
      die de eigendom, het bezit of het houderschap van een motorrijtuig of een aanhangwagen, waarvoor nog geen kenteken
      is opgegeven, heeft verkregen;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel46
  - number: 46.1.b
    text: aan wie een kenteken is opgegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel46
  - number: 46.1.c
    text: |-
      die de eigendom, het bezit of het houderschap van een motorrijtuig of een aanhangwagen, waarvoor een kenteken is
      opgegeven, heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel46
  - number: '46.2'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel46
  - number: '47'
    text: Een kentekenbewijs bestaat uit een of meer bij algemene maatregel van bestuur aan te wijzen delen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel47
  - number: '48.1'
    text: |-
      Een kentekenbewijs wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief slechts afgegeven aan in Nederland woonachtige natuurlijke personen
      die de leeftijd van achttien jaren dan wel, indien de aanvraag betrekking heeft op een kentekenbewijs voor een
      bromfiets, de leeftijd van zestien jaren hebben bereikt en aan in Nederland gevestigde rechtspersonen, indien het
      motorrijtuig of de aanhangwagen waarvoor de afgifte wordt verlangd, overeenkomstig [artikel 22][ref1] of [26][ref2]
      is goedgekeurd voor toelating tot het verkeer op de weg en, indien na die toelating wijziging is aangebracht in
      de bouw of inrichting van dat voertuig, die wijziging, behoudens in het geval dat geen goedkeuring is vereist,
      overeenkomstig [artikel 99, eerste lid][ref3], of [100, eerste lid][ref4], is goedgekeurd voor toelating van het
      gewijzigde voertuig tot het verkeer op de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel99
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel100
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '99'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '100'
        hoofdstuk: V
        paragraaf: '8'
  - number: '48.2'
    text: |-
      In bepaalde uitzonderingsgevallen kan door de Dienst Wegverkeer een kentekenbewijs worden afgegeven, indien ten
      aanzien van het motorrijtuig of de aanhangwagen, waarvoor de afgifte wordt verlangd, niet is voldaan aan het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel48
  - number: '48.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de ingevolge het eerste lid gestelde eisen aan de
      aanvrager van een kentekenbewijs niet gelden ten aanzien van de aanvrager van een kentekenbewijs, afgegeven ter
      zake van de opgave van een kenteken als bedoeld in [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel38
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '48.4'
    text: |-
      Indien een kentekenbewijs is afgegeven aan een in Nederland gevestigde rechtspersoon die niet behoeft te zijn
      ingeschreven in een daartoe bij de wet aangewezen register of waarvan de onderneming niet behoeft te zijn
      ingeschreven in het handelsregister, wordt degene die bij de aanvraag als gemachtigde van die rechtspersoon is
      opgetreden, voor de toepassing van het bepaalde bij of krachtens deze wet mede als houder van het motorrijtuig of
      de aanhangwagen aangemerkt in de zin van [artikel 1, eerste lid, onderdeel o][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
        hoofdstuk: '1'
  - number: '48.5'
    text: |-
      De in het vierde lid bedoelde gemachtigde dient in Nederland woonachtig te zijn en dient de leeftijd van achttien
      jaren te hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel48
  - number: '48.6'
    text: |-
      Ingeval de aanvrager van een kentekenbewijs voor een bromfiets de leeftijd heeft van zestien of zeventien jaar,
      wordt voor wat betreft de aanvraag de toestemming van diens wettelijke vertegenwoordiger verondersteld te zijn
      verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel48
  - number: '49.1'
    text: |-
      Onverminderd [artikel 48, eerste lid][ref1], wordt de afgifte van een kentekenbewijs geweigerd:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 49.1.a
    text: |-
      indien bij een ingevolge [hoofdstuk V][ref1] verrichte keuring blijkt dat de op het voertuig aangebrachte gegevens
      op onrechtmatige wijze in overeenstemming zijn gebracht met de op het overgelegde kentekenbewijs vermelde gegevens,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: V
  - number: 49.1.b
    text: indien blijkt dat de ter zake van het voertuig verschuldigde belastingen en rechten niet zijn voldaan, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel49
  - number: 49.1.c
    text: |-
      indien blijkt dat de krachtens een algemeen verbindend verklaarde overeenkomst op grond van de
      [Wet milieubeheer][ref1] verschuldigde afvalbeheersbijdrage voor autowrakken niet is voldaan, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 49.1.d
    text: |-
      in overige bij algemene maatregel van bestuur te bepalen gevallen overeenkomstig de bij die algemene maatregel
      vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel49
  - number: '49.2'
    text: 'De afgifte van een kentekenbewijs kan worden geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel49
  - number: 49.2.a
    text: |-
      voor het motorrijtuig of de aanhangwagen waarvoor de afgifte wordt verlangd, op grond van het bij of krachtens deze
      wet bepaalde geen kenteken behoeft te zijn opgegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel49
  - number: 49.2.b
    text: |-
      uit het kentekenregister blijkt dat de eigenaar of houder van een motorrijtuig of een aanhangwagen onvrijwillig de
      beschikkingsmacht over dat voertuig heeft verloren.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel49
  - number: '50.1'
    text: |-
      De aanvrager van een kentekenbewijs dient persoonlijk te verschijnen bij een bij ministeriële regeling aan te
      wijzen instantie, tenzij:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel50
  - number: 50.1.a
    text: |-
      de aanvraag namens hem wordt ingediend door degene aan wie door de Dienst Wegverkeer een erkenning als bedoeld in
      [artikel 62][ref1] is verleend dan wel, indien dit een rechtspersoon is, door diens gemachtigde, en deze voldoende
      zekerheid heeft verkregen over de identiteit van de aanvrager. Daartoe legt de aanvrager een document als bedoeld
      in [artikel 2, eerste lid, van de Paspoortwet][ref2], een geldig rijbewijs als bedoeld in [artikel 107][ref3]
      dan wel een rijbewijs als bedoeld in [artikel 108, eerste lid, onderdeel ][ref4] voor zover de aldaar bedoelde
      registratie heeft plaatsgevonden, over. Degene die namens de aanvrager de aanvraag indient, legt bij de bij
      ministeriële regeling aan te wijzen instantie het document bedoeld in de tweede volzin over, alsmede de volmacht en
      het bewijs dat aan hem een erkenning als bedoeld in [artikel 62][ref5] is verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel107
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel108
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '107'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '108'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 50.1.b
    text: |-
      volgens bij algemene maatregel van bestuur vast te stellen regels op andere wijze voldoende zekerheid kan worden
      verkregen over de identiteit van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel50
  - number: '50.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de verplichting om persoonlijk te verschijnen niet geldt
      ten aanzien van de aanvrager van een kentekenbewijs, afgegeven ter zake van de opgave van een kenteken als bedoeld
      in [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel38
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '50.3'
    text: |-
      Indien de aanvraag geschiedt door een in Nederland gevestigde rechtspersoon die dient te zijn ingeschreven in een
      daartoe bij de wet aangewezen register of waarvan de onderneming dient te zijn ingeschreven in het handelsregister,
      geldt de verplichting om persoonlijk te verschijnen voor degene die krachtens de statuten bevoegd is de
      rechtspersoon te vertegenwoordigen. Indien er meerdere personen bevoegd zijn de rechtspersoon te vertegenwoordigen,
      geldt de verplichting voor een van hen. Een persoon die bevoegd is de rechtspersoon te vertegenwoordigen, kan bij
      gemachtigde verschijnen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel50
  - number: '50.4'
    text: |-
      Indien de aanvraag geschiedt door een in Nederland gevestigde rechtspersoon die niet behoeft te zijn ingeschreven
      in een daartoe bij de wet aangewezen register of waarvan de onderneming niet behoeft te zijn ingeschreven in het
      handelsregister, geldt de verplichting om persoonlijk te verschijnen voor degene die door die rechtspersoon is
      gemachtigd tot de aanvraag van het kentekenbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel50
  - number: '50.5'
    text: |-
      De aanvraag van een kentekenbewijs dient te geschieden overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels. Bij ministeriële regeling worden voorschriften vastgesteld ter uitvoering van die regels.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel50
  - number: '50.6'
    text: |-
      De in het vijfde lid bedoelde regels kunnen mede dienstbaar zijn aan de heffing van de belasting van personenauto’s
      en motorrijwielen en van de motorrijtuigenbelasting alsmede aan de afdracht van de krachtens een algemeen
      verbindend verklaarde overeenkomst op grond van de [Wet milieubeheer][ref1] verschuldigde afvalbeheersbijdrage
      voor autowrakken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '50.7'
    text: |-
      Bij de in het vijfde lid bedoelde regels kan worden bepaald in welke gevallen het motorrijtuig of de aanhangwagen,
      waarvoor een kentekenbewijs wordt aangevraagd, voor een onderzoek ter beschikking moet worden gehouden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel50
  - number: '50.8'
    text: |-
      De Dienst Wegverkeer is bevoegd te vorderen dat de aanvrager van een kentekenbewijs een door of vanwege Onze
      Minister van Financiën afgegeven bewijs overlegt, waaruit blijkt dat ter zake van het motorrijtuig of de
      aanhangwagen verschuldigde belastingen en rechten zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel50
  - number: '51.1'
    text: |-
      Het is verboden voor het verkrijgen van een kentekenbewijs opzettelijk onjuiste opgaven te doen, onjuiste
      inlichtingen te verschaffen en onjuiste bewijsstukken en andere bescheiden over te leggen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel51
  - number: '51.2'
    text: |-
      Voor zover de bij de aanvraag van een kentekenbewijs te verschaffen gegevens betreffen of mede betreffen
      gegevens die nodig worden geacht ter zake van de heffing van de belasting van personenauto’s en
      motorrijwielen en van de motorrijtuigenbelasting, wordt de verplichting tot het verstrekken van die gegevens
      beschouwd als een ingevolge de belastingwet opgelegde verplichting en zijn, indien ter zake onjuiste of
      onvolledige gegevens worden verstrekt - in afwijking van de bepalingen van deze wet - de bepalingen van
      [Hoofdstuk IX (Strafrechtelijke bepalingen) van de Algemene wet inzake rijksbelastingen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: IX
  - number: '52.1'
    text: |-
      Indien voor het voertuig waarvoor de afgifte van een kentekenbewijs wordt verlangd, een kentekenbewijs als bedoeld
      in [artikel 56][ref1] is afgegeven, kan de Dienst Wegverkeer verlangen dat, alvorens een kentekenbewijs wordt
      afgegeven, dat eerder afgegeven kentekenbewijs dient te worden ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel56
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '56'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '52.2'
    text: |-
      Aan de afgifte van een kentekenbewijs kunnen door de Dienst Wegverkeer voorschriften worden verbonden, zulks onder
      aantekening daarvan in het bewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel52
  - number: '53'
    text: |-
      De Dienst Wegverkeer geeft bij de afgifte van een kentekenbewijs tevens een keuringsbewijs voor het betrokken
      voertuig af indien:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel53
  - number: 53.a
    text: |-
      het voertuig is onderworpen aan een onderzoek dat ten minste een controle inhoudt op de eisen, bedoeld
      in [artikel 75, eerste lid, onderdeel a][ref1], en indien het een voertuig betreft als bedoeld in
      [artikel 75, eerste lid, onderdeel b][ref2], tevens aan de daar bedoelde eisen, en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: 53.b
    text: |-
      [artikel 72][ref1] voor dat voertuig geldt of binnen een jaar zal gaan gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: '54'
    text: |-
      Onze Minister kan aan besturen van verenigingen met volledige rechtsbevoegdheid, die behartiging van
      verkeersbelangen ten doel hebben, de bevoegdheid verlenen tot het afgeven van internationale bewijzen voor
      motorrijtuigen en aanhangwagens, bedoeld in internationale overeenkomsten, ten behoeve van het verkeer met
      motorrijtuigen en aanhangwagens in het buitenland.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel54
  - number: '55.1'
    text: |-
      De Dienst Wegverkeer geeft overeenkomstig bij algemene maatregel van bestuur vastgestelde regels voor
      kentekenbewijzen of delen daarvan, die versleten, geheel of ten dele onleesbaar, verloren geraakt of teniet gegaan
      zijn, op aanvraag en tegen betaling, op de door deze dienst vastgestelde wijze, van het daarvoor door deze dienst
      vastgestelde tarief, vervangende bewijzen af.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel55
  - number: '55.2'
    text: |-
      Het vervangende bewijs treedt in de plaats van het eerder afgegeven kentekenbewijs of deel daarvan en wordt
      niet afgegeven dan nadat het versleten of geheel of ten dele onleesbaar geworden kentekenbewijs of deel daarvan,
      waarvoor het wordt afgegeven, is ingeleverd bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel55
  - number: '56'
    text: |-
      In bij algemene maatregel van bestuur vast te stellen gevallen kan een kentekenbewijs met een beperkte
      geldigheidsduur worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel56
  - number: '57.1'
    text: |-
      Onverminderd [artikel 56][ref1] verliest een kentekenbewijs zijn geldigheid door:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel56
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '56'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 57.1.b
    text: afgifte van een nieuw kentekenbewijs dan wel een vervangend kentekenbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel57
  - number: 57.1.c
    text: het onbevoegd daarin aanbrengen van wijzigingen;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel57
  - number: 57.1.d
    text: |-
      schorsing als bedoeld in [artikel 67, eerste lid][ref1], voor de duur van de schorsing;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel67
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '6'
  - number: 57.1.e
    text: ongeldigverklaring.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel57
  - number: '57.2'
    text: |-
      In de gevallen waarin overeenkomstig [artikel 55][ref1] een vervangend bewijs is afgegeven voor een deel van het
      kentekenbewijs, verliest het deel waarvoor dat vervangend bewijs is afgegeven, zijn geldigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel55
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '55'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '57.3'
    text: |-
      De Dienst Wegverkeer kan verlangen dat een kentekenbewijs dat zijn geldigheid heeft verloren binnen een daarbij
      bepaalde termijn bij deze dienst dient te worden ingeleverd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel57
  - number: '58.1'
    text: 'Een kentekenbewijs wordt overeenkomstig bij algemene maatregel van bestuur vastgestelde regels ongeldig verklaard:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel58
  - number: 58.1.a
    text: |-
      indien het is afgegeven op grond van bij de aanvraag verschafte onjuiste gegevens en dat kentekenbewijs niet zou
      zijn afgegeven indien de onjuistheid van die gegevens ten tijde van de aanvraag bekend zou zijn geweest, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel58
  - number: 58.1.b
    text: indien blijkt dat het kennelijk abusievelijk is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel58
  - number: '58.2'
    text: |-
      Een kentekenbewijs kan, overeenkomstig bij algemene maatregel van bestuur vastgestelde regels, ongeldig worden
      verklaard:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel58
  - number: 58.2.a
    text: indien de ter zake van het voertuig verschuldigde belastingen en rechten niet zijn voldaan;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel58
  - number: 58.2.b
    text: |-
      indien het voertuig waarvoor het is afgegeven, niet voldoet aan de bij of krachtens deze wet vastgestelde eisen,
      met uitzondering van de ingevolge [hoofdstuk III][ref1] met betrekking tot de toelating tot het verkeer op de weg
      vastgestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: 58.2.c
    text: |-
      indien in de bouw of inrichting van het voertuig waarvoor het is afgegeven, wijzigingen zijn aangebracht, die niet
      zijn goedgekeurd overeenkomstig het bepaalde bij of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel58
  - number: 58.2.d
    text: |-
      indien het voertuig niet voldoet aan de in [artikel 75, eerste lid, onderdeel b][ref1], bedoelde eisen voor zover
      het een voertuig betreft als daar bedoeld;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: 58.2.e
    text: |-
      indien de eigenaar of houder van een voertuig onvrijwillig de beschikkingsmacht over dat voertuig heeft verloren,
      mits wordt voldaan aan de bij algemene maatregel van bestuur vastgestelde voorwaarden, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel58
  - number: 58.2.f
    text: in andere bij algemene maatregel van bestuur vast te stellen gevallen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel58
  - number: '58.3'
    text: De ongeldigverklaring kan worden beperkt tot het rijden over de weg.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel58
  - number: '59'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld omtrent het verval van de tenaamstelling in het
      kentekenregister. De tenaamstelling in het kentekenregister vervalt in ieder geval zodra het kentekenbewijs
      ongeldig is verklaard ingevolge [artikel 58, tweede lid, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel58
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '58'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '60.1'
    text: |-
      De houder van een kentekenbewijs is op eerste vordering van de bij algemene maatregel van bestuur aangewezen
      personen verplicht tot overgifte van dat bewijs of van een of meer bij algemene maatregel van bestuur aan te wijzen
      delen daarvan, indien naar het oordeel van die personen:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
  - number: 60.1.a
    text: |-
      ter zake van het voertuig, waarvoor het kentekenbewijs is afgegeven, de verschuldigde belastingen en rechten niet
      zijn voldaan;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
  - number: 60.1.b
    text: |-
      het voertuig waarvoor het kentekenbewijs is afgegeven, niet voldoet aan de bij of krachtens deze wet vastgestelde
      eisen, met uitzondering van de ingevolge [hoofdstuk III][ref1] met betrekking tot de toelating tot het verkeer op
      de weg vastgestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: 60.1.c
    text: |-
      het voertuig waarvoor het kentekenbewijs is afgegeven, niet voldoet aan de in
      [artikel 75, eerste lid, onderdeel b][ref1], bedoelde eisen voor zover het een voertuig betreft als daar bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: '60.2'
    text: |-
      De in het eerste lid bedoelde vordering kan eveneens worden gedaan indien naar het oordeel van de daar bedoelde
      personen niet wordt voldaan aan de krachtens [artikel 52, tweede lid][ref1], in het kentekenbewijs vermelde
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel52
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '52'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '60.3'
    text: |-
      Indien het een kentekenbewijs betreft dat is afgegeven voor een aanhangwagen die overeenkomstig het bij algemene
      maatregel van bestuur bepaalde is voorzien van een identificatieplaat, kan aan de vordering worden voldaan binnen
      een bij die maatregel vastgestelde termijn.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
  - number: '60.4'
    text: |-
      De in het eerste lid bedoelde personen doen in de bij algemene maatregel van bestuur aangewezen gevallen het
      kentekenbewijs of de ingevorderde delen daarvan zo spoedig mogelijk toekomen aan de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
  - number: '60.5'
    text: 'De Dienst Wegverkeer geeft het kentekenbewijs of de ingevorderde delen daarvan terug:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
  - number: 60.5.a
    text: |-
      in de gevallen, bedoeld in het eerste lid, onderdeel *a*, indien ter zake van het voertuig alsnog de verschuldigde
      belastingen en rechten zijn voldaan;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
  - number: 60.5.b
    text: |-
      in de gevallen, bedoeld in het eerste lid, onderdelen *b* en *c*, indien het voertuig ter zake van de eisen waaraan
      het niet voldeed, alsnog is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
  - number: 60.5.c
    text: |-
      in het geval, bedoeld in het tweede lid, indien alsnog wordt voldaan aan de krachtens
      [artikel 52, tweede lid][ref1], in het kentekenbewijs vermelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel52
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '52'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '60.6'
    text: |-
      De Dienst Wegverkeer geeft bij de teruggave van het kentekenbewijs of de ingevorderde delen daarvan tevens een
      keuringsbewijs voor het betrokken voertuig af indien:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
  - number: 60.6.a
    text: |-
      het voertuig is onderworpen aan een onderzoek dat ten minste een controle inhoudt op de eisen, bedoeld in
      [artikel 75, eerste lid, onderdeel a][ref1], en indien het een voertuig betreft als bedoeld in artikel 75, eerste
      lid, onderdeel b, tevens aan de daar bedoelde eisen, en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: 60.6.b
    text: |-
      [artikel 72][ref1] voor dat voertuig geldt of binnen een jaar zal gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: '60.7'
    text: Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de vordering van kentekenbewijzen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
  - number: '60.8'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën, kunnen nadere regels worden
      vastgesteld omtrent het vijfde lid, onderdeel *a*.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel60
  - number: '61.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel61
  - number: 61.1.c
    text: |-
      ten opzichte van een motorrijtuig of een aanhangwagen opzettelijk gebruik te maken van een kentekenbewijs dat niet
      aan de eigenaar of houder voor dat motorrijtuig of die aanhangwagen is afgegeven, als ware het aan deze voor dat
      motorrijtuig of die aanhangwagen afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel61
  - number: '62.1'
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is motorrijtuigen en aanhangwagens, waarvan hij de eigendom heeft verkregen, in zijn bedrijfsvoorraad op
      te nemen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel62
  - number: '62.2'
    text: |-
      Aan de erkenning kunnen bij algemene maatregel van bestuur aangewezen bevoegdheden worden verbonden; een zodanige
      bevoegdheid maakt deel uit van de erkenning. Het in de [artikelen 62 tot en met 66][ref1] ten aanzien van
      erkenningen bepaalde is van overeenkomstige toepassing op bedoelde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '62.3'
    text: |-
      De erkenning geldt voor de in de erkenning aangewezen groep of groepen van voertuigen en kan gelden voor bepaalde
      of voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel62
  - number: '62.4'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en kunnen
      met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel62
  - number: '62.5'
    text: |-
      De in [artikel 50, eerste lid, aanhef][ref1] bedoelde verplichting om bij de aanvraag van een kentekenbewijs
      persoonlijk te verschijnen bij een bij ministeriële regeling aangewezen instantie, geldt niet voor natuurlijke
      personen of rechtspersonen aan wie een erkenning als bedoeld in het eerste lid is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel50
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '63.1'
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door deze dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend aan de natuurlijke persoon of rechtspersoon,
      die voldoet aan de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de administratieve
      organisatie van de natuurlijke persoon of rechtspersoon alsmede de wijze waarop deze er voor zorgdraagt dat de aan
      de opname in bedrijfsvoorraad verbonden procedures in acht worden genomen. Voorts kunnen deze eisen mede dienstbaar
      zijn aan de uitvoering van de Wet milieubeheer.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel63
  - number: '63.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld met betrekking tot de aanvraag van een
      erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel63
  - number: '63.3'
    text: Bij ministeriële regeling worden regels vastgesteld ter uitvoering van het krachtens het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel63
  - number: '63.4'
    text: |-
      De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning op grond van
      [artikel 65, tweede lid][ref1], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel van zes maanden ingeval reeds twee of meer malen een dergelijke aan
      de aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel65
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '65'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '64.1'
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de *Staatscourant*. Het toezicht omvat in ieder geval het periodiek controleren van de bedrijfsvoorraad van degene
      aan wie de erkenning is verleend en van de ter zake van die bedrijfsvoorraad door deze gevoerde administratie.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel64
  - number: '64.2'
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel64
  - number: '64.3'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld betreffende de wijze waarop het toezicht wordt gehouden
      en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend. Deze regels kunnen
      inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit
      de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel64
  - number: '65.1'
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie de erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel65
  - number: '65.2'
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel65
  - number: 65.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel65
  - number: 65.2.b
    text: |-
      de verplichtingen, vervat in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] en
      [artikel 64, tweede lid][ref2], niet nakomt, of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel64
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '64'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 65.2.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel65
  - number: '65.3'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel65
  - number: 65a
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld met betrekking tot het intrekken, wijzigen en schorsen
      van de erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel65a
  - number: '66'
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 62][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '67.1'
    text: |-
      Indien met een voertuig geen gebruik van de weg wordt gemaakt, schorst de Dienst Wegverkeer op aanvraag van de
      eigenaar of houder van dat voertuig, tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief, de geldigheid van het kentekenbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel67
  - number: '67.2'
    text: |-
      De hoogte van het in het eerste lid bedoelde tarief kan voor verschillende groepen voertuigen dan wel eigenaren of
      houders van voertuigen verschillend worden vastgesteld. Voor aanvragen die worden ingediend binnen een jaar na de
      aanvraag van een schorsing welke ingevolge [artikel 68, eerste lid, onderdelen a en d][ref1], is geëindigd, kan het
      tarief hoger worden vastgesteld dan het tarief voor laatstgenoemde aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel68
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '68'
        hoofdstuk: IV
        paragraaf: '6'
  - number: '67.3'
    text: |-
      De aanvraag van een schorsing dient te geschieden overeenkomstig bij algemene maatregel van bestuur vastgestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel67
  - number: '67.4'
    text: Bij ministeriële regeling worden nadere regels vastgesteld omtrent het krachtens het derde lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel67
  - number: '67.5'
    text: |-
      De Dienst Wegverkeer plaatst bij het verlenen van de schorsing overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels op het kentekenbewijs een aantekening waaruit blijkt dat schorsing is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel67
  - number: '67.6'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld omtrent de aantekening van schorsing, bedoeld in het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel67
  - number: '68.1'
    text: 'De schorsing eindigt:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel68
  - number: 68.1.a
    text: |-
      door opheffing als bedoeld in [artikel 69][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel69
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '69'
        hoofdstuk: IV
        paragraaf: '6'
  - number: 68.1.b
    text: door verloop van een jaar nadat de schorsing is verleend,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel68
  - number: 68.1.c
    text: door het verval van de tenaamstelling in het kentekenregister, of
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel68
  - number: 68.1.d
    text: zodra met het voertuig gebruik van de weg wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel68
  - number: '68.2'
    text: |-
      Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat in bepaalde
      uitzonderingsgevallen tijdelijk kan worden afgeweken van het eerste lid, aanhef en onderdeel *d*.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel68
  - number: '69.1'
    text: De schorsing wordt op aanvraag van de eigenaar of houder door de Dienst Wegverkeer opgeheven.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel69
  - number: '69.2'
    text: |-
      De aanvraag van opheffing van de schorsing dient te geschieden overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel69
  - number: '69.3'
    text: Bij ministeriële regeling worden nadere regels vastgesteld omtrent het krachtens het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel69
  - number: '70.1'
    text: |-
      Bij de aanvraag van opheffing van de schorsing alsmede na het eindigen van de schorsing op grond van
      [artikel 68, eerste lid, aanhef en onderdeel b of d][ref1], dient degene aan wie de schorsing is verleend, een
      nieuw kentekenbewijs of een of meer bij algemene maatregel van bestuur aan te wijzen delen daarvan aan te vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel68
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '68'
        hoofdstuk: IV
        paragraaf: '6'
  - number: '70.2'
    text: |-
      De aanvraag dient te geschieden overeenkomstig bij algemene maatregel van bestuur vastgestelde regels tegen
      betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door deze dienst vastgestelde
      tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70
  - number: 70a.1
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is een of meer van de in [artikel 40, tweede lid][ref1], bedoelde bij de erkenning aangewezen merken aan
      te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 70a.2
    text: Het is verboden om zonder de in het eerste lid bedoelde erkenning de aldaar bedoelde merken aan te brengen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70a
  - number: 70a.3
    text: |-
      Bij ministeriële regeling worden voorschriften vastgesteld die aan de erkenning worden verbonden en worden met
      betrekking tot die voorschriften regels vastgesteld. Die regels hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70a
  - number: 70a.3.a
    text: de fabricage en levering van kentekenplaten en onderdelen daarvan en de daarbij te volgen procedure;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70a
  - number: 70a.3.b
    text: |-
      de registratie van gegevens met betrekking tot de ingekochte materialen, de productie, de af- en uitval, de
      voorraad en de aflevering van kentekenplaten en onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70a
  - number: 70b.1
    text: |-
      De fabrikant van kentekenplaten is in geval van levering van kentekenplaten verplicht tot het vastleggen van
      gegevens omtrent: van:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70b
  - number: 70b.1.a
    text: het betrokken kenteken;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70b
  - number: 70b.1.b
    text: |-
      de aard en het nummer van het identiteitsdocument van degene door, respectievelijk namens wie de kentekenplaten
      worden aangevraagd, en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70b
  - number: 70b.1.c
    text: het aantal afgegeven kentekenplaten.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70b
  - number: 70b.2
    text: |-
      Indien de kentekenplaten worden aangevraagd namens een rechtspersoon of door een daartoe bij ministeriële regeling
      aangewezen erkend bedrijf als bedoeld in [artikel 62][ref1], worden in plaats van de gegevens, bedoeld in het
      eerste lid, onder b, vastgelegd de bij ministeriële regeling aangewezen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 70b.3
    text: |-
      Indien bij de levering van kentekenplaten die door, respectievelijk namens een natuurlijk persoon zijn aangevraagd,
      een ander identiteitsdocument dan een rijbewijs of paspoort wordt overgelegd, wordt tevens vastgelegd de
      naam, de beginletters van de voornaam of voornamen en het adres van degene door, respectievelijk namens wie de
      kentekenplaten worden aangevraagd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70b
  - number: 70b.4
    text: |-
      De fabrikant verstrekt gegevens die zijn vastgelegd op grond van het eerste tot en met derde lid in een
      registratie, uitsluitend en desgevraagd aan de ambtenaren van de Dienst Wegverkeer, belast met het toezicht op
      de naleving van de uit de erkenning voortvloeiende verplichtingen, en aan de ambtenaren van politie belast met de
      handhaving van de uit de erkenning voortvloeiende verplichtingen en van de verboden, bedoeld in [artikel 41][ref1],
      voor zover deze gegevens noodzakelijk zijn voor de goede vervulling van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel41
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 70b.5
    text: De vastgelegde gegevens worden gedurende één jaar na de vastlegging bewaard.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70b
  - number: 70b.6
    text: Bij ministeriële regeling worden nadere regels vastgesteld omtrent de inrichting en het beheer van het register.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70b
  - number: 70c.1
    text: |-
      Na afloop van de termijn, bedoeld in [artikel 70b, vijfde lid][ref1], worden de daar bedoelde vastgelegde gegevens
      overgedragen aan de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70b
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70b
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70c.2
    text: |-
      Uit de registratie worden door de Dienst Wegverkeer uitsluitend en desgevraagd aan de ambtenaren van politie
      belast met de handhaving van de uit de erkenning voortvloeiende verplichtingen en van de verboden, bedoeld in
      [artikel 41][ref1], gegevens verstrekt voor zover deze noodzakelijk zijn voor de goede vervulling van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel41
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 70c.3
    text: |-
      De vastgelegde gegevens worden door de Dienst Wegverkeer maximaal vijf jaar na de overdracht, bedoeld in het eerste
      lid, bewaard.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70c
  - number: 70c.4
    text: |-
      De Dienst Wegverkeer stelt ten aanzien van het verwerken van de persoonsgegevens als bedoeld in het eerste lid, een
      reglement vast.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70c
  - number: 70d.1
    text: |-
      De erkenning wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief verleend indien de natuurlijke persoon of rechtspersoon voldoet aan
      de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de administratieve organisatie van
      de natuurlijke persoon of rechtspersoon alsmede de wijze waarop deze ervoor zorg draagt dat de aan het aanbrengen
      van de merken verbonden procedures in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70d
  - number: 70d.2
    text: Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70d
  - number: 70d.3
    text: |-
      De erkenning wordt in ieder geval geweigerd indien een reeds aan de aanvrager verleende erkenning op grond van
      [artikel 70f, tweede lid][ref1], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel van zes maanden ingeval reeds twee of meer malen een dergelijke aan
      de aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70f
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70f
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70e.1
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de Staatscourant. Het toezicht omvat in ieder geval het periodiek controleren van de organisatie van degene aan wie
      de erkenning is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70e
  - number: 70e.2
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70e
  - number: 70e.3
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld betreffende de wijze waarop het toezicht wordt gehouden
      en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend. Deze regels kunnen
      inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit
      de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70e
  - number: 70f.1
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie die erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70f
  - number: 70f.2
    text: |-
      De Dienst Wegverkeer kan een erkenning intrekken of wijzigen dan wel de daaraan verbonden voorschriften wijzigen
      indien degene aan wie de erkenning is verleend:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70f
  - number: 70f.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70f
  - number: 70f.2.b
    text: |-
      een verplichting als bedoeld in [artikel 70e][ref1] niet nakomt, of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70e
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70e
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70f.2.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70f
  - number: 70f.3
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70f
  - number: 70g
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 70a][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70a
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70h
    text: |-
      Bij de verkrijging van een kentekenplaat worden de bij ministeriële regeling aangewezen identiteitsdocumenten en
      overige documenten overgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70h
  - number: 70i.1
    text: |-
      In geval van overdracht van een motorrijtuig of aanhangwagen aan een erkend bedrijf als bedoeld in
      [artikel 62][ref1], ten behoeve van uitvoer naar het buitenland of voorgoed buiten gebruikstelling, is de eigenaar
      of houder verplicht tot inlevering van de betrokken kentekenplaten bij dat bedrijf tegelijk met de overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 70i.2
    text: |-
      In geval van uitvoer naar het buitenland anders dan door een erkend bedrijf als bedoeld in [artikel 62][ref1],
      is de eigenaar of houder van het motorrijtuig of de aanhangwagen verplicht tot inlevering van de betrokken
      kentekenplaten bij de Dienst Wegverkeer tegelijk met de uitvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 70i.3
    text: |-
      Indien het kentekenbewijs zijn geldigheid heeft verloren, anders dan in geval van het eerste of het tweede lid, kan
      de Dienst Wegverkeer verlangen dat de betrokken kentekenplaten binnen een bepaalde termijn bij deze dienst worden
      ingeleverd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70i
  - number: 70j.1
    text: |-
      Indien de betrokken kentekenplaten overeenkomstig [artikel 70i][ref1] worden ingeleverd bij de Dienst Wegverkeer
      onderscheidenlijk een erkend bedrijf als bedoeld in [artikel 62][ref2] is deze dienst, onderscheidenlijk dit
      bedrijf verplicht tot het vastleggen van gegevens omtrent van:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70i
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70j
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70i
        hoofdstuk: IV
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 70j.1.a
    text: het betrokken kenteken, en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70j
  - number: 70j.1.b
    text: het aantal ingeleverde kentekenplaten.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70j
  - number: 70j.2
    text: |-
      De Dienst Wegverkeer, onderscheidenlijk het erkende bedrijf, is voorts, overeenkomstig bij ministeriële regeling
      vast te stellen regels, verplicht tot vernietiging van de ingeleverde kentekenplaten en tot registratie van de
      vernietiging.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel70j
  - number: '71'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden vastgesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel71
  - number: 71.a
    text: |-
      de eisen waaraan moet worden voldaan met betrekking tot voertuigen waarmee over de weg wordt gereden, waarbij
      onderscheid gemaakt kan worden tussen verschillende wegen;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel71
  - number: 71.b
    text: de inrichting van voertuigen die op de weg staan.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel71
  - number: 71a
    text: |-
      In de krachtens [artikel 71][ref1] vastgestelde regels kan worden bepaald dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
  - number: 71a.a
    text: het voldoen aan de daarin opgenomen eisen wordt aangetoond door middel van in die regels voorgeschreven apparatuur,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel71a
  - number: 71a.b
    text: die apparatuur is goedgekeurd door een door Onze Minister aangewezen keuringsinstelling,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel71a
  - number: 71a.c
    text: |-
      die apparatuur met een in die regels vast te stellen periodiciteit is onderzocht door deze keuringsinstelling, dan
      wel door een door Onze Minister of door deze keuringsinstelling aangewezen onderzoeksgerechtigde, en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel71a
  - number: 71a.d
    text: |-
      bij de erkenning van een onderzoeksgerechtigde als bedoeld in onderdeel c wordt voldaan aan de in die regels
      opgenomen voorschriften.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel71a
  - number: '72.1'
    text: |-
      Voor een motorrijtuig of een aanhangwagen, waarvoor een kenteken is opgegeven dan wel dient te zijn opgegeven,
      dient een keuringsbewijs te zijn afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel72
  - number: '72.2'
    text: 'Het keuringsbewijs dient:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel72
  - number: 72.2.a
    text: te voldoen aan de bij ministeriële regeling vastgestelde eisen inzake inrichting en uitvoering,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel72
  - number: 72.2.b
    text: zijn geldigheid niet te hebben verloren, en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel72
  - number: 72.2.c
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel72
  - number: '72.3'
    text: 'Voor overtreding van het eerste lid en het bepaalde bij of krachtens het tweede lid zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel72
  - number: 72.3.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder, alsmede in het geval dat met dat motorrijtuig over
      de weg wordt gereden, de bestuurder, en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel72
  - number: 72.3.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder, alsmede in het geval dat de aanhangwagen met een
      motorrijtuig over de weg wordt voortbewogen, de bestuurder van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel72
  - number: '73.1'
    text: |-
      [Artikel 72][ref1] geldt niet indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.1.a
    text: |-
      voor het motorrijtuig of de aanhangwagen ter zake van een keuring die ingevolge een andere dan deze wet is
      voorgeschreven en blijkens aanwijzing bij ministeriële regeling ten minste een controle inhoudt op de eisen,
      bedoeld in [artikel 75, eerste lid, onderdeel ][ref1], een keuringsdocument waarvan de geldigheidsduur niet is
      verstreken, is afgegeven, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: 73.1.b
    text: |-
      de geldigheid van het voor het betrokken voertuig afgegeven kentekenbewijs is geschorst overeenkomstig
      [paragraaf 6 van hoofdstuk IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: IV
        paragraaf: '6'
  - number: '73.2'
    text: 'Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel73
  - number: 73.2.a
    text: |-
      [artikel 72][ref1] niet geldt voor motorrijtuigen en aanhangwagens zolang gerekend vanaf het tijdstip waarop deze
      voertuigen voor het eerst op de weg zijn toegelaten, nog geen bij algemene maatregel van bestuur vast te stellen
      termijn die ten hoogste drie jaren bedraagt en voor verschillende groepen van voertuigen verschillend kan worden
      gesteld, is verstreken; bij algemene maatregel van bestuur kan nader worden bepaald op welk tijdstip een voertuig
      wordt geacht voor het eerst op de weg te zijn toegelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.2.b
    text: |-
      [artikel 72][ref1] niet geldt voor nader aangewezen groepen van motorrijtuigen of aanhangwagens. Hieronder vallen
      in ieder geval aanhangwagens met een toegestane maximum massa van niet meer dan 3500 kg;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.2.c
    text: |-
      in bepaalde uitzonderingsgevallen tijdelijk wordt of kan worden afgeweken van [artikel 72][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.2.d
    text: |-
      [artikel 72][ref1] gedurende een nader te bepalen termijn na het tijdstip van verstrijken van de geldigheidsduur
      van het voor het voertuig afgegeven keuringsbewijs niet geldt voor het op de weg staan van dat voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: '73.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot het tweede lid, onderdelen *b*
      en *c*.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel73
  - number: '74'
    text: |-
      Het is verboden ten opzichte van een motorrijtuig of een aanhangwagen opzettelijk gebruik te maken van een
      keuringsbewijs dat niet voor dat voertuig is afgegeven, als ware het voor dat voertuig afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel74
  - number: '75.1'
    text: |-
      Een keuringsbewijs wordt door degene die ingevolge [artikel 78][ref1] met de afgifte van keuringsrapporten is
      belast, afgegeven op aanvraag en tegen betaling op de door deze vastgestelde wijze van het door deze vastgestelde
      tarief indien het motorrijtuig of de aanhangwagen heeft voldaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: 75.1.a
    text: |-
      de eisen die ingevolge [artikel 71][ref1] voor wat betreft bouw, inrichting en staat van onderhoud aan dat voertuig
      worden gesteld, voor zover deze eisen niet ingevolge het tweede lid buiten toepassing blijven, en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
  - number: 75.1.b
    text: |-
      indien het een voertuig betreft dat is bestemd om te worden gebruikt voor het vervoer van
      personen waarop de [Wet personenvervoer 2000][ref1] betrekking heeft, de eisen die ingevolge
      [artikel 104, aanhef en onderdeel a, van die wet][ref2] voor wat betreft inrichting en uitrusting aan dat voertuig
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011470
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel104
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0011470
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '104'
  - number: '75.2'
    text: |-
      Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat voor nader
      aangewezen groepen van motorrijtuigen - zolang gerekend vanaf het tijdstip waarop deze voertuigen voor het
      eerst op de weg zijn toegelaten, nog geen bij algemene maatregel van bestuur vast te stellen termijn die ten
      hoogste drie jaren bedraagt, is verstreken - ten behoeve van de afgifte van een keuringsbewijs slechts behoeft te
      worden voldaan aan de in het eerste lid, onderdeel a, bedoelde eisen die betrekking hebben op het bestrijden van
      luchtverontreiniging. Bij algemene maatregel van bestuur kan nader worden bepaald op welk tijdstip een voertuig
      geacht wordt voor het eerst op de weg te zijn toegelaten.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel75
  - number: '75.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot de in het tweede lid bedoelde
      voorwaarden en groepen van motorrijtuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel75
  - number: '76.1'
    text: |-
      Bij de aanvraag van een keuringsrapport dient de aanvrager de bij algemene maatregel van bestuur vastgestelde
      bescheiden over te leggen en inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel76
  - number: '76.2'
    text: |-
      De aanvrager dient het motorrijtuig of de aanhangwagen waarvoor de afgifte van een keuringsrapport wordt verlangd,
      overeenkomstig bij algemene maatregel van bestuur vast te stellen regels ten behoeve van de afgifte van dat bewijs
      ter beschikking te stellen van degene die ingevolge [artikel 78][ref1] met de afgifte van keuringsrapporten is
      belast.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: '76.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld omtrent de wijze waarop wordt onderzocht of een
      voertuig voldoet aan de in [artikel 75][ref1] bedoelde eisen, alsmede omtrent hetgeen verder met betrekking tot de
      behandeling van de aanvraag van een keuringsrapport noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: '77'
    text: |-
      Het voor afgifte van een keuringsrapport aangeboden voertuig dient overeen te stemmen met de in het daarbij
      behorende kentekenbewijs en de in het kentekenregister vermelde gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel77
  - number: '78.1'
    text: 'Keuringsrapporten worden overeenkomstig bij algemene maatregel van bestuur vastgestelde regels afgegeven door:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel78
  - number: 78.1.a
    text: |-
      de Dienst Wegverkeer in het kader van een door deze dienst verrichte keuring van het voertuig waarvoor de afgifte
      wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel78
  - number: 78.1.b
    text: |-
      een ingevolge [artikel 84][ref1] erkende natuurlijke persoon of rechtspersoon in het kader van een door deze
      verrichte keuring van het voertuig waarvoor de afgifte wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel84
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '84'
        hoofdstuk: V
        paragraaf: '5'
  - number: '78.2'
    text: |-
      De Dienst Wegverkeer draagt er zorg voor dat indien in onvoldoende mate keuringsrapporten kunnen worden afgegeven
      door andere natuurlijke personen of rechtspersonen als bedoeld in het eerste lid, onderdeel b, dan die zich
      bezighouden met het verrichten van onderhoud of reparaties aan motorrijtuigen of aanhangwagens, de Dienst
      Wegverkeer kan voorzien in zodanige afgifte.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel78
  - number: '78.3'
    text: |-
      De Dienst Wegverkeer geeft geen keuringsrapporten af voor zover in voldoende mate keuringsrapporten kunnen worden
      afgegeven door natuurlijke personen of rechtspersonen als bedoeld in het eerste lid, onderdeel b, die zich niet
      bezighouden met het verrichten van onderhoud of reparaties aan motorrijtuigen of aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel78
  - number: '79'
    text: |-
      Degene die ingevolge [artikel 78][ref1] met de afgifte van keuringsbewijzen is belast, doet van het voornemen
      tot de afgifte van zodanig bewijs op de bij ministeriële regeling te bepalen wijze mededeling aan de beheerder
      van het kentekenregister. Van de weigering van de afgifte van een keuringsbewijs wordt mededeling gedaan in bij
      ministeriële regeling vast te stellen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: '80.1'
    text: |-
      De Dienst Wegverkeer geeft voor keuringsbewijzen die versleten of geheel of ten dele onleesbaar zijn, dan wel
      verloren zijn geraakt of teniet zijn gegaan, op aanvraag en tegen betaling, op de door deze dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief vervangende keuringsbewijzen af.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel80
  - number: '80.2'
    text: |-
      Een vervangend keuringsbewijs wordt niet afgegeven dan nadat het versleten of geheel of ten dele onleesbaar
      geworden bewijs is ingeleverd bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel80
  - number: '81.1'
    text: |-
      Een keuringsbewijs is geldig voor de duur van een jaar. Bij algemene maatregel van bestuur wordt bepaald op welk
      tijdstip een keuringsbewijs geldigheid verkrijgt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel81
  - number: '81.2'
    text: |-
      Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden voor daarbij aangewezen groepen
      van motorrijtuigen, ten aanzien waarvan ingevolge [artikel 75, tweede lid][ref1], ten behoeve van de afgifte
      van een keuringsbewijs slechts behoeft te worden voldaan aan de eisen met betrekking tot de bestrijding van
      luchtverontreiniging, een langere geldigheidsduur van het keuringsbewijs worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: '81.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot de in het tweede lid bedoelde
      voorwaarden en groepen van motorrijtuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel81
  - number: '82'
    text: |-
      Onverminderd de [artikelen 81][ref1], [86, vierde lid][ref2], en [91, vierde lid][ref3], verliest een
      keuringsbewijs zijn geldigheid:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel91
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '81'
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '86'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '91'
        hoofdstuk: V
        paragraaf: '6'
  - number: 82.a
    text: door afgifte van een vervangend keuringsbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel82
  - number: 82.b
    text: door het onbevoegd daarin aanbrengen van wijzigingen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel82
  - number: '83.1'
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is keuringsrapporten af te geven voor motorrijtuigen en aanhangwagens, waarvoor [artikel 72][ref1]
      geldt, met uitzondering van bussen als bedoeld in de [Wet personenvervoer 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
  - number: '83.2'
    text: |-
      Een erkenning geldt voor motorrijtuigen en aanhangwagens, die behoren tot een in de erkenning aangewezen groep, en
      kan gelden voor bepaalde of voor onbepaalde tijd. De aanwijzing kan geen betrekking hebben op de leeftijd of het
      merk van motorrijtuigen en aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel83
  - number: '83.3'
    text: |-
      Een erkenning, verleend aan een natuurlijke persoon of rechtspersoon, die een keuringsdienst of een
      onderhoudsdienst voor het eigen wagenpark exploiteert, geldt slechts voor de eigen voertuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel83
  - number: '83.4'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en kunnen
      met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel83
  - number: '84.1'
    text: |-
      De erkenning wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief verleend indien de natuurlijke persoon of rechtspersoon voldoet aan
      de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de voor de keuringen benodigde
      apparatuur en ruimte alsmede de deskundigheid van de voor de keuringen beschikbare personen. Ten aanzien van de
      voor de keuringen benodigde apparatuur kan bij die ministeriële regeling de eis worden gesteld dat die apparatuur
      is goedgekeurd door een door Onze Minister aan te wijzen keuringsinstelling en met de in die regeling vast te
      stellen periodiciteit is onderzocht door deze keuringsinstelling dan wel door een door deze keuringsinstelling
      erkende onderzoeksgerechtigde en kunnen regels worden vastgesteld met betrekking tot de erkenning van
      onderzoeksgerechtigden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel84
  - number: '84.2'
    text: Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel84
  - number: '84.3'
    text: |-
      De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning op grond van
      [artikel 87, tweede lid][ref1], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel van zes maanden ingeval reeds twee of meer malen een dergelijke aan
      de aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel87
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '87'
        hoofdstuk: V
        paragraaf: '5'
  - number: '85'
    text: |-
      De erkende natuurlijke personen of rechtspersonen zijn verplicht het door de aanvrager ter keuring aangeboden
      voertuig te keuren, indien zij daartoe gerechtigd zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel85
  - number: 85a.1
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon de bevoegdheid verlenen motorrijtuigen en aanhangwagens,
      waarvoor [artikel 72][ref1] geldt, met uitzondering van bussen als bedoeld in de Wet personenvervoer, aan een
      keuring te onderwerpen. Ten bewijze van deze bevoegdheid verstrekt de Dienst Wegverkeer de betrokken persoon een
      bevoegdheidspas.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 85a.2
    text: |-
      De bevoegdheid voertuigen aan een keuring te onderwerpen geldt voor motorrijtuigen en aanhangwagens die behoren tot
      een in de verlening van de bevoegdheid voertuigen aan een keuring te onderwerpen aangewezen groep, en kan gelden
      voor bepaalde of onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel85a
  - number: 85a.3
    text: |-
      De bevoegdheid voertuigen aan een keuring te onderwerpen wordt verleend indien de natuurlijke persoon voldoet aan
      bij ministeriële regeling vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel85a
  - number: 85a.4
    text: |-
      Bij ministeriële regeling worden regels vastgesteld met betrekking tot de aanvraag tot het verlenen van de
      bevoegdheid voertuigen aan een keuring te onderwerpen en met betrekking tot de bevoegdheidspas.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel85a
  - number: 85a.5
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan de bevoegdheid voertuigen aan een keuring
      te onderwerpen worden verbonden en kunnen met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel85a
  - number: '86.1'
    text: |-
      De Dienst Wegverkeer onderwerpt ten minste drie van elke honderd voertuigen na een verrichte keuring
      steekproefsgewijs aan een herkeuring met het oog op het toezicht op:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel86
  - number: 86.1.a
    text: de juiste uitvoering van de keuring;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel86
  - number: 86.1.b
    text: het aan een keuring onderwerpen door daartoe bevoegde natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel86
  - number: '86.2'
    text: |-
      De eigenaar of houder van een motorrijtuig of een aanhangwagen, waarvoor een herkeuring wordt geëist, is verplicht
      het voertuig op de plaats van de keuring beschikbaar te houden totdat de herkeuring heeft plaatsgevonden. Deze
      verplichting geldt voor een periode van ten hoogste 90 minuten na de in [artikel 79][ref1] bedoelde mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel79
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '79'
        hoofdstuk: V
        paragraaf: '3'
  - number: '86.3'
    text: |-
      Het keuringsrapport van een motorrijtuig of een aanhangwagen waarvoor een herkeuring wordt geëist wordt pas
      afgegeven op het moment dat de periode genoemd in het vorige lid is verstreken of nadat de herkeuring heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel86
  - number: '86.4'
    text: |-
      De geldigheid van het keuringsbewijs vervalt indien de eigenaar of houder niet voldoet aan de in het tweede
      lid bedoelde verplichting of indien het motorrijtuig of de aanhangwagen bij de herkeuring niet voldoet aan de
      eisen, bedoeld in [artikel 75, eerste lid, onderdeel a][ref1], en indien het een voertuig betreft als bedoeld in
      [artikel 75, eerste lid, onderdeel b][ref2], tevens aan de daar bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: '86.5'
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel86
  - number: '86.6'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop de steekproef wordt
      uitgevoerd, alsmede betreffende de verplichting tot medewerking daaraan van de eigenaar of houder. Deze regels
      kunnen inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of
      meer uit de erkenning voortvloeiende verplichtingen of in strijd met een of meer uit de bevoegdheid voertuigen aan
      een keuring te onderwerpen voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel86
  - number: 86a.1
    text: |-
      De Dienst Wegverkeer laat met het oog op het toezicht op het verrichten van keuringen, keuringen uitvoeren door het
      ter keuring aanbieden van een voertuig in bij ministeriële regeling vast te stellen gevallen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel86a
  - number: 86a.2
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld betreffende de wijze waarop de keuring wordt uitgevoerd.
      Deze regels kunnen inhouden dat verscherpt toezicht wordt gehouden indien blijkt dat er door een natuurlijke
      persoon die daartoe niet bevoegd is motorrijtuigen en aanhangwagens, waarvoor [artikel 72][ref1] geldt, met
      uitzondering van bussen als bedoeld in de Wet personenvervoer, aan een keuring worden onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel86a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: '87.1'
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie die erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel87
  - number: '87.2'
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel87
  - number: 87.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel87
  - number: 87.2.b
    text: |-
      in strijd met de eisen, bedoeld in [artikel 75, eerste lid, onderdeel a][ref1], of de regels, bedoeld in
      [artikel 76, derde lid][ref2], een keuringsbewijs afgeeft voor een motorrijtuig of een aanhangwagen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel76
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '76'
        hoofdstuk: V
        paragraaf: '3'
  - number: 87.2.c
    text: een keuringsrapport afgeeft voor een motorrijtuig of een aanhangwagen, waarvoor de erkenning niet geldt,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel87
  - number: 87.2.d
    text: |-
      de verplichting, vervat in [artikel 85][ref1], [86, vijfde lid][ref2], [90, vierde lid][ref3], of
      [91, vierde lid][ref4], niet nakomt,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel90
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel91
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '85'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '86'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '90'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '91'
        hoofdstuk: V
        paragraaf: '6'
  - number: 87.2.e
    text: |-
      weigert een keuringsbewijs af te geven voor een motorrijtuig of een aanhangwagen, waarvoor de erkenning
      geldt, hoewel dat voertuig bij een keuring, verricht met inachtneming van de regels, bedoeld in
      [artikel 76, derde lid][ref1], voldoet aan de eisen, bedoeld in [artikel 75, eerste lid, onderdeel a][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '76'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: 87.2.f
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel87
  - number: '87.3'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, onderdelen *a, d* en *f*, een erkenning
      schorsen voor een door hem daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel87
  - number: 87a.1
    text: |-
      De Dienst Wegverkeer trekt de bevoegdheid voertuigen aan een keuring te onderwerpen in, indien degene aan wie die
      bevoegdheid is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel87a
  - number: 87a.2
    text: |-
      De Dienst Wegverkeer kan de bevoegdheid voertuigen aan een keuring te onderwerpen intrekken of de daaraan verbonden
      voorschriften wijzigen, indien degene aan wie die bevoegdheid is verleend:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel87a
  - number: 87a.2.a
    text: niet meer voldoet aan de voor de bevoegdheid voertuigen aan een keuring te onderwerpen gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel87a
  - number: 87a.2.b
    text: |-
      in strijd met de regels, bedoeld in [artikel 76, derde lid][ref1], een voertuig aan een onderzoek onderwerpt,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel76
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '76'
        hoofdstuk: V
        paragraaf: '3'
  - number: 87a.2.c
    text: |-
      handelt in strijd met een of meer andere uit de bevoegdheid voertuigen aan een keuring te onderwerpen
      voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel87a
  - number: 87a.3
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, onderdelen a en c, de bevoegdheid voertuigen
      aan een keuring te onderwerpen schorsen voor een door deze dienst daarbij vast te stellen termijn die ten hoogste
      twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel87a
  - number: '88.1'
    text: |-
      De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie. In dat
      geval wordt de kennisgeving na daartoe strekkend verzoek van de belanghebbende in een beschikking vastgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel88
  - number: '88.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld met betrekking tot het toezicht en het verscherpen
      daarvan, alsmede met betrekking tot het intrekken, wijzigen en schorsen van de erkenning of bevoegdheid tot keuren.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel88
  - number: '89'
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 83][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel83
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '83'
        hoofdstuk: V
        paragraaf: '5'
  - number: '90.1'
    text: |-
      Tegen een beschikking tot weigering van de afgifte van een keuringsbewijs kan een belanghebbende bezwaar maken of
      administratief beroep instellen bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel90
  - number: '90.2'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] kan tegen een beschikking tot weigering van
      de afgifte van een keuringsbewijs slechts bezwaar worden gemaakt of administratief beroep worden ingesteld terstond
      nadat de beschikking is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '90.3'
    text: |-
      Het bezwaar of administratief beroep wordt slechts in behandeling genomen indien het voertuig in de staat waarin
      het zich ten tijde van de keuring bevond, onmiddellijk op een door de Dienst Wegverkeer bepaalde plaats ter
      beschikking wordt gesteld ten behoeve van een herkeuring door een door de Dienst Wegverkeer aangewezen deskundige.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel90
  - number: '90.4'
    text: |-
      In afwijking van de [artikelen 7:15][ref1] en [7:28 van de Algemene wet bestuursrecht][ref2] dient bij de indiening
      van het bezwaar- of beroepschrift een bedrag ter vergoeding van de aan de herkeuring verbonden kosten te worden
      betaald. De hoogte van het bedrag en de wijze van betaling worden vastgesteld door de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '90.5'
    text: |-
      Degene die de beschikking tot weigering van de afgifte van een keuringsbewijs heeft gegeven, wordt in de
      gelegenheid gesteld bij de herkeuring aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel90
  - number: '90.6'
    text: |-
      Indien het voertuig volgens het oordeel van de deskundige voldoet aan de in [artikel 75][ref1] bedoelde eisen,
      geeft de Dienst Wegverkeer alsnog het aangevraagde keuringsbewijs af en wordt het in het vierde lid bedoelde
      bedrag terugbetaald aan de indiener van het bezwaar- of beroepschrift. Is in dit geval de beschikking tot weigering
      van de afgifte van een keuringsbewijs gegeven door een erkende natuurlijke persoon of rechtspersoon, dan is
      deze vorenbedoeld bedrag verschuldigd aan de Dienst Wegverkeer en gehouden dit te betalen op de door deze dienst
      vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: '91.1'
    text: |-
      Tegen een beschikking tot afgifte van een keuringsbewijs kan een belanghebbende bezwaar maken of administratief
      beroep instellen bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel91
  - number: '91.2'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] kan tegen een beschikking tot afgifte
      van een keuringsbewijs bezwaar worden gemaakt of administratief beroep worden ingesteld gedurende de termijn van
      geldigheid van het keuringsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '91.3'
    text: |-
      Het bezwaar of administratief beroep wordt slechts in behandeling genomen indien het voertuig op een door de Dienst
      Wegverkeer bepaalde plaats ter beschikking wordt gesteld ten behoeve van een onderzoek door een door de Dienst
      Wegverkeer aangewezen deskundige.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel91
  - number: '91.4'
    text: |-
      In afwijking van de [artikelen 7:15][ref1] en [7:28 van de Algemene wet bestuursrecht][ref2] dient bij de indiening
      van het bezwaar- of beroepschrift een bedrag ter vergoeding van de aan het onderzoek verbonden kosten te worden
      betaald. De hoogte van het bedrag en de wijze van betaling worden vastgesteld door de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '91.5'
    text: |-
      Degene die de beschikking tot afgifte van een keuringsbewijs heeft gegeven, wordt in de gelegenheid gesteld bij het
      onderzoek aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel91
  - number: '91.6'
    text: |-
      Indien het voertuig volgens het oordeel van de deskundige ten tijde van de keuring op grond waarvan het
      keuringsbewijs is afgegeven, redelijkerwijze niet aan de keuringseisen kan hebben voldaan, daarbij in het
      bijzonder gelet op de termijn die is verstreken tussen de keuring en het onderzoek, verklaart de Dienst Wegverkeer
      het voor het voertuig afgegeven keuringsbewijs alsnog ongeldig en wordt het in het vierde lid bedoelde bedrag
      terugbetaald aan de indiener van het bezwaar- of beroepschrift. Is in dit geval de beschikking tot afgifte van
      een keuringsbewijs gegeven door een erkende natuurlijke persoon of rechtspersoon, dan is deze vorenbedoeld bedrag
      verschuldigd aan de Dienst Wegverkeer en gehouden dit te betalen op de door deze dienst vastgestelde wijze.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel91
  - number: '98'
    text: |-
      Indien in de bouw of inrichting van een voertuig dat ingevolge [hoofdstuk III][ref1] tot het verkeer op de weg is
      toegelaten, na die toelating wijziging is aangebracht, dient die wijziging, voor zover zulks bij algemene maatregel
      van bestuur is bepaald, te zijn goedgekeurd voor toelating van het gewijzigde voertuig tot het verkeer op de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: '99.1'
    text: |-
      Goedkeuring wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief door deze dienst verleend indien de aangebrachte wijziging bij een
      door de dienst verrichte keuring heeft voldaan aan de in [hoofdstuk III][ref1] voor toelating tot het verkeer op
      de weg gestelde, op het betrokken deel van het voertuig betrekking hebbende eisen. De keuring kan mede omvatten die
      delen van het voertuig waarvoor de aangebrachte wijziging gevolg heeft. Indien het een voertuig betreft als bedoeld
      in [artikel 28, eerste of tweede lid][ref2], dient de aangebrachte wijziging tevens te hebben voldaan aan de daar
      bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel28
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '28'
        hoofdstuk: III
        paragraaf: '4'
  - number: '99.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld betreffende het door de aanvrager voor de keuring
      ter beschikking stellen van het voertuig, het door de aanvrager overleggen van bescheiden en verstrekken van
      inlichtingen ter zake van de keuring alsmede betreffende de wijze waarop de keuring wordt verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel99
  - number: '99.3'
    text: |-
      In de bij algemene maatregel van bestuur aan te wijzen gevallen wordt voor het gewijzigde voertuig een nieuw
      kentekenbewijs afgegeven waarop melding wordt gemaakt van de goedgekeurde wijziging.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel99
  - number: '100.1'
    text: |-
      De goedkeuring voor een wijziging in de bouw of inrichting van een voertuig wordt door de Dienst Wegverkeer
      verleend zonder dat de in [artikel 99][ref1] bedoelde keuring heeft plaatsgevonden, indien door een daartoe door
      de Dienst Wegverkeer erkende natuurlijke persoon of rechtspersoon wordt gewaarborgd dat de aangebrachte wijziging
      voldoet aan de in [hoofdstuk III][ref2] voor toelating tot het verkeer op de weg gestelde eisen en de geboden
      waarborgen ten minste gelijkwaardig zijn aan de keuring door de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '99'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: '100.2'
    text: |-
      De erkenning geldt voor de in de erkenning aangegeven werkzaamheden ter zake van het wijzigen van de bouw of
      inrichting van voertuigen die behoren tot een in de erkenning aangewezen groep. De erkenning kan gelden voor
      bepaalde of voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel100
  - number: '100.3'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en kunnen
      met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel100
  - number: '101.1'
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door deze dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend aan de natuurlijke persoon of rechtspersoon
      die voldoet aan de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de organisatie
      van de aanvrager alsmede het proces volgens hetwelk de aanvrager zijn werkzaamheden verricht, alsmede de voor
      de werkzaamheden benodigde apparatuur. Ten aanzien van de voor de werkzaamheden benodigde apparatuur kan bij
      die ministeriële regeling de eis worden gesteld dat die apparatuur is goedgekeurd door een door Onze Minister
      aan te wijzen keuringsinstelling en met de in die regeling vast te stellen periodiciteit is onderzocht door deze
      keuringsinstelling dan wel door een door deze keuringsinstelling erkende onderzoeksgerechtigde en kunnen regels
      worden vastgesteld met betrekking tot de erkenning van onderzoeksgerechtigden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel101
  - number: '101.2'
    text: Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel101
  - number: '101.3'
    text: |-
      De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning op grond van
      [artikel 103, tweede lid][ref1], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel van zes maanden ingeval reeds twee of meer malen een dergelijke aan
      de aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel103
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '103'
        hoofdstuk: V
        paragraaf: '8'
  - number: '102.1'
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing
      in de *Staatscourant*. Tot dit toezicht kan behoren het steekproefsgewijs keuren van door een erkende natuurlijke
      persoon of rechtspersoon aangebrachte wijzigingen in de bouw of inrichting van voertuigen. Voorts kan tot het
      toezicht behoren het periodiek controleren van de organisatie van degene aan wie de erkenning is verleend alsmede
      het proces volgens hetwelk hij zijn werkzaamheden verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel102
  - number: '102.2'
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel102
  - number: '102.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop het toezicht wordt
      gehouden en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend en van de eigenaar
      of houder van het voertuig waarvoor een keuring wordt geëist. Deze regels kunnen inhouden dat een verscherpt
      toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit de erkenning voortvloeiende
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel102
  - number: '103.1'
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie de erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel103
  - number: '103.2'
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel103
  - number: 103.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel103
  - number: 103.2.b
    text: |-
      de verplichtingen, vervat in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] en
      [artikel 102, tweede lid][ref2], niet nakomt, of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel102
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '102'
        hoofdstuk: V
        paragraaf: '8'
  - number: 103.2.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel103
  - number: '103.3'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel103
  - number: 103a
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld met betrekking tot het intrekken, wijzigen en schorsen
      van de erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel103a
  - number: '104'
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 100][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel100
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '100'
        hoofdstuk: V
        paragraaf: '8'
  - number: '105'
    text: |-
      Indien het voor een motorrijtuig of een aanhangwagen afgegeven kentekenbewijs ingevolge
      [artikel 60, eerste lid, onderdeel b of c][ref1], is ingevorderd en dat bewijs is toegezonden aan de Dienst
      Wegverkeer, dient het voertuig alvorens het kentekenbewijs door deze dienst aan de houder van dat bewijs kan worden
      teruggegeven, te zijn goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '60'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '106.1'
    text: |-
      De goedkeuring wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief door deze dienst verleend indien het voertuig bij een door de dienst
      verrichte keuring heeft beantwoord aan de bij of krachtens deze wet vastgestelde eisen, met uitzondering van de
      ingevolge [hoofdstuk III][ref1] met betrekking tot de toelating tot het verkeer op de weg vastgestelde eisen.
      Indien het een voertuig betreft als bedoeld in [artikel 75, eerste lid, onderdeel b][ref2], dient het voertuig bij
      de keuring tevens te hebben beantwoord aan de in dat artikel bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: '106.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld betreffende het door de aanvrager voor de keuring
      ter beschikking stellen van het voertuig, het door de aanvrager overleggen van bescheiden en verstrekken van
      inlichtingen ter zake van de keuring alsmede betreffende de wijze waarop de keuring wordt verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel106
  - number: '107.1'
    text: |-
      Aan de bestuurder van een motorrijtuig op de weg dient door de daartoe bevoegde autoriteit een rijbewijs te zijn
      afgegeven voor het besturen van motorrijtuigen van de categorie waartoe dat motorrijtuig behoort.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel107
  - number: '107.2'
    text: 'Het rijbewijs dient:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel107
  - number: 107.2.a
    text: te voldoen aan de bij ministeriële regeling vastgestelde eisen inzake inrichting, uitvoering en invulling,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel107
  - number: 107.2.b
    text: zijn geldigheid niet te hebben verloren, en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel107
  - number: 107.2.c
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel107
  - number: '107.3'
    text: |-
      Indien de aanvrager als ingezetene is ingeschreven in de basisadministratie persoonsgegevens
      van een gemeente, wordt het in de basisadministratie opgenomen sociaal-fiscaalnummer, bedoeld in
      [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref1], op de bij ministeriële
      regeling vastgestelde wijze op het rijbewijs vermeld. Indien de aanvrager niet als ingezetene is ingeschreven in
      de basisadministratie persoonsgegevens van een gemeente dan wel indien in de basisadministratie persoonsgegevens
      geen sociaal-fiscaalnummer van de aanvrager is opgenomen, wordt op het rijbewijs een bij ministeriële regeling
      vastgestelde aanduiding vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: '108.1'
    text: |-
      [Artikel 107][ref1] is niet van toepassing op bestuurders van:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 108.1.a
    text: gehandicaptenvoertuigen die zijn uitgerust met een motor, landbouwtrekkers en motorrijtuigen met beperkte snelheid;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel108
  - number: 108.1.b
    text: |-
      motorrijtuigen, gedurende de tijd dat aan die bestuurders rijonderricht in de zin van de
      [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven, voor zover het motorrijtuig daarbij niet onder
      toezicht wordt bestuurd en overigens is voldaan aan de bij algemene maatregel van bestuur gestelde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 108.1.c
    text: |-
      motorrijtuigen, gedurende de tijd dat door die bestuurders een rijproef wordt afgelegd in het kader van een
      onderzoek, door of vanwege de overheid ingesteld, naar hun rijvaardigheid of geschiktheid, voor zover het
      motorrijtuig daarbij niet onder toezicht wordt bestuurd en overigens is voldaan aan de bij algemene maatregel van
      bestuur gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel108
  - number: 108.1.d
    text: |-
      motorrijtuigen, indien die bestuurders vreemdelingen in de zin van de [Vreemdelingenwet 2000][ref1] zijn, die
      op grond van hun hoedanigheid van of betrekking tot diplomatiek of consulair personeel dan wel op grond van hun
      hoedanigheid van of betrekking tot personeel in dienst van een in Nederland gevestigde internationale organisatie
      houder zijn van een door Onze Minister van Buitenlandse Zaken verstrekt identiteitsbewijs voor geprivilegieerden en
      aan wie, tenzij het een bestuurder van een bromfiets betreft, door het daartoe bevoegde gezag buiten Nederland een
      rijbewijs is afgegeven dat geldig is voor het besturen van een motorrijtuig als waarmee wordt gereden;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 108.1.e
    text: |-
      motorrijtuigen, indien die bestuurders lid zijn van een krijgsmacht of behoren tot de civiele dienst van een
      krijgsmacht die in het kader van het op 19 juni 1951 te Londen gesloten Verdrag tussen de Staten die partij zijn
      bij het Noord-Atlantisch Verdrag nopens de rechtspositie van hun krijgsmachten, in Nederland is gelegerd, dan wel
      behoren tot het gezin van een lid van een krijgsmacht als hiervoor bedoeld of tot het gezin van een tot de civiele
      dienst van zodanige krijgsmacht behorende persoon, en aan wie, tenzij het een bestuurder van een bromfiets betreft,
      door het daartoe bevoegde gezag in de Staat van herkomst of één van zijn samenstellende delen een rijbewijs is
      afgegeven dat geldig is voor het besturen van een motorrijtuig als waarmee wordt gereden;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel108
  - number: 108.1.f
    text: |-
      motorrijtuigen, anders dan bromfietsen, indien die bestuurders buiten Nederland woonachtig zijn en zij zich
      bevinden in het internationaal verkeer, mits aan hen door het daartoe bevoegde gezag buiten Nederland een rijbewijs
      is afgegeven dat geldig is voor het besturen van een motorrijtuig als waarmee wordt gereden alsmede, in de gevallen
      waarin zulks is vereist op grond van internationale overeenkomsten die Nederland binden, aan hen buiten Nederland
      een internationaal rijbewijs is afgegeven dat geldig is voor het besturen van een motorrijtuig als waarmee wordt
      gereden;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel108
  - number: 108.1.g
    text: |-
      motorrijtuigen, anders dan bromfietsen, indien die bestuurders in Nederland woonachtig zijn en aan hen door het
      daartoe bevoegde gezag buiten Nederland, anders dan in een andere Lid-Staat van de Europese Gemeenschappen of in
      een andere Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, een
      rijbewijs is afgegeven dat geldig is voor het besturen van een motorrijtuig als waarmee wordt gereden, zo lang
      sedert de dag waarop zij zich in Nederland hebben gevestigd, nog geen 185 dagen zijn verstreken;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel108
  - number: 108.1.h
    text: |-
      motorrijtuigen, indien die bestuurders in Nederland woonachtig zijn en aan hen door het daartoe bevoegde gezag
      in een andere Lid-Staat van de Europese Gemeenschappen of in een andere Staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland, een rijbewijs is afgegeven dat geldig is voor het
      besturen van een motorrijtuig als waarmee wordt gereden, gedurende de periode die is gelegen tussen de datum van
      vestiging van die bestuurders in Nederland en de datum waarop sedert de datum van afgifte van dat rijbewijs tien
      jaren zijn verstreken dan wel, indien die periode korter is dan een jaar, gedurende een jaar vanaf het moment van
      vestiging van die bestuurders in Nederland;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel108
  - number: 108.1.i
    text: 'bromfietsen, indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel108
  - number: 108.1.i.1°
    text: die bestuurders buiten Nederland woonachtig zijn en zij zich bevinden in het internationaal verkeer;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel108
  - number: 108.1.i.2°
    text: |-
      die bestuurders die afkomstig zijn uit een Staat anders dan een andere Lid-Staat van de Europese Gemeenschappen,
      een andere Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland en
      die in Nederland woonachtig zijn, zo lang sedert de dag waarop zij zich in Nederland hebben gevestigd, nog geen 185
      dagen zijn verstreken;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel108
  - number: 108.1.i.3°
    text: |-
      die bestuurders die afkomstig zijn uit een andere Lid-Staat van de Europese Gemeenschappen, een andere Staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland en in Nederland woonachtig
      zijn, en die niet beschikken over een rijbewijs dat de bevoegdheid geeft tot het besturen van motorrijtuigen van
      een andere categorie dan bromfietsen, zolang sedert de dag waarop zij zich in Nederland hebben gevestigd, nog geen
      185 dagen zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel108
  - number: '108.2'
    text: |-
      Bij ministeriële regeling worden voorschriften vastgesteld ter uitvoering van de in het eerste lid, onderdelen *b*
      en *c*, bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel108
  - number: '110.1'
    text: |-
      Motorrijtuigen mogen slechts worden bestuurd door personen die de leeftijd van achttien jaren of, voor zover
      het betreft motorrijtuigen, al dan niet met aanhangwagen, die zijn ingericht voor het vervoer van meer dan acht
      personen, de bestuurder daaronder niet begrepen, de leeftijd van eenentwintig jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel110
  - number: '110.2'
    text: |-
      Bij algemene maatregel van bestuur kan een lagere minimumleeftijd dan die in het eerste lid genoemd, worden
      vastgesteld voor het besturen van bromfietsen, gehandicaptenvoertuigen, landbouwtrekkers en motorrijtuigen met
      beperkte snelheid, niet zijnde stoom- en motorwalsen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel110
  - number: '110.3'
    text: |-
      Het eerste lid geldt niet voor degene aan wie rijonderricht wordt gegeven in het kader van een opleiding voor
      beroepschauffeur, mits is voldaan aan de bij algemene maatregel van bestuur gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel110
  - number: 110a.1
    text: 'Bij algemene maatregel van bestuur worden eisen vastgesteld met betrekking tot motorrijtuigen waarmee:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel110a
  - number: 110a.1.a
    text: |-
      rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 110a.1.b
    text: |-
      in het kader van een door of vanwege de overheid ingesteld onderzoek naar de rijvaardigheid of geschiktheid een
      rijproef wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel110a
  - number: 110a.2
    text: Bij ministeriële regeling kunnen nadere regels ter uitvoering van het eerste lid worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel110a
  - number: 110b.1
    text: |-
      Het is degene die rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] geeft, verboden
      zodanig rijonderricht te geven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel110b
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 110b.1.a
    text: |-
      het motorrijtuig waarmee rijonderricht wordt gegeven, niet voldoet aan de daaraan ingevolge [artikel 110a][ref1]
      gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel110a
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel110b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 110a
        hoofdstuk: VI
        paragraaf: '2'
  - number: 110b.1.b
    text: |-
      degene aan wie rijonderricht wordt gegeven, de leeftijd van achttien jaren of, voor zover het betreft
      motorrijtuigen, al dan niet met aanhangwagen, die zijn ingericht voor het vervoer van meer dan acht personen,
      de bestuurder daaronder niet begrepen, de leeftijd van eenentwintig jaren, dan wel, voor zover het bromfietsen
      betreft, de leeftijd van zestien jaren nog niet heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel110b
  - number: 110b.1.c
    text: |-
      niet wordt voldaan aan de overigens bij algemene maatregel van bestuur ten aanzien van het geven van rijonderricht
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel110b
  - number: 110b.2
    text: |-
      Het eerste lid, aanhef en onderdeel b, geldt niet voor zover het rijonderricht betreft dat plaatsvindt in het
      kader van een opleiding voor beroepschauffeur, mits is voldaan aan de bij algemene maatregel van bestuur gestelde
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel110b
  - number: '111.1'
    text: |-
      Een rijbewijs wordt op aanvraag en tegen betaling van het daarvoor vastgestelde tarief, slechts afgegeven aan
      degene die:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel111
  - number: 111.1.a
    text: |-
      de leeftijd van achttien jaren of, voor zover het betreft een rijbewijs voor het besturen van motorrijtuigen, al
      dan niet met aanhangwagen, die zijn ingericht voor het vervoer van meer dan acht personen, de bestuurder daaronder
      niet begrepen, de leeftijd van eenentwintig jaren heeft bereikt, dan wel, indien de aanvraag betrekking heeft op
      afgifte van een rijbewijs dat geldig is voor het besturen van bromfietsen, de leeftijd van zestien jaren heeft
      bereikt en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel111
  - number: 111.1.b
    text: |-
      blijkens een overeenkomstig bij algemene maatregel van bestuur vastgestelde regels door of vanwege de overheid
      ingesteld onderzoek dan wel blijkens een eerder aan hem afgegeven rijbewijs of een hem door het daartoe bevoegde
      gezag buiten Nederland afgegeven rijbewijs dat voldoet aan de bij algemene maatregel van bestuur vastgestelde
      eisen, beschikt over een voldoende mate van rijvaardigheid en geschiktheid, dan wel, indien de aanvraag betrekking
      heeft op afgifte van een rijbewijs dat geldig is voor het besturen van bromfietsen, over een voldoende mate van
      rijvaardigheid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel111
  - number: '111.2'
    text: |-
      De aanvrager van een rijbewijs dient zich zowel bij de indiening van de aanvraag als bij de uitreiking
      van het rijbewijs te identificeren met een op zijn naam gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3° van de Wet op de identificatieplicht][ref1], een geldig rijbewijs,
      dan wel een eerder aan hem afgegeven rijbewijs dat zijn geldigheid heeft verloren door het verstrijken van
      de geldigheidsduur. Degene ten aanzien van wie een onderzoek als bedoeld in het eerste lid, onderdeel b,
      wordt ingesteld, dient zich te identificeren met een op zijn naam gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3° van de Wet op de identificatieplicht][ref2], een geldig rijbewijs
      dan wel een eerder aan hem afgegeven rijbewijs dat zijn geldigheid heeft verloren door het verstrijken van de
      geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '111.3'
    text: |-
      Aan degene die vreemdeling in de zin van de [Vreemdelingenwet 2000][ref1] is, en geen onderdaan van een Lid-
      Staat van de Europese Gemeenschappen of een andere Staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of Zwitserland, wordt een rijbewijs slechts afgegeven indien hij rechtmatig in Nederland
      verblijft als bedoeld in [artikel 8, onder a tot en met d en l van die wet][ref2]. Voor de uitvoering hiervan is de
      korpschef in de zin van de [Vreemdelingenwet 2000][ref3] verplicht aan degene die is belast met de afgifte van het
      rijbewijs, kosteloos de noodzakelijke opgaven en inlichtingen te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0011823
  - number: '111.4'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid, onderdeel *b*.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel111
  - number: '111.5'
    text: |-
      In de gevallen waarin het rijbewijs overeenkomstig [artikel 116][ref1] wordt afgegeven door de burgemeester dan
      wel de aanvraag overeenkomstig het bepaalde krachtens [artikel 113, eerste lid][ref2], wordt ingediend bij de
      burgemeester, wordt het in het eerste lid bedoelde tarief vastgesteld bij plaatselijke verordening. In de overige
      gevallen worden het tarief en de wijze van betaling daarvan vastgesteld door de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel113
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '116'
        hoofdstuk: VI
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '113'
        hoofdstuk: VI
        paragraaf: '4'
  - number: '111.6'
    text: |-
      Voor zover dit noodzakelijk is ten behoeve van het onderzoek naar de rijvaardigheid en geschiktheid, bedoeld in
      het eerste lid, onder b, worden door het met dat onderzoek belaste gezag persoonsgegevens betreffende iemands
      rijvaardigheid en gezondheid verwerkt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel111
  - number: '112.1'
    text: |-
      Onverminderd [artikel 111][ref1] wordt een rijbewijs niet afgegeven aan degene:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel111
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '111'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 112.1.a
    text: aan wie de bevoegdheid tot het besturen van motorrijtuigen is ontzegd, voor de duur van de ontzegging;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel112
  - number: 112.1.b
    text: |-
      van wie ingevolge een der [artikelen 130, tweede lid][ref1], of [164][ref2] de overgifte van dat bewijs is
      gevorderd dan wel wiens rijbewijs is ingevorderd en aan wie dat bewijs niet is teruggegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel164
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '164'
        hoofdstuk: IX
  - number: 112.1.c
    text: |-
      ten aanzien van wie ingevolge [artikel 131, derde lid, onderdeel a][ref1], de geldigheid van het rijbewijs is
      geschorst, voor de categorie of categorieën van motorrijtuigen waarop de schorsing betrekking heeft, voor de duur
      van de schorsing;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '9'
  - number: 112.1.d
    text: |-
      van wie ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1] de inlevering van het
      rijbewijs is gevorderd dan wel wiens rijbewijs krachtens die wet is ingenomen, of


      [ref1]: https://wetten.overheid.nl/BWBR0004581
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0004581
  - number: 112.1.e
    text: |-
      van wie is gebleken dat die houder is van een rijbewijs, afgegeven door het daartoe bevoegde gezag in een andere
      Lid-Staat van de Europese Gemeenschappen of in een andere Staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland, tenzij de afgifte van een rijbewijs plaatsvindt tegen overlegging van
      dat rijbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel112
  - number: '112.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdelen *b*, *c* en *d*, wordt onder rijbewijs mede verstaan een
      rijbewijs, afgegeven door het daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig
      is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel112
  - number: '113.1'
    text: |-
      De aanvraag van een rijbewijs dient te geschieden overeenkomstig bij algemene maatregel van bestuur vastgestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel113
  - number: '113.2'
    text: |-
      Degene die is belast met de afgifte van rijbewijzen, verschaft zich de nodige zekerheid over de identiteit van
      de aanvrager. Hij is bevoegd te vorderen dat de aanvrager op een door hem te bepalen plaats en tijd persoonlijk
      verschijnt voor een door hem aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel113
  - number: '113.3'
    text: |-
      Degene die is belast met de afgifte van rijbewijzen vergewist zich ervan dat de bij de aanvraag van een rijbewijs
      over te leggen bescheiden aan de daaraan gestelde eisen voldoen en dat ook overigens aan de met betrekking tot de
      aanvraag gestelde voorwaarden wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel113
  - number: '113.4'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste tot en met het derde lid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel113
  - number: '114'
    text: |-
      Het is verboden voor het verkrijgen van een rijbewijs opzettelijk onjuiste opgaven te doen, onjuiste inlichtingen
      te verschaffen en onjuiste bewijsstukken en andere bescheiden over te leggen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel114
  - number: '115.1'
    text: |-
      Degene die is belast met de afgifte van rijbewijzen, en die in het kader van de aanvraag of de uitreiking
      van een nieuw rijbewijs of een vervangend rijbewijs de beschikking krijgt over een rijbewijs waarvan
      ingevolge een der [artikelen 130, tweede lid][ref1], of [164][ref2] de overgifte is gevorderd, waarvan
      ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref3] de inlevering is
      gevorderd of ten aanzien waarvan ingevolge een der [artikelen 120, derde lid][ref4], [124, vierde lid][ref5],
      [131, derde lid, onderdeel b][ref6], [132, vijfde lid][ref7], of [180, derde lid][ref8], van deze wet een
      verplichting tot inlevering bestaat, is bevoegd dat rijbewijs in te nemen en het door te begeleiden naar het
      betrokken parket van het openbaar ministerie dan wel naar degene bij wie de houder dat rijbewijs had dienen in
      te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel164
      [ref3]: https://wetten.overheid.nl/BWBR0004581
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel120
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel124
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref7]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref8]: https://wetten.overheid.nl/BWBR0006622#Artikel180
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '164'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0004581
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '120'
        hoofdstuk: VI
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '124'
        hoofdstuk: VI
        paragraaf: '7'
      - id: ref6
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '9'
      - id: ref7
        bwb_id: BWBR0006622
        artikel: '132'
        hoofdstuk: VI
        paragraaf: '9'
      - id: ref8
        bwb_id: BWBR0006622
        artikel: '180'
        hoofdstuk: XI
  - number: '115.2'
    text: |-
      Degene die is belast met de afgifte van rijbewijzen, en die in het kader van de aanvraag of de uitreiking van een
      nieuw rijbewijs of een vervangend rijbewijs de beschikking krijgt over een rijbewijs dat zijn geldigheid heeft
      verloren ingevolge [artikel 123, eerste lid, aanhef en onderdeel d][ref1], is bevoegd dat rijbewijs in te nemen en
      door te geleiden naar de instantie die het heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '123'
        hoofdstuk: VI
        paragraaf: '7'
  - number: '115.3'
    text: |-
      Voor de toepassing van het eerste en het tweede lid wordt onder een rijbewijs mede verstaan een rijbewijs,
      afgegeven door het daartoe bevoegde gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de
      houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel115
  - number: '115.4'
    text: Bij ministeriële regeling kunnen regels worden vastgesteld ter uitvoering van het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel115
  - number: '116.1'
    text: |-
      Een rijbewijs wordt overeenkomstig bij algemene maatregel van bestuur vastgestelde regels afgegeven door de
      burgemeester van de gemeente waar de aanvrager op het tijdstip van de aanvraag als ingezetene was ingeschreven
      in de basisadministratie persoonsgegevens of, in de bij algemene maatregel van bestuur bepaalde gevallen, door de
      Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel116
  - number: '116.2'
    text: |-
      De in het eerste lid bedoelde regels kunnen mede betrekking hebben op de bestelling, het transport en de
      beveiliging van rijbewijzen, de met betrekking tot de afgifte van rijbewijzen te voeren administratie en de in het
      kader van de afgifteprocedure te treffen beveiligingsmaatregelen. Bij ministeriële regeling kunnen ter uitvoering
      van die regels nadere regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel116
  - number: '117'
    text: |-
      De burgemeester van de gemeente waar de aanvrager op het tijdstip van de aanvraag als ingezetene was ingeschreven
      in de basisadministratie persoonsgegevens, is bevoegd tot het afgeven van internationale rijbewijzen ten behoeve
      van het verkeer met motorrijtuigen in het buitenland. Gelijke bevoegdheid kan door Onze Minister worden verleend
      aan besturen van verenigingen met volledige rechtsbevoegdheid, die behartiging van verkeersbelangen ten doel
      hebben.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel117
  - number: '118.1'
    text: |-
      Een rijbewijs wordt afgegeven voor het besturen van een of meer in dat bewijs aangeduide categorieën van
      motorrijtuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel118
  - number: '118.2'
    text: De categorieën worden vastgesteld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel118
  - number: '118.3'
    text: |-
      De uit de categorieën voortvloeiende bevoegdheden kunnen overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels worden beperkt door het stellen van eisen aan het motorrijtuig of aan de bestuurder daarvan.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel118
  - number: '118.4'
    text: |-
      Bij ministeriële regeling worden voorschriften vastgesteld met betrekking tot de wijze waarop beperkingen als
      bedoeld in het derde lid worden aangegeven in het rijbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel118
  - number: 118a
    text: |-
      Als datum van afgifte wordt in het rijbewijs en in het rijbewijzenregister vermeld de datum waarop het besluit tot
      afgifte is genomen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel118a
  - number: '119.1'
    text: |-
      Degene die is belast met de afgifte van rijbewijzen geeft overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels een nieuw rijbewijs af:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel119
  - number: 119.1.a
    text: bij vernieuwing van het eerder aan de aanvrager afgegeven rijbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel119
  - number: 119.1.b
    text: |-
      bij wijziging van de omvang van de uit het eerder afgegeven rijbewijs voortvloeiende bevoegdheden, met uitzondering
      van de in [artikel 131, derde lid, onderdeel a][ref1], bedoelde schorsing van de geldigheid;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '9'
  - number: 119.1.c
    text: bij wijziging van de personalia van de houder;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel119
  - number: 119.1.d
    text: |-
      na ongeldigverklaring van het eerder afgegeven rijbewijs op grond van [artikel 124, eerste lid, onderdeel e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '124'
        hoofdstuk: VI
        paragraaf: '7'
  - number: 119.1.e
    text: in geval het eerder afgegeven rijbewijs versleten of geheel of ten dele onleesbaar is;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel119
  - number: 119.1.f
    text: in geval het eerder afgegeven rijbewijs verloren is geraakt of teniet is gegaan.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel119
  - number: '119.2'
    text: |-
      Het nieuwe rijbewijs wordt niet afgegeven dan nadat het eerder afgegeven rijbewijs waarvoor het wordt afgegeven, is
      ingeleverd bij degene die is belast met de afgifte van het nieuwe rijbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel119
  - number: '119.3'
    text: |-
      Voor de toepassing van het eerste en het tweede lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven
      door het daartoe bevoegde gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere Staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in
      Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel119
  - number: '119.4'
    text: |-
      Indien de houder van een verloren geraakt rijbewijs waarvoor een nieuw rijbewijs is afgegeven, na de afgifte van
      het nieuwe rijbewijs weer in het bezit komt van dat verloren geraakte rijbewijs, dient hij dat rijbewijs in te
      leveren bij degene die het nieuwe rijbewijs heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel119
  - number: '119.5'
    text: Het eerste lid, aanhef, onderdelen e en f, gelden niet in bij algemene maatregel van bestuur vastgestelde gevallen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel119
  - number: '120.1'
    text: |-
      Degene die is belast met de afgifte van rijbewijzen geeft overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels een vervangend rijbewijs af voor:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel120
  - number: 120.1.a
    text: |-
      versleten of geheel of ten dele onleesbare rijbewijzen buiten de gevallen waarin daarvoor ingevolge
      [artikel 119][ref1] een nieuw rijbewijs wordt afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel119
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '119'
        hoofdstuk: VI
        paragraaf: '5'
  - number: 120.1.b
    text: |-
      verloren geraakte of tenietgegane rijbewijzen buiten de gevallen waarin daarvoor ingevolge [artikel 119][ref1] een
      nieuw rijbewijs wordt afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel119
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '119'
        hoofdstuk: VI
        paragraaf: '5'
  - number: '120.2'
    text: |-
      Het vervangende rijbewijs treedt in de plaats van het eerder afgegeven rijbewijs en wordt niet afgegeven dan nadat
      het versleten of geheel of ten dele onleesbaar geworden rijbewijs waarvoor het wordt afgegeven, is ingeleverd bij
      degene die belast is met de afgifte van het vervangende rijbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel120
  - number: '120.3'
    text: |-
      Indien de houder van een verloren geraakt rijbewijs waarvoor een vervangend rijbewijs is afgegeven, na de afgifte
      van het vervangende rijbewijs weer in het bezit komt van dat verloren geraakte rijbewijs, dient hij dat rijbewijs
      in te leveren bij degene die het vervangende rijbewijs heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel120
  - number: '120.4'
    text: |-
      Voor de toepassing van het eerste tot en met het derde lid wordt onder rijbewijs mede verstaan een rijbewijs,
      afgegeven door het daartoe bevoegde gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere
      Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de
      houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel120
  - number: 120a.1
    text: |-
      Het nieuwe of vervangende rijbewijs wordt niet uitgereikt indien zich tussen de aanvraag en de uitreiking één van
      de gevallen als bedoeld in [artikel 112, eerste lid][ref1], heeft voorgedaan, maar blijft bij degene die is belast
      met de afgifte van rijbewijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel112
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel120a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '112'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 120a.2
    text: |-
      Het wordt niet uitgereikt indien tussen de aanvraag en de uitreiking omstandigheden bekend zijn geworden die,
      indien zij bekend waren geweest bij de aanvraag ertoe hadden geleid dat geen besluit van afgifte was genomen. Het
      nieuwe of vervangende rijbewijs blijft bij degene die is belast met de afgifte van rijbewijzen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel120a
  - number: '121.1'
    text: |-
      De gemeenten zijn ter zake van de afgifte van rijbewijzen door de burgemeester en de afgifte van rijbewijzen
      door de Dienst Wegverkeer, waarvoor de aanvraag bij de burgemeester is ingediend, een bij ministeriële regeling
      vastgestelde vergoeding aan de Dienst Wegverkeer verschuldigd ter zake van de kosten die verband houden met de
      productie en aflevering van rijbewijzen alsmede het attenderen van de houders van een rijbewijs op het verloop
      van de geldigheidsduur door de Dienst Wegverkeer, het beheer en de instandhouding van het rijbewijzenregister,
      het verstrekken van gegevens uit dat register aan de in [artikel 127, eerste en tweede lid][ref1], bedoelde
      autoriteiten, het ongeldig verklaren van rijbewijzen door de Dienst Wegverkeer alsmede ter zake van de kosten die
      verband houden met de afgifte van rijbewijzen door de Dienst Wegverkeer, waarvoor de aanvraag bij de burgemeester
      is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel127
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '127'
        hoofdstuk: VI
        paragraaf: '8'
  - number: '121.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld met betrekking tot de wijze van afdracht van de
      vergoeding.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel121
  - number: '122.1'
    text: |-
      Behoudens [artikel 123][ref1] is een rijbewijs, afgegeven aan een aanvrager die de leeftijd van


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '123'
        hoofdstuk: VI
        paragraaf: '7'
  - number: 122.1.a
    text: |-
      60 jaren nog niet heeft bereikt, geldig voor de duur van tien achtereenvolgende jaren, gerekend vanaf de in het
      rijbewijs vermelde datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel122
  - number: 122.1.b
    text: |-
      60 jaren doch nog niet die van 65 jaren heeft bereikt, geldig vanaf de in het rijbewijs vermelde datum van afgifte
      tot de dag waarop hij de leeftijd van 70 jaren bereikt;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel122
  - number: 122.1.c
    text: |-
      65 jaren heeft bereikt, geldig voor de duur van vijf achtereenvolgende jaren, gerekend vanaf de in het rijbewijs
      vermelde datum van afgifte.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel122
  - number: '122.2'
    text: |-
      In afwijking van het eerste lid is een rijbewijs, afgegeven aan degene die naar verwachting op grond van zijn
      lichamelijke of geestelijke geschiktheid voor een beperkte termijn geschikt zal zijn voor het besturen van
      motorrijtuigen, geldig vanaf de in het rijbewijs vermelde datum van afgifte tot de dag waarop de termijn waarvoor
      de houder naar verwachting geschikt zal zijn voor het besturen van motorrijtuigen, verstrijkt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel122
  - number: '123.1'
    text: |-
      Onverminderd de [artikelen 122][ref1] en [131, derde lid][ref2], verliest een rijbewijs zijn geldigheid:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '122'
        hoofdstuk: VI
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '9'
  - number: 123.1.a
    text: door uitreiking van een nieuw of vervangend rijbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel123
  - number: 123.1.b
    text: |-
      door omwisseling tegen een rijbewijs dat aan de houder door het daartoe bevoegde gezag buiten Nederland is
      afgegeven, voor de categorie of categorieën van motorrijtuigen waarop de omwisseling betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel123
  - number: 123.1.c
    text: gedurende de tijd dat aan de houder de bevoegdheid tot het besturen van motorrijtuigen is ontzegd;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel123
  - number: 123.1.d
    text: door het onbevoegd daarin aanbrengen van wijzigingen;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel123
  - number: 123.1.e
    text: door het overlijden van de houder;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel123
  - number: 123.1.f
    text: |-
      door ongeldigverklaring, voor de categorie of categorieën waarop de ongeldigverklaring betrekking heeft dan
      wel, indien de ongeldigverklaring betrekking heeft op een deel van de geldigheidsduur, voor dat deel van de
      geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel123
  - number: 123.1.g
    text: door wijziging van de geslachtsnaam, de voornamen, de plaats of datum van geboorte of het geslacht van de houder of
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel123
  - number: 123.1.h
    text: door aangifte van vermissing van het rijbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel123
  - number: '123.2'
    text: |-
      Voor de toepassing van het eerste lid, aanhef, wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door
      het daartoe bevoegde gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere Staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in Nederland
      woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel123
  - number: 123a
    text: |-
      Een nieuw of vervangend rijbewijs verliest zijn geldigheid indien het drie maanden na de datum waarop het besluit
      tot afgifte is genomen niet is uitgereikt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel123a
  - number: '124.1'
    text: |-
      Onverminderd de [artikelen 132, tweede lid][ref1], en [134, derde lid][ref2], wordt een rijbewijs overeenkomstig
      bij algemene maatregel van bestuur vastgestelde regels voor een of meer categorieën van motorrijtuigen of voor een
      deel van de geldigheidsduur ongeldig verklaard indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel134
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
        hoofdstuk: VI
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '134'
        hoofdstuk: VI
        paragraaf: '9'
  - number: 124.1.a
    text: |-
      het rijbewijs is afgegeven op grond van door de houder verschafte onjuiste gegevens en het niet zou zijn afgegeven
      indien de onjuistheid van die gegevens ten tijde van de aanvraag bekend zou zijn geweest;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: 124.1.b
    text: na afgifte van het rijbewijs blijkt dat het kennelijk abusievelijk aan de houder is afgegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: 124.1.c
    text: |-
      de houder een schriftelijke verklaring overlegt, waarin hij afstand doet van de bevoegdheid tot het besturen van
      een of meer categorieën van motorrijtuigen waarvoor het rijbewijs is afgegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: 124.1.d
    text: |-
      de houder blijkens een op diens verzoek uitgevoerd onderzoek niet langer beschikt over de lichamelijke of
      geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen van de categorie of categorieën
      waarop het onderzoek betrekking heeft, voor die categorie of categorieën en, indien bij dat onderzoek blijkt dat
      hij tevens niet beschikt over de lichamelijke of geestelijke geschiktheid die is vereist voor het besturen van
      motorrijtuigen van een andere categorie of andere categorieën dan waarop het onderzoek betrekking heeft, tevens
      voor die andere categorie of categorieën;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: 124.1.e
    text: |-
      het als gevonden voorwerp is ontvangen en teruggave aan de houder niet mogelijk is gebleken, mits de houder nog
      geen aanvraag voor een vervangend rijbewijs heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: '124.2'
    text: 'De ongeldigverklaring geschiedt:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: 124.2.a
    text: |-
      in de in het eerste lid, onderdelen a en b, bedoelde gevallen door de Dienst Wegverkeer, indien de
      ongeldigverklaring betrekking heeft op een door deze dienst of een door Onze Minister afgegeven rijbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: 124.2.b
    text: |-
      in de in het eerste lid, onderdelen d en e, bedoelde gevallen door de Dienst Wegverkeer, indien de
      ongeldigverklaring betrekking heeft op een rijbewijs, afgegeven door het daartoe bevoegde gezag in een andere
      Lid-Staat van de Europese Gemeenschappen of in een andere Staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland, waarvan de houder in Nederland woonachtig is;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: 124.2.c
    text: |-
      in de in het eerste lid, onderdelen a en b, bedoelde gevallen door degene die is belast met de afgifte van
      rijbewijzen, indien de ongeldigverklaring betrekking heeft op een rijbewijs dat niet is afgegeven door de Dienst
      Wegverkeer of door Onze Minister, dan wel door het daartoe bevoegde gezag in een andere Lid-Staat van de Europese
      Gemeenschappen of in een andere Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: 124.2.d
    text: in het in het eerste lid, onderdeel c, bedoelde geval
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: 124.2.d.I
    text: |-
      indien de verklaring wordt overgelegd door een houder die zich ingevolge het in [artikel 131, eerste lid][ref1],
      bedoelde besluit dient te onderwerpen aan een onderzoek naar zijn rijvaardigheid of geschiktheid, door het CBR;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '9'
  - number: 124.2.d.II
    text: |-
      buiten de gevallen waarin de verklaring wordt overgelegd door een houder die zich ingevolge het in
      [artikel 131, eerste lid][ref1], bedoelde besluit dient te onderwerpen aan een onderzoek naar zijn rijvaardigheid
      of geschiktheid, door degene die is belast met de afgifte van rijbewijzen, indien de ongeldigverklaring betrekking
      heeft op een rijbewijs dat niet is afgegeven door de Dienst Wegverkeer of door Onze Minister dan wel door de
      Dienst Wegverkeer, indien de ongeldigverklaring betrekking heeft op een door deze dienst of een door Onze Minister
      afgegeven rijbewijs;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '9'
  - number: 124.2.e
    text: in de in het eerste lid, onderdeel d, bedoelde gevallen door het CBR;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: 124.2.f
    text: |-
      in het in het eerste lid, onderdeel e, bedoelde geval door degene die is belast met de afgifte van rijbewijzen,
      indien de ongeldigverklaring betrekking heeft op een rijbewijs dat niet is afgegeven door het daartoe bevoegde
      gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere Staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: '124.3'
    text: |-
      De ongeldigverklaring is van kracht met ingang van de zevende dag na die waarop het besluit tot ongeldigverklaring
      aan de houder van het rijbewijs is bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: '124.4'
    text: |-
      De houder van het ongeldig verklaarde rijbewijs dient dat rijbewijs zodra de ongeldigverklaring van kracht is
      geworden, in te leveren bij degene die het ongeldig heeft verklaard.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: '124.5'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld omtrent de wijze waarop de inlevering van
      ongeldig verklaarde rijbewijzen dient plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: '124.6'
    text: |-
      Indien het rijbewijs dat voor ongeldigverklaring op grond van het eerste lid, onderdeel c, in aanmerking komt, zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur, plaatst degene die ingevolge het tweede lid
      is belast met de ongeldigverklaring:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: 124.6.a
    text: |-
      in het in het tweede lid, onderdeel d, aanhef en onder I, bedoelde geval een aantekening in het rijbewijzenregister
      waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op de bij algemene maatregel van
      bestuur vastgestelde wijze dient aan te tonen dat hij, al naar gelang de aard van het onderzoek waarop het
      in [artikel 131, eerste lid][ref1], bedoelde besluit betrekking heeft, beschikt over de rijvaardigheid, de
      lichamelijke en geestelijke geschiktheid dan wel de rijvaardigheid en de lichamelijke en geestelijke geschiktheid
      die is vereist voor het besturen van motorrijtuigen van de categorie of categorieën waarop de door de houder
      overgelegde verklaring betrekking heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '9'
  - number: 124.6.b
    text: |-
      in het in het tweede lid, onderdeel d, aanhef en onder II, bedoelde geval een aantekening in het
      rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op de bij algemene
      maatregel van bestuur vastgestelde wijze dient aan te tonen dat hij beschikt over de rijvaardigheid en de
      lichamelijke en geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen van de categorie of
      categorieën waarop de door de houder overgelegde verklaring betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: '124.7'
    text: |-
      Indien het rijbewijs dat voor ongeldigverklaring op grond van het eerste lid, onderdeel d, in aanmerking komt, zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur, plaatst degene die ingevolge het tweede lid
      is belast met de ongeldigverklaring, een aantekening in het rijbewijzenregister waaruit blijkt dat de houder bij de
      aanvraag van een nieuw rijbewijs op de bij algemene maatregel van bestuur vastgestelde wijze dient aan te tonen dat
      hij beschikt over de lichamelijke en geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen
      van de categorie of categorieën waarop het onderzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: '124.8'
    text: |-
      Indien bij het op grond van het eerste lid, onderdeel d, uitgevoerde onderzoek is gebleken dat de resterende
      geldigheidsduur van het rijbewijs korter is dan de termijn waarvoor de houder blijkens het onderzoek naar
      verwachting geschikt zal zijn voor het besturen van motorrijtuigen, plaatst het CBR een aantekening in het
      rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op de bij algemene
      maatregel van bestuur vastgestelde wijze dient aan te tonen dat hij beschikt over de lichamelijke en geestelijke
      geschiktheid die is vereist voor het besturen van motorrijtuigen van de categorie of categorieën waarop het
      onderzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: '124.9'
    text: |-
      Voor de toepassing van het eerste lid, aanhef en onderdelen c, d en e, het derde tot en met het achtste lid wordt
      onder rijbewijs mede verstaan een rijbewijs, afgegeven door het daartoe bevoegde gezag in een andere Lid-Staat
      van de Europese Gemeenschappen of in een andere Staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of Zwitserland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel124
  - number: '125.1'
    text: |-
      Indien het rijbewijs niet voor alle categorieën waarvoor het is afgegeven, ongeldig is verklaard dan wel indien
      de ongeldigverklaring betrekking heeft op een deel van de geldigheidsduur, wordt door degene die is belast met de
      afgifte van rijbewijzen een nieuw rijbewijs afgegeven dat geldig is voor de categorie of categorieën of voor dat
      deel van de geldigheidsduur waarop de ongeldigverklaring geen betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel125
  - number: '125.2'
    text: |-
      Indien de ongeldigverklaring verband houdt met de noodzaak de rijbevoegdheid die voortvloeit uit een of meer
      categorieën waarvoor het rijbewijs is afgegeven, te beperken door het stellen van eisen aan het motorrijtuig of
      aan de bestuurder daarvan, wordt door degene die is belast met de afgifte van rijbewijzen een nieuw rijbewijs
      afgegeven waarin de noodzakelijk geachte beperkingen ten aanzien van de rijbevoegdheid zijn aangeduid met een bij
      ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel125
  - number: '125.3'
    text: |-
      Voor de toepassing van het eerste en het tweede lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven
      door het daartoe bevoegde gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere Staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in
      Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel125
  - number: '126.1'
    text: De Dienst Wegverkeer houdt een register betreffende de afgifte van rijbewijzen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel126
  - number: '126.2'
    text: |-
      In het kader van het register verwerkt de Dienst Wegverkeer gegevens omtrent de rijvaardigheid en geschiktheid
      van de aanvrager, de aanvraag van rijbewijzen, afgegeven rijbewijzen, omtrent rechterlijke uitspraken houdende
      ontzegging van de bevoegdheid tot het besturen van motorrijtuigen alsmede omtrent de gezondheid, voor zover die
      gegevens noodzakelijk zijn voor een goede uitvoering van deze wet en voor de handhaving van de bij of krachtens
      deze wet vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel126
  - number: '126.3'
    text: 'Het verzamelen van gegevens als bedoeld in het tweede lid, geschiedt voor de volgende doeleinden:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel126
  - number: 126.3.a
    text: voor een goede uitvoering van deze wet en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel126
  - number: 126.3.b
    text: voor de handhaving van de bij of krachtens deze wet vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel126
  - number: '126.4'
    text: |-
      De Dienst Wegverkeer mag strafrechtelijke gegevens, gegevens ter vaststelling van mogelijk strafbaar gedrag en
      gegevens over onrechtmatig of hinderlijk gedrag in verband met een opgelegd verbod naar aanleiding van dat gedrag,
      verwerken voor zover dit verband houdt met de in het derde lid genoemde doeleinden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel126
  - number: '126.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de inrichting en het beheer van het
      register.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel126
  - number: '126.6'
    text: |-
      Voor de toepassing van het tweede lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door het daartoe
      bevoegde gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere Staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in Nederland woonachtig
      is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel126
  - number: '127.1'
    text: |-
      Aan autoriteiten die betrokken zijn bij de uitvoering van deze wet of die zijn belast met de handhaving van de bij
      of krachtens deze wet vastgestelde voorschriften, worden op de door de Dienst Wegverkeer te bepalen wijze uit het
      register desgevraagd de gegevens verstrekt die zij voor de uitoefening van hun taak behoeven.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel127
  - number: '127.2'
    text: |-
      Aan bij algemene maatregel van bestuur aangewezen autoriteiten die betrokken zijn bij de uitvoering van een andere
      wet dan deze wet of zijn belast met de handhaving van de bij of krachtens een andere wet dan deze wet gestelde
      voorschriften, worden in de bij algemene maatregel van bestuur te bepalen gevallen op de door de Dienst Wegverkeer
      te bepalen wijze desgevraagd de gegevens verstrekt die zij voor de uitoefening van hun taak behoeven.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel127
  - number: '127.3'
    text: |-
      Aan de met de afgifte van rijbewijzen belaste autoriteiten buiten Nederland worden in de bij algemene maatregel van
      bestuur te bepalen gevallen op de door de Dienst Wegverkeer te bepalen wijze en tegen betaling van het door deze
      dienst vastgestelde tarief, inlichtingen uit het register verstrekt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel127
  - number: '127.4'
    text: |-
      De autoriteiten, bedoeld in het eerste en tweede lid, zijn bevoegd tot het invoeren, wijzigen en verwijderen van de
      bij algemene maatregel van bestuur aangewezen gegevens die van belang zijn voor het bijhouden van het register.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel127
  - number: '128.1'
    text: |-
      Aan belanghebbenden kunnen, overeenkomstig bij algemene maatregel van bestuur vastgestelde regels, op aanvraag en
      tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het door deze dienst voor de behandeling
      van de aanvraag vastgestelde tarief, uit het register gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel128
  - number: '128.2'
    text: |-
      Aan andere belanghebbenden dan degenen omtrent wie gegevens in het register zijn opgenomen, worden slechts gegevens
      verstrekt omtrent de afgifte en de geldigheid van rijbewijzen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel128
  - number: '128.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het verstrekken van gegevens aan belanghebbenden niet of slechts
      tot een beperkt aantal of in beperkte vorm of omvang geschiedt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel128
  - number: '129'
    text: |-
      De Dienst Wegverkeer stelt ten aanzien van het verwerken van gegevens als bedoeld in
      [artikel 126, tweede lid][ref1], een reglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '126'
        hoofdstuk: VI
        paragraaf: '8'
  - number: '130.1'
    text: |-
      Indien bij de bij algemene maatregel van bestuur aangewezen personen een vermoeden bestaat dat de houder
      van een rijbewijs niet langer beschikt over de rijvaardigheid dan wel over de lichamelijke of geestelijke
      geschiktheid, vereist voor het besturen van een of meer categorieën van motorrijtuigen waarvoor dat rijbewijs
      is afgegeven, doen zij daarvan zo spoedig mogelijk schriftelijk mededeling aan het CBR onder vermelding van de
      feiten en omstandigheden die aan het vermoeden ten grondslag liggen. Bij ministeriële regeling worden de feiten
      en omstandigheden aangewezen die aan het vermoeden ten grondslag dienen te liggen en worden ter zake van de
      uitoefening van deze bevoegdheid nadere regels vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel130
  - number: '130.2'
    text: |-
      Op de eerste vordering van de in [artikel 159, onderdeel a][ref1], bedoelde personen is de bestuurder van een
      motorrijtuig, ten aanzien van wie een vermoeden als bedoeld in het eerste lid bestaat, verplicht tot overgifte van
      het hem afgegeven rijbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '130.3'
    text: |-
      De in het tweede lid bedoelde vordering wordt gedaan indien de betrokken bestuurder de veiligheid op de weg
      zodanig in gevaar kan brengen dat hem met onmiddellijke ingang de bevoegdheid dient te worden ontnomen langer als
      bestuurder van een of meer categorieën van motorrijtuigen, waarvoor het rijbewijs is afgegeven, aan het verkeer
      deel te nemen. Bij ministeriële regeling worden de gevallen aangewezen waarin daarvan sprake is. Het ingevorderde
      rijbewijs wordt gelijktijdig met de schriftelijke mededeling, bedoeld in het eerste lid, aan het CBR toegezonden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel130
  - number: '130.4'
    text: |-
      In geval van toepassing van het tweede lid kan het motorrijtuig, voor zover geen andere bestuurder
      beschikbaar is of de bestuurder niet aanstonds voldoet aan de vordering, onder toezicht of, voor zover
      degene die de vordering heeft gedaan, zulks nodig oordeelt, in bewaring worden gesteld. In het laatste
      geval zijn de [artikelen 170, tweede lid, tweede en derde volzin, vierde en vijfde lid][ref1], [171][ref2],
      [172][ref3] en [173, eerste lid][ref4], van deze wet en de [artikelen 5:25, eerste lid][ref5], [5:26][ref6],
      [5:29, tweede en derde lid][ref7], [5:30, eerste, tweede en vierde lid, van de Algemene wet bestuursrecht][ref8]
      van overeenkomstige toepassing. Teruggave van het motorrijtuig vindt slechts plaats, indien aan de vordering is
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel172
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel173
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '171'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '172'
        hoofdstuk: X
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '173'
        hoofdstuk: X
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '130.5'
    text: |-
      Voor de toepassing van het eerste, tweede en derde lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven
      door het daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel130
  - number: '131.1'
    text: |-
      Indien een schriftelijke mededeling als bedoeld in [artikel 130, eerste lid][ref1], is gedaan, besluit het CBR in
      de bij ministeriële regeling aangewezen gevallen dat betrokkene zich dient te onderwerpen aan een onderzoek naar
      zijn rijvaardigheid of geschiktheid. Het besluit wordt zo spoedig mogelijk, doch uiterlijk binnen vier weken na
      ontvangst van de mededeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '9'
  - number: '131.2'
    text: |-
      Het CBR bepaalt de aard van het onderzoek en bepaalt door welke deskundige of deskundigen het onderzoek zal worden
      verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel131
  - number: '131.3'
    text: Bij het besluit, bedoeld in het eerste lid,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel131
  - number: 131.3.a
    text: |-
      wordt in de gevallen, bedoeld in [artikel 130, derde lid][ref1], de geldigheid van het rijbewijs van betrokkene
      voor een of meer categorieën van motorrijtuigen geschorst tot de dag waarop het in [artikel 134, vierde lid][ref2],
      bedoelde besluit van kracht wordt;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel134
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '134'
        hoofdstuk: VI
        paragraaf: '9'
  - number: 131.3.b
    text: |-
      wordt, indien de geldigheid van het rijbewijs van betrokkene overeenkomstig onderdeel a wordt geschorst en
      diens rijbewijs niet overeenkomstig [artikel 130, tweede lid][ref1], is ingevorderd, bepaald dat betrokkene zijn
      rijbewijs dient in te leveren;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '9'
  - number: 131.3.c
    text: |-
      wordt, indien de geldigheid van het rijbewijs van betrokkene niet overeenkomstig onderdeel a wordt geschorst,
      doch het rijbewijs wel overeenkomstig [artikel 130, tweede lid][ref1], is ingevorderd, bepaald dat het rijbewijs
      onverwijld aan betrokkene wordt teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '9'
  - number: '131.4'
    text: |-
      Indien een schriftelijke mededeling als bedoeld in [artikel 130, eerste lid][ref1], is gedaan, legt het CBR in
      de bij ministeriële regeling aangewezen gevallen betrokkene overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels de verplichting op zich binnen een daarbij vastgestelde termijn te onderwerpen aan educatieve
      maatregelen ter bevordering van de rijvaardigheid of geschiktheid. De aan deze maatregelen verbonden kosten,
      waarvan de hoogte wordt vastgesteld bij ministeriële regeling, komen ten laste van betrokkene. Indien het rijbewijs
      overeenkomstig [artikel 130, tweede lid][ref2], is ingevorderd, wordt het onverwijld aan betrokkene teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '9'
  - number: '131.5'
    text: |-
      Het CBR stelt de aard van de educatieve maatregelen vast en wijst een of meer tot toepassing van die maatregelen
      bevoegde deskundigen aan.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel131
  - number: '131.6'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste en het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel131
  - number: '131.7'
    text: |-
      Voor de toepassing van het derde lid, onderdelen a, b en c, het vierde lid en het vijfde lid wordt onder rijbewijs
      mede verstaan een rijbewijs, afgegeven door het daartoe bevoegde gezag buiten Nederland, waarvan de houder in
      Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel131
  - number: '132.1'
    text: |-
      Degene die zich ingevolge het in [artikel 131, eerste lid][ref1], bedoelde besluit dient te onderwerpen
      aan een onderzoek is, behoudens bij algemene maatregel van bestuur vastgestelde uitzonderingen, verplicht
      de daartoe vereiste medewerking te verlenen. Gelijke verplichting bestaat voor degene die zich ingevolge
      [artikel 131, vierde lid][ref2], of [artikel 134, vierde lid][ref3], dient te onderwerpen aan educatieve
      maatregelen ter bevordering van de rijvaardigheid of geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel134
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '9'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '134'
        hoofdstuk: VI
        paragraaf: '9'
  - number: '132.2'
    text: |-
      Bij gebreke van de in het eerste lid bedoelde medewerking besluit het CBR onverwijld tot ongeldigverklaring van
      het rijbewijs van de houder. Het CBR bepaalt daarbij op welke categorie of categorieën van motorrijtuigen waarvoor
      het rijbewijs is afgegeven, de ongeldigverklaring betrekking heeft. Het niet voldoen van de kosten van de bij
      ministeriële regeling aangewezen educatieve maatregelen ter bevordering van de rijvaardigheid of geschiktheid
      binnen de termijn die is vastgesteld bij het besluit waarbij de verplichting tot het zich onderwerpen aan die
      maatregelen is opgelegd, wordt als het niet verlenen van de vereiste medewerking aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel132
  - number: '132.3'
    text: Het CBR doet van het besluit mededeling aan bij algemene maatregel van bestuur aangewezen personen of instanties.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel132
  - number: '132.4'
    text: |-
      De ongeldigverklaring is van kracht met ingang van de zevende dag na die waarop het besluit tot ongeldigverklaring
      aan de houder van het rijbewijs is bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel132
  - number: '132.5'
    text: |-
      De houder van het ongeldig verklaarde rijbewijs dient dat rijbewijs, zodra de ongeldigverklaring van kracht is
      geworden, in te leveren bij:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel132
  - number: 132.5.a
    text: het CBR indien het ongeldig is verklaard voor alle categorieën waarvoor het is afgegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel132
  - number: 132.5.b
    text: |-
      degene die is belast met de afgifte van rijbewijzen indien het niet voor alle categorieën waarvoor het is
      afgegeven, ongeldig is verklaard dan wel indien de ongeldigverklaring betrekking heeft op een deel van de
      geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel132
  - number: '132.6'
    text: |-
      Indien het rijbewijs dat voor ongeldigverklaring op grond van het tweede lid in aanmerking komt, zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur, plaatst het CBR een aantekening in het
      rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op de bij algemene
      maatregel van bestuur vastgestelde wijze dient aan te tonen dat hij, al naar gelang de aard van het onderzoek
      waarop het in [artikel 131, eerste lid][ref1], bedoelde besluit betrekking heeft, beschikt over de rijvaardigheid
      dan wel de lichamelijke en geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen van de
      categorie of categorieën waarop dat besluit betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '9'
  - number: '132.7'
    text: |-
      Voor de toepassing van het tweede, vijfde en zesde lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven
      door het daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel132
  - number: '133.1'
    text: |-
      Het onderzoek kan in gedeelten plaatsvinden. Tijd en plaats van het onderzoek worden overeenkomstig bij algemene
      maatregel van bestuur vastgestelde regels vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel133
  - number: '133.2'
    text: Het onderzoek vangt zo spoedig mogelijk aan.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel133
  - number: '133.3'
    text: |-
      De bevindingen van het onderzoek worden door de deskundige of deskundigen zo spoedig mogelijk, doch uiterlijk acht
      weken na aanvang van het onderzoek dan wel van het eerste gedeelte daarvan, schriftelijk medegedeeld aan het CBR.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel133
  - number: '133.4'
    text: |-
      Het CBR kan in bijzondere gevallen toestaan dat door de deskundige of deskundigen van de in het derde lid genoemde
      termijn wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel133
  - number: '134.1'
    text: |-
      Het CBR stelt zo spoedig mogelijk, doch uiterlijk binnen vier weken na ontvangst van de bevindingen van de
      deskundige of deskundigen, de uitslag van het onderzoek vast. Van deze uitslag doet het CBR mededeling aan
      betrokkene. Indien een of meer deskundigen bij hun bevindingen hebben aangetekend dat inzage daarvan naar hun
      oordeel kennelijk ernstig nadeel voor betrokkene zou opleveren, deelt het CBR de bevindingen schriftelijk mede aan
      de door betrokkene aangewezen vertrouwensarts.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel134
  - number: '134.2'
    text: |-
      Het CBR besluit tot ongeldigverklaring van het rijbewijs indien de uitslag van het onderzoek daartoe aanleiding
      geeft. Bij ministeriële regeling worden de gevallen aangewezen waarin daarvan sprake is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel134
  - number: '134.3'
    text: |-
      Indien het CBR voornemens is het rijbewijs ongeldig te verklaren, deelt het dit mede aan de houder, tevens onder
      mededeling van de bevoegdheid van betrokkene om binnen twee weken een tweede onderzoek te verlangen. De aan dit
      tweede onderzoek verbonden kosten, waarvan de hoogte bij ministeriële regeling wordt vastgesteld, komen ten laste
      van betrokkene. De [artikelen 132][ref1] en [133][ref2] alsmede het eerste en het vierde lid van dit artikel zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel133
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
        hoofdstuk: VI
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '133'
        hoofdstuk: VI
        paragraaf: '9'
  - number: '134.4'
    text: |-
      Indien het CBR besluit dat het rijbewijs van de houder ongeldig wordt verklaard, wordt daarbij bepaald op welk
      deel van de geldigheidsduur alsmede op welke categorie of categorieën van motorrijtuigen waarvoor het rijbewijs is
      afgegeven de ongeldigverklaring betrekking heeft. [Artikel 132, vierde en vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
        hoofdstuk: VI
        paragraaf: '9'
  - number: '134.5'
    text: |-
      Indien de uitslag van het onderzoek aanleiding geeft tot ongeldigverklaring van het rijbewijs van betrokkene,
      plaatst het CBR, indien dat rijbewijs zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur,
      een aantekening in het rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op
      de bij algemene maatregel van bestuur vastgestelde wijze dient aan te tonen dat hij, al naar gelang de aard van het
      onderzoek, beschikt over de lichamelijke en geestelijke geschiktheid dan wel de rijvaardigheid die is vereist voor
      het besturen van motorrijtuigen van de categorie of categorieën waarop het onderzoek betrekking had.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel134
  - number: '134.6'
    text: |-
      Indien bij een op grond van het in [artikel 131, eerste lid][ref1], bedoelde besluit gevorderd onderzoek naar de
      geschiktheid is gebleken dat de resterende geldigheidsduur van het rijbewijs korter is dan de termijn waarvoor
      de houder blijkens de uitslag van het onderzoek naar verwachting geschikt zal zijn voor het besturen van
      motorrijtuigen, plaatst het CBR een aantekening in het rijbewijzenregister waaruit blijkt dat de houder bij de
      aanvraag van een nieuw rijbewijs op de bij algemene maatregel van bestuur vastgestelde wijze dient aan te tonen dat
      hij beschikt over de lichamelijke en geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen
      van de categorie of categorieën waarop het onderzoek betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '9'
  - number: '134.7'
    text: |-
      Indien het CBR het rijbewijs niet ongeldig verklaart, legt het in bij ministeriële regeling vastgestelde gevallen
      aan betrokkene overeenkomstig bij algemene maatregel van bestuur vastgestelde regels de verplichting op zich binnen
      een daarbij vastgestelde termijn te onderwerpen aan educatieve maatregelen ter bevordering van de rijvaardigheid
      of geschiktheid. De aan deze maatregelen verbonden kosten, waarvan de hoogte wordt vastgesteld bij ministeriële
      regeling, komen ten laste van betrokkene. Indien het rijbewijs overeenkomstig [artikel 130, tweede lid][ref1], is
      ingevorderd, wordt het onverwijld aan betrokkene teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '9'
  - number: '134.8'
    text: |-
      Het CBR stelt de aard van de educatieve maatregelen vast en wijst een of meer tot toepassing van die maatregelen
      bevoegde deskundigen aan.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel134
  - number: '134.9'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het derde, het vierde en het zevende
      lid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel134
  - number: '134.10'
    text: |-
      Voor de toepassing van dit artikel wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door het daartoe
      bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel134
  - number: 134a
    text: |-
      Voor zover dit noodzakelijk is voor de toepassing van deze paragraaf verwerkt het CBR persoonsgegevens betreffende
      iemands rijvaardigheid en gezondheid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel134a
  - number: '142.1'
    text: De Dienst Wegverkeer houdt een register betreffende de afgifte van bromfietscertificaten.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel142
  - number: '142.2'
    text: In het kader van het register verwerkt de Dienst Wegverkeer gegevens omtrent afgegeven bromfietscertificaten.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel142
  - number: '142.3'
    text: Bij algemene maatregel van bestuur worden regels vastgesteld omtrent de inrichting en het beheer van het register.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel142
  - number: '143.1'
    text: |-
      Aan autoriteiten die betrokken zijn bij de uitvoering van deze wet of die zijn belast met de handhaving van de bij
      of krachtens deze wet vastgestelde voorschriften, worden op de door de Dienst Wegverkeer te bepalen wijze uit het
      register desgevraagd de gegevens verstrekt die zij voor de uitoefening van hun taak behoeven.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel143
  - number: '143.2'
    text: |-
      De autoriteiten, bedoeld in het eerste lid, zijn gehouden om in bij algemene maatregel van bestuur te bepalen
      gevallen aan de Dienst Wegverkeer op de door deze dienst te bepalen wijze mededeling te doen van feiten die van
      belang zijn voor het bijhouden van het register.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel143
  - number: '144.1'
    text: |-
      Aan belanghebbenden kunnen, overeenkomstig bij algemene maatregel van bestuur vastgestelde regels, op aanvraag en
      tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het door deze dienst voor de behandeling
      van de aanvraag vastgestelde tarief, uit het register gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel144
  - number: '144.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het verstrekken van gegevens aan belanghebbenden niet of slechts
      tot een beperkt aantal of in beperkte vorm of omvang geschiedt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel144
  - number: '145'
    text: |-
      De Dienst Wegverkeer stelt ten aanzien van het verwerken van gegevens als bedoeld in
      [artikel 142, tweede lid][ref1], een reglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel142
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '142'
        hoofdstuk: VI
        paragraaf: '10'
  - number: 145a
    text: 'In dit hoofdstuk wordt verstaan onder de richtlijn: de bij regeling van Onze Minister aangewezen richtlijn.'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel145a
  - number: 145b.1
    text: |-
      Een elektronisch heffingssysteem als bedoeld in artikel 2, eerste lid, van de richtlijn, dat na 31 december 2006
      in gebruik wordt genomen, is gebaseerd op één of meer van de technologieën, bedoeld in artikel 2, eerste lid, van
      de richtlijn.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel145b
  - number: 145b.2
    text: Het eerste lid geldt niet voor een heffingssysteem als bedoeld in artikel 1, tweede lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel145b
  - number: 145c.1
    text: |-
      Op een weg waar tarieven voor het gebruik van de weg elektronisch worden geïnd, wordt een Europese elektronische
      tolheffingsdienst aangeboden, die voldoet aan de artikelen 1, derde lid, 3, eerste lid en 4, eerste, derde en
      achtste lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel145c
  - number: 145c.2
    text: |-
      Een Europese elektronische tolheffingssdienst wordt aangeboden uiterlijk met ingang van een bij ministeriële
      regeling te bepalen tijdstip, dat voor verschillende categorieën voertuigen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel145c
  - number: 145d
    text: |-
      Een exploitant stelt vanaf het in [artikel 145c, tweede lid][ref1], vastgestelde tijdstip aan gebruikers apparatuur
      ter beschikking die in het voertuig kan worden ingebouwd en voldoet aan de eisen, bedoeld in artikel 2, tweede lid,
      van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel145c
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel145d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 145c
        hoofdstuk: VIA
        paragraaf: '3'
  - number: 145e
    text: |-
      Bij regeling van Onze Minister kunnen ter uitvoering van de richtlijn aanvullende regels worden gesteld met
      betrekking tot de in dit hoofdstuk geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel145e
  - number: '146'
    text: |-
      Onze Minister kan van bepalingen van deze wet vrijstelling verlenen voor het gebruik van de weg ten behoeve van
      openbare diensten.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel146
  - number: '147'
    text: |-
      Onze Minister kan van het bepaalde krachtens deze wet vrijstelling verlenen voor het gebruik van de weg ten behoeve
      van openbare of door Onze Minister daarmee gelijk te stellen diensten.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel147
  - number: '148.1'
    text: |-
      Van het in [artikel 10, eerste lid][ref1], vervatte verbod kan overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels ontheffing worden verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel10
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '10'
        hoofdstuk: II
        paragraaf: '1'
  - number: 148.1.a
    text: voor wegen onder beheer van het Rijk door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel148
  - number: 148.1.b
    text: |-
      voor andere wegen door gedeputeerde staten. In afwijking hiervan wordt, indien de wegen waarvoor de ontheffing
      wordt gevraagd, alle zijn gelegen binnen één gemeente, de ontheffing verleend door burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel148
  - number: '148.2'
    text: |-
      De in het eerste lid bedoelde ontheffing kan slechts worden verleend indien wordt aangetoond dat maatregelen zijn
      getroffen ter voorkoming van deelneming aan de wedstrijd zonder dat de burgerrechtelijke aansprakelijkheid voor
      de schade waartoe het gebruik van motorrijtuigen tijdens de wedstrijd aanleiding kan geven, is gedekt door een
      verzekering overeenkomstig de [Wet aansprakelijkheidsverzekering motorrijtuigen][ref1]. De verzekering dient mede
      te dekken de aansprakelijkheid van degenen die de wedstrijd organiseren. Deze voorwaarde geldt niet ten aanzien van
      degene wiens aansprakelijkheid ten laste van de Staat komt.


      [ref1]: https://wetten.overheid.nl/BWBR0002415
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0002415
  - number: '149.1'
    text: |-
      Van het bepaalde krachtens deze wet kan in de krachtens deze wet aangewezen gevallen overeenkomstig krachtens deze
      wet vastgestelde regels ontheffing worden verleend:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149
  - number: 149.1.a
    text: voor wegen onder beheer van het Rijk door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149
  - number: 149.1.b
    text: voor wegen onder beheer van een provincie door gedeputeerde staten;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149
  - number: 149.1.c
    text: |-
      voor wegen onder beheer van een waterschap door het algemeen bestuur of, krachtens besluit van het algemeen
      bestuur, door het dagelijks bestuur;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149
  - number: 149.1.d
    text: |-
      voor andere wegen door burgemeester en wethouders of krachtens besluit van hen, door een door hen ingestelde
      bestuurscommissie of het dagelijks bestuur van een deelgemeente.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149
  - number: '149.2'
    text: |-
      In afwijking van het eerste lid kan door Onze Minister ontheffing worden verleend van het gebruik van autogordels
      en kinderbeveiligingsmiddelen. Bij of krachtens algemene maatregel van bestuur kunnen terzake nadere regels worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149
  - number: 149a.1
    text: |-
      In dit artikel, [artikel 149b][ref1] en de op deze artikelen berustende bepalingen wordt verstaan onder
      wegbeheerder: het ingevolge [artikel 149, eerste lid][ref2], tot het verlenen van een ontheffing bevoegde gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149b
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel149
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149b
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '149'
        hoofdstuk: VII
  - number: 149a.2
    text: |-
      In afwijking van [artikel 149, eerste lid][ref1], kan uitsluitend door de Dienst Wegverkeer ontheffing worden
      verleend of geweigerd van het bepaalde krachtens [artikel 13][ref2] en [artikel 71][ref3], in de bij algemene
      maatregel van bestuur aangewezen gevallen overeenkomstig bij of krachtens algemene maatregel van bestuur
      vastgestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel71
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '149'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '13'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
  - number: 149a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de partijen waarmee en de
      wijze waarop de Dienst Wegverkeer periodiek overleg voert met betrekking tot de uitvoering van dit artikel en
      [artikel 149b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149b
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149b
        hoofdstuk: VII
  - number: 149a.4
    text: |-
      De kosten die samenhangen met de behandeling van de aanvraag en de verlening van de ontheffing, alsmede de
      kosten die samenhangen met het verrichten van onderzoeken en met daarbij behorende afgifte van documenten
      ten behoeve van de ontheffingverlening worden ten laste gebracht van de aanvrager. Bij de toepassing van
      [artikel 4b, eerste lid, onderdeel n][ref1], met betrekking tot deze kosten kan worden bepaald dat de vergoeding
      van de kosten voorafgaand aan de behandeling van de aanvraag wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4b
        hoofdstuk: IA
        paragraaf: '2'
  - number: 149a.5
    text: |-
      Ten behoeve van de ontheffingverlening, bedoeld in het tweede lid, verwerkt de Dienst Wegverkeer gegevens met
      betrekking tot aanvrager, voertuig en kenteken die zijn opgenomen in de aanvragen voor ontheffingen en in afgegeven
      ontheffingen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149a
  - number: 149a.6
    text: |-
      Aan de toezichthouders bedoeld in [artikel 158][ref1] en aan de wegbeheerders worden op de door de Dienst
      Wegverkeer te bepalen wijze desgevraagd de gegevens met betrekking tot de inhoud van de afgegeven en geweigerde
      ontheffingen en de gegevens met betrekking tot het aantal en de aard van de ontheffingen verstrekt, die zij voor de
      uitoefening van hun taak behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel158
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '158'
        hoofdstuk: IX
  - number: 149b.1
    text: |-
      De wegbeheerder verstrekt aan de Dienst Wegverkeer ten behoeve van de ontheffingverlening, bedoeld in
      [artikel 149a, tweede lid][ref1], de bij of krachtens algemene maatregel van bestuur vastgestelde gegevens
      betreffende de infrastructuur en overige informatie op de bij of krachtens die algemene maatregel van bestuur
      vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149a
        hoofdstuk: VII
  - number: 149b.2
    text: |-
      In de bij of krachtens algemene maatregel van bestuur aangewezen gevallen behoeft de Dienst Wegverkeer voor de in
      [artikel 149a, tweede lid][ref1], bedoelde ontheffing de toestemming van de wegbeheerder. In deze gevallen wordt de
      toestemming verleend op basis van een door de Dienst Wegverkeer in overleg met de betrokken wegbeheerder opgestelde
      ontwerp-ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149a
        hoofdstuk: VII
  - number: 149b.3
    text: |-
      De wegbeheerder kan uitsluitend de toestemming weigeren, indien dat gerechtvaardigd is met het oog op de in
      [artikel 2, eerste en tweede lid][ref1], omschreven doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: 149b.4
    text: |-
      Bij het verstrekken van gegevens en informatie, bedoeld in het eerste lid, kan de wegbeheerder aangeven dat aan
      de door de Dienst Wegverkeer te verlenen ontheffing beperkingen of voorschriften worden verbonden, indien dat
      gerechtvaardigd is met het oog op de bescherming van de in [artikel 2, eerste en tweede lid][ref1], omschreven
      belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: 149b.5
    text: |-
      De Dienst Wegverkeer trekt verleende ontheffingen in of wijzigt deze voorzover de door de wegbeheerder ingevolge
      het eerste lid verstrekte gegevens of andere door hem aan de Dienst Wegverkeer verstrekte informatie daartoe
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149b
  - number: 149b.6
    text: |-
      Voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] worden als
      één besluit aangemerkt de ontheffing of de weigering daarvan door de Dienst Wegverkeer en de toestemming
      onderscheidenlijk de weigering daarvan door de wegbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: 149b.7
    text: |-
      De wegbeheerder ontvangt voor het verstrekken van gegevens en informatie, bedoeld in het eerste lid, en voor het
      verlenen van toestemming, bedoeld in het tweede lid, van de Dienst Wegverkeer een bij regeling van Onze Minister
      vastgestelde vergoeding, die is gebaseerd op het aantal en de aard van de verleende ontheffingen voor wegen die
      onder zijn beheer staan.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel149b
  - number: '150.1'
    text: |-
      Een vrijstelling of ontheffing kan onder beperkingen worden verleend. Aan een vrijstelling of ontheffing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel150
  - number: '150.2'
    text: Het is verboden te handelen in strijd met de aan een vrijstelling of ontheffing verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel150
  - number: '151'
    text: |-
      Onverminderd [artikel 149a][ref1] kunnen bij algemene maatregel van bestuur regels worden vastgesteld omtrent het
      ten laste van de aanvrager van een ontheffing brengen van de aan de behandeling van de aanvraag verbonden kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149a
        hoofdstuk: VII
  - number: 151a
    text: |-
      Voor zover dit noodzakelijk is voor het verlenen van ontheffingen als bedoeld in
      [artikel 149, tweede lid, aanhef en onder a][ref1], verwerkt Onze Minister persoonsgegevens betreffende iemands
      gezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel151a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '149'
        hoofdstuk: VII
  - number: '152.1'
    text: |-
      Verkeerstekens die worden geplaatst of verwijderd krachtens een verkeersbesluit, worden geplaatst en verwijderd op
      kosten van het gezag dat het verkeersbesluit heeft genomen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel152
  - number: '152.2'
    text: |-
      Maatregelen ter regeling van het verkeer als bedoeld in [artikel 15, tweede lid][ref1], geschieden op kosten van
      het gezag dat het verkeersbesluit heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
  - number: '153'
    text: |-
      Verkeerstekens die niet worden geplaatst of verwijderd krachtens een verkeersbesluit, worden geplaatst en
      verwijderd op kosten van het openbaar lichaam dat het beheer heeft over de weg of, indien geen openbaar lichaam het
      beheer heeft, de eigenaar van de weg.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel153
  - number: '154'
    text: |-
      In afwijking van [artikel 152][ref1] geschiedt de plaatsing en verwijdering van verkeerstekens, strekkende tot het
      instandhouden van de weg en het waarborgen van de bruikbaarheid daarvan op kosten van het openbaar lichaam dat het
      beheer heeft over de weg of, indien geen openbaar lichaam het beheer heeft, van de eigenaar van de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel152
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '152'
        hoofdstuk: VIII
  - number: '155'
    text: |-
      De kosten, verbonden aan de plaatsing van verkeerstekens en de uitvoering van maatregelen in dringende
      omstandigheden, komen ten laste van degene die deze uitvoert.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel155
  - number: '156'
    text: |-
      Bij algemene maatregel van bestuur kunnen kosten, verbonden aan de plaatsing of verwijdering van verkeerstekens,
      worden doorberekend aan degene ten behoeve van wie het verkeersteken is geplaatst of verwijderd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel156
  - number: 156a
    text: |-
      Door burgemeester en wethouders worden op kosten van de gemeente de grenzen van de bebouwde kom of kommen aangeduid
      voor zover en op de wijze als bij ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel156a
  - number: '157'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen en op welke wijze tarieven, verschuldigd op
      grond van deze wet, gedeeltelijk worden terugbetaald.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel157
  - number: '158.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, met uitzondering van de
      [hoofdstukken IA][ref1], [IB][ref2] en [IC][ref3], zijn belast de in [artikel 159][ref4] bedoelde personen.
      Zij beschikken daartoe over de in [artikel 160, vierde lid][ref5], genoemde bevoegdheid met betrekking tot het
      vervoeren van personen en over de bevoegdheid, genoemd in [artikel 160, vijfde lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIA
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIB
      [ref3]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIC
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel160
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel160
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: IA
      - id: ref2
        bwb_id: BWBR0006622
        hoofdstuk: IB
      - id: ref3
        bwb_id: BWBR0006622
        hoofdstuk: IC
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '160'
        hoofdstuk: IX
      - id: ref6
        bwb_id: BWBR0006622
        artikel: '160'
        hoofdstuk: IX
  - number: '158.2'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens de [artikelen 34][ref1] en [35][ref2] zijn voorts
      belast de bij besluit van Onze Minister in overeenstemming met Onze Minister van Economische Zaken aangewezen
      ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel35
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '34'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '35'
        hoofdstuk: III
        paragraaf: '5'
  - number: '158.3'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel158
  - number: '159'
    text: 'Met de opsporing van de feiten, strafbaar gesteld bij of krachtens deze wet, zijn belast:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel159
  - number: 159.a
    text: |-
      de in de [artikelen 141][ref1] en [142 van het Wetboek van Strafvordering][ref2] bedoelde personen;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: 159.b
    text: |-
      de bij algemene maatregel van bestuur aangewezen ambtenaren van de Rijksbelastingdienst, van de Rijks- en de
      provinciale waterstaat, van de Dienst Wegverkeer en van de verkeersinspecties, een en ander voor zover bij die
      algemene maatregel van bestuur is bepaald;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel159
  - number: 159.c
    text: |-
      de in de [artikelen 87][ref1] en [89 van de Wet personenvervoer 2000][ref2] bedoelde personen, voor zover het
      betreft de eisen die met betrekking tot voertuigen als bedoeld in die wet worden gesteld bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel89
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '87'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '89'
  - number: '160.1'
    text: |-
      Op de eerste vordering van de in [artikel 159][ref1] bedoelde personen is de bestuurder van een motorrijtuig
      verplicht dat motorrijtuig te doen stilhouden alsmede de volgende bewijzen behoorlijk ter inzage af te geven:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: 160.1.a
    text: |-
      de bij algemene maatregel van bestuur aangewezen delen van het kentekenbewijs, dan wel het in
      [artikel 37, eerste lid, onderdeel b][ref1], bedoelde bewijs, en, indien met het motorrijtuig een aanhangwagen
      wordt voortbewogen, de bij algemene maatregel van bestuur aangewezen delen van het kentekenbewijs van de
      aanhangwagen, dan wel het in [artikel 37, eerste lid, onderdeel b][ref2], bedoelde bewijs voor de aanhangwagen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 160.1.b
    text: |-
      het keuringsbewijs en, indien met het motorrijtuig een aanhangwagen wordt voortbewogen, het bij de aanhangwagen
      behorende keuringsbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel160
  - number: 160.1.c
    text: |-
      het rijbewijs dan wel het hem door het daartoe bevoegde gezag buiten Nederland afgegeven rijbewijs en, indien hem
      buiten Nederland een internationaal rijbewijs is afgegeven, dat bewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel160
  - number: 160.1.d
    text: |-
      indien hem ter zake van een bij of krachtens deze wet vastgesteld voorschrift ontheffing is verleend, de
      beschikking houdende verlening van ontheffing.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel160
  - number: '160.2'
    text: |-
      Indien het kentekenbewijs is afgegeven voor een aanhangwagen die overeenkomstig het krachtens deze wet bepaalde
      is voorzien van een identificatieplaat, kan aan de vordering worden voldaan binnen een bij algemene maatregel van
      bestuur vastgestelde termijn.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel160
  - number: '160.3'
    text: |-
      Op de eerste vordering van de in [artikel 159][ref1] bedoelde personen is de bestuurder van een voertuig,
      niet zijnde een motorrijtuig, verplicht dat voertuig te doen stilhouden en, indien hem ter zake van een bij of
      krachtens deze wet vastgesteld voorschrift ontheffing is verleend, de beschikking houdende verlening van ontheffing
      behoorlijk ter inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '160.4'
    text: |-
      De in [artikel 159][ref1] bedoelde personen zijn bevoegd zich te vergewissen van de naleving van de bij of
      krachtens deze wet vastgestelde voorschriften en zo nodig een voertuig ten aanzien waarvan zij een onderzoek
      wensen in te stellen, naar een nabij gelegen plaats te voeren of te doen voeren. De bestuurder van het voertuig
      ten aanzien waarvan dit onderzoek wenselijk wordt geoordeeld, en de bestuurder van het voertuig waardoor een
      aanhangwagen wordt voortbewogen ten aanzien waarvan zodanig onderzoek wenselijk wordt geoordeeld, zijn verplicht
      desgevorderd hun tot het onderzoek noodzakelijke medewerking te verlenen en desverlangd de in [artikel 159][ref2]
      bedoelde personen in hun voertuig te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '160.5'
    text: |-
      Op de eerste vordering van een van de in [artikel 159, onderdeel a][ref1], bedoelde personen zijn de bestuurder van
      een voertuig en degene die aanstalten maakt een voertuig te gaan besturen, verplicht hun medewerking te verlenen
      aan een voorlopig onderzoek van uitgeademde lucht en daartoe volgens door die persoon te geven aanwijzingen
      ademlucht te blazen in een door die persoon aangewezen apparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '160.6'
    text: |-
      De bestuurder van een voertuig, die door een der in [artikel 159][ref1] bedoelde personen in overtreding wordt
      bevonden van een bij of krachtens deze wet vastgesteld voorschrift, is verplicht de hem door die persoon ter
      bescherming van bij het verkeer betrokken belangen gegeven bevelen op te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '161.1'
    text: |-
      De in [artikel 159, onderdeel a][ref1], bedoelde personen die bij de uitoefening van de bij of
      krachtens deze wet, krachtens [artikel 2 van de Wet op de identificatieplicht][ref2] dan wel krachtens
      [artikel 5:19, derde lid, van de Algemene wet bestuursrecht][ref3] aan hen verleende bevoegdheden de beschikking
      krijgen over een rijbewijs waarvan ingevolge een der [artikelen 130, tweede lid][ref4], of [164][ref5] de
      overgifte is gevorderd, waarvan ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref6]
      de inlevering is gevorderd of ten aanzien waarvan ingevolge een der [artikelen 120, derde lid][ref7],
      [124, vierde lid][ref8], [131, derde lid, onderdeel b][ref9], [132, vijfde lid][ref10], of [180, derde lid][ref11],
      van deze wet een verplichting tot inlevering bestaat, zijn bevoegd dat rijbewijs in te nemen en het door te
      geleiden naar het betrokken parket van het openbaar ministerie dan wel naar degene bij wie de houder dat rijbewijs
      had dienen in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel164
      [ref6]: https://wetten.overheid.nl/BWBR0004581
      [ref7]: https://wetten.overheid.nl/BWBR0006622#Artikel120
      [ref8]: https://wetten.overheid.nl/BWBR0006622#Artikel124
      [ref9]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref10]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref11]: https://wetten.overheid.nl/BWBR0006622#Artikel180
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel161
