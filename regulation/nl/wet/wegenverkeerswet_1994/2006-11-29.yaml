        bwb_id: BWBR0006622
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '176.2'
    text: |-
      Overtreding van [artikel 11][ref1] wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van
      de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel11
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel176
