        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '164.8'
    text: |-
      In geval van toepassing van het eerste of vierde lid kan elke belanghebbende bij klaagschrift daartegen
      opkomen. Zolang in de zaak nog geen vervolging is ingesteld, wordt het klaagschrift ingediend ter griffie
      van de rechtbank in het arrondissement waar het in het eerste lid bedoelde feit werd begaan, en anders ter
      griffie van het gerecht in feitelijke aanleg waarvoor de vervolging plaatsvindt, dan wel het laatst plaatsvond.
      [Artikel 552a, derde en vijfde lid, van het Wetboek van Strafvordering][ref1] is verder van overeenkomstige
      toepassing. De raadkamer van het gerecht geeft zo spoedig mogelijk, na de belanghebbende, desverlangd bijgestaan
      door diens raadsman, te hebben gehoord, althans opgeroepen, zijn met redenen omklede beslissing, welke onverwijld
      aan de belanghebbende wordt betekend. Tegen de beslissing kan door het openbaar ministerie binnen veertien dagen
      daarna en door de belanghebbende binnen veertien dagen na de betekening beroep in cassatie worden ingesteld. De
      Hoge Raad beslist zo spoedig mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '552'
  - number: '164.9'
    text: |-
      Indien de zaak eindigt zonder oplegging van straf of maatregel of met zodanige oplegging, doch op grond
      van een feit waarvoor de toepassing van het eerste of vierde lid niet is toegelaten, kan de rechter
      op verzoek van de gewezen verdachte hem een vergoeding ten laste van de Staat toekennen voor de schade
      die hij ten gevolge van die toepassing heeft geleden. Onder schade is begrepen het nadeel dat niet in
      vermogensschade bestaat. De [artikelen 89, derde tot en met zesde lid][ref1],[ 90][ref2], [91][ref3] en
      [93 van het Wetboek van Strafvordering][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel90
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel91
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel93
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '89'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '90'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '91'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '93'
  - number: '165.1'
    text: |-
      Indien een bij deze wet als misdrijf strafbaar gesteld feit wordt begaan door een bij de ontdekking van het feit
      onbekend gebleven bestuurder van een motorrijtuig, is de eigenaar of houder van dat motorrijtuig verplicht op
      vordering van een der in [artikel 159][ref1] bedoelde personen binnen een daarbij te stellen termijn, die ten
      minste achtenveertig uren bedraagt, de naam en het volledige adres van de bestuurder bekend te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '165.2'
    text: |-
      Het eerste lid geldt niet, indien de eigenaar of houder niet heeft kunnen vaststellen wie de bestuurder was en hem
      daarvan redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel165
  - number: '166.1'
    text: |-
      Indien een bij deze wet als misdrijf strafbaar gesteld feit wordt begaan door een bij de ontdekking van het
      feit onbekend gebleven bestuurder van een motorrijtuig, waarmee een aanhangwagen waarvoor een kenteken is
      vereist, wordt voortbewogen, is de eigenaar of houder van die aanhangwagen verplicht op vordering van een der in
      [artikel 159][ref1] bedoelde personen binnen een daarbij te stellen termijn, die ten minste achtenveertig uren
      bedraagt, de naam en het volledige adres van de bestuurder dan wel van de eigenaar of houder van het motorrijtuig,
      waarmee die aanhangwagen werd voortbewogen, bekend te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '166.2'
    text: |-
      Het eerste lid geldt niet, indien de eigenaar of houder van de aanhangwagen niet heeft kunnen vaststellen wie de
      bestuurder dan wel de eigenaar of houder van het motorrijtuig, waarmee die aanhangwagen werd voortbewogen, was en
      hem daarvan redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel166
  - number: '167'
    text: |-
      De [artikelen 165][ref1] en [166][ref2] zijn mede van toepassing op de eigenaar of houder van een in het buitenland
      geregistreerd motorrijtuig of een in het buitenland geregistreerde aanhangwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel165
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel166
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '165'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '166'
        hoofdstuk: IX
  - number: '168'
    text: |-
      Voor de toepassing van [artikel 160][ref1], voor wat betreft de in het eerste lid bedoelde
      verplichting tot het doen stilhouden van een motorrijtuig en het vierde, vijfde en zesde lid, en van de
      [artikelen 162, eerste lid][ref2], [163][ref3] en [164][ref4] wordt met de bestuurder van een motorrijtuig
      gelijkgesteld degene die overeenkomstig de in [artikel 1, eerste lid, onderdeel n][ref5], bedoelde voorwaarde
      geacht wordt het motorrijtuig onder onmiddellijk toezicht van de bestuurder te besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel160
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel162
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel163
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel164
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '160'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '162'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '163'
        hoofdstuk: IX
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '164'
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '1'
        hoofdstuk: '1'
  - number: '169.1'
    text: |-
      Onze Minister van Verkeer en Waterstaat is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of
      krachtens deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel169
  - number: '169.2'
    text: |-
      De ambtenaren die een bevel hebben gegeven als bedoeld in [artikel 160, zesde lid][ref1], zijn bevoegd tot
      toepassing van bestuursdwang ter handhaving van het bevel.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel160
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '160'
        hoofdstuk: IX
  - number: '170.1'
    text: |-
      Tot de bevoegdheid van burgemeester en wethouders tot toepassing van bestuursdwang als bedoeld in
      [artikel 125 van de Gemeentewet][ref1], behoort de bevoegdheid tot het overbrengen en in bewaring stellen van een
      op een weg staand voertuig, indien met het voertuig een bij of krachtens deze wet vastgesteld voorschrift wordt
      overtreden en bovendien verwijdering van het voertuig noodzakelijk is in verband met


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel125
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '125'
  - number: 170.1.a
    text: het belang van de veiligheid op de weg, of
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel170
  - number: 170.1.b
    text: het belang van de vrijheid van het verkeer, of
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel170
  - number: 170.1.c
    text: het vrijhouden van aangewezen weggedeelten en wegen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel170
  - number: '170.2'
    text: |-
      De [artikelen 5:24, derde tot en met zesde lid][ref1], [5:25, tweede tot en met vijfde lid][ref2],
      [5:29, vierde lid, tweede volzin][ref3] en [5:30, derde lid, van de Algemene wet bestuursrecht][ref4]
      zijn niet van toepassing. Bij de toepassing van [artikel 5:25 van de Algemene wet bestuursrecht][ref5]
      treedt de rechthebbende die het voertuig afhaalt, in de plaats van de overtreder. Bij de toepassing
      van [artikel 5:29, tweede lid, van de Algemene wet bestuursrecht][ref6] wordt het afschrift van
      het proces-verbaal verstrekt aan de rechthebbende die het voertuig afhaalt. Voor de toepassing van
      [artikel 5:30 van de Algemene wet bestuursrecht][ref7] wordt de omstandigheid dat een voertuig niet is afgehaald,
      gelijkgesteld met de omstandigheid dat het voertuig niet kan worden teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '170.3'
    text: |-
      Burgemeester en wethouders plegen regelmatig overleg met de officier van justitie over de uitoefening van de in het
      eerste lid bedoelde bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel170
  - number: '170.4'
    text: |-
      Burgemeester en wethouders dragen er zorg voor dat in een daartoe aangelegd register aantekening wordt gehouden van
      de gevallen waarin de in het eerste lid bedoelde bevoegdheid wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel170
  - number: '170.5'
    text: |-
      Bij toepassing van het eerste lid wordt onder rechthebbende verstaan: degene die ofwel eigenaar is van het voertuig
      ofwel anders dan als bezitter het voertuig ten tijde van de overtreding ten gebruike onder zich had. Hierbij geldt
      [artikel 1, tweede lid][ref1], niet.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
        hoofdstuk: '1'
  - number: '170.6'
    text: |-
      De in het eerste lid bedoelde bevoegdheid wordt niet uitgeoefend, indien de rechthebbende het voertuig verwijdert
      voordat met de overbrenging een aanvang wordt gemaakt. Hij is alsdan de kosten verbonden aan de voorbereiding
      van de overbrenging, verschuldigd. [Artikel 5:26 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '171.1'
    text: |-
      Een beschikking tot toepassing van bestuursdwang overeenkomstig [artikel 170, eerste lid][ref1], wordt
      bekendgemaakt:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
  - number: 171.1.a
    text: aan de rechthebbende die het voertuig afhaalt, of
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel171
  - number: 171.1.b
    text: |-
      indien het voertuig binnen achtenveertig uur na de inbewaringstelling niet is afgehaald, zo mogelijk binnen een
      week:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel171
  - number: 171.1.b.1°
    text: aan degene aan wie het kenteken is opgegeven, indien het voertuig een kenteken voert;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel171
  - number: 171.1.b.2°
    text: |-
      aan degene die aangifte heeft gedaan, indien blijkt dat ter zake van het voertuig aangifte van vermissing is
      gedaan, of
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel171
  - number: 171.1.b.3°
    text: in nader bij ministeriële regeling vast te stellen gevallen op de daarbij aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel171
  - number: '171.2'
    text: |-
      Bij de bekendmaking krachtens het eerste lid, onderdeel *b*, wordt gewezen op het verschuldigd zijn van kosten,
      verbonden aan de toepassing van bestuursdwang.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel171
  - number: '172.1'
    text: |-
      Tot de kosten, verbonden aan de toepassing van bestuursdwang als bedoeld in [artikel 170, eerste lid][ref1], worden
      gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
  - number: 172.1.a
    text: de kosten die verband houden met de overbrenging en bewaring;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel172
  - number: 172.1.b
    text: de kosten die verband houden met de bekendmaking van de beschikking tot overbrenging en inbewaringstelling, en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel172
  - number: 172.1.c
    text: de kosten van verkoop, eigendomsoverdracht om niet of vernietiging.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel172
  - number: '172.2'
    text: |-
      Verkoop, eigendomsoverdracht om niet of vernietiging vindt niet plaats binnen twee weken na de bekendmaking van de
      beschikking tot toepassing van bestuursdwang krachtens [artikel 171, eerste lid, onderdeel b][ref1]. De opbrengst
      van verkoop of de geschatte sloopwaarde bij vernietiging wordt in mindering gebracht op de kosten, verbonden aan de
      toepassing van bestuursdwang.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel171
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '171'
        hoofdstuk: X
  - number: '172.3'
    text: |-
      Burgemeester en wethouders betalen het bedrag van de kosten, verbonden aan de toepassing van bestuursdwang, terug,
      indien:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel172
  - number: 172.3.a
    text: niet tot overbrenging en inbewaringstelling had mogen worden overgegaan;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel172
  - number: 172.3.b
    text: |-
      de omstandigheden waaronder de overtreding is begaan, van dien aard waren dat de kosten redelijkerwijs niet
      verschuldigd zijn, of
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel172
  - number: 172.3.c
    text: |-
      aannemelijk is dat het voertuig tegen de wil van de rechthebbende is gebruikt en hij dit gebruik redelijkerwijs
      niet heeft kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel172
  - number: '172.4'
    text: |-
      In een geval als bedoeld in het derde lid, onderdeel c, zijn de kosten verschuldigd door degene die de overtreding
      heeft begaan. [Artikel 5:26 van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '172.5'
    text: |-
      Indien de kosten, verbonden aan de toepassing van bestuursdwang, die door de rechthebbende zijn betaald, te hoog
      zijn berekend, betalen burgemeester en wethouders het te veel betaalde terug.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel172
  - number: '172.6'
    text: |-
      Indien de in het derde lid, onderdeel *b*, bedoelde omstandigheden van dien aard waren dat de kosten redelijkerwijs
      niet volledig verschuldigd zijn, betalen burgemeester en wethouders het niet verschuldigde bedrag terug.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel172
  - number: '172.7'
    text: |-
      Bij toepassing van het derde lid, onderdeel a, betalen burgemeester en wethouders tevens een redelijke
      schadeloosstelling aan de rechthebbende die het voertuig heeft afgehaald. Indien het voertuig ten tijde van de
      overtreding in gebruik was bij een ander dan de rechthebbende die het voertuig heeft afgehaald, treedt die ander
      voor de toepassing van dit lid in de plaats van de rechthebbende die het voertuig heeft afgehaald.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel172
  - number: '172.8'
    text: |-
      Indien aantoonbaar is dat tijdens de overbrenging en bewaring schade aan het voertuig is toegebracht, is de
      gemeente gehouden deze schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel172
  - number: '173.1'
    text: 'Bij algemene maatregel van bestuur worden:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel173
  - number: 173.1.a
    text: |-
      de soorten van de in [artikel 170, eerste lid, onderdeel c][ref1], bedoelde weggedeelten en wegen aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
  - number: 173.1.b
    text: |-
      nadere regels vastgesteld over de registratie van gegevens in geval van toepassing van
      [artikel 170, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
  - number: 173.1.c
    text: nadere regels vastgesteld over de berekening van de kosten, verbonden aan de toepassing van bestuursdwang, en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel173
  - number: 173.1.d
    text: |-
      de overige regels vastgesteld die voor de uitvoering van de [artikelen 170 tot en met 172][ref1] nodig worden
      geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
  - number: '173.2'
    text: |-
      Bij gemeentelijke verordening worden nadere regels gesteld ter uitvoering van de
      [artikelen 170 tot en met 172][ref1] en de in het eerste lid bedoelde algemene maatregel van bestuur. Die regels
      betreffen in elk geval


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
  - number: 173.2.a
    text: |-
      de aanwijzing van de plaats, onderscheidenlijk de plaatsen, waar verwijderde voertuigen in bewaring worden gesteld,
      en
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel173
  - number: 173.2.b
    text: de berekening van de kosten, verbonden aan de toepassing van bestuursdwang, en voorts
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel173
  - number: 173.2.c
    text: |-
      de aanwijzing van de weggedeelten en wegen, voor de bevoegdheid tot toepassing van bestuursdwang, bedoeld in
      artikel [170, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
  - number: '174.1'
    text: |-
      Indien ter zake van een overtreding van [artikel 40, eerste lid][ref1], proces-verbaal
      wordt opgemaakt door een ambtenaar, aangesteld voor de uitvoering van de politietaak,
      dan wel een op dat voorschrift betrekking hebbende gedraging, omschreven in de in
      [artikel 2, eerste lid, van de Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref2] bedoelde
      bijlage door hem wordt geconstateerd, begaan met een op de weg staand motorrijtuig, terwijl niet terstond blijkt
      wie de eigenaar of houder van dat motorrijtuig is, is de burgemeester bevoegd op verzoek van die ambtenaar dat
      motorrijtuig naar een door hem aangewezen plaats te doen overbrengen en in bewaring te doen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '2'
  - number: '174.2'
    text: |-
      Alvorens het in het eerste lid bedoelde verzoek te doen, kan de daar bedoelde ambtenaar door middel van een daartoe
      aan te brengen apparaat het rijden met het motorrijtuig voor ten hoogste twee dagen beletten. Het apparaat wordt
      binnen die termijn verwijderd, zodra bekend wordt wie de eigenaar of houder van het motorrijtuig is.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel174
  - number: '174.3'
    text: |-
      De [artikelen 170, tweede lid, tweede en derde volzin, vierde, vijfde en zesde lid][ref1], [171][ref2],
      [172][ref3] en [173, eerste lid][ref4], van deze wet en de [artikelen 5:25, eerste lid][ref5], [5:26][ref6],
      [5:29, tweede en derde lid][ref7], [5:30, eerste, tweede en vierde lid, van de Algemene wet bestuursrecht][ref8]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel172
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel173
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel174
    references:
