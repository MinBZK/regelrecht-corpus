      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel83
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel101
