  - number: '178.2'
    text: |-
      De in [artikel 177][ref1] strafbaar gestelde feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel177
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel178
