$id: wegenverkeerswet_1994
regulatory_layer: WET
publication_date: '2023-11-27'
valid_from: '2006-11-29'
bwb_id: BWBR0006622
url: https://wetten.overheid.nl/BWBR0006622/2006-11-29
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regels inzake het verkeer op de weg opnieuw vast
    te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.b
    text: |-
      wegen: alle voor het openbaar verkeer openstaande wegen of paden met inbegrip van de daarin liggende bruggen en
      duikers en de tot die wegen behorende paden en bermen of zijkanten;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.c
    text: |-
      motorrijtuigen: alle voertuigen, bestemd om anders dan langs spoorstaven te worden voortbewogen uitsluitend
      of mede door een mechanische kracht, op of aan het voertuig zelf aanwezig dan wel door elektrische tractie met
      stroomtoevoer van elders, met uitzondering van fietsen met trapondersteuning;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.d
    text: |-
      aanhangwagen: voertuig dat kennelijk is bestemd om te worden voortbewogen door een motorrijtuig. In het bepaalde
      krachtens deze wet kan onder aanhangwagen tevens worden verstaan een voertuig dat door een ander voertuig wordt
      voortbewogen of kennelijk is bestemd om door een ander voertuig te worden voortbewogen;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.e
    text: 'bromfiets:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.e.a
    text: |-
      motorrijtuig op twee wielen, met een door de constructie bepaalde maximumsnelheid van niet meer dan 45 km/h,
      uitgerust met een verbrandingsmotor met een cilinderinhoud van niet meer dan 50 cm3 of een elektromotor met een
      nominaal continu maximumvermogen van niet meer dan 4 kW, niet zijnde een gehandicaptenvoertuig;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.e.b
    text: |-
      motorrijtuig op drie wielen, met een door de constructie bepaalde maximumsnelheid van niet meer dan 45 km/h, niet
      zijnde een gehandicaptenvoertuig, uitgerust met:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.e.b.1°
    text: een motor met elektrische ontsteking met een cilinderinhoud van niet meer dan 50 cm3,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.e.b.2°
    text: |-
      een motor met inwendige verbranding en een netto maximumvermogen van niet meer dan 4 kW voor andere dan onder 1°
      genoemde motoren, of
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.e.b.3°
    text: een elektromotor met een nominaal continu maximumvermogen van niet meer dan 4 kW; dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.e.c
    text: |-
      motorrijtuig op vier wielen, niet zijnde een gehandicaptenvoertuig, met een door de constructie bepaalde
      maximumsnelheid van niet meer dan 45 km/h en een ledige massa van minder dan 350 kg, de massa van de batterijen in
      elektrische voertuigen niet inbegrepen, uitgerust met:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.e.c.1°
    text: een motor met elektrische ontsteking met een cilinderinhoud van niet meer dan 50 cm3,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.e.c.2°
    text: |-
      een motor met inwendige verbranding en een netto maximumvermogen van niet meer dan 4 kW voor andere dan onder 1°
      genoemde motoren, of
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.e.c.3°
    text: een elektromotor met een nominaal continu maximumvermogen van niet meer dan 4 kW.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.ea
    text: |-
      fietsen met trapondersteuning: fietsen die zijn voorzien van een elektrische hulpmotor met een nominaal continu
      vermogen van maximaal 0,25 kW en waarvan de aandrijfkracht geleidelijk vermindert en tenslotte wordt onderbroken
      wanneer het voertuig een snelheid van 25 km/h bereikt, of eerder, indien de bestuurder ophoudt met trappen;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.f
    text: |-
      typegoedkeuring: goedkeuring van tot een bepaald type behorende voertuigen, voertuigonderdelen, uitrustingsstukken
      of voorzieningen ter bescherming van weggebruikers en passagiers;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.g
    text: |-
      kenteken: kenteken als bedoeld in [artikel 36][ref1] of [artikel 37, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 1.1.h
    text: |-
      kentekenbewijs: kentekenbewijs als bedoeld in [artikel 36][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 1.1.i
    text: |-
      kentekenregister: register, bedoeld in [artikel 42][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel42
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '42'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 1.1.j
    text: |-
      keuringsbewijs: keuringsbewijs als bedoeld in [artikel 72][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 1.1.k
    text: 'keuringsrapport: keuringsbewijs of een beschikking tot weigering van de afgifte van een keuringsbewijs;'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.l
    text: |-
      rijbewijs: rijbewijs, bedoeld in [artikel 107][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 1.1.m
    text: |-
      rijbewijzenregister: register, bedoeld in [artikel 126][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '126'
        hoofdstuk: VI
        paragraaf: '8'
  - number: 1.1.n
    text: |-
      bestuurder van een motorrijtuig: degene die het motorrijtuig bestuurt of degene die, overeenkomstig de bij algemene
      maatregel van bestuur gestelde voorwaarde, wordt geacht het motorrijtuig onder zijn onmiddellijk toezicht te doen
      besturen;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.o
    text: 'houder van een motorrijtuig of een aanhangwagen: degene die het voertuig:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.o.1°
    text: op grond van een overeenkomst van huurkoop onder zich heeft,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.o.2°
    text: in vruchtgebruik heeft, of
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.o.3°
    text: anderszins, anders dan als eigenaar of bezitter, tot duurzaam gebruik onder zich heeft;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: 1.1.p
    text: |-
      verwerken van gegevens: verwerken als bedoeld in
      [artikel 1, onderdeel b, van de Wet bescherming persoonsgegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 1.1.q
    text: |-
      Dienst Wegverkeer: de in [artikel 4a][ref1] bedoelde dienst;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4a
        hoofdstuk: IA
        paragraaf: '1'
  - number: 1.1.r
    text: 'het CBR: de Stichting Centraal Bureau Rijvaardigheidsbewijzen.'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: '1.2'
    text: |-
      Indien de eigenaar van een motorrijtuig of een aanhangwagen niet tevens bezitter is, treedt de bezitter voor de
      toepassing van het bepaalde bij of krachtens deze wet voor de eigenaar in de plaats.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: '1.3'
    text: |-
      Degene aan wie een kenteken is opgegeven voor een motorrijtuig of een aanhangwagen wordt, tenzij anders blijkt,
      voor de toepassing van het bepaalde bij of krachtens deze wet beschouwd als eigenaar of houder van dat motorrijtuig
      of die aanhangwagen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
  - number: '1.4'
    text: |-
      Voor de toepassing van de [hoofdstukken III tot en met V][ref1] van deze wet worden vennootschappen zonder
      rechtspersoonlijkheid mede als rechtspersoon aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: '2.1'
    text: 'De krachtens deze wet vastgestelde regels kunnen strekken tot:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel2
  - number: 2.1.a
    text: het verzekeren van de veiligheid op de weg;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel2
  - number: 2.1.b
    text: het beschermen van weggebruikers en passagiers;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel2
  - number: 2.1.c
    text: het in stand houden van de weg en het waarborgen van de bruikbaarheid daarvan;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel2
  - number: 2.1.d
    text: het zoveel mogelijk waarborgen van de vrijheid van het verkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel2
  - number: '2.2'
    text: 'De krachtens deze wet vastgestelde regels kunnen voorts strekken tot:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel2
  - number: 2.2.a
    text: |-
      het voorkomen of beperken van door het verkeer veroorzaakte overlast, hinder of schade alsmede de gevolgen voor het
      milieu, bedoeld in de [Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 2.2.b
    text: |-
      het voorkomen of beperken van door het verkeer veroorzaakte aantasting van het karakter of van de functie van
      objecten of gebieden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel2
  - number: '2.3'
    text: 'De krachtens deze wet vastgestelde regels kunnen voorts strekken tot:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel2
  - number: 2.3.a
    text: het bevorderen van een doelmatig of zuinig energiegebruik;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel2
  - number: 2.3.b
    text: het waarborgen van het op juiste wijze in rekening brengen van tarieven voor het gebruik van de weg.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel2
  - number: '2.4'
    text: |-
      De vaststelling van regels bij ministeriële regeling ter uitvoering van het bij of krachtens deze wet bepaalde
      geschiedt in overeenstemming met Onze bij algemene maatregel van bestuur aangewezen ministers, indien deze regels
      strekken tot behartiging van de belangen, bedoeld in het tweede dan wel het derde lid.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel2
  - number: 2a
    text: |-
      Provincies, gemeenten en waterschappen behouden hun bevoegdheid om bij verordening regels vast te stellen ten
      aanzien van het onderwerp waarin deze wet voorziet, voorzover die regels niet in strijd zijn met de bij of
      krachtens deze wet vastgestelde regels en voorzover verkeerstekens krachtens deze wet zich daar niet toe lenen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel2a
  - number: 2b
    text: |-
      De voordracht voor een krachtens deze wet vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel2b
  - number: '3.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone
      omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President,
      [artikel 4, derde en vierde lid][ref3], in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011389#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel4
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0011389
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '4'
        hoofdstuk: '1'
  - number: '3.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen wordt onverwijld een voorstel van wet aan de Tweede Kamer
      gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel3
  - number: '3.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel3
  - number: '3.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld; buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel3
  - number: '3.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel3
  - number: '3.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel3
  - number: '4.1'
    text: |-
      Het bepaalde bij of krachtens deze wet en provinciale en plaatselijke verordeningen gelden slechts voor zover zulks
      bij algemene maatregel van bestuur is bepaald:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4
  - number: 4.1.a
    text: ten aanzien van voertuigen, voor zover die worden gebezigd ten behoeve van de strijdkrachten;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4
  - number: 4.1.b
    text: voor militairen te voet, voor zover zij zich ter uitoefening van de dienst op de weg bevinden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4
  - number: '4.2'
    text: |-
      Buiten de omstandigheden, bedoeld in het derde lid en het vijfde lid, kunnen in de gevallen waarin het bepaalde
      bij of krachtens deze wet en provinciale en plaatselijke verordeningen niet ingevolge het eerste lid van toepassing
      is verklaard, bij algemene maatregel van bestuur regels worden vastgesteld en kunnen bij ministeriële regeling ter
      uitvoering daarvan nadere regels worden vastgesteld:
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4
  - number: 4.2.a
    text: ten aanzien van voertuigen, voor zover die worden gebezigd ten behoeve van de strijdkrachten;
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4
  - number: 4.2.b
    text: voor militairen te voet, voor zover zij zich ter uitoefening van de dienst op de weg bevinden.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4
  - number: '4.3'
    text: |-
      Ingeval buitengewone omstandigheden dit noodzakelijk maken, kan bij koninklijk besluit worden bepaald dat van in
      dat besluit aan te wijzen bepalingen, genoemd in de algemene maatregel van bestuur bedoeld in het eerste lid, kan
      worden afgeweken door bestuurders van voertuigen gebezigd ten behoeve van de strijdkrachten en door militairen te
      voet die zich op de weg bevinden ter uitoefening van de dienst.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4
  - number: '4.4'
    text: |-
      Ingeval buitengewone omstandigheden dit noodzakelijk maken, kan bij koninklijk besluit worden bepaald dat ten
      aanzien van voertuigen van bij algemene maatregel van bestuur aan te wijzen overheidsdiensten, het bepaalde bij of
      krachtens deze wet en provinciale en plaatselijke verordeningen slechts gelden voor zover zulks bij die maatregel
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4
  - number: '4.5'
    text: |-
      In geval van de beperkte of de algemene noodtoestand is het militair gezag bevoegd voor het gebied waarvoor op
      grond van [artikel 7, eerste lid][ref1], of [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2],
      bepalingen uit de [Oorlogswet voor Nederland][ref3] in werking zijn gesteld, regels vast te stellen inzake het
      verkeer op de weg, afwijkende van het bepaalde bij of krachtens deze wet en van provinciale en plaatselijke
      verordeningen, alsmede van de in het tweede lid bedoelde, bij algemene maatregel van bestuur vastgestelde regels,
      voor zoveel dat door het gezag ter uitvoering van de militaire taak ter handhaving van de uitwendige of inwendige
      veiligheid nodig wordt geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007983
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007983
  - number: '4.6'
    text: |-
      Door de vorige leden wordt de gewone aansprakelijkheid uit andere wettelijke bepalingen voortvloeiende, niet
      opgeheven of verminderd.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4
  - number: 4a
    text: |-
      Er is een Dienst Wegverkeer, in het maatschappelijk verkeer aangeduid als RDW. De dienst bezit
      rechtspersoonlijkheid en is gevestigd te Zoetermeer.
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4a
  - number: 4b.1
    text: 'De Dienst Wegverkeer is belast met de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4b
  - number: 4b.1.a
    text: |-
      het in het kader van de toelating tot het verkeer op de weg verlenen van typegoedkeuringen voor voertuigen,
      voertuigonderdelen, uitrustingsstukken en voorzieningen ter bescherming van weggebruikers en passagiers, en van
      individuele goedkeuringen voor voertuigen, alsmede het intrekken van typegoedkeuringen en het verrichten van
      keuringen ingevolge [artikel 29][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel29
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '29'
        hoofdstuk: III
        paragraaf: '4'
  - number: 4b.1.b
    text: |-
      het houden van toezicht op het overeenstemmen van voertuigen, voertuigonderdelen, uitrustingsstukken en
      voorzieningen ter bescherming van weggebruikers en passagiers met het type waarvoor de goedkeuring is verleend,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4b
  - number: 4b.1.c
    text: |-
      het opgeven van kentekens voor motorrijtuigen en aanhangwagens en het ter zake van die opgaven afgeven van
      kentekenbewijzen, het schorsen van de geldigheid van kentekenbewijzen, het ongeldigverklaren van kentekenbewijzen,
      alsmede het houden van toezicht als bedoeld in [artikel 37, vierde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 4b.1.d
    text: het afgeven van keuringsrapporten voor motorrijtuigen en aanhangwagens,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4b
  - number: 4b.1.e
    text: het behandelen van bezwaren tegen afgegeven keuringsrapporten,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4b
  - number: 4b.1.f
    text: |-
      het in het kader van de toelating tot het verkeer op de weg verlenen van goedkeuringen voor motorrijtuigen en
      aanhangwagens waarvan de constructie is gewijzigd dan wel waarvan het kentekenbewijs is ingevorderd,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4b
  - number: 4b.1.g
    text: |-
      het afgeven van rijbewijzen in de gevallen, bedoeld in [artikel 116, eerste lid][ref1], alsmede het
      ongeldigverklaren van rijbewijzen in de in deze wet bepaalde gevallen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel116
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '116'
        hoofdstuk: VI
        paragraaf: '5'
  - number: 4b.1.h
    text: |-
      het verwerken van gegevens met betrekking tot opgegeven kentekens, afgegeven kentekenbewijzen, afgegeven
      keuringsrapporten, krachtens [artikel 149a][ref1] verleende ontheffingen en afgegeven rijbewijzen, alsmede met
      betrekking tot rechterlijke uitspraken houdende ontzegging van de bevoegdheid tot het besturen van motorrijtuigen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149a
        hoofdstuk: VII
  - number: 4b.1.i
    text: |-
      het overeenkomstig de bij of krachtens deze wet vastgestelde bepalingen verstrekken van gegevens uit de in
      onderdeel h bedoelde registers,
    url: https://wetten.overheid.nl/BWBR0006622/2006-11-29#Artikel4b
  - number: 4b.1.j
    text: |-
      het verlenen van erkenningen als bedoeld in de [artikelen 62][ref1], [70a][ref2], [83][ref3] en [101][ref4],
      en het verlenen van de bevoegdheid voertuigen aan een keuring te onderwerpen als bedoeld in [artikel 85a][ref5]
      alsmede het schorsen, wijzigen en intrekken van erkenningen en van de bevoegdheid voertuigen aan een keuring te
      onderwerpen,


