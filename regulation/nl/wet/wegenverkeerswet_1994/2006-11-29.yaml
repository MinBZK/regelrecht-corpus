        paragraaf: '5'
      - id: ref8
        bwb_id: BWBR0006622
        artikel: '124'
        hoofdstuk: VI
        paragraaf: '7'
      - id: ref9
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
