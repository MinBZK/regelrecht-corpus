  - number: '178.1'
    text: |-
      De in de [artikelen 175][ref1] en [176][ref2] strafbaar gestelde feiten zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel175
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel176
