  - number: 174a.1
    text: |-
      Onze Minister kan in verband met de aanwijzing, bedoeld in [artikel 20b][ref1], of een wijziging, schorsing of
      intrekking daarvan, aan degene die handelt in strijd met de in [artikel 20g, derde lid][ref2], bedoelde verboden
      een bestuurlijke boete opleggen die overeenkomt met ten hoogste een boete van de vijfde categorie, bedoeld in
