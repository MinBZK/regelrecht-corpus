  - number: 179a.3
    text: Voor de toepassing van het tweede lid wordt een strafbeschikking met een veroordeling gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel179a
  - number: '180.1'
    text: |-
      Voor wat betreft de bijkomende straf van ontzegging van de bevoegdheid tot het besturen van motorrijtuigen
      is [artikel 6:1:16, derde lid, van het Wetboek van Strafvordering][ref1] op rechterlijke uitspraken niet van
      toepassing. Een strafbeschikking houdende deze bijkomende straf is in zoverre eerst voor tenuitvoerlegging vatbaar
      als geen verzet meer kan worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '180.2'
    text: |-
      De rechterlijke uitspraak of strafbeschikking is voor wat betreft de bijkomende straf niet voor tenuitvoerlegging
      vatbaar, zolang de termijn waarvoor de veroordeelde bij een andere rechterlijke uitspraak of strafbeschikking de
      bevoegdheid tot het besturen van motorrijtuigen is ontzegd, nog niet is verstreken.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel180
  - number: '180.3'
    text: |-
      Indien de rechterlijke uitspraak of strafbeschikking voor wat betreft de bijkomende straf voor tenuitvoerlegging
      vatbaar is geworden, geschiedt de tenuitvoerlegging niet dan nadat aan de veroordeelde in persoon een schrijven
      is uitgereikt, volgens de [artikelen 36d][ref1] en [36e van het Wetboek van Strafvordering][ref2], waarin het
      tijdstip van ingang en de duur van de ontzegging, de verplichting tot inlevering van het rijbewijs uiterlijk op dat
      tijdstip, alsmede het gevolg van niet tijdige inlevering worden medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel36d
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel36e
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 36d
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 36e
  - number: '180.4'
    text: |-
      De houder van een rijbewijs is, tenzij het is ingevorderd en niet is teruggegeven, verplicht dat rijbewijs in te
      leveren op de plaats genoemd in het schrijven, bedoeld in het derde lid, uiterlijk op het tijdstip van ingang van
      de ontzegging.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel180
  - number: '180.5'
    text: |-
      Teruggave vindt plaats zodra de termijn van de ontzegging is verstreken. Geen teruggave vindt plaats ten aanzien
      van het rijbewijs of de rijbewijzen waarvan ingevolge een der [artikelen 130, tweede lid][ref1], of [164][ref2] de
      overgifte is gevorderd, waarvan ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref3]
      de inlevering is gevorderd of ten aanzien waarvan ingevolge een der [artikelen 120, derde lid][ref4],
      [124, vierde lid][ref5], [131, tweede lid, onderdeel b][ref6], [132, vijfde lid][ref7], [134, vierde lid][ref8],
      of [180, vierde lid][ref9], een verplichting tot inlevering bestaat. Degene bij wie het rijbewijs is ingeleverd
      geleidt in deze gevallen het rijbewijs of de rijbewijzen door naar degene bij wie de houder dat rijbewijs of die
      rijbewijzen had dienen in te leveren. Indien het rijbewijs op grond van [artikel 123b][ref10] ongeldig is dan wel
      indien een aantekening is geplaatst als bedoeld in dat artikel, geleidt degene bij wie het rijbewijs is ingeleverd
      het rijbewijs of de rijbewijzen door naar de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel164
      [ref3]: https://wetten.overheid.nl/BWBR0004581
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel120
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel124
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref7]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref8]: https://wetten.overheid.nl/BWBR0006622#Artikel134
      [ref9]: https://wetten.overheid.nl/BWBR0006622#Artikel180
      [ref10]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel180
