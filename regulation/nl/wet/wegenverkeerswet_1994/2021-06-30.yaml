  - number: 66a.1
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor
      deze gerechtigd is de tenaamstelling van motorrijtuigen en aanhangwagens ten behoeve van een derde in het
      kentekenregister te beëindigen indien het motorrijtuig of de aanhangwagen door die derde wordt geëxporteerd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel66a
  - number: 66a.2
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gesteld die aan een erkenning worden verbonden en kunnen met
      betrekking tot die voorschriften regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel66a
  - number: 66b.1
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door deze dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend aan de natuurlijke persoon of rechtspersoon,
      die voldoet aan de bij ministeriële regeling gestelde eisen. Deze eisen betreffen onder meer de administratieve
      organisatie van de natuurlijke persoon of rechtspersoon alsmede de wijze waarop deze er voor zorgdraagt dat de aan
      de vervallenverklaring van de tenaamstelling wegens export verbonden procedures in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel66b
  - number: 66b.2
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel66b
  - number: 66b.3
    text: Bij ministeriële regeling worden regels gesteld ter uitvoering van het krachtens het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel66b
  - number: 66b.4
    text: |-
      De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning op grond van
      [artikel 66d][ref1], juncto [artikel 65, tweede lid][ref2], is ingetrokken binnen een direct aan de datum van
      indiening van de aanvraag voorafgaande periode van twaalf weken, dan wel van zes maanden ingeval reeds twee of meer
      malen een dergelijke aan de aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel66d
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel65
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel66b
