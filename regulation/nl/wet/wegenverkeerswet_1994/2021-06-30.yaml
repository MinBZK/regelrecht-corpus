        hoofdstuk: XI
  - number: '161.2'
    text: |-
      De in [artikel 159, onderdeel a][ref1], bedoelde personen die bij de uitoefening van de bij of krachtens deze
      wet aan hen verleende bevoegdheden de beschikking krijgen over een rijbewijs dat zijn geldigheid heeft verloren
      ingevolge [artikel 123, eerste lid, aanhef en onderdeel d][ref2], zijn bevoegd dat rijbewijs in te nemen en door te
      geleiden naar de instantie die het heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel123
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '123'
        hoofdstuk: VI
        afdeling: '7'
  - number: '161.3'
    text: |-
      Voor de toepassing van het eerste en het tweede lid wordt onder een rijbewijs mede verstaan een rijbewijs,
      afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in
      Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel161
  - number: '161.4'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld ter uitvoering van het eerste, tweede en derde
      lid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel161
  - number: '162.1'
    text: |-
      Een van de in [artikel 159, onderdeel a][ref1], bedoelde personen kan de bestuurder van een voertuig van
      wie, uit het in [artikel 160, vijfde lid][ref2], bedoelde onderzoek of op andere wijze, naar het oordeel
      van die persoon gebleken is dat hij onder zodanige invloed van het gebruik van een stof als bedoeld in
      [artikel 8, eerste lid][ref3], verkeert, dat hij onvoldoende in staat is een voertuig behoorlijk te besturen,
      een rijverbod opleggen voor de tijd gedurende welke redelijkerwijs verwacht mag worden dat deze toestand zal
      voortduren tot ten hoogste vierentwintig uren. De vorige volzin is van overeenkomstige toepassing op degene die
      aanstalten maakt een voertuig te gaan besturen. Indien de betrokken bestuurder of degene die aanstalten maakt om
      een voertuig te gaan besturen tevens is geregistreerd als begeleider, dan geldt het opgelegde rijverbod tevens
      als begeleidingsverbod.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel160
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '160'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '162.2'
    text: |-
      De opsporingsambtenaar die een rijverbod oplegt, legt dit vast in een beschikking die het tijdstip van ingang en de
      duur van het verbod bevat.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel162
  - number: '162.3'
    text: |-
      Het is degene aan wie een rijverbod als bedoeld in het eerste lid is opgelegd, verboden een voertuig te besturen of
      als bestuurder te doen besturen gedurende de tijd waarvoor dat rijverbod geldt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel162
  - number: '162.4'
    text: |-
      Het eerste tot en met derde lid is van overeenkomstige toepassing op de begeleider, met dien verstande dat
      de begeleider zowel een rijverbod wordt opgelegd als een verbod tot begeleiden voor de tijd gedurende welke
      redelijkerwijs mag worden verwacht dat de in het eerste lid bedoelde toestand zal voortduren tot ten hoogste
      vierentwintig uren.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel162
  - number: '163.1'
    text: |-
      Bij verdenking dat de bestuurder van een voertuig heeft gehandeld in strijd met [artikel 8][ref1], kan de
      opsporingsambtenaar hem bevelen zijn medewerking te verlenen aan een onderzoek als bedoeld in artikel 8, tweede
      lid, onderdeel a, en artikel 8, derde lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '163.2'
    text: |-
      De bestuurder aan wie het in het eerste lid bedoelde bevel is gegeven, is verplicht ademlucht te blazen in een
      voor het onderzoek bestemd apparaat en gevolg te geven aan alle door de opsporingsambtenaar ten dienste van het
      onderzoek gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel163
  - number: '163.3'
    text: |-
      De in het tweede lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat het verlenen
      van medewerking aan een ademonderzoek voor hem om bijzondere geneeskundige redenen onwenselijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel163
  - number: '163.4'
    text: |-
      In het geval, bedoeld in het derde lid, of indien de medewerking van de verdachte niet heeft geleid tot een
      voltooid ademonderzoek, of indien het vermoeden bestaat dat de verdachte onder invloed is van een of meer middelen,
      bedoeld in [artikel 8, eerste of vijfde lid][ref1], of een combinatie van die middelen met alcohol, kan de
      opsporingsambtenaar de verdachte vragen of hij zijn toestemming geeft tot het verrichten van een onderzoek als
      bedoeld in artikel 8, tweede lid, onderdeel b, of artikel 8, derde lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '163.5'
    text: |-
      Indien de bestuurder zijn op grond van het vierde lid gevraagde toestemming niet verleent, kan de officier van
      justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Veiligheid en
      Justitie aangewezen ambtenaren van politie, aangesteld voor de uitvoering van de politietaak, hem bevelen zich te
      onderwerpen aan een bloedonderzoek.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel163
  - number: '163.6'
    text: |-
      De bestuurder wie is bevolen zich aan een bloedonderzoek te onderwerpen, is verplicht aan dit bevel gevolg te geven
      en zijn medewerking te verlenen. Hem wordt door een arts of een verpleegkundige zoveel bloed afgenomen als voor het
      onderzoek noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel163
  - number: '163.7'
    text: |-
      Indien de verdachte niet in staat is zijn wil kenbaar te maken, kan hem met toestemming van de officier van
      justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Veiligheid en
      Justitie aangewezen ambtenaren van politie, aangesteld voor de uitvoering van de politietaak, door een arts of
      een verpleegkundige de in het zesde lid bedoelde hoeveelheid bloed worden afgenomen, tenzij aannemelijk is dat
      dit bij hem om bijzondere geneeskundige redenen onwenselijk is. Een onderzoek van het bloed vindt niet plaats dan
      nadat de verdachte in de gelegenheid is gesteld zijn toestemming daartoe te geven. Zo nodig kan hem overeenkomstig
      het vijfde lid worden bevolen zijn medewerking te verlenen. De verdachte aan wie een zodanig bevel is gegeven,
      is verplicht zijn medewerking te verlenen. Indien de verdachte weigert zijn medewerking te verlenen, wordt het
      bloedmonster vernietigd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel163
  - number: '163.8'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de wijze van uitvoering van
      [artikel 160, vijfde lid][ref1], en van dit artikel. Deze regels kunnen mede betrekking hebben op de mogelijkheid
      tot het doen verrichten van een tegenonderzoek. Bij regeling van Onze Minister van Veiligheid en Justitie worden
      in de bij die algemene maatregel van bestuur aangegeven gevallen voorschriften ter uitvoering van die regels
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel160
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '160'
        hoofdstuk: IX
  - number: '163.9'
    text: Het eerste tot en met achtste lid is van overeenkomstige toepassing op de begeleider.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel163
  - number: '164.1'
    text: |-
      Op de eerste vordering van de in [artikel 159, onderdelen a en b][ref1], bedoelde personen is de bestuurder van een
      motorrijtuig, tegen wie door een van die personen proces-verbaal wordt opgemaakt ter zake van overtreding van een
      bij of krachtens deze wet vastgesteld voorschrift, verplicht tot overgifte van het hem afgegeven rijbewijs dan wel
      het hem door het daartoe bevoegde gezag buiten Nederland afgegeven rijbewijs en, indien hem daar een internationaal
      rijbewijs is afgegeven, dat bewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '164.2'
    text: 'De in het eerste lid bedoelde vordering wordt gedaan in geval van overtreding van:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel164
  - number: 164.2.a
    text: |-
      [artikel 8][ref1], indien bij een onderzoek als bedoeld in het tweede lid, van die bepaling blijkt of, bij
      ontbreken van een dergelijk onderzoek, een ernstig vermoeden bestaat dat het alcoholgehalte van de adem van de
      bestuurder hoger is dan 570 microgram alcohol per liter uitgeademde lucht, onderscheidenlijk het alcoholgehalte van
      het bloed van de bestuurder hoger blijkt te zijn dan 1,3 milligram alcohol per milliliter bloed;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: 164.2.b
    text: |-
      [artikel 8][ref1], indien bij een onderzoek als bedoeld in het derde of vierde lid, aanhef en onderdeel b, juncto
      het derde lid, van die bepaling blijkt of, bij het ontbreken van een dergelijk onderzoek, een ernstig vermoeden
      bestaat dat het alcoholgehalte van de adem van de bestuurder hoger is dan 350 microgram alcohol per liter
      uitgeademde lucht, onderscheidenlijk het alcoholgehalte van het bloed van de bestuurder hoger blijkt te zijn dan
      0,8 milligram alcohol per milliliter bloed;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: 164.2.c
    text: |-
      [artikel 163, tweede, zesde of zevende lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel163
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel164
    references:
