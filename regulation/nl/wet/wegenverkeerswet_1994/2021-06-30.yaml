  - number: '67.1'
    text: |-
      Indien met een voertuig geen gebruik van de weg wordt gemaakt, schorst de Dienst Wegverkeer op aanvraag van de
      eigenaar of houder van dat voertuig, tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief, de tenaamstelling in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel67
  - number: '67.2'
    text: |-
      De hoogte van het in het eerste lid bedoelde tarief kan voor verschillende groepen voertuigen dan wel eigenaren of
      houders van voertuigen verschillend worden vastgesteld. Voor aanvragen die worden ingediend binnen een jaar na de
      aanvraag van een schorsing welke ingevolge [artikel 68, eerste lid, onderdelen a en d][ref1], is geëindigd, kan het
      tarief hoger worden vastgesteld dan het tarief voor laatstgenoemde aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel68
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '68'
        hoofdstuk: IV
        paragraaf: '6'
  - number: '67.3'
    text: |-
      De aanvraag van een schorsing dient te geschieden overeenkomstig bij algemene maatregel van bestuur vastgestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel67
  - number: '67.4'
    text: Bij ministeriële regeling worden nadere regels vastgesteld omtrent het krachtens het derde lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel67
  - number: '67.5'
    text: |-
      De Dienst Wegverkeer plaatst bij het verlenen van de schorsing overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels in het kentekenregister een aantekening waaruit blijkt dat schorsing is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel67
  - number: '68.1'
    text: 'De schorsing eindigt:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel68
  - number: 68.1.a
    text: |-
      door opheffing als bedoeld in [artikel 69][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel69
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '69'
        hoofdstuk: IV
        paragraaf: '6'
  - number: 68.1.b
    text: |-
      door verloop van een bij ministeriële regeling bepaalde termijn vanaf het tijdstip waarop de schorsing is verleend,
      welke termijn per bij ministeriële regeling aan te wijzen categorieën van voertuigen kan verschillen,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel68
  - number: 68.1.c
    text: door het verval van de tenaamstelling in het kentekenregister, of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel68
  - number: 68.1.d
    text: zodra met het voertuig gebruik van de weg wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel68
  - number: '68.2'
    text: |-
      Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat in bepaalde
      uitzonderingsgevallen tijdelijk kan worden afgeweken van het eerste lid, aanhef en onderdeel *d*.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel68
  - number: '69.1'
    text: De schorsing wordt op aanvraag van de eigenaar of houder door de Dienst Wegverkeer opgeheven.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel69
  - number: '69.2'
    text: |-
      De aanvraag van opheffing van de schorsing dient te geschieden overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel69
  - number: '69.3'
    text: Bij ministeriële regeling worden nadere regels vastgesteld omtrent het krachtens het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel69
  - number: 70a.1
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is een of meer van de in [artikel 40, tweede lid][ref1], bedoelde bij de erkenning aangewezen merken aan
      te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 70a.2
    text: Het is verboden om zonder de in het eerste lid bedoelde erkenning de aldaar bedoelde merken aan te brengen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70a
  - number: 70a.3
    text: |-
      Bij ministeriële regeling worden voorschriften vastgesteld die aan de erkenning worden verbonden en worden met
      betrekking tot die voorschriften regels vastgesteld. Die regels hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70a
  - number: 70a.3.a
    text: de fabricage en levering van kentekenplaten en onderdelen daarvan en de daarbij te volgen procedure;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70a
  - number: 70a.3.b
    text: |-
      de registratie van gegevens met betrekking tot de ingekochte materialen, de productie, de af- en uitval, de
      voorraad en de aflevering van kentekenplaten en onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70a
  - number: 70b.1
    text: |-
      De fabrikant van kentekenplaten is in geval van levering van kentekenplaten verplicht tot het vastleggen van
      gegevens omtrent: van:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70b
  - number: 70b.1.a
    text: het betrokken kenteken;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70b
  - number: 70b.1.b
    text: |-
      de aard en het nummer van het identiteitsdocument van degene door, respectievelijk namens wie de kentekenplaten
      worden aangevraagd, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70b
  - number: 70b.1.c
    text: het aantal afgegeven kentekenplaten.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70b
  - number: 70b.2
    text: |-
      Indien de kentekenplaten worden aangevraagd namens een rechtspersoon of door een daartoe bij ministeriële regeling
      aangewezen erkend bedrijf als bedoeld in [artikel 62][ref1], worden in plaats van de gegevens, bedoeld in het
      eerste lid, onder b, vastgelegd de bij ministeriële regeling aangewezen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 70b.3
    text: |-
      Indien bij de levering van kentekenplaten die door, respectievelijk namens een natuurlijk persoon zijn aangevraagd,
      een ander identiteitsdocument dan een rijbewijs of paspoort wordt overgelegd, wordt tevens vastgelegd de
      naam, de beginletters van de voornaam of voornamen en het adres van degene door, respectievelijk namens wie de
      kentekenplaten worden aangevraagd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70b
  - number: 70b.4
    text: |-
      De fabrikant verstrekt gegevens die zijn vastgelegd op grond van het eerste tot en met derde lid in een
      registratie, uitsluitend en desgevraagd aan de ambtenaren van de Dienst Wegverkeer, belast met het toezicht op
      de naleving van de uit de erkenning voortvloeiende verplichtingen, en aan de ambtenaren van politie belast met de
      handhaving van de uit de erkenning voortvloeiende verplichtingen en van de verboden, bedoeld in [artikel 41][ref1],
      voor zover deze gegevens noodzakelijk zijn voor de goede vervulling van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel41
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 70b.5
    text: De vastgelegde gegevens worden gedurende één jaar na de vastlegging bewaard.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70b
  - number: 70b.6
    text: Bij ministeriële regeling worden nadere regels vastgesteld omtrent de inrichting en het beheer van het register.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70b
  - number: 70c.1
    text: |-
      Na afloop van de termijn, bedoeld in [artikel 70b, vijfde lid][ref1], worden de daar bedoelde vastgelegde gegevens
      overgedragen aan de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70b
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70c.2
    text: |-
      Uit de registratie worden door de Dienst Wegverkeer uitsluitend en desgevraagd aan de ambtenaren van politie
      belast met de handhaving van de uit de erkenning voortvloeiende verplichtingen en van de verboden, bedoeld in
      [artikel 41][ref1], gegevens verstrekt voor zover deze noodzakelijk zijn voor de goede vervulling van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel41
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 70c.3
    text: |-
      De vastgelegde gegevens worden door de Dienst Wegverkeer maximaal vijf jaar na de overdracht, bedoeld in het eerste
      lid, bewaard.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70c
  - number: 70c.4
    text: |-
      De Dienst Wegverkeer stelt ten aanzien van het verwerken van de persoonsgegevens als bedoeld in het eerste lid, een
      reglement vast.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70c
  - number: 70d.1
    text: |-
      De erkenning wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief verleend indien de natuurlijke persoon of rechtspersoon voldoet aan
      de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de administratieve organisatie van
      de natuurlijke persoon of rechtspersoon alsmede de wijze waarop deze ervoor zorg draagt dat de aan het aanbrengen
      van de merken verbonden procedures in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70d
  - number: 70d.2
    text: Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70d
  - number: 70d.3
    text: |-
      De erkenning wordt in ieder geval geweigerd indien een reeds aan de aanvrager verleende erkenning op grond van
      [artikel 70f, tweede lid][ref1], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel van zes maanden ingeval reeds twee of meer malen een dergelijke aan
      de aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70f
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70f
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70e.1
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de Staatscourant. Het toezicht omvat in ieder geval het periodiek controleren van de organisatie van degene aan wie
      de erkenning is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70e
  - number: 70e.2
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70e
  - number: 70e.3
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld betreffende de wijze waarop het toezicht wordt gehouden
      en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend. Deze regels kunnen
      inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit
      de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70e
  - number: 70f.1
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie die erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70f
  - number: 70f.2
    text: |-
      De Dienst Wegverkeer kan een erkenning intrekken of wijzigen dan wel de daaraan verbonden voorschriften wijzigen
      indien degene aan wie de erkenning is verleend:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70f
  - number: 70f.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70f
  - number: 70f.2.b
    text: |-
      een verplichting als bedoeld in [artikel 70e][ref1] niet nakomt, of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70e
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70e
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70f.2.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70f
  - number: 70f.3
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70f
  - number: 70g
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 70a][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70a
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70h
    text: |-
      Bij de verkrijging van een kentekenplaat worden de bij ministeriële regeling aangewezen identiteitsdocumenten en
      overige documenten overgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70h
  - number: 70i.1
    text: 'De eigenaar of houder van een motorrijtuig of aanhangwagen is verplicht in geval van:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70i
  - number: 70i.1.a
    text: |-
      overdracht van dat motorrijtuig of die aanhangwagen aan een erkend bedrijf als bedoeld in [artikel 62][ref1]
      ten behoeve van uitvoer naar het buitenland of voorgoed buitengebruikstelling, tot inlevering van de betrokken
      kentekenplaten bij dat bedrijf tegelijk met de overdracht;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 70i.1.b
    text: |-
      beëindiging van de tenaamstelling van dat motorrijtuig of die aanhangwagen door een erkend bedrijf als bedoeld in
      [artikel 66a][ref1] ten behoeve van uitvoer naar het buitenland, tot inlevering van de betrokken kentekenplaten bij
      dat bedrijf tegelijk met de beëindiging van de tenaamstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel66a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 66a
        hoofdstuk: IV
        paragraaf: 5a
  - number: 70i.2
    text: |-
      In geval van uitvoer naar het buitenland anders dan door een erkend bedrijf als bedoeld in [artikel 62][ref1] of
      [artikel 66a][ref2], is de eigenaar of houder van het motorrijtuig of de aanhangwagen verplicht tot inlevering van
      de betrokken kentekenplaten bij de Dienst Wegverkeer tegelijk met de uitvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel66a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 66a
        hoofdstuk: IV
        paragraaf: 5a
  - number: 70i.3
    text: |-
      Indien het kentekenbewijs zijn geldigheid heeft verloren, anders dan in geval van het eerste of het tweede lid, kan
      de Dienst Wegverkeer verlangen dat de betrokken kentekenplaten binnen een bepaalde termijn bij deze dienst worden
      ingeleverd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70i
  - number: 70j.1
    text: |-
      Indien de betrokken kentekenplaten overeenkomstig [artikel 70i][ref1] worden ingeleverd bij de Dienst Wegverkeer
      onderscheidenlijk een erkend bedrijf als bedoeld in [artikel 62][ref2] of [artikel 66a][ref3] is deze dienst,
      onderscheidenlijk dit bedrijf verplicht tot het vastleggen van gegevens omtrent van:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70i
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel66a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70j
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70i
        hoofdstuk: IV
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 66a
        hoofdstuk: IV
        paragraaf: 5a
  - number: 70j.1.a
    text: het betrokken kenteken, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70j
  - number: 70j.1.b
    text: het aantal ingeleverde kentekenplaten.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70j
  - number: 70j.2
    text: |-
      De Dienst Wegverkeer, onderscheidenlijk het erkende bedrijf, is voorts, overeenkomstig bij ministeriële regeling
      vast te stellen regels, verplicht tot vernietiging van de ingeleverde kentekenplaten en tot registratie van de
      vernietiging.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70j
  - number: 70k.1
    text: De Dienst Wegverkeer houdt een register van fietsen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70k
  - number: 70k.2
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de inhoud van het register alsmede de verwerking, het
      gebruik en de verstrekking van de gegevens daaruit.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70k
  - number: 70k.3
    text: |-
      Het verzamelen van gegevens ten behoeve van het in het eerste lid bedoelde register geschiedt ter voorkoming van
      diefstal en heling van fietsen, alsmede ten behoeve van de opsporing van gestolen fietsen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70k
  - number: 70k.4
    text: |-
      Registratie van gegevens in het register geschiedt op de door de Dienst Wegverkeer te bepalen wijze. In door de
      Dienst Wegverkeer te bepalen gevallen kan een door deze dienst te bepalen aansluittarief verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70k
  - number: 70k.5
    text: |-
      In door de Dienst Wegverkeer te bepalen gevallen geschiedt de registratie van gegevens in, dan wel verstrekking van
      gegevens uit het register tegen betaling van een door deze dienst te bepalen tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70k
  - number: 70l.1
    text: |-
      De Dienst Wegverkeer houdt een register van bij ministeriële regeling aan te wijzen categorieën van mobiele
      objecten anders dan fietsen waarvoor op grond van deze wet geen kenteken is opgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70l
  - number: 70l.2
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de inhoud van het register alsmede de verwerking, het
      gebruik en de verstrekking van de gegevens daaruit.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70l
  - number: 70l.3
    text: |-
      Het verzamelen van gegevens ten behoeve van het in het eerste lid bedoelde register geschiedt ter voorkoming van
      diefstal en heling van mobiele objecten, ten behoeve van de opsporing van gestolen mobiele objecten, alsmede ten
      behoeve van andere, bij ministeriële regeling te bepalen doeleinden, met inachtneming van [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: 70l.4
    text: |-
      Het [vierde en vijfde lid van artikel 70k][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70k
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70k
        hoofdstuk: IVA
  - number: 70m
    text: |-
      Het is eenieder verboden om de tellerstand van bij algemene maatregel van bestuur vastgestelde categorieën
      motorrijtuigen die dienen te zijn ingeschreven en tenaamgesteld zodanig te wijzigen of te doen wijzigen of de
      werking van de kilometerteller zodanig te beïnvloeden of te doen beïnvloeden dat de op de teller aangegeven afstand
      niet overeenkomt met de door dat motorrijtuig werkelijk afgelegde afstand.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70m
  - number: 70n.1
    text: |-
      Door de Dienst Wegverkeer erkende bedrijven verstrekken in bij algemene maatregel van bestuur te bepalen gevallen
      aan de Dienst Wegverkeer de tellerstand van een motorrijtuig dat dient te zijn ingeschreven en tenaamgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70n
  - number: 70n.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop de tellerstand wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel70n
  - number: '71.1'
    text: 'Bij ministeriële regeling worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel71
  - number: 71.1.a
    text: |-
      de eisen waaraan voertuigen moeten voldoen waarmee over de weg wordt gereden, waarbij onderscheid kan worden
      gemaakt tussen verschillende wegen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel71
  - number: 71.1.b
    text: de inrichting van voertuigen die op de weg staan;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel71
  - number: 71.1.c
    text: de eisen waaraan voertuigen moeten voldoen voor de afgifte van een keuringsbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel71
  - number: 71.1.d
    text: |-
      de eisen waaraan ter uitvoering van verdragen of van besluiten van volkenrechtelijke organisaties of van één
      of meer instellingen van de Europese Unie, al dan niet gezamenlijk, moet worden voldaan met betrekking tot het
      uitvoeren van onderhoud aan voertuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel71
  - number: '71.2'
    text: |-
      Onverminderd het eerste lid voldoen voertuigen waarmee over de weg wordt gereden, aan de eisen voor goedkeuring
      als bedoeld in [artikel 21][ref1] en aan het gebruik verbonden eisen in de bij ministeriële regeling aangeduide
      artikelen van een EU-harmonisatieverordening in verband met de goedkeuring van motorvoertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: 71a
    text: 'Bij ministeriële regeling kan worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel71a
  - number: 71a.a
    text: |-
      het voldoen aan de in [artikel 71][ref1] bedoelde voorschriften wordt aangetoond door middel van in die regels
      voorgeschreven apparatuur,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
  - number: 71a.b
    text: die apparatuur is goedgekeurd door een door Onze Minister aangewezen keuringsinstelling,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel71a
  - number: 71a.c
    text: |-
      die apparatuur alleen kan worden goedgekeurd indien de in die regels genoemde technische specificaties van die
      apparatuur die noodzakelijk zijn om het periodiek onderzoek, bedoeld in onderdeel d, uit te kunnen voeren, op de in
      die regels aangegeven wijze bekend worden gemaakt,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel71a
  - number: 71a.d
    text: |-
      die apparatuur met een in die regels vast te stellen periodiciteit is onderzocht door deze keuringsinstelling,
      dan wel door een door Onze Minister of door deze keuringsinstelling erkende onderzoeksgerechtigde en dat middelen
      die worden gebruikt om die apparatuur voor gebruik geschikt te maken, zijn gecertificeerd door een door die
      keuringsinstelling erkende instelling, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel71a
  - number: 71a.e
    text: |-
      bij de erkenning van een onderzoeksgerechtigde of instelling als bedoeld in onderdeel d, wordt voldaan aan de in
      die regels opgenomen voorschriften.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel71a
  - number: '72.1'
    text: |-
      Voor een motorrijtuig of een aanhangwagen, waarvoor een kenteken is opgegeven dan wel dient te zijn opgegeven,
      dient een keuringsbewijs te zijn afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel72
  - number: '72.2'
    text: 'Het keuringsbewijs dient:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel72
  - number: 72.2.a
    text: te voldoen aan de door de Dienst Wegverkeer vastgestelde eisen inzake inrichting en uitvoering,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel72
  - number: 72.2.b
    text: zijn geldigheid niet te hebben verloren, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel72
  - number: 72.2.c
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel72
  - number: '72.3'
    text: 'Voor overtreding van het eerste lid en het bepaalde bij of krachtens het tweede lid zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel72
  - number: 72.3.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder, alsmede in het geval dat met dat motorrijtuig over
      de weg wordt gereden, de bestuurder, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel72
  - number: 72.3.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder, alsmede in het geval dat de aanhangwagen met een
      motorrijtuig over de weg wordt voortbewogen, de bestuurder van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel72
  - number: '73.1'
    text: |-
      [Artikel 72][ref1] geldt niet indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.1.a
    text: |-
      voor het motorrijtuig of de aanhangwagen ter zake van een keuring die ingevolge een andere dan deze wet is
      voorgeschreven en blijkens aanwijzing bij ministeriële regeling ten minste een controle inhoudt op de eisen,
      bedoeld in [artikel 75, eerste lid][ref1], een keuringsdocument waarvan de geldigheidsduur niet is verstreken, is
      afgegeven, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: 73.1.b
    text: |-
      de geldigheid van het voor het betrokken voertuig afgegeven kentekenbewijs is geschorst overeenkomstig
      [paragraaf 6 van hoofdstuk IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: IV
        paragraaf: '6'
  - number: '73.2'
    text: 'Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel73
  - number: 73.2.a
    text: |-
      [artikel 72][ref1] niet geldt voor motorrijtuigen en aanhangwagens zolang gerekend vanaf het tijdstip waarop deze
      voertuigen voor het eerst op de weg zijn toegelaten, nog geen bij algemene maatregel van bestuur te bepalen termijn
      is verstreken, die voor verschillende groepen van voertuigen, alsmede voor voertuigen die voor, onderscheidenlijk
      na een bij algemene maatregel van bestuur te bepalen tijdstip voor het eerst op de weg zijn toegelaten verschillend
      kan worden vastgesteld; bij algemene maatregel van bestuur kan nader worden bepaald op welk tijdstip een voertuig
      geacht wordt voor het eerst op de weg te zijn toegelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.2.b
    text: |-
      [artikel 72][ref1] niet geldt voor nader aangewezen groepen van motorrijtuigen of aanhangwagens. Hieronder vallen
      in ieder geval aanhangwagens met een toegestane maximum massa van niet meer dan 3500 kg;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.2.c
    text: |-
      in bepaalde uitzonderingsgevallen tijdelijk wordt of kan worden afgeweken van [artikel 72][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.2.d
    text: |-
      [artikel 72][ref1] gedurende een nader te bepalen termijn na het tijdstip van verstrijken van de geldigheidsduur
      van het voor het voertuig afgegeven keuringsbewijs niet geldt voor het op de weg staan van dat voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: '73.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot het tweede lid, onderdelen *b*
      en *c*.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel73
  - number: '74'
    text: |-
      Het is verboden ten opzichte van een motorrijtuig of een aanhangwagen opzettelijk gebruik te maken van een
      keuringsbewijs dat niet voor dat voertuig is afgegeven, als ware het voor dat voertuig afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel74
  - number: '75.1'
    text: |-
      Een keuringsbewijs wordt door degene die ingevolge [artikel 78][ref1] met de afgifte van keuringsrapporten
      is belast, afgegeven op aanvraag en tegen betaling op de door deze vastgestelde wijze van het door deze
      vastgestelde tarief indien het motorrijtuig of de aanhangwagen heeft voldaan aan de eisen die ingevolge
      [artikel 71, onderdeel c][ref2], aan dat voertuig worden gesteld, voorzover deze eisen niet ingevolge het
      tweede lid buiten toepassing blijven. Het hiervoor bedoelde tarief omvat mede een door de Dienst Wegverkeer
      vastgesteld bedrag ter zake van het attenderen door deze dienst op de in [artikel 72][ref3] opgenomen
      verplichting. Indien degene die met de afgifte van keuringsrapporten is belast een persoon is als bedoeld in
      [artikel 78, eerste lid, onder b][ref4], draagt deze dit bedrag af aan de Dienst Wegverkeer op de door deze dienst
      vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: '75.2'
    text: |-
      Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat voor nader
      aangewezen groepen van motorrijtuigen - zolang gerekend vanaf het tijdstip waarop deze voertuigen voor het
      eerst op de weg zijn toegelaten, nog geen bij algemene maatregel van bestuur vast te stellen termijn die ten
      hoogste drie jaren bedraagt, is verstreken - ten behoeve van de afgifte van een keuringsbewijs slechts behoeft
      te worden voldaan aan de ingevolge [artikel 71][ref1] gestelde eisen die betrekking hebben op het bestrijden van
      luchtverontreiniging. Bij algemene maatregel van bestuur kan nader worden bepaald op welk tijdstip een voertuig
      geacht wordt voor het eerst op de weg te zijn toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
  - number: '75.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot de in het tweede lid bedoelde
      voorwaarden en groepen van motorrijtuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel75
  - number: '76.1'
    text: |-
      Bij de aanvraag van een keuringsrapport dient de aanvrager de bij algemene maatregel van bestuur vastgestelde
      bescheiden over te leggen en inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel76
  - number: '76.2'
    text: |-
      De aanvrager dient het motorrijtuig of de aanhangwagen waarvoor de afgifte van een keuringsrapport wordt verlangd,
      overeenkomstig bij algemene maatregel van bestuur vast te stellen regels ten behoeve van de afgifte van dat bewijs
      ter beschikking te stellen van degene die ingevolge [artikel 78][ref1] met de afgifte van keuringsrapporten is
      belast.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: '76.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld omtrent de wijze waarop wordt onderzocht of een
      voertuig voldoet aan de in [artikel 75][ref1] bedoelde eisen, alsmede omtrent hetgeen verder met betrekking tot de
      behandeling van de aanvraag van een keuringsrapport noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: '77'
    text: |-
      Het voor afgifte van een keuringsrapport aangeboden voertuig dient overeen te stemmen met de in het daarbij
      behorende kentekenbewijs en de in het kentekenregister vermelde gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel77
  - number: '78.1'
    text: 'Keuringsrapporten worden overeenkomstig bij algemene maatregel van bestuur vastgestelde regels afgegeven door:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel78
  - number: 78.1.a
    text: |-
      de Dienst Wegverkeer in het kader van een door deze dienst verrichte keuring van het voertuig waarvoor de afgifte
      wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel78
  - number: 78.1.b
    text: |-
      een ingevolge [artikel 84][ref1] erkende natuurlijke persoon of rechtspersoon in het kader van een door deze
      verrichte keuring van het voertuig waarvoor de afgifte wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel84
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '84'
        hoofdstuk: V
        paragraaf: '5'
  - number: '78.2'
    text: |-
      De Dienst Wegverkeer draagt er zorg voor dat indien in onvoldoende mate keuringsrapporten kunnen worden afgegeven
      door andere natuurlijke personen of rechtspersonen als bedoeld in het eerste lid, onderdeel b, dan die zich
      bezighouden met het verrichten van onderhoud of reparaties aan motorrijtuigen of aanhangwagens, de Dienst
      Wegverkeer kan voorzien in zodanige afgifte.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel78
  - number: '78.3'
    text: |-
      De Dienst Wegverkeer geeft geen keuringsrapporten af voor zover in voldoende mate keuringsrapporten kunnen worden
      afgegeven door natuurlijke personen of rechtspersonen als bedoeld in het eerste lid, onderdeel b, die zich niet
      bezighouden met het verrichten van onderhoud of reparaties aan motorrijtuigen of aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel78
  - number: '79'
    text: |-
      Degene die ingevolge [artikel 78][ref1] met de afgifte van keuringsbewijzen is belast, doet van het voornemen
      tot de afgifte van zodanig bewijs op de bij ministeriële regeling te bepalen wijze mededeling aan de beheerder
      van het kentekenregister. Van de weigering van de afgifte van een keuringsbewijs wordt mededeling gedaan in bij
      ministeriële regeling vast te stellen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: '80.1'
    text: |-
      De Dienst Wegverkeer of de erkenninghouder geeft voor keuringsbewijzen die versleten of geheel of ten dele
      onleesbaar zijn, dan wel verloren zijn geraakt of teniet zijn gegaan, op aanvraag en tegen betaling, op de door
      deze dienst vastgestelde wijze, van het daarvoor door deze dienst vastgestelde tarief vervangende keuringsbewijzen
      af.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel80
  - number: '80.2'
    text: |-
      Een vervangend keuringsbewijs wordt niet afgegeven dan nadat het versleten of geheel of ten dele onleesbaar
      geworden bewijs is ingeleverd bij de Dienst Wegverkeer of de erkenninghouder.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel80
  - number: '81.1'
    text: |-
      Bij algemene maatregel van bestuur wordt, voorzover nodig onder daarbij te stellen voorwaarden, bepaald op welk
      tijdstip een keuringsbewijs geldigheid verkrijgt en voor welke duur een keuringsbewijs geldig is. Deze duur
      kan voor verschillende groepen van voertuigen, alsmede voor voertuigen die voor, onderscheidenlijk na een bij
      algemene maatregel van bestuur te bepalen tijdstip voor het eerst op de weg zijn toegelaten, verschillend worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel81
  - number: '81.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot de in het eerste lid bedoelde
      voorwaarden en groepen van motorrijtuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel81
  - number: '82'
    text: |-
      Onverminderd de [artikelen 81][ref1], [86, vierde lid][ref2], en [91, vierde lid][ref3], verliest een
      keuringsbewijs zijn geldigheid:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel91
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '81'
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '86'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '91'
        hoofdstuk: V
        paragraaf: '6'
  - number: 82.a
    text: door afgifte van een vervangend keuringsbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel82
  - number: 82.b
    text: door het onbevoegd daarin aanbrengen van wijzigingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel82
  - number: '83.1'
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is keuringsrapporten af te geven voor motorrijtuigen en aanhangwagens, waarvoor [artikel 72][ref1]
      geldt, met uitzondering van bussen als bedoeld in de [Wet personenvervoer 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
  - number: '83.2'
    text: |-
      Een erkenning geldt voor motorrijtuigen en aanhangwagens, die behoren tot een in de erkenning aangewezen groep, en
      kan gelden voor bepaalde of voor onbepaalde tijd. De aanwijzing kan geen betrekking hebben op de leeftijd of het
      merk van motorrijtuigen en aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel83
  - number: '83.3'
    text: |-
      Een erkenning, verleend aan een natuurlijke persoon of rechtspersoon, die een keuringsdienst of een
      onderhoudsdienst voor het eigen wagenpark exploiteert, geldt slechts voor de eigen voertuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel83
  - number: '83.4'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en kunnen
      met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel83
  - number: '84.1'
    text: |-
      De erkenning wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief verleend indien de natuurlijke persoon of rechtspersoon voldoet
      aan de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de voor de keuringen
      benodigde apparatuur en ruimte alsmede de deskundigheid van de voor de keuringen beschikbare personen. Ten
      aanzien van de voor de keuringen benodigde apparatuur kan bij die ministeriële regeling de eis worden gesteld
      dat die apparatuur is goedgekeurd door een door Onze Minister aan te wijzen keuringsinstelling en met de in
      die regeling vast te stellen periodiciteit is onderzocht door deze keuringsinstelling dan wel door een door
      deze keuringsinstelling erkende onderzoeksgerechtigde en kunnen regels worden vastgesteld met betrekking tot de
      erkenning van onderzoeksgerechtigden. Bij ministeriële regeling kan worden bepaald dat middelen die worden gebruikt
      om deze apparatuur voor gebruik geschikt te maken zijn gecertificeerd door een door die keuringsinstelling erkende
      instelling en kunnen regels worden vastgesteld met betrekking tot die erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel84
  - number: '84.2'
    text: Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel84
  - number: '85'
    text: |-
      De erkende natuurlijke personen of rechtspersonen zijn verplicht het door de aanvrager ter keuring aangeboden
      voertuig te keuren, indien zij daartoe gerechtigd zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel85
  - number: 85a.1
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon de bevoegdheid verlenen motorrijtuigen en aanhangwagens,
      waarvoor [artikel 72][ref1] geldt, met uitzondering van bussen als bedoeld in de Wet personenvervoer, aan een
      keuring te onderwerpen. Ten bewijze van deze bevoegdheid verstrekt de Dienst Wegverkeer de betrokken persoon een
      bevoegdheidspas.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 85a.2
    text: |-
      De bevoegdheid voertuigen aan een keuring te onderwerpen geldt voor motorrijtuigen en aanhangwagens die behoren tot
      een in de verlening van de bevoegdheid voertuigen aan een keuring te onderwerpen aangewezen groep, en kan gelden
      voor bepaalde of onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel85a
  - number: 85a.3
    text: |-
      De bevoegdheid voertuigen aan een keuring te onderwerpen wordt verleend indien de natuurlijke persoon beschikt
      over een examencertificaat van een door Onze Minister aangewezen exameninstantie en overigens voldoet aan bij
      ministeriële regeling vastgestelde eisen. Daarbij kan aan de Dienst Wegverkeer de bevoegdheid worden verleend
      voorwaarden vast te stellen ten aanzien van het voldoen aan deze eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel85a
  - number: 85a.4
    text: |-
      Bij ministeriële regeling worden regels vastgesteld met betrekking tot de aanvraag tot het verlenen van de
      bevoegdheid voertuigen aan een keuring te onderwerpen en met betrekking tot de bevoegdheidspas.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel85a
  - number: 85a.5
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan de bevoegdheid voertuigen aan een keuring
      te onderwerpen worden verbonden en kunnen met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel85a
  - number: 85a.6
    text: |-
      [Artikel 17, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] is van overeenkomstige toepassing op
      het vaststellen van het tarief voor het examen dat de natuurlijke persoon dient af te leggen om het in het derde
      lid bedoelde certificaat te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel17
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '17'
  - number: '86.1'
    text: |-
      De Dienst Wegverkeer onderwerpt ten minste drie van elke honderd voertuigen na een verrichte keuring
      steekproefsgewijs aan een herkeuring met het oog op het toezicht op:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel86
  - number: 86.1.a
    text: de juiste uitvoering van de keuring;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel86
  - number: 86.1.b
    text: het aan een keuring onderwerpen door daartoe bevoegde natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel86
  - number: '86.2'
    text: |-
      De eigenaar of houder van een motorrijtuig of een aanhangwagen, waarvoor een herkeuring wordt geëist, is verplicht
      het voertuig op de plaats van de keuring beschikbaar te houden totdat de herkeuring heeft plaatsgevonden. Deze
      verplichting geldt voor een periode van ten hoogste 90 minuten na de in [artikel 79][ref1] bedoelde mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel79
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '79'
        hoofdstuk: V
        paragraaf: '3'
  - number: '86.3'
    text: |-
      Het keuringsrapport van een motorrijtuig of een aanhangwagen waarvoor een herkeuring wordt geëist wordt pas
      afgegeven op het moment dat de periode genoemd in het vorige lid is verstreken of nadat de herkeuring heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel86
  - number: '86.4'
    text: |-
      De geldigheid van het keuringsbewijs vervalt indien de eigenaar of houder niet voldoet aan de in het tweede lid
      bedoelde verplichtingen of indien het motorrijtuig of de aanhangwagen bij de herkeuring niet voldoet aan de eisen,
      bedoeld in [artikel 75, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: '86.5'
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel86
  - number: '86.6'
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel86
  - number: '86.7'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop de steekproef wordt
      uitgevoerd, alsmede betreffende de verplichting tot medewerking daaraan van de eigenaar of houder. Deze regels
      kunnen inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of
      meer uit de erkenning voortvloeiende verplichtingen of in strijd met een of meer uit de bevoegdheid voertuigen aan
      een keuring te onderwerpen voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel86
  - number: 86a.1
    text: |-
      De Dienst Wegverkeer laat met het oog op het toezicht op het verrichten van keuringen, keuringen uitvoeren door het
      ter keuring aanbieden van een voertuig in bij ministeriële regeling vast te stellen gevallen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel86a
  - number: 86a.2
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld betreffende de wijze waarop de keuring wordt uitgevoerd.
      Deze regels kunnen inhouden dat verscherpt toezicht wordt gehouden indien blijkt dat er door een natuurlijke
      persoon die daartoe niet bevoegd is motorrijtuigen en aanhangwagens, waarvoor [artikel 72][ref1] geldt, met
      uitzondering van bussen als bedoeld in de Wet personenvervoer, aan een keuring worden onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel86a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: '87.1'
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie die erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87
  - number: '87.2'
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87
  - number: 87.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87
  - number: 87.2.b
    text: |-
      in strijd met de eisen, bedoeld in [artikel 75, eerste lid][ref1], of de regels, bedoeld in
      [artikel 76, derde lid][ref2], een keuringsbewijs afgeeft voor een motorrijtuig of een aanhangwagen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel76
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '76'
        hoofdstuk: V
        paragraaf: '3'
  - number: 87.2.c
    text: een keuringsrapport afgeeft voor een motorrijtuig of een aanhangwagen, waarvoor de erkenning niet geldt,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87
  - number: 87.2.d
    text: |-
      de verplichting, vervat in [artikel 85][ref1], [86, zesde lid][ref2], [90, vierde lid][ref3], of
      [91, vierde lid][ref4], niet nakomt,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel90
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel91
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '85'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '86'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '90'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '91'
        hoofdstuk: V
        paragraaf: '6'
  - number: 87.2.e
    text: |-
      weigert een keuringsbewijs af te geven voor een motorrijtuig of een aanhangwagen, waarvoor de erkenning
      geldt, hoewel dat voertuig bij een keuring, verricht met inachtneming van de regels, bedoeld in
      [artikel 76, derde lid][ref1], voldoet aan de eisen, bedoeld in [artikel 75, eerste lid][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '76'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: 87.2.f
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87
  - number: '87.3'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, onderdelen *a, d* en *f*, een erkenning
      schorsen voor een door hem daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87
  - number: '87.4'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het eerste en tweede lid, bepalen dat een wachttijd geldt voor
      het aanvragen van een erkenning van maximaal 30 maanden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87
  - number: 87a.1
    text: |-
      De Dienst Wegverkeer trekt de bevoegdheid voertuigen aan een keuring te onderwerpen in, indien degene aan wie die
      bevoegdheid is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87a
  - number: 87a.2
    text: |-
      De Dienst Wegverkeer kan de bevoegdheid voertuigen aan een keuring te onderwerpen intrekken of de daaraan verbonden
      voorschriften wijzigen, indien degene aan wie die bevoegdheid is verleend:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87a
  - number: 87a.2.a
    text: niet meer voldoet aan de voor de bevoegdheid voertuigen aan een keuring te onderwerpen gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87a
  - number: 87a.2.b
    text: |-
      in strijd met de regels, bedoeld in [artikel 76, derde lid][ref1], een voertuig aan een onderzoek onderwerpt,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel76
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '76'
        hoofdstuk: V
        paragraaf: '3'
  - number: 87a.2.c
    text: |-
      handelt in strijd met een of meer andere uit de bevoegdheid voertuigen aan een keuring te onderwerpen
      voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87a
  - number: 87a.3
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, onderdelen a en c, de bevoegdheid voertuigen
      aan een keuring te onderwerpen schorsen voor een door deze dienst daarbij vast te stellen termijn die ten hoogste
      twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel87a
  - number: '88.1'
    text: |-
      De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie. In dat
      geval wordt de kennisgeving na daartoe strekkend verzoek van de belanghebbende in een beschikking vastgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel88
  - number: '88.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld met betrekking tot het toezicht en het verscherpen
      daarvan, alsmede met betrekking tot het intrekken, wijzigen en schorsen van de erkenning of bevoegdheid tot keuren.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel88
  - number: '89'
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 83][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel83
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '83'
        hoofdstuk: V
        paragraaf: '5'
  - number: '90.1'
    text: |-
      Tegen een beschikking tot weigering van de afgifte van een keuringsbewijs kan een belanghebbende bezwaar maken of
      administratief beroep instellen bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel90
  - number: '90.2'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] kan tegen een beschikking tot weigering van
      de afgifte van een keuringsbewijs slechts bezwaar worden gemaakt of administratief beroep worden ingesteld terstond
      nadat de beschikking is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '90.3'
    text: |-
      Het bezwaar of administratief beroep wordt slechts in behandeling genomen indien het voertuig in de staat waarin
      het zich ten tijde van de keuring bevond, onmiddellijk op een door de Dienst Wegverkeer bepaalde plaats ter
      beschikking wordt gesteld ten behoeve van een herkeuring door een door de Dienst Wegverkeer aangewezen deskundige.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel90
  - number: '90.4'
    text: |-
      In afwijking van de [artikelen 7:15][ref1] en [7:28 van de Algemene wet bestuursrecht][ref2] dient bij de indiening
      van het bezwaar- of beroepschrift een bedrag ter vergoeding van de aan de herkeuring verbonden kosten te worden
      betaald. De hoogte van het bedrag en de wijze van betaling worden vastgesteld door de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '90.5'
    text: |-
      Degene die de beschikking tot weigering van de afgifte van een keuringsbewijs heeft gegeven, wordt in de
      gelegenheid gesteld bij de herkeuring aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel90
  - number: '90.6'
    text: |-
      Indien het voertuig volgens het oordeel van de deskundige voldoet aan de in [artikel 75][ref1] bedoelde eisen,
      geeft de Dienst Wegverkeer alsnog het aangevraagde keuringsbewijs af en wordt het in het vierde lid bedoelde
      bedrag terugbetaald aan de indiener van het bezwaar- of beroepschrift. Is in dit geval de beschikking tot weigering
      van de afgifte van een keuringsbewijs gegeven door een erkende natuurlijke persoon of rechtspersoon, dan is
      deze vorenbedoeld bedrag verschuldigd aan de Dienst Wegverkeer en gehouden dit te betalen op de door deze dienst
      vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: '91.1'
    text: |-
      Tegen een beschikking tot afgifte van een keuringsbewijs kan een belanghebbende bezwaar maken of administratief
      beroep instellen bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel91
  - number: '91.2'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] kan tegen een beschikking tot afgifte van
      een keuringsbewijs bezwaar worden gemaakt of administratief beroep worden ingesteld gedurende een bij algemene
      maatregel van bestuur te stellen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '91.3'
    text: |-
      Het bezwaar of administratief beroep wordt slechts in behandeling genomen indien het voertuig op een door de Dienst
      Wegverkeer bepaalde plaats ter beschikking wordt gesteld ten behoeve van een onderzoek door een door de Dienst
      Wegverkeer aangewezen deskundige.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel91
  - number: '91.4'
    text: |-
      In afwijking van de [artikelen 7:15][ref1] en [7:28 van de Algemene wet bestuursrecht][ref2] dient bij de indiening
      van het bezwaar- of beroepschrift een bedrag ter vergoeding van de aan het onderzoek verbonden kosten te worden
      betaald. De hoogte van het bedrag en de wijze van betaling worden vastgesteld door de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '91.5'
    text: |-
      Degene die de beschikking tot afgifte van een keuringsbewijs heeft gegeven, wordt in de gelegenheid gesteld bij het
      onderzoek aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel91
  - number: '91.6'
    text: |-
      Indien het voertuig volgens het oordeel van de deskundige ten tijde van de keuring op grond waarvan het
      keuringsbewijs is afgegeven, redelijkerwijze niet aan de keuringseisen kan hebben voldaan, daarbij in het
      bijzonder gelet op de termijn die is verstreken tussen de keuring en het onderzoek, verklaart de Dienst Wegverkeer
      het voor het voertuig afgegeven keuringsbewijs alsnog ongeldig en wordt het in het vierde lid bedoelde bedrag
      terugbetaald aan de indiener van het bezwaar- of beroepschrift. Is in dit geval de beschikking tot afgifte van
      een keuringsbewijs gegeven door een erkende natuurlijke persoon of rechtspersoon, dan is deze vorenbedoeld bedrag
      verschuldigd aan de Dienst Wegverkeer en gehouden dit te betalen op de door deze dienst vastgestelde wijze.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel91
  - number: '92.1'
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is om bij algemene maatregel van bestuur aangewezen systemen, onderdelen, technische eenheden,
      voertuigdelen, uitrustingsstukken en voorzieningen voor voertuigen en aanhangwagens of voorzieningen ter
      bescherming van inzittenden van voertuigen en kwetsbare weggebruikers die niet zijn goedgekeurd als bedoeld in
      [artikel 21, eerste lid][ref1], in te bouwen in voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: '92.2'
    text: |-
      De erkenning geldt voor de in de erkenning aangegeven werkzaamheden ter zake van het in voertuigen inbouwen
      van in de erkenning aangewezen systemen, onderdelen, technische eenheden, voertuigdelen, uitrustingsstukken en
      voorzieningen in voertuigen of aanhangwagens of voorzieningen ter bescherming van inzittenden van voertuigen en
      kwetsbare weggebruikers. De erkenning kan gelden voor bepaalde of onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel92
  - number: '92.3'
    text: Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel92
  - number: '93.1'
    text: |-
      De erkenning wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief verleend, indien de natuurlijke persoon of rechtspersoon voldoet aan
      bij ministeriële regeling vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel93
  - number: '93.2'
    text: Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel93
  - number: '93.3'
    text: |-
      De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning op grond van
      [artikel 95, tweede lid][ref1], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel van zes maanden in geval reeds twee of meer malen een dergelijke aan
      de aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel95
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '95'
        hoofdstuk: V
        paragraaf: 6a
  - number: '94.1'
    text: |-
      De Dienst Wegverkeer onderwerpt een bij ministeriële regeling aangewezen aantal systemen, onderdelen, technische
      eenheden, voertuigdelen, uitrustingsstukken en voorzieningen voor voertuigen en aanhangwagens en voorzieningen ter
      bescherming van inzittenden van voertuigen en kwetsbare weggebruikers steekproefsgewijs aan een keuring met het oog
      op het toezicht op de juiste inbouw ervan in een voertuig of aanhangwagen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel94
  - number: '94.2'
    text: |-
      Degene aan wie de erkenning is verleend, is gehouden tot betaling, op door de Dienst Wegverkeer vastgestelde wijze,
      van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel94
  - number: '94.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop de steekproef
      wordt uitgevoerd, alsmede betreffende de verplichting tot medewerking daaraan van degene aan wie een erkenning
      is verleend en van de eigenaar of houder van het voertuig waarvoor een keuring wordt geëist. Deze regels kunnen
      inhouden dat een verscherpt toezicht wordt gehouden, indien blijkt dat wordt gehandeld in strijd met een of meer
      uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel94
  - number: '94.4'
    text: De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel94
  - number: '95.1'
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie die erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel95
  - number: '95.2'
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen, indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel95
  - number: 95.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel95
  - number: 95.2.b
    text: |-
      de verplichtingen, vervat in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] en
      [artikel 94, derde lid][ref2], niet nakomt; of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel94
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '94'
        hoofdstuk: V
        paragraaf: 6a
  - number: 95.2.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel95
  - number: '95.3'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel95
  - number: '95.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot het intrekken, wijzigen en
      schorsen van de erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel95
  - number: '96'
    text: |-
      Het is een ieder die niet beschikt over een geldige erkenning als bedoeld in [artikel 92][ref1] verboden zich op
      zodanige wijze te gedragen, dat bij het publiek de indruk kan worden gewekt dat een dergelijke erkenning aan hem
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel92
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '92'
        hoofdstuk: V
        paragraaf: 6a
  - number: '98'
    text: |-
      Indien in de bouw of inrichting van een voertuig dat is goedgekeurd als bedoeld in [artikel 21, eerste lid][ref1],
      en na die goedkeuring wijziging is aangebracht, dient die wijziging, voorzover dit bij ministeriële regeling is
      bepaald, te zijn goedgekeurd voor toelating van het gewijzigde voertuig tot het verkeer op de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: '99.1'
    text: |-
      Goedkeuring wordt op aanvraag en tegen betaling op door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor
      door deze dienst vastgestelde tarief door deze dienst verleend, indien de aangebrachte wijziging bij een door
      deze dienst verrichte keuring voldoet aan de voor deze goedkeuring gestelde eisen ingevolge een EU-verordening
      in verband met de goedkeuring van motorvoertuigen of ingevolge de in [hoofdstuk III][ref1] en [hoofdstuk V][ref2]
      voor deze goedkeuring vastgestelde eisen. De keuring kan mede omvatten die delen van het voertuig waarvoor de
      aangebrachte wijziging gevolgen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006622
        hoofdstuk: V
  - number: '99.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld betreffende het door de aanvrager voor de keuring
      ter beschikking stellen van het voertuig, het door de aanvrager overleggen van bescheiden en verstrekken van
      inlichtingen ter zake van de keuring alsmede betreffende de wijze waarop de keuring wordt verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel99
  - number: '100.1'
    text: |-
      De goedkeuring voor een wijziging in de bouw of inrichting van een voertuig wordt door de Dienst Wegverkeer
      verleend zonder dat de in [artikel 99][ref1] bedoelde keuring heeft plaatsgevonden, indien door een daartoe door
      de Dienst Wegverkeer erkende natuurlijke persoon of rechtspersoon wordt gewaarborgd dat de aangebrachte wijziging
      voldoet aan de voor deze goedkeuring gestelde eisen ingevolge een EU-verordening in verband met de goedkeuring van
      motorvoertuigen of ingevolge de in [hoofdstuk III][ref2] en [hoofdstuk V][ref3] voor deze goedkeuring vastgestelde
      eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '99'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0006622
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0006622
        hoofdstuk: V
  - number: '100.2'
    text: |-
      De erkenning geldt voor de in de erkenning aangegeven werkzaamheden ter zake van het wijzigen van de bouw of
      inrichting van voertuigen die behoren tot een in de erkenning aangewezen groep. De erkenning kan gelden voor
      bepaalde of voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel100
  - number: '100.3'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en kunnen
      met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel100
  - number: '101.1'
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door deze dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend aan de natuurlijke persoon of rechtspersoon
      die voldoet aan de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de organisatie
      van de aanvrager alsmede het proces volgens hetwelk de aanvrager zijn werkzaamheden verricht, alsmede de voor
      de werkzaamheden benodigde apparatuur. Ten aanzien van de voor de werkzaamheden benodigde apparatuur kan bij
      die ministeriële regeling de eis worden gesteld dat die apparatuur is goedgekeurd door een door Onze Minister
      aan te wijzen keuringsinstelling en met de in die regeling vast te stellen periodiciteit is onderzocht door deze
      keuringsinstelling dan wel door een door deze keuringsinstelling erkende onderzoeksgerechtigde en kunnen regels
      worden vastgesteld met betrekking tot de erkenning van onderzoeksgerechtigden. Bij ministeriële regeling kan worden
      bepaald dat middelen die worden gebruikt om deze apparatuur voor gebruik geschikt te maken zijn gecertificeerd
      door een door die keuringsinstelling erkende instelling en kunnen regels worden vastgesteld met betrekking tot
      die erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel101
  - number: '101.2'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag tot erkenning. Bij
      ministeriele regeling worden nadere regels vastgesteld met betrekking tot de aanvraag van een erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '102.1'
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing
      in de *Staatscourant*. Tot dit toezicht kan behoren het steekproefsgewijs keuren van door een erkende natuurlijke
      persoon of rechtspersoon aangebrachte wijzigingen in de bouw of inrichting van voertuigen. Voorts kan tot het
      toezicht behoren het periodiek controleren van de organisatie van degene aan wie de erkenning is verleend alsmede
      het proces volgens hetwelk hij zijn werkzaamheden verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel102
  - number: '102.2'
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel102
  - number: '102.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop het toezicht wordt
      gehouden en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend en van de eigenaar
      of houder van het voertuig waarvoor een keuring wordt geëist. Deze regels kunnen inhouden dat een verscherpt
      toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit de erkenning voortvloeiende
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel102
  - number: '102.4'
    text: |-
      De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie. In dat
      geval wordt de kennisgeving na daartoe strekkend verzoek van de belanghebbende in een beschikking vastgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel102
  - number: '103.1'
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie de erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel103
  - number: '103.2'
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel103
  - number: 103.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel103
  - number: 103.2.b
    text: |-
      de verplichtingen, vervat in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] en
      [artikel 102, tweede lid][ref2], niet nakomt, of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel102
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '102'
        hoofdstuk: V
        paragraaf: '8'
  - number: 103.2.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel103
  - number: '103.3'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel103
  - number: '103.4'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, bepalen dat een wachttijd geldt voor het
      aanvragen van een erkenning van maximaal 30 maanden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel103
  - number: 103a
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld met betrekking tot het intrekken, wijzigen en schorsen
      van de erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel103a
  - number: '104'
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 100][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel100
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '100'
        hoofdstuk: V
        paragraaf: '8'
  - number: '105'
    text: |-
      Indien de tenaamstelling van een motorrijtuig of een aanhangwagen ingevolge
      [artikel 51a, derde lid, onderdeel b of d][ref1], vervallen is verklaard of indien een aanzegging is gedaan als
      bedoeld in [artikel 37, vijfde lid, onderdeel b][ref2], wordt het voertuig goedgekeurd alvorens de tenaamstelling
      kan herleven of het kentekenbewijs door de Dienst Wegverkeer geldig kan worden verklaard of kan worden
      teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel51a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 51a
        hoofdstuk: IV
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '106.1'
    text: |-
      De goedkeuring wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief door deze dienst verleend, indien het voertuig bij een door de dienst
      verrichte keuring heeft beantwoord aan de bij of krachtens deze wet vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel106
  - number: '106.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld betreffende het door de aanvrager voor de keuring
      ter beschikking stellen van het voertuig, het door de aanvrager overleggen van bescheiden en verstrekken van
      inlichtingen ter zake van de keuring alsmede betreffende de wijze waarop de keuring wordt verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel106
  - number: 106a.1
    text: |-
      De goedkeuring van een schadevoertuig na verval van de tenaamstelling kan door de Dienst Wegverkeer worden verleend
      zonder dat de in [artikel 106][ref1] bedoelde keuring heeft plaatsgevonden, indien door een daartoe door de Dienst
      Wegverkeer erkende natuurlijk persoon of rechtspersoon wordt gewaarborgd dat het voertuig voldoet aan de eisen,
      bedoeld in artikel 106, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel106
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel106a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '106'
        hoofdstuk: V
        paragraaf: '9'
  - number: 106a.2
    text: |-
      De erkenning geldt voor de in de erkenning aangegeven werkzaamheden ter zake van voertuigen die behoren tot een in
      de erkenning aangewezen groep. De erkenning kan gelden voor bepaalde of onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel106a
  - number: 106a.3
    text: |-
      De [artikelen 100, derde lid][ref1], en [101 tot en met 103][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel101
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel106a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '100'
        hoofdstuk: V
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '101'
        hoofdstuk: V
        paragraaf: '8'
  - number: 106b
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 106a][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel106a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel106b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 106a
        hoofdstuk: V
        paragraaf: 9a
  - number: '107.1'
    text: |-
      Aan de bestuurder van een motorrijtuig op de weg dient door de daartoe bevoegde autoriteit een rijbewijs te zijn
      afgegeven voor het besturen van motorrijtuigen van de categorie waartoe dat motorrijtuig behoort.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel107
  - number: '107.2'
    text: 'Het rijbewijs dient:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel107
  - number: 107.2.a
    text: te voldoen aan de bij ministeriële regeling vastgestelde eisen inzake inrichting, uitvoering en invulling,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel107
  - number: 107.2.b
    text: zijn geldigheid niet te hebben verloren, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel107
  - number: 107.2.c
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel107
  - number: '107.3'
    text: |-
      Indien de aanvrager als ingezetene is ingeschreven in de basisregistratie personen,
      wordt het in de basisregistratie opgenomen burgerservicenummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1], op de bij ministeriële regeling
      vastgestelde wijze op het rijbewijs vermeld. Indien de aanvrager niet als ingezetene is ingeschreven in de
      basisregistratie personen, wordt op het rijbewijs een bij ministeriële regeling vastgestelde aanduiding vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: '108.1'
    text: |-
      [Artikel 107][ref1] is niet van toepassing op bestuurders van:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
        hoofdstuk: VI
        afdeling: '1'
  - number: 108.1.a
    text: |-
      bromfietsen als bedoeld in [artikel 1, eerste lid, onderdeel e, subonderdeel d][ref1], en gehandicaptenvoertuigen
      die zijn uitgerust met een motor en bij algemene maatregel van bestuur aangewezen landbouw- of
      bosbouwtrekkers, motorrijtuigen met beperkte snelheid en mobiele machines;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
        hoofdstuk: '1'
  - number: 108.1.b
    text: |-
      motorrijtuigen, gedurende de tijd dat aan die bestuurders rijonderricht in de zin van de
      [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven, voor zover het motorrijtuig daarbij niet onder
      toezicht wordt bestuurd en overigens is voldaan aan de bij algemene maatregel van bestuur gestelde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 108.1.c
    text: |-
      motorrijtuigen, gedurende de tijd dat door die bestuurders een rijproef wordt afgelegd in het kader van een
      onderzoek, door of vanwege de overheid ingesteld, naar hun rijvaardigheid of geschiktheid, voor zover het
      motorrijtuig daarbij niet onder toezicht wordt bestuurd en overigens is voldaan aan de bij algemene maatregel van
      bestuur gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: 108.1.d
    text: |-
      motorrijtuigen, indien die bestuurders vreemdelingen in de zin van de [Vreemdelingenwet 2000][ref1] zijn, die
      op grond van hun hoedanigheid van of betrekking tot diplomatiek of consulair personeel dan wel op grond van hun
      hoedanigheid van of betrekking tot personeel in dienst van een in Nederland gevestigde internationale organisatie
      houder zijn van een door Onze Minister van Buitenlandse Zaken verstrekt identiteitsbewijs voor geprivilegieerden
      en aan wie, tenzij het een bestuurder van een bromfiets of een andere dan bij algemene maatregel van bestuur
      aangewezen landbouw- of bosbouwtrekker, motorrijtuig met beperkte snelheid of mobiele machine betreft, door
      het daartoe bevoegde gezag buiten Nederland een rijbewijs is afgegeven dat geldig is voor het besturen van een
      motorrijtuig van de categorie waarmee wordt gereden;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 108.1.e
    text: |-
      motorrijtuigen, indien die bestuurders lid zijn van een krijgsmacht of behoren tot de civiele dienst van een
      krijgsmacht die in het kader van het op 19 juni 1951 te Londen gesloten Verdrag tussen de Staten die partij zijn
      bij het Noord-Atlantisch Verdrag nopens de rechtspositie van hun krijgsmachten, in Nederland is gelegerd, dan
      wel behoren tot het gezin van een lid van een krijgsmacht als hiervoor bedoeld of tot het gezin van een tot de
      civiele dienst van zodanige krijgsmacht behorende persoon, en aan wie, tenzij het een bestuurder van een bromfiets
      of een andere dan bij algemene maatregel van bestuur aangewezen landbouw- of bosbouwtrekker, motorrijtuig met
      beperkte snelheid of mobiele machine betreft, door het daartoe bevoegde gezag in de Staat van herkomst of één van
      zijn samenstellende delen een rijbewijs is afgegeven dat geldig is voor het besturen van een motorrijtuig van de
      categorie waarmee wordt gereden;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: 108.1.f
    text: |-
      motorrijtuigen, anders dan bromfietsen of andere dan bij algemene maatregel van bestuur aangewezen landbouw- of
      bosbouwtrekkers, motorrijtuigen met beperkte snelheid of mobiele machines, indien die bestuurders buiten Nederland
      woonachtig zijn en zij zich bevinden in het internationaal verkeer, mits aan hen door het daartoe bevoegde gezag
      buiten Nederland een rijbewijs is afgegeven dat geldig is voor het besturen van een motorrijtuig van de categorie
      waarmee wordt gereden alsmede, in de gevallen waarin zulks is vereist op grond van internationale overeenkomsten
      die Nederland binden, aan hen buiten Nederland een internationaal rijbewijs is afgegeven dat geldig is voor het
      besturen van een motorrijtuig van de categorie waarmee wordt gereden;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: 108.1.g
    text: |-
      motorrijtuigen, anders dan bromfietsen of andere dan bij algemene maatregel van bestuur aangewezen landbouw- of
      bosbouwtrekkers, motorrijtuigen met beperkte snelheid of mobiele machines, indien die bestuurders in Nederland
      woonachtig zijn en aan hen door het daartoe bevoegde gezag buiten Nederland, anders dan in een andere lidstaat
      van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland, een rijbewijs is afgegeven dat geldig is voor het besturen van een motorrijtuig van de
      categorie waarmee wordt gereden, zo lang sedert de dag waarop zij zich in Nederland hebben gevestigd, nog geen 185
      dagen zijn verstreken;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: 108.1.h
    text: |-
      motorrijtuigen, anders dan andere dan bij algemene maatregel van bestuur aangewezen landbouw- of
      bosbouwtrekkers, motorrijtuigen met beperkte snelheid of mobiele machines, indien die bestuurders in Nederland
      woonachtig zijn en aan hen door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, een
      rijbewijs is afgegeven dat geldig is voor het besturen van een motorrijtuig van de categorie waarmee wordt gereden:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: 108.1.h.1°
    text: |-
      indien het een rijbewijs betreft dat is afgegeven voor een of meer van de categorieën AM, A1, A2, A, B, B1 of BE,
      gedurende de periode die is gelegen tussen de datum van vestiging van die bestuurders in Nederland en de datum
      waarop sedert de datum van afgifte van dat rijbewijs maximaal vijftien jaren zijn verstreken, dan wel, indien die
      periode korter is dan twee jaren en het een rijbewijs betreft met een langere geldigheidsduur dan vijftien jaren,
      gedurende twee jaren vanaf de datum van vestiging van die bestuurder in Nederland;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: 108.1.h.2°
    text: |-
      indien het een rijbewijs betreft dat is afgegeven voor een of meer van de categorieën C1, C1E, C, CE, D1, D1E, D
      of DE, gedurende de periode die is gelegen tussen de datum van vestiging van die bestuurders in Nederland en de
      datum waarop sedert de datum van afgifte van dat rijbewijs maximaal vijf jaren zijn verstreken, dan wel, indien
      die periode korter is dan twee jaren en het een rijbewijs betreft met een langere geldigheidsduur dan vijf jaren,
      gedurende twee jaren vanaf de datum van vestiging van die bestuurders in Nederland.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: 108.1.i
    text: 'bromfietsen, indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: 108.1.i.1°
    text: |-
      die bestuurders buiten Nederland, anders dan in een andere lidstaat van de Europese Unie, een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, woonachtig zijn en zij
      zich bevinden in het internationaal verkeer;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: 108.1.i.2°
    text: |-
      die bestuurders afkomstig zijn uit een staat anders dan een andere lidstaat van de Europese Unie, een andere staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland en zij in Nederland
      woonachtig zijn, zolang sedert de dag waarop zij zich in Nederland hebben gevestigd, nog geen 185 dagen verstreken
      zijn;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: 108.1.i.3°
    text: |-
      die bestuurders in een andere lidstaat van de Europese Unie, een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland, woonachtig zijn en zij zich in het internationaal
      verkeer bevinden, en zij beschikken over een door het daartoe bevoegde gezag in een van deze staten afgegeven:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: 108.1.i.3°.a
    text: rijbewijs dat geldig is voor de categorie AM, of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: 108.1.i.3°.b
    text: rijbewijs dat geldig is voor een andere categorie dan AM, of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: 108.1.i.4°
    text: |-
      die bestuurders in Nederland woonachtig zijn en aan hen door het daartoe bevoegde gezag in een andere lidstaat
      van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland, een rijbewijs is afgegeven dat geldig is voor een andere categorie dan AM, gedurende de in
      onderdeel h bedoelde periode.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: '108.2'
    text: |-
      In aanvulling op het eerste lid, onderdelen d tot en met h, is [artikel 107][ref1] niet van
      toepassing op bestuurders van andere dan bij algemene maatregel van bestuur aangewezen landbouw- of
      bosbouwtrekkers, motorrijtuigen met beperkte snelheid of mobiele machines, indien de bestuurder beschikt over:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
        hoofdstuk: VI
        afdeling: '1'
  - number: 108.2.a
    text: een door het daartoe bevoegde gezag buiten Nederland afgegeven rijbewijs dat geldig is voor de categorie C, of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: 108.2.b
    text: |-
      een bij ministeriële regeling aangegeven rijbewijs dat door het daartoe bevoegde gezag in een andere lidstaat
      van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland is afgegeven voor het besturen van deze landbouw- of bosbouwtrekkers, motorrijtuigen met
      beperkte snelheid of mobiele machines.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: '108.3'
    text: |-
      Bij ministeriële regeling worden voorschriften vastgesteld ter uitvoering van de in het eerste lid, onderdelen *b*
      en *c*, bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
  - number: '108.4'
    text: |-
      In afwijking van het eerste lid, onderdeel i, onder 3°, is [artikel 107][ref1] niet van toepassing op bestuurders
      van bromfietsen die in een andere lidstaat van de Europese Unie, een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, woonachtig zijn en die zich bevinden in
      het internationaal verkeer, indien het een bromfiets betreft waarop richtlijn nr. 2006/126/EG van het Europees
      Parlement en de Raad van de Europese Unie van 20 december 2006 betreffende het rijbewijs (PbEU L 403) niet van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
        hoofdstuk: VI
        afdeling: '1'
  - number: 108a.1
    text: |-
      De in [artikel 108, eerste lid, onderdelen g en i, onder 2°][ref1], genoemde termijn van 185 dagen wordt ten
      behoeve van houders van een rijbewijs dat is afgegeven door het daartoe bevoegde gezag buiten Nederland, anders
      dan in een andere lidstaat van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte of Zwitserland, die in Nederland woonachtig zijn, verlengd tot en met 30 september
      2021, indien de genoemde termijn van 185 dagen verstrijkt of is verstreken in de periode tussen 15 december 2020 en
      19 augustus 2021.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel108
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '108'
        hoofdstuk: VI
        afdeling: '1'
  - number: 108a.2
    text: |-
      De in [artikel 108, eerste lid, onderdeel h][ref1], genoemde termijnen worden ten behoeve van houders van een
      rijbewijs dat is afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie, een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, die in Nederland
      woonachtig zijn, verlengd tot en met 30 september 2021, indien de in dat onderdeel bedoelde termijn verstrijkt of
      is verstreken in de periode tussen 15 december 2020 en 19 augustus 2021.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel108
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '108'
        hoofdstuk: VI
        afdeling: '1'
  - number: 108a.3
    text: |-
      De in het eerste en tweede lid bedoelde verlenging geldt op voorwaarde dat het desbetreffende rijbewijs voor
      het besturen van een motorrijtuig van de categorie waarmee wordt gereden geldig is dan wel in de periode tussen
      15 december 2020 en 19 augustus 2021 zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108a
  - number: 108a.4
    text: Dit artikel vervalt met ingang van 1 oktober 2021.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel108a
  - number: '110'
    text: |-
      Motorrijtuigen mogen slechts worden bestuurd door personen die een bij algemene maatregel van bestuur
      vastgestelde minimumleeftijd hebben bereikt. Daarbij kan voor het ontvangen van rijonderricht in de zin van de
      [Wet rijonderricht motorrijtuigen 1993][ref1] in de bij algemene maatregel van bestuur vastgestelde gevallen en
      onder de bij algemene maatregel van bestuur gestelde voorwaarden een lagere leeftijd worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 110a.1
    text: 'Bij algemene maatregel van bestuur worden eisen vastgesteld met betrekking tot motorrijtuigen waarmee:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel110a
  - number: 110a.1.a
    text: |-
      rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 110a.1.b
    text: |-
      in het kader van een door of vanwege de overheid ingesteld onderzoek naar de rijvaardigheid of geschiktheid een
      rijproef wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel110a
  - number: 110a.2
    text: Bij ministeriële regeling kunnen nadere regels ter uitvoering van het eerste lid worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel110a
  - number: 110b.1
    text: |-
      Het is degene die rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] geeft, verboden
      zodanig rijonderricht te geven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel110b
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 110b.1.a
    text: |-
      het motorrijtuig waarmee rijonderricht wordt gegeven, niet voldoet aan de daaraan ingevolge [artikel 110a][ref1]
      gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel110a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel110b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 110a
        hoofdstuk: VI
        afdeling: '2'
  - number: 110b.1.b
    text: |-
      degene aan wie rijonderricht wordt gegeven nog niet de bij algemene maatregel van bestuur vastgestelde
      minimumleeftijd heeft bereikt voor het besturen van een motorrijtuig van de categorie waarvoor rijonderricht wordt
      gegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel110b
  - number: 110b.1.c
    text: |-
      niet wordt voldaan aan de overigens bij algemene maatregel van bestuur ten aanzien van het geven van rijonderricht
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel110b
  - number: 110b.2
    text: |-
      Het eerste lid, aanhef en onderdeel b, geldt niet voor zover het rijonderricht betreft dat plaatsvindt in het
      kader van een opleiding voor beroepschauffeur, mits is voldaan aan de bij algemene maatregel van bestuur gestelde
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel110b
  - number: '111.1'
    text: |-
      Een rijbewijs wordt op aanvraag en tegen betaling van het daarvoor vastgestelde tarief, slechts afgegeven aan
      degene die:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111
  - number: 111.1.a
    text: |-
      de bij algemene maatregel van bestuur vastgestelde minimumleeftijd heeft bereikt voor het besturen van een
      motorrijtuig van de categorie waarop de aanvraag tot afgifte van een rijbewijs betrekking heeft en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111
  - number: 111.1.b
    text: |-
      blijkens een overeenkomstig bij algemene maatregel van bestuur vastgestelde regels door of vanwege de overheid
      ingesteld onderzoek dan wel blijkens een eerder aan hem afgegeven rijbewijs of een hem door het daartoe bevoegde
      gezag buiten Nederland afgegeven rijbewijs dat voldoet aan de bij algemene maatregel van bestuur vastgestelde
      eisen, beschikt over een voldoende mate van rijvaardigheid en geschiktheid, dan wel, indien de aanvraag betrekking
      heeft op afgifte van een rijbewijs dat geldig is voor het besturen van bromfietsen, over een voldoende mate van
      rijvaardigheid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111
  - number: '111.2'
    text: |-
      De aanvrager van een rijbewijs dient zich zowel bij de indiening van de aanvraag als bij de uitreiking
      van het rijbewijs te identificeren met een op zijn naam gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3° van de Wet op de identificatieplicht][ref1], een geldig rijbewijs,
      dan wel een eerder aan hem afgegeven rijbewijs dat zijn geldigheid heeft verloren door het verstrijken van
      de geldigheidsduur. Degene ten aanzien van wie een onderzoek als bedoeld in het eerste lid, onderdeel b,
      wordt ingesteld, dient zich te identificeren met een op zijn naam gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3° van de Wet op de identificatieplicht][ref2], een geldig rijbewijs
      dan wel een eerder aan hem afgegeven rijbewijs dat zijn geldigheid heeft verloren door het verstrijken van de
      geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '111.3'
    text: |-
      Aan degene die vreemdeling in de zin van de [Vreemdelingenwet 2000][ref1] is, en geen onderdaan van een lidstaat
      van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland, wordt een rijbewijs slechts afgegeven indien hij rechtmatig in Nederland verblijft als
      bedoeld in [artikel 8, onder a tot en met d en l van die wet][ref2]. Voor de uitvoering hiervan is de korpschef in
      de zin van de [Vreemdelingenwet 2000][ref3] verplicht aan degene die is belast met de afgifte van het rijbewijs,
      kosteloos de noodzakelijke opgaven en inlichtingen te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0011823
  - number: '111.4'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid, onderdeel *b*.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111
  - number: '111.5'
    text: |-
      In de gevallen waarin het rijbewijs overeenkomstig [artikel 116][ref1] wordt afgegeven door de burgemeester dan
      wel de aanvraag overeenkomstig het bepaalde krachtens [artikel 113, eerste lid][ref2], wordt ingediend bij de
      burgemeester, wordt het in het eerste lid bedoelde tarief vastgesteld bij plaatselijke verordening. In de overige
      gevallen worden het tarief en de wijze van betaling daarvan vastgesteld door de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel113
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '116'
        hoofdstuk: VI
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '113'
        hoofdstuk: VI
        afdeling: '4'
  - number: '111.6'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het bij plaatselijke verordening vastgestelde tarief,
      bedoeld in het vijfde lid, verminderd met de vergoeding, bedoeld in [artikel 121, eerste lid][ref1], een in die
      maatregel te bepalen bedrag niet te boven gaat. Dat bedrag kan bij ministeriële regeling worden gewijzigd voor
      zover de consumentenprijsindex daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel121
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '121'
        hoofdstuk: VI
        afdeling: '5'
  - number: '111.7'
    text: |-
      Voor zover dit noodzakelijk is ten behoeve van het onderzoek naar de rijvaardigheid en geschiktheid, bedoeld in
      het eerste lid, onder b, worden door het met dat onderzoek belaste gezag persoonsgegevens betreffende iemands
      rijvaardigheid en gezondheid verwerkt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111
  - number: 111a.1
    text: |-
      Indien het rijbewijs voor de rijbewijscategorie B wordt aangevraagd door een aanvrager die op het tijdstip van
      de aanvraag nog niet de krachtens [artikel 111, eerste lid, onderdeel a][ref1], vastgestelde minimumleeftijd voor
      het besturen van motorrijtuigen van die rijbewijscategorie heeft bereikt, maar wel de leeftijd van 17 jaar, worden
      in aanvulling op de in dan wel krachtens de [artikelen 111 tot en met 113][ref2], [116 tot en met 118a][ref3],
      en [120a tot en met 122][ref4], gestelde voorwaarden bij algemene maatregel van bestuur aanvullende voorwaarden
      gesteld aan de aanvraag en het verkrijgen van dat rijbewijs. Deze aanvullende voorwaarden hebben onder meer
      betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel111
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel116
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel121
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '111'
        hoofdstuk: VI
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '111'
        hoofdstuk: VI
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '116'
        hoofdstuk: VI
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '121'
        hoofdstuk: VI
        afdeling: '5'
  - number: 111a.1.a
    text: de aanvraag en afgifte van een begeleiderspas, waarvan de kosten door de Dienst Wegverkeer worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.1.b
    text: de aanvullende voorwaarden voor de aanvraag en de afgifte van het rijbewijs voor de categorie B, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.1.c
    text: |-
      de eisen waaraan een begeleider op het tijdstip van de aanvraag tot vermelding op de begeleiderspas moet voldoen,
      inclusief de controle van deze eisen door de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.2
    text: |-
      Op de in het eerste lid, onderdeel a, bedoelde aanvraag van de begeleiderspas is [artikel 114][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel114
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '114'
        hoofdstuk: VI
        afdeling: '4'
  - number: 111a.3
    text: |-
      Het is een houder van een op basis van het eerste lid afgegeven rijbewijs verboden om tot het bereiken van de
      leeftijd van achttien jaren een motorrijtuig van de categorie B te besturen:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.3.a
    text: |-
      buiten het grondgebied van het Europese deel van Nederland, tenzij dit rijbewijs is erkend in een andere staat
      buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.3.b
    text: zonder de aan hem afgegeven geldige begeleiderspas bij zich te hebben, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.3.c
    text: |-
      zonder dat tijdens het besturen van het motorrijtuig van de categorie B een op de aan hem afgegeven geldige
      begeleiderspas vermelde begeleider, op de zitplaats naast de bestuurder is gezeten.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.4
    text: 'De begeleiderspas verliest van rechtswege zijn geldigheid:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.4.a
    text: door uitreiking van een nieuwe begeleiderspas;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.4.b
    text: door het onbevoegd daarin aanbrengen van wijzigingen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.4.c
    text: |-
      door wijziging van de geslachtsnaam, de voornamen of de plaats of datum van geboorte van één van de daarop vermelde
      personen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.4.d
    text: op de dag waarop de houder de leeftijd van achttien jaren bereikt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.5
    text: 'Een begeleiderspas wordt door de Dienst Wegverkeer ongeldig verklaard indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.5.a
    text: |-
      de begeleiderspas is afgegeven op grond van door de aanvrager verschafte onjuiste gegevens en hij niet zou zijn
      afgegeven indien de onjuistheid van die gegevens ten tijde van de aanvraag bekend zou zijn geweest;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.5.b
    text: na afgifte van de begeleiderspas blijkt dat hij kennelijk abusievelijk aan de houder is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.6
    text: |-
      De ongeldigverklaring is van kracht met ingang van de zevende dag na die waarop het besluit tot ongeldigverklaring
      aan de houder van de begeleiderspas bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.7
    text: 'De begeleiderspas dient:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.7.a
    text: te voldoen aan bij ministeriële regeling vastgestelde eisen inzake inrichting, uitvoering en invulling;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.7.b
    text: zijn geldigheid niet te hebben verloren en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111a.7.c
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111a
  - number: 111b
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld waaraan de begeleider tijdens het begeleiden
      voldoet. Deze regels kunnen alleen het rijbewijs en het verkeersgedrag van de begeleider betreffen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel111b
  - number: '112.1'
    text: |-
      Onverminderd [artikel 111][ref1] wordt een rijbewijs niet afgegeven aan degene:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel111
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '111'
        hoofdstuk: VI
        afdeling: '3'
  - number: 112.1.a
    text: aan wie de bevoegdheid tot het besturen van motorrijtuigen is ontzegd, voor de duur van de ontzegging;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel112
  - number: 112.1.b
    text: |-
      van wie ingevolge een der [artikelen 130, tweede lid][ref1], of [164][ref2] de overgifte van dat bewijs is
      gevorderd dan wel wiens rijbewijs is ingevorderd en aan wie dat bewijs niet is teruggegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel164
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '164'
        hoofdstuk: IX
  - number: 112.1.c
    text: |-
      ten aanzien van wie ingevolge [artikel 131, tweede lid, onderdeel a][ref1], de geldigheid van het rijbewijs is
      geschorst, voor de categorie of categorieën van motorrijtuigen waarop de schorsing betrekking heeft, voor de duur
      van de schorsing;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 112.1.d
    text: |-
      van wie ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1] de inlevering van het
      rijbewijs is gevorderd dan wel wiens rijbewijs krachtens die wet is ingenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0004581
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0004581
  - number: 112.1.e
    text: |-
      van wie is gebleken dat die houder is van een rijbewijs, afgegeven door het daartoe bevoegde gezag in een andere
      lidstaat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of Zwitserland, tenzij de afgifte van een rijbewijs plaatsvindt tegen overlegging van dat
      rijbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel112
  - number: 112.1.f
    text: |-
      ten aanzien van wie is gebleken dat in een andere lidstaat van de Europese Unie of in een andere staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland het rijbewijs is geschorst of een
      beperkende maatregel met betrekking tot het rijbewijs of de rijbevoegdheid onherroepelijk is geworden, tenzij is
      voldaan aan bij algemene maatregel van bestuur gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel112
  - number: '112.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdelen, b, c, d en f, wordt onder rijbewijs mede verstaan een rijbewijs,
      afgegeven door het daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel112
  - number: '113.1'
    text: |-
      De aanvraag van een rijbewijs dient te geschieden overeenkomstig bij algemene maatregel van bestuur vastgestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel113
  - number: '113.2'
    text: |-
      Degene die is belast met de afgifte van rijbewijzen, verschaft zich de nodige zekerheid over de identiteit van
      de aanvrager. Hij is bevoegd te vorderen dat de aanvrager op een door hem te bepalen plaats en tijd persoonlijk
      verschijnt voor een door hem aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel113
  - number: '113.3'
    text: |-
      Degene die is belast met de afgifte van rijbewijzen vergewist zich ervan dat de bij de aanvraag van een rijbewijs
      over te leggen bescheiden aan de daaraan gestelde eisen voldoen en dat ook overigens aan de met betrekking tot de
      aanvraag gestelde voorwaarden wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel113
  - number: '113.4'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste tot en met het derde lid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel113
  - number: '114'
    text: |-
      Het is verboden voor het verkrijgen van een rijbewijs opzettelijk onjuiste opgaven te doen, onjuiste inlichtingen
      te verschaffen en onjuiste bewijsstukken en andere bescheiden over te leggen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel114
  - number: '115.1'
    text: |-
      Degene die is belast met de afgifte van rijbewijzen, en die in het kader van de aanvraag of de uitreiking van
      een nieuw rijbewijs of een vervangend rijbewijs de beschikking krijgt over een rijbewijs waarvan ingevolge
      een der [artikelen 130, tweede lid][ref1], of [164][ref2] de overgifte is gevorderd, waarvan ingevolge de
      [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref3] de inlevering is gevorderd of ten aanzien
      waarvan ingevolge een der [artikelen 119, vierde lid][ref4], [120, derde lid][ref5], [123b, vierde lid][ref6],
      [124, vierde lid][ref7], [131, tweede lid, onderdeel b][ref8], [132, vijfde lid][ref9], [134, vierde lid][ref10],
      of [180, vierde lid][ref11], van deze wet een verplichting tot inlevering bestaat, is bevoegd dat rijbewijs in te
      nemen en het door te begeleiden naar het betrokken parket van het openbaar ministerie dan wel naar degene bij wie
      de houder dat rijbewijs had dienen in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel164
      [ref3]: https://wetten.overheid.nl/BWBR0004581
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel119
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel120
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
      [ref7]: https://wetten.overheid.nl/BWBR0006622#Artikel124
      [ref8]: https://wetten.overheid.nl/BWBR0006622#Artikel131
