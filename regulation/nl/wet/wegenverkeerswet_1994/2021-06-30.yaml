  - number: '174.1'
    text: |-
      Indien ter zake van een overtreding van [artikel 40, eerste lid][ref1], proces-verbaal
      wordt opgemaakt door een ambtenaar van politie, aangesteld voor de uitvoering van de
      politietaak, dan wel een op dat voorschrift betrekking hebbende gedraging, omschreven in de in
      [artikel 2, eerste lid, van de Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref2] bedoelde
      bijlage door hem wordt geconstateerd, begaan met een op de weg staand motorrijtuig, terwijl niet terstond blijkt
      wie de eigenaar of houder van dat motorrijtuig is, is de burgemeester bevoegd op verzoek van die ambtenaar dat
      motorrijtuig naar een door hem aangewezen plaats te doen overbrengen en in bewaring te doen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '2'
  - number: '174.2'
    text: |-
      Alvorens het in het eerste lid bedoelde verzoek te doen, kan de daar bedoelde ambtenaar door middel van een daartoe
      aan te brengen apparaat het rijden met het motorrijtuig voor ten hoogste twee dagen beletten. Het apparaat wordt
      binnen die termijn verwijderd, zodra bekend wordt wie de eigenaar of houder van het motorrijtuig is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel174
  - number: '174.3'
    text: |-
      De [artikelen 170, tweede lid, tweede en derde volzin, vierde, vijfde en zesde lid][ref1],
      [171][ref2], [172][ref3] en [173, eerste lid][ref4], van deze wet en de [artikelen 4:116][ref5],
      [4:118 tot en met 4:124][ref6], [5:10][ref7], [5:25, eerste en zesde lid][ref8], [5:29, tweede en derde lid][ref9],
      en [5:30, eerste, tweede, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref10] zijn van overeenkomstige
      toepassing.


