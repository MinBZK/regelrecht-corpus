  - number: '115.2'
    text: |-
      Degene die is belast met de afgifte van rijbewijzen, en die in het kader van de aanvraag of de uitreiking van een
      nieuw rijbewijs of een vervangend rijbewijs de beschikking krijgt over een rijbewijs dat zijn geldigheid heeft
      verloren ingevolge [artikel 123, eerste lid, aanhef en onderdeel d][ref1], of [artikel 123b][ref2] is bevoegd dat
      rijbewijs in te nemen en door te geleiden naar degene bij wie de houder dat rijbewijs had dienen in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '123'
        hoofdstuk: VI
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 123b
        hoofdstuk: VI
        afdeling: '7'
  - number: '115.3'
    text: |-
      Voor de toepassing van het eerste en het tweede lid wordt onder een rijbewijs mede verstaan een rijbewijs,
      afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in
      Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel115
  - number: '115.4'
    text: Bij ministeriële regeling kunnen regels worden vastgesteld ter uitvoering van het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel115
  - number: '116.1'
    text: |-
      Een rijbewijs wordt overeenkomstig bij algemene maatregel van bestuur vastgestelde regels afgegeven door de
      burgemeester van de gemeente waar de aanvrager op het tijdstip van de aanvraag als ingezetene met een adres was
      ingeschreven in de basisregistratie personen of, in de bij algemene maatregel van bestuur bepaalde gevallen, door
      de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel116
  - number: '116.2'
    text: |-
      De in het eerste lid bedoelde regels kunnen mede betrekking hebben op de bestelling, het transport en de
      beveiliging van rijbewijzen, de met betrekking tot de afgifte van rijbewijzen te voeren administratie en de in het
      kader van de afgifteprocedure te treffen beveiligingsmaatregelen. Bij ministeriële regeling kunnen ter uitvoering
      van die regels nadere regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel116
  - number: '117'
    text: |-
      De burgemeester van de gemeente waar de aanvrager op het tijdstip van de aanvraag als ingezetene met een adres
      was ingeschreven in de basisregistratie personen, is bevoegd tot het afgeven van internationale rijbewijzen ten
      behoeve van het verkeer met motorrijtuigen in het buitenland. Gelijke bevoegdheid kan door Onze Minister worden
      verleend aan besturen van verenigingen met volledige rechtsbevoegdheid, die behartiging van verkeersbelangen ten
      doel hebben.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel117
  - number: '118.1'
    text: |-
      Een rijbewijs wordt afgegeven voor het besturen van een of meer in dat bewijs aangeduide categorieën van
      motorrijtuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel118
  - number: '118.2'
    text: De categorieën worden vastgesteld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel118
  - number: '118.3'
    text: |-
      De uit de categorieën voortvloeiende bevoegdheden kunnen overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels worden beperkt door het stellen van eisen aan het motorrijtuig of aan de bestuurder daarvan.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel118
  - number: '118.4'
    text: |-
      Bij ministeriële regeling worden voorschriften vastgesteld met betrekking tot de wijze waarop beperkingen als
      bedoeld in het derde lid worden aangegeven in het rijbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel118
  - number: 118a
    text: |-
      Als datum van afgifte wordt in het rijbewijs en in het rijbewijzenregister vermeld de datum waarop het besluit tot
      afgifte is genomen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel118a
  - number: '119.1'
    text: |-
      Degene die is belast met de afgifte van rijbewijzen geeft overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels een nieuw rijbewijs af:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel119
  - number: 119.1.a
    text: bij vernieuwing van het eerder aan de aanvrager afgegeven rijbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel119
  - number: 119.1.b
    text: |-
      bij wijziging van de omvang van de uit het eerder afgegeven rijbewijs voortvloeiende bevoegdheden, met uitzondering
      van de in [artikel 131, tweede lid, onderdeel a][ref1], bedoelde schorsing van de geldigheid;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 119.1.c
    text: bij wijziging van de personalia van de houder;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel119
  - number: 119.1.d
    text: |-
      na ongeldigverklaring van het eerder afgegeven rijbewijs op grond van [artikel 124, eerste lid, onderdeel e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '124'
        hoofdstuk: VI
        afdeling: '7'
  - number: 119.1.e
    text: in geval het eerder afgegeven rijbewijs versleten of geheel of ten dele onleesbaar is;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel119
  - number: 119.1.f
    text: in geval het eerder afgegeven rijbewijs verloren is geraakt of teniet is gegaan.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel119
  - number: '119.2'
    text: |-
      Het nieuwe rijbewijs wordt niet afgegeven dan nadat het eerder afgegeven rijbewijs waarvoor het wordt afgegeven, is
      ingeleverd bij degene die is belast met de afgifte van het nieuwe rijbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel119
  - number: '119.3'
    text: |-
      Voor de toepassing van het eerste en het tweede lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven
      door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in Nederland
      woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel119
  - number: '119.4'
    text: |-
      Indien de houder van een verloren geraakt rijbewijs waarvoor een nieuw rijbewijs is afgegeven, na de afgifte van
      het nieuwe rijbewijs weer in het bezit komt van dat verloren geraakte rijbewijs, dient hij dat rijbewijs in te
      leveren bij degene die het nieuwe rijbewijs heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel119
  - number: '119.5'
    text: Het eerste lid, aanhef, onderdelen e en f, gelden niet in bij algemene maatregel van bestuur vastgestelde gevallen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel119
  - number: '120.1'
    text: |-
      Degene die is belast met de afgifte van rijbewijzen geeft in de bij algemene maatregel van bestuur aangegeven
      gevallen overeenkomstig bij algemene maatregel van bestuur vastgestelde regels een vervangend rijbewijs af.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel120
  - number: '120.2'
    text: |-
      Het vervangende rijbewijs wordt niet afgegeven dan nadat het rijbewijs waarvoor het wordt afgegeven, is ingeleverd
      bij degene die belast is met de afgifte van het vervangende rijbewijs, tenzij dit rijbewijs, omdat het verloren is
      geraakt, of teniet is gegaan, niet kan worden ingeleverd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel120
  - number: '120.3'
    text: |-
      Indien de houder van een verloren geraakt rijbewijs waarvoor een vervangend rijbewijs is afgegeven, na de afgifte
      van het vervangende rijbewijs weer in het bezit komt van dat verloren geraakte rijbewijs, dient hij dat rijbewijs
      in te leveren bij degene die het vervangende rijbewijs heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel120
  - number: '120.4'
    text: |-
      Voor de toepassing van het eerste tot en met het derde lid wordt onder rijbewijs mede verstaan een rijbewijs,
      afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in
      Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel120
  - number: 120a.1
    text: |-
      Het nieuwe of vervangende rijbewijs wordt niet uitgereikt indien zich tussen de aanvraag en de uitreiking één van
      de gevallen als bedoeld in [artikel 112, eerste lid][ref1], heeft voorgedaan, maar blijft bij degene die is belast
      met de afgifte van rijbewijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel112
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel120a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '112'
        hoofdstuk: VI
        afdeling: '3'
  - number: 120a.2
    text: |-
      Het wordt niet uitgereikt indien tussen de aanvraag en de uitreiking omstandigheden bekend zijn geworden die,
      indien zij bekend waren geweest bij de aanvraag ertoe hadden geleid dat geen besluit van afgifte was genomen. Het
      nieuwe of vervangende rijbewijs blijft bij degene die is belast met de afgifte van rijbewijzen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel120a
  - number: '121.1'
    text: |-
      De gemeenten zijn ter zake van de afgifte van rijbewijzen door de burgemeester en de afgifte van rijbewijzen
      door de Dienst Wegverkeer, waarvoor de aanvraag bij de burgemeester is ingediend, een door de Dienst Wegverkeer
      vastgestelde vergoeding aan de Dienst Wegverkeer verschuldigd ter zake van de kosten die verband houden met de
      productie en aflevering van rijbewijzen alsmede het attenderen van de houders van een rijbewijs op het verloop
      van de geldigheidsduur door de Dienst Wegverkeer, het beheer en de instandhouding van het rijbewijzenregister,
      het verstrekken van gegevens uit dat register aan de in [artikel 127, eerste lid][ref1], bedoelde autoriteiten,
      het ongeldig verklaren van rijbewijzen door de Dienst Wegverkeer, de kosten die verband houden met de afgifte van
      rijbewijzen door de Dienst Wegverkeer, waarvoor de aanvraag bij de burgemeester is ingediend alsmede terzake van de
      kosten die verband houden met het registreren van getuigschriften als bedoeld in [artikel 151c, eerste lid][ref2],
      en met de registratie van certificaten als bedoeld in [artikel 151g, vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel151c
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '127'
        hoofdstuk: VI
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 151c
        hoofdstuk: VIIA
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: '121.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld met betrekking tot de wijze van afdracht van de
      vergoeding.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel121
  - number: '122'
    text: |-
      Met in achtneming van de [artikelen 123][ref1], [123a][ref2] en [123b][ref3] wordt de geldigheidsduur van het
      rijbewijs bij algemene maatregel van bestuur vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel123a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '123'
        hoofdstuk: VI
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 123a
        hoofdstuk: VI
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 123b
        hoofdstuk: VI
        afdeling: '7'
  - number: '123.1'
    text: |-
      Onverminderd de [artikelen 122][ref1] en [131, tweede lid][ref2], verliest een rijbewijs zijn geldigheid:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '122'
        hoofdstuk: VI
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 123.1.a
    text: door uitreiking van een nieuw of vervangend rijbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123
  - number: 123.1.b
    text: |-
      door omwisseling tegen een rijbewijs dat aan de houder door het daartoe bevoegde gezag buiten Nederland is
      afgegeven, voor de categorie of categorieën van motorrijtuigen waarop de omwisseling betrekking heeft, dan wel
      door uitreiking van een rijbewijs dat aan de houder door het daartoe bevoegde gezag buiten Nederland is afgegeven,
      terwijl betrokkene op dat tijdstip houder was van een rijbewijs en in Nederland woonachtig is;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123
  - number: 123.1.c
    text: gedurende de tijd dat aan de houder de bevoegdheid tot het besturen van motorrijtuigen is ontzegd;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123
  - number: 123.1.d
    text: door het onbevoegd daarin aanbrengen van wijzigingen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123
  - number: 123.1.e
    text: door het overlijden van de houder;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123
  - number: 123.1.f
    text: |-
      door ongeldigverklaring, voor de categorie of categorieën waarop de ongeldigverklaring betrekking heeft dan
      wel, indien de ongeldigverklaring betrekking heeft op een deel van de geldigheidsduur, voor dat deel van de
      geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123
  - number: 123.1.g
    text: door wijziging van de geslachtsnaam, de voornamen, de plaats of datum van geboorte of het geslacht van de houder of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123
  - number: 123.1.h
    text: door aangifte van vermissing van het rijbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123
  - number: '123.2'
    text: |-
      Voor de toepassing van het eerste lid, aanhef, wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door
      het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in Nederland woonachtig
      is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123
  - number: 123a
    text: |-
      Een nieuw of vervangend rijbewijs verliest zijn geldigheid indien het drie maanden na de datum waarop het besluit
      tot afgifte is genomen niet is uitgereikt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123a
  - number: 123b.1
    text: |-
      Onverminderd de [artikelen 123, eerste lid][ref1], en [123a][ref2] verliest een rijbewijs zijn geldigheid voor
      alle categorieën waarvoor het is afgegeven en voor de resterende duur van de geldigheid, indien de houder bij
      onherroepelijke rechterlijke uitspraak als bestuurder van een motorrijtuig voor het besturen waarvan een rijbewijs
      is vereist, is veroordeeld wegens overtreding van:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel123a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '123'
        hoofdstuk: VI
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 123a
        hoofdstuk: VI
        afdeling: '7'
  - number: 123b.1.a
    text: |-
      [artikel 6][ref1], voor zover de schuldige verkeerde in de toestand, bedoeld in:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel6
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: 123b.1.a.1°
    text: |-
      [artikel 8, eerste lid][ref1], dan wel voor zover de schuldige na het feit niet heeft voldaan aan een bevel,
      gegeven krachtens [artikel 163, tweede, zesde of zevende lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel163
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '163'
        hoofdstuk: IX
  - number: 123b.1.a.2°
    text: |-
      [artikel 8, tweede, derde of vierde lid][ref1], en het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt
      te zijn dan 570 microgram alcohol per liter uitgeademde lucht dan wel het alcoholgehalte van zijn bloed bij een
      onderzoek hoger blijkt te zijn dan 1,3 milligram alcohol per milliliter bloed, dan wel voor zover de schuldige na
      het feit niet heeft voldaan aan een bevel, gegeven krachtens [artikel 163, tweede, zesde of zevende lid][ref2];


