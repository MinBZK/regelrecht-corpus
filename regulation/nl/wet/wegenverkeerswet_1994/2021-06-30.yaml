        hoofdstuk: IV
        paragraaf: '1'
  - number: 1.1.h
    text: |-
      kentekenbewijs: kentekenbewijs als bedoeld in [artikel 36][ref1] dan wel een kentekenbewijs, afgegeven ter zake van
      de opgave van een kenteken als bedoeld in [artikel 37, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
