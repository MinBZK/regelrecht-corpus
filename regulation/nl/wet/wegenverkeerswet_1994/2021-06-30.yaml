  - number: 123b.2
    text: Voor de toepassing van het eerste lid wordt een strafbeschikking met een veroordeling gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123b
  - number: 123b.3
    text: |-
      Indien een rijbewijs dat op grond van het eerste lid ongeldig zou zijn, reeds eerder zijn geldigheid heeft
      verloren, plaatst de officier van justitie een aantekening in het rijbewijzenregister waaruit blijkt dat de houder
      bij de aanvraag van een nieuw rijbewijs op bij algemene maatregel van bestuur vastgestelde wijze dient aan te
      tonen dat hij beschikt over de rijvaardigheid en de lichamelijke en geestelijke geschiktheid die is vereist voor
      het besturen van een motorrijtuig van de categorie of categorieën waarop de door de houder overgelegde aanvraag
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123b
  - number: 123b.4
    text: |-
      De houder van een rijbewijs dat op grond van dit artikel ongeldig is of ten aanzien waarvan een aantekening is
      geplaatst als bedoeld in het derde lid dient dat rijbewijs, voor zover inlevering niet reeds heeft plaatsgevonden
      op grond van een ander artikel, in te leveren bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123b
  - number: 123b.5
    text: |-
      Voor de toepassing van dit artikel wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door het daartoe
      bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123b
  - number: 123b.6
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel123b
  - number: '124.1'
    text: |-
      Onverminderd de [artikelen 132, tweede lid][ref1], en [134, vierde lid][ref2], wordt een rijbewijs overeenkomstig
      bij algemene maatregel van bestuur vastgestelde regels voor een of meer categorieën van motorrijtuigen of voor een
      deel van de geldigheidsduur ongeldig verklaard indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel134
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '134'
        hoofdstuk: VI
        paragraaf: '6'
        afdeling: '9'
  - number: 124.1.a
    text: |-
      het rijbewijs is afgegeven op grond van door de houder verschafte onjuiste gegevens en het niet zou zijn afgegeven
      indien de onjuistheid van die gegevens ten tijde van de aanvraag bekend zou zijn geweest;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: 124.1.b
    text: na afgifte van het rijbewijs blijkt dat het kennelijk abusievelijk aan de houder is afgegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: 124.1.c
    text: |-
      de houder een schriftelijke verklaring overlegt, waarin hij afstand doet van de bevoegdheid tot het besturen van
      een of meer categorieën van motorrijtuigen waarvoor het rijbewijs is afgegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: 124.1.d
    text: |-
      de houder blijkens een op diens verzoek uitgevoerd onderzoek niet langer beschikt over de lichamelijke of
      geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen van de categorie of categorieën
      waarop het onderzoek betrekking heeft, voor die categorie of categorieën en, indien bij dat onderzoek blijkt dat
      hij tevens niet beschikt over de lichamelijke of geestelijke geschiktheid die is vereist voor het besturen van
      motorrijtuigen van een andere categorie of andere categorieën dan waarop het onderzoek betrekking heeft, tevens
      voor die andere categorie of categorieën;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: 124.1.e
    text: |-
      het als gevonden voorwerp is ontvangen en teruggave aan de houder niet mogelijk is gebleken, mits de houder nog
      geen aanvraag voor een vervangend rijbewijs heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: '124.2'
    text: 'De ongeldigverklaring geschiedt:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: 124.2.a
    text: |-
      in de in het eerste lid, onderdelen a en b, bedoelde gevallen door de Dienst Wegverkeer, indien de
      ongeldigverklaring betrekking heeft op een door deze dienst of een door Onze Minister afgegeven rijbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: 124.2.b
    text: |-
      in de in het eerste lid, onderdelen d en e, bedoelde gevallen door de Dienst Wegverkeer, indien de
      ongeldigverklaring betrekking heeft op een rijbewijs, afgegeven door het daartoe bevoegde gezag in een andere
      lidstaat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of Zwitserland, waarvan de houder in Nederland woonachtig is;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: 124.2.c
    text: |-
      in de in het eerste lid, onderdelen a en b, bedoelde gevallen door degene die is belast met de afgifte van
      rijbewijzen, indien de ongeldigverklaring betrekking heeft op een rijbewijs dat niet is afgegeven door de Dienst
      Wegverkeer of door Onze Minister, dan wel door het daartoe bevoegde gezag in een andere lidstaat van de Europese
      Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of
      Zwitserland;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: 124.2.d
    text: in het in het eerste lid, onderdeel c, bedoelde geval
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: 124.2.d.I
    text: |-
      indien de verklaring wordt overgelegd door een houder die zich ingevolge het in
      [artikel 131, eerste lid, onderdeel b][ref1], bedoelde besluit dient te onderwerpen aan een onderzoek naar zijn
      rijvaardigheid of geschiktheid, door het CBR;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 124.2.d.II
    text: |-
      buiten de gevallen waarin de verklaring wordt overgelegd door een houder die zich ingevolge het in
      [artikel 131, eerste lid, onderdeel b][ref1], bedoelde besluit dient te onderwerpen aan een onderzoek naar
      zijn rijvaardigheid of geschiktheid, door degene die is belast met de afgifte van rijbewijzen, indien de
      ongeldigverklaring betrekking heeft op een rijbewijs dat niet is afgegeven door de Dienst Wegverkeer of door Onze
      Minister dan wel door de Dienst Wegverkeer, indien de ongeldigverklaring betrekking heeft op een door deze dienst
      of een door Onze Minister afgegeven rijbewijs;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 124.2.e
    text: in de in het eerste lid, onderdeel d, bedoelde gevallen door het CBR;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: 124.2.f
    text: |-
      in het in het eerste lid, onderdeel e, bedoelde geval door degene die is belast met de afgifte van rijbewijzen,
      indien de ongeldigverklaring betrekking heeft op een rijbewijs dat niet is afgegeven door het daartoe bevoegde
      gezag in een andere lidstaat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: 124.2.g
    text: |-
      in afwijking van onderdeel c vindt ongeldigverklaring plaats door de Dienst Wegverkeer, indien deze dienst beschikt
      over gegevens uit het buitenland waaruit blijkt dat betrokkene tevens houder is van een rijbewijs afgegeven door
      het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: '124.3'
    text: |-
      De ongeldigverklaring is van kracht met ingang van de zevende dag na die waarop het besluit tot ongeldigverklaring
      aan de houder van het rijbewijs is bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: '124.4'
    text: |-
      De houder van het ongeldig verklaarde rijbewijs dient dat rijbewijs zodra de ongeldigverklaring van kracht is
      geworden, in te leveren bij degene die het ongeldig heeft verklaard.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: '124.5'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld omtrent de wijze waarop de inlevering van
      ongeldig verklaarde rijbewijzen dient plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: '124.6'
    text: |-
      Indien het rijbewijs dat voor ongeldigverklaring op grond van het eerste lid, onderdeel c, in aanmerking komt, zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur, plaatst degene die ingevolge het tweede lid
      is belast met de ongeldigverklaring:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: 124.6.a
    text: |-
      in het in het tweede lid, onderdeel d, aanhef en onder I, bedoelde geval een aantekening in het rijbewijzenregister
      waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op de bij algemene maatregel van
      bestuur vastgestelde wijze dient aan te tonen dat hij, al naar gelang de aard van het onderzoek waarop het in
      [artikel 131, eerste lid, onderdeel b][ref1], bedoelde besluit betrekking heeft, beschikt over de rijvaardigheid,
      de lichamelijke en geestelijke geschiktheid dan wel de rijvaardigheid en de lichamelijke en geestelijke
      geschiktheid die is vereist voor het besturen van motorrijtuigen van de categorie of categorieën waarop de door de
      houder overgelegde verklaring betrekking heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 124.6.b
    text: |-
      in het in het tweede lid, onderdeel d, aanhef en onder II, bedoelde geval een aantekening in het
      rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op de bij algemene
      maatregel van bestuur vastgestelde wijze dient aan te tonen dat hij beschikt over de rijvaardigheid en de
      lichamelijke en geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen van de categorie of
      categorieën waarop de door de houder overgelegde verklaring betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: '124.7'
    text: |-
      Indien het rijbewijs dat voor ongeldigverklaring op grond van het eerste lid, onderdeel d, in aanmerking komt, zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur, plaatst degene die ingevolge het tweede lid
      is belast met de ongeldigverklaring, een aantekening in het rijbewijzenregister waaruit blijkt dat de houder bij de
      aanvraag van een nieuw rijbewijs op de bij algemene maatregel van bestuur vastgestelde wijze dient aan te tonen dat
      hij beschikt over de lichamelijke en geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen
      van de categorie of categorieën waarop het onderzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: '124.8'
    text: |-
      Indien bij het op grond van het eerste lid, onderdeel d, uitgevoerde onderzoek is gebleken dat de resterende
      geldigheidsduur van het rijbewijs korter is dan de termijn waarvoor de houder blijkens het onderzoek naar
      verwachting geschikt zal zijn voor het besturen van motorrijtuigen, plaatst het CBR een aantekening in het
      rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op de bij algemene
      maatregel van bestuur vastgestelde wijze dient aan te tonen dat hij beschikt over de lichamelijke en geestelijke
      geschiktheid die is vereist voor het besturen van motorrijtuigen van de categorie of categorieën waarop het
      onderzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: '124.9'
    text: |-
      Voor de toepassing van het eerste lid, aanhef en onderdelen c, d en e, het derde tot en met het achtste lid wordt
      onder rijbewijs mede verstaan een rijbewijs, afgegeven door het daartoe bevoegde gezag in een andere lidstaat
      van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124
  - number: 124a.1
    text: |-
      Een overeenkomstig [artikel 151g, derde lid][ref1], op het rijbewijs vermeld getuigschrift van vakbekwaamheid of
      getuigschrift van nascholing en een in [artikel 151g, vierde lid][ref2], bedoeld certificaat, kan door de instantie
      die het getuigschrift onderscheidenlijk het certificaat heeft afgegeven ongeldig worden verklaard indien na afgifte
      blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 124a.1.a
    text: |-
      het getuigschrift onderscheidenlijk het certificaat is afgegeven op grond van door de houder verschafte onjuiste
      gegevens en het niet zou zijn afgegeven indien de onjuistheid van die gegevens ten tijde van de afgifte bekend zou
      zijn geweest;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124a
  - number: 124a.1.b
    text: het getuigschrift onderscheidenlijk het certificaat kennelijk abusievelijk aan de houder is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124a
  - number: 124a.2
    text: |-
      De ongeldigverklaring van het getuigschrift of certificaat is van kracht met ingang van de zevende dag na die
      waarop het besluit tot ongeldigverklaring aan de houder van het getuigschrift onderscheidenlijk het certificaat is
      bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124a
  - number: 124a.3
    text: |-
      Zodra de ongeldigverklaring van een getuigschrift of van een certificaat van kracht is geworden, levert de houder
      van een getuigschrift het rijbewijs in bij de instantie die belast is met de afgifte van rijbewijzen en levert de
      houder van een certificaat dat document in bij de instantie die het ongeldig heeft verklaard.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124a
  - number: 124a.4
    text: |-
      Een op het rijbewijs vermeld getuigschrift van vakbekwaamheid of getuigschrift van nascholing van een bestuurder,
      geboren vóór 1 juli 1955, die de basiskwalificatie niet heeft behaald of de nascholing niet met goed gevolg heeft
      voltooid, is van rechtswege ongeldig. Het derde en zesde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124a
  - number: 124a.5
    text: |-
      Onverminderd het eerste lid en [artikel 151g, vierde lid][ref1], verliest het certificaat zijn geldigheid:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 124a.5.a
    text: door het onbevoegd daarin aanbrengen van wijzigingen, of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124a
  - number: 124a.5.b
    text: door het overlijden van de houder.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124a
  - number: 124a.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze van
      bekendmaking van de ongeldigverklaring van een getuigschrift of certificaat, de vernieuwing van rijbewijzen na
      ongeldigverklaring van het daarop vermelde getuigschrift en omtrent de wijze van inlevering van een ongeldig
      verklaard certificaat.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel124a
  - number: '125.1'
    text: |-
      Indien het rijbewijs niet voor alle categorieën waarvoor het is afgegeven, ongeldig is verklaard dan wel indien
      de ongeldigverklaring betrekking heeft op een deel van de geldigheidsduur, wordt door degene die is belast met de
      afgifte van rijbewijzen een nieuw rijbewijs afgegeven dat geldig is voor de categorie of categorieën of voor dat
      deel van de geldigheidsduur waarop de ongeldigverklaring geen betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel125
  - number: '125.2'
    text: |-
      Indien de ongeldigverklaring verband houdt met de noodzaak de rijbevoegdheid die voortvloeit uit een of meer
      categorieën waarvoor het rijbewijs is afgegeven, te beperken door het stellen van eisen aan het motorrijtuig of
      aan de bestuurder daarvan, wordt door degene die is belast met de afgifte van rijbewijzen een nieuw rijbewijs
      afgegeven waarin de noodzakelijk geachte beperkingen ten aanzien van de rijbevoegdheid zijn aangeduid met een bij
      ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel125
  - number: '125.3'
    text: |-
      Voor de toepassing van het eerste en het tweede lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven
      door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in Nederland
      woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel125
  - number: 125a.1
    text: |-
      Voor de toepassing van deze afdeling wordt verstaan onder overheidsorgaan een bestuursorgaan als bedoeld in
      [artikel 1:1, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel125a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 125a.2
    text: |-
      In aanvulling op het eerste lid wordt onder overheidsorgaan mede verstaan de bij ministeriële regeling aangewezen
      personen of instanties die een publieke taak uitoefenen, voor zover die aanwijzing naar het oordeel van Onze
      Minister noodzakelijk is met het oog op een goede uitoefening van hun publieke taak.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel125a
  - number: '126.1'
    text: |-
      Er is een rijbewijzenregister. De Dienst Wegverkeer is beheerder en verwerkingsverantwoordelijke van het
      rijbewijzenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
  - number: '126.2'
    text: |-
      In het rijbewijzenregister worden gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën
      van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1]
      onderscheidenlijk [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], verwerkt
      voor de volgende doeleinden:


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 126.2.a
    text: |-
      een goede uitvoering van het bepaalde bij of krachtens deze wet en voor de handhaving van de bij of krachtens deze
      wet gestelde voorschriften;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
  - number: 126.2.b
    text: |-
      om overheidsorganen te voorzien van gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën
      van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1]
      onderscheidenlijk [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], uit het
      rijbewijzenregister, voor zover zij aangeven deze gegevens nodig te hebben voor een goede uitoefening van hun
      publieke taak;


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 126.2.c
    text: |-
      het ter beschikking stellen van gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën
      van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1]
      onderscheidenlijk [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], aan
      autoriteiten buiten Nederland en instellingen van internationale organisaties, voor zover zij deze gegevens nodig
      hebben voor de uitoefening van hun taak;


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 126.2.d
    text: |-
      het ter beschikking stellen van gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën
      van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1]
      onderscheidenlijk [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], aan
      personen of instanties, niet zijnde de in [artikel 127, eerste tot en met derde lid][ref3], bedoelde instanties,
      voor zover zij deze gegevens nodig hebben voor de uitoefening van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel127
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '127'
        hoofdstuk: VI
        afdeling: '8'
  - number: '126.3'
    text: |-
      In het rijbewijzenregister worden gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën
      van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1]
      onderscheidenlijk [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], verwerkt
      omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 126.3.a
    text: de rijvaardigheid en de geschiktheid van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
  - number: 126.3.b
    text: de aanvraag van rijbewijzen en eventuele weigering daarvan;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
  - number: 126.3.c
    text: de afgifte van rijbewijzen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
  - number: 126.3.d
    text: de op het rijbewijs te vermelden getuigschriften van vakbekwaamheid en getuigschriften van nascholing;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
  - number: 126.3.e
    text: |-
      afgegeven certificaten als bedoeld in [artikel 151g, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 126.3.f
    text: |-
      ontzeggingen van de bevoegdheid tot het besturen van motorrijtuigen, alsmede de uitvoering van
      [artikel 123b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 123b
        hoofdstuk: VI
        afdeling: '7'
  - number: 126.3.g
    text: |-
      besluiten, genomen in het kader van de procedure op grond van de [artikelen 130 tot en met 134][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 126.3.h
    text: |-
      andere maatregelen dan de in de onderdelen f en g genoemde, die leiden tot een beperking of intrekking van de
      rijbevoegdheid of de ongeldigheid van het rijbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
  - number: 126.3.i
    text: de begeleider;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
  - number: 126.3.j
    text: de aanvraag en afgifte van begeleiderspassen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
  - number: 126.3.k
    text: |-
      het verlies van geldigheid of de ongeldigverklaring van begeleiderspassen overeenkomstig
      [artikel 111a, vierde lid][ref1], respectievelijk artikel 111a, vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel111a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 111a
        hoofdstuk: VI
        afdeling: '3'
  - number: '126.4'
    text: |-
      De Dienst Wegverkeer mag persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], verwerken voor zover dit
      verband houdt met de in het tweede lid genoemde doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '126.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld betreffende de inrichting en het
      beheer van het rijbewijzenregister, waaronder mede wordt begrepen de nadere uitwerking van de
      gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], die in het
      rijbewijzenregister worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '126.6'
    text: |-
      De gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens
      en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], blijven bewaard gedurende een
      bij algemene maatregel van bestuur vastgestelde periode die voor verschillende categorieën verschillend kan worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '126.7'
    text: |-
      Voor de toepassing van het derde lid wordt onder rijbewijs mede verstaan een rijbewijs afgegeven door het daartoe
      bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel126
  - number: '127.1'
    text: |-
      Aan overheidsorganen worden door de Dienst Wegverkeer uit het rijbewijzenregister gegevens,
      waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], verstrekt voor zover zij
      aangeven deze gegevens nodig te hebben voor de uitoefening van hun publieke taak.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '127.2'
    text: |-
      Aan bij algemene maatregel van bestuur aangewezen autoriteiten binnen de andere lidstaten van de
      Europese Unie en de andere staten die partij zijn bij de Overeenkomst betreffende de Europese Economische
      Ruimte worden in bij algemene maatregel van bestuur aangewezen gevallen door de Dienst Wegverkeer
      gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '127.3'
    text: |-
      Aan bij algemene maatregel van bestuur aangewezen autoriteiten buiten Nederland, niet zijnde autoriteiten
      uit lidstaten van de Europese Unie of staten die partij zijn bij de Overeenkomst betreffende de Europese
      economische Ruimte worden door de Dienst Wegverkeer in de bij algemene maatregel van bestuur aangewezen
      gevallen gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens
      en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], verstrekt. Gegevens,
      waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens en persoonsgegevens van
      strafrechtelijke aard als bedoeld in paragraaf 3.1 onderscheidenlijk paragraaf 3.2 van de Uitvoeringswet Algemene
      verordening gegevensbescherming, kunnen ook worden verstrekt aan instellingen van internationale organisaties voor
      zover dit ter uitvoering van een verdrag of een bindend besluit van een internationale organisatie vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '127.4'
    text: |-
      Aan bij algemene maatregel van bestuur aangewezen personen of instanties of categorieën van personen
      of instanties, niet zijnde de in het eerste tot en met derde lid bedoelde instanties, kunnen
      desgevraagd door de Dienst Wegverkeer in de bij algemene maatregel van bestuur aangegeven gevallen
      gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], worden verstrekt die zij voor
      hun taak behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '127.5'
    text: |-
      Onverminderd het vierde lid kunnen aan bij ministeriële regeling personen of instanties worden aangewezen aan wie
      persoonsgegevens worden verstrekt die strekken tot bevestiging of ontkenning van de afgifte en de geldigheid van
      rijbewijzen, waaronder begrepen de rijbewijscategorieën, of die strekken tot bevestiging van de identiteit van
      de houder.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel127
  - number: '127.6'
    text: |-
      In afwijking van het eerste tot en met het vierde lid kunnen niet tot personen herleidbare gegevens aan een ieder
      worden verstrekt, tenzij het gegevens betreft die naar het oordeel van de RDW kunnen leiden tot fraude met het
      rijbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel127
  - number: '127.7'
    text: |-
      Bij ministeriële regeling kunnen voor de uitvoering van het eerste tot en met het zesde lid nadere regels worden
      gesteld met betrekking tot de te verstrekken gegevens, de wijze van verstrekking van die gegevens, en kunnen
      voorwaarden worden verbonden aan de verstrekking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel127
  - number: '128.1'
    text: |-
      De in [artikel 127][ref1] bedoelde gegevensverstrekking aan ontvangers vindt plaats op door de Dienst Wegverkeer
      bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel127
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '127'
        hoofdstuk: VI
        afdeling: '8'
  - number: '128.2'
    text: |-
      De in [artikel 127, vierde, vijfde en zesde lid][ref1], bedoelde ontvangers zijn voor de verstrekking
      van gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens
      en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref2] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref3], een door de Dienst Wegverkeer
      vastgesteld tarief verschuldigd. De betrokkene zelf is alleen kosten verschuldigd voor bijkomende kopieën van
      persoonsgegevens, waaronder mede begrepen bijzondere categorieën van persoonsgegevens en persoonsgegevens van
      strafrechtelijke aard als bedoeld in paragraaf 3.1 onderscheidenlijk paragraaf 3.2 van de Uitvoeringswet Algemene
      verordening gegevensbescherming, alsmede voor de verstrekking van gegevens, niet zijnde persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref3]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '127'
        hoofdstuk: VI
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '128.3'
    text: |-
      Onverminderd het tweede lid is degene die op grond van [artikel 127][ref1] een aanvraag indient tot
      geautomatiseerde verstrekking van gegevens, persoonsgegevens, waaronder mede begrepen bijzondere categorieën
      van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref2]
      onderscheidenlijk [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref3], in door de
      Dienst Wegverkeer te bepalen gevallen een door deze dienst te bepalen aansluittarief verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref3]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '127'
        hoofdstuk: VI
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '129'
    text: |-
      De overheidsorganen, bedoeld in [artikel 127, eerste lid][ref1], zijn, voor zover dit is bepaald bij algemene
      maatregel van bestuur, als verwerker bevoegd tot het invoeren, rectificeren en wissen in het rijbewijzenregister
      van de bij algemene maatregel van bestuur aangegeven gegevens, waaronder mede begrepen persoonsgegevens, bijzondere
      categorieën van persoonsgegevens en persoonsgegevens als bedoeld in [paragraaf 3.1][ref2] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref3]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '127'
        hoofdstuk: VI
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '130.1'
    text: |-
      Indien bij de bij algemene maatregel van bestuur aangewezen personen een vermoeden bestaat dat de houder
      van een rijbewijs niet langer beschikt over de rijvaardigheid dan wel over de lichamelijke of geestelijke
      geschiktheid, vereist voor het besturen van een of meer categorieën van motorrijtuigen waarvoor dat rijbewijs
      is afgegeven, doen zij daarvan zo spoedig mogelijk schriftelijk mededeling aan het CBR onder vermelding van de
      feiten en omstandigheden die aan het vermoeden ten grondslag liggen. Bij ministeriële regeling worden de feiten
      en omstandigheden aangewezen die aan het vermoeden ten grondslag dienen te liggen en worden ter zake van de
      uitoefening van deze bevoegdheid nadere regels vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel130
  - number: '130.2'
    text: |-
      Op de eerste vordering van de in [artikel 159, onderdeel a][ref1], bedoelde personen is de bestuurder van een
      motorrijtuig, ten aanzien van wie een vermoeden als bedoeld in het eerste lid bestaat, verplicht tot overgifte van
      het hem afgegeven rijbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '130.3'
    text: |-
      De in het tweede lid bedoelde vordering wordt gedaan indien de betrokken bestuurder de veiligheid op de weg
      zodanig in gevaar kan brengen dat hem met onmiddellijke ingang de bevoegdheid dient te worden ontnomen langer als
      bestuurder van een of meer categorieën van motorrijtuigen, waarvoor het rijbewijs is afgegeven, aan het verkeer
      deel te nemen. Bij ministeriële regeling worden de gevallen aangewezen waarin daarvan sprake is. Het ingevorderde
      rijbewijs wordt gelijktijdig met de schriftelijke mededeling, bedoeld in het eerste lid, aan het CBR toegezonden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel130
  - number: '130.4'
    text: |-
      In geval van toepassing van het tweede lid kan het motorrijtuig, voor zover geen andere bestuurder
      beschikbaar is of de bestuurder niet aanstonds voldoet aan de vordering, onder toezicht of, voor
      zover degene die de vordering heeft gedaan, zulks nodig oordeelt, in bewaring worden gesteld. In het
      laatste geval zijn de [artikelen 170, tweede lid, tweede en derde volzin, vierde en vijfde lid][ref1],
      [171][ref2], [172][ref3] en [173, eerste lid][ref4], van deze wet en de [artikelen 4:116][ref5],
      [4:118 tot en met 4:124][ref6], [5:10][ref7], [5:25, eerste en zesde lid][ref8], [5:29, tweede en derde lid][ref9],
      [5:30, eerste, tweede, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref10] van overeenkomstige
      toepassing. Teruggave van het motorrijtuig vindt slechts plaats, indien aan de vordering is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel172
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel173
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref9]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref10]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
        paragraaf: '1'
      - id: ref2
