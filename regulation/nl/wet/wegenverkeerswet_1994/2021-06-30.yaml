      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing
      in de *Staatscourant*. Het toezicht omvat in ieder geval het periodiek controleren van de ter zake van de
      vervallenverklaring van de tenaamstelling wegens export gevoerde administratie van degene aan wie de erkenning
      is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel66c
  - number: 66c.2
