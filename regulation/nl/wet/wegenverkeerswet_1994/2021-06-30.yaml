  - number: 174a.2
    text: |-
      De op te leggen bestuurlijke boete kan met maximaal 50% worden verhoogd, indien binnen een periode van 48 maanden
      tweemaal voor een zelfde feit, elk afzonderlijk in een periode van maximaal 24 maanden voorafgaand aan dat feit,
      een boete is opgelegd en onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel174a
  - number: 174b.1
    text: |-
