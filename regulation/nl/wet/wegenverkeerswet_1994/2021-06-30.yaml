  - number: '165.1'
    text: |-
      Indien een bij deze wet als misdrijf strafbaar gesteld feit wordt begaan door een bij de ontdekking van het feit
      onbekend gebleven bestuurder van een motorrijtuig, is de eigenaar of houder van dat motorrijtuig verplicht op
      vordering van een der in [artikel 159][ref1] bedoelde personen binnen een daarbij te stellen termijn, die ten
      minste achtenveertig uren bedraagt, de naam en het volledige adres van de bestuurder bekend te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '165.2'
    text: |-
      Het eerste lid geldt niet, indien de eigenaar of houder niet heeft kunnen vaststellen wie de bestuurder was en hem
      daarvan redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel165
  - number: '166.1'
    text: |-
      Indien een bij deze wet als misdrijf strafbaar gesteld feit wordt begaan door een bij de ontdekking van het
      feit onbekend gebleven bestuurder van een motorrijtuig, waarmee een aanhangwagen waarvoor een kenteken is
      vereist, wordt voortbewogen, is de eigenaar of houder van die aanhangwagen verplicht op vordering van een der in
      [artikel 159][ref1] bedoelde personen binnen een daarbij te stellen termijn, die ten minste achtenveertig uren
      bedraagt, de naam en het volledige adres van de bestuurder dan wel van de eigenaar of houder van het motorrijtuig,
      waarmee die aanhangwagen werd voortbewogen, bekend te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '166.2'
    text: |-
      Het eerste lid geldt niet, indien de eigenaar of houder van de aanhangwagen niet heeft kunnen vaststellen wie de
      bestuurder dan wel de eigenaar of houder van het motorrijtuig, waarmee die aanhangwagen werd voortbewogen, was en
      hem daarvan redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel166
  - number: '167'
    text: |-
      De [artikelen 165][ref1] en [166][ref2] zijn mede van toepassing op de eigenaar of houder van een in het buitenland
      geregistreerd motorrijtuig of een in het buitenland geregistreerde aanhangwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel165
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel166
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '165'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '166'
        hoofdstuk: IX
  - number: '168'
    text: |-
      Voor de toepassing van [artikel 160][ref1], voor wat betreft de in het eerste lid bedoelde verplichting
      tot het doen stilhouden van een motorrijtuig en het vierde, vijfde en zevende lid, en van de
      [artikelen 162, eerste lid][ref2], [163][ref3] en [164][ref4] wordt met de bestuurder van een motorrijtuig
      gelijkgesteld degene die overeenkomstig de in [artikel 1, eerste lid, onderdeel n][ref5], bedoelde voorwaarde
      geacht wordt het motorrijtuig onder onmiddellijk toezicht van de bestuurder te besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel160
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel162
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel163
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel164
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '160'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '162'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '163'
        hoofdstuk: IX
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '164'
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '1'
        hoofdstuk: '1'
  - number: '169.1'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van bij of krachtens
      deze wet of bij of krachtens een EU-verordening in verband met de goedkeuring van motorvoertuigen gestelde
      verplichtingen en verboden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel169
  - number: '169.2'
    text: |-
      De ambtenaren die een bevel hebben gegeven als bedoeld in [artikel 160, zevende lid][ref1], zijn bevoegd tot
      oplegging van een last onder bestuursdwang ter handhaving van het bevel.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel160
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '160'
        hoofdstuk: IX
  - number: 169a
    text: |-
      Onverminderd [artikel 169][ref1] is de Dienst Wegverkeer bevoegd tot het opleggen van een last onder bestuursdwang
      ter handhaving van de verplichtingen en verboden in de bij of krachtens [artikel 29, derde lid][ref2], en
      [31][ref3], genoemde artikelen van een EU-verordening in verband met de goedkeuring van motorvoertuigen alsmede
      van de bij of krachtens de [artikelen 25][ref4], [27][ref5] en [30, derde lid][ref6] bedoelde verplichtingen en
      verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel169
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel27
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel30
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel169a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '169'
        hoofdstuk: X
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '29'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '31'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '25'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '27'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0006622
        artikel: '30'
        hoofdstuk: III
        paragraaf: '2'
  - number: '170.1'
    text: |-
      Tot de bevoegdheid van burgemeester en wethouders tot oplegging van een last onder bestuursdwang als bedoeld in
      [artikel 125 van de Gemeentewet][ref1], behoort de bevoegdheid tot het overbrengen en in bewaring stellen van een
      op een weg staand voertuig, indien met het voertuig een bij of krachtens deze wet vastgesteld voorschrift wordt
      overtreden en bovendien verwijdering van het voertuig noodzakelijk is in verband met


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel125
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '125'
  - number: 170.1.a
    text: het belang van de veiligheid op de weg, of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel170
  - number: 170.1.b
    text: het belang van de vrijheid van het verkeer, of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel170
  - number: 170.1.c
    text: het vrijhouden van aangewezen weggedeelten en wegen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel170
  - number: '170.2'
    text: |-
      De [artikelen 5:24][ref1], [5:25, tweede tot en met vierde lid][ref2], [5:29, vijfde lid][ref3],
      [5:30, derde lid][ref4], en [5:31 van de Algemene wet bestuursrecht][ref5] zijn niet van
      toepassing. Bij de toepassing van [artikel 5:25 van de Algemene wet bestuursrecht][ref6] treedt
      de rechthebbende die het voertuig afhaalt, in de plaats van de overtreder. Voor de toepassing van
      [artikel 5:30 van de Algemene wet bestuursrecht][ref7] wordt de omstandigheid dat een voertuig niet is afgehaald,
      gelijkgesteld met de omstandigheid dat het voertuig niet kan worden teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '170.3'
    text: |-
      Burgemeester en wethouders plegen regelmatig overleg met de officier van justitie over de uitoefening van de in het
      eerste lid bedoelde bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel170
  - number: '170.4'
    text: |-
      Burgemeester en wethouders dragen er zorg voor dat in een daartoe aangelegd register aantekening wordt gehouden van
      de gevallen waarin de in het eerste lid bedoelde bevoegdheid wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel170
  - number: '170.5'
    text: |-
      Bij toepassing van het eerste lid wordt onder rechthebbende verstaan: degene die ofwel eigenaar is van het voertuig
      ofwel anders dan als bezitter het voertuig ten tijde van de overtreding ten gebruike onder zich had. Hierbij geldt
      [artikel 1, tweede lid][ref1], niet.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
        hoofdstuk: '1'
  - number: '170.6'
    text: |-
      De in het eerste lid bedoelde bevoegdheid wordt niet uitgeoefend, indien de rechthebbende het voertuig
      verwijdert voordat met de overbrenging een aanvang wordt gemaakt. Hij is alsdan de kosten verbonden aan de
      voorbereiding van de overbrenging, verschuldigd. De [artikelen 4:116][ref1], [4:118 tot en met 4:124][ref2], en
      [5:10 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '171.1'
    text: |-
      Een beschikking tot oplegging van een last onder bestuursdwang overeenkomstig [artikel 170, eerste lid][ref1],
      wordt bekendgemaakt:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
        paragraaf: '1'
  - number: 171.1.a
    text: aan de rechthebbende die het voertuig afhaalt, of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel171
  - number: 171.1.b
    text: |-
      indien het voertuig binnen achtenveertig uur na de inbewaringstelling niet is afgehaald, zo mogelijk binnen een
      week:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel171
  - number: 171.1.b.1°
    text: aan degene aan wie het kenteken is opgegeven, indien het voertuig een kenteken voert;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel171
  - number: 171.1.b.2°
    text: |-
      aan degene die aangifte heeft gedaan, indien blijkt dat ter zake van het voertuig aangifte van vermissing is
      gedaan, of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel171
  - number: 171.1.b.3°
    text: in nader bij ministeriële regeling vast te stellen gevallen op de daarbij aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel171
  - number: '171.2'
    text: |-
      Bij de bekendmaking krachtens het eerste lid, onderdeel *b*, wordt gewezen op het verschuldigd zijn van kosten,
      verbonden aan de oplegging van een last onder bestuursdwang.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel171
  - number: '172.1'
    text: |-
      Tot de kosten, verbonden aan de oplegging van een last onder bestuursdwang als bedoeld in
      [artikel 170, eerste lid][ref1], worden gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
        paragraaf: '1'
  - number: 172.1.a
    text: de kosten die verband houden met de overbrenging en bewaring;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel172
  - number: 172.1.b
    text: de kosten die verband houden met de bekendmaking van de beschikking tot overbrenging en inbewaringstelling, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel172
  - number: 172.1.c
    text: de kosten van verkoop, eigendomsoverdracht om niet of vernietiging.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel172
  - number: '172.2'
    text: |-
      Verkoop, eigendomsoverdracht om niet of vernietiging vindt niet plaats binnen twee weken na de bekendmaking van de
      beschikking tot oplegging van een last onder bestuursdwang krachtens [artikel 171, eerste lid, onderdeel b][ref1].
      De opbrengst van verkoop of de geschatte sloopwaarde bij vernietiging wordt in mindering gebracht op de kosten,
      verbonden aan de oplegging van een last onder bestuursdwang.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel171
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '171'
        hoofdstuk: X
        paragraaf: '1'
  - number: '172.3'
    text: |-
      Burgemeester en wethouders betalen het bedrag van de kosten, verbonden aan de oplegging van een last onder
      bestuursdwang, terug, indien:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel172
  - number: 172.3.a
    text: niet tot overbrenging en inbewaringstelling had mogen worden overgegaan;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel172
  - number: 172.3.b
    text: |-
      de omstandigheden waaronder de overtreding is begaan, van dien aard waren dat de kosten redelijkerwijs niet
      verschuldigd zijn, of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel172
  - number: 172.3.c
    text: |-
      aannemelijk is dat het voertuig tegen de wil van de rechthebbende is gebruikt en hij dit gebruik redelijkerwijs
      niet heeft kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel172
  - number: '172.4'
    text: |-
      In een geval als bedoeld in het derde lid, onderdeel c, zijn de kosten verschuldigd door degene
      die de overtreding heeft begaan. De [artikelen 4:116][ref1], [4:118 tot en met 4:124][ref2] en
      [5:10 van de Algemene wet bestuursrecht][ref3] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '172.5'
    text: |-
      Indien de kosten, verbonden aan de oplegging van een last onder bestuursdwang, die door de rechthebbende zijn
      betaald, te hoog zijn berekend, betalen burgemeester en wethouders het te veel betaalde terug.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel172
  - number: '172.6'
    text: |-
      Indien de in het derde lid, onderdeel *b*, bedoelde omstandigheden van dien aard waren dat de kosten redelijkerwijs
      niet volledig verschuldigd zijn, betalen burgemeester en wethouders het niet verschuldigde bedrag terug.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel172
  - number: '172.7'
    text: |-
      Bij toepassing van het derde lid, onderdeel a, betalen burgemeester en wethouders tevens een redelijke
      schadeloosstelling aan de rechthebbende die het voertuig heeft afgehaald. Indien het voertuig ten tijde van de
      overtreding in gebruik was bij een ander dan de rechthebbende die het voertuig heeft afgehaald, treedt die ander
      voor de toepassing van dit lid in de plaats van de rechthebbende die het voertuig heeft afgehaald.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel172
  - number: '172.8'
    text: |-
      Indien aantoonbaar is dat tijdens de overbrenging en bewaring schade aan het voertuig is toegebracht, is de
      gemeente gehouden deze schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel172
  - number: '173.1'
    text: 'Bij algemene maatregel van bestuur worden:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel173
  - number: 173.1.a
    text: |-
      de soorten van de in [artikel 170, eerste lid, onderdeel c][ref1], bedoelde weggedeelten en wegen aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
        paragraaf: '1'
  - number: 173.1.b
    text: |-
      nadere regels vastgesteld over de registratie van gegevens in geval van toepassing van
      [artikel 170, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
        paragraaf: '1'
  - number: 173.1.c
    text: |-
      nadere regels vastgesteld over de berekening van de kosten, verbonden aan de oplegging van een last onder
      bestuursdwang, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel173
  - number: 173.1.d
    text: |-
      de overige regels vastgesteld die voor de uitvoering van de [artikelen 170 tot en met 172][ref1] nodig worden
      geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
        paragraaf: '1'
  - number: '173.2'
    text: |-
      Bij gemeentelijke verordening worden nadere regels gesteld ter uitvoering van de
      [artikelen 170 tot en met 172][ref1] en de in het eerste lid bedoelde algemene maatregel van bestuur. Die regels
      betreffen in elk geval


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
        paragraaf: '1'
  - number: 173.2.a
    text: |-
      de aanwijzing van de plaats, onderscheidenlijk de plaatsen, waar verwijderde voertuigen in bewaring worden gesteld,
      en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel173
  - number: 173.2.b
    text: de berekening van de kosten, verbonden aan de oplegging van een last onder bestuursdwang, en voorts
