  - number: 1.1.i
    text: |-
      kentekenregister: register, bedoeld in [artikel 42][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel42
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '42'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 1.1.j
    text: |-
      keuringsbewijs: keuringsbewijs als bedoeld in [artikel 72][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 1.1.k
    text: 'keuringsrapport: keuringsbewijs of een beschikking tot weigering van de afgifte van een keuringsbewijs;'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.l
    text: |-
      rijbewijs: rijbewijs, bedoeld in [artikel 107][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
        hoofdstuk: VI
        afdeling: '1'
  - number: 1.1.m
    text: |-
      rijbewijzenregister: register, bedoeld in [artikel 126][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '126'
        hoofdstuk: VI
        afdeling: '8'
  - number: 1.1.n
    text: |-
      bestuurder van een motorrijtuig: degene die het motorrijtuig bestuurt of degene die, overeenkomstig de bij algemene
      maatregel van bestuur gestelde voorwaarde, wordt geacht het motorrijtuig onder zijn onmiddellijk toezicht te doen
      besturen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.o
    text: 'houder van een motorrijtuig of een aanhangwagen: degene die het voertuig:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.o.1°
    text: op grond van een overeenkomst van huurkoop onder zich heeft,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.o.2°
    text: in vruchtgebruik heeft, of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.o.3°
    text: anderszins, anders dan als eigenaar of bezitter, tot duurzaam gebruik onder zich heeft;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.q
    text: |-
      Dienst Wegverkeer: de in [artikel 4a][ref1] bedoelde dienst;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4a
        hoofdstuk: IA
        paragraaf: '1'
  - number: 1.1.r
    text: |-
      het CBR: het in [artikel 4z][ref1] bedoelde bureau;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4z
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4z
        hoofdstuk: IB
        paragraaf: '1'
  - number: 1.1.s
    text: |-
      *nationale typegoedkeuring of -individuele goedkeuring:* goedkeuring als bedoeld in
      [artikel 21, tweede lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: 1.1.t
    text: |-
      *VN/ECE-goedkeuring:* goedkeuring als bedoeld in [artikel 21, tweede lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: 1.1.ta
    text: |-
      *kwetsbare weggebruikers:* niet-gemotoriseerde weggebruikers, zoals fietsers en voetgangers en weggebruikers die
      gebruik maken van gemotoriseerde voertuigen zoals twee- of driewielers;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.u
    text: 'schadevoertuig: voertuig dat ten gevolge van een beschadiging niet langer deugdelijk van bouw en inrichting is;'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.y
    text: |-
      *bewegwijzering:* verkeerstekens die worden geplaatst of verwijderd teneinde weggebruikers in staat te stellen hun
      afstand tot of route naar een bestemming te bepalen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.z
    text: |-
      *begeleiden:* het actief coachen, het geven van suggesties ter verbetering van het rijgedrag, het wijzen op fouten
      en onzorgvuldigheden in het rijgedrag van de bestuurder van een motorrijtuig van de rijbewijscategorie B die op de
      leeftijd van zeventien jaren zijn rijbewijs B heeft behaald totdat die bestuurder de leeftijd van achttien jaren
      heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.za
    text: |-
      *begeleider:* op de begeleiderspas vermelde persoon die is gezeten op de zitplaats naast de bestuurder die de
      bestuurder van een motorrijtuig van de rijbewijscategorie B die overeenkomstig [artikel 111a, eerste lid][ref1],
      zijn rijbewijs B heeft verkregen begeleidt;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel111a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 111a
        hoofdstuk: VI
        afdeling: '3'
  - number: 1.1.zb
    text: |-
      *begeleiderspas:* pas die aan een persoon is afgegeven die op de leeftijd van zeventien jaren zijn rijbewijs B
      heeft behaald en waarop de naam van zijn begeleiders is vermeld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1a
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt, tenzij anders blijkt, verstaan
      onder goedkeuring, typegoedkeuring, EU-typegoedkeuring, aanhangwagen, systeem, onderdeel, technische eenheid,
      voertuigdelen, uitrustingsstukken, markttoezicht, goedkeuringsinstantie, technische dienst, fabrikant,
      marktdeelnemer, in de handel brengen, op de markt aanbieden, in gebruik nemen, manipulatie-instrument en
      manipulatiestrategie hetgeen daaronder wordt verstaan in de desbetreffende EU-verordening in verband met de
      goedkeuring van motorvoertuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: '1.2'
    text: |-
      Indien de eigenaar van een motorrijtuig of een aanhangwagen niet tevens bezitter is, treedt de bezitter voor de
      toepassing van het bepaalde bij of krachtens deze wet voor de eigenaar in de plaats.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: '1.3'
    text: |-
      Degene aan wie een kenteken is opgegeven voor een motorrijtuig of een aanhangwagen wordt, tenzij anders blijkt,
      voor de toepassing van het bepaalde bij of krachtens deze wet beschouwd als eigenaar of houder van dat motorrijtuig
      of die aanhangwagen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: '1.4'
    text: |-
      Voor de toepassing van de [hoofdstukken III tot en met V][ref1] van deze wet worden vennootschappen zonder
      rechtspersoonlijkheid mede als rechtspersoon aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: '2.1'
    text: 'De krachtens deze wet vastgestelde regels kunnen strekken tot:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: 2.1.a
    text: het verzekeren van de veiligheid op de weg;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: 2.1.b
    text: het beschermen van weggebruikers en passagiers;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: 2.1.c
    text: het in stand houden van de weg en het waarborgen van de bruikbaarheid daarvan;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: 2.1.d
    text: het zoveel mogelijk waarborgen van de vrijheid van het verkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: '2.2'
    text: 'De krachtens deze wet vastgestelde regels kunnen voorts strekken tot:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: 2.2.a
    text: |-
      het voorkomen of beperken van door het verkeer veroorzaakte overlast, hinder of schade alsmede de gevolgen voor het
      milieu, bedoeld in de [Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 2.2.b
    text: |-
      het voorkomen of beperken van door het verkeer veroorzaakte aantasting van het karakter of van de functie van
      objecten of gebieden;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: 2.2.c
    text: de bestrijding van de epidemie van covid-19.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: '2.3'
    text: 'De krachtens deze wet vastgestelde regels kunnen voorts strekken tot:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: 2.3.a
    text: het bevorderen van een doelmatig of zuinig energiegebruik;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: 2.3.b
    text: het waarborgen van het op juiste wijze in rekening brengen van tarieven voor het gebruik van de weg;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: 2.3.c
    text: het gebruik en de waarborging van de juistheid van de registers die ingevolge deze wet worden bijgehouden;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: 2.3.d
    text: het voorkomen en bestrijden van fraude;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: 2.3.e
    text: |-
      de regeling van positie, inrichting en werkwijze, alsmede het uitoefenen van toezicht op zelfstandige
      bestuursorganen die taken verrichten op het terrein van deze wet.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: '2.4'
    text: |-
      De krachtens deze wet vastgestelde regels kunnen voorts strekken ter uitvoering van verdragen of van besluiten
      van volkenrechtelijke organisaties of van één of meer instellingen van de Europese Unie, al dan niet gezamenlijk,
      op het terrein van goedkeuring, op de markt aanbieden, in de handel brengen, registreren en in gebruik nemen
      van voertuigen en systemen, onderdelen, technische eenheden, voertuigdelen, uitrustingsstukken en voorzieningen
      die voor dergelijke voertuigen en aanhangwagens daarvan zijn ontworpen en gebouwd en van voorzieningen die ter
      bescherming van inzittenden van voertuigen en kwetsbare weggebruikers zijn ontworpen en gebouwd, in verband met
      de bescherming van de gezondheid, de veiligheid, het milieu of andere aspecten van de bescherming van het openbaar
      belang.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: '2.5'
    text: |-
      De vaststelling van regels bij ministeriële regeling ter uitvoering van het bij of krachtens deze wet bepaalde
      geschiedt in overeenstemming met Onze bij algemene maatregel van bestuur aangewezen ministers, indien deze regels
      strekken tot behartiging van de belangen, bedoeld in het tweede dan wel het derde lid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2
  - number: 2a
    text: |-
      Provincies, gemeenten en waterschappen behouden hun bevoegdheid om bij verordening regels vast te stellen ten
      aanzien van het onderwerp waarin deze wet voorziet, voorzover die regels niet in strijd zijn met de bij of
      krachtens deze wet vastgestelde regels en voorzover verkeerstekens krachtens deze wet zich daar niet toe lenen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2a
  - number: 2b
    text: |-
      De voordracht voor een krachtens deze wet vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel2b
  - number: '3.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone
      omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President,
      [artikel 4, derde en vierde lid][ref3], in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011389#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel4
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0011389
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '4'
        hoofdstuk: '1'
  - number: '3.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen wordt onverwijld een voorstel van wet aan de Tweede Kamer
      gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel3
  - number: '3.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel3
  - number: '3.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld; buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel3
  - number: '3.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel3
  - number: '3.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel3
  - number: '4.1'
    text: |-
      Het bepaalde bij of krachtens deze wet en provinciale en plaatselijke verordeningen gelden slechts voor zover zulks
      bij algemene maatregel van bestuur is bepaald:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4
  - number: 4.1.a
    text: ten aanzien van voertuigen, voor zover die worden gebezigd ten behoeve van de strijdkrachten;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4
  - number: 4.1.b
    text: voor militairen te voet, voor zover zij zich ter uitoefening van de dienst op de weg bevinden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4
  - number: '4.2'
    text: |-
      Buiten de omstandigheden, bedoeld in het derde lid en het vijfde lid, kunnen in de gevallen waarin het bepaalde
      bij of krachtens deze wet en provinciale en plaatselijke verordeningen niet ingevolge het eerste lid van toepassing
      is verklaard, bij algemene maatregel van bestuur regels worden vastgesteld en kunnen bij ministeriële regeling ter
      uitvoering daarvan nadere regels worden vastgesteld:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4
  - number: 4.2.a
    text: ten aanzien van voertuigen, voor zover die worden gebezigd ten behoeve van de strijdkrachten;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4
  - number: 4.2.b
    text: voor militairen te voet, voor zover zij zich ter uitoefening van de dienst op de weg bevinden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4
  - number: '4.3'
    text: |-
      Ingeval buitengewone omstandigheden dit noodzakelijk maken, kan bij koninklijk besluit worden bepaald dat van in
      dat besluit aan te wijzen bepalingen, genoemd in de algemene maatregel van bestuur bedoeld in het eerste lid, kan
      worden afgeweken door bestuurders van voertuigen gebezigd ten behoeve van de strijdkrachten en door militairen te
      voet die zich op de weg bevinden ter uitoefening van de dienst.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4
  - number: '4.4'
    text: |-
      Ingeval buitengewone omstandigheden dit noodzakelijk maken, kan bij koninklijk besluit worden bepaald dat ten
      aanzien van voertuigen van bij algemene maatregel van bestuur aan te wijzen overheidsdiensten, het bepaalde bij of
      krachtens deze wet en provinciale en plaatselijke verordeningen slechts gelden voor zover zulks bij die maatregel
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4
  - number: '4.5'
    text: |-
      In geval van de beperkte of de algemene noodtoestand is het militair gezag bevoegd voor het gebied waarvoor op
      grond van [artikel 7, eerste lid][ref1], of [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2],
      bepalingen uit de [Oorlogswet voor Nederland][ref3] in werking zijn gesteld, regels vast te stellen inzake het
      verkeer op de weg, afwijkende van het bepaalde bij of krachtens deze wet en van provinciale en plaatselijke
      verordeningen, alsmede van de in het tweede lid bedoelde, bij algemene maatregel van bestuur vastgestelde regels,
      voor zoveel dat door het gezag ter uitvoering van de militaire taak ter handhaving van de uitwendige of inwendige
      veiligheid nodig wordt geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007983
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007983
  - number: '4.6'
    text: |-
      Door de vorige leden wordt de gewone aansprakelijkheid uit andere wettelijke bepalingen voortvloeiende, niet
      opgeheven of verminderd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4
  - number: 4a.1
    text: |-
      Er is een Dienst Wegverkeer, in het maatschappelijk verkeer aangeduid als RDW. De dienst bezit
      rechtspersoonlijkheid en is gevestigd te Zoetermeer.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4a
  - number: 4a.2
    text: |-
      Op de Dienst Wegverkeer is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing, met uitzondering van
      [artikel 15 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel15
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '15'
  - number: 4b.1
    text: 'De Dienst Wegverkeer is belast met de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.1.a
    text: |-
      het verrichten van taken en handelingen en het nemen van besluiten die op grond van EU-verordeningen in verband
      met de goedkeuring van motorvoertuigen worden verricht door een goedkeuringsinstantie en het verrichten van andere
      taken en handelingen en in verband hiermee te nemen besluiten voor zover deze taken, handelingen en besluiten
      onlosmakelijk verbonden zijn met het proces van goedkeuring van voertuigen en systemen, onderdelen, technische
      eenheden, voertuigdelen, uitrustingsstukken en voorzieningen die voor dergelijke voertuigen en aanhangwagens
      daarvan zijn ontworpen en gebouwd en van voorzieningen die ter bescherming van inzittenden van voertuigen en
      kwetsbare weggebruikers zijn ontworpen en gebouwd;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.1.a1
    text: |-
      de nakoming van overige, niet in onderdeel a bedoelde verplichtingen die op grond van EU-verordeningen in
      verband met de goedkeuring van motorvoertuigen op een goedkeuringsinstantie rusten of daar onlosmakelijk mee zijn
      verbonden;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.1.b
    text: |-
      het verrichten van taken en handelingen en het nemen van besluiten in verband met de nationale typegoedkeuring en
      -individuele goedkeuring en VN/ECE-goedkeuring;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.1.b6
    text: |-
      het vaststellen en vastleggen van manipulatie van voertuigsystemen en het melden hiervan aan de bevoegde
      autoriteiten,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.1.c
    text: |-
      het opgeven van kentekens voor motorrijtuigen en aanhangwagens, het ter zake van die opgaven inschrijven en
      tenaamstellen van motorrijtuigen en aanhangwagens in het kentekenregister, bedoeld in [artikel 42][ref1], en
      het ter zake van die inschrijving afgeven van kentekenbewijzen, het beëindigen van de inschrijving en het doen
      vervallen van de tenaamstelling, het schorsen van de geldigheid van kentekenbewijzen, het ongeldig verklaren
      van kentekenbewijzen, het geldig verklaren van kentekenbewijzen, alsmede het houden van toezicht als bedoeld in
      [artikel 37, vierde lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '42'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 4b.1.d
    text: het afgeven van keuringsrapporten voor motorrijtuigen en aanhangwagens,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.1.f
    text: |-
      het verlenen van een gewijzigde goedkeuring aan gekentekende motorrijtuigen en aanhangwagens waarvan de bouw of de
      inrichting zodanig is gewijzigd dat niet langer wordt voldaan aan de eerder verleende goedkeuring, dan wel waarvan
      het kentekenbewijs is ingevorderd;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.1.g
    text: |-
      het afgeven van rijbewijzen in de gevallen, bedoeld in [artikel 116, eerste lid][ref1], alsmede het
      ongeldigverklaren van rijbewijzen in de in deze wet bepaalde gevallen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel116
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '116'
        hoofdstuk: VI
        afdeling: '5'
  - number: 4b.1.g1
    text: het afgeven van een verklaring in verband met de aanvraag van een rijbewijs,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.1.h
    text: |-
      het verwerken van gegevens met betrekking tot opgegeven kentekens, afgegeven kentekenbewijzen, afgegeven
      keuringsrapporten, krachtens [artikel 149a][ref1] verleende ontheffingen, afgegeven rijbewijzen, fietsen, gebruik
      van motorrijtuigen en de mobiele objecten, bedoeld in [artikel 70l, eerste lid][ref2], alsmede met betrekking tot
      rechterlijke uitspraken houdende ontzegging van de bevoegdheid tot het besturen van motorrijtuigen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel70l
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149a
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 70l
        hoofdstuk: IVA
  - number: 4b.1.i
    text: |-
      het overeenkomstig de bij of krachtens deze wet vastgestelde bepalingen verstrekken van gegevens uit de in
      onderdeel h bedoelde registers alsmede het houden van toezicht als bedoeld in [artikel 45a, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel45a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 45a
        hoofdstuk: IV
        paragraaf: '3'
  - number: 4b.1.i1
    text: |-
      het overeenkomstig het bij of krachtens deze wet bepaalde doen van informatieverzoeken aan de daartoe bevoegde
      autoriteiten van een andere lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland, ten behoeve van de beoordeling door de Dienst Wegverkeer
      of een andere rijbewijsafgevende autoriteit in Nederland van aanvragen tot afgifte van een rijbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.1.j
    text: |-
      het verlenen van erkenningen als bedoeld in de [artikelen 61a][ref1], [62][ref2], [66a][ref3], [70a][ref4],
      [83][ref5], [92, eerste lid][ref6], en [101][ref7] en het verlenen van de bevoegdheid voertuigen aan een keuring te
      onderwerpen als bedoeld in [artikel 85a][ref8] alsmede het schorsen, wijzigen en intrekken van erkenningen en van
      de bevoegdheid voertuigen aan een keuring te onderwerpen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel66a
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel83
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel92
      [ref7]: https://wetten.overheid.nl/BWBR0006622#Artikel101
      [ref8]: https://wetten.overheid.nl/BWBR0006622#Artikel85a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 61a
        hoofdstuk: IV
        paragraaf: 4c
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 66a
        hoofdstuk: IV
        paragraaf: 5a
      - id: ref4
        bwb_id: BWBR0006622
        artikel: 70a
        hoofdstuk: IV
        paragraaf: '7'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '83'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref6
        bwb_id: BWBR0006622
        artikel: '92'
        hoofdstuk: V
        paragraaf: 6a
      - id: ref7
        bwb_id: BWBR0006622
        artikel: '101'
        hoofdstuk: V
        paragraaf: '8'
      - id: ref8
        bwb_id: BWBR0006622
        artikel: 85a
        hoofdstuk: V
        paragraaf: '5'
  - number: 4b.1.j1
    text: |-
      het aanwijzen van een technische dienst voor het uitvoeren van bepaalde tests ten behoeve van het verlenen van
      typegoedkeuringen of individuele goedkeuringen, dan wel voor het uitvoeren van een periodieke herkwalificatie
      of voor het uitvoeren van bepaalde toezichtstaken voor zover deze taak niet voortvloeit uit de taak van
      goedkeuringsinstantie als bedoeld in onderdeel a,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.1.k
    text: |-
      het houden van toezicht op de naleving van de verplichtingen die voortvloeien uit de in onderdeel j bedoelde
      erkenningen en van de bevoegdheid voertuigen aan een keuring te onderwerpen alsmede op de verplichtingen die
      voortvloeien uit de in onderdeel j1 bedoelde aanwijzing als technische dienst,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.1.l
    text: |-
      het verlenen van ontheffingen als bedoeld in [artikel 149a][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149a
        hoofdstuk: VII
  - number: 4b.1.m
    text: |-
      het opsporen van bij of krachtens deze wet strafbaar gestelde feiten, voor zover de ambtenaren van de Dienst
      Wegverkeer daarmee ingevolge [artikel 159][ref1] zijn belast, en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: 4b.1.n
    text: |-
      het met inachtneming van het bepaalde in [artikel 4q][ref1] vaststellen en heffen van de tarieven, alsmede
      het vaststellen van de wijze van betaling van deze tarieven, voor het verrichten van taken waarvoor de Dienst
      Wegverkeer bij of krachtens deze wet bevoegd is, alsmede voor de bij of krachtens andere wetten opgedragen taken;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4q
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4q
        hoofdstuk: IA
        paragraaf: '6'
  - number: 4b.1.o
    text: |-
      het zorg dragen voor de productie van rijbewijzen, het transport en de aflevering ervan en het beheer van de
      daartoe benodigde voorzieningen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.1.p
    text: het attenderen van houders van een rijbewijs op het verloop van de geldigheidsduur,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.1.q
    text: |-
      het vaststellen en heffen van een tarief, met inachtneming van [artikel 4q][ref1], voor overige verstrekkingen of
      dienstverleningen die voortvloeien uit de vervulling van de aan de Dienst Wegverkeer opgedragen wettelijke taken,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4q
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4q
        hoofdstuk: IA
        paragraaf: '6'
  - number: 4b.1.r
    text: |-
      het voldoen aan de verplichting tot het opstellen van een gids betreffende het brandstofverbruik en de CO-uitstoot
      van personenauto’s op grond van richtlijn 1999/94/EG van het Europees Parlement en de Raad van 13 december 1999
      betreffende de beschikbaarheid van consumenteninformatie over het brandstofverbruik en de CO-uitstoot bij de
      verbranding van nieuwe personenauto’s (PbEG 1999, L12/16) en de verplichting tot het verzamelen van gegevens over
      nieuwe personenauto’s en het vaststellen van informatie voor de controle van de CO-emissies en mededeling doen van
      die gegevens aan de Commissie op grond van Verordening (EU) nr. 2019/631 van het Europees Parlement en de Raad van
      17 april 2019 tot vaststelling van CO-emissienormen voor nieuwe personenauto's en nieuwe lichte bedrijfsvoertuigen,
      en tot intrekking van Verordeningen (EG) nr. 443/2009 en (EU) nr. 510/2011 (PbEU 2019, L111);
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.1.s
    text: |-
      het behandelen van aanvragen tot afgifte van een begeleiderspas en de afgifte van die begeleiderspas, het
      registreren van gegevens in het rijbewijzenregister betreffende de begeleiderspas.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.2
    text: 'Voorts is de Dienst Wegverkeer belast met:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.2.a
    text: de bij of krachtens andere wetten opgedragen taken, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.2.b
    text: andere door Onze Minister opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
  - number: 4b.3
    text: |-
      Met inachtneming van [artikel 4q][ref1] worden de op grond van het tweede lid aan de Dienst Wegverkeer opgedragen
      taken, verstrekkingen of dienstverleningen die voortvloeien uit de uitvoering van deze taken, verricht tegen
      betaling op een door deze dienst vastgestelde wijze van door deze dienst vastgestelde tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4q
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4q
        hoofdstuk: IA
        paragraaf: '6'
  - number: 4b.4
    text: |-
      [Artikel 9, derde lid, van de Wet hergebruik van overheidsinformatie][ref1] is van toepassing op de tarieven,
      bedoeld in het eerste lid, onderdeel n.


      [ref1]: https://wetten.overheid.nl/BWBR0036795#Artikel9
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0036795
        artikel: '9'
  - number: 4c
    text: |-
      Beleidsregels omtrent de uitoefening van de bij of krachtens andere wetten dan deze wet aan de Dienst Wegverkeer
      opgedragen taken worden door Onze Minister vastgesteld in overeenstemming met Onze Minister(s) wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4c
  - number: 4d
    text: De Dienst Wegverkeer heeft een directie en een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4d
  - number: 4e.1
    text: De directie bestaat uit maximaal 3 leden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4e
  - number: 4e.2
    text: Het lidmaatschap van de directie is onverenigbaar met het lidmaatschap van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4e
  - number: 4e.3
    text: |-
      De leden van de directie worden benoemd voor een tijdvak van maximaal vier jaar en zijn aansluitend éénmalig voor
      een tijdvak van maximaal vier jaar herbenoembaar. In het geval van bijzondere omstandigheden binnen de organisatie
      van de Dienst Wegverkeer kan een lid van de directie bij afloop van de tweede benoemingstermijn terstond opnieuw
      worden benoemd voor een tijdvak van maximaal twee jaar.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4e
  - number: 4f.1
    text: De directie is belast met de dagelijkse leiding van de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4f
  - number: 4f.2
    text: |-
      Alle bevoegdheden van de Dienst Wegverkeer die niet bij of krachtens de wet aan de raad van toezicht zijn
      opgedragen, komen toe aan de directie.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4f
  - number: 4g.1
    text: De directie vertegenwoordigt de Dienst Wegverkeer in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4g
  - number: 4g.2
    text: |-
      De directie kan onder haar verantwoordelijkheid de vertegenwoordiging, bedoeld in het eerste lid, opdragen aan een
      of meer directieleden of andere personen. Zij kan bepalen dat deze vertegenwoordiging uitsluitend betrekking heeft
      op bepaalde onderdelen van de taak van de Dienst Wegverkeer dan wel op bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4g
  - number: 4h
    text: |-
      In geval van schorsing of ontstentenis van een lid van de directie voorziet Onze Minister in de waarneming van
      diens functie.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4h
  - number: 4i.1
    text: |-
      De directie verstrekt de raad van toezicht tijdig de voor de uitoefening van diens taak benodigde inlichtingen en
      andere gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4i
  - number: 4i.2
    text: |-
      De directie legt jaarlijks, en voorts tussentijds indien hiertoe naar het oordeel van de raad van toezicht
      aanleiding bestaat, aan de raad van toezicht verantwoording af over het door haar gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4i
  - number: 4j.1
    text: De raad van toezicht bestaat uit vijf leden, waaronder de voorzitter.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4j
  - number: 4j.2
    text: Onze Minister benoemt, schorst en ontslaat de leden van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4j
  - number: 4j.3
    text: De voorzitter wordt benoemd, gehoord de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4j
  - number: 4j.4
    text: |-
      De leden van de raad van toezicht hebben op persoonlijke titel zitting in de raad en oefenen hun functie uit zonder
      last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4j
  - number: 4k.1
    text: |-
      De voorzitter en de overige leden van de raad van toezicht worden benoemd voor een tijdvak van vier jaren en zijn
      aansluitend éénmalig voor een tijdvak van vier jaren herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4k
  - number: 4k.2
    text: |-
      De leden van de raad van toezicht kan tussentijds op eigen verzoek, dan wel om zwaarwichtige redenen ontslag worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4k
  - number: 4k.3
    text: |-
      Zolang in een vacature van de raad van toezicht niet is voorzien, vormen de overblijvende leden de raad van
      toezicht, met de bevoegdheid van de volledige raad. Betreft het de vacature van de voorzitter dan wijzen de
      overblijvende leden uit hun midden een lid aan dat tijdelijk als voorzitter fungeert.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4k
  - number: 4k.4
    text: |-
      Indien een lid wordt benoemd ter vervanging van een tussentijds opengevallen plaats, bepaalt Onze Minister het
      tijdvak van de benoeming.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4k
  - number: 4k.5
    text: |-
      De raad van toezicht verschaft Onze Minister alle verlangde inlichtingen, met inachtneming van het door Onze
      Minister vastgestelde informatiestatuut.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4k
  - number: 4l.1
    text: De raad van toezicht ziet toe op de werkzaamheden van de directie en staat die met raad terzijde.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
  - number: 4l.2
    text: 'Goedkeuring door de raad van toezicht behoeven in ieder geval de besluiten van de directie betreffende:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
  - number: 4l.2.a
    text: |-
      de reglementen, bedoeld in de [artikelen 4o][ref1] en [4r][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4o
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel4r
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4o
        hoofdstuk: IA
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 4r
        hoofdstuk: IA
        paragraaf: '6'
  - number: 4l.2.b
    text: investeringen die een door de raad van toezicht vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
  - number: 4l.2.c
    text: wijzigingen in de arbeidsvoorwaarden van het personeel;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
  - number: 4l.2.d
    text: de bij of krachtens deze wet aan Onze Minister uit te brengen rapportages.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
  - number: 4l.3
    text: |-
      Onze Minister kan bepalen dat de directie de voorafgaande instemming behoeft van de raad van toezicht voor een
      beslissing als bedoeld in [artikel 32 van de Kaderwet zelfstandige bestuursorganen][ref1] of dat de directie,
      ingeval Onze Minister een beslissing als bedoeld in dat artikel aan zijn voorafgaande instemming heeft onderworpen,
      die beslissing pas aan hem kan voorleggen nadat de raad van toezicht heeft verklaard tegen die beslissing geen
      bedenkingen te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel32
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '32'
  - number: 4l.4
    text: 'De directie behoeft in elk geval de voorafgaande instemming van de raad van toezicht voor de besluiten betreffende:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
  - number: 4l.4.a
    text: de begroting;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
  - number: 4l.4.b
    text: |-
      de vaststelling van de tarieven, bedoeld in [artikel 4b, eerste lid, onderdeel n][ref1], de tarieven die
      voortvloeien uit artikel 4b, tweede lid, onderdeel a, alsmede van de wijze van betaling van deze tarieven;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4b
        hoofdstuk: IA
        paragraaf: '2'
  - number: 4l.4.c
    text: het jaarverslag en de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
  - number: 4l.4.d
    text: |-
      het bestuursreglement, bedoeld in [artikel 4n][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4n
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4n
        hoofdstuk: IA
        paragraaf: '4'
  - number: 4l.4.e
    text: het financiële meerjarenbeleidsplan;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
  - number: 4l.4.f
    text: |-
      de uitbreiding van de keuringscapaciteit als bedoeld in [artikel 78, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: 4l.4.g
    text: het sluiten van overeenkomsten van zwaarwegend belang.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
  - number: 4l.5
    text: |-
      De in het vierde lid, onderdelen e tot en met g genoemde besluiten behoeven de goedkeuring van Onze Minister. De
      goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
  - number: 4l.6
    text: |-
      De raad van toezicht kan geen rechtsgeldige besluiten nemen indien niet ten minste de meerderheid van de leden ter
      vergadering aanwezig is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
  - number: 4l.7
    text: |-
      De raad van toezicht stelt bij reglement zijn werkwijze vast. Het reglement behoeft de goedkeuring van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
  - number: 4l.8
    text: De vergaderingen van de raad van toezicht zijn niet openbaar.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4l
  - number: 4m.1
    text: De raad van toezicht heeft een eigen secretariaat; de kosten daarvan komen ten laste van de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4m
  - number: 4m.2
    text: |-
      Onze Minister kan aan de leden van de raad van toezicht, ten laste van de Dienst Wegverkeer, een vergoeding
      toekennen voor hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4m
  - number: 4m.3
    text: |-
      De leden van de raad van toezicht hebben aanspraak op vergoeding van de door hen in de uitoefening van hun functie
      gemaakte reis- en verblijfskosten.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4m
  - number: 4n
    text: De directie stelt bij bestuursreglement haar werkwijze vast.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4n
  - number: 4o
    text: |-
      Bij reglement kunnen voorzieningen worden vastgesteld met betrekking tot de rechtspositie van de leden van de
      directie.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4o
  - number: 4p
    text: 'De inkomsten van de Dienst Wegverkeer bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4p
  - number: 4p.a
    text: de opbrengst van de tarieven en overige heffingen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4p
  - number: 4p.b
    text: vergoedingen voor verrichte diensten;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4p
  - number: 4p.c
    text: andere baten hoe ook genoemd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4p
  - number: 4q.1
    text: |-
      De hoogte van de tarieven, bedoeld in [artikel 4b, eerste lid, onderdeel n][ref1], dient te worden gerelateerd aan
      de met de uitoefening van de taak gemoeide kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4b
        hoofdstuk: IA
        paragraaf: '2'
  - number: 4q.2
    text: |-
      Het tarief, bedoeld in [artikel 48, eerste lid][ref1], voor de aanvraag van een inschrijving en tenaamstelling
      in het kentekenregister omvat mede een door de Dienst Wegverkeer vastgesteld bedrag dat strekt ter dekking van de
      kosten van:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '48'
        hoofdstuk: IV
        paragraaf: 4a
  - number: 4q.2.a
    text: het registreren van keuringsrapporten,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4q
  - number: 4q.2.b
    text: |-
      het ongeldig verklaren van kentekenbewijzen, tenzij de Dienst Wegverkeer ingevolge [artikel 52c, tweede lid][ref1],
      een tarief voor de ongeldigheid heeft vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel52c
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 52c
        hoofdstuk: IV
        paragraaf: 4b
  - number: 4q.2.c
    text: |-
      het verstrekken van gegevens uit het kentekenregister als bedoeld in [artikel 43, eerste en tweede lid][ref1], en
      bij algemene maatregel van bestuur te bepalen verstrekkingen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 4q.2.d
    text: |-
      het behandelen van klachten en ingevolge de [Algemene wet bestuursrecht][ref1] ingediende bezwaarschriften en
      beroepsschriften gericht op het handelen van de Dienst Wegverkeer,


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 4q.2.e
    text: |-
      het opsporen van bij of krachtens deze wet strafbaar gestelde feiten voor zover ambtenaren van de Dienst Wegverkeer
      daarmee ingevolge [artikel 159][ref1] zijn belast,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: 4q.2.f
    text: |-
      het beheer en instandhouding van het in
      [artikel 13, tweede lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1] bedoelde register,


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel13
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '13'
  - number: 4q.2.g
    text: |-
      het verstrekken van gegevens uit het in onderdeel f genoemde register aan degenen die ingevolge de in
      [artikel 38, tweede lid van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1] bedoelde algemene maatregel
      van bestuur niet tot betaling van het ter zake vastgestelde tarief zijn gehouden,


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel38
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '38'
  - number: 4q.2.h
    text: |-
      de inspectie bedoeld in [artikel 45a, tweede lid][ref1], indien naar het oordeel van de Dienst Wegverkeer blijkt
      dat de gegevens juist in het kentekenregister zijn opgenomen dan wel de onjuistheid van een gegeven degene aan wie
      het kentekenbewijs voor het geïnspecteerde voertuig is afgegeven niet kan worden tegengeworpen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel45a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 45a
        hoofdstuk: IV
        paragraaf: '3'
  - number: 4q.2.i
    text: het toezicht op het terugroepen door de fabrikant van reeds in de handel gebrachte voertuigen,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4q
  - number: 4q.2.j
    text: |-
      het uitvoeren van experimenten op grond van [artikel 186, eerste en tweede lid][ref1], en het opstellen van het
      verslag over de doeltreffendheid en de effecten van experimenten op grond van artikel 186, derde lid,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel186
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '186'
        hoofdstuk: XIII
  - number: 4q.2.k
    text: |-
      het uitvoeren van de op grond van [artikel 4b, eerste lid, onderdeel r][ref1], opgedragen taken,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4b
        hoofdstuk: IA
        paragraaf: '2'
  - number: 4q.2.l
    text: verstrekkingen waarbij inning van het tarief meer kost dan het te innen tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4q
  - number: 4r
    text: |-
      De directie stelt bij reglement richtlijnen vast voor het voeren van een ordelijk financieel beheer van de Dienst
      Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4r
  - number: 4s
    text: Het boekjaar van de Dienst Wegverkeer valt samen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4s
  - number: 4t.1
    text: |-
      De directie dient het financiële meerjarenbeleidsplan, waarmee de raad van toezicht heeft ingestemd, voor 1 oktober
      voorafgaand aan het boekjaar, in bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4t
  - number: 4t.2
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld over de inrichting van het financiële
      meerjarenbeleidsplan en kunnen aandachtspunten worden vastgesteld voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4t
  - number: 4u.1
    text: |-
      Onze Minister stelt regels over de uitoefening van het toezicht op de Dienst Wegverkeer door Onze Minister en de
      raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4u
  - number: 4u.2
    text: |-
      Onze Minister verstrekt de Dienst Wegverkeer de inlichtingen die deze voor zijn taakuitoefening redelijkerwijs
      nodig heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4u
  - number: 4u.3
    text: |-
      Onze Minister stelt een informatiestatuut vast. Het informatiestatuut bevat inhoudelijke en procedurele
      voorschriften met betrekking tot de informatie-uitwisseling tussen Onze Minister en de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4u
  - number: 4v.1
    text: |-
      Waar in deze wet dan wel de [Kaderwet zelfstandige bestuursorganen][ref1] de goedkeuring van Onze Minister is
      vereist, verleent dan wel onthoudt deze die goedkeuring binnen zes weken na de datum van ontvangst van de aan
      goedkeuring onderhevige stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4v
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: 4v.2
    text: |-
      Met goedkeuring wordt gelijkgesteld het verstrijken van de in het eerste lid bedoelde termijn zonder dat de
      goedkeuring is verleend of onthouden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4v
  - number: 4w.1
    text: |-
      Waar ingevolge deze wet de goedkeuring dan wel instemming door de raad van toezicht is vereist, verleent of
      onthoudt deze die goedkeuring dan wel die instemming binnen zes weken na de datum van ontvangst van de aan
      goedkeuring dan wel instemming onderhevige stukken.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4w
  - number: 4w.2
    text: |-
      Met goedkeuring dan wel instemming wordt gelijkgesteld het verstrijken van de in het eerste lid bedoelde termijn
      zonder dat de goedkeuring dan wel de instemming is verleend of onthouden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4w
  - number: 4wa
    text: |-
      Zolang de begroting niet is goedgekeurd, is de directie gerechtigd gedurende ten hoogste de eerste zes maanden van
      het nieuwe boekjaar voor iedere maand uitgaven te doen ter grootte van 115% van een twaalfde deel van de begroting
      van het voorafgaande boekjaar.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4wa
  - number: 4x
    text: |-
      Indien de Dienst Wegverkeer een bij of krachtens een andere wet dan deze wet opgedragen taak naar het oordeel
      van Onze Minister niet langer naar behoren verricht, kan Onze Minister de noodzakelijke voorzieningen treffen na
      overleg met Onze Minister(s) wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4x
  - number: 4z.1
    text: |-
      Er is een Centraal Bureau Rijvaardigheidsbewijzen, in het maatschappelijk verkeer aangeduid als CBR. Het bureau
      bezit rechtspersoonlijkheid en is gevestigd te Rijswijk.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4z
  - number: 4z.2
    text: |-
      Op het Centraal Bureau Rijvaardigheidsbewijzen is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing,
      met uitzondering van [artikel 15 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel15
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4z
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '15'
  - number: 4z1
    text: |-
      Bij de toepassing van de taken op het gebied van de beoordeling van de rijvaardigheid, neemt het CBR de bij
      ministeriële regeling aangewezen richtlijn, of de aangewezen onderdelen daarvan, in acht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4z1
  - number: 4aa.1
    text: 'Het CBR is belast met de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.a
    text: het beoordelen van de rijvaardigheid;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.b
    text: het beoordelen van de lichamelijke en geestelijke geschiktheid tot het besturen van motorrijtuigen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.c
    text: |-
      het opleggen van onderzoeken naar de rijvaardigheid en de geschiktheid tot het besturen van motorrijtuigen van
      houders van rijbewijzen ten aanzien van wie een vermoeden van onvoldoende rijvaardigheid of geschiktheid bestaat;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.d
    text: |-
      het opleggen van educatieve maatregelen ter bevordering van de rijvaardigheid of geschiktheid tot het besturen
      van motorrijtuigen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.f
    text: het schorsen van de geldigheid van rijbewijzen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.g
    text: het ongeldig verklaren van rijbewijzen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.h
    text: |-
      het verlenen van ontheffingen als bedoeld in [artikel 149, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '149'
        hoofdstuk: VII
  - number: 4aa.1.i
    text: |-
      het afgeven van gehandicaptenparkeerkaarten aan aanvragers die niet als ingezetene zijn ingeschreven in de
      basisregistratie personen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.j
    text: het beoordelen van de vakbekwaamheid van bestuurders in het goederen- en personenvervoer over de weg;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.k
    text: |-
      het erkennen van opleidingscentra voor het verrichten van nascholing en het certificeren van cursussen met
      betrekking tot vakbekwaamheid bestuurders goederen- en personenvervoer over de weg en het registreren van
      nascholing;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.l
    text: |-
      het houden van toezicht op de naleving van de verplichtingen die voortvloeien uit de in onderdeel k bedoelde
      erkenningen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.m
    text: |-
      het uitreiken van Nederlandse omwisselingscertificaten en deelcertificaten vakbekwaamheid bestuurders goederen- en
      personenvervoer over de weg;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.n
    text: |-
      het ongeldig verklaren van getuigschriften van vakbekwaamheid, getuigschriften van nascholing en Nederlandse
      omwisselingscertificaten;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.o
    text: |-
      het verwerken van gegevens, waaronder mede begrepen gegevens over gezondheid als bedoeld in artikel 4, onderdeel
      15, van de Algemene verordening gegevensbescherming, voor zover dit noodzakelijk is voor de uitvoering van de taken
      waarmee het CBR bij of krachtens deze wet is belast, alsmede van de taken waarmee het CBR bij of krachtens andere
      wetten is belast;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.p
    text: |-
      het met inachtneming van [artikel 4am][ref1] vaststellen van de tarieven, alsmede het vaststellen van de wijze van
      betaling van deze tarieven, voor het verrichten van taken waarvoor het CBR bij of krachtens deze wet bevoegd is,
      alsmede voor de bij of krachtens andere wetten opgedragen taken;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4am
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4am
        hoofdstuk: IB
        paragraaf: '4'
  - number: 4aa.1.q
    text: |-
      het verstrekken van gegevens voor zover dit noodzakelijk is voor de uitvoering van de taken waarmee het CBR dan wel
      andere organisaties bij of krachtens deze wet zijn belast;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.r
    text: |-
      het in stand houden en beheren van een systeem waarin rijscholen kunnen worden ingeschreven, franchiserelaties
      tussen rijscholen en overdrachten van rijscholen kunnen worden geregistreerd en waarmee rijscholen examens bij het
      CBR kunnen reserveren;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.1.s
    text: het informeren van rijscholen over relevante ontwikkelingen voor hun taakuitvoering.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.2
    text: |-
      Bij de toepassing van de taken, bedoeld in het eerste lid, onderdeel a, neemt het CBR de bij ministeriële regeling
      aangewezen richtlijn of de aangewezen onderdelen daarvan, in acht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.3
    text: |-
      Voor de toepassing van het eerste lid, onderdelen c tot en met g, wordt onder rijbewijzen mede verstaan
      rijbewijzen, afgegeven door het daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig
      is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.4
    text: 'Voorts is het CBR belast met:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.4.a
    text: de bij of krachtens andere wetten opgedragen taken, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4aa.4.b
    text: |-
      andere bij regeling van Onze Minister opgedragen taken waarbij regels kunnen worden gesteld met betrekking tot de
      tarieven van deze taken.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aa
  - number: 4ab
    text: |-
      Beleidsregels omtrent de uitoefening van de bij of krachtens andere wetten dan deze wet aan het CBR opgedragen
      taken worden door Onze Minister vastgesteld in overeenstemming met Onze Minister(s) wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ab
  - number: 4ac
    text: Het CBR heeft een directie en een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ac
  - number: 4ad.1
    text: De directie bestaat uit maximaal twee leden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ad
  - number: 4ad.2
    text: Het lidmaatschap van de directie is onverenigbaar met het lidmaatschap van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ad
  - number: 4ad.3
    text: |-
      In geval van schorsing of ontstentenis van een lid van de directie voorziet Onze Minister in de waarneming van
      diens functie.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ad
  - number: 4ad.4
    text: |-
      De leden van de directie worden benoemd voor een tijdvak van maximaal vier jaar en zijn aansluitend éénmalig voor
      een tijdvak van maximaal vier jaar herbenoembaar. In het geval van bijzondere omstandigheden binnen de organisatie
      van het CBR kan een lid van de directie bij afloop van de tweede benoemingstermijn terstond opnieuw worden benoemd
      voor een tijdvak van maximaal twee jaar.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ad
  - number: 4ad.5
    text: De directie stelt bij bestuursreglement haar werkwijze vast.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ad
  - number: 4ae.1
    text: De directie is belast met de dagelijkse leiding van het CBR.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ae
  - number: 4ae.2
    text: |-
      Alle bevoegdheden van het CBR die niet bij of krachtens deze wet aan de raad van toezicht zijn opgedragen, komen
      toe aan de directie.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ae
  - number: 4af.1
    text: De directie vertegenwoordigt het CBR in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4af
  - number: 4af.2
    text: |-
      De directie kan onder haar verantwoordelijkheid de vertegenwoordiging, bedoeld in het eerste lid, opdragen aan een
      of meer directieleden of andere personen. Zij kan bepalen dat deze vertegenwoordiging uitsluitend betrekking heeft
      op bepaalde onderdelen van de taak van het CBR dan wel op bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4af
  - number: 4ag.1
    text: |-
      De directie verstrekt de raad van toezicht tijdig de voor de uitoefening van diens taak benodigde inlichtingen en
      andere gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ag
  - number: 4ag.2
    text: |-
      De directe legt jaarlijks, en voorts tussentijds indien hiertoe naar het oordeel van de raad van toezicht
      aanleiding bestaat, aan de raad van toezicht verantwoording af over het door haar gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ag
  - number: 4ah.1
    text: De raad van toezicht bestaat uit vijf leden, waaronder de voorzitter.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ah
  - number: 4ah.2
    text: Onze Minister benoemt, schorst en ontslaat de leden van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ah
  - number: 4ah.3
    text: Onze Minister benoemt de voorzitter, gehoord de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ah
  - number: 4ah.4
    text: |-
      De leden van de raad van toezicht hebben op persoonlijke titel zitting in de raad en oefenen hun functie uit zonder
      last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ah
  - number: 4ah.5
    text: |-
      De raad van toezicht verschaft Onze Minister alle verlangde inlichtingen, met inachtneming van het door Onze
      Minister vastgestelde informatiestatuut.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ah
  - number: 4ai.1
    text: |-
      De voorzitter en de overige leden van de raad van toezicht worden benoemd voor een tijdvak van vier jaren en zijn
      aansluitend éénmalig voor een tijdvak van vier jaren herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ai
  - number: 4ai.2
    text: |-
      De leden van de raad van toezicht kan tussentijds op eigen verzoek, dan wel om zwaarwichtige redenen ontslag worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ai
  - number: 4ai.3
    text: |-
      Zolang in een vacature van de raad van toezicht niet is voorzien, vormen de overblijvende leden de raad van
      toezicht, met de bevoegdheid van de volledige raad. Betreft het de vacature van de voorzitter dan wijzen de
      overblijvende leden uit hun midden een lid aan dat tijdelijk als voorzitter fungeert.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ai
  - number: 4ai.4
    text: |-
      Indien een lid wordt benoemd ter vervanging van een tussentijds opengevallen plaats, bepaalt Onze Minister het
      tijdvak van de benoeming.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ai
  - number: 4aj.1
    text: De raad van toezicht ziet toe op de werkzaamheden van de directie en staat die met raad terzijde.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
  - number: 4aj.2
    text: 'Goedkeuring door de raad van toezicht behoeven in ieder geval de besluiten van de directie betreffende:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
  - number: 4aj.2.a
    text: |-
      het reglement, bedoeld in [artikel 4an][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4an
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4an
        hoofdstuk: IB
        paragraaf: '4'
  - number: 4aj.2.b
    text: investeringen die een door de raad van toezicht vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
  - number: 4aj.2.c
    text: wijzigingen in de rechtspositie van het personeel;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
  - number: 4aj.2.d
    text: de bij of krachtens deze wet aan Onze Minister uit te brengen rapportages.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
  - number: 4aj.3
    text: |-
      Onze Minister kan bepalen dat de directie de voorafgaande instemming behoeft van de raad van toezicht voor een
      beslissing als bedoeld in [artikel 32 van de Kaderwet zelfstandige bestuursorganen][ref1] of dat de directie,
      ingeval Onze Minister een beslissing als bedoeld in dat artikel aan zijn voorafgaande instemming heeft onderworpen,
      die beslissing pas aan hem kan voorleggen nadat de raad van toezicht heeft verklaard tegen die beslissing geen
      bedenkingen te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel32
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '32'
  - number: 4aj.4
    text: 'De directie behoeft in elk geval de voorafgaande instemming van de raad van toezicht voor de besluiten betreffende:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
  - number: 4aj.4.a
    text: de begroting;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
  - number: 4aj.4.b
    text: |-
      de vaststelling van de tarieven, bedoeld in [artikel 4aa, eerste lid, onderdeel p][ref1], de tarieven die
      voortvloeien uit artikel 4aa, derde lid, onderdeel b, alsmede de wijze van betaling van deze tarieven;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4aa
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4aa
        hoofdstuk: IB
        paragraaf: '2'
  - number: 4aj.4.c
    text: het jaarverslag en de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
  - number: 4aj.4.d
    text: |-
      het bestuursreglement, bedoeld in [artikel 4ad, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4ad
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4ad
        hoofdstuk: IB
        paragraaf: '3'
  - number: 4aj.4.e
    text: het financiële meerjarenbeleidsplan;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
  - number: 4aj.4.f
    text: het sluiten van overeenkomsten van zwaarwegend belang.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
  - number: 4aj.5
    text: |-
      De in het vierde lid, onderdelen e en f genoemde besluiten behoeven de goedkeuring van Onze Minister. De
      goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
  - number: 4aj.6
    text: |-
      De raad van toezicht kan geen rechtsgeldige besluiten nemen indien niet ten minste de meerderheid van de leden ter
      vergadering aanwezig is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
  - number: 4aj.7
    text: |-
      De raad van toezicht stelt bij reglement zijn werkwijze vast. Het reglement behoeft de goedkeuring van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
  - number: 4aj.8
    text: De vergaderingen van de raad van toezicht zijn niet openbaar.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aj
  - number: 4ak.1
    text: |-
      Onze Minister kan aan de leden van de raad van toezicht, ten laste van het CBR, een vergoeding toekennen voor hun
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ak
  - number: 4ak.2
    text: |-
      De leden van de raad van toezicht hebben aanspraak op vergoeding van de door hen in de uitoefening van hun functie
      gemaakte reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ak
  - number: 4ak.3
    text: De raad van toezicht heeft een eigen secretariaat; de kosten daarvan komen ten laste van het CBR.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ak
  - number: 4al
    text: 'De inkomsten van het CBR bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4al
  - number: 4al.a
    text: de opbrengsten van de tarieven en overige heffingen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4al
  - number: 4al.b
    text: vergoedingen voor verrichte diensten;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4al
  - number: 4al.c
    text: andere baten hoe ook genoemd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4al
  - number: 4am
    text: |-
      De hoogte van de tarieven, bedoeld in [artikel 4aa, eerste lid, onderdeel p][ref1] wordt gerelateerd aan de met
      de uitvoering van de taak redelijkerwijs gemoeide kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4aa
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4am
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4aa
        hoofdstuk: IB
        paragraaf: '2'
  - number: 4an
    text: De directie stelt bij reglement richtlijnen vast voor het voeren van een ordelijk financieel beheer van het CBR.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4an
  - number: 4ao
    text: Het boekjaar van het CBR valt samen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ao
  - number: 4ap.1
    text: |-
      De directie dient het financiële meerjarenbeleidsplan, waarmee de raad van toezicht heeft ingestemd, voor 1 oktober
      voorafgaande aan het boekjaar, in bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ap
  - number: 4ap.2
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld over de inrichting van het financiële
      meerjarenbeleidsplan en kunnen aandachtspunten worden vastgesteld voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ap
  - number: 4aq.1
    text: |-
      Onze Minister stelt regels over de uitoefening van het toezicht op het CBR door Onze Minister en de raad van
      toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aq
  - number: 4aq.2
    text: Onze Minister verstrekt het CBR de inlichtingen die het CBR voor zijn taakuitoefening redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aq
  - number: 4aq.3
    text: |-
      Onze Minister stelt een informatiestatuut vast. Het informatiestatuut bevat inhoudelijke en procedurele
      voorschriften met betrekking tot de informatie-uitwisseling tussen Onze Minister en het CBR.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4aq
  - number: 4ar.1
    text: |-
      Waar in deze wet dan wel de [Kaderwet zelfstandige bestuursorganen][ref1] de goedkeuring van Onze Minister is
      vereist, verleent dan wel onthoudt deze die goedkeuring binnen zes weken na de datum van ontvangst van de aan
      goedkeuring onderhevige stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ar
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: 4ar.2
    text: |-
      Met goedkeuring wordt gelijkgesteld het verstrijken van de in het eerste lid bedoelde termijn zonder dat de
      goedkeuring is verleend of onthouden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4ar
  - number: 4as.1
    text: |-
      Waar ingevolge deze wet de goedkeuring dan wel de instemming door de raad van toezicht is vereist, verleent
      of onthoudt deze die goedkeuring dan wel die instemming binnen zes weken na de datum van ontvangst van de aan
      goedkeuring dan wel instemming onderhevige stukken.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4as
  - number: 4as.2
    text: |-
      Met goedkeuring dan wel instemming wordt gelijkgesteld het verstrijken van de in het eerste lid bedoelde termijn
      zonder dat de goedkeuring dan wel de instemming is verleend of onthouden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4as
  - number: 4at
    text: |-
      Zolang de begroting niet is goedgekeurd, is de directie gerechtigd gedurende ten hoogste zes maanden van het nieuwe
      boekjaar voor iedere maand uitgaven te doen ter grootte van 115% van een twaalfde deel van de begroting van het
      voorafgaande boekjaar.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4at
  - number: 4au
    text: |-
      Indien het CBR een bij of krachtens een andere wet dan deze wet opgedragen taak naar het oordeel van Onze Minister
      niet langer naar behoren verricht, kan Onze Minister de nodige voorzieningen treffen na overleg met Onze Minister
      wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4au
  - number: 4av.1
    text: |-
      Keuringsinstellingen, aangewezen ingevolge de [artikelen 71a][ref1], [84, eerste lid][ref2],
      [101, eerste lid][ref3], en [106a, derde lid][ref4], jo. [101, eerste lid][ref5], en de ingevolge deze artikelen
      erkende onderzoeksgerechtigden en instellingen, verstrekken desgevraagd aan Onze Minister de inlichtingen die deze
      ten behoeve van zijn taakuitoefening nodig oordeelt. Onze Minister kan inzage vorderen van zakelijke gegevens en
      bescheiden, voor zover dat voor de vervulling van zijn taak redelijkerwijze noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel101
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel106a
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel101
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4av
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 71a
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '84'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '101'
        hoofdstuk: V
        paragraaf: '8'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: 106a
        hoofdstuk: V
        paragraaf: 9a
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '101'
        hoofdstuk: V
        paragraaf: '8'
  - number: 4av.2
    text: |-
      Onze Minister kan aan de in het eerste lid bedoelde keuringsinstellingen, onderzoeksgerechtigden en instellingen
      aanwijzingen van algemene aard geven met betrekking tot de uitvoering van de taak waarvoor zij zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4av
  - number: 4av.3
    text: |-
      Onze Minister kan tarieven vaststellen die de in het eerste lid bedoelde keuringsinstellingen,
      onderzoeksgerechtigden en instellingen ten hoogste mogen berekenen voor de door hen verrichte werkzaamheden in het
      kader van de uitvoering van de taak waarvoor zij zijn aangewezen. Daarbij kunnen voor verschillende werkzaamheden
      verschillende tarieven worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4av
  - number: 4av.4
    text: |-
      Indien een keuringsinstelling als bedoeld in het eerste lid naar het oordeel van Onze Minister haar taak
      verwaarloost, kan Onze Minister de aanwijzing intrekken.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4av
  - number: 4av.5
    text: |-
      Over de uitoefening van het toezicht op keuringsinstellingen, onderzoeksgerechtigden en instellingen als bedoeld in
      het eerste lid kunnen bij of krachtens algemene maatregel van bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel4av
  - number: '5'
    text: |-
      Het is een ieder verboden zich zodanig te gedragen dat gevaar op de weg wordt veroorzaakt of kan worden veroorzaakt
      of dat het verkeer op de weg wordt gehinderd of kan worden gehinderd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5
  - number: 5a.1
    text: |-
      Het is een ieder verboden opzettelijk zich zodanig in het verkeer te gedragen dat de verkeersregels in ernstige
      mate worden geschonden, indien daarvan levensgevaar of gevaar voor zwaar lichamelijk letsel voor een ander te
      duchten is. Als zodanige verkeersgedragingen kunnen de volgende gedragingen worden aangemerkt:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5a
  - number: 5a.1.a
    text: onvoldoende rechts houden op onoverzichtelijke plaatsen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5a
  - number: 5a.1.b
    text: gevaarlijk inhalen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5a
  - number: 5a.1.c
    text: negeren van een rood kruis;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5a
  - number: 5a.1.d
    text: over een vluchtstrook rijden waar dit niet is toegestaan;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5a
  - number: 5a.1.e
    text: inhalen voor of op een voetgangersoversteekplaats;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5a
  - number: 5a.1.f
    text: niet verlenen van voorrang;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5a
  - number: 5a.1.g
    text: overschrijden van de krachtens deze wet vastgestelde maximumsnelheid;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5a
  - number: 5a.1.h
    text: zeer dicht achter een ander voertuig rijden;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5a
  - number: 5a.1.i
    text: door rood licht rijden;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5a
  - number: 5a.1.j
    text: tegen de verkeersrichting inrijden;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5a
  - number: 5a.1.k
    text: tijdens het rijden een mobiel elektronisch apparaat vasthouden;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5a
  - number: 5a.1.l
    text: niet opvolgen van verkeersaanwijzingen van daartoe op grond van deze wet bevoegde personen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5a
  - number: 5a.1.m
    text: overtreden van andere verkeersregels van soortgelijk belang als die onder a tot en met l genoemd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5a
  - number: 5a.2
    text: |-
      Bij de toepassing van het eerste lid wordt mede in aanmerking genomen de mate waarin de verdachte verkeerde in de
      toestand, bedoeld in [artikel 8, eerste, tweede, derde, vierde of vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '6'
    text: |-
      Het is een ieder die aan het verkeer deelneemt verboden zich zodanig te gedragen dat een aan zijn schuld te wijten
      verkeersongeval plaatsvindt waardoor een ander wordt gedood of waardoor een ander zwaar lichamelijk letsel wordt
      toegebracht of zodanig lichamelijk letsel dat daaruit tijdelijke ziekte of verhindering in de uitoefening van de
      normale bezigheden ontstaat.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel6
  - number: '7.1'
    text: |-
      Het is degene die bij een verkeersongeval is betrokken of door wiens gedraging een verkeersongeval is veroorzaakt,
      verboden de plaats van het ongeval te verlaten indien:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel7
  - number: 7.1.a
    text: |-
      bij dat ongeval, naar hij weet of redelijkerwijs moet vermoeden, een ander is gedood dan wel letsel aan een ander
      is toegebracht;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel7
  - number: 7.1.b
    text: bij dat ongeval, naar hij weet of redelijkerwijs moet vermoeden, schade aan een ander is toegebracht;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel7
  - number: 7.1.c
    text: |-
      daardoor, naar hij weet of redelijkerwijs moet vermoeden, een ander aan wie bij dat ongeval letsel is toegebracht,
      in hulpeloze toestand wordt achtergelaten.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid, aanhef en onderdelen a en b, is niet van toepassing op degene die op de plaats van het ongeval
      behoorlijk de gelegenheid heeft geboden tot vaststelling van zijn identiteit en, voor zover hij een motorrijtuig
      bestuurde, tevens van de identiteit van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel7
  - number: '8.1'
    text: |-
      Het is een ieder verboden een voertuig te besturen, als bestuurder te doen besturen of als begeleider op te
      treden, terwijl hij verkeert onder zodanige invloed van een stof, waarvan hij weet of redelijkerwijs moet weten,
      dat het gebruik daarvan - al dan niet in combinatie met het gebruik van een andere stof - de rijvaardigheid kan
      verminderen, dat hij niet tot behoorlijk besturen of tot behoorlijk te begeleiden in staat moet worden geacht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel8
  - number: '8.2'
    text: |-
      Het is een ieder verboden een voertuig te besturen, als bestuurder te doen besturen of als begeleider op te treden
      na zodanig gebruik van alcoholhoudende drank, dat:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel8
  - number: 8.2.a
    text: |-
      het alcoholgehalte in zijn adem bij een onderzoek hoger blijkt te zijn dan 220 microgram alcohol per liter
      uitgeademde lucht, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel8
  - number: 8.2.b
    text: |-
      het alcoholgehalte in zijn bloed bij een onderzoek hoger blijkt te zijn dan 0,5 milligram alcohol per milliliter
      bloed.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel8
  - number: '8.3'
    text: |-
      In afwijking van het tweede lid is het de bestuurder van een motorrijtuig voor het besturen waarvan een rijbewijs
      is vereist, verboden dat motorrijtuig te besturen of als bestuurder te doen besturen na zodanig gebruik van
      alcoholhoudende drank, dat:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel8
  - number: 8.3.a
    text: |-
      het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan 88 microgram alcohol per liter
      uitgeademde lucht, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel8
  - number: 8.3.b
    text: |-
      het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan 0,2 milligram per milliliter bloed,
      indien:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel8
  - number: 8.3.b.1
    text: |-
      sedert de datum waarop hem voor de eerste maal een rijbewijs voor de categorie AM of T is afgegeven nog geen zeven
      jaren zijn verstreken en hij op het tijdstip van afgifte van dat rijbewijs de leeftijd van achttien jaar nog niet
      heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel8
  - number: 8.3.b.2°
    text: |-
      sedert de datum waarop hem voor het eerst een rijbewijs is afgegeven nog geen vijf jaren zijn verstreken en hij op
      het tijdstip van afgifte van dat rijbewijs de leeftijd van ten minste achttien jaar heeft bereikt, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel8
  - number: 8.3.b.3°
    text: |-
      indien sedert de datum waarop hem voor het eerst een rijbewijs voor de categorie B is afgegeven nog geen vijf jaren
      zijn verstreken en hij op het tijdstip van afgifte van het rijbewijs voor de categorie B nog niet de leeftijd van
      achttien jaar heeft bereikt, ongeacht of hij op dat tijdstip van afgifte van het rijbewijs voor de categorie B al
      in het bezit was van een rijbewijs voor de categorie AM of T.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel8
  - number: '8.4'
    text: |-
      Het derde lid is van overeenkomstige toepassing op een ieder die zonder dat aan hem een rijbewijs is afgegeven een
      motorrijtuig bestuurt voor het besturen waarvan een rijbewijs vereist is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel8
  - number: '8.5'
    text: |-
      Het is een ieder verboden een voertuig te besturen, als bestuurder te doen besturen of als begeleider op te treden
      na gebruik van een of meer van de bij algemene maatregel van bestuur aangewezen stoffen als bedoeld in het eerste
      lid, waardoor het gehalte in zijn bloed van de bij de stof vermelde meetbare stof, of in geval van gebruik van meer
      stoffen als bedoeld in het eerste lid die bij algemene maatregel van bestuur aangewezen zijn als groep, het totale
      gehalte in zijn bloed van de bij die stoffen vermelde meetbare stoffen, bij een onderzoek hoger blijkt te zijn
      dan de daarbij vermelde grenswaarde. Indien een van de bij algemene maatregel van bestuur aangewezen stoffen of
      alcohol in combinatie wordt gebruikt met een of meer andere van deze aangewezen stoffen of met een van de stoffen
      als bedoeld in het eerste lid die niet bij deze algemene maatregel van bestuur zijn aangewezen, geldt voor iedere
      aangewezen stof of alcohol afzonderlijk een bij algemene maatregel van bestuur vast te stellen grenswaarde. Die
      grenswaarde is gelijk aan de laagst meetbare hoeveelheid van die stof of alcohol die niet op natuurlijke wijze in
      het bloed aanwezig kan zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel8
  - number: '8.6'
    text: |-
      Het is verboden een motorrijtuig als bestuurder te doen besturen door een persoon waarvan men weet of
      redelijkerwijs moet weten dat deze verkeert in een toestand als in het eerste, tweede, derde of vijfde lid is
      omschreven.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel8
  - number: '8.7'
    text: |-
      Voor de toepassing van het derde lid wordt onder een rijbewijs mede verstaan een rijbewijs, afgegeven door het
      daartoe bevoegde gezag buiten Nederland en wordt voor de toepassing van het derde lid, aanhef en onderdelen 1°
      en 3°, met een rijbewijs voor de categorie AM of T gelijk gesteld een rijbewijs voor de categorie A1, afgegeven
      door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie, een andere staat die partij is bij
      de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland aan een persoon die op het tijdstip van
      afgifte nog niet de leeftijd van achttien jaar had bereikt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel8
  - number: '9.1'
    text: |-
      Het is degene die weet of redelijkerwijs moet weten dat hem bij rechterlijke uitspraak of strafbeschikking de
      bevoegdheid tot het besturen van motorrijtuigen is ontzegd, verboden gedurende de tijd dat hem die bevoegdheid is
      ontzegd, op de weg een motorrijtuig te besturen of als bestuurder te doen besturen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel9
  - number: '9.2'
    text: |-
      Het is degene die weet of redelijkerwijs moet weten dat een op zijn naam gesteld rijbewijs voor een of meer
      categorieën van motorrijtuigen dan wel voor een gedeelte van de geldigheidsduur ongeldig is verklaard, indien aan
      hem daarna geen ander rijbewijs voor het besturen van een motorrijtuig van de betrokken categorie of categorieën
      is afgegeven, verboden op de weg een motorrijtuig van die categorie of categorieën dan wel gedurende dat gedeelte
      van de geldigheidsduur te besturen of als bestuurder te doen besturen. Hetzelfde verbod geldt voor degene die
      weet of redelijkerwijs moet weten dat een op zijn naam gesteld rijbewijs zijn geldigheid heeft verloren en dat
      hij bij de aanvraag van een nieuw rijbewijs moet voldoen aan de bij algemene maatregel van bestuur als bedoeld
      in [artikel 123b, derde lid][ref1], gestelde voorwaarden, tenzij aan hem, nadat hij aan deze voorwaarden heeft
      voldaan, een ander rijbewijs voor het besturen van een motorrijtuig van de betrokken categorie of categorieën is
      afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 123b
        hoofdstuk: VI
        afdeling: '7'
  - number: '9.3'
    text: |-
      Het tweede lid geldt niet ten aanzien van de bestuurder van een motorrijtuig gedurende de tijd dat aan hem ter
      verkrijging van een rijbewijs voor de categorie of categorieën van motorrijtuigen waarop de ongeldigverklaring
      betrekking heeft, rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven en
      gedurende de tijd dat door hem een rijproef wordt afgelegd in het kader van een onderzoek, door of vanwege de
      overheid ingesteld, naar zijn rijvaardigheid of geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: '9.4'
    text: |-
      Het is degene van wie ingevolge [artikel 130, tweede lid][ref1], de overgifte van een op zijn naam gesteld
      rijbewijs is gevorderd, dan wel wiens rijbewijs is ingevorderd en aan wie dat bewijs niet is teruggegeven, verboden
      op de weg een motorrijtuig van de categorie of categorieën waarvoor dat bewijs was afgegeven, te besturen of als
      bestuurder te doen besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: '9.5'
    text: |-
      Het is degene die weet of redelijkerwijs moet weten dat de geldigheid van een op zijn naam gesteld rijbewijs
      ingevolge [artikel 131, tweede lid, onderdeel a][ref1], voor een of meer categorieën van motorrijtuigen is
      geschorst, verboden gedurende de tijd dat de schorsing van kracht is, op de weg een motorrijtuig van de categorie
      of categorieën waarop de schorsing betrekking heeft, te besturen of als bestuurder te doen besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: '9.6'
    text: |-
      Het vierde en het vijfde lid gelden niet ten aanzien van de bestuurder van een motorrijtuig gedurende de tijd dat
      door hem een rijproef wordt afgelegd in het kader van een ingevolge [artikel 131, eerste lid, onderdeel b][ref1],
      gevorderd onderzoek. Voorts geldt het vijfde lid niet ten aanzien van de bestuurder van een motorrijtuig
      gedurende de tijd dat aan hem, ter voorbereiding op een onderzoek naar de rijvaardigheid in het kader van
      een ingevolge artikel 131, eerste lid, onderdeel b, gevorderd onderzoek, rijonderricht in de zin van de
      [Wet rijonderricht motorrijtuigen 1993][ref2] wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006073
  - number: '9.7'
    text: |-
      Het is degene van wie ingevolge [artikel 164][ref1] de overgifte van een op zijn naam gesteld rijbewijs, een hem
      door het daartoe bevoegde gezag buiten Nederland afgegeven rijbewijs of een internationaal rijbewijs is gevorderd,
      dan wel van wie zodanig bewijs is ingevorderd en aan wie dat bewijs niet is teruggegeven, verboden op de weg een
      motorrijtuig van de categorie of categorieën waarvoor dat bewijs was afgegeven, te besturen of als bestuurder te
      doen besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel164
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '164'
        hoofdstuk: IX
  - number: '9.8'
    text: |-
      Het is degene van wie ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1] de
      inlevering van het rijbewijs is gevorderd, dan wel wiens rijbewijs krachtens die wet is ingenomen, verboden op de
      weg een motorrijtuig, voor het besturen waarvan het rijbewijs is afgegeven, te besturen of als bestuurder te doen
      besturen met ingang van het tijdstip, bedoeld in [artikel 30, eerste lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004581
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel30
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004581
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '30'
  - number: '9.9'
    text: |-
      Voor de toepassing van het tweede, vierde, vijfde, zesde en achtste lid wordt onder rijbewijs mede verstaan een
      rijbewijs, afgegeven door het daartoe bevoegde gezag buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel9
  - number: '10.1'
    text: Het is verboden op de weg een wedstrijd met voertuigen te houden of daaraan deel te nemen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel10
  - number: '10.2'
    text: |-
      Onder wedstrijd wordt voor de toepassing van dit artikel verstaan elk rijden met voertuigen ter vaststelling of
      vergelijking van prestaties hetzij van de deelnemers, hetzij van de voertuigen, hetzij van onderdelen daarvan,
      hetzij van bedrijfsstoffen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel10
  - number: '10.3'
    text: |-
      Als deelnemer wordt beschouwd de bestuurder van een voertuig waarmee aan een wedstrijd wordt deelgenomen, en de
      eigenaar of houder van een voertuig, die daarmee aan een wedstrijd doet of laat deelnemen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel10
  - number: '11'
    text: Het is verboden opzettelijk wederrechtelijk een aan een ander toebehorend motorrijtuig op de weg te gebruiken.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel11
  - number: '12.1'
    text: |-
      Weggebruikers zijn verplicht gevolg te geven aan de aanwijzingen die door de in [artikel 159][ref1] bedoelde
      personen dan wel door andere bij algemene maatregel van bestuur aangewezen categorieën van personen ter zake van
      het verkeer op de weg worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '12.2'
    text: |-
      De in het eerste lid bedoelde aanwijzingen mogen slechts worden gegeven in het belang van de veiligheid op de weg,
      de instandhouding van de weg en de bruikbaarheid daarvan, of de vrijheid van het verkeer dan wel in het belang van
      met toestemming van Onze Minister verrichte onderzoeken ten behoeve van het verkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel12
  - number: '12.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het bepaalde in het eerste
      lid, alsmede met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel12
  - number: 12.3.a
    text: |-
      de opleiding en examinering van verkeersregelaars en de afgifte, of weigering daarvan, en geldigheidsduur van
      examencertificaten en herhalingscertificaten;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel12
  - number: 12.3.b
    text: |-
      de erkenning, of de weigering daarvan, door Onze Minister van examencertificaten of herhalingscertificaten, de
      voorschriften die aan die erkenning kunnen worden verbonden en de intrekking van die erkenning;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel12
  - number: 12.3.c
    text: de opleiding van verkeersbrigadiers;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel12
  - number: 12.3.d
    text: |-
      de aanstelling van verkeersregelaars, de verlenging en intrekking van die aanstelling, de afgifte van de
      aanstellingspas aan verkeersregelaars en de inname van die pas in gevallen waarin het verkeer in gevaar is of kan
      worden gebracht, alsmede de aanstelling van verkeersbrigadiers;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel12
  - number: 12.3.e
    text: |-
      de uitrusting, de verzekering, de wijze en plaats van taakuitoefening, en het toezicht op verkeersregelaars en
      verkeersbrigadiers.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel12
  - number: '12.4'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een verzoek tot aanstelling tot
      verkeersregelaar en verlenging van die aanstelling als bedoeld in het derde lid, onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '13.1'
    text: Bij algemene maatregel van bestuur worden nadere regels vastgesteld betreffende het gedrag van verkeersdeelnemers.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel13
  - number: '13.2'
    text: |-
      In de bij die algemene maatregel van bestuur aangegeven gevallen kunnen bij ministeriële regeling voorschriften ter
      uitvoering van die regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel13
  - number: '14.1'
    text: 'Bij algemene maatregel van bestuur worden regels vastgesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel14
  - number: 14.1.a
    text: het toepassen van verkeerstekens en onderborden;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel14
  - number: 14.1.b
    text: het treffen van maatregelen op of aan de weg tot wijziging van de inrichting van de weg;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel14
  - number: 14.1.c
    text: het aanbrengen of verwijderen van voorzieningen ter regeling van het verkeer, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel14
  - number: 14.1.d
    text: |-
      het ten behoeve van de doelen, genoemd in [artikel, 2, eerste lid, onderdelen a en c][ref1], verwerken van
      kentekengegevens van voertuigen op of aan de weg met behulp van een technisch hulpmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: '14.2'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld betreffende het toepassen van verkeerstekens en
      onderborden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel14
  - number: '14.3'
    text: |-
      Bij ministeriële regeling worden voorschriften vastgesteld betreffende de inrichting, de plaatsing, de kleur, de
      afmeting en het materiaal van verkeerstekens en onderborden, en de inzet van een technisch hulpmiddel als bedoeld
      in het eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel14
  - number: '15.1'
    text: |-
      De plaatsing of verwijdering van de bij algemene maatregel van bestuur aangewezen verkeerstekens, en onderborden
      voor zover daardoor een gebod of verbod ontstaat of wordt gewijzigd, geschiedt krachtens een verkeersbesluit.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel15
  - number: '15.2'
    text: |-
      Maatregelen op of aan de weg tot wijziging van de inrichting van de weg of tot het aanbrengen of verwijderen van
      voorzieningen ter regeling van het verkeer geschieden krachtens een verkeersbesluit, indien de maatregelen leiden
      tot een beperking of uitbreiding van het aantal categorieën weggebruikers dat van een weg of weggedeelte gebruik
      kan maken.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel15
  - number: '16.1'
    text: |-
      De in [artikel 15][ref1] bedoelde verkeerstekens en onderborden worden geplaatst of verwijderd, en de daar bedoelde
      maatregelen worden getroffen, door de zorg van het gezag dat het verkeersbesluit heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
  - number: '16.2'
    text: |-
      Verkeerstekens en onderborden, die niet worden geplaatst of verwijderd krachtens een verkeersbesluit, worden
      geplaatst of verwijderd door de zorg van het openbaar lichaam dat het beheer heeft over de weg of, indien geen
      openbaar lichaam het beheer heeft, door de zorg van de eigenaar van de weg.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16
  - number: '16.3'
    text: |-
      Bij algemene maatregel van bestuur worden de verkeerstekens aangewezen die onderdeel uitmaken van de categorie
      bewegwijzering.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16
  - number: '16.4'
    text: |-
      Plaatsing of verwijdering van de bewegwijzering vindt uitsluitend plaats in overeenstemming met een vastgesteld
      ontwerp als bedoeld in [artikel 16a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel16a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 16a
        hoofdstuk: II
        paragraaf: '2'
  - number: 16a.1
    text: |-
      Onze Minister stelt, na overleg met de betrokken openbare lichamen en eigenaren van wegen, ontwerpen vast voor
      de bewegwijzering.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16a
  - number: 16a.2
    text: 'Een ontwerp bevat:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16a
  - number: 16a.2.a
    text: de bestemmingen waarop het ontwerp betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16a
  - number: 16a.2.b
    text: |-
      een overzicht van de bestaande bewegwijzering en van de mogelijke routes waarlangs die bestemmingen veilig en
      efficiënt kunnen worden bereikt;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16a
  - number: 16a.2.c
    text: |-
      te plaatsen en te verwijderen bewegwijzering alsmede een aanduiding van de locaties waar de bewegwijzering moet
      worden geplaatst of verwijderd;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16a
  - number: 16a.2.d
    text: de vormgeving van de te plaatsen bewegwijzering, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16a
  - number: 16a.2.e
    text: de consequenties van het ontwerp voor de bewegwijzering op andere wegen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16a
  - number: 16a.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de inhoud van een ontwerp en de uitvoering van
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16a
  - number: 16b.1
    text: |-
      Onze Minister houdt een register bij waarin gegevens worden verwerkt inzake ontwerpen voor bewegwijzering, alsmede
      de uitvoering daarvan.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16b
  - number: 16b.2
    text: |-
      Het openbaar lichaam dat het beheer heeft over de weg waarop het ontwerp betrekking heeft of waarvoor het ontwerp
      mogelijk gevolgen heeft, of, indien geen openbaar lichaam het beheer heeft, de eigenaar van die weg, verstrekt aan
      Onze Minister de gegevens:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16b
  - number: 16b.2.a
    text: |-
      die nodig zijn om het ontwerp, bedoeld in [artikel 16a, eerste lid][ref1], tot stand te kunnen brengen, en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel16a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 16a
        hoofdstuk: II
        paragraaf: '2'
  - number: 16b.2.b
    text: inzake de uitvoering van die ontwerpen, zoals gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16b
  - number: 16b.3
    text: |-
      Onze Minister verstrekt gegevens uit het register aan de in het tweede lid bedoelde openbare lichamen of
      eigenaren voor de uitvoering van hun publieke taken. Openbare gegevens uit het register waarop geen intellectuele
      eigendomsrechten van derden rusten, worden tevens beschikbaar gesteld voor hergebruik als bedoeld in de
      [Wet hergebruik van overheidsinformatie][ref1], zonder dat een daartoe strekkend verzoek als bedoeld in die wet
      hoeft te worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0036795
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0036795
  - number: 16b.4
    text: |-
      Bij ministeriële regeling kunnen ter uitvoering van het eerste tot en met het derde lid nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel16b
  - number: '17'
    text: |-
      In de bij algemene maatregel van bestuur aangewezen gevallen kan bij de plaatsing en verwijdering van
      verkeerstekens en het treffen van maatregelen op of aan de weg, worden afgeweken van de [artikelen 15][ref1]
      en [16][ref2]. Indien het als gevolg van dringende omstandigheden niet mogelijk is de verkeerstekens in de
      voorgeschreven uitvoering te plaatsen, kan de door het teken aangeduide informatie op andere duidelijke wijze
      kenbaar worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel16
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
  - number: '18.1'
    text: 'Verkeersbesluiten worden genomen:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel18
  - number: 18.1.a
    text: voor zover zij betreffen het verkeer op wegen onder beheer van het Rijk door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel18
  - number: 18.1.b
    text: voor zover zij betreffen het verkeer op wegen onder beheer van een provincie door gedeputeerde staten;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel18
  - number: 18.1.c
    text: |-
      voor zover zij betreffen het verkeer op wegen onder beheer van een waterschap door het algemeen bestuur of,
      krachtens besluit van het algemeen bestuur, door het dagelijks bestuur;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel18
  - number: 18.1.d
    text: |-
      voor zover zij betreffen het verkeer op andere wegen door burgemeester en wethouders, of krachtens besluit van hen,
      door een door hen ingestelde bestuurscommissie.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel18
  - number: '18.2'
    text: |-
      Indien het beheer over een weg wordt overgedragen, blijven de verkeersbesluiten die de oorspronkelijke wegbeheerder
      ten aanzien van het verkeer op die weg heeft vastgesteld, van kracht totdat zij zijn vervangen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel18
  - number: '18.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld omtrent de eisen waaraan verkeersbesluiten dienen te
      voldoen alsmede omtrent de totstandkoming en de inwerkingtreding van die besluiten.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel18
  - number: '19.1'
    text: |-
      Gedeputeerde staten kunnen aan besturen van waterschappen de aanwijzing geven om op buiten de bebouwde kom gelegen
      wegen, ten aanzien waarvan die organen bevoegd zijn tot het nemen van verkeersbesluiten, binnen dertien weken een
      verkeersbesluit van een daarbij aan te geven inhoud te nemen en uit te voeren.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel19
  - number: '19.2'
    text: 'Het eerste lid mag worden toegepast, indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel19
  - number: 19.2.a
    text: |-
      op een buiten de bebouwde kom gelegen weg, die bij meerdere organen in beheer is, naar het oordeel van gedeputeerde
      staten een of meerdere niet op elkaar afgestemde verkeersbesluiten van kracht zijn, die zodanige afstemming behoeven
      met het oog op de belangen, omschreven in [artikel 2, eerste lid, onderdelen a, c en d, en tweede lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: 19.2.b
    text: |-
      gedeputeerde staten van oordeel zijn dat het nemen van een verkeersbesluit noodzakelijk is ter bescherming van de
      belangen, bedoeld in [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: '19.3'
    text: |-
      Gedeputeerde staten dienen voorafgaande aan het geven van een aanwijzing als bedoeld in het eerste lid overleg te
      voeren met het betrokken bestuur.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel19
  - number: '19.4'
    text: Het betrokken bestuur is verplicht een aanwijzing als bedoeld in het eerste lid op te volgen en uit te voeren.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel19
  - number: '19.5'
    text: |-
      Indien een aanwijzing als bedoeld in het eerste lid niet wordt opgevolgd of uitgevoerd, gaan gedeputeerde staten op
      kosten van het betrokken bestuur tot het nemen van het verkeersbesluit en zo nodig tot de uitvoering daarvan over.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel19
  - number: '19.6'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld over de totstandkoming en de inhoud van de in het
      eerste lid bedoelde aanwijzingen alsmede over hetgeen verder voor de uitvoering van dit artikel noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel19
  - number: '20'
    text: |-
      Een belanghebbende kan tegen een verkeersbesluit tot plaatsing of verwijdering van verkeerstekens en onderborden of
      tot het treffen van maatregelen op of aan de weg ter regeling van het verkeer beroep instellen bij de rechtbank.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20
  - number: 20a.1
    text: De grenzen van de bebouwde kom of kommen van een gemeente worden vastgesteld bij besluit van de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20a
  - number: 20a.2
    text: Bij algemene maatregel van bestuur worden nadere regels inzake de vaststelling van bebouwde kommen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20a
  - number: 20b.1
    text: |-
      Voorafgaande aan de toelating tot het verkeer op de weg kan Onze Minister een motorrijtuig met een door de
      constructie bepaalde maximumsnelheid van niet meer dan 25 km/h, uitgerust met een verbrandingsmotor met een
      cilinderinhoud van niet meer dan 50 cm3 of een elektromotor met een nominaal continu maximumvermogen van niet
      meer dan 4 kW, niet zijnde een gehandicaptenvoertuig, per type of individueel voertuig aanwijzen op grond van zijn
      veiligheidsaspecten, indien:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20b
  - number: 20b.1.a
    text: |-
      de toelating overeenstemt met de in
      [artikel 2, eerste lid, onderdelen a en b, tweede lid en derde lid, onderdeel a][ref1], genoemde doeleinden; en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: 20b.1.b
    text: |-
      er voor dit motorrijtuig niet een typegoedkeuring overeenkomstig in het kader van de Europese Unie tot stand
      gekomen voorschriften vereist is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20b
  - number: 20b.2
    text: Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20b
  - number: 20c.1
    text: |-
      Een aanvraag voor een aanwijzing of een wijziging of intrekking daarvan wordt ingediend op de door Onze Minister te
      bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20c
  - number: 20c.2
    text: |-
      De kosten die samenhangen met het in behandeling nemen van een aanvraag voor een aanwijzing of een wijziging of
      intrekking daarvan worden door Onze Minister vastgesteld en komen ten laste van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20c
  - number: 20d
    text: |-
      Degene aan wie een aanwijzing is verleend, is gehouden de voor het markttoezicht, bedoeld in [artikel 158a][ref1],
      noodzakelijke medewerking te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel158a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 158a
        hoofdstuk: IX
  - number: 20e.1
    text: 'Onze Minister trekt een aanwijzing in, indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20e
  - number: 20e.1.a
    text: degene aan wie de aanwijzing is verleend, daarom verzoekt; of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20e
  - number: 20e.1.b
    text: blijkt dat de aanwijzing ten onrechte is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20e
  - number: 20e.2
    text: 'Onze Minister kan een aanwijzing schorsen of intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20e
  - number: 20e.2.a
    text: |-
      degene aan wie de aanwijzing is verleend een motorrijtuig als bedoeld in [artikel 20b][ref1], eerste lid, aanhef,
      doet of laat doorgaan voor aangewezen, terwijl dat motorrijtuig niet overeenstemt met het type waarvoor de
      aanwijzing is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 20b
        hoofdstuk: IIA
  - number: 20e.2.b
    text: |-
      het motorrijtuig waarvoor een aanwijzing is verleend desalniettemin een ernstig gevaar vormt voor de gezondheid, de
      veiligheid, het milieu of andere aspecten van de bescherming van het openbaar belang;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20e
  - number: 20e.2.c
    text: |-
      degene aan wie de aanwijzing is verleend, de verplichtingen, bedoeld in [artikel 20d][ref1], niet nakomt; of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 20b
        hoofdstuk: IIA
  - number: 20e.2.d
    text: |-
      degene aan wie de aanwijzing is verleend, handelt in strijd met één of meer andere uit de aanwijzing voortvloeiende
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20e
  - number: 20e.3
    text: Onze Minister kan een aanwijzing schorsen indien de aanwijzing te onrechte lijkt te zijn verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20e
  - number: 20f.1
    text: |-
      Indien een fabrikant in de handel gebrachte motorrijtuigen als bedoeld in [artikel 20b, eerste lid, aanhef][ref1],
      voorzien van een aanwijzing, uit de handel dient te nemen of dient terug te roepen, omdat ze een ernstig gevaar
      vormen voor de gezondheid, de veiligheid, het milieu of andere aspecten van de bescherming van het openbaar belang,
      of indien ze niet blijken te voldoen aan de daaraan voor aanwijzing gestelde eisen, stelt de fabrikant de Dienst
      Wegverkeer hiervan onmiddellijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 20b
        hoofdstuk: IIA
  - number: 20f.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld in verband met de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20f
  - number: 20g.1
    text: |-
      Het is marktdeelnemers verboden motorrijtuigen als bedoeld in [artikel 20b, eerste lid, aanhef][ref1], op de markt
      aan te bieden of in de handel te brengen:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 20b
        hoofdstuk: IIA
  - number: 20g.1.a
    text: zonder dat die motorrijtuigen zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20g
  - number: 20g.1.b
    text: indien niet aan de voor een dergelijke aanwijzing gestelde eisen wordt voldaan; of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20g
  - number: 20g.1.c
    text: |-
      die zijn voorzien van vervalste of onjuiste verklaringen van overeenstemming, platen of goedkeuringsmerken met het
      doel anderen te misleiden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20g
  - number: 20g.2
    text: |-
      Het is marktdeelnemers verboden een motorrijtuig als bedoeld in [artikel 20b, eerste lid, aanhef][ref1], op de
      markt aan te bieden of in de handel te brengen zonder de op grond van de artikel 20b, voorgeschreven verklaringen
      van overeenstemming of zonder de voorgeschreven platen of goedkeuringsmerken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 20b
        hoofdstuk: IIA
  - number: 20g.3
    text: 'Het is marktdeelnemers verboden:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20g
  - number: 20g.3.a
    text: |-
      gebruik te maken van manipulatie-instrumenten of -strategieën of testresultaten te vervalsen tijdens de
      aanwijzingsprocedure of bij het markttoezicht;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20g
  - number: 20g.3.b
    text: |-
      valse verklaringen af te leggen tijdens een procedure tot aanvraag van een aanwijzing of procedures die tot
      terugroeping leiden of zouden kunnen leiden terwijl er corrigerende of beperkende maatregelen gelden op grond van
      deze wet;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20g
  - number: 20g.3.c
    text: |-
      gegevens of technische specificaties achter te houden die tot weigering of intrekking van de aanwijzing zouden
      kunnen leiden van motorrijtuigen als bedoeld in [artikel 20b, eerste lid, aanhef][ref1] of tot terugroeping van
      motorrijtuigen als bedoeld in artikel 20b, eerste lid, aanhef; of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 20b
        hoofdstuk: IIA
  - number: 20g.3.d
    text: toegang tot informatie te weigeren.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20g
  - number: 20h
    text: |-
      Het is verboden een motorrijtuig als bedoeld in [artikel 20b, eerste lid, aanhef][ref1], dat niet is aangewezen, op
      de weg te gebruiken of te laten staan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel20h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 20b
        hoofdstuk: IIA
  - number: '21.1'
    text: |-
      Voertuigen en systemen, onderdelen, technische eenheden, voertuigdelen, uitrustingsstukken en voorzieningen die
      voor dergelijke voertuigen en aanhangwagens daarvan zijn ontworpen en gebouwd en voorzieningen die ter bescherming
      van inzittenden van voertuigen en kwetsbare weggebruikers zijn ontworpen en gebouwd worden slechts op de markt
      aangeboden of in de handel gebracht nadat ze zijn goedgekeurd, nadat ze zijn goedgekeurd met een ontheffing of
      vrijstelling of nadat hiervoor een vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel21
  - number: '21.2'
    text: 'De goedkeuring, bedoeld in het eerste lid, kan zijn verleend als:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel21
  - number: 21.2.a
    text: |-
      EU-typegoedkeuring of individuele EU-goedkeuring indien wordt voldaan aan de daaraan gestelde eisen in de
      desbetreffende EU-verordening in verband met de goedkeuring motorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel21
  - number: 21.2.b
    text: |-
      nationale typegoedkeuring of -individuele goedkeuring indien dit bij ministeriële regeling is bepaald en wordt
      voldaan aan de daaraan gestelde eisen in [artikel 23, derde lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel23
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '23'
        hoofdstuk: III
        paragraaf: '1'
  - number: 21.2.c
    text: |-
      VN/ECE-goedkeuring indien wordt voldaan aan de daaraan gestelde eisen in de desbetreffende geharmoniseerde
      technische reglementen als bedoeld in de Overeenkomst van 1958.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel21
  - number: '21.3'
    text: 'Een ontheffing, vrijstelling of vergunning als bedoeld in het eerste lid kan zijn verleend als:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel21
  - number: 21.3.a
    text: |-
      een ontheffing, vrijstelling of vergunning in verband met EU-typegoedkeuring of individuele EU-goedkeuring indien
      wordt voldaan aan de daaraan gestelde voorwaarden in de desbetreffende EU-verordening in verband met de goedkeuring
      van motorvoertuigen; of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel21
  - number: 21.3.b
    text: |-
      een ontheffing, vrijstelling of vergunning in verband met een nationale typegoedkeuring of -individuele goedkeuring
      voor zover dit bij ministeriële regeling is bepaald.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel21
  - number: '21.4'
    text: |-
      In afwijking van het eerste lid, worden voertuigen na wijziging van de voorwaarden voor goedkeuring, slechts op de
      markt aangeboden of in de handel gebracht:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel21
  - number: 21.4.a
    text: |-
      indien het betreft een EU-typegoedkeuring of individuele EU-goedkeuring, zolang wordt voldaan aan de
      daaraan gestelde voorwaarden op grond van de desbetreffende EU-verordening in verband met de goedkeuring van
      motorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel21
  - number: 21.4.b
    text: |-
      indien het betreft een nationale typegoedkeuring of -individuele goedkeuring, zolang wordt voldaan aan de daaraan
      bij ministeriële regeling gestelde voorwaarden; of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel21
  - number: 21.4.c
    text: |-
      indien het betreft een VN/ECE-goedkeuring zolang wordt voldaan aan de daaraan gestelde voorwaarden in de
      desbetreffende geharmoniseerde technische reglement als bedoeld in de Overeenkomst van 1958.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel21
  - number: '21.5'
    text: |-
      In afwijking van het eerste lid, worden bij ministeriële regeling gevallen genoemd waarin voertuigen, systemen,
      onderdelen, technische eenheden, voertuigdelen, uitrustingsstukken en voorzieningen niet aan goedkeuring onderhevig
      zijn voordat ze op de markt mogen worden aangeboden of in de handel mogen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel21
  - number: '22.1'
    text: |-
      Een goedkeuring als bedoeld in [artikel 21, eerste lid][ref1], of een ontheffing, vrijstelling of vergunning,
      bedoeld in artikel 21, derde lid, kan op aanvraag door de Dienst Wegverkeer worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: '22.2'
    text: |-
      Een nationale typegoedkeuring of -individuele goedkeuring die is afgegeven door een goedkeuringsinstantie
      van een andere lidstaat van de Europese Unie wordt door de Dienst Wegverkeer gelijkgesteld met een nationale
      typegoedkeuring of -individuele goedkeuring indien wordt voldaan aan de voor gelijkstelling gestelde voorwaarden in
      de betreffende EU-verordening in verband met de goedkeuring van motorvoertuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel22
  - number: '22.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op een nationale typegoedkeuring of -individuele goedkeuring die
      is verleend door het bevoegd gezag van een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of die is verleend door het daartoe bevoegde gezag in Zwitserland indien dit voortvloeit uit
      de op 21 juni 1999 te Luxemburg tot stand gekomen Overeenkomst tussen de Europese Gemeenschap en de Zwitserse
      Bondsstaat inzake de wederzijdse erkenning van de overeenstemmingsbeoordeling (PbEG L 114).
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel22
  - number: '22.4'
    text: |-
      Een EU-typegoedkeuring of individuele EU-goedkeuring, als bedoeld in [artikel 21, tweede lid, onderdeel a][ref1],
      of een ontheffing, vrijstelling of vergunning, bedoeld in artikel 21, derde lid, onderdeel a, kan ook zijn verleend
      door een goedkeuringsinstantie van een andere lidstaat van de Europese Unie als bedoeld in een EU-verordening in
      verband met de goedkeuring van motorvoertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: '22.5'
    text: |-
      Een VN/ECE goedkeuring kan ook zijn verleend door het daartoe bevoegde gezag in een Staat die partij is bij de
      Overeenkomst van 1958.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel22
  - number: '23.1'
    text: |-
      Bij ministeriële regeling worden in verband met nationale typegoedkeuringen en -individuele goedkeuring nadere
      regels gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel23
  - number: '23.2'
    text: 'De in het eerste lid bedoelde regels kunnen in elk geval betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel23
  - number: 23.2.a
    text: |-
      de goedkeuringseisen voor voertuigen en systemen, onderdelen, technische eenheden, voertuigdelen,
      uitrustingsstukken en voorzieningen die voor dergelijke voertuigen en aanhangwagens daarvan zijn ontworpen en
      gebouwd of die ter bescherming van inzittenden van voertuigen en kwetsbare weggebruikers zijn ontworpen en gebouwd;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel23
  - number: 23.2.b
    text: de aanwezigheid van certificaten van overeenstemming;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel23
  - number: 23.2.c
    text: het aanbrengen van platen of goedkeuringsmerken;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel23
  - number: 23.2.d
    text: de toegang tot informatie uit het boorddiagnosesysteem en de reparatie- en onderhoudsinformatie;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel23
  - number: 23.2.e
    text: de wijze van goedkeuren; en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel23
  - number: 23.2.f
    text: |-
      de wijze waarop de conformiteit van de productie wordt geborgd, de controle hierop en de medewerking die daarvoor
      bij de noodzakelijke werkzaamheden wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel23
  - number: '23.3'
    text: |-
      De Dienst Wegverkeer verleent een nationale typegoedkeuring of -individuele goedkeuring indien een voertuig
      of systeem, onderdeel, technische eenheid, voertuigdeel, uitrustingsstuk of voorziening voor een voertuig of
      aanhangwagen daarvan of voorziening ter bescherming van inzittenden van voertuigen en kwetsbare weggebruikers,
      voldoet aan de op grond van het eerste lid gestelde eisen en, indien van toepassing, aan de daaraan gestelde eisen
      in een EU-harmonisatieverordening in verband met de goedkeuring van motorvoertuigen tenzij de Dienst Wegverkeer van
      oordeel is deze goedkeuring zal leiden tot een ernstig gevaar voor de gezondheid, verkeersveiligheid, het milieu of
      andere aspecten van de bescherming van het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel23
  - number: '24'
    text: |-
      De Dienst Wegverkeer kan met het oog op het door hem verlenen van een nationale typegoedkeuring of -individuele
      goedkeuring voor de voor die goedkeuring noodzakelijke tests gebruik maken van de op grond van een EU-
      kaderverordening in verband met de goedkeuring van motorvoertuigen door hem aangewezen technische diensten.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel24
  - number: '25'
    text: |-
      Degene aan wie een nationale typegoedkeuring of een VN/ECE-goedkeuring is verleend, is gehouden alle
      noodzakelijke medewerking te verlenen ten behoeve van controle op de conformiteit van de productie, bedoeld
      in [artikel 23, tweede lid, onderdeel f][ref1], het onderzoek ten behoeve van besluiten op grond van
      [artikel 26][ref2], en het markttoezicht, bedoeld in [artikel 158a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel158a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '23'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '26'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 158a
        hoofdstuk: IX
  - number: '26.1'
    text: |-
      De Dienst Wegverkeer trekt een door hem verleende nationale typegoedkeuring of -individuele goedkeuring of VN/ECE-
      goedkeuring in, indien:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel26
  - number: 26.1.a
    text: degene aan wie de goedkeuring is verleend, daarom verzoekt; of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel26
  - number: 26.1.b
    text: blijkt dat de goedkeuring ten onrechte is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel26
  - number: '26.2'
    text: |-
      De Dienst Wegverkeer kan een door hem verleende nationale typegoedkeuring of -individuele goedkeuring of VN/ECE-
      goedkeuring schorsen of intrekken indien:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel26
  - number: 26.2.a
    text: |-
      degene aan wie de goedkeuring is verleend een voertuig of systeem, onderdeel, technische eenheid, voertuigdeel,
      uitrustingsstuk of voorziening voor een voertuig of aanhangwagen daarvan of de voorziening ter bescherming
      van inzittenden van voertuigen en kwetsbare weggebruikers doet of laat doorgaan voor goedgekeurd, terwijl die
      goedkeuring niet overeenstemt met het type waarvoor de goedkeuring is verleend;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel26
  - number: 26.2.b
    text: |-
      het voertuig of systeem, onderdeel, technische eenheid, voertuigdeel, uitrustingsstuk of voorziening voor een
      voertuig of aanhangwagen daarvan of de voorzieningen ter bescherming van inzittenden of kwetsbare weggebruikers
      waarvoor de goedkeuring is verleend, desalniettemin een ernstig gevaar vormt voor de gezondheid, de veiligheid, het
      milieu of andere aspecten van de bescherming van het openbaar belang;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel26
  - number: 26.2.c
    text: |-
      de verplichtingen, bedoeld in [artikel 23, tweede lid][ref1], [25][ref2] of [28, tweede lid][ref3], niet worden
      nagekomen; of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel28
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '23'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '25'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '28'
        hoofdstuk: III
        paragraaf: '1'
  - number: 26.2.d
    text: |-
      degene aan wie de goedkeuring is verleend, handelt in strijd met een of meer andere uit de goedkeuring
      voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel26
  - number: '26.3'
    text: |-
      De Dienst Wegverkeer kan een door hem verleende nationale typegoedkeuring of -individuele goedkeuring of VN/ECE-
      goedkeuring schorsen indien de goedkeuring ten onrechte lijkt te zijn verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel26
  - number: '27.1'
    text: |-
      Indien een fabrikant op de markt aangeboden of in de handel gebrachte voertuigen of systemen, onderdelen,
      technische eenheden, voertuigdelen, uitrustingsstukken en voorzieningen die voor dergelijke voertuigen en
      aanhangwagens daarvan zijn bestemd, voorzien van een nationale typegoedkeuring of VN/ECE-goedkeuring, of
      voorzieningen ter bescherming van inzittenden van voertuigen en kwetsbare weggebruikers voorzien van een VN/ECE-
      goedkeuring, uit de handel dient te nemen of dient terug te roepen omdat deze een ernstig gevaar vormen voor de
      gezondheid, de veiligheid, het milieu of andere aspecten van de bescherming van het openbaar belang, of indien
      deze niet blijkt te voldoen aan de daaraan voor goedkeuring gestelde eisen, stelt de fabrikant de Dienst Wegverkeer
      hiervan onmiddellijk in kennis.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel27
  - number: '27.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld in verband met de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel27
  - number: '28.1'
    text: |-
      Een bij de Dienst Wegverkeer in te dienen aanvraag of verzoek in verband met de uitvoering van een EU-verordening
      in verband met de goedkeuring van motorvoertuigen of in verband met de uitvoering van dit hoofdstuk en de daarop
      berustende bepalingen, wordt ingediend op de door de Dienst Wegverkeer te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel28
  - number: '28.2'
    text: |-
      De kosten die samenhangen met het in behandeling nemen van een aanvraag of verzoek als bedoeld in het eerste lid
      en in verband met het door de Dienst Wegverkeer verrichten van taken en handelingen en het nemen van besluiten als
      bedoeld in artikel 4b, onderdelen a, a1 en b, worden door de Dienst Wegverkeer vastgesteld en komen ten laste van
      de aanvrager.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel28
  - number: '29.1'
    text: |-
      Het is marktdeelnemers verboden in strijd te handelen met de bij ministeriële regeling genoemde artikelen van
      een EU-verordening in verband met de goedkeuring van motorvoertuigen, die betrekking hebben op het op de markt
      aanbieden of in de handel brengen van voertuigen en systemen, onderdelen, technische eenheden, voertuigdelen,
      uitrustingsstukken en voorzieningen voor dergelijke voertuigen en aanhangwagens daarvan of voorzieningen ter
      bescherming van inzittenden van voertuigen en kwetsbare weggebruikers:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel29
  - number: 29.1.a
    text: zonder dat daarvoor goedkeuring is verleend;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel29
  - number: 29.1.b
    text: indien niet aan de voor goedkeuring gestelde eisen wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel29
  - number: 29.1.c
    text: |-
      zonder dat het door de Dienst Wegverkeer is goedgekeurd met een ontheffing, vrijstelling, of zonder dat een
      vergunning daarvoor is verleend of terwijl in strijd met de aan een ontheffing, vrijstelling of vergunning
      verbonden voorschriften of beperkingen wordt gehandeld; of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel29
  - number: 29.1.d
    text: |-
      die zijn voorzien van vervalste of onjuiste certificaten van overeenstemming, platen of goedkeuringsmerken met het
      doel anderen te misleiden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel29
  - number: '29.2'
    text: |-
      Het is marktdeelnemers verboden in strijd te handelen met de bij ministeriële regeling genoemde artikelen van een
      EU-verordening in verband met de goedkeuring van motorvoertuigen, die betrekking hebben op het zonder certificaten
      van overeenstemming of zonder voorgeschreven platen of goedkeuringsmerken op de markt aanbieden of in de handel
      brengen van voertuigen en systemen, onderdelen, technische eenheden, voertuigdelen, uitrustingsstukken en
      voorzieningen voor dergelijke voertuigen en aanhangwagens of voorzieningen ter bescherming van inzittenden van
      voertuigen en kwetsbare weggebruikers.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel29
  - number: '29.3'
    text: |-
      Het is marktdeelnemers verboden in strijd te handelen met de bij ministeriële regeling genoemde artikelen van een
      EU-verordening in verband met de goedkeuring van motorvoertuigen die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel29
  - number: 29.3.a
    text: |-
      het gebruik van manipulatie-instrumenten of -strategieën of het vervalsen van testresultaten voor typegoedkeuring
      of markttoezicht;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel29
  - number: 29.3.b
    text: |-
      het afleggen van valse verklaringen tijdens goedkeuringsprocedures of procedures die tot terugroeping leiden of
      zouden kunnen leiden dan wel terwijl er corrigerende of beperkende maatregelen gelden;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel29
  - number: 29.3.c
    text: |-
      het achterhouden van gegevens of technische specificaties die tot weigering of intrekking van de goedkeuring of tot
      terugroeping zouden kunnen leiden;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel29
  - number: 29.3.d
    text: het weigeren van toegang tot informatie; of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel29
  - number: 29.3.e
    text: |-
      op marktdeelnemers rustende verplichtingen in verband met het goedkeuringsproces, het markttoezicht of in verband
      met het op de markt aanbieden of in de handel brengen van voertuigen, systemen, onderdelen, technische eenheden,
      voertuigdelen, uitrustingsstukken en voorzieningen voor dergelijke voertuigen en aanhangwagens of voorzieningen ter
      bescherming van inzittenden van voertuigen en kwetsbare weggebruikers.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel29
  - number: '30.1'
    text: |-
      Het is marktdeelnemers verboden voertuigen en systemen, onderdelen, technische eenheden, voertuigdelen,
      uitrustingsstukken en voorzieningen voor dergelijke voertuigen en aanhangwagens daarvan waarvoor een nationale
      typegoedkeuring, -individuele goedkeuring of VN/ECE-goedkeuring is vereist, of voorzieningen ter bescherming van
      inzittenden van voertuigen en kwetsbare weggebruikers waarvoor een VN/ECE-goedkeuring is vereist op de markt aan te
      bieden of in de handel te brengen:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel30
  - number: 30.1.a
    text: zonder dat een dergelijke goedkeuring is verleend;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel30
  - number: 30.1.b
    text: indien niet aan de voor een dergelijke goedkeuring gestelde eisen wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel30
  - number: 30.1.c
    text: |-
      indien in strijd met de voorschriften of beperkingen wordt gehandeld die zijn opgenomen in de
      aan de goedkeuring verbonden ontheffing, vrijstelling, of verleende vergunning, als bedoeld in
      [artikel 21, derde lid, onderdeel b][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: 30.1.d
    text: |-
      die zijn voorzien van vervalste of onjuiste certificaten van overeenstemming, platen of goedkeuringsmerken met het
      doel anderen te misleiden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel30
  - number: '30.2'
    text: |-
      Het is marktdeelnemers verboden voertuigen en systemen, onderdelen, technische eenheden, voertuigdelen,
      uitrustingsstukken en voorzieningen voor dergelijke voertuigen en aanhangwagens daarvan of voorzieningen ter
      bescherming van voorziening ter bescherming van inzittenden van voertuigen en kwetsbare weggebruikers op de
      markt aan te bieden of in de handel te brengen zonder de op grond van deze wet voorgeschreven certificaten van
      overeenstemming of zonder de voorgeschreven platen of goedkeuringsmerken.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel30
  - number: '30.3'
    text: 'Het is marktdeelnemers verboden:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel30
  - number: 30.3.a
    text: |-
      gebruik te maken van manipulatie-instrumenten of -strategieën of testresultaten te vervalsen tijdens de
      goedkeuringsprocedure ten behoeve van een goedkeuring als bedoeld in het eerste lid of het markttoezicht daarop;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel30
  - number: 30.3.b
    text: |-
      valse verklaringen af te leggen tijdens de goedkeuringsprocedure of procedures die tot terugroeping leiden of
      zouden kunnen leiden dan wel terwijl er corrigerende of beperkende maatregelen gelden op grond van deze wet;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel30
  - number: 30.3.c
    text: |-
      gegevens of technische specificaties achter te houden die tot weigering of intrekking van een goedkeuring als
      bedoeld in het eerste lid, zouden kunnen leiden of tot terugroeping van voertuigen en systemen, onderdelen,
      technische eenheden, voertuigdelen, uitrustingsstukken en voorzieningen voor dergelijke voertuigen en aanhangwagens
      daarvan of van voorzieningen ter bescherming van inzittenden van voertuigen en kwetsbare weggebruikers; of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel30
  - number: 30.3.d
    text: toegang tot informatie te weigeren.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel30
  - number: '31'
    text: |-
      Het is een op grond van een EU-kaderverordening in verband met de goedkeuring van motorvoertuigen aangewezen
      technische dienst verboden in strijd te handelen met de bij ministeriële regeling genoemde artikelen van de EU-
      kaderverordening waarop de aanwijzing berust.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel31
  - number: '32'
    text: |-
      Tenzij hiervoor een ontheffing, vrijstelling of vergunning als bedoeld in [artikel 21, derde lid][ref1], is
      verleend of in het geval geen goedkeuring is vereist op grond van artikel 21, vijfde lid, is het verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: 32.a
    text: een niet goedgekeurd voertuig te gebruiken of op de weg te laten staan;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel32
  - number: 32.b
    text: |-
      een niet goedgekeurd systeem, onderdeel, technische eenheid, voertuigdeel, uitrustingsstuk en voorziening te
      gebruiken in een voertuig;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel32
  - number: 32.c
    text: |-
      een systeem, onderdeel, technische eenheid, voertuigdeel, uitrustingsstuk en voorziening te gebruiken in een
      voertuig waarvoor het betreffende systeem, onderdeel, technische eenheid, voertuigdeel, uitrustingsstuk of de
      voorziening niet is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel32
  - number: 32.d
    text: |-
      een niet goedgekeurde voorziening die ter bescherming van inzittenden van voertuigen en kwetsbare weggebruikers is
      ontworpen en gebouwd te gebruiken.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel32
  - number: '33'
    text: |-
      Het is verboden bij algemene maatregel van bestuur aan te wijzen voorzieningen die zijn bestemd voor de opsporing
      van bij of krachtens deze wet strafbaar gestelde misdrijven of overtredingen te belemmeren, te vervaardigen, in te
      voeren, in voorraad te hebben, te koop aan te bieden, af te leveren, te vervoeren of te gebruiken.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel33
  - number: '36.1'
    text: |-
      Aan de eigenaar of houder van een motorrijtuig of een aanhangwagen op de weg dient overeenkomstig bij algemene
      maatregel van bestuur vastgestelde regels door de Dienst Wegverkeer een kenteken voor dat voertuig te zijn
      opgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel36
  - number: '36.2'
    text: |-
      Ter zake van de in het eerste lid bedoelde opgave dient overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels door de Dienst Wegverkeer een kentekenbewijs te zijn afgegeven aan de eigenaar of houder van
      het voertuig.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel36
  - number: '36.3'
    text: 'Het kentekenbewijs dient:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel36
  - number: 36.3.a
    text: te voldoen aan de bij ministeriële regeling vastgestelde eisen inzake inrichting en uitvoering,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel36
  - number: 36.3.b
    text: zijn geldigheid niet te hebben verloren,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel36
  - number: 36.3.c
    text: niet te zijn ingevorderd, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel36
  - number: 36.3.d
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel36
  - number: '36.5'
    text: |-
      Motorrijtuigen en aanhangwagens dienen overeen te komen met de gegevens in het voor het betrokken voertuig
      afgegeven kentekenbewijs en met de gegevens die omtrent het voertuig zijn opgenomen in het kentekenregister, tenzij
      krachtens [artikel 71][ref1] een bepaalde afwijking van die gegevens is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
  - number: '36.6'
    text: 'Voor overtreding van het eerste tot en met vijfde lid zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel36
  - number: 36.6.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder die het motorrijtuig op de weg laat staan of daarmee
      over de weg laat rijden, alsmede in het geval dat met dat motorrijtuig over de weg wordt gereden, de bestuurder, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel36
  - number: 36.6.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder die de aanhangwagen op de weg laat staan of deze met
      een motorrijtuig over de weg laat voortbewegen, alsmede in het geval dat de aanhangwagen met een motorrijtuig over
      de weg wordt voortbewogen, de bestuurder van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel36
  - number: '36.7'
    text: |-
      De in het derde lid, onderdeel *a*, bedoelde eisen kunnen mede dienstbaar zijn aan de heffing van de belasting van
      personenauto’s en motorrijwielen en van de motorrijtuigenbelasting.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel36
  - number: '36.8'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel36
  - number: '37.1'
    text: |-
      [Artikel 36][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 37.1.a
    text: 'de volgende categorieën motorrijtuigen:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: 37.1.a.1°
    text: |-
      bij algemene maatregel van bestuur vastgestelde categorieën bromfietsen, alsmede bromfietsen in het internationaal
      verkeer, afkomstig uit een land waar voor deze voertuigen geen kenteken is opgegeven,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: 37.1.a.2°
    text: |-
      bij algemene maatregel van bestuur aangewezen landbouw- of bosbouwtrekkers, motorrijtuigen met beperkte snelheid en
      mobiele machines, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: 37.1.a.3°
    text: gehandicaptenvoertuigen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: 37.1.b
    text: |-
      in het buitenland geregistreerde motorrijtuigen en aanhangwagens, die zich in het internationaal verkeer bevinden,
      mits ter zake van de registratie van het betrokken voertuig door het daartoe bevoegde gezag in het buitenland een
      bewijs is afgegeven dat voldoet aan de daaraan gestelde eisen in de tussen Nederland en het betrokken land van
      kracht zijnde internationale overeenkomst en het betrokken voertuig voldoet aan de eisen die in die overeenkomst
      dan wel bij algemene maatregel van bestuur ter uitvoering van die overeenkomst aan dat voertuig worden gesteld met
      betrekking tot de toelating tot het internationaal verkeer;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: 37.1.c
    text: |-
      motorrijtuigen en aanhangwagens, mits wordt voldaan aan nadere bij ministeriële regeling vast te stellen regels,
      die in eigendom toebehoren aan of worden gehouden door:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: 37.1.c.1°
    text: |-
      leden van een bij ministeriële regeling aangewezen krijgsmacht of civiele dienst in de zin van artikel I van het
      op 19 juni 1951 te Londen gesloten Verdrag tussen de landen die partij zijn bij het Noord-Atlantisch Verdrag nopens
      de rechtspositie van hun krijgsmachten (Trb. 1953, 10), dan wel in de zin van artikel 3 van het bij evenbedoeld
      verdrag behorende, op 28 augustus 1952 te Parijs gesloten, protocol nopens de rechtspositie van internationale
      militaire hoofdkwartieren ingesteld uit hoofde van het Noord-Atlantisch Verdrag (Trb. 1953, 11), alsmede
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: 37.1.c.2°
    text: |-
      functionarissen van de Noord-Atlantische Verdragsorganisatie die in Nederland zijn op grond van de briefwisseling
      tussen de regering van het Koninkrijk der Nederlanden en de Noord-Atlantische Verdragsorganisatie van 31 augustus
      en 11 september 1979 (Trb.1979, 159) en op wie het Verdrag nopens de rechtspositie van de Noord-Atlantische
      Verdragsorganisatie, van de nationale vertegenwoordigers bij haar organen en van haar internationale staf
      (Trb.1951, 139), van toepassing is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: '37.2'
    text: |-
      [Artikel 36][ref1] is voorts niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 37.2.a
    text: |-
      aanhangwagens die uitsluitend bestemd zijn om te worden voortbewogen door de in het eerste lid, onderdeel a, onder
      1° en 3°, genoemde motorrijtuigen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: 37.2.b
    text: 'aanhangwagens met een toegestane maximummassa van:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: 37.2.b.1°
    text: niet meer dan 750 kg;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: 37.2.b.2°
    text: meer dan 750 kg afkomstig uit een land waar voor deze aanhangwagens geen afzonderlijk kenteken is opgegeven,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: 37.2.c
    text: |-
      bij algemene maatregel van bestuur aangewezen aanhangwagens die uitsluitend zijn bestemd om te worden voortbewogen
      door een landbouw- of bosbouwtrekker, een motorrijtuig met beperkte snelheid of een mobiele machine, met dien
      verstande dat een dergelijke aanhangwagen is voorzien van een kenteken dat is opgegeven voor een landbouw- of
      bosbouwtrekker, motorrijtuig met beperkte snelheid of mobiele machine waarvan de eigenaar of houder dezelfde is
      als de eigenaar of houder van de landbouw- of bosbouwtrekker, het motorrijtuig met beperkte snelheid of de mobiele
      machine waarmee die aanhangwagen verbonden is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: '37.3'
    text: |-
      Voor motorrijtuigen en aanhangwagens, die behoren tot de bedrijfsvoorraad van een natuurlijke persoon of
      rechtspersoon aan wie een erkenning als bedoeld in [artikel 62][ref1] is verleend of die voor herstel of bewerking
      ter beschikking zijn gesteld van een natuurlijke persoon of rechtspersoon, geldt het vereiste dat een kenteken
      voor een bepaald voertuig dient te zijn opgegeven niet, mits overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels gebruik wordt gemaakt van een bij algemene maatregel van bestuur aangewezen, door de Dienst
      Wegverkeer aan die natuurlijke persoon of rechtspersoon dan wel aan een natuurlijke persoon of rechtspersoon
      aan wie een erkenning als bedoeld in artikel 62 is verleend en die het voertuig ten behoeve van eerstbedoelde
      natuurlijke persoon of rechtspersoon ten verkoop voorhanden heeft, opgegeven kenteken. De Dienst Wegverkeer kan aan
      deze opgaven voorschriften verbinden. Bij ministeriële regeling kunnen met betrekking tot die voorschriften regels
      worden vastgesteld. Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen het gebruik van een
      zodanig kenteken verplicht is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '37.4'
    text: |-
      Met het toezicht op de naleving van de uit het derde lid voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de Staatscourant. Het toezicht heeft in ieder geval betrekking op het gebruik van het in het derde lid bedoelde
      kenteken. De aldaar bedoelde natuurlijke persoon of rechtspersoon is gehouden tot betaling, op de door de Dienst
      Wegverkeer vastgestelde wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde
      tarief. Bij ministeriële regeling worden nadere regels omtrent het toezicht vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: '37.5'
    text: 'Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: 37.5.a
    text: |-
      in bepaalde uitzonderingsgevallen tijdelijk wordt of kan worden afgeweken van het in
      [artikel 36, derde lid, onderdeel b of c][ref1], bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 37.5.b
    text: |-
      een motorrijtuig of een aanhangwagen op de weg mag staan, indien de tenaamstelling vervallen is verklaard ingevolge
      [artikel 51a, derde lid, onderdeel b, c, d of f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel51a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 51a
        hoofdstuk: IV
        paragraaf: 4a
  - number: '37.6'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de omschrijving van de in het eerste
      lid, onderdeel a, bedoelde categorieën voertuigen alsmede de voor die categorieën vastgestelde maximumsnelheid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: '37.7'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het derde lid en kunnen nadere regels
      worden vastgesteld ter uitvoering van het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel37
  - number: '38.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat bepaalde categorieën van kentekens slechts worden
      opgegeven aan bij die algemene maatregel van bestuur aan te wijzen personen of groepen van personen dan wel voor
      daarbij aan te wijzen voertuigen of groepen van voertuigen, zulks onder daarbij te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel38
  - number: '38.2'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel38
  - number: '40.1'
    text: Het kenteken dient behoorlijk zichtbaar op of aan het motorrijtuig of de aanhangwagen aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel40
  - number: '40.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de inrichting, het aanbrengen en
      de verlichting van het kenteken en worden regels vastgesteld omtrent de kentekenplaat en de onderdelen daarvan,
      alsmede de daarop aan te brengen merken.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel40
  - number: '40.3'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het bepaalde krachtens het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel40
  - number: '40.4'
    text: 'Voor overtreding van het eerste lid dan wel het bepaalde krachtens het tweede of derde lid zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel40
  - number: 40.4.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder die het motorrijtuig op de weg laat staan of daarmee
      over de weg laat rijden, alsmede in het geval dat met dat motorrijtuig over de weg wordt gereden, de bestuurder, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel40
  - number: 40.4.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder die de aanhangwagen op de weg laat staan of deze met
      een motorrijtuig over de weg laat voortbewegen, alsmede in het geval dat de aanhangwagen met een motorrijtuig over
      de weg wordt voortbewogen, de bestuurder van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel40
  - number: '41.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel41
  - number: 41.1.a
    text: |-
      op een motorrijtuig of een aanhangwagen enig teken of middel aan te brengen of te doen aanbrengen met het oogmerk
      de herkenning, daaronder begrepen de herkenning met behulp van technische voorzieningen, van het ingevolge
      [artikel 40][ref1] gevoerde kenteken te bemoeilijken;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 41.1.b
    text: |-
      een motorrijtuig op de weg te laten staan of daarmee over de weg te rijden dan wel een aanhangwagen op de weg te
      laten staan of met een motorrijtuig over de weg voort te bewegen, wanneer op dat motorrijtuig of die aanhangwagen
      enig teken of middel is aangebracht, waardoor de herkenning, daaronder begrepen de herkenning met behulp van
      technische voorzieningen, van het ingevolge [artikel 40][ref1] gevoerde kenteken wordt bemoeilijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 41.1.c
    text: |-
      op een motorrijtuig of een aanhangwagen een teken, niet zijnde een ingevolge [artikel 36][ref1] aan de eigenaar of
      houder voor dat motorrijtuig of die aanhangwagen opgegeven kenteken, aan te brengen of te doen aanbrengen met het
      oogmerk dat teken te doen doorgaan voor een zodanig kenteken dan wel met de kennelijke bedoeling dat teken te doen
      doorgaan voor een overeenkomstig de daarvoor geldende voorschriften opgegeven buitenlands kenteken dan wel een met
      toepassing van [artikel 37, derde lid][ref2], opgegeven kenteken;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 41.1.d
    text: |-
      een motorrijtuig op de weg te laten staan of daarmee over de weg te rijden dan wel een aanhangwagen op de weg te
      laten staan of met een motorrijtuig over de weg voort te bewegen, wanneer op dat motorrijtuig of die aanhangwagen
      een teken is aangebracht dat, niet zijnde een ingevolge [artikel 36][ref1] aan de eigenaar of houder voor dat
      motorrijtuig of die aanhangwagen opgegeven kenteken, door kan gaan voor een zodanig kenteken dan wel voor een
      overeenkomstig de daarvoor geldende voorschriften opgegeven buitenlands kenteken of een met toepassing van
      [artikel 37, derde lid][ref2], opgegeven kenteken;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 41.1.e
    text: |-
      op een in het buitenland geregistreerd motorrijtuig of een in het buitenland geregistreerde aanhangwagen een teken,
      niet zijnde een aldaar voor dat voertuig of aan de eigenaar of houder daarvan opgegeven kenteken, aan te brengen of
      te doen aanbrengen met het oogmerk dat teken te doen doorgaan voor een zodanig kenteken;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel41
  - number: 41.1.f
    text: |-
      een in het buitenland geregistreerd motorrijtuig op de weg te laten staan of daarmee over de weg te rijden dan
      wel een in het buitenland geregistreerde aanhangwagen op de weg te laten staan of met een motorrijtuig over de weg
      voort te bewegen, wanneer op dat motorrijtuig of die aanhangwagen een teken is aangebracht dat, niet zijnde een in
      het buitenland voor dat voertuig of aan de eigenaar of houder daarvan opgegeven kenteken, door kan gaan voor een
      zodanig kenteken.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel41
  - number: '41.2'
    text: 'Voor overtreding van het eerste lid, onderdelen b, d en f, zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel41
  - number: 41.2.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder die het motorrijtuig op de weg laat staan of daarmee
      over de weg laat rijden, alsmede in het geval dat met dat motorrijtuig over de weg wordt gereden, de bestuurder,
      een en ander echter slechts indien de eigenaar, houder of bestuurder weet of redelijkerwijze kan vermoeden dat op
      het motorrijtuig een teken of middel als bedoeld in het eerste lid, onderdeel b, dan wel een teken als bedoeld in
      het eerste lid, onderdeel d of f, is aangebracht, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel41
  - number: 41.2.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder die de aanhangwagen op de weg laat staan of deze
      met een motorrijtuig over de weg laat voortbewegen, alsmede in het geval dat de aanhangwagen met een motorrijtuig
      over de weg wordt voortbewogen, de bestuurder van dat motorrijtuig, een en ander echter slechts indien de eigenaar,
      houder of bestuurder weet of redelijkerwijze kan vermoeden dat op de aanhangwagen een teken of middel als bedoeld
      in het eerste lid, onderdeel b, dan wel een teken als bedoeld in het eerste lid, onderdeel d of f, is aangebracht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel41
  - number: 41a.1
    text: 'Voor de toepassing van deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel41a
  - number: 41a.1.a
    text: |-
      overheidsorgaan: bestuursorgaan als bedoeld in
      [artikel 1:1, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1] en personen of instanties als
      bedoeld in het tweede lid;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 41a.1.b
    text: 'basisregistratie: verzameling gegevens waarvan bij wet is bepaald dat deze authentieke gegevens bevat;'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel41a
  - number: 41a.1.c
    text: |-
      authentiek gegeven: in een basisregistratie opgenomen gegeven dat bij of krachtens wet als authentiek is
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel41a
  - number: 41a.2
    text: |-
      In aanvulling op het eerste lid wordt onder overheidsorgaan mede verstaan de bij ministeriële regeling aangewezen
      personen of instanties die een publieke taak uitoefenen, voor zover die aanwijzing naar het oordeel van Onze
      Minister noodzakelijk is met het oog op een goede uitoefening van hun publieke taak.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel41a
  - number: '42.1'
    text: Er is een kentekenregister. Dit register is een basisregistratie.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42
  - number: '42.2'
    text: De Dienst Wegverkeer is de beheerder en verwerkingsverantwoordelijke van het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42
  - number: '42.3'
    text: |-
      In het kentekenregister verwerkt de Dienst Wegverkeer gegevens omtrent motorrijtuigen en aanhangwagens waarvoor
      een kenteken is opgegeven en de tenaamstelling van die motorrijtuigen en aanhangwagens, alsmede omtrent andere
      motorrijtuigen en aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42
  - number: '42.4'
    text: 'Het verzamelen van de gegevens, bedoeld in het derde lid, geschiedt voor de volgende doeleinden:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42
  - number: 42.4.a
    text: |-
      voor een goede uitvoering van het bepaalde bij of krachtens deze wet en voor de handhaving van de bij of krachtens
      deze wet gestelde voorschriften,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42
  - number: 42.4.b
    text: |-
      voor een goede uitvoering van het bepaalde bij of krachtens de [Wet op de motorrijtuigenbelasting 1994][ref1],
      de [Wet op de belasting van personenauto’s en motorrijwielen 1992][ref2], de
      [Wet belasting zware motorrijtuigen][ref3], de [Wet aansprakelijkheidsverzekering motorrijtuigen][ref4], de
      [Wet tijdelijke tolheffing Blankenburgverbinding en ViA15][ref5], dan wel andere wettelijke regelingen ten
      aanzien van motorrijtuigen of aanhangwagens en voor de handhaving van het bepaalde bij of krachtens die wettelijke
      regelingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0006324
      [ref2]: https://wetten.overheid.nl/BWBR0005806
      [ref3]: https://wetten.overheid.nl/BWBR0007678
      [ref4]: https://wetten.overheid.nl/BWBR0002415
      [ref5]: https://wetten.overheid.nl/BWBR0037517
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006324
      - id: ref2
        bwb_id: BWBR0005806
      - id: ref3
        bwb_id: BWBR0007678
      - id: ref4
        bwb_id: BWBR0002415
      - id: ref5
        bwb_id: BWBR0037517
  - number: 42.4.c
    text: |-
      om overheidsorganen te voorzien van gegevens uit het kentekenregister voor zover zij aangeven deze gegevens nodig
      te hebben voor een goede uitoefening van hun publieke taak.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42
  - number: '42.5'
    text: |-
      De Dienst Wegverkeer mag persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] verwerken voor zover dit
      verband houdt met de in het vierde lid, onderdelen a en b, genoemde doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '42.6'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld betreffende de inrichting en
      het beheer van het kentekenregister, waaronder mede wordt begrepen de nadere uitwerking van
      de gegevens, persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], die in het kentekenregister
      worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '42.7'
    text: |-
      De gegevens omtrent motorrijtuigen en aanhangwagens die de Dienst Wegverkeer verwerkt in het landsbelang, worden
      niet opgenomen in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42
  - number: 42a.1
    text: 'De gegevens in het kentekenregister worden onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42a
  - number: 42a.1.a
    text: authentieke en niet-authentieke gegevens;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42a
  - number: 42a.1.b
    text: gevoelige en niet-gevoelige gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42a
  - number: 42a.2
    text: 'Als authentieke gegevens worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42a
  - number: 42a.2.a
    text: |-
      gegevens die op grond van een bindend besluit van de Raad van de Europese Unie, van het Europees Parlement en de
      Raad gezamenlijk of van de Commissie van de Europese Unie verplicht op het kentekenbewijs zijn opgenomen voor zover
      de desbetreffende gegevens niet reeds op grond van een andere wettelijke bepaling als authentiek zijn aangemerkt;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42a
  - number: 42a.2.b
    text: de voertuigcategorieën die worden onderscheiden in de EU-kaderverordeningen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42a
  - number: 42a.2.c
    text: de tenaamstelling van een motorrijtuig of aanhangwagen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42a
  - number: 42a.3
    text: |-
      Bij algemene maatregel van bestuur kunnen andere authentieke gegevens of categorieën daarvan worden aangewezen. Bij
      algemene maatregel van bestuur kan tevens als authentiek worden aangewezen de samenstelling van een uit een andere
      basisregistratie afkomstig gegeven met een of meer gegevens uit het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42a
  - number: 42a.4
    text: Bij algemene maatregel van bestuur worden gevoelige en niet-gevoelige gegevens of categorieën daarvan aangewezen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel42a
  - number: '43.1'
    text: |-
      Aan overheidsorganen worden door de Dienst Wegverkeer uit het kentekenregister gegevens, waaronder
      mede begrepen persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], verstrekt voor zover zij
      aangeven die gegevens nodig te hebben voor de uitoefening van hun publieke taak.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '43.2'
    text: |-
      Aan autoriteiten binnen de andere lidstaten van de Europese Unie en de andere staten die partij zijn bij de
      Overeenkomst buiten Nederland betreffende de Europese Economische Ruimte worden door de Dienst Wegverkeer
      in de bij of krachtens algemene maatregel van bestuur aangewezen gevallen uit het kentekenregister gegevens,
      waaronder mede begrepen persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '43.3'
    text: |-
      Aan autoriteiten buiten Nederland, niet zijnde autoriteiten uit lidstaten van de Europese Unie en staten die
      partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte worden door de Dienst Wegverkeer
      in de bij of krachtens algemene maatregel van bestuur aangewezen gevallen uit het kentekenregister gegevens,
      waaronder mede begrepen persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], verstrekt. Gegevens,
      waaronder mede begrepen persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in paragraaf
      3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming, kunnen ook worden verstrekt aan instellingen
      van internationale organisaties, voor zover dit ter uitvoering van een verdrag of een bindend besluit van een
      internationale organisatie vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '43.4'
    text: |-
      Aan bij of krachtens algemene maatregel van bestuur aangewezen personen of instanties of categorieën personen of
      instanties, niet zijnde de in het eerste tot en met derde lid bedoelde instanties, kunnen desgevraagd door de Dienst
      Wegverkeer voor de bij of krachtens algemene maatregel van bestuur aangegeven doeleinden uit het kentekenregister
      gevoelige gegevens, waaronder mede begrepen persoonsgegevens en persoonsgegevens van strafrechtelijke aard als
      bedoeld in [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '43.5'
    text: Niet-gevoelige gegevens uit het kentekenregister kunnen aan een ieder worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43
  - number: '43.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor de uitvoering van het eerste tot en met het vijfde lid
      nadere regels worden gesteld met betrekking tot de uit het kentekenregister te verstrekken gegevens, de wijze van
      verstrekking van die gegevens en kunnen voorwaarden worden verbonden aan de verstrekking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43
  - number: 43a.1
    text: |-
      De gegevensverstrekking aan ontvangers, bedoeld in [artikel 43][ref1] vindt plaats op door de Dienst Wegverkeer
      bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 43a.2
    text: |-
      De in [artikel 43, vierde en vijfde lid][ref1], bedoelde ontvangers zijn voor de verstrekking van gegevens een
      door de Dienst Wegverkeer vastgesteld tarief verschuldigd. De betrokkene zelf is alleen kosten verschuldigd voor
      bijkomende kopieën van persoonsgegevens, waaronder mede begrepen persoonsgegevens van strafrechtelijke aard als
      bedoeld in [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], alsmede voor de
      verstrekking van gegevens, niet zijnde persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 43a.3
    text: |-
      Onverminderd het tweede lid is degene die op grond van [artikel 43][ref1] een aanvraag indient tot geautomatiseerde
      verstrekking uit het kentekenregister van gegevens in door de Dienst Wegverkeer te bepalen gevallen een door deze
      dienst te bepalen aansluittarief verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 43b.1
    text: |-
      Een overheidsorgaan dat bij de vervulling van zijn publieke taak een gegeven nodig heeft dat bij of krachtens deze
      wet als authentiek gegeven is aangewezen en in het kentekenregister is opgenomen, maakt gebruik van dat gegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43b
  - number: 43b.2
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43b
  - number: 43b.2.a
    text: |-
      het overheidsorgaan ten aanzien van het betreffende gegeven een melding heeft gedaan als bedoeld in
      [artikel 43c, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43c
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 43c
        hoofdstuk: IV
        paragraaf: '3'
  - number: 43b.2.b
    text: |-
      bij het betreffende gegeven een aantekening is geplaatst als bedoeld in [artikel 43c, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43c
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 43c
        hoofdstuk: IV
        paragraaf: '3'
  - number: 43b.2.c
    text: bij wettelijk voorschrift anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43b
  - number: 43b.2.d
    text: |-
      een goede vervulling van de publieke taak van het overheidsorgaan door de onverkorte toepassing van het eerste lid
      wordt belet.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43b
  - number: 43b.3
    text: |-
      Een natuurlijke persoon of rechtspersoon aan wie door een overheidsorgaan een gegeven wordt gevraagd, waarop het
      eerste lid van toepassing is, behoeft dat gegeven niet mede te delen, behoudens voor zover het gegeven noodzakelijk
      wordt geacht voor een deugdelijke vaststelling van de identiteit van betrokkene of van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43b
  - number: 43c.1
    text: |-
      Een overheidsorgaan dat gerede twijfel heeft over de juistheid van een in het kentekenregister opgenomen authentiek
      gegeven, meldt die twijfel, onder opgave van redenen, aan de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43c
  - number: 43c.2
    text: |-
      Indien een melding als bedoeld in het eerste lid betrekking heeft op een gegeven dat afkomstig is uit een andere
      basisregistratie zendt de Dienst Wegverkeer de melding door aan de beheerder van dat register, tenzij met het
      overheidsorgaan dat een melding als bedoeld in het eerste lid doet is afgesproken dat dit overheidsorgaan de
      melding rechtstreeks doet aan de beheerder van het register waaruit het authentieke gegeven afkomstig is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43c
  - number: 43c.3
    text: |-
      De Dienst Wegverkeer tekent na ontvangst van een melding als bedoeld in het eerste lid, op de door deze dienst te
      bepalen wijze, in het kentekenregister aan dat het desbetreffende gegeven «in onderzoek» is, tenzij het een melding
      betreft die op grond van het tweede lid wordt doorgezonden aan de beheerder van een andere basisregistratie.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43c
  - number: 43c.4
    text: |-
      Indien een melding als bedoeld in het eerste lid betrekking heeft op een gegeven dat bij of krachtens deze wet als
      authentiek is aangewezen, besluit de Dienst Wegverkeer over wijziging van het gegeven en bericht deze dienst het
      overheidsorgaan dat de melding heeft gedaan onverwijld over deze beslissing.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43c
  - number: 43c.5
    text: |-
      Indien het besluit, bedoeld in het vierde lid, leidt tot wijziging van het authentieke gegeven doet de Dienst
      Wegverkeer onverwijld mededeling aan degene op wie het authentieke gegeven betrekking heeft, dan wel aan degene aan
      wie het kentekenbewijs is afgegeven voor het motorrijtuig of de aanhangwagen waarop het desbetreffende authentieke
      gegeven betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43c
  - number: 43c.6
    text: |-
      De Dienst Wegverkeer verwijdert de aantekening dat een gegeven in onderzoek is wanneer het besluit omtrent
      wijziging onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43c
  - number: 43c.7
    text: Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43c
  - number: 43d.1
    text: |-
      Indien de Dienst Wegverkeer constateert dat een door deze dienst in het kentekenregister geplaatst gegeven onjuist
      of ten onrechte in het kentekenregister is opgenomen, wijzigt of verwijdert deze dienst dat gegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43d
  - number: 43d.2
    text: |-
      Indien de Dienst Wegverkeer constateert dat een gegeven ten onrechte niet in het kentekenregister is opgenomen,
      neemt deze dienst dat gegeven alsnog in het kentekenregister op.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43d
  - number: 43d.3
    text: |-
      Van de beslissing tot wijzigen, verwijderen, dan wel alsnog opnemen van een authentiek gegeven in het
      kentekenregister doet de Dienst Wegverkeer onverwijld mededeling aan degene op wie het authentieke gegeven
      betrekking heeft, dan wel aan degene aan wie het kentekenbewijs is afgegeven voor het motorrijtuig of de
      aanhangwagen waarop het desbetreffende authentieke gegeven betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43d
  - number: 43e.1
    text: |-
      Indien een belanghebbende gegronde redenen heeft om aan te nemen dat een gegeven dat bij of krachtens deze wet als
      authentiek is aangemerkt of een niet-authentiek gegeven onjuist of ten onrechte wel, dan wel ten onrechte niet in
      het kentekenregister is opgenomen, kan hij onder opgave van die redenen aan de Dienst Wegverkeer een verzoek doen
      tot wijziging, verwijdering of opneming van dat gegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43e
  - number: 43e.2
    text: |-
      De Dienst Wegverkeer beslist naar aanleiding van een verzoek als bedoeld in het eerste lid over wijziging,
      verwijdering of opneming van het betreffende gegeven en bericht de belanghebbende die het verzoek heeft gedaan over
      deze beslissing.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43e
  - number: 43f
    text: |-
      Onverminderd [artikel 43c][ref1] zijn overheidsorganen gehouden om aan de Dienst Wegverkeer op de door deze dienst
      te bepalen wijze mededeling te doen van de hen in de uitoefening van hun functie ter kennis gekomen feiten, ingeval
      deze feiten aanleiding kunnen zijn om tot wijziging of aanvulling van de in het kentekenregister opgenomen gegevens
      over te gaan, dan wel anderszins van belang kunnen zijn voor de juistheid van deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43c
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel43f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 43c
        hoofdstuk: IV
        paragraaf: '3'
  - number: '44.1'
    text: |-
      De Dienst Wegverkeer neemt maatregelen met het oog op het waarborgen van de juistheid, de actualiteit en de
      volledigheid van het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel44
  - number: '44.2'
    text: |-
      De Dienst Wegverkeer laat ten minste eenmaal in de drie jaar een registeraccountant,
      dan wel een accountant die is ingeschreven in het register bedoeld in
      [artikel 36, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref1], een oordeel geven over de
      opzet en werking van het stelsel van interne beheersmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
  - number: '44.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitvoering van het eerste
      en tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel44
  - number: 45a.1
    text: |-
      Met het toezicht op het gebruik overeenkomstig het bepaalde bij of krachtens deze wet van uit het kentekenregister
      verstrekte gegevens zijn belast de bij besluit van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig
      besluit wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel45a
  - number: 45a.2
    text: |-
      Indien de Dienst Wegverkeer gerede twijfel heeft over de juistheid van een gegeven uit het kentekenregister dat
      betrekking heeft op een motorrijtuig of aanhangwagen, kan deze dienst degene aan wie het kentekenbewijs voor het
      betreffende motorrijtuig of aanhangwagen is afgegeven gelasten dat voertuig ter inspectie aan de Dienst Wegverkeer
      ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel45a
  - number: 45a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald in welke gevallen door de Dienst Wegverkeer een
      door deze dienst vastgesteld tarief ter zake van de kosten van toezicht als bedoeld in het eerste lid of van de
      inspectie bedoeld in het tweede lid in rekening wordt gebracht. Dit tarief wordt op door de Dienst Wegverkeer te
      bepalen wijze in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel45a
  - number: 45a.4
    text: |-
      Verstrekking van gegevens uit het kentekenregister kan achterwege worden gelaten indien naar het oordeel van de
      Dienst Wegverkeer sprake is van handelen in strijd met de doeleinden waarvoor dan wel de voorwaarden waaronder
      is verstrekt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel45a
  - number: '46.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld betreffende de met de registratie van kentekens
      samenhangende verplichtingen van degene:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel46
  - number: 46.1.a
    text: |-
      die de eigendom, het bezit of het houderschap van een motorrijtuig of een aanhangwagen, waarvoor nog geen kenteken
      is opgegeven, heeft verkregen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel46
  - number: 46.1.b
    text: aan wie een kenteken is opgegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel46
  - number: 46.1.c
    text: |-
      die de eigendom, het bezit of het houderschap van een motorrijtuig of een aanhangwagen, waarvoor een kenteken is
      opgegeven, heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel46
  - number: '46.2'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel46
  - number: '47'
    text: |-
      Motorrijtuigen en aanhangwagens op de weg waarvoor een kenteken is opgegeven dienen overeenkomstig bij algemene
      maatregel van bestuur vastgestelde regels te zijn ingeschreven in het kentekenregister en tenaamgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel47
  - number: '48.1'
    text: |-
      Inschrijving in het kentekenregister en tenaamstelling vinden, tegen betaling, op de door de Dienst Wegverkeer
      vastgestelde wijze, van de daarvoor door deze dienst vastgestelde tarieven, plaats op aanvraag van:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel48
  - number: 48.1.a
    text: in Nederland woonachtige natuurlijke personen die de leeftijd van achttien jaren hebben bereikt, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel48
  - number: 48.1.b
    text: |-
      in Nederland woonachtige natuurlijke personen die de leeftijd van zestien jaren hebben bereikt indien de aanvraag
      betrekking heeft een inschrijving en tenaamstelling van een bromfiets, en
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel48
  - number: 48.1.c
    text: in Nederland gevestigde rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel48
  - number: '48.2'
    text: |-
      Inschrijving in het kentekenregister vindt slechts plaats indien het motorrijtuig of de aanhangwagen waarvoor
      de inschrijving wordt verlangd, voorzien is van een goedkeuring als bedoeld in [artikel 21, tweede lid][ref1],
      en, indien na die goedkeuring wijziging is aangebracht in de bouw of inrichting van dat voertuig, die wijziging,
      behoudens in het geval dat geen goedkeuring is vereist, overeenkomstig [artikel 99, eerste lid][ref2], of
      [100, eerste lid][ref3], is goedgekeurd voor toelating van het gewijzigde voertuig tot het verkeer op de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel100
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '99'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '100'
        hoofdstuk: V
        paragraaf: '8'
  - number: 48.2b
    text: |-
      In afwijking van het tweede lid, kan de Dienst Wegverkeer inschrijving in het kentekenregister weigeren of aan de
      inschrijving voorschriften verbinden indien het goedgekeurde voertuig een zodanige afmeting of massa heeft, dat het
      gelet op de infrastructuur van de wegen, een ernstig gevaar kan vormen voor de gezondheid, veiligheid, het milieu
      of andere aspecten van de bescherming van het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel48
  - number: '48.3'
    text: |-
      In bepaalde uitzonderingsgevallen kan door de Dienst Wegverkeer een motorrijtuig of aanhangwagen worden
      ingeschreven, indien ten aanzien van het motorrijtuig of de aanhangwagen, waarvoor de inschrijving wordt verlangd,
      niet is voldaan aan het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel48
  - number: '48.4'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de ingevolge het eerste lid gestelde eisen aan de
      aanvrager van een inschrijving niet gelden ten aanzien van de aanvrager van een inschrijving ter zake van een
      kenteken als bedoeld in [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel38
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '48.5'
    text: |-
      Ingeval de aanvrager van een inschrijving en tenaamstelling van een bromfiets de leeftijd heeft van zestien of
      zeventien jaar, wordt diens wettelijke vertegenwoordiger verondersteld te hebben toegestemd in de aanvraag.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel48
  - number: '48.6'
    text: |-
      In afwijking van [artikel 47][ref1] kan in bij of krachtens algemene maatregel van bestuur bepaalde gevallen een
      voertuig in het kentekenregister worden ingeschreven zonder tenaamstelling. Door de Dienst Wegverkeer kan worden
      bepaald dat deze wijze van inschrijven gevolgen heeft voor het tijdstip van de verschuldigdheid van een deel van de
      in het eerste lid bedoelde tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel47
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '47'
        hoofdstuk: IV
        paragraaf: 4a
  - number: '48.7'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat in door de Dienst Wegverkeer te bepalen gevallen met een
      ingeschreven en te naam gesteld motorrijtuig of aanhangwagen niet op de weg mag worden gereden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel48
  - number: '48.8'
    text: Het verbod bedoeld in het zevende lid geldt vanaf een bij algemene maatregel van bestuur te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel48
  - number: '49.1'
    text: |-
      Onverminderd [artikel 48, eerste lid][ref1], wordt de inschrijving in het kentekenregister geweigerd:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '48'
        hoofdstuk: IV
        paragraaf: 4a
  - number: 49.1.a
    text: |-
      indien bij een ingevolge [hoofdstuk V][ref1] verrichte keuring blijkt dat de op het motorrijtuig of aanhangwagen
      aangebrachte gegevens op onrechtmatige wijze in overeenstemming zijn gebracht met de in het kentekenregister of op
      het overgelegde kentekenbewijs vermelde gegevens,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: V
  - number: 49.1.b
    text: indien blijkt dat de ter zake van het voertuig verschuldigde belastingen en rechten niet zijn voldaan,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel49
  - number: 49.1.c
    text: |-
      indien blijkt dat de krachtens een algemeen verbindend verklaarde overeenkomst op grond van de
      [Wet milieubeheer][ref1] verschuldigde afvalbeheerbijdrage voor autowrakken niet is voldaan, of


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 49.1.d
    text: |-
      in overige bij algemene maatregel van bestuur te bepalen gevallen overeenkomstig de bij die algemene maatregel van
      bestuur vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel49
  - number: '49.2'
    text: 'De inschrijving in het kentekenregister kan worden geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel49
  - number: 49.2.a
    text: |-
      voor het motorrijtuig of de aanhangwagen waarvoor de inschrijving wordt verlangd, op grond van het bij of krachtens
      deze wet bepaalde geen kenteken behoeft te zijn opgegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel49
  - number: 49.2.b
    text: |-
      uit het kentekenregister of een buitenlands register blijkt dat de eigenaar of houder van een motorrijtuig of een
      aanhangwagen onvrijwillig de beschikkingsmacht over dat voertuig heeft verloren.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel49
  - number: '49.3'
    text: |-
      Onverminderd [artikel 48, eerste lid][ref1], wordt de tenaamstelling geweigerd in bij algemene maatregel van
      bestuur te bepalen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '48'
        hoofdstuk: IV
        paragraaf: 4a
  - number: '50.1'
    text: |-
      De aanvrager van een tenaamstelling verschijnt persoonlijk bij een erkende instantie als bedoeld in de
      [artikelen 61a, eerste lid][ref1], of [62, eerste lid][ref2], of een daartoe door de Dienst Wegverkeer aangewezen
      vestiging van deze dienst, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 61a
        hoofdstuk: IV
        paragraaf: 4c
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 50.1.a
    text: |-
      de aanvraag namens hem wordt ingediend door degene aan wie door de Dienst Wegverkeer een erkenning als bedoeld in
      [artikel 62][ref1] is verleend dan wel, indien dit een rechtspersoon is, door diens gemachtigde, en deze voldoende
      zekerheid heeft verkregen over de identiteit van de aanvrager. Daartoe legt de aanvrager een document als bedoeld
      in [artikel 2, eerste lid, van de Paspoortwet][ref2], een geldig rijbewijs als bedoeld in [artikel 107][ref3] dan
      wel een rijbewijs als bedoeld in [artikel 108, eerste lid, onderdeel h][ref4], over. Degene die namens de aanvrager
      de aanvraag indient, legt bij de erkende instantie, bedoeld in [artikel 61a, eerste lid][ref5], het document,
      bedoeld in de tweede volzin, over, alsmede de volmacht en het bewijs dat aan hem een erkenning als bedoeld in
      artikel 62 is verleend,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel107
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel108
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '107'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '108'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: 61a
        hoofdstuk: IV
        paragraaf: 4c
  - number: 50.1.b
    text: |-
      volgens bij algemene maatregel van bestuur vast te stellen regels op andere wijze voldoende zekerheid kan worden
      verkregen over de identiteit van de aanvrager, of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel50
  - number: 50.1.c
    text: de aanvraag langs elektronische weg op een door de Dienst Wegverkeer te bepalen wijze wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel50
  - number: '50.2'
    text: |-
      Indien bij de aanvraag, bedoeld in het eerste lid, onderdeel a, gebruik wordt gemaakt van een document als
      bedoeld in [artikel 2 van de Paspoortwet][ref1], wordt bij de aanvraag tevens een de aanvrager betreffend
      gewaarmerkt afschrift van de benodigde gegevens uit de basisregistratie personen overgelegd dat niet langer dan
      drie maanden voor het tijdstip van de aanvraag is verstrekt. Onze Minister kan de bevoegdheid van de krachtens
      [artikel 62][ref2] erkende persoon om de aanvraag namens de aanvrager in te dienen beperken tot één of meer
      specifiek voor die persoon met name te noemen instanties. Bij algemene maatregel van bestuur worden regels
      vastgesteld ter zake van de voorwaarden waaraan degene aan wie ingevolge artikel 62 een erkenning is verleend,
      voldoet om als gemachtigde, bedoeld in het eerste lid, onderdeel a, op te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '50.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de verplichting om persoonlijk te verschijnen niet
      geldt ten aanzien van de inschrijving en tenaamstelling ter zake van de opgave van een kenteken als bedoeld in
      [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel38
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '50.4'
    text: |-
      Indien de aanvraag geschiedt door een in Nederland gevestigde rechtspersoon die dient te zijn ingeschreven in een
      daartoe bij de wet aangewezen register of waarvan de onderneming dient te zijn ingeschreven in het handelsregister,
      geldt de verplichting om persoonlijk te verschijnen voor degene die krachtens de statuten bevoegd is de
      rechtspersoon te vertegenwoordigen. Indien er meerdere personen bevoegd zijn de rechtspersoon te vertegenwoordigen,
      geldt de verplichting voor een van hen. Een persoon die bevoegd is de rechtspersoon te vertegenwoordigen, kan bij
      gemachtigde verschijnen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel50
  - number: '50.5'
    text: |-
      De aanvraag van een inschrijving en tenaamstelling geschiedt overeenkomstig bij of krachtens algemene maatregel
      van bestuur vastgestelde regels. Deze regels kunnen mede dienstbaar zijn aan de heffing van de belasting van
      personenauto’s en motorrijwielen en van de motorrijtuigenbelasting alsmede aan de afdracht van de krachtens
      een algemeen verbindend verklaarde overeenkomst op grond van de [Wet milieubeheer][ref1] verschuldigde
      afvalbeheerbijdrage voor autowrakken en kunnen bepalen in welke gevallen het motorrijtuig of de aanhangwagen,
      waarvoor een inschrijving en tenaamstelling wordt aangevraagd, voor een onderzoek ter beschikking moet worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '50.6'
    text: |-
      De Dienst Wegverkeer is bevoegd te vorderen dat de aanvrager van een inschrijving en tenaamstelling een door of
      vanwege Onze Minister van Financiën afgegeven bewijs overlegt, waaruit blijkt dat ter zake van het motorrijtuig of
      de aanhangwagen verschuldigde belastingen en rechten zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel50
  - number: '51.1'
    text: |-
      Het is verboden voor het verkrijgen van een inschrijving in het kentekenregister en een tenaamstelling opzettelijk
      onjuiste opgaven te doen, onjuiste inlichtingen te verschaffen of onjuiste bewijsstukken en andere bescheiden over
      te leggen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel51
  - number: '51.2'
    text: |-
      Voor zover de bij de aanvraag van een inschrijving in het kentekenregister en tenaamstelling te verschaffen
      gegevens betreffen of mede betreffen gegevens die nodig worden geacht ter zake van de heffing van de belasting
      van personenauto’s en motorrijwielen en van de motorrijtuigenbelasting, wordt de verplichting tot het verstrekken
      van die gegevens beschouwd als een ingevolge de belastingwet opgelegde verplichting en zijn, indien ter zake
      onjuiste of onvolledige gegevens worden verstrekt – in afwijking van de bepalingen van deze wet – de bepalingen van
      [Hoofdstuk IX (Strafrechtelijke bepalingen) van de Algemene wet inzake rijksbelastingen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: IX
  - number: 51a.1
    text: |-
      Een tenaamstelling in het kentekenregister vervalt overeenkomstig bij algemene maatregel van bestuur vastgestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel51a
  - number: 51a.2
    text: |-
      Een tenaamstelling in het kentekenregister wordt overeenkomstig bij algemene maatregel van bestuur vastgestelde
      regels vervallen verklaard:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel51a
  - number: 51a.2.a
    text: |-
      indien de tenaamstelling heeft plaatsgevonden op grond van bij de inschrijving of tenaamstelling verschafte
      onjuiste gegevens en dat inschrijving zou zijn geweigerd indien de onjuistheid van die gegevens ten tijde van de
      aanvraag bekend zou zijn geweest, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel51a
  - number: 51a.2.b
    text: indien blijkt dat de tenaamstelling kennelijk abusievelijk heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel51a
  - number: 51a.3
    text: 'Onverminderd het eerste en tweede lid, kan een tenaamstelling vervallen worden verklaard:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel51a
  - number: 51a.3.a
    text: indien de ter zake van het voertuig verschuldigde belastingen en rechten niet zijn voldaan;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel51a
  - number: 51a.3.b
    text: |-
      indien het ingeschreven voertuig niet voldoet aan de bij of krachtens deze wet, met uitzondering van
      [hoofdstuk III][ref1], vastgestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: 51a.3.c
    text: |-
      indien in de bouw of inrichting van het ingeschreven voertuig wijzigingen zijn aangebracht die niet zijn
      goedgekeurd overeenkomstig het bepaalde bij of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel51a
  - number: 51a.3.d
    text: |-
      indien het ingeschreven voertuig een schadevoertuig betreft dat voldoet aan bij ministeriële regeling vastgestelde
      kenmerken, dan wel indien het voertuig na herstel van de schade niet voldoet aan de bij ministeriële regeling te
      stellen eisen ten aanzien van de wijze waarop de schade is hersteld;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel51a
  - number: 51a.3.e
    text: |-
      indien de eigenaar of houder van een voertuig onvrijwillig de beschikkingsmacht over dat voertuig heeft verloren,
      mits wordt voldaan aan de bij algemene maatregel van bestuur vastgestelde voorwaarden, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel51a
  - number: 51a.3.f
    text: in andere bij algemene maatregel van bestuur vast te stellen gevallen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel51a
  - number: 51a.4
    text: |-
      De Dienst Wegverkeer kan een vervallen verklaarde tenaamstelling laten herleven, dan wel laten herleven voor het
      rijden over de weg, indien de reden voor vervallenverklaring is komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel51a
  - number: 51a.5
    text: |-
      In bij algemene maatregel van bestuur vast te stellen gevallen kan worden bepaald dat een tenaamstelling na verloop
      van bij die algemene maatregel van bestuur te bepalen tijdsperiode van rechtswege vervalt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel51a
  - number: '52'
    text: Een kentekenbewijs bestaat uit een of meer bij algemene maatregel van bestuur aan te wijzen delen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel52
  - number: 52a.1
    text: |-
      Ter bevestiging van de inschrijving in het kentekenregister en tenaamstelling bedoeld in
      [artikel 48, eerste lid][ref1], wordt door de Dienst Wegverkeer een kentekenbewijs afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '48'
        hoofdstuk: IV
        paragraaf: 4a
  - number: 52a.2
    text: |-
      De Dienst Wegverkeer verstrekt tevens ten behoeve van wijziging van de tenaamstelling een tenaamstellingscode aan
      degene aan wie het kentekenbewijs is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel52a
  - number: 52a.3
    text: |-
      Uitreiking van het kentekenbewijs of een deel daarvan en verstrekking van de tenaamstellingscode vindt plaats op
      bij ministeriële regeling te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel52a
  - number: 52b
    text: |-
      De Dienst Wegverkeer brengt aantekeningen aan in dan wel verwijdert aantekeningen uit het kentekenregister,
      respectievelijk brengt aantekeningen aan op het kentekenbewijs dan wel verwijdert aantekeningen van het
      kentekenbewijs, voor zover dat bij of krachtens deze wet is voorgeschreven of mogelijk is gemaakt, dan wel voor de
      goede uitvoering van deze wet wenselijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel52b
  - number: 52c.1
    text: 'Een kentekenbewijs verliest zijn geldigheid door:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel52c
  - number: 52c.1.a
    text: het verval van de tenaamstelling in het kentekenregister;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel52c
  - number: 52c.1.b
    text: de afgifte van een vervangend kentekenbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel52c
  - number: 52c.1.c
    text: het onbevoegd daarin aanbrengen van wijzigingen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel52c
  - number: 52c.1.d
    text: |-
      een schorsing als bedoeld in [art 67, eerste lid][ref1], voor de duur van de schorsing, of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel67
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel52c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '6'
  - number: 52c.1.e
    text: een ongeldigverklaring.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel52c
  - number: 52c.2
    text: |-
      In bij algemene maatregel van bestuur bepaalde gevallen kan een kentekenbewijs op verzoek van de eigenaar of houder
      van een motorvoertuig tegen betaling, op een door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door
      deze dienst vastgestelde tarief, door deze dienst ongeldig worden verklaard.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel52c
  - number: 52c.3
    text: |-
      De Dienst Wegverkeer kan verlangen dat een kentekenbewijs dat zijn geldigheid heeft verloren binnen een daarbij
      bepaalde termijn bij deze dienst wordt ingeleverd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel52c
  - number: 52c.4
    text: |-
      De Dienst Wegverkeer kan een ongeldig verklaard kentekenbewijs geldig verklaren, indien de reden voor
      ongeldigverklaring is komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel52c
  - number: 52c.5
    text: |-
      Onverminderd het eerste lid, onderdeel d, behoudt het kentekenbewijs zijn geldigheid ten behoeve van de wijziging
      van de tenaamstelling.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel52c
  - number: '53'
    text: |-
      De Dienst Wegverkeer geeft bij inschrijving in het kentekenregister en tenaamstelling tevens een keuringsbewijs
      voor het betrokken voertuig af indien:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel53
  - number: 53.a
    text: |-
      het voertuig is onderworpen aan een onderzoek dat ten minste een controle inhoudt op de eisen, bedoeld in
      [artikel 75, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: 53.b
    text: |-
      [artikel 72][ref1] voor dat voertuig geldt of binnen een jaar zal gaan gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: '54'
    text: |-
      Onze Minister kan aan besturen van verenigingen met volledige rechtsbevoegdheid, die behartiging van
      verkeersbelangen ten doel hebben, de bevoegdheid verlenen tot het afgeven van internationale bewijzen voor
      motorrijtuigen en aanhangwagens, bedoeld in internationale overeenkomsten, ten behoeve van het verkeer met
      motorrijtuigen en aanhangwagens in het buitenland.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel54
  - number: '55.1'
    text: |-
      Op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door deze
      dienst vastgestelde tarief, geeft deze dienst overeenkomstig bij algemene maatregel van bestuur vastgestelde regels
      vervangende bewijzen af voor:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel55
  - number: 55.1.a
    text: kentekenbewijzen, die versleten, geheel of ten dele onleesbaar, verloren geraakt of teniet gegaan zijn;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel55
  - number: 55.1.b
    text: kentekenbewijzen in geval van vermissing van de bijbehorende kentekenplaten.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel55
  - number: '55.2'
    text: |-
      Het vervangende bewijs treedt in de plaats van het eerder afgegeven kentekenbewijs en wordt niet afgegeven dan
      nadat het versleten of geheel of ten dele onleesbaar geworden kentekenbewijs, waarvoor het wordt afgegeven, is
      ingeleverd bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel55
  - number: '55.3'
    text: |-
      Op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door deze
      dienst vastgestelde tarief, verstrekt deze dienst overeenkomstig bij algemene maatregel van bestuur vastgestelde
      regels een vervangende tenaamstellingscode ten behoeve van een wijziging van de tenaamstelling.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel55
  - number: '55.4'
    text: |-
      De vervangende tenaamstellingscode treedt in de plaats van eerder afgegeven tenaamstellingscodes welke door de
      afgifte ongeldig worden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel55
  - number: '60.1'
    text: |-
      De houder van een kentekenbewijs is vanaf een bij algemene maatregel van bestuur vastgesteld tijdstip op eerste
      vordering van bij algemene maatregel van bestuur aangewezen personen verplicht tot overgifte van bij algemene
      maatregel van bestuur te bepalen delen van dat bewijs, indien naar het oordeel van die personen:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel60
  - number: 60.1.a
    text: |-
      ter zake van het voertuig, waarvoor het kentekenbewijs is afgegeven, de verschuldigde belastingen en rechten niet
      zijn voldaan;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel60
  - number: 60.1.b
    text: |-
      indien het ingeschreven voertuig niet voldoet aan de bij of krachtens deze wet, met uitzondering van
      [hoofdstuk III][ref1], vastgestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: 60.1.c
    text: |-
      het voertuig waarvoor het kentekenbewijs is afgegeven een schadevoertuig betreft dat voldoet aan bij ministeriële
      regeling vastgestelde kenmerken, dan wel indien het voertuig na herstel van de schade niet voldoet aan de bij
      ministeriële regeling te stellen eisen ten aanzien van de wijze waarop de schade is hersteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel60
  - number: '60.2'
    text: |-
      Indien het een kentekenbewijs betreft dat is afgegeven voor een aanhangwagen die overeenkomstig het bij
      ministeriële regeling bepaalde is voorzien van een identificatieplaat, kan aan de vordering worden voldaan binnen
      een bij die maatregel vastgestelde termijn.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel60
  - number: '60.3'
    text: |-
      De in het eerste lid bedoelde personen geven het kentekenbewijs na inzage terug aan degene die tot overgifte
      verplicht was.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel60
  - number: '60.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de verplichting tot overgifte van
      kentekenbewijzen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel60
  - number: '61.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61
  - number: 61.1.c
    text: |-
      ten opzichte van een motorrijtuig of een aanhangwagen opzettelijk gebruik te maken van een kentekenbewijs dat niet
      aan de eigenaar of houder voor dat motorrijtuig of die aanhangwagen is afgegeven, als ware het aan deze voor dat
      motorrijtuig of die aanhangwagen afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61
  - number: 61a.1
    text: |-
      De Dienst Wegverkeer kan aan een rechtspersoon een erkenning verlenen waardoor deze gerechtigd is, tegen betaling
      namens de aanvrager van een door deze dienst vast te stellen tarief, motorrijtuigen en aanhangwagens te naam te
      stellen in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61a
  - number: 61a.2
    text: |-
      De erkenning houdt tevens de bevoegdheid in om namens de aanvrager de geldigheid van een kenteken te schorsen of
      een schorsing op te heffen conform [paragraaf 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: IV
        paragraaf: '6'
  - number: 61a.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gesteld die aan een erkenning worden verbonden en kunnen met
      betrekking tot die voorschriften regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61a
  - number: 61a.4
    text: |-
      Bij besluit van de Dienst Wegverkeer wordt de maximale hoogte vastgesteld van de prijs die een erkend bedrijf aan
      de aanvrager in rekening mag brengen voor zijn dienstverlening.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61a
  - number: 61b.1
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door deze dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend aan de natuurlijke persoon of rechtspersoon,
      die voldoet aan de bij ministeriële regeling vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61b
  - number: 61b.2
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot de aanvrager van een erkenning en de
      wijze waarop de uitvoering van de aanvraag tot tenaamstelling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61b
  - number: 61c.1
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Een zodanig besluit wordt bekend gemaakt door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61c
  - number: 61c.2
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61c
  - number: 61c.3
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld betreffende de wijze waarop het toezicht wordt gehouden
      en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend. Deze regels kunnen
      inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit
      de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61c
  - number: 61d.1
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie de erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61d
  - number: 61d.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat na indiening van het verzoek de erkenning gedurende een
      bij die algemene maatregel van bestuur vast te stellen termijn van kracht blijft.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61d
  - number: 61d.3
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61d
  - number: 61d.3.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61d
  - number: 61d.3.b
    text: |-
      de verplichtingen, vervat in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1],
      [artikel 61a, derde lid][ref2], en [artikel 61c, tweede lid][ref3], niet nakomt, of,


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel61c
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 61a
        hoofdstuk: IV
        paragraaf: 4c
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 61c
        hoofdstuk: IV
        paragraaf: 4c
  - number: 61d.3.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61d
  - number: 61d.4
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het derde lid, een erkenning schorsen voor een door hem daarbij
      vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61d
  - number: 61d.5
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het eerste en derde lid, bepalen dat een wachttijd geldt voor
      het aanvragen van een erkenning van maximaal 30 maanden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61d
  - number: 61d.6
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot het intrekken, wijzigen en
      schorsen van de erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61d
  - number: 61e
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 61a][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel61e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 61a
        hoofdstuk: IV
        paragraaf: 4c
  - number: '62.1'
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is motorrijtuigen en aanhangwagens, waarvan hij de eigendom heeft verkregen, in zijn bedrijfsvoorraad op
      te nemen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel62
  - number: '62.2'
    text: |-
      Aan de erkenning kunnen bij algemene maatregel van bestuur aangewezen bevoegdheden worden verbonden; een zodanige
      bevoegdheid maakt deel uit van de erkenning. Het in de [artikelen 62 tot en met 66][ref1] ten aanzien van
      erkenningen bepaalde is van overeenkomstige toepassing op bedoelde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '62.3'
    text: |-
      De erkenning geldt voor de in de erkenning aangewezen groep of groepen van voertuigen en kan gelden voor bepaalde
      of voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel62
  - number: '62.4'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en kunnen
      met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel62
  - number: '62.5'
    text: |-
      De in [artikel 50, eerste lid, aanhef][ref1] bedoelde verplichting om bij de aanvraag tot inschrijving in
      het kentekenregister en tenaamstelling persoonlijk te verschijnen bij een erkende instantie als bedoeld in
      [artikel 61a, eerste lid][ref2], of in het eerste lid, geldt niet voor natuurlijke personen of rechtspersonen aan
      wie een erkenning als bedoeld in het eerste lid is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '50'
        hoofdstuk: IV
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 61a
        hoofdstuk: IV
        paragraaf: 4c
  - number: '63.1'
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door deze dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend aan de natuurlijke persoon of rechtspersoon,
      die voldoet aan de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de administratieve
      organisatie van de natuurlijke persoon of rechtspersoon alsmede de wijze waarop deze er voor zorgdraagt dat de aan
      de opname in bedrijfsvoorraad verbonden procedures in acht worden genomen. Voorts kunnen deze eisen mede dienstbaar
      zijn aan de uitvoering van de Wet milieubeheer.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel63
  - number: '63.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld met betrekking tot de aanvraag van een
      erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel63
  - number: '63.3'
    text: Bij ministeriële regeling worden regels vastgesteld ter uitvoering van het krachtens het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel63
  - number: '64.1'
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de *Staatscourant*. Het toezicht omvat in ieder geval het periodiek controleren van de bedrijfsvoorraad van degene
      aan wie de erkenning is verleend en van de ter zake van die bedrijfsvoorraad door deze gevoerde administratie.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel64
  - number: '64.2'
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel64
  - number: '64.3'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld betreffende de wijze waarop het toezicht wordt gehouden
      en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend. Deze regels kunnen
      inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit
      de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel64
