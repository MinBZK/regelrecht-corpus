  - number: '164.7'
    text: |-
      In geval van toepassing van het eerste lid kan het motorrijtuig, voor zover geen andere bestuurder
      beschikbaar is of de bestuurder niet aanstonds voldoet aan de vordering, onder toezicht of, voor
      zover degene die het proces-verbaal opmaakt zulks nodig oordeelt, in bewaring worden gesteld. In het
      laatste geval zijn de [artikelen 170, tweede lid, tweede en derde volzin, vierde en vijfde lid][ref1],
      [171][ref2], [172][ref3] en [173, eerste lid, van deze wet][ref4] en de [artikelen 4:116][ref5],
      [4:118 tot en met 4:124][ref6], [5:10][ref7], [5:25, eerste en zesde lid][ref8], [5:29, tweede en derde lid][ref9],
      [5:30, eerste, tweede, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref10] van overeenkomstige
      toepassing. Teruggave van het motorrijtuig vindt slechts plaats indien aan de vordering is voldaan of indien de
      officier van justitie zich niet langer tegen de teruggave verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel171
