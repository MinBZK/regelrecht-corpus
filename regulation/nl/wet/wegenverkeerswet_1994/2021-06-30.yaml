  - number: 173.2.c
    text: |-
      de aanwijzing van de weggedeelten en wegen, voor de bevoegdheid tot oplegging van een last onder bestuursdwang,
      bedoeld in artikel [170, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel173
