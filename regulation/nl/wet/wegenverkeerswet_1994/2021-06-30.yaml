        bwb_id: BWBR0006622
        artikel: '124'
        hoofdstuk: VI
        afdeling: '7'
  - number: 164.5.c
    text: |-
      een rechterlijke uitspraak of strafbeschikking waarbij de bevoegdheid tot het besturen van motorrijtuigen is
      ontzegd, voor tenuitvoerlegging vatbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel164
  - number: '164.6'
    text: |-
      Indien de officier van justitie binnen tien dagen na de dag van invordering niet gebruik maakt van de in
      het vierde lid bedoelde bevoegdheid, geeft hij de ingevorderde bewijzen onverwijld terug aan de houder.
      Teruggave vindt eveneens plaats, indien ernstig rekening moet worden gehouden met de mogelijkheid dat aan
      de houder in geval van veroordeling door de rechter dan wel uitvaardiging van een strafbeschikking geen
      onvoorwaardelijke ontzegging van de bevoegdheid tot het besturen van motorrijtuigen zal worden opgelegd,
      dan wel geen onvoorwaardelijke ontzegging van langere duur dan de tijd gedurende welke de bewijzen zijn
      ingevorderd of ingehouden geweest. Teruggave vindt ten slotte plaats indien het onderzoek van de zaak op de
      terechtzitting niet binnen zes maanden na de dag van invordering is aangevangen, dan wel binnen die termijn geen
      strafbeschikking is uitgevaardigd. Het rijbewijs wordt niet aan de houder teruggegeven, indien het een rijbewijs
      betreft waarvan ingevolge een der [artikelen 130, tweede lid][ref1], of [164][ref2] de overgifte is gevorderd,
      waarvan ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref3] de inlevering is
      gevorderd of ten aanzien waarvan ingevolge een der [artikelen 120, derde lid][ref4], [123b, vierde lid][ref5],
      [124, vierde lid][ref6], [131, tweede lid, onderdeel b][ref7], [132, vijfde lid][ref8], [134, vierde lid][ref9],
      of [180, vierde lid][ref10], een verplichting tot inlevering bestaat. Het rijbewijs wordt in dat geval doorgeleid
      naar degene bij wie de houder dat rijbewijs had dienen in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
