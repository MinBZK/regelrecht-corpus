$id: wegenverkeerswet_1994
regulatory_layer: WET
publication_date: '2023-11-27'
valid_from: '2021-06-30'
bwb_id: BWBR0006622
url: https://wetten.overheid.nl/BWBR0006622/2021-06-30
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regels inzake het verkeer op de weg opnieuw vast
    te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt, tenzij anders blijkt, verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.b
    text: |-
      wegen: alle voor het openbaar verkeer openstaande wegen of paden met inbegrip van de daarin liggende bruggen en
      duikers en de tot die wegen behorende paden en bermen of zijkanten;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.c
    text: |-
      motorrijtuigen: alle voertuigen, bestemd om anders dan langs spoorstaven te worden voortbewogen uitsluitend
      of mede door een mechanische kracht, op of aan het voertuig zelf aanwezig dan wel door elektrische tractie met
      stroomtoevoer van elders, met uitzondering van fietsen met trapondersteuning;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.d
    text: |-
      aanhangwagen: voertuig dat kennelijk is bestemd om te worden voortbewogen door een motorrijtuig. In het bepaalde
      krachtens deze wet kan onder aanhangwagen tevens worden verstaan een voertuig dat door een ander voertuig wordt
      voortbewogen of kennelijk is bestemd om door een ander voertuig te worden voortbewogen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.e
    text: 'bromfiets:'
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.e.a
    text: |-
      motorrijtuig op twee wielen, met een door de constructie bepaalde maximumsnelheid van niet meer dan 45 km/h,
      uitgerust met een verbrandingsmotor met een cilinderinhoud van niet meer dan 50 cm3 of een elektromotor met een
      nominaal continu maximumvermogen van niet meer dan 4 kW, niet zijnde een gehandicaptenvoertuig of een motorrijtuig
      als bedoeld in subonderdeel d;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.e.b
    text: |-
      motorrijtuig op drie wielen, met een door de constructie bepaalde maximumsnelheid van niet meer dan 45 km/h, niet
      zijnde een gehandicaptenvoertuig of een motorrijtuig als bedoeld in subonderdeel d, uitgerust met:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.e.b.1°
    text: een motor met elektrische ontsteking met een cilinderinhoud van niet meer dan 50 cm3,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.e.b.2°
    text: |-
      een motor met inwendige verbranding en een netto maximumvermogen van niet meer dan 4 kW voor andere dan onder 1°
      genoemde motoren, of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.e.b.3°
    text: een elektromotor met een nominaal continu maximumvermogen van niet meer dan 4 kW; dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.e.c
    text: |-
      motorrijtuig op vier wielen, niet zijnde een gehandicaptenvoertuig of een motorrijtuig als bedoeld in subonderdeel
      d, met een door de constructie bepaalde maximumsnelheid van niet meer dan 45 km/h en een ledige massa van minder
      dan 350 kg, de massa van de batterijen in elektrische voertuigen niet inbegrepen, uitgerust met:
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.e.c.1°
    text: een motor met elektrische ontsteking met een cilinderinhoud van niet meer dan 50 cm3,
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.e.c.2°
    text: |-
      een motor met inwendige verbranding en een netto maximumvermogen van niet meer dan 4 kW voor andere dan onder 1°
      genoemde motoren, of
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.e.c.3°
    text: een elektromotor met een nominaal continu maximumvermogen van niet meer dan 4 kW;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.e.d
    text: |-
      een motorrijtuig als bedoeld in [artikel 20b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20b
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 20b
        hoofdstuk: IIA
  - number: 1.1.ea
    text: |-
      fietsen met trapondersteuning: fietsen die zijn voorzien van een elektrische hulpmotor met een nominaal continu
      vermogen van maximaal 0,25 kW en waarvan de aandrijfkracht geleidelijk vermindert en tenslotte wordt onderbroken
      wanneer het voertuig een snelheid van 25 km/h bereikt, of eerder, indien de bestuurder ophoudt met trappen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.f
    text: |-
      *verordening (EU) 167/2013:* Verordening (EU) nr. 167/2013 van het Europees Parlement en de Raad van 5 februari
      2013 inzake de goedkeuring van en het markttoezicht op landbouw- en bosbouwvoertuigen (PbEU 2013, L 60) en de op
      die verordening gebaseerde uitvoeringshandelingen en gedelegeerde handelingen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.fa
    text: |-
      *verordening (EU) 168/2013:* Verordening (EU) nr. 168/2013 van het Europees Parlement en de Raad van 15 januari
      2013 betreffende de goedkeuring van en het markttoezicht op twee- of driewielige voertuigen en vierwielers (PbEU
      2013, L 60) en de op die verordening gebaseerde uitvoeringshandelingen en gedelegeerde handelingen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.fb
    text: |-
      *verordening (EU) 2018/858:* Verordening (EU) nr. 2018/858 van het Europees Parlement en de Raad van 30 mei 2018
      betreffende de goedkeuring van en het markttoezicht op motorvoertuigen en aanhangwagens daarvan en systemen,
      onderdelen en technische eenheden die voor dergelijke voertuigen zijn bestemd, tot wijziging van Verordeningen (EG)
      nr. 715/2007 en (EG) nr. 595/2009 en tot intrekking van [Richtlijn 2007/46/EG](32007L0046) (PbEU 2018, L 151) en de
      op die verordening gebaseerde uitvoeringshandelingen en gedelegeerde handelingen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.fc
    text: |-
      *EU-kaderverordening in verband met de goedkeuring van motorvoertuigen:* verordening (EU) 167/2013, verordening
      (EU) 168/2013 of verordening (EU) 2018/858;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.fd
    text: |-
      *EU-harmonisatieverordening in verband met de goedkeuring van motorvoertuigen:* EU-verordening en de op die
      verordening gebaseerde uitvoeringshandelingen en gedelegeerde handelingen, die wordt genoemd in de bijlagen bij
      verordening (EU) 2018/858 en die als doel heeft harmonisatievoorschriften vast te stellen over een specifiek
      onderwerp, zoals brandstofgebruik, emissies, technische eisen of veiligheidsvoorschriften, die relevant zijn
      in het kader van de goedkeuring, op de markt aanbieden, in de handel brengen, registreren en in gebruik nemen
      van voertuigen en systemen, onderdelen, technische eenheden, voertuigdelen, uitrustingsstukken en voorzieningen
      die voor dergelijke voertuigen en aanhangwagens daarvan zijn ontworpen en gebouwd of van voorzieningen die ter
      bescherming van inzittenden van voertuigen en kwetsbare weggebruikers zijn ontworpen en gebouwd;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.fe
    text: |-
      *EU-verordening in verband met de goedkeuring van motorvoertuigen:* EU-kaderverordening in verband met de
      goedkeuring van motorvoertuigen of EU-harmonisatieverordening in verband met de goedkeuring van motorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.ff
    text: |-
      *Overeenkomst van 1958:* Overeenkomst betreffende de vaststelling van geharmoniseerde technische reglementen van
      de Verenigde Naties voor voertuigen op wielen en voor uitrustingsstukken en onderdelen die daarop kunnen worden
      gemonteerd en/of gebruikt, en betreffende de voorwaarden voor wederzijdse erkenning van goedkeuringen die krachtens
      die reglementen van de Verenigde Naties zijn verleend (Trb. 1959/83);
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
  - number: 1.1.g
    text: |-
      kenteken: kenteken als bedoeld in [artikel 36][ref1] of [artikel 37, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2021-06-30#Artikel1
