      [ref7]: https://wetten.overheid.nl/BWBR0006622#Artikel74
      [ref8]: https://wetten.overheid.nl/BWBR0006622#Artikel114
      [ref9]: https://wetten.overheid.nl/BWBR0006622#Artikel165
      [ref10]: https://wetten.overheid.nl/BWBR0006622#Artikel166
