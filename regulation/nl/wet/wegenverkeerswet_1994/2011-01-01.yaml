  - number: '179.3'
    text: |-
      Bij veroordeling van de bestuurder van een motorrijtuig wegens overtreding van het bepaalde krachtens deze wet kan
      hem in die gevallen, waarin dit bij algemene maatregel van bestuur is bepaald, de bevoegdheid tot het besturen van
      motorrijtuigen voor ten hoogste twee jaren worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel179
  - number: '179.4'
    text: |-
      Indien tijdens het plegen van een der strafbare feiten in het eerste lid genoemd, nog geen vijf jaren zijn verlopen
      na het einde van de tijdsduur waarvoor bij een vroegere onherroepelijke veroordeling wegens een van die strafbare
      feiten de betrokkene de bevoegdheid tot het besturen van motorrijtuigen is ontzegd, kan hem die bevoegdheid voor
      ten hoogste tien jaren worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel179
  - number: '179.5'
    text: |-
      Indien tijdens het plegen van een der strafbare feiten in het tweede lid genoemd of krachtens deze wet aangewezen,
      nog geen twee jaren zijn verlopen na het einde van de tijdsduur waarvoor bij een vroegere onherroepelijke
      veroordeling wegens een van die strafbare feiten of wegens een der in het eerste lid bedoelde strafbare feiten de
      betrokkene de bevoegdheid tot het besturen van motorrijtuigen is ontzegd, kan hem die bevoegdheid voor ten hoogste
      vier jaren worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel179
  - number: '179.6'
    text: |-
      Bij het opleggen van de bijkomende straf, bedoeld in het eerste tot en met het vijfde lid, wordt de tijd gedurende
      welke het rijbewijs van de veroordeelde ingevolge [artikel 164][ref1] vóór het tijdstip waarop de bijkomende straf
      ingaat, ingevorderd of ingehouden is geweest, op de duur van die straf geheel in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel164
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '164'
        hoofdstuk: IX
  - number: '179.7'
    text: |-
      Voor de toepassing van dit artikel wordt met de bestuurder van een motorrijtuig gelijkgesteld degene die
      overeenkomstig de in [artikel 1, eerste lid, onderdeel n][ref1], bedoelde voorwaarde geacht wordt het motorrijtuig
      onder onmiddellijk toezicht van de bestuurder te besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
        hoofdstuk: '1'
  - number: '179.8'
    text: |-
      Voor de toepassing van het zesde lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door het daartoe
      bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel179
  - number: '179.9'
    text: Voor de toepassing van dit artikel wordt een strafbeschikking met een veroordeling gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel179
  - number: '179.10'
    text: |-
      Voor de toepassing van het vierde onderscheidenlijk het vijfde lid, wordt onder vroegere onherroepelijke
      veroordeling mede verstaan een vroegere onherroepelijke veroordeling door een strafrechter in een andere lidstaat
      van de Europese Unie wegens feiten soortgelijk aan de feiten, bedoeld in het vierde onderscheidenlijk het vijfde
      lid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel179
  - number: 179a.1
    text: |-
      Bij veroordeling wegens een der in de [artikelen 287][ref1] of [289 van het Wetboek van Strafrecht][ref2]
      omschreven misdrijven kan de schuldige die het feit heeft gepleegd met een motorrijtuig dat hij ten tijde van het
      feit bestuurde of deed besturen, de bevoegdheid tot het besturen van motorrijtuigen voor ten hoogste tien jaren
      worden ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel289
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel179a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '287'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '289'
  - number: 179a.2
    text: |-
      Bij veroordeling wegens een der in de [artikelen 285][ref1], [301][ref2], [302][ref3] of
      [303 van het Wetboek van Strafrecht][ref4] omschreven misdrijven kan de schuldige die het feit heeft gepleegd met
      een motorrijtuig dat hij ten tijde van het feit bestuurde of deed besturen, de bevoegdheid tot het besturen van
      motorrijtuigen voor ten hoogste vijf jaren worden ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel285
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel301
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel302
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel303
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel179a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '285'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '301'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '302'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '303'
  - number: 179a.3
    text: Voor de toepassing van het tweede lid wordt een strafbeschikking met een veroordeling gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel179a
  - number: '180.1'
    text: |-
      Voor wat betreft de bijkomende straf van ontzegging van de bevoegdheid tot het besturen van motorrijtuigen is
      [artikel 557, tweede lid, van het Wetboek van Strafvordering][ref1] op rechterlijke uitspraken niet van toepassing.
      Een strafbeschikking houdende deze bijkomende straf is in zoverre eerst voor tenuitvoerlegging vatbaar als geen
      verzet meer kan worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel557
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '557'
  - number: '180.2'
    text: |-
      De rechterlijke uitspraak of strafbeschikking is voor wat betreft de bijkomende straf niet voor tenuitvoerlegging
      vatbaar, zolang de termijn waarvoor de veroordeelde bij een andere rechterlijke uitspraak of strafbeschikking de
      bevoegdheid tot het besturen van motorrijtuigen is ontzegd, nog niet is verstreken.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel180
  - number: '180.3'
    text: |-
      Indien de rechterlijke uitspraak of strafbeschikking voor wat betreft de bijkomende straf voor tenuitvoerlegging
      vatbaar is geworden, geschiedt de tenuitvoerlegging niet dan nadat aan de veroordeelde in persoon een schrijven
      is uitgereikt, volgens de [artikelen 587][ref1] en [588 van het Wetboek van Strafvordering][ref2], waarin het
      tijdstip van ingang en de duur van de ontzegging, de verplichting tot inlevering van het rijbewijs uiterlijk op dat
      tijdstip, alsmede het gevolg van niet tijdige inlevering worden medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel587
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel588
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '587'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '588'
  - number: '180.4'
    text: |-
      De houder van een rijbewijs is, tenzij het is ingevorderd en niet is teruggegeven, verplicht dat rijbewijs in
      te leveren op het parket van het openbaar ministerie vanwaar hij het schrijven, bedoeld in het derde lid, heeft
      ontvangen, uiterlijk op het tijdstip van ingang van de ontzegging.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel180
  - number: '180.5'
    text: Teruggave van het rijbewijs vindt plaats zodra de termijn van de ontzegging is verstreken.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel180
  - number: '180.6'
    text: |-
      De termijn van ontzegging van de bevoegdheid tot het besturen van motorrijtuigen wordt van rechtswege verlengd met
      het aantal dagen dat is verstreken tussen het tijdstip waarop het rijbewijs ingevolge het vierde lid had moeten
      worden ingeleverd en het tijdstip waarop nadien die inlevering heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel180
  - number: '180.7'
    text: |-
      De termijn van de ontzegging wordt voorts verlengd met de tijd dat de veroordeelde gedurende de ontzegging rechtens
      zijn vrijheid is ontnomen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel180
  - number: '180.8'
    text: |-
      Voor de toepassing van het derde, vierde, vijfde en zesde lid wordt onder rijbewijs mede verstaan een rijbewijs,
      afgegeven door het daartoe bevoegde gezag in een andere Lid-Staat van de Europese Gemeenschappen of in een andere
      Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de
      houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel180
  - number: '181.1'
    text: |-
      Indien een bij of krachtens deze wet als overtreding strafbaar gesteld feit wordt begaan door een bij de ontdekking
      van het feit onbekend gebleven bestuurder van een motorrijtuig, kunnen de op het feit gestelde straffen worden
      opgelegd aan de eigenaar of houder van dat motorrijtuig voor zover deze niet reeds naast de bestuurder voor dat
      feit aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel181
  - number: '181.2'
    text: 'Het eerste lid geldt bij een strafbeschikking niet, indien de eigenaar of houder:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel181
  - number: 181.2.a
    text: |-
      voor het uitvaardigen van de strafbeschikking de naam en het volledige adres van de bestuurder bekend heeft
      gemaakt,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel181
  - number: 181.2.b
    text: niet heeft kunnen vaststellen wie de bestuurder was en hem daarvan redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel181
  - number: '181.3'
    text: 'Het eerste lid geldt bij berechting niet, indien de eigenaar of houder:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel181
  - number: 181.3.a
    text: |-
      binnen twee weken na daartoe door een der in [artikel 159][ref1] bedoelde personen in de gelegenheid te zijn
      gesteld dan wel bij het instellen van verzet tegen een strafbeschikking, de naam en het volledige adres van de
      bestuurder heeft bekend gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel181
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: 181.3.b
    text: |-
      uiterlijk op de dag vóór die der terechtzitting, schriftelijk en onder vermelding van de zaak en de dag der
      terechtzitting, de naam en het volledige adres van de bestuurder aan het openbaar ministerie bekend maakt;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel181
  - number: 181.3.c
    text: |-
      tijdens de terechtzitting, dadelijk na de ondervraging, bedoeld in
      [artikel 273, eerste lid, van het Wetboek van Strafvordering][ref1], de naam en het volledige adres van de
      bestuurder bekend maakt;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel273
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel181
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '273'
  - number: 181.3.d
    text: niet heeft kunnen vaststellen wie de bestuurder was en hem daarvan redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel181
  - number: '181.4'
    text: |-
      Op straffe van nietigheid wijst de dagvaarding op het derde lid, onderdelen b en c. De strafbeschikking wijst de
      verdachte op de mogelijkheid bij het instellen van verzet gegevens te verstrekken die tot toepassing van het derde
      lid, onderdeel a of d, kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel181
  - number: '182.1'
    text: |-
      Indien een bij of krachtens deze wet als overtreding strafbaar gesteld feit wordt begaan door een bij de ontdekking
      van het feit onbekend gebleven bestuurder van een motorrijtuig waarmee een aanhangwagen, waarvoor een kenteken is
      vereist, wordt voortbewogen, kunnen de op het feit gestelde straffen worden opgelegd aan de eigenaar of houder van
      die aanhangwagen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel182
  - number: '182.2'
    text: 'Het eerste lid geldt bij een strafbeschikking niet, indien de eigenaar of houder van de aanhangwagen:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel182
  - number: 182.2.a
    text: |-
      voor het uitvaardigen van de strafbeschikking de naam en het volledige adres bekend heeft gemaakt van de bestuurder
      dan wel van de eigenaar of houder van het motorrijtuig waarmee de aanhangwagen werd voortbewogen,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel182
  - number: 182.2.b
    text: |-
      niet heeft kunnen vaststellen wie de bestuurder dan wel van de eigenaar of houder van het motorrijtuig waarmee de
      aanhangwagen werd voortbewogen, was en hem daarvan redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel182
  - number: '182.3'
    text: 'Het eerste lid geldt bij berechting niet, indien de eigenaar of houder van de aanhangwagen:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel182
  - number: 182.3.a
    text: |-
      binnen twee weken na daartoe door een der in [artikel 159][ref1] bedoelde personen in de gelegenheid te zijn
      gesteld dan wel bij het instellen van verzet tegen een strafbeschikking, de naam en het volledige adres van de
      bestuurder dan wel van de eigenaar of houder van het motorrijtuig waarmee de aanhangwagen werd voortbewogen, heeft
      bekend gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: 182.3.b
    text: |-
      uiterlijk op de dag vóór die der terechtzitting, schriftelijk en onder vermelding van de zaak en de dag der
      terechtzitting, de naam en het volledige adres van de bestuurder dan wel van de eigenaar of houder van het
      motorrijtuig waarmee de aanhangwagen werd voortbewogen, aan het openbaar ministerie bekend maakt;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel182
  - number: 182.3.c
    text: |-
      tijdens de terechtzitting, dadelijk na de ondervraging, bedoeld in
      [artikel 273, eerste lid, van het Wetboek van Strafvordering][ref1], de naam en het volledige adres van de
      bestuurder dan wel van de eigenaar of houder van het motorrijtuig waarmee de aanhangwagen werd voortbewogen, bekend
      maakt;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel273
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '273'
  - number: 182.3.d
    text: |-
      niet heeft kunnen vaststellen wie de bestuurder dan wel de eigenaar of houder van het motorrijtuig waarmee de
      aanhangwagen werd voortbewogen, was en hem daarvan redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel182
  - number: '182.4'
    text: |-
      Op straffe van nietigheid wijst de dagvaarding op het derde lid, onderdelen b en c. De strafbeschikking wijst de
      verdachte op de mogelijkheid bij het instellen van verzet gegevens te verstrekken die tot toepassing van het derde
      lid, onderdeel a of d, kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel182
  - number: '183'
    text: |-
      De [artikelen 181][ref1] en [182][ref2] zijn mede van toepassing op de eigenaar of houder van een in het buitenland
      geregistreerd motorrijtuig of een in het buitenland geregistreerde aanhangwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel181
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel182
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '181'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '182'
        hoofdstuk: XI
  - number: '184'
    text: |-
      Bij overtreding van [artikel 7, eerste lid, aanhef en onderdeel a][ref1], is strafvervolging tegen de in dat
      artikel bedoelde overtreder uitgesloten, indien deze binnen twaalf uren na het verkeersongeval en voordat
      hij als verdachte is aangehouden of verhoord, vrijwillig van het ongeval kennis geeft aan een van de in
      [artikel 141 van het Wetboek van Strafvordering][ref2] bedoelde personen en daarbij zijn identiteit en, voor zover
      hij een motorrijtuig bestuurde, tevens de identiteit van dat motorrijtuig bekend maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '185.1'
    text: |-
      Indien een motorrijtuig waarmee op de weg wordt gereden, betrokken is bij een verkeersongeval waardoor schade wordt
      toegebracht aan, niet door dat motorrijtuig vervoerde, personen of zaken, is de eigenaar van het motorrijtuig of -
      indien er een houder van het motorrijtuig is - de houder verplicht om die schade te vergoeden, tenzij aannemelijk
      is dat het ongeval is te wijten aan overmacht, daaronder begrepen het geval dat het is veroorzaakt door iemand,
      voor wie onderscheidenlijk de eigenaar of de houder niet aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel185
  - number: '185.2'
    text: |-
      De eigenaar of houder die het motorrijtuig niet zelf bestuurt, is aansprakelijk voor de gedragingen van degene door
      wie hij dat motorrijtuig doet of laat rijden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel185
  - number: '185.3'
    text: |-
      Het eerste en het tweede lid vinden geen toepassing ten aanzien van schade, door een motorrijtuig toegebracht aan
      loslopende dieren, aan een ander motorrijtuig in beweging of aan personen en zaken die daarmee worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel185
  - number: '185.4'
    text: Dit artikel laat onverkort de uit andere wettelijke bepalingen voortvloeiende aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel185
  - number: '186.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor een periode van ten hoogste zes
      jaar ten behoeve van experimenten met:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel186
  - number: 186.1.a
    text: verkeerstekens en maatregelen op of aan de weg;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel186
  - number: 186.1.b
    text: de eisen ten aanzien van voertuigen waarmee over de weg wordt gereden of voertuigen die op de weg staan;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel186
  - number: 186.1.c
    text: de eisen ten aanzien van rijvaardigheid en rijbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel186
  - number: '186.2'
    text: 'In de in het eerste lid bedoelde algemene maatregel van bestuur wordt in elk geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel186
  - number: 186.2.a
    text: van welke van de in het eerste lid bedoelde bepalingen wordt afgeweken;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel186
  - number: 186.2.b
    text: het resultaat dat met een experiment, als bedoeld in het eerste lid, wordt beoogd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel186
  - number: '186.3'
    text: |-
      Onze Minister zendt uiterlijk zes maanden voor de beëindiging van een experiment, als bedoeld in het eerste lid,
      een verslag over de doeltreffendheid en de effecten ervan alsmede een standpunt inzake de voortzetting anders dan
      als experiment, aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel186
  - number: 186a.1
    text: |-
      De verplichting, bedoeld in [artikel 151c, eerste lid][ref1], geldt voor een bestuurder van:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151c
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel186a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151c
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 186a.1.a
    text: |-
      een voertuig waarvoor een rijbewijs van een van de categorieën D1, E bij D1, D of E bij D, bedoeld in artikel 3
      van richtlijn nr. 91/439/EEG van de Raad van de Europese Gemeenschappen van 29 juli 1991 betreffende het rijbewijs
      (PbEG L 237), of een als gelijkwaardig erkend rijbewijs vereist is: met ingang van 10 september 2008;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel186a
  - number: 186a.1.b
    text: |-
      een voertuig waarvoor een rijbewijs van een van de categorieën C1, E bij C1, C of E bij C, bedoeld in artikel 3
      van de in onderdeel a genoemde richtlijn, of een als gelijkwaardig erkend rijbewijs vereist is: met ingang van 10
      september 2009.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel186a
  - number: 186a.2
    text: |-
      Een wijziging van de in het eerste lid, onderdeel a, genoemde richtlijn en van de in
      [artikel 151b, onderdeel a][ref1], bedoelde richtlijn vakbekwaamheid bestuurders gaat voor de toepassing van dit
      artikel gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151b
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel186a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151b
        hoofdstuk: VIIA
        paragraaf: '1'
  - number: '187'
    text: De inwerkingtreding van deze wet wordt nader bij de wet geregeld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel187
  - number: '188'
    text: 'Deze wet kan worden aangehaald als: Wegenverkeerswet 1994.'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel188
