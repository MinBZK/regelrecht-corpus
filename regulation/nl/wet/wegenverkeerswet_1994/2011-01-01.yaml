  - number: 4b.1.o
    text: |-
      het sluiten van overeenkomsten met betrekking tot de productie van rijbewijzen, de aflevering ervan en het beheer
      van de daartoe benodigde voorzieningen;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4b
  - number: 4b.1.p
    text: het attenderen van houders van een rijbewijs op het verloop van de geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4b
  - number: 4b.2
    text: 'Voorts is de Dienst Wegverkeer belast met:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4b
  - number: 4b.2.a
    text: de bij of krachtens andere wetten opgedragen taken, en
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4b
  - number: 4b.2.b
    text: andere door Onze Minister opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4b
  - number: 4c
    text: |-
      Onze Minister kan de Dienst Wegverkeer aanwijzingen van algemene aard geven omtrent de uitoefening van de
      aan de Dienst opgedragen taken. Aanwijzingen omtrent de uitoefening van de bij of krachtens andere wetten dan
      deze wet opgedragen taken worden door Onze Minister gegeven in overeenstemming met Onze voor die wetten eerst
      verantwoordelijke Ministers.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4c
  - number: 4d
    text: De Dienst Wegverkeer heeft een directie en een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4d
  - number: 4e.1
    text: De directie bestaat uit maximaal 3 leden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4e
  - number: 4e.2
    text: Het lidmaatschap van de directie is onverenigbaar met het lidmaatschap van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4e
  - number: 4e.3
    text: De leden van de directie worden aangesteld, geschorst en ontslagen door de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4e
  - number: 4e.4
    text: |-
      De leden van de directie worden aangesteld voor een periode van 5 jaren en kunnen terstond opnieuw worden
      aangesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4e
  - number: 4f.1
    text: De directie is belast met de dagelijkse leiding van de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4f
  - number: 4f.2
    text: |-
      Alle bevoegdheden van de Dienst Wegverkeer die niet bij of krachtens de wet aan de raad van toezicht zijn
      opgedragen, komen toe aan de directie.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4f
  - number: 4g.1
    text: De directie vertegenwoordigt de Dienst Wegverkeer in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4g
  - number: 4g.2
    text: |-
      De directie kan onder haar verantwoordelijkheid de vertegenwoordiging, bedoeld in het eerste lid, opdragen aan een
      of meer directieleden of andere personen. Zij kan bepalen dat deze vertegenwoordiging uitsluitend betrekking heeft
      op bepaalde onderdelen van de taak van de Dienst Wegverkeer dan wel op bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4g
  - number: 4h
    text: |-
      In geval van schorsing of ontstentenis van een lid van de directie voorziet de raad van toezicht in de waarneming
      van diens functie.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4h
  - number: 4i.1
    text: |-
      De directie verstrekt de raad van toezicht tijdig de voor de uitoefening van diens taak benodigde inlichtingen en
      andere gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4i
  - number: 4i.2
    text: |-
      De directie legt jaarlijks, en voorts tussentijds indien hiertoe naar het oordeel van de raad van toezicht
      aanleiding bestaat, aan de raad van toezicht verantwoording af over het door haar gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4i
  - number: 4j.1
    text: De raad van toezicht bestaat uit vijf leden, waaronder de voorzitter.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4j
  - number: 4j.2
    text: Onze Minister benoemt, schorst en ontslaat de leden van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4j
  - number: 4j.3
    text: De voorzitter wordt benoemd, gehoord de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4j
  - number: 4j.4
    text: |-
      De leden van de raad van toezicht hebben op persoonlijke titel zitting in de raad en oefenen hun functie uit zonder
      last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4j
  - number: 4k.1
    text: |-
      De voorzitter en de overige leden van de raad van toezicht worden benoemd voor een tijdvak van vier jaren en zijn
      voor een aansluitende periode éénmaal herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4k
  - number: 4k.2
    text: |-
      De leden van de raad van toezicht kan tussentijds op eigen verzoek, dan wel om zwaarwichtige redenen ontslag worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4k
  - number: 4k.3
    text: |-
      Zolang in een vacature van de raad van toezicht niet is voorzien, vormen de overblijvende leden de raad van
      toezicht, met de bevoegdheid van de volledige raad. Binnen twee maanden na het openvallen van een vacature wordt
      een nieuw lid benoemd. Betreft het de vacature van de voorzitter dan wijzen de overblijvende leden uit hun midden
      een lid aan dat tijdelijk als voorzitter fungeert.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4k
  - number: 4k.4
    text: |-
      Degene die is benoemd ter vervanging van een tussentijds opengevallen plaats treedt af op het tijdstip waarop
      degene in wiens plaats hij is benoemd, zou moeten aftreden en is vervolgens voor een aansluitende periode éénmaal
      herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4k
  - number: 4l.1
    text: De raad van toezicht ziet toe op de werkzaamheden van de directie en staat die met raad terzijde.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
  - number: 4l.2
    text: 'Goedkeuring door de raad van toezicht behoeven in ieder geval de besluiten van de directie betreffende:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
  - number: 4l.2.a
    text: |-
      de reglementen, bedoeld in de [artikelen 4n][ref1], [4o][ref2] en [4r][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4n
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel4o
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel4r
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4n
        hoofdstuk: IA
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 4o
        hoofdstuk: IA
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 4r
        hoofdstuk: IA
        paragraaf: '6'
  - number: 4l.2.b
    text: |-
      vaststelling van de tarieven, bedoeld in [artikel 4b, eerste lid, onderdeel n][ref1], de tarieven die voortvloeien
      uit [artikel 4b, tweede lid, onderdeel a][ref2], alsmede van de wijze van betaling van deze tarieven;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4b
        hoofdstuk: IA
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 4b
        hoofdstuk: IA
        paragraaf: '2'
  - number: 4l.2.c
    text: investeringen die een door de raad van toezicht vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
  - number: 4l.2.d
    text: de financiële begroting;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
  - number: 4l.2.e
    text: het jaarverslag en de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
  - number: 4l.2.f
    text: het aangaan of garanderen van geldleningen die een door de raad van toezicht vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
  - number: 4l.2.g
    text: wijzigingen in de rechtspositie van het personeel;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
  - number: 4l.2.h
    text: de bij of krachtens deze wet aan Onze Minister uit te brengen rapportages;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
  - number: 4l.2.i
    text: het financiële meerjarenbeleidsplan;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
  - number: 4l.2.j
    text: |-
      uitbreiding van de keuringscapaciteit als bedoeld in [artikel 78, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: 4l.2.k
    text: het oprichten of mede-oprichten van dan wel het deelnemen in rechtspersonen of vennootschappen;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
  - number: 4l.2.l
    text: het sluiten van overeenkomsten van zwaarwegend belang.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
  - number: 4l.3
    text: |-
      Het aangaan of garanderen van geldleningen die een door Onze Minister vast te stellen bedrag te boven gaan, de in
      het tweede lid, onderdelen b, d, i, j, k en l genoemde besluiten, het in [artikel 4n][ref1] bedoelde reglement,
      alsmede het in [artikel 4o][ref2] bedoelde reglement voor zover het betreft de bezoldiging van de directie van
      de Dienst Wegverkeer, behoeven bovendien de goedkeuring van Onze Minister. Bij de goedkeuring van het hier in
      [artikel 4o][ref3] bedoelde reglement zal Onze Minister als richtsnoer de bezoldigingsniveaus van functies van
      vergelijkbare zwaarte bij de ministeries hanteren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4n
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel4o
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel4o
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4n
        hoofdstuk: IA
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 4o
        hoofdstuk: IA
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 4o
        hoofdstuk: IA
        paragraaf: '5'
  - number: 4l.4
    text: |-
      De raad van toezicht kan geen rechtsgeldige besluiten nemen indien niet ten minste vier leden ter vergadering
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
  - number: 4l.5
    text: |-
      De raad van toezicht stelt bij reglement zijn werkwijze vast. Het reglement behoeft de goedkeuring van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
  - number: 4l.6
    text: De vergaderingen van de raad van toezicht zijn niet openbaar.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4l
  - number: 4m.1
    text: De raad van toezicht heeft een eigen secretariaat; de kosten daarvan komen ten laste van de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4m
  - number: 4m.2
    text: |-
      Onze Minister kan aan de leden van de raad van toezicht, ten laste van de Dienst Wegverkeer, een vergoeding
      toekennen voor hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4m
  - number: 4m.3
    text: |-
      De leden van de raad van toezicht hebben aanspraak op vergoeding van de door hen in de uitoefening van hun functie
      gemaakte reis- en verblijfskosten.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4m
  - number: 4n
    text: De directie stelt bij reglement zijn werkwijze vast.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4n
  - number: 4o.1
    text: |-
      Het personeel van de Dienst Wegverkeer, de leden van de directie daaronder begrepen, is ambtenaar in de zin van de
      [Ambtenarenwet][ref1], behoudens degenen met wie een arbeidsovereenkomst is gesloten naar burgerlijk recht.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: 4o.2
    text: De directie stelt bij reglement de regeling van de rechtstoestand van het personeel vast.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3
    text: |-
      Onverminderd hetgeen reeds bij of krachtens de wet is geregeld, geeft het reglement, bedoeld in het tweede lid, in
      ieder geval voorschriften betreffende de volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.a
    text: aanstelling;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.b
    text: schorsing;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.c
    text: ontslag;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.d
    text: het onderzoek naar de geschiktheid en de bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.e
    text: bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.f
    text: wachtgeld;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.g
    text: diensttijden;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.h
    text: verlof en vakantie;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.i
    text: voorzieningen in verband met ziekte;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.j
    text: bescherming bij de arbeid;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.k
    text: woon-, verblijfs- en bereikbaarheidsverplichtingen;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.l
    text: medezeggenschap;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.m
    text: overige rechten en verplichtingen van het personeel;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.n
    text: disciplinaire maatregelen;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.o
    text: |-
      de wijze waarop met de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel overleg wordt gevoerd
      over aangelegenheden van algemeen belang voor de rechtstoestand en de bezoldiging van het personeel van de Dienst
      Wegverkeer;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4o.3.p
    text: een geschillenregeling met betrekking tot de in de onderdelen *l* en *o* genoemde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4o
  - number: 4p
    text: 'De inkomsten van de Dienst Wegverkeer bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4p
  - number: 4p.a
    text: de opbrengst van de heffingen;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4p
  - number: 4p.b
    text: vergoedingen voor verrichte diensten;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4p
  - number: 4p.c
    text: andere baten hoe ook genoemd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4p
  - number: 4q.1
    text: |-
      De hoogte van de tarieven, bedoeld in [artikel 4b, eerste lid, onderdeel n][ref1], dient te worden gerelateerd aan
      de met de uitoefening van de taak gemoeide kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4b
        hoofdstuk: IA
        paragraaf: '2'
  - number: 4q.2
    text: |-
      Het tarief, bedoeld in [artikel 48, eerste lid][ref1], voor de aanvraag van een bij algemene maatregel van bestuur
      aan te wijzen deel van het kentekenbewijs omvat mede een bij ministeriële regeling vastgesteld bedrag dat strekt
      ter dekking van de kosten van:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 4q.2.a
    text: het registreren van keuringsrapporten,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4q
  - number: 4q.2.b
    text: het ongeldig verklaren van kentekenbewijzen,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4q
  - number: 4q.2.c
    text: |-
      het verstrekken van gegevens uit het kentekenregister als bedoeld in [artikel 43, eerste en tweede lid][ref1], en
      bij algemene maatregel van bestuur te bepalen verstrekkingen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 4q.2.d
    text: |-
      het behandelen van klachten en ingevolge de [Algemene wet bestuursrecht][ref1] ingediende bezwaarschriften en
      beroepsschriften gericht op het handelen van de Dienst Wegverkeer,


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 4q.2.e
    text: |-
      het opsporen van bij of krachtens deze wet strafbaar gestelde feiten voor zover ambtenaren van de Dienst Wegverkeer
      daarmee ingevolge [artikel 159][ref1] zijn belast,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: 4q.2.f
    text: |-
      het beheer en instandhouding van het in
      [artikel 13, tweede lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1] bedoelde register,


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel13
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '13'
  - number: 4q.2.g
    text: |-
      het verstrekken van gegevens uit het in onderdeel f genoemde register aan degenen die ingevolge de in
      [artikel 38, tweede lid van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1] bedoelde algemene maatregel
      van bestuur niet tot betaling van het ter zake vastgestelde tarief zijn gehouden,


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel38
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '38'
  - number: 4q.2.h
    text: |-
      de inspectie bedoeld in [artikel 45a, tweede lid][ref1], indien naar het oordeel van de Dienst Wegverkeer blijkt
      dat de gegevens juist in het kentekenregister zijn opgenomen dan wel de onjuistheid van een gegeven degene aan wie
      het kentekenbewijs voor het geïnspecteerde voertuig is afgegeven niet kan worden tegengeworpen, en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel45a
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 45a
        hoofdstuk: IV
        paragraaf: '3'
  - number: 4q.2.i
    text: het toezicht op het terugroepen door de fabrikant van reeds in de handel gebrachte voertuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4q
  - number: 4r
    text: |-
      De directie stelt bij reglement richtlijnen vast voor het voeren van een ordelijk financieel beheer van de Dienst
      Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4r
  - number: 4s.1
    text: De directie stelt jaarlijks een jaarverslag en een jaarrekening op.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4s
  - number: 4s.2
    text: Het boekjaar van de Dienst Wegverkeer valt samen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4s
  - number: 4s.3
    text: De directie zendt jaarlijks binnen vier maanden na afloop van het boekjaar de jaarstukken aan de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4s
  - number: 4s.4
    text: 'De jaarstukken omvatten:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4s
  - number: 4s.4.a
    text: het jaarverslag;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4s
  - number: 4s.4.b
    text: de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4s
  - number: 4s.4.c
    text: de verklaring van de door de raad van toezicht aangewezen externe registeraccountant;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4s
  - number: 4s.4.d
    text: een opgave over de toepassing van de arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4s
  - number: 4s.5
    text: |-
      De directie zendt binnen zes maanden na afloop van het boekjaar de jaarstukken met een document, houdende de
      goedkeuring door de raad van toezicht van het jaarverslag en de jaarrekening ter kennisneming aan Onze Minister.
      De directie stelt te zelfder tijd de in het vierde lid, onderdelen *a*, *b* en *c*, bedoelde stukken algemeen
      verkrijgbaar en maakt hiervan melding in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4s
  - number: 4t.1
    text: |-
      De directie dient het financiële meerjarenbeleidsplan en de goedkeuring daarvan door de raad van toezicht voor 1
      oktober voorafgaand aan het boekjaar, in bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4t
  - number: 4t.2
    text: |-
      De directie verstrekt Onze Minister voor 15 januari van het jaar voorafgaand aan het begrotingsjaar de door Onze
      Minister voor het opstellen van de Rijksbegroting vereiste gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4t
  - number: 4t.3
    text: |-
      Onze Minister kan regels stellen over de inrichting van de begroting, het financiële meerjarenbeleidsplan en de
      jaarstukken, en kan aandachtspunten vaststellen voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4t
  - number: 4u.1
    text: De directie verstrekt Onze Minister de inlichtingen die deze ten behoeve van zijn taakuitoefening nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4u
  - number: 4u.2
    text: |-
      Onze Minister verstrekt de Dienst Wegverkeer de inlichtingen die deze voor zijn taakuitoefening redelijkerwijs
      nodig heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4u
  - number: 4u.3
    text: |-
      Onze Minister stelt een informatiestatuut vast. Het informatiestatuut bevat inhoudelijke en procedurele
      voorschriften met betrekking tot de in dit hoofdstuk bedoelde informatie-uitwisseling tussen Onze Minister en de
      Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4u
  - number: 4v.1
    text: |-
      Waar in deze wet de goedkeuring van Onze Minister is vereist, verleent dan wel onthoudt deze die goedkeuring binnen
      zes weken na de datum van ontvangst van de aan goedkeuring onderhevige stukken.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4v
  - number: 4v.2
    text: |-
      Met goedkeuring wordt gelijkgesteld het verstrijken van de in het eerste lid bedoelde termijn zonder dat de
      goedkeuring is verleend of onthouden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4v
  - number: 4w.1
    text: |-
      Waar ingevolge deze wet de goedkeuring dan wel de vaststelling door de raad van toezicht is vereist, verleent of
      onthoudt deze die goedkeuring dan wel stelt deze vast of weigert die vaststelling binnen zes weken na de datum van
      ontvangst van de aan goedkeuring onderhevige dan wel vast te stellen stukken.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4w
  - number: 4w.2
    text: |-
      Met goedkeuring dan wel vaststelling wordt gelijkgesteld het verstrijken van de in het eerste lid bedoelde termijn
      zonder dat de goedkeuring is verleend of onthouden dan wel de vaststelling heeft plaatsgevonden of is geweigerd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4w
  - number: 4w.3
    text: |-
      Indien de raad van toezicht goedkeuring onthoudt aan de financiële begroting, is de directie gerechtigd gedurende
      ten hoogste zes maanden voor iedere maand gedurende welke de goedkeuring wordt onthouden, uitgaven te doen ter
      grootte van maximaal een twaalfde deel van de begroting van het voorafgaande boekjaar.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4w
  - number: 4x.1
    text: |-
      Indien naar het oordeel van Onze Minister de Dienst Wegverkeer zijn taken, omschreven in
      [artikel 4b, eerste lid en tweede lid, onderdeel b][ref1], niet langer naar behoren verricht, kan Onze Minister
      bepalen dat de bevoegdheden die met die taken verband houden niet langer aan de Dienst Wegverkeer toekomen. De
      betrokken bevoegdheden gaan in dat geval over op Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4x
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4b
        hoofdstuk: IA
        paragraaf: '2'
  - number: 4x.2
    text: |-
      Indien de Dienst Wegverkeer een bij of krachtens een andere wet dan deze wet opgedragen taak naar het oordeel
      van Onze Minister en Onze voor die wet eerst verantwoordelijke Minister niet langer naar behoren verricht, kunnen
      zij gezamenlijk bepalen dat de bevoegdheden die met die taak verband houden niet langer aan de Dienst Wegverkeer
      toekomen. De betrokken bevoegdheden gaan in dat geval over op Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4x
  - number: 4y
    text: Het Besluit voorschrift informatiebeveiliging rijksdienst 1994 is van toepassing op de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4y
  - number: 4z.1
    text: |-
      Het CBR verstrekt desgevraagd aan Onze Minister de inlichtingen die deze ten behoeve van zijn taakuitoefening nodig
      oordeelt. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling
      van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4z
  - number: 4z.2
    text: |-
      Onze Minister kan aan het CBR aanwijzingen van algemene aard geven met betrekking tot de uitvoering van de
      [artikelen 130 tot en met 134a][ref1] en [149, tweede lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel149
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4z
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '149'
        hoofdstuk: VII
  - number: 4z.3
    text: |-
      Indien het CBR naar het oordeel van Onze Minister zijn taak ernstig verwaarloost of in gevaar brengt, kan Onze
      Minister, gehoord het CBR, de noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4z
  - number: 4z.4
    text: |-
      Over de uitoefening van het toezicht op het CBR door Onze Minister kunnen bij of krachtens algemene maatregel van
      bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4z
  - number: 4aa.1
    text: |-
      Keuringsinstellingen, aangewezen ingevolge de [artikelen 71a][ref1], [84, eerste lid][ref2],
      [101, eerste lid][ref3], en [132e, vijfde lid][ref4], en [106a, derde lid][ref5], jo. [101, eerste lid][ref6],
      en de ingevolge deze artikelen erkende onderzoeksgerechtigden en instellingen, verstrekken desgevraagd aan Onze
      Minister de inlichtingen die deze ten behoeve van zijn taakuitoefening nodig oordeelt. Onze Minister kan inzage
      vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak redelijkerwijze
      noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel101
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel106a
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel101
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4aa
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 71a
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '84'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '101'
        hoofdstuk: V
        paragraaf: '8'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: 132e
        hoofdstuk: VI
        paragraaf: '4'
        afdeling: '9'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: 106a
        hoofdstuk: V
        paragraaf: 9a
      - id: ref6
        bwb_id: BWBR0006622
        artikel: '101'
        hoofdstuk: V
        paragraaf: '8'
  - number: 4aa.2
    text: |-
      Onze Minister kan aan de in het eerste lid bedoelde keuringsinstellingen, onderzoeksgerechtigden en instellingen
      aanwijzingen van algemene aard geven met betrekking tot de uitvoering van de taak waarvoor zij zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4aa
  - number: 4aa.3
    text: |-
      Onze Minister kan tarieven vaststellen die de in het eerste lid bedoelde keuringsinstellingen,
      onderzoeksgerechtigden en instellingen ten hoogste mogen berekenen voor de door hen verrichte werkzaamheden in het
      kader van de uitvoering van de taak waarvoor zij zijn aangewezen. Daarbij kunnen voor verschillende werkzaamheden
      verschillende tarieven worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4aa
  - number: 4aa.4
    text: |-
      Indien een keuringsinstelling als bedoeld in het eerste lid naar het oordeel van Onze Minister haar taak
      verwaarloost, kan Onze Minister de aanwijzing intrekken.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4aa
  - number: 4aa.5
    text: |-
      Over de uitoefening van het toezicht op keuringsinstellingen, onderzoeksgerechtigden en instellingen als bedoeld in
      het eerste lid kunnen bij of krachtens algemene maatregel van bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel4aa
  - number: '5'
    text: |-
      Het is een ieder verboden zich zodanig te gedragen dat gevaar op de weg wordt veroorzaakt of kan worden veroorzaakt
      of dat het verkeer op de weg wordt gehinderd of kan worden gehinderd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel5
  - number: '6'
    text: |-
      Het is een ieder die aan het verkeer deelneemt verboden zich zodanig te gedragen dat een aan zijn schuld te wijten
      verkeersongeval plaatsvindt waardoor een ander wordt gedood of waardoor een ander zwaar lichamelijk letsel wordt
      toegebracht of zodanig lichamelijk letsel dat daaruit tijdelijke ziekte of verhindering in de uitoefening van de
      normale bezigheden ontstaat.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het is degene die bij een verkeersongeval is betrokken of door wiens gedraging een verkeersongeval is veroorzaakt,
      verboden de plaats van het ongeval te verlaten indien:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel7
  - number: 7.1.a
    text: |-
      bij dat ongeval, naar hij weet of redelijkerwijs moet vermoeden, een ander is gedood dan wel letsel of schade aan
      een ander is toegebracht;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel7
  - number: 7.1.b
    text: |-
      daardoor, naar hij weet of redelijkerwijs moet vermoeden, een ander aan wie bij dat ongeval letsel is toegebracht,
      in hulpeloze toestand wordt achtergelaten.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid, aanhef en onderdeel *a*, is niet van toepassing op degene die op de plaats van het ongeval
      behoorlijk de gelegenheid heeft geboden tot vaststelling van zijn identiteit en, voor zover hij een motorrijtuig
      bestuurde, tevens van de identiteit van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel7
  - number: '8.1'
    text: |-
      Het is een ieder verboden een voertuig te besturen of als bestuurder te doen besturen, terwijl hij verkeert onder
      zodanige invloed van een stof, waarvan hij weet of redelijkerwijs moet weten, dat het gebruik daarvan - al dan niet
      in combinatie met het gebruik van een andere stof - de rijvaardigheid kan verminderen, dat hij niet tot behoorlijk
      besturen in staat moet worden geacht.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel8
  - number: '8.2'
    text: |-
      Het is een ieder verboden een voertuig te besturen of als bestuurder te doen besturen na zodanig gebruik van
      alcoholhoudende drank, dat:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel8
  - number: 8.2.a
    text: |-
      het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan 220 microgram alcohol per liter
      uitgeademde lucht, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel8
  - number: 8.2.b
    text: |-
      het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan 0,5 milligram alcohol per milliliter
      bloed.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel8
  - number: '8.3'
    text: |-
      In afwijking van het tweede lid is het de bestuurder van een motorrijtuig voor het besturen waarvan een
      rijbewijs is vereist, indien sedert de datum waarop aan hem voor de eerste maal een rijbewijs is afgegeven nog
      geen vijf jaren zijn verstreken, dan wel, indien het voor het eerst afgegeven rijbewijs een rijbewijs betreft
      dat de bevoegdheid geeft tot het besturen van bromfietsen en dit rijbewijs is afgegeven aan een persoon die op
      het ogenblik van die afgifte de leeftijd van achttien jaren nog niet heeft bereikt, nog geen zeven jaar zijn
      verstreken, en de eerste afgifte van het rijbewijs op of na 30 maart 2002 heeft plaatsgevonden, verboden dat
      motorrijtuig te besturen of als bestuurder te doen besturen na zodanig gebruik van alcoholhoudende drank, dat:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel8
  - number: 8.3.a
    text: |-
      het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan 88 microgram alcohol per liter
      uitgeademde lucht, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel8
  - number: 8.3.b
    text: het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan 0,2 milligram per milliliter bloed.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel8
  - number: '8.4'
    text: |-
      Het derde lid is van overeenkomstige toepassing op de bestuurder van een motorrijtuig die zonder rijbewijs een
      motorrijtuig bestuurt voor het besturen waarvan een rijbewijs vereist is.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel8
  - number: '8.5'
    text: |-
      Het is verboden een motorrijtuig als bestuurder te doen besturen door een persoon waarvan men weet of
      redelijkerwijs moet weten dat deze verkeert in een toestand als in het eerste, tweede of derde lid is omschreven.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel8
  - number: '8.6'
    text: |-
      Voor de toepassing van het derde lid wordt onder een rijbewijs mede verstaan een rijbewijs, afgegeven door het
      daartoe bevoegde gezag buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel8
  - number: '9.1'
    text: |-
      Het is degene die weet of redelijkerwijs moet weten dat hem bij rechterlijke uitspraak of strafbeschikking de
      bevoegdheid tot het besturen van motorrijtuigen is ontzegd, verboden gedurende de tijd dat hem die bevoegdheid is
      ontzegd, op de weg een motorrijtuig te besturen of als bestuurder te doen besturen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het is degene die weet of redelijkerwijs moet weten dat een op zijn naam gesteld rijbewijs voor een of meer
      categorieën van motorrijtuigen dan wel voor een gedeelte van de geldigheidsduur ongeldig is verklaard, indien aan
      hem daarna geen ander rijbewijs voor het besturen van een motorrijtuig van de betrokken categorie of categorieën is
      afgegeven, verboden op de weg een motorrijtuig van die categorie of categorieën dan wel gedurende dat gedeelte van
      de geldigheidsduur te besturen of als bestuurder te doen besturen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel9
  - number: '9.3'
    text: |-
      Het tweede lid geldt niet ten aanzien van de bestuurder van een motorrijtuig gedurende de tijd dat aan hem ter
      verkrijging van een rijbewijs voor de categorie of categorieën van motorrijtuigen waarop de ongeldigverklaring
      betrekking heeft, rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven en
      gedurende de tijd dat door hem een rijproef wordt afgelegd in het kader van een onderzoek, door of vanwege de
      overheid ingesteld, naar zijn rijvaardigheid of geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: '9.4'
    text: |-
      Het is degene van wie ingevolge [artikel 130, tweede lid][ref1], de overgifte van een op zijn naam gesteld
      rijbewijs is gevorderd, dan wel wiens rijbewijs is ingevorderd en aan wie dat bewijs niet is teruggegeven, verboden
      op de weg een motorrijtuig van de categorie of categorieën waarvoor dat bewijs was afgegeven, te besturen of als
      bestuurder te doen besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: '9.5'
    text: |-
      Het is degene die weet of redelijkerwijs moet weten dat de geldigheid van een op zijn naam gesteld rijbewijs
      ingevolge [artikel 131, derde lid, onderdeel a][ref1], voor een of meer categorieën van motorrijtuigen is
      geschorst, verboden gedurende de tijd dat de schorsing van kracht is, op de weg een motorrijtuig van de categorie
      of categorieën waarop de schorsing betrekking heeft, te besturen of als bestuurder te doen besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: '9.6'
    text: |-
      Het vierde en het vijfde lid gelden niet ten aanzien van de bestuurder van een motorrijtuig gedurende de tijd dat
      door hem een rijproef wordt afgelegd in het kader van een ingevolge [artikel 131, eerste lid][ref1], gevorderd
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: '9.7'
    text: |-
      Het is degene van wie ingevolge [artikel 164][ref1] de overgifte van een op zijn naam gesteld rijbewijs, een hem
      door het daartoe bevoegde gezag buiten Nederland afgegeven rijbewijs of een internationaal rijbewijs is gevorderd,
      dan wel van wie zodanig bewijs is ingevorderd en aan wie dat bewijs niet is teruggegeven, verboden op de weg een
      motorrijtuig van de categorie of categorieën waarvoor dat bewijs was afgegeven, te besturen of als bestuurder te
      doen besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel164
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '164'
        hoofdstuk: IX
  - number: '9.8'
    text: |-
      Het is degene van wie ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1] de
      inlevering van het rijbewijs is gevorderd, dan wel wiens rijbewijs krachtens die wet is ingenomen, verboden op de
      weg een motorrijtuig, voor het besturen waarvan het rijbewijs is afgegeven, te besturen of als bestuurder te doen
      besturen met ingang van het tijdstip, bedoeld in [artikel 30, eerste lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004581
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel30
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004581
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '30'
  - number: '9.9'
    text: |-
      Voor de toepassing van het tweede, vierde, vijfde, zesde en achtste lid wordt onder rijbewijs mede verstaan een
      rijbewijs, afgegeven door het daartoe bevoegde gezag buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel9
  - number: '10.1'
    text: Het is verboden op de weg een wedstrijd met voertuigen te houden of daaraan deel te nemen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel10
  - number: '10.2'
    text: |-
      Onder wedstrijd wordt voor de toepassing van dit artikel verstaan elk rijden met voertuigen ter vaststelling of
      vergelijking van prestaties hetzij van de deelnemers, hetzij van de voertuigen, hetzij van onderdelen daarvan,
      hetzij van bedrijfsstoffen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel10
  - number: '10.3'
    text: |-
      Als deelnemer wordt beschouwd de bestuurder van een voertuig waarmee aan een wedstrijd wordt deelgenomen, en de
      eigenaar of houder van een voertuig, die daarmee aan een wedstrijd doet of laat deelnemen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel10
  - number: '11'
    text: Het is verboden opzettelijk wederrechtelijk een aan een ander toebehorend motorrijtuig op de weg te gebruiken.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel11
  - number: '12.1'
    text: |-
      Weggebruikers zijn verplicht gevolg te geven aan de aanwijzingen die door de in [artikel 159][ref1] bedoelde
      personen dan wel door andere bij algemene maatregel van bestuur aangewezen categorieën van personen ter zake van
      het verkeer op de weg worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '12.2'
    text: |-
      De in het eerste lid bedoelde aanwijzingen mogen slechts worden gegeven in het belang van de veiligheid op de weg,
      de instandhouding van de weg en de bruikbaarheid daarvan, of de vrijheid van het verkeer dan wel in het belang van
      met toestemming van Onze Minister verrichte onderzoeken ten behoeve van het verkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel12
  - number: '12.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het bepaalde in het eerste
      lid, alsmede met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel12
  - number: 12.3.a
    text: |-
      de opleiding en examinering van verkeersregelaars en de afgifte, of weigering daarvan, en geldigheidsduur van
      examencertificaten en herhalingscertificaten;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel12
  - number: 12.3.b
    text: |-
      de erkenning, of de weigering daarvan, door Onze Minister van examencertificaten of herhalingscertificaten, de
      voorschriften die aan die erkenning kunnen worden verbonden en de intrekking van die erkenning;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel12
  - number: 12.3.c
    text: de opleiding van verkeersbrigadiers;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel12
  - number: 12.3.d
    text: |-
      de aanstelling van verkeersregelaars, de verlenging en intrekking van die aanstelling, de afgifte van het
      bevoegdheidsbewijs aan verkeersregelaars, de schorsing van de aanstelling van verkeersregelaars in gevallen waarin
      het verkeer in gevaar is of kan worden gebracht, alsmede de aanstelling van verkeersbrigadiers;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel12
  - number: 12.3.e
    text: |-
      de uitrusting, de verzekering, de wijze en plaats van taakuitoefening, en het toezicht op verkeersregelaars en
      verkeersbrigadiers.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel12
  - number: '13.1'
    text: Bij algemene maatregel van bestuur worden nadere regels vastgesteld betreffende het gedrag van verkeersdeelnemers.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel13
  - number: '13.2'
    text: |-
      In de bij die algemene maatregel van bestuur aangegeven gevallen kunnen bij ministeriële regeling voorschriften ter
      uitvoering van die regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel13
  - number: '14'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld omtrent het toepassen van verkeerstekens en
      onderborden alsmede omtrent het treffen van maatregelen op of aan de weg tot wijziging van de inrichting van de
      weg of tot het aanbrengen of verwijderen van voorzieningen ter regeling van het verkeer. Bij ministeriële regeling
      worden nadere regels vastgesteld betreffende het toepassen van verkeerstekens en onderborden. Bij ministeriële
      regeling worden voorschriften vastgesteld betreffende inrichting, plaatsing, kleur, afmeting en materiaal van
      verkeerstekens en onderborden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel14
  - number: '15.1'
    text: |-
      De plaatsing of verwijdering van de bij algemene maatregel van bestuur aangewezen verkeerstekens, en onderborden
      voor zover daardoor een gebod of verbod ontstaat of wordt gewijzigd, geschiedt krachtens een verkeersbesluit.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel15
  - number: '15.2'
    text: |-
      Maatregelen op of aan de weg tot wijziging van de inrichting van de weg of tot het aanbrengen of verwijderen van
      voorzieningen ter regeling van het verkeer geschieden krachtens een verkeersbesluit, indien de maatregelen leiden
      tot een beperking of uitbreiding van het aantal categorieën weggebruikers dat van een weg of weggedeelte gebruik
      kan maken.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel15
  - number: '16.1'
    text: |-
      De in [artikel 15][ref1] bedoelde verkeerstekens en onderborden worden geplaatst of verwijderd, en de daar bedoelde
      maatregelen worden getroffen, door de zorg van het gezag dat het verkeersbesluit heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
  - number: '16.2'
    text: |-
      Verkeerstekens en onderborden, die niet worden geplaatst of verwijderd krachtens een verkeersbesluit, worden
      geplaatst of verwijderd door de zorg van het openbaar lichaam dat het beheer heeft over de weg of, indien geen
      openbaar lichaam het beheer heeft, door de zorg van de eigenaar van de weg.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel16
  - number: '17'
    text: |-
      In de bij algemene maatregel van bestuur aangewezen gevallen kan bij de plaatsing en verwijdering van
      verkeerstekens en het treffen van maatregelen op of aan de weg, worden afgeweken van de [artikelen 15][ref1]
      en [16][ref2]. Indien het als gevolg van dringende omstandigheden niet mogelijk is de verkeerstekens in de
      voorgeschreven uitvoering te plaatsen, kan de door het teken aangeduide informatie op andere duidelijke wijze
      kenbaar worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel16
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
  - number: '18.1'
    text: 'Verkeersbesluiten worden genomen:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel18
  - number: 18.1.a
    text: voor zover zij betreffen het verkeer op wegen onder beheer van het Rijk door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel18
  - number: 18.1.b
    text: voor zover zij betreffen het verkeer op wegen onder beheer van een provincie door gedeputeerde staten;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel18
  - number: 18.1.c
    text: |-
      voor zover zij betreffen het verkeer op wegen onder beheer van een waterschap door het algemeen bestuur of,
      krachtens besluit van het algemeen bestuur, door het dagelijks bestuur;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel18
  - number: 18.1.d
    text: |-
      voor zover zij betreffen het verkeer op andere wegen door burgemeester en wethouders, of krachtens besluit van hen,
      door een door hen ingestelde bestuurscommissie of het dagelijks bestuur van een deelgemeente.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel18
  - number: '18.2'
    text: |-
      Indien het beheer over een weg wordt overgedragen, blijven de verkeersbesluiten die de oorspronkelijke wegbeheerder
      ten aanzien van het verkeer op die weg heeft vastgesteld, van kracht totdat zij zijn vervangen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel18
  - number: '18.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld omtrent de eisen waaraan verkeersbesluiten dienen te
      voldoen alsmede omtrent de totstandkoming en de inwerkingtreding van die besluiten.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel18
  - number: '19.1'
    text: |-
      Gedeputeerde staten kunnen aan besturen van waterschappen en aan burgemeester en wethouders de aanwijzing geven
      om op buiten de bebouwde kom gelegen wegen, ten aanzien waarvan die organen bevoegd zijn tot het nemen van
      verkeersbesluiten, binnen dertien weken een verkeersbesluit van een daarbij aan te geven inhoud te nemen en uit
      te voeren.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel19
  - number: '19.2'
    text: 'Het eerste lid mag worden toegepast, indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel19
  - number: 19.2.a
    text: |-
      op een buiten de bebouwde kom gelegen weg, die bij meerdere organen in beheer is, naar het oordeel van gedeputeerde
      staten een of meerdere niet op elkaar afgestemde verkeersbesluiten van kracht zijn, die zodanige afstemming
      behoeven met het oog op de belangen, omschreven in [artikel 2, eerste lid, onderdelen ][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: 19.2.b
    text: |-
      gedeputeerde staten van oordeel zijn dat het nemen van een verkeersbesluit noodzakelijk is ter bescherming van de
      belangen, bedoeld in [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: '19.3'
    text: |-
      Gedeputeerde staten dienen voorafgaande aan het geven van een aanwijzing als bedoeld in het eerste lid overleg te
      voeren met het betrokken bestuur.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel19
  - number: '19.4'
    text: Het betrokken bestuur is verplicht een aanwijzing als bedoeld in het eerste lid op te volgen en uit te voeren.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel19
  - number: '19.5'
    text: |-
      Indien een aanwijzing als bedoeld in het eerste lid niet wordt opgevolgd of uitgevoerd, gaan gedeputeerde staten op
      kosten van het betrokken bestuur tot het nemen van het verkeersbesluit en zo nodig tot de uitvoering daarvan over.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel19
  - number: '19.6'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld over de totstandkoming en de inhoud van de in het
      eerste lid bedoelde aanwijzingen alsmede over hetgeen verder voor de uitvoering van dit artikel noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel19
  - number: '20'
    text: |-
      Een belanghebbende kan tegen een verkeersbesluit tot plaatsing of verwijdering van verkeerstekens en onderborden of
      tot het treffen van maatregelen op of aan de weg ter regeling van het verkeer beroep instellen bij de rechtbank.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel20
  - number: 20a.1
    text: De grenzen van de bebouwde kom of kommen van een gemeente worden vastgesteld bij besluit van de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel20a
  - number: 20a.2
    text: Bij algemene maatregel van bestuur worden nadere regels inzake de vaststelling van bebouwde kommen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel20a
  - number: 20b.1
    text: |-
      Voorafgaande aan de toelating tot het verkeer op de weg kan Onze Minister een motorrijtuig met een door de
      constructie bepaalde maximumsnelheid van niet meer dan 25 km/h, uitgerust met een verbrandingsmotor met een
      cilinderinhoud van niet meer dan 50 cm3 of een elektromotor met een nominaal continu maximumvermogen van niet
      meer dan 4 kW, niet zijnde een gehandicaptenvoertuig, per type of individueel voertuig aanwijzen op grond van zijn
      veiligheidsaspecten, indien:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel20b
  - number: 20b.1.a
    text: |-
      de toelating overeenstemt met de in
      [artikel 2, eerste lid, onderdelen a en b, tweede lid en derde lid, onderdeel a][ref1], genoemde doeleinden; en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: 20b.1.b
    text: |-
      er voor dit motorrijtuig niet een typegoedkeuring overeenkomstig in het kader van de Europese Unie tot stand
      gekomen voorschriften vereist is.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel20b
  - number: 20b.2
    text: Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel20b
  - number: '21.1'
    text: |-
      Bij ministeriële regeling aan te wijzen categorieën van voertuigen, systemen, onderdelen, technische eenheden,
      uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers dienen te zijn goedgekeurd voor
      toelating tot het verkeer op de weg.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel21
  - number: '21.2'
    text: |-
      De goedkeuring, bedoeld in het eerste lid, kan worden verleend als typegoedkeuring, dan wel, met betrekking tot
      voertuigen, als goedkeuring voor een individueel voertuig.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel21
  - number: '21.3'
    text: |-
      Bij ministeriële regeling aan te wijzen productieprocessen van bepaalde categorieën voertuigen, systemen,
      onderdelen, technische eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers
      dienen te zijn goedgekeurd alvorens de producten voortkomend uit die productieprocessen worden toegelaten tot het
      verkeer op de weg.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel21
  - number: '21.4'
    text: |-
      In afwijking van het eerste lid kunnen bij ministeriële regeling aan te wijzen categorieën van voertuigen,
      systemen, onderdelen, technische eenheden, uitrustingsstukken en voorzieningen ter bescherming van weggebruikers
      en passagiers worden aangewezen, waarvoor geen typegoedkeuring overeenkomstig in het kader van de Europese Unie tot
      stand gekomen voorschriften vereist is, worden toegelaten tot het verkeer op de weg zonder te zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel21
  - number: '22.1'
    text: |-
      Een typegoedkeuring wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van
      het daarvoor door deze dienst vastgestelde tarief door deze dienst verleend indien het voertuig, het systeem,
      het onderdeel, de technische eenheid, het uitrustingstuk of de voorziening ter bescherming van weggebruikers en
      passagiers waarvoor de goedkeuring wordt gevraagd, bij een door de dienst verrichte keuring heeft voldaan aan
      de bij ministeriële regeling vastgestelde eisen met betrekking tot de toelating tot het verkeer op de weg. Deze
      eisen kunnen betrekking hebben op de technische staat, de specificaties, de prestaties of de uitrusting van het
      voertuig, het systeem, het onderdeel, de technische eenheid, het uitrustingstuk of de voorziening ter bescherming
      van weggebruikers en passagiers.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22
  - number: '22.2'
    text: 'Met een typegoedkeuring wordt gelijkgesteld een typegoedkeuring:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22
  - number: 22.2.a
    text: |-
      die is verleend door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere Staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte en die is verleend overeenkomstig de
      op het betrokken voertuig, systeem, onderdeel, technische eenheid, uitrustingsstuk of voorziening ter bescherming
      van weggebruikers en passagiers betrekking hebbende, in het kader van de Europese Unie tot stand gekomen
      voorschriften, of die is verleend door het daartoe bevoegde gezag in Zwitserland indien dit voorvloeit uit de op
      21 juni 1999 te Luxemburg tot stand gekomen Overeenkomst tussen de Europese Gemeenschap en de Zwitserse Bondsstaat
      inzake de wederzijdse erkenning van de overeenstemmingsbeoordeling (PbEG L 114);
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22
  - number: 22.2.b
    text: |-
      die is verleend door het daartoe bevoegde gezag in een Staat die partij is bij de Overeenkomst betreffende
      het aannemen van eenvormige technische voorschriften die van toepassing zijn op voertuigen op wielen,
      uitrustingsstukken en onderdelen die in een voertuig op wielen kunnen worden gemonteerd of gebruikt en is
      verleend overeenkomstig de voorwaarden voor wederzijdse erkenning van overeenkomstig deze voorschriften verleende
      goedkeuringen;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22
  - number: 22.2.c
    text: |-
      als bedoeld in [artikel 22a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22a
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 22a
        hoofdstuk: III
        paragraaf: '2'
  - number: '22.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld betreffende de organisatie van de aanvrager, het proces
      volgens hetwelk de aanvrager zijn werkzaamheden verricht, het door de aanvrager voor de keuring ter beschikking
      stellen van voertuigen, systemen, onderdelen, technische eenheden, uitrustingstukken en voorzieningen ter
      bescherming van weggebruikers en passagiers, het door de aanvrager overleggen van bescheiden en verstrekken van
      inlichtingen ter zake van de keuring alsmede betreffende de wijze waarop de keuring wordt verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22
  - number: '22.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot in het kader van een
      typegoedkeuringsprocedure op basis van in het kader van de Europese Unie tot stand gekomen voorschriften op de
      Dienst Wegverkeer of de fabrikant van een voertuig, systeem, onderdeel, technische eenheid, uitrustingstuk of
      voorziening ter bescherming van weggebruikers en passagiers rustende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22
  - number: '22.5'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot op voertuigen, systemen, onderdelen,
      technische eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers, behorende
      tot een goedgekeurd type, aan te brengen keurmerken, aanduidingen of gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22
  - number: 22a.1
    text: |-
      Ter uitvoering van verdragen of van besluiten van volkenrechtelijke organisaties of van één of meer instellingen
      van de Europese Unie, al dan niet gezamenlijk, verleent de Dienst Wegverkeer op aanvraag en tegen betaling,
      op de door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door deze dienst vastgestelde tarief, een
      typegoedkeuring indien het voertuig, het systeem, het onderdeel, de technische eenheid, het uitrustingstuk of de
      voorziening ter bescherming van weggebruikers en passagiers, waarvoor de goedkeuring wordt gevraagd, bij een door
      de dienst verrichte keuring heeft voldaan aan de eisen van het bij ministeriële regeling bekendgemaakte besluit.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22a
  - number: 22a.2
    text: |-
      De [artikelen 22, derde lid][ref1], [23][ref2], [24][ref3] en [25][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel25
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '23'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '24'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
  - number: 22b.1
    text: |-
      De Dienst Wegverkeer kan met het oog op het verlenen van een typegoedkeuring als bedoeld in
      [artikel 22, eerste lid][ref1], op aanvraag een technische dienst aanwijzen om namens hem bepaalde voor goedkeuring
      noodzakelijke tests te verrichten, indien uit een door de Dienst Wegverkeer opgesteld beoordelingsverslag of uit
      een door een accrediteringsinstantie afgegeven accrediteringscertificaat blijkt dat deze dienst voldoet aan de
      daarvoor bij ministeriële regeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
  - number: 22b.2
    text: |-
      De Dienst Wegverkeer houdt toezicht op de op grond van het eerste lid aangewezen technische dienst. De aangewezen
      technische dienst is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het door de
      Dienst Wegverkeer ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22b
  - number: 22b.3
    text: |-
      Met een technische dienst wordt gelijk gesteld een technische dienst die beschikt over een beoordelingsverslag
      opgesteld door de daartoe bevoegde instantie in een andere lidstaat van de Europese Unie, een staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, dan wel over een
      accrediteringscertificaat afgegeven door een accrediteringsinstantie uit die andere lidstaat van de Europese Unie,
      een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, voor zover
      hieruit blijkt dat deze dienst voldoet aan eisen die tenminste gelijkwaardig zijn aan de in het eerste lid bedoelde
      eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22b
  - number: 22b.4
    text: De aanwijzing wordt ingetrokken indien de technische dienst die was aangewezen, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22b
  - number: 22b.5
    text: |-
      De Dienst Wegverkeer kan een aanwijzing intrekken indien de aangewezen technische dienst niet meer voldoet aan de
      voor de aanwijzing gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22b
  - number: 22b.6
    text: |-
      De Dienst Wegverkeer kan een aanwijzing schorsen voor een door hem daarbij vast te stellen termijn die ten hoogste
      twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22b
  - number: 22b.7
    text: |-
      Bij ministeriële regeling kunnen bepalingen worden gesteld ter uitvoering van dit artikel. Hierbij kunnen
      tevens regels worden gesteld omtrent het door de aanvrager overleggen van bescheiden of verstrekken van nadere
      inlichtingen, betreffende de wijze waarop toezicht wordt gehouden en de verplichting tot medewerking daaraan van
      degene die is aangewezen als technische dienst.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel22b
  - number: '23.1'
    text: |-
      De Dienst Wegverkeer houdt toezicht op het overeenstemmen van voertuigen, systemen, onderdelen, technische
      eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers, die doorgaan voor
      goedgekeurd, met het type waarvoor de goedkeuring is verleend. Tot dit toezicht kan behoren het steekproefsgewijs
      keuren van tot een type waarvoor de goedkeuring is verleend, behorende voertuigen, systemen, onderdelen, technische
      eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers. Voorts kan tot het
      toezicht behoren het periodiek controleren van de organisatie van degene aan wie de goedkeuring is verleend alsmede
      het proces volgens hetwelk hij zijn werkzaamheden verricht. Degene aan wie de goedkeuring is verleend, is gehouden
      aan voor het houden van het toezicht noodzakelijke werkzaamheden medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel23
  - number: '23.2'
    text: |-
      Degene aan wie een goedkeuring is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel23
  - number: '23.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop het toezicht wordt
      gehouden en de verplichting tot medewerking daaraan van degene aan wie een goedkeuring is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel23
  - number: 23a.1
    text: |-
      De Dienst Wegverkeer kan met het oog op de uitoefening van het toezicht als bedoeld in
      [artikel 23, eerste lid][ref1], op aanvraag een technische dienst aanwijzen om namens hem bepaalde toezichtstaken
      uit te voeren, indien uit een door de Dienst Wegverkeer opgesteld beoordelingsverslag of uit een door een
      accrediteringsinstantie afgegeven accrediteringscertificaat blijkt dat deze dienst voldoet aan de daarvoor bij
      ministeriële regeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel23
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '23'
        hoofdstuk: III
        paragraaf: '2'
  - number: 23a.2
    text: |-
      [Artikel 22b, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22b
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 22b
        hoofdstuk: III
        paragraaf: '2'
  - number: '24'
    text: Bij ministeriële regeling wordt bepaald wanneer een typegoedkeuring vervalt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel24
  - number: '25.1'
    text: |-
      De Dienst Wegverkeer trekt een typegoedkeuring in, indien degene aan wie de goedkeuring is verleend, daarom
      verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25
  - number: '25.2'
    text: 'De Dienst Wegverkeer kan een typegoedkeuring intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25
  - number: 25.2.a
    text: |-
      degene aan wie de goedkeuring is verleend een voertuig, systeem, onderdeel, technische eenheid, uitrustingstuk
      of voorziening ter bescherming van weggebruikers en passagiers doet of laat doorgaan voor goedgekeurd, terwijl
      dat voertuig, dat systeem, dat onderdeel, die technische eenheid, dat uitrustingstukken of die voorziening ter
      bescherming van weggebruikers en passagiers niet overeenstemt met het type waarvoor de goedkeuring is verleend,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25
  - number: 25.2.b
    text: |-
      degene aan wie de goedkeuring is verleend, de verplichting, vervat in [artikel 23, tweede lid][ref1], niet nakomt,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel23
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '23'
        hoofdstuk: III
        paragraaf: '2'
  - number: 25.2.c
    text: |-
      degene aan wie de goedkeuring is verleend, handelt in strijd met een of meer andere uit de goedkeuring
      voortvloeiende verplichtingen, of
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25
  - number: 25.2.d
    text: blijkt dat de goedkeuring ten onrechte is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25
  - number: 25a.1
    text: |-
      Een goedkeuring van een productieproces wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer
      vastgestelde wijze, van het daarvoor door deze dienst vastgestelde tarief door deze dienst verleend indien het
      productieproces van het voertuig, het systeem, het onderdeel, de technische eenheid, het uitrustingstuk of de
      voorziening ter bescherming van weggebruikers en passagiers, waarvoor de goedkeuring wordt gevraagd, bij een door
      de dienst verrichte keuring heeft voldaan aan de bij ministeriële regeling vastgestelde eisen met betrekking tot de
      toelating tot het verkeer op de weg. Deze eisen kunnen betrekking hebben op het proces volgens hetwelk de aanvrager
      zijn werkzaamheden met betrekking tot de productie van het voertuig, het systeem, het onderdeel, de technische
      eenheid, het uitrustingstuk of de voorziening ter bescherming van weggebruikers en passagiers verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25a
  - number: 25a.2
    text: |-
      Met een goedkeuring van een productieproces wordt gelijkgesteld een goedkeuring van productieprocessen van
      voertuigen en voertuigonderdelen:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25a
  - number: 25a.2.a
    text: |-
      die is verleend door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere Staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte en is verleend overeenkomstig de
      op het betrokken voertuig, systeem, onderdeel of de technische eenheid betrekking hebbende, in het kader van de
      Europese Unie tot stand gekomen voorschriften;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25a
  - number: 25a.2.b
    text: |-
      die is verleend door het daartoe bevoegde gezag in een Staat die partij is bij de Overeenkomst betreffende
      het aannemen van eenvormige technische voorschriften die van toepassing zijn op voertuigen op wielen,
      uitrustingsstukken en onderdelen die in een voertuig op wielen kunnen worden gemonteerd of gebruikt en is
      verleend overeenkomstig de voorwaarden voor wederzijdse erkenning van overeenkomstig deze voorschriften verleende
      goedkeuringen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25a
  - number: 25a.3
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld betreffende de organisatie van de aanvrager, het door
      de aanvrager voor de keuring ter beschikking stellen van voertuigen, systemen, onderdelen, technische eenheden,
      uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers, het door de aanvrager
      overleggen van bescheiden en verstrekken van inlichtingen ter zake van de keuring alsmede betreffende de wijze
      waarop de keuring van een productieproces wordt verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25a
  - number: 25a.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot op voertuigen, systemen, onderdelen,
      technische eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers, die zijn
      vervaardigd overeenkomstig het goedgekeurde productieproces, aan te brengen keurmerken, aanduidingen of gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25a
  - number: 25a1.1
    text: |-
      De Dienst Wegverkeer kan met het oog op het verlenen van een goedkeuring van een productieproces een technische
      dienst aanwijzen om namens hem bepaalde voor de goedkeuring noodzakelijke tests te verrichten, indien uit een
      door de Dienst Wegverkeer opgesteld beoordelingsverslag of uit een door een accrediteringsinstantie afgegeven
      accrediteringscertificaat blijkt dat deze dienst voldoet aan de daarvoor bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25a1
  - number: 25a1.2
    text: |-
      [Artikel 22b, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22b
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25a1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 22b
        hoofdstuk: III
        paragraaf: '2'
  - number: 25b.1
    text: |-
      De Dienst Wegverkeer houdt toezicht op het productieproces van voertuigen, systemen, onderdelen, technische
      eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers waarvoor de
      goedkeuring is verleend. Tot dit toezicht kan behoren het steekproefsgewijs of periodiek controleren van de
      organisatie van degene aan wie de goedkeuring is verleend alsmede van het productieproces. Degene aan wie de
      goedkeuring is verleend, is gehouden aan voor het houden van het toezicht noodzakelijke werkzaamheden medewerking
      te verlenen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25b
  - number: 25b.2
    text: |-
      Degene aan wie een goedkeuring is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25b
  - number: 25b.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop het toezicht wordt
      gehouden en de verplichting tot medewerking daaraan van degene aan wie een goedkeuring is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25b
  - number: 25b1.1
    text: |-
      De Dienst Wegverkeer kan met het oog op de uitoefening van het toezicht als bedoeld in
      [artikel 25b, eerste lid][ref1], op aanvraag een technische dienst aanwijzen om namens hem bepaalde toezichtstaken
      uit te voeren, indien uit een door de Dienst Wegverkeer opgesteld beoordelingsverslag of uit een door een
      accrediteringsinstantie afgegeven accrediteringscertificaat blijkt dat deze dienst voldoet aan de daarvoor bij
      ministeriële regeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel25b
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25b1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 25b
        hoofdstuk: III
        paragraaf: 2a
  - number: 25b1.2
    text: |-
      [Artikel 22b, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22b
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25b1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 22b
        hoofdstuk: III
        paragraaf: '2'
  - number: 25c
    text: Bij ministeriële regeling wordt bepaald wanneer een goedkeuring van een productieproces vervalt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25c
  - number: 25d.1
    text: |-
      De Dienst Wegverkeer trekt een goedkeuring van een productieproces in, indien degene aan wie de goedkeuring is
      verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25d
  - number: 25d.2
    text: 'De Dienst Wegverkeer kan een goedkeuring van een productieproces intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25d
  - number: 25d.2.a
    text: |-
      degene aan wie de goedkeuring is verleend een voertuig, systeem, onderdeel, technische eenheid, uitrustingstuk
      of voorziening ter bescherming van weggebruikers en passagiers doet of laat doorgaan voor vervaardigd volgens
      een goedgekeurd productieproces, terwijl dat voertuig, dat systeem, dat onderdeel, die technische eenheid,
      dat uitrustingsstuk of die voorziening ter bescherming van weggebruikers en passagiers niet is vervaardigd
      overeenkomstig het goedgekeurde productieproces,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25d
  - number: 25d.2.b
    text: |-
      degene aan wie de goedkeuring is verleend, de verplichting, vervat in [artikel 25b, tweede lid][ref1], niet nakomt,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel25b
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 25b
        hoofdstuk: III
        paragraaf: 2a
  - number: 25d.2.c
    text: |-
      degene aan wie de goedkeuring is verleend, handelt in strijd met een of meer andere uit de goedkeuring
      voortvloeiende verplichtingen, of
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25d
  - number: 25d.2.d
    text: blijkt dat de goedkeuring ten onrechte is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25d
  - number: 25e.1
    text: |-
      Wanneer een fabrikant reeds verkochte, geregistreerde of in het verkeer gebrachte voertuigen, dan
      wel reeds verkochte onderdelen of uitrustingsstukken, waarvoor een overeenkomstig in het kader van
      de Europese Unie tot stand gekomen voorschriften afgegeven typegoedkeuring is verleend, op grond van
      [artikel 21, tweede lid, van de Warenwet][ref1] dient terug te roepen omdat het voertuig een ernstig gevaar vormt
      voor de verkeersveiligheid, de volksgezondheid of het milieu, stelt de fabrikant de goedkeuringsinstantie die de
      typegoedkeuring heeft verleend hiervan onmiddellijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25e
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '21'
  - number: 25e.2
    text: |-
      De fabrikant stelt de goedkeuringsinstantie maatregelen voor om het in het eerste lid bedoelde gevaar te
      neutraliseren.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25e
  - number: 25e.3
    text: De Dienst Wegverkeer houdt toezicht op het terugroepen van voertuigen, onderdelen en uitrustingsstukken.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25e
  - number: 25e.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel25e
  - number: '26.1'
    text: |-
      Een goedkeuring voor een individueel voertuig wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer
      vastgestelde wijze, van het daarvoor door deze dienst vastgestelde tarief door deze dienst verleend indien het
      voertuig bij een door de dienst verrichte keuring heeft voldaan aan de bij ministeriële regeling vastgestelde eisen
      met betrekking tot de toelating tot het verkeer op de weg, welke eisen voor verschillende groepen van voertuigen
      verschillend kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel26
  - number: '26.2'
    text: |-
      [Artikel 22, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
  - number: 26a.1
    text: |-
      De Dienst Wegverkeer kan met het oog op het verlenen van een goedkeuring voor een individueel voertuig een
      technische dienst aanwijzen om namens hem bepaalde voor de goedkeuring noodzakelijke tests te verrichten, indien
      uit een door de Dienst Wegverkeer opgesteld beoordelingsverslag of uit een door een accrediteringsinstantie
      afgegeven accrediteringscertificaat blijkt dat deze dienst voldoet aan de daarvoor bij ministeriële regeling
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel26a
  - number: 26a.2
    text: |-
      [Artikel 22b, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22b
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 22b
        hoofdstuk: III
        paragraaf: '2'
  - number: '27'
    text: |-
      De in [artikel 22, eerste lid][ref1], of [26, eerste lid][ref2], bedoelde goedkeuring wordt eerst
      verleend indien het voertuig bij de keuring tevens heeft voldaan aan de eisen, gesteld krachtens de
      [Wet inzake de luchtverontreiniging][ref3] en de [Wet geluidhinder][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0002731
      [ref4]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002731
      - id: ref4
        bwb_id: BWBR0003227
  - number: '33.1'
    text: |-
      Het is de eigenaar of houder van een voertuig dat ingevolge [artikel 21, eerste lid][ref1], dient te zijn
      goedgekeurd voor toelating tot het verkeer op de weg verboden dit voertuig te laten staan op de weg of daarmee over
      de weg te rijden alsmede de bestuurder daarmee over de weg te laten rijden, indien het voertuig niet is goedgekeurd
      voor toelating tot het verkeer op de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: '33.2'
    text: |-
      Het eerste lid is niet van toepassing op een voertuig dat ingevolge [artikel 21, eerste lid][ref1], dient te zijn
      goedgekeurd voor toelating tot het verkeer op de weg, maar waarvoor een kentekenbewijs is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: '34.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden vastgesteld, inhoudende een verbod om voertuigen,
      voertuigonderdelen, uitrustingsstukken en voorzieningen ter bescherming van weggebruikers en passagiers, die niet
      ingevolge [artikel 22][ref1], [25a][ref2] of [26][ref3] zijn toegelaten tot het verkeer op de weg, te vervaardigen,
      in te voeren, in voorraad te hebben, te koop aan te bieden, af te leveren of te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel26
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 25a
        hoofdstuk: III
        paragraaf: 2a
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
  - number: '34.2'
    text: |-
      Ter uitvoering van verdragen of van besluiten van volkenrechtelijke organisaties of van één of meer instellingen
      van de Europese Unie, al dan niet gezamenlijk, worden de in het eerste lid bedoelde regels vastgesteld bij regeling
      van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel34
  - number: '34.3'
    text: |-
      De in het eerste lid bedoelde regels betreffen het aanwijzen van de categorie van voertuigen, voertuigonderdelen,
      uitrustingsstukken of voorzieningen ter bescherming van weggebruikers en passagiers, waarop het verbod betrekking
      heeft, de handelingen waarop het verbod betrekking heeft alsmede de uitzonderingen op het verbod.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel34
  - number: '35'
    text: |-
      Het is verboden een voertuig, systeem, onderdeel, technische eenheid, uitrustingstuk of voorziening ter bescherming
      van weggebruikers en passagiers, welk voertuig, systeem, onderdeel, technische eenheid, uitrustingstuk of
      voorziening ter bescherming van weggebruikers en passagiers niet ingevolge [artikel 22][ref1] of [26][ref2] is
      toegelaten, door het aanbrengen van een teken of tekens, het afgeven van een bewijs of bewijzen dan wel het doen
      van mededelingen te doen of laten doorgaan voor goedgekeurd voor zodanige toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel26
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
  - number: 35a
    text: |-
      In de ingevolge de [artikelen 21, eerste en derde lid][ref1], [22, eerste lid][ref2], [25a, eerste lid][ref3],
      [26, eerste lid][ref4], en [34, eerste lid][ref5], vastgestelde regels kan ter uitvoering van verdragen of van
      besluiten van volkenrechtelijke organisaties of van één of meer instellingen van de Europese Unie, al dan niet
      gezamenlijk, worden bepaald dat zij mede betrekking hebben op de goedkeuring van voertuigen, systemen, onderdelen,
      technische eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers voor
      gebruik buiten de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel25a
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel34
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 25a
        hoofdstuk: III
        paragraaf: 2a
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '34'
        hoofdstuk: III
        paragraaf: '5'
  - number: '36.1'
    text: |-
      Aan de eigenaar of houder van een motorrijtuig of een aanhangwagen op de weg dient overeenkomstig bij algemene
      maatregel van bestuur vastgestelde regels door de Dienst Wegverkeer een kenteken voor dat voertuig te zijn
      opgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel36
  - number: '36.2'
    text: |-
      Ter zake van de in het eerste lid bedoelde opgave dient overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels door de Dienst Wegverkeer een kentekenbewijs te zijn afgegeven aan de eigenaar of houder van
      het voertuig.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel36
  - number: '36.3'
    text: 'Het kentekenbewijs dient:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel36
  - number: 36.3.a
    text: te voldoen aan de bij ministeriële regeling vastgestelde eisen inzake inrichting en uitvoering,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel36
  - number: 36.3.b
    text: zijn geldigheid niet te hebben verloren,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel36
  - number: 36.3.c
    text: niet te zijn ingevorderd, en
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel36
  - number: 36.3.d
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel36
  - number: '36.5'
    text: |-
      Motorrijtuigen en aanhangwagens dienen overeen te komen met de gegevens in het voor het betrokken voertuig
      afgegeven kentekenbewijs en met de gegevens die omtrent het voertuig zijn opgenomen in het kentekenregister, tenzij
      krachtens [artikel 71][ref1] een bepaalde afwijking van die gegevens is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
  - number: '36.6'
    text: 'Voor overtreding van het eerste tot en met vijfde lid zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel36
  - number: 36.6.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder die het motorrijtuig op de weg laat staan of daarmee
      over de weg laat rijden, alsmede in het geval dat met dat motorrijtuig over de weg wordt gereden, de bestuurder, en
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel36
  - number: 36.6.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder die de aanhangwagen op de weg laat staan of deze met
      een motorrijtuig over de weg laat voortbewegen, alsmede in het geval dat de aanhangwagen met een motorrijtuig over
      de weg wordt voortbewogen, de bestuurder van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel36
  - number: '36.7'
    text: |-
      De in het derde lid, onderdeel *a*, bedoelde eisen kunnen mede dienstbaar zijn aan de heffing van de belasting van
      personenauto’s en motorrijwielen en van de motorrijtuigenbelasting. Op het kentekenbewijs wordt in ieder geval het
      verschuldigde bedrag van de belasting van personenauto’s en motorrijwielen vermeld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel36
  - number: '36.8'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel36
  - number: '37.1'
    text: |-
      [Artikel 36][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 37.1.a
    text: 'de volgende categorieën motorrijtuigen alsmede de door die motorrijtuigen voortbewogen aanhangwagens:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
  - number: 37.1.a.1°
    text: |-
      bij algemene maatregel van bestuur vastgestelde categorieën bromfietsen, alsmede bromfietsen in het internationaal
      verkeer, afkomstig uit een land waar voor deze voertuigen geen kenteken is opgegeven,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
  - number: 37.1.a.2°
    text: landbouw- of bosbouwtrekkers,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
  - number: 37.1.a.3°
    text: gehandicaptenvoertuigen en
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
  - number: 37.1.a.4°
    text: motorrijtuigen met beperkte snelheid;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
  - number: 37.1.b
    text: |-
      in het buitenland geregistreerde motorrijtuigen en aanhangwagens, die zich in het internationaal verkeer bevinden,
      mits ter zake van de registratie van het betrokken voertuig door het daartoe bevoegde gezag in het buitenland een
      bewijs is afgegeven dat voldoet aan de daaraan gestelde eisen in de tussen Nederland en het betrokken land van
      kracht zijnde internationale overeenkomst en het betrokken voertuig voldoet aan de eisen die in die overeenkomst
      dan wel bij algemene maatregel van bestuur ter uitvoering van die overeenkomst aan dat voertuig worden gesteld met
      betrekking tot de toelating tot het internationaal verkeer;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
  - number: 37.1.c
    text: |-
      motorrijtuigen en aanhangwagens, mits wordt voldaan aan nadere bij ministeriële regeling vast te stellen regels,
      die in eigendom toebehoren aan of worden gehouden door:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
  - number: 37.1.c.1°
    text: |-
      leden van een bij ministeriële regeling aangewezen krijgsmacht of civiele dienst in de zin van artikel I van het
      op 19 juni 1951 te Londen gesloten Verdrag tussen de landen die partij zijn bij het Noord-Atlantisch Verdrag nopens
      de rechtspositie van hun krijgsmachten (Trb. 1953, 10), dan wel in de zin van artikel 3 van het bij evenbedoeld
      verdrag behorende, op 28 augustus 1952 te Parijs gesloten, protocol nopens de rechtspositie van internationale
      militaire hoofdkwartieren ingesteld uit hoofde van het Noord-Atlantisch Verdrag (Trb. 1953, 11), alsmede
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
  - number: 37.1.c.2°
    text: |-
      functionarissen van de Noord-Atlantische Verdragsorganisatie die in Nederland zijn op grond van de briefwisseling
      tussen de regering van het Koninkrijk der Nederlanden en de Noord-Atlantische Verdragsorganisatie van 31 augustus
      en 11 september 1979 (Trb.1979, 159) en op wie het Verdrag nopens de rechtspositie van de Noord-Atlantische
      Verdragsorganisatie, van de nationale vertegenwoordigers bij haar organen en van haar internationale staf
      (Trb.1951, 139), van toepassing is.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
  - number: '37.2'
    text: |-
      Voor aanhangwagens met een toegestane maximum massa van niet meer dan 750 kg alsmede voor aanhangwagens met een
      toegestane maximum massa van meer dan 750 kg, afkomstig uit een land waar voor deze aanhangwagens geen afzonderlijk
      kenteken is opgegeven, geldt het vereiste dat een kenteken dient te zijn opgegeven niet. Indien een dergelijke
      aanhangwagen is verbonden met een in Nederland geregistreerd motorrijtuig, dient die aanhangwagen te zijn voorzien
      van het kenteken dat is opgegeven voor dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
  - number: '37.3'
    text: |-
      Voor motorrijtuigen en aanhangwagens, die behoren tot de bedrijfsvoorraad van een natuurlijke persoon of
      rechtspersoon aan wie een erkenning als bedoeld in [artikel 62][ref1] is verleend of die voor herstel of bewerking
      ter beschikking zijn gesteld van een natuurlijke persoon of rechtspersoon, geldt het vereiste dat een kenteken
      voor een bepaald voertuig dient te zijn opgegeven niet, mits overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels gebruik wordt gemaakt van een bij algemene maatregel van bestuur aangewezen, door de Dienst
      Wegverkeer aan die natuurlijke persoon of rechtspersoon dan wel aan een natuurlijke persoon of rechtspersoon aan
      wie een erkenning als bedoeld in [artikel 62][ref2] is verleend en die het voertuig ten behoeve van eerstbedoelde
      natuurlijke persoon of rechtspersoon ten verkoop voorhanden heeft, opgegeven kenteken. De Dienst Wegverkeer kan aan
      deze opgaven voorschriften verbinden. Bij ministeriële regeling kunnen met betrekking tot die voorschriften regels
      worden vastgesteld. Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen het gebruik van een
      zodanig kenteken verplicht is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '37.4'
    text: |-
      Met het toezicht op de naleving van de uit het derde lid voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de Staatscourant. Het toezicht heeft in ieder geval betrekking op het gebruik van het in het derde lid bedoelde
      kenteken. De aldaar bedoelde natuurlijke persoon of rechtspersoon is gehouden tot betaling, op de door de Dienst
      Wegverkeer vastgestelde wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde
      tarief. Bij ministeriële regeling worden nadere regels omtrent het toezicht vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
  - number: '37.5'
    text: 'Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
  - number: 37.5.a
    text: |-
      in bepaalde uitzonderingsgevallen tijdelijk wordt of kan worden afgeweken van het in
      [artikel 36, derde lid, onderdeel b of c][ref1], bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 37.5.b
    text: |-
      een motorrijtuig of een aanhangwagen op de weg mag staan, indien het voor het betrokken voertuig afgegeven
      kentekenbewijs ongeldig is verklaard ingevolge [artikel 58, tweede lid, onderdeel b, c, d of f][ref1], dan wel is
      ingevorderd overeenkomstig [artikel 60][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '58'
        hoofdstuk: IV
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '60'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '37.6'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de omschrijving van de in het eerste
      lid, onderdeel a, bedoelde categorieën voertuigen alsmede de voor die categorieën vastgestelde maximumsnelheid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
  - number: '37.7'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het derde lid en kunnen nadere regels
      worden vastgesteld ter uitvoering van het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel37
  - number: '38.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat bepaalde categorieën van kentekens slechts worden
      opgegeven aan bij die algemene maatregel van bestuur aan te wijzen personen of groepen van personen dan wel voor
      daarbij aan te wijzen voertuigen of groepen van voertuigen, zulks onder daarbij te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel38
  - number: '38.2'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel38
  - number: '40.1'
    text: Het kenteken dient behoorlijk zichtbaar op of aan het motorrijtuig of de aanhangwagen aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel40
  - number: '40.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de inrichting, het aanbrengen en
      de verlichting van het kenteken en worden regels vastgesteld omtrent de kentekenplaat en de onderdelen daarvan,
      alsmede de daarop aan te brengen merken.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel40
  - number: '40.3'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het bepaalde krachtens het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel40
  - number: '40.4'
    text: 'Voor overtreding van het eerste lid dan wel het bepaalde krachtens het tweede of derde lid zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel40
  - number: 40.4.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder die het motorrijtuig op de weg laat staan of daarmee
      over de weg laat rijden, alsmede in het geval dat met dat motorrijtuig over de weg wordt gereden, de bestuurder, en
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel40
  - number: 40.4.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder die de aanhangwagen op de weg laat staan of deze met
      een motorrijtuig over de weg laat voortbewegen, alsmede in het geval dat de aanhangwagen met een motorrijtuig over
      de weg wordt voortbewogen, de bestuurder van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel40
  - number: '41.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel41
  - number: 41.1.a
    text: |-
      op een motorrijtuig of een aanhangwagen enig teken of middel aan te brengen of te doen aanbrengen met het oogmerk
      de herkenning, daaronder begrepen de herkenning met behulp van technische voorzieningen, van het ingevolge
      [artikel 40][ref1] gevoerde kenteken te bemoeilijken;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 41.1.b
    text: |-
      een motorrijtuig op de weg te laten staan of daarmee over de weg te rijden dan wel een aanhangwagen op de weg te
      laten staan of met een motorrijtuig over de weg voort te bewegen, wanneer op dat motorrijtuig of die aanhangwagen
      enig teken of middel is aangebracht, waardoor de herkenning, daaronder begrepen de herkenning met behulp van
      technische voorzieningen, van het ingevolge [artikel 40][ref1] gevoerde kenteken wordt bemoeilijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 41.1.c
    text: |-
      op een motorrijtuig of een aanhangwagen een teken, niet zijnde een ingevolge [artikel 36][ref1] aan de eigenaar of
      houder voor dat motorrijtuig of die aanhangwagen opgegeven kenteken, aan te brengen of te doen aanbrengen met het
      oogmerk dat teken te doen doorgaan voor een zodanig kenteken dan wel met de kennelijke bedoeling dat teken te doen
      doorgaan voor een overeenkomstig de daarvoor geldende voorschriften opgegeven buitenlands kenteken dan wel een met
      toepassing van [artikel 37, derde lid][ref2], opgegeven kenteken;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 41.1.d
    text: |-
      een motorrijtuig op de weg te laten staan of daarmee over de weg te rijden dan wel een aanhangwagen op de weg te
      laten staan of met een motorrijtuig over de weg voort te bewegen, wanneer op dat motorrijtuig of die aanhangwagen
      een teken is aangebracht dat, niet zijnde een ingevolge [artikel 36][ref1] aan de eigenaar of houder voor dat
      motorrijtuig of die aanhangwagen opgegeven kenteken, door kan gaan voor een zodanig kenteken dan wel voor een
      overeenkomstig de daarvoor geldende voorschriften opgegeven buitenlands kenteken of een met toepassing van
      [artikel 37, derde lid][ref2], opgegeven kenteken;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 41.1.e
    text: |-
      op een in het buitenland geregistreerd motorrijtuig of een in het buitenland geregistreerde aanhangwagen een teken,
      niet zijnde een aldaar voor dat voertuig of aan de eigenaar of houder daarvan opgegeven kenteken, aan te brengen of
      te doen aanbrengen met het oogmerk dat teken te doen doorgaan voor een zodanig kenteken;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel41
  - number: 41.1.f
    text: |-
      een in het buitenland geregistreerd motorrijtuig op de weg te laten staan of daarmee over de weg te rijden dan
      wel een in het buitenland geregistreerde aanhangwagen op de weg te laten staan of met een motorrijtuig over de weg
      voort te bewegen, wanneer op dat motorrijtuig of die aanhangwagen een teken is aangebracht dat, niet zijnde een in
      het buitenland voor dat voertuig of aan de eigenaar of houder daarvan opgegeven kenteken, door kan gaan voor een
      zodanig kenteken.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel41
  - number: '41.2'
    text: 'Voor overtreding van het eerste lid, onderdelen b, d en f, zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel41
  - number: 41.2.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder die het motorrijtuig op de weg laat staan of daarmee
      over de weg laat rijden, alsmede in het geval dat met dat motorrijtuig over de weg wordt gereden, de bestuurder,
      een en ander echter slechts indien de eigenaar, houder of bestuurder weet of redelijkerwijze kan vermoeden dat op
      het motorrijtuig een teken of middel als bedoeld in het eerste lid, onderdeel b, dan wel een teken als bedoeld in
      het eerste lid, onderdeel d of f, is aangebracht, en
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel41
  - number: 41.2.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder die de aanhangwagen op de weg laat staan of deze
      met een motorrijtuig over de weg laat voortbewegen, alsmede in het geval dat de aanhangwagen met een motorrijtuig
      over de weg wordt voortbewogen, de bestuurder van dat motorrijtuig, een en ander echter slechts indien de eigenaar,
      houder of bestuurder weet of redelijkerwijze kan vermoeden dat op de aanhangwagen een teken of middel als bedoeld
      in het eerste lid, onderdeel b, dan wel een teken als bedoeld in het eerste lid, onderdeel d of f, is aangebracht.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel41
  - number: 41a.1
    text: 'Voor de toepassing van deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel41a
  - number: 41a.1.a
    text: |-
      overheidsorgaan: bestuursorgaan als bedoeld in
      [artikel 1:1, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1] en personen of instanties als
      bedoeld in het tweede lid;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 41a.1.b
    text: 'basisregistratie: verzameling gegevens waarvan bij wet is bepaald dat deze authentieke gegevens bevat;'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel41a
  - number: 41a.1.c
    text: |-
      authentiek gegeven: in een basisregistratie opgenomen gegeven dat bij of krachtens wet als authentiek is
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel41a
  - number: 41a.2
    text: |-
      Bij besluit van Onze Minister kunnen personen of instanties die een publieke taak uitoefenen worden aangewezen
      als overheidsorgaan, voor zover dit met het oog op hun publieke-taakuitoefening naar het oordeel van Onze Minister
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel41a
  - number: '42.1'
    text: Er is een kentekenregister. Dit register is een basisregistratie.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42
  - number: '42.2'
    text: |-
      De Dienst Wegverkeer is de beheerder van het kentekenregister en verantwoordelijke als bedoeld in de
      [Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '42.3'
    text: |-
      In het kentekenregister verwerkt de Dienst Wegverkeer gegevens omtrent motorrijtuigen en aanhangwagens waarvoor
      een kenteken is opgegeven en de tenaamstelling van die kentekens, alsmede omtrent andere motorrijtuigen en
      aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42
  - number: '42.4'
    text: 'Het verzamelen van de gegevens, bedoeld in het derde lid, geschiedt voor de volgende doeleinden:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42
  - number: 42.4.a
    text: |-
      voor een goede uitvoering van het bepaalde bij of krachtens deze wet en voor de handhaving van de bij of krachtens
      deze wet gestelde voorschriften,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42
  - number: 42.4.b
    text: |-
      voor een goede uitvoering van het bepaalde bij of krachtens de [Wet op de motorrijtuigenbelasting 1994][ref1],
      de [Wet op de belasting van personenauto’s en motorrijwielen 1992][ref2], de
      [Wet belasting zware motorrijtuigen][ref3], de [Wet aansprakelijkheidsverzekering motorrijtuigen][ref4], de
      [Wet bereikbaarheid en mobiliteit][ref5], dan wel andere wettelijke regelingen ten aanzien van motorrijtuigen of
      aanhangwagens en voor de handhaving van het bepaalde bij of krachtens die wettelijke regelingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0006324
      [ref2]: https://wetten.overheid.nl/BWBR0005806
      [ref3]: https://wetten.overheid.nl/BWBR0007678
      [ref4]: https://wetten.overheid.nl/BWBR0002415
      [ref5]: https://wetten.overheid.nl/BWBR0013854
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006324
      - id: ref2
        bwb_id: BWBR0005806
      - id: ref3
        bwb_id: BWBR0007678
      - id: ref4
        bwb_id: BWBR0002415
      - id: ref5
        bwb_id: BWBR0013854
  - number: 42.4.c
    text: |-
      om overheidsorganen te voorzien van gegevens uit het kentekenregister voor zover zij aangeven deze gegevens nodig
      te hebben voor een goede uitoefening van hun publieke taak.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42
  - number: '42.5'
    text: |-
      De Dienst Wegverkeer mag strafrechtelijke persoonsgegevens en persoonsgegevens ter vaststelling van mogelijk
      strafbaar gedrag verwerken voor zover dit verband houdt met de in het vierde lid, onderdelen a en b, genoemde
      doeleinden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42
  - number: '42.6'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de inrichting en het beheer van het
      kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42
  - number: 42a.1
    text: 'De gegevens in het kentekenregister worden onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42a
  - number: 42a.1.a
    text: authentieke en niet-authentieke gegevens;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42a
  - number: 42a.1.b
    text: gevoelige en niet-gevoelige gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42a
  - number: 42a.2
    text: 'Als authentieke gegevens worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42a
  - number: 42a.2.a
    text: |-
      gegevens die op grond van een bindend besluit van de Raad van de Europese Unie, van het Europees Parlement en de
      Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen verplicht op het kentekenbewijs zijn opgenomen
      voor zover de desbetreffende gegevens niet reeds op grond van een andere wettelijke bepaling als authentiek zijn
      aangemerkt;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42a
  - number: 42a.2.b
    text: |-
      de voertuigcategorieën genoemd in [artikel 21, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: 42a.2.c
    text: de tenaamstelling van een motorrijtuig of aanhangwagen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42a
  - number: 42a.3
    text: |-
      Bij algemene maatregel van bestuur kunnen andere authentieke gegevens of categorieën daarvan worden aangewezen. Bij
      algemene maatregel van bestuur kan tevens als authentiek worden aangewezen de samenstelling van een uit een andere
      basisregistratie afkomstig gegeven met een of meer gegevens uit het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42a
  - number: 42a.4
    text: Bij algemene maatregel van bestuur worden gevoelige en niet-gevoelige gegevens of categorieën daarvan aangewezen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel42a
  - number: '43.1'
    text: |-
      De Dienst Wegverkeer verstrekt uit het kentekenregister gegevens aan overheidsorganen, voor zover zij aangeven deze
      gegevens nodig te hebben voor een goede uitoefening van hun publieke taak.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43
  - number: '43.2'
    text: |-
      De Dienst Wegverkeer verstrekt uit het kentekenregister gegevens aan autoriteiten buiten Nederland en instellingen
      van volkenrechtelijke organisaties in bij of krachtens algemene maatregel van bestuur te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43
  - number: '43.3'
    text: |-
      De Dienst Wegverkeer kan in bij of krachtens algemene maatregel van bestuur te bepalen gevallen gevoelige gegevens
      uit het kentekenregister verstrekken aan andere personen en instanties dan bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43
  - number: '43.4'
    text: Niet-gevoelige gegevens kunnen aan een ieder worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43
  - number: '43.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de
      verstrekkingen als bedoeld in het eerste tot en met vierde lid. Deze verstrekkingen geschieden op aanvraag en op
      een door de Dienst Wegverkeer te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43
  - number: '43.6'
    text: |-
      Onverminderd het vijfde lid geschiedt de verstrekking van gegevens, als bedoeld in het derde en vierde lid, tegen
      betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het voor de behandeling van de aanvraag door deze
      dienst vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43
  - number: '43.7'
    text: |-
      Onverminderd het zesde lid is degene die op grond van het eerste tot en met vierde lid een aanvraag tot
      verstrekking van gegevens indient, in door de Dienst Wegverkeer te bepalen gevallen, een door deze dienst te
      bepalen aansluittarief verschuldigd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43
  - number: 43a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het gebruik van de
      ingevolge [artikel 43, derde lid][ref1], verstrekte gegevens. Daarbij kunnen beperkingen aan het gebruik van de
      verstrekte gegevens worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 43b.1
    text: |-
      Een overheidsorgaan dat bij de vervulling van zijn publieke taak een gegeven nodig heeft dat bij of krachtens deze
      wet als authentiek gegeven is aangewezen en in het kentekenregister is opgenomen, maakt gebruik van dat gegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43b
  - number: 43b.2
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43b
  - number: 43b.2.a
    text: |-
      het overheidsorgaan ten aanzien van het betreffende gegeven een melding heeft gedaan als bedoeld in
      [artikel 43c, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43c
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 43c
        hoofdstuk: IV
        paragraaf: '3'
  - number: 43b.2.b
    text: |-
      bij het betreffende gegeven een aantekening is geplaatst als bedoeld in [artikel 43c, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43c
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 43c
        hoofdstuk: IV
        paragraaf: '3'
  - number: 43b.2.c
    text: bij wettelijk voorschrift anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43b
  - number: 43b.2.d
    text: |-
      een goede vervulling van de publieke taak van het overheidsorgaan door de onverkorte toepassing van het eerste lid
      wordt belet.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43b
  - number: 43b.3
    text: |-
      Een natuurlijke persoon of rechtspersoon aan wie door een overheidsorgaan een gegeven wordt gevraagd, waarop het
      eerste lid van toepassing is, behoeft dat gegeven niet mede te delen, behoudens voor zover het gegeven noodzakelijk
      wordt geacht voor een deugdelijke vaststelling van de identiteit van betrokkene of van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43b
  - number: 43c.1
    text: |-
      Een overheidsorgaan dat gerede twijfel heeft over de juistheid van een in het kentekenregister opgenomen authentiek
      gegeven, meldt die twijfel, onder opgave van redenen, aan de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43c
  - number: 43c.2
    text: |-
      Indien een melding als bedoeld in het eerste lid betrekking heeft op een gegeven dat afkomstig is uit een andere
      basisregistratie zendt de Dienst Wegverkeer de melding door aan de beheerder van dat register, tenzij met het
      overheidsorgaan dat een melding als bedoeld in het eerste lid doet is afgesproken dat dit overheidsorgaan de
      melding rechtstreeks doet aan de beheerder van het register waaruit het authentieke gegeven afkomstig is.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43c
  - number: 43c.3
    text: |-
      De Dienst Wegverkeer tekent na ontvangst van een melding als bedoeld in het eerste lid, op de door deze dienst te
      bepalen wijze, in het kentekenregister aan dat het desbetreffende gegeven «in onderzoek» is, tenzij het een melding
      betreft die op grond van het tweede lid wordt doorgezonden aan de beheerder van een andere basisregistratie.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43c
  - number: 43c.4
    text: |-
      Indien een melding als bedoeld in het eerste lid betrekking heeft op een gegeven dat bij of krachtens deze wet als
      authentiek is aangewezen, besluit de Dienst Wegverkeer over wijziging van het gegeven en bericht deze dienst het
      overheidsorgaan dat de melding heeft gedaan onverwijld over deze beslissing.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43c
  - number: 43c.5
    text: |-
      Indien het besluit, bedoeld in het vierde lid, leidt tot wijziging van het authentieke gegeven doet de Dienst
      Wegverkeer onverwijld mededeling aan degene op wie het authentieke gegeven betrekking heeft, dan wel aan degene aan
      wie het kentekenbewijs is afgegeven voor het motorrijtuig of de aanhangwagen waarop het desbetreffende authentieke
      gegeven betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43c
  - number: 43c.6
    text: |-
      De Dienst Wegverkeer verwijdert de aantekening dat een gegeven in onderzoek is wanneer het besluit omtrent
      wijziging onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43c
  - number: 43c.7
    text: Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43c
  - number: 43d.1
    text: |-
      Indien de Dienst Wegverkeer constateert dat een door deze dienst in het kentekenregister geplaatst gegeven onjuist
      of ten onrechte in het kentekenregister is opgenomen, wijzigt of verwijdert deze dienst dat gegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43d
  - number: 43d.2
    text: |-
      Indien de Dienst Wegverkeer constateert dat een gegeven ten onrechte niet in het kentekenregister is opgenomen,
      neemt deze dienst dat gegeven alsnog in het kentekenregister op.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43d
  - number: 43d.3
    text: |-
      Van de beslissing tot wijzigen, verwijderen, dan wel alsnog opnemen van een authentiek gegeven in het
      kentekenregister doet de Dienst Wegverkeer onverwijld mededeling aan degene op wie het authentieke gegeven
      betrekking heeft, dan wel aan degene aan wie het kentekenbewijs is afgegeven voor het motorrijtuig of de
      aanhangwagen waarop het desbetreffende authentieke gegeven betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43d
  - number: 43e.1
    text: |-
      Indien een belanghebbende gegronde redenen heeft om aan te nemen dat een gegeven dat bij of krachtens deze wet als
      authentiek is aangemerkt of een niet-authentiek gegeven onjuist of ten onrechte wel, dan wel ten onrechte niet in
      het kentekenregister is opgenomen, kan hij onder opgave van die redenen aan de Dienst Wegverkeer een verzoek doen
      tot wijziging, verwijdering of opneming van dat gegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43e
  - number: 43e.2
    text: |-
      De Dienst Wegverkeer beslist naar aanleiding van een verzoek als bedoeld in het eerste lid over wijziging,
      verwijdering of opneming van het betreffende gegeven en bericht de belanghebbende die het verzoek heeft gedaan over
      deze beslissing.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43e
  - number: 43f
    text: |-
      Onverminderd [artikel 43c][ref1] zijn overheidsorganen gehouden om aan de Dienst Wegverkeer op de door deze dienst
      te bepalen wijze mededeling te doen van de hen in de uitoefening van hun functie ter kennis gekomen feiten, ingeval
      deze feiten aanleiding kunnen zijn om tot wijziging of aanvulling van de in het kentekenregister opgenomen gegevens
      over te gaan, dan wel anderszins van belang kunnen zijn voor de juistheid van deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43c
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel43f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 43c
        hoofdstuk: IV
        paragraaf: '3'
  - number: '44.1'
    text: |-
      De Dienst Wegverkeer neemt maatregelen met het oog op het waarborgen van de juistheid, de actualiteit en de
      volledigheid van het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel44
  - number: '44.2'
    text: |-
      De Dienst Wegverkeer laat ten minste eenmaal in de drie jaar een registeraccountant,
      dan wel een accountant die is ingeschreven in het register bedoeld in
      [artikel 36, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref1], een oordeel geven over de
      opzet en werking van het stelsel van interne beheersmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
  - number: '44.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitvoering van het eerste
      en tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel44
  - number: '45'
    text: |-
      De Dienst Wegverkeer stelt ten aanzien van het verwerken van gegevens als bedoeld in [artikel 42][ref1] een
      reglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel42
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '42'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 45a.1
    text: |-
      Met het toezicht op het gebruik van uit het kentekenregister verstrekte gegevens zijn belast de bij besluit van
      de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel45a
  - number: 45a.2
    text: |-
      Indien de Dienst Wegverkeer gerede twijfel heeft over de juistheid van een gegeven uit het kentekenregister dat
      betrekking heeft op een motorrijtuig of aanhangwagen, kan deze dienst degene aan wie het kentekenbewijs voor het
      betreffende motorrijtuig of aanhangwagen is afgegeven gelasten dat voertuig ter inspectie aan de Dienst Wegverkeer
      ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel45a
  - number: 45a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald in welke gevallen door de Dienst Wegverkeer een
      door deze dienst vastgesteld tarief ter zake van de kosten van toezicht als bedoeld in het eerste lid of van de
      inspectie bedoeld in het tweede lid in rekening wordt gebracht. Dit tarief wordt op door de Dienst Wegverkeer te
      bepalen wijze in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel45a
  - number: 45a.4
    text: |-
      Verstrekking van gegevens uit het kentekenregister kan achterwege worden gelaten indien naar het oordeel van de
      Dienst Wegverkeer sprake is van handelen in strijd met de doeleinden waarvoor dan wel de voorwaarden waaronder
      is verstrekt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel45a
  - number: '46.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld betreffende de met de registratie van kentekens
      samenhangende verplichtingen van degene:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel46
  - number: 46.1.a
    text: |-
      die de eigendom, het bezit of het houderschap van een motorrijtuig of een aanhangwagen, waarvoor nog geen kenteken
      is opgegeven, heeft verkregen;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel46
  - number: 46.1.b
    text: aan wie een kenteken is opgegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel46
  - number: 46.1.c
    text: |-
      die de eigendom, het bezit of het houderschap van een motorrijtuig of een aanhangwagen, waarvoor een kenteken is
      opgegeven, heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel46
  - number: '46.2'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel46
  - number: '47'
    text: Een kentekenbewijs bestaat uit een of meer bij algemene maatregel van bestuur aan te wijzen delen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel47
  - number: '48.1'
    text: |-
      Een kentekenbewijs wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief slechts afgegeven aan in Nederland woonachtige natuurlijke personen
      die de leeftijd van achttien jaren dan wel, indien de aanvraag betrekking heeft op een kentekenbewijs voor een
      bromfiets, de leeftijd van zestien jaren hebben bereikt en aan in Nederland gevestigde rechtspersonen, indien het
      motorrijtuig of de aanhangwagen waarvoor de afgifte wordt verlangd, overeenkomstig [artikel 22][ref1] of [26][ref2]
      is goedgekeurd voor toelating tot het verkeer op de weg en, indien na die toelating wijziging is aangebracht in
      de bouw of inrichting van dat voertuig, die wijziging, behoudens in het geval dat geen goedkeuring is vereist,
      overeenkomstig [artikel 99, eerste lid][ref3], of [100, eerste lid][ref4], is goedgekeurd voor toelating van het
      gewijzigde voertuig tot het verkeer op de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel99
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel100
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '99'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '100'
        hoofdstuk: V
        paragraaf: '8'
  - number: '48.2'
    text: |-
      In bepaalde uitzonderingsgevallen kan door de Dienst Wegverkeer een kentekenbewijs worden afgegeven, indien ten
      aanzien van het motorrijtuig of de aanhangwagen, waarvoor de afgifte wordt verlangd, niet is voldaan aan het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel48
  - number: '48.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de ingevolge het eerste lid gestelde eisen aan de
      aanvrager van een kentekenbewijs niet gelden ten aanzien van de aanvrager van een kentekenbewijs, afgegeven ter
      zake van de opgave van een kenteken als bedoeld in [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel38
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '48.4'
    text: |-
      Indien een kentekenbewijs is afgegeven aan een in Nederland gevestigde rechtspersoon die niet behoeft te zijn
      ingeschreven in een daartoe bij de wet aangewezen register of waarvan de onderneming niet behoeft te zijn
      ingeschreven in het handelsregister, wordt degene die bij de aanvraag als gemachtigde van die rechtspersoon is
      opgetreden, voor de toepassing van het bepaalde bij of krachtens deze wet mede als houder van het motorrijtuig of
      de aanhangwagen aangemerkt in de zin van [artikel 1, eerste lid, onderdeel o][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
        hoofdstuk: '1'
  - number: '48.5'
    text: |-
      De in het vierde lid bedoelde gemachtigde dient in Nederland woonachtig te zijn en dient de leeftijd van achttien
      jaren te hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel48
  - number: '48.6'
    text: |-
      Ingeval de aanvrager van een kentekenbewijs voor een bromfiets de leeftijd heeft van zestien of zeventien jaar,
      wordt voor wat betreft de aanvraag de toestemming van diens wettelijke vertegenwoordiger verondersteld te zijn
      verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel48
  - number: 48a
    text: |-
      De Dienst Wegverkeer brengt aantekeningen aan op dan wel verwijdert aantekeningen van het kentekenbewijs voor zover
      dat bij of krachtens deze wet is voorgeschreven of mogelijk wordt gemaakt, dan wel voor de goede uitvoering van
      deze wet wenselijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel48a
  - number: '49.1'
    text: |-
      Onverminderd [artikel 48, eerste lid][ref1], wordt de afgifte van een kentekenbewijs geweigerd:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 49.1.a
    text: |-
      indien bij een ingevolge [hoofdstuk V][ref1] verrichte keuring blijkt dat de op het voertuig aangebrachte gegevens
      op onrechtmatige wijze in overeenstemming zijn gebracht met de op het overgelegde kentekenbewijs vermelde gegevens,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: V
  - number: 49.1.b
    text: indien blijkt dat de ter zake van het voertuig verschuldigde belastingen en rechten niet zijn voldaan, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel49
  - number: 49.1.c
    text: |-
      indien blijkt dat de krachtens een algemeen verbindend verklaarde overeenkomst op grond van de
      [Wet milieubeheer][ref1] verschuldigde afvalbeheersbijdrage voor autowrakken niet is voldaan, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 49.1.d
    text: |-
      in overige bij algemene maatregel van bestuur te bepalen gevallen overeenkomstig de bij die algemene maatregel
      vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel49
  - number: '49.2'
    text: 'De afgifte van een kentekenbewijs kan worden geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel49
  - number: 49.2.a
    text: |-
      voor het motorrijtuig of de aanhangwagen waarvoor de afgifte wordt verlangd, op grond van het bij of krachtens deze
      wet bepaalde geen kenteken behoeft te zijn opgegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel49
  - number: 49.2.b
    text: |-
      uit het kentekenregister blijkt dat de eigenaar of houder van een motorrijtuig of een aanhangwagen onvrijwillig de
      beschikkingsmacht over dat voertuig heeft verloren.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel49
  - number: '50.1'
    text: |-
      De aanvrager van een kentekenbewijs dient persoonlijk te verschijnen bij een bij ministeriële regeling aan te
      wijzen instantie, tenzij:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel50
  - number: 50.1.a
    text: |-
      de aanvraag namens hem wordt ingediend door degene aan wie door de Dienst Wegverkeer een erkenning als bedoeld in
      [artikel 62][ref1] is verleend dan wel, indien dit een rechtspersoon is, door diens gemachtigde, en deze voldoende
      zekerheid heeft verkregen over de identiteit van de aanvrager. Daartoe legt de aanvrager een document als bedoeld
      in [artikel 2, eerste lid, van de Paspoortwet][ref2], een geldig rijbewijs als bedoeld in [artikel 107][ref3]
      dan wel een rijbewijs als bedoeld in [artikel 108, eerste lid, onderdeel ][ref4] voor zover de aldaar bedoelde
      registratie heeft plaatsgevonden, over. Degene die namens de aanvrager de aanvraag indient, legt bij de bij
      ministeriële regeling aan te wijzen instantie het document bedoeld in de tweede volzin over, alsmede de volmacht en
      het bewijs dat aan hem een erkenning als bedoeld in [artikel 62][ref5] is verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel107
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel108
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '107'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '108'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 50.1.b
    text: |-
      volgens bij algemene maatregel van bestuur vast te stellen regels op andere wijze voldoende zekerheid kan worden
      verkregen over de identiteit van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel50
  - number: '50.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de verplichting om persoonlijk te verschijnen niet geldt
      ten aanzien van de aanvrager van een kentekenbewijs, afgegeven ter zake van de opgave van een kenteken als bedoeld
      in [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel38
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '50.3'
    text: |-
      Indien de aanvraag geschiedt door een in Nederland gevestigde rechtspersoon die dient te zijn ingeschreven in een
      daartoe bij de wet aangewezen register of waarvan de onderneming dient te zijn ingeschreven in het handelsregister,
      geldt de verplichting om persoonlijk te verschijnen voor degene die krachtens de statuten bevoegd is de
      rechtspersoon te vertegenwoordigen. Indien er meerdere personen bevoegd zijn de rechtspersoon te vertegenwoordigen,
      geldt de verplichting voor een van hen. Een persoon die bevoegd is de rechtspersoon te vertegenwoordigen, kan bij
      gemachtigde verschijnen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel50
  - number: '50.4'
    text: |-
      Indien de aanvraag geschiedt door een in Nederland gevestigde rechtspersoon die niet behoeft te zijn ingeschreven
      in een daartoe bij de wet aangewezen register of waarvan de onderneming niet behoeft te zijn ingeschreven in het
      handelsregister, geldt de verplichting om persoonlijk te verschijnen voor degene die door die rechtspersoon is
      gemachtigd tot de aanvraag van het kentekenbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel50
  - number: '50.5'
    text: |-
      De aanvraag van een kentekenbewijs dient te geschieden overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels. Bij ministeriële regeling worden voorschriften vastgesteld ter uitvoering van die regels.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel50
  - number: '50.6'
    text: |-
      De in het vijfde lid bedoelde regels kunnen mede dienstbaar zijn aan de heffing van de belasting van personenauto’s
      en motorrijwielen en van de motorrijtuigenbelasting alsmede aan de afdracht van de krachtens een algemeen
      verbindend verklaarde overeenkomst op grond van de [Wet milieubeheer][ref1] verschuldigde afvalbeheersbijdrage
      voor autowrakken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '50.7'
    text: |-
      Bij de in het vijfde lid bedoelde regels kan worden bepaald in welke gevallen het motorrijtuig of de aanhangwagen,
      waarvoor een kentekenbewijs wordt aangevraagd, voor een onderzoek ter beschikking moet worden gehouden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel50
  - number: '50.8'
    text: |-
      De Dienst Wegverkeer is bevoegd te vorderen dat de aanvrager van een kentekenbewijs een door of vanwege Onze
      Minister van Financiën afgegeven bewijs overlegt, waaruit blijkt dat ter zake van het motorrijtuig of de
      aanhangwagen verschuldigde belastingen en rechten zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel50
  - number: '51.1'
    text: |-
      Het is verboden voor het verkrijgen van een kentekenbewijs opzettelijk onjuiste opgaven te doen, onjuiste
      inlichtingen te verschaffen en onjuiste bewijsstukken en andere bescheiden over te leggen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel51
  - number: '51.2'
    text: |-
      Voor zover de bij de aanvraag van een kentekenbewijs te verschaffen gegevens betreffen of mede betreffen
      gegevens die nodig worden geacht ter zake van de heffing van de belasting van personenauto’s en
      motorrijwielen en van de motorrijtuigenbelasting, wordt de verplichting tot het verstrekken van die gegevens
      beschouwd als een ingevolge de belastingwet opgelegde verplichting en zijn, indien ter zake onjuiste of
      onvolledige gegevens worden verstrekt - in afwijking van de bepalingen van deze wet - de bepalingen van
      [Hoofdstuk IX (Strafrechtelijke bepalingen) van de Algemene wet inzake rijksbelastingen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: IX
  - number: '52.1'
    text: |-
      Indien voor het voertuig waarvoor de afgifte van een kentekenbewijs wordt verlangd, een kentekenbewijs als bedoeld
      in [artikel 56][ref1] is afgegeven, kan de Dienst Wegverkeer verlangen dat, alvorens een kentekenbewijs wordt
      afgegeven, dat eerder afgegeven kentekenbewijs dient te worden ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel56
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '56'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '52.2'
    text: |-
      Aan de afgifte van een kentekenbewijs kunnen door de Dienst Wegverkeer voorschriften worden verbonden, zulks onder
      aantekening daarvan in het bewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel52
  - number: '53'
    text: |-
      De Dienst Wegverkeer geeft bij de afgifte van een kentekenbewijs tevens een keuringsbewijs voor het betrokken
      voertuig af indien:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel53
  - number: 53.a
    text: |-
      het voertuig is onderworpen aan een onderzoek dat ten minste een controle inhoudt op de eisen, bedoeld in
      [artikel 75, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: 53.b
    text: |-
      [artikel 72][ref1] voor dat voertuig geldt of binnen een jaar zal gaan gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: '54'
    text: |-
      Onze Minister kan aan besturen van verenigingen met volledige rechtsbevoegdheid, die behartiging van
      verkeersbelangen ten doel hebben, de bevoegdheid verlenen tot het afgeven van internationale bewijzen voor
      motorrijtuigen en aanhangwagens, bedoeld in internationale overeenkomsten, ten behoeve van het verkeer met
      motorrijtuigen en aanhangwagens in het buitenland.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel54
  - number: '55.1'
    text: |-
      Op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door deze
      dienst vastgestelde tarief, geeft deze dienst overeenkomstig bij algemene maatregel van bestuur vastgestelde regels
      vervangende bewijzen af voor:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel55
  - number: 55.1.a
    text: |-
      kentekenbewijzen of delen daarvan, die versleten, geheel of ten dele onleesbaar, verloren geraakt of teniet gegaan
      zijn;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel55
  - number: 55.1.b
    text: kentekenbewijzen in geval van vermissing van de bijbehorende kentekenplaten.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel55
  - number: '55.2'
    text: |-
      Het vervangende bewijs treedt in de plaats van het eerder afgegeven kentekenbewijs of deel daarvan en wordt
      niet afgegeven dan nadat het versleten of geheel of ten dele onleesbaar geworden kentekenbewijs of deel daarvan,
      waarvoor het wordt afgegeven, is ingeleverd bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel55
  - number: '56'
    text: |-
      In bij algemene maatregel van bestuur vast te stellen gevallen kan een kentekenbewijs met een beperkte
      geldigheidsduur worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel56
  - number: '57.1'
    text: |-
      Onverminderd [artikel 56][ref1] verliest een kentekenbewijs zijn geldigheid door:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel56
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '56'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 57.1.b
    text: afgifte van een nieuw kentekenbewijs dan wel een vervangend kentekenbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel57
  - number: 57.1.c
    text: het onbevoegd daarin aanbrengen van wijzigingen;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel57
  - number: 57.1.d
    text: |-
      schorsing als bedoeld in [artikel 67, eerste lid][ref1], voor de duur van de schorsing;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel67
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '6'
  - number: 57.1.e
    text: ongeldigverklaring.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel57
  - number: '57.2'
    text: |-
      In de gevallen waarin overeenkomstig [artikel 55][ref1] een vervangend bewijs is afgegeven voor een deel van het
      kentekenbewijs, verliest het deel waarvoor dat vervangend bewijs is afgegeven, zijn geldigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel55
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '55'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '57.3'
    text: |-
      De Dienst Wegverkeer kan verlangen dat een kentekenbewijs dat zijn geldigheid heeft verloren binnen een daarbij
      bepaalde termijn bij deze dienst dient te worden ingeleverd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel57
  - number: '58.1'
    text: 'Een kentekenbewijs wordt overeenkomstig bij algemene maatregel van bestuur vastgestelde regels ongeldig verklaard:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel58
  - number: 58.1.a
    text: |-
      indien het is afgegeven op grond van bij de aanvraag verschafte onjuiste gegevens en dat kentekenbewijs niet zou
      zijn afgegeven indien de onjuistheid van die gegevens ten tijde van de aanvraag bekend zou zijn geweest, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel58
  - number: 58.1.b
    text: indien blijkt dat het kennelijk abusievelijk is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel58
  - number: '58.2'
    text: |-
      Een kentekenbewijs kan, overeenkomstig bij algemene maatregel van bestuur vastgestelde regels, ongeldig worden
      verklaard:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel58
  - number: 58.2.a
    text: indien de ter zake van het voertuig verschuldigde belastingen en rechten niet zijn voldaan;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel58
  - number: 58.2.b
    text: |-
      indien het voertuig waarvoor het is afgegeven, niet voldoet aan de bij of krachtens deze wet vastgestelde eisen,
      met uitzondering van de ingevolge [hoofdstuk III][ref1] met betrekking tot de toelating tot het verkeer op de weg
      vastgestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: 58.2.c
    text: |-
      indien in de bouw of inrichting van het voertuig waarvoor het is afgegeven, wijzigingen zijn aangebracht, die niet
      zijn goedgekeurd overeenkomstig het bepaalde bij of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel58
  - number: 58.2.d
    text: |-
      indien het voertuig waarvoor het kentekenbewijs is afgegeven een schadevoertuig betreft dat voldoet aan bij
      ministeriële regeling vastgestelde kenmerken, dan wel indien het voertuig na herstel van de schade niet voldoet aan
      de bij ministeriële regeling te stellen eisen ten aanzien van de wijze waarop de schade is hersteld;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel58
  - number: 58.2.e
    text: |-
      indien de eigenaar of houder van een voertuig onvrijwillig de beschikkingsmacht over dat voertuig heeft verloren,
      mits wordt voldaan aan de bij algemene maatregel van bestuur vastgestelde voorwaarden, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel58
  - number: 58.2.f
    text: in andere bij algemene maatregel van bestuur vast te stellen gevallen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel58
  - number: '58.3'
    text: De ongeldigverklaring kan worden beperkt tot het rijden over de weg.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel58
  - number: '58.4'
    text: |-
      De Dienst Wegverkeer kan een ongeldig verklaard kentekenbewijs geldig verklaren, dan wel geldig verklaren voor het
      rijden over de weg, indien de reden voor ongeldigverklaring is komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel58
  - number: '59.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld omtrent het verval van de tenaamstelling in het
      kentekenregister. De tenaamstelling in het kentekenregister vervalt in ieder geval zodra het kentekenbewijs
      ongeldig is verklaard ingevolge [artikel 58, tweede lid, onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel58
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '58'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '59.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden vastgesteld omtrent het herleven van een vervallen
      tenaamstelling in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel59
  - number: '60.1'
    text: |-
      De houder van een kentekenbewijs is op eerste vordering van de bij algemene maatregel van bestuur aangewezen
      personen verplicht tot overgifte van dat bewijs of van een of meer bij algemene maatregel van bestuur aan te wijzen
      delen daarvan, indien naar het oordeel van die personen:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
  - number: 60.1.a
    text: |-
      ter zake van het voertuig, waarvoor het kentekenbewijs is afgegeven, de verschuldigde belastingen en rechten niet
      zijn voldaan;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
  - number: 60.1.b
    text: |-
      het voertuig waarvoor het kentekenbewijs is afgegeven, niet voldoet aan de bij of krachtens deze wet vastgestelde
      eisen, met uitzondering van de ingevolge [hoofdstuk III][ref1] met betrekking tot de toelating tot het verkeer op
      de weg vastgestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: 60.1.c
    text: |-
      het voertuig waarvoor het kentekenbewijs is afgegeven een schadevoertuig betreft dat voldoet aan bij ministeriële
      regeling vastgestelde kenmerken, dan wel indien het voertuig na herstel van de schade niet voldoet aan de bij
      ministeriële regeling te stellen eisen ten aanzien van de wijze waarop de schade is hersteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
  - number: '60.2'
    text: |-
      De in het eerste lid bedoelde vordering kan eveneens worden gedaan indien naar het oordeel van de daar bedoelde
      personen niet wordt voldaan aan de krachtens [artikel 52, tweede lid][ref1], in het kentekenbewijs vermelde
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel52
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '52'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '60.3'
    text: |-
      Indien het een kentekenbewijs betreft dat is afgegeven voor een aanhangwagen die overeenkomstig het bij
      ministeriële regeling bepaalde is voorzien van een identificatieplaat, kan aan de vordering worden voldaan binnen
      een bij die maatregel vastgestelde termijn.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
  - number: '60.4'
    text: |-
      De in het eerste lid bedoelde personen doen in de bij algemene maatregel van bestuur aangewezen gevallen het
      kentekenbewijs of de ingevorderde delen daarvan zo spoedig mogelijk toekomen aan de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
  - number: '60.5'
    text: 'De Dienst Wegverkeer geeft het kentekenbewijs of de ingevorderde delen daarvan terug:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
  - number: 60.5.a
    text: |-
      in de gevallen, bedoeld in het eerste lid, onderdeel a, indien ter zake van het voertuig alsnog de verschuldigde
      belastingen en rechten zijn voldaan;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
  - number: 60.5.b
    text: |-
      in de gevallen, bedoeld in het eerste lid, onderdeel b, indien het voertuig ter zake van de eisen waaraan het niet
      voldeed, alsnog is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
  - number: 60.5.c
    text: |-
      in de gevallen, bedoeld in het eerste lid, onderdeel c, indien het schadevoertuig is goedgekeurd ingevolge bij
      ministeriële regeling vastgestelde eisen omtrent de wijze waarop de schade is hersteld;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
  - number: 60.5.d
    text: |-
      in het geval, bedoeld in het tweede lid, indien alsnog wordt voldaan aan de krachtens
      [artikel 52, tweede lid][ref1], in het kentekenbewijs vermelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel52
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '52'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '60.6'
    text: |-
      De Dienst Wegverkeer geeft bij de teruggave van het kentekenbewijs of de ingevorderde delen daarvan tevens een
      keuringsbewijs voor het betrokken voertuig af, indien:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
  - number: 60.6.a
    text: |-
      het kentekenbewijs is ingevorderd omdat het voertuig niet voldoet aan de eisen bedoeld in het eerste lid, onderdeel
      b;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
  - number: 60.6.b
    text: |-
      het voertuig is onderworpen aan een onderzoek dat ten minste een controle inhoudt op de eisen, bedoeld in
      [artikel 75, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: 60.6.c
    text: |-
      [artikel 72][ref1] voor dat voertuig geldt en binnen een jaar zal gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: '60.7'
    text: Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de vordering van kentekenbewijzen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
  - number: '60.8'
    text: |-
      Bij ministeriële regeling, in overeenstemming met Onze Minister van Financiën, kunnen nadere regels worden
      vastgesteld omtrent het vijfde lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel60
  - number: '61.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel61
  - number: 61.1.c
    text: |-
      ten opzichte van een motorrijtuig of een aanhangwagen opzettelijk gebruik te maken van een kentekenbewijs dat niet
      aan de eigenaar of houder voor dat motorrijtuig of die aanhangwagen is afgegeven, als ware het aan deze voor dat
      motorrijtuig of die aanhangwagen afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel61
  - number: '62.1'
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is motorrijtuigen en aanhangwagens, waarvan hij de eigendom heeft verkregen, in zijn bedrijfsvoorraad op
      te nemen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel62
  - number: '62.2'
    text: |-
      Aan de erkenning kunnen bij algemene maatregel van bestuur aangewezen bevoegdheden worden verbonden; een zodanige
      bevoegdheid maakt deel uit van de erkenning. Het in de [artikelen 62 tot en met 66][ref1] ten aanzien van
      erkenningen bepaalde is van overeenkomstige toepassing op bedoelde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '62.3'
    text: |-
      De erkenning geldt voor de in de erkenning aangewezen groep of groepen van voertuigen en kan gelden voor bepaalde
      of voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel62
  - number: '62.4'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en kunnen
      met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel62
  - number: '62.5'
    text: |-
      De in [artikel 50, eerste lid, aanhef][ref1] bedoelde verplichting om bij de aanvraag van een kentekenbewijs
      persoonlijk te verschijnen bij een bij ministeriële regeling aangewezen instantie, geldt niet voor natuurlijke
      personen of rechtspersonen aan wie een erkenning als bedoeld in het eerste lid is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel50
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '50'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '63.1'
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door deze dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend aan de natuurlijke persoon of rechtspersoon,
      die voldoet aan de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de administratieve
      organisatie van de natuurlijke persoon of rechtspersoon alsmede de wijze waarop deze er voor zorgdraagt dat de aan
      de opname in bedrijfsvoorraad verbonden procedures in acht worden genomen. Voorts kunnen deze eisen mede dienstbaar
      zijn aan de uitvoering van de Wet milieubeheer.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel63
  - number: '63.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld met betrekking tot de aanvraag van een
      erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel63
  - number: '63.3'
    text: Bij ministeriële regeling worden regels vastgesteld ter uitvoering van het krachtens het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel63
  - number: '63.4'
    text: |-
      De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning op grond van
      [artikel 65, tweede lid][ref1], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel van zes maanden ingeval reeds twee of meer malen een dergelijke aan
      de aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel65
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '65'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '64.1'
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de *Staatscourant*. Het toezicht omvat in ieder geval het periodiek controleren van de bedrijfsvoorraad van degene
      aan wie de erkenning is verleend en van de ter zake van die bedrijfsvoorraad door deze gevoerde administratie.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel64
  - number: '64.2'
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel64
  - number: '64.3'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld betreffende de wijze waarop het toezicht wordt gehouden
      en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend. Deze regels kunnen
      inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit
      de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel64
  - number: '65.1'
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie de erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel65
  - number: '65.2'
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel65
  - number: 65.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel65
  - number: 65.2.b
    text: |-
      de verplichtingen, vervat in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] en
      [artikel 64, tweede lid][ref2], niet nakomt, of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel64
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '64'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 65.2.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel65
  - number: '65.3'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel65
  - number: '65.4'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, bepalen dat een wachttijd geldt voor het
      aanvragen van een erkenning van maximaal 30 maanden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel65
  - number: 65a
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld met betrekking tot het intrekken, wijzigen en schorsen
      van de erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel65a
  - number: '66'
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 62][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '67.1'
    text: |-
      Indien met een voertuig geen gebruik van de weg wordt gemaakt, schorst de Dienst Wegverkeer op aanvraag van de
      eigenaar of houder van dat voertuig, tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief, de geldigheid van het kentekenbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel67
  - number: '67.2'
    text: |-
      De hoogte van het in het eerste lid bedoelde tarief kan voor verschillende groepen voertuigen dan wel eigenaren of
      houders van voertuigen verschillend worden vastgesteld. Voor aanvragen die worden ingediend binnen een jaar na de
      aanvraag van een schorsing welke ingevolge [artikel 68, eerste lid, onderdelen a en d][ref1], is geëindigd, kan het
      tarief hoger worden vastgesteld dan het tarief voor laatstgenoemde aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel68
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '68'
        hoofdstuk: IV
        paragraaf: '6'
  - number: '67.3'
    text: |-
      De aanvraag van een schorsing dient te geschieden overeenkomstig bij algemene maatregel van bestuur vastgestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel67
  - number: '67.4'
    text: Bij ministeriële regeling worden nadere regels vastgesteld omtrent het krachtens het derde lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel67
  - number: '67.5'
    text: |-
      De Dienst Wegverkeer plaatst bij het verlenen van de schorsing overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels op het kentekenbewijs een aantekening waaruit blijkt dat schorsing is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel67
  - number: '67.6'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld omtrent de aantekening van schorsing, bedoeld in het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel67
  - number: '68.1'
    text: 'De schorsing eindigt:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel68
  - number: 68.1.a
    text: |-
      door opheffing als bedoeld in [artikel 69][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel69
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '69'
        hoofdstuk: IV
        paragraaf: '6'
  - number: 68.1.b
    text: door verloop van een jaar nadat de schorsing is verleend,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel68
  - number: 68.1.c
    text: door het verval van de tenaamstelling in het kentekenregister, of
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel68
  - number: 68.1.d
    text: zodra met het voertuig gebruik van de weg wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel68
  - number: '68.2'
    text: |-
      Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat in bepaalde
      uitzonderingsgevallen tijdelijk kan worden afgeweken van het eerste lid, aanhef en onderdeel *d*.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel68
  - number: '69.1'
    text: De schorsing wordt op aanvraag van de eigenaar of houder door de Dienst Wegverkeer opgeheven.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel69
  - number: '69.2'
    text: |-
      De aanvraag van opheffing van de schorsing dient te geschieden overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel69
  - number: '69.3'
    text: Bij ministeriële regeling worden nadere regels vastgesteld omtrent het krachtens het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel69
  - number: '70.1'
    text: |-
      Bij de aanvraag van opheffing van de schorsing alsmede na het eindigen van de schorsing op grond van
      [artikel 68, eerste lid, aanhef en onderdeel b of d][ref1], dient degene aan wie de schorsing is verleend, een
      nieuw kentekenbewijs of een of meer bij algemene maatregel van bestuur aan te wijzen delen daarvan aan te vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel68
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '68'
        hoofdstuk: IV
        paragraaf: '6'
  - number: '70.2'
    text: |-
      De aanvraag dient te geschieden overeenkomstig bij algemene maatregel van bestuur vastgestelde regels tegen
      betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door deze dienst vastgestelde
      tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70
  - number: 70a.1
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is een of meer van de in [artikel 40, tweede lid][ref1], bedoelde bij de erkenning aangewezen merken aan
      te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 70a.2
    text: Het is verboden om zonder de in het eerste lid bedoelde erkenning de aldaar bedoelde merken aan te brengen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70a
  - number: 70a.3
    text: |-
      Bij ministeriële regeling worden voorschriften vastgesteld die aan de erkenning worden verbonden en worden met
      betrekking tot die voorschriften regels vastgesteld. Die regels hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70a
  - number: 70a.3.a
    text: de fabricage en levering van kentekenplaten en onderdelen daarvan en de daarbij te volgen procedure;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70a
  - number: 70a.3.b
    text: |-
      de registratie van gegevens met betrekking tot de ingekochte materialen, de productie, de af- en uitval, de
      voorraad en de aflevering van kentekenplaten en onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70a
  - number: 70b.1
    text: |-
      De fabrikant van kentekenplaten is in geval van levering van kentekenplaten verplicht tot het vastleggen van
      gegevens omtrent: van:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70b
  - number: 70b.1.a
    text: het betrokken kenteken;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70b
  - number: 70b.1.b
    text: |-
      de aard en het nummer van het identiteitsdocument van degene door, respectievelijk namens wie de kentekenplaten
      worden aangevraagd, en
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70b
  - number: 70b.1.c
    text: het aantal afgegeven kentekenplaten.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70b
  - number: 70b.2
    text: |-
      Indien de kentekenplaten worden aangevraagd namens een rechtspersoon of door een daartoe bij ministeriële regeling
      aangewezen erkend bedrijf als bedoeld in [artikel 62][ref1], worden in plaats van de gegevens, bedoeld in het
      eerste lid, onder b, vastgelegd de bij ministeriële regeling aangewezen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 70b.3
    text: |-
      Indien bij de levering van kentekenplaten die door, respectievelijk namens een natuurlijk persoon zijn aangevraagd,
      een ander identiteitsdocument dan een rijbewijs of paspoort wordt overgelegd, wordt tevens vastgelegd de
      naam, de beginletters van de voornaam of voornamen en het adres van degene door, respectievelijk namens wie de
      kentekenplaten worden aangevraagd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70b
  - number: 70b.4
    text: |-
      De fabrikant verstrekt gegevens die zijn vastgelegd op grond van het eerste tot en met derde lid in een
      registratie, uitsluitend en desgevraagd aan de ambtenaren van de Dienst Wegverkeer, belast met het toezicht op
      de naleving van de uit de erkenning voortvloeiende verplichtingen, en aan de ambtenaren van politie belast met de
      handhaving van de uit de erkenning voortvloeiende verplichtingen en van de verboden, bedoeld in [artikel 41][ref1],
      voor zover deze gegevens noodzakelijk zijn voor de goede vervulling van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel41
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 70b.5
    text: De vastgelegde gegevens worden gedurende één jaar na de vastlegging bewaard.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70b
  - number: 70b.6
    text: Bij ministeriële regeling worden nadere regels vastgesteld omtrent de inrichting en het beheer van het register.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70b
  - number: 70c.1
    text: |-
      Na afloop van de termijn, bedoeld in [artikel 70b, vijfde lid][ref1], worden de daar bedoelde vastgelegde gegevens
      overgedragen aan de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70b
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70b
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70c.2
    text: |-
      Uit de registratie worden door de Dienst Wegverkeer uitsluitend en desgevraagd aan de ambtenaren van politie
      belast met de handhaving van de uit de erkenning voortvloeiende verplichtingen en van de verboden, bedoeld in
      [artikel 41][ref1], gegevens verstrekt voor zover deze noodzakelijk zijn voor de goede vervulling van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel41
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 70c.3
    text: |-
      De vastgelegde gegevens worden door de Dienst Wegverkeer maximaal vijf jaar na de overdracht, bedoeld in het eerste
      lid, bewaard.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70c
  - number: 70c.4
    text: |-
      De Dienst Wegverkeer stelt ten aanzien van het verwerken van de persoonsgegevens als bedoeld in het eerste lid, een
      reglement vast.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70c
  - number: 70d.1
    text: |-
      De erkenning wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief verleend indien de natuurlijke persoon of rechtspersoon voldoet aan
      de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de administratieve organisatie van
      de natuurlijke persoon of rechtspersoon alsmede de wijze waarop deze ervoor zorg draagt dat de aan het aanbrengen
      van de merken verbonden procedures in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70d
  - number: 70d.2
    text: Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70d
  - number: 70d.3
    text: |-
      De erkenning wordt in ieder geval geweigerd indien een reeds aan de aanvrager verleende erkenning op grond van
      [artikel 70f, tweede lid][ref1], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel van zes maanden ingeval reeds twee of meer malen een dergelijke aan
      de aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70f
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70f
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70e.1
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de Staatscourant. Het toezicht omvat in ieder geval het periodiek controleren van de organisatie van degene aan wie
      de erkenning is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70e
  - number: 70e.2
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70e
  - number: 70e.3
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld betreffende de wijze waarop het toezicht wordt gehouden
      en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend. Deze regels kunnen
      inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit
      de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70e
  - number: 70f.1
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie die erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70f
  - number: 70f.2
    text: |-
      De Dienst Wegverkeer kan een erkenning intrekken of wijzigen dan wel de daaraan verbonden voorschriften wijzigen
      indien degene aan wie de erkenning is verleend:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70f
  - number: 70f.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70f
  - number: 70f.2.b
    text: |-
      een verplichting als bedoeld in [artikel 70e][ref1] niet nakomt, of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70e
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70e
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70f.2.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70f
  - number: 70f.3
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70f
  - number: 70g
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 70a][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70a
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70h
    text: |-
      Bij de verkrijging van een kentekenplaat worden de bij ministeriële regeling aangewezen identiteitsdocumenten en
      overige documenten overgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70h
  - number: 70i.1
    text: |-
      In geval van overdracht van een motorrijtuig of aanhangwagen aan een erkend bedrijf als bedoeld in
      [artikel 62][ref1], ten behoeve van uitvoer naar het buitenland of voorgoed buiten gebruikstelling, is de eigenaar
      of houder verplicht tot inlevering van de betrokken kentekenplaten bij dat bedrijf tegelijk met de overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 70i.2
    text: |-
      In geval van uitvoer naar het buitenland anders dan door een erkend bedrijf als bedoeld in [artikel 62][ref1],
      is de eigenaar of houder van het motorrijtuig of de aanhangwagen verplicht tot inlevering van de betrokken
      kentekenplaten bij de Dienst Wegverkeer tegelijk met de uitvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 70i.3
    text: |-
      Indien het kentekenbewijs zijn geldigheid heeft verloren, anders dan in geval van het eerste of het tweede lid, kan
      de Dienst Wegverkeer verlangen dat de betrokken kentekenplaten binnen een bepaalde termijn bij deze dienst worden
      ingeleverd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70i
  - number: 70j.1
    text: |-
      Indien de betrokken kentekenplaten overeenkomstig [artikel 70i][ref1] worden ingeleverd bij de Dienst Wegverkeer
      onderscheidenlijk een erkend bedrijf als bedoeld in [artikel 62][ref2] is deze dienst, onderscheidenlijk dit
      bedrijf verplicht tot het vastleggen van gegevens omtrent van:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70i
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70j
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70i
        hoofdstuk: IV
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 70j.1.a
    text: het betrokken kenteken, en
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70j
  - number: 70j.1.b
    text: het aantal ingeleverde kentekenplaten.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70j
  - number: 70j.2
    text: |-
      De Dienst Wegverkeer, onderscheidenlijk het erkende bedrijf, is voorts, overeenkomstig bij ministeriële regeling
      vast te stellen regels, verplicht tot vernietiging van de ingeleverde kentekenplaten en tot registratie van de
      vernietiging.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70j
  - number: 70k.1
    text: De Dienst Wegverkeer houdt een register van fietsen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70k
  - number: 70k.2
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de inhoud van het register alsmede de verwerking, het
      gebruik en de verstrekking van de gegevens daaruit.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70k
  - number: 70k.3
    text: |-
      Het verzamelen van gegevens ten behoeve van het in het eerste lid bedoelde register geschiedt ter voorkoming van
      diefstal en heling van fietsen, alsmede ten behoeve van de opsporing van gestolen fietsen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70k
  - number: 70k.4
    text: |-
      Registratie van gegevens in het register geschiedt op de door de Dienst Wegverkeer te bepalen wijze. In door de
      Dienst Wegverkeer te bepalen gevallen kan een door deze dienst te bepalen aansluittarief verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70k
  - number: 70k.5
    text: |-
      In door de Dienst Wegverkeer te bepalen gevallen geschiedt de registratie van gegevens in, dan wel verstrekking van
      gegevens uit het register tegen betaling van een door deze dienst te bepalen tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70k
  - number: 70l.1
    text: |-
      De Dienst Wegverkeer houdt een register van bij ministeriële regeling aan te wijzen categorieën van mobiele
      objecten anders dan fietsen waarvoor op grond van deze wet geen kenteken is opgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70l
  - number: 70l.2
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de inhoud van het register alsmede de verwerking, het
      gebruik en de verstrekking van de gegevens daaruit.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70l
  - number: 70l.3
    text: |-
      Het verzamelen van gegevens ten behoeve van het in het eerste lid bedoelde register geschiedt ter voorkoming van
      diefstal en heling van mobiele objecten, ten behoeve van de opsporing van gestolen mobiele objecten, alsmede ten
      behoeve van andere, bij ministeriële regeling te bepalen doeleinden, met inachtneming van [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: 70l.4
    text: |-
      Het [vierde en vijfde lid van artikel 70k][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70k
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel70l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70k
        hoofdstuk: IVA
  - number: '71'
    text: 'Bij ministeriële regeling worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel71
  - number: 71.a
    text: |-
      de eisen waaraan voertuigen moeten voldoen waarmee over de weg wordt gereden, waarbij onderscheid kan worden
      gemaakt tussen verschillende wegen;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel71
  - number: 71.b
    text: de inrichting van voertuigen die op de weg staan;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel71
  - number: 71.c
    text: de eisen waaraan voertuigen moeten voldoen voor de afgifte van een keuringsbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel71
  - number: 71.d
    text: |-
      de eisen waaraan ter uitvoering van verdragen of van besluiten van volkenrechtelijke organisaties of van één
      of meer instellingen van de Europese Unie, al dan niet gezamenlijk, moet worden voldaan met betrekking tot het
      uitvoeren van onderhoud aan voertuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel71
  - number: 71a
    text: 'Bij ministeriële regeling kan worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel71a
  - number: 71a.a
    text: |-
      het voldoen aan de in [artikel 71][ref1] bedoelde voorschriften wordt aangetoond door middel van in die regels
      voorgeschreven apparatuur,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
  - number: 71a.b
    text: die apparatuur is goedgekeurd door een door Onze Minister aangewezen keuringsinstelling,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel71a
  - number: 71a.c
    text: |-
      die apparatuur alleen kan worden goedgekeurd indien de in die regels genoemde technische specificaties van die
      apparatuur die noodzakelijk zijn om het periodiek onderzoek, bedoeld in onderdeel d, uit te kunnen voeren, op de in
      die regels aangegeven wijze bekend worden gemaakt,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel71a
  - number: 71a.d
    text: |-
      die apparatuur met een in die regels vast te stellen periodiciteit is onderzocht door deze keuringsinstelling,
      dan wel door een door Onze Minister of door deze keuringsinstelling erkende onderzoeksgerechtigde en dat middelen
      die worden gebruikt om die apparatuur voor gebruik geschikt te maken, zijn gecertificeerd door een door die
      keuringsinstelling erkende instelling, en
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel71a
  - number: 71a.e
    text: |-
      bij de erkenning van een onderzoeksgerechtigde of instelling als bedoeld in onderdeel d, wordt voldaan aan de in
      die regels opgenomen voorschriften.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel71a
  - number: '72.1'
    text: |-
      Voor een motorrijtuig of een aanhangwagen, waarvoor een kenteken is opgegeven dan wel dient te zijn opgegeven,
      dient een keuringsbewijs te zijn afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel72
  - number: '72.2'
    text: 'Het keuringsbewijs dient:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel72
  - number: 72.2.a
    text: te voldoen aan de door de Dienst Wegverkeer vastgestelde eisen inzake inrichting en uitvoering,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel72
  - number: 72.2.b
    text: zijn geldigheid niet te hebben verloren, en
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel72
  - number: 72.2.c
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel72
  - number: '72.3'
    text: 'Voor overtreding van het eerste lid en het bepaalde bij of krachtens het tweede lid zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel72
  - number: 72.3.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder, alsmede in het geval dat met dat motorrijtuig over
      de weg wordt gereden, de bestuurder, en
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel72
  - number: 72.3.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder, alsmede in het geval dat de aanhangwagen met een
      motorrijtuig over de weg wordt voortbewogen, de bestuurder van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel72
  - number: '73.1'
    text: |-
      [Artikel 72][ref1] geldt niet indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.1.a
    text: |-
      voor het motorrijtuig of de aanhangwagen ter zake van een keuring die ingevolge een andere dan deze wet is
      voorgeschreven en blijkens aanwijzing bij ministeriële regeling ten minste een controle inhoudt op de eisen,
      bedoeld in [artikel 75, eerste lid][ref1], een keuringsdocument waarvan de geldigheidsduur niet is verstreken, is
      afgegeven, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: 73.1.b
    text: |-
      de geldigheid van het voor het betrokken voertuig afgegeven kentekenbewijs is geschorst overeenkomstig
      [paragraaf 6 van hoofdstuk IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: IV
        paragraaf: '6'
  - number: '73.2'
    text: 'Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel73
  - number: 73.2.a
    text: |-
      [artikel 72][ref1] niet geldt voor motorrijtuigen en aanhangwagens zolang gerekend vanaf het tijdstip waarop deze
      voertuigen voor het eerst op de weg zijn toegelaten, nog geen bij algemene maatregel van bestuur te bepalen termijn
      is verstreken, die voor verschillende groepen van voertuigen, alsmede voor voertuigen die voor, onderscheidenlijk
      na een bij algemene maatregel van bestuur te bepalen tijdstip voor het eerst op de weg zijn toegelaten verschillend
      kan worden vastgesteld; bij algemene maatregel van bestuur kan nader worden bepaald op welk tijdstip een voertuig
      geacht wordt voor het eerst op de weg te zijn toegelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.2.b
    text: |-
      [artikel 72][ref1] niet geldt voor nader aangewezen groepen van motorrijtuigen of aanhangwagens. Hieronder vallen
      in ieder geval aanhangwagens met een toegestane maximum massa van niet meer dan 3500 kg;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.2.c
    text: |-
      in bepaalde uitzonderingsgevallen tijdelijk wordt of kan worden afgeweken van [artikel 72][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.2.d
    text: |-
      [artikel 72][ref1] gedurende een nader te bepalen termijn na het tijdstip van verstrijken van de geldigheidsduur
      van het voor het voertuig afgegeven keuringsbewijs niet geldt voor het op de weg staan van dat voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: '73.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot het tweede lid, onderdelen *b*
      en *c*.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel73
  - number: '74'
    text: |-
      Het is verboden ten opzichte van een motorrijtuig of een aanhangwagen opzettelijk gebruik te maken van een
      keuringsbewijs dat niet voor dat voertuig is afgegeven, als ware het voor dat voertuig afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel74
  - number: '75.1'
    text: |-
      Een keuringsbewijs wordt door degene die ingevolge [artikel 78][ref1] met de afgifte van keuringsrapporten
      is belast, afgegeven op aanvraag en tegen betaling op de door deze vastgestelde wijze van het door deze
      vastgestelde tarief indien het motorrijtuig of de aanhangwagen heeft voldaan aan de eisen die ingevolge
      [artikel 71, onderdeel c][ref2], aan dat voertuig worden gesteld, voorzover deze eisen niet ingevolge het
      tweede lid buiten toepassing blijven. Het hiervoor bedoelde tarief omvat mede een door de Dienst Wegverkeer
      vastgesteld bedrag ter zake van het attenderen door deze dienst op de in [artikel 72][ref3] opgenomen
      verplichting. Indien degene die met de afgifte van keuringsrapporten is belast een persoon is als bedoeld in
      [artikel 78, eerste lid, onder b][ref4], draagt deze dit bedrag af aan de Dienst Wegverkeer op de door deze dienst
      vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: '75.2'
    text: |-
      Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat voor nader
      aangewezen groepen van motorrijtuigen - zolang gerekend vanaf het tijdstip waarop deze voertuigen voor het
      eerst op de weg zijn toegelaten, nog geen bij algemene maatregel van bestuur vast te stellen termijn die ten
      hoogste drie jaren bedraagt, is verstreken - ten behoeve van de afgifte van een keuringsbewijs slechts behoeft te
      worden voldaan aan de in het eerste lid, onderdeel a, bedoelde eisen die betrekking hebben op het bestrijden van
      luchtverontreiniging. Bij algemene maatregel van bestuur kan nader worden bepaald op welk tijdstip een voertuig
      geacht wordt voor het eerst op de weg te zijn toegelaten.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel75
  - number: '75.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot de in het tweede lid bedoelde
      voorwaarden en groepen van motorrijtuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel75
  - number: '76.1'
    text: |-
      Bij de aanvraag van een keuringsrapport dient de aanvrager de bij algemene maatregel van bestuur vastgestelde
      bescheiden over te leggen en inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel76
  - number: '76.2'
    text: |-
      De aanvrager dient het motorrijtuig of de aanhangwagen waarvoor de afgifte van een keuringsrapport wordt verlangd,
      overeenkomstig bij algemene maatregel van bestuur vast te stellen regels ten behoeve van de afgifte van dat bewijs
      ter beschikking te stellen van degene die ingevolge [artikel 78][ref1] met de afgifte van keuringsrapporten is
      belast.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: '76.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld omtrent de wijze waarop wordt onderzocht of een
      voertuig voldoet aan de in [artikel 75][ref1] bedoelde eisen, alsmede omtrent hetgeen verder met betrekking tot de
      behandeling van de aanvraag van een keuringsrapport noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: '77'
    text: |-
      Het voor afgifte van een keuringsrapport aangeboden voertuig dient overeen te stemmen met de in het daarbij
      behorende kentekenbewijs en de in het kentekenregister vermelde gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel77
  - number: '78.1'
    text: 'Keuringsrapporten worden overeenkomstig bij algemene maatregel van bestuur vastgestelde regels afgegeven door:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel78
  - number: 78.1.a
    text: |-
      de Dienst Wegverkeer in het kader van een door deze dienst verrichte keuring van het voertuig waarvoor de afgifte
      wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel78
  - number: 78.1.b
    text: |-
      een ingevolge [artikel 84][ref1] erkende natuurlijke persoon of rechtspersoon in het kader van een door deze
      verrichte keuring van het voertuig waarvoor de afgifte wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel84
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '84'
        hoofdstuk: V
        paragraaf: '5'
  - number: '78.2'
    text: |-
      De Dienst Wegverkeer draagt er zorg voor dat indien in onvoldoende mate keuringsrapporten kunnen worden afgegeven
      door andere natuurlijke personen of rechtspersonen als bedoeld in het eerste lid, onderdeel b, dan die zich
      bezighouden met het verrichten van onderhoud of reparaties aan motorrijtuigen of aanhangwagens, de Dienst
      Wegverkeer kan voorzien in zodanige afgifte.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel78
  - number: '78.3'
    text: |-
      De Dienst Wegverkeer geeft geen keuringsrapporten af voor zover in voldoende mate keuringsrapporten kunnen worden
      afgegeven door natuurlijke personen of rechtspersonen als bedoeld in het eerste lid, onderdeel b, die zich niet
      bezighouden met het verrichten van onderhoud of reparaties aan motorrijtuigen of aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel78
  - number: '79'
    text: |-
      Degene die ingevolge [artikel 78][ref1] met de afgifte van keuringsbewijzen is belast, doet van het voornemen
      tot de afgifte van zodanig bewijs op de bij ministeriële regeling te bepalen wijze mededeling aan de beheerder
      van het kentekenregister. Van de weigering van de afgifte van een keuringsbewijs wordt mededeling gedaan in bij
      ministeriële regeling vast te stellen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: '80.1'
    text: |-
      De Dienst Wegverkeer geeft voor keuringsbewijzen die versleten of geheel of ten dele onleesbaar zijn, dan wel
      verloren zijn geraakt of teniet zijn gegaan, op aanvraag en tegen betaling, op de door deze dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief vervangende keuringsbewijzen af.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel80
  - number: '80.2'
    text: |-
      Een vervangend keuringsbewijs wordt niet afgegeven dan nadat het versleten of geheel of ten dele onleesbaar
      geworden bewijs is ingeleverd bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel80
  - number: '81.1'
    text: |-
      Bij algemene maatregel van bestuur wordt, voorzover nodig onder daarbij te stellen voorwaarden, bepaald op welk
      tijdstip een keuringsbewijs geldigheid verkrijgt en voor welke duur een keuringsbewijs geldig is. Deze duur
      kan voor verschillende groepen van voertuigen, alsmede voor voertuigen die voor, onderscheidenlijk na een bij
      algemene maatregel van bestuur te bepalen tijdstip voor het eerst op de weg zijn toegelaten, verschillend worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel81
  - number: '81.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot de in het eerste lid bedoelde
      voorwaarden en groepen van motorrijtuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel81
  - number: '82'
    text: |-
      Onverminderd de [artikelen 81][ref1], [86, vierde lid][ref2], en [91, vierde lid][ref3], verliest een
      keuringsbewijs zijn geldigheid:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel91
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '81'
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '86'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '91'
        hoofdstuk: V
        paragraaf: '6'
  - number: 82.a
    text: door afgifte van een vervangend keuringsbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel82
  - number: 82.b
    text: door het onbevoegd daarin aanbrengen van wijzigingen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel82
  - number: '83.1'
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is keuringsrapporten af te geven voor motorrijtuigen en aanhangwagens, waarvoor [artikel 72][ref1]
      geldt, met uitzondering van bussen als bedoeld in de [Wet personenvervoer 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
  - number: '83.2'
    text: |-
      Een erkenning geldt voor motorrijtuigen en aanhangwagens, die behoren tot een in de erkenning aangewezen groep, en
      kan gelden voor bepaalde of voor onbepaalde tijd. De aanwijzing kan geen betrekking hebben op de leeftijd of het
      merk van motorrijtuigen en aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel83
  - number: '83.3'
    text: |-
      Een erkenning, verleend aan een natuurlijke persoon of rechtspersoon, die een keuringsdienst of een
      onderhoudsdienst voor het eigen wagenpark exploiteert, geldt slechts voor de eigen voertuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel83
  - number: '83.4'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en kunnen
      met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel83
  - number: '84.1'
    text: |-
      De erkenning wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief verleend indien de natuurlijke persoon of rechtspersoon voldoet
      aan de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de voor de keuringen
      benodigde apparatuur en ruimte alsmede de deskundigheid van de voor de keuringen beschikbare personen. Ten
      aanzien van de voor de keuringen benodigde apparatuur kan bij die ministeriële regeling de eis worden gesteld
      dat die apparatuur is goedgekeurd door een door Onze Minister aan te wijzen keuringsinstelling en met de in
      die regeling vast te stellen periodiciteit is onderzocht door deze keuringsinstelling dan wel door een door
      deze keuringsinstelling erkende onderzoeksgerechtigde en kunnen regels worden vastgesteld met betrekking tot de
      erkenning van onderzoeksgerechtigden. Bij ministeriële regeling kan worden bepaald dat middelen die worden gebruikt
      om deze apparatuur voor gebruik geschikt te maken zijn gecertificeerd door een door die keuringsinstelling erkende
      instelling en kunnen regels worden vastgesteld met betrekking tot die erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel84
  - number: '84.2'
    text: Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel84
  - number: '84.3'
    text: |-
      De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning op grond van
      [artikel 87, tweede lid][ref1], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel van zes maanden ingeval reeds twee of meer malen een dergelijke aan
      de aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel87
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '87'
        hoofdstuk: V
        paragraaf: '5'
  - number: '85'
    text: |-
      De erkende natuurlijke personen of rechtspersonen zijn verplicht het door de aanvrager ter keuring aangeboden
      voertuig te keuren, indien zij daartoe gerechtigd zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel85
  - number: 85a.1
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon de bevoegdheid verlenen motorrijtuigen en aanhangwagens,
      waarvoor [artikel 72][ref1] geldt, met uitzondering van bussen als bedoeld in de Wet personenvervoer, aan een
      keuring te onderwerpen. Ten bewijze van deze bevoegdheid verstrekt de Dienst Wegverkeer de betrokken persoon een
      bevoegdheidspas.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 85a.2
    text: |-
      De bevoegdheid voertuigen aan een keuring te onderwerpen geldt voor motorrijtuigen en aanhangwagens die behoren tot
      een in de verlening van de bevoegdheid voertuigen aan een keuring te onderwerpen aangewezen groep, en kan gelden
      voor bepaalde of onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel85a
  - number: 85a.3
    text: |-
      De bevoegdheid voertuigen aan een keuring te onderwerpen wordt verleend indien de natuurlijke persoon beschikt
      over een examencertificaat van een door Onze Minister aangewezen exameninstantie en overigens voldoet aan bij
      ministeriële regeling vastgestelde eisen. Daarbij kan aan de Dienst Wegverkeer de bevoegdheid worden verleend
      voorwaarden vast te stellen ten aanzien van het voldoen aan deze eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel85a
  - number: 85a.4
    text: |-
      Bij ministeriële regeling worden regels vastgesteld met betrekking tot de aanvraag tot het verlenen van de
      bevoegdheid voertuigen aan een keuring te onderwerpen en met betrekking tot de bevoegdheidspas.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel85a
  - number: 85a.5
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan de bevoegdheid voertuigen aan een keuring
      te onderwerpen worden verbonden en kunnen met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel85a
  - number: 85a.6
    text: |-
      Het tarief voor het examen dat de natuurlijke persoon dient af te leggen om het in het derde lid bedoelde
      certificaat te verkrijgen, behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel85a
  - number: '86.1'
    text: |-
      De Dienst Wegverkeer onderwerpt ten minste drie van elke honderd voertuigen na een verrichte keuring
      steekproefsgewijs aan een herkeuring met het oog op het toezicht op:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel86
  - number: 86.1.a
    text: de juiste uitvoering van de keuring;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel86
  - number: 86.1.b
    text: het aan een keuring onderwerpen door daartoe bevoegde natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel86
  - number: '86.2'
    text: |-
      De eigenaar of houder van een motorrijtuig of een aanhangwagen, waarvoor een herkeuring wordt geëist, is verplicht
      het voertuig op de plaats van de keuring beschikbaar te houden totdat de herkeuring heeft plaatsgevonden. Deze
      verplichting geldt voor een periode van ten hoogste 90 minuten na de in [artikel 79][ref1] bedoelde mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel79
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '79'
        hoofdstuk: V
        paragraaf: '3'
  - number: '86.3'
    text: |-
      Het keuringsrapport van een motorrijtuig of een aanhangwagen waarvoor een herkeuring wordt geëist wordt pas
      afgegeven op het moment dat de periode genoemd in het vorige lid is verstreken of nadat de herkeuring heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel86
  - number: '86.4'
    text: |-
      De geldigheid van het keuringsbewijs vervalt indien de eigenaar of houder niet voldoet aan de in het tweede lid
      bedoelde verplichtingen of indien het motorrijtuig of de aanhangwagen bij de herkeuring niet voldoet aan de eisen,
      bedoeld in [artikel 75, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: '86.5'
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel86
  - number: '86.6'
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel86
  - number: '86.7'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop de steekproef wordt
      uitgevoerd, alsmede betreffende de verplichting tot medewerking daaraan van de eigenaar of houder. Deze regels
      kunnen inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of
      meer uit de erkenning voortvloeiende verplichtingen of in strijd met een of meer uit de bevoegdheid voertuigen aan
      een keuring te onderwerpen voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel86
  - number: 86a.1
    text: |-
      De Dienst Wegverkeer laat met het oog op het toezicht op het verrichten van keuringen, keuringen uitvoeren door het
      ter keuring aanbieden van een voertuig in bij ministeriële regeling vast te stellen gevallen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel86a
  - number: 86a.2
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld betreffende de wijze waarop de keuring wordt uitgevoerd.
      Deze regels kunnen inhouden dat verscherpt toezicht wordt gehouden indien blijkt dat er door een natuurlijke
      persoon die daartoe niet bevoegd is motorrijtuigen en aanhangwagens, waarvoor [artikel 72][ref1] geldt, met
      uitzondering van bussen als bedoeld in de Wet personenvervoer, aan een keuring worden onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel86a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: '87.1'
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie die erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87
  - number: '87.2'
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87
  - number: 87.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87
  - number: 87.2.b
    text: |-
      in strijd met de eisen, bedoeld in [artikel 75, eerste lid][ref1], of de regels, bedoeld in
      [artikel 76, derde lid][ref2], een keuringsbewijs afgeeft voor een motorrijtuig of een aanhangwagen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel76
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '76'
        hoofdstuk: V
        paragraaf: '3'
  - number: 87.2.c
    text: een keuringsrapport afgeeft voor een motorrijtuig of een aanhangwagen, waarvoor de erkenning niet geldt,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87
  - number: 87.2.d
    text: |-
      de verplichting, vervat in [artikel 85][ref1], [86, zesde lid][ref2], [90, vierde lid][ref3], of
      [91, vierde lid][ref4], niet nakomt,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel90
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel91
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '85'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '86'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '90'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '91'
        hoofdstuk: V
        paragraaf: '6'
  - number: 87.2.e
    text: |-
      weigert een keuringsbewijs af te geven voor een motorrijtuig of een aanhangwagen, waarvoor de erkenning
      geldt, hoewel dat voertuig bij een keuring, verricht met inachtneming van de regels, bedoeld in
      [artikel 76, derde lid][ref1], voldoet aan de eisen, bedoeld in [artikel 75, eerste lid][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '76'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: 87.2.f
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87
  - number: '87.3'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, onderdelen *a, d* en *f*, een erkenning
      schorsen voor een door hem daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87
  - number: '87.4'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, bepalen dat een wachttijd geldt voor het
      aanvragen van een erkenning van maximaal 30 maanden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87
  - number: 87a.1
    text: |-
      De Dienst Wegverkeer trekt de bevoegdheid voertuigen aan een keuring te onderwerpen in, indien degene aan wie die
      bevoegdheid is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87a
  - number: 87a.2
    text: |-
      De Dienst Wegverkeer kan de bevoegdheid voertuigen aan een keuring te onderwerpen intrekken of de daaraan verbonden
      voorschriften wijzigen, indien degene aan wie die bevoegdheid is verleend:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87a
  - number: 87a.2.a
    text: niet meer voldoet aan de voor de bevoegdheid voertuigen aan een keuring te onderwerpen gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87a
  - number: 87a.2.b
    text: |-
      in strijd met de regels, bedoeld in [artikel 76, derde lid][ref1], een voertuig aan een onderzoek onderwerpt,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel76
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '76'
        hoofdstuk: V
        paragraaf: '3'
  - number: 87a.2.c
    text: |-
      handelt in strijd met een of meer andere uit de bevoegdheid voertuigen aan een keuring te onderwerpen
      voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87a
  - number: 87a.3
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, onderdelen a en c, de bevoegdheid voertuigen
      aan een keuring te onderwerpen schorsen voor een door deze dienst daarbij vast te stellen termijn die ten hoogste
      twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel87a
  - number: '88.1'
    text: |-
      De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie. In dat
      geval wordt de kennisgeving na daartoe strekkend verzoek van de belanghebbende in een beschikking vastgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel88
  - number: '88.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld met betrekking tot het toezicht en het verscherpen
      daarvan, alsmede met betrekking tot het intrekken, wijzigen en schorsen van de erkenning of bevoegdheid tot keuren.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel88
  - number: '89'
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 83][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel83
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '83'
        hoofdstuk: V
        paragraaf: '5'
  - number: '90.1'
    text: |-
      Tegen een beschikking tot weigering van de afgifte van een keuringsbewijs kan een belanghebbende bezwaar maken of
      administratief beroep instellen bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel90
  - number: '90.2'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] kan tegen een beschikking tot weigering van
      de afgifte van een keuringsbewijs slechts bezwaar worden gemaakt of administratief beroep worden ingesteld terstond
      nadat de beschikking is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '90.3'
    text: |-
      Het bezwaar of administratief beroep wordt slechts in behandeling genomen indien het voertuig in de staat waarin
      het zich ten tijde van de keuring bevond, onmiddellijk op een door de Dienst Wegverkeer bepaalde plaats ter
      beschikking wordt gesteld ten behoeve van een herkeuring door een door de Dienst Wegverkeer aangewezen deskundige.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel90
  - number: '90.4'
    text: |-
      In afwijking van de [artikelen 7:15][ref1] en [7:28 van de Algemene wet bestuursrecht][ref2] dient bij de indiening
      van het bezwaar- of beroepschrift een bedrag ter vergoeding van de aan de herkeuring verbonden kosten te worden
      betaald. De hoogte van het bedrag en de wijze van betaling worden vastgesteld door de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '90.5'
    text: |-
      Degene die de beschikking tot weigering van de afgifte van een keuringsbewijs heeft gegeven, wordt in de
      gelegenheid gesteld bij de herkeuring aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel90
  - number: '90.6'
    text: |-
      Indien het voertuig volgens het oordeel van de deskundige voldoet aan de in [artikel 75][ref1] bedoelde eisen,
      geeft de Dienst Wegverkeer alsnog het aangevraagde keuringsbewijs af en wordt het in het vierde lid bedoelde
      bedrag terugbetaald aan de indiener van het bezwaar- of beroepschrift. Is in dit geval de beschikking tot weigering
      van de afgifte van een keuringsbewijs gegeven door een erkende natuurlijke persoon of rechtspersoon, dan is
      deze vorenbedoeld bedrag verschuldigd aan de Dienst Wegverkeer en gehouden dit te betalen op de door deze dienst
      vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: '91.1'
    text: |-
      Tegen een beschikking tot afgifte van een keuringsbewijs kan een belanghebbende bezwaar maken of administratief
      beroep instellen bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel91
  - number: '91.2'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] kan tegen een beschikking tot afgifte van
      een keuringsbewijs bezwaar worden gemaakt of administratief beroep worden ingesteld gedurende een bij algemene
      maatregel van bestuur te stellen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '91.3'
    text: |-
      Het bezwaar of administratief beroep wordt slechts in behandeling genomen indien het voertuig op een door de Dienst
      Wegverkeer bepaalde plaats ter beschikking wordt gesteld ten behoeve van een onderzoek door een door de Dienst
      Wegverkeer aangewezen deskundige.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel91
  - number: '91.4'
    text: |-
      In afwijking van de [artikelen 7:15][ref1] en [7:28 van de Algemene wet bestuursrecht][ref2] dient bij de indiening
      van het bezwaar- of beroepschrift een bedrag ter vergoeding van de aan het onderzoek verbonden kosten te worden
      betaald. De hoogte van het bedrag en de wijze van betaling worden vastgesteld door de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '91.5'
    text: |-
      Degene die de beschikking tot afgifte van een keuringsbewijs heeft gegeven, wordt in de gelegenheid gesteld bij het
      onderzoek aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel91
  - number: '91.6'
    text: |-
      Indien het voertuig volgens het oordeel van de deskundige ten tijde van de keuring op grond waarvan het
      keuringsbewijs is afgegeven, redelijkerwijze niet aan de keuringseisen kan hebben voldaan, daarbij in het
      bijzonder gelet op de termijn die is verstreken tussen de keuring en het onderzoek, verklaart de Dienst Wegverkeer
      het voor het voertuig afgegeven keuringsbewijs alsnog ongeldig en wordt het in het vierde lid bedoelde bedrag
      terugbetaald aan de indiener van het bezwaar- of beroepschrift. Is in dit geval de beschikking tot afgifte van
      een keuringsbewijs gegeven door een erkende natuurlijke persoon of rechtspersoon, dan is deze vorenbedoeld bedrag
      verschuldigd aan de Dienst Wegverkeer en gehouden dit te betalen op de door deze dienst vastgestelde wijze.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel91
  - number: '98'
    text: |-
      Indien in de bouw of inrichting van een voertuig dat ingevolge [hoofdstuk III][ref1] tot het verkeer op de weg is
      toegelaten, na die toelating wijziging is aangebracht, dient die wijziging, voorzover dit bij ministeriële regeling
      is bepaald, te zijn goedgekeurd voor toelating van het gewijzigde voertuig tot het verkeer op de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: '99.1'
    text: |-
      Goedkeuring wordt op aanvraag en tegen betaling op door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor
      door deze dienst vastgestelde tarief door deze dienst verleend, indien de aangebrachte wijziging bij een door deze
      dienst verrichte keuring heeft voldaan aan de ingevolge [hoofdstuk III][ref1] en [hoofdstuk V][ref2] voor deze
      goedkeuring vastgestelde eisen. De keuring kan mede omvatten die delen van het voertuig waarvoor de aangebrachte
      wijziging gevolgen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006622
        hoofdstuk: V
  - number: '99.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld betreffende het door de aanvrager voor de keuring
      ter beschikking stellen van het voertuig, het door de aanvrager overleggen van bescheiden en verstrekken van
      inlichtingen ter zake van de keuring alsmede betreffende de wijze waarop de keuring wordt verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel99
  - number: '99.3'
    text: |-
      In de bij ministeriële regeling aan te wijzen gevallen wordt voor het gewijzigde voertuig een nieuw kentekenbewijs
      afgegeven waarop melding wordt gemaakt van de goedgekeurde wijziging.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel99
  - number: '100.1'
    text: |-
      De goedkeuring voor een wijziging in de bouw of inrichting van een voertuig wordt door de Dienst Wegverkeer
      verleend zonder dat de in [artikel 99][ref1] bedoelde keuring heeft plaatsgevonden, indien door een daartoe door
      de Dienst Wegverkeer erkende natuurlijke persoon of rechtspersoon wordt gewaarborgd dat de aangebrachte wijziging
      voldoet aan de ingevolge [hoofdstuk III][ref2] en [hoofdstuk V][ref3] voor deze goedkeuring vastgestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '99'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0006622
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0006622
        hoofdstuk: V
  - number: '100.2'
    text: |-
      De erkenning geldt voor de in de erkenning aangegeven werkzaamheden ter zake van het wijzigen van de bouw of
      inrichting van voertuigen die behoren tot een in de erkenning aangewezen groep. De erkenning kan gelden voor
      bepaalde of voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel100
  - number: '100.3'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en kunnen
      met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel100
  - number: '101.1'
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door deze dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend aan de natuurlijke persoon of rechtspersoon
      die voldoet aan de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de organisatie
      van de aanvrager alsmede het proces volgens hetwelk de aanvrager zijn werkzaamheden verricht, alsmede de voor
      de werkzaamheden benodigde apparatuur. Ten aanzien van de voor de werkzaamheden benodigde apparatuur kan bij
      die ministeriële regeling de eis worden gesteld dat die apparatuur is goedgekeurd door een door Onze Minister
      aan te wijzen keuringsinstelling en met de in die regeling vast te stellen periodiciteit is onderzocht door deze
      keuringsinstelling dan wel door een door deze keuringsinstelling erkende onderzoeksgerechtigde en kunnen regels
      worden vastgesteld met betrekking tot de erkenning van onderzoeksgerechtigden. Bij ministeriële regeling kan worden
      bepaald dat middelen die worden gebruikt om deze apparatuur voor gebruik geschikt te maken zijn gecertificeerd
      door een door die keuringsinstelling erkende instelling en kunnen regels worden vastgesteld met betrekking tot
      die erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel101
  - number: '101.2'
    text: Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel101
  - number: '101.3'
    text: |-
      De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning op grond van
      [artikel 103, tweede lid][ref1], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel van zes maanden ingeval reeds twee of meer malen een dergelijke aan
      de aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel103
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '103'
        hoofdstuk: V
        paragraaf: '8'
  - number: '101.4'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, bepalen dat een wachttijd geldt voor het
      aanvragen van een erkenning van maximaal 30 maanden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel101
  - number: '102.1'
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing
      in de *Staatscourant*. Tot dit toezicht kan behoren het steekproefsgewijs keuren van door een erkende natuurlijke
      persoon of rechtspersoon aangebrachte wijzigingen in de bouw of inrichting van voertuigen. Voorts kan tot het
      toezicht behoren het periodiek controleren van de organisatie van degene aan wie de erkenning is verleend alsmede
      het proces volgens hetwelk hij zijn werkzaamheden verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel102
  - number: '102.2'
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel102
  - number: '102.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop het toezicht wordt
      gehouden en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend en van de eigenaar
      of houder van het voertuig waarvoor een keuring wordt geëist. Deze regels kunnen inhouden dat een verscherpt
      toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit de erkenning voortvloeiende
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel102
  - number: '102.4'
    text: |-
      De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie. In dat
      geval wordt de kennisgeving na daartoe strekkend verzoek van de belanghebbende in een beschikking vastgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel102
  - number: '103.1'
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie de erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel103
  - number: '103.2'
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel103
  - number: 103.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel103
  - number: 103.2.b
    text: |-
      de verplichtingen, vervat in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] en
      [artikel 102, tweede lid][ref2], niet nakomt, of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel102
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '102'
        hoofdstuk: V
        paragraaf: '8'
  - number: 103.2.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel103
  - number: '103.3'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel103
  - number: 103a
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld met betrekking tot het intrekken, wijzigen en schorsen
      van de erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel103a
  - number: '104'
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 100][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel100
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '100'
        hoofdstuk: V
        paragraaf: '8'
  - number: '105'
    text: |-
      Indien het voor een motorrijtuig of een aanhangwagen afgegeven kentekenbewijs ingevolge
      [artikel 58, tweede lid, onderdeel b of d][ref1], ongeldig is verklaard of is ingevorderd ingevolge
      [artikel 60, eerste lid, onderdeel b of c][ref2], dient het voertuig alvorens het kentekenbewijs door de Dienst
      Wegverkeer geldig kan worden verklaard of kan worden teruggegeven, te zijn goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '58'
        hoofdstuk: IV
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '60'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '106.1'
    text: |-
      De goedkeuring wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief door deze dienst verleend, indien het voertuig bij een door de dienst
      verrichte keuring heeft beantwoord aan de bij of krachtens deze wet vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel106
  - number: '106.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld betreffende het door de aanvrager voor de keuring
      ter beschikking stellen van het voertuig, het door de aanvrager overleggen van bescheiden en verstrekken van
      inlichtingen ter zake van de keuring alsmede betreffende de wijze waarop de keuring wordt verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel106
  - number: 106a.1
    text: |-
      De goedkeuring van een schadevoertuig na ongeldigverklaring of invordering van het kentekenbewijs kan door de
      Dienst Wegverkeer worden verleend zonder dat de in [artikel 106][ref1] bedoelde keuring heeft plaatsgevonden,
      indien door een daartoe door de Dienst Wegverkeer erkende natuurlijk persoon of rechtspersoon wordt gewaarborgd dat
      het voertuig voldoet aan de eisen, bedoeld in [artikel 106, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel106
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel106a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '106'
        hoofdstuk: V
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '106'
        hoofdstuk: V
        paragraaf: '9'
  - number: 106a.2
    text: |-
      De erkenning geldt voor de in de erkenning aangegeven werkzaamheden ter zake van voertuigen die behoren tot een in
      de erkenning aangewezen groep. De erkenning kan gelden voor bepaalde of onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel106a
  - number: 106a.3
    text: |-
      De [artikelen 100, derde lid][ref1], en [101 tot en met 103][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel101
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel106a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '100'
        hoofdstuk: V
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '101'
        hoofdstuk: V
        paragraaf: '8'
  - number: 106b
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 106a][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel106a
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel106b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 106a
        hoofdstuk: V
        paragraaf: 9a
  - number: 132e.1
    text: |-
      In het kader van het alcoholslotprogramma wordt uitsluitend gebruik gemaakt van een alcoholslot dat is voorzien
      van een typegoedkeuring, verleend door de Dienst Wegverkeer, of een daaraan bij ministeriële regeling gelijkgesteld
      alcoholslot. De typegoedkeuring van het alcoholslot en de daarbij behorende uitleesapplicatie wordt op aanvraag en
      tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door deze dienst vastgestelde
      tarief door deze dienst verleend, indien door de dienst is vastgesteld dat het alcoholslot aan de bij ministeriële
      regeling gestelde eisen voldoet en indien het productieproces van de alcoholsloten van het desbetreffende
      type is goedgekeurd. De [artikelen 22, derde en vierde lid][ref1], [22b][ref2], [23][ref3], [23a][ref4] en
      [25a tot en met 25e][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel22b
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel23a
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel25a
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 22b
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '23'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: 23a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: 25a
        hoofdstuk: III
        paragraaf: 2a
  - number: 132e.2
    text: |-
      Na verwijdering van het alcoholslot vindt controle van het uitgebouwde alcoholslot plaats door degene die
      overeenkomstig het goedgekeurde productieproces als bedoeld in het eerste lid produceert.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e
  - number: 132e.3
    text: |-
      Bij ministeriële regeling worden regels gesteld betreffende de aanvraag tot goedkeuring van een type alcoholslot,
      de eisen waaraan de alcoholsloten dienen te voldoen, de onderzoeken waaraan zij dienen te zijn onderworpen,
      het door de aanvrager ter beschikking stellen van alcoholsloten, de wijze waarop de overdracht van de gegevens
      uit het alcoholslot naar het alcoholslotregister plaatsvindt, het door de aanvrager overleggen van bescheiden
      en het verstrekken van inlichtingen ter zake van de keuring, het testrapport, de intrekking van een dergelijke
      goedkeuring, de controle van een alcoholslot als bedoeld in het tweede lid, en de onderzoeken waaraan het
      alcoholslot in dat kader wordt onderworpen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e
  - number: 132e.4
    text: |-
      De Dienst Wegverkeer, dan wel de door hem aangewezen technische dienst als bedoeld in het eerste lid, onderwerpt
      voorafgaand aan een eerste inbouw een bij ministeriële regeling vastgesteld aantal typegoedgekeurde alcoholsloten
      aan een steekproefsgewijze keuring. Hetzelfde geldt voor typegoedgekeurde alcoholsloten, ten aanzien waarvan
      een controle heeft plaatsgevonden als bedoeld in het tweede lid. Degene die overeenkomstig het goedgekeurde
      productieproces, bedoeld in het eerste lid, produceert, is verplicht zijn medewerking te verlenen aan deze
      steekproefsgewijze keuringen. Bij ministeriële regeling worden regels gesteld ten aanzien van de wijze waarop de
      in dit lid bedoelde keuringen worden uitgevoerd, het door de aanvrager ter beschikking stellen van alcoholsloten,
      het door de aanvrager overleggen van bescheiden en het verstrekken van inlichtingen ter zake van de keuring en de
      maatregelen die de Dienst Wegverkeer kan treffen. Intensivering van de steekproefsgewijze controle of het stellen
      van een termijn om de gebreken te herstellen, kunnen daarvan deel uitmaken.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e
  - number: 132e.5
    text: 'Bij ministeriële regeling kan worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e
  - number: 132e.5.a
    text: |-
      het voldoen aan de in het eerste lid gestelde eisen wordt aangetoond door middel van in die regels voorgeschreven
      apparatuur;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e
  - number: 132e.5.b
    text: die apparatuur is goedgekeurd door een door Onze Minister aangewezen keuringsinstelling;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e
  - number: 132e.5.c
    text: |-
      die apparatuur alleen kan worden goedgekeurd indien de in die regels genoemde technische specificaties van die
      apparatuur die noodzakelijk zijn om het periodieke onderzoek, bedoeld in onderdeel d, uit te kunnen voeren, op de
      in die regels aangegeven wijze bekend worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e
  - number: 132e.5.d
    text: |-
      die apparatuur met een in die regels vast te stellen periodiciteit is onderzocht door de in het eerste lid
      bedoelde keuringsinstelling, dan wel door een door Onze Minister of door deze keuringsinstelling aangewezen
      onderzoeksgerechtigde en dat de middelen die worden gebruikt om die apparatuur voor gebruik geschikt te maken, zijn
      gecertificeerd door een door die keuringsinstelling erkende instelling, en
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e
  - number: 132e.5.e
    text: |-
      bij de erkenning van een onderzoeksgerechtigde of instelling als bedoeld in onderdeel d, wordt voldaan aan de in
      die regels opgenomen voorschriften.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e
  - number: 132e.6
    text: |-
      Een type alcoholslot kan voor een typegoedkeuring worden aangeboden indien de aanvrager heeft aangetoond dat
      het alcoholslot een beschermingsniveau biedt dat naar het oordeel van de Dienst Wegverkeer, dan wel de door hem
      aangewezen technische dienst als bedoeld in het eerste lid, ten minste gelijkwaardig is aan het niveau dat met de
      in het derde lid bedoelde eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e
  - number: 132e.7
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e
  - number: 132e1.1
    text: Bij ministeriële regeling wordt bepaald wanneer een typegoedkeuring vervalt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e1
  - number: 132e1.2
    text: 'Intrekking van de typegoedkeuring vindt plaats indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e1
  - number: 132e1.2.a
    text: de producent van het desbetreffende type alcoholslot daarom verzoekt, of
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e1
  - number: 132e1.2.b
    text: |-
      de erkenning als bedoeld in [artikel 132f, eerste lid][ref1], door de Dienst Wegverkeer wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132e1.3
    text: |-
      Indien de steekproefsgewijze keuring als bedoeld in [artikel 132e, eerste of vierde lid][ref1], daartoe aanleiding
      geeft, dan wel indien een typegoedkeuring wordt ingetrokken, bepaalt de Dienst Wegverkeer de gevolgen voor reeds
      ingebouwde alcoholsloten van dat type. Indien wordt besloten dat reeds ingebouwde alcoholsloten moeten worden
      vervangen, dan bepaalt de Dienst Wegverkeer tevens de termijn waarbinnen die vervanging moet zijn gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132e
        hoofdstuk: VI
        paragraaf: '4'
        afdeling: '9'
  - number: 132e1.4
    text: |-
      Vanaf de datum waarop de eisen waaraan alcoholsloten moeten voldoen, zijn aangepast, mogen alcoholsloten van
      een overeenkomstig de oude eisen goedgekeurd type in het kader van het alcoholslotprogramma nog worden ingebouwd
      gedurende een bij ministeriële regeling vastgestelde periode.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e1
  - number: 132e1.5
    text: |-
      Bij ministeriële regeling wordt vastgelegd met ingang van welk tijdstip na de aanpassing van de in het vierde lid
      bedoelde eisen alle alcoholsloten moeten voldoen aan de aangepaste eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132e1
  - number: 132f.1
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is tot het in stand houden van een netwerk van werkplaatsen voor het inbouwen, het uitlezen, het testen,
      het kalibreren, het vervangen en het verwijderen van het door hem gevoerde alcoholslot, alsmede het verrichten van
      de daarmee samenhangende werkzaamheden. Bij de aanvraag van de in dit lid bedoelde erkenning kan in afwijking van
      de eisen gesteld in [artikel 132g, tweede lid, onderdelen b en d][ref1], worden volstaan met:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132g
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132g
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132f.1.a
    text: |-
      een alcoholslot dat overeenkomstig [artikel 132e][ref1] is goedgekeurd door de aangewezen keuringsinstelling en
      waarvoor de typegoedkeuring is aangevraagd of tegelijk met de aanvraag voor een erkenning als bedoeld in dit lid
      wordt aangevraagd, en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132e
        hoofdstuk: VI
        paragraaf: '4'
        afdeling: '9'
  - number: 132f.1.b
    text: |-
      een netwerk waarvan de vereiste landelijke dekking blijkt uit contracten afgesloten met natuurlijke personen of
      rechtspersonen die al een aanvraag voor een erkenning als bedoeld in [artikel 132k, eerste lid][ref1], hebben
      ingediend, dan wel tegelijk met de aanvraag voor een erkenning als bedoeld in dit lid indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132f.2
    text: De erkenning kan worden verleend voor bepaalde of onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132f
  - number: 132f.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gesteld die aan een erkenning worden verbonden en kunnen met
      betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132f
  - number: 132g.1
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door de dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend indien de natuurlijke persoon of
      rechtspersoon voldoet aan de bij ministeriële regeling vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132g
  - number: 132g.2
    text: 'De in het eerste lid bedoelde eisen betreffen onder meer:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132g
  - number: 132g.2.a
    text: de aanwezigheid van een mandaat namens de producent te mogen optreden;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132g
  - number: 132g.2.b
    text: |-
      de aanwezigheid van een typegoedkeuring of een afschrift daarvan, afgegeven door de Dienst Wegverkeer van het door
      of namens de aanvrager geproduceerd alcoholslot;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132g
  - number: 132g.2.c
    text: |-
      de aanwezigheid van een productieproces dat op basis van [artikel 132e, eerste of vijfde lid][ref1], door de Dienst
      Wegverkeer is goedgekeurd;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132e
        hoofdstuk: VI
        paragraaf: '4'
        afdeling: '9'
  - number: 132g.2.d
    text: |-
      het beschikken over een netwerk van werkplaatsen met een erkenning als bedoeld in [artikel 132k][ref1], waar
      het inbouwen, het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen of het verwijderen van
      alcoholsloten, alsmede de daarmee samenhangende werkzaamheden kunnen plaatsvinden. Dit netwerk dient een landelijke
      spreiding te hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132g.2.e
    text: de administratieve organisatie van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132g
  - number: 132g.2.f
    text: |-
      de wijze waarop de aanvrager ervoor zorg draagt dat de personen die de in [artikel 132k, eerste lid][ref1],
      bedoelde werkzaamheden verrichten of gaan verrichten, adequaat zijn opgeleid en periodiek worden bijgeschoold over
      de laatste ontwikkelingen, en dat ten bewijze hiervan een bewijs wordt afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132g.2.g
    text: |-
      andere instrumenten en hulpmiddelen die nodig zijn voor of gebruikt worden bij de uitvoering van de werkzaamheden
      als bedoeld in [artikel 132k, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132g.2.h
    text: |-
      de maatregelen die zullen worden getroffen voor het geval de erkenning geheel wordt ingetrokken op het terrein
      van de beschikbaarstelling van gegevens betreffende het alcoholslot vereist voor het uitlezen, het testen,
      het kalibreren, het onderhouden of het verwijderen van alcoholsloten, alsmede voor de daarmee samenhangende
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132g
  - number: 132g.3
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de aanvraag van de erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132g
  - number: 132g.4
    text: |-
      De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning is ingetrokken op grond van
      [artikel 132i, tweede lid][ref1], binnen een direct aan de datum van indiening van de aanvraag voorafgaande periode
      van twaalf weken, dan wel zes maanden ingeval reeds twee of meermalen een dergelijke aan de aanvrager verleende
      erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132i
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132i
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132h.1
    text: |-
      Met het toezicht op de naleving van de uit de erkenning, bedoeld in [artikel 132f][ref1], voortvloeiende
      verplichtingen zijn belast de bij besluit van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit
      wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132h.2
    text: |-
      Tot het in het eerste lid bedoelde toezicht kan behoren het periodiek controleren van de organisatie van
      de erkenninghouder, alsmede het uitvoeren van steekproeven op de wijze waarop de erkenninghouder de in
      [artikel 132f, eerste lid][ref1], bedoelde taken uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132h.3
    text: |-
      De erkenninghouder is gehouden tot betaling, op door de Dienst Wegverkeer vastgestelde wijze, van het door deze
      dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132h
  - number: 132h.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop het toezicht wordt
      gehouden en de wijze waarop de steekproef wordt georganiseerd. Deze regels kunnen inhouden dat een verscherpt
      toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit de erkenning voortvloeiende
      de verplichtingen en op welke wijze dat verscherpte toezicht dan plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132h
  - number: 132h.5
    text: |-
      De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie. In dat
      geval wordt de kennisgeving na daartoe strekkend verzoek van de belanghebbende in een beschikking vastgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132h
  - number: 132i.1
    text: |-
      De Dienst Wegverkeer trekt de erkenning, bedoeld in [artikel 132f, eerste lid][ref1], in indien degene aan wie de
      erkenning is verleend, daarom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132i.2
    text: |-
      De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend niet
      meer voldoet aan de voor de erkenning gestelde eisen of voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132i
  - number: 132i.3
    text: |-
      De Dienst Wegverkeer kan in een geval als bedoeld in het tweede lid een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132i
  - number: 132i.4
    text: |-
      In geval van schorsing van de erkenning stelt degene van wie de erkenning wordt geschorst in de bij ministeriële
      regeling aangegeven gevallen onverwijld de vereiste informatie en instrumenten benodigd voor het uitlezen, het
      testen, het kalibreren, het onderhouden en het verwijderen van de in [artikel 132f, eerste lid][ref1], bedoelde
      alcoholsloten ter beschikking van de Dienst Wegverkeer, alsmede de daartoe door de Dienst Wegverkeer aangewezen
      instantie of instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132i.5
    text: |-
      Degene van wie de erkenning wordt ingetrokken stelt onverwijld de vereiste informatie en instrumenten
      benodigd voor het uitlezen, het testen, het kalibreren, het onderhouden en het verwijderen van de in
      [artikel 132f, eerste lid][ref1], bedoelde alcoholsloten ter beschikking van de Dienst Wegverkeer, alsmede de
      daartoe door de Dienst Wegverkeer aangewezen instantie of instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132i.6
    text: De Dienst Wegverkeer stelt onverwijld het CBR in kennis van een opgelegde schorsing of een ingetrokken erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132i
  - number: 132i.7
    text: |-
      De Dienst Wegverkeer kan in de door de dienst vastgestelde gevallen de keuringsinstelling, bedoeld in
      [artikel 132e, eerste lid][ref1], in kennis stellen van een opgelegde schorsing of een ingetrokken erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132e
        hoofdstuk: VI
        paragraaf: '4'
        afdeling: '9'
  - number: 132i.8
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, bepalen dat een wachttijd geldt voor het
      aanvragen van een erkenning van maximaal 30 maanden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132i
  - number: 132i.9
    text: Bij ministeriële regeling kunnen nadere regels worden vastgesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132i
  - number: 132j
    text: |-
      Het is eenieder aan wie niet een erkenning als bedoeld in [artikel 132f][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132j
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132k.1
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is tot het inbouwen, het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen
      en het verwijderen van in [artikel 132f, eerste lid][ref1], bedoelde alcoholsloten, alsmede de daarmee
      samenhangende werkzaamheden. Bij de aanvraag van de in dit lid bedoelde erkenning kan in afwijking van
      [artikel 132l, tweede lid, onderdeel a][ref2], worden volstaan met een contract, dat is afgesloten met een
      natuurlijke persoon of rechtspersoon die een aanvraag als bedoeld in [artikel 132g, eerste lid][ref3], heeft
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132l
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel132g
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132k
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132l
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 132g
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132k.2
    text: |-
      Aan de erkenning kunnen bij ministeriële regeling aangewezen bevoegdheden worden verbonden. Een zodanige
      bevoegdheid maakt deel uit van de erkenning. Het in de [artikelen 132l tot en met 132o][ref1] ten aanzien van
      erkenningen bepaalde is van overeenkomstige toepassing op bedoelde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132l
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132k
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132l
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132k.3
    text: De erkenning kan worden verleend voor bepaalde of onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132k
  - number: 132k.4
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gesteld die aan een erkenning worden verbonden en kunnen met
      betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132k
  - number: 132l.1
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door de dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend indien de natuurlijke persoon of
      rechtspersoon voldoet aan de bij ministeriële regeling vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132l
  - number: 132l.2
    text: 'De in het eerste lid bedoelde eisen betreffen onder meer:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132l
  - number: 132l.2.a
    text: |-
      het contract dat is afgesloten met de erkenninghouder, bedoeld in [artikel 132f, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132l.2.b
    text: de administratieve organisatie van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132l
  - number: 132l.2.c
    text: het proces volgens hetwelk de aanvrager zijn werkzaamheden verricht;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132l
  - number: 132l.2.d
    text: |-
      de eisen waaraan de werkplaats of werkplaatsen van de aanvrager dient of dienen te voldoen, eisen ten aanzien van
      datacommunicatie hieronder begrepen;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132l
  - number: 132l.2.e
    text: |-
      de wijze waarop de aanvrager er voor zorg draagt dat de personen die door hem belast zijn met het inbouwen,
      het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen of het verwijderen van alcoholsloten,
      alsmede de daarmee samenhangende werkzaamheden, adequaat zijn opgeleid en worden geïnformeerd over de laatste
      ontwikkelingen;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132l
  - number: 132l.2.f
    text: |-
      de beschikbaarheid van een persoon of personen, die in het bezit is of zijn van een tegen betaling
      van een door de Dienst Wegverkeer vastgesteld tarief door die dienst afgegeven bewijs dat zij de in
      [artikel 132k, eerste lid][ref1], bedoelde werkzaamheden mogen verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132l.2.g
    text: |-
      de aan- en afmelding bij de Dienst Wegverkeer van de personen die bevoegd zijn tot het inbouwen, het uitlezen,
      het testen, het kalibreren, het onderhouden, het vervangen of het verwijderen van alcoholsloten, en de daarmee
      samenhangende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132l
  - number: 132l.3
    text: |-
      De bij ministeriële regeling gestelde eisen, bedoeld in het eerste lid, kunnen betrekking hebben op de op de voor
      de werkzaamheden benodigde apparatuur.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132l
  - number: 132l.4
    text: |-
      Bij het inbouwen, het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen of het verwijderen van
      het alcoholslot worden de bij of krachtens algemene maatregel van bestuur aangegeven gegevens vastgelegd in het in
      [artikel 129a][ref1] bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel129a
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 129a
        hoofdstuk: VI
        afdeling: 8a
  - number: 132l.5
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132l
  - number: 132l.6
    text: |-
      De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning is ingetrokken op grond van
      [artikel 132n, tweede lid][ref1], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel zes maanden ingeval reeds twee of meermalen een dergelijke aan de
      aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132n
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132n
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132m.1
    text: |-
      Met het toezicht op de naleving van de uit de erkenning, bedoeld in [artikel 132k, eerste lid][ref1],
      voortvloeiende verplichtingen zijn belast de bij besluit van de Dienst Wegverkeer aangewezen ambtenaren. Van een
      zodanig besluit wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132m
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132m.2
    text: |-
      Tot het in het eerste lid bedoelde toezicht kan behoren het periodiek controleren van de organisatie van de
      erkenninghouder, alsmede het uitvoeren van steekproeven op de wijze waarop de erkenninghouder, alsmede de bij
      hem in dienst zijnde personen die overeenkomstig [artikel 132l][ref1] zijn belast met de uitvoering van de
      werkzaamheden als bedoeld in [artikel 132k, eerste lid][ref2], die taken uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132l
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132m
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132l
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132m.3
    text: |-
      De eigenaar of houder van een motorrijtuig dat voorwerp is van het in het tweede lid bedoelde toezicht is verplicht
      het motorrijtuig beschikbaar te houden op de plaats waar de in het eerste lid bedoelde werkzaamheden worden
      uitgevoerd. Deze verplichting geldt tot ten hoogste 90 minuten nadat de erkenninghouder de daarvoor in aanmerking
      komende gegevens heeft geregistreerd in het in [artikel 129a][ref1] bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel129a
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132m
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 129a
        hoofdstuk: VI
        afdeling: 8a
  - number: 132m.4
    text: |-
      Het derde lid en het zesde lid, eerste volzin, zijn van overeenkomstige toepassing in geval het toezicht door de
      Dienst Wegverkeer plaatsvindt op grond van [artikel 158][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel158
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132m
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '158'
        hoofdstuk: IX
  - number: 132m.5
    text: |-
      De erkenninghouder is gehouden tot betaling, op door de Dienst Wegverkeer vastgestelde wijze, van het door deze
      dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132m
  - number: 132m.6
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop het toezicht wordt
      gehouden en de wijze waarop de steekproef wordt georganiseerd. Deze regels kunnen inhouden dat een verscherpt
      toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit de erkenning voortvloeiende
      de verplichtingen en op welke wijze dat verscherpte toezicht dan plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132m
  - number: 132m.7
    text: |-
      De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie. In dat
      geval wordt de kennisgeving na daartoe strekkend verzoek van de belanghebbende in een beschikking vastgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132m
  - number: 132n.1
    text: |-
      De Dienst Wegverkeer trekt een erkenning als bedoeld in [artikel 132k][ref1], eerste lid in:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132n
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132n.1.a
    text: indien degene aan wie de erkenning is verleend, daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132n
  - number: 132n.1.b
    text: |-
      indien de erkenning, bedoeld in [artikel 132f, eerste lid][ref1], wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132n
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132n.2
    text: |-
      De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend niet
      meer voldoet aan de aan de erkenning gestelde eisen of voorschriften.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132n
  - number: 132n.3
    text: |-
      De Dienst Wegverkeer kan in een geval als bedoeld in het tweede lid een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132n
  - number: 132n.4
    text: |-
      Bij de schorsing of de intrekking van de erkenning in de gevallen, bedoeld in het eerste lid, onderdeel a, en
      het tweede lid, worden de lopende verplichtingen van de erkenninghouder betreffende het uitlezen, het testen,
      het kalibreren, het onderhouden en het verwijderen van het alcoholslot, alsmede de daarmee samenhangende
      informatieverplichtingen, voortvloeiend uit het bij of krachtens deze wet bepaalde, verricht door een door
      erkenninghouder als bedoeld in [artikel 132f, eerste lid][ref1], te bepalen natuurlijke persoon of rechtspersoon of
      instantie die beschikt over de in [artikel 132k, eerste lid][ref2], bedoelde erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132n
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132n.5
    text: |-
      Bij intrekking van de erkenning, bedoeld in [artikel 132f, eerste lid][ref1], worden de lopende verplichtingen
      van de erkenninghouder betreffende het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen en
      het verwijderen van het alcoholslot, alsmede de daarmee samenhangende informatieverplichtingen, voortvloeiend uit
      het bij of krachtens deze wet bepaalde verricht door een daartoe door de Dienst Wegverkeer aangewezen instantie of
      instanties. [Artikel 132i, vijfde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132i
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132n
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132i
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132n.6
    text: |-
      De Dienst Wegverkeer kan in de door de dienst vastgestelde gevallen de in [artikel 132e][ref1] bedoelde
      keuringsinstelling in kennis stellen van een opgelegde schorsing of een ingetrokken erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132n
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132e
        hoofdstuk: VI
        paragraaf: '4'
        afdeling: '9'
  - number: 132n.7
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, bepalen dat een wachttijd geldt voor het
      aanvragen van een erkenning van maximaal 30 maanden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132n
  - number: 132n.8
    text: Bij ministeriële regeling kunnen nadere regels worden vastgesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132n
  - number: 132o
    text: |-
      Het is eenieder aan wie niet een erkenning als bedoeld in [artikel 132k][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel132o
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 145a.1
    text: 'In dit hoofdstuk wordt verstaan onder de richtlijn: de bij ministeriële regeling aangewezen richtlijn.'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel145a
  - number: 145a.2
    text: |-
      Een wijziging van de richtlijn, bedoeld in het eerste lid, gaat voor de toepassing van dit hoofdstuk gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel145a
  - number: 145b.1
    text: |-
      Een elektronisch heffingssysteem als bedoeld in artikel 2, eerste lid, van de richtlijn, dat na 31 december 2006
      in gebruik wordt genomen, is gebaseerd op één of meer van de technologieën, bedoeld in artikel 2, eerste lid, van
      de richtlijn.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel145b
  - number: 145b.2
    text: Het eerste lid geldt niet voor een heffingssysteem als bedoeld in artikel 1, tweede lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel145b
  - number: 145c.1
    text: |-
      Op een weg waar tarieven voor het gebruik van de weg elektronisch worden geïnd, wordt een Europese elektronische
      tolheffingsdienst aangeboden, die voldoet aan de artikelen 1, derde lid, 3, eerste lid en 4, eerste, derde en
      achtste lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel145c
  - number: 145c.2
    text: |-
      Een Europese elektronische tolheffingssdienst wordt aangeboden uiterlijk met ingang van een bij ministeriële
      regeling te bepalen tijdstip, dat voor verschillende categorieën voertuigen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel145c
  - number: 145d
    text: |-
      Een exploitant stelt vanaf het in [artikel 145c, tweede lid][ref1], vastgestelde tijdstip aan gebruikers apparatuur
      ter beschikking die in het voertuig kan worden ingebouwd en voldoet aan de eisen, bedoeld in artikel 2, tweede lid,
      van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel145c
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel145d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 145c
        hoofdstuk: VIA
        paragraaf: '3'
  - number: 145e
    text: |-
      Bij ministeriële regeling kunnen ter uitvoering van de richtlijn aanvullende regels worden gesteld met betrekking
      tot de in dit hoofdstuk geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel145e
  - number: '146'
    text: |-
      Onze Minister kan, met inachtneming van verdragen en van besluiten van volkenrechtelijke organisaties of van één of
      meer instellingen van de Europese Unie, al dan niet gezamenlijk, van bepalingen van deze wet vrijstelling verlenen
      voor het gebruik van de weg ten behoeve van openbare diensten.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel146
  - number: '147.1'
    text: |-
      Onze Minister kan, met inachtneming van verdragen en van besluiten van volkenrechtelijke organisaties of van één of
      meer instellingen van de Europese Unie, al dan niet gezamenlijk, van het bepaalde krachtens deze wet vrijstelling
      verlenen voor het gebruik van de weg ten behoeve van openbare of door Onze Minister daarmee gelijk te stellen
      diensten.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel147
  - number: '147.2'
    text: |-
      Onze Minister kan van het bepaalde krachtens deze wet vrijstelling verlenen voor het gebruik van de weg ten
      behoeve van particuliere geld- en waardetransportbedrijven waaraan een vergunning is verleend als bedoeld in
      [artikel 3, aanhef en onder c, van de Wet particuliere beveiligingsorganisaties en recherchebureaus][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel3
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '3'
  - number: '148.1'
    text: |-
      Van het in [artikel 10, eerste lid][ref1], vervatte verbod kan overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels ontheffing worden verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel10
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '10'
        hoofdstuk: II
        paragraaf: '1'
  - number: 148.1.a
    text: voor wegen onder beheer van het Rijk door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel148
  - number: 148.1.b
    text: |-
      voor andere wegen door gedeputeerde staten. In afwijking hiervan wordt, indien de wegen waarvoor de ontheffing
      wordt gevraagd, alle zijn gelegen binnen één gemeente, de ontheffing verleend door burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel148
  - number: '148.2'
    text: |-
      De in het eerste lid bedoelde ontheffing kan slechts worden verleend indien wordt aangetoond dat maatregelen zijn
      getroffen ter voorkoming van deelneming aan de wedstrijd zonder dat de burgerrechtelijke aansprakelijkheid voor
      de schade waartoe het gebruik van motorrijtuigen tijdens de wedstrijd aanleiding kan geven, is gedekt door een
      verzekering overeenkomstig de [Wet aansprakelijkheidsverzekering motorrijtuigen][ref1]. De verzekering dient mede
      te dekken de aansprakelijkheid van degenen die de wedstrijd organiseren. Deze voorwaarde geldt niet ten aanzien van
      degene wiens aansprakelijkheid ten laste van de Staat komt.


      [ref1]: https://wetten.overheid.nl/BWBR0002415
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0002415
  - number: '149.1'
    text: |-
      Van het bepaalde krachtens deze wet kan in de krachtens deze wet aangewezen gevallen overeenkomstig krachtens deze
      wet vastgestelde regels ontheffing worden verleend:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149
  - number: 149.1.a
    text: voor wegen onder beheer van het Rijk door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149
  - number: 149.1.b
    text: voor wegen onder beheer van een provincie door gedeputeerde staten;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149
  - number: 149.1.c
    text: |-
      voor wegen onder beheer van een waterschap door het algemeen bestuur of, krachtens besluit van het algemeen
      bestuur, door het dagelijks bestuur;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149
  - number: 149.1.d
    text: |-
      voor andere wegen door burgemeester en wethouders of krachtens besluit van hen, door een door hen ingestelde
      bestuurscommissie of het dagelijks bestuur van een deelgemeente.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149
  - number: '149.2'
    text: |-
      In afwijking van het eerste lid kan door Onze Minister ontheffing worden verleend van het gebruik van autogordels
      en kinderbeveiligingsmiddelen. Bij of krachtens algemene maatregel van bestuur kunnen terzake nadere regels worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149
  - number: 149a.1
    text: |-
      In dit artikel, [artikel 149b][ref1] en de op deze artikelen berustende bepalingen wordt verstaan onder
      wegbeheerder: het ingevolge [artikel 149, eerste lid][ref2], tot het verlenen van een ontheffing bevoegde gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149b
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel149
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149b
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '149'
        hoofdstuk: VII
  - number: 149a.2
    text: |-
      In afwijking van [artikel 149, eerste lid][ref1], kan uitsluitend door de Dienst Wegverkeer ontheffing worden
      verleend of geweigerd van het bepaalde krachtens [artikel 13][ref2] en [artikel 71][ref3], in de bij algemene
      maatregel van bestuur aangewezen gevallen overeenkomstig bij of krachtens algemene maatregel van bestuur
      vastgestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel71
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '149'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '13'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
  - number: 149a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de partijen waarmee en de
      wijze waarop de Dienst Wegverkeer periodiek overleg voert met betrekking tot de uitvoering van dit artikel en
      [artikel 149b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149b
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149b
        hoofdstuk: VII
  - number: 149a.4
    text: |-
      De kosten die samenhangen met de behandeling van de aanvraag en de verlening van de ontheffing, alsmede de
      kosten die samenhangen met het verrichten van onderzoeken en met daarbij behorende afgifte van documenten
      ten behoeve van de ontheffingverlening worden ten laste gebracht van de aanvrager. Bij de toepassing van
      [artikel 4b, eerste lid, onderdeel n][ref1], met betrekking tot deze kosten kan worden bepaald dat de vergoeding
      van de kosten voorafgaand aan de behandeling van de aanvraag wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4b
        hoofdstuk: IA
        paragraaf: '2'
  - number: 149a.5
    text: |-
      Ten behoeve van de ontheffingverlening, bedoeld in het tweede lid, verwerkt de Dienst Wegverkeer gegevens met
      betrekking tot aanvrager, voertuig en kenteken die zijn opgenomen in de aanvragen voor ontheffingen en in afgegeven
      ontheffingen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149a
  - number: 149a.6
    text: |-
      Aan de toezichthouders bedoeld in [artikel 158][ref1] en aan de wegbeheerders worden op de door de Dienst
      Wegverkeer te bepalen wijze desgevraagd de gegevens met betrekking tot de inhoud van de afgegeven en geweigerde
      ontheffingen en de gegevens met betrekking tot het aantal en de aard van de ontheffingen verstrekt, die zij voor de
      uitoefening van hun taak behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel158
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '158'
        hoofdstuk: IX
  - number: 149b.1
    text: |-
      De wegbeheerder verstrekt aan de Dienst Wegverkeer ten behoeve van de ontheffingverlening, bedoeld in
      [artikel 149a, tweede lid][ref1], de bij of krachtens algemene maatregel van bestuur vastgestelde gegevens
      betreffende de infrastructuur en overige informatie op de bij of krachtens die algemene maatregel van bestuur
      vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149a
        hoofdstuk: VII
  - number: 149b.2
    text: |-
      In de bij of krachtens algemene maatregel van bestuur aangewezen gevallen behoeft de Dienst Wegverkeer voor de in
      [artikel 149a, tweede lid][ref1], bedoelde ontheffing de toestemming van de wegbeheerder. In deze gevallen wordt de
      toestemming verleend op basis van een door de Dienst Wegverkeer in overleg met de betrokken wegbeheerder opgestelde
      ontwerp-ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149a
        hoofdstuk: VII
  - number: 149b.3
    text: |-
      De wegbeheerder kan uitsluitend de toestemming weigeren, indien dat gerechtvaardigd is met het oog op de in
      [artikel 2, eerste en tweede lid][ref1], omschreven belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: 149b.4
    text: |-
      Bij het verstrekken van gegevens en informatie, bedoeld in het eerste lid, kan de wegbeheerder aangeven dat aan
      de door de Dienst Wegverkeer te verlenen ontheffing beperkingen of voorschriften worden verbonden, indien dat
      gerechtvaardigd is met het oog op de bescherming van de in [artikel 2, eerste en tweede lid][ref1], omschreven
      belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: 149b.5
    text: |-
      De Dienst Wegverkeer trekt verleende ontheffingen in of wijzigt deze voorzover de door de wegbeheerder ingevolge
      het eerste lid verstrekte gegevens of andere door hem aan de Dienst Wegverkeer verstrekte informatie daartoe
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149b
  - number: 149b.6
    text: |-
      Voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] worden als
      één besluit aangemerkt de ontheffing of de weigering daarvan door de Dienst Wegverkeer en de toestemming
      onderscheidenlijk de weigering daarvan door de wegbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: 149b.7
    text: |-
      De wegbeheerder ontvangt voor het verstrekken van gegevens en informatie, bedoeld in het eerste lid, en voor
      het verlenen van toestemming, bedoeld in het tweede lid, van de Dienst Wegverkeer een bij ministeriële regeling
      vastgestelde vergoeding, die is gebaseerd op het aantal en de aard van de verleende ontheffingen voor wegen die
      onder zijn beheer staan.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel149b
  - number: '150.1'
    text: |-
      Een vrijstelling of ontheffing kan onder beperkingen worden verleend. Aan een vrijstelling of ontheffing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel150
  - number: '150.2'
    text: Het is verboden te handelen in strijd met de aan een vrijstelling of ontheffing verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel150
  - number: '151'
    text: |-
      Onverminderd [artikel 149a][ref1] kunnen bij algemene maatregel van bestuur regels worden vastgesteld omtrent het
      ten laste van de aanvrager van een ontheffing brengen van de aan de behandeling van de aanvraag verbonden kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149a
        hoofdstuk: VII
  - number: 151a
    text: |-
      Voor zover dit noodzakelijk is voor het verlenen van ontheffingen als bedoeld in
      [artikel 149, tweede lid, aanhef en onder a][ref1], verwerkt Onze Minister persoonsgegevens betreffende iemands
      gezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '149'
        hoofdstuk: VII
  - number: 151b
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151b
  - number: 151b.a
    text: 'richtlijn vakbekwaamheid bestuurders: de bij ministeriële regeling aangewezen richtlijn;'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151b
  - number: 151b.b
    text: |-
      bestuurder: degene die vervoer over de weg verricht met een voertuig dat behoort tot een categorie waarop de
      richtlijn vakbekwaamheid bestuurders van toepassing is en die:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151b
  - number: 151b.b.1°
    text: ingezetene is van een lidstaat van de Europese Unie, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151b
  - number: 151b.b.2°
    text: |-
      ingezetene is van een land buiten de Europese Unie en werkzaam is voor een binnen de Europese Unie gevestigde
      onderneming;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151b
  - number: 151b.c
    text: |-
      basiskwalificatie: het opleidings- en kennisniveau dat de in de richtlijn vakbekwaamheid bestuurders aangewezen
      onderwerpen en praktische vaardigheden omvat;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151b
  - number: 151b.d
    text: 'getuigschrift van vakbekwaamheid: document dat dient als bewijs dat de houder de basiskwalificatie heeft behaald;'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151b
  - number: 151b.e
    text: |-
      nascholing: periodiek opleidingstraject dat in de richtlijn vakbekwaamheid bestuurders aangewezen onderwerpen en
      praktische vaardigheden omvat;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151b
  - number: 151b.f
    text: |-
      getuigschrift van nascholing: document dat dient als bewijs dat de houder de nascholing met goed gevolg heeft
      voltooid;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151b
  - number: 151b.g
    text: |-
      aangewezen exameninstantie: persoon of instelling als bedoeld in [artikel 151f, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151f
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151f
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 151b.h
    text: |-
      erkend opleidingscentrum: opleidingscentrum als bedoeld in [artikel 151f, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151f
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151f
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 151b.i
    text: |-
      gewone verblijfplaats: de verblijfplaats zoals omschreven in artikel 14, derde lid, van verordening (EEG) nr.
      3821/85 van de Raad van de Europese Gemeenschappen van 20 december 1985 betreffende het controleapparaat in het
      wegvervoer (PbEG L 370).
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151b
  - number: 151c.1
    text: |-
      Het is verboden als bestuurder op te treden zonder te beschikken over een ingevolge de richtlijn vakbekwaamheid
      bestuurders vereist geldig getuigschrift.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151c
  - number: 151c.2
    text: |-
      Het verbod in het eerste lid geldt niet voor bestuurders die in de richtlijn vakbekwaamheid bestuurders zijn
      vrijgesteld van de verplichting tot het behalen van de basiskwalificatie.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151c
  - number: 151c.3
    text: |-
      Een door de bevoegde autoriteit van een lidstaat van de Europese Unie overeenkomstig de richtlijn vakbekwaamheid
      bestuurders aan een bestuurder afgegeven rijbewijs of kwalificatiekaart bestuurder, voorzien van de in die
      richtlijn bedoelde communautaire code, geldt als een ingevolge die richtlijn vereist getuigschrift indien de code
      zijn geldigheid nog niet heeft verloren.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151c
  - number: 151c.4
    text: |-
      Een in [artikel 151b, onderdeel b, onder 2°][ref1], bedoelde bestuurder die beschikt over de volgende documenten,
      voldoet aan de ingevolge de richtlijn vakbekwaamheid bestuurders gestelde vereisten:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151b
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151b
        hoofdstuk: VIIA
        paragraaf: '1'
  - number: 151c.4.a
    text: |-
      indien hij goederenvervoer over de weg verricht: een bestuurdersattest als bedoeld in verordening (EEG) nr.
      881/92 van de Raad van Europese Gemeenschappen van 26 maart 1992 betreffende de toegang tot de markt van het
      goederenvervoer over de weg in de Gemeenschap van of naar het grondgebied van een lidstaat of over het grondgebied
      van meer lidstaten (PbEG L 95);
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151c
  - number: 151c.4.b
    text: |-
      indien hij personenvervoer over de weg verricht: een nationaal certificaat waarvan de lidstaten van de Europese
      Unie de geldigheid op hun grondgebied onderling erkennen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151c
  - number: 151d.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van de richtlijn vakbekwaamheid bestuurders
      regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151d
  - number: 151d.1.a
    text: een stelsel van basiskwalificatie;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151d
  - number: 151d.1.b
    text: een stelsel van nascholing.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151d
  - number: 151d.2
    text: 'Bij de in het eerste lid bedoelde regels kan in elk geval worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151d
  - number: 151d.2.a
    text: |-
      een bestuurder die het getuigschrift van vakbekwaamheid heeft behaald, bedoeld in richtlijn nr. 96/26/EG van
      de Raad van de Europese Unie van 29 april 1996 inzake de toegang tot het beroep van ondernemer van goederen-,
      respectievelijk personenvervoer over de weg, nationaal en internationaal, en inzake wederzijdse erkenning
      van diploma’s, certificaten en andere titels ter vergemakkelijking van de uitoefening van het recht van vrije
      vestiging van bedoelde vervoersondernemers (PbEG L 124), is vrijgesteld van bij die regels bepaalde examens tot het
      verkrijgen van het getuigschrift van vakbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151d
  - number: 151d.2.b
    text: |-
      een bestuurder die kan aantonen in Nederland een opleiding van ten minste zes maanden tot het verkrijgen van een
      getuigschrift van vakbekwaamheid te volgen, op Nederlands grondgebied voor ten hoogste drie jaar is vrijgesteld van
      de verplichting over een getuigschrift van vakbekwaamheid te beschikken.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151d
  - number: 151e.1
    text: |-
      Toegang tot een examen gericht op het behalen van een getuigschrift van vakbekwaamheid of tot de opleiding gericht
      op het behalen van het getuigschrift van nascholing heeft degene die aan bij of krachtens algemene maatregel van
      bestuur gestelde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151e
  - number: 151e.2
    text: |-
      Voor toegang tot een examen gericht op het behalen van een getuigschrift van vakbekwaamheid is het bezit van het
      overeenkomstige rijbewijs niet vereist.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151e
  - number: 151f.1
    text: |-
      Een examen gericht op het behalen van de basiskwalificatie wordt afgelegd bij een bij ministeriële regeling
      aangewezen persoon of instelling, die onder zijn verantwoordelijkheid voor onderdelen van dat examen anderen kan
      inschakelen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151f
  - number: 151f.2
    text: |-
      Nascholing wordt georganiseerd door een door de aangewezen exameninstantie voor het verrichten van nascholing
      erkend opleidingscentrum.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151f
  - number: 151f.3
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151f
  - number: 151f.3.a
    text: de taken, bevoegdheden en werkwijze van de aangewezen exameninstantie;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151f
  - number: 151f.3.b
    text: de wijze waarop erkenning als opleidingscentrum geschiedt;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151f
  - number: 151f.3.c
    text: de eisen waaraan voldaan moet worden om de erkenning als opleidingscentrum te verkrijgen en te behouden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151f
  - number: 151f.4
    text: |-
      Nascholing georganiseerd door een erkend opleidingscentrum behoeft de certificering van de aangewezen
      exameninstantie.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151f
  - number: 151f.5
    text: |-
      De in het vierde lid bedoelde certificering vindt plaats indien de nascholing voldoet aan de bij ministeriële
      regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151f
  - number: 151g.1
    text: 'Een bestuurder behaalt de basiskwalificatie in Nederland indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151g
  - number: 151g.1.a
    text: hij ingezetene is van een lidstaat van de Europese Unie en in Nederland zijn gewone verblijfplaats heeft, of
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151g
  - number: 151g.1.b
    text: |-
      hij ingezetene is van een land buiten de Europese Unie en werkzaam is voor een in Nederland gevestigde onderneming
      of beschikt over een tewerkstellingsvergunning als bedoeld in de [Wet arbeid vreemdelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151g
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 151g.2
    text: |-
      Een bestuurder kan de nascholing in Nederland volgen indien hij in Nederland zijn gewone verblijfplaats heeft of in
      Nederland werkzaam is, dan wel in een andere lidstaat van de Europese Unie indien hij aldaar werkzaam is.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151g
  - number: 151g.3
    text: |-
      Een bestuurder die in Nederland de basiskwalificatie behaalt of de nascholing met goed gevolg voltooit en houder
      is van een Nederlands rijbewijs ontvangt het daarbij behorende getuigschrift van vakbekwaamheid dan wel het
      getuigschrift van nascholing in de vorm van vermelding van de in de richtlijn vakbekwaamheid bestuurders bedoelde
      communautaire code naast de overeenkomstige rijbewijscategorieën op het rijbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151g
  - number: 151g.4
    text: |-
      Een bestuurder die in Nederland de basiskwalificatie behaalt of de nascholing met goed gevolg voltooit en op dat
      moment geen houder is van een in Nederland afgegeven geldig rijbewijs ontvangt als bewijs daarvan een certificaat,
      met een geldigheidsduur gelijk aan die van een getuigschrift van vakbekwaamheid onderscheidenlijk een getuigschrift
      van nascholing, dat hij kan gebruiken om bij een bevoegde autoriteit van een lidstaat van de Europese Unie een
      verzoek in te dienen om op een door die lidstaat aan de desbetreffende bestuurder afgegeven of nog af te geven
      rijbewijs of kwalificatiekaart bestuurder de in de richtlijn vakbekwaamheid bestuurders bedoelde communautaire code
      te vermelden.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151g
  - number: 151g.5
    text: |-
      Op een bij of krachtens algemene maatregel van bestuur te bepalen wijze wordt door de aangewezen exameninstantie
      in het in [artikel 126][ref1] bedoelde register geregistreerd dat een bestuurder die houder is van een Nederlands
      rijbewijs de basiskwalificatie heeft behaald onderscheidenlijk met goed gevolg de nascholing heeft voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '126'
        hoofdstuk: VI
        afdeling: '8'
  - number: 151g.6
    text: |-
      Een erkend opleidingscentrum meldt op een bij of krachtens algemene maatregel van bestuur te bepalen wijze aan de
      aangewezen exameninstantie welke onderdelen van de nascholing een bestuurder met goed gevolg heeft voltooid.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151g
  - number: 151g.7
    text: |-
      Een in het derde lid bedoeld getuigschrift wordt afgegeven door de aangewezen exameninstantie en uitgereikt door
      degene die belast is met de afgifte van rijbewijzen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151g
  - number: 151g.8
    text: |-
      Het in het vierde lid bedoelde certificaat wordt afgegeven en uitgereikt door de aangewezen exameninstantie en door
      deze instantie geregistreerd in het in [artikel 126][ref1] bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '126'
        hoofdstuk: VI
        afdeling: '8'
  - number: 151h
    text: 'Bij ministeriële regeling kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151h
  - number: 151h.a
    text: de vermelding op het rijbewijs van de communautaire code, bedoeld in de richtlijn vakbekwaamheid bestuurders;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151h
  - number: 151h.b
    text: |-
      het in overeenstemming met de richtlijn vakbekwaamheid bestuurders vastgestelde tijdschema dat een bestuurder moet
      volgen bij de nascholing;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151h
  - number: 151h.c
    text: |-
      de certificering bedoeld in [artikel 151f, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151f
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151f
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 151h.d
    text: |-
      het model voor een certificaat als bedoeld in [artikel 151g, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 151h.e
    text: |-
      de wijze waarop een bestuurder die in een van de andere lidstaten van de Europese Unie de basiskwalificatie
      heeft behaald of de nascholing met goed gevolg heeft voltooid door middel van de daarbij behorende bewijsstukken,
      afgegeven door bevoegde autoriteiten van die lidstaten, via de aangewezen exameninstantie een aanvraag kan indienen
      om in Nederland een getuigschrift als bedoeld in [artikel 151g, derde lid][ref1], te verkrijgen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 151h.f
    text: |-
      de wijze waarop de bevoegde autoriteiten van de andere lidstaten van de Europese Unie via de aangewezen
      exameninstantie geautoriseerde informatie kunnen verkrijgen over de door een bestuurder in Nederland behaalde
      basiskwalificatie en over een door hem in Nederland geheel of gedeeltelijk met goed gevolg voltooide nascholing;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151h
  - number: 151h.g
    text: |-
      het model voor een nationaal certificaat als bedoeld in [artikel 151c, vierde lid, onderdeel b][ref1], de afgifte
      en de kosten van een dergelijk certificaat en de wijze waarop de erkenning van nationale certificaten die zijn
      afgegeven door andere lidstaten van de Europese Unie tot stand komt;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151c
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151c
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 151h.h
    text: |-
      de mate waarin en de wijze waarop de aangewezen exameninstantie in verband met de haar in dit hoofdstuk opgedragen
      taken toegang heeft tot het in [artikel 126][ref1] bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '126'
        hoofdstuk: VI
        afdeling: '8'
  - number: 151i.1
    text: |-
      De houder van een getuigschrift van vakbekwaamheid of een getuigschrift van nascholing dat zijn geldigheid heeft
      verloren doordat het niet binnen de in de richtlijn vakbekwaamheid bestuurders bedoelde termijn na afgifte is
      aangevuld met een met goed gevolg voltooide nascholing kan een nieuw getuigschrift van nascholing verwerven door de
      nascholing met goed gevolg te voltooien.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151i
  - number: 151i.2
    text: |-
      De houder van een certificaat als bedoeld in [artikel 151g, vierde lid][ref1], dat zijn geldigheid heeft verloren
      doordat het niet binnen de op het certificaat vermelde periode van geldigheid is gebruikt om de in de richtlijn
      vakbekwaamheid bestuurders bedoelde communautaire code op een rijbewijs of een kwalificatiekaart bestuurder te
      laten vermelden, kan een nieuw certificaat verwerven door de nascholing met goed gevolg te voltooien.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 151j
    text: |-
      Het is verboden voor het verkrijgen van een overeenkomstig [artikel 151g, derde lid][ref1], op het rijbewijs
      vermeld getuigschrift of een in [artikel 151g, vierde lid][ref2], bedoeld certificaat opzettelijk onjuiste opgaven
      te doen, onjuiste inlichtingen te verschaffen en onjuiste bewijsstukken en andere bescheiden over te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151j
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 151k
    text: |-
      Een wijziging van de richtlijn vakbekwaamheid bestuurders gaat voor de toepassing van [hoofdstuk VIIA][ref1] gelden
      met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukVIIA
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel151k
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: VIIA
  - number: '152.1'
    text: |-
      Verkeerstekens die worden geplaatst of verwijderd krachtens een verkeersbesluit, worden geplaatst en verwijderd op
      kosten van het gezag dat het verkeersbesluit heeft genomen.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel152
  - number: '152.2'
    text: |-
      Maatregelen ter regeling van het verkeer als bedoeld in [artikel 15, tweede lid][ref1], geschieden op kosten van
      het gezag dat het verkeersbesluit heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
  - number: '153'
    text: |-
      Verkeerstekens die niet worden geplaatst of verwijderd krachtens een verkeersbesluit, worden geplaatst en
      verwijderd op kosten van het openbaar lichaam dat het beheer heeft over de weg of, indien geen openbaar lichaam het
      beheer heeft, de eigenaar van de weg.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel153
  - number: '154'
    text: |-
      In afwijking van [artikel 152][ref1] geschiedt de plaatsing en verwijdering van verkeerstekens, strekkende tot het
      instandhouden van de weg en het waarborgen van de bruikbaarheid daarvan op kosten van het openbaar lichaam dat het
      beheer heeft over de weg of, indien geen openbaar lichaam het beheer heeft, van de eigenaar van de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel152
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '152'
        hoofdstuk: VIII
  - number: '155'
    text: |-
      De kosten, verbonden aan de plaatsing van verkeerstekens en de uitvoering van maatregelen in dringende
      omstandigheden, komen ten laste van degene die deze uitvoert.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel155
  - number: '156'
    text: |-
      Bij algemene maatregel van bestuur kunnen kosten, verbonden aan de plaatsing of verwijdering van verkeerstekens,
      worden doorberekend aan degene ten behoeve van wie het verkeersteken is geplaatst of verwijderd.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel156
  - number: 156a
    text: |-
      Door burgemeester en wethouders worden op kosten van de gemeente de grenzen van de bebouwde kom of kommen aangeduid
      voor zover en op de wijze als bij ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel156a
  - number: '157'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen en op welke wijze tarieven, verschuldigd op
      grond van deze wet, gedeeltelijk worden terugbetaald.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel157
  - number: '158.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, met uitzondering van de
      [hoofdstukken IA][ref1], [IB][ref2] en [IC][ref3], zijn belast de in [artikel 159][ref4] bedoelde personen en de
      bij besluit van Onze Minister aangewezen personen, voor zover bij dat besluit is bepaald. Zij beschikken daartoe
      over de in [artikel 160, vierde lid][ref5], genoemde bevoegdheid met betrekking tot het vervoeren van personen en
      over de bevoegdheid, genoemd in [artikel 160, vijfde lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIA
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIB
      [ref3]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIC
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel160
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel160
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: IA
      - id: ref2
        bwb_id: BWBR0006622
        hoofdstuk: IB
      - id: ref3
        bwb_id: BWBR0006622
        hoofdstuk: IC
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '160'
        hoofdstuk: IX
      - id: ref6
        bwb_id: BWBR0006622
        artikel: '160'
        hoofdstuk: IX
  - number: '158.2'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens de [artikelen 34][ref1] en [35][ref2] zijn voorts
      belast de bij besluit van Onze Minister in overeenstemming met Onze Minister van Economische Zaken aangewezen
      ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel35
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '34'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '35'
        hoofdstuk: III
        paragraaf: '5'
  - number: '158.3'
    text: |-
      Van een besluit als bedoeld in het eerste of tweede lid wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel158
  - number: '159'
    text: 'Met de opsporing van de feiten, strafbaar gesteld bij of krachtens deze wet, zijn belast:'
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel159
  - number: 159.a
    text: |-
      de in de [artikelen 141][ref1] en [142 van het Wetboek van Strafvordering][ref2] bedoelde personen;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: 159.b
    text: |-
      de bij algemene maatregel van bestuur aangewezen ambtenaren van de Rijksbelastingdienst, van de Rijks- en de
      provinciale waterstaat, van de Dienst Wegverkeer en van de verkeersinspecties, een en ander voor zover bij die
      algemene maatregel van bestuur is bepaald;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel159
  - number: 159.c
    text: |-
      de in de [artikelen 87][ref1] en [89 van de Wet personenvervoer 2000][ref2] bedoelde personen, voor zover het
      betreft de eisen die met betrekking tot voertuigen als bedoeld in die wet worden gesteld bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel89
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '87'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '89'
  - number: '160.1'
    text: |-
      Op de eerste vordering van de in [artikel 159][ref1] bedoelde personen is de bestuurder van een motorrijtuig
      verplicht dat motorrijtuig te doen stilhouden alsmede de volgende bewijzen behoorlijk ter inzage af te geven:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: 160.1.a
    text: |-
      de bij algemene maatregel van bestuur aangewezen delen van het kentekenbewijs, dan wel het in
      [artikel 37, eerste lid, onderdeel b][ref1], bedoelde bewijs, en, indien met het motorrijtuig een aanhangwagen
      wordt voortbewogen, de bij algemene maatregel van bestuur aangewezen delen van het kentekenbewijs van de
      aanhangwagen, dan wel het in [artikel 37, eerste lid, onderdeel b][ref2], bedoelde bewijs voor de aanhangwagen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 160.1.b
    text: |-
      het rijbewijs dan wel het hem door het daartoe bevoegde gezag buiten Nederland afgegeven rijbewijs en, indien hem
      buiten Nederland een internationaal rijbewijs is afgegeven, dat bewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel160
  - number: 160.1.c
    text: |-
      het ingevolge de richtlijn vakbekwaamheid bestuurders, bedoeld in [artikel 151b, onderdeel a][ref1], vereiste
      getuigschrift;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151b
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151b
        hoofdstuk: VIIA
        paragraaf: '1'
  - number: 160.1.d
    text: |-
      indien hem ter zake van een bij of krachtens deze wet vastgesteld voorschrift ontheffing is verleend, de
      beschikking houdende verlening van ontheffing.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel160
  - number: '160.2'
    text: |-
      Indien het kentekenbewijs is afgegeven voor een aanhangwagen die overeenkomstig het krachtens deze wet bepaalde
      is voorzien van een identificatieplaat, kan aan de vordering worden voldaan binnen een bij algemene maatregel van
      bestuur vastgestelde termijn.
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel160
  - number: '160.3'
    text: |-
      Op de eerste vordering van de in [artikel 159][ref1] bedoelde personen is de bestuurder van een voertuig,
      niet zijnde een motorrijtuig, verplicht dat voertuig te doen stilhouden en, indien hem ter zake van een bij of
      krachtens deze wet vastgesteld voorschrift ontheffing is verleend, de beschikking houdende verlening van ontheffing
      behoorlijk ter inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '160.4'
    text: |-
      De in [artikel 159][ref1] bedoelde personen zijn bevoegd zich te vergewissen van de naleving van de bij of
      krachtens deze wet vastgestelde voorschriften en zo nodig een voertuig ten aanzien waarvan zij een onderzoek
      wensen in te stellen, naar een nabij gelegen plaats te voeren of te doen voeren. De bestuurder van het voertuig
      ten aanzien waarvan dit onderzoek wenselijk wordt geoordeeld, en de bestuurder van het voertuig waardoor een
      aanhangwagen wordt voortbewogen ten aanzien waarvan zodanig onderzoek wenselijk wordt geoordeeld, zijn verplicht
      desgevorderd hun tot het onderzoek noodzakelijke medewerking te verlenen en desverlangd de in [artikel 159][ref2]
      bedoelde personen in hun voertuig te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '160.5'
    text: |-
      Op de eerste vordering van een van de in [artikel 159, onderdeel a][ref1], bedoelde personen zijn de bestuurder van
      een voertuig en degene die aanstalten maakt een voertuig te gaan besturen, verplicht hun medewerking te verlenen
      aan een voorlopig onderzoek van uitgeademde lucht en daartoe volgens door die persoon te geven aanwijzingen
      ademlucht te blazen in een door die persoon aangewezen apparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '160.6'
    text: |-
      De bestuurder van een voertuig, die door een der in [artikel 159][ref1] bedoelde personen in overtreding wordt
      bevonden van een bij of krachtens deze wet vastgesteld voorschrift, is verplicht de hem door die persoon ter
      bescherming van bij het verkeer betrokken belangen gegeven bevelen op te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '161.1'
    text: |-
      De in [artikel 159, onderdeel a][ref1], bedoelde personen die bij de uitoefening van de bij of
      krachtens deze wet, krachtens [artikel 2 van de Wet op de identificatieplicht][ref2] dan wel krachtens
      [artikel 5:19, derde lid, van de Algemene wet bestuursrecht][ref3] aan hen verleende bevoegdheden de beschikking
      krijgen over een rijbewijs waarvan ingevolge een der [artikelen 130, tweede lid][ref4], of [164][ref5] de
      overgifte is gevorderd, waarvan ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref6]
      de inlevering is gevorderd of ten aanzien waarvan ingevolge een der [artikelen 120, derde lid][ref7],
      [124, vierde lid][ref8], [131, derde lid, onderdeel b][ref9], [132, vijfde lid][ref10], of [180, derde lid][ref11],
      van deze wet een verplichting tot inlevering bestaat, zijn bevoegd dat rijbewijs in te nemen en het door te
      geleiden naar het betrokken parket van het openbaar ministerie dan wel naar degene bij wie de houder dat rijbewijs
      had dienen in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel164
      [ref6]: https://wetten.overheid.nl/BWBR0004581
      [ref7]: https://wetten.overheid.nl/BWBR0006622#Artikel120
      [ref8]: https://wetten.overheid.nl/BWBR0006622#Artikel124
      [ref9]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref10]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref11]: https://wetten.overheid.nl/BWBR0006622#Artikel180
    url: https://wetten.overheid.nl/BWBR0006622/2011-01-01#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '164'
        hoofdstuk: IX
      - id: ref6
        bwb_id: BWBR0004581
      - id: ref7
        bwb_id: BWBR0006622
        artikel: '120'
        hoofdstuk: VI
        afdeling: '5'
      - id: ref8
        bwb_id: BWBR0006622
