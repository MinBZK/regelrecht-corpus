  - number: 1.1.s
    text: |-
      goedkeuring van een productieproces: ter uitvoering van verdragen of van besluiten van volkenrechtelijke
      organisaties of van één of meer instellingen van de Europese Unie, al dan niet gezamenlijk, verleende goedkeuring
      van een productieproces van voertuigen, systemen, onderdelen, technische eenheden, uitrustingstukken en
      voorzieningen ter bescherming van weggebruikers en passagiers;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.t
    text: |-
      fabrikant: persoon of instantie die tegenover een goedkeuringsinstantie verantwoordelijk is voor alle aspecten van
      een typegoedkeurings- of toestemmingsprocedure en instaat voor de overeenstemming van de productie met de verleende
      goedkeuring of toestemming;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.u
    text: 'schadevoertuig: voertuig dat ten gevolge van een beschadiging niet langer deugdelijk van bouw en inrichting is;'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.v
    text: |-
      alcoholslot: het geheel van ademalcoholtester, startonderbreker en registratie-eenheid, dat in een motorrijtuig
      wordt ingebouwd, waardoor het motorrijtuig waarin het is ingebouwd alleen kan worden gestart nadat in de
      ademalcoholtester is geblazen en indien het daarin gemeten en weergegeven ademalcoholgehalte ligt onder de voor de
      betrokkene ingevolge [artikel 8, vierde lid, onderdeel b][ref1], geldende, wettelijke alcohollimiet;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: 1.1.w
    text: |-
      alcoholslotprogramma: het samenstel van de verplichting tot inbouw van een alcoholslot en de daarbij behorende
      registratie-eenheid in een door betrokkene gebruikt motorrijtuig, het periodiek laten uitlezen van de registratie-
      eenheid en het volgen van een begeleidingsprogramma;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.x
    text: |-
      alcoholslotregister: het register als bedoeld in [artikel 129a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel129a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 129a
        hoofdstuk: VI
        afdeling: 8a
  - number: 1.1.y
    text: |-
      *bewegwijzering:* verkeerstekens die worden geplaatst of verwijderd teneinde weggebruikers in staat te stellen hun
      afstand tot of route naar een bestemming te bepalen;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.z
    text: |-
      *begeleiden:* het actief coachen, het geven van suggesties ter verbetering van het rijgedrag, het wijzen op fouten
      en onzorgvuldigheden in het rijgedrag van de bestuurder van een motorrijtuig van de rijbewijscategorie B die op de
      leeftijd van zeventien jaren zijn rijbewijs B heeft behaald totdat die bestuurder de leeftijd van achttien jaren
      heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.za
    text: |-
      *begeleider:* op de begeleiderspas vermelde persoon die is gezeten op de zitplaats naast de bestuurder die de
      bestuurder van een motorrijtuig van de rijbewijscategorie B die overeenkomstig [artikel 111a, eerste lid][ref1],
      zijn rijbewijs B heeft verkregen begeleidt;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel111a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 111a
        hoofdstuk: VI
        afdeling: '3'
  - number: 1.1.zb
    text: |-
      *begeleiderspas:* pas die aan een persoon is afgegeven die op de leeftijd van zeventien jaren zijn rijbewijs B
      heeft behaald en waarop de naam van zijn begeleiders is vermeld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: '1.2'
    text: |-
      Indien de eigenaar van een motorrijtuig of een aanhangwagen niet tevens bezitter is, treedt de bezitter voor de
      toepassing van het bepaalde bij of krachtens deze wet voor de eigenaar in de plaats.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: '1.3'
    text: |-
      Degene aan wie een kenteken is opgegeven voor een motorrijtuig of een aanhangwagen wordt, tenzij anders blijkt,
      voor de toepassing van het bepaalde bij of krachtens deze wet beschouwd als eigenaar of houder van dat motorrijtuig
      of die aanhangwagen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: '1.4'
    text: |-
      Voor de toepassing van de [hoofdstukken III tot en met V][ref1] van deze wet worden vennootschappen zonder
      rechtspersoonlijkheid mede als rechtspersoon aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: '2.1'
    text: 'De krachtens deze wet vastgestelde regels kunnen strekken tot:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
  - number: 2.1.a
    text: het verzekeren van de veiligheid op de weg;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
  - number: 2.1.b
    text: het beschermen van weggebruikers en passagiers;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
  - number: 2.1.c
    text: het in stand houden van de weg en het waarborgen van de bruikbaarheid daarvan;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
  - number: 2.1.d
    text: het zoveel mogelijk waarborgen van de vrijheid van het verkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
  - number: '2.2'
    text: 'De krachtens deze wet vastgestelde regels kunnen voorts strekken tot:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
  - number: 2.2.a
    text: |-
      het voorkomen of beperken van door het verkeer veroorzaakte overlast, hinder of schade alsmede de gevolgen voor het
      milieu, bedoeld in de [Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 2.2.b
    text: |-
      het voorkomen of beperken van door het verkeer veroorzaakte aantasting van het karakter of van de functie van
      objecten of gebieden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
  - number: '2.3'
    text: 'De krachtens deze wet vastgestelde regels kunnen voorts strekken tot:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
  - number: 2.3.a
    text: het bevorderen van een doelmatig of zuinig energiegebruik;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
  - number: 2.3.b
    text: het waarborgen van het op juiste wijze in rekening brengen van tarieven voor het gebruik van de weg;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
  - number: 2.3.c
    text: het gebruik en de waarborging van de juistheid van de registers die ingevolge deze wet worden bijgehouden;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
  - number: 2.3.d
    text: het voorkomen en bestrijden van fraude;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
  - number: 2.3.e
    text: |-
      de regeling van positie, inrichting en werkwijze, alsmede het uitoefenen van toezicht op zelfstandige
      bestuursorganen die taken verrichten op het terrein van deze wet.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
  - number: '2.4'
    text: |-
      De krachtens deze wet vastgestelde regels kunnen voorts strekken ter uitvoering van verdragen of van besluiten van
      volkenrechtelijke organisaties of van één of meer instellingen van de Europese Unie, al dan niet gezamenlijk, op
      het terrein van de typegoedkeuring van voertuigen, systemen, onderdelen, technische eenheden, uitrustingstukken en
      voorzieningen ter bescherming van weggebruikers en passagiers, in verband met de toelating tot het verkeer op de
      weg of het gebruik buiten de weg.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
  - number: '2.5'
    text: |-
      De vaststelling van regels bij ministeriële regeling ter uitvoering van het bij of krachtens deze wet bepaalde
      geschiedt in overeenstemming met Onze bij algemene maatregel van bestuur aangewezen ministers, indien deze regels
      strekken tot behartiging van de belangen, bedoeld in het tweede dan wel het derde lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2
  - number: 2a
    text: |-
      Provincies, gemeenten en waterschappen behouden hun bevoegdheid om bij verordening regels vast te stellen ten
      aanzien van het onderwerp waarin deze wet voorziet, voorzover die regels niet in strijd zijn met de bij of
      krachtens deze wet vastgestelde regels en voorzover verkeerstekens krachtens deze wet zich daar niet toe lenen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2a
  - number: 2b
    text: |-
      De voordracht voor een krachtens deze wet vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel2b
  - number: '3.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone
      omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President,
      [artikel 4, derde en vierde lid][ref3], in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011389#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel4
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0011389
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '4'
        hoofdstuk: '1'
  - number: '3.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen wordt onverwijld een voorstel van wet aan de Tweede Kamer
      gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel3
  - number: '3.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel3
  - number: '3.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld; buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel3
  - number: '3.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel3
  - number: '3.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel3
  - number: '4.1'
    text: |-
      Het bepaalde bij of krachtens deze wet en provinciale en plaatselijke verordeningen gelden slechts voor zover zulks
      bij algemene maatregel van bestuur is bepaald:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4
  - number: 4.1.a
    text: ten aanzien van voertuigen, voor zover die worden gebezigd ten behoeve van de strijdkrachten;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4
  - number: 4.1.b
    text: voor militairen te voet, voor zover zij zich ter uitoefening van de dienst op de weg bevinden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4
  - number: '4.2'
    text: |-
      Buiten de omstandigheden, bedoeld in het derde lid en het vijfde lid, kunnen in de gevallen waarin het bepaalde
      bij of krachtens deze wet en provinciale en plaatselijke verordeningen niet ingevolge het eerste lid van toepassing
      is verklaard, bij algemene maatregel van bestuur regels worden vastgesteld en kunnen bij ministeriële regeling ter
      uitvoering daarvan nadere regels worden vastgesteld:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4
  - number: 4.2.a
    text: ten aanzien van voertuigen, voor zover die worden gebezigd ten behoeve van de strijdkrachten;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4
  - number: 4.2.b
    text: voor militairen te voet, voor zover zij zich ter uitoefening van de dienst op de weg bevinden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4
  - number: '4.3'
    text: |-
      Ingeval buitengewone omstandigheden dit noodzakelijk maken, kan bij koninklijk besluit worden bepaald dat van in
      dat besluit aan te wijzen bepalingen, genoemd in de algemene maatregel van bestuur bedoeld in het eerste lid, kan
      worden afgeweken door bestuurders van voertuigen gebezigd ten behoeve van de strijdkrachten en door militairen te
      voet die zich op de weg bevinden ter uitoefening van de dienst.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4
  - number: '4.4'
    text: |-
      Ingeval buitengewone omstandigheden dit noodzakelijk maken, kan bij koninklijk besluit worden bepaald dat ten
      aanzien van voertuigen van bij algemene maatregel van bestuur aan te wijzen overheidsdiensten, het bepaalde bij of
      krachtens deze wet en provinciale en plaatselijke verordeningen slechts gelden voor zover zulks bij die maatregel
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4
  - number: '4.5'
    text: |-
      In geval van de beperkte of de algemene noodtoestand is het militair gezag bevoegd voor het gebied waarvoor op
      grond van [artikel 7, eerste lid][ref1], of [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2],
      bepalingen uit de [Oorlogswet voor Nederland][ref3] in werking zijn gesteld, regels vast te stellen inzake het
      verkeer op de weg, afwijkende van het bepaalde bij of krachtens deze wet en van provinciale en plaatselijke
      verordeningen, alsmede van de in het tweede lid bedoelde, bij algemene maatregel van bestuur vastgestelde regels,
      voor zoveel dat door het gezag ter uitvoering van de militaire taak ter handhaving van de uitwendige of inwendige
      veiligheid nodig wordt geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007983
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007983
  - number: '4.6'
    text: |-
      Door de vorige leden wordt de gewone aansprakelijkheid uit andere wettelijke bepalingen voortvloeiende, niet
      opgeheven of verminderd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4
  - number: 4a.1
    text: |-
      Er is een Dienst Wegverkeer, in het maatschappelijk verkeer aangeduid als RDW. De dienst bezit
      rechtspersoonlijkheid en is gevestigd te Zoetermeer.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4a
  - number: 4a.2
    text: |-
      Op de Dienst Wegverkeer is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing, met uitzondering van
      [artikel 15 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel15
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '15'
  - number: 4b.1
    text: 'De Dienst Wegverkeer is belast met de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
  - number: 4b.1.a
    text: |-
      het verlenen van typegoedkeuringen voor voertuigen, systemen, onderdelen, technische eenheden, uitrustingstukken
      en voorzieningen ter bescherming van weggebruikers en passagiers, het verlenen van individuele goedkeuringen voor
      voertuigen, alsmede het intrekken van typegoedkeuringen,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
  - number: 4b.1.a1
    text: |-
      het ter uitvoering van verdragen of besluiten van volkenrechtelijke organisaties of van één of meer instellingen
      van de Europese Unie, al dan niet gezamenlijk, verlenen van typegoedkeuringen voor voertuigen, systemen,
      onderdelen, technische eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers en
      passagiers,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
  - number: 4b.1.a2
    text: |-
      het verlenen van toestemming om onderdelen of uitrustingsstukken te verkopen, te koop aan te bieden, of het in het
      verkeer brengen, alsmede het intrekken van toestemmingen,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
  - number: 4b.1.b
    text: |-
      het houden van toezicht op het overeenstemmen van voertuigen, systemen, onderdelen, technische eenheden,
      uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers met het type waarvoor de
      goedkeuring is verleend en op het overeenstemmen van onderdelen en uitrustingsstukken waarvoor een toestemming is
      verleend met de verleende toestemming,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
  - number: 4b.1.b1
    text: |-
      het houden van toezicht op het terugroepen van reeds in de handel gebrachte voertuigen, onderdelen of
      uitrustingsstukken door de fabrikant,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
  - number: 4b.1.b2
    text: |-
      het in verband met het alcoholslotprogramma verlenen van typegoedkeuringen voor alcoholsloten en voor de
      productieprocessen van die alcoholsloten ingevolge [artikel 132e, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132e
        hoofdstuk: VI
        paragraaf: '4'
        afdeling: '9'
  - number: 4b.1.b3
    text: |-
      het ter uitvoering van verdragen of besluiten van volkenrechtelijke organisaties of van één of meer
      instellingen van de Europese Unie, al dan niet gezamenlijk, verlenen van typegoedkeuringen voor alcoholsloten en
      productieprocessen van die alcoholsloten,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
  - number: 4b.1.b4
    text: |-
      het houden van toezicht op het overeenstemmen van de alcoholsloten met het type waarvoor de goedkeuring is
      verleend,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
  - number: 4b.1.b5
    text: het verwerken van gegevens in verband met het alcoholslotprogramma,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
  - number: 4b.1.b6
    text: |-
      het vaststellen en vastleggen van manipulatie van voertuigsystemen en het melden hiervan aan de bevoegde
      autoriteiten,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
  - number: 4b.1.c
    text: |-
      het opgeven van kentekens voor motorrijtuigen en aanhangwagens, het ter zake van die opgaven inschrijven en
      tenaamstellen van motorrijtuigen en aanhangwagens in het kentekenregister, bedoeld in [artikel 42][ref1], en
      het ter zake van die inschrijving afgeven van kentekenbewijzen, het beëindigen van de inschrijving en het doen
      vervallen van de tenaamstelling, het schorsen van de geldigheid van kentekenbewijzen, het ongeldig verklaren
      van kentekenbewijzen, het geldig verklaren van kentekenbewijzen, alsmede het houden van toezicht als bedoeld in
      [artikel 37, vierde lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '42'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 4b.1.d
    text: het afgeven van keuringsrapporten voor motorrijtuigen en aanhangwagens,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
  - number: 4b.1.f
    text: |-
      het in het kader van de toelating tot het verkeer op de weg verlenen van goedkeuringen voor motorrijtuigen en
      aanhangwagens waarvan de constructie is gewijzigd dan wel waarvan het kentekenbewijs is ingevorderd,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
  - number: 4b.1.g
    text: |-
      het afgeven van rijbewijzen in de gevallen, bedoeld in [artikel 116, eerste lid][ref1], alsmede het
      ongeldigverklaren van rijbewijzen in de in deze wet bepaalde gevallen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel116
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '116'
        hoofdstuk: VI
        afdeling: '5'
  - number: 4b.1.g1
    text: het afgeven van een verklaring in verband met de aanvraag van een rijbewijs,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
  - number: 4b.1.h
    text: |-
      het verwerken van gegevens met betrekking tot opgegeven kentekens, afgegeven kentekenbewijzen, afgegeven
      keuringsrapporten, krachtens [artikel 149a][ref1] verleende ontheffingen, afgegeven rijbewijzen, fietsen, gebruik
      van motorrijtuigen en de mobiele objecten, bedoeld in [artikel 70l, eerste lid][ref2], alsmede met betrekking tot
      rechterlijke uitspraken houdende ontzegging van de bevoegdheid tot het besturen van motorrijtuigen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel70l
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149a
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 70l
        hoofdstuk: IVA
  - number: 4b.1.i
    text: |-
      het overeenkomstig de bij of krachtens deze wet vastgestelde bepalingen verstrekken van gegevens uit de in
      onderdeel h bedoelde registers alsmede het houden van toezicht als bedoeld in [artikel 45a, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel45a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel4b
    references:
