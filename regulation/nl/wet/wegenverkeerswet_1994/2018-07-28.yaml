  - number: '30.1'
    text: |-
      De toestemming voor een onderdeel of uitrustingsstuk dat op grond van [artikel 34][ref1] zonder een dergelijk
      toestemming niet mag worden verkocht of in het verkeer mag worden gebracht, wordt op aanvraag en tegen betaling,
      op de door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door deze dienst vastgestelde tarief door
      deze dienst verleend indien het onderdeel of uitrustingsstuk waarvoor de toestemming wordt gevraagd, bij een door
      de dienst verrichte keuring heeft voldaan aan de bij ministeriële regeling vastgestelde eisen. Deze eisen kunnen
      betrekking hebben op het proces volgens hetwelk de aanvrager zijn werkzaamheden met betrekking tot de productie van
      het onderdeel of uitrustingsstuk verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel34
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '34'
        hoofdstuk: III
        paragraaf: '5'
  - number: '30.2'
    text: |-
      Met een toestemming voor de verkoop of in het verkeer brengen van een onderdeel of uitrustingsstuk wordt
      gelijkgesteld een toestemming die is verleend door het daartoe bevoegde gezag in een andere lidstaat van de
      Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      en is verleend overeenkomstig de op het betrokken onderdeel of uitrustingstuk betrekking hebbende, in het kader van
      de Europese Unie tot stand gekomen voorschriften.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel30
  - number: '30.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld betreffende de organisatie van de aanvrager, het door de
      aanvrager van de toestemming ter beschikking stellen van onderdelen en uitrustingsstukken, het door de aanvrager
      overleggen van bescheiden en verstrekken van inlichtingen alsmede betreffende de wijze waarop de keuring van het
      onderdeel of uitrustingsstuk wordt verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel30
  - number: '30.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot op onderdelen en uitrustingsstuken,
      waarvoor een toestemming is verleend om deze te verkopen of in het verkeer te brengen, aan te brengen keurmerken,
      aanduidingen of gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel30
  - number: '31.1'
    text: |-
      De Dienst Wegverkeer houdt toezicht op het overeenstemmen van onderdelen en uitrustingsstukken waarvoor een
      toestemming is verleend met de verleende toestemming. Tot dit toezicht kan behoren het steekproefsgewijs
      of periodiek controleren van de organisatie van degene aan wie de toestemming is verleend alsmede van het
      productieproces. Degene aan wie de toestemming is verleend, is gehouden aan voor het houden van het toezicht
      noodzakelijke werkzaamheden medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel31
  - number: '31.2'
    text: |-
      Degene aan wie een toestemming is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel31
  - number: '31.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld betreffende de wijze waarop het toezicht wordt
      gehouden en de verplichting tot medewerking daaraan van degene aan wie een toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel31
  - number: '32.1'
    text: |-
      De Dienst Wegverkeer trekt de toestemming voor de verkoop of in het verkeer brengen van een onderdeel of
      uitrustingstuk in, indien degene aan wie de toestemming is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel32
  - number: '32.2'
    text: 'De Dienst Wegverkeer kan een toestemming intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel32
  - number: 32.2.a
    text: |-
      degene aan wie de toestemming is verleend een onderdeel of uitrustingsstuk doet of laat doorgaan als met
      toestemming verkocht of in het verkeer gebracht, terwijl hiervoor geen toestemming is verleend,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel32
  - number: 32.2.b
    text: |-
      degene aan wie de toestemming is verleend, de verplichting, vervat in [artikel 31, tweede lid][ref1], niet nakomt,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel31
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '31'
        hoofdstuk: III
        paragraaf: 4a
  - number: 32.2.c
    text: |-
      degene aan wie de toestemming is verleend, handelt in strijd met een of meer andere uit de toestemming
      voortvloeiende verplichtingen, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel32
  - number: 32.2.d
    text: blijkt dat de toestemming ten onrechte is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel32
  - number: '33.1'
    text: |-
      Het is de eigenaar of houder van een voertuig dat ingevolge [artikel 21, eerste lid][ref1], dient te zijn
      goedgekeurd voor toelating tot het verkeer op de weg verboden dit voertuig te laten staan op de weg of daarmee over
      de weg te rijden alsmede de bestuurder daarmee over de weg te laten rijden, indien het voertuig niet is goedgekeurd
      voor toelating tot het verkeer op de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: '33.2'
    text: |-
      Onverminderd het eerste lid is het de bestuurder van een voertuig dat ingevolge [artikel 21, eerste lid][ref1],
      dient te zijn goedgekeurd voor toelating tot het verkeer op de weg, verboden daarmee over de weg te rijden, indien
      het voertuig niet is goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: '33.3'
    text: |-
      In bij algemene maatregel van bestuur te bepalen gevallen zijn het eerste en tweede lid niet van toepassing op een
      voertuig dat ingevolge [artikel 21, eerste lid][ref1], dient te zijn goedgekeurd voor toelating tot het verkeer op
      de weg, maar dat is ingeschreven in het kentekenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: '34.1'
    text: |-
      Het is verboden bij algemene maatregel van bestuur aan te wijzen categorieën voertuigen, systemen, onderdelen,
      technische eenheden, uitrustingsstukken en voorzieningen ter bescherming van weggebruikers en passagiers, die
      niet ingevolge [artikel 22][ref1], [25a][ref2] of [26][ref3] zijn toegelaten tot het verkeer op de weg, of andere
      voorzieningen die zijn bestemd om de opsporing van bij of krachtens deze wet strafbaar gestelde misdrijven of
      overtredingen te belemmeren, te vervaardigen, in te voeren, in voorraad te hebben, te koop aan te bieden, af te
      leveren of te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel26
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 25a
        hoofdstuk: III
        paragraaf: 2a
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
  - number: '34.2'
    text: |-
      Het is verboden bij algemene maatregel van bestuur aan te wijzen categorieën onderdelen en uitrustingsstukken
      te verkopen, te koop aan te bieden of in het verkeer te brengen, tenzij hiervoor ingevolge [artikel 30][ref1]
      toestemming is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel30
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '30'
        hoofdstuk: III
        paragraaf: 4a
  - number: '34.3'
    text: |-
      Ter uitvoering van verdragen of van besluiten van volkenrechtelijke organisaties of van één of meer instellingen
      van de Europese Unie, al dan niet gezamenlijk, worden voor verboden als bedoeld in het eerste en tweede lid, de
      categorieën aangewezen bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel34
  - number: '34.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld betreffende de categorie van voertuigen, systemen,
      onderdelen, technische eenheden, uitrustingsstukken of voorzieningen ter bescherming van weggebruikers en
      passagiers of de andere voorzieningen die zijn bestemd om de opsporing van bij of krachtens deze wet strafbaar
      gestelde misdrijven of overtredingen te belemmeren, waarop het verbod betrekking heeft, de handelingen waarop het
      verbod betrekking heeft alsmede de uitzonderingen op het verbod.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel34
  - number: '35'
    text: |-
      Het is verboden een voertuig, systeem, onderdeel, technische eenheid, uitrustingstuk of voorziening ter bescherming
      van weggebruikers en passagiers, welk voertuig, systeem, onderdeel, technische eenheid, uitrustingstuk of
      voorziening ter bescherming van weggebruikers en passagiers niet ingevolge [artikel 22][ref1] of [26][ref2] is
      toegelaten, door het aanbrengen van een teken of tekens, het afgeven van een bewijs of bewijzen dan wel het doen
      van mededelingen te doen of laten doorgaan voor goedgekeurd voor zodanige toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel26
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
  - number: 35a
    text: |-
      In de ingevolge de [artikelen 21, eerste en derde lid][ref1], [22, eerste lid][ref2], [25a, eerste lid][ref3],
      [26, eerste lid][ref4], en [34, eerste lid][ref5], vastgestelde regels kan ter uitvoering van verdragen of van
      besluiten van volkenrechtelijke organisaties of van één of meer instellingen van de Europese Unie, al dan niet
      gezamenlijk, worden bepaald dat zij mede betrekking hebben op de goedkeuring van voertuigen, systemen, onderdelen,
      technische eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers voor
      gebruik buiten de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel25a
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel34
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 25a
        hoofdstuk: III
        paragraaf: 2a
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '34'
        hoofdstuk: III
        paragraaf: '5'
  - number: '36.1'
    text: |-
      Aan de eigenaar of houder van een motorrijtuig of een aanhangwagen op de weg dient overeenkomstig bij algemene
      maatregel van bestuur vastgestelde regels door de Dienst Wegverkeer een kenteken voor dat voertuig te zijn
      opgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel36
  - number: '36.2'
    text: |-
      Ter zake van de in het eerste lid bedoelde opgave dient overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels door de Dienst Wegverkeer een kentekenbewijs te zijn afgegeven aan de eigenaar of houder van
      het voertuig.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel36
  - number: '36.3'
    text: 'Het kentekenbewijs dient:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel36
  - number: 36.3.a
    text: te voldoen aan de bij ministeriële regeling vastgestelde eisen inzake inrichting en uitvoering,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel36
  - number: 36.3.b
    text: zijn geldigheid niet te hebben verloren,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel36
  - number: 36.3.c
    text: niet te zijn ingevorderd, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel36
  - number: 36.3.d
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel36
  - number: '36.5'
    text: |-
      Motorrijtuigen en aanhangwagens dienen overeen te komen met de gegevens in het voor het betrokken voertuig
      afgegeven kentekenbewijs en met de gegevens die omtrent het voertuig zijn opgenomen in het kentekenregister, tenzij
      krachtens [artikel 71][ref1] een bepaalde afwijking van die gegevens is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
  - number: '36.6'
    text: 'Voor overtreding van het eerste tot en met vijfde lid zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel36
  - number: 36.6.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder die het motorrijtuig op de weg laat staan of daarmee
      over de weg laat rijden, alsmede in het geval dat met dat motorrijtuig over de weg wordt gereden, de bestuurder, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel36
  - number: 36.6.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder die de aanhangwagen op de weg laat staan of deze met
      een motorrijtuig over de weg laat voortbewegen, alsmede in het geval dat de aanhangwagen met een motorrijtuig over
      de weg wordt voortbewogen, de bestuurder van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel36
  - number: '36.7'
    text: |-
      De in het derde lid, onderdeel *a*, bedoelde eisen kunnen mede dienstbaar zijn aan de heffing van de belasting van
      personenauto’s en motorrijwielen en van de motorrijtuigenbelasting.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel36
  - number: '36.8'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel36
  - number: '37.1'
    text: |-
      [Artikel 36][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 37.1.a
    text: 'de volgende categorieën motorrijtuigen alsmede de door die motorrijtuigen voortbewogen aanhangwagens:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
  - number: 37.1.a.1°
    text: |-
      bij algemene maatregel van bestuur vastgestelde categorieën bromfietsen, alsmede bromfietsen in het internationaal
      verkeer, afkomstig uit een land waar voor deze voertuigen geen kenteken is opgegeven,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
  - number: 37.1.a.2°
    text: landbouw- of bosbouwtrekkers,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
  - number: 37.1.a.3°
    text: gehandicaptenvoertuigen en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
  - number: 37.1.a.4°
    text: motorrijtuigen met beperkte snelheid;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
  - number: 37.1.b
    text: |-
      in het buitenland geregistreerde motorrijtuigen en aanhangwagens, die zich in het internationaal verkeer bevinden,
      mits ter zake van de registratie van het betrokken voertuig door het daartoe bevoegde gezag in het buitenland een
      bewijs is afgegeven dat voldoet aan de daaraan gestelde eisen in de tussen Nederland en het betrokken land van
      kracht zijnde internationale overeenkomst en het betrokken voertuig voldoet aan de eisen die in die overeenkomst
      dan wel bij algemene maatregel van bestuur ter uitvoering van die overeenkomst aan dat voertuig worden gesteld met
      betrekking tot de toelating tot het internationaal verkeer;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
  - number: 37.1.c
    text: |-
      motorrijtuigen en aanhangwagens, mits wordt voldaan aan nadere bij ministeriële regeling vast te stellen regels,
      die in eigendom toebehoren aan of worden gehouden door:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
  - number: 37.1.c.1°
    text: |-
      leden van een bij ministeriële regeling aangewezen krijgsmacht of civiele dienst in de zin van artikel I van het
      op 19 juni 1951 te Londen gesloten Verdrag tussen de landen die partij zijn bij het Noord-Atlantisch Verdrag nopens
      de rechtspositie van hun krijgsmachten (Trb. 1953, 10), dan wel in de zin van artikel 3 van het bij evenbedoeld
      verdrag behorende, op 28 augustus 1952 te Parijs gesloten, protocol nopens de rechtspositie van internationale
      militaire hoofdkwartieren ingesteld uit hoofde van het Noord-Atlantisch Verdrag (Trb. 1953, 11), alsmede
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
  - number: 37.1.c.2°
    text: |-
      functionarissen van de Noord-Atlantische Verdragsorganisatie die in Nederland zijn op grond van de briefwisseling
      tussen de regering van het Koninkrijk der Nederlanden en de Noord-Atlantische Verdragsorganisatie van 31 augustus
      en 11 september 1979 (Trb.1979, 159) en op wie het Verdrag nopens de rechtspositie van de Noord-Atlantische
      Verdragsorganisatie, van de nationale vertegenwoordigers bij haar organen en van haar internationale staf
      (Trb.1951, 139), van toepassing is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
  - number: '37.2'
    text: |-
      Voor aanhangwagens met een toegestane maximum massa van niet meer dan 750 kg alsmede voor aanhangwagens met een
      toegestane maximum massa van meer dan 750 kg, afkomstig uit een land waar voor deze aanhangwagens geen afzonderlijk
      kenteken is opgegeven, geldt het vereiste dat een kenteken dient te zijn opgegeven niet. Indien een dergelijke
      aanhangwagen is verbonden met een in Nederland geregistreerd motorrijtuig, dient die aanhangwagen te zijn voorzien
      van het kenteken dat is opgegeven voor dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
  - number: '37.3'
    text: |-
      Voor motorrijtuigen en aanhangwagens, die behoren tot de bedrijfsvoorraad van een natuurlijke persoon of
      rechtspersoon aan wie een erkenning als bedoeld in [artikel 62][ref1] is verleend of die voor herstel of bewerking
      ter beschikking zijn gesteld van een natuurlijke persoon of rechtspersoon, geldt het vereiste dat een kenteken
      voor een bepaald voertuig dient te zijn opgegeven niet, mits overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels gebruik wordt gemaakt van een bij algemene maatregel van bestuur aangewezen, door de Dienst
      Wegverkeer aan die natuurlijke persoon of rechtspersoon dan wel aan een natuurlijke persoon of rechtspersoon
      aan wie een erkenning als bedoeld in artikel 62 is verleend en die het voertuig ten behoeve van eerstbedoelde
      natuurlijke persoon of rechtspersoon ten verkoop voorhanden heeft, opgegeven kenteken. De Dienst Wegverkeer kan aan
      deze opgaven voorschriften verbinden. Bij ministeriële regeling kunnen met betrekking tot die voorschriften regels
      worden vastgesteld. Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen het gebruik van een
      zodanig kenteken verplicht is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '37.4'
    text: |-
      Met het toezicht op de naleving van de uit het derde lid voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de Staatscourant. Het toezicht heeft in ieder geval betrekking op het gebruik van het in het derde lid bedoelde
      kenteken. De aldaar bedoelde natuurlijke persoon of rechtspersoon is gehouden tot betaling, op de door de Dienst
      Wegverkeer vastgestelde wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde
      tarief. Bij ministeriële regeling worden nadere regels omtrent het toezicht vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
  - number: '37.5'
    text: 'Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
  - number: 37.5.a
    text: |-
      in bepaalde uitzonderingsgevallen tijdelijk wordt of kan worden afgeweken van het in
      [artikel 36, derde lid, onderdeel b of c][ref1], bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 37.5.b
    text: |-
      een motorrijtuig of een aanhangwagen op de weg mag staan, indien de tenaamstelling vervallen is verklaard ingevolge
      [artikel 51a, derde lid, onderdeel b, c, d of f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel51a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 51a
        hoofdstuk: IV
        paragraaf: 4a
  - number: '37.6'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de omschrijving van de in het eerste
      lid, onderdeel a, bedoelde categorieën voertuigen alsmede de voor die categorieën vastgestelde maximumsnelheid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
  - number: '37.7'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het derde lid en kunnen nadere regels
      worden vastgesteld ter uitvoering van het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel37
  - number: '38.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat bepaalde categorieën van kentekens slechts worden
      opgegeven aan bij die algemene maatregel van bestuur aan te wijzen personen of groepen van personen dan wel voor
      daarbij aan te wijzen voertuigen of groepen van voertuigen, zulks onder daarbij te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel38
  - number: '38.2'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel38
  - number: '40.1'
    text: Het kenteken dient behoorlijk zichtbaar op of aan het motorrijtuig of de aanhangwagen aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel40
  - number: '40.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de inrichting, het aanbrengen en
      de verlichting van het kenteken en worden regels vastgesteld omtrent de kentekenplaat en de onderdelen daarvan,
      alsmede de daarop aan te brengen merken.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel40
  - number: '40.3'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het bepaalde krachtens het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel40
  - number: '40.4'
    text: 'Voor overtreding van het eerste lid dan wel het bepaalde krachtens het tweede of derde lid zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel40
  - number: 40.4.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder die het motorrijtuig op de weg laat staan of daarmee
      over de weg laat rijden, alsmede in het geval dat met dat motorrijtuig over de weg wordt gereden, de bestuurder, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel40
  - number: 40.4.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder die de aanhangwagen op de weg laat staan of deze met
      een motorrijtuig over de weg laat voortbewegen, alsmede in het geval dat de aanhangwagen met een motorrijtuig over
      de weg wordt voortbewogen, de bestuurder van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel40
  - number: '41.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel41
  - number: 41.1.a
    text: |-
      op een motorrijtuig of een aanhangwagen enig teken of middel aan te brengen of te doen aanbrengen met het oogmerk
      de herkenning, daaronder begrepen de herkenning met behulp van technische voorzieningen, van het ingevolge
      [artikel 40][ref1] gevoerde kenteken te bemoeilijken;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 41.1.b
    text: |-
      een motorrijtuig op de weg te laten staan of daarmee over de weg te rijden dan wel een aanhangwagen op de weg te
      laten staan of met een motorrijtuig over de weg voort te bewegen, wanneer op dat motorrijtuig of die aanhangwagen
      enig teken of middel is aangebracht, waardoor de herkenning, daaronder begrepen de herkenning met behulp van
      technische voorzieningen, van het ingevolge [artikel 40][ref1] gevoerde kenteken wordt bemoeilijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 41.1.c
    text: |-
      op een motorrijtuig of een aanhangwagen een teken, niet zijnde een ingevolge [artikel 36][ref1] aan de eigenaar of
      houder voor dat motorrijtuig of die aanhangwagen opgegeven kenteken, aan te brengen of te doen aanbrengen met het
      oogmerk dat teken te doen doorgaan voor een zodanig kenteken dan wel met de kennelijke bedoeling dat teken te doen
      doorgaan voor een overeenkomstig de daarvoor geldende voorschriften opgegeven buitenlands kenteken dan wel een met
      toepassing van [artikel 37, derde lid][ref2], opgegeven kenteken;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 41.1.d
    text: |-
      een motorrijtuig op de weg te laten staan of daarmee over de weg te rijden dan wel een aanhangwagen op de weg te
      laten staan of met een motorrijtuig over de weg voort te bewegen, wanneer op dat motorrijtuig of die aanhangwagen
      een teken is aangebracht dat, niet zijnde een ingevolge [artikel 36][ref1] aan de eigenaar of houder voor dat
      motorrijtuig of die aanhangwagen opgegeven kenteken, door kan gaan voor een zodanig kenteken dan wel voor een
      overeenkomstig de daarvoor geldende voorschriften opgegeven buitenlands kenteken of een met toepassing van
      [artikel 37, derde lid][ref2], opgegeven kenteken;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 41.1.e
    text: |-
      op een in het buitenland geregistreerd motorrijtuig of een in het buitenland geregistreerde aanhangwagen een teken,
      niet zijnde een aldaar voor dat voertuig of aan de eigenaar of houder daarvan opgegeven kenteken, aan te brengen of
      te doen aanbrengen met het oogmerk dat teken te doen doorgaan voor een zodanig kenteken;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel41
  - number: 41.1.f
    text: |-
      een in het buitenland geregistreerd motorrijtuig op de weg te laten staan of daarmee over de weg te rijden dan
      wel een in het buitenland geregistreerde aanhangwagen op de weg te laten staan of met een motorrijtuig over de weg
      voort te bewegen, wanneer op dat motorrijtuig of die aanhangwagen een teken is aangebracht dat, niet zijnde een in
      het buitenland voor dat voertuig of aan de eigenaar of houder daarvan opgegeven kenteken, door kan gaan voor een
      zodanig kenteken.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel41
  - number: '41.2'
    text: 'Voor overtreding van het eerste lid, onderdelen b, d en f, zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel41
  - number: 41.2.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder die het motorrijtuig op de weg laat staan of daarmee
      over de weg laat rijden, alsmede in het geval dat met dat motorrijtuig over de weg wordt gereden, de bestuurder,
      een en ander echter slechts indien de eigenaar, houder of bestuurder weet of redelijkerwijze kan vermoeden dat op
      het motorrijtuig een teken of middel als bedoeld in het eerste lid, onderdeel b, dan wel een teken als bedoeld in
      het eerste lid, onderdeel d of f, is aangebracht, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel41
  - number: 41.2.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder die de aanhangwagen op de weg laat staan of deze
      met een motorrijtuig over de weg laat voortbewegen, alsmede in het geval dat de aanhangwagen met een motorrijtuig
      over de weg wordt voortbewogen, de bestuurder van dat motorrijtuig, een en ander echter slechts indien de eigenaar,
      houder of bestuurder weet of redelijkerwijze kan vermoeden dat op de aanhangwagen een teken of middel als bedoeld
      in het eerste lid, onderdeel b, dan wel een teken als bedoeld in het eerste lid, onderdeel d of f, is aangebracht.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel41
  - number: 41a.1
    text: 'Voor de toepassing van deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel41a
  - number: 41a.1.a
    text: |-
      overheidsorgaan: bestuursorgaan als bedoeld in
      [artikel 1:1, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1] en personen of instanties als
      bedoeld in het tweede lid;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 41a.1.b
    text: 'basisregistratie: verzameling gegevens waarvan bij wet is bepaald dat deze authentieke gegevens bevat;'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel41a
  - number: 41a.1.c
    text: |-
      authentiek gegeven: in een basisregistratie opgenomen gegeven dat bij of krachtens wet als authentiek is
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel41a
  - number: 41a.2
    text: |-
      In aanvulling op het eerste lid wordt onder overheidsorgaan mede verstaan de bij ministeriële regeling aangewezen
      personen of instanties die een publieke taak uitoefenen, voor zover die aanwijzing naar het oordeel van Onze
      Minister noodzakelijk is met het oog op een goede uitoefening van hun publieke taak.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel41a
  - number: '42.1'
    text: Er is een kentekenregister. Dit register is een basisregistratie.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42
  - number: '42.2'
    text: De Dienst Wegverkeer is de beheerder en verwerkingsverantwoordelijke van het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42
  - number: '42.3'
    text: |-
      In het kentekenregister verwerkt de Dienst Wegverkeer gegevens omtrent motorrijtuigen en aanhangwagens waarvoor
      een kenteken is opgegeven en de tenaamstelling van die motorrijtuigen en aanhangwagens, alsmede omtrent andere
      motorrijtuigen en aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42
  - number: '42.4'
    text: 'Het verzamelen van de gegevens, bedoeld in het derde lid, geschiedt voor de volgende doeleinden:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42
  - number: 42.4.a
    text: |-
      voor een goede uitvoering van het bepaalde bij of krachtens deze wet en voor de handhaving van de bij of krachtens
      deze wet gestelde voorschriften,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42
  - number: 42.4.b
    text: |-
      voor een goede uitvoering van het bepaalde bij of krachtens de [Wet op de motorrijtuigenbelasting 1994][ref1],
      de [Wet op de belasting van personenauto’s en motorrijwielen 1992][ref2], de
      [Wet belasting zware motorrijtuigen][ref3], de [Wet aansprakelijkheidsverzekering motorrijtuigen][ref4], de
      [Wet tijdelijke tolheffing Blankenburgverbinding en ViA15][ref5], dan wel andere wettelijke regelingen ten
      aanzien van motorrijtuigen of aanhangwagens en voor de handhaving van het bepaalde bij of krachtens die wettelijke
      regelingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0006324
      [ref2]: https://wetten.overheid.nl/BWBR0005806
      [ref3]: https://wetten.overheid.nl/BWBR0007678
      [ref4]: https://wetten.overheid.nl/BWBR0002415
      [ref5]: https://wetten.overheid.nl/BWBR0037517
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006324
      - id: ref2
        bwb_id: BWBR0005806
      - id: ref3
        bwb_id: BWBR0007678
      - id: ref4
        bwb_id: BWBR0002415
      - id: ref5
        bwb_id: BWBR0037517
  - number: 42.4.c
    text: |-
      om overheidsorganen te voorzien van gegevens uit het kentekenregister voor zover zij aangeven deze gegevens nodig
      te hebben voor een goede uitoefening van hun publieke taak.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42
  - number: '42.5'
    text: |-
      De Dienst Wegverkeer mag persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] verwerken voor zover dit
      verband houdt met de in het vierde lid, onderdelen a en b, genoemde doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '42.6'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld betreffende de inrichting en
      het beheer van het kentekenregister, waaronder mede wordt begrepen de nadere uitwerking van
      de gegevens, persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], die in het kentekenregister
      worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '42.7'
    text: |-
      De gegevens omtrent motorrijtuigen en aanhangwagens die de Dienst Wegverkeer verwerkt in het landsbelang, worden
      niet opgenomen in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42
  - number: 42a.1
    text: 'De gegevens in het kentekenregister worden onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42a
  - number: 42a.1.a
    text: authentieke en niet-authentieke gegevens;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42a
  - number: 42a.1.b
    text: gevoelige en niet-gevoelige gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42a
  - number: 42a.2
    text: 'Als authentieke gegevens worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42a
  - number: 42a.2.a
    text: |-
      gegevens die op grond van een bindend besluit van de Raad van de Europese Unie, van het Europees Parlement en de
      Raad gezamenlijk of van de Commissie van de Europese Unie verplicht op het kentekenbewijs zijn opgenomen voor zover
      de desbetreffende gegevens niet reeds op grond van een andere wettelijke bepaling als authentiek zijn aangemerkt;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42a
  - number: 42a.2.b
    text: |-
      de voertuigcategorieën genoemd in [artikel 21, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '21'
        hoofdstuk: III
        paragraaf: '1'
  - number: 42a.2.c
    text: de tenaamstelling van een motorrijtuig of aanhangwagen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42a
  - number: 42a.3
    text: |-
      Bij algemene maatregel van bestuur kunnen andere authentieke gegevens of categorieën daarvan worden aangewezen. Bij
      algemene maatregel van bestuur kan tevens als authentiek worden aangewezen de samenstelling van een uit een andere
      basisregistratie afkomstig gegeven met een of meer gegevens uit het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42a
  - number: 42a.4
    text: Bij algemene maatregel van bestuur worden gevoelige en niet-gevoelige gegevens of categorieën daarvan aangewezen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel42a
  - number: '43.1'
    text: |-
      Aan overheidsorganen worden door de Dienst Wegverkeer uit het kentekenregister gegevens, waaronder
      mede begrepen persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], verstrekt voor zover zij
      aangeven die gegevens nodig te hebben voor de uitoefening van hun publieke taak.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '43.2'
    text: |-
      Aan autoriteiten binnen de andere lidstaten van de Europese Unie en de andere staten die partij zijn bij de
      Overeenkomst buiten Nederland betreffende de Europese Economische Ruimte worden door de Dienst Wegverkeer
      in de bij of krachtens algemene maatregel van bestuur aangewezen gevallen uit het kentekenregister gegevens,
      waaronder mede begrepen persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '43.3'
    text: |-
      Aan autoriteiten buiten Nederland, niet zijnde autoriteiten uit lidstaten van de Europese Unie en staten die
      partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte worden door de Dienst Wegverkeer
      in de bij of krachtens algemene maatregel van bestuur aangewezen gevallen uit het kentekenregister gegevens,
      waaronder mede begrepen persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], verstrekt. Gegevens,
      waaronder mede begrepen persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in paragraaf
      3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming, kunnen ook worden verstrekt aan instellingen
      van internationale organisaties, voor zover dit ter uitvoering van een verdrag of een bindend besluit van een
      internationale organisatie vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '43.4'
    text: |-
      Aan bij of krachtens algemene maatregel van bestuur aangewezen personen of instanties of categorieën personen of
      instanties, niet zijnde de in het eerste tot en met derde lid bedoelde instanties, kunnen desgevraagd door de Dienst
      Wegverkeer voor de bij of krachtens algemene maatregel van bestuur aangegeven doeleinden uit het kentekenregister
      gevoelige gegevens, waaronder mede begrepen persoonsgegevens en persoonsgegevens van strafrechtelijke aard als
      bedoeld in [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '43.5'
    text: Niet-gevoelige gegevens uit het kentekenregister kunnen aan een ieder worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43
  - number: '43.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor de uitvoering van het eerste tot en met het vijfde lid
      nadere regels worden gesteld met betrekking tot de uit het kentekenregister te verstrekken gegevens, de wijze van
      verstrekking van die gegevens en kunnen voorwaarden worden verbonden aan de verstrekking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43
  - number: 43a.1
    text: |-
      De gegevensverstrekking aan ontvangers, bedoeld in [artikel 43][ref1] vindt plaats op door de Dienst Wegverkeer
      bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 43a.2
    text: |-
      De in [artikel 43, vierde en vijfde lid][ref1], bedoelde ontvangers zijn voor de verstrekking van gegevens een
      door de Dienst Wegverkeer vastgesteld tarief verschuldigd. De betrokkene zelf is alleen kosten verschuldigd voor
      bijkomende kopieën van persoonsgegevens, waaronder mede begrepen persoonsgegevens van strafrechtelijke aard als
      bedoeld in [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], alsmede voor de
      verstrekking van gegevens, niet zijnde persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 43a.3
    text: |-
      Onverminderd het tweede lid is degene die op grond van [artikel 43][ref1] een aanvraag indient tot geautomatiseerde
      verstrekking uit het kentekenregister van gegevens in door de Dienst Wegverkeer te bepalen gevallen een door deze
      dienst te bepalen aansluittarief verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 43b.1
    text: |-
      Een overheidsorgaan dat bij de vervulling van zijn publieke taak een gegeven nodig heeft dat bij of krachtens deze
      wet als authentiek gegeven is aangewezen en in het kentekenregister is opgenomen, maakt gebruik van dat gegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43b
  - number: 43b.2
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43b
  - number: 43b.2.a
    text: |-
      het overheidsorgaan ten aanzien van het betreffende gegeven een melding heeft gedaan als bedoeld in
      [artikel 43c, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43c
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 43c
        hoofdstuk: IV
        paragraaf: '3'
  - number: 43b.2.b
    text: |-
      bij het betreffende gegeven een aantekening is geplaatst als bedoeld in [artikel 43c, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43c
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 43c
        hoofdstuk: IV
        paragraaf: '3'
  - number: 43b.2.c
    text: bij wettelijk voorschrift anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43b
  - number: 43b.2.d
    text: |-
      een goede vervulling van de publieke taak van het overheidsorgaan door de onverkorte toepassing van het eerste lid
      wordt belet.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43b
  - number: 43b.3
    text: |-
      Een natuurlijke persoon of rechtspersoon aan wie door een overheidsorgaan een gegeven wordt gevraagd, waarop het
      eerste lid van toepassing is, behoeft dat gegeven niet mede te delen, behoudens voor zover het gegeven noodzakelijk
      wordt geacht voor een deugdelijke vaststelling van de identiteit van betrokkene of van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43b
  - number: 43c.1
    text: |-
      Een overheidsorgaan dat gerede twijfel heeft over de juistheid van een in het kentekenregister opgenomen authentiek
      gegeven, meldt die twijfel, onder opgave van redenen, aan de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43c
  - number: 43c.2
    text: |-
      Indien een melding als bedoeld in het eerste lid betrekking heeft op een gegeven dat afkomstig is uit een andere
      basisregistratie zendt de Dienst Wegverkeer de melding door aan de beheerder van dat register, tenzij met het
      overheidsorgaan dat een melding als bedoeld in het eerste lid doet is afgesproken dat dit overheidsorgaan de
      melding rechtstreeks doet aan de beheerder van het register waaruit het authentieke gegeven afkomstig is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43c
  - number: 43c.3
    text: |-
      De Dienst Wegverkeer tekent na ontvangst van een melding als bedoeld in het eerste lid, op de door deze dienst te
      bepalen wijze, in het kentekenregister aan dat het desbetreffende gegeven «in onderzoek» is, tenzij het een melding
      betreft die op grond van het tweede lid wordt doorgezonden aan de beheerder van een andere basisregistratie.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43c
  - number: 43c.4
    text: |-
      Indien een melding als bedoeld in het eerste lid betrekking heeft op een gegeven dat bij of krachtens deze wet als
      authentiek is aangewezen, besluit de Dienst Wegverkeer over wijziging van het gegeven en bericht deze dienst het
      overheidsorgaan dat de melding heeft gedaan onverwijld over deze beslissing.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43c
  - number: 43c.5
    text: |-
      Indien het besluit, bedoeld in het vierde lid, leidt tot wijziging van het authentieke gegeven doet de Dienst
      Wegverkeer onverwijld mededeling aan degene op wie het authentieke gegeven betrekking heeft, dan wel aan degene aan
      wie het kentekenbewijs is afgegeven voor het motorrijtuig of de aanhangwagen waarop het desbetreffende authentieke
      gegeven betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43c
  - number: 43c.6
    text: |-
      De Dienst Wegverkeer verwijdert de aantekening dat een gegeven in onderzoek is wanneer het besluit omtrent
      wijziging onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43c
  - number: 43c.7
    text: Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43c
  - number: 43d.1
    text: |-
      Indien de Dienst Wegverkeer constateert dat een door deze dienst in het kentekenregister geplaatst gegeven onjuist
      of ten onrechte in het kentekenregister is opgenomen, wijzigt of verwijdert deze dienst dat gegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43d
  - number: 43d.2
    text: |-
      Indien de Dienst Wegverkeer constateert dat een gegeven ten onrechte niet in het kentekenregister is opgenomen,
      neemt deze dienst dat gegeven alsnog in het kentekenregister op.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43d
  - number: 43d.3
    text: |-
      Van de beslissing tot wijzigen, verwijderen, dan wel alsnog opnemen van een authentiek gegeven in het
      kentekenregister doet de Dienst Wegverkeer onverwijld mededeling aan degene op wie het authentieke gegeven
      betrekking heeft, dan wel aan degene aan wie het kentekenbewijs is afgegeven voor het motorrijtuig of de
      aanhangwagen waarop het desbetreffende authentieke gegeven betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43d
  - number: 43e.1
    text: |-
      Indien een belanghebbende gegronde redenen heeft om aan te nemen dat een gegeven dat bij of krachtens deze wet als
      authentiek is aangemerkt of een niet-authentiek gegeven onjuist of ten onrechte wel, dan wel ten onrechte niet in
      het kentekenregister is opgenomen, kan hij onder opgave van die redenen aan de Dienst Wegverkeer een verzoek doen
      tot wijziging, verwijdering of opneming van dat gegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43e
  - number: 43e.2
    text: |-
      De Dienst Wegverkeer beslist naar aanleiding van een verzoek als bedoeld in het eerste lid over wijziging,
      verwijdering of opneming van het betreffende gegeven en bericht de belanghebbende die het verzoek heeft gedaan over
      deze beslissing.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43e
  - number: 43f
    text: |-
      Onverminderd [artikel 43c][ref1] zijn overheidsorganen gehouden om aan de Dienst Wegverkeer op de door deze dienst
      te bepalen wijze mededeling te doen van de hen in de uitoefening van hun functie ter kennis gekomen feiten, ingeval
      deze feiten aanleiding kunnen zijn om tot wijziging of aanvulling van de in het kentekenregister opgenomen gegevens
      over te gaan, dan wel anderszins van belang kunnen zijn voor de juistheid van deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43c
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel43f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 43c
        hoofdstuk: IV
        paragraaf: '3'
  - number: '44.1'
    text: |-
      De Dienst Wegverkeer neemt maatregelen met het oog op het waarborgen van de juistheid, de actualiteit en de
      volledigheid van het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel44
  - number: '44.2'
    text: |-
      De Dienst Wegverkeer laat ten minste eenmaal in de drie jaar een registeraccountant,
      dan wel een accountant die is ingeschreven in het register bedoeld in
      [artikel 36, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref1], een oordeel geven over de
      opzet en werking van het stelsel van interne beheersmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
  - number: '44.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitvoering van het eerste
      en tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel44
  - number: 45a.1
    text: |-
      Met het toezicht op het gebruik overeenkomstig het bepaalde bij of krachtens deze wet van uit het kentekenregister
      verstrekte gegevens zijn belast de bij besluit van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig
      besluit wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel45a
  - number: 45a.2
    text: |-
      Indien de Dienst Wegverkeer gerede twijfel heeft over de juistheid van een gegeven uit het kentekenregister dat
      betrekking heeft op een motorrijtuig of aanhangwagen, kan deze dienst degene aan wie het kentekenbewijs voor het
      betreffende motorrijtuig of aanhangwagen is afgegeven gelasten dat voertuig ter inspectie aan de Dienst Wegverkeer
      ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel45a
  - number: 45a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald in welke gevallen door de Dienst Wegverkeer een
      door deze dienst vastgesteld tarief ter zake van de kosten van toezicht als bedoeld in het eerste lid of van de
      inspectie bedoeld in het tweede lid in rekening wordt gebracht. Dit tarief wordt op door de Dienst Wegverkeer te
      bepalen wijze in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel45a
  - number: 45a.4
    text: |-
      Verstrekking van gegevens uit het kentekenregister kan achterwege worden gelaten indien naar het oordeel van de
      Dienst Wegverkeer sprake is van handelen in strijd met de doeleinden waarvoor dan wel de voorwaarden waaronder
      is verstrekt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel45a
  - number: '46.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld betreffende de met de registratie van kentekens
      samenhangende verplichtingen van degene:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel46
  - number: 46.1.a
    text: |-
      die de eigendom, het bezit of het houderschap van een motorrijtuig of een aanhangwagen, waarvoor nog geen kenteken
      is opgegeven, heeft verkregen;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel46
  - number: 46.1.b
    text: aan wie een kenteken is opgegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel46
  - number: 46.1.c
    text: |-
      die de eigendom, het bezit of het houderschap van een motorrijtuig of een aanhangwagen, waarvoor een kenteken is
      opgegeven, heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel46
  - number: '46.2'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel46
  - number: '47'
    text: |-
      Motorrijtuigen en aanhangwagens op de weg waarvoor een kenteken is opgegeven dienen overeenkomstig bij algemene
      maatregel van bestuur vastgestelde regels te zijn ingeschreven in het kentekenregister en tenaamgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel47
  - number: '48.1'
    text: |-
      Inschrijving in het kentekenregister en tenaamstelling vinden, tegen betaling, op de door de Dienst Wegverkeer
      vastgestelde wijze, van de daarvoor door deze dienst vastgestelde tarieven, plaats op aanvraag van:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel48
  - number: 48.1.a
    text: in Nederland woonachtige natuurlijke personen die de leeftijd van achttien jaren hebben bereikt, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel48
  - number: 48.1.b
    text: |-
      in Nederland woonachtige natuurlijke personen die de leeftijd van zestien jaren hebben bereikt indien de aanvraag
      betrekking heeft een inschrijving en tenaamstelling van een bromfiets, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel48
  - number: 48.1.c
    text: in Nederland gevestigde rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel48
  - number: '48.2'
    text: |-
      Inschrijving in het kentekenregister vindt slechts plaats indien het motorrijtuig of de aanhangwagen waarvoor
      de inschrijving wordt verlangd, overeenkomstig [artikel 22][ref1] of [26][ref2] is goedgekeurd voor toelating
      tot het verkeer op de weg en, indien na die toelating wijziging is aangebracht in de bouw of inrichting
      van dat voertuig, die wijziging, behoudens in het geval dat geen goedkeuring is vereist, overeenkomstig
      [artikel 99, eerste lid][ref3], of [100, eerste lid][ref4], is goedgekeurd voor toelating van het gewijzigde
      voertuig tot het verkeer op de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel99
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel100
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '99'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '100'
        hoofdstuk: V
        paragraaf: '8'
  - number: '48.3'
    text: |-
      In bepaalde uitzonderingsgevallen kan door de Dienst Wegverkeer een motorrijtuig of aanhangwagen worden
      ingeschreven, indien ten aanzien van het motorrijtuig of de aanhangwagen, waarvoor de inschrijving wordt verlangd,
      niet is voldaan aan het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel48
  - number: '48.4'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de ingevolge het eerste lid gestelde eisen aan de
      aanvrager van een inschrijving niet gelden ten aanzien van de aanvrager van een inschrijving ter zake van een
      kenteken als bedoeld in [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel38
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '48.5'
    text: |-
      Ingeval de aanvrager van een inschrijving en tenaamstelling van een bromfiets de leeftijd heeft van zestien of
      zeventien jaar, wordt diens wettelijke vertegenwoordiger verondersteld te hebben toegestemd in de aanvraag.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel48
  - number: '48.6'
    text: |-
      In afwijking van [artikel 47][ref1] kan in bij of krachtens algemene maatregel van bestuur bepaalde gevallen een
      voertuig in het kentekenregister worden ingeschreven zonder tenaamstelling. Door de Dienst Wegverkeer kan worden
      bepaald dat deze wijze van inschrijven gevolgen heeft voor het tijdstip van de verschuldigdheid van een deel van de
      in het eerste lid bedoelde tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel47
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '47'
        hoofdstuk: IV
        paragraaf: 4a
  - number: '48.7'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat in door de Dienst Wegverkeer te bepalen gevallen met een
      ingeschreven en te naam gesteld motorrijtuig of aanhangwagen niet op de weg mag worden gereden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel48
  - number: '48.8'
    text: Het verbod bedoeld in het zevende lid geldt vanaf een bij algemene maatregel van bestuur te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel48
  - number: '49.1'
    text: |-
      Onverminderd [artikel 48, eerste lid][ref1], wordt de inschrijving in het kentekenregister geweigerd:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '48'
        hoofdstuk: IV
        paragraaf: 4a
  - number: 49.1.a
    text: |-
      indien bij een ingevolge [hoofdstuk V][ref1] verrichte keuring blijkt dat de op het motorrijtuig of aanhangwagen
      aangebrachte gegevens op onrechtmatige wijze in overeenstemming zijn gebracht met de in het kentekenregister of op
      het overgelegde kentekenbewijs vermelde gegevens,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: V
  - number: 49.1.b
    text: indien blijkt dat de ter zake van het voertuig verschuldigde belastingen en rechten niet zijn voldaan,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel49
  - number: 49.1.c
    text: |-
      indien blijkt dat de krachtens een algemeen verbindend verklaarde overeenkomst op grond van de
      [Wet milieubeheer][ref1] verschuldigde afvalbeheersbijdrage voor autowrakken niet is voldaan, of


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 49.1.d
    text: |-
      in overige bij algemene maatregel van bestuur te bepalen gevallen overeenkomstig de bij die algemene maatregel van
      bestuur vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel49
  - number: '49.2'
    text: 'De inschrijving in het kentekenregister kan worden geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel49
  - number: 49.2.a
    text: |-
      voor het motorrijtuig of de aanhangwagen waarvoor de inschrijving wordt verlangd, op grond van het bij of krachtens
      deze wet bepaalde geen kenteken behoeft te zijn opgegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel49
  - number: 49.2.b
    text: |-
      uit het kentekenregister of een buitenlands register blijkt dat de eigenaar of houder van een motorrijtuig of een
      aanhangwagen onvrijwillig de beschikkingsmacht over dat voertuig heeft verloren.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel49
  - number: '49.3'
    text: |-
      Onverminderd [artikel 48, eerste lid][ref1], wordt de tenaamstelling geweigerd in bij algemene maatregel van
      bestuur te bepalen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '48'
        hoofdstuk: IV
        paragraaf: 4a
  - number: '50.1'
    text: |-
      De aanvrager van een tenaamstelling verschijnt persoonlijk bij een erkende instantie als bedoeld in de
      [artikelen 61a, eerste lid][ref1], of [62, eerste lid][ref2], of een daartoe door de Dienst Wegverkeer aangewezen
      vestiging van deze dienst, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 61a
        hoofdstuk: IV
        paragraaf: 4c
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 50.1.a
    text: |-
      de aanvraag namens hem wordt ingediend door degene aan wie door de Dienst Wegverkeer een erkenning als bedoeld in
      [artikel 62][ref1] is verleend dan wel, indien dit een rechtspersoon is, door diens gemachtigde, en deze voldoende
      zekerheid heeft verkregen over de identiteit van de aanvrager. Daartoe legt de aanvrager een document als bedoeld
      in [artikel 2, eerste lid, van de Paspoortwet][ref2], een geldig rijbewijs als bedoeld in [artikel 107][ref3] dan
      wel een rijbewijs als bedoeld in [artikel 108, eerste lid, onderdeel h][ref4], over. Degene die namens de aanvrager
      de aanvraag indient, legt bij de erkende instantie, bedoeld in [artikel 61a, eerste lid][ref5], het document,
      bedoeld in de tweede volzin, over, alsmede de volmacht en het bewijs dat aan hem een erkenning als bedoeld in
      artikel 62 is verleend,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel107
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel108
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '107'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '108'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: 61a
        hoofdstuk: IV
        paragraaf: 4c
  - number: 50.1.b
    text: |-
      volgens bij algemene maatregel van bestuur vast te stellen regels op andere wijze voldoende zekerheid kan worden
      verkregen over de identiteit van de aanvrager, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel50
  - number: 50.1.c
    text: de aanvraag langs elektronische weg op een door de Dienst Wegverkeer te bepalen wijze wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel50
  - number: '50.2'
    text: |-
      Indien bij de aanvraag, bedoeld in het eerste lid, onderdeel a, gebruik wordt gemaakt van een document als
      bedoeld in [artikel 2 van de Paspoortwet][ref1], wordt bij de aanvraag tevens een de aanvrager betreffend
      gewaarmerkt afschrift van de benodigde gegevens uit de basisregistratie personen overgelegd dat niet langer dan
      drie maanden voor het tijdstip van de aanvraag is verstrekt. Onze Minister kan de bevoegdheid van de krachtens
      [artikel 62][ref2] erkende persoon om de aanvraag namens de aanvrager in te dienen beperken tot één of meer
      specifiek voor die persoon met name te noemen instanties. Bij algemene maatregel van bestuur worden regels
      vastgesteld ter zake van de voorwaarden waaraan degene aan wie ingevolge artikel 62 een erkenning is verleend,
      voldoet om als gemachtigde, bedoeld in het eerste lid, onderdeel a, op te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '50.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de verplichting om persoonlijk te verschijnen niet
      geldt ten aanzien van de inschrijving en tenaamstelling ter zake van de opgave van een kenteken als bedoeld in
      [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel38
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '50.4'
    text: |-
      Indien de aanvraag geschiedt door een in Nederland gevestigde rechtspersoon die dient te zijn ingeschreven in een
      daartoe bij de wet aangewezen register of waarvan de onderneming dient te zijn ingeschreven in het handelsregister,
      geldt de verplichting om persoonlijk te verschijnen voor degene die krachtens de statuten bevoegd is de
      rechtspersoon te vertegenwoordigen. Indien er meerdere personen bevoegd zijn de rechtspersoon te vertegenwoordigen,
      geldt de verplichting voor een van hen. Een persoon die bevoegd is de rechtspersoon te vertegenwoordigen, kan bij
      gemachtigde verschijnen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel50
  - number: '50.5'
    text: |-
      De aanvraag van een inschrijving en tenaamstelling geschiedt overeenkomstig bij of krachtens algemene maatregel
      van bestuur vastgestelde regels. Deze regels kunnen mede dienstbaar zijn aan de heffing van de belasting van
      personenauto’s en motorrijwielen en van de motorrijtuigenbelasting alsmede aan de afdracht van de krachtens
      een algemeen verbindend verklaarde overeenkomst op grond van de [Wet milieubeheer][ref1] verschuldigde
      afvalbeheersbijdrage voor autowrakken en kunnen bepalen in welke gevallen het motorrijtuig of de aanhangwagen,
      waarvoor een inschrijving en tenaamstelling wordt aangevraagd, voor een onderzoek ter beschikking moet worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '50.6'
    text: |-
      De Dienst Wegverkeer is bevoegd te vorderen dat de aanvrager van een inschrijving en tenaamstelling een door of
      vanwege Onze Minister van Financiën afgegeven bewijs overlegt, waaruit blijkt dat ter zake van het motorrijtuig of
      de aanhangwagen verschuldigde belastingen en rechten zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel50
  - number: '51.1'
    text: |-
      Het is verboden voor het verkrijgen van een inschrijving in het kentekenregister en een tenaamstelling opzettelijk
      onjuiste opgaven te doen, onjuiste inlichtingen te verschaffen of onjuiste bewijsstukken en andere bescheiden over
      te leggen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel51
  - number: '51.2'
    text: |-
      Voor zover de bij de aanvraag van een inschrijving in het kentekenregister en tenaamstelling te verschaffen
      gegevens betreffen of mede betreffen gegevens die nodig worden geacht ter zake van de heffing van de belasting
      van personenauto’s en motorrijwielen en van de motorrijtuigenbelasting, wordt de verplichting tot het verstrekken
      van die gegevens beschouwd als een ingevolge de belastingwet opgelegde verplichting en zijn, indien ter zake
      onjuiste of onvolledige gegevens worden verstrekt – in afwijking van de bepalingen van deze wet – de bepalingen van
      [Hoofdstuk IX (Strafrechtelijke bepalingen) van de Algemene wet inzake rijksbelastingen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: IX
  - number: 51a.1
    text: |-
      Een tenaamstelling in het kentekenregister vervalt overeenkomstig bij algemene maatregel van bestuur vastgestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel51a
  - number: 51a.2
    text: |-
      Een tenaamstelling in het kentekenregister wordt overeenkomstig bij algemene maatregel van bestuur vastgestelde
      regels vervallen verklaard:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel51a
  - number: 51a.2.a
    text: |-
      indien de tenaamstelling heeft plaatsgevonden op grond van bij de inschrijving of tenaamstelling verschafte
      onjuiste gegevens en dat inschrijving zou zijn geweigerd indien de onjuistheid van die gegevens ten tijde van de
      aanvraag bekend zou zijn geweest, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel51a
  - number: 51a.2.b
    text: indien blijkt dat de tenaamstelling kennelijk abusievelijk heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel51a
  - number: 51a.3
    text: 'Onverminderd het eerste en tweede lid, kan een tenaamstelling vervallen worden verklaard:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel51a
  - number: 51a.3.a
    text: indien de ter zake van het voertuig verschuldigde belastingen en rechten niet zijn voldaan;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel51a
  - number: 51a.3.b
    text: |-
      indien het ingeschreven voertuig niet voldoet aan de bij of krachtens deze wet vastgestelde eisen, met uitzondering
      van de ingevolge [hoofdstuk III][ref1] met betrekking tot de toelating tot het verkeer op de weg vastgestelde
      eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: 51a.3.c
    text: |-
      indien in de bouw of inrichting van het ingeschreven voertuig wijzigingen zijn aangebracht die niet zijn
      goedgekeurd overeenkomstig het bepaalde bij of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel51a
  - number: 51a.3.d
    text: |-
      indien het ingeschreven voertuig een schadevoertuig betreft dat voldoet aan bij ministeriële regeling vastgestelde
      kenmerken, dan wel indien het voertuig na herstel van de schade niet voldoet aan de bij ministeriële regeling te
      stellen eisen ten aanzien van de wijze waarop de schade is hersteld;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel51a
  - number: 51a.3.e
    text: |-
      indien de eigenaar of houder van een voertuig onvrijwillig de beschikkingsmacht over dat voertuig heeft verloren,
      mits wordt voldaan aan de bij algemene maatregel van bestuur vastgestelde voorwaarden, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel51a
  - number: 51a.3.f
    text: in andere bij algemene maatregel van bestuur vast te stellen gevallen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel51a
  - number: 51a.4
    text: |-
      De Dienst Wegverkeer kan een vervallen verklaarde tenaamstelling laten herleven, dan wel laten herleven voor het
      rijden over de weg, indien de reden voor vervallenverklaring is komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel51a
  - number: 51a.5
    text: |-
      In bij algemene maatregel van bestuur vast te stellen gevallen kan worden bepaald dat een tenaamstelling na verloop
      van bij die algemene maatregel van bestuur te bepalen tijdsperiode van rechtswege vervalt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel51a
  - number: '52'
    text: Een kentekenbewijs bestaat uit een of meer bij algemene maatregel van bestuur aan te wijzen delen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel52
  - number: 52a.1
    text: |-
      Ter bevestiging van de inschrijving in het kentekenregister en tenaamstelling bedoeld in
      [artikel 48, eerste lid][ref1], wordt door de Dienst Wegverkeer een kentekenbewijs afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '48'
        hoofdstuk: IV
        paragraaf: 4a
  - number: 52a.2
    text: |-
      De Dienst Wegverkeer verstrekt tevens ten behoeve van wijziging van de tenaamstelling een tenaamstellingscode aan
      degene aan wie het kentekenbewijs is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel52a
  - number: 52a.3
    text: |-
      Uitreiking van het kentekenbewijs of een deel daarvan en verstrekking van de tenaamstellingscode vindt plaats op
      bij ministeriële regeling te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel52a
  - number: 52b
    text: |-
      De Dienst Wegverkeer brengt aantekeningen aan in dan wel verwijdert aantekeningen uit het kentekenregister,
      respectievelijk brengt aantekeningen aan op het kentekenbewijs dan wel verwijdert aantekeningen van het
      kentekenbewijs, voor zover dat bij of krachtens deze wet is voorgeschreven of mogelijk is gemaakt, dan wel voor de
      goede uitvoering van deze wet wenselijk is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel52b
  - number: 52c.1
    text: 'Een kentekenbewijs verliest zijn geldigheid door:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel52c
  - number: 52c.1.a
    text: het verval van de tenaamstelling in het kentekenregister;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel52c
  - number: 52c.1.b
    text: de afgifte van een vervangend kentekenbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel52c
  - number: 52c.1.c
    text: het onbevoegd daarin aanbrengen van wijzigingen;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel52c
  - number: 52c.1.d
    text: |-
      een schorsing als bedoeld in [art 67, eerste lid][ref1], voor de duur van de schorsing, of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel67
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel52c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '6'
  - number: 52c.1.e
    text: een ongeldigverklaring.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel52c
  - number: 52c.2
    text: |-
      In bij algemene maatregel van bestuur bepaalde gevallen kan een kentekenbewijs op verzoek van de eigenaar of houder
      van een motorvoertuig tegen betaling, op een door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door
      deze dienst vastgestelde tarief, door deze dienst ongeldig worden verklaard.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel52c
  - number: 52c.3
    text: |-
      De Dienst Wegverkeer kan verlangen dat een kentekenbewijs dat zijn geldigheid heeft verloren binnen een daarbij
      bepaalde termijn bij deze dienst wordt ingeleverd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel52c
  - number: 52c.4
    text: |-
      De Dienst Wegverkeer kan een ongeldig verklaard kentekenbewijs geldig verklaren, indien de reden voor
      ongeldigverklaring is komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel52c
  - number: 52c.5
    text: |-
      Onverminderd het eerste lid, onderdeel d, behoudt het kentekenbewijs zijn geldigheid ten behoeve van de wijziging
      van de tenaamstelling.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel52c
  - number: '53'
    text: |-
      De Dienst Wegverkeer geeft bij inschrijving in het kentekenregister en tenaamstelling tevens een keuringsbewijs
      voor het betrokken voertuig af indien:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel53
  - number: 53.a
    text: |-
      het voertuig is onderworpen aan een onderzoek dat ten minste een controle inhoudt op de eisen, bedoeld in
      [artikel 75, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: 53.b
    text: |-
      [artikel 72][ref1] voor dat voertuig geldt of binnen een jaar zal gaan gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: '54'
    text: |-
      Onze Minister kan aan besturen van verenigingen met volledige rechtsbevoegdheid, die behartiging van
      verkeersbelangen ten doel hebben, de bevoegdheid verlenen tot het afgeven van internationale bewijzen voor
      motorrijtuigen en aanhangwagens, bedoeld in internationale overeenkomsten, ten behoeve van het verkeer met
      motorrijtuigen en aanhangwagens in het buitenland.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel54
  - number: '55.1'
    text: |-
      Op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door deze
      dienst vastgestelde tarief, geeft deze dienst overeenkomstig bij algemene maatregel van bestuur vastgestelde regels
      vervangende bewijzen af voor:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel55
  - number: 55.1.a
    text: kentekenbewijzen, die versleten, geheel of ten dele onleesbaar, verloren geraakt of teniet gegaan zijn;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel55
  - number: 55.1.b
    text: kentekenbewijzen in geval van vermissing van de bijbehorende kentekenplaten.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel55
  - number: '55.2'
    text: |-
      Het vervangende bewijs treedt in de plaats van het eerder afgegeven kentekenbewijs en wordt niet afgegeven dan
      nadat het versleten of geheel of ten dele onleesbaar geworden kentekenbewijs, waarvoor het wordt afgegeven, is
      ingeleverd bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel55
  - number: '55.3'
    text: |-
      Op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door deze
      dienst vastgestelde tarief, verstrekt deze dienst overeenkomstig bij algemene maatregel van bestuur vastgestelde
      regels een vervangende tenaamstellingscode ten behoeve van een wijziging van de tenaamstelling.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel55
  - number: '55.4'
    text: |-
      De vervangende tenaamstellingscode treedt in de plaats van eerder afgegeven tenaamstellingscodes welke door de
      afgifte ongeldig worden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel55
  - number: '60.1'
    text: |-
      De houder van een kentekenbewijs is vanaf een bij algemene maatregel van bestuur vastgesteld tijdstip op eerste
      vordering van bij algemene maatregel van bestuur aangewezen personen verplicht tot overgifte van bij algemene
      maatregel van bestuur te bepalen delen van dat bewijs, indien naar het oordeel van die personen:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel60
  - number: 60.1.a
    text: |-
      ter zake van het voertuig, waarvoor het kentekenbewijs is afgegeven, de verschuldigde belastingen en rechten niet
      zijn voldaan;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel60
  - number: 60.1.b
    text: |-
      het voertuig waarvoor het kentekenbewijs is afgegeven, niet voldoet aan de bij of krachtens deze wet vastgestelde
      eisen, met uitzondering van de ingevolge [hoofdstuk III][ref1] met betrekking tot de toelating tot het verkeer op
      de weg vastgestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: 60.1.c
    text: |-
      het voertuig waarvoor het kentekenbewijs is afgegeven een schadevoertuig betreft dat voldoet aan bij ministeriële
      regeling vastgestelde kenmerken, dan wel indien het voertuig na herstel van de schade niet voldoet aan de bij
      ministeriële regeling te stellen eisen ten aanzien van de wijze waarop de schade is hersteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel60
  - number: '60.2'
    text: |-
      Indien het een kentekenbewijs betreft dat is afgegeven voor een aanhangwagen die overeenkomstig het bij
      ministeriële regeling bepaalde is voorzien van een identificatieplaat, kan aan de vordering worden voldaan binnen
      een bij die maatregel vastgestelde termijn.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel60
  - number: '60.3'
    text: |-
      De in het eerste lid bedoelde personen geven het kentekenbewijs na inzage terug aan degene die tot overgifte
      verplicht was.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel60
  - number: '60.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld omtrent de verplichting tot overgifte van
      kentekenbewijzen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel60
  - number: '61.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61
  - number: 61.1.c
    text: |-
      ten opzichte van een motorrijtuig of een aanhangwagen opzettelijk gebruik te maken van een kentekenbewijs dat niet
      aan de eigenaar of houder voor dat motorrijtuig of die aanhangwagen is afgegeven, als ware het aan deze voor dat
      motorrijtuig of die aanhangwagen afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61
  - number: 61a.1
    text: |-
      De Dienst Wegverkeer kan aan een rechtspersoon een erkenning verlenen waardoor deze gerechtigd is, tegen betaling
      namens de aanvrager van een door deze dienst vast te stellen tarief, motorrijtuigen en aanhangwagens te naam te
      stellen in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61a
  - number: 61a.2
    text: |-
      De erkenning houdt tevens de bevoegdheid in om namens de aanvrager de geldigheid van een kenteken te schorsen of
      een schorsing op te heffen conform [paragraaf 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: IV
        paragraaf: '6'
  - number: 61a.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gesteld die aan een erkenning worden verbonden en kunnen met
      betrekking tot die voorschriften regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61a
  - number: 61a.4
    text: |-
      Bij besluit van de Dienst Wegverkeer wordt de maximale hoogte vastgesteld van de prijs die een erkend bedrijf aan
      de aanvrager in rekening mag brengen voor zijn dienstverlening.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61a
  - number: 61b.1
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door deze dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend aan de natuurlijke persoon of rechtspersoon,
      die voldoet aan de bij ministeriële regeling vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61b
  - number: 61b.2
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot de aanvrager van een erkenning en de
      wijze waarop de uitvoering van de aanvraag tot tenaamstelling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61b
  - number: 61c.1
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Een zodanig besluit wordt bekend gemaakt door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61c
  - number: 61c.2
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61c
  - number: 61c.3
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld betreffende de wijze waarop het toezicht wordt gehouden
      en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend. Deze regels kunnen
      inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit
      de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61c
  - number: 61d.1
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie de erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61d
  - number: 61d.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat na indiening van het verzoek de erkenning gedurende een
      bij die algemene maatregel van bestuur vast te stellen termijn van kracht blijft.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61d
  - number: 61d.3
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61d
  - number: 61d.3.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61d
  - number: 61d.3.b
    text: |-
      de verplichtingen, vervat in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1],
      [artikel 61a, derde lid][ref2], en [artikel 61c, tweede lid][ref3], niet nakomt, of,


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel61c
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 61a
        hoofdstuk: IV
        paragraaf: 4c
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 61c
        hoofdstuk: IV
        paragraaf: 4c
  - number: 61d.3.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61d
  - number: 61d.4
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het derde lid, een erkenning schorsen voor een door hem daarbij
      vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61d
  - number: 61d.5
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het eerste en derde lid, bepalen dat een wachttijd geldt voor
      het aanvragen van een erkenning van maximaal 30 maanden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61d
  - number: 61d.6
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot het intrekken, wijzigen en
      schorsen van de erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61d
  - number: 61e
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 61a][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel61e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 61a
        hoofdstuk: IV
        paragraaf: 4c
  - number: '62.1'
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is motorrijtuigen en aanhangwagens, waarvan hij de eigendom heeft verkregen, in zijn bedrijfsvoorraad op
      te nemen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel62
  - number: '62.2'
    text: |-
      Aan de erkenning kunnen bij algemene maatregel van bestuur aangewezen bevoegdheden worden verbonden; een zodanige
      bevoegdheid maakt deel uit van de erkenning. Het in de [artikelen 62 tot en met 66][ref1] ten aanzien van
      erkenningen bepaalde is van overeenkomstige toepassing op bedoelde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: '62.3'
    text: |-
      De erkenning geldt voor de in de erkenning aangewezen groep of groepen van voertuigen en kan gelden voor bepaalde
      of voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel62
  - number: '62.4'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en kunnen
      met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel62
  - number: '62.5'
    text: |-
      De in [artikel 50, eerste lid, aanhef][ref1] bedoelde verplichting om bij de aanvraag tot inschrijving in
      het kentekenregister en tenaamstelling persoonlijk te verschijnen bij een erkende instantie als bedoeld in
      [artikel 61a, eerste lid][ref2], of in het eerste lid, geldt niet voor natuurlijke personen of rechtspersonen aan
      wie een erkenning als bedoeld in het eerste lid is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '50'
        hoofdstuk: IV
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 61a
        hoofdstuk: IV
        paragraaf: 4c
  - number: '63.1'
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door deze dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend aan de natuurlijke persoon of rechtspersoon,
      die voldoet aan de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de administratieve
      organisatie van de natuurlijke persoon of rechtspersoon alsmede de wijze waarop deze er voor zorgdraagt dat de aan
      de opname in bedrijfsvoorraad verbonden procedures in acht worden genomen. Voorts kunnen deze eisen mede dienstbaar
      zijn aan de uitvoering van de Wet milieubeheer.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel63
  - number: '63.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld met betrekking tot de aanvraag van een
      erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel63
  - number: '63.3'
    text: Bij ministeriële regeling worden regels vastgesteld ter uitvoering van het krachtens het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel63
  - number: '64.1'
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de *Staatscourant*. Het toezicht omvat in ieder geval het periodiek controleren van de bedrijfsvoorraad van degene
      aan wie de erkenning is verleend en van de ter zake van die bedrijfsvoorraad door deze gevoerde administratie.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel64
  - number: '64.2'
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel64
  - number: '64.3'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld betreffende de wijze waarop het toezicht wordt gehouden
      en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend. Deze regels kunnen
      inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit
      de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel64
  - number: '65.1'
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie de erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel65
  - number: '65.2'
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel65
  - number: 65.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel65
  - number: 65.2.b
    text: |-
      de verplichtingen, vervat in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] en
      [artikel 64, tweede lid][ref2], niet nakomt, of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel64
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '64'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 65.2.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel65
  - number: '65.3'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel65
  - number: '65.4'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het eerste en tweede lid, bepalen dat een wachttijd geldt voor
      het aanvragen van een erkenning van maximaal 30 maanden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel65
  - number: 65a
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld met betrekking tot het intrekken, wijzigen en schorsen
      van de erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel65a
  - number: '66'
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 62][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 66a.1
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor
      deze gerechtigd is de tenaamstelling van motorrijtuigen en aanhangwagens ten behoeve van een derde in het
      kentekenregister te beëindigen indien het motorrijtuig of de aanhangwagen door die derde wordt geëxporteerd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66a
  - number: 66a.2
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gesteld die aan een erkenning worden verbonden en kunnen met
      betrekking tot die voorschriften regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66a
  - number: 66b.1
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door deze dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend aan de natuurlijke persoon of rechtspersoon,
      die voldoet aan de bij ministeriële regeling gestelde eisen. Deze eisen betreffen onder meer de administratieve
      organisatie van de natuurlijke persoon of rechtspersoon alsmede de wijze waarop deze er voor zorgdraagt dat de aan
      de vervallenverklaring van de tenaamstelling wegens export verbonden procedures in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66b
  - number: 66b.2
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66b
  - number: 66b.3
    text: Bij ministeriële regeling worden regels gesteld ter uitvoering van het krachtens het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66b
  - number: 66b.4
    text: |-
      De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning op grond van
      [artikel 66d][ref1], juncto [artikel 65, tweede lid][ref2], is ingetrokken binnen een direct aan de datum van
      indiening van de aanvraag voorafgaande periode van twaalf weken, dan wel van zes maanden ingeval reeds twee of meer
      malen een dergelijke aan de aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel66d
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel65
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 66d
        hoofdstuk: IV
        paragraaf: 5a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '65'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 66c.1
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing
      in de *Staatscourant*. Het toezicht omvat in ieder geval het periodiek controleren van de ter zake van de
      vervallenverklaring van de tenaamstelling wegens export gevoerde administratie van degene aan wie de erkenning
      is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66c
  - number: 66c.2
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66c
  - number: 66c.3
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld betreffende de wijze waarop het toezicht wordt gehouden
      en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend. Deze regels kunnen
      inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit
      de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66c
  - number: 66d.1
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie de erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66d
  - number: 66d.2
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66d
  - number: 66d.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66d
  - number: 66d.2.b
    text: |-
      de verplichtingen, vervat in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] en
      [artikel 66c, tweede lid][ref2] niet nakomt, of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel66c
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 66c
        hoofdstuk: IV
        paragraaf: 5a
  - number: 66d.2.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66d
  - number: 66d.3
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66d
  - number: 66d.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het intrekken, wijzigen en schorsen van
      de erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66d
  - number: 66e
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 66a][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel66a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel66e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 66a
        hoofdstuk: IV
        paragraaf: 5a
  - number: '67.1'
    text: |-
      Indien met een voertuig geen gebruik van de weg wordt gemaakt, schorst de Dienst Wegverkeer op aanvraag van de
      eigenaar of houder van dat voertuig, tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief, de tenaamstelling in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel67
  - number: '67.2'
    text: |-
      De hoogte van het in het eerste lid bedoelde tarief kan voor verschillende groepen voertuigen dan wel eigenaren of
      houders van voertuigen verschillend worden vastgesteld. Voor aanvragen die worden ingediend binnen een jaar na de
      aanvraag van een schorsing welke ingevolge [artikel 68, eerste lid, onderdelen a en d][ref1], is geëindigd, kan het
      tarief hoger worden vastgesteld dan het tarief voor laatstgenoemde aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel68
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '68'
        hoofdstuk: IV
        paragraaf: '6'
  - number: '67.3'
    text: |-
      De aanvraag van een schorsing dient te geschieden overeenkomstig bij algemene maatregel van bestuur vastgestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel67
  - number: '67.4'
    text: Bij ministeriële regeling worden nadere regels vastgesteld omtrent het krachtens het derde lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel67
  - number: '67.5'
    text: |-
      De Dienst Wegverkeer plaatst bij het verlenen van de schorsing overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels in het kentekenregister een aantekening waaruit blijkt dat schorsing is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel67
  - number: '68.1'
    text: 'De schorsing eindigt:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel68
  - number: 68.1.a
    text: |-
      door opheffing als bedoeld in [artikel 69][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel69
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '69'
        hoofdstuk: IV
        paragraaf: '6'
  - number: 68.1.b
    text: |-
      door verloop van een bij ministeriële regeling bepaalde termijn vanaf het tijdstip waarop de schorsing is verleend,
      welke termijn per bij ministeriële regeling aan te wijzen categorieën van voertuigen kan verschillen,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel68
  - number: 68.1.c
    text: door het verval van de tenaamstelling in het kentekenregister, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel68
  - number: 68.1.d
    text: zodra met het voertuig gebruik van de weg wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel68
  - number: '68.2'
    text: |-
      Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat in bepaalde
      uitzonderingsgevallen tijdelijk kan worden afgeweken van het eerste lid, aanhef en onderdeel *d*.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel68
  - number: '69.1'
    text: De schorsing wordt op aanvraag van de eigenaar of houder door de Dienst Wegverkeer opgeheven.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel69
  - number: '69.2'
    text: |-
      De aanvraag van opheffing van de schorsing dient te geschieden overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel69
  - number: '69.3'
    text: Bij ministeriële regeling worden nadere regels vastgesteld omtrent het krachtens het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel69
  - number: 70a.1
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is een of meer van de in [artikel 40, tweede lid][ref1], bedoelde bij de erkenning aangewezen merken aan
      te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 70a.2
    text: Het is verboden om zonder de in het eerste lid bedoelde erkenning de aldaar bedoelde merken aan te brengen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70a
  - number: 70a.3
    text: |-
      Bij ministeriële regeling worden voorschriften vastgesteld die aan de erkenning worden verbonden en worden met
      betrekking tot die voorschriften regels vastgesteld. Die regels hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70a
  - number: 70a.3.a
    text: de fabricage en levering van kentekenplaten en onderdelen daarvan en de daarbij te volgen procedure;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70a
  - number: 70a.3.b
    text: |-
      de registratie van gegevens met betrekking tot de ingekochte materialen, de productie, de af- en uitval, de
      voorraad en de aflevering van kentekenplaten en onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70a
  - number: 70b.1
    text: |-
      De fabrikant van kentekenplaten is in geval van levering van kentekenplaten verplicht tot het vastleggen van
      gegevens omtrent: van:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70b
  - number: 70b.1.a
    text: het betrokken kenteken;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70b
  - number: 70b.1.b
    text: |-
      de aard en het nummer van het identiteitsdocument van degene door, respectievelijk namens wie de kentekenplaten
      worden aangevraagd, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70b
  - number: 70b.1.c
    text: het aantal afgegeven kentekenplaten.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70b
  - number: 70b.2
    text: |-
      Indien de kentekenplaten worden aangevraagd namens een rechtspersoon of door een daartoe bij ministeriële regeling
      aangewezen erkend bedrijf als bedoeld in [artikel 62][ref1], worden in plaats van de gegevens, bedoeld in het
      eerste lid, onder b, vastgelegd de bij ministeriële regeling aangewezen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 70b.3
    text: |-
      Indien bij de levering van kentekenplaten die door, respectievelijk namens een natuurlijk persoon zijn aangevraagd,
      een ander identiteitsdocument dan een rijbewijs of paspoort wordt overgelegd, wordt tevens vastgelegd de
      naam, de beginletters van de voornaam of voornamen en het adres van degene door, respectievelijk namens wie de
      kentekenplaten worden aangevraagd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70b
  - number: 70b.4
    text: |-
      De fabrikant verstrekt gegevens die zijn vastgelegd op grond van het eerste tot en met derde lid in een
      registratie, uitsluitend en desgevraagd aan de ambtenaren van de Dienst Wegverkeer, belast met het toezicht op
      de naleving van de uit de erkenning voortvloeiende verplichtingen, en aan de ambtenaren van politie belast met de
      handhaving van de uit de erkenning voortvloeiende verplichtingen en van de verboden, bedoeld in [artikel 41][ref1],
      voor zover deze gegevens noodzakelijk zijn voor de goede vervulling van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel41
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 70b.5
    text: De vastgelegde gegevens worden gedurende één jaar na de vastlegging bewaard.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70b
  - number: 70b.6
    text: Bij ministeriële regeling worden nadere regels vastgesteld omtrent de inrichting en het beheer van het register.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70b
  - number: 70c.1
    text: |-
      Na afloop van de termijn, bedoeld in [artikel 70b, vijfde lid][ref1], worden de daar bedoelde vastgelegde gegevens
      overgedragen aan de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70b
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70b
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70c.2
    text: |-
      Uit de registratie worden door de Dienst Wegverkeer uitsluitend en desgevraagd aan de ambtenaren van politie
      belast met de handhaving van de uit de erkenning voortvloeiende verplichtingen en van de verboden, bedoeld in
      [artikel 41][ref1], gegevens verstrekt voor zover deze noodzakelijk zijn voor de goede vervulling van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel41
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 70c.3
    text: |-
      De vastgelegde gegevens worden door de Dienst Wegverkeer maximaal vijf jaar na de overdracht, bedoeld in het eerste
      lid, bewaard.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70c
  - number: 70c.4
    text: |-
      De Dienst Wegverkeer stelt ten aanzien van het verwerken van de persoonsgegevens als bedoeld in het eerste lid, een
      reglement vast.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70c
  - number: 70d.1
    text: |-
      De erkenning wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief verleend indien de natuurlijke persoon of rechtspersoon voldoet aan
      de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de administratieve organisatie van
      de natuurlijke persoon of rechtspersoon alsmede de wijze waarop deze ervoor zorg draagt dat de aan het aanbrengen
      van de merken verbonden procedures in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70d
  - number: 70d.2
    text: Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70d
  - number: 70d.3
    text: |-
      De erkenning wordt in ieder geval geweigerd indien een reeds aan de aanvrager verleende erkenning op grond van
      [artikel 70f, tweede lid][ref1], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel van zes maanden ingeval reeds twee of meer malen een dergelijke aan
      de aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70f
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70f
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70e.1
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de Staatscourant. Het toezicht omvat in ieder geval het periodiek controleren van de organisatie van degene aan wie
      de erkenning is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70e
  - number: 70e.2
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70e
  - number: 70e.3
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld betreffende de wijze waarop het toezicht wordt gehouden
      en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend. Deze regels kunnen
      inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit
      de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70e
  - number: 70f.1
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie die erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70f
  - number: 70f.2
    text: |-
      De Dienst Wegverkeer kan een erkenning intrekken of wijzigen dan wel de daaraan verbonden voorschriften wijzigen
      indien degene aan wie de erkenning is verleend:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70f
  - number: 70f.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70f
  - number: 70f.2.b
    text: |-
      een verplichting als bedoeld in [artikel 70e][ref1] niet nakomt, of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70e
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70e
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70f.2.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70f
  - number: 70f.3
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70f
  - number: 70g
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 70a][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70a
        hoofdstuk: IV
        paragraaf: '7'
  - number: 70h
    text: |-
      Bij de verkrijging van een kentekenplaat worden de bij ministeriële regeling aangewezen identiteitsdocumenten en
      overige documenten overgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70h
  - number: 70i.1
    text: 'De eigenaar of houder van een motorrijtuig of aanhangwagen is verplicht in geval van:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70i
  - number: 70i.1.a
    text: |-
      overdracht van dat motorrijtuig of die aanhangwagen aan een erkend bedrijf als bedoeld in [artikel 62][ref1]
      ten behoeve van uitvoer naar het buitenland of voorgoed buitengebruikstelling, tot inlevering van de betrokken
      kentekenplaten bij dat bedrijf tegelijk met de overdracht;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 70i.1.b
    text: |-
      beëindiging van de tenaamstelling van dat motorrijtuig of die aanhangwagen door een erkend bedrijf als bedoeld in
      [artikel 66a][ref1] ten behoeve van uitvoer naar het buitenland, tot inlevering van de betrokken kentekenplaten bij
      dat bedrijf tegelijk met de beëindiging van de tenaamstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel66a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 66a
        hoofdstuk: IV
        paragraaf: 5a
  - number: 70i.2
    text: |-
      In geval van uitvoer naar het buitenland anders dan door een erkend bedrijf als bedoeld in [artikel 62][ref1] of
      [artikel 66a][ref2], is de eigenaar of houder van het motorrijtuig of de aanhangwagen verplicht tot inlevering van
      de betrokken kentekenplaten bij de Dienst Wegverkeer tegelijk met de uitvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel66a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 66a
        hoofdstuk: IV
        paragraaf: 5a
  - number: 70i.3
    text: |-
      Indien het kentekenbewijs zijn geldigheid heeft verloren, anders dan in geval van het eerste of het tweede lid, kan
      de Dienst Wegverkeer verlangen dat de betrokken kentekenplaten binnen een bepaalde termijn bij deze dienst worden
      ingeleverd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70i
  - number: 70j.1
    text: |-
      Indien de betrokken kentekenplaten overeenkomstig [artikel 70i][ref1] worden ingeleverd bij de Dienst Wegverkeer
      onderscheidenlijk een erkend bedrijf als bedoeld in [artikel 62][ref2] of [artikel 66a][ref3] is deze dienst,
      onderscheidenlijk dit bedrijf verplicht tot het vastleggen van gegevens omtrent van:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70i
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel66a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70j
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70i
        hoofdstuk: IV
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 66a
        hoofdstuk: IV
        paragraaf: 5a
  - number: 70j.1.a
    text: het betrokken kenteken, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70j
  - number: 70j.1.b
    text: het aantal ingeleverde kentekenplaten.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70j
  - number: 70j.2
    text: |-
      De Dienst Wegverkeer, onderscheidenlijk het erkende bedrijf, is voorts, overeenkomstig bij ministeriële regeling
      vast te stellen regels, verplicht tot vernietiging van de ingeleverde kentekenplaten en tot registratie van de
      vernietiging.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70j
  - number: 70k.1
    text: De Dienst Wegverkeer houdt een register van fietsen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70k
  - number: 70k.2
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de inhoud van het register alsmede de verwerking, het
      gebruik en de verstrekking van de gegevens daaruit.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70k
  - number: 70k.3
    text: |-
      Het verzamelen van gegevens ten behoeve van het in het eerste lid bedoelde register geschiedt ter voorkoming van
      diefstal en heling van fietsen, alsmede ten behoeve van de opsporing van gestolen fietsen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70k
  - number: 70k.4
    text: |-
      Registratie van gegevens in het register geschiedt op de door de Dienst Wegverkeer te bepalen wijze. In door de
      Dienst Wegverkeer te bepalen gevallen kan een door deze dienst te bepalen aansluittarief verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70k
  - number: 70k.5
    text: |-
      In door de Dienst Wegverkeer te bepalen gevallen geschiedt de registratie van gegevens in, dan wel verstrekking van
      gegevens uit het register tegen betaling van een door deze dienst te bepalen tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70k
  - number: 70l.1
    text: |-
      De Dienst Wegverkeer houdt een register van bij ministeriële regeling aan te wijzen categorieën van mobiele
      objecten anders dan fietsen waarvoor op grond van deze wet geen kenteken is opgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70l
  - number: 70l.2
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de inhoud van het register alsmede de verwerking, het
      gebruik en de verstrekking van de gegevens daaruit.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70l
  - number: 70l.3
    text: |-
      Het verzamelen van gegevens ten behoeve van het in het eerste lid bedoelde register geschiedt ter voorkoming van
      diefstal en heling van mobiele objecten, ten behoeve van de opsporing van gestolen mobiele objecten, alsmede ten
      behoeve van andere, bij ministeriële regeling te bepalen doeleinden, met inachtneming van [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: 70l.4
    text: |-
      Het [vierde en vijfde lid van artikel 70k][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70k
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70k
        hoofdstuk: IVA
  - number: 70m
    text: |-
      Het is eenieder verboden om de tellerstand van bij algemene maatregel van bestuur vastgestelde categorieën
      motorrijtuigen die dienen te zijn ingeschreven en tenaamgesteld zodanig te wijzigen of te doen wijzigen of de
      werking van de kilometerteller zodanig te beïnvloeden of te doen beïnvloeden dat de op de teller aangegeven afstand
      niet overeenkomt met de door dat motorrijtuig werkelijk afgelegde afstand.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70m
  - number: 70n.1
    text: |-
      Door de Dienst Wegverkeer erkende bedrijven verstrekken in bij algemene maatregel van bestuur te bepalen gevallen
      aan de Dienst Wegverkeer de tellerstand van een motorrijtuig dat dient te zijn ingeschreven en tenaamgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70n
  - number: 70n.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop de tellerstand wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel70n
  - number: '71'
    text: 'Bij ministeriële regeling worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel71
  - number: 71.a
    text: |-
      de eisen waaraan voertuigen moeten voldoen waarmee over de weg wordt gereden, waarbij onderscheid kan worden
      gemaakt tussen verschillende wegen;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel71
  - number: 71.b
    text: de inrichting van voertuigen die op de weg staan;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel71
  - number: 71.c
    text: de eisen waaraan voertuigen moeten voldoen voor de afgifte van een keuringsbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel71
  - number: 71.d
    text: |-
      de eisen waaraan ter uitvoering van verdragen of van besluiten van volkenrechtelijke organisaties of van één
      of meer instellingen van de Europese Unie, al dan niet gezamenlijk, moet worden voldaan met betrekking tot het
      uitvoeren van onderhoud aan voertuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel71
  - number: 71a
    text: 'Bij ministeriële regeling kan worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel71a
  - number: 71a.a
    text: |-
      het voldoen aan de in [artikel 71][ref1] bedoelde voorschriften wordt aangetoond door middel van in die regels
      voorgeschreven apparatuur,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
  - number: 71a.b
    text: die apparatuur is goedgekeurd door een door Onze Minister aangewezen keuringsinstelling,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel71a
  - number: 71a.c
    text: |-
      die apparatuur alleen kan worden goedgekeurd indien de in die regels genoemde technische specificaties van die
      apparatuur die noodzakelijk zijn om het periodiek onderzoek, bedoeld in onderdeel d, uit te kunnen voeren, op de in
      die regels aangegeven wijze bekend worden gemaakt,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel71a
  - number: 71a.d
    text: |-
      die apparatuur met een in die regels vast te stellen periodiciteit is onderzocht door deze keuringsinstelling,
      dan wel door een door Onze Minister of door deze keuringsinstelling erkende onderzoeksgerechtigde en dat middelen
      die worden gebruikt om die apparatuur voor gebruik geschikt te maken, zijn gecertificeerd door een door die
      keuringsinstelling erkende instelling, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel71a
  - number: 71a.e
    text: |-
      bij de erkenning van een onderzoeksgerechtigde of instelling als bedoeld in onderdeel d, wordt voldaan aan de in
      die regels opgenomen voorschriften.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel71a
  - number: '72.1'
    text: |-
      Voor een motorrijtuig of een aanhangwagen, waarvoor een kenteken is opgegeven dan wel dient te zijn opgegeven,
      dient een keuringsbewijs te zijn afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel72
  - number: '72.2'
    text: 'Het keuringsbewijs dient:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel72
  - number: 72.2.a
    text: te voldoen aan de door de Dienst Wegverkeer vastgestelde eisen inzake inrichting en uitvoering,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel72
  - number: 72.2.b
    text: zijn geldigheid niet te hebben verloren, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel72
  - number: 72.2.c
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel72
  - number: '72.3'
    text: 'Voor overtreding van het eerste lid en het bepaalde bij of krachtens het tweede lid zijn aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel72
  - number: 72.3.a
    text: |-
      voor zover het betreft een motorrijtuig, de eigenaar of houder, alsmede in het geval dat met dat motorrijtuig over
      de weg wordt gereden, de bestuurder, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel72
  - number: 72.3.b
    text: |-
      voor zover het betreft een aanhangwagen, de eigenaar of houder, alsmede in het geval dat de aanhangwagen met een
      motorrijtuig over de weg wordt voortbewogen, de bestuurder van dat motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel72
  - number: '73.1'
    text: |-
      [Artikel 72][ref1] geldt niet indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.1.a
    text: |-
      voor het motorrijtuig of de aanhangwagen ter zake van een keuring die ingevolge een andere dan deze wet is
      voorgeschreven en blijkens aanwijzing bij ministeriële regeling ten minste een controle inhoudt op de eisen,
      bedoeld in [artikel 75, eerste lid][ref1], een keuringsdocument waarvan de geldigheidsduur niet is verstreken, is
      afgegeven, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: 73.1.b
    text: |-
      de geldigheid van het voor het betrokken voertuig afgegeven kentekenbewijs is geschorst overeenkomstig
      [paragraaf 6 van hoofdstuk IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: IV
        paragraaf: '6'
  - number: '73.2'
    text: 'Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel73
  - number: 73.2.a
    text: |-
      [artikel 72][ref1] niet geldt voor motorrijtuigen en aanhangwagens zolang gerekend vanaf het tijdstip waarop deze
      voertuigen voor het eerst op de weg zijn toegelaten, nog geen bij algemene maatregel van bestuur te bepalen termijn
      is verstreken, die voor verschillende groepen van voertuigen, alsmede voor voertuigen die voor, onderscheidenlijk
      na een bij algemene maatregel van bestuur te bepalen tijdstip voor het eerst op de weg zijn toegelaten verschillend
      kan worden vastgesteld; bij algemene maatregel van bestuur kan nader worden bepaald op welk tijdstip een voertuig
      geacht wordt voor het eerst op de weg te zijn toegelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.2.b
    text: |-
      [artikel 72][ref1] niet geldt voor nader aangewezen groepen van motorrijtuigen of aanhangwagens. Hieronder vallen
      in ieder geval aanhangwagens met een toegestane maximum massa van niet meer dan 3500 kg;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.2.c
    text: |-
      in bepaalde uitzonderingsgevallen tijdelijk wordt of kan worden afgeweken van [artikel 72][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 73.2.d
    text: |-
      [artikel 72][ref1] gedurende een nader te bepalen termijn na het tijdstip van verstrijken van de geldigheidsduur
      van het voor het voertuig afgegeven keuringsbewijs niet geldt voor het op de weg staan van dat voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: '73.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot het tweede lid, onderdelen *b*
      en *c*.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel73
  - number: '74'
    text: |-
      Het is verboden ten opzichte van een motorrijtuig of een aanhangwagen opzettelijk gebruik te maken van een
      keuringsbewijs dat niet voor dat voertuig is afgegeven, als ware het voor dat voertuig afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel74
  - number: '75.1'
    text: |-
      Een keuringsbewijs wordt door degene die ingevolge [artikel 78][ref1] met de afgifte van keuringsrapporten
      is belast, afgegeven op aanvraag en tegen betaling op de door deze vastgestelde wijze van het door deze
      vastgestelde tarief indien het motorrijtuig of de aanhangwagen heeft voldaan aan de eisen die ingevolge
      [artikel 71, onderdeel c][ref2], aan dat voertuig worden gesteld, voorzover deze eisen niet ingevolge het
      tweede lid buiten toepassing blijven. Het hiervoor bedoelde tarief omvat mede een door de Dienst Wegverkeer
      vastgesteld bedrag ter zake van het attenderen door deze dienst op de in [artikel 72][ref3] opgenomen
      verplichting. Indien degene die met de afgifte van keuringsrapporten is belast een persoon is als bedoeld in
      [artikel 78, eerste lid, onder b][ref4], draagt deze dit bedrag af aan de Dienst Wegverkeer op de door deze dienst
      vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: '75.2'
    text: |-
      Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat voor nader
      aangewezen groepen van motorrijtuigen - zolang gerekend vanaf het tijdstip waarop deze voertuigen voor het
      eerst op de weg zijn toegelaten, nog geen bij algemene maatregel van bestuur vast te stellen termijn die ten
      hoogste drie jaren bedraagt, is verstreken - ten behoeve van de afgifte van een keuringsbewijs slechts behoeft
      te worden voldaan aan de ingevolge [artikel 71][ref1] gestelde eisen die betrekking hebben op het bestrijden van
      luchtverontreiniging. Bij algemene maatregel van bestuur kan nader worden bepaald op welk tijdstip een voertuig
      geacht wordt voor het eerst op de weg te zijn toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel71
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
  - number: '75.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot de in het tweede lid bedoelde
      voorwaarden en groepen van motorrijtuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel75
  - number: '76.1'
    text: |-
      Bij de aanvraag van een keuringsrapport dient de aanvrager de bij algemene maatregel van bestuur vastgestelde
      bescheiden over te leggen en inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel76
  - number: '76.2'
    text: |-
      De aanvrager dient het motorrijtuig of de aanhangwagen waarvoor de afgifte van een keuringsrapport wordt verlangd,
      overeenkomstig bij algemene maatregel van bestuur vast te stellen regels ten behoeve van de afgifte van dat bewijs
      ter beschikking te stellen van degene die ingevolge [artikel 78][ref1] met de afgifte van keuringsrapporten is
      belast.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: '76.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld omtrent de wijze waarop wordt onderzocht of een
      voertuig voldoet aan de in [artikel 75][ref1] bedoelde eisen, alsmede omtrent hetgeen verder met betrekking tot de
      behandeling van de aanvraag van een keuringsrapport noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: '77'
    text: |-
      Het voor afgifte van een keuringsrapport aangeboden voertuig dient overeen te stemmen met de in het daarbij
      behorende kentekenbewijs en de in het kentekenregister vermelde gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel77
  - number: '78.1'
    text: 'Keuringsrapporten worden overeenkomstig bij algemene maatregel van bestuur vastgestelde regels afgegeven door:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel78
  - number: 78.1.a
    text: |-
      de Dienst Wegverkeer in het kader van een door deze dienst verrichte keuring van het voertuig waarvoor de afgifte
      wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel78
  - number: 78.1.b
    text: |-
      een ingevolge [artikel 84][ref1] erkende natuurlijke persoon of rechtspersoon in het kader van een door deze
      verrichte keuring van het voertuig waarvoor de afgifte wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel84
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '84'
        hoofdstuk: V
        paragraaf: '5'
  - number: '78.2'
    text: |-
      De Dienst Wegverkeer draagt er zorg voor dat indien in onvoldoende mate keuringsrapporten kunnen worden afgegeven
      door andere natuurlijke personen of rechtspersonen als bedoeld in het eerste lid, onderdeel b, dan die zich
      bezighouden met het verrichten van onderhoud of reparaties aan motorrijtuigen of aanhangwagens, de Dienst
      Wegverkeer kan voorzien in zodanige afgifte.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel78
  - number: '78.3'
    text: |-
      De Dienst Wegverkeer geeft geen keuringsrapporten af voor zover in voldoende mate keuringsrapporten kunnen worden
      afgegeven door natuurlijke personen of rechtspersonen als bedoeld in het eerste lid, onderdeel b, die zich niet
      bezighouden met het verrichten van onderhoud of reparaties aan motorrijtuigen of aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel78
  - number: '79'
    text: |-
      Degene die ingevolge [artikel 78][ref1] met de afgifte van keuringsbewijzen is belast, doet van het voornemen
      tot de afgifte van zodanig bewijs op de bij ministeriële regeling te bepalen wijze mededeling aan de beheerder
      van het kentekenregister. Van de weigering van de afgifte van een keuringsbewijs wordt mededeling gedaan in bij
      ministeriële regeling vast te stellen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel78
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '78'
        hoofdstuk: V
        paragraaf: '3'
  - number: '80.1'
    text: |-
      De Dienst Wegverkeer of de erkenninghouder geeft voor keuringsbewijzen die versleten of geheel of ten dele
      onleesbaar zijn, dan wel verloren zijn geraakt of teniet zijn gegaan, op aanvraag en tegen betaling, op de door
      deze dienst vastgestelde wijze, van het daarvoor door deze dienst vastgestelde tarief vervangende keuringsbewijzen
      af.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel80
  - number: '80.2'
    text: |-
      Een vervangend keuringsbewijs wordt niet afgegeven dan nadat het versleten of geheel of ten dele onleesbaar
      geworden bewijs is ingeleverd bij de Dienst Wegverkeer of de erkenninghouder.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel80
  - number: '81.1'
    text: |-
      Bij algemene maatregel van bestuur wordt, voorzover nodig onder daarbij te stellen voorwaarden, bepaald op welk
      tijdstip een keuringsbewijs geldigheid verkrijgt en voor welke duur een keuringsbewijs geldig is. Deze duur
      kan voor verschillende groepen van voertuigen, alsmede voor voertuigen die voor, onderscheidenlijk na een bij
      algemene maatregel van bestuur te bepalen tijdstip voor het eerst op de weg zijn toegelaten, verschillend worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel81
  - number: '81.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot de in het eerste lid bedoelde
      voorwaarden en groepen van motorrijtuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel81
  - number: '82'
    text: |-
      Onverminderd de [artikelen 81][ref1], [86, vierde lid][ref2], en [91, vierde lid][ref3], verliest een
      keuringsbewijs zijn geldigheid:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel91
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '81'
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '86'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '91'
        hoofdstuk: V
        paragraaf: '6'
  - number: 82.a
    text: door afgifte van een vervangend keuringsbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel82
  - number: 82.b
    text: door het onbevoegd daarin aanbrengen van wijzigingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel82
  - number: '83.1'
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is keuringsrapporten af te geven voor motorrijtuigen en aanhangwagens, waarvoor [artikel 72][ref1]
      geldt, met uitzondering van bussen als bedoeld in de [Wet personenvervoer 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011470
  - number: '83.2'
    text: |-
      Een erkenning geldt voor motorrijtuigen en aanhangwagens, die behoren tot een in de erkenning aangewezen groep, en
      kan gelden voor bepaalde of voor onbepaalde tijd. De aanwijzing kan geen betrekking hebben op de leeftijd of het
      merk van motorrijtuigen en aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel83
  - number: '83.3'
    text: |-
      Een erkenning, verleend aan een natuurlijke persoon of rechtspersoon, die een keuringsdienst of een
      onderhoudsdienst voor het eigen wagenpark exploiteert, geldt slechts voor de eigen voertuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel83
  - number: '83.4'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en kunnen
      met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel83
  - number: '84.1'
    text: |-
      De erkenning wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief verleend indien de natuurlijke persoon of rechtspersoon voldoet
      aan de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de voor de keuringen
      benodigde apparatuur en ruimte alsmede de deskundigheid van de voor de keuringen beschikbare personen. Ten
      aanzien van de voor de keuringen benodigde apparatuur kan bij die ministeriële regeling de eis worden gesteld
      dat die apparatuur is goedgekeurd door een door Onze Minister aan te wijzen keuringsinstelling en met de in
      die regeling vast te stellen periodiciteit is onderzocht door deze keuringsinstelling dan wel door een door
      deze keuringsinstelling erkende onderzoeksgerechtigde en kunnen regels worden vastgesteld met betrekking tot de
      erkenning van onderzoeksgerechtigden. Bij ministeriële regeling kan worden bepaald dat middelen die worden gebruikt
      om deze apparatuur voor gebruik geschikt te maken zijn gecertificeerd door een door die keuringsinstelling erkende
      instelling en kunnen regels worden vastgesteld met betrekking tot die erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel84
  - number: '84.2'
    text: Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel84
  - number: '85'
    text: |-
      De erkende natuurlijke personen of rechtspersonen zijn verplicht het door de aanvrager ter keuring aangeboden
      voertuig te keuren, indien zij daartoe gerechtigd zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel85
  - number: 85a.1
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon de bevoegdheid verlenen motorrijtuigen en aanhangwagens,
      waarvoor [artikel 72][ref1] geldt, met uitzondering van bussen als bedoeld in de Wet personenvervoer, aan een
      keuring te onderwerpen. Ten bewijze van deze bevoegdheid verstrekt de Dienst Wegverkeer de betrokken persoon een
      bevoegdheidspas.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: 85a.2
    text: |-
      De bevoegdheid voertuigen aan een keuring te onderwerpen geldt voor motorrijtuigen en aanhangwagens die behoren tot
      een in de verlening van de bevoegdheid voertuigen aan een keuring te onderwerpen aangewezen groep, en kan gelden
      voor bepaalde of onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel85a
  - number: 85a.3
    text: |-
      De bevoegdheid voertuigen aan een keuring te onderwerpen wordt verleend indien de natuurlijke persoon beschikt
      over een examencertificaat van een door Onze Minister aangewezen exameninstantie en overigens voldoet aan bij
      ministeriële regeling vastgestelde eisen. Daarbij kan aan de Dienst Wegverkeer de bevoegdheid worden verleend
      voorwaarden vast te stellen ten aanzien van het voldoen aan deze eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel85a
  - number: 85a.4
    text: |-
      Bij ministeriële regeling worden regels vastgesteld met betrekking tot de aanvraag tot het verlenen van de
      bevoegdheid voertuigen aan een keuring te onderwerpen en met betrekking tot de bevoegdheidspas.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel85a
  - number: 85a.5
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan de bevoegdheid voertuigen aan een keuring
      te onderwerpen worden verbonden en kunnen met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel85a
  - number: 85a.6
    text: |-
      [Artikel 17, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] is van overeenkomstige toepassing op
      het vaststellen van het tarief voor het examen dat de natuurlijke persoon dient af te leggen om het in het derde
      lid bedoelde certificaat te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel17
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '17'
  - number: '86.1'
    text: |-
      De Dienst Wegverkeer onderwerpt ten minste drie van elke honderd voertuigen na een verrichte keuring
      steekproefsgewijs aan een herkeuring met het oog op het toezicht op:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel86
  - number: 86.1.a
    text: de juiste uitvoering van de keuring;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel86
  - number: 86.1.b
    text: het aan een keuring onderwerpen door daartoe bevoegde natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel86
  - number: '86.2'
    text: |-
      De eigenaar of houder van een motorrijtuig of een aanhangwagen, waarvoor een herkeuring wordt geëist, is verplicht
      het voertuig op de plaats van de keuring beschikbaar te houden totdat de herkeuring heeft plaatsgevonden. Deze
      verplichting geldt voor een periode van ten hoogste 90 minuten na de in [artikel 79][ref1] bedoelde mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel79
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '79'
        hoofdstuk: V
        paragraaf: '3'
  - number: '86.3'
    text: |-
      Het keuringsrapport van een motorrijtuig of een aanhangwagen waarvoor een herkeuring wordt geëist wordt pas
      afgegeven op het moment dat de periode genoemd in het vorige lid is verstreken of nadat de herkeuring heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel86
  - number: '86.4'
    text: |-
      De geldigheid van het keuringsbewijs vervalt indien de eigenaar of houder niet voldoet aan de in het tweede lid
      bedoelde verplichtingen of indien het motorrijtuig of de aanhangwagen bij de herkeuring niet voldoet aan de eisen,
      bedoeld in [artikel 75, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: '86.5'
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel86
  - number: '86.6'
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel86
  - number: '86.7'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop de steekproef wordt
      uitgevoerd, alsmede betreffende de verplichting tot medewerking daaraan van de eigenaar of houder. Deze regels
      kunnen inhouden dat een verscherpt toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of
      meer uit de erkenning voortvloeiende verplichtingen of in strijd met een of meer uit de bevoegdheid voertuigen aan
      een keuring te onderwerpen voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel86
  - number: 86a.1
    text: |-
      De Dienst Wegverkeer laat met het oog op het toezicht op het verrichten van keuringen, keuringen uitvoeren door het
      ter keuring aanbieden van een voertuig in bij ministeriële regeling vast te stellen gevallen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel86a
  - number: 86a.2
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld betreffende de wijze waarop de keuring wordt uitgevoerd.
      Deze regels kunnen inhouden dat verscherpt toezicht wordt gehouden indien blijkt dat er door een natuurlijke
      persoon die daartoe niet bevoegd is motorrijtuigen en aanhangwagens, waarvoor [artikel 72][ref1] geldt, met
      uitzondering van bussen als bedoeld in de Wet personenvervoer, aan een keuring worden onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel86a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
        hoofdstuk: V
        paragraaf: '2'
  - number: '87.1'
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie die erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87
  - number: '87.2'
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87
  - number: 87.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87
  - number: 87.2.b
    text: |-
      in strijd met de eisen, bedoeld in [artikel 75, eerste lid][ref1], of de regels, bedoeld in
      [artikel 76, derde lid][ref2], een keuringsbewijs afgeeft voor een motorrijtuig of een aanhangwagen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel76
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '76'
        hoofdstuk: V
        paragraaf: '3'
  - number: 87.2.c
    text: een keuringsrapport afgeeft voor een motorrijtuig of een aanhangwagen, waarvoor de erkenning niet geldt,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87
  - number: 87.2.d
    text: |-
      de verplichting, vervat in [artikel 85][ref1], [86, zesde lid][ref2], [90, vierde lid][ref3], of
      [91, vierde lid][ref4], niet nakomt,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel90
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel91
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '85'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '86'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '90'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '91'
        hoofdstuk: V
        paragraaf: '6'
  - number: 87.2.e
    text: |-
      weigert een keuringsbewijs af te geven voor een motorrijtuig of een aanhangwagen, waarvoor de erkenning
      geldt, hoewel dat voertuig bij een keuring, verricht met inachtneming van de regels, bedoeld in
      [artikel 76, derde lid][ref1], voldoet aan de eisen, bedoeld in [artikel 75, eerste lid][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '76'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: 87.2.f
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87
  - number: '87.3'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, onderdelen *a, d* en *f*, een erkenning
      schorsen voor een door hem daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87
  - number: '87.4'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het eerste en tweede lid, bepalen dat een wachttijd geldt voor
      het aanvragen van een erkenning van maximaal 30 maanden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87
  - number: 87a.1
    text: |-
      De Dienst Wegverkeer trekt de bevoegdheid voertuigen aan een keuring te onderwerpen in, indien degene aan wie die
      bevoegdheid is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87a
  - number: 87a.2
    text: |-
      De Dienst Wegverkeer kan de bevoegdheid voertuigen aan een keuring te onderwerpen intrekken of de daaraan verbonden
      voorschriften wijzigen, indien degene aan wie die bevoegdheid is verleend:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87a
  - number: 87a.2.a
    text: niet meer voldoet aan de voor de bevoegdheid voertuigen aan een keuring te onderwerpen gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87a
  - number: 87a.2.b
    text: |-
      in strijd met de regels, bedoeld in [artikel 76, derde lid][ref1], een voertuig aan een onderzoek onderwerpt,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel76
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '76'
        hoofdstuk: V
        paragraaf: '3'
  - number: 87a.2.c
    text: |-
      handelt in strijd met een of meer andere uit de bevoegdheid voertuigen aan een keuring te onderwerpen
      voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87a
  - number: 87a.3
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, onderdelen a en c, de bevoegdheid voertuigen
      aan een keuring te onderwerpen schorsen voor een door deze dienst daarbij vast te stellen termijn die ten hoogste
      twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel87a
  - number: '88.1'
    text: |-
      De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie. In dat
      geval wordt de kennisgeving na daartoe strekkend verzoek van de belanghebbende in een beschikking vastgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel88
  - number: '88.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld met betrekking tot het toezicht en het verscherpen
      daarvan, alsmede met betrekking tot het intrekken, wijzigen en schorsen van de erkenning of bevoegdheid tot keuren.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel88
  - number: '89'
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 83][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel83
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '83'
        hoofdstuk: V
        paragraaf: '5'
  - number: '90.1'
    text: |-
      Tegen een beschikking tot weigering van de afgifte van een keuringsbewijs kan een belanghebbende bezwaar maken of
      administratief beroep instellen bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel90
  - number: '90.2'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] kan tegen een beschikking tot weigering van
      de afgifte van een keuringsbewijs slechts bezwaar worden gemaakt of administratief beroep worden ingesteld terstond
      nadat de beschikking is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '90.3'
    text: |-
      Het bezwaar of administratief beroep wordt slechts in behandeling genomen indien het voertuig in de staat waarin
      het zich ten tijde van de keuring bevond, onmiddellijk op een door de Dienst Wegverkeer bepaalde plaats ter
      beschikking wordt gesteld ten behoeve van een herkeuring door een door de Dienst Wegverkeer aangewezen deskundige.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel90
  - number: '90.4'
    text: |-
      In afwijking van de [artikelen 7:15][ref1] en [7:28 van de Algemene wet bestuursrecht][ref2] dient bij de indiening
      van het bezwaar- of beroepschrift een bedrag ter vergoeding van de aan de herkeuring verbonden kosten te worden
      betaald. De hoogte van het bedrag en de wijze van betaling worden vastgesteld door de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '90.5'
    text: |-
      Degene die de beschikking tot weigering van de afgifte van een keuringsbewijs heeft gegeven, wordt in de
      gelegenheid gesteld bij de herkeuring aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel90
  - number: '90.6'
    text: |-
      Indien het voertuig volgens het oordeel van de deskundige voldoet aan de in [artikel 75][ref1] bedoelde eisen,
      geeft de Dienst Wegverkeer alsnog het aangevraagde keuringsbewijs af en wordt het in het vierde lid bedoelde
      bedrag terugbetaald aan de indiener van het bezwaar- of beroepschrift. Is in dit geval de beschikking tot weigering
      van de afgifte van een keuringsbewijs gegeven door een erkende natuurlijke persoon of rechtspersoon, dan is
      deze vorenbedoeld bedrag verschuldigd aan de Dienst Wegverkeer en gehouden dit te betalen op de door deze dienst
      vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
        hoofdstuk: V
        paragraaf: '3'
  - number: '91.1'
    text: |-
      Tegen een beschikking tot afgifte van een keuringsbewijs kan een belanghebbende bezwaar maken of administratief
      beroep instellen bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel91
  - number: '91.2'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] kan tegen een beschikking tot afgifte van
      een keuringsbewijs bezwaar worden gemaakt of administratief beroep worden ingesteld gedurende een bij algemene
      maatregel van bestuur te stellen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '91.3'
    text: |-
      Het bezwaar of administratief beroep wordt slechts in behandeling genomen indien het voertuig op een door de Dienst
      Wegverkeer bepaalde plaats ter beschikking wordt gesteld ten behoeve van een onderzoek door een door de Dienst
      Wegverkeer aangewezen deskundige.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel91
  - number: '91.4'
    text: |-
      In afwijking van de [artikelen 7:15][ref1] en [7:28 van de Algemene wet bestuursrecht][ref2] dient bij de indiening
      van het bezwaar- of beroepschrift een bedrag ter vergoeding van de aan het onderzoek verbonden kosten te worden
      betaald. De hoogte van het bedrag en de wijze van betaling worden vastgesteld door de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '91.5'
    text: |-
      Degene die de beschikking tot afgifte van een keuringsbewijs heeft gegeven, wordt in de gelegenheid gesteld bij het
      onderzoek aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel91
  - number: '91.6'
    text: |-
      Indien het voertuig volgens het oordeel van de deskundige ten tijde van de keuring op grond waarvan het
      keuringsbewijs is afgegeven, redelijkerwijze niet aan de keuringseisen kan hebben voldaan, daarbij in het
      bijzonder gelet op de termijn die is verstreken tussen de keuring en het onderzoek, verklaart de Dienst Wegverkeer
      het voor het voertuig afgegeven keuringsbewijs alsnog ongeldig en wordt het in het vierde lid bedoelde bedrag
      terugbetaald aan de indiener van het bezwaar- of beroepschrift. Is in dit geval de beschikking tot afgifte van
      een keuringsbewijs gegeven door een erkende natuurlijke persoon of rechtspersoon, dan is deze vorenbedoeld bedrag
      verschuldigd aan de Dienst Wegverkeer en gehouden dit te betalen op de door deze dienst vastgestelde wijze.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel91
  - number: '92.1'
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is om bij algemene maatregel van bestuur aangewezen categorieën van systemen, onderdelen, technische
      eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers die niet dienen te
      zijn goedgekeurd voor toelating tot het verkeer op de weg in te bouwen in voertuigen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel92
  - number: '92.2'
    text: |-
      De erkenning geldt voor de in de erkenning aangegeven werkzaamheden ter zake van het in voertuigen inbouwen van
      in de erkenning aangewezen systemen, onderdelen, technische eenheden, uitrustingstukken of voorzieningen ter
      bescherming van weggebruikers en passagiers. De erkenning kan gelden voor bepaalde of onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel92
  - number: '92.3'
    text: Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel92
  - number: '93.1'
    text: |-
      De erkenning wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief verleend, indien de natuurlijke persoon of rechtspersoon voldoet aan
      bij ministeriële regeling vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel93
  - number: '93.2'
    text: Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel93
  - number: '93.3'
    text: |-
      De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning op grond van
      [artikel 95, tweede lid][ref1], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel van zes maanden in geval reeds twee of meer malen een dergelijke aan
      de aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel95
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '95'
        hoofdstuk: V
        paragraaf: 6a
  - number: '94.1'
    text: |-
      De Dienst Wegverkeer onderwerpt een bij ministeriële regeling aangewezen aantal systemen, onderdelen, technische
      eenheden, uitrustingstukken of voorzieningen ter bescherming van weggebruikers en passagiers steekproefsgewijs aan
      een keuring met het oog op het toezicht op de juiste inbouw van het systeem, het onderdeel, de technische eenheid
      of het uitrustingstuk of de voorziening ter bescherming van weggebruikers en passagiers.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel94
  - number: '94.2'
    text: |-
      Degene aan wie de erkenning is verleend, is gehouden tot betaling, op door de Dienst Wegverkeer vastgestelde wijze,
      van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel94
  - number: '94.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop de steekproef
      wordt uitgevoerd, alsmede betreffende de verplichting tot medewerking daaraan van degene aan wie een erkenning
      is verleend en van de eigenaar of houder van het voertuig waarvoor een keuring wordt geëist. Deze regels kunnen
      inhouden dat een verscherpt toezicht wordt gehouden, indien blijkt dat wordt gehandeld in strijd met een of meer
      uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel94
  - number: '94.4'
    text: De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel94
  - number: '95.1'
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie die erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel95
  - number: '95.2'
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen, indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel95
  - number: 95.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel95
  - number: 95.2.b
    text: |-
      de verplichtingen, vervat in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] en
      [artikel 94, derde lid][ref2], niet nakomt; of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel94
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '94'
        hoofdstuk: V
        paragraaf: 6a
  - number: 95.2.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel95
  - number: '95.3'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel95
  - number: '95.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot het intrekken, wijzigen en
      schorsen van de erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel95
  - number: '96'
    text: |-
      Het is een ieder die niet beschikt over een geldige erkenning als bedoeld in [artikel 92][ref1] verboden zich op
      zodanige wijze te gedragen, dat bij het publiek de indruk kan worden gewekt dat een dergelijke erkenning aan hem
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel92
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '92'
        hoofdstuk: V
        paragraaf: 6a
  - number: '98'
    text: |-
      Indien in de bouw of inrichting van een voertuig dat ingevolge [hoofdstuk III][ref1] tot het verkeer op de weg is
      toegelaten, na die toelating wijziging is aangebracht, dient die wijziging, voorzover dit bij ministeriële regeling
      is bepaald, te zijn goedgekeurd voor toelating van het gewijzigde voertuig tot het verkeer op de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
  - number: '99.1'
    text: |-
      Goedkeuring wordt op aanvraag en tegen betaling op door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor
      door deze dienst vastgestelde tarief door deze dienst verleend, indien de aangebrachte wijziging bij een door deze
      dienst verrichte keuring heeft voldaan aan de ingevolge [hoofdstuk III][ref1] en [hoofdstuk V][ref2] voor deze
      goedkeuring vastgestelde eisen. De keuring kan mede omvatten die delen van het voertuig waarvoor de aangebrachte
      wijziging gevolgen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006622
        hoofdstuk: V
  - number: '99.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld betreffende het door de aanvrager voor de keuring
      ter beschikking stellen van het voertuig, het door de aanvrager overleggen van bescheiden en verstrekken van
      inlichtingen ter zake van de keuring alsmede betreffende de wijze waarop de keuring wordt verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel99
  - number: '100.1'
    text: |-
      De goedkeuring voor een wijziging in de bouw of inrichting van een voertuig wordt door de Dienst Wegverkeer
      verleend zonder dat de in [artikel 99][ref1] bedoelde keuring heeft plaatsgevonden, indien door een daartoe door
      de Dienst Wegverkeer erkende natuurlijke persoon of rechtspersoon wordt gewaarborgd dat de aangebrachte wijziging
      voldoet aan de ingevolge [hoofdstuk III][ref2] en [hoofdstuk V][ref3] voor deze goedkeuring vastgestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '99'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0006622
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0006622
        hoofdstuk: V
  - number: '100.2'
    text: |-
      De erkenning geldt voor de in de erkenning aangegeven werkzaamheden ter zake van het wijzigen van de bouw of
      inrichting van voertuigen die behoren tot een in de erkenning aangewezen groep. De erkenning kan gelden voor
      bepaalde of voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel100
  - number: '100.3'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en kunnen
      met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel100
  - number: '101.1'
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door deze dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend aan de natuurlijke persoon of rechtspersoon
      die voldoet aan de bij ministeriële regeling vastgestelde eisen. Deze eisen betreffen onder meer de organisatie
      van de aanvrager alsmede het proces volgens hetwelk de aanvrager zijn werkzaamheden verricht, alsmede de voor
      de werkzaamheden benodigde apparatuur. Ten aanzien van de voor de werkzaamheden benodigde apparatuur kan bij
      die ministeriële regeling de eis worden gesteld dat die apparatuur is goedgekeurd door een door Onze Minister
      aan te wijzen keuringsinstelling en met de in die regeling vast te stellen periodiciteit is onderzocht door deze
      keuringsinstelling dan wel door een door deze keuringsinstelling erkende onderzoeksgerechtigde en kunnen regels
      worden vastgesteld met betrekking tot de erkenning van onderzoeksgerechtigden. Bij ministeriële regeling kan worden
      bepaald dat middelen die worden gebruikt om deze apparatuur voor gebruik geschikt te maken zijn gecertificeerd
      door een door die keuringsinstelling erkende instelling en kunnen regels worden vastgesteld met betrekking tot
      die erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel101
  - number: '101.2'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag tot erkenning. Bij
      ministeriele regeling worden nadere regels vastgesteld met betrekking tot de aanvraag van een erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '102.1'
    text: |-
      Met het toezicht op de naleving van de uit de erkenning voortvloeiende verplichtingen zijn belast de bij besluit
      van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit wordt mededeling gedaan door plaatsing
      in de *Staatscourant*. Tot dit toezicht kan behoren het steekproefsgewijs keuren van door een erkende natuurlijke
      persoon of rechtspersoon aangebrachte wijzigingen in de bouw of inrichting van voertuigen. Voorts kan tot het
      toezicht behoren het periodiek controleren van de organisatie van degene aan wie de erkenning is verleend alsmede
      het proces volgens hetwelk hij zijn werkzaamheden verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel102
  - number: '102.2'
    text: |-
      Degene aan wie een erkenning is verleend, is gehouden tot betaling, op de door de Dienst Wegverkeer vastgestelde
      wijze, van het door deze dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel102
  - number: '102.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop het toezicht wordt
      gehouden en de verplichting tot medewerking daaraan van degene aan wie een erkenning is verleend en van de eigenaar
      of houder van het voertuig waarvoor een keuring wordt geëist. Deze regels kunnen inhouden dat een verscherpt
      toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit de erkenning voortvloeiende
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel102
  - number: '102.4'
    text: |-
      De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie. In dat
      geval wordt de kennisgeving na daartoe strekkend verzoek van de belanghebbende in een beschikking vastgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel102
  - number: '103.1'
    text: De Dienst Wegverkeer trekt een erkenning in, indien degene aan wie de erkenning is verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel103
  - number: '103.2'
    text: 'De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel103
  - number: 103.2.a
    text: niet meer voldoet aan de voor de erkenning gestelde eisen,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel103
  - number: 103.2.b
    text: |-
      de verplichtingen, vervat in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] en
      [artikel 102, tweede lid][ref2], niet nakomt, of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel102
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '102'
        hoofdstuk: V
        paragraaf: '8'
  - number: 103.2.c
    text: handelt in strijd met een of meer andere uit de erkenning voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel103
  - number: '103.3'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel103
  - number: '103.4'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, bepalen dat een wachttijd geldt voor het
      aanvragen van een erkenning van maximaal 30 maanden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel103
  - number: 103a
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld met betrekking tot het intrekken, wijzigen en schorsen
      van de erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel103a
  - number: '104'
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 100][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel100
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '100'
        hoofdstuk: V
        paragraaf: '8'
  - number: '105'
    text: |-
      Indien de tenaamstelling van een motorrijtuig of een aanhangwagen ingevolge
      [artikel 51a, derde lid, onderdeel b of d][ref1], vervallen is verklaard of indien een aanzegging is gedaan als
      bedoeld in [artikel 37, vijfde lid, onderdeel b][ref2], wordt het voertuig goedgekeurd alvorens de tenaamstelling
      kan herleven of het kentekenbewijs door de Dienst Wegverkeer geldig kan worden verklaard of kan worden
      teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel51a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 51a
        hoofdstuk: IV
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '106.1'
    text: |-
      De goedkeuring wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het
      daarvoor door deze dienst vastgestelde tarief door deze dienst verleend, indien het voertuig bij een door de dienst
      verrichte keuring heeft beantwoord aan de bij of krachtens deze wet vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel106
  - number: '106.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld betreffende het door de aanvrager voor de keuring
      ter beschikking stellen van het voertuig, het door de aanvrager overleggen van bescheiden en verstrekken van
      inlichtingen ter zake van de keuring alsmede betreffende de wijze waarop de keuring wordt verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel106
  - number: 106a.1
    text: |-
      De goedkeuring van een schadevoertuig na verval van de tenaamstelling kan door de Dienst Wegverkeer worden verleend
      zonder dat de in [artikel 106][ref1] bedoelde keuring heeft plaatsgevonden, indien door een daartoe door de Dienst
      Wegverkeer erkende natuurlijk persoon of rechtspersoon wordt gewaarborgd dat het voertuig voldoet aan de eisen,
      bedoeld in artikel 106, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel106
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel106a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '106'
        hoofdstuk: V
        paragraaf: '9'
  - number: 106a.2
    text: |-
      De erkenning geldt voor de in de erkenning aangegeven werkzaamheden ter zake van voertuigen die behoren tot een in
      de erkenning aangewezen groep. De erkenning kan gelden voor bepaalde of onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel106a
  - number: 106a.3
    text: |-
      De [artikelen 100, derde lid][ref1], en [101 tot en met 103][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel101
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel106a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '100'
        hoofdstuk: V
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '101'
        hoofdstuk: V
        paragraaf: '8'
  - number: 106b
    text: |-
      Het is een ieder aan wie niet een erkenning als bedoeld in [artikel 106a][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel106a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel106b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 106a
        hoofdstuk: V
        paragraaf: 9a
  - number: '107.1'
    text: |-
      Aan de bestuurder van een motorrijtuig op de weg dient door de daartoe bevoegde autoriteit een rijbewijs te zijn
      afgegeven voor het besturen van motorrijtuigen van de categorie waartoe dat motorrijtuig behoort.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel107
  - number: '107.2'
    text: 'Het rijbewijs dient:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel107
  - number: 107.2.a
    text: te voldoen aan de bij ministeriële regeling vastgestelde eisen inzake inrichting, uitvoering en invulling,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel107
  - number: 107.2.b
    text: zijn geldigheid niet te hebben verloren, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel107
  - number: 107.2.c
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel107
  - number: '107.3'
    text: |-
      Indien de aanvrager als ingezetene is ingeschreven in de basisregistratie personen,
      wordt het in de basisregistratie opgenomen burgerservicenummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1], op de bij ministeriële regeling
      vastgestelde wijze op het rijbewijs vermeld. Indien de aanvrager niet als ingezetene is ingeschreven in de
      basisregistratie personen, wordt op het rijbewijs een bij ministeriële regeling vastgestelde aanduiding vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: '108.1'
    text: |-
      [Artikel 107][ref1] is niet van toepassing op bestuurders van:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
        hoofdstuk: VI
        afdeling: '1'
  - number: 108.1.a
    text: |-
      bromfietsen als bedoeld in [artikel 1, eerste lid, onderdeel e, subonderdeel d][ref1], en gehandicaptenvoertuigen
      die zijn uitgerust met een motor en bij algemene maatregel van bestuur aangewezen landbouw- of bosbouwtrekkers en
      motorrijtuigen met beperkte snelheid;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
        hoofdstuk: '1'
  - number: 108.1.b
    text: |-
      motorrijtuigen, gedurende de tijd dat aan die bestuurders rijonderricht in de zin van de
      [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven, voor zover het motorrijtuig daarbij niet onder
      toezicht wordt bestuurd en overigens is voldaan aan de bij algemene maatregel van bestuur gestelde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 108.1.c
    text: |-
      motorrijtuigen, gedurende de tijd dat door die bestuurders een rijproef wordt afgelegd in het kader van een
      onderzoek, door of vanwege de overheid ingesteld, naar hun rijvaardigheid of geschiktheid, voor zover het
      motorrijtuig daarbij niet onder toezicht wordt bestuurd en overigens is voldaan aan de bij algemene maatregel van
      bestuur gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: 108.1.d
    text: |-
      motorrijtuigen, indien die bestuurders vreemdelingen in de zin van de [Vreemdelingenwet 2000][ref1] zijn, die
      op grond van hun hoedanigheid van of betrekking tot diplomatiek of consulair personeel dan wel op grond van hun
      hoedanigheid van of betrekking tot personeel in dienst van een in Nederland gevestigde internationale organisatie
      houder zijn van een door Onze Minister van Buitenlandse Zaken verstrekt identiteitsbewijs voor geprivilegieerden
      en aan wie, tenzij het een bestuurder van een bromfiets of een andere dan bij algemene maatregel van bestuur
      aangewezen landbouw- of bosbouwtrekker of motorrijtuig met beperkte snelheid betreft, door het daartoe bevoegde
      gezag buiten Nederland een rijbewijs is afgegeven dat geldig is voor het besturen van een motorrijtuig van de
      categorie waarmee wordt gereden;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 108.1.e
    text: |-
      motorrijtuigen, indien die bestuurders lid zijn van een krijgsmacht of behoren tot de civiele dienst van een
      krijgsmacht die in het kader van het op 19 juni 1951 te Londen gesloten Verdrag tussen de Staten die partij zijn
      bij het Noord-Atlantisch Verdrag nopens de rechtspositie van hun krijgsmachten, in Nederland is gelegerd, dan wel
      behoren tot het gezin van een lid van een krijgsmacht als hiervoor bedoeld of tot het gezin van een tot de civiele
      dienst van zodanige krijgsmacht behorende persoon, en aan wie, tenzij het een bestuurder van een bromfiets of een
      andere dan bij algemene maatregel van bestuur aangewezen landbouw- of bosbouwtrekker of motorrijtuig met beperkte
      snelheid betreft, door het daartoe bevoegde gezag in de Staat van herkomst of één van zijn samenstellende delen een
      rijbewijs is afgegeven dat geldig is voor het besturen van een motorrijtuig van de categorie waarmee wordt gereden;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: 108.1.f
    text: |-
      motorrijtuigen, anders dan bromfietsen of andere dan bij algemene maatregel van bestuur aangewezen landbouw- of
      bosbouwtrekkers of motorrijtuigen met beperkte snelheid, indien die bestuurders buiten Nederland woonachtig zijn
      en zij zich bevinden in het internationaal verkeer, mits aan hen door het daartoe bevoegde gezag buiten Nederland
      een rijbewijs is afgegeven dat geldig is voor het besturen van een motorrijtuig van de categorie waarmee wordt
      gereden alsmede, in de gevallen waarin zulks is vereist op grond van internationale overeenkomsten die Nederland
      binden, aan hen buiten Nederland een internationaal rijbewijs is afgegeven dat geldig is voor het besturen van een
      motorrijtuig van de categorie waarmee wordt gereden;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: 108.1.g
    text: |-
      motorrijtuigen, anders dan bromfietsen of andere dan bij algemene maatregel van bestuur aangewezen landbouw- of
      bosbouwtrekkers of motorrijtuigen met beperkte snelheid, indien die bestuurders in Nederland woonachtig zijn en aan
      hen door het daartoe bevoegde gezag buiten Nederland, anders dan in een andere lidstaat van de Europese Unie of in
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, een
      rijbewijs is afgegeven dat geldig is voor het besturen van een motorrijtuig van de categorie waarmee wordt gereden,
      zo lang sedert de dag waarop zij zich in Nederland hebben gevestigd, nog geen 185 dagen zijn verstreken;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: 108.1.h
    text: |-
      motorrijtuigen, anders dan andere dan bij algemene maatregel van bestuur aangewezen landbouw- of bosbouwtrekkers
      of motorrijtuigen met beperkte snelheid, indien die bestuurders in Nederland woonachtig zijn en aan hen door het
      daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, een rijbewijs is afgegeven dat geldig is
      voor het besturen van een motorrijtuig van de categorie waarmee wordt gereden:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: 108.1.h.1°
    text: |-
      indien het een rijbewijs betreft dat is afgegeven voor een of meer van de categorieën AM, A1, A2, A, B, B1 of BE,
      gedurende de periode die is gelegen tussen de datum van vestiging van die bestuurders in Nederland en de datum
      waarop sedert de datum van afgifte van dat rijbewijs maximaal vijftien jaren zijn verstreken, dan wel, indien die
      periode korter is dan twee jaren en het een rijbewijs betreft met een langere geldigheidsduur dan vijftien jaren,
      gedurende twee jaren vanaf de datum van vestiging van die bestuurder in Nederland;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: 108.1.h.2°
    text: |-
      indien het een rijbewijs betreft dat is afgegeven voor een of meer van de categorieën C1, C1E, C, CE, D1, D1E, D
      of DE, gedurende de periode die is gelegen tussen de datum van vestiging van die bestuurders in Nederland en de
      datum waarop sedert de datum van afgifte van dat rijbewijs maximaal vijf jaren zijn verstreken, dan wel, indien
      die periode korter is dan twee jaren en het een rijbewijs betreft met een langere geldigheidsduur dan vijf jaren,
      gedurende twee jaren vanaf de datum van vestiging van die bestuurders in Nederland.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: 108.1.i
    text: 'bromfietsen, indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: 108.1.i.1°
    text: |-
      die bestuurders buiten Nederland, anders dan in een andere lidstaat van de Europese Unie, een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, woonachtig zijn en zij
      zich bevinden in het internationaal verkeer;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: 108.1.i.2°
    text: |-
      die bestuurders afkomstig zijn uit een staat anders dan een andere lidstaat van de Europese Unie, een andere staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland en zij in Nederland
      woonachtig zijn, zolang sedert de dag waarop zij zich in Nederland hebben gevestigd, nog geen 185 dagen verstreken
      zijn;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: 108.1.i.3°
    text: |-
      die bestuurders in een andere lidstaat van de Europese Unie, een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland, woonachtig zijn en zij zich in het internationaal
      verkeer bevinden, en zij beschikken over een door het daartoe bevoegde gezag in een van deze staten afgegeven:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: 108.1.i.3°.a
    text: rijbewijs dat geldig is voor de categorie AM, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: 108.1.i.3°.b
    text: rijbewijs dat geldig is voor een andere categorie dan AM, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: 108.1.i.4°
    text: |-
      die bestuurders in Nederland woonachtig zijn en aan hen door het daartoe bevoegde gezag in een andere lidstaat
      van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland, een rijbewijs is afgegeven dat geldig is voor een andere categorie dan AM, gedurende de in
      onderdeel h bedoelde periode.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: '108.2'
    text: |-
      In aanvulling op het eerste lid, onderdelen d tot en met h, is [artikel 107][ref1] niet van toepassing op
      bestuurders van andere dan bij algemene maatregel van bestuur aangewezen landbouw- of bosbouwtrekkers of
      motorrijtuigen met beperkte snelheid, indien de bestuurder beschikt over:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
        hoofdstuk: VI
        afdeling: '1'
  - number: 108.2.a
    text: een door het daartoe bevoegde gezag buiten Nederland afgegeven rijbewijs dat geldig is voor de categorie C, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: 108.2.b
    text: |-
      een bij ministeriële regeling aangegeven rijbewijs dat door het daartoe bevoegde gezag in een andere lidstaat
      van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland is afgegeven voor het besturen van deze landbouw- of bosbouwtrekkers of motorrijtuigen met
      beperkte snelheid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: '108.3'
    text: |-
      Bij ministeriële regeling worden voorschriften vastgesteld ter uitvoering van de in het eerste lid, onderdelen *b*
      en *c*, bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
  - number: '108.4'
    text: |-
      In afwijking van het eerste lid, onderdeel i, onder 3°, is [artikel 107][ref1] niet van toepassing op bestuurders
      van bromfietsen die in een andere lidstaat van de Europese Unie, een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, woonachtig zijn en die zich bevinden in
      het internationaal verkeer, indien het een bromfiets betreft waarop richtlijn nr. 2006/126/EG van het Europees
      Parlement en de Raad van de Europese Unie van 20 december 2006 betreffende het rijbewijs (PbEU L 403) niet van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
        hoofdstuk: VI
        afdeling: '1'
  - number: '110'
    text: |-
      Motorrijtuigen mogen slechts worden bestuurd door personen die een bij algemene maatregel van bestuur
      vastgestelde minimumleeftijd hebben bereikt. Daarbij kan voor het ontvangen van rijonderricht in de zin van de
      [Wet rijonderricht motorrijtuigen 1993][ref1] in de bij algemene maatregel van bestuur vastgestelde gevallen en
      onder de bij algemene maatregel van bestuur gestelde voorwaarden een lagere leeftijd worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 110a.1
    text: 'Bij algemene maatregel van bestuur worden eisen vastgesteld met betrekking tot motorrijtuigen waarmee:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel110a
  - number: 110a.1.a
    text: |-
      rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] wordt gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 110a.1.b
    text: |-
      in het kader van een door of vanwege de overheid ingesteld onderzoek naar de rijvaardigheid of geschiktheid een
      rijproef wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel110a
  - number: 110a.2
    text: Bij ministeriële regeling kunnen nadere regels ter uitvoering van het eerste lid worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel110a
  - number: 110b.1
    text: |-
      Het is degene die rijonderricht in de zin van de [Wet rijonderricht motorrijtuigen 1993][ref1] geeft, verboden
      zodanig rijonderricht te geven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel110b
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 110b.1.a
    text: |-
      het motorrijtuig waarmee rijonderricht wordt gegeven, niet voldoet aan de daaraan ingevolge [artikel 110a][ref1]
      gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel110a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel110b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 110a
        hoofdstuk: VI
        afdeling: '2'
  - number: 110b.1.b
    text: |-
      degene aan wie rijonderricht wordt gegeven nog niet de bij algemene maatregel van bestuur vastgestelde
      minimumleeftijd heeft bereikt voor het besturen van een motorrijtuig van de categorie waarvoor rijonderricht wordt
      gegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel110b
  - number: 110b.1.c
    text: |-
      niet wordt voldaan aan de overigens bij algemene maatregel van bestuur ten aanzien van het geven van rijonderricht
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel110b
  - number: 110b.2
    text: |-
      Het eerste lid, aanhef en onderdeel b, geldt niet voor zover het rijonderricht betreft dat plaatsvindt in het
      kader van een opleiding voor beroepschauffeur, mits is voldaan aan de bij algemene maatregel van bestuur gestelde
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel110b
  - number: '111.1'
    text: |-
      Een rijbewijs wordt op aanvraag en tegen betaling van het daarvoor vastgestelde tarief, slechts afgegeven aan
      degene die:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111
  - number: 111.1.a
    text: |-
      de bij algemene maatregel van bestuur vastgestelde minimumleeftijd heeft bereikt voor het besturen van een
      motorrijtuig van de categorie waarop de aanvraag tot afgifte van een rijbewijs betrekking heeft en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111
  - number: 111.1.b
    text: |-
      blijkens een overeenkomstig bij algemene maatregel van bestuur vastgestelde regels door of vanwege de overheid
      ingesteld onderzoek dan wel blijkens een eerder aan hem afgegeven rijbewijs of een hem door het daartoe bevoegde
      gezag buiten Nederland afgegeven rijbewijs dat voldoet aan de bij algemene maatregel van bestuur vastgestelde
      eisen, beschikt over een voldoende mate van rijvaardigheid en geschiktheid, dan wel, indien de aanvraag betrekking
      heeft op afgifte van een rijbewijs dat geldig is voor het besturen van bromfietsen, over een voldoende mate van
      rijvaardigheid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111
  - number: '111.2'
    text: |-
      De aanvrager van een rijbewijs dient zich zowel bij de indiening van de aanvraag als bij de uitreiking
      van het rijbewijs te identificeren met een op zijn naam gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3° van de Wet op de identificatieplicht][ref1], een geldig rijbewijs,
      dan wel een eerder aan hem afgegeven rijbewijs dat zijn geldigheid heeft verloren door het verstrijken van
      de geldigheidsduur. Degene ten aanzien van wie een onderzoek als bedoeld in het eerste lid, onderdeel b,
      wordt ingesteld, dient zich te identificeren met een op zijn naam gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3° van de Wet op de identificatieplicht][ref2], een geldig rijbewijs
      dan wel een eerder aan hem afgegeven rijbewijs dat zijn geldigheid heeft verloren door het verstrijken van de
      geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '111.3'
    text: |-
      Aan degene die vreemdeling in de zin van de [Vreemdelingenwet 2000][ref1] is, en geen onderdaan van een lidstaat
      van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland, wordt een rijbewijs slechts afgegeven indien hij rechtmatig in Nederland verblijft als
      bedoeld in [artikel 8, onder a tot en met d en l van die wet][ref2]. Voor de uitvoering hiervan is de korpschef in
      de zin van de [Vreemdelingenwet 2000][ref3] verplicht aan degene die is belast met de afgifte van het rijbewijs,
      kosteloos de noodzakelijke opgaven en inlichtingen te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0011823
  - number: '111.4'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid, onderdeel *b*.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111
  - number: '111.5'
    text: |-
      In de gevallen waarin het rijbewijs overeenkomstig [artikel 116][ref1] wordt afgegeven door de burgemeester dan
      wel de aanvraag overeenkomstig het bepaalde krachtens [artikel 113, eerste lid][ref2], wordt ingediend bij de
      burgemeester, wordt het in het eerste lid bedoelde tarief vastgesteld bij plaatselijke verordening. In de overige
      gevallen worden het tarief en de wijze van betaling daarvan vastgesteld door de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel113
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '116'
        hoofdstuk: VI
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '113'
        hoofdstuk: VI
        afdeling: '4'
  - number: '111.6'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het bij plaatselijke verordening vastgestelde tarief,
      bedoeld in het vijfde lid, verminderd met de vergoeding, bedoeld in [artikel 121, eerste lid][ref1], een in die
      maatregel te bepalen bedrag niet te boven gaat. Dat bedrag kan bij ministeriële regeling worden gewijzigd voor
      zover de consumentenprijsindex daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel121
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '121'
        hoofdstuk: VI
        afdeling: '5'
  - number: '111.7'
    text: |-
      Voor zover dit noodzakelijk is ten behoeve van het onderzoek naar de rijvaardigheid en geschiktheid, bedoeld in
      het eerste lid, onder b, worden door het met dat onderzoek belaste gezag persoonsgegevens betreffende iemands
      rijvaardigheid en gezondheid verwerkt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111
  - number: 111a.1
    text: |-
      Indien het rijbewijs voor de rijbewijscategorie B wordt aangevraagd door een aanvrager die op het tijdstip van
      de aanvraag nog niet de krachtens [artikel 111, eerste lid, onderdeel a][ref1], vastgestelde minimumleeftijd voor
      het besturen van motorrijtuigen van die rijbewijscategorie heeft bereikt, maar wel de leeftijd van 17 jaar, worden
      in aanvulling op de in dan wel krachtens de [artikelen 111 tot en met 113][ref2], [116 tot en met 118a][ref3],
      en [120a tot en met 122][ref4], gestelde voorwaarden bij algemene maatregel van bestuur aanvullende voorwaarden
      gesteld aan de aanvraag en het verkrijgen van dat rijbewijs. Deze aanvullende voorwaarden hebben onder meer
      betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel111
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel116
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel121
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '111'
        hoofdstuk: VI
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '111'
        hoofdstuk: VI
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '116'
        hoofdstuk: VI
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '121'
        hoofdstuk: VI
        afdeling: '5'
  - number: 111a.1.a
    text: de aanvraag en afgifte van een begeleiderspas, waarvan de kosten door de Dienst Wegverkeer worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.1.b
    text: de aanvullende voorwaarden voor de aanvraag en de afgifte van het rijbewijs voor de categorie B, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.1.c
    text: |-
      de eisen waaraan een begeleider op het tijdstip van de aanvraag tot vermelding op de begeleiderspas moet voldoen,
      inclusief de controle van deze eisen door de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.2
    text: |-
      Op de in het eerste lid, onderdeel a, bedoelde aanvraag van de begeleiderspas is [artikel 114][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel114
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '114'
        hoofdstuk: VI
        afdeling: '4'
  - number: 111a.3
    text: |-
      Het is een houder van een op basis van het eerste lid afgegeven rijbewijs verboden om tot het bereiken van de
      leeftijd van achttien jaren een motorrijtuig van de categorie B te besturen:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.3.a
    text: |-
      buiten het grondgebied van het Europese deel van Nederland, tenzij dit rijbewijs is erkend in een andere staat
      buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.3.b
    text: zonder de aan hem afgegeven geldige begeleiderspas bij zich te hebben, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.3.c
    text: |-
      zonder dat tijdens het besturen van het motorrijtuig van de categorie B een op de aan hem afgegeven geldige
      begeleiderspas vermelde begeleider, op de zitplaats naast de bestuurder is gezeten.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.4
    text: 'De begeleiderspas verliest van rechtswege zijn geldigheid:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.4.a
    text: door uitreiking van een nieuwe begeleiderspas;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.4.b
    text: door het onbevoegd daarin aanbrengen van wijzigingen;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.4.c
    text: |-
      door wijziging van de geslachtsnaam, de voornamen of de plaats of datum van geboorte van één van de daarop vermelde
      personen;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.4.d
    text: op de dag waarop de houder de leeftijd van achttien jaren bereikt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.5
    text: 'Een begeleiderspas wordt door de Dienst Wegverkeer ongeldig verklaard indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.5.a
    text: |-
      de begeleiderspas is afgegeven op grond van door de aanvrager verschafte onjuiste gegevens en hij niet zou zijn
      afgegeven indien de onjuistheid van die gegevens ten tijde van de aanvraag bekend zou zijn geweest;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.5.b
    text: na afgifte van de begeleiderspas blijkt dat hij kennelijk abusievelijk aan de houder is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.6
    text: |-
      De ongeldigverklaring is van kracht met ingang van de zevende dag na die waarop het besluit tot ongeldigverklaring
      aan de houder van de begeleiderspas bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.7
    text: 'De begeleiderspas dient:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.7.a
    text: te voldoen aan bij ministeriële regeling vastgestelde eisen inzake inrichting, uitvoering en invulling;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.7.b
    text: zijn geldigheid niet te hebben verloren en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111a.7.c
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111a
  - number: 111b
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels vastgesteld waaraan de begeleider tijdens het begeleiden
      voldoet. Deze regels kunnen alleen het rijbewijs en het verkeersgedrag van de begeleider betreffen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel111b
  - number: '112.1'
    text: |-
      Onverminderd [artikel 111][ref1] wordt een rijbewijs niet afgegeven aan degene:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel111
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '111'
        hoofdstuk: VI
        afdeling: '3'
  - number: 112.1.a
    text: aan wie de bevoegdheid tot het besturen van motorrijtuigen is ontzegd, voor de duur van de ontzegging;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel112
  - number: 112.1.b
    text: |-
      van wie ingevolge een der [artikelen 130, tweede lid][ref1], of [164][ref2] de overgifte van dat bewijs is
      gevorderd dan wel wiens rijbewijs is ingevorderd en aan wie dat bewijs niet is teruggegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel164
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '164'
        hoofdstuk: IX
  - number: 112.1.c
    text: |-
      ten aanzien van wie ingevolge [artikel 131, tweede lid, onderdeel a][ref1], de geldigheid van het rijbewijs is
      geschorst, voor de categorie of categorieën van motorrijtuigen waarop de schorsing betrekking heeft, voor de duur
      van de schorsing;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 112.1.d
    text: |-
      van wie ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1] de inlevering van het
      rijbewijs is gevorderd dan wel wiens rijbewijs krachtens die wet is ingenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0004581
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0004581
  - number: 112.1.e
    text: |-
      van wie is gebleken dat die houder is van een rijbewijs, afgegeven door het daartoe bevoegde gezag in een andere
      lidstaat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of Zwitserland, tenzij de afgifte van een rijbewijs plaatsvindt tegen overlegging van dat
      rijbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel112
  - number: 112.1.f
    text: |-
      ten aanzien van wie is gebleken dat in een andere lidstaat van de Europese Unie of in een andere staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland het rijbewijs is geschorst of een
      beperkende maatregel met betrekking tot het rijbewijs of de rijbevoegdheid onherroepelijk is geworden, tenzij is
      voldaan aan bij algemene maatregel van bestuur gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel112
  - number: '112.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdelen, b, c, d en f, wordt onder rijbewijs mede verstaan een rijbewijs,
      afgegeven door het daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel112
  - number: '113.1'
    text: |-
      De aanvraag van een rijbewijs dient te geschieden overeenkomstig bij algemene maatregel van bestuur vastgestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel113
  - number: '113.2'
    text: |-
      Degene die is belast met de afgifte van rijbewijzen, verschaft zich de nodige zekerheid over de identiteit van
      de aanvrager. Hij is bevoegd te vorderen dat de aanvrager op een door hem te bepalen plaats en tijd persoonlijk
      verschijnt voor een door hem aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel113
  - number: '113.3'
    text: |-
      Degene die is belast met de afgifte van rijbewijzen vergewist zich ervan dat de bij de aanvraag van een rijbewijs
      over te leggen bescheiden aan de daaraan gestelde eisen voldoen en dat ook overigens aan de met betrekking tot de
      aanvraag gestelde voorwaarden wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel113
  - number: '113.4'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste tot en met het derde lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel113
  - number: '114'
    text: |-
      Het is verboden voor het verkrijgen van een rijbewijs opzettelijk onjuiste opgaven te doen, onjuiste inlichtingen
      te verschaffen en onjuiste bewijsstukken en andere bescheiden over te leggen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel114
  - number: '115.1'
    text: |-
      Degene die is belast met de afgifte van rijbewijzen, en die in het kader van de aanvraag of de uitreiking van
      een nieuw rijbewijs of een vervangend rijbewijs de beschikking krijgt over een rijbewijs waarvan ingevolge
      een der [artikelen 130, tweede lid][ref1], of [164][ref2] de overgifte is gevorderd, waarvan ingevolge de
      [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref3] de inlevering is gevorderd of ten aanzien
      waarvan ingevolge een der [artikelen 119, vierde lid][ref4], [120, derde lid][ref5], [123b, vierde lid][ref6],
      [124, vierde lid][ref7], [131, tweede lid, onderdeel b][ref8], [132, vijfde lid][ref9], [132b, tweede lid][ref10],
      [134, vierde lid][ref11], of [180, vierde lid][ref12], van deze wet een verplichting tot inlevering bestaat, is
      bevoegd dat rijbewijs in te nemen en het door te begeleiden naar het betrokken parket van het openbaar ministerie
      dan wel naar degene bij wie de houder dat rijbewijs had dienen in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel164
      [ref3]: https://wetten.overheid.nl/BWBR0004581
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel119
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel120
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
      [ref7]: https://wetten.overheid.nl/BWBR0006622#Artikel124
      [ref8]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref9]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref10]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
      [ref11]: https://wetten.overheid.nl/BWBR0006622#Artikel134
      [ref12]: https://wetten.overheid.nl/BWBR0006622#Artikel180
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel115
