      de opgave van een kenteken als bedoeld in [artikel 37, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
