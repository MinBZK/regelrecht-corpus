    text: |-
      een voorlopig onderzoek van uitgeademde lucht, ter vaststelling van een mogelijke overtreding van
      [artikel 8, tweede of derde lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
