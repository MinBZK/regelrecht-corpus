        paragraaf: '1'
  - number: '160.6'
    text: |-
      Op eerste vordering van een van de in [artikel 159, onderdeel a][ref1], bedoelde personen zijn de bestuurder
      van een motorrijtuig en degene die aanstalten maakt een motorrijtuig te gaan besturen die op grond van
      [artikel 132c, eerste lid, onderdeel d][ref2], de feitelijke beschikking hebben gekregen over een rijbewijs waarop
      de bij ministeriële regeling vastgestelde codering voor het rijden met een alcoholslot is vermeld, verplicht
      het alcoholslot, dan wel de daarvan deel uitmakende ademalcoholtester te tonen of een blaastest op het in het
      motorrijtuig aanwezige alcoholslot uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132c
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
    references:
