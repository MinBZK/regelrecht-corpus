        artikel: '107'
        hoofdstuk: VI
        afdeling: '1'
  - number: 1.1.m
    text: |-
      rijbewijzenregister: register, bedoeld in [artikel 126][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
    references:
