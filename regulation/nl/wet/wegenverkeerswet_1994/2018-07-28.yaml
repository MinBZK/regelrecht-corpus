        artikel: '159'
        hoofdstuk: IX
  - number: 160.5.a
    text: |-
      een onderzoek van de psychomotorische functies en de oog- en spraakfuncties, ter vaststelling van een mogelijke
      overtreding van [artikel 8, eerste of vijfde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
