        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '9'
  - number: '160.7'
    text: |-
      De bestuurder van een voertuig of de begeleider, die door een der in [artikel 159][ref1] bedoelde personen in
      overtreding wordt bevonden van een bij of krachtens deze wet vastgesteld voorschrift, is verplicht de hem door die
      persoon ter bescherming van bij het verkeer betrokken belangen gegeven bevelen op te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '160.8'
    text: |-
      Op eerste vordering van de in [artikel 159][ref1] bedoelde personen is de begeleider verplicht zijn rijbewijs
      behoorlijk ter inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '161.1'
    text: |-
      De in [artikel 159, onderdeel a][ref1], bedoelde personen die bij de uitoefening van de bij of
      krachtens deze wet, krachtens [artikel 2 van de Wet op de identificatieplicht][ref2] dan wel krachtens
      [artikel 5:19, derde lid, van de Algemene wet bestuursrecht][ref3] aan hen verleende bevoegdheden de beschikking
      krijgen over een rijbewijs waarvan ingevolge een der [artikelen 130, tweede lid][ref4], of [164][ref5] de
      overgifte is gevorderd, waarvan ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref6]
      de inlevering is gevorderd of ten aanzien waarvan ingevolge een der [artikelen 119, vierde lid][ref7],
      [120, derde lid][ref8], [123b, vierde lid][ref9], [124, vierde lid][ref10], [131, tweede lid, onderdeel b][ref11],
      [132, vijfde lid][ref12], [132b, tweede lid][ref13], [134, vierde lid][ref14], of [180, vierde lid][ref15], van
      deze wet een verplichting tot inlevering bestaat, zijn bevoegd dat rijbewijs in te nemen en het door te geleiden
      naar het betrokken parket van het openbaar ministerie dan wel naar degene bij wie de houder dat rijbewijs had
      dienen in te leveren.


