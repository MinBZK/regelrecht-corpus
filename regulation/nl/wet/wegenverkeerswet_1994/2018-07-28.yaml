  - number: '170.3'
    text: |-
      Burgemeester en wethouders plegen regelmatig overleg met de officier van justitie over de uitoefening van de in het
      eerste lid bedoelde bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel170
  - number: '170.4'
    text: |-
      Burgemeester en wethouders dragen er zorg voor dat in een daartoe aangelegd register aantekening wordt gehouden van
      de gevallen waarin de in het eerste lid bedoelde bevoegdheid wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel170
  - number: '170.5'
    text: |-
      Bij toepassing van het eerste lid wordt onder rechthebbende verstaan: degene die ofwel eigenaar is van het voertuig
      ofwel anders dan als bezitter het voertuig ten tijde van de overtreding ten gebruike onder zich had. Hierbij geldt
      [artikel 1, tweede lid][ref1], niet.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
        hoofdstuk: '1'
  - number: '170.6'
    text: |-
      De in het eerste lid bedoelde bevoegdheid wordt niet uitgeoefend, indien de rechthebbende het voertuig
      verwijdert voordat met de overbrenging een aanvang wordt gemaakt. Hij is alsdan de kosten verbonden aan de
      voorbereiding van de overbrenging, verschuldigd. De [artikelen 4:116][ref1], [4:118 tot en met 4:124][ref2], en
      [5:10 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '171.1'
    text: |-
      Een beschikking tot oplegging van een last onder bestuursdwang overeenkomstig [artikel 170, eerste lid][ref1],
      wordt bekendgemaakt:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
  - number: 171.1.a
    text: aan de rechthebbende die het voertuig afhaalt, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel171
  - number: 171.1.b
    text: |-
      indien het voertuig binnen achtenveertig uur na de inbewaringstelling niet is afgehaald, zo mogelijk binnen een
      week:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel171
  - number: 171.1.b.1°
    text: aan degene aan wie het kenteken is opgegeven, indien het voertuig een kenteken voert;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel171
  - number: 171.1.b.2°
    text: |-
      aan degene die aangifte heeft gedaan, indien blijkt dat ter zake van het voertuig aangifte van vermissing is
      gedaan, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel171
  - number: 171.1.b.3°
    text: in nader bij ministeriële regeling vast te stellen gevallen op de daarbij aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel171
  - number: '171.2'
    text: |-
      Bij de bekendmaking krachtens het eerste lid, onderdeel *b*, wordt gewezen op het verschuldigd zijn van kosten,
      verbonden aan de oplegging van een last onder bestuursdwang.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel171
  - number: '172.1'
    text: |-
      Tot de kosten, verbonden aan de oplegging van een last onder bestuursdwang als bedoeld in
      [artikel 170, eerste lid][ref1], worden gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
  - number: 172.1.a
    text: de kosten die verband houden met de overbrenging en bewaring;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel172
  - number: 172.1.b
    text: de kosten die verband houden met de bekendmaking van de beschikking tot overbrenging en inbewaringstelling, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel172
  - number: 172.1.c
    text: de kosten van verkoop, eigendomsoverdracht om niet of vernietiging.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel172
  - number: '172.2'
    text: |-
      Verkoop, eigendomsoverdracht om niet of vernietiging vindt niet plaats binnen twee weken na de bekendmaking van de
      beschikking tot oplegging van een last onder bestuursdwang krachtens [artikel 171, eerste lid, onderdeel b][ref1].
      De opbrengst van verkoop of de geschatte sloopwaarde bij vernietiging wordt in mindering gebracht op de kosten,
      verbonden aan de oplegging van een last onder bestuursdwang.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel171
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '171'
        hoofdstuk: X
  - number: '172.3'
    text: |-
      Burgemeester en wethouders betalen het bedrag van de kosten, verbonden aan de oplegging van een last onder
      bestuursdwang, terug, indien:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel172
  - number: 172.3.a
    text: niet tot overbrenging en inbewaringstelling had mogen worden overgegaan;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel172
  - number: 172.3.b
    text: |-
      de omstandigheden waaronder de overtreding is begaan, van dien aard waren dat de kosten redelijkerwijs niet
      verschuldigd zijn, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel172
  - number: 172.3.c
    text: |-
      aannemelijk is dat het voertuig tegen de wil van de rechthebbende is gebruikt en hij dit gebruik redelijkerwijs
      niet heeft kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel172
  - number: '172.4'
    text: |-
      In een geval als bedoeld in het derde lid, onderdeel c, zijn de kosten verschuldigd door degene
      die de overtreding heeft begaan. De [artikelen 4:116][ref1], [4:118 tot en met 4:124][ref2] en
      [5:10 van de Algemene wet bestuursrecht][ref3] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '172.5'
    text: |-
      Indien de kosten, verbonden aan de oplegging van een last onder bestuursdwang, die door de rechthebbende zijn
      betaald, te hoog zijn berekend, betalen burgemeester en wethouders het te veel betaalde terug.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel172
  - number: '172.6'
    text: |-
      Indien de in het derde lid, onderdeel *b*, bedoelde omstandigheden van dien aard waren dat de kosten redelijkerwijs
      niet volledig verschuldigd zijn, betalen burgemeester en wethouders het niet verschuldigde bedrag terug.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel172
  - number: '172.7'
    text: |-
      Bij toepassing van het derde lid, onderdeel a, betalen burgemeester en wethouders tevens een redelijke
      schadeloosstelling aan de rechthebbende die het voertuig heeft afgehaald. Indien het voertuig ten tijde van de
      overtreding in gebruik was bij een ander dan de rechthebbende die het voertuig heeft afgehaald, treedt die ander
      voor de toepassing van dit lid in de plaats van de rechthebbende die het voertuig heeft afgehaald.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel172
  - number: '172.8'
    text: |-
      Indien aantoonbaar is dat tijdens de overbrenging en bewaring schade aan het voertuig is toegebracht, is de
      gemeente gehouden deze schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel172
  - number: '173.1'
    text: 'Bij algemene maatregel van bestuur worden:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel173
  - number: 173.1.a
    text: |-
      de soorten van de in [artikel 170, eerste lid, onderdeel c][ref1], bedoelde weggedeelten en wegen aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
  - number: 173.1.b
    text: |-
      nadere regels vastgesteld over de registratie van gegevens in geval van toepassing van
      [artikel 170, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
  - number: 173.1.c
    text: |-
      nadere regels vastgesteld over de berekening van de kosten, verbonden aan de oplegging van een last onder
      bestuursdwang, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel173
  - number: 173.1.d
    text: |-
      de overige regels vastgesteld die voor de uitvoering van de [artikelen 170 tot en met 172][ref1] nodig worden
      geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
  - number: '173.2'
    text: |-
      Bij gemeentelijke verordening worden nadere regels gesteld ter uitvoering van de
      [artikelen 170 tot en met 172][ref1] en de in het eerste lid bedoelde algemene maatregel van bestuur. Die regels
      betreffen in elk geval


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
  - number: 173.2.a
    text: |-
      de aanwijzing van de plaats, onderscheidenlijk de plaatsen, waar verwijderde voertuigen in bewaring worden gesteld,
      en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel173
  - number: 173.2.b
    text: de berekening van de kosten, verbonden aan de oplegging van een last onder bestuursdwang, en voorts
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel173
  - number: 173.2.c
    text: |-
      de aanwijzing van de weggedeelten en wegen, voor de bevoegdheid tot oplegging van een last onder bestuursdwang,
      bedoeld in artikel [170, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
  - number: '174.1'
    text: |-
      Indien ter zake van een overtreding van [artikel 40, eerste lid][ref1], proces-verbaal
      wordt opgemaakt door een ambtenaar van politie, aangesteld voor de uitvoering van de
      politietaak, dan wel een op dat voorschrift betrekking hebbende gedraging, omschreven in de in
      [artikel 2, eerste lid, van de Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref2] bedoelde
      bijlage door hem wordt geconstateerd, begaan met een op de weg staand motorrijtuig, terwijl niet terstond blijkt
      wie de eigenaar of houder van dat motorrijtuig is, is de burgemeester bevoegd op verzoek van die ambtenaar dat
      motorrijtuig naar een door hem aangewezen plaats te doen overbrengen en in bewaring te doen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '2'
  - number: '174.2'
    text: |-
      Alvorens het in het eerste lid bedoelde verzoek te doen, kan de daar bedoelde ambtenaar door middel van een daartoe
      aan te brengen apparaat het rijden met het motorrijtuig voor ten hoogste twee dagen beletten. Het apparaat wordt
      binnen die termijn verwijderd, zodra bekend wordt wie de eigenaar of houder van het motorrijtuig is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel174
  - number: '174.3'
    text: |-
      De [artikelen 170, tweede lid, tweede en derde volzin, vierde, vijfde en zesde lid][ref1],
      [171][ref2], [172][ref3] en [173, eerste lid][ref4], van deze wet en de [artikelen 4:116][ref5],
      [4:118 tot en met 4:124][ref6], [5:10][ref7], [5:25, eerste en zesde lid][ref8], [5:29, tweede en derde lid][ref9],
      en [5:30, eerste, tweede, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref10] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel172
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel173
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref9]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref10]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '171'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '172'
        hoofdstuk: X
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '173'
        hoofdstuk: X
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref9
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref10
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '175.1'
    text: |-
      Overtreding van [artikel 6][ref1] wordt gestraft met:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel6
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: 175.1.a
    text: |-
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, indien het een ongeval betreft
      waardoor een ander wordt gedood;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel175
  - number: 175.1.b
    text: |-
      gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde categorie, indien het een
      ongeval betreft waardoor een ander lichamelijk letsel wordt toegebracht.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel175
  - number: '175.2'
    text: |-
      Indien de schuld bestaat in roekeloosheid, wordt overtreding van [artikel 6][ref1] gestraft met:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel6
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: 175.2.a
    text: |-
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie, indien het een ongeval betreft
      waardoor een ander wordt gedood;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel175
  - number: 175.2.b
    text: |-
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, indien het een ongeval betreft
      waardoor een ander lichamelijk letsel wordt toegebracht.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel175
  - number: '175.3'
    text: |-
      Indien de schuldige verkeerde in de toestand, bedoeld in
      [artikel 8, eerste, tweede, derde, vierde of vijfde lid][ref1], dan wel na het feit niet heeft voldaan aan
      een bevel, gegeven krachtens [artikel 163, tweede, zesde, zevende of negende lid][ref2], of indien het feit is
      veroorzaakt of mede is veroorzaakt doordat hij een krachtens deze wet vastgestelde maximumsnelheid in ernstige mate
      heeft overschreden, dan wel zeer dicht achter een ander voertuig is gaan rijden, geen voorrang heeft verleend of
      gevaarlijk heeft ingehaald kunnen de in het eerste en tweede lid bepaalde gevangenisstraffen met de helft worden
      verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel163
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '163'
        hoofdstuk: IX
  - number: '176.1'
    text: |-
      Overtreding van [artikel 70m][ref1] wordt gestraft met een gevangenisstraf van ten hoogste een jaar of een
      geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70m
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70m
        hoofdstuk: IVB
  - number: '176.2'
    text: |-
      Overtreding van [artikel 41, eerste lid, onderdelen c tot en met f][ref1], wordt gestraft hetzij met
      gevangenisstraf van ten hoogste zes maanden en geldboete van de derde categorie, hetzij met een van beide voormelde
      straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel41
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '176.3'
    text: |-
      Overtreding van [artikel 11][ref1] wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van
      de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel11
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '11'
        hoofdstuk: II
        paragraaf: '1'
  - number: '176.4'
    text: |-
      Overtreding van de [artikelen 7, eerste lid][ref1], [8][ref2],
      [9, eerste, tweede, vierde, vijfde, zevende en negende lid][ref3], [41, eerste lid, onderdelen a en b][ref4],
      [51, eerste lid][ref5], [61, eerste lid, onderdeel c][ref6], [74][ref7], [114][ref8], [151j][ref9],
      [162, derde en vierde lid][ref10], [163, tweede, zesde, zevende en negende lid][ref11] en van de in
      [artikel 4, tweede en vijfde lid][ref12], bedoelde regels voor zover het betreft een verbod tot het gebruik van
      verlichting, wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel41
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel51
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel61
      [ref7]: https://wetten.overheid.nl/BWBR0006622#Artikel74
      [ref8]: https://wetten.overheid.nl/BWBR0006622#Artikel114
      [ref9]: https://wetten.overheid.nl/BWBR0006622#Artikel151j
      [ref10]: https://wetten.overheid.nl/BWBR0006622#Artikel162
      [ref11]: https://wetten.overheid.nl/BWBR0006622#Artikel163
      [ref12]: https://wetten.overheid.nl/BWBR0006622#Artikel4
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '8'
