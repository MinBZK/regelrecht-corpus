preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regels inzake het verkeer op de weg opnieuw vast
    te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.b
    text: |-
      wegen: alle voor het openbaar verkeer openstaande wegen of paden met inbegrip van de daarin liggende bruggen en
      duikers en de tot die wegen behorende paden en bermen of zijkanten;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.c
    text: |-
      motorrijtuigen: alle voertuigen, bestemd om anders dan langs spoorstaven te worden voortbewogen uitsluitend
      of mede door een mechanische kracht, op of aan het voertuig zelf aanwezig dan wel door elektrische tractie met
      stroomtoevoer van elders, met uitzondering van fietsen met trapondersteuning;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.d
    text: |-
      aanhangwagen: voertuig dat kennelijk is bestemd om te worden voortbewogen door een motorrijtuig. In het bepaalde
      krachtens deze wet kan onder aanhangwagen tevens worden verstaan een voertuig dat door een ander voertuig wordt
      voortbewogen of kennelijk is bestemd om door een ander voertuig te worden voortbewogen;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.e
    text: 'bromfiets:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.e.a
    text: |-
      motorrijtuig op twee wielen, met een door de constructie bepaalde maximumsnelheid van niet meer dan 45 km/h,
      uitgerust met een verbrandingsmotor met een cilinderinhoud van niet meer dan 50 cm3 of een elektromotor met een
      nominaal continu maximumvermogen van niet meer dan 4 kW, niet zijnde een gehandicaptenvoertuig of een motorrijtuig
      als bedoeld in subonderdeel d;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.e.b
    text: |-
      motorrijtuig op drie wielen, met een door de constructie bepaalde maximumsnelheid van niet meer dan 45 km/h, niet
      zijnde een gehandicaptenvoertuig of een motorrijtuig als bedoeld in subonderdeel d, uitgerust met:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.e.b.1°
    text: een motor met elektrische ontsteking met een cilinderinhoud van niet meer dan 50 cm3,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.e.b.2°
    text: |-
      een motor met inwendige verbranding en een netto maximumvermogen van niet meer dan 4 kW voor andere dan onder 1°
      genoemde motoren, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.e.b.3°
    text: een elektromotor met een nominaal continu maximumvermogen van niet meer dan 4 kW; dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.e.c
    text: |-
      motorrijtuig op vier wielen, niet zijnde een gehandicaptenvoertuig of een motorrijtuig als bedoeld in subonderdeel
      d, met een door de constructie bepaalde maximumsnelheid van niet meer dan 45 km/h en een ledige massa van minder
      dan 350 kg, de massa van de batterijen in elektrische voertuigen niet inbegrepen, uitgerust met:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.e.c.1°
    text: een motor met elektrische ontsteking met een cilinderinhoud van niet meer dan 50 cm3,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.e.c.2°
    text: |-
      een motor met inwendige verbranding en een netto maximumvermogen van niet meer dan 4 kW voor andere dan onder 1°
      genoemde motoren, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.e.c.3°
    text: een elektromotor met een nominaal continu maximumvermogen van niet meer dan 4 kW;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.e.d
    text: |-
      een motorrijtuig als bedoeld in [artikel 20b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20b
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 20b
        hoofdstuk: IIA
  - number: 1.1.ea
    text: |-
      fietsen met trapondersteuning: fietsen die zijn voorzien van een elektrische hulpmotor met een nominaal continu
      vermogen van maximaal 0,25 kW en waarvan de aandrijfkracht geleidelijk vermindert en tenslotte wordt onderbroken
      wanneer het voertuig een snelheid van 25 km/h bereikt, of eerder, indien de bestuurder ophoudt met trappen;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.f
    text: |-
      typegoedkeuring: goedkeuring van tot een bepaald type behorende voertuigen, systemen, onderdelen, technische
      eenheden, uitrustingstukken en voorzieningen ter bescherming van weggebruikers en passagiers;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
  - number: 1.1.g
    text: |-
      kenteken: kenteken als bedoeld in [artikel 36][ref1] of [artikel 37, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel1
