  - number: 25d.2.c
    text: |-
      degene aan wie de goedkeuring is verleend, handelt in strijd met een of meer andere uit de goedkeuring
      voortvloeiende verplichtingen, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel25d
  - number: 25d.2.d
    text: blijkt dat de goedkeuring ten onrechte is verleend.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel25d
  - number: 25e.1
    text: |-
      Wanneer een fabrikant reeds verkochte, geregistreerde of in het verkeer gebrachte voertuigen, dan
      wel reeds verkochte onderdelen of uitrustingsstukken, waarvoor een overeenkomstig in het kader van
      de Europese Unie tot stand gekomen voorschriften afgegeven typegoedkeuring is verleend, op grond van
      [artikel 21, tweede lid, van de Warenwet][ref1] dient terug te roepen omdat het voertuig een ernstig gevaar vormt
      voor de verkeersveiligheid, de volksgezondheid of het milieu, stelt de fabrikant de goedkeuringsinstantie die de
      typegoedkeuring heeft verleend hiervan onmiddellijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel21
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel25e
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '21'
  - number: 25e.2
    text: |-
      De fabrikant stelt de goedkeuringsinstantie maatregelen voor om het in het eerste lid bedoelde gevaar te
      neutraliseren.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel25e
  - number: 25e.3
    text: De Dienst Wegverkeer houdt toezicht op het terugroepen van voertuigen, onderdelen en uitrustingsstukken.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel25e
  - number: 25e.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel25e
  - number: '26.1'
    text: |-
      Een goedkeuring voor een individueel voertuig wordt op aanvraag en tegen betaling, op de door de Dienst Wegverkeer
      vastgestelde wijze, van het daarvoor door deze dienst vastgestelde tarief door deze dienst verleend indien het
      voertuig bij een door de dienst verrichte keuring heeft voldaan aan de bij ministeriële regeling vastgestelde eisen
      met betrekking tot de toelating tot het verkeer op de weg, welke eisen voor verschillende groepen van voertuigen
      verschillend kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel26
  - number: '26.2'
    text: |-
      [Artikel 22, tweede, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
  - number: 26a.1
    text: |-
      De Dienst Wegverkeer kan met het oog op het verlenen van een goedkeuring voor een individueel voertuig een
      technische dienst aanwijzen om namens hem bepaalde voor de goedkeuring noodzakelijke tests te verrichten, indien
      uit een door de Dienst Wegverkeer opgesteld beoordelingsverslag of uit een door een accrediteringsinstantie
      afgegeven accrediteringscertificaat blijkt dat deze dienst voldoet aan de daarvoor bij ministeriële regeling
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel26a
  - number: 26a.2
    text: |-
      [Artikel 22b, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22b
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 22b
        hoofdstuk: III
        paragraaf: '2'
  - number: '27'
    text: |-
      De in [artikel 22, eerste lid][ref1], of [26, eerste lid][ref2], bedoelde goedkeuring wordt eerst
      verleend indien het voertuig bij de keuring tevens heeft voldaan aan de eisen, gesteld krachtens de
      [Wet inzake de luchtverontreiniging][ref3] en de [Wet geluidhinder][ref4].


