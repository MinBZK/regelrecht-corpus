      het verlenen van de bevoegdheid voertuigen aan een keuring te onderwerpen als bedoeld in [artikel 85a][ref10]
      alsmede het schorsen, wijzigen en intrekken van erkenningen en van de bevoegdheid voertuigen aan een keuring te
      onderwerpen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel66a
