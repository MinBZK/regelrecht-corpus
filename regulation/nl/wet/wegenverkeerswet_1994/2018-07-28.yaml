  - number: '179.3'
    text: |-
      Bij veroordeling van de bestuurder van een motorrijtuig wegens overtreding van het bepaalde krachtens deze wet kan
      hem in die gevallen, waarin dit bij algemene maatregel van bestuur is bepaald, de bevoegdheid tot het besturen van
      motorrijtuigen voor ten hoogste twee jaren worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel179
  - number: '179.4'
    text: |-
      Indien tijdens het plegen van een der strafbare feiten in het eerste lid genoemd, nog geen vijf jaren zijn verlopen
      na het einde van de tijdsduur waarvoor bij een vroegere onherroepelijke veroordeling wegens een van die strafbare
      feiten de betrokkene de bevoegdheid tot het besturen van motorrijtuigen is ontzegd, kan hem die bevoegdheid voor
      ten hoogste tien jaren worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel179
  - number: '179.5'
    text: |-
      Indien tijdens het plegen van een der strafbare feiten in het tweede lid genoemd of krachtens deze wet aangewezen,
      nog geen twee jaren zijn verlopen na het einde van de tijdsduur waarvoor bij een vroegere onherroepelijke
      veroordeling wegens een van die strafbare feiten of wegens een der in het eerste lid bedoelde strafbare feiten de
      betrokkene de bevoegdheid tot het besturen van motorrijtuigen is ontzegd, kan hem die bevoegdheid voor ten hoogste
      vier jaren worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel179
  - number: '179.6'
    text: |-
      Bij het opleggen van de bijkomende straf, bedoeld in het eerste tot en met het vijfde lid, wordt de tijd gedurende
      welke het rijbewijs van de veroordeelde ingevolge [artikel 164][ref1] vóór het tijdstip waarop de bijkomende straf
      ingaat, ingevorderd of ingehouden is geweest, op de duur van die straf geheel in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel164
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '164'
        hoofdstuk: IX
  - number: '179.7'
    text: |-
      Voor de toepassing van dit artikel wordt met de bestuurder van een motorrijtuig gelijkgesteld degene die
      overeenkomstig de in [artikel 1, eerste lid, onderdeel n][ref1], bedoelde voorwaarde geacht wordt het motorrijtuig
      onder onmiddellijk toezicht van de bestuurder te besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
        hoofdstuk: '1'
  - number: '179.8'
    text: |-
      Voor de toepassing van het zesde lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door het daartoe
      bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel179
  - number: '179.9'
    text: Voor de toepassing van dit artikel wordt een strafbeschikking met een veroordeling gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel179
  - number: '179.10'
    text: |-
      Voor de toepassing van het vierde onderscheidenlijk het vijfde lid, wordt onder vroegere onherroepelijke
      veroordeling mede verstaan een vroegere onherroepelijke veroordeling door een strafrechter in een andere lidstaat
      van de Europese Unie wegens feiten soortgelijk aan de feiten, bedoeld in het vierde onderscheidenlijk het vijfde
      lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel179
  - number: 179a.1
    text: |-
      Bij veroordeling wegens een der in de [artikelen 287][ref1] of [289 van het Wetboek van Strafrecht][ref2]
      omschreven misdrijven kan de schuldige die het feit heeft gepleegd met een motorrijtuig dat hij ten tijde van het
      feit bestuurde of deed besturen, de bevoegdheid tot het besturen van motorrijtuigen voor ten hoogste tien jaren
      worden ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel289
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel179a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '287'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '289'
  - number: 179a.2
    text: |-
      Bij veroordeling wegens een der in de [artikelen 285][ref1], [301][ref2], [302][ref3] of
      [303 van het Wetboek van Strafrecht][ref4] omschreven misdrijven kan de schuldige die het feit heeft gepleegd met
      een motorrijtuig dat hij ten tijde van het feit bestuurde of deed besturen, de bevoegdheid tot het besturen van
      motorrijtuigen voor ten hoogste vijf jaren worden ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel285
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel301
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel302
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel303
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel179a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '285'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '301'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '302'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '303'
  - number: 179a.3
    text: Voor de toepassing van het tweede lid wordt een strafbeschikking met een veroordeling gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel179a
  - number: '180.1'
    text: |-
      Voor wat betreft de bijkomende straf van ontzegging van de bevoegdheid tot het besturen van motorrijtuigen is
      [artikel 557, tweede lid, van het Wetboek van Strafvordering][ref1] op rechterlijke uitspraken niet van toepassing.
      Een strafbeschikking houdende deze bijkomende straf is in zoverre eerst voor tenuitvoerlegging vatbaar als geen
      verzet meer kan worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel557
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '557'
  - number: '180.2'
    text: |-
      De rechterlijke uitspraak of strafbeschikking is voor wat betreft de bijkomende straf niet voor tenuitvoerlegging
      vatbaar, zolang de termijn waarvoor de veroordeelde bij een andere rechterlijke uitspraak of strafbeschikking de
      bevoegdheid tot het besturen van motorrijtuigen is ontzegd, nog niet is verstreken.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel180
  - number: '180.3'
    text: |-
      Indien de rechterlijke uitspraak of strafbeschikking voor wat betreft de bijkomende straf voor tenuitvoerlegging
      vatbaar is geworden, geschiedt de tenuitvoerlegging niet dan nadat aan de veroordeelde in persoon een schrijven
      is uitgereikt, volgens de [artikelen 587][ref1] en [588 van het Wetboek van Strafvordering][ref2], waarin het
      tijdstip van ingang en de duur van de ontzegging, de verplichting tot inlevering van het rijbewijs uiterlijk op dat
      tijdstip, alsmede het gevolg van niet tijdige inlevering worden medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel587
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel588
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '587'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '588'
  - number: '180.4'
    text: |-
      De houder van een rijbewijs is, tenzij het is ingevorderd en niet is teruggegeven, verplicht dat rijbewijs in
      te leveren op het parket van het openbaar ministerie vanwaar hij het schrijven, bedoeld in het derde lid, heeft
      ontvangen, uiterlijk op het tijdstip van ingang van de ontzegging.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel180
  - number: '180.5'
    text: |-
      Teruggave vindt plaats zodra de termijn van de ontzegging is verstreken. Geen teruggave vindt plaats ten aanzien
      van het rijbewijs of de rijbewijzen waarvan ingevolge een der [artikelen 130, tweede lid][ref1], of [164][ref2] de
      overgifte is gevorderd, waarvan ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref3]
      de inlevering is gevorderd of ten aanzien waarvan ingevolge een der [artikelen 120, derde lid][ref4],
      [124, vierde lid][ref5], [131, tweede lid, onderdeel b][ref6], [132, vijfde lid][ref7], [132b, tweede lid][ref8],
      [134, vierde lid][ref9], of [180, vierde lid][ref10], een verplichting tot inlevering bestaat. De officier van
      justitie geleidt in deze gevallen het rijbewijs of de rijbewijzen door naar degene bij wie de houder dat rijbewijs
      of die rijbewijzen had dienen in te leveren. Indien het rijbewijs op grond van [artikel 123b][ref11] ongeldig
      is dan wel indien een aantekening is geplaatst als bedoeld in dat artikel, geleidt de officier van justitie het
      rijbewijs of de rijbewijzen door naar de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel164
      [ref3]: https://wetten.overheid.nl/BWBR0004581
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel120
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel124
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref7]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref8]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
      [ref9]: https://wetten.overheid.nl/BWBR0006622#Artikel134
      [ref10]: https://wetten.overheid.nl/BWBR0006622#Artikel180
      [ref11]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel180
    references:
      - id: ref1
