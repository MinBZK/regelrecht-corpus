        paragraaf: '1'
  - number: 160.5.c
    text: |-
      een onderzoek van speeksel, ter vaststelling van een mogelijke overtreding van [artikel 8, vijfde lid][ref1],
      alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
    references:
