  - number: '164.8'
    text: |-
      In geval van toepassing van het eerste of vierde lid kan elke belanghebbende bij klaagschrift daartegen
      opkomen. Zolang in de zaak nog geen vervolging is ingesteld, wordt het klaagschrift ingediend ter griffie
      van de rechtbank in het arrondissement waar het in het eerste lid bedoelde feit werd begaan, en anders
      ter griffie van het gerecht in feitelijke aanleg waarvoor de vervolging plaatsvindt of, in geval van
      verzet tegen een uitgevaardigde strafbeschikking, zou worden voortgezet, dan wel het laatst plaatsvond.
      [Artikel 552a, vierde en zesde lid, van het Wetboek van Strafvordering][ref1] is verder van overeenkomstige
      toepassing. De raadkamer van het gerecht geeft zo spoedig mogelijk, na de belanghebbende, desverlangd bijgestaan
      door diens raadsman, te hebben gehoord, althans opgeroepen, zijn met redenen omklede beslissing, welke onverwijld
      aan de belanghebbende wordt betekend. Tegen de beslissing kan door het openbaar ministerie binnen veertien dagen
      daarna en door de belanghebbende binnen veertien dagen na de betekening beroep in cassatie worden ingesteld. De
      Hoge Raad beslist zo spoedig mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552a
  - number: '164.9'
    text: |-
      Indien de zaak eindigt zonder oplegging van straf of maatregel of met zodanige oplegging, doch op grond
      van een feit waarvoor de toepassing van het eerste of vierde lid niet is toegelaten, kan de rechter
      op verzoek van de gewezen verdachte hem een vergoeding ten laste van de Staat toekennen voor de schade
      die hij ten gevolge van die toepassing heeft geleden. Onder schade is begrepen het nadeel dat niet in
      vermogensschade bestaat. De [artikelen 89, derde tot en met zesde lid][ref1],[ 90][ref2], [91][ref3] en
      [93 van het Wetboek van Strafvordering][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel90
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel91
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel93
