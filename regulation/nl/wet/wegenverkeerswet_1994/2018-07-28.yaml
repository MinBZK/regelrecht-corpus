  - number: 123b.2
    text: Voor de toepassing van het eerste lid wordt een strafbeschikking met een veroordeling gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel123b
  - number: 123b.3
    text: |-
      Indien een rijbewijs dat op grond van het eerste lid ongeldig zou zijn, reeds eerder zijn geldigheid heeft
      verloren, plaatst de officier van justitie een aantekening in het rijbewijzenregister waaruit blijkt dat de houder
      bij de aanvraag van een nieuw rijbewijs op bij algemene maatregel van bestuur vastgestelde wijze dient aan te
      tonen dat hij beschikt over de rijvaardigheid en de lichamelijke en geestelijke geschiktheid die is vereist voor
      het besturen van een motorrijtuig van de categorie of categorieën waarop de door de houder overgelegde aanvraag
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel123b
  - number: 123b.4
    text: |-
      De houder van een rijbewijs dat op grond van dit artikel ongeldig is of ten aanzien waarvan een aantekening is
      geplaatst als bedoeld in het derde lid dient dat rijbewijs, voor zover inlevering niet reeds heeft plaatsgevonden
      op grond van een ander artikel, in te leveren bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel123b
  - number: 123b.5
    text: |-
      Voor de toepassing van dit artikel wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door het daartoe
      bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel123b
  - number: 123b.6
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel123b
  - number: '124.1'
    text: |-
      Onverminderd de [artikelen 132, tweede lid][ref1], [132b, tweede lid][ref2], en [134, vierde lid][ref3], wordt een
      rijbewijs overeenkomstig bij algemene maatregel van bestuur vastgestelde regels voor een of meer categorieën van
      motorrijtuigen of voor een deel van de geldigheidsduur ongeldig verklaard indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel134
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132b
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '134'
        hoofdstuk: VI
        paragraaf: '6'
        afdeling: '9'
  - number: 124.1.a
    text: |-
      het rijbewijs is afgegeven op grond van door de houder verschafte onjuiste gegevens en het niet zou zijn afgegeven
      indien de onjuistheid van die gegevens ten tijde van de aanvraag bekend zou zijn geweest;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: 124.1.b
    text: na afgifte van het rijbewijs blijkt dat het kennelijk abusievelijk aan de houder is afgegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: 124.1.c
    text: |-
      de houder een schriftelijke verklaring overlegt, waarin hij afstand doet van de bevoegdheid tot het besturen van
      een of meer categorieën van motorrijtuigen waarvoor het rijbewijs is afgegeven;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: 124.1.d
    text: |-
      de houder blijkens een op diens verzoek uitgevoerd onderzoek niet langer beschikt over de lichamelijke of
      geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen van de categorie of categorieën
      waarop het onderzoek betrekking heeft, voor die categorie of categorieën en, indien bij dat onderzoek blijkt dat
      hij tevens niet beschikt over de lichamelijke of geestelijke geschiktheid die is vereist voor het besturen van
      motorrijtuigen van een andere categorie of andere categorieën dan waarop het onderzoek betrekking heeft, tevens
      voor die andere categorie of categorieën;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: 124.1.e
    text: |-
      het als gevonden voorwerp is ontvangen en teruggave aan de houder niet mogelijk is gebleken, mits de houder nog
      geen aanvraag voor een vervangend rijbewijs heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: '124.2'
    text: 'De ongeldigverklaring geschiedt:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: 124.2.a
    text: |-
      in de in het eerste lid, onderdelen a en b, bedoelde gevallen door de Dienst Wegverkeer, indien de
      ongeldigverklaring betrekking heeft op een door deze dienst of een door Onze Minister afgegeven rijbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: 124.2.b
    text: |-
      in de in het eerste lid, onderdelen d en e, bedoelde gevallen door de Dienst Wegverkeer, indien de
      ongeldigverklaring betrekking heeft op een rijbewijs, afgegeven door het daartoe bevoegde gezag in een andere
      lidstaat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of Zwitserland, waarvan de houder in Nederland woonachtig is;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: 124.2.c
    text: |-
      in de in het eerste lid, onderdelen a en b, bedoelde gevallen door degene die is belast met de afgifte van
      rijbewijzen, indien de ongeldigverklaring betrekking heeft op een rijbewijs dat niet is afgegeven door de Dienst
      Wegverkeer of door Onze Minister, dan wel door het daartoe bevoegde gezag in een andere lidstaat van de Europese
      Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of
      Zwitserland;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: 124.2.d
    text: in het in het eerste lid, onderdeel c, bedoelde geval
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: 124.2.d.I
    text: |-
      indien de verklaring wordt overgelegd door een houder die zich ingevolge het in
      [artikel 131, eerste lid, onderdeel c][ref1], bedoelde besluit dient te onderwerpen aan een onderzoek naar zijn
      rijvaardigheid of geschiktheid, door het CBR;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 124.2.d.II
    text: |-
      buiten de gevallen waarin de verklaring wordt overgelegd door een houder die zich ingevolge het in
      [artikel 131, eerste lid, onderdeel c][ref1], bedoelde besluit dient te onderwerpen aan een onderzoek naar
      zijn rijvaardigheid of geschiktheid, door degene die is belast met de afgifte van rijbewijzen, indien de
      ongeldigverklaring betrekking heeft op een rijbewijs dat niet is afgegeven door de Dienst Wegverkeer of door Onze
      Minister dan wel door de Dienst Wegverkeer, indien de ongeldigverklaring betrekking heeft op een door deze dienst
      of een door Onze Minister afgegeven rijbewijs;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 124.2.e
    text: in de in het eerste lid, onderdeel d, bedoelde gevallen door het CBR;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: 124.2.f
    text: |-
      in het in het eerste lid, onderdeel e, bedoelde geval door degene die is belast met de afgifte van rijbewijzen,
      indien de ongeldigverklaring betrekking heeft op een rijbewijs dat niet is afgegeven door het daartoe bevoegde
      gezag in een andere lidstaat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: 124.2.g
    text: |-
      in afwijking van onderdeel c vindt ongeldigverklaring plaats door de Dienst Wegverkeer, indien deze dienst beschikt
      over gegevens uit het buitenland waaruit blijkt dat betrokkene tevens houder is van een rijbewijs afgegeven door
      het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: '124.3'
    text: |-
      De ongeldigverklaring is van kracht met ingang van de zevende dag na die waarop het besluit tot ongeldigverklaring
      aan de houder van het rijbewijs is bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: '124.4'
    text: |-
      De houder van het ongeldig verklaarde rijbewijs dient dat rijbewijs zodra de ongeldigverklaring van kracht is
      geworden, in te leveren bij degene die het ongeldig heeft verklaard.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: '124.5'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld omtrent de wijze waarop de inlevering van
      ongeldig verklaarde rijbewijzen dient plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: '124.6'
    text: |-
      Indien het rijbewijs dat voor ongeldigverklaring op grond van het eerste lid, onderdeel c, in aanmerking komt, zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur, plaatst degene die ingevolge het tweede lid
      is belast met de ongeldigverklaring:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: 124.6.a
    text: |-
      in het in het tweede lid, onderdeel d, aanhef en onder I, bedoelde geval een aantekening in het rijbewijzenregister
      waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op de bij algemene maatregel van
      bestuur vastgestelde wijze dient aan te tonen dat hij, al naar gelang de aard van het onderzoek waarop het in
      [artikel 131, eerste lid, onderdeel c][ref1], bedoelde besluit betrekking heeft, beschikt over de rijvaardigheid,
      de lichamelijke en geestelijke geschiktheid dan wel de rijvaardigheid en de lichamelijke en geestelijke
      geschiktheid die is vereist voor het besturen van motorrijtuigen van de categorie of categorieën waarop de door de
      houder overgelegde verklaring betrekking heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 124.6.b
    text: |-
      in het in het tweede lid, onderdeel d, aanhef en onder II, bedoelde geval een aantekening in het
      rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op de bij algemene
      maatregel van bestuur vastgestelde wijze dient aan te tonen dat hij beschikt over de rijvaardigheid en de
      lichamelijke en geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen van de categorie of
      categorieën waarop de door de houder overgelegde verklaring betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: '124.7'
    text: |-
      Indien het rijbewijs dat voor ongeldigverklaring op grond van het eerste lid, onderdeel d, in aanmerking komt, zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur, plaatst degene die ingevolge het tweede lid
      is belast met de ongeldigverklaring, een aantekening in het rijbewijzenregister waaruit blijkt dat de houder bij de
      aanvraag van een nieuw rijbewijs op de bij algemene maatregel van bestuur vastgestelde wijze dient aan te tonen dat
      hij beschikt over de lichamelijke en geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen
      van de categorie of categorieën waarop het onderzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: '124.8'
    text: |-
      Indien bij het op grond van het eerste lid, onderdeel d, uitgevoerde onderzoek is gebleken dat de resterende
      geldigheidsduur van het rijbewijs korter is dan de termijn waarvoor de houder blijkens het onderzoek naar
      verwachting geschikt zal zijn voor het besturen van motorrijtuigen, plaatst het CBR een aantekening in het
      rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op de bij algemene
      maatregel van bestuur vastgestelde wijze dient aan te tonen dat hij beschikt over de lichamelijke en geestelijke
      geschiktheid die is vereist voor het besturen van motorrijtuigen van de categorie of categorieën waarop het
      onderzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: '124.9'
    text: |-
      Voor de toepassing van het eerste lid, aanhef en onderdelen c, d en e, het derde tot en met het achtste lid wordt
      onder rijbewijs mede verstaan een rijbewijs, afgegeven door het daartoe bevoegde gezag in een andere lidstaat
      van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124
  - number: 124a.1
    text: |-
      Een overeenkomstig [artikel 151g, derde lid][ref1], op het rijbewijs vermeld getuigschrift van vakbekwaamheid of
      getuigschrift van nascholing en een in [artikel 151g, vierde lid][ref2], bedoeld certificaat, kan door de instantie
      die het getuigschrift onderscheidenlijk het certificaat heeft afgegeven ongeldig worden verklaard indien na afgifte
      blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 124a.1.a
    text: |-
      het getuigschrift onderscheidenlijk het certificaat is afgegeven op grond van door de houder verschafte onjuiste
      gegevens en het niet zou zijn afgegeven indien de onjuistheid van die gegevens ten tijde van de afgifte bekend zou
      zijn geweest;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124a
  - number: 124a.1.b
    text: het getuigschrift onderscheidenlijk het certificaat kennelijk abusievelijk aan de houder is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124a
  - number: 124a.2
    text: |-
      De ongeldigverklaring van het getuigschrift of certificaat is van kracht met ingang van de zevende dag na die
      waarop het besluit tot ongeldigverklaring aan de houder van het getuigschrift onderscheidenlijk het certificaat is
      bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124a
  - number: 124a.3
    text: |-
      Zodra de ongeldigverklaring van een getuigschrift of van een certificaat van kracht is geworden, levert de houder
      van een getuigschrift het rijbewijs in bij de instantie die belast is met de afgifte van rijbewijzen en levert de
      houder van een certificaat dat document in bij de instantie die het ongeldig heeft verklaard.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124a
  - number: 124a.4
    text: |-
      Onverminderd het eerste lid en [artikel 151g, vierde lid][ref1], verliest het certificaat zijn geldigheid:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 124a.4.a
    text: door het onbevoegd daarin aanbrengen van wijzigingen, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124a
  - number: 124a.4.b
    text: door het overlijden van de houder.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124a
  - number: 124a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze van
      bekendmaking van de ongeldigverklaring van een getuigschrift of certificaat, de vernieuwing van rijbewijzen na
      ongeldigverklaring van het daarop vermelde getuigschrift en omtrent de wijze van inlevering van een ongeldig
      verklaard certificaat.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel124a
  - number: '125.1'
    text: |-
      Indien het rijbewijs niet voor alle categorieën waarvoor het is afgegeven, ongeldig is verklaard dan wel indien
      de ongeldigverklaring betrekking heeft op een deel van de geldigheidsduur, wordt door degene die is belast met de
      afgifte van rijbewijzen een nieuw rijbewijs afgegeven dat geldig is voor de categorie of categorieën of voor dat
      deel van de geldigheidsduur waarop de ongeldigverklaring geen betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel125
  - number: '125.2'
    text: |-
      Indien de ongeldigverklaring verband houdt met de noodzaak de rijbevoegdheid die voortvloeit uit een of meer
      categorieën waarvoor het rijbewijs is afgegeven, te beperken door het stellen van eisen aan het motorrijtuig of
      aan de bestuurder daarvan, wordt door degene die is belast met de afgifte van rijbewijzen een nieuw rijbewijs
      afgegeven waarin de noodzakelijk geachte beperkingen ten aanzien van de rijbevoegdheid zijn aangeduid met een bij
      ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel125
  - number: '125.3'
    text: |-
      Voor de toepassing van het eerste en het tweede lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven
      door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in Nederland
      woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel125
  - number: 125a.1
    text: |-
      Voor de toepassing van deze afdeling wordt verstaan onder overheidsorgaan een bestuursorgaan als bedoeld in
      [artikel 1:1, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel125a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 125a.2
    text: |-
      In aanvulling op het eerste lid wordt onder overheidsorgaan mede verstaan de bij ministeriële regeling aangewezen
      personen of instanties die een publieke taak uitoefenen, voor zover die aanwijzing naar het oordeel van Onze
      Minister noodzakelijk is met het oog op een goede uitoefening van hun publieke taak.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel125a
  - number: '126.1'
    text: |-
      Er is een rijbewijzenregister. De Dienst Wegverkeer is beheerder en verwerkingsverantwoordelijke van het
      rijbewijzenregister.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
  - number: '126.2'
    text: |-
      In het rijbewijzenregister worden gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën
      van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1]
      onderscheidenlijk [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], verwerkt
      voor de volgende doeleinden:


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 126.2.a
    text: |-
      een goede uitvoering van het bepaalde bij of krachtens deze wet en voor de handhaving van de bij of krachtens deze
      wet gestelde voorschriften;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
  - number: 126.2.b
    text: |-
      om overheidsorganen te voorzien van gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën
      van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1]
      onderscheidenlijk [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], uit het
      rijbewijzenregister, voor zover zij aangeven deze gegevens nodig te hebben voor een goede uitoefening van hun
      publieke taak;


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 126.2.c
    text: |-
      het ter beschikking stellen van gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën
      van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1]
      onderscheidenlijk [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], aan
      autoriteiten buiten Nederland en instellingen van internationale organisaties, voor zover zij deze gegevens nodig
      hebben voor de uitoefening van hun taak;


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 126.2.d
    text: |-
      het ter beschikking stellen van gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën
      van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1]
      onderscheidenlijk [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], aan
      personen of instanties, niet zijnde de in [artikel 127, eerste tot en met derde lid][ref3], bedoelde instanties,
      voor zover zij deze gegevens nodig hebben voor de uitoefening van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel127
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '127'
        hoofdstuk: VI
        afdeling: '8'
  - number: '126.3'
    text: |-
      In het rijbewijzenregister worden gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën
      van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1]
      onderscheidenlijk [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], verwerkt
      omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 126.3.a
    text: de rijvaardigheid en de geschiktheid van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
  - number: 126.3.b
    text: de aanvraag van rijbewijzen en eventuele weigering daarvan;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
  - number: 126.3.c
    text: de afgifte van rijbewijzen;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
  - number: 126.3.d
    text: de op het rijbewijs te vermelden getuigschriften van vakbekwaamheid en getuigschriften van nascholing;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
  - number: 126.3.e
    text: |-
      afgegeven certificaten als bedoeld in [artikel 151g, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 126.3.f
    text: |-
      ontzeggingen van de bevoegdheid tot het besturen van motorrijtuigen, alsmede de uitvoering van
      [artikel 123b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 123b
        hoofdstuk: VI
        afdeling: '7'
  - number: 126.3.g
    text: |-
      besluiten, genomen in het kader van de procedure op grond van de [artikelen 130 tot en met 134][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 126.3.h
    text: |-
      andere maatregelen dan de in de onderdelen f en g genoemde, die leiden tot een beperking of intrekking van de
      rijbevoegdheid of de ongeldigheid van het rijbewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
  - number: 126.3.i
    text: de begeleider;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
  - number: 126.3.j
    text: de aanvraag en afgifte van begeleiderspassen;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
  - number: 126.3.k
    text: |-
      het verlies van geldigheid of de ongeldigverklaring van begeleiderspassen overeenkomstig
      [artikel 111a, vierde lid][ref1], respectievelijk artikel 111a, vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel111a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 111a
        hoofdstuk: VI
        afdeling: '3'
  - number: '126.4'
    text: |-
      De Dienst Wegverkeer mag persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], verwerken voor zover dit
      verband houdt met de in het tweede lid genoemde doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '126.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld betreffende de inrichting en het
      beheer van het rijbewijzenregister, waaronder mede wordt begrepen de nadere uitwerking van de
      gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], die in het
      rijbewijzenregister worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '126.6'
    text: |-
      De gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens
      en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], blijven bewaard gedurende een
      bij algemene maatregel van bestuur vastgestelde periode die voor verschillende categorieën verschillend kan worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '126.7'
    text: |-
      Voor de toepassing van het derde lid wordt onder rijbewijs mede verstaan een rijbewijs afgegeven door het daartoe
      bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel126
  - number: '127.1'
    text: |-
      Aan overheidsorganen worden door de Dienst Wegverkeer uit het rijbewijzenregister gegevens,
      waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], verstrekt voor zover zij
      aangeven deze gegevens nodig te hebben voor de uitoefening van hun publieke taak.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '127.2'
    text: |-
      Aan bij algemene maatregel van bestuur aangewezen autoriteiten binnen de andere lidstaten van de
      Europese Unie en de andere staten die partij zijn bij de Overeenkomst betreffende de Europese Economische
      Ruimte worden in bij algemene maatregel van bestuur aangewezen gevallen door de Dienst Wegverkeer
      gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '127.3'
    text: |-
      Aan bij algemene maatregel van bestuur aangewezen autoriteiten buiten Nederland, niet zijnde autoriteiten
      uit lidstaten van de Europese Unie of staten die partij zijn bij de Overeenkomst betreffende de Europese
      economische Ruimte worden door de Dienst Wegverkeer in de bij algemene maatregel van bestuur aangewezen
      gevallen gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens
      en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], verstrekt. Gegevens,
      waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens en persoonsgegevens van
      strafrechtelijke aard als bedoeld in paragraaf 3.1 onderscheidenlijk paragraaf 3.2 van de Uitvoeringswet Algemene
      verordening gegevensbescherming, kunnen ook worden verstrekt aan instellingen van internationale organisaties voor
      zover dit ter uitvoering van een verdrag of een bindend besluit van een internationale organisatie vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '127.4'
    text: |-
      Aan bij algemene maatregel van bestuur aangewezen personen of instanties of categorieën van personen
      of instanties, niet zijnde de in het eerste tot en met derde lid bedoelde instanties, kunnen
      desgevraagd door de Dienst Wegverkeer in de bij algemene maatregel van bestuur aangegeven gevallen
      gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], worden verstrekt die zij voor
      hun taak behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '127.5'
    text: |-
      Onverminderd het vierde lid kunnen aan bij ministeriële regeling personen of instanties worden aangewezen aan wie
      persoonsgegevens worden verstrekt die strekken tot bevestiging of ontkenning van de afgifte en de geldigheid van
      rijbewijzen, waaronder begrepen de rijbewijscategorieën, of die strekken tot bevestiging van de identiteit van
      de houder.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel127
  - number: '127.6'
    text: |-
      In afwijking van het eerste tot en met het vierde lid kunnen niet tot personen herleidbare gegevens aan een ieder
      worden verstrekt, tenzij het gegevens betreft die naar het oordeel van de RDW kunnen leiden tot fraude met het
      rijbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel127
  - number: '127.7'
    text: |-
      Bij ministeriële regeling kunnen voor de uitvoering van het eerste tot en met het zesde lid nadere regels worden
      gesteld met betrekking tot de te verstrekken gegevens, de wijze van verstrekking van die gegevens, en kunnen
      voorwaarden worden verbonden aan de verstrekking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel127
  - number: '128.1'
    text: |-
      De in [artikel 127][ref1] bedoelde gegevensverstrekking aan ontvangers vindt plaats op door de Dienst Wegverkeer
      bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel127
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '127'
        hoofdstuk: VI
        afdeling: '8'
  - number: '128.2'
    text: |-
      De in [artikel 127, vierde, vijfde en zesde lid][ref1], bedoelde ontvangers zijn voor de verstrekking
      van gegevens, waaronder mede begrepen persoonsgegevens, bijzondere categorieën van persoonsgegevens
      en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref2] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref3], een door de Dienst Wegverkeer
      vastgesteld tarief verschuldigd. De betrokkene zelf is alleen kosten verschuldigd voor bijkomende kopieën van
      persoonsgegevens, waaronder mede begrepen bijzondere categorieën van persoonsgegevens en persoonsgegevens van
      strafrechtelijke aard als bedoeld in paragraaf 3.1 onderscheidenlijk paragraaf 3.2 van de Uitvoeringswet Algemene
      verordening gegevensbescherming, alsmede voor de verstrekking van gegevens, niet zijnde persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref3]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '127'
        hoofdstuk: VI
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '128.3'
    text: |-
      Onverminderd het tweede lid is degene die op grond van [artikel 127][ref1] een aanvraag indient tot
      geautomatiseerde verstrekking van gegevens, persoonsgegevens, waaronder mede begrepen bijzondere categorieën
      van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref2]
      onderscheidenlijk [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref3], in door de
      Dienst Wegverkeer te bepalen gevallen een door deze dienst te bepalen aansluittarief verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref3]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '127'
        hoofdstuk: VI
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '129'
    text: |-
      De overheidsorganen, bedoeld in [artikel 127, eerste lid][ref1], zijn, voor zover dit is bepaald bij algemene
      maatregel van bestuur, als verwerker bevoegd tot het invoeren, rectificeren en wissen in het rijbewijzenregister
      van de bij algemene maatregel van bestuur aangegeven gegevens, waaronder mede begrepen persoonsgegevens, bijzondere
      categorieën van persoonsgegevens en persoonsgegevens als bedoeld in [paragraaf 3.1][ref2] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref3]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '127'
        hoofdstuk: VI
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 129a.1
    text: |-
      De Dienst Wegverkeer houdt een register betreffende gegevens inzake het alcoholslotprogramma. Onder gegevens worden
      mede begrepen persoonsgegevens of bijzondere persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129a
  - number: 129a.2
    text: |-
      Het verzamelen van gegevens als bedoeld in [artikel 129 c, eerste lid][ref1], geschiedt voor de volgende
      doeleinden:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel129c
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 129c
        hoofdstuk: VI
        afdeling: 8a
  - number: 129a.2.a
    text: een goede en adequate uitvoering van deze wet, voor zover het gaat om het alcoholslotprogramma;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129a
  - number: 129a.2.b
    text: |-
      de handhaving van bij of krachtens deze wet vastgestelde voorschriften, voor zover het gaat om het
      alcoholslotprogramma.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129a
  - number: 129b
    text: |-
      Ten aanzien van de verwerkingen ten behoeve van het alcoholslotregister is de Dienst Wegverkeer de
      verantwoordelijke in de zin van [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129b
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 129c.1
    text: 'In het alcoholslotregister worden de volgende gegevens verwerkt:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129c
  - number: 129c.1.a
    text: gegevens betreffende de oplegging van een alcoholslotprogramma aan de betrokken rijbewijshouder;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129c
  - number: 129c.1.b
    text: |-
      gegevens betreffende de erkenninghouder, bedoeld in [artikel 132k, eerste lid][ref1], alsmede de persoon door wie
      de in dat lid bedoelde werkzaamheden zijn verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 129c.1.c
    text: het kenteken van het motorrijtuig waarin een alcoholslot is ingebouwd;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129c
  - number: 129c.1.d
    text: |-
      gegevens betreffende het inbouwen, het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen en het
      verwijderen van het alcoholslot;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129c
  - number: 129c.1.e
    text: gegevens betreffende de betaling van de kosten verbonden aan het alcoholslotprogramma;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129c
  - number: 129c.1.f
    text: gegevens voortvloeiende uit de periodieke uitlezing van het alcoholslot.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129c
  - number: 129c.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de inrichting en het beheer
      van het register.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129c
  - number: 129d.1
    text: |-
      Aan autoriteiten die betrokken zijn bij de uitvoering van deze wet of zijn belast met de handhaving van de bij of
      krachtens deze wet vastgestelde voorschriften, voor zover het het alcoholslotprogramma betreft, worden op door de
      Dienst Wegverkeer bepaalde wijze de gegevens verstrekt die zij voor de uitvoering van hun taak behoeven.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129d
  - number: 129d.2
    text: |-
      De autoriteiten, bedoeld in het eerste lid, zijn op bij algemene maatregel van bestuur bepaalde wijze bevoegd tot
      het invoeren, wijzigen dan wel verwijderen van de bij algemene maatregel van bestuur aangewezen gegevens die van
      belang zijn voor het bijhouden van het register.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129d
  - number: 129e
    text: |-
      De Dienst Wegverkeer stelt ten aanzien van het verwerken van gegevens als bedoeld in
      [artikel 129c, eerste lid][ref1], een reglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel129c
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel129e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 129c
        hoofdstuk: VI
        afdeling: 8a
  - number: '130.1'
    text: |-
      Indien bij de bij algemene maatregel van bestuur aangewezen personen een vermoeden bestaat dat de houder
      van een rijbewijs niet langer beschikt over de rijvaardigheid dan wel over de lichamelijke of geestelijke
      geschiktheid, vereist voor het besturen van een of meer categorieën van motorrijtuigen waarvoor dat rijbewijs
      is afgegeven, doen zij daarvan zo spoedig mogelijk schriftelijk mededeling aan het CBR onder vermelding van de
      feiten en omstandigheden die aan het vermoeden ten grondslag liggen. Bij ministeriële regeling worden de feiten
      en omstandigheden aangewezen die aan het vermoeden ten grondslag dienen te liggen en worden ter zake van de
      uitoefening van deze bevoegdheid nadere regels vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel130
  - number: '130.2'
    text: |-
      Op de eerste vordering van de in [artikel 159, onderdeel a][ref1], bedoelde personen is de bestuurder van een
      motorrijtuig, ten aanzien van wie een vermoeden als bedoeld in het eerste lid bestaat, verplicht tot overgifte van
      het hem afgegeven rijbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '130.3'
    text: |-
      De in het tweede lid bedoelde vordering wordt gedaan indien de betrokken bestuurder de veiligheid op de weg
      zodanig in gevaar kan brengen dat hem met onmiddellijke ingang de bevoegdheid dient te worden ontnomen langer als
      bestuurder van een of meer categorieën van motorrijtuigen, waarvoor het rijbewijs is afgegeven, aan het verkeer
      deel te nemen. Bij ministeriële regeling worden de gevallen aangewezen waarin daarvan sprake is. De in het tweede
      lid bedoelde vordering wordt tevens gedaan in bij ministeriële regeling aangegeven gevallen van overtreding van
      de voorwaarden van deelname aan het alcoholslotprogramma. Het ingevorderde rijbewijs wordt gelijktijdig met de
      schriftelijke mededeling, bedoeld in het eerste lid, aan het CBR toegezonden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel130
  - number: '130.4'
    text: |-
      In geval van toepassing van het tweede lid kan het motorrijtuig, voor zover geen andere bestuurder
      beschikbaar is of de bestuurder niet aanstonds voldoet aan de vordering, onder toezicht of, voor
      zover degene die de vordering heeft gedaan, zulks nodig oordeelt, in bewaring worden gesteld. In het
      laatste geval zijn de [artikelen 170, tweede lid, tweede en derde volzin, vierde en vijfde lid][ref1],
      [171][ref2], [172][ref3] en [173, eerste lid][ref4], van deze wet en de [artikelen 4:116][ref5],
      [4:118 tot en met 4:124][ref6], [5:10][ref7], [5:25, eerste en zesde lid][ref8], [5:29, tweede en derde lid][ref9],
      [5:30, eerste, tweede, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref10] van overeenkomstige
      toepassing. Teruggave van het motorrijtuig vindt slechts plaats, indien aan de vordering is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel170
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel172
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel173
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref9]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref10]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '170'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '171'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '172'
        hoofdstuk: X
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '173'
        hoofdstuk: X
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref9
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref10
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '130.5'
    text: |-
      Voor de toepassing van het eerste, tweede en derde lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven
      door het daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel130
  - number: '131.1'
    text: |-
      Indien een schriftelijke mededeling als bedoeld in [artikel 130, eerste lid][ref1], is gedaan, besluit het CBR in
      de bij ministeriële regeling aangewezen gevallen respectievelijk tot:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 131.1.a
    text: oplegging van een educatieve maatregel ter bevordering van de rijvaardigheid of geschiktheid,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel131
  - number: 131.1.b
    text: oplegging van een alcoholslotprogramma, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel131
  - number: 131.1.c
    text: een onderzoek naar de rijvaardigheid of geschiktheid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel131
  - number: '131.2'
    text: 'Bij het besluit, bedoeld in het eerste lid, wordt:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel131
  - number: 131.2.a
    text: |-
      in de gevallen, bedoeld in [artikel 130, derde lid][ref1], de geldigheid van het rijbewijs van
      betrokkene voor één of meer categorieën van motorrijtuigen geschorst tot de dag waarop het in
      [artikel 134, vierde of zevende lid][ref2], bedoelde besluit van kracht wordt;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel134
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '134'
        hoofdstuk: VI
        paragraaf: '6'
        afdeling: '9'
  - number: 131.2.b
    text: |-
      indien de geldigheid van het rijbewijs van betrokkene overeenkomstig onderdeel a wordt geschorst, en diens
      rijbewijs niet overeenkomstig [artikel 130, tweede lid][ref1], is ingevorderd, bepaald dat betrokkene zijn
      rijbewijs dient in te leveren bij het CBR;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 131.2.c
    text: |-
      indien de geldigheid van het rijbewijs van betrokkene niet overeenkomstig onderdeel a, wordt geschorst, doch diens
      rijbewijs wel overeenkomstig [artikel 130, tweede lid][ref1], is ingevorderd, bepaald dat het rijbewijs onverwijld
      aan betrokkene wordt teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: '131.3'
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel131
  - number: '131.4'
    text: |-
      Voor de toepassing van het tweede lid wordt onder rijbewijs mede verstaan een rijbewijs afgegeven door het daartoe
      bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel131
  - number: '132.1'
    text: |-
      Behoudens de bij algemene maatregel van bestuur vastgestelde uitzonderingen is diegene verplicht zijn medewerking
      te verlenen aan de opgelegde maatregel, die zich:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132
  - number: 132.1.a
    text: |-
      ingevolge [artikel 131, eerste lid, aanhef en onderdeel a][ref1], dient te onderwerpen aan een educatieve maatregel
      ter bevordering van de rijvaardigheid of geschiktheid,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 132.1.b
    text: |-
      krachtens [artikel 118, derde lid][ref1], of ingevolge de [artikelen 131, eerste lid, aanhef en onderdeel b][ref2],
      of [134, zevende lid, onderdeel a][ref3], dient te onderwerpen aan een alcoholslotprogramma, of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel134
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '118'
        hoofdstuk: VI
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '134'
        hoofdstuk: VI
        paragraaf: '6'
        afdeling: '9'
  - number: 132.1.c
    text: |-
      ingevolge [artikel 131, eerste lid, aanhef en onderdeel c][ref1], dient te onderwerpen aan een onderzoek naar de
      rijvaardigheid of geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: '132.2'
    text: |-
      Bij gebreke van de in het eerste lid bedoelde medewerking besluit het CBR onverwijld tot ongeldigverklaring van
      het rijbewijs van de houder. Het CBR bepaalt daarbij op welke categorie of categorieën van motorrijtuigen waarvoor
      het rijbewijs is afgegeven, de ongeldigverklaring betrekking heeft. Bij ministeriële regeling wordt vastgesteld in
      welke gevallen sprake is van het niet verlenen van medewerking. Als het niet verlenen van de vereiste medewerking
      wordt mede aangemerkt het niet voldoen van de kosten verbonden aan het huren of kopen, het inbouwen, het uitlezen,
      het testen, het kalibreren, het onderhouden en het verwijderen van het alcoholslot op de in het huur- dan wel
      koopcontract van het alcoholslot aangegeven wijze of binnen de in dat huur- dan wel koopcontract aangegeven termijn
      of termijnen, alsmede het niet voldoen van de kosten binnen de termijn of termijnen die is of zijn aangegeven bij
      het besluit waarbij de verplichting tot een van de hierna genoemde maatregelen is opgelegd, of het niet voldoen van
      de kosten op de in dat besluit aangegeven wijze, van:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132
  - number: 132.2.a
    text: |-
      de bij ministeriële regeling aangewezen educatieve maatregelen ter bevordering van de rijvaardigheid of
      geschiktheid,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132
  - number: 132.2.b
    text: het alcoholslotprogramma, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132
  - number: 132.2.c
    text: |-
      het onderzoek naar de rijvaardigheid of geschiktheid, indien deze kosten op grond van
      [artikel 133, vierde lid][ref1], voor rekening van betrokkene komen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel133
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '133'
        hoofdstuk: VI
        paragraaf: '6'
        afdeling: '9'
  - number: '132.3'
    text: Het CBR doet van het besluit mededeling aan bij algemene maatregel van bestuur aangewezen personen of instanties.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132
  - number: '132.4'
    text: |-
      De ongeldigverklaring is van kracht met ingang van de zevende dag na die waarop het besluit tot ongeldigverklaring
      aan de houder van het rijbewijs is bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132
  - number: '132.5'
    text: |-
      De houder van het ongeldig verklaarde rijbewijs dient dat rijbewijs, zodra de ongeldigverklaring van kracht is
      geworden, in te leveren bij het CBR, ook indien de ongeldigverklaring niet alle categorieën betreft waarvoor het
      rijbewijs geldig was.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132
  - number: '132.6'
    text: |-
      Indien het rijbewijs dat voor ongeldigverklaring op grond van het tweede lid in aanmerking komt, zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur, plaatst het CBR een aantekening in het
      rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op de bij algemene
      maatregel van bestuur vastgestelde wijze dient aan te tonen dat hij, al naar gelang de aard van het onderzoek
      waarop het in [artikel 131, eerste lid][ref1], bedoelde besluit betrekking heeft, beschikt over de rijvaardigheid
      dan wel de lichamelijke en geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen van de
      categorie of categorieën waarop dat besluit betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: '132.7'
    text: |-
      Voor de toepassing van het tweede, vijfde en zesde lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven
      door het daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132
  - number: 132a.1
    text: |-
      In de in [artikel 131, eerste lid, aanhef en onderdeel a][ref1], bedoelde gevallen legt het CBR bij het in dat
      artikel bedoelde besluit betrokkene overeenkomstig de bij algemene maatregel van bestuur vastgestelde regels de
      verplichting op zich binnen een daarbij vast te stellen termijn te onderwerpen aan educatieve maatregelen ter
      bevordering van de rijvaardigheid of geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 132a.2
    text: |-
      De kosten verbonden aan het opleggen van een educatieve maatregel ter bevordering van de rijvaardigheid of
      geschiktheid komen ten laste van iedereen aan wie overeenkomstig het eerste lid de verplichting tot deelname aan
      een dergelijke maatregel is opgelegd. De hoogte van deze kosten wordt door het CBR vastgesteld. In geval van niet,
      niet geheel of niet op aangegeven wijze of binnen de aangegeven termijnen betalen van deze kosten vaardigt het CBR
      een dwangbevel uit aan de nalatige. Voor de toepassing van [titel 4.4. van de Algemene wet bestuursrecht][ref1]
      wordt het besluit als bedoeld in [artikel 131, eerste lid, aanhef en onderdeel a][ref2], aangemerkt als beschikking
      als bedoeld in [artikel 4.86 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132a
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 132a.3
    text: |-
      De kosten verbonden aan het uitvoeren van de educatieve maatregelen komen ten laste van betrokkene. De hoogte van
      deze kosten wordt door het CBR vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132a
  - number: 132a.4
    text: |-
      Het CBR bepaalt de aard van de educatieve maatregelen en wijst een of meer tot toepassing van die maatregelen
      bevoegde deskundigen aan.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132a
  - number: 132a.5
    text: Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132a
  - number: 132a.6
    text: |-
      Voor de toepassing van het eerste lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door het daartoe
      bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132a
  - number: 132b.1
    text: |-
      In de in [artikel 131, eerste lid, aanhef en onderdeel b][ref1], bedoelde gevallen legt het CBR overeenkomstig
      bij algemene maatregel van bestuur vastgestelde regels bij het in dat artikellid bedoelde besluit betrokkene de
      verplichting op deel te nemen aan een alcoholslotprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 132b.2
    text: |-
      Bij het besluit, bedoeld in het eerste lid, verklaart het CBR het rijbewijs van betrokkene ongeldig en bepaalt
      daarbij dat de ongeldigverklaring betrekking heeft op alle categorieën waarvoor dat rijbewijs geldig was, met
      uitzondering van de categorie AM. [Artikel 132, vierde tot en met zevende lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: 132b.3
    text: 'Het CBR doet mededeling aan betrokkene dat hij:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132b
  - number: 132b.3.a
    text: |-
      nadat hij heeft voldaan aan de eisen, bedoeld in [artikel 132c, eerste lid, onderdelen a, b, en c][ref1],
      overeenkomstig de daarvoor bij algemene maatregel van bestuur gestelde regels een rijbewijs kan aanvragen voor de
      categorie of categorieën waarvoor hij aan die eisen heeft voldaan, alsmede voor categorie AM, dan wel dat hij


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132c
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132c
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '9'
  - number: 132b.3.b
    text: |-
      indien hij niet heeft voldaan aan de eisen, bedoeld in [artikel 132c, eerste lid, onderdelen a, b en c][ref1],
      overeenkomstig de daarvoor bij algemene maatregel van bestuur vastgestelde regels een rijbewijs voor de categorie
      AM kan aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132c
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132c
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '9'
  - number: 132b.4
    text: |-
      Indien het rijbewijs dat voor ongeldigverklaring op grond van het tweede lid in aanmerking komt, zijn geldigheid
      heeft verloren door het verstrijken van de geldigheidsduur, of op andere wijze ongeldig is geworden, plaatst het
      CBR een aantekening in het rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs
      alleen een rijbewijs kan krijgen dat geldig is voor het besturen van een motorrijtuig waarin bij of krachtens de
      wet een alcoholslot is ingebouwd, en de categorie AM.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132b
  - number: 132b.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132b
  - number: 132b.6
    text: |-
      Voor de toepassing van het tweede en vierde lid wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door
      het daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132b
  - number: 132c.1
    text: 'Degene aan wie deelname aan het alcoholslotprogramma is opgelegd dient:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132c
  - number: 132c.1.a
    text: |-
      overeenkomstig de bij of krachtens algemene maatregel van bestuur vastgestelde bepalingen een alcoholslot te doen
      inbouwen in ten minste één motorrijtuig dat voldoet aan de bij algemene maatregel van bestuur gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132c
  - number: 132c.1.b
    text: de aangegeven kosten op de aangegeven wijze te hebben betaald aan het CBR;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132c
  - number: 132c.1.c
    text: |-
      het bij het besluit, bedoeld in [artikel 132b, eerste lid][ref1], meegezonden, door het CBR vastgestelde,
      aanmeldformulier te hebben teruggezonden aan het CBR, en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132b
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '9'
  - number: 132c.1.d
    text: |-
      overeenkomstig bij algemene maatregel van bestuur vastgestelde wijze de feitelijke beschikking te hebben gekregen
      over een nieuw rijbewijs, waarop voor de toepasselijke rijbewijscategorie, met uitzondering van de categorie AM, de
      bij ministeriële regeling vastgestelde codering voor het rijden met een alcoholslot is vermeld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132c
  - number: 132c.2
    text: Per motorrijtuig kan slechts één alcoholslot tegelijk zijn ingebouwd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132c
  - number: 132c.3
    text: |-
      Een ingebouwd alcoholslot kan slechts door één bestuurder worden gebruikt aan wie het CBR overeenkomstig de
      [artikelen 131, eerste lid, onderdeel b][ref1], en [132b, eerste lid][ref2], de verplichting heeft opgelegd tot
      deelname aan het alcoholslotprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132b
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '9'
  - number: 132c.4
    text: |-
      Onverminderd [artikel 132d, tweede of vierde lid][ref1], is de duur van het alcoholslotprogramma twee jaar. Deze
      termijn neemt een aanvang op de dag waarop degene aan wie de verplichting tot deelname aan het alcoholslotprogramma
      is opgelegd heeft voldaan aan het eerste lid, onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132d
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132d
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '9'
  - number: 132c.5
    text: |-
      Degene aan wie deelname aan het alcoholslotprogramma is opgelegd, is verplicht het door het CBR bepaalde
      begeleidingsprogramma te volgen en daartoe het alcoholslot periodiek te laten uitlezen bij een erkenninghouder als
      bedoeld in [artikel 132k, eerste lid][ref1]. Bij ministeriële regeling wordt de termijn vastgelegd waarbinnen de
      uitlezing uiterlijk dient plaats te vinden. In bij ministeriële regeling aangegeven gevallen kan het CBR in het
      kader van het begeleidingsprogramma een kortere termijn vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132c.6
    text: |-
      De kosten verbonden aan het opleggen van het alcoholslotprogramma komen ten laste van iedereen aan wie
      overeenkomstig [artikel 132b, eerste lid][ref1], de verplichting tot deelname aan het alcoholslotprogramma is
      opgelegd. De hoogte van deze kosten wordt door het CBR vastgesteld. In geval van niet, niet geheel of niet op
      aangegeven wijze of binnen de aangegeven termijnen betalen van deze kosten vaardigt het CBR een dwangbevel uit
      aan de nalatige. Voor de toepassing van [titel 4.4. van de Algemene wet bestuursrecht][ref2] wordt het besluit
      als bedoeld in [artikel 131, eerste lid, aanhef en onderdeel b][ref3], aangemerkt als beschikking als bedoeld in
      [artikel 4.86 van de Algemene wet bestuursrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132b
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 132c.7
    text: 'De kosten van verbonden aan:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132c
  - number: 132c.7.a
    text: |-
      het uitvoeren van het alcoholslotprogramma, alsmede de kosten verbonden aan het beheer en het in stand
      houden van het alcoholslotregister en het verstrekken van gegevens uit dat register overeenkomstig
      [artikel 129d, eerste lid][ref1], en aan


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel129d
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 129d
        hoofdstuk: VI
        afdeling: 8a
  - number: 132c.7.b
    text: |-
      het huren dan wel kopen, het inbouwen, het uitlezen, het testen, het kalibreren het onderhouden en het verwijderen
      van het alcoholslot, komen ten laste van betrokkene. De hoogte van de in onderdeel a genoemde kosten die door het
      CBR worden geïnd, wordt door het CBR vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132c
  - number: 132c.8
    text: |-
      De gegevens die periodiek worden uitgelezen uit het alcoholslot worden toegerekend aan degene aan wie deelname aan
      een alcoholslotprogramma is opgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132c
  - number: 132c.9
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het eerste, vijfde en zesde lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132c
  - number: 132d.1
    text: |-
      Uiterlijk vier weken voor de afloop van het alcoholslotprogramma vindt op door het CBR bepaalde wijze een evaluatie
      plaats van de wijze waarop betrokkene heeft deelgenomen aan het alcoholslotprogramma. Indien uit de evaluatie
      blijkt dat betrokkene heeft voldaan aan de bij ministeriële regeling aangegeven voorwaarden, registreert het CBR
      onverwijld in het rijbewijzenregister ten behoeve van betrokkene dat de hem opgelegde beperkingen zijn vervallen
      en dat hij overeenkomstig bij algemene maatregel van bestuur vastgestelde regels een rijbewijs zonder de bij
      ministeriële regeling vastgestelde codering voor het rijden met een alcoholslot kan aanvragen. Het CBR doet hiervan
      mededeling aan betrokkene.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132d
  - number: 132d.2
    text: |-
      In de bij ministeriële regeling aangegeven gevallen besluit het CBR tot verlenging van het alcoholslotprogramma met
      zes maanden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132d
  - number: 132d.3
    text: |-
      Uiterlijk vier weken voor de afloop van de verlenging vindt op door het CBR bepaalde wijze een evaluatie plaats
      van de wijze waarop betrokkene heeft deelgenomen aan het alcoholslotprogramma. Indien uit de evaluatie blijkt dat
      betrokkene heeft voldaan aan de bij ministeriële regeling aangegeven voorwaarden, registreert het CBR onverwijld
      in het rijbewijzenregister ten behoeve van betrokkene dat de hem opgelegde beperkingen zijn vervallen en dat hij
      overeenkomstig bij algemene maatregel van bestuur vastgestelde regels een rijbewijs zonder de bij ministeriële
      regeling vastgestelde codering voor het rijden met een alcoholslot kan aanvragen. Het CBR doet hiervan mededeling
      aan betrokkene.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132d
  - number: 132d.4
    text: |-
      In andere dan de in het derde lid bedoelde gevallen besluit het CBR tot verlenging van het alcoholslotprogramma met
      zes maanden. Het derde lid is vervolgens van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132d
  - number: 132d.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132d
  - number: 132e.1
    text: |-
      In het kader van het alcoholslotprogramma wordt uitsluitend gebruik gemaakt van een alcoholslot dat is voorzien
      van een typegoedkeuring, verleend door de Dienst Wegverkeer, of een daaraan bij ministeriële regeling gelijkgesteld
      alcoholslot. De typegoedkeuring van het alcoholslot en de daarbij behorende uitleesapplicatie wordt op aanvraag en
      tegen betaling, op de door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door deze dienst vastgestelde
      tarief door deze dienst verleend, indien door de dienst is vastgesteld dat het alcoholslot aan de bij ministeriële
      regeling gestelde eisen voldoet en indien het productieproces van de alcoholsloten van het desbetreffende
      type is goedgekeurd. De [artikelen 22, vierde en vijfde lid][ref1], [22b][ref2], [23][ref3], [23a][ref4] en
      [25a tot en met 25e][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel22b
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel23a
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel25a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 22b
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '23'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: 23a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: 25a
        hoofdstuk: III
        paragraaf: 2a
  - number: 132e.2
    text: |-
      Na verwijdering van het alcoholslot vindt controle van het uitgebouwde alcoholslot plaats door degene die
      overeenkomstig het goedgekeurde productieproces als bedoeld in het eerste lid produceert.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e
  - number: 132e.3
    text: |-
      Bij ministeriële regeling worden regels gesteld betreffende de aanvraag tot goedkeuring van een type alcoholslot,
      de eisen waaraan de alcoholsloten dienen te voldoen, de onderzoeken waaraan zij dienen te zijn onderworpen,
      het door de aanvrager ter beschikking stellen van alcoholsloten, de wijze waarop de overdracht van de gegevens
      uit het alcoholslot naar het alcoholslotregister plaatsvindt, het door de aanvrager overleggen van bescheiden
      en het verstrekken van inlichtingen ter zake van de keuring, het testrapport, de intrekking van een dergelijke
      goedkeuring, de controle van een alcoholslot als bedoeld in het tweede lid, en de onderzoeken waaraan het
      alcoholslot in dat kader wordt onderworpen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e
  - number: 132e.4
    text: |-
      De Dienst Wegverkeer, dan wel de door hem aangewezen technische dienst als bedoeld in het eerste lid, onderwerpt
      voorafgaand aan een eerste inbouw een bij ministeriële regeling vastgesteld aantal typegoedgekeurde alcoholsloten
      aan een steekproefsgewijze keuring. Hetzelfde geldt voor typegoedgekeurde alcoholsloten, ten aanzien waarvan
      een controle heeft plaatsgevonden als bedoeld in het tweede lid. Degene die overeenkomstig het goedgekeurde
      productieproces, bedoeld in het eerste lid, produceert, is verplicht zijn medewerking te verlenen aan deze
      steekproefsgewijze keuringen. Bij ministeriële regeling worden regels gesteld ten aanzien van de wijze waarop de
      in dit lid bedoelde keuringen worden uitgevoerd, het door de aanvrager ter beschikking stellen van alcoholsloten,
      het door de aanvrager overleggen van bescheiden en het verstrekken van inlichtingen ter zake van de keuring en de
      maatregelen die de Dienst Wegverkeer kan treffen. Intensivering van de steekproefsgewijze controle of het stellen
      van een termijn om de gebreken te herstellen, kunnen daarvan deel uitmaken.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e
  - number: 132e.5
    text: 'Bij ministeriële regeling kan worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e
  - number: 132e.5.a
    text: |-
      het voldoen aan de in het eerste lid gestelde eisen wordt aangetoond door middel van in die regels voorgeschreven
      apparatuur;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e
  - number: 132e.5.b
    text: die apparatuur is goedgekeurd door een door Onze Minister aangewezen keuringsinstelling;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e
  - number: 132e.5.c
    text: |-
      die apparatuur alleen kan worden goedgekeurd indien de in die regels genoemde technische specificaties van die
      apparatuur die noodzakelijk zijn om het periodieke onderzoek, bedoeld in onderdeel d, uit te kunnen voeren, op de
      in die regels aangegeven wijze bekend worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e
  - number: 132e.5.d
    text: |-
      die apparatuur met een in die regels vast te stellen periodiciteit is onderzocht door de in het eerste lid
      bedoelde keuringsinstelling, dan wel door een door Onze Minister of door deze keuringsinstelling aangewezen
      onderzoeksgerechtigde en dat de middelen die worden gebruikt om die apparatuur voor gebruik geschikt te maken, zijn
      gecertificeerd door een door die keuringsinstelling erkende instelling, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e
  - number: 132e.5.e
    text: |-
      bij de erkenning van een onderzoeksgerechtigde of instelling als bedoeld in onderdeel d, wordt voldaan aan de in
      die regels opgenomen voorschriften.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e
  - number: 132e.6
    text: |-
      Een type alcoholslot kan voor een typegoedkeuring worden aangeboden indien de aanvrager heeft aangetoond dat
      het alcoholslot een beschermingsniveau biedt dat naar het oordeel van de Dienst Wegverkeer, dan wel de door hem
      aangewezen technische dienst als bedoeld in het eerste lid, ten minste gelijkwaardig is aan het niveau dat met de
      in het derde lid bedoelde eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e
  - number: 132e.7
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e
  - number: 132e1.1
    text: Bij ministeriële regeling wordt bepaald wanneer een typegoedkeuring vervalt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e1
  - number: 132e1.2
    text: 'Intrekking van de typegoedkeuring vindt plaats indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e1
  - number: 132e1.2.a
    text: de producent van het desbetreffende type alcoholslot daarom verzoekt, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e1
  - number: 132e1.2.b
    text: |-
      de erkenning als bedoeld in [artikel 132f, eerste lid][ref1], door de Dienst Wegverkeer wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132e1.3
    text: |-
      Indien de steekproefsgewijze keuring als bedoeld in [artikel 132e, eerste of vierde lid][ref1], daartoe aanleiding
      geeft, dan wel indien een typegoedkeuring wordt ingetrokken, bepaalt de Dienst Wegverkeer de gevolgen voor reeds
      ingebouwde alcoholsloten van dat type. Indien wordt besloten dat reeds ingebouwde alcoholsloten moeten worden
      vervangen, dan bepaalt de Dienst Wegverkeer tevens de termijn waarbinnen die vervanging moet zijn gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132e
        hoofdstuk: VI
        paragraaf: '4'
        afdeling: '9'
  - number: 132e1.4
    text: |-
      Vanaf de datum waarop de eisen waaraan alcoholsloten moeten voldoen, zijn aangepast, mogen alcoholsloten van
      een overeenkomstig de oude eisen goedgekeurd type in het kader van het alcoholslotprogramma nog worden ingebouwd
      gedurende een bij ministeriële regeling vastgestelde periode.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e1
  - number: 132e1.5
    text: |-
      Bij ministeriële regeling wordt vastgelegd met ingang van welk tijdstip na de aanpassing van de in het vierde lid
      bedoelde eisen alle alcoholsloten moeten voldoen aan de aangepaste eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132e1
  - number: 132f.1
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is tot het in stand houden van een netwerk van werkplaatsen voor het inbouwen, het uitlezen, het testen,
      het kalibreren, het vervangen en het verwijderen van het door hem gevoerde alcoholslot, alsmede het verrichten van
      de daarmee samenhangende werkzaamheden. Bij de aanvraag van de in dit lid bedoelde erkenning kan in afwijking van
      de eisen gesteld in [artikel 132g, tweede lid, onderdelen b en d][ref1], worden volstaan met:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132g
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132g
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132f.1.a
    text: |-
      een alcoholslot dat overeenkomstig [artikel 132e][ref1] is goedgekeurd door de aangewezen keuringsinstelling en
      waarvoor de typegoedkeuring is aangevraagd of tegelijk met de aanvraag voor een erkenning als bedoeld in dit lid
      wordt aangevraagd, en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132e
        hoofdstuk: VI
        paragraaf: '4'
        afdeling: '9'
  - number: 132f.1.b
    text: |-
      een netwerk waarvan de vereiste landelijke dekking blijkt uit contracten afgesloten met natuurlijke personen of
      rechtspersonen die al een aanvraag voor een erkenning als bedoeld in [artikel 132k, eerste lid][ref1], hebben
      ingediend, dan wel tegelijk met de aanvraag voor een erkenning als bedoeld in dit lid indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132f.2
    text: De erkenning kan worden verleend voor bepaalde of onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132f
  - number: 132f.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gesteld die aan een erkenning worden verbonden en kunnen met
      betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132f
  - number: 132g.1
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door de dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend indien de natuurlijke persoon of
      rechtspersoon voldoet aan de bij ministeriële regeling vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132g
  - number: 132g.2
    text: 'De in het eerste lid bedoelde eisen betreffen onder meer:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132g
  - number: 132g.2.a
    text: de aanwezigheid van een mandaat namens de producent te mogen optreden;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132g
  - number: 132g.2.b
    text: |-
      de aanwezigheid van een typegoedkeuring of een afschrift daarvan, afgegeven door de Dienst Wegverkeer van het door
      of namens de aanvrager geproduceerd alcoholslot;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132g
  - number: 132g.2.c
    text: |-
      de aanwezigheid van een productieproces dat op basis van [artikel 132e, eerste of vijfde lid][ref1], door de Dienst
      Wegverkeer is goedgekeurd;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132e
        hoofdstuk: VI
        paragraaf: '4'
        afdeling: '9'
  - number: 132g.2.d
    text: |-
      het beschikken over een netwerk van werkplaatsen met een erkenning als bedoeld in [artikel 132k][ref1], waar
      het inbouwen, het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen of het verwijderen van
      alcoholsloten, alsmede de daarmee samenhangende werkzaamheden kunnen plaatsvinden. Dit netwerk dient een landelijke
      spreiding te hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132g.2.e
    text: de administratieve organisatie van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132g
  - number: 132g.2.f
    text: |-
      de wijze waarop de aanvrager ervoor zorg draagt dat de personen die de in [artikel 132k, eerste lid][ref1],
      bedoelde werkzaamheden verrichten of gaan verrichten, adequaat zijn opgeleid en periodiek worden bijgeschoold over
      de laatste ontwikkelingen, en dat ten bewijze hiervan een bewijs wordt afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132g.2.g
    text: |-
      andere instrumenten en hulpmiddelen die nodig zijn voor of gebruikt worden bij de uitvoering van de werkzaamheden
      als bedoeld in [artikel 132k, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132g.2.h
    text: |-
      de maatregelen die zullen worden getroffen voor het geval de erkenning geheel wordt ingetrokken op het terrein
      van de beschikbaarstelling van gegevens betreffende het alcoholslot vereist voor het uitlezen, het testen,
      het kalibreren, het onderhouden of het verwijderen van alcoholsloten, alsmede voor de daarmee samenhangende
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132g
  - number: 132g.3
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de aanvraag van de erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132g
  - number: 132g.4
    text: |-
      De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning is ingetrokken op grond van
      [artikel 132i, tweede lid][ref1], binnen een direct aan de datum van indiening van de aanvraag voorafgaande periode
      van twaalf weken, dan wel zes maanden ingeval reeds twee of meermalen een dergelijke aan de aanvrager verleende
      erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132i
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132i
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132h.1
    text: |-
      Met het toezicht op de naleving van de uit de erkenning, bedoeld in [artikel 132f][ref1], voortvloeiende
      verplichtingen zijn belast de bij besluit van de Dienst Wegverkeer aangewezen ambtenaren. Van een zodanig besluit
      wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132h.2
    text: |-
      Tot het in het eerste lid bedoelde toezicht kan behoren het periodiek controleren van de organisatie van
      de erkenninghouder, alsmede het uitvoeren van steekproeven op de wijze waarop de erkenninghouder de in
      [artikel 132f, eerste lid][ref1], bedoelde taken uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132h.3
    text: |-
      De erkenninghouder is gehouden tot betaling, op door de Dienst Wegverkeer vastgestelde wijze, van het door deze
      dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132h
  - number: 132h.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop het toezicht wordt
      gehouden en de wijze waarop de steekproef wordt georganiseerd. Deze regels kunnen inhouden dat een verscherpt
      toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit de erkenning voortvloeiende
      de verplichtingen en op welke wijze dat verscherpte toezicht dan plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132h
  - number: 132h.5
    text: |-
      De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie. In dat
      geval wordt de kennisgeving na daartoe strekkend verzoek van de belanghebbende in een beschikking vastgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132h
  - number: 132i.1
    text: |-
      De Dienst Wegverkeer trekt de erkenning, bedoeld in [artikel 132f, eerste lid][ref1], in indien degene aan wie de
      erkenning is verleend, daarom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132i.2
    text: |-
      De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend niet
      meer voldoet aan de voor de erkenning gestelde eisen of voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132i
  - number: 132i.3
    text: |-
      De Dienst Wegverkeer kan in een geval als bedoeld in het tweede lid een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132i
  - number: 132i.4
    text: |-
      In geval van schorsing van de erkenning stelt degene van wie de erkenning wordt geschorst in de bij ministeriële
      regeling aangegeven gevallen onverwijld de vereiste informatie en instrumenten benodigd voor het uitlezen, het
      testen, het kalibreren, het onderhouden en het verwijderen van de in [artikel 132f, eerste lid][ref1], bedoelde
      alcoholsloten ter beschikking van de Dienst Wegverkeer, alsmede de daartoe door de Dienst Wegverkeer aangewezen
      instantie of instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132i.5
    text: |-
      Degene van wie de erkenning wordt ingetrokken stelt onverwijld de vereiste informatie en instrumenten
      benodigd voor het uitlezen, het testen, het kalibreren, het onderhouden en het verwijderen van de in
      [artikel 132f, eerste lid][ref1], bedoelde alcoholsloten ter beschikking van de Dienst Wegverkeer, alsmede de
      daartoe door de Dienst Wegverkeer aangewezen instantie of instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132i.6
    text: De Dienst Wegverkeer stelt onverwijld het CBR in kennis van een opgelegde schorsing of een ingetrokken erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132i
  - number: 132i.7
    text: |-
      De Dienst Wegverkeer kan in de door de dienst vastgestelde gevallen de keuringsinstelling, bedoeld in
      [artikel 132e, eerste lid][ref1], in kennis stellen van een opgelegde schorsing of een ingetrokken erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132e
        hoofdstuk: VI
        paragraaf: '4'
        afdeling: '9'
  - number: 132i.8
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het eerste en tweede lid, bepalen dat een wachttijd geldt voor
      het aanvragen van een erkenning van maximaal 30 maanden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132i
  - number: 132i.9
    text: Bij ministeriële regeling kunnen nadere regels worden vastgesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132i
  - number: 132j
    text: |-
      Het is eenieder aan wie niet een erkenning als bedoeld in [artikel 132f][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132j
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132k.1
    text: |-
      De Dienst Wegverkeer kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze
      gerechtigd is tot het inbouwen, het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen
      en het verwijderen van in [artikel 132f, eerste lid][ref1], bedoelde alcoholsloten, alsmede de daarmee
      samenhangende werkzaamheden. Bij de aanvraag van de in dit lid bedoelde erkenning kan in afwijking van
      [artikel 132l, tweede lid, onderdeel a][ref2], worden volstaan met een contract, dat is afgesloten met een
      natuurlijke persoon of rechtspersoon die een aanvraag als bedoeld in [artikel 132g, eerste lid][ref3], heeft
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132l
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel132g
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132k
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132l
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 132g
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132k.2
    text: |-
      Aan de erkenning kunnen bij ministeriële regeling aangewezen bevoegdheden worden verbonden. Een zodanige
      bevoegdheid maakt deel uit van de erkenning. Het in de [artikelen 132l tot en met 132o][ref1] ten aanzien van
      erkenningen bepaalde is van overeenkomstige toepassing op bedoelde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132l
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132k
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132l
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132k.3
    text: De erkenning kan worden verleend voor bepaalde of onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132k
  - number: 132k.4
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gesteld die aan een erkenning worden verbonden en kunnen met
      betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132k
  - number: 132l.1
    text: |-
      De erkenning wordt door de Dienst Wegverkeer op aanvraag en tegen betaling, op de door de dienst vastgestelde
      wijze, van het daarvoor door deze dienst vastgestelde tarief verleend indien de natuurlijke persoon of
      rechtspersoon voldoet aan de bij ministeriële regeling vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132l
  - number: 132l.2
    text: 'De in het eerste lid bedoelde eisen betreffen onder meer:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132l
  - number: 132l.2.a
    text: |-
      het contract dat is afgesloten met de erkenninghouder, bedoeld in [artikel 132f, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132l.2.b
    text: de administratieve organisatie van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132l
  - number: 132l.2.c
    text: het proces volgens hetwelk de aanvrager zijn werkzaamheden verricht;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132l
  - number: 132l.2.d
    text: |-
      de eisen waaraan de werkplaats of werkplaatsen van de aanvrager dient of dienen te voldoen, eisen ten aanzien van
      datacommunicatie hieronder begrepen;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132l
  - number: 132l.2.e
    text: |-
      de wijze waarop de aanvrager er voor zorg draagt dat de personen die door hem belast zijn met het inbouwen,
      het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen of het verwijderen van alcoholsloten,
      alsmede de daarmee samenhangende werkzaamheden, adequaat zijn opgeleid en worden geïnformeerd over de laatste
      ontwikkelingen;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132l
  - number: 132l.2.f
    text: |-
      de beschikbaarheid van een persoon of personen, die in het bezit is of zijn van een tegen betaling
      van een door de Dienst Wegverkeer vastgesteld tarief door die dienst afgegeven bewijs dat zij de in
      [artikel 132k, eerste lid][ref1], bedoelde werkzaamheden mogen verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132l.2.g
    text: |-
      de aan- en afmelding bij de Dienst Wegverkeer van de personen die bevoegd zijn tot het inbouwen, het uitlezen,
      het testen, het kalibreren, het onderhouden, het vervangen of het verwijderen van alcoholsloten, en de daarmee
      samenhangende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132l
  - number: 132l.3
    text: |-
      De bij ministeriële regeling gestelde eisen, bedoeld in het eerste lid, kunnen betrekking hebben op de op de voor
      de werkzaamheden benodigde apparatuur.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132l
  - number: 132l.4
    text: |-
      Bij het inbouwen, het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen of het verwijderen van
      het alcoholslot worden de bij of krachtens algemene maatregel van bestuur aangegeven gegevens vastgelegd in het in
      [artikel 129a][ref1] bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel129a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 129a
        hoofdstuk: VI
        afdeling: 8a
  - number: 132l.5
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de aanvraag van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132l
  - number: 132l.6
    text: |-
      De erkenning wordt geweigerd indien een reeds aan de aanvrager verleende erkenning is ingetrokken op grond van
      [artikel 132n, tweede lid][ref1], is ingetrokken binnen een direct aan de datum van indiening van de aanvraag
      voorafgaande periode van twaalf weken, dan wel zes maanden ingeval reeds twee of meermalen een dergelijke aan de
      aanvrager verleende erkenning is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132n
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132n
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132m.1
    text: |-
      Met het toezicht op de naleving van de uit de erkenning, bedoeld in [artikel 132k, eerste lid][ref1],
      voortvloeiende verplichtingen zijn belast de bij besluit van de Dienst Wegverkeer aangewezen ambtenaren. Van een
      zodanig besluit wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132m
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132m.2
    text: |-
      Tot het in het eerste lid bedoelde toezicht kan behoren het periodiek controleren van de organisatie van de
      erkenninghouder, alsmede het uitvoeren van steekproeven op de wijze waarop de erkenninghouder, alsmede de bij
      hem in dienst zijnde personen die overeenkomstig [artikel 132l][ref1] zijn belast met de uitvoering van de
      werkzaamheden als bedoeld in [artikel 132k, eerste lid][ref2], die taken uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132l
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132m
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132l
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132m.3
    text: |-
      De eigenaar of houder van een motorrijtuig dat voorwerp is van het in het tweede lid bedoelde toezicht is verplicht
      het motorrijtuig beschikbaar te houden op de plaats waar de in het eerste lid bedoelde werkzaamheden worden
      uitgevoerd. Deze verplichting geldt tot ten hoogste 90 minuten nadat de erkenninghouder de daarvoor in aanmerking
      komende gegevens heeft geregistreerd in het in [artikel 129a][ref1] bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel129a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132m
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 129a
        hoofdstuk: VI
        afdeling: 8a
  - number: 132m.4
    text: |-
      Het derde lid en het zesde lid, eerste volzin, zijn van overeenkomstige toepassing in geval het toezicht door de
      Dienst Wegverkeer plaatsvindt op grond van [artikel 158][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel158
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132m
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '158'
        hoofdstuk: IX
  - number: 132m.5
    text: |-
      De erkenninghouder is gehouden tot betaling, op door de Dienst Wegverkeer vastgestelde wijze, van het door deze
      dienst ter zake van de kosten van het toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132m
  - number: 132m.6
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld betreffende de wijze waarop het toezicht wordt
      gehouden en de wijze waarop de steekproef wordt georganiseerd. Deze regels kunnen inhouden dat een verscherpt
      toezicht wordt gehouden indien blijkt dat wordt gehandeld in strijd met een of meer uit de erkenning voortvloeiende
      de verplichtingen en op welke wijze dat verscherpte toezicht dan plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132m
  - number: 132m.7
    text: |-
      De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie. In dat
      geval wordt de kennisgeving na daartoe strekkend verzoek van de belanghebbende in een beschikking vastgelegd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132m
  - number: 132n.1
    text: |-
      De Dienst Wegverkeer trekt een erkenning als bedoeld in [artikel 132k][ref1], eerste lid in:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132n
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132n.1.a
    text: indien degene aan wie de erkenning is verleend, daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132n
  - number: 132n.1.b
    text: |-
      indien de erkenning, bedoeld in [artikel 132f, eerste lid][ref1], wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132n
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132n.2
    text: |-
      De Dienst Wegverkeer kan een erkenning intrekken of wijzigen indien degene aan wie de erkenning is verleend niet
      meer voldoet aan de aan de erkenning gestelde eisen of voorschriften.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132n
  - number: 132n.3
    text: |-
      De Dienst Wegverkeer kan in een geval als bedoeld in het tweede lid een erkenning schorsen voor een door hem
      daarbij vast te stellen termijn die ten hoogste twaalf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132n
  - number: 132n.4
    text: |-
      Bij de schorsing of de intrekking van de erkenning in de gevallen, bedoeld in het eerste lid, onderdeel a, en
      het tweede lid, worden de lopende verplichtingen van de erkenninghouder betreffende het uitlezen, het testen,
      het kalibreren, het onderhouden en het verwijderen van het alcoholslot, alsmede de daarmee samenhangende
      informatieverplichtingen, voortvloeiend uit het bij of krachtens deze wet bepaalde, verricht door een door
      erkenninghouder als bedoeld in [artikel 132f, eerste lid][ref1], te bepalen natuurlijke persoon of rechtspersoon of
      instantie die beschikt over de in [artikel 132k, eerste lid][ref2], bedoelde erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132n
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132n.5
    text: |-
      Bij intrekking van de erkenning, bedoeld in [artikel 132f, eerste lid][ref1], worden de lopende verplichtingen
      van de erkenninghouder betreffende het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen en
      het verwijderen van het alcoholslot, alsmede de daarmee samenhangende informatieverplichtingen, voortvloeiend uit
      het bij of krachtens deze wet bepaalde verricht door een daartoe door de Dienst Wegverkeer aangewezen instantie of
      instanties. [Artikel 132i, vijfde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132i
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132n
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132i
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: 132n.6
    text: |-
      De Dienst Wegverkeer kan in de door de dienst vastgestelde gevallen de in [artikel 132e][ref1] bedoelde
      keuringsinstelling in kennis stellen van een opgelegde schorsing of een ingetrokken erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132n
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132e
        hoofdstuk: VI
        paragraaf: '4'
        afdeling: '9'
  - number: 132n.7
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het eerste en tweede lid, bepalen dat een wachttijd geldt voor
      het aanvragen van een erkenning van maximaal 30 maanden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132n
  - number: 132n.8
    text: Bij ministeriële regeling kunnen nadere regels worden vastgesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132n
  - number: 132o
    text: |-
      Het is eenieder aan wie niet een erkenning als bedoeld in [artikel 132k][ref1] is verleend, verboden zich op
      zodanige wijze te gedragen, dat daardoor bij het publiek de indruk kan worden gewekt, dat zodanige erkenning aan
      hem is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel132o
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
        hoofdstuk: VI
        paragraaf: '5'
        afdeling: '9'
  - number: '133.1'
    text: |-
      In de in [artikel 131, eerste lid, aanhef en onderdeel c][ref1], bedoelde gevallen legt het CBR bij het in
      dat artikel bedoelde besluit betrokkene de verplichting op zich te onderwerpen aan een onderzoek naar zijn
      rijvaardigheid of geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: '133.2'
    text: |-
      Het CBR bepaalt de aard van het onderzoek en bepaalt door welke deskundige of deskundigen het onderzoek zal worden
      verricht.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel133
  - number: '133.3'
    text: |-
      Het onderzoek kan in gedeelten plaatsvinden. Tijd en plaats van het onderzoek dan wel de delen daarvan worden
      overeenkomstig bij algemene maatregel van bestuur vastgestelde regels door het CBR vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel133
  - number: '133.4'
    text: |-
      De kosten verbonden aan het opleggen van een onderzoek naar de rijvaardigheid of de geschiktheid komen ten
      laste van iedereen aan wie overeenkomstig het eerste lid de verplichting tot deelname aan zo’n onderzoek is
      opgelegd. De hoogte van deze kosten wordt door het CBR vastgesteld. In geval van niet, niet geheel of niet op
      aangegeven wijze of binnen de aangegeven termijnen betalen van deze kosten vaardigt het CBR een dwangbevel uit
      aan de nalatige. Voor de toepassing van [titel 4.4. van de Algemene wet bestuursrecht][ref1] wordt het besluit
      als bedoeld in [artikel 131, eerste lid, aanhef en onderdeel b][ref2], aangemerkt als beschikking als bedoeld in
      [artikel 4.86 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel131
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '133.5'
    text: |-
      De kosten verbonden aan de uitvoering van het onderzoek, waarvan de hoogte door het CBR wordt vastgesteld, komen in
      de bij ministeriële regeling bedoelde gevallen ten laste van betrokkene.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel133
  - number: '133.6'
    text: Het onderzoek vangt zo spoedig mogelijk aan.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel133
  - number: '133.7'
    text: |-
      De bevindingen van het onderzoek worden door de deskundige of de deskundigen zo spoedig mogelijk, doch uiterlijk
      acht weken na aanvang van het onderzoek, dan wel van het eerste gedeelte daarvan, schriftelijk meegedeeld aan het
      CBR.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel133
  - number: '133.8'
    text: |-
      Het CBR kan in bijzondere gevallen toestaan dat door de deskundige of de deskundigen van de in het zesde lid
      bedoelde termijn wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel133
  - number: '134.1'
    text: |-
      Het CBR stelt zo spoedig mogelijk, doch uiterlijk binnen vier weken na ontvangst van de bevindingen van de
      deskundige of deskundigen, de uitslag van het onderzoek vast. Van deze uitslag doet het CBR mededeling aan
      betrokkene. Indien een of meer deskundigen bij hun bevindingen hebben aangetekend dat inzage daarvan naar hun
      oordeel kennelijk ernstig nadeel voor betrokkene zou opleveren, deelt het CBR de bevindingen schriftelijk mede aan
      de door betrokkene aangewezen vertrouwensarts.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel134
  - number: '134.2'
    text: |-
      Het CBR besluit tot ongeldigverklaring van het rijbewijs indien de uitslag van het onderzoek daartoe aanleiding
      geeft. Bij ministeriële regeling worden de gevallen aangewezen waarin daarvan sprake is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel134
  - number: '134.3'
    text: |-
      Indien het CBR voornemens is het rijbewijs ongeldig te verklaren, deelt het dit mede aan de houder, tevens onder
      mededeling van de bevoegdheid van betrokkene om binnen twee weken een tweede onderzoek te verlangen. De aan
      dit tweede onderzoek verbonden kosten, waarvan de hoogte door het CBR wordt vastgesteld, komen ten laste van
      betrokkene. De [artikelen 132][ref1] en [133][ref2] alsmede het eerste en het vierde lid van dit artikel zijn van
      overeenkomstige toepassing. De in de eerste volzin bedoelde mededeling wordt niet gedaan, indien het rijbewijs van
      de houder inmiddels op grond van [artikel 123b][ref3] ongeldig is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel133
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '133'
        hoofdstuk: VI
        paragraaf: '6'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 123b
        hoofdstuk: VI
        afdeling: '7'
  - number: '134.4'
    text: |-
      Indien het CBR besluit dat het rijbewijs van de houder ongeldig wordt verklaard, wordt daarbij bepaald op welk
      deel van de geldigheidsduur alsmede op welke categorie of categorieën van motorrijtuigen waarvoor het rijbewijs
      is afgegeven de ongeldigverklaring betrekking heeft. [Artikel 132, vierde tot en met zevende lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: '134.5'
    text: |-
      Indien de uitslag van het onderzoek aanleiding geeft tot ongeldigverklaring van het rijbewijs van betrokkene,
      plaatst het CBR, indien dat rijbewijs zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur,
      een aantekening in het rijbewijzenregister waaruit blijkt dat de houder bij de aanvraag van een nieuw rijbewijs op
      de bij algemene maatregel van bestuur vastgestelde wijze dient aan te tonen dat hij, al naar gelang de aard van het
      onderzoek, beschikt over de lichamelijke en geestelijke geschiktheid dan wel de rijvaardigheid die is vereist voor
      het besturen van motorrijtuigen van de categorie of categorieën waarop het onderzoek betrekking had.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel134
  - number: '134.6'
    text: |-
      Indien bij een op grond van het in [artikel 131, eerste lid][ref1], bedoelde besluit gevorderd onderzoek naar de
      geschiktheid is gebleken dat de resterende geldigheidsduur van het rijbewijs korter is dan de termijn waarvoor
      de houder blijkens de uitslag van het onderzoek naar verwachting geschikt zal zijn voor het besturen van
      motorrijtuigen, plaatst het CBR een aantekening in het rijbewijzenregister waaruit blijkt dat de houder bij de
      aanvraag van een nieuw rijbewijs op de bij algemene maatregel van bestuur vastgestelde wijze dient aan te tonen dat
      hij beschikt over de lichamelijke en geestelijke geschiktheid die is vereist voor het besturen van motorrijtuigen
      van de categorie of categorieën waarop het onderzoek betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
  - number: '134.7'
    text: |-
      Indien het CBR van oordeel is dat op grond van de uitslag van het onderzoek betrokkene niet als niet rijvaardig
      of ongeschikt moet worden beoordeeld, legt het aan betrokkene overeenkomstig bij algemene maatregel van
      bestuur vastgestelde regels een bij ministeriële regeling vast te stellen maatregel op. Indien het CBR besluit
      tot oplegging van de educatieve maatregel gedrag en verkeer zijn de [artikelen 132][ref1] en [132a][ref2]
      van overeenkomstige toepassing. In het geval van oplegging van de verplichting tot deelname aan het
      alcoholslotprogramma zijn de [artikelen 132b tot en met 132o][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel132b
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132a
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 132b
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '9'
  - number: '134.8'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld ter uitvoering van het derde, het vierde en het zevende
      lid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel134
  - number: '134.9'
    text: |-
      Voor de toepassing van dit artikel wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door het daartoe
      bevoegde gezag buiten Nederland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel134
  - number: 134a
    text: |-
      Voor zover dit noodzakelijk is voor de toepassing van deze paragraaf verwerkt het CBR persoonsgegevens betreffende
      iemands rijvaardigheid en gezondheid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel134a
  - number: 145a.1
    text: 'In dit hoofdstuk wordt verstaan onder de richtlijn: de bij ministeriële regeling aangewezen richtlijn.'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel145a
  - number: 145a.2
    text: |-
      Een wijziging van de richtlijn, bedoeld in het eerste lid, gaat voor de toepassing van dit hoofdstuk gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel145a
  - number: 145b.1
    text: |-
      Een elektronisch heffingssysteem als bedoeld in artikel 2, eerste lid, van de richtlijn, dat na 31 december 2006
      in gebruik wordt genomen, is gebaseerd op één of meer van de technologieën, bedoeld in artikel 2, eerste lid, van
      de richtlijn.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel145b
  - number: 145b.2
    text: Het eerste lid geldt niet voor een heffingssysteem als bedoeld in artikel 1, tweede lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel145b
  - number: 145c.1
    text: |-
      Op een weg waar tarieven voor het gebruik van de weg elektronisch worden geïnd en waarvoor apparatuur in het
      motorrijtuig moet worden ingebouwd, wordt een Europese elektronische tolheffingsdienst aangeboden, die voldoet aan
      de artikelen 1, derde lid, 3, eerste lid en 4, eerste, derde en achtste lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel145c
  - number: 145c.2
    text: |-
      Een Europese elektronische tolheffingssdienst wordt aangeboden uiterlijk met ingang van een bij ministeriële
      regeling te bepalen tijdstip, dat voor verschillende categorieën voertuigen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel145c
  - number: 145d
    text: |-
      Een exploitant stelt vanaf het in [artikel 145c, tweede lid][ref1], vastgestelde tijdstip aan gebruikers apparatuur
      ter beschikking die in het voertuig kan worden ingebouwd en voldoet aan de eisen, bedoeld in artikel 2, tweede lid,
      van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel145c
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel145d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 145c
        hoofdstuk: VIA
        paragraaf: '3'
  - number: 145e
    text: |-
      Bij ministeriële regeling kunnen ter uitvoering van de richtlijn aanvullende regels worden gesteld met betrekking
      tot de in dit hoofdstuk geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel145e
  - number: 145f.1
    text: 'In dit hoofdstuk wordt verstaan onder de richtlijn: de bij ministeriële regeling aangewezen richtlijn.'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel145f
  - number: 145f.2
    text: |-
      Een wijziging van een in het eerste lid bedoelde richtlijn, gaat voor de toepassing van dit hoofdstuk gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel145f
  - number: 145g.1
    text: |-
      Intelligente vervoerssystemen als bedoeld in de richtlijn voldoen aan de op grond van de richtlijn vastgestelde
      specificaties.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel145g
  - number: 145g.2
    text: Bij ministeriele regeling kunnen ter uitvoering van de richtlijn aanvullende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel145g
  - number: '146'
    text: |-
      Onze Minister kan, met inachtneming van verdragen en van besluiten van volkenrechtelijke organisaties of van één of
      meer instellingen van de Europese Unie, al dan niet gezamenlijk, van bepalingen van deze wet vrijstelling verlenen
      voor het gebruik van de weg ten behoeve van openbare diensten.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel146
  - number: '147.1'
    text: |-
      Onze Minister kan, met inachtneming van verdragen en van besluiten van volkenrechtelijke organisaties of van één of
      meer instellingen van de Europese Unie, al dan niet gezamenlijk, van het bepaalde krachtens deze wet vrijstelling
      verlenen voor het gebruik van de weg ten behoeve van openbare of door Onze Minister daarmee gelijk te stellen
      diensten.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel147
  - number: '147.2'
    text: |-
      Onze Minister kan van het bepaalde krachtens deze wet vrijstelling verlenen voor het gebruik van de weg ten
      behoeve van particuliere geld- en waardetransportbedrijven waaraan een vergunning is verleend als bedoeld in
      [artikel 3, aanhef en onder c, van de Wet particuliere beveiligingsorganisaties en recherchebureaus][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel3
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '3'
  - number: '148.1'
    text: |-
      Van het in [artikel 10, eerste lid][ref1], vervatte verbod kan overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels ontheffing worden verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel10
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '10'
        hoofdstuk: II
        paragraaf: '1'
  - number: 148.1.a
    text: voor wegen onder beheer van het Rijk door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel148
  - number: 148.1.b
    text: |-
      voor andere wegen door gedeputeerde staten. In afwijking hiervan wordt, indien de wegen waarvoor de ontheffing
      wordt gevraagd, alle zijn gelegen binnen één gemeente, de ontheffing verleend door burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel148
  - number: '148.2'
    text: |-
      De in het eerste lid bedoelde ontheffing kan slechts worden verleend indien wordt aangetoond dat maatregelen zijn
      getroffen ter voorkoming van deelneming aan de wedstrijd zonder dat de burgerrechtelijke aansprakelijkheid voor
      de schade waartoe het gebruik van motorrijtuigen tijdens de wedstrijd aanleiding kan geven, is gedekt door een
      verzekering overeenkomstig de [Wet aansprakelijkheidsverzekering motorrijtuigen][ref1]. De verzekering dient mede
      te dekken de aansprakelijkheid van degenen die de wedstrijd organiseren. Deze voorwaarde geldt niet ten aanzien van
      degene wiens aansprakelijkheid ten laste van de Staat komt.


      [ref1]: https://wetten.overheid.nl/BWBR0002415
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0002415
  - number: '149.1'
    text: |-
      Van het bepaalde krachtens deze wet kan in de krachtens deze wet aangewezen gevallen overeenkomstig krachtens deze
      wet vastgestelde regels ontheffing worden verleend:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149
  - number: 149.1.a
    text: voor wegen onder beheer van het Rijk door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149
  - number: 149.1.b
    text: voor wegen onder beheer van een provincie door gedeputeerde staten;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149
  - number: 149.1.c
    text: |-
      voor wegen onder beheer van een waterschap door het algemeen bestuur of, krachtens besluit van het algemeen
      bestuur, door het dagelijks bestuur;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149
  - number: 149.1.d
    text: |-
      voor andere wegen door burgemeester en wethouders of krachtens besluit van hen, door een door hen ingestelde
      bestuurscommissie.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149
  - number: '149.2'
    text: |-
      In afwijking van het eerste lid kan door het CBR ontheffing worden verleend van het gebruik van autogordels en
      kinderbeveiligingsmiddelen. Bij of krachtens algemene maatregel van bestuur kunnen terzake nadere regels worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149
  - number: '149.3'
    text: |-
      Het op grond van het eerste lid tot het verlenen van een ontheffing bevoegde gezag kan van de kentekenplicht als
      bedoeld in [artikel 36, eerste lid][ref1], ontheffing verlenen voor aanhangwagens die worden gebruikt ten behoeve
      van een evenement of optocht waarvoor een vergunning op grond van een gemeentelijke verordening is afgegeven. Bij
      ministeriële regeling kunnen terzake nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 149a.1
    text: |-
      In dit artikel, [artikel 149b][ref1] en de op deze artikelen berustende bepalingen wordt verstaan onder
      wegbeheerder: het ingevolge [artikel 149, eerste lid][ref2], tot het verlenen van een ontheffing bevoegde gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149b
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel149
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149b
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '149'
        hoofdstuk: VII
  - number: 149a.2
    text: |-
      In afwijking van [artikel 149, eerste lid][ref1], kan uitsluitend door de Dienst Wegverkeer ontheffing worden
      verleend of geweigerd van het bepaalde krachtens [artikel 13][ref2] en [artikel 71][ref3], in de bij algemene
      maatregel van bestuur aangewezen gevallen overeenkomstig bij of krachtens algemene maatregel van bestuur
      vastgestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel71
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '149'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '13'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '71'
        hoofdstuk: V
        paragraaf: '1'
  - number: 149a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de partijen waarmee en de
      wijze waarop de Dienst Wegverkeer periodiek overleg voert met betrekking tot de uitvoering van dit artikel en
      [artikel 149b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149b
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149b
        hoofdstuk: VII
  - number: 149a.4
    text: |-
      De kosten die samenhangen met de behandeling van de aanvraag en de verlening van de ontheffing, alsmede de
      kosten die samenhangen met het verrichten van onderzoeken en met daarbij behorende afgifte van documenten
      ten behoeve van de ontheffingverlening worden ten laste gebracht van de aanvrager. Bij de toepassing van
      [artikel 4b, eerste lid, onderdeel n][ref1], met betrekking tot deze kosten kan worden bepaald dat de vergoeding
      van de kosten voorafgaand aan de behandeling van de aanvraag wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4b
        hoofdstuk: IA
        paragraaf: '2'
  - number: 149a.5
    text: |-
      Ten behoeve van de ontheffingverlening, bedoeld in het tweede lid, verwerkt de Dienst Wegverkeer gegevens met
      betrekking tot aanvrager, voertuig en kenteken die zijn opgenomen in de aanvragen voor ontheffingen en in afgegeven
      ontheffingen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149a
  - number: 149a.6
    text: |-
      Aan de toezichthouders bedoeld in [artikel 158][ref1] en aan de wegbeheerders worden op de door de Dienst
      Wegverkeer te bepalen wijze desgevraagd de gegevens met betrekking tot de inhoud van de afgegeven en geweigerde
      ontheffingen en de gegevens met betrekking tot het aantal en de aard van de ontheffingen verstrekt, die zij voor de
      uitoefening van hun taak behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel158
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '158'
        hoofdstuk: IX
  - number: 149b.1
    text: |-
      De wegbeheerder verstrekt aan de Dienst Wegverkeer ten behoeve van de ontheffingverlening, bedoeld in
      [artikel 149a, tweede lid][ref1], de bij of krachtens algemene maatregel van bestuur vastgestelde gegevens
      betreffende de infrastructuur en overige informatie op de bij of krachtens die algemene maatregel van bestuur
      vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149a
        hoofdstuk: VII
  - number: 149b.2
    text: |-
      In de bij of krachtens algemene maatregel van bestuur aangewezen gevallen behoeft de Dienst Wegverkeer voor de in
      [artikel 149a, tweede lid][ref1], bedoelde ontheffing de toestemming van de wegbeheerder. In deze gevallen wordt de
      toestemming verleend op basis van een door de Dienst Wegverkeer in overleg met de betrokken wegbeheerder opgestelde
      ontwerp-ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149a
        hoofdstuk: VII
  - number: 149b.3
    text: |-
      De wegbeheerder kan uitsluitend de toestemming weigeren, indien dat gerechtvaardigd is met het oog op de in
      [artikel 2, eerste en tweede lid][ref1], omschreven belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: 149b.4
    text: |-
      Bij het verstrekken van gegevens en informatie, bedoeld in het eerste lid, kan de wegbeheerder aangeven dat aan
      de door de Dienst Wegverkeer te verlenen ontheffing beperkingen of voorschriften worden verbonden, indien dat
      gerechtvaardigd is met het oog op de bescherming van de in [artikel 2, eerste en tweede lid][ref1], omschreven
      belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
        hoofdstuk: '1'
  - number: 149b.5
    text: |-
      De Dienst Wegverkeer trekt verleende ontheffingen in of wijzigt deze voorzover de door de wegbeheerder ingevolge
      het eerste lid verstrekte gegevens of andere door hem aan de Dienst Wegverkeer verstrekte informatie daartoe
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149b
  - number: 149b.6
    text: |-
      Voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] worden als
      één besluit aangemerkt de ontheffing of de weigering daarvan door de Dienst Wegverkeer en de toestemming
      onderscheidenlijk de weigering daarvan door de wegbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: 149b.7
    text: |-
      De wegbeheerder ontvangt voor het verstrekken van gegevens en informatie, bedoeld in het eerste lid, en voor
      het verlenen van toestemming, bedoeld in het tweede lid, van de Dienst Wegverkeer een bij ministeriële regeling
      vastgestelde vergoeding, die is gebaseerd op het aantal en de aard van de verleende ontheffingen voor wegen die
      onder zijn beheer staan.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149b
  - number: 149c
    text: |-
      In afwijking van [artikel 149, eerste lid][ref1], kan uitsluitend door Onze Minister ontheffing worden verleend
      of geweigerd van het bepaalde krachtens [artikel 16, vierde lid][ref2], overeenkomstig bij of krachtens algemene
      maatregel van bestuur vastgestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel16
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel149c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '149'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
  - number: '150.1'
    text: |-
      Een vrijstelling of ontheffing kan onder beperkingen worden verleend. Aan een vrijstelling of ontheffing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel150
  - number: '150.2'
    text: Het is verboden te handelen in strijd met de aan een vrijstelling of ontheffing verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel150
  - number: '151'
    text: |-
      Onverminderd [artikel 149a][ref1] kunnen bij algemene maatregel van bestuur regels worden vastgesteld omtrent het
      ten laste van de aanvrager van een ontheffing brengen van de aan de behandeling van de aanvraag verbonden kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149a
        hoofdstuk: VII
  - number: 151a
    text: |-
      Voor zover dit noodzakelijk is voor het verlenen van ontheffingen als bedoeld in
      [artikel 149, tweede lid, aanhef en onder a][ref1], verwerkt Onze Minister persoonsgegevens betreffende iemands
      gezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '149'
        hoofdstuk: VII
  - number: 151b
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151b
  - number: 151b.a
    text: 'richtlijn vakbekwaamheid bestuurders: de bij ministeriële regeling aangewezen richtlijn;'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151b
  - number: 151b.b
    text: |-
      bestuurder: degene die vervoer over de weg verricht met een voertuig dat behoort tot een categorie waarop de
      richtlijn vakbekwaamheid bestuurders van toepassing is en die:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151b
  - number: 151b.b.1°
    text: ingezetene is van een lidstaat van de Europese Unie, dan wel
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151b
  - number: 151b.b.2°
    text: |-
      ingezetene is van een land buiten de Europese Unie en werkzaam is voor een binnen de Europese Unie gevestigde
      onderneming;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151b
  - number: 151b.c
    text: |-
      basiskwalificatie: het opleidings- en kennisniveau dat de in de richtlijn vakbekwaamheid bestuurders aangewezen
      onderwerpen en praktische vaardigheden omvat;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151b
  - number: 151b.d
    text: 'getuigschrift van vakbekwaamheid: document dat dient als bewijs dat de houder de basiskwalificatie heeft behaald;'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151b
  - number: 151b.e
    text: |-
      nascholing: periodiek opleidingstraject dat in de richtlijn vakbekwaamheid bestuurders aangewezen onderwerpen en
      praktische vaardigheden omvat;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151b
  - number: 151b.f
    text: |-
      getuigschrift van nascholing: document dat dient als bewijs dat de houder de nascholing met goed gevolg heeft
      voltooid;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151b
  - number: 151b.g
    text: |-
      erkend opleidingscentrum: opleidingscentrum als bedoeld in [artikel 151f, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151f
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151f
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 151b.h
    text: |-
      gewone verblijfplaats: de verblijfplaats zoals omschreven in artikel 14, derde lid, van verordening (EEG) nr.
      3821/85 van de Raad van de Europese Gemeenschappen van 20 december 1985 betreffende het controleapparaat in het
      wegvervoer (PbEG L 370);
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151b
  - number: 151b.j
    text: |-
      verordening (EU) nr. 181/2011: Verordening (EU) nr. 181/2011 van het Europees Parlement en de Raad van
      16 februari 2011 betreffende de rechten van autobus- en touringcarpassagiers en tot wijziging van Verordening (EG)
      nr. 2006/2004 (PbEU 2011, L 55).
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151b
  - number: 151c.1
    text: |-
      Het is verboden als bestuurder op te treden zonder te beschikken over een ingevolge de richtlijn vakbekwaamheid
      bestuurders vereist geldig getuigschrift.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151c
  - number: 151c.2
    text: |-
      Het verbod in het eerste lid geldt niet voor bestuurders die in de richtlijn vakbekwaamheid bestuurders zijn
      vrijgesteld van de verplichting tot het behalen van de basiskwalificatie.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151c
  - number: 151c.3
    text: |-
      Een door de bevoegde autoriteit van een lidstaat van de Europese Unie overeenkomstig de richtlijn vakbekwaamheid
      bestuurders aan een bestuurder afgegeven rijbewijs of kwalificatiekaart bestuurder, voorzien van de in die
      richtlijn bedoelde communautaire code, geldt als een ingevolge die richtlijn vereist getuigschrift indien de code
      zijn geldigheid nog niet heeft verloren.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151c
  - number: 151c.4
    text: |-
      Een in [artikel 151b, onderdeel b, onder 2°][ref1], bedoelde bestuurder die beschikt over de volgende documenten,
      voldoet aan de ingevolge de richtlijn vakbekwaamheid bestuurders gestelde vereisten:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151b
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151b
        hoofdstuk: VIIA
        paragraaf: '1'
  - number: 151c.4.a
    text: |-
      indien hij goederenvervoer over de weg verricht: een bestuurdersattest als bedoeld in de ingevolge
      [artikel 1.1 van de Wet wegvervoer goederen][ref1] aangewezen marktverordening voor het wegvervoer;


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151c
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '1'
  - number: 151c.4.b
    text: |-
      indien hij personenvervoer over de weg verricht: een nationaal certificaat waarvan de lidstaten van de Europese
      Unie de geldigheid op hun grondgebied onderling erkennen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151c
  - number: 151d.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van de richtlijn vakbekwaamheid bestuurders
      regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151d
  - number: 151d.1.a
    text: een stelsel van basiskwalificatie;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151d
  - number: 151d.1.b
    text: een stelsel van nascholing.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151d
  - number: 151d.2
    text: 'Bij de in het eerste lid bedoelde regels kan in elk geval worden bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151d
  - number: 151d.2.a
    text: |-
      een bestuurder die het getuigschrift van vakbekwaamheid heeft behaald, bedoeld in de ingevolge
      [artikel 1.1 van de Wet wegvervoer goederen][ref1] aangewezen beroepsverordening voor het wegvervoer, is
      vrijgesteld van bij die regels bepaalde examens tot het verkrijgen van het getuigschrift van vakbekwaamheid;


      [ref1]: https://wetten.overheid.nl/BWBR0024800#Artikel1
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151d
    references:
      - id: ref1
        bwb_id: BWBR0024800
        artikel: '1'
  - number: 151d.2.b
    text: |-
      een bestuurder die kan aantonen in Nederland een opleiding van ten minste zes maanden tot het verkrijgen van een
      getuigschrift van vakbekwaamheid te volgen, op Nederlands grondgebied voor ten hoogste drie jaar is vrijgesteld van
      de verplichting over een getuigschrift van vakbekwaamheid te beschikken.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151d
  - number: 151d.3
    text: De in het eerste lid bedoelde regels kunnen mede strekken tot uitvoering van de verordening (EU) nr. 181/2011.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151d
  - number: 151e.1
    text: |-
      Toegang tot een examen gericht op het behalen van een getuigschrift van vakbekwaamheid of tot de opleiding gericht
      op het behalen van het getuigschrift van nascholing heeft degene die aan bij of krachtens algemene maatregel van
      bestuur gestelde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151e
  - number: 151e.2
    text: |-
      Voor toegang tot een examen gericht op het behalen van een getuigschrift van vakbekwaamheid is het bezit van het
      overeenkomstige rijbewijs niet vereist.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151e
  - number: 151f.1
    text: |-
      Een examen gericht op het behalen van de basiskwalificatie wordt afgelegd bij het CBR, dat onder zijn
      verantwoordelijkheid voor onderdelen van dat examen anderen kan inschakelen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151f
  - number: 151f.2
    text: Nascholing wordt georganiseerd door een door het CBR voor het verrichten van nascholing erkend opleidingscentrum.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151f
  - number: 151f.3
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151f
  - number: 151f.3.a
    text: de taken, bevoegdheden en werkwijze van het CBR;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151f
  - number: 151f.3.b
    text: de wijze waarop erkenning als opleidingscentrum geschiedt;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151f
  - number: 151f.3.c
    text: de eisen waaraan voldaan moet worden om de erkenning als opleidingscentrum te verkrijgen en te behouden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151f
  - number: 151f.4
    text: Nascholing georganiseerd door een erkend opleidingscentrum behoeft de certificering van het CBR.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151f
  - number: 151f.5
    text: |-
      De in het vierde lid bedoelde certificering vindt plaats indien de nascholing voldoet aan de bij ministeriële
      regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151f
  - number: 151g.1
    text: 'Een bestuurder behaalt de basiskwalificatie in Nederland indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151g
  - number: 151g.1.a
    text: hij ingezetene is van een lidstaat van de Europese Unie en in Nederland zijn gewone verblijfplaats heeft, of
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151g
  - number: 151g.1.b
    text: |-
      hij ingezetene is van een land buiten de Europese Unie en werkzaam is voor een in Nederland gevestigde onderneming
      of beschikt over een tewerkstellingsvergunning als bedoeld in de [Wet arbeid vreemdelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151g
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 151g.2
    text: |-
      Een bestuurder kan de nascholing in Nederland volgen indien hij in Nederland zijn gewone verblijfplaats heeft of in
      Nederland werkzaam is, dan wel in een andere lidstaat van de Europese Unie indien hij aldaar werkzaam is.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151g
  - number: 151g.3
    text: |-
      Een bestuurder die in Nederland de basiskwalificatie behaalt of de nascholing met goed gevolg voltooit en houder
      is van een Nederlands rijbewijs ontvangt het daarbij behorende getuigschrift van vakbekwaamheid dan wel het
      getuigschrift van nascholing in de vorm van vermelding van de in de richtlijn vakbekwaamheid bestuurders bedoelde
      communautaire code naast de overeenkomstige rijbewijscategorieën op het rijbewijs.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151g
  - number: 151g.4
    text: |-
      Een bestuurder die in Nederland de basiskwalificatie behaalt of de nascholing met goed gevolg voltooit en op dat
      moment geen houder is van een in Nederland afgegeven geldig rijbewijs ontvangt als bewijs daarvan een certificaat,
      met een geldigheidsduur gelijk aan die van een getuigschrift van vakbekwaamheid onderscheidenlijk een getuigschrift
      van nascholing, dat hij kan gebruiken om bij een bevoegde autoriteit van een lidstaat van de Europese Unie een
      verzoek in te dienen om op een door die lidstaat aan de desbetreffende bestuurder afgegeven of nog af te geven
      rijbewijs of kwalificatiekaart bestuurder de in de richtlijn vakbekwaamheid bestuurders bedoelde communautaire code
      te vermelden.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151g
  - number: 151g.5
    text: |-
      Op een bij of krachtens algemene maatregel van bestuur te bepalen wijze wordt door het CBR in het in
      [artikel 126][ref1] bedoelde register geregistreerd dat een bestuurder die houder is van een Nederlands rijbewijs
      de basiskwalificatie heeft behaald onderscheidenlijk met goed gevolg de nascholing heeft voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '126'
        hoofdstuk: VI
        afdeling: '8'
  - number: 151g.6
    text: |-
      Een erkend opleidingscentrum meldt op een bij of krachtens algemene maatregel van bestuur te bepalen wijze aan het
      CBR welke onderdelen van de nascholing een bestuurder met goed gevolg heeft voltooid.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151g
  - number: 151g.7
    text: |-
      Een in het derde lid bedoeld getuigschrift wordt afgegeven door het CBR en uitgereikt door degene die belast is met
      de afgifte van rijbewijzen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151g
  - number: 151g.8
    text: |-
      Het in het vierde lid bedoelde certificaat wordt afgegeven en uitgereikt door het CBR en door deze instantie
      geregistreerd in het in [artikel 126][ref1] bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '126'
        hoofdstuk: VI
        afdeling: '8'
  - number: 151h
    text: 'Bij ministeriële regeling kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151h
  - number: 151h.a
    text: de vermelding op het rijbewijs van de communautaire code, bedoeld in de richtlijn vakbekwaamheid bestuurders;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151h
  - number: 151h.b
    text: |-
      het in overeenstemming met de richtlijn vakbekwaamheid bestuurders vastgestelde tijdschema dat een bestuurder moet
      volgen bij de nascholing;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151h
  - number: 151h.c
    text: |-
      de certificering bedoeld in [artikel 151f, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151f
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151f
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 151h.d
    text: |-
      het model voor een certificaat als bedoeld in [artikel 151g, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 151h.e
    text: |-
      de wijze waarop een bestuurder die in een van de andere lidstaten van de Europese Unie de basiskwalificatie
      heeft behaald of de nascholing met goed gevolg heeft voltooid door middel van de daarbij behorende bewijsstukken,
      afgegeven door bevoegde autoriteiten van die lidstaten, via het CBR een aanvraag kan indienen om in Nederland een
      getuigschrift als bedoeld in [artikel 151g, derde lid][ref1], te verkrijgen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 151h.f
    text: |-
      de wijze waarop de bevoegde autoriteiten van de andere lidstaten van de Europese Unie via het CBR geautoriseerde
      informatie kunnen verkrijgen over de door een bestuurder in Nederland behaalde basiskwalificatie en over een door
      hem in Nederland geheel of gedeeltelijk met goed gevolg voltooide nascholing;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151h
  - number: 151h.g
    text: |-
      het model voor een nationaal certificaat als bedoeld in [artikel 151c, vierde lid, onderdeel b][ref1], de afgifte
      en de kosten van een dergelijk certificaat en de wijze waarop de erkenning van nationale certificaten die zijn
      afgegeven door andere lidstaten van de Europese Unie tot stand komt;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151c
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151c
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 151h.h
    text: |-
      de mate waarin en de wijze waarop het CBR in verband met de haar in dit hoofdstuk opgedragen taken toegang heeft
      tot het in [artikel 126][ref1] bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '126'
        hoofdstuk: VI
        afdeling: '8'
  - number: 151i.1
    text: |-
      De houder van een getuigschrift van vakbekwaamheid of een getuigschrift van nascholing dat zijn geldigheid heeft
      verloren doordat het niet binnen de in de richtlijn vakbekwaamheid bestuurders bedoelde termijn na afgifte is
      aangevuld met een met goed gevolg voltooide nascholing kan een nieuw getuigschrift van nascholing verwerven door de
      nascholing met goed gevolg te voltooien.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151i
  - number: 151i.2
    text: |-
      De houder van een certificaat als bedoeld in [artikel 151g, vierde lid][ref1], dat zijn geldigheid heeft verloren
      doordat het niet binnen de op het certificaat vermelde periode van geldigheid is gebruikt om de in de richtlijn
      vakbekwaamheid bestuurders bedoelde communautaire code op een rijbewijs of een kwalificatiekaart bestuurder te
      laten vermelden, kan een nieuw certificaat verwerven door de nascholing met goed gevolg te voltooien.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151i
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 151j
    text: |-
      Het is verboden voor het verkrijgen van een overeenkomstig [artikel 151g, derde lid][ref1], op het rijbewijs
      vermeld getuigschrift of een in [artikel 151g, vierde lid][ref2], bedoeld certificaat opzettelijk onjuiste opgaven
      te doen, onjuiste inlichtingen te verschaffen en onjuiste bewijsstukken en andere bescheiden over te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel151g
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151j
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 151g
        hoofdstuk: VIIA
        paragraaf: '2'
  - number: 151k
    text: |-
      Een wijziging van de richtlijn vakbekwaamheid bestuurders gaat voor de toepassing van [hoofdstuk VIIA][ref1] gelden
      met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukVIIA
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel151k
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: VIIA
  - number: '152.1'
    text: |-
      Verkeerstekens die worden geplaatst of verwijderd krachtens een verkeersbesluit, worden geplaatst en verwijderd op
      kosten van het gezag dat het verkeersbesluit heeft genomen.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel152
  - number: '152.2'
    text: |-
      Maatregelen ter regeling van het verkeer als bedoeld in [artikel 15, tweede lid][ref1], geschieden op kosten van
      het gezag dat het verkeersbesluit heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
  - number: '153'
    text: |-
      Verkeerstekens die niet worden geplaatst of verwijderd krachtens een verkeersbesluit, worden geplaatst en
      verwijderd op kosten van het openbaar lichaam dat het beheer heeft over de weg of, indien geen openbaar lichaam het
      beheer heeft, de eigenaar van de weg.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel153
  - number: 153a.1
    text: 'De kosten voor het door Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel153a
  - number: 153a.1.a
    text: tot stand brengen en vaststellen van ontwerpen voor bewegwijzering;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel153a
  - number: 153a.1.b
    text: verwerken van gegevens inzake die ontwerpen of de plaatsing of verwijdering van bewegwijzering, en
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel153a
  - number: 153a.1.c
    text: |-
      beheren en onderhouden van het register, bedoeld in [artikel 16b, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel16b
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel153a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 16b
        hoofdstuk: II
        paragraaf: '2'
  - number: 153a.2
    text: |-
      Onze Minister stelt na overleg met door hem aangewezen representatieve organisaties van wegbeheerders het tarief
      vast dat dient ter dekking van de krachtens het eerste lid inzake bewegwijzering aan Onze Minister verschuldigde
      kosten.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel153a
  - number: '154'
    text: |-
      In afwijking van [artikel 152][ref1] geschiedt de plaatsing en verwijdering van verkeerstekens, strekkende tot het
      instandhouden van de weg en het waarborgen van de bruikbaarheid daarvan op kosten van het openbaar lichaam dat het
      beheer heeft over de weg of, indien geen openbaar lichaam het beheer heeft, van de eigenaar van de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel152
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '152'
        hoofdstuk: VIII
  - number: '155'
    text: |-
      De kosten, verbonden aan de plaatsing van verkeerstekens en de uitvoering van maatregelen in dringende
      omstandigheden, komen ten laste van degene die deze uitvoert.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel155
  - number: '156'
    text: |-
      Bij algemene maatregel van bestuur kunnen kosten, verbonden aan de plaatsing of verwijdering van verkeerstekens,
      worden doorberekend aan degene ten behoeve van wie het verkeersteken is geplaatst of verwijderd.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel156
  - number: 156a
    text: |-
      Door burgemeester en wethouders worden op kosten van de gemeente de grenzen van de bebouwde kom of kommen aangeduid
      voor zover en op de wijze als bij ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel156a
  - number: '157'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen en op welke wijze tarieven, verschuldigd op
      grond van deze wet, gedeeltelijk worden terugbetaald.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel157
  - number: '158.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, met uitzondering van de
      [hoofdstukken IA][ref1], [IB][ref2] en [IC][ref3], zijn belast de in [artikel 159][ref4] bedoelde personen en de
      bij besluit van Onze Minister aangewezen personen, voor zover bij dat besluit is bepaald. Zij beschikken daartoe
      over de in [artikel 160, vierde lid][ref5], genoemde bevoegdheid met betrekking tot het vervoeren van personen en
      over de bevoegdheid, genoemd in artikel 160, vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIA
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIB
      [ref3]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIC
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel160
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: IA
      - id: ref2
        bwb_id: BWBR0006622
        hoofdstuk: IB
      - id: ref3
        bwb_id: BWBR0006622
        hoofdstuk: IC
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '160'
        hoofdstuk: IX
  - number: '158.2'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens de [artikelen 34][ref1] en [35][ref2] zijn voorts
      belast de bij besluit van Onze Minister in overeenstemming met Onze Minister van Economische Zaken aangewezen
      ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel35
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '34'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '35'
        hoofdstuk: III
        paragraaf: '5'
  - number: '158.3'
    text: |-
      Van een besluit als bedoeld in het eerste of tweede lid wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel158
  - number: '159'
    text: 'Met de opsporing van de feiten, strafbaar gesteld bij of krachtens deze wet, zijn belast:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel159
  - number: 159.a
    text: |-
      de in de [artikelen 141][ref1] en [142 van het Wetboek van Strafvordering][ref2] bedoelde personen;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: 159.b
    text: |-
      de bij algemene maatregel van bestuur aangewezen ambtenaren van de Rijksbelastingdienst, van de Rijks- en de
      provinciale waterstaat, van de Dienst Wegverkeer en van de verkeersinspecties, een en ander voor zover bij die
      algemene maatregel van bestuur is bepaald;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel159
  - number: 159.c
    text: |-
      de in de [artikelen 87][ref1] en [89 van de Wet personenvervoer 2000][ref2] bedoelde personen, voor zover het
      betreft de eisen die met betrekking tot voertuigen als bedoeld in die wet worden gesteld bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel89
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '87'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '89'
  - number: '160.1'
    text: |-
      Op de eerste vordering van de in [artikel 159][ref1] bedoelde personen is de bestuurder van een motorrijtuig
      verplicht dat motorrijtuig te doen stilhouden alsmede de volgende bewijzen behoorlijk ter inzage af te geven:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: 160.1.a
    text: |-
      de bij algemene maatregel van bestuur aangewezen delen van het kentekenbewijs, dan wel het in
      [artikel 37, eerste lid, onderdeel b][ref1], bedoelde bewijs, en, indien met het motorrijtuig een aanhangwagen
      wordt voortbewogen, de bij algemene maatregel van bestuur aangewezen delen van het kentekenbewijs van de
      aanhangwagen, dan wel het in artikel 37, eerste lid, onderdeel b, bedoelde bewijs voor de aanhangwagen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 160.1.b
    text: |-
      het rijbewijs dan wel het hem door het daartoe bevoegde gezag buiten Nederland afgegeven rijbewijs en, indien hem
      buiten Nederland een internationaal rijbewijs is afgegeven, dat bewijs;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
  - number: 160.1.c
    text: |-
      het ingevolge de richtlijn vakbekwaamheid bestuurders, bedoeld in [artikel 151b, onderdeel a][ref1], vereiste
      getuigschrift;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151b
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151b
        hoofdstuk: VIIA
        paragraaf: '1'
  - number: 160.1.d
    text: |-
      indien hem ter zake van een bij of krachtens deze wet vastgesteld voorschrift ontheffing is verleend, de
      beschikking houdende verlening van ontheffing;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
  - number: 160.1.e
    text: |-
      een gehandicaptenparkeerkaart of een kaart ten behoeve van het vervoer van gehandicapten, indien hij ter zake
      van het besturen van het motorrijtuig op grond van een bij of krachtens deze wet vastgesteld voorschrift dient te
      beschikken over een dergelijke kaart;
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
  - number: 160.1.f
    text: de begeleiderspas.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
  - number: '160.2'
    text: |-
      Indien het kentekenbewijs is afgegeven voor een aanhangwagen die overeenkomstig het krachtens deze wet bepaalde
      is voorzien van een identificatieplaat, kan aan de vordering worden voldaan binnen een bij algemene maatregel van
      bestuur vastgestelde termijn.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
  - number: '160.3'
    text: |-
      Op de eerste vordering van de in [artikel 159][ref1] bedoelde personen is de bestuurder van een voertuig,
      niet zijnde een motorrijtuig, verplicht dat voertuig te doen stilhouden en, indien hem ter zake van een bij of
      krachtens deze wet vastgesteld voorschrift ontheffing is verleend, de beschikking houdende verlening van ontheffing
      behoorlijk ter inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '160.4'
    text: |-
      De in [artikel 159][ref1] bedoelde personen zijn bevoegd zich te vergewissen van de naleving van de bij of
      krachtens deze wet vastgestelde voorschriften en zo nodig een voertuig ten aanzien waarvan zij een onderzoek
      wensen in te stellen, naar een nabij gelegen plaats te voeren of te doen voeren. De bestuurder van het voertuig
      ten aanzien waarvan dit onderzoek wenselijk wordt geoordeeld, en de bestuurder van het voertuig waardoor een
      aanhangwagen wordt voortbewogen ten aanzien waarvan zodanig onderzoek wenselijk wordt geoordeeld, zijn verplicht
      desgevorderd hun tot het onderzoek noodzakelijke medewerking te verlenen en desverlangd de in artikel 159 bedoelde
      personen in hun voertuig te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
        hoofdstuk: IX
  - number: '160.5'
    text: |-
      Op de eerste vordering van een van de in [artikel 159, onderdeel a][ref1], bedoelde personen zijn de bestuurder
      van een voertuig, degene die aanstalten maakt een motorrijtuig te gaan besturen en de begeleider, verplicht hun
      medewerking te verlenen aan:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel160
