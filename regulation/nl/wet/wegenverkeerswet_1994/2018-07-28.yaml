  - number: 25c
    text: Bij ministeriële regeling wordt bepaald wanneer een goedkeuring van een productieproces vervalt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel25c
  - number: 25d.1
    text: |-
      De Dienst Wegverkeer trekt een goedkeuring van een productieproces in, indien degene aan wie de goedkeuring is
      verleend, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel25d
  - number: 25d.2
    text: 'De Dienst Wegverkeer kan een goedkeuring van een productieproces intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel25d
  - number: 25d.2.a
    text: |-
      degene aan wie de goedkeuring is verleend een voertuig, systeem, onderdeel, technische eenheid, uitrustingstuk
      of voorziening ter bescherming van weggebruikers en passagiers doet of laat doorgaan voor vervaardigd volgens
      een goedgekeurd productieproces, terwijl dat voertuig, dat systeem, dat onderdeel, die technische eenheid,
      dat uitrustingsstuk of die voorziening ter bescherming van weggebruikers en passagiers niet is vervaardigd
      overeenkomstig het goedgekeurde productieproces,
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel25d
  - number: 25d.2.b
    text: |-
      degene aan wie de goedkeuring is verleend, de verplichting, vervat in [artikel 25b, tweede lid][ref1], niet nakomt,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel25b
    url: https://wetten.overheid.nl/BWBR0006622/2018-07-28#Artikel25d
    references:
