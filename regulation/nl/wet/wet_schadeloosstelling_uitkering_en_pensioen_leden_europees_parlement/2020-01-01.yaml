  - number: '5'
    text: |-
      1 De schadeloosstelling eindigt met de dag waarop een lid van het Europese Parlement ophoudt lid van dat Parlement
      te zijn.

      2 Zo spoedig mogelijk na het overlijden van het lid van het Europees Parlement wordt aan de weduwe of weduwnaar,
      van wie het overleden lid niet duurzaam gescheiden leefde, een bedrag uitgekeerd, gelijk aan driemaal het bedrag
      van de schadeloosstelling, dat over de laatste volle maand aan het lid is uitgekeerd. Indien de overledene geen
      weduwe of weduwnaar als bedoeld in de vorige volzin, nalaat, geschiedt de uitkering ten behoeve van de minderjarige
      kinderen tot wie de overledene in familierechtelijke betrekking stond, of minderjarige kinderen waarover de
      overledene de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud
      en de opvoeding van het kind als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het
      genieten van een vergoeding daarvoor. Ontbreken ook zodanige kinderen dan geschiedt de uitkering aan degenen die
      geheel of grotendeels afhankelijk waren van de schadeloosstelling van het lid van het Europees Parlement.

      3 Voor de toepassing van dit artikel wordt onder weduwe of weduwnaar mede verstaan de achtergebleven geregistreerde
      partner en de nabestaande levenspartner met wie het overleden niet-gehuwde lid van het Europees Parlement
      samenwoonde en - met het oogmerk duurzaam samen te leven - een gemeenschappelijke huishouding heeft gevoerd op
      basis van een notarieel verleden samenlevingscontract bevattende de wederzijdse rechten en verplichtingen ter zake
      van die samenwoning en gemeenschappelijke huishouding. Tegelijkertijd kan slechts één persoon als levenspartner
      worden aangemerkt. Onze Minister kan verlangen dat een schriftelijke verklaring van een notaris wordt overgelegd
      waaruit blijkt dat een samenlevingscontract als bedoeld in de eerste volzin is gesloten.
    url: https://wetten.overheid.nl/BWBR0003251/2020-01-01#Artikel5
  - number: '7'
    text: |-
      De leden van het Europese Parlement hebben bij aftreden aanspraak op uitkering op de voet van de bepalingen van
      de [Algemene pensioenwet politieke ambtsdragers][ref1] met betrekking tot leden van de Tweede Kamer der Staten-
      Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0003251/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: '8'
    text: |-
      1 Behoudens het bepaalde in de volgende leden hebben de leden van het Europese Parlement en hun nabestaanden
      aanspraak op pensioen op de voet van de bepalingen van de [Algemene pensioenwet politieke ambtsdragers][ref1] met
      betrekking tot leden van de Tweede Kamer der Staten-Generaal.

      2 Voor zover tijd, waarover als lid van het Europese Parlement aanspraak bestaat op pensioen, samenloopt met tijd,
      waarover als politieke ambtsdrager, als bedoeld in de [Algemene pensioenwet politieke ambtsdragers][ref2], anders
      dan als lid van de Tweede Kamer der Staten-Generaal, aanspraak bestaat op pensioen, bedraagt het pensioen als lid
      van het Europese Parlement over die samenlopende tijd per jaar 1,75% van de schadeloosstelling die gedurende die
      tijd laatstelijk krachtens deze wet werd genoten of zou zijn genoten, indien geen andere inkomsten dan die als
      politieke ambtsdrager, als in dit lid bedoeld, en als lid van het Europese Parlement zouden zijn genoten.

      3 Het tweede lid vindt overeenkomstige toepassing voor de berekening van weduwen- en wezenpensioenen.

      4 [Artikel 67, tweede lid, van de Algemene pensioenwet politieke ambtsdragers][ref3] is niet van toepassing bij
      de berekening van het weduwenpensioen krachtens deze wet, indien toepassing van dat artikel plaatsvindt bij de
      berekening van het pensioen als weduwe of als achtergebleven geregistreerde partner van een lid of gewezen lid van
      de Tweede Kamer der Staten-Generaal.

      5 Voor de toepassing van de bepalingen van de [Algemene pensioenwet politieke ambtsdragers][ref4] en andere
      overheidspensioenwetten wordt een pensioen krachtens deze wet aangemerkt als een overheidspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691
      [ref2]: https://wetten.overheid.nl/BWBR0002691
