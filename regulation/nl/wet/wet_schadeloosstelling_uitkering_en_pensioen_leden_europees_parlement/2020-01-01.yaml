  - number: 17a
    text: |-
      Onder neveninkomsten als bedoeld in [artikel 3, tweede lid][ref1], wordt met betrekking tot aan het kalenderjaar
      2001 voorafgaande kalenderjaren verstaan winst uit onderneming en zuivere inkomsten uit tegenwoordige arbeid. Met
      betrekking tot die jaren wordt in [artikel 3, derde lid, onder][ref2][Wet inkomstenbelasting 2001][ref3] verstaan
      Wet op de inkomstenbelasting 1964.


      [ref1]: https://wetten.overheid.nl/BWBR0003251#Artikel3
