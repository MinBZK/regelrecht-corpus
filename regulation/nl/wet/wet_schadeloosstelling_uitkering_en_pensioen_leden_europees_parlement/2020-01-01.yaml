        artikel: '10'
  - number: '17'
    text: |-
      Indien een lid van het Europese Parlement dat op de dag van zijn benoemdverklaring lid van de Tweede
      Kamer, lid van gedeputeerde staten, dan wel wethouder is, en krachtens [artikel 7][ref1] aanspraak heeft
      op uitkering ter zake van het aftreden als lid van het Europese Parlement vóór of aan het einde van de
      in 1979 aangevangen periode van vijf jaar, bedoeld in artikel 3, eerste lid, van de Akte van 20 september
      1976, *Trb.* 1976, 175, wordt de vóór het ontslag als lid van de Tweede Kamer, lid van gedeputeerde
      staten, dan wel wethouder zonder wezenlijke onderbreking als zodanig vervulde tijd voor de toepassing van
      [artikel 52, eerste lid, tweede volzin, van de Algemene pensioenwet politieke ambtsdragers][ref2] geacht als lid
      van het Europese Parlement te zijn vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0003251#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel52
    url: https://wetten.overheid.nl/BWBR0003251/2020-01-01#Artikel17
