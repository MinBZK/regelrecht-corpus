        artikel: '2'
  - number: 2a
    text: |-
      1 Indien voor de ambtenaren die op grond van een arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie
      van Binnenlandse Zaken en Koninkrijksrelaties in een collectieve arbeidsovereenkomst een eenmalige uitkering is
      overeengekomen en daarbij is bepaald dat deze uitkering een algemeen karakter draagt, ontvangen de leden van het
      Europese Parlement een uitkering op gelijke voet.

      2 De leden ontvangen een eindejaarsuitkering op de voet van hetgeen daaromtrent voor de ambtenaren die op grond van
      een arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties
      in een collectieve arbeidsovereenkomst is overeengekomen.

      3 Indien de hoogte van een uitkering afhankelijk is van de hoogte van de schadeloosstelling, blijft bij de
      berekening van de hoogte van die uitkering de inhouding, bedoeld in [artikel 2, tweede lid][ref1], buiten
      beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0003251#Artikel2
    url: https://wetten.overheid.nl/BWBR0003251/2020-01-01#Artikel2a
    references:
