preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een regeling te treffen voor de schadeloosstelling van
    de in Nederland gekozen leden van het Europese Parlement en voor toekenning van een uitkering en een pensioen aan
    de gewezen leden van het Europese Parlement, alsmede van een pensioen aan hun weduwen en wezen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003251/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder:

      a. het Europese Parlement: de Vergadering bestaande uit de vertegenwoordigers van de volkeren van de in de Europese
      Gemeenschappen verenigde staten;

      b. lid van het Europese Parlement: de in Nederland gekozen vertegenwoordiger in de onder *a* bedoelde vergadering;

      c. schadeloosstelling: de schadeloosstelling voor de leden van het Europese Parlement, bedoeld in
      [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003251#Artikel2
    url: https://wetten.overheid.nl/BWBR0003251/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003251
        artikel: '2'
  - number: 1a
    text: |-
      1 Deze wet is niet van toepassing op de leden van het Europees Parlement die volledig vallen onder de werking
      van het Statuut van de leden van het Europees Parlement (besluit nr. 2005/684/EG van het Europees Parlement van
      28 september 2005, PbEU L 262).

      2 Het eerste lid geldt niet zover het betreft de door die leden op grond van deze wet opgebouwde
      pensioenaanspraken.
    url: https://wetten.overheid.nl/BWBR0003251/2020-01-01#Artikel1a
  - number: '2'
    text: |-
      1 De schadeloosstelling komt overeen met de schadeloosstelling, bedoeld in
      [artikel 2, van de Wet schadeloosstelling leden Tweede Kamer][ref1].

      2 Op de schadeloosstelling wordt een bedrag van € 11 530,10 ingehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel2
    url: https://wetten.overheid.nl/BWBR0003251/2020-01-01#Artikel2
