        artikel: '2'
  - number: '3'
    text: |-
      1 Onverminderd [artikel 2, tweede lid][ref1], wordt de schadeloosstelling verminderd met de helft van het bedrag
      waarmee de neveninkomsten van het lid van het Europese Parlement per jaar een bedrag gelijk aan 14% van de
      schadeloosstelling te boven gaan, met dien verstande dat deze vermindering maximaal 35% van de schadeloosstelling
      bedraagt. Indien het lid een gedeelte van het kalenderjaar lid van het Europese Parlement is, gelden de bedragen
      naar evenredigheid.

      2 Onder neveninkomsten wordt verstaan het gezamenlijke bedrag dat het lid wegens het verrichten van
      nevenactiviteiten tijdens het lidmaatschap geniet als:

      a. winst uit een of meer ondernemingen, bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref2];

      b. belastbaar loon uit tegenwoordige arbeid en

      c. belastbaar resultaat uit overige werkzaamheden, behoudens voorzover het een werkzaamheid betreft als bedoeld in
      de [artikelen 3.91, eerste lid, onderdelen a en b][ref3], en [3.92 van de Wet inkomstenbelasting 2001][ref4].

      3 De neveninkomsten worden bepaald overeenkomstig de regels van de [Wet inkomstenbelasting 2001][ref5] en
      worden verrekend in het jaar waarin deze zijn genoten in de zin van die [wet][ref6], met dien verstande dat geen
      verrekening meer plaats heeft, indien de neveninkomsten worden genoten na 31 december van het jaar waarin het
      lidmaatschap wordt beëindigd.

      4 Indien een lid van het Europese Parlement tevens lid is van de Tweede Kamer der Staten-Generaal ontvangt hij voor
      zijn lidmaatschap van het Europese Parlement geen schadeloosstelling. De [artikelen 4][ref7] en [7][ref8] zijn op
      hem niet van toepassing.


