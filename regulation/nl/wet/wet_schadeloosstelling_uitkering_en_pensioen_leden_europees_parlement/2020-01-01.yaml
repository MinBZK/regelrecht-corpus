  - number: '4'
    text: |-
      1 Ieder jaar voor 1 april of binnen twee maanden na de dag van zijn eerste deelname aan de vergadering van het
      Europese Parlement verstrekt een lid van het Europese Parlement aan de voorzitter van het managementteam van
      de Belastingdienst/Haaglanden een opgave van de neveninkomsten, welke het lid verwacht over het betreffende
      kalenderjaar of een gedeelte daarvan te zullen genieten, dan wel een verklaring, dat hij verwacht niet meer dan
      14% van de schadeloosstelling aan neveninkomsten over dat jaar of een evenredig deel daarvan over het betreffende
      gedeelte van dat jaar te zullen genieten.

      2 De voorzitter van het managementteam van de Belastingdienst/Haaglanden deelt aan de Minister van Binnenlandse
      Zaken het bedrag van de voorlopige aftrek van de schadeloosstelling mede en verstrekt een afschrift van deze
      mededeling aan het lid.

      3 Indien een lid van het Europese Parlement een verklaring inzendt dat een opgave van neveninkomsten achterwege
      blijft of indien geen opgave of verklaring is ingezonden binnen de termijn, bedoeld in het eerste lid, wordt bij de
      toepassing van [artikel 3][ref1] uitgegaan van de maximale vermindering.

      4 Zo spoedig mogelijk na afloop van het kalenderjaar zendt een lid van het Europese Parlement of zenden
      zijn nabestaanden aan de voorzitter van het managementteam van de Belastingdienst/Haaglanden een opgave van
      neveninkomsten, welke over dat kalenderjaar zijn genoten, dan wel een verklaring dat per jaar niet meer dan 14%
      van de schadeloosstelling of, indien het lid een gedeelte van het kalenderjaar lid van de kamer is geweest, een
      evenredig deel van dit bedrag, is genoten.

      5 De voorzitter van het managementteam van de Belastingdienst/Haaglanden deelt zo spoedig mogelijk na ontvangst
      van de in het vorige lid bedoelde opgave of verklaring aan de Minister van Binnenlandse Zaken het bedrag van de
      definitieve aftrek van de schadeloosstelling mede en verstrekt een afschrift van deze mededeling aan het lid van
      het Europese Parlement.

      6 Indien een opgave of een verklaring als in het vierde lid bedoeld niet binnen zes maanden na afloop van het
      kalenderjaar is ontvangen, geeft de voorzitter van het managementteam van de Belastingdienst/Haaglanden daarvan
      kennis aan de Minister van Binnenlandse Zaken. In dat geval wordt bij de toepassing van [artikel 3][ref2] uitgegaan
      van de maximale vermindering.

      7 Het bedrag van de uitbetaalde schadeloosstelling kan, al dan niet op verzoek van een lid van het Europese
      Parlement, worden herzien, indien op grond van een onherroepelijk geworden aanslag in de inkomstenbelasting daartoe
      aanleiding blijkt te bestaan.

      8 Bij de toepassing van dit artikel vindt zo nodig terugbetaling of verrekening plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003251#Artikel3
