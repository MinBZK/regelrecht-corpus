---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_schadeloosstelling_uitkering_en_pensioen_leden_europees_parlement
regulatory_layer: WET
publication_date: '2006-09-21'
valid_from: '2021-07-10'
bwb_id: BWBR0003251
url: https://wetten.overheid.nl/BWBR0003251/2021-07-10
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een regeling te treffen voor de schadeloosstelling van
    de in Nederland gekozen leden van het Europese Parlement en voor toekenning van een uitkering en een pensioen aan
    de gewezen leden van het Europese Parlement, alsmede van een pensioen aan hun weduwen en wezen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#ArtikelAanhef
articles:
  - number: '1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel1
  - number: 1.a
    text: |-
      het Europese Parlement: de Vergadering bestaande uit de vertegenwoordigers van de volkeren van de in de Europese
      Gemeenschappen verenigde staten;
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel1
  - number: 1.b
    text: 'lid van het Europese Parlement: de in Nederland gekozen vertegenwoordiger in de onder *a* bedoelde vergadering;'
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel1
  - number: 1.c
    text: |-
      schadeloosstelling: de schadeloosstelling voor de leden van het Europese Parlement, bedoeld in
      [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003251#Artikel2
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003251
        artikel: '2'
  - number: 1a.1
    text: |-
      Deze wet is niet van toepassing op de leden van het Europees Parlement die volledig vallen onder de werking
      van het Statuut van de leden van het Europees Parlement (besluit nr. 2005/684/EG van het Europees Parlement van
      28 september 2005, PbEU L 262).
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel1a
  - number: 1a.2
    text: Het eerste lid geldt niet zover het betreft de door die leden op grond van deze wet opgebouwde pensioenaanspraken.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel1a
  - number: '2.1'
    text: |-
      De schadeloosstelling komt overeen met de schadeloosstelling, bedoeld in
      [artikel 2, van de Wet schadeloosstelling leden Tweede Kamer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel2
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '2'
  - number: '2.2'
    text: Op de schadeloosstelling wordt een bedrag van € 11 530,10 ingehouden.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel2
  - number: 2a.1
    text: |-
      Indien voor de ambtenaren die op grond van een arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie
      van Binnenlandse Zaken en Koninkrijksrelaties in een collectieve arbeidsovereenkomst een eenmalige uitkering is
      overeengekomen en daarbij is bepaald dat deze uitkering een algemeen karakter draagt, ontvangen de leden van het
      Europese Parlement een uitkering op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel2a
  - number: 2a.2
    text: |-
      De leden ontvangen een eindejaarsuitkering van 8,3 procent, berekend over de schadeloosstelling, bedoeld in
      [artikel 2][ref1], verminderd met het in [artikel 2 van de Wet schadeloosstelling leden Tweede Kamer][ref2]
      genoemde percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0003251#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004939#Artikel2
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0003251
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004939
        artikel: '2'
  - number: 2a.3
    text: |-
      Indien de hoogte van een uitkering afhankelijk is van de hoogte van de schadeloosstelling, blijft bij de berekening
      van de hoogte van die uitkering de inhouding, bedoeld in [artikel 2, tweede lid][ref1], buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0003251#Artikel2
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0003251
        artikel: '2'
  - number: '3.1'
    text: |-
      Onverminderd [artikel 2, tweede lid][ref1], wordt de schadeloosstelling verminderd met de helft van het bedrag
      waarmee de neveninkomsten van het lid van het Europese Parlement per jaar een bedrag gelijk aan 14% van de
      schadeloosstelling te boven gaan, met dien verstande dat deze vermindering maximaal 35% van de schadeloosstelling
      bedraagt. Indien het lid een gedeelte van het kalenderjaar lid van het Europese Parlement is, gelden de bedragen
      naar evenredigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003251#Artikel2
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003251
        artikel: '2'
  - number: '3.2'
    text: |-
      Onder neveninkomsten wordt verstaan het gezamenlijke bedrag dat het lid wegens het verrichten van nevenactiviteiten
      tijdens het lidmaatschap geniet als:
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel3
  - number: 3.2.a
    text: |-
      winst uit een of meer ondernemingen, bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 3.2.b
    text: belastbaar loon uit tegenwoordige arbeid en
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel3
  - number: 3.2.c
    text: |-
      belastbaar resultaat uit overige werkzaamheden, behoudens voorzover het een werkzaamheid betreft als bedoeld in de
      [artikelen 3.91, eerste lid, onderdelen a en b][ref1], en [3.92 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '3.3'
    text: |-
      De neveninkomsten worden bepaald overeenkomstig de regels van de [Wet inkomstenbelasting 2001][ref1] en worden
      verrekend in het jaar waarin deze zijn genoten in de zin van die [wet][ref2], met dien verstande dat geen
      verrekening meer plaats heeft, indien de neveninkomsten worden genoten na 31 december van het jaar waarin het
      lidmaatschap wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0011353
  - number: '3.4'
    text: |-
      Indien een lid van het Europese Parlement tevens lid is van de Tweede Kamer der Staten-Generaal ontvangt hij voor
      zijn lidmaatschap van het Europese Parlement geen schadeloosstelling. De [artikelen 4][ref1] en [7][ref2] zijn op
      hem niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003251#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003251#Artikel7
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003251
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003251
        artikel: '7'
  - number: '4.1'
    text: |-
      Ieder jaar voor 1 april of binnen twee maanden na de dag van zijn eerste deelname aan de vergadering van het
      Europese Parlement verstrekt een lid van het Europese Parlement aan de voorzitter van het managementteam van
      de Belastingdienst/Haaglanden een opgave van de neveninkomsten, welke het lid verwacht over het betreffende
      kalenderjaar of een gedeelte daarvan te zullen genieten, dan wel een verklaring, dat hij verwacht niet meer dan
      14% van de schadeloosstelling aan neveninkomsten over dat jaar of een evenredig deel daarvan over het betreffende
      gedeelte van dat jaar te zullen genieten.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel4
  - number: '4.2'
    text: |-
      De voorzitter van het managementteam van de Belastingdienst/Haaglanden deelt aan de Minister van Binnenlandse Zaken
      het bedrag van de voorlopige aftrek van de schadeloosstelling mede en verstrekt een afschrift van deze mededeling
      aan het lid.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel4
  - number: '4.3'
    text: |-
      Indien een lid van het Europese Parlement een verklaring inzendt dat een opgave van neveninkomsten achterwege
      blijft of indien geen opgave of verklaring is ingezonden binnen de termijn, bedoeld in het eerste lid, wordt bij de
      toepassing van [artikel 3][ref1] uitgegaan van de maximale vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0003251#Artikel3
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003251
        artikel: '3'
  - number: '4.4'
    text: |-
      Zo spoedig mogelijk na afloop van het kalenderjaar zendt een lid van het Europese Parlement of zenden zijn
      nabestaanden aan de voorzitter van het managementteam van de Belastingdienst/Haaglanden een opgave van
      neveninkomsten, welke over dat kalenderjaar zijn genoten, dan wel een verklaring dat per jaar niet meer dan 14%
      van de schadeloosstelling of, indien het lid een gedeelte van het kalenderjaar lid van de kamer is geweest, een
      evenredig deel van dit bedrag, is genoten.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel4
  - number: '4.5'
    text: |-
      De voorzitter van het managementteam van de Belastingdienst/Haaglanden deelt zo spoedig mogelijk na ontvangst
      van de in het vorige lid bedoelde opgave of verklaring aan de Minister van Binnenlandse Zaken het bedrag van de
      definitieve aftrek van de schadeloosstelling mede en verstrekt een afschrift van deze mededeling aan het lid van
      het Europese Parlement.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel4
  - number: '4.6'
    text: |-
      Indien een opgave of een verklaring als in het vierde lid bedoeld niet binnen zes maanden na afloop van het
      kalenderjaar is ontvangen, geeft de voorzitter van het managementteam van de Belastingdienst/Haaglanden daarvan
      kennis aan de Minister van Binnenlandse Zaken. In dat geval wordt bij de toepassing van [artikel 3][ref1] uitgegaan
      van de maximale vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0003251#Artikel3
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003251
        artikel: '3'
  - number: '4.7'
    text: |-
      Het bedrag van de uitbetaalde schadeloosstelling kan, al dan niet op verzoek van een lid van het Europese
      Parlement, worden herzien, indien op grond van een onherroepelijk geworden aanslag in de inkomstenbelasting daartoe
      aanleiding blijkt te bestaan.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel4
  - number: '4.8'
    text: Bij de toepassing van dit artikel vindt zo nodig terugbetaling of verrekening plaats.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel4
  - number: '5.1'
    text: |-
      De schadeloosstelling eindigt met de dag waarop een lid van het Europese Parlement ophoudt lid van dat Parlement
      te zijn.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel5
  - number: '5.2'
    text: |-
      Zo spoedig mogelijk na het overlijden van het lid van het Europees Parlement wordt aan de weduwe of weduwnaar, van
      wie het overleden lid niet duurzaam gescheiden leefde, een bedrag uitgekeerd, gelijk aan driemaal het bedrag van de
      schadeloosstelling, dat over de laatste volle maand aan het lid is uitgekeerd. Indien de overledene geen weduwe of
      weduwnaar als bedoeld in de vorige volzin, nalaat, geschiedt de uitkering ten behoeve van de minderjarige kinderen
      tot wie de overledene in familierechtelijke betrekking stond, of minderjarige kinderen waarover de overledene de
      pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding
      van het kind als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van
      een vergoeding daarvoor. Ontbreken ook zodanige kinderen dan geschiedt de uitkering aan degenen die geheel of
      grotendeels afhankelijk waren van de schadeloosstelling van het lid van het Europees Parlement.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel5
  - number: '5.3'
    text: |-
      Voor de toepassing van dit artikel wordt onder weduwe of weduwnaar mede verstaan de achtergebleven geregistreerde
      partner en de nabestaande levenspartner met wie het overleden niet-gehuwde lid van het Europees Parlement
      samenwoonde en - met het oogmerk duurzaam samen te leven - een gemeenschappelijke huishouding heeft gevoerd op
      basis van een notarieel verleden samenlevingscontract bevattende de wederzijdse rechten en verplichtingen ter zake
      van die samenwoning en gemeenschappelijke huishouding. Tegelijkertijd kan slechts één persoon als levenspartner
      worden aangemerkt. Onze Minister kan verlangen dat een schriftelijke verklaring van een notaris wordt overgelegd
      waaruit blijkt dat een samenlevingscontract als bedoeld in de eerste volzin is gesloten.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel5
  - number: '7'
    text: |-
      De leden van het Europese Parlement hebben bij aftreden aanspraak op uitkering op de voet van de bepalingen van de
      [Algemene pensioen- en uitkeringswet politieke ambtsdragers][ref1] met betrekking tot leden van de Tweede Kamer der
      Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: '8.1'
    text: |-
      Behoudens het bepaalde in de volgende leden hebben de leden van het Europese Parlement en hun nabestaanden aanspraak
      op pensioen op de voet van de bepalingen van de [Algemene pensioen- en uitkeringswet politieke ambtsdragers][ref1]
      met betrekking tot leden van de Tweede Kamer der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: '8.2'
    text: |-
      Voor zover tijd, waarover als lid van het Europese Parlement aanspraak bestaat op
      pensioen, samenloopt met tijd, waarover als politieke ambtsdrager, als bedoeld in de
      [Algemene pensioen- en uitkeringswet politieke ambtsdragers][ref1], anders dan als lid van de Tweede Kamer der
      Staten-Generaal, aanspraak bestaat op pensioen, bedraagt het pensioen als lid van het Europese Parlement over die
      samenlopende tijd per jaar 1,75% van de schadeloosstelling die gedurende die tijd laatstelijk krachtens deze wet
      werd genoten of zou zijn genoten, indien geen andere inkomsten dan die als politieke ambtsdrager, als in dit lid
      bedoeld, en als lid van het Europese Parlement zouden zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: '8.3'
    text: Het tweede lid vindt overeenkomstige toepassing voor de berekening van weduwen- en wezenpensioenen.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel8
  - number: '8.4'
    text: |-
      [Artikel 67, tweede lid, van de Algemene pensioen- en uitkeringswet politieke ambtsdragers][ref1] is niet van
      toepassing bij de berekening van het weduwenpensioen krachtens deze wet, indien toepassing van dat artikel
      plaatsvindt bij de berekening van het pensioen als weduwe of als achtergebleven geregistreerde partner van een lid
      of gewezen lid van de Tweede Kamer der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Artikel67
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002691
        artikel: '67'
  - number: '8.5'
    text: |-
      Voor de toepassing van de bepalingen van de [Algemene pensioen- en uitkeringswet politieke ambtsdragers][ref1] en
      andere overheidspensioenwetten wordt een pensioen krachtens deze wet aangemerkt als een overheidspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: '9.1'
    text: |-
      [Hoofdstuk 18 van de Algemene pensioen- en uitkeringswet politieke ambtsdragers][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002691#Hoofdstuk18
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002691
        hoofdstuk: '18'
  - number: '9.2'
    text: |-
      Bij de overeenkomstige toepassing van de [Algemene pensioen- en uitkeringswet politieke ambtsdragers][ref1] op
      grond van het eerste lid en de [artikelen 7][ref2] tot en met [8][ref3], wordt onder schadeloosstelling verstaan
      de schadeloosstelling, bedoeld in [artikel 2, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002691
      [ref2]: https://wetten.overheid.nl/BWBR0003251#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003251#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003251#Artikel2
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002691
      - id: ref2
        bwb_id: BWBR0003251
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003251
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0003251
        artikel: '2'
  - number: '11'
    text: |-
      De kosten van de uit deze wet voortvloeiende schadeloosstellingen, uitkeringen, pensioenen en toeslagen, komen ten
      laste van Hoofdstuk VII van de Rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel11
  - number: '16'
    text: |-
      Wanneer na de dag na de inwerkingtreding van deze wet met terugwerkende kracht tot vóór die dag toepassing wordt
      gegeven aan artikel 7 van de Wet van 30 oktober 1968 (*Stb*. 584) vindt [artikel 10][ref1] mede toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003251#Artikel10
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003251
        artikel: '10'
  - number: '17'
    text: |-
      Indien een lid van het Europese Parlement dat op de dag van zijn benoemdverklaring lid van de Tweede
      Kamer, lid van gedeputeerde staten, dan wel wethouder is, en krachtens [artikel 7][ref1] aanspraak heeft
      op uitkering ter zake van het aftreden als lid van het Europese Parlement vóór of aan het einde van de
      in 1979 aangevangen periode van vijf jaar, bedoeld in artikel 3, eerste lid, van de Akte van 20 september
      1976, *Trb.* 1976, 175, wordt de vóór het ontslag als lid van de Tweede Kamer, lid van gedeputeerde
      staten, dan wel wethouder zonder wezenlijke onderbreking als zodanig vervulde tijd voor de toepassing van
      [artikel 52, eerste lid, tweede volzin, van de Algemene pensioen- en uitkeringswet politieke ambtsdragers][ref2]
      geacht als lid van het Europese Parlement te zijn vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0003251#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel52
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003251
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002691
        artikel: '52'
  - number: 17a
    text: |-
      Onder neveninkomsten als bedoeld in [artikel 3, tweede lid][ref1], wordt met betrekking tot aan het kalenderjaar
      2001 voorafgaande kalenderjaren verstaan winst uit onderneming en zuivere inkomsten uit tegenwoordige arbeid. Met
      betrekking tot die jaren wordt in [artikel 3, derde lid, onder][ref2][Wet inkomstenbelasting 2001][ref3] verstaan
      Wet op de inkomstenbelasting 1964.


      [ref1]: https://wetten.overheid.nl/BWBR0003251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003251#Artikel3
