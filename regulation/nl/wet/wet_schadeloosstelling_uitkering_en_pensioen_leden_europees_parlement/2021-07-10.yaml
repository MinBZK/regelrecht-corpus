  - number: '18'
    text: Deze wet kan worden aangehaald als Wet schadeloosstelling, uitkering en pensioen leden Europees Parlement.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel18
  - number: '19.1'
    text: |-
      Deze wet treedt, behoudens het bepaalde in het tweede lid, in werking met ingang van 17 juli 1979. Indien het
      *Staatsblad* waarin deze wet wordt geplaatst, wordt uitgegeven na 17 juli 1979, treedt zij in werking met ingang
      van de dag na de datum van uitgifte van het *Staatsblad* en werkt zij terug tot 17 juli 1979.
    url: https://wetten.overheid.nl/BWBR0003251/2021-07-10#Artikel19
  - number: '19.2'
    text: |-
      [Artikel 12][ref1] treedt in werking op een door Ons te bepalen tijdstip.


