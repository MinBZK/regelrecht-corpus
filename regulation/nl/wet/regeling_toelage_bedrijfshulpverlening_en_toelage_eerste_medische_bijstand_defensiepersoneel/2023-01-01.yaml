  - number: '2'
    text: |-
      Alle bedragen genoemd in deze regeling zijn onderworpen aan de verschuldigde loonheffing en inhoudingen, bedoeld in
      [paragraaf 5 van de Wet financiële voorzieningen privatisering ABP][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0015828/2023-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007211
        paragraaf: '5'
  - number: '3'
    text: |-
      1 De militair of ambtenaar die in de periode waarvoor hij als bedrijfshulpverlener was aangewezen, inzetbaar was
      als bedrijfshulpverlener en aan ten minste 80% van de geplande bedrijfshulpverleningslessen en -oefeningen heeft
      deelgenomen, heeft per kalenderjaar aanspraak op een toelage bedrijfshulpverlening.

      2 De bedrijfshulpverlener met specialisatie, de ploegleider, de coördinator bedrijfshulpverlening en het hoofd
      bedrijfshulpverlening hebben naast de toelage als bedoeld in het eerste lid tevens aanspraak op een functietoeslag.

      3 De toekenning van de toelage bedrijfshulpverlening en de functietoeslag geschiedt jaarlijks in de maand
      december met betrekking tot het lopende kalenderjaar, tenzij de periode waarvoor de militair of ambtenaar als
      bedrijfshulpverlener was aangewezen eerder eindigt.
    url: https://wetten.overheid.nl/BWBR0015828/2023-01-01#Artikel3
  - number: '4'
    text: |-
      Per kalenderjaar bedraagt de toelage bedrijfshulpverlening als bedoeld in het eerste lid van [artikel 3][ref1]:
      € 296,76.


      [ref1]: https://wetten.overheid.nl/BWBR0015828#Artikel3
    url: https://wetten.overheid.nl/BWBR0015828/2023-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015828
        artikel: '3'
  - number: '5'
    text: |-
      Per kalenderjaar bedraagt de functietoeslag als bedoeld in het tweede lid van [artikel 3][ref1]:

      a. voor de bedrijfshulpverlener met specialisatie: € 148,37;

      b. voor de bedrijfshulpverlener die is aangewezen als ploegleider: € 166,17;

      c. voor de bedrijfshulpverlener met specialisatie die tevens als ploegleider is aangewezen: € 314,57;

      d. voor de coördinator bedrijfshulpverlening: € 326,42;

      e. voor het hoofd bedrijfshulpverlening: € 326,42.


      [ref1]: https://wetten.overheid.nl/BWBR0015828#Artikel3
    url: https://wetten.overheid.nl/BWBR0015828/2023-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015828
        artikel: '3'
  - number: '6'
    text: |-
      Indien een militair of ambtenaar in enig kalenderjaar voor een kortere periode dan 12 maanden was aangewezen
      als algemeen bedrijfshulpverlener, bedrijfshulpverlener met specialisatie, ploegleider, coördinator
      bedrijfshulpverlening of hoofd bedrijfshulpverlening, worden de toelage bedrijfshulpverlening en de functietoeslag
      vastgesteld in evenredigheid met het aantal maanden dat hij in dat kalenderjaar als zodanig was aangewezen.
    url: https://wetten.overheid.nl/BWBR0015828/2023-01-01#Artikel6
  - number: '7'
    text: |-
      1 De EHBO’er heeft eenmaal per kalenderjaar aanspraak op een toelage eerste medische bijstand.

      2 De toekenning van de toelage eerste medische bijstand geschiedt jaarlijks in de maand december met betrekking tot
      het lopende kalenderjaar, tenzij de aanwijzing eerder eindigt.

      3 Indien een militair of ambtenaar in enig kalenderjaar voor een kortere periode dan 12 maanden was aangewezen als
      EHBO-er, worden het aantal werkdagen en de toelage eerste medische bijstand vastgesteld in evenredigheid met het
      aantal maanden dat hij in dat kalenderjaar was aangewezen als EHBO-er.
    url: https://wetten.overheid.nl/BWBR0015828/2023-01-01#Artikel7
  - number: '8'
    text: |-
      Per kalenderjaar bedraagt de toelage eerste medische bijstand als bedoeld in het eerste lid van [artikel 7][ref1]:
      € 296,76.


      [ref1]: https://wetten.overheid.nl/BWBR0015828#Artikel7
    url: https://wetten.overheid.nl/BWBR0015828/2023-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015828
        artikel: '7'
  - number: '9'
    text: |-
      Indien een militair of ambtenaar in enig kalenderjaar voor een kortere periode dan 12 maanden was aangewezen als
      EHBO’er, wordt de toelage eerste medische bijstand als bedoeld in het eerste lid van [artikel 7][ref1] vastgesteld
      in evenredigheid met het aantal maanden dat hij in dat kalenderjaar als zodanig was aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0015828#Artikel7
    url: https://wetten.overheid.nl/BWBR0015828/2023-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015828
        artikel: '7'
  - number: '10'
    text: |-
      De bedrijfshulpverlener en de EHBO’er die gedurende een bepaald aantal jaren aanspraak heeft gehad op de toelage
      bedrijfshulpverlening of de toelage eerste medische bijstand, heeft aanspraak op een jubileumgratificatie volgens
      onderstaand schema:

      na 5 jaar: € 296,76;

      na 10 jaar: € 356,12;

      na 15 jaar: € 415,47;

      na 20 jaar: € 474,80;

      na 25 jaar: € 534,16;

      na 30 jaar: € 534,16;

      na 35 jaar: € 534,16;

      na 40 jaar: € 534,16.
    url: https://wetten.overheid.nl/BWBR0015828/2023-01-01#Artikel10
  - number: '11'
    text: |-
      1 Bij een buitengewone prestatie op het gebied van het verrichten van bedrijfshulpverleningstaken, kan door de
      commandant een gratificatie worden toegekend.

      2 Deze gratificatie kan worden toegekend aan:

      a. een bedrijfshulpverlener;

      b. een EHBO-er;

      c. een ontruimingsfunctionaris;

      d. een hoofd bedrijfshulpverlening waarbij het leiding geven aan alle andere bedrijfshulpverleners deel uitmaakt
      van zijn normale werkzaamheden.

      3 Deze gratificatie bedraagt € 273,02 netto.

      4 In afwijking van [artikel 2][ref1] komen de verschuldigde loonheffing en inhoudingen over deze gratificatie voor
      rekening van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0015828#Artikel2
    url: https://wetten.overheid.nl/BWBR0015828/2023-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0015828
        artikel: '2'
  - number: '12'
    text: |-
      De volgende regelingen worden ingetrokken:

      a. de Regeling bedrijfshulpverlening defensie;

      b. de Beleidsregels bedrijfshulpverlening Koninklijke Marine;

      c. de Beleidsregel bedrijfshulpverlening Koninklijke Marechaussee.
    url: https://wetten.overheid.nl/BWBR0015828/2023-01-01#Artikel12
  - number: '13'
    text: Deze regeling treedt in werking met ingang van 1 januari 2004.
    url: https://wetten.overheid.nl/BWBR0015828/2023-01-01#Artikel13
  - number: '14'
    text: |-
