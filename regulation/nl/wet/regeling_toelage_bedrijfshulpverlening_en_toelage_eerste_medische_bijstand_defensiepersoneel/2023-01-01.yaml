articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *algemeen bedrijfshulpverlener:* een bedrijfshulpverlener die de basisopleiding bedrijfshulpverlening heeft
      genoten en die als zodanig is aangewezen om tijdens het verrichten van bedrijfshulpverleningstaken zorg te dragen
      voor de initiële brandbestrijding of gewondenverzorging;
        - *ambtenaar:* een ambtenaar als bedoeld in [artikel 1 van het Burgerlijk ambtenarenreglement defensie][ref1];
        - *bedrijfshulpverlener:* een ambtenaar of militair die naast zijn normale werkzaamheden door de commandant is
      aangewezen als: 1. algemeen bedrijfshulpverlener; 2. bedrijfshulpverlener met specialisatie; 3. ploegleider; 4.
      coördinator bedrijfshulpverlener; 5. hoofd bedrijfshulpverlening;
        - *bedrijfshulpverlener met specialisatie:* een bedrijfshulpverlener die evenals de algemeen bedrijfshulpverlener
      is aangewezen om tijdens het verrichten van bedrijfshulpverleningstaken zorg te dragen voor de initiële
      brandbestrijding en gewondenverzorging en die naast de basisopleiding bedrijfshulpverlening voor een van die
      bedrijfshulpverleningstaken een aanvullende opleiding heeft genoten;
        - *bedrijfshulpverleningstaken:* 1°. het verlenen van eerste hulp bij arbeidsongevallen; 2°. het beperken en
      het bestrijden van brand en het voorkomen en beperken van arbeidsongevallen; 3°. het in noodsituaties alarmeren
      en evacueren van alle werknemers en andere personen in het bedrijf of de inrichting; 4°. het alarmeren van en
      samenwerken met hulpverleningsorganisaties in verband met de in de onderdelen 1 tot en met 3 bedoelde bijstand;
        - *beschikbaarheidsdiensten:* het gedurende werktijden oproepbaar zijn, teneinde in geval van alarm of ongeval
      terstond eerste hulp te kunnen verlenen;
        - *commandant:* de functionaris, genoemd in de Regeling aanwijzing commandanten defensie.
        - *coördinator BHV:* de bedrijfshulpverlener die sturing geeft aan een aantal BHV’ers binnen een aan hem toegewezen
      gebouw dan wel cluster van gebouwen waarbij deze taak geen deel uitmaakt van zijn normale werkzaamheden.
        - *daadwerkelijk inzetbaar:* op de standplaats aanwezig en beschikbaar zijn voor het verrichten van
      bedrijfshulpverlenings- of EHBO-taken;
        - *deeltijder:* de ambtenaar die in deeltijd is aangesteld dan wel de militair die buitengewoon verlof in verband
      met deeltijdarbeid geniet;
        - *EHBO-er:* de ambtenaar of de militair die in het bezit is van een geldig diploma Eerste Hulp Bij Ongelukken
      (EHBO) met de aantekening reanimatie en die geen deel uitmaakt van een bedrijfshulpverleningsorganisatie maar naast
      zijn normale werkzaamheden is aangewezen voor beschikbaarheidsdiensten op basis van het bedrijfsnoodplan;
        - *hoofd bedrijfshulpverlening:* de bedrijfshulpverlener die aan het hoofd van de bedrijfshulpverleningsorganisatie
      staat en waarbij deze taak geen deel uitmaakt van zijn normale werkzaamheden;
        - *militair:* een militair als bedoeld in
      [artikel 1, eerste lid, onder c, van het Algemeen militair ambtenarenreglement][ref2];
        - *ontruimingsfunctionaris:* een ambtenaar of militair die de cursus ontruimen heeft gevolgd en die als zodanig is
      aangewezen om in noodsituaties alle werknemers en andere personen in het bedrijf of de inrichting te alarmeren en
      te evacueren;
        - *ploegleider:* een bedrijfshulpverlener die als zodanig is aangewezen om tijdens het verrichten van
      bedrijfshulpverleningstaken leiding te geven aan de hem toegewezen bedrijfshulpverleners;


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel1
