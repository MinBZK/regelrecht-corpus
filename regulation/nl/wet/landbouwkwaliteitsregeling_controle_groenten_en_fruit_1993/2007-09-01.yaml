  - number: 1a
    text: |-
      De minister is als coördinerende autoriteit belast met de taken, vermeld in de artikelen 3, 4, vierde lid, 7, zesde
      lid, en 10, eerste en tweede lid, van [verordening 1148/2001](32001R1148) en beheert daartoe een gegevensbank.
    url: https://wetten.overheid.nl/BWBR0005914/2007-09-01#Artikel1a
  - number: '2'
    text: |-
      1 Keuring van groenten en fruit, als bedoeld in [artikel 7 van het besluit][ref1] geschiedt overeenkomstig de
      bepalingen van deze regeling en, voor zover het betreft keuring door het K.C.B. overeenkomstig de voorschriften,
      vervat in het controlereglement van die instelling.

      2 De keuring heeft betrekking op de eisen bedoeld in de [artikelen 3][ref2], [4][ref3] en
      [5 van het besluit][ref4] en geschiedt steekproefsgewijs.

      3 Indien de keuring groenten en fruit betreft, waarvoor gemeenschappelijke kwaliteitsnormen zijn vastgesteld,
      geschiedt de keuring overeenkomstig de in artikel 9 van [verordening 1148/2001](32001R1148) respectievelijk artikel
      4 van [verordening 2898/95](31995R2898) vastgelegde controlemethode.


      [ref1]: https://wetten.overheid.nl/BWBR0003120#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003120#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003120#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0003120#Artikel5
    url: https://wetten.overheid.nl/BWBR0005914/2007-09-01#Artikel2
