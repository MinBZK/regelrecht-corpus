preamble:
  text: |-
    Overwegende dat de Nederlandse regelgeving inzake de kwaliteitscontroles op groenten en fruit dient te worden
    aangepast aan de Verordening (EEG) 2251/92 van de Commissie van de Europese Gemeenschappen van 29 juli 1992 inzake
    de kwaliteitscontrole van verse groenten en fruit (Pb EG L 219);

    Gelet op de artikelen 4, 5, 7, 8 en 10 van het Landbouwkwaliteitsbesluit Groenten en Fruit;

    Gezien de adviezen van het Produktschap voor Groenten en Fruit, het Kwaliteits-Controle-Bureau voor Groenten en
    Fruit, het Bedrijfschap voor de Groothandel en Tussenpersonen in Groenten en Fruit en het Bedrijfschap voor de
    Detailhandel in Aardappelen, Groenten en Fruit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005914/2007-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *K.C.B.:* Kwaliteits-Controle-Bureau, gevestigd te 's-Gravenhage;
        - *besluit:* [ Landbouwkwaliteitsbesluit groenten en fruit][ref1];
        - *gemeenschappelijke kwaliteitsnormen:* kwaliteitsnormen voor groenten en fruit vastgesteld op basis van
      [verordening (EG) nr. 2200/96](31996R2200) van de Raad van de Europese Unie van 28 oktober 1996 houdende een
      gemeenschappelijke ordening der markten in de sector groenten en fruit (PbEG L 297);
        - [
                  ](32001R1148) [verordening (EG) nr. 1148/2001](32001R1148) van de Commissie van de Europese
      Gemeenschappen van 12 juni 2001 betreffende de handelsnormcontroles voor verse groenten en fruit (PbEG 156), zoals
      deze is gewijzigd bij [verordening (EG) nr. 2379/2001](32001R2379) van de Commissie van de Europese Gemeenschappen
      van 5 december 2001 (PbEG L 231)
        - [
                  ](31995R2898) [verordening (EG) nr 2898/95](31995R2898) van de Commissie van 15 december 1995 houdende
      voorschriften inzake de controle op de naleving van de kwaliteitsnormen in de sector bananen (PbEG L 304);.
        - *derde land:* gebied dat geen deel uitmaakt van het grondgebied van de Europese Unie of een gebied waarop de
      Overeenkomst betreffende de Europese Economische Ruimte niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003120
    url: https://wetten.overheid.nl/BWBR0005914/2007-09-01#Artikel1
