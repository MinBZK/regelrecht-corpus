        artikel: '5'
  - number: 2a
    text: |-
      1 Een ieder die groenten en fruit verhandelt vermeldt op de facturen en de begeleidende documenten de
      kwaliteitsklasse, het land van oorsprong en indien van toepassing de industriële bestemming van het product. Deze
      verplichting geldt niet voor de verkoop in de detailhandel aan de consument.

      2 De verpakkers van producten bestemd voor industriële verwerking brengen duidelijk zichtbaar op de verpakking
      een etiket aan met de vermelding "bestemd voor industriële verwerking" of een andere vermelding van dezelfde
      strekking. In het geval van onverpakte goederen die rechtstreeks op een vervoermiddel worden geladen, wordt deze
      vermelding aangegeven op een notitie die de zending vergezelt of die op een zichtbare plaats in het vervoermiddel
      is aangebracht.
    url: https://wetten.overheid.nl/BWBR0005914/2007-09-01#Artikel2a
  - number: '3'
    text: |-
      1 Het K.C.B is belast met de keuring van groenten en fruit die via Nederland binnen het handelsverkeer in de
      Europese Gemeenschap worden gebracht.

      2 Indien het groenten en fruit betreft waarvoor gemeenschappelijke kwaliteitsnormen bestaan, verricht het K.C.B
      daarop voordat zij binnen het douanegebied van de Europese Gemeenschap worden binnengebracht een normcontrole
      overeenkomstig het bepaalde in de artikelen 9 en 10, tweede lid, van [verordening 1148/2001](32001R1148)
      respectievelijk artikel 4 van [verordening 2898/95](31995R2898).

      3 Het K.C.B kan besluiten de in het tweede lid bedoelde controles achterwege te laten wanneer de produkten bestemd
      zijn om zonder verdere bewerking te worden uitgevoerd naar een derde land. Van het achterwege laten van de controle
      wordt mededeling gedaan aan de douane, bij voorkeur door een aantekening op de in [artikel 4][ref1] bedoelde
      kennisgeving.

      4 Het tweede lid is niet van toepassing op groenten en fruit afkomstig uit derde landen met een erkende officiële
      controledienst als bedoeld in artikel 7 van [verordening 1148/2001](32001R1148), indien deze groenten en fruit
      vergezeld gaan van het in bijlage 1 bij die verordening vastgestelde controlebewijs, waarvan de geldigheidsduur
      nog niet is verstreken. In dit geval verricht het K.C.B geregeld controles als bedoeld in artikel 7, lid vijf en
      vijfbis, van [verordening 1148/2001](32001R1148) en neemt de minister indien van toepassing de in deze artikelen
      voorgeschreven maatregelen.

      5 Het bepaalde in het tweede lid is niet van toepassing indien aan degene die uit derde landen ingevoerde bananen
      in de handel brengt, ingevolge artikel 7, eerste lid, van [verordening 2898/95](31995R2898) op een daartoe
      strekkend verzoek vrijstelling is verleend. In dat geval verricht het K.C.B geregeld controles, bedoeld in artikel
      7, derde lid, van [verordening 2898/95](31995R2898).

      6 Het K.C.B is belast met:

      a. de afgifte van certificaten van industriële bestemming, op basis van door het K.C.B verrichte controles als
      bedoeld in artikel 8, tweede en derde lid, van [verordening 1148/2001](32001R1148);

      b. het verlenen van vrijstellingen en de afgifte van vrijstellingscertificaten, bedoeld in artikel 7, eerste lid,
      van [verordening 2898/95](31995R2898).


      [ref1]: https://wetten.overheid.nl/BWBR0005914#Artikel4
    url: https://wetten.overheid.nl/BWBR0005914/2007-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005914
        artikel: '4'
        paragraaf: '2'
  - number: '4'
    text: |-
      1 Alvorens groenten en fruit van herkomst uit derde landen op het grondgebied van de Gemeenschap worden gebracht,
      wordt het K.C.B door de importeur of diens vertegenwoordiger tijdig in kennis gesteld aan welke grenscontrolepost
      de produkten zullen worden aangeboden, wat de aard en het volume van de zending is, uit hoeveel partijen deze
      bestaat en op welke datum en zo mogelijk het tijdstip waarop de zending naar verwachting zal aankomen. Deze
      kennisgeving dient zo mogelijk schriftelijk te geschieden.

      2 Indien een partij groenten en fruit van herkomst uit een derde land blijkens de normcontrole niet voldoet aan het
      bij of krachtens het besluit bepaalde, dienen deze groenten en fruit tijdens het vervoer naar een plaats, alwaar
      ze in Nederland opnieuw worden gesorteerd, verpakt of geëtiketteerd, te worden vergezeld van een door het K.C.B
      afgegeven formulier.

      3 Nadat een partij, als bedoeld in het tweede lid, in overeenstemming is gebracht met het bij of krachtens
      het besluit bepaalde, dient de partij opnieuw ter keuring bij het K.C.B te worden aangeboden. Het afvoeren,
      verhandelen, vernietigen of vervreemden van de partij is slechts toegestaan nadat de minister hiervoor toestemming
      heeft gegeven.

      4 Indien de normcontrole van groenten en fruit van herkomst uit derde landen naar het oordeel van het K.C.B om
      technische redenen niet kan geschieden op de plaats waar deze produkten op het grondgebied van de Gemeenschap zijn
      gebracht, dienen deze produkten tijdens het vervoer van deze plaats naar de plaats van lossing te worden vergezeld
      van een formulier.

      5 In gevallen, waarin het vierde lid van toepassing is, dient de aanmelding als bedoeld in het eerste lid opnieuw
      te geschieden zodra de betreffende zending op de plaats van lossing is aangekomen.
    url: https://wetten.overheid.nl/BWBR0005914/2007-09-01#Artikel4
  - number: '5'
    text: |-
      1 Het K.C.B. is ten aanzien van zendingen groenten en fruit belast met de in de artikelen 4 en 5 van verordening
      1148/2001 bedoelde normcontroles en de afgifte van certificaten, bedoeld in artikel 5, tweede lid, van verordening
      1148/2001, alsmede van certificaten, bedoeld in artikel 8, tweede lid, van verordening 1148/2001.

      2 Het K.C.B. is tevens belast met de in artikel 8 van verordening 2898/95 bedoelde onaangekondigde incidentele
      controles.

      3 Degene die voornemens is een zending groenten en fruit naar derde landen uit te voeren, stelt de instantie
      welke ingevolge deze regeling belast is met de afgifte van certificaten als bedoeld in artikel 5, tweede lid,
      van [verordening 1148/2001](32001R1148), tijdig in kennis van aard en volume van de zending en de plaats en het
      tijdstip waarop de normcontrole ter afgifte van het certificaat kan plaatsvinden.

      4 Vrijstellingen als bedoeld in artikel 4, derde lid, van verordening 1148/2001 worden verleend door het K.C.B.

      5 Indien bij een normcontrole wordt vastgesteld dat een partij groenten en fruit, die zich in het vrije verkeer
      binnen de Unie bevindt, niet voldoet aan de regelen gesteld bij of krachtens het besluit, dienen deze producten
      tijdens het vervoer naar een plaats, waar zij in overeenstemming worden gebracht met de bedoelde regelen, te
      worden vergezeld van een door de betrokken instantie af te geven formulier. Nadat de partij met de voorschriften in
      overeenstemming is gebracht, dient de partij opnieuw aan de betrokken instantie ter keuring te worden aangeboden.
      Het afvoeren, verhandelen, vernietigen of vervreemden van de partij is slechts toegestaan nadat het K.C.B.,
      hiervoor toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0005914/2007-09-01#Artikel5
  - number: '8'
    text: De Landbouwkwaliteitsbeschikking keuring groenten en fruit wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005914/2007-09-01#Artikel8
  - number: '9'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005914/2007-09-01#Artikel9
  - number: '10'
    text: |-
      Deze regeling kan worden aangehaald als: Landbouwkwaliteitsregeling controle groenten en fruit 1993.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0005914/2007-09-01#Artikel10
