---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: subsidieregeling_opwekken_duurzame_elektriciteit_in_vergistingsinstallaties
regulatory_layer: WET
publication_date: '2009-12-18'
valid_from: '2007-05-31'
bwb_id: BWBR0023773
url: https://wetten.overheid.nl/BWBR0023773/2007-05-31
preamble:
  text: |-
    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel1
  - number: 1.a
    text: 'Minister: de Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel1
  - number: 1.b
    text: |-
      duurzame elektriciteit: de elektriciteit als bedoeld in
      [artikel 1, onderdeel u, van de Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: 1.d
    text: |-
      vergistingsinstallatie: een samenstel van voorzieningen waarmee duurzame elektriciteit wordt
      geproduceerd door het vergisten van dierlijke mest en een of meer producten genoemd in de
      [Meststoffenbeschikking 1977, bijlage I, hoofdstuk III][ref1], typeaanduiding ‘co-vergiste mest’ of van
      landbouwgewassen waarvan het digistaat op grond van een ontheffing krachtens het Meststoffenbesluit 1977 is
      toegelaten als meststof, waarbij onder een samenstel van voorzieningen wordt verstaan, alle aanwezige middelen
      die onderling met elkaar zijn verbonden voor het vergisten van voornoemde producten en het omzetten van het
      geproduceerde biogas in duurzame elektriciteit;


      [ref1]: https://wetten.overheid.nl/BWBR0003122
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003122
  - number: 1.e
    text: |-
      producent: een natuurlijke persoon of rechtspersoon die duurzame elektriciteit produceert door het in stand houden
      van een vergistingsinstallatie;
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel1
  - number: 1.f
    text: |-
      net: een net als bedoeld in [artikel 1, onderdeel i, van de Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: 1.g
    text: |-
      garantie van oorsprong: een garantie van oorsprong als bedoeld in
      [artikel 1, onderdeel x, van de Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: '2'
    text: |-
      De Minister kan op aanvraag subsidie verstrekken aan een producent die duurzame elektriciteit opwekt met een
      vergistingsinstallatie die is aangesloten op het Nederlandse net.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel2
  - number: '3'
    text: |-
      Geen subsidie als bedoeld in [artikel 2][ref1], wordt verstrekt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0023773#Artikel2
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023773
        artikel: '2'
        paragraaf: '1'
  - number: 3.a
    text: |-
      voor dezelfde vergistingsinstallatie op grond van [artikel 72m van de Elektriciteitswet 1998][ref1] reeds subsidie
      van meer dan € 0,00 is verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72m
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 72m
  - number: 3.b
    text: de vergistingsinstallatie een nominaal opgesteld elektrisch vermogen van meer dan 2 MW heeft, en
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel3
  - number: 3.c
    text: |-
      de voor de ingebruikname van de vergistingsinstallatie benodigde vergunningen niet voor 18 augustus 2006 zijn
      aangevraagd.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel3
  - number: '4.1'
    text: |-
      De Minister stelt de maximum jaarproductie in kWh van de subsidie-ontvanger vast op basis van een opgave van de
      subsidie-aanvrager die is onderbouwd met gegevens betreffende de capaciteit van de vergistingsinstallatie.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel4
  - number: '4.2'
    text: |-
      De subsidie bedraagt jaarlijks ten hoogste de in de beschikking tot subsidieverlening vastgestelde maximum
      jaarproductie in kWh vermenigvuldigd met € 0,097.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel4
  - number: '4.3'
    text: |-
      De Minister kan reeds ontvangen of genoten overheidssteun dan wel in de toekomst te ontvangen of te genieten
      overheidssteun voor de vergistingsinstallatie die er toe leidt dat de totale verleende overheidssteun meer bedraagt
      dan het verschil tussen enerzijds de kostprijs van met een vergistingsinstallatie opgewekt duurzame elektriciteit
      en anderzijds de gemiddelde marktprijs van elektriciteit in mindering brengen door wijziging van het in de
      beschikking tot subsidieverlening vastgestelde maximum jaarproductie in kWh.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel4
  - number: '5'
    text: Het subsidieplafond voor het verlenen van subsidies op grond van deze regeling bedraagt € 326.000.000.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel5
  - number: '6.1'
    text: |-
      De Minister verdeelt het beschikbare bedrag in de volgorde van de datum van ontvangst van de aanvragen, met dien
      verstande dat indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen
      van de aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft
      gehad de aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de wettelijke voorschriften als datum van
      ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '6.2'
    text: |-
      Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het beschikbare
      subsidieplafond zou worden overschreden, stelt de Minister de volgorde van ontvangst van deze aanvragen vast door
      middel van loting.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel6
  - number: '6.3'
    text: |-
      Aanvragen die worden ontvangen op werkdagen na 17.00 uur of andere dagen, worden aangemerkt als ontvangen op de
      eerstvolgende werkdag.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel6
  - number: '6.4'
    text: |-
      Aanvragen om subsidie op grond van deze regeling moeten zijn ontvangen in de periode die aanvangt op 19 december
      2006 en eindigt op de dag dat dit lid in werking treedt.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel6
  - number: '7.1'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van een formulier, overeenkomstig het model dat is
      opgenomen in de bij deze regeling behorende [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023773
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0023773
  - number: '7.2'
    text: 'De aanvraag gaat, overeenkomstig hetgeen op het formulier is vermeld vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel7
  - number: 7.2.a
    text: een gespecificeerde omschrijving van de vergistingsinstallatie waarvoor subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel7
  - number: 7.2.b
    text: een onderbouwde opgave van de maximum jaarlijkse hoeveelheid op te wekken en in te voeden kWh;
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel7
  - number: 7.2.c
    text: indien voor de vergistingsinstallatie enige vergunning is vereist, door het bevoegde gezag afgegeven vergunningen;
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel7
  - number: 7.2.d
    text: overige op het formulier aangegeven bescheiden.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel7
  - number: '8.1'
    text: |-
      De Minister geeft een beschikking tot subsidieverlening binnen dertien weken na ontvangst van de aanvraag onder
      voorbehoud van goedkeuring van de Commissie van de Europese Gemeenschappen voor deze regeling.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel8
  - number: '8.2'
    text: De Minister kan de beslistermijn, genoemd in het eerste lid, éénmaal met 13 weken verlengen.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel8
  - number: '9'
    text: |-
      In de beschikking tot subsidieverlening wordt bepaald dat de voor subsidie in aanmerking komende periode aanvangt
      op het in de beschikking aangegeven tijdstip doch uiterlijk 24 maanden na de datum van de subsidie-aanvraag en
      eindigt 10 jaar na dit tijdstip.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel9
  - number: '10'
    text: |-
      De Minister beslist in ieder geval afwijzend op een aanvraag om subsidie indien de aanvraag niet voldoet aan het
      bij of krachtens deze regeling bepaalde.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel10
  - number: '11'
    text: |-
      In geval van tussentijdse overdracht van de eigendom of exploitatie van een vergistingsinstallatie, kan met
      toestemming van de Minister een beschikking tot subsidieverlening aan een andere producent worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel11
  - number: '12.1'
    text: |-
      De subsidie-ontvanger start de realisatie van de vergistingsinstallatie binnen 12 maanden na de datum van de
      beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel12
  - number: '12.2'
    text: |-
      De subsidie-ontvanger neemt de vergistingsinstallatie uiterlijk binnen 6 maanden na aanvang van de subsidieperiode
      in gebruik hetgeen blijkt uit het invoeden van met de vergistingsinstallatie opgewekte duurzame elektriciteit op
      het net.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel12
  - number: '12.3'
    text: |-
      De Minister kan op verzoek van de subsidie-ontvanger de termijn bedoeld in het eerste en tweede lid in geval van
      overmacht eenmalig met ten hoogste 12 maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel12
  - number: '12.4'
    text: |-
      De Minister trekt de beschikking tot subsidieverlening in indien de subsidie-ontvanger niet voldoet aan het
      bepaalde in het eerste, tweede of derde lid.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel12
  - number: '12.5'
    text: |-
      De subsidie-ontvanger neemt en houdt de vergistingsinstallatie in gebruik overeenkomstig de specificaties van de
      vergistingsinstallatie zoals vermeld in de beschikking tot subsidieverlening, behoudens voorafgaande goedkeuring
      van de Minister voor het essentieel wijzigen van de vergistingsinstallatie.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel12
  - number: '13'
    text: |-
      De subsidie-ontvanger doet onverwijld mededeling aan de Minister van de indiening bij de rechtbank van een verzoek
      tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening van
      surséance aan hem of tot faillietverklaring van hem.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel13
  - number: '14.1'
    text: |-
      Op een subsidie waarvan een beschikking tot subsidieverlening geldt, verstrekt de Minister op aanvraag maximaal
      zesmaal per jaar voorschotten.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel14
  - number: '14.2'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van een formulier overeenkomstig het model dat is opgenomen in de bij
      deze regeling behorende [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023773
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0023773
  - number: '14.3'
    text: 'De eerste aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel14
  - number: 14.3.a
    text: |-
      een kopie van het resultaat van het onderzoek naar de productie-installatie als bedoeld in
      [artikel 2, derde lid, van de Regeling garanties van oorsprong duurzame elektriciteit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel2
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '2'
  - number: 14.3.b
    text: |-
      een overzicht van de aan de producent uitgegeven garanties van oorsprong betreffende de maanden waarover een
      voorschot wordt gevraagd, en
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel14
  - number: 14.3.c
    text: |-
      een kopie van de biomassaverklaring als bedoeld in
      [artikel 7, derde lid, van de Regeling garanties van oorsprong duurzame elektriciteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel7
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '7'
  - number: '14.4'
    text: 'De volgende aanvragen gaan telkens vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel14
  - number: 14.4.a
    text: |-
      een overzicht van de aan de producent uitgegeven garanties van oorsprong betreffende de maanden waarover een
      voorschot wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel14
  - number: 14.4.b
    text: |-
      telkens wanneer de netbeheerder het resultaat van het onderzoek naar de productie-installatie als bedoeld in
      [artikel 2 van de Regeling garanties van oorsprong][ref1] vaststelt, een kopie van die verklaring;


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel2
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '2'
  - number: 14.4.c
    text: |-
      telkens wanneer de subsidie-ontvanger een biomassaverklaring als bedoeld in
      [artikel 7, derde en vierde lid, van de Regeling garanties van oorsprong][ref1] aan de garantiebeheerinstantie
      overlegt, een kopie van die verklaring, en


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel7
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '7'
  - number: 14.4.d
    text: |-
      telkens wanneer de subsidie-ontvanger een accountantsverklaring als bedoeld in
      [artikel 12, eerste lid, van de Regeling garanties van oorsprong][ref1] duurzame elektriciteit aan de
      garantiebeheerinstantie overlegt, een kopie van die verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel12
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '12'
  - number: '14.5'
    text: |-
      Een voorschot wordt berekend door het aantal kWh’s dat correspondeert met het aantal aan de producent uitgegeven
      garanties van oorsprong voor de installatie waarvoor subsidie is verstrekt te vermenigvuldigen met het op grond van
      [artikel 4, tweede lid][ref1], vastgestelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0023773#Artikel4
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0023773
        artikel: '4'
        paragraaf: '1'
  - number: '14.6'
    text: |-
      De Minister verstrekt per jaar voorschotten tot ten hoogste de in de beschikking tot subsidieverlening vastgestelde
      maximum jaarproductie in kWh’s.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel14
  - number: '15'
    text: |-
      De Minister kan afwijzend beschikken op een aanvraag om een voorschot indien de subsidie-ontvanger niet heeft
      voldaan aan ingevolge de subsidieverlening voor hem geldende verplichtingen, indien hij failliet is verklaard of
      aan hem surséance is verleend of ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing
      is verklaard, dan wel een verzoek daartoe bij de rechtbank is ingediend.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel15
  - number: '16.1'
    text: |-
      De subsidie-ontvanger dient zijn aanvraag om subsidievaststelling in binnen dertien weken na het tijdstip waarop de
      voor subsidie in aanmerking komende periode is verstreken.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel16
  - number: '16.2'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van het origineel van een formulier overeenkomstig het model dat is
      opgenomen in de bij deze regeling behorende [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023773
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0023773
  - number: '16.3'
    text: |-
      De aanvraag gaat, overeenkomstig in het formulier is vermeld, vergezeld van de in het formulier aangegeven
      bescheiden.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel16
  - number: '17'
    text: |-
      De Minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag daartoe
      dan wel nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel17
  - number: '18'
    text: |-
      Deze regeling treedt in werking met ingang van twee weken na de dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel18
  - number: '19'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling opwekken duurzame elektriciteit in vergistingsinstallaties.'
    url: https://wetten.overheid.nl/BWBR0023773/2007-05-31#Artikel19
