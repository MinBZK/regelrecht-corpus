  - number: '2'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2002, tenzij Onze Minister in het departementaal overleg
      met de centrales van verenigingen van ambtenaren overeenstemming heeft bereikt om voor de onder hem ressorterende
      ambtenaren te bepalen dat dit besluit in werking treedt op een datum in het kalenderjaar 2001.
    url: https://wetten.overheid.nl/BWBR0012540/2002-01-01#Artikel2
