  text: |-
    Gelet op artikel 21h, tweede lid, van het Algemeen Rijksambtenarenreglement en artikel 34h, tweede lid, van het
    Ambtenarenreglement Staten-Generaal,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012540/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De bestedingsmogelijkheden, bedoeld in [artikel 21 h, eerste lid, van het Algemeen Rijksambtenarenreglement][ref1]
      en in [artikel 34h, tweede lid van het Ambtenarenreglement Staten-Generaal][ref2], zijn:

      a. vergoeding voor een personal computer of bijbehorende randapparatuur;

      b. vergoeding voor een fiets voor het woon-werkverkeer;

      c. vergoeding voor de kosten van kinderopvang;

      d. vergoeding voor studie/opleiding voor een beroep en vakliteratuur;

      e. extra pensioenopbouw binnen de ruimte die het pensioenreglement van de Stichting Pensioenfonds ABP biedt;

      f. aanvullende vergoeding van de kosten van openbaar vervoerbewijzen die mede voor het werk worden gebruikt;

      g. vergoeding voor de inrichting van een telewerkruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21h
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel34h
