---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: subsidieregeling_programma_starters_op_buitenlandse_markten_2003
regulatory_layer: WET
publication_date: '2004-11-05'
valid_from: '2003-12-20'
bwb_id: BWBR0014457
url: https://wetten.overheid.nl/BWBR0014457/2003-12-20
preamble:
  text: |-
    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.a
    text: '*minister:* de Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.b
    text: |-
      *ondernemer:* een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht is
      ingesteld, die een onderneming in stand houdt;
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.c
    text: '*groep:* een economische eenheid, waarin organisatorisch zijn verbonden:'
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.c.1°
    text: |-
      een natuurlijke persoon of privaatrechtelijke rechtspersoon, die direct of indirect: - meer dan de helft van het
      geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van of
        - overwegende zeggenschap heeft over
        - een of meer rechtspersonen of vennootschappen, en
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.c.2°
    text: laatstbedoelde rechtspersonen of vennootschappen;
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.d
    text: |-
      *ondernemersorganisatie:* een vereniging met volledige rechtsbevoegdheid die, blijkens haar statuten, tot doel
      heeft de belangen te behartigen van ondernemingen of organisaties van ondernemingen, die sinds meer dan een jaar
      een afdeling in haar bureauorganisatie heeft functioneren welke zich bezighoudt met de exportbevordering binnen
      de bedoelde ondernemingen en die in het kader van de uitvoering van deze regeling een overeenkomst met de minister
      heeft gesloten;
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.e
    text: |-
      *exportplan:* een door de ondernemer in samenwerking met een consulent internationale handel van een kamer van
      koophandel en fabrieken of een ondernemersorganisatie opgesteld plan van aanpak, gericht op het bewerken van een
      nieuwe buitenlandse markt, dat een inventarisatie bevat van de sterke en zwakke kanten, kansen en bedreigingen van
      de onderneming op exportgebied en aangeeft welke activiteiten zullen worden uitgevoerd om export naar een nieuwe
      buitenlandse markt te realiseren, bestaande uit:
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.e.1°
    text: marktverkenning,
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.e.2°
    text: het organiseren van een bezoekprogramma,
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.e.3°
    text: beursdeelname of
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.e.4°
    text: het ontwikkelen en produceren van presentatiemateriaal;
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.f
    text: |-
      *nieuwe buitenlandse markt:* een buitenlandse markt waarop de ondernemer gedurende twaalf maanden voorafgaand aan
      de indiening van de aanvraag om subsidie ten hoogste 3 procent van zijn totale fiscale omzet heeft gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.g
    text: |-
      *marktverkenning:* een schriftelijk verslag over de afzetmogelijkheden van een product of dienst in een land
      waarin zich een voor de aanvrager nieuwe buitenlandse markt bevindt, opgesteld door een in het betrokken land of de
      betrokken regio gevestigde organisatie die deskundig en ervaren is op het gebied van marktonderzoek;
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.h
    text: |-
      *organiseren van een bezoekprogramma:* het organiseren van een bezoek van een ondernemer aan een land waarin zich
      een voor hem nieuwe buitenlandse markt bevindt volgens een programma dat gericht is op het verkrijgen van inzicht
      in de afzetmogelijkheden van zijn product of dienst in het betrokken land en het leggen van contacten met mogelijke
      zakenpartners, verzorgd door een in dat land of de betrokken regio gevestigde organisatie;
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.h.i
    text: |-
      *beursdeelname:* deelname van een ondernemer aan een vak- of jaarbeurs in het buitenland of aan een internationale
      vak- of jaarbeurs door middel van een stand;
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: 1.h.j
    text: '*presentatiemateriaal:* schriftelijke, digitale en audiovisuele product- en bedrijfsinformatie.'
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel1
  - number: '2.1'
    text: |-
      De minister verstrekt op aanvraag een subsidie aan een ondernemer die voor eigen rekening en risico één of meer
      activiteiten als bedoeld in [artikel 1, onder e][ref1], uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0014457#Artikel1
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014457
        artikel: '1'
        paragraaf: '1'
  - number: '2.2'
    text: 'Geen subsidie wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel2
  - number: 2.2.a
    text: |-
      indien voor de activiteiten, genoemd in het exportplan, reeds door een bestuursorgaan of de Commissie van de
      Europese Gemeenschappen subsidie is verstrekt;
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel2
  - number: 2.2.b
    text: |-
      indien de aanvrager vóór het indienen van de aanvraag ter zake van de in het exportplan genoemde activiteiten reeds
      verplichtingen is aangegaan;
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel2
  - number: 2.2.c
    text: |-
      indien een eerder aan de aanvrager op grond van deze regeling, de Subsidieregeling programma starters op
      buitenlandse markten 2000 of de Subsidieregeling programma starters op buitenlandse markten 1999 verleende subsidie
      nog niet is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel2
  - number: 2.2.d
    text: |-
      indien aan de aanvrager al eerder subsidie is verleend op grond van één van de in onderdeel c genoemde regelingen
      voor activiteiten op dezelfde nieuwe buitenlandse markt;
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel2
  - number: 2.2.e
    text: |-
      aan een aanvrager die een onderneming in stand houdt als bedoeld in artikel 1, onder a, van [verordening (EG) nr.
      69/2001](32001R0069) van de Commissie van de Europese Gemeenschappen van 12 januari 2001 betreffende de toepassing
      van de artikelen 87 en 88 van het EG-verdrag op de de minimis-steun (Pb EG L 10);
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel2
  - number: 2.2.f
    text: |-
      indien, door een of meer bestuursorganen, aan de aanvrager in de drie aan de aanvraag voorafgaande jaren reeds €
      100 000 of meer aan subsidie is verstrekt zonder goedkeuring van de Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel2
  - number: '3.1'
    text: |-
      De subsidie bedraagt 50 procent van de rechtstreeks aan de in het exportplan genoemde activiteiten toe te rekenen,
      na de indiening van de aanvraag door de subsidie-ontvanger, gemaakte en betaalde kosten, maar niet meer dan € 11
      500 en met dien verstande dat de subsidie per activiteit niet meer bedraagt dan de helft van dit bedrag.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel3
  - number: '3.2'
    text: |-
      Het bedrag van de subsidie wordt verlaagd voor zover dit tezamen met in de drie voorafgaande jaren door een
      bestuursorgaan aan de aanvrager verstrekte subsidie waarvoor geen goedkeuring van de Commissie van de Europese
      Gemeenschappen was verkregen, meer bedraagt dan € 100 000.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel3
  - number: '4.1'
    text: |-
      Als kosten van een marktverkenning worden uitsluitend in aanmerking genomen de kosten die aan de subsidie-ontvanger
      in rekening worden gebracht door de in het betrokken land of de betrokken regio gevestigde organisatie die
      deskundig en ervaren is op het gebied van marktonderzoek.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel4
  - number: '4.2'
    text: |-
      Als kosten van een bezoekprogramma worden uitsluitend in aanmerking genomen de kosten die aan de subsidie-ontvanger
      in rekening worden gebracht door de in het betrokken land of de betrokken regio gevestigde organisatie, reis- en
      verblijfkosten van de subsidie-ontvanger daaronder niet begrepen.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel4
  - number: '4.3'
    text: |-
      Als kosten van beursdeelname worden uitsluitend in aanmerking genomen de kosten van de huur van de benodigde ruimte
      en de kosten van de huur en de opbouw van de stand.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel4
  - number: '4.4'
    text: |-
      Als kosten van presentatiemateriaal worden uitsluitend in aanmerking genomen de kosten van schriftelijke, digitale
      en audiovisuele product- en bedrijfsinformatie die aan de subsidie-ontvanger in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel4
  - number: '5.1'
    text: |-
      Ieder begrotingsjaar wordt bij ministeriële regeling een subsidieplafond vastgesteld voor het in dat jaar verlenen
      van subsidies op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel5
  - number: '5.2'
    text: Het subsidieplafond voor het in 2003 verlenen van subsidies bedraagt € 5 855 000.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel5
  - number: '6.1'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat is
      opgenomen in de [bij deze regeling behorende bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014457
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014457
  - number: '6.2'
    text: |-
      De aanvraag gaat vergezeld van een exportplan volgens het model dat is opgenomen in de
      [bij deze regeling behorende bijlage 2][ref1] en een begroting voor de activiteiten, opgenomen in het exportplan,
      alsmede van andere bescheiden overeenkomstig hetgeen in het formulier is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0014457
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014457
  - number: '7'
    text: De minister geeft een beschikking binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel7
  - number: '8.1'
    text: 'De minister beslist in ieder geval afwijzend op een aanvraag indien:'
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel8
  - number: 8.1.a
    text: de aanvraag niet voldoet aan deze regeling;
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel8
  - number: 8.1.b
    text: de aanvrager op het tijdstip van indiening van de aanvraag meer dan 100 werknemers in dienst heeft;
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel8
  - number: 8.1.c
    text: |-
      de aanvraag een nieuwe buitenlandse markt binnen de Europese Unie betreft en de aanvrager in de twaalf maanden
      voorafgaand aan de datum van indiening van de aanvraag meer dan 20 procent van zijn omzet uit exportactiviteiten
      behaalde;
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel8
  - number: 8.1.d
    text: |-
      de aanvraag een nieuwe buitenlandse markt buiten de Europese Unie betreft en de aanvrager in de twaalf maanden
      voorafgaand aan de datum van indiening van de aanvraag meer dan 30 procent van zijn omzet uit exportactiviteiten
      behaalde.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel8
  - number: '8.2'
    text: |-
      Voor de bepaling van het aantal werknemers dat bij de aanvrager in dienst is worden, indien hij tot een groep
      behoort, de bij de tot die groep behorende natuurlijke personen of rechtspersonen in dienst zijnde werknemers
      in aanmerking genomen en worden deeltijdwerkers naar evenredigheid van de met hen overeengekomen arbeidsduur in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel8
  - number: '9'
    text: |-
      De minister verdeelt het beschikbare bedrag in de volgorde van ontvangst van de aanvragen, met dien verstande
      dat, indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de wettelijke voorschriften met betrekking tot de
      verdeling als datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '10'
    text: |-
      Op de subsidie-ontvanger rusten de in de [artikelen 11][ref1] en [12][ref2] opgenomen verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0014457#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0014457#Artikel12
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014457
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014457
        artikel: '12'
        paragraaf: '3'
  - number: '11.1'
    text: |-
      De subsidie-ontvanger voert de activiteiten uit overeenkomstig het exportplan waarop de subsidieverlening
      betrekking heeft en voltooit deze binnen 18 maanden na de subsidieverlening, behoudens voorafgaande schriftelijke
      ontheffing van de minister voor het vertragen, essentieel wijzigen, of stopzetten van de uitvoering van de
      activiteiten.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel11
  - number: '11.2'
    text: Aan een ontheffing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel11
  - number: '12.1'
    text: |-
      De subsidie-ontvanger voert een administratie die zodanig is ingericht, dat daaruit te allen tijde op eenvoudige en
      duidelijke wijze alle aan de activiteiten toe te rekenen kosten kunnen worden afgelezen.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel12
  - number: '12.2'
    text: |-
      De subsidie-ontvanger doet onverwijld mededeling aan de minister van de indiening bij de rechtbank van een verzoek
      tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening van
      surseance van betaling aan hem of tot faillietverklaring van hem.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel12
  - number: '13.1'
    text: |-
      De subsidie-ontvanger dient zijn aanvraag om subsidievaststelling in binnen dertien weken na het tijdstip waarop de
      activiteiten ingevolge [artikel 11, eerste lid][ref1], moeten zijn voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0014457#Artikel11
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014457
        artikel: '11'
        paragraaf: '3'
  - number: '13.2'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat is opgenomen in
      de [bij deze regeling behorende bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014457
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014457
  - number: '13.3'
    text: 'De aanvraag gaat, overeenkomstig hetgeen in het formulier is vermeld, vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel13
  - number: 13.3.a
    text: |-
      afschriften van de op de activiteiten betrekking hebbende, aan de subsidie-ontvanger verstrekte, facturen en de
      desbetreffende betalingsbewijzen,
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel13
  - number: 13.3.b
    text: een eindverslag omtrent de uitvoering en de resultaten van de activiteiten,
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel13
  - number: 13.3.c
    text: overige in het formulier genoemde bescheiden.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel13
  - number: '14'
    text: |-
      De minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag daartoe
      dan wel nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel14
  - number: '15'
    text: |-
      De Subsidieregeling programma starters op buitenlandse markten 2000 wordt ingetrokken, met dien verstande dat
      zij van toepassing blijft op aanvragen om subsidie die zijn ingediend voor de datum van inwerkingtreding van deze
      regeling, op aanvragen om subsidie die voortvloeien uit exportstrategieën die voor die datum zijn ingediend en op
      subsidies die voor die datum zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel15
  - number: '16'
    text: Deze regeling treedt in werking met ingang van 1 januari 2003.
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel16
  - number: '17'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling programma starters op buitenlandse markten 2003.'
    url: https://wetten.overheid.nl/BWBR0014457/2003-12-20#Artikel17
