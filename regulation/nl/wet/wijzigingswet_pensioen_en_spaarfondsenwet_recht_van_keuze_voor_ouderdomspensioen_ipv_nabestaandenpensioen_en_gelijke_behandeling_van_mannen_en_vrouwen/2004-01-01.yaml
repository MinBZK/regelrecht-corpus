  - number: X
    text: |-
      1 De artikelen van deze wet met uitzondering van artikel I, onderdeel B, artikel 2b, derde lid, en artikel
      2c, onderdeel J, artikel 32, zevende lid, onderdeel M, artikel 32ba, eerste lid, onderdelen d en e, voor
      zover het betreft pensioen dat wordt berekend of mede wordt berekend op grond van een geldelijke bijdrage, en
      [artikel II][ref1] treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld. Het tijdstip van inwerkingtreding kan voorts
      ten aanzien van voorzieningen als bedoeld in [artikel 2, vierde lid, van de Pensioen- en spaarfondsenwet][ref2] en
      ten aanzien van vrijwillige pensioenvoorzieningen verschillend worden vastgesteld.

      2 [Artikel I, onderdeel B][ref3], artikel 2b, derde lid, en artikel 2c, onderdeel J, artikel 32, zevende lid,
      onderdeel M, artikel 32ba, eerste lid, onderdelen d en e, voor zover het betreft pensioen dat wordt berekend of
      mede wordt berekend op grond van een geldelijke bijdrage, en [artikel II][ref4] treden uiterlijk in werking op 1
      januari 2005.


