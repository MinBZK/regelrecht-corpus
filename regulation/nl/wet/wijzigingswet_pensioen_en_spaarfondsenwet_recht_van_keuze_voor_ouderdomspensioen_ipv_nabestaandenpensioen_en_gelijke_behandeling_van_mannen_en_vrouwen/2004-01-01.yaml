preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat in pensioenregelingen het recht van keuze
    voor ouderdomspensioen in plaats van nabestaandenpensioen nader wordt geregeld, dat de gelijke behandeling van
    mannen en vrouwen bij pensioenregelingen wordt uitgebreid en dat in pensioenregelingen, met uitzondering van het
    nabestaandenpensioen, geen onderscheid wordt gemaakt naar burgerlijke staat;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012090/2004-01-01#ArtikelAanhef
articles:
  - number: VIII
    text: |-
      1 Onze Minister zendt binnen zes jaar na inwerkingtreding van [artikel I, onderdeel B][ref1], van deze wet aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.

      2 In afwijking van het eerste lid vindt de evaluatie van de uitzonderingen, genoemd in
      [artikel X, eerste lid][ref2], plaats zes jaar na de in [artikel X, tweede lid][ref3], genoemde datum.

      3 Een ieder verstrekt aan Onze Minister of aan een bij ministeriële regeling aangewezen
      instelling desgevraagd alle inlichtingen die nodig zijn in verband met het onderzoek naar de
      doeltreffendheid en de effecten van deze wet en de op de [artikelen 2b, vijfde lid][ref4],
      [2c, tweede lid][ref5], en [32, negende lid, van de Pensioen- en spaarfondsenwet][ref6] en
      [artikel 12c, vijfde lid, van de Wet gelijke behandeling van mannen en vrouwen][ref7] berustende bepalingen.


