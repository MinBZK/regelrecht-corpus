  - number: IX
    text: |-
      1 [Artikel I, onderdeel B][ref1], [artikel 2b van de Pensioen- en spaarfondsenwet][ref2] is uitsluitend van
      toepassing op aanspraken op pensioen die vanaf de datum van inwerkingtreding van dat artikelonderdeel van de wet
      van 21 december 2000, houdende wijziging van de Pensioen- en spaarfondsenwet en enige andere wetten in verband met
      het recht van keuze voor ouderdomspensioen in plaats van nabestaandenpensioen en gelijke behandeling van mannen en
      vrouwen (Stb. 625), worden opgebouwd.

      2 [Artikel I, onderdeel C][ref3], [artikel 2c van de Pensioen- en spaarfondsenwet][ref4],
      onderdeel J, [artikel 32, zevende lid van de Pensioen- en spaarfondsenwet][ref5], onderdeel M,
      [artikel 32ba, eerste lid, onderdelen d en e, van de Pensioen- en spaarfondsenwet][ref6], en [artikel II][ref7],
      [artikel 12c, tweede lid, onderdeel a en b van de Wet gelijke behandeling van mannen en vrouwen][ref8] zijn
      uitsluitend van toepassing op aanspraken op pensioen die vanaf de datum van inwerkingtreding van het betreffende
      artikelonderdeel van de wet van 21 december 2000, houdende wijziging van de Pensioen- en spaarfondsenwet en enige
      andere wetten in verband met het recht van keuze voor ouderdomspensioen in plaats van nabestaandenpensioen en
      gelijke behandeling van mannen en vrouwen (Stb. 625), worden opgebouwd.

      3 Bij de toepassing van [artikel 32ba van de Pensioen- en spaarfondsenwet][ref9]
      is op pensioen of aanspraken op pensioen die vóór de dag van inwerkingtreding van
      [artikel 32ba, eerste lid, onderdeel e, van de Pensioen- en spaarfondsenwet][ref10] zijn opgebouwd,
      [artikel 32a, onderdeel f, van de Pensioen- en spaarfondsenwet][ref11] van toepassing, tenzij
      [artikel 32ba van de Pensioen- en spaarfondsenwet][ref12] wordt toegepast in verband met een keuze als
      bedoeld in [artikel 2b][ref13] of [2c van die wet][ref14] en het pensioenfonds in zijn statuten of reglementen
      [artikel 32ba, eerste lid, onderdeel d en e van de Pensioen- en spaarfondsenwet][ref15] van toepassing heeft
      verklaard.

      4 Voorzover het bij de toepassing van het eerste en tweede lid aanspraken op pensioen betreft die, als gevolg van
      een premievrije voortzetting van die aanspraken worden opgebouwd, zijn de in het eerste en tweede lid genoemde
      artikelen van de [Pensioen- en spaarfondsenwet][ref16] uitsluitend van toepassing indien het recht op die
      premievrije voortzetting is ontstaan op of na de datum van inwerkingtreding van het betreffende artikelonderdeel
      van de wet van 21 december 2000, houdende wijziging van de [Pensioen- en spaarfondsenwet][ref17] en enige andere
      wetten in verband met het recht van keuze voor ouderdomspensioen in plaats van nabestaandenpensioen en gelijke
      behandeling van mannen en vrouwen (Stb. 625).

      5 In afwijking van het tweede lid is artikel I, onderdeel J,
      [artikel 32, zevende lid, van de Pensioen- en spaarfondsenwet][ref18] voor zover het niet betreft pensioen dat
      wordt berekend of mede wordt berekend op grond van een geldelijke bijdrage slechts van toepassing op aanspraken op
      pensioen die vanaf 1 januari 2005 worden opgebouwd. Dit lid is niet van toepassing op afkoop die tot de datum van
      inwerkingtreding van de Verzamelwet sociale verzekeringen 2003 plaatsvindt.


