preamble:
  text: |-
    Gelet op artikel 3 van de Mandaatregeling Ministerie van Veiligheid en Justitie 2011;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0036071/2014-12-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Van het ingevolge artikel 1 van de Mandaatregeling DGVZ Ministerie van Veiligheid en Justitie 2012 aan
      de hoofddirecteur van de Immigratie- en Naturalisatiedienst verleende ondermandaat wordt ten aanzien van de
      aangelegenheden die hun directie betreffen ondermandaat verleend aan:

      a. de directeur van de klantdirectie Regulier Sociaal Brede Units;

      b. de directeur van de klantdirectie Regulier Sociaal Overig;

      c. de directeur van de klantdirectie Regulier Economisch;

      d. de directeur van de klantdirectie Asiel;

      e. de directeur van de klantdirectie Naturalisatie;

      f. de directeur van de directie Procesvertegenwoordiging;

      g. de directeur van de directie Speciale Diensten en Internationale Samenwerking;

      h. de directeur van de directie Uitvoeringsstrategie en Advies;

      i. de directeur van de directie Middelen en Control;

      j. de directeur van de directie Informatievoorziening;

      k. de directeur van de directie Human resource;

      l. het hoofd van het Bureau Ondersteuning Hoofddirectie;

      m. het hoofd van de afdeling Corporate Communicatie.
    url: https://wetten.overheid.nl/BWBR0036071/2014-12-31#Artikel1
  - number: '2'
    text: |-
      Als bevoegd gezag als bedoeld in het [Algemeen Rijksambtenarenreglement][ref1] ten aanzien van de onder hen
      ressorterende ambtenaren, worden aangewezen de ambtenaren, genoemd in kolom 1 van [bijlage 1][ref2] bij deze
      regeling, voor zover het betreft de uitoefening van de bevoegdheden, vermeld in kolom 2 van die bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0036071
    url: https://wetten.overheid.nl/BWBR0036071/2014-12-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001950
      - id: ref2
        bwb_id: BWBR0036071
  - number: '3'
    text: |-
      Als bevoegd om te beschikken over bedragen voor het aangaan van verplichtingen en voor het verrichten van uitgaven,
      worden aangewezen de ambtenaren, genoemd in kolom 1 van [bijlage 2][ref1] bij deze regeling voor zover het betreft
      de bedragen, genoemd in kolom 2 van die bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0036071
    url: https://wetten.overheid.nl/BWBR0036071/2014-12-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036071
  - number: '4'
    text: |-
      Als bevoegd om besluiten te nemen op het terrein van de vreemdelingenwetgeving en van de
      [rijkswet op het Nederlanderschap][ref1] worden aangewezen de ambtenaren genoemd in kolom 1 van [bijlage 3][ref2]
      bij deze regeling voor zover het betreft de rechtshandelingen, genoemd in de overige kolommen van die bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0003738
      [ref2]: https://wetten.overheid.nl/BWBR0036071
    url: https://wetten.overheid.nl/BWBR0036071/2014-12-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003738
      - id: ref2
        bwb_id: BWBR0036071
  - number: '5'
    text: |-
      Aan de hoofddirecteur blijft voorbehouden:

      a. de bevoegdheid tot het vaststellen van de kwalitatieve formatie;

      b. de bevoegdheid tot het nemen van niet-individuele personeelsbeslissingen;

      c. de bevoegdheid tot het nemen van besluiten inzake buitenlandse dienstreizen;

      d. de bevoegdheid tot inhuur van interim-management, organisatie- en formatieadvies, communicatieadvies en
      beleidsadvies;

      e. de bevoegdheid tot inhuur van uitzendkrachten dan wel andere externen binnen het primair proces;

      f. de bevoegdheid tot het aangaan van verplichtingen voor het huren van panden of het aanschaffen van ICT-
      apparatuur en/of software;

      g. de bevoegdheid tot de inkoop en inhuur van producten, middelen en diensten voor bedragen vanaf € 300.000.
    url: https://wetten.overheid.nl/BWBR0036071/2014-12-31#Artikel5
  - number: '6'
    text: |-
      Bij verhindering of afwezigheid van de hoofddirecteur treedt de plaatsvervangend hoofddirecteur in alle facetten
      als hoofddirecteur op.
    url: https://wetten.overheid.nl/BWBR0036071/2014-12-31#Artikel6
  - number: '7'
    text: |-
      De Algemene ondermandaatregeling van het hoofd Immigratie en Naturalisatiedienst 2005 en het
      [Mandaatbesluit personele en financiële aangelegenheden directeuren 2008][ref1], voor zover deze inhoudelijk al
      niet waren vervangen door het [Mandaatbesluit BZK 2012][ref2], worden ingetrokken.

      Voor zover het de Immigratie- en Naturalisatiedienst van het Ministerie van Veiligheid en Justitie betreft, wordt
      [artikel 9, tweede lid van de Mandaatregeling Ministerie van Veiligheid en Justitie 2011][ref3] ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0024283
      [ref2]: https://wetten.overheid.nl/BWBR0031837
      [ref3]: https://wetten.overheid.nl/BWBR0030842#Artikel9
    url: https://wetten.overheid.nl/BWBR0036071/2014-12-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024283
      - id: ref2
        bwb_id: BWBR0031837
      - id: ref3
        bwb_id: BWBR0030842
        artikel: '9'
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0036071/2014-12-31#Artikel8
  - number: '9'
    text: 'Deze regeling wordt aangehaald als: Mandaatregeling IND Ministerie van Veiligheid en Justitie 2014.'
    url: https://wetten.overheid.nl/BWBR0036071/2014-12-31#Artikel9
