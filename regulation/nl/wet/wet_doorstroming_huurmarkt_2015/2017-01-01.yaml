preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die zullen zien of horen lezen saluut! doen te weten:


    Alzo Wij in overweging genomen hebben dat het wenselijk is Boek 7 van het Burgerlijk Wetboek en enkele andere
    wetten zodanig te wijzigen dat nadere maatregelen worden genomen teneinde een verdere doorstroming op de huurmarkt
    te bevorderen;


    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037891/2017-01-01#ArtikelAanhef
articles:
  - number: IX
    text: >-
      Onze Minister voor Wonen en Rijksdienst in overeenstemming met Onze Minister van Veiligheid en Justitie zendt
      binnen vijf jaar na inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0037891/2017-01-01#ArtikelIX
  - number: X
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld. In dat besluit wordt zo nodig
      toepassing gegeven aan [artikel 12, eerste lid, van de Wet raadgevend referendum][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel12
    url: https://wetten.overheid.nl/BWBR0037891/2017-01-01#ArtikelX
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '12'
  - number: XI
    text: 'Deze wet wordt aangehaald als: Wet doorstroming huurmarkt 2015.'
    url: https://wetten.overheid.nl/BWBR0037891/2017-01-01#ArtikelXI
