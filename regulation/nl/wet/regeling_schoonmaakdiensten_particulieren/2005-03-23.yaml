---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_schoonmaakdiensten_particulieren
regulatory_layer: WET
publication_date: '2004-12-28'
valid_from: '2005-03-23'
bwb_id: BWBR0009136
url: https://wetten.overheid.nl/BWBR0009136/2005-03-23
preamble:
  text: |-
    Gelet op artikel 3, eerste lid, en artikel 8, eerste lid, van de Kaderwet SZW-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel1
  - number: 1.a
    text: '*de minister:* de Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel1
  - number: 1.b
    text: |-
      *werkgever:* een natuurlijk of rechtspersoon die werkgever is als bedoeld in
      [artikel 610 van titel 7.10 van het Burgerlijk Wetboek][ref1], als onderneming is ingeschreven bij de Kamer van
      Koophandel, als onderneming haar hoofd- of nevenberoep maakt van het verrichten van huishoudelijke diensten of
      daarmee verwante werkzaamheden en in die hoedanigheid consumentencontracten pleegt te sluiten;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 1.c
    text: |-
      *arbeidsovereenkomst:* een schriftelijk aangegane arbeidsovereenkomst als bedoeld in
      [artikel 610 van titel 7.10 van het Burgerlijk Wetboek][ref1] met de werkgever;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 1.d
    text: |-
      *consumentencontract:* een schriftelijke overeenkomst van de werkgever met een derde natuurlijke persoon tot
      het door zijn werknemer laten verrichten van een bepaald gevarieerd pakket van huishoudelijke diensten in de
      particuliere sfeer van die natuurlijke persoon over een bepaalde periode op een vastgesteld gemiddeld aantal uren
      per week en tegen een bedongen prijs;
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel1
  - number: 1.e
    text: '*OSB:* Ondernemersorganisatie schoonmaak- en bedrijfsdiensten;'
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel1
  - number: 1.f
    text: |-
      *verklaring:* een verklaring afgegeven door de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], dat


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '4'
  - number: 1.f.1
    text: |-
      de werknemer met wie de werkgever vóór 1 januari 2003 een arbeidsovereenkomst heeft
      gesloten langdurig werkloze is, overeenkomstig het voor die datum bepaalde bij of krachtens
      [hoofdstuk IV van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekering][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0007746#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007746
        hoofdstuk: IV
  - number: 1.f.2
    text: |-
      de werknemer met wie de werkgever na 1 januari 2003 een arbeidsovereenkomst heeft gesloten, minimaal zes maanden
      als werkloos werkzoekend bij de Centrale organisatie werk en inkomen ingeschreven heeft gestaan dan wel naar haar
      oordeel in vergelijkbare omstandigheden heeft verkeerd;
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel1
  - number: 1.g
    text: |-
      *accountant:* een accountant als bedoeld in [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '2.1'
    text: 'De minister verstrekt een subsidie aan de werkgever:'
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel2
  - number: 2.1.a
    text: |-
      die een arbeidsovereenkomst heeft gesloten met een persoon, voor
      wie de Centrale organisatie werk en inkomen met inachtneming van
      [hoofdstuk IV van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref1], zoals
      [deze wet][ref2] luidde voor 1 januari 2003, een verklaring als bedoeld in [artikel 1, onderdeel f, sub 1][ref3],
      heeft afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0007746#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007746
      [ref3]: https://wetten.overheid.nl/BWBR0009136#Artikel1
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007746
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007746
      - id: ref3
        bwb_id: BWBR0009136
        artikel: '1'
  - number: 2.1.b
    text: |-
      die een arbeidsovereenkomst met een overeengekomen gemiddelde arbeidsduur van ten minste 12 uur per week, berekend
      over een periode van 13 weken, heeft gesloten met een persoon voor wie de Centrale organisatie werk en inkomen een
      verklaring als bedoeld in [artikel 1, onderdeel f, sub 2][ref1], heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009136#Artikel1
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009136
        artikel: '1'
  - number: '2.2'
    text: |-
      Geen subsidie wordt verstrekt, indien een dienstbetrekking wordt aangegaan
      als bedoeld in de [Wet sociale werkvoorziening][ref1] of met toepassing van
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008903
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '7'
  - number: '2.3'
    text: |-
      Geen subsidie wordt verstrekt, indien de huishoudelijke diensten op basis van
      de consumentencontracten worden verleend in de vorm van thuiszorg als bedoeld in
      [artikel 15 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering door instellingen][ref1], die
      daarvoor op grond van de [Wet tarieven gezondheidszorg ][ref2]budget ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003356
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005283
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0003356
  - number: '2.4'
    text: Geen subsidie wordt verstrekt aan een werkgever die na 1 oktober 2004 voor het eerst subsidie aanvraagt.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel2
  - number: 2a
    text: |-
      Het subsidieplafond per werkgever is van 1 januari 2005 tot 1 juli 2005 vastgesteld overeenkomstig
      [bijlage B][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009136
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0009136
  - number: '3.1'
    text: |-
      De minister verleent de subsidie voor het in dienst hebben van personen als bedoeld in
      [artikel 2, eerste lid][ref1], rekening houdend met de omvang van de uitgevoerde werkzaamheden op die
      consumentencontracten.


      [ref1]: https://wetten.overheid.nl/BWBR0009136#Artikel2
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009136
        artikel: '2'
  - number: '3.2'
    text: |-
      De subsidie aan de werkgever wordt bepaald aan de hand van het aantal arbeidsuren dat in de arbeidsovereenkomsten,
      gesloten met personen als bedoeld in [artikel 2, eerste lid][ref1], is overeengekomen, waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0009136#Artikel2
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009136
        artikel: '2'
  - number: 3.2.a
    text: |-
      de subsidie ten hoogste € 10.245,– per kalenderjaar bedraagt bij een arbeidsovereenkomst met een overeengekomen
      arbeidsduur van 32 uur of meer uren per week en naar rato wordt verminderd naarmate de arbeidsovereenkomst minder
      dan een jaar heeft geduurd of een arbeidsduur heeft van minder dan 32 uur;
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel3
  - number: 3.2.b
    text: |-
      op jaarbasis het aantal overeengekomen arbeidsuren in de bedoelde arbeidsovereenkomsten niet meer bedraagt dan het
      aantal uren vermenigvuldigd met 1,3, waarop werkzaamheden op consumentencontracten als bedoeld in het eerste lid
      zijn verricht;
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel3
  - number: 3.2.c
    text: |-
      indien niet voldaan wordt aan onderdeel b, niet wordt uitgegaan van de overeengekomen arbeidsuren, maar van het
      aantal uren vermenigvuldigd met 1,3, waarop werkzaamheden op consumentencontracten als bedoeld in het eerste lid
      zijn verricht.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel3
  - number: '3.3'
    text: |-
      Indien in de arbeidsovereenkomst geen vast aantal arbeidsuren is overeengekomen en de gemiddelde arbeidsduur,
      naar rato van de periode waarover in een jaar is gewerkt, voldoet aan [artikel 2, eerste lid][ref1], wordt bij
      de toepassing van het tweede lid het subsidiebedrag bepaald aan de hand van het aantal arbeidsuren waarvoor de
      werkgever loon heeft betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009136#Artikel2
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009136
        artikel: '2'
  - number: '4.1'
    text: |-
      De subsidie-ontvanger draagt er zorg voor dat de administratie voor de uitvoering van deze regeling zodanig
      wordt ingericht, dat alle van belang zijnde vastleggingen en bewijsstukken ten behoeve van het besluitvormings-,
      uitvoerings-, controle- en verantwoordingsproces zichtbaar en controleerbaar zijn vastgelegd.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel4
  - number: '4.2'
    text: |-
      Van de administratie maken in ieder geval deel uit: de arbeidsovereenkomsten en de consumentencontracten en de
      daarbij behorende facturen.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel4
  - number: '4.3'
    text: |-
      De subsidie-ontvanger bewaart een afschrift van de verklaring bij de loonadministratie, zolang dat voor de
      subsidievaststelling noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel4
  - number: '5.1'
    text: Namens de minister geeft OSB op aanvraag van een werkgever een beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel5
  - number: '5.2'
    text: De subsidie wordt verleend vanaf de datum van de beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel5
  - number: '5.3'
    text: |-
      De subsidieontvanger zendt binnen 13 weken na de datum van de beschikking tot subsidieverlening een afschrift van
      de arbeidsovereenkomst, bedoeld in [artikel 2, eerste lid][ref1], de op de werknemer betrekking hebbende verklaring
      en consumentencontracten aan OSB.


      [ref1]: https://wetten.overheid.nl/BWBR0009136#Artikel2
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009136
        artikel: '2'
  - number: '5.4'
    text: |-
      De minister betaalt de subsidie bij wijze van voorschot per kwartaal aan de hand van de declaratie met opgave
      van de gegevens over arbeidsuren volgens de arbeidsovereenkomst en de gewerkte uren op consumentencontracten, die
      gefactureerd zijn.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel5
  - number: '5.5'
    text: |-
      Indien de subsidie op jaarbasis hoger is dan de som van de declaraties, bedoeld in het vierde lid, kan de minister
      bij wijze van voorschot op basis van een ontvangen slotdeclaratie een aanvullende subsidie betalen.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel5
  - number: '5.6'
    text: |-
      De subsidieontvanger draagt, door tussenkomst van OSB, er zorg voor dat de relevante gegevens over een
      kalenderkwartaal, opgenomen in een door hem ondertekende declaratie als bedoeld in het vierde lid, door de minister
      zijn ontvangen uiterlijk op de twintigste van de tweede maand volgende op het kwartaal waarop deze betrekking
      heeft.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel5
  - number: '5.7'
    text: |-
      Het voorschot wordt betaald op of omstreeks de vijftiende van de maand volgend op de maand waarin de declaratie
      is ontvangen. Het voorschot wordt niet verleend, indien de minister van de subsidie-ontvanger de bescheiden, nodig
      voor de subsidievaststelling betreffende voorgaande subsidieverstrekkingen, niet heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel5
  - number: '5.8'
    text: |-
      Een subsidieontvanger ontvangt op of omstreeks 15 februari van een kalenderjaar een eenmalig voorschot van
      60% van de gemiddelde subsidie over vier kwartalen. Het eenmalige voorschot wordt berekend aan de hand van de
      declaratie met opgave van de gegevens over arbeidsuren volgens de arbeidsovereenkomst en de gewerkte uren op
      consumentencontracten, die gefactureerd zijn, over het vierde kwartaal van het jaar dat ligt twee jaar voor het
      subsidiejaar en het eerste tot en met derde kwartaal van het voorafgaande subsidiejaar. Jaarlijks wordt aan de
      hand van de ingediende declaraties door de subsidieontvanger over voornoemde kwartalen bepaald of de hoogte van
      het eenmalige voorschot aanleiding geeft tot verhoging of verlaging daarvan. De financiële verwerking hiervan vindt
      plaats binnen 13 weken na kennisgeving aan de subsidieontvanger.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel5
  - number: '5.9'
    text: |-
      Op verzoek van een subsidieontvanger op wie het achtste lid niet van toepassing is, kan de minister op een eerder
      tijdstip dan bedoeld in het achtste lid, eerste volzin, een eenmalig voorschot op de te verstrekken subsidie
      betalen. Het eenmalige voorschot bedraagt 60% van de eerst ingediende kwartaaldeclaratie of een veelvoud daarvan
      als bedoeld in het vierde lid. Het verzoek vindt plaats door tussenkomst van OSB.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel5
  - number: '5.10'
    text: |-
      Op het tijdstip waarop het achtste lid, eerste volzin, van toepassing wordt op de subsidieontvanger, bedoeld in
      het negende lid, wordt de op grond van het negende lid betaalde eenmalige voorschot verrekend met het eenmalige
      voorschot, waarvoor hij op grond van het achtste lid in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel5
  - number: '5.11'
    text: |-
      Indien een declaratie over enig kalenderkwartaal door de minister niet is ontvangen uiterlijk op de twintigste van
      de zesde kalendermaand volgend op het kwartaal waarop deze betrekking heeft, wordt het eenmalige voorschot bedoeld
      in het achtste of negende lid teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel5
  - number: '5.12'
    text: |-
      De subsidieontvanger informeert OSB schriftelijk binnen vier weken over het tijdstip van beëindiging van een
      arbeidsovereenkomst als bedoeld in [artikel 2, eerste lid][ref1], en over de beëindiging van consumentencontracten.


      [ref1]: https://wetten.overheid.nl/BWBR0009136#Artikel2
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009136
        artikel: '2'
  - number: '5.13'
    text: |-
      Verrekening of terugvordering van het voorschot bedoeld in het achtste of negende lid vindt plaats, indien de
      subsidieontvanger geen gebruik meer maakt van deze regeling.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel5
  - number: '5.14'
    text: |-
      Indien vóór de subsidievaststelling een verzoek tot faillietverklaring van of verlening van surséance van betaling
      aan de subsidie-ontvanger is ingediend, vindt geen uitbetaling van voorschotten meer plaats.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel5
  - number: '6.1'
    text: De minister stelt de subsidie per kalenderjaar vast binnen 12 maanden na ontvangst van de jaaropgave.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel6
  - number: '6.2'
    text: |-
      De subsidie-ontvanger draagt, door tussenkomst van OSB, er zorg voor dat de relevante gegevens over een
      kalenderjaar, opgenomen in een door hem ondertekende jaaropgave en, voor zover het daarin vermelde subsidiebedrag
      hoger is dan € 50.000,-, een daarop betrekking hebbende verklaring van een accountant door de minister zijn
      ontvangen vóór 1 juli van het jaar volgend op het jaar waarop de jaaropgave van de werkgever betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel6
  - number: '6.3'
    text: |-
      Indien de bescheiden, genoemd in het tweede lid, niet zijn ontvangen binnen 12 maanden na het kalenderjaar waarop
      deze betrekking hebben, kan de minister de subsidie over dat jaar ambtshalve vaststellen.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel6
  - number: '6.4'
    text: |-
      De vastgestelde subsidie kan van de bij wijze van voorschot betaalde subsidie afwijken indien de subsidie-ontvanger
      handelt in strijd met deze regeling
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel6
  - number: 6a.1
    text: |-
      De minister stelt de subsidie van 1 januari 2005 tot 1 juli 2005 vast binnen 12 maanden na ontvangst van de
      jaaropgave.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel6a
  - number: 6a.2
    text: |-
      De subsidie-ontvanger draagt, door tussenkomst van OSB, er zorg voor dat de relevante gegevens over de periode
      van 1 januari 2005 tot 1 juli 2005, opgenomen in een door hem ondertekende jaaropgave en, voor zover het daarin
      vermelde subsidiebedrag hoger is dan € 25.000,–, een daarop betrekking hebbende verklaring van een accountant door
      de minister zijn ontvangen vóór 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel6a
  - number: 6a.3
    text: |-
      Indien de bescheiden, genoemd in het tweede lid, niet zijn ontvangen voor 1 januari 2006, kan de minister de
      subsidie over de in het tweede lid bedoelde periode ambtshalve vaststellen.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel6a
  - number: 6a.4
    text: |-
      De vastgestelde subsidie kan van de bij wijze van voorschot betaalde subsidie afwijken indien de subsidie-ontvanger
      handelt in strijd met deze regeling.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel6a
  - number: '7'
    text: |-
      De declaratie, bedoeld in [artikel 5, vierde lid][ref1], de slotdeclaratie, bedoeld in
      [artikel 5, vijfde lid][ref2], en de jaaropgave en de verklaring van de accountant, bedoeld in [artikel 6][ref3],
      zijn ingericht volgens de bij deze regeling behorende modellen. De verklaring is gebaseerd op een onderzoek, dat is
      uitgevoerd overeenkomstig het bij deze regeling behorende controle- en rapportageprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0009136#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009136#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009136#Artikel6
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009136
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009136
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0009136
        artikel: '6'
  - number: '8.1'
    text: |-
      Met het toezicht op de naleving van de in deze regeling opgenomen verplichtingen zijn belast de Inspectie Werk
      en Inkomen, genoemd in [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] en de
      Accountantsdienst van het Ministerie van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '7'
  - number: '8.2'
    text: |-
      De subsidieontvanger verstrekt aan de minister desgevraagd kosteloos alle inlichtingen, die zij voor evaluatie,
      informatievoorziening en beleidsvorming met betrekking tot deze regeling nodig hebben en verlenen daartoe inzage in
      ter zake van belang zijnde bescheiden.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel8
  - number: '9'
    text: |-
      Indien de ontwikkeling van het wettelijke minimumloon daartoe aanleiding geeft, maakt de minister een wijziging
      van het bedrag, genoemd in [artikel 3, tweede lid, onderdeel a][ref1], tijdig vóór de aanvang van een kalenderjaar
      bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0009136#Artikel3
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009136
        artikel: '3'
  - number: 9a
    text: |-
      De [Algemene Regeling SZW-subsidies][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009211
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0009211
  - number: '10.1'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 1998 en vervalt met ingang van 1 juli 2005. De regeling
      zoals deze luidt op 30 juni 2005 blijft van toepassing op de afwikkeling van de subsidie, verleend op grond van
      deze regeling.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel10
  - number: '10.2'
    text: |-
      Subsidieverlening op basis van de Regeling experiment marktverruiming in de schoonmaakbranche geldt na de datum van
      inwerkingtreding van deze regeling als subsidieverlening op basis van deze regeling.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel10
  - number: '10.3'
    text: De Regeling experiment marktverruiming in de schoonmaakbranche wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Regeling schoonmaakdiensten particulieren'
    url: https://wetten.overheid.nl/BWBR0009136/2005-03-23#Artikel11
