  - number: '33'
    text: |-
      1 Overschrijvingen in de openbare registers voor registergoederen die op het in [artikel 31][ref1] bedoelde
      tijdstip worden gehouden, worden voor de toepassing van de wet met inschrijvingen gelijkgesteld.

      2 Stukken die vóór dat tijdstip op grond van het tevoren geldende recht hebben geleid tot het stellen van
      aantekeningen in de in het eerste lid bedoelde openbare registers, maar daarin niet zijn in- of overgeschreven,
      blijven, voor zover zij bij het kantoor van de bewaarder berusten, aldaar bewaard en zijn openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028301#Artikel31
