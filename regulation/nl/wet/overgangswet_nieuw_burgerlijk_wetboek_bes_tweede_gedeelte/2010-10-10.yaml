  - number: '5'
    text: |-
      Op een wisselbrief en een cheque, die op het tijdstip van het in werking treden der wet reeds zijn vermist, wordt
      [artikel 241][ref1], onderscheidenlijk [artikel 287, van het Wetboek van Koophandel][ref2], zoals die artikelen bij
      de wet zijn vastgesteld, een jaar nadien van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel241
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel287
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel5
