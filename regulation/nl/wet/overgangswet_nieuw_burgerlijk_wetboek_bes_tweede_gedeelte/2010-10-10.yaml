        artikel: '241'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '287'
  - number: '6'
    text: |-
      [Artikel 330 van het Wetboek van Koophandel][ref1], zoals dat vóór het tijdstip van het in werking treden van de
      wet gold, blijft van toepassing, indien op dat tijdstip het aldaar bedoelde voorwerp reeds ten bate of schade van
      de koper of nieuwe verkrijger is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel330
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '330'
  - number: '7'
    text: |-
      Artikel 44a, derde lid, van de Landsverordening op het Notarisambt vindt alleen toepassing op verklaringen van
      erfrecht die na het in werking treden van de wet zijn opgemaakt.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel7
  - number: '8'
    text: |-
      1 De bepalingen van de Onteigeningsverordening, zoals die luidden vóór het tijdstip van het in werking treden der
      wet, blijven van toepassing op rechtsvorderingen tot onteigening die vóór dat tijdstip zijn aangevangen.

      2 De onteigenende partij is niettemin bevoegd van haar rechtsvordering afstand te doen, zolang nog in hoger beroep
      geen vonnis is gewezen, en een nieuwe rechtsvordering overeenkomstig de wet in te stellen. In dat geval moet zij
      alle kosten, door de wederpartij tot op het doen van de afstand gemaakt, daaronder begrepen een door de rechter te
      bepalen bedrag voor salaris en noodzakelijke voorschotten van de gemachtigde van de wederpartij, betalen.

      3 Zij kan tot die betaling worden genoodzaakt op het enkele bevelschrift van de rechter in eerste aanleg, gesteld
      aan de voet van de door de wederpartij opgemaakte staat van kosten.

      4 Dit bevelschrift is uitvoerbaar bij voorraad.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel8
  - number: '9'
    text: |-
      De artikelen 72 tot en met 74 van de Landsverordening bedoeld in [artikel 1][ref1], zijn van overeenkomstige
      toepassing ter regeling van het overgangsrecht ter gelegenheid van de invoering van artikel 118a van de
      Landsverordening materieel ambtenarenrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0028301#Artikel1
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028301
        artikel: '1'
  - number: '10'
    text: |-
      In deze titel wordt onder «de wet» verstaan de Landsverordening, houdende vaststelling van een nieuw Wetboek van
      Burgerlijke Rechtsvordering.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel10
  - number: '11'
    text: |-
      Gedingen die aanhangig zijn gemaakt vóór het tijdstip van het in werking treden van de wet, worden geheel afgedaan
      met toepassing van de voorschriften van procesrechtelijke aard die vóór dat tijdstip golden, voor zover niet uit de
      volgende artikelen anders voortvloeit. Het in de vorige volzin bepaalde geldt ook voor de afdoening van een eis, in
      het geding bij wege van reconventie gedaan, ook indien dat na het in werking treden van de wet is geschied.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel11
  - number: 11a
    text: |-
      1 Ten aanzien van de mogelijkheid van het aanwenden van een rechtsmiddel tegen een rechterlijke beslissing die na
      het tijdstip van het in werking treden van de wet is tot stand gekomen en de termijn waarbinnen dat rechtsmiddel
      kan worden aangewend, is de wet van toepassing.

      2 Het rechtsmiddel request-civiel kan vanaf het tijdstip van het in werking treden van de wet niet meer worden
      aangewend. In plaats daarvan kan slechts herroeping worden gevorderd overeenkomstig titel 9 en titel 10, afdeling 6
      van Boek 1 van de wet.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel11a
  - number: '12'
    text: |-
      Indien in de loop van een geding als bedoeld in [artikel 11][ref1] een bepaling van het nieuwe Burgerlijk Wetboek
      van toepassing wordt, zijn de daarbij behorende voorschriften der wet mede van toepassing, voor zover een goede
      procesorde dat vereist. Indien daaromtrent een geschil tussen partijen bestaat, beslist de rechter zo spoedig
      mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028301#Artikel11
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028301
        artikel: '11'
  - number: '13'
    text: |-
      Titel 1, afdeling 1, van Boek 1 van de wet is van toepassing op alle exploiten, beslagen en
      tenuitvoerleggingshandelingen, die nadien plaats vinden.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel13
  - number: '14'
    text: |-
      1 Artikel 55 van de wet is van toepassing, indien het vonnis wordt uitgesproken nadat de wet in werking is
      getreden.

      2 De artikelen 56 en 57 van de wet zijn van toepassing, indien in het geding waarin wordt beslist op het, tegen het
      vonnis aangewende, rechtsmiddel, op het tijdstip van het in werking treden der wet nog een incidentele vordering
      van de in die artikelen bedoelde aard kan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel14
  - number: '15'
    text: |-
      Titel 2, de afdelingen 4 tot en met 8B, van Boek 1 van de wet vinden in gedingen toepassing van het tijdstip
      van het in werking treden der wet af. Het tevoren geldende recht blijft evenwel van toepassing in alsdan lopende
      gedingen voor zover daarin voordien een beslissende of aanvullende eed is opgedragen, een getuigenverhoor
      of deskundigen-onderzoek is bevolen tenzij daaraan nog geen uitvoering is gegeven, dan wel een valsheid- of
      echtheidonderzoek is bevolen.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel15
  - number: 15a
    text: |-
      De artikelen 281a, 281b en 429q, zesde lid, van de wet vinden in gedingen toepassing van het tijdstip van het in
      werking treden van de wet af.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel15a
  - number: '16'
    text: |-
      1 Een vóór het tijdstip van het in werking treden der wet gelegd beslag wordt, voor zover uit de volgende leden en
      uit de andere bepalingen van deze titel niet anders voortvloeit, naar het voordien geldende recht afgewikkeld.

      2 In het geval van het vorige lid worden van het in werking treden der wet af tweede en volgende beslagen
      op hetzelfde goed met toepassing van het nadien geldende recht gelegd en is geen oppositie tegen afgifte van
      kooppenningen meer mogelijk. De afwikkeling van deze beslagen geschiedt met toepassing van ditzelfde recht,
      behoudens voor zover de afwikkeling van de eerder gelegde beslagen toepassing van het voordien geldende recht eist.

      3 Indien op het tijdstip van het in werking treden van de wet de bevoegdheid bestond om krachtens een door de
      rechter gegeven bevelschrift of verlof conservatoir beslag te leggen, kan die bevoegdheid na dit tijdstip met
      inachtneming van het nieuwe recht worden uitgeoefend. De eis in de hoofdzaak geldt als tijdig ingesteld, indien
      zulks is geschied binnen acht dagen na het beslag of, indien het bevelschrift of verlof daartoe een langere termijn
      inhoudt, binnen die termijn. Voor de toepassing van artikel 702 van de wet wordt het bevelschrift of verlof met een
      verlof als in dat artikel bedoeld gelijk gesteld.

      4 Een executoriale verkoop door een beslaglegger die op het tijdstip van het in werking treden van de wet nog niet
      was aangekondigd, wordt volgens de bepalingen van het nadien geldende recht afgewikkeld. Voor de toepassing van
      die bepalingen wordt een schuldeiser die voordien oppositie tegen afgifte van kooppenningen heeft gedaan, gelijk
      gesteld met een beslaglegger.

      5 Een rangregeling wordt afgewikkeld naar het recht waaronder de benoeming plaats vond van de rechter-commissaris,
      te wiens overstaan de verdeling zal plaatsvinden.

      6 Artikel 505, derde lid, van de wet is van toepassing op beslagen die na dat tijdstip in de openbare registers
      worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel16
  - number: '17'
    text: |-
      1 Indien vóór het in werking treden der wet beslag onder een derde was gelegd en op het tijdstip van dit in
      werking treden nog geen oproeping tot het doen van een verklaring als bedoeld in de [artikelen 353][ref1] en
      [604 van het Wetboek van Burgerlijke Rechtsvordering][ref2] zoals dat tevoren gold, was uitgebracht, geschiedt
      vanaf de aanvang van de termijn bedoeld in artikel 604, zoals dit toen luidde, de verdere afwikkeling van het
      beslag met toepassing van het nadien geldende recht. Zo niet binnen die termijn of, indien die termijn vóór het
      tijdstip van het in werking treden van de wet was aangevangen, binnen een maand na dat tijdstip, aan de derde een
      exploit is betekend, waarbij is voldaan aan de eisen van artikel 475 van de wet, zullen de betalingen, door de
      derde gedaan, van waarde zijn.

      2 Indien een vonnis als bedoeld in de
      [artikelen 614 tot en met 617 van het Wetboek van Burgerlijke Rechtsvordering][ref3], zoals dat voor het in werking
      treden der wet gold, nadien wordt uitgesproken, geschiedt de in die artikelen bedoelde uitbetaling en afgifte met
      overeenkomstige toepassing van de artikelen 477, eerste en vijfde lid, en 478, eerste tot en met derde lid, van de
      wet en vindt ook de verdere afwikkeling naar het nadien geldende recht plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel353
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel604
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel614
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '353'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '604'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '614'
  - number: '18'
    text: |-
      Artikel 513a van de wet is van toepassing op alle beslagen die na het in werking treden der wet rusten op goederen
      waarop dat artikel betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel18
  - number: '19'
    text: |-
      1 De bepalingen van de wet betreffende executie door een pand- of hypotheekhouder zijn van toepassing, voor zover
      krachtens de artikelen 62 en 68 van de Landsverordening, regelende het overgangsrecht ter gelegenheid van de
      invoering van de [Boeken 1][ref1], [3][ref2] en volgende van het Burgerlijk Wetboek de bepalingen van dat wetboek
      betreffende een zodanige executie van toepassing zijn.

      2 In geval na openbare verkoop overeenkomstig artikel 1203, tweede lid, van het Burgerlijk Wetboek, zoals dat
      tevoren gold, de [artikelen 270 tot en met 273 van Boek 3][ref3] niet van toepassing zijn en een rangregeling wordt
      verlangd, geschiedt deze met toepassing van het vóór het in werking treden van de wet geldende recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0005291
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel270
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0005291
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '270'
  - number: '20'
    text: |-
      Een executie tot afgifte van een roerende zaak of ontruiming van een onroerende zaak geschiedt naar het recht
      waaronder de executie is aangevangen.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel20
  - number: '21'
    text: |-
      De [artikelen 425 tot en met 431 van het Wetboek van Burgerlijke Rechtsvordering][ref1], zoals deze vóór het in
      werking treden der wet golden, blijven nadien van toepassing op dan nog bestaande grondrenten, met dien verstande
      dat artikel 425 wordt geacht te verwijzen naar de bepalingen van de wet betreffende inbeslagneming en verkoop van
      onroerende zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel425
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '425'
  - number: '22'
    text: |-
      De wet is ten aanzien van dwangsommen slechts van toepassing, indien zij worden verschuldigd op grond van een na
      haar in werking treden uitgesproken veroordeling.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel22
  - number: '23'
    text: |-
      Voor de toepassing van het overgangsrecht worden hoofdzaak en schadestaatprocedure, onderscheidenlijk de procedures
      bedoeld in de [artikelen 492][ref1] en [496 van het Wetboek van Burgerlijke Rechtsvordering][ref2], zoals die
      tevoren golden, als afzonderlijke gedingen beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel492
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel496
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '492'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '496'
  - number: '24'
    text: |-
      Een voor het in werking treden der wet aangevangen verzegeling wordt naar het voordien geldende recht afgewikkeld
      en beëindigd.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel24
  - number: '25'
    text: |-
      De artikelen 856 tot en met 861 van de wet zijn niet van toepassing op een gerechtelijke bewaring die voor het in
      werking treden der wet is tot stand gekomen of door de rechter is bevolen.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel25
  - number: '26'
    text: |-
      1 Boek 3, titel 14 van de wet is van het tijdstip van zijn in werking treden af van toepassing op alsdan lopende
      arbitrages, voor zover daarvan niet bij de volgende leden wordt afgeweken.

      2 Op zaken welke vóór het in het eerste lid bedoelde tijdstip bij de rechter aanhangig zijn gemaakt door het
      indienen van een inleidend verzoekschrift, blijft het tevoren geldende recht van toepassing.

      3 Op zaken waarin vóór het in het eerste lid bedoelde tijdstip hoger beroep op de rechter is voorbehouden, blijven
      de [artikelen 524][ref1] en [525 van het Wetboek van Burgerlijke Rechtsvordering][ref2], zoals dat totdien gold,
      van toepassing, met dien verstande dat na afloop van vijf jaren na dat tijdstip het voorbehoud van hoger beroep
      vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel524
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel525
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '524'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '525'
  - number: '27'
    text: |-
      In deze titel wordt onder «de wet» verstaan de Landsverordening houdende aanpassing van het Faillissementsbesluit
      1931 en enige andere eenvormige landsverordeningen in verband met de invoering van het nieuwe Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel27
  - number: '28'
    text: |-
      1 Op een faillissement dat vóór het tijdstip van het in werking treden van de wet is uitgesproken en op een
      surséance van betaling die vóór dat tijdstip voorlopig is verleend, is de wet niet van toepassing.

      2 Indien in de loop van een faillissement of surséance van betaling als bedoeld in het vorige lid, een bepaling
      van het Burgerlijk Wetboek van toepassing wordt, zijn mede van toepassing de voorschriften die in verband met die
      bepalingen bij de wet in het Faillissementsbesluit 1931 zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel28
  - number: '29'
    text: |-
      1 De artikelen 32 en 220, vierde lid, van het Faillissementsbesluit 1931 worden met ingang van het tijdstip van het
      in werking treden der wet van toepassing op bestaande rechtsvorderingen.

      2 Artikel 174, eerste lid, van het Faillissementsbesluit 1931 is van toepassing op een uitdelingslijst die na het
      in werking treden der wet verbindend wordt.

      3 Artikel 180, eerste en tweede lid, van het Faillissementsbesluit 1931 geldt voor de daar geregelde gevolgen van
      een levering, welke na het in werking treden der wet plaats vindt. Wordt een tot de boedel behorend schip na het in
      werking treden der wet verkocht, dan is artikel 180, derde lid, van het Faillissementsbesluit 1931 van toepassing.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel29
  - number: '30'
    text: In deze titel wordt onder «de wet» verstaan de Landsverordening openbare registers.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel30
  - number: '31'
    text: |-
      Een met toepassing van het tevoren geldende recht uitgesproken veroordeling die verplicht tot een handeling waarop
      de wet vanaf het tijdstip van haar in werking treden toepasselijk is, wordt met toepassing van de wet uitgevoerd,
      voor zover zij op dat tijdstip nog niet ten uitvoer is gelegd. Een veroordeling tot overschrijving in de openbare
      registers wordt daartoe gelijkgesteld met een veroordeling tot inschrijving.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel31
  - number: '32'
    text: |-
      1 De tot aan het in [artikel 31][ref1] bedoelde tijdstip op grond van het tevoren geldende recht gehouden openbare
      registers van in- en overschrijving van feiten die betrekking hebben op onroerende zaken en rechten waaraan deze
      zijn onderworpen, maken, met uitzondering van de dagregisters, van dat tijdstip af deel uit van de in artikel 8,
      eerste lid, onder a, van de wet bedoelde openbare registers.

      2 De tot aan het in [artikel 31][ref2] bedoelde tijdstip op grond van het tevoren geldende recht gehouden registers
      welke betrekking hebben op teboekgestelde zeeschepen en de rechten waaraan deze zijn onderworpen, maken, met
      uitzondering van het dagregister, van dat tijdstip af deel uit van de openbare registers, bedoeld in artikel 8,
      eerste lid, onder b, van de wet.

      3 De tot aan het in [artikel 31][ref3] bedoelde tijdstip op grond van het tevoren geldende recht gehouden registers
      welke betrekking hebben op teboekgestelde luchtvaartuigen en de rechten waaraan deze zijn onderworpen, maken, met
      uitzondering van het dagregister, van dat tijdstip af deel uit van de openbare registers, bedoeld in artikel 8,
      eerste lid, onder c, van de wet.

      4 Ten aanzien van stukken die vóór het in [artikel 31][ref4] bedoelde tijdstip zijn in- of overgeschreven, geldt
      nadien als tijdstip van inschrijving hetgeen op de desbetreffende, in de openbare registers opgenomen, afschriften
      van die stukken door de bewaarder is vermeld.


