  - number: '34'
    text: |-
      Een in een ingeschreven stuk gekozen woonplaats hier te lande, welk stuk vóór het in [artikel 31][ref1] bedoelde
      tijdstip is ingeschreven, wordt gelijkgesteld met een gekozen woonplaats, bedoeld in artikel 47 van de wet, tenzij
      uit de wet of het ingeschreven stuk anders blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028301#Artikel31
