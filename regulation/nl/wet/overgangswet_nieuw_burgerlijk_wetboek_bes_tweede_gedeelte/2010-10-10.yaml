  - number: '2'
    text: |-
      In deze titel wordt onder «de wet» verstaan de Landsverordening houdende aanpassing van het bestaande Burgerlijk
      Wetboek van de Nederlandse Antillen en een aantal andere landsverordeningen in verband met de invoering van het
      nieuwe Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 Terzake van een dwangbevel of bevelschrift, uitgevaardigd vóór het tijdstip van het in werking treden der wet,
      blijft het voordien geldende recht van toepassing. Indien de wet voor tenuitvoerlegging van zulk een maatregel
      toepassing van het Wetboek van Burgerlijke Rechtsvordering voorschrijft, geldt dit, met inachtneming van de
      bepalingen van [Titel 3][ref1], mede voor tenuitvoerlegging van de uitgevaardigde maatregel na dat tijdstip.

      2 Gedingen die aanhangig zijn gemaakt vóór het tijdstip van het in werking treden van de wet, worden geheel
      afgedaan met toepassing van de voorschriften van procesrechtelijke aard die vóór dat tijdstip gelden, voor zover
      niet uit de volgende artikelen anders voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0028301
    url: https://wetten.overheid.nl/BWBR0028301/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028301
  - number: '4'
    text: |-
      1 Het vervallen van de eerste afdeling van de vierde titel van het
      [eerste Boek van het Wetboek van Koophandel][ref1] heeft geen gevolg voor een executie op grond van een verlof
      tot verkoop als bedoeld in het tevoren geldende [artikel 163 van het Wetboek van Koophandel][ref2], of van een
      machtiging als bedoeld in het tevoren geldende [artikel 164 van dat wetboek][ref3], indien dat verlof of die
      machtiging vóór het in werking treden der wet is verleend. Het vorige artikel is van overeenkomstige toepassing.

      2 Tijdens een faillissement en een surséance van betaling, vóór het in werking treden der wet aangevangen, blijft
      [artikel 165 van het Wetboek van Koophandel][ref4], zoals dat toen gold, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001838
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel163
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel164
