    text: |-
      De [artikelen 2 tot en met 15 van de Overgangswet nieuw Burgerlijk Wetboek BES][ref1], gelden mede ter regeling van
      het overgangsrecht ter gelegenheid van de invoering van de landsverordeningen bedoeld in de [artikelen 2][ref2],
      [10][ref3], [27][ref4] en [30][ref5].


