  - number: '2.1'
    text: |-
      Degene die ingevolge de [Algemene Wet Bijzondere Ziektekosten][ref1] en de daarop gebaseerde regelgeving van
      rechtswege verzekerd is, is verplicht zich krachtens een zorgverzekering te verzekeren of te laten verzekeren tegen
      het in [artikel 10][ref2] bedoelde risico.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel10
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '2.2'
    text: 'In afwijking van het eerste lid is niet verzekeringsplichtig:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel2
  - number: 2.2.a
    text: |-
      de militaire ambtenaar in werkelijke dienst als bedoeld in
      [artikel 1, eerste lid, onderdeel a juncto onderdeel b, van de Militaire ambtenarenwet 1931][ref1], alsmede de
      militair aan wie buitengewoon verlof met behoud van militaire inkomsten is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
  - number: 2.2.b
    text: |-
      de natuurlijke persoon die op grond van [artikel 64, eerste lid, van de Wet financiering sociale verzekeringen][ref1]
      is ontheven van de verplichtingen, opgelegd op grond van de [Algemene Wet Bijzondere Ziektekosten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0002614
  - number: '2.3'
    text: |-
      Degene die het gezag over een minderjarige, jonger dan achttien jaar, uitoefent, een curator, een bewindvoerder
      of een mentor als bedoeld in de [titels 16][ref1], [19][ref2] of [20 van Boek 1 van het Burgerlijk Wetboek][ref3],
      zorgt ervoor dat de minderjarige verzekeringsplichtige, dan wel de onder curatele, bewind of mentorschap gestelde
      verzekeringsplichtige krachtens een zorgverzekering verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
      - id: ref3
        bwb_id: BWBR0002656
  - number: '3.1'
    text: |-
      Een zorgverzekeraar is verplicht met of ten behoeve van iedere verzekeringsplichtige die in zijn werkgebied
      woont alsmede met of ten behoeve van iedere verzekeringsplichtige die in het buitenland woont, desgevraagd een
      zorgverzekering te sluiten.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel3
  - number: '3.2'
    text: |-
      Indien een zorgverzekeraar in een provincie verschillende varianten van de zorgverzekering aanbiedt, kan voor
      iedere in die provincie wonende verzekeringsplichtige uit alle varianten worden gekozen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel3
  - number: '3.3'
    text: |-
      De zorgverzekeraar stelt alle varianten van de zorgverzekering die hij in een provincie aanbiedt, in de vorm
      van modelovereenkomsten ter beschikking aan personen die overwegen ten behoeve van een in die provincie wonende
      verzekeringsplichtige een zorgverzekering met die verzekeraar te sluiten, alsmede, indien de zorgverzekeraar
      varianten toevoegt of wijzigt, aan de verzekeringnemers die ten behoeve van een in die provincie wonende
      verzekeringsplichtige een zorgverzekering met hem hebben gesloten.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel3
  - number: '3.4'
    text: |-
      In afwijking van het eerste lid is een zorgverzekeraar niet verplicht een zorgverzekering te sluiten met of ten
      behoeve van een verzekeringsplichtige wiens eerdere zorgverzekering hij of de verzekeringnemer binnen een periode
      van vijf jaar, gelegen onmiddellijk voorafgaande aan het verzoek tot het sluiten van de verzekering, heeft opgezegd
      of ontbonden wegens:
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel3
  - number: 3.4.a
    text: opzettelijke misleiding door de verzekeringnemer of de verzekerde, of
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel3
  - number: 3.4.b
    text: |-
      het niet betalen van de premie, bedoeld in [artikel 17, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel17
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.1
  - number: '3.5'
    text: |-
      In afwijking van het tweede lid kan ten behoeve van een in het buitenland wonende verzekeringsplichtige worden
      gekozen tussen alle varianten van de zorgverzekering die een zorgverzekeraar in Nederland aanbiedt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel3
  - number: '3.6'
    text: |-
      In afwijking van het derde lid worden degene die ten behoeve van een in het buitenland wonende
      verzekeringsplichtige een zorgverzekering wenst te sluiten alle modelovereenkomsten die de zorgverzekeraar
      in Nederland hanteert ter beschikking gesteld, en worden, indien eenmaal een zorgverzekering is gesloten, de
      verzekeringnemer alle toegevoegde of gewijzigde varianten die die zorgverzekeraar aanbiedt ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel3
  - number: '4.1'
    text: |-
      Degene die een zorgverzekering wenst te sluiten, vermeldt bij het verzoek daartoe het burgerservicenummer of, bij
      het ontbreken daarvan, het sociaal-fiscaalnummer van de te verzekeren persoon.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel4
  - number: '4.2'
    text: |-
      De zorgverzekeraar stelt, voor zover dat redelijkerwijs nodig is voor de uitvoering van de zorgverzekering en van
      deze wet, de identiteit van de te verzekeren persoon vast.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel4
  - number: '4.3'
    text: |-
      De in het tweede lid bedoelde vaststelling geschiedt aan de hand van documenten als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1], die de verzekeringnemer of de te verzekeren persoon hem
      desgevraagd ter inzage geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '4.4'
    text: De zorgverzekeraar neemt aard en nummer van de in het derde lid bedoelde documenten in zijn administratie op.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel4
  - number: '4.5'
    text: |-
      De zorgverzekeraar verlangt van de vreemdeling, bedoeld in de [Vreemdelingenwet 2000][ref1], voor wie hem
      wordt verzocht een zorgverzekering te sluiten, een kopie van het document of de schriftelijke verklaring,
      bedoeld in [artikel 9, eerste lid, van die wet][ref2], dat wordt aangemerkt als een bescheid als bedoeld in
      [artikel 4:3, tweede lid, van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '5.1'
    text: |-
      De zorgverzekering gaat in op de dag waarop de zorgverzekeraar het verzoek, bedoeld in
      [artikel 3, eerste lid][ref1], en, indien het [tweede of vijfde lid van dat artikel][ref2] van toepassing is, de
      aanduiding van de variant waar de verzekeringnemer voor kiest, heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel3
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '5.2'
    text: |-
      Indien de zorgverzekeraar op basis van het in het eerste lid bedoelde verzoek niet vast kan stellen of hij
      verplicht is voor de te verzekeren persoon een zorgverzekering te sluiten, en hij de persoon die de verzekering
      wenst te sluiten in verband daarmee uitnodigt de voor deze vaststelling noodzakelijke gegevens te verschaffen, gaat
      de zorgverzekering, in afwijking van het eerste lid, in op de dag waarop laatstbedoelde persoon aan dit verzoek
      heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel5
  - number: '5.3'
    text: |-
      De zorgverzekeraar verstrekt degene die het verzoek, bedoeld in het eerste lid, doet en, indien dit een ander is
      dan degene ten behoeve van wiens verzekering het verzoek is gedaan, laatstbedoelde persoon onverwijld:
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel5
  - number: 5.3.a
    text: een bewijs van het verzoek, bedoeld in het eerste lid, waarop de datum van ontvangst is vermeld;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel5
  - number: 5.3.b
    text: een bewijs van de ontvangst van gegevens, bedoeld in het tweede lid, waarop de datum van de ontvangst is vermeld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel5
  - number: '5.4'
    text: |-
      Indien degene ten behoeve van wie de zorgverzekering wordt gesloten op de dag waarop de zorgverzekeraar
      het verzoek, bedoeld in het eerste lid, ontvangt reeds op grond van een zorgverzekering verzekerd is, en de
      verzekeringnemer aangeeft de zorgverzekering te willen laten ingaan op een door hem aangegeven, latere dag dan de
      dag, bedoeld in het eerste of tweede lid, gaat de verzekering op die latere dag in.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel5
  - number: '5.5'
    text: |-
      De zorgverzekering werkt, zonodig in afwijking van
      [artikel 925, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1], terug:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel925
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '925'
  - number: 5.5.a
    text: |-
      indien zij ingaat binnen vier maanden nadat de verzekeringsplicht is ontstaan, tot en met de dag waarop die plicht
      ontstond;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel5
  - number: 5.5.b
    text: |-
      indien zij ingaat binnen een maand nadat een eerdere zorgverzekering met ingang van
      1 januari van een kalenderjaar of wegens wijziging van de voorwaarden met toepassing van
      [artikel 940, vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] is geëindigd door opzegging, tot en met de
      dag na die waarop de eerdere zorgverzekering is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel940
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '940'
  - number: '6.1'
    text: 'De zorgverzekering eindigt van rechtswege met ingang van de dag volgende op de dag waarop:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel6
  - number: 6.1.a
    text: |-
      de verzekeraar ten gevolge van wijziging of intrekking van zijn vergunning tot uitoefening van het
      schadeverzekeringsbedrijf, geen zorgverzekeringen meer mag aanbieden;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel6
  - number: 6.1.b
    text: |-
      de verzekerde ten gevolge van wijziging van het werkgebied buiten het werkgebied van de zorgverzekeraar komt te
      wonen;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel6
  - number: 6.1.c
    text: de verzekerde overlijdt;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel6
  - number: 6.1.d
    text: de verzekeringsplicht van de verzekerde eindigt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel6
  - number: '6.2'
    text: |-
      De zorgverzekering eindigt van rechtswege met ingang van de eerste dag van de tweede maand volgende op de dag
      waarop de verzekerde, zonder dat zijn verzekeringsplicht eindigt, ten gevolge van verhuizing komt te wonen buiten
      een provincie waarin zijn zorgverzekeraar de ten behoeve van hem gesloten variant van de zorgverzekering aanbiedt
      of uitvoert.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel6
  - number: '6.3'
    text: |-
      De zorgverzekeraar stelt de verzekeringnemer uiterlijk twee maanden voordat een zorgverzekering op grond van het
      eerste lid, onderdeel a of b, eindigt, van dit einde op de hoogte, onder vermelding van de reden daarvan en de
      datum waarop de verzekering eindigt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel6
  - number: '6.4'
    text: |-
      De verzekeringnemer stelt de zorgverzekeraar onverwijld op de hoogte van alle feiten en omstandigheden over
      de verzekerde die op grond van het eerste lid, onderdeel c of d, dan wel het tweede lid tot het einde van de
      zorgverzekering hebben geleid of kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel6
  - number: '6.5'
    text: |-
      Indien de zorgverzekeraar op grond van de in het vierde lid bedoelde gegevens tot de conclusie komt dat de
      zorgverzekering zal eindigen of geëindigd is, deelt hij dit, onder vermelding van de reden daarvan en de datum
      waarop de verzekering eindigt of geëindigd is, onverwijld aan de verzekeringnemer mede.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel6
  - number: '7.1'
    text: |-
      De verzekeringnemer kan de zorgverzekering uiterlijk 31 december van ieder jaar met ingang van 1 januari van het
      volgende kalenderjaar opzeggen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel7
  - number: '7.2'
    text: |-
      De verzekeringnemer die een ander dan zichzelf heeft verzekerd, kan de zorgverzekering opzeggen indien de
      verzekerde krachtens een andere zorgverzekering verzekerd wordt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel7
  - number: '7.3'
    text: |-
      In afwijking van [artikel 940, vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] kan de verzekeringnemer
      niet opzeggen indien een wijziging in de verzekerde prestaties ten nadele van de verzekeringnemer of de verzekerde
      rechtstreeks voortvloeit uit een wijziging van de bij of krachtens de [artikelen 11 tot en met 14a][ref2] gestelde
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel940
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '940'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '7.4'
    text: |-
      De opzegging, bedoeld in het tweede lid, gaat in op de eerste dag van de tweede kalendermaand volgende op de dag
      waarop de verzekeringnemer heeft opgezegd.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel7
  - number: '7.5'
    text: |-
      In afwijking van het vierde lid gaat een opzegging, bedoeld in het tweede lid, in met ingang van de dag waarop
      de verzekerde krachtens de andere zorgverzekering verzekerd wordt, indien die opzegging voorafgaande aan
      laatstbedoelde dag door de zorgverzekeraar is ontvangen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel7
  - number: '8.1'
    text: |-
      Aan een opzegging of ontbinding van de zorgverzekering wegens het niet betalen van de verschuldigde premie, wordt
      geen terugwerkende kracht verleend, noch wordt daaraan een verplichting verbonden tot ongedaanmaking of vergoeding
      van hetgeen partijen reeds ter nakoming van de zorgverzekering jegens elkaar hebben verricht.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel8
  - number: '8.2'
    text: |-
      Een zorgverzekeraar mag de zorgverzekering gedurende de periode, bedoeld in [artikel 24][ref1], niet opzeggen of
      ontbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel24
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '8.3'
    text: |-
      [Artikel 934 van Boek 7 van het Burgerlijk Wetboek][ref1] is tevens van toepassing met betrekking tot de eerste
      premie die een verzekeringnemer voor een zorgverzekering verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel934
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '934'
  - number: 8a.1
    text: |-
      Nadat de zorgverzekeraar de verzekeringnemer heeft aangemaand tot betaling van een of meer vervallen termijnen
      van de verschuldigde premie, kan de verzekeringnemer gedurende de tijd dat de verschuldigde premie, rente en
      incassokosten niet zijn voldaan, de zorgverzekering niet opzeggen, tenzij de zorgverzekeraar de zorgverzekering of
      de dekking daarvan heeft geschorst of opgeschort.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel8a
  - number: 8a.2
    text: |-
      Het eerste lid lijdt uitzondering indien de zorgverzekeraar de verzekeringnemer binnen twee weken te kennen geeft
      de opzegging te bevestigen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel8a
  - number: '9.1'
    text: |-
      De zorgverzekeraar verstrekt de verzekeringnemer en, indien deze een ander is dan de verzekeringnemer, de
      verzekerde zo spoedig mogelijk na het sluiten van de zorgverzekering en vervolgens voorafgaande aan ieder
      kalenderjaar een zorgpolis.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien de zorgverzekering eindigt, verstrekt de zorgverzekeraar de verzekeringnemer en, indien deze een ander is
      dan de verzekeringnemer, de verzekerde een bewijs van het einde van de zorgverzekering, waarop worden aangetekend:
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel9
  - number: 9.2.a
    text: |-
      naam, adres, woonplaats en burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer van de
      verzekerde;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel9
  - number: 9.2.b
    text: naam, adres en woonplaats van de verzekeringnemer;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel9
  - number: 9.2.c
    text: naam, adres en woonplaats van de zorgverzekeraar;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel9
  - number: 9.2.d
    text: de dag waarop de zorgverzekering eindigt;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel9
  - number: 9.2.e
    text: |-
      of voor de verzekerde op die dag een vrijwillig eigen risico gold en zo ja, met welke ingangsdatum, voor welk
      bedrag en met welke in verband daarmee verleende korting.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien de zorgverzekering eindigt om de in [artikel 6, eerste lid, onderdeel d][ref1], genoemde reden, wordt dat op
      het in het tweede lid bedoelde bewijs aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel6
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '10'
    text: 'Het krachtens de zorgverzekering te verzekeren risico is de behoefte aan:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel10
  - number: 10.a
    text: |-
      geneeskundige zorg, waaronder de integrale eerstelijnszorg zoals die door huisartsen en verloskundigen pleegt te
      geschieden;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel10
  - number: 10.b
    text: mondzorg;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel10
  - number: 10.c
    text: farmaceutische zorg;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel10
  - number: 10.d
    text: hulpmiddelenzorg;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel10
  - number: 10.e
    text: verpleging;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel10
  - number: 10.f
    text: verzorging, waaronder de kraamzorg;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel10
  - number: 10.g
    text: verblijf in verband met geneeskundige zorg;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel10
  - number: 10.h
    text: |-
      vervoer in verband met het ontvangen van zorg of diensten als bedoeld in de onderdelen a tot en met g, dan wel in
      verband met een aanspraak op grond van de [Algemene Wet Bijzondere Ziektekosten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '11.1'
    text: |-
      De zorgverzekeraar heeft jegens zijn verzekerden een zorgplicht die zodanig wordt vormgegeven, dat de verzekerde
      bij wie het verzekerde risico zich voordoet, krachtens de zorgverzekering recht heeft op prestaties bestaande uit:
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel11
  - number: 11.1.a
    text: de zorg of de overige diensten waaraan hij behoefte heeft, of
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel11
  - number: 11.1.b
    text: |-
      vergoeding van de kosten van deze zorg of overige diensten alsmede, desgevraagd, activiteiten gericht op het
      verkrijgen van deze zorg of diensten.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel11
  - number: '11.2'
    text: |-
      In de zorgverzekering kunnen combinaties van verzekerde prestaties als bedoeld in het eerste lid, onderdeel a of b,
      worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel11
  - number: '11.3'
    text: |-
      Bij algemene maatregel van bestuur worden de inhoud en omvang van de in het eerste lid bedoelde prestaties nader
      geregeld en kan voor bij die maatregel aan te wijzen vormen van zorg of overige diensten worden bepaald dat een
      deel van de kosten voor rekening van de verzekerde komt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel11
  - number: '11.4'
    text: 'In de algemene maatregel van bestuur kan worden bepaald dat bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel11
  - number: 11.4.a
    text: |-
      vormen van zorg of overige diensten kunnen worden uitgezonderd van de in het eerste lid bedoelde of in de maatregel
      nader omschreven prestaties;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel11
  - number: 11.4.b
    text: |-
      de inhoud en omvang van de prestaties bestaande uit zorg als bedoeld in [artikel 10, onderdelen a, c en d][ref1],
      nader wordt geregeld;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel10
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 11.4.c
    text: nadere regels kunnen worden gesteld over het deel van de kosten dat voor rekening van de verzekerde komt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel11
  - number: '11.5'
    text: |-
      Een zorgverzekeraar kan modelovereenkomsten aanbieden waarin, in geringe afwijking van het bepaalde bij of
      krachtens het eerste en derde lid, bepaalde om ethische of levensbeschouwelijke redenen controversiële prestaties
      buiten de dekking van de zorgverzekering blijven.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel11
  - number: '12.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter bescherming van het algemeen belang vormen van zorg of overige
      diensten worden aangewezen die de zorgverzekeraar slechts verstrekt of vergoedt indien tussen hem en de aanbieder
      van de desbetreffende zorg of dienst een overeenkomst over de te leveren zorg of dienst en de daarvoor in rekening
      te brengen prijs is gesloten, dan wel indien de aanbieder bij hem in dienst is.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel12
  - number: '12.2'
    text: |-
      Bij deze algemene maatregel van bestuur kunnen tevens vormen van zorg of overige diensten worden aangewezen
      waarvoor de zorgverzekeraar met iedere instelling die binnen zijn werkgebied is gelegen of waarvan zijn verzekerden
      naar verwachting regelmatig gebruik zullen maken, op haar verzoek een overeenkomst als bedoeld in het eerste lid
      sluit.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel12
  - number: '12.3'
    text: |-
      Een instelling als bedoeld in [artikel 1, onderdeel m, onder 1°][ref1], die voor een in het tweede lid bedoelde
      vorm van zorg of dienst een overeenkomst met een zorgverzekeraar heeft gesloten, is verplicht desgevraagd met een
      andere zorgverzekeraar een gelijke overeenkomst te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
        hoofdstuk: '1'
  - number: '12.4'
    text: |-
      Het tweede en het derde lid gelden niet indien de zorgverzekeraar respectievelijk instelling ernstige bezwaren
      heeft tegen het sluiten van een overeenkomst met de instelling respectievelijk zorgverzekeraar die om die
      overeenkomst vraagt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel12
  - number: '13.1'
    text: |-
      Indien een verzekerde krachtens zijn zorgverzekering een bepaalde vorm van zorg of een andere dienst dient te
      betrekken van een aanbieder met wie zijn zorgverzekeraar een overeenkomst over deze zorg of dienst en de daarvoor
      in rekening te brengen prijs heeft gesloten of van een aanbieder die bij zijn zorgverzekeraar in dienst is, en
      hij deze zorg of andere dienst desalniettemin betrekt van een andere aanbieder, heeft hij recht op een door de
      zorgverzekeraar te bepalen vergoeding van de voor deze zorg of dienst gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel13
  - number: '13.2'
    text: De zorgverzekeraar neemt de wijze waarop hij de vergoeding berekent in de modelovereenkomst op.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel13
  - number: '13.3'
    text: |-
      Indien bij of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 11][ref1], is bepaald dat een deel
      van de kosten van een bepaalde vorm van zorg of van een bepaalde andere dienst voor rekening van de verzekerde
      komt, verwerkt de zorgverzekeraar dit in de wijze waarop hij de vergoeding voor de desbetreffende vorm van zorg of
      dienst berekent.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '13.4'
    text: |-
      De wijze waarop de vergoeding wordt berekend is voor alle verzekerden, bedoeld in het eerste lid, die in een zelfde
      situatie een zelfde vorm van zorg of dienst behoeven, gelijk.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel13
  - number: '13.5'
    text: |-
      Indien een overeenkomst tussen een zorgverzekeraar en een aanbieder als bedoeld in het eerste lid wordt beëindigd,
      houdt een verzekerde die op het moment van beëindiging van de overeenkomst zorg ontvangt van deze aanbieder, recht
      op zorgverlening door die aanbieder voor rekening van deze zorgverzekeraar.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel13
  - number: '14.1'
    text: |-
      De vraag of een verzekerde behoefte heeft aan een bepaalde vorm van zorg of een bepaalde andere dienst, wordt
      slechts op basis van zorginhoudelijke criteria beantwoord.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel14
  - number: '14.2'
    text: |-
      De zorgverzekeraar neemt in zijn modelovereenkomst op dat geneeskundige zorg zoals medisch-specialisten die
      plegen te bieden, met uitzondering van acute zorg, slechts toegankelijk is na verwijzing door in die overeenkomst
      aangewezen categorieën zorgaanbieders, waaronder in ieder geval de huisarts.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel14
  - number: '14.3'
    text: |-
      De vraag of een jeugdige als bedoeld in de [Wet op de jeugdzorg][ref1] wegens een psychiatrische aandoening
      behoefte heeft aan een bepaalde vorm van zorg of een andere dienst, wordt met overeenkomstige toepassing van de bij
      en krachtens [artikel 9b, vierde en vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref2] gestelde regels,
      beantwoord door een stichting als bedoeld in de [Wet op de jeugdzorg][ref3] respectievelijk een arts of andere
      behandelaar van de jeugdige.


      [ref1]: https://wetten.overheid.nl/BWBR0016637
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
      [ref3]: https://wetten.overheid.nl/BWBR0016637
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016637
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 9b
      - id: ref3
        bwb_id: BWBR0016637
  - number: '14.4'
    text: |-
      In de regels, bedoeld in het derde lid, kunnen voor de in dat lid bedoelde indicatie afzonderlijke regels worden
      gesteld en kunnen vormen van zorg of andere diensten worden aangewezen waarvoor het derde lid niet geldt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel14
  - number: '14.5'
    text: |-
      Op een stichting als bedoeld in het derde lid, is, met uitzondering van de bewaartermijn als omschreven in
      [artikel 86, eerste lid][ref1], het bepaalde bij of krachtens de [artikelen 4, tweede tot en met vijfde lid][ref2],
      en [86][ref3] van overeenkomstige toepassing met betrekking tot de indicatie, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel86
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '86'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '86'
        hoofdstuk: '8'
  - number: '14.6'
    text: |-
      Voor zover een verzekerde ingevolge zijn zorgverzekering toestemming behoeft van de zorgverzekeraar dan wel
      een verwijzing of een recept van een deskundige is vereist voor het verkrijgen van de verzekerde prestaties, en
      de verzekerde in het bezit is van deze toestemming, deze verwijzing of dit recept, geldt die toestemming, die
      verwijzing of dat recept als titel voor het verkrijgen van de verzekerde prestaties gedurende de periode waarvoor
      de toestemming is verleend of de verwijzing of het recept geldig is, en verlangt een nieuwe zorgverzekeraar niet
      nogmaals dat toestemming wordt gevraagd of dat een verwijzing of recept wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel14
  - number: '15.1'
    text: |-
      De [artikelen 941, eerste lid][ref1], en [957 van Boek 7 van het Burgerlijk Wetboek][ref2] zijn niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel941
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel957
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '941'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '957'
  - number: '15.2'
    text: |-
      Zonodig in afwijking van [artikel 952 van Boek 7 van het Burgerlijk Wetboek][ref1] is de zorgverzekeraar niet
      bevoegd een verzekerde prestatie geheel of gedeeltelijk te weigeren indien het intreden van het verzekerde risico
      aan de verzekerde is te wijten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel952
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '952'
  - number: '16.1'
    text: Krachtens de zorgverzekering is de verzekeringnemer premie verschuldigd.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel16
  - number: '16.2'
    text: |-
      In afwijking van [artikel 925 van Boek 7 van het Burgerlijk Wetboek][ref1] en van het eerste lid:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel925
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '925'
  - number: 16.2.a
    text: |-
      is geen premie verschuldigd tot de eerste dag van de kalendermaand volgende op de kalendermaand waarin een
      verzekerde de leeftijd van achttien jaren heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel16
  - number: 16.2.b
    text: |-
      is geen premie verschuldigd over de periode, bedoeld in [artikel 18d, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
  - number: '17.1'
    text: |-
      De zorgverzekeraar stelt voor iedere variant van de zorgverzekering die hij aanbiedt, de grondslag van de premie en
      de bij die variant behorende premiekorting of premiekortingen vast en neemt deze in de modelovereenkomst op.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel17
  - number: '17.2'
    text: |-
      De grondslag van de premie is gelijk voor varianten die wat betreft de te verzekeren prestaties als bedoeld in
      [artikel 11, eerste lid][ref1], of de keuzemogelijkheden tussen aanbieders van zorg of van overige diensten als
      bedoeld in dat lid, niet van elkaar verschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '17.3'
    text: |-
      Indien de zorgverzekeraar gebruik maakt van zijn bevoegdheid, bedoeld in [artikel 11, vijfde lid][ref1], is de
      grondslag van de premie gelijk aan de grondslag die hij heeft of zou hebben vastgesteld voor een modelovereenkomst
      met volledige dekking.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '17.4'
    text: |-
      De grondslag van de premie is de premie indien geen premiekorting als bedoeld in [artikel 18, vierde lid][ref1], of
      [artikel 20][ref2] geldt of zou gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel20
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.1
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '17.5'
    text: |-
      De verschuldigde premie is gelijk aan de grondslag van de premie behorende bij de variant van de
      zorgverzekering die de verzekeringnemer gekozen heeft, verminderd met de premiekortingen, bedoeld in de
      [artikelen 18, vierde lid][ref1], of [20][ref2], indien deze van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel20
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.1
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '17.6'
    text: |-
      De zorgverzekeraar geeft de wijze waarop de verschuldigde premie van de grondslag van de premie wordt afgeleid
      in de modelovereenkomst weer, en neemt de wijze waarop de door de verzekeringnemer verschuldigde premie van de
      grondslag van de premie is afgeleid in de zorgpolis op.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel17
  - number: '17.7'
    text: |-
      Een wijziging in de grondslag van de premie treedt niet eerder in werking dan zes weken na de dag waarop deze aan
      de verzekeringnemer is medegedeeld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel17
  - number: '18.1'
    text: |-
      De zorgverzekeraar kan met een werkgever overeenkomen dat hij een geldelijk voordeel verstrekt indien diens
      werknemers, voormalige werknemers of hun gezinsleden verzekerd worden op basis van een in die overeenkomst aan te
      wijzen modelovereenkomst.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het voordeel bedraagt, per persoon die op basis van de desbetreffende modelovereenkomst verzekerd wordt, niet meer
      dan 10% van de grondslag van de bij die modelovereenkomst behorende premie.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18
  - number: '18.3'
    text: 'In de overeenkomst, bedoeld in het eerste lid, wordt ten minste bepaald:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18
  - number: 18.3.a
    text: |-
      de hoogte van het voordeel, waarbij die hoogte mag variëren al naar gelang het aantal volgens de desbetreffende
      modelovereenkomst verzekerde personen;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18
  - number: 18.3.b
    text: |-
      de verdeling van het voordeel over de werkgever en de volgens de desbetreffende modelovereenkomst verzekerde
      personen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18
  - number: '18.4'
    text: |-
      Indien het voordeel of een deel daarvan aan de verzekeringnemer wordt verstrekt, geschiedt dit in de vorm van een
      korting op de grondslag van de premie.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18
  - number: '18.5'
    text: |-
      Het eerste tot en met vierde lid zijn tevens van toepassing ten aanzien van een rechtspersoon, niet zijnde een
      werkgever, met betrekking tot de verzekering van natuurlijke personen wier belangen die rechtspersoon behartigt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18
  - number: '18.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen, om te voorkomen dat afbreuk wordt gedaan aan het sociale karakter van de
      verzekering, nadere en zonodig afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18
  - number: 18a.1
    text: |-
      Uiterlijk tien werkdagen nadat ten aanzien van een zorgverzekering een achterstand in de betaling van de
      verschuldigde premie ter hoogte van twee maandpremies is geconstateerd, doet de zorgverzekeraar de verzekeringnemer
      een aanbod tot het treffen van een betalingsregeling.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18a
  - number: 18a.2
    text: 'De betalingsregeling bestaat ten minste uit de volgende elementen:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18a
  - number: 18a.2.a
    text: |-
      een machtiging van de verzekeringnemer aan de zorgverzekeraar tot maandelijkse automatische incasso van nieuw
      vervallende termijnen van de premie dan wel een opdracht aan een derde van wie de verzekeringnemer periodieke
      betalingen ontvangt, om namens hem en onder inhouding van de desbetreffende bedragen op deze betalingen, periodiek
      rechtstreeks aan de zorgverzekeraar het bedrag van nieuw vervallende termijnen van de premie te betalen,
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18a
  - number: 18a.2.b
    text: |-
      afspraken inzake de afwikkeling van de uit de zorgverzekering voortvloeiende schulden van de verzekeringnemer aan
      de zorgverzekeraar, inclusief rente en incassokosten, en de termijnen waarbinnen betaling zal plaatsvinden, en
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18a
  - number: 18a.2.c
    text: |-
      een toezegging van de zorgverzekeraar, inhoudende dat hij de zorgverzekering of de dekking daarvan gedurende
      de looptijd van de betalingsregeling niet om reden van het bestaan van de schulden, bedoeld in onderdeel b, zal
      beëindigen, schorsen of opschorten, zolang de verzekeringnemer de machtiging of de opdracht, bedoeld in onderdeel
      a, niet intrekt en de afspraken, bedoeld in onderdeel b, nakomt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18a
  - number: 18a.3
    text: |-
      Indien de verzekeringnemer een ander heeft verzekerd en ten aan zien van diens verzekering een premie-achterstand
      als bedoeld in het eerste lid is ontstaan, omvat het aanbod, bedoeld in het eerste lid, tevens een bereidverklaring
      opzegging van deze verzekering met ingang van de dag waarop de betalingsregeling van kracht wordt, te aanvaarden,
      mits:
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18a
  - number: 18a.3.a
    text: |-
      de verzekerde zichzelf uiterlijk met ingang van dezelfde dag krachtens een andere zorgverzekering verzekerd heeft,
      en
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18a
  - number: 18a.3.b
    text: |-
      deze, indien deze zorgverzekering bij dezelfde zorgverzekeraar is gesloten, terzake van de premie voor deze
      verzekering een volmacht of opdracht als bedoeld in het tweede lid, onderdeel a, heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18a
  - number: 18a.4
    text: |-
      Tegelijk met het aanbod deelt de zorgverzekeraar de verzekeringnemer schriftelijk mee dat deze een termijn van
      vier weken heeft om het te aanvaarden, waarbij de verzekeraar bovendien aangeeft wat de gevolgen zullen zijn indien
      het aanbod niet wordt aanvaard en de premieschuld, rente en incassokosten buiten beschouwing gelaten, tot zes of
      meer maandpremies zal zijn opgelopen, en wijst hij de verzekeringnemer op de mogelijkheid van schuldhulpverlening,
      waarbij hij tevens informatie verstrekt over de vormen hiervan en wijze waarop deze kan worden verzocht.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18a
  - number: 18a.5
    text: |-
      Indien het derde lid van toepassing is, zendt de zorgverzekeraar de verzekerde tegelijk met de verzending van de in
      het eerste tot en met vierde lid bedoelde stukken aan de verzekeringnemer, afschriften van deze stukken.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18a
  - number: 18b.1
    text: |-
      Zo spoedig mogelijk nadat ten aanzien van een zorgverzekering, rente en incassokosten buiten beschouwing latend,
      een achterstand in de betaling van de verschuldigde premie ter hoogte van vier maandpremies is geconstateerd,
      deelt de zorgverzekeraar de verzekeringnemer en, indien deze een ander is dan de verzekeringnemer, de verzekerde
      mee dat hij voornemens is over te gaan tot de melding, bedoeld in [artikel 18c][ref1], zodra de premieschuld de
      daar bedoelde hoogte zal hebben bereikt, tenzij de verzekeringnemer of de verzekerde hem uiterlijk vier weken na
      ontvangst van de mededeling heeft laten weten, het bestaan van de schuld of de hoogte ervan te betwisten.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18c
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18c
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
  - number: 18b.2
    text: |-
      Ingeval van tijdige betwisting als bedoeld in het eerste lid deelt de zorgverzekeraar, indien deze na
      onderzoek zijn standpunt handhaaft, de verzekeringnemer en, indien deze een ander is dan de verzekeringnemer,
      de verzekerde mee dat hij het voornemen tot melding tot uitvoering zal brengen zodra de premieschuld de in
      [artikel 18c, eerste lid][ref1], bedoelde hoogte zal hebben bereikt, tenzij de verzekeringnemer of de verzekerde
      binnen een termijn van vier weken na ontvangst van de in dit lid bedoelde mededeling een geschil hierover heeft
      voorgelegd aan een onafhankelijke instantie als bedoeld in [artikel 114][ref2] of aan de burgerlijke rechter.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18c
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel114
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18c
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '114'
        hoofdstuk: '10'
  - number: 18b.3
    text: |-
      Indien een betalingsregeling als bedoeld in [artikel 18a][ref1] ingaat nadat ten aanzien van de zorgverzekering,
      rente en incassokosten buiten beschouwing latend, een achterstand in de betaling van de verschuldigde premie ter
      hoogte van vier maandpremies is ontstaan, laat de zorgverzekeraar de in het eerste lid bedoelde melding achterwege
      zolang de nieuw vervallende termijnen van de premie worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18a
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18a
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
  - number: 18c.1
    text: |-
      Indien ten aanzien van een zorgverzekering, rente en incassokosten buiten beschouwing latend, een premieschuld
      ter hoogte van zes of meer maandpremies is ontstaan, meldt de zorgverzekeraar dit, onder vermelding van de voor
      de heffing van de bestuursrechtelijke premie alsmede voor de uitvoering van [artikel 34a][ref1] noodzakelijke
      persoonsgegevens van de verzekeringnemer en de verzekerde, aan het College zorgverzekeringen, de verzekeringnemer
      en, indien deze een ander is dan de verzekeringnemer, aan de verzekerde.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel34a
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 34a
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 18c.2
    text: 'De melding geschiedt niet:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18c
  - number: 18c.2.a
    text: |-
      in geval van tijdige betwisting als bedoeld in [artikel 18b, eerste lid][ref1], zolang de zorgverzekeraar zijn
      standpunt dienaangaande niet aan de verzekeringnemer en, indien dit een ander dan de verzekeringnemer is, aan de
      verzekerde heeft kenbaar gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18b
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18b
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
  - number: 18c.2.b
    text: |-
      gedurende de termijn, genoemd in [artikel 18b, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18b
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18b
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
  - number: 18c.2.c
    text: |-
      ingeval van tijdige voorlegging van het geschil aan een onafhankelijke instantie of aan de burgerlijke rechter als
      bedoeld in [artikel 18b, tweede lid][ref1], zolang op het geschil niet onherroepelijk is beslist;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18b
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18b
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
  - number: 18c.2.d
    text: |-
      ingeval de verzekeringnemer zich heeft aangemeld bij een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref1] en aantoont dat hij in het kader daarvan een schriftelijke
      overeenkomst tot stabilisatie van zijn schulden heeft gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel48
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '48'
  - number: 18c.3
    text: |-
      Onderdeel van de melding vormt een verklaring van de zorgverzekeraar, inhoudende dat hij [artikel 18b][ref1] en het
      tweede lid in acht heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18b
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18b
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
  - number: 18d.1
    text: |-
      De verzekeringnemer is aan het College zorgverzekeringen een bestuursrechtelijke premie verschuldigd vanaf de
      eerste dag van de maand volgende op de maand waarin dat college de melding, bedoeld in [artikel 18c][ref1], heeft
      ontvangen tot de eerste dag van de maand volgende op de maand waarin de datum, bedoeld in het derde lid, ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18c
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18c
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
  - number: 18d.2
    text: |-
      De bestuursrechtelijke premie bedraagt per maand 130% van de tot een maandbedrag herleide standaardpremie, bedoeld
      in de Wet op de zorgtoeslag.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18d
  - number: 18d.3
    text: |-
      De zorgverzekeraar stelt het College zorgverzekeringen, de verzekeringnemer en, indien deze een ander is dan de
      verzekeringnemer, de verzekerde, met het oog op de toepassing van het eerste lid onverwijld op de hoogte van de
      datum waarop:
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18d
  - number: 18d.3.a
    text: de uit de zorgverzekering voortvloeiende schulden zijn of zullen zijn afgelost of tenietgaan,
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18d
  - number: 18d.3.b
    text: |-
      de schuldsaneringsregeling natuurlijke personen, bedoeld in de Faillissementswet, op de verzekeringnemer van
      toepassing wordt, of
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18d
  - number: 18d.3.c
    text: |-
      door tussenkomst van een schuldhulpverlener als bedoeld in [artikel 48 van de Wet op het consumentenkrediet][ref1]
      een overeenkomst als bedoeld in [artikel 18c, tweede lid, onderdeel d][ref2], is gesloten of een schuldregeling tot
      stand is gekomen waarin, naast de verzekeringnemer, ten minste zijn zorgverzekeraar deelneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel18c
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: 18c
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
  - number: 18d.4
    text: |-
      In afwijking van het eerste tot en met derde lid, is de verzekeringnemer wederom aan het College zorgverzekeringen
      bestuursrechtelijke premie verschuldigd vanaf de eerste dag van de maand volgende op de maand:
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18d
  - number: 18d.4.a
    text: |-
      waarin de toepassing van de schuldsaneringsregeling natuurlijke personen op grond van
      [artikel 350, derde lid, onderdeel c, d, e, f, of g, van de Faillissementswet][ref1], is beëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel350
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '350'
  - number: 18d.4.b
    text: |-
      waarin hij zich, blijkens een mede door de schuldhulpverlener ondertekende melding van zijn zorgverzekeraar, aan
      deelname aan de in het derde lid, onderdeel c, bedoelde regeling heeft onttrokken voordat hij de in die regeling
      neergelegde afspraken jegens zijn zorgverzekeraar volledig is nagekomen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18d
  - number: 18e.1
    text: Het College zorgverzekeringen heft en int de bestuursrechtelijke premie.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18e
  - number: 18e.2
    text: |-
      In opdracht van het College zorgverzekeringen houdt de inhoudingsplichtige de bestuursrechtelijke premie geheel of
      voor een door dat college te bepalen gedeelte in op door hem aan de verzekeringnemer verschuldigd loon als bedoeld
      in de [Wet op de loonbelasting 1964][ref1], waarna hij het ingehouden bedrag aan het college afdraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18e
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 18e.3
    text: |-
      De inhouding geschiedt onmiddellijk nadat de krachtens een ander wettelijk voorschrift of krachtens een
      arbeidsovereenkomst verplicht in te houden belastingen, premies of andere bijdragen zijn ingehouden, met dien
      verstande dat bij ministeriële regeling op socialezekerheidsuitkeringen te verrichten inhoudingen of verrekeningen
      kunnen worden aangewezen waarvoor een andere volgorde geldt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18e
  - number: 18e.4
    text: |-
      Een inhoudingsplichtige die het door het College zorgverzekeringen aan te geven bedrag niet of niet geheel heeft
      ingehouden, is gehouden het gehele bedrag aan dat college af te dragen, zonder dat het niet ingehouden bedrag
      alsnog op de verzekeringnemer kan worden verhaald.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18e
  - number: 18e.5
    text: |-
      Indien op loon waarop bestuursrechtelijke premie is ingehouden tevens derdenbeslag ligt, is het bedrag dat de
      inhoudingsplichtige ten minste aan de verzekeringnemer uitbetaalt gelijk aan de beslagvrije voet, bedoeld in
      [artikel 475d van het Wetboek van Burgerlijke Rechtsvordering][ref1], verminderd met het in opdracht van het
      College zorgverzekeringen ingehouden bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18e
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 18e.6
    text: |-
      In opdracht van het College zorgverzekeringen wordt een aan de verzekeringnemer of zijn partner uit te
      betalen zorgtoeslag als bedoeld in de [Wet op de zorgtoeslag][ref1] of een voorschot daarop, in afwijking van
      [artikel 25, eerste lid, van de Algemene wet inkomensafhankelijke regelingen][ref2], als tegemoetkoming in de
      bestuursrechtelijke premie aan het College zorgverzekeringen uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0018451
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel25
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18e
    references:
      - id: ref1
        bwb_id: BWBR0018451
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '25'
  - number: 18e.7
    text: |-
      Het College zorgverzekeringen kan de bestuursrechtelijke premie of het door de werkgever af te dragen bedrag,
      bedoeld in het vierde lid, bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18e
  - number: 18e.8
    text: |-
      Het College zorgverzekeringen heeft terzake van de bestuursrechtelijke premie die op andere wijze dan bij wege van
      inhouding wordt geïnd, een voorrecht op alle goederen van de verzekeringnemer, welk voorrecht onmiddellijk na het
      voorrecht, bedoeld in [artikel 21 van de Invorderingswet 1990][ref1], kan worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel21
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18e
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '21'
  - number: 18e.9
    text: |-
      Indien het College zorgverzekeringen ter zake van de inning van de bestuursrechtelijke premie beslag laat leggen
      onder een derde die de verzekeringnemer periodieke betalingen, niet zijnde periodieke betalingen ter zake van
      het levensonderhoud van diens kinderen, verschuldigd is, is de derde-beslagene verplicht om, zolang het college
      dit verlangt, het door het college aangegeven achterstallige bedrag en telkens de nieuw vervallende termijnen van
      de bestuursrechtelijke premie of door het college te bepalen gedeelten daarvan, tot welker verhaal het beslag is
      gelegd, aan het college uit te betalen, tenzij onder hem beslag gelegd mocht worden wegens vorderingen van hogere
      of gelijke rang.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18e
  - number: 18e.10
    text: |-
      Indien een beslag als bedoeld in het negende lid is gelegd op een vordering tot een periodieke betaling als bedoeld
      in [artikel 475c van het Wetboek van Burgerlijke Rechtsvordering][ref1], wordt de beslagvrije voet, bedoeld in
      [artikel 475d van die wet][ref2], louter ten aanzien van de vordering van het College zorgverzekeringen ter zake
      waarvan het beslag is gelegd, in aanvulling op het vijfde lid, onderdeel a, van laatstgenoemd artikel verlaagd met
      het verschil tussen de bestuursrechtelijke premie en het reeds ingehouden bedrag van die premie.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18e
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 18e.11
    text: |-
      De derde die meer aan het College zorgverzekeringen heeft betaald dan waarop deze recht heeft, is jegens de
      verzekeringnemer bevrijd, voor zover dat voortvloeit uit [artikel 34 van Boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel34
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18e
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '34'
  - number: 18f.1
    text: |-
      Het College zorgverzekeringen gebruikt het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-
      fiscaalnummer van de in [artikel 18c, eerste lid][ref1], bedoelde personen, met het doel te waarborgen dat de in
      het kader van de uitvoering van deze afdeling en [artikel 34a][ref2] te verwerken persoonsgegevens op die personen
      betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18c
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel34a
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18c
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
      - id: ref2
        bwb_id: BWBR0018450
        artikel: 34a
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 18f.2
    text: |-
      Bij gegevensuitwisseling tussen het College zorgverzekeringen en de in de [artikelen 18e][ref1], [88][ref2] en
      [89][ref3] bedoelde personen en instanties wordt, voor de uitvoering van deze afdeling en voor zover die personen
      en instanties tot gebruik van dat nummer bevoegd zijn, het burgerservicenummer of, bij het ontbreken daarvan, het
      sociaal-fiscaalnummer gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18e
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel89
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18e
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '88'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '89'
        hoofdstuk: '8'
  - number: 18f.3
    text: |-
      Het College zorgverzekeringen is bevoegd schulden ter zake van de bestuursrechtelijke premie die hem nog niet zijn
      voldaan nadat [artikel 18d][ref1] niet meer op de verzekeringnemer van toepassing is, kwijt te schelden.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
  - number: 18f.4
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de wijze waarop het College zorgverzekeringen de
      bestuursrechtelijke premie int.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel18f
  - number: '19.1'
    text: Iedere verzekerde van achttien jaar of ouder heeft een verplicht eigen risico van € 170 per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel19
  - number: '19.2'
    text: |-
      Het bedrag, genoemd in het eerste lid, wordt jaarlijks geïndexeerd overeenkomstig het verschil in geraamde uitgaven
      voor de zorg en overige diensten, bedoeld in [artikel 11][ref1], tussen het kalenderjaar waarop het verplicht eigen
      risico betrekking zal hebben en vergelijkbare uitgaven voor het jaar voorafgaand aan dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '19.3'
    text: |-
      Indien het geïndexeerde bedrag naar beneden afgerond € 5 of een veelvoud daarvan verschilt van het in het eerste
      lid genoemde bedrag, wordt dit bedrag bij ministeriële regeling gewijzigd, waarna het in die regeling genoemde
      bedrag in de plaats treedt van het in het eerste lid genoemde bedrag.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel19
  - number: '19.4'
    text: |-
      Rekeningen voor kosten van zorg of overige diensten worden slechts op het verplicht eigen risico in mindering
      gebracht, indien deze door de zorgverzekeraar zijn ontvangen voor een bij algemene maatregel van bestuur te bepalen
      dag van het kalenderjaar volgend op het kalenderjaar waarop het verplicht eigen risico betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel19
  - number: '19.5'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald op welke wijze het verplicht eigen risico in mindering wordt
      gebracht.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel19
  - number: '20.1'
    text: |-
      De zorgverzekeraar biedt van iedere zorgverzekering met een bepaalde combinatie van te verzekeren prestaties als
      bedoeld in [artikel 11, eerste lid][ref1], een variant zonder vrijwillig eigen risico aan.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '20.2'
    text: |-
      De zorgverzekeraar kan voor de verzekering van een persoon van achttien jaar of ouder varianten van de
      zorgverzekering aanbieden met een vrijwillig eigen risico van € 100, € 200, € 300, € 400 of € 500 per kalenderjaar,
      waartegenover hij een korting op de grondslag van de premie verleent.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel20
  - number: '20.3'
    text: 'De korting mag afhangen van:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel20
  - number: 20.3.a
    text: de omvang van het voor de verzekerde gekozen vrijwillig eigen risico;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel20
  - number: 20.3.b
    text: het aantal kalenderjaren waarvoor een vrijwillig eigen risico voor de verzekerde gegolden heeft.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel20
  - number: '20.4'
    text: |-
      De zorgverzekeraar neemt in zijn modelovereenkomst op welke premiekorting bij welk vrijwillig eigen risico voor
      welk aantal kalenderjaren geldt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel20
  - number: '20.5'
    text: |-
      Indien de zorgverzekeraar een of meer van de door hem aangeboden vrijwillige eigen risico’s laat vervallen, geeft
      de zorgverzekeraar de verzekeringnemers die een zorgverzekering met zo’n vrijwillig eigen risico hebben afgesloten,
      de mogelijkheid om te kiezen voor een zorgverzekering met een lager of zonder vrijwillig eigen risico.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel20
  - number: '21.1'
    text: |-
      Het percentage van de kosten van zorg of overige diensten dat ten laste gaat van het verplicht eigen risico, wordt
      bij algemene maatregel van bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel21
  - number: '21.2'
    text: |-
      In afwijking van het eerste lid kunnen bij algemene maatregel van bestuur vormen van zorg of overige diensten
      worden aangewezen waarvoor de kosten geheel, gedeeltelijk of in het geheel niet onder het verplicht eigen risico
      vallen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel21
  - number: '21.3'
    text: |-
      In afwijking van het eerste lid kunnen bij algemene maatregel van bestuur vormen van zorg of overige diensten
      worden aangewezen waarvan de zorgverzekeraar, onder bij die maatregel te bepalen voorwaarden, kan bepalen dat de
      kosten geheel of gedeeltelijk buiten het verplicht eigen risico vallen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel21
  - number: '21.4'
    text: |-
      De zorgverzekeraar kan vormen van zorg of overige diensten aanwijzen waarvan de kosten niet onder het vrijwillig
      eigen risico vallen, met dien verstande dat bij algemene maatregel van bestuur vormen van zorg of overige diensten
      kunnen worden aangewezen waarvan de kosten geheel of gedeeltelijk buiten het vrijwillig eigen risico vallen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel21
  - number: '22.1'
    text: |-
      Indien een zorgverzekering niet op 1 januari van een kalenderjaar ingaat of eindigt, is het in dat kalenderjaar
      voor die overeenkomst geldende bedrag van het verplicht eigen risico en indien dat van toepassing is, vrijwillig
      eigen risico gelijk aan het voor het gehele kalenderjaar geldende bedrag, vermenigvuldigd met een breuk waarvan de
      teller gelijk is aan het aantal dagen in dat kalenderjaar waarover de zorgverzekering zal lopen of heeft gelopen,
      en de noemer aan het aantal dagen in het desbetreffende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel22
  - number: '22.2'
    text: |-
      In afwijking van het eerste lid wordt het in het kalenderjaar geldende bedrag van het vrijwillig eigen risico
      indien dat gedurende het kalenderjaar wijzigt en de verzekeringnemer onmiddellijk voorafgaande aan die wijziging
      reeds een zorgverzekering met de zorgverzekeraar had gesloten, als volgt berekend:
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel22
  - number: 22.2.a
    text: |-
      ieder bedrag aan vrijwillig eigen risico dat in het desbetreffende kalenderjaar heeft gegolden of zal gelden, wordt
      vermenigvuldigd met het aantal in dat jaar gelegen dagen waarvoor dat risico gold of zal gelden;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel22
  - number: 22.2.b
    text: de op grond van onderdeel a berekende bedragen worden bij elkaar opgeteld;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel22
  - number: 22.2.c
    text: het op grond van onderdeel b berekende bedrag wordt gedeeld door het aantal dagen in het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel22
  - number: '22.3'
    text: Het op grond van het eerste of tweede lid berekende bedrag wordt afgerond op hele euro’s.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel22
  - number: '23.1'
    text: |-
      Kosten van zorg of een andere dienst worden toegerekend aan het kalenderjaar waarin de zorg of dienst is genoten,
      met dien verstande dat de kosten van zorg of een andere dienst die in twee achtereenvolgende kalenderjaren
      is genoten en door de zorgaanbieder of andere dienstverlener in één bedrag in rekening zijn gebracht, worden
      toegerekend aan het kalenderjaar waarin de zorg of dienst is aangevangen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel23
  - number: '23.2'
    text: |-
      Bedragen als bedoeld in [artikel 11, derde of vierde lid][ref1], die voor rekening van de verzekerde komen, of
      kosten als bedoeld in [artikel 13, eerste lid][ref2], voor zover zij voor rekening van de verzekerde blijven,
      worden bij de beantwoording van de vraag of een voor zijn verzekering geldend verplicht of vrijwillig eigen risico
      wordt overschreden, buiten aanmerking gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel13
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '23.3'
    text: |-
      Een zorgverzekeraar brengt kosten van zorg of overige diensten die zowel ten laste van het verplicht als het
      vrijwillig eigen risico kunnen komen, eerst ten laste van het verplicht eigen risico.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel23
  - number: '24.1'
    text: |-
      De rechten en plichten uit de zorgverzekering zijn van rechtswege opgeschort gedurende de periode waarover Onze
      Minister van Justitie in het kader van de uitvoering van een rechterlijke uitspraak verantwoordelijk is voor de
      verstrekking van geneeskundige zorg aan een verzekerde.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel24
  - number: '24.2'
    text: |-
      De verzekeringnemer of de verzekerde meldt de zorgverzekeraar de dag waarop de periode, bedoeld in het eerste lid,
      aanvangt en eindigt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel24
  - number: '25.1'
    text: |-
      Een verzekeraar meldt het voornemen zorgverzekeringen aan te bieden en uit te voeren schriftelijk aan de
      zorgautoriteit, onder vermelding van de dag met ingang waarvan hij zorgverzekeringen zal aanbieden.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel25
  - number: '25.2'
    text: |-
      De verzekeraar voegt bij de melding alle modelovereenkomsten volgens welke hij zorgverzekeringen wenst aan te
      bieden.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel25
  - number: '25.3'
    text: |-
      Een zorgverzekeraar legt wijzigingen in zijn modelovereenkomsten of nieuwe modelovereenkomsten voordat deze ingaan
      aan de zorgautoriteit over.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel25
  - number: '26.1'
    text: |-
      De zorgautoriteit tekent de datum van ontvangst aan op het geschrift waarmee de melding, bedoeld in
      [artikel 25, eerste lid][ref1], is gedaan, alsmede op de modelovereenkomsten of wijzigingen daarvan, bedoeld in
      [artikel 25, tweede en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel25
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '26.2'
    text: De zorgautoriteit zendt de verzekeraar onverwijld een bewijs van ontvangst, waarin die datum is vermeld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel26
  - number: '26.3'
    text: |-
      De zorgautoriteit zendt het College zorgverzekeringen onverwijld een afschrift van de melding, de
      modelovereenkomsten of de wijzigingen in de modelovereenkomsten, onder vermelding van de datum van ontvangst ervan.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel26
  - number: '26.4'
    text: |-
      De zorgautoriteit zendt de beheerder van het register van zorgverzekeraars, bedoeld in
      [artikel 14 van de Wet gebruik burgerservicenummer in de zorg][ref1], onverwijld een afschrift van de melding onder
      vermelding van de datum van ontvangst ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel14
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '14'
  - number: '27'
    text: |-
      Een verzekeraar die ten onrechte een verzekering als zorgverzekering aanbiedt of uitvoert, is gehouden de schade
      die een verzekeringsplichtige of degene die hem heeft verzekerd dientengevolge lijdt, te vergoeden.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel27
  - number: '28.1'
    text: 'De statuten van een zorgverzekeraar:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel28
  - number: 28.1.a
    text: |-
      voorzien in toezicht op het beleid van het bestuur en op de algemene gang van zaken in de rechtspersoon en de
      daarmee verbonden onderneming,
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel28
  - number: 28.1.b
    text: bieden waarborgen voor een redelijke mate van invloed van de verzekerden op het beleid, en
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel28
  - number: 28.1.c
    text: |-
      sluiten iedere verplichting van de verzekeringnemers, verzekerden, gewezen verzekeringnemers of gewezen verzekerden
      tot het doen van een bijdrage in tekorten van de rechtspersoon uit.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel28
  - number: '28.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de mate van invloed die verzekerden ten minste
      op het beleid van een zorgverzekeraar dienen te hebben.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel28
  - number: '29.1'
    text: Het werkgebied van een zorgverzekeraar is Nederland.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel29
  - number: '29.2'
    text: |-
      In afwijking van het eerste lid kan een zorgverzekeraar zijn werkgebied tot een of meer gehele provincies van
      Nederland beperken zolang bij hem minder dan 850 000 verzekerden op basis van een zorgverzekering verzekerd zijn.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel29
  - number: '29.3'
    text: |-
      Voor de bepaling van het aantal verzekerden, bedoeld in het tweede lid, wordt uitgegaan van het gemiddelde aantal
      verzekerden in het tweede jaar voorafgaande aan het jaar waarvoor de bepaling geschiedt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel29
  - number: '29.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop het aantal verzekerden wordt bepaald
      indien de zorgverzekeraar in het tweede of eerste jaar voorafgaande aan het jaar waarvoor de bepaling geschiedt,
      rechtsopvolger is geweest van, gefuseerd is met, of afgesplitst is van een andere zorgverzekeraar dan wel indien
      deze verzekeraar zorgverzekeringen van een andere zorgverzekeraar heeft overgenomen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel29
  - number: '30.1'
    text: |-
      Een zorgverzekeraar die geen zorgverzekeringen meer wenst aan te bieden of uit te voeren, meldt het
      voornemen hiertoe schriftelijk aan de zorgautoriteit, onder vermelding van de dag met ingang waarvan hij geen
      zorgverzekeringen meer zal uitvoeren.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel30
  - number: '30.2'
    text: |-
      [Artikel 26][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel26
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '31.1'
    text: |-
      Indien jegens een zorgverzekeraar of een voormalige zorgverzekeraar de noodregeling is uitgesproken
      krachtens [afdeling 3.5.5 van de Wet op het financieel toezicht][ref1] of een voormalige zorgverzekeraar
      failliet is verklaard, voldoet het College zorgverzekeringen aan de verzekerden jegens die zorgverzekeraar
      of voormalige zorgverzekeraar bestaande vorderingen ter zake van een recht op vergoeding als bedoeld in
      [artikel 11, eerste lid, onderdeel b][ref2], of [artikel 13][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Afdeling3.5.5
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel13
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0020368
        afdeling: 3.5.5
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '31.2'
    text: |-
      De vorderingen, bedoeld in het eerste lid, gaan bij wijze van subrogatie op het College zorgverzekeringen over voor
      zover dat college deze heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel31
  - number: '31.3'
    text: Het Rijk is tegenover het College zorgverzekeringen aansprakelijk voor de betalingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel31
  - number: '32.1'
    text: |-
      Het College zorgverzekeringen kent een zorgverzekeraar die voldaan heeft aan zijn verplichtingen, bedoeld in
      [artikel 25][ref1], voor ieder kalenderjaar waarin hij zorgverzekeringen aanbiedt en uitvoert een bijdrage toe.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel25
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '32.2'
    text: Bij algemene maatregel van bestuur worden regels omtrent de berekening van de bijdragen gesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel32
  - number: '32.3'
    text: |-
      De regels, bedoeld in het tweede lid, bepalen ten minste dat de hoogte van de bijdrage wordt berekend op basis
      van bij die maatregel te bepalen, voor alle zorgverzekeraars gelijke criteria, waaronder in ieder geval het aantal
      verzekerden bij een zorgverzekeraar en een aantal verzekerdenkenmerken.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel32
  - number: '32.4'
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel32
  - number: 32.4.a
    text: |-
      wordt voor 1 oktober van ieder jaar bepaald welk bedrag in totaal voor het daaropvolgende kalenderjaar aan de
      zorgverzekeraars kan worden toegekend;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel32
  - number: 32.4.b
    text: |-
      kan worden bepaald dat in aanvulling op de criteria, bedoeld in het derde lid, voor de berekening van de hoogte
      van de bijdragen eenmalig rekening wordt gehouden met een bij die regeling te bepalen, voor alle zorgverzekeraars
      gelijk criterium;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel32
  - number: 32.4.c
    text: |-
      wordt statistisch onderbouwd aan elk criterium als bedoeld in het derde lid of aan een criterium als bedoeld in
      onderdeel b een bijdrage gekoppeld;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel32
  - number: 32.4.d
    text: |-
      worden nadere regels omtrent de berekening van de bijdragen gesteld en wordt geregeld hoe de op grond van het
      eerste lid toegekende bijdragen door het College zorgverzekeringen worden betaald.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel32
  - number: '32.5'
    text: |-
      Het College zorgverzekeringen stelt jaarlijks voor 15 oktober beleidsregels vast waarin wordt aangegeven op welke
      wijze toepassing wordt gegeven aan de in het vierde lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel32
  - number: '32.6'
    text: |-
      De toekenning, bedoeld in het eerste lid, geschiedt voor 1 november van het jaar voorafgaande aan het jaar waarvoor
      de bijdrage wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel32
  - number: '32.7'
    text: De beleidsregels, bedoeld in het vijfde lid, behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel32
  - number: '33.1'
    text: |-
      Bij ministeriële regeling kunnen, ingeval van een kernexplosie of natuurramp, of andere buitengewone gebeurtenissen
      die niet tot het normale bedrijfsrisico van zorgverzekeraars kunnen worden gerekend, na aanvang van het
      kalenderjaar middelen voor bijdragen aan een of meer zorgverzekeraars beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel33
  - number: '33.2'
    text: |-
      Het College zorgverzekeringen kent de bijdragen aan de bij de ministeriële regeling aangewezen zorgverzekeraars
      toe.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel33
  - number: '33.3'
    text: |-
      Bij ministeriële regeling worden regels omtrent de berekening van de bijdragen gesteld en wordt geregeld hoe de
      toegekende bijdragen door het College zorgverzekeringen worden betaald.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel33
  - number: '33.4'
    text: |-
      [Artikel 32, vijfde en zevende lid][ref1], zijn, met uitzondering van de in het vijfde lid genoemde datum, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel32
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '34.1'
    text: |-
      Uiterlijk in het tweede jaar volgende op het kalenderjaar waarvoor de bijdragen, bedoeld in [artikel 32][ref1] en
      [33][ref2], zijn toegekend, stelt het College zorgverzekeringen de bijdrage vast.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel33
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '34.2'
    text: |-
      De vaststelling van een bijdrage als bedoeld in [artikel 32][ref1], houdt in ieder geval in een herberekening
      van de bijdrage op basis van het werkelijke aantal verzekerden dat de zorgverzekeraar in het desbetreffende jaar
      had en de werkelijke verdeling van de verzekerdenkenmerken als bedoeld in [artikel 32, derde lid][ref2], over die
      verzekerden, voor zover de daartoe benodigde gegevens tijdig bij het College zorgverzekeringen zijn aangeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel32
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '34.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels omtrent de berekening van de bijdragen
      gesteld, met dien verstande dat generieke verevening slechts tot en met 31 december 2010 mogelijk is.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel34
  - number: '34.4'
    text: |-
      Het College zorgverzekeringen stelt beleidsregels op waarin wordt aangegeven op welke wijze toepassing wordt
      gegeven aan de in het derde lid bedoelde regels en op welke wijze een vergoeding voor rentekosten wordt verleend
      respectievelijk in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel34
  - number: '34.5'
    text: |-
      Indien de vastgestelde bijdrage hoger is dan de toegekende bijdrage betaalt het College zorgverzekeringen de
      zorgverzekeraar of diens rechtsopvolger het verschil, vermeerderd met de rentekosten, en indien de vastgestelde
      bijdrage lager is dan de toegekende bijdrage vordert het College zorgverzekeringen het verschil, vermeerderd met de
      rentekosten, van de zorgverzekeraar of diens rechtsopvolger terug.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel34
  - number: '34.6'
    text: |-
      Het College zorgverzekeringen is bevoegd het bedrag dat na toepassing van het eerste en vijfde lid aan de
      zorgverzekeraar dient te worden betaald respectievelijk van de zorgverzekeraar dient te worden teruggevorderd, te
      verrekenen met een toekenning van een bijdrage als bedoeld in [artikel 32][ref1] of [33][ref2] over een later jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel33
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 34a.1
    text: |-
      Het College zorgverzekeringen verstrekt een zorgverzekeraar een bijdrage indien hij verzekerden voor wier
      zorgverzekering de bestuursrechtelijke premie verschuldigd is, onverminderd onder de dekking van de zorgverzekering
      heeft gehouden.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel34a
  - number: 34a.2
    text: 'De bijdrage wordt slechts verstrekt indien de zorgverzekeraar:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel34a
  - number: 34a.2.a
    text: |-
      zich heeft gehouden aan zijn verplichtingen, bedoeld in [artikel 18a][ref1], [18b][ref2] en
      [18c, tweede en derde lid][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel18b
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel18c
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18a
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
      - id: ref2
        bwb_id: BWBR0018450
        artikel: 18b
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
      - id: ref3
        bwb_id: BWBR0018450
        artikel: 18c
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
  - number: 34a.2.b
    text: |-
      voorafgaande aan de melding, bedoeld in [artikel 18c][ref1], ook naast de op incasso gerichte inspanningen, bedoeld
      in de [artikelen 18a][ref2] en [18b][ref3], voldoende inpanningen tot inning van de premie heeft geleverd, en


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18c
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel18b
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18c
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
      - id: ref2
        bwb_id: BWBR0018450
        artikel: 18a
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
      - id: ref3
        bwb_id: BWBR0018450
        artikel: 18b
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
  - number: 34a.2.c
    text: |-
      zich houdt aan zijn verplichting, bedoeld in [artikel 18d, derde lid][ref1], en desgevraagd voldoende medewerking
      verleent aan activiteiten van de verzekeringnemer of derden, gericht op aflossing van de jegens de zorgverzekeraar
      bestaande, uit de zorgverzekering voortvloeiende schuld.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
  - number: 34a.3
    text: |-
      De periode waarover de bijdrage wordt verstrekt en de hoogte ervan, alsmede de wijze waarop deze wordt verstrekt,
      worden bij ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel34a
  - number: 34a.4
    text: |-
      Het College zorgverzekeringen is bevoegd de te verstrekken bijdrage te verrekenen met van de zorgverzekeraar terug
      te vorderen bedragen aan vereveningsbijdrage.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel34a
  - number: '35.1'
    text: |-
      Het College zorgverzekeringen draagt zorg voor het inrichten en in stand houden van een administratie, waarin van
      iedere verzekerde wordt opgenomen:
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel35
  - number: 35.1.a
    text: het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel35
  - number: 35.1.b
    text: de zorgverzekeraar waarbij de verzekerde verzekerd is;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel35
  - number: 35.1.c
    text: |-
      de persoonsgegevens, waaronder persoonsgegevens betreffende de gezondheid als bedoeld in de
      [Wet bescherming persoonsgegevens][ref1], die noodzakelijk zijn voor de berekening van aan de zorgverzekeraar
      toekomende bijdragen als bedoeld in de [artikelen 32 tot en met 34][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel32
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011468
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '35.2'
    text: |-
      De zorgverzekeraar meldt het College zorgverzekeringen, onder vermelding van de ingangsdatum ervan, iedere door hem
      gesloten zorgverzekering, alsmede, indien de zorgverzekering is geëindigd, de datum waarop deze eindigde.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel35
  - number: '35.3'
    text: |-
      Indien het College zorgverzekeringen constateert dat een verzekerde bij twee of meer zorgverzekeraars verzekerd is,
      stelt hij de betrokken zorgverzekeraars daarvan, onder vermelding van de namen van alle zorgverzekeraars waarbij de
      verzekerde verzekerd is, terstond op de hoogte.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel35
  - number: '35.4'
    text: 'Bij ministeriële regeling kunnen:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel35
  - number: 35.4.a
    text: |-
      regels worden gesteld over de in de administratie van het College zorgverzekeringen op te nemen persoonsgegevens
      als bedoeld in het eerste lid, onderdeel c;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel35
  - number: 35.4.b
    text: |-
      regels worden gesteld over de inrichting van de administratie van het College zorgverzekeringen, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel35
  - number: '36'
    text: |-
      Op rechten of verplichtingen die voortvloeien uit hetgeen in deze paragraaf geregeld is, is
      [titel 4.2 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '37.1'
    text: |-
      De zorgverzekeraar zendt binnen zes maanden na afloop van het boekjaar twee exemplaren van zijn jaarrekening en van
      zijn jaarverslag aan de zorgautoriteit.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel37
  - number: '37.2'
    text: |-
      Een zorgverzekeraar die [artikel 403 van Boek 2 van het Burgerlijk Wetboek][ref1] toepast, zendt de jaarrekening,
      het jaarverslag en de geconsolideerde jaarrekening onverwijld na de neerlegging van het jaarverslag en de
      geconsolideerde jaarrekening ten kantore van het handelsregister, in tweevoud aan de zorgautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel403
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '403'
  - number: '37.3'
    text: |-
      De zorgverzekeraar voegt bij de stukken, bedoeld in het eerste of tweede lid, twee afschriften van de
      accountantsverklaring die hij op grond van het Burgerlijk Wetboek of de [Wet op het financieel toezicht][ref1] over
      deze stukken dient te laten opstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '37.4'
    text: |-
      De zorgautoriteit zendt het College zorgverzekeringen onverwijld één exemplaar van de in het eerste tot en met
      derde lid bedoelde stukken.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel37
  - number: '38.1'
    text: 'De zorgverzekeraar zendt voor 1 juli aan de zorgautoriteit in tweevoud een uitvoeringsverslag waarin hij:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel38
  - number: 38.1.a
    text: rapporteert over de uitvoering van deze wet in het voorafgaande kalenderjaar, en
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel38
  - number: 38.1.b
    text: |-
      een overzicht geeft van zijn voornemens met betrekking tot de uitvoering van deze wet in het lopende kalenderjaar
      en het daaropvolgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel38
  - number: '38.2'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gesteld omtrent de inhoud van het uitvoeringsverslag.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel38
  - number: '38.3'
    text: |-
      De voorschriften, bedoeld in het tweede lid, kunnen in het bijzonder betrekking hebben op naleving van een in de
      regeling aan te wijzen gedragscode.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel38
  - number: '38.4'
    text: |-
      De zorgverzekeraar voegt bij het uitvoeringsverslag twee exemplaren van een verslag met bevindingen van een
      accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1] over de vraag of:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 38.4.a
    text: het uitvoeringsverslag overeenkomstig de daarvoor geldende regels is opgesteld;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel38
  - number: 38.4.b
    text: |-
      de uitvoering is geschied overeenkomstig de verplichtingen die bij of krachtens deze wet in het voorafgaande
      kalenderjaar op de zorgverzekeraar rustten.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel38
  - number: '38.5'
    text: |-
      [Artikel 37, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel37
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '39.1'
    text: Er is een Zorgverzekeringsfonds.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
  - number: '39.2'
    text: 'Ten gunste van het Zorgverzekeringsfonds komen:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
  - number: 39.2.a
    text: |-
      de inkomensafhankelijke bijdragen, bedoeld in [paragraaf 5.2][ref1], alsmede de daarmee verband houdende
      bestuurlijke boeten en renten;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 39.2.b
    text: |-
      de rijksbijdrage, bedoeld in [artikel 54][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel54
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '54'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 39.2.c
    text: |-
      een rijksbijdrage als bedoeld in de [artikelen 55][ref1] of [56][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel56
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 39.2.d
    text: |-
      een bedrag van iedere rekening, bedoeld in [artikel 70][ref1], gelijk aan:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel70
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '70'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 39.2.d.1°
    text: |-
      jaarlijks: de helft van de bijdragevervangende belastingen die degenen wier bijdragevervangende belastingen op die
      rekening werden gestort, over het voorafgaande kalenderjaar gezamenlijk verschuldigd waren, of zoveel minder als
      het saldo bedraagt;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
  - number: 39.2.d.2°
    text: |-
      voor iedere tot een huishouding als bedoeld in [artikel 70, tweede lid][ref1], behorende gemoedsbezwaarde die
      alsnog verzekeringsplichtig wordt dan wel overlijdt: het saldo van de rekening gedeeld door het aantal tot de
      huishouding behorende gemoedsbezwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel70
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '70'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 39.2.d.3°
    text: |-
      indien de rekening met toepassing van [artikel 70, zevende lid][ref1], wordt opgeheven: het saldo van de rekening;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel70
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '70'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 39.2.e
    text: |-
      aan het College zorgverzekeringen betaalde bedragen ter gehele of gedeeltelijke voldoening van vorderingen als
      bedoeld in [artikel 31, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel31
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 39.2.f
    text: |-
      de bijdragen en bestuurlijke boeten, bedoeld in [artikel 69][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 39.2.g
    text: |-
      de bestuursrechtelijke premies, bedoeld in [artikel 18d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
  - number: 39.2.h
    text: de inkomsten die in verband met deze wet voortvloeien uit internationale overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
  - number: 39.2.i
    text: |-
      de door de zorgautoriteit van verzekeraars op grond van [artikel 83 van de Wet marktordening gezondheidszorg][ref1]
      geïnde dwangsommen, de ingevorderde bestuurlijke boeten als bedoeld in de
      [artikelen 86 tot en met 89 van die wet][ref2], alsmede de ingevorderde bestuurlijke boeten als bedoeld in
      [artikel 96][ref3] van deze wet, nadat deze zijn verminderd met de in het zesde lid van dat artikel bedoelde
      vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel96
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '83'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '86'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '96'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: '39.3'
    text: 'Ten laste van het Zorgverzekeringsfonds komen:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
  - number: 39.3.a
    text: |-
      de bijdragen, bedoeld in de [artikelen 32][ref1], [33][ref2], [34][ref3] en [34a][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel34a
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0018450
        artikel: 34a
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 39.3.b
    text: |-
      subsidies als bedoeld in [artikel 68][ref1], inclusief vergoedingen als bedoeld in het
      [tweede lid van dat artikel][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel68
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '68'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '68'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 39.3.c
    text: |-
      door het College zorgverzekeringen voldane vorderingen als bedoeld in [artikel 31, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel31
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 39.3.d
    text: |-
      uitgaven in verband met molest als bedoeld in [artikel 55][ref1], inclusief vergoedingen als bedoeld in het
      [derde lid van dat artikel][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel55
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 39.3.e
    text: de uitgaven die in verband met deze wet voortvloeien uit internationale overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
  - number: 39.3.f
    text: |-
      uitkeringen als bedoeld in [artikel 118a][ref1] en de met de uitvoering van [dat artikel][ref2] gepaard gaande
      beheerskosten van het CAK;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel118a
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel118a
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 118a
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: 118a
        hoofdstuk: '11'
  - number: 39.3.g
    text: |-
      subsidies als bedoeld in [artikel 123a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel123a
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 123a
        hoofdstuk: '11'
  - number: '39.4'
    text: |-
      Uit het Zorgverzekeringsfonds kunnen, volgens bij ministeriële regeling te stellen regels, middelen worden gebruikt
      voor het vormen en in stand houden van een voor de doelstelling van het fonds noodzakelijke reserve.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel39
  - number: '40.1'
    text: Het College zorgverzekeringen beheert en administreert afzonderlijk het Zorgverzekeringsfonds.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel40
  - number: '40.2'
    text: |-
      Het College zorgverzekeringen houdt de financiële middelen die deel uitmaken van het Zorgverzekeringsfonds, in
      rekening-courant bij Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel40
  - number: '40.3'
    text: |-
      Het College zorgverzekeringen kan, voor de uitvoering van zijn wettelijke taken, beschikken over de financiële
      middelen die hij in rekening-courant bij Onze Minister van Financiën aanhoudt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel40
  - number: '40.4'
    text: |-
      In afwijking van het tweede lid kan het College zorgverzekeringen een deel van de in dat lid bedoelde financiële
      middelen buiten de in dat lid bedoelde rekening-courant houden.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel40
  - number: '40.5'
    text: |-
      Onze Minister stelt in overeenstemming met Onze Minister van Financiën, na overleg met het College
      zorgverzekeringen, de omvang van het in het vierde lid bedoelde deel van de financiële middelen vast.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel40
  - number: '40.6'
    text: |-
      Bij een tekort aan financiële middelen maakt het College zorgverzekeringen uitsluitend gebruik van de
      kredietfaciliteiten die door Onze Minister van Financiën worden verleend.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel40
  - number: '40.7'
    text: |-
      Onze Minister van Financiën informeert dagelijks het College zorgverzekeringen ten aanzien van de rekening-courant,
      in elk geval met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel40
  - number: 40.7.a
    text: de slotstanden per dag;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel40
  - number: 40.7.b
    text: alle dagelijks geboekte mutaties of transacties in de rekening-courant.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel40
  - number: '40.8'
    text: |-
      Het College zorgverzekeringen informeert Onze Minister van Financiën ten aanzien van de rekening-courant in elk
      geval met betrekking tot de prognoses van de saldi van de rekening-courant.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel40
  - number: '40.9'
    text: Onze Minister van Financiën brengt voor het beheer van de rekening-courant geen kosten in rekening.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel40
  - number: '40.10'
    text: |-
      Onze Minister stelt in overeenstemming met Onze Minister van Financiën, na overleg met het College
      zorgverzekeringen, regels omtrent de rente die over de saldi van de in het tweede lid bedoelde rekening-courant
      wordt vergoed onderscheidenlijk in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel40
  - number: '40.11'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Financiën, na overleg met het College zorgverzekeringen,
      regels stellen omtrent het tweede, zevende en achtste lid.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel40
  - number: '41'
    text: De verzekeringsplichtige is een inkomensafhankelijke bijdrage verschuldigd.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel41
  - number: '42'
    text: De inkomensafhankelijke bijdrage over een jaar wordt geheven over het bijdrage-inkomen van dat jaar.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel42
  - number: '43.1'
    text: |-
      Het bijdrage-inkomen van een jaar is het gezamenlijke bedrag van hetgeen door de verzekeringsplichtige in dat jaar
      is genoten aan:
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel43
  - number: 43.1.a
    text: |-
      belastbaar loon overeenkomstig de wettelijke bepalingen van de loonbelasting, verminderd met
      de ingevolge [artikel 46][ref1] genoten vergoeding en met uitzondering van loon als bedoeld in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref2] waarover de
      belasting op grond van [artikel 27a, eerste lid, van die wet][ref3] is verschuldigd door de inhoudingsplichtige en
      het hierdoor voor de werknemer in de zin van [die wet][ref4] ontstane voordeel, en vermeerderd met loon, bepaald
      volgens de regels van [artikel 3.82 van de Wet inkomstenbelasting 2001][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel27a
      [ref4]: https://wetten.overheid.nl/BWBR0002471
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 27a
      - id: ref4
        bwb_id: BWBR0002471
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 43.1.b
    text: |-
      belastbare winst uit onderneming, bepaald volgens de regels van
      [afdeling 3.2 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling3.2
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '3.2'
  - number: 43.1.c
    text: |-
      belastbaar resultaat uit overige werkzaamheden, bepaald volgens de regels van
      [afdeling 3.4 van de Wet inkomstenbelasting 2001][ref1], met uitzondering van de in de [artikelen 3.91][ref2] en
      [3.92 van de Wet inkomstenbelasting 2001][ref3] bedoelde werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 43.1.d
    text: |-
      belastbare periodieke uitkeringen en verstrekkingen, bepaald volgens de regels van
      [afdeling 3.5 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling3.5
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '3.5'
  - number: '43.2'
    text: |-
      Het bijdrage-inkomen wordt ten minste op nihil gesteld en wordt tot geen hoger bedrag in aanmerking genomen dan het
      bij regeling van Onze Minister, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid en Onze
      Minister van Financiën, vastgestelde bedrag.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel43
  - number: '43.3'
    text: |-
      Bij de berekening van het bijdrage-inkomen blijft het van dezelfde inhoudingsplichtige ontvangen loon als bedoeld
      in het eerste lid, onderdeel a, buiten aanmerking voor zover dat meer bedraagt dan een bij regeling van Onze
      Minister in overeenstemming met Onze Minister van Financiën en Onze Minister van Sociale Zaken en Werkgelegenheid,
      vastgesteld bedrag in een bijdragebetalingstijdvak.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel43
  - number: '43.4'
    text: |-
      Het bedrag, bedoeld in het derde lid, wordt vastgesteld voor loontijdvakken waarin loon als bedoeld in het eerste
      lid, onderdeel a, wordt genoten waarvoor Onze Minister, in overeenstemming met de Minister van Sociale Zaken en
      Werkgelegenheid, dit nodig acht.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel43
  - number: '43.5'
    text: |-
      Voor de herleiding van het loontijdvak, bedoeld in het vierde lid, van een jaar naar een ander loontijdvak is
      [artikel 25, eerste en vierde lid, van de Wet op de loonbelasting 1964][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel25
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '25'
  - number: '43.6'
    text: |-
      In de gevallen, bedoeld in [artikel 26b, eerste volzin, van de Wet op de loonbelasting 1964][ref1] en
      [artikel 19 Wet financiering sociale verzekeringen][ref2], blijven het tweede en het derde lid buiten toepassing
      bij de berekening van het als bijdrage-inkomen in aanmerking te nemen loon dat van de inhoudingsplichtige is
      genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel26b
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel19
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 26b
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '19'
  - number: '44.1'
    text: |-
      Het bedrag, bedoeld in [artikel 43, tweede lid][ref1], wordt jaarlijks bij beschikking van Onze Minister, in
      overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid en Onze Minister van Financiën, herzien,
      waarbij met inachtneming van het bij en krachtens het tweede lid bepaalde, het laatstelijk vastgestelde bedrag
      wordt verhoogd of verlaagd overeenkomstig het procentuele verschil tussen het indexcijfer der lonen op 31 juli
      daaraan voorafgaande en het indexcijfer, dat bij de laatste herziening is gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '44.2'
    text: |-
      Onder indexcijfer der lonen wordt verstaan het indexcijfer van de CAO-lonen per maand inclusief bijzondere
      uitkeringen, sector particuliere bedrijven, zoals dat op basis van het jaar 2000 wordt berekend door het Centraal
      Bureau voor de Statistiek naar de stand op de laatste werkdag van elke kalendermaand en voor de eerste maal, al dan
      niet voorlopig, wordt gepubliceerd in het Statistisch Bulletin van het Centraal Bureau voor de Statistiek.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel44
  - number: '44.3'
    text: Het in het tweede lid genoemde jaartal kan bij regeling van Onze Minister worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel44
  - number: '44.4'
    text: |-
      Bij de eerstvolgende herziening nadat een in het derde lid bedoelde regeling is getroffen, wordt, in afwijking
      van het eerste lid, het procentuele verschil gehanteerd tussen het indexcijfer der lonen op 31 juli daaraan
      voorafgaande en het indexcijfer dat bij de laatste herziening zou zijn gehanteerd, ware de indexcijferreeks reeds
      op het gewijzigde jaartal gebaseerd.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel44
  - number: '44.5'
    text: |-
      Indien daartoe een bijzondere aanleiding bestaat, kan bij algemene maatregel van bestuur van de in het eerste en
      tweede lid aangegeven aanpassingsmethode worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel44
  - number: '44.6'
    text: |-
      Indien een wijziging ingaat op een ander tijdstip dan 1 januari, vindt de vaststelling plaats in overeenstemming
      met Onze Minister van Financiën en kunnen daarbij regels worden gesteld omtrent de wijze van berekening van de
      bijdrage over het gehele kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel44
  - number: '45.1'
    text: De inkomensafhankelijke bijdrage bedraagt een percentage van het bijdrage-inkomen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel45
  - number: '45.2'
    text: |-
      Het in het eerste lid bedoelde bijdragepercentage wordt bij regeling van Onze Minister, in overeenstemming met Onze
      Minister van Sociale Zaken en Werkgelegenheid en Onze Minister van Financiën, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel45
  - number: '45.3'
    text: |-
      Voor daarbij aan te geven bestanddelen van het bijdrage-inkomen kan een afwijkend bijdragepercentage worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel45
  - number: '45.4'
    text: |-
      De bijdragepercentages worden zodanig vastgesteld, dat de som van de inkomensafhankelijke bijdragen gelijk is
      aan 50% van de som van bij ministeriële regeling te bepalen, ten gunste van het Zorgverzekeringsfonds of van de
      zorgverzekeraars komende inkomsten.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel45
  - number: '45.5'
    text: |-
      Na afloop van het kalenderjaar vastgestelde verschillen tussen de bedragen van de inkomsten die in de ministeriële
      regeling, bedoeld in het vierde lid, in aanmerking waren genomen en de werkelijke bedragen van die inkomsten,
      worden verrekend bij de vaststelling van het bijdragepercentage in een volgend jaar.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel45
  - number: '45.6'
    text: |-
      Indien een wijziging van het bijdragepercentage ingaat op een ander tijdstip dan 1 januari, vindt de vaststelling
      plaats in overeenstemming met Onze Minister van Financiën en kunnen daarbij regels worden gesteld omtrent de wijze
      van berekening van de bijdrage over het gehele kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel45
  - number: '46.1'
    text: |-
      Een verzekeringsplichtige die bij regeling van Onze Minister aan te wijzen loon overeenkomstig de wettelijke
      bepalingen van de loonbelasting geniet, heeft recht op een volledige vergoeding door de inhoudingsplichtige van de
      inkomensafhankelijke bijdrage over dit deel van het bijdrage-inkomen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel46
  - number: '46.2'
    text: |-
      Voor de toepassing van het eerste lid is [artikel 43, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '47'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën en Onze Minister van Sociale
      Zaken en Werkgelegenheid, kunnen nadere regels worden gesteld met betrekking tot deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel47
  - number: '48'
    text: De rijksbelastingdienst heft de inkomensafhankelijke bijdrage.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel48
  - number: '49.1'
    text: |-
      Voor zover het bijdrage-inkomen bestaat uit loon als bedoeld in [artikel 43, eerste lid, onderdeel a][ref1], dat
      van een inhoudingsplichtige wordt genoten, wordt de inkomensafhankelijke bijdrage bij wijze van inhouding geheven
      met overeenkomstige toepassing van de voor de heffing van de loonbelasting geldende regels.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '49.2'
    text: |-
      Voor zover het bijdrage-inkomen bestaat uit andere dan de in het eerste lid bedoelde bestanddelen,
      wordt de inkomensafhankelijke bijdrage bij wege van aanslag geheven met overeenkomstige
      toepassing van de voor de heffing van de inkomstenbelasting geldende regels, met uitzondering van
      [artikel 3.154 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '49.3'
    text: |-
      Bij de vaststelling van de ingevolge het tweede lid op te leggen aanslag over een jaar wordt als bijdrage-
      inkomen ten hoogste in aanmerking genomen een bedrag gelijk aan het bijdrage-inkomen dat op grond van
      [artikel 43, tweede lid][ref1], ten hoogste in aanmerking wordt genomen, verminderd met het bijdrage-inkomen dat
      ingevolge het eerste lid ten aanzien van de verzekeringsplichtige over het jaar reeds in aanmerking is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '50.1'
    text: |-
      Indien over het bijdrage-inkomen inkomensafhankelijke bijdrage is ingehouden over een hoger bijdrage-
      inkomen dan het bedrag, bedoeld in [artikel 43, tweede lid][ref1], stelt de inspecteur, bedoeld in de
      [Wet financiering sociale verzekeringen][ref2], bij voor bezwaar vatbare beschikking het bedrag van de teveel
      betaalde bijdrage vast.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0017745
  - number: '50.2'
    text: |-
      Indien het bijdrage-inkomen waarover inkomensafhankelijke bijdrage is ingehouden van verschillende
      inhoudingsplichtigen is ontvangen, wordt het bedrag van de teveel ingehouden bijdrage als bedoeld in het eerste lid
      naar evenredigheid toegerekend aan de door deze inhoudingsplichtigen ingehouden bijdrage.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel50
  - number: '50.3'
    text: |-
      In afwijking in zoverre van de vorige leden wordt het bedrag van teveel ingehouden bijdrage voor zover mogelijk
      toegerekend aan de inkomensafhankelijke bijdrage over het bijdrage-inkomen waarop [artikel 46, eerste lid][ref1],
      niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '50.4'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën, kunnen nadere en zo nodig
      afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel50
  - number: '50.5'
    text: |-
      In afwijking van de [artikelen 25b][ref1], [27f][ref2], [27j, derde lid][ref3], en
      [29i van de Algemene wet inzake rijksbelastingen][ref4] verleent de inspecteur een teruggave van een ingehouden
      bedrag aan inkomensafhankelijke bijdrage over loon als bedoeld in [artikel 46, eerste lid][ref5], aan de
      inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel25b
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel27f
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel27j
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel29i
      [ref5]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 25b
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 27f
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 27j
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 29i
      - id: ref5
        bwb_id: BWBR0018450
        artikel: '46'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '51.1'
    text: De rijksbelastingdienst vordert de inkomensafhankelijke bijdrage in.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel51
  - number: '51.2'
    text: |-
      Bij de invordering van de bijdrage zijn, naar gelang [artikel 49, eerste lid][ref1], dan wel tweede lid
      van toepassing is, de regels geldende voor de invordering van de loonbelasting, met uitzondering van
      [artikel 38, eerste lid, onderdeel a, van de Invorderingswet 1990][ref2], onderscheidenlijk de inkomstenbelasting
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel38
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '38'
  - number: '52'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Financiën worden regels gesteld met betrekking tot de afdracht
      van de inkomensafhankelijke bijdragen alsmede van de daarmee verband houdende bestuurlijke boeten en renten door de
      rijksbelastingdienst aan het Zorgverzekeringsfonds.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel52
  - number: '53'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën en Onze Minister van Sociale
      Zaken en Werkgelegenheid, kunnen nadere regels worden gesteld met betrekking tot deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel53
  - number: '54.1'
    text: |-
      Onze Minister verleent jaarlijks aan het Zorgverzekeringsfonds een bijdrage in de financiering van de
      zorgverzekering voor verzekerden jonger dan achttien jaar.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel54
  - number: '54.2'
    text: |-
      De bijdrage is gelijk aan het bedrag dat daarvoor in de wet tot vaststelling van de begroting van zijn ministerie
      voor dat jaar is toegestaan.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel54
  - number: '54.3'
    text: De bijdrage wordt betaald in gelijke maandelijkse delen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel54
  - number: '55.1'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Financiën, een bijdrage aan het Zorgverzekeringsfonds
      verlenen ter gehele of gedeeltelijke betaling van zorg of overige diensten als bedoeld in [artikel 10][ref1], in
      geval de behoefte aan die zorg of diensten is veroorzaakt door of ontstaan uit gewapend conflict, burgeroorlog,
      opstand, binnenlandse onlusten, oproer, muiterij of terrorisme.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel10
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '55.2'
    text: 'Bij ministeriële regeling wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel55
  - number: 55.2.a
    text: welke vormen van zorg of overige diensten voor welk gedeelte met de bijdrage worden betaald;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel55
  - number: 55.2.b
    text: ten behoeve van welke personen de bijdrage wordt betaald;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel55
  - number: 55.2.c
    text: |-
      onder welke voorwaarden en op welke wijze deze zorg of overige diensten door het College zorgverzekeringen worden
      betaald.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel55
  - number: '55.3'
    text: |-
      In een regeling als bedoeld in het tweede lid kan worden bepaald dat zorgverzekeraars het College zorgverzekeringen
      bijstand verlenen bij het uitvoeren van de ministeriële regeling, bedoeld in het tweede lid, en welke vergoeding
      daar voor de zorgverzekeraars tegenover staat.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel55
  - number: '56'
    text: |-
      Indien de situatie, bedoeld in [artikel 31, eerste lid][ref1], zich heeft voorgedaan, verstrekt Onze Minister
      een bijdrage aan het Zorgverzekeringsfonds ter hoogte van het verschil tussen het bedrag aan voldane vorderingen,
      als bedoeld in [artikel 31, eerste lid][ref2], en het bedrag dat het College zorgverzekeringen ter zake van de
      vorderingen, bedoeld in [artikel 31, tweede lid][ref3], heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel31
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '57.1'
    text: |-
      Van de persoon die op grond van [artikel 2, tweede lid, onderdeel b][ref1], niet verzekeringsplichtig is,
      wordt met overeenkomstige toepassing van [hoofdstuk 5 van de Wet financiering sociale verzekeringen][ref2] en
      [artikel 58 van die wet][ref3] belasting geheven, tot het bedrag van de inkomensafhankelijke bijdrage, bedoeld in
      [artikel 43, tweede lid][ref4], dat de persoon verschuldigd zou zijn als ware hij verzekeringsplichtig.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0017745
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '58'
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '57.2'
    text: |-
      Indien de in het eerste lid bedoelde belasting wordt geheven over op grond van [artikel 46, eerste lid][ref1],
      aangewezen loon, is [artikel 46][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '57.3'
    text: |-
      De rijksbelastingdienst stort de belasting, bedoeld in het eerste lid, op de rekening, bedoeld in
      [artikel 70, eerste dan wel tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel70
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '70'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '58.1'
    text: Er is een College voor zorgverzekeringen, dat rechtspersoonlijkheid bezit.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel58
  - number: '58.2'
    text: Het College zorgverzekeringen is gevestigd in een door Onze Minister te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel58
  - number: '58.3'
    text: |-
      Het College zorgverzekeringen is belast met de taken die hem bij of krachtens wet of internationale overeenkomst
      zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel58
  - number: '58.4'
    text: Het College zorgverzekeringen wordt in en buiten rechte vertegenwoordigd door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel58
  - number: '59.1'
    text: Het College zorgverzekeringen bestaat uit ten hoogste drie leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel59
  - number: '59.2'
    text: Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel59
  - number: '59.3'
    text: |-
      Benoeming vindt plaats op grond van de deskundigheid die nodig is voor de uitoefening van de taken van het College
      zorgverzekeringen alsmede op grond van maatschappelijke kennis en ervaring.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel59
  - number: '59.4'
    text: |-
      De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier
      jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel59
  - number: '59.5'
    text: |-
      Het lidmaatschap van het College zorgverzekeringen is onverenigbaar met het lidmaatschap van de zorgautoriteit of
      van het bestuur van De Nederlandsche Bank N.V.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel59
  - number: '59.6'
    text: |-
      Bij ministeriële regeling kunnen andere functies of werkzaamheden dan die, genoemd in het vijfde lid, worden
      aangewezen, die niet verenigbaar zijn met het lidmaatschap van het College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel59
  - number: '59.7'
    text: |-
      Het lidmaatschap eindigt tussentijds door overlijden, ontslag op eigen verzoek of ontslag om zwaarwichtige redenen
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel59
  - number: '59.8'
    text: Van een besluit tot benoeming, schorsing of ontslag wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel59
  - number: '59.9'
    text: |-
      Onze Minister stelt de bezoldiging en de regels ten aanzien van de rechtspositie van de leden van het College
      zorgverzekeringen vast.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel59
  - number: 59a.1
    text: |-
      Het College zorgverzekeringen heeft een commissie die rapporten of signalen als bedoeld in [artikel 66][ref1]
      voorbereidt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel66
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '66'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 59a.2
    text: |-
      De commissie bestaat uit een oneven aantal van ten hoogste negen leden, waaronder de leden van het College
      zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel59a
  - number: 59a.3
    text: |-
      [Artikel 59, tweede, derde, vierde, zevende en achtste lid][ref1], zijn op de leden van de commissie die niet
      tevens leden van het College zorgverzekeringen zijn, van overeenkomstige toepassing, met dien verstande dat hun
      benoeming plaatsvindt op grond van de deskundigheid die nodig is voor de uitoefening van de taken van de commissie
      en op grond van maatschappelijke kennis en ervaring.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel59
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '59'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 59a.4
    text: |-
      Bij ministeriële regeling worden de vergoeding van reis- en verblijfkosten en verdere vergoedingen aan de leden van
      de commissie die niet tevens leden van het College zorgverzekeringen zijn, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel59a
  - number: '60.1'
    text: Het College zorgverzekeringen stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel60
  - number: '60.2'
    text: |-
      Vergaderingen van het College zorgverzekeringen zijn niet openbaar, behoudens voor zover in het bestuursreglement
      anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel60
  - number: '60.3'
    text: |-
      In het bestuursreglement legt het College zorgverzekeringen in ieder geval vast hoe hij voldoet aan de verplichting
      ingevolge [artikel 3:2 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '60.4'
    text: Het bestuursreglement behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel60
  - number: '61.1'
    text: |-
      Op de rechtspositie van het personeel van het College zorgverzekeringen zijn de regels die gelden voor ambtenaren
      die zijn aangesteld bij ministeries van toepassing, met dien verstande dat waar in deze regels een bevoegdheid is
      toegekend aan een andere minister dan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, deze bevoegdheid
      wordt uitgeoefend door het College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel61
  - number: '61.2'
    text: Bij algemene maatregel van bestuur kan worden afgeweken van de in het eerste lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel61
  - number: '62'
    text: |-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de werkwijze en de uitoefening van de taken van het
      College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel62
  - number: '63.1'
    text: Een besluit van het College zorgverzekeringen kan bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel63
  - number: '63.2'
    text: Van een besluit tot vernietiging wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel63
  - number: '64.1'
    text: |-
      Het College zorgverzekeringen bevordert de eenduidige uitleg van de aard, inhoud en omvang van de prestaties,
      bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '64.2'
    text: Het College zorgverzekeringen kan de zorgverzekeraars met het oog hierop richtlijnen geven.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel64
  - number: '65'
    text: |-
      Het College zorgverzekeringen geeft aan zorgverzekeraars, aan zorgaanbieders en aan burgers voorlichting over de
      aard, inhoud en omvang van de prestaties, bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '66.1'
    text: |-
      Het College zorgverzekeringen rapporteert Onze Minister desgevraagd over voorgenomen beleid inzake aard, inhoud en
      omvang van de prestaties, bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '66.2'
    text: |-
      Het College zorgverzekeringen signaleert gevraagd en ongevraagd aan Onze Minister feitelijke ontwikkelingen
      die aanleiding kunnen geven tot wijzigingen van de aard, inhoud en omvang van de prestaties, bedoeld in
      [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '67'
    text: 'Het College zorgverzekeringen bevordert de afstemming van de uitvoering:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel67
  - number: 67.a
    text: van en tussen de zorgverzekering en de algemene verzekering bijzondere ziektekosten, en
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel67
  - number: 67.b
    text: |-
      van deze verzekeringen met de uitvoering van het beleid op andere terreinen van de volksgezondheid en op andere
      terreinen van sociale zekerheid.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel67
  - number: '68.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het College zorgverzekeringen overeenkomstig in die regeling
      gestelde regels tijdelijk subsidies verstrekt voor zorg of andere diensten, ten aanzien waarvan het voornemen
      bestaat deze te doen opnemen in de te verzekeren prestaties.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel68
  - number: '68.2'
    text: |-
      In een regeling als bedoeld in het eerste lid kan worden bepaald dat zorgverzekeraars het College zorgverzekeringen
      bijstand verlenen bij de verstrekking van subsidies behorende tot een in die regeling genoemde categorie, en welke
      vergoeding zij daarvoor ontvangen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel68
  - number: '68.3'
    text: Onze Minister kan jaarlijks voor een categorie van subsidies het subsidieplafond voor het komende jaar bekendmaken.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel68
  - number: '68.4'
    text: |-
      In een regeling als bedoeld in het eerste lid kan aan het College zorgverzekeringen worden opgedragen nadere regels
      te stellen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel68
  - number: '68.5'
    text: Nadere regels als bedoeld in het vierde lid behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel68
  - number: '68.6'
    text: Goedkeuring kan slechts worden onthouden wegens strijd met het recht of het belang van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel68
  - number: '69.1'
    text: |-
      In het buitenland wonende personen die met toepassing van een Verordening van de Raad van de Europese
      Gemeenschappen dan wel toepassing van zodanige verordening krachtens de overeenkomst betreffende de Europese
      Economische Ruimte of een verdrag inzake sociale zekerheid in geval van behoefte aan zorg recht hebben op zorg of
      vergoeding van de kosten daarvan, zoals voorzien in de wetgeving over de verzekering voor zorg van hun woonland,
      melden zich, tenzij zij op grond van deze wet verzekeringsplichtig zijn, bij het College zorgverzekeringen aan.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel69
  - number: '69.2'
    text: |-
      De in het eerste lid bedoelde personen zijn een bij ministeriële regeling te bepalen bijdrage verschuldigd, die
      voor een bij die regeling te bepalen gedeelte, voor de toepassing van de [Wet op de zorgtoeslag][ref1] als premie
      voor een zorgverzekering wordt beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0018451
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0018451
  - number: '69.3'
    text: |-
      Indien de melding niet is geschied binnen vier maanden nadat het recht, bedoeld in het eerste lid, is ontstaan,
      legt het College zorgverzekeringen degene die de melding had moeten doen een bestuurlijke boete op, die gelijk is
      aan 130% van een bij ministeriële regeling te bepalen gedeelte van de bijdrage, bedoeld in het tweede lid, over
      een periode gelijk aan de periode gelegen tussen de dag waarop het recht ontstond en de dag waarop de melding is
      geschied, maar met een maximum van vijf jaren.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel69
  - number: '69.4'
    text: |-
      Het College zorgverzekeringen is belast met de administratie, voortvloeiend uit het eerste lid en de daar genoemde
      internationale regels, alsmede met het nemen van beschikkingen over de heffing en de inning van de bijdrage,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel69
  - number: '69.5'
    text: |-
      Indien tegen een door het College zorgverzekeringen op grond van dit artikel genomen beschikking bezwaar wordt
      gemaakt:
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel69
  - number: 69.5.a
    text: |-
      kan dat college, in afwijking van [artikel 7:3 van de Algemene wet bestuursrecht][ref1], van het horen van een
      belanghebbende afzien, tenzij deze binnen een door het college gestelde, redelijke termijn verklaart dat hij
      gebruik wil maken van het recht te worden gehoord;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 69.5.b
    text: |-
      beslist dat college, in afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1],
      binnen dertien weken gerekend vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is
      verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '69.6'
    text: |-
      Het College zorgverzekeringen gebruikt voor de uitvoering van dit artikel het burgerservicenummer of, bij ontbreken
      daarvan, het sociaal-fiscaalnummer van de in het eerste lid bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel69
  - number: '69.7'
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel69
  - number: 69.7.a
    text: |-
      kan worden bepaald dat organen die pensioen of rente verschuldigd zijn in opdracht van het College
      zorgverzekeringen werkzaamheden verrichten ter voorbereiding of uitvoering van beschikkingen als bedoeld in het
      vierde lid, waarbij kan worden bepaald dat die organen de bijdragen, bedoeld in het tweede lid, op het pensioen of
      de rente inhouden en aan het Zorgverzekeringsfonds afdragen;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel69
  - number: 69.7.b
    text: |-
      kunnen regels worden gesteld over de wijze waarop het College zorgverzekeringen zijn taak, bedoeld in het vierde
      lid, uitoefent of de organen, bedoeld in onderdeel a, de in dat onderdeel bedoelde werkzaamheden uitvoeren.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel69
  - number: '70.1'
    text: |-
      Het College zorgverzekeringen opent voor iedere gemoedsbezwaarde, bedoeld in
      [artikel 2, tweede lid, onderdeel b][ref1], een rekening, waarop de geheven bijdragevervangende belasting, bedoeld
      in [artikel 57, eerste lid][ref2], wordt gestort.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel57
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '57'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: '70.2'
    text: |-
      In afwijking van het eerste lid opent of houdt het College zorgverzekeringen één rekening in stand indien twee
      of meer gemoedsbezwaarden als bedoeld in [artikel 2, tweede lid, onderdeel b][ref1], een gezamenlijke huishouding
      voeren, en worden op die rekening de belastingen van ieder van deze gemoedsbezwaarden gestort.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel2
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '70.3'
    text: Tot de rekening is geen ander begunstigd dan het College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel70
  - number: '70.4'
    text: 'Het saldo wordt door het College zorgverzekeringen gebruikt voor het doen van:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel70
  - number: 70.4.a
    text: |-
      uitkeringen ter vergoeding van kosten van zorg of overige diensten als bedoeld in [artikel 11][ref1], voor zover
      deze zijn verleend aan een gemoedsbezwaarde voor wie de rekening in stand wordt gehouden, of aan een tot zijn
      huishouding behorend kind, jonger dan achttien jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 70.4.b
    text: |-
      uitkeringen als bedoeld in [artikel 39, tweede lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel39
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '39'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '70.5'
    text: |-
      Uitkeringen als bedoeld in het vierde lid, onderdeel a, worden slechts op verzoek van een gemoedsbezwaarde voor wie
      de rekening in stand wordt gehouden, gedaan.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel70
  - number: '70.6'
    text: |-
      De kosten van zorg of overige diensten worden niet vergoed voor zover deze voor een verzekerde
      op grond van de regels, gesteld bij of krachtens de algemene maatregel van bestuur, bedoeld in
      [artikel 11, derde of vierde lid][ref1], voor eigen rekening blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '70.7'
    text: |-
      Het College zorgverzekeringen heft een rekening op indien alle gemoedsbezwaarden voor wie de rekening in stand werd
      gehouden, verzekeringsplichtig zijn geworden dan wel zijn overleden.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel70
  - number: '70.8'
    text: |-
      Indien een gemoedsbezwaarde een gezamenlijke huishouding is gaan vormen met een andere gemoedsbezwaarde, heft
      het College zorgverzekeringen een van de twee rekeningen op, onder overmaking van het saldo naar de overblijvende
      rekening.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel70
  - number: '70.9'
    text: |-
      Het College zorgverzekeringen zorgt per gemoedsbezwaarde of huishouding, bedoeld in het tweede lid, voor een
      ordentelijke administratie van de stortingen op en de uitkeringen ten laste van de rekening.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel70
  - number: '70.10'
    text: |-
      Bij ministeriële regeling kunnen ter zake van het bepaalde in het eerste tot en met negende lid nadere regels en
      uitvoeringsregels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel70
  - number: '70.11'
    text: |-
      Het College zorgverzekeringen is bevoegd de werkzaamheden, bedoeld bij of krachtens het eerste tot en met tiende
      lid, onder vergoeding van de daarmee gepaard gaande kosten, uit te besteden aan een of meer zorgverzekeraars.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel70
  - number: '70.13'
    text: |-
      Het College zorgverzekeringen gebruikt voor de uitvoering van dit artikel het burgerservicenummer of, bij ontbreken
      daarvan, het sociaal-fiscaalnummer van de gemoedsbezwaarde.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel70
  - number: '71.1'
    text: |-
      Het College zorgverzekeringen zendt jaarlijks voor 1 oktober aan Onze Minister een jaarplan voor het volgende
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel71
  - number: '71.2'
    text: 'Het jaarplan omvat:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel71
  - number: 71.2.a
    text: |-
      een werkprogramma met een beschrijving van de activiteiten die het College zorgverzekeringen voornemens is ter
      uitvoering van zijn taken te verrichten,
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel71
  - number: 71.2.b
    text: een begroting van de beheerskosten voor de uitvoering van de voorgenomen activiteiten, en
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel71
  - number: 71.2.c
    text: een meerjarenraming voor de vier kalenderjaren volgend op het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel71
  - number: '72.1'
    text: |-
      Onze Minister stelt jaarlijks voor 1 december het budget voor de beheerskosten van het College zorgverzekeringen
      voor het volgende kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel72
  - number: '72.2'
    text: Onze Minister kan besluiten het budget voor de beheerskosten van het College zorgverzekeringen te wijzigen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel72
  - number: '72.3'
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en de
      begrote baten en lasten, doet het College zorgverzekeringen daarvan onverwijld mededeling aan Onze Minister, onder
      vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel72
  - number: '72.4'
    text: |-
      Het College zorgverzekeringen gaat met betrekking tot de beheerskosten geen verplichtingen aan en doet geen
      uitgaven die leiden tot overschrijding van het vastgestelde budget voor de beheerskosten.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel72
  - number: '72.5'
    text: |-
      Indien het budget voor de beheerskosten niet is vastgesteld voor 1 januari van het kalenderjaar waarop de begroting
      betrekking heeft, is het College zorgverzekeringen bevoegd, teneinde zijn activiteiten gaande te houden, te
      beschikken over ten hoogste een derde gedeelte van het budget dat laatstelijk voor hem voor een geheel jaar is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel72
  - number: '72.6'
    text: |-
      Onze Minister kan besluiten dat het College zorgverzekeringen in een geval als bedoeld in het vijfde lid, kan
      beschikken over meer dan een derde gedeelte van het budget dat laatstelijk voor hem voor een geheel jaar is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel72
  - number: '72.7'
    text: |-
      Het door Onze Minister vastgestelde budget voor de beheerskosten van het College zorgverzekeringen wordt gedekt uit
      ’s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel72
  - number: '73.1'
    text: |-
      Het College zorgverzekeringen zendt jaarlijks voor 15 maart aan Onze Minister een jaarverantwoording over het
      afgelopen kalenderjaar, alsmede het verslag van bevindingen, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel73
  - number: '73.2'
    text: 'De jaarverantwoording omvat:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel73
  - number: 73.2.a
    text: een jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel73
  - number: 73.2.b
    text: |-
      een jaarverslag omtrent het door het College zorgverzekeringen gevoerde beleid, de doeltreffendheid van dat beleid,
      de bedrijfsvoering en de uitvoering van het werkprogramma in het afgelopen kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel73
  - number: '73.3'
    text: |-
      Het College zorgverzekeringen legt in zijn jaarrekening, die zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] wordt ingericht, rekening en verantwoording af over zijn
      beheerskosten en over de rechtmatigheid en doelmatigheid van het beheer in het afgelopen kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '73.4'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een accountant als bedoeld
      in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], die bereid is Onze Minister desgevraagd inzicht te
      geven in zijn controlewerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '73.5'
    text: |-
      De verklaring heeft mede betrekking op de rechtmatige verkrijging en besteding van de middelen door het College
      zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel73
  - number: '73.6'
    text: |-
      De accountant voegt bij de verklaring een verslag van zijn bevindingen over de vraag of het beheer en de
      organisatie voldoen aan eisen van rechtmatigheid, ordelijkheid, controleerbaarheid en doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel73
  - number: '74.1'
    text: |-
      Het College zorgverzekeringen zendt jaarlijks voor 15 maart aan Onze Minister met betrekking tot het
      Zorgverzekeringsfonds een jaarrekening over het afgelopen kalenderjaar, alsmede het verslag van bevindingen,
      bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel74
  - number: '74.2'
    text: |-
      Het College zorgverzekeringen legt in de jaarrekening, die zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] wordt ingericht, rekening en verantwoording af over de
      baten en lasten van het Zorgverzekeringsfonds en de toestand van dat fonds per 31 december, alsmede over de
      rechtmatigheid en doelmatigheid van het beheer van dat fonds in het afgelopen kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '74.3'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een accountant als bedoeld
      in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], die bereid is Onze Minister desgevraagd inzicht te
      geven in zijn controlewerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '74.4'
    text: |-
      De verklaring heeft mede betrekking op de rechtmatige verkrijging en besteding van de middelen van het
      Zorgverzekeringsfonds.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel74
  - number: '74.5'
    text: |-
      De accountant voegt bij de verklaring een verslag van zijn bevindingen over de vraag of het beheer en de
      organisatie voldoen aan eisen van rechtmatigheid, ordelijkheid, controleerbaarheid en doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel74
  - number: '75.1'
    text: |-
      De onderdelen «werkprogramma» en «begroting» van het jaarplan, bedoeld in [artikel 71][ref1], het onderdeel
      «jaarrekening» van de jaarverantwoording, bedoeld in [artikel 73][ref2], en de jaarrekening, bedoeld in
      [artikel 74][ref3], behoeven de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel74
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '71'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '73'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '74'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '75.2'
    text: 'Het eerste lid geldt niet voor wijzigingen in een goedgekeurde begroting, mits:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel75
  - number: 75.2.a
    text: de totale omvang van de begroting geen wijziging ondergaat, en
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel75
  - number: 75.2.b
    text: |-
      de wijziging per groep van kostensoorten en baten, gerekend over het desbetreffende begrotingsjaar, een bedrag van
      5 procent van het in [artikel 72][ref1] bedoelde budget niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel72
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '72'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '75.3'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en de inrichting van:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel75
  - number: 75.3.a
    text: |-
      het jaarplan, bedoeld in [artikel 71][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel71
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '71'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 75.3.b
    text: |-
      de jaarverantwoording, bedoeld in [artikel 73][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel73
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '73'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 75.3.c
    text: |-
      de jaarrekening, bedoeld in [artikel 74][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel74
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '74'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 75.3.d
    text: |-
      de verklaringen, bedoeld in de [artikelen 73, vierde lid][ref1], en [74, derde lid][ref2], de verslagen van
      bevindingen, bedoeld in [artikel 73, zesde lid][ref3], en [74, vijfde lid][ref4], alsmede het aan die verklaringen
      en verslagen ten grondslag liggende onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel73
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel74
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '73'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '74'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '73'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '74'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '75.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de wijze waarop en de voorwaarden waaronder het budget,
      bedoeld in [artikel 72][ref1], wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel72
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '72'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '76.1'
    text: |-
      Na de goedkeuring, bedoeld in [artikel 75, eerste lid][ref1], stelt het College zorgverzekeringen het jaarplan, de
      jaarverantwoording en de jaarrekening van het Zorgverzekeringsfonds algemeen verkrijgbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel75
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '75'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '76.2'
    text: |-
      Onze Minister brengt zijn oordeel over het functioneren van het College zorgverzekeringen ter kennis van beide
      Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel76
  - number: '86.1'
    text: |-
      De zorgverzekeraar neemt het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer van zijn
      verzekerden en, gedurende zeven jaren na het einde van de verzekering, van zijn gewezen verzekerden met het oog op
      de uitvoering van de zorgverzekering en van deze wet in zijn administratie op.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel86
  - number: '86.2'
    text: |-
      De zorgverzekeraar stelt bij de eerste opname in zijn administratie en vervolgens indien daartoe
      aanleiding is het burgerservicenummer van de verzekerde vast met overeenkomstige toepassing van
      [artikel 7 van de Wet gebruik burgerservicenummer in de zorg][ref1]. Bij het ontbreken van het burgerservicenummer
      verifieert de zorgverzekeraar het sociaal-fiscaalnummer van de verzekerde indien daartoe aanleiding is.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel7
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '7'
  - number: '86.3'
    text: |-
      De zorgverzekeraar gebruikt het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer van de
      verzekerde met het doel te waarborgen dat de in het kader van de verzekering van zorg te verwerken persoonsgegevens
      op die verzekerde betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel86
  - number: '86.4'
    text: |-
      Bij gegevensuitwisseling tussen de zorgverzekeraars en de stichtingen, bedoeld in [artikel 14, derde lid][ref1],
      alsmede tussen de zorgverzekeraars en de in de [artikelen 88][ref2] en [89][ref3] genoemde personen en
      instanties wordt, voor zover die stichtingen, personen en instanties tot gebruik van dat nummer bevoegd zijn, het
      burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel89
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '88'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '89'
        hoofdstuk: '8'
  - number: '86.5'
    text: |-
      Het vierde lid is van overeenkomstige toepassing op de gegevensuitwisseling tussen de
      zorgverzekeraars en de zorgaanbieders, indicatieorganen en zorgverzekeraars in de zin van de
      [Wet gebruik burgerservicenummer in de zorg][ref1] die niet in de [artikelen 88][ref2] en [89][ref3] zijn genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0023864
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel89
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0023864
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '88'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '89'
        hoofdstuk: '8'
  - number: '86.6'
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel86
  - number: '86.7'
    text: |-
      Bij ministeriële regeling kan worden bepaald aan welke beveiligingseisen de gegevensverwerking, bedoeld in het
      eerste, vierde en vijfde lid, voldoet.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel86
  - number: '86.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden over de bij de gegevensuitwisseling,
      bedoeld in het vierde en vijfde lid, te verwerken feiten of gegevens met betrekking tot verzekerden van wie
      het vaststellen van het burgerservicenummer of het sociaal-fiscaalnummer onmogelijk blijkt of een onevenredige
      inspanning kost. Bij of krachtens die maatregel kan worden bepaald aan welke beveiligingseisen de verwerking van
      die feiten of gegevens voldoet.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel86
  - number: '86.9'
    text: |-
      Bij algemene maatregel van bestuur kunnen vormen van zorg of andere diensten als bedoeld in [artikel 11][ref1],
      alsmede categorieën van zorgverzekeraars, van stichtingen als bedoeld in [artikel 14, derde lid][ref2], en van in
      de [artikelen 88][ref3] en [89][ref4] genoemde personen en instanties worden uitgezonderd van de toepassing van het
      bepaalde bij of krachtens het eerste tot en met het achtste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel88
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel89
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '88'
        hoofdstuk: '8'
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '89'
        hoofdstuk: '8'
  - number: '87.1'
    text: |-
      Een zorgaanbieder die aan een verzekerde zorg of andere diensten, bedoeld in [artikel 11][ref1], heeft verleend,
      en die de kosten daarvan krachtens een door hem met de zorgverzekeraar gesloten overeenkomst rechtstreeks bij
      die zorgverzekeraar in rekening brengt, verstrekt die zorgverzekeraar of een door die zorgverzekeraar aangewezen
      persoon de persoonsgegevens van de verzekerde, waaronder persoonsgegevens betreffende de gezondheid als bedoeld in
      de [Wet bescherming persoonsgegevens][ref2], die noodzakelijk zijn voor de uitvoering van de zorgverzekering of van
      deze wet, dan wel stelt hem deze gegevens voor dit doel voor inzage of het nemen van afschrift ter beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0011468
  - number: '87.2'
    text: |-
      Een zorgaanbieder die aan een verzekerde zorg of andere diensten, bedoeld in [artikel 11][ref1], heeft verleend
      en die de kosten daarvan bij de verzekerde in rekening brengt, verstrekt hem de persoonsgegevens, waaronder
      persoonsgegevens betreffende zijn gezondheid als bedoeld in de [Wet bescherming persoonsgegevens][ref2], die voor
      zijn zorgverzekeraar noodzakelijk zijn voor de uitvoering van de zorgverzekering of van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0011468
  - number: '87.3'
    text: |-
      De zorgaanbieder, bedoeld in het eerste of tweede lid, verstrekt een door Onze Minister aangewezen persoon
      kosteloos bij ministeriële regeling omschreven, voor de uitvoering van deze wet noodzakelijke persoonsgegevens,
      waaronder persoonsgegevens betreffende de gezondheid als bedoeld in de [Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '87.4'
    text: |-
      Personen werkzaam ten behoeve van een zorgaanbieder als bedoeld in het eerste of tweede lid, verstrekken die
      zorgaanbieder de persoonsgegevens die hij nodig heeft om te kunnen voldoen aan zijn verplichtingen bedoeld in het
      eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel87
  - number: '87.5'
    text: |-
      Personen werkzaam bij de zorgverzekeraar, bij een door de zorgverzekeraar aangewezen persoon als bedoeld in het
      eerste lid, of bij de door Onze Minister aangewezen persoon als bedoeld in het derde lid, voor wie niet reeds
      uit hoofde van ambt of beroep een geheimhoudingplicht geldt, zijn verplicht tot geheimhouding van de gegevens
      als bedoeld in het eerste, tweede of derde lid, behoudens voor zover enig wettelijk voorschrift hen mededeling
      toestaat.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel87
  - number: '87.6'
    text: 'Bij ministeriële regeling kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel87
  - number: 87.6.a
    text: tot welke gegevens de verplichting, bedoeld in het eerste of tweede lid, zich in ieder geval uitstrekt;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel87
  - number: 87.6.b
    text: op welke wijze gegevens, bedoeld in het eerste of tweede lid, worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel87
  - number: 87.6.c
    text: volgens welke technische standaarden gegevensverwerking plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel87
  - number: 87.6.d
    text: aan welke beveiligingseisen gegevensverwerking voldoet;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel87
  - number: 87.6.e
    text: |-
      in welke gevallen gegevens, bedoeld in het eerste of tweede lid, verder worden verwerkt met het oog op de
      uitvoering van de zorgverzekering of een aanvullende ziektekostenverzekering, voor zover deze gegevens niet
      worden gebruikt voor het beoordelen en accepteren van een aspirant-verzekerde voor een aanvullende verzekering en
      bovendien noodzakelijk zijn voor:
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel87
  - number: 87.6.e.1°
    text: de betaling aan een zorgaanbieder of de vergoeding van zorgkosten aan een verzekerde;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel87
  - number: 87.6.e.2°
    text: de vaststelling van eigen bijdragen of nog openstaand verplicht of vrijwillig eigen risico;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel87
  - number: 87.6.e.3°
    text: het uitoefenen van het verhaalsrecht; of
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel87
  - number: 87.6.e.4°
    text: het verrichten van controle of fraudeonderzoek.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel87
  - number: '88.1'
    text: |-
      Een ieder verstrekt op verzoek aan de zorgverzekeraars, het College zorgverzekeringen, de zorgautoriteit, Onze
      Minister, de rijksbelastingdienst, het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank,
      het college van burgemeester en wethouders, of aan een daartoe door of vanwege een van deze zorgverzekeraars of
      instanties aangewezen persoon kosteloos alle inlichtingen en gegevens, waaronder persoonsgegevens als bedoeld in de
      [Wet bescherming persoonsgegevens][ref1], die noodzakelijk zijn voor de uitvoering van de zorgverzekeringen of van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '88.2'
    text: |-
      De in het eerste lid bedoelde gegevens en inlichtingen worden op verzoek verstrekt in schriftelijke vorm of in een
      andere vorm die redelijkerwijs kan worden verlangd, binnen een termijn die schriftelijk wordt gesteld bij het in
      het eerste lid bedoelde verzoek.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel88
  - number: '88.3'
    text: |-
      Een ieder geeft op verzoek van een rechtspersoon als bedoeld in het eerste lid, inzage in alle bescheiden en
      andere gegevensdragers, stelt deze op verzoek ter beschikking voor het nemen van afschrift en verleent de terzake
      verlangde medewerking, voor zover dit noodzakelijk is voor de uitvoering van deze wet door de desbetreffende
      zorgverzekeraars of instanties.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel88
  - number: '88.4'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste, tweede of derde lid.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel88
  - number: '89.1'
    text: |-
      De in [artikel 88, eerste lid][ref1], bedoelde zorgverzekeraars en instanties zijn bevoegd uit eigen beweging
      en verplicht op verzoek binnen een bij dat verzoek genoemde termijn, uit de onder hun verantwoordelijkheid
      gevoerde administratie, aan elkaar, aan een daartoe door of vanwege hen aangewezen persoon of aan een door
      Onze Minister aangewezen persoon, kosteloos, de gegevens, waaronder persoonsgegevens als bedoeld in de
      [Wet bescherming persoonsgegevens][ref2], te verstrekken die noodzakelijk zijn voor de uitvoering van de
      zorgverzekeringen of van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '88'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0011468
  - number: '89.2'
    text: |-
      Een zorgverzekeraar verleent op verzoek van het College zorgverzekeringen dan wel van de zorgautoriteit aan door
      het desbetreffende bestuursorgaan aangewezen personen inzage in alle bescheiden en andere gegevensdragers, stelt
      deze op verzoek ter beschikking voor het nemen van afschrift en verleent de terzake verlangde medewerking, voor
      zover het desbetreffende bestuursorgaan dit nodig acht voor de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel89
  - number: '89.3'
    text: |-
      Alle ambtenaren tot afgifte van uittreksels uit registers van burgerlijke stand bevoegd, zijn verplicht aan een
      in [artikel 88, eerste lid][ref1], bedoelde zorgverzekeraar of instantie de door deze gevraagde uittreksels uit de
      registers kosteloos toe te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel88
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '88'
        hoofdstuk: '8'
  - number: '89.4'
    text: |-
      Griffiers van colleges, geheel of ten dele met rechtspraak belast, verstrekken op verzoek, kosteloos, aan
      een zorgverzekeraar, aan het College zorgverzekeringen of aan de zorgautoriteit alle gegevens, inlichtingen
      en uittreksels uit of afschriften van uitspraken, registers en andere stukken, die noodzakelijk zijn voor de
      uitvoering van deze wet door de zorgverzekeraar of het desbetreffende bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel89
  - number: '89.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking van gegevens door de
      rijksbelastingdienst aan de zorgverzekeraars.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel89
  - number: '89.6'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel89
  - number: '90.1'
    text: |-
      De zorgautoriteit, onderscheidenlijk het College zorgverzekeringen kan na overleg met het College
      zorgverzekeringen, onderscheidenlijk de zorgautoriteit bij regeling bepalen welke gegevens en inlichtingen
      regelmatig door de zorgverzekeraars moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel90
  - number: '90.2'
    text: |-
      De regels kunnen mede omvatten het tijdstip en de wijze waarop de gegevens en inlichtingen moeten worden verstrekt,
      alsmede dat een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1] de juistheid
      van de verstrekte gegevens en inlichtingen bevestigt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '90.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald welke statistische gegevens de zorgverzekeraars verzamelen betreffende
      vormen van zorg en andere diensten.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel90
  - number: '91.1'
    text: |-
      Het College zorgverzekeringen en de zorgautoriteit verstrekken Onze Minister uit eigen beweging inlichtingen over
      ontwikkelingen die ertoe leiden of kunnen leiden dat ten behoeve van verzekerden niet vrij kan worden gekozen
      tussen zorgverzekeraars en de door hen aangeboden varianten van de zorgverzekering of die een rechtmatige en
      volledige uitvoering van zorgverzekeringen jegens de verzekeringnemers of verzekerden in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel91
  - number: '91.2'
    text: |-
      Het College zorgverzekeringen en de zorgautoriteit verstrekken desgevraagd aan Onze Minister, of aan het College
      bouw of het College sanering, bedoeld in de [Wet toelating zorginstellingen][ref1], de voor de uitoefening van hun
      taak benodigde inlichtingen en gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0018906
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0018906
  - number: '91.3'
    text: |-
      Het College zorgverzekeringen en de zorgautoriteit verlenen aan door Onze Minister of door een bestuursorgaan,
      bedoeld in het tweede lid, aangewezen personen toegang tot en inzage in zakelijke gegevens en bescheiden, voor
      zover dat voor de vervulling van hun taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel91
  - number: '92.1'
    text: |-
      Een zorgverzekeraar maakt voor de verstrekking of ontvangst van gegevens aan of van personen, aan te wijzen door
      het College zorgverzekeringen, gebruik van een elektronische infrastructuur.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel92
  - number: '92.2'
    text: 'Het College zorgverzekeringen kan met betrekking tot het eerste lid regels stellen over:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel92
  - number: 92.2.a
    text: de aard en omvang van de gegevens en de voorschriften waaraan de verstrekking of ontvangst ten minste moet voldoen;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel92
  - number: 92.2.b
    text: |-
      de wijze waarop de verstrekking of ontvangst van gegevens plaatsvindt, waaronder begrepen de aansluiting van
      zorgverzekeraars op de infrastructuur;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel92
  - number: 92.2.c
    text: |-
      de wijze waarop het gebruik van de infrastructuur wordt georganiseerd en beheerd, waaronder begrepen de inrichting
      en instandhouding van een gemeenschappelijke database;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel92
  - number: 92.2.d
    text: de financiering van het gebruik van de infrastructuur en de wijze waarop de kosten ervan worden verdeeld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel92
  - number: '93.1'
    text: |-
      Het is een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten enige
      taak vervult of heeft vervuld, verboden van vertrouwelijke gegevens of inlichtingen die ingevolge deze wet dan wel
      ingevolge [titel 5.2 van de Algemene wet bestuursrecht][ref1] zijn verstrekt of verkregen of van De Nederlandsche
      Bank N.V. of de Stichting Autoriteit Financiële Markten zijn ontvangen, verder of anders gebruik te maken of
      daaraan verder of anders bekendheid te geven dan voor de uitvoering van zijn taak of bij of krachtens deze wet
      wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '93.2'
    text: |-
      In afwijking van het eerste lid kunnen de zorgautoriteit en het College zorgverzekeringen met gebruikmaking
      van vertrouwelijke gegevens of inlichtingen verkregen bij de uitvoering van hun taken op grond van deze wet,
      mededelingen doen, indien deze niet kunnen worden herleid tot afzonderlijke personen of ondernemingen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel93
  - number: '93.3'
    text: |-
      In afwijking van het eerste lid en in overeenstemming met [artikel 1:89 van de Wet op het financieel toezicht][ref1]
      zijn de zorgautoriteit, het College zorgverzekeringen, De Nederlandsche Bank N.V. en de Stichting Autoriteit
      Financiële Markten, voor zover dat voor hun taakuitoefening noodzakelijk is, bevoegd aan elkaar en aan Onze
      Minister vertrouwelijke gegevens of inlichtingen omtrent afzonderlijke verzekeraars te verschaffen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '93.4'
    text: 'Het eerste lid laat, ten aanzien van degene op wie dat lid van toepassing is, onverlet:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel93
  - number: 93.4.a
    text: |-
      de toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref1] welke betrekking hebben op het als
      getuige of deskundige in strafzaken afleggen van een verklaring omtrent gegevens of inlichtingen verkregen bij de
      vervulling van de ingevolge deze wet opgedragen taak;


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: 93.4.b
    text: |-
      de toepasselijkheid van de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] en van
      [artikel 66 van de Faillissementswet][ref2] welke betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring omtrent gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak, voor zover het gaat om
      gegevens of inlichtingen omtrent een verzekeraar die in staat van faillissement is verklaard of op grond van een
      rechterlijke uitspraak is ontbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel66
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '66'
  - number: 93.4.c
    text: |-
      de bevoegdheden van de Algemene Rekenkamer ingevolge [artikel 91 van de Comptabiliteitswet 2001][ref1], voor zover
      deze niet bij [artikel 121][ref2] zijn beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel121
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '91'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '121'
        hoofdstuk: '11'
  - number: '93.5'
    text: |-
      Het vierde lid, onderdeel b, geldt niet voor gegevens of inlichtingen die betrekking hebben op verzekeraars die
      betrokken zijn of zijn geweest bij een poging de desbetreffende verzekeraar in staat te stellen zijn bedrijf voort
      te zetten.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel93
  - number: '93.6'
    text: |-
      De Algemene Rekenkamer is bij het doen van mededelingen als bedoeld in
      [artikel 91, elfde tot en met veertiende lid, van de Comptabiliteitswet 2001][ref1], verplicht tot geheimhouding,
      voor zover het betreft gegevens en inlichtingen die haar ingevolge het vierde lid, onderdeel c, bekend zijn
      geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel91
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '91'
  - number: '96.1'
    text: 'Het College zorgverzekeringen legt de verzekerde een bestuurlijke boete op indien:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel96
  - number: 96.1.a
    text: de zorgverzekering niet binnen vier maanden na het ontstaan van de verzekeringsplicht is ingegaan of
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel96
  - number: 96.1.b
    text: |-
      een verzekeringsplichtige niet met ingang van de dag volgende op de dag waarop een zorgverzekering is geëindigd op
      grond van een andere zorgverzekering verzekerd is.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel96
  - number: '96.2'
    text: 'In afwijking van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel96
  - number: 96.2.a
    text: |-
      wordt geen bestuurlijke boete opgelegd indien de verzekerde op de eerste dag van de kalendermaand, volgende op de
      maand waarop de zorgverzekering ingaat, jonger dan achttien jaar was;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel96
  - number: 96.2.b
    text: |-
      wordt de bestuurlijke boete indien [artikel 2, derde lid][ref1], van toepassing is, opgelegd aan de curator, de
      bewindvoerder of de mentor.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel2
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '96.3'
    text: |-
      De hoogte van de bestuurlijke boete is gelijk aan 130% van de premie, bedoeld in [artikel 17, vijfde lid][ref1],
      over een periode gelijk aan de periode gelegen tussen de dag waarop de verzekeringsplicht ontstond en de dag waarop
      de zorgverzekering inging, dan wel gelegen tussen de dag waarop de zorgverzekering eindigde en de dag waarop een
      nieuwe zorgverzekering inging.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel17
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.1
  - number: '96.4'
    text: Indien de periode, bedoeld in het derde lid, langer is dan vijf jaren, wordt zij op vijf jaren gesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel96
  - number: '96.5'
    text: |-
      De voorbereiding en de uitvoering van boetebeschikkingen wordt namens het College zorgverzekeringen door de
      zorgverzekeraars verricht.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel96
  - number: '96.6'
    text: |-
      De zorgverzekeraars hebben als vergoeding voor hun werkzaamheden, bedoeld in het vijfde lid, recht op een door het
      College zorgverzekeringen te bepalen percentage van de door hen ingevorderde bestuurlijke boeten.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel96
  - number: '96.7'
    text: |-
      De te betalen geldsom van de opgelegde bestuurlijke boeten komt onder aftrek van de vergoeding, bedoeld in het
      vijfde lid, toe aan het Zorgverzekeringsfonds.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel96
  - number: '114.1'
    text: |-
      De zorgverzekeraar zorgt ervoor dat zijn verzekeringnemers en verzekerden geschillen over de uitvoering van de
      zorgverzekering kunnen voorleggen aan een onafhankelijke instantie.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel114
  - number: '114.2'
    text: |-
      De onafhankelijke instantie neemt een geschil slechts in behandeling nadat de verzekeringnemer of de verzekerde de
      zorgverzekeraar heeft verzocht zijn beslissing te heroverwegen, en deze niet binnen redelijke termijn of niet naar
      tevredenheid van de verzekeringnemer of verzekerde heeft gereageerd.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel114
  - number: '114.3'
    text: |-
      De onafhankelijke instantie vraagt advies aan het College zorgverzekeringen indien het geschil betrekking heeft op
      de zorg of de overige diensten, bedoeld in [artikel 11][ref1], dan wel de vergoeding van die zorg of diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '114.4'
    text: |-
      Het College zorgverzekeringen zendt zijn advies binnen vier weken na ontvangst van de adviesaanvraag aan de
      onafhankelijke instantie.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel114
  - number: '116.1'
    text: |-
      Tegen een op grond van deze wet genomen besluit van Onze Minister of van het College zorgverzekeringen kan een
      belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel116
  - number: '116.2'
    text: 'Het eerste lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel116
  - number: 116.2.a
    text: |-
      voor een beschikking als bedoeld in [artikel 18d][ref1], [18e][ref2], [18f][ref3], [69][ref4], [70][ref5] of
      [96][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel18e
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel18f
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel69
      [ref5]: https://wetten.overheid.nl/BWBR0018450#Artikel70
      [ref6]: https://wetten.overheid.nl/BWBR0018450#Artikel96
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
      - id: ref2
        bwb_id: BWBR0018450
        artikel: 18e
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
      - id: ref3
        bwb_id: BWBR0018450
        artikel: 18f
        hoofdstuk: '3'
        paragraaf: '3.3'
        afdeling: 3.3.2
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '69'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref5
        bwb_id: BWBR0018450
        artikel: '70'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref6
        bwb_id: BWBR0018450
        artikel: '96'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: 116.2.b
    text: voor een beschikking, genomen jegens een persoon die behoort tot het personeel van het College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel116
  - number: '117.1'
    text: |-
      Indien beroep is ingesteld tegen een bestuurlijke boete is, in afwijking van de [artikelen 8:27][ref1] en
      [8:28 van de Algemene wet bestuursrecht][ref2], de partij aan wie de bestuurlijke boete is opgelegd, niet verplicht
      omtrent de overtreding verklaringen af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '117.2'
    text: Voor de rechtbank deze partij ondervraagt, deelt zij haar mede dat zij niet verplicht is tot antwoorden.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel117
  - number: '117.3'
    text: |-
      Indien de rechtbank een beschikking tot het opleggen van een bestuurlijke boete vernietigt, neemt zij een
      beslissing omtrent het opleggen van de bestuurlijke boete en bepaalt zij dat haar uitspraak in zoverre in de plaats
      treedt van de vernietigde beschikking.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel117
  - number: '118.1'
    text: |-
      Een verzekerde die voor rekening van zijn zorgverzekering bij ministeriële regeling aan te wijzen
      zorg of andere diensten als bedoeld in [artikel 11][ref1] wenst te genieten, verstrekt aan de
      persoon of instelling die die zorg of dienst verleent ter inzage een identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, van de Wet op de identificatieplicht][ref2], of een ander bij ministeriële regeling aan te
      wijzen document waarmee zijn identiteit kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '118.2'
    text: |-
      Indien het identiteitsbewijs niet onmiddellijk ter inzage kan worden verstrekt, kan de persoon of instelling
      toestaan dat uiterlijk binnen een termijn van veertien dagen aan deze verplichting wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel118
  - number: '118.3'
    text: |-
      De persoon of instelling stelt aan de hand van het ter inzage verstrekte document de identiteit vast van
      degene aan wie de in het eerste lid bedoelde zorg of dienst wordt verleend, en neemt het met inachtneming van
      [artikel 7 van de Wet gebruik burgerservicenummer in de zorg][ref1] vastgestelde burgerservicenummer van de
      verzekerde in zijn administratie op.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel7
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '7'
  - number: 118a.1
    text: 'Verzekerden van achttien jaar of ouder:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel118a
  - number: 118a.1.a
    text: met meerjarige, onvermijdbare zorgkosten, of
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel118a
  - number: 118a.1.b
    text: |-
      die in een instelling als bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref1] verblijven, hebben,
      indien zij behoren tot bij of krachtens algemene maatregel van bestuur aan te wijzen groepen, jegens het CAK
      voor het einde van het kalenderjaar recht op een jaarlijkse uitkering ter hoogte van het bedrag genoemd in
      [artikel 19, eerste lid][ref2], verminderd met het geraamde gemiddelde bedrag dat een verzekerde die geen recht
      heeft op de in dit lid bedoelde uitkering naar verwachting in dat kalenderjaar ingevolge [artikel 19][ref3]
      betaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel19
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel118a
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 118a.2
    text: |-
      het CAK neemt het sociaal-fiscaalnummer van de personen, bedoeld in het eerste lid, met het oog op de uitvoering
      van dit artikel in zijn administratie op.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel118a
  - number: 118a.3
    text: |-
      Zorgverzekeraars verstrekken aan het CAK de persoonsgegevens van de personen bedoeld in het eerste lid, waaronder
      persoonsgegevens betreffende de gezondheid als bedoeld in de [Wet bescherming persoonsgegevens][ref1], die
      noodzakelijk zijn ter uitvoering van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel118a
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 118a.4
    text: 'Bij ministeriële regeling kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel118a
  - number: 118a.4.a
    text: tot welke gegevens de verplichting, bedoeld in het derde lid, zich uitstrekt;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel118a
  - number: 118a.4.b
    text: op welke wijze gegevens, bedoeld in het derde lid, worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel118a
  - number: 118a.4.c
    text: volgens welke technische standaarden gegevensverwerking plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel118a
  - number: 118a.4.d
    text: aan welke beveiligingseisen gegevensverwerking voldoet;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel118a
  - number: 118a.4.e
    text: |-
      in welke gevallen gegevens, bedoeld in het derde lid, verder worden verwerkt met het oog op de uitvoering van het
      uitkeren van het bedrag, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel118a
  - number: 118a.5
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald op welke wijze het College zorgverzekeringen de beheerskosten,
      bedoeld in [artikel 39, derde lid, onderdeel f][ref1], vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel39
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel118a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '39'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '119.1'
    text: |-
      Een overeenkomst met betrekking tot de verzekering van geneeskundige zorg of de kosten daarvan, gesloten voor een
      verzekerde met of ten behoeve van wie tevens een zorgverzekering is gesloten, vervalt met ingang van de dag waarop
      de bij en krachtens [artikel 11][ref1] te verzekeren prestaties worden uitgebreid, voor zover aan de overeenkomst
      rechten kunnen worden ontleend, gelijkwaardig aan die, welke vanaf dat moment uit de zorgverzekering voortvloeien.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '119.2'
    text: |-
      De premie die voor de op grond van het eerste lid geheel of gedeeltelijk vervallen overeenkomst is vooruitbetaald,
      wordt door de verzekeraar al naar gelang van het vervallen gedeelte der overeenkomst terugbetaald, onder aftrek van
      ten hoogste 25% van het terug te betalen bedrag.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel119
  - number: '120'
    text: |-
      Een beding van een verzekeraar die een ziektekostenverzekering ter aanvulling van de zorgverzekering aanbiedt,
      inhoudende dat de ziektekostenverzekering eindigt of door de verzekeraar mag worden opgezegd indien met of ten
      behoeve van de verzekerde een zorgverzekering met een andere zorgverzekeraar wordt gesloten, is nietig.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel120
  - number: '121'
    text: |-
      De bevoegdheden die [artikel 91 van de Comptabiliteitswet 2001][ref1] de Algemene Rekenkamer verschaft ten aanzien
      van rechtspersonen als bedoeld in het eerste lid, onderdeel d, van dat artikel, gelden niet ten aanzien van de
      wijze waarop zorgverzekeraars de opbrengst van bij of krachtens deze wet ingestelde heffingen aanwenden.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel91
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '91'
  - number: '122'
    text: |-
      Een zorgverzekeraar wordt, voor zover deze niet kan worden aangemerkt als onderneming in de zin van artikel 81
      van het Verdrag tot oprichting van de Europese Gemeenschap, voor de toepassing van de [Mededingingswet][ref1]
      aangemerkt als onderneming in de zin van [artikel 1 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008691
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel1
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0008691
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '1'
  - number: 122a.1
    text: |-
      Het College zorgverzekeringen verstrekt bijdragen aan zorgaanbieders die inkomsten derven ten gevolge van het
      verlenen van medisch noodzakelijke zorg aan:
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
  - number: 122a.1.a
    text: |-
      vreemdelingen als bedoeld in [artikel 8, onderdelen f of h, van de Vreemdelingenwet 2000][ref1], voor zover
      het betreft vreemdelingen die in afwachting zijn van een beslissing op een aanvraag tot het verlenen van een
      verblijfsvergunning als bedoeld in [artikel 14 van die wet][ref2], dan wel vreemdelingen die in afwachting zijn
      van een beslissing op een bezwaarschrift of een beroepschrift naar aanleiding van een beslissing als hiervoor
      bedoeld en deze procedure krachtens de [Vreemdelingenwet 2000][ref3] of op grond van een rechterlijke beslissing in
      Nederland mogen afwachten, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0011823
  - number: 122a.1.b
    text: |-
      vreemdelingen als bedoeld in [artikel 10 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel10
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '10'
  - number: 122a.2
    text: |-
      Onder medisch noodzakelijke zorg wordt verstaan zorg of overige diensten als bedoeld in [artikel 11][ref1] van
      deze wet of in [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref2], met uitzondering van bij of krachtens
      algemene maatregel van bestuur aan te wijzen vormen van zorg of diensten, en slechts voor zover de zorgaanbieder
      verstrekking ervan, gezien de aard van de prestaties en de verwachte duur van het verblijf van de vreemdeling,
      medisch noodzakelijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
  - number: 122a.3
    text: 'Geen bijdrage wordt verstrekt voor zover de kosten voor de verleende zorg:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
  - number: 122a.3.a
    text: op de vreemdeling of een verzekeraar van de vreemdeling kunnen worden verhaald,
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
  - number: 122a.3.b
    text: op grond van een andere wettelijke bepaling kunnen worden vergoed, of
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
  - number: 122a.3.c
    text: hoger zijn dan in de Nederlandse marktomstandigheden in redelijkheid passend is.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
  - number: 122a.4
    text: |-
      Indien zorg is verleend die aan verzekerden doorgaans zonder verwijzing, recept of zonder indicatie als bedoeld in
      de [Algemene Wet Bijzondere Ziektekosten][ref1] wordt verleend, bedraagt de bijdrage:


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 122a.4.a
    text: 100% van de kosten die verband houden met zwangerschap en bevalling, en
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
  - number: 122a.4.b
    text: |-
      80% van de kosten in de overige gevallen, voor zover deze kosten niet op grond van het derde lid zijn of kunnen
      worden betaald of buiten beschouwing dienen te blijven.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
  - number: 122a.5
    text: |-
      In bijdragen als bedoeld in het eerste lid voor andere zorg dan de zorg, bedoeld in het vierde lid, wordt voorzien
      door middel van met het oog op verlening van die zorg tussen het College zorgverzekeringen en zorgaanbieders
      gesloten overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
  - number: 122a.6
    text: |-
      Indien een zorgaanbieder zowel in zorg als bedoeld in het vierde lid als in zorg als bedoeld in het vijfde lid
      kan voorzien, kan een overeenkomst als bedoeld in het vijfde lid zich tevens uitstrekken over de in het vierde lid
      bedoelde zorg en kunnen in die overeenkomst van het vierde lid afwijkende afspraken worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
  - number: 122a.7
    text: |-
      Het College zorgverzekeringen zendt jaarlijks voor 1 oktober aan Onze Minister een begroting van de kosten van de
      bijdragen, bedoeld in het eerste lid, voor het volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
  - number: 122a.8
    text: |-
      Het voor de bijdragen in een kalenderjaar beschikbare bedrag wordt voor 1 december van het daaraan voorafgaande
      jaar door Onze Minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
  - number: 122a.9
    text: |-
      Het bedrag, bedoeld in het achtste lid, wordt gedekt uit ’s Rijks kas en wordt door het College zorgverzekeringen
      afzonderlijk beheerd en geadministreerd.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
  - number: 122a.10
    text: |-
      De [artikelen 40, tweede tot en met elfde lid][ref1], [72, tweede tot en met zesde lid][ref2], [73][ref3] en
      [75][ref4], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel73
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel75
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '72'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '73'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '75'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 122a.11
    text: |-
      De zorgaanbieder die in aanmerking wenst te komen voor een bijdrage als bedoeld in dit artikel, verstrekt het
      College zorgverzekeringen of door dat College aangewezen, bij de uitvoering van dit artikel betrokken personen,
      bij ministeriële regeling te bepalen gegevens die noodzakelijk zijn om het recht op en de omvang van een bijdrage
      te kunnen vaststellen, dan wel stelt hem deze gegevens voor dit doel voor inzage of het nemen van afschrift ter
      beschikking.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
  - number: 122a.12
    text: |-
      In afwijking van [artikel 116][ref1] kan een zorgaanbieder tegen een op grond van dit artikel genomen besluit van
      het College zorgverzekeringen beroep instellen bij het College van Beroep voor het bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel116
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '116'
        hoofdstuk: '10'
  - number: '123'
    text: |-
      Bij algemene maatregel van bestuur kunnen, zo nodig in afwijking van deze wet, tijdelijke voorzieningen worden
      getroffen voor het geval het College zorgverzekeringen of de zorgautoriteit zijn uit de wet voortvloeiende
      verplichtingen niet naar behoren nakomt.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel123
  - number: 123a
    text: |-
      Onze Minister draagt door het verstrekken van subsidies bij aan een voldoende aanbod van topreferente zorg,
      innovatie en ontwikkeling van zorg in academische ziekenhuizen of in een daarmee gelijk te stellen ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel123a
  - number: '124'
    text: |-
      De voordracht voor een krachtens de [artikelen 11, derde of vierde lid][ref1], [19, vijfde en zesde lid][ref2],
      [21][ref3] en [32, tweede lid][ref4], vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan
      vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel32
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '125'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel125
  - number: '126'
    text: Voor de uitvoering van deze wet kunnen bij algemene maatregel van bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel126
  - number: '127'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel127
  - number: '128'
    text: 'Deze wet wordt aangehaald als: Zorgverzekeringswet.'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel128
