preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat de gehele bevolking onder voor ieder gelijke
    sociale voorwaarden verzekerd is tegen de gevolgen van behoefte aan geneeskundige zorg;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel1
  - number: 1.a
    text: 'verzekeraar: een verzekeringsonderneming als bedoeld in de eerste richtlijn schadeverzekering;'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel1
  - number: 1.b
    text: 'zorgverzekeraar: een verzekeraar, voor zover deze zorgverzekeringen aanbiedt of uitvoert;'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel1
  - number: 1.c
    text: 'verzekeringnemer: een persoon die met een zorgverzekeraar een zorgverzekering heeft gesloten;'
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel1
  - number: 1.d
    text: |-
      zorgverzekering: een tussen een zorgverzekeraar en een verzekeringnemer ten behoeve van een verzekeringsplichtige
      gesloten schadeverzekering, die voldoet aan hetgeen daarover bij of krachtens deze wet is geregeld, en waarvan de
      verzekerde prestaties het bij of krachtens deze wet geregelde niet te boven gaan;
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel1
  - number: 1.e
    text: |-
      verzekeringsplichtige: degene die op grond van [artikel 2][ref1] verplicht is zich krachtens een zorgverzekering te
      verzekeren of te laten verzekeren;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel2
    url: https://wetten.overheid.nl/BWBR0018450/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 1.f
    text: |-
      verzekerde: degene wiens risico van behoefte aan zorg of overige diensten, als bedoeld in [artikel 10][ref1], door
      een zorgverzekering wordt gedekt;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel10
