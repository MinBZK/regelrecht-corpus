      - id: ref2
        bwb_id: BWBR0018450
        artikel: '68'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 39.3.c
    text: |-
      door het College zorgverzekeringen voldane vorderingen als bedoeld in [artikel 31, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel31
    url: https://wetten.overheid.nl/BWBR0018450/2007-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 39.3.d
    text: |-
      uitgaven in verband met molest als bedoeld in [artikel 55][ref1], inclusief vergoedingen als bedoeld in het
      [derde lid van dat artikel][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel55
    url: https://wetten.overheid.nl/BWBR0018450/2007-01-01#Artikel39
    references:
