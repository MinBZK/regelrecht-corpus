      - id: ref3
        bwb_id: BWBR0018450
        artikel: '96'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: '39.3'
    text: 'Ten laste van het Zorgverzekeringsfonds komen:'
    url: https://wetten.overheid.nl/BWBR0018450/2007-01-01#Artikel39
  - number: 39.3.a
    text: |-
      de bijdragen, bedoeld in de [artikelen 32][ref1], [33][ref2] en [34][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel34
    url: https://wetten.overheid.nl/BWBR0018450/2007-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 39.3.b
    text: |-
      subsidies als bedoeld in [artikel 68][ref1], inclusief vergoedingen als bedoeld in het
      [tweede lid van dat artikel][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel68
    url: https://wetten.overheid.nl/BWBR0018450/2007-01-01#Artikel39
    references:
      - id: ref1
