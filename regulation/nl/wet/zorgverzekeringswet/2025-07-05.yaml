  - number: '123'
    text: |-
      1 In dit artikel wordt verstaan onder:

        - *orgaan van de woonplaats:* rechtspersoon die door Onze Minister is aangewezen als orgaan van de woonplaats in
      de zin van de [Verordening (EG) nr. 883/2004](32004R0883) van het Europees Parlement en de Raad van 29 april 2004,
      betreffende de coördinatie van socialezekerheidsstelsels (PbEU 2004, L 166), of, voor zover het zorg betreft, een
      verdrag inzake sociale zekerheid;
        - *orgaan van de verblijfplaats:* rechtspersoon die door Onze Minister is aangewezen als orgaan van de
      verblijfplaats in de zin van de [Verordening (EG) nr. 883/2004](32004R0883) van het Europees Parlement en de Raad
      van 29 april 2004, betreffende de coördinatie van socialezekerheidsstelsels (PbEU 2004, L 166), of, voor zover het
      zorg betreft, een verdrag inzake sociale zekerheid;
        - *verdragsrecht:* recht van een in Nederland wonende of tijdelijk verblijvende persoon op zorg of andere diensten
      in de zin van deze wet of de [Wet langdurige zorg][ref1] uit hoofde van een verordening van het Europees Parlement
      en de Raad van de Europese Unie dan wel toepassing van zodanige verordening krachtens een overeenkomst betreffende
      de Europese Economische Ruimte of een verdrag inzake sociale zekerheid;
        - *verdragsgerechtigde:* persoon met een verdragsrecht.

      2 Onze Minister wijst de organen van de woonplaats en de organen van de verblijfplaats aan.

      3 Voor een juiste en volledige registratie van verdragsgerechtigden ter beoordeling van het voortbestaan van het
      verdragsrecht:

      a. doet het orgaan van de woonplaats periodiek opgave van de bij hem geregistreerde verdragsgerechtigden aan de
      Sociale verzekeringsbank, waarbij het orgaan gebruik kan maken van het burgerservicenummer;

      b. stelt de Sociale verzekeringsbank het orgaan van de woonplaats in kennis van de verschillen tussen de opgave,
      bedoeld onder a, en de vermelding van deze personen in het bestand van personen die verzekerd zijn op grond van
      de [Wet langdurige zorg][ref2].

      4 Het orgaan van de woonplaats rapporteert aan het CAK over de uitvoering van het derde lid.

      5 Het CAK kan nadere regels stellen met betrekking tot de wijze waarop het derde en vierde lid worden uitgevoerd.

      6 Het CAK verstrekt aan het orgaan van de woonplaats een vergoeding voor:

      a. de kosten die het orgaan van de woonplaats heeft betaald voor het doen verlenen van zorg of andere diensten in
      de zin van deze wet of de [Wet langdurige zorg][ref3] ten behoeve van een persoon die geen verdragsrecht meer heeft
      en het orgaan van de woonplaats daar niet tijdig over heeft geïnformeerd;

      b. de incassokosten voor het verhalen van de kosten, bedoeld onder a, op de persoon, bedoeld onder a.

      7 Geen vergoeding als bedoeld in het zesde lid wordt verstrekt voor zover:

      a. de kosten op de persoon, bedoeld in het zesde lid, kunnen worden verhaald;

      b. het orgaan van de woonplaats, onder meer uit hoofde van de uitvoering van het derde lid, wist of behoorde te
      weten dat de persoon, bedoeld in het zesde lid, behoorde te zijn uitgeschreven.

      8 Het CAK verstrekt aan het orgaan van de verblijfplaats een vergoeding voor:

      a. de kosten die het orgaan van de verblijfplaats heeft betaald voor het doen verlenen van zorg of andere diensten
      in de zin van deze wet of de [Wet langdurige zorg][ref4] ten behoeve van een persoon zonder verdragsrecht;

      b. de incassokosten voor het verhalen van de kosten, bedoeld onder a.

      9 Geen vergoeding als bedoeld in het achtste lid wordt verstrekt voor zover:

      a. de kosten, bedoeld in het achtste lid, kunnen worden verhaald;

      b. de zorgaanbieder of het orgaan van de verblijfplaats er niet op mocht vertrouwen dat de persoon, bedoeld in het
      achtste lid, beschikte over het verdragsrecht.

      10 De vergoedingen wordt op aanvraag verstrekt.

      11 Bij ministeriële regeling kunnen nadere regels worden gesteld over het verstrekken van de vergoedingen.


