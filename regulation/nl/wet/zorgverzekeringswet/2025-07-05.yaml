  - number: '75'
    text: |-
      1 Het werkprogramma, bedoeld in [artikel 71][ref1], de verantwoording, bedoeld in [artikel 73a, eerste lid][ref2],
      en de jaarrekening, bedoeld in [artikel 74][ref3], behoeven de goedkeuring van Onze Minister.

      2 In afwijking van het eerste lid en van
      [artikel 29, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref4], behoeven wijzigingen in een
      goedgekeurde begroting geen goedkeuring van Onze Minister, mits:

      a. de totale omvang van de begroting geen wijziging ondergaat, en

      b. de wijziging per groep van kostensoorten en baten, gerekend over het desbetreffende begrotingsjaar, een bedrag
      van 5 procent van het in [artikel 72][ref5] bedoelde budget niet te boven gaat.

      3 Bij ministeriële regeling kunnen regels worden gesteld over:

      a. de inhoud en de inrichting van het werkprogramma, bedoeld in [artikel 71, eerste lid][ref6], en de
      meerjarenagenda, bedoeld in artikel 71, tweede lid;

      b. de inhoud en de inrichting van de begroting, bedoeld in
      [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref7];

      c. de inhoud en inrichting van de verantwoording, bedoeld in [artikel 73a, eerste lid][ref8], en van het in dat lid
      bedoelde assurance report;

      d. de inhoud en inrichting van de jaarrekening, bedoeld in [artikel 74][ref9], alsmede in
      [artikel 34 van de Kaderwet zelfstandige bestuursorganen][ref10];

      e. de accountantscontrole van de jaarrekeningen, bedoeld in [artikel 74][ref11] en
      [artikel 34 van de Kaderwet zelfstandige bestuursorganen][ref12];

      f. de bij de jaarrekeningen, bedoeld in [artikel 74][ref13] en
      [artikel 34 van de Kaderwet zelfstandige bestuursorganen][ref14] behorende verslagen van bevindingen alsmede het
      assurance report, bedoeld in [artikel 73a, eerste lid][ref15];

      g. de inhoud en de inrichting van het jaarverslag, bedoeld in
      [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref16];

      h. de omvang van de egalisatiereserve, bedoeld in [artikel 33 van de Kaderwet zelfstandige bestuursorganen][ref17].

      4 Bij ministeriële regeling worden regels gesteld over de wijze waarop en de voorwaarden waaronder het budget,
      bedoeld in [artikel 72][ref18], wordt vastgesteld.


