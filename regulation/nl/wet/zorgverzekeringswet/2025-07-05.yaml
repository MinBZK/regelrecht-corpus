  - number: 70a
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat het Zorginstituut een subsidie verstrekt aan zorgaanbieders
      ten behoeve van kosten van geneeskundige zorg zoals huisartsen en klinisch-psychologen die plegen te bieden voor
      zover het gaat om kortdurende generalistische behandeling van een persoon met lichte tot matig ernstige psychische
      problematiek, inclusief de daarbij behorende diagnostiek of toegeleiding naar die zorg, die niet in rekening te
      brengen zijn bij de zorgverzekeraar of de individuele verzekerde, omdat de identiteit van de verzekerde niet kan
      worden vastgesteld.

      2 In de regeling, bedoeld in het eerste lid, kunnen voorwaarden opgenomen worden ten aanzien van de subsidie en kan
      jaarlijks een subsidieplafond worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel70a
  - number: 70b
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat het Zorginstituut uitkeringen verstrekt ter vergoeding van
      kosten van zorg en andere diensten, bedoeld bij en krachtens [artikel 11][ref1], verleend door zorgaanbieders aan
      personen die zijn opgenomen in het stelsel van Bewaken & Beveiligen van het Openbaar Ministerie.

      2 In de regeling, bedoeld in het eerste lid, kunnen voorwaarden opgenomen worden ten aanzien van de in dat lid
      bedoelde uitkeringen en ten aanzien van de uitvoering van de in dat lid bedoelde taak van het Zorginstituut.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
