  - number: '36'
    text: |-
      Op rechten of verplichtingen die voortvloeien uit hetgeen in deze paragraaf geregeld is, is
      [titel 4.2 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '37'
    text: |-
      1 De zorgverzekeraar zendt binnen zes maanden na afloop van het boekjaar twee exemplaren van zijn jaarrekening en
      van zijn jaarverslag aan de zorgautoriteit.

      2 Een zorgverzekeraar die [artikel 403 van Boek 2 van het Burgerlijk Wetboek][ref1] toepast, zendt de jaarrekening,
      het jaarverslag en de geconsolideerde jaarrekening onverwijld na de neerlegging van het jaarverslag en de
      geconsolideerde jaarrekening ten kantore van het handelsregister, in tweevoud aan de zorgautoriteit.

      3 De zorgverzekeraar voegt bij de stukken, bedoeld in het eerste of tweede lid, twee afschriften van de
      accountantsverklaring die hij op grond van het Burgerlijk Wetboek of de [Wet op het financieel toezicht][ref2] over
      deze stukken dient te laten opstellen.

      4 De zorgautoriteit zendt het CAK en het Zorginstituut onverwijld één exemplaar van de in het eerste tot en met
      derde lid bedoelde stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel403
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '403'
      - id: ref2
        bwb_id: BWBR0020368
  - number: '38'
    text: |-
      1 De zorgverzekeraar zendt voor 1 juli aan de zorgautoriteit in tweevoud een uitvoeringsverslag waarin hij:

      a. rapporteert over de uitvoering van deze wet in het voorafgaande kalenderjaar, en

      b. een overzicht geeft van zijn voornemens met betrekking tot de uitvoering van deze wet in het lopende
      kalenderjaar en het daaropvolgende kalenderjaar.

      2 Bij ministeriële regeling kunnen nadere voorschriften worden gesteld omtrent de inhoud van het
      uitvoeringsverslag.

      3 De voorschriften, bedoeld in het tweede lid, kunnen in het bijzonder betrekking hebben op naleving van een in de
      regeling aan te wijzen gedragscode.

      4 De zorgverzekeraar voegt bij het uitvoeringsverslag twee exemplaren van een verslag met bevindingen van een
      accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1] over de vraag of:

      a. het uitvoeringsverslag overeenkomstig de daarvoor geldende regels is opgesteld;

      b. de uitvoering is geschied overeenkomstig de verplichtingen die bij of krachtens deze wet in het voorafgaande
      kalenderjaar op de zorgverzekeraar rustten.

      5 [Artikel 37, vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel37
