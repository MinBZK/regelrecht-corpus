      1 Een verzekerde die voor rekening van zijn zorgverzekering bij ministeriële regeling aan te wijzen
      zorg of andere diensten als bedoeld in [artikel 11][ref1] wenst te genieten, verstrekt aan de
      persoon of instelling die die zorg of dienst verleent ter inzage een identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, van de Wet op de identificatieplicht][ref2], of een ander bij ministeriële regeling aan te
      wijzen document waarmee zijn identiteit kan worden vastgesteld.

      2 Indien het identiteitsbewijs niet onmiddellijk ter inzage kan worden verstrekt, kan de persoon of instelling
      toestaan dat uiterlijk binnen een termijn van veertien dagen aan deze verplichting wordt voldaan.

      3 De persoon of instelling stelt aan de hand van het ter inzage verstrekte document de identiteit vast van
      degene aan wie de in het eerste lid bedoelde zorg of dienst wordt verleend, en neemt het met inachtneming
      van [artikel 7 van de Wet aanvullende bepalingen verwerking persoonsgegevens in de zorg][ref3] vastgestelde
      burgerservicenummer van de verzekerde in zijn administratie op.


