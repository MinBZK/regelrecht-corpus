  - number: '71'
    text: |-
      1 Het Zorginstituut zendt jaarlijks voor 1 oktober tegelijk met de begroting een werkprogramma voor het volgende
      kalenderjaar aan Onze Minister met een beschrijving van de activiteiten die het Zorginstituut voornemens is ter
      uitvoering van zijn taken te verrichten.

      2 Tegelijk met de begroting, bedoeld in het eerste lid, zendt het Zorginstituut voor de uitvoering van de taken op
      het gebied van de kwaliteit van de zorg eveneens een meerjarenagenda voor de volgende vier kalenderjaren aan Onze
      Minister.

      3 Onverminderd [artikel 27 van de Kaderwet zelfstandige bestuursorganen][ref1] bevat de begroting een
      meerjarenraming van de beheerskosten voor de vier kalenderjaren, volgend op het begrotingsjaar.

      4 In het werkprogramma, bedoeld in het eerste lid, wordt onderscheid gemaakt naar gelang het gaat om de uitvoering
      van taken op het gebied van de kwaliteit van de zorg en van de taken, bedoeld in [artikel 66f][ref2], dan wel om
      andere taken van het Zorginstituut.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel66f
