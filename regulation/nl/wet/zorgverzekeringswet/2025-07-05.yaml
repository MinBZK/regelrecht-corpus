    text: |-
      1 Een zorgaanbieder die aan een verzekerde zorg of andere diensten, bedoeld in [artikel 11][ref1], heeft verleend,
      en die de kosten daarvan krachtens een door hem met de zorgverzekeraar gesloten overeenkomst rechtstreeks bij
      die zorgverzekeraar in rekening brengt, verstrekt die zorgverzekeraar of een door die zorgverzekeraar aangewezen
      persoon de persoonsgegevens van de verzekerde, waaronder gegevens over gezondheid als bedoeld in artikel 4,
      onderdeel 15 van de Algemene verordening gegevensbescherming, die noodzakelijk zijn voor de uitvoering van de
      zorgverzekering of van deze wet, dan wel stelt hem deze gegevens voor dit doel voor inzage of het nemen van
      afschrift ter beschikking.

      2 Een zorgaanbieder die aan een verzekerde zorg of andere diensten, bedoeld in [artikel 11][ref2], heeft verleend
      en die de kosten daarvan bij de verzekerde in rekening brengt, verstrekt hem de persoonsgegevens, waaronder
      gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15 van de Algemene verordening gegevensbescherming,
      die voor zijn zorgverzekeraar noodzakelijk zijn voor de uitvoering van de zorgverzekering of van deze wet.

      3 De zorgaanbieder, bedoeld in het eerste of tweede lid, verstrekt een door Onze Minister aangewezen persoon
      kosteloos bij ministeriële regeling omschreven, voor de uitvoering van deze wet noodzakelijke persoonsgegevens,
      waaronder gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15 van de Algemene verordening
      gegevensbescherming.

      4 Personen werkzaam ten behoeve van een zorgaanbieder als bedoeld in het eerste of tweede lid, verstrekken die
      zorgaanbieder de persoonsgegevens die hij nodig heeft om te kunnen voldoen aan zijn verplichtingen bedoeld in het
      eerste, tweede en derde lid.

      5 Personen werkzaam bij de zorgverzekeraar, bij een door de zorgverzekeraar aangewezen persoon als bedoeld in
      het eerste lid, of bij de door Onze Minister aangewezen persoon als bedoeld in het derde lid, voor wie niet reeds
      uit hoofde van ambt of beroep een geheimhoudingplicht geldt, zijn verplicht tot geheimhouding van de gegevens
      als bedoeld in het eerste, tweede of derde lid, behoudens voor zover enig wettelijk voorschrift hen mededeling
      toestaat.

      6 Bij ministeriële regeling kan worden bepaald:

      a. tot welke gegevens de verplichting, bedoeld in het eerste of tweede lid, zich in ieder geval uitstrekt;

      b. op welke wijze gegevens, bedoeld in het eerste of tweede lid, worden verwerkt;

      c. volgens welke technische standaarden gegevensverwerking plaatsvindt;

      d. aan welke beveiligingseisen gegevensverwerking voldoet;

      e. in welke gevallen gegevens, bedoeld in het eerste of tweede lid, verder worden verwerkt met het oog op de
      uitvoering van de zorgverzekering of een aanvullende ziektekostenverzekering, voor zover deze gegevens niet
      worden gebruikt voor het beoordelen en accepteren van een aspirant-verzekerde voor een aanvullende verzekering en
      bovendien noodzakelijk zijn voor:

      1°. de betaling aan een zorgaanbieder of de vergoeding van zorgkosten aan een verzekerde;

      2°. de vaststelling van eigen bijdragen of nog openstaand verplicht of vrijwillig eigen risico;

      3°. het uitoefenen van het verhaalsrecht; of

      4°. het verrichten van controle of fraudeonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel11
