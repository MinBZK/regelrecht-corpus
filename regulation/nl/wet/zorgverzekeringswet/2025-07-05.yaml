  - number: '43'
    text: |-
      1 De verzekeringsplichtige is een inkomensafhankelijke bijdrage verschuldigd over het in een kalenderjaar genoten
      bijdrage-inkomen.

      2 Het bijdrage-inkomen is het gezamenlijke bedrag van hetgeen door de verzekeringsplichtige is genoten aan:

      a. loon overeenkomstig de [Wet op de loonbelasting 1964][ref1], verminderd met:

      1°. het loon waarop [artikel 42][ref2] van toepassing is;

      2°. de eindheffingsbestanddelen, bedoeld in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref3];

      en vermeerderd met loon, bepaald volgens de regels van [artikel 3.82 van de Wet inkomstenbelasting 2001][ref4];

      b. belastbare winst uit onderneming, bepaald volgens de regels van
      [afdeling 3.2 van de Wet inkomstenbelasting 2001][ref5] met uitzondering van het bedrag dat ingevolge
      [artikel 3.70, tweede lid, van die wet][ref6], zoals dat luidde op 31 december 2022 in de winst wordt opgenomen ter
      zake van een afname van de oudedagsreserve als bedoeld in artikel 3.70, eerste lid, aanhef en onderdeel a, van die
      wet, zoals dat luidde op 31 december 2022;

      c. belastbaar resultaat uit overige werkzaamheden, bepaald volgens de regels van
      [afdeling 3.4 van de Wet inkomstenbelasting 2001][ref7], met uitzondering van de in
      [artikel 3.91, eerste lid, onderdelen a en b][ref8], en [artikel 3.92 van de Wet inkomstenbelasting 2001][ref9]
      bedoelde werkzaamheden;

      d. belastbare periodieke uitkeringen en verstrekkingen, bepaald volgens de regels van
      [afdeling 3.5 van de Wet inkomstenbelasting 2001][ref10].

      3 Het bijdrage-inkomen wordt ten minste op nihil gesteld en wordt tot geen hoger bedrag in aanmerking genomen dan
      het bij regeling van Onze Minister, in overeenstemming met Onze Ministers van Sociale Zaken en Werkgelegenheid en
      van Financiën, met betrekking tot een kalenderjaar vastgestelde bedrag.

      4 Ingeval de inkomensafhankelijke bijdrage ingevolge [artikel 49, tweede lid][ref11], bij wijze van inhouding wordt
      geheven, is [artikel 42, tweede tot en met zesde lid][ref12], van overeenkomstige toepassing.

      5 Ingeval de inkomensafhankelijke bijdrage ingevolge [artikel 49, derde lid][ref13], bij wege van aanslag wordt
      geheven, wordt daarbij als bijdrage-inkomen ten hoogste in aanmerking genomen een bedrag gelijk aan het in het
      derde lid bedoelde bedrag, verminderd met het loon, bedoeld in [artikel 42][ref14], van de verzekeringsplichtige
      en met het door de verzekeringsplichtige van een inhoudingsplichtige genoten loon, bedoeld in het tweede lid,
      onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
