  - number: 28c
    text: |-
      1 De zorgverzekeraar stelt de vertegenwoordiging, bedoeld in [artikel 28, tweede lid][ref1], in de gelegenheid
      advies uit te brengen over de vaststelling, wijziging of intrekking van het jaarlijkse zorginkoopbeleid.

      2 Het advies wordt op een zodanig tijdstip gevraagd, dat de vertegenwoordiging redelijkerwijs genoeg tijd heeft
      zich een goed oordeel ter zake te vormen en dat het advies van wezenlijke invloed kan zijn op het jaarlijkse
      zorginkoopbeleid.

      3 De vertegenwoordiging brengt binnen een redelijke termijn schriftelijk advies uit en betrekt daarin hetgeen is
      gedaan met de resultaten van de inspraak als bedoeld in [artikel 28a, tweede lid, onderdeel a][ref2].

      4 De vertegenwoordiging is bevoegd de zorgverzekeraar ongevraagd te adviseren over het jaarlijkse zorginkoopbeleid.

      5 De zorgverzekeraar doet van de vaststelling, wijziging of intrekking van het jaarlijkse zorginkoopbeleid
      schriftelijk, en voor zover van het advies wordt afgeweken onder opgave van redenen, mededeling aan de
      vertegenwoordiging.

      6 Bij algemene maatregel van bestuur kunnen onderdelen van beleidsterreinen worden aangewezen waarop het bepaalde
      in het eerste tot en met vijfde lid van overeenkomstige toepassing is.

      7 Indien de zorgverzekeraar in zijn statuten bepaalt dat de vertegenwoordiging ook over andere onderdelen van het
      beleid advies uit kan brengen, is het bepaalde in het eerste tot en met vijfde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel28a
