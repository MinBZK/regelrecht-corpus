        paragraaf: '3.1'
  - number: '12'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen ter bescherming van het algemeen belang vormen van zorg of overige
      diensten worden aangewezen die de zorgverzekeraar slechts verstrekt of vergoedt indien tussen hem en de aanbieder
      van de desbetreffende zorg of dienst een overeenkomst over de te leveren zorg of dienst en de daarvoor in rekening
      te brengen prijs is gesloten, dan wel indien de aanbieder bij hem in dienst is.

      2 Bij deze algemene maatregel van bestuur kunnen tevens vormen van zorg of overige diensten worden aangewezen
      waarvoor de zorgverzekeraar met iedere instelling die binnen zijn werkgebied is gelegen of waarvan zijn verzekerden
      naar verwachting regelmatig gebruik zullen maken, op haar verzoek een overeenkomst als bedoeld in het eerste lid
      sluit.

      3 Een instelling als bedoeld in [artikel 1, onderdeel m, onder 1°][ref1], die voor een in het tweede lid bedoelde
      vorm van zorg of dienst een overeenkomst met een zorgverzekeraar heeft gesloten, is verplicht desgevraagd met een
      andere zorgverzekeraar een gelijke overeenkomst te sluiten.

      4 Het tweede en het derde lid gelden niet indien de zorgverzekeraar respectievelijk instelling ernstige bezwaren
      heeft tegen het sluiten van een overeenkomst met de instelling respectievelijk zorgverzekeraar die om die
      overeenkomst vraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
        hoofdstuk: '1'
  - number: '13'
    text: |-
      1 Indien een verzekerde krachtens zijn zorgverzekering een bepaalde vorm van zorg of een andere dienst dient te
      betrekken van een aanbieder met wie zijn zorgverzekeraar een overeenkomst over deze zorg of dienst en de daarvoor
      in rekening te brengen prijs heeft gesloten of van een aanbieder die bij zijn zorgverzekeraar in dienst is, en
      hij deze zorg of andere dienst desalniettemin betrekt van een andere aanbieder, heeft hij recht op een door de
      zorgverzekeraar te bepalen vergoeding van de voor deze zorg of dienst gemaakte kosten.

      2 De zorgverzekeraar neemt de wijze waarop hij de vergoeding berekent in de modelovereenkomst op.

      3 Indien bij of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 11][ref1], is bepaald dat een
      deel van de kosten van een bepaalde vorm van zorg of van een bepaalde andere dienst voor rekening van de verzekerde
      komt, verwerkt de zorgverzekeraar dit in de wijze waarop hij de vergoeding voor de desbetreffende vorm van zorg of
      dienst berekent.

      4 De wijze waarop de vergoeding wordt berekend is voor alle verzekerden, bedoeld in het eerste lid, die in een
      zelfde situatie een zelfde vorm van zorg of dienst behoeven, gelijk.

      5 Indien een overeenkomst tussen een zorgverzekeraar en een aanbieder als bedoeld in het eerste lid wordt
      beëindigd, houdt een verzekerde die op het moment van beëindiging van de overeenkomst zorg ontvangt van deze
      aanbieder, recht op zorgverlening door die aanbieder voor rekening van deze zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 13a
    text: |-
      1 De zorgverzekeraar neemt in zijn modelovereenkomst op dat de verzekerde die behoefte heeft aan verpleging en
      verzorging die niet gepaard gaat met verblijf in verband met geneeskundige zorg, desgevraagd altijd in aanmerking
      komt voor een passende vergoeding in de vorm van een Zvw-pgb. De zorgverzekeraar stelt de verzekerde met deze
      vergoeding in staat in de praktijk zorg of een andere dienst te betrekken, die is afgestemd op zijn behoeften,
      persoonskenmerken en mogelijkheden.

      2 De zorgverzekeraar treedt, na de in het eerste lid bedoelde aanvraag en voorafgaand aan het verstrekken van het
      Zvw-pgb, in contact met de verzekerde. De zorgverzekeraar informeert de verzekerde over de in het derde lid en
      andere bij of krachtens deze wet gestelde voorwaarden of beperkingen en beoordeelt de geschiktheid van verzekerde
      om in aanmerking te komen voor een Zvw-pgb.

      3 De zorgverzekeraar neemt in zijn modelovereenkomst de voorwaarden op waaronder de verzekerde in aanmerking komt
      voor een Zvw-pgb.

      4 De zorgverzekeraar neemt in zijn modelovereenkomst op dat de verzekerde ook in aanmerking kan komen voor een Zvw-
      pgb indien de kosten die de verzekerde maakt voor het betrekken van de desbetreffende zorg of andere dienst hoger
      zijn dan de vergoeding in de vorm van het Zvw-pgb, mits het verschil voor rekening van de verzekerde komt.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de voorwaarden die aan de verzekerde
      of diens vertegenwoordiger worden gesteld om in aanmerking te komen voor een Zvw-pgb.

      6 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:

      a. de inhoud van de zorg waarvoor een Zvw-pgb wordt verstrekt;

      b. het uitzonderen van vormen van zorg of overige diensten van het Zvw-pgb;

      c. het met een Zvw-pgb vergoeden van andere vormen van zorg of overige diensten die onmiddellijk samenhangen met
      verpleging en verzorging die niet gepaard gaat met verblijf in verband met geneeskundige zorg;

      d. de mate van vergoeding die de zorgverzekeraar de verzekerde ten minste moet of ten hoogste mag bieden.

      7 De zorgverzekeraar wijst de verzekerde bij de aanvraag op het recht op cliëntondersteuning, bedoeld in
      [artikel 2.2.4, eerste lid, onder a, van de Wet maatschappelijke ondersteuning 2015][ref1].

      8 Bij ministeriële regeling kan een publiekrechtelijke rechtspersoon worden aangewezen die de verzekerde met een
      Zvw-pgb op diens verzoek ondersteunt bij het verkrijgen van de vergoeding van zijn zorgverzekeraar voor en zijn
      werkgeverstaken of opdrachtgeverschap in verband met de door verzekerde betrokken zorg of diensten.

      9 In de ministeriële regeling, bedoeld in het achtste lid, kunnen regels worden gesteld over de uitvoering van de
      ondersteuning en over de verstrekking van een jaarlijkse rijksbijdrage voor de uitvoering van de ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2.2.4
