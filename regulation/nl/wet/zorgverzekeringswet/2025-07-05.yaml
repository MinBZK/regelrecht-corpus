  - number: '33'
    text: |-
      1 In dit artikel wordt verstaan onder:

        - *catastrofe:* een natuurramp, een pandemie, een kernexplosie of een bij ministeriële regeling aan te wijzen
      andere buitengewone gebeurtenis;
        - *catastrofejaar:* het kalenderjaar waarin een catastrofe optreedt;
        - *gemiddelde vereveningsbijdrage:* de toegekende vereveningsbijdrage per verzekerde, die wordt berekend door
      de som van de op grond van [artikel 32][ref1] met betrekking tot het catastrofejaar aan alle zorgverzekeraars
      toegekende vereveningsbijdragen te delen door het op het moment van toekenning van die bijdragen verwachte
      totaalaantal verzekerden in dat jaar.

      2 Indien de kosten voor de op grond van de zorgverzekeringen verzekerde zorg of andere diensten ten gevolge van een
      catastrofe naar verwachting van het Zorginstituut in het catastrofejaar en het daaropvolgende kalenderjaar tezamen,
      voor een zorgverzekeraar hoger zullen zijn dan 4% van het product van de gemiddelde vereveningsbijdrage en het op
      het moment van de toekenning van de vereveningsbijdrage over het catastrofejaar verwachte aantal verzekerden bij
      die verzekeraar, kent het Zorginstituut de verzekeraar die daar om verzoekt naast de hem voor het catastrofejaar
      toegekende vereveningsbijdrage een extra bijdrage toe.

      3 Een zorgverzekeraar aan wie een extra bijdrage als bedoeld in het tweede lid is toegekend, houdt een
      afzonderlijke administratie bij van de in het catastrofejaar en het daaropvolgende kalenderjaar ten gevolge van de
      catastrofe optredende kosten van verzekerde zorg en andere diensten.

      4 Bij ministeriële regeling worden regels gesteld omtrent de berekening van de bijdragen en kunnen regels worden
      gesteld over de administratie, bedoeld in het derde lid, en de wijze waarop de toegekende bijdragen door het
      Zorginstituut worden betaald.

      5 [Artikel 32, vijfde en zevende lid][ref2], zijn, met uitzondering van de in dat vijfde lid opgenomen verplichting
      de beleidsregels jaarlijks voor 15 oktober vast te stellen, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel32
