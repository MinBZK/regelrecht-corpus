  - number: '57'
    text: |-
      1 Van de persoon die op grond van [artikel 2, tweede lid, onderdeel b][ref1], niet verzekeringsplichtig is,
      wordt bijdragevervangende belasting geheven, tot het bedrag van de in [artikel 43, eerste lid][ref2], bedoelde
      inkomensafhankelijke bijdrage dat deze persoon verschuldigd zou zijn als hij verzekeringsplichtig zou zijn.

      2 In afwijking in zoverre van [artikel 43][ref3] wordt van de persoon aan wie met toepassing van
      [artikel 64 van de Wet financiering sociale verzekeringen][ref4] een ontheffing is verleend in het kader van één of
      meer volksverzekeringen anders dan die volgens de [Wet langdurige zorg][ref5], geen inkomensafhankelijke bijdrage
      geheven maar een bijdragevervangende belasting, tot het bedrag van de inkomensafhankelijke bijdrage, bedoeld in
      artikel 43, tweede lid.

      3 De heffing van de bijdragevervangende belasting vindt plaats met overeenkomstige toepassing van
      [artikel 49, tweede, derde en vierde lid][ref6].

      4 De rijksbelastingdienst stort de belasting, bedoeld in het eerste lid, op de rekening, bedoeld in
      [artikel 70, eerste dan wel tweede lid][ref7].


