  - number: '39'
    text: |-
      1 Er is een Zorgverzekeringsfonds.

      2 Ten gunste van het Zorgverzekeringsfonds komen:

      a. de inkomensafhankelijke bijdragen, bedoeld in [paragraaf 5.2][ref1] en de bijdragevervangende belasting, bedoeld
      in [artikel 57, tweede lid][ref2];

      b. de rijksbijdrage, bedoeld in [artikel 54][ref3];

      c. een rijksbijdrage als bedoeld in de [artikelen 55][ref4] of [56][ref5];

      d. een bedrag van iedere rekening, bedoeld in [artikel 70][ref6], gelijk aan:

      1°. voor iedere tot een huishouding als bedoeld in [artikel 70, tweede lid][ref7], behorende gemoedsbezwaarde,
      die zich na bereiken van de leeftijd van 18 jaar heeft laten registreren als gemoedsbezwaarde en die daarna
      alsnog verzekeringsplichtig wordt: het saldo van de rekening gedeeld door het aantal tot de huishouding behorende
      gemoedsbezwaarden;

      2°. indien de rekening met toepassing van [artikel 70, zevende lid][ref8], wordt opgeheven: het saldo van de
      rekening;

      e. aan het Zorginstituut betaalde bedragen ter gehele of gedeeltelijke voldoening van vorderingen als bedoeld in
      [artikel 31, tweede lid][ref9];

      f. de bijdragen en bestuurlijke boeten, bedoeld in [artikel 69][ref10];

      g. met uitzondering van het gedeelte, bedoeld in [artikel 18g, zesde lid][ref11], de bestuursrechtelijke premies,
      bedoeld in de [artikelen 18d][ref12] en [18e][ref13];

      h. de inkomsten die in verband met deze wet voortvloeien uit internationale overeenkomsten;

      i. de door de zorgautoriteit van verzekeraars op grond van
      [artikel 83 van de Wet marktordening gezondheidszorg][ref14] geïnde dwangsommen en de ingevorderde bestuurlijke
      boeten, bedoeld in de [artikelen 86 tot en met 89 van die wet][ref15];

      j. de bijdrage, bedoeld in [artikel 87a van de Wet financiering sociale verzekeringen][ref16];

      k. door zorgaanbieders ingevolge een regel van de zorgautoriteit op grond van
      [artikel 37, eerste lid, aanhef en onder d, van de Wet marktordening gezondheidszorg][ref17] dan wel op aanwijzing
      van de zorgautoriteit op grond van [artikel 76, tweede lid, van die wet][ref18] afgedragen bedragen en door de
      zorgautoriteit van zorgaanbieders op grond van [artikel 81, eerste lid, onder c, van die wet][ref19] ingevorderde
      bedragen, voor zover die bedragen niet worden afgedragen aan het Fonds langdurige zorg of aan derden;

      l. de bijdragen, bedoeld in [artikel 68b, vijfde lid][ref20].

      3 Ten laste van het Zorgverzekeringsfonds komen:

      a. de bijdragen, bedoeld in de [artikelen 32][ref21], [33][ref22], [34][ref23] en [34a][ref24];

      b.

      c. door het Zorginstituut voldane vorderingen als bedoeld in [artikel 31, eerste lid][ref25];

      d. uitgaven in verband met molest als bedoeld in [artikel 55][ref26], inclusief vergoedingen als bedoeld in het
      derde lid van dat artikel;

      e. de uitgaven die in verband met deze wet voortvloeien uit internationale overeenkomsten;

      f. bedragen als bedoeld in [artikel 56a van de Wet marktordening gezondheidszorg][ref27];

      g. de door het Zorginstituut op grond van een ministeriële regeling vastgestelde verdeelbedragen, zijnde aan de
      relevante zorgverzekeraars toegekende delen van de bedragen bedoeld in onderdeel k van het tweede lid;

      h. bijdragen als bedoeld in de [artikelen 70a][ref28] en [70b][ref29];

      i. de vergoedingen, bedoeld in [artikel 123, zesde en achtste lid][ref30], voor zover het zorg en andere diensten
      uit hoofde van deze wet betreft;

      j. de vergoedingen, bedoeld in [artikel 68b, eerste lid][ref31].

      4 Uit het Zorgverzekeringsfonds kunnen, volgens bij ministeriële regeling te stellen regels, middelen worden
      gebruikt voor het vormen en in stand houden van een voor de doelstelling van het fonds noodzakelijke reserve.


