      1 Het Zorginstituut bevordert de eenduidige uitleg van de aard, inhoud en omvang van de prestaties, bedoeld in
      [artikel 11][ref1].

      2 Het Zorginstituut kan de zorgverzekeraars met het oog hierop richtlijnen geven.


