  - number: 89a
    text: |-
      1 Een zorgverzekeraar verstrekt aan Onze Minister de door hem verzochte informatie ten behoeve van het te voeren
      beleid op het gebied van de volksgezondheid.

      2 De door een Wlz-uitvoerder op grond van [artikel 89, eerste lid][ref1], aan een zorgverzekeraar voor de
      uitvoering van dit artikel te verstrekken informatie kan ook gegevens over gezondheid als bedoeld in artikel 4,
      onderdeel 15, van de Algemene verordening gegevensbescherming, betreffen.

      3 Een zorgverzekeraar verwerkt ten behoeve van de verstrekking op grond van het eerste lid geen andere
      persoonsgegevens dan hij op grond van de [artikelen 86][ref2], [87][ref3], [88][ref4] of [89][ref5] heeft
      verwerkt, waaronder verwerkte gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15, van de Algemene
      verordening gegevensbescherming.

      4 De aan Onze Minister op grond van het eerste lid te verstrekken informatie bevat geen gegevens waarmee hij een
      natuurlijk persoon direct of indirect kan identificeren.

      5 Onze Minister verwerkt geen andere gegevens waarmee hij op basis van de op grond van het eerste lid te
      verstrekken informatie een natuurlijk persoon direct dan wel indirect kan identificeren.


