  - number: 9d
    text: |-
      1 Indien een verzekeringsplichtige aan wie de bestuurlijke boete en de last, bedoeld in [artikel 9c][ref1], is
      opgelegd, niet binnen drie maanden na verzending van de beschikking tot oplegging daarvan alsnog verzekerd is,
      sluit het CAK namens hem een zorgverzekering waarin hij hem verzekert.

      2 Het CAK kiest de zorgverzekeraar waarmee een zorgverzekering als bedoeld in het eerste lid wordt gesloten,
      met dien verstande dat het zorgt voor een spreiding van zorgverzekeringen als bedoeld in dat lid over alle
      zorgverzekeraars, naar evenredigheid van het aantal verzekerden bij iedere zorgverzekeraar.

      3 Indien een zorgverzekeraar verschillende varianten van de zorgverzekering aanbiedt, sluit het CAK een
      zorgverzekering overeenkomstig de variant met de laagste premie, maar zonder vrijwillig eigen risico.

      4 Op de last, bedoeld in [artikel 9c, derde lid][ref2], en op het uitvoeren van de last als bedoeld in het eerste
      lid, is [afdeling 5.3.1 van de Algemene wet bestuursrecht][ref3], met uitzondering van de [artikelen 5:25][ref4] en
      [5:27 tot en met 5:30 van die wet][ref5], van overeenkomstige toepassing.

      5 Degene die op grond van het eerste lid door het CAK verzekerd is, kan de desbetreffende verzekering gedurende een
      periode van twee weken, te rekenen vanaf de datum waarop het CAK hem daarvan mededeling heeft gedaan, vernietigen,
      indien hij jegens het CAK alsmede jegens de zorgverzekeraar bij wie die zorgverzekering is gesloten, aantoont in de
      periode, bedoeld in dat lid, reeds krachtens een andere zorgverzekering verzekerd te zijn geraakt.

      6 In afwijking van [artikel 931 van Boek 7 van het Burgerlijk Wetboek][ref6] is een zorgverzekeraar bevoegd een met
      hem gesloten verzekeringsovereenkomst wegens dwaling te vernietigen, indien achteraf blijkt dat degene die het CAK
      bij hem verzekerde op dat moment niet verzekeringsplichtig was.

      7 Zonodig in afwijking van [artikel 7][ref7], kan, tenzij het derde lid van dat artikel van toepassing is, een
      verzekeringnemer een zorgverzekering als bedoeld in het eerste lid niet opzeggen gedurende de eerste twaalf maanden
      waarover deze loopt.


