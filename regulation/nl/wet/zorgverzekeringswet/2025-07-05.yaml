  - number: '27'
    text: |-
      Een verzekeraar die ten onrechte een verzekering als zorgverzekering aanbiedt of uitvoert, is gehouden de schade
      die een verzekeringsplichtige of degene die hem heeft verzekerd dientengevolge lijdt, te vergoeden.
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel27
  - number: '28'
    text: |-
      1 De statuten van een zorgverzekeraar:

      a. voorzien in toezicht op het beleid van het bestuur en op de algemene gang van zaken in de rechtspersoon en de
      daarmee verbonden onderneming,

      b. bieden waarborgen voor een redelijke mate van invloed van de verzekerden op het beleid, en

      c. sluiten iedere verplichting van de verzekeringnemers, verzekerden, gewezen verzekeringnemers of gewezen
      verzekerden tot het doen van een bijdrage in tekorten van de rechtspersoon uit.

      2 Een waarborg als bedoeld in het eerste lid, onderdeel b, bestaat in ieder geval uit het aan een
      permanente vertegenwoordiging van verzekerden toekennen van het recht om in te stemmen met de in
      [artikel 28a, eerste lid][ref1], bedoelde regeling en het recht om advies uit te brengen over de bij of krachtens
      [artikel 28c][ref2] aangewezen onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel28a
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel28c
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel28
