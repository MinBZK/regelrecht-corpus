    text: |-
      1 Het CAK gebruikt het burgerservicenummer van de in de [artikelen 18c, eerste lid][ref1], en [18e][ref2] bedoelde
      personen, met het doel te waarborgen dat de in het kader van de uitvoering van deze afdeling en [artikel 34a][ref3]
      te verwerken persoonsgegevens op die personen betrekking hebben.

      2 Bij gegevensuitwisseling tussen het CAK en de in de [artikelen 18f][ref4], [88][ref5] en [89][ref6] bedoelde
      personen en instanties wordt, voor de uitvoering van deze afdeling en voor zover die personen en instanties tot
      gebruik van dat nummer bevoegd zijn, het burgerservicenummer gebruikt.

      3 Het CAK is bevoegd tot het verwerken van persoonsgegevens van de in de [artikelen 18c, eerste lid][ref7], en
      [18e][ref8] bedoelde personen, die noodzakelijk zijn voor de uitvoering van deze afdeling en [artikel 34a][ref9].

      4 Het CAK is de verwerkingsverantwoordelijke, voor de verwerking, bedoeld in het derde lid.

      5 Het CAK is bevoegd schulden ter zake van de bestuursrechtelijke premie die hem nog niet zijn voldaan nadat
      [artikel 18d][ref10] of [18e][ref11] niet meer op de verzekeringnemer van toepassing is, kwijt te schelden.

      6 Bij ministeriële regeling worden nadere regels gesteld over de wijze waarop het CAK de bestuursrechtelijke premie
      int en wordt bepaald welk gedeelte van de geïnde bestuursrechtelijke premie door het CAK in ’s Rijks kas wordt
      gestort.


