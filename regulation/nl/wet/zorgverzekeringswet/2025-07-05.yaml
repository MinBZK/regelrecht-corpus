preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat de gehele bevolking onder voor ieder gelijke
    sociale voorwaarden verzekerd is tegen de gevolgen van behoefte aan geneeskundige zorg;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. verzekeraar: een verzekeringsonderneming als bedoeld in de richtlijn solvabiliteit II;

      b. zorgverzekeraar: een verzekeraar, voor zover deze zorgverzekeringen aanbiedt of uitvoert;

      c. verzekeringnemer: een persoon die met een zorgverzekeraar een zorgverzekering heeft gesloten;

      d. zorgverzekering: een tussen een zorgverzekeraar en een verzekeringnemer ten behoeve van een
      verzekeringsplichtige gesloten schadeverzekering, die voldoet aan hetgeen daarover bij of krachtens deze wet is
      geregeld, en waarvan de verzekerde prestaties het bij of krachtens deze wet geregelde niet te boven gaan;

      e. verzekeringsplichtige: degene die op grond van [artikel 2][ref1] verplicht is zich krachtens een zorgverzekering
      te verzekeren of te laten verzekeren;

      f. verzekerde: degene wiens risico van behoefte aan zorg of overige diensten, als bedoeld in [artikel 10][ref2],
      door een zorgverzekering wordt gedekt;

      g. verplicht eigen risico: een bedrag aan kosten van zorg of overige diensten als bedoeld bij of krachtens
      [artikel 11][ref3], dat voor rekening van de verzekerde blijft;

      h. vrijwillig eigen risico: een door de verzekeringnemer met de zorgverzekeraar als onderdeel van de
      zorgverzekering overeengekomen bedrag aan kosten van zorg of overige diensten als bedoeld bij of krachtens
      [artikel 11][ref4], dat de verzekerde voor zijn rekening zal nemen;

      i. zorgpolis: de akte waarin de tussen een verzekeringnemer en een zorgverzekeraar gesloten zorgverzekering is
      vastgelegd;

      j. modelovereenkomst: model van een zorgverzekering, waarin een overzicht wordt gegeven van de rechten en plichten
      die de verzekeringnemer, de verzekerde en de zorgverzekeraar jegens elkaar zullen hebben indien een overeenkomst
      volgens het desbetreffende model wordt gesloten;

      k. Zvw-pgb: een gemaximeerde vergoeding voor de kosten die de verzekerde maakt voor het betrekken van zorg of een
      andere dienst;

      l. inhoudingsplichtige: de inhoudingsplichtige in de zin van de [Wet op de loonbelasting 1964][ref5] dan wel de
      werkgever in de zin van de [Wet financiering sociale verzekeringen][ref6];

      m. instelling:

      1°. een organisatorisch verband dat zorg of een andere dienst verleent waarop aanspraak bestaat ingevolge een
      zorgverzekering of ingevolge [artikel 3.1.1 van de Wet langdurige zorg][ref7];

      2°. een organisatorisch verband dat gevestigd is buiten het grondgebied van het Europese deel van Nederland
      en overeenkomstig de daar geldende wetgeving rechtmatig gezondheidszorg verstrekt als bedoeld bij en krachtens
      [artikel 11][ref8];

      n. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      o. zorgautoriteit: de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref9];

      p. Zorginstituut: het Zorginstituut Nederland, genoemd in [artikel 58, eerste lid][ref10];

      q. Zorgverzekeringsfonds: het fonds, genoemd in [artikel 39][ref11];

      r. richtlijn solvabiliteit II: richtlijn 2009/138/EG van het Europees Parlement en de Raad van 25 november 2009
      betreffende de toegang tot en uitoefening van het verzekerings- en het herverzekeringsbedrijf (Solvabiliteit II)
      (PbEU 2009, L 335);

      s. Wlz-uitvoerder: de rechtspersoon, bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref12];

      t. loontijdvak: het loontijdvak, bedoeld in
      [artikel 25, eerste en vierde lid, van de Wet op de loonbelasting 1964][ref13];

      u. inspecteur: de functionaris van de rijksbelastingdienst die als zodanig bij regeling van Onze Minister van
      Financiën is aangewezen;

      v. burgerservicenummer: het nummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref14];

      w. premie: de premie, bedoeld in [afdeling 3.3.1][ref15];

      x. bestuursrechtelijke premie: de premie, bedoeld in de [artikelen 18d][ref16] en [18e][ref17];

      y. Sociale verzekeringsbank: Sociale verzekeringsbank, bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref18];

      z.

      aa.

      bb. het CAK: het CAK, genoemd in [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref19].


