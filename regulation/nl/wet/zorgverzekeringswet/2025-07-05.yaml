  - number: 18f
    text: |-
      1 Het CAK heft en int de bestuursrechtelijke premie.

      2 In opdracht van het CAK houdt de inhoudingsplichtige de bestuursrechtelijke premie geheel of voor een
      door het CAK te bepalen gedeelte in op door hem aan de verzekeringnemer verschuldigd loon als bedoeld in de
      [Wet op de loonbelasting 1964][ref1], waarna hij het ingehouden bedrag aan het CAK afdraagt.

      3 De inhouding geschiedt onmiddellijk nadat de krachtens een ander wettelijk voorschrift of krachtens een
      arbeidsovereenkomst verplicht in te houden belastingen, premies of andere bijdragen zijn ingehouden, met dien
      verstande dat bij ministeriële regeling op socialezekerheidsuitkeringen te verrichten inhoudingen of verrekeningen
      kunnen worden aangewezen waarvoor een andere volgorde geldt.

      4 Een inhoudingsplichtige die het door het CAK aan te geven bedrag niet of niet geheel heeft ingehouden,
      is gehouden het gehele bedrag aan het CAK af te dragen, zonder dat het niet ingehouden bedrag alsnog op de
      verzekeringnemer kan worden verhaald.

      5 Indien op loon waarop bestuursrechtelijke premie is ingehouden tevens derdenbeslag ligt, is het bedrag dat de
      inhoudingsplichtige ten minste aan de verzekeringnemer uitbetaalt gelijk aan de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref2], verminderd met het in
      opdracht van het CAK ingehouden bedrag.

      6 In opdracht van het CAK wordt een aan de verzekeringnemer of zijn partner uit te betalen
      zorgtoeslag als bedoeld in de [Wet op de zorgtoeslag][ref3] of een voorschot daarop, in afwijking van
      [artikel 25, eerste lid, van de Algemene wet inkomensafhankelijke regelingen][ref4], als tegemoetkoming in de
      bestuursrechtelijke premie aan het CAK uitbetaald.

      7 Het CAK kan de bestuursrechtelijke premie of het door de werkgever af te dragen bedrag, bedoeld in het vierde
      lid, bij dwangbevel invorderen.

      8 Het CAK heeft terzake van de bestuursrechtelijke premie die op andere wijze dan bij wege van inhouding wordt
      geïnd, een voorrecht op alle goederen van de verzekeringnemer, welk voorrecht onmiddellijk na het voorrecht,
      bedoeld in [artikel 21 van de Invorderingswet 1990][ref5], kan worden uitgeoefend.

      9 Indien het CAK ter zake van de inning van de bestuursrechtelijke premie beslag laat leggen onder een
      derde die de verzekeringnemer periodieke betalingen, niet zijnde periodieke betalingen ter zake van
      het levensonderhoud van diens kinderen, verschuldigd is, is de derde-beslagene vanaf de dag van het
      beslag verplicht om, zolang het CAK dit verlangt, het door het CAK aangegeven achterstallige bedrag
      en telkens de nieuw vervallende termijnen van de bestuursrechtelijke premie of door het CAK te bepalen
      gedeelten daarvan, tot welker verhaal het beslag is gelegd, met inachtneming van het bepaalde in
      [artikel 478, eerste en tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref6], aan het CAK uit te
      betalen, tenzij onder hem beslag gelegd mocht worden wegens vorderingen van hogere of gelijke rang.

      10 Indien een beslag als bedoeld in het negende lid is gelegd op een vordering tot een periodieke betaling als
      bedoeld in [artikel 475c van het Wetboek van Burgerlijke Rechtsvordering][ref7], wordt de beslagvrije voet,
      berekend overeenkomstig de [artikelen 475d tot en met 475e van die wet][ref8], louter ten aanzien van de vordering
      van het CAK ter zake waarvan het beslag is gelegd en enkel voor zover het beslag dient tot inning van een nieuw
      vervallende termijn als bedoeld in het negende lid, verlaagd met de bestuursrechtelijke premie.

      11 De derde die meer aan het CAK heeft betaald dan waarop deze recht heeft, is jegens de verzekeringnemer bevrijd,
      voor zover dat voortvloeit uit [artikel 34 van Boek 6 van het Burgerlijk Wetboek][ref9].


