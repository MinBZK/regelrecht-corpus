  - number: '74'
    text: |-
      1 Het Zorginstituut zendt jaarlijks voor 31 december aan Onze Minister met betrekking tot het Zorgverzekeringsfonds
      een jaarrekening over het afgelopen kalenderjaar, alsmede het verslag van bevindingen, bedoeld in het vijfde lid.

      2 Het Zorginstituut legt in de jaarrekening, die zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] wordt ingericht, rekening en verantwoording af over:

      a. de baten en lasten van het Zorgverzekeringsfonds,

      b. de rechtmatigheid en doelmatigheid van het beheer van het Zorgverzekeringsfonds,

      c. de toestand van het Zorgverzekeringsfonds per 31 december van het voorafgaande kalenderjaar.

      3 De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een accountant als
      bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref2], die bereid is Onze Minister desgevraagd
      inzicht te geven in zijn controlewerkzaamheden.

      4 De verklaring heeft mede betrekking op de rechtmatige verkrijging en besteding van de middelen van het
      Zorgverzekeringsfonds.

      5 De accountant voegt bij de verklaring een verslag van zijn bevindingen over de vraag of het beheer en de
      organisatie voldoen aan eisen van rechtmatigheid, ordelijkheid, controleerbaarheid en doelmatigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
