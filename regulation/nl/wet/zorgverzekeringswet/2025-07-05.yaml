  - number: '66'
    text: |-
      1 Het Zorginstituut rapporteert Onze Minister desgevraagd over voorgenomen beleid inzake aard, inhoud en omvang van
      de prestaties, bedoeld in [artikel 11][ref1].

      2 Het Zorginstituut signaleert gevraagd en ongevraagd aan Onze Minister feitelijke ontwikkelingen die aanleiding
      kunnen geven tot wijzigingen van de aard, inhoud en omvang van de prestaties, bedoeld in [artikel 11][ref2].

      3 Het Zorginstituut signaleert gevraagd en ongevraagd aan Onze Minister feitelijke ontwikkelingen op het gebied van
      kosten van zorg die behoort tot de te verzekeren prestaties voor de zorgverzekering.


