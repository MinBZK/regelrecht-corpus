      1 Krachtens de zorgverzekering is de verzekeringnemer premie verschuldigd.

      2 In afwijking van [artikel 925 van Boek 7 van het Burgerlijk Wetboek][ref1] en van het eerste lid:

      a. is geen premie verschuldigd tot de eerste dag van de kalendermaand volgende op de kalendermaand waarin een
      verzekerde de leeftijd van achttien jaren heeft bereikt;

      b. is geen premie verschuldigd over de periode, bedoeld in [artikel 18d][ref2] of [18e][ref3].


