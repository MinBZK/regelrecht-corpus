  - number: '32'
    text: |-
      1 Het Zorginstituut kent een zorgverzekeraar die voldaan heeft aan zijn verplichtingen, bedoeld in
      [artikel 25][ref1], voor ieder kalenderjaar waarin hij zorgverzekeringen aanbiedt en uitvoert een
      vereveningsbijdrage toe.

      2 Bij algemene maatregel van bestuur worden regels omtrent de berekening van de vereveningsbijdragen gesteld.

      3 De regels, bedoeld in het tweede lid, bepalen ten minste dat de hoogte van de vereveningsbijdrage wordt berekend
      op basis van bij die maatregel te bepalen, voor alle zorgverzekeraars gelijke criteria, waaronder in ieder geval
      het aantal verzekerden bij een zorgverzekeraar en een aantal verzekerdenkenmerken.

      4 Bij ministeriële regeling:

      a. wordt voor 1 oktober van ieder jaar bepaald welk bedrag in totaal voor het daaropvolgende kalenderjaar aan de
      zorgverzekeraars kan worden toegekend;

      b. kan worden bepaald dat in aanvulling op de criteria, bedoeld in het derde lid, voor de berekening van de
      hoogte van de vereveningsbijdragen eenmalig rekening wordt gehouden met een bij die regeling te bepalen, voor alle
      zorgverzekeraars gelijk criterium;

      c. wordt statistisch onderbouwd aan elk criterium als bedoeld in het derde lid of aan een criterium als bedoeld in
      onderdeel b een bijdrage gekoppeld;

      d. worden nadere regels omtrent de berekening van de vereveningsbijdragen gesteld en wordt geregeld hoe de op grond
      van het eerste lid toegekende vereveningsbijdragen door het Zorginstituut worden betaald.

      5 Het Zorginstituut stelt jaarlijks voor 15 oktober beleidsregels vast waarin wordt aangegeven op welke wijze
      toepassing wordt gegeven aan de in het vierde lid bedoelde regels.

      6 De toekenning, bedoeld in het eerste lid, geschiedt voor 1 november van het jaar voorafgaande aan het jaar
      waarvoor de vereveningsbijdrage wordt gegeven.

      7 De beleidsregels, bedoeld in het vijfde lid, behoeven de goedkeuring van Onze Minister.

      8 Onze Minister verwerkt de persoonsgegevens waaronder gegevens over gezondheid als bedoeld in artikel 4, onderdeel
      15, van de Algemene verordening gegevensbescherming, die noodzakelijk zijn voor:

      a. de bepaling van de criteria, bedoeld in het derde lid of het criterium, bedoeld in het vierde lid, onderdeel
      b, of

      b. de statistische onderbouwing van de aan de criteria krachtens het vierde lid, onderdeel c, gekoppelde bijdragen.

      9 Onze Minister verwerkt op grond van het achtste lid slechts persoonsgegevens indien daarop pseudonimisering
      als bedoeld in artikel 4, onderdeel 5 van de Algemene verordening gegevensbescherming is toegepast en vervolgens
      onafgebroken is gecontinueerd.

      10 Artikel 21, eerste lid, tweede volzin, van de Algemene verordening gegevensbescherming, is bij de verwerking
      door Onze Minister niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel25
