  - number: '70'
    text: |-
      1 Het CAK opent voor iedere gemoedsbezwaarde, bedoeld in [artikel 2, tweede lid, onderdeel b][ref1], een
      rekening, waarop de geheven inkomensafhankelijke bijdrage, bedoeld in [artikel 42, achtste lid][ref2], en de
      bijdragevervangende belasting, bedoeld in [artikel 57, eerste lid, worden gestort][ref3].

      2 In afwijking van het eerste lid opent of houdt het CAK één rekening in stand indien twee of meer
      gemoedsbezwaarden als bedoeld in [artikel 2, tweede lid, onderdeel b][ref4], een gezamenlijke huishouding voeren,
      en worden op die rekening de bijdragen en belastingen van ieder van deze gemoedsbezwaarden gestort.

      3 Tot de rekening is geen ander begunstigd dan het CAK.

      4 Het saldo wordt door het CAK gebruikt voor het doen van:

      a. uitkeringen ter vergoeding van kosten van zorg of overige diensten als bedoeld in [artikel 11][ref5], voor
      zover deze zijn verleend aan een gemoedsbezwaarde voor wie de rekening in stand wordt gehouden, of aan een tot zijn
      huishouding behorend kind, jonger dan achttien jaar;

      b. uitkeringen als bedoeld in [artikel 39, tweede lid, onderdeel d][ref6].

      5 Uitkeringen als bedoeld in het vierde lid, onderdeel a, worden slechts op verzoek van een gemoedsbezwaarde voor
      wie de rekening in stand wordt gehouden, gedaan.

      6 De kosten van zorg of overige diensten worden niet vergoed voor zover deze voor een verzekerde
      op grond van de regels, gesteld bij of krachtens de algemene maatregel van bestuur, bedoeld in
      [artikel 11, derde of vierde lid][ref7], voor eigen rekening blijven.

      7 Het CAK heft een rekening op indien alle gemoedsbezwaarden voor wie de rekening in stand werd gehouden,
      verzekeringsplichtig zijn geworden dan wel zijn overleden.

      8 Indien een gemoedsbezwaarde een gezamenlijke huishouding is gaan vormen met een andere gemoedsbezwaarde, heft het
      CAK een van de twee rekeningen op, onder overmaking van het saldo naar de overblijvende rekening.

      9 Het CAK zorgt per gemoedsbezwaarde of huishouding, bedoeld in het tweede lid, voor een ordentelijke administratie
      van de stortingen op en de uitkeringen ten laste van de rekening.

      10 Bij ministeriële regeling kunnen ter zake van het bepaalde in het eerste tot en met negende lid nadere regels en
      uitvoeringsregels worden gegeven.

      11 Het CAK is bevoegd de werkzaamheden, bedoeld bij of krachtens het eerste tot en met tiende lid, onder vergoeding
      van de daarmee gepaard gaande kosten, uit te besteden aan een of meer zorgverzekeraars.

      12 Het CAK gebruikt voor de uitvoering van dit artikel het burgerservicenummer van de gemoedsbezwaarde.

      13 Het CAK is bevoegd tot het verwerken van persoonsgegevens van de gemoedsbezwaarde, waaronder gegevens over
      gezondheid, die noodzakelijk zijn voor de uitvoering van dit artikel.

      14 Het CAK is de verwerkingsverantwoordelijke, voor de verwerking, bedoeld in het dertiende lid.


