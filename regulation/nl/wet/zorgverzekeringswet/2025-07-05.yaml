  - number: '50'
    text: |-
      1 De inspecteur verleent bij voor bezwaar vatbare beschikking aan de verzekeringsplichtige een teruggaaf van de
      op het loon ingehouden inkomensafhankelijke bijdrage voor zover het loon van de verzekeringsplichtige waarover
      inkomensafhankelijke bijdrage is geheven hoger is dan het in [artikel 43, derde lid][ref1], bedoelde bedrag.

      2 Een teruggaaf wordt niet verleend indien het met toepassing van het eerste lid berekende bedrag niet meer
      bedraagt dan het in [artikel 9.4, vijfde lid, van de Wet inkomstenbelasting 2001][ref2] genoemde bedrag.

      3 Bij ministeriële regeling worden regels gesteld ter zake van het verlenen van een voorschot op het bij de
      beschikking, bedoeld in het eerste lid, vast te stellen bedrag.

      4 Ingeval een teruggaaf of een voorschot ten onrechte of tot een te hoog bedrag is verleend, kan de inspecteur
      het te veel betaalde bedrag bij voor bezwaar vatbare beschikking terugvorderen. De bevoegdheid tot terugvordering
      vervalt door verloop van vijf jaren na afloop van het kalenderjaar waarop de teruggaaf of het voorschot, bedoeld in
      de eerste volzin, betrekking heeft. Bij de invordering van het ingevolge de eerste volzin terug te vorderen bedrag
      zijn de regels die gelden voor de invordering van inkomstenbelasting van overeenkomstige toepassing.

      5 In afwijking van de [artikelen 30h][ref3] en [30ha van de Algemene wet inzake rijksbelastingen][ref4] wordt bij
      de voor bezwaar vatbare beschikking, bedoeld in het eerste lid, en de voor bezwaar vatbare beschikking, bedoeld in
      het vierde lid, uitsluitend belastingrente vergoed, onderscheidenlijk in rekening gebracht, indien de dagtekening
      van de beschikking ligt na het verstrijken van een periode van zes maanden na afloop van het kalenderjaar waarop
      de bijdrage betrekking heeft. De belastingrente wordt enkelvoudig berekend over het tijdvak dat aanvangt op de dag
      na het verstrijken van een periode van zes maanden na het einde van het kalenderjaar waarop de bijdrage betrekking
      heeft en eindigt 14 dagen na de dagtekening van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel9.4
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel30h
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel30ha
