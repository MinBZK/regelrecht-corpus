  - number: 28a
    text: |-
      1 De zorgverzekeraar stelt een schriftelijke regeling vast waarin wordt bepaald op welke onderdelen van het beleid
      hij zijn verzekerden in de gelegenheid stelt inspraak uit te oefenen. In die regeling wordt tevens bepaald op welke
      wijze de inspraak kan worden verkregen en op welke wijze de verzekerden worden geïnformeerd over de resultaten van
      de inspraak alsmede over hetgeen daarmee is gedaan.

      2 In de regeling worden in elk geval onderdelen aangewezen van het beleid betreffende:

      a. het met zorgaanbieders sluiten van overeenkomsten met betrekking tot de zorg of overige diensten;

      b. de wijze waarop de zorgverzekeraar met zijn verzekerden communiceert.

      3 Bij algemene maatregel van bestuur kunnen in aanvulling op het bepaalde in het tweede lid beleidsterreinen worden
      aangewezen waarvan onderdelen in de regeling moeten worden aangewezen.

      4 De zorgverzekeraar stelt zijn verzekerden in de gelegenheid inspraak uit te oefenen overeenkomstig het bepaalde
      in de regeling, bedoeld in het eerste lid.

      5 De zorgverzekeraar behoeft de instemming van de vertegenwoordiging, bedoeld in [artikel 28, tweede lid][ref1],
      voor de vaststelling, wijziging of intrekking van de regeling. De zorgverzekeraar mag de regeling uitsluitend
      vaststellen zonder instemming van de vertegenwoordiging, indien het onthouden van de instemming door de
      vertegenwoordiging onredelijk is.

      6 De zorgverzekeraar maakt de regeling openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel28
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel28a
