  - number: '88'
    text: |-
      1 Een ieder verstrekt op verzoek aan de zorgverzekeraars, het Zorginstituut, de zorgautoriteit, Onze Minister, de
      rijksbelastingdienst, het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank, het college
      van burgemeester en wethouders, het CAK, of aan een daartoe door of vanwege een van deze zorgverzekeraars of
      instanties aangewezen persoon kosteloos alle inlichtingen en gegevens, waaronder persoonsgegevens als bedoeld in de
      Algemene verordening gegevensbescherming, die noodzakelijk zijn voor de uitvoering van de zorgverzekeringen of van
      deze wet of van [artikel 11g van de Wet kwaliteit, klachten en geschillen zorg][ref1].

      2 De in het eerste lid bedoelde gegevens en inlichtingen worden op verzoek verstrekt in schriftelijke vorm of in
      een andere vorm die redelijkerwijs kan worden verlangd, binnen een termijn die schriftelijk wordt gesteld bij het
      in het eerste lid bedoelde verzoek.

      3 Een ieder geeft op verzoek van een rechtspersoon als bedoeld in het eerste lid, inzage in alle bescheiden en
      andere gegevensdragers, stelt deze op verzoek ter beschikking voor het nemen van afschrift en verleent de terzake
      verlangde medewerking, voor zover dit noodzakelijk is voor de uitvoering van deze wet door de desbetreffende
      zorgverzekeraars of instanties.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste, tweede of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel11g
