    text: |-
      1 De verzekeringnemer is vanaf de eerste dag van de maand volgende op de maand waarin het CAK de melding, bedoeld
      in [artikel 18c][ref1], heeft ontvangen aan het CAK een bij ministeriële regeling te bepalen, bestuursrechtelijke
      premie van ten minste 110% en ten hoogste 130% van de gemiddelde premie verschuldigd.

      2 De premie, bedoeld in het eerste lid, is niet meer verschuldigd met ingang van de eerste dag van de maand
      volgende op de maand waarin:

      a. de uit de zorgverzekering voortvloeiende schulden zijn of zullen zijn afgelost of tenietgaan,

      b. de schuldsaneringsregeling natuurlijke personen, bedoeld in de [Faillissementswet][ref2], op de verzekeringnemer
      van toepassing wordt,

      c. door tussenkomst van een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref3] een overeenkomst als bedoeld in
      [artikel 18c, tweede lid, onderdeel d][ref4], is gesloten, door diens tussenkomst een buitengerechtelijke
      schuldregeling tot stand is gekomen waarin, naast de verzekeringnemer, ten minste zijn zorgverzekeraar deelneemt,
      of de zorgverzekeraar met de verzekeringnemer een betalingsregeling is overeengekomen, of

      d. de verzekeringnemer aan bij ministeriële regeling te bepalen voorwaarden voldoet.

      3 Ten behoeve van de toepassing van het tweede lid stelt de zorgverzekeraar het CAK, de verzekeringnemer en, indien
      deze een ander is dan de verzekeringnemer, de verzekerde, onverwijld op de hoogte van de datum waarop een situatie
      als bedoeld in onderdeel a, b of c van dat lid van toepassing wordt.

      4 In afwijking van het eerste en tweede lid is de verzekeringnemer wederom aan het CAK bestuursrechtelijke premie
      verschuldigd vanaf de eerste dag van de maand volgende op de maand:

      a. waarin de toepassing van de schuldsaneringsregeling natuurlijke personen op grond van
      [artikel 350, derde lid, onderdeel c, d, e, f, of g, van de Faillissementwet][ref5], is beëindigd,

      b. waarin hij zich, blijkens een melding van zijn zorgverzekeraar, aan deelname aan een op hem van toepassing
      zijnde overeenkomst of regeling als bedoeld in het tweede lid, onderdeel c, heeft onttrokken voordat hij de in de
      desbetreffende overeenkomst of regeling neergelegde afspraken jegens zijn zorgverzekeraar volledig is nagekomen of

      c. waarin hij niet meer voldoet aan bij de ministeriële regeling, bedoeld in het tweede lid, te bepalen
      voorwaarden.

      5 Indien in het in het vierde lid, onderdeel b, bedoeld geval een door tussenkomst van een schuldhulpverlener
      als bedoeld in het tweede lid, onderdeel c, tot stand gekomen overeenkomst of regeling betreft, dient de melding,
      bedoeld in dat onderdeel mede door een schuldhulpverlener te zijn ondertekend.

      6 Bij ministeriële regeling wordt bepaald hoe de gemiddelde premie, bedoeld in het eerste lid, wordt berekend.


