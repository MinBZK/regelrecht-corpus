  - number: 73a
    text: |-
      1 Het Zorginstituut zendt jaarlijks voor 15 april aan Onze Minister een verantwoording over de vaststelling van de
      bijdragen, bedoeld in [artikel 34][ref1], verstrekt ten behoeve van het vierde kalenderjaar, voorafgaande aan het
      jaar waarin verantwoording wordt afgelegd, alsmede een assurance report.

      2 Het assurance report geeft aan of het beheer en de organisatie voldoen aan eisen van rechtmatigheid,
      ordelijkheid, controleerbaarheid en doelmatigheid.

      3 Het assurance report wordt opgesteld door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref2], die bereid is Onze Minister desgevraagd inzicht te geven
      in zijn controlewerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
