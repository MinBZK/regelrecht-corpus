  - number: '40'
    text: |-
      1 Het Zorginstituut beheert en administreert afzonderlijk het Zorgverzekeringsfonds.

      2 Het Zorginstituut houdt de financiële middelen die deel uitmaken van het Zorgverzekeringsfonds, in rekening-
      courant bij Onze Minister van Financiën.

      3 Het Zorginstituut kan, voor de uitvoering van zijn wettelijke taken, beschikken over de financiële middelen die
      hij in rekening-courant bij Onze Minister van Financiën aanhoudt.

      4 In afwijking van het tweede lid kan het Zorginstituut een deel van de in dat lid bedoelde financiële middelen
      buiten de in dat lid bedoelde rekening-courant houden.

      5 Onze Minister stelt in overeenstemming met Onze Minister van Financiën, na overleg met het Zorginstituut, de
      omvang van het in het vierde lid bedoelde deel van de financiële middelen vast.

      6 Bij een tekort aan financiële middelen maakt het Zorginstituut uitsluitend gebruik van de kredietfaciliteiten die
      door Onze Minister van Financiën worden verleend.

      7 Onze Minister van Financiën informeert dagelijks het Zorginstituut ten aanzien van de rekening-courant, in elk
      geval met betrekking tot:

      a. de slotstanden per dag;

      b. alle dagelijks geboekte mutaties of transacties in de rekening-courant.

      8 Het Zorginstituut informeert Onze Minister van Financiën ten aanzien van de rekening-courant in elk geval met
      betrekking tot de prognoses van de saldi van de rekening-courant.

      9 Onze Minister van Financiën brengt voor het beheer van de rekening-courant geen kosten in rekening.

      10 Onze Minister stelt in overeenstemming met Onze Minister van Financiën, na overleg met het Zorginstituut,
      regels omtrent de rente die over de saldi van de in het tweede lid bedoelde rekening-courant wordt vergoed
      onderscheidenlijk in rekening wordt gebracht.

      11 Onze Minister kan in overeenstemming met Onze Minister van Financiën, na overleg met het Zorginstituut, regels
      stellen omtrent het tweede, zevende en achtste lid.
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel40
  - number: '41'
    text: De inhoudingsplichtige en de verzekeringsplichtige zijn een inkomensafhankelijke bijdrage verschuldigd.
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel41
  - number: '42'
    text: |-
      1 De inhoudingsplichtige is een inkomensafhankelijke bijdrage verschuldigd over het door hem verstrekte loon
      overeenkomstig de [Wet op de loonbelasting 1964][ref1] uit:

      a. tegenwoordige dienstbetrekking als bedoeld in de [Wet op de loonbelasting 1964][ref2] van de
      verzekeringsplichtige of van degene, bedoeld in [artikel 2, tweede lid, onderdeel b][ref3], van deze wet, met
      uitzondering van:

      1°. de eindheffingsbestanddelen, bedoeld in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref4];

      2°. het in [artikel 13bis van de Wet op de loonbelasting 1964][ref5] bedoelde voordeel, voor zover dit voordeel
      door middel van een aan de werknemer opgelegde naheffingsaanslag in aanmerking is genomen;

      3°. het loon van degene, bedoeld in [artikel 4, onderdeel f, van de Wet op de loonbelasting 1964][ref6];

      4°. het loon van de directeur-grootaandeelhouder, bedoeld in
      [artikel 6, eerste lid, onderdeel d, van de Ziektewet][ref7];

      b. vroegere arbeid als bedoeld in de [Wet op de loonbelasting 1964][ref8] van de verzekeringsplichtige of van
      degene, bedoeld in [artikel 2, tweede lid, onderdeel b][ref9], tot een bij ministeriële regeling te bepalen
      tijdstip, met uitzondering van bij ministeriële regeling aan te wijzen bestanddelen van het loon.

      2 Het loon waarover de inkomensafhankelijke bijdrage ingevolge het eerste lid wordt geheven, wordt ten minste
      gesteld op nihil en wordt bij dezelfde inhoudingsplichtige tot geen hoger bedrag in aanmerking genomen dan het door
      Onze Minister, in overeenstemming met Onze Ministers van Sociale Zaken en Werkgelegenheid en van Financiën, met
      betrekking tot een kalenderjaar vastgestelde bedrag.

      3 Het bedrag, bedoeld in het tweede lid, wordt herleid en vastgesteld voor andere loontijdvakken waarin loon als
      bedoeld in het eerste lid wordt genoten.

      4 Voor de herleiding naar een ander loontijdvak van het bedrag, bedoeld in het derde lid, is
      [artikel 25, eerste en vierde lid, van de Wet op de loonbelasting 1964][ref10] van overeenkomstige toepassing.

      5 De inkomensafhankelijke bijdrage wordt per loontijdvak berekend over het verschil tussen het loon dat de werknemer
      in het kalenderjaar heeft genoten tot en met dat loontijdvak en het loon dat de werknemer in dat kalenderjaar heeft
      genoten tot en met het aan dat loontijdvak voorafgaande loontijdvak, met dien verstande dat van het bij eenzelfde
      inhoudingsplichtige genoten loon buiten aanmerking blijft het gedeelte dat meer bedraagt dan het met toepassing van
      het derde of vierde lid vastgestelde bedrag per loontijdvak, vermenigvuldigd met het aantal loontijdvakken van het
      kalenderjaar. [Artikel 17, derde lid, tweede en derde zin, van de Wet financiering sociale verzekeringen][ref11]
      is van overeenkomstige toepassing op de berekening van de inkomensafhankelijke bijdrage, met dien
      verstande dat wijze van berekenen van de in dat lid bedoelde premies over het deel van het bij
      een werkgever genoten loon, dat betrekking heeft op de betaling van uitkeringen als bedoeld in
      [artikel 40, eerste lid, onderdeel a of b, van die wet][ref12] door een eigenrisicodrager tevens bepalend is voor
      de wijze van berekenen van de inkomensafhankelijk bijdrage over die uitkeringen.

      6 Het tweede, derde en vierde lid zijn niet van toepassing in de gevallen, bedoeld in
      [artikel 26b, eerste volzin, van de Wet op de loonbelasting 1964][ref13].

      7 De inhoudingsplichtige mag de door hem verschuldigde inkomensafhankelijke bijdrage niet verhalen op de
      verzekeringsplichtige of op degene, bedoeld in [artikel 2, tweede lid, onderdeel b][ref14]. Elk beding waarbij van
      de eerste volzin wordt afgeweken, is nietig.

      8 De rijksbelastingdienst stort de inkomensafhankelijke bijdrage die is geheven over het loon van
      degene, bedoeld in [artikel 2, tweede lid, onderdeel b][ref15], van deze wet op de rekening, bedoeld in
      [artikel 70, eerste dan wel tweede lid][ref16].


