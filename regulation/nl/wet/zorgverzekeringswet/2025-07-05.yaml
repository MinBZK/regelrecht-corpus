  - number: '34'
    text: |-
      1 Uiterlijk op 1 april van het vierde jaar volgende op het kalenderjaar waarvoor de bijdragen, bedoeld in
      [artikel 32][ref1] en [33][ref2], zijn toegekend, stelt het Zorginstituut de bijdragen vast.

      2 De vaststelling van een vereveningsbijdrage als bedoeld in [artikel 32][ref3], houdt in ieder geval in een
      herberekening van de vereveningsbijdrage op basis van het werkelijke aantal verzekerden dat de zorgverzekeraar
      in het desbetreffende jaar had en de werkelijke verdeling van de verzekerdenkenmerken als bedoeld in
      [artikel 32, derde lid][ref4], over die verzekerden, voor zover de daartoe benodigde gegevens tijdig bij het
      Zorginstituut zijn aangeleverd.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels omtrent de berekening van de bijdragen
      gesteld.

      4 Het Zorginstituut stelt beleidsregels op waarin wordt aangegeven op welke wijze toepassing wordt gegeven aan de
      in het derde lid bedoelde regels en op welke wijze een vergoeding voor rentekosten wordt verleend respectievelijk
      in rekening wordt gebracht.

      5 Indien de vastgestelde bijdrage hoger is dan de toegekende bijdrage betaalt het Zorginstituut de zorgverzekeraar
      of diens rechtsopvolger het verschil, vermeerderd met de rentekosten, en indien de vastgestelde bijdrage lager
      is dan de toegekende bijdrage vordert het Zorginstituut het verschil, vermeerderd met de rentekosten, van de
      zorgverzekeraar of diens rechtsopvolger terug.

      6 Het Zorginstituut is bevoegd het bedrag dat na toepassing van het eerste en vijfde lid aan de zorgverzekeraar
      dient te worden betaald respectievelijk van de zorgverzekeraar dient te worden teruggevorderd, te verrekenen met
      een toekenning van een bijdrage als bedoeld in [artikel 32][ref5] of [33][ref6] over een later jaar.


