  - number: '56'
    text: |-
      Indien de situatie, bedoeld in [artikel 31, eerste lid][ref1], zich heeft voorgedaan, verstrekt Onze Minister een
      bijdrage aan het Zorgverzekeringsfonds ter hoogte van het verschil tussen het bedrag aan voldane vorderingen, als
      bedoeld in [artikel 31, eerste lid][ref2], en het bedrag dat het Zorginstituut ter zake van de vorderingen, bedoeld
      in [artikel 31, tweede lid][ref3], heeft ontvangen.


