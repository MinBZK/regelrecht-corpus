    text: |-
      Indien een werkgever de verschuldigde premie aan een zorgverzekeraar betaalt, vermelden de zorgverzekeraar en de
      werkgever bij de verstrekking van persoonsgegevens aan elkaar met betrekking tot een werknemer die verzekeringnemer
      en een verzekerde is van een zorgverzekering waarvoor die werkgever de verschuldigde premie aan die zorgverzekeraar
      betaalt, het burgerservicenummer van die werknemer.
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel18
  - number: 18a
    text: |-
      1 Uiterlijk tien werkdagen nadat ten aanzien van een zorgverzekering een achterstand in de betaling van de
      verschuldigde premie ter hoogte van twee maandpremies is geconstateerd, doet de zorgverzekeraar de verzekeringnemer
      een aanbod tot het treffen van een betalingsregeling.

      2 De betalingsregeling bestaat ten minste uit de volgende elementen:

      a. afspraken over de betaling van nieuw vervallende termijnen van de premie,

      b. afspraken inzake de afwikkeling van de uit de zorgverzekering voortvloeiende schulden van de verzekeringnemer
      aan de zorgverzekeraar, inclusief rente en incassokosten, en de termijnen waarbinnen betaling zal plaatsvinden, en

      c. een toezegging van de zorgverzekeraar, inhoudende dat hij de zorgverzekering of de dekking daarvan gedurende
      de looptijd van de betalingsregeling niet om reden van het bestaan van de schulden, bedoeld in onderdeel b, zal
      beëindigen, schorsen of opschorten, zolang de verzekeringnemer de afspraken, bedoeld in de onderdelen a en b,
      nakomt.

      3 Indien de verzekeringnemer een ander heeft verzekerd en ten aan zien van diens verzekering een premie-achterstand
      als bedoeld in het eerste lid is ontstaan, omvat het aanbod, bedoeld in het eerste lid, tevens een bereidverklaring
      opzegging van deze verzekering met ingang van de dag waarop de betalingsregeling van kracht wordt, te aanvaarden,
      mits:

      a. de verzekerde zichzelf uiterlijk met ingang van dezelfde dag krachtens een andere zorgverzekering verzekerd
      heeft, en

      b. deze, indien deze zorgverzekering bij dezelfde zorgverzekeraar is gesloten, terzake van de premie voor deze
      verzekering een volmacht of opdracht als bedoeld in het tweede lid, onderdeel a, heeft gegeven.

      4 Tegelijk met het aanbod deelt de zorgverzekeraar de verzekeringnemer schriftelijk mee dat deze een termijn van
      vier weken heeft om het te aanvaarden, waarbij de verzekeraar bovendien aangeeft wat de gevolgen zullen zijn indien
      het aanbod niet wordt aanvaard en de premieschuld, rente en incassokosten buiten beschouwing gelaten, tot zes of
      meer maandpremies zal zijn opgelopen, en wijst hij de verzekeringnemer op de mogelijkheid van schuldhulpverlening,
      waarbij hij tevens informatie verstrekt over de vormen hiervan en wijze waarop deze kan worden verzocht.

      5 Indien het derde lid van toepassing is, zendt de zorgverzekeraar de verzekerde tegelijk met de verzending van de
      in het eerste tot en met vierde lid bedoelde stukken aan de verzekeringnemer, afschriften van deze stukken.
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel18a
  - number: 18aa
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat in daarbij aan
      te wijzen gevallen een aan de verzekeringnemer of zijn partner uit te betalen zorgtoeslag
      als bedoeld in de [Wet op de zorgtoeslag][ref1] of een voorschot daarop, in afwijking van
      [artikel 25, eerste lid, van de Algemene wet inkomensafhankelijke regelingen][ref2], als tegemoetkoming in de
      premie en, voor zover de zorgtoeslag of het voorschot daarop dan nog toereikend is, het eigen risico, geheel of
      gedeeltelijk, direct of door tussenkomst van het CAK aan de zorgverzekeraar wordt uitbetaald indien ten aanzien
      van een zorgverzekering, rente en incassokosten buiten beschouwing latend, een achterstand in de betaling van de
      verschuldigde premie ter hoogte van drie maandpremies is ontstaan.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018451
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel25
