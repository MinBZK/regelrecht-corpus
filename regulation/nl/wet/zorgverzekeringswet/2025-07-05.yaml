  - number: '48'
    text: De rijksbelastingdienst heft de inkomensafhankelijke bijdrage.
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel48
  - number: '49'
    text: |-
      1 De door de inhoudingsplichtige verschuldigde inkomensafhankelijke bijdrage wordt geheven met overeenkomstige
      toepassing van de voor de heffing van loonbelasting geldende regels.

      2 Voor zover het bijdrage-inkomen bestaat uit loon als bedoeld in [artikel 43, tweede lid, onderdeel a][ref1], dat
      van een inhoudingsplichtige wordt genoten, wordt de inkomensafhankelijke bijdrage bij wijze van inhouding geheven
      met overeenkomstige toepassing van de voor de heffing van loonbelasting geldende regels.

      3 Voor zover het bijdrage-inkomen bestaat uit andere dan de in het tweede lid bedoelde bestanddelen, wordt de
      inkomensafhankelijke bijdrage bij wege van aanslag geheven met overeenkomstige toepassing van de voor de heffing
      van de inkomstenbelasting geldende regels, met uitzondering van [artikel 10a.28 van de Wet inkomstenbelasting 2001]
      (onbekend).

      4 [Artikel 13bis, elfde en vijftiende lid, van de Wet op de loonbelasting 1964][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
