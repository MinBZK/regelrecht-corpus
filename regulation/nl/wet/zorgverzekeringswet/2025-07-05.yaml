  - number: '58'
    text: |-
      1 Er is een Zorginstituut Nederland, dat rechtspersoonlijkheid bezit.

      2 Het Zorginstituut is gevestigd in een door Onze Minister te bepalen plaats.

      3 Het Zorginstituut is belast met de taken die hem bij of krachtens wet of internationale overeenkomst zijn
      opgedragen.

      4 Het Zorginstituut wordt in en buiten rechte vertegenwoordigd door de voorzitter.

      5 De [Kaderwet zelfstandige bestuursorganen][ref1] is op het Zorginstituut van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: 58a
    text: |-
      1 Een besluit van het Zorginstituut om andere werkzaamheden te verrichten dan de uitvoering van taken die hem bij
      of krachtens de wet zijn opgedragen, behoeft de goedkeuring van Onze Minister.

      2 De goedkeuring kan worden onthouden indien de beslissing in strijd is met het recht of met het algemeen
      belang, of indien de uitvoering van de andere werkzaamheden een goede taakuitoefening door het Zorginstituut kan
      belemmeren.

      3 Onze Minister kan bij de goedkeuring verplichtingen opleggen in verband met de uitvoering van andere
      werkzaamheden als bedoeld in het eerste lid.

      4 Onze Minister kan bepalen dat de uitvoering van andere werkzaamheden als bedoeld in het eerste lid door het
      Zorginstituut wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel58a
  - number: '59'
    text: |-
      1 Het Zorginstituut bestaat uit ten hoogste drie leden, onder wie de voorzitter.

      2 Benoeming vindt plaats op grond van de deskundigheid die nodig is voor de uitoefening van de taken van het
      Zorginstituut alsmede op grond van maatschappelijke kennis en ervaring.

      3 De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier
      jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel59
  - number: 59a
    text: |-
      1 Het Zorginstituut heeft een commissie die rapporten of signalen als bedoeld in [artikel 66][ref1] voorbereidt.

      2 De commissie bestaat uit een oneven aantal van ten hoogste negen leden die worden benoemd, geschorst en ontslagen
      door het Zorginstituut.

      3 De leden maken op persoonlijke titel deel uit van de commissie.

      4 De benoeming van de leden van de commissie vindt plaats op grond van de deskundigheid die nodig is voor de
      uitoefening van de taken van de commissie en op grond van maatschappelijke kennis en ervaring.

      5 De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan eenmaal en voor ten hoogste vier jaar
      plaatsvinden.

      6 Het lidmaatschap eindigt tussentijds door overlijden, ontslag op eigen verzoek of ontslag om zwaarwichtige
      redenen door het Zorginstituut.

      7 Bij ministeriële regeling worden de vergoeding van reis- en verblijfkosten en verdere vergoedingen aan de leden
      van de commissie vastgesteld.

      8 Het lidmaatschap van de commissie, bedoeld in het eerste lid, is onverenigbaar met het lidmaatschap van het
      Zorginstituut en van de commissie, bedoeld in [artikel 59b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel59b
