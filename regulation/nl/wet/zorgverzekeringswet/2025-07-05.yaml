  - number: '93'
    text: |-
      1 Het is een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten enige
      taak vervult of heeft vervuld, verboden van vertrouwelijke gegevens of inlichtingen die ingevolge deze wet dan wel
      ingevolge [titel 5.2 van de Algemene wet bestuursrecht][ref1] zijn verstrekt of verkregen of van De Nederlandsche
      Bank N.V. of de Stichting Autoriteit Financiële Markten zijn ontvangen, verder of anders gebruik te maken of
      daaraan verder of anders bekendheid te geven dan voor de uitvoering van zijn taak of bij of krachtens deze wet
      wordt geëist.

      2 In afwijking van het eerste lid kunnen de zorgautoriteit, het CAK en het Zorginstituut met gebruikmaking
      van vertrouwelijke gegevens of inlichtingen verkregen bij de uitvoering van hun taken op grond van deze wet,
      mededelingen doen, indien deze niet kunnen worden herleid tot afzonderlijke personen of ondernemingen.

      3 In afwijking van het eerste lid en in overeenstemming met
      [artikel 1:89 van de Wet op het financieel toezicht][ref2] zijn de zorgautoriteit, het CAK, het Zorginstituut,
      De Nederlandsche Bank N.V. en de Stichting Autoriteit Financiële Markten, voor zover dat voor hun taakuitoefening
      noodzakelijk is, bevoegd aan elkaar en aan Onze Minister vertrouwelijke gegevens of inlichtingen omtrent
      afzonderlijke verzekeraars te verschaffen.

      4 Het eerste lid laat, ten aanzien van degene op wie dat lid van toepassing is, onverlet:

      a. de toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref3] welke betrekking hebben op het
      als getuige of deskundige in strafzaken afleggen van een verklaring omtrent gegevens of inlichtingen verkregen bij
      de vervulling van de ingevolge deze wet opgedragen taak;

      b. de toepasselijkheid van de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref4] en van
      [artikel 66 van de Faillissementswet][ref5] welke betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring omtrent gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak, voor zover het gaat om
      gegevens of inlichtingen omtrent een verzekeraar die in staat van faillissement is verklaard of op grond van een
      rechterlijke uitspraak is ontbonden;

      c. de bevoegdheden van de Algemene Rekenkamer ingevolge [artikel 7.34 van de Comptabiliteitswet 2016][ref6], voor
      zover deze niet bij [artikel 121][ref7] zijn beperkt.

      5 Het vierde lid, onderdeel b, geldt niet voor gegevens of inlichtingen die betrekking hebben op verzekeraars die
      betrokken zijn of zijn geweest bij een poging de desbetreffende verzekeraar in staat te stellen zijn bedrijf voort
      te zetten.

      6 De Algemene Rekenkamer is bij het doen van mededelingen als bedoeld in [artikelen 7.30][ref8],
      [7.34, negende lid][ref9] en [7.39 van de Comptabiliteitswet 2016][ref10], verplicht tot geheimhouding, voor zover
      het betreft gegevens en inlichtingen die haar ingevolge het vierde lid, onderdeel c, bekend zijn geworden.


