    text: |-
      1 De rijksbelastingdienst vordert de inkomensafhankelijke bijdrage in.

      2 Bij de invordering van de bijdrage zijn, naar gelang [artikel 49, eerste of tweede, dan wel derde lid][ref1], van
      toepassing is, de regels geldende voor de invordering van loonbelasting, onderscheidenlijk de inkomstenbelasting
      van overeenkomstige toepassing.


