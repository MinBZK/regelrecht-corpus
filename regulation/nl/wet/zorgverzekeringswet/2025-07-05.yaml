      1 De zorgverzekeraar zorgt ervoor dat zijn verzekeringnemers en verzekerden geschillen over de uitvoering van de
      zorgverzekering kunnen voorleggen aan een onafhankelijke instantie.

      2 De onafhankelijke instantie neemt een geschil slechts in behandeling nadat de verzekeringnemer of de verzekerde
      de zorgverzekeraar heeft verzocht zijn beslissing te heroverwegen, en deze niet binnen redelijke termijn of niet
      naar tevredenheid van de verzekeringnemer of verzekerde heeft gereageerd.

      3 De onafhankelijke instantie vraagt advies aan het Zorginstituut indien het geschil betrekking heeft op de zorg of
      de overige diensten, bedoeld in [artikel 11][ref1], dan wel de vergoeding van die zorg of diensten.

      4 Het Zorginstituut zendt zijn advies binnen vier weken na ontvangst van de adviesaanvraag aan de onafhankelijke
      instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
