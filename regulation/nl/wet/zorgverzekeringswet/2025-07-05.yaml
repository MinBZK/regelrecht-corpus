        paragraaf: '4.1'
  - number: 28b
    text: |-
      1 De vertegenwoordiging, bedoeld in [artikel 28, tweede lid][ref1], bestaat uitsluitend uit verzekerden
      van de zorgverzekeraar of, indien de zorgverzekeraar deel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2], uit vertegenwoordigers van de verzekerden van alle
      betrokken zorgverzekeraars van de groep.

      2 De zorgverzekeraar kent de rechten, genoemd in [artikel 28, tweede lid][ref3], uitsluitend toe aan een
      vertegenwoordiging waarvoor statutair is geregeld dat zij voor zover mogelijk zodanig is samengesteld dat:

      a. zij wat betreft in ieder geval leeftijd, woonplaats en opleiding een goede afspiegeling is van de verzekerden en
      dat de samenstelling aansluit bij de verscheidenheid van de verzekerden;

      b. zij redelijkerwijs de diverse belangen van de verzekerden kan behartigen, en

      c. indien de vertegenwoordiging verzekerden vertegenwoordigt van zorgverzekeraars die tot eenzelfde groep als
      bedoeld in [artikel 24b, van Boek 2 van het Burgerlijk Wetboek][ref4] behoren, sprake is van een evenwichtige
      verdeling van het aantal vertegenwoordigers van de verzekerden van elk van de betrokken zorgverzekeraars.

      3 De zorgverzekeraar bepaalt in zijn statuten het aantal leden waaruit de vertegenwoordiging ten minste moet
      bestaan alsmede de wijze van benoeming van die leden, waarbij wordt bepaald dat elke verzekerde van 18 jaar of
      ouder in de gelegenheid wordt gesteld zich kandidaat te stellen.

      4 De vertegenwoordiging zorgt voor:

      a. het regelmatig inventariseren van de wensen en meningen van de betrokken verzekerden; en

      b. het informeren van de betrokken verzekerden over zijn werkzaamheden en de resultaten daarvan.

      5 De zorgverzekeraar draagt er zorg voor dat:

      a. een vacature voor de vertegenwoordiging openbaar wordt gemaakt;

      b. de vertegenwoordiging gebruik kan maken van de voorzieningen die zij redelijkerwijs nodig heeft voor de
      vervulling van haar werkzaamheden, en

      c. wordt voorzien in de kosten die redelijkerwijs noodzakelijk zijn voor de vervulling van de werkzaamheden van de
      vertegenwoordiging, waaronder de kosten die verband houden met scholing, onafhankelijke ondersteuning en het voeren
      van rechtsgedingen.

      6 De zorgverzekeraar verstrekt de vertegenwoordiging tijdig en desgevraagd schriftelijk alle inlichtingen en
      gegevens die zij voor de vervulling van haar werkzaamheden redelijkerwijs nodig heeft.

      7 De zorgverzekeraar verleent de vertegenwoordiging desgevraagd hulp bij de uitvoering van het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel28
