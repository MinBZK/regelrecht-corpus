      2 De Adviescommissie Kwaliteit bestaat uit een oneven aantal van ten hoogste vijftien leden die worden benoemd,
      geschorst en ontslagen door het Zorginstituut.

      3 [Artikel 59a, derde tot en met achtste lid][ref1], zijn van overeenkomstige toepassing.


