  - number: '72'
    text: |-
      1 Onze Minister stelt jaarlijks voor 1 december het budget voor de beheerskosten van het Zorginstituut voor het
      volgende kalenderjaar vast.

      2 Onze Minister kan besluiten het budget voor de beheerskosten van het Zorginstituut te wijzigen.

      3 Het Zorginstituut gaat met betrekking tot de beheerskosten geen verplichtingen aan en doet geen uitgaven die
      leiden tot overschrijding van het vastgestelde budget voor de beheerskosten.

      4 Indien het budget voor de beheerskosten niet is vastgesteld voor 1 januari van het kalenderjaar waarop de
      begroting betrekking heeft, is het Zorginstituut bevoegd, teneinde zijn activiteiten gaande te houden, te
      beschikken over ten hoogste een derde gedeelte van het budget dat laatstelijk voor hem voor een geheel jaar is
      vastgesteld.

      5 Onze Minister kan besluiten dat het Zorginstituut in een geval als bedoeld in het vierde lid, kan beschikken over
      meer dan een derde gedeelte van het budget dat laatstelijk voor hem voor een geheel jaar is vastgesteld.

      6 Het door Onze Minister vastgestelde budget voor de beheerskosten van het Zorginstituut wordt gedekt uit ’s Rijks
      kas.
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel72
  - number: '73'
    text: |-
      1 De in [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref1] bedoelde begroting heeft betrekking op de
      beheerskosten van het Zorginstituut.

      2 De in [artikel 34 van de Kaderwet zelfstandige bestuursorganen][ref2] bedoelde jaarrekening van het Zorginstituut
      heeft betrekking op de beheerskosten van het Zorginstituut.

      3 De accountant doet verslag van zijn bevindingen over de vraag of het beheer en de organisatie van het
      Zorginstituut voldoen aan de eisen van rechtmatigheid, ordelijkheid en controleerbaarheid.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel34
