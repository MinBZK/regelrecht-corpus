  - number: '31'
    text: |-
      1 Indien een voormalige zorgverzekeraar failliet is verklaard, voldoet het Zorginstituut aan de verzekerden jegens
      die zorgverzekeraar of voormalige zorgverzekeraar bestaande vorderingen ter zake van een recht op vergoeding als
      bedoeld in [artikel 11, eerste lid, onderdeel b][ref1], of [artikel 13][ref2].

      2 De vorderingen, bedoeld in het eerste lid, gaan bij wijze van subrogatie op het Zorginstituut over voor zover dat
      instituut deze heeft voldaan.

      3 Het Rijk is tegenover het Zorginstituut aansprakelijk voor de betalingen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
