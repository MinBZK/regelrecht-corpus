    text: |-
      1 Degene die een zorgverzekering wenst te sluiten, vermeldt bij het verzoek daartoe het burgerservicenummer van de
      te verzekeren persoon, indien deze persoon daarover beschikt.

      2 De zorgverzekeraar stelt, voor zover dat redelijkerwijs nodig is voor de uitvoering van de zorgverzekering en van
      deze wet, de identiteit van de te verzekeren persoon vast.

      3 De in het tweede lid bedoelde vaststelling geschiedt aan de hand van documenten als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1], die de verzekeringnemer of de te verzekeren persoon hem
      desgevraagd ter inzage geeft.

      4 De zorgverzekeraar neemt aard en nummer van de in het derde lid bedoelde documenten in zijn administratie op.

      5 De zorgverzekeraar verlangt van de vreemdeling, bedoeld in de [Vreemdelingenwet 2000][ref2], voor wie hem
      wordt verzocht een zorgverzekering te sluiten, een kopie van het document of de schriftelijke verklaring,
      bedoeld in [artikel 9, eerste lid, van die wet][ref3], dat wordt aangemerkt als een bescheid als bedoeld in
      [artikel 4:3, tweede lid, van de Algemene wet bestuursrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
