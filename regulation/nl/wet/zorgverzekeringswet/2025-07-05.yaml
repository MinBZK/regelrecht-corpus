    text: |-
      1 Het CAK, het Zorginstituut en de zorgautoriteit verstrekken Onze Minister uit eigen beweging inlichtingen over
      ontwikkelingen die ertoe leiden of kunnen leiden dat ten behoeve van verzekerden niet vrij kan worden gekozen
      tussen zorgverzekeraars en de door hen aangeboden varianten van de zorgverzekering of die een rechtmatige en
      volledige uitvoering van zorgverzekeringen jegens de verzekeringnemers of verzekerden in gevaar kunnen brengen.

      2 Het Zorginstituut en de zorgautoriteit verstrekken desgevraagd aan het het College sanering, bedoeld in de
      [Wet toelating zorginstellingen][ref1], de voor de uitoefening van hun taak benodigde inlichtingen en gegevens.

      3 Het Zorginstituut en de zorgautoriteit verlenen aan door een bestuursorgaan, bedoeld in het tweede lid,
      aangewezen personen toegang tot en inzage in zakelijke gegevens en bescheiden, voor zover dat voor de vervulling
      van hun taak redelijkerwijs nodig is.


