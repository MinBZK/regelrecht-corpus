      1 Gedurende de eerste twaalf maanden waarover een verzekering als bedoeld in [artikel 9d][ref1] loopt, is de
      verzekeringnemer vanaf de eerste dag van de kalendermaand volgende op de maand waarin hij de leeftijd van achttien
      jaren heeft bereikt aan het CAK een bestuursrechtelijke premie verschuldigd.

      2 De hoogte van de bestuursrechtelijke premie wordt bij ministeriële regeling vastgesteld op een percentage van de
      gemiddelde premie.

      3 [Artikel 18d, zesde lid][ref2], is van toepassing.


