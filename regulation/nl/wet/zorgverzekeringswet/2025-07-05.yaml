  - number: 18c
    text: |-
      1 Indien ten aanzien van een zorgverzekering, rente en incassokosten buiten beschouwing latend, een premieschuld
      ter hoogte van zes of meer maandpremies is ontstaan, meldt de zorgverzekeraar dit, onder vermelding van de voor
      de heffing van de bestuursrechtelijke premie alsmede voor de uitvoering van [artikel 34a][ref1] noodzakelijke
      persoonsgegevens van de verzekeringnemer en de verzekerde, aan het CAK, de verzekeringnemer en, indien deze een
      ander is dan de verzekeringnemer, aan de verzekerde.

      2 De melding geschiedt niet:

      a. in geval van tijdige betwisting als bedoeld in [artikel 18b, eerste lid][ref2], zolang de zorgverzekeraar zijn
      standpunt dienaangaande niet aan de verzekeringnemer en, indien dit een ander dan de verzekeringnemer is, aan de
      verzekerde heeft kenbaar gemaakt;

      b. gedurende de termijn, genoemd in [artikel 18b, tweede lid][ref3];

      c. ingeval van tijdige voorlegging van het geschil aan een onafhankelijke instantie of aan de burgerlijke rechter
      als bedoeld in [artikel 18b, tweede lid][ref4], zolang op het geschil niet onherroepelijk is beslist;

      d. ingeval de verzekeringnemer zich heeft aangemeld bij een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref5] en aantoont dat hij in het kader daarvan een schriftelijke
      overeenkomst tot stabilisatie van zijn schulden heeft gesloten;

      e. ingeval het adres van de verzekeringnemer en, indien dit een ander is dan de verzekeringnemer, de verzekerde,
      niet in de basisregistratie personen voorkomt of het adres zoals dat is opgenomen in de administratie van de
      zorgverzekeraar afwijkt van het adres waaronder deze persoon of personen in de basisregistratie personen als
      ingezetene staat of staan ingeschreven, tenzij deze afwijking het gevolg is van een omstandigheid als bedoeld in
      [artikel 4a, derde lid, onderdeel a tot en met c][ref6].

      3 Onderdeel van de melding vormt een verklaring van de zorgverzekeraar, inhoudende dat hij [artikel 18b][ref7] en
      het tweede lid in acht heeft genomen.

      4 Na de melding verleent de zorgverzekeraar aantoonbaar voldoende medewerking aan activiteiten van de
      verzekeringnemer of derden, gericht op aflossing van de jegens de zorgverzekeraar bestaande, uit de zorgverzekering
      voortvloeiende schuld.

      5 Bij ministeriële regeling wordt bepaald wanneer sprake is van het verrichten van aantoonbaar voldoende
      medewerking als bedoeld in het vierde lid.


