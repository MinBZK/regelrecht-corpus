      1 Het Zorginstituut stelt een bestuursreglement vast.

      2 Vergaderingen van het Zorginstituut zijn niet openbaar, behoudens voor zover in het bestuursreglement anders
      is bepaald.

      3 In het bestuursreglement legt het Zorginstituut in ieder geval vast hoe hij voldoet aan de verplichting ingevolge
      [artikel 3:2 van de Algemene wet bestuursrecht][ref1].


