        artikel: '925'
  - number: '69'
    text: |-
      1 In het buitenland wonende personen die met toepassing van een verordening van het Europees Parlement en de Raad
      van de Europese Unie dan wel toepassing van zodanige verordening krachtens de overeenkomst betreffende de Europese
      Economische Ruimte of een verdrag inzake sociale zekerheid in geval van behoefte aan zorg recht hebben op zorg of
      vergoeding van de kosten daarvan, zoals voorzien in de wetgeving over de verzekering voor zorg van hun woonland,
      melden zich, tenzij zij op grond van deze wet verzekeringsplichtig zijn, bij het CAK aan.

      2 De personen, bedoeld in het eerste, vijftiende en zestiende lid, zijn een bij ministeriële regeling te bepalen
      bijdrage verschuldigd.

      3 Bij de vaststelling van de bijdrage, bedoeld in het tweede lid, wordt rekening gehouden met een bij ministeriële
      regeling te bepalen verhouding tussen de gemiddelde uitgaven voor zorg voor een persoon in het woonland van de
      rechthebbende ten laste van de sociale zorgverzekeringen in dat land en de gemiddelde uitgaven voor zorg voor een
      persoon in Nederland uit hoofde van deze wet en de [Wet langdurige zorg][ref1].

      4 Bij ministeriële regeling kan worden bepaald:

      a. over welk jaar het inkomen bij wijze van grondslag voor de bijdrage, bedoeld in het tweede lid, wordt berekend
      en onder welke omstandigheden van dat jaar kan worden afgeweken;

      b. welk deel van de bijdrage, bedoeld in het tweede lid, voor de toepassing van de [Wet op de zorgtoeslag][ref2]
      als premie voor een zorgverzekering wordt beschouwd.

      5 De bijdrage van een persoon, bedoeld in het eerste lid, van 18 jaar of ouder die ingevolge de verordening, de
      overeenkomst of het verdrag, bedoeld in het eerste lid, als gezinslid wordt aangemerkt is verschuldigd door degene
      van wie het recht op zorg van dat gezinslid ingevolge die verordening, die overeenkomst of dat verdrag is afgeleid.

      6 Voor zover een pensioen- of renteverstrekkend orgaan aan een in het eerste lid bedoelde persoon loon als bedoeld
      in [artikel 42][ref3] verstrekt, is dat orgaan een bij ministeriële regeling te bepalen bijdrage verschuldigd.

      7 Het CAK is belast met de administratie voortvloeiend uit het eerste, vijftiende en zestiende lid en de daar
      genoemde internationale regels, alsmede met het nemen van beschikkingen over de heffing en de inning van de
      bijdragen, bedoeld in het tweede en zesde lid.

      8 Indien tegen een door het CAK op grond van dit artikel genomen beschikking bezwaar wordt gemaakt, beslist het
      CAK, in afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref4], binnen dertien weken
      gerekend vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.

      9 Het CAK gebruikt voor de uitvoering van dit artikel het burgerservicenummer van de in het eerste lid bedoelde
      personen.

      10 Het CAK is bevoegd tot het verwerken van persoonsgegevens van de personen, bedoeld in het eerste en veertiende
      lid die noodzakelijk zijn voor de uitvoering van dit artikel.

      11 Het CAK is de verwerkingsverantwoordelijke, voor de verwerking, bedoeld in het zevende lid.

      12 Bij ministeriële regeling:

      a. kan worden bepaald dat organen die pensioen of rente verschuldigd zijn of werkgevers in opdracht van het
      CAK werkzaamheden verrichten ter voorbereiding of uitvoering van beschikkingen als bedoeld in het zevende lid,
      waarbij kan worden bepaald dat die organen of werkgevers de bijdragen die de personen, bedoeld in het eerste
      lid, verschuldigd zijn, inhouden op een pensioen of een rente dan wel, indien het eerste lid van toepassing is op
      gezinsleden van een verzekeringsplichtige, op het loon, het pensioen of de rente van die verzekeringsplichtige;

      b. kunnen regels worden gesteld over de wijze waarop het CAK zijn taak, bedoeld in het zevende lid, uitoefent of de
      organen of werkgevers, bedoeld in onderdeel a, de in dat onderdeel bedoelde werkzaamheden uitvoeren;

      c. kan, voor gevallen waarin een persoon als bedoeld in het eerste lid van meer dan één orgaan pensioen of rente
      ontvangt, worden bepaald dat het CAK één orgaan aanwijst dat de bijdrage van die persoon en de bijdragen van de
      gezinsleden van die persoon inhoudt op door dat orgaan aan die persoon verschuldigde pensioen of rente, of indien
      het in te houden bedrag groter is dan dat pensioen of die rente, twee of meer organen aanwijst die elk een deel
      van dat bedrag inhouden. Daarbij kan worden bepaald dat een deel van het pensioen of de rente wordt vrijgesteld van
      inhouding door het aangewezen orgaan.

      13 [Artikel 18f, derde lid][ref5], is van overeenkomstige toepassing.

      14 Het CAK kan de bijdrage, bedoeld in het tweede of zesde lid, bij dwangbevel invorderen.

      15 Voor de toepassing van Verordening (EG) Nr. 883/2004 van het Europees Parlement en de Raad van 29 april 2004,
      betreffende de coördinatie van socialezekerheidsstelsels (Pb EU 2004, L 166) wordt de in het eerste lid bedoelde
      persoon die op de laatste dag van de maand voorafgaande aan die waarin hij de 65-jarige leeftijd bereikt een
      pensioen of uitkering ontvangt dat op grond van bijlage XI bij die verordening is gelijkgesteld met op grond
      van de Nederlandse wetgeving verschuldigde pensioenen, tot aan de pensioengerechtigde leeftijd als bedoeld in
      [artikel 7a van de Algemene Ouderdomswet][ref6] aangemerkt als een aanvrager van een pensioen.

      16 Voor de toepassing van een in het eerste lid bedoeld verdrag wordt de in het eerste lid bedoelde persoon die op
      de laatste dag van de maand voorafgaande aan die waarin hij de 65-jarige leeftijd bereikt een pensioen of uitkering
      ontvangt dat op grond van het verdrag is gelijkgesteld met op grond van de Nederlandse wetgeving verschuldigde
      pensioenen, tot aan de pensioengerechtigde leeftijd als bedoeld in [artikel 7a van de Algemene Ouderdomswet][ref7]
      aangemerkt als een rechthebbende op een pensioen.

      17 Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van de taken, bedoeld in
      [artikel 6.1.2, onderdelen k en l, van de Wet langdurige zorg][ref8], van het CAK.


