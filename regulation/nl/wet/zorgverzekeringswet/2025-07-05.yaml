      1 Een overeenkomst met betrekking tot de verzekering van geneeskundige zorg of de kosten daarvan, gesloten voor een
      verzekerde met of ten behoeve van wie tevens een zorgverzekering is gesloten, vervalt met ingang van de dag waarop
      de bij en krachtens [artikel 11][ref1] te verzekeren prestaties worden uitgebreid, voor zover aan de overeenkomst
      rechten kunnen worden ontleend, gelijkwaardig aan die, welke vanaf dat moment uit de zorgverzekering voortvloeien.

      2 De premie die voor de op grond van het eerste lid geheel of gedeeltelijk vervallen overeenkomst is
      vooruitbetaald, wordt door de verzekeraar al naar gelang van het vervallen gedeelte der overeenkomst terugbetaald,
      onder aftrek van ten hoogste 25% van het terug te betalen bedrag.


