  - number: 68b
    text: |-
      1 Een persoon die met toepassing van een verordening van het Europees Parlement en de Raad van de Europese Unie,
      toepassing van zodanige verordening krachtens de overeenkomst betreffende de Europese Economische Ruimte dan
      wel toepassing van een verdrag met het Verenigd Koninkrijk met terugwerkende kracht van langer dan vier maanden
      verzekeringsplichtig wordt ingevolge deze wet, kan bij het CAK een vergoeding aanvragen voor kosten van zorg.

      2 Voor vergoeding komen uitsluitend in aanmerking de kosten van zorg die een persoon als bedoeld in het eerste lid
      heeft ontvangen in de periode gelegen tussen de ingangsdatum van de verzekeringsplicht voor deze wet en het moment
      waarop hij van het CAK een kennisgeving heeft ontvangen van de verplichting om een zorgverzekering af te sluiten
      of, als dat eerder is, het moment waarop hij krachtens een zorgverzekering verzekerd is.

      3 Kosten van zorg die is aangevangen in en ontvangen na de periode, bedoeld in het tweede lid, worden toegerekend
      aan de periode waarin de zorg is aangevangen, indien de kosten door de zorgaanbieder in één bedrag in rekening
      zijn gebracht.

      4 Het CAK beslist op de aanvraag van de vergoeding.

      5 Een persoon waaraan de vergoeding is verleend, is voor zover deze in de periode, bedoeld in het tweede lid,
      achttien jaar of ouder was, een bijdrage verschuldigd, die voor de toepassing van de [Wet op de zorgtoeslag][ref1]
      geheel of gedeeltelijk als premie voor een zorgverzekering wordt beschouwd.

      6 Het CAK stelt de bijdrage ambtshalve vast en zendt een afschrift van de beschikking aan de Belastingdienst/
      Toeslagen.

      7 Het CAK:

      a. is bevoegd de vergoeding te verrekenen met de bijdrage;

      b. kan de bijdrage bij dwangbevel invorderen.

      8 Het CAK:

      a. gebruikt voor de uitvoering van dit artikel het burgerservicenummer van personen als bedoeld in het eerste lid;

      b. is bevoegd tot het verwerken van persoonsgegevens, waaronder persoonsgegevens betreffende de gezondheid als
      bedoeld in artikel 9 van de Algemene verordening gegevensbescherming, van de personen, bedoeld in het eerste lid,
      die noodzakelijk zijn voor de uitvoering van dit artikel.

      9 Bij ministeriële regeling kunnen regels worden gesteld over:

      a. de aanvraag van de vergoeding en de besluitvorming daarover, met inbegrip van beslistermijnen;

      b. de kosten van zorg die voor vergoeding in aanmerking komen;

      c. de voorwaarden waaronder de vergoeding kan worden verleend;

      d. de verplichtingen die aan de vergoeding kunnen worden verbonden;

      e. de hoogte van de vergoeding en de wijze van betaling daarvan;

      f. de hoogte van de bijdrage en de besluitvorming daarover;

      g. het deel van de bijdrage dat als premie voor de zorgverzekering wordt beschouwd;

      h. de verwerking van de persoonsgegevens, bedoeld in het achtste lid.

      10 De zorgverzekering, afgesloten door een persoon als bedoeld in het eerste lid, werkt, zo nodig in afwijking
      van [artikel 925, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2], terug indien zij ingaat binnen vier
      maanden na ontvangst van de kennisgeving, bedoeld in het eerste lid, tot en met de dag waarop die kennisgeving
      is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0018451
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel925
