      1 Het CAK is het nationale contactpunt, bedoeld in artikel 6, eerste lid, van [Richtlijn 2011/24](32011L0024)/EU
      van het Europees Parlement en de Raad van 9 maart 2011 betreffende de toepassing van de rechten van patiënten bij
