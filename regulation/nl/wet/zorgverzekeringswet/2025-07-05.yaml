      de zorgverzekeraar, kunnen de kantonrechter verzoeken te bepalen dat de zorgverzekeraar, onderscheidenlijk
      de permanente vertegenwoordiging van verzekerden gevolg dient te geven aan hetgeen bij en krachtens de
      [artikelen 28a, eerste tot en met vijfde lid][ref2], [artikel 28b, vierde tot en met zevende lid][ref3], en
      [28c][ref4] is bepaald.


