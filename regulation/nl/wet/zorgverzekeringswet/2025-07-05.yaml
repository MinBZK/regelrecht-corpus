  - number: '89'
    text: |-
      1 De in [artikel 88, eerste lid][ref1], bedoelde zorgverzekeraars en instanties, alsmede de Wlz-uitvoerders
      en de in [artikel 24, eerste en derde lid][ref2], bedoelde ministers, zijn bevoegd uit eigen beweging en
      verplicht op verzoek binnen een bij dat verzoek genoemde termijn, uit de onder hun verantwoordelijkheid gevoerde
      administratie, aan elkaar, aan een daartoe door of vanwege hen aangewezen persoon of aan een door Onze Minister
      aangewezen persoon, kosteloos, de gegevens, waaronder persoonsgegevens als bedoeld in de Algemene verordening
      gegevensbescherming, te verstrekken die noodzakelijk zijn voor de uitvoering van de zorgverzekeringen of van
      deze wet, van [artikel 11g van de Wet kwaliteit, klachten en geschillen zorg][ref3], of voor de onderlinge
      afstemming van op grond van de zorgverzekering verzekerde zorg en zorg die is verzekerd op grond van de
      [Wet langdurige zorg][ref4].

      2 Een zorgverzekeraar verleent op verzoek van het Zorginstituut, het CAK dan wel van de zorgautoriteit aan door het
      desbetreffende bestuursorgaan aangewezen personen inzage in alle bescheiden en andere gegevensdragers, stelt deze
      op verzoek ter beschikking voor het nemen van afschrift en verleent de terzake verlangde medewerking, voor zover
      het desbetreffende bestuursorgaan dit nodig acht voor de uitoefening van zijn taak.

      3 Alle ambtenaren tot afgifte van uittreksels uit registers van burgerlijke stand bevoegd, zijn verplicht aan een
      in [artikel 88, eerste lid][ref5], bedoelde zorgverzekeraar of instantie de door deze gevraagde uittreksels uit de
      registers kosteloos toe te zenden.

      4 Griffiers van colleges, geheel of ten dele met rechtspraak belast, verstrekken op verzoek, kosteloos, aan
      een zorgverzekeraar, aan het CAK, aan het Zorginstituut of aan de zorgautoriteit alle gegevens, inlichtingen
      en uittreksels uit of afschriften van uitspraken, registers en andere stukken, die noodzakelijk zijn voor de
      uitvoering van deze wet door de zorgverzekeraar of het desbetreffende bestuursorgaan.

      5 De verstrekking aan Onze Minister op grond van [artikel 88, eerste lid][ref6], of het eerste lid betreft, voor
      zover het gaat om persoonsgegevens als bedoeld in de Algemene verordening gegevensbescherming, waaronder gegevens
      over gezondheid als bedoeld in artikel 4, onderdeel 15 van die verordening, gegevens die noodzakelijk zijn voor de
      bepaling van de criteria, bedoeld in [artikel 32, derde lid][ref7], of van het criterium, bedoeld in artikel 32,
      vierde lid, onderdeel b, of de statistische onderbouwing van de aan de criteria krachtens artikel 32, vierde lid,
      onderdeel c, gekoppelde bijdragen.

      6 De verstrekking aan het Zorginstituut op grond van [artikel 88, eerste lid][ref8] of het eerste lid, betreft
      gegevens waaronder gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15 van de Algemene verordening
      gegevensbescherming, die noodzakelijk zijn voor:

      a. de berekening van de aan een zorgverzekeraar toekomende bijdragen als bedoeld in
      [artikelen 32 tot en met 34][ref9];

      b. de uitvoering van de aan het Zorginstituut in de [artikelen 64][ref10] of [66][ref11] opgedragen taken; of

      c. de uitvoering van de aan het Zorginstituut in
      [artikel 11g van de Wet kwaliteit, klachten en geschillen zorg opgedragen taken][ref12].

      7 Op de aan Onze Minister of het Zorginstituut te verstrekken persoonsgegevens is pseudonimisering als bedoeld
      in artikel 4, onderdeel 5 van de Algemene verordening gegevensbescherming, toegepast die vervolgens onafgebroken
      is gecontinueerd.

      8 Bij algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking van gegevens door de
      rijksbelastingdienst aan de zorgverzekeraars.

      9 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste of tweede lid.


