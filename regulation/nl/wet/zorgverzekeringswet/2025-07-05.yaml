  - number: 34a
    text: |-
      1 Het CAK verstrekt een zorgverzekeraar een bijdrage indien hij verzekerden voor wier zorgverzekering de
      bestuursrechtelijke premie verschuldigd is, onverminderd onder de dekking van de zorgverzekering heeft gehouden.

      2 Bij ministeriële regeling worden regels gesteld over de periode waarvoor de bijdrage wordt verstrekt, de hoogte
      van de bijdrage, de wijze waarop de bijdrage wordt verstrekt, waaronder de door de zorgverzekeraar over te leggen
      gegevens en verantwoording, en de door de zorgverzekeraar te voeren administratie.
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel34a
  - number: 35a
    text: |-
      1 Het Zorginstituut verwerkt de persoonsgegevens waaronder gegevens over gezondheid als bedoeld in artikel 4,
      onderdeel 15 van de Algemene verordening gegevensbescherming, die noodzakelijk zijn voor de berekening van aan een
      zorgverzekeraar toekomende bijdragen als bedoeld in de [artikelen 32 tot en met 34][ref1].

      2 Het Zorginstituut verwerkt op grond van het eerste lid slechts persoonsgegevens indien daarop pseudonimisering
      als bedoeld in artikel 4, onderdeel 5 van de Algemene verordening gegevensbescherming is toegepast en vervolgens
      onafgebroken is gecontinueerd.

      3 Artikel 21, eerste lid, tweede volzin van de Algemene verordening gegevensbescherming, is bij de verwerking door
      het Zorginstituut niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel32
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel35a
