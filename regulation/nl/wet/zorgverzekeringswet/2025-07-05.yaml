  - number: '24'
    text: |-
      1 De rechten en plichten uit de zorgverzekering zijn van rechtswege opgeschort gedurende de periode waarover Onze
      Minister van Justitie in het kader van de uitvoering van een rechterlijke uitspraak verantwoordelijk is voor de
      verstrekking van geneeskundige zorg aan een verzekerde.

      2 Het eerste lid is niet van toepassing gedurende de periode waarover iemand die geen gedetineerde is in de zin van
      de [Wet forensische zorg][ref1], forensische zorg als bedoeld in die wet geniet.

      3 De rechten en plichten uit de zorgverzekering zijn eveneens van rechtswege opgeschort gedurende de periode dat
      een verzekerde blijkens een verklaring van de Minister van Buitenlandse Zaken of een verklaring van Reclassering
      Nederland buiten Nederland in detentie is genomen.

      4 De verzekeringnemer, de verzekerde, of de gemachtigde van de verzekeringnemer of verzekerde meldt de
      zorgverzekeraar de dag waarop de periode, bedoeld in het eerste of derde lid, aanvangt, waarbij hij indien het
      derde lid van toepassing is, tevens de daar bedoelde verklaring aan de zorgverzekeraar overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0040634
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0040634
  - number: '25'
    text: |-
      1 Een verzekeraar meldt het voornemen zorgverzekeringen aan te bieden en uit te voeren schriftelijk aan de
      zorgautoriteit, onder vermelding van de dag met ingang waarvan hij zorgverzekeringen zal aanbieden.

      2 De verzekeraar voegt bij de melding alle modelovereenkomsten volgens welke hij zorgverzekeringen wenst aan te
      bieden.

      3 Een zorgverzekeraar legt wijzigingen in zijn modelovereenkomsten of nieuwe modelovereenkomsten voordat deze
      ingaan aan de zorgautoriteit over.
    url: https://wetten.overheid.nl/BWBR0018450/2025-07-05#Artikel25
  - number: '26'
    text: |-
      1 De zorgautoriteit tekent de datum van ontvangst aan op het geschrift waarmee de melding, bedoeld in
      [artikel 25, eerste lid][ref1], is gedaan, alsmede op de modelovereenkomsten of wijzigingen daarvan, bedoeld in
      [artikel 25, tweede en derde lid][ref2].

      2 De zorgautoriteit zendt de verzekeraar onverwijld een bewijs van ontvangst, waarin die datum is vermeld.

      3 De zorgautoriteit zendt het Zorginstituut onverwijld een afschrift van de melding, de modelovereenkomsten of de
      wijzigingen in de modelovereenkomsten, onder vermelding van de datum van ontvangst ervan.

      4 De zorgautoriteit zendt de beheerder van het register van zorgverzekeraars, bedoeld in
      [artikel 14 van de Wet aanvullende bepalingen verwerking persoonsgegevens in de zorg][ref3], onverwijld een
      afschrift van de melding onder vermelding van de datum van ontvangst ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel25
