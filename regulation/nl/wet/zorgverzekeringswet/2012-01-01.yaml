        paragraaf: '3.2'
  - number: '66'
    text: |-
      1 Het College zorgverzekeringen rapporteert Onze Minister desgevraagd over voorgenomen beleid inzake aard, inhoud
      en omvang van de prestaties, bedoeld in [artikel 11][ref1].

      2 Het College zorgverzekeringen signaleert gevraagd en ongevraagd aan Onze Minister feitelijke ontwikkelingen
      die aanleiding kunnen geven tot wijzigingen van de aard, inhoud en omvang van de prestaties, bedoeld in
      [artikel 11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel11
