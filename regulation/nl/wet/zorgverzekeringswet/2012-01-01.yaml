  - number: '67'
    text: |-
      Het College zorgverzekeringen bevordert de afstemming van de uitvoering:

      a. van en tussen de zorgverzekering en de algemene verzekering bijzondere ziektekosten, en

      b. van deze verzekeringen met de uitvoering van het beleid op andere terreinen van de volksgezondheid en op andere
      terreinen van sociale zekerheid.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel67
  - number: '68'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat het College zorgverzekeringen overeenkomstig in die regeling
      gestelde regels tijdelijk subsidies verstrekt voor zorg of andere diensten, ten aanzien waarvan het voornemen
      bestaat deze te doen opnemen in de te verzekeren prestaties.

      2 In een regeling als bedoeld in het eerste lid kan worden bepaald dat zorgverzekeraars het College
      zorgverzekeringen bijstand verlenen bij de verstrekking van subsidies behorende tot een in die regeling genoemde
      categorie, en welke vergoeding zij daarvoor ontvangen.

      3 Onze Minister kan jaarlijks voor een categorie van subsidies het subsidieplafond voor het komende jaar
      bekendmaken.

      4 In een regeling als bedoeld in het eerste lid kan aan het College zorgverzekeringen worden opgedragen nadere
      regels te stellen.

      5 Nadere regels als bedoeld in het vierde lid behoeven de goedkeuring van Onze Minister.

      6 Goedkeuring kan slechts worden onthouden wegens strijd met het recht of het belang van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel68
  - number: '69'
    text: |-
      1 In het buitenland wonende personen die met toepassing van een Verordening van de Raad van de Europese
      Gemeenschappen dan wel toepassing van zodanige verordening krachtens de overeenkomst betreffende de Europese
      Economische Ruimte of een verdrag inzake sociale zekerheid in geval van behoefte aan zorg recht hebben op zorg of
      vergoeding van de kosten daarvan, zoals voorzien in de wetgeving over de verzekering voor zorg van hun woonland,
      melden zich, tenzij zij op grond van deze wet verzekeringsplichtig zijn, bij het College zorgverzekeringen aan.

      2 De in het eerste lid bedoelde personen zijn een bij ministeriële regeling te bepalen bijdrage verschuldigd, die
      voor een bij die regeling te bepalen gedeelte, voor de toepassing van de [Wet op de zorgtoeslag][ref1] als premie
      voor een zorgverzekering wordt beschouwd.

      3 Indien de melding niet is geschied binnen vier maanden nadat het recht, bedoeld in het eerste lid, is ontstaan,
      legt het College zorgverzekeringen degene die de melding had moeten doen een bestuurlijke boete op ter hoogte van
      driemaal de tot een maandbedrag herleide standaardpremie, bedoeld in de [Wet op de zorgtoeslag][ref2].

      4 Het College zorgverzekeringen is belast met de administratie, voortvloeiend uit het eerste lid en de daar
      genoemde internationale regels, alsmede met het nemen van beschikkingen over de heffing en de inning van de
      bijdrage, bedoeld in het tweede lid.

      5 Indien tegen een door het College zorgverzekeringen op grond van dit artikel genomen beschikking bezwaar wordt
      gemaakt:

      a. kan dat college, in afwijking van [artikel 7:3 van de Algemene wet bestuursrecht][ref3], van het horen van
      een belanghebbende afzien, tenzij deze binnen een door het college gestelde, redelijke termijn verklaart dat hij
      gebruik wil maken van het recht te worden gehoord;

      b. beslist dat college, in afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref4],
      binnen dertien weken gerekend vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is
      verstreken.

      6 Het College zorgverzekeringen gebruikt voor de uitvoering van dit artikel het burgerservicenummer of, bij
      ontbreken daarvan, het sociaal-fiscaalnummer van de in het eerste lid bedoelde personen.

      7 Bij ministeriële regeling:

      a. kan worden bepaald dat organen die pensioen of rente verschuldigd zijn in opdracht van het College
      zorgverzekeringen werkzaamheden verrichten ter voorbereiding of uitvoering van beschikkingen als bedoeld in het
      vierde lid, waarbij kan worden bepaald dat die organen de bijdragen, bedoeld in het tweede lid, op het pensioen of
      de rente inhouden en aan het Zorgverzekeringsfonds afdragen;

      b. kunnen regels worden gesteld over de wijze waarop het College zorgverzekeringen zijn taak, bedoeld in het vierde
      lid, uitoefent of de organen, bedoeld in onderdeel a, de in dat onderdeel bedoelde werkzaamheden uitvoeren.

      8 [Artikel 5:53, tweede en derde lid, van de Algemene wet bestuursrecht][ref5] geldt niet voor de oplegging van de
      boete, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018451
      [ref2]: https://wetten.overheid.nl/BWBR0018451
