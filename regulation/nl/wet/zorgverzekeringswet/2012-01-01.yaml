  - number: '19'
    text: |-
      1 Iedere verzekerde van achttien jaar of ouder heeft een verplicht eigen risico van € 220 per kalenderjaar.

      2 Het bedrag, genoemd in het eerste lid, wordt jaarlijks geïndexeerd overeenkomstig het verschil in geraamde
      uitgaven voor de zorg en overige diensten, bedoeld in [artikel 11][ref1], tussen het kalenderjaar waarop
      het verplicht eigen risico betrekking zal hebben en vergelijkbare uitgaven voor het jaar voorafgaand aan dat
      kalenderjaar.

      3 Indien het geïndexeerde bedrag naar beneden afgerond € 5 of een veelvoud daarvan verschilt van het in het eerste
      lid genoemde bedrag, wordt dit bedrag bij ministeriële regeling gewijzigd, waarna het in die regeling genoemde
      bedrag in de plaats treedt van het in het eerste lid genoemde bedrag.

      4 Rekeningen voor kosten van zorg of overige diensten worden slechts op het verplicht eigen risico in mindering
      gebracht, indien deze door de zorgverzekeraar zijn ontvangen voor een bij algemene maatregel van bestuur te bepalen
      dag van het kalenderjaar volgend op het kalenderjaar waarop het verplicht eigen risico betrekking heeft.

      5 Bij algemene maatregel van bestuur wordt bepaald op welke wijze het verplicht eigen risico in mindering wordt
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '20'
    text: |-
      1 De zorgverzekeraar biedt van iedere zorgverzekering met een bepaalde combinatie van te verzekeren prestaties als
      bedoeld in [artikel 11, eerste lid][ref1], een variant zonder vrijwillig eigen risico aan.

      2 De zorgverzekeraar kan voor de verzekering van een persoon van achttien jaar of ouder varianten van de
      zorgverzekering aanbieden met een vrijwillig eigen risico van € 100, € 200, € 300, € 400 of € 500 per kalenderjaar,
      waartegenover hij een korting op de grondslag van de premie verleent.

      3 De korting mag afhangen van:

      a. de omvang van het voor de verzekerde gekozen vrijwillig eigen risico;

      b. het aantal kalenderjaren waarvoor een vrijwillig eigen risico voor de verzekerde gegolden heeft.

      4 De zorgverzekeraar neemt in zijn modelovereenkomst op welke premiekorting bij welk vrijwillig eigen risico voor
      welk aantal kalenderjaren geldt.

      5 Indien de zorgverzekeraar een of meer van de door hem aangeboden vrijwillige eigen risico’s laat vervallen, geeft
      de zorgverzekeraar de verzekeringnemers die een zorgverzekering met zo’n vrijwillig eigen risico hebben afgesloten,
      de mogelijkheid om te kiezen voor een zorgverzekering met een lager of zonder vrijwillig eigen risico.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel20
