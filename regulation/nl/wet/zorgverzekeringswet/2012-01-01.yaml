        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '21'
    text: |-
      1 Het percentage van de kosten van zorg of overige diensten dat ten laste gaat van het verplicht eigen risico,
      wordt bij algemene maatregel van bestuur vastgesteld.

      2 In afwijking van het eerste lid kunnen bij algemene maatregel van bestuur vormen van zorg of overige diensten
      worden aangewezen waarvoor de kosten geheel, gedeeltelijk of in het geheel niet onder het verplicht eigen risico
      vallen.

      3 In afwijking van het eerste lid kunnen bij algemene maatregel van bestuur vormen van zorg of overige diensten
      worden aangewezen waarvan de zorgverzekeraar, onder bij die maatregel te bepalen voorwaarden, kan bepalen dat de
      kosten geheel of gedeeltelijk buiten het verplicht eigen risico vallen.

      4 De zorgverzekeraar kan vormen van zorg of overige diensten aanwijzen waarvan de kosten niet onder het vrijwillig
      eigen risico vallen, met dien verstande dat bij algemene maatregel van bestuur vormen van zorg of overige diensten
      kunnen worden aangewezen waarvan de kosten geheel of gedeeltelijk buiten het vrijwillig eigen risico vallen.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel21
  - number: '22'
    text: |-
      1 Indien een zorgverzekering niet op 1 januari van een kalenderjaar ingaat of eindigt, is het in dat kalenderjaar
      voor die overeenkomst geldende bedrag van het verplicht eigen risico en indien dat van toepassing is, vrijwillig
      eigen risico gelijk aan het voor het gehele kalenderjaar geldende bedrag, vermenigvuldigd met een breuk waarvan de
      teller gelijk is aan het aantal dagen in dat kalenderjaar waarover de zorgverzekering zal lopen of heeft gelopen,
      en de noemer aan het aantal dagen in het desbetreffende kalenderjaar.

      2 In afwijking van het eerste lid wordt het in het kalenderjaar geldende bedrag van het vrijwillig eigen risico
      indien dat gedurende het kalenderjaar wijzigt en de verzekeringnemer onmiddellijk voorafgaande aan die wijziging
      reeds een zorgverzekering met de zorgverzekeraar had gesloten, als volgt berekend:

      a. ieder bedrag aan vrijwillig eigen risico dat in het desbetreffende kalenderjaar heeft gegolden of zal gelden,
      wordt vermenigvuldigd met het aantal in dat jaar gelegen dagen waarvoor dat risico gold of zal gelden;

      b. de op grond van onderdeel a berekende bedragen worden bij elkaar opgeteld;

      c. het op grond van onderdeel b berekende bedrag wordt gedeeld door het aantal dagen in het kalenderjaar.

      3 Het op grond van het eerste of tweede lid berekende bedrag wordt afgerond op hele euro’s.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel22
  - number: '23'
    text: |-
      1 Kosten van zorg of een andere dienst worden toegerekend aan het kalenderjaar waarin de zorg of dienst is
      genoten, met dien verstande dat de kosten van zorg of een andere dienst die in twee achtereenvolgende kalenderjaren
      is genoten en door de zorgaanbieder of andere dienstverlener in één bedrag in rekening zijn gebracht, worden
      toegerekend aan het kalenderjaar waarin de zorg of dienst is aangevangen.

      2 Bedragen als bedoeld in [artikel 11, derde of vierde lid][ref1], die voor rekening van de verzekerde komen,
      of kosten als bedoeld in [artikel 13, eerste lid][ref2], voor zover zij voor rekening van de verzekerde blijven,
      worden bij de beantwoording van de vraag of een voor zijn verzekering geldend verplicht of vrijwillig eigen risico
      wordt overschreden, buiten aanmerking gelaten.

      3 Een zorgverzekeraar brengt kosten van zorg of overige diensten die zowel ten laste van het verplicht als het
      vrijwillig eigen risico kunnen komen, eerst ten laste van het verplicht eigen risico.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
