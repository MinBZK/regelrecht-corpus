  - number: '50'
    text: |-
      1 Indien over het bijdrage-inkomen inkomensafhankelijke bijdrage is ingehouden over een hoger bijdrage-
      inkomen dan het bedrag, bedoeld in [artikel 43, tweede lid][ref1], stelt de inspecteur, bedoeld in de
      [Wet financiering sociale verzekeringen][ref2], bij voor bezwaar vatbare beschikking het bedrag van de teveel
      betaalde bijdrage vast.

      2 Indien het bijdrage-inkomen waarover inkomensafhankelijke bijdrage is ingehouden van verschillende
      inhoudingsplichtigen is ontvangen, wordt het bedrag van de teveel ingehouden bijdrage als bedoeld in het eerste lid
      naar evenredigheid toegerekend aan de door deze inhoudingsplichtigen ingehouden bijdrage.

      3 In afwijking in zoverre van de vorige leden wordt het bedrag van teveel ingehouden bijdrage voor zover mogelijk
      toegerekend aan de inkomensafhankelijke bijdrage over het bijdrage-inkomen waarop [artikel 46, eerste lid][ref3],
      niet van toepassing is.

      4 Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën, kunnen nadere en zo nodig
      afwijkende regels worden gesteld.

      5 In afwijking van de [artikelen 25b][ref4], [27f][ref5], [27j, derde lid][ref6], en
      [29i van de Algemene wet inzake rijksbelastingen][ref7] verleent de inspecteur een teruggave van een ingehouden
      bedrag aan inkomensafhankelijke bijdrage over loon als bedoeld in [artikel 46, eerste lid][ref8], aan de
      inhoudingsplichtige.


