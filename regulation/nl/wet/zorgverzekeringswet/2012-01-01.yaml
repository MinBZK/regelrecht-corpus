        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '14'
    text: |-
      1 De vraag of een verzekerde behoefte heeft aan een bepaalde vorm van zorg of een bepaalde andere dienst, wordt
      slechts op basis van zorginhoudelijke criteria beantwoord.

      2 De zorgverzekeraar neemt in zijn modelovereenkomst op dat geneeskundige zorg zoals medisch-specialisten die
      plegen te bieden, met uitzondering van acute zorg, slechts toegankelijk is na verwijzing door in die overeenkomst
      aangewezen categorieën zorgaanbieders, waaronder in ieder geval de huisarts.

      3 De vraag of een jeugdige als bedoeld in de [Wet op de jeugdzorg][ref1] wegens een psychiatrische aandoening
      behoefte heeft aan een bepaalde vorm van zorg of een andere dienst, wordt met overeenkomstige toepassing van de bij
      en krachtens [artikel 9b, vierde en vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref2] gestelde regels,
      beantwoord door een stichting als bedoeld in de [Wet op de jeugdzorg][ref3] respectievelijk een arts of andere
      behandelaar van de jeugdige.

      4 In de regels, bedoeld in het derde lid, kunnen voor de in dat lid bedoelde indicatie afzonderlijke regels worden
      gesteld en kunnen vormen van zorg of andere diensten worden aangewezen waarvoor het derde lid niet geldt.

      5 Op een stichting als bedoeld in het derde lid, is, met uitzondering van de bewaartermijn als omschreven in
      [artikel 86, eerste lid][ref4], het bepaalde bij of krachtens de [artikelen 4, tweede tot en met vijfde lid][ref5],
      en [86][ref6] van overeenkomstige toepassing met betrekking tot de indicatie, bedoeld in het derde lid.

      6 Voor zover een verzekerde ingevolge zijn zorgverzekering toestemming behoeft van de zorgverzekeraar dan wel
      een verwijzing of een recept van een deskundige is vereist voor het verkrijgen van de verzekerde prestaties, en
      de verzekerde in het bezit is van deze toestemming, deze verwijzing of dit recept, geldt die toestemming, die
      verwijzing of dat recept als titel voor het verkrijgen van de verzekerde prestaties gedurende de periode waarvoor
      de toestemming is verleend of de verwijzing of het recept geldig is, en verlangt een nieuwe zorgverzekeraar niet
      nogmaals dat toestemming wordt gevraagd of dat een verwijzing of recept wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0016637
