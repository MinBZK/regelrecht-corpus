  - number: 118a
    text: |-
      1 Verzekerden van achttien jaar of ouder:

      a. met meerjarige, onvermijdbare zorgkosten, of

      b. die in een instelling als bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref1] verblijven,

      hebben, indien zij behoren tot bij of krachtens algemene maatregel van bestuur aan te wijzen groepen, jegens het
      CAK voor het einde van het kalenderjaar recht op een jaarlijkse uitkering ter hoogte van het bedrag genoemd in
      [artikel 19, eerste lid][ref2], verminderd met het geraamde gemiddelde bedrag dat een verzekerde die geen recht
      heeft op de in dit lid bedoelde uitkering naar verwachting in dat kalenderjaar ingevolge [artikel 19][ref3]
      betaalt.

      2 het CAK neemt het sociaal-fiscaalnummer van de personen, bedoeld in het eerste lid, met het oog op de uitvoering
      van dit artikel in zijn administratie op.

      3 Zorgverzekeraars verstrekken aan het CAK de persoonsgegevens van de personen bedoeld in het eerste lid, waaronder
      persoonsgegevens betreffende de gezondheid als bedoeld in de [Wet bescherming persoonsgegevens][ref4], die
      noodzakelijk zijn ter uitvoering van het eerste lid.

      4 Bij ministeriële regeling kan worden bepaald:

      a. tot welke gegevens de verplichting, bedoeld in het derde lid, zich uitstrekt;

      b. op welke wijze gegevens, bedoeld in het derde lid, worden verwerkt;

      c. volgens welke technische standaarden gegevensverwerking plaatsvindt;

      d. aan welke beveiligingseisen gegevensverwerking voldoet;

      e. in welke gevallen gegevens, bedoeld in het derde lid, verder worden verwerkt met het oog op de uitvoering van
      het uitkeren van het bedrag, bedoeld in het eerste lid.

      5 Bij algemene maatregel van bestuur wordt bepaald op welke wijze het College zorgverzekeringen de beheerskosten,
      bedoeld in [artikel 39, derde lid, onderdeel f][ref5], vaststelt.


