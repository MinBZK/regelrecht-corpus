  - number: '17'
    text: |-
      1 De zorgverzekeraar stelt voor iedere variant van de zorgverzekering die hij aanbiedt, de grondslag van de premie
      en de bij die variant behorende premiekorting of premiekortingen vast en neemt deze in de modelovereenkomst op.

      2 De grondslag van de premie is gelijk voor varianten die wat betreft de te verzekeren prestaties als bedoeld in
      [artikel 11, eerste lid][ref1], of de keuzemogelijkheden tussen aanbieders van zorg of van overige diensten als
      bedoeld in dat lid, niet van elkaar verschillen.

      3 Indien de zorgverzekeraar gebruik maakt van zijn bevoegdheid, bedoeld in [artikel 11, vijfde lid][ref2], is de
      grondslag van de premie gelijk aan de grondslag die hij heeft of zou hebben vastgesteld voor een modelovereenkomst
      met volledige dekking.

      4 De grondslag van de premie is de premie indien geen premiekorting als bedoeld in [artikel 18, vierde lid][ref3],
      of [artikel 20][ref4] geldt of zou gelden.

      5 De verschuldigde premie is gelijk aan de grondslag van de premie behorende bij de variant van de
      zorgverzekering die de verzekeringnemer gekozen heeft, verminderd met de premiekortingen, bedoeld in de
      [artikelen 18, vierde lid][ref5], of [20][ref6], indien deze van toepassing zijn.

      6 De zorgverzekeraar geeft de wijze waarop de verschuldigde premie van de grondslag van de premie wordt afgeleid
      in de modelovereenkomst weer, en neemt de wijze waarop de door de verzekeringnemer verschuldigde premie van de
      grondslag van de premie is afgeleid in de zorgpolis op.

      7 Een wijziging in de grondslag van de premie treedt niet eerder in werking dan zes weken na de dag waarop deze aan
      de verzekeringnemer is medegedeeld.


