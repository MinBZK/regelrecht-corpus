      Gedurende de eerste twaalf maanden waarover een verzekering als bedoeld in [artikel 9d][ref1] loopt, is de
      verzekeringnemer vanaf de eerste dag van de kalendermaand volgende op de maand waarin hij de leeftijd van achttien
      jaren heeft bereikt aan het College zorgverzekeringen een bestuursrechtelijke premie verschuldigd, die per maand
      100% van de tot een maandbedrag herleide standaardpremie, bedoeld in de [Wet op de zorgtoeslag][ref2], bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel9d
