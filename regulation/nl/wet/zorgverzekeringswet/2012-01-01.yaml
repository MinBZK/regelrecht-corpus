  - number: 34a
    text: |-
      1 Het College zorgverzekeringen verstrekt een zorgverzekeraar een bijdrage indien hij verzekerden voor wier
      zorgverzekering de bestuursrechtelijke premie verschuldigd is, onverminderd onder de dekking van de zorgverzekering
      heeft gehouden.

      2 De bijdrage wordt voor het verzekerd houden van wanbetalers slechts verstrekt indien de zorgverzekeraar:

      a. zich heeft gehouden aan zijn verplichtingen, bedoeld in [artikel 18a][ref1], [18b][ref2] en
      [18c, tweede en derde lid][ref3],

      b. voorafgaande aan de melding, bedoeld in [artikel 18c][ref4], ook naast de op incasso gerichte inspanningen,
      bedoeld in de [artikelen 18a][ref5] en [18b][ref6], voldoende inspanningen tot inning van de premie heeft geleverd,
      en

      c. zich houdt aan zijn verplichting, bedoeld in [artikel 18d, derde lid][ref7], en desgevraagd voldoende
      medewerking verleent aan activiteiten van de verzekeringnemer of derden, gericht op aflossing van de jegens de
      zorgverzekeraar bestaande, uit de zorgverzekering voortvloeiende schuld.

      3 De periode waarover de bijdrage wordt verstrekt en de hoogte ervan, alsmede de wijze waarop deze wordt verstrekt,
      worden bij ministeriële regeling bepaald.

      4 Het College zorgverzekeringen is bevoegd de te verstrekken bijdrage te verrekenen met van de zorgverzekeraar
      terug te vorderen bedragen aan vereveningsbijdrage.


