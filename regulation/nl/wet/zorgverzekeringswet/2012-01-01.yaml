preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat de gehele bevolking onder voor ieder gelijke
    sociale voorwaarden verzekerd is tegen de gevolgen van behoefte aan geneeskundige zorg;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. verzekeraar: een verzekeringsonderneming als bedoeld in de eerste richtlijn schadeverzekering;

      b. zorgverzekeraar: een verzekeraar, voor zover deze zorgverzekeringen aanbiedt of uitvoert;

      c. verzekeringnemer: een persoon die met een zorgverzekeraar een zorgverzekering heeft gesloten;

      d. zorgverzekering: een tussen een zorgverzekeraar en een verzekeringnemer ten behoeve van een
      verzekeringsplichtige gesloten schadeverzekering, die voldoet aan hetgeen daarover bij of krachtens deze wet is
      geregeld, en waarvan de verzekerde prestaties het bij of krachtens deze wet geregelde niet te boven gaan;

      e. verzekeringsplichtige: degene die op grond van [artikel 2][ref1] verplicht is zich krachtens een zorgverzekering
      te verzekeren of te laten verzekeren;

      f. verzekerde: degene wiens risico van behoefte aan zorg of overige diensten, als bedoeld in [artikel 10][ref2],
      door een zorgverzekering wordt gedekt;

      g. verplicht eigen risico: een bedrag aan kosten van zorg of overige diensten als bedoeld bij of krachtens
      [artikel 11][ref3], dat voor rekening van de verzekerde blijft;

      h. vrijwillig eigen risico: een door de verzekeringnemer met de zorgverzekeraar als onderdeel van de
      zorgverzekering overeengekomen bedrag aan kosten van zorg of overige diensten als bedoeld bij of krachtens
      [artikel 11][ref4], dat de verzekerde voor zijn rekening zal nemen;

      i. zorgpolis: de akte waarin de tussen een verzekeringnemer en een zorgverzekeraar gesloten zorgverzekering is
      vastgelegd;

      j. modelovereenkomst: model van een zorgverzekering, waarin een overzicht wordt gegeven van de rechten en plichten
      die de verzekeringnemer, de verzekerde en de zorgverzekeraar jegens elkaar zullen hebben indien een overeenkomst
      volgens het desbetreffende model wordt gesloten;

      k. sociaal-fiscaalnummer: het nummer, bedoeld in
      [artikel 2, derde lid, onderdeel k, van de Algemene wet inzake rijksbelastingen][ref5];

      l. inhoudingsplichtige: de inhoudingsplichtige in de zin van de [Wet op de loonbelasting 1964][ref6] dan wel in de
      zin van de [Wet financiering sociale verzekeringen][ref7];

      m. instelling:

      1°. een instelling in de zin van de [Wet toelating zorginstellingen][ref8];

      2°. een in het buitenland gevestigde rechtspersoon die in het desbetreffende land zorg verleent in het kader van
      het in dat land bestaande socialezekerheidsstelsel, dan wel zich richt op het verlenen van zorg aan specifieke
      groepen van publieke functionarissen;

      n. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      o. zorgautoriteit: de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref9];

      p. College zorgverzekeringen: het College voor zorgverzekeringen, genoemd in [artikel 58, eerste lid][ref10];

      q. Zorgverzekeringsfonds: het fonds, genoemd in [artikel 39][ref11];

      r. eerste richtlijn schadeverzekering: [richtlijn nr. 73/239/EEG](31973L0239) van de Raad van de Europese
      Gemeenschappen van 24 juli 1973 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende de
      toegang tot het directe verzekeringsbedrijf, met uitzondering van de levensverzekeringsbranche en de uitoefening
      daarvan (PbEG L 228);

      s. generieke verevening: bijstelling van het deelbedrag op basis van het verschil per zorgverzekeraar tussen
      de kosten en het deelbedrag in relatie met de verschillen tussen de kosten en het deelbedrag bij andere
      zorgverzekeraars, per onderscheiden categorie van prestaties;

      t. loontijdvak: het loontijdvak, bedoeld in
      [artikel 25, eerste en vierde lid, van de Wet op de loonbelasting 1964][ref12];

      u. bijdragebetalingstijdvak: het kalenderjaar;

      v. burgerservicenummer: het nummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref13];

      w. het CAK: de besloten vennootschap CAK, gevestigd te ’s-Gravenhage;

      x. *premie:* de premie, bedoeld in [afdeling 3.3.1][ref14];

      y. *bestuursrechtelijke premie:* de premie, bedoeld in de artikelen [18d][ref15] en [18e][ref16].


