  - number: '45'
    text: |-
      1 De inkomensafhankelijke bijdrage bedraagt een percentage van het bijdrage-inkomen.

      2 Het in het eerste lid bedoelde bijdragepercentage wordt bij regeling van Onze Minister, in overeenstemming met
      Onze Minister van Sociale Zaken en Werkgelegenheid en Onze Minister van Financiën, vastgesteld.

      3 Voor daarbij aan te geven bestanddelen van het bijdrage-inkomen kan een afwijkend bijdragepercentage worden
      vastgesteld.

      4 De bijdragepercentages worden zodanig vastgesteld, dat de som van de inkomensafhankelijke bijdragen gelijk is
      aan 50% van de som van bij ministeriële regeling te bepalen, ten gunste van het Zorgverzekeringsfonds of van de
      zorgverzekeraars komende inkomsten.

      5 Na afloop van het kalenderjaar vastgestelde verschillen tussen de bedragen van de inkomsten die in de
      ministeriële regeling, bedoeld in het vierde lid, in aanmerking waren genomen en de werkelijke bedragen van die
      inkomsten, worden verrekend bij de vaststelling van het bijdragepercentage in een volgend jaar.

      6 Indien een wijziging van het bijdragepercentage ingaat op een ander tijdstip dan 1 januari, vindt de vaststelling
      plaats in overeenstemming met Onze Minister van Financiën en kunnen daarbij regels worden gesteld omtrent de wijze
      van berekening van de bijdrage over het gehele kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel45
  - number: '46'
    text: |-
      1 Een verzekeringsplichtige die bij regeling van Onze Minister aan te wijzen loon overeenkomstig de wettelijke
      bepalingen van de loonbelasting geniet, heeft recht op een volledige vergoeding door de inhoudingsplichtige van de
      inkomensafhankelijke bijdrage over dit deel van het bijdrage-inkomen.

      2 Voor de toepassing van het eerste lid is [artikel 43, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel46
