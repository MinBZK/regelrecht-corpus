  - number: '48'
    text: De rijksbelastingdienst heft de inkomensafhankelijke bijdrage.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel48
  - number: '49'
    text: |-
      1 Voor zover het bijdrage-inkomen bestaat uit loon als bedoeld in [artikel 43, eerste lid, onderdeel a][ref1], dat
      van een inhoudingsplichtige wordt genoten, wordt de inkomensafhankelijke bijdrage bij wijze van inhouding geheven
      met overeenkomstige toepassing van de voor de heffing van de loonbelasting geldende regels.

      2 Voor zover het bijdrage-inkomen bestaat uit andere dan de in het eerste lid bedoelde bestanddelen,
      wordt de inkomensafhankelijke bijdrage bij wege van aanslag geheven met overeenkomstige
      toepassing van de voor de heffing van de inkomstenbelasting geldende regels, met uitzondering van
      [artikel 3.154 van de Wet inkomstenbelasting 2001][ref2].

      3 Bij de vaststelling van de ingevolge het tweede lid op te leggen aanslag over een jaar wordt als bijdrage-
      inkomen ten hoogste in aanmerking genomen een bedrag gelijk aan het bijdrage-inkomen dat op grond van
      [artikel 43, tweede lid][ref3], ten hoogste in aanmerking wordt genomen, verminderd met het bijdrage-inkomen dat
      ingevolge het eerste lid ten aanzien van de verzekeringsplichtige over het jaar reeds in aanmerking is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.154
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel43
