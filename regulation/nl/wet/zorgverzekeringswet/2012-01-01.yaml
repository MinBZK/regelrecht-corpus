  - number: 9a
    text: |-
      1 Het College zorgverzekeringen gaat op basis van vergelijking van bij ministeriële regeling aan te wijzen
      bestanden na welke verzekeringsplichtigen in weerwil van hun verzekeringsplicht niet krachtens een zorgverzekering
      verzekerd zijn.

      2 Het College zorgverzekeringen zendt een verzekeringsplichtige als bedoeld in het eerste lid een schriftelijke
      aanmaning om zich binnen een termijn van drie maanden, te rekenen vanaf de datum van verzending van de aanmaning,
      alsnog op grond van zo'n verzekering te verzekeren of te laten verzekeren.

      3 De aanmaning bevat een overzicht van de gevolgen indien betrokkene niet binnen de in het tweede lid genoemde
      termijn verzekerd zal zijn.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel9a
  - number: 9b
    text: |-
      1 Indien een verzekeringsplichtige aan wie een aanmaning als bedoeld in [artikel 9a][ref1] is verzonden, niet
      binnen drie maanden na verzending daarvan verzekerd is, legt het College zorgverzekeringen hem dan wel, indien de
      verzekeringsplichtige minderjarig is, degene die het gezag over hem uitoefent, een bestuurlijke boete op.

      2 De hoogte van de boete is gelijk aan driemaal de tot een maandbedrag herleide standaardpremie, bedoeld in de
      [Wet op de zorgtoeslag][ref2].

      3 [Artikel 5:53, tweede en derde lid, van de Algemene wet bestuursrecht][ref3] geldt niet voor de oplegging van de
      boete, bedoeld in het eerste lid.

      4 Het College zorgverzekeringen kan de boete bij dwangbevel invorderen.

      5 Tegelijk met de oplegging van de boete deelt het College zorgverzekeringen mee wat de gevolgen zullen zijn indien
      de verzekeringsplichtige niet binnen een termijn van drie maanden, te rekenen vanaf de dag van verzending van de
      beschikking tot oplegging van de boete, alsnog verzekerd zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0018451
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel553
