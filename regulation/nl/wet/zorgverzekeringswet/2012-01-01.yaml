  - number: '8'
    text: |-
      1 Aan een opzegging of ontbinding van de zorgverzekering wegens het niet betalen van de verschuldigde premie, wordt
      geen terugwerkende kracht verleend, noch wordt daaraan een verplichting verbonden tot ongedaanmaking of vergoeding
      van hetgeen partijen reeds ter nakoming van de zorgverzekering jegens elkaar hebben verricht.

      2 Een zorgverzekeraar mag de zorgverzekering gedurende de periode, bedoeld in [artikel 24][ref1], niet opzeggen
      of ontbinden.

      3 [Artikel 934 van Boek 7 van het Burgerlijk Wetboek][ref2] is tevens van toepassing met betrekking tot de eerste
      premie die een verzekeringnemer voor een zorgverzekering verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel934
