  - number: '71'
    text: |-
      1 Het College zorgverzekeringen zendt jaarlijks voor 1 oktober tegelijk met de begroting een werkprogramma voor het
      volgende kalenderjaar aan Onze Minister met een beschrijving van de activiteiten die het College zorgverzekeringen
      voornemens is ter uitvoering van zijn taken te verrichten.

      2 Onverminderd [artikel 27 van de Kaderwet zelfstandige bestuursorganen][ref1] bevat de begroting een
      meerjarenraming van de beheerskosten voor de vier kalenderjaren, volgend op het begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel27
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '27'
  - number: '72'
    text: |-
      1 Onze Minister stelt jaarlijks voor 1 december het budget voor de beheerskosten van het College zorgverzekeringen
      voor het volgende kalenderjaar vast.

      2 Onze Minister kan besluiten het budget voor de beheerskosten van het College zorgverzekeringen te wijzigen.

      3 Het College zorgverzekeringen gaat met betrekking tot de beheerskosten geen verplichtingen aan en doet geen
      uitgaven die leiden tot overschrijding van het vastgestelde budget voor de beheerskosten.

      4 Indien het budget voor de beheerskosten niet is vastgesteld voor 1 januari van het kalenderjaar waarop de
      begroting betrekking heeft, is het College zorgverzekeringen bevoegd, teneinde zijn activiteiten gaande te houden,
      te beschikken over ten hoogste een derde gedeelte van het budget dat laatstelijk voor hem voor een geheel jaar
      is vastgesteld.

      5 Onze Minister kan besluiten dat het College zorgverzekeringen in een geval als bedoeld in het vierde lid,
      kan beschikken over meer dan een derde gedeelte van het budget dat laatstelijk voor hem voor een geheel jaar is
      vastgesteld.

      6 Het door Onze Minister vastgestelde budget voor de beheerskosten van het College zorgverzekeringen wordt gedekt
      uit ’s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel72
  - number: '73'
    text: |-
      1 De in [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref1] bedoelde begroting heeft betrekking op de
      beheerskosten van het College zorgverzekeringen.

      2 De in [artikel 34 van de Kaderwet zelfstandige bestuursorganen][ref2] bedoelde jaarrekening van het College
      zorgverzekeringen heeft betrekking op de beheerskosten van het College zorgverzekeringen.

      3 Het in [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref3] bedoelde jaarverslag van het College
      zorgverzekeringen heeft wat betreft de uitvoering van [artikel 122a][ref4] uitsluitend betrekking op de
      bedrijfsvoering ter zake.

      4 Onverminderd [artikel 35, vierde lid, van de Kaderwet zelfstandige bestuursorganen][ref5] doet de accountant
      tevens verslag van zijn bevindingen over de vraag of het beheer en de organisatie van het College zorgverzekeringen
      voldoen aan de eisen van rechtmatigheid, ordelijkheid en controleerbaarheid.


