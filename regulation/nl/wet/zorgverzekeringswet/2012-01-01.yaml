        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '12'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen ter bescherming van het algemeen belang vormen van zorg of overige
      diensten worden aangewezen die de zorgverzekeraar slechts verstrekt of vergoedt indien tussen hem en de aanbieder
      van de desbetreffende zorg of dienst een overeenkomst over de te leveren zorg of dienst en de daarvoor in rekening
      te brengen prijs is gesloten, dan wel indien de aanbieder bij hem in dienst is.

      2 Bij deze algemene maatregel van bestuur kunnen tevens vormen van zorg of overige diensten worden aangewezen
      waarvoor de zorgverzekeraar met iedere instelling die binnen zijn werkgebied is gelegen of waarvan zijn verzekerden
      naar verwachting regelmatig gebruik zullen maken, op haar verzoek een overeenkomst als bedoeld in het eerste lid
      sluit.

      3 Een instelling als bedoeld in [artikel 1, onderdeel m, onder 1°][ref1], die voor een in het tweede lid bedoelde
      vorm van zorg of dienst een overeenkomst met een zorgverzekeraar heeft gesloten, is verplicht desgevraagd met een
      andere zorgverzekeraar een gelijke overeenkomst te sluiten.

      4 Het tweede en het derde lid gelden niet indien de zorgverzekeraar respectievelijk instelling ernstige bezwaren
      heeft tegen het sluiten van een overeenkomst met de instelling respectievelijk zorgverzekeraar die om die
      overeenkomst vraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
        hoofdstuk: '1'
  - number: '13'
    text: |-
      1 Indien een verzekerde krachtens zijn zorgverzekering een bepaalde vorm van zorg of een andere dienst dient te
      betrekken van een aanbieder met wie zijn zorgverzekeraar een overeenkomst over deze zorg of dienst en de daarvoor
      in rekening te brengen prijs heeft gesloten of van een aanbieder die bij zijn zorgverzekeraar in dienst is, en
      hij deze zorg of andere dienst desalniettemin betrekt van een andere aanbieder, heeft hij recht op een door de
      zorgverzekeraar te bepalen vergoeding van de voor deze zorg of dienst gemaakte kosten.

      2 De zorgverzekeraar neemt de wijze waarop hij de vergoeding berekent in de modelovereenkomst op.

      3 Indien bij of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 11][ref1], is bepaald dat een
      deel van de kosten van een bepaalde vorm van zorg of van een bepaalde andere dienst voor rekening van de verzekerde
      komt, verwerkt de zorgverzekeraar dit in de wijze waarop hij de vergoeding voor de desbetreffende vorm van zorg of
      dienst berekent.

      4 De wijze waarop de vergoeding wordt berekend is voor alle verzekerden, bedoeld in het eerste lid, die in een
      zelfde situatie een zelfde vorm van zorg of dienst behoeven, gelijk.

      5 Indien een overeenkomst tussen een zorgverzekeraar en een aanbieder als bedoeld in het eerste lid wordt
      beëindigd, houdt een verzekerde die op het moment van beëindiging van de overeenkomst zorg ontvangt van deze
      aanbieder, recht op zorgverlening door die aanbieder voor rekening van deze zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel13
