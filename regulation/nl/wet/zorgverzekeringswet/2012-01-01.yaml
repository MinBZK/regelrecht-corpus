      1 Indien beroep is ingesteld tegen een bestuurlijke boete is, in afwijking van de [artikelen 8:27][ref1] en
      [8:28 van de Algemene wet bestuursrecht][ref2], de partij aan wie de bestuurlijke boete is opgelegd, niet verplicht
      omtrent de overtreding verklaringen af te leggen.

      2 Voor de rechtbank deze partij ondervraagt, deelt zij haar mede dat zij niet verplicht is tot antwoorden.

      3 Indien de rechtbank een beschikking tot het opleggen van een bestuurlijke boete vernietigt, neemt zij een
      beslissing omtrent het opleggen van de bestuurlijke boete en bepaalt zij dat haar uitspraak in zoverre in de plaats
      treedt van de vernietigde beschikking.


