    text: |-
      1 Degene die ingevolge de [Algemene Wet Bijzondere Ziektekosten][ref1] en de daarop gebaseerde regelgeving van
      rechtswege verzekerd is, is verplicht zich krachtens een zorgverzekering te verzekeren of te laten verzekeren tegen
      het in [artikel 10][ref2] bedoelde risico.

      2 In afwijking van het eerste lid is niet verzekeringsplichtig:

      a. de militaire ambtenaar in werkelijke dienst als bedoeld in
      [artikel 1, eerste lid, onderdeel a juncto onderdeel b, van de Militaire ambtenarenwet 1931][ref3], alsmede de
      militair aan wie buitengewoon verlof met behoud van militaire inkomsten is verleend;

      b. de natuurlijke persoon die op grond van
      [artikel 64, eerste lid, van de Wet financiering sociale verzekeringen][ref4] is ontheven van de verplichtingen,
      opgelegd op grond van de [Algemene Wet Bijzondere Ziektekosten][ref5].

      3 Degene die het gezag over een minderjarige, jonger dan achttien jaar, uitoefent, een curator, een bewindvoerder
      of een mentor als bedoeld in de [titels 16][ref6], [19][ref7] of [20 van Boek 1 van het Burgerlijk Wetboek][ref8],
      zorgt ervoor dat de minderjarige verzekeringsplichtige, dan wel de onder curatele, bewind of mentorschap gestelde
      verzekeringsplichtige krachtens een zorgverzekering verzekerd is.


