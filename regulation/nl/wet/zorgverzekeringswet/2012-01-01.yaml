      belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.

      2 Het eerste lid geldt niet:

      a. voor een beschikking als bedoeld in [artikel 9b][ref1], [9c][ref2], [18d tot en met 18g][ref3], [69][ref4] of
