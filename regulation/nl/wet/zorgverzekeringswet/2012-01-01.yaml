  - number: '52'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Financiën worden regels gesteld met betrekking tot de afdracht
      van de inkomensafhankelijke bijdragen alsmede van de daarmee verband houdende bestuurlijke boeten en renten door de
      rijksbelastingdienst aan het Zorgverzekeringsfonds.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel52
  - number: '53'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën en Onze Minister van Sociale
      Zaken en Werkgelegenheid, kunnen nadere regels worden gesteld met betrekking tot deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel53
  - number: '54'
    text: |-
      1 Onze Minister verleent jaarlijks aan het Zorgverzekeringsfonds een bijdrage in de financiering van de
      zorgverzekering voor verzekerden jonger dan achttien jaar.

      2 De bijdrage is gelijk aan het bedrag dat daarvoor in de wet tot vaststelling van de begroting van zijn ministerie
      voor dat jaar is toegestaan.

      3 De bijdrage wordt betaald in gelijke maandelijkse delen.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel54
  - number: '55'
    text: |-
      1 Onze Minister kan, in overeenstemming met Onze Minister van Financiën, een bijdrage aan het Zorgverzekeringsfonds
      verlenen ter gehele of gedeeltelijke betaling van zorg of overige diensten als bedoeld in [artikel 10][ref1], in
      geval de behoefte aan die zorg of diensten is veroorzaakt door of ontstaan uit gewapend conflict, burgeroorlog,
      opstand, binnenlandse onlusten, oproer, muiterij of terrorisme.

      2 Bij ministeriële regeling wordt bepaald:

      a. welke vormen van zorg of overige diensten voor welk gedeelte met de bijdrage worden betaald;

      b. ten behoeve van welke personen de bijdrage wordt betaald;

      c. onder welke voorwaarden en op welke wijze deze zorg of overige diensten door het College zorgverzekeringen
      worden betaald.

      3 In een regeling als bedoeld in het tweede lid kan worden bepaald dat zorgverzekeraars het College
      zorgverzekeringen bijstand verlenen bij het uitvoeren van de ministeriële regeling, bedoeld in het tweede lid, en
      welke vergoeding daar voor de zorgverzekeraars tegenover staat.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel10
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel55
    references:
