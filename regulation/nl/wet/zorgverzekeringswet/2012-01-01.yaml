      1 De [artikelen 941, eerste lid][ref1], en [957 van Boek 7 van het Burgerlijk Wetboek][ref2] zijn niet van
      toepassing.

      2 Zonodig in afwijking van [artikel 952 van Boek 7 van het Burgerlijk Wetboek][ref3] is de zorgverzekeraar niet
