  - number: '51'
    text: |-
      1 De rijksbelastingdienst vordert de inkomensafhankelijke bijdrage in.

      2 Bij de invordering van de bijdrage zijn, naar gelang [artikel 49, eerste lid][ref1], dan wel tweede
      lid van toepassing is, de regels geldende voor de invordering van de loonbelasting, met uitzondering van
      [artikel 38, eerste lid, onderdeel a, van de Invorderingswet 1990][ref2], onderscheidenlijk de inkomstenbelasting
      van overeenkomstige toepassing.


