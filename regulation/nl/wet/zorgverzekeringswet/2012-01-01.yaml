  - number: '18'
    text: |-
      1 De zorgverzekeraar kan met een werkgever overeenkomen dat hij een geldelijk voordeel verstrekt indien diens
      werknemers, voormalige werknemers of hun gezinsleden verzekerd worden op basis van een in die overeenkomst aan te
      wijzen modelovereenkomst.

      2 Het voordeel bedraagt, per persoon die op basis van de desbetreffende modelovereenkomst verzekerd wordt, niet
      meer dan 10% van de grondslag van de bij die modelovereenkomst behorende premie.

      3 In de overeenkomst, bedoeld in het eerste lid, wordt ten minste bepaald:

      a. de hoogte van het voordeel, waarbij die hoogte mag variëren al naar gelang het aantal volgens de desbetreffende
      modelovereenkomst verzekerde personen;

      b. de verdeling van het voordeel over de werkgever en de volgens de desbetreffende modelovereenkomst verzekerde
      personen.

      4 Indien het voordeel of een deel daarvan aan de verzekeringnemer wordt verstrekt, geschiedt dit in de vorm van een
      korting op de grondslag van de premie.

      5 Het eerste tot en met vierde lid zijn tevens van toepassing ten aanzien van een rechtspersoon, niet zijnde een
      werkgever, met betrekking tot de verzekering van natuurlijke personen wier belangen die rechtspersoon behartigt.

      6 Bij algemene maatregel van bestuur kunnen, om te voorkomen dat afbreuk wordt gedaan aan het sociale karakter van
      de verzekering, nadere en zonodig afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel18
  - number: 18a
    text: |-
      1 Uiterlijk tien werkdagen nadat ten aanzien van een zorgverzekering een achterstand in de betaling van de
      verschuldigde premie ter hoogte van twee maandpremies is geconstateerd, doet de zorgverzekeraar de verzekeringnemer
      een aanbod tot het treffen van een betalingsregeling.

      2 De betalingsregeling bestaat ten minste uit de volgende elementen:

      a. een machtiging van de verzekeringnemer aan de zorgverzekeraar tot maandelijkse automatische incasso van nieuw
      vervallende termijnen van de premie dan wel een opdracht aan een derde van wie de verzekeringnemer periodieke
      betalingen ontvangt, om namens hem en onder inhouding van de desbetreffende bedragen op deze betalingen, periodiek
      rechtstreeks aan de zorgverzekeraar het bedrag van nieuw vervallende termijnen van de premie te betalen,

      b. afspraken inzake de afwikkeling van de uit de zorgverzekering voortvloeiende schulden van de verzekeringnemer
      aan de zorgverzekeraar, inclusief rente en incassokosten, en de termijnen waarbinnen betaling zal plaatsvinden, en

      c. een toezegging van de zorgverzekeraar, inhoudende dat hij de zorgverzekering of de dekking daarvan gedurende
      de looptijd van de betalingsregeling niet om reden van het bestaan van de schulden, bedoeld in onderdeel b, zal
      beëindigen, schorsen of opschorten, zolang de verzekeringnemer de machtiging of de opdracht, bedoeld in onderdeel
      a, niet intrekt en de afspraken, bedoeld in onderdeel b, nakomt.

      3 Indien de verzekeringnemer een ander heeft verzekerd en ten aan zien van diens verzekering een premie-achterstand
      als bedoeld in het eerste lid is ontstaan, omvat het aanbod, bedoeld in het eerste lid, tevens een bereidverklaring
      opzegging van deze verzekering met ingang van de dag waarop de betalingsregeling van kracht wordt, te aanvaarden,
      mits:

      a. de verzekerde zichzelf uiterlijk met ingang van dezelfde dag krachtens een andere zorgverzekering verzekerd
      heeft, en

      b. deze, indien deze zorgverzekering bij dezelfde zorgverzekeraar is gesloten, terzake van de premie voor deze
      verzekering een volmacht of opdracht als bedoeld in het tweede lid, onderdeel a, heeft gegeven.

      4 Tegelijk met het aanbod deelt de zorgverzekeraar de verzekeringnemer schriftelijk mee dat deze een termijn van
      vier weken heeft om het te aanvaarden, waarbij de verzekeraar bovendien aangeeft wat de gevolgen zullen zijn indien
      het aanbod niet wordt aanvaard en de premieschuld, rente en incassokosten buiten beschouwing gelaten, tot zes of
      meer maandpremies zal zijn opgelopen, en wijst hij de verzekeringnemer op de mogelijkheid van schuldhulpverlening,
      waarbij hij tevens informatie verstrekt over de vormen hiervan en wijze waarop deze kan worden verzocht.

      5 Indien het derde lid van toepassing is, zendt de zorgverzekeraar de verzekerde tegelijk met de verzending van de
      in het eerste tot en met vierde lid bedoelde stukken aan de verzekeringnemer, afschriften van deze stukken.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel18a
  - number: 18b
    text: |-
      1 Zo spoedig mogelijk nadat ten aanzien van een zorgverzekering, rente en incassokosten buiten beschouwing latend,
      een achterstand in de betaling van de verschuldigde premie ter hoogte van vier maandpremies is geconstateerd,
      deelt de zorgverzekeraar de verzekeringnemer en, indien deze een ander is dan de verzekeringnemer, de verzekerde
      mee dat hij voornemens is over te gaan tot de melding, bedoeld in [artikel 18c][ref1], zodra de premieschuld de
      daar bedoelde hoogte zal hebben bereikt, tenzij de verzekeringnemer of de verzekerde hem uiterlijk vier weken na
      ontvangst van de mededeling heeft laten weten, het bestaan van de schuld of de hoogte ervan te betwisten.

      2 Ingeval van tijdige betwisting als bedoeld in het eerste lid deelt de zorgverzekeraar, indien deze na
      onderzoek zijn standpunt handhaaft, de verzekeringnemer en, indien deze een ander is dan de verzekeringnemer,
      de verzekerde mee dat hij het voornemen tot melding tot uitvoering zal brengen zodra de premieschuld de in
      [artikel 18c, eerste lid][ref2], bedoelde hoogte zal hebben bereikt, tenzij de verzekeringnemer of de verzekerde
      binnen een termijn van vier weken na ontvangst van de in dit lid bedoelde mededeling een geschil hierover heeft
      voorgelegd aan een onafhankelijke instantie als bedoeld in [artikel 114][ref3] of aan de burgerlijke rechter.

      3 Indien een betalingsregeling als bedoeld in [artikel 18a][ref4] ingaat nadat ten aanzien van de zorgverzekering,
      rente en incassokosten buiten beschouwing latend, een achterstand in de betaling van de verschuldigde premie ter
      hoogte van vier maandpremies is ontstaan, laat de zorgverzekeraar de in het eerste lid bedoelde melding achterwege
      zolang de nieuw vervallende termijnen van de premie worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18c
