  - number: '5'
    text: |-
      1 De zorgverzekering gaat in op de dag waarop de zorgverzekeraar het verzoek, bedoeld in
      [artikel 3, eerste lid][ref1], en, indien het [tweede of vijfde lid van dat artikel][ref2] van toepassing is, de
      aanduiding van de variant waar de verzekeringnemer voor kiest, heeft ontvangen.

      2 Indien de zorgverzekeraar op basis van het in het eerste lid bedoelde verzoek niet vast kan stellen of hij
      verplicht is voor de te verzekeren persoon een zorgverzekering te sluiten, en hij de persoon die de verzekering
      wenst te sluiten in verband daarmee uitnodigt de voor deze vaststelling noodzakelijke gegevens te verschaffen, gaat
      de zorgverzekering, in afwijking van het eerste lid, in op de dag waarop laatstbedoelde persoon aan dit verzoek
      heeft voldaan.

      3 De zorgverzekeraar verstrekt degene die het verzoek, bedoeld in het eerste lid, doet en, indien dit een ander is
      dan degene ten behoeve van wiens verzekering het verzoek is gedaan, laatstbedoelde persoon onverwijld:

      a. een bewijs van het verzoek, bedoeld in het eerste lid, waarop de datum van ontvangst is vermeld;

      b. een bewijs van de ontvangst van gegevens, bedoeld in het tweede lid, waarop de datum van de ontvangst is
      vermeld.

      4 Indien degene ten behoeve van wie de zorgverzekering wordt gesloten op de dag waarop de zorgverzekeraar
      het verzoek, bedoeld in het eerste lid, ontvangt reeds op grond van een zorgverzekering verzekerd is, en de
      verzekeringnemer aangeeft de zorgverzekering te willen laten ingaan op een door hem aangegeven, latere dag dan de
      dag, bedoeld in het eerste of tweede lid, gaat de verzekering op die latere dag in.

      5 De zorgverzekering werkt, zonodig in afwijking van
      [artikel 925, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref3], terug:

      a. indien zij ingaat binnen vier maanden nadat de verzekeringsplicht is ontstaan, tot en met de dag waarop die
      plicht ontstond;

      b. indien zij ingaat binnen een maand nadat een eerdere zorgverzekering met ingang van
      1 januari van een kalenderjaar of wegens wijziging van de voorwaarden met toepassing van
      [artikel 940, vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref4] is geëindigd door opzegging, tot en met de
      dag na die waarop de eerdere zorgverzekering is geëindigd.


