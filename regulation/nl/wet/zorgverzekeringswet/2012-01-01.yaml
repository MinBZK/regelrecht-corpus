  - number: 9c
    text: |-
      1 Indien een verzekeringsplichtige aan wie de boete, bedoeld in [artikel 9b][ref1], is opgelegd, niet binnen de
      termijn, bedoeld in artikel 9b, vijfde lid, alsnog verzekerd is, legt het College zorgverzekeringen hem dan wel,
      indien hij minderjarig is, degene die het gezag over hem uitoefent nogmaals een bestuurlijke boete op.

      2 [Artikel 9b, tweede tot en met vierde lid][ref2], zijn van toepassing.

      3 De boetebeschikking, bedoeld in het eerste lid, gaat vergezeld van een last, inhoudende dat de
      verzekeringsplichtige binnen drie maanden na de verzending van de last alsnog krachtens een zorgverzekering
      verzekerd dient te zijn, bij gebreke waarvan het College zorgverzekeringen [artikel 9d][ref3] zal toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel9b
