  - number: '60'
    text: |-
      1 Het College zorgverzekeringen stelt een bestuursreglement vast.

      2 Vergaderingen van het College zorgverzekeringen zijn niet openbaar, behoudens voor zover in het bestuursreglement
      anders is bepaald.

      3 In het bestuursreglement legt het College zorgverzekeringen in ieder geval vast hoe hij voldoet aan de
      verplichting ingevolge [artikel 3:2 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel32
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel60
