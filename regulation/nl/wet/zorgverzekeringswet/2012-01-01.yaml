  - number: '91'
    text: |-
      1 Het College zorgverzekeringen en de zorgautoriteit verstrekken Onze Minister uit eigen beweging inlichtingen
      over ontwikkelingen die ertoe leiden of kunnen leiden dat ten behoeve van verzekerden niet vrij kan worden gekozen
      tussen zorgverzekeraars en de door hen aangeboden varianten van de zorgverzekering of die een rechtmatige en
      volledige uitvoering van zorgverzekeringen jegens de verzekeringnemers of verzekerden in gevaar kunnen brengen.

      2 Het College zorgverzekeringen en de zorgautoriteit verstrekken desgevraagd aan het College bouw of het College
      sanering, bedoeld in de [Wet toelating zorginstellingen][ref1], de voor de uitoefening van hun taak benodigde
      inlichtingen en gegevens.

      3 Het College zorgverzekeringen en de zorgautoriteit verlenen aan door een bestuursorgaan, bedoeld in het tweede
      lid, aangewezen personen toegang tot en inzage in zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van hun taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0018906
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0018906
  - number: '92'
    text: |-
      1 Een zorgverzekeraar maakt voor de verstrekking of ontvangst van gegevens aan of van personen, aan te wijzen door
      het College zorgverzekeringen, gebruik van een elektronische infrastructuur.

      2 Het College zorgverzekeringen kan met betrekking tot het eerste lid regels stellen over:

      a. de aard en omvang van de gegevens en de voorschriften waaraan de verstrekking of ontvangst ten minste moet
      voldoen;

      b. de wijze waarop de verstrekking of ontvangst van gegevens plaatsvindt, waaronder begrepen de aansluiting van
      zorgverzekeraars op de infrastructuur;

      c. de wijze waarop het gebruik van de infrastructuur wordt georganiseerd en beheerd, waaronder begrepen de
      inrichting en instandhouding van een gemeenschappelijke database;

      d. de financiering van het gebruik van de infrastructuur en de wijze waarop de kosten ervan worden verdeeld.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel92
  - number: '93'
    text: |-
      1 Het is een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten enige
      taak vervult of heeft vervuld, verboden van vertrouwelijke gegevens of inlichtingen die ingevolge deze wet dan wel
      ingevolge [titel 5.2 van de Algemene wet bestuursrecht][ref1] zijn verstrekt of verkregen of van De Nederlandsche
      Bank N.V. of de Stichting Autoriteit Financiële Markten zijn ontvangen, verder of anders gebruik te maken of
      daaraan verder of anders bekendheid te geven dan voor de uitvoering van zijn taak of bij of krachtens deze wet
      wordt geëist.

      2 In afwijking van het eerste lid kunnen de zorgautoriteit en het College zorgverzekeringen met gebruikmaking
      van vertrouwelijke gegevens of inlichtingen verkregen bij de uitvoering van hun taken op grond van deze wet,
      mededelingen doen, indien deze niet kunnen worden herleid tot afzonderlijke personen of ondernemingen.

      3 In afwijking van het eerste lid en in overeenstemming met
      [artikel 1:89 van de Wet op het financieel toezicht][ref2] zijn de zorgautoriteit, het College zorgverzekeringen,
      De Nederlandsche Bank N.V. en de Stichting Autoriteit Financiële Markten, voor zover dat voor hun taakuitoefening
      noodzakelijk is, bevoegd aan elkaar en aan Onze Minister vertrouwelijke gegevens of inlichtingen omtrent
      afzonderlijke verzekeraars te verschaffen.

      4 Het eerste lid laat, ten aanzien van degene op wie dat lid van toepassing is, onverlet:

      a. de toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref3] welke betrekking hebben op het
      als getuige of deskundige in strafzaken afleggen van een verklaring omtrent gegevens of inlichtingen verkregen bij
      de vervulling van de ingevolge deze wet opgedragen taak;

      b. de toepasselijkheid van de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref4] en van
      [artikel 66 van de Faillissementswet][ref5] welke betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring omtrent gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak, voor zover het gaat om
      gegevens of inlichtingen omtrent een verzekeraar die in staat van faillissement is verklaard of op grond van een
      rechterlijke uitspraak is ontbonden;

      c. de bevoegdheden van de Algemene Rekenkamer ingevolge [artikel 91 van de Comptabiliteitswet 2001][ref6], voor
      zover deze niet bij [artikel 121][ref7] zijn beperkt.

      5 Het vierde lid, onderdeel b, geldt niet voor gegevens of inlichtingen die betrekking hebben op verzekeraars die
      betrokken zijn of zijn geweest bij een poging de desbetreffende verzekeraar in staat te stellen zijn bedrijf voort
      te zetten.

      6 De Algemene Rekenkamer is bij het doen van mededelingen als bedoeld in
      [artikel 91, elfde tot en met veertiende lid, van de Comptabiliteitswet 2001][ref8], verplicht tot geheimhouding,
      voor zover het betreft gegevens en inlichtingen die haar ingevolge het vierde lid, onderdeel c, bekend zijn
      geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel189
      [ref3]: https://wetten.overheid.nl/BWBR0001903
      [ref4]: https://wetten.overheid.nl/BWBR0001827
      [ref5]: https://wetten.overheid.nl/BWBR0001860#Artikel66
