        artikel: '393'
  - number: '75'
    text: |-
      1 Het werkprogramma, bedoeld in [artikel 71][ref1], de jaarrekeningen, bedoeld in de [artikelen 74][ref2] en
      [122a, tiende lid][ref3], en de begroting, bedoeld in artikel 122a, zevende lid, behoeven de goedkeuring van Onze
      Minister.

      2 In afwijking van het eerste lid en van
      [artikel 29, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref4], behoeven wijzigingen in een
      goedgekeurde begroting geen goedkeuring van Onze Minister, mits:

      a. de totale omvang van de begroting geen wijziging ondergaat, en

      b. de wijziging per groep van kostensoorten en baten, gerekend over het desbetreffende begrotingsjaar, een bedrag
      van 5 procent van het in [artikel 72][ref5] bedoelde budget niet te boven gaat.

      3 Bij ministeriële regeling kunnen regels worden gesteld over:

      a. de inhoud en de inrichting van het werkprogramma, bedoeld in [artikel 71][ref6];

      b. de inhoud en de inrichting van de begrotingen, bedoeld in [artikel 122a, zevende lid][ref7], alsmede in
      [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref8];

      c. de inhoud en de inrichting van de jaarrekeningen, bedoeld in de [artikelen 74][ref9] en
      [122a, tiende lid][ref10], alsmede in [artikel 34 van de Kaderwet zelfstandige bestuursorganen][ref11];

      d. de inhoud en de inrichting van de jaarverslagen, bedoeld in de [artikelen 74][ref12] en
      [122a, elfde lid][ref13], alsmede in [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref14];

      e. de accountantscontrole van de jaarrekeningen van het College zorgverzekeringen;

      f. de omvang van de egalisatiereserve, bedoeld in [artikel 33 van de Kaderwet zelfstandige bestuursorganen][ref15].

      4 Bij ministeriële regeling worden regels gesteld over de wijze waarop en de voorwaarden waaronder het budget,
      bedoeld in [artikel 72][ref16], wordt vastgesteld.


