  - number: 18d
    text: |-
      1 De verzekeringnemer is aan het College zorgverzekeringen een bestuursrechtelijke premie verschuldigd vanaf de
      eerste dag van de maand volgende op de maand waarin dat college de melding, bedoeld in [artikel 18c][ref1], heeft
      ontvangen tot de eerste dag van de maand volgende op de maand waarin de datum, bedoeld in het derde lid, ligt.

      2 De bestuursrechtelijke premie bedraagt per maand 130% van de tot een maandbedrag herleide standaardpremie,
      bedoeld in de Wet op de zorgtoeslag.

      3 De zorgverzekeraar stelt het College zorgverzekeringen, de verzekeringnemer en, indien deze een ander is dan de
      verzekeringnemer, de verzekerde, met het oog op de toepassing van het eerste lid onverwijld op de hoogte van de
      datum waarop:

      a. de uit de zorgverzekering voortvloeiende schulden zijn of zullen zijn afgelost of tenietgaan,

      b. de schuldsaneringsregeling natuurlijke personen, bedoeld in de Faillissementswet, op de verzekeringnemer van
      toepassing wordt, of

      c. door tussenkomst van een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref2] een overeenkomst als bedoeld in
      [artikel 18c, tweede lid, onderdeel d][ref3], is gesloten of een schuldregeling tot stand is gekomen waarin, naast
      de verzekeringnemer, ten minste zijn zorgverzekeraar deelneemt.

      4 In afwijking van het eerste tot en met derde lid, is de verzekeringnemer wederom aan het College
      zorgverzekeringen bestuursrechtelijke premie verschuldigd vanaf de eerste dag van de maand volgende op de maand:

      a. waarin de toepassing van de schuldsaneringsregeling natuurlijke personen op grond van
      [artikel 350, derde lid, onderdeel c, d, e, f, of g, van de Faillissementswet][ref4], is beëindigd;

      b. waarin hij zich, blijkens een mede door de schuldhulpverlener ondertekende melding van zijn zorgverzekeraar, aan
      deelname aan de in het derde lid, onderdeel c, bedoelde regeling heeft onttrokken voordat hij de in die regeling
      neergelegde afspraken jegens zijn zorgverzekeraar volledig is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18c
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel48
