  - number: '58'
    text: |-
      1 Er is een College voor zorgverzekeringen, dat rechtspersoonlijkheid bezit.

      2 Het College zorgverzekeringen is gevestigd in een door Onze Minister te bepalen plaats.

      3 Het College zorgverzekeringen is belast met de taken die hem bij of krachtens wet of internationale overeenkomst
      zijn opgedragen.

      4 Het College zorgverzekeringen wordt in en buiten rechte vertegenwoordigd door de voorzitter.

      5 De [Kaderwet zelfstandige bestuursorganen][ref1] is op het College zorgverzekeringen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '59'
    text: |-
      1 Het College zorgverzekeringen bestaat uit ten hoogste drie leden, onder wie de voorzitter.

      2 Benoeming vindt plaats op grond van de deskundigheid die nodig is voor de uitoefening van de taken van het
      College zorgverzekeringen alsmede op grond van maatschappelijke kennis en ervaring.

      3 De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier
      jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel59
  - number: 59a
    text: |-
      1 Het College zorgverzekeringen heeft een commissie die rapporten of signalen als bedoeld in [artikel 66][ref1]
      voorbereidt.

      2 De commissie bestaat uit een oneven aantal van ten hoogste negen leden, waaronder de leden van het College
      zorgverzekeringen. Onze Minister benoemt, schorst en ontslaat de leden van de commissie. Het lidmaatschap eindigt
      tussentijds door overlijden, ontslag op eigen verzoek of ontslag om zwaarwichtige redenen door Onze Minister.

      3 [Artikel 59, tweede en derde lid][ref2], zijn op de leden van de commissie die niet tevens leden van het
      College zorgverzekeringen zijn, van overeenkomstige toepassing, met dien verstande dat hun benoeming plaatsvindt
      op grond van de deskundigheid die nodig is voor de uitoefening van de taken van de commissie en op grond van
      maatschappelijke kennis en ervaring.

      4 Bij ministeriële regeling worden de vergoeding van reis- en verblijfkosten en verdere vergoedingen aan de leden
      van de commissie die niet tevens leden van het College zorgverzekeringen zijn, vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel59
