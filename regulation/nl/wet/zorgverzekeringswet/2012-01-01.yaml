  - number: '40'
    text: |-
      1 Het College zorgverzekeringen beheert en administreert afzonderlijk het Zorgverzekeringsfonds.

      2 Het College zorgverzekeringen houdt de financiële middelen die deel uitmaken van het Zorgverzekeringsfonds, in
      rekening-courant bij Onze Minister van Financiën.

      3 Het College zorgverzekeringen kan, voor de uitvoering van zijn wettelijke taken, beschikken over de financiële
      middelen die hij in rekening-courant bij Onze Minister van Financiën aanhoudt.

      4 In afwijking van het tweede lid kan het College zorgverzekeringen een deel van de in dat lid bedoelde financiële
      middelen buiten de in dat lid bedoelde rekening-courant houden.

      5 Onze Minister stelt in overeenstemming met Onze Minister van Financiën, na overleg met het College
      zorgverzekeringen, de omvang van het in het vierde lid bedoelde deel van de financiële middelen vast.

      6 Bij een tekort aan financiële middelen maakt het College zorgverzekeringen uitsluitend gebruik van de
      kredietfaciliteiten die door Onze Minister van Financiën worden verleend.

      7 Onze Minister van Financiën informeert dagelijks het College zorgverzekeringen ten aanzien van de rekening-
      courant, in elk geval met betrekking tot:

      a. de slotstanden per dag;

      b. alle dagelijks geboekte mutaties of transacties in de rekening-courant.

      8 Het College zorgverzekeringen informeert Onze Minister van Financiën ten aanzien van de rekening-courant in elk
      geval met betrekking tot de prognoses van de saldi van de rekening-courant.

      9 Onze Minister van Financiën brengt voor het beheer van de rekening-courant geen kosten in rekening.

      10 Onze Minister stelt in overeenstemming met Onze Minister van Financiën, na overleg met het College
      zorgverzekeringen, regels omtrent de rente die over de saldi van de in het tweede lid bedoelde rekening-courant
      wordt vergoed onderscheidenlijk in rekening wordt gebracht.

      11 Onze Minister kan in overeenstemming met Onze Minister van Financiën, na overleg met het College
      zorgverzekeringen, regels stellen omtrent het tweede, zevende en achtste lid.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel40
  - number: '41'
    text: De verzekeringsplichtige is een inkomensafhankelijke bijdrage verschuldigd.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel41
  - number: '42'
    text: De inkomensafhankelijke bijdrage over een jaar wordt geheven over het bijdrage-inkomen van dat jaar.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel42
  - number: '43'
    text: |-
      1 Het bijdrage-inkomen van een jaar is het gezamenlijke bedrag van hetgeen door de verzekeringsplichtige in dat
      jaar is genoten aan:

      a. belastbaar loon overeenkomstig de wettelijke bepalingen van de loonbelasting, verminderd met
      de ingevolge [artikel 46][ref1] genoten vergoeding en met uitzondering van loon als bedoeld in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref2] waarover de
      belasting op grond van [artikel 27a, eerste lid, van die wet][ref3] is verschuldigd door de inhoudingsplichtige en
      het hierdoor voor de werknemer in de zin van [die wet][ref4] ontstane voordeel, en vermeerderd met loon, bepaald
      volgens de regels van [artikel 3.82 van de Wet inkomstenbelasting 2001][ref5];

      b. belastbare winst uit onderneming, bepaald volgens de regels van
      [afdeling 3.2 van de Wet inkomstenbelasting 2001][ref6];

      c. belastbaar resultaat uit overige werkzaamheden, bepaald volgens de regels van
      [afdeling 3.4 van de Wet inkomstenbelasting 2001][ref7], met uitzondering van de in de [artikelen 3.91][ref8] en
      [3.92 van de Wet inkomstenbelasting 2001][ref9] bedoelde werkzaamheden;

      d. belastbare periodieke uitkeringen en verstrekkingen, bepaald volgens de regels van
      [afdeling 3.5 van de Wet inkomstenbelasting 2001][ref10].

      2 Het bijdrage-inkomen wordt ten minste op nihil gesteld en wordt tot geen hoger bedrag in aanmerking genomen dan
      het bij regeling van Onze Minister, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid en
      Onze Minister van Financiën, vastgestelde bedrag.

      3 Bij de berekening van het bijdrage-inkomen blijft het van dezelfde inhoudingsplichtige ontvangen loon als bedoeld
      in het eerste lid, onderdeel a, buiten aanmerking voor zover dat meer bedraagt dan een bij regeling van Onze
      Minister in overeenstemming met Onze Minister van Financiën en Onze Minister van Sociale Zaken en Werkgelegenheid,
      vastgesteld bedrag in een bijdragebetalingstijdvak.

      4 Het bedrag, bedoeld in het derde lid, wordt vastgesteld voor loontijdvakken waarin loon als bedoeld in het eerste
      lid, onderdeel a, wordt genoten waarvoor Onze Minister, in overeenstemming met de Minister van Sociale Zaken en
      Werkgelegenheid, dit nodig acht.

      5 Voor de herleiding van het loontijdvak, bedoeld in het vierde lid, van een jaar naar een ander loontijdvak is
      [artikel 25, eerste en vierde lid, van de Wet op de loonbelasting 1964][ref11] van overeenkomstige toepassing.

      6 In de gevallen, bedoeld in [artikel 26b, eerste volzin, van de Wet op de loonbelasting 1964][ref12] en
      [artikel 19 Wet financiering sociale verzekeringen][ref13], blijven het tweede en het derde lid buiten toepassing
      bij de berekening van het als bijdrage-inkomen in aanmerking te nemen loon dat van de inhoudingsplichtige is
      genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
