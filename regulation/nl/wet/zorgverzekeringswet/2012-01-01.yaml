  - number: '90'
    text: |-
      1 De zorgautoriteit, onderscheidenlijk het College zorgverzekeringen kan na overleg met het College
      zorgverzekeringen, onderscheidenlijk de zorgautoriteit bij regeling bepalen welke gegevens en inlichtingen
      regelmatig door de zorgverzekeraars moeten worden verstrekt.

      2 De regels kunnen mede omvatten het tijdstip en de wijze waarop de gegevens en inlichtingen moeten worden
      verstrekt, alsmede dat een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1] de
      juistheid van de verstrekte gegevens en inlichtingen bevestigt.

      3 Bij ministeriële regeling kan worden bepaald welke statistische gegevens de zorgverzekeraars verzamelen
      betreffende vormen van zorg en andere diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel90
