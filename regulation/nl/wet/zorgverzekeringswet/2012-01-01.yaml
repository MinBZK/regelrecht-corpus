  - number: '6'
    text: |-
      1 De zorgverzekering eindigt van rechtswege met ingang van de dag volgende op de dag waarop:

      a. de verzekeraar ten gevolge van wijziging of intrekking van zijn vergunning tot uitoefening van het
      schadeverzekeringsbedrijf, geen zorgverzekeringen meer mag aanbieden;

      b. de verzekerde ten gevolge van wijziging van het werkgebied buiten het werkgebied van de zorgverzekeraar komt
      te wonen;

      c. de verzekerde overlijdt;

      d. de verzekeringsplicht van de verzekerde eindigt.

      2 De zorgverzekering eindigt van rechtswege met ingang van de eerste dag van de tweede maand volgende op de dag
      waarop de verzekerde, zonder dat zijn verzekeringsplicht eindigt, ten gevolge van verhuizing komt te wonen buiten
      een provincie waarin zijn zorgverzekeraar de ten behoeve van hem gesloten variant van de zorgverzekering aanbiedt
      of uitvoert.

      3 De zorgverzekeraar stelt de verzekeringnemer uiterlijk twee maanden voordat een zorgverzekering op grond van
      het eerste lid, onderdeel a of b, eindigt, van dit einde op de hoogte, onder vermelding van de reden daarvan en de
      datum waarop de verzekering eindigt.

      4 De verzekeringnemer stelt de zorgverzekeraar onverwijld op de hoogte van alle feiten en omstandigheden over
      de verzekerde die op grond van het eerste lid, onderdeel c of d, dan wel het tweede lid tot het einde van de
      zorgverzekering hebben geleid of kunnen leiden.

      5 Indien de zorgverzekeraar op grond van de in het vierde lid bedoelde gegevens tot de conclusie komt dat de
      zorgverzekering zal eindigen of geëindigd is, deelt hij dit, onder vermelding van de reden daarvan en de datum
      waarop de verzekering eindigt of geëindigd is, onverwijld aan de verzekeringnemer mede.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel6
  - number: '7'
    text: |-
      1 De verzekeringnemer kan de zorgverzekering uiterlijk 31 december van ieder jaar met ingang van 1 januari van het
      volgende kalenderjaar opzeggen.

      2 De verzekeringnemer die een ander dan zichzelf heeft verzekerd, kan de zorgverzekering opzeggen indien de
      verzekerde krachtens een andere zorgverzekering verzekerd wordt.

      3 In afwijking van [artikel 940, vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] kan de verzekeringnemer
      niet opzeggen indien een wijziging in de verzekerde prestaties ten nadele van de verzekeringnemer of de verzekerde
      rechtstreeks voortvloeit uit een wijziging van de bij of krachtens de [artikelen 11 tot en met 14a][ref2] gestelde
      regels.

      4 De opzegging, bedoeld in het tweede lid, gaat in op de eerste dag van de tweede kalendermaand volgende op de dag
      waarop de verzekeringnemer heeft opgezegd.

      5 In afwijking van het vierde lid gaat een opzegging, bedoeld in het tweede lid, in met ingang van de dag
      waarop de verzekerde krachtens de andere zorgverzekering verzekerd wordt, indien die opzegging voorafgaande aan
      laatstbedoelde dag door de zorgverzekeraar is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel940
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel11
