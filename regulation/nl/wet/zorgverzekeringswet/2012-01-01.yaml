  - number: '57'
    text: |-
      1 Van de persoon die op grond van [artikel 2, tweede lid, onderdeel b][ref1], niet verzekeringsplichtig is,
      wordt met overeenkomstige toepassing van [hoofdstuk 5 van de Wet financiering sociale verzekeringen][ref2] en
      [artikel 58 van die wet][ref3] belasting geheven, tot het bedrag van de inkomensafhankelijke bijdrage, bedoeld in
      [artikel 43, tweede lid][ref4], dat de persoon verschuldigd zou zijn als ware hij verzekeringsplichtig.

      2 Indien de in het eerste lid bedoelde belasting wordt geheven over op grond van [artikel 46, eerste lid][ref5],
      aangewezen loon, is [artikel 46][ref6] van overeenkomstige toepassing.

      3 De rijksbelastingdienst stort de belasting, bedoeld in het eerste lid, op de rekening, bedoeld in
      [artikel 70, eerste dan wel tweede lid][ref7].


