  - number: '39'
    text: |-
      1 Er is een Zorgverzekeringsfonds.

      2 Ten gunste van het Zorgverzekeringsfonds komen:

      a. de inkomensafhankelijke bijdragen, bedoeld in [paragraaf 5.2][ref1], alsmede de daarmee verband houdende
      bestuurlijke boeten en renten;

      b. de rijksbijdrage, bedoeld in [artikel 54][ref2];

      c. een rijksbijdrage als bedoeld in de [artikelen 55][ref3] of [56][ref4];

      d. een bedrag van iedere rekening, bedoeld in [artikel 70][ref5], gelijk aan:

      1°. jaarlijks: de helft van de bijdragevervangende belastingen die degenen wier bijdragevervangende belastingen op
      die rekening werden gestort, over het voorafgaande kalenderjaar gezamenlijk verschuldigd waren, of zoveel minder
      als het saldo bedraagt;

      2°. voor iedere tot een huishouding als bedoeld in [artikel 70, tweede lid][ref6], behorende gemoedsbezwaarde
      die alsnog verzekeringsplichtig wordt dan wel overlijdt: het saldo van de rekening gedeeld door het aantal tot de
      huishouding behorende gemoedsbezwaarden;

      3°. indien de rekening met toepassing van [artikel 70, zevende lid][ref7], wordt opgeheven: het saldo van de
      rekening;

      e. aan het College zorgverzekeringen betaalde bedragen ter gehele of gedeeltelijke voldoening van vorderingen als
      bedoeld in [artikel 31, tweede lid][ref8];

      f. de bestuurlijke boeten, bedoeld in de [artikelen 9b][ref9] en [9c][ref10], alsmede de bijdragen en bestuurlijke
      boeten, bedoeld in [artikel 69][ref11];

      g. de bestuursrechtelijke premies, bedoeld in de [artikelen 18d][ref12] en [18e][ref13];

      h. de inkomsten die in verband met deze wet voortvloeien uit internationale overeenkomsten;

      i. de door de zorgautoriteit van verzekeraars op grond van
      [artikel 83 van de Wet marktordening gezondheidszorg][ref14] geïnde dwangsommen en de ingevorderde bestuurlijke
      boeten, bedoeld in de [artikelen 86 tot en met 89 van die wet][ref15];

      j.

      k. door zorgaanbieders ingevolge een regel van de zorgautoriteit op grond van
      [artikel 37, eerste lid, aanhef en onder d, van de Wet marktordening gezondheidszorg][ref16] dan wel op aanwijzing
      van de zorgautoriteit op grond van [artikel 76, tweede lid, van die wet][ref17] afgedragen bedragen en door de
      zorgautoriteit van zorgaanbieders op grond van [artikel 81, eerste lid, onder c, van die wet][ref18] ingevorderde
      bedragen, voor zover die bedragen niet worden afgedragen aan het Algemeen Fonds Bijzondere Ziektekosten of aan
      derden.

      3 Ten laste van het Zorgverzekeringsfonds komen:

      a. de bijdragen, bedoeld in de [artikelen 32][ref19], [33][ref20], [34][ref21] en [34a][ref22];

      b. subsidies als bedoeld in [artikel 68][ref23], inclusief vergoedingen als bedoeld in het
      [tweede lid van dat artikel][ref24];

      c. door het College zorgverzekeringen voldane vorderingen als bedoeld in [artikel 31, eerste lid][ref25];

      d. uitgaven in verband met molest als bedoeld in [artikel 55][ref26], inclusief vergoedingen als bedoeld in het
      [derde lid van dat artikel][ref27];

      e. de uitgaven die in verband met deze wet voortvloeien uit internationale overeenkomsten;

      f. uitkeringen als bedoeld in [artikel 118a][ref28] en de met de uitvoering van [dat artikel][ref29] gepaard gaande
      beheerskosten van het CAK;

      g. bedragen als bedoeld in [artikel 56a van de Wet marktordening gezondheidszorg][ref30];

      h. de door het College zorgverzekeringen op grond van een ministeriële regeling vastgestelde verdeelbedragen,
      zijnde aan de relevante zorgverzekeraars toegekende delen van de bedragen bedoeld in onderdeel k van het tweede
      lid.

      4 Uit het Zorgverzekeringsfonds kunnen, volgens bij ministeriële regeling te stellen regels, middelen worden
      gebruikt voor het vormen en in stand houden van een voor de doelstelling van het fonds noodzakelijke reserve.


