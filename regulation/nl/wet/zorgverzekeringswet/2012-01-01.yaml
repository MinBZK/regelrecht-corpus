  - number: '3'
    text: |-
      1 Een zorgverzekeraar is verplicht met of ten behoeve van iedere verzekeringsplichtige die in zijn werkgebied
      woont alsmede met of ten behoeve van iedere verzekeringsplichtige die in het buitenland woont, desgevraagd een
      zorgverzekering te sluiten.

      2 Indien een zorgverzekeraar in een provincie verschillende varianten van de zorgverzekering aanbiedt, kan voor
      iedere in die provincie wonende verzekeringsplichtige uit alle varianten worden gekozen.

      3 De zorgverzekeraar stelt alle varianten van de zorgverzekering die hij in een provincie aanbiedt, in de vorm
      van modelovereenkomsten ter beschikking aan personen die overwegen ten behoeve van een in die provincie wonende
      verzekeringsplichtige een zorgverzekering met die verzekeraar te sluiten, alsmede, indien de zorgverzekeraar
      varianten toevoegt of wijzigt, aan de verzekeringnemers die ten behoeve van een in die provincie wonende
      verzekeringsplichtige een zorgverzekering met hem hebben gesloten.

      4 In afwijking van het eerste lid is een zorgverzekeraar niet verplicht een zorgverzekering te sluiten met of ten
      behoeve van een verzekeringsplichtige:

      a. die reeds krachtens een zorgverzekering verzekerd is, of

      b. wiens eerdere zorgverzekering hij of de verzekeringnemer binnen een periode van vijf jaar, gelegen onmiddellijk
      voorafgaande aan het verzoek tot het sluiten van de verzekering, heeft opgezegd of ontbonden wegens:

      1°. opzettelijke misleiding door de verzekeringnemer of de verzekerde, of

      2°. het niet betalen van de premie, bedoeld in [artikel 17, vijfde lid][ref1].

      5 In afwijking van het tweede lid kan ten behoeve van een in het buitenland wonende verzekeringsplichtige worden
      gekozen tussen alle varianten van de zorgverzekering die een zorgverzekeraar in Nederland aanbiedt.

      6 In afwijking van het derde lid worden degene die ten behoeve van een in het buitenland wonende
      verzekeringsplichtige een zorgverzekering wenst te sluiten alle modelovereenkomsten die de zorgverzekeraar
      in Nederland hanteert ter beschikking gesteld, en worden, indien eenmaal een zorgverzekering is gesloten, de
      verzekeringnemer alle toegevoegde of gewijzigde varianten die die zorgverzekeraar aanbiedt ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel17
