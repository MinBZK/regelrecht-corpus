  - number: '70'
    text: |-
      1 Het College zorgverzekeringen opent voor iedere gemoedsbezwaarde, bedoeld in
      [artikel 2, tweede lid, onderdeel b][ref1], een rekening, waarop de geheven bijdragevervangende belasting, bedoeld
      in [artikel 57, eerste lid][ref2], wordt gestort.

      2 In afwijking van het eerste lid opent of houdt het College zorgverzekeringen één rekening in stand indien twee
      of meer gemoedsbezwaarden als bedoeld in [artikel 2, tweede lid, onderdeel b][ref3], een gezamenlijke huishouding
      voeren, en worden op die rekening de belastingen van ieder van deze gemoedsbezwaarden gestort.

      3 Tot de rekening is geen ander begunstigd dan het College zorgverzekeringen.

      4 Het saldo wordt door het College zorgverzekeringen gebruikt voor het doen van:

      a. uitkeringen ter vergoeding van kosten van zorg of overige diensten als bedoeld in [artikel 11][ref4], voor
      zover deze zijn verleend aan een gemoedsbezwaarde voor wie de rekening in stand wordt gehouden, of aan een tot zijn
      huishouding behorend kind, jonger dan achttien jaar;

      b. uitkeringen als bedoeld in [artikel 39, tweede lid, onderdeel d][ref5].

      5 Uitkeringen als bedoeld in het vierde lid, onderdeel a, worden slechts op verzoek van een gemoedsbezwaarde voor
      wie de rekening in stand wordt gehouden, gedaan.

      6 De kosten van zorg of overige diensten worden niet vergoed voor zover deze voor een verzekerde
      op grond van de regels, gesteld bij of krachtens de algemene maatregel van bestuur, bedoeld in
      [artikel 11, derde of vierde lid][ref6], voor eigen rekening blijven.

      7 Het College zorgverzekeringen heft een rekening op indien alle gemoedsbezwaarden voor wie de rekening in stand
      werd gehouden, verzekeringsplichtig zijn geworden dan wel zijn overleden.

      8 Indien een gemoedsbezwaarde een gezamenlijke huishouding is gaan vormen met een andere gemoedsbezwaarde, heft
      het College zorgverzekeringen een van de twee rekeningen op, onder overmaking van het saldo naar de overblijvende
      rekening.

      9 Het College zorgverzekeringen zorgt per gemoedsbezwaarde of huishouding, bedoeld in het tweede lid, voor een
      ordentelijke administratie van de stortingen op en de uitkeringen ten laste van de rekening.

      10 Bij ministeriële regeling kunnen ter zake van het bepaalde in het eerste tot en met negende lid nadere regels en
      uitvoeringsregels worden gegeven.

      11 Het College zorgverzekeringen is bevoegd de werkzaamheden, bedoeld bij of krachtens het eerste tot en met tiende
      lid, onder vergoeding van de daarmee gepaard gaande kosten, uit te besteden aan een of meer zorgverzekeraars.

      12

      13 Het College zorgverzekeringen gebruikt voor de uitvoering van dit artikel het burgerservicenummer of, bij
      ontbreken daarvan, het sociaal-fiscaalnummer van de gemoedsbezwaarde.


