  - number: '86'
    text: |-
      1 Tenzij de verzekerde daarover niet beschikt, neemt de zorgverzekeraar met het oog op de uitvoering van de
      zorgverzekering en van deze wet het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer
      van zijn verzekerde en, gedurende zeven jaren na het einde van de verzekering, van zijn gewezen verzekerde in zijn
      administratie op.

      2 De zorgverzekeraar stelt bij de eerste opname in zijn administratie en vervolgens indien daartoe
      aanleiding is het burgerservicenummer van de verzekerde vast met overeenkomstige toepassing van
      [artikel 7 van de Wet gebruik burgerservicenummer in de zorg][ref1]. Bij het ontbreken van het burgerservicenummer
      verifieert de zorgverzekeraar het sociaal-fiscaalnummer van de verzekerde indien daartoe aanleiding is.

      3 De zorgverzekeraar gebruikt het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer
      van de verzekerde met het doel te waarborgen dat de in het kader van de verzekering van zorg te verwerken
      persoonsgegevens op die verzekerde betrekking hebben.

      4 Bij gegevensuitwisseling tussen de zorgverzekeraars en de stichtingen, bedoeld in [artikel 14, derde lid][ref2],
      alsmede tussen de zorgverzekeraars en de in de [artikelen 88][ref3] en [89][ref4] genoemde personen en
      instanties wordt, voor zover die stichtingen, personen en instanties tot gebruik van dat nummer bevoegd zijn, het
      burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer gebruikt.

      5 Het vierde lid is van overeenkomstige toepassing op de gegevensuitwisseling tussen de
      zorgverzekeraars en de zorgaanbieders, indicatieorganen en zorgverzekeraars in de zin van de
      [Wet gebruik burgerservicenummer in de zorg][ref5] die niet in de [artikelen 88][ref6] en [89][ref7] zijn genoemd.

      6 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede
      lid.

      7 Bij ministeriële regeling kan worden bepaald aan welke beveiligingseisen de gegevensverwerking, bedoeld in het
      eerste, vierde en vijfde lid, voldoet.

      8 Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden over de bij de gegevensuitwisseling,
      bedoeld in het vierde en vijfde lid, te verwerken feiten of gegevens met betrekking tot verzekerden van wie
      het vaststellen van het burgerservicenummer of het sociaal-fiscaalnummer onmogelijk blijkt of een onevenredige
      inspanning kost. Bij of krachtens die maatregel kan worden bepaald aan welke beveiligingseisen de verwerking van
      die feiten of gegevens voldoet.

      9 Bij algemene maatregel van bestuur kunnen vormen van zorg of andere diensten als bedoeld in [artikel 11][ref8],
      alsmede categorieën van zorgverzekeraars, van stichtingen als bedoeld in [artikel 14, derde lid][ref9], en van in
      de [artikelen 88][ref10] en [89][ref11] genoemde personen en instanties worden uitgezonderd van de toepassing van
      het bepaalde bij of krachtens het eerste tot en met het achtste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel7
