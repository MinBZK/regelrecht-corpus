  - number: '36'
    text: |-
      Op rechten of verplichtingen die voortvloeien uit hetgeen in deze paragraaf geregeld is, is
      [titel 4.2 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel36
    references:
