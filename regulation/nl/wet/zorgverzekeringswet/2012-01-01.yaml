        artikel: 3:2
  - number: '64'
    text: |-
      1 Het College zorgverzekeringen bevordert de eenduidige uitleg van de aard, inhoud en omvang van de prestaties,
      bedoeld in [artikel 11][ref1].

      2 Het College zorgverzekeringen kan de zorgverzekeraars met het oog hierop richtlijnen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel64
