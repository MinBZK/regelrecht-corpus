  - number: 8a
    text: |-
      1 Nadat de zorgverzekeraar de verzekeringnemer heeft aangemaand tot betaling van een of meer vervallen termijnen
      van de verschuldigde premie, kan de verzekeringnemer gedurende de tijd dat de verschuldigde premie, rente en
      incassokosten niet zijn voldaan, de zorgverzekering niet opzeggen, tenzij de zorgverzekeraar de zorgverzekering of
      de dekking daarvan heeft geschorst of opgeschort.

      2 Het eerste lid lijdt uitzondering indien de zorgverzekeraar de verzekeringnemer binnen twee weken te kennen geeft
      de opzegging te bevestigen.
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel8a
  - number: '9'
    text: |-
      1 De zorgverzekeraar verstrekt de verzekeringnemer en, indien deze een ander is dan de verzekeringnemer, de
      verzekerde zo spoedig mogelijk na het sluiten van de zorgverzekering en vervolgens voorafgaande aan ieder
      kalenderjaar een zorgpolis.

      2 Indien de zorgverzekering eindigt, verstrekt de zorgverzekeraar de verzekeringnemer en, indien deze een ander is
      dan de verzekeringnemer, de verzekerde een bewijs van het einde van de zorgverzekering, waarop worden aangetekend:

      a. naam, adres, woonplaats en burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer van
      de verzekerde;

      b. naam, adres en woonplaats van de verzekeringnemer;

      c. naam, adres en woonplaats van de zorgverzekeraar;

      d. de dag waarop de zorgverzekering eindigt;

      e. of voor de verzekerde op die dag een vrijwillig eigen risico gold en zo ja, met welke ingangsdatum, voor welk
      bedrag en met welke in verband daarmee verleende korting.

      3 Indien de zorgverzekering eindigt om de in [artikel 6, eerste lid, onderdeel d][ref1], genoemde reden, wordt dat
      op het in het tweede lid bedoelde bewijs aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel6
    url: https://wetten.overheid.nl/BWBR0018450/2012-01-01#Artikel9
