        paragraaf: '2.1'
  - number: '7'
    text: |-
      1 De houder van een DOA-JA zal voorstellen voor wijzigingen van zijn DOA-JA, zoals gesteld in de eisen van JAR
      21.A247, 21.A249 en 21.A253, zo snel mogelijk aan de minister ter goedkeuring voorleggen.

      2 De minister kan extra voorwaarden stellen aan het functioneren van de houder van een DOA-JA tot de gemelde
      wijziging is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel7
  - number: '8'
    text: |-
      1 Een DOA-JA wordt gewijzigd, nadat de houder heeft aangetoond, dat ook na de wijziging aan de voor de verkrijging
      van een DOA-JA gestelde voorwaarden wordt voldaan.

      2 De [artikelen 3][ref1] en [4][ref2] zijn van toepassing, met dien verstande dat kan worden volstaan met de
      gegevens, die voor de aangevraagde wijziging relevant zijn.

      3 Bij wijziging wordt zo nodig een nieuw bewijs van erkenning afgegeven.

      4 Een aanvraag om wijziging wordt uiterlijk vier weken voor de gewenste datum van wijziging ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012877#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012877#Artikel4
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012877
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
