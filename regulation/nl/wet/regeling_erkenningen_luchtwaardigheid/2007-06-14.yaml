    text: |-
      1 Het handboek van de aanvrager bevat in ieder geval de informatie die is voorgeschreven in de bij deze regeling
      behorende [bijlage A][ref1].

      2 De wijzigingen in het handboek worden zo spoedig mogelijk aan de minister gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0012877
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel54
