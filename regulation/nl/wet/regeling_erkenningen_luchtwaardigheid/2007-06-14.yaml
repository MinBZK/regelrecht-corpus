      1 De erkende inspecteur deelt de minister onverwijld iedere wijziging van de bij de laatst ingediende aanvraag
      verstrekte gegevens volgens [artikel 47, eerste lid, onder b tot en met e][ref1].

      2 De minister kan voorwaarden stellen waaronder de in het eerste lid bedoelde wijzigingen worden geaccepteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012877#Artikel47
