    text: |-
      1 Degene, die een aanvraag voor erkend inspecteur heeft ingediend, wordt erkend, nadat hij heeft aangetoond, dat
      hij

      a. aan de erkenningsvoorwaarden opgenomen in de bij deze regeling behorende [bijlage A][ref1] voldoet, en

      b. wordt voorgedragen door de onderneming waarvoor hij werkzaamheden verricht.

      2 De aanvraag wordt ingediend door middel van volledig ingevulde en ondertekende formulieren, waarvan de exemplaren
      kosteloos bij de minister zijn te verkrijgen.


