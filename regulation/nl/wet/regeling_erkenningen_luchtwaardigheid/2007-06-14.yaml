  - number: '2'
    text: |-
      De minister neemt een aanvraag voor een DOA-JA in behandeling wanneer de aanvrager voldoet aan de eisen van JAR
      21.A233.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel2
  - number: '3'
    text: |-
      1 Degene, die een aanvraag voor een DOA-JA heeft ingediend, wordt erkend wanneer hij aantoont, dat hij:

      a. voldoet aan JAR-21, subpart JA, zoals deze luidt met ingang van 27 juli 1998, en

      b. in Nederland is gevestigd.

      2 De aanvraag wordt ingediend door de functionaris van het bedrijf, die de eindverantwoordelijkheid draagt ten
      aanzien van het door het bedrijf gevoerde beleid.

      3 De aanvraag wordt ingediend door middel van volledig ingevulde en ondertekende formulieren, waarvan de exemplaren
      kosteloos bij de minister zijn te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel3
  - number: '4'
    text: |-
      Bij de aanvraag voor een DOA-JA verstrekt de aanvrager de volgende gegevens:

      a. een korte levensbeschrijving van de functionarissen, bedoeld in JAR-21.A243(d), waarin in ieder geval opleiding,
      ervaring en vorige functies zijn opgenomen;

      b. een exemplaar van het handboek bedoeld in JAR-21.A243;

      c. een uittreksel, niet ouder dan drie maanden, uit het register van de Kamer van Koophandel en Fabrieken;

      d. een zelfevaluatie, waarin de aanvrager per bepaling van de van toepassing zijnde regelgeving aantoont hoe
      daaraan wordt voldaan, en waar dit in het handboek staat beschreven.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel4
  - number: '5'
    text: |-
      1 Van de DOA-JA wordt een bewijs afgegeven, dat vermeldt tot welke datum de DOA-JA geldig is.

      2 Het model van het bewijs van erkenning is opgenomen in de bij deze regeling behorende [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012877
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012877
  - number: '6'
    text: |-
      1 Ten aanzien van verlenging van een DOA-JA zijn de [artikelen 3][ref1] en [4][ref2] van toepassing, met dien
      verstande dat kan worden volstaan met aan te geven, welke veranderingen zich hebben voorgedaan ten aanzien van de
      gegevens, die voor de laatst verleende erkenning zijn ingediend.

      2 Teneinde de erkenning tijdig te kunnen verlengen, moet de aanvraag hiertoe uiterlijk acht weken, doch niet eerder
      dan twaalf weken voor de in [artikel 5][ref3] bedoelde datum worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012877#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012877#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0012877#Artikel5
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel6
