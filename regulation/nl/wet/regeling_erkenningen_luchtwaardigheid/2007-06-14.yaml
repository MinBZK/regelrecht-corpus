  - number: '52'
    text: |-
      1 De gehele of gedeeltelijke schorsing van de erkenning als erkend inspecteur door de minister wordt bij
      aangetekende brief aan de houder medegedeeld, met een kopie aan de in [artikel 46 onder 1.b][ref1] genoemde
      persoon.

      2 Vanaf het tijdstip van schorsing mag de houder die bevoegdheden, waarop de schorsing van de erkenning als erkend
      inspecteur betrekking heeft, niet uitoefenen.

      3 Om een schorsing op te heffen wordt aan de minister aangetoond, dat de omstandigheden, die tot schorsing hebben
      geleid, zijn opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0012877#Artikel46
