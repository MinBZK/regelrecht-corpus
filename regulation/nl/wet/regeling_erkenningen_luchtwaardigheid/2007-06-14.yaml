  - number: '49'
    text: |-
      1 Ten aanzien van de verlenging van een erkend inspecteur zijn de [artikelen 46][ref1] en [47][ref2] van
      toepassing, met dien verstande dat:

      a. kan worden volstaan met aan te geven, welke veranderingen zich hebben voorgedaan ten aanzien van de gegevens,
      die voor de laatst verleende erkenning zijn ingediend; en

      b. de erkende inspecteur gedurende de voorafgaande termijn van geldigheid van de erkenning, de werkzaamheden
      waarvoor hij is erkend, in voldoende mate heeft verricht.

      2 Teneinde de erkenning tijdig te kunnen verlengen, moet de aanvraag hiertoe uiterlijk acht weken, doch niet eerder
      dan twaalf weken voor de in [artikel 48][ref3] bedoelde datum worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012877#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0012877#Artikel47
