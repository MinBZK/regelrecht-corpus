    text: |-
      1 Gehele of gedeeltelijke schorsing van de MOA wordt bij aangetekende brief aan de houder medegedeeld.

      2 Vanaf het tijdstip van schorsing mag de houder die bevoegdheden, waarop de schorsing van de MOA betrekking heeft,
