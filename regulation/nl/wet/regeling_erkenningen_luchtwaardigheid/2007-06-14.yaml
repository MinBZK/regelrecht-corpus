  - number: '38'
    text: |-
      1 De houder van een MOA zal voorstellen voor wijziging van de MOA overeenkomstig JAR 145.85 vooraf aan de minister
      voorleggen, zodat deze het blijven voldoen aan JAR 145 kan vaststellen.

      2 De minister kan voorwaarden stellen waaronder de houder van de MOA zijn activiteiten kan voortzetten gedurende de
      periode van wijziging, tenzij de minister bepaalt dat de erkenning voor die periode wordt geschorst.

      3 De houder van een MOA informeert bij wijziging van het handboek van de onderhoudsorganisatie overeenkomstig JAR
      145.70 de minister.

      4 De minister kan voorwaarden stellen waaronder wijzigingen van het handboek van de onderhoudsorganisatie worden
      geaccepteerd.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel38
  - number: '39'
    text: |-
      1 Een MOA wordt gewijzigd, nadat de houder heeft aangetoond, dat ook na de invoering van de wijziging aan de voor
      de verkrijging van een MOA gestelde voorwaarden wordt voldaan.

      2 De [artikelen 34][ref1] en [35][ref2] zijn van toepassing, met dien verstande dat: kan worden volstaan met de
      gegevens, die voor de aangevraagde wijziging relevant zijn.

      3 Bij wijziging wordt zo nodig een nieuw bewijs van erkenning afgegeven.

      4 Een aanvraag om wijziging wordt uiterlijk vier weken voor de gewenste datum van wijziging ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012877#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0012877#Artikel35
