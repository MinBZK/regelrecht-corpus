articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - Airworthiness Review: een Review zoals gedefinieerd in
      [artikel 1, tweede lid, van de Regeling verlenging bewijzen van luchtwaardigheid][ref1];
        - Airworthiness Review Certificate (ARC): een certificaat zoals gedefinieerd in
      [artikel 5.a, eerste lid, van de Regeling standaard-BvL][ref2];
        - autoriseringspersoneel: personeel dat door de houder van een erkenning volgens een door de minister aanvaarde
      procedure is gemachtigd geluidsmeetrapporten af te geven nadat geluidsmetingen zijn verricht;
        - certificeringspersoneel: personeel dat door de houder van een erkenning volgens een door de minister aanvaarde
      procedure is gemachtigd luchtvaartuigen of onderdelen daarvan als geschikt voor gebruik te certificeren;
        - Continuous Airworthiness Management Organisation (CAMO): een organisatie zoals gedefinieerd in
      [artikel 5.a, eerste lid, van de Regeling standaard-BvL][ref3];
        - ernstig defect of gebrek: defect of gebrek van zodanige aard, dat als gevolg hiervan de veilige uitvoering van de
      vlucht niet meer is gewaarborgd of een ernstige verwonding van een inzittende tot gevolg kan hebben of zijn leven
      in gevaar kan brengen;
        - EZT: onderhoudstechnicus voor zweefvliegtuigen of motorzweefvliegtuigen, die door de minister is erkend voor de
      werkzaamheden, die in het bewijs van erkenning zijn genoemd (erkend zweefvliegtechnicus);
        - houder van een erkenning: natuurlijk of rechtspersoon, erkend door de minister voor de werkzaamheden die zijn
      opgenomen in het bewijs van erkenning;
        - kleine luchtvaart: luchtvaartuigen vallende onder Verordening (EG) nr. 1592/2002 (PbEG L 240) en geclassificeerd
      als vliegtuigen met een maximaal toelaatbare startmassa van 5700 kg of minder, eenmotorige helikopters of
      ballonnen;
        - kwaliteitssysteem: stelsel van vastgelegde bedrijfskundige procedures, regels en voorzieningen dat betrekking
      heeft op het productieproces en ten doel heeft te verzekeren dat de resultaten van het productieproces aan de
      vooraf gestelde eisen voldoen;
        - de kwaliteitsborging: het aantoonbaar op het vereiste peil houden van het kwaliteitssysteem;
        - kwaliteitsborgingsfunctie: inspectie- en kwaliteitsorganisatie, aanvaard door de minister voor het houden
      van toezicht en het beoordelen van de kwaliteit van de werkzaamheden, teneinde het vereiste kwaliteitsniveau te
      handhaven;
        - luchtwaardigheidsgegevens: alle informatie die nodig is om ervoor te zorgen dat het luchtvaartuig of het
      onderdeel daarvan in een zodanige staat kan worden gehouden dat de luchtwaardigheid van het luchtvaartuig of het
      goed functioneren van de operationele uitrusting of de nooduitrusting verzekerd is;
        - Maintenance Organisation Approval volgens Part M, subpart F (MOA-F): erkende onderhoudsorganisatie voor het
      uitvoeren van onderhoud aan luchtvaartuigen uit de kleine luchtvaart;
        - minister: Minister van Verkeer en Waterstaat;
        - Part M: Part zoals gedefinieerd in
      [artikel 1, tweede lid, van de Regeling verlenging bewijzen van luchtwaardigheid][ref4];
        - Part M, subpart F: onderdeel van Part M waarin de eisen en de procedures worden vastgelegd voor het verkrijgen
      van een MOA-F;
        - Part M, subpart G: onderdeel van Part M waarin de eisen en de procedures worden vastgelegd voor het verkrijgen
      van een CAMO-erkenning.

      2 In deze regeling wordt onder productie mede verstaan: het verrichten van diensten.


