  - number: '47'
    text: |-
      Bij de aanvraag voor erkenning als erkend inspecteur verstrekt de aanvrager de volgende gegevens:

      a. een korte levensbeschrijving van de aanvrager waarin in ieder geval opleiding, ervaring en vroegere functies
      zijn opgenomen;

      b. een opgave van de werkzaamheden, welke de aanvrager zal gaan uitvoeren onder de erkenning;

      c. een exemplaar van het handboek, bedoeld in de bij deze regeling behorende [bijlage A][ref1];

      d. een exemplaar van te gebruiken modellen van de verklaringen;


      [ref1]: https://wetten.overheid.nl/BWBR0012877
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel47
