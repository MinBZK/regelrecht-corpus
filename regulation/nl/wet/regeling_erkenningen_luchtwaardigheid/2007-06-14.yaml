  - number: '66'
    text: |-
      De EZT bewaart de volgende gegevens ten minste gedurende de aangegeven termijn:

      a. De tekeningen, specificaties en overige gegevens met betrekking tot onderhoud uitgevoerde werkzaamheden aan
      luchtvaartuigen en onderdelen: 2 jaren na beëindiging van de werkzaamheden;

      b. ontvangen certificaten van vrijgave voor gebruik en verklaringen van conformiteit voor materialen of onderdelen:
      2 jaren na verwerking ervan.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel66
  - number: '67'
    text: |-
      1 De EZT meldt een defect of gebrek zo spoedig mogelijk, doch in elk geval binnen 72 uur na de ontdekking ervan,
      schriftelijk aan de minister.

      2 De melding gaat vergezeld van een zo volledig mogelijke beschrijving van hetgeen werd gevonden en een opgave van
      de overige van belang zijnde gegevens.

      3 Indien er sprake is van een ernstig defect of gebrek meldt de EZT het ernstig defect of gebrek onmiddellijk aan
      de minister.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel67
  - number: '68'
    text: |-
      Indien naar het oordeel van de minister, een verbetering van het kwaliteitssysteem noodzakelijk is, treft
      de EZT, met inachtneming van de door de minister gegeven aanwijzingen, maatregelen ter verbetering van het
      kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel68
  - number: '69'
    text: |-
      De minister publiceert periodiek de volgende gegevens van de houders van een erkenning als EZT:

      a. naam;

      b. vestigingsplaats of -plaatsen;

      c. omschrijving van de werkzaamheden, waarvoor de houder van een erkenning als EZT is erkend.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel69
  - number: '70'
    text: |-
      1 De aanvrager wordt erkend nadat het ten genoegen van de minister heeft aangetoond, dat::

      a. hij aan de erkenningsvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage C][ref1] bij deze
      regeling voldoet;

      b. hij in Nederland is gevestigd;

      c. hij in voldoende mate materialen of onderdelen levert die de luchtwaardigheid van luchtvaartuigen kunnen
      beïnvloeden;

      d. de aangevraagde erkenning niet uitsluitend betrekking heeft op materialen of onderdelen, die geleverd zullen
      worden aan daarvoor reeds erkende bedrijven, zodat de productie binnen het kader van de erkenning van die bedrijven
      zou kunnen plaatsvinden.

      2 De aanvraag wordt ingediend door de functionaris van het bedrijf, die de eindverantwoordelijkheid draagt ten
      aanzien van het door het bedrijf gevoerde beleid.

      3 De aanvraag wordt ingediend door middel van volledig ingevulde en ondertekende formulieren, waarvan de exemplaren
      kosteloos bij de minister zijn te verkrijgen.

      4 De aanvrager die in aanmerking wenst te komen voor een erkenning ten behoeve van productiewerkzaamheden en
      niet aan de eisen van JAR 21.133 voldoet, kan in afwijking van het eerste lid onderdeel a) eveneens worden erkend
      wanneer hij voldoet aan de eisen voor een POA. [Hoofdstuk 4][ref2] met uitzondering van [artikel 22][ref3] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012877
      [ref2]: https://wetten.overheid.nl/BWBR0012877#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0012877#Artikel22
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0012877
      - id: ref2
        bwb_id: BWBR0012877
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0012877
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '71'
    text: |-
      Bij de aanvraag verstrekt de aanvrager de volgende gegevens:

      a. een korte levensbeschrijving van de aanvrager, het hoofd van de kwaliteitsafdeling, de gemachtigden, alsmede
      overige leden van het personeel die met betrekking tot de erkenning van het bedrijf een belangrijke functie
      vervullen, waarin in ieder geval opleiding, ervaring en vroegere functies zijn opgenomen;

      b. een globale opsomming van de werkzaamheden, die het bedrijf uitbesteedt aan andere bedrijven;

      c. een opgave van de (vermoedelijke) opdrachtgevers (afnemers) van de resultaten van het productieproces ten
      behoeve waarvan een erkenning wordt aangevraagd;

      d. een exemplaar van het handboek, bedoeld in de bij deze regeling behorende [bijlage C][ref1];

      e. een exemplaar van te gebruiken modellen van het certificaat van vrijgave en het certificaat van vrijgave voor
      gebruik;

      f. een uittreksel, niet ouder dan drie maanden, uit het register van de Kamer van Koophandel en Fabrieken;

      g. een zelfevaluatie, waarin de aanvrager per bepaling van de van toepassing zijnde regelgeving aantoont hoe
      daaraan wordt voldaan, en waar dit in het handboek staat beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0012877
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel71
