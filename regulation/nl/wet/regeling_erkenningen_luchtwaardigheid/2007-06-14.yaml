    text: |-
      1 De gehele of gedeeltelijke intrekking van de erkenning als erkend inspecteur door de minister wordt bij
      aangetekende brief aan de houder medegedeeld, met een kopie aan de in [artikel 46 onder 1.b][ref1] genoemde
      persoon.

      2 Vanaf het tijdstip van schorsing mag de houder die bevoegdheden, waarop de intrekking van de erkenning als erkend
      inspecteur betrekking heeft, niet uitoefenen.

      3 De erkend inspecteur is verplicht het bewijs van erkenning zo spoedig mogelijk aan de minister te zenden.

      4 De minister neemt het bewijs van erkenning in en geeft, in geval van gedeeltelijke intrekking, een nieuw bewijs
      van erkenning af.


