        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '9'
    text: |-
      1 Gehele of gedeeltelijke schorsing van de DOA-JA wordt bij aangetekende brief aan de houder medegedeeld.

      2 Vanaf het tijdstip van schorsing mag de houder die bevoegdheden, waarop de schorsing van de DOA-JA betrekking
      heeft, niet uitoefenen.

      3 Om een schorsing op te heffen toont de houder aan, dat de redenen, die tot schorsing hebben geleid, zijn
      vervallen.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel9
  - number: '10'
    text: |-
      1 Gehele of gedeeltelijke intrekking van de DOA-JA wordt bij aangetekende brief aan de houder medegedeeld.

      2 Vanaf het tijdstip van intrekking mag de houder die bevoegdheden, waarop de intrekking van de DOA-JA betrekking
      heeft, niet uitoefenen.

      3 De houder van de DOA-JA is verplicht het bewijs van erkenning zo spoedig mogelijk aan de minister te zenden.

      4 De minister neemt het bewijs van erkenning in en geeft, in geval van gedeeltelijke intrekking, een nieuw bewijs
      van erkenning af.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel10
  - number: '11'
    text: |-
      De minister publiceert in Aeronautical Information Circular series B, periodiek de volgende gegevens van de houders
      van een DOA-JA:

      a. naam;

      b. vestigingsplaats of -plaatsen;

      c. omschrijving van de werkzaamheden, waarvoor de houder van een DOA-JA is erkend.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel11
