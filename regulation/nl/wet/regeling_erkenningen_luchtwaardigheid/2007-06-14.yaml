    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel40
  - number: '41'
    text: |-
      1 Gehele of gedeeltelijke intrekking van de MOA wordt bij aangetekende brief aan de houder medegedeeld.

      2 Vanaf het tijdstip van intrekking mag de houder die bevoegdheden, waarop de intrekking van de MOA betrekking
      heeft, niet uitoefenen.

      3 De houder van de MOA is verplicht het bewijs van erkenning zo spoedig mogelijk aan de minister te zenden.

      4 De minister neemt het bewijs van erkenning in en geeft, in geval van gedeeltelijke intrekking, een nieuw bewijs
      van erkenning af.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel41
  - number: '42'
    text: |-
      De houder van een MOA mag slechts dat onderhoud uitvoeren, wanneer de voor dat onderhoud benodigde faciliteiten,
      uitrusting, gereedschappen, materialen en onderdelen, luchtwaardigheidsgegevens en certificeringspersoneel
      beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel42
  - number: '43'
    text: |-
      1 De houder van een MOA zorgt voor een door de minister geaccepteerde administratie en archiveringssysteem waarin
      alle gegevens van het uitgevoerde werk, inclusief die van zijn onderaannemers of andere externe partijen die zijn
      betrokken bij het onderhoud, worden behandeld volgens JAR 145.55.

      2 De gegevens worden ten minste voor periode van twee jaar na afgifte van het certificaat van vrijgave of het
      certificaat van vrijgave voor gebruik bewaard.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel43
  - number: '44'
    text: |-
      De houder van een MOA zal de te melden staat van een product of onderdeel die het luchtvaartuig ernstig in gevaar
      kan brengen schriftelijk en uiterlijk binnen 72 uur na constatering aan de minister melden.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel44
  - number: '45'
    text: |-
      De minister publiceert periodiek de volgende gegevens van de houders van een MOA:

      a. naam;

      b. vestigingsplaats of -plaatsen;

      c. omschrijving van de werkzaamheden, waarvoor de houder van een MOA is erkend.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel45
  - number: 45.a
    text: |-
      1 De Minister verstrekt op aanvraag een MOA-F wanneer de aanvrager voldoet aan het bepaalde van Part M, Subpart F.

      2 De aanvraag wordt ingediend door de functionaris van het bedrijf, die de eindverantwoordelijkheid draagt ten
      aanzien van het door het bedrijf gevoerde beleid.

      3 De aanvraag wordt ingediend door middel van volledig ingevulde en ondertekende formulieren, waarvan de exemplaren
      kosteloos bij de Minister zijn te verkrijgen.

      4 Bij de aanvraag voor een MOA-F verstrekt de aanvrager:

      a. de volgens Part M, Subpart F in te dienen gegevens,

      b. een uittreksel, niet ouder dan drie maanden, uit het register van de Kamer van Koophandel en Fabrieken en

      c. een zelfevaluatie, waarin de aanvrager per bepaling van de van toepassing zijnde regelgeving aantoont hoe
      daaraan wordt voldaan, en waar dit in het handboek staat beschreven.

      5 Van de MOA-F wordt een bewijs afgegeven volgens Part M, Subpart F van Bijlage 1 bij Verordening (EG)
      nr. 2042/2003.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel45.a
  - number: 45.b
    text: |-
      1 De houder van een MOA-F zal voorstellen voor wijziging van de organisatie van de MOA-F overeenkomstig Part M,
      Subpart F vooraf aan de Minister voorleggen, zodat deze het blijven voldoen aan Part M, Subpart F kan vaststellen.

      2 De Minister kan voorwaarden stellen waaronder de houder van de MOA-F zijn activiteiten kan voortzetten gedurende
      de periode van wijziging, tenzij de Minister bepaalt dat de erkenning voor die periode wordt geschorst.

      3 De houder van een MOA-F informeert bij wijziging van het handboek van de onderhoudsorganisatie overeenkomstig
      Part M, Subpart F de Minister.

      4 De Minister kan voorwaarden stellen waaronder wijzigingen van het handboek van de onderhoudsorganisatie worden
      geaccepteerd.

      5 Een MOA-F wordt gewijzigd, nadat de houder heeft aangetoond, dat ook na de invoering van de wijziging aan de voor
      de verkrijging van een MOA-F gestelde voorwaarden wordt voldaan.

      6 [Artikel 45.a][ref1] is van toepassing, met dien verstande dat kan worden volstaan met de gegevens, die voor de
      aangevraagde wijziging relevant zijn.

      7 Een aanvraag om wijziging wordt uiterlijk vier weken voor de gewenste datum van wijziging ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012877#Artikel45.a
