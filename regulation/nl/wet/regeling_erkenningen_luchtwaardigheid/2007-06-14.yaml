  - number: '74'
    text: |-
      1 De houder van een erkenning bereidt wijzigingen in het functioneren van de organisatie zodanig voor en voert deze
      zo uit, dat het kwaliteitssysteem van de houder van de erkenning aantoonbaar in stand en effectief blijft.

      2 In de volgende gevallen moet het de houder van een erkenning een aanvraag voor acceptatie van wijziging van de
      bij de oorspronkelijke aanvraag verstrekte gegevens indienen:

      a. bij een belangrijke wijziging in het volume van de productie, ten behoeve waarvan het bedrijf is erkend;

      b. bij een wijziging in het kwaliteitsbeleid;

      c. bij een belangrijke wijziging van de organisatie;

      d. bij een wijziging van de erkenningaanvrager, de leiding van de kwaliteitsafdeling of de technische leiding van
      het bedrijf;

      e. bij een wijziging in de lijst van gemachtigden, tenzij anderszins met het bedrijf is overeengekomen;

      f. bij een belangrijke wijziging in de toegepaste werkwijzen;

      g. bij verandering in de behuizing en de uitrusting van het bedrijf.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel74
  - number: '75'
    text: |-
      1 Een aanvraag tot wijziging, wordt door de minister goedgekeurd, nadat is aangetoond, dat het bedrijf ook na de
      invoering van de wijziging aan de voor de verkrijging van een erkenning gestelde voorwaarden zal blijven voldoen.

      2 De [artikelen 70][ref1] en [71][ref2] zijn van toepassing, met dien verstande dat kan worden volstaan met de
      gegevens, die voor de aangevraagde wijziging relevant zijn.

      3 Bij wijziging wordt zo nodig een nieuw bewijs van erkenning afgegeven.

      4 Een aanvraag om wijziging wordt uiterlijk vier weken voor de gewenste datum van wijziging ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012877#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0012877#Artikel71
