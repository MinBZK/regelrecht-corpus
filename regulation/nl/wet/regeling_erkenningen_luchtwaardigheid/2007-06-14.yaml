  - number: '55'
    text: |-
      De erkend inspecteur bewaart de verklaringen van overeenstemming met de luchtwaardigheidseisen met betrekking tot
      de door hem verrichtte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel55
  - number: '56'
    text: |-
      Indien naar het oordeel van de minister, een verbetering van het kwaliteitssysteem noodzakelijk is, treft de
      erkende inspecteur, met inachtneming van de door de minister gegeven aanwijzingen, maatregelen ter verbetering van
      het kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel56
  - number: '57'
    text: |-
      1 Degene, die een aanvraag voor EZT heeft ingediend, wordt erkend, nadat hij door tussenkomst van de
      kwaliteitsborgingsfunctie heeft aangetoond, dat hij

      a. aan de erkenningsvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage B][ref1] voldoet, en

      b. wordt voorgedragen door de zweefvliegclub waarvoor hij werkzaamheden gaat verrichten.

      2 De aanvraag wordt ingediend door middel van volledig ingevulde en ondertekende formulieren, waarvan de exemplaren
      kosteloos bij de minister zijn te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0012877
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0012877
  - number: '58'
    text: |-
      Bij de aanvraag voor erkenning als EZT verstrekt de aanvrager de volgende gegevens:

      a. een korte levensbeschrijving van de aanvrager en de uitvoerder van de kwaliteitsborgingsfunctie, waarin in ieder
      geval opleiding, ervaring en vroegere functies zijn opgenomen;

      b. een afschrift van de overeenkomst met de uitvoerder van de kwaliteitsborgingsfunctie;

      c. een opgave van de werkzaamheden, welke de aanvrager zal uitbesteden aan derden;

      d. een opgave van de werkzaamheden, welke de aanvrager zal gaan uitvoeren onder de erkenning;

      e. een exemplaar van het handboek, bedoeld in bij deze regeling behorende [bijlage B][ref1];

      f. een exemplaar van te gebruiken modellen van het certificaat van vrijgave en het certificaat van vrijgave voor
      gebruik;

      g. een evaluatieadvies van de kwaliteitsborgingsfunctie ten aanzien van de gevraagde erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0012877
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0012877
  - number: '59'
    text: |-
      1 Van de erkenning als EZT wordt een bewijs afgegeven, dat vermeldt tot welke datum de erkenning geldig is.

      2 Het model van het bewijs van erkenning is opgenomen in de bij deze regeling behorende [bijlage 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012877
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel59
