      2 De aanvrager zendt wijzigingen in het handboek zo spoedig mogelijk aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0012877
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel91
