  - number: '76'
    text: |-
      1 De gehele of gedeeltelijke schorsing van de erkenning wordt bij aangetekende brief aan de houder medegedeeld.

      2 Vanaf het tijdstip van schorsing mag de houder die bevoegdheden, waarop de schorsing van de erkenning betrekking
      heeft, niet uitoefenen.

      3 Om een schorsing op te heffen wordt aan de minister aangetoond, dat de omstandigheden, die tot schorsing hebben
      geleid, zijn opgeheven.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel76
  - number: '77'
    text: |-
      1 De gehele of gedeeltelijke intrekking van de erkenning door de minister wordt bij aangetekende brief aan de
      houder medegedeeld.

      2 Vanaf het tijdstip van intrekking mag de houder die bevoegdheden, waarop de intrekking van de erkenning
      betrekking heeft, niet uitoefenen.

      3 De houder van de erkenning is verplicht het bewijs van erkenning zo spoedig mogelijk aan de minister te zenden.

      4 De minister neemt het bewijs van erkenning in en geeft, in geval van gedeeltelijke intrekking, een nieuw bewijs
      van erkenning af.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel77
  - number: '78'
    text: |-
      1 Het handboek van de aanvrager bevat in ieder geval de informatie die is voorgeschreven in de bij deze regeling
      behorende [bijlage C][ref1].

      2 In door de minister te bepalen gevallen beschikt de aanvrager over een centraal handboek. Het centrale handboek
      bevat de hoofdlijnen van en verwijzingen naar het handboek.

      3 De aanvrager zendt wijzigingen in het handboek zo spoedig mogelijk aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0012877
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0012877
  - number: '79'
    text: |-
      De houder van een erkenning bewaart de volgende gegevens ten minste gedurende de aangegeven termijn:

      a. de tekeningen, specificaties en overige gegevens met betrekking tot de vervaardigde onderdelen of producten: 10
      jaren nadat het laatste onderdeel of product is afgeleverd;

      b. de inspectie-, keurings-, en beproevingsgegevens met betrekking tot de vervaardigde onderdelen of producten: 10
      jaren na de aflevering;

      c. de gegevens met betrekking tot onderhoud van onderdelen of producten: 10 jaren na het beëindigen van de
      werkzaamheden;

      d. de administratie betreffende de afgegeven certificaten van vrijgave en certificaten van vrijgave voor gebruik:
      10 jaren na de autorisatie daarvan;

      e. de ontvangen certificaten van vrijgave voor gebruik of verklaringen van conformiteit voor materialen of
      onderdelen, welke van derden zijn betrokken: 10 jaren na de verwerking van deze materialen of onderdelen.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel79
  - number: '80'
    text: |-
      1 De houder van een erkenning meldt ernstige tekortkomingen die tijdens het productieproces ontstaan, een ernstig
      defect of gebrek zo spoedig mogelijk, doch in elk geval binnen 72 uur na de ontdekking of het bekend worden ervan,
      schriftelijk aan de minister.

      2 De melding gaat vergezeld van een zo volledig mogelijke beschrijving van hetgeen werd gevonden en een opgave van
      de overige van belang zijnde gegevens.

      3 Indien er sprake is van direct gevaar voor het veilig gebruik of de inzittende, meldt de houder van een erkenning
      de tekortkoming, het ernstig defect of gebrek onmiddellijk aan de minister.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel80
  - number: '81'
    text: |-
      Indien naar het oordeel van de minister een verbetering van het kwaliteitssysteem noodzakelijk is, treft de houder
      van een erkenning, met inachtneming van de door de minister gegeven aanwijzingen, maatregelen ter verbetering van
      het kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel81
  - number: '82'
    text: |-
      De minister publiceert periodiek de volgende gegevens van de houders van een erkenning:

      a. naam;

      b. vestigingsplaats of -plaatsen;

      c. omschrijving van de werkzaamheden, waarvoor de houder van een erkenning is erkend.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel82
  - number: '83'
    text: |-
      1 De aanvrager wordt erkend nadat deze ten genoegen van de minister heeft aangetoond, dat hij:

      a. aan de erkenningsvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage D][ref1] voldoet;

      b. in Nederland is gevestigd.

      2 De aanvraag wordt ingediend door de functionaris van de organisatie, die de eindverantwoordelijkheid draagt ten
      aanzien van het door de organisatie gevoerde beleid.

      3 De aanvraag wordt ingediend door middel van volledig ingevulde en ondertekende formulieren, waarvan de exemplaren
      kosteloos bij de minister verkrijgbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0012877
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0012877
  - number: '84'
    text: |-
      Bij de aanvraag verstrekt de aanvrager de volgende gegevens:

      a. een korte levensbeschrijving van de aanvrager, de uitvoerder van de kwaliteitsborgingsfunctie, en het
      autoriseringspersoneel, waarin in ieder geval opleiding, ervaring en vroegere functies zijn opgenomen;

      b. in het geval van een eenmansorganisatie, een afschrift van de overeenkomst met de uitvoerder van de
      kwaliteitsborgingsfunctie;

      c. een exemplaar van het handboek, bedoeld in artikel 16 van de bij deze regeling behorende [bijlage D][ref1];

      d. een exemplaar van te gebruiken modellen van het geluidsmeetrapport;

      e. een uittreksel, niet ouder dan drie maanden, uit het register van de Kamer van Koophandel en Fabrieken indien de
      organisatie aldaar is ingeschreven, of in het geval van een eenmansorganisatie, een uittreksel, niet ouder dan drie
      maanden uit de gemeentelijke basisadministratie persoonsgegevens;

      f. een zelfevaluatie, waarin de aanvrager per bepaling van de van toepassing zijnde regelgeving aantoont hoe
      daaraan wordt voldaan, en waar dit in het handboek staat beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0012877
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0012877
  - number: '85'
    text: |-
      1 Van de erkenning wordt een bewijs afgegeven, dat vermeldt tot welke datum de erkenning geldig is.

      2 Het model van het bewijs van erkenning is opgenomen in de bij deze regeling behorende [bijlage 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012877
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0012877
  - number: '86'
    text: |-
      1 Ten aanzien van de verlenging van een erkenning zijn de [artikelen 83][ref1] en [84][ref2] van toepassing, met
      dien verstande dat kan worden volstaan met aan te geven, welke veranderingen zich hebben voorgedaan ten aanzien van
      de gegevens, die voor de laatst verleende erkenning zijn ingediend.

      2 Teneinde de erkenning tijdig te kunnen verlengen, moet de aanvraag hiertoe uiterlijk acht weken, doch niet eerder
      dan twaalf weken voor de in [artikel 85][ref3] bedoelde datum worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012877#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0012877#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0012877#Artikel85
