  - number: '92'
    text: |-
      De houder van een erkenning bewaart de volgende gegevens ten minste gedurende de aangegeven termijn:

      a. de geluidsmeetrapporten en overige gegevens met betrekking tot de geluidsmetingen die hebben plaatsgevonden: 2
      jaren na de geluidsmeting;

      b. de administratie betreffende de afgegeven geluidsmeetrapporten: 2 jaren na de autorisatie daarvan.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel92
  - number: '93'
    text: |-
      1 De houder van een erkenning meldt een defect of een gebrek zo spoedig mogelijk, doch in elk geval binnen 72 uur
      na de ontdekking ervan, schriftelijk aan de minister.

      2 De melding gaat vergezeld van een zo volledig mogelijke beschrijving van hetgeen werd gevonden en een opgave van
      de overige van belang zijnde gegevens.

      3 Indien er sprake is van een ernstig defect of gebrek meldt de houder van de erkenning het ernstige defect of
      gebrek onmiddellijk aan de minister.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel93
  - number: '94'
    text: |-
      Indien naar het oordeel van de minister een verbetering van het kwaliteitssysteem noodzakelijk is, treft de erkende
      geluidsmeetorganisatie, met inachtneming van de door de minister gegeven aanwijzingen, maatregelen ter verbetering
      van het kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel94
  - number: '95'
    text: |-
      De minister publiceert periodiek de volgende gegevens van de houders van een erkenning als geluidsmeetorganisatie:

      a. naam;

      b. vestigingsplaats of -plaatsen;

      c. omschrijving van de werkzaamheden, waarvoor de houder van een erkenning als geluidmeetorganisatie is erkend.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel95
  - number: '96'
    text: Deze regeling treedt in werking met ingang van 15 oktober 2001.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel96
  - number: '97'
    text: 'Deze regeling wordt aangehaald als: Regeling erkenningen luchtwaardigheid.'
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel97
  - number: BA:1
    text: |-
      De aanvrager beschikt over een beschrijving, inclusief een organisatieschema, waaruit de plaats van de aanvrager in
      de onderneming blijkt.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel1
  - number: BA:2
    text: |-
      De aanvrager beschikt met betrekking tot het gebied van de werkzaamheden, ten aanzien waarvan hij de erkenning
      aanvraagt, over:

      a. een grondige kennis omtrent de door de Joint Aviation Authorities opgestelde codes en procedures, welke
      in Nederland van toepassing zijn, alsmede de door de minister met betrekking tot de beoordeling van de
      luchtwaardigheid gestelde regelen en gegeven aanwijzingen, voor zover deze regelen en aanwijzingen voor hem van
      belang zijn, en

      b. een gezond oordeel en bekleedt een onafhankelijke dan wel een voldoende verantwoordelijke positie op dat gebied.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel2
  - number: BA:3
    text: |-
      Ten einde een goede uitvoering van werkzaamheden te kunnen waarborgen, zal de aanvrager:

      a. ten minste één jaar in goede samenwerking met de Inspectie Verkeer en Waterstaat aangelegenheden, direct verband
      houdende met de verkrijging van bewijzen van luchtwaardigheid van vliegtuigen, hebben behandeld;

      b. indien de erkenning geen vliegproeven zal omvatten, ongeveer vijf jaren op het gebied, waarvoor hij de
      erkenning aanvraagt, dan wel op een aanverwant gebied, werkzaamheden hebben verricht, direct verband houdende met
      de verkrijging van bewijzen van luchtwaardigheid van vliegtuigen, of op een andere wijze hebben getoond, dat hij
      geschikt is voor die werkzaamheden;

      c. indien de erkenning vliegproeven zal omvatten, ten minste houder zijn van een geldig vliegbewijs B3, waarin de
      bevoegdverklaring `blindvliegen' is gesteld; voorts moet de aanvrager tijdens vluchten, waarvan de gezamenlijke
      tijdsduur ten minste 2000 uren bedraagt, als houder van een vliegbewijs vliegtuigen hebben bestuurd, waarvan ten
      minste 100 uren in het tijdvak van twaalf maanden, onmiddellijk voorafgaande aan de aanvraag, en waarvan ten minste
      100 uren een vliegtuig van het type, waarvoor hij de erkenning aanvraagt.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel3
  - number: BA:4
    text: |-
      De aanvrager beschikt op de werkplek over de van toepassing zijnde voorschriften, specificaties, normen en andere
      gegevens die ingevolge de aanwijzingen van de minister van toepassing zijn op de certificatieprocessen.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel4
  - number: BA:5
    text: |-
      De aanvrager is verantwoordelijk voor een kwaliteitssysteem dat in ieder geval de volgende aspecten bevat:

      a. de certificatieprocessen;

      b. het documentatiebeheer;

      c. de vrijgave van certificatiedocumentatie;

      d. een doelmatige en deugdelijke technische administratie;

      e. de kwaliteitsborging.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel5
  - number: BA:6
    text: |-
      De certificatieprocessen van de aanvrager waarborgen dat de werkzaamheden worden uitgevoerd, overeenkomstig de van
      toepassing zijnde specificaties, voorschriften en instructies zodat de resultaten van het certificatieproces aan
      een vooraf vastgestelde kwaliteit voldoen.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel6
  - number: BA:7
    text: |-
      De aanvrager beschikt over een systeem dat waarborgt dat de beschikbare documentatie wordt bijgehouden en actueel
      blijft.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel7
  - number: BA:8
    text: |-
      1 Het vrijgaveproces van de aanvrager waarborgt dat certificatiedocumentatie, niet voor gebruik of toepassing
      worden vrijgegeven zonder een verklaring van overeenstemming met de luchtwaardigheidseisen.

      2 De verklaring van overeenstemming met de luchtwaardigheidseisen is slechts geldig indien het:

      a. volledig leesbaar is,

      b. tegen uitwissen is beveiligd, en

      c. is ondertekend door de aanvrager.

      3 Het model van de verklaring van overeenstemming met de luchtwaardigheidseisen geeft in ieder geval in de
      Nederlandse of Engelse taal het volgende weer:

      a. een verklaring luidende

      1° `Verklaring van overeenstemming met de luchtwaardigheidseisen, afgegeven ingevolge machtiging op grond van het
      door de minister van Verkeer en Waterstaat afgegeven bewijs van erkenning nr...',

      2° `Declaration of compliance with the airworthiness regulations, released in accordance with the approval by the
      Department of Civil Aviation in the Netherlands ref approval no...', of

      3° een verklaring overeenkomstig sub a of b,

      b. de naam van de houder van de erkenning, die op het bewijs van erkenning is vermeld;

      c. het volgnummer van de verklaring van overeenstemming met de luchtwaardigheidseisen;

      d. de certificatiedocumentatie waar de verklaring van overeenstemming voor wordt geautoriseerd;

      e. een verklaring aan welke luchtwaardigheidseisen voldaan wordt;

      f. het administratienummer waaronder nadere informatie over het eindproduct is te vinden;

      g. op welke datum de verklaring van overeenstemming met de luchtwaardigheidseisen is getekend.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel8
  - number: BA:9
    text: |-
      De aanvrager zorgt voor een doelmatige en deugdelijke technische administratie met betrekking tot:

      a. de afgegeven verklaring van overeenstemming met de luchtwaardigheidseisen;

      b. de onderliggende certificatiedocumentatie waarvoor de verklaring van overeenstemming met de
      luchtwaardigheidseisen is afgegeven;

      c. de meetgegevens omtrent op materialen, halfproducten, onderdelen en uitrustingsstukken toegepaste behandelingen,
      indien de beoordeling van de certificatiedocumentatie mede op grond van deze gegevens geschiedt;
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel9
  - number: BA:10
    text: |-
      1 De aanvrager beschikt over de daartoe noodzakelijke gegevens, en stelt deze ter beschikking aan de
      kwaliteitsborgingsfunctie van de organisatie bedrijf waarbij hij werkzaam is, teneinde aan te kunnen tonen dat het
      kwaliteitssysteem naar behoren functioneert.

      2 De aanvrager laat zijn functioneren regelmatig beoordelen door de kwaliteitsborgingsfunctie, de
      kwaliteitsborgingsfunctie ziet er in ieder geval op toe dat het kwaliteitssysteem wordt toegepast.

      3 Zodra blijkt, dat het kwaliteitssysteem tekortschiet, achterhaalt de aanvrager of de kwaliteitsborgingsfunctie
      de oorzaken daarvan, teneinde maatregelen ter verbetering te kunnen treffen. Indien nodig brengt de aanvrager de
      nodige wijzigingen aan in het kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel10
  - number: BA:11
    text: |-
      Het handboek van de aanvrager bevat een beschrijving hoe hij aan de artikelen 4 tot en met 10 voldoet en een
      wijzigingsprocedure van het handboek.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel11
  - number: BB:1
    text: |-
      De aanvrager beschikt over een geldig bewijs van bevoegdheid als onderhoudstechnicus, met de bevoegdverklaring(en)
      in overeenstemming met de aard van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel1
  - number: BB:2
    text: |-
      1 De aanvrager beschikt over voldoende en doelmatige bedrijfsmiddelen, ten einde een goede uitvoering van de
      werkzaamheden te kunnen waarborgen.

      2 De aanvrager beschikt over bedrijfsmiddelen die het personeel en de producten en onderdelen beschermen tegen
      ongewenste invloeden van buitenaf.

      3 Indien bedrijfsmiddelen van derden worden gebruikt, zorgt de aanvrager dat hij:

      a. beschikt over de bedrijfsmiddelen;

      b. verantwoordelijk is voor de gang van zaken ten aanzien van deze bedrijfsmiddelen;

      c. maatregelen kan treffen voor noodzakelijke verbeteringen.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel2
  - number: BB:3
    text: |-
      De aanvrager beschikt in de werkplaats over de van toepassing zijnde voorschriften, specificaties, normen en andere
      gegevens die ingevolge de aanwijzingen van de minister van toepassing zijn op de materialen, onderdelen, producten
      en productieprocessen.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel3
  - number: BB:4
    text: |-
      De aanvrager is verantwoordelijk voor een kwaliteitssysteem dat in ieder geval de volgende aspecten bevat:

      a. het kwaliteitsbeleid;

      b. de productieprocessen;

      c. het documentatiebeheer;

      d. de deugdelijkheid van meet- en beproevingsmiddelen;

      e. de deugdelijkheid van materialen, onderdelen en producten;

      f. de vrijgave van onderdelen en producten;

      g. de melding van defecten en gebreken;

      h. een doelmatige en deugdelijke technische administratie;

      i. de kwaliteitsborging.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel4
  - number: BB:5
    text: |-
      1 Het door de aanvrager vastgesteld kwaliteitsbeleid bestaat uit doelstellingen, wegen en middelen, en
      prioriteiten, dat leidt tot een beleidsprogramma teneinde te waarborgen dat de resultaten van het productieproces
      voldoen aan vooraf vastgestelde kwaliteit.

      2 Het kwaliteitsbeleid is gericht op het voorkomen van onbedoelde afwijkingen in het functioneren van de EZT.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel5
  - number: BB:6
    text: |-
      De aanvrager waarborgt dat de werkzaamheden tijdens het productieproces worden uitgevoerd, overeenkomstig de van
      toepassing zijnde specificaties, voorschriften en instructies, met gebruikmaking van de van toepassing zijnde
      bedrijfsmiddelen zodat de resultaten van het productieproces aan een vooraf vastgestelde kwaliteit voldoen.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel6
  - number: BB:7
    text: |-
      De aanvrager beschikt over een systeem dat waarborgt dat de beschikbare documentatie wordt bijgehouden en actueel
      blijft.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel7
  - number: BB:8
    text: |-
      De aanvrager beschikt over een systeem dat waarborgt dat de meet- en beproevingsmiddelen in deugdelijke toestand
      worden gehouden.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel8
  - number: BB:9
    text: |-
      1 De aanvrager beschikt over een systeem dat de deugdelijkheid waarborgt van elders betrokken materialen en
      onderdelen.

      2 De aanvrager beschikt over een systeem dat zeker stelt dat materialen, halffabrikaten, en onderdelen, die in
      eerste instantie zijn afgekeurd, nader worden beoordeeld, en bij definitieve afkeur uit het productieproces worden
      verwijderd.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel9
  - number: BB:10
    text: |-
      1 Het vrijgaveproces van de aanvrager waarborgt dat materialen, onderdelen en producten waarop de erkenning
      betrekking heeft, die bestemd zijn om in luchtvaartuigen te worden gebruikt of door derden te worden verwerkt, niet
      voor gebruik of verwerking worden vrijgegeven zonder een certificaat van vrijgave dan wel certificaat van vrijgave
      voor gebruik.

      2 De aanvrager waarborgt dat luchtvaartuigen, waarop de aanvraag betrekking heeft, niet voor gebruik worden
      vrijgegeven zonder een certificaat van vrijgave voor gebruik.

      3 Het certificaat van vrijgave dan wel het certificaat van vrijgave voor gebruik is slechts geldig indien het:

      a. volledig leesbaar is,

      b. tegen uitwissen is beveiligd, en

      c. is ondertekend door de aanvrager.

      4 Het model van het certificaat van vrijgave voor gebruik geeft in ieder geval in de Nederlandse of Engelse taal
      het volgende weer:

      a. een verklaring luidende

      i. `Certificaat van vrijgave voor gebruik, afgegeven ingevolge de bevoegdheid op grond van het door de minister van
      Verkeer en Waterstaat afgegeven bewijs van erkenning nr...',

      ii. `Certificate of release to service, released in accordance with the approval by the Minister of Transport,
      Public Works and Water Management of the Netherlands ref approval no...', of

      iii. een verklaring overeenkomstig sub i of ii;

      b. de naam van de houder van de erkenning, die op het bewijs van erkenning is vermeld;

      c. het volgnummer van het certificaat van vrijgave dan wel certificaat van vrijgave voor gebruik;

      d. het eindproduct waar het certificaat van vrijgave dan wel certificaat van vrijgave voor gebruik voor wordt
      geautoriseerd;

      e. een verklaring dat het eindproduct voldoet aan de eisen, bedoeld in de Regeling onderhoud luchtvaartuigen;

      f. het administratienummer waaronder nadere informatie over het eindproduct is te vinden;

      g. door wie en op welke datum het certificaat van vrijgave voor gebruik is getekend.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel10
  - number: BB:11
    text: |-
      De aanvrager zorgt voor een doelmatige en deugdelijke technische administratie met betrekking tot:

      a. de gegevens omtrent de uitgevoerde inspecties, keuringen en beproevingen;

      b. de meetgegevens omtrent op materialen, halfproducten, onderdelen en uitrustingsstukken toegepaste behandelingen,
      indien de beoordeling ervan mede op grond van deze gegevens geschiedt;

      c. de bedrijfs- en opslagtijden van die stoffen, materialen, onderdelen en uitvoeringsstukken, waarbij deze tijden
      een belangrijke rol spelen.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel11
  - number: BB:12
    text: |-
      1 De aanvrager beschikt over de daartoe noodzakelijke gegevens, en stelt deze ter beschikking aan de
      kwaliteitsborgingsfunctie, teneinde aan te kunnen tonen dat het kwaliteitssysteem naar behoren functioneert.

      2 De aanvrager laat zijn functioneren regelmatig beoordelen door de kwaliteitsborgingsfunctie.

      3 Zodra blijkt, dat het kwaliteitssysteem tekortschiet, achterhaalt de aanvrager of de kwaliteitsborgingsfunctie de
      oorzaken daarvan, teneinde maatregelen ter verbetering te kunnen treffen.

      4 Indien nodig brengt de aanvrager de nodige verbeteringen aan in het kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel12
  - number: BB:13
    text: |-
      1 Teneinde een goede uitvoering te geven aan het kwaliteitsbeleid, bedoeld in artikel 5, sluit de aanvrager een
      overeenkomst met een voor de minister acceptabele organisatie voor de uitvoering van de kwaliteitsborgingsfunctie.

      2 Deze overeenkomst bevat tenminste de volgende aspecten:

      a. de kwaliteitsborgingsfunctie ondersteund de aanvrager bij de ontwikkeling en invoering van het kwaliteitsbeleid,
      bedoeld in artikel 5;

      b. de kwaliteitsborgingsfunctie ziet er in ieder geval op toe dat het kwaliteitssysteem wordt toegepast;

      c. de kwaliteitsborgingsfunctie vervult zijn taken onafhankelijk van de met de directe uitvoering van de
      werkzaamheden belaste personen.

      3 De uitvoerder van de kwaliteitsborgingsfunctie is voor de minister acceptabel indien hij aan de volgende
      voorwaarden voldoet:

      a. kennis en ervaring op het gebied van auditeren;

      b. kennis van de Nederlandse regelgeving op het gebied van onderhoud aan luchtvaartuigen;

      c. technisch inhoudelijke kennis van zweefvliegtuigen.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel13
  - number: BB:14
    text: |-
      Het handboek van de aanvrager bevat een beschrijving hoe hij aan de artikelen 2 tot en met 13 voldoet alsmede een
      wijzigingsprocedure van het handboek.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel14
  - number: BC:1
    text: |-
      1 Voor zover de aanvrager deel uitmaakt van een grotere onderneming, beschikt de aanvrager over beschrijving,
      inclusief een organisatieschema, waaruit de plaats van de aanvrager in de grotere onderneming blijkt.

      2 De aanvrager beschikt over een beschrijving, inclusief een organisatieschema, van de interne organisatie.

      3 De aanvrager beschikt over een beschrijving van alle van belang zijnde functies binnen de interne organisatie. De
      functiebeschrijvingen geven de verantwoordelijkheden, taken en bevoegdheden weer.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel1
  - number: BC:2
    text: |-
      1 De aanvrager zorgt voor voldoende en bekwaam personeel voor het:

      a. uitvoeren van werkzaamheden;

      b. uitoefenen van toezicht op de werkzaamheden;

      c. autoriseren van certificaten van vrijgave dan wel certificaten van vrijgave voor gebruik.

      2 Het personeel dat door de aanvrager wordt gemachtigd tot het autoriseren van certificaten van vrijgave dan wel
      certificaten van vrijgave voor gebruik behoeft de instemming van de minister.

      3 Het bedrijf machtigt geen personen tot het autoriseren van certificaten van vrijgave dan wel certificaten van
      vrijgave voor gebruik, die de kwaliteitsborging bedoeld in artikel 16 uitvoeren.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel2
  - number: BC:3
    text: |-
      1 De aanvrager beschikt over voldoende en doelmatige bedrijfsmiddelen, ten einde een goede uitvoering van de
      werkzaamheden te kunnen waarborgen.

      2 De aanvrager beschikt over bedrijfsmiddelen die het personeel en de producten en onderdelen beschermen tegen
      ongewenste invloeden van buitenaf.

      3 Indien bedrijfsmiddelen van derden worden gebruikt, zorgt de aanvrager dat hij:

      a. beschikt over de bedrijfsmiddelen;

      b. verantwoordelijk is voor de gang van zaken ten aanzien van deze bedrijfsmiddelen;

      c. maatregelen kan treffen voor noodzakelijke verbeteringen.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel3
  - number: BC:4
    text: |-
      De aanvrager beschikt in het bedrijf, daar waar deze voor de uitvoering van de werkzaamheden benodigd zijn, over de
      van toepassing zijnde voorschriften, specificaties, normen en andere gegevens, die ingevolge de aanwijzingen van de
      minister van toepassing zijn op de materialen, onderdelen, producten en productieprocessen.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel4
  - number: BC:5
    text: |-
      1 De aanvrager is verantwoordelijk voor een kwaliteitssysteem dat in ieder geval, voor zover van toepassing op de
      aanvrager, de volgende aspecten bevat:

      a. het kwaliteitsbeleid;

      b. de opleiding, kwalificatie en ervaring van het personeel;

      c. de productieprocessen;

      d. het documentatiebeheer;

      e. de deugdelijkheid van meet- en beproevingsmiddelen;

      f. de deugdelijkheid van materialen, onderdelen en producten;

      g. de opslag van materialen, onderdelen en producten;

      h. de identificatie en traceerbaarheid van materialen, onderdelen en producten;

      i. de vrijgave van onderdelen en producten;

      j. de melding van defecten en gebreken;

      k. een doelmatige en deugdelijke technische administratie;

      l. de kwaliteitsborging;

      m. beheersing van de invloed van economische en commerciële factoren op de kwaliteit.

      2 Elk lid van het personeel wordt in kennis gesteld van en in staat gesteld om naar behoefte kennis te nemen van
      het kwaliteitssysteem.

      3 Wijzigingen in het kwaliteitssysteem worden tijdig bekendgemaakt aan het bij de wijziging betrokken personeel.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel5
  - number: BC:6
    text: |-
      1 Het door de aanvrager vastgestelde kwaliteitsbeleid bestaat uit doelstellingen, wegen en middelen, en
      prioriteiten, dat leidt tot een beleidsprogramma teneinde te waarborgen dat de resultaten van het productieproces
      voldoen aan vooraf vastgestelde kwaliteit.

      2 Het kwaliteitsbeleid is gericht op het voorkomen van onbedoelde afwijkingen in het functioneren van het bedrijf.

      3 Het kwaliteitsbeleid is bekend bij en wordt uitgevoerd door het personeel.

      4 Het kwaliteitsbeleid wordt periodiek door de aanvrager getoetst op blijvende geschiktheid.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel6
  - number: BC:7
    text: |-
      1 Indien de aanvrager zorgt dat het personeel door een opleiding de vereiste kennis, bedrevenheid en ervaring
      krijgt voor uitvoerende, leidinggevende of toezichthoudende taken, beschikt de aanvrager over een beschrijving van
      de opleiding.

      2 De beschrijving bevat informatie over ten minste de volgende elementen:

      a. de opleidingsstructuur en -programma's;

      b. de voorwaarden tot toelating;

      c. de beoordelingsmethode van gemaakte vorderingen;

      d. de wijze van examinering.

      3 De aanvrager administreert met een bewijs van bekwaamheid, of anderszins, ieder lid van het personeel, dat direct
      verantwoordelijk is voor of belast is met:

      a. de uitvoering van werkzaamheden;

      b. het toezicht houden op werkzaamheden;

      c. de uitvoering van werkzaamheden, die aangemerkt zijn als bijzondere werkwijze.

      4 De aanvrager administreert met een machtiging, of anderszins, ieder lid van het personeel, dat belast is met: het
      autoriseren van certificaten van vrijgave dan wel certificaten van vrijgave voor gebruik.

      5 De beschrijving bevat tevens een omschrijving van de te hanteren regeling voor toetsing en periodieke hertoetsing
      van de bekwaamheden en een beschrijving van de organisatie van het toezicht op die regeling.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel7
  - number: BC:8
    text: |-
      De aanvrager waarborgt dat:

      a. de werkzaamheden tijdens het productieproces worden uitgevoerd, overeenkomstig de van toepassing zijnde
      specificaties en voorschriften en instructies, met gebruikmaking van de van toepassing zijnde bedrijfsmiddelen;

      b. de halffabrikaten in de diverse stadia van de productie aan de daaraan gestelde eisen voldoen;

      c. de materialen, onderdelen en producten bij aflevering voldoen aan de desbetreffende specificaties en/of
      tekeningen.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel8
  - number: BC:9
    text: |-
      De aanvrager beschikt over een systeem dat waarborgt, dat de beschikbare documentatie wordt bijgehouden en actueel
      blijft.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel9
  - number: BC:10
    text: |-
      1 De aanvrager beschikt over voldoende en geschikte meet- en beproevingsmiddelen, zodat materialen, halffabrikaten,
      onderdelen en producten met de vereiste nauwkeurigheid gemeten, getest en beproefd kunnen worden.

      2 De aanvrager beschikt over een systeem dat waarborgt, dat de meet-, en beproevingsmiddelen in aantoonbaar
      deugdelijke toestand worden gehouden.

      3 Calibraties en ijkingen worden zodanig verricht zodat de metingen tot de nationale standaards herleidbaar zijn.

      4 Meet- en beproevingsmiddelen die niet aan de eisen voldoen, worden gescheiden gehouden van goede middelen en als
      zodanig geïdentificeerd.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel10
  - number: BC:11
    text: |-
      1 De aanvrager beschikt over een systeem dat de deugdelijkheid waarborgt van elders betrokken materialen,
      onderdelen en producten, en uitbestede werkzaamheden.

      2 De aanvrager beschikt over een systeem dat zeker stelt dat materialen, halffabrikaten, en onderdelen, die in
      eerste instantie zijn afgekeurd, nader worden beoordeeld, en bij definitieve afkeur uit het productieproces worden
      verwijderd.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel11
  - number: BC:12
    text: |-
      De aanvrager zorgt voor een goede opslag van en een goede handelwijze met materialen, halffabrikaten, onderdelen en
      producten, zodat:

      a. wanneer de maximaal toelaatbare opslagtermijn verstreken is, deze materialen, halffabrikaten, onderdelen en
      producten niet worden vrijgegeven voor verwerking;

      b. afgekeurde en ongekeurde exemplaren gescheiden worden gehouden van goedgekeurde exemplaren;

      c. exemplaren die vanuit een productieafdeling in opslag worden genomen op kwaliteit beoordeeld en geïdentificeerd
      worden.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel12
  - number: BC:13
    text: |-
      1 De aanvrager zorgt ervoor dat belangrijke materialen, onderdelen en producten op systematische wijze worden
      gemerkt, opdat deze in elk stadium van de productie, alsmede na aflevering, te identificeren zijn en de herkomst
      daarvan is na te gaan.

      2 De aanvrager zorgt ervoor afgekeurde materialen, onderdelen en producten zodanig te identificeren, dat deze
      duidelijk te onderscheiden zijn van overige exemplaren.

      3 De aanvrager zorgt ervoor dat door het bedrijf vervaardigde onderdelen en producten ten minste voorzien zijn van
      de volgende gegevens:

      a. het kenmerk van de fabrikant;

      b. de type-, model- of specificatieaanduiding;

      c. het serienummer of de datum van vervaardiging.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel13
  - number: BC:14
    text: |-
      1 Het vrijgaveproces van de aanvrager waarborgt dat materialen, onderdelen en producten waarop de erkenning
      betrekking heeft, die bestemd zijn om in luchtvaartuigen te worden gebruikt of door derden te worden verwerkt, niet
      voor gebruik of verwerking worden vrijgegeven zonder een certificaat van vrijgave dan wel certificaat van vrijgave
      voor gebruik.

      2 De aanvrager waarborgt dat luchtvaartuigen, waarop de aanvraag betrekking heeft, niet voor gebruik worden
      vrijgegeven zonder een certificaat van vrijgave voor gebruik.

      3 Het certificaat van vrijgave dan wel het certificaat van vrijgave voor gebruik is slechts geldig indien het:

      a. volledig leesbaar is,

      b. tegen uitwissen is beveiligd, en

      c. is ondertekend door een door de aanvrager overeenkomstig artikel 7, vierde lid, gemachtigd personeelslid.

      4 Het is de in het vorige lid bedoelde personen niet toegestaan een certificaat van vrijgave dan wel een
      certificaat van vrijgave voor gebruik te ondertekenen, zonder zich op redelijke wijze van de juistheid van de te
      ondertekenen verklaring te hebben overtuigd.

      5 Het model van het certificaat van vrijgave voor gebruik geeft in ieder geval in de Nederlandse of Engelse taal
      het volgende weer:

      a. een verklaring luidende

      i. `Certificaat van vrijgave voor gebruik, afgegeven ingevolge de bevoegdheid op grond van het door de minister van
      Verkeer en Waterstaat afgegeven bewijs van erkenning nr...',

      ii. ` Certificate of release to service, released in accordance with the approval by the Minister of Transport,
      Public Works and Water Management of the Netherlands ref approval no...', of

      iii. een verklaring overeenkomstig sub i of ii,

      b. de naam van de houder van de erkenning, die op het bewijs van erkenning is vermeld;

      c. het volgnummer van het certificaat van vrijgave dan wel certificaat van vrijgave voor gebruik;

      d. het eindproduct waar het certificaat van vrijgave voor gebruik voor wordt geautoriseerd;

      e. een verklaring dat het eindproduct voldoet aan de eisen, bedoeld in de Regeling onderhoud luchtvaartuigen;

      f. het administratienummer waaronder nadere informatie over het eindproduct is te vinden;

      g. door wie en op welke datum het certificaat van vrijgave voor gebruik is getekend.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel14
  - number: BC:15
    text: |-
      1 De aanvrager zorgt voor een doelmatige en deugdelijke technische administratie met betrekking tot:

      a. de afgegeven certificaten van vrijgave dan wel certificaten van vrijgave voor gebruik;

      b. de meetgegevens omtrent tijdens de productie toegepaste behandelingen, indien de beoordeling ervan mede op grond
      van deze gegevens geschiedt;

      c. de gegevens omtrent de uitgevoerde werkzaamheden, keuringen en beproevingen en de wijze van uitvoering;

      d. de verwerking van materialen en onderdelen, teneinde deze in elk stadium van de werkzaamheden te kunnen
      identificeren en opsporen en na aflevering de herkomst ervan te kunnen vaststellen;

      e. de bedrijfs- en opslagtijden van die materialen en onderdelen, waarbij deze tijden een belangrijke rol spelen.

      2 De gegevens worden, tegen uitwissen beveiligd, vastgelegd en opgeslagen door daartoe bevoegd personeel. Bij
      mutaties van gegevens, wordt de identiteit van degene die de wijziging invoert, eenduidig vastgelegd.

      3 De technische administratie is voorzien van een systeem om fouten te kunnen constateren en tijdig te corrigeren.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel15
  - number: BC:16
    text: |-
      1 De aanvrager beschikt over een kwaliteitsafdeling, die erop toeziet dat het kwaliteitsbeleid wordt toegepast.

      2 De kwaliteitsafdeling vervult haar taak onafhankelijk van de met de directe uitvoering van de werkzaamheden
      belaste afdelingen.

      3 De aanvrager en in het bijzonder de kwaliteitsafdeling beschikt, teneinde te verzekeren en aan te kunnen tonen
      dat het kwaliteitssysteem naar behoren functioneert, over daartoe noodzakelijke gegevens.

      4 De kwaliteitsafdeling beoordeelt regelmatig het functioneren van de organisatie. Indien naar het oordeel van de
      minister de aard of omvang van de aanvrager zich hier niet voor leent, kan deze beoordeling worden uitbesteed aan
      derden, mits de door de minister ter zake gegeven aanwijzingen worden opgevolgd.

      5 Indien blijkt dat het kwaliteitssysteem tekortschiet, achterhaalt de aanvrager de oorzaken daarvan, of laat deze
      achterhalen, teneinde maatregelen ter verbetering te kunnen treffen.

      6 Indien daar aanleiding toe is, brengt de aanvrager de nodige verbeteringen aan in het kwaliteitssysteem.

      7 De kwaliteitsafdeling beschikt over een doelmatige en deugdelijke uitrusting voor de uitvoering van haar taak.

      8 De kwaliteitsafdeling beschikt ten minste over de bevoegdheid om de autorisatie van certificaten van vrijgave dan
      wel certificaten van vrijgave voor gebruik te verhinderen of ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel16
  - number: BC:17
    text: |-
      1 Het handboek van de aanvrager bevat een beschrijving hoe hij aan de artikelen 1 tot en met 16 voldoet, waarbij
      de productieprocessen, zoals bedoeld in artikel 16, vanaf de voorbereiding tot en met de aflevering, zowel in
      hoofdlijnen als daar waar nodig tot in gedetailleerde werkinstructies zijn beschreven.

      2 Tevens bevat het handboek van de aanvrager het volgende:

      a. de kennisgevingsprocedure van organisatorische wijzigingen aan de minister

      b. een overzicht van het personeel, dat belast is met het autoriseren van certificaten van vrijgave dan wel
      certificaten van vrijgave voor gebruik;

      c. een overzicht van de derden, die worden ingeschakeld bij de productie;

      d. de wijzigingsprocedure van het handboek.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel17
