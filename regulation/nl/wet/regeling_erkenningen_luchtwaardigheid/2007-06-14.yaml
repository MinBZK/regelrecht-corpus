      - id: ref1
        bwb_id: BWBR0012877
  - number: '48'
    text: |-
      1 Van de erkenning als erkend inspecteur wordt een bewijs afgegeven, dat vermeldt tot welke datum de erkenning
      geldig is.

      2 Het model van het bewijs van erkenning is opgenomen in de bij deze regeling behorende [bijlage 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012877
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel48
