  - number: '51'
    text: |-
      1 De erkenning als erkend inspecteur wordt gewijzigd, nadat is aangetoond, dat de houder ook na de invoering van
      de wijziging aan de voor de verkrijging van een erkenning als erkend inspecteur gestelde voorwaarden zal blijven
      voldoen.

      2 De [artikelen 46][ref1] en [47][ref2] zijn van toepassing, met dien verstande dat kan worden volstaan met de
      gegevens, die voor de aangevraagde wijziging relevant zijn.

      3 Bij wijziging wordt zo nodig een nieuw bewijs van erkenning afgegeven.

      4 Een aanvraag om wijziging wordt uiterlijk vier weken voor de gewenste datum van wijziging ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012877#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0012877#Artikel47
