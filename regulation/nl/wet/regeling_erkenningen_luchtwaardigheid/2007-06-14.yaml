  - number: '29'
    text: |-
      1 Gehele of gedeeltelijke schorsing van de POA wordt bij aangetekende brief aan de houder medegedeeld.

      2 Vanaf het tijdstip van schorsing mag de houder die bevoegdheden, waarop de schorsing van de POA betrekking heeft,
      niet uitoefenen.

      3 Om een schorsing op te heffen toont de houder aan, dat de redenen, die tot schorsing hebben geleid, zijn
      vervallen.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel29
  - number: '30'
    text: |-
      1 Gehele of gedeeltelijke intrekking van de POA wordt bij aangetekende brief aan de houder medegedeeld.

      2 Vanaf het tijdstip van intrekking mag de houder die bevoegdheden, waarop de intrekking van de POA betrekking
      heeft, niet uitoefenen.

      3 De houder van de POA is verplicht het bewijs van erkenning zo spoedig mogelijk aan de minister te zenden.

      4 De minister neemt het bewijs van erkenning in en geeft, in geval van gedeeltelijke intrekking, een nieuw bewijs
      van erkenning af.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel30
  - number: '31'
    text: |-
      1 De houder van een POA draagt zorg voor een archiveringssysteem overeenkomstig JAR 21-165, waarin alle gegevens
      van het uitgevoerde werk, inclusief die van andere bij de productie betrokken partijen, worden bewaard.

      2 De gegevens benodigd voor het aantonen van de conformiteit van het product, of het onderdeel zullen ten minste
      voor periode van twee jaar na afgifte van de verklaring van conformiteit worden bewaard.

      3 De gegevens benodigd voor de continue luchtwaardigheid van het product of onderdeel zullen ten minste bewaard
      worden gedurende het operationele leven van het product of onderdeel.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel31
  - number: '32'
    text: |-
      De houder van een POA zal de te melden afwijkingen schriftelijk en onverwijld maar uiterlijk binnen 72 uur na
      constatering aan de minister melden.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel32
  - number: '33'
    text: |-
      De minister publiceert in Aeronautical Information Circular series B, periodiek de volgende gegevens van de houders
      van een POA:

      a. naam;

      b. vestigingsplaats of -plaatsen;

      c. omschrijving van de werkzaamheden, waarvoor de houder van een POA is erkend.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel33
  - number: '34'
    text: |-
      1 Degene, die een aanvraag voor een MOA heeft ingediend, wordt erkend nadat het ten genoegen van de minister heeft
      aangetoond, dat: hij:

      a. voldoet aan JAR-145, zoals die luidt met ingang van 1 november 2001;

      b. in Nederland is gevestigd, en

      c. voor zover het een niet JAA-persoon betreft de aanvraag door tussenkomst van de JAA wordt ingediend.

      2 De aanvraag wordt ingediend door de functionaris van het bedrijf, die de eindverantwoordelijkheid draagt ten
      aanzien van het door het bedrijf gevoerde beleid.

      3 De aanvraag wordt ingediend door middel van volledig ingevulde en ondertekende formulieren, waarvan de exemplaren
      kosteloos bij de minister zijn te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel34
  - number: '35'
    text: |-
      Bij de aanvraag voor een MOA verstrekt de aanvrager de volgende gegevens:

      a. een korte levensbeschrijving van de functionarissen bedoeld in JAR-145.30 (a), waarin in ieder geval opleiding,
      ervaring en vroegere functies zijn opgenomen;

      b. een exemplaar van het handboek bedoeld in JAR-145.70;

      c. een exemplaar van te gebruiken modellen van het certificaat van vrijgave en het certificaat van vrijgave voor
      gebruik, en

      d. een uittreksel, niet ouder dan drie maanden, uit het register van de Kamer van Koophandel en Fabrieken;

      e. een zelfevaluatie, waarin de aanvrager per bepaling van de van toepassing zijnde regelgeving aantoont hoe
      daaraan wordt voldaan, en waar dit in het handboek staat beschreven.
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel35
  - number: '36'
    text: |-
      1 Van de MOA wordt een bewijs afgegeven, dat vermeldt tot welke datum de MOA geldig is.

      2 Het model van het bewijs van erkenning is opgenomen in de bij deze regeling behorende [bijlage 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012877
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0012877
  - number: '37'
    text: |-
      1 Ten aanzien van verlenging van een MOA zijn de [artikelen 34][ref1] en [35][ref2] van toepassing, met dien
      verstande dat kan worden volstaan met aan te geven, welke veranderingen zich hebben voorgedaan ten aanzien van de
      gegevens, die voor de laatst verleende erkenning zijn ingediend.

      2 Teneinde de erkenning tijdig te kunnen verlengen, moet de aanvraag hiertoe uiterlijk acht weken, doch niet eerder
      dan twaalf weken voor de in [artikel 36][ref3] bedoelde datum worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012877#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0012877#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0012877#Artikel36
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel37
