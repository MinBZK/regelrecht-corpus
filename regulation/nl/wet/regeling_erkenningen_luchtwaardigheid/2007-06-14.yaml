  - number: '87'
    text: |-
      1 De houder van een erkenning, niet zijnde een eenmansorganisatie, bereidt wijzigingen in het functioneren van de
      organisatie zodanig voor en voert deze zo uit, dat het kwaliteitssysteem van de houder van de erkenning aantoonbaar
      in stand en effectief blijft.

      2 De houder van een erkenning, niet zijnde een eenmansorganisatie, dient een aanvraag voor acceptatie van wijziging
      van de bij de oorspronkelijke aanvraag verstrekte gegevens in bij:

      a. een wijziging in het kwaliteitsbeleid;

      b. een belangrijke wijziging van de organisatie;

      c. een wijziging van de erkenningaanvrager, of de leiding van de kwaliteitsafdeling;

      d. een wijziging in de lijst van autoriseringspersoneel, tenzij anderszins met het bedrijf is overeengekomen;

      e. een belangrijke wijziging in de toegepaste werkwijzen;

      f. verandering in de meetuitrusting van het bedrijf;

      g. de ingebruikname van een nieuwe geluidsmeetlocatie.

      3 De houder van een erkenning, zijnde een eenmansorganisatie, deelt de minister onverwijld iedere wijziging mee van
      de bij de laatst ingediende aanvraag verstrekte gegevens volgens [artikel 84 onder b tot en met f][ref1].

      4 De minister kan voorwaarden stellen waaronder de in het derde lid bedoelde wijzigingen worden geaccepteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012877#Artikel84
    url: https://wetten.overheid.nl/BWBR0012877/2007-06-14#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0012877
        artikel: '84'
        hoofdstuk: '9'
        paragraaf: '9.1'
  - number: '88'
    text: |-
      1 Een aanvraag tot wijziging, wordt door de minister goedgekeurd, nadat is aangetoond, dat de organisatie ook na de
      invoering van de wijziging aan de voor de verkrijging van een erkenning gestelde voorwaarden zal blijven voldoen.

      2 De erkenning als eenmansorganisatie wordt gewijzigd, nadat door tussenkomst van de uitvoerder van de
      kwaliteitsborgingsfunctie is aangetoond, dat de houder ook na de invoering van de wijziging aan de voor de
      verkrijging van een erkenning als geluidsmeetorganisatie gestelde voorwaarden zal blijven voldoen.

      3 De [artikelen 83][ref1] en [84][ref2] zijn van toepassing, met dien verstande dat kan worden volstaan met de
      gegevens, die voor de aangevraagde wijziging relevant zijn.

      4 Bij wijziging wordt zo nodig een nieuw bewijs van erkenning afgegeven.

      5 Een aanvraag om wijziging wordt uiterlijk acht weken voor de gewenste datum van wijziging ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012877#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0012877#Artikel84
