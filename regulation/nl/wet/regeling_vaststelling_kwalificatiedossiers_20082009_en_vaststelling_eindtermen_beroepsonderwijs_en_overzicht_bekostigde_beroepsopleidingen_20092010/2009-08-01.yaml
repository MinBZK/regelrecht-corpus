  - number: '2'
    text: |-
      1 Voor de beroepsopleidingen opgenomen in [bijlage 1][ref1] behorende bij deze regeling worden de
      kwalificatiedossiers voor het studiejaar 2008–2009 vastgesteld overeenkomstig [bijlage 2][ref2] behorende bij deze
      regeling.

      2 In [bijlage 1][ref3] wordt per beroepsopleiding vastgesteld:

      a. de leerweg waarin de beroepsopleiding kan worden verzorgd;

      b. de prijsfactor, bedoeld in [artikel 2.2.3, vierde lid, van het Uitvoeringsbesluit WEB][ref4];

      c. de hoogte van de studielast, bedoeld in [artikel 7.2.4, tweede lid, onderdeel d, van de wet][ref5].


