      1 Voor de beroepsopleidingen opgenomen in [bijlage 7][ref1] behorende bij deze regeling worden voor het studiejaar
      2009–2010 in [die bijlage][ref2] vastgesteld:

      a. de leerweg waarin de beroepsopleiding kan worden verzorgd;

      b. of de beroepsopleiding voor bekostiging in aanmerking komt;

      c. de prijsfactor, bedoeld in [artikel 2.2.3, vierde lid van het Uitvoeringsbesluit WEB][ref3];

      d. de hoogte van de studielast;

      2 Per beroepsopleiding opgenomen in [bijlage 7][ref4] bij deze regeling wordt overeenkomstig [bijlage 8][ref5] bij
      deze regeling vastgesteld:

      a. de eindtermen;

      b. de onderverdeling in deelkwalificaties;

      c. de onderverdeling in deelkwalificaties die verplicht zijn voor het behalen van het diploma van de desbetreffende
      beroepsopleiding.


