        artikel: '1'
  - number: '4'
    text: Deze beschikking treedt in werking met ingang van 1 oktober 1983.
    url: https://wetten.overheid.nl/BWBR0003614/2004-07-30#Artikel4
  - number: '5'
    text: 'Deze regeling kan worden aangehaald als: Regeling instelling 12-mijlszone.'
