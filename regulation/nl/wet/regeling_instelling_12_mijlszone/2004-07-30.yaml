preamble:
  text: |-
    Gelet op artikel 3, eerst lid, aanhef en onder a, van het Reglement zee- en kustvisserij 1977 (Stb. 666),

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003614/2004-07-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Er is voor de Nederlandse kust in de Noordzee een exclusieve 12-mijlszone als bedoeld in artikel 17, tweede lid,
      van [verordening (EG) nr. 2371/2002](32002R2371) van de Raad van de Europese Unie van 20 december 2002 inzake
      de instandhouding en de duurzame exploitatie van de visserijhulpbronnen in het kader van het gemeenschappelijk
      visserijbeleid (PbEG L 358).
    url: https://wetten.overheid.nl/BWBR0003614/2004-07-30#Artikel1
  - number: '2'
    text: |-
      De in [artikel 1][ref1] bedoelde zone strekt zich uit tot 12 zeemijlen, gemeten zeewaarts vanaf de basislijn van de
      territoriale zee van Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0003614#Artikel1
    url: https://wetten.overheid.nl/BWBR0003614/2004-07-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003614
        artikel: '1'
  - number: '3'
    text: |-
      Het is verboden met een vissersvaartuig dat de vlag voert van, dan wel geregistreerd is in één der andere Lid-
      Staten van de Europese Gemeenschap dan Nederland de visserij uit te oefenen binnen de in [artikel 1][ref1] bedoelde
      zone anders dan voortvloeiend uit artikel 17, tweede lid, van de in [artikel 1][ref2] genoemde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0003614#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003614#Artikel1
    url: https://wetten.overheid.nl/BWBR0003614/2004-07-30#Artikel3
    references:
