  - number: '3'
    text: |-
      1 Deze regeling treedt in werking op het tijdstip waarop het besluit van 24 november 2005, houdende wijziging van
      het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming ter omzetting van een aantal vrijstellingsregelingen
      vooruitlopend op de fundamentele herziening van voornoemd besluit (Stb. nr. 610), in werking treedt.

      2 Indien artikel II, tweede lid, van het besluit, genoemd in het eerste lid, van toepassing is, werkt deze regeling
      terug tot en met 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0019394/2006-01-04#Artikel3
