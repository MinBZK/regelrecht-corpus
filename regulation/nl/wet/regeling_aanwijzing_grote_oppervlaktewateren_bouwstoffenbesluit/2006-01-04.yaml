preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op artikel 2, vierde lid, van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming en artikel 64
    van de Wet bodembescherming;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0019394/2006-01-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De oppervlaktewateren, genoemd in de bij deze regeling behorende
      bijlage, worden aangewezen als grote oppervlaktewateren als bedoeld in
      [artikel 2, vierde lid, van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1].

      2 De in het eerste lid bedoelde aanwijzing beperkt zich tot het gedeelte van het oppervlaktewater dat valt onder
      het waterkwaliteitsbeheer van de waterkwaliteitsbeheerder onder welke het desbetreffende oppervlaktewater in de
      bijlage vermeld staat.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel2
    url: https://wetten.overheid.nl/BWBR0019394/2006-01-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '2'
  - number: '2'
    text: |-
      De [Tijdelijke vrijstellingsregeling Bouwstoffenbesluit 2004][ref1], de
      [Tijdelijke vrijstellingsregeling eisen grond en baggerspecie][ref2] en de
      [Vrijstellingsregeling samenstellings- en immissiewaarden Bouwstoffenbesluit][ref3] worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0017326
      [ref2]: https://wetten.overheid.nl/BWBR0016439
      [ref3]: https://wetten.overheid.nl/BWBR0010551
