  - number: '1.13'
    text: Gelijktijdig met de beschikking tot subsidieverlening wordt 70% van het subsidiebedrag als voorschot verstrekt.
    url: https://wetten.overheid.nl/BWBR0050067/2024-10-01#Artikel1.13
  - number: '1.14'
    text: |-
      1 Een aanvrager kan bij de Minister een aanvraag tot vaststelling van de subsidie indienen door middel van een
      daartoe vastgesteld formulier dat beschikbaar is via de website van RVO.

      2 De aanvraag tot subsidievaststelling kan worden ingediend tot uiterlijk 12 maanden na de datum van verlening van
      de subsidie.

      3 De aanvrager kan bij RVO een verzoek doen tot uitstel van maximaal 12 maanden van de indiening van de aanvraag,
      bedoeld in het tweede lid, indien hij kan aantonen dat de levertijd van de nieuwe emissieloze touringcar langer is
      dan de periode, genoemd in het tweede lid.

      4 Onverminderd [artikel 24 van het Kaderbesluit][ref1] bevat de aanvraag tot vaststelling van de subsidie voor de
      subsidiabele activiteit, bedoeld in [artikel 1.3][ref2], in elk geval de volgende gegevens:

      a. het kenteken van de nieuwe emissieloze touringcar dat is vermeld in de overeenkomst; en

      c. de gespecificeerde factuur tot betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0050067#Artikel1.3
    url: https://wetten.overheid.nl/BWBR0050067/2024-10-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0050067
        artikel: '1.3'
        hoofdstuk: '1'
  - number: '1.15'
    text: |-
      1 Indien niet is voldaan aan het bepaalde in [artikel 1.12, eerste lid, onderdeel d][ref1], kan de Minister de
      vaststelling van de subsidie wijzigen en het onverschuldigd betaalde deel van de subsidie terugvorderen.

      2 Het terug te vorderen bedrag wordt bepaald door de subsidie te verminderen met 1/48e van het verstrekte
      subsidiebedrag vermenigvuldigd met het aantal volledige maanden waarin niet is voldaan aan de verplichting, bedoeld
      in [artikel 1.12, eerste lid, onderdeel d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050067#Artikel1.12
      [ref2]: https://wetten.overheid.nl/BWBR0050067#Artikel1.12
    url: https://wetten.overheid.nl/BWBR0050067/2024-10-01#Artikel1.15
