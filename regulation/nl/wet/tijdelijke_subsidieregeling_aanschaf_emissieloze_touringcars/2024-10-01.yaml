  - number: '1.2'
    text: |-
      Deze regeling heeft tot doel het stimuleren van de aanschaf van nieuwe emissieloze touringcars door ondernemingen
      teneinde de emissie van CO en luchtverontreinigende stoffen te verminderen.
    url: https://wetten.overheid.nl/BWBR0050067/2024-10-01#Artikel1.2
  - number: '1.3'
    text: |-
      De Minister kan aan een aanvrager subsidie verstrekken voor de aanschaf van één of meerdere nieuwe emissieloze
      touringcars van voertuigcategorie m3.
    url: https://wetten.overheid.nl/BWBR0050067/2024-10-01#Artikel1.3
  - number: '1.4'
    text: |-
      Subsidie kan worden aangevraagd door:

      a. een concessiehouder;

      b. een andere onderneming die is ingeschreven bij de Kamer van Koophandel en die een vestiging in Nederland heeft.
    url: https://wetten.overheid.nl/BWBR0050067/2024-10-01#Artikel1.4
  - number: '1.5'
    text: |-
      De kosten die op grond van artikel 36ter van de algemene groepsvrijstellingsverordening voor subsidie in aanmerking
      komen, zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0050067/2024-10-01#Artikel1.5
  - number: '1.6'
    text: |-
      1 De subsidie bedraagt ten hoogste 30% van de op grond van artikel 36ter van de algemene
      groepsvrijstellingsverordening in aanmerking komende kosten, tot een maximum van € 90.000 per emissieloze
      touringcar.

      2 De steunintensiteit bedoeld in het eerste lid wordt:

      a. met 20 procentpunten verhoogd voor subsidie aan een middelgrote onderneming, tot een maximum van € 150.000 per
      emissieloze touringcar;

      b. met 30 procentpunten verhoogd voor subsidie aan een kleine onderneming, tot een maximum van € 180.000 per
      emissieloze touringcar.

      3 Onverminderd [artikel 5 van het Kaderbesluit][ref1] wordt de overschrijding in mindering gebracht op het
      subsidiebedrag wanneer het subsidiebedrag, bedoeld in het eerste of tweede lid, de maximale steunruimte van de
      algemene groepsvrijstellingsverordening overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel5
    url: https://wetten.overheid.nl/BWBR0050067/2024-10-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '5'
  - number: '1.7'
    text: |-
      1 Het subsidieplafond bedraagt:

      a. voor aanvragers als bedoeld in [artikel 1.4, eerste lid, onderdeel a][ref1], voor het jaar 2024: € 1.000.000;

      b. voor aanvragers als bedoeld in [artikel 1.4, eerste lid, onderdeel b][ref2], voor het jaar 2024: € 1.000.000.

      2 Indien een subsidieplafond als bedoeld in het eerste lid, onderdeel a, voor dat jaar ontoereikend is om alle
      daarvoor in aanmerking komende aanvragen te kunnen toewijzen, worden de bedragen aangevuld met de voor dat jaar
      onaangesproken middelen gereserveerd op grond van het eerste lid, onderdeel b.

      3 Indien een subsidieplafond als bedoeld in het eerste lid, onderdeel b, voor dat jaar ontoereikend is om alle
      daarvoor in aanmerking komende aanvragen te kunnen toewijzen, worden de bedragen aangevuld met de voor dat jaar
      onaangesproken middelen gereserveerd op grond van het eerste lid, onderdeel a.

      4 De Minister stelt het subsidieplafond vast voor de jaren na 2024 en geeft hiervan kennis in de Staatscourant voor
      aanvang van het kalenderjaar waarvoor het betreffende subsidieplafond wordt vastgesteld.

      5 De Minister verdeelt de in de betreffende subsidieperiode beschikbare gelden op volgorde van binnenkomst van
      de aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0050067#Artikel1.4
      [ref2]: https://wetten.overheid.nl/BWBR0050067#Artikel1.4
