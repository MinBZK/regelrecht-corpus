  - number: '1.11'
    text: |-
      Op grond van [artikel 16 van het Kaderbesluit][ref1] zijn de regels inzake een subsidie van € 25.000 tot € 125.000
      van toepassing op subsidies van € 125.000 of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel16
    url: https://wetten.overheid.nl/BWBR0050067/2024-10-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '16'
  - number: '1.12'
    text: |-
      1 Onverminderd [artikel 17][ref1] en [18 van het Kaderbesluit][ref2] is de subsidieontvanger verplicht:

      a. onverwijld schriftelijk mededeling te doen aan de Minister van gewijzigde omstandigheden of wijziging van
      gegevens die van belang zijn in verband met de subsidieverstrekking op grond van deze regeling;

      b. medewerking te verlenen aan de controle op de uitvoering van de verplichtingen die zijn gesteld in deze regeling
      en de beschikking;

      c. de nieuwe emissieloze touringcar waarvoor subsidie is verleend op zijn naam te stellen of een
      verstrekkingsvoorbehoud op zijn naam te registreren in het kentekenregister; en

      d. er zorg voor te dragen dat de nieuwe emissieloze touringcar gedurende vier jaar vanaf de datum van de eerste
      inschrijving en tenaamstelling, of registratie van het verstrekkingsvoorbehoud, ononderbroken op zijn naam is
      gesteld of een verstrekkingsvoorbehoud op zijn naam is geregistreerd in het kentekenregister.

      2 De verplichting, bedoeld in het eerste lid, onderdeel d, geldt niet indien de subsidieontvanger de nieuwe
      emissieloze touringcar vervangt door een andere nieuwe emissieloze touringcar die ook in aanmerking zou zijn
      gekomen voor subsidie op grond van deze regeling en dit andere voertuig gedurende de nog resterende termijn van de
      periode, genoemd in het eerste lid, onderdeel d, op zijn naam is gesteld of middels een verstrekkingsvoorbehoud op
      zijn naam is geregistreerd.

      3 De uitzondering van het tweede lid geldt niet wanneer de subsidieontvanger voor de vervangende nieuwe emissieloze
      touringcar subsidie aanvraagt.

      4 Indien de nieuwe emissieloze touringcar wordt vervangen door een andere nieuwe emissieloze touringcar als bedoeld
      in het tweede lid, is de subsidieontvanger verplicht om gedurende de in dat lid bedoelde resterende termijn te
      beschikken over de overeenkomst tot aanschaf van de vervangende nieuwe emissieloze touringcar.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0036381#Artikel18
