  - number: '1.8'
    text: |-
      a. Een aanvraag tot subsidieverlening op grond van deze regeling kan in 2024 van 15 oktober 2024, 9.00 uur tot en
      met 25 oktober 2024, 12.00 uur worden ingediend.
    url: https://wetten.overheid.nl/BWBR0050067/2024-10-01#Artikel1.8
  - number: '1.9'
    text: |-
      1 Een aanvrager kan bij de Minister een aanvraag om subsidie indienen door middel van een daartoe vastgesteld
      formulier dat beschikbaar is via de website van RVO.

      2 Een aanvraag tot subsidieverlening bevat naast de in [artikel 10 van het Kaderbesluit][ref1] genoemde gegevens
      ten minste:

      a. naam en adres van de aanvrager;

      b. contactgegevens van de contactpersoon van de aanvrager;

      c. merk, type en handelsbenaming van de nieuwe emissieloze touringcar waarvoor subsidie wordt aangevraagd;

      d. hoogte van het bedrag van eventuele reeds aangevraagde of ontvangen subsidies van een bestuursorgaan of de
      Commissie van de Europese Unie voor de aanschaf van een of meerdere nieuwe emissieloze touringcars;

      e. kopie van de offerte, met inbegrip van de offerteprijs, voor de voorgenomen aanschaf van de nieuwe emissieloze
      touringcar;

      f. een bewijs van minder dan zes maanden oud waaruit blijkt wat de prijs van het referentievoertuig is.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel10
    url: https://wetten.overheid.nl/BWBR0050067/2024-10-01#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '10'
  - number: '1.10'
    text: |-
      Onverminderd [artikel 11][ref1] en [12 van het Kaderbesluit][ref2] beslist de Minister afwijzend op een aanvraag om
      subsidie indien:

      a. een emissieloze touringcar ten tijde van de aanvraag om subsidieverlening al is tenaamgesteld;

      b. aan de aanvrager, dan wel aan aanvragers die tot eenzelfde groep behoren, op grond van deze regeling reeds voor
      de aanschaf van:

      1°. 5 emissieloze touringcars subsidie is verstrekt onder een subsidieplafond als bedoeld in
      [artikel 1.7, eerste lid, onderdeel a][ref3];

      2°. 2 emissieloze touringcars subsidie is verstrekt onder een subsidieplafond als bedoeld in
      [artikel 1.7, eerste lid, onderdeel b][ref4];

      c. de subsidie is bestemd voor een onderneming in moeilijkheden als bedoeld in artikel 2, punt achttien, van de
      algemene groepsvrijstellingsverordening;

      d. sprake is van ongeoorloofde cumulatie van steun als bedoeld in artikel 8 van de algemene
      groepsvrijstellingsverordening;

      e. de subsidieverstrekking niet in overeenstemming is met enige andere bepaling van de algemene
      groepsvrijstellingsverordening; of

      f. de te verstrekken subsidie lager is dan € 25.000.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0036381#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0050067#Artikel1.7
      [ref4]: https://wetten.overheid.nl/BWBR0050067#Artikel1.7
