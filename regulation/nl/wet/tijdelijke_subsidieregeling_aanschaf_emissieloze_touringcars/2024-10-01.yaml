articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *aanschaf:* verkrijging van de eigendom, bedoeld in
      [artikel 84, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref1], krachtens koop of financial leasing als
      bedoeld in [paragraaf 3.2 van het Besluit heffing omzetbelasting bij leasing](onbekend);
        - *concessiehouder:* vergunninghoudende vervoerder als bedoeld in
      [artikel 1 van de Wet personenvervoer 2000][ref2], van een concessie voor openbaar busvervoer;
        - *emissieloos:* emissieloos als bedoeld in
      [artikel 86c van het Reglement verkeersregels en verkeerstekens 1990][ref3];
        - *emissieloze touringcar:* emissieloos batterij-elektrisch motorvoertuig dat blijkens het kentekenregister of een
      aantekening op het kentekenbewijs is goedgekeurd voor een maximumsnelheid van 100 kilometer per uur;
        - *groep:* groep als bedoeld in [artikel 2:24b van het Burgerlijk Wetboek][ref4];
        - *Kaderbesluit:* [Kaderbesluit subsidies I en M][ref5];
        - *kleine onderneming:* kleine onderneming als bedoeld in artikel 2, tweede of derde lid, van bijlage I bij de
      algemene groepsvrijstellingsverordening;
        - *Minister:* Minister van Infrastructuur en Waterstaat;
        - *middelgrote onderneming:* mkb-onderneming die niet kwalificeert als kleine onderneming;
        - *mkb-onderneming:* onderneming in de zin van artikel 2, onderdeel 2, van de algemene
      groepsvrijstellingsverordening;
        - *nieuwe emissieloze touringcar:* emissieloze touringcar waarvan, blijkens vermelding in het kentekenregister, de
      datum eerste toelating, de datum eerste inschrijving in Nederland en de datum tenaamstelling, gelijk zijn;
        - *offerte:* formeel, schriftelijk, aanbod tot het sluiten van een overeenkomst voor de aanschaf van een nieuwe
      emissieloze touringcar, opgesteld op verzoek van de aanvrager;
        - *offerteprijs:* prijs van de nieuwe emissieloze touringcar inclusief af-fabriek opties zoals vermeld in de
      offerte, verminderd met de daarin begrepen omzetbelasting;
        - *openbaar busvervoer:* voor een ieder openstaand personenvervoer met een bus volgens een dienstregeling;
        - *overeenkomst:* schriftelijke overeenkomst tot koop als bedoeld in
      [artikel 1 van Boek 7 van het Burgerlijk Wetboek][ref6] of een schriftelijke overeenkomst tot financial leasing als
      bedoeld in [paragraaf 3.2 van het Besluit heffing omzetbelasting bij leasing](onbekend);
        - *referentievoertuig:* vervoermiddel van dezelfde voertuigcategorie dat aan reeds van kracht zijnde toepasselijke
      Unienormen voldoet en dat zonder de steun zou zijn aangeschaft;
        - *RVO:* Rijksdienst voor Ondernemend Nederland;
        - *verstrekkingsvoorbehoud:* registratie als bedoeld in [artikel 25 van het Kentekenreglement][ref7] van de
      rechtspersoon of natuurlijk persoon die over de tenaamstellingscode van een voertuig in het kentekenregister kan
      beschikken;
        - *voertuigcategorie:* voertuigcategorie als bedoeld in [Verordening (EU) 2018/858](32018R0858) van het Europees
      Parlement en de Raad van 30 mei 2018 betreffende de goedkeuring van en het markttoezicht op motorvoertuigen
      en aanhangwagens daarvan en systemen, onderdelen en technische eenheden die voor dergelijke voertuigen zijn
      bestemd, tot wijziging van [Verordeningen (EG) nr. 715/2007](32007R0715) en [(EG) nr. 595/2009](32009R0595) en tot
      intrekking van [Richtlijn 2007/46/EG](32007L0046) (PbEU 2018, L151).


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel84
