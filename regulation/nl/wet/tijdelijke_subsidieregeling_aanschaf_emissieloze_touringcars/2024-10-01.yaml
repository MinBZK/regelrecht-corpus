  - number: '2.1'
    text: |-
      Deze regeling treedt in werking met ingang van 1 oktober 2024 en vervalt met ingang van 1 oktober 2029, met dien
      verstande dat zij van toepassing blijft op subsidies die voor die datum zijn aangevraagd.
    url: https://wetten.overheid.nl/BWBR0050067/2024-10-01#Artikel2.1
  - number: '2.2'
    text: |-
      De Minister publiceert voor 1 januari 2030 een verslag over de doeltreffendheid en de effecten van de subsidie in
      de praktijk.
    url: https://wetten.overheid.nl/BWBR0050067/2024-10-01#Artikel2.2
  - number: '2.3'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke subsidieregeling aanschaf emissieloze touringcars.'
    url: https://wetten.overheid.nl/BWBR0050067/2024-10-01#Artikel2.3
