        artikel: '3'
  - number: '2'
    text: |-
      1 Als diergeneesmiddelen bedoeld in [artikel 3, eerste lid][ref1], van het besluit worden aangewezen
      diergeneesmiddelen met thyreostatische, oestrogene, androgene of gestagene werking en diergeneesmiddelen die ß-
      agonisten bevatten.

      2 De diergeneesmiddelen die ingevolge [artikel 3, tweede lid][ref2], van het besluit aan landbouwhuisdieren mogen
      worden toegediend, zijn:

      a. diergeneesmiddelen die testosteron, progesteron en derivaten daarvan bevatten, die bij de hydrolyse na
      resorptie op de toedieningsplaats gemakkelijk weer de stamverbinding opleveren, in het kader van een therapeutische
      behandeling, toegediend in de vorm van een injectie of, voor de behandeling van stoornissen aan de eierstokken,
      door middel van spiraaltjes of vergelijkbare toedieningsvormen;

      b. diergeneesmiddelen die allyltrenbolon voor orale toediening of ß-agonisten bevatten, voor toediening aan
      paardachtigen of gezelschapsdieren, in het kader van een therapeutische behandeling;

      c. diergeneesmiddelen die ß-agonisten bevatten voor de toediening aan vrouwelijke runderen ter behandeling van
      tocolyse tijdens het kalven, toegediend in de vorm van een injectie;

      d. diergeneesmiddelen met oestrogene, androgene of gestagene werking, met uitzondering van 17-ß-oestradiol, voor de
      toediening in het kader van zoötechnische behandeling;

      e. diergeneesmiddelen die 17-ß-oestradiol of esterachtige derivaten daarvan bevatten voor toediening aan
      landbouwhuisdieren voor één van de volgende doelen:

      1°. de behandeling van maceratie of mummificatie van foetussen bij runderen;

      2°. de behandeling van pyometra bij runderen;

      3°. het opwekken van bronst bij runderen, paarden, schapen of geiten, tot 14 oktober 2006.

      3 De diergeneesmiddelen die ingevolge [artikel 3, tweede lid][ref3], van het besluit aan aquicultuurdieren mogen
      worden toegediend zijn diergeneesmiddelen met androgene werking voor de toediening aan jonge aquicultuurdieren
      gedurende de eerste drie maanden in het kader van een zoötechnische behandeling.

      4 Het bepaalde in het tweede lid is niet van toepassing op de toediening van diergeneesmiddelen aan gebruiksdieren
      en aan dieren die bestemd zijn voor de mesterij, met inbegrip van voor de fokkerij afgeschreven dieren.


