preamble:
  text: |-
    In overeenstemming met de Staatssecretaris van Volksgezondheid, Welzijn en Sport;

    Gelet op richtlijn 96/22/EG van de Raad van de Europese Gemeenschappen van 29 april 1996 betreffende het
    verbod op het gebruik, in de veehouderij, van bepaalde stoffen met hormonale werking en van bepaalde stoffen
    met thyreostatische werking, alsmede van ß-agonisten en tot intrekking van de richtlijnen 81/602/EEG, 88/146/
    EEG en 88/299/EEG (PbEG L 125), richtlijn 96/23/EG van de Raad van de Europese Gemeenschappen van 29 april 1996
    inzake controlemaatregelen ten aanzien van bepaalde stoffen en residuen daarvan in levende dieren en in produkten
    daarvan en tot intrekking van de richtlijn 85/358/EEG en 86/469/EEG en de Beschikkingen 89/187/EEG en 91/664/
    EEG, alsmede verordening nr. 805/68/EEG van de raad van de Europese Gemeenschappen van 28 juni 1968, houdende een
    gemeenschappelijke ordening der markten in de sector rundvlees (PbEG L 148), alsmede op de artikelen 15, 19, 27 en
    28 van de Landbouwwet en de artikelen 29 en 40, eerste, tweede, derde en vierde lid, Diergeneesmiddelenwet en de
    artikelen 3 en 6 van het Besluit verboden stoffen Diergeneesmiddelenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008827/2004-12-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             besluit:

              [Besluit verboden stoffen Diergeneesmiddelenwet][ref1];



            b
             landbouwhuisdieren:

              als huisdier gehouden runderen, varkens, schapen, geiten, eenhoevigen, pluimvee en tamme konijnen, alsook
      wilde dieren van genoemde soorten en wilde herkauwers, voor zover zij op een bedrijf worden gehouden;



            c
            aquicultuurdieren:

              levende vissen en schaal- en weekdieren die afkomstig zijn van een bedrijf, met inbegrip van voor een
      bedrijf bestemde dieren die oorspronkelijk in het wild leefden;



            d
             therapeutische behandeling:

              individuele toediening aan landbouwhuisdieren van een geregistreerd diergeneesmiddel waarvan het
      gebruik is toegestaan ter behandeling van een, door een dierenarts na onderzoek van het dier, geconstateerde
      fertiliteitsstoornis, met inbegrip van de onderbreking van een ongewenste dracht, en, voor wat betreft b-
      agonisten, ter behandeling van tocolyse bij vrouwelijke runderen tijdens het kalven alsmede ter behandeling van
      ademhalingsstoornissen en tocolyse bij voor andere doeleinden dan de vleesproductie gefokte paardachtigen;



            e
            zoötechnische behandeling:

              individuele toediening aan landbouwhuisdieren van een geregistreerd diergeneesmiddel waarvan het gebruik
      is toegestaan, om de bronst te synchroniseren, en donor- en receptordieren op een embryotransplantatie voor te
      bereiden, alsmede toediening aan een groep aquicultuurdieren met het oog op geslachtsverandering;



            f
            werkzaamheden:

              werkzaamheden, bedoeld in [artikel 3, eerste lid, onderdelen a, b en d][ref2].



            g
            uur:

              spanne tijd van een uur, of enkel gedeelte daarvan, dat besteed is of zou zijn aan werkzaamheden, met
      uitzondering van de reistijd.


      [ref1]: https://wetten.overheid.nl/BWBR0008785
      [ref2]: https://wetten.overheid.nl/BWBR0008827#Artikel3
