    text: |-
      1 Als kosten bedoeld in [artikel 6, eerste lid, van het Besluit verboden stoffen Diergeneesmiddelenwet][ref1]
      worden aangemerkt de kosten van:

      a. het onderzoek naar de redenen voor de aanwezigheid van residuen in de onderzochte monsters op enig bedrijf waar
      de bemonsterde dieren of producten van afkomstig zijn of kunnen zijn;

      b. het nemen van monsters;

      c. de analyse van de genomen monsters;

      d. overige onderzoeken.

      2 De kosten, bedoeld in het eerste lid, worden door de minister in rekening gebracht en zijn, in voorkomend geval,
      opgebouwd uit de volgende componenten:

      a. de laboratoriumkosten;

      b. de met de analyse van de monsters gemoeide verzendkosten;

      c. de administratiekosten;

      d. de verblijfskosten van de bij de werkzaamheden betrokkenen;

      e. de reiskosten van de bij de werkzaamheden betrokkenen;

      f. een bedrag per uur per met de werkzaamheden belaste persoon van de Algemene Inspectiedienst;

      g. overige kosten die verband houden met de werkzaamheden.

      3 Indien kosten in rekening worden gebracht ingevolge
      [artikel 6, eerste lid, van de Regeling verbod handel met bepaalde stoffen behandelde dieren en producten][ref2]
      kan het in het eerste lid bedoelde bedrag in rekening gebracht worden tezamen met de ingevolge die regeling in
      rekening te brengen kosten.


