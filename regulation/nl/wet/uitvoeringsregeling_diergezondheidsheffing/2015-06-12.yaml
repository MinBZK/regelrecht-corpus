  - number: '4'
    text: |-
      1 De heffingplichtige wordt na afloop van het kalenderjaar waarover de heffing verschuldigd is uitgenodigd voor het
      doen van aangifte.

      2 De heffingplichtige die niet binnen vier maanden na afloop van het tijdvak waarover de diergezondheidsheffing
      wordt geheven, is uitgenodigd tot het doen van aangifte, verzoekt de inspecteur om een uitnodiging tot het doen
      van aangifte.

      3 Het in het tweede lid bedoelde verzoek wordt ingediend binnen twee weken na het verstrijken van de in dat lid
      bedoelde termijn van vier maanden.

      4 Het tweede lid is niet van toepassing indien over het tijdvak waarover de diergezondheidsheffing is verschuldigd
      reeds een aanslag is opgelegd.

      5 De verplichting, bedoeld in het eerste lid, geldt mede voor de in de [artikelen 43][ref1] en
      [44, eerste lid, van de Algemene wet inzake rijksbelastingen][ref2] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel44
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '44'
  - number: '5'
    text: |-
      Het uitnodigen tot het doen van aangifte geschiedt door een verwijzing naar het webadres waarop het aangiftebiljet
      kan worden ingevuld.
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel5
  - number: '6'
    text: |-
      Aangifte wordt via de elektronische weg gedaan door het toezenden van het beschikbaar gestelde aangiftebiljet
      aan de inspecteur, dat is ingevuld en ondertekend op de bij het biljet aangegeven wijze, met de bij het biljet
      gevraagde bescheiden.
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel6
  - number: '7'
    text: |-
      1 Na aanvang van het kalenderjaar wordt één voorlopige aanslag opgelegd tot ten hoogste het bedrag waarop de
      aanslag over dat kalenderjaar vermoedelijk zal worden vastgesteld.

      2 Voor de toepassing van het eerste lid kan de bepaling van het bedrag waarop de aanslag over het kalenderjaar
      vermoedelijk zal worden vastgesteld, geschieden op grond van de gegevens die hebben gediend of zouden hebben kunnen
      gediend ter vaststelling van de aanslag over het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel7
  - number: '8'
    text: |-
      De berekening voor melkproducerende runderen als bedoeld in
      [artikel 8, eerste lid, van het Besluit heffing bestrijding dierziekten][ref1] en
      [artikel 8, eerste lid, van het Besluit heffing preventie dierziekten][ref2] geschiedt door voor elke dag het
      aantal melkproducerende runderen op te tellen en te delen door het aantal dagen van het kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035682#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0035679#Artikel8
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035682
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0035679
        artikel: '8'
  - number: '9'
    text: |-
      De berekening voor andere runderen dan melkproducerende runderen, ouder dan één jaar, als
      bedoeld in [artikel 8, tweede lid, van het Besluit heffing bestrijding dierziekten][ref1] en
      [artikel 8, tweede lid, van het Besluit heffing preventie dierziekten][ref2] geschiedt door voor elke dag het
      aantal andere runderen dan melkproducerende runderen, ouder dan één jaar, op te tellen en te delen door het aantal
      dagen van het kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035682#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0035679#Artikel8
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0035682
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0035679
        artikel: '8'
  - number: '10'
    text: |-
      De berekening voor andere runderen dan melkproducerende runderen, jonger dan 1 jaar, als
      bedoeld in [artikel 8, derde lid, van het Besluit heffing bestrijding dierziekten][ref1] en
      [artikel 8, derde lid, van het Besluit heffing preventie dierziekten][ref2] geschiedt door voor elke dag het aantal
      aanwezige andere runderen dan melkproducerende runderen, jonger dan 1 jaar, op te tellen en te delen door het
      aantal dagen van het kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035682#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0035679#Artikel8
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0035682
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0035679
        artikel: '8'
  - number: '11'
    text: |-
      De berekening voor schapen als bedoeld in de [artikelen 9][ref1] en
      [10 van het Besluit heffing bestrijding dierziekten][ref2] en de [artikelen 9][ref3] en
      [10 van het Besluit heffing preventie dierziekten][ref4] geschiedt door het aantal aanwezige schapen op 1 februari,
      1 mei, 1 augustus en 1 november op te tellen en door vier te delen.


      [ref1]: https://wetten.overheid.nl/BWBR0035682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0035682#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0035679#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0035679#Artikel10
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0035682
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0035682
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0035679
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0035679
        artikel: '10'
  - number: '12'
    text: |-
      De berekening voor geiten als bedoeld in de [artikelen 9][ref1] en
      [10 van het Besluit heffing bestrijding dierziekten][ref2] en de [artikelen 9 ][ref3]en
      [10 van het Besluit heffing preventie dierziekten][ref4] geschiedt door het aantal aanwezige geiten op 1 februari,
      1 mei, 1 augustus en 1 november op te tellen en door vier te delen.


      [ref1]: https://wetten.overheid.nl/BWBR0035682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0035682#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0035679#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0035679#Artikel10
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0035682
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0035682
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0035679
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0035679
        artikel: '10'
  - number: '13'
    text: |-
      De berekening voor de diercategorieën, bedoeld in de artikelen vier tot en met zeven van het
      [Besluit heffing bestrijding dierziekten][ref1] en de artikelen vier tot en met zeven van het
      [Besluit heffing preventie dierziekten][ref2] geschiedt door voor elke dag van het kalenderjaar het aantal
      aanwezige dieren van de diercategorie op te tellen en te delen door het aantal dagen van het kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035682
      [ref2]: https://wetten.overheid.nl/BWBR0035679
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0035682
      - id: ref2
        bwb_id: BWBR0035679
  - number: '14'
    text: |-
      Het totale aantal in een kalenderjaar door een bedrijf verhandelde varkens als bedoeld in
      [artikel 92 van de wet][ref1] wordt berekend door het aantal varkens bij elkaar op te tellen dat vanaf het bedrijf
      wordt verhandeld en die bestemd zijn voor het buitenland of de slacht.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel92
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '92'
  - number: '15'
    text: |-
      De heffing, bedoeld in [artikel 12 van het Besluit heffing preventie dierziekten][ref1], wordt
      geheven naar het aantal vaccinbroedeieren dat in een kalenderjaar door de persoon, bedoeld in
      [artikel 14, tweede lid, van het Besluit heffing bestrijding dierziekten][ref2], in een broedmachine wordt
      ingelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0035679#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0035682#Artikel14
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0035679
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0035682
        artikel: '14'
  - number: '16'
    text: |-
      De [Uitvoeringsregeling varkensheffing][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009814
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel16
    references:
      - id: ref1
