preamble:
  text: |-
    Gelet op de artikelen 92b, 93, derde lid, en 93a, eerste, vierde en zesde lid, van de Gezondheids- en welzijnswet
    voor dieren, de artikelen 6, eerste en derde lid, 8, eerste en tweede lid, 13, eerste lid, 56 en 62 van de Algemene
    wet inzake rijksbelastingen en de artikelen 5 en 31 van de Invorderingswet 1998;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *berekening:* de berekening van het gemiddeld in een kalenderjaar op het bedrijf gehouden dieren als bedoeld in
      [artikel 91h, derde lid, van de wet][ref1];
        - *diergezondheidsheffing:* heffing als bedoeld in [artikel 2 van het Besluit heffing bestrijding dierziekten][ref2];
        - *wet:* [Gezondheids- en welzijnswet voor dieren][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91h
      [ref2]: https://wetten.overheid.nl/BWBR0035682#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: 91h
      - id: ref2
        bwb_id: BWBR0035682
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0005662
  - number: '2'
    text: |-
      1 Met betrekking tot de diergezondheidsheffing gelden de bevoegdheden en verplichtingen van de hierna
      vermelde, in de [Algemene wet inzake rijksbelastingen][ref1], de [Invorderingswet 1990][ref2] en de
      [Kostenwet invordering rijksbelastingen][ref3] genoemde functionarissen, voor de daarachter genoemde
      functionarissen:

      a. de directeur: de directeur Financieel-Economische Zaken van het Ministerie van Economische Zaken;

      b. de inspecteur: de inspecteur van de Rijksdienst voor Ondernemend Nederland;

      c. de ontvanger: de ontvanger van de Rijksdienst voor Ondernemend Nederland;

      d. de ambtenaren van de rijksbelastingdienst: de ambtenaren van de Rijksdienst voor Ondernemend Nederland en de
      ambtenaren van de Nederlandse Voedsel- en Warenautoriteit.

      2 De functionaris, bedoeld in
      [artikel 93a, eerste, vierde en zesde lid, van de Gezondheids- en welzijnswet voor dieren][ref4] is de algemeen
      directeur van de Rijksdienst voor Ondernemend Nederland.

      3 Als inspecteur van de Rijksdienst voor Ondernemend Nederland en als ontvanger van de Rijksdienst voor Ondernemend
      Nederland wordt aangewezen de algemeen directeur van de Rijksdienst voor Ondernemend Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0002645
      [ref4]: https://wetten.overheid.nl/BWBR0005662#Artikel93a
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel2
    references:
      - id: ref1
