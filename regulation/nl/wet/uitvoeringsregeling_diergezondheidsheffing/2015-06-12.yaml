        artikel: 93a
  - number: '3'
    text: |-
      De verplichtingen die ingevolge de [artikelen 47][ref1], [47b][ref2], [48][ref3], [49][ref4], [50][ref5],
      [53][ref6] en [55 van de Algemene wet inzake rijksbelastingen][ref7] bestaan jegens de Inspecteur van de
      Rijksdienst voor Ondernemend Nederland gelden mede jegens de ambtenaren van de Rijksdienst voor Ondernemend
      Nederland en jegens de ambtenaren van de Nederlandse Voedsel- en Warenautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel48
