  - number: '17'
    text: Deze regeling treedt in werking met ingang van 1 januari 2015.
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel17
  - number: '18'
    text: 'Deze regeling wordt aangehaald als: Uitvoeringsregeling diergezondheidsheffing.'
    url: https://wetten.overheid.nl/BWBR0036106/2015-06-12#Artikel18
