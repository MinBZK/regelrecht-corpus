preamble:
  text: |-
    Gelet op artikel 145a van de Wegenverkeerswet 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018998/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als de richtlijn, bedoeld in [artikel 145a van de Wegenverkeerswet 1994][ref1], wordt aangewezen: [richtlijn nr.
      2004/52/EG](32004L0052) van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004 betreffende de
      interoperabiliteit van elektronische tolheffingssystemen voor het wegverkeer in de Gemeenschap (PbEU L 166).


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel145a
    url: https://wetten.overheid.nl/BWBR0018998/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 145a
  - number: 1a
    text: |-
      1 De aanbieder van een elektronisch heffingssysteem voldoet aan de artikelen 3 en 4 van Beschikking 2009/750/EG van
      de Commissie van 6 oktober 2009 tot definiëring van de Europese elektronische tolheffingdienst en de bijbehorende
      technische onderdelen (PbEU 2009, L 268).

      2 De aanbieder, bedoeld in het eerste lid, verleent de Dienst Wegverkeer voor de uitvoering van artikel 19 van de
      beschikking, bedoeld in het eerste lid, te allen tijde de noodzakelijke medewerking.
    url: https://wetten.overheid.nl/BWBR0018998/2013-01-01#Artikel1a
  - number: '2'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het bij koninklijke boodschap van 20 april 2005 ingediende
      voorstel van wet, houdende wijziging van de Wegenverkeerswet 1994 in verband met de implementatie van [richtlijn
      nr. 2004/52/EG](32004L0052) van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004
      betreffende de interoperabiliteit van elektronische tolheffingssystemen voor het wegverkeer in de Gemeenschap
      (Kamerstukken II 2004/2005, 30 082, nr. 1), nadat het tot wet is verheven, in werking treedt.
    url: https://wetten.overheid.nl/BWBR0018998/2013-01-01#Artikel2
  - number: '3'
    text: 'Deze regeling wordt aangehaald als: Regeling elektronische tolheffingssystemen.'
    url: https://wetten.overheid.nl/BWBR0018998/2013-01-01#Artikel3
