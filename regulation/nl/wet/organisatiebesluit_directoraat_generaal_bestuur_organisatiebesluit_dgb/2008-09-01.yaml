  - number: '11.1'
    text: |-
      De dagelijkse aansturing van het Bureau Verbond Sectorwerkgevers Overheid (VSO) is door de directeur-generaal
      Bestuur gemandateerd aan de directeur Arbeidszaken Openbare Sector.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel11
  - number: '11.2'
    text: Het bureau staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel11
  - number: '11.3'
    text: Het bureau heeft tot taak het voeren van het secretariaat van het Verbond van Sectorwerkgevers Overheid.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel11
  - number: '12.1'
    text: 'De directie Arbeidszaken Openbare Sector bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.1
  - number: 12.1.a
    text: het Directiesecretariaat (DS);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.1
  - number: 12.1.b
    text: het Bureau Macro Economische Advisering (bMEA);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.1
  - number: 12.1.c
    text: de afdeling Arbeidsverhoudingen, Overlegstelsel en Internationale Zaken (AO&IZ);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.1
  - number: 12.1.d
    text: de afdeling Arbeidsvoorwaarden en Arbeidsmarkt (A&A);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.1
  - number: 12.1.e
    text: de afdeling Overheidsmanagement en Strategie (O&S);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.1
  - number: 12.1.f
    text: de afdeling Kennisinfrastructuur en Analyse (K&A).
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.1
  - number: 12.2.1
    text: Het Directiesecretariaat staat onder leiding van de directeur.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.2
  - number: 12.2.2
    text: Het Directiesecretariaat heeft tot taak het verzorgen van de ondersteuning van de directie.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.2
  - number: 12.3.1
    text: Het Bureau Macro Economische Advisering staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.3
  - number: 12.3.2
    text: 'Het bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.3
  - number: 12.3.2.a
    text: Het adviseren van de ministerraad en de Openbare Sector;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.3
  - number: 12.3.2.b
    text: |-
      Het participeren in sociaal – economische onderraden en ambtelijke voorportalen (op eigen titel, dan wel
      plaatsvervangend) en coördinatie van de advisering voor deze gremia binnen het Ministerie en het directoraat-
      generaal Bestuur in het bijzonder;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.3
  - number: 12.3.2.c
    text: het signaleren van trends en ontwikkelingen en het uitvoeren van verkenningen;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.3
  - number: 12.3.2.d
    text: het adviseren inzake budgettaire aspecten beleid DAOS;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.3
  - number: 12.3.2.e
    text: |-
      het assisteren van andere afdelingen binnen DAOS (en het Ministerie) betreffende (sociaal) economische
      vraagstukken;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.3
  - number: 12.3.2.f
    text: het participeren in de macro economische overleggen van het Centraal Plan Bureau;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.3
  - number: 12.3.2.g
    text: |-
      het verspreiden van macro economische en budgettaire inzichten binnen het Ministerie via het macro economisch
      beraad.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.3
  - number: 12.4.1
    text: De afdeling Arbeidsverhoudingen, Overlegstelsel en Internationale Zaken staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.4
  - number: 12.4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.4
  - number: 12.4.2.a
    text: |-
      Beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot arbeidsverhoudingen en management
      (inclusief de [Ambtenarenwet][ref1]) binnen de Openbare Sector;


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.4
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: 12.4.2.b
    text: Overlegstelsel (in casu normalisering);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.4
  - number: 12.4.2.c
    text: |-
      het formuleren van kaderstellend beleid ten aanzien van inhoud en vormgeving ambtelijke rechtspositie en het
      verlenen van adviezen daarbij;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.4
  - number: 12.4.2.d
    text: |-
      Beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot subsidiebeleid (nu ten behoeve van
      het Verbond Sectorwerkgevers Overheidspersoneel, Het Centrum Arbeidsverhoudingen Overheidspersoneel, de Stichting
      Verdeling Overheidsbijdrage, het European Institute of Public Administration en de Organisatie Strategisch
      Marktonderzoek);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.4
  - number: 12.4.2.e
    text: Beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot kaderstellend Integriteitsbeleid;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.4
  - number: 12.4.2.f
    text: het realiseren van transparantie bij topbeloningen;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.4
  - number: 12.4.2.g
    text: |-
      implementatie van EU-regelgeving en het ondersteunen van de directie Personeel Organisatie en Informatie Rijk bij
      CAO- onderhandelingen;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.4
  - number: 12.4.2.h
    text: het tot stand brengen van regelgeving op het terrein van arbeidsverhoudingen en arbeidsvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.4
  - number: 12.4.2.i
    text: |-
      de internationale coördinatie op het gebied van arbeidsvoorwaarden binnen de Europese Unie (EU) en het voorbereiden
      van de EU-DG-conferenties;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.4
  - number: 12.4.2.j
    text: overige taken als de Stichting Administratie Indonesische Pensioenen.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.4
  - number: 12.5.1
    text: De afdeling Arbeidsvoorwaarden en Arbeidsmarkt staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.5
  - number: 12.5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.5
  - number: 12.5.2.a
    text: |-
      Beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot arbeidsvoorwaarden (primair en
      secundair) voor personeel en management binnen de Openbare Sector;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.5
  - number: 12.5.2.b
    text: Het, in samenwerking met bureau Macro Economisch Advies, opstellen van de speerpuntenbrief en ruimtebrief;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.5
  - number: 12.5.2.c
    text: |-
      Beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot pensioenregelingen en
      levensloopregelingen Openbare Sector;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.5
  - number: 12.5.2.d
    text: Beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot arbeidsmarktbeleid Openbare Sector;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.5
  - number: 12.5.2.e
    text: |-
      Beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot sociale zekerheid, ziekteverzuim
      wettelijk geregelde arbeidsomstandigheden;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.5
  - number: 12.5.2.f
    text: Beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot topbeloningen Openbare Sector;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.5
  - number: 12.5.2.g
    text: Beleidsontwikkeling, sturing, facilitering en coördinatie met betrekking tot ziektekosten Openbare Sector;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.5
  - number: 12.5.2.h
    text: het opstellen van de trendnota;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.5
  - number: 12.5.2.i
    text: het verzorgen van het waarnemerschap bij CAO-besprekingen en onderhandelingen;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.5
  - number: 12.5.2.j
    text: |-
      het verzorgen van de advisering en ondersteuning bij pensioenvraagstukken mede ten behoeve van de directie
      Personeel Organisatie en Informatie Rijk.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.5
  - number: 12.6.1
    text: De afdeling Overheidsmanagement en Strategie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.6
  - number: 12.6.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.6
  - number: 12.6.2.a
    text: |-
      de beleidsontwikkeling, sturing, facilitering en coördinatie op het gebied van overheidsmanagement/governance
      binnen de Openbare Sector;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.6
  - number: 12.6.2.b
    text: het uitvoeren van het kabinetsbeleid ten aanzien van de invoering van kwaliteitshandvesten bij de overheid;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.6
  - number: 12.6.2.c
    text: |-
      het bevorderen van het leren bij overheidsorganisaties, onder andere door het promoten en begeleiden van
      benchmarken en het organiseren van leerplatforms over de sectoren heen;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.6
  - number: 12.6.2.d
    text: het promoten en faciliteren van kwaliteitssystemen, zoals CAF en INK, bij overheidsorganisaties;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.6
  - number: 12.6.2.e
    text: het bevorderen/zorgdragen voor visie en strategievorming;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.6
  - number: 12.6.2.f
    text: het opstellen van een lange termijn onderzoeksprogramma voor de periode t+1 – t+5;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.6
  - number: 12.6.2.g
    text: het verzorgen van de coördinatie bij de jaarplancyclus binnen de directie;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.6
  - number: 12.6.2.h
    text: het bewaken van het regelmatig evalueren van beleidsprocessen binnen DAOS.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.6
  - number: 12.7.1
    text: De afdeling Kennisinfrastructuur en Analyse staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.7
  - number: 12.7.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.7
  - number: 12.7.2.a
    text: |-
      het op verzoek zelf uitvoeren of laten uitvoeren van onderzoek en analyses op het gebied van personeel, organisatie
      en arbeidsmarktbeleid binnen het Rijk en de Openbare Sector;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.7
  - number: 12.7.2.b
    text: |-
      het bieden van een kennisinfrastructuur op het gebied van personeel, organisatie en arbeidsmarkt binnen de Openbare
      Sector (inclusief datamanagement, het verstrekken van adviezen over het gebruik van onderzoeksmethoden en –
      technieken en het ontwikkelen, beheren en toepassen van prognosemodellen voor het Rijk en de Openbare Sector);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.7
  - number: 12.7.2.c
    text: |-
      het bieden van financiële en informatieondersteuning op het gebied van personeel, organisatie en
      arbeidsvoorwaardenbeleid sector Rijk (inclusief CAO).
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel12.7
  - number: '13.1'
    text: 'De directie Innovatie en Informatiebeleid Openbare Sector bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.1
  - number: 13.1.a
    text: het Directiesecretariaat (DS);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.1
  - number: 13.1.b
    text: de afdeling Informatie-Infrastructuur (II);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.1
  - number: 13.1.c
    text: de afdeling Strategie en Innovatie (S&I);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.1
  - number: 13.1.d
    text: de afdeling Dienstverlening, Transparantie en Administratieve lasten (DTA).
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.1
  - number: 13.2.1
    text: Het Directiesecretariaat staat onder leiding van de directeur.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.2
  - number: 13.2.2
    text: Het Directiesecretariaat heeft tot taak het verzorgen van de ondersteuning van de directie.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.2
  - number: 13.3.1
    text: De afdeling Informatie-Infrastructuur staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.3
  - number: 13.3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.3
  - number: 13.3.2.a
    text: het bevorderen van een betrouwbare en veilige informatie-infrastructuur voor communicatie van en met de overheid;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.3
  - number: 13.3.2.b
    text: |-
      het bevorderen van eenmalige gegevensverstrekking met een stelsel van basisregistraties voor een doelmatige
      inrichting van de gegevenshuishouding van de overheid;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.3
  - number: 13.3.2.c
    text: het realiseren van een sluitend stelsel van persoonsnummers, met in achtneming van de privacy;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.3
  - number: 13.3.2.d
    text: het ontwikkelen van een overheidsarchitectuur met open standaarden en open source software;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.3
  - number: 13.3.2.e
    text: het faciliteren en bevorderen van informatiebeveiliging.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.3
  - number: 13.4.1
    text: De afdeling Strategie en Innovatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.4
  - number: 13.4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.4
  - number: 13.4.2.a
    text: het ontwikkelen van een strategie voor het overheidsinformatiebeleid;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.4
  - number: 13.4.2.b
    text: |-
      het op gang brengen en ondersteunen van innovatie in de bedrijfsvoering van organisaties in de openbare sector en
      het doorvertalen van de innovatiepraktijk, met ICT als belangrijk hulpmiddel, naar beleid(skansen);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.4
  - number: 13.4.2.c
    text: |-
      het coördineren van de internationale dossiers van de directie en het daartoe onderhouden van internationale
      netwerken;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.4
  - number: 13.4.2.d
    text: het beheren van relatienetwerken tussen en binnen openbaar bestuur, wetenschap en bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.4
  - number: 13.5.1
    text: De afdeling Dienstverlening, Transparantie en Administratieve lasten staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.5
  - number: 13.5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.5
  - number: 13.5.2.a
    text: het vergroten van de toegankelijkheid van overheidsinformatie;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.5
  - number: 13.5.2.b
    text: het verbeteren van de dienstverlening van de overheid;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.5
  - number: 13.5.2.c
    text: het bevorderen van de regie van burgers over de eigen persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.5
  - number: 13.5.2.d
    text: het beheren van relatienetwerken met andere overheden;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.5
  - number: 13.5.2.e
    text: |-
      het coördineren van de administratieve lastenreductie van de burger (overheidsbreed), ICT en administratieve
      lasten.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel13.5
