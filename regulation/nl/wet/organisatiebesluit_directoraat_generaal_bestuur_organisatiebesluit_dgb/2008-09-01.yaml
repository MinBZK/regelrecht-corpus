  - number: 14.4.1
    text: Het cluster Gegevensuitwisseling staat onder leiding van een coördinator
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.4
  - number: 14.4.2
    text: Het cluster heeft tot taak het beheren en verder ontwikkelen van voorzieningen voor gegevensuitwisseling.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.4
  - number: 14.5.1
    text: Het cluster Open Standaarden staat onder leiding van een coördinator.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.5
  - number: 14.5.2
    text: 'Het cluster heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.5
  - number: 14.5.2.a
    text: het ondersteunen van de organen Standaardisatie College en Standaardisatie Forum;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.5
  - number: 14.5.2.b
    text: het initiëren en onderhouden van contacten met communities die gericht zijn op het ontwikkelen van standaards.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.5
  - number: 14.6.1
    text: Het Bedrijfsbureau staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.6
  - number: 14.6.2
    text: 'Het Bedrijfsbureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.6
  - number: 14.6.2.a
    text: het zorgdragen voor de levering/uitvoering van bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.6
  - number: 14.6.2.b
    text: het uitvoeren van de secretariële en administratieve ondersteuning;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.6
  - number: 14.6.2.c
    text: het bieden van ondersteuning voor juridische en communicatieve aspecten.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.6
  - number: 14.7.1
    text: Het cluster Dienstontwikkeling en Integratie staat onder leiding van een coördinator.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.7
  - number: 14.7.2
    text: 'Het cluster heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.7
  - number: 14.7.2.a
    text: het ontwikkelen en onderhouden van de samenhang van de diensten van de GBO op basis van een Dienstenstructuur;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.7
  - number: 14.7.2.b
    text: het (door)ontwikkelen van de diensten van de GBO.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.7
  - number: '14.8'
    text: Het cluster Relatiebeheer is belast met de taak het uitvoeren van het relatiebeheer voor de GBO.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel14.8
  - number: '15'
    text: |-
      Tot de taak van de in dit besluit genoemde dienstonderdelen behoort voorts de uitvoering van andere taken dan
      vermeld, in opdracht van de minister, de secretaris-generaal of de directeur-generaal, voor zover hogere wet- en
      regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel15
  - number: 16.1.1
    text: De directeur-generaal is verantwoordelijk voor het beheer en de terinzagelegging van dit besluit.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel16.1
  - number: 16.1.2
    text: |-
      Het beheer geschiedt met inachtneming van de desbetreffende (richtlijnen inzake) administratieve
      organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel16.1
  - number: '16.2'
    text: |-
      Wijziging van dit besluit is voorbehouden aan de secretaris-generaal en geschiedt op voordracht van de directeur-
      generaal, na advisering door de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel16.2
  - number: '17.1'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 1 oktober 2007.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel17.1
  - number: '17.2'
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit directoraat-generaal Bestuur (Organisatiebesluit DGB).'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel17.2
  - number: '17.3'
    text: |-
      Het [Organisatiebesluit DGKB][ref1] en het [Organisatiebesluit DGMOS][ref2] worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0020524
      [ref2]: https://wetten.overheid.nl/BWBR0020526
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel17.3
    references:
      - id: ref1
        bwb_id: BWBR0020524
      - id: ref2
        bwb_id: BWBR0020526
