preamble:
  text: |-
    Gelet op artikel 4.2 van het Organisatiebesluit BZK 2006;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - het Ministerie: het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties;
        - de Minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - de directeur-generaal: de directeur-generaal Bestuur.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit heeft betrekking op het directoraat-generaal Bestuur, genoemd in het
      [Organisatiebesluit BZK 2006][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020525
  - number: 3.1.1
    text: Het Bureau Directeur-Generaal van het directoraat-generaal Bestuur staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel3.1
  - number: 3.1.2
    text: 'Het bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel3.1
  - number: 3.1.2.a
    text: het uitoefenen van de beleidscoördinatie en bestuursondersteuning;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel3.1
  - number: 3.1.2.b
    text: het verzorgen van de kaderstelling op DG-niveau;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel3.1
  - number: 3.1.2.c
    text: het uitvoeren van de integrale control (beleids- en PIOFACH-control);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel3.1
  - number: 3.1.2.d
    text: het adviseren inzake strategisch beleid;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel3.1
  - number: 3.1.2.e
    text: het optreden als opdrachtgever in de richting van de Staf;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel3.1
  - number: 3.1.2.f
    text: het coördineren van het onderzoeksveld;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel3.1
  - number: 3.1.2.g
    text: het richtinggevend sturen van de vertegenwoordigingen;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel3.1
  - number: 3.1.2.h
    text: het opstellen van speeches over beleidsvelden.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel3.1
  - number: '4.1'
    text: 'De directie Koninkrijksrelaties bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.1
  - number: 4.1.a
    text: de afdeling Koninkrijksverhoudingen (KV);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.1
  - number: 4.1.b
    text: de afdeling Samenwerkingsbeleid (SB).
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.1
  - number: 4.2.1
    text: De afdeling Koninkrijksverhoudingen staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.2
  - number: 4.2.2
    text: 'De afdeling heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.2
  - number: 4.2.2.a
    text: het coördineren van beleid ten aanzien van de bestuurlijke en financiële verhoudingen in het Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.2
  - number: 4.2.2.b
    text: het ontwikkelen, initiëren en aansturen van interdepartementale en internationale aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.2
  - number: 4.2.2.c
    text: |-
      het ontwikkelen en coördineren van de samenwerking met de Koninkrijkspartners op het terrein van de
      rechtshandhaving;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.2
  - number: 4.2.2.d
    text: het voorbereiden van parlementaire aangelegenheden en reizen;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.2
  - number: 4.2.2.e
    text: het coördineren van het opstellen en uitvoeren van hoofdstuk IV van de rijksbegroting;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.2
  - number: 4.2.2.f
    text: het adviseren inzake de naleving van het Statuut van het Koninkrijk der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.2
  - number: 4.3.1
    text: De afdeling Samenwerkingsbeleid staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.3
  - number: 4.3.2
    text: 'De afdeling heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.3
  - number: 4.3.2.a
    text: |-
      het ontwikkelen van het beleid ten aanzien van de samenwerking met de Koninkrijkspartners, betrekking hebbende
      op samenwerkingsprogramma’s met de Antilliaanse en Arubaanse overheid en de financiering van non-gouvernementele
      organisaties;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.3
  - number: 4.3.2.b
    text: |-
      het ontwikkelen van het beleid ten aanzien van het toezicht houden op de onafhankelijke ontwikkelingsfondsen en het
      monitoren van de resultaten van de samenwerking;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.3
  - number: 4.3.2.c
    text: het ontwikkelen van het beleid op het terrein van goed bestuur, waaronder openbare financiën en integriteit.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel4.3
  - number: '5.1'
    text: 'De directie Grote Stedenbeleid en Interbestuurlijke Betrekkingen bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.1
  - number: 5.1.a
    text: de directiestaf (DS);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.1
  - number: 5.1.b
    text: de afdeling Interbestuurlijke Betrekkingen (IB);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.1
  - number: 5.1.c
    text: de afdeling Binnenlands Bestuur en Europa (BBE).
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.1
  - number: 5.2.1
    text: De directiestaf staat onder leiding van een directiesecretaris.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.2
  - number: 5.2.2
    text: 'De directiestaf heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.2
  - number: 5.2.2.a
    text: het coördineren van de beleidsplanning van de directie;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.2
  - number: 5.2.2.b
    text: het verrichten van algemeen beleidsmatige werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.2
  - number: 5.2.2.c
    text: het coördineren van algemeen beheersmatige zaken op het gebied van huisvesting, automatisering e.d.;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.2
  - number: 5.2.2.d
    text: het verzorgen van de administratieve en secretariële ondersteuning van de directie.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.2
  - number: 5.3.1
    text: De afdeling Interbestuurlijke Betrekkingen staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.3
  - number: 5.3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.3
  - number: 5.3.2.a
    text: het zorgdragen voor goede bestuurlijke arrangementen;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.3
  - number: 5.3.2.b
    text: het signaleren van ontwikkelingen die van belang zijn voor de bestuurlijke verhoudingen;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.3
  - number: 5.3.2.c
    text: het faciliteren van processen die de bestuurlijke samenwerking bevorderen;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.3
  - number: 5.3.2.d
    text: het ontwikkelen van concepten voor bestuurlijke arrangementen die aansluiten op veranderingen in de samenleving;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.3
  - number: 5.3.2.e
    text: |-
      het beoordelen van voornemens van de diverse ministeries op hun gevolgen voor het openbaar bestuur en in het
      bijzonder gemeenten en provincies.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.3
  - number: 5.4.1
    text: De afdeling Binnenlands Bestuur en Europa staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.4
  - number: 5.4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.4
  - number: 5.4.2.a
    text: |-
      het ontwikkelen en uitvoeren van Europees en overig internationaal beleid gericht op een goede organisatie,
      verhoudingen, kwaliteit en functionering van het binnenlands bestuur;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.4
  - number: 5.4.2.b
    text: |-
      het ontwikkelen en uitvoeren van Nederlands beleid gericht op een goede decentrale en interbestuurlijke naleving
      van relevante regelgeving van de Europese Unie, verdragen van de Raad van Europa en bilaterale verdragen;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.4
  - number: 5.4.2.c
    text: |-
      het signaleren van Europese ontwikkelingen die van belang zijn voor de organisatie, verhoudingen, kwaliteit en
      functionering van het binnenlands bestuur;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.4
  - number: 5.4.2.d
    text: de bevordering van toezicht op de naleving van Europese regelgeving op decentraal niveau;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.4
  - number: 5.4.2.e
    text: |-
      het ontwikkelen, coördineren en faciliteren van Europese netwerken op het gebied van bestuur, grote stedenbeleid en
      grensoverschrijdende samenwerking;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.4
  - number: 5.4.2.f
    text: bevorderen dat medeoverheden optimaal gebruik kunnen maken van de mogelijkheden en kansen die Europa biedt;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.4
  - number: 5.4.2.g
    text: |-
      het functioneren als Coördinatiepunt Staatssteun en het doorgeleiden van staatssteunmeldingen van de decentrale
      overheden naar de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel5.4
  - number: '6.1'
    text: 'De directie Bestuurlijke en Financiële Organisatie bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.1
  - number: 6.1.a
    text: de afdeling Bestuurlijke Organisatie (BO);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.1
  - number: 6.1.b
    text: de afdeling Financiële Organisatie Binnenlands Bestuur (FOBB);
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.1
  - number: 6.1.c
    text: de afdeling Inspectie Financiën Lokale en provinciale Overheden (IFLO).
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.1
  - number: 6.2.1
    text: De afdeling Bestuurlijke Organisatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.2
  - number: 6.2.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.2
  - number: 6.2.2.a
    text: |-
      het ontwikkelen en uitvoeren van het beleid en met betrekking tot de organisatie, de kwaliteit en het functioneren
      van het binnenlands bestuur;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.2
  - number: 6.2.2.b
    text: het ontwikkelen en uitvoeren van het beleid inzake lijkbezorging;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.2
  - number: 6.2.2.c
    text: |-
      het zorgdragen voor de materiele rechtspositie van gekozen en benoemde politieke ambtsdragers en van gewezen
      politieke functionarissen en hun nagelaten betrekkingen;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.2
  - number: 6.2.2.d
    text: het ontwikkelen van beleid inzake de financiën van politieke partijen;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.2
  - number: 6.2.2.e
    text: het behandelen van verzoekschriften van burgers;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.2
  - number: 6.2.2.f
    text: het schorsings- en vernietigingsbeleid van besluiten op het gebied van het openbaar bestuur;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.2
  - number: 6.2.2.g
    text: het coördineren van het vernietigingsbeleid voor de gehele rijksdienst.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.2
  - number: 6.3.1
    text: De afdeling Financiële Organisatie Binnenlands Bestuur staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.3
  - number: 6.3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.3
  - number: 6.3.2.a
    text: |-
      het zorgdragen voor de beleidsontwikkeling betreffende een adequate financiële verhouding tussen rijk en mede-
      overheden, waaronder de omvang en verdeling van het gemeente- en provinciefonds;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.3
  - number: 6.3.2.b
    text: het zorgdragen voor de opstelling en uitvoering gemeente- en provinciefonds;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.3
  - number: 6.3.2.c
    text: het zorgdragen voor de beleidsontwikkeling betreffende het financiële toezicht op mede-overheden;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.3
  - number: 6.3.2.d
    text: |-
      het zorgdragen voor de beleidsontwikkeling betreffende het algemene beleids- en beheersinstrumentarium financiële
      organisatie voor mede-overheden, inclusief de accountantscontrole en de financieringsvoorschriften;
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.3
  - number: 6.3.2.e
    text: het zorgdragen voor de beleidsontwikkeling betreffende belastingen en heffingen van medeoverheden.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.3
  - number: 6.4.1
    text: De afdeling Inspectie Financiën Lokale en Provinciale Overheden staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.4
  - number: 6.4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.4
  - number: 6.4.2.a
    text: |-
      het instellen van onderzoeken en uitbrengen van adviezen op het gebied van de financiën
      van de individuele mede-overheden, in het bijzonder de behandeling van verzoeken van
      gemeenten en toepassing van [artikel 12 van de Financiële-verhoudingswet][ref1],
      de [artikelen 79][ref2] en [82 van de Wet bodembescherming][ref3],
      [artikel 3 van het Besluit rijksbijdragen bijstands- en bestrijdingskosten][ref4] en het
      [Bijdragenbesluit kosten ruiming explosieven Tweede Wereldoorlog 1999][ref5] alsmede het op verzoek van gemeenten
      samen met de desbetreffende provincie uitvoeren van begrotingsscans;


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel82
      [ref4]: https://wetten.overheid.nl/BWBR0013371#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0010700
    url: https://wetten.overheid.nl/BWBR0023194/2008-09-01#Artikel6.4
