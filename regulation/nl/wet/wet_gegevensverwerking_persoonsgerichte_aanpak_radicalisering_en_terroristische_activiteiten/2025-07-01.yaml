  - number: '5'
    text: |-
      1 Een deelnemer kan een casus voor overleg aanmelden bij de politie, het openbaar ministerie of de burgemeester
      van de gemeente van verblijf, naar aanleiding van gedragingen van een natuurlijke persoon of rechtspersoon die in
      verband kan worden gebracht met radicalisering of terroristische activiteiten of een situatie waarin deze verkeert,
      die verband houden met het doel van het casusoverleg, en daartoe gegevens verwerken.

      2 Een ieder kan een melding doen bij de politie, het openbaar ministerie of de burgemeester van de gemeente van
      verblijf over een natuurlijke persoon of rechtspersoon als bedoeld in het eerste lid.

      3 De politie, het openbaar ministerie en de burgemeester van de gemeente van verblijf analyseren gezamenlijk de
      aanmelding en komen tot een eensluidende beoordeling of de aanmelding van een casus in overeenstemming is met
      het doel van het casusoverleg. Zij houden daarbij rekening met objectieve criteria, waaronder de mate waarin
      betrokkene bereid is geweld toe te passen of te propageren, de mate waarin betrokkene vasthoudt aan extremistische
      denkbeelden, zijn sociale relaties, de mate van identificatie met een extremistische groep of ideologie, en zijn
      zelfredzaamheid. Bij de analyse van de aanmelding kunnen zij de overige deelnemers raadplegen.

      4 Indien de aanmelding in overeenstemming is met het doel, kunnen de politie, het openbaar ministerie en de
      burgemeester van de gemeente van verblijf overgaan tot verzameling en uitwisseling van, alsmede samenvoeging met
      andere relevante gegevens die beschikbaar zijn bij de deelnemers, teneinde te beoordelen welke deelnemers en welke
      derden, bedoeld in [artikel 3, derde lid][ref1], moeten worden betrokken in het casusoverleg. Hierbij kunnen zij de
      overige deelnemers raadplegen.

      5 De politie, het openbaar ministerie en de burgemeester van de gemeente van verblijf bepalen welke deelnemers en
      welke derden, bedoeld in [artikel 3, derde lid][ref2], gelet op hun onderscheidene taken en bevoegdheden, moeten
      worden betrokken in het casusoverleg met het oog op het doel van het casusoverleg, en daarbij gegevens mogen
      verwerken.

      6 Indien de casus niet wordt voorgelegd aan het casusoverleg, wordt de deelnemer die de casus heeft aangemeld,
      daarover geïnformeerd.

      7 Voor de toepassing van dit artikel zijn de [artikelen 4][ref3] en [8][ref4] van overeenkomstige toepassing op de
      verstrekking van persoonsgegevens door het college van burgemeester en wethouders van de gemeente van verblijf aan
      de politie, het openbaar ministerie en de burgemeester van de gemeente van verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0050740#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050740#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0050740#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0050740#Artikel8
