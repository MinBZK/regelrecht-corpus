  - number: '4'
    text: |-
      Tenzij naar het oordeel van de deelnemer zwaarwegende redenen zich daartegen verzetten, verstrekt elke deelnemer
      aan de deelnemers van het casusoverleg de navolgende categorieën persoonsgegevens, voor zover die noodzakelijk
      zijn met het oog op het doel van het casusoverleg, en de gegevens betrekking hebben op een natuurlijke persoon
      of rechtspersoon die in verband kan worden gebracht met radicalisering of terroristische activiteiten, waarop een
      aanmelding van een casus betrekking heeft:

      a. identificerende en contactgegevens;

      b. het burgerservicenummer;

      c. een omschrijving van de signalen die kunnen duiden op radicalisering;

      d. de naam en de contactgegevens van de deelnemer die de signalen heeft ingebracht;

      e. persoonsgegevens die noodzakelijk zijn voor het opstellen, uitvoeren of evalueren van het integrale plan van
      aanpak, bedoeld in [artikel 6, eerste lid][ref1];

      f. politiegegevens die op grond van [artikel 20 van de Wet politiegegevens][ref2] worden verstrekt;

      g. justitiële en strafvorderlijke gegevens en tenuitvoerleggingsgegevens die op grond van de
      [Wet justitiële en strafvorderlijke gegevens][ref3] worden verstrekt;

      h. gegevens over personen met wie betrokkene een sociale relatie onderhoudt, voor zover die gegevens
      relevant zijn bij het opstellen, uitvoeren of evalueren van het integrale plan van aanpak, bedoeld in
      [artikel 6, eerste lid][ref4].


