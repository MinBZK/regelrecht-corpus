  - number: '6'
    text: |-
      1 Bij het casusoverleg kunnen de betrokken deelnemers overgaan tot het verder verzamelen en uitwisselen van en
      samenvoegen met andere relevante gegevens, om gezamenlijk de casus te analyseren. Indien dit naar het oordeel
      van de betrokken deelnemers noodzakelijk is met het oog op het doel van het casusoverleg, kunnen de deelnemers in
      afstemming afspraken maken over een integraal plan van aanpak met interventies die ten aanzien van een betrokkene
      worden ingezet, en kunnen zij daartoe gegevens verwerken.

      2 Indien de deelnemers afspraken hebben gemaakt over interventies die ten aanzien van een betrokkene worden
      ingezet, kunnen de betrokken deelnemers gegevens verwerken die met het oog op het doel van het casusoverleg,
      noodzakelijk zijn voor de uitvoering, evaluatie en zo nodig het bijstellen van die afspraken alsmede voor het
      beslissen over afsluiting van de casus.

      3 Indien de deelnemers van het casusoverleg de casus afsluiten, worden de persoonsgegevens die in de casus zijn
      opgenomen, na afsluiting afgeschermd voor de deelnemers totdat uitvoering wordt gegeven aan de verplichting tot
      vernietiging of anonimisering, bedoeld in [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050740#Artikel9
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0050740
        artikel: '9'
  - number: '7'
    text: |-
      1 De deelnemers die ter uitvoering van deze wet persoonsgegevens bewaren betreffende een natuurlijke persoon of
      rechtspersoon die in die gemeente verblijft of heeft verbleven, onderscheidenlijk in die gemeente is gevestigd,
      en die in verband kan worden gebracht met radicalisering of terroristische activiteiten, kunnen de hem betreffende
      persoonsgegevens verstrekken aan de deelnemers van hetzelfde soort casusoverleg van een andere gemeente van
      verblijf of waarin de gevolgen van de radicalisering van betrokkene merkbaar zijn of waarin personen verblijven met
      wie betrokkene een sociale relatie onderhoudt.

      2 De gegevensverstrekking ingevolge het eerste lid vindt niet plaats voor zover zwaarwegende redenen zich daartegen
      verzetten naar het oordeel van de deelnemers die deze persoonsgegevens oorspronkelijk hebben ingebracht.
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel7
  - number: '8'
    text: |-
      1 Gelet op artikel 9, eerste lid, onderdeel g, van de Algemene verordening gegevensbescherming, kunnen de
      gegevens die op grond van deze wet worden verwerkt, voor zover noodzakelijk voor het doel van het casusoverleg,
      persoonsgegevens bevatten waaruit ras of etnische afkomst, politieke, religieuze of levensbeschouwelijke
      overtuigingen blijken, alsmede gegevens over gezondheid.

      2 Persoonsgegevens van strafrechtelijke aard als bedoeld in
      [artikel 1 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] mogen worden verwerkt voor zover
      noodzakelijk voor het doel van het casusoverleg.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel1
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '1'
  - number: '9'
    text: |-
      De persoonsgegevens die door de deelnemers van het casusoverleg gezamenlijk worden verwerkt, worden vernietigd
      of geanonimiseerd zodra zij niet langer noodzakelijk zijn voor het doel van het casusoverleg, en worden in ieder
      geval uiterlijk vijf jaar na de datum van laatste verwerking verwijderd uit de systemen van de deelnemers van
      het casusoverleg of geanonimiseerd, tenzij een wettelijk voorschrift daaraan in de weg staat of de verwerking
      noodzakelijk is voor de instelling, uitoefening of onderbouwing van een rechtsvordering.
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel9
  - number: '10'
    text: |-
      Mocht gedurende de gegevensverwerking blijken dat persoonsgegevens onjuist zijn, dan worden deze onverwijld
      gecorrigeerd en wordt een melding gedaan aan de organisatie waarvan de persoonsgegevens afkomstig zijn, opdat ook
      in haar gegevensbestanden kan worden gecontroleerd of de persoonsgegevens juist zijn geregistreerd en na validatie
      de gegevens kunnen worden gecorrigeerd.
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel10
  - number: '11'
    text: |-
      Indien de deelnemers hun verplichting de betrokkene te informeren, bedoeld in artikel 14 van
      de Algemene verordening gegevensbescherming, buiten toepassing laten voor zover zulks naar hun
      oordeel noodzakelijk en evenredig is ter waarborging van een of meer van de belangen, bedoeld in
      [artikel 41, eerste lid, van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], stellen zij daarvan
      een schriftelijke motivering op ten behoeve van een casusoverleg. Zij geven de schriftelijke motivering ter inzage
      van de commissie, bedoeld in [artikel 15][ref2], ten behoeve van de uitoefening van haar taak, bedoeld in dat
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0050740#Artikel15
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0050740
        artikel: '15'
  - number: '12'
    text: |-
      1 De deelnemers van het casusoverleg, genoemd in [artikel 3, eerste lid][ref1], zijn gezamenlijke
      verwerkingsverantwoordelijken als bedoeld in artikel 26, eerste lid, van de Algemene verordening
      gegevensbescherming voor de verwerking van persoonsgegevens in het casusoverleg.

      2 De deelnemers wijzen één van de functionarissen voor gegevensbescherming van de deelnemende overheidsinstanties
      of overheidsorganen aan die als coördinerend functionaris voor gegevensbescherming voor het casusoverleg optreedt.

      3 De deelnemers wijzen personeel aan ten behoeve van de inzet in het casusoverleg, dat in dienst blijft van de
      betreffende deelnemers. Een private deelnemer wijst ten behoeve van de inzet in het casusoverleg slechts personen
      aan die niet tevens worden belast met commerciële werkzaamheden voor die private partij.

      4 Bij algemene maatregel van bestuur worden regels gesteld over:

      a. de respectievelijke verantwoordelijkheden van de deelnemers met betrekking tot de uitoefening van de rechten van
      betrokkene en hun respectieve verplichtingen om de informatie te verstrekken, bedoeld in artikel 14 van de Algemene
      verordening gegevensbescherming;

      b. de aanwijzing van een deelnemende overheidsinstantie of deelnemend overheidsorgaan als contactpunt
      voor betrokkenen voor de uitoefening van de rechten op grond van hoofdstuk III van de Algemene verordening
      gegevensbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0050740#Artikel3
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0050740
        artikel: '3'
  - number: '13'
    text: |-
      1 Uitsluitend door de deelnemers geautoriseerde personen hebben toegang tot de systemen waarin de deelnemers
      gezamenlijk persoonsgegevens verwerken. De deelnemers onderhouden een systeem van autorisaties dat voldoet aan
      de vereisten van zorgvuldigheid en evenredigheid. Geautoriseerd worden slechts personen die zijn aangewezen ten
      behoeve van de inzet in het casusoverleg en die zijn belast met:

      a. de uitvoering van de gegevensverwerking voor het doel van het casusoverleg,

      b. de toetsing op rechtmatigheid, of

      c. het onderhoud of de ondersteuning van de systemen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de betrouwbaarheidsvereisten
      aan geautoriseerde personen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel13
  - number: '14'
    text: |-
      1 Binnen het casusoverleg worden persoonsgegevens uitsluitend verwerkt in systemen waarvoor een adequaat
      beveiligingsniveau geldt. Daarbij worden persoonsgegevens beveiligd ten minste volgens door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties vastgestelde richtlijnen.

      2 De deelnemers dragen zorg voor de vastlegging langs elektronische weg (logging) van verwerkingen van
      persoonsgegevens in geautomatiseerde systemen van het casusoverleg overeenkomstig de door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties vastgestelde richtlijnen voor informatiebeveiliging. De vastgelegde
      gegevens worden uitsluitend gebruikt voor de controle van de rechtmatigheid van de gegevensverwerking, voor interne
      controles, ter waarborging van de integriteit en de beveiliging van de persoonsgegevens en voor gerechtelijke
      procedures.

      3 Alle deelnemers dragen zorg dat elke andere verwerking, of vastlegging langs elektronische weg (logging) van
      verwerkingen, van bij het casusoverleg verkregen persoonsgegevens, uitsluitend plaatsvindt in systemen waarvoor
      een adequaat beveiligingsniveau geldt dat voldoet aan of vergelijkbaar is met de richtlijnen, bedoeld in het eerste
      onderscheidenlijk tweede lid.
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel14
  - number: '15'
    text: |-
      De deelnemers stellen een gezamenlijke rechtmatigheidsadviescommissie in, die tot taak heeft de rechtmatigheid
      van de verwerking van persoonsgegevens in de casusoverleggen structureel te beoordelen bij nieuwe verwerkingen en
      wijziging in verwerkingen en om voorstellen aan het casusoverleg te doen om onrechtmatigheden op te lossen. Bij of
      krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de werkwijze en de samenstelling van
      de rechtmatigheidsadviescommissie, de wijze van benoeming en ontslag van haar leden.
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel15
  - number: '16'
    text: |-
      1 Het casusoverleg doet de uitvoering van de bij of krachtens deze wet gegeven regels en de Algemene verordening
      gegevensbescherming controleren door middel van het periodiek doen verrichten van privacy audits.

      2 Het casusoverleg zendt een afschrift van de controleresultaten van de privacy audits aan de Autoriteit
      persoonsgegevens.

      3 Indien uit de controleresultaten blijkt dat niet wordt voldaan aan het bij of krachtens deze wet bepaalde, laat
      het casusoverleg binnen een jaar een hercontrole uitvoeren op die onderdelen die niet voldeden aan de gestelde
      voorwaarden. Het tweede lid is van overeenkomstige toepassing.

      4 Een ieder die betrokken is bij een controle als bedoeld in dit artikel is verplicht tot geheimhouding van de
      persoonsgegevens waarover hij de beschikking heeft gekregen, behoudens voor zover enig wettelijk voorschrift hem
      tot mededeling verplicht of zijn taak daartoe noodzaakt.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de inhoud en wijze van
      uitvoering van controle, bedoeld in het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel16
  - number: '17'
    text: |-
      Eenieder die betrokken is bij de werkzaamheden van het casusoverleg en daarbij de beschikking krijgt over
      persoonsgegevens, en voor wie niet reeds uit hoofde van ambt, beroep of wettelijk voorschrift ter zake van die
      gegevens een geheimhoudingsplicht geldt, is verplicht tot geheimhouding van die gegevens, behoudens voor zover enig
      wettelijk voorschrift voorziet in de bevoegdheid of verplichting om de gegevens te verstrekken of voor zover de
      gegevensverstrekking noodzakelijk is voor het afleggen van verantwoording door een medewerker aan de deelnemer die
      hem heeft aangewezen voor de inzet in het casusoverleg.
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel17
  - number: '18'
    text: |-
      1 Een casusoverleg doet jaarlijks verslag van de effectiviteit en bruikbaarheid van de uitgewisselde gegevens,
      voor zover dit de verwezenlijking van de doeleinden van het casusoverleg niet onmogelijk dreigt te maken of ernstig
      in het gedrang dreigt te brengen. Meerdere casusoverleggen kunnen beslissen om één gezamenlijk jaarverslag uit
      te brengen.

      2 Het jaarverslag wordt bekendgemaakt door plaatsing op internet.
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel18
  - number: '19'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de waarborgen.
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel19
  - number: '24'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel24
  - number: '25'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel25
  - number: '26'
    text: |-
      Deze wet wordt aangehaald als: Wet gegevensverwerking persoonsgerichte aanpak radicalisering en terroristische
      activiteiten.
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel26
