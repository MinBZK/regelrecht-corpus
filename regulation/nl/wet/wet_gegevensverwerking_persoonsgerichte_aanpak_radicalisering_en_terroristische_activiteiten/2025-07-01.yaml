bwb_id: BWBR0050740
url: https://wetten.overheid.nl/BWBR0050740/2025-07-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is een beter juridisch kader te scheppen voor de
    gegevensverwerking in de persoonsgerichte aanpak van radicalisering en terroristische activiteiten;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *radicalisering:* het proces dat uiteindelijk kan leiden tot terroristische activiteiten of tot extremistische
      activiteiten, zijnde activiteiten waarbij personen of groepen vanuit ideologisch motief bereid zijn in ernstige
      mate de wet te overtreden of activiteiten te verrichten die de democratische rechtsstaat ondermijnen;
        - *gemeente van verblijf:* gemeente waarin de betrokkene verblijft of voor het laatst heeft verbleven
      onderscheidenlijk gevestigd is.
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel1
  - number: '2'
    text: |-
      1 De burgemeester van de gemeente van verblijf van een natuurlijke persoon of rechtspersoon die in verband kan
      worden gebracht met radicalisering of terroristische activiteiten bevordert de afstemming van maatregelen ten
      aanzien van die persoon en draagt daartoe zorg voor casusoverleg tussen de deelnemers.

      2 Deelnemers van een casusoverleg ten behoeve van de persoonsgerichte aanpak van radicalisering en terroristische
      activiteiten verwerken gezamenlijk gegevens voor zover dat noodzakelijk is voor de uitoefening, afstemming
      en coördinatie van de inzet van hun wettelijke taken en bevoegdheden en daaraan gerelateerde noodzakelijke
      werkzaamheden op het terrein van strafrechtelijke en bestuursrechtelijke handhaving alsmede begeleiding en zorg-
      en hulpverlening in het belang van het voorkomen, verminderen en bestrijden van radicalisering en terroristische
      activiteiten.
    url: https://wetten.overheid.nl/BWBR0050740/2025-07-01#Artikel2
  - number: '3'
    text: |-
      1 Als deelnemers aan het casusoverleg worden aangewezen:

      a. de burgemeester van de gemeente van verblijf en van andere gemeenten, voor zover in die andere gemeenten
      de gevolgen van de radicalisering van betrokkene merkbaar zijn of voor zover daar personen verblijven met wie
      betrokkene een sociale relatie onderhoudt, van wie de gegevens relevant zijn bij het opstellen of uitvoeren
      van het integrale plan van aanpak, bedoeld in [artikel 6, eerste lid][ref1], voor de uitoefening van zijn
      wettelijke taken en bevoegdheden op het terrein van de handhaving van de openbare orde bij of krachtens
      [hoofdstuk XI van titel III van de Gemeentewet][ref2], [paragraaf 2.3 van de Politiewet 2012][ref3],
      [artikel 13b van de Opiumwet][ref4] of een gemeentelijke verordening en voor de uitoefening van zijn wettelijke
      taken en bevoegdheden bij of krachtens de [Wet tijdelijk huisverbod][ref5], de [artikelen 7:1][ref6],
      [7:2][ref7], [7:4][ref8] en [8:1 van de Wet verplichte geestelijke gezondheidszorg][ref9] en de
      __REF009___________________________________________________________________________________________________________
      ____;

      b. het college van burgemeester en wethouders van de gemeenten, bedoeld in onderdeel
      a, voor de uitoefening van zijn wettelijke taken en bevoegdheden bij of krachtens de
      [artikelen 2.1.1, eerste lid][ref11], [2.1.7][ref12], [2.3.1 tot en met 2.3.6][ref13],
      [2.3.9][ref14], [2.3.10][ref15] en [2.4.1 van de Wet maatschappelijke ondersteuning 2015][ref16], de
      [artikelen 2.3][ref17] en [2.4 van de Jeugdwet][ref18], [artikel 7 van de Participatiewet][ref19],
      [artikel 3 van de Wet gemeentelijke schuldhulpverlening][ref20], [artikel 16 van de Leerplichtwet 1969][ref21]
      en de wettelijke taken en bevoegdheden, bedoeld in de [artikelen 5:1][ref22], [5:2][ref23],
      [5:3][ref24] en [5:16 van de Wet verplichte geestelijke gezondheidszorg][ref25],
      [artikel 28c van de Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref26] en
      [artikel 2:7 van het Besluit tenuitvoerlegging strafrechtelijke beslissingen][ref27];

      c. de politie, voor de uitoefening van de taak, bedoeld in [artikel 3 van de Politiewet 2012][ref28],
      en de daaruit voortvloeiende bevoegdheden, en de wettelijke taken en bevoegdheden op grond
      van de [artikelen 5:3][ref29], [7:3][ref30], [8:1][ref31], [8:2][ref32], [8:10][ref33] en
      [13:3 van de Wet verplichte geestelijke gezondheidszorg][ref34] en de [artikelen 28b, tweede lid][ref35], en
      [33 van de Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref36];

      d. het openbaar ministerie, voor de uitoefening van de in
      [artikel 124 van de Wet op de rechterlijke organisatie][ref37] opgedragen taak en de daaruit voortvloeiende
      bevoegdheden en de uitoefening van de wettelijke taken en bevoegdheden op grond van de [artikelen 5:3][ref38],
      [5:16][ref39], [5:17, eerste lid][ref40], [5:18][ref41], [5:19,][ref42][7:7, eerste lid][ref43],
      [7:11, eerste lid][ref44], [8:1, eerste en derde lid][ref45], [8:17, zevende lid][ref46],
      [8:18, derde lid, onderdeel b, en tiende lid][ref47], [8:19, derde lid, aanhef][ref48],
      [13:3, eerste, vierde en vijfde lid, van de Wet verplichte geestelijke gezondheidszorg][ref49],
      de [artikelen 28a, derde lid, aanhef][ref50],
      [28b, eerste lid, van de Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref51] en
      [artikel 2.3 van de Wet forensische zorg][ref52];

      e. reclasseringsinstellingen, voor de taken bedoeld in [hoofdstuk 3 van de Reclasseringsregeling 1995][ref53] en
      [artikel 2:7 van het Besluit tenuitvoerlegging strafrechtelijke beslissingen][ref54];

      f. de raad voor de kinderbescherming, voor de uitvoering van de wettelijke taken en bevoegdheden
      op grond van de [artikelen 255][ref55] en [257 van Boek 1 van het Burgerlijk Wetboek][ref56],
      [artikel 2:7 van het Besluit tenuitvoerlegging strafrechtelijke beslissingen][ref57],
      [artikel 3.1 van de Jeugdwet][ref58] en de [artikelen 5, eerste lid][ref59], [6][ref60], [10][ref61] en
      [25 van de Wet opneming buitenlandse kinderen ter adoptie][ref62].

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wettelijke taken en
      bevoegdheden van de deelnemers en daaraan gerelateerde noodzakelijke werkzaamheden waarvoor gegevens kunnen worden
      verwerkt binnen het casusoverleg.

      3 De burgemeester van de gemeente van verblijf, de politie en het openbaar ministerie kunnen bepalen dat zij op
      incidentele basis derden laten deelnemen aan het casusoverleg, indien deze derden over deskundigheid beschikken die
      noodzakelijk is bij de aanpak van een specifieke casus en zij gelet op hun onderscheidene wettelijke of publieke
      taken en bevoegdheden een rol kunnen spelen bij het opstellen, uitvoeren of evalueren van het integrale plan van
      aanpak, bedoeld in [artikel 6, eerste lid][ref63]. De derden krijgen uitsluitend toegang tot de persoonsgegevens
      die in het casusoverleg worden verwerkt voor zover dat noodzakelijk is voor het doel van het casusoverleg.

      4 Bij toepassing van het derde lid zijn de artikelen die bij of krachtens deze wet van toepassing zijn op
      alle deelnemers, genoemd in het eerste lid, van overeenkomstige toepassing op de derden, met uitzondering van
      [artikel 12, eerste lid][ref64]. De deelnemers, genoemd in het eerste lid, zien erop toe dat derden die op
      incidentele basis deelnemen aan het casusoverleg voldoen aan de Algemene verordening gegevensbescherming en het
      bepaalde bij of krachtens deze wet.


