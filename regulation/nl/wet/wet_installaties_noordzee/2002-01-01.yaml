$id: wet_installaties_noordzee
regulatory_layer: WET
publication_date: '2001-11-01'
valid_from: '2002-01-01'
bwb_id: BWBR0002467
url: https://wetten.overheid.nl/BWBR0002467/2002-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter bescherming van rechtsbelangen voorzieningen te
    treffen ten aanzien van installaties op de bodem van het deel van de Noordzee waarvan de grenzen samenvallen met
    die van het aan Nederland toekomende gedeelte van het continentale plat, een en ander zolang geen internationale
    regeling ter zake is tot stand gekomen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002467/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet worden onder installaties ter zee verstaan: installaties opgericht buiten de territoriale wateren op de
      bodem van het deel van de Noordzee waarvan de grenzen samenvallen met die van het aan Nederland toekomende gedeelte
      van het continentale plat.
    url: https://wetten.overheid.nl/BWBR0002467/2002-01-01#Artikel1
  - number: '2'
    text: |-
      De Nederlandse strafwet is toepasselijk op ieder die zich op of met betrekking tot een installatie ter zee aan enig
      strafbaar feit schuldig maakt.
    url: https://wetten.overheid.nl/BWBR0002467/2002-01-01#Artikel2
  - number: '3'
    text: |-
      Op en met betrekking tot installaties ter zee gelden de daartoe bij algemene maatregel van bestuur aangewezen
      Nederlandse wettelijke voorschriften.
    url: https://wetten.overheid.nl/BWBR0002467/2002-01-01#Artikel3
  - number: '4'
    text: |-
      Bij algemene maatregel van bestuur kan ten aanzien van installaties ter zee worden voorzien in de betrekkelijke
      bevoegdheid van autoriteiten, colleges en ambtenaren, belast met de uitvoering van krachtens [artikel 3][ref1]
      aangewezen voorschriften, dan wel met het ten uitvoer leggen van rechterlijke uitspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0002467#Artikel3
    url: https://wetten.overheid.nl/BWBR0002467/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002467
        artikel: '3'
  - number: '5'
    text: |-
      Bij algemene maatregel van bestuur kan, ten aanzien van daarin te omschrijven installaties ter zee, de
      toepasselijkheid van de Nederlandse strafwet en van de krachtens [artikel 3][ref1] aangewezen wettelijke
      voorschriften worden uitgesloten of beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002467#Artikel3
    url: https://wetten.overheid.nl/BWBR0002467/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002467
        artikel: '3'
  - number: '6'
    text: |-
      Indien Wij niet, binnen drie maanden na het in werking treden van een algemene maatregel van bestuur, gegrond
      op [artikel 3][ref1] of [artikel 5][ref2], aan de Staten-Generaal een voorstel van wet hebben doen toekomen ter
      vervanging van die maatregel, of indien zodanig voorstel wordt ingetrokken of verworpen, trekken Wij de maatregel
      onverwijld in.


      [ref1]: https://wetten.overheid.nl/BWBR0002467#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002467#Artikel5
    url: https://wetten.overheid.nl/BWBR0002467/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002467
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002467
        artikel: '5'
  - number: '8'
    text: |-
      Handelen in strijd met een voorschrift, vastgesteld krachtens [artikel 7][ref1], wordt gestraft met geldboete van
      ten hoogste een geldboete van de tweede categorie. Het strafbare feit wordt beschouwd als een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0002467#Artikel7
    url: https://wetten.overheid.nl/BWBR0002467/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002467
        artikel: '7'
  - number: '9'
    text: 'Deze wet kan worden aangehaald onder de titel: Wet installaties Noordzee.'
    url: https://wetten.overheid.nl/BWBR0002467/2002-01-01#Artikel9
  - number: '10'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag na de datum van uitgifte van het *Staatsblad* waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0002467/2002-01-01#Artikel10
