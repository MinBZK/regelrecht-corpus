$id: wijzigingswet_burgerlijk_wetboek_en_ambtenarenwet_ivm_verbod_tot_maken_van_onderscheid_tussen_werknemers_naar_arbeidsduur
regulatory_layer: WET
publication_date: '2025-11-25'
valid_from: '2026-01-01'
bwb_id: BWBR0008161
url: https://wetten.overheid.nl/BWBR0008161/2026-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het maken van onderscheid tussen werknemers op grond
    van de arbeidsduur te verbieden en mede daartoe het Burgerlijk Wetboek en de Ambtenarenwet te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008161/2026-01-01#ArtikelAanhef
articles:
  - number: III.1
    text: |-
      Het maken van onderscheid op grond van een verschil in arbeidsduur is verboden bij de voorwaarden waaronder een
      arbeidsovereenkomst wordt aangegaan, voortgezet dan wel beëindigd, en bij de voorwaarden waaronder een aanstelling
      wordt verleend, verlengd dan wel beëindigd, tenzij een dergelijk onderscheid objectief is gerechtvaardigd.
    url: https://wetten.overheid.nl/BWBR0008161/2026-01-01#ArtikelIII
  - number: III.2
    text: Een beding in strijd met het eerste lid is nietig.
    url: https://wetten.overheid.nl/BWBR0008161/2026-01-01#ArtikelIII
  - number: V
    text: |-
      In geval een natuurlijk persoon, rechtspersoon of bevoegd gezag een ander onder zijn gezag arbeid laat verrichten,
      anders dan krachtens arbeidsovereenkomst naar burgerlijk recht of ambtelijke aanstelling, is artikel 648 van Boek 7
      van het Burgerlijk Wetboek van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008161/2026-01-01#ArtikelV
  - number: Va.1
    text: |-
      [Artikel V][ref1] van deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0008161#ArtikelV
    url: https://wetten.overheid.nl/BWBR0008161/2026-01-01#ArtikelVa
    references:
      - id: ref1
        bwb_id: BWBR0008161
        artikel: V
  - number: Va.2
    text: |-
      Waar in deze wet wordt gesproken over aanstelling wordt tevens aanstelling van ambtenaren als bedoeld in de
      [Ambtenarenwet BES][ref1] begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0008161/2026-01-01#ArtikelVa
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: VII
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag van de vierde kalendermaand na de datum van uitgifte van
      het *Staatsblad* waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008161/2026-01-01#ArtikelVII
