  - number: V
    text: |-
      In geval een natuurlijk persoon, rechtspersoon of bevoegd gezag een ander onder zijn gezag arbeid laat verrichten,
      anders dan krachtens arbeidsovereenkomst naar burgerlijk recht of ambtelijke aanstelling, is artikel 648 van Boek 7
      van het Burgerlijk Wetboek van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008161/1997-04-01#ArtikelV
  - number: VII
    text: |-
