preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het maken van onderscheid tussen werknemers op grond
    van de arbeidsduur te verbieden en mede daartoe het Burgerlijk Wetboek en de Ambtenarenwet te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008161/1997-04-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Het maken van onderscheid op grond van een verschil in arbeidsduur is verboden bij de voorwaarden waaronder een
      arbeidsovereenkomst wordt aangegaan, voortgezet dan wel beëindigd, en bij de voorwaarden waaronder een aanstelling
      wordt verleend, verlengd dan wel beëindigd, tenzij een dergelijk onderscheid objectief is gerechtvaardigd.

      2 Een beding in strijd met het eerste lid is nietig.

      3 De Commissie gelijke behandeling, genoemd in [artikel 11 van de Algemene wet gelijke behandeling][ref1],
      kan onderzoeken of een onderscheid is of wordt gemaakt als bedoeld in het eerste lid. De [artikelen 12][ref2],
      [13][ref3], [14][ref4], [15][ref5], [20][ref6], tweede lid, en [33 van de Algemene wet gelijke behandeling][ref7]
      zijn van overeenkomstige toepassing.


