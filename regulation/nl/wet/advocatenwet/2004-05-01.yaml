---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: advocatenwet
regulatory_layer: WET
publication_date: '2021-08-31'
valid_from: '2004-05-01'
bwb_id: BWBR0002093
url: https://wetten.overheid.nl/BWBR0002093/2004-05-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Nederlandse orde van advocaten in te stellen,
    alsmede de regelen betreffende de orde en discipline voor de advocaten en procureurs te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: De advocaten worden ingeschreven bij de rechtbank van het arrondissement, waarin hun kantoor is gevestigd.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel1
  - number: '1.2'
    text: |-
      De bij de rechtbank in het arrondissement 's-Gravenhage ingeschreven advocaten zijn tevens advocaat bij de Hoge
      Raad.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel1
  - number: '1.3'
    text: Een advocaat kan slechts bij één rechtbank ingeschreven zijn.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel1
  - number: '1.4'
    text: De inschrijving als advocaat geschiedt voorwaardelijk of onvoorwaardelijk.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel1
  - number: '1.5'
    text: |-
      Voorwaardelijke inschrijving vindt plaats indien de verzoeker geen bewijs kan overleggen dat hij met gunstig
      gevolg het in [artikel 9c][ref1] bedoelde examen heeft afgelegd of niet in het bezit is van een ten aanzien van het
      beroep van advocaat afgegeven EG-verklaring als bedoeld in de Algemene wet erkenning EG-hoger-onderwijsdiploma’s
      dan wel in de [Algemene wet erkenning EG-beroepsopleidingen][ref2]. In alle overige gevallen alsmede in het geval,
      bedoeld in het [eerste lid van artikel 2a][ref3], geschiedt de inschrijving onvoorwaardelijk. Wordt het bewijs of
      de verklaring nadien alsnog overgelegd dan wordt van rechtswege aan de inschrijving het voorwaardelijk karakter
      ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel9c
      [ref2]: https://wetten.overheid.nl/BWBR0006781
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 9c
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0006781
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 2a
        afdeling: '1'
  - number: '2.1'
    text: |-
      Ieder die aan een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, hebben verkregen het doctoraat
      in de rechtsgeleerdheid of het recht om de titel meester te voeren, mits dit doctoraat of dit recht verkregen is op
      grond van het afleggen van een examen in het privaatrecht met inbegrip van burgerlijk procesrecht, het strafrecht
      met inbegrip van strafprocesrecht, alsmede in een van de volgende drie vakken: staatsrecht, bestuursrecht
      met inbegrip van administratief procesrecht, of belastingrecht, is bevoegd aan de voorzitter van de rechtbank
      schriftelijk inschrijving als advocaat te verzoeken. Eveneens is bevoegd inschrijving te verzoeken degene die in
      het bezit is van een ten aanzien van het beroep van advocaat afgegeven EG-verklaring als bedoeld in de Algemene wet
      erkenning EG-hoger-onderwijsdiploma’s dan wel in de [Algemene wet erkenning EG-beroepsopleidingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0006781
  - number: '2.2'
    text: |-
      Gelijktijdig met de indiening van het verzoek als bedoeld in het eerste lid legt de verzoeker over een verklaring
      omtrent het gedrag, afgegeven volgens de [Wet justitiële gegevens][ref1]. Indien de verzoeker elders als advocaat
      ingeschreven is of is geweest, legt hij tevens over een document dat is afgegeven door de raad van toezicht
      aldaar, waaruit blijkt of de verzoeker in het kader van de uitoefening van zijn beroep als advocaat al dan niet
      tuchtrechtelijk is veroordeeld dan wel of hij in staat van faillissement heeft verkeerd of ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: '2.3'
    text: |-
      De griffier zendt onverwijld afschrift van het verzoek en de daarbij overgelegde verklaringen of documenten aan de
      raad van toezicht, bedoeld in [artikel 22, eerste lid, van deze wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel22
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '22'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: '2.4'
    text: |-
      Indien de raad van toezicht zich, overeenkomstig [artikel 4, eerste lid][ref1], tegen inwilliging van een
      verzoek om inschrijving met vrucht heeft verzet, wordt een nieuw verzoek, binnen een jaar na het eerstbedoelde
      ingediend, buiten behandeling gelaten, tenzij, naar het oordeel van de voorzitter van de rechtbank, wijziging in
      de omstandigheden of het feit dat het verzoek bij een andere rechtbank is ingediend behandeling van het verzoek
      rechtvaardigt; in het laatste geval handelt de griffier, zoals in het vorige lid is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel4
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '4'
        afdeling: '1'
  - number: 2a.1
    text: |-
      In afwijking van het [eerste lid van artikel 2][ref1] is degene die in een andere lidstaat van de Europese Unie
      of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, hierna te
      noemen staat van herkomst, gerechtigd is zijn beroepswerkzaamheid uit te oefenen onder de benaming advocaat of
      een daarmee overeenkomstige benaming in de taal of in de talen van de staat van herkomst, bevoegd te verzoeken
      te worden ingeschreven als advocaat, indien hij een document overlegt waaruit blijkt dat hij gedurende ten minste
      drie jaar daadwerkelijk en regelmatig in Nederland in het Nederlandse recht, met inbegrip van het gemeenschapsrecht
      als advocaat werkzaam is geweest. Onder daadwerkelijk en regelmatig werkzaam wordt verstaan de daadwerkelijke
      uitoefening van de werkzaamheid zonder andere dan de in het dagelijks leven normale onderbrekingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel2
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '2'
        afdeling: '1'
  - number: 2a.2
    text: |-
      De advocaat dient een aanvraag om afgifte van een document als bedoeld in het eerste lid in bij de raad van
      toezicht in het arrondissement van de rechtbank waarbij de advocaat kan worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2a
  - number: 2a.3
    text: |-
      De aanvraag omvat ten minste inlichtingen of bescheiden betreffende het aantal en de aard van de door de aanvrager
      behandelde dossiers.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2a
  - number: 2a.4
    text: |-
      De raad van toezicht kan verifiëren of de uitgeoefende werkzaamheden als regelmatig en daadwerkelijk kunnen
      worden aangemerkt en kan zo nodig de advocaat verzoeken mondeling of schriftelijk aanvullende verduidelijkingen of
      preciseringen te verstrekken met betrekking tot inlichtingen en bescheiden, als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2a
  - number: 2a.5
    text: |-
      In plaats van de verklaring omtrent het gedrag of de andere in het [tweede lid van artikel 2][ref1] genoemde
      documenten kan de advocaat, bedoeld in het eerste lid, een met deze verklaring of die documenten overeenkomende
      documenten, afgegeven door het daartoe bevoegde gezag in de staat van herkomst overleggen. Artikel 7 van de
      Algemene wet erkenning EG-hoger-onderwijsdiploma's is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel2
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '2'
        afdeling: '1'
  - number: 2b.1
    text: |-
      Indien de advocaat gedurende ten minste drie jaar daadwerkelijk en regelmatig in Nederland als advocaat werkzaam
      is geweest, doch gedurende kortere tijd in het Nederlandse recht, kan de raad van toezicht het document, bedoeld
      in het [eerste lid van artikel 2a][ref1], afgeven als de advocaat voldoende bekwaam is om de werkzaamheden in
      het Nederlandse recht, met inbegrip van het gemeenschapsrecht voort te zetten. Hierbij houdt de raad van toezicht
      rekening met:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 2a
        afdeling: '1'
  - number: 2b.1.a
    text: |-
      de periode gedurende welke de betrokken advocaat daadwerkelijk en regelmatig werkzaamheden heeft verricht in
      Nederland,
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2b
  - number: 2b.1.b
    text: de kennis en beroepservaring op het gebied van het Nederlandse recht,
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2b
  - number: 2b.1.c
    text: de deelname aan cursussen of seminars met betrekking tot het Nederlandse recht en
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2b
  - number: 2b.1.d
    text: |-
      de kennis en beroepservaring van alsmede de deelname aan cursussen of seminars over de Nederlandse beroeps- en
      gedragsregels.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2b
  - number: 2b.2
    text: |-
      De beoordeling van de daadwerkelijke en regelmatige werkzaamheden in Nederland alsmede de beoordeling van de
      bekwaamheid van de advocaat om de in Nederland uitgeoefende werkzaamheden voort te zetten, vinden plaats in het
      kader van een onderhoud dat ten doel heeft de daadwerkelijke en regelmatige aard van de uitgeoefende werkzaamheid
      te verifiëren.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2b
  - number: 2c.1
    text: |-
      De advocaat die overeenkomstig [artikel 2a][ref1] is ingeschreven, is bevoegd om naast het voeren van de titel
      advocaat zijn oorspronkelijke beroepstitel in de officiële taal of in een van de officiële talen van de staat van
      herkomst te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 2a
        afdeling: '1'
  - number: 2c.2
    text: |-
      Indien de bevoegde autoriteit van de lidstaat van herkomst of de tuchtrechter aldaar de uitoefening van het beroep
      advocaat tijdelijk of blijvend heeft ontzegd is de betrokken advocaat van rechtswege niet meer bevoegd om in
      Nederland zijn beroep onder zijn oorspronkelijke beroepstitel uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel2c
  - number: '3.1'
    text: |-
      De advocaten worden bij de rechtbank, waarbij zij verlangen te worden ingeschreven, op requisitoir van het openbaar
      ministerie beëdigd.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel3
  - number: '3.2'
    text: |-
      Zij leggen de navolgende eed of belofte af: "Ik zweer (beloof) getrouwheid aan de Koning, gehoorzaamheid aan de
      [Grondwet][ref1], eerbied voor de rechterlijke autoriteiten, en dat ik geen zaak zal aanraden of verdedigen, die ik
      in gemoede niet gelove rechtvaardig te zijn."


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '4.1'
    text: |-
      De verzoeker wordt niet toegelaten tot de beëdiging, indien de raad van toezicht binnen zes weken na de indiening
      van het verzoek verklaart tegen de inschrijving verzet te doen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel4
  - number: '4.2'
    text: 'Deze beschikking kan alleen worden genomen op een der na te noemen gronden:'
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel4
  - number: 4.2.a
    text: |-
      dat de verzoeker niet voldoet aan de in de [artikelen 2][ref1] en [2a][ref2] gestelde vereisten voor de
      inschrijving, dan wel de in die artikelen bedoelde verklaringen of documenten niet heeft overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 2a
        afdeling: '1'
  - number: 4.2.b
    text: |-
      dat gegronde vrees bestaat, dat de verzoeker als advocaat inbreuk zal maken op de voor advocaten geldende wetten,
      verordeningen en besluiten of zich anderszins zal schuldig maken aan enig handelen of nalaten dat een behoorlijke
      advocaat niet betaamt;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel4
  - number: 4.2.c
    text: |-
      dat verzoeker met toepassing van [artikel 8, derde lid][ref1], van het tableau is geschrapt zonder dat alsnog het
      daar bedoelde bewijs kan worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel8
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '8'
        afdeling: '1'
  - number: '4.3'
    text: |-
      Indien de raad van toezicht binnen die termijn geen verzet heeft gedaan, of vóór de afloop daarvan verklaart geen
      bezwaar tegen de beëdiging te hebben, kan de beëdiging, mits binnen een jaar na de indiening van het verzoek,
      geschieden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel4
  - number: '5.1'
    text: |-
      De secretaris van de raad van toezicht maakt de beschikking, houdende verzet tegen de inschrijving, onverwijld
      bekend:
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel5
  - number: 5.1.a
    text: aan de verzoeker;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel5
  - number: 5.1.b
    text: aan de rechtbank, bij welke inschrijving is verzocht.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel5
  - number: '5.2'
    text: |-
      De verzoeker kan gedurende zes weken na de bekendmaking beklag doen bij het hof van discipline, bedoeld in
      [artikel 51][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel51
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '51'
        paragraaf: '4'
  - number: '5.3'
    text: |-
      Het beklag wordt gedaan bij verzoekschrift, in zevenvoud in te dienen en vergezeld van zes afschriften van
      de beslissing, waartegen het beklag is gericht. De griffier zendt onverwijld een der exemplaren van het
      verzoekschrift aan de raad van toezicht, die de beslissing heeft genomen. Op de behandeling van het beklag zijn de
      [hoofdstukken 6][ref1] en [7 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '7'
  - number: '6.1'
    text: |-
      Het hof van discipline beslist niet dan na verhoor of behoorlijke oproeping van de verzoeker en van de raad van
      toezicht. Op de behandeling van de zaak zijn [artikel 56, zesde lid][ref1], en [artikel 57, tweede lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel57
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '56'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '57'
        paragraaf: '4'
  - number: '6.2'
    text: |-
      De raad van toezicht kan zich door zijn deken of een zijner leden doen vertegenwoordigen; de verzoeker kan zich
      door een advocaat doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel6
  - number: '7'
    text: 'De griffier zendt onverwijld afschrift van de beslissing:'
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel7
  - number: 7.a
    text: aan de verzoeker;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel7
  - number: 7.b
    text: aan de raad van toezicht;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel7
  - number: 7.c
    text: aan de rechtbank, bij welke de inschrijving werd verzocht.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel7
  - number: '8.1'
    text: |-
      De advocaten worden door de griffier op het tableau gesteld op vertoon hunner akte van beëdiging, welke alsdan en
      daarna telkenjare in de maand september door de griffier kosteloos wordt geviseerd.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel8
  - number: '8.2'
    text: |-
      Zij, die verlangen niet langer op het tableau te staan, als advocaat bij een andere rechtbank ingeschreven worden,
      enige betrekking verkrijgen, waarmede het beroep van advocaat onverenigbaar is, of hun akte van beëdiging niet
      binnen de tijd tot het viseren daarvan voorgeschreven, aan de griffier tot dat einde ter hand stellen, worden
      op hun aangifte of op requisitoir van het openbaar ministerie, de raad van toezicht gehoord, van het tableau
      geschrapt.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel8
  - number: '8.3'
    text: |-
      Van het tableau worden eveneens geschrapt zij die, hetzij onafgebroken, hetzij met onderbrekingen, gedurende
      een tijdvak van drie jaar voorwaardelijk als advocaat ingeschreven hebben gestaan zonder dat het bewijs, dat
      met gunstig gevolg het in [artikel 9c][ref1] bedoelde examen is afgelegd, kan worden overgelegd. De schrapping
      geschiedt in dit geval na kennisgeving door de algemene raad met ingang van een tijdstip dat ten minste twee
      maanden en ten hoogste zes maanden na de datum van kennisgeving gelegen is. Van de kennisgeving wordt gelijktijdig
      mededeling gedaan aan de advocaat, die het betreft, aan de patroon en aan het openbaar ministerie. Voor
      voorwaardelijk ingeschreven advocaten die in deeltijd werkzaam zijn, wordt het in de eerste volzin bedoelde tijdvak
      naar evenredigheid verlengd, met dien verstande dat deze verlenging niet meer dan drie jaar kan bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel9c
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 9c
        afdeling: 1a
  - number: '8.4'
    text: |-
      De griffier geeft van de inschrijving of de schrapping binnen acht dagen schriftelijk kennis aan de algemene raad
      en aan de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel8
  - number: '8.5'
    text: |-
      Gelijke kennisgeving binnen dezelfde termijn geschiedt daarenboven door de griffier bij de rechtbank in het
      arrondissement 's-Gravenhage aan de Hoge Raad en het gerechtshof te 's-Gravenhage en door de griffier bij de
      rechtbank in een der overige arrondissementen, waarin een gerechtshof is gevestigd, aan dat gerechtshof.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel8
  - number: '8.6'
    text: |-
      Schrapping van het tableau brengt mede verlies van de betrekkingen, waarbij de hoedanigheid van advocaat vereiste
      voor verkiesbaarheid of benoembaarheid is.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel8
  - number: '9.1'
    text: |-
      De raad van toezicht kan gedurende één jaar nadat een advocaat is beëdigd, beslissen dat hij van het tableau
      zal worden geschrapt, wanneer hetzij de advocaat de raad van toezicht of het hof van discipline zo onjuiste of
      onvolledige inlichtingen heeft verstrekt, dat hij, ware de juiste toedracht van zaken de raad van toezicht of
      het hof van discipline bekend geweest, niet tot de beëdiging zou zijn toegelaten, hetzij de advocaat zich in het
      tijdvak tussen het verzoek tot inschrijving en de beëdiging aan een zo ernstige misdraging heeft schuldig gemaakt,
      dat hem, indien hij na de beëdiging zich daaraan zou hebben schuldig gemaakt, de maatregel van schrapping van het
      tableau zou zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9
  - number: '9.2'
    text: |-
      Op de behandeling van de zaak zijn de [artikelen 47][ref1] en [49, tweede tot en met laatste lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel49
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '47'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '49'
        paragraaf: '4'
  - number: '9.3'
    text: De secretaris van de raad van toezicht maakt een beschikking als bedoeld in het eerste lid, onverwijld bekend.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9
  - number: '9.4'
    text: |-
      Van een zodanige beslissing kan de betrokken advocaat binnen zes weken na de bekendmaking in hoger beroep komen bij
      het hof van discipline. Artikel 5, derde lid, en artikel 6 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9
  - number: '9.5'
    text: |-
      De griffier van het hof van discipline zendt onverwijld afschrift van de beslissing aan de betrokken advocaat en
      aan de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9
  - number: '9.6'
    text: |-
      Zodra de beslissing tot schrapping van het tableau in kracht van gewijsde is gegaan, wordt zij door de secretaris
      van de raad van toezicht medegedeeld aan de rechtbank, bij welke de advocaat is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9
  - number: 9a
    text: |-
      Tot het voeren van de titel van advocaat is uitsluitend gerechtigd hij die als advocaat binnen Nederland is
      ingeschreven en hij die buiten Nederland tot het voeren van een overeenkomstige titel bevoegd is.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9a
  - number: 9aa.1
    text: |-
      Indien de bevoegde autoriteit van de lidstaat van ontvangst of de tuchtrechter aldaar de uitoefening van het beroep
      van de advocaat die zich krachtens het nationale recht van die lidstaat van de Europese Unie of de desbetreffende
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte dat uitvoering geeft aan artikel
      3 van [richtlijn 98/5/EG](31998L0005) van het Europees Parlement en de Raad van de Europese Unie van 16 februari
      1998 ter vergemakkelijking van de permanente uitoefening van het beroep van advocaat, heeft laten inschrijven,
      tijdelijk of blijvend heeft ontzegd, beslist de raad van toezicht in het arrondissement waar de betrokken advocaat
      is ingeschreven ambtshalve tot tijdelijke of blijvende schrapping van het tableau, indien er gegronde vrees bestaat
      dat de betrokkene als advocaat inbreuk zal maken op de voor de advocaten geldende wetten verordeningen en besluiten
      of zich anderszins zal schuldig maken aan enig handelen of nalaten dat een behoorlijk advocaat niet betaamt. Het
      besluit treedt in werking zes weken nadat het is bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9aa
  - number: 9aa.2
    text: |-
      De [artikelen 5 tot en met 7][ref1] en [artikel 8, vierde tot en met zesde lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel8
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '5'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '8'
        afdeling: '1'
  - number: 9aa.3
    text: |-
      De griffier van de rechtbank schrapt overeenkomstig de beschikking van de raad van toezicht de advocaat tijdelijk
      of blijvend van het tableau, nadat de beschikking onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9aa
  - number: 9aa.4
    text: Het beklag schorst de werking van de beschikking van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9aa
  - number: 9aa.5
    text: Het hof van discipline kan de raad van toezicht een termijn stellen voor het nemen van een nieuw besluit.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9aa
  - number: 9aa.6
    text: De raad van toezicht stelt de bevoegde autoriteit van de lidstaat van ontvangst in kennis van de schrapping.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9aa
  - number: 9aa.7
    text: |-
      De advocaat draagt op verzoek van de raad van toezicht zorg voor de beëdigde vertaling van de gegevens en
      bescheiden die voor zijn beslissing nodig zijn. Indien de advocaat weigert aan dit verzoek te voldoen, draagt de
      raad van toezicht zorg voor de beëdigde vertaling en verhaalt hij de kosten daarvan op de betrokken advocaat.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9aa
  - number: 9aa.8
    text: |-
      Het hof van discipline kan eisen dat de door haar aangewezen stukken worden vertaald door een in Nederland
      toegelaten beëdigd vertaler. De advocaat draagt zorg voor de kosten van de vertaling.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9aa
  - number: 9b.1
    text: |-
      Elke advocaat, met uitzondering van de advocaat die in het bezit is van een ten aanzien van het beroep van
      advocaat afgegeven EG-verklaring als bedoeld in de Algemene wet erkenning EG-hoger-onderwijsdiploma’s dan wel in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref1] alsmede met uitzondering van de advocaat, die overeenkomstig
      [artikel 2a][ref2] is ingeschreven is verplicht gedurende de eerste drie jaar waarin hij als zodanig is
      ingeschreven als stagiaire de praktijk uit te oefenen onder toezicht van een andere advocaat - hierna te noemen de
      patroon - en bij deze kantoor te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0006781
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0006781
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 2a
        afdeling: '1'
  - number: 9b.2
    text: |-
      Voor stagiaires die in deeltijd werkzaam zijn wordt de duur van de stage naar evenredigheid verlengd. Voorts kan
      de duur van de stage met ten hoogste drie jaar worden verlengd indien de raad van toezicht van oordeel is dat de
      stagiaire nog niet over voldoende praktijkervaring beschikt. De duur van de stage kan door de raad van toezicht,
      met goedkeuring van de algemene raad, op verzoek van de stagiaire worden verkort.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9b
  - number: 9b.3
    text: |-
      Van de verplichting van de stagiaire bij een patroon kantoor te houden kan de raad van toezicht vrijstelling
      verlenen, indien naar het oordeel van de raad een behoorlijke praktijkuitoefening, waaronder de financiering
      van de praktijk en de dekking van het risico van de beroepsaansprakelijkheid van de stagiaire, overeenkomstig de
      daaromtrent gestelde voorschriften bij of krachtens deze wet, verzekerd is. Is dit naar het oordeel van de raad
      niet langer het geval, dan kan een verleende vrijstelling worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9b
  - number: 9b.4
    text: |-
      Indien de raad de in het derde lid bedoelde vrijstelling heeft verleend, wijst hij, indien de stagiaire geen
      patroon heeft kunnen vinden die zich met het vereiste toezicht wil belasten, een advocaat als patroon aan, tenzij
      dit voor de desbetreffende advocaat een onredelijke last zou vormen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9b
  - number: 9b.5
    text: |-
      Tegen het verlengen van de duur van de stage, het weigeren of intrekken van een vrijstelling op voet van het
      bepaalde in het derde lid, de aanwijzing van een patroon met toepassing van het vierde lid, of de weigering van
      zulk een aanwijzing, kan een belanghebbende administratief beroep instellen bij de algemene raad.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9b
  - number: 9b.6
    text: |-
      Bij of krachtens verordening als bedoeld in [artikel 28][ref1] wordt bepaald wie als patroon kunnen optreden,
      onderscheidenlijk als patroon kunnen worden aangewezen, aan welke verplichtingen de patroon en de stagiaire hebben
      te voldoen, alsmede wanneer en in welke gevallen de tussen hen bestaande verhouding haar begin en einde neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 9c.1
    text: |-
      De Nederlandse orde van advocaten draagt zorg voor een opleiding voor stagiaires en stelt de stagiaire in de
      gelegenheid deze opleiding te volgen die met een examen wordt afgesloten.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9c
  - number: 9c.2
    text: |-
      De volgende onderwerpen, de opleiding als bedoeld in het eerste lid betreffende, worden nader vastgesteld bij
      of krachtens verordening als bedoeld in [artikel 28][ref1], tenzij daarin bij algemene maatregel van bestuur is
      voorzien:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 9c.2.a
    text: de inhoud en de duur van de opleiding;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9c
  - number: 9c.2.b
    text: de omvang van het examen en de wijze waarop het examen wordt afgenomen;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9c
  - number: 9c.2.c
    text: de eisen voor de toelating tot het afleggen van het examen;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9c
  - number: 9c.2.d
    text: de eisen voor het verkrijgen van vrijstelling voor bepaalde onderdelen van het examen;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9c
  - number: 9c.2.e
    text: de aan de stagiaire in rekening te brengen cursus- en examengelden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9c
  - number: 9d.1
    text: |-
      Er is een curatorium dat toezicht houdt op de opleiding en het examen. Het curatorium bestaat uit vijf leden,
      waarvan drie worden benoemd door Onze Minister van Justitie en twee door het college van afgevaardigden. Onze
      Minister van Justitie wijst uit de leden ook de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9d
  - number: 9d.2
    text: De leden van het curatorium treden om de vier jaar af en kunnen eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9d
  - number: 9e
    text: |-
      Tegen een op grond van het bepaalde bij of krachtens [artikel 9c][ref1] genomen beslissing kan een belanghebbende
      administratief beroep instellen bij het curatorium.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel9c
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 9c
        afdeling: 1a
  - number: 9i
    text: |-
      Het curatorium brengt elk jaar aan Onze Minister van Justitie en aan de algemene raad verslag uit omtrent zijn
      werkzaamheden. Dit verslag wordt algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel9i
  - number: '10'
    text: |-
      De advocaten oefenen de praktijk uit overeenkomstig de bevoegdheden en vereisten, bij de
      [Wetboeken van Burgerlijke Rechtsvordering][ref1] en [Strafvordering][ref2] en bij de bijzondere wetten en
      besluiten gegeven en gevorderd, en overeenkomstig deze wet en de daarop berustende verordeningen en besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0001903
  - number: '11.1'
    text: |-
      Zowel in burgerlijke als in strafzaken hebben de advocaten, bij welke rechtbank binnen het Rijk ook ingeschreven,
      de bevoegdheid, om als zodanig ook voor alle andere rechterlijke colleges binnen het Rijk op te treden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel11
  - number: '11.2'
    text: |-
      In de gevallen, waarin een advocaat zijn beroep uitoefent buiten het arrondissement, waarin zijn kantoor is
      gevestigd, kan van hem vóór alle toelating worden gevorderd de vertoning van zijn akte van beëdiging, naar de
      voorschriften van [artikel 8 van deze wet][ref1] behoorlijk geviseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel8
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '8'
        afdeling: '1'
  - number: '12.1'
    text: |-
      De advocaten zijn verplicht hun kantoor te hebben binnen het arrondissement der rechtbank, bij welke zij zijn
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel12
  - number: '12.2'
    text: Zij mogen niet tevens in een ander arrondissement een kantoor hebben.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel12
  - number: '12.3'
    text: |-
      Het kantoor van de advocaat geldt voor al zijn handelingen als zodanig als gekozen woonplaats. De advocaat, die
      zijn kantoor niet heeft in de gemeente, waar de rechtbank, bij welke hij is ingeschreven, is gevestigd, moet
      bovendien een woonplaats in die gemeente kiezen en daarvan doen blijken ter griffie.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel12
  - number: '12.4'
    text: |-
      Door de algemene raad kan om bijzondere redenen aan een advocaat, die zijn kantoor buiten Nederland wenst te
      vestigen, ontheffing van het in het eerste lid vervatte voorschrift worden verleend. De raad van toezicht wordt
      tevoren gehoord.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel12
  - number: '12.5'
    text: |-
      Advocaten, die aan de voorschriften van dit artikel niet voldoen, worden, na een aanmaning daartoe door de raad van
      toezicht, op requisitoir van het openbaar ministerie van het tableau geschrapt.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel12
  - number: '13.1'
    text: |-
      De rechtzoekende die niet of niet tijdig een advocaat bereid vindt hem zijn diensten te verlenen in een zaak,
      waarin vertegenwoordiging door een advocaat is voorgeschreven dan wel bijstand uitsluitend door een advocaat of
      procureur kan geschieden, kan zich wenden tot de deken van de orde van advocaten in het arrondissement waar de zaak
      moet dienen, met het verzoek een advocaat aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel13
  - number: '13.2'
    text: |-
      De deken kan het verzoek alleen wegens gegronde redenen afwijzen. Hij kan een aanwijzing op grond van bijzondere
      redenen wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel13
  - number: '13.3'
    text: |-
      Binnen zes weken na de bekendmaking van de beschikking, houdende afwijzing van het verzoek, kan de belanghebbende
      beklag doen bij het hof van discipline. Op de behandeling van het beklag zijn de [hoofdstukken 6][ref1] en
      [7 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '7'
  - number: '13.4'
    text: De aangewezen advocaat is verplicht zijn diensten te verlenen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel13
  - number: '13.5'
    text: |-
      De advocaat, door het bureau rechtsbijstandvoorziening als raadsman toegevoegd, is verplicht als zodanig op te
      treden of zich overeenkomstig [artikel 46 van het Wetboek van Strafvordering][ref1] te doen vervangen, zolang niet
      een gekozen raadsman is opgetreden of op de voet van [artikel 45 van het Wetboek van Strafvordering][ref2] een
      ander is toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel45
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '45'
  - number: '14'
    text: |-
      De advocaten pleiten staande, gekleed in het kostuum bij het bijzondere reglement op dat onderwerp bepaald, des
      goedvindende met gedekten hoofde.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel14
  - number: '15'
    text: Het beroep van advocaat is verenigbaar met dat van procureur.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel15
  - number: '16'
    text: |-
      Advocaten, die in staat van faillissement zijn verklaard of ten aanzien van wie de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard, die wegens schulden zijn gegijzeld of onder curatele
      zijn gesteld, zijn gedurende de duur van het faillissement onderscheidenlijk de toepassing van de
      schuldsaneringsregeling natuurlijke personen, de gijzeling of de curatele van rechtswege in de uitoefening van de
      praktijk geschorst. De geschorste advocaat mag gedurende de schorsing de titel van advocaat niet voeren.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16
  - number: 16a
    text: |-
      De bepalingen van deze wet en andere wettelijke voorschriften betreffende advocaten, hebben uitsluitend betrekking
      op in Nederland ingeschreven advocaten, voor zover die voorschriften of de navolgende, tot deze paragraaf
      behorende, artikelen niet anders bepalen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16a
  - number: 16b
    text: |-
      Voor de uitoefening in Nederland van werkzaamheden bij wijze van dienstverrichting, worden mede als advocaat
      aangemerkt, personen die niet als zodanig in Nederland zijn ingeschreven, maar die wel in een andere tot de
      Europese Economische Gemeenschap behorende staat of in een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte, hierna te noemen staat van herkomst, gerechtigd zijn hun
      beroepswerkzaamheden uit te oefenen onder de benaming advocaat of een daarmede overeenkomstige benaming in de taal
      of in een der talen van de staat van herkomst.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16b
  - number: 16c
    text: |-
      Wanneer de in het vorige artikel bedoelde personen, hierna te noemen: bezoekende advocaten, bij de uitoefening
      in Nederland van werkzaamheden bij wijze van dienstverrichting hun titel voeren, dienen zij daarbij de
      beroepsorganisatie te vermelden waartoe zij behoren of het gerecht waarbij zij overeenkomstig de wettelijke
      regeling van de staat van herkomst zijn toegelaten.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16c
  - number: 16d.1
    text: |-
      De werkzaamheden, bij wijze van dienstverrichting, betreffende de vertegenwoordiging en de verdediging van een
      cliënt in rechte of ten overstaan van een overheidsinstantie worden door bezoekende advocaten onder dezelfde
      voorwaarden uitgeoefend als die welke gelden voor in Nederland ingeschreven advocaten.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16d
  - number: 16d.2
    text: |-
      Bij de uitoefening van de in het eerste lid genoemde werkzaamheden nemen bezoekende advocaten de beroepsregels
      in acht die gelden voor in Nederland ingeschreven advocaten, met inbegrip van de verordeningen genoemd in
      [artikel 28][ref1], onverminderd hetgeen waartoe zij als advocaat in de staat van herkomst verplicht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 16d.3
    text: |-
      Bij het optreden ten overstaan van een overheidsinstantie moeten bezoekende advocaten desgevraagd hun bevoegdheid
      tot de uitoefening van het beroep van advocaat ten genoegen van die instantie aantonen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16d
  - number: 16e.1
    text: |-
      Bij de uitoefening van werkzaamheden, bij wijze van dienstverrichting, betreffende de vertegenwoordiging en de
      verdediging van een cliënt in rechte, waarvoor ingevolge de wet de bijstand of vertegenwoordiging van een advocaat
      of procureur is voorgeschreven, moet een bezoekende advocaat samenwerken met een in Nederland ingeschreven
      advocaat, hierna te noemen de samenwerkende advocaat.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16e
  - number: 16e.2
    text: |-
      De samenwerkende advocaat dient zich tevoren te vergewissen van de bevoegdheid van de bezoekende advocaat tot
      uitoefening van het beroep van advocaat en is daarvoor verantwoordelijk tegenover het betrokken gerecht.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16e
  - number: 16e.3
    text: |-
      De samenwerkende advocaat stelt de bezoekende advocaat, alvorens deze voor de eerste maal als zodanig in rechte
      optreedt, voor aan de rechter die de leiding heeft van de terechtzitting.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16e
  - number: 16e.4
    text: |-
      De bezoekende advocaat wordt geacht voor de in het eerste lid bedoelde werkzaamheden woonplaats te hebben gekozen
      ten kantore van de samenwerkende advocaat.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16e
  - number: 16e.5
    text: |-
      In de gevallen dat advocaten verplicht of gerechtigd zijn tot het dragen van een bijzonder kostuum, mag de
      bezoekende advocaat, indien hij zulks verkiest, in plaats daarvan het kostuum dragen dat is voorgeschreven in de
      staat van herkomst.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16e
  - number: 16e.6
    text: |-
      De rechter die de leiding heeft van de terechtzitting kan bezoekende advocaten toestaan zich van een andere taal
      te bedienen dan de Nederlandse, indien hij van mening is dat daardoor een goede rechtsbedeling niet wordt geschaad.
      Hij kan daarbij als voorwaarde stellen dat van een tolk gebruik gemaakt wordt.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16e
  - number: 16f
    text: |-
      Ten aanzien van andere werkzaamheden, bij wijze van dienstverrichting, dan die bedoeld in
      [het eerste lid van artikel 16d][ref1], blijven bezoekende advocaten onderworpen aan de voorwaarden en de
      beroepsregels van de staat van herkomst. Zij dienen daarnaast de voor in Nederland ingeschreven advocaten geldende
      beroepsregels in acht te nemen, met name die betreffende: *(a)* de onverenigbaarheid van het uitoefenen van de
      werkzaamheden van advocaat met het verrichten van andere werkzaamheden in Nederland, *(b)* het beroepsgeheim,
      *(c)* de verhouding tot andere advocaten, *(d)* het verbod van bijstand door een zelfde advocaat aan partijen
      met tegenstrijdige belangen en *(e)* de publiciteit. Laatstbedoelde regels zijn slechts toepasselijk voor zover
      zij kunnen worden nageleefd door een advocaat die niet in Nederland is gevestigd en de naleving ervan objectief
      gerechtvaardigd is ten einde in Nederland de behoorlijke uitoefening van de werkzaamheden van advocaten, de
      waardigheid van het beroep en de inachtneming van de bedoelde regels inzake onverenigbaarheid te verzekeren.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16d
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16f
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16d
        afdeling: 2a
  - number: 16g
    text: |-
      De bepalingen van deze wet en andere wettelijke voorschriften betreffende advocaten hebben uitsluitend betrekking
      op in Nederland ingeschreven advocaten voorzover die voorschriften of de navolgende, tot deze paragraaf behorende,
      artikelen niet anders bepalen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16g
  - number: 16h.1
    text: |-
      Degene die niet met inachtneming van [artikel 1][ref1] is ingeschreven, maar die wel in een andere lidstaat van
      de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte hierna te noemen staat van herkomst, gerechtigd is zijn beroepswerkzaamheid uit te oefenen onder de benaming
      advocaat of een daarmee overeenkomstige benaming in de taal of in de talen van de staat van herkomst, heeft het
      recht om permanent dezelfde werkzaamheden uit te oefenen als de overeenkomstig [artikel 1][ref2] ingeschreven
      advocaat nadat hij zich heeft laten inschrijven bij de raad van toezicht in het arrondissement waarin zijn kantoor
      is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel1
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16h
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '1'
        afdeling: '1'
  - number: 16h.2
    text: |-
      De raad van toezicht schrijft de advocaat in na overlegging van een verklaring van inschrijving bij de bevoegde
      autoriteit van de staat van herkomst, indien de verklaring niet langer dan drie maanden voor het moment waarop de
      aanvraag om inschrijving is ingediend is afgegeven.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16h
  - number: 16h.3
    text: De raad van toezicht stelt de bevoegde autoriteit van de staat van herkomst in kennis van de inschrijving.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16h
  - number: 16h.4
    text: |-
      Indien de raad van toezicht de namen van de overeenkomstig [artikel 1][ref1] ingeschreven advocaten publiceert,
      worden ook de namen van de overeenkomstig dit artikel ingeschreven advocaten gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel1
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16h
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '1'
        afdeling: '1'
  - number: 16i.1
    text: |-
      De advocaat, bedoeld in het eerste lid van [artikel 16h][ref1], is gehouden zijn beroepswerkzaamheden in Nederland
      uit te oefenen onder zijn oorspronkelijke beroepstitel, zoals deze dient te luiden in de taal of een der officiële
      talen van de staat van herkomst, evenwel op een verstaanbare wijze en zodanig dat hij niet kan worden verward met
      de titel advocaat, bedoeld in [artikel 9a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel9a
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16i
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 9a
        afdeling: '1'
  - number: 16i.2
    text: |-
      Bij de uitoefening van de werkzaamheden, bedoeld in het eerste lid, vermeldt de advocaat de beroepsorganisatie
      waartoe hij behoort of het gerecht waarbij hij overeenkomstig de wettelijke regeling van de staat van herkomst is
      toegelaten alsmede zijn inschrijving bij de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16i
  - number: 16j
    text: |-
      Voor de uitoefening van de werkzaamheden die met de vertegenwoordiging en de verdediging van een cliënt in
      rechte verband houden werkt de advocaat, bedoeld in het [eerste lid van artikel 16h][ref1], samen met een
      overeenkomstig [artikel 1][ref2] in Nederland ingeschreven advocaat voorzover ingevolge de wet de bijstand of
      vertegenwoordiging van een advocaat of procureur is voorgeschreven. Het [eerste lid van artikel 16d][ref3] alsmede
      het [tweede tot en met vierde en zesde lid van artikel 16e][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel16d
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel16d
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16j
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 16d
        afdeling: 2a
      - id: ref4
        bwb_id: BWBR0002093
        artikel: 16d
        afdeling: 2a
  - number: 16k.1
    text: |-
      De advocaat, bedoeld in het [eerste lid van artikel 16h][ref1], is voor alle werkzaamheden die hij in Nederland
      uitoefent aan dezelfde beroeps- en gedragregels alsmede aan dezelfde voorwaarden onderworpen als de advocaat die
      overeenkomstig [artikel 1][ref2] is ingeschreven, met inbegrip van de verordeningen genoemd in [artikel 28][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16k
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 16k.2
    text: |-
      De [artikelen 10][ref1], [12][ref2], [13][ref3], [14][ref4] en [16][ref5] zijn van overeenkomstige toepassing.
      [Artikel 11][ref6] is van overeenkomstige toepassing voorzover de advocaat optreedt in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0002093#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0002093#Artikel11
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel16k
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '10'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '12'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: '13'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002093
        artikel: '14'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0002093
        artikel: '16'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0002093
        artikel: '11'
        afdeling: '2'
  - number: '17.1'
    text: |-
      De gezamenlijke advocaten, die in Nederland zijn ingeschreven, vormen de Nederlandse orde van
      advocaten. Zij is gevestigd te 's-Gravenhage. Zij is een publiekrechtelijk lichaam als bedoeld in
      [artikel 134 van de Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
  - number: '17.2'
    text: |-
      De gezamenlijke advocaten, die bij een zelfde rechtbank zijn ingeschreven, vormen de orde van advocaten in het
      arrondissement.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel17
  - number: '17.3'
    text: De Nederlandse orde van advocaten en de orden zijn rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel17
  - number: '18.1'
    text: |-
      Aan het hoofd van de Nederlandse orde van advocaten staat een algemene raad, bestaande uit tenminste vijf
      en ten hoogste negen leden, onder wie de deken. Het aantal leden van de raad wordt nader bepaald door het in
      [artikel 19, eerste lid][ref1], bedoelde college van afgevaardigden.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel19
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '19'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: '18.2'
    text: |-
      De deken wordt bij ontstentenis of verhindering vervangen door een lid van de algemene raad, daartoe door die raad
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel18
  - number: '19.1'
    text: |-
      De deken en de overige leden van de algemene raad worden gekozen door een college van afgevaardigden, dat daartoe
      ieder jaar in de maand november bijeenkomt.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel19
  - number: '19.2'
    text: Het lidmaatschap van de algemene raad is niet verenigbaar met het lidmaatschap van het college van afgevaardigden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel19
  - number: '19.3'
    text: Jaarlijks treden twee leden volgens een door de algemene raad vast te stellen rooster af.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel19
  - number: '19.4'
    text: |-
      In vacatures die tussentijds ontstaan voorziet het college van afgevaardigden zo spoedig mogelijk, zo nodig in een
      buitengewone vergadering.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel19
  - number: '19.5'
    text: Niemand kan langer dan negen jaren in het geheel, als deken of als lid, deel uitmaken van de algemene raad.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel19
  - number: '20.1'
    text: |-
      De afgevaardigden en hun plaatsvervangers worden voor de tijd van drie jaren gekozen in vergaderingen van de orden
      in de arrondissementen in de maand oktober te houden; zij zijn herkiesbaar.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel20
  - number: '20.2'
    text: |-
      De aantallen afgevaardigden en plaatsvervangers bedragen: één voor orden, bestaande uit niet meer dan 50 advocaten,
      twee voor orden, bestaande uit 51-150 advocaten, drie voor orden, bestaande uit 151-300 advocaten, vier voor orden,
      bestaande uit 301-450 advocaten, vijf voor orden, bestaande uit 451-600 advocaten, zes voor orden, bestaande uit
      601-750 advocaten, zeven voor orden, bestaande uit meer dan 750 advocaten.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel20
  - number: '20.3'
    text: |-
      Voor de toepassing van het vorige lid is beslissend het aantal advocaten in een arrondissement ingeschreven op de
      eerste oktober van het jaar waarin de verkiezing, bedoeld in het eerste lid, wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel20
  - number: '20.4'
    text: De plaatsvervangers treden op in volgorde van verkiezing.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel20
  - number: '20.5'
    text: Bij gebleken behoefte kan in vacatures onmiddellijk worden voorzien.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel20
  - number: '20.6'
    text: De secretaris van de algemene raad treedt op als secretaris van de vergadering van het college van afgevaardigden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel20
  - number: '21'
    text: |-
      Bij verhindering van een afgevaardigde, een vergadering van het college van afgevaardigden bij te wonen, geeft hij
      daarvan onverwijld kennis aan de in [artikel 20, vierde lid][ref1], aangewezen plaatsvervanger.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel20
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '20'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: '22.1'
    text: |-
      De orde in het arrondissement wordt bestuurd door een raad van toezicht die bestaat uit ten minste vijf en ten
      hoogste elf leden, onder wie de deken. Het aantal leden van de raad van toezicht wordt nader bepaald in het
      huishoudelijk reglement van de orde.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel22
  - number: '22.2'
    text: |-
      De deken en de overige leden van de raad van toezicht worden uit de leden der orde gekozen in de jaarlijkse
      vergadering der orde, te houden in de maand oktober.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel22
  - number: '22.3'
    text: |-
      Jaarlijks treden twee leden volgens door de raad van toezicht vast te stellen rooster af. De deken is herkiesbaar.
      Een lid van de raad van toezicht kan steeds tot deken gekozen worden. De leden van de raad van toezicht zijn niet
      herkiesbaar, tenzij het huishoudelijk reglement anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel22
  - number: '22.4'
    text: Bij gebleken behoefte kan in vacatures onmiddellijk worden voorzien.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel22
  - number: '23.1'
    text: |-
      De deken wordt bij ontstentenis of verhindering vervangen door een lid van de raad van toezicht, daartoe door die
      raad aangewezen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel23
  - number: '23.2'
    text: De raad van toezicht wijst uit zijn midden een secretaris en een penningmeester aan.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel23
  - number: '24.1'
    text: |-
      Als leden van de algemene raad, van het college van afgevaardigden en van de raden van toezicht zijn slechts
      verkiesbaar advocaten en degenen die overeenkomstig [artikel 16h][ref1] zijn ingeschreven voorzover zij de ouderdom
      van zeventig jaren nog niet hebben bereikt. Na het bereiken van die leeftijd treden zij af met ingang van de
      eerstvolgende maand.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
  - number: '24.2'
    text: |-
      Bij huishoudelijk reglement van de orde in het arrondissement kan worden bepaald dat als lid van de raad van
      toezicht van die orde slechts advocaten of degenen die overeenkomstig [artikel 16h][ref1] zijn ingeschreven
      verkiesbaar zijn, die tenminste gedurende een bepaalde tijd, drie jaren niet te boven gaande, als zodanig zijn
      ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
  - number: '25'
    text: |-
      De vergadering der Nederlandse orde van advocaten beraadslaagt over onderwerpen, die voor advocaten en
      rechtzoekenden van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel25
  - number: '26'
    text: |-
      De algemene raad en de raden van toezicht bevorderen een behoorlijke uitoefening der praktijk en zijn bevoegd tot
      het nemen van alle maatregelen, die daartoe kunnen bijdragen. Zij komen op voor de rechten en belangen en zien toe
      op de naleving van de plichten van de advocaten als zodanig en vervullen de taken die hun bij verordeningen zijn
      opgedragen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel26
  - number: '27'
    text: |-
      De algemene raad vertegenwoordigt de Nederlandse advocaten overal, waar daartoe aanleiding bestaat, ook indien het
      belang der Nederlandse orde daarbij niet rechtstreeks betrokken is.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel27
  - number: '28.1'
    text: |-
      Het college van afgevaardigden stelt verordeningen vast in het belang van de goede uitoefening van de praktijk. Het
      college stelt voorts de nodige verordeningen vast betreffende de huishouding en de organisatie van de Nederlandse
      Orde van Advocaten.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel28
  - number: '28.2'
    text: |-
      Voorstellen van verordeningen worden aan het college van afgevaardigden gedaan door de algemene raad of door ten
      minste vijf afgevaardigden. Alvorens een ontwerp-verordening bij het college van afgevaardigden in te dienen kan de
      algemene raad de raden van toezicht uitnodigen hun oordeel kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel28
  - number: '28.3'
    text: |-
      De verordeningen worden na de vaststelling onverwijld medegedeeld aan Onze Minister van Justitie en afgekondigd in
      de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel28
  - number: '29.1'
    text: |-
      De verordeningen zijn verbindend voor de leden van de Nederlandse orde van advocaten, alsmede voor bezoekende
      advocaten volgens het bepaalde in [artikel 16][ref1], en in [artikel 16f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16d
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel16f
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16d
        afdeling: 2a
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 16f
        afdeling: 2a
  - number: '29.2'
    text: |-
      Zij mogen geen bepalingen inhouden omtrent punten, waarin door of krachtens de wet is voorzien, noch treden in
      aangelegenheden, die zich tengevolge van het uiteenlopen der omstandigheden in de arrondissementen niet lenen voor
      algemene voorzieningen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel29
  - number: '29.3'
    text: |-
      De bepalingen van verordeningen, in welker onderwerp door of krachtens de wet wordt voorzien, houden van rechtswege
      op te gelden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel29
  - number: '30.1'
    text: |-
      Besluiten van het college van afgevaardigden, van de algemene raad of van andere organen van de Nederlandse orde
      van advocaten kunnen bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel30
  - number: '30.2'
    text: |-
      De schorsing of vernietiging geschiedt binnen zes maanden na de in [artikel 28, derde lid][ref1], bedoelde
      mededeling of, wanneer het een besluit van de algemene raad of van een ander orgaan van de Nederlandse orde van
      advocaten betreft, binnen zes maanden nadat het besluit ter kennis van Onze Minister van Justitie is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: '31'
    text: |-
      De algemene raad en de raden van toezicht vertegenwoordigen de Nederlandse orde van advocaten, onderscheidenlijk de
      orden, in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel31
  - number: '32.1'
    text: |-
      De algemene raad en de raden van toezicht besturen de Nederlandse orde van advocaten, onderscheidenlijk de orden in
      de arrondissementen, en zijn gerechtigd tot het verrichten van daden van beheer en beschikking met betrekking tot
      haar vermogen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel32
  - number: '32.2'
    text: |-
      Het college van afgevaardigden en de vergadering der orde in het arrondissement stellen jaarlijks de bedragen vast,
      die de leden ter dekking van de door de Nederlandse orde van advocaten, onderscheidenlijk door de orde te maken
      kosten moeten bijdragen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel32
  - number: '32.3'
    text: |-
      De algemene raad en de raden van toezicht doen jaarlijks rekening en verantwoording van hun geldelijk beheer. Deze
      rekening en verantwoording wordt onderzocht door een commissie van drie leden, door het college van afgevaardigden,
      onderscheidenlijk de orde, uit hun midden aan te wijzen. De commissie brengt verslag uit aan het college
      onderscheidenlijk de orde. Goedkeuring van de rekening door het college van afgevaardigden, onderscheidenlijk de
      orde, strekt de algemene raad, onderscheidenlijk de raad van toezicht, tot décharge.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel32
  - number: '32.4'
    text: |-
      Jaarlijks wordt door de algemene raad en de raden van toezicht een verslag betreffende het afgelopen jaar
      uitgebracht en in de vergadering van het college van afgevaardigden, onderscheidenlijk van de orde, ter bespreking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel32
  - number: '33'
    text: |-
      De algemene raad houdt het bureau van de Nederlandse orde van advocaten in stand en geeft door middel daarvan
      voorlichting ten aanzien van al die onderwerpen, waarvan de wetenschap voor de advocaat van belang is, streeft
      de eenheid van beroepsgenoten na en bevordert de behandeling van wetenschappelijke en praktische vraagstukken in
      algemene vergaderingen van advocaten.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel33
  - number: '34'
    text: |-
      De algemene raad benoemt en ontslaat zijn secretaris, die niet lid van de algemene raad kan zijn. De secretaris van
      de algemene raad heeft de leiding van het bureau van de orde; de algemene raad stelt zijn salaris vast, regelt de
      voorwaarden onder welke hij werkzaam zal zijn en voorziet in zijn vervanging bij verhindering of afwezigheid. Hij
      kan tevens griffier van het hof van discipline zijn.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel34
  - number: '35.1'
    text: |-
      De deken der orde licht de leden voor over al hetgeen verband houdt met de wijze van uitoefening van de praktijk.
      Hij kan zijn bemiddeling verlenen tot het bijleggen van geschillen tussen advocaten onderling of tussen advocaten
      en derden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel35
  - number: '35.2'
    text: De deken kan een deel van zijn bemoeiingen aan een ander lid van de raad van toezicht opdragen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel35
  - number: '36'
    text: |-
      De Nederlandse orde van advocaten, de algemene raad, het college van afgevaardigden, de orden en de raden van
      toezicht kunnen huishoudelijke reglementen vaststellen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel36
  - number: '37.1'
    text: |-
      De deken van de Nederlandse orde van advocaten, onderscheidenlijk de deken der orde roept een vergadering bijeen
      zo vaak hij zulks nodig oordeelt en steeds indien voor de Nederlandse orde van advocaten ten minste vijftig leden,
      voor de algemene raad of voor een raad van toezicht ten minste twee leden, voor het college van afgevaardigden ten
      minste vier leden en voor een orde ten minste zes leden zulks schriftelijk verzoeken.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel37
  - number: '37.2'
    text: |-
      De deken van de Nederlandse orde van advocaten en de leden van de algemene raad hebben toegang tot de vergaderingen
      van het college van afgevaardigden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel37
  - number: '38.1'
    text: In de vergaderingen bekleedt de deken het voorzitterschap.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel38
  - number: '38.2'
    text: |-
      In de vergaderingen van de raad van toezicht en van de orde in het arrondissement heeft de deken bij staken der
      stemmen een beslissende stem.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel38
  - number: '39.1'
    text: Een behoorlijk bijeengeroepen vergadering wordt gehouden ongeacht het aantal aanwezige leden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel39
  - number: '39.2'
    text: |-
      Een vergadering van de algemene raad wordt evenwel niet gehouden wanneer niet ten minste vijf leden, en een
      vergadering van het college van afgevaardigden niet wanneer niet meer dan de helft van het aantal afgevaardigden of
      hun plaatsvervangers is opgekomen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel39
  - number: '39.3'
    text: |-
      Wanneer in een vergadering van het college van afgevaardigden het vereiste aantal afgevaardigden of
      plaatsvervangers niet is opgekomen, wordt een nieuwe vergadering belegd. Deze vergadering wordt gehouden ongeacht
      het aantal afgevaardigden of plaatsvervangers, dat is opgekomen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel39
  - number: '40.1'
    text: |-
      In de vergadering der orde in het arrondissement zijn alle leden stemgerechtigd. Tevens zijn stemgerechtigd degenen
      die zich overeenkomstig [artikel 16h][ref1] hebben laten inschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
  - number: '40.2'
    text: Iedere stemgerechtigde brengt één stem uit.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel40
  - number: '41.1'
    text: |-
      Over alle zaken wordt mondeling en bij hoofdelijke oproeping gestemd; in de vergaderingen der Nederlandse orde
      van advocaten en der orden wordt echter gestemd bij zitten en opstaan, tenzij een der aanwezigen een mondelinge
      stemming bij hoofdelijke oproeping verlangt.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel41
  - number: '41.2'
    text: Bij het doen van keuzen van personen wordt gestemd bij gesloten en ongetekende briefjes.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel41
  - number: '41.3'
    text: |-
      Indien bij het nemen van een besluit over een zaak door geen der aanwezigen stemming wordt gevraagd, wordt het
      voorstel geacht te zijn aangenomen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel41
  - number: '42.1'
    text: |-
      In een vergadering van de algemene raad is een stemming nietig, indien niet ten minste vijf leden daaraan hebben
      deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel42
  - number: '42.2'
    text: |-
      In een vergadering van het college van afgevaardigden is een stemming nietig, indien niet meer dan de helft van het
      aantal afgevaardigden of plaatsvervangers, dat zitting heeft, daaraan heeft deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel42
  - number: '42.3'
    text: |-
      Bij het doen van keuzen van personen worden afgevaardigden of hun plaatsvervangers, die niet of niet behoorlijk
      ingevulde briefjes ingeleverd hebben, voor de toepassing van dit artikel geacht aan de stemming te hebben
      deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel42
  - number: '42.4'
    text: |-
      Een stemming is geldig ongeacht het aantal afgevaardigden of hun plaatsvervangers, dat eraan heeft deelgenomen,
      ingeval opnieuw wordt gestemd over een voorstel of over een benoeming, ten aanzien waarvan in een vroegere
      vergadering een stemming op grond van het bepaalde in het tweede lid nietig was.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel42
  - number: '43.1'
    text: |-
      Voor het tot stand komen van een besluit bij stemming wordt de volstrekte meerderheid vereist van de leden, die aan
      de stemming hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel43
  - number: '43.2'
    text: |-
      Bij het doen van keuzen van personen worden de leden, die niet of niet behoorlijk ingevulde briefjes ingeleverd
      hebben, voor de toepassing van dit artikel geacht niet aan de stemming te hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel43
  - number: '44.1'
    text: |-
      Bij staking van stemmen over zaken wordt, behoudens het bepaalde in [artikel 38, tweede lid][ref1], het nemen van
      een besluit uitgesteld tot een volgende vergadering, waarin de beraadslagingen kunnen worden heropend.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel38
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '38'
        paragraaf: Afdeling_2
        afdeling: '3'
  - number: '44.2'
    text: |-
      In deze, en evenzo in een voltallige vergadering wordt, behoudens het bepaalde in [artikel 38, tweede lid][ref1],
      bij staken der stemmen over zaken het voorstel geacht niet te zijn aangenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel38
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '38'
        paragraaf: Afdeling_2
        afdeling: '3'
  - number: '45.1'
    text: |-
      Bij de stemming over personen treden in de vergaderingen twee door de voorzitter aan te wijzen leden als
      stemopnemers op.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel45
  - number: '45.2'
    text: De stemopnemers onderzoeken, of het aantal briefjes gelijk is aan dat der tegenwoordig zijnde leden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel45
  - number: '45.3'
    text: |-
      Er hebben zovele afzonderlijke stemmingen plaats als personen te kiezen zijn; bij keuze van een deken wordt over
      hem in de eerste plaats gestemd.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel45
  - number: '45.4'
    text: In geval van twijfel over de inhoud van een briefje beslist de voorzitter.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel45
  - number: '45.5'
    text: |-
      Een verkregen meerderheid van stemmen geldt niet, wanneer de vergadering beslist, dat daarop een tussen het aantal
      der briefjes en dat der aanwezigen bestaand verschil van invloed heeft kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel45
  - number: '45.6'
    text: |-
      Wanneer niemand bij de eerste stemming de volstrekte meerderheid heeft verkregen, wordt tot een tweede vrije
      stemming overgegaan.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel45
  - number: '45.7'
    text: |-
      Is ook bij deze geen volstrekte meerderheid verkregen, dan wordt de stemming bepaald tot de twee personen, die
      bij de tweede stemming de meeste stemmen hebben verkregen, of, zijn de meeste stemmen tussen meerdere personen
      verdeeld, tot allen die aldus de meeste stemmen hebben erlangd.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel45
  - number: '45.8'
    text: |-
      Indien ook hierdoor geen meerderheid van stemmen is verkregen, wordt een vierde stemming gehouden over twee
      personen die bij de derde stemming de meeste stemmen hebben erlangd.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel45
  - number: '45.9'
    text: |-
      Indien bij de derde of de vierde stemming twee of meer personen hetzelfde aantal stemmen hebben verkregen, beslist
      het lot.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel45
  - number: '46'
    text: |-
      De advocaten zijn aan tuchtrechtspraak onderworpen ter zake van enig handelen of nalaten in strijd met de zorg die
      zij als advocaat behoren te betrachten ten opzichte van degenen wier belangen zij als zodanig behartigen of behoren
      te behartigen, ter zake van inbreuken op de verordeningen van de Nederlandse orde en ter zake van enig handelen of
      nalaten dat een behoorlijk advocaat niet betaamt. Deze tuchtrechtspraak wordt uitgeoefend in eerste aanleg door de
      raden van discipline en in hoger beroep, tevens in hoogste ressort, door het hof van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46
  - number: 46a.1
    text: |-
      In het rechtsgebied van elk gerechtshof is een raad van discipline, wiens rechtsgebied samenvalt met dat van het
      gerechtshof en die de tuchtrechtspraak in eerste aanleg uitoefent met betrekking tot de advocaten, ingeschreven bij
      de arrondissementsrechtbanken in dat gebied.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46a
  - number: 46a.2
    text: |-
      De raden van discipline zijn gevestigd in de vestigingsplaatsen van de gerechtshoven. Zij kunnen ook buiten de
      vestigingsplaats zitting houden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46a
  - number: 46a.3
    text: |-
      Met betrekking tot de leden-advocaten, de plaatsvervangende leden-advocaten en de griffier van de raden van
      discipline wordt de tuchtrechtspraak in eerste aanleg uitgeoefend door een door de voorzitter van het hof van
      discipline naar aanleiding van een ingekomen klacht ambtshalve aan te wijzen andere raad van discipline. Van een
      zodanige verwijzing geeft de voorzitter van het hof van discipline kennis aan de aangewezen raad van discipline
      alsmede aan de deken die de klacht ter kennis heeft gebracht van het hof van discipline en aan de klager.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46a
  - number: 46a.4
    text: |-
      Aanwijzing van een andere raad van discipline overeenkomstig het vorige lid vindt ook plaats indien een klacht
      afkomstig is van de leden-advocaten, de plaatsvervangende leden-advocaten en de griffier van de raden van
      discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46a
  - number: 46b.1
    text: |-
      Elke raad van discipline bestaat uit een voorzitter, ten hoogste zes plaatsvervangende voorzitters, acht leden-
      advocaten en ten hoogste vijftien plaatsvervangende leden-advocaten.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
  - number: 46b.2
    text: |-
      De voorzitter en plaatsvervangende voorzitters worden door Onze Minister van Justitie voor de tijd van vier jaren
      benoemd uit leden van de rechterlijke macht met rechtspraak belast.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
  - number: 46b.3
    text: |-
      De leden-advocaten en de plaatsvervangende leden-advocaten kunnen alleen zijn advocaten, die zijn ingeschreven
      bij een rechtbank binnen het rechtsgebied van de betrokken raad, die langer dan vijf jaar in Nederland zijn
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
  - number: 46b.4
    text: |-
      De leden-advocaten en de plaatsvervangende leden-advocaten worden door het college van afgevaardigden in de in
      [artikel 19, eerste lid][ref1], bedoelde vergadering gekozen uit voordrachten van de raden van toezicht, voor
      de tijd van ten hoogste vier jaren. De verkiezing geschiedt met inachtneming van het streven naar een regionaal
      verantwoorde samenstelling van de raden van discipline.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel19
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '19'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 46b.5
    text: De voorzitter en plaatsvervangend voorzitters zijn na hun aftreden eenmaal terstond herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
  - number: 46b.6
    text: |-
      Van de leden-advocaten en de plaatsvervangende leden-advocaten treedt volgens een door de betrokken raad van
      discipline vast te stellen rooster jaarlijks een vierde deel af.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
  - number: 46b.7
    text: |-
      De voorzitter, de plaatsvervangende voorzitters, de leden-advocaten en de plaatsvervangende leden-advocaten treden
      in ieder geval af met ingang van de eerstvolgende maand na die waarin zij de leeftijd van zeventig jaren hebben
      bereikt.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
  - number: 46b.8
    text: |-
      Indien de zetel van voorzitter of plaatsvervangend voorzitter tussentijds vacant raakt, voorziet Onze Minister van
      Justitie zo spoedig mogelijk in de vacature.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
  - number: 46b.9
    text: |-
      In vacatures, die tussentijds ontstaan, voorziet het college van afgevaardigden zo spoedig mogelijk, zo nodig in
      een buitengewone vergadering. Het is daarbij niet aan een voordracht gebonden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
  - number: 46b.10
    text: |-
      Zij die benoemd zijn ter vervulling van een tussentijds opengevallen plaats treden af op het tijdstip, waarop
      degenen in wier plaats zij zijn benoemd hadden moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
  - number: 46b.11
    text: |-
      De voorzitter, de plaatsvervangende voorzitters, de leden-advocaten en de plaatsvervangende leden-advocaten blijven
      na het verstrijken van hun ambtstermijn in functie, totdat de door hun aftreden vacante plaats weer is vervuld. Zij
      blijven na hun aftreden, ook nadat in de door hen opengelaten plaatsen is voorzien, bevoegd om deel te nemen aan
      de verdere behandeling van en de beslissing over klachten, aan de behandeling waarvan zij voor hun aftreden reeds
      hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
  - number: 46b.12
    text: |-
      Het lidmaatschap of het plaatsvervangend lidmaatschap van een raad van discipline is niet verenigbaar met het
      lidmaatschap of het plaatsvervangend lidmaatschap van de algemene raad of van het hof van discipline en met de
      functie van deken.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
  - number: 46b.13
    text: |-
      Tussen de voorzitter, plaatsvervangende voorzitters, de leden-advocaten en de plaatsvervangende leden-advocaten
      van een raad van discipline mag niet bestaan de verhouding van echtgenoten of geregistreerde partners, bloed- of
      aanverwanten tot de derde graad ingesloten, een maatschap of ander duurzaam samenwerkingsverband tot het uitoefenen
      van het beroep van advocaat of de verhouding van werkgever tot werknemer.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
  - number: 46b.14
    text: |-
      Het in de [artikelen 46c, tweede lid][ref1], [46d, tweede lid][ref2], [46f][ref3],
      [46g, eerste en tweede lid][ref4], [46i, met uitzondering van het eerste lid, onderdeel c][ref5],
      [46j][ref6], [46l, eerste en derde lid][ref7], [46m][ref8], [46o][ref9] en
      [46p, eerste tot en met het vijfde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref10] bepaalde is van
      overeenkomstige toepassing ten aanzien van de voorzitter, plaatsvervangende voorzitters, de leden-advocaten en de
      plaatsvervangende leden-advocaten van de raad van discipline.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46g
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46f
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46g
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46m
      - id: ref9
        bwb_id: BWBR0008365
        artikel: 46o
      - id: ref10
        bwb_id: BWBR0008365
        artikel: 46p
  - number: 46b.15
    text: |-
      De leden-advocaten en de plaatsvervangende leden-advocaten van de raad van discipline kunnen worden
      ontslagen op de gronden aangegeven in de [artikelen 46c, tweede lid][ref1], [46d, tweede lid][ref2],
      [46i, met uitzondering van het eerste lid, onderdeel c][ref3], [46j][ref4], [46l, eerste en derde lid][ref5], en
      [46m van de Wet rechtspositie rechterlijke ambtenaren][ref6]. Daarnaast vervalt het lidmaatschap van de leden-
      advocaten en de plaatsvervangende leden-advocaten van rechtswege zodra zij opgehouden hebben advocaat te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46m
  - number: 46b.16
    text: |-
      De raad van discipline benoemt en ontslaat zijn griffier en voorziet in diens vervanging bij verhindering of
      afwezigheid. Slechts advocaten die zijn ingeschreven bij een rechtbank binnen het rechtsgebied van de betrokken
      raad zijn als zodanig benoembaar.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46b
  - number: 46c.1
    text: |-
      Klachten tegen advocaten worden schriftelijk ingediend bij de deken van de orde waartoe zij behoren. Indien de
      klager daarom verzoekt, is de deken hem behulpzaam bij het op schrift stellen van de klacht. Indien een ingediende
      klacht verduidelijking behoeft, is de deken de klager daarbij op diens verzoek behulpzaam.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46c
  - number: 46c.2
    text: De deken stelt een onderzoek in naar elke bij hem ingediende klacht.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46c
  - number: 46c.3
    text: |-
      De deken is bevoegd een bij hem ingediende klacht te verwijzen naar een lid van de raad van toezicht, ten einde
      haar te onderzoeken en af te handelen op de wijze als in dit artikel en de [artikelen 46d][ref1] en [46e][ref2]
      omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46d
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel46e
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46d
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 46e
        paragraaf: '4'
  - number: 46c.4
    text: |-
      Klachten tegen een deken van een orde worden ingediend bij, of terstond doorgezonden aan de voorzitter van de
      raad van discipline. Deze verwijst de zaak naar een deken van een andere orde in zijn ressort, ten einde haar
      te onderzoeken en af te handelen op een wijze als in dit artikel en de [artikelen 46d][ref1] en [46e][ref2]
      omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46d
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel46e
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46d
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 46e
        paragraaf: '4'
  - number: 46c.5
    text: |-
      De raad van toezicht draagt zorg voor voldoende bekendmaking in het arrondissement van de plaats en de tijd waarop
      de deken, of, bij zijn ontstentenis of verhindering, zijn plaatsvervanger, zitting houdt.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46c
  - number: 46d.1
    text: |-
      De deken tracht steeds de klachten in der minne te schikken, tenzij deze overeenkomstig [artikel 46e][ref1]
      onmiddellijk aan de raad van discipline ter kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46e
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46e
        paragraaf: '4'
  - number: 46d.2
    text: |-
      Indien een minnelijke schikking mogelijk blijkt, wordt deze op schrift gesteld en door de klager, de advocaat tegen
      wie de klacht is ingediend en de deken ondertekend. Door een aldus vastgestelde minnelijke schikking vervalt de
      bevoegdheid van de klager om de terkennisbrenging van de klacht aan de raad van discipline te verlangen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46d
  - number: 46d.3
    text: |-
      Is drie maanden na de indiening van de klacht geen minnelijke schikking bereikt, dan kan de klager de deken
      verzoeken de klacht ter kennis van de raad van discipline te brengen. Overigens brengt de deken de klacht steeds
      ter kennis van de raad van discipline, indien aannemelijk is dat daarvoor geen oplossing in der minne kan worden
      bereikt.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46d
  - number: 46d.4
    text: |-
      De klacht wordt schriftelijk ter kennis van de raad van discipline gebracht. De deken stelt daarvan steeds de
      advocaat tegen wie de klacht is gericht en de klager schriftelijk op de hoogte. Indien hij op grond van zijn
      onderzoek van oordeel is dat de klacht kennelijk ongegrond of van onvoldoende gewicht is, deelt hij dat met redenen
      omkleed bij de terkennisbrenging van de klacht aan de klager, aan de advocaat tegen wie de klacht is gericht en aan
      de raad van discipline mee.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46d
  - number: 46e.1
    text: |-
      Indien de klager daarom bij indiening van de klacht verzoekt, brengt de deken, onverminderd het bepaalde in
      [artikel 46c, tweede lid][ref1], deze onmiddellijk ter kennis van de raad van discipline.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
  - number: 46e.2
    text: |-
      Indien naar zijn oordeel de inhoud van de klacht een minnelijke schikking ongewenst of onmogelijk maakt, brengt de
      deken de klacht ambtshalve onmiddellijk ter kennis van de raad van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46e
  - number: 46e.3
    text: |-
      [Artikel 46][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46d
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46d
        paragraaf: '4'
  - number: 46f.1
    text: |-
      Indien de deken buiten het geval van een klacht op de hoogte is gebracht van bezwaren tegen een advocaat, kan
      hij deze ter kennis van de raad van discipline brengen. Hij stelt daarvan de advocaat tegen wie de bezwaren zijn
      gerezen schriftelijk op de hoogte.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46f
  - number: 46f.2
    text: |-
      [Artikel 46][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46d
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46f
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46d
        paragraaf: '4'
  - number: 46fa
    text: |-
      Indien de advocaat jegens wie een klacht is ingediend of jegens wie bezwaren bestaan zich krachtens het nationale
      recht van een andere lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte dat uitvoering geeft aan artikel 3 van [richtlijn 98/5/EG](31998L0005)
      van het Europees Parlement en de Raad van de Europese Unie van 16 februari 1998 ter vergemakkelijking van de
      permanente uitoefening van het beroep van advocaat, heeft laten inschrijven, stelt de raad van toezicht voor de
      aanvang van de tuchtrechtelijke procedure de bevoegde autoriteit in die lidstaat of lidstaten op de hoogte van het
      voornemen een tuchtrechtelijke procedure jegens de advocaat aan te vangen en verstrekt hij aan die autoriteit of
      autoriteiten alle dienstige inlichtingen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46fa
  - number: 46g.1
    text: |-
      De voorzitter van de raad van discipline kan kennelijk niet-ontvankelijke en kennelijk ongegronde klachten, alsmede
      klachten die naar zijn oordeel van onvoldoende gewicht zijn, binnen dertig dagen nadat zij ter kennis van de raad
      zijn gebracht, bij met redenen omklede beslissing schriftelijk afwijzen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46g
  - number: 46g.2
    text: |-
      Van de beslissing zendt de griffier onverwijld een afschrift aan de deken, de klager en aan de advocaat tegen wie
      de klacht is ingediend.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46g
  - number: 46g.3
    text: |-
      De voorzitter kan zich bij de uitoefening van de in het eerste lid bedoelde bevoegdheid door één van de
      plaatsvervangende voorzitters doen vervangen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46g
  - number: 46h.1
    text: |-
      Tegen de beslissing, in het vorige artikel bedoeld, kunnen de klager en de deken binnen veertien dagen na de
      verzending van het afschrift van de beslissing, schriftelijk verzet doen bij de raad van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46h
  - number: 46h.2
    text: |-
      Ten gevolge van dat verzet vervalt de beslissing, tenzij de raad van discipline het verzet niet-ontvankelijk of
      ongegrond verklaart.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46h
  - number: 46h.3
    text: |-
      Is de raad van discipline van oordeel dat de klacht kennelijk niet-ontvankelijk, kennelijk ongegrond, of van
      onvoldoende gewicht is, dan kan hij zonder nader onderzoek het verzet ongegrond verklaren, echter niet dan na
      de klager, de deken en de advocaat tegen wie de klacht is gericht, in de gelegenheid te hebben gesteld te worden
      gehoord.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46h
  - number: 46h.4
    text: |-
      De beslissing tot niet-ontvankelijk- of ongegrondverklaring van het verzet is met redenen omkleed. Daartegen staat
      geen rechtsmiddel open. [Artikel 46][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46g
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46h
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46g
        paragraaf: '4'
  - number: 46h.5
    text: Indien de raad van oordeel is dat het verzet gegrond is, wordt de klacht in verdere behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel46h
  - number: '47.1'
    text: |-
      Aan de behandeling en de beslissing van tuchtzaken wordt op straffe van nietigheid deelgenomen door vijf leden van
      de raad van discipline, onder wie de voorzitter of één van de plaatsvervangende voorzitters.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel47
  - number: '47.2'
    text: |-
      De [artikelen 512 tot en met 519 van het Wetboek van Strafvordering][ref1] zijn ten aanzien van De voorzitter,
      de plaatsvervangende voorzitters, de leden-advocaten en de plaatsvervangende leden-advocaten van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel512
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '512'
  - number: '47.3'
    text: |-
      Een lid-advocaat of een plaatsvervangend lid-advocaat van de raad van discipline mag op straffe van nietigheid
      niet deelnemen aan de behandeling van een zaak, waarin hij als deken of lid van een raad van toezicht het in
      [artikel 46c, tweede lid][ref1], bedoelde onderzoek heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
  - number: 47a
    text: |-
      In geval van intrekking van de klacht wordt de behandeling daarvan gestaakt, tenzij de raad van discipline beslist
      dat de behandeling van de klacht om redenen aan het algemeen belang ontleend, moet worden voortgezet. In dat
      laatste geval wordt de klacht verder behandeld als ware deze afkomstig van de deken.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel47a
  - number: '48.1'
    text: |-
      De beslissingen van de raad van discipline over de voorgelegde klachten zijn met redenen omkleed en worden in het
      openbaar uitgesproken, alles op straffe van nietigheid.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48
  - number: '48.2'
    text: |-
      De raad kan, indien hij oordeelt dat het tegen de betrokken advocaat gerezen bezwaar gegrond is een der volgende
      maatregelen opleggen:
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48
  - number: 48.2.a
    text: enkele waarschuwing;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48
  - number: 48.2.b
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48
  - number: 48.2.c
    text: schorsing in de uitoefening van de praktijk voor de duur van ten hoogste een jaar;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48
  - number: 48.2.d
    text: schrapping van het tableau.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48
  - number: '48.3'
    text: |-
      Indien enig door [artikel 46][ref1] beschermd belang dat vordert kan de raad van discipline bij de beslissing
      houdende oplegging van een der laatstgenoemde drie maatregelen besluiten tot openbaarmaking van de opgelegde
      maatregel, al dan niet met de gronden waarop zij berust, op de door hem te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '46'
        paragraaf: '4'
  - number: '48.4'
    text: |-
      Tot de tenuitvoerlegging van maatregelen overeenkomstig dit artikel opgelegd wordt eerst overgegaan zodra zij in
      kracht van gewijsde zijn gegaan.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48
  - number: '48.5'
    text: De geschorste advocaat mag gedurende de schorsing de titel van advocaat niet voeren.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48
  - number: '48.6'
    text: |-
      Schorsing in de uitoefening van de praktijk brengt mede verlies van de betrekkingen, waarbij de hoedanigheid van
      advocaat vereiste voor verkiesbaarheid of benoembaarheid is.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48
  - number: '48.7'
    text: |-
      De raad spreekt, indien de klager daarom verzoekt, in zijn beslissing steeds met redenen omkleed uit of de
      advocaat tegen wie de klacht is ingediend, jegens hem de zorgvuldigheid heeft betracht die bij een behoorlijke
      rechtshulpverlening betaamt. De raad kan een dergelijke uitspraak, indien hij daartoe voldoende grond aanwezig
      acht, ook ambtshalve doen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48
  - number: 48a.1
    text: |-
      Bij de oplegging van de maatregel van schorsing in de uitoefening van de praktijk kan de raad van discipline
      daarbij zowel ten aanzien van deze maatregel als ten aanzien van de openbaarmaking daarvan en van het verbod
      om de titel van advocaat te voeren bepalen dat deze maatregel geheel of voor een door de raad van discipline te
      bepalen gedeelte niet zal worden ten uitvoer gelegd tenzij de raad van discipline later anders mocht bepalen op
      grond dat de betrokken advocaat zich vóór het einde van een in de beslissing aan te geven proeftijd aan een in
      [artikel 46][ref1] bedoelde gedraging heeft schuldig gemaakt, of een bijzondere voorwaarde welke in de beslissing
      mocht zijn gesteld, niet heeft nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '46'
        paragraaf: '4'
  - number: 48a.2
    text: De proeftijd beloopt ten hoogste twee jaren. Zij gaat in zodra de beslissing in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48a
  - number: 48b.1
    text: |-
      Bij de oplegging van de in [artikel 48, tweede lid, onder a tot en met d][ref1], genoemde maatregelen kan de raad
      van discipline in afwijking van het bepaalde in het eerste lid van het voorgaande artikel als bijzondere voorwaarde
      stellen dat de betrokken advocaat de door zijn gedraging veroorzaakte schade geheel of tot een bij de beslissing te
      bepalen gedeelte binnen een daarbij te stellen termijn, korter dan de proeftijd, vergoedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 48b.2
    text: |-
      Bovendien is de raad van discipline bevoegd bij de beslissing ook andere bijzondere voorwaarden, de
      praktijkbeoefening van de betrokken advocaat gedurende de proeftijd of een bij de beslissing te bepalen gedeelte
      daarvan betreffende, te stellen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48b
  - number: 48c.1
    text: |-
      De deken van de orde, waartoe de advocaat behoort, ziet toe op de nakoming der voorwaarden, tenzij de raad
      van discipline, in overleg met de deken, bij besluit een ander lid van de orde daarmee belast. Indien de
      betrokken advocaat de deken is, wijst de raad van discipline een ander lid van de orde aan in overleg met het in
      [artikel 23, eerste lid][ref1], bedoelde lid van de raad van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel23
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '23'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 48c.2
    text: |-
      De deken of het in het eerste lid bedoelde andere lid van de orde geeft, ingeval de betrokken advocaat de
      voorwaarden gedurende de proeftijd niet nakomt, daarvan kennis aan de raad van discipline, met zodanige vordering
      als hij nodig acht.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48c
  - number: 48d
    text: |-
      De raad van discipline die het in [artikel 48a][ref1] bedoelde bevel heeft gegeven, kan, hetzij op vordering van
      de betrokken deken of het in [het eerste lid van artikel 48c][ref2] bedoelde lid van de orde, hetzij op verzoek van
      de betrokken advocaat, hetzij ambtshalve, gedurende de proeftijd in de gestelde bijzondere voorwaarden wijziging
      brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48c
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48a
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 48c
        paragraaf: '4'
  - number: 48e
    text: |-
      De raad van discipline, die met toepassing van [artikel 48a][ref1] heeft bepaald dat de opgelegde maatregel voor
      een door hem te bepalen gedeelte niet zal worden tenuitvoergelegd, kan hetzij op vordering van de betrokken deken
      of het in [het eerste lid van artikel 48c][ref2] bedoelde lid van de orde, hetzij ambtshalve, last geven dat alsnog
      tot tenuitvoerlegging zal worden overgegaan. Een zodanige last kan niet meer worden gegeven wanneer sedert het
      einde van de proeftijd drie maanden verstreken zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48c
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48a
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 48c
        paragraaf: '4'
  - number: 48f
    text: |-
      Een beslissing als bedoeld in de [artikelen 48d][ref1] en [48e][ref2] wordt niet gegeven dan na verhoor, althans
      behoorlijke oproeping van de betrokken advocaat en, in het geval de beslissing de bijzondere voorwaarde tot gehele
      of gedeeltelijke schadevergoeding betreft en deze daarbij belanghebbende is, de klager. Voor het verhoor wordt
      tevens opgeroepen de in [het eerste lid van artikel 48c][ref3] bedoelde toezichthouder. Op het verhoor en de
      beslissing zijn de bepalingen van de [artikelen 49, tweede tot en met het laatste lid][ref4], en [50][ref5] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48d
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48e
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel48c
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel49
      [ref5]: https://wetten.overheid.nl/BWBR0002093#Artikel50
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48d
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 48e
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 48c
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0002093
        artikel: '49'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0002093
        artikel: '50'
        paragraaf: '4'
  - number: 48g
    text: |-
      Een beslissing als bedoeld in de [artikelen 48d][ref1] en [48e][ref2] is niet aan enig rechtsmiddel onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48d
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48e
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48g
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48d
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 48e
        paragraaf: '4'
  - number: 48h.1
    text: |-
      Indien de deken door wiens tussenkomst de klacht aanhangig is gemaakt verzoekt de behandeling daarvan bij te
      wonen, stelt de raad van discipline hem daartoe steeds in de gelegenheid. De raad kan overigens de deken door wiens
      tussenkomst de klacht aanhangig is gemaakt uitnodigen de behandeling daarvan bij te wonen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48h
  - number: 48h.2
    text: |-
      Betreft de klacht de deken van de orde, dan kan de behandeling worden bijgewoond door het in
      [artikel 23, eerste lid][ref1], bedoelde lid van de raad van toezicht van die orde. Het eerste lid is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel23
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel48h
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '23'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: '49.1'
    text: |-
      De raad van discipline neemt geen beslissing dan na verhoor of behoorlijke oproeping van de advocaat tegen wie de
      klacht is ingediend, en van de klager.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel49
  - number: '49.2'
    text: |-
      De betrokken advocaat en de klager zijn bevoegd zich bij de behandeling van de klacht door een raadsman te doen
      bijstaan. Zij en hun raadslieden worden in de gelegenheid gesteld tijdig van de processtukken kennis te nemen. Hun
      wordt door de griffier van de raad van discipline tijdig medegedeeld, waar en wanneer deze gelegenheid bestaat.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel49
  - number: '49.3'
    text: |-
      De raad van discipline kan weigeren bepaalde personen, die van het verlenen van rechtshulp hun beroep maken en niet
      zijn advocaat of procureur, als raadsman toe te laten. De behandeling van de klacht wordt in dat geval aangehouden
      totdat de betrokkene in de gelegenheid is geweest de geweigerde raadsman te vervangen. Hij wordt door de griffier
      van de aanhouding en de reden daartoe in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel49
  - number: '49.4'
    text: |-
      De raad van discipline kan getuigen en deskundigen oproepen en horen. Het horen van getuigen en deskundigen kan
      worden opgedragen aan de voorzitter, de plaatsvervangend voorzitter of een van de leden of plaatsvervangende leden
      van de raad van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel49
  - number: '49.5'
    text: |-
      Op verzoek van de raad van discipline doet de officier van justitie hen dagvaarden. De getuigen en deskundigen zijn
      na dagvaarding verplicht te verschijnen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel49
  - number: '49.6'
    text: |-
      Verschijnt een getuige of deskundige op de dagvaarding niet, dan doet de officier van justitie op verzoek van de
      raad van discipline hem andermaal dagvaarden, desverzocht met bevel tot medebrenging.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel49
  - number: '49.7'
    text: |-
      [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '556'
  - number: '49.8'
    text: |-
      De voorzitter beëdigt de getuige, dat hij de gehele waarheid en niets dan de waarheid zal zeggen; de getuige is
      verplicht op de gestelde vragen te antwoorden. De deskundige is gehouden zijn taak onpartijdig en naar beste weten
      te verrichten. Ingeval van toepassing van het vierde lid, tweede volzin, geschiedt de beëdiging van de getuige door
      het daartoe aangewezen lid-advocaat of plaatsvervangend lid-advocaat van de raad van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel49
  - number: '49.9'
    text: |-
      Op de getuigen en deskundigen vinden de [artikelen 217-219 van het Wetboek van Strafvordering][ref1]
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '49.10'
    text: |-
      De getuigen en deskundigen ontvangen desverkiezende op vertoon van hun oproeping of dagvaarding
      schadeloosstelling van het Rijk door de officier van justitie te begroten overeenkomstig het bij en krachtens de
      [Wet tarieven in burgerlijke zaken][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001852
  - number: '49.11'
    text: |-
      De raad van discipline behandelt de klacht in een openbare zitting. De raad kan om gewichtige redenen bevelen dat
      de behandeling geheel of gedeeltelijk met gesloten deuren zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel49
  - number: '50.1'
    text: |-
      De griffier van de raad van discipline zendt van de beslissingen van de raad bij aangetekende brief onverwijld
      afschrift:
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel50
  - number: 50.1.a
    text: aan de betrokken advocaat;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel50
  - number: 50.1.b
    text: aan de deken der Nederlandse orde van advocaten;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel50
  - number: 50.1.c
    text: |-
      aan de deken van de orde waarvan de advocaat deel uitmaakt, of, indien de betrokken advocaat de deken is, aan
      het in [artikel 23, eerste lid][ref1], bedoelde lid van de raad van toezicht en aan de deken naar wie de klacht
      ingevolge [artikel 46c, vierde lid][ref2], is verwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '23'
        paragraaf: Afdeling_1
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
  - number: 50.1.d
    text: |-
      indien de beslissing werd gegeven krachtens een verwijzing als bedoeld in [het derde lid van artikel 46a][ref1],
      aan de raad van discipline der orde waarvan de betrokken advocaat deel uitmaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46a
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46a
        paragraaf: '4'
  - number: 50.1.e
    text: |-
      indien de betrokken advocaat is ingeschreven bij een raad voor rechtsbijstand en aan hem een maatregel als bedoeld
      in [artikel 48, tweede lid, onder a tot en met d][ref1] is opgelegd en de beslissing waarbij de maatregel is
      opgelegd in kracht van gewijsde is gegaan dan wel de raad van discipline toezending nodig acht, aan de voorzitter
      van de desbetreffende raad voor rechtsbijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: '50.2'
    text: |-
      Indien werd beslist naar aanleiding van een klacht als bedoeld in [artikel 46c, eerste lid][ref1], wordt ook aan de
      klager bij aangetekende brief een afschrift van de beslissing gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
  - number: 50a.1
    text: |-
      De reis- en verblijfkosten van de voorzitter en de plaatsvervangende voorzitters worden vergoed en komen ten laste
      van de staat.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel50a
  - number: 50a.2
    text: |-
      De reis- en verblijfkosten van de leden-advocaten en de plaatsvervangende leden-advocaten van de raad van
      discipline en van de griffier worden vergoed en komen ten laste van de Nederlandse orde van advocaten.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel50a
  - number: '51.1'
    text: |-
      Het hof van discipline is gevestigd in de hoofdplaats van een ressort. Het hof kan uit zijn midden kamers vormen
      voor het vervullen van zijn taak. Kamers kunnen ook buiten de vestigingsplaats zitting houden. Het hof bestaat uit
      ten hoogste tien door Ons benoemde leden, waaronder de voorzitter en ten hoogste zes plaatsvervangende voorzitters,
      en vier leden-advocaten, alsmede uit door Ons benoemde plaatsvervangende leden en plaatsvervangende leden-
      advocaten, tot het door Ons, onderscheidenlijk door het college van afgevaardigden nodig geachte aantal.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel51
  - number: '51.2'
    text: |-
      De voorzitter, de plaatsvervangende voorzitters en de overige door Ons benoemde leden en plaatsvervangende leden
      worden voor de tijd van vijf jaren benoemd uit leden van de rechterlijke macht, met rechtspraak belast. De leden-
      advocaten en plaatsvervangende leden-advocaten worden door het college van afgevaardigden voor de tijd van vijf
      jaren gekozen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel51
  - number: '51.3'
    text: |-
      Het hof van discipline benoemt en ontslaat zijn griffier en voorziet in zijn vervanging bij verhindering of
      afwezigheid.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel51
  - number: '51.4'
    text: |-
      De leden-advocaten, plaatsvervangende leden-advocaten en de griffier van het hof van discipline kunnen niet
      gelijktijdig zijn lid van de algemene raad of lid-advocaat of plaatsvervangend lid-advocaat van een raad van
      discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel51
  - number: '52.1'
    text: |-
      De voorzitter, de plaatsvervangende voorzitters en de leden en plaatsvervangende leden treden af met ingang van de
      eerstvolgende maand nadat zij de leeftijd van zeventig jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel52
  - number: '52.2'
    text: |-
      Tussen de voorzitter, de plaatsvervangende voorzitters, de leden, plaatsvervangende leden en de griffier mag geen
      bloed- of aanverwantschap tot en met de derde graad bestaan. Tussen de leden-advocaten en de plaatsvervangende
      leden-advocaten mag voorts niet bestaan een maatschap of ander duurzaam samenwerkingsverband tot het uitoefenen van
      het beroep van advocaat of de verhouding van werkgever tot werknemer.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel52
  - number: '53.1'
    text: |-
      Als leden-advocaten en plaatsvervangende leden-advocaten van het hof van discipline zijn slechts verkiesbaar
      advocaten, die langer dan zeven jaren binnen het Rijk de praktijk hebben uitgeoefend en die de ouderdom van
      zeventig jaren nog niet hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel53
  - number: '53.2'
    text: De stemming geschiedt schriftelijk en voor elk lid afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel53
  - number: '53.3'
    text: De plaatsvervangende leden van het hof nemen zitting in volgorde van benoeming of verkiezing.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel53
  - number: '53.4'
    text: |-
      Leden van de algemene raad of van een raad van toezicht, die tot lid of plaatsvervangend lid van het hof van
      discipline zijn gekozen, treden bij het aanvaarden dezer functie af als lid van de betrokken raad. Leden-advocaten
      of plaatsvervangende leden-advocaten van een raad van discipline, die tot lid of plaatsvervangend lid van het
      hof van discipline zijn gekozen, treden bij het aanvaarden dezer functie af als lid-advocaat onderscheidenlijk
      plaatsvervangend lid-advocaat van de raad van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel53
  - number: '54.1'
    text: |-
      Het in de [artikelen 46c, tweede lid][ref1], [46d, tweede lid][ref2], [46f][ref3],
      [46g, eerste en tweede lid][ref4], [46i, met uitzondering van het eerste lid, onderdeel c][ref5],
      [46j][ref6], [46l, eerste en derde lid][ref7], [46m][ref8], [46o][ref9] en
      [46p, eerste tot en met het vijfde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref10] bepaalde is van
      overeenkomstige toepassing ten aanzien van de leden en plaatsvervangende leden van het hof van discipline.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46g
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
