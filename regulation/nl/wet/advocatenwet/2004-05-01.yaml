  - number: '55.1'
    text: Het hof van discipline waakt tegen nodeloze vertraging van het onderzoek door de raden van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel55
  - number: '55.2'
    text: Het kan zich de stukken doen overleggen en een termijn stellen, binnen welke de beslissing moet zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel55
  - number: '55.3'
    text: |-
      Indien een raad van discipline hieraan niet voldoet, kan het hof de behandeling van de zaak aan zich trekken en in
      het hoogste ressort beslissen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel55
  - number: '56.1'
    text: |-
      Van de beslissingen van de raad van discipline kan gedurende dertig dagen na de verzending van het in
      [artikel 50][ref1] bedoelde afschrift hoger beroep worden ingesteld bij het hof van discipline door:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel50
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '50'
        paragraaf: '4'
  - number: 56.1.a
    text: |-
      de klager die ingevolge [artikel 46][ref1], de klacht die tot de beslissing heeft geleid, heeft ingediend, indien:
        - daarbij de klacht geheel of ten dele ongegrond is verklaard;
        - bij gegrondbevinding van de klacht, het in [artikel 48, zevende lid][ref2], bedoelde verzoek wordt afgewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 56.1.b
    text: |-
      de deken, welke de klacht die tot de beslissing heeft geleid, ter kennis van de raad van discipline heeft gebracht,
      indien de klacht geheel of ten dele ongegrond is verklaard;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel56
  - number: 56.1.c
    text: de advocaat jegens wie de beslissing is genomen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel56
  - number: '56.2'
    text: |-
      Van alle beslissingen van de raad van discipline kan voorts binnen dezelfde termijn hoger beroep worden ingesteld
      door de deken der Nederlandse orde van advocaten. Hij kan zich vooraf de stukken doen overleggen. Hij kan bij de
      uitoefening van deze bevoegdheden zich door een lid van de algemene raad doen vervangen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel56
  - number: '56.3'
    text: |-
      Het beroep wordt ingesteld bij met redenen omklede memorie, in zevenvoud in te dienen bij de griffier van het
      hof van discipline en vergezeld van zes afschriften van de beslissing waarvan beroep. De griffier geeft van de
      instelling van het beroep onverwijld kennis aan de raad van discipline die de beslissing in eerste aanleg heeft
      genomen en, voorzover het hoger beroep niet door hem is ingesteld, aan de deken van de orde waartoe de betrokken
      advocaat behoort, aan de betrokken advocaat en aan de klager.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel56
  - number: '56.4'
    text: |-
      Aan de behandeling en de beslissing van beroepen door een kamer bij het hof wordt op straffe van nietigheid
      deelgenomen door vijf leden van het hof, onder wie de voorzitter of één van de plaatsvervangende voorzitters,
      alsmede door twee door Ons benoemde leden.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel56
  - number: '56.5'
    text: |-
      Indien een ingesteld hoger beroep wordt ingetrokken, bepaalt, voor het geval dat de maatregel van schorsing in
      de uitoefening van de praktijk is opgelegd, het hof van discipline, de betrokken advocaat gehoord of behoorlijk
      opgeroepen, de dag waarop de maatregel aanvangt.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel56
  - number: '56.6'
    text: |-
      De [artikelen 512 tot en met 519 van het Wetboek van Strafvordering ][ref1] zijn ten aanzien van de leden van het
      hof van discipline van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel512
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '512'
  - number: 56a.1
    text: |-
      De voorzitter van het hof van discipline kan kennelijk niet-ontvankelijke en kennelijk ongegronde beroepen, alsmede
      beroepen die naar zijn oordeel niet zullen leiden tot een andere beslissing dan die van de raad van discipline,
      binnen dertig dagen nadat zij zijn ingesteld, bij met redenen omklede beslissing afwijzen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel56a
  - number: 56a.2
    text: |-
      [Artikel 46][ref1], is van overeenkomstige toepassing, met dien verstande dat ook een afschrift van de beslissing
      wordt gezonden aan de deken van de Nederlandse orde van advocaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46g
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46g
        paragraaf: '4'
  - number: 56a.3
    text: |-
      De voorzitter kan zich bij de uitoefening van de in het eerste lid bedoelde bevoegdheden doen vervangen door een
      plaatsvervangend voorzitter, lid van de rechterlijke macht.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel56a
  - number: 56b.1
    text: |-
      Tegen de beslissing in het vorige artikel bedoeld, kunnen degene die het beroep heeft ingesteld, alsmede de deken
      van de Nederlandse orde van advocaten binnen veertien dagen na de verzending van het afschrift van de beslissing,
      schriftelijk verzet doen bij het hof van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel56b
  - number: 56b.2
    text: |-
      [Artikel 46][ref1], is van overeenkomstige toepassing, met dien verstande dat van de beslissing tot niet-
      ontvankelijk- of ongegrondverklaring ook een afschrift aan de deken van de Nederlandse orde van advocaten wordt
      gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46h
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46h
        paragraaf: '4'
  - number: '57.1'
    text: |-
      Het hof van discipline beslist niet dan na verhoor of behoorlijke oproeping van de klager, de betrokken advocaat
      en, zo dezen hoger beroep hebben ingesteld, de deken die in eerste aanleg de klacht ter kennis van de raad van
      discipline heeft gebracht en de deken van de Nederlandse orde van advocaten.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel57
  - number: '57.2'
    text: |-
      Op de behandeling in het hoger beroep zijn de [artikelen 47a][ref1], [48, eerste lid,][ref2] en [49][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel47a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel49
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 47a
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: '49'
        paragraaf: '4'
  - number: '57.3'
    text: |-
      Het hof van discipline kan de deken, die de betrokken zaak heeft onderzocht of het lid van de raad van toezicht,
      dat hem bij de instructie van de zaak heeft vervangen, alsmede de raad van discipline die de beslissing heeft
      genomen, uitnodigen nadere inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel57
  - number: '57.4'
    text: |-
      Het hof van discipline onderzoekt op grondslag van de beslissing van de raad van discipline. Het hof kan mede
      oordelen over feiten die de raad van discipline niet voor een maatregel vatbaar heeft geacht, en kan door de raad
      van discipline onbewezen geachte feiten onderzoeken.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel57
  - number: '57.5'
    text: |-
      Indien alleen de betrokken advocaat hoger beroep heeft ingesteld kan het hof van discipline slechts met
      eenparigheid van stemmen de opgelegde maatregel verzwaren. In de overige gevallen kan het hof van discipline een
      maatregel opleggen, een opgelegde maatregel verlichten of verzwaren, of bepalen dat er geen grond is voor het
      opleggen van een maatregel.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel57
  - number: 57a
    text: |-
      Indien het hof van discipline bij oplegging van de maatregel van schorsing beslist dat deze, overeenkomstig het in
      [artikel 48a][ref1] bepaalde, geheel of gedeeltelijk niet ten uitvoer zal worden gelegd, wordt de beslissing over
      de tenuitvoerlegging overgelaten aan de raad van discipline die in eerste aanleg over de klacht heeft geoordeeld.
      De [artikelen 48b tot en met 48g][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48b
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48a
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 48b
        paragraaf: '4'
  - number: '58'
    text: 'De griffier van het hof van discipline zendt van de beslissing bij aangetekende brief onverwijld afschrift:'
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel58
  - number: 58.a
    text: aan de betrokken advocaat;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel58
  - number: 58.b
    text: aan de deken van de Nederlandse orde van advocaten;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel58
  - number: 58.c
    text: aan de raad van discipline die de zaak in eerste aanleg heeft behandeld;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel58
  - number: 58.d
    text: |-
      aan de deken van de orde waarvan de betrokken advocaat deel uitmaakt, of, indien de betrokken advocaat de deken is,
      aan het lid van de raad van toezicht bedoeld in [het eerste lid van artikel 23][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel23
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '23'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 58.e
    text: |-
      indien de beslissing in eerste aanleg werd gegeven krachtens een verwijzing als bedoeld in
      [het derde lid van artikel 46a][ref1], aan de voorzitter van de raad van discipline, waartoe de betrokken advocaat
      behoort;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46a
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46a
        paragraaf: '4'
  - number: 58.f
    text: |-
      indien aan de betrokken advocaat die is ingeschreven bij een raad voor rechtsbijstand, een maatregel als bedoeld
      in [artikel 48, tweede lid, onder a tot en met d][ref1] is opgelegd dan wel het hof van discipline toezending nodig
      acht, aan de voorzitter van de desbetreffende raad voor rechtsbijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 58.g
    text: |-
      aan de klager, indien werd beslist naar aanleiding van een klacht in eerste aanleg als bedoeld in
      [artikel 46c, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
  - number: '59.1'
    text: |-
      De maatregelen van schorsing in de uitoefening van de praktijk en van schrapping van het tableau worden, zodra
      de beslissing in kracht van gewijsde is gegaan, door de griffier van de raad van discipline medegedeeld aan de
      rechtbank, bij welke de advocaat is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel59
  - number: '59.2'
    text: |-
      De deken van de orde, waarvan de betrokken advocaat deel uitmaakt, of in het geval vermeld in
      [artikel 50, eerste lid, onder c][ref1], het daar bedoelde lid, draagt zorg voor de openbaarmaking, als bedoeld in
      [artikel 48, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '50'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: '59.3'
    text: |-
      In geval van toepassing van de [artikelen 48a][ref1] tot en met [48g][ref2] geschieden de mededeling, bedoeld in
      het eerste lid, en de openbaarmaking, bedoeld in het tweede lid, niet dan nadat last tot tenuitvoerlegging van de
      beslissing of het betrokken deel daarvan is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48g
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48a
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 48g
        paragraaf: '4'
  - number: '60.1'
    text: |-
      De door Ons benoemde leden en plaatsvervangende leden ontvangen vergoeding van reis- en verblijfkosten en verdere
      verschotten alsmede een door Onze Minister vast te stellen vacatiegeld uit ’s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60
  - number: '60.2'
    text: |-
      De leden-advocaten en plaatsvervangende leden-advocaten en de griffier ontvangen vergoeding van reis- en
      verblijfkosten en verdere verschotten van de Nederlandse orde. De griffier ontvangt bovendien een vergoeding van de
      Nederlandse orde, waarvan het bedrag wordt vastgesteld door de algemene raad.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60
  - number: '60.3'
    text: |-
      De overige kosten van het hof van discipline komen ten laste van de Nederlandse orde, met dien verstande dat de
      kosten die voortvloeien uit beroepen bedoeld in [artikel 56, eerste lid, onder a][ref1], door de staat aan de
      Nederlandse orde worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel56
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '56'
        paragraaf: '4'
  - number: 60a
    text: |-
      De voorgaande bepalingen van deze paragraaf, met uitzondering van [artikel 46fa][ref1], zijn eveneens van
      toepassing op bezoekende advocaten als bedoeld in [artikel 16b][ref2], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46fa
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel16b
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46fa
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 16b
        afdeling: 2a
  - number: 60a.1
    text: |-
      in afwijking van [artikel 46][ref1] de tuchtrechtspraak in eerste aanleg wordt uitgeoefend door de raad van
      discipline die bevoegd is ten aanzien van de samenwerkende advocaat en bij gebreke van dien door de raad van
      discipline te 's-Gravenhage;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '46'
        paragraaf: '4'
  - number: 60a.2
    text: |-
      in afwijking van [artikel 48, tweede lid][ref1], als maatregelen kunnen worden opgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 60a.2.a
    text: enkele waarschuwing;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60a
  - number: 60a.2.b
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60a
  - number: 60a.2.c
    text: |-
      schorsing gedurende ten hoogste één jaar in de bevoegdheid in Nederland de in [artikel 16b][ref1] bedoelde
      werkzaamheden uit te oefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16b
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16b
        afdeling: 2a
  - number: 60a.2.d
    text: |-
      ontzegging van de bevoegdheid in Nederland de in [artikel 16b][ref1] bedoelde werkzaamheden uit te oefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16b
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16b
        afdeling: 2a
  - number: 60a.3
    text: |-
      het in [artikel 48, derde lid][ref1], bepaalde omtrent openbaarmaking mede van toepassing is op de in het vorige
      lid onder b, c en d genoemde straffen;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 60a.4
    text: |-
      aan de bevoegde autoriteit van de staat van herkomst van de betrokken advocaat mededelingen kunnen worden gevraagd
      van de nodige gegevens over diens beroepsuitoefening en kennis zal worden gegeven van iedere genomen beslissing,
      een en ander onverminderd het vertrouwelijke karakter van die inlichtingen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60a
  - number: 60aa.1
    text: |-
      De [artikelen 46 tot en met 46f][ref1] en [46g tot en met 60][ref2] alsmede de [artikelen 60b tot en met 60g][ref3]
      zijn van overeenkomstige toepassing op de advocaten die hun werkzaamheden uitoefenen onder hun oorspronkelijke
      beroepstitel als bedoeld in [artikel 16h][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel46g
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '46'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 46g
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4a
      - id: ref4
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
  - number: 60aa.2
    text: |-
      In afwijking van [artikel 48, tweede lid][ref1], kunnen als maatregelen worden opgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 60aa.2.a
    text: de enkele waarschuwing;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60aa
  - number: 60aa.2.b
    text: de berisping;
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60aa
  - number: 60aa.2.c
    text: |-
      de schorsing gedurende ten hoogste één jaar in de bevoegdheid in Nederland de in [artikel 16h][ref1] bedoelde
      werkzaamheden uit te oefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
  - number: 60aa.2.d
    text: de doorhaling van de inschrijving.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60aa
  - number: 60aa.3
    text: |-
      Het in [artikel 48, derde lid][ref1] bepaalde omtrent openbaarmaking is mede van toepassing op de in het tweede lid
      genoemde maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 60aa.4
    text: |-
      De bevoegde autoriteit van de staat van herkomst wordt in de gevallen, bedoeld in de
      [artikelen 46h, derde lid][ref1], [48f][ref2], [49][ref3], [56, vijfde lid][ref4], [57, eerste lid][ref5],
      [60b, eerste en zevende lid][ref6] en [60c, derde en vierde lid][ref7] in de gelegenheid gesteld haar mening
      kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46h
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48f
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel56
      [ref5]: https://wetten.overheid.nl/BWBR0002093#Artikel57
      [ref6]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
      [ref7]: https://wetten.overheid.nl/BWBR0002093#Artikel60c
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46h
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 48f
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: '49'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0002093
        artikel: '56'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0002093
        artikel: '57'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4a
      - id: ref7
        bwb_id: BWBR0002093
        artikel: 60c
        paragraaf: 4a
  - number: 60aa.5
    text: |-
      Indien de bevoegde autoriteit van de lidstaat van herkomst of de tuchtrechter aldaar de uitoefening van het beroep
      advocaat tijdelijk of blijvend heeft ontzegd is de betrokken advocaat van rechtswege niet meer bevoegd om in
      Nederland zijn beroep onder zijn oorspronkelijke beroepstitel uit te oefenen. De raad van toezicht haalt alsdan
      de inschrijving van de advocaat tijdelijk onderscheidenlijk blijvend door. De raad van toezicht stelt de bevoegde
      autoriteit van de staat van herkomst in kennis van de doorhaling.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60aa
  - number: 60aa.6
    text: |-
      Alvorens jegens de onder zijn oorspronkelijke beroepstitel werkzame advocaat een tuchtrechtelijke procedure in te
      stellen dan wel een procedure inzake de onbehoorlijke praktijkuitoefening aan te vangen, stelt de raad van toezicht
      waarbij deze advocaat zich heeft laten inschrijven de bevoegde autoriteit van de staat van herkomst van die
      advocaat daarvan onverwijld in kennis en verstrekt zij deze alle dienstige inlichtingen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60aa
  - number: 60aa.7
    text: |-
      Gedurende de procedure werkt de raad van toezicht met de bevoegde autoriteit van de staat van herkomst samen. Het
      [vierde lid van artikel 60a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60a
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60a
        paragraaf: '4'
  - number: 60b.1
    text: |-
      De raad van discipline kan, al dan niet nadat een onderzoek overeenkomstig de [artikelen 60c tot en met 60g][ref1]
      heeft plaatsgevonden, op verzoek van de deken van de orde waartoe de advocaat behoort een advocaat die tijdelijk
      of blijvend geen blijk geeft zijn praktijk behoorlijk uit te kunnen oefenen, voor onbepaalde tijd in de uitoefening
      van de praktijk schorsen dan wel een of meer voorzieningen met betrekking tot de praktijkuitoefening van de
      betrokken advocaat treffen die hij geboden acht. De raad van discipline kan tegelijkertijd met het opleggen van
      een schorsing een voorziening treffen. Hij beslist niet dan na verhoor of behoorlijke oproeping van de deken van de
      orde waartoe de advocaat behoort en de betrokken advocaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60c
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60c
        paragraaf: 4a
  - number: 60b.2
    text: |-
      Op de behandeling van de zaak zijn de [artikelen 47, eerste en tweede lid][ref1], en
      [49, tweede tot en met tiende lid][ref2], van overeenkomstige toepassing. De behandeling geschiedt met gesloten
      deuren, tenzij de betrokken advocaat behandeling in een openbare zitting wenst.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel49
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '47'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '49'
        paragraaf: '4'
  - number: 60b.3
    text: |-
      Op de verzending van een afschrift van de beslissingen van de raad van discipline, bedoeld in het eerste lid,
      is het [eerste lid, onder a tot en met d van artikel 50][ref1] van overeenkomstige toepassing. Bovendien zendt
      de griffier van de raad van discipline bij aangetekende brief onverwijld afschrift van de beslissing inzake
      de schorsing van de betrokken advocaat, bedoeld in het eerste lid, aan de rechtbank bij welke de advocaat is
      ingeschreven, en indien de betrokken advocaat is ingeschreven bij een raad voor rechtsbijstand, aan de voorzitter
      van de desbetreffende raad voor rechtsbijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel50
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '50'
        paragraaf: '4'
  - number: 60b.4
    text: |-
      Zowel de advocaat als de deken van de orde waartoe de advocaat behoort kan gedurende dertig dagen na
      verzending van een afschrift van de beslissing tegen de beslissing, bedoeld in het eerste lid, hoger beroep
      instellen bij het hof van discipline. De tweede zin van het tweede lid is van toepassing. Op de behandeling
      van de zaak zijn de [artikelen 55][ref1], [56, tweede, derde, vierde en zesde lid][ref2] van toepassing.
      [Artikel 57][ref3] met uitzondering van de verwijzing in het tweede lid naar [artikel 47a][ref4] en het
      [eerste lid van artikel 48][ref5] en met uitzondering van het vijfde lid is van overeenkomstige toepassing. Het
      [eerste lid, onder a tot en met f van artikel 58][ref6] is van toepassing met dien verstande dat de griffier van
      het hof van discipline aan de voorzitter van de raad van rechtsbijstand bij welke de advocaat is ingeschreven
      uitsluitend een afschrift van de beslissing inzake de schorsing zendt. De rechtbank bij welke de advocaat is
      ingeschreven ontvangt eveneens een afschrift van de beslissing van het hof inzake de schorsing van de betrokken
      advocaat. Het hoger beroep schorst niet de werking van de beslissing waartegen het is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel47a
      [ref5]: https://wetten.overheid.nl/BWBR0002093#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0002093#Artikel58
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '55'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '56'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: '57'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0002093
        artikel: 47a
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0002093
        artikel: '58'
        paragraaf: '4'
  - number: 60b.5
    text: |-
      De geschorste advocaat mag gedurende de schorsing de titel van advocaat niet voeren. Het
      [zesde lid van artikel 48][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 60b.6
    text: |-
      Met betrekking tot het toezien op de naleving van de voorzieningen als bedoeld in het eerste lid is
      [artikel 48c][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48c
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48c
        paragraaf: '4'
  - number: 60b.7
    text: |-
      Op verzoek van de advocaat kan de raad van discipline te allen tijde de schorsing of de getroffen voorzieningen
      opheffen. Hij beslist hierover niet dan na verhoor of behoorlijke oproeping van de deken en de betrokken advocaat.
      Het tweede tot en met het vijfde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60b
  - number: 60c.1
    text: |-
      De deken kan de voorzitter van de raad van discipline schriftelijk verzoeken tot het instellen van een onderzoek
      naar de toestand waarin de praktijk van een advocaat zich bevindt, indien hij aanwijzingen heeft dat een situatie
      als bedoeld in [artikel 60b, eerste lid][ref1], zich voordoet. Het verzoekschrift bevat de gronden waarop het
      berust.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4a
  - number: 60c.2
    text: |-
      Bevoegd tot het indienen van een verzoekschrift is de deken van de orde waartoe de advocaat behoort. Indien de
      betrokken advocaat de deken is, is het in [artikel 23, eerste lid][ref1], bedoelde lid van de raad van toezicht
      bevoegd. Bevoegd tot kennisneming is de voorzitter van de raad van discipline binnen wiens ressort de betrokken
      advocaat is ingeschreven. De voorzitter kan zich bij de uitoefening van zijn bevoegdheid door één van de
      plaatsvervangende voorzitters doen vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel23
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '23'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 60c.3
    text: |-
      De voorzitter beslist op het verzoek als bedoeld in het eerste lid zo spoedig mogelijk na verhoor of behoorlijke
      oproeping van de deken en de betrokken advocaat. De behandeling geschiedt ter zitting met gesloten deuren, tenzij
      de betrokken advocaat behandeling in een openbare zitting wenst.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60c
  - number: 60c.4
    text: |-
      Tegen de beslissing, bedoeld in het derde lid, kunnen de betrokken advocaat en de deken binnen veertien dagen
      na verzending van een afschrift van de beslissing verzet doen bij de raad van discipline. Het derde lid is van
      overeenkomstige toepassing. Het verzet schorst niet de werking van de beslissing waartegen het is gericht.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60c
  - number: 60d.1
    text: |-
      Bij het instellen van een onderzoek als bedoeld in [artikel 60c, eerste lid][ref1] benoemt de voorzitter van de
      raad van discipline één of meer rapporteurs onder vaststelling van een termijn van ten hoogste zes weken waarbinnen
      aan hem verslag moet worden uitgebracht over de toestand waarin de praktijk van de betrokken advocaat zich bevindt.
      De voorzitter kan deze termijn op verzoek van de rapporteur of rapporteurs één maal met ten hoogste zes weken
      verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60c
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60d
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60c
        paragraaf: 4a
  - number: 60d.2
    text: |-
      De voorzitter bepaalt bij de beslissing, bedoeld in het eerste lid, de grondslag voor de vergoeding van de door
      hem benoemde rapporteur of rapporteurs en stelt het bedrag vast dat het onderzoek ten hoogste mag kosten. Hij kan
      hangende het onderzoek dit bedrag op verzoek van de rapporteur of rapporteurs verhogen. De voorzitter kan voorts
      bepalen dat de betrokken advocaat voor de betaling van de kosten zekerheid stelt.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60d
  - number: 60d.3
    text: |-
      De raad van discipline stelt met inachtneming van het tweede lid, het bedrag vast dat overeenkomstig het vierde lid
      moet worden vergoed.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60d
  - number: 60d.4
    text: |-
      De betrokken advocaat draagt de kosten van het onderzoek, tenzij de raad van discipline naar aanleiding van
      de resultaten van het verslag de betrokken advocaat niet schorst dan wel geen voorziening treft als bedoeld in
      [artikel 60b, eerste lid][ref1] of de betrokken advocaat niet of slechts gedeeltelijk in staat is deze kosten te
      dragen. In het laatste geval draagt de advocaat een gedeelte van de kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60d
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4a
  - number: 60d.5
    text: |-
      De kosten van het onderzoek die niet door de advocaat worden gedragen, worden vergoed door de orde in het
      arrondissement van de rechtbank waarbij de advocaat is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60d
  - number: 60d.6
    text: |-
      Indien het hof van discipline in hoger beroep beslist dat er geen grond is voor het opleggen van een schorsing
      of het treffen van een voorziening, kan het hof van discipline tevens bepalen dat een geheel of gedeelte van de
      kosten van het onderzoek wordt gedragen door de ordein het arrondissement van de rechtbank waarbij de advocaat
      is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60d
  - number: 60e.1
    text: |-
      De rapporteur alsmede de door hem aangewezen personen die hem vergezellen, is bevoegd elke plaats te betreden
      waarin de praktijk van de betrokken advocaat wordt uitgeoefend en zij zijn gerechtigd tot inzage van de dossiers,
      boeken, bescheiden en andere gegevensdragers betrekking hebbende op de praktijk van de advocaat waarvan de
      rapporteur de kennisneming in verband met een juiste vervulling van zijn taak nodig acht met inbegrip van die van
      het samenwerkingsverband waarbinnen de advocaat zijn praktijk uitoefent. De rapporteur kan de hulp van de sterke
      arm inroepen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60e
  - number: 60e.2
    text: |-
      De betrokken advocaat en de advocaten met wie hij een samenwerkingsverband vormt, degenen die in dienst van
      de advocaat of het samenwerkingsverband zijn alsmede de werkgever van de betrokken advocaat zijn verplicht
      alle gevraagde inlichtingen te verschaffen die de rapporteur nodig oordeelt voor zijn onderzoek en inzage te
      verschaffen in de in het eerste lid bedoelde gegevensdragers. Indien het onderzoek – mede – betrekking heeft op een
      rechtspersoon, berust op de bestuurders en commissarissen van die rechtspersoon eenzelfde verplichting.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60e
  - number: 60e.3
    text: |-
      Op de advocaten met wie de betrokken advocaat een samenwerkingsverband vormt zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60e
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: 60f.1
    text: |-
      Tijdens het onderzoek kan de voorzitter van de raad van discipline op verzoek van de rapporteur of de rapporteurs
      voor ten hoogste de duur van het onderzoek een voorlopige voorziening treffen indien het belang van het onderzoek
      dit eist.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60f
  - number: 60f.2
    text: |-
      Tijdens het onderzoek kan de voorzitter van de raad van discipline op verzoek van de deken of de
      rapporteur of de rapporteurs een voorlopige voorziening treffen indien hij dit in verband met de toestand
      van de praktijk noodzakelijk acht. Deze voorziening blijft gelden totdat een beslissing als bedoeld in
      [artikel 60b, eerste lid][ref1], is genomen of de voorzitter van de raad de voorlopige voorziening opheft op de
      grond dat deze niet langer noodzakelijk is in verband met de toestand van de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60f
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4a
  - number: 60f.3
    text: |-
      Tegen een beslissing als bedoeld in het eerste en tweede lid kunnen de betrokken advocaat en de deken binnen
      veertien dagen na verzending van een afschrift van de beslissing verzet doen bij de raad van discipline.
      [Artikel 60c, derde lid, tweede volzin][ref1], is van overeenkomstige toepassing. Het verzet schorst niet de
      werking van de beslissing waartegen het is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60c
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60f
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60c
        paragraaf: 4a
  - number: 60g.1
    text: |-
      De rapporteur zendt zijn verslag, dat een met redenen omkleed oordeel over de toestand van de praktijk van de
      betrokken advocaat en desgewenst een of meer aanbevelingen bevat, aan de voorzitter van de raad. De griffier van de
      raad doet onverwijld aan de betrokken advocaat alsmede aan de deken een afschrift van het verslag toekomen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60g
  - number: 60g.2
    text: |-
      Behalve door de betrokken advocaat en door de deken aan de raad van toezicht waarvan hij deel uitmaakt, mag zonder
      toestemming van de voorzitter van de raad van discipline uit het verslag geen mededeling aan derden worden gedaan.
      De rapporteur en degenen die de rapporteur bij het onderzoek heeft betrokken maken hetgeen hun bij het onderzoek
      blijkt, niet verder bekend dan de opdracht met zich brengt.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60g
  - number: 60g.3
    text: |-
      De raad van discipline neemt een beslissing als bedoeld in [artikel 60b, eerste lid][ref1], binnen vier weken na de
      ontvangst van het verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60g
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4a
  - number: 60g.4
    text: |-
      Onverminderd de bevoegdheid van de voorzitter van de raad een voorlopige voorziening als bedoeld in
      [artikel 60f, tweede lid][ref1], eerder op te heffen, is een dergelijke voorziening van rechtswege opgeheven met
      ingang van de eerste dag na ommekomst van de in het derde lid van dit artikel genoemde termijn indien de raad een
      beslissing als bedoeld in [artikel 60b, eerste lid][ref2], niet heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60f
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60g
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60f
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4a
  - number: 60h
    text: |-
      Indien de advocaat jegens wie het voornemen bestaat een procedure inzake de onbehoorlijke praktijkuitoefening aan
      te vangen, zich krachtens het nationale recht van een andere lidstaat van de Europese Unie of een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte dat uitvoering geeft aan artikel 3 van
      [richtlijn 98/5/EG](31998L0005) van het Europees Parlement en de Raad van de Europese Unie van 16 februari 1998 ter
      vergemakkelijking van de permanente uitoefening van het beroep van advocaat, heeft laten inschrijven, stelt de raad
      van toezicht voor de aanvang van de procedure de bevoegde autoriteit in die lidstaat of lidstaten van dit voornemen
      op de hoogte en verstrekt hij aan die autoriteit of autoriteiten alle dienstige inlichtingen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel60h
  - number: '61.1'
    text: De procureurs worden ingeschreven bij de rechtbank van het arrondissement, waarin hun kantoor is gevestigd.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel61
  - number: '61.2'
    text: |-
      De inschrijving geldt als toelating bij de rechterlijke colleges, in het arrondissement gevestigd. Een procureur
      kan niet gelijktijdig ook bij een rechterlijk college buiten het arrondissement zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel61
  - number: '62'
    text: |-
      Ieder die aan een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, hebben verkregen het doctoraat
      in de rechtsgeleerdheid of het recht om de titel meester te voeren, mits dit doctoraat of dit recht verkregen is op
      grond van het afleggen van een examen in het privaatrecht met inbegrip van burgerlijk procesrecht, het strafrecht
      met inbegrip van strafprocesrecht, alsmede in een van de volgende drie vakken: staatsrecht, bestuursrecht
      met inbegrip van administratief procesrecht, of belastingrecht, is bevoegd aan de voorzitter van de rechtbank
      schriftelijk inschrijving als procureur te verzoeken. Eveneens is bevoegd inschrijving te verzoeken degene die in
      het bezit is van een ten aanzien van het beroep van procureur afgegeven EG-verklaring als bedoeld in de Algemene
      wet erkenning EG-hoger-onderwijsdiploma’s dan wel in de [Algemene wet erkenning EG-beroepsopleidingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0006781
  - number: '63.1'
    text: |-
      De procureurs worden bij de rechtbank, waarbij zij verlangen te worden ingeschreven, op requisitoir van het
      openbaar ministerie beëdigd.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel63
  - number: '63.2'
    text: |-
      Zij leggen dezelfde eed of belofte af als de advocaten, met toevoeging aan het formulier van eedsaflegging van de
      woorden "alsmede dat ik mijn plichten als procureur getrouw zal vervullen".
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel63
  - number: '63.3'
    text: |-
      De procureurs, die reeds als advocaat beëdigd zijn, leggen de volgende eed (belofte) af: "Ik zweer (beloof), dat ik
      mijn plichten als procureur getrouw zal vervullen."
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel63
  - number: '64'
    text: |-
      De [artikelen 1, vierde en vijfde lid][ref1], [2, tweede en derde lid][ref2], [4 tot en met 9][ref3] en [9][ref4]
      zijn op de procureurs van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel9b
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: '4'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002093
        artikel: 9b
        afdeling: 1a
  - number: '65'
    text: |-
      De procureurs oefenen hun functies uit overeenkomstig het bij en krachtens de
      [Wet op de rechterlijke organisatie][ref1] en het [Wetboek van Burgerlijke Rechtsvordering][ref2] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0001830
      [ref2]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001830
      - id: ref2
        bwb_id: BWBR0001827
  - number: '66'
    text: |-
      De [artikelen 12, eerste tot en met derde en vijfde lid][ref1], en [16][ref2] zijn op de procureurs van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel16
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '12'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '16'
        afdeling: '2'
  - number: '67.1'
    text: |-
      De rechtzoekende die niet of niet tijdig een procureur bereid vindt hem zijn diensten te verlenen in een zaak,
      waarin vertegenwoordiging door een procureur is voorgeschreven dan wel bijstand uitsluitend door een advocaat of
      procureur kan geschieden, kan zich wenden tot de deken van de orde van advocaten in het arrondissement waar de zaak
      moet dienen, met het verzoek een procureur aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel67
  - number: '67.2'
    text: |-
      Het bepaalde in [artikel 13, tweede, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel13
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '13'
        afdeling: '2'
  - number: '68'
    text: |-
      Zij zijn gehouden in persoon, of in geval van afwezigheid of belet, door een andere procureur vertegenwoordigd,
      zich in hun kostuum op de terechtzittingen te laten vinden, wanneer hun zaken worden opgeroepen; zij zullen verder
      in de zaken, aan hen opgedragen, aanwezig moeten zijn bij al die handelingen, waarbij de wet hun tegenwoordigheid
      vereist.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel68
  - number: '69'
    text: |-
      Waar in de [artikelen 17 tot en met 60][ref1], [60b tot en met 60g][ref2] van de advocaten wordt gesproken, zijn de
      procureurs daaronder begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '17'
        paragraaf: Afdeling_1
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4a
  - number: 69a
    text: |-
      Tot het voeren van de titel van procureur is uitsluitend gerechtigd hij die in Nederland als procureur is
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel69a
  - number: '70'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot het ambtskostuum van de advocaten en
      procureurs.
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel70
  - number: '71'
    text: 'Deze wet wordt aangehaald als: Advocatenwet.'
    url: https://wetten.overheid.nl/BWBR0002093/2004-05-01#Artikel71
