  - number: 8a.2.g
    text: |-
      [artikel 8, eerste lid, onderdeel n][ref1], voor zover het een besluit betreft als bedoeld in de
      [artikelen 28 tot en met 30][ref2] of [32c van de Wet ter voorkoming van witwassen en financieren van terrorisme]
      (onbekend) dat op grond van [artikel 32f, eerste, vierde of vijfde lid, van die wet](onbekend) openbaar wordt
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '8'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '28'
  - number: 8a.3
    text: |-
      Met uitzondering van de gegevens die betrekking hebben op het opleggen van de maatregel van de schrapping van het
      tableau kunnen de gegevens, bedoeld in het tweede lid, onder b tot en met e, door anderen dan de in het eerste
      lid bedoelde personen en instanties niet worden ingezien, indien tien jaren zijn verstreken na het onherroepelijk
      worden van de beslissing waarop de gegevens betrekking hebben. De raad van discipline of het hof van discipline kan
      bij zijn beslissing bepalen dat de in de eerste volzin bedoelde termijn wordt verkort, met dien verstande dat de
      termijn niet korter kan zijn dan de duur van de schorsing.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8a
  - number: 8a.4
    text: |-
      De gegevens, bedoeld in het tweede lid, onderdeel g, kunnen gedurende een periode van vijf jaar na openbaarmaking
      op grond van [artikel 32f, eerste, vierde of vijfde lid, van de Wet ter voorkoming van witwassen en financieren van
      terrorisme](onbekend) door anderen dan de in het eerste lid bedoelde personen en instanties worden ingezien, tenzij
      enig wettelijk voorschrift daaraan in de weg staat.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8a
  - number: 8b
    text: |-
      De secretaris van de algemene raad maakt schriftelijk een lijst openbaar van gegevens over advocaten
      ten aanzien van wie een beslissing tot het onvoorwaardelijk opleggen van een maatregel als bedoeld in
      [artikel 48, tweede lid, onder d of e][ref1], onherroepelijk is geworden. In deze lijst worden opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 8b.a
    text: de naam van de advocaat en het advocatenkantoor waar de advocaat werkzaam is;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8b
  - number: 8b.b
    text: de plaats waar de advocaat kantoor houdt;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8b
  - number: 8b.c
    text: de vermelding van de raad van de orde in het arrondissement waartoe de advocaat behoort;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8b
  - number: 8b.d
    text: |-
      de maatregel die aan de advocaat is opgelegd, voor zover van toepassing met vermelding van de duur van de
      maatregel; en
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8b
  - number: 8b.e
    text: de datum van de beslissing waarbij de maatregel is opgelegd alsmede de datum waarop de maatregel ingaat.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8b
  - number: 8c.1
    text: 'De secretaris van de algemene raad schrapt de advocaat die op het tableau is ingeschreven in geval:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8c
  - number: 8c.1.a
    text: |-
      Hij om schrapping heeft verzocht omdat hij niet langer op het tableau wenst ingeschreven te staan of enige
      betrekking heeft verkregen waarmee het beroep van advocaat onverenigbaar is. In het laatstbedoelde geval
      kan eveneens de rechtbank in het arrondissement waarin de advocaat kantoor houdt tot schrapping beslissen op
      requisitoir van het openbaar ministerie, de raad van de orde in het arrondissement gehoord. Van de beslissing tot
      schrapping wordt door de griffier van de rechtbank kennisgegeven aan de secretaris van de algemene raad met het oog
      op de verwerking op het tableau;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8c
  - number: 8c.1.b
    text: De advocaat is overleden;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8c
  - number: 8c.1.c
    text: |-
      Hij, hetzij onafgebroken, hetzij met onderbrekingen, gedurende een tijdvak van drie jaar voorwaardelijk als
      advocaat ingeschreven heeft gestaan:
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8c
  - number: 8c.1.c.1°
    text: |-
      zonder dat de verklaring bedoeld in [artikel 9b, vijfde lid][ref1], kan worden overlegd; of


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel9b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 9b
        afdeling: 1a
  - number: 8c.1.c.2°
    text: |-
      zonder dat het bewijs kan worden overgelegd dat met gunstig gevolg het in [artikel 9c][ref1] bedoelde examen is
      afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel9c
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 9c
        afdeling: 1a
  - number: 8c.2
    text: |-
      Indien het in het eerste lid, onderdeel c, bedoelde tijdvak is onderbroken en de verklaring bedoeld in het eerste
      lid, onderdeel c, onder 1°, of het onder 2°, bedoelde bewijs niet kan worden overgelegd, kan betrokkene verzoeken
      om opnieuw gedurende een tijdvak van drie jaar voorwaardelijk als advocaat te worden ingeschreven. Dit verzoek kan
      worden ingediend na drie jaar na onderbreking van het tijdvak.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8c
  - number: 8c.3
    text: |-
      Voor voorwaardelijk ingeschreven advocaten die in deeltijd werkzaam zijn, wordt het in de aanhef van het eerste
      lid, onderdeel c, bedoelde tijdvak naar evenredigheid verlengd, met dien verstande dat deze verlenging niet meer
      dan drie jaar kan bedragen. Indien de raad op grond van [artikel 9b, tweede lid][ref1], de stage heeft verlengd,
      wordt het in de aanhef van het eerste lid, onderdeel c, bedoelde tijdvak verlengd met de in de beslissing opgenomen
      termijn, met dien verstande dat deze verlenging niet meer dan drie jaar kan bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel9b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 9b
        afdeling: 1a
  - number: 8c.4
    text: |-
      De in het eerste lid, onderdeel c, bedoelde schrapping geschiedt middels een beschikking van de algemene raad
      met ingang van een tijdstip dat ten minste twee maanden en ten hoogste zes maanden na de datum van de beschikking
      gelegen is. Van de beschikking wordt gelijktijdig mededeling gedaan aan de betrokken advocaat, diens patroon, de
      raad van de orde in het arrondissement waar de advocaat kantoor houdt en aan het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8c
  - number: 8c.5
    text: |-
      De secretaris van de algemene raad geeft van de schrapping binnen acht dagen kennis aan de algemene raad en de raad
      van de orde in het arrondissement.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8c
  - number: 8d
    text: |-
      De [artikelen 8, eerste lid, aanhef en onder a, b, d, en f tot en met m, en tweede lid][ref1], [8a][ref2],
      [8b][ref3], en [8c, eerste lid][ref4], zijn van overeenkomstige toepassing op advocaten die hun werkzaamheden
      uitoefenen onder hun oorspronkelijke beroepstitel als bedoeld in [artikel 16h][ref5], met dien verstande
      dat: '- in [artikel 8, eerste lid, onderdeel h][ref6], voor «artikel 48, eerste lid,» wordt gelezen:'
      [artikel 48, eerste lid][ref7], en [artikel 60aa, tweede lid][ref8]; en
        - in [artikel 8a, tweede lid, onderdelen b tot en met e][ref9], en [artikel 8b][ref10] voor «artikel
      48, tweede lid, onder d of e» telkens wordt gelezen: [artikel 48, tweede lid, onder e][ref11], of
      [artikel 60aa, tweede lid][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel8a
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel8b
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel8c
      [ref5]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
      [ref6]: https://wetten.overheid.nl/BWBR0002093#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0002093#Artikel48
      [ref8]: https://wetten.overheid.nl/BWBR0002093#Artikel60aa
      [ref9]: https://wetten.overheid.nl/BWBR0002093#Artikel8a
      [ref10]: https://wetten.overheid.nl/BWBR0002093#Artikel8b
      [ref11]: https://wetten.overheid.nl/BWBR0002093#Artikel48
      [ref12]: https://wetten.overheid.nl/BWBR0002093#Artikel60aa
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8d
