  - number: '8.2'
    text: |-
      Bij de in het eerste lid, onder h tot en met n, bedoelde gegevens worden op het tableau tevens verwerkt de datum
      en het kenmerk van de daarop betrekking hebbende beslissing of beslissingen, alsmede de instantie die deze heeft
      genomen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8
  - number: 8a.1
    text: |-
      De advocaat waarop de gegevens betrekking hebben, de algemene raad, de secretaris van de algemene raad, de raden
      van de orden in de arrondissementen, het college van toezicht alsmede de griffiers, voorzitters, plaatsvervangend
      voorzitters, leden en plaatsvervangende leden van een raad van discipline en het hof van discipline hebben
      kosteloos inzage in de op grond van [artikel 8][ref1] op het tableau verwerkte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel8
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '8'
        afdeling: '1'
  - number: 8a.2
    text: 'Een ieder heeft kosteloos inzage in de op het tableau verwerkte gegevens, bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8a
  - number: 8a.2.a
    text: |-
      [artikel 8, eerste lid, onder a, c tot en met g, j en m][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel8
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '8'
        afdeling: '1'
  - number: 8a.2.b
    text: |-
