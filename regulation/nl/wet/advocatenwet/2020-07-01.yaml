      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46m
  - number: '54.3'
    text: |-
      De [artikelen 13a][ref1], [13b, uitgezonderd het eerste lid, onderdelen b en c, en vierde lid][ref2], en
      [13c tot en met 13g van de Wet op de rechterlijke organisatie][ref3] zijn van overeenkomstige toepassing ten
      aanzien van gedragingen van de leden en de plaatsvervangende leden, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel13b
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel13c
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: 13a
      - id: ref2
        bwb_id: BWBR0001830
        artikel: 13b
      - id: ref3
        bwb_id: BWBR0001830
        artikel: 13c
  - number: 54.3.a
    text: |-
      voor de overeenkomstige toepassing van die artikelen onder «het betrokken gerechtsbestuur» wordt verstaan: de
      voorzitter van het hof van discipline; en
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel54
  - number: 54.3.b
    text: |-
      de procureur-generaal niet verplicht is aan het verzoek, bedoeld in [artikel 13a][ref1], te voldoen, indien de
      verzoeker redelijkerwijs onvoldoende belang heeft bij een onderzoek als bedoeld in datzelfde artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: 13a
  - number: '55.1'
    text: Het hof van discipline waakt tegen nodeloze vertraging van het onderzoek door de raden van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel55
  - number: '55.2'
    text: Het kan zich de stukken doen overleggen en een termijn stellen, binnen welke de beslissing moet zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel55
  - number: '55.3'
    text: |-
      Indien een raad van discipline hieraan niet voldoet, kan het hof de behandeling van de zaak aan zich trekken en in
      het hoogste ressort beslissen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel55
  - number: '56.1'
    text: |-
      Van de beslissingen van de raad van discipline kan gedurende dertig dagen na de verzending van het in
      [artikel 50][ref1] bedoelde afschrift hoger beroep worden ingesteld bij het hof van discipline door:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel50
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '50'
        paragraaf: '4'
  - number: 56.1.a
    text: |-
      de klager die ingevolge [artikel 46c, eerste lid][ref1], de klacht heeft ingediend die tot de beslissing heeft
      geleid, indien de klacht geheel of gedeeltelijk ongegrond is verklaard of bij gegrondverklaring van de klacht het
      verzoek, bedoeld in [artikel 48, negende lid][ref2] wordt afgewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 56.1.b
    text: de deken;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel56
  - number: 56.1.c
    text: de advocaat jegens wie de beslissing is genomen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel56
  - number: '56.2'
    text: |-
      Van alle beslissingen van de raad van discipline kan voorts binnen dezelfde termijn hoger beroep worden ingesteld
      door de deken van de algemene raad. Hij kan zich vooraf de stukken doen overleggen. Hij kan bij de uitoefening van
      deze bevoegdheden zich door een lid van de algemene raad doen vervangen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel56
  - number: '56.3'
    text: |-
      Het beroep wordt ingesteld bij met redenen omklede memorie, in te dienen bij de griffier van het hof van discipline
      en vergezeld van een afschrift van de beslissing waarvan beroep. De griffier geeft van de instelling van het beroep
      onverwijld kennis aan de raad van discipline die de beslissing in eerste aanleg heeft genomen en, voorzover het
      hoger beroep niet door hem is ingesteld, aan de deken van de orde waartoe de betrokken advocaat behoort, aan het
      college van toezicht, aan de betrokken advocaat en aan de klager.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel56
  - number: '56.4'
    text: |-
      Aan de behandeling en de beslissing van beroepen door een kamer bij het hof wordt op straffe van nietigheid
      deelgenomen door de voorzitter of een van de plaatsvervangende voorzitters, alsmede een door Ons benoemd lid en
      een lid-advocaat of een plaatsvervangend lid-advocaat. Indien de zaak naar het oordeel van een van deze leden
      ongeschikt is voor behandeling en beslissing door drie leden, wordt de behandeling voortgezet door vijf leden,
      onder wie de voorzitter of een van de plaatsvervangende voorzitters alsmede door twee door Ons benoemde leden.
      Indien de voorzitter of plaatsvervangend voorzitter door na aanvang van de zaak opgekomen omstandigheden is
      verhinderd, kan deze worden vervangen door een door Ons benoemd lid of een door Ons benoemd plaatsvervangend lid.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel56
  - number: '56.5'
    text: |-
      Indien een ingesteld hoger beroep wordt ingetrokken, bepaalt, voor het geval dat de maatregel van schorsing in
      de uitoefening van de praktijk is opgelegd, het hof van discipline, de betrokken advocaat gehoord of behoorlijk
      opgeroepen, de dag waarop de maatregel aanvangt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel56
  - number: '56.6'
    text: |-
      De [artikelen 512 tot en met 519 van het Wetboek van Strafvordering][ref1] zijn ten aanzien van de leden van het
      hof van discipline van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel512
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '512'
  - number: 56a.1
    text: |-
      De voorzitter van het hof van discipline kan kennelijk niet-ontvankelijke en kennelijk ongegronde beroepen, alsmede
      beroepen die naar zijn oordeel niet zullen leiden tot een andere beslissing dan die van de raad van discipline,
      binnen dertig dagen nadat zij zijn ingesteld, bij met redenen omklede beslissing afwijzen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel56a
  - number: 56a.2
    text: |-
      [Artikel 50][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel50
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '50'
        paragraaf: '4'
  - number: 56a.3
    text: |-
      De voorzitter kan zich bij de uitoefening van de in het eerste lid bedoelde bevoegdheden doen vervangen door een
      plaatsvervangend voorzitter, lid van de rechterlijke macht.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel56a
  - number: 56b.1
    text: |-
      Tegen de beslissing in het vorige artikel bedoeld, kunnen degene die het beroep heeft ingesteld, alsmede de deken
      van de algemene raad binnen veertien dagen na de verzending van het afschrift van de beslissing, schriftelijk
      verzet doen bij het hof van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel56b
  - number: 56b.2
    text: |-
      [Artikel 46h, tweede tot en met achtste lid][ref1], is van overeenkomstige toepassing, met dien verstande dat van
      de beslissing tot niet-ontvankelijk- of ongegrondverklaring ook een afschrift aan de deken van de algemene raad
      wordt gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46h
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46h
        paragraaf: '4'
  - number: '57.1'
    text: |-
      Het hof van discipline beslist niet dan na verhoor of behoorlijke oproeping daartoe van de klager, de betrokken
      advocaat en degene die het beroep heeft ingesteld.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel57
  - number: '57.2'
    text: |-
      Op de behandeling in het hoger beroep zijn de [artikelen 46ba][ref1], [46e][ref2], [47a][ref3],
      [48 tot en met 48f][ref4] en [49][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46ba
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel46e
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel47a
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel48
      [ref5]: https://wetten.overheid.nl/BWBR0002093#Artikel49
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46ba
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 46e
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 47a
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0002093
        artikel: '49'
        paragraaf: '4'
  - number: '57.3'
    text: |-
      Het hof van discipline kan de deken en de deken van de algemene raad, voor zover deze klager zijn of het hoger
      beroep hebben ingesteld, de vooronderzoeker als bedoeld in [artikel 46l][ref1], alsmede de raad van discipline die
      de beslissing heeft genomen waartegen het hoger beroep zich richt, uitnodigen nadere inlichtingen te verschaffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46l
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46l
        paragraaf: '4'
  - number: '57.4'
    text: |-
      Het hof van discipline onderzoekt op grondslag van de beslissing van de raad van discipline. Het hof kan mede
      oordelen over feiten die de raad van discipline niet voor een maatregel vatbaar heeft geacht, en kan door de raad
      van discipline onbewezen geachte feiten onderzoeken.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel57
  - number: 57a
    text: |-
      Indien het hof van discipline bij oplegging van de maatregel van schorsing beslist dat deze, overeenkomstig het in
      [artikel 48a][ref1] bepaalde, geheel of gedeeltelijk niet ten uitvoer zal worden gelegd, wordt de beslissing over
      de tenuitvoerlegging overgelaten aan de raad van discipline die in eerste aanleg over de klacht heeft geoordeeld.
      De [artikelen 48b tot en met 48g][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48a
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 48b
        paragraaf: '4'
  - number: '58'
    text: 'De griffier van het hof van discipline zendt van de beslissing bij aangetekende brief onverwijld afschrift:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel58
  - number: 58.a
    text: aan de betrokken advocaat;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel58
  - number: 58.b
    text: aan de deken van de algemene raad;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel58
  - number: 58.c
    text: aan de raad van discipline die de zaak in eerste aanleg heeft behandeld;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel58
  - number: 58.d
    text: aan de deken van de orde waartoe de betrokken advocaat behoort;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel58
  - number: 58.e
    text: aan het college van toezicht;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel58
  - number: 58.f
    text: |-
      indien de beslissing in eerste aanleg werd gegeven krachtens een verwijzing als bedoeld in
      [artikel 46aa, derde lid][ref1], of een aanwijzing als bedoeld in artikel 46aa, vijfde lid, aan de voorzitter van
      de raad van discipline, waartoe de betrokken advocaat behoort;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46aa
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46aa
        paragraaf: '4'
  - number: 58.g
    text: |-
      indien aan de betrokken advocaat die is ingeschreven bij de raad voor rechtsbijstand, een maatregel als bedoeld in
      [artikel 48, tweede lid][ref1], is opgelegd dan wel het hof van discipline toezending nodig acht, aan het bestuur
      van de raad voor rechtsbijstand;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 58.h
    text: aan de klager.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel58
  - number: '59.1'
    text: |-
      De maatregelen van schorsing in de uitoefening van de praktijk en van schrapping van het tableau worden, zodra
      de beslissing in kracht van gewijsde is gegaan, door de griffier van de raad van discipline medegedeeld aan de
      secretaris van de algemene raad met het oog op de verwerking op het tableau.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel59
  - number: '59.2'
    text: |-
      De deken van de orde waartoe de betrokken advocaat behoort dan wel, indien de betrokken advocaat de deken is, het
      in [artikel 23, eerste lid][ref1], bedoelde lid van de raad van de orde draagt zorg voor de openbaarmaking als
      bedoeld in [artikel 48, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '23'
        paragraaf: Afdeling_1
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: '59.3'
    text: |-
      In geval van toepassing van de [artikelen 48a tot en met 48g][ref1] geschieden de mededeling, bedoeld in het eerste
      lid, en de openbaarmaking, bedoeld in het tweede lid, niet dan nadat last tot tenuitvoerlegging van de beslissing
      of het betrokken deel daarvan is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48a
        paragraaf: '4'
  - number: '60.1'
    text: |-
      Bij ministeriële regeling aangewezen kosten die verbonden zijn aan het lidmaatschap van de door Ons benoemde leden
      en plaatsvervangende leden komen ten laste van de staat.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60
  - number: '60.2'
    text: |-
      De leden-advocaten en plaatsvervangende leden-advocaten en de griffier ontvangen vergoeding van reis- en
      verblijfkosten en verdere verschotten van de Nederlandse orde van advocaten. De griffier ontvangt bovendien een
      vergoeding van de Nederlandse orde van advocaten, waarvan het bedrag wordt vastgesteld door de algemene raad.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60
  - number: '60.3'
    text: De overige kosten van het hof van discipline komen ten laste van de Nederlandse orde van advocaten.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60
  - number: 60a
    text: |-
      De voorgaande bepalingen van deze paragraaf, met uitzondering van [artikel 46fa][ref1], zijn eveneens van
      toepassing op bezoekende advocaten als bedoeld in [artikel 16b][ref2], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46fa
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel16b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46fa
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 16b
        afdeling: 2a
  - number: 60a.1
    text: |-
      in afwijking van [artikel 46][ref1] de tuchtrechtspraak in eerste aanleg wordt uitgeoefend door de raad van
      discipline die bevoegd is ten aanzien van de samenwerkende advocaat en bij gebreke van dien door de raad van
      discipline in het ressort Den Haag;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '46'
        paragraaf: '4'
  - number: 60a.2
    text: |-
      in afwijking van [artikel 48, tweede lid][ref1], als maatregelen kunnen worden opgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 60a.2.a
    text: enkele waarschuwing;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60a
  - number: 60a.2.b
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60a
  - number: 60a.2.c
    text: een geldboete;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60a
  - number: 60a.2.d
    text: |-
      schorsing gedurende ten hoogste één jaar in de bevoegdheid in Nederland de in [artikel 16b][ref1] bedoelde
      werkzaamheden uit te oefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60a
    references:
