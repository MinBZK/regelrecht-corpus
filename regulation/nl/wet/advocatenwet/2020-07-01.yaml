    text: |-
      [artikel 8, eerste lid, onder l][ref1], voor zover het betreft een onherroepelijke beslissing met betrekking tot
      een schorsing of het treffen van een voorziening en voor zolang de opgelegde schorsing of getroffen voorziening van
      kracht is; en


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel8
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8a
    references:
