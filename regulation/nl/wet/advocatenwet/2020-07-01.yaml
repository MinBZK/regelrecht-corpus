        artikel: 16b
        afdeling: 2a
  - number: 60a.2.e
    text: |-
      ontzegging van de bevoegdheid in Nederland de in [artikel 16b][ref1] bedoelde werkzaamheden uit te oefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16b
        afdeling: 2a
  - number: 60a.3
    text: |-
      het in [artikel 48, vijfde lid][ref1], bepaalde omtrent openbaarmaking mede van toepassing is op de in het vorige
      lid onder b tot en met e genoemde straffen;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 60a.4
    text: |-
      aan de bevoegde autoriteit van de staat van herkomst van de betrokken advocaat mededelingen kunnen worden gevraagd
      van de nodige gegevens over diens beroepsuitoefening en kennis zal worden gegeven van iedere genomen beslissing,
      een en ander onverminderd het vertrouwelijke karakter van die inlichtingen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60a
  - number: 60aa.1
    text: |-
      De [artikelen 46 tot en met 46f][ref1], [46fb tot en met 60][ref2] alsmede de [artikelen 60b tot en met 60g][ref3]
      zijn van overeenkomstige toepassing op de advocaten die hun werkzaamheden uitoefenen onder hun oorspronkelijke
      beroepstitel als bedoeld in [artikel 16h][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel46g
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '46'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 46g
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4b
      - id: ref4
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
  - number: 60aa.2
    text: |-
      In afwijking van [artikel 48, tweede lid, onderdeel d][ref1], kan als maatregel worden opgelegd de schorsing
      gedurende ten hoogste één jaar in de bevoegdheid om in Nederland de in [artikel 16h][ref2] bedoelde werkzaamheden
      uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
  - number: 60aa.3
    text: |-
      Het in [artikel 48, vijfde lid][ref1], bepaalde omtrent openbaarmaking is mede van toepassing op de in het tweede
      lid genoemde maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 60aa.4
    text: |-
      De bevoegde autoriteit van de staat van herkomst wordt in de gevallen, bedoeld in de
      [artikelen 46h, vierde lid][ref1], [48f][ref2], [49][ref3], [56, vijfde lid][ref4], [57, eerste lid][ref5],
      [60b, eerste en zevende lid][ref6] en [60c, derde en vierde lid][ref7] in de gelegenheid gesteld haar mening
      kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46h
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48f
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel56
      [ref5]: https://wetten.overheid.nl/BWBR0002093#Artikel57
      [ref6]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
      [ref7]: https://wetten.overheid.nl/BWBR0002093#Artikel60c
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46h
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 48f
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: '49'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0002093
        artikel: '56'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0002093
        artikel: '57'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4b
      - id: ref7
        bwb_id: BWBR0002093
        artikel: 60c
        paragraaf: 4b
  - number: 60aa.5
    text: |-
      Indien de bevoegde autoriteit van de lidstaat van herkomst of de tuchtrechter aldaar de uitoefening van het
      beroep advocaat tijdelijk of blijvend heeft ontzegd is de betrokken advocaat van rechtswege niet meer bevoegd om
      in Nederland zijn beroep onder zijn oorspronkelijke beroepstitel uit te oefenen. De secretaris van de algemene
      raad haalt alsdan de inschrijving van de advocaat tijdelijk onderscheidenlijk blijvend door. De secretaris van de
      algemene raad stelt de bevoegde autoriteit van de staat van herkomst in kennis van de doorhaling.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60aa
  - number: 60aa.6
    text: |-
      Alvorens jegens de onder zijn oorspronkelijke beroepstitel werkzame advocaat een tuchtrechtelijke procedure in te
      stellen dan wel een procedure inzake de onbehoorlijke praktijkuitoefening aan te vangen, stelt de raad van de orde
      in het arrondissement waar deze advocaat kantoor houdt de bevoegde autoriteit van de staat van herkomst van die
      advocaat daarvan onverwijld in kennis en verstrekt zij deze alle dienstige inlichtingen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60aa
  - number: 60aa.7
    text: |-
      Gedurende de procedure werkt de raad van de orde met de bevoegde autoriteit van de staat van herkomst samen. Het
      [vierde lid van artikel 60a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60a
        paragraaf: '4'
  - number: 60ab.1
    text: |-
      Op verzoek van de deken van de orde waartoe de advocaat behoort, kan de raad van discipline de advocaat jegens
      wie een ernstig vermoeden is gerezen van een handelen of nalaten waardoor enig door [artikel 46][ref1] beschermd
      belang ernstig is geschaad of dreigt te worden geschaad, met onmiddellijke ingang schorsen in de uitoefening van de
      praktijk of een voorlopige voorziening met betrekking tot de praktijkuitoefening van de betrokken advocaat treffen,
      indien het door artikel 46 beschermde belang dit vergt. Hij beslist niet dan na verhoor of behoorlijke oproeping
      van de advocaat en de deken van de orde waartoe de advocaat behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60ab
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '46'
        paragraaf: '4'
  - number: 60ab.2
    text: |-
      Een verzoek als bedoeld in het eerste lid kan ook worden ingediend ingeval een advocaat zich in voorlopige
      hechtenis bevindt of deze bij nog niet onherroepelijk of onherroepelijk geworden rechterlijke uitspraak wegens een
      misdrijf is veroordeeld dan wel hem bij een dergelijke uitspraak een maatregel is opgelegd die vrijheidsbeneming
      tot gevolg heeft, met dien verstande dat alleen een schorsing kan worden uitgesproken voor de duur van de
      vrijheidsbeneming. De griffier van het gerecht dat een van de in de eerste volzin genoemde beslissingen neemt,
      geeft van die beslissing kennis aan de deken van de orde in het arrondissement waartoe de advocaat behoort. Het
      vijfde lid is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60ab
  - number: 60ab.3
    text: |-
      De deken stelt de betrokken advocaat schriftelijk op de hoogte van het in het eerste en tweede lid bedoelde
      verzoek, alsmede van de gronden waarop het verzoek rust.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60ab
  - number: 60ab.4
    text: |-
      De raad van discipline beslist binnen veertien dagen nadat het verzoek overeenkomstig het eerste of tweede lid aan
      hem ter kennis is gebracht. De raad van discipline kan deze termijn ten hoogste eenmaal verlengen met eenzelfde
      termijn.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60ab
  - number: 60ab.5
    text: |-
      Indien de klacht of het bezwaar tegen de advocaat op grond waarvan het ernstige vermoeden is gerezen niet reeds
      schriftelijk ter kennis is gebracht van de raad van discipline, bepaalt de raad van discipline bij zijn beslissing
      op het in het eerste lid bedoelde verzoek tevens een redelijke termijn van niet langer dan zes weken, waarbinnen
      de deken de klacht of het bezwaar schriftelijk ter kennis van de raad van discipline brengt. Bij overschrijding
      van deze termijn vervalt de beslissing op het in het eerste lid bedoelde verzoek van rechtswege. De raad van
      discipline kan op schriftelijk verzoek van de deken de termijn ten hoogste eenmaal verlengen met een door hem te
      bepalen redelijke termijn van niet langer dan zes weken. [Paragraaf 4][ref1] is van overeenkomstige toepassing, met
      uitzondering van de [artikelen 46c, eerste lid][ref2], [46i tot en met 46k][ref3] en [46n][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Paragraaf4
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel46i
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel46n
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60ab
    references:
      - id: ref1
        bwb_id: BWBR0002093
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 46i
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0002093
        artikel: 46n
        paragraaf: '4'
  - number: 60ab.6
    text: |-
      Op verzoek van de betrokken advocaat kan de raad van discipline te allen tijde de op grond van het eerste lid
      opgelegde schorsing of voorlopige voorziening opheffen. Hij beslist niet dan na verhoor of behoorlijke oproeping
      van de advocaat en de deken.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60ab
  - number: 60ac.1
    text: |-
      De maatregel van schorsing in de uitoefening van de praktijk wordt door de griffier van de raad van discipline
      medegedeeld aan de secretaris van de algemene raad met het oog op de verwerking op het tableau.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60ac
  - number: 60ac.2
    text: De geschorste advocaat mag gedurende de schorsing de titel van advocaat niet voeren.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60ac
  - number: 60ac.3
    text: |-
      Schorsing in de uitoefening van de praktijk brengt mede verlies voor de duur van de schorsing van de betrekkingen,
      waarbij de hoedanigheid van advocaat vereiste voor verkiesbaarheid of benoembaarheid is.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60ac
  - number: 60ad.1
    text: |-
      Tegen een beslissing op grond van [artikel 60ab, eerste, tweede en zesde lid][ref1], kunnen de betrokken advocaat,
      de deken van de orde waartoe de advocaat behoort en de deken van de algemene raad binnen dertig dagen na verzending
      van een afschrift van de beslissing hoger beroep instellen bij het hof van discipline.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60ab
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60ad
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60ab
        paragraaf: 4a
  - number: 60ad.2
    text: Het hoger beroep schorst niet de werking van de beslissing waartegen het is gericht.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60ad
  - number: 60ae
    text: |-
      Zodra de beslissing van de raad van discipline op een door de deken ter kennis van de raad gebrachte klacht of
      bezwaar als bedoeld in [artikel 60ab, vijfde lid][ref1], in kracht van gewijsde is gegaan, vervalt de op grond van
      [artikel 60ab, eerste of tweede lid][ref2], opgelegde schorsing of voorlopige voorziening van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60ab
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel60ab
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60ae
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60ab
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 60ab
        paragraaf: 4a
  - number: 60af.1
    text: |-
      Deze paragraaf is van overeenkomstige toepassing op bezoekende advocaten als bedoeld in [artikel 16b][ref1],
      en op de advocaten die hun werkzaamheden uitoefenen onder hun oorspronkelijke beroepstitel als bedoeld in
      [artikel 16h][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60af
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16b
        afdeling: 2a
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
  - number: 60af.2
    text: |-
      Indien de advocaat jegens wie het voornemen bestaat hem te schorsen in de uitoefening van de praktijk of een
      voorlopige voorziening te treffen op grond van [artikel 60ab, eerste en tweede lid][ref1], zich krachtens het
      nationale recht van een andere lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte dat uitvoering geeft aan artikel 3 van [richtlijn 98/5/EG](31998L0005)
      van het Europees Parlement en de Raad van de Europese Unie van 16 februari 1998 ter vergemakkelijking van de
      permanente uitoefening van het beroep van advocaat in een andere lidstaat dan die waar de beroepskwalificatie
      is verworven, heeft laten inschrijven, stelt de raad van de orde voor de aanvang van de procedure de bevoegde
      autoriteit in die lidstaat of lidstaten van dit voornemen op de hoogte en verstrekt hij aan die autoriteit of
      autoriteiten alle dienstige inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60ab
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60af
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60ab
        paragraaf: 4a
  - number: 60af.3
    text: |-
      Indien de advocaat zich in Zwitserland heeft laten inschrijven met inachtneming van de op 21 juni 1999 tot
      stand gekomen Overeenkomst tussen de Europese Gemeenschap en haar lidstaten enerzijds en de Zwitserse Bondsstaat
      anderzijds, over het vrije verkeer van personen, is het tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60af
  - number: 60af.4
    text: |-
      De bevoegde autoriteit van de staat van herkomst van de betrokken advocaat wordt in de gevallen, bedoeld in
      [artikel 60ab, eerste, tweede en zesde lid][ref1], in de gelegenheid gesteld haar mening kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60ab
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60af
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60ab
        paragraaf: 4a
  - number: 60af.5
    text: |-
      Aan de bevoegde autoriteit van de staat van herkomst van de betrokken advocaat kunnen mededelingen worden gevraagd
      van de nodige gegevens over diens beroepsuitoefening en wordt kennis gegeven van iedere genomen beslissing, een en
      ander onverminderd het vertrouwelijke karakter van die inlichtingen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60af
  - number: 60b.1
    text: |-
      De raad van discipline kan, al dan niet nadat een onderzoek overeenkomstig de [artikelen 60c tot en met 60g][ref1]
      heeft plaatsgevonden, op verzoek van de deken van de orde waartoe de advocaat behoort een advocaat die tijdelijk
      of blijvend geen blijk geeft zijn praktijk behoorlijk uit te kunnen oefenen, voor onbepaalde tijd in de uitoefening
      van de praktijk schorsen dan wel een of meer voorzieningen met betrekking tot de praktijkuitoefening van de
      betrokken advocaat treffen die hij geboden acht. De raad van discipline kan tegelijkertijd met het opleggen van
      een schorsing een voorziening treffen. Hij beslist niet dan na verhoor of behoorlijke oproeping van de deken van de
      orde waartoe de advocaat behoort en de betrokken advocaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60c
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60c
        paragraaf: 4b
  - number: 60b.2
    text: |-
      Op de behandeling van de zaak zijn de [artikelen 47][ref1] en [49, tweede tot en met tiende lid][ref2], van
      overeenkomstige toepassing. De behandeling geschiedt met gesloten deuren, tenzij de betrokken advocaat behandeling
      in een openbare zitting wenst.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel49
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '47'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '49'
        paragraaf: '4'
  - number: 60b.3
    text: |-
      Op de verzending van een afschrift van de beslissingen van de raad van discipline, bedoeld in het eerste lid, is
      [artikel 50][ref1] van overeenkomstige toepassing. Bovendien zendt de griffier van de raad van discipline bij
      aangetekende brief onverwijld afschrift van de beslissing inzake de schorsing van de betrokken advocaat, bedoeld
      in het eerste lid, aan de secretaris van de algemene raad met het oog op de verwerking op het tableau, en indien de
      betrokken advocaat is ingeschreven bij de raad voor rechtsbijstand, aan het bestuur van de raad.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel50
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '50'
        paragraaf: '4'
  - number: 60b.4
    text: |-
      Zowel de advocaat als degene die het in het eerste lid bedoelde verzoek heeft gedaan kan gedurende dertig dagen
      na verzending van een afschrift van de beslissing tegen de beslissing, bedoeld in het eerste lid, hoger beroep
      instellen bij het hof van discipline. De tweede zin van het tweede lid is van toepassing. Op de behandeling
      van de zaak zijn de [artikelen 55][ref1], [56, tweede, derde, vierde en zesde lid][ref2] van toepassing.
      [Artikel 57][ref3] met uitzondering van de verwijzing in het tweede lid naar [artikel 47a][ref4] en het
      [eerste lid van artikel 48][ref5] en met uitzondering van het vijfde lid is van overeenkomstige toepassing.
      [Artikel 58, eerste lid, onder a tot en met g][ref6], is van toepassing met dien verstande dat de griffier van
      het hof van discipline aan het bestuur van de raad voor rechtsbijstand bij welke de advocaat is ingeschreven
      uitsluitend een afschrift van de beslissing inzake de schorsing zendt. Met het oog op de verwerking op het
      tableau ontvangt de secretaris van de algemene raad eveneens een afschrift van de beslissing van het hof inzake
      de schorsing van de betrokken advocaat. Het hoger beroep schorst niet de werking van de beslissing waartegen het
      is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel47a
      [ref5]: https://wetten.overheid.nl/BWBR0002093#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0002093#Artikel58
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '55'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '56'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: '57'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0002093
        artikel: 47a
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0002093
        artikel: '58'
        paragraaf: '4'
  - number: 60b.5
    text: |-
      De geschorste advocaat mag gedurende de schorsing de titel van advocaat niet voeren. Het
      [achtste lid van artikel 48][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 60b.6
    text: |-
      Met betrekking tot het toezien op de naleving van de voorzieningen als bedoeld in het eerste lid is
      [artikel 48c][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48c
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48c
        paragraaf: '4'
  - number: 60b.7
    text: |-
      Op verzoek van de advocaat kan de raad van discipline te allen tijde de schorsing of de getroffen voorzieningen
      opheffen. Hij beslist hierover niet dan na verhoor of behoorlijke oproeping van degene die het in het eerste
      lid bedoelde verzoek heeft gedaan en de betrokken advocaat. Het tweede tot en met het vijfde lid zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60b
  - number: 60b.8
    text: |-
      De [artikelen 60d][ref1] en [60e][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60d
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel60e
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60d
        paragraaf: 4b
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 60e
        paragraaf: 4b
  - number: 60c.1
    text: |-
      De deken kan de voorzitter van de raad van discipline schriftelijk verzoeken tot het instellen van een onderzoek
      naar de toestand waarin de praktijk van een advocaat zich bevindt, indien hij aanwijzingen heeft dat een situatie
      als bedoeld in [artikel 60b, eerste lid][ref1], zich voordoet. Het verzoekschrift bevat de gronden waarop het
      berust.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4b
  - number: 60c.2
    text: |-
      Bevoegd tot het indienen van een verzoekschrift is de deken van de orde waartoe de advocaat behoort. Indien
      de betrokken advocaat de deken is, is het in [artikel 23, eerste lid][ref1], bedoelde lid van de raad van de
      orde bevoegd. Bevoegd tot kennisneming is de voorzitter van de raad van discipline binnen wiens ressort de
      betrokken advocaat kantoor houdt. De voorzitter kan zich bij de uitoefening van zijn bevoegdheid door één van de
      plaatsvervangende voorzitters doen vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel23
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '23'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 60c.3
    text: |-
      De voorzitter beslist op het verzoek als bedoeld in het eerste lid zo spoedig mogelijk na verhoor of behoorlijke
      oproeping van de deken en de betrokken advocaat. De behandeling geschiedt ter zitting met gesloten deuren, tenzij
      de betrokken advocaat behandeling in een openbare zitting wenst.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60c
  - number: 60c.4
    text: |-
      Tegen de beslissing, bedoeld in het derde lid, kunnen de betrokken advocaat en de deken binnen veertien dagen
      na verzending van een afschrift van de beslissing verzet doen bij de raad van discipline. Het derde lid is van
      overeenkomstige toepassing. Het verzet schorst niet de werking van de beslissing waartegen het is gericht.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60c
  - number: 60d.1
    text: |-
      Bij het instellen van een onderzoek als bedoeld in [artikel 60c, eerste lid][ref1] benoemt de voorzitter
      van de raad van discipline één of meer rapporteurs onder vaststelling van een termijn van ten hoogste
      zes weken waarbinnen aan hem verslag moet worden uitgebracht over de toestand waarin de praktijk van de
      betrokken advocaat zich bevindt. De voorzitter kan deze termijn op verzoek van de rapporteur of rapporteurs
      één maal met ten hoogste zes weken verlengen. Ten behoeve van het verrichten van het onderzoek door de
      rapporteur zijn de advocaat, zijn medewerkers en personeel, alsmede andere personen die betrokken zijn bij de
      beroepsuitoefening, niet gehouden aan de geheimhoudingsplicht, bedoeld in [artikel 11a][ref2]. In dat geval
      geldt voor de betrokken rapporteur een geheimhoudingsplicht, gelijk aan die bedoeld in artikel 11a, en is
      [artikel 218 van het Wetboek van Strafvordering][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60c
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel11a
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel218
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60d
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60c
        paragraaf: 4b
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 11a
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '218'
  - number: 60d.2
    text: |-
      De voorzitter bepaalt bij de beslissing, bedoeld in het eerste lid, de grondslag voor de vergoeding van de door
      hem benoemde rapporteur of rapporteurs en stelt het bedrag vast dat het onderzoek ten hoogste mag kosten. Hij kan
      hangende het onderzoek dit bedrag op verzoek van de rapporteur of rapporteurs verhogen. De voorzitter kan voorts
      bepalen dat de betrokken advocaat voor de betaling van de kosten zekerheid stelt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60d
  - number: 60d.3
    text: |-
      De raad van discipline stelt met inachtneming van het tweede lid, het bedrag vast dat overeenkomstig het vierde lid
      moet worden vergoed.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60d
  - number: 60d.4
    text: |-
      De betrokken advocaat draagt de kosten van het onderzoek, tenzij de raad van discipline naar aanleiding van
      de resultaten van het verslag de betrokken advocaat niet schorst dan wel geen voorziening treft als bedoeld in
      [artikel 60b, eerste lid][ref1] of de betrokken advocaat niet of slechts gedeeltelijk in staat is deze kosten te
      dragen. In het laatste geval draagt de advocaat een gedeelte van de kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60d
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4b
  - number: 60d.5
    text: |-
      In afwijking van het vierde lid kan de raad van discipline, indien het daartoe gegronde redenen aanwezig acht,
      bepalen dat de betrokken advocaat de kosten van het onderzoek geheel of gedeeltelijk draagt, ook wanneer de raad
      naar aanleiding van de resultaten van het verslag niet beslist tot schorsing of het treffen van een voorziening als
      bedoeld in [artikel 60b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60d
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4b
  - number: 60d.6
    text: |-
      De kosten van het onderzoek die niet door de advocaat worden gedragen, worden vergoed door de orde in het
      arrondissement waarin de advocaat kantoor houdt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60d
  - number: 60d.7
    text: |-
      Indien het hof van discipline in hoger beroep beslist dat er geen grond is voor het opleggen van een schorsing of
      het treffen van een voorziening, kan het hof van discipline tevens bepalen dat een geheel of gedeelte van de kosten
      van het onderzoek wordt gedragen door de orde in het arrondissement waarin de advocaat kantoor houdt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60d
  - number: 60e.1
    text: |-
      De rapporteur alsmede de door hem aangewezen personen die hem vergezellen, is bevoegd elke plaats te betreden
      waarin de praktijk van de betrokken advocaat wordt uitgeoefend en zij zijn gerechtigd tot inzage van de dossiers,
      boeken, bescheiden en andere gegevensdragers betrekking hebbende op de praktijk van de advocaat waarvan de
      rapporteur de kennisneming in verband met een juiste vervulling van zijn taak nodig acht met inbegrip van die van
      het samenwerkingsverband waarbinnen de advocaat zijn praktijk uitoefent. De rapporteur kan de hulp van de sterke
      arm inroepen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60e
  - number: 60e.2
    text: |-
      De betrokken advocaat en de advocaten met wie hij een samenwerkingsverband vormt, degenen die in dienst van
      de advocaat of het samenwerkingsverband zijn alsmede de werkgever van de betrokken advocaat zijn verplicht
      alle gevraagde inlichtingen te verschaffen die de rapporteur nodig oordeelt voor zijn onderzoek en inzage te
      verschaffen in de in het eerste lid bedoelde gegevensdragers. Indien het onderzoek – mede – betrekking heeft op een
      rechtspersoon, berust op de bestuurders en commissarissen van die rechtspersoon eenzelfde verplichting.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60e
  - number: 60e.3
    text: |-
      Op de advocaten met wie de betrokken advocaat een samenwerkingsverband vormt zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60e
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: 60f.1
    text: |-
      Tijdens het onderzoek kan de voorzitter van de raad van discipline op verzoek van de rapporteur of de rapporteurs
      voor ten hoogste de duur van het onderzoek een voorlopige voorziening treffen indien het belang van het onderzoek
      dit eist.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60f
  - number: 60f.2
    text: |-
      Tijdens het onderzoek kan de voorzitter van de raad van discipline op verzoek van de deken of de
      rapporteur of de rapporteurs een voorlopige voorziening treffen indien hij dit in verband met de toestand
      van de praktijk noodzakelijk acht. Deze voorziening blijft gelden totdat een beslissing als bedoeld in
      [artikel 60b, eerste lid][ref1], is genomen of de voorzitter van de raad de voorlopige voorziening opheft op de
      grond dat deze niet langer noodzakelijk is in verband met de toestand van de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60f
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4b
  - number: 60f.3
    text: |-
      Tegen een beslissing als bedoeld in het eerste en tweede lid kunnen de betrokken advocaat en de deken binnen
      veertien dagen na verzending van een afschrift van de beslissing verzet doen bij de raad van discipline.
      [Artikel 60c, derde lid, tweede volzin][ref1], is van overeenkomstige toepassing. Het verzet schorst niet de
      werking van de beslissing waartegen het is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60c
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60f
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60c
        paragraaf: 4b
  - number: 60g.1
    text: |-
      De rapporteur zendt zijn verslag, dat een met redenen omkleed oordeel over de toestand van de praktijk van de
      betrokken advocaat en desgewenst een of meer aanbevelingen bevat, aan de voorzitter van de raad. De griffier van de
      raad doet onverwijld aan de betrokken advocaat alsmede aan de deken een afschrift van het verslag toekomen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60g
  - number: 60g.2
    text: |-
      Behalve door de betrokken advocaat en door de deken aan de raad van de orde waarvan hij deel uitmaakt, mag zonder
      toestemming van de voorzitter van de raad van discipline uit het verslag geen mededeling aan derden worden gedaan.
      De rapporteur en degenen die de rapporteur bij het onderzoek heeft betrokken maken hetgeen hun bij het onderzoek
      blijkt, niet verder bekend dan de opdracht met zich brengt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60g
  - number: 60g.3
    text: |-
      De raad van discipline neemt een beslissing als bedoeld in [artikel 60b, eerste lid][ref1], binnen vier weken na de
      ontvangst van het verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60g
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4b
  - number: 60g.4
    text: |-
      Onverminderd de bevoegdheid van de voorzitter van de raad een voorlopige voorziening als bedoeld in
      [artikel 60f, tweede lid][ref1], eerder op te heffen, is een dergelijke voorziening van rechtswege opgeheven met
      ingang van de eerste dag na ommekomst van de in het derde lid van dit artikel genoemde termijn indien de raad een
      beslissing als bedoeld in [artikel 60b, eerste lid][ref2], niet heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60f
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60g
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60f
        paragraaf: 4b
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4b
  - number: 60h.1
    text: |-
      Indien de advocaat jegens wie het voornemen bestaat een procedure inzake de onbehoorlijke praktijkuitoefening aan
      te vangen, zich krachtens het nationale recht van een andere lidstaat van de Europese Unie of een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte dat uitvoering geeft aan artikel 3 van
      [richtlijn 98/5/EG](31998L0005) van het Europees Parlement en de Raad van de Europese Unie van 16 februari 1998 ter
      vergemakkelijking van de permanente uitoefening van het beroep van advocaat, heeft laten inschrijven, stelt de raad
      van de orde voor de aanvang van de procedure de bevoegde autoriteit in die lidstaat of lidstaten van dit voornemen
      op de hoogte en verstrekt hij aan die autoriteit of autoriteiten alle dienstige inlichtingen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60h
  - number: 60h.2
    text: |-
      Indien de advocaat zich in Zwitserland heeft laten inschrijven met inachtneming van de op 21 juni 1999 tot
      stand gekomen Overeenkomst tussen de Europese Gemeenschap en haar lidstaten enerzijds en de Zwitserse Bondsstaat
      anderzijds, over het vrije verkeer van personen, is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel60h
  - number: '70'
    text: Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot het ambtskostuum van de advocaten.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel70
  - number: '71'
    text: 'Deze wet wordt aangehaald als: Advocatenwet.'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel71
