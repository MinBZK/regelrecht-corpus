      onvoorwaardelijk opleggen van een maatregel als bedoeld in [artikel 48, tweede lid, onder d of e][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8a
