preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Nederlandse orde van advocaten in te stellen,
    alsmede de regelen betreffende de orde en discipline voor de advocaten en procureurs te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: De advocaten worden ingeschreven op het tableau van de Nederlandse orde van advocaten.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel1
  - number: '1.2'
    text: De inschrijving als advocaat geschiedt onvoorwaardelijk.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel1
  - number: '1.3'
    text: |-
      In afwijking van het bepaalde in het tweede lid geschiedt de inschrijving voorwaardelijk indien de verzoeker
      niet in het bezit is van een verklaring als bedoeld in [artikel 9b, vijfde lid][ref1], of niet beschikt
      over een ten aanzien van het beroep van advocaat afgegeven erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref2] of over een document als bedoeld in
      [artikel 2a, eerste lid][ref3]. Wordt een verklaring of erkenning als bedoeld in de eerste volzin nadien alsnog
      overlegd, dan wordt van rechtswege het voorwaardelijk karakter aan de inschrijving ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 9b
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 2a
        afdeling: '1'
  - number: '2.1'
    text: 'Bevoegd om te verzoeken om inschrijving als advocaat is een ieder:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2
  - number: 2.1.a
    text: |-
      aan wie op grond van het met goed gevolg afleggen van een afsluitend examen van een opleiding in het
      wetenschappelijk onderwijs op het gebied van het recht door een universiteit dan wel de Open Universiteit als
      bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], de graad Bachelor op het gebied van
      het recht en tevens de graad Master op het gebied van het recht is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 2.1.b
    text: |-
      die op grond van het met goed gevolg afleggen van het afsluitend examen van een opleiding op
      het gebied van het recht aan een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], het doctoraat in de rechtsgeleerdheid of het
      recht om de titel meester te voeren heeft verkregen;


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 2.1.c
    text: |-
      die beschikt over een ten aanzien van het beroep van advocaat afgegeven erkenning van beroepskwalificaties als
      bedoeld in [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
  - number: '2.2'
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de beroepsvereisten.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2
  - number: '2.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen graden, verleend door een universiteit, de Open Universiteit of
      een hogeschool als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het eerste lid, onderdeel a,
      gelijk worden gesteld aan de in dat onderdeel bedoelde graad Bachelor op het gebied van het recht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '2.4'
    text: |-
      Eveneens is bevoegd inschrijving te verzoeken degene die in een andere lidstaat van de Europese Unie, of in een
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of in Zwitserland met
      goed gevolg het afsluitend examen van een opleiding op het gebied van het recht aan een universiteit of daaraan
      gelijkwaardige opleiding heeft afgelegd. In dat geval onderzoekt de algemene raad in hoeverre het afsluitend
      examen en de in deze andere lidstaat door de verzoeker verworven beroepservaring gelijkwaardig zijn aan de
      ingevolge het tweede lid gestelde beroepsvereisten. Indien blijkt dat het afsluitend examen en de beroepservaring
      niet gelijkwaardig zijn aan de ingevolge het tweede lid gestelde beroepsvereisten, kan de algemene raad eisen
      dat de verzoeker een proeve van bekwaamheid of aanvullende examens aflegt. De algemene raad draagt zorg voor de
      mogelijkheid tot het kunnen afleggen van een proeve van bekwaamheid of het afleggen van aanvullende examens.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2
  - number: '2.5'
    text: |-
      Een verzoek tot inschrijving als advocaat wordt ingediend bij de raad van de orde in het arrondissement waar de
      verzoeker kantoor wenst te houden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2
  - number: '2.6'
    text: |-
      Gelijktijdig met de indiening van het verzoek als bedoeld in het eerste en vierde lid legt de verzoeker over een
      verklaring omtrent het gedrag, afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1]. Indien de
      verzoeker eerder als advocaat ingeschreven is geweest, legt hij tevens over een document dat is afgegeven door de
      raad van de orde van het arrondissement waarin hij het laatst kantoor heeft gehouden, waaruit blijkt of hij al dan
      niet tuchtrechtelijk is veroordeeld dan wel of hij in staat van faillissement heeft verkeerd of ten aanzien van hem
      de schuldsaneringsregeling natuurlijke personen van toepassing is geweest. Het in de vorige zin bedoelde document
      wordt eveneens door de ingeschreven advocaat die in een ander arrondissement kantoor wenst te houden overgelegd aan
      de raad van de orde aldaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: '2.7'
    text: |-
      Tenzij de raad toepassing geeft aan [artikel 4, eerste lid][ref1], zendt hij een afschrift van het verzoek en de
      daarbij overgelegde verklaringen en documenten aan de rechtbank in het arrondissement waarin de verzoeker kantoor
      wenst te houden ten behoeve van de beëdiging van de verzoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel4
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '4'
        afdeling: '1'
  - number: '2.8'
    text: |-
      De advocaat geeft van iedere kantoorverplaatsing kennis aan de secretaris van de algemene raad met het oog op
      de verwerking op het tableau. Vanaf de verwerking van de kennisgeving van een kantoorverplaatsing naar een ander
      arrondissement wordt de advocaat geacht in dit andere arrondissement kantoor te houden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2
  - number: '2.9'
    text: |-
      Indien een beslissing van de raad tot weigering van het in behandeling nemen van de inschrijving als bedoeld in
      [artikel 4, eerste lid][ref1], onherroepelijk is geworden, wordt een nieuw verzoek dat is ingediend binnen een jaar
      na het geweigerde verzoek buiten behandeling gelaten. Indien wijziging in de omstandigheden of het feit dat het
      verzoek wordt ingediend bij een andere raad dit rechtvaardigt, kan de raad in het arrondissement waar de verzoeker
      kantoor wenst te houden beslissen het verzoek tot inschrijving alsnog in behandeling te nemen. In dat geval geeft
      de raad toepassing aan het zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel4
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '4'
        afdeling: '1'
  - number: '2.10'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een verzoek tot inschrijving
      als bedoeld in het eerste of vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 2a.1
    text: |-
      In afwijking van het [eerste lid van artikel 2][ref1] is degene die in een andere lidstaat van de Europese Unie of
      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of in Zwitserland,
      hierna te noemen staat van herkomst, gerechtigd is zijn beroepswerkzaamheid uit te oefenen onder de benaming
      advocaat of een daarmee overeenkomstige benaming in de taal of in de talen van de staat van herkomst, bevoegd te
      verzoeken te worden ingeschreven als advocaat, indien hij een document overlegt waaruit blijkt dat hij gedurende
      ten minste drie jaar daadwerkelijk en regelmatig in Nederland in het Nederlandse recht, met inbegrip van het
      gemeenschapsrecht als advocaat werkzaam is geweest. Onder daadwerkelijk en regelmatig werkzaam wordt verstaan de
      daadwerkelijke uitoefening van de werkzaamheid zonder andere dan de in het dagelijks leven normale onderbrekingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel2
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '2'
        afdeling: '1'
  - number: 2a.2
    text: |-
      De advocaat dient een aanvraag om afgifte van een document als bedoeld in het eerste lid in bij de raad van de orde
      in het arrondissement waarin de advocaat kantoor kan houden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2a
  - number: 2a.3
    text: |-
      De aanvraag omvat ten minste inlichtingen of bescheiden betreffende het aantal en de aard van de door de aanvrager
      behandelde dossiers.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2a
  - number: 2a.4
    text: |-
      De raad kan verifiëren of de uitgeoefende werkzaamheden als regelmatig en daadwerkelijk kunnen worden aangemerkt
      en kan zo nodig de advocaat verzoeken mondeling of schriftelijk aanvullende verduidelijkingen of preciseringen te
      verstrekken met betrekking tot inlichtingen en bescheiden, als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2a
  - number: 2a.5
    text: |-
      In plaats van de verklaring omtrent het gedrag of de andere in [artikel 2, zesde lid][ref1], genoemde documenten
      kan de advocaat, bedoeld in het eerste lid, een met deze verklaring of die documenten overeenkomende documenten,
      afgegeven door het daartoe bevoegde gezag in de staat van herkomst overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel2
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '2'
        afdeling: '1'
  - number: 2b.1
    text: |-
      Indien de advocaat gedurende ten minste drie jaar daadwerkelijk en regelmatig in Nederland als advocaat werkzaam is
      geweest, doch gedurende kortere tijd in het Nederlandse recht, kan de raad van de orde in het arrondissement waarin
      de advocaat kantoor kan houden het document, bedoeld in het [eerste lid van artikel 2a][ref1], afgeven als de
      advocaat voldoende bekwaam is om de werkzaamheden in het Nederlandse recht, met inbegrip van het gemeenschapsrecht
      voort te zetten. Hierbij houdt de raad rekening met:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 2a
        afdeling: '1'
  - number: 2b.1.a
    text: |-
      de periode gedurende welke de betrokken advocaat daadwerkelijk en regelmatig werkzaamheden heeft verricht in
      Nederland,
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2b
  - number: 2b.1.b
    text: de kennis en beroepservaring op het gebied van het Nederlandse recht,
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2b
  - number: 2b.1.c
    text: de deelname aan cursussen of seminars met betrekking tot het Nederlandse recht en
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2b
  - number: 2b.1.d
    text: |-
      de kennis en beroepservaring van alsmede de deelname aan cursussen of seminars over de Nederlandse beroeps- en
      gedragsregels.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2b
  - number: 2b.2
    text: |-
      De beoordeling van de daadwerkelijke en regelmatige werkzaamheden in Nederland alsmede de beoordeling van de
      bekwaamheid van de advocaat om de in Nederland uitgeoefende werkzaamheden voort te zetten, vinden plaats in het
      kader van een onderhoud dat ten doel heeft de daadwerkelijke en regelmatige aard van de uitgeoefende werkzaamheid
      te verifiëren.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2b
  - number: 2c.1
    text: |-
      De advocaat die overeenkomstig [artikel 2a][ref1] is ingeschreven, is bevoegd om naast het voeren van de titel
      advocaat zijn oorspronkelijke beroepstitel in de officiële taal of in een van de officiële talen van de staat van
      herkomst te voeren, indien hij onder die beroepstitel is ingeschreven in de staat van herkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 2a
        afdeling: '1'
  - number: 2c.2
    text: |-
      Indien de bevoegde autoriteit van de lidstaat van herkomst of de tuchtrechter aldaar de uitoefening van het beroep
      advocaat tijdelijk of blijvend heeft ontzegd is de betrokken advocaat van rechtswege niet meer bevoegd om in
      Nederland zijn beroep onder zijn oorspronkelijke beroepstitel uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel2c
  - number: '3.1'
    text: |-
      Na ontvangst van het afschrift van het verzoek en de daarbij overlegde verklaringen en documenten, bedoeld in
      [artikel 2, zesde lid][ref1], worden advocaten op requisitoir van het openbaar ministerie beëdigd door de rechtbank
      in het arrondissement waarin zij kantoor wensen te houden. Van de beëdiging wordt door de griffier van de rechtbank
      kennisgegeven aan de secretaris van de algemene raad met het oog op de verwerking hiervan op het tableau.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel2
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '2'
        afdeling: '1'
  - number: '3.2'
    text: |-
      Zij leggen de navolgende eed of belofte af: "Ik zweer (beloof) getrouwheid aan de Koning, gehoorzaamheid aan de
      [Grondwet][ref1], eerbied voor de rechterlijke autoriteiten, en dat ik geen zaak zal aanraden of verdedigen, die ik
      in gemoede niet gelove rechtvaardig te zijn."


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '3.3'
    text: |-
      Wanneer de eed of belofte, bedoeld in het tweede lid, in de Friese taal wordt afgelegd, luidt de tekst van de
      eed of belofte als volgt: «Ik swar (ûnthjit) trou oan de Kening, it neilibjen fan ’e Grûnwet, earbied foar de
      rjochterlike autoriteiten, en dat ik gjin saak oanrikkemandearje of ferdigenje sil, dêr’t ik ynderlik fan oertsjûge
      bin dat dy net rjochtfeardich is.»
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel3
  - number: '4.1'
    text: |-
      De raad van de orde in het arrondissement waarbij het verzoek, bedoeld in [artikel 2, vijfde lid][ref1], is
      ingediend kan weigeren het verzoek in behandeling te nemen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel2
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '2'
        afdeling: '1'
  - number: 4.1.a
    text: |-
      de verzoeker niet voldoet aan de in de [artikelen 2][ref1] en [2a][ref2] gestelde vereisten voor de inschrijving,
      dan wel indien hij de in deze artikelen bedoelde verklaringen of documenten niet heeft overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 2a
        afdeling: '1'
  - number: 4.1.b
    text: |-
      de gegronde vrees bestaat dat de verzoeker als advocaat inbreuk zal maken op de voor advocaten geldende wetten,
      verordeningen en besluiten of zich anderszins zal schuldig maken aan enig handelen of nalaten dat een behoorlijk
      advocaat niet betaamt; of
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel4
  - number: 4.1.c
    text: |-
      de verzoeker op grond van [artikel 8c, eerste lid, onderdeel c][ref1], van het tableau is geschrapt zonder dat
      alsnog de daar bedoelde verklaring of het bewijs kan worden overgelegd en het verzoek wordt ingediend binnen een
      door de algemene raad nader te bepalen termijn na de schrapping.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel8c
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 8c
        afdeling: '1'
  - number: '4.2'
    text: |-
      Indien het verzoek, bedoeld in [artikel 2, vijfde lid][ref1], is ingediend door een verzoeker die eerder als
      advocaat ingeschreven is geweest, kan de raad het verzoek tevens weigeren in behandeling te nemen indien hij van
      oordeel is dat de verzoeker niet voldoet aan de bij of krachtens verordening gestelde eisen om voor hernieuwde
      inschrijving in aanmerking te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel2
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '2'
        afdeling: '1'
  - number: '4.3'
    text: |-
      Een beslissing tot weigering van het in behandeling nemen van het verzoek wordt genomen binnen zes weken na de
      indiening ervan.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel4
  - number: '4.4'
    text: |-
      De in [artikel 3][ref1] bedoelde beëdiging kan plaatsvinden nadat de raad niet binnen de in het derde lid bedoelde
      termijn heeft besloten tot weigering van het in behandeling nemen van het verzoek, of indien de raad heeft
      verklaard het verzoek in behandeling te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel3
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '3'
        afdeling: '1'
  - number: '4.5'
    text: |-
      Bij of krachtens verordening wordt bepaald in hoeverre na schrapping op grond van
      [artikel 8c, eerste lid, onderdeel c][ref1], nog examen in onderdelen van de opleiding kan worden afgelegd alsmede
      onder welke voorwaarden dit examen kan worden afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel8c
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 8c
        afdeling: '1'
  - number: '5.1'
    text: |-
      De secretaris van de raad maakt de beslissing tot weigering van het in behandeling nemen van het verzoek, bedoeld
      in [artikel 4, eerste lid][ref1], onverwijld bekend aan de verzoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel4
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '4'
        afdeling: '1'
  - number: '5.2'
    text: |-
      De verzoeker kan gedurende zes weken na de bekendmaking beklag doen bij het hof van discipline, bedoeld in
      [artikel 51][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel51
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '51'
        paragraaf: '4'
  - number: '5.3'
    text: |-
      Het beklag wordt gedaan bij verzoekschrift, waarbij een afschrift wordt gevoegd van de beslissing
      waartegen het beklag is gericht. De griffier zendt onverwijld een afschrift van het verzoekschrift aan de
      raad die de beslissing heeft genomen. Op de behandeling van het beklag zijn de [hoofdstukken 6][ref1] en
      [7 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '7'
  - number: '6.1'
    text: |-
      Het hof van discipline beslist niet dan na verhoor of behoorlijke oproeping van de verzoeker en van de raad. Op de
      behandeling van de zaak zijn [artikel 56, zesde lid][ref1], en [artikel 57, tweede lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel57
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '56'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '57'
        paragraaf: '4'
  - number: '6.2'
    text: |-
      De raad kan zich door zijn deken of een zijner leden doen vertegenwoordigen; de verzoeker kan zich door een
      advocaat doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel6
  - number: '7'
    text: De griffier zendt onverwijld afschrift van de beslissing aan de verzoeker en de raad.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel7
  - number: '8.1'
    text: |-
      Met het oog op het in het belang van een goede rechtsbedeling vaststellen van de hoedanigheid van de advocaat
      verwerkt de secretaris van de algemene raad op het tableau van iedere advocaat gegevens met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8
  - number: 8.1.a
    text: de naam;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8
  - number: 8.1.b
    text: de plaats en datum van geboorte;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8
  - number: 8.1.c
    text: de datum van beëdiging;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8
  - number: 8.1.d
    text: het adres waar de advocaat kantoor houdt, alsmede overige contactgegevens en de naam van het kantoor;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8
  - number: 8.1.e
    text: |-
      voor zover van toepassing: de naam van de patroon, het adres waar deze kantoor houdt, alsmede de naam van dat
      kantoor;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8
  - number: 8.1.f
    text: de raad van de orde waartoe de advocaat behoort;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8
  - number: 8.1.g
    text: |-
      voor zover van toepassing: het lidmaatschap van specialisatieverenigingen, de rechtsgebieden waarop de advocaat
      gespecialiseerd is, alsmede de aanduiding dat het een advocaat betreft als bedoeld in [artikel 16h][ref1] dan wel
      een advocaat bij de Hoge Raad betreft als bedoeld in [artikel 9j, eerste lid][ref2];


