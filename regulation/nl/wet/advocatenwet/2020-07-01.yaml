        artikel: 60aa
        paragraaf: '4'
  - number: 8e.1
    text: |-
      De raad van de orde in een arrondissement kan de raad van discipline verzoeken te beslissen dat de advocaat die
      niet duurzaam en stelselmatig het beroep van advocaat uitoefent, van het tableau wordt geschrapt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8e
  - number: 8e.2
    text: |-
      Op de behandeling van het verzoek zijn de [artikelen 47][ref1], [49][ref2] en [50][ref3] van overeenkomstige
      toepassing, met dien verstande dat in de artikelen 49 en 50 voor «de klager» wordt gelezen: de raad van de orde in
      een arrondissement.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel50
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8e
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '47'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '49'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: '50'
        paragraaf: '4'
  - number: 8e.3
    text: |-
      Van de beslissing van de raad van discipline kunnen de betrokken advocaat en de raad van de orde in een
      arrondissement binnen zes weken na de verzending van het in [artikel 50][ref1] bedoelde afschrift beroep instellen
      bij het hof van discipline.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel50
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8e
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '50'
        paragraaf: '4'
  - number: 8e.4
    text: |-
      [Artikel 9, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel9
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8e
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '9'
        afdeling: '1'
  - number: 8f
    text: |-
      Schrapping van het tableau brengt het verlies mee van de betrekkingen, waarbij de hoedanigheid van advocaat is
      vereist voor verkiesbaarheid of benoembaarheid.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel8f
  - number: '9.1'
    text: |-
      De raad van de orde in een arrondissement kan gedurende één jaar nadat een advocaat is beëdigd, beslissen dat hij
      van het tableau zal worden geschrapt, wanneer hetzij de advocaat de raad of het hof van discipline zo onjuiste
      of onvolledige inlichtingen heeft verstrekt, dat hij, ware de juiste toedracht van zaken de raad of het hof van
      discipline bekend geweest, niet tot de beëdiging zou zijn toegelaten, hetzij de advocaat zich in het tijdvak tussen
      het verzoek tot inschrijving en de beëdiging aan een zo ernstige misdraging heeft schuldig gemaakt, dat hem, indien
      hij na de beëdiging zich daaraan zou hebben schuldig gemaakt, de maatregel van schrapping van het tableau zou zijn
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9
  - number: '9.2'
    text: |-
      Op de behandeling van de zaak zijn de [artikelen 47][ref1] en [49, tweede tot en met laatste lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel49
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '47'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '49'
        paragraaf: '4'
  - number: '9.3'
    text: De secretaris van de raad maakt een beschikking als bedoeld in het eerste lid, onverwijld bekend.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9
  - number: '9.4'
    text: |-
      Van een zodanige beslissing kan de betrokken advocaat binnen zes weken na de bekendmaking beroep instellen bij het
      hof van discipline. [Artikel 5, derde lid][ref1], en [artikel 6][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel6
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '5'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '6'
        afdeling: '1'
  - number: '9.5'
    text: |-
      De griffier van het hof van discipline zendt onverwijld afschrift van de beslissing aan de betrokken advocaat en
      aan de raad.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9
  - number: '9.6'
    text: |-
      Zodra de beslissing tot schrapping van het tableau in kracht van gewijsde is gegaan, wordt zij door de secretaris
      van de raad medegedeeld aan de secretaris van de algemene raad met het oog op de verwerking op het tableau.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9
  - number: 9a
    text: |-
      Tot het voeren van de titel van advocaat is uitsluitend gerechtigd degene die als advocaat is ingeschreven op grond
      van [artikel 1, eerste lid][ref1], of [2a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 2a
        afdeling: '1'
  - number: 9aa.1
    text: |-
      Indien de bevoegde autoriteit van de lidstaat van ontvangst of de tuchtrechter aldaar de uitoefening van het beroep
      van de advocaat die zich krachtens het nationale recht van die lidstaat van de Europese Unie of de desbetreffende
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte dat uitvoering geeft aan artikel
      3 van [richtlijn 98/5/EG](31998L0005) van het Europees Parlement en de Raad van de Europese Unie van 16 februari
      1998 ter vergemakkelijking van de permanente uitoefening van het beroep van advocaat, heeft laten inschrijven,
      tijdelijk of blijvend heeft ontzegd, beslist de raad van de orde in het arrondissement waar de betrokken advocaat
      kantoor houdt ambtshalve tot schorsing of schrapping van het tableau, indien er gegronde vrees bestaat dat de
      betrokkene als advocaat inbreuk zal maken op de voor de advocaten geldende wetten verordeningen en besluiten of
      zich anderszins zal schuldig maken aan enig handelen of nalaten dat een behoorlijk advocaat niet betaamt. Het
      besluit treedt in werking zes weken nadat het is bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9aa
  - number: 9aa.2
    text: |-
      De [artikelen 5 tot en met 7][ref1], [8c, zevende lid][ref2], en [8f][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel8c
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel8f
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '5'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 8c
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 8f
        afdeling: '1'
  - number: 9aa.3
    text: |-
      De secretaris van de algemene raad verwerkt de beslissing van de raad op het tableau, nadat deze onherroepelijk
      is geworden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9aa
  - number: 9aa.4
    text: Het beklag schorst de werking van de beschikking van de raad.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9aa
  - number: 9aa.5
    text: Het hof van discipline kan de raad een termijn stellen voor het nemen van een nieuw besluit.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9aa
  - number: 9aa.6
    text: De raad stelt de bevoegde autoriteit van de lidstaat van ontvangst in kennis van de schorsing of schrapping.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9aa
  - number: 9aa.7
    text: |-
      De advocaat draagt op verzoek van de raad zorg voor de beëdigde vertaling van de gegevens en bescheiden die voor
      zijn beslissing nodig zijn. Indien de advocaat weigert aan dit verzoek te voldoen, draagt de raad zorg voor de
      beëdigde vertaling en verhaalt hij de kosten daarvan op de betrokken advocaat.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9aa
  - number: 9aa.8
    text: |-
      Het hof van discipline kan eisen dat de door haar aangewezen stukken worden vertaald door een in Nederland
      toegelaten beëdigd vertaler. De advocaat draagt zorg voor de kosten van de vertaling.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9aa
  - number: 9aa.9
    text: |-
      Indien de advocaat zich in Zwitserland heeft laten inschrijven met inachtneming van de op 21 juni 1999 tot
      stand gekomen Overeenkomst tussen de Europese Gemeenschap en haar lidstaten enerzijds en de Zwitserse Bondsstaat
      anderzijds, over het vrije verkeer van personen, zijn de voorgaande leden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9aa
  - number: 9b.1
    text: |-
      Elke advocaat, met uitzondering van de advocaat die beschikt over een ten aanzien van
      het beroep van advocaat afgegeven erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1] alsmede met uitzondering van de advocaat,
      die overeenkomstig [artikel 2a][ref2] is ingeschreven is verplicht gedurende de eerste drie jaar waarin hij als
      zodanig is ingeschreven als stagiaire de praktijk uit te oefenen onder begeleiding van een andere advocaat - hierna
      te noemen de patroon - en bij deze kantoor te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 2a
        afdeling: '1'
  - number: 9b.2
    text: |-
      Voor stagiaires die in deeltijd werkzaam zijn wordt de duur van de stage naar evenredigheid verlengd. Voorts kan
      de duur van de stage met ten hoogste drie jaar worden verlengd indien de raad van de orde in het arrondissement
      van oordeel is dat de stagiaire nog niet over voldoende praktijkervaring beschikt. De duur van de stage kan door de
      raad, met goedkeuring van de algemene raad, op verzoek van de stagiaire worden verkort.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9b
  - number: 9b.3
    text: |-
      Van de verplichting van de stagiaire bij een patroon kantoor te houden kan de raad vrijstelling
      verlenen, indien naar het oordeel van de raad een behoorlijke praktijkuitoefening, waaronder de
      financiering van de praktijk en de dekking van het risico van de beroepsaansprakelijkheid van de
      stagiaire, overeenkomstig de daaromtrent gestelde voorschriften bij of krachtens deze wet, verzekerd
      is. Is dit naar het oordeel van de raad niet langer het geval, dan kan een verleende vrijstelling worden
      ingetrokken. Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een verzoek om vrijstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 9b.4
    text: |-
      Indien de raad de in het derde lid bedoelde vrijstelling heeft verleend, wijst hij, indien de stagiaire geen
      patroon heeft kunnen vinden die zich met de vereiste begeleiding wil belasten, een advocaat als patroon aan, tenzij
      dit voor de desbetreffende advocaat een onredelijke last zou vormen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9b
  - number: 9b.5
    text: |-
      Van het met gunstig gevolg voltooien van de stage wordt door de raad van de orde in het arrondissement een
      verklaring aan de stagiaire verstrekt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9b
  - number: 9b.6
    text: |-
      Tegen het verlengen van de duur van de stage, het weigeren of intrekken van een vrijstelling op voet van het
      bepaalde in het derde lid, de aanwijzing van een patroon met toepassing van het vierde lid, of de weigering van
      zulk een aanwijzing, dan wel de weigering om een verklaring als bedoeld in het vijfde lid te verstrekken kan een
      belanghebbende administratief beroep instellen bij de algemene raad.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9b
  - number: 9b.7
    text: |-
      Bij of krachtens verordening als bedoeld in [artikel 28][ref1] wordt bepaald wie als patroon kunnen optreden,
      onderscheidenlijk als patroon kunnen worden aangewezen, aan welke verplichtingen de patroon en de stagiaire hebben
      te voldoen, alsmede wanneer en in welke gevallen de tussen hen bestaande verhouding haar begin en einde neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 9c.1
    text: |-
      De Nederlandse orde van advocaten draagt zorg voor een opleiding voor stagiaires en stelt de stagiaire in de
      gelegenheid deze opleiding te volgen die met een examen wordt afgesloten.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9c
  - number: 9c.2
    text: |-
      De volgende onderwerpen, de opleiding als bedoeld in het eerste lid betreffende, worden nader vastgesteld bij
      of krachtens verordening als bedoeld in [artikel 28][ref1], tenzij daarin bij algemene maatregel van bestuur is
      voorzien:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 9c.2.a
    text: de inhoud en de duur van de opleiding;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9c
  - number: 9c.2.b
    text: de omvang van het examen en de wijze waarop het examen wordt afgenomen;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9c
  - number: 9c.2.c
    text: de eisen voor de toelating tot het afleggen van het examen;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9c
  - number: 9c.2.d
    text: de eisen voor het verkrijgen van vrijstelling voor bepaalde onderdelen van het examen;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9c
  - number: 9c.2.e
    text: de aan de stagiaire in rekening te brengen cursus- en examengelden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9c
  - number: 9j.1
    text: |-
      Een advocaat bij de Hoge Raad is een onvoorwaardelijk ingeschreven advocaat als bedoeld in
      [artikel 1, tweede lid][ref1], van wie uit de aantekening op het tableau blijkt dat hij die hoedanigheid heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel1
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9j
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '1'
        afdeling: '1'
  - number: 9j.2
    text: |-
      Aantekening op het tableau vindt plaats door de secretaris van de algemene raad op verzoek van de advocaat, na
      overlegging van een verklaring dat de advocaat voldoet aan de toetredingseisen, bedoeld in het derde lid, onder a.
      De secretaris van de algemene raad doet van iedere aantekening of doorhaling daarvan op het tableau mededeling aan
      de advocaat en de griffier van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9j
  - number: 9j.3
    text: |-
      Het college van afgevaardigden stelt bij of krachtens verordening regels over het verkrijgen, het behouden en het
      verliezen van de hoedanigheid van advocaat bij de Hoge Raad, alsmede de aantekening op het tableau. De verordening
      bevat in elk geval regels over:
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9j
  - number: 9j.3.a
    text: |-
      de aan deze advocaten te stellen eisen van vakbekwaamheid, bestaande uit toetredingseisen en permanente eisen van
      scholing en praktijk, in het bijzonder op het terrein van het procesrecht;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9j
  - number: 9j.3.b
    text: de ontwikkeling van deze eisen, de opleiding en de examinering;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9j
  - number: 9j.3.c
    text: het verkrijgen van een vrijstelling voor bepaalde onderdelen van de opleiding of de examinering;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9j
  - number: 9j.3.d
    text: de advisering over en het houden van toezicht op het gestelde onder b en c; en
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9j
  - number: 9j.3.e
    text: de afgifte van de verklaring dat een advocaat voldoet aan de eisen, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9j
  - number: 9j.4
    text: |-
      Bij of krachtens de verordening kan een onderscheid worden gemaakt in regels als bedoeld in het derde lid die
      gelden voor het optreden bij de Hoge Raad in burgerlijke zaken, strafzaken of belastingzaken.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9j
  - number: 9j.5
    text: De algemene raad draagt zorg voor de uitvoering van de aangelegenheden, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9j
  - number: 9j.6
    text: |-
      De algemene raad kan in uitzonderlijke gevallen desgevraagd vrijstelling verlenen van het vereiste in het eerste
      lid van onvoorwaardelijke inschrijving als advocaat.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9j
  - number: 9j.7
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een verzoek om aantekening op
      het tableau als advocaat bij de Hoge Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9j
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 9j.8
    text: |-
      Tegen een beslissing tot weigering van het verzoek om aantekening op het tableau als advocaat bij de Hoge
      Raad, alsmede tegen een beslissing tot weigering van de vrijstelling als bedoeld in het zesde lid, kan de
      advocaat binnen zes weken na de bekendmaking van de weigering beroep instellen bij het hof van discipline.
      [Artikel 9, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel9
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9j
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '9'
        afdeling: '1'
  - number: 9k.1
    text: |-
      De raad van de orde in het arrondissement waartoe de advocaat behoort kan de raad van discipline verzoeken te
      beslissen dat de aantekening van hoedanigheid van advocaat bij de Hoge Raad wordt doorgehaald indien de advocaat
      niet of niet langer voldoet aan de eisen als bedoeld in [artikel 9j, derde lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel9j
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9k
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 9j
        afdeling: 1a
  - number: 9k.2
    text: |-
      Op de behandeling van het verzoek zijn de [artikelen 47][ref1], [49][ref2] en [50][ref3] van overeenkomstige
      toepassing, met dien verstande dat in de artikelen 49 en 50 voor «de klager» wordt gelezen: de raad van de orde in
      het arrondissement.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel50
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9k
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '47'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '49'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: '50'
        paragraaf: '4'
  - number: 9k.3
    text: |-
      Tegen een beslissing tot doorhaling van de aantekening als bedoeld in het eerste lid kan de advocaat binnen
      zes weken na de verzending van het in [artikel 50][ref1] bedoelde afschrift beroep instellen bij het hof van
      discipline. [Artikel 9, vijfde en zesde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel9
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel9k
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '50'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '9'
        afdeling: '1'
  - number: '10'
    text: |-
      De advocaten oefenen de praktijk uit overeenkomstig de bevoegdheden en vereisten, bij de
      [Wetboeken van Burgerlijke Rechtsvordering][ref1] en [Strafvordering][ref2] en bij de bijzondere wetten en
      besluiten gegeven en gevorderd, en overeenkomstig deze wet en de daarop berustende verordeningen en besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0001903
  - number: 10a.1
    text: |-
      In het belang van een goede rechtsbedeling draagt de advocaat zorg voor de rechtsbescherming van zijn cliënt.
      Daartoe is de advocaat bij de uitoefening van zijn beroep:
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel10a
  - number: 10a.1.a
    text: onafhankelijk ten opzichte van zijn cliënt, derden en de zaken waarin hij als zodanig optreedt;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel10a
  - number: 10a.1.b
    text: partijdig bij de behartiging van de gerechtvaardigde belangen van zijn cliënt;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel10a
  - number: 10a.1.c
    text: deskundig en kan hij beschikken over voldoende kennis en vaardigheden;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel10a
  - number: 10a.1.d
    text: integer en onthoudt hij zich van enig handelen of nalaten dat een behoorlijk advocaat niet betaamt; en
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel10a
  - number: 10a.1.e
    text: vertrouwenspersoon en neemt hij geheimhouding in acht binnen de door de wet en het recht gestelde grenzen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel10a
  - number: 10a.2
    text: |-
      De algemene raad en de raden van de orden in de arrondissementen bevorderen in het belang van een goede
      rechtsbedeling een behoorlijke uitoefening van de praktijk en nemen alle maatregelen die daaraan kunnen bijdragen.
      Zij komen op voor de rechten en belangen van de advocaten en vervullen de taken die hun bij verordening zijn
      opgedragen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel10a
  - number: '11'
    text: |-
      Onverminderd het bepaalde in [artikel 9j][ref1], hebben advocaten zowel in burgerlijke als in strafzaken de
      bevoegdheid om als zodanig voor alle rechterlijke colleges binnen het Rijk op te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel9j
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 9j
        afdeling: 1a
  - number: 11a.1
    text: |-
      Voor zover niet bij wet anders is bepaald, is de advocaat ten aanzien van al hetgeen waarvan hij uit hoofde van
      zijn beroepsuitoefening als zodanig kennis neemt tot geheimhouding verplicht. Dezelfde verplichting geldt voor
      medewerkers en personeel van de advocaat, alsmede andere personen die betrokken zijn bij de beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel11a
  - number: 11a.2
    text: |-
      De geheimhoudingsplicht, bedoeld in het eerste lid, blijft voortbestaan na beëindiging van de beroepsuitoefening of
      de betrekking waarin de werkzaamheden zijn verricht.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel11a
  - number: '12.1'
    text: Advocaten zijn verplicht kantoor te houden. Zij mogen slechts in één arrondissement op één locatie kantoor houden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel12
  - number: '12.2'
    text: Het kantoor van de advocaat geldt voor al zijn handelingen als zodanig als gekozen woonplaats.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel12
  - number: '12.3'
    text: |-
      Door de algemene raad kan om bijzondere redenen aan een advocaat, die zijn kantoor buiten Nederland wenst te
      vestigen, ontheffing van het in het eerste lid vervatte voorschrift worden verleend. De raad van de orde in
      het arrondissement waar de advocaat het laatst kantoor heeft gehouden, wordt tevoren gehoord. Indien ontheffing
      wordt verleend, blijft de advocaat na vestiging van zijn kantoor buiten Nederland behoren tot de orde in het
      arrondissement waar hij het laatst kantoor heeft gehouden. Indien de advocaat niet eerder in een arrondissement
      kantoor heeft gehouden, behoort hij na verlening van de ontheffing en vestiging van zijn kantoor buiten Nederland
      tot de orde in het arrondissement Den Haag.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel12
  - number: '12.4'
    text: |-
      Door de algemene raad kan aan een advocaat die in het kader van detachering elders kantoor wenst te houden,
      tijdelijk ontheffing van het in het eerste lid vervatte voorschrift worden verleend. De raad van de orde in het
      arrondissement waar de advocaat op het moment van het verzoek om ontheffing kantoor houdt, wordt tevoren gehoord.
      Indien ontheffing wordt verleend, blijft de advocaat behoren tot de orde in het arrondissement waar hij kantoor
      heeft gehouden op het moment van het verzoek om ontheffing.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel12
  - number: '12.5'
    text: |-
      Advocaten die niet aan de voorschriften van dit artikel voldoen, worden, na aanmaning daartoe door de raad van de
      orde in het arrondissement, op requisitoir van het openbaar ministerie en nadat de rechtbank tot schrapping heeft
      beslist, van het tableau geschrapt. Van de beslissing tot schrapping wordt door de griffier van de rechtbank kennis
      gegeven aan de secretaris van de algemene raad met het oog op de verwerking op het tableau.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel12
  - number: 12a
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een verzoek om ontheffing als
      bedoeld in [artikel 12, derde en vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel12
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
      - id: ref3
        bwb_id: BWBR0002093
        artikel: '12'
        afdeling: '2'
  - number: '13.1'
    text: |-
      De rechtzoekende die niet of niet tijdig een advocaat bereid vindt hem zijn diensten te verlenen in een zaak,
      waarin vertegenwoordiging door een advocaat is voorgeschreven dan wel bijstand uitsluitend door een advocaat
      kan geschieden, kan zich wenden tot de deken van de orde van advocaten in het arrondissement waar de zaak moet
      dienen, met het verzoek een advocaat aan te wijzen. Ook indien de rechtzoekende naar het voorlopig oordeel
      van de deken in aanmerking komt voor verlening van rechtsbijstand ingevolge het bepaalde bij of krachtens de
      [Wet op de rechtsbijstand][ref1], wijst de deken een advocaat aan.


      [ref1]: https://wetten.overheid.nl/BWBR0006368
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006368
  - number: '13.2'
    text: |-
      De deken kan het verzoek alleen wegens gegronde redenen afwijzen. Hij kan een aanwijzing op grond van bijzondere
      redenen wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel13
  - number: '13.3'
    text: |-
      Binnen zes weken na de bekendmaking van de beschikking, houdende afwijzing van het verzoek, kan de belanghebbende
      beklag doen bij het hof van discipline. Op de behandeling van het beklag zijn de [hoofdstukken 6][ref1] en
      [7 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '7'
  - number: '13.4'
    text: De aangewezen advocaat is verplicht zijn diensten te verlenen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel13
  - number: '13.5'
    text: |-
      De advocaat die door de raad voor rechtsbijstand als raadsman is aangewezen, treedt als zodanig op of doet zich
      overeenkomstig [artikel 43 van het Wetboek van Strafvordering][ref1] waarnemen, zolang niet een gekozen raadsman
      is opgetreden of op de voet van [artikel 44 van het Wetboek van Strafvordering][ref2] een ander is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel44
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '44'
  - number: '14'
    text: |-
      De advocaten pleiten staande, gekleed in het kostuum bij het bijzondere reglement op dat onderwerp bepaald, des
      goedvindende met gedekten hoofde.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel14
  - number: '16'
    text: |-
      Advocaten, die in staat van faillissement zijn verklaard of ten aanzien van wie de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard, die wegens schulden zijn gegijzeld of onder curatele
      zijn gesteld, zijn gedurende de duur van het faillissement onderscheidenlijk de toepassing van de
      schuldsaneringsregeling natuurlijke personen, de gijzeling of de curatele van rechtswege in de uitoefening van
      de praktijk geschorst. De geschorste advocaat mag gedurende de schorsing de titel van advocaat niet voeren. De
      griffier van het gerecht dat een van de in de eerste zin vermelde beslissingen of een beslissing die de opheffing
      van de schorsing tot gevolg heeft, heeft uitgesproken, geeft van de schorsing , onderscheidenlijk de opheffing
      hiervan kennis aan de secretaris van de algemene raad met het oog op de verwerking op het tableau. Schorsing
      brengt mee het verlies van de betrekkingen, waarbij de hoedanigheid van advocaat vereiste voor verkiesbaarheid of
      benoembaarheid is.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16
  - number: 16a
    text: |-
      De bepalingen van deze wet en andere wettelijke voorschriften betreffende advocaten, hebben uitsluitend betrekking
      op in Nederland ingeschreven advocaten, voor zover die voorschriften of de navolgende, tot deze paragraaf
      behorende, artikelen niet anders bepalen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16a
  - number: 16b
    text: |-
      Voor de uitoefening in Nederland van werkzaamheden bij wijze van dienstverrichting, worden mede als advocaat
      aangemerkt, personen die niet als zodanig in Nederland zijn ingeschreven, maar die wel in een andere lidstaat van
      de Europese Unie, in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      of in Zwitserland, hierna te noemen staat van herkomst, gerechtigd zijn hun beroepswerkzaamheden uit te oefenen
      onder de benaming advocaat of een daarmede overeenkomstige benaming in de taal of in een der talen van de staat
      van herkomst.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16b
  - number: 16c
    text: |-
      Wanneer de in het vorige artikel bedoelde personen, hierna te noemen: bezoekende advocaten, bij de uitoefening
      in Nederland van werkzaamheden bij wijze van dienstverrichting hun titel voeren, dienen zij daarbij de
      beroepsorganisatie te vermelden waartoe zij behoren of het gerecht waarbij zij overeenkomstig de wettelijke
      regeling van de staat van herkomst zijn toegelaten.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16c
  - number: 16d.1
    text: |-
      De werkzaamheden, bij wijze van dienstverrichting, betreffende de vertegenwoordiging en de verdediging van een
      cliënt in rechte of ten overstaan van een overheidsinstantie worden door bezoekende advocaten onder dezelfde
      voorwaarden uitgeoefend als die welke gelden voor in Nederland ingeschreven advocaten.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16d
  - number: 16d.2
    text: |-
      Bij de uitoefening van de in het eerste lid genoemde werkzaamheden nemen bezoekende advocaten de beroepsregels
      in acht die gelden voor in Nederland ingeschreven advocaten, met inbegrip van de verordeningen genoemd in
      [artikel 28][ref1], onverminderd hetgeen waartoe zij als advocaat in de staat van herkomst verplicht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 16d.3
    text: |-
      Bij het optreden ten overstaan van een overheidsinstantie moeten bezoekende advocaten desgevraagd hun bevoegdheid
      tot de uitoefening van het beroep van advocaat ten genoegen van die instantie aantonen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16d
  - number: 16e.1
    text: |-
      Bij de uitoefening van werkzaamheden, bij wijze van dienstverrichting, betreffende de vertegenwoordiging en de
      verdediging van een cliënt in rechte, waarvoor ingevolge de wet de bijstand of vertegenwoordiging van een advocaat
      is voorgeschreven, moet een bezoekende advocaat samenwerken met een in Nederland ingeschreven advocaat, hierna te
      noemen de samenwerkende advocaat.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16e
  - number: 16e.2
    text: |-
      De samenwerkende advocaat dient zich tevoren te vergewissen van de bevoegdheid van de bezoekende advocaat tot
      uitoefening van het beroep van advocaat en is daarvoor verantwoordelijk tegenover het betrokken gerecht.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16e
  - number: 16e.3
    text: |-
      De samenwerkende advocaat stelt de bezoekende advocaat, alvorens deze voor de eerste maal als zodanig in rechte
      optreedt, voor aan de rechter die de leiding heeft van de terechtzitting.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16e
  - number: 16e.4
    text: |-
      De bezoekende advocaat wordt geacht voor de in het eerste lid bedoelde werkzaamheden woonplaats te hebben gekozen
      ten kantore van de samenwerkende advocaat.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16e
  - number: 16e.5
    text: |-
      In de gevallen dat advocaten verplicht of gerechtigd zijn tot het dragen van een bijzonder kostuum, mag de
      bezoekende advocaat, indien hij zulks verkiest, in plaats daarvan het kostuum dragen dat is voorgeschreven in de
      staat van herkomst.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16e
  - number: 16e.6
    text: |-
      De rechter die de leiding heeft van de terechtzitting kan bezoekende advocaten toestaan zich van een andere taal
      te bedienen dan de Nederlandse, indien hij van mening is dat daardoor een goede rechtsbedeling niet wordt geschaad.
      Hij kan daarbij als voorwaarde stellen dat van een tolk gebruik gemaakt wordt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16e
  - number: 16f
    text: |-
      Ten aanzien van andere werkzaamheden, bij wijze van dienstverrichting, dan die bedoeld in
      [het eerste lid van artikel 16d][ref1], blijven bezoekende advocaten onderworpen aan de voorwaarden en de
      beroepsregels van de staat van herkomst. Zij dienen daarnaast de voor in Nederland ingeschreven advocaten geldende
      beroepsregels in acht te nemen, met name die betreffende: *(a)* de onverenigbaarheid van het uitoefenen van de
      werkzaamheden van advocaat met het verrichten van andere werkzaamheden in Nederland, *(b)* de verhouding tot andere
      advocaten en *(c)* het verbod van bijstand door een zelfde advocaat aan partijen met tegenstrijdige belangen.
      Laatstbedoelde regels zijn slechts toepasselijk voor zover zij kunnen worden nageleefd door een advocaat die niet
      in Nederland is gevestigd en de naleving ervan objectief gerechtvaardigd is ten einde in Nederland de behoorlijke
      uitoefening van de werkzaamheden van advocaten, de waardigheid van het beroep en de inachtneming van de bedoelde
      regels inzake onverenigbaarheid te verzekeren.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16d
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16f
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16d
        afdeling: 2a
  - number: 16g
    text: |-
      De bepalingen van deze wet en andere wettelijke voorschriften betreffende advocaten hebben uitsluitend betrekking
      op in Nederland ingeschreven advocaten voorzover die voorschriften of de navolgende, tot deze paragraaf behorende,
      artikelen niet anders bepalen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16g
  - number: 16h.1
    text: |-
      Degene die niet met inachtneming van [artikel 1][ref1] is ingeschreven, maar die wel in een andere lidstaat van de
      Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      of in Zwitserland hierna te noemen staat van herkomst, gerechtigd is zijn beroepswerkzaamheid uit te oefenen onder
      de benaming advocaat of een daarmee overeenkomstige benaming in de taal of in de talen van de staat van herkomst,
      heeft het recht om permanent dezelfde werkzaamheden uit te oefenen als de overeenkomstig [artikel 1][ref2]
      ingeschreven advocaat nadat hij zich heeft laten inschrijven op het tableau van de Nederlandse orde van advocaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel1
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16h
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '1'
        afdeling: '1'
  - number: 16h.2
    text: |-
      De secretaris van de algemene raad schrijft de advocaat in na overlegging van een verklaring van inschrijving bij
      de bevoegde autoriteit van de staat van herkomst, indien de verklaring niet langer dan drie maanden voor het moment
      waarop de aanvraag om inschrijving is ingediend is afgegeven.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16h
  - number: 16h.3
    text: |-
      De secretaris van de algemene raad stelt de bevoegde autoriteit van de staat van herkomst in kennis van de
      inschrijving.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16h
  - number: 16i.1
    text: |-
      De advocaat, bedoeld in het eerste lid van [artikel 16h][ref1], is gehouden zijn beroepswerkzaamheden in Nederland
      uit te oefenen onder zijn oorspronkelijke beroepstitel, zoals deze dient te luiden in de taal of een der officiële
      talen van de staat van herkomst, evenwel op een verstaanbare wijze en zodanig dat hij niet kan worden verward met
      de titel advocaat, bedoeld in [artikel 9a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel9a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16i
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 9a
        afdeling: '1'
  - number: 16i.2
    text: |-
      Bij de uitoefening van de werkzaamheden, bedoeld in het eerste lid, vermeldt de advocaat de beroepsorganisatie
      waartoe hij behoort of het gerecht waarbij hij overeenkomstig de wettelijke regeling van de staat van herkomst is
      toegelaten alsmede zijn inschrijving op het tableau.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16i
  - number: 16j
    text: |-
      Voor de uitoefening van de werkzaamheden die met de vertegenwoordiging en de verdediging van een cliënt in
      rechte verband houden werkt de advocaat, bedoeld in het [eerste lid van artikel 16h][ref1], samen met een
      overeenkomstig [artikel 1][ref2] in Nederland ingeschreven advocaat voorzover ingevolge de wet de bijstand
      of vertegenwoordiging van een advocaat is voorgeschreven. Het [eerste lid van artikel 16d][ref3] alsmede het
      [tweede tot en met vierde en zesde lid van artikel 16e][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel16d
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel16d
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16j
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 16d
        afdeling: 2a
      - id: ref4
        bwb_id: BWBR0002093
        artikel: 16d
        afdeling: 2a
  - number: 16k.1
    text: |-
      De advocaat, bedoeld in het [eerste lid van artikel 16h][ref1], is voor alle werkzaamheden die hij in Nederland
      uitoefent aan dezelfde beroeps- en gedragregels alsmede aan dezelfde voorwaarden onderworpen als de advocaat die
      overeenkomstig [artikel 1][ref2] is ingeschreven, met inbegrip van de verordeningen genoemd in [artikel 28][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel16k
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 16k.2
    text: |-
      De [artikelen 10][ref1], [10a, eerste lid][ref2], [11a][ref3], [12][ref4], [13][ref5], [14][ref6] en [16][ref7]
      zijn van overeenkomstige toepassing. [Artikel 11][ref8] is van overeenkomstige toepassing voorzover de advocaat
      optreedt in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel11a
