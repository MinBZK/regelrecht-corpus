  - number: '17.1'
    text: |-
      De gezamenlijke advocaten, die in Nederland zijn ingeschreven, vormen de Nederlandse orde van
      advocaten. Zij is gevestigd te 's-Gravenhage. Zij is een publiekrechtelijk lichaam als bedoeld in
      [artikel 134 van de Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
  - number: '17.2'
    text: |-
      De gezamenlijke advocaten die kantoor houden in een zelfde arrondissement, vormen de orde van advocaten in het
      arrondissement.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel17
  - number: '17.3'
    text: De Nederlandse orde van advocaten en de orden zijn rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel17
  - number: 17a.1
    text: 'De Nederlandse orde van advocaten kent de volgende organen:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel17a
  - number: 17a.1.a
    text: |-
      de algemene raad, bedoeld in [artikel 18, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel18
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '18'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 17a.1.b
    text: |-
      de deken van de algemene raad, bedoeld in [artikel 18, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel18
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '18'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 17a.1.c
    text: |-
      het college van afgevaardigden, bedoeld in [artikel 19, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel19
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '19'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 17a.1.d
    text: |-
      de raad van advies, bedoeld in [artikel 32a, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 32a
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 17a.1.e
    text: |-
      het college van toezicht, bedoeld in [artikel 36a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel36a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 36a
        paragraaf: Afdeling_1a
        afdeling: '3'
  - number: 17a.2
    text: 'De orde van advocaten in een arrondissement kent de volgende organen:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel17a
  - number: 17a.2.a
    text: |-
      de raad, bedoeld in [artikel 22, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel22
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '22'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 17a.2.b
    text: |-
      de deken, bedoeld in [artikel 22, tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel22
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '22'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 17a.2.c
    text: |-
      de jaarlijkse vergadering van de orde, bedoeld in [artikel 22, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel22
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '22'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: '18.1'
    text: |-
      Aan het hoofd van de Nederlandse orde van advocaten staat een algemene raad, bestaande uit tenminste vijf
      en ten hoogste negen leden, onder wie de deken. Het aantal leden van de raad wordt nader bepaald door het in
      [artikel 19, eerste lid][ref1], bedoelde college van afgevaardigden.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel19
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '19'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: '18.2'
    text: |-
      De deken wordt bij ontstentenis of verhindering vervangen door een lid van de algemene raad, daartoe door die raad
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel18
  - number: '19.1'
    text: |-
      De deken en de overige leden van de algemene raad worden gekozen door een college van afgevaardigden. Het college
      van afgevaardigden komt ten minste eenmaal per jaar bijeen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel19
  - number: '19.2'
    text: |-
      De vergaderingen van het college van afgevaardigden zijn openbaar. Er wordt met gesloten deuren vergaderd indien
      de voorzitter, de aard van het te behandelen onderwerp in aanmerking genomen, zulks nodig oordeelt of indien de
      meerderheid van de aanwezige leden daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel19
  - number: '19.3'
    text: Het lidmaatschap van de algemene raad is niet verenigbaar met het lidmaatschap van het college van afgevaardigden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel19
  - number: '19.4'
    text: Jaarlijks treden twee leden volgens een door de algemene raad vast te stellen rooster af.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel19
  - number: '19.5'
    text: |-
      In vacatures die tussentijds ontstaan voorziet het college van afgevaardigden zo spoedig mogelijk, zo nodig in een
      buitengewone vergadering.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel19
  - number: '19.6'
    text: Niemand kan langer dan negen jaren in het geheel, als deken of als lid, deel uitmaken van de algemene raad.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel19
  - number: '20.1'
    text: |-
      De afgevaardigden en hun plaatsvervangers worden voor de tijd van drie jaren gekozen in vergaderingen van de orden
      in de arrondissementen. Zij zijn herkiesbaar.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel20
  - number: '20.2'
    text: 'De aantallen afgevaardigden en plaatsvervangers bedragen:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel20
  - number: 20.2.a
    text: 'voor de orden, bestaande uit minder dan 1.500 advocaten: vier afgevaardigden en drie plaatsvervangers;'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel20
  - number: 20.2.b
    text: |-
      voor de orden, bestaande uit 1.500 advocaten of meer, doch minder dan 3.000: zes afgevaardigden en drie
      plaatsvervangers; en
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel20
  - number: 20.2.c
    text: 'voor de orden, bestaande uit 3.000 advocaten of meer: acht afgevaardigden en drie plaatsvervangers.'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel20
  - number: '20.3'
    text: |-
      Voor de toepassing van het tweede lid is beslissend het aantal advocaten dat in een arrondissement kantoor houdt op
      de eerste werkdag vóór de verkiezing als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel20
  - number: '20.4'
    text: |-
      De hoedanigheid van afgevaardigde of plaatsvervanger is niet verenigbaar met het lidmaatschap van de raad van de
      orde in een arrondissement, een dienstverband bij de Nederlandse orde van advocaten of een dienstverband bij een
      orde in een arrondissement.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel20
  - number: '20.5'
    text: De plaatsvervangers treden op in volgorde van verkiezing.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel20
  - number: '20.6'
    text: Bij gebleken behoefte kan in vacatures onmiddellijk worden voorzien.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel20
  - number: '20.7'
    text: De secretaris van de algemene raad treedt op als secretaris van de vergadering van het college van afgevaardigden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel20
  - number: '21'
    text: |-
      Bij verhindering van een afgevaardigde, een vergadering van het college van afgevaardigden bij te wonen, geeft hij
      daarvan onverwijld kennis aan de in [artikel 20, vijfde lid][ref1], aangewezen plaatsvervanger.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel20
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '20'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: '22.1'
    text: |-
      De orde in het arrondissement wordt bestuurd door een raad die bestaat uit ten minste vijf en ten hoogste elf
      leden, onder wie de deken. Het aantal leden van de raad wordt nader bepaald in het huishoudelijk reglement van
      de orde.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel22
  - number: '22.2'
    text: |-
      De deken en de overige leden van de raad worden uit de leden van de orde gekozen in de jaarlijkse vergadering van
      de orde.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel22
  - number: '22.3'
    text: |-
      Jaarlijks treden twee leden volgens een door de raad vast te stellen rooster af. De deken is herkiesbaar. Een
      lid van de raad kan steeds tot deken gekozen worden. De leden van de raad zijn niet herkiesbaar, tenzij het
      huishoudelijk reglement anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel22
  - number: '22.4'
    text: Bij gebleken behoefte kan in vacatures onmiddellijk worden voorzien.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel22
  - number: '23.1'
    text: |-
      De deken wordt bij ontstentenis of verhindering vervangen door een lid van de raad van de orde in het
      arrondissement, daartoe door die raad aangewezen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel23
  - number: '23.2'
    text: De raad wijst uit zijn midden een secretaris en een penningmeester aan.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel23
  - number: '24.1'
    text: |-
      Als leden van de algemene raad, van het college van afgevaardigden en van de raden van de orden in de
      arrondissementen zijn slechts verkiesbaar advocaten en degenen die overeenkomstig [artikel 16h][ref1] zijn
      ingeschreven voorzover zij de ouderdom van zeventig jaren nog niet hebben bereikt. Na het bereiken van die leeftijd
      treden zij af met ingang van de eerstvolgende maand.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
  - number: '24.2'
    text: |-
      Bij huishoudelijk reglement van de orde in het arrondissement kan worden bepaald dat als lid van de raad slechts
      advocaten of degenen die overeenkomstig [artikel 16h][ref1] zijn ingeschreven verkiesbaar zijn, die tenminste
      gedurende een bepaalde tijd, drie jaren niet te boven gaande, als zodanig zijn ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
  - number: '25'
    text: |-
      De vergadering der Nederlandse orde van advocaten beraadslaagt over onderwerpen, die voor advocaten en
      rechtzoekenden van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel25
  - number: '26.1'
    text: |-
      De algemene raad is verantwoordelijk voor het uitvoeren van kwaliteitstoetsen bij advocaten. De kwaliteitstoetsen
      worden verricht door deskundigen die zijn aangewezen door de algemene raad.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel26
  - number: '26.2'
    text: |-
      Op het verrichten van de kwaliteitstoetsen en de krachtens het eerste lid aangewezen deskundigen zijn de
      [artikelen 5:12][ref1], [5:13][ref2], [5:14][ref3], [5:15, eerste en derde lid][ref4], [5:16][ref5], [5:17][ref6]
      en [5:20, eerste lid, van de Algemene wet bestuursrecht][ref7] van overeenkomstige toepassing. Bij het opdragen van
      een kwaliteitstoets bepaalt de algemene raad over welke bevoegdheden als bedoeld in de eerste volzin de aangewezen
      deskundigen beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '26.3'
    text: |-
      Bijzondere categorieën van persoonsgegevens en persoonsgegevens van
      strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2] kunnen worden verwerkt door de
      krachtens het eerste lid aangewezen deskundigen, voor zover deze gegevens noodzakelijk zijn voor de doelmatige en
      doeltreffende uitvoering van kwaliteitstoetsen.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '26.4'
    text: |-
      Ten behoeve van het verrichten van de kwaliteitstoetsen door de aangewezen deskundigen, bedoeld in het eerste
      lid, zijn de advocaat, zijn medewerkers en personeel, alsmede andere personen die betrokken zijn bij de
      beroepsuitoefening, niet gehouden aan de geheimhoudingsplicht, bedoeld in [artikel 11a][ref1]. In dat geval geldt
      voor de betrokken aangewezen deskundigen een geheimhoudingsplicht, gelijk aan die bedoeld in artikel 11a, en is
      [artikel 218 van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel218
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 11a
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '218'
  - number: '26.5'
    text: |-
      Bij of krachtens verordening als bedoeld in [artikel 28, eerste lid][ref1], worden nadere regels gesteld
      betreffende het verrichten van de kwaliteitstoetsen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: '27'
    text: |-
      De algemene raad vertegenwoordigt de Nederlandse advocaten overal, waar daartoe aanleiding bestaat, ook indien het
      belang der Nederlandse orde daarbij niet rechtstreeks betrokken is.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel27
  - number: '28.1'
    text: |-
      Het college van afgevaardigden stelt verordeningen vast in het belang van de goede uitoefening van de praktijk,
      alsmede ter waarborging van de eisen die op grond van [artikel 10a][ref1] daaraan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 10a
        afdeling: '2'
  - number: '28.2'
    text: 'Het college van afgevaardigden stelt bij of krachtens verordening voorts regels betreffende:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel28
  - number: 28.2.a
    text: de eisen ter bevordering van de vakbekwaamheid van advocaten en de kwaliteit van de beroepsuitoefening;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel28
  - number: 28.2.b
    text: |-
      de verplichte aansluiting bij een klachten- en geschillenregeling, waaronder de verplichte
      aansluiting bij een regeling waarbij sprake is van een overeenkomst tot arbitrage, bedoeld in
      [artikel 1020 van het Wetboek van Burgerlijke Rechtsvordering][ref1] of van een vaststellingsovereenkomst, bedoeld
      in [artikel 900 van Boek 7 van het Burgerlijk Wetboek][ref2], op grond waarvan geschillen omtrent de hoogte van een
      declaratie worden afgedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1020
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel900
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1020'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '900'
  - number: 28.2.c
    text: een behoorlijke inrichting van de administratie van praktijkvoering voor advocaten;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel28
  - number: 28.2.d
    text: de verzekering ter zake van het risico van de beroepsaansprakelijkheid van advocaten;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel28
  - number: 28.2.e
    text: de huishouding en de organisatie van de Nederlandse orde van advocaten; en
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel28
  - number: 28.2.f
    text: |-
      de doorberekening van de kosten die de Nederlandse orde van advocaten maakt in verband met de uitoefening van
      tuchtrechtspraak aan haar leden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel28
  - number: '28.3'
    text: |-
      voorstellen voor verordeningen worden aan het college van afgevaardigden gedaan door de algemene raad of door
      tenminste vijf afgevaardigden. Voordat de algemene raad een voorstel bij het college van afgevaardigden indient,
      kan het de raden van de orden in de arrondissementen uitnodigen hun oordeel kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel28
  - number: '28.4'
    text: |-
      Verordeningen worden na vaststelling onverwijld medegedeeld aan Onze Minister voor Rechtsbescherming en
      gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel28
  - number: '28.5'
    text: |-
      Het college van afgevaardigden stelt geen verordeningen vast met betrekking tot de uitoefening
      door de deken van de orde in het arrondissement van het in [artikel 45a, eerste lid][ref1], en
      [artikel 24, tweede lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref2] bedoelde
      toezicht of met betrekking tot de uitoefening door het college van toezicht van de in [paragraaf 3a][ref3] bedoelde
      taken en bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Afdeling3a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 45a
        afdeling: 3a
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0002093
        afdeling: 3a
  - number: '29.1'
    text: 'De verordeningen zijn verbindend voor:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel29
  - number: 29.1.a
    text: |-
      advocaten, ingeschreven op het tableau, bedoeld in [artikel 1, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel1
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '1'
        afdeling: '1'
  - number: 29.1.b
    text: |-
      bezoekende advocaten volgens het bepaalde in de [artikelen 16d, tweede lid][ref1], en [16f][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16d
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel16f
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16d
        afdeling: 2a
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 16f
        afdeling: 2a
  - number: 29.1.c
    text: |-
      rechtspersonen of samenwerkingsverbanden waarbinnen de in de onderdelen a en b bedoelde personen werkzaam zijn en
      die uitsluitend de rechtspraktijk uitoefenen of doen uitoefenen door advocaten dan wel door advocaten en andere
      beroepsbeoefenaren.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel29
  - number: '29.2'
    text: |-
      Zij mogen geen bepalingen inhouden omtrent punten, waarin door of krachtens de wet is voorzien, noch treden in
      aangelegenheden, die zich tengevolge van het uiteenlopen der omstandigheden in de arrondissementen niet lenen voor
      algemene voorzieningen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel29
  - number: '29.3'
    text: |-
      De bepalingen van verordeningen, in welker onderwerp door of krachtens de wet wordt voorzien, houden van rechtswege
      op te gelden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel29
  - number: '30.1'
    text: |-
      Besluiten van het college van afgevaardigden, van de algemene raad of van andere organen van de
      Nederlandse orde van advocaten, met uitzondering van besluiten van het college van toezicht, bedoeld in
      [artikel 36a, eerste lid][ref1], en besluiten van de deken van de algemene raad, bedoeld in [artikel 45b][ref2],
      kunnen bij koninklijk besluit worden vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel36a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel45b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 36a
        paragraaf: Afdeling_1a
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 45b
        afdeling: 3a
  - number: '30.2'
    text: |-
      De schorsing of vernietiging geschiedt binnen zes maanden na de in [artikel 28, vierde lid][ref1], bedoelde
      mededeling of, wanneer het een besluit van de algemene raad of van een ander orgaan van de Nederlandse orde van
      advocaten betreft, binnen zes maanden nadat het besluit ter kennis van Onze Minister voor Rechtsbescherming is
      gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: '31.1'
    text: |-
      De algemene raad vertegenwoordigt de Nederlandse orde van advocaten, in en buiten rechte, onverminderd het bepaalde
      in [artikel 36a, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel36a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 36a
        paragraaf: Afdeling_1a
        afdeling: '3'
  - number: '31.2'
    text: De raden van de orden in de arrondissementen vertegenwoordigen de orden, in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel31
  - number: '32.1'
    text: |-
      De algemene raad en de raden van de orden in de arrondissementen besturen de Nederlandse orde van advocaten,
      onderscheidenlijk de orden in de arrondissementen, en zijn gerechtigd tot het verrichten van daden van beheer en
      beschikking met betrekking tot haar vermogen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel32
  - number: '32.2'
    text: |-
      Het college van afgevaardigden en de vergadering der orde in het arrondissement stellen jaarlijks de bedragen vast,
      die de leden ter dekking van de door de Nederlandse orde van advocaten, onderscheidenlijk door de orde te maken
      kosten moeten bijdragen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel32
  - number: '32.3'
    text: |-
      De algemene raad en de raden doen jaarlijks rekening en verantwoording van hun geldelijk beheer. Deze rekening
      en verantwoording wordt onderzocht door een commissie van drie leden, door het college van afgevaardigden,
      onderscheidenlijk de orde, uit hun midden aan te wijzen. De commissie brengt verslag uit aan het college
      onderscheidenlijk de orde. Goedkeuring van de rekening door het college van afgevaardigden, onderscheidenlijk de
      orde, strekt de algemene raad, onderscheidenlijk de raad, tot décharge.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel32
  - number: '32.4'
    text: |-
      Jaarlijks wordt door de algemene raad en de raden een verslag betreffende het afgelopen jaar uitgebracht en in de
      vergadering van het college van afgevaardigden, onderscheidenlijk van de orde, ter bespreking gesteld.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel32
  - number: '32.5'
    text: |-
      In het verslag, bedoeld in het vierde lid, wordt tevens verslag gedaan over de stand van de beroepsuitoefening door
      advocaten en over de afhandeling van geschillen tussen advocaten en cliënten.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel32
  - number: 32a.1
    text: |-
      Er is een raad van advies, bestaande uit vijf of zeven leden, de voorzitter daaronder begrepen. De raad van advies
      bestaat in meerderheid uit leden die geen advocaat zijn.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel32a
  - number: 32a.2
    text: |-
      Alvorens een voorstel voor een verordening als bedoeld in
      [artikel 28, eerste lid en tweede lid, onderdelen a tot en met d][ref1], bij het college van afgevaardigden wordt
      ingediend, wordt het ontwerp voor advies aan de raad van advies voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 32a.3
    text: |-
      De raad van advies kan besluiten af te zien van advisering. Indien een advies is uitgebracht, wordt dit overgelegd
      bij het indienen van het voorstel bij het college van afgevaardigden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel32a
  - number: 32a.4
    text: |-
      Het lidmaatschap van de raad van advies is niet verenigbaar met het lidmaatschap van enig ander orgaan van de
      Nederlandse orde van advocaten, of van de orden in de arrondissementen, uitgezonderd de jaarlijkse vergadering van
      de orde, bedoeld in [artikel 22, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel22
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '22'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 32a.5
    text: |-
      Bij verordening worden regels vastgesteld over de samenstelling en de inrichting van de raad van advies. Bij
      verordening kan de adviestaak van de raad van advies worden uitgebreid.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel32a
  - number: '33'
    text: |-
      De algemene raad houdt het bureau van de Nederlandse orde van advocaten in stand en geeft door middel daarvan
      voorlichting ten aanzien van al die onderwerpen, waarvan de wetenschap voor de advocaat van belang is, streeft
      de eenheid van beroepsgenoten na en bevordert de behandeling van wetenschappelijke en praktische vraagstukken in
      algemene vergaderingen van advocaten.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel33
  - number: '34.1'
    text: De algemene raad wijst zijn secretaris aan.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel34
  - number: '34.2'
    text: |-
      De secretaris van de algemene raad heeft de leiding van het bureau van de Nederlandse orde van advocaten. De
      secretaris kan geen lid van de algemene raad zijn. De algemene raad voorziet in zijn vervanging bij verhindering
      of afwezigheid.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel34
  - number: '35.1'
    text: |-
      De deken, bedoeld in [artikel 22, tweede lid][ref1], licht de advocaten voor over al hetgeen verband houdt met
      de praktijkuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel22
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '22'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: '35.2'
    text: De deken kan bemiddeling verlenen tot het bijleggen van geschillen tussen advocaten onderling.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel35
  - number: '35.3'
    text: |-
      De deken informeert een ieder over de mogelijkheid tot klacht- en geschillenbeslechting en de mogelijkheid voor
      partijen om zich tot de rechter te wenden. Zo nodig verwijst de deken door naar andere instanties.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel35
  - number: '35.4'
    text: |-
      De deken houdt toezicht op advocaten overeenkomstig het bepaalde in [paragraaf 3a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Afdeling3a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002093
        afdeling: 3a
  - number: '36'
    text: |-
      De organen van de Nederlandse orde van advocaten en van de orden in de arrondissementen kunnen huishoudelijke
      reglementen opstellen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36
  - number: 36a.1
    text: |-
      Er is een college van toezicht dat bestaat uit drie leden, waaronder de deken van de algemene raad, die tevens
      voorzitter is.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36a
  - number: 36a.2
    text: |-
      Met uitzondering van de deken van de algemene raad, worden de leden benoemd bij koninklijk besluit, op
      voordracht van Onze Minister voor Rechtsbescherming. Een voordracht voor benoeming wordt niet gedaan dan
      op aanbeveling van de algemene raad. Daartoe maakt de algemene raad voor iedere vacature in het college
      een lijst van aanbeveling van zo mogelijk drie kandidaten op. Het college van afgevaardigden kan de
      algemene raad adviseren inzake de lijst van aanbeveling. De algemene raad zendt de lijst van aanbeveling,
      vergezeld van een op iedere kandidaat betrekking hebbende verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1], en eventueel vergezeld van het advies
      van het college van afgevaardigden aan Onze Minister voor Rechtsbescherming. Een in de aanbeveling opgenomen
      kandidaat kan uitsluitend wegens zwaarwegende en te motiveren gronden worden geweigerd door Onze Minister voor
      Rechtsbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 36a.3
    text: |-
      De in het tweede lid bedoelde leden worden benoemd voor een periode van ten hoogste vier jaren. Zij kunnen na
      afloop van deze periode aansluitend eenmaal opnieuw worden benoemd voor een periode van ten hoogste vier jaren.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36a
  - number: 36a.4
    text: |-
      De in het tweede lid bedoelde leden ontvangen een vergoeding voor hun werkzaamheden alsmede voor hun reis- en
      verblijfkosten, vast te stellen bij besluit van de algemene raad. Het college van afgevaardigden kan bij of
      krachtens verordening als bedoeld in [artikel 28][ref1] nadere regels stellen over de vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 36a.5
    text: |-
      Het college wordt ondersteund door een secretaris. De secretaris wordt benoemd en ontslagen door het college. Hij
      is voor zijn werkzaamheden uitsluitend verantwoording verschuldigd aan het college. Bij of krachtens verordening
      als bedoeld in [artikel 28][ref1] kunnen ten aanzien van de secretaris algemene regels van rechtspositionele aard
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 36a.6
    text: |-
      Onze Minister voor Rechtsbescherming kan een besluit van de algemene raad als bedoeld in het vierde lid,
      vernietigen wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36a
  - number: 36a.7
    text: Aan de besluitvorming door de algemene raad, bedoeld in het tweede lid, wordt niet deelgenomen door de deken.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36a
  - number: 36b.1
    text: |-
      De in [artikel 36a, tweede lid][ref1], bedoelde leden van het college van toezicht kunnen niet tevens advocaat
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel36a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 36a
        paragraaf: Afdeling_1a
        afdeling: '3'
  - number: 36b.2
    text: |-
      De in [artikel 36a, tweede lid][ref1], bedoelde leden kunnen niet tevens:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel36a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 36a
        paragraaf: Afdeling_1a
        afdeling: '3'
  - number: 36b.2.a
    text: |-
      lid of medewerker zijn van een ander orgaan van de Nederlandse orde van advocaten of van een orgaan van de orden in
      de arrondissementen;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36b
  - number: 36b.2.b
    text: |-
      voorzitter, plaatsvervangend voorzitter, lid, plaatsvervangend lid of griffier zijn van een raad van discipline of
      het hof van discipline;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36b
  - number: 36b.2.c
    text: |-
      het lidmaatschap bekleden van publiekrechtelijke colleges waarvoor de keuze geschiedt krachtens wettelijk
      voorschrift uitgeschreven verkiezingen;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36b
  - number: 36b.2.d
    text: een openbare betrekking bekleden waaraan een vaste beloning of toelage is verbonden; of
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36b
  - number: 36b.2.e
    text: het lidmaatschap bekleden van vaste colleges van advies en bijstand aan de Regering.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36b
  - number: 36b.3
    text: |-
      Een lid van het college vervult geen nevenfuncties die ongewenst zijn met het oog op een goede vervulling van zijn
      functie, of de handhaving van zijn onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36b
  - number: 36b.4
    text: |-
      Nevenfuncties van een lid worden openbaar gemaakt door het ter inzage leggen van een opgave daarvan bij het bureau
      van het college.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36b
  - number: 36b.5
    text: |-
      Onder het tweede lid, onderdeel d, worden niet begrepen betrekkingen bij een instelling als bedoeld in
      [artikel 1.1., onderdeel f, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 36b.6
    text: |-
      Onder het tweede lid, onderdelen d en e, worden niet begrepen de leden van de Raad van State, de staatsraden en de
      staatsraden in buitengewone dienst die uitsluitend in de Afdeling advisering van de Raad van State zijn benoemd.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36b
  - number: 36c.1
    text: |-
      Voor zover het betreft de in [artikel 36a, tweede lid][ref1], bedoelde leden, eindigt het lidmaatschap van het
      college van toezicht:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel36a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 36a
        paragraaf: Afdeling_1a
        afdeling: '3'
  - number: 36c.1.a
    text: door het verstrijken van de periode waarvoor het lid is benoemd;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.1.b
    text: |-
      door ontslag op eigen verzoek bij koninklijk besluit op voordracht van Onze Minister voor Rechtsbescherming,
      gehoord de algemene raad;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.1.c
    text: door het overlijden van het lid; en
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.1.d
    text: door ontslag als bedoeld in het vijfde of zesde lid.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.2
    text: |-
      Het hof van discipline schorst op verzoek van Onze Minister voor Rechtsbescherming, gehoord de algemene raad, een
      lid van het college, indien en voor zolang:
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.2.a
    text: hij zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.2.b
    text: |-
      hij bij nog niet onherroepelijk geworden rechterlijke uitspraak wegens een misdrijf is veroordeeld tot een
      vrijheidsstraf dan wel hem bij een dergelijke uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg
      heeft.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.3
    text: |-
      Het hof van discipline kan op verzoek van Onze Minister voor Rechtsbescherming, gehoord de algemene raad, een lid
      van het college schorsen, indien:
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.3.a
    text: tegen hem een gerechtelijk vooronderzoek ter zake van een misdrijf is ingesteld; of
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.3.b
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens een misdrijf is veroordeeld tot een
      andere straf dan een vrijheidsstraf;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.3.c
    text: aan hem een nog niet onherroepelijke strafbeschikking is opgelegd wegens het plegen van een misdrijf;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.3.d
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, hij surseance van betaling heeft verkregen, dan wel wegens schulden is gegijzeld; of
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.3.e
    text: |-
      er een ander ernstig vermoeden is voor het bestaan van feiten of omstandigheden die tot ontslag zouden kunnen
      leiden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.4
    text: |-
      Het hof van discipline beëindigt desgevraagd of ambtshalve een schorsing als bedoeld in het tweede of derde lid,
      wanneer de grond hiervoor is vervallen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.5
    text: |-
      Het hof van discipline kan op verzoek van Onze Minister voor Rechtsbescherming, gehoord de algemene raad, een lid
      van het college ontslaan, indien:
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.5.a
    text: |-
      bij onherroepelijk geworden rechterlijke uitspraak wegens een misdrijf is veroordeeld dan wel hem bij een
      dergelijke uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.5.b
    text: aan hem een onherroepelijke strafbeschikking is opgelegd wegens het plegen van een misdrijf; of
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.5.c
    text: |-
      hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van faillissement is
      verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij
      surseance van betaling heeft verkregen, dan wel wegens schulden is gegijzeld.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: 36c.6
    text: |-
      Het hof van discipline kan op verzoek van Onze Minister voor Rechtsbescherming, gehoord de algemene raad, een in
      [artikel 36a, tweede lid][ref1], bedoeld lid van het college ontslaan wegens ongeschiktheid of onbekwaamheid voor
      de functie dan wel wegens andere zwaarwegende in de persoon van de betrokkene gelegen redenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel36a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 36a
        paragraaf: Afdeling_1a
        afdeling: '3'
  - number: 36c.7
    text: |-
      Tegen een beslissing van het hof van discipline op grond van dit artikel kan door een belanghebbende
      overeenkomstig [artikel 8:1 van de Algemene wet bestuursrecht][ref1] beroep worden ingesteld bij de rechtbank.
      [Artikel 7:1 van de Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 36c.8
    text: Bij de toepassing van het tweede tot en met zesde lid maakt de deken geen deel uit van de algemene raad.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel36c
  - number: '37.1'
    text: |-
      De deken van de algemene raad onderscheidenlijk de deken van de orde in het arrondissement roept een vergadering
      bijeen zo vaak hij zulks nodig oordeelt en steeds indien voor de Nederlandse orde van advocaten ten minste vijftig
      leden, voor de algemene raad of voor een raad van de orde in het arrondissement ten minste twee leden, voor
      het college van afgevaardigden ten minste vier leden en voor een orde ten minste zes leden zulks schriftelijk
      verzoeken.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel37
  - number: '37.2'
    text: |-
      De deken en de overige leden van de algemene raad hebben toegang tot de vergaderingen van het college van
      afgevaardigden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel37
  - number: '38.1'
    text: |-
      In de vergaderingen bekleedt de deken van de algemene raad onderscheidenlijk de deken van de orde in het
      arrondissement het voorzitterschap.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel38
  - number: '38.2'
    text: |-
      In de vergaderingen van de raad en van de orde in het arrondissement heeft de deken bij staken der stemmen een
      beslissende stem.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel38
  - number: '39.1'
    text: Een behoorlijk bijeengeroepen vergadering wordt gehouden ongeacht het aantal aanwezige leden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel39
  - number: '39.2'
    text: |-
      Een vergadering van de algemene raad wordt evenwel niet gehouden wanneer niet ten minste vijf leden, en een
      vergadering van het college van afgevaardigden niet wanneer niet meer dan de helft van het aantal afgevaardigden of
      hun plaatsvervangers is opgekomen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel39
  - number: '39.3'
    text: |-
      Wanneer in een vergadering van het college van afgevaardigden het vereiste aantal afgevaardigden of
      plaatsvervangers niet is opgekomen, wordt een nieuwe vergadering belegd. Deze vergadering wordt gehouden ongeacht
      het aantal afgevaardigden of plaatsvervangers, dat is opgekomen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel39
  - number: '40.1'
    text: |-
      In de vergadering der orde in het arrondissement zijn alle leden stemgerechtigd. Tevens zijn stemgerechtigd degenen
      die zich overeenkomstig [artikel 16h][ref1] hebben laten inschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel16h
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 16h
        afdeling: 2b
  - number: '40.2'
    text: Iedere stemgerechtigde brengt één stem uit.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel40
  - number: '41.1'
    text: Over alle zaken wordt hoofdelijk gestemd.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel41
  - number: '41.2'
    text: Bij het doen van keuzen van personen wordt gestemd bij gesloten en ongetekende briefjes.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel41
  - number: '41.3'
    text: |-
      Indien bij het nemen van een besluit over een zaak door geen der aanwezigen stemming wordt gevraagd, wordt het
      voorstel geacht te zijn aangenomen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel41
  - number: '42.1'
    text: |-
      In een vergadering van de algemene raad is een stemming nietig, indien niet ten minste vijf leden daaraan hebben
      deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel42
  - number: '42.2'
    text: |-
      In een vergadering van het college van afgevaardigden is een stemming nietig, indien niet meer dan de helft van het
      aantal afgevaardigden of plaatsvervangers, dat zitting heeft, daaraan heeft deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel42
  - number: '42.3'
    text: |-
      Bij het doen van keuzen van personen worden afgevaardigden of hun plaatsvervangers, die niet of niet behoorlijk
      ingevulde briefjes ingeleverd hebben, voor de toepassing van dit artikel geacht aan de stemming te hebben
      deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel42
  - number: '42.4'
    text: |-
      Een stemming is geldig ongeacht het aantal afgevaardigden of hun plaatsvervangers, dat eraan heeft deelgenomen,
      ingeval opnieuw wordt gestemd over een voorstel of over een benoeming, ten aanzien waarvan in een vroegere
      vergadering een stemming op grond van het bepaalde in het tweede lid nietig was.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel42
  - number: '43.1'
    text: |-
      Voor het tot stand komen van een besluit bij stemming wordt de volstrekte meerderheid vereist van de leden, die aan
      de stemming hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel43
  - number: '43.2'
    text: |-
      Bij het doen van keuzen van personen worden de leden, die niet of niet behoorlijk ingevulde briefjes ingeleverd
      hebben, voor de toepassing van dit artikel geacht niet aan de stemming te hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel43
  - number: '44.1'
    text: |-
      Bij staking van stemmen over zaken wordt, behoudens het bepaalde in [artikel 38, tweede lid][ref1], het nemen van
      een besluit uitgesteld tot een volgende vergadering, waarin de beraadslagingen kunnen worden heropend.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel38
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '38'
        paragraaf: Afdeling_2
        afdeling: '3'
  - number: '44.2'
    text: |-
      In deze, en evenzo in een voltallige vergadering wordt, behoudens het bepaalde in [artikel 38, tweede lid][ref1],
      bij staken der stemmen over zaken het voorstel geacht niet te zijn aangenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel38
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '38'
        paragraaf: Afdeling_2
        afdeling: '3'
  - number: '45.1'
    text: |-
      Bij de stemming over personen treden in de vergaderingen twee door de voorzitter aan te wijzen leden als
      stemopnemers op.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45
  - number: '45.2'
    text: De stemopnemers onderzoeken, of het aantal briefjes gelijk is aan dat der tegenwoordig zijnde leden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45
  - number: '45.3'
    text: |-
      Er vinden net zoveel afzonderlijke stemmingen plaats als personen te kiezen zijn. De stemming over de deken van de
      algemene raad of van een deken van een orde in het arrondissement vindt als eerste plaats.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45
  - number: '45.4'
    text: In geval van twijfel over de inhoud van een briefje beslist de voorzitter.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45
  - number: '45.5'
    text: |-
      Een verkregen meerderheid van stemmen geldt niet, wanneer de vergadering beslist, dat daarop een tussen het aantal
      der briefjes en dat der aanwezigen bestaand verschil van invloed heeft kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45
  - number: '45.6'
    text: |-
      Wanneer niemand bij de eerste stemming de volstrekte meerderheid heeft verkregen, wordt tot een tweede vrije
      stemming overgegaan.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45
  - number: '45.7'
    text: |-
      Is ook bij deze geen volstrekte meerderheid verkregen, dan wordt de stemming bepaald tot de twee personen, die
      bij de tweede stemming de meeste stemmen hebben verkregen, of, zijn de meeste stemmen tussen meerdere personen
      verdeeld, tot allen die aldus de meeste stemmen hebben erlangd.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45
  - number: '45.8'
    text: |-
      Indien ook hierdoor geen meerderheid van stemmen is verkregen, wordt een vierde stemming gehouden over twee
      personen die bij de derde stemming de meeste stemmen hebben erlangd.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45
  - number: '45.9'
    text: |-
      Indien bij de derde of de vierde stemming twee of meer personen hetzelfde aantal stemmen hebben verkregen, beslist
      het lot.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45
  - number: 45a.1
    text: |-
      De deken van de orde in het arrondissement is belast met het toezicht op de naleving door advocaten die kantoor
      houden in dat arrondissement van het bepaalde bij of krachtens deze wet met inbegrip van toezicht op de zorg die
      zij als advocaten behoren te betrachten ten opzichte van degenen wiens belangen zij als zodanig behartigen of
      behoren te behartigen, inbreuken op verordeningen van de Nederlandse orde van advocaten en enig handelen of nalaten
      dat een behoorlijk advocaat niet betaamt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45a
  - number: 45a.2
    text: |-
      Ten behoeve van het houden van het toezicht, bedoeld in het eerste lid, zijn de advocaat, zijn medewerkers
      en personeel, alsmede andere personen die bij de beroepsuitoefening betrokken zijn, niet gehouden aan de
      geheimhoudingsplicht, bedoeld in [artikel 11a][ref1]. In dat geval geldt voor de deken alsmede voor de door
      hem ten behoeve van de uitoefening van het toezicht ingeschakelde medewerkers, personeel en andere personen een
      geheimhoudingsplicht, gelijk aan die bedoeld in artikel 11a.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel11a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 11a
        afdeling: '2'
  - number: 45b
    text: |-
      De deken van de algemene raad kan aan de deken van de orde in het arrondissement,
      gehoord de overige leden van het college van toezicht, aanwijzingen geven met betrekking
      tot de uitoefening van de taken, bedoeld in [artikel 45a, eerste lid][ref1], en
      [artikel 24, tweede lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 45a
        afdeling: 3a
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '24'
  - number: 45c.1
    text: |-
      Het hof van discipline schorst op verzoek van het college van toezicht een deken
      in de taakuitoefening de [artikelen 45a, eerste lid][ref1], [46c][ref2], en
      [artikel 24, tweede lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref3], indien en
      voor zolang:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 45a
        afdeling: 3a
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '24'
  - number: 45c.1.a
    text: hij zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45c
  - number: 45c.1.b
    text: |-
      hij bij nog niet onherroepelijk geworden rechterlijke uitspraak wegens een misdrijf is veroordeeld dan wel hem bij
      een dergelijke uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft; of
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45c
  - number: 45c.1.c
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, hij surseance van betaling heeft verkregen, dan wel wegens schulden is gegijzeld.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45c
  - number: 45c.2
    text: |-
      Het hof van discipline kan op verzoek van het college een deken schorsen
      in de taakuitoefening de [artikelen 45a, eerste lid][ref1], [46c][ref2], en
      [artikel 24, tweede lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref3], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 45a
        afdeling: 3a
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '24'
  - number: 45c.2.a
    text: tegen hem een gerechtelijk vooronderzoek ter zake van een misdrijf is ingesteld; of
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45c
  - number: 45c.2.b
    text: |-
      er een ander ernstig vermoeden is voor het bestaan van feiten of omstandigheden die tot ontslag zouden kunnen
      leiden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45c
  - number: 45c.3
    text: |-
      Het hof van discipline beëindigt desgevraagd of ambtshalve een schorsing als bedoeld in het eerste of tweede lid,
      wanneer de grond hiervoor is vervallen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45c
  - number: 45c.4
    text: |-
      Het hof van discipline ontheft op verzoek van het college een deken van
      de taakuitoefening de [artikelen 45a, eerste lid][ref1], [46c][ref2], en
      [artikel 24, tweede lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref3], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 45a
        afdeling: 3a
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '24'
  - number: 45c.4.a
    text: |-
      de deken bij onherroepelijk geworden rechterlijke uitspraak wegens een misdrijf is veroordeeld dan wel hem bij een
      dergelijke uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft; of
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45c
  - number: 45c.4.b
    text: |-
      de deken bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van faillissement
      is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij
      surseance van betaling heeft verkregen, dan wel wegens schulden is gegijzeld.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45c
  - number: 45c.5
    text: |-
      Tegen een beslissing van het hof van discipline op grond van dit artikel kan door een belanghebbende
      overeenkomstig [artikel 8:1 van de Algemene wet bestuursrecht][ref1] beroep worden ingesteld bij de rechtbank.
      [Artikel 7:1 van de Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 45c.6
    text: |-
      Ingeval het hof van discipline toepassing geeft aan het eerste tot en met vierde
      lid, wordt de taakuitoefening de [artikelen 45a, eerste lid][ref1], [46c][ref2], en
      [artikel 24, tweede lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref3], waargenomen
      door het in [artikel 23, eerste lid][ref4], bedoelde lid van de raad van de orde in het arrondissement.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel23
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 45a
        afdeling: 3a
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0024282
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0002093
        artikel: '23'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 45d.1
    text: |-
      Het college van toezicht kan de jaarlijkse vergadering van de orde, bedoeld in [artikel 22, tweede lid][ref1],
      schriftelijk verzoeken de deken van de orde in het arrondissement te ontslaan en in zijn plaats een andere deken
      te kiezen, wegens tekortschieten in de taakuitoefening de [artikelen 45a, eerste lid][ref2], [46c][ref3], of
      [artikel 24, tweede lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref4], wegens
      ongeschiktheid of onbekwaamheid voor de functie dan wel andere zwaarwegende in de persoon van betrokkene gelegen
      redenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Artikel24
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45d
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '22'
        paragraaf: Afdeling_1
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 45a
        afdeling: 3a
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0024282
        artikel: '24'
  - number: 45d.2
    text: |-
      Het in het eerste lid bedoelde verzoek wordt gericht tot het in [artikel 23, eerste lid][ref1], bedoelde lid van de
      raad van de orde in het arrondissement. De jaarlijkse vergadering van de orde in het arrondissement komt binnen zes
      weken na indiening van het verzoek bijeen om op het verzoek te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel23
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45d
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '23'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 45e.1
    text: |-
      Het college van toezicht stelt een jaarrekening en een begroting vast, welke de goedkeuring behoeven van Onze
      Minister voor Rechtsbescherming, gehoord de algemene raad.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45e
  - number: 45e.2
    text: |-
      Op de beslissing omtrent de goedkeuring, bedoeld in het eerste lid, is
      [afdeling 10.2.1 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.1
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.1
  - number: 45e.3
    text: Bij de toepassing van het eerste lid maakt de deken geen deel uit van de algemene raad.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45e
  - number: 45f.1
    text: |-
      Het college van toezicht stelt jaarlijks een werkplan vast, alsmede een verslag van werkzaamheden, waarin in
      ieder geval het gevoerde beleid in het algemeen en de doelmatigheid en doeltreffendheid van zijn werkzaamheden en
      werkwijze in het bijzonder in het afgelopen jaar worden neergelegd.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45f
  - number: 45f.2
    text: |-
      Het werkplan en het verslag worden toegezonden aan Onze Minister voor Rechtsbescherming, de algemene raad, het
      college van afgevaardigden en de raden van de orden in de arrondissementen, en worden voorts algemeen verkrijgbaar
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45f
  - number: 45g.1
    text: |-
      De deken kan voor de overtreding van het bepaalde bij of krachtens een verordening als bedoeld in de
      [artikelen 9b, zevende lid][ref1], [9c, tweede lid][ref2], en [28, tweede lid, onderdelen a tot en met d][ref3],
      een bestuurlijke boete of een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel9c
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45g
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 9b
        afdeling: 1a
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 9c
        afdeling: 1a
      - id: ref3
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 45g.2
    text: |-
      De bestuurlijke boete bedraagt ten hoogste een bedrag van de geldboete van de derde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45g
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 45g.3
    text: |-
      Een bestuurlijke boete wordt niet opgelegd indien tegen de advocaat jegens dezelfde gedraging een klacht is
      ingediend op grond van [artikel 46c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45g
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
  - number: 45g.4
    text: |-
      Het bedrag van de opgelegde bestuurlijke boete en de verbeurde last onder dwangsom komt ten bate aan de Nederlandse
      orde van advocaten.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45g
  - number: 45h
    text: |-
      Het college van toezicht stelt beleidsregels vast voor de uitoefening
      van de taken ingevolge [artikel 45a, eerste lid][ref1], en
      [artikel 24, tweede lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref2], en
      [46c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45h
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 45a
        afdeling: 3a
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
  - number: 45i.1
    text: |-
      Het college van toezicht ziet toe op de werking van het toezicht, bedoeld in [artikel 45a, eerste lid][ref1],
      en [artikel 24, tweede lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref2] en de
      klachtbehandeling door de deken ingevolge [artikel 46c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45i
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 45a
        afdeling: 3a
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
  - number: 45i.2
    text: |-
      De deken van de orde in het arrondissement verstrekt aan het college alle informatie die deze redelijkerwijs nodig
      heeft voor de uitoefening van de in het eerste lid bedoelde taak.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel45i
  - number: '46'
    text: |-
      De advocaten zijn aan tuchtrechtspraak onderworpen ter zake van enig handelen of nalaten in strijd met
      de zorg die zij als advocaat behoren te betrachten ten opzichte van degenen wier belangen zij als zodanig
      behartigen of behoren te behartigen, ter zake van inbreuken op het bepaalde bij of krachtens deze wet en de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1], de verordeningen van de Nederlandse orde
      en ter zake van enig handelen of nalaten dat een behoorlijk advocaat niet betaamt. Deze tuchtrechtspraak wordt
      uitgeoefend in eerste aanleg door de raden van discipline en in hoger beroep, tevens in hoogste ressort, door het
      hof van discipline.


      [ref1]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0024282
  - number: 46a.1
    text: |-
      De kosten die samenhangen met de uitoefening van tuchtrechtspraak en ingevolge de bepalingen bij of krachtens
      deze wet ten laste komen van de staat worden door de Nederlandse orde van advocaten vergoed aan de staat. Bij
      verordening kunnen regels worden gesteld over de doorberekening van de kosten die de Nederlandse orde van advocaten
      maakt in verband met de uitoefening van tuchtrechtspraak aan haar leden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46a
  - number: 46a.2
    text: |-
      De raden van discipline en het hof van discipline stellen jaarlijks een jaarverslag op alsmede een begroting van
      de in het daaropvolgende jaar te verwachten inkomsten en uitgaven met betrekking tot de uitvoering van de bij of
      krachtens deze wet opgedragen taken en daaruit voortvloeiende werkzaamheden op het terrein van de tuchtrechtspraak.
      De begrotingsposten worden van een toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46a
  - number: 46a.3
    text: |-
      Tenzij de werkzaamheden waarop de begroting betrekking heeft nog niet eerder werden verricht, bevat de begroting
      een vergelijking met de begroting van het lopende jaar waarmee Onze Minister voor Rechtsbescherming heeft
      ingestemd.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46a
  - number: 46a.4
    text: |-
      De raden van discipline en het hof van discipline zenden de begroting voor een door Onze Minister voor
      Rechtsbescherming te bepalen tijdstip voorafgaande aan het begrotingsjaar ter instemming aan Onze Minister voor
      Rechtsbescherming.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46a
  - number: 46a.5
    text: |-
      Onze Minister voor Rechtsbescherming stemt niet in met de begroting dan nadat de algemene raad van de Nederlandse
      orde van advocaten is gehoord. De instemming kan worden onthouden wegens strijd met het recht of het algemeen
      belang. Ingeval van gebleken strijdigheid wordt instemming niet onthouden dan nadat de raden van discipline en het
      hof van discipline in de gelegenheid zijn gesteld de begroting aan te passen, binnen een door Onze Minister voor
      Rechtsbescherming te stellen redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46a
  - number: 46a.6
    text: |-
      Wanneer Onze Minister voor Rechtsbescherming niet met de begroting heeft ingestemd vóór 1 januari van het jaar
      waarop deze betrekking heeft, kunnen de raden van discipline en het hof van discipline, in het belang van een
      juiste uitvoering van zijn taak, voor het aangaan van verplichtingen en het verrichten van uitgaven beschikken over
      ten hoogste drie twaalfde gedeelten van de bedragen die bij de overeenkomstige onderdelen in de begroting van het
      voorafgaande jaar waren toegestaan.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46a
  - number: 46a.7
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en begrote
      baten en lasten dan wel inkomsten en uitgaven, doen de raden van discipline en het hof van discipline daarvan
      onverwijld mededeling aan Onze Minister voor Rechtsbescherming onder vermelding van de oorzaak en de verwachte
      omvang van de verschillen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46a
  - number: 46a.8
    text: |-
      De raden van discipline en het hof van discipline zenden het jaarverslag voor een door Onze Minister voor
      Rechtsbescherming te bepalen tijdstip aan Onze Minister voor Rechtsbescherming.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46a
  - number: 46a.9
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inrichting van de begroting en de inhoud van het
      jaarverslag.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46a
  - number: 46aa.1
    text: |-
      In het rechtsgebied van elk gerechtshof is een raad van discipline, wiens rechtsgebied samenvalt met dat van het
      gerechtshof en die de tuchtrechtspraak in eerste aanleg uitoefent met betrekking tot de advocaten, kantoorhoudende
      in dat gebied.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46aa
  - number: 46aa.2
    text: |-
      Een raad van discipline is gevestigd in een bij bestuursreglement vast te stellen plaats binnen het ressort. Een
      raad van discipline kan ook buiten de vestigingsplaats zitting houden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46aa
  - number: 46aa.3
    text: |-
      Met betrekking tot de leden-advocaten, de plaatsvervangende leden-advocaten en de griffier van de raden van
      discipline, voor zover deze advocaat is, wordt de tuchtrechtspraak in eerste aanleg uitgeoefend door een door de
      voorzitter van het hof van discipline naar aanleiding van een ingekomen klacht ambtshalve aan te wijzen andere raad
      van discipline. Van een zodanige verwijzing geeft de voorzitter van het hof van discipline kennis aan de aangewezen
      raad van discipline, aan de raad van discipline waarvan de beklaagde lid-advocaat, plaatsvervangend lid of griffier
      is, aan de deken van de orde in het arrondissement waar de beklaagde advocaat kantoor houdt, en aan de klager.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46aa
  - number: 46aa.4
    text: |-
      Aanwijzing van een andere raad van discipline overeenkomstig het derde lid vindt ook plaats indien een klacht
      betrekking heeft op een deken binnen het rechtsgebied van een raad van discipline of afkomstig is van een lid-
      advocaat, een plaatsvervangend lid-advocaat of de griffier van een raad van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46aa
  - number: 46aa.5
    text: |-
      Indien de klacht is ingediend tegen of betrekking heeft op meerdere advocaten die in verschillende ressorten
      kantoor houden of indien tussen klachten een zodanige samenhang bestaat dat redenen van doelmatigheid een
      gezamenlijke behandeling rechtvaardigen, kan het hof van discipline een raad van discipline aanwijzen die de klacht
      dan wel de klachten behandelt. Het derde lid, tweede volzin, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46aa
  - number: 46b.1
    text: |-
      Elke raad van discipline bestaat uit een voorzitter, ten hoogste dertien plaatsvervangende voorzitters, ten hoogste
      zestien leden-advocaten en ten hoogste 30 plaatsvervangende leden-advocaten. De voorzitter en plaatsvervangende
      voorzitters onderscheidenlijk de leden-advocaten en plaatsvervangende leden-advocaten van een raad van discipline
      zijn van rechtswege plaatsvervangende voorzitters onderscheidenlijk plaatsvervangende leden-advocaten van de
      overige raden van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
  - number: 46b.2
    text: |-
      De voorzitter en plaatsvervangende voorzitters worden door Onze Minister voor Rechtsbescherming voor de tijd van
      vier jaren benoemd uit leden van de rechterlijke macht met rechtspraak belast.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
  - number: 46b.3
    text: |-
      De leden-advocaten en de plaatsvervangende leden-advocaten kunnen alleen zijn advocaten die kantoor houden binnen
      het rechtsgebied van de betrokken raad, die langer dan vijf jaar in Nederland zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
  - number: 46b.4
    text: |-
      De leden-advocaten en de plaatsvervangende leden-advocaten worden door het college van afgevaardigden in de in
      [artikel 19, eerste lid][ref1], bedoelde vergadering gekozen uit voordrachten van de raden van de orden in de
      arrondissementen, voor de tijd van ten hoogste vier jaren. De verkiezing geschiedt met inachtneming van het streven
      naar een regionaal verantwoorde samenstelling van de raden van discipline.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel19
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '19'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 46b.5
    text: De voorzitter en plaatsvervangend voorzitters zijn na hun aftreden eenmaal terstond herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
  - number: 46b.6
    text: |-
      Van de leden-advocaten en de plaatsvervangende leden-advocaten treedt volgens een door de betrokken raad van
      discipline vast te stellen rooster jaarlijks een vierde deel af.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
  - number: 46b.7
    text: |-
      De voorzitter, de plaatsvervangende voorzitters, de leden-advocaten en de plaatsvervangende leden-advocaten treden
      in ieder geval af met ingang van de eerstvolgende maand na die waarin zij de leeftijd van zeventig jaren hebben
      bereikt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
  - number: 46b.8
    text: |-
      Indien de zetel van voorzitter of plaatsvervangend voorzitter tussentijds vacant raakt, voorziet Onze Minister voor
      Rechtsbescherming zo spoedig mogelijk in de vacature.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
  - number: 46b.9
    text: |-
      In vacatures, die tussentijds ontstaan, voorziet het college van afgevaardigden zo spoedig mogelijk, zo nodig in
      een buitengewone vergadering. Het is daarbij niet aan een voordracht gebonden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
  - number: 46b.10
    text: |-
      Zij die benoemd zijn ter vervulling van een tussentijds opengevallen plaats treden af op het tijdstip, waarop
      degenen in wier plaats zij zijn benoemd hadden moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
  - number: 46b.11
    text: |-
      De voorzitter, de plaatsvervangende voorzitters, de leden-advocaten en de plaatsvervangende leden-advocaten blijven
      na het verstrijken van hun ambtstermijn in functie, totdat de door hun aftreden vacante plaats weer is vervuld. Zij
      blijven na hun aftreden, ook nadat in de door hen opengelaten plaatsen is voorzien, bevoegd om deel te nemen aan
      de verdere behandeling van en de beslissing over klachten, aan de behandeling waarvan zij voor hun aftreden reeds
      hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
  - number: 46b.12
    text: |-
      Het lidmaatschap of plaatsvervangend lidmaatschap van een raad van discipline is niet verenigbaar met het
      lidmaatschap of het plaatsvervangend lidmaatschap van het hof van discipline, een orgaan van de Nederlandse orde
      van advocaten of een orgaan van de orden in de arrondissementen, uitgezonderd de jaarlijkse vergadering van de
      orde, bedoeld in [artikel 22, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel22
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '22'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 46b.13
    text: |-
      Tussen de voorzitter, plaatsvervangende voorzitters, de leden-advocaten en de plaatsvervangende leden-advocaten
      van een raad van discipline mag niet bestaan de verhouding van echtgenoten of geregistreerde partners, bloed- of
      aanverwanten tot de derde graad ingesloten, een maatschap of ander duurzaam samenwerkingsverband tot het uitoefenen
      van het beroep van advocaat of de verhouding van werkgever tot werknemer.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
  - number: 46b.14
    text: |-
      Het in de [artikelen 46c, onderdelen b en c][ref1], [46ca, eerste lid, onderdeel d][ref2],
      [46d, tweede lid][ref3], [46f][ref4], [46i, met uitzondering van het eerste lid, onderdeel c][ref5],
      [46j][ref6], [46l, eerste en derde lid][ref7], [46m][ref8], [46o][ref9] en
      [46p van de Wet rechtspositie rechterlijke ambtenaren][ref10] bepaalde is van overeenkomstige toepassing ten
      aanzien van de voorzitter, plaatsvervangende voorzitters, de leden-advocaten en de plaatsvervangende leden-
      advocaten van de raad van discipline.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46ca
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46ca
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46f
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46m
      - id: ref9
        bwb_id: BWBR0008365
        artikel: 46o
      - id: ref10
        bwb_id: BWBR0008365
        artikel: 46p
  - number: 46b.15
    text: |-
      De leden-advocaten en de plaatsvervangende leden-advocaten van de raad van discipline kunnen worden
      ontslagen op de gronden aangegeven in de [artikelen 46c, onderdelen b en c][ref1], [46d, tweede lid][ref2],
      [46i, met uitzondering van het eerste lid, onderdeel c][ref3], [46j][ref4], [46l, eerste en derde lid][ref5], en
      [46m van de Wet rechtspositie rechterlijke ambtenaren][ref6]. Daarnaast vervalt het lidmaatschap van de leden-
      advocaten en de plaatsvervangende leden-advocaten van rechtswege zodra zij opgehouden hebben advocaat te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46m
  - number: 46b.16
    text: |-
      De raad van discipline wijst zijn griffier aan en ontslaat deze. De raad van discipline voorziet in vervanging van
      de griffier bij verhindering of afwezigheid.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
  - number: 46b.17
    text: |-
      De [artikelen 13a][ref1], [13b, uitgezonderd het eerste lid, onderdelen b en c, en vierde lid][ref2], en
      [13c tot en met 13g van de Wet op de rechterlijke organisatie][ref3] zijn van overeenkomstige toepassing
      ten aanzien van gedragingen van de voorzitter, de plaatsvervangende voorzitters, de leden-advocaten en de
      plaatsvervangende leden-advocaten, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel13b
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel13c
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: 13a
      - id: ref2
        bwb_id: BWBR0001830
        artikel: 13b
      - id: ref3
        bwb_id: BWBR0001830
        artikel: 13c
  - number: 46b.17.a
    text: |-
      voor de overeenkomstige toepassing van die artikelen onder «het betrokken gerechtsbestuur» wordt verstaan: de
      voorzitter van de raad van discipline; en
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
  - number: 46b.17.b
    text: |-
      de procureur-generaal niet verplicht is aan het verzoek, bedoeld in [artikel 13a][ref1], te voldoen, indien de
      verzoeker redelijkerwijs onvoldoende belang heeft bij een onderzoek als bedoeld in datzelfde artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: 13a
  - number: 46ba.1
    text: |-
      De griffier en de leden zijn voor hun werkzaamheden uitsluitend verantwoording verschuldigd aan de raad van
      discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46ba
  - number: 46ba.2
    text: |-
      [Artikel 42 van de Wet rechtspositie rechterlijke ambtenaren][ref1] is van overeenkomstige toepassing op de
      voorzitter, de leden en de griffier.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel42
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46ba
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '42'
  - number: 46c.1
    text: |-
      Klachten tegen advocaten worden schriftelijk ingediend bij de deken van de orde waartoe zij behoren. Indien de
      klager daarom verzoekt, is de deken hem behulpzaam bij het op schrift stellen van de klacht. Indien een ingediende
      klacht verduidelijking behoeft, is de deken de klager daarbij op diens verzoek behulpzaam.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46c
  - number: 46c.2
    text: |-
      Indien de klager bij indiening van de klacht daarom verzoekt, brengt de deken deze onmiddellijk ter kennis van
      de raad van discipline, onverminderd het bepaalde in het derde lid. De deken informeert de klager hierover bij de
      indiening van de klacht.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46c
  - number: 46c.3
    text: De deken stelt een onderzoek in naar elke bij hem ingediende klacht.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46c
  - number: 46c.4
    text: |-
      De deken is bevoegd een bij hem ingediende klacht te verwijzen naar een lid van de raad van de orde in
      het arrondissement, ten einde haar te onderzoeken en af te handelen op de wijze als in dit artikel en de
      [artikelen 46d][ref1] en [46e][ref2] omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46d
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel46e
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46d
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 46e
        paragraaf: '4'
  - number: 46c.5
    text: |-
      Klachten tegen een deken worden ingediend bij of terstond doorgezonden aan de voorzitter van het hof van
      discipline. De voorzitter verwijst de zaak naar een deken van een andere orde, ten einde haar te onderzoeken en
      af te handelen overeenkomstig het bepaalde in dit artikel en de [artikelen 46d][ref1] en [46e][ref2]. Na onderzoek
      en afhandeling brengt de deken naar wie de zaak is verwezen de klacht ter kennis van de raad van discipline in het
      ressort waartoe hij behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46d
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel46e
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46d
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 46e
        paragraaf: '4'
  - number: 46c.6
    text: |-
      De raad van de orde in het arrondissement draagt zorg voor voldoende bekendmaking in het arrondissement van de
      plaats en de tijd waarop de deken, of, bij zijn ontstentenis of verhindering, zijn plaatsvervanger, zitting houdt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46c
  - number: 46d.1
    text: |-
      De deken tracht steeds de klacht in der minne te schikken, tenzij deze overeenkomstig
      [artikel 46c, tweede lid][ref1] onmiddellijk aan de raad van discipline ter kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46c
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46c
        paragraaf: '4'
  - number: 46d.2
    text: |-
      Indien een minnelijke schikking mogelijk blijkt, wordt deze op schrift gesteld en door de klager, de advocaat tegen
      wie de klacht is ingediend en de deken ondertekend. Door een aldus vastgestelde minnelijke schikking vervalt de
      bevoegdheid van de klager om de terkennisbrenging van de klacht aan de raad van discipline te verlangen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46d
  - number: 46d.3
    text: |-
      Indien na drie maanden na de indiening van de klacht bij de deken geen minnelijke schikking is bereikt, kan de
      klager de deken verzoeken de klacht ter kennis van de raad van discipline te brengen. Tenzij toepassing wordt
      gegeven aan [artikel 45g, eerste lid][ref1], geeft de deken in dat geval toepassing aan het vierde lid. De deken
      brengt de klacht steeds ter kennis van de raad van discipline indien geen toepassing wordt gegeven aan artikel 45g,
      eerste lid, en aannemelijk is dat een minnelijke schikking niet kan worden bereikt of indien naar zijn oordeel de
      inhoud van de klacht een minnelijke schikking ongewenst of onmogelijk maakt. De deken informeert de klager hierover
      bij de indiening van de klacht.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel45g
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 45g
        afdeling: 3a
  - number: 46d.4
    text: |-
      De deken brengt de klacht schriftelijk ter kennis van de raad van discipline en stelt de betrokken
      advocaat en de klager daarvan schriftelijk op de hoogte. De klacht kan elektronisch naar de raad
      van discipline worden gezonden voor zover de raad kenbaar heeft gemaakt dat deze weg is geopend. De
      [artikelen 2:14 tot en met 2:17 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing, met
      dien verstande dat in plaats van «bestuursorgaan» wordt gelezen: raad van discipline.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 46d.5
    text: 'De klacht wordt gedagtekend en ondertekend en bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46d
  - number: 46d.5.a
    text: de naam en het adres van de klager;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46d
  - number: 46d.5.b
    text: de naam en het werkadres van de advocaat tegen wie de klacht zich richt, voor zover bekend bij de klager;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46d
  - number: 46d.5.c
    text: een zo duidelijk mogelijke omschrijving van de klacht en van de feiten waarop deze rust.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46d
  - number: 46d.6
    text: |-
      Tegelijkertijd met de klacht worden alle op de zaak betrekking hebbende stukken aan de raad van discipline
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46d
  - number: 46d.7
    text: |-
      In de klacht wordt vermeld of de klacht voordien is voorgelegd aan de organisatie waarbinnen de advocaat werkzaam
      is of aan een klachten- of geschilleninstantie waarbij de advocaat of diens organisatie is aangesloten. Indien
      zulks niet het geval is geweest, wordt indien mogelijk de reden daarvoor in de klacht vermeld. Indien zulks wel het
      geval is geweest, wordt de uitkomst van de procedure vermeld, zo mogelijk met bijvoeging van de relevante stukken.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46d
  - number: 46d.8
    text: |-
      Indien de deken op grond van zijn onderzoek van oordeel is dat de klacht kennelijk ongegrond of van onvoldoende
      gewicht is, kan hij dat met redenen omkleed meedelen aan de klager, de betrokken advocaat en de raad van
      discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46d
  - number: 46d.9
    text: De raad van discipline kan de klacht ambtshalve aanvullen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46d
  - number: 46e.1
    text: |-
      Alvorens een klacht ter kennis van de raad van discipline te brengen heft de deken van de klager een griffierecht
      van € 50. Het griffierecht komt ten bate van de raad van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46e
  - number: 46e.2
    text: |-
      De deken wijst de klager op de verschuldigdheid van het griffierecht en deelt hem mee dat het verschuldigde bedrag
      binnen vier weken na de dag van verzending van zijn mededeling dient te zijn bijgeschreven op het daartoe bekend
      gemaakte bankrekeningnummer.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46e
  - number: 46e.3
    text: |-
      Indien het griffierecht niet binnen de in het tweede lid bedoelde termijn is bijgeschreven op het daartoe bekend
      gemaakte bankrekeningnummer, brengt de deken de klacht niet ter kennis van de raad van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46e
  - number: 46e.4
    text: |-
      Indien toepassing wordt gegeven aan [artikel 46n, tweede lid][ref1], kan als onderdeel van de minnelijke schikking
      door partijen worden bepaald dat het door klager betaalde griffierecht wordt vergoed door de advocaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46n
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46n
        paragraaf: '4'
  - number: 46e.5
    text: |-
      Indien de klacht geheel of gedeeltelijk gegrond wordt verklaard, wordt het door de klager betaalde griffierecht
      vergoed door de betrokken advocaat.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46e
  - number: 46e.6
    text: In afwijking van het eerste lid wordt geen griffierecht geheven indien de klacht afkomstig is van de deken.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46e
  - number: 46e.7
    text: |-
      Onze Minister voor Rechtsbescherming kan het in het eerste lid bedoelde bedrag wijzigen voor zover de
      consumentenprijsindex daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46e
  - number: 46f
    text: |-
      Indien de deken buiten het geval van een klacht op de hoogte is gebracht van bezwaren tegen een advocaat, kan
      hij deze ter kennis van de raad van discipline brengen. Hij stelt daarvan de advocaat tegen wie de bezwaren zijn
      gerezen schriftelijk op de hoogte.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46f
  - number: 46fa.1
    text: |-
      Indien de advocaat jegens wie een klacht is ingediend of jegens wie bezwaren bestaan zich krachtens het nationale
      recht van een andere lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte dat uitvoering geeft aan artikel 3 van [richtlijn 98/5/EG](31998L0005)
      van het Europees Parlement en de Raad van de Europese Unie van 16 februari 1998 ter vergemakkelijking van de
      permanente uitoefening van het beroep van advocaat, heeft laten inschrijven, stelt de deken voor de aanvang van de
      tuchtrechtelijke procedure de bevoegde autoriteit in die lidstaat of lidstaten op de hoogte van het voornemen een
      tuchtrechtelijke procedure jegens de advocaat aan te vangen en verstrekt hij aan die autoriteit of autoriteiten
      alle dienstige inlichtingen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46fa
  - number: 46fa.2
    text: |-
      Indien de advocaat zich in Zwitserland heeft laten inschrijven met inachtneming van de op 21 juni 1999 tot
      stand gekomen Overeenkomst tussen de Europese Gemeenschap en haar lidstaten enerzijds en de Zwitserse Bondsstaat
      anderzijds, over het vrije verkeer van personen, is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46fa
  - number: 46fb.1
    text: |-
      De griffier van de raad van discipline zendt zo spoedig mogelijk een afschrift van de klacht, de daarbij gevoegde
      stukken en eventuele aanvullingen daarop aan de advocaat tegen wie de klacht zich richt en de deken van de orde
      waartoe de betrokken advocaat behoort.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46fb
  - number: 46fb.2
    text: |-
      Geen afschrift hoeft te worden gezonden aan de deken voor zover de klacht door hem is ingediend, of indien
      toepassing wordt gegeven aan het bepaalde in [artikel 46i, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46i
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46fb
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46i
        paragraaf: '4'
  - number: 46g.1
    text: 'Een klacht wordt door de voorzitter van de raad van discipline niet-ontvankelijk verklaard:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46g
  - number: 46g.1.a
    text: |-
      indien de klacht wordt ingediend na verloop van drie jaren na de dag waarop de klager heeft kennisgenomen of
      redelijkerwijs kennis heeft kunnen nemen van het handelen of nalaten van de advocaat waarop de klacht betrekking
      heeft; of
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46g
  - number: 46g.1.b
    text: |-
      voor zover deze betrekking heeft op een gedraging waarvoor een boete is opgelegd als bedoeld in
      [artikel 45g, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel45g
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46g
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 45g
        afdeling: 3a
  - number: 46g.2
    text: |-
      Ten aanzien van een na afloop van de in het eerste lid, onder a, bedoelde termijn ingediende klacht blijft niet-
      ontvankelijk verklaring op grond daarvan achterwege indien de gevolgen van het handelen of nalaten redelijkerwijs
      pas nadien bekend zijn geworden. In dat geval verloopt de termijn voor het indienen van een klacht een jaar na de
      datum waarop de gevolgen redelijkerwijs als bekend geworden zijn aan te merken.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46g
  - number: 46g.3
    text: 'Een klacht kan niet-ontvankelijk worden verklaard:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46g
  - number: 46g.3.a
    text: |-
      indien niet is voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de klacht, mits de klager
      de gelegenheid heeft gehad het verzuim binnen een redelijke termijn te herstellen; of
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46g
  - number: 46g.3.b
    text: |-
      indien de klacht betrekking heeft op de hoogte van een declaratie en een geschil daarover reeds is of kan worden
      voorgelegd aan een klachten- of geschilleninstantie als bedoeld in [artikel 28, tweede lid, onder b][ref1], of
      waarvoor deze weg heeft open gestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46g
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 46h.1
    text: |-
      Tegen een beslissing als bedoeld in [artikel 46g, eerste lid, aanhef en onder a][ref1], kunnen de klager, de
      betrokken advocaat en de deken binnen dertig dagen na de dag van verzending van het afschrift van de beslissing
      schriftelijk gemotiveerd verzet doen bij de raad van discipline.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46g
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46h
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46g
        paragraaf: '4'
  - number: 46h.2
    text: |-
      Alvorens te beslissen op het verzet, stelt de raad van discipline de in het eerste lid bedoelde personen en
      instanties in de gelegenheid te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46h
  - number: 46h.3
    text: |-
      Het verzet wordt behandeld in een samenstelling van de raad waarvan degenen die de in het eerste lid bedoelde
      beslissing hebben genomen geen deel uitmaken.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46h
  - number: 46h.4
    text: 'De beslissing op verzet is met redenen omkleed en strekt tot:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46h
  - number: 46h.4.a
    text: niet-ontvankelijkverklaring van het verzet;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46h
  - number: 46h.4.b
    text: ongegrondverklaring van het verzet; of
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46h
  - number: 46h.4.c
    text: gegrondverklaring van het verzet.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46h
  - number: 46h.5
    text: |-
      Indien de raad het verzet niet-ontvankelijk of ongegrond verklaart, blijft de beslissing waartegen verzet was
      gedaan in stand.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46h
  - number: 46h.6
    text: |-
      Indien het verzet gegrond wordt verklaard, vervalt de beslissing waartegen verzet was gedaan en wordt de
      behandeling van de zaak voortgezet.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46h
  - number: 46h.7
    text: |-
      Tegen de beslissing op verzet staat geen rechtsmiddel open. Van de beslissing zendt de griffier van de raad
      onverwijld een afschrift aan de in het eerste lid bedoelde personen en instanties.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46h
  - number: 46h.8
    text: |-
      In afwijking van het zesde lid kan de raad onmiddellijk uitspraak doen op de klacht, indien het verzet gegrond is
      en nader onderzoek of nadere behandeling redelijkerwijs niet kan bijdragen aan de beoordeling van de klacht.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46h
  - number: 46i.1
    text: |-
      Indien de klacht zich naar het oordeel van de voorzitter van de raad van discipline daartoe leent, en uit de
      klacht blijkt dat de klacht nog niet is voorgelegd aan een instantie die bevoegd is kennis te nemen van klachten
      of geschillen op grond van een regeling als bedoeld in [artikel 28, tweede lid, onder b][ref1], kan de voorzitter
      besluiten de klacht in handen te stellen van de bevoegde instantie. Hij doet hiervan schriftelijk mededeling aan de
      klager, de betrokken advocaat en de deken.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel28
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '28'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 46i.2
    text: |-
      Indien de voorzitter toepassing geeft aan het eerste lid, stelt hij de op de zaak betrekking hebbende
      stukken in handen van de klachten- of geschilleninstantie. De beslissing schorst de termijn, bedoeld in
      [artikel 46g, eerste lid, onder a][ref1]. Tegen de beslissing staat geen rechtsmiddel open.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46g
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46g
        paragraaf: '4'
  - number: 46j.1
    text: 'Tot aan de behandeling van de klacht ter zitting kan de voorzitter van de raad van discipline besluiten dat:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46j
  - number: 46j.1.a
    text: de raad kennelijk onbevoegd is;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46j
  - number: 46j.1.b
    text: de klacht kennelijk niet-ontvankelijk is;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46j
  - number: 46j.1.c
    text: de klacht kennelijk ongegrond is; of
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46j
  - number: 46j.1.d
    text: de klacht kennelijk van onvoldoende gewicht is.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46j
  - number: 46j.2
    text: |-
      De beslissing als bedoeld in het eerste lid wordt met redenen omkleed. Daarbij wordt gewezen op het bepaalde in het
      vierde lid.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46j
  - number: 46j.3
    text: |-
      Van de beslissing zendt de griffier van de raad onverwijld een afschrift aan de in het
      [artikel 46i, eerste lid, tweede volzin][ref1], bedoelde personen en instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46i
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46j
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46i
        paragraaf: '4'
  - number: 46j.4
    text: |-
      [Artikel 46h][ref1] is van overeenkomstige toepassing ten aanzien van de beslissing in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46h
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46j
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46h
        paragraaf: '4'
  - number: 46k.1
    text: |-
      De voorzitter van de raad van discipline kan de betrokken advocaat in de gelegenheid stellen om binnen vier weken
      na de dag van verzending van het afschrift van de klacht overeenkomstig [artikel 46fb, eerste lid][ref1], een
      verweerschrift in te dienen. De griffier van de raad zendt een afschrift van het verweerschrift aan de klager en
      de deken.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46fb
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46k
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46fb
        paragraaf: '4'
  - number: 46k.2
    text: |-
      Indien toepassing is gegeven aan het eerste lid, kan de voorzitter de klager in de gelegenheid stellen te
      repliceren binnen vier weken na verzending van een afschrift van het verweerschrift. De griffier zendt een
      afschrift van het repliek aan de advocaat, alsmede aan de deken, voor zover deze niet de klager is.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46k
  - number: 46k.3
    text: |-
      Indien toepassing wordt gegeven aan het tweede lid, stelt de voorzitter de betrokken advocaat in de gelegenheid te
      dupliceren binnen een termijn van vier weken na verzending van een afschrift van het repliek. De griffier zendt een
      afschrift van het dupliek aan de klager en de deken.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46k
  - number: 46k.4
    text: |-
      De voorzitter kan de in het eerste tot en met derde lid genoemde termijnen verlengen of deze termijnen op een ander
      moment laten aanvangen, indien hem blijkt dat daartoe in redelijkheid aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46k
  - number: 46l.1
    text: |-
      Tenzij toepassing wordt gegeven aan [artikel 46g][ref1], [46i][ref2], of [46j][ref3], kan de voorzitter van de
      raad van discipline, na verzending van een afschrift van de klacht op grond van [artikel 46fb, eerste lid][ref4],
      een vooronderzoek gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46g
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel46i
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel46j
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel46fb
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46l
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46g
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 46i
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 46j
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0002093
        artikel: 46fb
        paragraaf: '4'
  - number: 46l.2
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, draagt de voorzitter het vooronderzoek op aan de deken van de
      orde waartoe de betrokken advocaat behoort, tenzij hij gronden aanwezig acht om het onderzoek op te dragen aan:
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46l
  - number: 46l.2.a
    text: de deken van een andere orde;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46l
  - number: 46l.2.b
    text: een plaatsvervangend voorzitter;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46l
  - number: 46l.2.c
    text: een of meer leden of plaatsvervangende leden van de raad van discipline; of
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46l
  - number: 46l.2.d
    text: de griffier.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46l
  - number: 46l.3
    text: |-
      De voorzitter bepaalt de omvang van het vooronderzoek. Het vooronderzoek kan zich mede uitstrekken tot andere dan
      de in de klacht vermelde feiten.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46l
  - number: 46l.4
    text: |-
      De vooronderzoeker kan de voorzitter verzoeken de omvang van het vooronderzoek te wijzigen, binnen de grenzen van
      de klacht zoals deze op dat moment luidt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46l
  - number: 46l.5
    text: Het onderzoek wordt gesloten door het uitbrengen van een verslag aan de voorzitter door de vooronderzoeker.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46l
  - number: 46l.6
    text: |-
      De voorzitter kan besluiten dat het vooronderzoek wordt opgeschort of beëindigd voordat het verslag wordt
      uitgebracht.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46l
  - number: 46m.1
    text: De voorzitter van de raad van discipline kan de vooronderzoeker aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46m
  - number: 46m.2
    text: |-
      Op het vooronderzoek en de vooronderzoeker zijn de [artikelen 5:13 tot en met 5:17][ref1] en
      [5:20, eerste lid, van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing. Bij het opdragen van
      een vooronderzoek bepaalt de voorzitter welke bevoegdheden de vooronderzoeker namens de raad kan uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46m
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 46m.3
    text: |-
      Ten behoeve van het verrichten van vooronderzoek door de vooronderzoeker zijn de betrokken advocaat,
      zijn medewerkers en personeel, alsmede andere personen die betrokken zijn bij de beroepsuitoefening,
      niet gehouden aan de geheimhoudingsplicht, bedoeld in [artikel 11a][ref1]. In dat geval geldt voor de
      betrokken vooronderzoeker een geheimhoudingsplicht, gelijk aan die in bedoeld in artikel 11a, en is
      [artikel 218 van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel218
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46m
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 11a
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '218'
  - number: 46m.4
    text: |-
      Bij het verrichten van het vooronderzoek wordt een afschrift van de last tot het verrichten van het onderzoek zo
      mogelijk aan de betrokken advocaat getoond.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46m
  - number: 46m.5
    text: De vooronderzoeker stelt de klager en de betrokken advocaat in de gelegenheid te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46m
  - number: 46m.6
    text: |-
      Een lid of plaatsvervangend lid van de raad dat een vooronderzoek in een zaak heeft verricht, neemt op straffe van
      nietigheid van de beslissing van de raad in die zaak geen deel aan de behandeling van die zaak ter zitting.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46m
  - number: 46m.7
    text: |-
      Indien de klacht is ingediend door de deken, wordt het vooronderzoek niet aan hem opgedragen.
      In dat geval draagt de voorzitter het vooronderzoek op aan één van de personen, bedoeld in
      [artikel 46l, tweede lid, onderdeel a tot en met d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46l
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46m
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46l
        paragraaf: '4'
  - number: 46n.1
    text: |-
      De voorzitter van de raad van discipline kan de vooronderzoeker opdragen te onderzoeken of de klacht minnelijk kan
      worden geschikt. Voorts kan de voorzitter tot het moment waarop de raad uitspraak doet onderzoeken of de klacht
      minnelijk kan worden geschikt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46n
  - number: 46n.2
    text: |-
      Indien een minnelijke schikking van de klacht mogelijk blijkt, wordt deze op schrift gesteld en ondertekend door de
      klager en de betrokken advocaat. Een afschrift daarvan wordt gezonden aan de griffier van de raad, alsmede aan de
      deken en het college van toezicht.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46n
  - number: 46n.3
    text: |-
      Met het ondertekenen van de minnelijke schikking wordt de klacht geacht te zijn ingetrokken.
      [Artikel 47a, tweede, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel47a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel46n
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 47a
        paragraaf: '4'
  - number: '47.1'
    text: |-
      Aan de behandeling en de beslissing van tuchtzaken wordt op straffe van nietigheid deelgenomen door de voorzitter
      of een van de plaatsvervangende voorzitters, alsmede twee leden-advocaten of plaatsvervangende leden-advocaten.
      Indien de zaak naar het oordeel van een van deze leden ongeschikt is voor behandeling en beslissing door drie
      leden, wordt de behandeling voortgezet door vijf leden, onder wie de voorzitter of een van de plaatsvervangende
      voorzitters. Indien de voorzitter of plaatsvervangende voorzitter door na aanvang van de zaak opgekomen
      omstandigheden is verhinderd, kan deze worden vervangen door een plaatsvervangende voorzitter.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47
  - number: '47.2'
    text: |-
      De [artikelen 512 tot en met 519 van het Wetboek van Strafvordering][ref1] zijn ten aanzien van de voorzitter,
      de plaatsvervangende voorzitters, de leden-advocaten en de plaatsvervangende leden-advocaten van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel512
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '512'
  - number: 47a.1
    text: |-
      De klager kan zijn klacht tot aan de uitspraak door de raad van discipline intrekken. De griffier van de raad zendt
      een afschrift hiervan aan de betrokken advocaat en, voor zover hij niet de klager was, de deken.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47a
  - number: 47a.2
    text: 'Indien de klacht wordt ingetrokken, wordt de behandeling daarvan gestaakt, tenzij:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47a
  - number: 47a.2.a
    text: de betrokken advocaat schriftelijk heeft verklaard voortzetting van de behandeling te verlangen, of
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47a
  - number: 47a.2.b
    text: de raad om redenen van algemeen belang beslist dat de behandeling van de klacht wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47a
  - number: 47a.3
    text: |-
      De raad neemt een beslissing tot voortzetting van de behandeling van een klacht om redenen van algemeen belang niet
      dan nadat hij de betrokken advocaat en, voor zover hij niet de klager was, de deken de gelegenheid heeft geboden
      tot het innemen van een standpunt hierin.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47a
  - number: 47a.4
    text: |-
      Indien om redenen van algemeen belang wordt beslist tot voortzetting van de klacht, kan de raad bepalen dat de
      deken voor het vervolg van de zaak als klager wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47a
  - number: 47a.5
    text: Indien de betrokken advocaat overlijdt, wordt de behandeling van de klacht gestaakt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47a
  - number: 47a.6
    text: |-
      Indien de klager overlijdt, kan de raad om redenen van algemeen belang beslissen dat de behandeling van de klacht
      wordt voortgezet. Het derde en vierde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47a
  - number: 47a.7
    text: Tegen een beslissing tot voortzetting van de behandeling van een klacht staat geen zelfstandig rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47a
  - number: 47b.1
    text: |-
      Niemand kan in gevolge de bepalingen in deze paragraaf andermaal tuchtrechtelijk worden berecht voor een handelen
      of nalaten waarvoor ten aanzien van hem een onherroepelijk geworden tuchtrechtelijke eindbeslissing is genomen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47b
  - number: 47b.2
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47b
  - number: 47b.2.a
    text: |-
      indien over het handelen of nalaten een klacht is ingediend en tevens toepassing wordt gegeven aan
      [artikel 60ab, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60ab
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60ab
        paragraaf: 4a
  - number: 47b.2.b
    text: |-
      indien toepassing is gegeven aan [artikel 60ab, eerste en tweede lid][ref1], en op de voet van artikel 60ab, vijfde
      lid, alsnog een klacht over het betrokken handelen of nalaten wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60ab
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60ab
        paragraaf: 4a
  - number: 47b.3
    text: |-
      Indien toepassing is gegeven aan [artikel 60ab][ref1] en nadien de klacht gegrond wordt verklaard, wordt bij het
      bepalen van de maatregel als bedoeld in [artikel 48, tweede lid][ref2], rekening gehouden met de reeds opgelegde
      schorsing in de uitoefening van de praktijk of voorlopige voorziening met betrekking tot de praktijkuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel60ab
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 60ab
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 47c.1
    text: |-
      Indien aan een advocaat een maatregel als bedoeld in [artikel 48, eerste lid, onderdelen d of e][ref1], is opgelegd
      dan wel op grond van [artikel 60ab, eerste lid][ref2], of [60b, eerste lid][ref3], is geschorst in de uitoefening
      van de praktijk of tegen hem een voorlopige voorziening met betrekking tot de praktijkuitoefening is getroffen,
      blijft betrokkene onderworpen aan tuchtrechtspraak ter zake van enig handelen of nalaten gedurende de tijd dat hij
      werkzaam was in de uitoefening van het beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel60ab
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel60b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 60ab
        paragraaf: 4a
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 60b
        paragraaf: 4b
  - number: 47c.2
    text: |-
      Advocaten die niet meer als zodanig zijn ingeschreven overeenkomstig [artikel 1, eerste lid][ref1], blijven
      onderworpen aan tuchtrechtspraak ter zake van enig handelen of nalaten gedurende de tijd dat zij ingeschreven
      waren.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel1
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel47c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '1'
        afdeling: '1'
  - number: '48.1'
    text: |-
      De beslissingen van de raad van discipline over de voorgelegde klachten zijn met redenen omkleed en worden in het
      openbaar uitgesproken, alles op straffe van nietigheid.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48
  - number: '48.2'
    text: 'De maatregelen die bij gegrondverklaring van een klacht kunnen worden opgelegd, zijn:'
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48
  - number: 48.2.a
    text: een waarschuwing;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48
  - number: 48.2.b
    text: een berisping;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48
  - number: 48.2.c
    text: een geldboete;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48
  - number: 48.2.d
    text: de schorsing in de uitoefening van de praktijk voor de duur van ten hoogste een jaar; of
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48
  - number: 48.2.e
    text: de schrapping van het tableau.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48
  - number: '48.3'
    text: De raad kan bepalen dat, ondanks de gegrondverklaring van een klacht, geen maatregel wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48
  - number: '48.4'
    text: De maatregel van een geldboete kan gelijktijdig worden opgelegd met een andere maatregel.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48
  - number: '48.5'
    text: |-
      Indien enig door [artikel 46][ref1] beschermd belang dat vordert kan de raad van discipline bij de beslissing
      houdende oplegging van een maatregel als bedoeld in het tweede lid, onder b tot en met e, besluiten tot
      openbaarmaking van de opgelegde maatregel, al dan niet met de gronden waarop zij berust, op de door hem te bepalen
      wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '46'
        paragraaf: '4'
  - number: '48.6'
    text: |-
      Tot de tenuitvoerlegging van maatregelen overeenkomstig dit artikel opgelegd wordt eerst overgegaan zodra zij in
      kracht van gewijsde zijn gegaan.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48
  - number: '48.7'
    text: De geschorste advocaat mag gedurende de schorsing de titel van advocaat niet voeren.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48
  - number: '48.8'
    text: |-
      Schorsing in de uitoefening van de praktijk brengt mede verlies van de betrekkingen, waarbij de hoedanigheid van
      advocaat vereiste voor verkiesbaarheid of benoembaarheid is.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48
  - number: '48.9'
    text: |-
      De raad spreekt, indien de klager daarom verzoekt, in zijn beslissing steeds met redenen omkleed uit of de
      advocaat tegen wie de klacht is ingediend, jegens hem de zorgvuldigheid heeft betracht die bij een behoorlijke
      rechtshulpverlening betaamt. De raad kan een dergelijke uitspraak, indien hij daartoe voldoende grond aanwezig
      acht, ook ambtshalve doen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48
  - number: 48a.1
    text: |-
      Bij de oplegging van de maatregel van schorsing in de uitoefening van de praktijk kan de raad van discipline
      daarbij zowel ten aanzien van deze maatregel als van het verbod om de titel van advocaat te voeren bepalen dat deze
      maatregel geheel of voor een door de raad van discipline te bepalen gedeelte niet zal worden ten uitvoer gelegd
      tenzij de raad van discipline later anders mocht bepalen op grond dat de betrokken advocaat zich vóór het einde
      van een in de beslissing aan te geven proeftijd aan een in [artikel 46][ref1] bedoelde gedraging heeft schuldig
      gemaakt, of een bijzondere voorwaarde welke in de beslissing mocht zijn gesteld, niet heeft nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '46'
        paragraaf: '4'
  - number: 48a.2
    text: De proeftijd beloopt ten hoogste twee jaren. Zij gaat in zodra de beslissing in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48a
  - number: 48aa.1
    text: |-
      De geldboete, bedoeld in [artikel 48, tweede lid, onderdeel c][ref1], bedraagt ten hoogste het bedrag dat is
      vastgesteld voor de vierde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 48aa.2
    text: |-
      De beslissing tot oplegging van de geldboete bevat de termijn waarbinnen en de wijze waarop het bedrag moet worden
      betaald. Op verzoek van de betrokken advocaat kan de voorzitter van de raad van discipline de termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48aa
  - number: 48aa.3
    text: |-
      Het bedrag van de opgelegde geldboete komt ten bate van de Staat. Het bedrag van de opgelegde geldboete wordt in
      mindering gebracht op de in [artikel 46a, eerste lid][ref1], bedoelde kosten die samenhangen met tuchtrechtspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46a
        paragraaf: '4'
  - number: 48aa.4
    text: |-
      Wordt de geldboete niet voldaan binnen de in het tweede lid gestelde termijn, dan kan de raad, na de betrokken
      advocaat in de gelegenheid te hebben gesteld daarover te worden gehoord, ambtshalve beslissen op deze grond een of
      meer maatregelen als bedoeld in [artikel 48, tweede lid][ref1], op te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48aa
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 48ab.1
    text: |-
      De beslissing tot het opleggen van een geldboete levert een executoriale titel op, die met toepassing van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] ten uitvoer kan worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48ab
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 48ab.2
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de tenuitvoerlegging van de beslissing,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48ab
  - number: 48ac.1
    text: |-
      Indien een klacht geheel of gedeeltelijk gegrond wordt verklaard en een maatregel wordt opgelegd als bedoeld in
      [artikel 48, tweede lid][ref1], kan de uitspraak tevens inhouden een veroordeling van de advocaat in:


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48ac
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 48ac.1.a
    text: de kosten die de klager in verband met de behandeling van de klacht redelijkerwijs heeft moeten maken;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48ac
  - number: 48ac.1.b
    text: de kosten die de Nederlandse orde van advocaten in verband met de behandeling van de klacht heeft moeten maken; en
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48ac
  - number: 48ac.1.c
    text: de overige kosten die in verband met de behandeling van de zaak zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48ac
  - number: 48ac.2
    text: Het eerste lid, onderdeel a, is niet van toepassing voor zover de klacht door de deken is ingediend.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48ac
  - number: 48ac.3
    text: |-
      In geval van een veroordeling in de kosten als bedoeld in het eerste lid, onderdeel a, ten behoeve van de klager
      een toevoeging is verleend krachtens de [Wet op de rechtsbijstand][ref1], wordt het bedrag van die kosten betaald
      aan de rechtsbijstandverlener. De rechtsbijstandverlener stelt de klager zoveel mogelijk schadeloos voor de
      door deze voldane eigen bijdrage. De rechtsbijstandverlener doet aan de raad voor rechtsbijstand opgave van een
      kostenvergoeding door beklaagde. In geval ten behoeve van de klager geen toevoeging is verleend, worden de kosten
      betaald aan de klager.


      [ref1]: https://wetten.overheid.nl/BWBR0006368
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48ac
    references:
      - id: ref1
        bwb_id: BWBR0006368
  - number: 48ac.4
    text: |-
      Op een veroordeling in de kosten bedoeld in het eerste lid, onder a en b, is het bepaalde bij en krachtens
      [artikel 48aa, tweede en vierde lid][ref1], en [artikel 48ab][ref2], van overeenkomstige toepassing. Op een
      veroordeling in de kosten bedoeld in het eerste lid, onderdeel c, is artikel 48aa, tweede tot en met vierde lid, en
      artikel 48ab van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48aa
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48ab
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48ac
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48aa
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 48ab
        paragraaf: '4'
  - number: 48b.1
    text: |-
      Bij de oplegging van de in [artikel 48, tweede lid][ref1], genoemde maatregelen kan de raad van discipline, in
      afwijking van [artikel 48a, eerste lid][ref2], als bijzondere voorwaarde stellen dat de betrokken advocaat geheel
      of gedeeltelijk de door hem veroorzaakte schade tot een door de raad vast te stellen bedrag van ten hoogste € 5.000
      vergoedt binnen een door de raad te bepalen termijn, korter dan de proeftijd, en op een door de raad te bepalen
      wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48a
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 48a
        paragraaf: '4'
  - number: 48b.2
    text: |-
      Bovendien is de raad van discipline bevoegd bij de beslissing ook andere bijzondere voorwaarden, de
      praktijkbeoefening van de betrokken advocaat gedurende de proeftijd of een bij de beslissing te bepalen gedeelte
      daarvan betreffende, te stellen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48b
  - number: 48c.1
    text: |-
      De deken ziet toe op de nakoming van de voorwaarden, bedoeld in [artikel 48b][ref1]. Indien de betrokken advocaat
      de deken is, wordt het in [artikel 23, eerste lid][ref2], bedoelde lid van de raad van de orde belast met het
      toezien op de naleving van de voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48b
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel23
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48b
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '23'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: 48c.2
    text: |-
      De deken of het in het eerste lid bedoelde andere lid van de orde geeft, ingeval de betrokken advocaat de
      voorwaarden gedurende de proeftijd niet nakomt, daarvan kennis aan de raad van discipline, met zodanige vordering
      als hij nodig acht.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48c
  - number: 48d
    text: |-
      De raad van discipline die het in [artikel 48a][ref1] bedoelde bevel heeft gegeven, kan, hetzij op vordering van
      degene die op grond van [artikel 48c, eerste lid][ref2], toeziet op de nakoming van de voorwaarden, bedoeld in
      [artikel 48b][ref3], hetzij op verzoek van de betrokken advocaat, hetzij ambtshalve, gedurende de proeftijd in de
      gestelde bijzondere voorwaarden wijziging brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48c
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel48b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48a
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 48c
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 48b
        paragraaf: '4'
  - number: 48e
    text: |-
      De raad van discipline die met toepassing van [artikel 48a][ref1] heeft bepaald dat de opgelegde maatregel voor
      een door hem te bepalen gedeelte niet zal worden tenuitvoergelegd, kan hetzij op vordering van degene die op grond
      van [artikel 48c, eerste lid][ref2], toeziet op de nakoming van de voorwaarden, bedoeld in de artikelen 48a en
      [48b][ref3], hetzij ambtshalve, last geven dat alsnog tot tenuitvoerlegging zal worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48c
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel48b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48a
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 48c
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 48b
        paragraaf: '4'
  - number: 48f
    text: |-
      Een beslissing als bedoeld in de [artikelen 48d][ref1] en [48e][ref2] wordt niet gegeven dan na verhoor,
      althans behoorlijke oproeping van de betrokken advocaat en, in het geval de beslissing de bijzondere voorwaarde
      tot gehele of gedeeltelijke schadevergoeding betreft en deze daarbij belanghebbende is, de klager. Voor het
      verhoor wordt tevens opgeroepen degene die op grond van [artikel 48c, eerste lid][ref3], toeziet op de nakoming
      van de voorwaarden, bedoeld in [artikel 48b][ref4]. Op het verhoor en de beslissing zijn de bepalingen van de
      [artikelen 49, tweede tot en met het laatste lid][ref5], en [50][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48d
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48e
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel48c
      [ref4]: https://wetten.overheid.nl/BWBR0002093#Artikel48b
      [ref5]: https://wetten.overheid.nl/BWBR0002093#Artikel49
      [ref6]: https://wetten.overheid.nl/BWBR0002093#Artikel50
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48d
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 48e
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 48c
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0002093
        artikel: 48b
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0002093
        artikel: '49'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0002093
        artikel: '50'
        paragraaf: '4'
  - number: 48g
    text: |-
      Een beslissing als bedoeld in de [artikelen 48d][ref1] en [48e][ref2] is niet aan enig rechtsmiddel onderworpen,
      voor zover deze geen deel uitmaakt van een beslissing van de raad van discipline ter zake van een andere in
      [artikel 46][ref3] bedoelde gedraging.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48d
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel48e
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel46
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel48g
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 48d
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 48e
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002093
        artikel: '46'
        paragraaf: '4'
  - number: '49.1'
    text: |-
      De raad van discipline neemt geen beslissing dan na verhoor of behoorlijke oproeping van de advocaat tegen wie de
      klacht is ingediend, en van de klager.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel49
  - number: '49.2'
    text: |-
      De betrokken advocaat en de klager zijn bevoegd zich bij de behandeling van de klacht door een raadsman te doen
      bijstaan. Zij en hun raadslieden worden in de gelegenheid gesteld tijdig van de processtukken kennis te nemen. Hun
      wordt door de griffier van de raad van discipline tijdig medegedeeld, waar en wanneer deze gelegenheid bestaat.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel49
  - number: '49.3'
    text: |-
      De raad van discipline kan weigeren bepaalde personen, die van het verlenen van rechtshulp hun beroep maken en
      niet zijn advocaat, als raadsman toe te laten. De behandeling van de klacht wordt in dat geval aangehouden totdat
      de betrokkene in de gelegenheid is geweest de geweigerde raadsman te vervangen. Hij wordt door de griffier van de
      aanhouding en de reden daartoe in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel49
  - number: '49.4'
    text: |-
      De raad van discipline kan getuigen en deskundigen oproepen en horen. Het horen van getuigen en deskundigen kan
      worden opgedragen aan de voorzitter, de plaatsvervangend voorzitter of een van de leden of plaatsvervangende leden
      van de raad van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel49
  - number: '49.5'
    text: |-
      Op verzoek van de raad van discipline doet de officier van justitie hen dagvaarden. De getuigen en deskundigen zijn
      na dagvaarding verplicht te verschijnen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel49
  - number: '49.6'
    text: |-
      Verschijnt een getuige of deskundige op de dagvaarding niet, dan doet de officier van justitie op verzoek van de
      raad van discipline hem andermaal dagvaarden, desverzocht met bevel tot medebrenging.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel49
  - number: '49.7'
    text: |-
      [Artikel 6:1:5 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '49.8'
    text: |-
      De voorzitter beëdigt de getuige, dat hij de gehele waarheid en niets dan de waarheid zal zeggen; de getuige is
      verplicht op de gestelde vragen te antwoorden. De deskundige is gehouden zijn taak onpartijdig en naar beste weten
      te verrichten. Ingeval van toepassing van het vierde lid, tweede volzin, geschiedt de beëdiging van de getuige door
      het daartoe aangewezen lid-advocaat of plaatsvervangend lid-advocaat van de raad van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel49
  - number: '49.9'
    text: |-
      Op de getuigen en deskundigen vinden de [artikelen 217-219 van het Wetboek van Strafvordering][ref1]
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '49.10'
    text: |-
      De getuigen en deskundigen ontvangen desverkiezende op vertoon van hun oproeping of dagvaarding
      schadeloosstelling van het Rijk door de officier van justitie te begroten overeenkomstig het bij en krachtens de
      [Wet griffierechten burgerlijke zaken][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0028899
  - number: '49.11'
    text: |-
      De raad van discipline behandelt de klacht in een openbare zitting. De raad kan om gewichtige redenen bevelen dat
      de behandeling geheel of gedeeltelijk met gesloten deuren zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel49
  - number: '50'
    text: |-
      De griffier van de raad van discipline zendt van de beslissingen van de raad bij aangetekende brief onverwijld
      afschrift:
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel50
  - number: 50.a
    text: aan de betrokken advocaat;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel50
  - number: 50.b
    text: aan de klager;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel50
  - number: 50.c
    text: aan de deken van de algemene raad;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel50
  - number: 50.d
    text: aan de secretaris van de algemene raad;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel50
  - number: 50.e
    text: aan de deken van de orde waartoe de betrokken advocaat behoort;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel50
  - number: 50.f
    text: aan het college van toezicht;
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel50
  - number: 50.g
    text: |-
      indien de beslissing werd gegeven krachtens een verwijzing als bedoeld in [artikel 46aa, derde lid][ref1], of
      een aanwijzing als bedoeld in artikel 46aa, vijfde lid, aan de raad van discipline der orde waarvan de betrokken
      advocaat deel uitmaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46aa
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46aa
        paragraaf: '4'
  - number: 50.h
    text: |-
      indien de betrokken advocaat is ingeschreven bij de raad voor rechtsbijstand en aan hem een maatregel als bedoeld
      in [artikel 48, tweede lid][ref1], is opgelegd en de beslissing waarbij de maatregel is opgelegd in kracht
      van gewijsde is gegaan dan wel de raad van discipline toezending nodig acht: aan het bestuur van de raad voor
      rechtsbijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel48
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '48'
        paragraaf: '4'
  - number: 50a.1
    text: |-
      Bij ministeriële regeling aangewezen kosten die verbonden zijn aan het voorzitterschap en het plaatsvervangend
      voorzitterschap komen ten laste van de staat.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel50a
  - number: 50a.2
    text: |-
      De reis- en verblijfkosten van de leden-advocaten en de plaatsvervangende leden-advocaten van de raad van
      discipline en van de griffier worden vergoed en komen ten laste van de Nederlandse orde van advocaten.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel50a
  - number: '51.1'
    text: |-
      Het hof van discipline is gevestigd in een bij bestuursreglement vast te stellen plaats. Het hof kan uit zijn
      midden kamers vormen voor het vervullen van zijn taak. Kamers kunnen ook buiten de vestigingsplaats zitting
      houden. Het hof bestaat uit ten hoogste tien door Ons benoemde leden, waaronder de voorzitter en ten hoogste zes
      plaatsvervangende voorzitters, en vier leden-advocaten, alsmede uit door Ons benoemde plaatsvervangende leden en
      plaatsvervangende leden-advocaten, tot het door Ons, onderscheidenlijk door het college van afgevaardigden nodig
      geachte aantal.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel51
  - number: '51.2'
    text: |-
      De voorzitter, de plaatsvervangende voorzitters en de overige door Ons benoemde leden en plaatsvervangende leden
      worden voor de tijd van vijf jaren benoemd uit leden van de rechterlijke macht, met rechtspraak belast. De leden-
      advocaten en plaatsvervangende leden-advocaten worden door het college van afgevaardigden voor de tijd van vijf
      jaren gekozen.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel51
  - number: '51.3'
    text: |-
      Het hof van discipline wijst zijn griffier aan en ontslaat deze. Het hof van discipline voorziet in vervanging van
      de griffier bij verhindering of afwezigheid.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel51
  - number: '51.4'
    text: |-
      Het lidmaatschap of plaatsvervangend lidmaatschap van het hof van discipline of het zijn van griffier is niet
      verenigbaar met het lidmaatschap of het plaatsvervangend lidmaatschap van een raad van discipline, een orgaan van
      de Nederlandse orde van advocaten of een orgaan van de orden in de arrondissementen, uitgezonderd de jaarlijkse
      vergadering van de orde, bedoeld in [artikel 22, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel22
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '22'
        paragraaf: Afdeling_1
        afdeling: '3'
  - number: '51.5'
    text: |-
      [Artikel 46b, achtste tot en met elfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46b
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 46b
        paragraaf: '4'
  - number: '52.1'
    text: |-
      De voorzitter, de plaatsvervangende voorzitters en de leden en plaatsvervangende leden treden af met ingang
      van de eerstvolgende maand nadat zij de leeftijd van zeventig jaren hebben bereikt. Indien op dat tijdstip hun
      ambtstermijn nog niet is verstreken, kunnen zij, op eigen verzoek, in functie blijven tot het tijdstip dat de
      ambtstermijn is beëindigd.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel52
  - number: '52.2'
    text: |-
      Tussen de voorzitter, de plaatsvervangende voorzitters, de leden, plaatsvervangende leden en de griffier mag geen
      bloed- of aanverwantschap tot en met de derde graad bestaan. Tussen de leden-advocaten en de plaatsvervangende
      leden-advocaten mag voorts niet bestaan een maatschap of ander duurzaam samenwerkingsverband tot het uitoefenen van
      het beroep van advocaat of de verhouding van werkgever tot werknemer.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel52
  - number: '53.1'
    text: |-
      Als leden-advocaten en plaatsvervangende leden-advocaten van het hof van discipline zijn slechts verkiesbaar
      advocaten, die langer dan zeven jaren binnen het Rijk de praktijk hebben uitgeoefend en die de ouderdom van
      zeventig jaren nog niet hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel53
  - number: '53.2'
    text: De stemming geschiedt schriftelijk en voor elk lid afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel53
  - number: '53.3'
    text: De plaatsvervangende leden van het hof nemen zitting in volgorde van benoeming of verkiezing.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel53
  - number: '53.4'
    text: |-
      Leden van de algemene raad of van een raad van de orde in het arrondissement, die tot lid of plaatsvervangend lid
      van het hof van discipline zijn gekozen, treden bij het aanvaarden dezer functie af als lid van de betrokken raad.
      Leden-advocaten of plaatsvervangende leden-advocaten van een raad van discipline, die tot lid of plaatsvervangend
      lid van het hof van discipline zijn gekozen, treden bij het aanvaarden dezer functie af als lid-advocaat
      onderscheidenlijk plaatsvervangend lid-advocaat van de raad van discipline.
    url: https://wetten.overheid.nl/BWBR0002093/2020-07-01#Artikel53
  - number: '54.1'
    text: |-
      Het in de [artikelen 46c, onderdelen b en c][ref1], [46ca, eerste lid, onderdeel d][ref2],
      [46d, tweede lid][ref3], [46f][ref4], [46i, met uitzondering van het eerste lid, onderdeel c][ref5],
      [46j][ref6], [46l, eerste en derde lid][ref7], [46m][ref8], [46o][ref9] en
      [46p van de Wet rechtspositie rechterlijke ambtenaren][ref10] bepaalde is van overeenkomstige toepassing ten
      aanzien van de leden en plaatsvervangende leden van het hof van discipline.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46ca
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
