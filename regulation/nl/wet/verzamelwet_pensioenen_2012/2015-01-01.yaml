preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is enige wijzigingen in de wetgeving op het terrein van de
    pensioenen aan te brengen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030853/2015-01-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030853/2015-01-01#ArtikelIV
  - number: V
    text: 'Deze wet wordt aangehaald als: Verzamelwet pensioenen 2012.'
    url: https://wetten.overheid.nl/BWBR0030853/2015-01-01#ArtikelV
