preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is enige wijzigingen in de wetgeving op het terrein van de
    pensioenen aan te brengen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030853/2013-01-01#ArtikelAanhef
articles:
  - number: IIIa.1
    text: |-
      [Artikel 72a van de Pensioenwet][ref1] en [artikel 83a van de Wet verplichte beroepspensioenregeling][ref2] zijn
      niet van toepassing indien de ontvangende pensioenuitvoerder de deelnemer voor het tijdstip van inwerkingtreding
      van [artikel I, onderdeel Ab][ref3] of [artikel II, onderdeel Bb][ref4], een opgave of voorlopige opgave heeft
      verstrekt per de overdrachtsdatum van de overdrachtswaarde en de daaraan ten grondslag liggende gegevens onder
      vermelding van de aanspraken die zullen voortvloeien uit de waardeoverdracht en de wijze waarop de aanspraken in de
      pensioenregeling, ondergebracht bij de ontvangende pensioenuitvoerder, zullen worden behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel83a
      [ref3]: https://wetten.overheid.nl/BWBR0030853#ArtikelI
      [ref4]: https://wetten.overheid.nl/BWBR0030853#ArtikelII
    url: https://wetten.overheid.nl/BWBR0030853/2013-01-01#ArtikelIIIa
