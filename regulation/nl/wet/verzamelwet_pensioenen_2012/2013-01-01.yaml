  - number: IIIa.2
    text: Dit artikel vervalt twee jaar na het tijdstip van inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0030853/2013-01-01#ArtikelIIIa
  - number: IV
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030853/2013-01-01#ArtikelIV
