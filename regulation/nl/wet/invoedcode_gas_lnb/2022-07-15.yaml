valid_from: '2022-07-15'
bwb_id: BWBR0037936
url: https://wetten.overheid.nl/BWBR0037936/2022-07-15
preamble:
  text: |-
    Gelet op artikel 12f, eerste lid van de Gaswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      1 De Invoedcode gas LNB is van toepassing op aansluitpunten en aansluitingen waardoor gas wordt ingevoed door een
      invoeder op het landelijk gastransportnet, met uitzondering van verbindingen tussen hoge druk gastransportnetten
      en netkoppelingen.

      2 Bepalingen in de Invoedcode gas LNB betreffende aansluitingen hebben uitsluitend betrekking op aansluitingen die
      eigendom zijn van en beheerd worden door de netbeheerder van het landelijk gastransportnet.

      3 De Invoedcode gas LNB bevat de voorwaarden met betrekking tot de wijze waarop de invoeder en de netbeheerder van
      het landelijk gastransportnet de invoedingsinstallatie en het landelijk gastransportnet technisch en operationeel
      compatibel laten zijn en blijven, zodanig dat de invoedingsinstallatie en het landelijk gastransportnet veilig
      aan elkaar verbonden zijn en blijven, het gas kan worden gemeten en op gecontroleerde wijze in het landelijk
      gastransportnet kan worden ingevoed.

      4 Deze Invoedcode gas LNB beoogt de veiligheid, doelmatigheid en betrouwbaarheid van de invoedingsinstallatie en
      het landelijk gastransportnet te waarborgen en het milieu te ontzien.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel1.1.1
  - number: 1.1.2
    text: |-
      Begrippen, die in de [Gaswet][ref1] of de [Begrippencode gas][ref2] zijn gedefinieerd, hebben de in de Gaswet of
      Begrippencode gas gedefinieerde betekenis.


      [ref1]: https://wetten.overheid.nl/BWBR0011440
      [ref2]: https://wetten.overheid.nl/BWBR0037923
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0011440
      - id: ref2
        bwb_id: BWBR0037923
  - number: 1.2.1
    text: |-
      De netbeheerder van het landelijk gastransportnet staat alleen toe dat gas via het aansluitpunt of de aansluiting
      ingevoed wordt indien aan de invoeding ten minste één transportovereenkomst ten grondslag ligt, er een overeenkomst
      is afgesloten zoals bedoeld in [1.3][ref1] en een erkende programmaverantwoordelijke voor het ingevoede gas de
      programmaverantwoordelijkheid draagt, tenzij het ingevoede gas bestemd is voor de netbeheerder van het landelijk
      gastransportnet ter uitvoering van zijn wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0037936#Artikel1.3
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037936
        artikel: '1.3'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.2
    text: |-
      Indien de in [1.2.1][ref1] bedoelde transportovereenkomst op enig moment is beëindigd of opgeschort, zonder dat er
      aansluitend een nieuwe transportovereenkomst is afgesloten, zal de netbeheerder van het landelijk gastransportnet
      de invoeder hierover onmiddellijk informeren.


      [ref1]: https://wetten.overheid.nl/BWBR0037936#Artikel1.2.1
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037936
        artikel: 1.2.1
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '1.3'
    text: |-
      De netbeheerder van het landelijk gastransportnet en de invoeder zullen afspraken met betrekking tot de
      invoedingsinstallatie en de invoeding van gas vastleggen in een overeenkomst.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel1.3
  - number: '2.1'
    text: |-
      De invoeder dient er voor te zorgen dat de invoedingsinstallatie (blijft) voldoe(n)t aan de krachtens de wet-
      en regelgeving gestelde voorwaarden op het gebied van veiligheid, opdat de invoedingsinstallatie geen gevaar
      zal opleveren voor het ongestoord functioneren van het landelijk gastransportnet noch voor personeel van de
      netbeheerder van het landelijk gastransportnet of van door de netbeheerder van het landelijk gastransportnet
      ingeschakelde derden. De netbeheerder van het landelijk gastransportnet is niet verplicht uit eigen beweging na te
      gaan of is voldaan aan de voor de invoedingsinstallatie geldende wet- en regelgeving.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel2.1
  - number: '2.2'
    text: |-
      Alvorens (wederom) een aansluitpunt of een aansluiting in gebruik wordt gesteld, zal de invoeder naar genoegen van
      de netbeheerder van het landelijk gastransportnet dienen aan te tonen dat de invoedingsinstallatie voldoet aan de
      daarvoor geldende wet- en regelgeving op het gebied van veiligheid.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel2.2
  - number: '2.3'
    text: |-
      De invoeder is verplicht alle gegevens met betrekking tot de bouw, de modificaties en het onderhoud van de
      invoedingsinstallatie actueel te houden, voor zover deze relevant zijn om aan te tonen dat de invoedingsinstallatie
      voldoet aan de geldende wet- en regelgeving op het gebied van veiligheid.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel2.3
  - number: '2.4'
    text: |-
      De invoeder is voorts verplicht om aanpassingen aan de invoedingsinstallatie, van zodanige aard dat deze van
      betekenis kunnen zijn voor de veiligheid of het ongestoord functioneren van het landelijk gastransportnet, tijdig
      voorafgaand aan het uitvoeren hiervan aan de netbeheerder van het landelijk gastransportnet te melden.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel2.4
  - number: '2.5'
    text: |-
      Bij gerede twijfel of de invoedingsinstallatie voldoet aan de geldende wet- en regelgeving op het gebied van
      veiligheid, dient de invoeder zo spoedig mogelijk, maar in ieder geval binnen vierentwintig uur op verzoek en naar
      genoegen van de netbeheerder van het landelijk gastransportnet te kunnen aantonen dat de invoedingsinstallatie
      wel voldoet, zo nodig onder verstrekking aan de netbeheerder van het landelijk gastransportnet van alle gegevens
      met betrekking tot de bouw, de modificaties en het onderhoud van de invoedingsinstallatie. Eventuele hieruit
      voortvloeiende kosten komen voor rekening van de invoeder, indien blijkt dat de invoedingsinstallatie inderdaad
      niet voldoet aan de daarvoor geldende wet- en regelgeving.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel2.5
  - number: '2.6'
    text: |-
      Wanneer de invoeder niet voldoet aan het bepaalde in [1.2.1][ref1], [2.4][ref2] en/of [2.5][ref3] heeft de
      netbeheerder van het landelijk gastransportnet de bevoegdheid om het aansluitpunt of de aansluiting af te sluiten.
      Deze maatregel zal niet eerder ongedaan worden gemaakt dan nadat de reden voor het treffen van deze maatregel is
      weggenomen en de kosten van de maatregel en van het ongedaan maken daarvan door de invoeder aan de netbeheerder van
      het landelijk gastransportnet zijn vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0037936#Artikel1.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0037936#Artikel2.4
      [ref3]: https://wetten.overheid.nl/BWBR0037936#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0037936
        artikel: 1.2.1
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0037936
        artikel: '2.4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0037936
        artikel: '2.5'
        hoofdstuk: '2'
  - number: '2.7'
    text: |-
      Indien de reden voor het afsluiten van het aansluitpunt of de aansluiting is weggenomen en is voldaan aan het
      bepaalde in [2.2][ref1], zal de netbeheerder van het landelijk gastransportnet het aansluitpunt of de aansluiting
      weer in gebruik stellen binnen twee werkdagen nadat is voldaan aan het bepaalde in 2.2. De netbeheerder van het
      landelijk gastransportnet kan aan het opnieuw in gebruik stellen nadere financiële en operationele voorwaarden
      verbinden, die gerelateerd zijn aan de inspanningen die de netbeheerder van het landelijk gastransportnet heeft
      moeten verrichten en de kosten die hij heeft moeten maken in verband met het afsluiten van het aansluitpunt of de
      aansluiting en het ongedaan maken hiervan.


      [ref1]: https://wetten.overheid.nl/BWBR0037936#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0037936
        artikel: '2.2'
        hoofdstuk: '2'
  - number: '2.8'
    text: |-
      De invoeder draagt er zorg voor dat de toegang tot de invoedingsinstallatie, alsmede tot het gebouw of deel van een
      gebouw waarin de meet- en regelinrichting is opgesteld, voor de netbeheerder van het landelijk gastransportnet is
      gewaarborgd, voorzover dit voor de netbeheerder van het landelijk gastransportnet noodzakelijk is ter waarborging
      van de veiligheid en/of doelmatige en betrouwbare werking van het landelijk gastransportnet. Hierbij zal de
      netbeheerder van het landelijke gastransportnet het veiligheidsbeleid van de invoeder in acht nemen.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel2.8
  - number: 2.9.1
    text: |-
      De invoedingsinstallatie dient voorzien te zijn van een systeem om de flow te kunnen beheersen teneinde te
      kunnen voldoen aan de resultaten van de uitvoering van de procedures zoals beschreven in [4.2.2][ref1] en
      [4.2.3 van de Transportcode gas][ref2] artikel bij een druk die voldoet aan hetgeen bepaald is in [3.2.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Paragraaf4.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Paragraaf4.2.3
      [ref3]: https://wetten.overheid.nl/BWBR0037936#Artikel3.2.1
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel2.9.1
    references:
      - id: ref1
        bwb_id: BWBR0037950
        paragraaf: 4.2.2
      - id: ref2
        bwb_id: BWBR0037950
        paragraaf: 4.2.3
      - id: ref3
        bwb_id: BWBR0037936
        artikel: 3.2.1
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 2.9.2
    text: |-
      De invoedingsinstallatie dient voorzien te zijn van een drukbeveiliging die voldoet aan de daarvoor geldende wet-
      en regelgeving. De instelling van deze drukbeveiliging wordt overeengekomen tussen de invoeder en de netbeheerder
      van het landelijk gastransportnet en dient te waarborgen dat de veiligheid en/of doelmatige en betrouwbare werking
      van het landelijk gastransportnet niet in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel2.9.2
  - number: 2.9.3
    text: |-
      De drukbeveiliging dient te worden onderhouden en te worden getest in overeenstemming met de geldende wet- en
      regelgeving. De netbeheerder van het landelijk gastransportnet heeft het recht om deze tests bij te wonen. Om
      de veiligheid en/of doelmatige en betrouwbare werking van het landelijk gastransportnet te waarborgen is de
      netbeheerder van het landelijk gastransportnet gerechtigd een onderzoek uit te voeren naar het onderhoud en de
      tests van de drukbeveiliging.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel2.9.3
  - number: 2.9.4
    text: |-
      Indien de veiligheid en/of de betrouwbare werking van het landelijk gastransportnet in gevaar wordt gebracht,
      heeft de netbeheerder van het landelijk gastransportnet uit voorzorg het recht op het onmiddellijk afsluiten van
      het aansluitpunt of de aansluiting die het gevaar veroorzaakt. De netbeheerder van het landelijk gastransportnet
      stelt de invoeder daarvan onmiddellijk, en zo mogelijk voorafgaand, op de hoogte. De netbeheerder van het landelijk
      gastransportnet informeert de invoeder over de reden van de afsluiting.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel2.9.4
  - number: 3.1.0
    text: |-
      1 Een partij die een aansluiting wenst op het landelijk gastransportnet dient daartoe een aanvraag in bij de
      netbeheerder van het landelijk gastransportnet door middel van het invullen van het aanvraagformulier dat door de
      netbeheerder van het landelijk gastransportnet op haar website beschikbaar zal worden gesteld.

      2 Na ontvangst van het verzoek zal de netbeheerder van het landelijk gastransportnet binnen vijf werkdagen met
      de verzoeker contact opnemen om het vervolgproces te bespreken en zal hierna starten met een onderzoek naar de
      mogelijkheden om de aansluiting op het landelijk gastransportnet te realiseren.

      3 De aangeslotene dient de netbeheerder van het landelijk gastransportnet te voorzien van de informatie die voor de
      uitvoering van het onderzoek als bedoeld in het tweede lid nodig is.

      4 Partijen zullen in goed overleg ernaar streven om zo spoedig mogelijk de overeenkomst ter realisatie van de
      aansluiting te kunnen ondertekenen.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel3.1.0
  - number: 3.1.1
    text: |-
      Voordat de aangevraagde aansluiting zal worden gerealiseerd, dient aangeslotene de overeenkomst bedoeld in
      [artikel 3.1.0][ref1] te ondertekenen. Deze overeenkomst bevat onder meer:

      a. de voorziene planning;

      b. de benodigde afspraken ten behoeve van het realiseren van de aansluiting;

      c. civielrechtelijke bepalingen;

      d. en specifieke kenmerken van de aansluiting, zoals de locatie van het overdrachtspunt en de fysieke eigenschappen
      van de aansluiting, waaronder in ieder geval de capaciteit en bepalingen ten aanzien van leveringsdruk.


      [ref1]: https://wetten.overheid.nl/BWBR0037936#Artikel3.1.0
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037936
        artikel: 3.1.0
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.2
    text: |-
      De netbeheerder van het landelijk gastransportnet en de invoeder bepalen in onderling overleg de termijn waarbinnen
      de aansluiting zal worden gerealiseerd. De netbeheerder van het landelijk gastransportnet en de invoeder zullen
      zich inspannen om zo spoedig mogelijk te beschikken over de vereiste vergunningen.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel3.1.2
  - number: 3.1.3
    text: |-
      De netbeheerder van het landelijk gastransportnet bepaalt de locatie van de aansluiting met inachtneming van de
      geschikte druk en voldoende capaciteit van de door de afnemer aangevraagde aansluiting.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel3.1.3
  - number: 3.2.1
    text: |-
      De netbeheerder van het landelijk gastransportnet treedt in overleg met de invoeder teneinde overeen te komen
      onder welke minimale en maximale druk het gas op het overdrachtspunt wordt ingevoed. Onverminderd het bepaalde
      in [5.1.3][ref1] en [5.1.4][ref2] is het de verantwoordelijkheid van de invoeder de leveringsdruk zodanig in te
      stellen dat hij kan invoeden bij de heersende druk in het landelijk gastransportnet voor zover deze zich bevindt
      tussen de overeengekomen minimale en maximale druk en daarbij de flow zoals bedoeld in [2.9.1][ref3] kan beheersen.


      [ref1]: https://wetten.overheid.nl/BWBR0037936#Artikel5.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037936#Artikel5.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0037936#Artikel2.9.1
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037936
        artikel: 5.1.3
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0037936
        artikel: 5.1.4
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0037936
        artikel: 2.9.1
        hoofdstuk: '2'
        paragraaf: '2.9'
  - number: 3.2.2
    text: |-
      Indien door de netbeheerder van het landelijk gastransportnet of door de invoeder wordt vastgesteld dat het
      gas op het overdrachtspunt niet beschikbaar wordt gesteld met een leveringsdruk binnen de bandbreedte conform
      [artikel 3.2.1][ref1], zullen de netbeheerder van het landelijk gastransportnet en de invoeder elkaar daarover zo
      spoedig mogelijk informeren.


      [ref1]: https://wetten.overheid.nl/BWBR0037936#Artikel3.2.1
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037936
        artikel: 3.2.1
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.3.1
    text: |-
      Indien de invoeder voorziet dat gas op het overdrachtspunt beschikbaar zal worden gesteld dat niet voldoet aan de
      afgesproken gaskwaliteit dan zal hij de netbeheerder van het landelijk gastransportnet daarover zo spoedig mogelijk
      informeren.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel3.3.1
  - number: 3.3.2
    text: |-
      Indien gas op het overdrachtspunt beschikbaar wordt dan wel zal worden gesteld dat niet voldoet aan de
      (afgesproken) gaskwaliteit, zullen de invoeder en de netbeheerder van het landelijk gastransportnet elkaar daarover
      zo spoedig mogelijk informeren en die maatregelen nemen die redelijkerwijs kunnen worden verwacht om de oorzaak
      weg te nemen en/of de gevolgen te beperken. De netbeheerder van het landelijk gastransportnet zal de invoeder
      zo spoedig mogelijk informeren of het gas geheel of gedeeltelijk wordt geweigerd dan wel wordt geaccepteerd. Tot
      het moment dat de netbeheerder van het landelijk gastransportnet het gas dat niet voldoet aan de (afgesproken)
      gaskwaliteit accepteert, draagt de invoeder zorg voor de operationele en/of financiële gevolgen. Indien de
      veiligheid en/of doelmatige en betrouwbare werking van het landelijk gastransportnet in gevaar wordt gebracht,
      heeft de netbeheerder van het landelijk gastransportnet uit voorzorg het recht op het onmiddellijk afsluiten van
      het aansluitpunt of de aansluiting. De netbeheerder van het landelijk gastransportnet stelt de invoeder daarvan
      onmiddellijk, en zo mogelijk voorafgaand, op de hoogte.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel3.3.2
  - number: 3.4.1
    text: |-
      Het overdrachtspunt is ter plaatse van het fysieke verbindingspunt tussen enerzijds het landelijk gastransportnet
      en anderzijds de invoedingsinstallatie, waar het gas in het landelijk gastransportnet wordt ingevoed; dit
      verbindingspunt ligt (gezien vanuit het landelijk gastransportnet) één meter na de isolatiemof van het aansluitpunt
      of de aansluiting, tenzij de netbeheerder van het landelijk gastransportnet en de desbetreffende invoeder anders
      zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel3.4.1
  - number: 3.5.1
    text: |-
      Het is de aangeslotene niet toegestaan handelingen te (laten) verrichten aan de aansluiting zonder uitdrukkelijke
      toestemming van de netbeheerder van het landelijk gastransportnet.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel3.5.1
  - number: 3.6.1
    text: |-
      1 Aangeslotene kan een verzoek indienen tot wijziging van de aansluiting door middel van het invullen van een
      formulier dat de netbeheerder van het landelijk gastransportnet op haar website ter beschikking zal stellen.

      2 Na ontvangst van het verzoek zal de netbeheerder van het landelijk gastransportnet binnen vijf werkdagen met
      de verzoeker contact opnemen om het vervolgproces te bespreken en zal hierna starten met een onderzoek naar de
      mogelijkheden om de benodigde wijziging te realiseren.

      3 De aanvrager dient de netbeheerder van het landelijk gastransportnet te voorzien van de informatie die voor de
      uitvoering van dit onderzoek nodig is.

      4 De netbeheerder van het landelijk gastransportnet kan met de aangeslotene operationele voorwaarden overeenkomen
      die verband houden met die wijziging.

      5 Voordat de netbeheerder van het landelijk gastransportnet de wijziging zal realiseren dient de aangeslotene de
      hiertoe opgestelde overeenkomst te ondertekenen.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel3.6.1
  - number: 3.7.1
    text: |-
      De netbeheerder van het landelijk gastransportnet zal een eventuele weigering om een aanvraag conform
      [artikel 3.1.0][ref1] of [3.6.1][ref2] te realiseren binnen een redelijke termijn schriftelijk en met redenen
      omkleed toelichten.


      [ref1]: https://wetten.overheid.nl/BWBR0037936#Artikel3.1.0
      [ref2]: https://wetten.overheid.nl/BWBR0037936#Artikel3.6.1
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel3.7.1
    references:
      - id: ref1
        bwb_id: BWBR0037936
        artikel: 3.1.0
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037936
        artikel: 3.6.1
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '4.1'
    text: |-
      De invoeder staat er voor in dat de invoeding van gas niet zodanig is dat de veiligheid en/of betrouwbare
      werking van het landelijk gastransportnet in gevaar wordt dan wel kan worden gebracht. De invoeder is verplicht
      om, indien een dergelijke situatie zich toch voordoet of dreigt voor te doen, de netbeheerder van het landelijk
      gastransportnet, zo mogelijk tijdig voorafgaand aan die situatie, te informeren en de door de netbeheerder van het
      landelijk gastransportnet ter zake gegeven aanwijzingen op te volgen.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel4.1
  - number: '4.2'
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet vermoedt dat door toedoen van de invoeder de veiligheid
      en/of betrouwbare werking van het landelijk gastransportnet in gevaar wordt gebracht, zal de netbeheerder van het
      landelijk gastransportnet de invoeder daarvan onmiddellijk op de hoogte stellen. De netbeheerder van het landelijk
      gastransportnet heeft uit voorzorg het recht op het onmiddellijk afsluiten van het aansluitpunt of de aansluiting.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel4.2
  - number: '4.3'
    text: |-
      De meet- en regelinrichting wordt aangelegd, beheerd en onderhouden door de invoeder, tenzij de invoeder en de
      netbeheerder van het landelijk gastransportnet anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel4.3
  - number: '4.4'
    text: |-
      De invoeder en de netbeheerder van het landelijk gastransportnet zullen een meethandboek opstellen. Dit
      meethandboek betreft zowel de comptabele als niet-comptabele metingen en bevat een omschrijving van de opgestelde
      apparatuur, de berekeningsmethodes, de afhandeling van geconstateerde fouten, de aan de apparatuur te stellen
      nauwkeurigheidseisen en de methodes en criteria om de kwaliteit van de metingen te waarborgen, evenals de voor het
      veilig, doelmatig en betrouwbaar functioneren van het landelijk gastransportnet benodigde informatievoorziening.
      De gebruikte methodes en procedures zullen in overeenstemming zijn met relevante (internationale) standaarden. Bij
      het verschijnen van een nieuwe versie van een standaard zullen de invoeder en de netbeheerder van het landelijk
      gastransportnet in overleg bepalen of, en zo ja wanneer deze in de meet- en regelinrichting zal worden toegepast.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel4.4
  - number: '4.5'
    text: |-
      Het comptabele meetsysteem voldoet aan de volgende specificaties:








                  meetonzekerheid in hoeveelheid energie op maandbasis


                  < 0,75%




                  meetonzekerheid in hoeveelheid energie per uur


                  < 2%




                  beschikbaarheid data per uur (gemiddelde op jaarbasis)


                  ≥ 99%




                  maximale storingsduur meting en/of data acquisitie


                  2 uur






      De netbeheerder van het landelijk gastransportnet en de invoeder kunnen afwijkende specificaties overeenkomen.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel4.5
  - number: '4.6'
    text: |-
      De lokale data acquisitiesystemen van het comptabele meetsysteem dienen op afstand door de netbeheerder van het
      landelijk gastransportnet uitleesbaar te zijn met een frequentie van minimaal eenmaal per 5 minuten ten behoeve van
      near-real-time informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel4.6
  - number: '4.7'
    text: |-
      Indien de invoeder het meetsysteem beheert, dienen de comptabele meetwaarden op uurbasis door de invoeder uiterlijk
      op de vierde werkdag van de maand volgend op de maand waarop de meetwaarden van toepassing zijn, aangeleverd te
      worden aan de netbeheerder van het landelijk gastransportnet.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel4.7
  - number: '4.8'
    text: |-
      De netbeheerder van het landelijk gastransportnet is gerechtigd tot het aanleggen, instandhouden en gebruiken
      van de door haar (voor de uitvoering van haar taken als netbeheerder van het landelijk gastransportnet) benodigde
      telecommunicatie-infrastructuur en/of datalijnen, verbonden aan de meet- en regelinrichting. Hierbij zal de
      netbeheerder van het landelijke gastransportnet het veiligheidsbeleid van de invoeder in acht nemen.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel4.8
  - number: '4.9'
    text: |-
      De invoeder en de netbeheerder van het landelijk gastransportnet hebben toegang tot alle aan de meting gerelateerde
      informatie. De partij die de meet- en regelinrichting beheert zal de andere partij in de gelegenheid stellen de uit
      te voeren test- en calibratiewerkzaamheden bij te wonen en de resultaten hiervan overleggen.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel4.9
  - number: '4.10'
    text: |-
      De invoeder zal er voor zorgen dat de hoeveelheid in te voeden gas structureel en/of planmatig ligt in het
      capaciteitsgebied tussen de minimum meetcapaciteit en de maximum meetcapaciteit. De invoeder zal zodanig invoeden
      dat een goede inzet van de meetinrichting wordt gewaarborgd. De invoeder is verplicht om de netbeheerder van
      het landelijk gastransportnet, indien de invoeder hieraan niet voldoet dan wel zal kunnen voldoen, te informeren
      en de door de netbeheerder van het landelijk gastransportnet ter zake gegeven aanwijzingen op te volgen.
      Voorts is de invoeder verplicht, indien en voor zover hij structureel en/of planmatig de overeengekomen minimum
      meetcapaciteit onderschrijdt dan wel de maximale meetcapaciteit overschrijdt, met de netbeheerder van het landelijk
      gastransportnet in overleg te treden over een lagere minimum dan wel hogere maximum meetcapaciteit. Een gewijzigde
      meetcapaciteit wordt door de netbeheerder van het landelijk gastransportnet en de invoeder vastgelegd.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel4.10
  - number: '4.11'
    text: |-
      Indien een partij gegronde redenen heeft om aan te nemen dat de meetinrichting niet correct functioneert of
      een afwijking vertoont, zal de beheerder van de meetinrichting deze controleren en zo nodig handelend optreden
      (justeren). De kosten hiervan komen voor rekening van de partij die de meetinrichting beheert, tenzij een
      eventueel geconstateerde onnauwkeurigheid de toegestane afwijkingen, zoals gedefinieerd in het meethandboek, niet
      overschrijdt, in welk geval de kosten voor rekening van de partij komen die om de controle heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel4.11
  - number: '4.12'
    text: |-
      Correctie van de meetwaarden vindt plaats binnen de termijnen zoals genoemd in
      [artikel 2.5.1 van de Allocatiecode gas][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2.5.1
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 2.5.1
  - number: 5.1.1
    text: |-
      De netbeheerder van het landelijk gastransportnet en de invoeder zullen te allen tijde voldoende informatie
      uitwisselen en maatregelen nemen, opdat de werkzaamheden aan en de in- en uitbedrijfname van (onderdelen van)
      het aansluitpunt of de aansluiting, de invoedingsinstallatie en/of het landelijk gastransportnet en/of de daarmee
      verband houdende telecommunicatievoorzieningen zodanig worden gecoördineerd dat eventuele verstoring van de
      reguliere invoeding van gas of de onderlinge informatievoorziening tot een minimum wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.1.1
  - number: 5.1.2
    text: |-
      Waar redelijkerwijs noodzakelijk in verband met de veiligheid, doelmatigheid en/of betrouwbaarheid van het
      landelijk gastransportnet, zullen de netbeheerder van het landelijk gastransportnet en de invoeder voor
      werkzaamheden aan het aansluitpunt of de aansluiting, de invoedingsinstallatie of het landelijk gastransportnet,
      die gedurende een bepaalde periode een zekere invoeding of invoedingpatroon op het aansluitpunt of de aansluiting
      vereisen, met elkaar en met andere netgebruikers samenwerken teneinde gedurende deze periode een dergelijke
      invoeding of invoedingpatroon te realiseren.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.1.2
  - number: 5.1.3
    text: |-
      Indien een invoeder voornemens is om, buiten het geval van storing of calamiteiten, werkzaamheden te verrichten die
      kunnen leiden tot onderbreking, vermeerdering of vermindering van de invoeding van gas dan wel tot verandering van
      de condities waaronder het gas wordt ingevoed, zal de invoeder de netbeheerder van het landelijk gastransportnet
      informeren over het tijdstip en de tijdsduur van de onderbreking of de vermeerdering of vermindering van de
      invoeding van gas dan wel de verandering van de condities waaronder het gas wordt ingevoed. De invoeder zal bij
      planning en uitvoering van deze werkzaamheden zoveel als redelijkerwijs mogelijk rekening houden met de belangen
      van de netbeheerder van het landelijk gastransportnet.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.1.3
  - number: 5.1.4
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet voornemens is om, buiten het geval van storing of
      calamiteiten, werkzaamheden te verrichten die kunnen leiden tot onderbreking, vermeerdering of vermindering
      van de invoeding van gas dan wel tot verandering van de condities waaronder het gas wordt ingevoed, zullen deze
      werkzaamheden niet eerder worden uitgevoerd dan nadat over het tijdstip en de tijdsduur van de onderbreking of de
      vermeerdering of vermindering van de invoeding van gas dan wel de verandering van de condities waaronder het gas
      wordt ingevoed, overeenstemming tussen de netbeheerder van het landelijk gastransportnet en de invoeder is bereikt.
      De netbeheerder van het landelijk gastransportnet zal bij planning en uitvoering van deze werkzaamheden zoveel als
      redelijkerwijs mogelijk rekening houden met de belangen van de invoeder.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.1.4
  - number: 5.1.5
    text: |-
      Indien een calamiteit of storing het aansluitpunt of de aansluiting, de invoedingsinstallatie en/of de veiligheid,
      doelmatigheid en/of betrouwbaarheid van het landelijk gastransportnet bedreigt, kan de invoeder de noodzakelijke
      werkzaamheden aan de invoedingsinstallatie onverwijld en zonder voorafgaand overleg met de netbeheerder van
      het landelijk gastransportnet of met derden uitvoeren. De netbeheerder van het landelijk gastransportnet en de
      invoeder zullen in dat geval zoveel als redelijkerwijs mogelijk contact met elkaar onderhouden en samenwerken om de
      calamiteit of storing dan wel de gevolgen daarvan op te heffen.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.1.5
  - number: 5.1.6
    text: |-
      De invoeder en de netbeheerder van het landelijk gastransportnet zijn bevoegd om zonder voorafgaande mededeling
      aan elkaar of aan andere betrokkenen het aansluitpunt of de aansluiting af te sluiten indien dit vereist is wegens
      direct gevaar voor personen. De netbeheerder van het landelijk gastransportnet en de invoeder stellen elkaar
      daarvan onmiddellijk op de hoogte.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.1.6
  - number: 5.1.7
    text: |-
      De invoeder of de netbeheerder van het landelijk gastransportnet zal noch door middel van het aansluitpunt of de
      aansluiting en/of de invoedingsinstallatie respectievelijk het landelijk gastransportnet noch anderszins hinder
      of schade veroorzaken voor het landelijk gastransportnet respectievelijk het aansluitpunt of de aansluiting en/of
      de invoedingsinstallatie. De invoeder en de netbeheerder van het landelijk gastransportnet zullen het aansluitpunt
      of de aansluiting niet gebruiken voor aarding van elektrische installaties, toestellen, bliksemafleiders en
      dergelijke, dan wel voor enig ander doel dan onder deze Invoedcode gas artikel uitdrukkelijk is toegestaan.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.1.7
  - number: 5.1.8
    text: |-
      De netbeheerder van het landelijk gastransportnet en een invoeder kunnen een operational balancing account (OBA)
      inrichten op een entry- of exitpunt. Voor het inrichten van een OBA moet de invoeder in ieder geval voldoen aan de
      voorwaarden die opgenomen zijn op de website van de netbeheerder van het landelijk gastransportnet. De OBA zal in
      overeenstemming zijn met [artikel 4a.1.1 van de Allocatiecode gas][ref1] en maakt integraal onderdeel uit van de
      overeenkomst als bedoeld in [artikel 1.3][ref2] van de Invoedcode gas LNB.


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel4a.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037936#Artikel1.3
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.1.8
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: 4a.1.1
      - id: ref2
        bwb_id: BWBR0037936
        artikel: '1.3'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 5.2.1
    text: |-
      De netbeheerder van het landelijk gastransportnet en de invoeder zullen elkaar de nodige medewerking verlenen
      bij de toepassing en de uitvoering van het bepaalde in deze Invoedcode gas artikel en de controle op de naleving
      daarvan. De netbeheerder van het landelijk gastransportnet en de invoeder zijn in het bijzonder verplicht elkaar
      zo spoedig mogelijk op de hoogte te stellen van alle gegevens, voorvallen en wijzigingen in omstandigheden of in de
      feitelijke situatie die voor de uitvoering van deze Invoedcode gas artikel van belang (kunnen) zijn.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.2.1
  - number: 5.2.2
    text: |-
      De netbeheerder van het landelijk gastransportnet en de invoeder zijn, onder meer om hetgeen omschreven in
      [5.2.1][ref1] na te kunnen komen, vierentwintig uur per dag en elke dag van het jaar telefonisch dan wel via
      enig ander overeengekomen communicatiesysteem bereikbaar en in staat om zo nodig handelend op te treden. Alle
      relevante adres- en communicatiegegevens worden vastgelegd. Indien deze gegevens wijzigen, dienen de netbeheerder
      van het landelijk gastransportnet en de invoeder elkaar hierover zo spoedig mogelijk doch uiterlijk tien werkdagen
      voorafgaand aan wijziging van de gegevens schriftelijk te informeren op het vastgelegde adres.


      [ref1]: https://wetten.overheid.nl/BWBR0037936#Artikel5.2.1
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037936
        artikel: 5.2.1
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.3
    text: |-
      De netbeheerder van het landelijk gastransportnet en de invoeder zullen zich voldoende inspannen te blijven
      beschikken over de benodigde vergunningen en elkaar over de wijzigingen in die vergunningen en de voorwaarden
      waaronder zij zijn afgegeven, te informeren.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.2.3
  - number: 5.2.4
    text: |-
      Voor zover in het landelijk gastransportnet operationele maatregelen vereist zijn om het gas veilig, doelmatig en
      betrouwbaar te transporteren, kan de netbeheerder van het landelijk gastransportnet met de invoeder operationele
      voorwaarden overeenkomen, die het benodigde communicatieproces over de afstemming van geplande in te voeden en te
      transporteren hoeveelheden gas vastleggen. Het overeen te komen communicatieproces zal zo mogelijk gelijkvormig
      zijn met internationale aanbevelingen hieromtrent. Bij het verschijnen van een nieuwe versie van deze aanbevelingen
      zullen de invoeder en de netbeheerder van het landelijk gastransportnet in overleg bepalen of, en zo ja wanneer
      deze zullen worden toegepast.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.2.4
  - number: '5.3'
    text: |-
      De invoeder verstrekt jaarlijks op verzoek van de netbeheerder van het landelijk gastransportnet voor elk
      aansluitpunt of elke aansluiting informatie over de te verwachten capaciteit waarmee gas zal worden ingevoed in
      ten minste de komende vijf jaren. De invoeder zal aan de netbeheerder van het landelijk gastransportnet, indien de
      netbeheerder van het landelijk gastransportnet hierom verzoekt, nadere (achtergrond)informatie verstrekken over de
      door hem verstrekte gegevens. De invoeder staat er voor in dat de door hem verstrekte opgaven op zorgvuldige wijze
      tot stand zijn gekomen en een zo goed mogelijke schatting geven van de toekomstige in te voeden capaciteit.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.3
  - number: 5.4.1
    text: |-
      De invoeder heeft recht op een financiële compensatie bij storingen die voor een periode langer dan 4 uren tot een
      onderbreking van het transport van gas leiden, met uitzondering van voorziene onderbrekingen.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.4.1
  - number: 5.4.2
    text: |-
      De in [5.4.1][ref1] genoemde termijn van 4 uren vangt voor alle door de onderbreking getroffen invoeders aan op
      het moment dat de netbeheerder van het landelijk gastransportnet de eerste melding van een onderbreking van een
      invoeder ontvangt of, indien dat eerder is, op het moment van vaststelling van de onderbreking door de netbeheerder
      van het landelijk gastransportnet.


      [ref1]: https://wetten.overheid.nl/BWBR0037936#Artikel5.4.1
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037936
        artikel: 5.4.1
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.4.3
    text: |-
      De in [5.4.1][ref1] genoemde financiële compensatie bedraagt voor de invoeder € 910,– bij een onderbreking van 4
      uur tot 8 uur, vermeerderd met € 500,– voor elke volgende aaneengesloten periode van 4 uur. De uitbetaling dient
      binnen drie maanden te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0037936#Artikel5.4.1
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel5.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037936
        artikel: 5.4.1
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: '6.1'
    text: |-
      De Invoedvoorwaarden Gas – artikel, zoals vastgesteld bij besluit van 24 juli 2014 en nadien éénmaal gewijzigd,
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel6.1
  - number: '6.2'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel6.2
  - number: '6.3'
    text: 'Dit besluit wordt aangehaald als: Invoedcode gas LNB.'
    url: https://wetten.overheid.nl/BWBR0037936/2022-07-15#Artikel6.3
