        artikel: '2'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015237
        artikel: '4'
  - number: '5.1'
    text: |-
      Een bijzondere bevoegdverklaring wordt afgegeven, nadat de aanvrager heeft aangetoond te voldoen aan de eisen
      inzake basiskennis, typekennis en ervaring voor afgifte van die bijzondere bevoegdverklaring. Deze eisen zijn
      opgenomen in het onderstaande schema: *Basiskennis* De aanvrager toont aan voor de bijzondere bevoegdverklaring
      AB1Z, AB1T, AB2Z, AB2T, AB3Z, AB3T, CF, CEF, DG, A, B of C, dat het examen voor de bijzondere bevoegdverklaring
      niet langer dan drie jaar geleden met voldoende resultaat is afgelegd of niet langer dan drie jaar geleden
      een erkende opleiding voor de bijzondere bevoegdverklaring met voldoende resultaat is gevolgd. *Typekennis*
      De aanvrager toont aan voor de bijzondere bevoegdverklaring AB2Z, AB2T, AB3Z of AB3T, dat een door de minister
      geaccepteerde cursus m.b.t. het type luchtvaartuig met inbegrip van de voortstuwingsinstallatie, waarvoor de
      aanvraag wordt ingediend, met voldoende resultaat is gevolgd. Wanneer een cursus niet meer bestaat of reeds een
      aantal typecursussen met voldoende resultaat zijn gevolgd, kan de aanvrager voldoende kennis m.b.t. het type
      luchtvaartuig (incl. de motor) aantonen door met voldoende resultaat een examen af te leggen. *Ervaring* De
      aanvrager toont aan
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel5
  - number: 5.1.a
    text: |-
      voor de bijzondere bevoegdverklaring AB1Z, AB1T, AB2Z, AB2T, AB3Z, AB3T, CF, CEF, DG, A, B of C, dat in de
      drie jaren, onmiddellijk voorafgaande aan de datum van aanvraag, tenminste twee jaren ervaring is verkregen met
      betrekking tot de werkzaamheden waarvoor de bijzondere bevoegdverklaring is vereist;
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel5
  - number: 5.1.b
    text: |-
      voor de bijzondere bevoegdverklaring AB2Z, AB2T, AB3Z of AB3T, dat in het jaar, onmiddellijk voorafgaande aan de
      datum van aanvraag tenminste zes maanden ervaring is verkregen met betrekking tot het type luchtvaartuig waarvoor
      de aanvraag wordt ingediend;
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel5
  - number: 5.1.c
    text: |-
      voor de bijzondere bevoegdverklaring AB1Z, AB1T, AB2Z, AB2T, AB3Z, AB3T, CF, CEF, DG, A, B of C, de werkzaamheden,
      bedoeld onder a en b, zijn verricht onder toezicht van een bevoegde persoon of erkende onderhoudsorganisatie.
      Wanneer de aanvrager in deze drie jaren een – tevens op de praktijk gerichte – erkende opleiding voor de bijzondere
      bevoegdverklaring met voldoende resultaat heeft gevolgd, bedraagt de onder a genoemde ervaring 1 jaar.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel5
  - number: '5.2'
    text: |-
      Wanneer de aanvrager reeds houder is van een AML, zijn in afwijking van het eerste lid, de eisen inzake ervaring
      van toepassing volgens de onderstaande tabel.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel5
  - number: '5.3'
    text: |-
      De werkzaamheden, bedoeld in [artikel 1, derde lid][ref1], en [artikel 2, tweede lid][ref2], worden op de AML
      vermeld, nadat de aanvrager heeft aangetoond te voldoen aan de eisen die zijn opgenomen in het onderstaande schema:






                    Werkzaamheden


                    Eisen






                    Het controleren en compenseren van direct afleesbare magnetische kompassen


                    De aanvrager toont aan, dat hij of zij een door de minister geaccepteerde training m.b.t. het
      controleren en compenseren van direct afleesbare magnetische kompassen met voldoende resultaat heeft gevolgd


      [ref1]: https://wetten.overheid.nl/BWBR0024312#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024312#Artikel2
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024312
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0024312
        artikel: '2'
        hoofdstuk: '1'
  - number: '6.1'
    text: |-
      De geldigheidsduur van een bijzondere bevoegdverklaring wordt op aanvraag van de houder verlengd, nadat is
      aangetoond dat de aanvrager in de twee jaren onmiddellijk voorafgaande aan de datum van aanvraag, ten minste zes
      maanden ervaring heeft verkregen met het onderhoud waarvoor de bijzondere bevoegdverklaring vereist is.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel6
  - number: '6.2'
    text: |-
      Een aanvraag voor verlenging wordt niet eerder dan twee maanden voor de vervaldatum van de bijzondere bevoegdheid
      ingediend.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel6
  - number: '7'
    text: |-
      Een bijzondere bevoegdverklaring waarvan de geldigheidsduur langer dan twee maanden is verstreken, wordt
      wederafgegeven, nadat is aangetoond dat de aanvrager in de twee jaren onmiddellijk voorafgaande aan de
      datum van aanvraag, ten minste zes maanden ervaring heeft verkregen met het onderhoud waarvoor de bijzondere
      bevoegdverklaring vereist is onder de voorwaarde dat de ervaring na de vervaldatum van de bijzondere
      bevoegdverklaring is verkregen onder toezicht van een bevoegde persoon of erkende onderhoudsorganisatie.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel7
  - number: '8.1'
    text: |-
      Een bewijs van bevoegdheid als grondwerktuigkundige dat is afgegeven voor de datum waarop deze regeling in werking
      treedt, blijft geldig tot de op het bewijs van bevoegdheid vermelde vervaldatum.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel8
  - number: '8.2'
    text: |-
      Een bewijs van bevoegdheid als zweefvliegtechnicus dat is afgegeven voor de datum waarop deze regeling in werking
      treedt, blijft geldig tot de op het bewijs van bevoegdheid vermelde vervaldatum.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel8
  - number: '9'
    text: Deze regeling treedt in werking met ingang van 1 november 2001 en werkt terug tot en met 1 oktober 2001.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Regeling bijzondere bevoegdverklaringen AML.'
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel10
