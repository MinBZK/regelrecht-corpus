$id: regeling_bijzondere_bevoegdverklaringen_aml
regulatory_layer: WET
publication_date: '2008-10-27'
valid_from: '2005-07-01'
bwb_id: BWBR0024312
url: https://wetten.overheid.nl/BWBR0024312/2005-07-01
preamble:
  text: |-
    Gelet op de artikelen 5, 8, eerste lid, 9 en 10, van het Besluit bewijzen van bevoegdheid voor de luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De minister kan de volgende bijzondere bevoegdverklaringen afgeven voor onderhoud aan vliegtuigen met een maximum
      startmassa tot 5700 kg en helikopters met een maximum startmassa tot 2730 kg: AB voor werkzaamheden aan vliegtuigen
      en helikopters en de voortstuwingsinstallatie hiervan, van een klasse volgens het tweede lid, met uitzondering van
      de werkzaamheden waarvoor een bijzondere bevoegdverklaring C(E)F of DG vereist is, maar inclusief de werkzaamheden
      die op de AML zijn vermeld; CF voor werkzaamheden aan instrumenten zonder elektronische hulpapparatuur
      en elektrische installaties; CEF voor werkzaamheden aan instrumenten zonder elektronische hulpapparatuur,
      klimaatregeling en elektrische installaties; DG voor werkzaamheden aan automatische vluchtgeleidingssystemen en
      communicatie-, navigatie- en identificatie- installaties.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel1
  - number: '1.2'
    text: |-
      De klassen, bij de bijzondere bevoegdverklaring AB, zijn: 1Z vliegtuigen zonder drukcabine met één zuigermotor;
      1T vliegtuigen zonder drukcabine met één turbinemotor; 2Z vliegtuigen met drukcabine of meerdere zuigermotoren,
      van een type dat op de AML is vermeld; 2T vliegtuigen met drukcabine of meerdere turbinemotoren, van een type dat
      op de AML is vermeld; 3Z helikopters met zuigermotoren, van een type dat op de AML is vermeld; 3T helikopters met
      turbinemotoren, van een type dat op de AML is vermeld.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel1
  - number: '1.3'
    text: |-
      De werkzaamheden, die bij de bijzondere bevoegdverklaring AB op de AML kunnen worden vermeld, zijn: - het
      controleren en compenseren van direct afleesbare magnetische kompassen.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel1
  - number: '2.1'
    text: 'De minister kan de volgende bijzondere bevoegdverklaringen afgeven voor onderhoud aan (motor)zweefvliegtuigen:'
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel2
  - number: 2.1.A
    text: |-
      voor werkzaamheden aan (motor)zweefvliegtuigen, met uitzondering van de werkzaamheden waarvoor een bijzondere
      bevoegdverklaring B of C vereist is, maar inclusief de werkzaamheden die op de AML zijn vermeld;
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel2
  - number: 2.1.B
    text: voor werkzaamheden aan de voortstuwingsinstallatie;
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel2
  - number: 2.1.C
    text: voor werkzaamheden aan elektrische en elektronische installaties.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel2
  - number: '2.2'
    text: |-
      De werkzaamheden, die bij de bijzondere bevoegdverklaring A op de AML kunnen worden vermeld, zijn: - het
      controleren en compenseren van direct afleesbare magnetische kompassen.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel2
  - number: '3'
    text: |-
      De geldigheidsduur van een bijzondere bevoegdverklaring, bedoeld in [artikel 1][ref1] en [2][ref2], bedraagt ten
      hoogste twee jaren en kan vervolgens telkens met twee jaren worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0024312#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024312#Artikel2
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024312
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0024312
        artikel: '2'
        hoofdstuk: '1'
  - number: '4.1'
    text: |-
      De houder van een AML met de bijzondere bevoegdverklaring AB1Z, is tevens bevoegd werkzaamheden te verrichten
      waarvoor de bijzondere bevoegdverklaring B vereist is.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel4
  - number: '4.2'
    text: |-
      De houder van een AML met de bijzondere bevoegdverklaring AB2Z, is tevens bevoegd werkzaamheden te verrichten
      waarvoor de bijzondere bevoegdverklaring AB1Z en B vereist zijn.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel4
  - number: '4.3'
    text: |-
      De houder van een AML met de bijzondere bevoegdverklaring AB2T, is tevens bevoegd werkzaamheden te verrichten
      waarvoor de bijzondere bevoegdverklaring AB1T vereist is.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel4
  - number: '4.4'
    text: |-
      De houder van een AML met de bijzondere bevoegdverklaring AB2Z voor een type vliegtuig zonder drukcabine met een
      niet intrekbaar onderstel, is bevoegd werkzaamheden waarvoor de bijzondere bevoegdverklaring AB2Z vereist is, te
      verrichten aan alle vliegtuigen van de klasse 2Z zonder drukcabine met een niet intrekbaar onderstel.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel4
  - number: '4.5'
    text: |-
      De houder van een AML met de bijzondere bevoegdverklaring AB2Z voor een type vliegtuig zonder drukcabine met
      een intrekbaar onderstel, is bevoegd werkzaamheden waarvoor de bijzondere bevoegdverklaring AB2Z vereist is, te
      verrichten aan alle vliegtuigen van de klasse 2Z zonder drukcabine.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel4
  - number: '4.6'
    text: |-
      De houder van een AML met de bijzondere bevoegdverklaring AB2Z voor een meermotorig vliegtuig met drukcabine, is
      bevoegd werkzaamheden waarvoor een bijzondere bevoegdverklaring AB2Z vereist is, te verrichten aan alle vliegtuigen
      van de klasse 2Z van dezelfde fabrikant en alle overige vliegtuigen van de klasse 2Z zonder drukcabine.
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel4
  - number: '4.7'
    text: |-
      De houder van een AML met een bijzondere bevoegdverklaring als bedoeld in [artikel 1][ref1] of
      [artikel 2, eerste lid][ref2], mits voorzien van een bijzondere bevoegdverklaring A en B dan wel C, is bevoegd
      dezelfde werkzaamheden, als waartoe de desbetreffende bijzondere bevoegdverklaring strekt, te verrichten aan een
      MLA.


      [ref1]: https://wetten.overheid.nl/BWBR0024312#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024312#Artikel2
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024312
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0024312
        artikel: '2'
        hoofdstuk: '1'
  - number: '4.8'
    text: |-
      De houder van een AML met een bijzondere bevoegdverklaring AB als bedoeld in [artikel 1][ref1] of met de bijzondere
      bevoegdverklaringen A en B, bedoeld in [artikel 2, eerste lid][ref2], is bevoegd tot het mede ondertekenen van de
      verklaring als bedoeld in [artikel 4, tweede lid, van de Regeling MLA’s][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024312#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024312#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0015237#Artikel4
    url: https://wetten.overheid.nl/BWBR0024312/2005-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024312
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
