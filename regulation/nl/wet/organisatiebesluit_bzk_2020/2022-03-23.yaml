        artikel: '3'
  - number: '26'
    text: |-
      1 Tot de taak van de directoraten-generaal, het Bureau Algemene Bestuursdienst, de clusters M&M en BO, CZW, RvIG,
      Logius en de Dienst NCG behoort voorts de uitvoering van andere taken dan hiervoor genoemd, in opdracht van de
      bewindspersonen of de secretaris-generaal, voor zover hogere wet- en regelgeving zich daartegen niet verzet.

      2 Tot de taak van de in dit besluit genoemde organisatieonderdelen, ressorterend onder de dienstonderdelen genoemd
      in het eerste lid, behoort voorts de uitvoering van andere taken dan vermeld, in opdracht van de bewindspersonen,
      de secretaris-generaal of het diensthoofd, voor zover hogere wet- en regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel26
  - number: '27'
    text: |-
      1 De directeur P&O is belast met het beheer van dit besluit.

      2 De secretaris-generaal, de directeuren-generaal, de directeuren van de clusters M&M en BO, CZW, de algemeen
      directeuren Logius, RvIG en Dienst NCG, ieder voor zover het hen aangaat, zijn verantwoordelijk voor een juiste,
      volledige en tijdige aanlevering aan de directeur P&O van de gegevens die een goed beheer van dit besluit mogelijk
      maken.

      3 Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel27
