preamble:
  text: |-
    Gelet op artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011;

    Besluit vast te stellen het navolgende Organisatiebesluit:
  url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *ministerie:* Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;

      b. *Minister:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      c. *bewindspersonen:* de Minister of de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties

      d. *capaciteitsplan:* schriftelijk stuk waarin de uitwerking van de flexibele organisatiestructuur van een
      dienstonderdeel wordt vastgelegd evenals de verdeling van de formatie binnen deze structuur;

      e. *Cluster Mensen en Middelen:* de directies P&O, Financieel-economische Zaken, BZK Flex en CIO &
      Informatiemanagement;

      f. *Cluster Bestuursondersteuning:* de directies Communicatie, Bestuursadvisering en Kennis, Internationaal,
      Europa, Macro-economie;

      g. *BZK Kerndepartement:* de directoraten-generaal Bestuur, Ruimte en Wonen, Koninkrijksrelaties en
      Overheidsorganisatie, het programma directoraat-generaal Omgevingswet, de clusters Mensen en Middelen en
      Bestuursondersteuning en de directie Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel1
  - number: '2'
    text: |-
      1 De hoofdstructuur van het ministerie bestaat uit de volgende dienstonderdelen:

      a. de Algemene Leiding (ALGL);

      b. het directoraat-generaal Bestuur, Ruimte en Wonen (DGBRW);

      c. het directoraat-generaal Koninkrijksrelaties (DGKR);

      d. het directoraat-generaal Overheidsorganisatie (DGOO);

      e. het Bureau Algemene Bestuursdienst (BABD);

      f. de Algemene Inlichtingen- en Veiligheidsdienst (AIVD);

      g. het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk (DGVBR);

      h. de Dienst Nationaal Coördinator Groningen (Dienst NCG);

      i. de directie Constitutionele Zaken en Wetgeving (CZW);

      j. het agentschap Dienst van de Huurcommissie (DHC);

      k. het agentschap Logius;

      l. het agentschap Rijksdienst voor Identiteitsgegevens (RvIG);

      m. het cluster Mensen en Middelen (M&M);

      n. het cluster Bestuursondersteuning (BO).

      2 De dienstonderdelen bestaan uit organisatieonderdelen waarvan de inrichting nader kan worden beschreven op een
      wijze als bedoeld in [artikel 25, tweede lid][ref1].

      3 De secretaris-generaal geeft rechtstreeks leiding aan de leidinggevende functionarissen van de dienstonderdelen,
      genoemd in het eerste lid, met uitzondering van het agentschap Dienst Huurcommissie dat ressorteert onder het
      bestuur van de Huurcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0043708#Artikel25
