    text: |-
      1 Het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk staat onder leiding van een directeur-generaal.

      2 Het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk draagt zorg voor:

      a. het verwerven, ontwikkelen en aan onderdelen van de rijksoverheid ter beschikking stellen van vastgoed;

      b. het efficiënt beheren, onderhouden en gebruiken van een uitgebalanceerde rijksvastgoedportefeuille;

      c. de transformatie en het afstoten van overtollig rijksvastgoed;

      d. het genereren van inkomsten met rijksvastgoed, indien (wettelijk) mogelijk;

      e. het op kwalitatief goede en efficiënte wijze uitvoeren van bedrijfsvoeringstaken voor de rijksoverheid;

      f. het bevorderen, realiseren en (doen) in stand houden van onderlinge samenhang, integratie en synergie in de
      dienstverlening vanuit het directoraat-generaal;

      g. het optreden als gemandateerd eigenaar voor de agentschappen, genoemd in het derde lid, onder b tot en met e.

      3 Het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk bestaat uit de volgende organisatieonderdelen:

      a. het agentschap het Rijksvastgoedbedrijf (RVB);

      b. het agentschap SSC-ICT;

      c. het agentschap P-Direkt;

      d. het agentschap Uitvoeringsorganisatie Bedrijfsvoering Rijk (UBR);

      e. het agentschap FMHaaglanden (FMH);

      f. de directie Doc-Direkt.

      4 Het Rijksvastgoedbedrijf bestaat uit de volgende organisatieonderdelen:

      a. de directie Portefeuillestrategie & Portefeuillemanagement (P&P);

      b. de directie Transacties & Projecten (T&P);

      c. de directie Vastgoedbeheer (VB);

      d. de directie Financiën en Bestuursadvisering (F&B);

      e. het bureau directeur-generaal (bdg);

      f. het Atelier Rijksbouwmeester (ARbm).

      5 Het Rijksvastgoedbedrijf staat onder leiding van een directeur-generaal die tevens directeur-generaal is van het
      directoraat-generaal Vastgoed en Bedrijfsvoering Rijk.

      6 Voor aangelegenheden die behoren tot het werkterrein van het Rijksvastgoed treedt de directeur-generaal op en
      doet stukken af en ondertekent deze als directeur-generaal Rijksvastgoedbedrijf en voor de overige aangelegenheden
      als directeur-generaal Vastgoed en Bedrijfsvoering Rijk.
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel11
  - number: '12'
    text: |-
      1 De Dienst Nationaal Coördinator Groningen staat onder leiding van een algemeen directeur.

      2 De Dienst Nationaal Coördinator Groningen:

      a. draagt zorg voor de versterkingsoperatie van woningen en gebouwen in het aardbevingsgebied in Groningen,
      waaronder het nemen van de daartoe nodige besluiten, de bij de versterkingsoperatie behorende contractering en het
      afstemmen van en voeren van overleg over deze versterkingsoperatie met de partijen die hierin belang hebben dan wel
      een belang behartigen. Onderdelen van deze werkzaamheden zijn onder meer het begeleiden van bewoners gedurende het
      versterkingsproces, het toetsen van woningen en panden aan de veiligheid, het voorbereiden en nemen van besluiten
      conform de toepasselijke wet- en regelgeving, het ondersteunen van gemeenten bij programma’s van aanpak en het
      toetsen en het voorbereiden en de uitvoering van de versterking van een gebouw en alle zaken die hiermee samen
      hangen.

      b. draagt bij aan onderzoek, ontwikkeling en innovatie om de versterkingsoperatie te versnellen en pakt zij alle
      zaken op die (in)direct bijdragen aan de versterkingsoperatie of die de wet- en regelgeving in het kader van de
      versterkingsoperatie aan haar opdraagt.

      c. zal zich voorts richten op het bevorderen van maatschappelijk, politiek en bestuurlijk draagvlak voor de
      versterkingsoperatie, maatschappelijke participatie in de uitvoering daarvan, het behandelen van geschillen en het
      vinden van oplossingen alsmede een bijdrage leveren aan het herstel van vertrouwen.
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel12
  - number: '13'
    text: |-
      1 Het cluster Mensen en Middelen staat onder inhoudelijke leiding van de Secretaris-generaal en onder beheersmatige
      leiding van de clusterdirecteur M&M. De directeur P&O vervult de rol van clusterdirecteur M&M. Bij afwezigheid van
      de directeur P&O is de directeur FEZ eerste plaatsvervanger en de CIO BZK tweede plaatsvervanger.

      2 Het cluster Mensen en Middelen waarborgt de samenhang en integraliteit tussen de directies van het cluster en
      draagt zorg voor integrale advisering over mensen en middelen op BR-niveau, DG-niveau en directieniveau.

      3 Het cluster bestaat uit de volgende organisatieonderdelen:

      a. de directie P&O (P&O);

      b. de directie Financieel-Economische Zaken (FEZ);

      c. de directie CIO & Informatiemanagement BZK (CIO BZK);

      d. het secretariaat van de Raad voor het openbaar bestuur (sRob).
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel13
  - number: '14'
    text: |-
      1 De directie P&O staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. kaders stellen, adviseren, initiëren en controller zijn in de P-kolom voor BZK;

      b. bemensen van het tijdelijk werk binnen het kerndepartement;

      c. vormen van de permanent flexibele schil van het kerndepartement voor project- en programmamanagement.

      3 De directie bestaat uit:

      a. HRM advies;

      b. Beleid, Control en Organisatieontwikkeling (BCO);

      c. BZK Flex (FLEX);

      d. Concernadministratie & Bedrijfsvoering (CA&B).
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel14
  - number: '15'
    text: |-
      1 De directie Financieel-economische Zaken staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. de dienstverlening en vakinhoudelijke advisering ten behoeve van het beleid van de financieel-economische
      processen, het (doen) vertalen van centrale kaders en richtlijnen in specifieke voorschriften en procedures;

      b. het beoordelen van beleidsvoorstellen op samenhang tussen inhoudelijke doelstellingen en middeleninzet,
      inclusief de advisering aan de bewindspersonen, secretaris-generaal en de bestuursraad;

      c. het ministeriebreed toetsen van de producten in het kader van de begroting, beleid en beheer en het adviseren
      van de politieke en ambtelijke top hierover;

      d. het voeren van overleg namens het departement met het Ministerie van Financiën over alle begrotings- en
      verantwoordingsaangelegenheden;

      e. het zorgdragen voor een adequaat financieel-economisch beheer voor het ministerie;

      f. het borgen van de kwaliteit van de bedrijfsvoering en de daaraan verbonden (financieel administratieve)
      processen binnen het ministerie;

      g. het adviseren van de secretaris-generaal en de bewindspersonen ten aanzien van bijzondere vraagstukken op
      concernniveau.

      h. het adviseren van de (gemandateerd) eigenaren van agentschappen, ZBO’s en diensten.

      3 De directeur Financieel-economische Zaken bekleedt de functie van coördinerend directeur Inkoop (CDI) en heeft
      vanuit die hoedanigheid de volgende taken:

      a. het stellen van kaders voor het inkoopbeleid van het ministerie;

      b. de coördinatie van de inkoopfunctie en het contractbeheer van het ministerie;

      c. de centrale ondersteuning en advisering bij inkoopvraagstukken.
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel15
  - number: '16'
    text: |-
      1 CIO & Informatiemanagement staat onder leiding van de Chief Information Officer (CIO).

      2 CIO & Informatiemanagement draagt zorg voor de advisering, kaderstelling, toezicht en handhaving op het terrein
      van de informatievoorziening en ICT binnen bedrijfsvoering en beleid in algemene zin, alsmede voor het bevorderen
      van informatiebewustzijn en het gebruik van ICT-middelen middels:

      a. het opstellen en coördineren van de departementale strategie en visie op de informatievoorziening en ICT voor
      bedrijfsvoering en beleid;

      b. de advisering, kaderstelling, het toezicht en de handhaving met betrekking tot kwaliteit van informatie,
      waaronder informatieveiligheid;

      c. de advisering, kaderstelling, het toezicht en de handhaving met betrekking tot het vastleggen, hergebruiken en
      bewaren van informatie;

      d. de advisering, kaderstelling, het toezicht en de handhaving met betrekking tot ICT-werkomgeving binnen het
      ministerie;

      e. de advisering, kaderstelling, toezicht en handhaving met betrekking tot ICT-systemen en applicaties;

      f. het adviseren en geven van oordelen over risicobeheersing op het gebied van ICT en bij projecten of programma’s
      met een belangrijke ICT-component;

      g. de advisering over de voorzieningen in beheer;

      h. het opdrachtgeverschap SSC-ICT voor wat betreft de ICT-werkomgeving voor het ministerie;

      i. het opdrachtgeverschap Digidoc;

      j. het bevorderen van open data binnen het ministerie.
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel16
  - number: '17'
    text: |-
      1 Het cluster Bestuursondersteuning staat onder inhoudelijke leiding van de Secretaris-generaal en onder
      beheersmatige leiding van de clusterdirecteur Bestuursondersteuning. De directeur KIEM vervult de rol van
      clusterdirecteur Bestuursondersteuning. Bij afwezigheid van de directeur KIEM is de directeur BA eerste
      plaatsvervanger en de directeur Communicatie tweede plaatsvervanger.

      2 Het cluster Bestuursondersteuning helpt beleid en uitvoering publieke waarde te realiseren, rekening houdend met
      de politieke omgeving waarin die waardecreatie plaatsvindt en moet worden gelegitimeerd. Het cluster draagt zorg
      voor de overkoepelende blik, de signaalfunctie en het verbindend vermogen.

      3 Het Cluster bestaat uit de volgende organisatieonderdelen:

      a. de directie Communicatie;

      b. de directie Bestuurlijke Advisering (BA)

      c. de directie Kennis, Internationaal, Europa en Macro-economie (KIEM)
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel17
  - number: '18'
    text: |-
      1 De directie Communicatie staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. optreden als strategische, autonome adviseur van bewindspersonen, ambtelijke top en beleid met als doel het
      helpen ontwikkelen en realiseren van maatschappelijk gedragen beleid.

      b. werken aan het realiseren van de lange-termijn-ambities van kabinet en departement.

      c. managen van de dagelijkse actualiteit (kansen, issues, crises).
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel18
  - number: '19'
    text: |-
      1 De directie BA staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. BZK in de volle breedte ondersteunen bij het aanbrengen van samenhang en integraliteit in het politieke en
      beleidswerk, specifiek vanuit politiek-bestuurlijk oogpunt.

      b. adviseren van directies en bewindspersonen op inhoud

      c. faciliteren van het proces van stukkenstroom onder meer door gerichte kennisoverdracht, het aanbieden van een
      aanpak bij belangrijke, nieuwe dossiers, het beschikbaar stellen van informatie en hulpmiddelen en met inzet van
      haar uitgebreide netwerk binnen en buiten BZK.
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel19
  - number: '20'
    text: |-
      1 De directie KIEM staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. de inhoudelijke, BZK-brede strategische agenda versterken,

      b. het Europees en internationaal beleid van BZK coördineren

      c. de economische rationaliteit inbrengen in het BZK-beleid.
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel20
  - number: '21'
    text: |-
      1 De directie Constitutionele Zaken en Wetgeving staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a. het beheer en onderhoud van de Grondwet en het Statuut;

      b. de toetsing van (concept)regelgeving, beleid en maatregelen aan de Grondwet, het Statuut en relevante
      internationale verdragen, inclusief het EU-recht;

      c. het opstellen van regelgeving waar de bewindspersonen eerstverantwoordelijk voor zijn;

      d. het bijdragen aan de totstandkoming van nationale en internationale wetgeving waarbij de bewindspersonen mede
      zijn betrokken;

      e. het adviseren over de noodzaak, wenselijkheid en mogelijkheid om door middel van wetgeving bij te dragen aan het
      bereiken van de beleidsdoelstellingen van de bewindspersonen;

      f. het adviseren over de noodzaak, wenselijkheid en mogelijkheid om de democratische constitutionele orde door
      middel van wetgeving aan te passen aan veranderende maatschappelijke behoeften;

      g. de bezwaar- en beroepsprocedures tegen de bewindspersonen of het ministerie en de advisering over juridische
      aangelegenheden in het algemeen;

      h. het ontwikkelen en implementeren van beleid met betrekking tot een eenvoudiger en beter omgevingsrecht.
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel21
  - number: '22'
    text: |-
