      1 Logius staat onder leiding van een algemeen directeur.

      2 Logius draagt zorg voor:

      a. het beheren en exploiteren van overheidsbrede samenhangende ICT voorzieningen, op het gebied van toegang,
      gegevensuitwisseling, informatiebeveiliging en standaardisatie; ten behoeve van digitale dienstverlening van de
      overheid en publieke instellingen aan burgers en bedrijven;

      b. het bevorderen van het gebruik van deze generieke voorzieningen;

      c. het beheren van stelsels van de generieke digitale infrastructuur;

      d. het voeren van het secretariaat voor het Forum voor Standaardisatie.
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel23
  - number: '24'
    text: |-
      1 De Rijksdienst voor Identiteitsgegevens staat onder leiding van een algemeen directeur.

      2 De Rijksdienst voor Identiteitsgegevens:

      a. draagt zorg voor het beheer van de basisregistratie personen, de persoonsinformatievoorziening in de Caribische
      delen van het Koninkrijk, het burgerservicenummer en de Nederlandse reisdocumenten;

      b. draagt zorg voor de wijze waarop de persoonsgegevens van burgers worden vastgelegd, beheerd en verstrekt voor de
      publieke dienstverlening;

      c. draagt bij aan onderzoek en ontwikkeling, innovatie en regie in het identiteitsdomein.
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel24
  - number: '25'
    text: |-
      1 De Minister stelt de inrichting van de organisatie vast conform het bepaalde in
      [artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011][ref1].

      2 De secretaris-generaal is bevoegd tot het nader vaststellen van de inrichting van de onder de directoraten-
      generaal, het Bureau Algemene Bestuursdienst, de clusters M&M en BO, CZW, Logius, RvIG en de Dienst NCG
      ressorterende organisatieonderdelen, na advisering door de directeur P&O.

      3 De secretaris-generaal is bevoegd tot het nader vaststellen van de inrichting van de Algemene Inlichtingen- en
      Veiligheidsdienst op voordracht van de directeur-generaal van de Algemene Inlichtingen- en Veiligheidsdienst en na
      advisering van de directeur P&O.

      4 De secretaris-generaal en de directeuren-generaal van het Bureau Algemene Bestuursdienst, van het directoraat-
      generaal Vastgoed en Bedrijfsvoering Rijk en van de Algemene Inlichtingen- en Veiligheidsdienst stellen met
      inachtneming van dit besluit ten behoeve van hun dienst- of organisatieonderdelen periodiek een capaciteitsplan
      vast.


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel3
    url: https://wetten.overheid.nl/BWBR0043708/2022-03-23#Artikel25
