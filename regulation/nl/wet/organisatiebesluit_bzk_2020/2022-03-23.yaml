  - number: '3'
    text: |-
      1 Er is een Bestuursraad Binnenlandse Zaken en Koninkrijksrelaties (BR).

      2 De Bestuursraad is samengesteld uit de secretaris-generaal, de directeuren-generaal Bestuur, Ruimte en Wonen,
      Koninkrijksrelaties, Overheidsorganisatie, Bureau Algemene Bestuursdienst, Vastgoed en Bedrijfsvoering Rijk,
      Algemene Inlichtingen- en Veiligheidsdienst, de programma directeur-generaal Omgevingswet, de Chief Information
      Officer BZK, de clusterdirecteur Mensen en Middelen, de clusterdirecteur Bestuursondersteuning en de directeur CZW.
      De leden kunnen zich incidenteel laten vervangen door hun plaatsvervangers of, in uitzonderlijke gevallen, door
      een andere rechtstreeks onder hen ressorterende functionaris. De directeur Financieel-economische Zaken heeft een
      permanente uitnodiging tot het als adviseur bijwonen van de Bestuursraad.

      3 Het overleg in de Bestuursraad heeft, onverminderd het bepaalde in de departementale mandaat- en
      volmachtbesluiten over de bevoegdheden van de afzonderlijke leden van de Bestuursraad ten aanzien van de
      onderwerpen die in het overleg aan de orde komen, ten doel het bespreken en het bereiken van overeenstemming over
      de departementale beleids- en beheerkaders en het toezien op de uitvoering van deze kaders.

      4 De Bestuursraad heeft tevens tot doel het bespreken en het bereiken van overeenstemming over aspecten van het
      departementale personeelsbeleid en personele aangelegenheden alsmede het toezien op de uitvoering hiervan. In het
      overleg komen in ieder geval de volgende aangelegenheden aan de orde:

      a. de ontwikkeling van het departementale HRM-beleid in brede zin;

      b. de beleidsontwikkeling van management-development bij het ministerie;

      c. de voordracht tot benoeming van kandidaten bij het ministerie die behoren tot de ABD-doelgroep topmanager;

      d. de werkzaamheden van de Bestuursraad met betrekking tot de personeelsschouw, zoals aangegeven in het
      departementale beleid ter zake.

      5 Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of indien
      bij wettelijk voorschrift anders is bepaald.

      6 De adviseur Politiek-bestuurlijke advisering voert het secretariaat van de Bestuursraad.

      7 De clusterdirecteur M&M voert het secretariaat van de bespreking van het departementale personeelsbeleid.
