      1 Het directoraat-generaal Bestuur, Ruimte en Wonen staat onder leiding van een directeur-generaal.

      2 Het directoraat-generaal Bestuur, Ruimte en Wonen draagt zorg voor sterk, vernieuwend en adaptief openbaar
      bestuur, een functionerend en zich ontwikkelend democratisch stelsel, een evenwichtige woningmarkt, een goed
      bouwklimaat, de verdere ontwikkeling van Nederland als een veilige, leefbare, bereikbare en concurrerende delta en
      een versnelde versterking van de gebouwen in het aardbevingsgebied door het uitvoeren van de volgende taken:

      a. het bevorderen van een doelmatig, doeltreffend en democratisch openbaar bestuur, waaronder begrepen de relaties,
      de Europese Unie en andere internationale instellingen;

      b. het zorgdragen voor een goede en adequate organisatie met betrekking tot het Nederlandse openbaar bestuur, onder
      andere met betrekking tot de financiën van gemeenten en provincies (het Gemeentefonds en het Provinciefonds);

      c. het in overleg met de overige ministeries zorgdragen voor goede interbestuurlijke relaties, beredeneerd vanuit
      de eigenstandige positie van provincies en gemeenten en het bijdragen aan de oplossing van spanningen, dilemma’s en
      actuele vraagstukken op het snijvlak van politiek, bestuur en samenleving;

      d. een functionerende woningmarkt met aandacht voor keuzevrijheid en betaalbaarheid, ook voor lagere
      inkomensgroepen, bijzondere (urgente) aandachtgroepen en gebieden;

      e. het bevorderen dat woningcorporaties het publiek belang behartigen en het waarborgen van een goed werkend
      corporatiestelsel;

      f. het bevorderen van het tot stand komen van voldoende woningen en de bouwtechnische onderscheidenlijk
      gebruikskwaliteit daarvan en het ontwikkelen van beleid op het gebied van energiebesparing in de gebouwde omgeving;

      g. het ter beschikking stellen van mensen en middelen aan de Hoge Raad van Adel;

      h. het ontwikkelen en implementeren van beleid met betrekking tot:

      1°. de coördinatie en uitvoering van het nationaal ruimtelijk beleid;

      2°. het doen van onderzoek naar de effecten van maatschappelijk ontwikkelingen op nationale ruimtelijke belangen,
      het afstemmen van het ruimtelijke beleid op ontwikkelingen in het buitenland alsmede het leveren van een bijdrage
      op Europese dossiers met een ruimtelijke component;

      3°. het ruimtelijke instrumentarium, waaronder de wettelijke en bijbehorende digitale instrumenten en
      dienstverlening;

      4°. de geo-informatie-infrastructuur en de basisregistraties, inclusief de bijbehorende digitale instrumenten en
      dienstverlening;

      5°. ruimtelijk ontwerp en geo-analyse in ruimtelijke plannen, programma’s en projecten;

      6°. gebieden van nationaal belang;

      7°. ruimteprojecten van nationaal belang alsmede instrumenten ter ondersteuning van gebiedsgerichte projecten;

      8°. de rijksagenda voor gebieden en fysieke projecten en het integreren van sectorale belangen in gebieden; en

      9°. de ruimtelijke en economische ontwikkeling van de mainport Schiphol in relatie tot de ruimtelijke belangen van
      de regio en het belang van de bereikbaarheid;

      i. het uitvoeren en versnellen van de versterkingsopgave in Groningen met meer regie voor de bewoners, het
      bijdragen aan de ontwikkeling van een bestendig toekomst perspectief voor de Provincie Groningen en het invullen
      van het opdrachtgeverschap aan de Dienst Nationaal Coördinator Groningen.

      3 Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:

      a. de directie Bestuur, Financiën en Regio’s (DBFR);

      b. de directie Democratie en Bestuur (DDB);

      c. de directie Wonen (DW);

      d. de directie Ruimte en Leefomgeving (DRL);

      e. de directie Bouwen en Energie (DBE);

      f. het secretariaat van de adviescommissie geschilbeslechting;

      g. de programmadirectie Groningen, Versterken en Perspectief (pdG);

      h. de directie Woningbouw (DWB).
