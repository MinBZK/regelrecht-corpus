  - number: '4'
    text: |-
      1 De Algemene Leiding bestaat uit de secretaris-generaal.

      2 De secretaris-generaal is belast met de ambtelijke leiding van het ministerie. Tot deze taak behoort in ieder
      geval:

      a. het informeren en adviseren van de bewindspersonen over aangelegenheden, de bewindspersonen of het ministerie
      betreffende;

      b. het zorgdragen voor de coördinatie en integratie van beleidsvoorbereiding, beleidsontwikkeling en
      beleidsuitvoering binnen het ministerie;

      c. het uitoefenen van de algemene controlfunctie bij het ministerie;

      d. het rechtstreeks leiding geven aan de (programma) directeuren-generaal, de directeuren en Chief Information
      Officer BZK van het Cluster M&M, de directeuren van het cluster BO, de directeur CZW en de algemeen directeuren
      Logius, RvIG en Dienst NCG;

      e. het voorzitterschap van de Bestuursraad;

      f. het zorgdragen voor het nemen van besluiten over en het geven van algemene aanwijzingen ten aanzien van het
      algemene beleid en beheer inzake de bedrijfsvoering en de formatie van het ministerie;

      g. het voeren van overleg met de Departementale ondernemingsraad en de Ondernemingsraad BZK Kerndepartement, als
      bestuurder in de zin van de [Wet op de Ondernemingsraden][ref1], en met de vakbonden, bedoeld in paragraaf 27.2 CAO
      Rijk 2020;

      h. het optreden als gemachtigd ambtenaar in de zin van de
      [Uitvoeringsregeling openbaarheid van bestuur Binnenlandse Zaken][ref2];

      i. het plegen van inhoudelijke afstemming met het secretariaat van de Raad voor het openbaar bestuur (sRob);

      j. het toezicht op het beheer van de zelfstandige bestuursorganen met een relatie met het ministerie;

      k. het eigenaarschap van alle tot het ministerie behorende agentschappen;

      l. het geven van uitvoering aan de [Regeling audit committees van het Rijk][ref3];

      m. het verlenen of weigeren van goedkeuring van besluiten tot uitzonderingen op de aanbestedingsregelgeving;

      n. het ‘eigenaarschap’ van de Dienst Nationaal Coördinator Groningen.


