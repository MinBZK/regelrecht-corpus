        artikel: '5'
      - id: ref2
        bwb_id: BWBR0028079
        artikel: '11'
  - number: 2.2.d
    text: |-
      ten behoeve van de uitvoering van de [Wet basisadministratie persoonsgegevens BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028208
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028208
  - number: 2.2.e
    text: |-
      ten behoeve van de uitvoering van de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0028258
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028258
  - number: 2.2.f
    text: |-
      ten behoeve van de uitvoering van de [Kieswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '2.3'
    text: |-
      Deze wet is niet van toepassing op verwerking van persoonsgegevens door de krijgsmacht indien Onze Minister van
      Defensie daartoe beslist met het oog op de inzet of het ter beschikking stellen van de krijgsmacht ter handhaving
      of bevordering van de internationale rechtsorde.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel2
  - number: '3.1'
    text: |-
      Deze wet is niet van toepassing op de verwerking van persoonsgegevens voor uitsluitend journalistieke,
      artistieke of literaire doeleinden, behoudens de overige bepalingen van dit hoofdstuk, alsmede de
      [artikelen 6 tot en met 11][ref1], [13 tot en met 15][ref2], en [39][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0028067#Artikel39
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028067
        artikel: '39'
        hoofdstuk: '6'
  - number: '3.2'
    text: |-
      Het verbod om persoonsgegevens als bedoeld in [artikel 16][ref1] te verwerken is niet van toepassing voor zover dit
      noodzakelijk is voor de doeleinden als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel16
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Deze wet is van toepassing op de verwerking van persoonsgegevens in het kader van activiteiten van een vestiging
      van een verantwoordelijke in de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel4
  - number: '4.2'
    text: |-
      Deze wet is van toepassing op de verwerking van persoonsgegevens door of ten behoeve van een verantwoordelijke
      die geen vestiging heeft in de openbare lichamen, waarbij gebruik wordt gemaakt van al dan niet geautomatiseerde
      middelen die zich in de openbare lichamen bevinden, tenzij deze middelen slechts worden gebruikt voor de doorvoer
      van persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel4
  - number: '4.3'
    text: |-
      Het is een verantwoordelijke als bedoeld in het tweede lid, verboden persoonsgegevens te verwerken, tenzij hij
      in het openbaar lichaam een persoon of instantie aanwijst die namens hem handelt overeenkomstig de bepalingen
      van deze wet. Voor de toepassing van deze wet en de daarop berustende bepalingen, wordt hij aangemerkt als de
      verantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel4
  - number: '5.1'
    text: |-
      Indien de betrokkene minderjarig is en de leeftijd van zestien jaren nog niet heeft bereikt, of onder curatele is
      gesteld, dan wel ten behoeve van de betrokkene een mentorschap is ingesteld, is in de plaats van de toestemming van
      de betrokkene die van zijn wettelijk vertegenwoordiger vereist.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel5
  - number: '5.2'
    text: Een toestemming kan door de betrokkene of zijn wettelijk vertegenwoordiger te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel5
  - number: '6'
    text: Persoonsgegevens worden in overeenstemming met de wet en op behoorlijke en zorgvuldige wijze verwerkt.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel6
  - number: '7'
    text: Persoonsgegevens worden voor welbepaalde, uitdrukkelijk omschreven en gerechtvaardigde doeleinden verzameld.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel7
  - number: '8'
    text: 'Persoonsgegevens mogen slechts worden verwerkt indien:'
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel8
  - number: 8.a
    text: de betrokkene voor de verwerking zijn ondubbelzinnige toestemming heeft verleend;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel8
  - number: 8.b
    text: |-
      de gegevensverwerking noodzakelijk is voor de uitvoering van een overeenkomst waarbij de betrokkene partij is, of
      voor het nemen van precontractuele maatregelen naar aanleiding van een verzoek van de betrokkene die noodzakelijk
      zijn voor het sluiten van een overeenkomst;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel8
  - number: 8.c
    text: |-
      de gegevensverwerking noodzakelijk is om een wettelijke verplichting na te komen waaraan de verantwoordelijke
      onderworpen is;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel8
  - number: 8.d
    text: de gegevensverwerking noodzakelijk is ter vrijwaring van een vitaal belang van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel8
  - number: 8.e
    text: |-
      de gegevensverwerking noodzakelijk is voor de goede vervulling van een publiekrechtelijke taak door het
      desbetreffende bestuursorgaan dan wel het bestuursorgaan waaraan de gegevens worden verstrekt, of
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel8
  - number: 8.f
    text: |-
      de gegevensverwerking noodzakelijk is voor de behartiging van het gerechtvaardigde belang van de verantwoordelijke
      of van een derde aan wie de gegevens worden verstrekt, tenzij het belang of de fundamentele rechten en vrijheden
      van de betrokkene, in het bijzonder het recht op bescherming van de persoonlijke levenssfeer, prevaleert.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel8
  - number: '9.1'
    text: |-
      Persoonsgegevens worden niet verder verwerkt op een wijze die onverenigbaar is met de doeleinden waarvoor ze zijn
      verkregen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel9
  - number: '9.2'
    text: |-
      Bij de beoordeling of een verwerking onverenigbaar is als bedoeld in het eerste lid, houdt de verantwoordelijke in
      elk geval rekening met:
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel9
  - number: 9.2.a
    text: de verwantschap tussen het doel van de beoogde verwerking en het doel waarvoor de gegevens zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel9
  - number: 9.2.b
    text: de aard van de desbetreffende gegevens;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel9
  - number: 9.2.c
    text: de gevolgen van de beoogde verwerking voor de betrokkene;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel9
  - number: 9.2.d
    text: de wijze waarop de gegevens zijn verkregen en
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel9
  - number: 9.2.e
    text: de mate waarin jegens de betrokkene wordt voorzien in passende waarborgen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel9
  - number: '9.3'
    text: |-
      Verdere verwerking van de gegevens voor historische, statistische of wetenschappelijke doeleinden, wordt niet
      als onverenigbaar beschouwd, indien de verantwoordelijke de nodige voorzieningen heeft getroffen ten einde te
      verzekeren dat de verdere verwerking uitsluitend geschiedt ten behoeve van deze specifieke doeleinden.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel9
  - number: '9.4'
    text: |-
      De verwerking van persoonsgegevens blijft achterwege voor zover een geheimhoudingsplicht uit hoofde van ambt,
      beroep of wettelijk voorschrift daaraan in de weg staat.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel9
  - number: '10.1'
    text: |-
      Persoonsgegevens worden niet langer bewaard in een vorm die het mogelijk maakt de betrokkene te identificeren,
      dan noodzakelijk is voor de verwerkelijking van de doeleinden waarvoor zij worden verzameld of vervolgens worden
      verwerkt.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel10
  - number: '10.2'
    text: |-
      Persoonsgegevens mogen langer worden bewaard dan bepaald in het eerste lid voor zover ze voor historische,
      statistische of wetenschappelijke doeleinden worden bewaard, en de verantwoordelijke de nodige voorzieningen heeft
      getroffen ten einde te verzekeren dat de desbetreffende gegevens uitsluitend voor deze specifieke doeleinden worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel10
  - number: '11.1'
    text: |-
      Persoonsgegevens worden slechts verwerkt voor zover zij, gelet op de doeleinden waarvoor zij worden verzameld of
      vervolgens worden verwerkt, toereikend, ter zake dienend en niet bovenmatig zijn.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel11
  - number: '11.2'
    text: |-
      De verantwoordelijke treft de nodige maatregelen opdat persoonsgegevens, gelet op de doeleinden waarvoor zij worden
      verzameld of vervolgens worden verwerkt, juist en nauwkeurig zijn.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel11
  - number: '12.1'
    text: |-
      Een ieder die handelt onder het gezag van de verantwoordelijke of van de bewerker, alsmede de bewerker zelf,
      voor zover deze toegang hebben tot persoonsgegevens, verwerkt deze slechts in opdracht van de verantwoordelijke,
      behoudens afwijkende wettelijke verplichtingen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel12
  - number: '12.2'
    text: |-
      De personen, bedoeld in het eerste lid, voor wie niet reeds uit hoofde van ambt, beroep of wettelijk voorschrift
      een geheimhoudingsplicht geldt, zijn verplicht tot geheimhouding van de persoonsgegevens waarvan zij kennis nemen,
      behoudens voor zover enig wettelijk voorschrift hen tot mededeling verplicht of uit hun taak de noodzaak tot
      mededeling voortvloeit. [Artikel 285 van het Wetboek van Strafrecht BES][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel285
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '285'
  - number: '13'
    text: |-
      De verantwoordelijke legt passende technische en organisatorische maatregelen ten uitvoer om persoonsgegevens te
      beveiligen tegen verlies of tegen enige vorm van onrechtmatige verwerking. Deze maatregelen garanderen, rekening
      houdend met de stand van de techniek en de kosten van de tenuitvoerlegging, een passend beveiligingsniveau, gelet
      op de risico’s die de verwerking en de aard van te beschermen gegevens met zich meebrengen. De maatregelen zijn er
      mede op gericht onnodige verzameling en verdere verwerking van persoonsgegevens te voorkomen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel13
  - number: '14.1'
    text: |-
      Indien de verantwoordelijke persoonsgegevens te zijnen behoeve laat verwerken door een bewerker, draagt hij zorg
      dat deze voldoende waarborgen biedt ten aanzien van de technische en organisatorische beveiligingsmaatregelen met
      betrekking tot de te verrichten verwerkingen. De verantwoordelijke ziet toe op de naleving van die maatregelen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel14
  - number: '14.2'
    text: |-
      De uitvoering van verwerkingen door een bewerker wordt geregeld in een overeenkomst of krachtens een andere
      rechtshandeling waardoor een verbintenis ontstaat tussen de bewerker en de verantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel14
  - number: '14.3'
    text: De verantwoordelijke draagt zorg dat de bewerker
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel14
  - number: 14.3.a
    text: |-
      de persoonsgegevens verwerkt in overeenstemming met [artikel 12, eerste lid][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel12
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 14.3.b
    text: |-
      de verplichtingen nakomt die op de verantwoordelijke rusten ingevolge [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel13
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '14.4'
    text: |-
      Is de bewerker niet gevestigd in de openbare lichamen, dan draagt de verantwoordelijke zorg dat de bewerker het
      recht van dat andere land nakomt, in afwijking van het derde lid, onder b.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel14
  - number: '14.5'
    text: |-
      Met het oog op het bewaren van het bewijs worden de onderdelen van de overeenkomst of de rechtshandeling
      die betrekking hebben op de bescherming van persoonsgegevens, alsmede de beveiligingsmaatregelen, bedoeld in
      [artikel 13][ref1] schriftelijk of in een andere, gelijkwaardige vorm vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel13
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '15'
    text: |-
      De verantwoordelijke draagt zorg voor de naleving van de verplichtingen, bedoeld in de
      [artikelen 6 tot en met 12][ref1] en [14, tweede en vijfde lid van dit hoofdstuk][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel14
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '16'
    text: |-
      De verwerking van persoonsgegevens betreffende iemands godsdienst of levensovertuiging, ras, politieke gezindheid,
      gezondheid, seksuele leven, alsmede persoonsgegevens betreffende het lidmaatschap van een vakvereniging is
      verboden behoudens het bepaalde in deze paragraaf. Hetzelfde geldt voor strafrechtelijke persoonsgegevens en
      persoonsgegevens over onrechtmatig of hinderlijk gedrag in verband met een opgelegd verbod naar aanleiding van
      dat gedrag.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel16
  - number: '17.1'
    text: |-
      Het verbod om persoonsgegevens betreffende iemands godsdienst of levensovertuiging te verwerken, bedoeld in
      [artikel 16][ref1], is niet van toepassing indien de verwerking geschiedt door:


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel16
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 17.1.a
    text: |-
      kerkgenootschappen, zelfstandige onderdelen daarvan of andere genootschappen op geestelijke grondslag voor zover
      het gaat om gegevens van daartoe behorende personen;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel17
  - number: 17.1.b
    text: |-
      instellingen op godsdienstige of levensbeschouwelijke grondslag, voor zover dit gelet op het doel van de instelling
      en voor de verwezenlijking van haar grondslag noodzakelijk is, of
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel17
  - number: 17.1.c
    text: |-
      andere instellingen voor zover dit noodzakelijk is met het oog op de geestelijke verzorging van de betrokkene,
      tenzij deze daartegen schriftelijk bezwaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel17
  - number: '17.2'
    text: |-
      In de gevallen, bedoeld in het eerste lid, onder a, is het verbod tevens niet van toepassing op persoonsgegevens
      betreffende godsdienst of levensovertuiging van de gezinsleden van de betrokkene voor zover:
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel17
  - number: 17.2.a
    text: |-
      het desbetreffende genootschap met die gezinsleden uit hoofde van haar doelstelling regelmatige contacten
      onderhoudt en
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel17
  - number: 17.2.b
    text: die gezinsleden daartegen geen schriftelijk bezwaar hebben gemaakt.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel17
  - number: '17.3'
    text: |-
      In de gevallen, bedoeld in het eerste en tweede lid worden geen persoonsgegevens aan derden verstrekt zonder
      toestemming van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel17
  - number: '18'
    text: |-
      Het verbod om persoonsgegevens betreffende iemands ras te verwerken, bedoeld in [artikel 16][ref1], is niet van
      toepassing indien de verwerking geschiedt:


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel16
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 18.a
    text: met het oog op de identificatie van de betrokkene en slechts voor zover dit voor dit doel onvermijdelijk is;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel18
  - number: 18.b
    text: |-
      met het doel personen van een bepaalde etnische of culturele minderheidsgroep een bevoorrechte positie toe te
      kennen ten einde feitelijke nadelen verband houdende met de grond ras op te heffen of te verminderen en slechts
      indien:
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel18
  - number: 18.b.1°
    text: dit voor dat doel noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel18
  - number: 18.b.2°
    text: |-
      de gegevens slechts betrekking hebben op het geboorteland van de betrokkene, van diens ouders of grootouders, dan
      wel op andere, bij wet vastgestelde criteria, op grond waarvan op objectieve wijze vastgesteld kan worden of iemand
      tot een minderheidsgroep als bedoeld in de aanhef van onderdeel b behoort, en
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel18
  - number: 18.b.3°
    text: de betrokkene daartegen geen schriftelijk bezwaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel18
  - number: '19.1'
    text: |-
      Het verbod om persoonsgegevens betreffende iemands politieke gezindheid te verwerken, bedoeld in
      [artikel 16][ref1], is niet van toepassing indien de verwerking geschiedt:


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel16
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 19.1.a
    text: |-
      door instellingen op politieke grondslag betreffende hun leden of hun werknemers dan wel andere tot de instelling
      behorende personen, voor zover dit gelet op het doel van de instelling noodzakelijk is voor de verwezenlijking van
      haar grondslag, of
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel19
  - number: 19.1.b
    text: |-
      met het oog op de eisen die met betrekking tot politieke gezindheid in redelijkheid kunnen worden gesteld in
      verband met de vervulling van functies in bestuursorganen en adviescolleges.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel19
  - number: '19.2'
    text: |-
      In het geval, bedoeld in het eerste lid, onder a, worden geen persoonsgegevens aan derden verstrekt zonder
      toestemming van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel19
  - number: '20.1'
    text: |-
      Het verbod om persoonsgegevens betreffende iemands lidmaatschap van een vakbond te verwerken, bedoeld in
      [artikel 16][ref1], is niet van toepassing indien de verwerking geschiedt door de desbetreffende vakbond of
      de vakcentrale waarvan die bond een onderdeel vormt, voor zover dat gelet op de doelstelling van de vakbond of
      centrale noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel16
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '20.2'
    text: |-
      In het geval, bedoeld in het eerste lid worden geen persoonsgegevens aan derden verstrekt zonder toestemming van
      de betrokkene.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel20
  - number: '21.1'
    text: |-
      Het verbod om persoonsgegevens betreffende iemands gezondheid te verwerken, bedoeld in [artikel 16][ref1], is niet
      van toepassing indien de verwerking geschiedt door:


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel16
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 21.1.a
    text: |-
      hulpverleners, instellingen of voorzieningen voor gezondheidszorg of maatschappelijke dienstverlening voor zover
      dat met het oog op een goede behandeling of verzorging van de betrokkene, dan wel het beheer van de betreffende
      instelling of beroepspraktijk noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
  - number: 21.1.b
    text: |-
      verzekeraars als bedoeld in [artikel 1, eerste lid, onderdeel g, van de Wet toezicht verzekeringsbedrijf BES][ref1],
      en financiële dienstverleners die bemiddelen in verzekeringen als bedoeld in die wet, voor zover dat noodzakelijk
      is voor:


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel1
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028495
        artikel: '1'
  - number: 21.1.b.1°
    text: de beoordeling van het door de verzekeraar te verzekeren risico en de betrokkene geen bezwaar heeft gemaakt; of
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
  - number: 21.1.b.2°
    text: de uitvoering van de overeenkomst van verzekering;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
  - number: 21.1.c
    text: |-
      scholen voor zover dat met het oog op de speciale begeleiding van leerlingen of het treffen van bijzondere
      voorzieningen in verband met hun gezondheidstoestand noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
  - number: 21.1.d
    text: |-
      een reclasseringsinstelling, een bijzondere reclasseringsambtenaar, en de voogdijraad, de gezinsvoogd, of een
      rechtspersoon als bedoeld in artikel 302, eerste lid, van het Burgerlijk Wetboek BES voor zover dat noodzakelijk is
      voor de uitvoering van de hun wettelijk opgedragen taken
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
  - number: 21.1.e
    text: |-
      Onze Minister van Justitie voor zover dat in verband met de tenuitvoerlegging van vrijheidsstraffen of
      vrijheidsbenemende maatregelen noodzakelijk is of
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
  - number: 21.1.f
    text: |-
      bestuursorganen, pensioenfondsen, werkgevers of instellingen die te hunnen behoeve werkzaam zijn voor zover dat
      noodzakelijk is voor:
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
  - number: 21.1.f.1°
    text: |-
      een goede uitvoering van wettelijke voorschriften, pensioenregelingen of collectieve arbeidsovereenkomsten die
      voorzien in aanspraken die afhankelijk zijn van de gezondheidstoestand van de betrokkene of
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
  - number: 21.1.f.2°
    text: |-
      de reïntegratie of begeleiding van werknemers of uitkeringsgerechtigden in verband met ziekte of
      arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
  - number: '21.2'
    text: |-
      In de gevallen, bedoeld in het eerste lid worden de gegevens alleen verwerkt door personen die uit hoofde van
      ambt, beroep of wettelijk voorschrift, dan wel krachtens een overeenkomst tot geheimhouding zijn verplicht. Indien
      de verantwoordelijke gegevens persoonlijk verwerkt en op hem niet reeds uit hoofde van ambt, beroep of wettelijk
      voorschrift een geheimhoudingsplicht rust, is hij verplicht tot geheimhouding van de gegevens, behoudens voor zover
      de wet hem tot mededeling verplicht of uit zijn taak de noodzaak voortvloeit dat de gegevens worden meegedeeld aan
      anderen die krachtens het eerste lid bevoegd zijn tot verwerking daarvan.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
  - number: '21.3'
    text: |-
      Het verbod om andere persoonsgegevens als bedoeld in [artikel 16][ref1] te verwerken, is niet van toepassing voor
      zover dit noodzakelijk is in aanvulling op de verwerking van persoonsgegevens betreffende iemands gezondheid als
      bedoeld in het eerste lid, onder a, met het oog op een goede behandeling of verzorging van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel16
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '21.4'
    text: |-
      Persoonsgegevens betreffende erfelijke eigenschappen mogen slechts worden verwerkt voor zover deze verwerking
      plaatsvindt met betrekking tot de betrokkene bij wie de desbetreffende gegevens zijn verkregen, tenzij:
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
  - number: 21.4.a
    text: een zwaarwegend geneeskundig belang prevaleert of
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
  - number: 21.4.b
    text: de verwerking noodzakelijk is ten behoeve van wetenschappelijk onderzoek of statistiek.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
  - number: '21.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen omtrent de toepassing van het eerste lid, onder b en f, nadere regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel21
  - number: '22.1'
    text: |-
      Het verbod om strafrechtelijke persoonsgegevens te verwerken, bedoeld in [artikel 16][ref1], is niet
      van toepassing indien de verwerking geschiedt door organen die krachtens de wet zijn belast met de
      toepassing van het strafrecht, alsmede door verantwoordelijken die deze hebben verkregen bij of krachtens
      de [Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref2] of de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028079
      [ref3]: https://wetten.overheid.nl/BWBR0028258
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028079
      - id: ref3
        bwb_id: BWBR0028258
  - number: '22.2'
    text: 'Het verbod is niet van toepassing op de verantwoordelijke die deze gegevens ten eigen behoeve verwerkt ter:'
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel22
  - number: 22.2.a
    text: |-
      beoordeling van een verzoek van betrokkene om een beslissing over hem te nemen of aan hem een prestatie te leveren
      of
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel22
  - number: 22.2.b
    text: |-
      bescherming van zijn belangen voor zover het gaat om strafbare feiten die zijn of op grond van feiten en
      omstandigheden naar verwachting zullen worden gepleegd jegens hem of jegens personen die in zijn dienst zijn.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel22
  - number: '22.3'
    text: |-
      Het verbod om andere persoonsgegevens als bedoeld in [artikel 16][ref1], te verwerken, is niet van toepassing voor
      zover dit noodzakelijk is in aanvulling op de verwerking van strafrechtelijke gegevens voor de doeleinden waarvoor
      deze gegevens worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel16
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '22.4'
    text: |-
      Het tweede en derde lid is van overeenkomstige toepassing op persoonsgegevens betreffende een door de rechter
      opgelegd verbod naar aanleiding van onrechtmatig of hinderlijk gedrag.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel22
  - number: '23.1'
    text: |-
      Onverminderd de [artikelen 17 tot en met 22][ref1] is het verbod om persoonsgegevens als bedoeld in
      [artikel 16][ref2], te verwerken niet van toepassing voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel16
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 23.1.a
    text: dit geschiedt met uitdrukkelijke toestemming van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel23
  - number: 23.1.b
    text: de gegevens door de betrokkene duidelijk openbaar zijn gemaakt;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel23
  - number: 23.1.c
    text: dit noodzakelijk is voor de vaststelling, de uitoefening of de verdediging van een recht in rechte;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel23
  - number: 23.1.d
    text: dit noodzakelijk is ter voldoening aan een volkenrechtelijke verplichting of
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel23
  - number: 23.1.e
    text: |-
      dit noodzakelijk is met het oog op een zwaarwegend algemeen belang, passende waarborgen worden geboden ter
      bescherming van de persoonlijke levenssfeer en dit bij wet wordt bepaald dan wel de commissie ontheffing heeft
      verleend. De commissie kan bij de verlening van ontheffing beperkingen en voorschriften opleggen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel23
  - number: '23.2'
    text: |-
      Het verbod om persoonsgegevens als bedoeld in [artikel 16][ref1], te verwerken ten behoeve van wetenschappelijk
      onderzoek of statistiek is niet van toepassing voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel16
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 23.2.a
    text: het onderzoek een algemeen belang dient,
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel23
  - number: 23.2.b
    text: de verwerking voor het desbetreffende onderzoek of de desbetreffende statistiek noodzakelijk is,
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel23
  - number: 23.2.c
    text: het vragen van uitdrukkelijke toestemming onmogelijk blijkt of een onevenredige inspanning kost en
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel23
  - number: 23.2.d
    text: |-
      bij de uitvoering is voorzien in zodanige waarborgen dat de persoonlijke levenssfeer van de betrokkene niet
      onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel23
  - number: '24'
    text: |-
      Een nummer dat ter identificatie van een persoon bij wet is voorgeschreven, wordt bij de verwerking van
      persoonsgegevens slechts gebruikt ter uitvoering van de desbetreffende wet dan wel voor doeleinden bij de wet
      bepaald.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel24
  - number: '25.1'
    text: |-
      Indien persoonsgegevens worden verkregen bij de betrokkene, deelt de verantwoordelijke vóór het moment van de
      verkrijging de betrokkene de informatie mede, bedoeld in het tweede en derde lid, tenzij de betrokkene daarvan
      reeds op de hoogte is.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel25
  - number: '25.2'
    text: |-
      De verantwoordelijke deelt de betrokkene zijn identiteit en de doeleinden van de verwerking waarvoor de gegevens
      zijn bestemd, mede.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel25
  - number: '25.3'
    text: |-
      De verantwoordelijke verstrekt nadere informatie voor zover dat gelet op de aard van de gegevens, de omstandigheden
      waaronder zij worden verkregen of het gebruik dat ervan wordt gemaakt, nodig is om tegenover de betrokkene een
      behoorlijke en zorgvuldige verwerking te waarborgen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel25
  - number: '26.1'
    text: |-
      Indien persoonsgegevens worden verkregen op een andere wijze dan bedoeld in [artikel 25][ref1], deelt de
      verantwoordelijke de betrokkene de informatie mede, bedoeld in het tweede en derde lid, tenzij deze reeds daarvan
      op de hoogte is:


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel25
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '25'
        hoofdstuk: '3'
  - number: 26.1.a
    text: op het moment van vastlegging van hem betreffende gegevens, of
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel26
  - number: 26.1.b
    text: |-
      wanneer de gegevens bestemd zijn om te worden verstrekt aan een derde, uiterlijk op het moment van de eerste
      verstrekking.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel26
  - number: '26.2'
    text: De verantwoordelijke deelt de betrokkene zijn identiteit en de doeleinden van de verwerking mede.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel26
  - number: '26.3'
    text: |-
      De verantwoordelijke verstrekt nadere informatie voor zover dat gelet op de aard van de gegevens, de omstandigheden
      waaronder zij worden verkregen of het gebruik dat ervan wordt gemaakt, nodig is om tegenover de betrokkene een
      behoorlijke en zorgvuldige verwerking te waarborgen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel26
  - number: '26.4'
    text: |-
      Het eerste lid is niet van toepassing indien mededeling van de informatie aan de betrokkene onmogelijk blijkt of
      een onevenredige inspanning kost. In dat geval legt de verantwoordelijke de herkomst van de gegevens vast.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel26
  - number: '26.5'
    text: |-
      Het eerste lid is evenmin van toepassing indien de vastlegging of de verstrekking bij of krachtens de wet is
      voorgeschreven. In dat geval dient de verantwoordelijke de betrokkene op diens verzoek te informeren over het
      wettelijk voorschrift dat tot de vastlegging of verstrekking van de hem betreffende gegevens heeft geleid.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel26
  - number: '27.1'
    text: |-
      De betrokkene heeft het recht zich vrijelijk en met redelijke tussenpozen tot de verantwoordelijke te wenden met
      het verzoek hem mede te delen of hem betreffende persoonsgegevens worden verwerkt. De verantwoordelijke deelt de
      betrokkene schriftelijk binnen vier weken mee of hem betreffende persoonsgegevens worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel27
  - number: '27.2'
    text: |-
      Indien zodanige gegevens worden verwerkt, bevat de mededeling een volledig overzicht daarvan in begrijpelijke vorm,
      een omschrijving van het doel of de doeleinden van de verwerking, de categorieën van gegevens waarop de verwerking
      betrekking heeft en de ontvangers of categorieën van ontvangers, alsmede de beschikbare informatie over de herkomst
      van de gegevens.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel27
  - number: '27.3'
    text: |-
      Voordat een verantwoordelijke een mededeling doet als bedoeld in het eerste lid, waartegen een derde naar
      verwachting bedenkingen zal hebben, stelt hij die derde in de gelegenheid zijn zienswijze naar voren te brengen
      indien de mededeling gegevens bevat die hem betreffen, tenzij dit onmogelijk blijkt of een onevenredige inspanning
      kost.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel27
  - number: '27.4'
    text: |-
      Desgevraagd doet de verantwoordelijke mededelingen omtrent de logica die ten grondslag ligt aan de geautomatiseerde
      verwerking van hem betreffende gegevens.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel27
  - number: '28.1'
    text: |-
      Degene aan wie overeenkomstig [artikel 26][ref1] kennis is gegeven van hem betreffende persoonsgegevens, kan
      de verantwoordelijke verzoeken deze te verbeteren, aan te vullen, te verwijderen, of af te schermen indien deze
      feitelijk onjuist zijn, voor het doel of de doeleinden van de verwerking onvolledig of niet ter zake dienend zijn
      dan wel anderszins in strijd met een wettelijk voorschrift worden verwerkt. Het verzoek bevat de aan te brengen
      wijzigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel26
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '26'
        hoofdstuk: '3'
  - number: '28.2'
    text: |-
      De verantwoordelijke bericht de verzoeker binnen vier weken na ontvangst van het verzoek schriftelijk of dan wel in
      hoeverre hij daaraan voldoet. Een weigering is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel28
  - number: '28.3'
    text: |-
      De verantwoordelijke draagt zorg dat een beslissing tot verbetering, aanvulling, verwijdering of afscherming zo
      spoedig mogelijk wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel28
  - number: '28.4'
    text: |-
      Indien de persoonsgegevens zijn vastgelegd op een gegevensdrager waarin geen wijzigingen kunnen worden aangebracht,
      dan treft hij de voorzieningen die nodig zijn om de gebruiker van de gegevens te informeren over de onmogelijkheid
      van verbetering, aanvulling, verwijdering of afscherming ondanks het feit dat er grond is voor aanpassing van de
      gegevens op grond van dit artikel.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel28
  - number: '28.5'
    text: |-
      Het eerste tot en met vierde lid is niet van toepassing op bij de wet ingestelde openbare registers, indien in
      die wet een bijzondere procedure voor de verbetering, aanvulling, verwijdering of afscherming van gegevens is
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel28
  - number: '29.1'
    text: |-
      Indien een gewichtig belang van de verzoeker dit eist, voldoet de verantwoordelijke aan een verzoek als bedoeld in
      de [artikelen 27][ref1] en [28][ref2], in een andere dan schriftelijke vorm, die aan dat belang is aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel28
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '27'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '28'
        hoofdstuk: '4'
  - number: '29.2'
    text: De verantwoordelijke draagt zorg voor een deugdelijke vaststelling van de identiteit van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel29
  - number: '29.3'
    text: |-
      De verzoeken, bedoeld in de [artikelen 27][ref1] en [28][ref2], worden ten aanzien van minderjarigen die de
      leeftijd van zestien jaren nog niet hebben bereikt, en ten aanzien van onder curatele gestelden gedaan door hun
      wettelijke vertegenwoordigers. De betrokken mededeling geschiedt eveneens aan de wettelijke vertegenwoordigers.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel28
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '27'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '28'
        hoofdstuk: '4'
  - number: '30.1'
    text: |-
      De verantwoordelijke die naar aanleiding van een verzoek op grond van [artikel 28][ref1] persoonsgegevens heeft
      verbeterd, aangevuld, verwijderd of afgeschermd, is verplicht om aan derden aan wie de gegevens daaraan voorafgaand
      zijn verstrekt, zo spoedig mogelijk kennis te geven van de verbetering, aanvulling, verwijdering of afscherming,
      tenzij dit onmogelijk blijkt of een onevenredige inspanning kost.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel28
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '28'
        hoofdstuk: '4'
  - number: '30.2'
    text: |-
      De verantwoordelijke doet aan de verzoeker, bedoeld in [artikel 28][ref1], desgevraagd opgave van degenen aan wie
      hij de mededeling heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel28
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '28'
        hoofdstuk: '4'
  - number: '31.1'
    text: |-
      De verantwoordelijke kan voor een bericht als bedoeld in [artikel 27][ref1] een bij of krachtens algemene maatregel
      van bestuur vast te stellen vergoeding van kosten verlangen die ten hoogste USD 5 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel27
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '27'
        hoofdstuk: '4'
  - number: '31.2'
    text: |-
      De vergoeding wordt teruggegeven in geval de verantwoordelijke op verzoek van de betrokkene, op bevel van de
      rechter tot verbetering, aanvulling, verwijdering of afscherming is overgegaan.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel31
  - number: '32.1'
    text: |-
      Indien gegevens het voorwerp zijn van verwerking op grond van [artikel 8, onder e en f][ref1], kan de betrokkene
      daartegen bij de verantwoordelijke te allen tijde verzet aantekenen in verband met zijn bijzondere persoonlijke
      omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel8
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '32.2'
    text: |-
      De verantwoordelijke beoordeelt binnen vier weken na ontvangst van het verzet of het verzet gerechtvaardigd is.
      Indien het verzet gerechtvaardigd is beëindigt hij terstond de verwerking.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel32
  - number: '32.3'
    text: |-
      De verantwoordelijke kan voor het in behandeling nemen van een verzet een vergoeding van kosten verlangen, die niet
      hoger mag zijn dan een bij of krachtens algemene maatregel van bestuur vast te stellen bedrag. De vergoeding wordt
      teruggegeven in geval het verzet gegrond wordt bevonden.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel32
  - number: '32.4'
    text: Dit artikel is niet van toepassing op openbare registers die bij de wet zijn ingesteld.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel32
  - number: '33.1'
    text: |-
      Indien gegevens worden verwerkt in verband met de totstandbrenging of de instandhouding van een directe relatie
      tussen de verantwoordelijke of een derde en de betrokkene met het oog op werving voor commerciële of charitatieve
      doelen, kan de betrokkene daartegen bij de verantwoordelijke te allen tijde kosteloos verzet aantekenen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel33
  - number: '33.2'
    text: In geval van verzet treft de verantwoordelijke de maatregelen om deze vorm van verwerking terstond te beëindigen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel33
  - number: '33.3'
    text: |-
      De verantwoordelijke die voornemens is persoonsgegevens aan derden te verstrekken of voor rekening van derden te
      gebruiken voor het in het eerste lid bedoelde doel, neemt passende maatregelen om de betrokkenen de mogelijkheden
      bekend te maken tot het doen van verzet. De bekendmaking vindt plaats via een of meer dag-, nieuws-, of huis-aan-
      huisbladen of op een andere geschikte wijze. Bij regelmatige verstrekking aan derden of gebruik voor rekening van
      derden vindt de bekendmaking ten minste eens per jaar plaats.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel33
  - number: '33.4'
    text: |-
      De verantwoordelijke die persoonsgegevens verwerkt voor het in het eerste lid bedoelde doel, draagt zorg dat,
      indien daartoe rechtstreeks een boodschap aan de betrokkene wordt toegezonden, deze daarbij telkens wordt gewezen
      op de mogelijkheid tot het doen van verzet.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel33
  - number: '34.1'
    text: |-
      Niemand kan worden onderworpen aan een besluit waaraan voor hem rechtsgevolgen zijn verbonden of dat hem in
      aanmerkelijke mate treft, indien dat besluit alleen wordt genomen op grond van een geautomatiseerde verwerking van
      persoonsgegevens bestemd om een beeld te krijgen van bepaalde aspecten van zijn persoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel34
  - number: '34.2'
    text: 'Het eerste lid is niet van toepassing, indien het daar bedoelde besluit:'
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel34
  - number: 34.2.a
    text: wordt genomen in het kader van het sluiten of uitvoeren van een overeenkomst en
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel34
  - number: 34.2.a.1°
    text: aan het verzoek van de betrokkene is voldaan of
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel34
  - number: 34.2.a.2°
    text: passende maatregelen zijn genomen ter bescherming van zijn gerechtvaardigd belang, of
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel34
  - number: 34.2.b
    text: |-
      zijn grondslag vindt in een wet waarin maatregelen zijn vastgelegd die strekken tot bescherming van het
      gerechtvaardigde belang van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel34
  - number: '34.3'
    text: |-
      Een passende maatregel als bedoeld in het tweede lid, onder a, is getroffen indien de betrokkene in de gelegenheid
      is gesteld omtrent het besluit als bedoeld in het eerste lid, zijn zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel34
  - number: '34.4'
    text: |-
      In het geval, bedoeld in het tweede lid, deelt de verantwoordelijke de betrokkene de logica mee die ten grondslag
      ligt aan de geautomatiseerde verwerking van hem betreffende gegevens.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel34
  - number: '35'
    text: |-
      De verantwoordelijke kan de [artikelen 9, eerste lid][ref1], [25][ref2], [26][ref3] en [27][ref4] buiten toepassing
      laten voor zover dit noodzakelijk is in het belang van:


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0028067#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0028067#Artikel27
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '25'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0028067
        artikel: '26'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0028067
        artikel: '27'
        hoofdstuk: '4'
  - number: 35.a
    text: de veiligheid van de staat;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel35
  - number: 35.b
    text: de voorkoming, opsporing en vervolging van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel35
  - number: 35.c
    text: gewichtige economische en financiële belangen van de staat en andere openbare lichamen;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel35
  - number: 35.d
    text: |-
      het toezicht op de naleving van wettelijke voorschriften die zijn gesteld ten behoeve van de belangen, bedoeld
      onder b en c, of
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel35
  - number: 35.e
    text: de bescherming van de betrokkene of van de rechten en vrijheden van anderen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel35
  - number: '36.1'
    text: |-
      Indien een verwerking plaatsvindt door instellingen of diensten voor wetenschappelijk onderzoek of statistiek,
      en de nodige voorzieningen zijn getroffen om te verzekeren dat de persoonsgegevens uitsluitend voor statistische
      en wetenschappelijke doeleinden kunnen worden gebruikt, kan de verantwoordelijke een mededeling als bedoeld in
      [artikel 26][ref1] achterwege laten en weigeren aan een verzoek als bedoeld in [artikel 27][ref2] te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel27
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '26'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '27'
        hoofdstuk: '4'
  - number: '36.2'
    text: |-
      Indien een verwerking plaatsvindt van persoonsgegevens die deel uitmaken van archiefbescheiden die ingevolge
      de [artikelen 12][ref1] of [13 van de Archiefwet][ref2] zijn overgebracht naar een archiefbewaarplaats, kan de
      verantwoordelijke een mededeling als bedoeld in [artikel 26][ref3] achterwege laten.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0028067#Artikel26
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0028067
        artikel: '26'
        hoofdstuk: '3'
  - number: '37'
    text: |-
      Een beslissing op een verzoek als bedoeld in de [artikelen 27][ref1], [28][ref2] en [30, tweede lid][ref3],
      alsmede een beslissing naar aanleiding van de aantekening van verzet als bedoeld in de [artikelen 32][ref4]
      of [33][ref5] gelden, voor zover deze zijn genomen door een bestuursorgaan, als een beschikking als bedoeld in
      [artikel 3 van de Wet administratieve rechtspraak BES][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0028067#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0028067#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0028067#Artikel33
      [ref6]: https://wetten.overheid.nl/BWBR0028455#Artikel3
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '27'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '28'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0028067
        artikel: '30'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0028067
        artikel: '32'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0028067
        artikel: '33'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0028455
        artikel: '3'
  - number: '38.1'
    text: |-
      Indien een beslissing als bedoeld in [artikel 37][ref1] is genomen door een ander dan een bestuursorgaan, kan
      de belanghebbende zich tot het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba wenden met het
      schriftelijk verzoek, de verantwoordelijke te bevelen alsnog een verzoek als bedoeld in de [artikelen 27][ref2],
      [28][ref3] en [30, tweede lid][ref4], toe of af te wijzen dan wel een verzet als bedoeld in de [artikelen 32][ref5]
      of [31][ref6] al dan niet te honoreren.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0028067#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0028067#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0028067#Artikel32
      [ref6]: https://wetten.overheid.nl/BWBR0028067#Artikel31
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '37'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '27'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0028067
        artikel: '28'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0028067
        artikel: '30'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0028067
        artikel: '32'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0028067
        artikel: '31'
        hoofdstuk: '4'
  - number: '38.2'
    text: |-
      Het verzoekschrift moet worden ingediend binnen zes weken na ontvangst van het antwoord van de verantwoordelijke.
      Indien de verantwoordelijke niet binnen de gestelde termijn heeft geantwoord, moet het verzoekschrift worden
      ingediend binnen zes weken na afloop van die termijn.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel38
  - number: '38.3'
    text: |-
      Het gerecht wijst het verzoek toe, voor zover het dit gegrond oordeelt. Alvorens het gerecht beslist, stelt het zo
      nodig de belanghebbenden in de gelegenheid hun zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel38
  - number: '38.4'
    text: |-
      De [derde afdeling van de vijfde titel van het Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering BES][ref1]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Afdeling3
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028496
        afdeling: '3'
  - number: '38.5'
    text: |-
      Het gerecht kan partijen en anderen verzoeken binnen een door haar te bepalen termijn schriftelijke inlichtingen te
      geven en onder hen berustende stukken in te zenden. De verantwoordelijke en belanghebbende zijn verplicht aan dit
      verzoek te voldoen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel38
  - number: '39.1'
    text: |-
      Indien iemand schade lijdt doordat ten opzichte van hem in strijd wordt gehandeld met de bij of krachtens deze
      wet gegeven voorschriften, zijn de volgende leden van toepassing, onverminderd de aanspraken op grond van andere
      wettelijke regels.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel39
  - number: '39.2'
    text: |-
      Voor nadeel dat niet in vermogensschade bestaat, heeft de benadeelde recht op een naar billijkheid vast te stellen
      schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel39
  - number: '39.3'
    text: |-
      De verantwoordelijke is aansprakelijk voor de schade of het nadeel, voortvloeiende uit het niet-nakomen van de
      in het eerste lid bedoelde voorschriften. De bewerker is aansprakelijk voor die schade of dat nadeel, voor zover
      ontstaan door zijn werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel39
  - number: '39.4'
    text: |-
      De verantwoordelijke of de bewerker kan geheel of gedeeltelijk worden ontheven van deze aansprakelijkheid, indien
      hij bewijst dat de schade hem niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel39
  - number: '40.1'
    text: |-
      Indien de verantwoordelijke of de bewerker handelt in strijd met het bij of krachtens deze wet bepaalde en een
      ander daardoor schade lijdt of dreigt te lijden, kan de rechter hem op vordering van die ander zodanig gedrag
      verbieden en hem bevelen maatregelen te treffen tot herstel van de gevolgen van dat gedrag.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel40
  - number: '40.2'
    text: |-
      Een verwerking kan niet ten grondslag worden gelegd aan een vordering van een rechtspersoon
      die algemene of collectieve belangen behartigen, of een rechtspersoon als bedoeld in
      [artikel 305a van Boek 3 van het Burgerlijk Wetboek BES][ref1], voor zover degene die door deze verwerking wordt
      getroffen, daartegen bezwaar heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel305a
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: 305a
  - number: '41.1'
    text: |-
      De verantwoordelijke die in strijd handelt met hetgeen bij of krachtens [artikel 4, derde lid][ref1], is bepaald,
      wordt gestraft met geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel4
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '4'
        hoofdstuk: '1'
  - number: '41.2'
    text: |-
      De verantwoordelijke die een feit als bedoeld in het eerste lid, opzettelijk begaat, wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel41
  - number: '41.3'
    text: |-
      De in het eerste lid strafbaar gestelde feiten zijn overtredingen. De in het tweede lid strafbaar gestelde feiten
      zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel41
  - number: '42.1'
    text: |-
      Persoonsgegevens die aan een verwerking worden onderworpen of die bestemd zijn om na hun doorgifte te worden
      verwerkt, worden slechts naar een land buiten de Europese Unie doorgegeven indien, onverminderd de naleving van de
      wet, dat land een passend beschermingsniveau waarborgt.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel42
  - number: '42.2'
    text: |-
      Het passend karakter van het beschermingsniveau wordt beoordeeld gelet op de omstandigheden die op de doorgifte
      van gegevens of op een categorie gegevensdoorgiften van invloed zijn. In het bijzonder wordt rekening gehouden
      met de aard van de gegevens, met het doeleinde of de doeleinden en met de duur van de voorgenomen verwerking of
      verwerkingen, het land van herkomst en het land van eindbestemming, de algemene en sectoriële rechtsregels die in
      het betrokken derde land gelden, alsmede de regels van het beroepsleven en de veiligheidsmaatregelen die in die
      landen worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel42
  - number: '43.1'
    text: |-
      In afwijking van [artikel 42][ref1] kan een doorgifte of een categorie van doorgiften van persoonsgegevens naar een
      derde land dat geen waarborgen biedt voor een passend beschermingsniveau, plaatsvinden indien:


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel42
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '42'
        hoofdstuk: '7'
  - number: 43.1.a
    text: de betrokkene daarvoor zijn ondubbelzinnige toestemming heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel43
  - number: 43.1.b
    text: |-
      de doorgifte noodzakelijk is voor de uitvoering van een overeenkomst tussen de betrokkene en de verantwoordelijke,
      of voor het nemen van precontractuele maatregelen naar aanleiding van een verzoek van de betrokkene en die
      noodzakelijk zijn voor het sluiten van een overeenkomst;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel43
  - number: 43.1.c
    text: |-
      de doorgifte noodzakelijk is voor de sluiting of uitvoering van een in het belang van de betrokkene tussen de
      verantwoordelijke en een derde gesloten of te sluiten overeenkomst;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel43
  - number: 43.1.d
    text: |-
      de doorgifte noodzakelijk is vanwege een zwaarwegend algemeen belang, of voor de vaststelling, de uitvoering of de
      verdediging in rechte van enig recht;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel43
  - number: 43.1.e
    text: de doorgifte noodzakelijk is ter vrijwaring van een vitaal belang van de betrokkene, of
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel43
  - number: 43.1.f
    text: |-
      de doorgifte geschiedt vanuit een register dat bij wettelijk voorschrift is ingesteld en dat door een ieder dan wel
      door iedere persoon die zich op een gerechtvaardigd belang kan beroepen, kan worden geraadpleegd, voor zover in het
      betrokken geval is voldaan aan de wettelijke voorwaarden voor raadpleging.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel43
  - number: '43.2'
    text: |-
      In afwijking van het eerste lid, kan de commissie een vergunning geven voor een doorgifte of een categorie
      doorgiften van persoonsgegevens naar een derde land dat geen waarborgen voor een passend beschermingsniveau biedt.
      Aan de vergunning worden de nadere voorschriften verbonden die nodig zijn om de bescherming van de persoonlijke
      levenssfeer en de fundamentele rechten en vrijheden van personen, alsmede de uitoefening van de daarmee verband
      houdende rechten te waarborgen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel43
  - number: '44.1'
    text: |-
      Er is een Commissie toezicht bescherming persoonsgegevens BES die tot taak heeft toe te zien op de verwerking van
      persoonsgegevens overeenkomstig het bij en krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel44
  - number: '44.2'
    text: De commissie vervult overigens de taken, die haar bij wet en ingevolge verdrag zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel44
  - number: '44.3'
    text: De commissie vervult haar taak in onafhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel44
  - number: '45.1'
    text: De commissie bestaat uit een voorzitter en twee andere leden.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel45
  - number: '45.2'
    text: |-
      De voorzitter moet voldoen aan de bij of krachtens
      [artikel 24 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref1] gestelde vereisten voor benoembaarheid tot
      rechter in het Gemeenschappelijk Hof van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel24
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '24'
  - number: '45.3'
    text: |-
      De voorzitter en de leden worden bij koninklijk besluit benoemd, op voordracht van Onze Minister, voor een tijdvak
      van zes jaren.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel45
  - number: '46'
    text: 'Aan de leden van de commissie wordt bij koninklijk besluit, op voordracht van Onze Minister, ontslag verleend:'
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel46
  - number: 46.a
    text: op verzoek van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel46
  - number: 46.b
    text: wanneer de betrokkene uit hoofde van ziekten of gebreken blijvend ongeschikt is om zijn functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel46
  - number: 46.c
    text: bij verlies van het Nederlanderschap;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel46
  - number: 46.d
    text: |-
      wanneer betrokkene bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem
      bij zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel46
  - number: 46.e
    text: |-
      wanneer betrokkene ingevolge onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, surseance van betaling heeft verkregen of wegens schulden is gegijzeld.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel46
  - number: '47'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de vergoeding alsmede de overige rechten en plichten
      die betrekking hebben op de rechtspositie van de leden van de commissie.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel47
  - number: '48'
    text: |-
      De commissie beschikt te harer ondersteuning over een secretariaat, waarvan de ambtenaren door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met Onze Minister, gehoord de voorzitter, worden
      benoemd, geschorst of ontslagen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel48
  - number: '49'
    text: |-
      Onze Minister kan de commissie om advies vragen over voorstellen van wet en ontwerpen van algemene maatregelen
      van bestuur die geheel of voor een belangrijk deel betrekking hebben op de verwerking van persoonsgegevens in de
      openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel49
  - number: '50.1'
    text: |-
      De commissie kan ambtshalve of op verzoek van een belanghebbende, een onderzoek instellen naar de wijze waarop ten
      aanzien van gegevensverwerking toepassing wordt gegeven aan het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel50
  - number: '50.2'
    text: |-
      De commissie brengt haar voorlopige bevindingen ter kennis van de verantwoordelijke of de groep van
      verantwoordelijken die bij het onderzoek zijn betrokken en stelt hen in de gelegenheid hun zienswijze daarop te
      geven. Houden de voorlopige bevindingen verband met de uitvoering van enige wet, dan brengt de commissie deze
      tevens ter kennis van Onze Minister die het aangaat.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel50
  - number: '50.3'
    text: |-
      Ingeval van een onderzoek, ingesteld op verzoek van de belanghebbende, doet de commissie aan de belanghebbende
      mededeling van haar bevindingen, tenzij zodanige mededeling onverenigbaar is met het doel van de gegevensverwerking
      of de aard van de persoonsgegevens, dan wel gewichtige belangen van anderen dan de verzoeker, de verantwoordelijke
      daaronder begrepen, daardoor onevenredig zouden worden geschaad. Indien de commissie mededeling van haar
      bevindingen achterwege laat, zendt zij de belanghebbende zodanig bericht als haar geraden voorkomt.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel50
  - number: '51.1'
    text: |-
      Met het toezicht op de naleving, bedoeld in [artikel 44][ref1], zijn belast de leden van de commissie en de
      ambtenaren van het secretariaat. [Titel 5.2 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige
      toepassing, met uitzondering van de [artikelen 5.18][ref3] en [5.19][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '44'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '51.2'
    text: |-
      De commissie is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens deze
      wet gestelde verplichtingen. De [afdelingen 5.3.1][ref1] en [5.3.2 van de Algemene wet bestuursrecht][ref2] zijn
      van overeenkomstige toepassing, met uitzondering van [artikel 5.27, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3.2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 5.3.1
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 5.3.2
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '51.3'
    text: |-
      De in het eerste lid bedoelde personen zijn bevoegd een woning te betreden zonder toestemming van een bewoner. De
      [artikelen 155 tot en met 163 van het Wetboek van Strafvordering BES][ref1] zijn van overeenkomstige toepassing,
      met dien verstande dat de machtiging, bedoeld in artikel 155 van het Wetboek van Strafvordering BES, wordt verleend
      door de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel155
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '155'
  - number: '51.4'
    text: |-
      Geen beroep is mogelijk op een geheimhoudingsplicht, voor zover inlichtingen of medewerking worden verlangd in
      verband met de eigen betrokkenheid bij de verwerking van persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel51
  - number: '52'
    text: |-
      De commissie stelt jaarlijks vóór 1 september een verslag op van de werkzaamheden, het gevoerde beleid in
      het algemeen en de doelmatigheid en de doeltreffendheid van haar werkwijze in het bijzonder in het afgelopen
      kalenderjaar. Het verslag wordt aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel52
  - number: '53'
    text: |-
      De commissie verstrekt desgevraagd aan Onze Minister de voor de uitvoering van zijn taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de invulling van zijn
      taak nodig is.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel53
  - number: '54'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het toezicht op de verwerking van
      persoonsgegevens overeenkomstig het bij of krachtens deze wet bepaalde, voor zover daarin niet bij wet is voorzien.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel54
  - number: '55'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel55
  - number: '56.1'
    text: |-
      Binnen een jaar na inwerkingtreding van deze wet worden de gegevensverwerkingen die op dat tijdstip reeds
      plaatsvonden, in overeenstemming gebracht met deze wet.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel56
  - number: '56.2'
    text: |-
      Voor de aanpassing van de verwerking van bijzondere gegevens aan [paragraaf 2 van hoofdstuk 2][ref1] geldt een
      termijn van drie jaren met dien verstande dat voor verwerkingen die al plaatsvonden en noodzakelijk zijn voor de
      uitvoering van overeenkomsten tot stand gekomen voor het tijdstip van inwerkingtreding van deze wet, niet opnieuw
      toestemming behoeft te worden gevraagd als bedoeld in [artikel 23, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel23
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028067
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '57'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel57
