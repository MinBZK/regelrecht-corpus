preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is dat met betrekking tot de bescherming van
    persoonsgegevens in de openbare lichamen Bonaire, Sint Eustatius en Saba uitvoering wordt gegeven aan artikel 10,
    tweede en derde lid, van de Grondwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#ArtikelAanhef
articles:
  - number: '1.1'
    text: Deze wet is van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: '1.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: 1.2.a
    text: '*persoonsgegeven:* elk gegeven betreffende een geïdentificeerde of identificeerbare natuurlijke persoon;'
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: 1.2.b
    text: |-
      *verwerking van persoonsgegevens:* elke handeling of elk geheel van handelingen met betrekking tot
      persoonsgegevens, waaronder in ieder geval het verzamelen, vastleggen, ordenen, bewaren, bijwerken, wijzigen,
      opvragen, raadplegen, gebruiken, verstrekken door middel van doorzending, verspreiding of enige andere vorm
      van terbeschikkingstelling, samenbrengen, met elkaar in verband brengen, alsmede het afschermen, uitwissen of
      vernietigen van gegevens;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: 1.2.c
    text: |-
      *bestand:* elk gestructureerd geheel van persoonsgegevens, ongeacht of dit geheel van gegevens gecentraliseerd is
      of verspreid is op een functioneel of geografisch bepaalde wijze, dat volgens bepaalde criteria toegankelijk is en
      betrekking heeft op verschillende personen;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: 1.2.d
    text: |-
      *verantwoordelijke:* de natuurlijke persoon, rechtspersoon of ieder ander die of het bestuursorgaan dat, alleen of
      tezamen met anderen, het doel van en de middelen voor de verwerking van persoonsgegevens vaststelt;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: 1.2.e
    text: |-
      *bewerker:* degene die ten behoeve van de verantwoordelijke persoonsgegevens verwerkt, zonder aan zijn rechtstreeks
      gezag te zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: 1.2.f
    text: '*betrokkene:* degene op wie een persoonsgegeven betrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: 1.2.g
    text: |-
      *derde:* ieder, niet zijnde de betrokkene, de verantwoordelijke, de bewerker, of enig persoon die onder
      rechtstreeks gezag van de verantwoordelijke of de bewerker gemachtigd is om persoonsgegevens te verwerken;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: 1.2.h
    text: '*ontvanger:* degene aan wie de persoonsgegevens worden verstrekt;'
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: 1.2.i
    text: |-
      *toestemming van de betrokkene:* elke vrije, specifieke en op informatie berustende wilsuiting waarmee de
      betrokkene aanvaardt dat hem betreffende persoonsgegevens worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: 1.2.j
    text: '*Onze Minister:* Onze Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: 1.2.k
    text: '*verstrekken van persoonsgegevens:* het bekend maken of ter beschikking stellen van persoonsgegevens;'
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: 1.2.l
    text: '*verzamelen van persoonsgegevens:* het verkrijgen van persoonsgegevens;'
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: 1.2.m
    text: '*openbare lichamen:* de openbare lichamen Bonaire, Sint Eustatius en Saba;'
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: 1.2.n
    text: '*gerecht:* het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba;'
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
  - number: 1.2.o
    text: |-
      *commissie:* de Commissie toezicht bescherming persoonsgegevens BES, bedoeld in [artikel 44][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel44
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '44'
        hoofdstuk: '8'
  - number: '2.1'
    text: |-
      Deze wet is van toepassing op de geheel of gedeeltelijk geautomatiseerde verwerking van persoonsgegevens, alsmede
      de niet geautomatiseerde verwerking van persoonsgegevens die in een bestand zijn opgenomen of die bestemd zijn om
      daarin te worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel2
  - number: '2.2'
    text: 'Deze wet is niet van toepassing op verwerking van persoonsgegevens:'
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel2
  - number: 2.2.a
    text: ten behoeve van activiteiten met uitsluitend persoonlijke of huishoudelijke doeleinden;
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel2
  - number: 2.2.b
    text: |-
      door of ten behoeve van de inlichtingen- en veiligheidsdiensten, bedoeld in de
      [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013409
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013409
  - number: 2.2.c
    text: |-
      ten behoeve van de uitvoering van de politietaak, bedoeld in de [artikelen 5][ref1] en
      [11 van de Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028079#Artikel11
    url: https://wetten.overheid.nl/BWBR0028067/2025-11-11#Artikel2
    references:
