preamble:
  text: |-
    Gelet op richtlijn nr. 1999/30/EG van de Raad van de Europese Unie van 22 april 1999 betreffende grenswaarden
    voor zwaveldioxide, stikstofdioxide en stikstofoxiden, zwevende deeltjes en lood in de lucht (PbEG L 163),
    alsmede op artikel 6 van richtlijn nr. 96/62/EG van de Raad van de Europese Unie van 27 september 1996 inzake
    de beoordeling en het beheer van de luchtkwaliteit (PbEG L 296), artikel 59, vijfde lid, van de Wet inzake de
    luchtverontreiniging, artikel 5.3, tweede lid, van de Wet milieubeheer en de artikelen 2, eerste lid, en 4, van het
    Besluit luchtkwaliteit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#ArtikelAanhef
articles:
