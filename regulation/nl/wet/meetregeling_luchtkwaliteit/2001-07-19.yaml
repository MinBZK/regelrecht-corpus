      zone zuid, omvattend de provincies Zeeland, Noord-Brabant en Limburg, met uitzondering van de zich in dit gebied
      bevindende agglomeraties.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel3
