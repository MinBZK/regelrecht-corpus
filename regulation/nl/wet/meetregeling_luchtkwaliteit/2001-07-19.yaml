  - number: '6'
    text: |-
      Meetstations voor de meting van concentraties zwaveldioxide en stikstofoxiden ter controle van de naleving van het
      bepaalde in [artikel 6][ref1] onderscheidenlijk 12 van het besluit worden geplaatst:


      [ref1]: https://wetten.overheid.nl/BWBR0012666#Artikel6
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012666
        artikel: '6'
        paragraaf: '4'
  - number: 6.a
    text: |-
      op een afstand van ten minste 20 kilometer van agglomeraties of op een afstand van ten minste 5 kilometer van
      andere gebieden met bebouwing, van inrichtingen of van autosnelwegen, in de zin van artikel 1 van het Reglement
      verkeersregels en verkeerstekens 1990;
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel6
  - number: 6.b
    text: |-
      op een zodanig punt dat door middel van metingen op dat punt een representatief beeld ontstaat van de
      luchtkwaliteit in een gebied van ten minste 1000 km2.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel6
  - number: '7'
    text: |-
      Meetstations voor de meting van concentraties zwaveldioxide, stikstofdioxide, zwevende deeltjes (PM10) en lood
      ter controle van de naleving van het bepaalde in de [artikelen 5][ref1], [7][ref2], [8][ref3], [9][ref4],
      [10][ref5], [11][ref6], [13][ref7], [14][ref8] en [15 van het besluit][ref9] worden zodanig geplaatst dat:


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012550#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0012550#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0012550#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0012550#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0012550#Artikel11
      [ref7]: https://wetten.overheid.nl/BWBR0012550#Artikel13
      [ref8]: https://wetten.overheid.nl/BWBR0012550#Artikel14
      [ref9]: https://wetten.overheid.nl/BWBR0012550#Artikel15
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012550
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0012550
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0012550
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0012550
        artikel: '9'
      - id: ref5
        bwb_id: BWBR0012550
        artikel: '10'
      - id: ref6
        bwb_id: BWBR0012550
        artikel: '11'
      - id: ref7
        bwb_id: BWBR0012550
        artikel: '13'
      - id: ref8
        bwb_id: BWBR0012550
        artikel: '14'
      - id: ref9
        bwb_id: BWBR0012550
        artikel: '15'
  - number: 7.a
    text: |-
      gegevens worden verkregen over de gebieden binnen zones en agglomeraties waar de hoogste concentraties voorkomen
      waaraan de bevolking direct of indirect kan worden blootgesteld gedurende een periode die in vergelijking met de
      middelingstijd van de grenswaarde(n) significant is;
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel7
  - number: 7.b
    text: |-
      gegevens worden verkregen over de concentraties in andere gebieden binnen de zones en agglomeraties die
      representatief zijn voor de blootstelling van de bevolking als geheel;
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel7
  - number: 7.c
    text: |-
      gegevens worden verkregen die representatief zijn voor de luchtkwaliteit op plaatsen die sterk door het verkeer
      worden beïnvloed in een gebied van ten minste 200 m²;
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel7
  - number: 7.d
    text: |-
      op plaatsen die sterk door het verkeer worden beïnvloed de afstand tot grote kruispunten ten minste 25 meter is en
      de afstand tot het midden van de dichtstbij gelegen rijbaan ten minste 4 meter is;
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel7
  - number: 7.e
    text: |-
      op plaatsen die beïnvloed worden door een stedelijke achtergrondconcentratie gegevens worden verkregen die
      representatief zijn voor een gebied van verscheidene vierkante kilometers;
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel7
  - number: 7.f
    text: |-
      meetstations zo mogelijk gegevens opleveren die ook representatief zijn voor soortgelijke plaatsen buiten hun
      onmiddellijke omgeving.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel7
  - number: '8'
    text: |-
      Monsterneming bij de in de [artikelen 6][ref1] en [7][ref2] bedoelde meetpunten gebeurt zodanig dat:


      [ref1]: https://wetten.overheid.nl/BWBR0012666#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012666#Artikel7
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012666
        artikel: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012666
        artikel: '7'
        paragraaf: '4'
  - number: 8.a
    text: |-
      de lucht rond de inlaatbuis vrij kan stromen en er geen voorwerpen zijn die de luchtstroom in de omgeving van de
      monsternemer beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel8
  - number: 8.b
    text: de hoogte van de inlaatbuis tussen 1,5 en 4 meter boven de grond ligt;
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel8
  - number: 8.c
    text: |-
      de inlaatbuizen niet te dicht in de omgeving van bronnen zijn gesitueerd om te voorkomen dat de uitstoot daarvan
      rechtstreeks en zonder menging met de buitenlucht in de inlaatbuis terechtkomt;
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel8
  - number: 8.d
    text: |-
      de uitlaatbuizen op een zodanige plaats zijn gesitueerd dat de lucht daaruit niet opnieuw in de inlaatbuis kan
      komen.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel8
  - number: '9.1'
    text: |-
      Monsterneming bij de in [artikel 7][ref1] bedoelde meetpunten op plaatsen die sterk door het verkeer worden
      beïnvloed, gebeurt zodanig dat:


      [ref1]: https://wetten.overheid.nl/BWBR0012666#Artikel7
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012666
        artikel: '7'
        paragraaf: '4'
  - number: 9.1.a
    text: de inlaatbuizen voor stikstofdioxide zijn gesitueerd binnen 5 meter van de wegrand;
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel9
  - number: 9.1.b
    text: |-
      de inlaatbuizen voor zwevende deeltjes (PM10) en lood zijn gesitueerd op een plaats die representatief is voor de
      luchtkwaliteit in de nabijheid van de rooilijn.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid, onder a, is niet van toepassing bij meetpunten voor de meting van de luchtkwaliteit bij
      autosnelwegen.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel9
  - number: '10.1'
    text: Per meetpunt voor de meting van zwaveldioxide worden uurgemiddelde concentraties bepaald.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel10
  - number: '10.2'
    text: |-
      Indien per uur minder dan vijfenveertig minuten meetsignalen beschikbaar zijn, wordt geen uurgemiddelde
      concentratie bepaald.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel10
  - number: '10.3'
    text: |-
      Indien per etmaal minder dan dertien uurgemiddelde concentraties beschikbaar zijn, wordt geen 24 uurgemiddelde
      concentratie vastgesteld, tenzij op grond van de beschikbare uurgemiddelde concentraties overschrijding van de in
      [artikel 5, onder b, van het besluit][ref1] genoemde 24 uurgemiddelde concentratie kan worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel5
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012550
        artikel: '5'
  - number: '10.4'
    text: Het aantal gevalideerde uurwaarden per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel10
  - number: '10.5'
    text: |-
      Indien minder dan 90 procent gevalideerde uurwaarden per kalenderjaar beschikbaar zijn, wordt op grond
      van de beschikbare uurgemiddelde concentraties nagegaan of de in de [artikelen 5][ref1], [6][ref2] en
      [7 van het besluit][ref3] genoemde waarden zijn overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012550#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0012550#Artikel7
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012550
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0012550
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0012550
        artikel: '7'
  - number: '10.6'
    text: |-
      Uurgemiddelde concentraties waarvan moet worden aangenomen dat de afwijking ten opzichte van de werkelijke
      concentratie groter is dan het bepaalde in [artikel 19, tweede, onderscheidenlijk derde lid, van het besluit][ref1]
      worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel19
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012550
        artikel: '19'
  - number: '11.1'
    text: Per meetpunt voor de meting van stikstofdioxide en stikstofoxiden worden uurgemiddelde concentraties bepaald.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel11
  - number: '11.2'
    text: |-
      Indien minder dan vijfenveertig minuten meetsignalen beschikbaar zijn, wordt geen uurgemiddelde concentratie
      bepaald.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel11
  - number: '11.3'
    text: Het aantal gevalideerde uurwaarden per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel11
  - number: '11.4'
    text: |-
      Indien minder dan 90 procent gevalideerde uurwaarden per kalenderjaar beschikbaar zijn, wordt op grond van
      de beschikbare uurgemiddelde concentraties nagegaan of de in de [artikelen 8][ref1], [9][ref2], [10][ref3],
      [11][ref4]en [12 van het besluit][ref5] genoemde waarden zijn overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012550#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0012550#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0012550#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0012550#Artikel12
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012550
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0012550
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0012550
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0012550
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0012550
        artikel: '12'
  - number: '11.5'
    text: |-
      Uurgemiddelde concentraties waarvan moet worden aangenomen dat de afwijking ten opzichte van de werkelijke
      concentratie groter is dan het bepaalde in [artikel 19, vierde, onderscheidenlijk vijfde lid, van het besluit][ref1]
      worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel19
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012550
        artikel: '19'
  - number: '12.1'
    text: Per meetpunt voor de meting van zwevende deeltjes worden 24 uurgemiddelde concentraties bepaald.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel12
  - number: '12.2'
    text: |-
      Indien per etmaal minder dan dertien uur bemonsterd is, wordt geen 24 uurgemiddelde concentratie
      vastgesteld, tenzij op grond van de beschikbare meetwaarden overschrijding van de in
      [artikel 13, onder b, onderscheidenlijk d][ref1], genoemde 24 uurgemiddelde concentraties kan worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0012666#Artikel13
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012666
        artikel: '13'
        paragraaf: '9'
  - number: '12.3'
    text: Het aantal gevalideerde 24 uurwaarden per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel12
  - number: '12.4'
    text: |-
      Indien minder dan 90 procent gevalideerde 24 uurwaarden beschikbaar zijn wordt op grond van de beschikbare 24
      uurgemiddelde concentraties nagegaan of de in de [artikelen 13][ref1] en [14 van het besluit][ref2] genoemde
      waarden zijn overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0012550#Artikel14
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012550
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0012550
        artikel: '14'
  - number: '12.5'
    text: |-
      24 uurgemiddelde concentraties waarvan moet worden aangenomen dat de afwijking ten opzichte van de werkelijke
      concentratie groter is dan het bepaalde in [artikel 19, zesde lid, van het besluit][ref1] worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel19
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012550
        artikel: '19'
  - number: '13.1'
    text: |-
      Per meetpunt voor de meting van lood worden gedurende ten minste 14 procent van de tijd in een kalenderjaar
      concentraties bepaald. De metingen vinden gelijkmatig over het kalenderjaar gespreid plaats.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel13
  - number: '13.2'
    text: Het aantal gevalideerde meetwaarden per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel13
  - number: '13.3'
    text: |-
      Meetresultaten waarvan moet worden aangenomen dat de afwijking ten opzichte van de werkelijke concentratie groter
      is dan de afwijking, bedoeld in [artikel 19, zevende lid, van het besluit][ref1], worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel19
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012550
        artikel: '19'
  - number: '14.1'
    text: |-
      Per meetpunt voor de meting van koolmonoxide worden uurgemiddelde en 8 uurgemiddelde concentraties bepaald
      onderscheidenlijk berekend.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel14
  - number: '14.2'
    text: |-
      Indien minder dan vijfenveertig minuten meetsignalen beschikbaar zijn, wordt geen uurgemiddelde concentratie
      bepaald.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel14
  - number: '14.3'
    text: |-
      Indien in een periode van 8 uur minder dan 5 uurgemiddelde concentraties van koolmonoxide beschikbaar zijn, wordt
      uit de uurgemiddelde concentraties geen 8 uurgemiddelde concentratie berekend.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel14
  - number: '14.4'
    text: |-
      Indien minder dan dertien uurgemiddelde concentraties van koolmonoxide per etmaal beschikbaar zijn, wordt uit de
      uurgemiddelde concentraties geen 8 uurgemiddelde concentratie berekend.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel14
  - number: '14.5'
    text: |-
      Indien in een periode van dertig aaneengesloten dagen meer dan tien dagen voorkomen, waarbij geen 8 uurgemiddelde
      concentraties van koolmonoxide beschikbaar zijn, wordt geen 98-percentiel van 8 uurgemiddelde concentraties
      berekend.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel14
  - number: '14.6'
    text: |-
      Indien in een periode van dertig aaneengesloten dagen meer dan tien dagen voorkomen, waarbij minder dan dertien
      uurgemiddelde concentraties van koolmonoxide beschikbaar zijn, wordt geen 99,9-percentiel van uurgemiddelde
      concentraties berekend.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel14
  - number: '14.7'
    text: |-
      In de gevallen, bedoeld in het vijfde en zesde lid, wordt op grond van de beschikbare uurgemiddelde en 8
      uurgemiddelde concentraties van koolmonoxide nagegaan of de in [artikel 16 van het besluit][ref1] genoemde waarden
      zijn overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel16
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012550
        artikel: '16'
  - number: '14.8'
    text: |-
      Uurgemiddelde concentraties waarvan moet worden aangenomen dat de afwijking ten opzichte van de werkelijke
      concentraties groter is dan het bepaalde in [artikel 21, vierde lid, onder a, van het besluit][ref1] worden niet
      gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel21
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012550
        artikel: '21'
  - number: '15.1'
    text: |-
      Voor de vaststelling van de jaargemiddelde concentratie van benzeen dient het aantal metingen zodanig te zijn
      gekozen dat de afwijking tussen de vastgestelde en de werkelijke concentratie bij een jaargemiddelde concentratie
      van meer dan 8 microgram per m
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel15
  - number: '15.2'
    text: |-
      Indien niet kan worden voldaan aan het eerste lid wordt in afwijking daarvan op grond van de beschikbare
      meetresultaten nagegaan of de in [artikel 17 van het besluit][ref1] genoemde waarde is overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel17
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012550
        artikel: '17'
  - number: '15.3'
    text: |-
      Meetresultaten waarvan moet worden aangenomen dat de afwijking ten opzichte van de werkelijke concentratie groter
      is dan de afwijking, bedoeld in [artikel 21, vijfde lid, onder a, van het besluit][ref1], worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel21
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012550
        artikel: '21'
  - number: '16'
    text: Deze regeling treedt in werking met ingang van 19 juli 2001.
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel16
  - number: '17'
    text: 'Deze regeling wordt aangehaald als: Meetregeling luchtkwaliteit.'
    url: https://wetten.overheid.nl/BWBR0012666/2001-07-19#Artikel17
