bwb_id: BWBR0007792
url: https://wetten.overheid.nl/BWBR0007792/2013-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat geldelijke aanspraken en daarmee verband houdende
    verplichtingen bij vrijwillig vervroegd uittreden, van overheidspersoneel, onderwijspersoneel en daarmee gelijk te
    stellen personeel, de wijze van financiering van die aanspraken en de verdeling van de financieringslasten tussen
    de overheids-, de onderwijs- en daarmee overeenkomende organisaties en het personeel van die organisaties, kunnen
    worden geregeld naar privaatrechtelijk model;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken;'
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel1
  - number: 1.1.b
    text: |-
      sectorwerkgever: Onze Minister, Onze Minister van Defensie, Onze Minister van Onderwijs, Cultuur en Wetenschappen,
      Onze Minister van Veiligheid en Justitie, de Vereniging van Nederlandse Gemeenten, het Interprovinciaal Overleg
      en de Unie van Waterschappen, respectievelijk voor de sector Rijk, de sector Defensie, de sector Onderwijs en
      Wetenschappen, de sectoren Rechterlijke Macht en Politie, de sector Gemeenten, de sector Provincies en de sector
      Waterschappen;
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel1
  - number: 1.1.c
    text: |-
      centrale: een centrale van overheidspersoneel als bedoeld in
      [artikel 1 van de Regeling overleg Raad voor het Overheidspersoneelsbeleid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008494#Artikel1
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008494
        artikel: '1'
  - number: 1.1.d
    text: 'partijen: sectorwerkgevers, gezamenlijk of afzonderlijk, ter ene zijde en centrales ter andere zijde;'
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel1
  - number: 1.1.e
    text: |-
      vut-overeenkomst: een schriftelijke overeenkomst, waarmee partijen beogen een regeling te treffen inzake geldelijke
      aanspraken en daarmee verband houdende verplichtingen bij vrijwillig vervroegd uittreden van personeel dat
      behoort tot de in onderdeel *b* bedoelde sectoren en voorts verplichtingen in het leven te roepen ter zake van de
      financiering van de vorenbedoelde aanspraken;
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel1
  - number: 1.1.f
    text: |-
      Vut-fonds: de Stichting fonds vrijwillig vervroegd uittreden overheidspersoneel, bedoeld in
      [artikel 11 van de Wet financiële voorzieningen privatisering ABP][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel11
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '11'
  - number: '1.2'
    text: |-
      Bij ministeriële regeling wordt zonodig vastgesteld tot welke sector groepen van het personeel, bedoeld in het
      eerste lid, onderdeel *e*, behoren.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel1
  - number: '1.3'
    text: |-
      Een organisatie die ten doel heeft of mede ten doel heeft het behartigen van arbeidsvoorwaardelijke belangen van
      overheidspersoneel, treedt op als partij ter andere zijde, als bedoeld in het eerste lid, onderdeel *d*, ter zake
      van een vut-overeenkomst waarbij een sectorwerkgever afzonderlijk partij is te ener zijde, indien die organisatie
      op grond van een wettelijke bepaling in het bijzonder representatief moet worden geacht voor het personeel,
      werkzaam in een sector.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel1
  - number: '1.4'
    text: |-
      Een organisatie die ten doel heeft of mede ten doel heeft het behartigen van arbeidsvoorwaardelijke belangen van
      overheids- en onderwijspersoneel kan optreden als partij ter andere zijde, als bedoeld in het eerste lid, onderdeel
      *d*, indien die organisatie door een sectorwerkgever als representatief wordt beschouwd voor het personeel,
      werkzaam in de desbetreffende sector.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel1
  - number: '2.1'
    text: Partijen kunnen een vut-overeenkomst aangaan.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel2
  - number: '2.2'
    text: |-
      Een sectorwerkgever kan in overeenstemming met centrales en indien aanwezig organisaties als bedoeld in
      [artikel 1][ref1], derde dan wel vierde lid, zijn in het eerste lid vervatte bevoegdheid geheel of ten dele
      overdragen aan een gezag of bestuur dan wel een verband van meer dan één gezag of bestuur, ten aanzien van door hem
      aan te geven groepen van personeel, werkzaam in de desbetreffende sector.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel1
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '1'
  - number: '2.3'
    text: |-
      De tekst van een vut-overeenkomst wordt door Onze Minister in de *Staatscourant* geplaatst. Een vut-overeenkomst
      treedt niet eerder in werking dan met ingang van de tweede dag na de dagtekening van de *Staatscourant* waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      Overheids- en onderwijsinstellingen die behoren tot een sector als bedoeld in
      [artikel 1, eerste lid, onderdeel b][ref1], zijn gebonden aan de verplichtingen die partijen bij een vut-
      overeenkomst voor hen zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel1
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '1'
  - number: '3.2'
    text: |-
      Degene die behoort tot het personeel van een instelling, bedoeld in het eerste lid, kan aan een vut-overeenkomst
      die dat personeel betreft, rechten ontlenen en is gebonden aan verplichtingen die partijen daarbij voor dat
      personeel zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel3
  - number: '4.1'
    text: |-
      De werking van een door de gezamenlijke sectorwerkgevers en centrales gesloten vut-overeenkomst strekt zich mede
      uit tot een instelling die niet behoort tot een sector als bedoeld in [artikel 1, eerste lid, onderdeel b][ref1],
      indien en voor zover personeel van die instelling ambtenaar in de zin van de Algemene burgerlijke pensioenwet dan
      wel overheidswerknemer in de zin van de [Wet privatisering ABP][ref2] is, alsmede tot dat personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007791
  - number: '4.2'
    text: |-
      De werking van een door een sectorwerkgever afzonderlijk en partijen of een partij ter andere zijde gesloten vut-
      overeenkomst strekt zich mede uit tot een instelling als bedoeld in het eerste lid, onder de in dat lid genoemde
      voorwaarde en beperking, die op grond van de aard van haar werkzaamheid of haar financiële verhouding tot een of
      meer overheids- of onderwijsinstellingen geacht moet worden te zijn verbonden met de desbetreffende sector, alsmede
      tot het personeel van die instelling dat de in het eerste lid genoemde hoedanigheid heeft. Onze Minister beslist
      zonodig, op grond van de in de eerste volzin gegeven maatstaven, met welke sector een instelling geacht wordt te
      zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel4
  - number: '4.3'
    text: |-
      Het eerste en het tweede lid gelden voor een overeenkomst als daarin bedoeld, voor zover daarbij rechten
      en verplichtingen zijn overeengekomen die gelijk zijn voor het gehele personeel van overheids- en
      onderwijsinstellingen, respectievelijk van de instellingen die behoren tot de desbetreffende sector, en tevens
      financiering in omslag over die instellingen en hun personeel is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel4
  - number: '4.4'
    text: |-
      [Artikel 3][ref1] is van overeenkomstige toepassing op een instelling en personeel tot welke de werking van een
      vut-overeenkomst zich ingevolge dit artikel mede uitstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel3
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '3'
  - number: '4.5'
    text: |-
      Onze Minister kan regels stellen voor de dekking van financiële lasten wegens beëindiging van de gebondenheid aan
      een vut-overeenkomst van een instelling als bedoeld in [artikel 3, eerste lid][ref1], dan wel van een instelling
      waarop [artikel 3][ref2] van overeenkomstige toepassing is, voor het geval zo'n instelling of onderdeel daarvan
      ophoudt te bestaan of ophoudt als zodanig te bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007792#Artikel3
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007792
        artikel: '3'
  - number: '5'
    text: |-
      Een gezag of bestuur van een instelling als bedoeld in [artikel 4, eerste lid][ref1], die
      publiekrechtelijk van aard is, kan een vut-overeenkomst aangaan, met dien verstande dat, in afwijking
      van [artikel 1, eerste lid, onderdeel e][ref2], de regeling die dat bestuur en zijn wederpartij of
      wederpartijen daarmee beogen te treffen uitsluitend de desbetreffende instelling en haar personeel aangaat.
      [Artikel 2, derde lid][ref3], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007792#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007792#Artikel2
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007792
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007792
        artikel: '2'
  - number: '6.1'
    text: |-
      Tot een door Onze Minister vast te stellen tijdstip doen partijen een door hen aangegane vut-overeenkomst uitvoeren
      door het Vut-fonds en is dit fonds gehouden die uitvoering op zich te nemen mits een solide dekking van de lasten
      die daardoor voor het fonds ontstaan bij zulk een overeenkomst genoegzaam is verzekerd.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel6
  - number: '6.2'
    text: |-
      Het bestuur van het Vut-fonds verstrekt aan Onze Minister statistische informatie, welke deze behoeft in het kader
      van zijn bestuurlijke verantwoordelijkheid voor het overheidspersoneelsbeleid. Over deze informatieverstrekking
      worden door Onze Minister en het bestuur van het Vut-fonds nadere afspraken gemaakt.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel6
  - number: '8.1'
    text: |-
      De Wet uitkering wegens vrijwillig vervroegd uittreden wordt met ingang van een bij koninklijk besluit vast te
      stellen tijdstip, dat niet later is dan 1 januari 1996, ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel8
  - number: '8.2'
    text: |-
      Op de dag vóór het in het eerste lid bedoelde tijdstip bestaande rechten en verplichtingen van
      belanghebbenden, lichamen en het Algemeen burgerlijk pensioenfonds, op grond van de in het eerste
      lid genoemde wet, de bepalingen van de Wet bevordering doorstroming onderwijspersoneel en van de
      [Wet bevordering doorstroming onderwijspersoneel II][ref1], blijven, mits zij niet op dat tijdstip volgens de
      bepalingen van die wetten eindigen, met ingang van dat tijdstip op de voet van die bepalingen bestaan maar worden
      beschouwd als uit een vut-overeenkomst ontstane rechten en verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004586
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004586
  - number: '8.3'
    text: |-
      De Wet van 28 september 1989, houdende bijzondere regelen met betrekking tot het recht op uitkering als bedoeld in
      de Wet uitkering wegens vrijwillig vervroegd uittreden (*Stb.* 1989, 478), wordt ingetrokken met ingang van het in
      het eerste lid bedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel8
  - number: '8.4'
    text: |-
      Rechten en verplichtingen van belanghebbenden, lichamen en het Algemeen burgerlijk pensioenfonds, die op of na
      het in het eerste lid bedoelde tijdstip zouden ontstaan uit hoofde van de in het derde lid genoemde wet ontstaan
      dienovereenkomstig, met dien verstande dat te dien aanzien een vut-overeenkomst waaraan de belanghebbende rechten
      zou hebben kunnen ontlenen indien hij niet met recht op wachtgeld zou zijn ontslagen, in de plaats treedt van de in
      het eerste lid genoemde wet.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel8
  - number: '8.5'
    text: |-
      In afwijking van het eerste lid blijft artikel 24 van de in dat lid genoemde wet van toepassing op een
      beslissing als bedoeld in dat artikel, genomen voor het in het eerste lid bedoelde tijdstip en is dat artikel van
      overeenkomstige toepassing ten aanzien van een beslissing die op of na dat tijdstip is genomen naar aanleiding van
      een verzoek of een aanvraag, gedaan voor dat tijdstip, op basis van die wet.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel8
  - number: '8.6'
    text: |-
      Voor de toepassing van het tweede, vierde en vijfde lid treedt het Vut-fonds in de plaats van het Algemeen
      burgerlijk pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel8
  - number: '8.7'
    text: |-
      Indien en voor zover op het in het eerste lid bedoelde tijdstip niet is voorzien in bepalingen, als bedoeld in
      artikel 3, achtste tot en met elfde lid, artikel 6, achtste lid, en artikel 7, achtste lid, van de in het eerste
      lid genoemde wet, wordt daarin voorzien door Onze Minister. De vorige volzin is van toepassing ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel8
  - number: 8.7.a
    text: toekenningen aan belanghebbenden van uitkeringen;
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel8
  - number: 8.7.b
    text: vaststellingen van het bedrag van uitkeringen (uitkeringspercentage); en
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel8
  - number: 8.7.c
    text: |-
      verrekeningen van uitkeringen met andere inkomsten, door het bestuur van het Algemeen burgerlijk pensioenfonds,
      voorzover die toekenningen, vaststellingen en verrekeningen hebben plaatsgevonden in de naar het oordeel van Onze
      Minister gerechtvaardigde verwachting dat met terugwerkende kracht bepalingen als bedoeld in de vorige volzin
      zouden gaan gelden op grond waarvan die toekenningen, vaststellingen en verrekeningen konden plaatsvinden. Op de
      door Onze Minister te treffen voorziening is het tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel8
  - number: '9.1'
    text: |-
      De [artikelen 1][ref1], onderdeel *o*, [11][ref2], [12][ref3], [13][ref4], [14][ref5], [15][ref6],
      [16][ref7], [17][ref8], [18][ref9], [19][ref10], [20][ref11], [38][ref12], [40][ref13] en
      [41 van de Wet financiële voorzieningen privatisering ABP][ref14] vervallen met ingang van het in
      [artikel 8, eerste lid][ref15], bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007211#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0007211#Artikel12
