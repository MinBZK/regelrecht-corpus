        artikel: '8'
  - number: '9.2'
    text: |-
      In afwijking van het eerste lid blijft het Algemeen burgerlijk pensioenfonds aan het Vut-fonds de jaarlijkse
      bijdrage verschuldigd, bedoeld in artikel 41, eerste lid, van de in het eerste lid genoemde wet, met dien verstande
      dat, in afwijking van het tweede en derde lid van dat artikel:
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel9
  - number: 9.2.a
    text: |-
      deze bijdrage het hierna aangegeven percentage bedraagt van de loonsom in het desbetreffende jaar: 1996: 1,17
      procent; 1997: 0,94 procent; 1998: 0,71 procent; 1999: 0,47 procent; 2000: 0,24 procent, waarbij,
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel9
  - number: 9.2.b
    text: |-
      onder loonsom wordt verstaan: het totaal in enig jaar van de inkomens bedoeld in artikel 3.1, eerste tot en met het
      vijfde lid, van het pensioenreglement van de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel9
  - number: '9.3'
    text: |-
      De lasten die voor het Vut-fonds ontstaan door [artikel 8, tweede lid][ref1], worden gedekt door bijdragen van de
      overheids- en onderwijsinstellingen, bedoeld in [artikel 3, eerste lid][ref2], en van de instellingen, bedoeld in
      [artikel 4, eerste lid][ref3], met verhaal op het personeel van die instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007792#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007792#Artikel4
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007792
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0007792
        artikel: '4'
  - number: '9.4'
    text: |-
      De lasten die voor het Vut-fonds ontstaan door [artikel 8, vierde lid][ref1], worden gedekt overeenkomstig
      de dekking van de lasten, bedoeld in het derde lid. Het bestuur van het Vut-fonds bepaalt evenwel op verzoek
      van de gezamenlijke sectorwerkgevers en centrales dat vanaf een bij dat verzoek aan te geven tijdstip de
      bijdragen worden verstrekt door de instellingen die behoren tot de sector waaruit de belanghebbenden, bedoeld in
      [artikel 8, vierde lid][ref2], afkomstig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007792#Artikel8
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007792
        artikel: '8'
  - number: '9.5'
    text: |-
      De in het tweede lid bedoelde bijdrage wordt aangewend ter vermindering van het verhaal op het personeel, bedoeld
      in het derde lid, en overigens ter verlichting van geldelijke verplichtingen die uit een vut-overeenkomst voor dat
      personeel zullen kunnen ontstaan.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel9
  - number: '9.6'
    text: |-
      Het bestuur van het Vut-fonds stelt voor de toepassing van het derde, vierde en vijfde lid regels vast ter zake van
      de onderwerpen, geregeld in de artikelen 12, 13, eerste en tweede lid, 15, eerste tot en met derde lid, 16, 17, 18,
      19 en 20 van de in het eerste lid genoemde wet. De in de eerste volzin bedoelde regels kunnen voorts overeenkomstig
      omvatten het geval, bedoeld in [artikel 4, vijfde lid][ref1], terzake van de lasten bedoeld in het derde en vierde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel4
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '4'
  - number: '9.7'
    text: |-
      De ingevolge het zesde lid vast te stellen regels worden door het bestuur van het Vut-fonds vastgesteld in
      overeenstemming met Onze Minister en de Raad voor het Overheidspersoneelsbeleid. Zodanige overeenstemming is
      eveneens vereist ten aanzien van de in het vierde lid bedoelde bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel9
  - number: '9.8'
    text: |-
      Het bestuur van het Vut-fonds kan bepalen dat ingaande een tijdstip dat is gelegen vijf jaren na het in
      [artikel 8, eerste lid][ref1], bedoelde tijdstip, de alsdan resterende lasten ter zake van belanghebbenden als
      bedoeld in artikel 3, eerste lid, vierde volzin, van de in [artikel 8, eerste lid][ref2], genoemde wet (vut
      bij veertig dienstjaren) worden gedekt door specifieke door het bestuur van het Vut-fonds aangewezen groepen
      instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007792#Artikel8
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007792
        artikel: '8'
  - number: '9.9'
    text: |-
      Onze Minister stelt regels omtrent de vergoeding door lichamen van bedragen ter zake van uitkeringen als bedoeld in
      [artikel 8, zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel8
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '8'
  - number: '10.1'
    text: |-
      De werking van een vut-overeenkomst vangt niet eerder aan dan met ingang van het in [artikel 8, eerste lid][ref1],
      bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel8
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '8'
  - number: '10.2'
    text: |-
      De door het bestuur van het Vut-fonds ingevolge [artikel 9][ref1] te stellen regelen treden in werking op het in
      het eerste lid bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel9
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '9'
  - number: '12.1'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst. De [artikelen 8, zevende lid][ref1], en [9, negende lid][ref2], werken terug tot en met 1 maart 1987.
      [Artikel 11, eerste en tweede lid][ref3], werkt terug tot en met 1 januari 1995. [Artikel 11, derde lid][ref4],
      werkt terug tot en met 1 mei 1993.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007792#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0007792#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0007792#Artikel11
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007792
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0007792
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0007792
        artikel: '11'
  - number: '12.2'
    text: |-
      Indien het *Staatsblad* waarin deze wet wordt geplaatst, wordt uitgegeven na 31 december 1995, wordt de in
      [artikel 8, eerste lid][ref1], genoemde datum vervangen door de dag van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel8
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '8'
  - number: '13'
    text: 'Deze wet wordt aangehaald als: Wet kaderregeling vut overheidspersoneel.'
    url: https://wetten.overheid.nl/BWBR0007792/2013-01-01#Artikel13
