preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is het sociaal-fiscaalnummer en het onderwijsnummer
    als persoonsgebonden nummer in het onderwijs in te voeren; dat het daarom wenselijk is enkele onderwijswetten te
    wijzigen;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013105/2022-08-01#ArtikelAanhef
articles:
  - number: XIII
    text: |-
      De Informatie Beheer Groep verstrekt uiterlijk op 31 december van het jaar, bedoeld in
      [artikel XIa, zesde lid][ref1], aan de instellingsbesturen het burgerservicenummer dan wel het onderwijsnummer
      van een bij die instelling ingeschreven student of extraneus, zoals dit gegeven is opgenomen in het basisregister
      onderwijs, bedoeld in [artikel 9a van de Wet verzelfstandiging Informatiseringsbank][ref2]. Het instellingsbestuur
      neemt dit nummer op in de administratie van de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelXIa
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel9a
    url: https://wetten.overheid.nl/BWBR0013105/2022-08-01#ArtikelXIII
