  - number: XII
    text: |-
      1 De ouders, voogden of verzorgers van een leerling van een basisschool, een speciale school voor
      basisonderwijs, een school voor speciaal onderwijs, een school of instelling voor speciaal en voortgezet
      speciaal onderwijs, een school voor voortgezet speciaal onderwijs of een school voor voortgezet onderwijs,
      onderscheidenlijk de ouders, voogden of verzorgers van een deelnemer van een instelling als bedoeld in
      [artikel 1.3.1 van de Wet educatie en beroepsonderwijs][ref1], verstrekken binnen vier maanden na inwerkingtreding
      van de [artikelen I tot en met IV][ref2] aan het bevoegd gezag van die school, onderscheidenlijk instelling, het
      burgerservicenummer van de leerling, onderscheidenlijk deelnemer, aan de hand van een van overheidswege verstrekt
      document, waarop tevens de geslachtsnaam, de voorletters, de geboortedatum en het geslacht van de leerling,
      onderscheidenlijk deelnemer, zijn vermeld.

      2 Indien de leerling, onderscheidenlijk de deelnemer, meerderjarig is, rust de verplichting, omschreven in het
      eerste lid, op de leerling, onderscheidenlijk de deelnemer, zelf.

      3 Het bevoegd gezag draagt zorg voor de vaststelling van het burgerservicenummer aan de hand van het in het
      eerste lid bedoelde document en neemt het burgerservicenummer op in de leerlingenadministratie van de school,
      onderscheidenlijk de administratie van de instelling.

      4 Indien de [artikelen I tot en met IV][ref3] niet alle op hetzelfde tijdstip in werking treden, vindt de
      verstrekking, bedoeld in het eerste lid, plaats:

      a. binnen vier maanden na de inwerkingtreding van [artikel I][ref4], voor wat betreft leerlingen van scholen als
      bedoeld in de [Wet op het primair onderwijs][ref5];

      b. binnen vier maanden na de inwerkingtreding van [artikel II][ref6], voor wat betreft leerlingen van scholen en
      instellingen als bedoeld in de [Wet op de expertisecentra][ref7];

      c. binnen vier maanden na de inwerkingtreding van [artikel III][ref8], voor wat betreft leerlingen van scholen als
      bedoeld in de [Wet op het voortgezet onderwijs][ref9];

      d. binnen vier maanden na de inwerkingtreding van [artikel IV][ref10], voor wat betreft deelnemers van instellingen
      als bedoeld in de [Wet educatie en beroepsonderwijs][ref11].


