  - number: XIV
    text: |-
      1 Het bevoegd gezag van een school als bedoeld in onderscheidenlijk de [Wet op het primair onderwijs][ref1], de
      [Wet op de expertisecentra][ref2]en de [Wet op het voortgezet onderwijs][ref3] verstrekt voor 15 oktober van het
      jaar, bedoeld in [artikel XIa, eerste, tweede, onderscheidenlijk derde lid][ref4], aan de Informatie Beheer Groep
      het burgerservicenummer van de leerlingen.

      2 Tevens verstrekt het bevoegd gezag van een school als bedoeld in onderscheidenlijk
      de [Wet op het primair onderwijs][ref5], de [Wet op de expertisecentra][ref6] en
      de [Wet op het voortgezet onderwijs][ref7] voor 15 oktober van het jaar, bedoeld in
      [artikel XIa, eerste, tweede, onderscheidenlijk derde lid][ref8], aan de Informatie Beheer Groep van de
      leerlingen van wie geen burgerservicenummer kan worden overgelegd en die op 1 oktober van het hiervoor bedoelde
      jaar in aanmerking kunnen worden gebracht voor bekostiging, de gegevens betreffende geslachtsnaam, voornamen,
      geboortedatum, geslacht, adres en woonplaats.

      3 De Informatie Beheer Groep verstrekt uiterlijk op 31 december van het jaar, bedoeld in het tweede lid, aan het
      bevoegd gezag van de in het tweede lid bedoelde leerlingen het burgerservicenummer of, voor zover is gebleken
      dat aan de leerling geen burgerservicenummer is toegekend, een door de Informatie Beheer Groep uitgegeven
      persoonsgebonden nummer voor de desbetreffende leerling, het onderwijsnummer.

      4 Het bevoegd gezag neemt na ontvangst van het in het derde lid bedoelde burgerservicenummer of onderwijsnummer van
      een leerling, dit nummer op in de leerlingenadministratie bij de gegevens van de desbetreffende leerling.


