preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het sociaal-fiscaalnummer en het onderwijsnummer
    als persoonsgebonden nummer in het onderwijs in te voeren; dat het daarom wenselijk is enkele onderwijswetten te
    wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013105/2009-10-01#ArtikelAanhef
articles:
  - number: XIa
    text: |-
      1 [Artikel 40b, eerste lid, tweede volzin, en derde, vierde en zesde lid, van de Wet op het primair onderwijs][ref1]
      is van toepassing met ingang van 2 oktober van een bij koninklijk besluit vast te stellen jaar.

      2 [Artikel 42a, eerste lid, tweede volzin, en derde, vierde en zesde lid, van de Wet op de expertisecentra][ref2]
      is van toepassing met ingang van 2 oktober van een bij koninklijk besluit vast te stellen jaar.

      3 __REF000___________________________________________________________________________________________________________
      _ is van toepassing met ingang van 2 oktober van een bij koninklijk besluit vast te stellen jaar.

      4 (vervallen)

      5 __REF000___________________________________________________________________________________________________________
      _____ is van toepassing met ingang van 2 oktober van een bij koninklijk besluit vast te stellen jaar.

      6 __REF000___________________________________________________________________________________________________________
      ___________________________ is van toepassing met ingang van 1 augustus van een bij koninklijk besluit vast te
      stellen jaar.

      7 Tot het tijdstip, bedoeld in onderscheidenlijk het eerste, tweede, derde, vijfde en zesde lid, wordt voor de
      toepassing van de desbetreffende wet of het desbetreffende deel van de wet uitsluitend het burgerservicenummer als
      persoonsgebonden nummer gebruikt en kan toelating van een leerling, deelnemer, student of extraneus plaatsvinden
      zonder overlegging van het persoonsgebonden nummer, indien:

      a. door de ouders, voogden of verzorgers van de leerling of deelnemer, dan wel – indien de leerling of deelnemer
      meerderjarig en handelingsbekwaam is – door de leerling of deelnemer aannemelijk wordt gemaakt dat geen
      burgerservicenummer van de leerling of deelnemer kan worden overgelegd; of

      b. de student of extraneus aannemelijk maakt dat hij geen burgerservicenummer kan overleggen.


