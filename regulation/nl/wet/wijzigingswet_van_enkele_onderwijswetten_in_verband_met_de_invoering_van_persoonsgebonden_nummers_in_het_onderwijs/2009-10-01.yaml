  - number: XV
    text: |-
      1 Het bevoegd gezag van een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref1] verstrekt voor 15 oktober van het
      jaar, bedoeld in [artikel XIa, vijfde lid][ref2], aan de Informatie Beheer Groep het burgerservicenummer van de
      deelnemers.

      2 Tevens verstrekt het bevoegd gezag van een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref3] voor 15 oktober van het jaar,
      bedoeld in [artikel XIa, vijfde lid][ref4], aan de Informatie Beheer Groep van de deelnemers van wie geen
      burgerservicenummer kan worden overgelegd en die op 1 oktober van het hiervoor bedoelde jaar in aanmerking kunnen
      worden gebracht voor bekostiging, de gegevens betreffende geslachtsnaam, voornamen, geboortedatum, geslacht, adres
      en woonplaats.

      3 De Informatie Beheer Groep verstrekt uiterlijk op 31 december van het jaar, bedoeld in het tweede lid, aan het
      bevoegd gezag van de in het tweede lid bedoelde deelnemers het burgerservicenummer of, voor zover is gebleken
      dat aan de deelnemer geen burgerservicenummer is toegekend, een door de Informatie Beheer Groep uitgegeven
      persoonsgebonden nummer voor de desbetreffende deelnemer, het onderwijsnummer.

      4 Het bevoegd gezag neemt na ontvangst van het in het derde lid bedoelde burgerservicenummer of onderwijsnummer van
      een deelnemer, dit nummer op in de administratie van de instelling bij de gegevens van de desbetreffende deelnemer.


