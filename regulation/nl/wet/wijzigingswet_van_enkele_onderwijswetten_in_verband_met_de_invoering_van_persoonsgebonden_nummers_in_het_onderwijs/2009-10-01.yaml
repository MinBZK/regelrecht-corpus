  - number: XXX
    text: |-
      1 De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      2 Het tijdstip van inwerkingtreding van [artikel IX, onderdeel B][ref1], kan verschillend worden vastgesteld
      voor onderscheidenlijk scholen als bedoeld in de [Wet op het primair onderwijs][ref2], scholen als bedoeld in de
      [Wet op de expertisecentra][ref3] en scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref4].


