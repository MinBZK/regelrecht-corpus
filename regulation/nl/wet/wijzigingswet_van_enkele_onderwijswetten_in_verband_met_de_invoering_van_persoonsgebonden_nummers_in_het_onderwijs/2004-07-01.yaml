  - number: XXX.1
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXXX
  - number: XXX.2
    text: |-
      Het tijdstip van inwerkingtreding van [artikel IX, onderdeel B][ref1], kan verschillend worden vastgesteld voor
      onderscheidenlijk scholen als bedoeld in de [Wet op het primair onderwijs][ref2], scholen als bedoeld in de
      [Wet op de expertisecentra][ref3] en scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelIX
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0003549
      [ref4]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXXX
