  - number: XIa.7
    text: |-
      Tot het tijdstip, bedoeld in onderscheidenlijk het eerste, tweede, derde, vijfde en zesde lid, wordt voor de
      toepassing van de desbetreffende wet of het desbetreffende deel van de wet uitsluitend het sociaal-fiscaalnummer
      als persoonsgebonden nummer gebruikt en kan toelating van een leerling, deelnemer, student of extraneus
      plaatsvinden zonder overlegging van het persoonsgebonden nummer, indien:
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXIa
  - number: XIa.7.a
    text: |-
      door de ouders, voogden of verzorgers van de leerling of deelnemer, dan wel – indien de leerling of deelnemer
      meerderjarig en handelingsbekwaam is – door de leerling of deelnemer aannemelijk wordt gemaakt dat geen sociaal-
      fiscaalnummer van de leerling of deelnemer kan worden overgelegd; of
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXIa
  - number: XIa.7.b
    text: de student of extraneus aannemelijk maakt dat hij geen sociaal-fiscaalnummer kan overleggen.
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXIa
  - number: XII.1
    text: |-
      De ouders, voogden of verzorgers van een leerling van een basisschool, een speciale school voor
      basisonderwijs, een school voor speciaal onderwijs, een school of instelling voor speciaal en voortgezet
      speciaal onderwijs, een school voor voortgezet speciaal onderwijs of een school voor voortgezet onderwijs,
      onderscheidenlijk de ouders, voogden of verzorgers van een deelnemer van een instelling als bedoeld in
      [artikel 1.3.1 van de Wet educatie en beroepsonderwijs][ref1], verstrekken binnen vier maanden na inwerkingtreding
      van de [artikelen I tot en met IV][ref2] aan het bevoegd gezag van die school, onderscheidenlijk instelling, het
      sociaal-fiscaalnummer van de leerling, onderscheidenlijk deelnemer, aan de hand van een van overheidswege verstrekt
      document, waarop tevens de geslachtsnaam, de voorletters, de geboortedatum en het geslacht van de leerling,
      onderscheidenlijk deelnemer, zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013105#ArtikelI
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013105
        artikel: I
  - number: XII.2
    text: |-
      Indien de leerling, onderscheidenlijk de deelnemer, meerderjarig is, rust de verplichting, omschreven in het eerste
      lid, op de leerling, onderscheidenlijk de deelnemer, zelf.
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXII
  - number: XII.3
    text: |-
      Het bevoegd gezag draagt zorg voor de vaststelling van het sociaal-fiscaalnummer aan de hand van het in het
      eerste lid bedoelde document en neemt het sociaal-fiscaalnummer op in de leerlingenadministratie van de school,
      onderscheidenlijk de administratie van de instelling.
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXII
  - number: XII.4
    text: |-
      Indien de [artikelen I tot en met IV][ref1] niet alle op hetzelfde tijdstip in werking treden, vindt de
      verstrekking, bedoeld in het eerste lid, plaats:


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelI
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0013105
        artikel: I
  - number: XII.4.a
    text: |-
      binnen vier maanden na de inwerkingtreding van [artikel I][ref1], voor wat betreft leerlingen van scholen als
      bedoeld in de [Wet op het primair onderwijs][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0003420
