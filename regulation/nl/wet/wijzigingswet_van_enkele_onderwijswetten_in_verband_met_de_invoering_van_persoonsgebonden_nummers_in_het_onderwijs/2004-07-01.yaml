        bwb_id: BWBR0013105
        artikel: IV
      - id: ref2
        bwb_id: BWBR0007625
  - number: XIV.1
    text: |-
      Het bevoegd gezag van een school als bedoeld in onderscheidenlijk de [Wet op het primair onderwijs][ref1], de
      [Wet op de expertisecentra][ref2]en de [Wet op het voortgezet onderwijs][ref3] verstrekt voor 15 oktober van het
      jaar, bedoeld in [artikel XIa, eerste, tweede, onderscheidenlijk derde lid][ref4], aan de Informatie Beheer Groep
      het sociaal-fiscaalnummer van de leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
      [ref4]: https://wetten.overheid.nl/BWBR0013105#ArtikelXIa
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXIV
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
      - id: ref4
        bwb_id: BWBR0013105
        artikel: XIa
  - number: XIV.2
    text: |-
      Tevens verstrekt het bevoegd gezag van een school als bedoeld in onderscheidenlijk
      de [Wet op het primair onderwijs][ref1], de [Wet op de expertisecentra][ref2] en
      de [Wet op het voortgezet onderwijs][ref3] voor 15 oktober van het jaar, bedoeld in
      [artikel XIa, eerste, tweede, onderscheidenlijk derde lid][ref4], aan de Informatie Beheer Groep van de
      leerlingen van wie geen sociaal-fiscaalnummer kan worden overgelegd en die op 1 oktober van het hiervoor bedoelde
      jaar in aanmerking kunnen worden gebracht voor bekostiging, de gegevens betreffende geslachtsnaam, voornamen,
      geboortedatum, geslacht, adres en woonplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
      [ref4]: https://wetten.overheid.nl/BWBR0013105#ArtikelXIa
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXIV
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
      - id: ref4
        bwb_id: BWBR0013105
        artikel: XIa
  - number: XIV.3
    text: |-
      De Informatie Beheer Groep verstrekt uiterlijk op 31 december van het jaar, bedoeld in het tweede lid, aan het
      bevoegd gezag van de in het tweede lid bedoelde leerlingen het sociaal-fiscaalnummer of, voor zover is gebleken
      dat aan de leerling geen sociaal-fiscaalnummer is toegekend, een door de Informatie Beheer Groep uitgegeven
      persoonsgebonden nummer voor de desbetreffende leerling, het onderwijsnummer.
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXIV
  - number: XIV.4
    text: |-
      Het bevoegd gezag neemt na ontvangst van het in het derde lid bedoelde sociaal-fiscaalnummer of onderwijsnummer van
      een leerling, dit nummer op in de leerlingenadministratie bij de gegevens van de desbetreffende leerling.
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXIV
  - number: XV.1
    text: |-
      Het bevoegd gezag van een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref1] verstrekt voor 15 oktober van het
      jaar, bedoeld in [artikel XIa, vijfde lid][ref2], aan de Informatie Beheer Groep het sociaal-fiscaalnummer van
      de deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013105#ArtikelXIa
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXV
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013105
        artikel: XIa
  - number: XV.2
    text: |-
      Tevens verstrekt het bevoegd gezag van een instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref1] voor 15 oktober van het jaar, bedoeld
      in [artikel XIa, vijfde lid][ref2], aan de Informatie Beheer Groep van de deelnemers van wie geen sociaal-
      fiscaalnummer kan worden overgelegd en die op 1 oktober van het hiervoor bedoelde jaar in aanmerking kunnen worden
      gebracht voor bekostiging, de gegevens betreffende geslachtsnaam, voornamen, geboortedatum, geslacht, adres en
      woonplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
