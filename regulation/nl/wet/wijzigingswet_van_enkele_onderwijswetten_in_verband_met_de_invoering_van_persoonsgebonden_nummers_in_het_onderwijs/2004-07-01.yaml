      binnen vier maanden na de inwerkingtreding van [artikel IV][ref1], voor wat betreft deelnemers van instellingen als
      bedoeld in de [Wet educatie en beroepsonderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelIV
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXII
    references:
