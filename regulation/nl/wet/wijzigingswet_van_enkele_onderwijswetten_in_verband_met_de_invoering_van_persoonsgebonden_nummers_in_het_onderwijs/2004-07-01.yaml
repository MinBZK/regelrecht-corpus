        artikel: III
  - number: XI.4
    text: |-
      Indien artikel III op een eerder tijdstip in werking treedt dan de [artikelen I][ref1] en [II][ref2], wordt het
      eerste lid uitsluitend toegepast, voorzover de desbetreffende gegevens niet reeds op grond van het tweede lid zijn
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0013105#ArtikelII
