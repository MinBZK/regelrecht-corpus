  - number: XV.3
    text: |-
      De Informatie Beheer Groep verstrekt uiterlijk op 31 december van het jaar, bedoeld in het tweede lid, aan het
      bevoegd gezag van de in het tweede lid bedoelde deelnemers het sociaal-fiscaalnummer of, voor zover is gebleken
      dat aan de deelnemer geen sociaal-fiscaalnummer is toegekend, een door de Informatie Beheer Groep uitgegeven
      persoonsgebonden nummer voor de desbetreffende deelnemer, het onderwijsnummer.
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXV
  - number: XV.4
    text: |-
      Het bevoegd gezag neemt na ontvangst van het in het derde lid bedoelde sociaal-fiscaalnummer of onderwijsnummer van
      een deelnemer, dit nummer op in de administratie van de instelling bij de gegevens van de desbetreffende deelnemer.
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXV
  - number: XXVII
    text: |-
      De [artikelen 164 van de Wet op het primair onderwijs][ref1], [146 van de Wet op de expertisecentra][ref2],
      [104 van de Wet op het voortgezet onderwijs][ref3] en [11.1 van de Wet educatie en beroepsonderwijs][ref4] zijn van
      overeenkomstige toepassing op de [artikelen XII, derde lid][ref5], [XIV, eerste, tweede en vierde lid][ref6], en
      [XV, eerste en derde lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel164
