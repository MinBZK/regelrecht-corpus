preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het sociaal-fiscaalnummer en het onderwijsnummer
    als persoonsgebonden nummer in het onderwijs in te voeren; dat het daarom wenselijk is enkele onderwijswetten te
    wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelAanhef
articles:
  - number: XI.1
    text: |-
      De rijksbelastingdienst verstrekt binnen één week na inwerkingtreding van de [artikelen I][ref1] en [II][ref2]
      aan de ouders, voogden of verzorgers van een jongere die op het tijdstip van inwerkingtreding van de
      [artikelen I][ref3] en [II][ref4] de leeftijd van ten minste drie jaar en zes maanden heeft bereikt, doch de
      leeftijd van achttien jaar nog niet heeft bereikt, kosteloos een afschrift van de gegevens van die jongere
      betreffende zijn geslachtsnaam, voorletters, geboortedatum, geslacht en sociaal-fiscaalnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0013105#ArtikelII
      [ref3]: https://wetten.overheid.nl/BWBR0013105#ArtikelI
