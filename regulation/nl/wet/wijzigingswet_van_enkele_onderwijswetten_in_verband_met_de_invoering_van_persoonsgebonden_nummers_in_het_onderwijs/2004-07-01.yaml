  - number: XI.3
    text: |-
      Indien de artikelen I en II op een eerder tijdstip in werking treden dan [artikel III][ref1], blijft het tweede lid
      buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelIII
    url: https://wetten.overheid.nl/BWBR0013105/2004-07-01#ArtikelXI
    references:
      - id: ref1
