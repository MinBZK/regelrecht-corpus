    text: |-
      De rijksbelastingdienst verstrekt binnen één week na inwerkingtreding van [artikel III][ref1] aan de ouders,
      voogden of verzorgers van een jongere die op het tijdstip van inwerkingtreding van [artikel III][ref2] de leeftijd
      van ten minste tien jaar heeft bereikt, doch de leeftijd van achttien jaar nog niet heeft bereikt, kosteloos een
      afschrift van de gegevens van die jongere betreffende zijn geslachtsnaam, voorletters, geboortedatum, geslacht en
      sociaal-fiscaalnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelIII
      [ref2]: https://wetten.overheid.nl/BWBR0013105#ArtikelIII
