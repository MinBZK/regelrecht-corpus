  - number: '16'
    text: >-
      1 Bij of krachtens algemene maatregel van bestuur wordt het CSIRT aangewezen voor elke essentiële entiteit en
      belangrijke entiteit.


      2 Het CSIRT heeft de volgende taken:


      a. het monitoren en analyseren van cyberdreigingen, kwetsbaarheden en incidenten op nationaal niveau, en het op
      verzoek verlenen van bijstand aan de betrokken essentiële entiteit of belangrijke entiteit met betrekking tot het
      realtime of bijna-realtime monitoren van haar netwerk- en informatiesysteem;


      b. het verstrekken van vroegtijdige waarschuwingen, meldingen en aankondigingen en het verspreiden van informatie
      aan de betrokken essentiële entiteit of belangrijke entiteit, de bevoegde autoriteiten, Onze Minister van
      Economische Zaken, ten behoeve van de uitvoering van de taken, bedoeld in artikel 2, eerste lid, van de Wet
      bevordering digitale weerbaarheid bedrijven, en andere relevante partijen over cyberdreigingen, kwetsbaarheden en
      incidenten, indien mogelijk in bijna-realtime;


      c. indien van toepassing, het reageren op incidenten en verlenen van bijstand aan de betrokken essentiële entiteit
      of belangrijke entiteit;


      d. het verzamelen en analyseren van forensische gegevens en het zorgen voor dynamische risico- en incidentenanalyse
      en situationeel bewustzijn met betrekking tot cyberbeveiliging;


      e. het op verzoek van een essentiële entiteit of belangrijke entiteit proactief scannen van het netwerk- en
      informatiesysteem van de betrokken entiteit om kwetsbaarheden met mogelijk significante gevolgen op te sporen;


      f. het deelnemen aan het CSIRT-netwerk en, in overeenstemming met zijn capaciteiten en bevoegdheden, het verlenen
      van wederzijdse bijstand aan andere leden van het CSIRT-netwerk op verzoek van een lid van dat netwerk;


      g. het deelnemen aan de op grond van artikel 19 van de NIS2-richtlijn georganiseerde collegiale toetsingen;


      h. indien van toepassing, het optreden als coördinator ten behoeve van het proces van gecoördineerde bekendmaking
      van kwetsbaarheden, bedoeld in artikel 17; en


      i. het bijdragen aan de uitrol van veilige instrumenten voor het delen van informatie, bedoeld in artikel 10, derde
      lid, van de NIS2-richtlijn.


      3 Het CSIRT kan een openbaar toegankelijk netwerk- en informatiesysteem van een essentiële entiteit en
      belangrijke entiteit proactief en niet-intrusief scannen met het oog op het opsporen van een kwetsbaar of onveilig
      geconfigureerd netwerk- en informatiesysteem en het informeren van de betrokken entiteit. Deze scan leidt niet tot
      negatieve gevolgen voor de dienstverlening van de betrokken entiteit.


      4 Bij de uitvoering van de taken, bedoeld in het tweede en derde lid, kan het CSIRT op grond van een
      risicogebaseerde benadering prioriteit geven aan bepaalde taken.


      5 Het CSIRT brengt samenwerkingsrelaties tot stand met essentiële entiteiten, belangrijke entiteiten, Onze Minister
      van Economische Zaken en andere relevante partijen, teneinde de doelstellingen van deze wet te verwezenlijken.


      6 Met het oog op de samenwerking, bedoeld in het vijfde lid, bevordert het CSIRT de invoering en het gebruik van
      gemeenschappelijke of gestandaardiseerde praktijken, classificatieschema’s en taxonomieën met betrekking tot:


      a. procedures voor de incidentenbehandeling;


      b. crisisbeheer; en


      c. gecoördineerde bekendmaking van kwetsbaarheden.


      7 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de functionele, financiële,
      technische en organisatorische vereisten ten aanzien van de organisatie die bij of krachtens algemene maatregel van
      bestuur als CSIRT wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel16
  - number: '17'
    text: >-
      1 Bij of krachtens algemene maatregel van bestuur wordt een CSIRT aangewezen als de coördinator met het oog op een
      gecoördineerde bekendmaking van kwetsbaarheden.


      2 De coördinator met het oog op een gecoördineerde bekendmaking van kwetsbaarheden heeft de volgende taken:


      a. het optreden als tussenpersoon en het waar nodig vergemakkelijken van de interactie tussen de natuurlijke
      persoon of rechtspersoon die een kwetsbaarheid op grond van artikel 34 meldt en de fabrikant of aanbieder van de
      mogelijk kwetsbare ICT-producten of -diensten, op verzoek van een van beide partijen;


      b. het identificeren van en contact opnemen met de betrokken entiteiten;


      c. het bijstaan van de natuurlijke persoon of rechtspersoon die een kwetsbaarheid meldt;


      d. het onderhandelen over tijdschema’s voor de bekendmaking en het beheren van kwetsbaarheden die van invloed zijn
      op meerdere entiteiten; en


      e. wanneer een gemelde kwetsbaarheid significante gevolgen kan hebben voor entiteiten in meer dan één lidstaat
      van de Europese Unie: het binnen het CSIRT-netwerk samenwerken met de door andere lidstaten van de Europese Unie
      aangewezen coördinatoren met het oog op een gecoördineerde bekendmaking van kwetsbaarheden.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel17
  - number: '18'
    text: >-
      Onze Minister is de cybercrisisbeheerautoriteit, bedoeld in artikel 9, eerste lid, van de NIS2-richtlijn,
      en heeft in die hoedanigheid de taken die zijn opgenomen in het nationaal plan voor grootschalige
      cyberbeveiligingsincidenten en crisisrespons, genoemd in artikel 20.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel18
  - number: '19'
    text: >-
      1 Onze Minister stelt in overeenstemming met Onze Ministers die het aangaan een nationale
      cyberbeveiligingsstrategie als bedoeld in artikel 7, eerste lid, van de NIS2-richtlijn vast.


      2 In het kader van de nationale cyberbeveiligingsstrategie stelt Onze Minister respectievelijk Onze Minister die
      het aangaat beleid vast over de in artikel 7, tweede lid, van de NIS2-richtlijn genoemde onderwerpen die onder zijn
      beleidsverantwoordelijkheid vallen.


      3 Onze Minister beoordeelt in overeenstemming met Onze Ministers die het aangaan de nationale
      cyberbeveiligingsstrategie regelmatig en ten minste om de vijf jaar, op basis van kernprestatie-indicatoren. Hij
      werkt de nationale cyberbeveiligingsstrategie in overeenstemming met Onze Minister die het aangaat zo nodig bij.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel19
  - number: '20'
    text: >-
      Onze Minister stelt een nationaal plan voor grootschalige cyberbeveiligingsincidenten en crisisrespons als bedoeld
      in artikel 9, vierde lid, van de NIS2-richtlijn vast.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel20
  - number: '21'
    text: >-
      1 De essentiële entiteit of belangrijke entiteit neemt passende en evenredige technische, operationele en
      organisatorische maatregelen om de risico’s voor de beveiliging van de netwerk- en informatiesystemen, die zij voor
      haar werkzaamheden of voor het verlenen van haar diensten gebruikt, te beheersen. Ook neemt zij deze maatregelen
      om incidenten te voorkomen of de gevolgen van incidenten voor de afnemers van haar diensten en voor andere diensten
      te beperken.


      2 De maatregelen, bedoeld in het eerste lid, zorgen voor een beveiligingsniveau van de netwerk- en
      informatiesystemen dat is afgestemd op de risico’s, bedoeld in het eerste lid. Bij het nemen van de maatregelen
      houdt de entiteit in ieder geval rekening met de stand van de techniek, de uitvoeringskosten en, indien van
      toepassing, de desbetreffende Europese en internationale normen. Ten aanzien van de evenredigheid van de
      maatregelen, bedoeld in het eerste lid, houdt de entiteit naar behoren rekening met de mate waarin zij aan risico’s
      is blootgesteld, de omvang van de entiteit en de kans dat zich incidenten voordoen en de ernst ervan, met inbegrip
      van de maatschappelijke en economische gevolgen.


      3 De maatregelen, bedoeld in het eerste lid, zijn gebaseerd op een benadering die alle gevaren omvat en tot doel
      heeft netwerk- en informatiesystemen en de fysieke omgeving van die systemen tegen incidenten te beschermen, en
      omvatten ten minste het volgende:


      a. beleid inzake risicoanalyse en beveiliging van informatiesystemen;


      b. incidentenbehandeling;


      c. bedrijfscontinuïteit, zoals back-upbeheer en herstelplannen, en crisisbeheer;


      d. de beveiliging van de toeleveringsketen, met inbegrip van beveiligingsgerelateerde aspecten met betrekking tot
      de relaties tussen de entiteit en haar rechtstreekse leveranciers of dienstverleners;


      e. beveiliging bij het verwerven, ontwikkelen en onderhouden van netwerk- en informatiesystemen, met inbegrip van
      de respons op en bekendmaking van kwetsbaarheden;


      f. beleid en procedures om de effectiviteit van maatregelen voor het beheersen van cyberbeveiligingsrisico’s te
      beoordelen;


      g. basispraktijken op het gebied van cyberhygiëne en opleiding op het gebied van cyberbeveiliging;


      h. beleid en procedures inzake het gebruik van cryptografie en, in voorkomend geval, encryptie;


      i. beveiligingsaspecten ten aanzien van personeel, toegangsbeleid en beheer van assets; en


      j. wanneer gepast, het gebruik van multifactor-authenticatie- of continue-authenticatieoplossingen, beveiligde
      spraak-, video- en tekstcommunicatie en beveiligde noodcommunicatiesystemen binnen de entiteit.


      4 Wanneer de entiteit overweegt welke maatregelen als bedoeld in het derde lid, onderdeel d, passend zijn, houdt
      zij rekening met:


      a. de specifieke kwetsbaarheden van elke rechtstreekse leverancier en dienstverlener;


      b. de algemene kwaliteit van de producten en de cyberbeveiligingspraktijken van haar leveranciers en
      dienstverleners, met inbegrip van hun veilige ontwikkelingsprocedures; en


      c. de resultaten van de door de samenwerkingsgroep op grond van artikel 22, eerste lid, van de NIS2-richtlijn
      uitgevoerde gecoördineerde beveiligingsrisicobeoordelingen van kritieke toeleveringsketens.


      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de maatregelen, bedoeld in het eerste
      lid, en kunnen met betrekking tot die maatregelen eisen worden gesteld aan entiteiten, waarbij onderscheid kan
      worden gemaakt tussen sectoren, subsectoren, soorten entiteiten en entiteiten.


      6 De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel21
  - number: 21a
    text: >-
      1 Indien dat naar het oordeel van Onze Minister die het aangaat, ter uitwerking van artikel 21, noodzakelijk is
      om risico’s voor de beveiliging van netwerk- en informatiesystemen die de nationale veiligheid raken te beheersen
      of om incidenten die de nationale veiligheid raken te voorkomen, legt hij in overeenstemming met Onze Minister een
      essentiële entiteit of een belangrijke entiteit de verplichting op om in de daarbij aangewezen onderdelen van haar
      netwerk- en informatiesystemen uitsluitend gebruik te maken van producten of diensten van anderen dan de daarbij
      door Onze Minister die het aangaat genoemde partij die:


      a. een staat, entiteit of persoon is waarvan bekend is of waarvoor gronden zijn te vermoeden dat deze de intentie
      heeft om de beveiliging van de netwerk- en informatiesystemen van de essentiële entiteit of belangrijke entiteit
      aan te tasten of om incidenten bij de essentiële entiteit of belangrijke entiteit te veroorzaken; of


      b. nauwe banden heeft met of onder invloed staat van een staat, entiteit of persoon als bedoeld in onderdeel a, of
      een entiteit of persoon is ten aanzien van wie er gronden zijn om dergelijke banden of invloed te vermoeden.


      2 In het kader van de beoordeling van de noodzaak, bedoeld in het eerste lid, beoordeelt Onze Minister die het
      aangaat in elk geval of beheersmaatregelen mogelijk en realiseerbaar zijn die de nationale veiligheidsrisico’s die
      in het geding zijn voldoende beschermen.


      3 Indien de verplichting, bedoeld in het eerste lid, betrekking heeft op reeds in gebruik zijnde producten en
      diensten ten behoeve van de daarbij aangewezen onderdelen, stelt Onze Minister die het aangaat in het belang
      van de continuïteit van de dienstverlening een termijn vast voor het vervangen respectievelijk beëindigen van de
      betreffende producten en diensten.


      4 Het eerste lid is niet van toepassing ten aanzien van essentiële entiteiten en belangrijke entiteiten
      die aanbieders van openbare elektronische communicatienetwerken of aanbieders van openbare elektronische
      communicatiediensten zijn.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel21a
  - number: '22'
    text: >-
      1 Indien sectorspecifieke rechtshandelingen van de Europese Unie voorschrijven dat een essentiële entiteit
      of belangrijke entiteit risicobeheersmaatregelen op het gebied van cyberbeveiliging neemt en indien deze
      verplichtingen ten minste gelijkwaardig zijn aan de verplichtingen, bedoeld in artikel 21, is artikel 21 niet van
      toepassing op die entiteit.


      2 De verplichtingen, bedoeld in het eerste lid, worden geacht gelijkwaardig te zijn aan de verplichtingen,
      bedoeld in artikel 21, wanneer de door sectorspecifieke rechtshandelingen van de Europese Unie voorgeschreven
      risicobeheersmaatregelen op het gebied van cyberbeveiliging ten minste een vergelijkbare uitwerking hebben als de
      verplichtingen, bedoeld in artikel 21.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel22
  - number: '23'
    text: >-
      1 Onze Minister die het aangaat kan bij regeling of besluit, in overeenstemming met Onze Minister, een essentiële
      entiteit respectievelijk een belangrijke entiteit die activiteiten uitvoert op het gebied van nationale veiligheid,
      openbare veiligheid, defensie of rechtshandhaving of die uitsluitend diensten verleent aan een overheidsinstantie
      als bedoeld in artikel 5, eerste lid, met betrekking tot die activiteiten of diensten ontheffen van de
      verplichtingen, bedoeld in artikel 21.


      2 Het eerste lid is niet van toepassing wanneer en voor zover een entiteit optreedt als verlener van
      vertrouwensdiensten die niet uitsluitend worden gebruikt binnen systemen die gesloten zijn als gevolg van een
      wettelijke regeling of een overeenkomst tussen een bepaalde groep deelnemers.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel23
  - number: '24'
    text: >-
      1 De maatregelen, bedoeld in artikel 21, behoeven de goedkeuring van het bestuur van de essentiële entiteit of
      belangrijke entiteit.


      2 Ieder lid van het bestuur van een essentiële entiteit of belangrijke entiteit beschikt over kennis en
      vaardigheden om:


      a. risico’s voor de beveiliging van netwerk- en informatiesystemen te kunnen identificeren;


      b. risicobeheersmaatregelen op het gebied van cyberbeveiliging te kunnen beoordelen; en


      c. de gevolgen van de risico’s en risicobeheersmaatregelen voor de diensten die door de entiteit worden verleend te
      kunnen beoordelen.


      3 Ieder lid van het bestuur van een essentiële entiteit of belangrijke entiteit voldoet binnen twee jaar na de
      inwerkingtreding van het tweede lid aan het bepaalde in het tweede lid. Indien een lid na de inwerkingtreding van
      het tweede lid wordt benoemd, voldoet dit lid binnen twee jaar na diens benoeming aan het bepaalde in het tweede
      lid.


      4 Ieder lid van het bestuur van een essentiële entiteit of belangrijke entiteit houdt de kennis en vaardigheden,
      bedoeld in het tweede lid, aantoonbaar actueel.


      5 Met het oog op het aantonen van de kennis en vaardigheden bezit ieder lid van het bestuur van een essentiële
      entiteit of belangrijke entiteit een certificaat, waaruit de deelname blijkt aan een training die de onderwerpen,
      bedoeld in het tweede lid, behandelt.


      6 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de training en het certificaat,
      bedoeld in het vijfde lid, waaronder de duur en het niveau van de training.


      7 Indien een rechtspersoon het bestuur of een lid van het bestuur van een essentiële entiteit of belangrijke
      entiteit is, is het bepaalde bij of krachtens het tweede tot en met zesde lid van overeenkomstige toepassing op de
      natuurlijke persoon of natuurlijke personen die namens die rechtspersoon zitting heeft of hebben in het bestuur van
      de essentiële entiteit of belangrijke entiteit.


      8 Indien de essentiële entiteit of belangrijke entiteit toepassing heeft gegeven aan de artikelen 129a of 239a van
      Boek 2 van het Burgerlijk Wetboek, is het bepaalde bij of krachtens het eerste tot en met zesde lid uitsluitend van
      toepassing op de uitvoerende bestuurders van die essentiële entiteit of belangrijke entiteit.


      9 Indien de essentiële entiteit of belangrijke entiteit een maatschap is, is het bepaalde bij of krachtens het
      eerste tot en met zesde lid van overeenkomstige toepassing op iedere maat van die maatschap.


      10 Indien de essentiële entiteit of belangrijke entiteit een vennootschap onder firma is, is het bepaalde bij of
      krachtens het eerste tot en met zesde lid van overeenkomstige toepassing op iedere vennoot van die vennootschap
      onder firma.


      11 Indien de essentiële entiteit of belangrijke entiteit een commanditaire vennootschap is, is het bepaalde bij
      of krachtens het eerste tot en met zesde lid van overeenkomstige toepassing op de beherende vennoten van die
      commanditaire vennootschap.


      12 Indien de essentiële entiteit een overheidsinstantie is, wordt voor de toepassing van dit artikel als het
      bestuur aangemerkt:


      a. bij ministeries: de minister;


      b. bij zelfstandige bestuursorganen van de centrale overheid: het zelfstandige bestuursorgaan;


      c. bij provincies: gedeputeerde staten;


      d. bij gemeenten: het college van burgemeester en wethouders;


      e. bij waterschappen: het dagelijks bestuur;


      f. bij gemeenschappelijke regelingen: het dagelijks bestuur van het openbaar lichaam, het bestuur van de
      bedrijfsvoeringsorganisatie onderscheidenlijk het gemeenschappelijk orgaan.


      13 Dit artikel is niet van toepassing op een essentiële entiteit of belangrijke entiteit indien artikel 21 niet van
      toepassing is op die entiteit.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel24
  - number: '25'
    text: >-
      1 De essentiële entiteit of belangrijke entiteit meldt overeenkomstig de artikelen 26 tot en met 29 ieder
      significant incident.


      2 Een incident is een significant incident als het:


      a. een ernstige operationele verstoring van de diensten of financiële verliezen voor de betrokken entiteit
      veroorzaakt of kan veroorzaken; of


      b. andere entiteiten heeft getroffen of kan treffen door aanzienlijke materiële of immateriële schade te
      veroorzaken.


      3 Bij of krachtens algemene maatregel van bestuur kunnen de criteria worden vastgesteld op basis waarvan wordt
      bepaald of sprake is van een significant incident als bedoeld in het tweede lid, waarbij onderscheid kan worden
      gemaakt tussen sectoren, subsectoren, soorten entiteiten en entiteiten.


      4 Ten aanzien van de entiteiten waarvoor in uitvoeringshandelingen op grond van artikel 23, elfde lid, van de
      NIS2-richtlijn nader is gespecificeerd in welke gevallen een incident bij die entiteiten als significant wordt
      beschouwd, kunnen bij of krachtens algemene maatregel van bestuur naast de hiervoor bedoelde specificaties in
      uitvoeringshandelingen, aanvullende criteria worden vastgesteld op basis waarvan wordt bepaald of sprake is van
      een significant incident als bedoeld in het tweede lid, waarbij onderscheid kan worden gemaakt tussen sectoren,
      subsectoren, soorten entiteiten en entiteiten.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel25
  - number: '26'
    text: >-
      1 De essentiële entiteit of belangrijke entiteit geeft ten behoeve van de melding, bedoeld in artikel 27, eerste
      lid, een vroegtijdige waarschuwing over het significante incident aan haar CSIRT en haar bevoegde autoriteit.
      Dit doet zij onverwijld of, indien dat niet mogelijk is, binnen 24 uur nadat zij kennis heeft gekregen van het
      significante incident.


      2 Bij de vroegtijdige waarschuwing, bedoeld in het eerste lid:


      a. geeft de entiteit aan of het significante incident vermoedelijk door een onrechtmatige of kwaadwillige handeling
      is veroorzaakt;


      b. geeft de entiteit aan of het significante incident grensoverschrijdende gevolgen kan hebben; en


      c. verstrekt de entiteit de contactgegevens van de functionaris die verantwoordelijk is voor de melding.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel26
  - number: '27'
    text: >-
      1 De essentiële entiteit of belangrijke entiteit dient onverwijld of, indien dat niet mogelijk is, binnen 72
      uur nadat zij kennis heeft gekregen van het significante incident een melding in bij haar CSIRT en haar bevoegde
      autoriteit met:


      a. indien van toepassing, een update van de informatie, bedoeld in artikel 26;


      b. indien van toepassing, een initiële beoordeling van het significante incident, met inbegrip van de ernst en de
      gevolgen ervan;


      c. indien van toepassing en beschikbaar, de indicatoren voor aantasting; en


      d. alle beschikbare informatie die het CSIRT en de bevoegde autoriteit in staat stelt om eventuele
      grensoverschrijdende gevolgen van het incident te bepalen.


      2 In afwijking van het eerste lid dient een essentiële entiteit of belangrijke entiteit die een vertrouwensdienst
      aanbiedt onverwijld of, indien dat niet mogelijk is, binnen 24 uur nadat zij kennis heeft gekregen van het
      significante incident een melding van het significante incident in bij haar CSIRT en haar bevoegde autoriteit als
      dat incident gevolgen heeft voor de verlening van haar vertrouwensdienst.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel27
  - number: '28'
    text: >-
      De essentiële entiteit of belangrijke entiteit dient in het kader van de melding, bedoeld in artikel 27, eerste
      lid, op verzoek van haar CSIRT of haar bevoegde autoriteit een tussentijds verslag in over relevante updates van
      de situatie.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel28
  - number: '29'
    text: >-
      1 De essentiële entiteit of belangrijke entiteit dient uiterlijk één maand na de melding, bedoeld in artikel 27,
      eerste lid, een eindverslag in bij haar CSIRT en haar bevoegde autoriteit waarin het volgende is opgenomen:


      a. een gedetailleerde beschrijving van het incident, de ernst en de gevolgen ervan;


      b. het soort bedreiging of de grondoorzaak die waarschijnlijk tot het incident heeft geleid;


      c. toegepaste en lopende risicobeperkende maatregelen; en


      d. in voorkomend geval, de grensoverschrijdende gevolgen van het incident.


      2 Indien het incident nog voortduurt op het moment dat het eindverslag had moeten worden ingediend, dient de
      essentiële entiteit of belangrijke entiteit op dat moment in plaats van een eindverslag een voortgangsverslag in
      waarin wordt ingegaan op de aspecten, genoemd in het eerste lid. Zij dient een eindverslag in binnen één maand
      nadat het incident is afgehandeld.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel29
  - number: '30'
    text: >-
      1 De essentiële entiteit of belangrijke entiteit stelt in voorkomend geval onverwijld de ontvangers van haar
      diensten in kennis van significante incidenten die een nadelige invloed kunnen hebben op de verlening van die
      diensten.


      2 De essentiële entiteit of belangrijke entiteit deelt de ontvangers van haar diensten, die mogelijkerwijs door
      een significante cyberdreiging in relatie tot het ontvangen van die diensten worden getroffen, onverwijld mee welke
      maatregelen die ontvangers kunnen nemen in reactie op die dreiging. Indien nodig stelt de entiteit die ontvangers
      ook in kennis van de desbetreffende significante cyberdreiging.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel30
  - number: '31'
    text: >-
      1 Indien sectorspecifieke rechtshandelingen van de Europese Unie voorschrijven dat een essentiële entiteit of
      belangrijke entiteit significante incidenten moet melden en indien deze eisen ten minste gelijkwaardig zijn aan
      die uit deze wet, zijn de verplichtingen uit de artikelen 25 tot en met 30 niet van toepassing op die specifieke
      entiteit.


      2 De eisen, bedoeld in het eerste lid, worden geacht gelijkwaardig te zijn wanneer de sectorspecifieke
      rechtshandeling voorziet in onmiddellijke toegang, in voorkomend geval automatisch en rechtstreeks, tot de
      meldingen van incidenten door het CSIRT, de bevoegde autoriteit of het centrale contactpunt, en wanneer de eisen
      voor het melden van significante incidenten ten minste een vergelijkbare uitwerking hebben als de eisen, bedoeld in
      de artikelen 25 tot en met 30, 36 en 39, eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel31
  - number: '32'
    text: >-
      1 Onze Minister die het aangaat kan bij regeling of besluit, in overeenstemming met Onze Minister, een essentiële
      entiteit of belangrijke entiteit die activiteiten uitvoert op het gebied van nationale veiligheid, openbare
      veiligheid, defensie of rechtshandhaving of die uitsluitend diensten verleent aan een overheidsinstantie als
      bedoeld in artikel 5, eerste lid, met betrekking tot die activiteiten of diensten ontheffen van de verplichtingen,
      bedoeld in de artikelen 25 tot en met 30.


      2 Het eerste lid is niet van toepassing wanneer een entiteit optreedt als verlener van vertrouwensdiensten die
      niet uitsluitend worden gebruikt binnen systemen die gesloten zijn als gevolg van een wettelijke regeling of een
      overeenkomst tussen een bepaalde groep deelnemers.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel32
  - number: '33'
    text: >-
      1 Onverminderd artikel 25 kan op vrijwillige basis een melding worden ingediend door:


      a. een essentiële entiteit of belangrijke entiteit bij haar CSIRT, over incidenten, bijna-incidenten en
      cyberdreigingen;


      b. eenieder bij een CSIRT, over significante incidenten als bedoeld in artikel 25, tweede lid, incidenten, bijna-
      incidenten en cyberdreigingen.


      2 Het CSIRT verwerkt de vrijwillige meldingen, bedoeld in het eerste lid, overeenkomstig de in artikel 36
      omschreven procedure. Het CSIRT kan daarbij voorrang geven aan de verwerking van verplichte meldingen als bedoeld
      in artikel 25 boven vrijwillige meldingen als bedoeld in het eerste lid.


      3 Het CSIRT kan de vrijwillige melding ter behandeling doorsturen naar een ander CSIRT.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel33
  - number: '34'
    text: >-
      1 Eenieder kan op vrijwillige basis een melding maken van een kwetsbaarheid bij de coördinator met het oog op een
      gecoördineerde bekendmaking van kwetsbaarheden.


      2 De melding kan anoniem worden gedaan.


      3 De coördinator met het oog op een gecoördineerde bekendmaking van kwetsbaarheden geeft opvolging aan de melding
      door het verrichten van de taken, genoemd in artikel 17, tweede lid, en waarborgt de anonimiteit van de natuurlijke
      persoon of rechtspersoon die de kwetsbaarheid meldt.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel34
  - number: '35'
    text: >-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter uitwerking van de artikelen 26
      tot en met 30, 33 en 34, waaronder regels over de gegevens waar de vroegtijdige waarschuwing, de melding, het
      tussentijds verslag en het eindverslag in ieder geval uit moeten bestaan en de wijze waarop dit geschiedt.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel35
  - number: '36'
    text: >-
      1 Het CSIRT verstrekt onverwijld en zo mogelijk binnen 24 uur na ontvangst van de vroegtijdige waarschuwing,
      bedoeld in artikel 26, een antwoord aan de meldende entiteit, met inbegrip van een eerste terugkoppeling over het
      significante incident en, op verzoek van de entiteit, richtsnoeren of operationeel advies voor de uitvoering van
      mogelijke risicobeperkende maatregelen.


      2 Het CSIRT verleent aanvullende technische ondersteuning indien de betrokken entiteit daar om verzoekt.


      3 Wanneer wordt vermoed dat het significante incident van criminele aard is, geeft het CSIRT ook richtsnoeren aan
      de meldende entiteit voor het melden van het significante incident aan de rechtshandhavingsinstanties.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel36
  - number: '37'
    text: >-
      Het CSIRT respectievelijk de bevoegde autoriteit kan, na raadpleging van de betrokken entiteit, het publiek
      informeren over een significant incident of de entiteit verplichten om dit te doen, wanneer:


      a. publieke bewustmaking nodig is om een significant incident te voorkomen;


      b. dat nodig is om een lopend incident te beheersen; of


      c. de bekendmaking van het significante incident anderszins in het algemeen belang is.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel37
  - number: '38'
    text: >-
      De bevoegde autoriteit kan de essentiële entiteit of belangrijke entiteit verplichten om de natuurlijke personen
      of rechtspersonen aan wie de entiteit diensten verleent of voor wie de entiteit activiteiten uitvoert en die
      mogelijkerwijs door een significante cyberdreiging worden beïnvloed, in kennis te stellen van de aard van de
      dreiging en alle mogelijke beschermings- of herstelmaatregelen die deze natuurlijke personen of rechtspersonen
      kunnen nemen als reactie op die dreiging.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel38
  - number: '39'
    text: >-
      1 Het CSIRT stelt het centrale contactpunt in kennis van de op grond van artikel 25 ontvangen meldingen van
      significante incidenten en, indien nodig, van de op grond van artikel 33, eerste lid, onderdeel a, ontvangen
      vrijwillige meldingen van incidenten, bijna-incidenten en cyberdreigingen. In geval van een grensoverschrijdend
      of sectoroverschrijdend significant incident, zorgt het CSIRT ervoor dat de relevante informatie die hierover is
      gemeld tijdig aan het centrale contactpunt wordt verstrekt.


      2 Als dat passend is en in elk geval als het aan het CSIRT gemelde incident, bijna-incident of cyberdreiging,
      bedoeld in het eerste lid, betrekking heeft op twee of meer lidstaten van de Europese Unie, stelt het centrale
      contactpunt de centrale contactpunten van de andere getroffen lidstaten en Enisa onverwijld daarvan in kennis. Die
      kennisgeving omvat, in geval van een significant incident, de informatie die overeenkomstig de artikelen 26 tot en
      met 29 is ontvangen. Daarbij beschermt het centrale contactpunt de beveiligingsbelangen en commerciële belangen van
      de entiteit en de vertrouwelijkheid van de verstrekte informatie.


      3 Op verzoek van het CSIRT of de bevoegde autoriteit stuurt het centrale contactpunt de op grond van de
      artikelen 25 en 33 ontvangen meldingen door naar de centrale contactpunten van de andere betrokken lidstaten van de
      Europese Unie.


      4 Als uit gegevens die het centrale contactpunt heeft ontvangen van een centraal contactpunt van een andere
      lidstaat van de Europese Unie blijkt dat een daar gemeld incident, bijna-incident of cyberdreiging gevolgen heeft
      voor de verlening van de diensten van een essentiële entiteit of belangrijke entiteit in Nederland, stelt het
      centrale contactpunt het betrokken CSIRT en de betrokken bevoegde autoriteit daarvan op de hoogte.


      5 Het centrale contactpunt dient elke drie maanden bij Enisa een samenvattend verslag in met geanonimiseerde en
      geaggregeerde gegevens over gemelde significante incidenten, incidenten, bijna-incidenten en cyberdreigingen.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel39
  - number: '40'
    text: >-
      1 De bevoegde autoriteit verstrekt de bevoegde autoriteit, bedoeld in artikel 8 van de Wet weerbaarheid kritieke
      entiteiten, informatie over een significant incident dat overeenkomstig artikel 25 is gemeld door een essentiële
      entiteit die tevens een kritieke entiteit is als bedoeld in de Wet weerbaarheid kritieke entiteiten.


      2 Het CSIRT verstrekt de bevoegde autoriteit, bedoeld in artikel 8 van de Wet weerbaarheid kritieke entiteiten,
      informatie over een incident, bijna-incident of cyberdreiging dat overeenkomstig artikel 33, eerste lid,
      onderdeel a, is gemeld door een essentiële entiteit die tevens een kritieke entiteit is als bedoeld in de Wet
      weerbaarheid kritieke entiteiten.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel40
  - number: '41'
    text: >-
      Indien het centrale contactpunt informatie van de bevoegde autoriteiten uit hoofde van de [Verordening (EU)
      2022/2554](32022R2554) ontvangt over incidenten met betrekking tot financiële entiteiten, kan hij deze informatie
      doorsturen naar een CSIRT of een bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel41
  - number: '42'
    text: >-
      1 Indien een hierna genoemde essentiële entiteit of belangrijke entiteit, als bedoeld in deze wet of in het
      nationale recht van een lidstaat van de Europese Unie waarin de NIS2-richtlijn is geïmplementeerd, niet in de
      Europese Unie is gevestigd, maar wel in Nederland diensten aanbiedt, en deze entiteit geen vertegenwoordiger
      heeft aangewezen in een lidstaat van de Europese Unie waar die diensten worden aangeboden, wijst deze entiteit
      een vertegenwoordiger aan die is gevestigd in een lidstaat van de Europese Unie waar deze entiteit die diensten
      aanbiedt:


      a. DNS-dienstverleners;


      b. registers voor topleveldomeinnamen;


      c. aanbieders van cloudcomputingdiensten;


      d. aanbieders van datacentrumdiensten;


      e. aanbieders van netwerken voor de levering van inhoud;


      f. aanbieders van beheerde diensten;


      g. aanbieders van beheerde beveiligingsdiensten;


      h. aanbieders van onlinemarktplaatsen;


      i. aanbieders van onlinezoekmachines;


      j. aanbieders van platforms voor socialenetwerkdiensten.


      2 Indien een entiteit die domeinnaamregistratiediensten verleent niet in de Europese Unie is gevestigd, maar wel
      in Nederland diensten aanbiedt, en deze entiteit geen vertegenwoordiger heeft aangewezen in een lidstaat van de
      Europese Unie waar die diensten worden aangeboden, wijst deze entiteit een vertegenwoordiger aan die is gevestigd
      in een lidstaat van de Europese Unie, waar deze genoemde entiteit die diensten aanbiedt.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel42
  - number: '43'
    text: >-
      1 In het belang van de goede uitvoering van deze wet beheert Onze Minister een nationaal register van essentiële
      entiteiten, belangrijke entiteiten en entiteiten die domeinnaamregistratiediensten verlenen.


      2 Onze Minister evalueert het nationale register en past het indien nodig aan, ten minste elke twee jaren, of vaker
      indien daartoe aanleiding bestaat.


      3 Onze Minister wijzigt, weigert of beëindigt in overeenstemming met de bevoegde autoriteit die het aangaat een in
      het eerste lid bedoelde registratie, indien de grond voor registratie is gewijzigd, vervallen of ontbreekt.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel43
  - number: '44'
    text: >-
      1 Een essentiële entiteit, belangrijke entiteit en een entiteit die domeinnaamregistratiediensten verleent
      verstrekt ten behoeve van de registratie in het nationale register, bedoeld in artikel 43, aan Onze Minister de
      volgende informatie middels het daarvoor opgezette mechanisme:


      a. de naam van de entiteit;


      b. het adres en de actuele contactgegevens van de entiteit, met inbegrip van e-mailadressen, IP-bereiken en
      telefoonnummers;


      c. indien van toepassing, de sectoren en subsectoren, bedoeld in bijlage 1 of 2 van deze wet, waartoe de entiteit
      behoort;


      d. indien van toepassing, een vermelding van de lidstaten van de Europese Unie waar de entiteit haar diensten als
      bedoeld in bijlage 1 of bijlage 2 van deze wet verleent;


      e. indien van toepassing, de deelname aan en terugtrekking uit een informatie-uitwisselingsregeling als bedoeld in
      artikel 62, tweede lid; en


      f. indien van toepassing, de andere bij of krachtens algemene maatregel van bestuur genoemde gegevens.


      2 De entiteiten, bedoeld in het eerste lid, melden Onze Minister onverwijld of in elk geval binnen twee weken na de
      datum van de wijziging, elke wijziging van de informatie die zij op grond van het eerste lid hebben verstrekt.


      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de informatieverstrekking,
      bedoeld in het eerste lid, waaronder regels over de wijze waarop de informatie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel44
  - number: '45'
    text: >-
      1 Onze Minister die het aangaat kan bij regeling of besluit, in overeenstemming met Onze Minister, een essentiële
      entiteit, een belangrijke entiteit of entiteit die domeinnaamregistratiediensten verleent ontheffen van de
      verplichtingen, bedoeld in artikel 44, indien de desbetreffende entiteit uitsluitend activiteiten verricht op het
      gebied van nationale veiligheid, openbare veiligheid, defensie of rechtshandhaving of uitsluitend diensten verleent
      aan een overheidsinstantie als bedoeld in artikel 5, eerste lid.


      2 Het eerste lid is niet van toepassing wanneer en voor zover een entiteit optreedt als verlener van
      vertrouwensdiensten die niet uitsluitend worden gebruikt binnen systemen die gesloten zijn als gevolg van een
      wettelijke regeling of een overeenkomst tussen een bepaalde groep deelnemers.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel45
  - number: '46'
    text: >-
      Onze Minister verleent de bevoegde autoriteit en het CSIRT toegang tot het nationale register, bedoeld in
      artikel 43, ten behoeve van de uitoefening van hun taken, voor zover de toegang ziet op informatie over de
      entiteiten waarvoor zij zijn aangewezen als de bevoegde autoriteit respectievelijk het CSIRT.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel46
  - number: '47'
    text: >-
      1 Ten behoeve van het register van Enisa, bedoeld in artikel 27, eerste lid, van de NIS2-richtlijn, verstrekken de
      volgende entiteiten aan het centrale contactpunt de informatie, bedoeld in het derde lid van dit artikel, middels
      het daarvoor opgezette mechanisme, voor zover zij een essentiële entiteit of belangrijke entiteit zijn:


      a. DNS-dienstverleners;


      b. registers voor topleveldomeinnamen;


      c. aanbieders van cloudcomputingdiensten;


      d. aanbieders van datacentrumdiensten;


      e. aanbieders van netwerken voor de levering van inhoud;


      f. aanbieders van beheerde diensten;


      g. aanbieders van beheerde beveiligingsdiensten;


      h. aanbieders van onlinemarktplaatsen;


      i. aanbieders van onlinezoekmachines;


      j. aanbieders van platforms voor socialenetwerkdiensten.


      2 Ten behoeve van het register van Enisa, bedoeld in artikel 27, eerste lid, van de NIS2-richtlijn, verstrekken
      entiteiten die domeinnaamregistratiediensten verlenen aan het centrale contactpunt de informatie, bedoeld in het
      derde lid van dit artikel, middels het daarvoor opgezette mechanisme.


      3 De entiteiten, bedoeld in het eerste en tweede lid, verstrekken de volgende informatie aan het centrale
      contactpunt:


      a. de naam van de entiteit;


      b. indien van toepassing, de sector, subsector en soort entiteit, bedoeld in bijlage 1 of 2 van deze wet;


      c. het adres van de hoofdvestiging van de entiteit en haar andere wettelijke vestigingen in de Europese Unie of,
      indien deze niet in de Europese Unie zijn gevestigd, van haar op grond van artikel 42 aangewezen vertegenwoordiger;


      d. actuele contactgegevens, met inbegrip van e-mailadressen en telefoonnummers van de entiteit en, indien van
      toepassing, haar op grond van artikel 42 aangewezen vertegenwoordiger;


      e. de lidstaten van de Europese Unie waar de entiteit haar diensten als bedoeld in bijlage 1 of 2 van deze wet of
      haar domeinnaamregistratiediensten verleent; en


      f. de IP-bereiken van de entiteit.


      4 De entiteiten, bedoeld in het eerste en tweede lid, verstrekken de informatie, bedoeld in het derde lid,
      uiterlijk op 17 januari 2025. Indien het eerste, tweede en derde lid na 17 januari 2025 in werking treden,
      verstrekken zij de informatie, bedoeld in het derde lid, binnen één maand na de inwerkingtreding van die leden.
      Indien een entiteit na de inwerkingtreding van het eerste, tweede en derde lid kwalificeert als een entiteit,
      bedoeld in het eerste en tweede lid, verstrekt die entiteit de informatie, bedoeld in het derde lid, binnen één
      maand nadat zij zich als zodanig kwalificeert.


      5 De entiteiten, bedoeld in het eerste en tweede lid, stellen het centrale contactpunt onverwijld of in elk geval
      binnen drie maanden na de datum waarop de wijziging van kracht is geworden, in kennis van wijzigingen van de
      gegevens, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel47
  - number: '48'
    text: >-
      1 Onze Minister die het aangaat kan bij regeling of besluit, in overeenstemming met Onze Minister, een entiteit
      als bedoeld in artikel 47, eerste en tweede lid, die uitsluitend activiteiten verricht op het gebied van nationale
      veiligheid, openbare veiligheid, defensie of rechtshandhaving of die uitsluitend diensten verleent aan een
      overheidsinstantie als bedoeld in artikel 5, eerste lid, ontheffen van de verplichtingen, bedoeld in artikel 47.


      2 Het eerste lid is niet van toepassing wanneer en voor zover een entiteit optreedt als verlener van
      vertrouwensdiensten die niet uitsluitend worden gebruikt binnen systemen die gesloten zijn als gevolg van een
      wettelijke regeling of een overeenkomst tussen een bepaalde groep deelnemers.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel48
  - number: '49'
    text: >-
      1 De registers voor topleveldomeinnamen en de entiteiten die domeinnaamregistratiediensten verlenen verzamelen
      nauwkeurige en volledige domeinnaamregistratiegegevens in een database en houden die gegevens bij.


      2 De database, bedoeld in het eerste lid, bevat de volgende gegevens:


      a. de domeinnaam;


      b. de datum van registratie;


      c. de naam, het e-mailadres en het telefoonnummer van de registrant; en


      d. het e-mailadres en het telefoonnummer van het contactpunt dat de domeinnaam beheert, indien deze verschillen van
      die van de registrant.


      3 De registers voor topleveldomeinnamen en de entiteiten die domeinnaamregistratiediensten verlenen stellen het
      beleid en de procedures vast, waaronder verificatieprocedures, om ervoor te zorgen dat de database, bedoeld in het
      eerste lid, juiste en volledige informatie bevat. Zij maken dat beleid en die procedures openbaar.


      4 De registers voor topleveldomeinnamen en de entiteiten die domeinnaamregistratiediensten verlenen maken de
      domeinnaamregistratiegegevens, die geen persoonsgegevens zijn, onverwijld na de registratie van een domeinnaam
      openbaar.


      5 De registers voor topleveldomeinnamen en de entiteiten die domeinnaamregistratiediensten verlenen werken samen om
      te voorkomen dat domeinnaamregistratiegegevens tweemaal worden verzameld.


      6 Bij regeling van Onze Minister van Economische Zaken kunnen nadere regels worden gesteld ten aanzien van het
      bepaalde in dit artikel.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel49
  - number: '50'
    text: >-
      1 Het register voor topleveldomeinnamen respectievelijk de entiteit die domeinnaamregistratiediensten verleent,
      verleent op een rechtmatig en naar behoren gemotiveerd verzoek van een legitieme partij die daar om verzoekt,
      toegang tot specifieke gegevens over de registratie van domeinnamen.


      2 De registers voor topleveldomeinnamen en de entiteiten die domeinnaamregistratiediensten verlenen beantwoorden
      een verzoek om toegang als bedoeld in het eerste lid onverwijld of, indien dat niet mogelijk is, binnen 72 uur na
      ontvangst van het verzoek.


      3 De registers voor topleveldomeinnamen en de entiteiten die domeinnaamregistratiediensten verlenen stellen het
      beleid en de procedures met betrekking tot de bekendmaking van de gegevens, bedoeld in het eerste lid, vast en
      maken dat beleid en die procedures openbaar.


      4 Bij regeling van Onze Minister van Economische Zaken kunnen nadere regels worden gesteld ten aanzien van het
      bepaalde in dit artikel.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel50
  - number: '51'
    text: >-
      1 De bevoegde autoriteiten, de CSIRT’s en het centrale contactpunt werken met elkaar samen voor de doeltreffende
      en doelmatige uitvoering van hun taken uit hoofde van deze wet en wisselen daartoe onderling alle daarvoor
      noodzakelijke gegevens uit, waaronder persoonsgegevens.


      2 De bevoegde autoriteiten, de CSIRT’s en het centrale contactpunt werken voor de doeltreffende en doelmatige
      uitvoering van hun taken uit hoofde van deze wet samen met de volgende instanties in Nederland en wisselen in het
      kader van die samenwerking alle daarvoor noodzakelijke gegevens uit, waaronder persoonsgegevens:


      a. de politie, het openbaar ministerie en de bijzondere opsporingsdiensten, genoemd in artikel 2 van de Wet op de
      bijzondere opsporingsdiensten;


      b. de Autoriteit persoonsgegevens;


      c. de nationale bevoegde autoriteiten, bedoeld in de [Verordening (EG) nr. 300/2008](32008R0300) en [Verordening
      (EU) 2018/1139](32018R1139);


      d. Onze Minister van Economische Zaken uit hoofde van de [Verordening (EU) nr. 910/2014](32014R0910);


      e. de bevoegde autoriteiten uit hoofde van de [Verordening (EU) 2022/2554](32022R2554);


      f. Onze Minister van Economische Zaken uit hoofde van de [Richtlijn (EU) 2018/1972](32018L1972);


      g. de bevoegde autoriteiten, bedoeld in artikel 8 van de Wet weerbaarheid kritieke entiteiten;


      h. de inlichtingen- en veiligheidsdiensten, bedoeld in de Wet op de inlichtingen- en veiligheidsdiensten 2017; en


      i. de bij of krachtens algemene maatregel van bestuur aangewezen autoriteiten.


      3 Indien Nederland wordt onderworpen aan een collegiale toetsing als bedoeld in artikel 19, eerste lid,
      van de NIS2-richtlijn, wisselen de bevoegde autoriteiten, de CSIRT’s en het centrale contactpunt met de
      cyberbeveiligingsdeskundigen, bedoeld in artikel 19, eerste lid, van de NIS2-richtlijn, de informatie uit die
      noodzakelijk is voor de door de cyberbeveiligingsdeskundigen uit te voeren collegiale toetsing.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel51
  - number: '52'
    text: >-
      De CSIRT’s werken voor de doeltreffende en doelmatige uitvoering van hun taken uit hoofde van deze wet samen met
      elkaar en met de CSIRT’s van de andere lidstaten van de Europese Unie en wisselen in het kader van die samenwerking
      alle daarvoor noodzakelijke gegevens uit, waaronder persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel52
  - number: '53'
    text: >-
      De CSIRT’s wisselen relevante informatie uit met essentiële entiteiten, belangrijke entiteiten, entiteiten die
      domeinnaamregistratiediensten verlenen en gemeenschappen van entiteiten als bedoeld in artikel 29 van de NIS2-
      richtlijn.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel53
  - number: '54'
    text: >-
      1 Een CSIRT kan een samenwerkingsrelatie tot stand brengen met een gelijkwaardig orgaan van een derde land. Binnen
      die samenwerkingsrelatie kan relevante informatie worden uitgewisseld, met inbegrip van persoonsgegevens. Een CSIRT
      gaat alleen over tot de uitwisseling van persoonsgegevens voor zover dat noodzakelijk is voor de doeltreffende en
      doelmatige uitvoering van haar taken uit hoofde van deze wet.


      2 Een CSIRT kan samenwerken met een gelijkwaardig orgaan van een derde land. Deze samenwerking kan bestaan uit het
      verlenen van bijstand op het gebied van cyberbeveiliging.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel54
  - number: '55'
    text: >-
      De bevoegde autoriteiten werken met elkaar samen voor de doeltreffende en doelmatige uitvoering van hun taken
      uit hoofde van deze wet en wisselen daartoe onderling alle daarvoor noodzakelijke gegevens uit, waaronder
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel55
  - number: '56'
    text: >-
      1 De bevoegde autoriteiten, bedoeld in artikel 15, en de bevoegde autoriteiten, bedoeld in artikel 8 van de Wet
      weerbaarheid kritieke entiteiten, werken met elkaar samen voor de doeltreffende en doelmatige uitvoering van
      hun taken uit hoofde van deze wet en de Wet weerbaarheid kritieke entiteiten. In het kader van die samenwerking
      wisselen zij alle daarvoor noodzakelijke gegevens uit, met inbegrip van persoonsgegevens, waaronder gegevens over:


      a. het aanmerken van entiteiten als kritieke entiteiten als bedoeld in de Wet weerbaarheid kritieke entiteiten;


      b. cyberbeveiligingsrisico’s, cyberdreigingen, cyberincidenten en niet-cybergerelateerde risico’s, dreigingen en
      incidenten die gevolgen hebben voor essentiële entiteiten die op grond van de Wet weerbaarheid kritieke entiteiten
      zijn aangemerkt als kritieke entiteiten; en


      c. de maatregelen die zij in reactie op dergelijke risico’s, dreigingen en incidenten hebben genomen.


      2 De betrokken bevoegde autoriteit, bedoeld in artikel 15, stelt de betrokken bevoegde autoriteit, bedoeld in
      artikel 8 van de Wet weerbaarheid kritieke entiteiten, op de hoogte van haar beoordeling van de naleving van het
      bepaalde bij of krachtens deze wet door een essentiële entiteit die tevens kritieke entiteit is als bedoeld in de
      Wet weerbaarheid kritieke entiteiten en van de uitoefening van toezichts- en handhavingsbevoegdheden om ervoor te
      zorgen dat die entiteit voldoet aan het bepaalde bij of krachtens deze wet.


      3 Het tweede lid is van overeenkomstige toepassing op de beoordeling van de naleving van en de uitoefening van
      toezichts- en handhavingsbevoegdheden met betrekking tot het bepaalde in de op grond van de artikelen 21, vijfde
      lid, en 23, elfde lid, van de NIS2-richtlijn vastgestelde uitvoeringshandelingen en de op grond van artikel 24,
      tweede lid, van de NIS2-richtlijn vastgestelde gedelegeerde handelingen, voor zover in die uitvoeringshandelingen
      of gedelegeerde handelingen is bepaald dat deze verbindend zijn en rechtstreeks toepasselijk zijn in elke lidstaat
      van de Europese Unie.


      4 De betrokken bevoegde autoriteit, bedoeld in artikel 15, kan de betrokken bevoegde autoriteit, bedoeld in
      artikel 8 van de Wet weerbaarheid kritieke entiteiten, verzoeken om toezichts- en handhavingsbevoegdheden uit te
      oefenen of uit te laten oefenen voor de naleving van het bepaalde bij of krachtens de Wet weerbaarheid kritieke
      entiteiten door een essentiële entiteit die tevens kritieke entiteit als bedoeld in de Wet weerbaarheid kritieke
      entiteiten is.


      5 Het vierde lid is van overeenkomstige toepassing op het toezicht op de naleving van en de handhaving van het
      bepaalde in de op grond van artikel 13, zesde lid, van de CER-richtlijn vastgestelde uitvoeringshandelingen, voor
      zover in die uitvoeringshandelingen is bepaald dat deze verbindend zijn en rechtstreeks toepasselijk zijn in elke
      lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel56
  - number: '57'
    text: >-
      1 De bevoegde autoriteiten, bedoeld in artikel 15, werken samen met de bevoegde autoriteiten, bedoeld in artikel 46
      van de [Verordening (EU) 2022/2554](32022R2554) en wisselen in het kader van die samenwerking alle daarvoor
      noodzakelijke gegevens uit, waaronder persoonsgegevens.


      2 De bevoegde autoriteit stelt het oversightforum dat is opgericht op grond van artikel 32, eerste lid, van de
      [Verordening (EU) 2022/2554](32022R2554) in kennis wanneer zij haar toezichts- en handhavingsbevoegdheden uitoefent
      om ervoor te zorgen dat een essentiële entiteit of belangrijke entiteit, die op grond van artikel 31 van de
      [Verordening (EU) 2022/2554](32022R2554) als kritieke derde aanbieder van ICT-diensten is aangewezen, voldoet aan
      het bepaalde bij of krachtens deze wet en het bepaalde in de op grond van de artikelen 21, vijfde lid, en 23, elfde
      lid, van de NIS2-richtlijn vastgestelde uitvoeringshandelingen en de op grond van artikel 24, tweede lid, van de
      NIS2-richtlijn vastgestelde gedelegeerde handelingen, voor zover in die uitvoeringshandelingen of gedelegeerde
      handelingen is bepaald dat deze verbindend zijn en rechtstreeks toepasselijk zijn in elke lidstaat van de Europese
      Unie.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel57
  - number: '58'
    text: >-
      1 De bevoegde autoriteiten werken samen met de Autoriteit persoonsgegevens bij de behandeling van incidenten die
      leiden tot inbreuken in verband met persoonsgegevens en wisselen in het kader van die samenwerking alle daarvoor
      noodzakelijke gegevens uit, waaronder persoonsgegevens.


      2 Wanneer de bevoegde autoriteit bij toezicht of handhaving er kennis van krijgt dat een overtreding van de
      artikelen 21, 25, 26, 27, 28, 29 of 30 door een essentiële entiteit of belangrijke entiteit een inbreuk in verband
      met persoonsgegevens als bedoeld in artikel 4, onderdeel 12, van de Algemene verordening gegevensbescherming
      kan inhouden, die op grond van artikel 33 van die verordening moet worden gemeld, stelt zij de Autoriteit
      persoonsgegevens dan wel de bevoegde toezichthoudende autoriteiten, bedoeld in de artikelen 55 en 56 van de
      Algemene verordening gegevensbescherming daarvan onverwijld in kennis.


      3 Indien de Autoriteit persoonsgegevens dan wel de bevoegde toezichthoudende autoriteiten, bedoeld in de
      artikelen 55 en 56 van de Algemene verordening gegevensbescherming een bestuurlijke boete opleggen op grond van
      artikel 58, tweede lid, onderdeel i, van de Algemene verordening gegevensbescherming, legt de bevoegde autoriteit
      geen bestuurlijke boete op op grond van de artikelen 80 en 87 voor een inbreuk als bedoeld in het tweede lid die
      voortvloeit uit dezelfde gedraging als die waarvoor de bestuurlijke boete op grond van artikel 58, tweede lid,
      onderdeel i, van de Algemene verordening gegevensbescherming is opgelegd.


      4 Wanneer de op grond van de Algemene verordening gegevensbescherming bevoegde toezichthoudende autoriteit in een
      andere lidstaat van de Europese Unie is gevestigd, stelt de bevoegde autoriteit de Autoriteit persoonsgegevens in
      kennis van de potentiële inbreuk in verband met persoonsgegevens, bedoeld in het tweede lid.


      5 Het tweede, derde en vierde lid zijn van overeenkomstige toepassing op een overtreding van het bepaalde in de op
      grond van de artikelen 21, vijfde lid, en 23, elfde lid, van de NIS2-richtlijn vastgestelde uitvoeringshandelingen
      en de op grond van artikel 24, tweede lid, van de NIS2-richtlijn vastgestelde gedelegeerde handelingen, voor zover
      in die uitvoeringshandelingen of gedelegeerde handelingen is bepaald dat deze verbindend zijn en rechtstreeks
      toepasselijk zijn in elke lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel58
  - number: '59'
    text: >-
      De bevoegde autoriteiten, Onze Minister van Economische Zaken uit hoofde van de [Verordening (EU) 910/2014]
      (32014R0910), de bevoegde autoriteiten, bedoeld in de [Verordening (EU) 2022/2554](32022R2554), en Onze Minister
      van Economische Zaken uit hoofde van de [Richtlijn (EU) 2018/1972](32018L1972) wisselen informatie uit over
      relevante incidenten en cyberdreigingen.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel59
  - number: '60'
    text: >-
      1 De bevoegde autoriteit werkt samen met de betrokken bevoegde autoriteit van een andere lidstaat van de Europese
      Unie en verleent op gemotiveerd verzoek van die autoriteit bijstand, wanneer een essentiële entiteit of belangrijke
      entiteit of een entiteit die domeinnaamregistratiediensten verleent, als bedoeld in deze wet of in het nationale
      recht van de betrokken lidstaat van de Europese Unie waarin de NIS2-richtlijn is geïmplementeerd:


      a. diensten verricht in meer dan één lidstaat; of


      b. diensten verricht in één of meer lidstaten en zijn netwerk- en informatiesystemen zich in één of meer andere
      lidstaten bevinden.


      2 Onverminderd het eerste lid kan de bevoegde autoriteit naar aanleiding van een gemotiveerd verzoek om bijstand
      van een bevoegde autoriteit van een andere lidstaat van de Europese Unie die ten aanzien van de betrokken entiteit
      krachtens artikel 26, eerste lid, onderdeel b, van de NIS2-richtlijn jurisdictie heeft, binnen de grenzen van dat
      verzoek, toezichts- en handhavingsmaatregelen nemen ten aanzien van entiteiten die domeinnaamregistratiediensten
      verlenen en de volgende essentiële entiteiten en belangrijke entiteiten, bedoeld in het nationale recht van de
      betrokken lidstaat van de Europese Unie waarin de NIS2-richtlijn is geïmplementeerd, wanneer die entiteit in
      Nederland diensten verleent of waarvan een netwerk- en informatiesysteem zich in Nederland bevindt:


      a. DNS-dienstverleners;


      b. registers voor topleveldomeinnamen;


      c. aanbieders van cloudcomputingdiensten;


      d. aanbieders van datacentrumdiensten


      e. aanbieders van netwerken voor de levering van inhoud;


      f. aanbieders van beheerde diensten;


      g. aanbieders van beheerde beveiligingsdiensten;


      h. de aanbieders van onlinemarktplaatsen;


      i. aanbieders van onlinezoekmachines;


      j. aanbieders van platforms voor socialenetwerkdiensten.


      3 Na de ontvangst van het gemotiveerde verzoek om bijstand, genoemd in het eerste en tweede lid, verleent de
      bevoegde autoriteit bijstand in verhouding tot haar eigen middelen. De bevoegde autoriteit wijst het verzoek alleen
      af als:


      a. zij niet bevoegd is om de verzochte bijstand te verlenen;


      b. de verzochte bijstand niet in verhouding staat tot de toezichthoudende taken van de bevoegde autoriteit; of


      c. het verzoek betrekking heeft op informatie of activiteiten inhoudt die, indien ze openbaar zouden worden gemaakt
      of zouden worden uitgevoerd, in strijd zouden zijn met de wezenlijke belangen van de nationale veiligheid, de
      openbare veiligheid of de defensie.


      4 Voordat de bevoegde autoriteit het verzoek afwijst, raadpleegt zij de betrokken bevoegde autoriteit van de andere
      lidstaat van de Europese Unie over de voorgenomen afwijzing en, wanneer de lidstaat daartoe verzoekt, de Europese
      Commissie en Enisa.


      5 In het kader van de samenwerking informeert de bevoegde autoriteit het centrale contactpunt over de door haar
      genomen toezichts- en handhavingsmaatregelen met betrekking tot een entiteit als bedoeld in het eerste lid, waarna
      het centrale contactpunt de betrokken bevoegde autoriteit van een andere lidstaat van de Europese Unie informeert
      over die genomen toezichts- en handhavingsmaatregelen.


      6 Het verzoek om bijstand, bedoeld in het eerste, tweede en derde lid, kan zien op het verstrekken van informatie
      en het nemen van toezichts- en handhavingsmaatregelen, met inbegrip van inspecties ter plaatse, toezicht elders
      en beveiligingsaudits.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel60
  - number: '61'
    text: >-
      1 De bevoegde autoriteit kan een bevoegde autoriteit van een andere lidstaat van de Europese Unie gemotiveerd
      verzoeken om bijstand, wanneer een essentiële entiteit of belangrijke entiteit of een entiteit die
      domeinnaamregistratiediensten verleent, als bedoeld in deze wet of in het nationale recht van de andere betrokken
      lidstaat van de Europese Unie waarin de NIS2-richtlijn is geïmplementeerd:


      a. diensten verricht in meer dan één lidstaat; of


      b. diensten verricht in één of meer lidstaten en haar netwerk- en informatiesystemen zich in één of meer andere
      lidstaten bevinden.


      2 Onverminderd het eerste lid kan de bevoegde autoriteit een bevoegde autoriteit van een andere lidstaat van de
      Europese Unie gemotiveerd verzoeken om bijstand ten aanzien van de volgende entiteiten, wanneer die entiteit haar
      hoofdvestiging heeft in die andere lidstaat:


      a. DNS-dienstverleners;


      b. registers voor topleveldomeinnamen;


      c. aanbieders van cloudcomputingdiensten;


      d. entiteiten die domeinnaamregistratiediensten verlenen;


      e. aanbieders van datacentrumdiensten;


      f. aanbieders van netwerken voor de levering van inhoud;


      g. aanbieders van beheerde diensten;


      h. aanbieders van beheerde beveiligingsdiensten;


      i. de aanbieders van onlinemarktplaatsen;


      j. aanbieders van onlinezoekmachines;


      k. aanbieders van platforms voor socialenetwerkdiensten.


      3 Het verzoek om bijstand, bedoeld in het eerste en tweede lid, kan zien op het verstrekken van informatie en
      het nemen van toezichts- en handhavingsmaatregelen, met inbegrip van inspecties ter plaatse, toezicht elders en
      beveiligingsaudits.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel61
  - number: '62'
    text: >-
      1 Essentiële entiteiten, belangrijke entiteiten, entiteiten die domeinnaamregistratiediensten verlenen en andere
      entiteiten die niet de hiervoor genoemde entiteiten betreffen, kunnen op vrijwillige basis relevante informatie
      over cyberbeveiliging uitwisselen om incidenten te voorkomen, te detecteren, erop te reageren of ervan te
      herstellen of de gevolgen ervan te beperken en om het cyberbeveiligingsniveau te verhogen.


      2 De informatie-uitwisseling, bedoeld in het eerste lid, kan plaatsvinden binnen gemeenschappen van entiteiten en,
      indien van toepassing, hun leveranciers en dienstverleners op basis van informatie-uitwisselingsregelingen op het
      gebied van cyberbeveiliging met betrekking tot de potentieel gevoelige aard van de uitgewisselde informatie.


      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van het bepaalde in
      artikel 29, derde lid, van de NIS2-richtlijn.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel62
  - number: '63'
    text: >-
      De bevoegde autoriteit, het centrale contactpunt, het CSIRT en Onze Minister zijn de verwerkingsverantwoordelijken
      voor de verwerking van persoonsgegevens ten behoeve van de taken die op grond van deze wet aan hen zijn toegewezen.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel63
  - number: '64'
    text: >-
      1 De verwerking van persoonsgegevens waaruit ras of etnische afkomst, politieke opvattingen, religieuze of
      levensbeschouwelijke overtuigingen, of het lidmaatschap van een vakbond blijken, of gegevens over gezondheid, of
      gegevens met betrekking tot iemands seksueel gedrag of seksuele gerichtheid door de bevoegde autoriteit geschiedt
      alleen voor zover de verwerking van deze gegevens noodzakelijk is voor de uitoefening van haar taken op grond van
      deze wet.


      2 De verwerking van persoonsgegevens waaruit ras of etnische afkomst, politieke opvattingen, religieuze of
      levensbeschouwelijke overtuigingen, of het lidmaatschap van een vakbond blijken, of gegevens over gezondheid, of
      gegevens met betrekking tot iemands seksueel gedrag of seksuele gerichtheid door het CSIRT geschiedt alleen voor
      zover de verwerking van deze gegevens noodzakelijk is voor de uitoefening van haar taken op grond van artikel 16,
      tweede lid, onderdelen a tot en met e.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel64
  - number: '65'
    text: >-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de periode gedurende welke de
      persoonsgegevens die bij of krachtens deze wet zijn verwerkt, worden bewaard.


      2 De persoonsgegevens, bedoeld in artikel 64, eerste lid, die door de bevoegde autoriteit worden verwerkt worden
      niet langer bewaard dan noodzakelijk is ter uitvoering van haar taken op grond van deze wet, doch uiterlijk binnen
      60 maanden na de eerste verwerking verwijderd.


      3 De persoonsgegevens, bedoeld in artikel 64, tweede lid, die door het CSIRT worden verwerkt worden niet langer
      bewaard dan noodzakelijk is ter uitvoering van haar taken op grond van deze wet, doch uiterlijk binnen 12 maanden
      na de eerste verwerking verwijderd.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel65
  - number: '66'
    text: >-
      1 De bevoegde autoriteit, het centrale contactpunt, het CSIRT en Onze Minister kunnen in het kader van de
      uitoefening van hun taken op grond van deze wet vertrouwelijke gegevens verstrekken, doch uitsluitend voor zover:


      a. dat noodzakelijk is ter uitvoering van hun taken uit hoofde van deze wet;


      b. de verstrekking beperkt blijft tot die vertrouwelijke gegevens die relevant zijn voor de ontvangende partij en
      verstrekking evenredig is aan het doel van die verstrekking;


      c. de vertrouwelijkheid van die vertrouwelijke gegevens is gewaarborgd; en


      d. de veiligheids- en commerciële belangen van de betrokken entiteit worden beschermd.


      2 De Wet open overheid is niet van toepassing op vertrouwelijke gegevens als bedoeld in het eerste lid, behalve
      voor zover die gegevens milieu-informatie inhouden als bedoeld in artikel 19.1a van de Wet milieubeheer. De eerste
      volzin geldt ook als de gegevens bij een ander overheidsorgaan berusten na verstrekking op grond van dit artikel.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel66
  - number: '67'
    text: >-
      Het bepaalde bij of krachtens deze wet omvat niet de verstrekking van informatie waarvan de bekendmaking strijdig
      is met de wezenlijke belangen van nationale veiligheid, openbare veiligheid of defensie.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel67
  - number: '68'
    text: >-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet en het bepaalde in de op grond van
      de artikelen 21, vijfde lid, en 23, elfde lid, van de NIS2-richtlijn vastgestelde uitvoeringshandelingen en de op
      grond van artikel 24, tweede lid, van de NIS2-richtlijn vastgestelde gedelegeerde handelingen, voor zover in die
      uitvoeringshandelingen of gedelegeerde handelingen is bepaald dat deze verbindend zijn en rechtstreeks toepasselijk
      zijn in elke lidstaat van de Europese Unie, zijn belast: de bij besluit van de bevoegde autoriteit aangewezen
      ambtenaren.


      2 De ambtenaren, bedoeld in het eerste lid, zijn tevens belast met het verlenen van bijstand als bedoeld in
      artikel 60 aan een bevoegde autoriteit van een andere lidstaat van de Europese Unie.


      3 Ten behoeve van het verlenen van de bijstand, bedoeld in het tweede lid, kunnen de toezichthouders hun
      toezichthoudende bevoegdheden toepassen.


      4 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel68
  - number: '69'
    text: >-
      Onverminderd artikel 3:4, tweede lid, van de Algemene wet bestuursrecht houdt de bevoegde autoriteit bij de
      toepassing van de artikelen 70, 72, eerste lid, onderdeel c, 73 tot en met 78, 80, 83, eerste lid, onderdeel c, 84
      tot en met 87 en 89 tot en met 93 rekening met de omstandigheden van elk afzonderlijk geval, alsmede:


      a. de ernst van de overtreding en het belang van de geschonden bepalingen, waarbij onder meer het volgende in ieder
      geval een ernstige overtreding vormt:


      1°. herhaalde overtredingen;


      2°. het niet melden of niet verhelpen van significante incidenten;


      3°. het niet verhelpen van tekortkomingen naar aanleiding van bindende aanwijzingen van de bevoegde autoriteit;


      4°. het belemmeren van audits of monitoringsactiviteiten waartoe de bevoegde autoriteit opdracht heeft gegeven naar
      aanleiding van de vaststelling van een overtreding;


      5°. het verstrekken van valse of zeer onnauwkeurige informatie met betrekking tot de verplichtingen, bedoeld in de
      artikelen 21 en 25 tot en met 30;


      b. de duur van de overtreding;


      c. eventuele relevante eerdere overtredingen door de betrokken entiteit;


      d. elke veroorzaakte materiële of immateriële schade, met inbegrip van elke financiële of economische schade,
      effecten op andere diensten en het aantal getroffen gebruikers;


      e. opzet of nalatigheid van de overtreder;


      f. door de entiteit genomen maatregelen om de materiële of immateriële schade te voorkomen of te beperken;


      g. de naleving van goedgekeurde gedragscodes of goedgekeurde certificeringsmechanismen; en


      h. de mate waarin de overtreder meewerkt met de bevoegde autoriteiten.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel69
  - number: '70'
    text: >-
      1 De bevoegde autoriteit kan voor een bepaalde periode een controlefunctionaris aanwijzen bij een essentiële
      entiteit.


      2 De controlefunctionaris is een onafhankelijke deskundige zijnde een natuurlijk persoon en heeft tot taak:


      a. het monitoren van de naleving van het bepaalde bij of krachtens de artikelen 21 en 25 tot en met 30 en het
      bepaalde in de op grond van de artikelen 21, vijfde lid, en 23, elfde lid, van de NIS2-richtlijn vastgestelde
      uitvoeringshandelingen en de op grond van artikel 24, tweede lid, van de NIS2-richtlijn vastgestelde gedelegeerde
      handelingen, voor zover in die uitvoeringshandelingen of gedelegeerde handelingen is bepaald dat deze verbindend
      zijn en rechtstreeks toepasselijk zijn in elke lidstaat van de Europese Unie, door de betrokken essentiële
      entiteit; en


      b. het informeren van de bevoegde autoriteit en het bestuur van de betrokken essentiële entiteit over de naleving
      van het bepaalde bij of krachtens de artikelen 21 en 25 tot en met 30 en het bepaalde in de op grond van de
      artikelen 21, vijfde lid, en 23, elfde lid, van de NIS2-richtlijn vastgestelde uitvoeringshandelingen en de op
      grond van artikel 24, tweede lid, van de NIS2-richtlijn vastgestelde gedelegeerde handelingen, voor zover in die
      uitvoeringshandelingen of gedelegeerde handelingen is bepaald dat deze verbindend zijn en rechtstreeks toepasselijk
      zijn in elke lidstaat van de Europese Unie, door de betrokken essentiële entiteit.


      3 De essentiële entiteit draagt de kosten van de controlefunctionaris.


      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het bepaalde in het
      eerste en tweede lid, waaronder de vereisten die gelden voor de aanwijzing van de controlefunctionaris.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel70
  - number: '71'
    text: >-
      1 De bevoegde autoriteit kan een beveiligingsscan op basis van objectieve, niet-discriminerende, eerlijke en
      transparante risicobeoordelingscriteria uitvoeren of door een onafhankelijke en gekwalificeerde deskundige laten
      uitvoeren bij een essentiële entiteit.


      2 De bevoegde autoriteit draagt de kosten van de beveiligingsscan.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel71
  - number: '72'
    text: >-
      1 De bevoegde autoriteit kan een essentiële entiteit verplichten om:


      a. een onafhankelijke en gekwalificeerde deskundige te laten onderzoeken of de entiteit voldoet aan het bepaalde
      bij of krachtens deze wet en het bepaalde in de op grond van de artikelen 21, vijfde lid, en 23, elfde lid, van de
      NIS2-richtlijn vastgestelde uitvoeringshandelingen en de op grond van artikel 24, tweede lid, van de NIS2-richtlijn
      vastgestelde gedelegeerde handelingen, voor zover in die uitvoeringshandelingen of gedelegeerde handelingen is
      bepaald dat deze verbindend zijn en rechtstreeks toepasselijk zijn in elke lidstaat van de Europese Unie;


      b. de resultaten van dat onderzoek binnen een bij het besluit gestelde redelijke termijn te verstrekken aan de
      bevoegde autoriteit; of


      c. de aanbevelingen naar aanleiding van het onderzoek binnen een redelijke termijn uit te voeren.


      2 Het onderzoek is gebaseerd op de door de bevoegde autoriteit of de betrokken essentiële entiteit verrichte
      risicobeoordelingen of op andere beschikbare risicogerelateerde informatie.


      3 Het onderzoek wordt uitgevoerd op een door de bevoegde autoriteit voorgeschreven wijze.


      4 De essentiële entiteit draagt de kosten van het onderzoek, tenzij de kosten naar het oordeel van de bevoegde
      autoriteit redelijkerwijs moeten worden gedragen door de bevoegde autoriteit.


      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste tot en met
      derde lid.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel72
  - number: '73'
    text: >-
      De bevoegde autoriteit kan een essentiële entiteit verplichten om onderdelen van een door de entiteit begane
      overtreding van het bepaalde bij of krachtens deze wet en het bepaalde in de op grond van de artikelen 21, vijfde
      lid, en 23, elfde lid, van de NIS2-richtlijn vastgestelde uitvoeringshandelingen en de op grond van artikel 24,
      tweede lid, van de NIS2-richtlijn vastgestelde gedelegeerde handelingen, voor zover in die uitvoeringshandelingen
      of gedelegeerde handelingen is bepaald dat deze verbindend zijn en rechtstreeks toepasselijk zijn in elke lidstaat
      van de Europese Unie, openbaar te maken, op een door de bevoegde autoriteit bepaalde wijze.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel73
  - number: '74'
    text: >-
      De bevoegde autoriteit kan een essentiële entiteit een bindende aanwijzing geven om binnen een daarbij gestelde
      redelijke termijn de daarin omschreven handelingen te verrichten of de daarin omschreven maatregelen te nemen ter
      naleving van het bepaalde bij of krachtens deze wet en het bepaalde in de op grond van de artikelen 21, vijfde lid,
      en 23, elfde lid, van de NIS2-richtlijn vastgestelde uitvoeringshandelingen en de op grond van artikel 24, tweede
      lid, van de NIS2-richtlijn vastgestelde gedelegeerde handelingen, voor zover in die uitvoeringshandelingen of
      gedelegeerde handelingen is bepaald dat deze verbindend zijn en rechtstreeks toepasselijk zijn in elke lidstaat van
      de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel74
  - number: '75'
    text: >-
      De bevoegde autoriteit is bevoegd tot oplegging van een last onder bestuursdwang aan een essentiële entiteit ter
      handhaving van het bepaalde bij of krachtens deze wet en het bepaalde in de op grond van de artikelen 21, vijfde
      lid, en 23, elfde lid, van de NIS2-richtlijn vastgestelde uitvoeringshandelingen en de op grond van artikel 24,
      tweede lid, van de NIS2-richtlijn vastgestelde gedelegeerde handelingen, voor zover in die uitvoeringshandelingen
      of gedelegeerde handelingen is bepaald dat deze verbindend zijn en rechtstreeks toepasselijk zijn in elke lidstaat
      van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel75
  - number: '76'
    text: >-
      1 De bevoegde autoriteit kan na een overtreding door een essentiële entiteit van het bepaalde bij of krachtens
      deze wet en het bepaalde in de op grond van de artikelen 21, vijfde lid, en 23, elfde lid, van de NIS2-richtlijn
      vastgestelde uitvoeringshandelingen en de op grond van artikel 24, tweede lid, van de NIS2-richtlijn vastgestelde
      gedelegeerde handelingen, voor zover in die uitvoeringshandelingen of gedelegeerde handelingen is bepaald dat deze
      verbindend zijn en rechtstreeks toepasselijk zijn in elke lidstaat van de Europese Unie, een einddatum bepalen
      waarop de entiteit de daarbij genoemde maatregelen moet hebben genomen om de overtreding te beëindigen of waarop de
      entiteit aan de daarbij nader omschreven eisen moet hebben voldaan ter beëindiging van de overtreding.


      2 De bevoegde autoriteit kan het besluit, bedoeld in het eerste lid, alleen nemen:


      a. nadat zij alle in het derde lid genoemde maatregelen heeft opgelegd aan de betrokken entiteit en deze
      maatregelen niet ertoe hebben geleid dat de overtreding is beëindigd; of


      b. nadat zij één of meer van de in het derde lid genoemde maatregelen heeft opgelegd aan de betrokken entiteit, de
      opgelegde maatregel of maatregelen niet ertoe hebben geleid dat de overtreding is beëindigd en het opleggen van de
      andere in het derde lid genoemde maatregel of maatregelen naar het oordeel van de bevoegde autoriteit niet ertoe
      zullen leiden dat de betrokken entiteit de overtreding beëindigt.


      3 De maatregelen, bedoeld in het tweede lid, zijn:


      a. een waarschuwing van de bevoegde autoriteit aan de betrokken entiteit over een overtreding van het bepaalde
      bij of krachtens deze wet en het bepaalde in de op grond van de artikelen 21, vijfde lid, en 23, elfde lid, van de
      NIS2-richtlijn vastgestelde uitvoeringshandelingen en de op grond van artikel 24, tweede lid, van de NIS2-richtlijn
      vastgestelde gedelegeerde handelingen, voor zover in die uitvoeringshandelingen of gedelegeerde handelingen is
      bepaald dat deze verbindend zijn en rechtstreeks toepasselijk zijn in elke lidstaat van de Europese Unie;


      b. een verplichting van de bevoegde autoriteit aan de betrokken entiteit over de uitvoering van de aanbevelingen
      naar aanleiding van het onderzoek als bedoeld in artikel 72, eerste lid, onderdeel c;


      c. een aanwijzing als bedoeld in artikel 74;


      d. een last onder bestuursdwang als bedoeld in artikel 75;


      e. een last onder bestuursdwang als bedoeld in artikel 75 in samenhang met artikel 5:32, eerste lid, van de
      Algemene wet bestuursrecht.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel76
  - number: '77'
    text: >-
      Indien de essentiële entiteit niet uiterlijk op de daarbij bepaalde einddatum heeft voldaan aan het besluit,
      bedoeld in artikel 76, kan de bevoegde autoriteit de instantie of organisatie die een certificering of vergunning
      heeft afgegeven verzoeken die certificering of vergunning tijdelijk op te schorten met betrekking tot alle of een
      deel van de relevante door de essentiële entiteit verleende diensten of verrichte activiteiten, zolang de entiteit
      niet voldoet aan het besluit.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel77
  - number: '78'
    text: >-
      1 Indien de essentiële entiteit niet uiterlijk op de daarbij bepaalde einddatum heeft voldaan aan het besluit,
      bedoeld in artikel 76, kan de bevoegde autoriteit de burgerlijke rechter van de rechtbank van het arrondissement
      waarbinnen de vestigingsplaats van de bevoegde autoriteit is gelegen verzoeken om één of meer leden van het bestuur
      van de betrokken essentiële entiteit te schorsen, zolang de entiteit niet voldoet aan het besluit.


      2 De rechtbank regelt zo nodig alle overige gevolgen van de door haar uitgesproken schorsing.


      3 De griffier van de rechtbank, of in geval van hoger beroep, van het gerechtshof, biedt een afschrift van de
      onherroepelijke uitspraak waarin een schorsing is opgelegd met bekwame spoed aan de Kamer van Koophandel aan, die
      terstond de schorsing in het Handelsregister opneemt.


      4 Zodra is voldaan aan het besluit, bedoeld in artikel 76, verzoekt de bevoegde autoriteit de Kamer van Koophandel
      de opname van de schorsing uit het Handelsregister te verwijderen.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel78
  - number: '79'
    text: De artikelen 76, 77 en 78 zijn niet van toepassing op overheidsinstanties.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel79
  - number: '80'
    text: >-
      1 De bevoegde autoriteit kan in geval van overtreding van het bepaalde bij of krachtens deze wet en het
      bepaalde in de op grond van de artikelen 21, vijfde lid, en 23, elfde lid, van de NIS2-richtlijn vastgestelde
      uitvoeringshandelingen en de op grond van artikel 24, tweede lid, van de NIS2-richtlijn vastgestelde gedelegeerde
      handelingen, voor zover in die uitvoeringshandelingen of gedelegeerde handelingen is bepaald dat deze verbindend
      zijn en rechtstreeks toepasselijk zijn in elke lidstaat van de Europese Unie, aan een essentiële entiteit een
      bestuurlijke boete opleggen:


      a. tezamen met of na het geven van een waarschuwing aan de betrokken entiteit over de overtreding; of


      b. tezamen met of na de toepassing van de artikelen 38, 70, 72, eerste lid, onderdeel c, 73, 74, 75, 76, 77 of 78.


      2 De bevoegde autoriteit kan tevens aan een essentiële entiteit een bestuurlijke boete opleggen in geval van
      overtreding van artikel 5:20, eerste lid, van de Algemene wet bestuursrecht.


      3 De boete bedraagt ten hoogste:


      a. in geval van overtreding van het bepaalde bij of krachtens de artikelen 21, 21a en 25 tot en met 30 en het
      bepaalde in de op grond van de artikelen 21, vijfde lid, en 23, elfde lid, van de NIS2-richtlijn vastgestelde
      uitvoeringshandelingen en de op grond van artikel 24, tweede lid, van de NIS2-richtlijn vastgestelde gedelegeerde
      handelingen, voor zover in die uitvoeringshandelingen of gedelegeerde handelingen is bepaald dat deze verbindend
      zijn en rechtstreeks toepasselijk zijn in elke lidstaat van de Europese Unie: € 10.000.000,– of 2% van de totale
      wereldwijde jaaromzet in het voorgaande boekjaar van de onderneming waartoe de essentiële entiteit behoort, indien
      het laatstbedoelde bedrag hoger is;


      b. in geval van een andere overtreding: € 1.000.000,–.


      4 De werking van het besluit tot oplegging van de boete wordt opgeschort totdat het besluit onherroepelijk is.


      5 Verzet schorst de tenuitvoerlegging van een dwangbevel dat strekt tot invordering van de boete.


      6 Artikel 184 van het Wetboek van Strafrecht is niet van toepassing op de overtreding, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel80
  - number: '81'
    text: >-
      De artikelen 82 tot en met 87 zijn alleen van toepassing voor zover de bevoegde autoriteit het bewijs, de
      aanwijzing of informatie heeft van een mogelijke overtreding door een belangrijke entiteit van het bepaalde bij of
      krachtens deze wet en het bepaalde in de op grond van de artikelen 21, vijfde lid, en 23, elfde lid, van de NIS2-
      richtlijn vastgestelde uitvoeringshandelingen en de op grond van artikel 24, tweede lid, van de NIS2-richtlijn
      vastgestelde gedelegeerde handelingen, voor zover in die uitvoeringshandelingen of gedelegeerde handelingen is
      bepaald dat deze verbindend zijn en rechtstreeks toepasselijk zijn in elke lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel81
  - number: '82'
    text: >-
      1 De bevoegde autoriteit kan een beveiligingsscan op basis van objectieve, niet-discriminerende, eerlijke en
      transparante risicobeoordelingscriteria uitvoeren of door een onafhankelijke deskundige laten uitvoeren bij een
      belangrijke entiteit.


      2 De bevoegde autoriteit draagt de kosten van de beveiligingsscan.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel82
  - number: '83'
    text: >-
      1 De bevoegde autoriteit kan een belangrijke entiteit verplichten om:


      a. een onafhankelijke en gekwalificeerde deskundige te laten onderzoeken of de entiteit voldoet aan het bepaalde
      bij of krachtens deze wet en het bepaalde in de op grond van de artikelen 21, vijfde lid, en 23, elfde lid, van de
      NIS2-richtlijn vastgestelde uitvoeringshandelingen en de op grond van artikel 24, tweede lid, van de NIS2-richtlijn
      vastgestelde gedelegeerde handelingen, voor zover in die uitvoeringshandelingen of gedelegeerde handelingen is
      bepaald dat deze verbindend zijn en rechtstreeks toepasselijk zijn in elke lidstaat van de Europese Unie;


      b. de resultaten van dat onderzoek binnen een bij het besluit gestelde redelijke termijn te verstrekken aan de
      bevoegde autoriteit; of


      c. de aanbevelingen naar aanleiding van het onderzoek binnen een redelijke termijn uit te voeren.


      2 Het onderzoek is gebaseerd op de door de bevoegde autoriteit of de betrokken belangrijke entiteit verrichte
      risicobeoordelingen of op andere beschikbare risicogerelateerde informatie.


      3 Het onderzoek wordt uitgevoerd op een door de bevoegde autoriteit voorgeschreven wijze.


      4 De belangrijke entiteit draagt de kosten van het onderzoek, tenzij de kosten naar het oordeel van de bevoegde
      autoriteit redelijkerwijs moeten worden gedragen door de bevoegde autoriteit.


      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste tot en met
      derde lid.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel83
  - number: '84'
    text: >-
      De bevoegde autoriteit kan een belangrijke entiteit verplichten om onderdelen van een door de entiteit begane
      overtreding van het bepaalde bij of krachtens deze wet en het bepaalde in de op grond van de artikelen 21, vijfde
      lid, en 23, elfde lid, van de NIS2-richtlijn vastgestelde uitvoeringshandelingen en de op grond van artikel 24,
      tweede lid, van de NIS2-richtlijn vastgestelde gedelegeerde handelingen, voor zover in die uitvoeringshandelingen
      of gedelegeerde handelingen is bepaald dat deze verbindend zijn en rechtstreeks toepasselijk zijn in elke lidstaat
      van de Europese Unie, openbaar te maken, op een door de bevoegde autoriteit bepaalde wijze.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel84
  - number: '85'
    text: >-
      De bevoegde autoriteit kan een belangrijke entiteit een bindende aanwijzing geven om binnen een daarbij gestelde
      redelijke termijn de daarin omschreven handelingen te verrichten of de daarin omschreven maatregelen te nemen ter
      naleving van het bepaalde bij of krachtens deze wet en het bepaalde in de op grond van de artikelen 21, vijfde lid,
      en 23, elfde lid, van de NIS2-richtlijn vastgestelde uitvoeringshandelingen en de op grond van artikel 24, tweede
      lid, van de NIS2-richtlijn vastgestelde gedelegeerde handelingen, voor zover in die uitvoeringshandelingen of
      gedelegeerde handelingen is bepaald dat deze verbindend zijn en rechtstreeks toepasselijk zijn in elke lidstaat van
      de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel85
  - number: '86'
    text: >-
      De bevoegde autoriteit is bevoegd tot oplegging van een last onder bestuursdwang aan een belangrijke entiteit ter
      handhaving van het bepaalde bij of krachtens deze wet en het bepaalde in de op grond van de artikelen 21, vijfde
      lid, en 23, elfde lid, van de NIS2-richtlijn vastgestelde uitvoeringshandelingen en de op grond van artikel 24,
      tweede lid, van de NIS2-richtlijn vastgestelde gedelegeerde handelingen, voor zover in die uitvoeringshandelingen
      of gedelegeerde handelingen is bepaald dat deze verbindend zijn en rechtstreeks toepasselijk zijn in elke lidstaat
      van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel86
  - number: '87'
    text: >-
      1 De bevoegde autoriteit kan in geval van overtreding van het bepaalde bij of krachtens deze wet en het
      bepaalde in de op grond van de artikelen 21, vijfde lid, en 23, elfde lid, van de NIS2-richtlijn vastgestelde
      uitvoeringshandelingen en de op grond van artikel 24, tweede lid, van de NIS2-richtlijn vastgestelde gedelegeerde
      handelingen, voor zover in die uitvoeringshandelingen of gedelegeerde handelingen is bepaald dat deze verbindend
      zijn en rechtstreeks toepasselijk zijn in elke lidstaat van de Europese Unie, aan een belangrijke entiteit een
      bestuurlijke boete opleggen:


      a. tezamen met of na het geven van een waarschuwing aan de betrokken entiteit over de overtreding; of


      b. tezamen met of na de toepassing van de artikelen 38, 83, eerste lid, onderdeel c, 84, 85 of 86.


      2 De bevoegde autoriteit kan tevens aan een belangrijke entiteit een bestuurlijke boete opleggen in geval van
      overtreding van artikel 5:20, eerste lid, van de Algemene wet bestuursrecht.


      3 De boete bedraagt ten hoogste:


      a. in geval van overtreding van het bepaalde bij of krachtens de artikelen 21, 21a en 25 tot en met 30 en het
      bepaalde in de op grond van de artikelen 21, vijfde lid, en 23, elfde lid, van de NIS2-richtlijn vastgestelde
      uitvoeringshandelingen en de op grond van artikel 24, tweede lid, van de NIS2-richtlijn vastgestelde gedelegeerde
      handelingen, voor zover in die uitvoeringshandelingen of gedelegeerde handelingen is bepaald dat deze verbindend
      zijn en rechtstreeks toepasselijk zijn in elke lidstaat van de Europese Unie: € 7.000.000,– of 1,4% van de totale
      wereldwijde jaaromzet in het voorgaande boekjaar van de onderneming waartoe de belangrijke entiteit behoort, indien
      het laatstbedoelde bedrag hoger is;


      b. in geval van een andere overtreding: € 1.000.000,–.


      4 De werking van het besluit tot oplegging van de boete wordt opgeschort totdat het besluit onherroepelijk is.


      5 Verzet schorst de tenuitvoerlegging van een dwangbevel dat strekt tot invordering van de boete.


      6 Artikel 184 van het Wetboek van Strafrecht is niet van toepassing op de overtreding, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel87
  - number: '88'
    text: >-
      De artikelen 89 tot en met 91 zijn alleen van toepassing op de entiteit die domeinnaamregistratiediensten verleent,
      indien zij op grond van deze wet niet tevens essentiële entiteit of belangrijke entiteit is.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel88
  - number: '89'
    text: >-
      De bevoegde autoriteit kan een entiteit die domeinnaamregistratiediensten verleent, een bindende aanwijzing geven
      om binnen een daarbij gestelde redelijke termijn de daarin omschreven handelingen te verrichten ter naleving van
      de artikelen 42, 44, 47, 49 en 50, indien zij niet voldoet aan het bepaalde bij of krachtens de hiervoor genoemde
      artikelen.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel89
  - number: '90'
    text: >-
      De bevoegde autoriteit kan een entiteit die domeinnaamregistratiediensten verleent een last onder dwangsom opleggen
      in geval van overtreding van het bepaalde bij of krachtens de artikelen 42, 44, 47, 49 en 50.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel90
  - number: '91'
    text: >-
      1 De bevoegde autoriteit kan een entiteit die domeinnaamregistratiediensten verleent een bestuurlijke boete
      opleggen in geval van:


      a. overtreding van het bepaalde bij of krachtens de artikelen 42, 44, 47, 49 en 50;


      b. overtreding van artikel 5:20, eerste lid, van de Algemene wet bestuursrecht.


      2 De boete, bedoeld in het eerste lid, bedraagt ten hoogste € 1.000.000,–.


      3 De werking van het besluit tot oplegging van de boete wordt opgeschort totdat het besluit onherroepelijk is.


      4 Verzet schorst de tenuitvoerlegging van een dwangbevel dat strekt tot invordering van de boete.


      5 Artikel 184 van het Wetboek van Strafrecht is niet van toepassing op de overtreding, bedoeld in het eerste lid,
      onderdeel b.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel91
  - number: '92'
    text: >-
      De bevoegde autoriteit kan een lid van het bestuur van een essentiële entiteit of belangrijke entiteit een last
      onder dwangsom opleggen in geval van overtreding van het bepaalde bij of krachtens artikel 24, tweede tot en met
      zesde lid.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel92
  - number: '93'
    text: >-
      1 De bevoegde autoriteit kan een lid van het bestuur van een essentiële entiteit of belangrijke entiteit een
      bestuurlijke boete opleggen in geval van:


      a. overtreding van het bepaalde bij of krachtens artikel 24, tweede tot en met zesde lid;


      b. overtreding van artikel 5:20, eerste lid, van de Algemene wet bestuursrecht.


      2 De boete, bedoeld in het eerste lid, bedraagt ten hoogste € 25.000,–.


      3 De werking van het besluit tot oplegging van de boete wordt opgeschort totdat het besluit onherroepelijk is.


      4 Verzet schorst de tenuitvoerlegging van een dwangbevel dat strekt tot invordering van de boete.


      5 Artikel 184 van het Wetboek van Strafrecht is niet van toepassing op de overtreding, bedoeld in het eerste lid,
      onderdeel b.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel93
  - number: '94'
    text: >-
      1 Onze Minister zendt binnen achttien maanden na de inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag waarin de resultaten van een invoeringstoets over de uitvoerbaarheid, de handhaafbaarheid, de regeldruk, de
      samenloop en de werkbaarheid van deze wet in de praktijk zijn opgenomen.


      2 Onze Minister zendt binnen twee jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk, en vervolgens elke drie jaar.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel94
  - number: '95'
    text: >-
      1 Indien voor de inwerkingtreding van artikel 106 een besluit is genomen op grond van de Wet beveiliging netwerk-
      en informatiesystemen, blijft het oude recht van toepassing tot het tijdstip waarop:


      a. het besluit onherroepelijk is geworden en volledig is uitgevoerd of ten uitvoer is gelegd;


      b. het besluit is ingetrokken of is komen te vervallen; of


      c. als het besluit gaat om de oplegging van een last onder dwangsom:


      1°. de last volledig is uitgevoerd;


      2°. de dwangsom volledig is verbeurd en betaald; of


      3°. de last is opgeheven.


      2 Indien voor de inwerkingtreding van artikel 106 een melding als bedoeld in artikel 10 of 13 van de Wet
      beveiliging netwerk- en informatiesystemen is gedaan, en artikel 25 met ingang van de dag van de inwerkingtreding
      van laatstgenoemd artikel van toepassing is op de melder, wordt de op grond van de Wet beveiliging netwerk- en
      informatiesystemen gedane melding aangemerkt als een vroegtijdige waarschuwing van een significant incident als
      bedoeld in artikel 26. Indien de melding ziet op een inbreuk op de beveiliging van netwerk- en informatiesystemen
      die aanzienlijke gevolgen kan hebben voor de continuïteit van de door de melder verleende dienst als bedoeld in
      artikel 10, eerste lid, onderdeel b, van de Wet beveiliging netwerk- en informatiesystemen, zendt Onze Minister de
      melding door aan de bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel95
  - number: '96'
    text: >-
      1 De organisaties, niet zijnde essentiële entiteiten of belangrijke entiteiten, die op de dag voorafgaand aan de
      inwerkingtreding van artikel 106 vitale aanbieder dan wel andere aanbieder die onderdeel is van de Rijksoverheid
      zijn als bedoeld in artikel 3, eerste lid, van de Wet beveiliging netwerk- en informatiesystemen, zoals die wet
      luidde op de dag voorafgaand aan de inwerkingtreding van artikel 106, hebben recht op:


      a. bijstand bij het treffen van maatregelen om de continuïteit van hun diensten te waarborgen of te herstellen door
      Onze Minister of een andere in afwijking hiervan bij of krachtens algemene maatregel van bestuur hiervoor aan te
      wijzen instantie; en


      b. informatie en advies over dreigingen en incidenten met betrekking tot hun netwerk- en informatiesystemen van
      Onze Minister of een andere in afwijking hiervan bij of krachtens algemene maatregel van bestuur hiervoor aan te
      wijzen instantie.


      2 Onze Minister onderscheidenlijk de andere instantie, bedoeld in het eerste lid, verricht ten behoeve van het
      uitvoeren van de in het eerste lid bedoelde taken analyses en technisch onderzoek, naar aanleiding van de in het
      eerste lid genoemde dreigingen en incidenten of aanwijzingen daarvoor, niet zijnde onderzoek naar personen of
      organisaties die voor die dreigingen en incidenten verantwoordelijk zijn of die daar anderszins aan bijdragen of
      hebben bijgedragen.


      3 Artikel 16, tweede lid, aanhef en onderdeel e, en derde lid, is van overeenkomstige toepassing, met dien
      verstande dat onder «CSIRT» wordt verstaan: Onze Minister of de andere instantie, bedoeld in het eerste lid.


      4 Onze Minister onderscheidenlijk de andere instantie, bedoeld in het eerste lid, is de
      verwerkingsverantwoordelijke voor de verwerking van persoonsgegevens ten behoeve van de in het eerste tot en met
      derde lid bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel96
  - number: '97'
    text: >-
      Het bepaalde bij of krachtens de artikelen 21 en 24 is van toepassing op de op grond van artikel 11 aangewezen
      essentiële entiteit en de op grond van artikel 13 aangewezen belangrijke entiteit vanaf 36 maanden na de
      aanwijzing.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel97
  - number: '98'
    text: >-
      Het nationale register, genoemd in artikel 43, komt uiterlijk één maand na de inwerkingtreding van artikel 43 tot
      stand.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel98
  - number: '104'
    text: >-
      Een wijziging van een bepaling uit de NIS2-richtlijn waarnaar in deze wet is verwezen geldt voor de toepassing van
      de bepaling uit deze wet waarin de verwijzing is opgenomen met ingang van de dag waarop aan de betrokken wijziging
      uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een
      ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel104
  - number: '106'
    text: De Wet beveiliging netwerk- en informatiesystemen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel106
  - number: '107'
    text: >-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel107
  - number: '108'
    text: 'Deze wet wordt aangehaald als: Cyberbeveiligingswet.'
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel108
