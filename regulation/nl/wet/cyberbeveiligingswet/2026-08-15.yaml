    text: >-
      Onze Minister is het centrale contactpunt en heeft in die hoedanigheid de volgende taken:


      a. het zorgen voor grensoverschrijdende samenwerking van de autoriteiten van Nederland met de relevante
      autoriteiten van andere lidstaten van de Europese Unie, de Europese Commissie en Enisa, door middel van het
      vervullen van een verbindingsfunctie;


      b. het zorgen voor sectoroverschrijdende samenwerking tussen de bevoegde autoriteiten binnen Nederland, door middel
      van het vervullen van een verbindingsfunctie; en


      c. de overige in deze wet genoemde taken.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel14
