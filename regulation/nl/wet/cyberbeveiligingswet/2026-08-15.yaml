  - number: '8'
    text: >-
      1 De volgende entiteiten zijn essentiële entiteiten:


      a. gekwalificeerde verleners van vertrouwensdiensten;


      b. aanbieders van registers voor topleveldomeinnamen;


      c. DNS-dienstverleners;


      d. aanbieders van openbare elektronische communicatienetwerken, die in aanmerking komen als middelgrote onderneming
      uit hoofde van artikel 2 van de bijlage bij Aanbeveling 2003/361/EG;


      e. aanbieders van openbare elektronische communicatiediensten, die in aanmerking komen als middelgrote onderneming
      uit hoofde van artikel 2 van de bijlage bij Aanbeveling 2003/361/EG;


      f. andere entiteiten, genoemd in bijlage 1 van deze wet, die de in artikel 2, eerste lid, van de bijlage bij
      Aanbeveling 2003/361/EG bedoelde drempel voor middelgrote ondernemingen overschrijden;


      g. de ministeries, met inbegrip van de daartoe behorende dienstonderdelen doch met uitzondering van de
      inlichtingen- en veiligheidsdiensten, bedoeld in de Wet op de inlichtingen- en veiligheidsdiensten 2017, en
      zelfstandige bestuursorganen van de centrale overheid, voor zover deze zelfstandige bestuursorganen kwalificeren
      als overheidsinstantie;


      h. provincies, gemeenten en waterschappen, alsmede openbare lichamen, gemeenschappelijke organen en
      bedrijfsvoeringsorganisaties als bedoeld in artikel 8, eerste, tweede, onderscheidenlijk derde lid, van
      de Wet gemeenschappelijke regelingen, voor zover deze openbare lichamen, gemeenschappelijke organen en
      bedrijfsvoeringsorganisaties kwalificeren als overheidsinstantie;


      i. kritieke entiteiten als bedoeld in artikel 6, eerste lid, van de Wet weerbaarheid kritieke entiteiten.


      2 Ten aanzien van het bepaalde in het eerste lid, onderdelen d tot en met f, is artikel 3, vierde lid, van de
      bijlage bij Aanbeveling 2003/361/EG niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel8
  - number: '9'
    text: >-
      1 Bij regeling of besluit van Onze Minister die het aangaat, na overleg met Onze Minister, wordt een in bijlage 1
      of bijlage 2 van deze wet genoemde entiteit aangewezen als essentiële entiteit, op grond van de toepasselijkheid
      van één of meer van de volgende criteria:


      a. de entiteit is in Nederland de enige aanbieder van een dienst die essentieel is voor de instandhouding van
      kritieke maatschappelijke of economische activiteiten;


      b. verstoring van de door de entiteit verleende dienst kan aanzienlijke gevolgen hebben voor de openbare
      veiligheid, de openbare beveiliging of de volksgezondheid;


      c. verstoring van de door de entiteit verleende dienst kan een aanzienlijk systeemrisico met zich brengen, met name
      voor sectoren waar een dergelijke verstoring een grensoverschrijdende impact kan hebben;


      d. de entiteit is kritiek vanwege het specifieke belang ervan op nationaal of regionaal niveau voor de specifieke
      sector of het specifieke type dienst, of voor andere onderling afhankelijke sectoren in Nederland.


      2 Onze Minister die het aangaat trekt de aanwijzing in, indien de entiteit niet langer voldoet aan één of meer van
      de criteria, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel9
