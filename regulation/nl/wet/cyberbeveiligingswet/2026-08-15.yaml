preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben dat het gelet op Richtlijn (EU) 2022/2555 van het Europees Parlement en
    de Raad van 14 december 2022 betreffende maatregelen voor een hoog gezamenlijk niveau van cyberbeveiliging in de
    Unie, tot wijziging van Verordening (EU) nr. 910/2014 en Richtlijn (EU) 2018/1972 en tot intrekking van Richtlijn
    (EU) 2016/1148(PbEU 2022, L 333) noodzakelijk is om wettelijke bepalingen vast te stellen ter bevordering van de
    digitale veiligheid;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      - *Aanbeveling 2003/361/EG:* Aanbeveling 2003/361/EG van de Commissie van 6 mei 2003 betreffende de definitie van
      kleine, middelgrote en micro-ondernemingen (PbEU 2003, L 124);
      - *aanbieder van beheerde beveiligingsdiensten:* een aanbieder van beheerde diensten die bijstand biedt of verleent
      voor activiteiten die verband houden met risicobeheer op het gebied van cyberbeveiliging;
      - *aanbieder van beheerde diensten:* een entiteit die diensten verleent die verband houden met de installatie, het
      beheer, de exploitatie of het onderhoud van ICT-producten, -netwerken, -infrastructuur, -toepassingen of andere
      netwerk- en informatiesystemen, via bijstand of actieve administratie bij de klant ter plaatse of op afstand;
      - *belangrijke entiteit:* een entiteit als bedoeld in artikel 12 of 13;
      - *beveiliging van netwerk- en informatiesystemen:* het vermogen van netwerk- en informatiesystemen om op een
      bepaald niveau van betrouwbaarheid weerstand te bieden aan elke gebeurtenis die de beschikbaarheid, authenticiteit,
      integriteit of vertrouwelijkheid van opgeslagen, verzonden of verwerkte gegevens of van de diensten die door of via
      deze netwerk- en informatiesystemen worden aangeboden, in gevaar kan brengen;
      - *beveiligingsscan:* technisch onderzoek van netwerk- en informatiesystemen om inzicht te krijgen in
      kwetsbaarheden en risico’s van deze systemen;
      - *bevoegde autoriteit:* de bevoegde autoriteit, bedoeld in artikel 8, eerste lid, van de NIS2-richtlijn en bedoeld
      in artikel 15;
      - *bevoegde autoriteit van een andere lidstaat van de Europese Unie:* een bevoegde autoriteit van een andere
      lidstaat van de Europese Unie als bedoeld in artikel 8, eerste lid, van de NIS2-richtlijn en die als zodanig is
      aangewezen in het nationale recht van die andere lidstaat;
      - *bijna-incident:* een gebeurtenis die de beschikbaarheid, authenticiteit, integriteit of vertrouwelijkheid van
      opgeslagen, verzonden of verwerkte gegevens of van de diensten die worden aangeboden door of toegankelijk zijn via
      netwerk- en informatiesystemen, in gevaar had kunnen brengen, maar die met succes is voorkomen of zich niet heeft
      voorgedaan;
      - *centraal contactpunt:* het centrale contactpunt, bedoeld in artikel 8, derde lid, van de NIS2-richtlijn en
      bedoeld in artikel 14;
      - *centraal contactpunt van een andere lidstaat van de Europese Unie:* het centrale contactpunt van een andere
      lidstaat van de Europese Unie als bedoeld in artikel 8, derde lid, van de NIS2-richtlijn en dat als zodanig is
      aangewezen in het nationale recht van die andere lidstaat;
      - *CER-richtlijn:* [Richtlijn (EU) 2022/2557](32022L2557) van het Europees Parlement en de Raad van 14 december
      2022 betreffende de weerbaarheid van kritieke entiteiten en tot intrekking van [Richtlijn 2008/114/EG](32008L0114)
      van de Raad (PbEU 2022, L 333);
      - *cloudcomputingdienst:* een digitale dienst die administratie op aanvraag en brede toegang op afstand tot
      een schaalbare en elastische pool van deelbare computerbronnen mogelijk maakt, ook wanneer die bronnen over
      verschillende locaties verspreid zijn;
      - *coördinator met het oog op een gecoördineerde bekendmaking van kwetsbaarheden:* de coördinator met het oog op
      een gecoördineerde bekendmaking van kwetsbaarheden, bedoeld in artikel 12, eerste lid, van de NIS2-richtlijn en
      bedoeld in artikel 17;
      - *CSIRT:* een Computer security incident response team, bedoeld in artikel 10 van de NIS2-richtlijn en bedoeld
      in artikel 16;
      - *CSIRT van een andere lidstaat van de Europese Unie:* een CSIRT van een andere lidstaat van de Europese Unie als
      bedoeld in artikel 10 van de NIS2-richtlijn en dat als zodanig is aangewezen in het nationale recht van die andere
      lidstaat;
      - *CSIRT-netwerk:* het netwerk van CSIRT’s, genoemd in artikel 15 van de NIS2-richtlijn;
      - *cyberbeveiliging:* de activiteiten die nodig zijn om netwerk- en informatiesystemen, de gebruikers van
      dergelijke systemen, en andere personen die getroffen worden door cyberdreigingen, te beschermen;
      - *cyberdreiging:* elke potentiële omstandigheid, gebeurtenis of actie die netwerk- en informatiesystemen, de
      gebruikers van dergelijke systemen en andere personen kan schaden, verstoren of op andere wijze negatief kan
      beïnvloeden;
      - *datacentrumdienst:* een dienst die structuren of groepen van structuren omvat die bestemd zijn voor de
      gecentraliseerde accommodatie, de interconnectie en de exploitatie van IT en netwerkapparatuur die diensten op het
      gebied van gegevensopslag, -verwerking en -transport aanbiedt, samen met alle faciliteiten en infrastructuren voor
      energiedistributie en omgevingscontrole;
      - *digitale dienst:* elke dienst van de informatiemaatschappij, dat wil zeggen elke dienst die gewoonlijk
      tegen vergoeding, langs elektronische weg, op afstand en op individueel verzoek van een afnemer van diensten
      wordt verricht, waarbij onder «op afstand» wordt verstaan: een dienst die wordt geleverd zonder dat de partijen
      gelijktijdig aanwezig zijn, onder «langs elektronische weg» wordt verstaan: een dienst die wordt verzonden en
      ontvangen via elektronische apparatuur voor de verwerking (met inbegrip van digitale compressie) en de opslag van
      gegevens, en die geheel via draden, radio, optische middelen of andere elektromagnetische middelen wordt verzonden,
      doorgeleid en ontvangen, en onder «op individueel verzoek van een afnemer van diensten» wordt verstaan: een dienst
      die op individueel verzoek via de transmissie van gegevens wordt geleverd;
      - *DNS-dienstverlener:* een entiteit die openbare recursieve domeinnaamomzettingsdiensten voor
      interneteindgebruikers verleent, of die gezaghebbende domeinnaamomzettingsdiensten voor gebruik door derden, met
      uitzondering van root-naamservers, verleent;
      - *domeinnaamsysteem (DNS):* een hiërarchisch gedistribueerd naamgevingssysteem dat het mogelijk maakt
      internetdiensten en -bronnen te identificeren, waardoor eindgebruikersapparaten in staat worden gesteld routing- en
      connectiviteitsdiensten op het internet te gebruiken om die diensten en bronnen te bereiken;
      - *elektronisch communicatienetwerk:* hetgeen hieronder wordt verstaan in artikel 1.1 van de Telecommunicatiewet;
      - *elektronische communicatiedienst:* hetgeen hieronder wordt verstaan in artikel 1.1 van de Telecommunicatiewet;
      - *Enisa:* het Agentschap van de Europese Unie voor cyberbeveiliging, genoemd in titel II van [Verordening
      (EU) 2019/881](32019R0881) van het Europees Parlement en de Raad van 17 april 2019 inzake Enisa (het
      Agentschap van de Europese Unie voor cyberbeveiliging), en inzake de certificering van de cyberbeveiliging van
      informatie- en communicatietechnologie en tot intrekking van [Verordening (EU) nr. 526/2013](32013R0526) (de
      cyberbeveiligingsverordening) (PbEU 2019, L 151);
      - *entiteit:* een natuurlijk persoon, een rechtspersoon, een overheidsinstantie, een maatschap als bedoeld in
      artikel 1655 van boek 7A van het Burgerlijk Wetboek, een vennootschap onder firma als bedoeld in artikel 16 van het
      Wetboek van Koophandel en een commanditaire vennootschap als bedoeld in artikel 19 van het Wetboek van Koophandel,
      alsmede een samenwerkingsverband naar buitenlands recht dat met één van deze rechtsvormen vergelijkbaar is;
      - *entiteit die domeinnaamregistratiediensten verleent:* een registrator of een agent die namens registrators
      optreedt, zoals een aanbieder van privacy- of proxy-registratiediensten of wederverkoper;
      - *essentiële entiteit:* een entiteit als bedoeld in de artikelen 8, 9, 10 of 11;
      - *gekwalificeerde verlener van vertrouwensdiensten:* een verlener van vertrouwensdiensten die één of meerdere
      gekwalificeerde vertrouwensdiensten verleent en van het toezichthoudende orgaan, bedoeld in artikel 46 ter van de
      [Verordening (EU) nr. 910/2014](32014R0910), de status van gekwalificeerde heeft gekregen;
      - *gekwalificeerde vertrouwensdienst:* een vertrouwensdienst die voldoet aan de toepasselijke eisen zoals
      vastgelegd in [Verordening (EU) nr. 910/2014](32014R0910);
      - *hoofdvestiging:* de hoofdvestiging van een entiteit, bedoeld in artikel 26, tweede lid, van de NIS2-richtlijn;
      - *ICT-dienst:* een dienst die volledig of hoofdzakelijk bestaat in de verzending, opslag, opvraging of verwerking
      van gegevens door middel van netwerk- en informatiesystemen;
      - *ICT-product:* een element of groep elementen van een netwerk- of informatiesysteem;
      - *incident:* een gebeurtenis die de beschikbaarheid, authenticiteit, integriteit of vertrouwelijkheid van
      opgeslagen, verzonden of verwerkte gegevens of van de diensten die worden aangeboden door of toegankelijk zijn via
      netwerk- en informatiesystemen, in gevaar brengt;
      - *internetknooppunt:* een netwerkfaciliteit die de interconnectie van meer dan twee onafhankelijke netwerken
      (autonome systemen) mogelijk maakt, voornamelijk ter vergemakkelijking van de uitwisseling van internetverkeer,
      die alleen interconnectie voor autonome systemen biedt en die niet vereist dat het internetverkeer dat tussen een
      paar deelnemende autonome systemen verloopt, via een derde autonoom systeem verloopt, noch dat verkeer wijzigt of
      anderszins verstoort;
      - *kwetsbaarheid:* een zwakheid, vatbaarheid of gebrek van ICT-producten of ICT-diensten die door een cyberdreiging
      kan worden uitgebuit;
      - *netwerk voor de levering van inhoud:* een netwerk van geografisch verspreide servers met het oog op een hoge
      beschikbaarheid, toegankelijkheid of snelle levering van digitale inhoud en diensten aan internetgebruikers ten
      behoeve van aanbieders van inhoud en diensten;
      - *netwerk- en informatiesysteem:* a. een elektronisch communicatienetwerk; of b. elk apparaat of elke groep van
      onderling verbonden of verwante apparaten, waarvan er een of meer, op grond van een programma, een automatische
      verwerking van digitale gegevens uitvoeren; of c. digitale gegevens die worden opgeslagen, verwerkt, opgehaald
      of verzonden met behulp van de in punten a. en b. bedoelde elementen met het oog op de werking, het gebruik, de
      bescherming en het onderhoud ervan;
      - *NIS2-richtlijn:* [Richtlijn (EU) 2022/2555](32022L2555) van het Europees Parlement en de Raad van 14 december
      2022 betreffende maatregelen voor een hoog gezamenlijk niveau van cyberbeveiliging in de Unie, tot wijziging
      van [Verordening (EU) nr. 910/2014](32014R0910) en [Richtlijn (EU) 2018/1972](32018L1972) en tot intrekking van
      [Richtlijn (EU) 2016/1148](32016L1148)*(PbEU* 2022, L 333);
      - *norm:* een door een erkende normalisatie-instelling vastgestelde technische specificatie voor herhaalde of
      voortdurende toepassing, waarvan de naleving niet verplicht is en die tot een van de volgende categorieën behoort:
      a. «internationale norm»: een door een internationale normalisatie-instelling vastgestelde norm; b. «Europese
      norm»: een door een Europese normalisatieorganisatie vastgestelde norm; c. «geharmoniseerde norm»: een Europese
      norm die op verzoek van de Commissie is vastgesteld met het oog op de toepassing van harmonisatiewetgeving van de
      Unie; d. «nationale norm»: een door een nationale normalisatie-instelling vastgestelde norm;
      - *onderzoeksorganisatie:* een entiteit die als hoofddoel heeft het verrichten van toegepast onderzoek of
      experimentele ontwikkeling met het oog op de exploitatie van de resultaten van dat onderzoek voor commerciële
      doeleinden, met uitsluiting van onderwijsinstellingen;
      - *onlinemarktplaats:* een dienst die gebruikmaakt van software, waaronder een website, een deel van een website of
      een door of namens een handelaar beheerde applicatie, en die consumenten in staat stelt op afstand overeenkomsten
      te sluiten met andere handelaren of consumenten;
      - *onlinezoekmachine:* een digitale dienst die het gebruikers mogelijk maakt zoekvragen in te voeren om zoekacties
      uit te voeren op in beginsel alle websites of alle websites in een bepaalde taal, op basis van een zoekvraag over
      eender welk onderwerp in de vorm van een trefwoord, een gesproken opdracht, een frase of andere input, en die
      resultaten in eender welk formaat oplevert met informatie over de opgevraagde inhoud;
      - *Onze Minister:* Onze Minister van Justitie en Veiligheid;
      - *openbaar elektronisch communicatienetwerk:* hetgeen hieronder wordt verstaan in artikel 1.1 van de
      Telecommunicatiewet;
      - *overheidsinstantie:* een entiteit die overeenkomstig het Nederlands recht als zodanig in Nederland is
      erkend, met uitzondering van de rechtbanken, de gerechtshoven, de Hoge Raad, het College van Beroep voor het
      bedrijfsleven, de Centrale Raad van Beroep, de Afdeling bestuursrechtspraak van de Raad van State, de beide Kamers
      der Staten-Generaal en De Nederlandsche Bank N.V., en die aan de volgende criteria voldoet: a. zij is opgericht
      om te voorzien in behoeften van algemeen belang en heeft geen industrieel of commercieel karakter; b. zij heeft
      rechtspersoonlijkheid of mag volgens de wet namens een andere entiteit met rechtspersoonlijkheid optreden; c.
      zij wordt grotendeels gefinancierd door de staat, regionale autoriteiten of andere publiekrechtelijke organen,
      is onderworpen aan beheerstoezicht door die autoriteiten of organen, of heeft een bestuurs-, leidinggevend of
      toezichthoudend orgaan waarvan de leden voor meer dan de helft door de staat, regionale autoriteiten of andere
      publiekrechtelijke organen worden benoemd; en d. zij heeft de bevoegdheid om ten aanzien van natuurlijke personen
      of rechtspersonen administratieve of regelgevende besluiten te nemen die van invloed zijn op hun rechten op het
      grensoverschrijdende verkeer van personen, goederen, diensten of kapitaal;
      - *platform voor sociale netwerkdiensten:* een platform dat eindgebruikers in staat stelt zich met elkaar te
      verbinden, te delen, te ontdekken en met elkaar te communiceren via meerdere apparaten, met name via chats, posts,
      video’s en aanbevelingen;
      - *register voor topleveldomeinnamen:* een entiteit waaraan een specifieke topleveldomeinnaam is gedelegeerd en
      die verantwoordelijk is voor het beheer van de topleveldomeinnaam, met inbegrip van de registratie van domeinnamen
      onder de topleveldomeinnaam en de technische exploitatie van de topleveldomeinnaam, met inbegrip van de exploitatie
      van de naamservers, het onderhoud van de databases en de verdeling van de zonebestanden van de topleveldomeinnaam
      over de naamservers, ongeacht of die activiteiten door de entiteit zelf worden uitgevoerd of worden uitbesteed,
      maar met uitzondering van situaties waarin topleveldomeinnamen uitsluitend voor eigen gebruik worden aangewend door
      een register;
      - *Richtlijn (EU) 2018/1972:* [Richtlijn (EU) 2018/1972](32018L1972) van het Europees Parlement en de Raad van
      11 december 2018 tot vaststelling van het Europees wetboek voor elektronische communicatie *(PbEU* 2018, L 321);
      - *risico:* de mogelijkheid van verlies of verstoring als gevolg van een incident, wat wordt uitgedrukt als een
      combinatie van de omvang van een dergelijk verlies of verstoring en de waarschijnlijkheid dat het incident zich
      voordoet;
      - *root-naamserver:* een gezaghebbende naamserver voor de root-zone van het domeinnaamsysteem (DNS) van het
      internet;
      - *samenwerkingsgroep:* de samenwerkingsgroep, bedoeld in artikel 14 van de NIS2-richtlijn;
      - *significant incident:* een incident als bedoeld in artikel 25, tweede lid;
      - *significante cyberdreiging:* een cyberdreiging waarvan op basis van de technische kenmerken kan worden
      aangenomen dat zij ernstige gevolgen kan hebben voor de netwerk- en informatiesystemen van een entiteit of de
      gebruikers van de diensten van de entiteit door het veroorzaken van aanzienlijke materiële of immateriële schade;
      - *verlener van vertrouwensdiensten:* een natuurlijke persoon of rechtspersoon die een of meer vertrouwensdiensten
      verleent als een gekwalificeerde of als een niet-gekwalificeerde verlener van vertrouwensdiensten;
      - *Verordening (EG) nr. 300/2008:* [Verordening (EG) nr. 300/2008](32008R0300) van het Europees Parlement en de
      Raad van 11 maart 2008 inzake gemeenschappelijke regels op het gebied van de beveiliging van de burgerluchtvaart en
      tot intrekking van [Verordening (EG) nr. 2320/2002](32002R2320)*(PbEU* 2008, L 97);
      - *Verordening (EU) nr. 910/2014:* [Verordening (EU) nr. 910/2014](32014R0910) van het Europees Parlement en de
      Raad van 23 juli 2014 betreffende elektronische identificatie en vertrouwensdiensten voor elektronische transacties
      in de interne markt en tot intrekking van [Richtlijn 1999/93/EG](31999L0093)*(PbEU* 2014, L 257), zoals laatstelijk
      gewijzigd bij [Verordening (EU) 2024/1183](32024R1183) van het Europees Parlement en de Raad van 11 april 2024 tot
      wijziging van [Verordening (EU) nr. 910/2014](32014R0910), wat betreft de vaststelling van het Europees kader voor
      digitale identiteit *(PbEU* 2024, L 1183);
      - *Verordening (EU) 2018/1139:* [Verordening (EU) 2018/1139](32018R1139) van het Europees Parlement en de Raad
      van 4 juli 2018 inzake gemeenschappelijke regels op het gebied van burgerluchtvaart en tot oprichting van een
      Agentschap van de Europese Unie voor de veiligheid van de luchtvaart, en tot wijziging van de [Verordeningen (EG)
      nr. 2111/2005](32005R2111), [(EG) nr. 1008/2008](32008R1008), [(EU) nr. 996/2010](32010R0996), [(EU) nr. 376/2014]
      (32014R0376) en de [Richtlijnen 2014/30/EU](32014L0030) en [2014/53/EU](32014L0053) van het Europees Parlement en
      de Raad, en tot intrekking van de [Verordeningen (EG) nr. 552/2004](32004R0552) en [(EG) nr. 216/2008](32008R0216)
      van het Europees Parlement en de Raad en [Verordening (EEG) nr. 3922/91](31991R3922) van de Raad *(PbEU* 2018,
      L 212);
      - *Verordening (EU) 2022/2554:* [Verordening (EU) 2022/2554](32022R2554) van het Europees Parlement en de Raad
      van 14 december 2022 betreffende digitale operationele weerbaarheid voor de financiële sector en tot wijziging van
      [Verordeningen (EG) nr. 1060/2009](32009R1060), [(EU) nr. 648/2012](32012R0648), [(EU) nr. 600/2014](32014R0600),
      [(EU) nr. 909/2014](32014R0909) en [(EU) 2016/1011](32016R1011)*(PbEU* 2022, L 333);
      - *vertegenwoordiger:* een in de Europese Unie gevestigde natuurlijk persoon of rechtspersoon die uitdrukkelijk
      is aangewezen om op te treden namens een DNS-dienstverlener, een register voor topleveldomeinnamen, een
      entiteit die domeinnaamregistratiediensten verleent, een aanbieder van cloudcomputingdiensten, een aanbieder
      van datacentrumdiensten, een aanbieder van een netwerk voor de levering van inhoud, een aanbieder van beheerde
      diensten, een aanbieder van beheerde beveiligingsdiensten, of een aanbieder van een onlinemarktplaats, van een
      onlinezoekmachine of van een platform voor socialenetwerkdiensten die niet in de Unie is gevestigd, en die door
      een bevoegde autoriteit of een CSIRT kan worden aangesproken in plaats van de entiteit zelf met betrekking tot de
      verplichtingen van die entiteit uit hoofde van deze wet;
      - *vertrouwensdienst:* een elektronische dienst die gewoonlijk tegen betaling wordt verricht en uit één van de
      volgende elementen bestaat: a. het uitgeven van certificaten voor elektronische handtekeningen, certificaten
      voor elektronische zegels, certificaten voor websiteauthenticatie of certificaten voor het verlenen van andere
      vertrouwensdiensten; b. het valideren van certificaten voor elektronische handtekeningen, certificaten voor
      elektronische zegels, certificaten voor websiteauthenticatie of certificaten voor het verlenen van andere
      vertrouwensdiensten; c. het aanmaken van elektronische handtekeningen of elektronische zegels; d. het valideren
      van elektronische handtekeningen of elektronische zegels; e. het bewaren van elektronische handtekeningen,
      elektronische zegels, certificaten voor elektronische handtekeningen of certificaten voor elektronische zegels;
      f. het beheer van middelen voor het op afstand aanmaken van elektronische handtekeningen of middelen voor het op
      afstand aanmaken van elektronische zegels; g. het uitgeven van elektronische attesteringen van attributen; h. het
      valideren van elektronische attesteringen van attributen; i. het aanmaken van elektronische tijdstempels; j. het
      valideren van elektronische tijdstempels; k. het verlenen van diensten voor elektronisch aangetekende bezorging; l.
      het valideren van gegevens die via diensten voor elektronisch aangetekende bezorging zijn verzonden en het bewijs
      daarvoor; m. het elektronisch archiveren van elektronische gegevens en elektronische documenten; n. het opslaan van
      elektronische gegevens in elektronische registers.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel1
  - number: '2'
    text: >-
      Deze wet is, met het oog op het in stand houden van kritieke maatschappelijke of economisch belangrijke functies of
      activiteiten, gericht op het verhogen van de cyberbeveiliging door regels te stellen ten aanzien van:


      a. het beheersen van risico’s voor de beveiliging van netwerk- en informatiesystemen;


      b. het voorkomen van incidenten;


      c. het beperken van gevolgen van incidenten; en


      d. het verkrijgen en verstrekken van informatie over incidenten, bijna-incidenten, cyberdreigingen en
      kwetsbaarheden.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel2
  - number: '3'
    text: >-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van de op grond van de
      NIS2-richtlijn vastgestelde uitvoeringshandelingen, gedelegeerde handelingen en richtsnoeren.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel3
  - number: '4'
    text: >-
      1 Het bepaalde bij of krachtens deze wet met betrekking tot essentiële entiteiten en belangrijke entiteiten is van
      toepassing op die entiteiten, indien zij in Nederland zijn gevestigd en hun diensten verlenen of hun activiteiten
      verrichten in Nederland of een andere lidstaat van de Europese Unie.


      2 In afwijking van het eerste lid is het bepaalde bij of krachtens deze wet met betrekking tot essentiële
      entiteiten en belangrijke entiteiten die aanbieders van openbare elektronische communicatienetwerken of aanbieders
      van openbare elektronische communicatiediensten zijn, van toepassing op die aanbieders, indien zij hun diensten in
      Nederland aanbieden.


      3 In afwijking van het eerste lid is het bepaalde bij of krachtens deze wet met betrekking tot essentiële
      entiteiten en belangrijke entiteiten van toepassing op de volgende entiteiten, indien zij hun hoofdvestiging of
      vertegenwoordiger in Nederland hebben en hun diensten verlenen of hun activiteiten verrichten in Nederland of een
      andere lidstaat van de Europese Unie:


      a. DNS-dienstverleners;


      b. registers voor topleveldomeinnamen;


      c. aanbieders van cloudcomputingdiensten;


      d. aanbieders van datacentrumdiensten;


      e. aanbieders van netwerken voor de levering van inhoud;


      f. aanbieders van beheerde diensten;


      g. aanbieders van beheerde beveiligingsdiensten;


      h. aanbieders van onlinemarktplaatsen;


      i. aanbieders van onlinezoekmachines;


      j. aanbieders van platforms voor socialenetwerkdiensten.


      4 Het bepaalde bij of krachtens deze wet met betrekking tot entiteiten die domeinnaamregistratiediensten verlenen
      is van toepassing op die entiteiten, indien zij hun hoofdvestiging of vertegenwoordiger in Nederland hebben.


      5 Een entiteit als bedoeld in het derde of vierde lid wordt geacht haar hoofdvestiging in Nederland te hebben
      indien de beslissingen met betrekking tot de maatregelen voor het beheersen van cyberbeveiligingsrisico’s
      hoofdzakelijk in Nederland worden genomen. Indien deze beslissingen niet hoofdzakelijk in Nederland of een andere
      lidstaat van de Europese Unie worden genomen of indien niet kan worden bepaald in welke lidstaat van de Europese
      Unie die beslissingen hoofdzakelijk worden genomen, wordt de hoofdvestiging geacht zich in Nederland te bevinden
      indien de cyberbeveiligingsactiviteiten in Nederland worden uitgevoerd. Indien de cyberbeveiligingsactiviteiten
      niet in Nederland of een andere lidstaat van de Europese Unie worden uitgevoerd of niet kan worden bepaald in
      welke lidstaat van de Europese Unie de cyberbeveiligingsactiviteiten worden uitgevoerd, wordt de hoofdvestiging
      geacht zich te bevinden in Nederland indien de vestiging van de betrokken entiteit in Nederland het grootste aantal
      werknemers in de Europese Unie heeft.


      6 Onverminderd het eerste, derde en vierde lid is het bepaalde bij of krachtens de artikelen 42, 60 en 61 van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel4
