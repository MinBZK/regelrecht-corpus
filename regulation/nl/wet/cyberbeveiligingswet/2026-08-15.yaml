    text: >-
      1 Deze wet, met uitzondering van artikel 96, is niet van toepassing op:


      a. het Ministerie van Defensie;


      b. de inlichtingen- en veiligheidsdiensten, bedoeld in de Wet op de inlichtingen- en veiligheidsdiensten 2017;


      c. het openbaar ministerie;


      d. de politie;


      e. de veiligheidsregio’s, bedoeld in artikel 9 van de Wet veiligheidsregio’s; en


      f. indien van toepassing, de andere bij algemene maatregel van bestuur aangewezen overheidsinstanties die
      in hoofdzaak activiteiten uitvoeren op het gebied van nationale veiligheid, openbare veiligheid, defensie of
      rechtshandhaving, met inbegrip van het voorkomen, onderzoeken, opsporen en vervolgen van strafbare feiten.


      2 In afwijking van het eerste lid is deze wet wel van toepassing op overheidsinstanties als bedoeld in het eerste
      lid, wanneer en voor zover zij optreden als verleners van vertrouwensdiensten die niet uitsluitend worden gebruikt
      binnen systemen die gesloten zijn als gevolg van een wettelijke regeling of een overeenkomst tussen een bepaalde
      groep deelnemers.
    url: https://wetten.overheid.nl/BWBR0052872/2026-08-15#Artikel5
