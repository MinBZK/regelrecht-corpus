---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_afbreking_zwangerschap
regulatory_layer: WET
publication_date: '2025-06-04'
valid_from: '2021-07-01'
bwb_id: BWBR0003396
url: https://wetten.overheid.nl/BWBR0003396/2021-07-01
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: Onze Minister: Onze Minister
      van Volksgezondheid en Milieuhygiëne; inspecteur: de inspecteur van de Inspectie gezondheidszorg en jeugd;
      arts: degene die bevoegd is de titel van arts te voeren, alsmede, voor zover het betreft de arts, bedoeld in
      [artikel 3, tweede lid][ref1], degene die in het land waar hij is gevestigd, het beroep van arts wettig uitoefent;
      ziekenhuis: een inrichting waarin personen worden opgenomen voor het ondergaan van een genees-, heel- of
      verloskundig onderzoek of een genees-, heel- of verloskundige behandeling, met inbegrip van een daarvan onderdeel
      uitmakende polikliniek; abortuskliniek - hierna te noemen kliniek -: een inrichting, niet zijnde een ziekenhuis,
      waarin vrouwen een behandeling ondergaan, gericht op het afbreken van zwangerschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel3
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '3'
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder het afbreken van zwangerschap niet
      verstaan het toepassen van een middel ter voorkoming van de innesteling van een bevruchte eicel in de baarmoeder.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder "geneesheer-directeur" mede verstaan
      de arts die, hoewel geen directeursfunctie bekledende, belast is met de zorg voor de algemene gang van zaken op
      geneeskundig gebied in de inrichting.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel1
  - number: '2'
    text: |-
      Een behandeling, gericht op het afbreken van zwangerschap, mag slechts worden verricht door een arts in een
      ziekenhuis of kliniek, waaraan door Onze Minister vergunning tot het verrichten van dergelijke behandelingen is
      verleend.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel2
  - number: '3.1'
    text: |-
      Een zwangerschap wordt niet eerder afgebroken dan op de zesde dag nadat de vrouw de arts heeft bezocht en daarbij
      haar voornemen met hem heeft besproken.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel3
  - number: '3.2'
    text: |-
      Indien een arts bij wie de vrouw onder regelmatige medische behandeling staat, dan wel als medisch specialist of
      in de woonplaats van de vrouw als huisarts werkzaam is, haar, onder mededeling van zijn bevindingen, heeft verwezen
      naar een ziekenhuis of kliniek, als bedoeld in [artikel 2][ref1], begint de termijn te lopen vanaf het tijdstip dat
      de vrouw die arts heeft bezocht en daarbij haar voornemen met hem heeft besproken.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel2
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '2'
  - number: '3.3'
    text: |-
      De arts deelt de vrouw zo spoedig mogelijk mede of hij de aan hem gevraagde medewerking zal verlenen. Geldt het een
      arts als bedoeld in het eerste lid, dan doet hij die mededeling in elk geval uiterlijk vijf dagen nadat zij zich
      tot hem heeft gewend, anders uiterlijk na drie dagen.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel3
  - number: '3.4'
    text: |-
      De in het eerste lid bedoelde termijn wordt met een dag bekort indien de arts, bedoeld in het tweede lid, de vrouw
      drie dagen nadat zij zich tot hem had gewend, heeft medegedeeld, dat hij haar niet zal verwijzen.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel3
  - number: '3.5'
    text: |-
      In het geval, dat de arts de vrouw niet verwijst, stelt hij haar onverwijld een gedateerde schriftelijke
      kennisgeving daaromtrent ter hand, welke in elk geval het tijdstip vermeldt, waarop de vrouw zich tot hem had
      gewend.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel3
  - number: '4.1'
    text: |-
      De vergunning, bedoeld in [artikel 2][ref1], wordt aangevraagd door het bestuur van het ziekenhuis of de kliniek.
      Bij de aanvraag dienen de bij algemene maatregel van bestuur verlangde gegevens te worden verstrekt. Indien hij dit
      nodig acht voor een verantwoorde beslissing op het verzoek om vergunning, kan Onze Minister nadere gegevens vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel2
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '2'
  - number: '4.2'
    text: Onze Minister beslist binnen zeven maanden na de ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel4
  - number: '4.3'
    text: |-
      Het ziekenhuis of de kliniek verkrijgt de vergunning indien aannemelijk is gemaakt dat aan de in de
      [artikelen 5, eerste lid][ref1], of [6][ref2] bedoelde eisen zal worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003396#Artikel6
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003396
        artikel: '6'
  - number: '5.1'
    text: |-
      Bij algemene maatregel van bestuur worden eisen gesteld met betrekking tot hulpverlening en besluitvorming, welke
      erop zijn gericht te verzekeren dat iedere beslissing tot het afbreken van zwangerschap met zorgvuldigheid wordt
      genomen en alleen dan uitgevoerd, indien de noodsituatie van de vrouw deze onontkoombaar maakt.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel5
  - number: '5.2'
    text: 'Deze eisen strekken er met name toe te verzekeren:'
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel5
  - number: 5.2.a
    text: |-
      dat de vrouw die het voornemen heeft tot afbreking van zwangerschap en zich met een daartoe strekkend verzoek tot
      de arts heeft gewend, wordt bijgestaan, in het bijzonder door het verstrekken van verantwoorde voorlichting over
      andere oplossingen van haar noodsituatie dan het afbreken van de zwangerschap;
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel5
  - number: 5.2.b
    text: |-
      dat de arts, indien de vrouw van oordeel is dat haar noodsituatie niet op andere wijze kan worden beëindigd, zich
      ervan vergewist dat de vrouw haar verzoek heeft gedaan en gehandhaafd in vrijwilligheid, na zorgvuldige overweging
      en in het besef van haar verantwoordelijkheid voor ongeboren leven en van de gevolgen voor haarzelf en de haren;
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel5
  - number: 5.2.c
    text: |-
      dat, onverminderd het bepaalde in [artikel 20][ref1], de arts de behandeling slechts verricht indien deze op grond
      van zijn bevindingen verantwoord is te achten;


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel20
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '20'
  - number: 5.2.d
    text: |-
      dat na afbreking van de zwangerschap een genoegzame nazorg voor de vrouw en de haren beschikbaar is, mede in de
      vorm van voorlichting over methoden ter voorkoming van ongewenste zwangerschap.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel5
  - number: '6.1'
    text: 'De vergunning wordt ten aanzien van een kliniek overigens slechts verleend indien:'
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel6
  - number: 6.1.a
    text: de kliniek wordt beheerd door een rechtspersoon met volledige rechtsbevoegdheid welke geen winst nastreeft;
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel6
  - number: 6.1.b
    text: |-
      wordt voldaan aan bij algemene maatregel van bestuur te stellen eisen omtrent bestuur en beheer van de kliniek,
      organisatie, werkwijze, personeel, huisvesting en uitrusting, opdat gewaarborgd is dat de behandeling voldoet
      aan de eisen die daaraan uit medisch en verpleegkundig oogpunt behoren te worden gesteld, alsmede omtrent de
      samenstelling van het bestuur;
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel6
  - number: 6.1.c
    text: |-
      de kliniek bij de behandeling van de afbreking van zwangerschappen volgens bij algemene maatregel van bestuur te
      stellen regels samenwerkt met een of meer ziekenhuizen;
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel6
  - number: 6.1.d
    text: |-
      de rechtspersoon, die de kliniek beheert, jaarlijks verslag doet van de gang van zaken op medisch en financieel
      gebied in het voorafgaande kalenderjaar en dat verslag algemeen verkrijgbaar stelt;
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel6
  - number: 6.1.e
    text: |-
      de rechtspersoon, die de kliniek beheert en geen openbaar lichaam is, krachtens de statuten de
      jaarrekening ter verkrijging van een verklaring daaromtrent door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] doet onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '6.2'
    text: |-
      De vergunning heeft slechts mede betrekking op afbreking in een kliniek van zwangerschappen die langer dan dertien
      weken hebben geduurd, indien aan daartoe bij de algemene maatregel van bestuur, bedoeld in het eerste lid, onder
      *b* en *c,* te stellen nadere eisen van medische en verpleegkundige aard is voldaan.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister kan, al naar gelang de specifieke omstandigheden van een inrichting hiertoe nopen, aan een vergunning
      aanvullende voorschriften verbinden, onderscheidenlijk deze voorschriften wijzigen, aanvullen of intrekken. De
      voorschriften mogen slechts betrekking hebben op de tariefstelling en de onderwerpen waaromtrent en voor zover
      daarover bij of krachtens de [artikelen 5][ref1] en [6][ref2] eisen zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003396#Artikel6
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003396
        artikel: '6'
  - number: '8'
    text: 'Onze Minister kan een vergunning intrekken:'
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel8
  - number: 8.a
    text: indien onjuiste gegevens zijn verstrekt, die hebben geleid tot het verlenen van de vergunning;
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel8
  - number: 8.b
    text: |-
      indien de voorschriften, gesteld bij of krachtens deze wet, dan wel de voorschriften verbonden aan de vergunning,
      zijn overtreden.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel8
  - number: '9.1'
    text: |-
      Een krachtens de [artikelen 5][ref1] tot en met [8][ref2] genomen besluit bepaalt het tijdstip waarop de verlening
      of intrekking van de vergunning, dan wel de wijziging, aanvulling of intrekking van de aan de vergunning te
      verbinden voorschriften, ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003396#Artikel8
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003396
        artikel: '8'
  - number: '9.2'
    text: Van het verlenen of intrekken van een vergunning wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel9
  - number: '10.1'
    text: |-
      Hangende het onderzoek naar feiten op grond waarvan volgens [artikel 8][ref1] intrekking van een vergunning
      mogelijk is, kan Onze Minister bevelen, dat de behandelingen in de inrichting, gericht op afbreking van
      zwangerschap, onverwijld zullen worden gestaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel8
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '8'
  - number: '10.2'
    text: |-
      Het bevel blijft van kracht totdat omtrent de intrekking van de vergunning is beschikt, onderscheidenlijk tot het
      tijdstip waarop de intrekking ingaat, behoudens eerdere opheffing van het bevel door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel10
  - number: '10.3'
    text: |-
      Het bevel, alsmede de opheffing van het bevel, wordt schriftelijk gegeven. [Artikel 9, eerste en tweede lid][ref1],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel9
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '9'
  - number: '11.1'
    text: |-
      Elke arts die behandelingen, gericht op afbreking van zwangerschap, verricht, doet ten minste eens per maand aan de
      geneesheer-directeur van de inrichting de volgende gegevens toekomen:
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel11
  - number: 11.1.a
    text: |-
      het aantal behandelingen, gericht op afbreking van zwangerschap, dat hij in dat tijdsverloop heeft verricht, en de
      eventueel daarbij opgetreden bijzonderheden;
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel11
  - number: 11.1.b
    text: |-
      de duur van de zwangerschap, het aantal voorafgegane zwangerschappen en zwangerschapsafbrekingen, de leeftijd, de
      provincie - dan wel, voor zover het buiten Nederland woonachtige vrouwen betreft, het land - van woonplaats, de
      burgerlijke staat en het aantal kinderen van elk van de behandelde vrouwen;
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel11
  - number: 11.1.c
    text: |-
      de datum waarop hij met de vrouw haar voornemen heeft besproken, alsmede, indien de vrouw door een arts als
      bedoeld in [artikel 3, tweede lid][ref1], verwezen is, het in dat lid bedoelde tijdstip en de medische hoedanigheid
      waarin hij de vrouw hulp heeft geboden, de vraag of, en zo ja in welke gevallen, overleg is gepleegd met andere
      deskundigen, en welke de aard van de deskundigheid van de geraadpleegde was, de datum van de ingreep, met dien
      verstande dat, indien het zich in [artikel 16, tweede lid][ref2], bedoelde geval heeft voorgedaan, tevens de
      bijzondere redenen daarvoor worden opgegeven, en de nazorg die na de afbreking van de zwangerschap aan de vrouw
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003396#Artikel16
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003396
        artikel: '16'
  - number: '11.2'
    text: |-
      De geneesheer-directeur van de inrichting ziet erop toe dat alle in de inrichting werkzame artsen hem de in
      het eerste lid bedoelde gegevens volledig en tijdig doen toekomen in zodanige vorm dat zij niet tot individuele
      patiënten herleidbaar zijn. Hij draagt er zorg voor, dat deze gegevens ten minste vijf jaar worden bewaard.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel11
  - number: '11.3'
    text: |-
      De geneesheer-directeur doet eens per drie maanden aan de inspecteur opgave toekomen van de totalen, die aan de in
      de vorige leden bedoelde gegevens kunnen worden ontleend.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel11
  - number: '11.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de tijdstippen en wijze
      waarop de in de vorige leden van dit artikel bedoelde gegevens moeten worden verstrekt. Bij deze opgaven wordt de
      anonimiteit van de behandelde vrouwen gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel11
  - number: '11.5'
    text: 'De verkregen gegevens mogen uitsluitend worden gebruikt:'
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel11
  - number: 11.5.a
    text: voor statistische doeleinden en
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel11
  - number: 11.5.b
    text: ten behoeve van het toezicht op de naleving van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel11
  - number: '11.6'
    text: |-
      De in het eerste lid bedoelde arts draagt er tevens zorg voor, dat vóór of zo spoedig mogelijk na de behandeling
      aantekening wordt gemaakt van de bevindingen die ertoe hebben geleid de behandeling te geven. Hij is verplicht deze
      aantekeningen gedurende ten minste vijf jaar te bewaren en de daarin vervatte gegevens, mits niet herleidbaar tot
      individuele patiënten, desverzocht ter beschikking te stellen van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel11
  - number: '12'
    text: |-
      De geneesheer-directeur van de inrichting draagt zorg dat de inspecteur op zijn verzoek inzage wordt verschaft
      van de in [artikel 11, tweede lid][ref1], bedoelde gegevens en dat hem alle gevraagde inlichtingen, mits niet
      herleidbaar tot individuele patiënten, worden verstrekt die hij redelijkerwijs voor de uitoefening van zijn taak
      met betrekking tot deze wet behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel11
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '11'
  - number: '13.1'
    text: |-
      Een algemene maatregel van bestuur, als bedoeld in de [artikelen 4, eerste lid][ref1], [5, eerste lid][ref2],
      [6, eerste lid, onder ][ref3], wordt vastgesteld op voordracht van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003396#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003396#Artikel6
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003396
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0003396
        artikel: '6'
  - number: '13.2'
    text: |-
      Hij treedt niet in werking dan nadat drie maanden sedert de datum van afkondiging zijn verstreken. Van de datum
      van afkondiging wordt door Onze Minister mededeling gedaan aan de Staten-Generaal onder overlegging van de over het
      ontwerp van de algemene maatregel van bestuur uitgebrachte adviezen.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel13
  - number: 14a.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel14a
  - number: 14a.2
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '15'
    text: |-
      De arts die een behandeling, gericht op het afbreken van zwangerschap, verricht in een kliniek, tenzij het betreft
      een kliniek ten aanzien waarvan aan [artikel 6, tweede lid][ref1], is voldaan terwijl hij weet of redelijkerwijs
      moet vermoeden, dat de zwangerschap langer dan dertien weken heeft geduurd, wordt gestraft met hechtenis van ten
      hoogste een jaar of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel6
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '6'
  - number: '16.1'
    text: |-
      De arts die een behandeling, gericht op het afbreken van zwangerschap, verricht op een eerder tijdstip dan in
      [artikel 3][ref1] voorgeschreven, wordt gestraft met geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel3
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '3'
  - number: '16.2'
    text: |-
      Het feit is niet strafbaar indien de arts de behandeling, gericht op het afbreken van zwangerschap, op een eerder
      tijdstip heeft verricht om daarmede een dreigend gevaar voor het leven of de gezondheid van de vrouw af te wenden.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel16
  - number: '16.3'
    text: |-
      Met dezelfde straf wordt gestraft de arts die op een later tijdstip dan in [artikel 3][ref1] voorgeschreven aan de
      vrouw mededeling doet of hij de aan hem gevraagde medewerking zal verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel3
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '3'
  - number: '17'
    text: |-
      Het ziekenhuis of de kliniek waar behandelingen, gericht op het afbreken van zwangerschap, worden verricht in
      strijd met [artikel 2][ref1] dan wel met het in [artikel 10, eerste lid][ref2], bedoelde bevel, wordt gestraft met
      een geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003396#Artikel10
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003396
        artikel: '10'
  - number: '18.1'
    text: |-
      De arts die nalaat te voldoen aan het bepaalde in [artikel 11, eerste of zesde lid][ref1], wordt gestraft met een
      geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel11
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '11'
  - number: '18.2'
    text: |-
      De geneesheer-directeur die nalaat te voldoen aan het bepaalde in de [artikelen 11, tweede en derde lid][ref1], en
      [12][ref2] wordt gestraft met een geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003396#Artikel12
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003396
        artikel: '12'
  - number: '19.1'
    text: |-
      De in de [artikelen 15][ref1], [16, eerste en derde lid][ref2], [17][ref3] en [18][ref4] strafbaar gestelde feiten
      zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003396#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003396#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0003396#Artikel18
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0003396
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0003396
        artikel: '17'
      - id: ref4
        bwb_id: BWBR0003396
        artikel: '18'
  - number: '19.2'
    text: |-
      Met de opsporing van de in het vorige lid bedoelde strafbare feiten zijn, behalve de ambtenaren bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de inspecteurs.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 19a
    text: |-
      Onze Minister is bevoegd een bestuurlijke boete van ten hoogste € 33 500,– op te leggen ter zake van een gedraging
      die in strijd is met [artikel 11, tweede lid, laatste volzin, derde, vierde of zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel11
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '11'
  - number: '20.1'
    text: |-
      Niemand is verplicht een vrouw een behandeling, gericht op het afbreken van zwangerschap, te geven, dan wel daaraan
      medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel20
  - number: '20.2'
    text: |-
      Indien de arts gemoedsbezwaren koestert tegen het verrichten of doen verrichten van de behandeling, stelt hij de
      vrouw onverwijld nadat zij zich tot hem heeft gewend, daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel20
  - number: '20.3'
    text: |-
      Het eerste lid ontheft een arts niet van de verplichting om desgevraagd en indien de vrouw daartoe toestemming
      heeft verleend inlichtingen omtrent de toestand van de vrouw te geven aan andere artsen.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel20
  - number: 20a.1
    text: |-
      Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba met inachtneming van dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel20a
  - number: 20a.2
    text: |-
      In afwijking van [artikel 6, eerste lid, onder f][ref1], laat de rechtspersoon de
      jaarrekening onderzoeken met het oog op het verkrijgen van een verklaring als bedoeld in
      [artikel 121, eerste lid, van Boek 2 van het Burgerlijk Wetboek BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0028744
        artikel: '121'
  - number: 20a.3
    text: |-
      In afwijking van [artikel 19, tweede lid][ref1], wordt in plaats van
      «[artikel 141 van het Wetboek van Strafvordering][ref2]» gelezen:
      [artikel 184 van het Wetboek van Strafvordering BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0003396/2021-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '184'
