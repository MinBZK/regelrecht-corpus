preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op artikel 7.2.4, tweede lid, van de Wet educatie en beroepsonderwijs en artikel 2.2.3, vierde lid, van het
    Uitvoeringsbesluit WEB;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0025558/2010-05-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *wet:* [Wet educatie en beroepsonderwijs][ref1];

      b. *competenties:* in het kader van het herontwerp van de kwalificatiestructuur mbo opgestelde eindtermen, die
      verwijzen naar onderliggende vaardigheden, kennis, en houdingsaspecten en expliciet zijn gerelateerd aan de
      toepassing in de praktijk;

      c. *kwalificatiedossier:* inhoudelijke verzameling van de kwalificatieprofielen, bestaande uit een deel A, waarin
      het beeld van de beroepengroep wordt omschreven, een deel B, waarin onder andere de competenties worden omschreven
      en een deel C, waarin onder andere de benodigde kennis en vaardigheden worden omschreven en een deel D waarin de
      ontwikkeling van het kwalificatiedossier wordt toegelicht en verantwoord;

      d. *eindtermen:* eindtermen bedoeld in [artikel 7.1.3 van de wet][ref2];

      e. *prijsfactor:* prijsfactor, bedoeld in [artikel 2.2.3, vierde lid, van het Uitvoeringsbesluit WEB][ref3];

      f. *studielast:* studielast, bedoeld in [artikel 7.2.4, tweede lid, onderdeel d, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
