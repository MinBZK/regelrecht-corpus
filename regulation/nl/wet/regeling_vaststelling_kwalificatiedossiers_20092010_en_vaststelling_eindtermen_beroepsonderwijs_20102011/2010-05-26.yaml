    text: |-
      1 Voor de beroepsopleidingen opgenomen in [bijlage 1][ref1] behorende bij deze regeling worden de
      kwalificatiedossiers voor het studiejaar 2009–2010 vastgesteld overeenkomstig [bijlage 2][ref2] behorende bij deze
      regeling.

      2 In [bijlage 1][ref3] wordt per beroepsopleiding vastgesteld:

      a. de leerweg waarin de beroepsopleiding kan worden verzorgd;

      b. de prijsfactor;

      c. de hoogte van de studielast.


