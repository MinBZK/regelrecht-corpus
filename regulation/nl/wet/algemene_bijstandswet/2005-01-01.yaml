  - number: '14.2'
    text: |-
      Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging, de mate waarin de
      belanghebbende de gedraging verweten kan worden en de omstandigheden waarin hij verkeert. Van het opleggen van een
      maatregel wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14
  - number: '14.3'
    text: |-
      Indien het niet tijdig nakomen van de verplichting, bedoeld in
      [artikel 65, eerste lid][ref1], of de [artikelen 28, tweede lid][ref2], en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet heeft geleid tot het ten
      onrechte of tot een te hoog bedrag verlenen van bijstand, kunnen burgemeester en wethouders afzien van het opleggen
      van een maatregel als bedoeld in het eerste lid en volstaan met het geven van een schriftelijke waarschuwing
      ter zake van het niet tijdig nakomen van de verplichting, tenzij het niet tijdig nakomen van de verplichting
      plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de belanghebbende een
      zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '65'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '29'
  - number: '14.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kunnen burgemeester en wethouders besluiten af te zien van het
      opleggen van een maatregel als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14
  - number: '14.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot het eerste en het tweede lid nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14
  - number: 14a.1
    text: |-
      Indien de belanghebbende de verplichting, bedoeld in
      [artikel 65, eerste lid][ref1], of de [artikelen 28, tweede lid][ref2], en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet of niet behoorlijk is
      nagekomen door geen, onjuiste of onvolledige mededelingen te doen, leggen burgemeester en wethouders hem een boete
      op van ten hoogste € 2 269.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '65'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '29'
  - number: 14a.2
    text: |-
      De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de belanghebbende de gedraging
      verweten kan worden en de omstandigheden waarin hij verkeert. Van het opleggen van een boete wordt in elk geval
      afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14a
  - number: 14a.3
    text: |-
      Indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 65, eerste lid][ref1], of de [artikelen 28, tweede lid][ref2], en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet heeft geleid tot het
      ten onrechte of tot een te hoog bedrag verlenen van bijstand kunnen burgemeester en wethouders afzien van het
      opleggen van een boete als bedoeld in het eerste lid en volstaan met het geven van een schriftelijke waarschuwing
      ter zake van het niet of niet behoorlijk nakomen van de verplichting, tenzij het niet of niet behoorlijk nakomen
      van de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de
      belanghebbende een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '65'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '29'
  - number: 14a.4
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kunnen burgemeester en wethouders besluiten af te zien van het
      opleggen van een boete.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14a
  - number: 14a.5
    text: |-
      Degene aan wie een boete is opgelegd is verplicht desgevraagd aan burgemeester en wethouders de inlichtingen te
      verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14a
  - number: 14a.6
    text: Voor zover de boete nog niet is geïnd vervalt zij door het overlijden van degene aan wie zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14a
  - number: 14a.7
    text: Bij algemene maatregel van bestuur worden met betrekking tot het eerste en tweede lid nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14a
  - number: 14b.1
    text: |-
      Indien burgemeester en wethouders jegens de belanghebbende een handeling verrichten waaraan deze in redelijkheid
      de gevolgtrekking kan verbinden dat aan hem wegens een bepaalde gedraging een boete zal worden opgelegd, is de
      belanghebbende niet langer verplicht terzake van die gedraging enige verklaring af te leggen, voor zover het
      betreft de boeteoplegging. De belanghebbende wordt hiervan in kennis gesteld alvorens hem mondeling om informatie
      wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14b
  - number: 14b.2
    text: |-
      Indien burgemeester en wethouders voornemens zijn om aan de belanghebbende een boete op te leggen, wordt hiervan
      kennis gegeven aan de belanghebbende onder vermelding van de gronden waarop het voornemen berust. De kennisgeving
      is een handeling als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14b
  - number: 14b.3
    text: |-
      Op verzoek van de belanghebbende die de in het vorige lid bedoelde kennisgeving wegens zijn gebrekkige kennis van
      de Nederlandse taal onvoldoende begrijpt, dragen burgemeester en wethouders er zoveel mogelijk zorg voor dat de in
      die kennisgeving vermelde gronden aan de belanghebbende worden medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14b
  - number: 14b.4
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stellen burgemeester en wethouders de
      belanghebbende in de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen
      voordat de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 14b.5
    text: |-
      Indien de belanghebbende zijn zienswijze mondeling naar voren brengt, dragen burgemeester en wethouders er op
      verzoek van de belanghebbende die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd
      die de belanghebbende kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14b
  - number: 14c.1
    text: |-
      Het besluit waarbij de boete wordt opgelegd vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald, alsmede de wijze waarop het besluit, bij gebreke van tijdige betaling, overeenkomstig [artikel 14][ref1]
      zal worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel14f
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: 14f
        hoofdstuk: II
        paragraaf: 3a
  - number: 14c.2
    text: |-
      Op verzoek van de belanghebbende die het in het eerste lid bedoelde besluit wegens zijn gebrekkige kennis van de
      Nederlandse taal onvoldoende begrijpt, dragen burgemeester en wethouders er zoveel mogelijk zorg voor dat de in dat
      besluit vermelde informatie aan de belanghebbende wordt medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14c
  - number: 14c.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het eerste lid nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14c
  - number: 14d.1
    text: Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14d
  - number: 14d.2
    text: |-
      De oplegging van een boete blijft definitief achterwege indien ter zake van de gedraging tegen de belanghebbende
      een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht
      tot strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 14d.3
    text: |-
      Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en tweede lid mededeling aan
      burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14d
  - number: 14e.1
    text: |-
      Een boete wordt opgelegd binnen een jaar nadat burgemeester en wethouders de belanghebbende overeenkomstig
      [artikel 14][ref1], in de gelegenheid hebben gesteld zijn zienswijze naar voren te brengen. Indien terzake aangifte
      is gedaan of proces-verbaal is opgemaakt en ingezonden vangt de termijn van een jaar aan op de dag na die waarop
      het openbaar ministerie aan burgemeester en wethouders heeft medegedeeld dat geen strafvervolging wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel14
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14e
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
  - number: 14e.2
    text: |-
      Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14e
  - number: 14f.1
    text: |-
      Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het [Tweede Boek van het
      Wetboek van Burgerlijke Rechtsvordering](onbekend). De titel heeft mede betrekking op de rente en kosten, bedoeld
      in het zevende lid.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14f
  - number: 14f.2
    text: |-
      Indien degene aan wie een boete is opgelegd algemene bijstand of een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1],
      de[ Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2] of
      de[ Wet inkomensvoorziening kunstenaars][ref3] ontvangt, wordt het besluit waarbij de boete is opgelegd
      tenuitvoergelegd door verrekening met die bijstand of uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
      [ref3]: https://wetten.overheid.nl/BWBR0009344
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14f
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0004163
      - id: ref3
        bwb_id: BWBR0009344
  - number: 14f.3
    text: |-
      Indien degene aan wie een boete is opgelegd inmiddels bijstand of uitkering als bedoeld in het tweede lid ontvangt
      van een andere gemeente dan de gemeente die de boete heeft opgelegd, betaalt die andere gemeente het bedrag van die
      boete, zonder dat daarvoor een machtiging nodig is van de belanghebbende, op haar verzoek aan de gemeente die de
      boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14f
  - number: 14f.4
    text: |-
      Indien degene aan wie een boete is opgelegd een uitkering ontvangt op grond van de [Werkloosheidswet][ref1],
      de [Ziektewet][ref2], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref5], de [Wet arbeidsongeschiktheidsvoorziening militairen][ref6],
      de [Toeslagenwet][ref7], de [Algemene Ouderdomswet][ref8], de [Algemene nabestaandenwet][ref9] of de
      [Wet arbeid en zorg][ref10], betaalt het Uitvoeringsinstituut werknemersverzekeringen, onderscheidenlijk de Sociale
      verzekeringsbank het bedrag van die boete, zonder dat daarvoor diens machtiging nodig is op haar verzoek aan de
      gemeente die de boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
      [ref5]: https://wetten.overheid.nl/BWBR0002524
      [ref6]: https://wetten.overheid.nl/BWBR0002822
      [ref7]: https://wetten.overheid.nl/BWBR0004043
      [ref8]: https://wetten.overheid.nl/BWBR0002221
      [ref9]: https://wetten.overheid.nl/BWBR0007795
      [ref10]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14f
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
      - id: ref5
        bwb_id: BWBR0002524
      - id: ref6
        bwb_id: BWBR0002822
      - id: ref7
        bwb_id: BWBR0004043
      - id: ref8
        bwb_id: BWBR0002221
      - id: ref9
        bwb_id: BWBR0007795
      - id: ref10
        bwb_id: BWBR0013008
  - number: 14f.5
    text: |-
      Indien degene aan wie een boete is opgelegd geen bijstand of uitkering als bedoeld in het tweede of vierde lid
      ontvangt of meer ontvangt, dan wel ten aanzien van zodanige uitkering toepassing van het derde en vierde lid niet
      mogelijk is, wordt het besluit waarbij de boete is opgelegd bij gebreke van tijdige betaling met toepassing van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] op zijn kosten betekend en tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14f
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 14f.6
    text: |-
      De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede,
      derde of vierde lid, dan wel van het vijfde lid, dan wel van het tweede, derde of vierde lid in combinatie met het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14f
  - number: 14f.7
    text: |-
      Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14f
  - number: 14f.8
    text: |-
      De betekening en tenuitvoerlegging ingevolge het vijfde lid kan geschieden door de deurwaarder, bedoeld in
      [artikel 231, tweede lid, onderdeel ][ref1]. [Artikel 256 van die wet][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel256
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14f
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '256'
  - number: 14f.9
    text: |-
      Op het executoriaal beslag ingevolge dit artikel door burgemeester en wethouders op loon, sociale uitkeringen
      of andere periodieke betalingen, welke derden verschuldigd zijn of worden aan degene aan wie een boete is
      opgelegd, zijn de [artikelen 479][ref1], behoudens [artikel 479][ref2] van overeenkomstige toepassing. De
      in [artikel 479][ref3] aan de raad voor de kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel479e
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14f
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479b
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 479e
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479g
  - number: 14f.10
    text: |-
      De tenuitvoerlegging van een besluit met toepassing van dit artikel geschiedt zodanig dat de belanghebbende blijft
      beschikken over een inkomen gelijk aan de beslagvrije voet bedoeld in de [artikelen 475][ref1] en [475][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14f
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 14f.11
    text: |-
      Het tiende lid geldt niet zolang de belanghebbende zijn verplichting bedoeld in [artikel 14a, vijfde lid][ref1],
      niet of niet behoorlijk nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel14a
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel14f
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: 14a
        hoofdstuk: II
        paragraaf: 3a
  - number: '65.1'
    text: |-
      De belanghebbende doet aan burgemeester en wethouders op verzoek of onverwijld uit eigen beweging mededeling van
      alle feiten en omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op
      het recht op bijstand, het geldend maken van het recht op bijstand, de hoogte of de duur van de bijstand, of op het
      bedrag van de bijstand dat aan hem wordt betaald.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel65
  - number: '65.2'
    text: |-
      De belanghebbende is verplicht aan burgemeester en wethouders desgevraagd de medewerking te verlenen die
      redelijkerwijs nodig is voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel65
  - number: '65.3'
    text: |-
      De belanghebbende is voorts verplicht aan burgemeester en wethouders desgevraagd een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] terstond ter inzage
      te verstrekken, voor zover dit redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '65.4'
    text: |-
      Burgemeester en wethouders stellen bij de uitvoering van deze wet ten aanzien van een belanghebbende op wie
      de verplichting bedoeld in het vierde lid rust, de identiteit vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] en nemen de aard en
      het nummer daarvan op in de administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '66.1'
    text: |-
      Onverminderd [artikel 28, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      bepalen burgemeester en wethouders welke gegevens ten behoeve van de verlening van bijstand dan wel de voortzetting
      daarvan door de belanghebbende in ieder geval worden verstrekt en welke bewijsstukken worden overgelegd, alsmede de
      wijze en het tijdstip waarop de verstrekking van gegevens plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '28'
  - number: '66.2'
    text: |-
      Burgemeester en wethouders onderzoeken de juistheid en volledigheid van de verkregen gegevens en stellen zonodig
      een onderzoek in naar andere gegevens die noodzakelijk zijn voor de verlening dan wel de voortzetting van bijstand.
      Indien het onderzoek daartoe aanleiding geeft besluiten burgemeester en wethouders tot herziening van de bijstand.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel66
  - number: '66.3'
    text: |-
      Burgemeester en wethouders verrichten regelmatig een heronderzoek naar de voor het recht op bijstand van
      belang zijnde gegevens. Het heronderzoek strekt zich mede uit tot de naleving van de aan de bijstand verbonden
      verplichtingen. Burgemeester en wethouders beoordelen tevens of er aanleiding bestaat de verplichtingen aan te
      vullen dan wel te wijzigen.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel66
  - number: '66.4'
    text: |-
      Het in het derde en vierde lid bedoelde onderzoek omvat, tenzij op grond van [artikel 107][ref1] ontheffing is
      verleend van de verplichtingen gericht op inschakeling in de arbeid in dienstbetrekking, mede een onderzoek naar de
      mogelijkheden van de belanghebbende om door arbeid zelfstandig in het bestaan te voorzien alsmede de wijze waarop
      deze mogelijkheden kunnen worden vergroot.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel107
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '107'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '66.5'
    text: |-
      Bij beëindiging van de bijstand nemen burgemeester en wethouders, na onderzoek, tijdig een besluit met betrekking
      tot de wederzijds tussen de gemeente en de belanghebbende resterende verplichtingen en de afwikkeling daarvan.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel66
  - number: '66.6'
    text: |-
      Burgemeester en wethouders onderzoeken regelmatig de financiële omstandigheden van degene aan wie zij betalings-
      en aflossingsverplichtingen hebben opgelegd met betrekking tot de verleende algemene bijstand. Indien het onderzoek
      daartoe aanleiding geeft, besluiten burgemeester en wethouders tot wijziging van de opgelegde betalings- en
      aflossingsverplichtingen.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel66
  - number: '70.1'
    text: |-
      Bij een besluit tot toekenning of voortzetting van bijstand wordt, in een bijlage, mededeling gedaan van de rechten
      en plichten van de belanghebbende, die verband houden met de toekenning of voortzetting van bijstand. Hierbij wordt
      ten minste mededeling gedaan van:
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel70
  - number: 70.1.a
    text: |-
      de verplichtingen tot het doen van mededelingen en het verlenen van medewerking, bedoeld in [artikel 65][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel65
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '65'
        hoofdstuk: V
        paragraaf: '2'
  - number: 70.1.b
    text: |-
      de verplichtingen als bedoeld in [hoofdstuk VIII][ref1] die in het betrokken geval aan de bijstand zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0007333
        hoofdstuk: VIII
  - number: '70.2'
    text: |-
      Bij een besluit tot herziening van bijstand wordt mededeling gedaan van de herziening en, in een bijlage, van de
      op die herziening betrekking hebbende gewijzigde rechten en plichten van de belanghebbende. Voorts wordt, indien
      daarvoor aanleiding bestaat, in deze bijlage nogmaals mededeling gedaan van de eerder aan de bijstand verbonden
      rechten en plichten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel70
  - number: '70.3'
    text: |-
      Indien burgemeester en wethouders ter uitvoering van de taak, bedoeld in [artikel 111, eerste lid][ref1], ten
      behoeve van de belanghebbende een plan hebben opgesteld of hebben laten opstellen, gericht op het vergroten van
      de mogelijkheden tot inschakeling in het arbeidsproces, wordt dit opgenomen in een bijlage bij het besluit tot
      toekenning, voortzetting of herziening van bijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel111
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '111'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '70.4'
    text: |-
      De belanghebbende tekent, indien een plan als bedoeld in het derde lid wordt opgesteld, een exemplaar van de
      bijlage, bedoeld in het derde lid, of, indien een dergelijk plan niet wordt opgesteld, een exemplaar van de
      bijlage, bedoeld in het eerste en tweede lid, voor gezien en verstrekt dit aan burgemeester en wethouders. De
      bijlage wordt tevens getekend door burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel70
  - number: '70.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent dit artikel.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel70
  - number: '106'
    text: |-
      Naast de verplichtingen die ingevolge dit hoofdstuk in elk geval aan de bijstand verbonden zijn, dan wel daaraan
      door burgemeester en wethouders verbonden dienen te worden, kunnen burgemeester en wethouders vanaf de dag van
      melding als bedoeld in [artikel 68a, tweede lid][ref1], verplichtingen opleggen die strekken tot inschakeling in de
      arbeid in dienstbetrekking of in eigen bedrijf of zelfstandig beroep, dan wel die verband houden met aard en doel
      van een bepaalde vorm van bijstand of die strekken tot zijn vermindering of beëindiging. Een verplichting kan, op
      advies van een arts, inhouden het zich onderwerpen aan een noodzakelijke behandeling van medische aard.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel68a
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: 68a
        hoofdstuk: V
        paragraaf: '3'
  - number: '107.1'
    text: |-
      Burgemeester en wethouders kunnen besluiten verplichtingen als bedoeld in dit hoofdstuk niet op te leggen, dan
      wel van zodanige verplichtingen tijdelijk ontheffing te verlenen, in gevallen waarin daartoe naar hun oordeel
      aanleiding bestaat om redenen van medische of sociale aard, dan wel om redenen gelegen in de aard en het doel van
      de bijstand.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel107
  - number: '107.2'
    text: |-
      Voor de ouder met een volledige verzorgende taak voor een of meer ten laste komende kinderen, dan wel
      pleegkinderen, jonger dan vijf jaar gelden niet de verplichtingen, bedoeld in [artikel 113, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel113
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '113'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '107.3'
    text: |-
      Ten aanzien van een ouder met een gedeeltelijk verzorgende taak of gehuwden die de verzorgende taak bedoeld in het
      tweede lid gezamenlijk uitoefenen geldt dat de verplichtingen bedoeld in [artikel 113, eerste lid][ref1] aan die
      ouder onderscheidenlijk die ouders worden opgelegd met dien verstande dat deze onderscheidenlijk ieder van beiden
      voor de helft van de geldende volledige arbeidstijd per week beschikbaar moet zijn voor inschakeling in de arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel113
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '113'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '108'
    text: |-
      De verplichting tot het instellen van een vordering tot toekenning van een uitkering tot levensonderhoud kan,
      onverminderd [artikel 108a][ref1], slechts aan de bijstand worden verbonden, indien het betreft een uitkering ten
      laste van de echtgenoot, de gewezen echtgenoot of de ouder, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel108a
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: 108a
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 108.a
    text: |-
      die vordering kan worden ingesteld samen met een verzoek tot echtscheiding, scheiding van tafel en bed of
      ontbinding van het huwelijk na scheiding van tafel en bed; of
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel108
  - number: 108.b
    text: |-
      de echtgenoot, de gewezen echtgenoot of de ouder buiten Nederland verblijft en de verplichting noodzakelijk is
      om op grond van een uitspraak van de Nederlandse rechter onderhoudsaanspraken in het buitenland geldend te maken
      onder toepassing van het op 20 juni 1956 te New York tot stand gekomen Verdrag inzake verhaal in het buitenland van
      uitkeringen tot onderhoud (Trb. 1957, 121).
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel108
  - number: 108a
    text: |-
      Indien ten aanzien van de belanghebbende een rechterlijke uitspraak betreffende levensonderhoud verschuldigd
      krachtens [Boek 1 van het Burgerlijk Wetboek][ref1] die uitvoerbaar is, niet wordt nagekomen, kunnen burgemeester
      en wethouders aan de bijstand verplichtingen verbinden die er toe strekken dat de belanghebbende aan de
      tenuitvoerlegging van de uitspraak meewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel108a
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: '113.1'
    text: |-
      De belanghebbende die voor de zelfstandige voorziening in het bestaan is aangewezen op arbeid in dienstbetrekking
      is vanaf de dag van melding als bedoeld in [artikel 68a, tweede lid][ref1], verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel68a
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: 68a
        hoofdstuk: V
        paragraaf: '3'
  - number: 113.1.a
    text: naar vermogen te trachten arbeid in dienstbetrekking te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel113
  - number: 113.1.b
    text: |-
      ervoor te zorgen dat hij als werkzoekende geregistreerd is bij de Centrale organisatie
      werk en inkomen en geregistreerd blijft, indien hem daartoe het recht toekomt op grond van
      [artikel 25, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel25
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '25'
  - number: 113.1.c
    text: passende arbeid te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel113
  - number: 113.1.d
    text: na te laten hetgeen inschakeling in de arbeid belemmert;
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel113
  - number: 113.1.e
    text: |-
      mee te werken aan een onderzoek naar de geschiktheid voor scholing of opleiding en aan een scholing of opleiding,
      die noodzakelijk wordt geacht;
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel113
  - number: 113.1.f
    text: |-
      beschikbaar te zijn voor de voorzieningen van de [Wet inschakeling werkzoekenden][ref1], mee te werken aan
      het verkrijgen van die voorzieningen, daarvan gebruik te maken en daartoe op een aangegeven tijd en plaats te
      verschijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0009083
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0009083
  - number: '113.2'
    text: |-
      Onder passende arbeid wordt verstaan alle arbeid die voor de krachten en bekwaamheden van de belanghebbende is
      berekend, tenzij aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem kan worden
      gevergd. Niet als passende arbeid wordt aangemerkt arbeid op grond van een arbeidsovereenkomst als bedoeld in
      [hoofdstuk 2 van de Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
  - number: '113.3'
    text: Indien bijstand wordt verleend aan gehuwden gelden de verplichtingen bedoeld in het eerste lid voor ieder van hen.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel113
  - number: '113.4'
    text: |-
      Onze Minister kan regels stellen aangaande het toepassen dan wel niet toepassen van een of meer verplichtingen
      genoemd in het eerste lid ten aanzien van een of meer categorieën belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel113
  - number: '113.5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot het begrip passende arbeid bedoeld in
      het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel113
  - number: '114.1'
    text: |-
      Burgemeester en wethouders kunnen de belanghebbende die een scholing of opleiding gaat volgen die noodzakelijk
      wordt geacht voor de inschakeling in de arbeid, ontheffing verlenen van de verplichtingen, bedoeld in
      [artikel 113, eerste lid, onderdelen a en c][ref1], voor ten hoogste de duur en de omvang van die scholing of
      opleiding. Scholing of opleiding wordt slechts noodzakelijk geacht voor de inschakeling in de arbeid, indien
      aantoonbare inspanningen van belanghebbende om arbeid te verkrijgen geen resultaat hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel113
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '113'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '114.2'
    text: |-
      Onze Minister kan regels stellen met betrekking tot het aanmerken van scholing of opleidingen als noodzakelijk voor
      de inschakeling in de arbeid, die bij de beoordeling bedoeld in het eerste lid in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel114
  - number: '114.3'
    text: |-
      Voor de toepassing van het eerste lid wordt als noodzakelijke scholing of opleiding tevens aangemerkt
      de scholing en opleiding, waarvoor de belanghebbende die arbeidsgehandicapte is als bedoeld in de
      [Wet op de (re)integratie arbeidsgehandicapten][ref1] op grond van die wet dan wel op grond van de
      [Wet inschakeling werkzoekenden][ref2] in aanmerking komt en die vooraf aan burgemeester en wethouders is gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009565
      [ref2]: https://wetten.overheid.nl/BWBR0009083
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0009565
      - id: ref2
        bwb_id: BWBR0009083
  - number: '114.4'
    text: |-
      Indien de belanghebbende een scholing of opleiding gaat volgen, anders dan bedoeld in het eerste lid, meldt hij dit
      voor aanvang van die scholing of opleiding aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel114
  - number: 114a
    text: |-
      Burgemeester en wethouders kunnen de belanghebbende die deelneemt aan activiteiten die bijdragen tot sociale
      activering als bedoeld in [artikel 3, eerste lid, onder a, van de Wet inschakeling werkzoekenden][ref1], ontheffing
      verlenen van de verplichting, bedoeld in [artikel 113, eerste lid, onder a][ref2], voor ten hoogste de duur van
      die activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel113
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel114a
    references:
      - id: ref1
        bwb_id: BWBR0009083
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '113'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '115.1'
    text: |-
      Indien de belanghebbende werkzaamheden zonder beloning gaat verrichten dient hij dit zo spoedig mogelijk te melden
      aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel115
  - number: '115.2'
    text: |-
      Voor de belanghebbende die arbeidsgehandicapte is als bedoeld in de
      [Wet op de (re)integratie arbeidsgehandicapten][ref1], die op een proefplaats bij een werkgever gedurende
      maximaal zes maanden onbeloonde werkzaamheden verricht, niet zijnde werkzaamheden als bedoeld in het
      eerste lid, gelden voor de duur van de werkzaamheden op die proefplaats de verplichtingen, genoemd in
      [artikel 113, eerste lid, onderdeel a en c][ref2] niet.


      [ref1]: https://wetten.overheid.nl/BWBR0009565
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel113
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0009565
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '113'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '115.3'
    text: 'De onbeloonde werkzaamheden op een proefplaats zijn:'
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel115
  - number: 115.3.a
    text: werkzaamheden, waartoe de belanghebbende met zijn krachten en bekwaamheden in staat is;
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel115
  - number: 115.3.b
    text: |-
      werkzaamheden, waarbij de werkgever, bij wie de proefplaatsing geschiedt, een aansprakelijkheids- en
      ongevallenverzekering ten behoeve van de werknemer heeft afgesloten;
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel115
  - number: 115.3.c
    text: |-
      werkzaamheden, die de belanghebbende niet reeds eerder onbeloond op een proefplaats bij die werkgever of diens
      rechtsvoorganger heeft verricht.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel115
  - number: 142a
    text: |-
      Het recht tot strafvordering vervalt indien burgemeester en wethouders aan de belanghebbende ter zake van hetzelfde
      feit reeds een boete hebben opgelegd.
    url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#Artikel142a
