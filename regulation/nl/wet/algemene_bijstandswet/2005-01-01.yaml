preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut ! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter vereenvoudiging en verduidelijking van de regelgeving en ter
    versterking van de verantwoordelijkheid der gemeenten voor de verlening van bijstand gewenst is te komen tot een
    herinrichting van de Algemene Bijstandswet (Stb. 1973, 395) en de daarop berustende nadere regels en daartoe een
    nieuwe Algemene bijstandswet vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007333/2005-01-01#ArtikelAanhef
articles:
  - number: '14.1'
    text: |-
      Indien de belanghebbende blijk heeft gegeven van een tekortschietend besef van verantwoordelijkheid
      voor de voorziening in het bestaan, dan wel in de periode voorafgaand aan de bijstandsaanvraag of
      nadien onvoldoende heeft meegewerkt aan het verkrijgen of behouden van arbeid in dienstbetrekking, de
      verplichting, bedoeld in [artikel 65, eerste lid][ref1], of de [artikelen 28, tweede lid][ref2], en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet binnen de door
      burgemeester en wethouders, onderscheidenlijk de Centrale organisatie werk en inkomen daarvoor vastgestelde
      termijn is nagekomen, dan wel een verplichting als bedoeld in [artikel 8, zesde lid, onderdeel b][ref4],
      [artikel 65, tweede of derde lid][ref5], [artikel 70, vierde lid][ref6], of een op grond van [hoofdstuk VIII][ref7]
      aan de bijstand verbonden verplichting niet of niet behoorlijk is nagekomen, weigeren burgemeester en wethouders de
      bijstand tijdelijk geheel of gedeeltelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
