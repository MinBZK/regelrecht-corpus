  - number: '90'
    text: |-
      Onder kosten van bijstand in de zin van deze paragraaf wordt verstaan de door de gemeente betaalde bijstand
      verhoogd met de loonbelasting en de premies volksverzekeringen waarvoor de gemeente die de bijstand verstrekt
      krachtens de [Wet op de loonbelasting 1964][ref1] inhoudingsplichtige is, alsmede met de ziekenfondspremie, voor
      zover deze belasting en premies niet verrekend kunnen worden met de belastingdienst en het Uitvoeringsinstituut
      werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: '92'
    text: >-
      1 Kosten van bijstand worden door de gemeente verhaald in de gevallen en naar de regels aangegeven in dit
      hoofdstuk.


      2 De gemeente kan van verhaal geheel of gedeeltelijk afzien indien daarvoor, gelet op de omstandigheden van degene
      op wie verhaal wordt gezocht of degene die de bijstand ontvangt of heeft ontvangen, dringende redenen aanwezig
      zijn.


      3 Buiten de gevallen aangegeven in dit hoofdstuk vindt geen verhaal plaats.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel92
  - number: '93'
    text: |-
      Kosten van bijstand worden tot de grens van de onderhoudsplicht als bedoeld in
      [Boek 1 van het Burgerlijk Wetboek][ref1] verhaald:

      a. op degene die bij het ontbreken van gezinsverband zijn onderhoudsplicht jegens zijn echtgenoot, of minderjarig
      kind niet of niet behoorlijk nakomt en op het minderjarige kind dat zijn onderhoudsplicht jegens zijn ouders niet
      of niet behoorlijk nakomt;

      b. op degene die zijn onderhoudsplicht na echtscheiding of ontbinding van het huwelijk na scheiding van tafel en
      bed niet of niet behoorlijk nakomt;

      c. op degene die zijn onderhoudsplicht op grond van [artikel 395][ref2] niet of niet behoorlijk nakomt jegens zijn
      meerderjarig kind aan wie bijzondere bijstand is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel395a
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 395a
  - number: 93a
    text: |-
      1 In afwijking van [artikel 93][ref1] kunnen burgemeester en wethouders, op verzoek van degene op wie verhaald
      wordt, besluiten gedeeltelijk af te zien van verhaal van kosten van bijstand voorzover het betreft verschuldigde
      verhaalsbedragen die op het moment van het besluit opeisbaar zijn, indien:

      a. redelijkerwijs te voorzien is dat degene op wie wordt verhaald niet zal kunnen voortgaan met het betalen van
      zijn schulden;

      b. redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen van de overige
      schuldeisers zonder een zodanig besluit niet tot stand zal komen; en

      c. de vordering van de gemeente wegens verhaal van bijstand ten minste zal worden voldaan naar evenredigheid met de
      vorderingen van de schuldeisers van gelijke rang.

      2 Het besluit tot het gedeeltelijk afzien van verhaal treedt niet in werking voordat een schuldregeling
      overeenkomstig het eerste lid tot stand is gekomen.

      3 Het besluit tot het gedeeltelijk afzien van verhaal wordt ingetrokken of ten nadele van de belanghebbende
      gewijzigd indien:

      a. niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling is tot stand gekomen die
      voldoet aan de eisen bedoeld in het eerste lid;

      b. de belanghebbende zijn schuld aan de gemeente niet overeenkomstig de schuldregeling voldoet; of

      c. onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een
      ander besluit zou hebben geleid.

      4 Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel93
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '93'
        hoofdstuk: VII
  - number: '94'
    text: |-
      Een overeenkomst waarbij echtgenoten of gewezen echtgenoten hebben bepaald dat na echtscheiding, scheiding van
      tafel en bed of ontbinding van het huwelijk na scheiding van tafel en bed, de een tegenover de ander in het geheel
      niet dan wel slechts tot een bepaald bedrag tot een uitkering tot diens levensonderhoud zal zijn gehouden, al dan
      niet met het beding bedoeld in [artikel 159 van Boek 1 van het Burgerlijk Wetboek][ref1], staat niet in de weg aan
      verhaal op een der partijen en laat de vaststelling van het te verhalen bedrag onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel159
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '159'
  - number: '95'
    text: |-
      Bij de beoordeling van het bestaan van het verhaalsrecht als bedoeld in [artikel 93][ref1] of [94][ref2] en de
      omvang van het te verhalen bedrag wordt rekening gehouden met de maatstaven die gelden en de omstandigheden die
      van belang zijn in het geval dat de rechter dient te beslissen over de vraag of en, zo ja, tot welk bedrag een
      uitkering tot levensonderhoud na echtscheiding, scheiding van tafel en bed of ontbinding van het huwelijk na
      scheiding van tafel en bed zou moeten worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel94
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '93'
        hoofdstuk: VII
      - id: ref2
