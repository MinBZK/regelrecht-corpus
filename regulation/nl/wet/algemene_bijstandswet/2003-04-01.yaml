  - number: '44'
    text: >-
      Bij de vaststelling van de middelen worden giften van instellingen en personen niet in aanmerking genomen voor
      zover dit, gezien de bestemming en de hoogte van de giften, uit een oogpunt van bijstandsverlening verantwoord is.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel44
  - number: '45'
    text: >-
      1 De middelen worden in aanmerking genomen tot het bedrag dat resteert na aftrek van:


      a. de daarover door de belanghebbende verschuldigde loonbelasting of inkomstenbelasting;


      b. de daarover door de belanghebbende verschuldigde premies volksverzekeringen, premies werknemersverzekeringen en
      ziekenfondspremie dan wel een inhouding die met een of meer van deze premies overeenkomt;


      c. ten laste van de belanghebbende komende verplichte bijdragen ingevolge een pensioenregeling en daarmee
      vergelijkbare regelingen; en


      d. andere ten laste van de belanghebbende komende verplichte inhoudingen.


      2 Bij de bijstandsverlening aan een zelfstandige worden de verschuldigde inkomstenbelasting en premies
      volksverzekeringen over inkomen waarover geen loonbelasting is geheven gesteld op 28  procent van dat inkomen.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel45
  - number: '46'
    text: Onze Minister stelt regels voor het in aanmerking nemen van de aanspraak op vakantietoeslag over een inkomen.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel46
  - number: '47'
    text: |-
      1 Onder inkomen wordt verstaan de op grond van [paragraaf 1][ref1] in aanmerking genomen middelen voor zover deze:

      a. betreffen inkomsten uit of in verband met arbeid, inkomsten uit vermogen, een premie voor het voltooien
      van een scholing of opleiding of voor het aanvaarden of behouden van betaalde arbeid of een subsidie voor het
      onverplicht, in georganiseerd verband, verrichten van onbetaalde maatschappelijk nuttige activiteiten, inkomsten
      uit verhuur, onderverhuur of uit het hebben van een of meer kostgangers, sociale-zekerheidsuitkeringen, uitkeringen
      tot levensonderhoud op grond van [Boek 1 van het Burgerlijk Wetboek][ref2], voorlopige teruggave of teruggave
      van inkomstenbelasting, loonbelasting en premies volksverzekeringen, dan wel naar hun aard met deze inkomsten en
      uitkeringen overeenkomen; en

      b. betrekking hebben op een periode waarover beroep op bijstand wordt gedaan.

      2 Middelen die het karakter hebben van uitgesteld inkomen worden in aanmerking genomen naar de periode waarin deze
      zijn verworven. Middelen die het karakter hebben van doorbetaling van inkomen over een periode worden in aanmerking
      genomen naar de periode waarin deze te gelde kunnen worden gemaakt.

      3 In afwijking van het eerste lid, onderdeel *b*, wordt bij de bijstandsverlening aan een zelfstandige rekening
      gehouden met het inkomen over een boekjaar, zoals dat aan de hand van zijn administratie wordt vastgesteld.
      Een teruggave van inkomstenbelasting en premies volksverzekeringen wordt bij een zelfstandige niet als inkomen
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007333
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002656
  - number: '48'
    text: |-
      1 Indien inkomen in natura in aanmerking wordt genomen wordt de waarde daarvan vastgesteld op de daaruit
      voortvloeiende lagere bestaanskosten.

      2 Het inkomen uit studiefinanciering op grond van de [Wet studiefinanciering 2000][ref1] wordt in aanmerking
      genomen naar het normbedrag voor levensonderhoud waarnaar deze is berekend, met dien verstande dat het normbedrag
      voor levensonderhoud als bedoeld in [artikel 3.2 van die wet][ref2] wordt gesteld op:

      a. voor een thuisinwonende studerende: f 458,43  per kalendermaand;

      b. voor een uitwonende studerende: f 823,58  per kalendermaand.

      3 De tegemoetkoming in de onderwijsbijdrage en de schoolkosten op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref3] wordt in aanmerking genomen naar
      het normbedrag voor de basistoelage, bedoeld in [artikel 4.3 van die wet][ref4].

      4 Indien de belanghebbende de woning bewoont met een of meer huurders, onderhuurders of kostgangers, worden de
      daaruit voortvloeiende lagere algemene noodzakelijke kosten van het bestaan als inkomen in aanmerking genomen voor
      zover burgemeester en wethouders daarmee nog geen rekening hebben gehouden bij de vaststelling van de verhoging of
      verlaging van de bijstandsnorm als bedoeld in [afdeling 1, paragraaf 3][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3.2
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0012438#Artikel4.3
      [ref5]: https://wetten.overheid.nl/BWBR0007333#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
