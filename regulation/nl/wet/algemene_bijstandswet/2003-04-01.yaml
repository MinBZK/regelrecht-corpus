  - number: '80'
    text: |-
      Burgemeester en wethouders vorderen een ingevolge [artikel 74][ref1] verleend voorschot terug van de belanghebbende
      voor zover zij na onderzoek vaststellen dat over de betrokken periode geen recht op bijstand bestaat.


