        paragraaf: '2'
  - number: '101'
    text: >-
      Degene op wie verhaal wordt gezocht is verplicht desgevraagd aan burgemeester en wethouders de inlichtingen te
      verstrekken die voor verhaal ingevolge dit hoofdstuk van belang zijn.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel101
  - number: '102'
    text: |-
      1 Het besluit tot verhaal ingevolge dit hoofdstuk, anders dan met toepassing van [artikel 96][ref1], wordt
      door de gemeente aan degene op wie verhaal wordt gezocht medegedeeld. Daarbij wordt het bedrag of worden de
      bedragen genoemd waarvan, alsmede de termijn of termijnen waarbinnen, betaling wordt verlangd. Bij verhaal op de
      nalatenschap kan de mededeling worden gericht tot de langstlevende echtgenoot of een der erfgenamen die geacht kan
      worden bij de afwikkeling van de nalatenschap te zijn betrokken.

      2 Indien de belanghebbende niet uit eigen beweging bereid is de verlangde gelden aan de gemeente te betalen dan wel
      niet of niet tijdig tot betaling daarvan overgaat, besluiten burgemeester en wethouders tot verhaal in rechte.

      3 [Artikel 120][ref2] is met betrekking tot de bevoegdheid van burgemeester en wethouders van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel120
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '96'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '120'
        hoofdstuk: IX
        paragraaf: '1'
  - number: '103'
    text: |-
      1 Verzoekschriften met betrekking tot verhaal in rechte ingevolge dit hoofdstuk, alsmede verzoeken tot wijziging
      van een rechterlijke verhaalsuitspraak, worden ingediend bij de rechtbank.

      2 Op de indiening en behandeling van het verzoekschrift, alsmede op de procedure in hoger beroep, zijn
      de [artikelen 799, tweede lid][ref1], en [801 van het Wetboek van Burgerlijke Rechtsvordering][ref2] van
      overeenkomstige toepassing.

      3 De gemeente kan op grond van dit hoofdstuk in rechte optreden zonder procureur.

      4 De gemeente is geen vast recht en geen vergoeding voor de deurwaarder verschuldigd, met uitzondering van het
      uitbrengen van exploiten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel799
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel801
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel103
