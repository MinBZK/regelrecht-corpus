  - number: '69'
    text: |-
      1 Indien de belanghebbende de voor de verlening van bijstand van belang zijnde gegevens of de gevorderde
      bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en hem dit te verwijten valt, dan wel indien de
      belanghebbende anderszins onvoldoende medewerking verleent aan het onderzoek, schorten burgemeester en wethouders
      het recht op bijstand op:

      a. vanaf de eerste dag van de periode waarop het verzuim betrekking heeft, of

      b. vanaf de dag van het verzuim indien niet kan worden bepaald op welke periode dit verzuim betrekking heeft.

      2 Burgemeester en wethouders doen mededeling van de opschorting aan de belanghebbende en nodigen hem uit binnen een
      door hen te stellen termijn het verzuim te herstellen.

      3 Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van bijstand en terzake van weigering van bijstand, herzien burgemeester en wethouders een dergelijk besluit of
      trekken zij dat in:

      a. indien een gedraging als bedoeld in [artikel 14, eerste lid][ref1], of het niet of niet behoorlijk nakomen
      van de verplichting, bedoeld in [artikel 65, eerste lid,][ref2] of de [artikelen 28, tweede lid,][ref3] en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4], heeft geleid tot het ten
      onrechte of tot een te hoog bedrag verlenen van bijstand;

      b. indien anderszins de bijstand ten onrechte of tot een te hoog bedrag is verleend.

      4 Als de belanghebbende in het geval bedoeld in het eerste lid het verzuim niet herstelt binnen de daarvoor
      gestelde termijn, trekken burgemeester en wethouders na het verstrijken van deze termijn het besluit tot toekenning
      van bijstand in met ingang van de eerste dag waarover het recht op bijstand is opgeschort.

      5 Indien daarvoor dringende redenen aanwezig zijn kunnen burgemeester en wethouders besluiten geheel of
      gedeeltelijk van herziening of intrekking af te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel29
