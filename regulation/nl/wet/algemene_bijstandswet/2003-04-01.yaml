  - number: 63a
    text: |-
      1 De aanvraag is gericht tot burgemeester en wethouders en wordt overeenkomstig
      [artikel 28 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] ingediend bij de Centrale organisatie
      werk en inkomen. Na de overdracht van de aanvraag door de Centrale organisatie werk en inkomen aan burgemeester
      en wethouders ingevolge [artikel 28, derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2]
      wordt de aanvraag verder behandeld door burgemeester en wethouders.

      2 Indien het een aanvraag betreft van andere dan algemene bijstand of van algemene bijstand aan personen die
      in een inrichting verblijven, aan personen van 65 jaar of ouder, aan personen zonder adres als bedoeld in
      [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref3] of aan zelfstandigen, wordt, in
      afwijking van het eerste lid, de aanvraag ingediend bij burgemeester en wethouders.

      3 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat ook andere aanvragen dan in het tweede lid
      bedoeld, in afwijking van het eerste lid, bij burgemeester en wethouders worden ingediend.

      4 Het gemeentebestuur kan, in overeenstemming met de Centrale organisatie werk en inkomen, bij verordening
      categorieën van aanvragen vaststellen die, in afwijking van het tweede of derde lid, bij de Centrale organisatie
      werk en inkomen worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel1
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel63a
