  - number: '115'
    text: |-
      1 Indien de belanghebbende werkzaamheden zonder beloning gaat verrichten dient hij dit zo spoedig mogelijk te
      melden aan burgemeester en wethouders.

      2 Voor de belanghebbende die arbeidsgehandicapte is als bedoeld in de
      [Wet op de (re)integratie arbeidsgehandicapten][ref1], die op een proefplaats bij een werkgever gedurende
      maximaal zes maanden onbeloonde werkzaamheden verricht, niet zijnde werkzaamheden als bedoeld in het
      eerste lid, gelden voor de duur van de werkzaamheden op die proefplaats de verplichtingen, genoemd in
      [artikel 113, eerste lid, onderdeel a en c][ref2] niet.

      3 De onbeloonde werkzaamheden op een proefplaats zijn:

      a. werkzaamheden, waartoe de belanghebbende met zijn krachten en bekwaamheden in staat is;

      b. werkzaamheden, waarbij de werkgever, bij wie de proefplaatsing geschiedt, een aansprakelijkheids- en
      ongevallenverzekering ten behoeve van de werknemer heeft afgesloten;

      c. werkzaamheden, die de belanghebbende niet reeds eerder onbeloond op een proefplaats bij die werkgever of diens
      rechtsvoorganger heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009565
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel113
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel115
