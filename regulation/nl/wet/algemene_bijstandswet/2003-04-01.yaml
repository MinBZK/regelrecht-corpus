        artikel: '39'
        hoofdstuk: IV
        afdeling: '2'
  - number: '42'
    text: |-
      Tot de middelen worden alle vermogens- en inkomensbestanddelen gerekend waarover de alleenstaande of
      het gezin beschikt of redelijkerwijs kan beschikken. Tot de middelen, bedoeld in de eerste zin, behoort
      in elk geval de ten aanzien van de alleenstaande of het gezin toepasselijke heffingskorting, bedoeld in
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '8'
  - number: '43'
    text: |-
      1 Tot de middelen van de belanghebbende worden mede de middelen gerekend die ten behoeve van zijn levensonderhoud
      door een niet in de bijstand begrepen persoon worden ontvangen.

      2 Niet tot de middelen van de belanghebbende worden gerekend:

      a. de middelen die deze ontvangt ten behoeve van het levensonderhoud van een niet in de bijstand begrepen persoon;

      b. kinderbijslag ontvangen ten behoeve van zijn in of buiten Nederland woonachtige kinderen;

      c. de kinderkorting en de aanvullende kinderkorting, bedoeld in
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref1];

      d. huursubsidie ontvangen op grond van de [Huursubsidiewet][ref2], of een bijzondere bijdrage in de huurlasten
      ontvangen op grond van [artikel 26b van die wet][ref3];

      e. vergoedingen en tegemoetkomingen voor, alsmede de vermindering of teruggave van, loonbelasting of
      inkomstenbelasting en van premies volksverzekeringen op grond van kosten die niet tot de algemeen noodzakelijke
      bestaanskosten behoren, tenzij voor deze kosten bijstand wordt verleend;

      f. vrije vergoedingen en vrije verstrekkingen als bedoeld in
      [Hoofdstuk IIA van de Wet op de loonbelasting 1964][ref4], tenzij voor deze vergoedingen en verstrekkingen bijstand
      wordt verleend;

      g. inkomsten uit arbeid van de tot zijn last komende kinderen, alsmede door hen ontvangen werkloosheids- en
      arbeidsongeschiktheidsuitkeringen, tenzij het de verlening van bijzondere bijstand betreft voor bijzondere
      noodzakelijke kosten van het bestaan van die kinderen;

      h. rente ontvangen over op grond van [artikel 52, eerste lid, onderdelen b, c en d][ref5], niet in aanmerking
      genomen vermogen en spaargelden;

      i. een eenmalige premie voor het voltooien van een scholing of opleiding als bedoeld in [artikel 114][ref6], voor
      zover een bedrag van f 2670,-  niet wordt overschreden;

      j. premies die al dan niet eenmalig boven het rechtens geldende loon worden verstrekt voor het aanvaarden of
      behouden van arbeid, voor zover deze premies binnen een tijdvak van een jaar te zamen minder bedragen dan f 3970 ;

      k. een uitkering in verband met geleden immateriële schade voor zover dit, gelet op de aard en de hoogte van de
      uitkering, uit een oogpunt van bijstandsverlening verantwoord is;

      l. de eenmalige uitkering toegekend aan oud-mijnwerkers in verband met silicose;

      m. inkomsten uit arbeid tot f 181,-  per maand, alsmede de helft van het meerdere tot een maximum van in totaal f
      332,-  per maand, beide voor zover hij algemene bijstand ontvangt en behoort tot een categorie van personen voor
      wie een of meer van de verplichtingen bedoeld in [artikel 113, eerste lid][ref7], niet gelden op grond van het
      bepaalde bij of krachtens de [ artikelen 107, tweede lid][ref8], of [113, vierde lid][ref9];

      n. inkomsten uit arbeid tot f 181,-  per maand, alsmede de helft van het meerdere tot een maximum van in totaal f
      332,-  per maand, beide voor zover hij algemene bijstand ontvangt en hij behoort tot een categorie van personen die
      overeenkomstig een verordening van het gemeentebestuur om redenen van medische of sociale aard is aangewezen op het
      verrichten van arbeid in deeltijd;

      o. de eenmalige uitkering ingevolge de
      [Uitkeringswet tegemoetkoming twee tot vijfjarige diensttijd veteranen][ref10];

      p. subsidies die op grond van [artikel 3 van de Wet inschakeling werkzoekenden][ref11] worden verstrekt voor het
      onverplicht, in georganiseerd verband, verrichten van onbetaalde maatschappelijk nuttige activiteiten, voorzover
      deze subsidies:

      1°. binnen een tijdvak van een kalendermaand minder bedragen dan f 165,- ; en,

      2°. worden verstrekt aan een langdurig werkloze als bedoeld in
      [artikel 1, eerste lid, onder e, van de Wet inschakeling werkzoekenden][ref12], dan wel aan een belanghebbende,
      die behoort tot een categorie van personen voor wie een of meer van de verplichtingen, bedoeld in
      [artikel 113, eerste lid][ref13], niet gelden op grond van de [artikelen 107, eerste en tweede lid][ref14],
      [113, vierde lid][ref15], of [114a][ref16];

      q. eigenwoningbijdrage of een bijzondere bijdrage ontvangen op grond van de
      [Wet bevordering eigenwoningbezit][ref17];

      r. individuele uitkeringen in het kader van tegoeden Tweede Wereldoorlog aan leden van de Joodse, Sinti, Roma en
      Indische gemeenschappen.

      3 Een uitkering tot levensonderhoud op grond van [Boek 1 van het Burgerlijk Wetboek][ref18] die de belanghebbende
      jonger dan 21 jaar van zijn ouder of ouders ontvangt, wordt niet tot de middelen van de belanghebbende gerekend
      voor zover deze uitkering op grond van [artikel 10][ref19] reeds in aanmerking is genomen bij de vaststelling van
      het recht op bijzondere bijstand.

      4 Onze Minister kan regels stellen omtrent de gevallen waarin:

      a. het tweede lid, onderdeel j of n, niet van toepassing is;

      b. een uitkering als bedoeld in het tweede lid, onderdeel k, niet tot de middelen van de belanghebbende gerekend
      wordt.


