  - number: '39'
    text: |-
      1 Onverminderd [hoofdstuk II][ref1] heeft de alleenstaande of het gezin recht op bijzondere bijstand voor zover
      de alleenstaande of het gezin niet beschikt over de middelen om te voorzien in de uit bijzondere omstandigheden
      voortvloeiende noodzakelijke kosten van het bestaan en deze kosten naar het oordeel van burgemeester en wethouders
      niet kunnen worden voldaan uit de bijstandsnorm bedoeld in [afdeling 1, paragraaf 2][ref2] en [3][ref3], en de
      aanwezige draagkracht.

      2 In afwijking van [artikel 6, onderdeel ][ref4], kan bijzondere bijstand ook aan een persoon, behorend tot een
      bepaalde categorie, worden verleend, zonder dat behoeft te worden nagegaan of ten aanzien van die persoon de hierna
      bedoelde kosten ook daadwerkelijk noodzakelijk zijn of gemaakt zijn, indien ten aanzien van de categorie waartoe
      hij behoort aannemelijk is dat die zich in bijzondere omstandigheden bevindt die leiden tot bepaalde noodzakelijke
      kosten van bestaan waarin de algemene bijstand niet voorziet en die de aanwezige draagkracht te boven gaan.

      3 Voorzover de gemeente krachtens de [Wet op de loonbelasting 1964][ref5] inhoudingsplichtige is, wordt de bijstand
      verhoogd met de loonbelasting en premies volksverzekeringen, alsmede met de over die bijstand verschuldigde
      ziekenfondspremie.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0007333#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0007333#HoofdstukIV
      [ref4]: https://wetten.overheid.nl/BWBR0007333#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0002471
