  - number: '9'
    text: |-
      1 Geen recht op bijstand heeft degene:

      a. aan wie rechtens zijn vrijheid is ontnomen;

      b. die zijn militaire of vervangende dienstplicht vervult;

      c. die wegens werkstaking of uitsluiting niet deelneemt aan de arbeid, voor zover diens gebrek aan middelen daarvan
      het gevolg is;

      d. die in Nederland zijn woonplaats heeft doch die, langer dan de gebruikelijke vakantieduur, verblijf houdt buiten
      Nederland;

      e. die jonger is dan 18 jaar.

      2 Geen recht op algemene bijstand heeft degene:

      a. van 18, 19 of 20 jaar die in een inrichting verblijft;

      b. die onderwijs of een beroepsopleiding volgt als bedoeld in de [Wet studiefinanciering 2000][ref1] of in
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2];

      c. wiens voor werkzaamheden beschikbare tijd voor ten minste 19 uur per week in beslag wordt genomen door of in
      verband met het volgen van onderwijs of van een beroepsopleiding, tenzij het betreft een scholing of opleiding als
      bedoeld in [artikel 113, eerste lid, onderdeel e][ref3], dan wel een scholing of opleiding als voorziening op grond
      van de [Wet inschakeling werkzoekenden][ref4];

      d. die uitkering op grond van de Wet inkomensvoorziening kunstenaars ontvangt of die gehuwd is met een persoon die
      een zodanige uitkering ontvangt.

      e. die onbetaald verlof geniet als bedoeld in [artikel 1, onderdeel i, van de Werkloosheidswet][ref5] of die
      gehuwd is met een zodanig persoon, voorzover diens gebrek aan middelen daarvan het gevolg is, tenzij belanghebbende
      alleenstaande ouder is voor wie de verplichtingen op grond van [artikel 107, tweede lid][ref6], niet gelden en hij
      verlof geniet als bedoeld in [artikel 644 van Boek 7 van het Burgerlijk Wetboek][ref7].

      3 Onze Minister kan regels stellen omtrent hetgeen wordt verstaan onder de gebruikelijke vakantieduur genoemd in
      het eerste lid, onderdeel *d*.

      4 Het eerste lid, onderdeel a, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen
      categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel
      plaatsvindt buiten een penitentiaire inrichting, een inrichting voor verpleging van ter beschikking
      gestelden, of een inrichting voor justitiële jeugdbescherming zijnde een landelijke voorziening als bedoeld in
      [artikel 65 van de Wet op de jeugdhulpverlening][ref8].


