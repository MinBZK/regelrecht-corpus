  - number: '87'
    text: |-
      1 Het besluit tot terugvordering levert een executoriale titel op in de zin van het [Tweede Boek van het Wetboek
      van Burgerlijke Rechtsvordering](onbekend).

      2 [Artikel 14f][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref2] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan, burgemeester en wethouders de
      aflossingsbedragen lager vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel14f
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
