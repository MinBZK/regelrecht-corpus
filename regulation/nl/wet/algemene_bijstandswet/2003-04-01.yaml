  - number: '36'
    text: |-
      1 Burgemeester en wethouders kunnen de bijstandsnorm of de toeslag, bedoeld in [artikel 33][ref1] lager vaststellen
      voor de belanghebbende die recent de deelname heeft beëindigd aan onderwijs of een beroepsopleiding:

      a. indien voor het onderwijs of de beroepsopleiding aanspraak bestond op studiefinanciering op grond van de
      [Wet studiefinanciering 2000][ref2], op een tegemoetkoming in de onderwijsbijdrage en de schoolkosten op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref3], dan wel;

      b. indien de belanghebbende op de eerste dag van het kalenderkwartaal waarin de beëindiging plaatsvond jonger
      was dan 25 jaar en de voor werkzaamheden beschikbare tijd voor ten minste 19 uur per week in beslag werd
      genomen door het onderwijs of de beroepsopleiding, tenzij het betreft een scholing of opleiding als bedoeld in
      [artikel 113, eerste lid, onderdeel e][ref4], dan wel een scholing of opleiding als voorziening op grond van de
      [Wet inschakeling werkzoekenden][ref5].

      2 Van een recente beëindiging van de deelname aan onderwijs of beroepsopleiding als bedoeld in het eerste lid, is
      sprake zolang nog geen periode van een half jaar is verstreken, gerekend vanaf het tijdstip van die beëindiging.

      3 De in het eerste lid bedoelde verlaging vindt bij voorrang plaats op de toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel33
