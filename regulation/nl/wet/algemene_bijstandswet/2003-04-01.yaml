        artikel: '94'
        hoofdstuk: VII
  - number: '96'
    text: |-
      1 Indien een rechterlijke uitspraak betreffende levensonderhoud verschuldigd krachtens
      [Boek 1 van het Burgerlijk Wetboek][ref1] die uitvoerbaar is, niet wordt nagekomen, wordt verhaald in
      overeenstemming met deze uitspraak.

      2 Het besluit tot verhaal overeenkomstig het eerste lid wordt bij brief medegedeeld aan degene op wie wordt
      verhaald, met de aanmaning het verschuldigde binnen dertig dagen na verzending van de brief te voldoen.

      3 Degene op wie wordt verhaald kan binnen de termijn van het tweede lid tegen het besluit in verzet komen door een
      verzoekschrift aan de rechtbank. Het verzet kan niet gegrond zijn op de bewering dat de uitkering tot onderhoud
      ten onrechte is opgelegd of onjuist is vastgesteld. Indien tijdig verzet is gedaan wordt de invordering eerst
      voortgezet zodra het verzet is ingetrokken of ongegrond verklaard.

      4 Indien aan de aanmaning geen gevolg wordt gegeven is de gemeente, met uitsluiting van degene die de bijstand
      ontvangt, bevoegd tot invordering van het verschuldigde over te gaan.

      5 Het besluit tot verhaal levert een executoriale titel op, die op kosten van de schuldenaar wordt betekend
      en met toepassing van de voorschriften van het [Wetboek van Burgerlijke Rechtsvordering][ref2] kan worden
      tenuitvoergelegd.

      6 De betekening en tenuitvoerlegging van het besluit kan geschieden door de deurwaarder, bedoeld in
      [artikel 231, tweede lid, onderdeel ][ref3]. [Artikel 256 van de Gemeentewet][ref4] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0001827
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel231
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel256
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel96
