  - number: '89'
    text: |-
      1 De vorderingen ingevolge deze paragraaf zijn bevoorrecht en volgen onmiddellijk na die in
      [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref1] omschreven.

      2 Indien de kosten op verschillende tijdstippen zijn gemaakt, heeft de terugvordering van de eerstgemaakte kosten
      voorrang.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel288
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel89
