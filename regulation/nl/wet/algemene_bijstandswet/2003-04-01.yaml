    text: >-
      1 In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:


      a. echtgenoot: geregistreerde partner;


      b. echtgenoten: geregistreerde partners;


      c. huwelijk: geregistreerd partnerschap;


      d. gehuwd: als partner geregistreerd;


      e. gehuwde: als partner geregistreerde;


      f. gehuwden: als partners geregistreerden;


      g. echtscheiding: beëindiging van een geregistreerd partnerschap anders dan door de dood of vermissing.


      2 In deze wet en de daarop berustende bepalingen wordt:


      a. als gehuwd of als echtgenoot mede aangemerkt de ongehuwde die met een ander een gezamenlijke huishouding voert,
      tenzij het betreft een bloedverwant in de eerste graad;


      b. als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.


      3 Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben
      en zij blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de
      huishouding dan wel anderszins.


      4 Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de belanghebbenden hun hoofdverblijf
      hebben in dezelfde woning en:


      a. zij met elkaar gehuwd zijn geweest of eerder voor de verlening van bijstand als gehuwden zijn aangemerkt;


      b. uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;


      c. zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of


      d. zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het derde lid.


      5 Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vierde lid, onderdeel *d*.


      6 Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel3
  - number: '4'
    text: >-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:


      a. alleenstaande: de ongehuwde die geen tot zijn last komende kinderen heeft en geen gezamenlijke huishouding voert
      met een ander tenzij het betreft een bloedverwant in de eerste graad;


      b. alleenstaande ouder: de ongehuwde die de volledige zorg heeft voor een of meer tot zijn last komende kinderen en
      geen gezamenlijke huishouding voert met een ander tenzij het betreft een bloedverwant in de eerste graad;


      c. gezin:


      1°. de gehuwden tezamen;


      2°. de gehuwden met de tot hun last komende kinderen;


      3°. de alleenstaande ouder met de tot zijn last komende kinderen;


      d. kind: het in Nederland woonachtige eigen kind of stiefkind;


      e. ten laste komend kind: het kind jonger dan 18 jaar voor wie de alleenstaande ouder of de gehuwde aanspraak op
      kinderbijslag kan maken.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel4
  - number: '5'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      zelfstandige: de belanghebbende van 18 tot 65 jaar, die voor de voorziening in het bestaan is aangewezen op arbeid
      in het eigen bedrijf of zelfstandig beroep hier te lande en die:

      1°. voldoet aan de wettelijke vereisten voor de uitoefening daarvan;

      2°. voldoet aan het urencriterium, bedoeld in [artikel 3.6 van de Wet inkomstenbelasting 2001][ref1]; en

      3°. alleen of samen met degenen met wie hij het bedrijf of zelfstandig beroep uitoefent de volledige zeggenschap in
      dat bedrijf of zelfstandig beroep heeft en de financiële risico’s daarvan draagt.

      2 Onder een woning wordt mede verstaan een woonwagen en een woonschip.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.6
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel5
