        hoofdstuk: VII
  - number: '97'
    text: |-
      1 Het door de rechter vastgestelde verhaalsbedrag verschuldigd ingevolge [artikel 93][ref1] of [94][ref2] wordt
      jaarlijks met ingang van 1 januari van rechtswege gewijzigd met het ingevolge [artikel 402][ref3] vast te stellen
      percentage.

      2 De toepassing van het eerste lid blijft achterwege indien de wijziging van rechtswege bij rechterlijke uitspraak
      is uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel402a
