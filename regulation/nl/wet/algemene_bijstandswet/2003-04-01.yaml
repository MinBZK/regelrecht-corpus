    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. burgemeester en wethouders: burgemeester en wethouders van de gemeente, bedoeld in [artikel 63][ref1];

      c. Centrale organisatie werk en inkomen: de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      d. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3];

      e. Sociale verzekeringsbank: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4];

      f. het Inlichtingenbureau: het Inlichtingenbureau, bedoeld in
      [artikel 63 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5];

      g. inrichting:

      1°. een instelling die zich blijkens haar doelstelling en feitelijke werkzaamheden richt op het bieden van
      verpleging of verzorging aan aldaar verblijvende hulpbehoevenden;

      2°. een instelling die zich blijkens haar doelstelling en feitelijke werkzaamheden richt op het bieden van
      slaapgelegenheid, waarbij de mogelijkheid van hulpverlening of begeleiding gedurende meer dan de helft van ieder
      etmaal aanwezig is.


