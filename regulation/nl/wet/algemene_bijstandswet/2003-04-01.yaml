  - number: 96a
    text: |-
      1 Indien degene, die bijstand ontvangt of heeft ontvangen en ten aanzien van wie door de rechter een verhaalsbedrag
      verschuldigd ingevolge [artikel 93][ref1] of [94][ref2] is vastgesteld, zijn woonplaats verplaatst naar een
      andere gemeente en aldaar bijstand ontvangt of heeft ontvangen, gaat de bevoegdheid tot tenuitvoerlegging van de
      rechterlijke uitspraak op de andere gemeente over.

      2 De vertrekgemeente blijft bevoegd tot tenuitvoerlegging voor zover het gaat om betalingsachterstanden terzake van
      verhaal van bijstand die door die gemeente is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel94
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel96a
