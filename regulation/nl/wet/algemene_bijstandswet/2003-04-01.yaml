  - number: '116'
    text: De uitvoering van deze wet berust bij burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel116
  - number: '117'
    text: >-
      1 Burgemeester en wethouders voeren ten behoeve van een getrouwe weergave van de uitvoering en een effectief
      uitvoeringsproces een zodanige administratie dat de juiste, volledige en tijdige vastlegging zijn gewaarborgd van:


      a. de besluiten over aanvragen, onderzoeken, uitkeringen, vorderingen en verplichtingen en de hieruit
      voortvloeiende betalingen en ontvangsten;


      b. de hierop betrekking hebbende bescheiden;


      c. het onderzoek dat is verricht naar de juistheid en de volledigheid van de verstrekte gegevens en de overgelegde
      bescheiden.


      2 Onze Minister stelt, na overleg met Onze Minister van Binnenlandse Zaken, regels aangaande de in het eerste lid
      bedoelde administratie.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel117
  - number: '118'
    text: |-
      1 Het gemeentebestuur draagt zorg voor de totstandkoming van een plan en een beleidsverslag, als bedoeld in
      [artikel 110 van de Gemeentewet][ref1], gericht op:

      a. de bevordering van een rechtmatige en doelmatige uitvoering van de wet, waaronder de bestrijding van het ten
      onrechte ontvangen van bijstand alsmede van misbruik en oneigenlijk gebruik van de wet;

      b. de bevordering van de zelfstandige bestaansvoorziening door middel van inschakeling van arbeid in
      dienstbetrekking;

      c. de uitbesteding van taken met betrekking tot de inschakeling in het arbeidsproces van bijstandsgerechtigden; en

      d. de realisatie en de vormgeving van cliëntenparticipatie bij de uitvoering van de wet met inachtneming van
      [artikel 150 van de Gemeentewet][ref2].

      2 Het in het eerste lid bedoelde plan en beleidsverslag worden, in afwijking van
      [artikel 110, derde lid, van de Gemeentewet][ref3], elk kalenderjaar vastgesteld.

      3 Het deel van het plan, bedoeld in het eerste lid, onderdeel *a*, bevat ten minste een beschrijving van de wijze
      waarop burgemeester en wethouders:

      a. toepassing geven aan [artikel 66, eerste tot en met vierde lid][ref4], en [artikel 122][ref5];

      b. zorg dragen voor een toereikende controle op het nakomen van de verplichting, bedoeld in
      [artikel 65, eerste lid][ref6], en voor de strafrechtelijke of bestuursrechtelijke afdoening in geval van niet
      nakoming van deze verplichting.

      4 Het deel van het plan, bedoeld in het eerste lid, onderdeel *b*, bevat ten minste een beschrijving van de wijze
      waarop toepassing wordt gegeven aan de samenwerking als bedoeld in [artikel 111, tweede lid][ref7], en de daarover
      gemaakte afspraken.

      5 Onze Minister kan nadere regels stellen omtrent de voorwaarden waaraan het plan en het beleidsverslag dienen te
      voldoen, indien daarmee tevens een gebruik ten behoeve van het toezicht wordt beoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel150
