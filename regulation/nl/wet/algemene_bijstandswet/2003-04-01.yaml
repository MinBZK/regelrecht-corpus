        artikel: 402a
  - number: '98'
    text: |-
      1 Het door de rechter vastgestelde verhaalsbedrag kan op verzoek van de gemeente of van degene op wie verhaal wordt
      uitgeoefend door de rechter worden gewijzigd op grond van gewijzigde omstandigheden.

      2 De gemeente kan aan de rechter verzoeken het verhaalsbedrag in afwijking van een rechterlijke uitspraak
      betreffende levensonderhoud verschuldigd krachtens [Boek 1 van het Burgerlijk Wetboek][ref1] vast te stellen,
      indien de rechter:

      a. deze uitspraak zou kunnen wijzigen op de gronden genoemd in de[artikelen 157][ref2] en [401 van dat boek][ref3];

      b. geen rekening heeft kunnen houden met alle voor de betrokken beslissing in aanmerking komende gegevens en
      omstandigheden betreffende beide partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel401
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel98
