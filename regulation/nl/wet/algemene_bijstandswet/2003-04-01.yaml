  - number: '126'
    text: |-
      1 In de administratie van de gemeente en van het Inlichtingenbureau terzake van de uitvoering van deze wet wordt
      het sociaal-fiscaalnummer opgenomen waaronder een natuurlijk persoon is geregistreerd bij de rijksbelastingdienst.

      2 Bij de verstrekking van gegevens door burgemeester en wethouders, het Inlichtingenbureau en de in
      [artikel 122][ref1] en [125][ref2] genoemde organen en personen wordt, indien daartoe bevoegd, gebruik gemaakt van
      dit sociaal-fiscaalnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel125
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel126
