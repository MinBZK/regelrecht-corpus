  - number: '55'
    text: |-
      1 In deze afdeling wordt onder netto minimumloon verstaan het minimumloon per maand, genoemd in
      [artikel 8, eerste lid, onderdeel ][ref1], verhoogd met de aanspraak op vakantiebijslag waarop een werknemer
      op grond van [artikel 15 van die wet][ref2] over dat minimumloon ten minste aanspraak kan maken, na aftrek
      van de daarvan in te houden loonbelasting, premies volksverzekeringen, premies werknemersverzekeringen en het
      werknemersaandeel in de ziekenfondspremie.

      2 De in het eerste lid bedoelde loonbelasting en premies volksverzekeringen worden berekend voor een werknemer,
      jonger dan 65 jaar, rekening houdend met uitsluitend tweemaal de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref3], over het minimumloon en de aanspraak op vakantiebijslag
      daarover, vermeerderd met het werkgeversaandeel in de ziekenfondspremie en verminderd met de premies
      werknemersverzekeringen. De loonbelasting en de premies volksverzekeringen in te houden van de aanspraak op
      vakantiebijslag over het minimumloon, worden berekend met toepassing van de tabel voor bijzondere beloningen waarin
      de arbeidskorting, bedoeld in [artikel 22a van de Wet op de loonbelasting 1964][ref4], niet is verwerkt.

      3 Indien ingevolge een van de sociale verzekeringswetten een premie wordt ingehouden waarvan het percentage
      per bedrijfstak verschilt, wordt met inachtneming van bij algemene maatregel van bestuur te stellen regels bij
      ministeriële regeling voor de toepassing van het eerste lid een gemiddeld percentage vastgesteld.

      4 Onder prijsindexcijfer van de gezinsconsumptie, wordt in deze afdeling verstaan hetgeen daaronder in
      [artikel 13, zesde lid, van de Algemene Kinderbijslagwet][ref5] wordt verstaan.


