        artikel: '100'
        hoofdstuk: VII
  - number: '105'
    text: |-
      De[artikelen 14][ref1], [89][ref2] en [90][ref3] zijn met betrekking tot het verhaal van kosten van bijstand van
      overeenkomstige toepassing, met dien verstande dat [artikel 479][ref4] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel14f
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel89
