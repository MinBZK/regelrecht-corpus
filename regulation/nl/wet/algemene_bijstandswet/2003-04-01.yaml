        afdeling: '1'
  - number: '49'
    text: >-
      Indien de alleenstaande, de alleenstaande ouder of een van de echtgenoten 65 jaar of ouder is, wordt voor de
      vaststelling van de hoogte van de bijstand een in de vorm van een periodieke uitkering ontvangen particuliere
      oudedagsvoorziening buiten beschouwing gelaten tot een bedrag van:


      a. voor een alleenstaande en een alleenstaande ouder: f 28,35  per kalendermaand;


      b. voor de gehuwden tezamen: f 56,70  per kalendermaand.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel49
  - number: '50'
    text: |-
      1 Indien een van de gehuwden geen recht op algemene bijstand heeft, wordt zijn inkomen slechts in aanmerking
      genomen voor zover het inkomen van de gehuwden te zamen, met inbegrip van de bijstand die zou worden verleend
      indien zijn inkomen niet in aanmerking wordt genomen, meer zou bedragen dan de op grond van [afdeling 1][ref1] vast
      te stellen bijstandsnorm voor gehuwden.

      2 In afwijking van het eerste lid wordt, indien de gehuwden gescheiden leven, doch niet duurzaam gescheiden, het
      inkomen van de niet-rechthebbende echtgenoot slechts in aanmerking genomen voor zover het de bijstandsnorm bedoeld
      in [afdeling 1, paragraaf 2][ref2] en 3 te boven gaat.

      3 Voor de vaststelling van de bijstandsnorm bedoeld in het eerste lid is [artikel 36][ref3] van overeenkomstige
      toepassing indien de niet-rechthebbende echtgenoot:

      a. onderwijs of een beroepsopleiding volgt op grond waarvan aanspraak bestaat op studiefinanciering op grond van
      de [Wet studiefinanciering 2000][ref4], op een tegemoetkoming in de onderwijsbijdrage en de schoolkosten ingevolge
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref5], dan wel;

      b. jonger is dan 25 jaar en de voor werkzaamheden beschikbare tijd voor ten minste 19 uur per week in beslag wordt
      genomen door het onderwijs of de beroepsopleiding, tenzij het betreft een scholing of opleiding als bedoeld in
      [artikel 113, eerste lid, onderdeel e][ref6], dan wel een scholing of opleiding als voorziening op grond van de
      [Wet inschakeling werkzoekenden][ref7].

      4 Voor de vaststelling van het inkomen van de niet-rechthebbende echtgenoot is deze afdeling van overeenkomstige
      toepassing.


