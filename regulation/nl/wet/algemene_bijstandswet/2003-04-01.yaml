  - number: '52'
    text: |-
      1 Niet als vermogen wordt in aanmerking genomen:

      a. bezittingen in natura die naar hun aard en waarde algemeen gebruikelijk zijn dan wel, gelet op de omstandigheden
      van persoon en gezin, noodzakelijk zijn;

      b. het bij de aanvang van de bijstand aanwezige vermogen voorzover dit minder bedraagt dan de toepasselijke
      vermogensgrens, genoemd in [artikel 54][ref1];

      c. vermogen ontvangen tijdens de periode waarover beroep op bijstand wordt gedaan, tot het bedrag dat het bij de
      aanvang van de bijstandsverlening aanwezige vermogen minder bedroeg dan de toepasselijke vermogensgrens, genoemd
      in [artikel 54][ref2];

      d. spaargelden opgebouwd tijdens de periode waarin bijstand wordt ontvangen;

      e. een uitkering in verband met geleden immateriële schade voor zover dit, gelet op de aard en de hoogte van de
      uitkering, vanuit een oogpunt van bijstandsverlening verantwoord is.

      2 Voor de zelfstandige wordt niet als vermogen in aanmerking genomen:

      a. bezittingen in natura die naar hun aard en waarde algemeen gebruikelijk zijn dan wel, gelet op de omstandigheden
      van persoon en gezin, noodzakelijk zijn;

      b. het voor de uitoefening van het bedrijf of zelfstandig beroep noodzakelijke vermogen, waaronder mede begrepen
      het vermogen gebonden in de door de zelfstandige of zijn gezin in eigendom bewoonde woning met bijbehorend erf.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel54
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel52
