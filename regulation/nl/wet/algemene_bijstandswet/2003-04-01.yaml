  - number: '38'
    text: |-
      1 Het gemeentebestuur stelt bij verordening vast voor welke categorieën de bijstandsnorm wordt verhoogd of verlaagd
      en op grond van welke criteria de hoogte van die verhoging of verlaging wordt bepaald.

      2 In de verordening bedoeld in het eerste lid stelt het gemeentebestuur in elk geval vast dat:

      a. onverminderd [artikel 35][ref1], [36][ref2] en [37][ref3], de toeslag bedoeld in [artikel 33][ref4] voor
      de alleenstaande en de alleenstaande ouder met zijn ten laste komende kinderen in wiens woning geen ander zijn
      hoofdverblijf heeft, wordt bepaald op het in dat artikel genoemde maximumbedrag;

      b. jegens een belanghebbende niet gelijktijdig gebruik gemaakt wordt van de bevoegdheden bedoeld in de
      [artikelen 36, eerste lid][ref5], en [37, eerste lid][ref6].

      3 In de verordening worden uitsluitend verhogingen of verlagingen vastgesteld als bedoeld in de
      [artikelen 33 tot en met 37][ref7].

      4 Verhoging of verlaging van de bijstandsnorm of afwijkende vaststelling van de toeslag vindt plaats onverminderd
      [artikel 13, eerste lid][ref8].


