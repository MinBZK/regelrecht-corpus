  - number: '86'
    text: |-
      1 Het besluit tot terugvordering vermeldt hetgeen teruggevorderd wordt, de termijn of termijnen waarbinnen
      moet worden betaald, alsmede dat het besluit, bij gebreke van tijdige betaling, op de wijze als omschreven in
      [artikel 87][ref1] zal worden tenuitvoergelegd.

      2 De persoon van wie kosten van bijstand worden teruggevorderd is verplicht desgevraagd aan burgemeester en
      wethouders de inlichtingen te verstrekken die voor terugvordering ingevolge deze paragraaf van belang zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel87
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel86
