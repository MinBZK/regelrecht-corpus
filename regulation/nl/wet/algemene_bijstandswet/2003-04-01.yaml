  - number: '83'
    text: >-
      1 Kosten van bijstand verleend in de vorm van geldlening worden ingevolge deze paragraaf van de belanghebbende
      teruggevorderd, indien hij de hieruit voortvloeiende verplichtingen niet of niet behoorlijk nakomt.


      2 Kosten van bijstand voortvloeiende uit gestelde borgtocht worden van de hoofdschuldenaar teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel83
  - number: '84'
    text: |-
      1 Indien de bijstand op grond van [artikel 13, tweede lid][ref1], is verleend worden voor de toepassing van deze
      paragraaf als belanghebbenden aangemerkt de in dat artikel bedoelde personen.

      2 Indien de bijstand op grond van [artikel 13, tweede lid][ref2], als gezinsbijstand aan
      gehuwden had moeten worden verleend, maar zulks achterwege is gebleven, omdat de belanghebbende
      de verplichtingen , bedoeld in [artikel 65][ref3], of de [artikelen 28, tweede lid,][ref4] en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5], niet of niet behoorlijk
      is nagekomen, worden de ten onrechte gemaakte kosten van bijstand mede teruggevorderd van de persoon met wiens
      middelen als bedoeld in [hoofdstuk IV, afdeling 3][ref6], bij de verlening van bijstand rekening had moeten worden
      gehouden.

      3 De in het eerste en tweede lid bedoelde personen zijn hoofdelijk aansprakelijk voor de terugbetaling van de ten
      onrechte gemaakte kosten van bijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel13
