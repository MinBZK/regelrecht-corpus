  - number: '15'
    text: |-
      1 Degene die bijstand vraagt ter gedeeltelijke of volledige aflossing van een schuldenlast en die overigens
      bij het ontstaan van de schuldenlast, dan wel nadien, beschikte of beschikt over de middelen om in de
      noodzakelijke kosten van het bestaan te voorzien, wordt niet geacht te verkeren in omstandigheden als bedoeld in
      [artikel 7, eerste lid][ref1].

      2 In afwijking van het eerste lid kunnen burgemeester en wethouders:

      a. bijzondere bijstand verlenen in de vorm van borgtocht, indien het verzoek van de belanghebbende tot verlening
      van een saneringskrediet is afgewezen vanwege diens beperkte mogelijkheden tot terugbetaling en de borgtocht
      noodzakelijk is om de krediettransactie alsnog doorgang te doen vinden, door een:

      1°. gemeentelijke kredietbank als bedoeld in de [Wet op het consumentenkrediet][ref2];

      2°. kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref3] en die is ingeschreven
      in het register bedoeld in [artikel 52, tweede lid, van de Wet toezicht kredietwezen 1992][ref4] indien de gemeente
      niet is aangesloten bij een gemeentelijke kredietbank, dan wel daarmee geen relatie onderhoudt;

      b. bijzondere bijstand verlenen indien daartoe zeer dringende redenen bestaan en de in onderdeel *a* genoemde
      mogelijkheid geen uitkomst biedt;

      c. bijstand verlenen aan de zelfstandige ter gedeeltelijke of volledige betaling van een bedrijfsschuld, mits de
      bijstand wordt verleend op grond van [artikel 8, vijfde lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004815
