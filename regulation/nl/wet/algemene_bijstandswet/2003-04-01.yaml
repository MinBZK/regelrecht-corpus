  - number: '13'
    text: >-
      1 Burgemeester en wethouders stemmen de bijstand en de daaraan verbonden verplichtingen af op de omstandigheden,
      mogelijkheden en middelen van de betrokken persoon.


      2 Ten aanzien van de personen die een gezin vormen stemmen burgemeester en wethouders de bijstand en de daaraan
      verbonden verplichtingen af op de omstandigheden, mogelijkheden en middelen van het gezin.


      3 Het recht op bijstand komt de echtgenoten gezamenlijk toe, tenzij een van de echtgenoten geen recht op bijstand
      heeft.


      4 Van het tweede lid kunnen burgemeester en wethouders ten aanzien van een of meer van de daar bedoelde personen
      afwijken indien dit gelet op alle omstandigheden noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel13
  - number: '14'
    text: |-
      1 Indien de belanghebbende blijk heeft gegeven van een tekortschietend besef van verantwoordelijkheid
      voor de voorziening in het bestaan, dan wel in de periode voorafgaand aan de bijstandsaanvraag of
      nadien onvoldoende heeft meegewerkt aan het verkrijgen of behouden van arbeid in dienstbetrekking, de
      verplichting, bedoeld in [artikel 65, eerste lid][ref1], of de [artikelen 28, tweede lid][ref2], en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet binnen de door
      burgemeester en wethouders, onderscheidenlijk de Centrale organisatie werk en inkomen daarvoor vastgestelde
      termijn is nagekomen, dan wel een verplichting als bedoeld in [artikel 8, zesde lid, onderdeel b][ref4],
      [artikel 65, tweede of derde lid][ref5], [artikel 70, vierde lid][ref6], of een op grond van [hoofdstuk VIII][ref7]
      aan de bijstand verbonden verplichting niet of niet behoorlijk is nagekomen, weigeren burgemeester en wethouders de
      bijstand tijdelijk geheel of gedeeltelijk.

      2 Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging, de mate waarin de
      belanghebbende de gedraging verweten kan worden en de omstandigheden waarin hij verkeert. Van het opleggen van een
      maatregel wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.

      3 Indien het niet tijdig nakomen van de verplichting, bedoeld in
      [artikel 65, eerste lid][ref8], of de [artikelen 28, tweede lid][ref9], en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref10], niet heeft geleid tot het ten
      onrechte of tot een te hoog bedrag verlenen van bijstand, kunnen burgemeester en wethouders afzien van het opleggen
      van een maatregel als bedoeld in het eerste lid en volstaan met het geven van een schriftelijke waarschuwing
      ter zake van het niet tijdig nakomen van de verplichting, tenzij het niet tijdig nakomen van de verplichting
      plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de belanghebbende een
      zodanige waarschuwing is gegeven.

      4 Indien daarvoor dringende redenen aanwezig zijn kunnen burgemeester en wethouders besluiten af te zien van het
      opleggen van een maatregel als bedoeld in het eerste lid.

      5 Bij algemene maatregel van bestuur kunnen met betrekking tot het eerste en het tweede lid nadere regels worden
      gesteld.


