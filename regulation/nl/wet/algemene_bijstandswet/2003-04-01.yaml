        artikel: '799'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '801'
  - number: '104'
    text: |-
      1 Behoudens in de gevallen bedoeld in [artikel 100, tweede lid][ref1], worden kosten van bijstand die meer dan vijf
      jaar vóór de datum van verzending van het besluit tot verhaal zijn gemaakt, niet verhaald.

      2 De termijn, bedoeld in het eerste lid, staat niet in de weg aan latere tenuitvoerlegging van een rechterlijke
      uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel100
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel104
    references:
      - id: ref1
