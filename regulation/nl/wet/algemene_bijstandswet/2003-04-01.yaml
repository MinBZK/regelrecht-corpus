  - number: '82'
    text: |-
      Kosten van bijstand worden van de belanghebbende teruggevorderd voor zover:

      a. hij naderhand met betrekking tot de periode waarover bijstand is verleend over in aanmerking te nemen middelen
      als bedoeld in [hoofdstuk IV, afdeling 3][ref1], beschikt of kan beschikken;

      b. bijstand is verleend met een bepaalde bestemming en naderhand door hem vergoedingen of tegemoetkomingen worden
      ontvangen met het oog op die bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel82
