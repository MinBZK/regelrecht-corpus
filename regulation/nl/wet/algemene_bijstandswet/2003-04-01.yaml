  - number: '72'
    text: >-
      De algemene bijstand wordt uitbetaald aan ieder van de rechthebbende echtgenoten voor de helft dan wel op hun
      gezamenlijk verzoek aan een van hen voor het geheel.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel72
  - number: '73'
    text: >-
      1 Burgemeester en wethouders betalen de algemene bijstand maandelijks achteraf.


      2 Burgemeester en wethouders zijn bevoegd de algemene bijstand over een kortere of langere periode te betalen,
      indien dit gelet op de omstandigheden van de belanghebbende wenselijk is.


      3 In afwijking van het eerste lid wordt de vakantietoeslag, voor zover niet reeds eerder betaald, jaarlijks betaald
      in de maand juni over de aan die maand voorafgaande 12 maanden, dan wel in de maand waarin de algemene bijstand
      eindigt.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel73
  - number: '74'
    text: |-
      1 Burgemeester en wethouders zijn bevoegd om, indien de noodzaak daartoe aannemelijk is, zonder voorafgaand
      onderzoek als bedoeld in [artikel 66][ref1], bij wijze van voorschot bijstand te verlenen met inachtneming van
      [artikel 25][ref2].

      2 Het in het eerste lid bedoelde voorschot kan worden verleend zolang de termijn bedoeld in [artikel 68][ref3] niet
      is verstreken en burgemeester en wethouders nog geen besluit inzake de verlening van bijstand hebben bekendgemaakt.

      3 Het in het eerste lid bedoelde voorschot kan geen betrekking hebben op bijstand ter voorziening in de behoefte
      aan bedrijfskapitaal.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel25
