        artikel: '78'
        hoofdstuk: VI
        paragraaf: '2'
  - number: 78b
    text: |-
      In afwijking van [artikel 78][ref1] kunnen burgemeester en wethouders, onder voorwaarden die Onze Minister kan
      stellen, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te
      stellen bedrag niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel78
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel78b
