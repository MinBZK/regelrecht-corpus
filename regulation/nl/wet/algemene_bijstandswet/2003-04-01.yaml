  - number: '51'
    text: |-
      1 Onder vermogen wordt verstaan:

      a. de waarde van de bezittingen waarover de alleenstaande of het gezin bij de aanvang van de bijstandsverlening
      beschikt of redelijkerwijs kan beschikken, verminderd met de op dat tijdstip aanwezige schulden;

      b. de op grond van [paragraaf 1][ref1] in aanmerking genomen middelen die worden ontvangen tijdens de periode
      waarover beroep op bijstand wordt gedaan, voor zover deze geen inkomen zijn als bedoeld in [artikel 47][ref2].

      2 Bij de verlening van bijstand aan een zelfstandige die het bedrijf of zelfstandig beroep tezamen met een of meer
      anderen uitoefent, wordt onder vermogen mede verstaan het vermogen van die anderen.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel47
