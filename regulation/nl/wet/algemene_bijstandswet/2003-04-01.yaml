        artikel: '401'
  - number: '99'
    text: >-
      1 Kosten van bijstand worden verhaald op degene aan wie de persoon die bijstand ontvangt of heeft ontvangen
      een schenking heeft gedaan, tenzij gelet op alle omstandigheden aannemelijk is dat de schenker ten tijde van de
      schenking de noodzaak van bijstandsverlening redelijkerwijs niet heeft kunnen voorzien.


      2 Het verhaal geschiedt voor zover bij het besluit op de bijstandsaanvraag met de geschonken middelen rekening zou
      zijn gehouden indien de schenking niet had plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel99
  - number: '100'
    text: |-
      1 Kosten van bijstand worden verhaald op de nalatenschap van de persoon indien sprake is van een situatie
      als bedoeld in de[artikelen 79][ref1], [81][ref2] en [82][ref3] en voor zover voor het overlijden nog geen
      terugvordering heeft plaatsgevonden.

      2 Kosten van bijstand verleend in de vorm van geldlening of als gevolg van borgtocht worden op de nalatenschap van
      de persoon verhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0007333#Artikel82
