  - number: '63'
    text: |-
      1 Het recht op bijstand bestaat jegens burgemeester en wethouders van de gemeente waar de belanghebbende woonplaats
      heeft als bedoeld in de [artikelen 10, eerste lid][ref1], en [11 van Boek 1 van het Burgerlijk Wetboek](onbekend).

      2 Bij algemene maatregel van bestuur kan worden bepaald dat aan ondernemers in de binnenvaart die in een daarbij
      aangegeven gebied verblijven, bijstand wordt verleend door burgemeester en wethouders van een bij die maatregel aan
      te wijzen gemeente.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat bijstand aan een belanghebbende zonder adres als
      bedoeld in [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref2] wordt verleend door
      burgemeester en wethouders van bij die maatregel aan te wijzen gemeenten.

      4 Onder een ondernemer in de binnenvaart als bedoeld in het tweede lid wordt verstaan de zelfstandige die arbeid
      verricht door:

      a. het vervoeren of opslaan van goederen met behulp van een schip dat bestemd is of gebruikt wordt voor het vervoer
      van goederen op de Nederlandse binnenwateren, stromen en riviermonden, alsmede op de Dollard, de Waddenzee en het
      IJsselmeer;

      b. het slepen of duwen van de in onder a bedoelde schepen met een boot die blijkens zijn bouw daarvoor is bestemd
      en niet tevens is ingericht voor het vervoer van goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel1
