  - number: '53'
    text: >-
      1 De waarde van de bezittingen wordt vastgesteld op de waarde in het economisch verkeer.


      2 Bij algemene maatregel van bestuur worden nadere regels gesteld voor de vaststelling van het vermogen, gebonden
      in de door de belanghebbende of zijn gezin in eigendom bewoonde woning met bijbehorend erf.


      3 Bij algemene maatregel van bestuur worden nadere regels gesteld voor de vaststelling van het voor de uitoefening
      van het bedrijf of zelfstandig beroep noodzakelijke vermogen van de zelfstandige.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel53
  - number: '54'
    text: |-
      De in [artikel 52, eerste lid, onderdeel ][ref1], bedoelde vermogensgrens is:

      a. voor een alleenstaande: f 8 600 ;

      b. voor een alleenstaande ouder: f 17 200 ;

      c. voor de gehuwden te zamen: f 17 200 .


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel52
