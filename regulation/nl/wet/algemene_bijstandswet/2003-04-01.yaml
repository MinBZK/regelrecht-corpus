      1 Onze Minister herziet, met ingang van de dag waarop het netto minimumloon wijzigt:

      a. met het percentage van deze wijziging, de bijstandsnormen genoemd in [artikel 29][ref1] en
      [artikel 30, eerste lid][ref2], en het bedrag genoemd in [artikel 33, tweede lid][ref3];

      b. het percentage, genoemd in [artikel 26, derde lid][ref4], zodanig dat dit gelijk is aan de procentuele
      verhouding tussen de netto aanspraak op minimumvakantietoeslag over het minimumloon en de som van het netto
      minimumloon en de netto aanspraak op minimumvakantietoeslag daarover.

      2 Onze Minister herziet, met ingang van de dag waarop het netto minimumloon zonder de daarin begrepen
      aanspraak op vakantietoeslag wijzigt, met het percentage van deze wijziging, de bedragen genoemd in
      [artikel 43, tweede lid, onderdelen i, j, m, n en p][ref5].


