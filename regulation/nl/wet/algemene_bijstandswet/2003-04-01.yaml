  - number: '21'
    text: |-
      1 Bijzondere bijstand voor de kosten van noodzakelijke duurzame gebruiksgoederen kan worden verleend in de vorm van
      een geldlening of borgtocht, dan wel in de vorm van een bedrag om niet.

      2 Indien een geldlening als bedoeld in het eerste lid wordt verstrekt stemmen burgemeester en wethouders de
      aflossingsbedragen en de duur van de aflossing mede af op de omstandigheden, mogelijkheden en middelen van de
      belanghebbende. De aflossingsbedragen worden zodanig vastgesteld dat de belanghebbende blijft beschikken over een
      inkomen gelijk aan de beslagvrije voet bedoeld in [artikel 475][ref1].

      3 Op de verlening van bijzondere bijstand is [titel 4.2 van de Algemene wet bestuursrecht][ref2] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475d
      - id: ref2
        bwb_id: BWBR0005537
  - number: '22'
    text: >-
      1 Bijstand aan een zelfstandige ter voorziening in de behoefte aan bedrijfskapitaal wordt verleend in de vorm van
      een rentedragende geldlening of borgtocht.


      2 In afwijking van het eerste lid wordt de daar bedoelde bijstand onder toepassing van bij algemene maatregel van
      bestuur te stellen nadere voorwaarden:


      a. verleend in de vorm van een bedrag om niet indien het inkomen van de zelfstandige duurzaam lager is dan de som
      van de bijstandsnorm, bedoeld in hoofdstuk IV, afdeling 1, paragraaf 2 en 3, en de verleende bijzondere bijstand en
      diens vermogen een zekere grens niet te boven gaat;


      b. ambtshalve geheel of gedeeltelijk omgezet in een bedrag om niet indien het inkomen van de zelfstandige gedurende
      een aaneengesloten periode van twaalf maanden lager is dan de som van de bijstandsnorm, bedoeld in hoofdstuk IV,
      afdeling 1, paragraaf 2 en  3, en de verleende bijzondere bijstand en diens vermogen een zekere grens niet te boven
      gaat.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel22
  - number: '23'
    text: |-
      1 Indien aan een zelfstandige op grond van [artikel 8][ref1], anders dan ter voorziening in de behoefte aan
      bedrijfskapitaal, bijstand wordt verleend, heeft deze bijstand voorlopig de vorm van een renteloze geldlening die
      in maandelijkse termijnen wordt uitbetaald.

      2 Zodra het inkomen bekend is over het boekjaar waarin de in het eerste lid bedoelde bijstand is verleend, wordt
      de hoogte van deze bijstand definitief vastgesteld en vindt, voor zover het vermogen van de zelfstandige een bij
      algemene maatregel van bestuur te stellen grens niet te boven gaat, tot die hoogte omzetting plaats in een bedrag
      om niet.

      3 In afwijking van het eerste lid wordt de daar bedoelde bijstand verleend als een bedrag om niet indien:

      a. de uitkeringsduur ten hoogste zes maanden is;

      b. de inkomensvorming in het betreffende bedrijf of zelfstandig beroep regelmatig over het jaar verloopt en het
      inkomen duurzaam lager is dan de som van de bijstandsnorm, bedoeld in hoofdstuk IV, afdeling 1, paragraaf 2 en  3,
      en de verleende bijzondere bijstand; en

      c. het vermogen van de zelfstandige een bij algemene maatregel van bestuur te stellen grens niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel8
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: 23a
    text: |-
      1 Bijstand als bedoeld in [artikel 8, zesde lid, onder c][ref1], heeft voorlopig de vorm van een renteloze
      geldlening.

      2 Indien de belanghebbende in aansluiting op de voorbereidingsperiode:

      a. geen bedrijf of beroep als zelfstandige begint, dan wordt de geldlening omgezet in een bedrag om niet;

      b. een bedrijf of beroep als zelfstandige begint, dan wordt de geldlening omgezet in een rentedragende geldlening.
      De bij en krachtens [artikel 22][ref2] gestelde regels zijn op deze geldlening van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel22
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel23a
