  - number: '65'
    text: |-
      1 De belanghebbende doet aan burgemeester en wethouders op verzoek of onverwijld uit eigen beweging mededeling van
      alle feiten en omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op
      het recht op bijstand, het geldend maken van het recht op bijstand, de hoogte of de duur van de bijstand, of op het
      bedrag van de bijstand dat aan hem wordt betaald.

      2 De belanghebbende is verplicht aan burgemeester en wethouders desgevraagd de medewerking te verlenen die
      redelijkerwijs nodig is voor de uitvoering van deze wet.

      3 De belanghebbende is voorts verplicht aan burgemeester en wethouders desgevraagd een document als bedoeld
      in [artikel 1 van de Wet op de identificatieplicht][ref1] terstond ter inzage te verstrekken, voor zover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.

      4 Burgemeester en wethouders stellen bij de uitvoering van deze wet ten aanzien van een belanghebbende op wie
      de verplichting bedoeld in het vierde lid rust, de identiteit vast aan de hand van een document als bedoeld
      in [artikel 1 van de Wet op de identificatieplicht][ref2] en nemen de aard en het nummer daarvan op in de
      administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
