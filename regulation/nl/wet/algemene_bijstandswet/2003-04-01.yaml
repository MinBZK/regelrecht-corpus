    text: |-
      Indien ten aanzien van een tot het gezin behorende persoon toepassing is gegeven aan
      [artikel 13, vierde lid][ref1], wordt het verschil tussen de verleende bijstand en de bijstand welke, zonder die
      toepassing, als gezinsbijstand zou zijn verleend, teruggevorderd van de in [artikel 13, tweede lid][ref2], bedoelde
      personen naar de mate waarin met hun middelen bij de verlening van gezinsbijstand rekening zou zijn gehouden.


