  - number: '27'
    text: >-
      1 De algemene bijstand wordt per kalendermaand vastgesteld.


      2 De algemene bijstand wordt vastgesteld over het deel van de kalendermaand waarover recht op bijstand bestaat,
      indien de alleenstaande of het gezin voorafgaand aan of volgend op de bijstandsverlening:


      a. gedurende een periode van ten minste 30 dagen geen algemene bijstand ontvangt; of


      b. anderszins geen recht op algemene bijstand heeft.


      3 Burgemeester en wethouders kunnen besluiten de algemene bijstand over een langere periode vast te stellen voor
      zover het patroon van de inkomensverwerving en de hoogte daarvan daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel27
  - number: '28'
    text: Deze afdeling is niet van toepassing op bijstand ter voorziening in de behoefte aan bedrijfskapitaal.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel28
  - number: '29'
    text: >-
      1 Voor belanghebbenden jonger dan 21 jaar zonder ten laste komende kinderen is de bijstandsnorm per kalendermaand,
      indien het betreft:


      a. een alleenstaande van 18, 19 of 20 jaar f 321,74 ;


      b. gehuwden waarvan beide echtgenoten 18, 19 of 20 jaar zijn: f 643,48 ;


      c. gehuwden waarvan een echtgenoot 18, 19 of 20 jaar is en de andere echtgenoot 21 jaar of ouder: f 225,86 .


      2 Voor belanghebbenden jonger dan 21 jaar met een of meer ten laste komende kinderen is de bijstandsnorm per
      kalendermaand, indien het betreft:


      a. een alleenstaande ouder van 18, 19 of 20 jaar f 683,39 ;


      b. gehuwden waarvan beide echtgenoten 18, 19 of 20 jaar zijn: f 1 005,13 ;


      c. gehuwden waarvan een echtgenoot 18, 19 of 20 jaar is en de andere echtgenoot 21 jaar of ouder: f 1 587,51 .
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel29
  - number: '30'
    text: >-
      1 Voor belanghebbenden van 21 jaar of ouder, doch jonger dan 65 jaar is de bijstandsnorm per kalendermaand, indien
      het betreft:


      a. een alleenstaande: f 904,12 ;


      b. een alleenstaande ouder: f 1 265,76 ;


      c. gehuwden waarvan beide echtgenoten jonger zijn dan 65 jaar: f 1 808,23 .


      2 Voor belanghebbenden van 65 jaar of ouder is de bijstandsnorm per kalendermaand, indien het betreft:


      a. een alleenstaande: f 1 423,70 ;


      b. een alleenstaande ouder: f 1 823,21 ;


      c. gehuwden waarvan beide echtgenoten 65 jaar of ouder zijn: f 2 030,90 ;


      d. gehuwden waarvan een echtgenoot 65 jaar of ouder is en de andere echtgenoot 21 jaar of ouder, doch jonger dan 65
      jaar: f 2 009,47 .
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel30
  - number: '31'
    text: >-
      1 Bij een verblijf in een inrichting is de bijstandsnorm per kalendermaand, indien het betreft:


      a. een alleenstaande of een alleenstaande ouder: f 509,38 ;


      b. gehuwden: f 792,37 .


      2 Indien een van de gehuwden in een inrichting verblijft, is de bijstandsnorm de som van de bijstandsnormen die
      voor ieder van hen als alleenstaande of alleenstaande ouder zouden gelden.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel31
  - number: '32'
    text: >-
      Indien een van de gehuwden geen recht op algemene bijstand heeft, is voor de rechthebbende echtgenoot de
      bijstandsnorm gelijk aan de bijstandsnorm die voor hem als alleenstaande of alleenstaande ouder zou gelden.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel32
  - number: '33'
    text: >-
      1 Burgemeester en wethouders verhogen voor een belanghebbende van 21 jaar of ouder doch jonger dan 65 jaar die een
      alleenstaande of een alleenstaande ouder is, de bijstandsnorm met een toeslag voor zover de belanghebbende hogere
      algemeen noodzakelijke kosten van het bestaan heeft dan waarin de bijstandsnorm voorziet, als gevolg van het niet
      of niet geheel kunnen delen van deze kosten met een ander.


      2 De toeslag bedraagt ten hoogste f 361,65  per kalendermaand.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel33
  - number: '34'
    text: >-
      Burgemeester en wethouders kunnen voor gehuwden, waarvan beide echtgenoten jonger zijn dan 65 jaar, de
      bijstandsnorm verlagen voor zover de belanghebbenden lagere algemeen noodzakelijke kosten van het bestaan hebben
      dan waarin de bijstandsnorm voorziet, als gevolg van het geheel of gedeeltelijk kunnen delen van deze kosten met
      een ander.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel34
  - number: '35'
    text: |-
      1 Burgemeester en wethouders kunnen de bijstandsnorm, bedoeld in de [ artikelen 29][ref1] en
      [30, eerste lid][ref2], of de toeslag, bedoeld in [artikel 33][ref3] lager vaststellen voor zover de belanghebbende
      lagere algemeen noodzakelijke kosten van het bestaan heeft dan waarin de bijstandsnorm of de toeslag voorziet, als
      gevolg van de bewoning van een woning waaraan geen woonkosten zijn verbonden.

      2 De in het eerste lid bedoelde verlaging vindt bij voorrang plaats op de toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0007333#Artikel33
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel35
