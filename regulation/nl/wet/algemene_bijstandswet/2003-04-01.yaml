  - number: '37'
    text: |-
      1 Burgemeester en wethouders kunnen voor een alleenstaande van 21 of 22 jaar de toeslag bedoeld in
      [artikel 33][ref1] afwijkend vaststellen voor zover zij van oordeel zijn dat, gezien de hoogte van het
      minimumjeugdloon, de hoogte van deze toeslag een belemmering kan vormen voor de aanvaarding van arbeid.

      2 Onder het minimumjeugdloon bedoeld in het eerste lid wordt verstaan het voor de betreffende leeftijd geldende
      minimumloon bedoeld in [artikel 8, derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
