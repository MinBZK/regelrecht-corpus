  - number: '40'
    text: |-
      1 Voor de vaststelling van de draagkracht nemen burgemeester en wethouders geheel of gedeeltelijk in beschouwing:

      a. het in aanmerking te nemen vermogen;

      b. het inkomen voor zover dit meer bedraagt dan de bijstandsnorm bedoeld in [afdeling 1, paragraaf 2][ref1] en
      [3][ref2].

      2 Burgemeester en wethouders bepalen de duur van de periode waarover de draagkracht in aanmerking wordt genomen
      alsmede het tijdstip waarop deze periode begint.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007333#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel40
