  - number: '106'
    text: |-
      Naast de verplichtingen die ingevolge dit hoofdstuk in elk geval aan de bijstand verbonden zijn, dan wel daaraan
      door burgemeester en wethouders verbonden dienen te worden, kunnen burgemeester en wethouders vanaf de dag van
      melding als bedoeld in [artikel 68a, tweede lid][ref1], verplichtingen opleggen die strekken tot inschakeling in de
      arbeid in dienstbetrekking of in eigen bedrijf of zelfstandig beroep, dan wel die verband houden met aard en doel
      van een bepaalde vorm van bijstand of die strekken tot zijn vermindering of beëindiging. Een verplichting kan, op
      advies van een arts, inhouden het zich onderwerpen aan een noodzakelijke behandeling van medische aard.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel68a
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: 68a
        hoofdstuk: V
        paragraaf: '3'
  - number: '107'
    text: |-
      1 Burgemeester en wethouders kunnen besluiten verplichtingen als bedoeld in dit hoofdstuk niet op te leggen, dan
      wel van zodanige verplichtingen tijdelijk ontheffing te verlenen, in gevallen waarin daartoe naar hun oordeel
      aanleiding bestaat om redenen van medische of sociale aard, dan wel om redenen gelegen in de aard en het doel van
      de bijstand.

      2 Voor de ouder met een volledige verzorgende taak voor een of meer ten laste komende kinderen, dan wel
      pleegkinderen, jonger dan vijf jaar gelden niet de verplichtingen, bedoeld in [artikel 113, eerste lid][ref1].

      3 Ten aanzien van een ouder met een gedeeltelijk verzorgende taak of gehuwden die de verzorgende taak bedoeld in
      het tweede lid gezamenlijk uitoefenen geldt dat de verplichtingen bedoeld in [artikel 113, eerste lid][ref2] aan
      die ouder onderscheidenlijk die ouders worden opgelegd met dien verstande dat deze onderscheidenlijk ieder van
      beiden voor de helft van de geldende volledige arbeidstijd per week beschikbaar moet zijn voor inschakeling in
      de arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel113
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '113'
        hoofdstuk: VIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '113'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '108'
    text: |-
      De verplichting tot het instellen van een vordering tot toekenning van een uitkering tot levensonderhoud kan,
      onverminderd [artikel 108a][ref1], slechts aan de bijstand worden verbonden, indien het betreft een uitkering ten
      laste van de echtgenoot, de gewezen echtgenoot of de ouder, indien:

      a. die vordering kan worden ingesteld samen met een verzoek tot echtscheiding, scheiding van tafel en bed of
      ontbinding van het huwelijk na scheiding van tafel en bed; of

      b. de echtgenoot, de gewezen echtgenoot of de ouder buiten Nederland verblijft en de verplichting noodzakelijk is
      om op grond van een uitspraak van de Nederlandse rechter onderhoudsaanspraken in het buitenland geldend te maken
      onder toepassing van het op 20 juni 1956 te New York tot stand gekomen Verdrag inzake verhaal in het buitenland van
      uitkeringen tot onderhoud (Trb. 1957, 121).


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel108a
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: 108a
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 108a
    text: |-
      Indien ten aanzien van de belanghebbende een rechterlijke uitspraak betreffende levensonderhoud verschuldigd
      krachtens [Boek 1 van het Burgerlijk Wetboek][ref1] die uitvoerbaar is, niet wordt nagekomen, kunnen burgemeester
      en wethouders aan de bijstand verplichtingen verbinden die er toe strekken dat de belanghebbende aan de
      tenuitvoerlegging van de uitspraak meewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel108a
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: '109'
    text: >-
      Indien en zolang er, vanwege het bestaan of dreigen van schulden, gegronde redenen zijn om aan te nemen dat de
      belanghebbende zonder hulp niet in staat is tot een verantwoorde besteding van zijn bestaansmiddelen, kunnen
      burgemeester en wethouders aan de bijstand de verplichting verbinden dat de belanghebbende er aan meewerkt dat zij
      in diens naam noodzakelijke betalingen uit de toegekende bijstand verrichten.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel109
  - number: '110'
    text: |-
      1 Burgemeester en wethouders verbinden aan de verlening van bijstand onder verband van hypotheek als bedoeld in
      [artikel 20][ref1] de verplichting dat de belanghebbende aan de vestiging van de hypotheek meewerkt. Indien de
      belanghebbende deze verplichting niet nakomt is de verleende bijstand terstond opeisbaar.

      2 Burgemeester en wethouders kunnen aan het verlenen van bijstand in de vorm van een geldlening, anders dan door
      vestiging van een hypotheek als bedoeld in het eerste lid, verplichtingen verbinden die zijn gericht op meerdere
      zekerheid voor de nakoming van de aan deze bijstand verbonden rente- en aflossingsverplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel20
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '20'
        hoofdstuk: III
  - number: 110a
    text: |-
      Burgemeester en wethouders verbinden aan de verlening van bijstand aan een belanghebbende zonder adres als bedoeld
      in [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] de verplichting dat hij aangifte
      doet van een door hen ter beschikking gesteld briefadres als bedoeld in [artikel 1 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel1
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '1'
  - number: '111'
    text: >-
      1 De bijstand is erop gericht de belanghebbende in staat te stellen zelfstandig in het bestaan te voorzien.
      Burgemeester en wethouders bevorderen dat de belanghebbende gebruik maakt van voorzieningen die bijdragen aan diens
      zelfstandige bestaansvoorziening. Zij dragen zorg voor voorlichting en bemiddeling die daartoe noodzakelijk zijn.


      2 Burgemeester en wethouders werken samen met de Centrale organisatie werk en inkomen en het Uitvoeringsinstituut
      werknemersverzekeringen om de inschakeling van bijstandsgerechtigden in het arbeidsproces te bevorderen.


      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de samenwerking
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel111
  - number: '112'
    text: |-
      1 Burgemeester en wethouders leggen aan de zelfstandige aan wie zij algemene bijstand of bijstand ter voorziening
      in bedrijfskapitaal verlenen met toepassing van [artikel 8][ref1] de verplichtingen op die zij nodig achten voor
      een doelmatige bedrijfs- of beroepsuitoefening.

      2 De zelfstandige aan wie bijstand als bedoeld in het eerste lid wordt verleend is verplicht naar behoren een
      administratie te voeren.

      3 Ten aanzien van de zelfstandige die zijn bedrijf of zelfstandig beroep gedurende ten minste een half jaar niet of
      nagenoeg niet uitoefent, is [artikel 113][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel113
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '113'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '113'
    text: |-
      1 De belanghebbende die voor de zelfstandige voorziening in het bestaan is aangewezen op arbeid in dienstbetrekking
      is vanaf de dag van melding als bedoeld in [artikel 68a, tweede lid][ref1], verplicht:

      a. naar vermogen te trachten arbeid in dienstbetrekking te verkrijgen;

      b. ervoor te zorgen dat hij als werkzoekende geregistreerd is bij de Centrale organisatie
      werk en inkomen en geregistreerd blijft, indien hem daartoe het recht toekomt op grond van
      [artikel 25, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      c. passende arbeid te aanvaarden;

      d. na te laten hetgeen inschakeling in de arbeid belemmert;

      e. mee te werken aan een onderzoek naar de geschiktheid voor scholing of opleiding en aan een scholing of
      opleiding, die noodzakelijk wordt geacht;

      f. beschikbaar te zijn voor de voorzieningen van de [Wet inschakeling werkzoekenden][ref3], mee te werken aan
      het verkrijgen van die voorzieningen, daarvan gebruik te maken en daartoe op een aangegeven tijd en plaats te
      verschijnen.

      2 Onder passende arbeid wordt verstaan alle arbeid die voor de krachten en bekwaamheden van de belanghebbende
      is berekend, tenzij aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem kan worden
      gevergd. Niet als passende arbeid wordt aangemerkt arbeid op grond van een arbeidsovereenkomst als bedoeld in
      [hoofdstuk 2 van de Wet sociale werkvoorziening][ref4].

      3 Indien bijstand wordt verleend aan gehuwden gelden de verplichtingen bedoeld in het eerste lid voor ieder van
      hen.

      4 Onze Minister kan regels stellen aangaande het toepassen dan wel niet toepassen van een of meer verplichtingen
      genoemd in het eerste lid ten aanzien van een of meer categorieën belanghebbenden.

      5 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot het begrip passende arbeid bedoeld in
      het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel68a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel25
