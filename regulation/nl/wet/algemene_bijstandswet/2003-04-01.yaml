  - number: '76'
    text: >-
      Ingeval van overlijden van een van de echtgenoten, van de alleenstaande ouder of van het laatste ten laste komende
      kind van de alleenstaande ouder, wordt de algemene bijstand tot en met één maand na de dag van het overlijden,
      betaald naar de op het moment van overlijden van toepassing zijnde bijstandsnorm aan de andere echtgenoot, de ten
      laste komende kinderen, onderscheidenlijk de gewezen alleenstaande ouder.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel76
  - number: '77'
    text: |-
      1 De bijstand is niet vatbaar voor vervreemding of verpanding.

      2 Bijzondere bijstand is niet vatbaar voor beslag.

      3 Beslag op algemene bijstand is slechts geldig voor zover de betrokkene blijft beschikken over een inkomen gelijk
      aan de beslagvrije voet bedoeld in [artikel 475][ref1].

      4 Een machtiging tot het in ontvangst nemen van de bijstand, onder welke vorm of welke benaming ook verleend, is
      steeds herroepelijk.

      5 Elk beding, strijdig met dit artikel, is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '78'
    text: >-
      1 Kosten van bijstand worden door de gemeente teruggevorderd in de gevallen en naar de regels aangegeven in deze
      paragraaf.


      2 Het in aanmerking nemen van in de voorafgaande drie maanden ontvangen middelen wordt niet als terugvordering
      beschouwd.


      3 Indien daarvoor dringende redenen aanwezig zijn kunnen burgemeester en wethouders besluiten geheel of
      gedeeltelijk van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel78
  - number: 78a
    text: |-
      1 In afwijking van [artikel 78][ref1] kunnen burgemeester en wethouders, op verzoek van belanghebbende, besluiten
      gedeeltelijk van terugvordering of gedeeltelijk van verdere terugvordering van bijstand af te zien, indien:

      a. redelijkerwijs te voorzien is dat de belanghebbende niet zal kunnen voortgaan met het betalen van zijn schulden;

      b. redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen; en

      c. de vordering van de gemeente wegens teruggevorderde bijstand ten minste zal worden voldaan naar evenredigheid
      met de vorderingen van de schuldeisers van gelijke rang.

      2 Het eerste lid is niet van toepassing ten aanzien van:

      a. de terugvordering van bijstand als gevolg van verwijtbaar gedrag van de belanghebbende;

      b. vorderingen welke door pand of hypotheek op een goed of goederen zijn gedekt, behoudens voor zover zij niet op
      die goederen verhaald kunnen worden.

      3 Het besluit tot het gedeeltelijk afzien van terugvordering of tot het gedeeltelijk afzien van verdere
      terugvordering treedt niet in werking voordat een schuldregeling overeenkomstig het eerste lid tot stand is
      gekomen.

      4 Het besluit tot het gedeeltelijk afzien van terugvordering of tot het gedeeltelijk afzien van verdere
      terugvordering wordt ingetrokken of ten nadele van de belanghebbende gewijzigd indien:

      a. niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling is tot stand gekomen die
      voldoet aan de eisen bedoeld in het eerste lid;

      b. de belanghebbende zijn schuld aan de gemeente niet overeenkomstig de schuldregeling voldoet; of

      c. onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een
      ander besluit zou hebben geleid.

      5 Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel78
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel78a
    references:
      - id: ref1
