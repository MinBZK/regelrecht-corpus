  - number: '59'
    text: |-
      1 Onze Minister herziet, met ingang van de dag waarop het netto minimumloon en de daarop aan te brengen correctie,
      bedoeld in het derde lid, of de gemiddelde nominale premies op grond van de [Ziekenfondswet][ref1] en de
      [Algemene Wet Bijzondere Ziektekosten][ref2] wijzigen, met het percentage van deze wijziging, de bijstandsnormen
      genoemd in [artikel 31, eerste lid][ref3], nadat daarop de gemiddelde nominale premie in mindering is gebracht die
      de alleenstaande of de gehuwden op grond van de [Algemene Wet Bijzondere Ziektekosten][ref4] verschuldigd zijn.
      Het aldus gewijzigde bedrag wordt vervolgens verhoogd met de gemiddelde nominale premie die de alleenstaande of de
      gehuwden op grond van de [Algemene Wet Bijzondere Ziektekosten][ref5] verschuldigd zijn.

      2 Onder het netto minimumloon, bedoeld in het eerste lid, wordt verstaan het netto minimumloon, bedoeld in
      [artikel 55, eerste lid][ref6], met dien verstande dat daarop in mindering worden gebracht de gemiddelde nominale
      premies die gehuwden op grond van de [Ziekenfondswet][ref7] en de [Algemene Wet Bijzondere Ziektekosten][ref8]
      verschuldigd zijn.

      3 De in het eerste lid bedoelde correctie is het procentuele verschil van de wijziging van het prijsindexcijfer
      voor de gezinsconsumptie en het prijsindexcijfer voor het onderdeel energie daarvan.


