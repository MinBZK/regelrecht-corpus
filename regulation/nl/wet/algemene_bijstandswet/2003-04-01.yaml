        artikel: '3.6'
  - number: '6'
    text: >-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:


      a. algemene bijstand: de bijstand ter voorziening in de algemeen noodzakelijke kosten van het bestaan;


      b. bijzondere bijstand: de bijstand die wordt verstrekt indien bijzondere omstandigheden in het individuele geval
      leiden tot noodzakelijke kosten van het bestaan waarin de algemene bijstand niet voorziet en die de aanwezige
      draagkracht te boven gaan;


      c. voorliggende voorziening: elke voorziening buiten deze wet waarop de persoon of het gezin aanspraak kan maken,
      dan wel een beroep kan doen, ter verwerving van middelen of ter bekostiging van specifieke uitgaven.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel6
  - number: '7'
    text: |-
      1 Iedere Nederlander die hier te lande in zodanige omstandigheden verkeert of dreigt te geraken dat hij niet
      over de middelen beschikt om in de noodzakelijke kosten van het bestaan te voorzien, heeft recht op bijstand van
      overheidswege.

      2 Met de Nederlander, bedoeld in het eerste lid, wordt gelijkgesteld de hier te lande
      verblijvende vreemdeling die rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].

      3 Bij algemene maatregel van bestuur kunnen hier te lande verblijvende vreemdelingen, anders dan die bedoeld in
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref2], voor de toepassing van deze wet met een
      Nederlander gelijk worden gesteld:

      a. ter uitvoering van een verdrag dan wel een besluit van een volkenrechtelijke organisatie, of

      b. vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref3], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
