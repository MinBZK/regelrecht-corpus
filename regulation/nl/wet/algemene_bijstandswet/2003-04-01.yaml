    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. premies volksverzekeringen: de premies op grond van de [Algemene Ouderdomswet][ref1], de
      [Algemene nabestaandenwet][ref2] en de [Algemene Wet Bijzondere Ziektekosten][ref3], behoudens de nominale premie
      op grond van die wet;

      b. premies werknemersverzekeringen: de premie op grond van de [Werkloosheidswet][ref4].

      c. ziekenfondspremie: de premie op grond van de [Ziekenfondswet][ref5], behoudens de nominale premie;

      d. kinderbijslag: kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref6].


