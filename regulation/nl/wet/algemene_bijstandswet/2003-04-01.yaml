        afdeling: 4.1.2
  - number: 14c
    text: |-
      1 Het besluit waarbij de boete wordt opgelegd vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald, alsmede de wijze waarop het besluit, bij gebreke van tijdige betaling, overeenkomstig [artikel 14][ref1]
      zal worden tenuitvoergelegd.

      2 Op verzoek van de belanghebbende die het in het eerste lid bedoelde besluit wegens zijn gebrekkige kennis van de
      Nederlandse taal onvoldoende begrijpt, dragen burgemeester en wethouders er zoveel mogelijk zorg voor dat de in dat
      besluit vermelde informatie aan de belanghebbende wordt medegedeeld in een voor hem begrijpelijke taal.

      3 Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het eerste lid nadere regels worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel14f
