  - number: '131'
    text: >-
      Onze Minister kan aan burgemeester en wethouders, nadat zij gedurende acht weken in de gelegenheid zijn gesteld
      hun zienswijze naar voren te brengen, aanwijzingen geven met betrekking tot een goede uitvoering van deze wet. Hij
      treedt daarbij niet in de besluitvorming inzake individuele gevallen.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel131
  - number: '132'
    text: >-
      1 Burgemeester en wethouders verstrekken desgevraagd aan Onze Minister kosteloos de inlichtingen die hij voor de
      informatievoorziening en de beleidsvorming met betrekking tot deze wet nodig heeft.


      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      verstrekken van de in het eerste lid bedoelde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel132
  - number: '133'
    text: >-
      Burgemeester en wethouders zijn verplicht ten behoeve van de statistiek gegevens inzake de uitvoering van deze wet
      te verzamelen en kosteloos te verstrekken volgens door Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel133
  - number: '138'
    text: |-
      Voor de toepassing van [artikel 8:1, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt met een besluit
      gelijkgesteld het nalaten van een handeling die strekt tot uitvoering van het besluit inzake de verlening of
      terugvordering van bijstand of het verrichten van een handeling die afwijkt van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel81
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:1
  - number: 139a
    text: |-
      1 Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake
      van schending of verkeerde toepassing van [artikel 3, tweede tot en met zesde lid][ref1], en de daarop berustende
      bepalingen.

      2 Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen de uitspraken van de gerechtshoven
      inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats
      inneemt van een gerechtshof.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel3
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel139a
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '3'
        hoofdstuk: I
  - number: '140'
    text: |-
      1 In geval burgemeester en wethouders geen of ontoereikend toepassing hebben gegeven aan [artikel 74][ref1] kan de
      voorzitter van gedeputeerde staten, indien naar zijn oordeel de noodzaak tot onverwijlde bijstand aanwezig is, op
      verzoek van de belanghebbende besluiten dat burgemeester en wethouders algemene bijstand verlenen.

      2 De beslissing van de voorzitter van gedeputeerde staten vervalt, zodra de beslissing van burgemeester en
      wethouders inzake de verlening van algemene bijstand onherroepelijk is geworden dan wel de rechtbank op het beroep
      heeft beslist. De beslissing vervalt eveneens met ingang van de datum waarop een door de voorzieningenrechter van
      de rechtbank getroffen voorlopige voorziening in werking treedt.

      3 De in het eerste lid bedoelde bijstand wordt bij wijze van voorschot verleend met inachtneming van
      [artikel 25][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel25
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '74'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '25'
        hoofdstuk: III
  - number: 140a
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de boete is vastgesteld ook ten nadele van de belanghebbende wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel869
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel140a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:69
  - number: '141'
    text: |-
      1 Degene die niet voldoet aan de verplichting omschreven in [artikel 101][ref1] wordt gestraft met hechtenis van
      ten hoogste een maand of een geldboete van de tweede categorie.

      2 Het in het eerste lid omschreven feit is een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel101
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '101'
        hoofdstuk: VII
  - number: 142a
    text: >-
      Het recht tot strafvordering vervalt indien burgemeester en wethouders aan de belanghebbende ter zake van hetzelfde
      feit reeds een boete hebben opgelegd.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel142a
  - number: 144a
    text: |-
      1 Bij zeer dringende redenen van tijdelijke aard kan aan de zelfstandige, die als ingezetene in de
      basisadministratie persoonsgegevens van een gemeente is ingeschreven en die zich uit hoofde van zijn bedrijf of
      beroep tijdelijk in het buitenland bevindt, door Onze Minister bijstand worden verleend volgens door hem te stellen
      regels.

      2 [Hoofdstuk VI, paragraaf 2][ref1], en [hoofdstuk VII][ref2] zijn van toepassing op terugvordering en verhaal van
      kosten van bijstand die door Onze Minister is verleend, met dien verstande dat het Rijk in plaats van de gemeente
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0007333#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel144a
    references:
      - id: ref1
        bwb_id: BWBR0007333
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007333
        hoofdstuk: VII
  - number: '145'
    text: >-
      1 In het belang van een goede uitvoering van het bij deze wet bepaalde kunnen bij algemene maatregel van bestuur
      regels worden gesteld.


      2 Onze Minister kan, wanneer hij overweegt een voordracht tot vaststelling, wijziging of intrekking van een in
      het eerste lid bedoelde algemene maatregel van bestuur te doen en naar zijn oordeel een gewichtige reden een
      onmiddellijke voorziening eist, overeenkomstig de in overweging zijnde maatregel regels stellen.


      3 De regeling bedoeld in het tweede lid blijft, behoudens eerdere intrekking, van kracht totdat de in het eerste
      lid bedoelde algemene maatregel van bestuur in werking treedt, doch uiterlijk tot 12 maanden na de dag van
      inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel145
  - number: '146'
    text: >-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt binnen 4 jaar na de inwerkingtreding van deze wet, en
      vervolgens telkens na 4 jaar, aan de Staten Generaal een verslag over de doeltreffendheid en de effecten van deze
      wet of onderdelen daarvan in de praktijk.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel146
  - number: '147'
    text: |-
      1 [Artikel 144][ref1] vervalt 4 jaar na de inwerkingtreding van deze wet.

      2 Bij algemene maatregel van bestuur kan de in het eerste lid genoemde periode eenmaal worden verlengd met ten
      hoogste 2 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel144
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '144'
        hoofdstuk: XIII
  - number: '148'
    text: >-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel148
  - number: '149'
    text: 'Deze wet kan worden aangehaald als: Algemene bijstandswet.'
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel149
