  - number: '67'
    text: >-
      1 Burgemeester en wethouders stellen het recht op bijstand op schriftelijke aanvraag of, indien een schriftelijke
      aanvraag niet mogelijk is, ambtshalve vast.


      2 De bijstand wordt door de echtgenoten gezamenlijk aangevraagd dan wel door een van hen met schriftelijke
      toestemming van de ander.


      3 Burgemeester en wethouders stellen het recht op bijstand ambtshalve vast indien een van de echtgenoten niet met
      de aanvraag instemt, doch bijstandsverlening, gezien de belangen van de overige gezinsleden, niettemin geboden is.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel67
  - number: '68'
    text: |-
      1 Burgemeester en wethouders stellen binnen acht weken na ontvangst van de aanvraag door de Centrale organisatie
      werk en inkomen bij een aanvraag als bedoeld in [artikel 63a, eerste of vierde lid][ref1], of door burgemeester
      en wethouders bij een aanvraag als bedoeld in [artikel 63a, tweede of derde lid][ref2], vast of recht op bijstand
      bestaat. Indien het een aanvraag betreft om als zelfstandige bijstand te ontvangen, bedraagt deze termijn dertien
      weken.

      2 Indien het een aanvraag betreft om als zelfstandige bijstand te ontvangen, kunnen burgemeester en wethouders
      de termijn, bedoeld in de tweede volzin van het eerste lid, met ten hoogste dertien weken verlengen, indien zij
      niet in staat zijn tijdig een besluit te nemen. Van de verlenging doen zij mededeling aan de belanghebbende, onder
      vermelding van het tijdstip waarop de termijn voor het nemen van een besluit zal verstrijken.

      3 Burgemeester en wethouders besluiten niet tot toekenning van bijstand dan nadat de juistheid en volledigheid van
      de door de belanghebbende verstrekte gegevens is onderzocht.

      4 Als buiten toedoen van de belanghebbende het onderzoek naar de juistheid en de volledigheid van de door hem
      verstrekte gegevens niet binnen de beslistermijn kan worden voltooid, besluiten burgemeester en wethouders op de
      aanvraag op voet van de dan bekende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel63a
