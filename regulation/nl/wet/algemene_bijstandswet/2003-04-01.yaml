  - number: '16'
    text: >-
      In ieder geval worden niet tot de noodzakelijke kosten van het bestaan gerekend kosten met betrekking tot:


      a. de voldoening aan alimentatieverplichtingen;


      b. de betaling van een boete;


      c. geleden of toegebrachte schade;


      d. vrijwillige premiebetaling in het kader van een publiekrechtelijke verzekering.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel16
  - number: '17'
    text: |-
      1 Geen recht op bijstand bestaat voor zover een beroep kan worden gedaan op een voorliggende voorziening die,
      gezien haar aard en doel, wordt geacht voor de belanghebbende toereikend en passend te zijn.

      2 Het recht op bijstand strekt zich evenmin uit tot kosten die in de voorliggende voorziening als niet noodzakelijk
      worden aangemerkt.

      3 In afwijking van het eerste en tweede lid kunnen burgemeester en wethouders voor de aldaar bedoelde kosten
      bijstand verlenen indien en zolang, gelet op alle omstandigheden, daartoe zeer dringende redenen aanwezig zijn.

      4 Geen bijstand wordt verleend voor kosten van medische handelingen en verrichtingen die gerekend kunnen worden tot
      de ontwikkelingsgeneeskunde als bedoeld in de [Wet op bijzondere medische verrichtingen][ref1], of wanneer zodanige
      medische behandelingen en verrichtingen buiten Nederland plaatsvinden.

      5 De [Wet inkomensvoorziening kunstenaars][ref2] geldt niet als een voorliggende voorziening als bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008974
      [ref2]: https://wetten.overheid.nl/BWBR0009344
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008974
      - id: ref2
        bwb_id: BWBR0009344
  - number: '18'
    text: >-
      Burgemeester en wethouders dragen zorg voor voorlichting en bemiddeling ten behoeve van de belanghebbende die
      noodzakelijk zijn voor de inschakeling van een voorliggende voorziening.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel18
  - number: '19'
    text: Tenzij in deze wet anders is bepaald wordt de bijstand verleend om niet.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel19
  - number: '20'
    text: |-
      1 De belanghebbende die eigenaar is van een door hemzelf of zijn gezin bewoonde woning met bijbehorend erf, heeft
      recht op bijstand voor zover tegeldemaking, bezwaring of verdere bezwaring, anders dan ingevolge dit artikel, van
      het in de woning met bijbehorend erf gebonden vermogen in redelijkheid niet kan worden verlangd.

      2 Indien voor de belanghebbende, bedoeld in het eerste lid, recht op algemene bijstand bestaat, heeft die bijstand
      de vorm van een geldlening onder verband van hypotheek:

      a. indien de bijstand over een periode van een jaar, te rekenen vanaf de eerste dag waarover bijstand wordt
      verleend, naar verwachting meer bedraagt dan het netto minimumloon, bedoeld in [artikel 55, eerste lid][ref1]; en

      b. voor zover het vermogen gebonden in de woning met bijbehorend erf op grond van het derde lid niet buiten
      beschouwing blijft.

      3 Van het vermogen gebonden in de woning met bijbehorend erf blijft buiten beschouwing:

      a. € 6 807 alsmede de helft van het meerdere, doch in totaal ten hoogste € 27 227; en

      b. het bedrag waarmee het bij de aanvang van de bijstandsverlening aanwezige overige vermogen minder bedraagt dan
      de toepasselijke vermogensgrens, genoemd in [artikel 54][ref2].

      4 Indien bijzondere bijstand wordt verleend, kunnen burgemeester en wethouders, indien wordt voldaan
      aan de in het tweede lid genoemde voorwaarden, deze bijstand verstrekken in de vorm van een geldlening
      onder verband van hypotheek, tenzij de belanghebbende recht heeft op een uitkering als bedoeld in
      [artikel 8, tweede lid, van de Wet inkomensvoorziening kunstenaars][ref3].

      5 Indien de bijstand naar verwachting minder bedraagt dan het bedrag bedoeld in het tweede lid, onderdeel a, kunnen
      burgemeester en wethouders deze bijstand uitsluitend verstrekken in de vorm van een geldlening, borgtocht of een
      uitkering om niet.

      6 Het eerste tot en met vijfde lid zijn niet van toepassing:

      a. op de zelfstandige;

      b. indien het een woonwagen betreft.

      7 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de voorwaarden waaronder
      bijstand in de vorm van een geldlening onder verband van hypotheek wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0009344#Artikel8
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel20
