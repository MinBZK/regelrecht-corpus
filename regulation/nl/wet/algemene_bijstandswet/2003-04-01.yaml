        artikel: '22'
        hoofdstuk: III
  - number: '24'
    text: >-
      Bijstand kan eveneens worden verleend in de vorm van een geldlening of borgtocht indien:


      a. redelijkerwijs kan worden aangenomen dat de belanghebbende op korte termijn over voldoende middelen zal
      beschikken om over de betreffende periode in de noodzakelijke kosten van het bestaan te voorzien;


      b. de noodzaak tot bijstandsverlening het gevolg is van een tekortschietend besef van verantwoordelijkheid voor de
      voorziening in het bestaan;


      c. de aanvraag een door de belanghebbende te betalen waarborgsom betreft; dan wel


      d. het bijstand ter gedeeltelijke of volledige aflossing van een schuldenlast betreft.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel24
  - number: '25'
    text: |-
      De bijstand die met toepassing van [artikel 74][ref1] bij wijze van voorschot wordt verleend, heeft de vorm van een
      renteloze geldlening.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel74
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '74'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 25a
    text: |-
      De bijstand die met toepassing van [artikel 144a][ref1] wordt verleend heeft voorlopig de vorm van een renteloze
      geldlening. Het bepaalde bij en krachtens [artikel 23, tweede lid][ref2], is op deze geldlening van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel144a
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel23
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel25a
