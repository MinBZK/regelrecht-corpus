      1 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot:

      a. de periode die de opschorting van de bijstand, bedoeld in [artikel 69, eerste lid][ref1], ten hoogste mag duren;

      b. de termijn waarbinnen burgemeester en wethouders de onderzoeken verrichten, bedoeld in
      [artikel 66, derde, vijfde en zesde lid][ref2].

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot:

      a. de wijze waarop burgemeester en wethouders toepassing geven aan [artikel 66, eerste lid][ref3];

      b. de inhoud van de onderzoeken, bedoeld in [artikel 66, tweede, derde, vijfde en zesde lid][ref4];

      c. de voorwaarden waaronder van de in het eerste lid, onderdeel b, bedoelde termijnen kan worden afgeweken ten
      aanzien van de onderzoeken, bedoeld in [artikel 66, derde en zesde lid][ref5];

      d. de gevallen waarin kan worden afgezien van het onderzoek, bedoeld in [artikel 66, zesde lid][ref6].


