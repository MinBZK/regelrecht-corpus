  - number: 69a
    text: >-
      1 Indien bij de beoordeling van het recht op bijstand blijkt, dat het door een belanghebbende verstrekte adres
      van hemzelf, van zijn echtgenoot of van een kind afwijkt van het adres waaronder de betrokkene in de gemeentelijke
      basisadministratie persoonsgegevens staat ingeschreven, schorten burgemeester en wethouders het recht op bijstand
      op.


      2 Geen opschorting vindt plaats:


      a. indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de bijstand;


      b. indien de belanghebbende van de afwijking redelijkerwijs geen verwijt kan worden gemaakt;


      c. indien daarvoor naar het oordeel van burgemeester en wethouders dringende redenen aanwezig zijn.


      3 Burgemeester en wethouders doen schriftelijk mededeling van de opschorting aan de belanghebbende, en stellen hem
      daarbij in de gelegenheid de in de gemeentelijke basisadministratie persoonsgegevens opgenomen adresgegevens te
      doen aanpassen binnen een door burgemeester en wethouders te stellen termijn.


      4 De opschorting wordt beëindigd zodra het aan burgemeester en wethouders gebleken is dat de afwijking niet meer
      bestaat. Indien de afwijking ook na de krachtens het derde lid gestelde termijn nog bestaat, herzien burgemeester
      en wethouders het besluit tot toekenning van de bijstand, of trekken zij dit in, met ingang van de eerste dag
      waarover het recht op bijstand is opgeschort.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel69a
  - number: '70'
    text: |-
      1 Bij een besluit tot toekenning of voortzetting van bijstand wordt, in een bijlage, mededeling gedaan van de
      rechten en plichten van de belanghebbende, die verband houden met de toekenning of voortzetting van bijstand.
      Hierbij wordt ten minste mededeling gedaan van:

      a. de verplichtingen tot het doen van mededelingen en het verlenen van medewerking, bedoeld in [artikel 65][ref1];

      b. de verplichtingen als bedoeld in [hoofdstuk VIII][ref2] die in het betrokken geval aan de bijstand zijn
      verbonden.

      2 Bij een besluit tot herziening van bijstand wordt mededeling gedaan van de herziening en, in een bijlage, van de
      op die herziening betrekking hebbende gewijzigde rechten en plichten van de belanghebbende. Voorts wordt, indien
      daarvoor aanleiding bestaat, in deze bijlage nogmaals mededeling gedaan van de eerder aan de bijstand verbonden
      rechten en plichten, bedoeld in het eerste lid.

      3 Indien burgemeester en wethouders ter uitvoering van de taak, bedoeld in [artikel 111, eerste lid][ref3], ten
      behoeve van de belanghebbende een plan hebben opgesteld of hebben laten opstellen, gericht op het vergroten van
      de mogelijkheden tot inschakeling in het arbeidsproces, wordt dit opgenomen in een bijlage bij het besluit tot
      toekenning, voortzetting of herziening van bijstand.

      4 De belanghebbende tekent, indien een plan als bedoeld in het derde lid wordt opgesteld, een exemplaar van
      de bijlage, bedoeld in het derde lid, of, indien een dergelijk plan niet wordt opgesteld, een exemplaar van de
      bijlage, bedoeld in het eerste en tweede lid, voor gezien en verstrekt dit aan burgemeester en wethouders. De
      bijlage wordt tevens getekend door burgemeester en wethouders.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0007333#HoofdstukVIII
      [ref3]: https://wetten.overheid.nl/BWBR0007333#Artikel111
