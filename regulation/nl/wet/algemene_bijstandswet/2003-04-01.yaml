  - number: '114'
    text: |-
      1 Voor de belanghebbende die een scholing of opleiding gaat volgen die noodzakelijk wordt geacht voor de
      inschakeling in de arbeid, gelden voor de duur van die scholing of opleiding niet de verplichtingen genoemd in
      [artikel 113, eerste lid, onderdeel ][ref1].

      2 Onze Minister kan regels stellen met betrekking tot het aanmerken van scholing of opleidingen als noodzakelijk
      voor de inschakeling in de arbeid, die bij de beoordeling bedoeld in het eerste lid in acht worden genomen.

      3 Voor de toepassing van het eerste lid wordt als noodzakelijke scholing of opleiding tevens aangemerkt
      de scholing en opleiding, waarvoor de belanghebbende die arbeidsgehandicapte is als bedoeld in de
      [Wet op de (re)integratie arbeidsgehandicapten][ref2] op grond van die wet dan wel op grond van de
      [Wet inschakeling werkzoekenden][ref3] in aanmerking komt en die vooraf aan burgemeester en wethouders is gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0009565
      [ref3]: https://wetten.overheid.nl/BWBR0009083
