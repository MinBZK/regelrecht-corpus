        artikel: '125'
        hoofdstuk: IX
        paragraaf: '2'
  - number: '127'
    text: |-
      Ten behoeve van het gebruik van het sociaal-fiscaalnummer in de in [artikel 117][ref1] bedoelde administratie kent
      Onze Minister van Financiën, in overeenstemming met Onze Minister, aan de uitkeringsgerechtigden die niet reeds ten
      behoeve van de belastingheffing bij de rijksbelastingdienst zijn geregistreerd, een sociaal-fiscaalnummer toe.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel117
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '117'
        hoofdstuk: IX
        paragraaf: '1'
  - number: '130'
    text: |-
      1 Onze Minister is verantwoordelijk voor het toezicht op de uitvoering van deze wet.

      2 Dit toezicht wordt onder gezag van Onze Minister uitgeoefend door de Inspectie Werk en Inkomen,
      genoemd in [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      onder leiding van het hoofd van die inspectie. De [artikelen 37][ref2], [38][ref3], [42][ref4] en
      [44 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] zijn van overeenkomstige toepassing.

      3 Ten behoeve van het toezicht, bedoeld in het eerste lid, dienen burgemeester en wethouders jaarlijks bij
      Onze Minister een verslag in over de uitvoering van deze wet, verstrekken zij hem desgevraagd nadere of andere
      informatie en verlenen zij hem inzage in de administratie, bedoeld in [artikel 117][ref6]. Het verslag en de
      overige informatie worden kosteloos verstrekt.

      4 Het verslag omvat mede een opgave van de ten laste van de gemeente gebleven
      kosten, bedoeld in de [artikelen 3, eerste lid, onder a, b en c][ref7], en
      [12, eerste lid, onder a, b en c van de Wet financiering Abw, IOAW en IOAZ][ref8].

      5 Het verslag is voorzien van een verklaring van de accountant, belast met de in
      [artikel 213 van de Gemeentewet][ref9] voorgeschreven controle omtrent de juistheid en volledigheid van verstrekte
      gegevens.

      6 Onze Minister stelt regels inzake het verslag en over de verklaring en het onderzoek dat resulteert in deze
      verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel38
