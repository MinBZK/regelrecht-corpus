  - number: '10'
    text: >-
      Een persoon van 18, 19 of 20 jaar heeft slechts recht op bijzondere bijstand voor zover zijn noodzakelijke kosten
      van het bestaan uitgaan boven de toepasselijke bijstandsnorm en hij voor deze kosten geen beroep kan doen op zijn
      ouders, omdat:


      a. de middelen van de ouders daartoe niet toereikend zijn; of


      b. hij redelijkerwijs zijn onderhoudsrecht jegens zijn ouders niet te gelde kan maken.
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel10
  - number: '11'
    text: |-
      1 Aan een persoon die geen recht op bijstand heeft, kunnen burgemeester en wethouders, gelet op alle
      omstandigheden, in afwijking van [paragraaf 1][ref1] bijstand verlenen indien zeer dringende redenen daartoe
      noodzaken.

      2 Het eerste lid is niet van toepassing op andere vreemdelingen dan die, bedoeld in
      [artikel 7, tweede en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007333#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel7
