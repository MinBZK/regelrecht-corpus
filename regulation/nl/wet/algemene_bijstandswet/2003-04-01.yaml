  - number: '81'
    text: |-
      1 Bijstand die als gevolg van een besluit als bedoeld in [artikel 14][ref1] of [69, derde of vierde lid][ref2], ten
      onrechte of tot een te hoog bedrag is verleend, wordt van de belanghebbende teruggevorderd.

      2 Hetgeen anderszins onverschuldigd is betaald wordt teruggevorderd voor zover de belanghebbende dit redelijkerwijs
      had kunnen begrijpen.

      3 Terugvordering als bedoeld in het tweede lid vindt niet plaats, indien de betreffende kosten zijn gemaakt meer
      dan twee jaar vóór de datum van verzending van het besluit tot terugvordering.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel14
