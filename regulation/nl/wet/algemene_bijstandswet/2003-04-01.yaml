  - number: '75'
    text: |-
      1 Indien algemene bijstand wordt verleend over een periode, waarover een voorschot is ontvangen met toepassing
      van [artikel 31, tweede lid, van de Werkloosheidswet][ref1], al dan niet met gelijktijdige toepassing
      van [artikel 17, eerste lid, van de Toeslagenwet][ref2], en dit voorschot door het Uitvoeringsinstituut
      werknemersverzekeringen wordt teruggevorderd, kan deze bijstand zonder machtiging van de belanghebbende tot het
      bedrag van dit voorschot aan het Uitvoeringsinstituut werknemersverzekeringen worden betaald.

      2 In het geval, bedoeld in het eerste lid, vergoedt de gemeente aan het Uitvoeringsinstituut
      werknemersverzekeringen tevens de over de te verlenen bijstand verschuldigde loonbelasting, premies
      volksverzekeringen en de ziekenfondspremie.

      3 Indien bijstand wordt verleend over een periode waarover met toepassing van [artikel 74][ref3] een voorschot is
      verleend, kan deze bijstand zonder machtiging van de belanghebbende worden verrekend met dit voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel17
