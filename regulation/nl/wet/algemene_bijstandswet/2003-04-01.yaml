  - number: '8'
    text: |-
      1 Aan de zelfstandige die gedurende een redelijke termijn als zodanig werkzaam is geweest en wiens bedrijf of
      zelfstandig beroep levensvatbaar is, wordt gedurende ten hoogste 12 maanden algemene bijstand verleend. Verlenging
      van deze termijn met ten hoogste 24 maanden is mogelijk indien de oorzaak van de behoefte aan bijstand is gelegen
      in externe omstandigheden van tijdelijke aard.

      2 Aan de persoon of de echtgenoot van de persoon die uit hoofde van werkloosheid een uitkering ontvangt en die een
      bedrijf of zelfstandig beroep begint dat levensvatbaar is, wordt na beëindiging van die uitkering gedurende ten
      hoogste 36 maanden algemene bijstand verleend. Verlenging van deze termijn is mogelijk indien de belanghebbende
      om redenen van medische of sociale aard niet volledig beschikbaar is voor de uitoefening van het bedrijf of
      zelfstandig beroep.

      3 De zelfstandige wiens bedrijf of zelfstandig beroep niet levensvatbaar is heeft in zijn hoedanigheid van
      zelfstandige geen recht op bijstand, tenzij belanghebbende:

      a. 55 jaar of ouder is, het bedrijf of zelfstandig beroep gedurende een aaneengesloten periode van 10 jaar
      onmiddellijk voorafgaand aan de aanvraag heeft uitgeoefend en hieruit een inkomen geniet dat duurzaam ontoereikend
      is om in de noodzakelijke kosten van het bestaan te voorzien; dan wel

      b. zich verplicht de activiteiten in het bedrijf of zelfstandig beroep zo spoedig mogelijk, doch uiterlijk
      binnen 12 maanden, te beëindigen. Verlenging van deze termijn met ten hoogste 12 maanden is op verzoek van de
      belanghebbende mogelijk voor zover de beëindiging naar het oordeel van burgemeester en wethouders een langere
      termijn noodzakelijk maakt.

      4 Aan de zelfstandige die om gezondheidsredenen niet of slechts beperkt in staat is tot
      het uitoefenen van zijn bedrijf of zelfstandig beroep en die een uitkering ingevolge de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] heeft aangevraagd, wordt algemene bijstand verleend
      tot het tijdstip waarop een beslissing ingevolge genoemde wet is genomen. Daarna kan aan de belanghebbende in zijn
      hoedanigheid van zelfstandige slechts bijstand worden verleend met toepassing van het eerste, derde of vijfde lid.

      5 Bijstand ter voorziening in de behoefte aan bedrijfskapitaal kan slechts worden verleend aan de zelfstandige
      bedoeld in het eerste, tweede en derde lid, onderdeel *a*, alsmede in de tweede volzin van het vierde lid.

      6 Bijstandsverlening aan een persoon die algemene bijstand ontvangt, die voornemens is een bedrijf of zelfstandig
      beroep te beginnen en zich in verband hiermee niet beschikbaar stelt voor arbeid in dienstbetrekking kan gedurende
      een voorbereidingsperiode van ten hoogste 12 maanden worden voortgezet. In een zodanig geval:

      a. is [artikel 113, eerste lid, onder a, b, c, d en f][ref2], niet van toepassing;

      b. is de belanghebbende verplicht mee te werken aan begeleiding door een door burgemeester en wethouders aangewezen
      derde; en

      c. kan tot een bij of krachtens algemene maatregel van bestuur vast te stellen maximumbedrag bijstand worden
      verleend ter voorziening in met de voorbereiding samenhangende kosten.

      7 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld ten aanzien van de verlening van
      bijstand als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008656
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel113
