  - number: '26'
    text: |-
      1 Onverminderd [hoofdstuk II][ref1] heeft de alleenstaande of het gezin recht op algemene bijstand indien:

      a. het in aanmerking te nemen inkomen lager is dan de bijstandsnorm, bedoeld in [paragraaf 2][ref2] en [3][ref3];
      en

      b. er geen in aanmerking te nemen vermogen is.

      2 De hoogte van de algemene bijstand is het verschil tussen het inkomen en de bijstandsnorm, bedoeld in
      [paragraaf 2][ref4] en [3][ref5].

      3 In de algemene bijstand is een vakantietoeslag begrepen ter hoogte van 5,2 procent  van die bijstand.

      4 De algemene bijstand wordt verhoogd met de loonbelasting en premies volksverzekeringen waarvoor de gemeente die
      de bijstand verleent, krachtens de [Wet op de loonbelasting 1964][ref6] inhoudingsplichtige is, alsmede met de over
      die bijstand verschuldigde ziekenfondspremie.

      5 Bij de vaststelling van het recht op algemene bijstand, bedoeld in het eerste lid,
      blijft ten aanzien van de alleenstaande of het gezin de heffingskorting, bedoeld in
      [hoofdstuk 8 van de Wet op de inkomstenbelasting 2001][ref7], buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0007333#HoofdstukII
