  - number: '64'
    text: |-
      1 Indien doorzending van de aanvraag naar burgemeester en wethouders van een andere gemeente heeft plaatsgevonden
      en deze van oordeel zijn dat zij evenmin de aanvraag dienen te behandelen, terwijl geen zekerheid kan worden
      verkregen over de in [artikel 63][ref1] bedoelde woonplaats, dragen burgemeester en wethouders die de doorgezonden
      aanvraag hebben ontvangen er zorg voor dat het geschil aanhangig wordt gemaakt.

      2 In afwachting van een beslissing inzake een geschil over toepassing van het eerste lid bestaat het recht op
      bijstand jegens burgemeester en wethouders van de gemeente waar de belanghebbende werkelijk verblijft.

      3 Het [eerste en het tweede lid van artikel 68][ref2] zijn van overeenkomstige toepassing, met dien verstande dat
      de daar genoemde termijnen beginnen te lopen vanaf de mededeling van die doorzending of beslissing.

      4 Kosten van bijstand verleend ingevolge het tweede lid worden vergoed door de gemeente waarvan de taak is
      waargenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel68
