  - number: '85'
    text: |-
      1 Terugvordering geschiedt door burgemeester en wethouders van de gemeente die de bijstand heeft verleend.

      2 Indien een gemeente ingevolge [artikel 64, vierde lid][ref1], gehouden is kosten van bijstand over een bepaalde
      periode aan een andere gemeente te vergoeden, geschiedt de terugvordering over die periode, voor zover zij nog niet
      heeft plaatsgehad, door burgemeester en wethouders van eerstgenoemde gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel64
