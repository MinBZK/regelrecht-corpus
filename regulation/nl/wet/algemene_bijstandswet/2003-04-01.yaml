  - number: '41'
    text: |-
      Burgemeester en wethouders zijn bij de toepassing van [artikel 39, eerste lid][ref1], bevoegd om voor de daar
      bedoelde kosten geheel of gedeeltelijk geen bijstand te verlenen voor zover deze kosten over een periode van twaalf
      maanden een bedrag van f 183  niet te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel39
    url: https://wetten.overheid.nl/BWBR0007333/2003-04-01#Artikel41
