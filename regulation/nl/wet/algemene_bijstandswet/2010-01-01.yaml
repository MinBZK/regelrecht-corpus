preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut ! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter vereenvoudiging en verduidelijking van de regelgeving en ter
    versterking van de verantwoordelijkheid der gemeenten voor de verlening van bijstand gewenst is te komen tot een
    herinrichting van de Algemene Bijstandswet (Stb. 1973, 395) en de daarop berustende nadere regels en daartoe een
    nieuwe Algemene bijstandswet vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007333/2010-01-01#ArtikelAanhef
articles:
  - number: '14'
    text: |-
      1 Indien de belanghebbende blijk heeft gegeven van een tekortschietend besef van verantwoordelijkheid voor de
      voorziening in het bestaan, dan wel in de periode voorafgaand aan de bijstandsaanvraag of nadien onvoldoende
      heeft meegewerkt aan het verkrijgen of behouden van arbeid in dienstbetrekking, de verplichting, bedoeld
      in [artikel 65, eerste lid][ref1], niet binnen de door burgemeester en wethouders daarvoor vastgestelde
      termijn is nagekomen, dan wel een verplichting als bedoeld in [artikel 8, zesde lid, onderdeel b][ref2],
      [artikel 65, tweede of derde lid][ref3], [artikel 70, vierde lid][ref4], of een op grond van [hoofdstuk VIII][ref5]
      aan de bijstand verbonden verplichting niet of niet behoorlijk is nagekomen, weigeren burgemeester en wethouders de
      bijstand tijdelijk geheel of gedeeltelijk.

      2 Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging, de mate waarin de
      belanghebbende de gedraging verweten kan worden en de omstandigheden waarin hij verkeert. Van het opleggen van een
      maatregel wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.

      3 Indien het niet tijdig nakomen van de verplichting, bedoeld in [artikel 65, eerste lid][ref6], niet heeft geleid
      tot het ten onrechte of tot een te hoog bedrag verlenen van bijstand, kunnen burgemeester en wethouders afzien
      van het opleggen van een maatregel als bedoeld in het eerste lid en volstaan met het geven van een schriftelijke
      waarschuwing ter zake van het niet tijdig nakomen van de verplichting, tenzij het niet tijdig nakomen van
      de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de
      belanghebbende een zodanige waarschuwing is gegeven.

      4 Indien daarvoor dringende redenen aanwezig zijn kunnen burgemeester en wethouders besluiten af te zien van het
      opleggen van een maatregel als bedoeld in het eerste lid.

      5 Bij algemene maatregel van bestuur kunnen met betrekking tot het eerste en het tweede lid nadere regels worden
      gesteld.


