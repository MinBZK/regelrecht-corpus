  - number: 14f
    text: |-
      1 Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De titel heeft mede betrekking op de rente en
      kosten, bedoeld in het zevende lid.

      2 Indien degene aan wie een boete is opgelegd algemene bijstand of een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2],
      de[ Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] of
      de[ Wet inkomensvoorziening kunstenaars][ref4] ontvangt, wordt het besluit waarbij de boete is opgelegd
      tenuitvoergelegd door verrekening met die bijstand of uitkering.

      3 Indien degene aan wie een boete is opgelegd inmiddels bijstand of uitkering als bedoeld in het tweede lid
      ontvangt van een andere gemeente dan de gemeente die de boete heeft opgelegd, betaalt die andere gemeente het
      bedrag van die boete, zonder dat daarvoor een machtiging nodig is van de belanghebbende, op haar verzoek aan de
      gemeente die de boete heeft opgelegd.

      4 Indien degene aan wie een boete is opgelegd een uitkering ontvangt op grond van de [Werkloosheidswet][ref5],
      de [Ziektewet][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7], de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref8], de [Wet op de arbeidsongeschiktheidsverzekering][ref9],
      de [Wet arbeidsongeschiktheidsvoorziening militairen][ref10], de [Toeslagenwet][ref11], de
      [Algemene Ouderdomswet][ref12], de [Algemene nabestaandenwet][ref13] of de [Wet arbeid en zorg][ref14], betaalt
      het Uitvoeringsinstituut werknemersverzekeringen, onderscheidenlijk de Sociale verzekeringsbank het bedrag van die
      boete, zonder dat daarvoor diens machtiging nodig is op haar verzoek aan de gemeente die de boete heeft opgelegd.

      5 Indien degene aan wie een boete is opgelegd geen bijstand of uitkering als bedoeld in het tweede of vierde lid
      ontvangt of meer ontvangt, dan wel ten aanzien van zodanige uitkering toepassing van het derde en vierde lid niet
      mogelijk is, wordt het besluit waarbij de boete is opgelegd bij gebreke van tijdige betaling met toepassing van het
      [Wetboek van Burgerlijke Rechtsvordering][ref15] op zijn kosten betekend en tenuitvoergelegd.

      6 De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede,
      derde of vierde lid, dan wel van het vijfde lid, dan wel van het tweede, derde of vierde lid in combinatie met het
      vijfde lid.

      7 Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.

      8 De betekening en tenuitvoerlegging ingevolge het vijfde lid kan geschieden door de deurwaarder, bedoeld in
      [artikel 231, tweede lid, onderdeel ][ref16]. [Artikel 256 van die wet][ref17] is van overeenkomstige toepassing.

      9 Op het executoriaal beslag ingevolge dit artikel door burgemeester en wethouders op loon, sociale uitkeringen
      of andere periodieke betalingen, welke derden verschuldigd zijn of worden aan degene aan wie een boete is
      opgelegd, zijn de [artikelen 479][ref18], behoudens [artikel 479][ref19] van overeenkomstige toepassing. De
      in [artikel 479][ref20] aan de raad voor de kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan
      burgemeester en wethouders.

      10 De tenuitvoerlegging van een besluit met toepassing van dit artikel geschiedt zodanig dat de belanghebbende
      blijft beschikken over een inkomen gelijk aan de beslagvrije voet bedoeld in de [artikelen 475][ref21] en
      [475][ref22].

      11 Het tiende lid geldt niet zolang de belanghebbende zijn verplichting bedoeld in
      [artikel 14a, vijfde lid][ref23], niet of niet behoorlijk nakomt.


