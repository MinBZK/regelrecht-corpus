---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: huurwet
regulatory_layer: WET
publication_date: '2002-12-19'
valid_from: '2002-01-01'
bwb_id: BWBR0002066
url: https://wetten.overheid.nl/BWBR0002066/2002-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen te stellen nopens de huurprijzen van
    onroerend goed en de bescherming van de huurders;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel1
  - number: 1.1.a
    text: ongebouwde onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel1
  - number: 1.1.b
    text: |-
      woonruimte, als bedoeld in [artikel 1, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003221#Artikel1
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003221
        artikel: '1'
  - number: 1.1.c
    text: bedrijfsruimte, als bedoeld in artikel 1624 van het Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel1
  - number: '1.2'
    text: |-
      De Hoofdstukken V en VI, met uitzondering van de artikelen 20 en 27, zijn niet van toepassing op de huur en verhuur
      van woningen, welke aan een gemeente toebehoren en ten tijde van het aangaan van de overeenkomst voor afbraak
      bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel1
  - number: '1.3'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel1
  - number: 1.3.a
    text: |-
      *prijs:* het geheel van de verplichtingen, welke de huurder tegenover de verhuurder bij of ter zake van huur en
      verhuur op zich neemt;
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel1
  - number: 1.3.b
    text: '*huurprijs:* de prijs welke bij huur en verhuur is verschuldigd voor het enkele gebruik van een onroerende zaak;'
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel1
  - number: 1.3.c
    text: |-
      gebouwde onroerende zaak: een gebouw of een gedeelte daarvan, indien dit gedeelte een zelfstandige bedrijfsruimte
      vormt, een en ander met zijn normale onroerende aanhorigheden;
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel1
  - number: 1.3.d
    text: '*Onze Minister:* Onze Minister belast met de zorg voor de volkshuisvesting.'
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel1
  - number: '2.1'
    text: |-
      Terzake van huur en verhuur gelden de prijzen bij of krachtens deze wet bepaald, voor zover partijen niet na de
      inwerkingtreding van de desbetreffende bepalingen lagere prijzen zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      Elk in verband met het tot stand komen van huur en verhuur van een onroerende zaak gemaakt beding, waarbij door of
      tegenover een derde enig niet redelijk voordeel wordt overeengekomen, is nietig.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel2
  - number: '3.1'
    text: |-
      De huurprijs van een vóór 1 juli 2001 tot stand gekomen gebouwde onroerende zaak is de huurprijs op 30 juni 2001,
      tenzij partijen anders overeenkomen, voor zover de overeengekomen huurprijs die, welke op 30 juni 2001 ingevolge
      deze wet ten hoogste mocht worden overeengekomen, met niet meer dan 5,5 ten honderd overschrijdt.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister kan desverzocht het in het eerste lid genoemde percentage vervangen door een hoger indien en
      voorzover zulks nodig is om de huurprijs van de gebouwde onroerende zaak:
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel3
  - number: 3.2.a
    text: |-
      indien het betreft een woning, in betere verhouding te kunnen brengen tot die van in de laatste vijf jaren met
      steun uit ’s Rijks kas op voet van de [Woningwet][ref1] tot stand gekomen woningen;


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 3.2.b
    text: |-
      indien het betreft een gebouwde onroerende zaak, niet zijnde een woning, in betere verhouding te kunnen brengen tot
      die van in de laatste vijf jaren zonder financiële tegemoetkoming van overheidswege tot stand gekomen soortgelijke
      gebouwde onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister maakt van zijn in het voorgaande lid bedoelde bevoegdheid slechts gebruik nadat partijen omtrent
      het hogere percentage tot overeenstemming zijn gekomen of - bij gebreke daarvan - nadat de huurcommissie, bedoeld
      in [artikel 2 van de Wet op de huurcommissies][ref1], zich omtrent de redelijkheid van dit hogere, althans een
      hoger percentage, met het oog op het bereiken van het in het tweede lid, onder *a* of *b* omschreven doel, heeft
      uitgesproken. Daarbij worden buiten beschouwing gelaten belangrijke veranderingen, welke de huurder of degene,
      die krachtens huurbescherming in het genot van de gebouwde onroerende zaak is, onverplicht voor eigen rekening
      in de gedaante en inrichting van de zaak heeft aangebracht en waardoor het woongerief - bij woningen - of de
      gebruikswaarde - bij bedrijfsruimten - geacht kan worden te zijn gestegen, tenzij verrekening der gemaakte kosten
      naar billijkheid heeft plaatsgevonden. Indien partijen nadat Onze Minister van zijn bevoegdheid, hem gegeven in
      lid 2, sub *a*, van dit artikel, gebruik heeft gemaakt, over de huurprijs geen overeenstemming kunnen bereiken,
      stelt Onze Minister die huurprijs desverzocht met ingang van een door hem te bepalen tijdstip vast. Indien bij
      het verzoek geen verklaring, als bedoeld in artikel 12, tweede lid, is overgelegd, hoort Onze Minister alvorens te
      beslissen de huurcommissie, bedoeld in [artikel 2 van de Wet op de huurcommissies][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003222
        artikel: '2'
  - number: '3.4'
    text: |-
      In afwijking van het bepaalde in het eerste lid is de huurprijs van een woning tot stand gekomen met steun uit ’s
      Rijks kas op voet van het Koninklijk besluit van 28 juni 1947, nr. 24: de huurprijs op 30 juni 2001.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel3
  - number: '3.5'
    text: |-
      Overeenkomsten, als bedoeld in het eerste lid mogen, voor zover de huurprijs betreft, een tijdvak van 5 jaar niet
      overschrijden.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel3
  - number: '3.6'
    text: |-
      Voor de toepassing van dit artikel wordt als woning aangemerkt een gebouwde onroerende zaak, die een zelfstandige
      woning vormt, alsmede een andere gebouwde onroerende zaak, waarvan meer dan 60 ten honderd van het totale
      vloeroppervlak behoort tot een niet zelfstandige woning, met uitzondering van winkelwoningen.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel3
  - number: '3.7'
    text: |-
      Indien een gebouwde onroerende zaak op 30 juni 2001 nog niet was tot stand gekomen, of niet of met een andere
      bestemming was verhuurd, of de toen bestaande huur en verhuur niet onder normale omstandigheden was tot stand
      gekomen, dan wel de huurprijs niet met stelligheid uit de totale prijs op 30 juni 2001 kan worden afgeleid, geldt
      als huurprijs op deze datum die van een vergelijkbare onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel3
  - number: '4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor categorieën van gebouwde onroerende zaken, alsmede voor
      bepaalde gebouwde onroerende zaken, welke naar Ons oordeel om bijzondere redenen een afwijkende regeling behoeven,
      andere huurprijzen worden vastgesteld dan die, welke voortvloeien uit het bepaalde in artikel 3.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      In afwijking van het bepaalde in artikel 3 is de huurprijs van een onbewoonbaar verklaarde woning: de huurprijs op
      31 december 1950. Op deze huurprijs is het bepaalde in artikel 3, zevende lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister kan overeenkomstig door Ons bij algemene maatregel van bestuur te stellen regelen het bepaalde in
      het voorgaande lid van toepassing verklaren op een woning, welke - hoewel niet onbewoonbaar verklaard - naar zijn
      oordeel ongeschikt is ter bewoning en niet door het aanbrengen van verbeteringen in bewoonbare staat kan worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel5
  - number: '5.3'
    text: |-
      De krachtens het eerste of tweede lid geldende huurprijs is verschuldigd van de eerste dag af volgende op het einde
      van de betalingstermijn, waarin de onbewoonbaarverklaring onherroepelijk is geworden of de in het laatstgenoemde
      lid bedoelde verklaring is afgelegd.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel5
  - number: '6'
    text: |-
      De huurprijs van een gedeelte van een gebouwde onroerende zaak, welk gedeelte niet een zelfstandige woning of
      zelfstandige bedrijfsruimte vormt, is die, welke tot de huurprijs van de gebouwde onroerende zaak in dezelfde
      verhouding staat als het gebruiksgenot van het gedeelte tot het gebruiksgenot van het geheel.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel6
  - number: '7'
    text: |-
      Indien een gedeelte van een woning of van een bedrijfsruimte is verhuurd, terwijl de verhuurder zelf een gedeelte
      blijft bewonen of voor de uitoefening van zijn bedrijf blijft bezigen, is de huurprijs die, voortvloeiende uit het
      bepaalde in de voorgaande artikelen, vermeerderd met 20%.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel7
  - number: '8.1'
    text: |-
      In afwijking van het bepaalde in artikel 3 is de huurprijs van een tot een door Onze Minister aan te wijzen
      categorie van woningen behorende woning, die op of na 1 juli 1971 wordt verhuurd aan een ander dan degene, die op
      30 juni 1971 als huurder of krachtens huurbescherming in het genot van de woning was: de huurprijs, welke partijen
      zijn overeengekomen of zullen overeenkomen.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      Het bepaalde in het eerste lid vindt slechts toepassing nadat de huurcommissie, bedoeld in
      [artikel 2 van de Wet op de huurcommissies][ref1], desverzocht aan de verhuurder een schriftelijke verklaring heeft
      verstrekt, blijkens welke de woning behoort tot de in het eerste lid bedoelde categorie van woningen. Het bepaalde
      in artikel 11, tweede lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: '8.3'
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing op een woning, als in dat lid bedoeld, die op 30
      juni 1971 niet of met een andere bestemming was verhuurd.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel8
  - number: '8.4'
    text: |-
      Het bepaalde in de artikelen 6 en 7 is niet van toepassing op een woning ten aanzien waarvan het eerste of derde
      lid toepassing heeft gevonden.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien huur en verhuur meer omvat dan het enkele gebruik van een onroerende zaak, is de prijs die voor het enkele
      gebruik van de onroerende zaak, vermeerderd met:
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel9
  - number: 9.1.a
    text: voor water, gas, elektriciteit of andere energie de werkelijke kosten of de naar redelijkheid geschatte kosten;
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel9
  - number: 9.1.b
    text: |-
      voor het gebruik van meubelen of stoffering een bedrag, berekend naar 20% ’s jaars van de verkoopwaarde op het
      ogenblik van ingebruikgeving;
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel9
  - number: 9.1.c
    text: |-
      voor het medegebruik van meubelen of stoffering een evenredig deel van het bedrag, dat voor het uitsluitend gebruik
      verschuldigd zou zijn;
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel9
  - number: 9.1.d
    text: |-
      voor het overige de vergoedingen, welke hiervoor ingevolge wettelijke voorschriften ten hoogste mogen worden
      berekend of, voor zover deze voorschriften ontbreken, de vergoedingen welke hiervoor als redelijk zijn aan te
      merken.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      In afwijking van het in het voorgaande lid onder *b* en *c* bepaalde zal, indien op enig tijdstip na 31 december
      1953 het gebruik of medegebruik van meubelen of stoffering vijf achtereenvolgende jaren heeft geduurd, het aldaar
      bedoelde bedrag gedurende de daarop volgende vijf jaren worden berekend naar 20% ’s jaars van de verkoopwaarde van
      die meubelen of stoffering op dat tijdstip. Het hier bepaalde is van overeenkomstige toepassing telkens indien na
      genoemd tijdstip het gebruik of medegebruik vijf jaren of een veelvoud daarvan heeft voortgeduurd.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel9
  - number: '11.1'
    text: |-
      De huurcommissie, bedoeld in [artikel 2 van de Wet op de huurcommissies][ref1], brengt aan de huurder of gewezen
      huurder, of aan de verhuurder of aan beiden, desverzocht een met redenen omkleed schriftelijk advies uit over de
      vraag, welke de betalingsverplichting van de huurder of gewezen huurder is.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: '11.2'
    text: |-
      Voor een door de huurcommissie, bedoeld in [artikel 2 van de Wet op de huurcommissies][ref1], ingevolge dit artikel
      uitgebracht advies is door de verzoeker een vergoeding aan de Staat verschuldigd, waarvan het bedrag en de wijze
      van betaling bij algemene maatregel van bestuur worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: '12.1'
    text: |-
      De huurcommissie, bedoeld in [artikel 2 van de Wet op de huurcommissies][ref1], verstrekt desverzocht aan de
      verhuurder, die de huurder of gewezen huurder tot ontruiming heeft gedagvaard, hetzij een schriftelijke verklaring,
      houdende dat deze de zaak niet heeft onderverhuurd, hetzij een schriftelijke verklaring, houdende de namen en
      woonplaatsen der onderhuurders, zomede alle verdere gegevens betreffende de onderhuurders, welke naar het oordeel
      der commissie ter kennis van de rechter behoren te worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: '12.2'
    text: |-
      De huurcommissie, bedoeld in [artikel 2 van de Wet op de huurcommissies][ref1], verstrekt desverzocht aan
      de verhuurder, die niet binnen een maand nadat hij de huurder of gewezen huurder schriftelijk een nieuwe
      huurovereenkomst heeft aangeboden, met hem daaromtrent tot overeenstemming is gekomen, een schriftelijke
      verklaring, waarin haar oordeel omtrent de redelijkheid van dat aanbod is vervat en waarin tevens is aangegeven met
      ingang van welk tijdstip de nieuwe overeenkomst naar haar mening behoort in te gaan. Het bepaalde in artikel 11,
      tweede lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: '12.3'
    text: |-
      De huurcommissie, bedoeld in [artikel 2 van de Wet op de huurcommissies][ref1], neemt bij het bepalen van haar, in
      het tweede lid bedoelde, oordeel de bij of krachtens algemene maatregel van bestuur gestelde regels in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: '13.1'
    text: |-
      De huurcommissie, bedoeld in [artikel 2 van de Wet op de huurcommissies][ref1], brengt op bevel van de rechter een
      schriftelijk rapport uit, bevattende alle inlichtingen nopens de betalingsverplichting van de huurder of gewezen
      huurder, welke de rechter dienstig acht met betrekking tot een zaak waarin hij ingevolge deze wet moet oordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: '13.2'
    text: |-
      De rechter zal op de adviezen, verklaringen en rapporten van de huurcommissie, bedoeld in
      [artikel 2 van de Wet op de huurcommissies][ref1], zodanig acht slaan, als hij zal vermenen te behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: '15.1'
    text: |-
      De huurder of gewezen huurder en de verhuurder kunnen zich, gezamenlijk dan wel afzonderlijk, schriftelijk wenden
      tot de kantonrechter, van de rechtbank van het arrondissement waarin de onroerende zaak of het belangrijkste
      gedeelte daarvan is gelegen, met verzoek te verklaren, welke de betalingsverplichting van de huurder of gewezen
      huurder is.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel15
  - number: '15.2'
    text: |-
      Het verzoek is niet ontvankelijk, indien daarbij niet een advies, als bedoeld in artikel 11, wordt overgelegd. De
      rechter spreekt de niet-ontvankelijkheid niet uit dan nadat hij de verzoeker in de gelegenheid heeft gesteld het
      gepleegde verzuim binnen een door hem te bepalen termijn te herstellen.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel15
  - number: '15.3'
    text: |-
      Indien de huurder of gewezen huurder of de verhuurder zich afzonderlijk tot de kantonrechter wendt, zal hij aan
      zijn verzoekschrift en het daarbij over te leggen advies een afschrift van deze stukken moeten toevoegen.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel15
  - number: '16.1'
    text: |-
      De kantonrechter bepaalt de dag en het uur, waarop het verzoek ter terechtzitting zal worden behandeld. De
      terechtzitting is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel16
  - number: '16.2'
    text: |-
      De griffier roept de huurder of gewezen huurder en de verhuurder op om ter terechtzitting te verschijnen, ten einde
      naar aanleiding van het verzoek te worden gehoord. De oproeping geschiedt bij aangetekende brief, waarvoor een
      bericht van ontvangst wordt verlangd, tenzij de rechter op grond van bijzondere omstandigheden een andere wijze
      van oproeping beveelt. Zij moet ten minste vijf dagen voor de dag, waarop het verzoek ter terechtzitting wordt
      behandeld, worden verzonden.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel16
  - number: '16.3'
    text: |-
      In het in artikel 15, lid 3, bedoelde geval zullen de door de verzoeker verstrekte afschriften door de griffier,
      na door deze voor eensluidend te zijn gewaarmerkt, bij de oproeping van degene, die het verzoek niet heeft gedaan,
      worden medegezonden.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel16
  - number: '17.1'
    text: |-
      De kantonrechter beslist bij schriftelijke, met redenen omklede en in het openbaar uit te
      spreken beschikking. Afschrift van zijn beschikking zendt hij aan de huurcommissie, bedoeld in
      [artikel 2 van de Wet op de huurcommissies][ref1], in zijn rechtsgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: '17.2'
    text: |-
      Tegen deze beschikking staat hoger beroep noch beroep in cassatie open, met uitzondering van cassatie in het belang
      der wet.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel17
  - number: '17.3'
    text: |-
      Aan de beschikking van de kantonrechter zijn in een latere procedure zowel de huurder of gewezen huurder als
      de verhuurder gebonden, tenzij een hunner aantoont, dat de omstandigheden sedert het ogenblik waarop bedoelde
      beschikking is gegeven, zo aanmerkelijk zijn veranderd, dat, hadden deze bestaan op genoemd ogenblik, de beslissing
      een andere zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel17
  - number: '18.1'
    text: |-
      Na het einde van de huur en verhuur is de gewezen huurder van rechtswege bevoegd krachtens huurbescherming in het
      genot van de onroerende zaak te blijven. Zulks geldt niet voor de gewezen huurder, die zelf de huurovereenkomst
      heeft opgezegd, of uitdrukkelijk in de beëindiging daarvan heeft bewilligd.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel18
  - number: '18.2'
    text: 'De verhuurder kan de ontruiming door de huurder of gewezen huurder slechts vorderen:'
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel18
  - number: 18.2.a
    text: |-
      indien wegens onbehoorlijk gebruik van de zaak, wegens ernstige overlast, zijn medebewoners, dan wel de verhuurder
      aangedaan, of wegens wanbetaling, van de verhuurder niet kan worden gevergd, dat de huurder of gewezen huurder nog
      langer in het genot van de zaak blijft;
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel18
  - number: 18.2.b
    text: |-
      indien de gewezen huurder het genot kan verkrijgen van een soortgelijke hem passende onroerende zaak en in verband
      daarmede van de verhuurder niet kan worden gevergd, dat de gewezen huurder nog langer in het genot van de zaak
      blijft;
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel18
  - number: 18.2.c
    text: |-
      indien de gewezen huurder niet toestemt in een redelijk aanbod tot het aangaan van een nieuwe huurovereenkomst met
      betrekking tot dezelfde onroerende zaak;
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel18
  - number: 18.2.d
    text: |-
      indien de verhuurder de onroerende zaak zo dringend nodig heeft voor eigen gebruik, vervreemding van de zaak niet
      daaronder begrepen, dat van hem, de economische belangen en maatschappelijke behoeften van beide partijen en van
      wettige onderhuurders naar billijkheid in aanmerking genomen, niet kan worden gevergd, dat de gewezen huurder nog
      langer in het genot van de zaak blijft;
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel18
  - number: 18.2.e
    text: |-
      indien de verhuurder de onroerende zaak nodig heeft, ten einde aan een wettelijk voorschrift of een beschikking van
      overheidswege te kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel18
  - number: '18.3'
    text: |-
      Als gewezen huurder worden na het overlijden van de huurder, indien de huurovereenkomst door dit overlijden wordt
      beëindigd, of na het overlijden van hem, die krachtens huurbescherming in het genot van de onroerende zaak is
      gebleven, aangemerkt:
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel18
  - number: 18.3.a
    text: |-
      indien het betreft een woning: diens echtgenoot, wanneer deze ten tijde van het overlijden in de woning zijn
      hoofdverblijf heeft, en de bloed- en aanverwanten van de overledene of van diens echtgenoot, in de rechte linie,
      en in de zijlinie in de tweede graad, en voorts zij over wie de overledene of diens echtgenoot te eniger tijd de
      voogdij heeft uitgeoefend, voor zover zij ten tijde van het overlijden in de woning hun hoofdverblijf hebben en tot
      aan het overlijden in de woning met de overledene een gemeenschappelijke huishouding hadden;
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel18
  - number: 18.3.b
    text: |-
      indien het betreft een gebouwde onroerende zaak, niet zijnde een woning: de echtgenoot van de overledene, alsmede
      de bloed- en aanverwanten van de overledene of van diens echtgenoot, in de rechte linie, en in de zijlinie in de
      tweede graad, en voorts zij over wie de overledene of diens echtgenoot te eniger tijd de voogdij heeft uitgeoefend,
      voor zover en zolang zij als rechtsopvolger onder algemene titel van de overledene diens bedrijf of beroep
      voortzetten.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel18
  - number: '18.4'
    text: |-
      Indien de huurovereenkomst na het overlijden van de huurder van een woning niet is geëindigd, worden, voor zover
      zij niet de hoedanigheid van huurder bezitten, als gewezen huurder aangemerkt de echtgenoot van de overledene,
      wanneer deze ten tijde van het overlijden in de woning zijn hoofdverblijf heeft, en de bloed- en aanverwanten van
      de overledene of van diens echtgenoot, in de rechte linie, en in de zijlinie in de tweede graad, en voorts zij over
      wie de overledene of diens echtgenoot te eniger tijd de voogdij heeft uitgeoefend, voor zover zij ten tijde van
      het overlijden in de woning hun hoofdverblijf hebben en tot aan het overlijden in de woning met de overledene een
      gemeenschappelijke huishouding hadden.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel18
  - number: '18.5'
    text: |-
      Indien het bepaalde in het vierde lid toepassing vindt, is hij die als gewezen huurder wordt aangemerkt bij
      uitsluiting bevoegd tot het genot van de woning, voor zover degene die na het overlijden de hoedanigheid van
      huurder heeft verkregen ten tijde van het overlijden niet reeds het genot van die woning bezat. De huurder zal
      echter zolang hij niet bevoegd is tot het genot van de woning de huur en verhuur mogen beëindigen.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel18
  - number: '19.1'
    text: |-
      Zolang de gewezen huurder in het geval bedoeld in het eerste lid van artikel 18 krachtens huurbescherming in
      het genot van de zaak blijft, hebben hij en de verhuurder dezelfde rechten en verplichtingen als indien de huur
      en verhuur niet zou zijn geëindigd zonder dat nochtans beroep kan worden gedaan op een in de huurovereenkomst
      opgenomen opzeggingstermijn.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel19
  - number: '19.2'
    text: |-
      Op degenen die ingevolge het bepaalde in het derde en vierde lid van artikel 18 als gewezen huurder worden
      aangemerkt, is het voorgaande lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel19
  - number: '19.3'
    text: Als verhuurder worden mede aangemerkt diens rechtsopvolgers ten aanzien van de onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel19
  - number: '20.1'
    text: |-
      In alle gedingen, waarin de vraag, welke de betalingsverplichting van de huurder of gewezen huurder is, een punt
      van geschil uitmaakt, zal de rechter, tenzij een advies als bedoeld in artikel 11 is overgelegd, alvorens te
      beslissen, bevelen dat de huurcommissie, bedoeld in [artikel 2 van de Wet op de huurcommissies][ref1], hem over
      deze vraag een schriftelijk rapport zal uitbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: '20.2'
    text: |-
      Tegen de beslissing van het in het eerste lid bedoelde geschilpunt staat hoger beroep noch beroep in cassatie
      open, met uitzondering van cassatie in het belang der wet, tenzij een der partijen aantoont, dat de omstandigheden,
      sedert het ogenblik, waarop bedoelde beslissing is gegeven, zo aanmerkelijk zijn veranderd, dat, hadden deze
      bestaan op genoemd ogenblik, de beslissing een andere zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel20
  - number: '21.1'
    text: |-
      In alle gedingen tot ontruiming, gegrond op artikel 18, lid 2, onder *d*, kan de verhuurder in zijn
      vordering tot ontruiming niet worden ontvangen, indien hij niet een door de huurcommissie, bedoeld in
      [artikel 2 van de Wet op de huurcommissies][ref1], verstrekte verklaring als bedoeld in artikel 12, eerste lid,
      overlegt. De rechter spreekt de niet-ontvankelijkheid niet uit dan nadat hij de verhuurder in de gelegenheid heeft
      gesteld het gepleegde verzuim binnen een door hem te bepalen termijn te herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: '21.2'
    text: |-
      In alle gedingen tot ontruiming gegrond op artikel 18, tweede lid, onder *c*, kan de verhuurder in zijn
      vordering tot ontruiming niet worden ontvangen, indien hij niet een door de huurcommissie, bedoeld in
      [artikel 2 van de Wet op de huurcommissies][ref1], verstrekte verklaring als bedoeld in artikel 12, tweede lid,
      overlegt. Het bepaalde in de tweede zin van het eerste lid is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: '22.1'
    text: |-
      De rechter zal op verzoek van de verhuurder, die ontruiming vordert, de som bepalen, welke de huurder of gewezen
      huurder verplicht is te betalen als voorlopige vergoeding voor het genot van het goed gedurende de procedure.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel22
  - number: '22.2'
    text: |-
      De rechter beslist bij in het openbaar uit te spreken beschikking. Tegen deze beschikking staat hoger beroep noch
      beroep in cassatie open, met uitzondering van cassatie in het belang der wet.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel22
  - number: '22.3'
    text: |-
      Indien de huurder of gewezen huurder in gebreke blijft de door de rechter vastgestelde som te betalen, kan de
      rechter aanstonds de eis tot ontruiming toewijzen.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel22
  - number: '23.1'
    text: |-
      De rechter kan, alvorens de vordering tot ontruiming op grond van wanbetaling, als bedoeld in artikel 18, lid
      2, onder *a*, toe te wijzen, de huurder of gewezen huurder, naar gelang der omstandigheden, een termijn van ten
      hoogste één maand gunnen om alsnog aan zijn betalingsverplichting te voldoen.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel23
  - number: '23.2'
    text: |-
      De rechter zal in ieder geval een termijn van ten minste één maand gunnen, indien hem blijkt, dat de wanbetaling
      uitsluitend te wijten is aan de omstandigheid, dat tussen partijen geschil bestond over de vraag, welke de
      betalingsverplichting van de huurder of gewezen huurder is.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel23
  - number: 23a.1
    text: |-
      De rechter zal zich, tenzij een verklaring als bedoeld in artikel 12, tweede lid, is overgelegd, alvorens de
      vordering tot ontruiming op grond van artikel 18, lid 2, onder *c*, toe te wijzen, omtrent de redelijkheid van
      de in het aanbod genoemde prijs - indien daaromtrent verschil van mening bestaat - doen voorlichten door de
      huurcommissie, bedoeld in [artikel 2 van de Wet op de huurcommissies][ref1], in zijn rechtsgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: 23a.2
    text: |-
      De rechter kan, alvorens de vordering tot ontruiming op grond van artikel 18, lid 2 onder *c*, toe te wijzen, de
      huurder of gewezen huurder, naar gelang der omstandigheden, een termijn van ten hoogste één maand gunnen om alsnog
      het aanbod te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel23a
  - number: '24.1'
    text: |-
      Bij veroordeling van de huurder of gewezen huurder tot ontruiming kan de rechter, behoudens het in artikel 25
      bepaalde, desverzocht bepalen dat tenuitvoerlegging van het vonnis niet kan plaats hebben dan na verloop van een
      door hem vast te stellen termijn. Gedurende deze termijn duurt de bevoegdheid om krachtens huurbescherming in het
      genot van de zaak te blijven voort.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel24
  - number: '24.2'
    text: |-
      De rechter kan deze termijn slechts eenmaal, en wel met ten hoogste twee maanden verlengen. Het verzoek tot
      verlenging moet uiterlijk vier weken voor het verstrijken van de termijn worden ingediend.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel24
  - number: '25.1'
    text: |-
      Bij veroordeling van een huurder of gewezen huurder tot ontruiming van een woning, uitsluitend op grond dat de
      verhuurder deze voor eigen gebruik, als bedoeld in artikel 18, lid 2, onder *d*, nodig heeft, zal in het vonnis
      worden bepaald, dat tenuitvoerlegging daarvan niet kan plaats hebben dan na verloop van een door burgemeester en
      wethouders der betrokken gemeente vast te stellen termijn. Deze termijn zal niet langer mogen zijn dan zes maanden
      na het tijdstip van het vonnis.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel25
  - number: '25.2'
    text: |-
      Ingeval een huurder of gewezen huurder wordt veroordeeld tot ontruiming van een gebouwde onroerende zaak of van een
      gedeelte daarvan, uitsluitend op grond dat de verhuurder deze zaak of dit gedeelte voor eigen gebruik als bedoeld
      in artikel 18, lid 2, onder *d*, nodig heeft, zal, mits aannemelijk is dat de verhuurder binnen twee jaar en zes
      maanden voor het vonnis met het oog op dat gebruik in de rechten van de vorige verhuurder is getreden, terwijl de
      huurder of gewezen huurder de zaak of het gedeelte reeds toen als zodanig gebruikte, in het vonnis worden bepaald
      dat tenuitvoerlegging daarvan niet kan plaatshebben dan na verloop van drie jaren, te rekenen van het tijdstip van
      de rechtsopvolging. De datum waarop genoemde termijn eindigt, wordt door de rechter in het vonnis vermeld.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel25
  - number: '25.3'
    text: |-
      Gedurende een ingevolge dit artikel toegestane termijn duurt de bevoegdheid om krachtens huurbescherming in het
      genot van de zaak te blijven voort.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel25
  - number: '26.1'
    text: |-
      Na verloop van één jaar, te rekenen van de dag, waarop voor de eerste maal bij gewijsde de betalingsverplichting
      van de huurder of gewezen huurder is vastgesteld, doch nooit later dan één jaar, te rekenen van de dag waarop het
      genot van de onroerende zaak is geëindigd, vervalt de rechtsvordering ter zake van hetgeen onverschuldigd mocht
      zijn betaald.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel26
  - number: '26.2'
    text: |-
      De rechter kan de in het eerste lid bedoelde vordering tot een verminderd bedrag toewijzen, indien de billijkheid
      zulks vergt.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel26
  - number: 26a
    text: |-
      Indien de rechter de huurder machtigt bepaalde onderhoudswerken of reparatiën ten koste van de verhuurder uit te
      voeren, kan hij tevens bepalen, tot welk bedrag de huurder de gemaakte kosten met de huurprijs kan verrekenen.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel26a
  - number: '27.1'
    text: |-
      De behandeling van alle vorderingen, betrekkelijk tot huur en verhuur of tot huurbescherming, vorderingen tot
      ontruiming daaronder begrepen, geschiedt in eerste aanleg bij uitsluiting door de kantonrechter van de rechtbank
      van het arrondissement waarin de onroerende zaak of het belangrijkste gedeelte daarvan is gelegen.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel27
  - number: '27.3'
    text: |-
      Onverminderd het in artikel 20, lid 2, bepaalde staan tegen vonnissen, gewezen naar aanleiding van de in het
      eerste en tweede lid bedoelde vorderingen, rechtsmiddelen slechts open, indien zulks volgens de regelen van het
      gemene recht het geval is, echter met dien verstande dat, indien de rechter over de vordering tot ontruiming een
      beslissing ten principale heeft gegeven, tegen de beslissing van dit geschilpunt in ieder geval hoger beroep en
      beroep in cassatie openstaan.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel27
  - number: '27.4'
    text: |-
      De termijnen van hoger beroep en beroep in cassatie bedragen zes weken, te rekenen van de dag van de uitspraak van
      het vonnis.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel27
  - number: '28'
    text: |-
      De [tweede paragraaf van de twaalfde afdeling van de tweede titel van het eerste boek van het Wetboek van
      Burgerlijke Rechtsvordering](onbekend) is van overeenkomstige toepassing, met dien verstande, dat de rechter de
      kosten geheel of ten dele kan compenseren.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28
  - number: 28a.1
    text: Wij kunnen bij algemene maatregel van bestuur
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28a
  - number: 28a.1.a
    text: |-
      gemeenten of gedeelten van gemeenten aanwijzen waarin het bepaalde in Hoofdstuk II, de artikelen 11 en 12 en de
      Hoofdstukken IV-VI, met uitzondering van de artikelen 26*a*, 27, eerste en tweede lid en 28 niet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28a
  - number: 28a.1.b
    text: |-
      gemeenten of gedeelten van gemeenten aanwijzen waarin de onder *a* genoemde voorschriften niet van toepassing zijn
      ten aanzien van bij die algemene maatregel van bestuur aan te wijzen categorieën van gebouwde onroerende zaken
      of gedeelten daarvan, waarvan de - op de dag, voorafgaande aan de dag van inwerkingtreding van bedoelde algemene
      maatregel van bestuur, ingevolge deze wet geldende - huurprijs een bij die algemene maatregel van bestuur te
      bepalen bedrag overschrijdt.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28a
  - number: 28a.2
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid treedt niet eerder in werking dan twee maanden na
      de dagtekening van het *Staatsblad* waarin Ons besluit is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28a
  - number: 28b.1
    text: |-
      In de gemeenten of gedeelten van gemeenten ten aanzien waarvan artikel 28*a,* eerste lid, toepassing heeft gevonden
      is de huurprijs van een gebouwde onroerende zaak dan wel van de in dat artikel bedoelde categorieën van gebouwde
      onroerende zaken:
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28b
  - number: 28b.1.a
    text: |-
      indien het betreft een woning of een gedeelte daarvan: de huurprijs op de dag, voorafgaande aan de dag van
      inwerkingtreding van bedoelde algemene maatregel van bestuur, tenzij partijen nadien anders overeenkomen;
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28b
  - number: 28b.1.b
    text: |-
      indien het betreft een gebouwde onroerende zaak, niet zijnde een woning, of een gedeelte daarvan: de huurprijs, die
      partijen zijn overeengekomen of zullen overeenkomen.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28b
  - number: 28b.2
    text: Voor de toepassing van dit Hoofdstuk is het bepaalde in artikel 3, zesde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28b
  - number: 28c.1
    text: |-
      In de gemeenten of gedeelten van gemeenten ten aanzien waarvan het bepaalde in artikel 28*a,* eerste lid, onder
      *a,* toepassing heeft gevonden is na het einde van de huur en verhuur dan wel van de bevoegdheid om krachtens
      huurbescherming in het genot te blijven van een gebouwde onroerende zaak of een gedeelte daarvan de verplichting
      van de gewezen huurder om tot ontruiming over te gaan, van rechtswege geschorst. Deze schorsing eindigt twee
      maanden na het tijdstip waartegen de ontruiming is aangezegd. De aanzegging geschiedt bij deurwaardersexploit
      of bij aangetekende brief, waarvoor een bericht van ontvangst wordt verlangd; zij kan eerst geschieden na de
      inwerkingtreding van de in artikel 28*a,* eerste lid, bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28c
  - number: 28c.2
    text: |-
      Het bepaalde in dit eerste lid geldt niet voor de gewezen huurder, die zelf de huurovereenkomst heeft opgezegd,
      uitdrukkelijk in de beëindiging daarvan heeft bewilligd of veroordeeld is tot ontruiming wegens niet-nakoming
      zijner verplichtingen. Het geldt met ingang van een door Ons te bepalen tijdstip evenmin voor degene, die eerst na
      dit tijdstip huurder van een woning of een gedeelte daarvan is geworden.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28c
  - number: 28c.3
    text: |-
      Het bepaalde in dit artikel en in de volgende artikelen van dit Hoofdstuk geldt mede in gemeenten of gedeelten van
      gemeenten ten aanzien waarvan het bepaalde in artikel 28*a,* eerste lid, onder *b,* toepassing heeft gevonden, doch
      alleen met betrekking tot de aldaar bedoelde categorieën van gebouwde onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28c
  - number: 28d.1
    text: |-
      Zolang de in artikel 28*c,* eerste lid, bedoelde termijn niet is verstreken kan de gewezen huurder zich
      schriftelijk tot de kantonrechter, van de rechtbank van het arrondissement waarin de onroerende zaak of het
      gedeelte daarvan is gelegen, wenden met het verzoek om die termijn te verlengen. Het verzoek bevat de gronden
      waarop het berust. De indiening van het verzoek schorst de verplichting om tot ontruiming over te gaan, totdat
      daaromtrent is beslist.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28d
  - number: 28d.2
    text: De kantonrechter wijst, indien hem blijkt, dat het verzoek niet tijdig is ingediend, het verzoek terstond af.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28d
  - number: 28d.3
    text: |-
      De kantonrechter willigt het verzoek slechts in, indien de belangen van de gewezen huurder door de ontruiming
      ernstiger worden geschaad dan die van de verhuurder bij voortzetting van het genot door de gewezen huurder.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28d
  - number: 28d.4
    text: |-
      De kantonrechter kan het verzoek niettemin afwijzen, indien de verhuurder aannemelijk maakt, dat van hem, wegens
      onbehoorlijk gebruik van de zaak of het gedeelte daarvan, wegens ernstige overlast, de medebewoners dan wel hemzelf
      aangedaan, of wegens wanbetaling, niet gevergd kan worden, dat de gewezen huurder nog langer in het genot van de
      zaak of het gedeelte daarvan blijft.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28d
  - number: 28e.1
    text: |-
      Bij inwilliging van het verzoek verlengt de kantonrechter de in artikel 28*c* bedoelde termijn tot ten hoogste één
      jaar. Deze termijn kan op verzoek van de gewezen huurder nog tweemaal worden verlengd met telkens ten hoogste een
      jaar. Het verzoek tot verlenging moet uiterlijk vier weken voor het verstrijken van de termijn worden ingediend. De
      indiening van het verzoek schorst de verplichting om tot ontruiming over te gaan totdat daaromtrent is beslist.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28e
  - number: 28e.2
    text: |-
      Indien partijen het niet eens zijn over de som, welke de gewezen huurder verplicht is te betalen als vergoeding
      voor het genot van de zaak of het gedeelte daarvan voor de termijn, waarmede de in artikel 28*c* bedoelde termijn
      is verlengd, wordt deze bij zijn hiervóór bedoelde beschikking bepaald door de kantonrechter, na ingewonnen advies
      van de huurcommissie, bedoeld in [artikel 2 van de Wet op de huurcommissies][ref1]. Hij stelt deze som vast op een,
      gezien het huurpeil ter plaatse, redelijk te oordelen bedrag. Hetzelfde geldt bij verdere verlenging van de termijn
      overeenkomstig het voorgaande lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28e
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: 28e.3
    text: |-
      Bij afwijzing van het verzoek anders dan op grond van artikel 28*d*, tweede lid, bepaalt de kantonrechter de
      termijn, binnen welke de gewezen huurder de zaak of het gedeelte daarvan moet ontruimen.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28e
  - number: 28f.1
    text: |-
      Het verzoek, bedoeld in de artikelen 28*d* en 28*e,* wordt in drievoud op ongezegeld papier ter griffie van de
      rechtbank ingediend.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28f
  - number: 28f.2
    text: |-
      De kantonrechter bepaalt de dag en het uur waarop het verzoek ter terechtzitting zal worden behandeld. De
      terechtzitting is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28f
  - number: 28f.3
    text: |-
      De griffier roept de gewezen huurder en de verhuurder op om ter terechtzitting te verschijnen, ten einde naar
      aanleiding van het verzoek te worden gehoord. De oproeping geschiedt bij aangetekende brief, waarvoor een bericht
      van ontvangst wordt verlangd, tenzij de kantonrechter op grond van bijzondere omstandigheden een andere wijze
      van oproeping beveelt. Zij moet ten minste vijf dagen voor de dag, waarop het verzoek ter terechtzitting wordt
      behandeld worden verzonden.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28f
  - number: 28f.4
    text: |-
      De griffier zendt bij de oproeping van de verhuurder een door hem voor eensluidend gewaarmerkt afschrift van het
      verzoek mede.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28f
  - number: 28g.1
    text: |-
      De kantonrechter beslist bij schriftelijke met redenen omklede en in het openbaar uit te spreken beschikking.
      Bij inwilliging van het verzoek zendt hij afschrift van zijn beschikking aan de huurcommissie, bedoeld in
      [artikel 2 van de Wet op de huurcommissies][ref1], in zijn rechtsgebied, indien deze gehoord is omtrent de
      vergoeding, als bedoeld in artikel 28e.


      [ref1]: https://wetten.overheid.nl/BWBR0003222#Artikel2
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28g
    references:
      - id: ref1
        bwb_id: BWBR0003222
        artikel: '2'
  - number: 28g.2
    text: |-
      Tegen de beschikking staat hoger beroep noch beroep in cassatie open, met uitzondering van cassatie in het belang
      der wet.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28g
  - number: 28h.1
    text: |-
      Zolang de termijnen, bedoeld in de artikelen 28*c,* 28*d* en 28*e,* niet zijn verstreken, hebben de gewezen huurder
      en de verhuurder - behoudens het bepaalde in het tweede lid van artikel 28*e* - dezelfde rechten en verplichtingen,
      als indien de huur en verhuur, dan wel de bevoegdheid om krachtens huurbescherming in het genot van de onroerende
      zaak of het gedeelte daarvan te blijven, niet zou zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28h
  - number: 28h.2
    text: |-
      In afwijking van het voorgaande lid kan de kantonrechter, hangende zijn beslissing omtrent een verzoek, als bedoeld
      in artikel 28*d,* op verzoek van de verhuurder de som bepalen, die de gewezen huurder verplicht is te betalen als
      voorlopige vergoeding voor het genot van de zaak of het gedeelte daarvan gedurende de procedure.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel28h
  - number: '29'
    text: De toepasselijkheid van de bepalingen van deze wet kan niet bij overeenkomst worden uitgesloten of beperkt.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel29
  - number: '30'
    text: 'De navolgende voorschriften vervallen:'
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel30
  - number: 30.a
    text: het Huurbeschermingsbesluit 1941 (*Verordeningenblad* 1941, No. 81);
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel30
  - number: 30.b
    text: het Huurprijsbesluit 1940 (*Verordeningenblad* 1940, No. 237);
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel30
  - number: 30.c
    text: het Huurprijsuitvoeringsbesluit 1941 (*Nederlandse Staatscourant* 1941, No. 236);
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel30
  - number: 30.d
    text: het Huurprijsbesluit Nieuwbouw 1944 (*Nederlandse Staatscourant* 1944, No. 18).
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel30
  - number: '32'
    text: 'De navolgende voorschriften worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel32
  - number: 32.a
    text: de Beschikking Delegatie aan Prijzenbureaux 1946 (*Nederlandse Staatscourant* 1946, No. 114);
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel32
  - number: 32.b
    text: de Huurprijsuitvoeringsbeschikking 1948 (*Nederlandse Staatscourant* 1947, No. 242);
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel32
  - number: 32.c
    text: de Huurprijsuitvoeringsbeschikking 1949 (*Nederlandse Staatscourant* 1949, No. 174).
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel32
  - number: '33.1'
    text: Deze wet kan worden aangehaald als "Huurwet".
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel33
  - number: '33.2'
    text: Wij bepalen op welk tijdstip deze wet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0002066/2002-01-01#Artikel33
