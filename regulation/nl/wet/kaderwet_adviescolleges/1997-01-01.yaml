preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, mede in verband met artikel 79 van de Grondwet,
    algemene regels te stellen over de advisering in zaken van algemeen verbindende voorschriften of te voeren beleid
    van het Rijk;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. adviescollege: een college dat krachtens publiekrecht tot taak heeft de regering te adviseren over algemeen
      verbindende voorschriften of te voeren beleid van het Rijk;

      b. Onze Minister: Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel1
  - number: '2'
    text: |-
      Geen adviescollege in de zin van deze wet is:

      a. een college als bedoeld in [artikel 1:1, tweede lid, van de Algemene wet bestuursrecht][ref1];

      b. een college dat voor meer dan de helft bestaat uit ambtenaren die werkzaam zijn bij een ministerie of een
      daaronder ressorterende instelling, dienst of bedrijf, en die in verband met hun werkzaamheden in dat college
      zitting hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel11
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 1:1
  - number: '3'
    text: |-
      De [hoofdstukken 3][ref1] en [5][ref2] en [artikel 28][ref3] gelden niet ten aanzien van adviescolleges waarvan de
      adviestaak, bedoeld in [artikel 1, onderdeel a ][ref4], niet de hoofdtaak is.


