  - number: '4'
    text: Een adviescollege wordt bij wet ingesteld.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel4
  - number: '5'
    text: |-
      1 In afwijking van [artikel 4][ref1] kan een adviescollege voor de advisering over een in de tijd beperkt vraagstuk
      bij koninklijk besluit worden ingesteld voor de duur van ten hoogste vier jaar. Deze termijn kan bij koninklijk
      besluit eenmaal met ten hoogste twee jaar worden verlengd.

      2 Een besluit op grond van het eerste lid wordt niet eerder genomen dan vier weken nadat het voornemen daartoe in
      overeenstemming met het gevoelen van de ministerraad, aan de beide kamers der Staten-Generaal is meegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel4
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '4'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      1 In afwijking van [artikel 4][ref1] kan een adviescollege voor de eenmalige advisering over een bepaald vraagstuk
      bij koninklijk besluit of bij ministeriële regeling, in overeenstemming met het gevoelen van de ministerraad,
      worden ingesteld voor de duur van de advisering.

      2 Een besluit op grond van het eerste lid wordt onverwijld aan de beide kamers der Staten-Generaal meegedeeld.

      3 In afwijking van de [artikelen 11][ref2] en [13][ref3] kunnen de leden van een college als bedoeld in het eerste
      lid worden benoemd en ontslagen door Onze Minister.

      4 Op een college als bedoeld in het eerste lid zijn de [artikelen 17][ref4] en [18][ref5], [hoofdstuk 5][ref6] en
      de artikelen 28 en 33 niet van toepassing. Op het advies van zo'n college is [artikel 24][ref7] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008159#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0008159#Artikel13
