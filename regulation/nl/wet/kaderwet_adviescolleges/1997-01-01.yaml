  - number: '7'
    text: |-
      Alle wetten, koninklijke besluiten en ministeriële regelingen tot instelling van adviescolleges worden mede door
      Onze Minister van Binnenlandse Zaken ondertekend.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel7
  - number: '8'
    text: Bij de instelling van een adviescollege wordt de adviestaak omschreven.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel8
  - number: '9'
    text: |-
      De [artikelen 4 tot en met 8][ref1] zijn van overeenkomstige toepassing op het toekennen van een adviestaak als
      bedoeld in [artikel 1, onderdeel a ][ref2], aan een college dat krachtens publiekrecht een andere taak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008159#Artikel1
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008159
        artikel: '1'
        hoofdstuk: '1'
  - number: '10'
    text: |-
      Een adviescollege bestaat uit een voorzitter en ten hoogste veertien andere leden. Het adviescollege kan uit de
      leden ondervoorzitters aanwijzen.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel10
  - number: '11'
    text: |-
      1 De leden van een adviescollege worden bij koninklijk besluit benoemd.

      2 De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier
      jaar plaatsvinden.

      3 Onze Minister draagt zorg voor openbaarmaking van een vacature in een adviescollege, niet zijnde een college als
      bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel6
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '6'
        hoofdstuk: '2'
  - number: '12'
    text: |-
      1 De leden van een adviescollege worden benoemd op grond van de deskundigheid die nodig is voor de advisering
      op het beleidsterrein waarvoor het adviescollege is ingesteld alsmede op grond van maatschappelijke kennis en
      ervaring.

      2 Ambtenaren die werkzaam zijn bij een ministerie of een daaronder ressorterende instelling, dienst of bedrijf,
      worden niet benoemd tot lid van een adviescollege dat tot taak heeft te adviseren over onderwerpen waarbij zij in
      verband met hun werkzaamheden betrokken zijn.

      3 Bij de benoeming van de voorzitters en bij de benoeming van de andere leden van adviescolleges wordt gestreefd
      naar evenredige deelneming aan adviescolleges van vrouwen en personen behorende tot etnische of culturele
      minderheidsgroepen.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel12
  - number: '13'
    text: |-
      Leden van adviescolleges worden op eigen aanvraag door Onze Minister ontslagen. Zij kunnen voorts bij koninklijk
      besluit worden geschorst en ontslagen wegens ongeschiktheid, onbekwaamheid of op andere zwaarwegende gronden.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel13
  - number: '14'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de vergoeding van reis- en verblijfkosten en verdere
      vergoedingen aan leden van adviescolleges vastgesteld en kunnen nadere regels over hun rechtspositie worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel14
  - number: '15'
    text: |-
      1 Een adviescollege heeft een secretaris.

      2 De secretaris is voor zijn werkzaamheden voor het adviescollege uitsluitend verantwoording schuldig aan het
      adviescollege.

      3 Aan de secretaris kunnen andere medewerkers worden toegevoegd.

      4 De secretaris en de andere medewerkers zijn geen lid van het adviescollege.

      5 Onze Minister benoemt, bevordert, schorst en ontslaat, na overleg met de voorzitter van het adviescollege, de
      secretaris en de andere medewerkers.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel15
  - number: '16'
    text: Een adviescollege kan ter voorbereiding van een of meer adviezen uit zijn midden commissies instellen.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel16
  - number: '17'
    text: |-
      Een adviescollege adviseert op schriftelijk verzoek van Onze Minister of van een van beide kamers der Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel17
  - number: '18'
    text: |-
      Een adviescollege kan Onze Minister uit eigen beweging adviseren. Van een voornemen daartoe stelt het adviescollege
      Onze Minister en de beide kamers der Staten-Generaal onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel18
  - number: '19'
    text: |-
      1 Een adviescollege kan zich voor het inwinnen van inlichtingen wenden tot daartoe door Onze Minister aangewezen
      ambtenaren.

      2 Een adviescollege kan zich doen bijstaan door andere personen, voor zover dat voor de vervulling van zijn taak
      nodig is.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel19
  - number: '20'
    text: |-
      1 Een adviescollege beraadslaagt en besluit in vergadering over de uit te brengen adviezen.

      2 Over de uit te brengen adviezen wordt niet besloten dan in aanwezigheid van ten minste de helft van de leden.

      3 De adviezen worden uitgebracht overeenkomstig het gevoelen van de meerderheid van de ter vergadering aanwezige
      leden, waarbij elk lid één stem heeft.

      4 Indien het nodig is over het besluit tot vaststelling van het advies bij wijze van stemming te beslissen, wordt
      dat besluit bij meerderheid van stemmen opgemaakt.

      5 Indien de stemmen staken, wordt de besluitvorming aangehouden tot de volgende vergadering, tenzij de advisering
      niet uitgesteld kan worden of de vergadering voltallig is. In deze gevallen beslist de stem van de voorzitter. Van
      die omstandigheid wordt in het advies melding gemaakt.

      6 Een lid dat ter vergadering een standpunt heeft ingebracht dat afwijkt van het gevoelen van de meerderheid, kan
      over dat standpunt een afzonderlijke nota bij het advies voegen.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel20
  - number: '21'
    text: Een adviescollege kan zijn werkwijze nader vaststellen in een reglement van orde.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel21
  - number: '22'
    text: |-
      Indien een advies wordt uitgebracht aan één van de kamers der Staten-Generaal, zendt het adviescollege een
      afschrift van het advies aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel22
  - number: '23'
    text: |-
      1 Adviescolleges kunnen gezamenlijk advies uitbrengen en zijn daartoe verplicht, indien dat bij het adviesverzoek
      is verzocht.

      2 De betrokken colleges regelen in onderling overleg hun werkwijze bij gezamenlijke advisering.

      3 De betrokken colleges zijn gezamenlijk bevoegd voor het voorbereiden van een gezamenlijk advies een gemengde
      commissie uit hun midden in te stellen.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel23
  - number: '24'
    text: |-
      1 Onze Minister stelt de beide kamers der Staten-Generaal binnen drie maanden na ontvangst in kennis van zijn
      standpunt over:

      a. een door hem gevraagd en tijdig uitgebracht advies over een vast te stellen ministeriële regeling of over te
      voeren beleid;

      b. een uit eigen beweging uitgebracht advies over hoofdlijnen van beleid.

      2 Indien de vaststelling van het standpunt niet binnen de termijn, bedoeld in het eerste lid, plaatsvindt, stelt
      Onze Minister de beide kamers der Staten-Generaal hiervan gemotiveerd in kennis.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel24
  - number: '25'
    text: |-
      Een adviescollege zendt jaarlijks voor 1 april aan Onze Minister een ontwerp voor de begroting voor het
      daaropvolgende kalenderjaar van de aan de taakvervulling door het adviescollege verbonden uitgaven.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel25
  - number: '26'
    text: |-
      1 Een adviescollege zendt Onze Minister jaarlijks voor 1 september een ontwerp voor een werkprogramma voor het
      volgende kalenderjaar. Onze Minister verstrekt het adviescollege daartoe tijdig een overzicht van de voornemens om
      advies te vragen.

      2 In het werkprogramma wordt rekening gehouden met onvoorziene adviesverzoeken en met de bevoegdheid tot advisering
      uit eigen beweging.

      3 Onze Minister stelt het werkprogramma vast en zendt dit jaarlijks op de derde dinsdag van september aan de beide
      kamers der Staten-Generaal.

      4 Onze Minister kan het werkprogramma wijzigen.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel26
  - number: '27'
    text: |-
      Een adviescollege houdt bij het vervullen van zijn taak zoveel mogelijk rekening met het werkprogramma.
      Onverminderd de [Comptabiliteitswet][ref1] vervult het zijn taak met de middelen die ingevolge de desbetreffende
      begrotingswet ter beschikking zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003075
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003075
  - number: '28'
    text: |-
      1 Een adviescollege brengt jaarlijks voor 1 april verslag uit van zijn werkzaamheden in het voorafgaande
      kalenderjaar.

      2 Op verzoek van Onze Minister, maar ten minste elk vierde jaar, stelt het adviescollege een evaluatieverslag op
      waarin het aandacht besteedt aan zijn taakvervulling.

      3 Het jaarverslag en het evaluatieverslag worden gezonden aan Onze Minister. Het evaluatieverslag wordt tevens
      gezonden aan Onze Minister van Binnenlandse Zaken en aan de beide kamers der Staten-Generaal.

      4 Onze Minister stelt de beide kamers der Staten-Generaal in kennis van zijn standpunt over het evaluatieverslag.
      [Artikel 24][ref1] is daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel24
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '24'
        hoofdstuk: '4'
  - number: '29'
    text: |-
      Een adviescollege verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde
      inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel29
  - number: '30'
    text: |-
      Onze Minister van Binnenlandse Zaken zendt elke vier jaar aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel30
  - number: '33'
    text: |-
      Na de instelling van een adviescollege stelt Onze Minister voor dat college een werkprogramma vast voor het
      resterende deel van het kalenderjaar waarin het is ingesteld en, indien de instelling heeft plaatsgevonden na
      31 augustus, tevens voor het daaropvolgende kalenderjaar. [Artikel 26][ref1] is daarbij zoveel mogelijk van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel26
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '26'
        hoofdstuk: '5'
  - number: '34'
    text: |-
      1 [Artikel 4][ref1] geldt tot en met 31 december 1997 niet ten aanzien van een adviescollege dat in 1996 voor
      bepaalde tijd is ingesteld.

      2 Voor de toepassing van deze wet wordt een college als bedoeld in het eerste lid aangemerkt als een college als
      bedoeld in [artikel 6, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008159#Artikel6
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008159
        artikel: '6'
        hoofdstuk: '2'
  - number: '35'
    text: Deze wet treedt in werking met ingang van 1 januari 1997.
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel35
  - number: '36'
    text: 'Deze wet wordt aangehaald als: Kaderwet adviescolleges.'
    url: https://wetten.overheid.nl/BWBR0008159/1997-01-01#Artikel36
