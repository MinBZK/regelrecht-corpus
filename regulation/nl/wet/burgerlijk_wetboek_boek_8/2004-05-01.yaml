  - number: '228'
    text: |-
      De verkoper van brandstof voor de machines, van ketelwater, levensmiddelen of scheepsbenodigdheden kan het hem in
      [afdeling 8 van Titel 1 van Boek 7][ref1] toegekende recht slechts gedurende 48 uur na het einde van de levering
      uitoefenen, doch zulks ook indien deze zaken zich bevinden in handen van de reder, een rompbevrachter of een
      tijdbevrachter van het schip.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling8
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel228
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '8'
  - number: '230.1'
    text: |-
      De afdelingen 2 tot en met 4 van titel 3 zijn niet van toepassing op zeeschepen, welke toebehoren aan het Rijk of
      enig openbaar lichaam en uitsluitend bestemd zijn voor de uitoefening van
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel230
  - number: 230.1.a
    text: de openbare macht of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel230
  - number: 230.1.b
    text: niet-commerciële overheidsdienst.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel230
  - number: '230.2'
    text: |-
      De beschikking waarbij de in het eerste lid bedoelde bestemming is vastgesteld, kan worden ingeschreven in
      de openbare registers, bedoeld in afdeling 2 van Titel 1 van Boek 3. Artikel 24 lid 1 van Boek 3 is niet van
      toepassing;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel230
  - number: '230.3'
    text: |-
      De inschrijving machtigt de bewaarder tot doorhaling van de teboekstelling van het schip in het in artikel 193
      bedoelde register.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel230
  - number: '231'
    text: |-
      Behoeven de in de [afdelingen 2 tot en met 5 van titel 3][ref1] geregelde onderwerpen in het belang van een
      goede uitvoering van de wet nadere regeling, dan geschiedt dit bij of krachtens algemene maatregel van bestuur,
      onverminderd de bevoegdheid tot regeling krachtens de [Kadasterwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0004541
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
  - number: '260.1'
    text: |-
      De kapitein is bevoegd die rechtshandelingen te verrichten, welke rechtstreeks strekken om het schip in bedrijf te
      brengen of te houden. Onder rechtshandeling is hier het in ontvangst nemen van een verklaring begrepen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel260
  - number: '260.2'
    text: |-
      De kapitein is bevoegd cognossementen af te geven voor zaken, die ten vervoer zijn ontvangen en aangenomen en
      passagebiljetten af te geven voor met het schip te vervoeren reizigers. Tevens is hij bevoegd namens de reder en de
      rechthebbenden op de zaken aan boord van het schip een overeenkomst omtrent hulpverlening te sluiten alsmede om het
      hulploon of de bijzondere vergoeding te innen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel260
  - number: '261.1'
    text: |-
      De kapitein is verplicht voor de belangen van de bevrachters en van de rechthebbenden op de aan boord zijnde zaken,
      zo mogelijk ook na lossing daarvan, te waken en de maatregelen, die daartoe nodig zijn, te nemen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel261
  - number: '261.2'
    text: |-
      Indien het noodzakelijk is onverwijld ter behartiging van deze belangen rechtshandelingen te verrichten, is de
      kapitein daartoe bevoegd. Onder rechtshandeling is hier het in ontvangst nemen van een verklaring begrepen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel261
  - number: '261.3'
    text: |-
      Voor zover mogelijk geeft hij van bijzondere voorvallen terstond kennis aan de belanghebbenden bij de betrokken
      goederen en handelt hij in overleg met hen en volgens hun orders.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel261
  - number: '262.1'
    text: |-
      Beperkingen van de wettelijke bevoegdheid van de kapitein gelden tegen derden slechts wanneer die hun bekend zijn
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel262
  - number: '262.2'
    text: De kapitein verbindt zichzelf slechts dan, wanneer hij de grenzen zijner bevoegdheid overschrijdt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel262
  - number: '360.1'
    text: |-
      De reder is naast een rompbevrachter met deze hoofdelijk aansprakelijk uit een deze laatste bindende
      rechtshandeling, die rechtstreeks strekt tot het in bedrijf brengen of houden van het schip. Onder rechtshandeling
      is hier het in ontvangst nemen van een verklaring begrepen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel360
  - number: '360.2'
    text: |-
      Het eerste lid is niet van toepassing indien aan degeen, met wie de daar genoemde rechtshandeling wordt verricht,
      kenbaar is gemaakt, dat de rompbevrachter de reder niet vermag te binden dan wel deze derde wist, of zonder eigen
      onderzoek moest weten, dat het in het eerste lid bedoelde doel werd overschreden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel360
  - number: '360.3'
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van vervoerovereenkomsten, overeenkomsten tot het verrichten
      van arbeid met de bemanning aangegaan en overeenkomsten als genoemd in [afdeling 4 van titel 5][ref1] of
      [afdeling 4 van titel 10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel360
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        hoofdstuk: III
        afdeling: '4'
  - number: '360.4'
    text: |-
      Het eerste lid is niet van toepassing, wanneer aan de reder de feitelijke macht over het schip door een
      ongeoorloofde handeling was ontnomen en bovendien de schuldeiser niet te goeder trouw was.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel360
  - number: '360.5'
    text: |-
      Hij, die loodsgelden, kanaal- of havengelden dan wel andere scheepvaartrechten voldoet ten behoeve van de
      reder, een rompbevrachter, een tijdbevrachter of de kapitein dan wel enige andere schuldenaar daarvan, wordt van
      rechtswege gesubrogeerd in de rechten van de schuldeiser van deze vorderingen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel360
  - number: '361.1'
    text: |-
      Onder "exploitatie-overeenkomsten" worden verstaan: de bevrachtingen van het schip en de overeenkomsten tot vervoer
      van zaken of personen met het schip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel361
  - number: '361.2'
    text: 'Onder "keten der exploitatie-overeenkomsten" worden verstaan: de exploitatie-overeenkomsten gerangschikt:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel361
  - number: 361.2.a
    text: |-
      wat betreft bevrachtingen: te beginnen met een mogelijkerwijs aangegane rompbevrachting en vervolgens in de
      volgorde, waarin de bevrachters hun bevoegdheid over het schip te beschikken van elkaar afleiden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel361
  - number: 361.2.b
    text: |-
      wat betreft vervoerovereenkomsten, die geen bevrachting zijn: te beginnen met de vervoerovereenkomst aangegaan
      door een vervoerder, die de beschikking heeft over het schip of een gedeelte daarvan, en te eindigen met de
      vervoerovereenkomst aangegaan tussen een vervoerder met het schip en zijn wederpartij, die niet wederom op haar
      beurt vervoerder met het schip is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel361
  - number: '361.3'
    text: |-
      Voor de toepassing van de [artikelen 361 tot en met 366][ref1] wordt een reiziger aangemerkt als partij bij de te
      zijnen aanzien gesloten vervoerovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel361
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel361
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '361'
        hoofdstuk: II
        afdeling: '1'
  - number: '361.4'
    text: |-
      In de [artikelen 361 tot en met 366][ref1] worden onder beschadiging mede begrepen niet-aflevering, geheel of
      gedeeltelijk verlies, waardevermindering en vertraagde aflevering en wordt onder letsel mede begrepen vertraagde
      ontscheping.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel361
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel361
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '361'
        hoofdstuk: II
        afdeling: '1'
  - number: '362'
    text: |-
      Indien een partij bij een exploitatie-overeenkomst door haar wederpartij daarbij terzake van een bij de exploitatie
      van het schip ontstane schade buiten overeenkomst wordt aangesproken, dan is zij jegens die wederpartij niet verder
      aansprakelijk dan zij dit zou zijn op grond van de door hen gesloten overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel362
  - number: '363'
    text: |-
      Indien een partij bij een exploitatie-overeenkomst terzake van een bij de exploitatie van het schip ontstane schade
      buiten overeenkomst wordt aangesproken door een andere partij bij een dusdanige overeenkomst, dan is zij tegenover
      deze niet verder aansprakelijk dan zij dit zou zijn als ware zij wederpartij bij de exploitatie-overeenkomst, die
      is aangegaan door degeen die haar aanspreekt en die in de keten der exploitatie-overeenkomsten tussen haar en deze
      laatste ligt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel363
  - number: '364.1'
    text: |-
      Wordt een reder of een bevrachter van een schip, dan wel een vervoerder met een schip terzake van dood of letsel
      van een persoon of terzake van beschadiging van een zaak, buiten overeenkomst aangesproken door iemand die geen
      partij is bij een exploitatie-overeenkomst, dan is hij tegenover deze niet verder aansprakelijk dan hij uit
      overeenkomst zou zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel364
  - number: '364.2'
    text: |-
      Was met betrekking tot de persoon of zaak een vervoerovereenkomst afgesloten en is de schade ontstaan in het
      tijdvak waarin een vervoerder met het schip als zodanig daarvoor aansprakelijk is, dan geldt als overeenkomst,
      bedoeld in lid 1, de laatste in de keten der exploitatie-overeenkomsten met betrekking tot die persoon of zaak
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel364
  - number: '364.3'
    text: |-
      Was de persoon of zaak aan boord van het schip op grond van een overeenkomst met een partij bij een exploitatie-
      overeenkomst, doch is het vorige lid niet van toepassing, dan geldt de eerst bedoelde overeenkomst als overeenkomst
      bedoeld in lid 1.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel364
  - number: '364.4'
    text: |-
      Was de persoon of zaak buiten overeenkomst aan boord, dan geldt een vervoerovereenkomst als overeenkomst bedoeld in
      lid 1.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel364
  - number: '364.5'
    text: |-
      De aansprakelijkheid bedoeld in lid 1, is voor de toepassing van de leden 2 en 4 die van een vervoerder, en voor de
      toepassing van lid 3 die van de aldaar genoemde partij.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel364
  - number: '365'
    text: |-
      Wordt een vordering als genoemd in de [artikelen 362 tot en met 364][ref1] buiten overeenkomst ingesteld tegen
      een ondergeschikte van een partij bij een exploitatieovereenkomst en kan die partij ter afwering van haar
      aansprakelijkheid voor de gedraging van de ondergeschikte een verweermiddel jegens de eiser ontlenen aan de
      overeenkomst waardoor haar aansprakelijkheid in gevolge die artikelen wordt beheerst, dan kan ook de ondergeschikte
      dit verweermiddel inroepen, als ware hijzelf bij de overeenkomst partij.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel362
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel365
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '362'
        hoofdstuk: II
        afdeling: '1'
  - number: '366'
    text: |-
      Het totaal van de bedragen verhaalbaar op een derde, die partij is bij een exploitatie-overeenkomst, en zijn
      ondergeschikten, al dan niet gezamenlijk met het bedrag verhaalbaar op de wederpartij van degeen, die de in de
      [artikelen 363][ref1] of [364][ref2] genoemde vordering instelde en haar ondergeschikten, mag, behoudens in geval
      van schade ontstaan uit eigen handeling of nalaten van de aangesprokene, geschied hetzij met het opzet die schade
      te veroorzaken, hetzij roekeloos en met de wetenschap dat die schade er waarschijnlijk uit zou voortvloeien, niet
      overtreffen het totaal, dat op grond van de door hen ingeroepen overeenkomst is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel363
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel364
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel366
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '363'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '364'
        hoofdstuk: II
        afdeling: '1'
  - number: '370.1'
    text: |-
      De overeenkomst van goederenvervoer in de zin van deze titel is de overeenkomst van goederenvervoer, al dan
      niet tijd- of reisbevrachting zijnde, waarbij de ene partij (de vervoerder) zich tegenover de andere partij (de
      afzender) verbindt aan boord van een schip zaken uitsluitend over zee te vervoeren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel370
  - number: '370.2'
    text: |-
      Vervoer over zee en binnenwateren aan boord van een en eenzelfde schip, dat deze beide wateren bevaart, wordt als
      vervoer over zee beschouwd, tenzij het varen van dit schip over zee kennelijk ondergeschikt is aan het varen over
      binnenwateren, in welk geval dit varen als varen over binnenwateren wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel370
  - number: '370.3'
    text: |-
      Vervoer over zee en binnenwateren aan boord van een en eenzelfde schip, dat zonder eigen beweegkracht deze beide
      wateren bevaart, wordt beschouwd als vervoer over zee voor zover, met inachtneming tevens van het tweede lid van
      dit artikel, het varen van het beweegkracht overbrengende schip als varen over zee wordt beschouwd. Voor zover dit
      niet het geval is, wordt het als vervoer over binnenwateren beschouwd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel370
  - number: '370.4'
    text: |-
      Deze afdeling is niet van toepassing op overeenkomsten tot het vervoer van postzendingen door of in opdracht
      van de houder van de concessie bedoeld in de [Postwet][ref1] of onder een internationale postovereenkomst. Onder
      voorbehoud van artikel 510 is deze afdeling niet van toepassing op overeenkomsten tot het vervoeren van bagage.


      [ref1]: https://wetten.overheid.nl/BWBR0004423
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel370
    references:
      - id: ref1
        bwb_id: BWBR0004423
  - number: '371.1'
    text: |-
      Onder gewijzigd Verdrag wordt in dit artikel verstaan het Verdrag van 25 augustus 1924 ter vaststelling van enige
      eenvormige regelen betreffende het cognossement (*Trb.* 1953, 109) met inbegrip van de bepaling voorkomend in
      onderdeel 1 van het daarbij behorende Protocol van ondertekening, zoals dat Verdrag is gewijzigd bij het te Brussel
      op 23 februari 1968 ondertekende Protocol (*Trb.* 1979, 26) en als verder gewijzigd bij het te Brussel op 21
      december 1979 ondertekende Protocol (*Trb.* 1985, 122).
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel371
  - number: '371.2'
    text: |-
      Voor de toepassing van dit artikel wordt onder verdragsstaat verstaan een staat, welke partij is bij het gewijzigd
      Verdrag.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel371
  - number: '371.3'
    text: |-
      De artikelen 1 tot en met 9 van het gewijzigd Verdrag worden toegepast op elk cognossement, dat betrekking heeft op
      vervoer van zaken tussen havens in twee verschillende staten, indien:
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel371
  - number: 371.3.a
    text: het cognossement is uitgegeven in een verdragsstaat, of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel371
  - number: 371.3.b
    text: het vervoer plaats vindt vanuit een haven in een verdragsstaat, of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel371
  - number: 371.3.c
    text: |-
      de overeenkomst, die in het cognossement is vervat of daaruit blijkt, bepaalt, dat op die overeenkomst toepasselijk
      zijn de bepalingen van het gewijzigd Verdrag of van enigerlei wetgeving, welke die verdragsbepalingen van kracht
      verklaart of in andere vorm of bewoordingen heeft overgenomen, ongeacht de nationaliteit van het schip, de
      vervoerder, de afzender, de geadresseerde of van iedere andere betrokken persoon.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel371
  - number: '372'
    text: |-
      Deze afdeling laat de [titels 7][ref1] en [12][ref2] van dit boek onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel372
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005034
        hoofdstuk: III
  - number: '373.1'
    text: |-
      Tijd- of reisbevrachting in de zin van deze afdeling is de overeenkomst van goederenvervoer, waarbij de vervoerder
      zich verbindt tot vervoer aan boord van een schip, dat hij daartoe, anders dan bij wijze van rompbevrachting,
      geheel of gedeeltelijk en al dan niet op tijdbasis (tijdbevrachting of reisbevrachting) ter beschikking stelt van
      de afzender.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel373
  - number: '373.2'
    text: |-
      Onder "vervrachter" is in deze afdeling de in het eerste lid genoemde vervoerder, onder "bevrachter" de aldaar
      genoemde afzender te verstaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel373
  - number: '374'
    text: |-
      De wetsbepalingen omtrent huur, bewaarneming en bruikleen zijn op terbeschikkingstelling van een schip, anders dan
      bij wijze van rompbevrachting, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel374
  - number: '375.1'
    text: |-
      Bij eigendomsovergang van een tevoren vervracht, al dan niet teboekstaand, schip op een derde volgt deze in alle
      rechten en verplichtingen van de vervrachter op, die nochtans naast de nieuwe eigenaar aan de overeenkomst gebonden
      blijft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel375
  - number: '375.2'
    text: Rechten en verplichtingen, welke vóór de eigendomsovergang opeisbaar zijn geworden, gaan op de derde niet over.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel375
  - number: '377'
    text: |-
      In deze titel wordt onder vervoerovereenkomst onder cognossement verstaan de vervoerovereenkomst neergelegd in een
      cognossement dan wel enig soortgelijk document dat een titel vormt voor het vervoer van zaken over zee; eveneens
      wordt er onder verstaan de vervoerovereenkomst neergelegd in een cognossement of soortgelijk document als genoemd,
      dat is uitgegeven uit hoofde van een charterpartij, van het ogenblik af waarop dit cognossement of soortgelijk
      document de verhouding tussen de vervoerder en de houder van het cognossement beheerst.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel377
  - number: '378'
    text: |-
      De vervoerder is verplicht ten vervoer ontvangen zaken ter bestemming af te leveren en wel in de staat, waarin hij
      hen heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel378
  - number: '379'
    text: |-
      Onverminderd [artikel 378][ref1] is de vervoerder verplicht ten vervoer ontvangen zaken zonder vertraging te
      vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel378
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel379
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '378'
        hoofdstuk: II
        afdeling: '2'
  - number: '380.1'
    text: |-
      In geval van tijdbevrachting is de vervrachter verplicht de kapitein opdracht te geven binnen de grenzen door de
      overeenkomst gesteld de orders van de bevrachter op te volgen. De vervrachter staat er voor in, dat de kapitein de
      hem gegeven opdracht nakomt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel380
  - number: '380.2'
    text: |-
      De bevrachter staat er voor in, dat het schip de plekken of plaatsen, waarheen hij het ter inlading, lossing
      of anderszins op grond van het eerste lid beveelt te gaan, veilig kan bereiken, innemen en verlaten. Indien
      deze plekken of plaatsen blijken niet aan deze vereisten te voldoen, is de bevrachter slechts in zoverre niet
      aansprakelijk als de kapitein, door de hem gegeven orders op te volgen, onredelijk handelde.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel380
  - number: '380.3'
    text: |-
      Onverminderd [artikel 461][ref1] wordt de bevrachter mede verbonden door en kan hij rechten ontlenen aan een
      rechtshandeling, die de kapitein ingevolge het eerste lid van dit artikel verricht. Onder rechtshandeling is hier
      het in ontvangst nemen van een verklaring begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel461
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel380
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '461'
        hoofdstuk: II
        afdeling: '2'
  - number: '381.1'
    text: |-
      Onder een vervoerovereenkomst onder cognossement is de vervoerder verplicht vóór en bij de aanvang van de reis
      redelijke zorg aan te wenden voor:
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel381
  - number: 381.1.a
    text: het zeewaardig maken van het schip;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel381
  - number: 381.1.b
    text: het behoorlijk bemannen, uitrusten en bevoorraden van het schip;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel381
  - number: 381.1.c
    text: |-
      het geschikt maken en in goede staat brengen van de ruimen, koel- en vrieskamers en alle andere delen van het
      schip, waarin zaken worden geladen, om deze daarin te bergen, te vervoeren en goed te houden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel381
  - number: '381.2'
    text: |-
      Onder een vervoerovereenkomst onder cognossement is de vervoerder, behoudens de [artikelen 383][ref1], [388][ref2],
      [414 vierde lid][ref3] en [423][ref4], verplicht de zaken behoorlijk en zorgvuldig te laden, te behandelen, te
      stuwen, te vervoeren, te bewaren, te verzorgen en te lossen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel383
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel388
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel414
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel423
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel381
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '383'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '388'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '414'
        hoofdstuk: II
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '423'
        hoofdstuk: II
        afdeling: '2'
  - number: '382.1'
    text: |-
      Nietig is ieder beding in een vervoerovereenkomst onder cognossement, waardoor de vervoerder of het schip wordt
      ontheven van aansprakelijkheid voor verlies of beschadiging van of met betrekking tot zaken voortvloeiende
      uit nalatigheid, schuld of tekortkoming in het voldoen aan de verplichtingen in de [artikelen 381][ref1],
      [399][ref2], [411][ref3], [414 eerste lid][ref4], [492][ref5], [493][ref6] of in [artikel 1712][ref7] voorzien
      of waardoor deze aansprakelijkheid mocht worden verminderd op andere wijze dan in deze afdeling of in de
      [artikelen 361 tot en met 366][ref8] is voorzien. Een beding, krachtens hetwelk de uitkering op grond van een
      gesloten verzekering aan de vervoerder komt of elk ander beding van dergelijke strekking, wordt aangemerkt als te
      zijn gemaakt teneinde de vervoerder van zijn aansprakelijkheid te ontheffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel381
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel399
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel411
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel414
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Artikel492
      [ref6]: https://wetten.overheid.nl/BWBR0005034#Artikel493
      [ref7]: https://wetten.overheid.nl/BWBR0005034#Artikel1712
      [ref8]: https://wetten.overheid.nl/BWBR0005034#Artikel361
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel382
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '381'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '399'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
