      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1099'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1100.2'
    text: |-
      Het hierboven genoemde vermoeden bestaat niet in het in [artikel 1099][ref1] onder *a* genoemde geval, indien zich
      een ongewoon groot tekort voordoet dan wel een ongewoon groot verlies van colli.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1099
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1100
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1099'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1100.3'
    text: |-
      Indien in overeenstemming met het door partijen overeengekomene het vervoer plaatsvindt door middel van een
      voertuig, speciaal ingericht om de zaken te onttrekken aan de invloed van hitte, koude, temperatuurverschillen of
      vochtigheid van de lucht, kan de vervoerder ter ontheffing van zijn aansprakelijkheid ten gevolge van deze invloed
      slechts een beroep doen op [artikel 1099][ref1] onder *c*, indien hij bewijst, dat alle maatregelen waartoe hij,
      rekening houdende met de omstandigheden, verplicht was, zijn genomen met betrekking tot de keuze, het onderhoud
      en het gebruik van deze inrichtingen en dat hij zich heeft gericht naar de bijzondere instructies bedoeld in het
      vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1099
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1100
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1099'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1100.4'
    text: |-
      De vervoerder kan slechts beroep doen op [artikel 1099][ref1] onder *f*, indien hij bewijst dat alle maatregelen,
      waartoe hij normaliter, rekening houdende met de omstandigheden, verplicht was, zijn genomen en dat hij zich heeft
      gericht naar de bijzondere instructies bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1099
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1100
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1099'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1100.5'
    text: |-
      De bijzondere instructies, bedoeld in het derde en het vierde lid van dit artikel, moeten aan de vervoerder vóór
      de aanvang van het vervoer zijn gegeven, hij moet deze uitdrukkelijk hebben aanvaard en zij moeten, indien voor dit
      vervoer een vrachtbrief is afgegeven, daarop zijn vermeld. De enkele vermelding op de vrachtbrief levert te dezer
      zake geen bewijs op.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1100
  - number: '1101'
    text: |-
      Wanneer de vervoerder de op hem uit hoofde van de [artikelen 1095][ref1] en [1096][ref2] rustende verplichtingen
      niet nakwam, wordt ten aanzien van


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1095
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1096
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1101
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1095'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1096'
        hoofdstuk: IV
        afdeling: '2'
  - number: 1101.a
    text: |-
      zaken, die onverpakt zijn, terwijl zij gelet op hun aard of de wijze van vervoer, verpakt hadden behoren te zijn,
      dan wel zaken die, gelet op hun aard of de wijze van vervoer, niet voldoende of niet doelmatig zijn verpakt;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1101
  - number: 1101.b
    text: |-
      onverpakte zaken, die niet vallen onder de omschrijving onder *a* gegeven, indien de vervoerder bewijst, dat
      gelet op de omstandigheden van het geval het niet nakomen een gevolg heeft kunnen zijn van het bijzondere risico
      verbonden aan het onverpakt zijn,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1101
  - number: '1102.1'
    text: |-
      Nietig is ieder beding, waarbij de ingevolge [artikel 1095][ref1] op de vervoerder drukkende aansprakelijkheid
      of bewijslast op andere wijze wordt vermeerderd of verminderd dan in deze afdeling is voorzien, tenzij dit beding
      uitdrukkelijk en anders dan door een verwijzing naar in een ander geschrift voorkomende bedingen, is aangegaan bij
      een in het bijzonder ten aanzien van het voorgenomen vervoer aangegane en in een afzonderlijk geschrift neergelegde
      overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1095
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1102
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1095'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1102.2'
    text: |-
      Bovendien is nietig ieder beding, waarbij de ingevolge [artikel 1095][ref1] op de vervoerder drukkende
      aansprakelijkheid of bewijslast op andere wijze wordt vermeerderd of verminderd dan in deze afdeling is voorzien,
      wanneer dit beding


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1095
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1102
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1095'
        hoofdstuk: IV
        afdeling: '2'
  - number: 1102.2.a
    text: voorkomt in enig document, dat door een vermelding daarop is aangeduid als transportbrief of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1102
  - number: 1102.2.b
    text: tussen de vervoerder en de ontvanger is aangegaan bij de aflevering van de zaak.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1102
  - number: '1103.1'
    text: |-
      Voor zover de vervoerder aansprakelijk is wegens niet nakomen van de op hem uit hoofde van de
      [artikelen 1095][ref1] en [1096][ref2] rustende verplichtingen, heeft de afzender geen ander recht dan betaling
      te vorderen van een bedrag, dat wordt berekend met inachtneming van de waarde welke zaken als de ten vervoer
      ontvangene zouden hebben gehad zoals, ten tijde waarop en ter plaatse waar zij zijn afgeleverd of zij hadden moeten
      zijn afgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1095
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1096
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1103
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1095'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1096'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1103.2'
    text: |-
      De in het eerste lid genoemde waarde wordt berekend naar de koers op de goederenbeurs of, wanneer er geen
      dergelijke koers is, naar de gangbare martkwaarde of, wanneer ook deze ontbreekt, naar de normale waarde van zaken
      van dezelfde aard en hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1103
  - number: '1104'
    text: |-
      Indien met betrekking tot een zaak een schadevergoeding uit hoofde van [artikel 1129][ref1] is verschuldigd, wordt
      deze aangemerkt als een waardevermindering van die zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1129
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1104
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1129'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1105'
    text: |-
      Voor zover de vervoerder aansprakelijk is wegens niet nakomen van de op hem uit hoofde van de
      [artikelen 1095][ref1] en [1096][ref2] rustende verplichtingen, is hij niet aansprakelijk boven bij of krachtens
      algemene maatregel van bestuur te bepalen bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1095
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1096
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1105
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1095'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1096'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1106.1'
    text: |-
      De afzender kan, mits de vervoerder hierin toestemt en tegen betaling van een overeen te komen bedrag, op de
      vrachtbrief een waarde van de zaken aangeven, die het maximum, vermeld in de in [artikel 1105][ref1] genoemde
      algemene maatregel van bestuur, overschrijdt. In dat geval treedt het aangegeven bedrag in de plaats van dit
      maximum.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1105
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1106
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1105'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1106.2'
    text: |-
      Nietig is ieder beding, ook indien het wordt aangegaan op de wijze als voorzien in het eerste lid van
      [artikel 1102][ref1], waarbij het aldus aangegeven bedrag hoger wordt gesteld dan de in het eerste lid van
      [artikel 1103][ref2] genoemde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1102
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1103
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1106
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1102'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1103'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1107.1'
    text: |-
      De afzender kan, mits de vervoerder hierin toestemt en tegen betaling van een overeen te komen bedrag, door
      vermelding op de vrachtbrief het bedrag van een bijzonder belang bij de aflevering voor het geval van verlies
      of beschadiging van vervoerde zaken en voor dat van overschrijding van een overeengekomen termijn van aflevering
      daarvan, vaststellen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1107
  - number: '1107.2'
    text: |-
      Indien een bijzonder belang bij de aflevering is aangegeven, kan, indien de vervoerder aansprakelijk is wegens
      niet nakomen van de op hem uit hoofde van de [artikelen 1095][ref1] en [1096][ref2] rustende verplichtingen,
      onafhankelijk van de schadevergoedingen genoemd in de [artikelen 1103 tot en met 1106][ref3] en tot ten hoogste
      eenmaal het bedrag van het aangegeven belang, een schadevergoeding worden gevorderd gelijk aan de bewezen
      bijkomende schade.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1095
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1096
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1103
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1107
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1095'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1096'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1103'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1108.1'
    text: |-
      De vervoerder kan zich niet beroepen op enige beperking van zijn aansprakelijkheid, voor zover de schade is
      ontstaan uit zijn eigen handeling of nalaten, geschied hetzij met het opzet die schade te veroorzaken, hetzij
      roekeloos en met de wetenschap dat die schade er waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1108
  - number: '1108.2'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1108
  - number: '1109.1'
    text: |-
      De afzender is bevoegd de overeenkomst op te zeggen, wanneer hem door de vervoerder is medegedeeld dat geen
      voertuig op de overeengekomen plaats of tijd voor het vervoer aanwezig is of zal kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1109
  - number: '1109.2'
    text: Hij kan deze bevoegdheid slechts uitoefenen terstond na ontvangst van deze mededeling.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1109
  - number: '1109.3'
    text: |-
      Indien bij gebreke van de ontvangst van een mededeling, als bedoeld in het eerste lid, het de afzender uit anderen
      hoofde bekend is, dat het voertuig niet op de overeengekomen plaats of tijd voor het vervoer aanwezig is of kan
      zijn, is hij, zonder dat enige ingebrekestelling is vereist, bevoegd de overeenkomst op te zeggen, doch slechts
      binnen een redelijke termijn nadat hem dit bekend was; gelijke bevoegdheid komt hem toe, indien hem na ontvangst
      van een mededeling, als bedoeld in het eerste lid, uit anderen hoofde bekend wordt, dat het voertuig op grond van
      andere omstandigheden dan welke de vervoerder tot zijn mededeling brachten, niet op de overeengekomen plaats of
      tijd voor het vervoer aanwezig is of kan zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1109
  - number: '1109.4'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving of enig ander bericht, waarvan de
      ontvangst duidelijk aantoonbaar is, en de overeenkomst eindigt op het ogenblik van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1109
  - number: '1109.5'
    text: |-
      Indien de vervoerder gehouden is de schade, die de afzender door de opzegging lijdt, te vergoeden, zal deze
      vergoeding niet meer bedragen dan de vracht voor het overeengekomen vervoer, of, in geval van tijdbevrachting, voor
      terbeschikkingstelling van het voertuig gedurende 24 uur.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1109
  - number: '1110'
    text: |-
      De afzender is verplicht de vervoerder de schade te vergoeden die deze lijdt doordat de overeengekomen zaken, door
      welke oorzaak dan ook, niet op de overeengekomen plaats en tijd te zijner beschikking zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1110
  - number: '1111.1'
    text: |-
      Alvorens zaken ter beschikking van de vervoerder zijn gesteld is de afzender bevoegd de overeenkomst op te zeggen.
      Hij is verplicht aan de vervoerder de vracht, die voor het vervoer van de zaken was overeengekomen, te voldoen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1111
  - number: '1111.2'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving of enig ander bericht, waarvan de
      ontvangst duidelijk aantoonbaar is, en de overeenkomst eindigt op het ogenblik van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1111
  - number: '1111.3'
    text: Dit artikel is niet van toepassing ingeval van tijdbevrachting.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1111
  - number: '1112.1'
    text: |-
      Zijn bij het verstrijken van de tijd, waarbinnen de zaken ter beschikking van de vervoerder moeten zijn gesteld,
      door welke oorzaak dan ook, in het geheel geen zaken ter beschikking, dan is de vervoerder, zonder dat enige
      ingebrekestelling is vereist, bevoegd de overeenkomst op te zeggen. De afzender is verplicht hem de vracht, die
      voor het vervoer van de zaken was overeengekomen, te voldoen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1112
  - number: '1112.2'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving of enig ander bericht, waarvan de
      ontvangst duidelijk aantoonbaar is, en de overeenkomst eindigt op het ogenblik van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1112
  - number: '1112.3'
    text: Dit artikel is niet van toepassing in geval van tijdbevrachting.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1112
  - number: '1113.1'
    text: |-
      Zijn bij het verstrijken van de tijd, waarbinnen de zaken ter beschikking van de vervoerder moeten zijn gesteld,
      door welke oorzaak dan ook, de overeengekomen zaken slechts gedeeltelijk ter beschikking van de vervoerder, dan
      is deze, zonder dat enige ingebrekestelling is vereist, bevoegd de overeenkomst op te zeggen, dan wel de reis te
      aanvaarden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1113
  - number: '1113.2'
    text: |-
      De afzender is op verlangen van de vervoerder in geval van opzegging van de overeenkomst verplicht tot lossing
      van de reeds gestuwde zaken of, in geval de vervoerder de reis aanvaardt en het vertrek van het voertuig zonder
      herstuwing van de reeds gestuwde zaken niet mogelijk is, tot deze herstuwing. Hij is verplicht de vervoerder de
      vracht, die voor het vervoer van de niet ter beschikking zijnde of ten gevolge van de opzegging niet vervoerde
      zaken was overeengekomen, te voldoen en deze bovendien de schade te vergoeden, die hij lijdt ten gevolge van de
      opzegging, van de aanvaarding van de reis, dan wel van lossing of herstuwing van reeds ingenomen zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1113
  - number: '1113.3'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving of enig ander bericht, waarvan de
      ontvangst duidelijk aantoonbaar is, en de overeenkomst eindigt op het ogenblik van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1113
  - number: '1113.4'
    text: Dit artikel is niet van toepassing in geval van tijdbevrachting.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1113
  - number: '1114.1'
    text: |-
      De afzender is verplicht de vervoerder omtrent de zaken alsmede omtrent de behandeling daarvan tijdig al die
      opgaven te doen, waartoe hij in staat is of behoort te zijn, en waarvan hij weet of behoort te weten, dat zij voor
      de vervoerder van belang zijn, tenzij hij mag aannemen dat de vervoerder deze gegevens kent.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1114
  - number: '1114.2'
    text: |-
      De afzender is verplicht de gegevens, die hij volgens het eerste lid aan de vervoerder moet verstrekken, zo
      mogelijk op of aan de te vervoeren zaken of derzelver verpakking duidelijk aan te brengen en wel zodanig, dat zij
      in normale omstandigheden tot het einde van het vervoer leesbaar zullen blijven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1114
  - number: '1114.3'
    text: |-
      De vervoerder is niet gehouden, doch wel gerechtigd, te onderzoeken of de hem gedane opgaven juist en volledig
      zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1114
  - number: '1114.4'
    text: |-
      Is bij het verstrijken van de tijd waarbinnen de zaken ter beschikking van de vervoerder moeten zijn gesteld,
      door welke oorzaak dan ook, niet of slechts gedeeltelijk voldaan aan de in het eerste of tweede lid van
      dit artikel genoemde verplichtingen van de afzender, dan zijn, behalve in het geval van tijdbevrachting, de
      [artikelen 1112][ref1] en [1113][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1112
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1113
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1114
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1112'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1113'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1115.1'
    text: |-
      De afzender is verplicht de vervoerder de schade te vergoeden die deze lijdt doordat, door welke oorzaak dan
      ook, niet naar behoren aanwezig zijn de documenten en inlichtingen, die van de zijde van de afzender vereist
      zijn voor het vervoer dan wel ter voldoening aan vóór de aflevering van de zaken te vervullen douane- en andere
      formaliteiten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1115
  - number: '1115.2'
    text: |-
      De vervoerder is verplicht redelijke zorg aan te wenden, dat de documenten, die in zijn handen zijn gesteld
      niet verloren gaan of onjuist worden behandeld. Een door hem ter zake verschuldigde schadevergoeding zal die,
      verschuldigd uit hoofde van de [artikelen 1103 tot en met 1108][ref1] in geval van verlies van de zaken, niet
      overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1103
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1115
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1103'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1115.3'
    text: |-
      De vervoerder is niet gehouden, doch wel gerechtigd, te onderzoeken of de hem gedane opgaven juist en volledig
      zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1115
  - number: '1115.4'
    text: |-
      Zijn bij het verstrijken van de tijd, waarbinnen de in het eerste lid genoemde documenten en inlichtingen aanwezig
      moeten zijn, deze, door welke oorzaak dan ook, niet naar behoren aanwezig, dan zijn, behalve in het geval van
      tijdbevrachting, de [artikelen 1112][ref1] en [1113][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1112
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1113
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1115
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1112'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1113'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1116.1'
    text: |-
      Wanneer vóór of bij de aanbieding van de zaken aan de vervoerder omstandigheden aan de zijde van een der partijen
      zich opdoen of naar voren komen, die haar wederpartij bij het sluiten van de overeenkomst niet behoefde te
      kennen, doch die, indien zij haar wel bekend waren geweest, redelijkerwijs voor haar grond hadden opgeleverd de
      vervoerovereenkomst niet of op andere voorwaarden aan te gaan, is deze wederpartij bevoegd de overeenkomst op te
      zeggen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1116
  - number: '1116.2'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving of enig ander bericht, waarvan de
      ontvangst duidelijk aantoonbaar is, en de overeenkomst eindigt op het ogenblik van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1116
  - number: '1116.3'
    text: |-
      Naar maatstaven van redelijkheid en billijkheid zijn partijen na op zegging der overeenkomst verplicht elkaar de
      daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1116
  - number: '1117.1'
    text: |-
      De afzender is verplicht de vervoerder de buitengewone schade te vergoeden, die materiaal dat hij deze ter
      beschikking stelde of zaken die deze ten vervoer ontving, dan wel de behandeling daarvan, de vervoerder
      berokkenden, behalve voor zover deze schade is veroorzaakt door een omstandigheid die voor rekening van de
      vervoerder komt; voor rekening van de vervoerder komen die omstandigheden, die in geval van beschadiging van door
      hem vervoerde zaken voor zijn rekening komen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1117
  - number: '1117.2'
    text: |-
      Dit artikel laat [artikel 1118][ref1] onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1118
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1117
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1118'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1118.1'
    text: |-
      Zaken ten aanzien waarvan de afzender, door welke oorzaak dan ook, niet aan zijn verplichtingen uit hoofde van
      het eerste en tweede lid van [artikel 1114][ref1] voldeed, mogen door de vervoerder op ieder ogenblik en op
      iedere plaats worden gelost, vernietigd of op andere wijze onschadelijk gemaakt, doch dit slechts dan wanneer
      zij onmiddellijk dreigend gevaar opleveren. De vervoerder is terzake geen enkele schadevergoeding verschuldigd en
      de afzender is aansprakelijk voor alle kosten en schaden voor de vervoerder voortvloeiende uit de aanbieding ten
      vervoer, uit het vervoer of uit deze maatregelen zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1114
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1118
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1114'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1118.2'
    text: |-
      Indien de vervoerder op grond van het eerste lid gerechtigd is tot lossen, vernietigen of op andere wijze
      onschadelijk maken van zaken, is de afzender op verlangen van de vervoerder en wanneer hem dit redelijkerwijs
      mogelijk is, verplicht deze maatregel te nemen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1118
  - number: '1118.3'
    text: |-
      Door het treffen van de in het eerste of tweede lid bedoelde maatregel eindigt de overeenkomst met betrekking tot
      de daar genoemde zaken, doch, indien deze alsnog worden gelost, eerst na deze lossing. De vervoerder verwittigt
      de afzender en zo mogelijk degeen aan wie de zaken moeten worden afgeleverd. Dit lid is niet van toepassing met
      betrekking tot zaken, die de vervoerder na het treffen van de in het eerste lid bedoelde maatregel alsnog naar hun
      bestemming vervoert.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1118
  - number: '1118.4'
    text: |-
      Op de feitelijke aflevering is het tussen partijen overeengekomene als mede het in deze afdeling nopens de
      aflevering van zaken bepaalde van toepassing. De [artikelen 1132][ref1], [1133][ref2], [1137][ref3] en [1138][ref4]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1132
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1133
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1137
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1138
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1118
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1132'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1133'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1137'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '1138'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1118.5'
    text: Nietig is ieder beding, waarbij van het eerste of het tweede lid van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1118
  - number: '1119.1'
    text: |-
      Zowel de afzender als de vervoerder kunnen ter zake van het vervoer een vrachtbrief opmaken en verlangen dat deze
      of een mogelijkerwijs door hun wederpartij opgemaakte vrachtbrief door hun wederpartij wordt getekend en aan hen
      wordt afgegeven. De ondertekening kan worden gedrukt of door een stempel dan wel enig ander kenmerk van oorsprong
      worden vervangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1119
  - number: '1119.2'
    text: |-
      Op de vrachtbrief worden volgens de daarop mogelijkerwijs voorkomende aanwijzingen de volgende aanduidingen
      vermeld:
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1119
  - number: 1119.2.a
    text: de afzender, als hoedanig slechts één persoon kan worden genoemd;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1119
  - number: 1119.2.b
    text: de ten vervoer ontvangen zaken;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1119
  - number: 1119.2.c
    text: de plaats waar de vervoerder de zaken ten vervoer heeft ontvangen;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1119
  - number: 1119.2.d
    text: de plaats waarheen de vervoerder op zich neemt de zaken te vervoeren;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1119
  - number: 1119.2.e
    text: de geadresseerde, als hoedanig slechts één persoon kan worden genoemd;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1119
  - number: 1119.2.f
    text: de vervoerder;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1119
  - number: 1119.2.g
    text: al hetgeen overigens aan afzender en vervoerder gezamenlijk goeddunkt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1119
  - number: '1119.3'
    text: |-
      De aanduidingen vermeld in het tweede lid onder *a* tot en met *e* worden in de vrachtbrief opgenomen aan de
      hand van door de afzender te verstrekken gegevens. De afzender staat in voor de juistheid, op het ogenblik
      van inontvangstneming van de zaken, van deze gegevens. De aanduiding van de vervoerder wordt in de vrachtbrief
      opgenomen aan de hand van door deze te verstrekken gegevens en de vervoerder staat in voor de juistheid hiervan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1119
  - number: '1119.4'
    text: |-
      Partijen zijn verplicht elkaar de schade te vergoeden, die zij lijden door het ontbreken van in het tweede lid
      genoemde gegevens.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1119
  - number: '1120'
    text: |-
      De vervoerder is niet gehouden, doch vóór de afgifte van de vrachtbrief aan de afzender wel gerechtigd, te
      onderzoeken of de daarop omtrent de zaken vermelde gegevens juist, nauwkeurig en volledig zijn. Hij is bevoegd zijn
      bevindingen ten aanzien van de zaken op de vrachtbrief aan te tekenen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1120
  - number: '1121'
    text: |-
      Wanneer de te vervoeren zaken moeten worden geladen in verschillende voertuigen of wanneer het verschillende
      soorten zaken of afzonderlijke partijen betreft, hebben afzender zowel als vervoerder het recht te eisen, dat er
      evenveel vrachtbrieven worden opgemaakt als er voertuigen moeten worden gebruikt of als er soorten of partijen
      zaken zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1121
  - number: '1122.1'
    text: |-
      Tenzij tussen hen een bevrachting is aangegaan, wordt op verlangen van afzender of vervoerder, mits dit te
      kennen is gegeven alvorens zaken ter beschikking van de vervoerder worden gesteld, de vrachtbrief voor deze zaken
      opgesteld in de vorm van een transportbrief. Aan de bovenvoorzijde van de vrachtbrief wordt alsdan met duidelijk
      leesbare letters het woord "transportbrief" geplaatst.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1122
  - number: '1122.2'
    text: |-
      De transportbrief wordt opgemaakt in overeenstemming met de vereisten genoemd in [artikel 1119][ref1] en
      [artikel 1121][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1119
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1121
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1122
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1119'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1121'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1122.3'
    text: |-
      Verwijzingen in de transportbrief worden geacht slechts die bedingen daarin in te voegen, die voor degeen, jegens
      wie daarop een beroep wordt gedaan, duidelijk kenbaar zijn. Een dergelijk beroep is slechts mogelijk voor hem, die
      op schriftelijk verlangen van degeen jegens wie dit beroep kan worden gedaan of wordt gedaan, aan deze onverwijld
      die bedingen heeft doen toekomen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1122
  - number: '1122.4'
    text: |-
      Indien beide partijen zulks verlangen, kan ook in geval van bevrachting een transportbrief worden opgemaakt. Deze
      moet dan voldoen aan de in dit artikel gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1122
  - number: '1122.5'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1122
  - number: '1123.1'
    text: |-
      Indien een transportbrief is afgegeven, wordt, onder voorbehoud van het tweede lid van dit artikel, de
      rechtsverhouding tussen de vervoerder enerzijds en de afzender of de geadresseerde anderzijds beheerst door de
      bedingen van deze transportbrief.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1123
  - number: '1123.2'
    text: |-
      Indien een vervoerovereenkomst is gesloten en bovendien een transportbrief is afgegeven, wordt de
      rechtsverhouding tussen de vervoerder en de afzender door de bedingen van de vervoerovereenkomst en niet door
      die van deze transportbrief beheerst. De transportbrief strekt hun dan slechts, en dit onder voorbehoud van
      [artikel 1124][ref1], tot bewijs van de ontvangst der zaken door de vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1124
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1123
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1124'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1124.1'
    text: |-
      In de vrachtbrief vervatte gegevens omtrent de ten vervoer ontvangen zaken leveren geen bewijs op jegens de
      vervoerder, tenzij het gegevens betreft waarvan een zorgvuldig vervoerder de juistheid kan beoordelen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1124
  - number: '1124.2'
    text: |-
      Bevat de vrachtbrief een door de vervoerder afzonderlijk ondertekende verklaring dat hij de juistheid erkent van
      in die verklaring genoemde gegevens omtrent de ten vervoer ontvangen zaken, dan wordt tegenbewijs daartegen niet
      toegelaten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1124
  - number: '1124.3'
    text: |-
      Een vrachtbrief, die de uiterlijk zichtbare staat of gesteldheid van de zaak niet vermeldt, levert geen vermoeden
      op, dat de vervoerder die zaak, voor zover uiterlijk zichtbaar, in goede staat of gesteldheid heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1124
  - number: '1124.4'
    text: |-
      Door de vervoerder op de vrachtbrief geplaatste aantekeningen, genoemd in [artikel 1120][ref1], binden de afzender
      niet. Bevat echter de vrachtbrief een door de afzender afzonderlijk ondertekende verklaring, dat hij de juistheid
      van die aantekeningen erkent, dan wordt tegenbewijs daartegen niet toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1120
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1124
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1120'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1125.1'
    text: |-
      De afzender is bevoegd zichzelf of een ander als geadresseerde aan te wijzen, een gegeven aanduiding van de
      geadresseerde te wijzigen, orders omtrent de aflevering te geven of te wijzigen dan wel aflevering vóór de aankomst
      ter bestemming van zonder transportbrief ten vervoer ontvangen zaken of, wanneer een transportbrief is afgegeven,
      van alle daarop vermelde zaken, te verlangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1125
  - number: '1125.2'
    text: |-
      De uitvoering van deze instructies moet mogelijk zijn op het ogenblik, dat de instructies de persoon, die deze
      moet uitvoeren, bereiken en zij mag noch de normale bedrijfsuitvoering van de vervoerder beletten, noch schade
      toebrengen aan de vervoerder of belanghebbenden bij de overige lading. Doet zij dit laatste desalniettemin, dan
      is de afzender verplicht de geleden schade te vergoeden. Wanneer het voertuig naar een niet eerder overeengekomen
      plaats is gereden, is hij verplicht de vervoerder terzake bovendien een redelijke vergoeding te geven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1125
  - number: '1125.3'
    text: |-
      Deze rechten van de afzender vervallen al naarmate de geadresseerde op de losplaats zaken aanneemt of de
      geadresseerde van de vervoerder schadevergoeding verlangt omdat deze zaken niet aflevert.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1125
  - number: '1125.4'
    text: |-
      Zaken, die ingevolge het eerste lid zijn afgeleverd, worden aangemerkt als ter bestemming afgeleverde zaken en
      de bepalingen van deze afdeling nopens de aflevering van zaken, alsmede de [artikelen 1132][ref1], [1133][ref2],
      [1137][ref3] en [1138][ref4] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1132
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1133
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1137
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1138
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1125
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1132'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1133'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1137'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '1138'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1126'
    text: |-
      Indien aan de afzender een vrachtbrief is afgegeven, die een geadresseerde vermeldt, heeft ook deze geadresseerde
      jegens de vervoerder het recht aflevering van zaken overeenkomstig de op de vervoerder rustende verplichtingen te
      vorderen; daarbij zijn de [artikelen 1103-1108][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1103
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1126
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1103'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1127'
    text: De ontvanger is verplicht terstond na de aflevering van de zaken een ontvangstbewijs daarvoor af te geven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1127
  - number: '1128.1'
    text: |-
      Vracht is - behalve in geval van tijdbevrachting - verschuldigd op het ogenblik, dat de vervoerder de zaken ten
      vervoer ontvangt of, wanneer een vrachtbrief wordt afgegeven, bij het afgeven hiervan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1128
  - number: '1128.2'
    text: |-
      Vracht, die vooruit te voldoen is of voldaan is, is en blijft - behalve in geval van tijdbevrachting - in zijn
      geheel verschuldigd, ook wanneer de zaken niet ter bestemming worden afgeleverd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1128
  - number: '1128.3'
    text: |-
      Wanneer de afzender niet aan zijn uit dit artikel voortvloeiende verplichtingen heeft voldaan, is de vervoerder
      bevoegd het vervoer van de betrokken zaak op te schorten. Met toestemming van de rechter is hij gerechtigd tot het
      nemen van de in de [artikelen 1132][ref1] en [1133][ref2] genoemde maatregelen. Gaat hij hiertoe over, dan zijn
      deze artikelen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1132
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1133
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1128
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1132'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1133'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1129'
    text: |-
      Onverminderd [afdeling 1 van Titel 4 van Boek 6][ref1] zijn de afzender en de ontvanger hoofdelijk verbonden de
      vervoerder de schade te vergoeden, geleden doordat deze zich als zaakwaarnemer inliet met de behartiging van de
      belangen van een rechthebbende op ten vervoer ontvangen zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling1
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1129
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '1'
  - number: '1130.1'
    text: |-
      De vervoerder is verplicht de bedragen, die als rembours op de zaak drukken, bij aflevering van de zaak van de
      ontvanger te innen en vervolgens aan de afzender af te dragen. Wanneer hij aan deze verplichting, door welke
      oorzaak dan ook, niet voldoet, is hij verplicht het bedrag van het rembours aan de afzender te vergoeden, doch
      indien deze geen of minder schade leed, ten hoogste tot op het bedrag van de geleden schade.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1130
  - number: '1130.2'
    text: |-
      De ontvanger, die ten tijde van de aflevering weet dat een bedrag als rembours op de zaak drukt, is verplicht aan
      de vervoerder het door deze aan de afzender verschuldigde bedrag te voldoen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1130
  - number: '1131.1'
    text: |-
      De vervoerder is gerechtigd afgifte van zaken of documenten, die hij in verband met de vervoerovereenkomst onder
      zich heeft, te weigeren aan ieder, die uit anderen hoofde dan de vervoerovereenkomst recht heeft op aflevering
      daarvan, tenzij daarop beslag is gelegd en uit de vervolging van dit beslag een verplichting tot afgifte aan de
      beslaglegger voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1131
  - number: '1131.2'
    text: |-
      De vervoerder kan het recht van retentie uitoefenen op zaken of documenten, die hij in verband met de
      vervoerovereenkomst onder zich heeft, voor hetgeen hem verschuldigd is of zal worden terzake van het vervoer
      van die zaken. Hij kan dit recht tevens uitoefenen voor hetgeen bij wijze van rembours op de zaak drukt. Dit
      retentierecht vervalt zodra aan de vervoerder is betaald het bedrag waarover geen geschil bestaat en voldoende
      zekerheid is gesteld voor de betaling van die bedragen, waaromtrent wel geschil bestaat of welker hoogte nog
      niet kan worden vastgesteld. De vervoerder behoeft echter geen zekerheid te aanvaarden voor hetgeen bij wijze van
      rembours op de zaak drukt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1131
  - number: '1131.3'
    text: |-
      De in dit artikel aan de vervoerder toegekende rechten komen hem niet toe jegens een derde, indien hij op het
      tijdstip dat hij de zaak of het document ten vervoer ontving, reden had te twijfelen aan de bevoegdheid van de
      afzender jegens die derde hem die zaak of dat document ten vervoer ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1131
  - number: '1132.1'
    text: |-
      Voor zover hij die jegens de vervoerder recht heeft op aflevering van vervoerde zaken niet opkomt, weigert deze
      te ontvangen of deze niet met de vereiste spoed in ontvangst neemt, of voor zover op zaken beslag is gelegd, is
      de vervoerder gerechtigd deze zaken voor rekening en gevaar van de rechthebbende bij een derde op te slaan in een
      daarvoor geschikte bewaarplaats. Op zijn verzoek kan de rechter bepalen dat hij deze zaken, desgewenst ook in het
      voertuig, onder zichzelf kan houden of andere maatregelen daarvoor kan treffen. Hij is verplicht de afzender zo
      spoedig mogelijk op de hoogte te stellen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1132
  - number: '1132.2'
    text: |-
      De derde-bewaarnemer en de ontvanger zijn jegens elkaar verbonden, als ware de omtrent de bewaring gesloten
      overeenkomst mede tussen hen aangegaan. De bewaarnemer is echter niet gerechtigd tot afgifte dan na schriftelijke
      toestemming daartoe van hem, die de zaken in bewaring gaf.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1132
  - number: '1133.1'
    text: |-
      In geval van toepassing van [artikel 1132][ref1], kan de vervoerder, de bewaarnemer dan wel hij die jegens de
      vervoerder recht heeft op de aflevering, op zijn verzoek door de rechter worden gemachtigd de zaken geheel of
      gedeeltelijk op de door deze te bepalen wijze te verkopen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1132
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1133
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1132'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1133.2'
    text: |-
      De bewaarnemer is verplicht de vervoerder zo spoedig mogelijk van de voorgenomen verkoop op de hoogte te stellen;
      de vervoerder heeft deze verplichting jegens degeen, die jegens hem recht heeft op de aflevering van de zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1133
  - number: '1133.3'
    text: |-
      De opbrengst van het verkochte wordt in de consignatiekas gestort voor zover zij niet strekt tot voldoening van
      de kosten van opslag en verkoop alsmede, binnen de grenzen der redelijkheid, van de gemaakte kosten. Tenzij op de
      zaken beslag is gelegd voor een geldvordering, moet aan de vervoerder uit het in bewaring te stellen bedrag worden
      voldaan hetgeen hem verschuldigd is ter zake van het vervoer of op grond van een remboursbeding; voor zover deze
      vorderingen nog niet vast staan, zal de opbrengst of een gedeelte daarvan op door de rechter te bepalen wijze tot
      zekerheid voor deze vorderingen strekken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1133
  - number: '1133.4'
    text: De in de consignatiekas gestorte opbrengst treedt in de plaats van de zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1133
  - number: '1134'
    text: |-
      Indien er zekerheid of vermoeden bestaat, dat er verlies of schade is, moeten de vervoerder en hij, die jegens
      de vervoerder recht heeft op de aflevering, elkaar over en weer in redelijkheid alle middelen verschaffen om het
      onderzoek van de zaak en het natellen van de colli mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1134
  - number: '1135.1'
    text: |-
      Zowel de vervoerder als hij die jegens de vervoerder recht heeft op de aflevering is bevoegd bij de aflevering van
      zaken de rechter te verzoeken een gerechtelijk onderzoek te doen plaatshebben naar de toestand waarin deze worden
      afgeleverd; tevens zijn zij bevoegd de rechter te verzoeken de daarbij bevonden verliezen of schaden gerechtelijk
      te doen begroten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1135
  - number: '1135.2'
    text: |-
      Indien dit onderzoek in tegenwoordigheid of na behoorlijke oproeping van de wederpartij heeft plaatsgehad, wordt
      het uitgebrachte rapport vermoed juist te zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1135
  - number: '1136.1'
    text: |-
      De kosten van gerechtelijk onderzoek, als bedoeld in [artikel 1135][ref1], moeten worden voldaan door de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1135
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1136
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1135'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1136.2'
    text: |-
      De rechter kan deze kosten en door het onderzoek geleden schade geheel of gedeeltelijk ten laste van de wederpartij
      van de aanvrager brengen, ook al zouden daardoor de bedragen genoemd in de in [artikel 1105][ref1] bedoelde
      algemene maatregel van bestuur worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1105
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1136
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1105'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1137'
    text: |-
      Indien binnen één jaar nadat de vervoerder aan degeen, die jegens hem recht op aflevering van zaken heeft,
      schadevergoeding heeft uitgekeerd ter zake van het niet afleveren van deze zaken, deze zaken of enige daarvan
      alsnog onder de vervoerder blijken te zijn of te zijn gekomen, is de vervoerder verplicht die afzender of die
      geadresseerde, die daartoe bij aangetekende brief het verlangen uitte, van deze omstandigheid bij aangetekende
      brief op de hoogte te brengen en heeft de afzender respectievelijk de geadresseerde gedurende dertig dagen na
      ontvangst van deze mededeling het recht tegen verrekening van de door hem ontvangen schadevergoeding opnieuw
      afleveren van deze zaken te verlangen. Hetzelfde geldt, indien de vervoerder terzake van het niet afleveren geen
      schadevergoeding heeft uitgekeerd, met dien verstande dat de termijn van één jaar begint met de aanvang van de dag
      volgende op die, waarop de zaken hadden moeten zijn afgeleverd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1137
  - number: '1138'
    text: |-
      Met betrekking tot ten vervoer ontvangen zaken, die de vervoerder onder zich heeft, doch ten aanzien waarvan
      hij niet meer uit hoofde van de vervoerovereenkomst tot aflevering is verplicht, is [artikel 1133][ref1] van
      overeenkomstige toepassing met dien verstande, dat uit de opbrengst van het verkochte bovendien aan de vervoerder
      moet worden voldaan het bedrag, dat deze mogelijkerwijs voldeed ter zake van zijn aansprakelijkheid wegens het niet
      nakomen van de op hem uit hoofde van de [artikelen 1095][ref2] en [1096][ref3] rustende verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1133
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1095
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1096
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1138
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1133'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1095'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1096'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1140.1'
    text: |-
      De overeenkomst van personenvervoer in de zin van deze titel is de overeenkomst van personenvervoer, al dan niet
      tijd- of reisbevrachting zijnde, waarbij de ene partij (de vervoerder) zich tegenover de andere partij verbindt aan
      boord van een voertuig een of meer personen (reizigers) en al dan niet hun bagage uitsluitend over de weg en anders
      dan langs spoorstaven te vervoeren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1140
  - number: '1140.2'
    text: |-
      De overeenkomst van personenvervoer als omschreven in [artikel 100][ref1] is niet een overeenkomst van
      personenvervoer in de zin van deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel100
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1140
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '100'
        hoofdstuk: I
        afdeling: '5'
  - number: '1141.1'
    text: |-
      Handbagage in de zin van deze afdeling is de bagage met inbegrip van levende dieren, die de reiziger als
      gemakkelijk mee te voeren, draagbare dan wel met de hand verrijdbare zaken op of bij zich heeft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1141
  - number: '1141.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen zaken, die geen handbagage zijn, voor de toepassing van bepalingen van
      deze afdeling als handbagage worden aangewezen, dan wel bepalingen van deze afdeling niet van toepassing worden
      verklaard op zaken, die handbagage zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1141
  - number: '1142.1'
    text: |-
      Vervoer over de weg van personen omvat uitsluitend de tijd dat de reiziger aan boord van het voertuig is, terwijl
      dit zich op de weg bevindt. Bovendien omvat het de tijd van zijn instappen daarin of uitstappen daaruit.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1142
  - number: '1142.2'
    text: |-
      Vervoer over de weg van personen omvat voor de toepassing van [artikel 1148 tweede lid][ref1], in afwijking van
      het elders bepaalde, het tijdvak dat het voertuig zich aan boord van een ander vervoermiddel en niet op de weg
      bevindt, doch dit slechts ten aanzien van de reiziger die zich aan boord van dat voertuig bevindt of die daar in-
      of uitstapt.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1148
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1142
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1148'
        hoofdstuk: IV
        afdeling: '3'
  - number: '1143.1'
    text: |-
      Vervoer over de weg van handbagage omvat uitsluitend de tijd dat deze aan boord van het voertuig is terwijl dit
      zich op de weg bevindt. Bovendien omvat het de tijd van inlading daarin en uitlading daaruit.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1143
  - number: '1143.2'
    text: |-
      Voor bagage, die geen handbagage is, omvat het vervoer over de weg de tijd tussen het overnemen daarvan door de
      vervoerder en de aflevering door de vervoerder.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1143
  - number: '1143.3'
    text: |-
      Vervoer over de weg van bagage omvat voor de toepassing van [artikel 1150 tweede lid][ref1], in afwijking van het
      elders bepaalde, het tijdvak dat het voertuig, aan boord waarvan de bagage zich bevindt, zich aan boord van een
      ander vervoermiddel en niet op de weg bevindt, doch dit slechts ten aanzien van bagage, die zich aan boord van dat
      voertuig bevindt of die daarin wordt ingeladen dan wel daaruit wordt uitgeladen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1150
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1143
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1150'
        hoofdstuk: IV
        afdeling: '3'
  - number: '1144.1'
    text: |-
      Tijd- of reisbevrachting in de zin van deze afdeling is de overeenkomst van personenvervoer, waarbij de vervoerder
      (vervrachter) zich verbindt tot vervoer aan boord van een voertuig, dat hij daartoe in zijn geheel met bestuurder
      en al dan niet op tijdbasis (tijdbevrachting of reisbevrachting) ter beschikking stelt van zijn wederpartij
      (bevrachter).
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1144
  - number: '1144.2'
    text: |-
      De [artikelen 1093][ref1], [1097][ref2], [1109][ref3], [1112][ref4] en [1113][ref5] zijn op deze bevrachting van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1093
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1097
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1109
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1112
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Artikel1113
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1144
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1093'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1097'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1109'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '1112'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005034
        artikel: '1113'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1145'
    text: |-
      De wetsbepalingen omtrent huur, bewaarneming en bruikleen zijn op terbeschikkingstelling van een voertuig met
      bestuurder, ten einde aan boord daarvan personen te vervoeren, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1145
  - number: '1147'
    text: |-
      De vervoerder is aansprakelijk voor schade veroorzaakt door dood of letsel van de reiziger ten gevolge van een
      ongeval dat in verband met en tijdens het vervoer aan de reiziger is overkomen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1147
  - number: '1148.1'
    text: |-
      De vervoerder is niet aansprakelijk voor schade door dood of letsel van de reiziger veroorzaakt, voor zover het
      ongeval dat hiertoe leidde, is veroorzaakt door een omstandigheid die een zorgvuldig vervoerder niet heeft kunnen
      vermijden en voor zover zulk een vervoerder de gevolgen daarvan niet heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1148
  - number: '1148.2'
    text: |-
      Lichamelijke of geestelijke tekortkomingen van de bestuurder van het voertuig alsmede gebrekkigheid of slecht
      functioneren van het voertuig of van het materiaal, waarvan hij zich voor het vervoer bedient, worden aangemerkt
      als een omstandigheid die een zorgvuldig vervoerder heeft kunnen vermijden en waarvan zulk een vervoerder de
      gevolgen heeft kunnen verhinderen. Onder materiaal wordt niet begrepen een schip, luchtvaartuig of spoorwagon, aan
      boord waarvan het voertuig zich bevindt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1148
  - number: '1148.3'
    text: |-
      Bij de toepassing van dit artikel wordt slechts dan rekening gehouden met een gedraging van een derde, indien geen
      andere omstandigheid, die mede tot het ongeval leidde, voor rekening van de vervoerder is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1148
  - number: '1149'
    text: |-
      Nietig is ieder vóór het aan de reiziger overkomen ongeval gemaakt beding waarbij de ingevolge [artikel 1147][ref1]
      op de vervoerder drukkende aansprakelijkheid of bewijslast wordt verminderd op andere wijze dan in deze afdeling
      is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1147
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1149
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1147'
        hoofdstuk: IV
        afdeling: '3'
  - number: '1150.1'
    text: |-
      De vervoerder is aansprakelijk voor schade veroorzaakt door geheel of gedeeltelijk verlies dan wel beschadiging
      van bagage voor zover dit verlies of deze beschadiging is ontstaan tijdens het vervoer en is veroorzaakt door een
      omstandigheid die een zorgvuldig vervoerder heeft kunnen vermijden of waarvan zulk een vervoerder de gevolgen heeft
      kunnen verhinderen. Voor schade veroorzaakt door geheel of gedeeltelijk verlies dan wel beschadiging van handbagage
      is hij bovendien aansprakelijk voor zover dit verlies of deze beschadiging is veroorzaakt door een aan de reiziger
      overkomen ongeval, dat voor rekening van de vervoerder komt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1150
  - number: '1150.2'
    text: |-
      Lichamelijke of geestelijke tekortkomingen van de bestuurder van het voertuig alsmede gebrekkigheid of slecht
      functioneren van het voertuig of van het materiaal waarvan hij zich voor het vervoer bedient, worden aangemerkt als
      een omstandigheid die een zorgvuldig vervoerder heeft kunnen vermijden en waarvan zulk een vervoerder de gevolgen
      heeft kunnen verhinderen. Onder materiaal wordt niet begrepen een schip, luchtvaartuig of spoorwagon, aan boord
      waarvan het voertuig zich bevindt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1150
  - number: '1150.3'
    text: |-
      Bij de toepassing van het eerste lid wordt ten aanzien van handbagage slechts dan rekening gehouden met een
      gedraging van een derde, indien geen andere omstandigheid, die mede tot het voorval leidde, voor rekening van de
      vervoerder is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1150
  - number: '1150.4'
    text: |-
      Nietig is ieder vóór het verlies of de beschadiging van bagage gemaakt beding, waarbij de ingevolge dit artikel
      op de vervoerder drukkende aansprakelijkheid of bewijslast op andere wijze wordt verminderd dan in deze afdeling
      is voorzien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1150
  - number: '1151'
    text: |-
      De vervoerder is niet aansprakelijk in geval van verlies of beschadiging overkomen aan geldstukken, verhandelbare
      documenten, goud, zilver, juwelen, sieraden, kunstvoorwerpen of andere zaken van waarde, tenzij deze zaken van
      waarde aan de vervoerder in bewaring zijn gegeven en hij overeengekomen is hen in zekerheid te zullen bewaren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1151
  - number: '1152'
    text: |-
      De vervoerder is terzake van door de reiziger aan boord van het voertuig gebrachte zaken die hij, indien hij hun
      aard of gesteldheid had gekend, niet aan boord van het voertuig zou hebben toegelaten en waarvoor hij geen bewijs
      van ontvangst heeft afgegeven, geen enkele schadevergoeding verschuldigd indien de reiziger wist of behoorde te
      weten, dat de vervoerder de zaken niet ten vervoer zou hebben toegelaten; de reiziger is alsdan aansprakelijk voor
      alle kosten en schaden voor de vervoerder voortvloeiend uit de aanbieding ten vervoer of uit het vervoer zelf.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1152
  - number: '1153'
    text: |-
      Onverminderd [artikel 1152][ref1] en onverminderd [artikel 179 van Boek 6][ref2] is de reiziger verplicht de
      vervoerder de schade te vergoeden die hij of zijn bagage deze berokkende, behalve voor zover deze schade is
      veroorzaakt door een omstandigheid die een zorgvuldig reiziger niet heeft kunnen vermijden en voor zover zulk een
      reiziger de gevolgen daarvan niet heeft kunnen verhinderen. De reiziger kan niet om zich van zijn aansprakelijkheid
      te ontheffen beroep doen op de hoedanigheid of een gebrek van zijn bagage.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1152
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel179
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1153
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1152'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '179'
  - number: '1154.1'
    text: |-
      Onverminderd de bepalingen van deze afdeling zijn op het vervoer van bagage de [artikelen 1095][ref1], [1096][ref2],
      [1103][ref3], [1104][ref4], [1114 eerste, tweede en derde lid][ref5], [1115 eerste, tweede en derde lid][ref6],
      [1116 tot en met 1118][ref7], [1129][ref8] en [1131 tot en met 1138][ref9] van toepassing. De in
      [artikel 1131][ref10] toegekende rechten en het in [artikel 1133][ref11] en [artikel 1138][ref12] toegekende recht
      tot het zich laten voldoen uit het in bewaring stellen bedrag van kosten terzake van het vervoer, kunnen worden
      uitgeoefend voor alles wat de wederpartij van de vervoerder of de reiziger aan de vervoerder verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1095
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1096
