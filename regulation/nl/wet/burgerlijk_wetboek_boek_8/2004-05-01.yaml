  - number: '1716'
    text: |-
      In afwijking van de [artikelen 1713][ref1] en [1717][ref2] begint de in [artikel 1711][ref3] genoemde termijn in
      geval van een rechtsvordering terzake van schade geleden door opzegging of door voortijdige beëindiging van de
      vervoerovereenkomst zonder opzegging, met de aanvang van de dag volgende op de dag dat de overeenkomst eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1713
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1717
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1711
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1716
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1713'
        hoofdstuk: VII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1717'
