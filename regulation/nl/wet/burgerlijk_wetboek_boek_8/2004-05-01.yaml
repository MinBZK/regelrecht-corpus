        artikel: '1711'
        hoofdstuk: VII
        afdeling: '2'
  - number: '1713.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing in geval van een door een afzender tegen een vervoerder ingestelde
      rechtsvordering terzake van het niet aanvangen van een verhuizing.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1713
  - number: '1714'
    text: |-
      In afwijking van [artikel 1717][ref1] en behoudens [artikel 1719][ref2] begint de in [artikel 1711][ref3] genoemde
      termijn met de aanvang van de dag, volgende op de dag van aflevering, indien het een rechtsvordering betreft
      terzake van het


