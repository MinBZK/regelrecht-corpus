        afdeling: '2'
  - number: '510.2'
    text: |-
      Partijen hebben de vrijheid af te wijken van in het eerste lid op hun onderlinge verhouding toepasselijk verklaarde
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel510
  - number: '511.1'
    text: 'De reiziger is gehouden de vervoerder schriftelijk kennis te geven:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel511
  - number: 511.1.a
    text: 'in geval van uiterlijk zichtbare schade aan bagage:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel511
  - number: 511.1.a.(i)
    text: 'wat betreft hutbagage: voor of ten tijde van de ontscheping van de reiziger;'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel511
  - number: 511.1.a.(ii)
    text: 'wat betreft alle andere bagage: voor of ten tijde van de aflevering;'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel511
  - number: 511.1.b
    text: |-
      in geval van niet uiterlijk zichtbare schade aan of verlies van bagage: binnen vijftien dagen na de aanvang van de
      dag, volgende op de dag van ontscheping of aflevering of die waarop de bagage had moeten worden afgeleverd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel511
  - number: '511.2'
    text: |-
      Indien de reiziger niet aan zijn in het eerste lid van dit artikel omschreven verplichting voldoet, wordt,
      behoudens tegenbewijs, vermoed dat hij de bagage onbeschadigd heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel511
  - number: '511.3'
    text: |-
      Schriftelijke kennisgeving is overbodig indien de staat van de bagage op het ogenblik van in ontvangstneming
      gezamenlijk is vastgesteld of geïnspecteerd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel511
  - number: '512'
    text: |-
      De vervoerder is niet gehouden, doch wel gerechtigd zich te overtuigen van de aard of gesteldheid van de bagage,
      indien hij vermoedt dat hij, de aard of gesteldheid van door de reiziger aan boord gebrachte bagage kennende,
      deze niet aan boord zou hebben toegelaten. De vervoerder is gehouden dit onderzoek te doen geschieden in
      tegenwoordigheid van de reiziger of, zo dit niet mogelijk is, in tegenwoordigheid van twee personen van wier hulp
      hij overigens bij de uitvoering van zijn verbintenis geen gebruik maakt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel512
  - number: '513'
    text: |-
      Indien de vervoerder bewijst dat schuld of nalatigheid van de reiziger schade heeft veroorzaakt of daartoe heeft
      bijgedragen, kan de aansprakelijkheid van de vervoerder daarvoor geheel of gedeeltelijk worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel513
  - number: '514'
    text: |-
      Indien personen van wier hulp de vervoerder bij de uitvoering van zijn verbintenis gebruik maakt, op verzoek van
      de reiziger diensten bewijzen, waartoe de vervoerder niet is verplicht, worden zij aangemerkt als te handelen in
      opdracht van de reiziger aan wie zij deze diensten bewijzen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel514
  - number: '515'
    text: |-
      Behoudens [artikel 516][ref1] is de vervoerder die zich, anders dan bij wijze van bevrachting, verbond tot vervoer
      volgens een dienstregeling, niet aansprakelijk voor schade die is veroorzaakt door vertraging, door welke oorzaak
      dan ook, vóór, tijdens of na het vervoer opgetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel516
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel515
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '516'
        hoofdstuk: II
        afdeling: '3'
  - number: '516'
    text: |-
      Onder verlies of beschadiging van bagage wordt mede verstaan vermogensschade geleden doordat de bagage niet binnen
      een redelijke tijd te rekenen van het ogenblik van aankomst van het schip, waarop deze bagage werd vervoerd of
      zou worden vervoerd, aan de reiziger werd afgeleverd, doch niet wordt daaronder verstaan vertraging door een
      arbeidsconflict veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel516
  - number: '517.1'
    text: |-
      Behoudens de artikelen 504 tot en met 507 is de vervoerder niet aansprakelijk voor schade ontstaan door een
      handeling, onachtzaamheid of nalatigheid van de kapitein of de schipper, een ander lid van de bemanning, de loods
      of de ondergeschikten van de vervoerder, gepleegd bij de navigatie van het schip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel517
  - number: '517.2'
    text: |-
      Behoudens de artikelen 504 tot en met 507 wordt generlei afwijking van de koers tot redding of poging tot redding
      van mensenlevens of goederen en generlei redelijke afwijking van de koers beschouwd als een schending van enige
      vervoerovereenkomst en de vervoerder is niet aansprakelijk voor enig verlies of enige schade daardoor ontstaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel517
  - number: '518.1'
    text: |-
      De aansprakelijkheid van de vervoerder is in geval van dood, letsel of vertraging van de reiziger en in geval
      van verlies, beschadiging of vertraging van diens bagage beperkt tot een bij of krachtens algemene maatregel van
      bestuur te bepalen bedrag of bedragen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel518
  - number: '518.2'
    text: Dit artikel laat de titels 7 en 12 van dit boek onverlet.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel518
  - number: '519.1'
    text: |-
      De vervoerder kan zich niet beroepen op enige beperking van zijn aansprakelijkheid voor zover de schade is ontstaan
      uit zijn eigen handeling of nalaten, geschied hetzij met het opzet die schade te veroorzaken, hetzij roekeloos en
      met de wetenschap dat die schade er waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel519
  - number: '519.2'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel519
  - number: '520'
    text: |-
      Nietig is ieder vóór het aan de reiziger overkomen voorval of vóór het verlies of de beschadiging van bagage
      gemaakt beding, waarbij de ingevolge de artikelen 504 tot en met 507 en 516 op de vervoerder drukkende
      aansprakelijkheid of bewijslast wordt verminderd op andere wijze dan in deze afdeling is voorzien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel520
  - number: '521.1'
    text: |-
      In geval van verlies of beschadiging van bagage wordt de vordering tot schadevergoeding gewaardeerd naar de
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel521
  - number: '521.2'
    text: |-
      In geval van aan de reiziger overkomen letsel en van de dood van de reiziger zijn de [artikelen 107][ref1] en
      [108 van Boek 6][ref2] niet van toepassing op de vorderingen die de vervoerder als wederpartij van een andere
      vervoerder tegen deze laatste instelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel108
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel521
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '108'
  - number: '522'
    text: |-
      De wederpartij van de vervoerder is verplicht deze de schade te vergoeden die hij lijdt doordat de reiziger, door
      welke oorzaak dan ook, niet tijdig ten vervoer aanwezig is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel522
  - number: '523'
    text: |-
      De wederpartij van de vervoerder is verplicht deze de schade te vergoeden die hij lijdt doordat de documenten met
      betrekking tot de reiziger, die van haar zijde voor het vervoer vereist zijn, door welke oorzaak dan ook, niet naar
      behoren aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel523
  - number: '524.1'
    text: |-
      Wanneer vóór of tijdens het vervoer omstandigheden aan de zijde van de wederpartij van de vervoerder of de
      reiziger zich opdoen of naar voren komen, die de vervoerder bij het sluiten van de overeenkomst niet behoefde
      te kennen, doch die, indien zij hem wel bekend waren geweest, redelijkerwijs voor hem grond hadden opgeleverd
      de vervoerovereenkomst niet of op andere voorwaarden aan te gaan, is de vervoerder bevoegd de overeenkomst op te
      zeggen en de reiziger uit het schip te verwijderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel524
  - number: '524.2'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving aan de wederpartij van de vervoerder of
      aan de reiziger en de overeenkomst eindigt op het ogenblik van ontvangst van de eerst ontvangen kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel524
  - number: '524.3'
    text: |-
      Naar maatstaven van redelijkheid en billijkheid zijn partijen na opzegging der overeenkomst verplicht elkaar de
      daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel524
  - number: '525.1'
    text: |-
      Wanneer vóór of tijdens het vervoer omstandigheden aan de zijde van de vervoerder zich opdoen of naar voren komen,
      die diens wederpartij bij het sluiten van de overeenkomst niet behoefde te kennen, doch die, indien zij haar wel
      bekend waren geweest, redelijkerwijs voor haar grond hadden opgeleverd de vervoerovereenkomst niet of op andere
      voorwaarden aan te gaan, is deze wederpartij van de vervoerder bevoegd de overeenkomst op te zeggen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel525
  - number: '525.2'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving en de overeenkomst eindigt op het ogenblik
      van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel525
  - number: '525.3'
    text: |-
      Naar maatstaven van redelijkheid en billijkheid zijn partijen na opzegging der overeenkomst verplicht elkaar de
      daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel525
  - number: '526'
    text: |-
      Wanneer de reiziger na verlaten van het schip niet tijdig terugkeert kan de vervoerder de overeenkomst beschouwen
      als op dat tijdstip te zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel526
  - number: '527.1'
    text: |-
      De wederpartij van de vervoerder is steeds bevoegd de overeenkomst op te zeggen. Zij is verplicht de vervoerder de
      schade te vergoeden, die deze tengevolge van de opzegging lijdt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel527
  - number: '527.2'
    text: Zij kan dit recht niet uitoefenen, wanneer daardoor de reis van het schip zou worden vertraagd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel527
  - number: '527.3'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving en de overeenkomst eindigt op het ogenblik
      van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel527
  - number: '528.1'
    text: |-
      Wordt terzake van het vervoer een passagebiljet, een ontvangstbewijs voor bagage of enig soortgelijk document
      afgegeven, dan is de vervoerder verplicht daarin op duidelijke wijze zijn naam en woonplaats te vermelden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel528
  - number: '528.2'
    text: Nietig is ieder beding, waarbij van het eerste lid van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel528
  - number: '528.3'
    text: |-
      De [artikelen 56 tweede lid][ref1], [75 eerste lid][ref2] en [186 eerste lid van Boek 2][ref3] zijn niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel186
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel528
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '75'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '186'
  - number: '530.1'
    text: |-
      Onder de overeenkomst (rompbevrachting), waarbij de ene partij (de rompvervrachter) zich verbindt een schip
      uitsluitend ter zee terbeschikking te stellen van haar wederpartij (de rompbevrachter) zonder daarover nog enige
      zeggenschap te houden, ligt de exploitatie van het schip in handen van de rompbevrachter en geschiedt zij voor
      diens rekening.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel530
  - number: '530.2'
    text: |-
      [ Artikel 375][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel375
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel530
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '375'
        hoofdstuk: II
        afdeling: '2'
  - number: '531.1'
    text: |-
      Op de overeenkomst, waarbij de ene partij zich verbindt een schip, anders dan bij wijze van rompbevrachting,
      uitsluitend ter zee terbeschikking te stellen van de andere partij voor andere doeleinden dan het daarmee vervoeren
      van zaken of personen zijn de bepalingen nopens avarij-grosse alsmede de bepalingen van deze titel en, indien het
      een binnenschip betreft, [artikel 880][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel880
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel531
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '880'
        hoofdstuk: III
        afdeling: '1'
  - number: '531.2'
    text: |-
      Partijen hebben de vrijheid af te wijken van in het eerste lid op hun onderlinge verhouding toepasselijk verklaarde
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel531
  - number: '532'
    text: |-
      Voor de toepassing van de bepalingen van deze afdeling wordt ter beschikkingstelling van een en eenzelfde schip ter
      zee en op binnenwateren beschouwd als terbeschikkingstelling ter zee, tenzij deze terbeschikkingstelling ter zee
      kennelijk ondergeschikt is aan die op binnenwateren, in welk geval zij als terbeschikkingstelling op binnenwateren
      wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel532
  - number: '540'
    text: Aanvaring is de aanraking van schepen met elkaar.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel540
  - number: '541'
    text: |-
      Onder voorbehoud van de [Wet aansprakelijkheid olietankschepen][ref1] vindt het in deze afdeling omtrent aanvaring
      bepaalde eveneens toepassing indien schade door een zeeschip is veroorzaakt zonder dat een aanvaring plaats had.


      [ref1]: https://wetten.overheid.nl/BWBR0002976
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel541
    references:
      - id: ref1
        bwb_id: BWBR0002976
  - number: '542'
    text: |-
      Indien een zeeschip door een aanvaring schade heeft veroorzaakt, dan wel aan een zeeschip, deszelfs opvarenden
      of de zaken aan boord daarvan door een schip schade is veroorzaakt, wordt de aansprakelijkheid voor deze schade
      geregeld door deze afdeling.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel542
  - number: '543'
    text: |-
      Indien de aanvaring is veroorzaakt door toeval, indien zij is toe te schrijven aan overmacht of indien twijfel
      bestaat omtrent de oorzaken der aanvaring, wordt de schade gedragen door hen, die haar hebben geleden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel543
  - number: '544'
    text: |-
      Indien de aanvaring is veroorzaakt door de schuld van één schip, is de eigenaar van het schip, dat de schuld had,
      verplicht de schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel544
  - number: '545.1'
    text: |-
      Indien twee of meer schepen gezamenlijk door hun schuld een aanvaring hebben veroorzaakt, zijn de eigenaren daarvan
      zonder hoofdelijkheid aansprakelijk voor de schade, toegebracht aan medeschuldige schepen en aan goederen, die zich
      aan boord daarvan bevinden, en hoofdelijk voor alle overige schade.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel545
  - number: '545.2'
    text: |-
      Is de aansprakelijkheid niet hoofdelijk, dan zijn de eigenaren van de schepen, die gezamenlijk door hun schuld de
      aanvaring hebben veroorzaakt, tegenover de benadeelden aansprakelijk in verhouding tot het gewicht van de schuld
      van hun schepen; indien echter de omstandigheden meebrengen, dat die verhouding niet kan worden vastgesteld of
      indien blijkt dat de schuld van deze schepen gelijkwaardig is wordt de aansprakelijkheid in gelijke delen verdeeld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel545
  - number: '545.3'
    text: |-
      Is de aansprakelijkheid hoofdelijk, dan moet elk der aansprakelijke eigenaren zijn door het tweede lid van dit
      artikel vastgestelde aandeel in de betaling aan de schuldeiser voor zijn rekening nemen. Onder voorbehoud van
      [artikel 364][ref1] en [artikel 880][ref2] heeft hij, die meer dan zijn aandeel heeft betaald, voor het overschot
      verhaal op zijn medeschuldenaren, die minder dan hun aandeel hebben betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel364
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel880
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel545
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '364'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '880'
        hoofdstuk: III
        afdeling: '1'
  - number: '546'
    text: |-
      Er bestaan geen wettelijke vermoedens van schuld met betrekking tot de aansprakelijkheid voor aanvaring; het schip,
      dat in aanraking komt met een andere, zo nodig behoorlijk verlichte, vaste of te bekwamer plaatse vastgemaakte
      zaak, geen schip zijnde, is aansprakelijk voor de schade, tenzij blijkt dat de aanraking niet is veroorzaakt door
      schuld van het schip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel546
  - number: '547'
    text: |-
      De krachtens deze afdeling bestaande aansprakelijkheid wordt niet opgeheven ingeval de aanvaring is veroorzaakt
      door de schuld van een loods, zelfs niet als het gebruik van deze verplicht is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel547
  - number: '550'
    text: Deze afdeling geldt slechts onder voorbehoud van de Astronautenovereenkomst (*Trb.* 1968, 134).
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel550
  - number: '551'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel551
  - number: 551.a
    text: |-
      hulpverlening: iedere daad of werkzaamheid, verricht om hulp te verlenen aan een in bevaarbaar water of in welk
      ander water dan ook in gevaar verkerend schip of andere zaak;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel551
  - number: 551.b
    text: 'schip: ieder schip of ander vaartuig, dan wel iedere constructie waarmee kan worden gevaren;'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel551
  - number: 551.c
    text: 'goederen: alle zaken die niet blijvend en opzettelijk aan de kust zijn bevestigd en de in risico zijnde vracht;'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel551
  - number: 551.d
    text: |-
      milieuschade: aanzienlijke fysieke schade aan de gezondheid van de mens, aan de marine fauna of flora of aan
      hulpbronnen in kust- of binnenwateren of daaraan grenzende gebieden, veroorzaakt door verontreiniging, besmetting,
      brand, ontploffing of soortgelijke ingrijpende gebeurtenissen;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel551
  - number: 551.e
    text: 'betaling: iedere krachtens deze afdeling verschuldigde beloning, vergoeding of schadeloosstelling.'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel551
  - number: '552'
    text: |-
      Voor de toepassing van deze afdeling worden de wateren genoemd in [artikel 21 van de Wet op de strandvonderij][ref1]
      beschouwd tot de zee, en de stranden en oevers daarvan tot het zeestrand te behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0001951#Artikel21
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel552
    references:
      - id: ref1
        bwb_id: BWBR0001951
        artikel: '21'
  - number: '553'
    text: 'Deze afdeling is niet van toepassing in geval van hulpverlening aan:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel553
  - number: 553.a
    text: |-
      vaste of drijvende platforms of verplaatsbare boorinstallaties wanneer die platforms of boorinstallaties op een
      lokatie in bedrijf zijn voor de exploratie, exploitatie of winning van minerale rijkdommen van de zeebodem;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel553
  - number: 553.b
    text: |-
      een maritiem cultuurgoed dat van prehistorisch, archeologisch of historisch belang is en zich ten minste vijftig
      jaar op de zeebodem bevindt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel553
  - number: '554'
    text: |-
      Deze afdeling is mede van toepassing in geval van hulpverlening door of aan een oorlogsschip of ander niet-
      handelsschip, dat toebehoort aan, dan wel gebruikt of bevracht wordt door de Staat der Nederlanden of enige andere
      Staat die het Internationaal Verdrag inzake Hulpverlening, 1989 (*Trb.* 1990, 109), op die schepen van toepassing
      heeft verklaard.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel554
  - number: '555'
    text: 'De bepalingen omtrent hulpverlening zijn van overeenkomstige toepassing in geval van hulpverlening:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel555
  - number: 555.a
    text: aan op het vaste zeestrand of de oevers van bevaarbaar binnenwater gezonken of aangespoelde zaken;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel555
  - number: 555.b
    text: door een schip aan een luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel555
  - number: '556.1'
    text: |-
      Een overeenkomst omtrent hulpverlening kan op verlangen van een der partijen door de rechter geheel of gedeeltelijk
      worden vernietigd of gewijzigd wanneer zij is tot stand gekomen door misbruik van omstandigheden of onder invloed
      van gevaar en de overeengekomen voorwaarden onbillijk zijn, of de overeengekomen betaling buitensporig hoog of laag
      is in verhouding tot de daadwerkelijk verleende diensten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel556
  - number: '556.2'
    text: Nietig is ieder beding waarbij van het bepaalde in het eerste lid wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel556
  - number: '557.1'
    text: |-
      Hulp aan in gevaar verkerende schepen, aan zich aan boord daarvan bevindende zaken of aan van een schip afkomstige
      driftige, aangespoelde of gezonken zaken mag niet worden verleend tegen een uitdrukkelijk en redelijk verbod van de
      reder of kapitein van het schip in. Hulp aan andere in gevaar verkerende zaken mag niet worden verleend tegen een
      uitdrukkelijk en redelijk verbod in van de rechthebbende op de zaak.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel557
  - number: '557.2'
    text: Een verbod tot hulpverlening kan steeds worden uitgevaardigd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel557
  - number: '558.1'
    text: |-
      Het verlenen van hulp aan een schip, aan zich aan boord daarvan bevindende zaken of aan van een schip afkomstige
      driftige, aangespoelde of gezonken zaken staat onder leiding van de kapitein en, wanneer er geen kapitein is of
      deze niet optreedt, onder leiding van de rechthebbende op het schip of de zaak.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel558
  - number: '558.2'
    text: |-
      Bij stranding of aanspoeling aan of op het vaste zeestrand berust de leiding, wanneer kapitein noch rechthebbende
      optreedt, bij de strandvonder.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel558
  - number: '558.3'
    text: |-
      Indien het noodzakelijk is onverwijld maatregelen te treffen, geldt het in dit artikel bepaalde niet, totdat de
      kapitein, de rechthebbende of de strandvonder de leiding op zich heeft genomen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel558
  - number: '559.1'
    text: |-
      Wanneer een schip door de bemanning is verlaten en door hulpverleners of de strandvonder is overgenomen, staat
      het de kapitein steeds vrij naar zijn schip terug te keren en het gezag daarover te hernemen, in welk geval de
      hulpverleners of de strandvonder terstond het gezag aan de kapitein moeten overdragen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel559
  - number: '559.2'
    text: |-
      Indien de kapitein of de rechthebbende bij de hulpverlening of ter plaatse, waar de geredde zaken worden
      aangebracht, tegenwoordig is en dit de hulpverlener of de strandvonder bekend is, moeten de hulpverleners of de
      strandvonder, onverminderd [artikel 571][ref1], die zaken terstond te zijner beschikking stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel571
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel559
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '571'
        hoofdstuk: II
        afdeling: '2'
  - number: '559.3'
    text: |-
      In de gevallen, waarin de geredde zaken niet op grond van het vorige lid terstond ter beschikking van de kapitein
      of van de rechthebbende moeten worden gesteld, moeten zij, voor zover zij tijdens de hulpverlening zich aan of op
      de buitengronden of het vaste zeestrand bevinden, terstond ter beschikking worden gesteld van de strandvonder.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel559
  - number: '560.1'
    text: |-
      De hulpverlener is jegens de reder van het schip of de rechthebbende op andere in gevaar verkerende zaken
      verplicht:
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel560
  - number: 560.1.a
    text: de hulpverlening met de nodige zorg uit te voeren;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel560
  - number: 560.1.b
    text: |-
      bij de nakoming van de in onderdeel *a* bedoelde verplichting de nodige zorg te betrachten om milieuschade te
      voorkomen of te beperken;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel560
  - number: 560.1.c
    text: |-
      in alle gevallen, waarin de omstandigheden dit redelijkerwijze vereisen, de bijstand in te roepen van andere
      hulpverleners; en
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel560
  - number: 560.1.d
    text: |-
      de tussenkomst van andere hulpverleners te aanvaarden, wanneer hierom redelijkerwijze wordt verzocht door de reder
      of de kapitein van het schip of de rechthebbende op andere in gevaar verkerende zaken, met dien verstande dat het
      bedrag van zijn beloning niet wordt verminderd, indien mocht blijken dat het verzoek onredelijk was.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel560
  - number: '560.2'
    text: |-
      De reder en de kapitein van het schip of de rechthebbende op andere in gevaar verkerende zaken zijn jegens de
      hulpverlener verplicht:
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel560
  - number: 560.2.a
    text: gedurende de hulpverlening volledig met hem samen te werken;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel560
  - number: 560.2.b
    text: daarbij de nodige zorg te betrachten om milieuschade te voorkomen of te beperken; en
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel560
  - number: 560.2.c
    text: |-
      wanneer het schip of de andere zaken in veiligheid zijn gebracht, teruggave daarvan te aanvaarden wanneer zulks
      redelijkerwijze door de hulpverlener wordt verzocht.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel560
  - number: '560.3'
    text: Nietig is ieder beding, waarbij van onderdeel *b* van het eerste of tweede lid wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel560
  - number: '561.1'
    text: Hulp die met gunstig gevolg is verleend geeft recht op hulploon.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel561
  - number: '561.2'
    text: |-
      Behoudens [artikel 564][ref1], is geen betaling krachtens deze afdeling verschuldigd, wanneer de hulp geen gunstig
      gevolg heeft gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel564
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel561
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '564'
        hoofdstuk: II
        afdeling: '2'
  - number: '561.3'
    text: |-
      Hulp als omschreven in het eerste lid geeft recht op hulploon, ook al is de tot hulploon gerechtigde of hij, die
      gerechtigd is de vaststelling van het hulploon te vorderen, dezelfde persoon als hij die hulploon verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel561
  - number: '562'
    text: |-
      Indien een partij bij een overeenkomst omtrent hulpverlening door haar wederpartij daarbij terzake van een bij de
      hulpverlening veroorzaakte schade buiten overeenkomst wordt aangesproken, is zij jegens die wederpartij niet verder
      aansprakelijk dan zij dit zou zijn op grond van de door hen gesloten overeenkomst. De [artikelen 365][ref1] en
      [366][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel365
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel366
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel562
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '365'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '366'
        hoofdstuk: II
        afdeling: '1'
  - number: '563.1'
    text: |-
      Het bedrag van het hulploon wordt vastgesteld bij overeenkomst tussen partijen en bij gebreke daarvan door de
      rechter.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel563
  - number: '563.2'
    text: |-
      Het hulploon wordt vastgesteld met het oog op het aanmoedigen van hulpverlening, rekening houdend met de volgende
      criteria ongeacht de volgorde waarin zij hieronder zijn opgesomd:
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel563
  - number: 563.2.a
    text: de geredde waarde van het schip en de andere goederen;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel563
  - number: 563.2.b
    text: |-
      de vakkundigheid en inspanningen van de hulpverleners, betoond bij het voorkomen of beperken van schade aan het
      milieu;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel563
  - number: 563.2.c
    text: de mate van de door de hulpverleners verkregen gunstige uitslag;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel563
  - number: 563.2.d
    text: de aard en ernst van het gevaar;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel563
  - number: 563.2.e
    text: |-
      de vakkundigheid en inspanningen betoond door de hulpverleners bij de redding van het schip, de andere zaken en
      mensenlevens;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel563
  - number: 563.2.f
    text: de door de hulpverleners gebruikte tijd, gemaakte kosten en geleden verliezen;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel563
  - number: 563.2.g
    text: het risico van aansprakelijkheid en andere door de hulpverleners of hun uitrusting gelopen risico's;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel563
  - number: 563.2.h
    text: de snelheid van de verleende diensten;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel563
  - number: 563.2.i
    text: de beschikbaarheid en het gebruik van schepen of andere voor hulpverlening bestemde uitrusting;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel563
  - number: 563.2.j
    text: de staat van gereedheid alsmede de doelmatigheid en de waarde van de uitrusting van de hulpverleners;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel563
  - number: '563.3'
    text: |-
      Voor hulp verleend aan een schip en de zaken aan boord daarvan is het hulploon uitsluitend verschuldigd door de
      reder van het schip, met dien verstande dat de reder een recht van verhaal heeft jegens de andere belanghebbenden
      voor hun onderscheiden aandeel. Voor hulp verleend aan andere zaken is het hulploon verschuldigd door de
      rechthebbende op die zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel563
  - number: '563.4'
    text: |-
      Het hulploon, met uitzondering van rente en verhaalbare gerechtelijke kosten, mag de geredde waarden van het schip
      en de andere goederen niet overtreffen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel563
  - number: '563.5'
    text: |-
      Wanneer het hulploon mede strekt tot vergoeding van gemaakte kosten en geleden schade geeft de rechter aan welke
      gemaakte kosten en geleden schade dit betreft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel563
  - number: '564.1'
    text: |-
      Indien een hulpverlener hulp heeft verleend aan een schip dat zelf of wegens zijn lading schade dreigde toe te
      brengen aan het milieu en hij geen hulploon heeft verkregen krachtens [artikel 563][ref1] dat ten minste gelijk is
      aan de volgens dit artikel vast te stellen bijzondere vergoeding, heeft hij recht op een bijzondere vergoeding van
      de zijde van de reder, gelijk aan de door hem gemaakte kosten zoals in dit artikel omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel563
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel564
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '563'
        hoofdstuk: II
        afdeling: '2'
  - number: '564.2'
    text: |-
      Indien de hulpverlener in de in het eerste lid bedoelde omstandigheden door zijn hulpverleningswerkzaamheden schade
      aan het milieu heeft voorkomen of heeft beperkt, kan de door de reder volgens het eerste lid aan de hulpverlener te
      betalen bijzondere vergoeding worden verhoogd met maximaal 30% van de door de hulpverlener gemaakte kosten. Indien
      echter de rechter, rekening houdend met de in het tweede lid van [artikel 563][ref1] genoemde criteria, zulks
      billijk en rechtvaardig acht, kan hij die bijzondere vergoeding verder verhogen, maar de totale verhoging mag in
      geen geval meer bedragen dan 100% van de door de hulpverlener gemaakte kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel563
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel564
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '563'
        hoofdstuk: II
        afdeling: '2'
  - number: '564.3'
    text: |-
      Voor de toepassing van het eerste en tweede lid worden onder kosten van de hulpverlener verstaan de voorschotten
      die door de hulpverlener redelijkerwijze zijn gedaan bij de hulpverlening en een billijk tarief voor uitrusting
      en personeel die daadwerkelijk en redelijkerwijze zijn ingezet tijdens de hulpverlening, in aanmerking nemend de
      criteria genoemd in [artikel 563, tweede lid, onderdelen h, i en j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel563
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel564
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '563'
        hoofdstuk: II
        afdeling: '2'
  - number: '564.4'
    text: |-
      De totale bijzondere vergoeding krachtens dit artikel wordt slechts betaald indien en voor zover deze vergoeding
      hoger is dan het hulploon dat de hulpverlener krachtens [artikel 563][ref1] kan ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel563
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel564
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '563'
        hoofdstuk: II
        afdeling: '2'
  - number: '564.5'
    text: |-
      Indien de hulpverlener nalatig is geweest en daardoor in gebreke is gebleven schade aan het milieu te voorkomen
      of te beperken, kan de rechter de krachtens dit artikel verschuldigde bijzondere vergoeding geheel of gedeeltelijk
      ontzeggen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel564
  - number: '564.6'
    text: |-
      De rechter die een hulploon vaststelt als bedoeld in [artikel 563][ref1] en een bijzondere vergoeding bepaalt als
      bedoeld in het eerste lid, is niet verplicht om het bedrag van het hulploon vast te stellen tot het beloop van
      de maximale waarde van het schip en de andere geredde goederen alvorens het bedrag van de bijzondere vergoeding
      te bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel563
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel564
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '563'
        hoofdstuk: II
        afdeling: '2'
  - number: '564.7'
    text: Geen bepaling van dit artikel doet afbreuk aan enig recht van verhaal van de reder van het schip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel564
  - number: '565.1'
    text: Geen hulploon is verschuldigd door personen wier leven is gered.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel565
  - number: '565.2'
    text: |-
      Niettegenstaande het in lid 1 bepaalde is voor de afzonderlijke redding van opvarenden van een schip hulploon
      verschuldigd door de reder.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel565
  - number: '565.3'
    text: |-
      Degene die mensenlevens heeft gered en heeft deelgenomen aan de werkzaamheden die zijn verricht ter gelegenheid
      van het ongeval dat aanleiding heeft gegeven tot de hulpverlening, is gerechtigd tot een billijk aandeel in de
      betaling die aan de hulpverlener is toegekend voor de redding van het schip of andere zaken of voor het voorkomen
      of beperken van schade aan het milieu.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel565
  - number: '566.1'
    text: Gerechtigd tot hulploon zijn die personen of groepen van personen, die hulp hebben verleend.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel566
  - number: '566.2'
    text: |-
      Indien de hulp is verleend door personen of groepen, die afhankelijk van elkaar handelden, is aan deze groepen of
      personen gezamenlijk slechts één bedrag als hulploon verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel566
  - number: '566.3'
    text: |-
      Indien de hulp door een schip is verleend kunnen ook de leden der bemanning, die geen hulp verleenden, tot hulploon
      gerechtigd zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel566
  - number: '567'
    text: |-
      Afstand, jegens wie dan ook, door een lid der bemanning van zijn recht op een aandeel in het door een schip te
      verdienen of verdiende hulploon is nietig, tenzij het schip blijkens zijn constructie uitsluitend of in hoofdzaak
      voor hulpverlening of sleepdienst is bestemd of de afstand één bepaalde hulpverlening betreft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel567
  - number: '568.1'
    text: |-
      Geen recht op betaling krachtens deze afdeling hebben zij, die hulp verleenden niettegenstaande een uitdrukkelijk
      en redelijk verbod als bedoeld in [artikel 557, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel557
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel568
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '557'
        hoofdstuk: II
        afdeling: '2'
  - number: '568.2'
    text: |-
      Opvarenden kunnen wegens hulp door hen verleend aan het schip, zich aan boord daarvan bevindende zaken of daarvan
      afkomstige driftige, aangespoelde of gezonken zaken, slechts recht op betaling hebben, wanneer door hen diensten
      zijn bewezen, waartoe zij redelijkerwijs niet zijn gehouden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel568
  - number: '568.3'
    text: |-
      Geen betaling is verschuldigd krachtens deze afdeling tenzij de verleende diensten verder gaan dan wat
      redelijkerwijs kan worden aangemerkt als een gebruikelijke uitvoering van een overeenkomst die was gesloten voordat
      het gevaar ontstond.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel568
  - number: '568.4'
    text: |-
      Indien de hulpverleners door hun schuld de hulpverlening hebben nodig gemaakt of bemoeilijkt of zich hebben
      schuldig gemaakt aan diefstal, verberging of andere bedriegelijke handelingen, kan de rechter de krachtens deze
      afdeling verschuldigde betaling geheel of gedeeltelijk ontzeggen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel568
  - number: '569.1'
    text: |-
      Indien de hulp is verleend door onafhankelijk van elkaar handelende personen of groepen van personen is ieder dezer
      personen bevoegd vaststelling te vorderen van het hulploon of de bijzondere vergoeding die hem of de groep, waarvan
      hij deel uitmaakte, toekomt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel569
  - number: '569.2'
    text: |-
      Indien de hulp is verleend door afhankelijk van elkaar handelende personen of groepen van personen is ieder dezer
      personen bevoegd vaststelling te vorderen van het hulploon of de bijzondere vergoeding die aan deze personen of
      groepen gezamenlijk toekomt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel569
  - number: '569.3'
    text: |-
      Indien door een schip hulp is verleend, is uitsluitend de reder of de kapitein bevoegd omtrent het hulploon of
      de bijzondere vergoeding overeen te komen. De door hem gesloten overeenkomst bindt alle tot het hulploon of de
      bijzondere vergoeding gerechtigden. Hij is verplicht ieder van hen vóór de uitbetaling desverlangd het bedrag
      van het hulploon of de bijzondere vergoeding schriftelijk mede te delen. Bij gebreke van een overeenkomst is
      uitsluitend hij, niet alleen gerechtigd, doch ook verplicht gerechtelijke vaststelling van het hulploon of de
      bijzondere vergoeding te vorderen en dit te innen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel569
  - number: '569.4'
    text: |-
      In het in [artikel 561, derde lid][ref1], bedoelde geval is iedere tot hulploon of bijzondere vergoeding
      gerechtigde bevoegd de vaststelling daarvan door de rechter te vorderen, ook al mocht over het hulploon of de
      bijzondere vergoeding een overeenkomst zijn gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel561
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel569
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '561'
        hoofdstuk: II
        afdeling: '2'
  - number: '570.1'
    text: |-
      De verdeling van een hulploon als bedoeld in [artikel 563][ref1] tussen hulpverleners geschiedt volgens de in dat
      artikel genoemde criteria.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel563
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel570
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '563'
        hoofdstuk: II
        afdeling: '2'
  - number: '570.2'
    text: |-
      De verdeling van een bijzondere vergoeding als bedoeld in [artikel 564][ref1] tussen hulpverleners geschiedt met in
      aanmerkingneming van de criteria genoemd in [artikel 563, tweede lid, onderdelen h, i en j][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel564
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel563
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel570
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '564'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '563'
        hoofdstuk: II
        afdeling: '2'
  - number: '570.3'
    text: |-
      Bij geschillen omtrent de verdeling van het hulploon en de bijzondere vergoeding tussen de daartoe gerechtigden
      wordt deze op vordering van de meest gerede partij door de rechter vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel570
  - number: '571.1'
    text: |-
      Hij, die gerechtigd is vaststelling van het hulploon te vorderen, heeft – behoudens
      [artikel 559, eerste en derde lid][ref1] – jegens ieder, die daarvan afgifte verlangt, een retentierecht op de
      schepen of zaken, waaraan hulp is verleend, alsmede op de schepen aan welker zich aan boord bevindende zaken hulp
      is verleend, voor hetgeen ter zake van hulploon is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel559
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel571
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '559'
        hoofdstuk: II
        afdeling: '2'
  - number: '571.2'
    text: |-
      Ter zake van de in [artikel 564][ref1] bedoelde bijzondere vergoeding kan dit retentierecht worden uitgeoefend op
      de schepen, waaraan hulp is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel564
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel571
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '564'
        hoofdstuk: II
        afdeling: '2'
  - number: '571.3'
    text: |-
      Dit retentierecht vervalt zodra is betaald het bedrag, waarover geen geschil tussen partijen bestaat, en voldoende
      zekerheid is gesteld voor de betaling van die bedragen, waaromtrent wel geschil bestaat of welker hoogte nog niet
      kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel571
  - number: '572.1'
    text: |-
      Degene die krachtens deze afdeling een betaling verschuldigd is, moet op verlangen van de hulpverlener voldoende
      zekerheid stellen voor hetgeen hij terzake van die betaling verschuldigd is, met inbegrip van rente en kosten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel572
  - number: '572.2'
    text: |-
      Het schip en de andere zaken waaraan de hulp is verleend mogen niet zonder toestemming van de hulpverlener worden
      verwijderd van de eerste haven of plaats waar zij na beëindiging van de hulpverlening zijn aangekomen, totdat
      voldoende zekerheid is gesteld voor de in het eerste lid bedoelde betaling.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel572
  - number: '573.1'
    text: |-
      De rechter kan, voordat hij het hulploon of de bijzondere vergoeding vaststelt, bevelen dat aan degene die
      gerechtigd is de vaststelling daarvan te vorderen, een naar billijkheid te bepalen bedrag bij wijze van voorschot
      wordt betaald. De rechter kan aan dit bevel voorwaarden verbinden die gezien de omstandigheden billijk zijn,
      daaronder begrepen de voorwaarde dat voor de gehele of gedeeltelijke terugbetaling van het voorschot zekerheid zal
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel573
  - number: '573.2'
    text: |-
      Is krachtens [artikel 572][ref1] zekerheid gesteld, dan wordt het bedrag van de gestelde zekerheid verminderd met
      het bedrag van het betaalde voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel572
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel573
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '572'
        hoofdstuk: II
        afdeling: '2'
  - number: '574.1'
    text: |-
      Indien de rechthebbende op de schepen of andere zaken waaraan hulp is verleend, niet opkomt, is hij, die
      vaststelling van het hulploon of de bijzondere vergoeding kan vorderen, gerechtigd deze voor rekening en gevaar van
      de rechthebbende onder zich te houden dan wel bij een derde op te slaan in een daarvoor geschikte bewaarplaats.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel574
  - number: '574.2'
    text: |-
      De derde-bewaarnemer en de rechthebbende zijn jegens elkaar verbonden, als ware de omtrent de bewaring gesloten
      overeenkomst mede tussen hen aangegaan. De bewaarnemer is echter niet gerechtigd tot afgifte dan na schriftelijke
      toestemming daartoe van hem, die de zaken in bewaring gaf.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel574
  - number: '575.1'
    text: |-
      In geval van toepassing van [artikel 574][ref1] kan hij, die gerechtigd is vaststelling van het hulploon of de
      bijzondere vergoeding te vorderen, de bewaarnemer dan wel de rechthebbende op de schepen of zaken, op zijn verzoek
      door de rechter worden gemachtigd hen geheel of gedeeltelijk op de door deze te bepalen wijze te verkopen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel574
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel575
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '574'
        hoofdstuk: II
        afdeling: '2'
  - number: '575.2'
    text: |-
      De bewaarnemer is verplicht degeen, die de zaken in bewaring gaf, zo spoedig mogelijk van de voorgenomen verkoop
      op de hoogte te stellen; degeen die de zaken in bewaring gaf of onder zich hield, heeft deze verplichting jegens de
      hem bekende rechthebbenden op de zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel575
  - number: '575.3'
    text: |-
      De opbrengst van het verkochte wordt in de consignatiekas gestort, voor zover zij niet strekt tot voldoening van
      de kosten van opslag en verkoop alsmede, binnen de grenzen der redelijkheid, van de gemaakte kosten. Tenzij op de
      zaken beslag is gelegd voor een geldvordering, moet aan degeen, die de zaken in bewaring gaf, uit het in bewaring
      te stellen bedrag worden voldaan hetgeen hem terzake van hulploon of bijzondere vergoeding is verschuldigd; voor
      zover het hulploon of de bijzondere vergoeding nog niet vaststaat, zal de opbrengst of een gedeelte daarvan op door
      de rechter te bepalen wijze tot zekerheid voor deze vordering strekken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel575
  - number: '575.4'
    text: De in de consignatiekas gestorte opbrengst treedt in de plaats van de zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel575
  - number: '576.1'
    text: |-
      Hij, die gerechtigd is tot hulploon of bijzondere vergoeding, verkrijgt de eigendom van de zaak, waaraan hulp is
      verleend en waarvoor geen rechthebbende is opgekomen, twee jaren na de beëindiging van de hulpverlening, mits de
      zaak zich op dat tijdstip nog in zijn macht bevindt en hij datgene heeft gedaan wat redelijkerwijs van hem kan
      worden gevergd om de rechthebbende te ontdekken en van het gevolg van de hulpverlening op de hoogte te stellen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel576
  - number: '576.2'
    text: |-
      Het eerste lid vindt geen toepassing, wanneer de rechthebbende zich binnen de in dat lid genoemde termijn bij hem,
      die vaststelling van het hulploon of de bijzondere vergoeding kan vorderen, heeft aangemeld en aan deze de kosten
      van bewaring en onderhoud en tot opsporing van de rechthebbende heeft vergoed. Degeen die vaststelling van het
      hulploon of de bijzondere vergoeding kan vorderen is bevoegd de afgifte op te schorten totdat deze verplichting is
      nagekomen. Indien de rechthebbende die de zaak opeist, de verschuldigde kosten niet binnen een maand nadat ze hem
      zijn opgegeven, heeft voldaan, wordt hij aangemerkt zijn recht op de zaak te hebben prijsgegeven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel576
  - number: '577'
    text: De wetsbepalingen omtrent zaakwaarneming vinden op hulpverlening geen toepassing.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel577
  - number: '610'
    text: |-
      Er is een avarij-grosse handeling, wanneer - en alleen wanneer - enige buitengewone opoffering of uitgave
      opzettelijk en redelijkerwijs wordt verricht of gedaan voor de gemeenschappelijke veiligheid met het doel de
      goederen, betrokken bij een gemeenschappelijke met een zeeschip uitgevoerde onderneming, voor gevaar - hoe of door
      wiens toedoen dit ook zij ontstaan - te behoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel610
  - number: '611'
    text: |-
      Alleen zodanige verliezen, schaden of onkosten, die het onmiddellijke gevolg zijn van een avarij-grosse handeling,
      worden als avarij-grosse toegelaten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel611
  - number: '612.1'
    text: |-
      Avarij-grosse wordt aan hem, die haar leed, vergoed door de reder, de belanghebbende bij verschuldigde vracht
      of passagegeld, de ontvanger van de lading en de eigenaren van de overige zich aan boord bevindende zaken, met
      uitzondering van brieven, andere poststukken of postpakketten, van bagage en van persoonlijke zaken van opvarenden
      die geen bagage zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel612
  - number: '612.2'
    text: |-
      In afwijking van het eerste lid draagt een motorrijtuig of schip, dat door een vervoerder in verband met een
      overeenkomst van personenvervoer aan boord van het schip wordt vervoerd, bij in de avarij-grosse.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel612
  - number: '613'
    text: |-
      De vergoedingen in avarij-grosse en de dragende waarden der in de avarij-grosse bijdragende belangen worden
      bovendien bepaald met inachtneming van de York-Antwerp Rules, nader omschreven bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel613
  - number: '620'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel620
  - number: 620.a
    text: |-
      *"gevaarlijke stof"*: een stof die als zodanig bij algemene maatregel van bestuur is aangewezen; de aanwijzing
      kan worden beperkt tot bepaalde concentraties van de stof, tot bepaalde in de algemene maatregel van bestuur te
      omschrijven gevaren die aan de stof verbonden zijn, en tot bepaalde daarin te omschrijven situaties waarin de stof
      zich bevindt;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel620
  - number: 620.b
    text: '"*schip"*: zeeschip, niet zijnde een luchtkussenvoertuig;'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel620
  - number: 620.c
    text: '*"schade"*:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel620
  - number: 620.c.1°
    text: schade veroorzaakt door dood of letsel van enige persoon veroorzaakt door een gevaarlijke stof;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel620
  - number: 620.c.2°
    text: |-
      andere schade buiten het schip aan boord waarvan de gevaarlijke stof zich bevindt, veroorzaakt door die gevaarlijke
      stof, met uitzondering van verlies van of schade met betrekking tot andere schepen of binnenschepen en zaken
      aan boord daarvan, indien die schepen of binnenschepen deel uitmaken van een sleep, waarvan ook dit schip deel
      uitmaakt, of hecht met dit schip in een eenheid zijn gekoppeld;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel620
  - number: 620.c.3°
    text: de kosten van preventieve maatregelen en verlies of schade veroorzaakt door zulke maatregelen;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel620
  - number: 620.d
    text: |-
      *"preventieve maatregel"*: iedere redelijke maatregel ter voorkoming of beperking van schade door wie dan ook
      genomen met uitzondering van de overeenkomstig deze afdeling aansprakelijke persoon nadat een gebeurtenis heeft
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel620
  - number: 620.e
    text: |-
      *"gebeurtenis"*: elk feit of elke opeenvolging van feiten met dezelfde oorzaak, waardoor schade ontstaat of
      waardoor een ernstige en onmiddellijke dreiging van schade ontstaat;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel620
  - number: 620.f
    text: |-
      *"reder"*: de persoon die in een register waarin het schip te boek staat, als eigenaar van het schip is
      ingeschreven, of, bij gebreke van enige teboekstelling, de persoon die het schip in eigendom heeft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel620
  - number: '621.1'
    text: |-
      Deze afdeling is niet van toepassing, indien de reder jegens degene die de vordering instelt, aansprakelijk is uit
      hoofde van een exploitatie-overeenkomst of jegens deze persoon een beroep op een exploitatie-overeenkomst heeft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel621
  - number: '621.2'
    text: |-
      Deze afdeling is van toepassing op de periode waarin een gevaarlijke stof zich aan boord van een schip bevindt,
      daaronder begrepen de periode vanaf het begin van de inlading van de gevaarlijke stof in het schip tot het einde
      van de lossing van die stof uit het schip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel621
  - number: '621.3'
    text: |-
      Deze afdeling is niet van toepassing op schade veroorzaakt wanneer het schip uitsluitend wordt gebruikt in een
      niet voor publiek toegankelijk gebied en zulk gebruik een onderdeel vormt van een in dat gebied plaatsvindende
      bedrijfsuitoefening.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel621
  - number: '621.4'
    text: |-
      Op zich overeenkomstig het tweede lid aan boord bevindende stoffen als bedoeld in artikel 175 van Boek 6 is dat
      artikel niet van toepassing, tenzij zich het geval van het derde lid voordoet.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel621
  - number: '622.1'
    text: |-
      Indien een gevaarlijke stof zich bevindt in een vervoermiddel dat zich aan boord van een schip bevindt zonder
      dat de gevaarlijke stof uit dit gestapelde vervoermiddel wordt gelost, zal de gevaarlijke stof voor die periode
      geacht worden zich alleen aan boord van dat schip te bevinden. In afwijking van het in de vorige zin bepaalde zal,
      gedurende de handelingen bedoeld in [artikel 623, vijfde lid, onderdelen c, d en e][ref1], de gevaarlijke stof
      geacht worden zich alleen aan boord van het gestapelde vervoermiddel te bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel623
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel622
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '623'
        hoofdstuk: II
        afdeling: '4'
  - number: '622.2'
    text: |-
      Indien een gevaarlijke stof zich bevindt in een schip dat wordt gesleept door een ander schip of door een
      binnenschip of wordt voortbewogen door een ander schip of door een binnenschip, dat hecht met dit schip in een
      eenheid gekoppeld is, zal de gevaarlijke stof geacht worden zich alleen aan boord van eerstgenoemd schip te
      bevinden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel622
  - number: '623.1'
    text: |-
      Hij die ten tijde van een gebeurtenis reder is van een schip aan boord waarvan zich een gevaarlijke stof bevindt,
      is aansprakelijk voor de schade door die stof veroorzaakt ten gevolge van die gebeurtenis. Bestaat de gebeurtenis
      uit een opeenvolging van feiten met dezelfde oorzaak, dan rust de aansprakelijkheid op degene die ten tijde van het
      eerste feit reder was.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel623
  - number: '623.2'
    text: 'De reder is niet aansprakelijk indien:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel623
  - number: 623.2.a
    text: |-
      de schade is veroorzaakt door een oorlogshandeling, vijandelijkheden, burgeroorlog, opstand of natuurgebeuren van
      uitzonderlijke, onvermijdelijke en onweerstaanbare aard;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel623
  - number: 623.2.b
    text: |-
      de schade uitsluitend is veroorzaakt door een handelen of nalaten van een derde, niet zijnde een persoon genoemd in
      het vijfde lid, onderdeel *a*, geschied met het opzet de schade te veroorzaken;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel623
  - number: 623.2.c
    text: |-
      de afzender of enige andere persoon niet heeft voldaan aan zijn verplichting hem in te lichten over de gevaarlijke
      aard van de stof, en noch de reder noch de in het vijfde lid, onderdeel *a*, genoemde personen wisten of hadden
      behoren te weten dat deze gevaarlijk was.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel623
  - number: '623.3'
    text: |-
      Indien de reder bewijst dat de schade geheel of gedeeltelijk het gevolg is van een handelen of nalaten van de
      persoon die de schade heeft geleden, met het opzet de schade te veroorzaken, of van de schuld van die persoon, kan
      hij geheel of gedeeltelijk worden ontheven van zijn aansprakelijkheid tegenover die persoon.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel623
  - number: '623.4'
    text: |-
      De reder kan voor schade slechts uit anderen hoofde dan deze afdeling worden aangesproken in het geval van het
      tweede lid, onderdeel *c*, alsmede in het geval dat hij uit hoofde van arbeidsovereenkomst kan worden aangesproken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel623
  - number: '623.5'
    text: |-
      Behoudens de [artikelen 624][ref1] en [625][ref2] zijn voor schade niet aansprakelijk:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel624
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel625
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel623
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '624'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '625'
        hoofdstuk: II
        afdeling: '4'
  - number: 623.5.a
    text: de ondergeschikten, vertegenwoordigers of lasthebbers van de reder of de leden van de bemanning,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel623
  - number: 623.5.b
    text: de loods en ieder ander die, zonder bemanningslid te zijn, ten behoeve van het schip werkzaamheden verricht,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel623
  - number: 623.5.c
    text: |-
      zij die anders dan tegen een uitdrukkelijk en redelijk verbod vanwege het schip in hulp verlenen aan het schip, de
      zich aan boord daarvan bevindende zaken of de opvarenden,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel623
  - number: 623.5.d
    text: |-
      zij die op aanwijzing van een bevoegde overheidsinstantie hulp verlenen aan het schip, de zich aan boord daarvan
      bevindende zaken of de opvarenden,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel623
  - number: 623.5.e
    text: zij die preventieve maatregelen nemen met uitzondering van de reder,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel623
  - number: 623.5.f
    text: |-
      de ondergeschikten, vertegenwoordigers of lasthebbers van de in dit lid, onderdelen *b, c, d* en *e*, van
      aansprakelijkheid vrijgestelde personen, tenzij de schade is ontstaan uit hun eigen handelen of nalaten,
      geschied hetzij met het opzet die schade te veroorzaken, hetzij roekeloos en met de wetenschap dat die schade er
      waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel623
  - number: '623.6'
    text: |-
      De reder heeft, voor zover niet anders is overeengekomen, verhaal op de in het vijfde lid bedoelde personen, doch
      uitsluitend indien dezen ingevolge het slot van dit lid voor de schade kunnen worden aangesproken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel623
  - number: '624.1'
    text: |-
      Indien de reder bewijst dat de gevaarlijke stof tijdens de periode bedoeld in [artikel 621, tweede lid][ref1],
      is geladen of gelost onder de uitsluitende verantwoordelijkheid van een door hem bij name genoemde ander dan de
      reder of zijn ondergeschikte, vertegenwoordiger of lasthebber, zoals de afzender of ontvanger, is de reder niet
      aansprakelijk voor de schade als gevolg van een gebeurtenis tijdens het laden of lossen van de gevaarlijke stof en
      is die ander voor deze schade aansprakelijk overeenkomstig deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel621
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel624
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '621'
        hoofdstuk: II
        afdeling: '4'
  - number: '624.2'
    text: |-
      Indien echter de gevaarlijke stof tijdens de periode bedoeld in [artikel 621, tweede lid][ref1], is geladen of
      gelost onder de gezamenlijke verantwoordelijkheid van de reder en een door de reder bij name genoemde ander, zijn
      de reder en die ander hoofdelijk aansprakelijk overeenkomstig deze afdeling voor de schade als gevolg van een
      gebeurtenis tijdens het laden of lossen van de gevaarlijke stof.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel621
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel624
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '621'
        hoofdstuk: II
        afdeling: '4'
  - number: '624.3'
    text: |-
      Indien is geladen of gelost door een persoon in opdracht of ten behoeve van de vervoerder of een ander, zoals de
      afzender of de ontvanger, is niet deze persoon, maar de vervoerder of die ander aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel624
  - number: '624.4'
    text: |-
      Indien een ander dan de reder op grond van het eerste of het tweede lid aansprakelijk is, kan die ander geen beroep
      doen op [artikel 623, vierde lid en vijfde lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel623
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel624
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '623'
        hoofdstuk: II
        afdeling: '4'
  - number: '624.5'
    text: |-
      Indien een ander dan de reder op grond van het eerste of het tweede lid
      aansprakelijk is, zijn ten aanzien van die ander [titel 7][ref1] alsmede de
      [artikelen 642a tot en met 642z van het Wetboek van Burgerlijke Rechtsvordering][ref2] van overeenkomstige
      toepassing, met dien verstande dat in geval van hoofdelijke aansprakelijkheid:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel642a
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel624
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 642a
  - number: 624.5.a
    text: |-
      de beperking van aansprakelijkheid krachtens [titel 7 van het Wetboek van Koophandel][ref1] geldt voor het geheel
      der naar aanleiding van eenzelfde gebeurtenis ontstane vorderingen gericht tegen beiden;


      [ref1]: https://wetten.overheid.nl/BWBR0001838
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel624
    references:
      - id: ref1
        bwb_id: BWBR0001838
  - number: 624.5.b
    text: |-
      een fonds gevormd door één van hen overeenkomstig
      [artikel 642c van het Wetboek van Burgerlijke Rechtsvordering][ref1] wordt aangemerkt als door beiden te zijn
      gevormd en zulks ten aanzien van de vorderingen waarvoor het fonds werd gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642c
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel624
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642c
  - number: '624.6'
    text: |-
      In de onderlinge verhouding tussen de reder en de in het tweede lid van dit artikel genoemde ander is de reder
      niet tot vergoeding verplicht dan in geval van schuld van hemzelf of van zijn ondergeschikten, vertegenwoordigers
      of lasthebbers.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel624
  - number: '624.7'
    text: |-
      Dit artikel is niet van toepassing als tijdens de periode, bedoeld in [artikel 621, tweede lid][ref1], is
      geladen of gelost onder de uitsluitende of gezamenlijke verantwoordelijkheid van een persoon, genoemd in
      [artikel 623, vijfde lid, onderdeel c, d of e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel621
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel623
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel624
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '621'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '623'
        hoofdstuk: II
        afdeling: '4'
  - number: '625'
    text: |-
      Indien ingevolge [artikel 623, tweede lid, onderdeel c][ref1], de reder niet aansprakelijk is, is de afzender
      of andere persoon aansprakelijk overeenkomstig deze afdeling en zijn te diens aanzien [titel 7][ref2] alsmede
      de [artikelen 642a tot en met 642z van het Wetboek van Burgerlijke Rechtsvordering][ref3] van overeenkomstige
      toepassing. De afzender of andere persoon kan geen beroep doen op [artikel 623, vierde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel623
      [ref2]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel642a
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel623
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel625
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '623'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 642a
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '623'
        hoofdstuk: II
        afdeling: '4'
  - number: '626'
    text: |-
      Indien schade veroorzaakt door de gevaarlijke stof redelijkerwijs niet kan worden gescheiden van schade anderszins
      veroorzaakt, zal de gehele schade worden aangemerkt als schade in de zin van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel626
  - number: '627.1'
    text: |-
      Wanneer door een gebeurtenis schade is veroorzaakt door gevaarlijke stoffen aan boord van meer dan één schip,
      dan wel aan boord van een schip en een binnenschip of een luchtkussenvoertuig, zijn de reders en de eigenaar
      of exploitant van de daarbij betrokken schepen, het binnenschip of het luchtkussenvoertuig, onverminderd
      het in [artikel 623, tweede en derde lid][ref1], en [artikel 624][ref2], [afdeling 4 van titel 11][ref3] en
      [afdeling 1 van titel 14][ref4] bepaalde, hoofdelijk aansprakelijk voor alle schade waarvan redelijkerwijs niet
      kan worden aangenomen dat zij veroorzaakt is door gevaarlijke stoffen aan boord van één of meer bepaalde schepen,
      binnenschip of luchtkussenvoertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel623
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel624
      [ref3]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel627
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '623'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '624'
        hoofdstuk: II
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005034
        hoofdstuk: III
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005034
        hoofdstuk: IV
        afdeling: '1'
  - number: '627.2'
    text: |-
      Het bepaalde in het eerste lid laat onverlet het beroep op beperking van aansprakelijkheid van de reder, eigenaar
      of exploitant krachtens [titel 7][ref1] of [titel 12][ref2], dan wel de [artikelen 1218 tot en met 1220][ref3],
      ieder tot het voor hem geldende bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1218
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel627
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005034
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1218'
        hoofdstuk: IV
        afdeling: '1'
  - number: '750.1'
    text: |-
      De reder van een schip en de hulpverlener kunnen door het stellen van één of meer fondsen als bedoeld in
      [artikel 642][ref1] hun aansprakelijkheid beperken voor de in [artikel 752][ref2] genoemde vorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642c
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel752
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel750
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642c
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '752'
        hoofdstuk: II
  - number: '750.2'
    text: |-
      Onder reder worden in deze titel mede verstaan de bevrachter, de huurder of andere gebruiker van een schip met
      inbegrip van degene in wiens handen de exploitatie van een schip is gelegd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel750
  - number: '750.3'
    text: |-
      Onder hulpverlener wordt in deze titel een ieder verstaan die werkzaamheden verricht in onmiddellijk verband met
      hulpverlening, waaronder in deze titel mede worden verstaan de in [artikel 752, eerste lid, onder d, e en f][ref1],
      genoemde werkzaamheden of maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel752
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel750
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '752'
        hoofdstuk: II
  - number: '750.4'
    text: |-
      Onder schip wordt in deze titel zeeschip verstaan. Een schip in aanbouw wordt voor de toepassing van deze titel
      mede als schip aangemerkt van het ogenblik af, dat de stapelloop aanvangt. Een luchtkussenvoertuig wordt voor de
      toepassing van deze titel niet als schip aangemerkt. Een platform dat is gebouwd ter exploratie of exploitatie van
      de natuurlijke rijkdommen van de zeebodem of van de ondergrond daarvan en dat kan drijven, wordt voor de toepassing
      van deze titel niet als schip aangemerkt gedurende de tijd dat het op de zeebodem rust.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel750
  - number: '751.1'
    text: |-
      Indien een vordering als genoemd in [artikel 752][ref1] wordt gericht tegen enige persoon voor wiens handeling,
      onachtzaamheid of nalatigheid de reder of de hulpverlener in beginsel aansprakelijk is, heeft deze persoon de in
      deze titel verleende bevoegdheid tot beperking van zijn aansprakelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel752
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel751
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '752'
        hoofdstuk: II
  - number: '751.2'
    text: |-
      De verzekeraar van de aansprakelijkheid voor vorderingen, waarvoor op grond van deze titel beperking van
      aansprakelijkheid mogelijk is, kan zich in dezelfde mate als zijn verzekerde op die beperking beroepen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel751
  - number: '752.1'
    text: |-
      Onder voorbehoud van de [artikelen 753][ref1] en [754][ref2] bestaat de bevoegdheid tot beperking van
      aansprakelijkheid voor de hierna genoemde vorderingen ingesteld hetzij op grond van overeenkomst, hetzij buiten
      overeenkomst en zelfs wanneer de aansprakelijkheid uitsluitend voortvloeit uit eigendom of bezit van of een
      voorrecht op het schip of uit het feit, dat dit onder hoede of toezicht is van hem die zich op de beperking van
      aansprakelijkheid beroept:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel753
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel754
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel752
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '753'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '754'
        hoofdstuk: II
  - number: 752.1.a
    text: |-
      vorderingen terzake van dood of letsel, dan wel terzake van verlies van of schade aan zaken (met inbegrip van
      schade aan kunstwerken van havens, aan dokken, waterwegen of hulpmiddelen voor de scheepvaart), opgekomen aan boord
      van het schip of in rechtstreeks verband met de exploitatie van het schip of met werkzaamheden ter hulpverlening,
      alsmede voor vorderingen terzake van schade tengevolge van een of ander;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel752
  - number: 752.1.b
    text: |-
      vorderingen terzake van schade ontstaan door vertraging bij het vervoer over zee van lading, reizigers of hun
      bagage;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel752
  - number: 752.1.c
    text: |-
      vorderingen terzake van andere schade ontstaan door inbreuk op enig niet op overeenkomst gegrond vermogensrecht en
      opgekomen in rechtstreeks verband met de exploitatie van het schip of met werkzaamheden ter hulpverlening;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel752
  - number: 752.1.d
    text: |-
      vorderingen terzake van het vlotbrengen, verwijderen, vernietigen of onschadelijk maken van een zee- of binnenschip
      dat is gezonken, schipbreuk heeft geleden, gestrand of verlaten is, met inbegrip van alles wat aan boord van zulk
      een schip is of is geweest;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel752
  - number: 752.1.e
    text: vorderingen terzake van het verwijderen, vernietigen of onschadelijk maken van de lading van het schip;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel752
  - number: 752.1.f
    text: |-
      vorderingen van een persoon terzake van maatregelen genomen om schade te voorkomen of te verminderen voor welke
      schade de daarvoor aansprakelijke persoon zijn aansprakelijkheid op grond van deze titel zou kunnen beperken,
      alsmede voor vorderingen terzake van verdere schade door zulke maatregelen geleden, één en ander echter met
      uitzondering van dusdanige vorderingen van deze aansprakelijke persoon zelf.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel752
  - number: '752.2'
    text: |-
      Aansprakelijkheid voor de in het eerste lid genoemde vorderingen kan worden beperkt, ook indien deze, al dan
      niet op grond van een overeenkomst, zijn ingesteld bij wijze van verhaal of vrijwaring. De aansprakelijkheid voor
      de vorderingen in het eerste lid genoemd onder *d*, *e* of *f*, kan echter niet worden beperkt voor zover deze
      vorderingen betrekking hebben op een vergoeding verschuldigd op grond van een overeenkomst met de aansprakelijke
      persoon.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel752
  - number: '753.1'
    text: 'Deze titel is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel753
  - number: 753.1.a
    text: vorderingen uit hoofde van hulpverlening of bijdrage in avarijgrosse;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel753
  - number: 753.1.b
    text: |-
      vorderingen voor schade door verontreiniging door olie, zoals deze zijn bedoeld in het op 29 november 1969 tot
      stand gekomen Internationaal Verdrag inzake de wettelijke aansprakelijkheid voor schade door verontreiniging door
      olie of in enige kracht van wet hebbende wijziging van dat Verdrag of Protocol daarbij;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel753
  - number: 753.1.c
    text: |-
      vorderingen onderworpen aan enig internationaal verdrag of enige wet, die de beperking van aansprakelijkheid voor
      kernschade regelt of verbiedt;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel753
  - number: 753.1.d
    text: vorderingen tegen de exploitant van een nucleair schip terzake van kernschade;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel753
  - number: 753.1.e
    text: |-
      vorderingen uit hoofde van arbeidsovereenkomst tegen de reder of de hulpverlener ingesteld door zijn
      ondergeschikten of hun rechtverkrijgenden voor zover deze vorderingen werkzaamheden betreffen in verband met
      het schip of de hulpverlening, al naar gelang de aansprakelijkheid van de reder of de hulpverlener voor deze
      vorderingen uit hoofde van de op de arbeidsovereenkomst toepasselijke wet niet of slechts tot een hoger bedrag dan
      op grond van deze titel het geval ware, kan worden beperkt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel753
  - number: '753.2'
    text: |-
      Wanneer iemand die op grond van deze titel bevoegd is zijn aansprakelijkheid te beperken, gerechtigd is tegen
      een schuldeiser een vordering geldend te maken, die voortkomt uit hetzelfde voorval, zullen de respectieve
      vorderingen met elkaar worden verrekend en wordt de beperking van aansprakelijkheid slechts toegepast op het daarna
      mogelijkerwijs overblijvende saldo.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel753
  - number: '754'
    text: |-
      Niemand is gerechtigd zijn aansprakelijkheid te beperken, indien bewezen is dat de schade is ontstaan door zijn
      eigen handeling of nalaten, geschied hetzij met het opzet die schade te veroorzaken hetzij roekeloos en met de
      wetenschap dat die schade er waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel754
  - number: '755.1'
    text: |-
      Het bedrag waartoe de aansprakelijkheid uit hoofde van deze titel voor niet in artikel 756 genoemde vorderingen,
      naar aanleiding van éénzelfde voorval ontstaan, kan worden beperkt (het bedrag van het fonds) beloopt:
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel755
  - number: 755.1.a
    text: |-
      wanneer het vorderingen betreft ter zake van dood of letsel, die niet zijn vorderingen als bedoeld in artikel 752,
      eerste lid, onder *d* of *e* (personenfonds)
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel755
  - number: 755.1.a.1°
    text: 333 000 rekeneenheden voor een schip, waarvan de tonnage niet meer dan 500 bedraagt;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel755
  - number: 755.1.a.2°
    text: |-
      voor een schip, waarvan de tonnage groter is dan 500, wordt het onder 1 genoemde bedrag vermeerderd met - 500
      rekeneenheden voor elke toename van de tonnage met één van 501 tot en met 3 000;
        - 333 rekeneenheden voor elke toename van de tonnage met één van 3 001 tot en met 30 000;
        - 250 rekeneenheden voor elke toename van de tonnage met één van 30 001 tot en met 70 000;
        - 167 rekeneenheden voor elke toename van de tonnage met één boven de 70 000.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel755
  - number: 755.1.b
    text: |-
      wanneer het enige andere vordering betreft die niet is een vordering als bedoeld in artikel 752, eerste lid, onder
      *d* of *e*(zakenfonds)
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel755
  - number: 755.1.b.1°
    text: 167 000 rekeneenheden voor een schip, waarvan de tonnage niet meer dan 500 bedraagt;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel755
  - number: 755.1.b.2°
    text: |-
      voor een schip, waarvan de tonnage groter is dan 500, wordt het onder 1 genoemde bedrag vermeerderd met - 167
      rekeneenheden voor elke toename van de tonnage met één van 501 tot en met 30 000;
        - 125 rekeneenheden voor elke toename van de tonnage met één van 30 001 tot en met 70 000;
        - 83 rekeneenheden voor elke toename van de tonnage met één boven de 70 000.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel755
  - number: 755.1.c
    text: wanneer het vorderingen betreft als bedoeld in artikel 752, eerste lid, onder *d*of*e* (wrakkenfonds)
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel755
  - number: 755.1.c.1°
    text: 262 000 rekeneenheden voor een schip, waarvan de tonnage niet meer dan 500 bedraagt;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel755
  - number: 755.1.c.2°
    text: |-
      voor een schip, waarvan de tonnage groter is dan 500, wordt het onder 1 genoemde bedrag vermeerderd met - 333
      rekeneenheden voor elke toename van de tonnage met één van 501 tot en met 6 000;
        - 125 rekeneenheden voor elke toename van de tonnage met één van 6 001 tot en met 70 000;
        - 83 rekeneenheden voor elke toename van de tonnage met één boven de 70 000.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel755
  - number: '755.2'
    text: |-
      Voor schepen, die blijkens hun constructie uitsluitend of in hoofdzaak zijn bestemd tot het vervoer van personen
      en waarvan de tonnage niet groter is dan 300, kan bij algemene maatregel van bestuur het bedrag waartoe uit hoofde
      van deze titel de aansprakelijkheid voor de in het eerste lid, aanhef en onder *b*, bedoelde vorderingen kan worden
      beperkt, op een lager aantal rekeneenheden worden gesteld dan genoemd in het eerste lid, onder *b*, onder 1.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel755
  - number: '755.3'
    text: |-
      Het bedrag waartoe de aansprakelijkheid van een hulpverlener aan een schip die niet van een zee- of binnenschip uit
      werkzaamheden verricht of die werkzaamheden uitsluitend verricht op het schip waaraan of met betrekking waartoe hij
      hulp verleent, kan worden beperkt, wordt berekend naar een tonnage van 1500 ton.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel755
  - number: '755.4'
    text: |-
      Voor de toepassing van deze titel wordt onder tonnage van het schip verstaan de bruto-tonnage van het schip
      berekend overeenkomstig de voorschriften voor meting vervat in Bijlage I van het op 23 juni 1969 te Londen tot
      stand gekomen Internationaal Verdrag betreffende de meting van schepen, 1969.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel755
  - number: '755.5'
    text: |-
      Op verzoek van de eigenaar kan door het hoofd van de scheepsmetingsdienst een verklaring worden afgegeven
      betreffende de bruto-tonnage van een schip, berekend overeenkomstig de voorschriften voor meting vervat in Bijlage
      I van het op 23 juni 1969 te Londen tot stand gekomen Internationaal Verdrag betreffende de meting van schepen,
      1969.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel755
  - number: '755.6'
    text: |-
      Deze verklaring wordt afgegeven tegen betaling van de kosten volgens een door Onze Minister van Verkeer en
      Waterstaat vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel755
  - number: '756.1'
    text: |-
      Wat betreft vorderingen ontstaan naar aanleiding van éénzelfde voorval terzake van dood of letsel van reizigers
      van een schip beloopt het bedrag waartoe de reder daarvan zijn aansprakelijkheid kan beperken (passagiersfonds),
      even vele malen 46 666 rekeneenheden als het schip volgens zijn veiligheidscertificaat gerechtigd is reizigers te
      vervoeren, doch niet meer dan 25 000 000 rekeneenheden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel756
  - number: '756.2'
    text: |-
      Onder vorderingen terzake van dood of letsel van reizigers worden voor de toepassing van dit artikel verstaan
      dergelijke vorderingen ingediend naar aanleiding van een voorval overkomen aan enige persoon vervoerd aan boord van
      het schip
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel756
  - number: 756.2.a
    text: op grond van een overeenkomst tot het vervoer van reizigers;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel756
  - number: 756.2.b
    text: |-
      die met toestemming van de vervoerder een voertuig of levende dieren vergezelt, die worden vervoerd op grond van
      een overeenkomst tot goederenvervoer.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel756
  - number: '757'
    text: |-
      Aan de bedragen vermeld in de [artikelen 755][ref1] en [756][ref2] wordt toegevoegd de wettelijke rente berekend
      van de aanvang van de dag volgende op de dag van het voorval, dat aanleiding gaf tot de vordering, tot de aanvang
      van de dag volgende op de dag waarop hij, die een verzoek tot beperking van zijn aansprakelijkheid indiende,
      voldeed aan een hem krachtens [artikel 642][ref3] opgelegd bevel.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel755
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel756
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel642c
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel757
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '755'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '756'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 642c
  - number: '758.1'
    text: |-
      De beperking van aansprakelijkheid als vastgesteld in [artikel 755][ref1] geldt voor het geheel der naar aanleiding
      van éénzelfde voorval ontstane vorderingen gericht tegen


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel755
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel758
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '755'
        hoofdstuk: II
  - number: 758.1.a
    text: |-
      de persoon of personen genoemd in het tweede lid van [artikel 750][ref1] en enige persoon voor wiens handeling,
      onachtzaamheid of nalatigheid dezen in beginsel aansprakelijk zijn, of


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel750
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel758
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '750'
        hoofdstuk: II
  - number: 758.1.b
    text: |-
      de reder van een schip die van dat schip uit hulp verleent, en de hulpverlener of hulpverleners die van dat schip
      uit hun werkzaamheden verricht of verrichten en enige persoon voor wiens handeling, onachtzaamheid of nalatigheid
      deze personen in beginsel aansprakelijk zijn, of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel758
  - number: 758.1.c
    text: |-
      de hulpverlener of hulpverleners aan een schip die niet van een zee- of binnenschip uit werkzaamheden verricht of
      verrichten of die werkzaamheden verricht of verrichten uitsluitend op het schip waaraan of met betrekking waartoe
      hulp wordt verleend, en enige persoon voor wiens handeling, onachtzaamheid of nalatigheid deze personen in beginsel
      aansprakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel758
  - number: '758.2'
    text: |-
      De beperking van aansprakelijkheid als vastgesteld in [artikel 756][ref1] geldt voor het geheel der naar
      aanleiding van éénzelfde voorval ontstane vorderingen gericht tegen de persoon of de personen die in de in
      [artikel 750, tweede lid][ref2], genoemde betrekking staan tot het in artikel 756 bedoelde schip, en enige persoon
      voor wiens handeling, onachtzaamheid of nalatigheid dezen in beginsel aansprakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel756
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel750
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel758
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '756'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '750'
        hoofdstuk: II
  - number: '759'
    text: |-
      De rekeneenheid, genoemd in de [artikelen 755][ref1] en [756][ref2], is het bijzondere trekkingsrecht, zoals
      dat is omschreven door het Internationale Monetaire Fonds. De bedragen genoemd in de artikelen 755 en 756
      worden omgerekend in Nederlands geld naar de koers van de dag waarop de schuldenaar voldoet aan een ingevolge
      [artikel 642][ref3] gegeven bevel tot storting of andere zekerheidsstelling. De waarde van het Nederlandse geld,
      uitgedrukt in bijzondere trekkingsrechten, wordt berekend volgens de waarderingsmethode die door het Internationale
      Monetaire Fonds op de dag van omrekening wordt toegepast voor zijn eigen verrichtingen en transacties.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel755
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel756
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel642
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel759
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '755'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '756'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '642'
  - number: '770.1'
    text: |-
      Indien een binnenschip blijkens de openbare registers, bedoeld in [afdeling 2 van Titel 1 van Boek 3][ref1] aan
      twee of meer personen gezamenlijk toebehoort, bestaat tussen hen een rederij. Wanneer de eigenaren van het schip
      onder een gemeenschappelijke naam optreden bestaat slechts een rederij, indien zulks uitdrukkelijk bij akte is
      overeengekomen en deze akte in die registers is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel770
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '770.2'
    text: De rederij is geen rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel770
  - number: '771'
    text: |-
      [Afdeling 1 van titel 3][ref1] is op de rederij van een binnenschip van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel771
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '1'
  - number: '780.1'
    text: |-
      In de [afdelingen 2 tot en met 6 van titel 8][ref1] worden onder schepen mede verstaan schepen in aanbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel780
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: III
        afdeling: '2'
  - number: '780.2'
    text: |-
      Onder binnenschepen worden in de [afdelingen 2 tot en met 6 van titel 8][ref1] mede verstaan draagvleugelboten,
      veerponten, alsmede baggermolens, drijvende kranen, elevatoren en alle drijvende werktuigen, pontons of materiaal
      van soortgelijke aard, die voldoen aan de in de [artikelen 1][ref2] en [3][ref3] ten aanzien van binnenschepen
      vermelde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel3
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel780
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '3'
        hoofdstuk: I
  - number: '780.3'
    text: |-
      Indien een schip in aanbouw een schip in de zin van [artikel 1][ref1] is geworden, ontstaat daardoor niet een nieuw
      schip.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel780
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1'
        hoofdstuk: I
  - number: '781'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel781
  - number: 781.a
    text: |-
      het Verdrag van Genève: de op 25 januari 1965 te Genève gesloten overeenkomst inzake inschrijving van
      binnenschepen, met Protocollen (*Trb.* 1966, 228);
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel781
  - number: 781.b
    text: 'verdragsstaat: een staat waarvoor het Verdrag van Genève van kracht is;'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel781
  - number: 781.c
    text: 'het register: het in artikel 783 genoemde register;'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel781
  - number: 781.d
    text: |-
      verdragsregister: een buiten Nederland in een verdragsstaat gehouden register, als bedoeld in artikel 2 van het
      Verdrag van Genève;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel781
  - number: 781.e
    text: 'de openbare registers: de openbare registers, bedoeld in afdeling 2 van Titel 1 van Boek 3.'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel781
  - number: '782'
    text: |-
      De in deze afdeling aan de eigenaar opgelegde verplichtingen rusten, indien het schip toebehoort aan meer personen,
      aan een vennootschap onder firma, aan een commanditaire vennootschap of aan een rechtspersoon, mede op iedere mede-
      eigenaar, beherende vennoot of bestuurder.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel782
  - number: '783'
    text: |-
      Er wordt een afzonderlijk openbaar register gehouden voor de teboekstelling van binnenschepen, dat deel uitmaakt
      van de openbare registers.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel783
  - number: '784.1'
    text: |-
      Teboekstelling is slechts mogelijk - van een in aanbouw zijnd binnenschip: indien het in Nederland in aanbouw is;
        - van een afgebouwd binnenschip: indien aan ten minste één der volgende voorwaarden is voldaan: a. dat de plaats,
      van waaruit de exploitatie van het schip gewoonlijk wordt geleid, in Nederland is gelegen; b. dat, wanneer de
      eigenaar van het schip een natuurlijke persoon is, deze Nederlander is of zijn woonplaats in Nederland heeft;
      c. dat, wanneer de eigenaar van het schip een rechtspersoon of een vennootschap is, zijn zetel of de plaats van
      waaruit hij zijn bedrijf voornamelijk uitoefent, in Nederland is gelegen, met dien verstande, dat in geval van
      mede-eigendom van het binnenschip de onder *b* en *c* genoemde voorwaarden niet als vervuld worden beschouwd,
      wanneer niet het schip tenminste voor de helft in eigendom toebehoort aan natuurlijke personen, rechtspersonen of
      vennootschappen, die aan deze voorwaarden voldoen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel784
  - number: '784.2'
    text: |-
      Teboekstelling is niet mogelijk van een binnenschip dat reeds teboek staat in het register, in het in artikel 193
      genoemde register of in een verdragsregister.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel784
  - number: '784.3'
    text: |-
      In afwijking van het tweede lid is teboekstelling van een binnenschip dat in een verdragsregister teboekstaat
      mogelijk, wanneer dit schip, nadat de teboekstelling ervan in dat verdragsregister is doorgehaald, volgens het
      eerste lid kan worden teboekgesteld. Deze teboekstelling heeft evenwel slechts rechtsgevolg, wanneer zij is gevolgd
      door aantekening in het register, dat de teboekstelling in het verdragsregister is doorgehaald.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel784
  - number: '784.4'
    text: |-
      In afwijking van het tweede lid is teboekstelling van een binnenschip dat in een verdragsregister teboekstaat
      mogelijk, wanneer de bewaarder van dat register uit hoofde van het tweede lid van artikel 22 van Protocol no. 2 bij
      het Verdrag van Genève weigert het eigendomsrecht van de koper na gedwongen verkoop in te schrijven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel784
  - number: '784.5'
    text: |-
      De teboekstelling wordt verzocht door de eigenaar van het binnenschip. Hij moet daarbij ter inschrijving overleggen
      een door hem ondertekende verklaring, dat naar zijn beste weten het schip voor teboekstelling als binnenschip
      vatbaar is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel784
  - number: '784.6'
    text: |-
      De teboekstelling in het register heeft geen rechtsgevolg, wanneer aan de vereisten van de voorgaande leden van dit
      artikel niet is voldaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel784
  - number: '784.7'
    text: |-
      Bij het verzoek tot teboekstelling wordt woonplaats gekozen in Nederland. Deze woonplaats wordt in het verzoek tot
      teboekstelling vermeld en kan door een andere in Nederland gelegen woonplaats worden vervangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel784
  - number: '785.1'
    text: |-
      De eigenaar van een binnenschip is verplicht de teboekstelling daarvan te verzoeken. Aan deze verplichting moet
      worden voldaan binnen drie maanden, nadat volgens [artikel 784][ref1] teboekstelling mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel784
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel785
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '784'
        hoofdstuk: III
        afdeling: '2'
  - number: '785.2'
    text: Geen verplichting tot teboekstelling bestaat
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel785
  - number: 785.2.a
    text: |-
      ten aanzien van vrachtschepen met minder dan 20 tonnen van 1000 kilogram laadvermogen of andere binnenschepen met
      minder dan 10 kubieke meters verplaatsing, zijnde de in kubieke meters uitgedrukte waterverplaatsing tussen het
      vlak van inzinking van het ledige binnenschip in zoet water en het vlak van de grootste toegelaten diepgang;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel785
  - number: 785.2.b
    text: |-
      ten aanzien van afgebouwde binnenschepen, die teboekstaan in het register van een niet-verdragsstaat en in
      die staat voldoen aan tenminste één der in het eerste lid van artikel 3 van het Verdrag van Genève genoemde
      voorwaarden;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel785
  - number: 785.2.c
    text: |-
      ten aanzien van binnenschepen, die komen van een niet-verdragsstaat en op weg zijn naar het land waar zij zullen
      moeten worden teboekgesteld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel785
  - number: '786.1'
    text: De teboekstelling wordt slechts doorgehaald
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel786
  - number: 786.1.a
    text: op verzoek van degeen, die in de openbare registers als eigenaar vermeld staat
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel786
  - number: 786.1.a.1°
    text: als de teboekstelling niet of niet meer verplicht is;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel786
  - number: 786.1.a.2°
    text: |-
      als het schip in een verdragsregister teboekstaat onder voorwaarde van doorhaling van de teboekstelling in het
      Nederlandse register;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel786
  - number: 786.1.a.3°
    text: |-
      als het schip in het register van een niet-verdragsstaat zal worden te boekgesteld en in die staat zal voldoen aan
      tenminste één der in het eerste lid van artikel 3 van het Verdrag van Genève genoemde voorwaarden. In dit geval
      heeft de doorhaling slechts rechtsgevolg, wanneer binnen 30 dagen daarna door de eigenaar wordt overgelegd een door
      hem ondertekende verklaring, dat het schip in het register van de genoemde staat teboekstaat en aldaar voldoet aan
      tenminste één der in het eerste lid van artikel 3 van het Verdrag van Genève genoemde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel786
  - number: 786.1.b
    text: op aangifte van de eigenaar of ambtshalve
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel786
  - number: 786.1.b.1°
    text: als het schip vergaan is, gesloopt is of blijvend ongeschikt voor drijven is geworden;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel786
  - number: 786.1.b.2°
    text: als het schip door rovers of vijanden is genomen;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel786
  - number: 786.1.b.3°
    text: |-
      als het schip, indien het niet in het register teboek zou staan, een zeeschip zou zijn in de zin van artikel 2 of
      een dergelijk zeeschip in aanbouw;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel786
  - number: 786.1.b.4°
    text: |-
      als het schip niet of niet meer voldoet aan tenminste één der in het eerste lid van artikel 784 voor teboekstelling
      genoemde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel786
  - number: 786.1.b.5°
    text: |-
      als het schip in een verdragsregister teboekstaat zonder dat daarbij de voorwaarde van doorhaling van de
      teboekstelling in het Nederlandse register is gesteld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel786
  - number: '786.2'
    text: |-
      In de in het eerste lid onder *b* genoemde gevallen is de eigenaar tot het doen van aangifte verplicht binnen drie
      maanden nadat de reden tot doorhaling zich heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel786
  - number: '786.3'
    text: |-
      Wanneer ten aanzien van het schip inschrijvingen of voorlopige aantekeningen ten gunste van derden bestaan,
      geschiedt doorhaling slechts, wanneer geen dezer derden zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel786
  - number: '786.4'
    text: Doorhaling geschiedt slechts na op verzoek van de meest gerede partij verleende machtiging van de rechter.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel786
  - number: '787.1'
    text: |-
      Zolang de teboekstelling in het register niet is doorgehaald heeft teboekstelling van een binnenschip in een
      register van een niet-verdragsstaat of vestiging in een niet-verdragsstaat van rechten daarop, voor vestiging
      waarvan in Nederland inschrijving in de openbare registers vereist zou zijn geweest geen rechtsgevolg.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel787
  - number: '787.2'
    text: |-
      In afwijking van het eerste lid wordt een teboekstelling of vestiging van rechten als daar bedoeld erkend, wanneer
      deze geschiedde onder voorwaarde van doorhaling van de teboekstelling in het Nederlandse register binnen 30 dagen
      na de teboekstelling van het schip in het buitenlandse register.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel787
  - number: '788'
    text: |-
      De enige zakelijke rechten, waarvan een in het register teboekstaand binnenschip het voorwerp kan zijn, zijn de
      eigendom, de hypotheek, het vruchtgebruik en de in [artikel 821][ref1] en [artikel 827 eerste lid onder b][ref2]
      genoemde voorrechten.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel821
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel827
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel788
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '821'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '827'
        hoofdstuk: III
        afdeling: '4'
  - number: '790.1'
    text: Een in het register teboekstaand binnenschip is een registergoed.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel790
  - number: '790.2'
    text: |-
      Bij toepassing van artikel 301 van Boek 3 ter zake van akten die op de voet van artikel 89 leden 1 en 4 van Boek 3
      zijn bestemd voor de levering van een zodanig binnenschip, kan de in het eerste genoemde artikel bedoelde uitspraak
      van de Nederlandse rechter niet worden ingeschreven, zolang zij niet in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel790
  - number: '791'
    text: |-
      Eigendom, hypotheek en vruchtgebruik op een teboekstaand binnenschip worden door een bezitter te goeder trouw
      verkregen door een onafgebroken bezit van vijf jaren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel791
  - number: '792'
    text: |-
      Onverminderd het bepaalde in [artikel 260, eerste lid, van Boek 3][ref1] wordt in de notariële akte waarbij
      hypotheek wordt verleend op een teboekstaand binnenschip of een recht waaraan een zodanig schip is onderworpen,
      duidelijk vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel260
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel792
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '260'
  - number: 792.a
    text: het aan de hypotheek onderworpen schip;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel792
  - number: 792.b
    text: |-
      de voorwaarden voor opeisbaarheid of een verwijzing naar een op het kantoor van inschrijving ingeschreven document
      waarin de voorwaarden voor opeisbaarheid zijn vastgelegd;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel792
  - number: 792.c
    text: de bedongen rente en het tijdstip of de tijdstippen waarop deze vervalt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel792
  - number: '793'
    text: |-
      Behoudens afwijkende, uit de openbare registers blijkende, bedingen omvat de hypotheek de zaken die uit hoofde
      van hun bestemming blijvend met het schip zijn verbonden en die toebehoren aan de eigenaar van het schip.
      [Artikel 266 van Boek 3][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel266
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel793
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '266'
  - number: '794'
    text: |-
      De door hypotheek gedekte vordering neemt rang na de vorderingen, genoemd in de [artikelen 820][ref1], [821][ref2],
      [221][ref3], [222 eerste lid][ref4], [831][ref5] en [832 eerste lid][ref6], doch vóór alle andere vorderingen,
      waaraan bij deze of enige andere wet een voorrecht is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel820
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel821
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel221
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel222
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Artikel831
      [ref6]: https://wetten.overheid.nl/BWBR0005034#Artikel832
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel794
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '820'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '821'
        hoofdstuk: III
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '221'
        hoofdstuk: II
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '222'
        hoofdstuk: II
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0005034
        artikel: '831'
        hoofdstuk: III
        afdeling: '5'
      - id: ref6
        bwb_id: BWBR0005034
        artikel: '832'
        hoofdstuk: III
        afdeling: '5'
  - number: '795'
    text: |-
      Indien de vordering rente draagt, strekt de hypotheek mede tot zekerheid voor de renten der hoofdsom, vervallen
      gedurende de laatste drie jaren voorafgaand aan het begin van de uitwinning en gedurende de loop hiervan.
      [Artikel 263 van Boek 3][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel263
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel795
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '263'
  - number: '796'
    text: |-
      Op hypotheek op een aandeel in een teboekstaand binnenschip is [artikel 177 van Boek 3][ref1] niet van toepassing;
      de hypotheek blijft na vervreemding of toedeling van het schip in stand.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel177
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel796
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '177'
  - number: '797.1'
    text: |-
      De eerste twee leden van [artikel 264 van Boek 3][ref1] zijn in geval van een hypotheek waaraan een teboekstaand
      binnenschip is onderworpen, mede van toepassing op bevrachtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel264
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel797
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '264'
  - number: '797.2'
    text: |-
      De [artikelen 234][ref1] en [261 van Boek 3][ref2] zijn op een zodanige hypotheek niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel234
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel261
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel797
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '234'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '261'
  - number: '798'
    text: |-
      In geval van vruchtgebruik op een teboekstaand binnenschip zijn de bepalingen van [artikel 217 van Boek 3][ref1]
      mede van toepassing op bevrachting voor zover die bepalingen niet naar hun aard uitsluitend op pacht, huur van
      bedrijfsruimte of huur van woonruimte van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel217
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel798
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '217'
  - number: '800.1'
    text: |-
      Scheepshuurkoop van een in het in [artikel 783][ref1] genoemde register teboekstaand binnenschip komt tot stand bij
      een notariële akte, waarbij de koper zich verbindt tot betaling van een prijs in termijnen, waarvan twee of meer
      termijnen verschijnen nadat de verkoper aan de koper het schip ter beschikking heeft gesteld en de verkoper zich
      verbindt tot eigendomsoverdracht van het binnenschip na algehele betaling van hetgeen door de koper krachtens de
      overeenkomst is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel783
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel800
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '783'
        hoofdstuk: III
        afdeling: '2'
  - number: '800.2'
    text: |-
      De overeenkomst is slechts van kracht indien daartoe schriftelijk toestemming is verkregen van degenen van wier
      beperkt recht of beslag blijkt uit een inschrijving in de openbare registers, die reeds bestond op de dag van de
      inschrijving van de in [artikel 805][ref1] bedoelde hypotheek.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel805
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel800
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '805'
        hoofdstuk: III
        afdeling: '3'
  - number: '800.3'
    text: |-
      Voor de bedingen omtrent de terbeschikkingstelling van het schip kan worden verwezen naar een aan de akte te
      hechten en door partijen te ondertekenen geschrift.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel800
  - number: '800.4'
    text: De volmacht tot het aangaan van een scheepshuurkoop moet bij authentieke akte worden verleend.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel800
  - number: '801.1'
    text: |-
      De overeenkomst kan worden ingeschreven in de openbare registers, bedoeld in
      [afdeling 2 van Titel 1 van Boek 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel801
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '801.2'
    text: |-
      Bij eigendomsovergang op een derde van een schip, ten aanzien waarvan reeds een scheepshuurkoopovereenkomst was
      ingeschreven in de openbare registers, bedoeld in [afdeling 2 van Titel 1 van Boek 3][ref1], volgt deze derde
      in alle rechten en verplichtingen van de scheepshuurverkoper op, die nochtans naast de nieuwe eigenaar aan de
      overeenkomst gebonden blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel801
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '801.3'
    text: Rechten en verplichtingen welke vóór de eigendomsovergang opeisbaar zijn geworden, gaan op de derde niet over.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel801
  - number: '802'
    text: |-
      In de [artikelen 803 tot en met 812][ref1] wordt onder koper de scheepshuurkoper en onder verkoper de
      scheepshuurverkoper verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel803
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel802
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '803'
        hoofdstuk: III
        afdeling: '3'
  - number: '803.1'
    text: |-
      Partijen zijn verplicht in de akte te vermelden welk deel van elk der te betalen termijnen strekt tot aflossing van
      de prijs voor de koop van het schip ("de koopsom"), welk deel strekt tot betaling van mogelijkerwijs verschuldigde
      rente en welk deel mogelijkerwijs betrekking heeft op de terbeschikkingstelling van het schip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel803
  - number: '803.2'
    text: |-
      Nietig is ieder beding, waarbij van het eerste lid van dit artikel wordt afgeweken met dien verstande dat, bij
      gebreke of onduidelijkheid van de vermelding van de daar bedoelde verdeling, deze op verzoek van de meest gerede
      partij alsnog door de rechter wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel803
  - number: '804'
    text: Nietig is ieder beding volgens hetwelk gedurende de contractsperiode een hogere koopsom kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel804
  - number: '805.1'
    text: De verkoper is verplicht
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel805
  - number: 805.1.a
    text: het schip ter beschikking van de koper te stellen en te laten;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel805
  - number: 805.1.b
    text: de koper te vrijwaren voor de gevolgen van
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel805
  - number: 805.1.b.1°
    text: een staat of eigenschap van het schip
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel805
  - number: 805.1.b.2°
    text: een op het schip gelegd beslag
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel805
  - number: 805.1.b.3°
    text: |-
      zijn faillissement of het ten aanzien van hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke
      personen
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel805
  - number: 805.1.b.4°
    text: |-
      enige hem persoonlijk betreffende omstandigheid mits deze gevolgen ertoe leiden dat het schip aan de koper niet
      die mate van beschikking kan verschaffen die deze bij het aangaan van de overeenkomst er van mocht verwachten. De
      verkoper is niet verplicht de koper te vrijwaren voor de gevolgen van een feitelijke stoornis door derden zonder
      bewering van recht op het schip of van een bewering van recht op het schip zonder feitelijke stoornis;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel805
  - number: 805.1.c
    text: |-
      zorg te dragen dat ten behoeve van de koper op de dag der overeenkomst hypotheek op de eigendom van het schip wordt
      gevestigd ten belope van een bedrag, gelijk aan driemaal de koopsom, terzake van hetgeen de verkoper aan de koper
      in verband met de scheepshuurkoop of de ontbinding daarvan verschuldigd is of zal worden;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel805
  - number: 805.1.d
    text: |-
      zich te onthouden van iedere eigendomsoverdracht van het schip en zodra de koper zal hebben voldaan aan zijn in de
      overeenkomst neergelegde verplichtingen tot betaling, het schip aan dezen in eigendom over te dragen vrij van na
      het tot stand komen van de scheepshuurkoop gevestigde hypotheken ten gunste van derden en vrij van boven hypotheek
      rangnemende voorrechten en beslagen terzake van vorderingen waarvan de verkoper de schuldenaar is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel805
  - number: '805.2'
    text: |-
      Nietig is ieder beding, waarbij ten nadele van de koper van het in het eerste lid onder *a, c* of *d* bepaalde
      wordt afgeweken, met dien verstande dat de hypotheek als daar onder *c* wordt bedoeld, wordt verleend op de door
      partijen nader overeen te komen voorwaarden of bij gebreke van overeenstemming daaromtrent op de voorwaarden door
      de rechter alsnog op verzoek van de meest gerede partij zo mogelijk in overeenstemming met het gebruik vast te
      stellen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel805
  - number: '805.3'
    text: |-
      Nietig is ieder beding, waarbij ten nadele van de koper van het in het eerste lid onder *b* bepaalde wordt
      afgeweken ten aanzien van een feit dat de verkoper bij het aangaan van de overeenkomst kende.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel805
  - number: '805.4'
    text: |-
      Nietig is ieder beding, waarbij het bedrag van een door de verkoper mogelijkerwijs te betalen schadevergoeding
      wegens niet nakoming van zijn uit dit artikel voortvloeiende verplichtingen bij voorbaat wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel805
  - number: '806'
    text: |-
      De koper die aan zijn in de overeenkomst neergelegde verplichtingen tot betaling heeft voldaan, is verplicht het
      schip in eigendom te aanvaarden, mits dit vrij zij van hypotheken ten gunste van derden en vrij van boven hypotheek
      rangnemende voorrechten en beslagen terzake van vorderingen, waarvan de verkoper de schuldenaar is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel806
  - number: '807.1'
    text: |-
      Onder voorbehoud van [artikel 808][ref1] is de koper gerechtigd door hem verschuldigde gedeelten van de termijnen
      die betrekking hebben op de koopsom en de rente aan te wenden tot rechtstreekse betaling van opeisbare rente en
      aflossingen aan schuldeisers te wier behoeve hypotheek op het schip is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel808
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel807
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '808'
        hoofdstuk: III
        afdeling: '3'
  - number: '807.2'
    text: |-
      Indien en voor zover het door de koper aan de verkoper verschuldigde per termijn minder bedraagt dan het bedrag
      dat periodiek aan rente en aflossing aan de in het eerste lid bedoelde hypothecaire schuldeiser is verschuldigd,
      is deze, in afwijking van [artikel 29 van Boek 6][ref1] gehouden de overeenkomstig het eerste lid betaalde
      huurkooptermijnen te ontvangen, onverminderd de verplichting van de hypothecaire schuldenaar tot betaling van het
      restant verschuldigde. De hypothecaire schuldeiser is verplicht de hypothecaire schuldenaar mede te delen welke
      opeisbare rente en aflossingen door de koper zijn betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel29
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel807
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '29'
  - number: '807.3'
    text: |-
      Indien de koper aan de in het eerste lid bedoelde hypothecaire schuldeiser heeft doen weten, dat hij van het hem
      in dit artikel toegekende recht gebruik wenst te maken, is deze laatste verplicht de koper in te lichten omtrent de
      grootte van de nog resterende hypothecaire schuld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel807
  - number: '807.4'
    text: |-
      De betalingen overeenkomstig dit artikel aan een hypothecaire schuldeiser gedaan, strekken in mindering op hetgeen
      de koper aan de verkoper verschuldigd is. De koper stelt de verkoper onverwijld in kennis van deze betalingen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel807
  - number: '807.5'
    text: |-
      Overdracht of inpandgeving van de vordering, die de verkoper op de koper heeft of een onder de koper ten laste
      van de verkoper gelegd beslag, kan aan de rechten, die de koper aan de bepalingen van dit artikel ontleent, geen
      afbreuk doen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel807
  - number: '807.6'
    text: |-
      Bij openbare, eigenmachtige of executoriale verkoop van het schip ten behoeve van een hypothecaire schuldeiser of
      van een beslaglegger op het schip, heeft de koper de in [artikel 269 van Boek 3][ref1] bedoelde bevoegdheid. Maakt
      hij van dit recht gebruik, dan is het derde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel269
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel807
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '269'
  - number: '808.1'
    text: |-
      Na verloop van één jaar na het sluiten van de overeenkomst is de koper gerechtigd het restant van de verschuldigde
      koopsom geheel of ten dele vóór het verschijnen van de bij de overeenkomst vastgestelde termijnen te voldoen met
      herberekening van het rentebestanddeel in de termijnen die alsnog verschuldigd waren, zulks op de voorwaarden door
      partijen overeengekomen danwel overeen te komen of bij gebreke van overeenstemming daaromtrent door de rechter op
      verzoek van de meest gerede partij vast te stellen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel808
  - number: '808.2'
    text: Nietig is ieder beding, waarbij ten nadele van de koper van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel808
  - number: '809.1'
    text: |-
      In geval de koper niet aan zijn verplichting tot betaling van de koopsom of de rente, dan wel een termijn daarvan
      voldoet, kan de verkoper hierop eerst een beroep doen om krachtens een daartoe mogelijkerwijs gemaakt beding
      teruggave van het schip te vorderen, nadat hij de koper terzake in gebreke heeft gesteld en deze, nadat hem bij die
      ingebrekestelling een redelijke termijn is gesteld alsnog aan zijn verplichtingen te voldoen, hiermee in gebreke
      blijft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel809
  - number: '809.2'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel809
  - number: '810.1'
    text: |-
      Indien de overeenkomst is ontbonden tengevolge van het in gebreke blijven van de koper te voldoen aan zijn
      verplichting tot betaling van de koopsom of de rente, dan wel een termijn daarvan en de verkoper of de koper
      dientengevolge in een betere vermogenstoestand zou geraken dan bij in stand blijven van de overeenkomst, zijn
      partijen verplicht onverwijld tot volledige verrekening over te gaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel810
  - number: '810.2'
    text: |-
      Ieder beding, waarbij de verkoper zich de bevoegdheid voorbehoudt de waarde van het schip te bepalen, laat de
      bevoegdheid van de koper deze waarde op zijn verzoek nader door de rechter te doen vaststellen, onverlet.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel810
  - number: '810.3'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel810
  - number: '812'
    text: Nietig is ieder beding, krachtens hetwelk de overeenkomst van rechtswege eindigt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel812
  - number: '820.1'
    text: |-
      In geval van uitwinning van een binnenschip worden de kosten van uitwinning, de kosten van bewaking tijdens deze
      uitwinning of verkoop, alsmede de kosten van gerechtelijke rangregeling en verdeling van de opbrengst onder de
      schuldeisers uit de opbrengst van de verkoop voldaan boven alle andere vorderingen, waaraan bij deze of enige
      andere wet een voorrecht is toegekend.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel820
  - number: '820.2'
    text: |-
      In geval van verkoop van een gestrand, onttakeld of gezonken binnenschip, dat de overheid in het openbaar belang
      heeft doen opruimen, worden de kosten der wrakopruiming uit de opbrengst van de verkoop voldaan boven alle andere
      vorderingen, waaraan bij deze of enige andere wet een voorrecht is toegekend.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel820
  - number: '820.3'
    text: De in de vorige leden bedoelde vorderingen staan in rang gelijk en worden ponds-pondsgewijs betaald.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel820
  - number: 820a
    text: |-
      [Artikel 292 van Boek 3][ref1] en de [artikelen 60, tweede lid, eerste zin, derde lid en vierde lid][ref2], en
      [299b, derde tot en met vijfde lid, van de Faillissementswet](onbekend) zijn op binnenschepen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel292
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel60
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel820a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '292'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '60'
  - number: '821'
    text: |-
      Boven alle andere vorderingen waaraan bij deze of enige andere wet een voorrecht is toegekend zijn, behoudens
      [artikel 820][ref1], op een binnenschip bevoorrecht:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel820
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel821
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '820'
        hoofdstuk: III
        afdeling: '4'
  - number: 821.a
    text: |-
      in geval van beslag: de vorderingen ter zake van kosten na het beslag gemaakt tot behoud van het schip, daaronder
      begrepen de kosten van herstellingen, die onontbeerlijk waren voor het behoud van het schip;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel821
  - number: 821.b
    text: |-
      de vorderingen ontstaan uit de arbeidsovereenkomsten van de schipper of de andere leden der bemanning, met dien
      verstande dat de vorderingen met betrekking tot loon, salaris of beloningen slechts bevoorrecht zijn tot op een
      bedrag over een tijdvak van zes maanden verschuldigd;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel821
  - number: 821.c
    text: de vorderingen ter zake van hulpverlening alsmede ter zake van de bijdrage van het schip in avarij-grosse.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel821
  - number: '822'
    text: |-
      Wanneer een vordering uit hoofde van [artikel 821][ref1] bevoorrecht is, zijn de renten hierop en de kosten
      teneinde een voor tenuitvoerlegging vatbare titel te verkrijgen gelijkelijk bevoorrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel821
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel822
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '821'
        hoofdstuk: III
        afdeling: '4'
  - number: '823.1'
    text: |-
      De bevoorrechte vorderingen, genoemd in [artikel 821][ref1], nemen rang in de volgorde, waarin zij daar zijn
      gerangschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel821
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel823
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '821'
        hoofdstuk: III
        afdeling: '4'
  - number: '823.2'
    text: |-
      Bevoorrechte vorderingen onder dezelfde letter vermeld, staan in rang gelijk, doch de vorderingen genoemd in
      [artikel 821][ref1] onder *c* nemen onderling rang naar de omgekeerde volgorde van de tijdstippen, waarop zij
      ontstonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel821
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel823
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '821'
        hoofdstuk: III
        afdeling: '4'
  - number: '823.3'
    text: In rang gelijkstaande vorderingen worden ponds-pondsgewijs betaald.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel823
  - number: '824'
    text: |-
      De voorrechten, genoemd in [artikel 821][ref1], strekken zich uit tot


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel821
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel824
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '821'
        hoofdstuk: III
        afdeling: '4'
  - number: 824.a
    text: |-
      alle zaken, die uit hoofde van hun bestemming blijvend met het schip zijn verbonden en die toebehoren aan de
      eigenaar van het schip;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel824
  - number: 824.b
    text: |-
      de schadevergoedingen, verschuldigd voor het verlies van het schip of voor niet herstelde beschadiging daarvan,
      daarbij inbegrepen dat deel van een beloning voor hulpverlening, van een beloning voor vlotbrengen of van een
      vergoeding in avarij-grosse, dat tegenover een zodanig verlies of beschadiging staat. Dit geldt eveneens wanneer
      deze schadevergoedingen of vorderingen tot beloning zijn overgedragen of met pandrecht zijn bezwaard. Deze
      schadevergoedingen omvatten echter niet vergoedingen welke zijn verschuldigd krachtens een overeenkomst van
      verzekering van het schip, die dekking geeft tegen het risico van verlies of avarij. [Artikel 283 van Boek 3][ref1]
      is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel283
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel824
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '283'
  - number: '825.1'
    text: |-
      De schuldeiser, die een voorrecht heeft op grond van [artikel 821][ref1], vervolgt zijn recht op het schip, in
      wiens handen dit zich ook bevinde.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel821
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel825
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '821'
        hoofdstuk: III
        afdeling: '4'
  - number: '825.2'
    text: |-
      Voorrechten als bedoeld in [artikel 821][ref1] kunnen worden ingeschreven in de openbare registers bedoeld in
      [afdeling 2 van Titel 1 van Boek 3][ref2]. [Artikel 24 lid 1 van Boek 3][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel821
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel825
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '821'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '826'
    text: |-
      De vorderingen genoemd in [artikel 821][ref1], doen een voorrecht op het schip ontstaan en zijn alsdan daarop
      verhaalbaar, zelfs wanneer zij zijn ontstaan tijdens de exploitatie van het schip door een ander dan de eigenaar,
      tenzij aan deze de feitelijke macht over het schip door een ongeoorloofde handeling was ontnomen en bovendien de
      schuldeiser niet te goeder trouw was.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel821
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel826
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '821'
        hoofdstuk: III
        afdeling: '4'
  - number: '827.1'
    text: |-
      Boven alle andere vorderingen, waaraan bij deze of enige andere wet een voorrecht is toegekend, doch na de
      bevoorrechte vorderingen genoemd in [artikel 821][ref1], na de hypothecaire vorderingen, na de vorderingen genoemd
      in de [artikelen 222][ref2] en [832][ref3] en na de vordering van de pandhouder, zijn op een binnenschip, waaronder
      voor de toepassing van dit artikel niet is te verstaan een binnenschip in aanbouw, bij voorrang verhaalbaar:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel821
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel222
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel832
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel827
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '821'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '222'
        hoofdstuk: II
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '832'
        hoofdstuk: III
        afdeling: '5'
  - number: 827.1.a
    text: |-
      de vorderingen, die voortvloeien uit rechtshandelingen die de eigenaar, de scheepshuurkoper of een bevrachter
      binden en die rechtstreeks strekken tot het in bedrijf brengen of houden van het schip, alsmede de vorderingen die
      tegen een uit hoofde van [artikel 461][ref1] gelezen met [artikel 462][ref2] of [artikel 943][ref3] gelezen met
      [artikel 944][ref4] als vervoerder aangemerkte persoon kunnen worden geldend gemaakt. Onder rechtshandeling is hier
      het in ontvangst nemen van een verklaring begrepen;


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel461
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel462
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel943
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel944
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel827
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '461'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '462'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '943'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '944'
        hoofdstuk: III
        afdeling: '2'
  - number: 827.1.b
    text: |-
      de vorderingen, die uit hoofde van [afdeling 1 van titel 6][ref1] of [afdeling 1 van titel 11][ref2] op de eigenaar
      rusten;


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel827
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        hoofdstuk: III
        afdeling: '1'
  - number: 827.1.c
    text: |-
      de vorderingen genoemd in [artikel 1062][ref1] voor zover zij op de eigenaar rusten.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1062
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel827
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1062'
        hoofdstuk: III
  - number: '827.2'
    text: De in het eerste lid genoemde vorderingen staan in rang gelijk en worden ponds-pondsgewijs betaald.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel827
  - number: '827.3'
    text: |-
      De [artikelen 822][ref1], [824][ref2] onder *a* en [826][ref3] zijn op de in het eerste lid genoemde vorderingen
      van toepassing. Op de vorderingen die in het eerste lid onder *b* worden genoemd, is ook [artikel 825][ref4] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel822
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel824
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel826
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel825
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel827
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '822'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '824'
        hoofdstuk: III
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '826'
        hoofdstuk: III
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '825'
        hoofdstuk: III
        afdeling: '4'
  - number: '827.4'
    text: |-
      [Artikel 283 van Boek 3][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel283
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel827
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '283'
  - number: '828'
    text: |-
      Na de vorderingen genoemd in [artikel 827][ref1] zijn de vorderingen genoemd in de [artikelen 284][ref2] en
      [285 van Boek 3][ref3], voor zover zij dit niet zijn op grond van enig ander artikel van deze titel, op een
      binnenschip bij voorrang verhaalbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel827
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel284
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel285
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel828
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '827'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '284'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '285'
  - number: '829.1'
    text: |-
      De krachtens deze afdeling verleende voorrechten gaan te niet door verloop van een jaar, tenzij de schuldeiser zijn
      vordering in rechte geldend heeft gemaakt. Deze termijn begint met de aanvang van de dag volgend op die, waarop de
      vordering opeisbaar wordt. Met betrekking tot de vordering voor hulploon begint deze termijn echter met de aanvang
      van de dag volgend op die, waarop de hulpverlening is beëindigd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel829
  - number: '829.2'
    text: Het voorrecht gaat teniet met de vordering.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel829
  - number: '829.3'
    text: |-
      In geval van executoriale verkoop gaan de voorrechten mede teniet op het tijdstip waarop het procesverbaal van
      verdeling wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel829
  - number: '830'
    text: |-
      Deze afdeling geldt onder voorbehoud van [titel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel830
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: V
  - number: '831.1'
    text: |-
      In geval van uitwinning van zaken aan boord van een binnenschip worden de kosten van uitwinning, de kosten van
      bewaking daarvan tijdens deze uitwinning, alsmede de kosten van gerechtelijke rangregeling en verdeling van de
      opbrengst onder de schuldeisers, uit de opbrengst van de verkoop voldaan boven alle andere vorderingen, waaraan bij
      deze of enige andere wet een voorrecht is toegekend.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel831
  - number: '831.2'
    text: De in het vorige lid bedoelde vorderingen staan in rang gelijk en worden ponds-pondsgewijs betaald.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel831
  - number: '832.1'
    text: |-
      Op zaken aan boord van een binnenschip zijn de vorderingen ter zake van hulpverlening en van een bijdrage van
      die zaken in avarij-grosse bevoorrecht. Deze vorderingen nemen daartoe rang na die welke zijn genoemd in de
      [artikelen 210][ref1], [211][ref2], [221][ref3], [820][ref4], [821][ref5] en [831][ref6], doch vóór alle andere
      vorderingen, waaraan bij deze of enige andere wet een voorrecht is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel210
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel211
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel221
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel820
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Artikel821
      [ref6]: https://wetten.overheid.nl/BWBR0005034#Artikel831
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel832
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '210'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '211'
        hoofdstuk: II
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '221'
        hoofdstuk: II
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '820'
        hoofdstuk: III
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0005034
        artikel: '821'
        hoofdstuk: III
        afdeling: '4'
      - id: ref6
        bwb_id: BWBR0005034
        artikel: '831'
        hoofdstuk: III
        afdeling: '5'
  - number: '832.2'
    text: |-
      Op ten vervoer ontvangen zaken zijn bevoorrecht de vorderingen uit een met betrekking tot die zaken gesloten
      vervoerovereenkomst, dan wel uit [artikel 488][ref1] of [artikel 951][ref2] voortvloeiend, doch slechts voor
      zover aan de vervoerder door [artikel 489][ref3] of [artikel 954][ref4] een recht op de zaken wordt toegekend.
      Deze vorderingen nemen daartoe rang na die welke zijn genoemd in het eerste lid en in de [artikelen 204][ref5] en
      [794][ref6], doch vóór alle andere vorderingen, waaraan bij deze of enige andere wet een voorrecht is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel488
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel951
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel489
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel954
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Artikel204
      [ref6]: https://wetten.overheid.nl/BWBR0005034#Artikel794
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel832
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '488'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '951'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '489'
        hoofdstuk: II
        afdeling: '2'
      - id: ref4
