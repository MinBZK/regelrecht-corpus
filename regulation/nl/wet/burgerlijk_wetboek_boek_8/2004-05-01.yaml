  - number: '1718'
    text: |-
      In afwijking van [artikel 1717][ref1] begint de in [artikel 1711][ref2] genoemde termijn in geval van een
      rechtsvordering tot schadevergoeding, verschuldigd doordat aan een verplichting tot verwittigen of op de hoogte
      stellen niet werd voldaan, met de aanvang van de dag volgende op de dag waarop deze verplichting ontstond.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1717
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1711
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1718
    references:
