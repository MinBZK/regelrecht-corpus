        artikel: '954'
        hoofdstuk: III
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005034
        artikel: '204'
        hoofdstuk: II
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0005034
        artikel: '794'
        hoofdstuk: III
        afdeling: '2'
  - number: '833'
    text: |-
      Wanneer een vordering uit hoofde van [artikel 832][ref1] bevoorrecht is, zijn de renten hierop en de kosten
      teneinde een voor tenuitvoerlegging vatbare titel te verkrijgen gelijkelijk bevoorrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel832
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel833
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '832'
        hoofdstuk: III
        afdeling: '5'
  - number: '834.1'
    text: |-
      De vorderingen ter zake van hulpverlening of bijdrage in avarij-grosse, die bevoorrecht zijn op grond van
      [artikel 211][ref1], [artikel 222 eerste lid][ref2], [artikel 821][ref3] of [artikel 832 eerste lid][ref4], nemen
      onderling rang naar de omgekeerde volgorde van de tijdstippen, waarop zij ontstonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel211
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel222
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel821
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel832
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel834
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '211'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '222'
        hoofdstuk: II
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '821'
        hoofdstuk: III
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '832'
        hoofdstuk: III
        afdeling: '5'
  - number: '834.2'
    text: |-
      De bevoorrechte vorderingen in het tweede lid van [artikel 832][ref1] vermeld staan in rang gelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel832
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel834
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '832'
        hoofdstuk: III
        afdeling: '5'
  - number: '834.3'
    text: |-
      De in [artikel 284 van Boek 3][ref1] genoemde vordering neemt rang na de in de vorige leden genoemde vorderingen,
      ongeacht wanneer die vorderingen zijn ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel284
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel834
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '284'
  - number: '834.4'
    text: In rang gelijkstaande vorderingen worden ponds-pondsgewijs betaald.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel834
  - number: '835'
    text: |-
      De voorrechten, genoemd in [artikel 832][ref1], strekken zich uit tot de schadevergoedingen, verschuldigd
      voor verlies of niet herstelde beschadiging, daarbij inbegrepen dat deel van een beloning voor hulpverlening,
      van een beloning voor vlotbrengen of van een vergoeding in avarij-grosse, dat tegenover een zodanig verlies
      of beschadiging staat. Dit geldt eveneens wanneer deze schadevergoedingen of vorderingen tot beloning zijn
      overgedragen of met pandrecht zijn bezwaard. Deze schadevergoedingen omvatten echter niet vergoedingen, welke zijn
      verschuldigd krachtens een overeenkomst van verzekering die dekking geeft tegen het risico van verlies of avarij.
      [Artikel 283 van Boek 3][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel832
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel283
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel835
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '832'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '283'
  - number: '836'
    text: |-
      De in [artikel 832][ref1] genoemde vorderingen doen een voorrecht op de daar vermelde zaken ontstaan en zijn alsdan
      daarop bij voorrang verhaalbaar, ook al is hun eigenaar op het tijdstip, dat het voorrecht is ontstaan, niet de
      schuldenaar van deze vorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel832
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel836
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '832'
        hoofdstuk: III
        afdeling: '5'
  - number: '837.1'
    text: |-
      Met de aflevering van de zaken aan de daartoe gerechtigde gaan, behalve in het geval van [artikel 559][ref1], de
      in [artikel 832][ref2] genoemde voorrechten teniet. Zij gaan mede teniet met de vordering en door, in geval van
      executoriale verkoop, niet tijdig verzet te doen tegen de verdeling van de koopprijs alsmede door gerechtelijke
      rangregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel559
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel832
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel837
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '559'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '832'
        hoofdstuk: III
        afdeling: '5'
  - number: '837.2'
    text: |-
      Zij blijven in stand, zolang de zaken op grond van de [artikelen 490][ref1],
      [955][ref2] of [574][ref3] zijn opgeslagen of daarop op grond van [artikel 626][ref4] of
      [artikel 636 van het Wetboek van Burgerlijke Rechtsvordering][ref5] beslag is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel490
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel955
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel574
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel626
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel636
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel837
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '490'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '955'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '574'
        hoofdstuk: II
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '626'
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '636'
  - number: '838'
    text: |-
      De verkoper van brandstof voor de machines, van ketelwater, levensmiddelen of scheepsbenodigdheden kan het hem in
      [afdeling 8 van Titel 1 van Boek 7][ref1] toegekende recht slechts gedurende 48 uur na het einde van de levering
      uitoefenen, doch zulks ook indien deze zaken zich bevinden in handen van de eigenaar, de scheepshuurkoper, een
      rompbevrachter of een tijdbevrachter van het schip.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling8
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel838
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '8'
  - number: '840.1'
    text: |-
      De afdelingen 2 tot en met 5 van titel 8 zijn niet van toepassing op binnenschepen, welke toebehoren aan het Rijk
      of enig openbaar lichaam en uitsluitend bestemd zijn voor de uitoefening van
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel840
  - number: 840.1.a
    text: de openbare macht of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel840
  - number: 840.1.b
    text: niet-commerciële overheidsdienst.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel840
  - number: '840.2'
    text: |-
      De beschikking waarbij de in het eerste lid bedoelde bestemming is vastgesteld, kan worden ingeschreven in de
      openbare registers, bedoeld in [afdeling 2 van Titel 1 van Boek 3][ref1]. [Artikel 24 lid 1 van Boek 3][ref2] is
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel840
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '840.3'
    text: |-
      De inschrijving machtigt de bewaarder tot doorhaling van de teboekstelling van het schip in het in
      [artikel 783][ref1] bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel783
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel840
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '783'
        hoofdstuk: III
        afdeling: '2'
  - number: '841.1'
    text: |-
      Behoeven de in de [afdelingen 2 tot en met 6 van titel 8][ref1] geregelde onderwerpen in het belang van een
      goede uitvoering van de wet nadere regeling, dan geschiedt dit bij of krachtens algemene maatregel van bestuur,
      onverminderd de bevoegdheid tot regeling krachtens de [Kadasterwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0004541
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel841
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004541
  - number: '841.2'
    text: |-
      In de in het eerste lid bedoelde algemene maatregel van bestuur kan, in afwijking van
      [artikel 786 tweede lid][ref1], een nadere regeling worden gegeven met betrekking tot de termijn waarbinnen de
      eigenaar van een binnenschip, waarop het eerste lid onder *b* ten vijfde van dat artikel van toepassing is en
      waarvan de teboekstelling in het buitenlandse register heeft plaatsgevonden, voordat het Verdrag van Genève voor
      de staat van dat register van kracht is geworden, verplicht is tot het doen van aangifte tot doorhaling van de
      teboekstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel786
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel841
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '786'
        hoofdstuk: III
        afdeling: '2'
  - number: '860.1'
    text: |-
      De schipper is verplicht voor de belangen van de bevrachters en van de rechthebbenden op de aan boord zijnde zaken,
      zo mogelijk ook na lossing daarvan, te waken en de maatregelen die daartoe nodig zijn, te nemen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel860
  - number: '860.2'
    text: |-
      Indien het noodzakelijk is onverwijld ter behartiging van deze belangen rechtshandelingen te verrichten, is de
      schipper daartoe bevoegd. Onder rechtshandeling is hier het in ontvangst nemen van een verklaring begrepen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel860
  - number: '860.3'
    text: |-
      Voor zover mogelijk geeft hij van bijzondere voorvallen terstond kennis aan de belanghebbenden bij de betrokken
      goederen en handelt hij in overleg met hen en volgens hun orders.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel860
  - number: '861.1'
    text: |-
      Beperkingen van de wettelijke bevoegdheid van de schipper gelden tegen derden slechts wanneer die hun bekend zijn
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel861
  - number: '861.2'
    text: De schipper verbindt zichzelf slechts dan, wanneer hij de grenzen zijner bevoegdheid overschrijdt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel861
  - number: '880'
    text: |-
      Op de exploitatie van een binnenschip zijn de [artikelen 361 tot en met 366][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel361
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel880
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '361'
        hoofdstuk: II
        afdeling: '1'
  - number: '890.1'
    text: |-
      De overeenkomst van goederenvervoer in de zin van deze titel is de overeenkomst van goederenvervoer, al dan
      niet tijd- of reisbevrachting zijnde, waarbij de ene partij (de vervoerder) zich tegenover de andere partij (de
      afzender) verbindt aan boord van een schip zaken uitsluitend over binnenwateren te vervoeren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel890
  - number: '890.2'
    text: |-
      Vervoer over zee en binnenwateren aan boord van een en eenzelfde schip, dat deze beide wateren bevaart, wordt als
      vervoer over binnenwateren beschouwd, mits het varen van dit schip over zee kennelijk ondergeschikt is aan het
      varen over binnenwateren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel890
  - number: '890.3'
    text: |-
      Vervoer over zee en binnenwateren aan boord van een en eenzelfde schip, dat zonder eigen beweegkracht deze beide
      wateren bevaart, wordt beschouwd als vervoer over binnenwateren voor zover, met inachtneming tevens van het
      tweede lid van dit artikel, het varen van het beweegkracht overbrengende schip als varen over binnenwateren wordt
      beschouwd. Voor zover dit niet het geval is, wordt het als vervoer over zee beschouwd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel890
  - number: '890.4'
    text: |-
      Deze afdeling is niet van toepassing op overeenkomsten tot het vervoeren van postzendingen door of in opdracht
      van de houder van de concessie, bedoeld in de [Postwet][ref1] of onder een internationale postovereenkomst. Onder
      voorbehoud van artikel 980 is deze afdeling niet van toepassing op overeenkomsten tot het vervoeren van bagage.


      [ref1]: https://wetten.overheid.nl/BWBR0004423
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel890
    references:
      - id: ref1
        bwb_id: BWBR0004423
  - number: '891'
    text: |-
      Deze afdeling laat de [titels 7][ref1] en [12][ref2] van dit boek onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel891
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005034
        hoofdstuk: III
  - number: '892.1'
    text: |-
      Tijd- of reisbevrachting in de zin van deze afdeling is de overeenkomst van goederenvervoer, waarbij de vervoerder
      zich verbindt tot vervoer aan boord van een schip, dat hij daartoe, anders dan bij wijze van rompbevrachting,
      geheel of gedeeltelijk en al dan niet op tijdbasis (tijdbevrachting of reisbevrachting) ter beschikking stelt van
      de afzender.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel892
  - number: '892.2'
    text: De overeenkomst van vletten is de tijdbevrachting strekkende tot vervoer van zaken binnen een havencomplex.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel892
  - number: '892.3'
    text: Ruimtebevrachting is de reisbevrachting tegen een naar inhoud van het schip bepaalde vracht.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel892
  - number: '892.4'
    text: |-
      Onder "vervrachter" is in deze afdeling de in het eerste lid genoemde vervoerder, onder "bevrachter" de aldaar
      genoemde afzender te verstaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel892
  - number: '893'
    text: |-
      De wetsbepalingen omtrent huur, bewaarneming en bruikleen zijn op terbeschikkingstelling van een schip, anders dan
      bij wijze van rompbevrachting, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel893
  - number: '894.1'
    text: |-
      Bij eigendomsovergang van een tevoren vervracht, al dan niet teboekstaand, schip op een derde volgt deze in alle
      rechten en verplichtingen van de vervrachter op, die nochtans naast de nieuwe eigenaar aan de overeenkomst gebonden
      blijft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel894
  - number: '894.2'
    text: Rechten en verplichtingen, welke vóór de eigendomsovergang opeisbaar zijn geworden, gaan op de derde niet over.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel894
  - number: '895'
    text: |-
      De vervoerder is verplicht ten vervoer ontvangen zaken ter bestemming af te leveren en wel in de staat waarin hij
      hen heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel895
  - number: '896'
    text: |-
      Onverminderd [artikel 895][ref1] is de vervoerder verplicht ten vervoer ontvangen zaken zonder vertraging te
      vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel895
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel896
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '895'
        hoofdstuk: III
        afdeling: '2'
  - number: '897.1'
    text: |-
      In geval van tijdbevrachting is de vervrachter verplicht de schipper opdracht te geven binnen de grenzen door de
      overeenkomst gesteld de orders van de bevrachter op te volgen. De vervrachter staat er voor in, dat de schipper de
      hem gegeven opdracht nakomt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel897
  - number: '897.2'
    text: |-
      De bevrachter staat er voor in, dat het schip de plekken of plaatsen, waarheen hij het ter inlading, lossing
      of anderszins op grond van het eerste lid beveelt te gaan, veilig kan bereiken, innemen en verlaten. Indien
      deze plekken of plaatsen blijken niet aan deze vereisten te voldoen, is de bevrachter slechts in zoverre niet
      aansprakelijk als de schipper, door de hem gegeven orders op te volgen, onredelijk handelde.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel897
  - number: '897.3'
    text: |-
      Onverminderd [artikel 943][ref1] wordt de bevrachter mede verbonden door en kan hij rechten ontlenen aan een
      rechtshandeling, die de schipper ingevolge het eerste lid van dit artikel verricht. Onder rechtshandeling is hier
      het in ontvangst nemen van een verklaring begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel943
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel897
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '943'
        hoofdstuk: III
        afdeling: '2'
  - number: '898.1'
    text: |-
      De vervoerder is niet aansprakelijk voor schade ontstaan door een beschadiging, voor zover deze is veroorzaakt door
      een omstandigheid die een zorgvuldig vervoerder niet heeft kunnen vermijden en voor zover zulk een vervoerder de
      gevolgen daarvan niet heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel898
  - number: '898.2'
    text: |-
      Ten aanzien van deugdelijkheid en geschiktheid van het schip en van het materiaal, waarvan hij zich bedient of die
      hij ter beschikking stelt, is van de vervoerder de zorg vereist van een zorgvuldig vervoerder, die aan boord van
      eigen schip vervoert en gebruik maakt van eigen materiaal. Voor ondeugdelijkheid of ongeschiktheid van materiaal,
      dat door afzender of ontvanger ter beschikking van de vervoerder is gesteld, is de vervoerder niet aansprakelijk,
      voor zover een zorgvuldig vervoerder zich van zulk materiaal zou hebben bediend.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel898
  - number: '898.3'
    text: |-
      Onder beschadiging worden mede verstaan geheel of gedeeltelijk verlies van zaken, vertraging, alsmede ieder ander
      schade veroorzakend feit.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel898
  - number: '899'
    text: 'Vermoed wordt dat een zorgvuldig vervoerder de volgende omstandigheden niet heeft kunnen vermijden:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel899
  - number: 899.a
    text: brand;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel899
  - number: 899.b
    text: ontploffing;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel899
  - number: 899.c
    text: hitte;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel899
  - number: 899.d
    text: koude;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel899
  - number: 899.e
    text: optreden van knaagdieren of ongedierte;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel899
  - number: 899.f
    text: bederf;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel899
  - number: 899.g
    text: lekkage;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel899
  - number: 899.h
    text: smelting;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel899
  - number: 899.i
    text: ontvlamming;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel899
  - number: 899.j
    text: corrosie.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel899
  - number: '900'
    text: |-
      Wanneer vervoerde zaken een beschadiging of een verlies lijden, waaraan zij door hun aard licht onderhevig
      zijn, wanneer levende dieren doodgaan of beschadigd worden, of wanneer door de afzender in een laadkist gestuwde
      zaken bij onbeschadigde laadkist een beschadiging of een verlies lijden, wordt vermoed dat de vervoerder noch
      de omstandigheid die deze beschadiging of dit verlies veroorzaakte heeft kunnen vermijden, noch heeft kunnen
      verhinderen, dat deze omstandigheid tot deze beschadiging of dit verlies leidde.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel900
  - number: '901.1'
    text: |-
      De vervoerder is niet aansprakelijk voor schade ontstaan door een beschadiging voor zover deze, hoe dan ook,
      is veroorzaakt door een handeling, onachtzaamheid of nalatigheid van één of meer opvarenden van het schip, de
      sleepboot of de duwboot, gepleegd bij de navigatie daarvan, tenzij de navigatiefout niet zou zijn gemaakt indien
      de vervoerder bij de keuze van deze personen gehandeld zou hebben als van een zorgvuldig vervoerder mag worden
      verwacht. Het in de vorige zin bepaalde geldt ook voor zover de beschadiging mede werd veroorzaakt door een na de
      navigatiefout opgekomen omstandigheid, die een zorgvuldig vervoerder heeft kunnen vermijden of waarvan zulk een
      vervoerder de gevolgen heeft kunnen verhinderen. Fouten gepleegd bij het samenstellen van een sleep of van een
      duweenheid zijn navigatiefouten als hier bedoeld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel901
  - number: '901.2'
    text: |-
      Voor schade ontstaan door eigen navigatiefouten is de vervoerder slechts aansprakelijk, wanneer hij deze
      beging hetzij met het opzet die schade te veroorzaken, hetzij roekeloos en met de wetenschap dat die schade er
      waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel901
  - number: '901.3'
    text: |-
      Onder beschadiging worden mede verstaan geheel of gedeeltelijk verlies van zaken, vertraging, alsmede ieder ander
      schade veroorzakend feit.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel901
  - number: '902.1'
    text: |-
      Nietig is ieder beding, waarbij de ingevolge artikel 895 op de vervoerder drukkende aansprakelijkheid of bewijslast
      op andere wijze wordt verminderd dan in deze afdeling is voorzien, tenzij het betreft:
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel902
  - number: 902.1.a
    text: |-
      beschadiging opgekomen vóór of voortvloeiend uit een omstandigheid liggend vóór het laden in of na het lossen uit
      het schip;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel902
  - number: 902.1.b
    text: |-
      het vervoer van zaken, die door hun karakter of gesteldheid een bijzondere overeenkomst rechtvaardigen en welker
      vervoer moet geschieden onder omstandigheden of op voorwaarden, die een bijzondere overeenkomst rechtvaardigen.
      Het hier bepaalde geldt echter slechts, wanneer voor het vervoer van deze zaken geen cognossement aan order of
      toonder, doch een blijkens zijn bewoordingen onverhandelbaar document is afgegeven en het niet betreft een gewone
      handelslading, verscheept bij gelegenheid van een gewone handelsverrichting.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel902
  - number: '902.2'
    text: |-
      In afwijking van het eerste lid staat het partijen vrij bij een in het bijzonder ten aanzien van het voorgenomen
      vervoer aangegane en in een afzonderlijk, niet naar in een ander geschrift voorkomende bedingen verwijzend,
      geschrift neergelegde overeenkomst te bedingen dat de vervoerder niet aansprakelijk is voor schade ontstaan door
      een beschadiging, voor zover deze is veroorzaakt door een in die overeenkomst ondubbelzinnig omschreven wijze van
      behandeling der zaken dan wel ondeugdelijkheid of ongeschiktheid van schip of materiaal. Ondanks zulk een beding
      blijft de vervoerder aansprakelijk voor door de omschreven wijze van behandeling dan wel ondeugdelijkheid of
      ongeschiktheid veroorzaakte beschadiging, voor zover een zorgvuldig vervoerder deze had kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel902
  - number: '902.3'
    text: |-
      Wordt voor het vervoer een cognossement of ander document afgegeven, dan moet, op straffe van nietigheid van een
      beding als bedoeld in het tweede lid, daarin uitdrukkelijk worden verwezen naar dit afzonderlijke geschrift.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel902
  - number: '902.4'
    text: Onder beschadiging worden mede verstaan niet-aflevering en geheel of gedeeltelijk verlies van zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel902
  - number: '903.1'
    text: |-
      Voor zover de vervoerder aansprakelijk is wegens niet nakomen van de op hem uit hoofde van de [artikelen 895][ref1]
      en [896][ref2] rustende verplichtingen, heeft de afzender geen ander recht dan betaling te vorderen van een bedrag,
      dat wordt berekend met inachtneming van de waarde welke zaken als de ten vervoer ontvangene zouden hebben gehad
      zoals, ten tijde waarop en ter plaatse waar, zij zijn afgeleverd of zij hadden moeten zijn afgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel895
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel896
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel903
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '895'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '896'
        hoofdstuk: III
        afdeling: '2'
  - number: '903.2'
    text: |-
      De in het eerste lid genoemde waarde wordt berekend naar de koers op de goederenbeurs of, wanneer er geen
      dergelijke koers is, naar de gangbare marktwaarde of, wanneer ook deze ontbreekt, naar de normale waarde van zaken
      van dezelfde aard en hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel903
  - number: '903.3'
    text: |-
      De vervoerder is in geen geval aansprakelijk voor verlies of schade van of aan zaken of met betrekking tot deze,
      indien aard of waarde daarvan door de afzender opzettelijk verkeerdelijk is opgegeven en, indien een cognossement
      is afgegeven, daarin verkeerdelijk is opgenomen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel903
  - number: '903.4'
    text: Nietig is ieder beding, waarbij van dit artikel ten nadele van de vervoerder wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel903
  - number: '904.1'
    text: |-
      Indien met betrekking tot een zaak hulploon, een bijdrage in avarij-grosse of een schadevergoeding uit hoofde van
      [artikel 951][ref1] is verschuldigd, wordt deze aangemerkt als een waardevermindering van die zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel951
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel904
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '951'
        hoofdstuk: III
        afdeling: '2'
  - number: '904.2'
    text: Nietig is ieder beding, waarbij van dit artikel ten nadele van de vervoerder wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel904
  - number: '905.1'
    text: |-
      Voor zover de vervoerder aansprakelijk is wegens niet nakomen van de op hem uit hoofde van de [artikelen 895][ref1]
      en [896][ref2] rustende verplichtingen, is hij niet aansprakelijk boven bij of krachtens algemene maatregel van
      bestuur te bepalen bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel895
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel896
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel905
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '895'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '896'
        hoofdstuk: III
        afdeling: '2'
  - number: '905.2'
    text: Nietig is ieder beding, waarbij van dit artikel ten nadele van de vervoerder wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel905
  - number: '906.1'
    text: |-
      De vervoerder kan zich niet beroepen op enige beperking van zijn aansprakelijkheid, voor zover de schade is
      ontstaan uit zijn eigen handeling of nalaten, geschied hetzij met het opzet die schade te veroorzaken, hetzij
      roekeloos en met de wetenschap dat die schade er waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel906
  - number: '906.2'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel906
  - number: '907'
    text: |-
      De afzender is verplicht de vervoerder de schade te vergoeden die deze lijdt doordat de overeengekomen zaken, door
      welke oorzaak dan ook, niet op de overeengekomen plaats en tijd te zijner beschikking zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel907
  - number: '908.1'
    text: Alvorens zaken ter beschikking van de vervoerder zijn gesteld, is de afzender bevoegd de overeenkomst op te zeggen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel908
  - number: '908.2'
    text: |-
      Zijn bij het verstrijken van de tijd, waarbinnen de zaken ter beschikking van de vervoerder moeten zijn gesteld,
      door welke oorzaak dan ook, in het geheel geen zaken ter beschikking van de vervoerder, dan is deze, zonder dat
      enige ingebrekestelling is vereist, bevoegd de overeenkomst op te zeggen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel908
  - number: '908.3'
    text: |-
      Zijn bij het verstrijken van de in het tweede lid bedoelde tijd, door welke oorzaak dan ook, de overeengekomen
      zaken slechts gedeeltelijk ter beschikking van de vervoerder dan is deze, zonder dat enige ingebrekestelling is
      vereist, bevoegd de overeenkomst op te zeggen dan wel de reis te aanvaarden. De afzender is op verlangen van de
      vervoerder in geval van opzegging van de overeenkomst verplicht tot lossing van de reeds gestuwde zaken of, in
      geval de vervoerder de reis aanvaardt en het vertrek van het schip zonder herstuwing van de reeds gestuwde zaken
      niet mogelijk is, tot deze herstuwing.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel908
  - number: '908.4'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving of enig ander bericht, waarvan de
      ontvangst duidelijk aantoonbaar is en de overeenkomst eindigt op het ogenblik van ontvangst, doch niet vóór lossing
      van de zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel908
  - number: '908.5'
    text: |-
      De afzender is verplicht de vervoerder de schade te vergoeden die deze lijdt tengevolge van de opzegging, van de
      aanvaarding van de reis, dan wel van lossing of herstuwing van reeds ingenomen zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel908
  - number: '908.6'
    text: Dit artikel is niet van toepassing in geval van tijdbevrachting.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel908
  - number: '909.1'
    text: |-
      In geval van reisbevrachting is de vervrachter na ontvangst van wat hij van de bevrachter heeft te vorderen,
      op diens verlangen verplicht de reis te aanvaarden met een gedeelte der overeengekomen zaken. De bevrachter is
      verplicht de vervrachter de vracht over de niet ter beschikking gestelde zaken vóór het begin van het vervoer te
      voldoen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel909
  - number: '909.2'
    text: |-
      De vervrachter is bevoegd in plaats van de ontbrekende zaken andere aan te nemen. Hij is niet gehouden de
      vracht, die hij voor het vervoer van deze zaken ontvangt, met de bevrachter te verrekenen, behalve voor zover hij
      zijnerzijds van de bevrachter vracht over niet ter beschikking gestelde zaken heeft geïnd of gevorderd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel909
  - number: '909.3'
    text: |-
      Is vertrek niet mogelijk zonder herstuwing van de reeds gestuwde zaken, dan is de bevrachter op verlangen van de
      vervrachter tot deze herstuwing verplicht. Hij is bovendien verplicht de vervrachter de schade te vergoeden die
      deze door herstuwing van reeds ingenomen zaken lijdt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel909
  - number: '910.1'
    text: |-
      De afzender is verplicht de vervoerder omtrent de zaken alsmede omtrent de behandeling daarvan tijdig al die
      opgaven te doen, waartoe hij in staat is of behoort te zijn, en waarvan hij weet of behoort te weten, dat zij voor
      de vervoerder van belang zijn, tenzij hij mag aannemen dat de vervoerder deze gegevens kent.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel910
  - number: '910.2'
    text: |-
      De vervoerder is niet gehouden, doch wel gerechtigd, te onderzoeken of de hem gedane opgaven juist en volledig
      zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel910
  - number: '910.3'
    text: |-
      Is bij het verstrijken van de tijd, waarbinnen de zaken ter beschikking van de vervoerder moeten zijn
      gesteld, door welke oorzaak dan ook, niet of slechts gedeeltelijk voldaan aan de in het eerste lid van
      dit artikel genoemde verplichting van de afzender, dan zijn, behalve in het geval van tijdbevrachting, het
      [tweede, derde, vierde en vijfde lid van artikel 908][ref1] en het [vijfde lid van artikel 911][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel908
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel911
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel910
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '908'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '911'
        hoofdstuk: III
        afdeling: '2'
  - number: '911.1'
    text: |-
      De afzender is verplicht de vervoerder de schade te vergoeden die deze lijdt doordat, door welke oorzaak dan
      ook, niet naar behoren aanwezig zijn de documenten en inlichtingen, die van de zijde van de afzender vereist
      zijn voor het vervoer dan wel ter voldoening aan vóór de aflevering van de zaken te vervullen douane- en andere
      formaliteiten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel911
  - number: '911.2'
    text: |-
      De vervoerder is verplicht redelijke zorg aan te wenden dat de documenten, die in zijn handen zijn gesteld,
      niet verloren gaan of onjuist worden behandeld. Een door hem terzake verschuldigde schadevergoeding zal die,
      verschuldigd uit hoofde van de [artikelen 903 tot en met 906][ref1] in geval van verlies van de zaken, niet
      overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel903
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel911
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '903'
        hoofdstuk: III
        afdeling: '2'
  - number: '911.3'
    text: |-
      De vervoerder is niet gehouden, doch wel gerechtigd, te onderzoeken of de hem gedane opgaven juist en volledig
      zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel911
  - number: '911.4'
    text: |-
      Zijn bij het verstrijken van de tijd waarbinnen de in het eerste lid genoemde documenten en inlichtingen aanwezig
      moeten zijn, deze, door welke oorzaak dan ook, niet naar behoren aanwezig, dan zijn, behalve in het geval van
      tijdbevrachting, het [tweede, derde, vierde en vijfde lid van artikel 908][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel908
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel911
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '908'
        hoofdstuk: III
        afdeling: '2'
  - number: '911.5'
    text: |-
      Indien door het niet naar behoren aanwezig zijn van de in dit artikel bedoelde documenten of inlichtingen vervoer
      van zaken van de betrokken of van een andere afzender op de onderhavige reis wordt verlengd ten gevolge van
      vertraging in de aanvang of het verloop daarvan, zal de schadevergoeding niet minder bedragen dan het overliggeld
      over het aantal uren, waarmee het vervoer is verlengd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel911
  - number: '912.1'
    text: |-
      Wanneer vóór of bij de aanbieding van de zaken aan de vervoerder omstandigheden aan de zijde van een der partijen
      zich opdoen of naar voren komen, die haar wederpartij bij het sluiten van de overeenkomst niet behoefde te
      kennen, doch die, indien zij haar wel bekend waren geweest, redelijkerwijs voor haar grond hadden opgeleverd de
      vervoerovereenkomst niet of op andere voorwaarden aan te gaan, is deze wederpartij bevoegd de overeenkomst op te
      zeggen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel912
  - number: '912.2'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving of enig ander bericht, waarvan de
      ontvangst duidelijk aantoonbaar is en de overeenkomst eindigt op het ogenblik van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel912
  - number: '912.3'
    text: |-
      Naar maatstaven van redelijkheid en billijkheid zijn partijen na opzegging der overeenkomst verplicht elkaar de
      daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel912
  - number: '913.1'
    text: |-
      De afzender is verplicht de vervoerder de schade te vergoeden, die materiaal, dat hij deze ter beschikking stelde
      of zaken die deze ten vervoer ontving dan wel de behandeling daarvan, de vervoerder berokkenden, behalve voor zover
      deze schade is veroorzaakt door een omstandigheid die een zorgvuldig afzender van de ten vervoer ontvangen zaken
      niet heeft kunnen vermijden en waarvan zulk een afzender de gevolgen niet heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel913
  - number: '913.2'
    text: |-
      Dit artikel laat [artikel 914][ref1] en de bepalingen nopens avarij-grosse onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel914
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel913
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '914'
        hoofdstuk: III
        afdeling: '2'
  - number: '914.1'
    text: |-
      Ten vervoer ontvangen zaken, die een zorgvuldig vervoerder, indien hij geweten zou hebben dat zij na hun
      inontvangstneming gevaar zouden kunnen opleveren, met het oog daarop niet ten vervoer zou hebben willen ontvangen,
      mogen door hem op ieder ogenblik en op iedere plaats worden gelost, vernietigd dan wel op andere wijze onschadelijk
      gemaakt. Ten aanzien van ten vervoer ontvangen zaken, waarvan de vervoerder de gevaarlijkheid heeft gekend, geldt
      hetzelfde doch slechts dan wanneer zij onmiddellijk dreigend gevaar opleveren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel914
  - number: '914.2'
    text: |-
      Indien de vervoerder op grond van het eerste lid gerechtigd is tot lossen, vernietigen of op andere wijze
      onschadelijk maken van zaken, is de afzender op verlangen van de vervoerder en wanneer hem dit redelijkerwijs
      mogelijk is, verplicht deze maatregel te nemen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel914
  - number: '914.3'
    text: |-
      Door het treffen van de in het eerste of tweede lid bedoelde maatregel eindigt de overeenkomst met betrekking tot
      de daar genoemde zaken, doch, indien deze alsnog worden gelost, eerst na deze lossing. De vervoerder verwittigt zo
      mogelijk de afzender, degeen aan wie de zaken moeten worden afgeleverd en degeen, aan wie hij volgens de bepalingen
      van een mogelijkerwijs afgegeven vrachtbrief of cognossement bericht van aankomst van het schip moet zenden. Dit
      lid is niet van toepassing met betrekking tot zaken die de vervoerder na het treffen van de in het eerste of tweede
      lid bedoelde maatregel alsnog naar hun bestemming vervoert.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel914
  - number: '914.4'
    text: |-
      Naar maatstaven van redelijkheid en billijkheid zijn partijen na beëindiging van de overeenkomst verplicht elkaar
      de daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel914
  - number: '914.5'
    text: |-
      Indien zaken na beëindiging van de overeenkomst alsnog in feite worden afgeleverd, wordt vermoed, dat zij zich op
      het ogenblik van beëindiging van de overeenkomst bevonden in de staat, waarin zij feitelijk zijn afgeleverd; worden
      zij niet afgeleverd, dan wordt vermoed, dat zij op het ogenblik van beëindiging van de overeenkomst verloren zijn
      gegaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel914
  - number: '914.6'
    text: |-
      Indien de afzender na feitelijke aflevering een zaak niet naar haar bestemming vervoert, wordt het
      verschil tussen de waarden ter bestemming en ter plaatse van de aflevering, beide als bedoeld in het
      [tweede lid van artikel 903][ref1], aangemerkt als waardevermindering van die zaak. Vervoert de afzender een
      zaak na de feitelijke aflevering alsnog naar haar bestemming, dan worden de kosten die hij te dien einde maakt
      aangemerkt als waardevermindering van die zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel903
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel914
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '903'
        hoofdstuk: III
        afdeling: '2'
  - number: '914.7'
    text: |-
      Op de feitelijke aflevering is het tussen partijen overeengekomene alsmede het in deze afdeling nopens de
      aflevering van zaken bepaalde van toepassing, met dien verstande, dat deze feitelijke aflevering niet op grond van
      de tweede zin van het eerste lid of op grond van het derde lid van [artikel 947][ref1] de vracht verschuldigd doet
      zijn. De [artikelen 955][ref2], [956][ref3] en [957][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel947
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel955
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel956
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel957
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel914
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '947'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '955'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '956'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '957'
        hoofdstuk: III
        afdeling: '2'
  - number: '914.8'
    text: Dit artikel laat de bepalingen nopens avarij-grosse onverlet.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel914
  - number: '914.9'
    text: Nietig is ieder beding, waarbij van het eerste of het tweede lid van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel914
  - number: '915.1'
    text: |-
      Zowel de afzender als de vervoerder kunnen terzake van het vervoer een document (vrachtbrief) opmaken en verlangen
      dat dit of een mogelijkerwijs door hun wederpartij opgemaakt document, door hun wederpartij wordt getekend en aan
      hen wordt afgegeven. Dit document kan noch aan order noch aan toonder worden gesteld. De ondertekening kan worden
      gedrukt of door een stempel dan wel enig ander kenmerk van oorsprong worden vervangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel915
  - number: '915.2'
    text: 'In de vrachtbrief worden aan de hand van door de afzender te verstrekken gegevens vermeld:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel915
  - number: 915.2.a
    text: de ten vervoer ontvangen zaken,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel915
  - number: 915.2.b
    text: de plaats waar de vervoerder de zaken ten vervoer heeft ontvangen,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel915
  - number: 915.2.c
    text: de plaats waarheen de vervoerder op zich neemt de zaken te vervoeren,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel915
  - number: 915.2.d
    text: de geadresseerde,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel915
  - number: 915.2.e
    text: de vracht,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel915
  - number: 915.2.f
    text: al hetgeen overigens aan afzender en vervoerder gezamenlijk goeddunkt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel915
  - number: '915.3'
    text: |-
      Ondertekening door de afzender houdt op zichzelf niet in, dat hij de juistheid erkent van de aantekeningen die de
      vervoerder op de vrachtbrief ten aanzien van de zaken plaatste.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel915
  - number: '916.1'
    text: |-
      Op verlangen van de afzender, geuit voor de inlading een aanvang neemt, is de vervoerder verplicht voor zaken,
      die hij ten vervoer ontving, een cognossement op te maken, te dateren, te ondertekenen en tegen intrekking van een
      ontvangstbewijs of ligcognossement, dat door hem mocht zijn afgegeven, aan de afzender af te geven. De afzender
      is verplicht de gegevens, die nodig zijn voor het opmaken van het cognossement te verstrekken en staat in voor
      de juistheid daarvan op het ogenblik van de inontvangstneming van de zaken. Op verlangen van de vervoerder is
      de afzender verplicht het cognossement mede te ondertekenen of hem een ondertekend afschrift daarvan ter hand te
      stellen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel916
  - number: '916.2'
    text: |-
      Wanneer de zaken voor zij ten vervoer zijn ingeladen door de vervoerder worden ontvangen, is deze op verlangen van
      de afzender verplicht een ontvangstbewijs of een voorlopig cognossement op te maken, te dateren, te ondertekenen en
      af te geven. De afzender is verplicht de gegevens, die nodig zijn voor het opmaken van dit document, te verstrekken
      en hij staat in voor de juistheid daarvan op het ogenblik van de inontvangstneming van de zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel916
  - number: '916.3'
    text: |-
      Nadat de inlading is voltooid, is de vervoerder op verlangen van de afzender verplicht een dergelijk voorlopig
      cognossement hetzij om te ruilen tegen een cognossement, als in het eerste lid bedoeld, hetzij op het voorlopige
      cognossement de naam van het schip of de schepen, aan boord waarvan de zaken werden geladen, en de datum of de data
      van de inlading aan te tekenen en vervolgens deze gegevens te ondertekenen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel916
  - number: '916.4'
    text: De ondertekening kan worden gedrukt of door een stempel dan wel enig ander kenmerk van oorsprong worden vervangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel916
  - number: '917'
    text: |-
      Indien een vervoerovereenkomst is gesloten en bovendien een cognossement is afgegeven, wordt, behoudens
      [artikel 940 tweede lid, tweede volzin][ref1], de rechtsverhouding tussen de vervoerder en de afzender door
      de bedingen van de vervoerovereenkomst en niet door die van dit cognossement beheerst. Behoudens het in
      [artikel 940 eerste lid][ref2] gestelde vereiste van houderschap van het cognossement, strekt dit hun dan slechts
      tot bewijs van de ontvangst der zaken door de vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel940
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel940
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel917
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '940'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '940'
        hoofdstuk: III
        afdeling: '2'
  - number: '918'
    text: |-
      Het cognossement, voor zover het geen ligcognossement is, vermeldt de ten vervoer ontvangen zaken, de plaats waar
      de vervoerder hen ten vervoer heeft ontvangen, de plaats waarheen de vervoerder op zich neemt hen te vervoeren, het
      schip aan boord waarvan de zaken worden geladen, en de geadresseerde.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel918
  - number: '919.1'
    text: |-
      In het cognossement wordt de geadresseerde, ter keuze van de afzender, aangegeven hetzij bij name of andere
      aanduiding, hetzij als order van de afzender of van een ander, hetzij als toonder. Op verlangen van de vervoerder
      wordt vermeld aan wie deze kennis kan geven dat hij gereed is te lossen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel919
  - number: '919.2'
    text: De enkele woorden "aan order" worden geacht de order van de afzender aan te geven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel919
  - number: '920'
    text: |-
      De verhandelbare exemplaren van een cognossement, waarin is vermeld hoeveel van deze exemplaren in het geheel zijn
      afgegeven, gelden alle voor één en één voor alle.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel920
  - number: '921.1'
    text: |-
      Het cognossement bewijst, behoudens tegenbewijs, dat de vervoerder de zaken heeft ontvangen en wel wat hun aard
      betreft, zoals deze daarin in het algemeen zijn omschreven en overigens zoals deze daarin naar aantal, gewicht of
      maat zijn vermeld. Tegenbewijs tegen het cognossement wordt niet toegelaten, wanneer het is overgedragen aan een
      derde te goeder trouw.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel921
  - number: '921.2'
    text: |-
      Indien in het cognossement de clausule: "aard, aantal, maat of gewicht onbekend" of enige andere clausule van
      dergelijke strekking is opgenomen, binden zodanige in het cognossement voorkomende vermeldingen omtrent de zaken de
      vervoerder niet, tenzij bewezen wordt, dat hij de aard, het aantal, de maat of het gewicht der zaken heeft gekend
      of had behoren te kennen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel921
  - number: '921.3'
    text: |-
      Een cognossement, dat de uiterlijk zichtbare staat of gesteldheid van de zaak niet vermeldt, levert, behoudens
      tegenbewijs dat ook jegens een derde mogelijk is, een vermoeden op dat de vervoerder die zaak voor zover uiterlijk
      zichtbaar in goede staat of gesteldheid heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel921
  - number: '921.4'
    text: |-
      Ondertekening door de afzender van het cognossement of van een afschrift daarvan houdt op zichzelf niet in, dat hij
      de juistheid erkent van de aantekeningen die de vervoerder daarop ten aanzien van de zaken plaatste.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel921
  - number: '922.1'
    text: |-
      Verwijzingen in het cognossement worden geacht slechts die bedingen daarin in te voegen, die voor degeen, jegens
      wie daarop een beroep wordt gedaan, duidelijk kenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel922
  - number: '922.2'
    text: |-
      Een dergelijk beroep is slechts mogelijk voor hem, die op schriftelijk verlangen van degeen jegens wie dit beroep
      kan worden gedaan of wordt gedaan, aan deze onverwijld die bedingen heeft doen toekomen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel922
  - number: '922.3'
    text: Nietig is ieder beding, waarbij van het tweede lid van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel922
  - number: '923'
    text: |-
      Een cognossement aan order wordt geleverd op de wijze als aangegeven in [afdeling 2 van Titel 4 van Boek 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel923
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '924'
    text: |-
      Levering van het cognossement vòòr de aflevering van de daarin vermelde zaken door de vervoerder geldt als levering
      van die zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel924
  - number: '925'
    text: |-
      De vervoerder is verplicht de plek van inlading en lossing tijdig aan te wijzen; in geval van tijdbevrachting is
      echter [artikel 897][ref1] van toepassing en in geval van reisbevrachting [artikel 926][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel897
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel926
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel925
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '897'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '926'
        hoofdstuk: III
        afdeling: '2'
  - number: '926.1'
    text: In geval van reisbevrachting is de bevrachter verplicht de plek van inlading en lossing tijdig aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel926
  - number: '926.2'
    text: |-
      Hij moet daartoe aanwijzen een plek, waar het schip veilig kan komen, liggen, laden of lossen en waarvandaan het
      veilig kan vertrekken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel926
  - number: '926.3'
    text: |-
      Indien de aangewezen plek niet beschikbaar is, lopen laad- en lostijd zoals zij gelopen zouden hebben wanneer deze
      plek wel beschikbaar zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel926
  - number: '926.4'
    text: |-
      Wanneer de bevrachter niet aan deze verplichting voldoet, is de vervrachter zonder dat enige aanmaning is vereist
      bevoegd zelf de plek van inlading of lossing aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel926
  - number: '926.5'
    text: |-
      Indien de bevrachter meer dan één plek aanwijst, geldt de tijd nodig voor het verhalen als gebruikte laad- of
      lostijd. De kosten van verhalen zijn voor zijn rekening.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel926
  - number: '926.6'
    text: |-
      De bevrachter staat er voor in, dat het schip op de plek, die hij op grond van het eerste lid ter inlading of
      lossing aanwijst, veilig kan komen, liggen, laden of lossen en daarvandaan veilig kan vertrekken. Indien deze plek
      blijkt niet aan deze vereisten te voldoen, is de bevrachter slechts in zoverre niet aansprakelijk als de schipper,
      door de hem gegeven aanwijzing op te volgen, onredelijk handelde.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel926
  - number: '927'
    text: |-
      Wanneer in geval van reisbevrachting de bevrachter de bevoegdheid heeft laad- of loshaven nader aan te wijzen, is
      [artikel 926][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel926
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel927
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '926'
        hoofdstuk: III
        afdeling: '2'
  - number: '928'
    text: |-
      In geval van ruimtebevrachting zijn alle kosten en tijdverlet, veroorzaakt om het schip de plek waar het ter
      beschikking moet worden gesteld te doen bereiken, ten laste van de bevrachter. De vergoeding voor tijdverlet zal
      niet minder bedragen dan het overliggeld voor de gebezigde uren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel928
  - number: '929.1'
    text: De vervoerder is verplicht het schip ter inlading en ter lossing beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel929
  - number: '929.2'
    text: |-
      De afzender is verplicht de zaken aan boord van het schip te laden en te stuwen en de ontvanger is verplicht hen
      uit het schip te lossen. Wanneer de vervoerder daarbij aanwijzingen geeft voor de veiligheid van de vaart of ter
      voorkoming van schade zijn zij verplicht deze op te volgen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel929
  - number: '930.1'
    text: |-
      De laadtijd gaat in op de dag volgende op die waarop de vervoerder aan de afzender of aan een door deze aangewezen
      persoon het schip heeft gemeld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel930
  - number: '930.2'
    text: |-
      Indien het de afzender bekend is, dat het schip zich op de dag van het sluiten van de overeenkomst in de laadplaats
      bevindt, wordt de vervoerder beschouwd als op die dag de in het eerste lid bedoelde melding te hebben verricht.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel930
  - number: '931.1'
    text: Voor zover de vervoerder verplicht is tot laden, is hij gehouden zulks in de overeengekomen laadtijd te doen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel931
  - number: '931.2'
    text: |-
      Voor zover de afzender verplicht is tot laden of stuwen, staat hij er voor in dat zulks in de overeengekomen
      laadtijd geschiedt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel931
  - number: '931.3'
    text: |-
      Wanneer overligtijd is bedongen, is de afzender gerechtigd deze tijd na afloop van de laadtijd voor inlading en
      stuwing te bezigen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel931
  - number: '931.4'
    text: |-
      Bepaalt de vervoerovereenkomst overliggeld, doch niet de overligtijd, dan wordt deze tijd vastgesteld op vier
      opeenvolgende dagen of, als op de ligplek een ander aantal redelijk of gebruikelijk is, op dit aantal.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel931
  - number: '931.5'
    text: |-
      De laadtijd wordt verkort met het aantal uren, dat de belading eerder is aangevangen of de vervoerder het schip
      op verlangen van de afzender eerder voor belading beschikbaar hield dan het tijdstip, waarop ingevolge het eerste
      lid van artikel 930 de laadtijd inging. Hij wordt verlengd met het aantal uren, dat het schip na aanvang van de
      werktijd op de dag, waarop de laadtijd inging, nog niet voor belading beschikbaar was.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel931
  - number: '931.6'
    text: |-
      Laadtijd, bedongen overligtijd en de in het vierde lid bedoelde overligdagen worden, voor zover de afzender tot
      laden of stuwen verplicht is, verlengd met de uren, dat niet kan worden geladen of gestuwd door schuld van de
      vervoerder of door omstandigheden gelegen in het schip of in het materiaal van het schip waarvan de vervoerder of
      de afzender zich bedient. Zij nemen een einde, wanneer belading en stuwing zijn beëindigd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel931
  - number: '932.1'
    text: |-
      De afzender is gehouden tot betaling van overliggeld voor de overligtijd met uitzondering van de uren vermeld in
      de eerste zin van het [zesde lid van artikel 931][ref1]. Hij is bovendien verplicht de vervoerder de schade te
      vergoeden wanneer, door welke oorzaak dan ook, vervoer van zaken van de betrokken of van een andere afzender op de
      onderhavige reis wordt verlengd ten gevolge van vertraging in de aanvang of het verloop van dit vervoer, ontstaan
      doordat de afzender belading en stuwing niet had voltooid in de laadtijd en de bedongen of wettelijke overligtijd.
      Deze schadevergoeding zal niet minder bedragen dan het overliggeld over het aantal uren, waarmee het vervoer is
      verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel931
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel932
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '931'
        hoofdstuk: III
        afdeling: '2'
  - number: '932.2'
    text: De wettelijke bepalingen omtrent boetebedingen zijn niet van toepassing op bedingen met betrekking tot overliggeld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel932
  - number: '932.3'
    text: |-
      Schuldenaren van overliggeld en een mogelijkerwijs uit hoofde van het [tweede lid van artikel 931][ref1]
      verschuldigde schadevergoeding zijn tot betaling daarvan hoofdelijk verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel931
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel932
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '931'
        hoofdstuk: III
        afdeling: '2'
  - number: '932.4'
    text: |-
      Voorts gelden de regels, zo nodig vastgesteld bij algemene maatregel van bestuur, ten aanzien van het aantal der
      laad- en losdagen, de berekening van de laad-, los- en overligtijd, het bedrag van het overliggeld, de wijze,
      waarop het gewicht der te vervoeren of vervoerde zaken wordt bepaald, de duur van de werktijd en de uren, waarop
      deze begint en eindigt, voor zover niet bij plaatselijke verordening andere uren van aanvang en einde zijn bepaald,
      en de vergoeding voor of het meetellen van nachten, zaterdagen, zondagen en daarmede geheel of gedeeltelijk
      gelijkgestelde dagen, indien des nachts of op genoemde dagen geladen, gestuwd of gelost wordt, alsmede het begin
      van laad- en lostijd en de dagen en uren, waarop kennisgevingen van laad- of losgereedheid kunnen worden gedaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel932
  - number: '933'
    text: |-
      De [artikelen 930][ref1], [931][ref2] en [932][ref3] vinden overeenkomstige toepassing op lossen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel930
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel931
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel932
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel933
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '930'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '931'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '932'
        hoofdstuk: III
        afdeling: '2'
  - number: '934.1'
    text: |-
      Behalve in geval van tijd- of reisbevrachting is de vervoerder wanneer, nadat de inlading een aanvang heeft
      genomen, het schip vergaat of zodanig beschadigd blijkt te zijn, dat het herstel, nodig voor de uitvoering van
      de overeenkomst, niet zonder ingrijpende maatregel mogelijk is, na lossing van de zaken bevoegd de overeenkomst
      te beëindigen, mits hij dit zo spoedig mogelijk doet; een maatregel tot herstel, die lossing van de gehele lading
      noodzakelijk maakt, wordt daarbij vermoed een ingrijpende maatregel te zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel934
  - number: '934.2'
    text: |-
      Vermoed wordt dat het vergaan of de beschadiging van het schip is te wijten aan een omstandigheid, die voor
      rekening van de vervoerder komt; voor rekening van de vervoerder komen die omstandigheden, die in geval van
      beschadiging van door hem vervoerde zaken voor zijn rekening komen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel934
  - number: '934.3'
    text: |-
      De vervoerder verwittigt, zo mogelijk, de afzender, de geadresseerde en degeen aan wie hij volgens de bepalingen
      van een mogelijkerwijs afgegeven cognossement bericht van gereedheid tot lossen moet zenden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel934
  - number: '934.4'
    text: |-
      Het [vijfde, het zesde en het zevende lid van artikel 914][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel914
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel934
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '914'
        hoofdstuk: III
        afdeling: '2'
  - number: '935.1'
    text: |-
      In geval van tijd- of reisbevrachting is de vervrachter, mits hij dit zo spoedig mogelijk doet, bevoegd de
      overeenkomst geheel of met betrekking tot een gedeelte der zaken al dan niet uitdrukkelijk op te zeggen,
      wanneer het schip, zonder dat het vergaan is, zodanig beschadigd blijkt te zijn, dat het, naar het oordeel van
      de vervrachter, het herstel, nodig voor de uitvoering van de overeenkomst, niet waard is of dit herstel binnen
      redelijke tijd niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel935
  - number: '935.2'
    text: |-
      Wanneer in geval van reisbevrachting de vervrachter reeds aan boord ontvangen zaken, zij het niet in het bevrachte
      schip, ondanks de beëindiging van de overeenkomst, naar hun bestemming vervoert, wordt dit vervoer vermoed op grond
      van de oorspronkelijke overeenkomst plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel935
  - number: '935.3'
    text: |-
      Door de opzegging eindigt de overeenkomst, doch ten aanzien van reeds aan boord ontvangen zaken, eerst na lossing
      van die zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel935
  - number: '935.4'
    text: |-
      Ten aanzien van reeds ten vervoer ontvangen zaken wordt vermoed, dat de beschadiging van het schip is te wijten
      aan een omstandigheid, die voor rekening van de vervrachter komt; voor rekening van de vervrachter komen die
      omstandigheden, die in geval van beschadiging van door hem vervoerde zaken voor zijn rekening komen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel935
  - number: '935.5'
    text: |-
      De vervrachter verwittigt, zo spoedig als dit mogelijk is, de bevrachter, de geadresseerde en degeen aan wie hij
      bericht van gereedheid tot lossen moet zenden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel935
  - number: '935.6'
    text: |-
      Het vijfde, het zesde en het zevende lid van [artikel 914][ref1] zijn van toepassing met dien verstande, dat in
      geval van tijdbevrachting vracht verschuldigd blijft tot op het tijdstip van de lossing der zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel914
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel935
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '914'
        hoofdstuk: III
        afdeling: '2'
  - number: '936.1'
    text: In geval van tijd- of reisbevrachting eindigt de overeenkomst met het vergaan van het schip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel936
  - number: '936.2'
    text: |-
      Ten aanzien van reeds ten vervoer ontvangen zaken wordt vermoed, dat het vergaan van het schip is te wijten
      aan een omstandigheid, die voor rekening van de vervrachter komt; voor rekening van de vervrachter komen die
      omstandigheden, die in geval van beschadiging van door hem vervoerde zaken voor zijn rekening komen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel936
  - number: '936.3'
    text: |-
      Vervoert de vervrachter ondanks het vergaan van het schip zaken die reeds aan boord waren ontvangen alsnog naar hun
      bestemming, dan wordt in geval van reisbevrachting dit vervoer vermoed op grond van de oorspronkelijke overeenkomst
      plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel936
  - number: '936.4'
    text: |-
      De vervrachter verwittigt, zo spoedig als dit mogelijk is, de bevrachter, de geadresseerde en degeen aan wie hij
      bericht van gereedheid tot lossen moet zenden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel936
  - number: '936.5'
    text: |-
      Het [vijfde, het zesde en het zevende lid van artikel 914][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel914
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel936
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '914'
        hoofdstuk: III
        afdeling: '2'
  - number: '937.1'
    text: |-
      De afzender is, tenzij een cognossement is afgegeven, bevoegd zichzelf of een ander als geadresseerde aan
      te wijzen, een gegeven aanduiding van de geadresseerde te wijzigen, orders omtrent de aflevering te geven of
      te wijzigen dan wel aflevering van ten vervoer ontvangen zaken vóór de aankomst ter bestemming te verlangen,
      voor zover de vervoerder aan deze aanwijzingen redelijkerwijs kan voldoen en mits hij de vervoerder en de
      belanghebbenden bij de overige lading ter zake schadeloos stelt. Hij is verplicht tot bijdragen in een avarij-
      grosse, wanneer de avarij-grosse handeling plaatshad met het oog op een omstandigheid, waarvan reeds vóór de
      aflevering is gebleken. Wanneer het schip naar een niet eerder overeengekomen plaats of plek is gevaren, is hij
      verplicht de vervoerder terzake bovendien een redelijke vergoeding te geven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel937
  - number: '937.2'
    text: Hij kan deze rechten niet uitoefenen, wanneer door het opvolgen van zijn aanwijzingen de reis zou worden vertraagd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel937
  - number: '937.3'
    text: |-
      Deze rechten van de afzender vervallen al naarmate de geadresseerde op de losplek zaken ter lossing aanneemt of de
      geadresseerde van de vervoerder schadevergoeding verlangt omdat deze zaken niet aflevert.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel937
  - number: '937.4'
    text: |-
      Zaken, die ingevolge het eerste lid zijn afgeleverd, worden aangemerkt als ter bestemming afgeleverde zaken en
      de bepalingen van deze afdeling nopens de aflevering van zaken, alsmede de [artikelen 955][ref1], [956][ref2] en
      [957][ref3] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel955
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel956
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel957
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel937
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '955'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '956'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '957'
        hoofdstuk: III
        afdeling: '2'
  - number: '938.1'
    text: |-
      Indien een cognossement is afgegeven, is uitsluitend de in [artikel 940][ref1] bedoelde houder daarvan en dan
      alleen tegen afgifte van alle verhandelbare exemplaren van dit cognossement, bevoegd, voor zover de vervoerder
      hieraan redelijkerwijs kan voldoen, aflevering van alle daarop vermelde zaken gezamenlijk vóór de aankomst ter
      bestemming te verlangen, mits hij de vervoerder en de belanghebbenden bij de overige lading terzake schadeloos
      stelt. Hij is verplicht tot bijdragen in een avarij-grosse, wanneer de avarij-grosse handeling plaats had met
      het oog op een omstandigheid, waarvan reeds vóór de aflevering is gebleken. Wanneer het schip naar een niet
      eerder overeengekomen plaats of plek is gevaren, is hij verplicht de vervoerder ter zake bovendien een redelijke
      vergoeding te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel940
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel938
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '940'
        hoofdstuk: III
        afdeling: '2'
  - number: '938.2'
    text: Hij kan dit recht niet uitoefenen, wanneer door de voortijdige aflevering de reis zou worden vertraagd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel938
  - number: '938.3'
    text: |-
      Zaken, die ingevolge het eerste lid zijn afgeleverd, worden aangemerkt als ter bestemming afgeleverde zaken en
      de bepalingen van deze afdeling nopens de aflevering van zaken, alsmede de [artikelen 955][ref1], [956][ref2] en
      [957][ref3] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel955
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel956
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel957
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel938
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '955'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '956'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '957'
        hoofdstuk: III
        afdeling: '2'
  - number: '939'
    text: |-
      Indien geen cognossement doch aan de afzender een vrachtbrief die een geadresseerde vermeldt is afgegeven, heeft
      ook deze geadresseerde jegens de vervoerder het recht aflevering van de zaken overeenkomstig de op de vervoerder
      rustende verplichtingen te vorderen; daarbij zijn de [artikelen 903][ref1], [905][ref2] en [906][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel903
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel905
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel906
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel939
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '903'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '905'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '906'
        hoofdstuk: III
        afdeling: '2'
  - number: '940.1'
    text: |-
      Indien een cognossement is afgegeven, heeft uitsluitend de regelmatige houder daarvan, tenzij hij niet op
      rechtmatige wijze houder is geworden, jegens de vervoerder onder het cognossement het recht aflevering van de zaken
      overeenkomstig de op de vervoerder rustende verplichtingen te vorderen; daarbij zijn de [artikelen 903][ref1],
      [905][ref2] en [906][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel903
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel905
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel906
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel940
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '903'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '905'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '906'
        hoofdstuk: III
        afdeling: '2'
  - number: '940.2'
    text: |-
      Jegens de houder van het cognossement, die niet de afzender was, is de vervoerder onder cognossement gehouden
      aan en kan hij een beroep doen op de bedingen van dit cognossement. Jegens iedere houder van het cognossement
      kan hij de uit het cognossement duidelijk kenbare rechten tot betaling geldend maken. Jegens de houder van het
      cognossement, die ook de afzender was, kan de vervoerder zich bovendien op de bedingen van de vervoerovereenkomst
      en op zijn persoonlijke verhouding tot de afzender beroepen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel940
  - number: '941.1'
    text: |-
      Indien bij toepassing van [artikel 943][ref1] verscheidene personen als vervoerder onder het cognossement moeten
      worden aangemerkt zijn dezen jegens de in [artikel 940 eerste lid][ref2] bedoelde cognossementhouder hoofdelijk
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel943
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel940
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel941
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '943'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '940'
        hoofdstuk: III
        afdeling: '2'
  - number: '941.2'
    text: |-
      In het in het eerste lid genoemde geval is ieder der vervoerders gerechtigd de uit het cognossement blijkende
      rechten jegens de cognossementhouder uit te oefenen en is deze jegens iedere vervoerder gekweten tot op het
      opeisbare bedrag dat hij op grond van het cognossement aan één hunner heeft voldaan. [Titel 7 van Boek 3][ref1] is
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel941
    references:
      - id: ref1
        bwb_id: BWBR0005291
  - number: '942'
    text: |-
      Van de houders van verschillende exemplaren van hetzelfde cognossement heeft hij het beste recht, die houder is van
      het exemplaar, waarvan ná de gemeenschappelijke voorman, die houder was van al die exemplaren, het eerst een ander
      houder is geworden te goeder trouw en onder bezwarende titel.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel942
  - number: '943.1'
    text: |-
      Onverminderd de overige leden van dit artikel worden als vervoerder onder het cognossement aangemerkt hij die het
      cognossement ondertekende of voor wie een ander dit ondertekende alsmede hij wiens formulier voor het cognossement
      is gebezigd. Is het cognossement niet of op onleesbare wijze ondertekend, dan wordt de wederpartij van de afzender
      als vervoerder onder het cognossement aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel943
  - number: '943.2'
    text: |-
      Indien de schipper of een ander voor hem het cognossement ondertekende, wordt naast degenen genoemd in het eerste
      lid, die tijd- of reisbevrachter, die vervoerder is bij de laatste overeenkomst in de keten der exploitatie-
      overeenkomsten als bedoeld in [afdeling 1 van titel 5][ref1], als vervoerder onder het cognossement aangemerkt.
      Indien het schip in rompbevrachting is uitgegeven wordt naast deze eventuele tijd- of reisbevrachter ook de laatste
      rompbevrachter als vervoerder onder het cognossement aangemerkt. Is het schip niet in rompbevrachting uitgegeven,
      dan wordt naast de hiergenoemde eventuele tijd- of reisbevrachter ook de eigenaar als vervoerder onder het
      cognossement aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel943
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '1'
  - number: '943.3'
    text: |-
      In afwijking van de vorige leden wordt uitsluitend de laatste rompbevrachter, onderscheidenlijk de eigenaar,
      als vervoerder onder het cognossement aangemerkt indien het cognossement uitsluitend deze rompbevrachter,
      onderscheidenlijk de eigenaar, uitdrukkelijk als zodanig aanwijst en, in geval van aanwijzing van de
      rompbevrachter, bovendien diens identiteit uit het cognossement duidelijk kenbaar is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel943
  - number: '943.4'
    text: |-
      Dit artikel laat het [tweede lid van artikel 861][ref1] onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel861
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel943
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '861'
        hoofdstuk: III
        afdeling: '2'
  - number: '943.5'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel943
  - number: '944.1'
    text: |-
      Het eerste lid, eerste volzin van [artikel 943][ref1] vindt geen toepassing indien een daar als vervoerder onder
      het cognossement aangemerkte persoon bewijst dat hij die het cognossement voor hem ondertekende daarbij de grenzen
      zijner bevoegdheid overschreed of dat het formulier zonder zijn toestemming is gebezigd. Desalniettemin wordt een
      in het eerste lid, eerste volzin van [artikel 943][ref2] bedoelde persoon als vervoerder onder het cognossement
      aangemerkt, indien de houder van het cognossement bewijst dat op het ogenblik van uitgifte van het cognossement,
      op grond van een verklaring of gedraging van hem voor wie is ondertekend of wiens formulier is gebezigd,
      redelijkerwijze mocht worden aangenomen, dat hij die ondertekende daartoe bevoegd was of dat het formulier met
      toestemming was gebezigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel943
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel943
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel944
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '943'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '943'
        hoofdstuk: III
        afdeling: '2'
  - number: '944.2'
    text: |-
      In afwijking van het eerste lid wordt de rederij als vervoerder onder het cognossement aangemerkt indien haar
      boekhouder door ondertekening van het cognossement de grenzen zijner bevoegdheid overschreed, doch zij wordt
      niet gebonden jegens de eerste houder van het cognossement die op het ogenblik van uitgifte daarvan wist dat de
      boekhouder de grenzen zijner bevoegdheid overschreed.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel944
  - number: '944.3'
    text: |-
      Een beroep op het tweede lid van [artikel 943][ref1] is mogelijk ook indien de schipper door ondertekening van
      het cognossement of door een ander de bevoegdheid te geven dit namens hem te ondertekenen, de grenzen zijner
      bevoegdheid overschreed, doch dergelijk beroep staat niet open aan de eerste houder van het cognossement die op het
      ogenblik van uitgifte daarvan wist dat de schipper de grenzen zijner bevoegdheid overschreed.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel943
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel944
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '943'
        hoofdstuk: III
        afdeling: '2'
  - number: '944.4'
    text: |-
      Het derde lid vindt eveneens toepassing indien hij die namens de schipper het cognossement ondertekende daarbij de
      grenzen zijner bevoegdheid overschreed.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel944
  - number: '945.1'
    text: |-
      Is een vervrachter ingevolge [artikel 943][ref1] tot meer gehouden dan waartoe hij uit hoofde van zijn bevrachting
      is verplicht of ontving hij minder dan waartoe hij uit dien hoofde is gerechtigd, dan heeft hij - mits de
      ondertekening van het cognossement of de afgifte van het formulier plaatsvond krachtens het in de bevrachting
      bepaalde, dan wel op verzoek van de bevrachter - deswege op deze laatste verhaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel943
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel945
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '943'
        hoofdstuk: III
        afdeling: '2'
  - number: '945.2'
    text: Hetzelfde geldt voor een ingevolge het eerste lid aangesproken bevrachter, die op zijn beurt vervrachter is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel945
  - number: '946.1'
    text: |-
      De houder van het cognossement, die zich tot ontvangst van de zaken heeft aangemeld, is verplicht, voordat hij deze
      heeft ontvangen, het cognossement van kwijting te voorzien en aan de vervoerder af te geven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel946
  - number: '946.2'
    text: |-
      Hij is gerechtigd het cognossement tot zekerheid der afgifte daarvan bij een, in geval van geschil op verzoek van
      de meest gerede partij door de rechter aan te wijzen, derde in bewaring te geven totdat de zaken afgeleverd zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel946
  - number: '946.3'
    text: |-
      Tenzij het cognossement in overeenstemming met het eerste lid van kwijting is voorzien en aan de vervoerder is
      afgegeven, is de ontvanger verplicht naarmate van de aflevering van de zaken ontvangstbewijzen daarvoor af te
      geven, voor zover althans dit de aflevering niet op onredelijke wijze vertraagt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel946
  - number: '947.1'
    text: |-
      Een derde gedeelte van de vracht, berekend over de ten vervoer ontvangen zaken, - of, wanneer een beding als
      "franco vracht tegen ontvangstbewijs" is gemaakt, twee derde gedeelte daarvan - is verschuldigd op het ogenblik,
      dat de vervoerder de zaken ten vervoer ontvangt of, wanneer door hem een vrachtbrief of cognossement wordt
      afgegeven, bij het afgeven hiervan. De overige vracht is verschuldigd na aflevering van de zaken ter bestemming of
      ter plaatse, waar de vervoerder hen met inachtneming van [artikel 937][ref1] of [artikel 938][ref2] afleverde. Is
      de vracht bepaald naar gewicht of omvang der zaken, dan wordt hij berekend naar deze gegevens bij aflevering.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel937
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel938
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel947
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '937'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '938'
        hoofdstuk: III
        afdeling: '2'
  - number: '947.2'
    text: |-
      Wanneer zaken weliswaar worden afgeleverd, doch niet ter bestemming, is distantievracht verschuldigd. Deze wordt
      berekend aan de hand van het door de zaken afgelegde gedeelte van het vervoer en de door de vervoerder gemaakte
      kosten. Hierbij wordt rekening gehouden met de gehele duur en lengte van het vervoer en het totaal van de daarvoor
      door de vervoerder te maken kosten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel947
  - number: '947.3'
    text: |-
      Vracht, die in één som voor alle zaken is bepaald, is, ook wanneer slechts een gedeelte van die zaken ter
      bestemming is afgeleverd, in zijn geheel verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel947
  - number: '947.4'
    text: |-
      Vracht, die vooruit te voldoen is of voldaan is, is en blijft - behalve in geval van tijdbevrachting - in zijn
      geheel verschuldigd, ook wanneer de zaken niet ter bestemming worden afgeleverd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel947
  - number: '947.5'
    text: |-
      Zaken, die niet zijn afgeleverd, worden desalniettemin aangemerkt als afgeleverde zaken voor zover het niet
      afleveren het gevolg is van de aard of een gebrek van de zaken, dan wel van een handeling of nalaten van een
      rechthebbende op of de afzender, geadresseerde of ontvanger van de zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel947
  - number: '947.6'
    text: |-
      Wanneer de vracht in het cognossement op een lager bedrag is vastgesteld dan in de vervoerovereenkomst, is het
      verschil aan de vervoerder vooruit te voldoen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel947
  - number: '947.7'
    text: |-
      Wanneer de afzender niet de vóór het begin van het vervoer verschuldigde vracht heeft voldaan, is de vervoerder
      bevoegd het vertrek van het schip op te schorten. Met toestemming van de rechter is hij gerechtigd tot het
      nemen van de in de [artikelen 955][ref1] en [957][ref2] genoemde maatregelen. Gaat hij hiertoe over, dan zijn
      deze artikelen alsmede [artikel 956][ref3] van toepassing. De afzender is verplicht de vervoerder de schade te
      vergoeden, wanneer, door welke oorzaak dan ook, vervoer van zaken van de betrokken of van een andere afzender op
      de onderhavige reis wordt verlengd ten gevolge van deze opschorting. Deze schadevergoeding zal niet minder bedragen
      dan het overliggeld over het aantal uren, waarmee het vervoer is verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel955
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel957
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel956
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel947
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '955'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '957'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '956'
        hoofdstuk: III
        afdeling: '2'
  - number: '948'
    text: |-
      Voor zaken die door een opvarende voor eigen rekening in strijd met enig wettelijk verbod worden vervoerd is de
      hoogste vracht verschuldigd die ten tijde van de inlading voor soortgelijke zaken kon worden bedongen. Deze vracht
      is verschuldigd ook wanneer de zaken niet ter bestemming worden afgeleverd en de ontvanger is met de verscheper
      hoofdelijk voor deze vracht verbonden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel948
  - number: '949'
    text: |-
      Onder voorbehoud van de laatste zinsnede van het [zesde lid van artikel 935][ref1] is in geval van tijdbevrachting
      vracht niet verschuldigd over de tijd, dat de bevrachter het schip niet overeenkomstig de bedingen van de
      bevrachting te zijner beschikking heeft


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel935
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel949
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '935'
        hoofdstuk: III
        afdeling: '2'
  - number: 949.a
    text: ten gevolge van beschadiging daarvan, dan wel
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel949
  - number: 949.b
    text: doordat de vervrachter in de nakoming van zijn verplichtingen tekort schiet,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel949
  - number: '950.1'
    text: |-
      Bij tijdbevrachting komen de brandstof voor de voortstuwingsinstallaties en de smeerolie, de havenrechten en
      soortgelijke rechten en uitgaven, die verschuldigd worden ten gevolge van uitgevoerde reizen en het vervoeren
      van zaken, ten laste van de bevrachter. De overige lasten der exploitatie van het schip komen ten laste van de
      vervrachter.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel950
  - number: '950.2'
    text: |-
      Bij vletten komen de havengelden ten laste van de vervrachter, tenzij het schip zich begeeft naar een andere
      gemeente. In dat geval komen de havengelden, verschuldigd in die andere gemeente, alsmede de havengelden,
      verschuldigd na terugkeer in de oorspronkelijke gemeente, ten laste van de bevrachter.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel950
  - number: '951'
    text: |-
      Onverminderd het omtrent avarij-grosse bepaalde en onverminderd [afdeling 1 van Titel 4 van Boek 6][ref1] zijn
      de afzender en de ontvanger en, indien een cognossement is afgegeven, de in [artikel 940][ref2] bedoelde houder
      daarvan, hoofdelijk verbonden de vervoerder de schade te vergoeden, geleden doordat deze zich als zaakwaarnemer
      inliet met de behartiging van de belangen van een rechthebbende op ten vervoer ontvangen zaken dan wel doordat de
      kapitein of de schipper zijn in de [artikelen 261][ref3] of [860][ref4] genoemde verplichtingen is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling1
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel940
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel261
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel860
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel951
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '940'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '261'
        hoofdstuk: II
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '860'
        hoofdstuk: III
        afdeling: '2'
  - number: '952'
    text: |-
      Slechts een schriftelijk en ondubbelzinnig daartoe strekkend beding ontheft de afzender van zijn verplichtingen
      terzake van het vervoer.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel952
  - number: '953.1'
    text: |-
      De vervoerder is verplicht de bedragen, die als rembours op de zaak drukken, bij aflevering van de zaak van de
      ontvanger te innen en vervolgens aan de afzender af te dragen. Wanneer hij aan deze verplichting, door welke
      oorzaak dan ook, niet voldoet, is hij verplicht het bedrag van het rembours aan de afzender te vergoeden, doch
      indien deze geen of minder schade leed, ten hoogste tot op het bedrag van de geleden schade.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel953
  - number: '953.2'
    text: |-
      De ontvanger, die ten tijde van de aflevering weet dat een bedrag als rembours op de zaak drukt, is verplicht aan
      de vervoerder het door deze aan de afzender verschuldigde bedrag te voldoen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel953
  - number: '954.1'
    text: |-
      De vervoerder is gerechtigd afgifte van zaken, die hij in verband met de vervoerovereenkomst onder zich heeft,
      te weigeren aan ieder, die uit anderen hoofde dan de vervoerovereenkomst recht heeft op aflevering van die zaken,
      tenzij op de zaken beslag is gelegd en uit de vervolging van dit beslag een verplichting tot afgifte aan de
      beslaglegger voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel954
  - number: '954.2'
    text: |-
      De vervoerder kan het recht van retentie uitoefenen op zaken, die hij in verband met de vervoerovereenkomst
      onder zich heeft, voor hetgeen hem verschuldigd is of zal worden ter zake van het vervoer van die zaken alsmede
      voor hetgeen als bijdrage in avarij-grosse op die zaken verschuldigd is of zal worden. Hij kan dit recht tevens
      uitoefenen voor hetgeen bij wijze van rembours op de zaak drukt. Indien een cognossement is afgegeven, kan hij
      dit recht slechts uitoefenen voor wat hem door de ontvanger verschuldigd is of zal worden, tenzij het cognossement
      bepaalt, dat de vracht of andere vorderingen terzake van het vervoer door de afzender moeten worden voldaan; in dat
      geval kan hij de zaken terughouden, totdat de afzender aan zijn verplichtingen voldoet. Dit retentierecht vervalt
      zodra aan de vervoerder is betaald het bedrag waarover geen geschil bestaat en voldoende zekerheid is gesteld voor
      de betaling van die bedragen, waaromtrent wel geschil bestaat of welker hoogte nog niet kan worden vastgesteld. De
      vervoerder behoeft echter geen zekerheid te aanvaarden voor hetgeen bij wijze van rembours op de zaak drukt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel954
  - number: '954.3'
    text: |-
      De in dit artikel aan de vervoerder toegekende rechten komen hem niet toe jegens een derde, indien hij op het
      tijdstip dat hij de zaak ten vervoer ontving, reden had te twijfelen aan de bevoegdheid van de afzender jegens die
      derde hem de zaak ten vervoer ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel954
  - number: '955.1'
    text: |-
      Voor zover, nadat zo nodig de in [artikel 933][ref1] bedoelde melding is geschied, hij die jegens de vervoerder
      recht heeft op aflevering van vervoerde zaken, niet opkomt, weigert deze te ontvangen of deze niet met de vereiste
      spoed in ontvangst neemt, voor zover op zaken beslag is gelegd, alsmede indien de vervoerder gegronde redenen heeft
      aan te nemen, dat een houder van een cognossement die als ontvanger opkomt, desalniettemin niet tot de aflevering
      gerechtigd is, is de vervoerder gerechtigd deze zaken voor rekening en gevaar van de rechthebbende bij een derde
      op te slaan in een daarvoor geschikte bewaarplaats of lichter. Op zijn verzoek kan de rechter bepalen, dat hij deze
      zaken, desgewenst ook in het schip, onder zichzelf kan houden of andere maatregelen daarvoor kan treffen. Hij is
      verplicht de afzender zo spoedig mogelijk op de hoogte te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel933
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel955
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '933'
        hoofdstuk: III
        afdeling: '2'
  - number: '955.2'
    text: |-
      De derde-bewaarnemer en de ontvanger zijn jegens elkaar verbonden, als ware de omtrent de bewaring gesloten
      overeenkomst mede tussen hen aangegaan. De bewaarnemer is echter niet gerechtigd tot afgifte dan na schriftelijke
      toestemming daartoe van hem, die de zaken in bewaring gaf.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel955
  - number: '956'
    text: |-
      De vervoerder blijft in het geval van de [artikelen 954][ref1] of [955][ref2], zolang hij de zaken niet heeft
      opgeslagen, voor ieder uur oponthoud gerechtigd tot overliggeld of, indien hij meer schade lijdt, tot volledige
      schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel954
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel955
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel956
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '954'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '955'
        hoofdstuk: III
        afdeling: '2'
  - number: '957.1'
    text: |-
      In geval van toepassing van [artikel 955][ref1] kan de vervoerder, de bewaarnemer dan wel hij, die jegens de
      vervoerder recht heeft op de aflevering, op zijn verzoek door de rechter worden gemachtigd de zaken geheel of
      gedeeltelijk op de door deze te bepalen wijze te verkopen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel955
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel957
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '955'
        hoofdstuk: III
        afdeling: '2'
  - number: '957.2'
    text: |-
      De bewaarnemer is verplicht de vervoerder zo spoedig mogelijk van de voorgenomen verkoop op de hoogte te stellen;
      de vervoerder heeft deze verplichting jegens degeen, die jegens hem recht heeft op de aflevering van de zaken, en
      jegens degeen aan wie hij volgens [artikel 933][ref1] melding moet doen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel933
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel957
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '933'
        hoofdstuk: III
        afdeling: '2'
  - number: '957.3'
    text: |-
      De opbrengst van het verkochte wordt in de consignatiekas gestort voor zover zij niet strekt tot voldoening van
      de kosten van opslag en verkoop alsmede, binnen de grenzen der redelijkheid, van de gemaakte kosten. Tenzij op de
      zaken beslag is gelegd voor een geldvordering, moet aan de vervoerder uit het in bewaring te stellen bedrag worden
      voldaan hetgeen hem verschuldigd is terzake van het vervoer, op grond van een remboursbeding, alsmede een bijdrage
      in avarij-grosse; voor zover deze vorderingen nog niet vaststaan, zal de opbrengst of een gedeelte daarvan op door
      de rechter te bepalen wijze tot zekerheid voor deze vorderingen strekken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel957
  - number: '957.4'
    text: De in de consignatiekas gestorte opbrengst treedt in de plaats van de zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel957
  - number: '958'
    text: |-
      Indien er zekerheid of vermoeden bestaat, dat er verlies of schade is, moeten de vervoerder en hij, die jegens
      de vervoerder recht heeft op de aflevering, elkaar over en weer in redelijkheid alle middelen verschaffen om het
      onderzoek van de zaak en het natellen van de colli mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel958
  - number: '959.1'
    text: |-
      Zowel de vervoerder als hij die jegens de vervoerder recht heeft op de aflevering is bevoegd bij de aflevering van
      zaken de rechter te verzoeken een gerechtelijk onderzoek te doen plaatshebben naar het gewicht, de maat of enige
      andere omstandigheid, die van belang is bij de vaststelling van de vracht, alsmede naar de toestand waarin de
      zaken worden afgeleverd; tevens zijn zij bevoegd de rechter te verzoeken de daarbij bevonden verliezen of schaden
      gerechtelijk te doen begroten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel959
  - number: '959.2'
    text: |-
      Indien dit onderzoek in tegenwoordigheid of na behoorlijke oproeping van de wederpartij heeft plaatsgehad, wordt
      het uitgebrachte rapport vermoed juist te zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel959
  - number: '960.1'
    text: |-
      Zowel de vervoerder als hij die jegens de vervoerder recht heeft op de aflevering is, wanneer hij verliezen of
      schaden van zaken vermoedt, bevoegd de rechter te verzoeken bij of terstond na de aflevering daarvan en desgewenst
      aan boord van het schip, een gerechtelijk onderzoek te doen plaatshebben naar de oorzaak daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel960
  - number: '960.2'
    text: |-
      Indien dit onderzoek in tegenwoordigheid of na behoorlijke oproeping van de wederpartij heeft plaatsgehad, wordt
      het uitgebrachte rapport vermoed juist te zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel960
  - number: '961.1'
    text: |-
      De kosten van gerechtelijk onderzoek, als bedoeld in de [artikelen 959][ref1] en [960][ref2], moeten worden voldaan
      door de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel959
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel960
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel961
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '959'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '960'
        hoofdstuk: III
        afdeling: '2'
  - number: '961.2'
    text: |-
      De rechter kan deze kosten en door het onderzoek geleden schade geheel of gedeeltelijk ten laste van de wederpartij
      van de aanvrager brengen, ook al zouden daardoor de bedragen genoemd in de in [artikel 905][ref1] bedoelde algemene
      maatregel van bestuur worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel905
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel961
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '905'
        hoofdstuk: III
        afdeling: '2'
  - number: '970.1'
    text: |-
      De overeenkomst van personenvervoer in de zin van deze titel is de overeenkomst van personenvervoer, al dan niet
      tijd- of reisbevrachting zijnde, waarbij de ene partij (de vervoerder) zich tegenover de andere partij verbindt
      aan boord van een schip een of meer personen (reizigers) en al dan niet hun bagage uitsluitend over binnenwateren
      te vervoeren. Vervoer tussen wal en schip als bedoeld in [artikel 501][ref1] onder *a* wordt niet als vervoer
      over binnenwateren aangemerkt. De overeenkomst van personenvervoer aan boord van een luchtkussenvoertuig noch de
      overeenkomst van personenvervoer als omschreven in [artikel 100][ref2] is een overeenkomst van personenvervoer in
      de zin van deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel501
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel100
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel970
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '501'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '100'
        hoofdstuk: I
        afdeling: '5'
  - number: '970.2'
    text: |-
      Hutbagage in de zin van deze afdeling is de bagage, met uitzondering van levende dieren die de reiziger in zijn hut
      heeft, die hij in zijn bezit, onder zijn toezicht of in zijn macht heeft, alsmede de bagage die hij aan boord heeft
      van een met hem als bagage ten vervoer aangenomen voertuig of schip, doch niet dit voertuig of schip zelf.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel970
  - number: '970.3'
    text: |-
      Handbagage in de zin van deze afdeling is de bagage, met uitzondering van levende dieren, die de reiziger als
      gemakkelijk mee te voeren, draagbare dan wel met de hand verrijdbare zaken op of bij zich heeft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel970
  - number: '970.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen zaken die geen hut- of handbagage zijn voor de toepassing van bepalingen
      van deze afdeling als hut- of handbagage worden aangewezen, dan wel bepalingen van deze afdeling niet van
      toepassing worden verklaard op zaken, die hut- of handbagage zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel970
  - number: '971'
    text: Vervoer over binnenwateren omvat
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel971
  - number: 971.a
    text: |-
      met betrekking tot personen of hun hut- of handbagage de tijd dat de reiziger of zijn hut- of handbagage aan boord
      van het schip verblijft, de tijd van inscheping of ontscheping, alsmede, onder voorbehoud van [artikel 501][ref1],
      de tijd dat de reiziger of zijn hut- of handbagage te water wordt vervoerd tussen wal en schip of tussen schip
      en wal, indien de prijs hiervan in de vracht is inbegrepen of het voor dit hulpvervoer gebezigde schip door de
      vervoerder ter beschikking van de reiziger is gesteld. Vervoer over binnenwateren van personen omvat echter niet
      de tijd dat de reiziger verblijft op een ponton, een steiger, een veerstoep of enig schip dat ligt tussen de wal
      en het schip aan boord waarvan hij vervoerd zal worden of werd, in een stationsgebouw, op een kade of enige andere
      haveninstallatie;


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel501
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel971
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '501'
        hoofdstuk: II
        afdeling: '3'
  - number: 971.b
    text: |-
      met betrekking tot hut- of handbagage bovendien de tijd dat de reiziger verblijft op een ponton, een steiger, een
      veerstoep of enig schip dat ligt tussen de wal en het schip aan boord waarvan hij vervoerd zal worden of werd,
      in een stationsgebouw, op een kade of enige andere haveninstallatie, indien die bagage is overgenomen door de
      vervoerder en niet weer aan de reiziger is afgeleverd;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel971
  - number: 971.c
    text: |-
      met betrekking tot bagage die noch hut- noch handbagage is, de tijd tussen het overnemen daarvan door de vervoerder
      hetzij te land, hetzij aan boord en de aflevering door de vervoerder.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel971
  - number: '972.1'
    text: |-
      Tijd- of reisbevrachting in de zin van deze afdeling is de overeenkomst van personenvervoer, waarbij de vervoerder
      (de vervrachter) zich verbindt tot vervoer aan boord van een schip dat hij daartoe, anders dan bij wijze van
      rompbevrachting, in zijn geheel en al dan niet op tijdbasis (tijdbevrachting of reisbevrachting) ter beschikking
      stelt van zijn wederpartij (de bevrachter).
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel972
  - number: '972.2'
    text: |-
      De in [afdeling 2 van titel 10][ref1] in het bijzonder voor het geval van bevrachting gegeven bepalingen, alsmede
      [artikel 894][ref2] zijn op deze bevrachting van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel894
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel972
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '894'
        hoofdstuk: III
        afdeling: '2'
  - number: '973'
    text: |-
      De wetsbepalingen omtrent huur, bewaarneming en bruikleen zijn op terbeschikkingstelling van een schip ten vervoer,
      anders dan bij wijze van rompbevrachting, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel973
  - number: '974.1'
    text: |-
      De vervoerder is aansprakelijk voor schade veroorzaakt door dood of letsel van de reiziger, indien een voorval dat
      hiertoe leidde zich voordeed tijdens het vervoer en voor zover dit voorval is veroorzaakt door een omstandigheid
      die een zorgvuldig vervoerder heeft kunnen vermijden of door een omstandigheid waarvan zulk een vervoerder de
      gevolgen heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel974
  - number: '974.2'
    text: |-
      Vermoed wordt dat een zorgvuldig vervoerder de omstandigheid die leidde tot schipbreuk, aanvaring, stranding,
      ontploffing of brand heeft kunnen vermijden, alsmede dat zulk een vervoerder heeft kunnen verhinderen dat deze
      omstandigheid tot een dergelijk voorval leidde.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel974
  - number: '974.3'
    text: |-
      Gebrekkigheid of slecht functioneren van het schip of van het materiaal waarvan hij zich voor het vervoer bedient,
      wordt aangemerkt als een omstandigheid die een zorgvuldig vervoerder heeft kunnen vermijden en waarvan hij de
      gevolgen heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel974
  - number: '974.4'
    text: |-
      Bij de toepassing van dit artikel wordt slechts dan rekening gehouden met een gedraging van een derde, indien geen
      andere omstandigheid, die mede tot het voorval leidde, voor rekening van de vervoerder is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel974
  - number: '975.1'
    text: |-
      De vervoerder is aansprakelijk voor schade veroorzaakt door geheel of gedeeltelijk verlies dan wel beschadiging
      van hut- of handbagage met uitzondering van een zaak, die zich aan boord van een als bagage ten vervoer aangenomen
      voertuig of schip bevindt, indien een voorval dat hiertoe leidde zich voordeed tijdens het vervoer en voor zover
      dit voorval is veroorzaakt door een omstandigheid die een zorgvuldig vervoerder heeft kunnen vermijden of waarvan
      zulk een vervoerder de gevolgen heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel975
  - number: '975.2'
    text: |-
      Het tweede en [derde lid van artikel 974][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel974
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel975
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '974'
        hoofdstuk: III
        afdeling: '3'
  - number: '975.3'
    text: |-
      Bij de toepassing van dit artikel wordt slechts dan rekening gehouden met een gedraging van een derde, indien geen
      andere omstandigheid, die mede tot het voorval leidde, voor rekening van de vervoerder is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel975
  - number: '975.4'
    text: |-
      Dit artikel laat de [artikelen 545][ref1] en [1006][ref2] onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel545
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1006
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel975
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '545'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1006'
        hoofdstuk: III
        afdeling: '1'
  - number: '976'
    text: |-
      Onder voorbehoud van [artikel 975][ref1] is de vervoerder aansprakelijk voor schade veroorzaakt door geheel of
      gedeeltelijk verlies dan wel beschadiging van bagage, indien een voorval dat hiertoe leidde zich voordeed tijdens
      het vervoer en voor zover dit voorval is veroorzaakt door een omstandigheid die een zorgvuldig vervoerder heeft
      kunnen vermijden of waarvan zulk een vervoerder de gevolgen heeft kunnen verhinderen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel975
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel976
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '975'
        hoofdstuk: III
        afdeling: '3'
  - number: '977'
    text: |-
      De vervoerder is niet aansprakelijk in geval van verlies of beschadiging overkomen aan geldstukken, verhandelbare
      documenten, goud, zilver, juwelen, sieraden, kunstvoorwerpen of andere zaken van waarde, tenzij deze zaken van
      waarde aan de vervoerder in bewaring zijn gegeven en hij overeengekomen is hen in zekerheid te zullen bewaren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel977
  - number: '978'
    text: |-
      De vervoerder is terzake van door de reiziger aan boord gebrachte zaken die hij, indien hij hun aard of gesteldheid
      had gekend, niet aan boord zou hebben toegelaten en waarvoor hij geen bewijs van ontvangst heeft afgegeven, geen
      enkele schadevergoeding verschuldigd indien de reiziger wist of behoorde te weten, dat de vervoerder de zaken
      niet ten vervoer zou hebben toegelaten; de reiziger is alsdan aansprakelijk voor alle kosten en schaden voor de
      vervoerder voortvloeiend uit de aanbieding ten vervoer of uit het vervoer zelf.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel978
  - number: '979'
    text: |-
      Onverminderd [artikel 978][ref1] en onverminderd [artikel 179 van Boek 6][ref2] is de reiziger verplicht de
      vervoerder de schade te vergoeden die hij of zijn bagage deze berokkende, behalve voor zover deze schade is
      veroorzaakt door een omstandigheid die een zorgvuldig reiziger niet heeft kunnen vermijden en voor zover zulk een
      reiziger de gevolgen daarvan niet heeft kunnen verhinderen. De reiziger kan niet om zich van zijn aansprakelijkheid
      te ontheffen beroep doen op de hoedanigheid of een gebrek van zijn bagage.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel978
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel179
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel979
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '978'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '179'
  - number: '980.1'
    text: |-
      Onverminderd de bepalingen van deze afdeling zijn op het vervoer van bagage de [artikelen 895][ref1],
      [903 eerste en tweede lid][ref2], [904 eerste lid][ref3], [910 eerste en tweede lid][ref4], [911][ref5],
      [912][ref6], [914][ref7], [951][ref8] en [954 tot en met 961][ref9] van toepassing. De in [artikel 954][ref10]
      toegekende rechten en het in [artikel 957][ref11] toegekende recht tot het zich laten voldoen uit het in bewaring
      te stellen bedrag van kosten terzake van het vervoer, kunnen worden uitgeoefend voor alles wat de wederpartij van
      de vervoerder of de reiziger aan de vervoerder verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel895
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel903
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel904
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel910
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Artikel911
      [ref6]: https://wetten.overheid.nl/BWBR0005034#Artikel912
      [ref7]: https://wetten.overheid.nl/BWBR0005034#Artikel914
      [ref8]: https://wetten.overheid.nl/BWBR0005034#Artikel951
      [ref9]: https://wetten.overheid.nl/BWBR0005034#Artikel954
      [ref10]: https://wetten.overheid.nl/BWBR0005034#Artikel954
      [ref11]: https://wetten.overheid.nl/BWBR0005034#Artikel957
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel980
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '895'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '903'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '904'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '910'
        hoofdstuk: III
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005034
        artikel: '911'
        hoofdstuk: III
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0005034
        artikel: '912'
        hoofdstuk: III
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0005034
        artikel: '914'
        hoofdstuk: III
        afdeling: '2'
      - id: ref8
        bwb_id: BWBR0005034
        artikel: '951'
        hoofdstuk: III
        afdeling: '2'
      - id: ref9
        bwb_id: BWBR0005034
        artikel: '954'
        hoofdstuk: III
        afdeling: '2'
      - id: ref10
        bwb_id: BWBR0005034
        artikel: '954'
        hoofdstuk: III
        afdeling: '2'
      - id: ref11
        bwb_id: BWBR0005034
        artikel: '957'
        hoofdstuk: III
        afdeling: '2'
  - number: '980.2'
    text: |-
      Partijen hebben de vrijheid af te wijken van in het eerste lid op hun onderlinge verhouding toepasselijk verklaarde
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel980
  - number: '981'
    text: |-
      Op de overeenkomst van personenvervoer zijn de [artikelen 511 tot en met 516][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel511
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel981
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '511'
        hoofdstuk: II
        afdeling: '3'
  - number: '982.1'
    text: |-
      Behoudens de [artikelen 974 tot en met 977][ref1] is de vervoerder niet aansprakelijk voor schade ontstaan door een
      handeling, onachtzaamheid of nalatigheid van de kapitein of de schipper, een ander lid van de bemanning, de loods
      of de ondergeschikten van de vervoerder, gepleegd bij de navigatie van het schip.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel974
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel982
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '974'
        hoofdstuk: III
        afdeling: '3'
  - number: '982.2'
    text: |-
      Behoudens de [artikelen 974 tot en met 977][ref1] wordt generlei afwijking van de koers tot redding of poging
      tot redding van mensenlevens of goederen en generlei redelijke afwijking van de koers beschouwd als een schending
      van enige vervoerovereenkomst en de vervoerder is niet aansprakelijk voor enig verlies of enige schade daardoor
      ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel974
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel982
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '974'
        hoofdstuk: III
        afdeling: '3'
  - number: '983.1'
    text: |-
      De aansprakelijkheid van de vervoerder is in geval van dood, letsel of vertraging van de reiziger en in geval
      van verlies, beschadiging of vertraging van diens bagage beperkt tot een bij of krachtens algemene maatregel van
      bestuur te bepalen bedrag of bedragen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel983
  - number: '983.2'
    text: |-
      Dit artikel laat de [titels 7][ref1] en [12][ref2] van dit boek onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel983
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005034
        hoofdstuk: III
  - number: '984.1'
    text: |-
      De vervoerder kan zich niet beroepen op enige beperking van zijn aansprakelijkheid voor zover de schade is ontstaan
      uit zijn eigen handeling of nalaten, geschied hetzij met het opzet die schade te veroorzaken, hetzij roekeloos en
      met de wetenschap dat die schade er waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel984
  - number: '984.2'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel984
  - number: '985'
    text: |-
      Nietig is ieder vóór het aan de reiziger overkomen voorval of vóór het verlies of beschadiging van bagage gemaakt
      beding, waarbij de ingevolge de [artikelen 974 tot en met 977][ref1] op de vervoerder drukkende aansprakelijkheid
      of bewijslast wordt verminderd op andere wijze dan in deze afdeling is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel974
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel985
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '974'
        hoofdstuk: III
        afdeling: '3'
  - number: '986'
    text: |-
      Op de overeenkomst van personenvervoer over binnenwateren zijn de [artikelen 521 tot en met 528][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel521
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel986
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '521'
        hoofdstuk: II
        afdeling: '3'
  - number: '990.1'
    text: |-
      Onder de overeenkomst (rompbevrachting), waarbij de ene partij (de rompvervrachter) zich verbindt een schip
      uitsluitend op binnenwateren terbeschikking te stellen van haar wederpartij (de rompbevrachter) zonder daarover
      nog enige zeggenschap te houden, ligt de exploitatie van het schip in handen van de rompbevrachter en geschiedt zij
      voor diens rekening.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel990
  - number: '990.2'
    text: |-
      [Artikel 894][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel894
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel990
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '894'
        hoofdstuk: III
        afdeling: '2'
  - number: '991.1'
    text: |-
      Op de overeenkomst, waarbij de ene partij zich verbindt een schip, anders dan bij wijze van rompbevrachting,
      uitsluitend op binnenwateren terbeschikking te stellen van de andere partij voor andere doeleinden dan het aan
      boord daarvan opslaan of het daarmee vervoeren van zaken of personen zijn de bepalingen nopens avarij-grosse
      alsmede de bepalingen van deze titel en, indien het een zeeschip betreft, de [artikelen 361 tot en met 366][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel361
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel991
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '361'
        hoofdstuk: II
        afdeling: '1'
  - number: '991.2'
    text: |-
      Partijen hebben de vrijheid af te wijken van in het eerste lid op hun onderlinge verhouding toepasselijk verklaarde
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel991
  - number: '992.1'
    text: |-
      De ligovereenkomst is de overeenkomst, waarbij de ene partij (de vervrachter) zich verbindt een schip anders dan
      bij wijze van rompbevrachting uitsluitend op binnenwateren terbeschikking te stellen van de andere partij (de
      bevrachter), teneinde aan boord daarvan zaken te laden, op te slaan en daaruit te lossen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel992
  - number: '992.2'
    text: |-
      De ligovereenkomst kan voor bepaalde of voor onbepaalde tijd worden aangegaan. Indien zij voor bepaalde tijd
      is aangegaan en na afloop van die tijd stilzwijgend wordt verlengd, wordt zij vermoed een voor onbepaalde tijd
      aangegane overeenkomst te zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel992
  - number: '992.3'
    text: |-
      Op de ligovereenkomst zijn de bepalingen nopens avarij-grosse alsmede de bepalingen van deze titel en, indien het
      een zeeschip betreft, de [artikelen 361 tot en met 366][ref1] van overeenkomstige toepassing, met dien verstande,
      dat partijen de vrijheid hebben in hun onderlinge verhouding van deze bepalingen af te wijken.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel361
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel992
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '361'
        hoofdstuk: II
        afdeling: '1'
  - number: '993.1'
    text: |-
      Indien de ligovereenkomst voor onbepaalde tijd is aangegaan, kan zij door de bevrachter zonder termijn en door de
      vervrachter met een termijn van tenminste zeven dagen worden opgezegd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel993
  - number: '993.2'
    text: |-
      Bij opzegging door de vervrachter moet het schip na afloop van de door deze gestelde termijn door de bevrachter
      zijn gelost.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel993
  - number: '993.3'
    text: |-
      De ligprijs is verschuldigd tot en met de dag, waarop de lossing is voltooid, doch in elk geval tot en met de
      tweede dag volgend op de dag van de opzegging door de bevrachter.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel993
  - number: '993.4'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving of enig ander bericht, waarvan de
      ontvangst duidelijk aantoonbaar is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel993
  - number: '994.1'
    text: |-
      De overeenkomst voor liggen en/of varen is de overeenkomst, waarbij de ene partij (de vervrachter) zich verbindt
      een schip, anders dan bij wijze van rompbevrachting, uitsluitend op binnenwateren ter beschikking te stellen van de
      andere partij (de bevrachter) en waarbij de bevrachter de keuze heeft het schip slechts te laten liggen of het, na
      een tijd van liggen, te laten varen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel994
  - number: '994.2'
    text: |-
      Het liggen wordt beheerst door het omtrent de ligovereenkomst bepaalde; op het varen zijn de bepalingen
      nopens avarij-grosse, alsmede de bepalingen van deze titel en, indien het een zeeschip betreft, de
      [artikelen 361 tot en met 366][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel361
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel994
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '361'
        hoofdstuk: II
        afdeling: '1'
  - number: '995'
    text: |-
      De bevrachter heeft het recht het schip gedeeltelijk te lossen en daarna te laten varen. In dat geval is hij de
      vracht verschuldigd, die bij varen met de volle lading verschuldigd zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel995
  - number: '996.1'
    text: |-
      De vervrachter kan, wanneer geen bepaalde ligtijd is overeengekomen, met een termijn van ten minste zeven dagen
      de ligtijd beëindigen door een mondelinge of schriftelijke kennisgeving aan de bevrachter, dan wel door enig ander
      bericht, waarvan de ontvangst duidelijk aantoonbaar is. Deelt de bevrachter aan de vervrachter niet binnen 48
      uur na ontvangst van deze kennisgeving mede, dat hij het schip wenst te laten varen, dan gaat na afloop van deze
      termijn van 48 uur de lostijd in.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel996
  - number: '996.2'
    text: |-
      De ligprijs is verschuldigd tot en met de dag, waarop de lossing is voltooid, doch in elk geval tot en met de
      tweede dag volgend op de dag, waarop de vervrachter de in het eerste lid bedoelde mededeling deed.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel996
  - number: '997.1'
    text: |-
      Indien de bevrachter het schip wenst te laten varen is de vervrachter verplicht uiterlijk op de eerste werkdag
      volgende op die, waarop hij daarvan kennisgeving heeft ontvangen, de reis aan te vangen. Wordt hij in de
      aanvaarding van de reis door de bevrachter opgehouden, dan is deze verplicht hem op de voet van [artikel 932][ref1]
      schade te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel932
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel997
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '932'
        hoofdstuk: III
        afdeling: '2'
  - number: '997.2'
    text: |-
      Kan de reis door omstandigheden, die de vervrachter niet toe te rekenen zijn en die reeds bestonden ten tijde van
      de opdracht tot varen, niet worden aangevangen of vervolgd, dan blijft, zolang de verhindering duurt, de ligprijs
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel997
  - number: '998'
    text: |-
      Voor de toepassing van de bepalingen van deze afdeling wordt ter beschikkingstelling van een en eenzelfde schip ter
      zee en op binnenwateren beschouwd als terbeschikkingstelling op binnenwateren, mits de terbeschikkingstelling ter
      zee kennelijk ondergeschikt is aan die op binnenwateren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel998
  - number: '1000'
    text: |-
      Onder binnenschepen worden in deze afdeling mede verstaan draagvleugelboten, vlotten, veerponten, beweegbare delen
      van schipbruggen, baggermolens, drijvende kranen, elevatoren en alle drijvende werktuigen, pontons of materiaal
      van soortgelijke aard, die voldoen aan de in de [artikelen 1][ref1] en [3][ref2] ten aanzien van binnenschepen
      vermelde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel3
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1000
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '3'
        hoofdstuk: I
  - number: '1001'
    text: Aanvaring is de aanraking van schepen met elkaar.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1001
  - number: '1002'
    text: |-
      Het in deze afdeling omtrent aanvaring bepaalde vindt - voor zover niet [afdeling 1 van titel 6][ref1] van
      toepassing is - eveneens toepassing indien schade door een binnenschip is veroorzaakt zonder dat een aanvaring
      plaatshad.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1002
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '1'
  - number: '1003'
    text: |-
      Indien een binnenschip door een aanvaring schade heeft veroorzaakt, wordt de aansprakelijkheid voor deze schade
      geregeld door deze afdeling, voor zover althans niet [afdeling 1 van titel 6][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1003
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '1'
  - number: '1004.1'
    text: |-
      Verplichting tot schadevergoeding op grond van deze afdeling bestaat slechts indien de schade is veroorzaakt door
      schuld. Er bestaat geen wettelijk vermoeden van schuld terzake van een aanvaring, doch het schip, dat in aanraking
      komt met een andere, zo nodig behoorlijk verlichte, vaste of te bekwamer plaats vastgemaakte zaak, geen schip
      zijnde, is aansprakelijk voor de schade, tenzij blijkt dat de schade niet is veroorzaakt door schuld van het schip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1004
  - number: '1004.2'
    text: |-
      Indien de schade is veroorzaakt door toeval, indien zij is toe te schrijven aan overmacht of indien haar oorzaken
      niet kunnen worden vastgesteld, wordt zij gedragen door hen, die haar hebben geleden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1004
  - number: '1004.3'
    text: |-
      In geval van slepen is ieder binnenschip, dat deel uitmaakt van een sleep, slechts aansprakelijk indien er schuld
      aan zijn zijde is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1004
  - number: '1005'
    text: |-
      Indien de schade is veroorzaakt door de schuld van één binnenschip, is de eigenaar van dit schip verplicht de
      schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1005
  - number: '1006.1'
    text: |-
      Indien twee of meer binnenschepen gezamenlijk door hun schuld schade hebben veroorzaakt, zijn de eigenaren daarvan
      zonder hoofdelijkheid aansprakelijk voor de schade, toegebracht aan medeschuldige schepen en aan goederen, die zich
      aan boord daarvan bevinden, en hoofdelijk voor alle overige schade.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1006
  - number: '1006.2'
    text: |-
      Is de aansprakelijkheid niet hoofdelijk, dan zijn de eigenaren van de schepen, die gezamenlijk door hun schuld de
      schade hebben veroorzaakt, tegenover de benadeelden aansprakelijk in verhouding tot het gewicht van de schuld van
      hun schepen; indien echter de omstandigheden meebrengen, dat die verhouding niet kan worden vastgesteld of indien
      blijkt dat de schuld van deze schepen gelijkwaardig is, wordt de aansprakelijkheid in gelijke delen verdeeld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1006
  - number: '1006.3'
    text: |-
      Is de aansprakelijkheid hoofdelijk, dan moet elk der aansprakelijke eigenaren zijn door het tweede lid van dit
      artikel vastgestelde aandeel in de betaling aan de schuldeiser voor zijn rekening nemen. Onder voorbehoud van de
      [artikelen 880][ref1] en [364][ref2] heeft hij, die meer dan zijn aandeel heeft betaald, voor het overschot verhaal
      op zijn medeschuldenaren die minder dan hun aandeel hebben betaald. Verlies, veroorzaakt door het onvermogen van
      een der eigenaren van de medeschuldige schepen om te betalen, wordt over de andere eigenaren omgeslagen in de door
      het tweede lid van dit artikel vastgestelde verhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel880
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel364
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1006
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '880'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '364'
        hoofdstuk: II
        afdeling: '1'
  - number: '1007'
    text: |-
      De krachtens deze afdeling bestaande aansprakelijkheid wordt niet opgeheven ingeval de schade is veroorzaakt door
      de schuld van een loods, zelfs niet als het gebruik van deze verplicht is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1007
  - number: '1010'
    text: |-
      De hulpverlening door binnenschepen en de hulp aan binnenschepen, aan zich aan boord daarvan bevindende zaken
      of aan van een binnenschip afkomstige in bevaarbaar water of welk ander water dan ook driftige, aangespoelde of
      gezonken zaken worden geregeld door [afdeling 2 van titel 6][ref1], met dien verstande dat hetgeen in die afdeling
      voor de reder is bepaald, wanneer het een binnenschip betreft, geldt voor de eigenaar daarvan en hetgeen voor de
      kapitein is bepaald, wanneer het een binnenschip betreft, geldt voor de schipper daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1010
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '2'
  - number: '1020.1'
    text: |-
      Avarij-grosse zijn de opofferingen en uitgaven redelijkerwijs verricht of gedaan bij aanwezigheid van bijzondere
      omstandigheden met het doel een binnenschip en de goederen aan boord daarvan uit een gemeenschappelijk gevaar, hoe
      of door wiens toedoen dit ook zij ontstaan, te redden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1020
  - number: '1020.2'
    text: Verlies van passagegeld is geen avarij-grosse.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1020
  - number: '1021.1'
    text: |-
      Avarij-grosse wordt aan hem, die haar leed, vergoed door de eigenaar van het binnenschip, de belanghebbende bij de
      vracht, de ontvanger van de lading en de eigenaren van de overige zich aan boord bevindende zaken met uitzondering
      van postzendingen, mondvoorraden, passagiersbagage, zelfs wanneer geregistreerd, en van persoonlijke bezittingen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1021
  - number: '1021.2'
    text: |-
      In afwijking van het eerste lid draagt een motorrijtuig of schip, dat door een vervoerder in verband met een
      overeenkomst van personenvervoer aan boord van het binnenschip wordt vervoerd, bij in de avarij-grosse.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1021
  - number: '1022'
    text: |-
      De vergoedingen in avarij-grosse en de dragende waarden der in de avarij-grosse bijdragende belangen worden
      bovendien bepaald met inachtneming van de Rijnregels I.V.R, nader omschreven bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1022
  - number: '1030'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1030
  - number: 1030.a
    text: |-
      *"gevaarlijke stof"*: een stof die als zodanig bij algemene maatregel van bestuur is aangewezen; de aanwijzing
      kan worden beperkt tot bepaalde concentraties van de stof, tot bepaalde in de algemene maatregel van bestuur te
      omschrijven gevaren die aan de stof verbonden zijn, en tot bepaalde daarin te omschrijven situaties waarin de stof
      zich bevindt;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1030
  - number: 1030.b
    text: '*"schip"*: binnenschip, niet zijnde een luchtkussenvoertuig;'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1030
  - number: 1030.c
    text: '*"schade"*:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1030
  - number: 1030.c.1°
    text: schade veroorzaakt door dood of letsel van enige persoon veroorzaakt door een gevaarlijke stof;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1030
  - number: 1030.c.2°
    text: |-
      andere schade buiten het schip aan boord waarvan de gevaarlijke stof zich bevindt, veroorzaakt door die gevaarlijke
      stof, met uitzondering van verlies van of schade met betrekking tot andere schepen of zeeschepen en zaken aan boord
      daarvan, indien die schepen of zeeschepen deel uitmaken van een sleep, waarvan ook dit schip deel uitmaakt, of
      hecht met dit schip in een eenheid zijn gekoppeld;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1030
  - number: 1030.c.3°
    text: de kosten van preventieve maatregelen en verlies of schade veroorzaakt door zulke maatregelen;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1030
  - number: 1030.d
    text: |-
      *"preventieve maatregel"*: iedere redelijke maatregel ter voorkoming of beperking van schade door wie dan ook
      genomen met uitzondering van de overeenkomstig deze afdeling aansprakelijke persoon nadat een gebeurtenis heeft
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1030
  - number: 1030.e
    text: |-
      *"gebeurtenis"*: elk feit of elke opeenvolging van feiten met dezelfde oorzaak, waardoor schade ontstaat of
      waardoor een ernstige en onmiddellijke dreiging van schade ontstaat;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1030
  - number: 1030.f
    text: |-
      *"eigenaar"*: hij die de zeggenschap heeft over het gebruik van het schip aan boord waarvan de gevaarlijke
      stof zich bevindt. De persoon die in een register waarin het schip te boek staat, als eigenaar van het schip
      is ingeschreven, of, bij gebreke van enige teboekstelling, de persoon die het schip in eigendom heeft, wordt
      aangemerkt als eigenaar, tenzij hij bewijst dat ten tijde van de gebeurtenis een door hem bij name genoemde ander
      de zeggenschap over het gebruik van het schip had of dat op dat tijdstip een ander zonder zijn toestemming en
      zonder dat hij zulks redelijkerwijs kon voorkomen de zeggenschap over het gebruik van het schip had.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1030
  - number: '1031.1'
    text: |-
      Deze afdeling is niet van toepassing, indien de eigenaar jegens degene die de vordering instelt, aansprakelijk
      is uit hoofde van een exploitatie-overeenkomst of jegens deze persoon een beroep op een exploitatie-overeenkomst
      heeft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1031
  - number: '1031.2'
    text: |-
      Deze afdeling is van toepassing op de periode waarin een gevaarlijke stof zich aan boord van een schip bevindt,
      daaronder begrepen de periode vanaf het begin van de inlading van de gevaarlijke stof in het schip tot het einde
      van de lossing van die stof uit het schip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1031
  - number: '1031.3'
    text: |-
      Deze afdeling is niet van toepassing op schade veroorzaakt wanneer het schip uitsluitend wordt gebruikt in een
      niet voor publiek toegankelijk gebied en zulk gebruik een onderdeel vormt van een in dat gebied plaatsvindende
      bedrijfsuitoefening.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1031
  - number: '1031.4'
    text: |-
      Op zich overeenkomstig het tweede lid aan boord bevindende stoffen als bedoeld in [artikel 175 van Boek 6][ref1] is
      dat artikel niet van toepassing, tenzij zich het geval van het derde lid voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel175
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1031
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '175'
  - number: '1032.1'
    text: |-
      Indien een gevaarlijke stof zich bevindt in een vervoermiddel dat zich aan boord van een schip bevindt zonder dat
      de gevaarlijke stof uit dit gestapelde vervoermiddel wordt gelost, zal de gevaarlijke stof voor die periode geacht
      worden zich alleen aan boord van genoemd schip te bevinden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1032
  - number: '1032.2'
    text: |-
      Indien een gevaarlijke stof zich bevindt in een schip dat wordt gesleept door een ander schip of door een zeeschip
      of wordt voortbewogen door een ander schip of door een zeeschip, dat hecht met dit schip in een eenheid gekoppeld
      is, zal de gevaarlijke stof geacht worden zich alleen aan boord van laatstgenoemd schip of zeeschip te bevinden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1032
  - number: '1032.3'
    text: |-
      Gedurende de handelingen bedoeld in [artikel 1033][ref1], vijfde lid, onderdelen *c*, *d* en *e*, zal de
      gevaarlijke stof geacht worden:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1033
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1032
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1033'
        hoofdstuk: III
        afdeling: '4'
  - number: 1032.3.a
    text: in afwijking van het eerste lid, zich alleen aan boord van het gestapelde vervoermiddel te bevinden;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1032
  - number: 1032.3.b
    text: in afwijking van het tweede lid, zich alleen aan boord van eerstgenoemd schip te bevinden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1032
  - number: '1033.1'
    text: |-
      Hij die ten tijde van een gebeurtenis eigenaar is van een schip aan boord waarvan zich een gevaarlijke stof
      bevindt, is aansprakelijk voor de schade door die stof veroorzaakt ten gevolge van die gebeurtenis. Bestaat de
      gebeurtenis uit een opeenvolging van feiten met dezelfde oorzaak, dan rust de aansprakelijkheid op degene die ten
      tijde van het eerste feit eigenaar was.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1033
  - number: '1033.2'
    text: 'De eigenaar is niet aansprakelijk indien:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1033
  - number: 1033.2.a
    text: |-
      de schade is veroorzaakt door een oorlogshandeling, vijandelijkheden, burgeroorlog, opstand of natuurgebeuren van
      uitzonderlijke, onvermijdelijke en onweerstaanbare aard;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1033
  - number: 1033.2.b
    text: |-
      de schade uitsluitend is veroorzaakt door een handelen of nalaten van een derde, niet zijnde een persoon genoemd in
      het vijfde lid, onderdeel *a*, geschied met het opzet de schade te veroorzaken;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1033
  - number: 1033.2.c
    text: |-
      de afzender of enige andere persoon niet heeft voldaan aan zijn verplichting hem in te lichten over de gevaarlijke
      aard van de stof, en noch de eigenaar, noch de in het vijfde lid, onderdeel *a*, genoemde personen wisten of hadden
      behoren te weten dat deze gevaarlijk was.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1033
  - number: '1033.3'
    text: |-
      Indien de eigenaar bewijst dat de schade geheel of gedeeltelijk het gevolg is van een handelen of nalaten van de
      persoon die de schade heeft geleden, met het opzet de schade te veroorzaken, of van de schuld van die persoon, kan
      hij geheel of gedeeltelijk worden ontheven van zijn aansprakelijkheid tegenover die persoon.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1033
  - number: '1033.4'
    text: |-
      De eigenaar kan voor schade slechts uit anderen hoofde dan deze afdeling worden aangesproken in het geval van het
      tweede lid, onderdeel *c*, alsmede in het geval dat hij uit hoofde van arbeidsovereenkomst kan worden aangesproken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1033
  - number: '1033.5'
    text: |-
      Behoudens de [artikelen 1034][ref1] en [1035][ref2] zijn voor schade niet aansprakelijk:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1034
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1035
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1033
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1034'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1035'
        hoofdstuk: III
        afdeling: '4'
  - number: 1033.5.a
    text: de ondergeschikten, vertegenwoordigers of lasthebbers van de eigenaar of de leden van de bemanning,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1033
  - number: 1033.5.b
    text: de loods en ieder ander die, zonder bemanningslid te zijn, ten behoeve van het schip werkzaamheden verricht,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1033
  - number: 1033.5.c
    text: |-
      zij die anders dan tegen een uitdrukkelijk en redelijk verbod vanwege het schip in hulp verlenen aan het schip, de
      zich aan boord daarvan bevindende zaken of de opvarenden,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1033
  - number: 1033.5.d
    text: |-
      zij die op aanwijzing van een bevoegde overheidsinstantie hulp verlenen aan het schip, de zich aan boord daarvan
      bevindende zaken of de opvarenden,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1033
  - number: 1033.5.e
    text: zij die preventieve maatregelen nemen met uitzondering van de eigenaar,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1033
  - number: 1033.5.f
    text: |-
      de ondergeschikten, vertegenwoordigers of lasthebbers van de in dit lid, onderdelen *b*, *c*, *d* en *e*,
      van aansprakelijkheid vrijgestelde personen, tenzij de schade is ontstaan uit hun eigen handelen of nalaten,
      geschied hetzij met het opzet die schade te veroorzaken, hetzij roekeloos en met de wetenschap dat die schade er
      waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1033
  - number: '1033.6'
    text: |-
      De eigenaar heeft, voor zover niet anders is overeengekomen, verhaal op de in het vijfde lid bedoelde personen,
      doch uitsluitend indien dezen ingevolge het slot van dit lid voor de schade kunnen worden aangesproken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1033
  - number: '1034.1'
    text: |-
      Indien de eigenaar bewijst dat de gevaarlijke stof tijdens de periode bedoeld in [artikel 1031, tweede lid][ref1],
      is geladen of gelost onder de uitsluitende verantwoordelijkheid van een door hem bij name genoemde ander dan de
      eigenaar of zijn ondergeschikte, vertegenwoordiger of lasthebber, zoals de afzender of ontvanger, is de eigenaar
      niet aansprakelijk voor de schade als gevolg van een gebeurtenis tijdens het laden of lossen van de gevaarlijke
      stof en is die ander voor deze schade aansprakelijk overeenkomstig deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1031
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1034
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1031'
        hoofdstuk: III
        afdeling: '4'
  - number: '1034.2'
    text: |-
      Indien echter de gevaarlijke stof tijdens de periode bedoeld in [artikel 1031, tweede lid][ref1], is geladen of
      gelost onder de gezamenlijke verantwoordelijkheid van de eigenaar en een door de eigenaar bij name genoemde ander,
      zijn de eigenaar en die ander hoofdelijk aansprakelijk overeenkomstig deze afdeling voor de schade als gevolg van
      een gebeurtenis tijdens het laden of lossen van de gevaarlijke stof.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1031
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1034
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1031'
        hoofdstuk: III
        afdeling: '4'
  - number: '1034.3'
    text: |-
      Indien is geladen of gelost door een persoon in opdracht of ten behoeve van de vervoerder of een ander, zoals de
      afzender of de ontvanger, is niet deze persoon, maar de vervoerder of die ander aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1034
  - number: '1034.4'
    text: |-
      Indien een ander dan de eigenaar op grond van het eerste of het tweede lid aansprakelijk is, kan die ander geen
      beroep doen op [artikel 1033, vierde lid en vijfde lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1033
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1034
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1033'
        hoofdstuk: III
        afdeling: '4'
  - number: '1034.5'
    text: |-
      Indien een ander dan de eigenaar op grond van het eerste of het tweede lid
      aansprakelijk is, zijn ten aanzien van die ander [titel 12][ref1] alsmede de
      [artikelen 642a tot en met 642z van het Wetboek van Burgerlijke Rechtsvordering][ref2] van overeenkomstige
      toepassing, met dien verstande dat in geval van hoofdelijke aansprakelijkheid:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel642a
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1034
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 642a
  - number: 1034.5.a
    text: |-
      de beperking van aansprakelijkheid krachtens [titel 12][ref1] geldt voor het geheel der naar aanleiding van
      eenzelfde gebeurtenis ontstane vorderingen gericht tegen beiden;


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1034
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: III
  - number: 1034.5.b
    text: |-
      een fonds gevormd door één van hen overeenkomstig
      [artikel 642c van het Wetboek van Burgerlijke Rechtsvordering][ref1] wordt aangemerkt als door beiden te zijn
      gevormd en zulks ten aanzien van de vorderingen waarvoor het fonds werd gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642c
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1034
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642c
  - number: '1034.6'
    text: |-
      In de onderlinge verhouding tussen de eigenaar en de in het tweede lid van dit artikel genoemde ander is
      de eigenaar niet tot vergoeding verplicht dan in geval van schuld van hemzelf of van zijn ondergeschikten,
      vertegenwoordigers of lasthebbers.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1034
  - number: '1034.7'
    text: |-
      Dit artikel is niet van toepassing als tijdens de periode, bedoeld in [artikel 1031, tweede lid][ref1], is
      geladen of gelost onder de uitsluitende of gezamenlijke verantwoordelijkheid van een persoon, genoemd in
      [artikel 1033, vijfde lid, onderdeel c, d of e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1031
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1033
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1034
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1031'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1033'
        hoofdstuk: III
        afdeling: '4'
  - number: '1035'
    text: |-
      Indien ingevolge [artikel 1033, tweede lid][ref1], onderdeel *c*, de eigenaar niet aansprakelijk is, is de afzender
      of andere persoon aansprakelijk overeenkomstig deze afdeling en zijn te diens aanzien [titel 12][ref2] alsmede
      de [artikelen 642a tot en met 642z van het Wetboek van Burgerlijke Rechtsvordering][ref3] van overeenkomstige
      toepassing. De afzender of andere persoon kan geen beroep doen op [artikel 1033, vierde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1033
      [ref2]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel642a
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1033
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1035
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1033'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 642a
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '1033'
        hoofdstuk: III
        afdeling: '4'
  - number: '1036'
    text: |-
      Indien schade veroorzaakt door de gevaarlijke stof redelijkerwijs niet kan worden gescheiden van schade anderszins
      veroorzaakt, zal de gehele schade worden aangemerkt als schade in de zin van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1036
  - number: '1037.1'
    text: |-
      Wanneer door een gebeurtenis schade is veroorzaakt door gevaarlijke stoffen aan boord van meer dan één schip,
      dan wel aan boord van een schip en een zeeschip of een luchtkussenvoertuig, zijn de eigenaren en de reder
      of de exploitant van de daarbij betrokken schepen, het zeeschip of het luchtkussenvoertuig, onverminderd
      het in [artikel 1033, tweede en derde lid][ref1], en [artikel 1034][ref2], [afdeling 4 van titel 6][ref3] en
      [afdeling 1 van titel 14][ref4] bepaalde, hoofdelijk aansprakelijk voor alle schade waarvan redelijkerwijs niet
      kan worden aangenomen dat zij veroorzaakt is door gevaarlijke stoffen aan boord van één of meer bepaalde schepen,
      zeeschip of luchtkussenvoertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1033
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1034
      [ref3]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref4]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1037
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1033'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1034'
        hoofdstuk: III
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005034
        hoofdstuk: IV
        afdeling: '1'
  - number: '1037.2'
    text: |-
      Het bepaalde in het eerste lid laat onverlet het beroep op beperking van aansprakelijkheid van de reder, eigenaar
      of exploitant krachtens [titel 7][ref1] of [titel 12][ref2], dan wel de [artikelen 1218 tot en met 1220][ref3],
      ieder tot het voor hem geldende bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1218
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1037
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005034
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1218'
        hoofdstuk: IV
        afdeling: '1'
  - number: '1060.1'
    text: |-
      De eigenaar van een binnenschip en de hulpverlener kunnen door het stellen van één of meer fondsen als bedoeld in
      [artikel 642][ref1] hun aansprakelijkheid beperken voor de in [artikel 1062][ref2] genoemde vorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642c
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1062
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1060
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642c
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1062'
        hoofdstuk: III
  - number: '1060.2'
    text: |-
      Onder eigenaar worden in deze titel mede verstaan de bevrachter, de huurder en de beheerder van een binnenschip met
      inbegrip van degene in wiens handen de exploitatie van een binnenschip is gelegd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1060
  - number: '1060.3'
    text: |-
      Onder hulpverlener wordt in deze titel een ieder verstaan die werkzaamheden verricht in onmiddellijk verband met
      hulpverlening, waaronder in deze titel mede worden verstaan de in [artikel 1062, eerste lid][ref1], onder *d*, *e*
      en*f*, genoemde werkzaamheden of maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1062
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1060
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1062'
        hoofdstuk: III
  - number: '1060.4'
    text: |-
      Onder binnenschepen worden in deze titel mede verstaan draagvleugelboten, veerponten en kleine vaartuigen,
      baggermolens, drijvende kranen, elevatoren en alle andere drijvende en verplaatsbare werktuigen, pontons of
      materiaal van soortgelijke aard, die voldoen aan de in de [artikelen 1][ref1] en [3][ref2] van dit boek ten
      aanzien van binnenschepen vermelde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel3
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1060
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '3'
        hoofdstuk: I
  - number: '1060.5'
    text: |-
      Een binnenschip in aanbouw wordt voor de toepassing van deze titel mede als binnenschip aangemerkt van het ogenblik
      af dat de stapelloop aanvangt. Een luchtkussenvoertuig wordt voor de toepassing van deze titel niet als binnenschip
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1060
  - number: '1061.1'
    text: |-
      Indien een vordering als genoemd in [artikel 1062][ref1] wordt gericht tegen enige persoon voor wiens handeling,
      onachtzaamheid of nalatigheid de eigenaar of de hulpverlener in beginsel aansprakelijk is, heeft deze persoon de in
      deze titel verleende bevoegdheid tot beperking van zijn aansprakelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1062
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1061
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1062'
        hoofdstuk: III
  - number: '1061.2'
    text: |-
      De verzekeraar van de aansprakelijkheid voor vorderingen, waarvoor op grond van deze titel beperking van
      aansprakelijkheid mogelijk is, kan zich in dezelfde mate als zijn verzekerde op die beperking beroepen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1061
  - number: '1062.1'
    text: |-
      Onder voorbehoud van de [artikelen 1063][ref1] en [1064][ref2] bestaat de bevoegdheid tot beperking van
      aansprakelijkheid voor de hierna genoemde vorderingen ingesteld hetzij op grond van overeenkomst, hetzij buiten
      overeenkomst en zelfs wanneer de aansprakelijkheid uitsluitend voortvloeit uit eigendom of bezit van of een
      voorrecht op het schip of uit het feit, dat dit onder hoede of toezicht is van hem die zich op de beperking van
      aansprakelijkheid beroept:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1063
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1064
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1062
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1063'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1064'
        hoofdstuk: III
  - number: 1062.1.a
    text: |-
      vorderingen terzake van dood of letsel, dan wel terzake van verlies van of schade aan zaken (met inbegrip van
      schade aan kunstwerken van havens, aan dokken, waterwegen, sluizen, bruggen en hulpmiddelen voor de scheepvaart),
      opgekomen aan boord van het binnenschip of in rechtstreeks verband met de exploitatie van het binnenschip of met
      werkzaamheden ter hulpverlening, alsmede voor vorderingen terzake van schade tengevolge van een of ander;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1062
  - number: 1062.1.b
    text: vorderingen terzake van schade ontstaan door vertraging bij het vervoer van lading, reizigers of hun bagage;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1062
  - number: 1062.1.c
    text: |-
      vorderingen terzake van andere schade ontstaan door inbreuk op enig niet op overeenkomst gegrond vermogensrecht en
      opgekomen in rechtstreeks verband met de exploitatie van het binnenschip of met werkzaamheden ter hulpverlening;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1062
  - number: 1062.1.d
    text: |-
      vorderingen terzake van het vlotbrengen, verwijderen, vernietigen of onschadelijk maken van een zee- of binnenschip
      dat is gezonken, schipbreuk heeft geleden, gestrand of verlaten is, met inbegrip van alles wat aan boord van zulk
      een schip is of is geweest;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1062
  - number: 1062.1.e
    text: vorderingen terzake van het verwijderen, vernietigen of onschadelijk maken van de lading van het binnenschip;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1062
  - number: 1062.1.f
    text: |-
      vorderingen van een persoon terzake van maatregelen genomen om schade te voorkomen of te verminderen voor welke
      schade de daarvoor aansprakelijke persoon zijn aansprakelijkheid op grond van deze titel zou kunnen beperken,
      alsmede voor vorderingen terzake van verdere schade door zulke maatregelen geleden, één en ander echter met
      uitzondering van dusdanige vorderingen van deze aansprakelijke persoon zelf.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1062
  - number: '1062.2'
    text: |-
      Aansprakelijkheid voor de in het eerste lid genoemde vorderingen kan worden beperkt, ook indien deze, al dan
      niet op grond van een overeenkomst, zijn ingesteld bij wijze van verhaal of vrijwaring. De aansprakelijkheid voor
      de vorderingen in het eerste lid genoemd onder *d*, *e* of*f*, kan echter niet worden beperkt voor zover deze
      vorderingen betrekking hebben op een vergoeding verschuldigd op grond van een overeenkomst met de aansprakelijke
      persoon.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1062
  - number: '1063.1'
    text: 'Deze titel is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1063
  - number: 1063.1.a
    text: vorderingen uit hoofde van hulpverlening of bijdrage in avarij-grosse;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1063
  - number: 1063.1.b
    text: |-
      vorderingen onderworpen aan enig internationaal verdrag of enige wet, die de beperking van aansprakelijkheid voor
      kernschade regelt of verbiedt;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1063
  - number: 1063.1.c
    text: vorderingen tegen de exploitant van een nucleair binnenschip terzake van kernschade;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1063
  - number: 1063.1.d
    text: |-
      vorderingen uit hoofde van arbeidsovereenkomst tegen de eigenaar of de hulpverlener ingesteld door zijn
      ondergeschikten of hun rechtverkrijgenden voor zover deze vorderingen werkzaamheden betreffen in verband met het
      binnenschip of de hulpverlening, al naar gelang de aansprakelijkheid van de eigenaar of de hulpverlener voor deze
      vorderingen uit hoofde van de op de arbeidsovereenkomst toepasselijke wet niet of slechts tot een hoger bedrag dan
      op grond van deze titel het geval ware, kan worden beperkt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1063
  - number: '1063.2'
    text: |-
      Wanneer iemand die op grond van deze titel bevoegd is zijn aansprakelijkheid te beperken, gerechtigd is tegen
      een schuldeiser een vordering geldend te maken, die voortkomt uit hetzelfde voorval, zullen de respectieve
      vorderingen met elkaar worden verrekend en wordt de beperking van aansprakelijkheid slechts toegepast op het daarna
      mogelijkerwijs overblijvende saldo.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1063
  - number: '1064'
    text: |-
      Niemand is gerechtigd zijn aansprakelijkheid te beperken, indien bewezen is dat de schade is ontstaan door zijn
      eigen handeling of nalaten, geschied hetzij met het opzet die schade te veroorzaken, hetzij roekeloos en met de
      wetenschap dat die schade er waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1064
  - number: '1065'
    text: |-
      Het bedrag waartoe de aansprakelijkheid uit hoofde van deze titel voor vorderingen, naar aanleiding van éénzelfde
      voorval ontstaan, kan worden beperkt (het bedrag van het fonds), wordt berekend naar bij algemene maatregel van
      bestuur vast te stellen maatstaven welke verschillend kunnen zijn voor verschillende soorten schepen en voor
      een hulpverlener. Daarbij kunnen met betrekking tot de in [artikel 1062, eerste lid][ref1], bedoelde vorderingen
      verschillende fondsen worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1062
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1065
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1062'
        hoofdstuk: III
  - number: '1066.1'
    text: |-
      De beperking van aansprakelijkheid als vastgesteld krachtens de in [artikel 1065][ref1] bedoelde algemene maatregel
      van bestuur geldt voor het geheel der naar aanleiding van éénzelfde voorval ontstane vorderingen, die niet zijn
      vorderingen als bedoeld in het tweede lid, gericht tegen


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1065
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1066
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1065'
        hoofdstuk: III
  - number: 1066.1.a
    text: |-
      de persoon of personen genoemd in het tweede lid van [artikel 1060][ref1] en enige persoon voor wiens handeling,
      onachtzaamheid of nalatigheid dezen in beginsel aansprakelijk zijn, of


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1060
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1066
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1060'
        hoofdstuk: III
  - number: 1066.1.b
    text: |-
      de eigenaar van een binnenschip die van dat schip uit hulp verleent, en de hulpverlener of hulpverleners die van
      dat schip uit hun werkzaamheden verricht of verrichten en enige persoon voor wiens handeling, onachtzaamheid of
      nalatigheid deze personen in beginsel aansprakelijk zijn, of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1066
  - number: 1066.1.c
    text: |-
      de hulpverlener of hulpverleners aan een binnenschip die niet van een zee- of binnenschip uit werkzaamheden
      verricht of verrichten of die werkzaamheden verricht of verrichten uitsluitend op het binnenschip waaraan of met
      betrekking waartoe hulp wordt verleend, en enige persoon voor wiens handeling, onachtzaamheid of nalatigheid deze
      personen in beginsel aansprakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1066
  - number: '1066.2'
    text: |-
      De beperking van aansprakelijkheid als vastgesteld krachtens de in [artikel 1065][ref1] bedoelde algemene maatregel
      van bestuur voor vorderingen terzake van dood of letsel van reizigers van een binnenschip geldt voor het geheel
      der naar aanleiding van éénzelfde voorval ontstane vorderingen gericht tegen de persoon of de personen die in de in
      [artikel 1060, tweede lid][ref2], genoemde betrekking staan tot dat schip, en enige persoon voor wiens handeling,
      onachtzaamheid of nalatigheid dezen in beginsel aansprakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1065
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1060
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1066
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1065'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1060'
        hoofdstuk: III
  - number: '1080.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen zaken, die geen voertuigen zijn, voor de toepassing van bepalingen van
      deze titel als voertuig worden aangewezen, dan wel bepalingen van deze titel niet van toepassing worden verklaard
      op zaken, die voertuigen zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1080
  - number: '1080.2'
    text: Een takelwagen is niet een voertuig in de zin van deze titel.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1080
  - number: '1080.3'
    text: |-
      Een overeenkomst, waarbij de ene partij zich tegenover de andere partij verbindt een voertuig te besturen, dat hem
      daartoe door die andere partij ter beschikking is gesteld, is niet een overeenkomst van vervoer in de zin van deze
      titel.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1080
  - number: '1081'
    text: |-
      Op de exploitatie van een voertuig zijn de [artikelen 361 tot en met 366][ref1] van overeenkomstige toepassing,
      met dien verstande dat deze artikelen eveneens van overeenkomstige toepassing zijn wanneer degene op wie krachtens
      [artikel 2 eerste en tweede lid van de Wet Aansprakelijkheidsverzekering Motorrijtuigen][ref2] de verplichting tot
      verzekering rust, de in [artikel 6 dier wet][ref3] bedoelde verzekeraar of een ondergeschikte van een dezer buiten
      overeenkomst wordt aangesproken. De artikelen 361 tot en met 366 zijn bovendien van overeenkomstige toepassing,
      indien het Waarborgfonds Motorverkeer, genoemd in [artikel 23 van eerdervermelde wet][ref4], dan wel het bureau,
      genoemd in het [zesde lid van artikel 2 van die wet][ref5], of een ondergeschikte van een dezer buiten overeenkomst
      wordt aangesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel361
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0002415#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1081
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '361'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002415
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002415
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0002415
        artikel: '23'
      - id: ref5
        bwb_id: BWBR0002415
        artikel: '2'
  - number: '1090'
    text: |-
      De overeenkomst van goederenvervoer in de zin van deze titel is de overeenkomst van goederenvervoer, al dan
      niet tijd- of reisbevrachting zijnde, waarbij de ene partij (de vervoerder) zich tegenover de andere partij (de
      afzender) verbindt door middel van een voertuig zaken uitsluitend over de weg en anders dan langs spoorstaven te
      vervoeren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1090
  - number: '1091'
    text: |-
      Vervoer over de weg van zaken omvat voor de toepassing van [artikel 1098 tweede lid][ref1], in afwijking van het
      elders bepaalde, het tijdvak dat het voertuig zich aan boord van een ander vervoermiddel en niet op de weg bevindt,
      doch dit slechts ten aanzien van zaken die daarbij niet uit dat voertuig werden uitgeladen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1098
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1091
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1098'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1092'
    text: |-
      Deze afdeling is niet van toepassing op overeenkomsten tot lijkbezorging, overeenkomsten tot het vervoeren van
      verhuisgoederen of overeenkomsten tot het vervoeren van postzendingen door of in opdracht van de houder van de
      concessie, bedoeld in de [Postwet][ref1] of onder een internationale postovereenkomst. Onder voorbehoud van artikel
      1154 is deze afdeling niet van toepassing op overeenkomsten tot het vervoeren van bagage.


      [ref1]: https://wetten.overheid.nl/BWBR0004423
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1092
    references:
      - id: ref1
        bwb_id: BWBR0004423
  - number: '1093.1'
    text: |-
      Tijd- of reisbevrachting in de zin van deze afdeling is de overeenkomst van goederenvervoer, waarbij de vervoerder
      zich verbindt tot vervoer door middel van een voertuig, dat hij daartoe in zijn geheel met bestuurder en al dan
      niet op tijdbasis (tijdbevrachting of reisbevrachting) ter beschikking stelt van de afzender.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1093
  - number: '1093.2'
    text: |-
      Onder "vervrachter" is in deze afdeling de in het eerste lid genoemde vervoerder, onder "bevrachter" de aldaar
      genoemde afzender te verstaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1093
  - number: '1094'
    text: |-
      De wetsbepalingen omtrent huur, bewaarneming en bruikleen zijn op terbeschikkingstelling van een voertuig met
      bestuurder, ten einde door middel daarvan zaken te vervoeren, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1094
  - number: '1095'
    text: |-
      De vervoerder is verplicht ten vervoer ontvangen zaken ter bestemming af te leveren en wel in de staat waarin hij
      hen heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1095
  - number: '1096'
    text: |-
      Onverminderd [artikel 1095][ref1] is de vervoerder verplicht ten vervoer ontvangen zaken zonder vertraging te
      vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1095
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1096
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1095'
        hoofdstuk: IV
        afdeling: '2'
  - number: '1097.1'
    text: |-
      In geval van bevrachting is de vervrachter verplicht de bestuurder opdracht te geven binnen de grenzen door de
      overeenkomst gesteld de orders van de bevrachter op te volgen. De vervrachter staat ervoor in, dat de bestuurder de
      hem gegeven opdracht nakomt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1097
  - number: '1097.2'
    text: |-
      De bevrachter staat in voor schade die de vervrachter lijdt door de plaatselijke gesteldheid van de plekken,
      waarheen hij de bestuurder van het voertuig op grond van het eerste lid ter inlading of lossing beveelt te gaan en
      hij is slechts in zoverre voor die schade niet aansprakelijk, als de bestuurder, door de hem gegeven orders op te
      volgen, onredelijk handelde.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1097
  - number: '1098.1'
    text: |-
      De vervoerder is niet aansprakelijk voor schade ontstaan door een beschadiging, voor zover deze is veroorzaakt door
      een omstandigheid die een zorgvuldig vervoerder niet heeft kunnen vermijden en voor zover zulk een vervoerder de
      gevolgen daarvan niet heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1098
  - number: '1098.2'
    text: |-
      De vervoerder kan niet om zich van zijn aansprakelijkheid te ontheffen beroep doen op de gebrekkigheid van het
      voertuig of van het materiaal waarvan hij zich bedient, tenzij dit laatste door de afzender, de geadresseerde of
      de ontvanger te zijner beschikking is gesteld. Onder materiaal wordt niet begrepen een schip, luchtvaartuig of
      spoorwagon, waarop het voertuig zich bevindt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1098
  - number: '1098.3'
    text: |-
      Onder beschadiging worden mede verstaan geheel of gedeeltelijk verlies van zaken, vertraging, alsmede ieder ander
      schade veroorzakend feit.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1098
  - number: '1099'
    text: |-
      Onverminderd de [artikelen 1100][ref1] en [1101][ref2] is de vervoerder, die de op hem uit hoofde van de
      [artikelen 1095][ref3] en [1096][ref4] rustende verplichtingen niet nakwam, desalniettemin voor de daardoor
      ontstane schade niet aansprakelijk, voor zover dit niet nakomen het gevolg is van de bijzondere risico’s verbonden
      aan een of meer van de volgende omstandigheden:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1100
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1101
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1095
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1096
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1099
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1100'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1101'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1095'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '1096'
        hoofdstuk: IV
        afdeling: '2'
  - number: 1099.a
    text: |-
      het vervoer van de zaken in een onoverdekt voertuig, wanneer dit uitdrukkelijk is overeengekomen en op de
      vrachtbrief is vermeld;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1099
  - number: 1099.b
    text: |-
      behandeling, lading, stuwing of lossing van de zaken door de afzender, de geadresseerde of personen, die voor
      rekening van de afzender of de geadresseerde handelen;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1099
  - number: 1099.c
    text: |-
      de aard van bepaalde zaken zelf, die door met deze aard zelf samenhangende oorzaken zijn blootgesteld aan geheel
      of gedeeltelijk verlies of aan beschadiging, in het bijzonder door ontvlamming, ontploffing, smelting, breuk,
      corrosie, bederf, uitdroging, lekkage, normaal kwaliteitsverlies, of optreden van ongedierte of knaagdieren;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1099
  - number: 1099.d
    text: |-
      hitte, koude, temperatuurverschillen of vochtigheid van de lucht, doch slechts indien niet is overeengekomen dat
      het vervoer zal plaatsvinden met een voertuig speciaal ingericht om de zaken aan invloed daarvan te onttrekken;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1099
  - number: 1099.e
    text: onvolledigheid of gebrekkigheid van de adressering, cijfers, letters of merken der colli;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1099
  - number: 1099.f
    text: het feit dat het vervoer een levend dier betreft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1099
  - number: '1100.1'
    text: |-
      Wanneer de vervoerder bewijst dat, gelet op de omstandigheden van het geval, het niet nakomen van de op hem uit
      hoofde van de [artikelen 1095][ref1] en [1096][ref2] rustende verplichtingen een gevolg heeft kunnen zijn van
      een of meer der in [artikel 1099][ref3] genoemde bijzondere risico's, wordt vermoed, dat het niet nakomen daaruit
      voortvloeit. Degeen, die jegens de vervoerder recht heeft op de zaken, kan evenwel bewijzen, dat dit niet nakomen
      geheel of gedeeltelijk niet door een van deze risico’s is veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1095
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1096
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1099
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1100
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1095'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1096'
        hoofdstuk: IV
