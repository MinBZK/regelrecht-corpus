  - number: 1710.b
    text: 'vervoerder: een vervoerder bij een vervoerovereenkomst.'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1710
  - number: 1710.c
    text: 'afzender: een afzender, cognossementhouder, geadresseerde of ontvanger bij een vervoerovereenkomst.'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1710
  - number: 1710.d
    text: |-
      dag van aflevering: dag waarop de onder de vervoerovereenkomst te vervoeren of vervoerde zaken uit het
      vervoermiddel zijn afgeleverd, dan wel, indien zij niet zijn afgeleverd, onder de al dan niet tot uitvoering
      gekomen vervoerovereenkomst hadden moeten zijn afgeleverd. Worden zaken na voortijdige beëindiging van de
      vervoerovereenkomst alsnog door de vervoerder in feite afgeleverd, dan geldt de dag dezer feitelijke aflevering als
      dag van aflevering. Worden zaken op grond van de [artikelen 491][ref1], [957][ref2], [1133][ref3] of [1198][ref4]
      dan wel enig beding van dusdanige strekking verkocht, dan geldt de dag van de verkoop als dag van aflevering.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel491
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel957
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1133
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1198
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1710
