  - number: '1154.2'
    text: |-
      Partijen hebben de vrijheid af te wijken van in het eerste lid op hun onderlinge verhouding toepasselijk verklaarde
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1154
  - number: '1155'
    text: |-
      Indien de vervoerder bewijst dat schuld of nalatigheid van de reiziger schade heeft veroorzaakt of daartoe heeft
      bijgedragen, kan de aansprakelijkheid van de vervoerder daarvoor geheel of gedeeltelijk worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1155
  - number: '1156'
    text: |-
      Indien personen van wier hulp de vervoerder bij de uitvoering van zijn verbintenis gebruik maakt, op verzoek van
      de reiziger diensten bewijzen, waartoe de vervoerder niet is verplicht, worden zij aangemerkt als te handelen in
      opdracht van de reiziger aan wie zij deze diensten bewijzen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1156
  - number: '1157'
    text: |-
      De aansprakelijkheid van de vervoerder is in geval van dood, letsel of vertraging van de reiziger en in geval
      van verlies, beschadiging of vertraging van diens bagage beperkt tot een bij of krachtens algemene maatregel van
      bestuur te bepalen bedrag of bedragen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1157
  - number: '1158.1'
    text: |-
      De vervoerder kan zich niet beroepen op enige beperking van zijn aansprakelijkheid, voor zover de schade is
      ontstaan uit zijn eigen handeling of nalaten, geschied hetzij met het opzet die schade te veroorzaken, hetzij
      roekeloos en met de wetenschap, dat die schade er waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1158
  - number: '1158.2'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1158
  - number: '1159.1'
    text: |-
      In geval van verlies of beschadiging van bagage wordt de vordering tot schadevergoeding gewaardeerd naar de
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1159
  - number: '1159.2'
    text: |-
      In geval van aan de reiziger overkomen letsel of van de dood van de reiziger zijn de [artikelen 107][ref1]
      en [108 van Boek 3][ref2] niet van toepassing op de vorderingen die vervoerder als wederpartij van een andere
      vervoerder tegen deze instelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel108
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1159
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '108'
  - number: '1160'
    text: |-
      De wederpartij van de vervoerder is verplicht deze de schade te vergoeden die hij lijdt doordat de reiziger, door
      welke oorzaak dan ook, niet tijdig ten vervoer aanwezig is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1160
  - number: '1161'
    text: |-
      De wederpartij van de vervoerder is verplicht deze de schade te vergoeden die hij lijdt doordat de documenten met
      betrekking tot de reiziger, die van haar zijde voor het vervoer vereist zijn, door welke oorzaak dan ook, niet naar
      behoren aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1161
  - number: '1162.1'
    text: |-
      Wanneer vóór of tijdens het vervoer omstandigheden aan de zijde van de wederpartij van de vervoerder of de
      reiziger zich opdoen of naar voren komen, die de vervoerder bij het sluiten van de overeenkomst niet behoefde
      te kennen, doch die, indien zij hem wel bekend waren geweest, redelijkerwijs voor hem grond hadden opgeleverd
      de vervoerovereenkomst niet of op andere voorwaarden aan te gaan, is de vervoerder bevoegd de overeenkomst op te
      zeggen en de reiziger uit het voertuig te verwijderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1162
  - number: '1162.2'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving aan de wederpartij van de vervoerder of
      aan de reiziger en de overeenkomst eindigt op het ogenblik van ontvangst van de eerst ontvangen kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1162
  - number: '1162.3'
    text: |-
      Naar maatstaven van redelijkheid en billijkheid zijn partijen na op zegging der overeenkomst verplicht elkaar de
      daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1162
  - number: '1163.1'
    text: |-
      Wanneer vóór of tijdens het vervoer omstandigheden aan de zijde van de vervoerder zich opdoen of naar voren komen,
      die diens wederpartij bij het sluiten van de overeenkomst niet behoefde te kennen, doch die, indien zij haar wel
      bekend waren geweest, redelijkerwijs voor haar grond hadden opgeleverd de vervoerovereenkomst niet of op andere
      voorwaarden aan te gaan, is deze wederpartij van de vervoerder bevoegd de overeenkomst op te zeggen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1163
  - number: '1163.2'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving en de overeenkomst eindigt op het ogenblik
      van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1163
  - number: '1163.3'
    text: |-
      Naar maatstaven van redelijkheid en billijkheid zijn partijen na opzegging der overeenkomst verplicht elkaar de
      daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1163
  - number: '1164'
    text: |-
      Wanneer de reiziger na verlaten van het voertuig niet tijdig terugkeert, kan de vervoerder de overeenkomst
      beschouwen als op dat tijdstip te zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1164
  - number: '1165.1'
    text: |-
      De wederpartij van de vervoerder is steeds bevoegd de overeenkomst op te zeggen. Zij is verplicht de vervoerder de
      schade te vergoeden die deze ten gevolge van de opzegging lijdt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1165
  - number: '1165.2'
    text: Zij kan dit recht niet uitoefenen, wanneer daardoor de reis van het voertuig zou worden vertraagd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1165
  - number: '1165.3'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving en de overeenkomst eindigt op het ogenblik
      van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1165
  - number: '1166.1'
    text: |-
      Wordt ter zake van het vervoer een plaatsbewijs, een ontvangstbewijs voor bagage of enig soortgelijk document
      afgegeven, dan is de vervoerder verplicht daarin op duidelijke wijze zijn naam en woonplaats te vermelden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1166
  - number: '1166.2'
    text: Nietig is ieder beding, waarbij van het eerste lid van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1166
  - number: '1166.3'
    text: |-
      De [artikelen 56 tweede lid][ref1], [75 eerste lid][ref2] en [186 eerste lid van Boek 2][ref3] zijn niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel186
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1166
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '75'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '186'
  - number: '1170.1'
    text: |-
      De verhuisovereenkomst in de zin van deze titel is de overeenkomst van goederenvervoer, waarbij de vervoerder (de
      verhuizer) zich tegenover de afzender (de opdrachtgever) verbindt verhuisgoederen te vervoeren, hetzij uitsluitend
      in een gebouw of woning, hetzij uitsluitend ten dele in een gebouw of woning en ten dele over de weg, hetzij
      uitsluitend over de weg. Vervoer langs spoorstaven wordt niet als vervoer over de weg beschouwd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1170
  - number: '1170.2'
    text: |-
      Verhuisgoederen in de zin van deze titel zijn zaken die zich in een overdekte ruimte bevinden en die tot
      de stoffering, meubilering of inrichting van die ruimte bestemd zijn en als zodanig reeds zijn gebruikt met
      uitzondering van die zaken die volgens verkeersopvatting niet tot de gebruikelijke inhoud van die ruimte behoren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1170
  - number: '1170.3'
    text: |-
      Indien partijen overeenkomen, dat het geheel van het vervoer over de weg zal worden beheerst door het geheel van
      de rechtsregelen, die het zouden beheersen, wanneer het andere zaken dan verhuisgoederen zou betreffen, wordt deze
      overeenkomst niet als verhuisovereenkomst aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1170
  - number: '1171'
    text: |-
      Vervoer over de weg van verhuisgoederen omvat voor de toepassing van [artikel 1175 tweede lid][ref1], in afwijking
      van het elders bepaalde, het tijdvak dat het voertuig aan boord waarvan de verhuisgoederen zich bevinden, zich aan
      boord van een ander vervoermiddel en niet op de weg bevindt, doch dit slechts ten aanzien van verhuisgoederen, die
      daarbij niet uit dat voertuig werden uitgeladen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1175
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1171
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1175'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1172'
    text: |-
      De verhuizer is verplicht verhuisgoederen, die gelet op hun aard of de wijze van vervoer, ingepakt behoren te
      worden of uit elkaar genomen behoren te worden, in te pakken dan wel uit elkaar te nemen en ter bestemming uit te
      pakken, dan wel in elkaar te zetten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1172
  - number: '1173.1'
    text: |-
      De verhuizer is verplicht de verhuisgoederen ter bestemming af te leveren en wel in de staat, waarin zij hem uit
      hoofde van [artikel 1172][ref1] ter verpakking of demontage, dan wel in de staat, waarin zij hem ten vervoer ter
      beschikking zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1172
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1173
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1172'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1173.2'
    text: |-
      Onder afleveren wordt in deze afdeling verstaan het plaatsen van de verhuisgoederen ter bestemming op de daartoe
      mogelijkerwijs aangeduide plek en zulks, bij toepassing van [artikel 1172][ref1], na hen te hebben uitgepakt of in
      elkaar gezet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1172
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1173
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1172'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1174'
    text: |-
      Onverminderd [artikel 1173][ref1] is de verhuizer verplicht een aangevangen verhuizing zonder vertraging te
      voltooien.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1173
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1174
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1173'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1175.1'
    text: |-
      Bij niet nakomen van de op hem uit hoofde van de artikelen 1173 en 1174 rustende verplichtingen is de verhuizer
      desalniettemin voor de daardoor ontstane schade niet aansprakelijk, voor zover dit niet nakomen is veroorzaakt
      door een omstandigheid die een zorgvuldig verhuizer niet heeft kunnen vermijden en voor zover zulk een verhuizer de
      gevolgen daarvan niet heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1175
  - number: '1175.2'
    text: |-
      De verhuizer kan niet om zich van zijn aansprakelijkheid uit hoofde van de artikelen 1173 of 1174 te ontheffen
      beroep doen op:
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1175
  - number: 1175.2.a
    text: de gebrekkigheid van het voertuig dat voor de verhuizing wordt gebezigd;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1175
  - number: 1175.2.b
    text: |-
      de gebrekkigheid van het materiaal, waarvan hij zich bedient, tenzij dit door de opdrachtgever te zijner
      beschikking is gesteld; onder materiaal wordt niet begrepen een schip, luchtvaartuig of spoorwagon, waarop het
      voertuig, dat voor de verhuizing wordt gebezigd, zich bevindt;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1175
  - number: 1175.2.c
    text: de gebrekkigheid van steunpunten benut voor de bevestiging van hijswerktuigen;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1175
  - number: 1175.2.d
    text: |-
      enig door toedoen van derden, wier handelingen niet voor rekening van de opdrachtgever komen, aan de
      verhuisgoederen overkomen ongeval.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1175
  - number: '1175.3'
    text: |-
      Het eerste lid van dit artikel is eveneens van toepassing ten aanzien van aansprakelijkheid van de verhuizer uit
      anderen hoofde dan van de artikelen 1173 of 1174.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1175
  - number: '1176'
    text: |-
      Onverminderd de [artikelen 1177][ref1] en [1178][ref2] is de verhuizer, die de op hem uit hoofde van de
      [artikelen 1173][ref3] en [1174][ref4] rustende verplichtingen niet nakwam, desalniettemin voor de daardoor
      ontstane schade niet aansprakelijk, voor zover dit niet nakomen het gevolg is van de bijzondere risico’s verbonden
      aan een of meer van de volgende omstandigheden:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1177
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1178
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1173
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1174
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1176
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1177'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1178'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1173'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '1174'
        hoofdstuk: IV
        afdeling: '4'
  - number: 1176.a
    text: |-
      het inpakken of uit elkaar nemen, dan wel het uitpakken of in elkaar zetten van verhuisgoederen door de
      opdrachtgever of met behulp van enige persoon of enig middel door de opdrachtgever daartoe eigener beweging ter
      beschikking gesteld;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1176
  - number: 1176.b
    text: |-
      de keuze door de opdrachtgever - hoewel de verhuizer hem een andere mogelijkheid aan de hand deed - van een wijze
      van verpakking of uitvoering van de verhuisovereenkomst, die verschilt van wat voor de overeengekomen verhuizing
      gebruikelijk is;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1176
  - number: 1176.c
    text: |-
      de aanwezigheid onder de verhuisgoederen van zaken waarvoor de verhuizer, indien hij op de hoogte was geweest van
      hun aanwezigheid en hun aard, bijzondere maatregelen zou hebben getroffen;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1176
  - number: 1176.d
    text: |-
      de aard of de staat van de verhuisgoederen zelf, die door met deze aard of staat zelf samenhangende oorzaken zijn
      blootgesteld aan geheel of gedeeltelijk verlies of aan beschadiging.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1176
  - number: '1177'
    text: |-
      Wanneer de verhuizer bewijst dat, gelet op de omstandigheden van het geval, het niet nakomen van de op hem uit
      hoofde van de [artikelen 1173][ref1] en [1174][ref2] rustende verplichtingen een gevolg heeft kunnen zijn van
      een of meer der in [artikel 1176][ref3] genoemde bijzondere risico's, wordt vermoed, dat het niet nakomen daaruit
      voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1173
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1174
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1176
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1177
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1173'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1174'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1176'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1178.1'
    text: |-
      Wanneer de verhuizer de op hem uit hoofde van de [artikelen 1173][ref1] en [1174][ref2] rustende verplichtingen
      niet nakwam, wordt ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1173
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1174
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1178
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1173'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1174'
        hoofdstuk: IV
        afdeling: '4'
  - number: 1178.1.a
    text: levende dieren;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1178
  - number: 1178.1.b
    text: geld, geldswaardige papieren, juwelen, uit edelmetaal vervaardigde of andere kostbare kleinodiën
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1178
  - number: '1178.2'
    text: |-
      De verhuizer kan geen beroep doen op het eerste lid onder *b*, indien de opdrachtgever hem de daar genoemde zaken
      afzonderlijk en onder opgave van hoeveelheid en waarde vóór het begin der verhuizing overhandigde.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1178
  - number: '1179.1'
    text: |-
      Nietig is ieder beding, waarbij de ingevolge [artikel 1173][ref1] op de verhuizer drukkende aansprakelijkheid of
      bewijslast op andere wijze wordt verminderd dan in deze afdeling is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1173
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1179
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1173'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1179.2'
    text: |-
      Wanneer het verhuisgoederen betreft, die door hun karakter of gesteldheid een bijzondere overeenkomst
      rechtvaardigen, staat het partijen in afwijking van het eerste lid vrij de op de verhuizer drukkende
      aansprakelijkheid of bewijslast te verminderen, doch slechts wanneer dit beding uitdrukkelijk en anders dan door
      een verwijzing naar in een ander geschrift voorkomende bedingen is aangegaan bij een in het bijzonder ten aanzien
      van de voorgenomen verhuizing aangegane en in een afzonderlijk geschrift neergelegde overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1179
  - number: '1180'
    text: |-
      Voor zover de verhuizer aansprakelijk is wegens niet nakomen van de op hem uit hoofde van de [artikelen 1173][ref1]
      en [1174][ref2] rustende verplichtingen heeft de opdrachtgever geen ander recht dan te zijner keuze te vorderen
      betaling van een redelijk bedrag voor herstel van beschadigd verhuisgoed, dan wel betaling van een bedrag,
      dat wordt berekend met inachtneming van de waarde welke verhuisgoederen als die, waarop de verhuisovereenkomst
      betrekking heeft, zouden hebben gehad, zoals, ten tijde waarop en ter plaatse waar, zij zijn afgeleverd of zij
      hadden moeten zijn afgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1173
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1174
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1180
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1173'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1174'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1181'
    text: |-
      Indien met betrekking tot een verhuisgoed een schadevergoeding uit hoofde van [artikel 1195][ref1] is verschuldigd,
      wordt deze aangemerkt als een waardevermindering van dat verhuisgoed.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1195
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1181
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1195'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1182'
    text: |-
      Voor zover de verhuizer aansprakelijk is wegens niet nakomen van de op hem uit hoofde van de [artikelen 1173][ref1]
      en [1174][ref2] rustende verplichtingen, is hij niet aansprakelijk boven bij of krachtens algemene maatregel van
      bestuur te bepalen bedragen. Bij of krachtens deze maatregel kan worden vastgesteld welk bedrag van de geleden
      schade voor risico van de opdrachtgever blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1173
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1174
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1182
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1173'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1174'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1183.1'
    text: |-
      De opdrachtgever kan, mits de verhuizer hierin toestemt en tegen betaling van een overeen te komen bedrag,
      schriftelijk een waarde van de verhuisgoederen aangeven, die het maximum, vermeld in de in [artikel 1182][ref1]
      genoemde algemene maatregel van bestuur, overschrijdt. In dat geval treedt het aangegeven bedrag in de plaats van
      dit maximum.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1182
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1183
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1182'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1183.2'
    text: |-
      Nietig is ieder beding waarbij het aldus aangegeven bedrag hoger wordt gesteld dan het hoogste der in
      [artikel 1180][ref1] genoemde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1180
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1183
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1180'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1184.1'
    text: |-
      De opdrachtgever kan, mits de verhuizer hierin toestemt en tegen betaling van een overeen te komen bedrag,
      schriftelijk het bedrag van een bijzonder belang bij de aflevering voor het geval van verlies of beschadiging
      van vervoerd verhuisgoed en voor dat van overschrijding van een overeengekomen termijn van aanvang of einde der
      verhuizing vaststellen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1184
  - number: '1184.2'
    text: |-
      Indien een bijzonder belang bij de aflevering is aangegeven, kan, indien de verhuizer aansprakelijk is wegens niet
      nakomen van de op hem uit hoofde van [artikel 1173][ref1] rustende verplichting dan wel op grond van overschrijding
      van een overeengekomen termijn van aanvang of einde der verhuizing, onafhankelijk van de schadevergoedingen genoemd
      in de [artikelen 1180 tot en met 1183][ref2] en tot ten hoogste eenmaal het bedrag van het aangegeven belang, een
      schadevergoeding worden gevorderd gelijk aan de bewezen bijkomende schade.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1173
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1180
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1184
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1173'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1180'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1185.1'
    text: |-
      De verhuizer kan zich niet beroepen op enige beperking van zijn aansprakelijkheid, voor zover de schade is ontstaan
      uit zijn eigen handeling of nalaten, geschied hetzij met het opzet die schade te veroorzaken, hetzij roekeloos en
      met de wetenschap dat die schade er waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1185
  - number: '1185.2'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1185
  - number: '1186.1'
    text: |-
      De opdrachtgever is bevoegd de overeenkomst op te zeggen, wanneer hem door de verhuizer is medegedeeld, dat hij
      niet op de overeengekomen plaats en tijd met de verhuizing een aanvang kan of zal kunnen maken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1186
  - number: '1186.2'
    text: Hij kan deze bevoegdheid slechts uitoefenen terstond na ontvangst van deze mededeling.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1186
  - number: '1186.3'
    text: |-
      Indien bij gebreke van de ontvangst van een mededeling, als bedoeld in het eerste lid, het de opdrachtgever uit
      anderen hoofde bekend is, dat de verhuizer niet op de overeengekomen plaats of tijd met de verhuizing een aanvang
      maakt of kan maken, is hij, zonder dat enige ingebrekestelling is vereist, bevoegd de overeenkomst op te zeggen,
      doch slechts binnen een redelijke termijn, nadat hem dit bekend is geworden; gelijke bevoegdheid komt hem toe,
      indien hem na ontvangst van een mededeling, als bedoeld in het eerste lid, uit anderen hoofde bekend wordt, dat de
      verhuizer op grond van andere omstandigheden dan welke hem tot zijn mededeling brachten niet met de verhuizing op
      de overeengekomen plaats of tijd een aanvang maakt of kan maken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1186
  - number: '1186.4'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving en de overeenkomst eindigt op het ogenblik
      van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1186
  - number: '1186.5'
    text: |-
      Indien de verhuizer gehouden is de schade, die de opdrachtgever door de opzegging lijdt, te vergoeden, zal deze
      vergoeding, behoudens [artikel 1184][ref1], niet meer bedragen dan de overeengekomen verhuisprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1184
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1186
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1184'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1187'
    text: |-
      De opdrachtgever is verplicht de verhuizer de schade te vergoeden, die deze lijdt doordat de overeengekomen
      verhuisgoederen, door welke oorzaak dan ook, niet op de overeengekomen plaats en tijd te zijner beschikking zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1187
  - number: '1188.1'
    text: |-
      Alvorens verhuisgoederen ter beschikking van de verhuizer zijn gesteld, is de opdrachtgever bevoegd de overeenkomst
      op te zeggen. Hij is verplicht aan de verhuizer de daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1188
  - number: '1188.2'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving en de overeenkomst eindigt op het ogenblik
      van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1188
  - number: '1189.1'
    text: |-
      Zijn bij het verstrijken van de tijd, waarbinnen de verhuisgoederen ter beschikking van de verhuizer moeten zijn
      gesteld, door welke oorzaak dan ook, in het geheel geen verhuisgoederen ter beschikking, dan is de verhuizer,
      zonder dat enige ingebrekestelling is vereist, bevoegd de overeenkomst op te zeggen. De opdrachtgever is verplicht
      hem de daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1189
  - number: '1189.2'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving en de overeenkomst eindigt op het ogenblik
      van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1189
  - number: '1190.1'
    text: |-
      Zijn bij het verstrijken van de tijd, waarbinnen de verhuisgoederen ter beschikking van de verhuizer moeten zijn
      gesteld, door welke oorzaak dan ook, de overeengekomen verhuisgoederen slechts gedeeltelijk ter beschikking, dan
      is de verhuizer op verlangen van de opdrachtgever desalniettemin verplicht de wel ter beschikking gestelde goederen
      te verhuizen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1190
  - number: '1190.2'
    text: De opdrachtgever is verplicht de verhuizer de daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1190
  - number: '1191.1'
    text: |-
      De opdrachtgever is verplicht de verhuizer omtrent de verhuisgoederen alsmede omtrent de behandeling daarvan tijdig
      al die opgaven te doen, waartoe hij in staat is of behoort te zijn, en waarvan hij weet of behoort te weten, dat
      zij voor de verhuizer van belang zijn, tenzij hij mag aannemen dat de verhuizer deze gegevens kent.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1191
  - number: '1191.2'
    text: De verhuizer is niet gehouden, doch wel gerechtigd, te onderzoeken of de hem gedane opgaven juist en volledig zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1191
  - number: '1192.1'
    text: |-
      De opdrachtgever is verplicht de verhuizer de schade te vergoeden die deze lijdt doordat, door welke oorzaak dan
      ook, niet naar behoren aanwezig zijn de documenten en inlichtingen, die blijkens mededeling door de verhuizer van
      de zijde van de opdrachtgever vereist zijn voor de verhuizing dan wel ter voldoening aan vóór de aflevering van de
      verhuisgoederen te vervullen douane- en andere formaliteiten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1192
  - number: '1192.2'
    text: |-
      De verhuizer is verplicht redelijke zorg aan te wenden, dat de documenten, die in zijn handen zijn gesteld,
      niet verloren gaan of onjuist worden behandeld. Een terzake door hem verschuldigde schadevergoeding zal die,
      verschuldigd uit hoofde van de [artikelen 1180 tot en met 1185][ref1] in geval van verlies van de verhuisgoederen,
      niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1180
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1192
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1180'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1192.3'
    text: De verhuizer is niet gehouden, doch wel gerechtigd, te onderzoeken of de hem gedane opgaven juist en volledig zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1192
  - number: '1192.4'
    text: |-
      Zijn bij het verstrijken van de tijd, waarbinnen de in het eerste lid genoemde documenten en inlichtingen aanwezig
      moeten zijn, deze, door welke oorzaak dan ook, niet naar behoren aanwezig, dan zijn de [artikelen 1189][ref1] en
      [1190][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1189
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1190
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1192
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1189'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1190'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1193.1'
    text: |-
      Wanneer vóór of bij de aanbieding van de verhuisgoederen aan de verhuizer omstandigheden aan de zijde van één der
      partijen zich opdoen of naar voren komen, die haar wederpartij bij het sluiten van de overeenkomst niet behoefde
      te kennen, doch die, indien zij haar wel bekend waren geweest, redelijkerwijs voor haar grond hadden opgeleverd
      de verhuisovereenkomst niet of op andere voorwaarden aan te gaan, is deze wederpartij bevoegd de overeenkomst op
      te zeggen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1193
  - number: '1193.2'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving en de overeenkomst eindigt op het ogenblik
      van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1193
  - number: '1193.3'
    text: |-
      Naar maatstaven van redelijkheid en billijkheid zijn partijen na opzegging der overeenkomst verplicht elkaar de
      daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1193
  - number: '1194.1'
    text: De verhuisprijs is verschuldigd op het ogenblik, dat de verhuizer de verhuisgoederen ter bestemming aflevert.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1194
  - number: '1194.2'
    text: |-
      Indien partijen overeenkwamen, dat de verhuisprijs vóór het vertrek van het voertuig, waarin de verhuisgoederen
      zijn geladen, zal worden betaald en de opdrachtgever niet aan deze verplichting heeft voldaan, is de verhuizer
      bevoegd het vervoer van de betrokken verhuisgoederen op te schorten en is hij met toestemming van de rechter
      gerechtigd tot het nemen van de in de [artikelen 1197][ref1] en [1198][ref2] genoemde maatregelen. Gaat hij hiertoe
      over, dan zijn deze artikelen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1197
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1198
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1194
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1197'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1198'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1195'
    text: |-
      Onverminderd [afdeling 1 van Titel 4 van Boek 6][ref1] is de opdrachtgever verplicht de verhuizer de schade
      te vergoeden, geleden doordat deze zich als zaakwaarnemer inliet met de behartiging van de belangen van een
      rechthebbende op verhuisgoederen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling1
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1195
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '1'
  - number: '1196'
    text: |-
      De verhuizer heeft geen retentierecht op verhuisgoederen en documenten, die hij in verband met de
      verhuisovereenkomst onder zich heeft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1196
  - number: '1197.1'
    text: |-
      Voor zover de opdrachtgever niet opkomt, weigert verhuisgoederen te ontvangen of deze niet met de vereiste spoed in
      ontvangst neemt, of voor zover op verhuisgoederen beslag is gelegd, is de verhuizer gerechtigd deze verhuisgoederen
      voor rekening en gevaar van de rechthebbende bij een derde op te slaan in een daarvoor geschikte bewaarplaats.
      Op zijn verzoek kan de rechter bepalen dat hij deze verhuisgoederen, desgewenst ook in het voor de verhuizing
      gebezigde voertuig, onder zichzelf kan houden of andere maatregelen daarvoor kan treffen. Hij is verplicht de
      opdrachtgever zo spoedig mogelijk op de hoogte te stellen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1197
  - number: '1197.2'
    text: |-
      De derde-bewaarnemer en de opdrachtgever zijn jegens elkaar verbonden, als ware de omtrent de bewaring gesloten
      overeenkomst mede tussen hen aangegaan. De bewaarnemer is echter niet gerechtigd tot afgifte dan na schriftelijke
      toestemming daartoe van hem, die de verhuisgoederen in bewaring gaf.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1197
  - number: '1198.1'
    text: |-
      In geval van toepassing van [artikel 1197][ref1] kan de verhuizer, de bewaarnemer dan wel de opdrachtgever door
      de rechter op zijn verzoek worden gemachtigd de verhuisgoederen geheel of gedeeltelijk op de door deze te bepalen
      wijze te verkopen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1197
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1198
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1197'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1198.2'
    text: |-
      De bewaarnemer is verplicht de verhuizer zo spoedig mogelijk van de voorgenomen verkoop op de hoogte te stellen; de
      verhuizer heeft deze verplichting jegens de opdrachtgever.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1198
  - number: '1198.3'
    text: |-
      De opbrengst van het verkochte wordt in de consignatiekas gestort, voor zover zij niet strekt tot voldoening van
      de kosten van opslag en verkoop, alsmede, binnen de grenzen der redelijkheid, van de gemaakte kosten. Tenzij op de
      zaken beslag is gelegd voor een geldvordering, moet aan de verhuizer uit het in bewaring te stellen bedrag worden
      voldaan hetgeen hem verschuldigd is terzake van de verhuizing; voor zover deze vordering nog niet vaststaat, zal de
      opbrengst of een gedeelte daarvan op door de rechter te bepalen wijze tot zekerheid voor deze vordering strekken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1198
  - number: '1198.4'
    text: De in de consignatiekas gestorte opbrengst treedt in de plaats van de verhuisgoederen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1198
  - number: '1199'
    text: |-
      Indien er zekerheid of vermoeden bestaat, dat er verlies of schade is, moeten de verhuizer en de opdrachtgever
      elkaar over en weer in redelijkheid alle middelen verschaffen om het onderzoek van de verhuisgoederen mogelijk
      te maken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1199
  - number: '1200'
    text: |-
      Indien binnen drie jaren nadat de verhuizer aan de opdrachtgever schadevergoeding heeft uitgekeerd terzake van het
      niet afleveren van verhuisgoederen, deze verhuisgoederen of enige daarvan alsnog onder de verhuizer blijken te zijn
      of te zijn gekomen, is de verhuizer verplicht de opdrachtgever van deze omstandigheid bij aangetekende brief op de
      hoogte te brengen en heeft de opdrachtgever gedurende dertig dagen na ontvangst van deze mededeling het recht tegen
      verrekening van de door hem ontvangen schadevergoeding opnieuw aflevering van deze verhuisgoederen te verlangen.
      Hetzelfde geldt, indien de verhuizer terzake van het niet afleveren geen schadevergoeding heeft uitgekeerd,
      met dien verstande dat de termijn van drie jaren begint met de aanvang van de dag volgende op die, waarop de
      verhuisgoederen hadden moeten zijn afgeleverd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1200
  - number: '1201'
    text: |-
      Met betrekking tot verhuisgoederen, die de verhuizer onder zich heeft, doch ten aanzien waarvan hij niet meer
      uit hoofde van de verhuisovereenkomst tot aflevering is verplicht, is [artikel 1198][ref1] van overeenkomstige
      toepassing met dien verstande, dat uit de opbrengst van het verkochte bovendien aan de verhuizer moet worden
      voldaan het bedrag, dat deze mogelijkerwijs voldeed terzake van zijn aansprakelijkheid wegens het niet nakomen van
      de op hem uit hoofde van de [artikelen 1173][ref2] en [1174][ref3] rustende verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1198
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1173
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1174
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1201
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1198'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1173'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1174'
        hoofdstuk: IV
        afdeling: '4'
  - number: '1210'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1210
  - number: 1210.a
    text: |-
      "*gevaarlijke stof*": een stof die als zodanig bij algemene maatregel van bestuur is aangewezen; de aanwijzing
      kan worden beperkt tot bepaalde concentraties van de stof, tot bepaalde in de algemene maatregel van bestuur te
      omschrijven gevaren die aan de stof verbonden zijn, en tot bepaalde daarin te omschrijven situaties waarin de stof
      zich bevindt;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1210
  - number: 1210.b
    text: '"*schade*":'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1210
  - number: 1210.b.1°
    text: schade veroorzaakt door dood of letsel van enige persoon veroorzaakt door een gevaarlijke stof;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1210
  - number: 1210.b.2°
    text: |-
      andere schade buiten het voertuig aan boord waarvan de gevaarlijke stof zich bevindt, veroorzaakt door die
      gevaarlijke stof, met uitzondering van verlies van of schade met betrekking tot andere voertuigen en zaken aan
      boord daarvan, indien die voertuigen deel uitmaken van een sleep, waarvan ook dit voertuig deel uitmaakt;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1210
  - number: 1210.b.3°
    text: de kosten van preventieve maatregelen en verlies of schade veroorzaakt door zulke maatregelen;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1210
  - number: 1210.c
    text: |-
      "*preventieve maatregel*": iedere redelijke maatregel ter voorkoming of beperking van schade door wie dan ook
      genomen met uitzondering van de overeenkomstig deze afdeling aansprakelijke persoon nadat een gebeurtenis heeft
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1210
  - number: 1210.d
    text: |-
      "*gebeurtenis*": elk feit of elke opeenvolging van feiten met dezelfde oorzaak, waardoor schade ontstaat of
      waardoor een ernstige en onmiddellijke dreiging van schade ontstaat;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1210
  - number: 1210.e
    text: |-
      "*exploitant*": hij die de zeggenschap heeft over het gebruik van het voertuig aan boord waarvan de gevaarlijke stof
      zich bevindt. Hij aan wie een kenteken als bedoeld in [artikel 36, eerste lid, van de Wegenverkeerswet 1994][ref1]
      is opgegeven, of, bij gebreke daarvan, de eigenaar van het voertuig, wordt aangemerkt als exploitant, tenzij hij
      bewijst dat ten tijde van de gebeurtenis een door hem bij name genoemde ander de zeggenschap over het gebruik van
      het voertuig had of dat op dat tijdstip een ander zonder zijn toestemming en zonder dat hij zulks redelijkerwijs
      kon voorkomen de zeggenschap over het gebruik van het voertuig had.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1210
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
  - number: '1211.1'
    text: |-
      Deze afdeling is niet van toepassing, indien de exploitant jegens degene die de vordering instelt, aansprakelijk
      is uit hoofde van een exploitatie-overeenkomst of jegens deze persoon een beroep op een exploitatie-overeenkomst
      heeft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1211
  - number: '1211.2'
    text: |-
      Deze afdeling is van toepassing op de periode waarin een gevaarlijke stof zich in een voertuig bevindt, daaronder
      begrepen de periode vanaf het begin van de inlading van de gevaarlijke stof in het voertuig tot het einde van de
      lossing van die stof uit het voertuig.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1211
  - number: '1211.3'
    text: |-
      Deze afdeling is niet van toepassing op schade veroorzaakt wanneer het voertuig uitsluitend wordt gebruikt op een
      niet voor publiek toegankelijk terrein en zulk gebruik een onderdeel vormt van een op dat terrein plaatsvindende
      bedrijfsuitoefening.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1211
  - number: '1211.4'
    text: |-
      Op zich overeenkomstig het tweede lid aan boord bevindende stoffen als bedoeld in [artikel 175 van Boek 6][ref1] is
      dat artikel niet van toepassing, tenzij zich het geval van het derde lid voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel175
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1211
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '175'
  - number: '1211.5'
    text: |-
      Onverminderd het in het derde lid bepaalde is deze afdeling van overeenkomstige toepassing op
      luchtkussenvoertuigen, waar ook gebruikt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1211
  - number: '1212.1'
    text: |-
      Indien een gevaarlijke stof zich bevindt in een vervoermiddel dat zich aan boord van een voertuig bevindt zonder
      dat de gevaarlijke stof uit dit gestapelde vervoermiddel wordt gelost, zal de gevaarlijke stof voor die periode
      geacht worden zich alleen aan boord van genoemd voertuig te bevinden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1212
  - number: '1212.2'
    text: |-
      Indien een gevaarlijke stof zich bevindt in een voertuig dat wordt voortbewogen door een ander voertuig, zal de
      gevaarlijke stof geacht worden zich alleen aan boord van het laatstgenoemde voertuig te bevinden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1212
  - number: '1212.3'
    text: |-
      Gedurende de handelingen bedoeld in [artikel 1213, vijfde lid, onderdelen c, d en e][ref1], zal de gevaarlijke stof
      geacht worden:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1213
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1212
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1213'
        hoofdstuk: IV
        afdeling: '1'
  - number: 1212.3.a
    text: in afwijking van het eerste lid, zich alleen aan boord van het gestapelde vervoermiddel te bevinden;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1212
  - number: 1212.3.b
    text: in afwijking van het tweede lid, zich alleen aan boord van eerstgenoemd voertuig te bevinden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1212
  - number: '1213.1'
    text: |-
      Hij die ten tijde van een gebeurtenis exploitant is van een voertuig aan boord waarvan zich een gevaarlijke stof
      bevindt, is aansprakelijk voor de schade door die stof veroorzaakt ten gevolge van die gebeurtenis. Bestaat de
      gebeurtenis uit een opeenvolging van feiten met dezelfde oorzaak, dan rust de aansprakelijkheid op degene die ten
      tijde van het eerste feit exploitant was.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1213
  - number: '1213.2'
    text: 'De exploitant is niet aansprakelijk indien:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1213
  - number: 1213.2.a
    text: |-
      de schade is veroorzaakt door een oorlogshandeling, vijandelijkheden, burgeroorlog, opstand of natuurgebeuren van
      uitzonderlijke, onvermijdelijke en onweerstaanbare aard;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1213
  - number: 1213.2.b
    text: |-
      de schade uitsluitend is veroorzaakt door een handelen of nalaten van een derde, niet zijnde een persoon genoemd in
      het vijfde lid, onderdeel *a*, geschied met het opzet de schade te veroorzaken;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1213
  - number: 1213.2.c
    text: |-
      de afzender of enige andere persoon niet heeft voldaan aan zijn verplichting hem in te lichten over de gevaarlijke
      aard van de stof, en noch de exploitant, noch de in het vijfde lid, onderdeel *a*, genoemde personen wisten of
      hadden behoren te weten dat deze gevaarlijk was.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1213
  - number: '1213.3'
    text: |-
      Indien de exploitant bewijst dat de schade geheel of gedeeltelijk het gevolg is van een handelen of nalaten van de
      persoon die de schade heeft geleden, met het opzet de schade te veroorzaken, of van de schuld van die persoon, kan
      hij geheel of gedeeltelijk worden ontheven van zijn aansprakelijkheid tegenover die persoon.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1213
  - number: '1213.4'
    text: |-
      De exploitant kan voor schade slechts uit anderen hoofde dan deze afdeling worden aangesproken in het geval van het
      tweede lid, onderdeel *c*, alsmede in het geval dat hij uit hoofde van arbeidsovereenkomst kan worden aangesproken.
      In het geval van het tweede lid, onderdeel *c*, kan de exploitant deze aansprakelijkheid beperken als ware hij op
      grond van deze afdeling aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1213
  - number: '1213.5'
    text: |-
      Behoudens de [artikelen 1214][ref1] en [1215][ref2] zijn voor schade niet aansprakelijk:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1214
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1215
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1213
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1214'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1215'
        hoofdstuk: IV
        afdeling: '1'
  - number: 1213.5.a
    text: de ondergeschikten, vertegenwoordigers of lasthebbers van de exploitant,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1213
  - number: 1213.5.b
    text: ieder die ten behoeve van het voertuig werkzaamheden verricht,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1213
  - number: 1213.5.c
    text: |-
      zij die anders dan tegen een uitdrukkelijk en redelijk verbod vanwege het voertuig in hulp verlenen aan het
      voertuig, de zich aan boord daarvan bevindende zaken of personen,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1213
  - number: 1213.5.d
    text: |-
      zij die op aanwijzing van een bevoegde overheidsinstantie hulp verlenen aan het voertuig, de zich aan boord daarvan
      bevindende zaken of personen,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1213
  - number: 1213.5.e
    text: zij die preventieve maatregelen nemen met uitzondering van de exploitant,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1213
  - number: 1213.5.f
    text: |-
      de ondergeschikten, vertegenwoordigers of lasthebbers van de in dit lid, onderdelen *b, c, d* en *e*, van
      aansprakelijkheid vrijgestelde personen, tenzij de schade is ontstaan uit hun eigen handelen of nalaten,
      geschied hetzij met het opzet die schade te veroorzaken, hetzij roekeloos en met de wetenschap dat die schade er
      waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1213
  - number: '1213.6'
    text: |-
      De exploitant heeft, voor zover niet anders is overeengekomen, verhaal op de in het vijfde lid bedoelde personen,
      doch uitsluitend indien dezen ingevolge het slot van dit lid voor de schade kunnen worden aangesproken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1213
  - number: '1214.1'
    text: |-
      Indien de exploitant bewijst dat de gevaarlijke stof tijdens de periode bedoeld in
      [artikel 1211, tweede lid][ref1], is geladen of gelost onder de uitsluitende verantwoordelijkheid van een door
      hem bij name genoemde ander dan de exploitant of zijn ondergeschikte, vertegenwoordiger of lasthebber, zoals de
      afzender of ontvanger, is de exploitant niet aansprakelijk voor de schade als gevolg van een gebeurtenis tijdens
      het laden of lossen van de gevaarlijke stof en is die ander voor deze schade aansprakelijk overeenkomstig deze
      afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1211
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1214
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1211'
        hoofdstuk: IV
        afdeling: '1'
  - number: '1214.2'
    text: |-
      Indien echter de gevaarlijke stof tijdens de periode bedoeld in [artikel 1211, tweede lid][ref1], is geladen of
      gelost onder de gezamenlijke verantwoordelijkheid van de exploitant en een door de exploitant bij name genoemde
      ander, zijn de exploitant en die ander hoofdelijk aansprakelijk overeenkomstig deze afdeling voor de schade als
      gevolg van een gebeurtenis tijdens het laden of lossen van de gevaarlijke stof.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1211
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1214
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1211'
        hoofdstuk: IV
        afdeling: '1'
  - number: '1214.3'
    text: |-
      Indien is geladen of gelost door een persoon in opdracht of ten behoeve van de vervoerder of een ander, zoals de
      afzender of de ontvanger, is niet deze persoon, maar de vervoerder of die ander aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1214
  - number: '1214.4'
    text: |-
      Indien een ander dan de exploitant op grond van het eerste of het tweede lid aansprakelijk is, kan die ander geen
      beroep doen op [artikel 1213, vierde lid en vijfde lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1213
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1214
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1213'
        hoofdstuk: IV
        afdeling: '1'
  - number: '1214.5'
    text: |-
      Indien een ander dan de exploitant op grond van het eerste of het tweede lid aansprakelijk is, zijn ten aanzien van
      die ander de [artikelen 1218 tot en met 1220][ref1] van overeenkomstige toepassing, met dien verstande dat in geval
      van hoofdelijke aansprakelijkheid:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1218
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1214
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1218'
        hoofdstuk: IV
        afdeling: '1'
  - number: 1214.5.a
    text: |-
      de beperking van aansprakelijkheid als bepaald krachtens [artikel 1218, eerste lid][ref1], geldt voor het geheel
      der naar aanleiding van eenzelfde gebeurtenis ontstane vorderingen gericht tegen beiden;


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1218
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1214
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1218'
        hoofdstuk: IV
        afdeling: '1'
  - number: 1214.5.b
    text: |-
      een fonds gevormd door één van hen overeenkomstig [artikel 1219][ref1] wordt aangemerkt als door beiden te zijn
      gevormd en zulks ten aanzien van de vorderingen waarvoor het fonds werd gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1219
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1214
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1219'
        hoofdstuk: IV
        afdeling: '1'
  - number: '1214.6'
    text: |-
      In de onderlinge verhouding tussen de exploitant en de in het tweede lid van dit artikel genoemde ander is
      de exploitant niet tot vergoeding verplicht dan in geval van schuld van hemzelf of van zijn ondergeschikten,
      vertegenwoordigers of lasthebbers.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1214
  - number: '1214.7'
    text: |-
      Dit artikel is niet van toepassing als tijdens de periode, bedoeld in [artikel 1211, tweede lid][ref1], is
      geladen of gelost onder de uitsluitende of gezamenlijke verantwoordelijkheid van een persoon, genoemd in
      [artikel 1213, vijfde lid, onderdeel c, d of e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1211
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1213
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1214
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1211'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1213'
        hoofdstuk: IV
        afdeling: '1'
  - number: '1215'
    text: |-
      Indien ingevolge [artikel 1213, tweede lid, onderdeel c][ref1], de exploitant niet aansprakelijk is,
      is de afzender of andere persoon aansprakelijk overeenkomstig deze afdeling en zijn te diens aanzien de
      [artikelen 1218 tot en met 1220][ref2] van overeenkomstige toepassing. De afzender of andere persoon kan geen
      beroep doen op artikel 1213, vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1213
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1218
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1215
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1213'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1218'
        hoofdstuk: IV
        afdeling: '1'
  - number: '1216'
    text: |-
      Indien schade veroorzaakt door de gevaarlijke stof redelijkerwijs niet kan worden gescheiden van schade anderszins
      veroorzaakt, zal de gehele schade worden aangemerkt als schade in de zin van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1216
  - number: '1217.1'
    text: |-
      Wanneer door een gebeurtenis schade is veroorzaakt door gevaarlijke stoffen aan boord van meer dan één voertuig,
      dan wel aan boord van een voertuig of luchtkussenvoertuig en een zeeschip, een binnenschip of een spoorrijtuig,
      zijn de exploitanten van de daarbij betrokken voertuigen, de reder of de eigenaar van het daarbij betrokken
      zeeschip of het binnenschip en de exploitant van de spoorweg waarop de gebeurtenis met het daarbij betrokken
      spoorrijtuig plaatsvond, onverminderd het in [artikel 1213, tweede en derde lid][ref1], en [artikel 1214][ref2],
      [afdeling 4 van titel 6][ref3], [afdeling 4 van titel 11][ref4] en afdeling 4 van titel 19 bepaalde, hoofdelijk
      aansprakelijk voor alle schade waarvan redelijkerwijs niet kan worden aangenomen dat zij veroorzaakt is door
      gevaarlijke stoffen aan boord van één of meer bepaalde voertuigen, luchtkussenvoertuig, zeeschip of binnenschip, of
      spoorrijtuig dat gebruikt werd op een bepaalde spoorweg.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1213
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1214
      [ref3]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref4]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1217
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1213'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1214'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005034
        hoofdstuk: III
        afdeling: '4'
  - number: '1217.2'
    text: |-
      Het bepaalde in het eerste lid laat onverlet het beroep op beperking van aansprakelijkheid van de
      exploitant, reder of eigenaar krachtens deze afdeling, [titel 7][ref1] of [titel 12][ref2], dan wel de
      [artikelen 1678 tot en met 1680][ref3], ieder tot het voor hem geldende bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1678
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1217
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005034
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1678'
        hoofdstuk: VI
        afdeling: '4'
  - number: '1218.1'
    text: |-
      De exploitant kan zijn aansprakelijkheid per gebeurtenis beperken tot een bij of krachtens algemene maatregel van
      bestuur te bepalen bedrag of bedragen die verschillend kunnen zijn voor vorderingen ter zake van dood of letsel en
      andere vorderingen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1218
  - number: '1218.2'
    text: |-
      De exploitant is niet gerechtigd zijn aansprakelijkheid te beperken indien de schade is ontstaan uit zijn eigen
      handelen of nalaten, geschied hetzij met het opzet die schade te veroorzaken, hetzij roekeloos en met de wetenschap
      dat die schade er waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1218
  - number: '1219'
    text: |-
      Ten einde zich te kunnen beroepen op de in [artikel 1218][ref1] bedoelde beperking van aansprakelijkheid moet de
      exploitant een fonds of fondsen vormen overeenkomstig [artikel 1220][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1218
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1220
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1219
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1218'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1220'
        hoofdstuk: IV
        afdeling: '1'
  - number: '1220.1'
    text: |-
      Hij die gebruik wenst te maken van de hem in artikel 1218 gegeven bevoegdheid tot beperking van zijn
      aansprakelijkheid, verzoekt een arrondissementsrechtbank die bevoegd is kennis te nemen van de vorderingen tot
      vergoeding van schade, het bedrag waartoe zijn aansprakelijkheid is beperkt, vast te stellen en te bevelen dat tot
      een procedure ter verdeling van dit bedrag zal worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1220
  - number: '1220.2'
    text: |-
      Op het verzoek en de procedure ter verdeling zijn de [artikelen 642a, tweede tot en met vierde lid][ref1],
      [642b][ref2], [642c][ref3], [642e, eerste lid][ref4], [642f tot en met 642t, eerste lid][ref5], en
      [642u tot en met 642z van het Wetboek van Burgerlijke Rechtsvordering][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel642b
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel642c
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel642e
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel642f
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel642u
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1220
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642a
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 642b
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 642c
      - id: ref4
        bwb_id: BWBR0001827
        artikel: 642e
      - id: ref5
        bwb_id: BWBR0001827
        artikel: 642f
      - id: ref6
        bwb_id: BWBR0001827
        artikel: 642u
  - number: '1220.3'
    text: |-
      Indien het krachtens artikel 1218, eerste lid, bepaalde bedrag voor vorderingen ter zake van dood of letsel
      onvoldoende is voor volledige vergoeding van deze vorderingen, worden deze vorderingen in evenredigheid gekort
      en zal het krachtens artikel 1218, eerste lid, bepaalde bedrag voor andere vorderingen naar evenredigheid worden
      verdeeld onder die vorderingen en de vorderingen ter zake van dood of letsel, voor zover deze onvoldaan zouden
      zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1220
  - number: '1220.4'
    text: |-
      De vorderingen van de exploitant ter zake van door hem vrijwillig en binnen de grenzen der redelijkheid gedane
      uitgaven en gebrachte offers ter voorkoming of beperking van schade staan in rang gelijk met andere vorderingen
      op het krachtens artikel 1218, eerste lid, bepaalde bedrag voor andere vorderingen dan die ter zake van dood of
      letsel.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1220
  - number: '1300'
    text: 'In deze titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1300
  - number: 1300.a
    text: |-
      het Verdrag van Genève: het op 19 juni 1948 te Genève tot stand gekomen Verdrag betreffende de internationale
      erkenning van rechten op luchtvaartuigen (*Trb.* 1952, 86);
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1300
  - number: 1300.b
    text: 'Verdragsstaat: een staat waarvoor het Verdrag van Genève van kracht is;'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1300
  - number: 1300.c
    text: 'het register: het register, bedoeld in artikel 1302;'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1300
  - number: 1300.d
    text: |-
      verdragsregister: een buiten Nederland gehouden register als bedoeld in artikel I, eerste lid, onder ii, van het
      Verdrag van Genève;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1300
  - number: 1300.e
    text: 'de openbare registers: de openbare registers, bedoeld in afdeling 2 van titel 1 van Boek 3.'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1300
  - number: '1301'
    text: |-
      De in deze afdeling aan de eigenaar opgelegde verplichtingen rusten, indien het luchtvaartuig toebehoort aan meer
      personen, aan een vennootschap onder firma, aan een commanditaire vennootschap of aan een rechtspersoon, mede op
      iedere mede-eigenaar, beherende vennoot of bestuurder.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1301
  - number: '1302'
    text: |-
      Er wordt een afzonderlijk openbaar register gehouden voor de teboekstelling van luchtvaartuigen, dat deel uitmaakt
      van de openbare registers.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1302
  - number: '1303.1'
    text: Teboekstelling is slechts mogelijk indien
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1303
  - number: 1303.1.a
    text: |-
      het luchtvaartuig een Nederlands luchtvaartuig is in de zin der [Luchtvaartwet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1303
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: 1303.1.b
    text: het luchtvaartuig ten minste een bij algemene maatregel van bestuur vastgesteld gewicht heeft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1303
  - number: '1303.2'
    text: |-
      Teboekstelling is niet mogelijk van een luchtvaartuig dat reeds teboekstaat in het register, in een
      verdragsregister of in enig soortgelijk buitenlands register.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1303
  - number: '1303.3'
    text: |-
      In afwijking van het tweede lid is teboekstelling van een in een verdragsregister of in enig soortgelijk register
      teboekstaand luchtvaartuig mogelijk, wanneer de eigenaar de eigendom van het luchtvaartuig heeft verkregen door
      toewijzing na een executie, welke in Nederland heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1303
  - number: '1303.4'
    text: |-
      De teboekstelling wordt verzocht door de eigenaar van het luchtvaartuig. Hij moet daarbij ter inschrijving
      overleggen een door hem ondertekende verklaring, dat naar zijn beste weten het luchtvaartuig voor teboekstelling
      vatbaar is. Deze verklaring behoeft de goedkeuring van de rechter.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1303
  - number: '1303.5'
    text: |-
      De teboekstelling in het register heeft geen rechtsgevolg, wanneer aan de vereisten van de voorgaande leden van dit
      artikel niet is voldaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1303
  - number: '1303.6'
    text: |-
      Bij het verzoek tot teboekstelling wordt woonplaats gekozen in Nederland. Deze woonplaats wordt in het verzoek tot
      teboekstelling vermeld en kan door een andere in Nederland gelegen woonplaats worden vervangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1303
  - number: '1304.1'
    text: De teboekstelling wordt slechts doorgehaald
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1304
  - number: 1304.1.a
    text: op verzoek van degene die in de openbare registers als eigenaar vermeld staat;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1304
  - number: 1304.1.b
    text: op aangifte van de eigenaar of ambtshalve
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1304
  - number: 1304.1.b.1°
    text: als het luchtvaartuig heeft opgehouden als zodanig te bestaan;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1304
  - number: 1304.1.b.2°
    text: |-
      als van het luchtvaartuig gedurende twee maanden na het laatste vertrek geen tijding is ontvangen, zonder dat dit
      aan een algemene storing in de berichtgeving kan worden geweten;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1304
  - number: 1304.1.b.3°
    text: als het luchtvaartuig niet of niet meer de hoedanigheid van Nederlands luchtvaartuig heeft;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1304
  - number: 1304.1.b.4°
    text: |-
      als het luchtvaartuig, na een executie in een Verdragsstaat buiten Nederland, welke plaatsvond overeenkomstig het
      Verdrag van Genève, in een verdragsregister teboekstaat.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1304
  - number: '1304.2'
    text: |-
      In de in het eerste lid, onder *b*, genoemde gevallen is de eigenaar van het luchtvaartuig tot het doen van
      aangifte verplicht binnen drie maanden nadat de reden tot doorhaling zich heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1304
  - number: '1304.3'
    text: |-
      Wanneer ten aanzien van het luchtvaartuig inschrijvingen of voorlopige aantekeningen ten gunste van derden bestaan,
      geschiedt, behalve in het geval, genoemd in het eerste lid, onderdeel *b*, onder 4°, doorhaling slechts wanneer
      geen dezer derden zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1304
  - number: '1304.4'
    text: Doorhaling geschiedt slechts na op verzoek van de meest gerede partij verleende machtiging van de rechter.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1304
  - number: '1305'
    text: |-
      De enige zakelijke rechten waarvan een in het register teboekstaand luchtvaartuig het voorwerp kan zijn, zijn de
      eigendom, de hypotheek en de zakelijke rechten, bedoeld in de artikelen 1308 en 1309.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1305
  - number: '1306.1'
    text: Een in het register teboekstaand luchtvaartuig is een registergoed.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1306
  - number: '1306.2'
    text: |-
      Bij de toepassing van artikel 301 van Boek 3 ter zake van akten die op de voet van artikel 89, eerste en vierde
      lid, van Boek 3 zijn bestemd voor de levering van zodanig luchtvaartuig, kan de in het eerstgenoemde artikel
      bedoelde uitspraak van de Nederlandse rechter niet worden ingeschreven, zolang zij niet in kracht van gewijsde
      is gegaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1306
  - number: '1307'
    text: |-
      Eigendom en hypotheek op een teboekstaand luchtvaartuig worden door een bezitter te goeder trouw verkregen door een
      onafgebroken bezit van vijf jaren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1307
  - number: '1308'
    text: |-
      Op een teboekstaand luchtvaartuig kan een zakelijk recht worden gevestigd, bestaande in het recht van de houder
      van het luchtvaartuig om na betaling van een zeker bedrag of na vervulling van enige andere voorwaarde de eigendom
      daarvan krachtens een door hem reeds gesloten of nog te sluiten koopovereenkomst te verkrijgen. In de notariële
      akte bestemd voor de vestiging van dit recht, wordt duidelijk het aan dit recht onderworpen luchtvaartuig vermeld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1308
  - number: '1309.1'
    text: |-
      Op een teboekstaand luchtvaartuig kan een zakelijk recht worden gevestigd, bestaande in het recht van de houder tot
      gebruik van het luchtvaartuig uit een huurovereenkomst die voor ten minste zes maanden is gesloten. In de notariële
      akte bestemd voor de vestiging van dit recht, wordt duidelijk het aan dit recht onderworpen luchtvaartuig vermeld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1309
  - number: '1309.2'
    text: |-
      De huurovereenkomst geldt als titel voor de vestiging. Indien de huurovereenkomst in een notariële akte is
      neergelegd, die aan de eisen voor een akte van levering voldoet, geldt deze akte als akte van levering.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1309
  - number: '1309.3'
    text: |-
      Op een huurovereenkomst ter zake van een teboekstaand luchtvaartuig is [artikel 226 van Boek 7][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel226
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1309
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '226'
  - number: '1310'
    text: |-
      Onverminderd het bepaalde in [artikel 260, eerste lid, van Boek 3][ref1] wordt in de notariële akte waarbij
      hypotheek wordt verleend op een teboekstaand luchtvaartuig, duidelijk het aan de hypotheek onderworpen
      luchtvaartuig vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel260
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1310
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '260'
  - number: '1311'
    text: |-
      De door hypotheek gedekte vordering neemt rang na de vorderingen, genoemd in de [artikelen 1315][ref1] en
      [1317][ref2], doch vóór alle andere vorderingen waaraan bij deze of enige andere wet een voorrecht is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1315
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1317
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1311
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1315'
        hoofdstuk: V
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1317'
        hoofdstuk: V
        afdeling: '2'
  - number: '1312'
    text: |-
      Indien de vordering rente draagt, strekt de hypotheek mede tot zekerheid voor de renten der hoofdsom, vervallen
      gedurende de laatste drie jaren voorafgaand aan het begin van de uitwinning en gedurende de loop hiervan.
      [Artikel 263 van Boek 3][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel263
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1312
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '263'
  - number: '1313'
    text: |-
      Op hypotheek op een aandeel in een teboekstaand luchtvaartuig is [artikel 177 van Boek 3][ref1] niet van
      toepassing; de hypotheek blijft na vervreemding of toedeling van het luchtvaartuig in stand.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel177
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1313
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '177'
  - number: '1314'
    text: |-
      Op een hypotheek op een teboekstaand luchtvaartuig zijn de [artikelen 234][ref1],
      [261][ref2], [264][ref3], [265][ref4], [266][ref5] en [268-273 van Boek 3][ref6] en de
      [artikelen 544-548 van het Wetboek van Burgerlijke Rechtsvordering][ref7] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel234
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel261
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel264
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel265
      [ref5]: https://wetten.overheid.nl/BWBR0005291#Artikel266
      [ref6]: https://wetten.overheid.nl/BWBR0005291#Artikel268
      [ref7]: https://wetten.overheid.nl/BWBR0001827#Artikel544
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1314
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '234'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '261'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '264'
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '265'
      - id: ref5
        bwb_id: BWBR0005291
        artikel: '266'
      - id: ref6
        bwb_id: BWBR0005291
        artikel: '268'
      - id: ref7
        bwb_id: BWBR0001827
        artikel: '544'
  - number: '1315'
    text: |-
      In geval van uitwinning van een luchtvaartuig dat teboekstaat in het register of in een verdragsregister, worden de
      kosten van uitwinning, de kosten van bewaking tijdens deze uitwinning, de kosten na het beslag gemaakt tot behoud
      van het luchtvaartuig, daaronder begrepen de kosten van herstellingen die onontbeerlijk waren voor het behoud
      daarvan, alle andere kosten in het belang van de schuldeisers gemaakt tijdens de executie, alsmede de kosten van
      de gerechtelijke rangregeling en verdeling van de opbrengst onder de schuldeisers uit de opbrengst van de verkoop
      voldaan boven alle andere vorderingen waaraan bij deze of enige andere wet een voorrecht is toegekend.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1315
  - number: '1316'
    text: |-
      [Artikel 292 van Boek 3][ref1] en de [artikelen 60, tweede lid, eerste zin, derde lid en vierde lid][ref2], en
      [299b, derde tot en met vijfde lid, van de Faillissementswet](onbekend) zijn niet van toepassing op luchtvaartuigen
      die teboekstaan in het register of in een verdragsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel292
      [ref2]: https://wetten.overheid.nl/BWBR0001860
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1316
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '292'
      - id: ref2
        bwb_id: BWBR0001860
  - number: '1317.1'
    text: |-
      Boven alle andere vorderingen waaraan bij deze of enige andere wet een voorrecht is toegekend zijn, behoudens
      artikel 1315, op een luchtvaartuig dat op het tijdstip van het ontstaan van de hierna genoemde vorderingen
      teboekstaat in het register of in een verdragsregister, bevoorrecht:
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1317
  - number: 1317.1.a
    text: de vorderingen tot betaling van hulploon voor aan het luchtvaartuig verleende hulp;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1317
  - number: 1317.1.b
    text: de vorderingen tot betaling van buitengewone kosten, noodzakelijk voor het behoud van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1317
  - number: '1317.2'
    text: |-
      Het eerste lid geldt slechts indien de hulp of de handeling tot behoud is beëindigd in Nederland of in een
      Verdragsstaat welks wetgeving aan de vorderingen, ontstaan vanwege deze handelingen, een voorrecht met zaaksgevolg
      toekent.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1317
  - number: '1317.3'
    text: Artikel 284 van Boek 3 is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1317
  - number: '1318'
    text: |-
      De bevoorrechte vorderingen, genoemd in [artikel 1317][ref1], nemen onderling rang naar de omgekeerde volgorde van
      de tijdstippen waarop de gebeurtenissen plaatsvonden, waardoor zij ontstonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1317
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1318
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1317'
        hoofdstuk: V
        afdeling: '2'
  - number: '1319'
    text: |-
      De schuldeiser die een voorrecht heeft op grond van [artikel 1317][ref1], vervolgt zijn recht op het luchtvaartuig,
      in wiens handen dit zich ook bevinde.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1317
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1319
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1317'
        hoofdstuk: V
        afdeling: '2'
  - number: '1320.1'
    text: |-
      De krachtens deze afdeling op een luchtvaartuig verleende voorrechten gaan teniet door verloop van drie maanden,
      tenzij binnen die termijn het voorrecht is ingeschreven in de openbare registers of het verdragsregister waarin
      het luchtvaartuig teboekstaat, en bovendien het bedrag der vordering in der minne is vastgesteld dan wel langs
      gerechtelijke weg erkenning van het voorrecht en deszelfs omvang is gevorderd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1320
  - number: '1320.2'
    text: |-
      In geval van executoriale verkoop gaan de voorrechten mede teniet op het tijdstip waarop het proces-verbaal van
      verdeling wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1320
  - number: '1320.3'
    text: |-
      De in het eerste lid genoemde termijn begint met de aanvang van de dag volgende op die, waarop de hulpverlening of
      de handeling tot behoud waardoor de vordering is ontstaan, is beëindigd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1320
  - number: '1320.4'
    text: |-
      Voorrechten als bedoeld in [artikel 1317][ref1] kunnen worden ingeschreven in de openbare registers.
      [Artikel 24, eerste lid, van Boek 3][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1317
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1320
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1317'
        hoofdstuk: V
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '1321'
    text: |-
      Behoeven de in deze titel geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling,
      dan geschiedt dit bij of krachtens algemene maatregel van bestuur, onverminderd de bevoegdheid tot regeling
      krachtens de [Kadasterwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1321
    references:
      - id: ref1
        bwb_id: BWBR0004541
  - number: '1670'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1670
  - number: 1670.a
    text: |-
      *"gevaarlijke stof"*: een stof die als zodanig bij algemene maatregel van bestuur is aangewezen; de aanwijzing
      kan worden beperkt tot bepaalde concentraties van de stof, tot bepaalde in de algemene maatregel van bestuur te
      omschrijven gevaren die aan de stof verbonden zijn, en tot bepaalde daarin te omschrijven situaties waarin de stof
      zich bevindt;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1670
  - number: 1670.b
    text: '*"spoorrijtuig"*: elk voertuig, ingericht om op spoorstaven te rijden;'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1670
  - number: 1670.c
    text: '*"schade"*:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1670
  - number: 1670.c.1°
    text: schade veroorzaakt door dood of letsel van enige persoon veroorzaakt door een gevaarlijke stof;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1670
  - number: 1670.c.2°
    text: |-
      andere schade buiten het spoorrijtuig aan boord waarvan de gevaarlijke stof zich bevindt, veroorzaakt door die
      gevaarlijke stof, met uitzondering van verlies van of schade met betrekking tot andere spoorrijtuigen en zaken aan
      boord daarvan, indien die spoorrijtuigen deel uitmaken van een trein, waarvan ook dit spoorrijtuig deel uitmaakt;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1670
  - number: 1670.c.3°
    text: de kosten van preventieve maatregelen en verlies of schade veroorzaakt door zulke maatregelen;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1670
  - number: 1670.d
    text: |-
      *"preventieve maatregel"*: iedere redelijke maatregel ter voorkoming of beperking van schade door wie dan ook
      genomen met uitzondering van de overeenkomstig deze afdeling aansprakelijke persoon nadat een gebeurtenis heeft
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1670
  - number: 1670.e
    text: |-
      *"gebeurtenis"*: elk feit of elke opeenvolging van feiten met dezelfde oorzaak, waardoor schade ontstaat of
      waardoor een ernstige en onmiddellijke dreiging van schade ontstaat;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1670
  - number: 1670.f
    text: |-
      *"exploitant"*: hij die een spoorweg exploiteert. In geval van gezamenlijke exploitatie wordt ieder der
      exploitanten als exploitant beschouwd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1670
  - number: '1671.1'
    text: |-
      Deze afdeling is niet van toepassing, indien de exploitant jegens degene die de vordering instelt, aansprakelijk
      is uit hoofde van een exploitatie-overeenkomst of jegens deze persoon een beroep op een exploitatie-overeenkomst
      heeft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1671
  - number: '1671.2'
    text: |-
      Deze afdeling is van toepassing op de periode waarin een gevaarlijke stof zich in een spoorrijtuig bevindt,
      daaronder begrepen de periode vanaf het begin van de inlading van de gevaarlijke stof in het spoorrijtuig tot het
      einde van de lossing van die stof uit het spoorrijtuig.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1671
  - number: '1671.3'
    text: |-
      Deze afdeling is niet van toepassing op schade veroorzaakt wanneer het spoorrijtuig uitsluitend wordt gebruikt
      op een niet voor publiek toegankelijk terrein en zulk gebruik een onderdeel vormt van een op dat terrein
      plaatsvindende bedrijfsuitoefening.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1671
  - number: '1671.4'
    text: |-
      Op zich overeenkomstig het tweede lid aan boord bevindende stoffen als bedoeld in artikel 175 van Boek 6 is dat
      artikel niet van toepassing, tenzij zich het geval van het derde lid voordoet.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1671
  - number: '1672'
    text: |-
      Indien een gevaarlijke stof zich bevindt in een vervoermiddel dat zich aan boord van een spoorrijtuig bevindt
      zonder dat de gevaarlijke stof uit dit gestapelde vervoermiddel wordt gelost, zal de gevaarlijke stof voor die
      periode geacht worden zich alleen aan boord van genoemd spoorrijtuig te bevinden. Gedurende de handelingen bedoeld
      in artikel 1673, zesde lid, onderdelen *c, d* en *e*, echter zal de gevaarlijke stof geacht worden zich alleen aan
      boord van het gestapelde vervoermiddel te bevinden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1672
  - number: '1673.1'
    text: |-
      Hij die ten tijde van een gebeurtenis met een spoorrijtuig aan boord waarvan zich een gevaarlijke stof bevindt,
      exploitant is van de spoorweg waarop de gebeurtenis plaatsvond, is aansprakelijk voor de schade door die stof
      veroorzaakt ten gevolge van die gebeurtenis. Bestaat de gebeurtenis uit een opeenvolging van feiten met dezelfde
      oorzaak, dan rust de aansprakelijkheid op degene die ten tijde van het eerste feit exploitant was.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: '1673.2'
    text: |-
      Indien gedurende de handelingen bedoeld in het zesde lid, onderdelen *c, d* en *e*, het spoorrijtuig waarin de
      gevaarlijke stof zich bevindt, wordt voortbewogen over een andere spoorweg dan de spoorweg waarop het spoorrijtuig
      zich bevond bij de aanvang van de handelingen, is uitsluitend de exploitant van de laatstbedoelde spoorweg
      aansprakelijk voor schade door die stof veroorzaakt tijdens deze handelingen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: '1673.3'
    text: 'De exploitant is niet aansprakelijk indien:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: 1673.3.a
    text: |-
      de schade is veroorzaakt door een oorlogshandeling, vijandelijkheden, burgeroorlog, opstand of natuurgebeuren van
      uitzonderlijke, onvermijdelijke en onweerstaanbare aard;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: 1673.3.b
    text: |-
      de schade uitsluitend is veroorzaakt door een handelen of nalaten van een derde, niet zijnde een persoon genoemd in
      het zesde lid, onderdeel *a*, geschied met het opzet de schade te veroorzaken;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: 1673.3.c
    text: |-
      de afzender of enige andere persoon niet heeft voldaan aan zijn verplichting hem in te lichten over de gevaarlijke
      aard van de stof, en noch de exploitant, noch de in het zesde lid, onderdeel *a*, genoemde personen wisten of
      hadden behoren te weten dat deze gevaarlijk was.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: '1673.4'
    text: |-
      Indien de exploitant bewijst dat de schade geheel of gedeeltelijk het gevolg is van een handelen of nalaten van de
      persoon die de schade heeft geleden, met het opzet de schade te veroorzaken, of van de schuld van die persoon, kan
      hij geheel of gedeeltelijk worden ontheven van zijn aansprakelijkheid tegenover die persoon.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: '1673.5'
    text: |-
      De exploitant kan voor schade slechts uit anderen hoofde dan deze afdeling worden aangesproken in het geval van het
      derde lid, onderdeel *c*, alsmede in het geval dat hij uit hoofde van arbeidsovereenkomst kan worden aangesproken.
      In het geval van het derde lid, onderdeel *c*, kan de exploitant deze aansprakelijkheid beperken als ware hij op
      grond van deze afdeling aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: '1673.6'
    text: 'Behoudens de artikelen 1674 en 1675 zijn voor schade niet aansprakelijk:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: 1673.6.a
    text: de ondergeschikten, vertegenwoordigers of lasthebbers van de exploitant,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: 1673.6.b
    text: ieder die ten behoeve van het spoorrijtuig werkzaamheden verricht,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: 1673.6.c
    text: |-
      zij die anders dan tegen een uitdrukkelijk en redelijk verbod vanwege de exploitant in hulp verlenen aan het
      spoorrijtuig, de zich aan boord daarvan bevindende zaken of personen,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: 1673.6.d
    text: |-
      zij die op aanwijzing van een bevoegde overheidsinstantie hulp verlenen aan het spoorrijtuig, de zich aan boord
      daarvan bevindende zaken of personen,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: 1673.6.e
    text: zij die preventieve maatregelen nemen met uitzondering van de exploitant,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: 1673.6.f
    text: |-
      de ondergeschikten, vertegenwoordigers of lasthebbers van de in dit lid, onderdelen *b, c, d* en *e*, van
      aansprakelijkheid vrijgestelde personen, tenzij de schade is ontstaan uit hun eigen handelen of nalaten,
      geschied hetzij met het opzet die schade te veroorzaken, hetzij roekeloos en met de wetenschap dat die schade er
      waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: '1673.7'
    text: |-
      De exploitant heeft, voor zover niet anders is overeengekomen, verhaal op de in het zesde lid bedoelde personen,
      doch uitsluitend indien dezen ingevolge het slot van dit lid voor de schade kunnen worden aangesproken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1673
  - number: '1674.1'
    text: |-
      Indien de exploitant bewijst dat de gevaarlijke stof tijdens de periode bedoeld in artikel 1671, tweede lid,
      is geladen of gelost onder de uitsluitende verantwoordelijkheid van een door hem bij name genoemde ander dan
      de exploitant of zijn ondergeschikte, vertegenwoordiger of lasthebber, zoals de afzender of ontvanger, is de
      exploitant niet aansprakelijk voor de schade als gevolg van een gebeurtenis tijdens het laden of lossen van de
      gevaarlijke stof en is die ander voor deze schade aansprakelijk overeenkomstig deze afdeling.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1674
  - number: '1674.2'
    text: |-
      Indien echter de gevaarlijke stof tijdens de periode bedoeld in artikel 1671, tweede lid, is geladen of gelost
      onder de gezamenlijke verantwoordelijkheid van de exploitant en een door de exploitant bij name genoemde ander,
      zijn de exploitant en die ander hoofdelijk aansprakelijk overeenkomstig deze afdeling voor de schade als gevolg van
      een gebeurtenis tijdens het laden of lossen van de gevaarlijke stof.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1674
  - number: '1674.3'
    text: |-
      Indien is geladen of gelost door een persoon in opdracht of ten behoeve van de vervoerder of een ander, zoals de
      afzender of de ontvanger, is niet deze persoon, maar de vervoerder of die ander aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1674
  - number: '1674.4'
    text: |-
      Indien een ander dan de exploitant op grond van het eerste of het tweede lid aansprakelijk is, kan die ander geen
      beroep doen op artikel 1673, vijfde lid en zesde lid, onderdeel *b*.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1674
  - number: '1674.5'
    text: |-
      Indien een ander dan de exploitant op grond van het eerste of het tweede lid aansprakelijk is, zijn ten aanzien
      van die ander de artikelen 1678 tot en met 1680 van overeenkomstige toepassing, met dien verstande dat in geval van
      hoofdelijke aansprakelijkheid:
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1674
  - number: 1674.5.a
    text: |-
      de beperking van aansprakelijkheid als bepaald krachtens artikel 1678, eerste lid, geldt voor het geheel der naar
      aanleiding van eenzelfde gebeurtenis ontstane vorderingen gericht tegen beiden;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1674
  - number: 1674.5.b
    text: |-
      een fonds gevormd door één van hen overeenkomstig artikel 1679 wordt aangemerkt als door beiden te zijn gevormd en
      zulks ten aanzien van de vorderingen waarvoor het fonds werd gesteld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1674
  - number: '1674.6'
    text: |-
      In de onderlinge verhouding tussen de exploitant en de in het tweede lid van dit artikel genoemde ander is
      de exploitant niet tot vergoeding verplicht dan in geval van schuld van hemzelf of van zijn ondergeschikten,
      vertegenwoordigers of lasthebbers.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1674
  - number: '1674.7'
    text: |-
      Dit artikel is niet van toepassing als tijdens de periode, bedoeld in artikel 1671, tweede lid, is geladen of
      gelost onder de uitsluitende of gezamenlijke verantwoordelijkheid van een persoon, genoemd in artikel 1673, zesde
      lid, onderdeel *c, d* of *e*.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1674
  - number: '1675'
    text: |-
      Indien ingevolge artikel 1673, derde lid, onderdeel *c*, de exploitant niet aansprakelijk is, is de afzender of
      andere persoon aansprakelijk overeenkomstig deze afdeling en zijn te diens aanzien de artikelen 1678 tot en met
      1680 van overeenkomstige toepassing. De afzender of andere persoon kan geen beroep doen op artikel 1673, vijfde
      lid.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1675
  - number: '1676'
    text: |-
      Indien schade veroorzaakt door de gevaarlijke stof redelijkerwijs niet kan worden gescheiden van schade anderszins
      veroorzaakt, zal de gehele schade worden aangemerkt als schade in de zin van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1676
  - number: '1677.1'
    text: |-
      Wanneer door een gebeurtenis schade is veroorzaakt door gevaarlijke stoffen aan boord van een spoorrijtuig dat
      gebruikt werd op meer dan één door verschillende exploitanten geëxploiteerde spoorweg, dan wel aan boord van
      een spoorrijtuig dat gebruikt werd op een of meer spoorwegen en een voertuig of luchtkussenvoertuig, zijn de
      exploitanten van de daarbij betrokken spoorwegen, het voertuig of het luchtkussenvoertuig, onverminderd het in
      artikel 1673, derde en vierde lid, en artikel 1674 en afdeling 1 van titel 14 bepaalde, hoofdelijk aansprakelijk
      voor alle schade waarvan redelijkerwijs niet kan worden aangenomen dat zij veroorzaakt is door gevaarlijke stoffen
      aan boord van een spoorrijtuig dat gebruikt werd op één of meer bepaalde spoorwegen of aan boord van een bepaald
      voertuig of luchtkussenvoertuig.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1677
  - number: '1677.2'
    text: |-
      Het bepaalde in het eerste lid laat onverlet het beroep op beperking van aansprakelijkheid van de exploitant
      krachtens deze afdeling of de artikelen 1218 tot en met 1220, ieder tot het voor hem geldende bedrag.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1677
  - number: '1678.1'
    text: |-
      De exploitant kan zijn aansprakelijkheid per gebeurtenis beperken tot een bij of krachtens algemene maatregel van
      bestuur te bepalen bedrag of bedragen die verschillend kunnen zijn voor vorderingen ter zake van dood of letsel en
      andere vorderingen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1678
  - number: '1678.2'
    text: |-
      De exploitant is niet gerechtigd zijn aansprakelijkheid te beperken indien de schade is ontstaan uit zijn eigen
      handelen of nalaten, geschied hetzij met het opzet die schade te veroorzaken, hetzij roekeloos en met de wetenschap
      dat die schade er waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1678
  - number: '1679'
    text: |-
      Ten einde zich te kunnen beroepen op de in artikel 1678 bedoelde beperking van aansprakelijkheid moet de exploitant
      een fonds of fondsen vormen overeenkomstig artikel 1680.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1679
  - number: '1680.1'
    text: |-
      Hij die gebruik wenst te maken van de hem in artikel 1678 gegeven bevoegdheid tot beperking van zijn
      aansprakelijkheid, verzoekt een arrondissementsrechtbank die bevoegd is kennis te nemen van de vorderingen tot
      vergoeding van schade, het bedrag waartoe zijn aansprakelijkheid is beperkt, vast te stellen en te bevelen dat tot
      een procedure ter verdeling van dit bedrag zal worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1680
  - number: '1680.2'
    text: |-
      Op het verzoek en de procedure ter verdeling zijn de [artikelen 642a, tweede tot en met vierde lid][ref1],
      [642b][ref2], [642c][ref3], [642e, eerste lid][ref4], [642f tot en met 642t, eerste lid][ref5], en
      [642u tot en met 642z van het Wetboek van Burgerlijke Rechtsvordering][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel642a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel642b
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel642c
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel642e
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel642f
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel642u
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1680
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 642a
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 642b
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 642c
      - id: ref4
        bwb_id: BWBR0001827
        artikel: 642e
      - id: ref5
        bwb_id: BWBR0001827
        artikel: 642f
      - id: ref6
        bwb_id: BWBR0001827
        artikel: 642u
  - number: '1680.3'
    text: |-
      Indien het krachtens artikel 1678, eerste lid, bepaalde bedrag voor vorderingen ter zake van dood of letsel
      onvoldoende is voor volledige vergoeding van deze vorderingen, worden deze vorderingen in evenredigheid gekort
      en zal het krachtens artikel 1678, eerste lid, bepaalde bedrag voor andere vorderingen naar evenredigheid worden
      verdeeld onder die vorderingen en de vorderingen ter zake van dood of letsel, voor zover deze onvoldaan zouden
      zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1680
  - number: '1680.4'
    text: |-
      De vorderingen van de exploitant ter zake van door hem vrijwillig en binnen de grenzen der redelijkheid gedane
      uitgaven en gebrachte offers ter voorkoming of beperking van schade staan in rang gelijk met andere vorderingen
      op het krachtens artikel 1678, eerste lid, bepaalde bedrag voor andere vorderingen dan die ter zake van dood of
      letsel.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1680
  - number: '1700.1'
    text: |-
      Een beding, waarbij een wettelijke termijn van verjaring of verval wordt gewijzigd, wordt aangemerkt als een beding
      ter wijziging van de aansprakelijkheid van hem, aan wie een beroep op deze termijn toekomt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1700
  - number: '1700.2'
    text: |-
      Behoudens [artikel 1701][ref1] is ieder beding nietig, waarbij van het vorige lid wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1701
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1700
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1701'
        hoofdstuk: VII
        afdeling: '1'
  - number: '1701'
    text: |-
      Een termijn, bij afloop waarvan een rechtsvordering verjaart of vervalt, kan worden verlengd bij overeenkomst
      tussen partijen, gesloten nadat het feit, dat de rechtsvordering heeft doen ontstaan, heeft plaatsgehad. In
      afwijking van het eerste lid van [artikel 1700][ref1] wordt een dergelijke verlenging niet aangemerkt als een
      wijziging van aansprakelijkheid van hem aan wie een beroep op een dergelijke termijn toekomt.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1700
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1701
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1700'
        hoofdstuk: VII
        afdeling: '1'
  - number: '1702'
    text: |-
      Het feit, dat een schuldenaar opzettelijk het bestaan van de schuld voor de schuldeiser verborgen houdt, is niet
      van invloed op een termijn van verjaring of verval.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1702
  - number: '1710'
    text: |-
      In [artikel 1711][ref1] en in de [artikelen 1713 tot en met 1720][ref2] wordt verstaan onder:


