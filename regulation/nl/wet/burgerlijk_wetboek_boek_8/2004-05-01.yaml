  - number: 1714.d
    text: |-
      invullen, aanvullen, dateren, ondertekenen of afgeven van een cognossement, vrachtbrief, ontvangstbewijs of een
      soortgelijk document.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1714
  - number: '1715'
    text: |-
      In afwijking van [artikel 1717][ref1] en behoudens [artikel 1719][ref2] is op een rechtsvordering door de
      vervoerder of de afzender ingesteld met betrekking tot materiaal, dat van de zijde van de afzender ter beschikking
      moet worden gesteld of is gesteld, [artikel 1714][ref3] van overeenkomstige toepassing met dien verstande, dat
      in geval de vervoerder volgens de overeenkomst niet tot teruggave van het materiaal verplicht is onder de dag van
      aflevering daarvan mede wordt verstaan de dag waarop dit materiaal te zijner beschikking werd gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1717
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1719
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1714
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1715
