        afdeling: '2'
  - number: '1720.1'
    text: |-
      Behoudens [artikel 1712][ref1] begint ten behoeve van een vervoerder of een afzender, voor zover deze verhaal zoekt
      op een partij bij een exploitatie-overeenkomst, als bedoeld in [artikel 361][ref2], voor hetgeen door hem aan een
      derde is verschuldigd, een nieuwe termijn van verjaring of verval, welke drie maanden beloopt; deze termijn begint
      met de aanvang van de dag, volgende op de eerste der volgende dagen:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1712
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel361
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1720
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1712'
        hoofdstuk: VII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '361'
        hoofdstuk: II
        afdeling: '1'
  - number: 1720.1.a
    text: de dag waarop hij, die verhaal zoekt, aan de tot hem gerichte vordering heeft voldaan of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1720
  - number: 1720.1.b
    text: de dag waarop hij, die verhaal zoekt, terzake in rechte is aangesproken of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1720
  - number: 1720.1.c
    text: de dag waarop de verjaring, waarop hij, die verhaal zoekt, beroep zou kunnen doen, is gestuit of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1720
  - number: 1720.1.d
    text: |-
      de dag waarop de termijn van de verjaring of het verval van de rechtsvordering waarvoor verhaal wordt gezocht, is
      verlopen, waarbij geen rekening wordt gehouden met een mogelijkerwijs door partijen overeengekomen verlenging.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1720
  - number: '1720.2'
    text: |-
      Het eerste lid kan er niet toe leiden, dat de voor rechtsvorderingen, gegrond op de desbetreffende exploitatie-
      overeenkomst, geldende termijn van verjaring of verval eerder verstrijkt ten aanzien van de rechtsvordering tot
      verhaal die op die exploitatie-overeenkomst is gegrond.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1720
  - number: '1720.3'
    text: |-
      Voor de toepassing van dit artikel wordt een overeenkomst, waarbij door de ene partij een vervoermiddel
      anders dan bij wijze van bevrachting en anders dan bij wijze van een overeenkomst als bedoeld in
      [artikel 1080 derde lid][ref1], ter beschikking wordt gesteld van haar wederpartij, als exploitatie-overeenkomst
      aangemerkt en worden de partijen bij die overeenkomst aangemerkt als vervoerder en afzender.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1080
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1720
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1080'
        hoofdstuk: IV
        afdeling: '1'
  - number: '1721.1'
    text: |-
      Indien uit hoofde van de [artikelen 1710 tot en met 1720][ref1] enige rechtsvordering in verschillende termijnen
      verjaart of vervalt dan wel te haren aanzien het begin van de termijn, waarbinnen de rechtsvordering verjaart of
      vervalt, verschilt, geldt die bepaling die de termijn van verjaring of verval het laatst doet eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1710
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1721
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1710'
        hoofdstuk: VII
        afdeling: '2'
  - number: '1721.2'
    text: |-
      Het vorige lid laat [artikel 1712][ref1] onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1712
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1721
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1712'
        hoofdstuk: VII
        afdeling: '2'
  - number: '1722.1'
    text: |-
      De [artikelen 1710 tot en met 1721][ref1] zijn van toepassing op overeenkomsten van gecombineerd goederenvervoer,
      met dien verstande, dat onder afzender mede de houder van een CT-document wordt verstaan en onder dag van
      aflevering, de dag van aflevering onder de overeenkomst van gecombineerd goederenvervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1710
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1722
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1710'
        hoofdstuk: VII
        afdeling: '2'
  - number: '1722.2'
    text: |-
      Indien bij een overeenkomst van gecombineerd goederenvervoer aan hem die de rechtsvordering instelt niet bekend is
      waar de omstandigheid, die tot de rechtsvordering aanleiding gaf, is opgekomen, wordt die der in aanmerking komende
      bepalingen van verjaring of verval toegepast die voor hem de gunstigste is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1722
  - number: '1722.3'
    text: Nietig is ieder beding, waarbij van het tweede lid van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1722
  - number: '1730.1'
    text: |-
      Een rechtsvordering gegrond op een overeenkomst, als bedoeld in [afdeling 4 van titel 5][ref1] of
      [afdeling 4 van titel 10][ref2], verjaart door verloop van één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1730
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005034
        hoofdstuk: III
        afdeling: '4'
  - number: '1730.2'
    text: |-
      De [artikelen 1710][ref1], [1713 tot en met 1722][ref2] en [1750 tot en met 1754][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1710
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1713
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1750
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1730
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1710'
        hoofdstuk: VII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1713'
        hoofdstuk: VII
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1750'
        hoofdstuk: VII
        afdeling: '5'
  - number: '1740.1'
    text: |-
      Behoudens [artikel 1741][ref1] verjaart een op een overeenkomst tot het doen vervoeren van goederen gegronde
      rechtsvordering door verloop van negen maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1741
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1740
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1741'
        hoofdstuk: VII
        afdeling: '4'
  - number: '1740.2'
    text: |-
      De in het eerste lid bedoelde termijn begint te lopen met de aanvang van de dag, volgende op de dag van
      aflevering. Voor de vaststelling van deze dag vindt [artikel 1710 onder d][ref1] overeenkomstige toepassing. Is de
      rechtsvordering echter gegrond op [artikel 62][ref2] of op [artikel 63][ref3], dan wel op enig beding van gelijke
      strekking, dan begint deze termijn met de aanvang van de dag, volgende op die waarop de opdrachtgever wist, dat de
      expediteur niet aan zijn verplichting tot het doen van mededelingen voldeed.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1710
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel63
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1740
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1710'
        hoofdstuk: VII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '62'
        hoofdstuk: I
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '63'
        hoofdstuk: I
        afdeling: '3'
  - number: '1740.3'
    text: |-
      Is de rechtsvordering gegrond op [artikel 65][ref1] of [artikel 68][ref2], dan begint de termijn met de aanvang van
      de dag, volgende op de dag dat de overeenkomst tot het doen vervoeren van goederen eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel68
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1740
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '65'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '68'
        hoofdstuk: I
        afdeling: '3'
  - number: '1741.1'
    text: |-
      Ten behoeve van een partij bij een overeenkomst tot het doen vervoeren van goederen, voor zover deze verhaal zoekt
      op haar wederpartij voor hetgeen door haar aan een derde is verschuldigd, begint een nieuwe termijn van verjaring
      of verval, welke drie maanden beloopt; deze termijn begint met de aanvang van de dag, volgende op de eerste der
      volgende dagen:
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1741
  - number: 1741.1.a
    text: de dag waarop hij, die verhaal zoekt, aan de tot hem gerichte vordering heeft voldaan of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1741
  - number: 1741.1.b
    text: de dag waarop hij, die verhaal zoekt, terzake in rechte is aangesproken of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1741
  - number: 1741.1.c
    text: de dag waarop de verjaring, waar op hij, die verhaal zoekt, beroep zou kunnen doen, is gestuit of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1741
  - number: 1741.1.d
    text: |-
      de dag waarop de termijn van de verjaring of het verval van de rechtsvordering waarvoor verhaal wordt gezocht, is
      verlopen, waarbij geen rekening wordt gehouden met een mogelijkerwijs door partijen overeengekomen verlenging.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1741
  - number: '1741.2'
    text: |-
      Het eerste lid kan er niet toe leiden, dat de voor rechtsvorderingen, gegrond op de desbetreffende overeenkomst
      tot het doen vervoeren van goederen, geldende termijn van verjaring of verval eerder verstrijkt ten aanzien van de
      rechtsvordering tot verhaal die op die overeenkomst tot het doen vervoeren van goederen is gegrond.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1741
  - number: '1750.1'
    text: |-
      Behoudens de artikelen 1751 tot en met 1754 verjaart een op een overeenkomst van personenvervoer, als genoemd in de
      afdelingen 4 van titel 2, 5 van titel 2, 3 van titel 5, 3 van titel 10 en 3 van titel 13, gegronde rechtsvordering
      door verloop van één jaar, welke termijn begint met de aanvang van de dag, volgende op die waarop de reiziger het
      vervoermiddel heeft verlaten of had moeten verlaten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1750
  - number: '1750.2'
    text: |-
      In afwijking van het eerste lid zijn op de verjaring van een rechtsvordering terzake van het vervoer van bagage,
      geen hut- of handbagage in de zin van de artikelen 100, 500, 970 of 1141, noch een als bagage ten vervoer
      aangenomen voertuig of schip of levend dier zijnde, de artikelen 1710 tot en met 1722 van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1750
  - number: '1751.1'
    text: |-
      Een rechtsvordering jegens de vervoerder terzake van aan een reiziger overkomen letsel verjaart door verloop
      van drie jaren, welke termijn begint met de aanvang van de dag, volgende op de dag van het de reiziger overkomen
      voorval of ongeval.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1751
  - number: '1751.2'
    text: |-
      Een rechtsvordering jegens de vervoerder terzake van dood van een reiziger verjaart door verloop van drie jaren,
      welke termijn begint met de aanvang van de dag, volgende op de dag van overlijden van de reiziger, doch welke niet
      langer loopt dan vijf jaren beginnend met de aanvang van de dag, volgende op de dag van het de reiziger overkomen
      voorval of ongeval.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1751
  - number: '1752'
    text: |-
      In geval van bevrachting strekkende tot het vervoer van personen zijn de [artikelen 1713 eerste lid][ref1],
      [1716 tot en met 1719][ref2] en [1721][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1713
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1716
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1721
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1752
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1713'
        hoofdstuk: VII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1716'
        hoofdstuk: VII
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1721'
        hoofdstuk: VII
        afdeling: '2'
  - number: '1753.1'
    text: |-
      Een rechtsvordering jegens een vervoerder terzake van dood of letsel van de reiziger of terzake van hut- of
      handbagage in de zin van [artikel 100][ref1], [500][ref2], [970][ref3] of [artikel 1141][ref4], dan wel terzake van
      een als bagage ten vervoer aangenomen voertuig, schip of levend dier vervalt indien de rechthebbende niet binnen
      een termijn van drie maanden aan de vervoerder kennis heeft gegeven van het aan de reiziger overkomen voorval of
      ongeval.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel500
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel970
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1141
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1753
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '100'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '500'
        hoofdstuk: II
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '970'
        hoofdstuk: III
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '1141'
        hoofdstuk: IV
        afdeling: '3'
  - number: '1753.2'
    text: |-
      De in het eerste lid genoemde termijn begint met de aanvang van de dag, volgende op de dag van het voorval of
      ongeval.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1753
  - number: '1753.3'
    text: Het eerste lid van dit artikel blijft buiten toepassing indien
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1753
  - number: 1753.3.a
    text: |-
      de rechthebbende binnen de in het eerste lid genoemde termijn schriftelijk bij de vervoerder een vordering heeft
      ingediend;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1753
  - number: 1753.3.b
    text: het voorval of ongeval te wijten is aan schuld van de vervoerder;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1753
  - number: 1753.3.c
    text: |-
      van het voorval of ongeval geen kennis is gegeven of niet binnen de in het eerste lid genoemde termijn kennis is
      gegeven, het één of het ander door omstandigheden, die niet voor rekening van de rechthebbende komen;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1753
  - number: 1753.3.d
    text: |-
      de vervoerder binnen de in het eerste lid genoemde termijn uit anderen hoofde kennis had van het voorval of
      ongeval.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1753
  - number: '1753.4'
    text: |-
      Voor de toepassing van dit artikel wordt een omstandigheid als bedoeld in de
      [artikelen 106 eerste lid onder b][ref1], [505][ref2], [975][ref3] en [1150][ref4] aangemerkt als een aan de
      reiziger overkomen voorval of ongeval.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel505
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel975
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1150
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1753
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '106'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '505'
        hoofdstuk: II
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '975'
        hoofdstuk: III
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '1150'
        hoofdstuk: IV
        afdeling: '3'
  - number: '1754.1'
    text: |-
      Ten behoeve van een vervoerder van personen, een wederpartij van een zodanige vervoerder of een reiziger, voor
      zover deze verhaal zoekt op een partij bij een exploitatie-overeenkomst, als bedoeld in [artikel 361][ref1], dan
      wel op een reiziger voor hetgeen door hem aan een derde is verschuldigd, begint een nieuwe termijn van verjaring
      of verval, welke drie maanden beloopt; deze termijn begint met de aanvang van de dag, volgende op de eerste der
      volgende dagen:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel361
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1754
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '361'
        hoofdstuk: II
        afdeling: '1'
  - number: 1754.1.a
    text: de dag waarop hij, die verhaal zoekt, aan de tot hem gerichte vordering heeft voldaan of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1754
  - number: 1754.1.b
    text: de dag waarop hij, die verhaal zoekt, terzake in rechte is aangesproken of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1754
  - number: 1754.1.c
    text: de dag waarop de verjaring, waarop hij, die verhaal zoekt, beroep zou kunnen doen, is gestuit of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1754
  - number: 1754.1.d
    text: |-
      de dag waarop de termijn van de verjaring of het verval van de rechtsvordering waarvoor verhaal wordt gezocht, is
      verlopen, waarbij geen rekening wordt gehouden met een mogelijkerwijs door partijen overeengekomen verlenging.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1754
  - number: '1754.2'
    text: |-
      Het eerste lid kan er niet toe leiden, dat de voor rechtsvorderingen, gegrond op de desbetreffende exploitatie-
      overeenkomst, geldende termijn van verjaring of verval eerder verstrijkt ten aanzien van de rechtsvordering tot
      verhaal die op die exploitatie-overeenkomst is gegrond.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1754
  - number: '1754.3'
    text: |-
      Voor de toepassing van dit artikel wordt een overeenkomst, waarbij door de ene partij een vervoermiddel
      anders dan bij wijze van bevrachting en anders dan bij wijze van een overeenkomst als bedoeld in
      [artikel 1080 derde lid][ref1], ter beschikking wordt gesteld van haar wederpartij, als exploitatie-overeenkomst
      aangemerkt en worden de partijen bij die overeenkomst aangemerkt als vervoerder en diens wederpartij of reiziger.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1080
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1754
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1080'
        hoofdstuk: IV
        afdeling: '1'
  - number: '1770'
    text: |-
      Een rechtsvordering tussen de leden ener rederij als zodanig en tussen deze leden en de boekhouder als zodanig
      verjaart door verloop van vijf jaren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1770
  - number: '1780.1'
    text: |-
      Een rechtsvordering tegen een kapitein of schipper terzake van schade door hem toegebracht in de uitoefening van
      zijn werkzaamheden verjaart door verloop van twee jaren, welke termijn begint met de aanvang van de dag, volgende
      op de dag waarop het schadeveroorzakende voorval plaatsvond.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1780
  - number: '1780.2'
    text: Het eerste lid is niet van toepassing op rechtsvorderingen van de werkgever van de kapitein of de schipper.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1780
  - number: '1790'
    text: |-
      Een rechtsvordering tot vergoeding van schade veroorzaakt door een voorval, als bedoeld in
      [afdeling 1 van titel 6][ref1], verjaart, indien zij niet op een overeenkomst is gegrond, door verloop van twee
      jaren, welke termijn begint met de aanvang van de dag, volgende op de dag van dit voorval.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1790
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '1'
  - number: '1791'
    text: |-
      Een rechtsvordering tot verhaal van een overschot, als bedoeld in het [derde lid van artikel 545][ref1], verjaart
      door verloop van één jaar, welke termijn begint met de aanvang van de dag, volgende op die waarop de betaling van
      het overschot heeft plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel545
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1791
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '545'
        hoofdstuk: II
        afdeling: '1'
  - number: '1792.1'
    text: |-
      De verjaringstermijn, genoemd in [artikel 1790][ref1], wordt verlengd met de dagen, gedurende welke het
      aansprakelijk geachte schip niet in beslag kon worden genomen binnen de staat, waarin de schuldeiser woont of de
      hoofdzetel van zijn bedrijf is gevestigd, met dien verstande echter dat


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1790
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1792
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1790'
        hoofdstuk: VII
        afdeling: '9'
  - number: 1792.1.a
    text: |-
      indien het schip binnen de termijn, gesteld in [artikel 1790][ref1], aldus in beslag kon worden genomen, deze
      termijn met niet meer dan drie maanden wordt verlengd;


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1790
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1792
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1790'
        hoofdstuk: VII
        afdeling: '9'
  - number: 1792.1.b
    text: |-
      indien het schip niet binnen de termijn, gesteld in [artikel 1790][ref1] aldus in beslag kon worden genomen, deze
      termijn eindigt met de aanvang van de dag, volgende op die waarop drie maanden zijn verlopen sinds het eerste
      tijdstip, waarop dit beslag mogelijk was en in ieder geval met de aanvang van de dag, volgende op die waarop vijf
      jaren zijn verlopen sinds het tijdstip van het voorval, bedoeld in [afdeling 1 van titel 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1790
      [ref2]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1792
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1790'
        hoofdstuk: VII
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '1'
  - number: '1792.2'
    text: |-
      Indien een rechtsvordering als bedoeld in [artikel 1790][ref1] wordt ingesteld vóór de aanvang van de
      dag, volgende op die waarop vijf jaren zijn verlopen sinds het tijdstip van het voorval, bedoeld in
      [afdeling 1 van titel 6][ref2], wordt vermoed dat het aansprakelijk geachte schip voordien niet in beslag kon
      worden genomen binnen de staat, waarin de schuldeiser woont of de hoofdzetel van zijn bedrijf is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1790
      [ref2]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1792
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1790'
        hoofdstuk: VII
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '1'
  - number: '1792.3'
    text: |-
      Bij de toepassing van dit artikel wordt geen rekening gehouden met een mogelijkerwijs door partijen overeengekomen
      verlenging van de in [artikel 1790][ref1] gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1790
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1792
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1790'
        hoofdstuk: VII
        afdeling: '9'
  - number: '1793'
    text: |-
      Een rechtsvordering tot vergoeding van schade veroorzaakt door een voorval, als bedoeld in
      [afdeling 1 van titel 11][ref1], verjaart, indien zij niet op een overeenkomst is gegrond, door verloop van twee
      jaren, welke termijn begint met de aanvang van de dag, volgende op de dag van dit voorval.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1793
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: III
        afdeling: '1'
  - number: '1794.1'
    text: |-
      Een rechtsvordering tot verhaal van een overschot, als bedoeld in het derde lid van [artikel 1006][ref1], verjaart
      door verloop van één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1006
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1794
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1006'
        hoofdstuk: III
        afdeling: '1'
  - number: '1794.2'
    text: |-
      De termijn van deze verjaring begint met de aanvang van de dag, volgende op die waarop het bedrag van de
      hoofdelijke aansprakelijkheid is vastgesteld bij een in kracht van gewijsde gegaan vonnis. Indien zulk een
      vaststelling niet is geschied, begint de termijn van deze verjaring met de aanvang van de dag, volgende op die
      waarop de tot het verhaal aanleiding gevende betaling heeft plaatsgevonden. Indien de rechtsvordering betrekking
      heeft op de verdeling van het aandeel van een onvermogende medeschuldenaar, begint de termijn van deze verjaring
      echter te lopen met de aanvang van de dag, volgende op die waarop de rechthebbende kennis heeft gekregen van het
      onvermogen van zijn medeschuldenaar.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1794
  - number: '1820.1'
    text: |-
      Een rechtsvordering ter zake van betaling als bedoeld in [artikel 551][ref1], onder *e*, verjaart door verloop van
      twee jaren, welke termijn begint met de aanvang van de dag waarop de hulpverlening is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel551
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1820
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '551'
        hoofdstuk: II
        afdeling: '2'
  - number: '1820.2'
    text: |-
      Onverminderd het in [artikel 1701][ref1] bepaalde kan de in het eerste lid bedoelde termijn worden verlengd door
      een verklaring van hem die de verjaring kan inroepen, gedaan nadat het feit dat de rechtsvordering heeft doen
      ontstaan heeft plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1701
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1820
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1701'
        hoofdstuk: VII
        afdeling: '1'
  - number: '1820.3'
    text: |-
      In afwijking van het eerste lid kunnen rechtsvorderingen tot verhaal op een derde zelfs na afloop van de in dat
      lid genoemde termijn worden ingesteld gedurende een termijn van drie maanden, te rekenen van de dag waarop degene
      die een zodanige rechtsvordering tot verhaal instelt ten aanzien van het van hemzelf gevorderde een regeling heeft
      getroffen of waarop hij te dien aanzien in rechte is aangesproken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1820
  - number: '1830.1'
    text: |-
      Een rechtsvordering tot berekening en omslag van een avarij-grosse, en die tot benoeming van een dispacheur
      hiertoe, verjaart door verloop van één jaar.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1830
  - number: '1830.2'
    text: |-
      De termijn van deze verjaring begint met de aanvang van de dag, volgende op de dag van het einde van de
      onderneming.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1830
  - number: '1830.3'
    text: |-
      Indien de avarij-grosse geheel of gedeeltelijk uit hulploon bestaat en de vordering tot betaling van dit hulploon
      is ingesteld binnen de daarvoor in de [artikelen 1820][ref1] en [1823][ref2] gestelde termijn, doch na verloop van
      een termijn van negen maanden, beginnende met de aanvang van de dag, volgende op die waarop de in het eerste lid
      genoemde termijn aanvangt, verjaren de in het eerste lid genoemde rechtsvorderingen door verloop van een termijn
      van drie maanden, welke termijn begint met de aanvang van de dag, volgende op die waarop de vordering tot betaling
      van hulploon is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1820
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1823
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1830
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1820'
        hoofdstuk: VII
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1823'
        hoofdstuk: VII
        afdeling: '10'
  - number: '1831'
    text: |-
      Het recht homologatie dan wel herziening van een berekening en omslag van een avarij-grosse (dispache) te verzoeken
      vervalt door verloop van zes jaren, welke termijn begint met de aanvang van de dag, volgende op die waarop de
      dispache of een uittreksel daarvan aan belanghebbenden is medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1831
  - number: '1832.1'
    text: Een rechtsvordering tot betaling van een bijdrage in avarij-grosse verjaart door verloop van één jaar.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1832
  - number: '1832.2'
    text: |-
      De termijn van deze verjaring begint met de aanvang van de dag, volgende op die waarop de dispache of een
      uittreksel daarvan dan wel, indien een verzoek tot herziening der dispache is gedaan, de naar aanleiding daarvan
      opgestelde dispache of een uittreksel daarvan aan partijen is medegedeeld of aan dezen is medegedeeld, dat deze
      dispache ter griffie van de rechtbank is gedeponeerd, doch in geval van homologatie eerst op de dag dat de dispache
      bij in kracht van gewijsde gegane beschikking is gehomologeerd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1832
  - number: '1833'
    text: |-
      Een rechtsvordering tot vergoeding van schade uit hoofde van de [afdelingen 4 van titel 6][ref1],
      [4 van titel 11][ref2], [1 van titel 14][ref3] en 4 van titel 19 verjaart door verloop van drie jaren na de aanvang
      van de dag, volgende op die waarop de benadeelde bekend was of redelijkerwijze bekend had behoren te zijn met
      de schade en de daarvoor aansprakelijke persoon en in ieder geval door verloop van tien jaren na de gebeurtenis
      waardoor de schade is ontstaan. Indien de gebeurtenis bestond uit een opeenvolging van feiten met dezelfde oorzaak,
      loopt de termijn van tien jaren vanaf de dag waarop het laatste van die feiten plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1833
