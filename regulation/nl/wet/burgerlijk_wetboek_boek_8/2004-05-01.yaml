        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '414'
        hoofdstuk: II
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005034
        artikel: '492'
        hoofdstuk: II
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0005034
        artikel: '493'
        hoofdstuk: II
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0005034
        artikel: '1712'
        hoofdstuk: VII
        afdeling: '2'
      - id: ref8
        bwb_id: BWBR0005034
        artikel: '361'
        hoofdstuk: II
        afdeling: '1'
  - number: '382.2'
    text: 'Niettegenstaande het eerste lid is een beding, als daar genoemd, geldig mits het betreft:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel382
  - number: 382.2.a
    text: een geoorloofd beding omtrent avarij-grosse;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel382
  - number: 382.2.b
    text: levende dieren;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel382
  - number: 382.2.c
    text: zaken, die feitelijk op het dek worden vervoerd mits deze in het cognossement als deklading zijn opgegeven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel382
  - number: '383.1'
    text: |-
      Onder een vervoerovereenkomst onder cognossement is noch de vervoerder noch het schip aansprakelijk voor verliezen
      of schaden, voortgevloeid of ontstaan uit onzeewaardigheid, tenzij deze is te wijten aan gebrek aan redelijke
      zorg aan de zijde van de vervoerder om het schip zeewaardig te maken, het behoorlijk te bemannen, uit te rusten of
      te bevoorraden, of om de ruimen, koel- en vrieskamers en alle andere delen van het schip, waarin de zaken worden
      geladen, geschikt te maken en in goede staat te brengen, zodat zij kunnen dienen tot het bergen, het vervoeren
      en het bewaren van de zaken, alles overeenkomstig het eerste lid van [artikel 381][ref1]. Telkens als verlies of
      schade is ontstaan uit onzeewaardigheid, rust de bewijslast ten aanzien van het aangewend zijn van de redelijke
      zorg op de vervoerder of op iedere andere persoon, die mocht beweren krachtens dit artikel van aan sprakelijkheid
      te zijn ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel381
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '381'
        hoofdstuk: II
        afdeling: '2'
  - number: '383.2'
    text: |-
      Onder een vervoerovereenkomst al dan niet onder cognossement is noch de vervoerder noch het schip aansprakelijk
      voor verlies of schade ontstaan of voortgevloeid uit:
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.a
    text: |-
      een handeling, onachtzaamheid of nalatigheid van de kapitein, een ander lid van de bemanning, de loods of
      ondergeschikten van de vervoerder, gepleegd bij de navigatie of de behandeling van het schip;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.b
    text: brand, tenzij veroorzaakt door de persoonlijke schuld van de vervoerder;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.c
    text: gevaren, onheilen en ongevallen van de zee of andere bevaarbare wateren;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.d
    text: een natuurgebeuren;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.e
    text: oorlogshandelingen;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.f
    text: een daad van vijanden van de staat;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.g
    text: aanhouding of maatregelen van hogerhand of gerechtelijk beslag;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.h
    text: maatregelen van quarantaine;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.i
    text: een handeling of een nalaten van de afzender of eigenaar der zaken of van hun agent of vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.j
    text: |-
      werkstakingen of uitsluitingen of stilstand of belemmering van de arbeid, tengevolge van welke oorzaak dan ook,
      hetzij gedeeltelijk hetzij geheel;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.k
    text: oproer of onlusten;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.l
    text: redding of poging tot redding van mensenlevens of goederen op zee;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.m
    text: |-
      verlies aan volume of gewicht of enig ander verlies, of enige andere schade, ontstaan uit een verborgen gebrek, de
      bijzondere aard of een eigen gebrek van de zaak;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.n
    text: onvoldoende verpakking;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.o
    text: onvoldoende of gebrekkige merken;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.p
    text: verborgen gebreken, die ondanks een redelijke zorg niet te ontdekken waren;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: 383.2.q
    text: |-
      enige andere oorzaak, niet voortgevloeid uit de persoonlijke schuld van de vervoerder, noch uit schuld of
      nalatigheid van zijn agenten of ondergeschikten; doch de bewijslast rust op degeen, die zich op deze ontheffing
      beroept, en het staat aan hem aan te tonen, dat noch zijn persoonlijke schuld, noch de nalatigheid of schuld van
      zijn agenten of ondergeschikten heeft bijgedragen tot het verlies of de schade.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: '383.3'
    text: |-
      Onder een vervoerovereenkomst onder cognossement is de afzender niet aansprakelijk voor door de vervoerder of
      het schip geleden verliezen of schaden, voortgevloeid of ontstaan uit welke oorzaak dan ook, zonder dat er is een
      handeling, schuld of nalatigheid van hem, van zijn agenten of van zijn ondergeschikten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: '383.4'
    text: |-
      Generlei afwijking van de koers tot redding of poging tot redding van mensenlevens of goederen op zee en generlei
      redelijke afwijking van de koers wordt beschouwd als een schending van enige vervoerovereenkomst en de vervoerder
      is niet aansprakelijk voor enig verlies of enige schade daardoor ontstaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: '383.5'
    text: |-
      Het staat de afzender vrij aansprakelijkheid aan te tonen voor verlies of schade ontstaan of voortgevloeid
      uit de schuld van de vervoerder zelf of de schuld van zijn ondergeschikten, niet bestaande uit een handeling,
      onachtzaamheid of nalatigheid als in het tweede lid onder a bedoeld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel383
  - number: '384'
    text: |-
      Het staat de vervoerder vrij geheel of gedeeltelijk afstand te doen van zijn uit de in het eerste lid van
      [artikel 382][ref1] genoemde artikelen of uit de artikelen [383][ref2], [388][ref3], [414 vierde lid][ref4] of
      [423][ref5] voortvloeiende rechten en ontheffingen van aansprakelijkheid of zijn uit deze artikelen voortvloeiende
      aansprakelijkheden en verplichtingen te vermeerderen, mits in geval van een vervoerovereenkomst onder cognossement
      deze afstand of deze vermeerdering blijkt uit het aan de afzender afgegeven cognossement.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel382
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel383
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel388
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel414
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Artikel423
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel384
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '382'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '383'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '388'
        hoofdstuk: II
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '414'
        hoofdstuk: II
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005034
        artikel: '423'
        hoofdstuk: II
        afdeling: '2'
  - number: '385'
    text: |-
      Niettegenstaande het eerste lid van [artikel 382][ref1] is een beding als daar bedoeld geldig, wanneer het
      betreft zaken, die door hun karakter of gesteldheid een bijzondere overeenkomst rechtvaardigen en welker vervoer
      moet geschieden onder omstandigheden of op voorwaarden, die een bijzondere overeenkomst rechtvaardigen. Het hier
      bepaalde geldt echter slechts, wanneer voor het vervoer van deze zaken geen cognossement, doch een blijkens zijn
      bewoordingen onverhandelbaar document is afgegeven en het niet betreft een gewone handelslading, verscheept bij
      gelegenheid van een gewone handelsverrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel382
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel385
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '382'
        hoofdstuk: II
        afdeling: '2'
  - number: '386'
    text: |-
      Niettegenstaande het eerste lid van [artikel 382][ref1] staat het de vervoerder en de afzender vrij in een
      vervoerovereenkomst enig beding, enige voorwaarde, enig voorbehoud of enige ontheffing op te nemen met betrekking
      tot de verplichtingen en aansprakelijkheden van de vervoerder of het schip voor het verlies of de schaden opgekomen
      aan de zaken of betreffende hun bewaring, verzorging of behandeling vóór het laden in en na het lossen uit het over
      zee vervoerende schip.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel382
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel386
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '382'
        hoofdstuk: II
        afdeling: '2'
  - number: '387'
    text: |-
      Voor zover de vervoerder aansprakelijk is wegens niet nakomen van de op hem uit hoofde van de [artikelen 378][ref1]
      en [379][ref2] rustende verplichtingen, heeft de afzender geen ander recht dan betaling van de in
      [artikel 388][ref3] genoemde of de met toepassing van [artikel 384][ref4] overeengekomen bedragen te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel378
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel379
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel388
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel384
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel387
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '378'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '379'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '388'
        hoofdstuk: II
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '384'
        hoofdstuk: II
        afdeling: '2'
  - number: '388.1'
    text: |-
      Tenzij de aard en de waarde van zaken zijn opgegeven door de afzender vóór hun inlading en deze opgave in
      het cognossement, indien dit is afgegeven, is opgenomen, is noch de vervoerder noch het schip in enig geval
      aansprakelijk voor enig verlies van of enige schade aan de zaken of met betrekking tot deze voor een bedrag
      hoger dan de tegenwaarde van 666,67 rekeneenheden per collo of eenheid, dan wel twee rekeneenheden per kilogram
      brutogewicht der verloren gegane of beschadigde zaken, waarbij het hoogste dezer bedragen in aanmerking moet worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel388
  - number: '388.2'
    text: |-
      Het totale verschuldigde bedrag wordt berekend met inachtneming van de waarde welke zaken als de ten vervoer
      ontvangene zouden hebben gehad zoals, ten tijde waarop en ter plaatse waar, zij zijn afgeleverd of zij hadden
      moeten zijn afgeleverd. De in dit lid genoemde waarde wordt berekend naar de koers op de goederenbeurs of, wanneer
      er geen dergelijke koers is, naar de gangbare marktwaarde of, wanneer ook deze ontbreekt, naar de normale waarde
      van zaken van dezelfde aard en hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel388
  - number: '388.3'
    text: |-
      Wanneer een laadkist, een laadbord of dergelijk vervoergerei is gebezigd om zaken bijeen te brengen, wordt iedere
      collo of eenheid, die volgens vermelding in het cognossement in dat vervoergerei is verpakt, beschouwd als een
      collo of eenheid als in het eerste lid bedoeld. Behalve in het geval hiervoor omschreven wordt dit vervoergerei als
      een collo of eenheid beschouwd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel388
  - number: '388.4'
    text: |-
      De rekeneenheid genoemd in dit artikel is het bijzondere trekkingsrecht zoals dat is omschreven door het
      Internationale Monetaire Fonds. De bedragen genoemd in het eerste lid worden omgerekend in Nederlands geld naar de
      koers van de dag, waarop de betaling wordt verricht. De waarde van het Nederlandse geld, uitgedrukt in bijzondere
      trekkingsrechten, wordt berekend volgens de waarderingsmethode die door het Internationale Monetaire Fonds op de
      dag van omrekening wordt toegepast voor zijn eigen verrichtingen en transacties.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel388
  - number: '388.5'
    text: |-
      Noch de vervoerder noch het schip kan zijn aansprakelijkheid met een beroep op dit artikel of het vierde lid van
      [artikel 414][ref1] beperken, wanneer bewezen is, dat de schade is ontstaan uit een handeling of nalaten van de
      vervoerder, geschied hetzij met het opzet schade te veroorzaken, hetzij roekeloos en met de wetenschap dat schade
      er waarschijnlijk uit zou voortvloeien.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel414
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel388
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '414'
        hoofdstuk: II
        afdeling: '2'
  - number: '388.6'
    text: |-
      Bij overeenkomst tussen de vervoerder, de kapitein of de agent van de vervoerder enerzijds en de afzender
      anderzijds, mogen andere maximumbedragen dan die, genoemd in het eerste lid, worden bepaald, mits deze bedragen in
      geval van een vervoerovereenkomst onder cognossement niet lager zijn dan de in het eerste lid genoemde.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel388
  - number: '388.7'
    text: |-
      Noch de vervoerder noch het schip is in enig geval aansprakelijk voor verlies of schade van of aan zaken of met
      betrekking tot deze, indien aard of waarde daarvan door de afzender opzettelijk verkeerdelijk is opgegeven en,
      indien een cognossement is afgegeven, daarin verkeerdelijk is opgenomen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel388
  - number: '389'
    text: |-
      Indien met betrekking tot een zaak hulploon, een bijdrage in avarij-grosse of een schadevergoeding uit hoofde van
      [artikel 488][ref1] is verschuldigd, wordt deze aangemerkt als een waardevermindering van die zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel488
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel389
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '488'
        hoofdstuk: II
        afdeling: '2'
  - number: '390.1'
    text: |-
      De tijd- of reisbevrachter is bevoegd de overeenkomst op te zeggen, wanneer hem door de vervrachter is medegedeeld
      dat het schip niet op de overeengekomen plaats of tijd te zijner beschikking is of zal kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel390
  - number: '390.2'
    text: |-
      Hij kan deze bevoegdheid slechts uitoefenen door binnen een redelijke, niet meer dan 48 uur durende, termijn na
      ontvangst van een mededeling, als bedoeld in het eerste lid, het in het vijfde lid genoemde bericht te verzenden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel390
  - number: '390.3'
    text: |-
      Indien bij gebreke van de ontvangst van een mededeling, als bedoeld in het eerste lid, het de bevrachter uit
      anderen hoofde bekend is, dat het schip niet op de overeengekomen plaats of tijd te zijner beschikking is of kan
      zijn, is hij, zonder dat enige ingebrekestelling is vereist, bevoegd de overeenkomst op te zeggen, doch slechts
      binnen een redelijke, niet meer dan 48 uur durende, termijn nadat hem dit bekend is geworden; gelijke bevoegdheid
      komt hem toe, indien hem na ontvangst van een mededeling, als bedoeld in het eerste lid, uit anderen hoofde bekend
      wordt, dat het schip op grond van andere omstandigheden dan welke de vervrachter tot zijn mededeling brachten, niet
      op de overeengekomen plaats of tijd te zijner beschikking is of kan zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel390
  - number: '390.4'
    text: |-
      De in dit artikel genoemde termijn wordt geschorst op die zaterdagen, zondagen en plaatselijke feestdagen, waarop
      ten kantore van de bevrachter in het geheel niet wordt gewerkt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel390
  - number: '390.5'
    text: |-
      De opzegging geschiedt door telegram of bericht per telex of door enig ander spoedbericht, waarvan de ontvangst
      duidelijk aantoonbaar is en de overeenkomst eindigt op het ogenblik van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel390
  - number: '391'
    text: |-
      De afzender is verplicht de vervoerder de schade te vergoeden die deze lijdt doordat de overeengekomen zaken, door
      welke oorzaak dan ook, niet op de overeengekomen plaats en tijd te zijner beschikking zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel391
  - number: '392.1'
    text: Alvorens zaken ter beschikking van de vervoerder zijn gesteld, is de afzender bevoegd de overeenkomst op te zeggen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel392
  - number: '392.2'
    text: |-
      Zijn bij het verstrijken van de tijd, waarbinnen de zaken ter beschikking van de vervoerder moeten zijn gesteld,
      verlengd met de overligtijd, door welke oorzaak dan ook, in het geheel geen zaken ter beschikking van de
      vervoerder, dan is deze, zonder dat enige ingebrekestelling is vereist, bevoegd de overeenkomst op te zeggen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel392
  - number: '392.3'
    text: |-
      Zijn bij het verstrijken van de in het tweede lid bedoelde tijd, door welke oorzaak dan ook, de overeengekomen
      zaken slechts gedeeltelijk ter beschikking van de vervoerder, dan is deze, zonder dat enige ingebrekestelling is
      vereist, bevoegd de overeenkomst op te zeggen dan wel de reis te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel392
  - number: '392.4'
    text: |-
      De opzegging geschiedt door telegram of bericht per telex of door enig ander spoedbericht, waarvan de ontvangst
      duidelijk aantoonbaar is en de overeenkomst eindigt op het ogenblik van ontvangst daarvan, doch niet vóór lossing
      van de zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel392
  - number: '392.5'
    text: |-
      Onder voorbehoud van het derde lid van [artikel 383][ref1] is de afzender verplicht de vervoerder de schade te
      vergoeden die deze lijdt tengevolge van de opzegging of van de aanvaarding van de reis.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel383
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel392
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '383'
        hoofdstuk: II
        afdeling: '2'
  - number: '392.6'
    text: Dit artikel is niet van toepassing in geval van tijdbevrachting.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel392
  - number: '393.1'
    text: |-
      In geval van reisbevrachting is de vervrachter tegen zekerheidstelling voor wat hij van de bevrachter heeft
      te vorderen, op diens verlangen verplicht de reis te aanvaarden met een gedeelte der overeengekomen zaken. De
      bevrachter is verplicht de vervrachter de dientengevolge geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel393
  - number: '393.2'
    text: |-
      De vervrachter is bevoegd in plaats van de ontbrekende zaken andere aan te nemen. Hij is niet gehouden de
      vracht, die hij voor het vervoer van deze zaken ontvangt, met de bevrachter te verrekenen, behalve voor zover hij
      zijnerzijds van de bevrachter vergoeding van door hem geleden schade heeft geïnd of gevorderd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel393
  - number: '394.1'
    text: |-
      De afzender is verplicht de vervoerder omtrent de zaken alsmede omtrent de behandeling daarvan tijdig al die
      opgaven te doen, waartoe hij in staat is of behoort te zijn, en waarvan hij weet of behoort te weten, dat zij voor
      de vervoerder van belang zijn, tenzij hij mag aannemen dat de vervoerder deze gegevens kent.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel394
  - number: '394.2'
    text: |-
      De vervoerder is niet gehouden, doch wel gerechtigd, te onderzoeken of de hem gedane opgaven juist en volledig
      zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel394
  - number: '394.3'
    text: |-
      Is bij het verstrijken van de tijd, waarbinnen de zaken ter beschikking van de vervoerder moeten zijn gesteld,
      door welke oorzaak dan ook, niet of slechts gedeeltelijk voldaan aan de in het eerste lid van dit artikel genoemde
      verplichting van de afzender, dan zijn, behalve in het geval van tijdbevrachting, het tweede, derde, vierde en
      vijfde lid van [artikel 392][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel392
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel394
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '392'
        hoofdstuk: II
        afdeling: '2'
  - number: '395.1'
    text: |-
      De afzender is verplicht de vervoerder de schade te vergoeden die deze lijdt doordat, door welke oorzaak dan
      ook, niet naar behoren aanwezig zijn de documenten en inlichtingen die van de zijde van de afzender vereist
      zijn voor het vervoer dan wel ter voldoening aan vóór de aflevering van de zaken te vervullen douane- en andere
      formaliteiten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel395
  - number: '395.2'
    text: |-
      De vervoerder is verplicht redelijke zorg aan te wenden dat de documenten, die in zijn handen zijn gesteld,
      niet verloren gaan of onjuist worden behandeld. Een door hem ter zake verschuldigde schadevergoeding zal die,
      verschuldigd uit hoofde van de [artikelen 387][ref1], [388][ref2] en [389][ref3] in geval van verlies van de zaken,
      niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel387
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel388
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel389
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel395
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '387'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '388'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '389'
        hoofdstuk: II
        afdeling: '2'
  - number: '395.3'
    text: |-
      De vervoerder is niet gehouden, doch wel gerechtigd, te onderzoeken of de hem gedane opgaven juist en volledig
      zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel395
  - number: '395.4'
    text: |-
      Zijn bij het verstrijken van de tijd waarbinnen de in het eerste lid genoemde documenten en inlichtingen aanwezig
      moeten zijn, deze, door welke oorzaak dan ook, niet naar behoren aanwezig, dan zijn, behalve in het geval van
      tijdbevrachting, het tweede, derde, vierde en vijfde lid van [artikel 392][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel392
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel395
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '392'
        hoofdstuk: II
        afdeling: '2'
  - number: '396.1'
    text: |-
      Wanneer vóór of bij de aanbieding van de zaken aan de vervoerder omstandigheden aan de zijde van een der partijen
      zich opdoen of naar voren komen, die haar wederpartij bij het sluiten van de overeenkomst niet behoefde te
      kennen, doch die, indien zij haar wel bekend waren geweest, redelijkerwijs voor haar grond hadden opgeleverd de
      vervoerovereenkomst niet of op andere voorwaarden aan te gaan, is deze wederpartij bevoegd de overeenkomst op te
      zeggen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel396
  - number: '396.2'
    text: |-
      De opzegging geschiedt door telegram, bericht per telex of door enig ander spoedbericht, waarvan de ontvangst
      duidelijk aantoonbaar is en de overeenkomst eindigt op het ogenblik van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel396
  - number: '396.3'
    text: |-
      Naar maatstaven van redelijkheid en billijkheid zijn partijen na opzegging der overeenkomst verplicht elkaar de
      daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel396
  - number: '397.1'
    text: |-
      De afzender is verplicht de vervoerder de schade te vergoeden, die materiaal, dat hij deze ter beschikking stelde
      of zaken die deze ten vervoer ontving dan wel de behandeling daarvan, de vervoerder berokkenden, behalve voor zover
      deze schade is veroorzaakt door een omstandigheid die een zorgvuldig afzender van de ten vervoer ontvangen zaken
      niet heeft kunnen vermijden en waarvan zulk een afzender de gevolgen niet heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel397
  - number: '397.2'
    text: |-
      Dit artikel laat de [artikelen 383 derde lid][ref1], [398][ref2] en [423][ref3], alsmede de bepalingen nopens
      avarij-grosse onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel383
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel398
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel423
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel397
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '383'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '398'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '423'
        hoofdstuk: II
        afdeling: '2'
  - number: '398.1'
    text: |-
      Ten vervoer ontvangen zaken, die een zorgvuldig vervoerder, indien hij geweten zou hebben dat zij na hun
      inontvangstneming gevaar zouden kunnen opleveren, met het oog daarop niet ten vervoer zou hebben willen ontvangen,
      mogen door hem op ieder ogenblik en op iedere plaats worden gelost, vernietigd dan wel op andere wijze onschadelijk
      gemaakt. Ten aanzien van ten vervoer ontvangen zaken, waarvan de vervoerder de gevaarlijkheid heeft gekend, geldt
      hetzelfde doch slechts dan wanneer zij onmiddellijk dreigend gevaar opleveren. De vervoerder is terzake geen
      enkele schadevergoeding verschuldigd en de afzender is aansprakelijk voor alle kosten en schaden voor de vervoerder
      voortvloeiende uit de aanbieding ten vervoer, uit het vervoer of uit de maatregelen zelf.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel398
  - number: '398.2'
    text: |-
      Door het treffen van de in het eerste lid bedoelde maatregel eindigt de overeenkomst met betrekking tot de daar
      genoemde zaken, doch, indien deze alsnog worden gelost, eerst na deze lossing. De vervoerder verwittigt zo mogelijk
      de afzender, degeen aan wie de zaken moeten worden afgeleverd en degeen, aan wie hij volgens de bepalingen van
      een mogelijkerwijs afgegeven cognossement bericht van aankomst van het schip moet zenden. Dit lid is niet van
      toepassing met betrekking tot zaken die de vervoerder na het treffen van de in het eerste lid bedoelde maatregel
      alsnog naar hun bestemming vervoert.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel398
  - number: '398.3'
    text: |-
      Indien zaken na beëindiging van de overeenkomst alsnog in feite worden afgeleverd, wordt vermoed, dat zij zich op
      het ogenblik van beëindiging van de overeenkomst bevonden in de staat, waarin zij feitelijk zijn afgeleverd; worden
      zij niet afgeleverd, dan wordt vermoed, dat zij op het ogenblik van beëindiging van de overeenkomst verloren zijn
      gegaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel398
  - number: '398.4'
    text: |-
      Indien de afzender na feitelijke aflevering een zaak niet naar haar bestemming vervoert, wordt het verschil tussen
      de waarden ter bestemming en ter plaatse van de aflevering, als bedoeld in de tweede volzin van het tweede lid
      van [artikel 388][ref1], aangemerkt als waardevermindering van die zaak. Vervoert de afzender een zaak na de
      feitelijke aflevering alsnog naar haar bestemming, dan worden de kosten, die hij te dien einde maakt, aangemerkt
      als waardevermindering van die zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel388
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel398
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '388'
        hoofdstuk: II
        afdeling: '2'
  - number: '398.5'
    text: |-
      Op de feitelijke aflevering is het tussen partijen overeengekomene alsmede het in deze afdeling nopens de
      aflevering van zaken bepaalde van toepassing, met dien verstande, dat deze feitelijke aflevering niet op grond van
      de eerste zin van het eerste lid of op grond van het tweede lid van artikel 484 de vracht verschuldigd doet zijn.
      De [artikelen 490][ref1] en [491][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel490
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel491
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel398
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '490'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '491'
        hoofdstuk: II
        afdeling: '2'
  - number: '398.6'
    text: |-
      Dit artikel laat [artikel 423][ref1], alsmede de bepalingen nopens avarij-grosse onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel423
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel398
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '423'
        hoofdstuk: II
        afdeling: '2'
  - number: '398.7'
    text: Nietig is ieder beding, waarbij van het eerste lid van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel398
  - number: '399.1'
    text: |-
      Na de zaken ontvangen en aangenomen te hebben, moet de vervoerder, de kapitein of de agent van de vervoerder op
      verlangen van de afzender aan deze een cognossement afgeven, dat onder meer vermeldt:
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel399
  - number: 399.1.a
    text: |-
      de voornaamste voor identificatie van de zaken nodige merken, zoals deze, voor de inlading van deze zaken is
      begonnen, door de afzender schriftelijk zijn opgegeven, mits deze merken zijn gestempeld of anderszins duidelijk
      zijn aangebracht op de onverpakte zaken of op de kisten of verpakkingen, die de zaken inhouden en wel zodanig, dat
      zij in normale omstandigheden tot het einde van de reis leesbaar zullen blijven;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel399
  - number: 399.1.b
    text: |-
      òf het aantal der colli of het stuktal, òf de hoeveelheid òf het gewicht, al naar gelang der omstandigheden, zoals
      zulks door de afzender schriftelijk is opgegeven;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel399
  - number: 399.1.c
    text: de uiterlijk zichtbare staat en gesteldheid der zaken;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel399
  - number: '399.2'
    text: |-
      Als de zaken ingeladen zijn, zal het cognossement, dat de vervoerder, kapitein of agent van de vervoerder aan
      de afzender afgeeft, indien deze dit verlangt, de vermelding "geladen" bevatten, mits de afzender, indien hij
      vooraf enig op die zaken rechtgevend document heeft ontvangen, dit tegen afgifte van het "geladen"-cognossement
      teruggeeft. De vervoerder, kapitein of agent van de vervoerder heeft eveneens het recht in de laadhaven op het
      oorspronkelijk afgegeven document de naam van het schip of van de schepen, aan boord waarvan de zaken werden
      geladen, en de datum of de data van inlading aan te tekenen, in welk geval het aldus aangevulde document, mits
      inhoudende de in dit artikel vermelde bijzonderheden, als een "geladen"-cognossement in de zin van dit artikel
      wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel399
  - number: '410'
    text: |-
      Indien een vervoerovereenkomst is gesloten en bovendien een cognossement is afgegeven, wordt, behoudens
      [artikel 441 tweede lid, tweede volzin][ref1], de rechtsverhouding tussen de vervoerder en de afzender door de
      bedingen van de vervoerovereenkomst en niet door die van dit cognossement beheerst. Behoudens het in artikel 441
      eerste lid gestelde vereiste van houderschap van het cognossement, strekt dit hun dan slechts tot bewijs van de
      ontvangst der zaken door de vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel441
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel410
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '441'
        hoofdstuk: II
        afdeling: '2'
  - number: '411'
    text: |-
      De afzender wordt geacht ten behoeve van de vervoerder in te staan voor de juistheid op het ogenblik van de in
      ontvangstneming van de door hem opgegeven merken, getal, hoeveelheid en gewicht, en de afzender zal de vervoerder
      schadeloos stellen voor alle verliezen, schaden en kosten, ontstaan ten gevolge van onjuistheden in de opgave
      van deze bijzonderheden. Het recht van de vervoerder op dergelijke schadeloosstelling beperkt in genen dele zijn
      aansprakelijkheid en zijn verbintenissen, zoals zij uit de vervoerovereenkomst voortvloeien, tegenover elke andere
      persoon dan de afzender.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel411
  - number: '412.1'
    text: |-
      Het cognossement wordt gedateerd en door de vervoerder ondertekend en vermeldt de voorwaarden waarop het vervoer
      plaatsvindt, alsmede de plaats waar en de persoon aan wie de zaken moeten worden afgeleverd. Deze wordt, ter keuze
      van de afzender, aangegeven hetzij bij name of andere aanduiding, hetzij als order van de afzender of van een
      ander, hetzij als toonder.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel412
  - number: '412.2'
    text: De enkele woorden "aan order" worden geacht de order van de afzender aan te geven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel412
  - number: '413'
    text: |-
      Het cognossement wordt, tenzij het op naam is gesteld, afgegeven in één of meer exemplaren. De verhandelbare
      exemplaren, waarin is vermeld hoeveel van deze exemplaren in het geheel zijn afgegeven, gelden alle voor één en één
      voor alle. Niet verhandelbare exemplaren moeten als zodanig worden aangeduid.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel413
  - number: '414.1'
    text: |-
      Tegenbewijs tegen het cognossement wordt niet toegelaten, wanneer het is overgedragen aan een derde te goeder
      trouw.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel414
  - number: '414.2'
    text: |-
      Indien in het cognossement de clausule: "inhoud, hoedanigheid, aantal, gewicht of maat onbekend", of enige andere
      clausule van dergelijke strekking is opgenomen, binden zodanige in het cognossement voorkomende vermeldingen
      omtrent de zaken de vervoerder niet, tenzij bewezen wordt, dat hij de inhoud of de hoedanigheid der zaken heeft
      gekend of had behoren te kennen of dat de zaken hem toegeteld, toegewogen of toegemeten zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel414
  - number: '414.3'
    text: |-
      Een cognossement, dat de uiterlijk zichtbare staat of gesteldheid van de zaak niet vermeldt, levert, behoudens
      tegenbewijs dat ook jegens een derde mogelijk is, een vermoeden op dat de vervoerder die zaak voor zover uiterlijk
      zichtbaar in goede staat of gesteldheid heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel414
  - number: '414.4'
    text: |-
      De in het cognossement opgenomen opgave, bedoeld in [artikel 388 eerste lid][ref1], schept behoudens tegenbewijs
      een vermoeden, doch bindt niet de vervoerder die haar kan betwisten.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel388
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '388'
        hoofdstuk: II
        afdeling: '2'
  - number: '415.1'
    text: |-
      Verwijzingen in het cognossement worden geacht slechts die bedingen daarin in te voegen, die voor degeen, jegens
      wie daarop een beroep wordt gedaan, duidelijk kenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel415
  - number: '415.2'
    text: |-
      Een dergelijk beroep is slechts mogelijk voor hem, die op schriftelijk verlangen van degeen jegens wie dit beroep
      kan worden gedaan of wordt gedaan, aan deze onverwijld die bedingen heeft doen toekomen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel415
  - number: '415.3'
    text: Nietig is ieder beding, waarbij van het tweede lid van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel415
  - number: '416'
    text: |-
      Een cognossement aan order wordt geleverd op de wijze als aangegeven in [afdeling 2 van Titel 4 van Boek 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel416
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '417'
    text: |-
      Levering van het cognossement vóór de aflevering van de daarin vermelde zaken door de vervoerder geldt als levering
      van die zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel417
  - number: '418'
    text: |-
      De vervoerder is verplicht de plek van inlading en lossing tijdig aan te wijzen; in geval van tijdbevrachting is
      echter [artikel 380][ref1] van toepassing en in geval van reisbevrachting [artikel 419][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel380
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel419
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel418
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '380'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '419'
        hoofdstuk: II
        afdeling: '2'
  - number: '419.1'
    text: In geval van reisbevrachting is de bevrachter verplicht de plek van inlading en lossing tijdig aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel419
  - number: '419.2'
    text: |-
      Hij moet daartoe aanwijzen een gebruikelijke plek, die terstond of binnen redelijke tijd beschikbaar is, waar het
      schip veilig kan komen, liggen, laden of lossen en waarvandaan het veilig kan vertrekken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel419
  - number: '419.3'
    text: |-
      Wanneer de bevrachter niet aan deze verplichting voldoet of de bevrachters, als er meer zijn, niet eenstemmig zijn
      in de aanwijzing, is de vervrachter zonder dat enige aanmaning is vereist verplicht zelf de plek van inlading of
      lossing aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel419
  - number: '419.4'
    text: |-
      Indien de bevrachter meer dan één plek aanwijst, geldt de tijd nodig voor het verhalen als gebruikte laad- of
      lostijd. De kosten van verhalen zijn voor zijn rekening.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel419
  - number: '419.5'
    text: |-
      De bevrachter staat er voor in, dat het schip op de plek, die hij op grond van het eerste lid ter inlading of
      lossing aanwijst, veilig kan komen, liggen, laden of lossen en daarvandaan veilig kan vertrekken. Indien deze plek
      blijkt niet aan deze vereisten te voldoen, is de bevrachter slechts in zoverre niet aansprakelijk als de kapitein,
      door de hem gegeven aanwijzing op te volgen, onredelijk handelde.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel419
  - number: '420'
    text: |-
      Wanneer in geval van reisbevrachting de bevrachter de bevoegdheid heeft laad- of loshaven nader aan te wijzen, is
      [artikel 419][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel419
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel420
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '419'
        hoofdstuk: II
        afdeling: '2'
  - number: '421'
    text: Behalve in geval van bevrachting is de vervoerder verplicht de zaken aan boord van het schip te laden en te stuwen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel421
  - number: '422.1'
    text: Voor zover de vervoerder verplicht is tot laden, is hij gehouden zulks in de overeengekomen laadtijd te doen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel422
  - number: '422.2'
    text: |-
      Voor zover de afzender verplicht is tot laden of stuwen, staat hij er voor in dat zulks in de overeengekomen
      laadtijd geschiedt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel422
  - number: '422.3'
    text: |-
      Werd geen laadtijd vastgesteld, dan behoort de inlading te geschieden zo snel als ter plekke voor een schip als het
      betrokken schip gebruikelijk of redelijk is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel422
  - number: '422.4'
    text: |-
      Bepaalt de vervoerovereenkomst overliggeld, doch niet de overligtijd, dan wordt deze tijd vastgesteld op acht
      opeenvolgende etmalen of, als op de ligplek een ander aantal redelijk of gebruikelijk is, op dit aantal.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel422
  - number: '422.5'
    text: De wettelijke bepalingen omtrent boetebedingen zijn niet van toepassing op bedingen met betrekking tot overliggeld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel422
  - number: '422.6'
    text: |-
      Schuldenaren van overliggeld en een mogelijkerwijs uit hoofde van het tweede lid verschuldigde schadevergoeding
      zijn tot betaling daarvan hoofdelijk verbonden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel422
  - number: '423.1'
    text: |-
      Onder een vervoerovereenkomst onder cognossement mogen zaken van ontvlambare, explosieve of gevaarlijke aard, tot
      de inlading waarvan de vervoerder, de kapitein of de agent van de vervoerder geen toestemming zou hebben gegeven,
      wanneer hij de aard of de gesteldheid daarvan had gekend, te allen tijde vóór de lossing door de vervoerder op
      iedere plaats worden gelost of vernietigd of onschadelijk gemaakt zonder schadevergoeding, en de afzender van deze
      zaken is aansprakelijk voor alle schade en onkosten, middellijk of onmiddellijk voortgevloeid of ontstaan uit het
      inladen daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel423
  - number: '423.2'
    text: |-
      Indien onder een vervoerovereenkomst onder cognossement enige zaak, als bedoeld in het eerste lid, ingeladen met
      voorkennis en toestemming van de vervoerder, een gevaar wordt voor het schip of de lading, mag zij evenzo door de
      vervoerder worden gelost of vernietigd of onschadelijk gemaakt zonder enige aansprakelijkheid van de vervoerder,
      tenzij voor avarij-grosse, indien daartoe gronden bestaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel423
  - number: '424.1'
    text: |-
      Behalve in geval van tijd- of reisbevrachting is de vervoerder wanneer, nadat de inlading een aanvang heeft
      genomen, het schip vergaat of zodanig beschadigd blijkt te zijn, dat het schip het herstel, nodig voor de
      uitvoering van de overeenkomst, niet waard is of dat dit herstel binnen redelijke tijd niet mogelijk is, na lossing
      van de zaken bevoegd de overeenkomst te beëindigen, mits hij dit zo spoedig mogelijk doet.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel424
  - number: '424.2'
    text: |-
      Vermoed wordt dat het vergaan of de beschadiging van het schip is te wijten aan een omstandigheid, die voor
      rekening van de vervoerder komt; voor rekening van de vervoerder komen die omstandigheden, die in geval van
      beschadiging van door hem vervoerde zaken voor zijn rekening komen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel424
  - number: '424.3'
    text: |-
      De vervoerder verwittigt, zo mogelijk, de afzender, degeen aan wie de zaken moeten worden afgeleverd en degeen
      aan wie hij volgens de bepalingen van een mogelijkerwijs afgegeven cognossement bericht van aankomst van het schip
      moet zenden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel424
  - number: '424.4'
    text: |-
      Het derde, het vierde en het vijfde lid van [artikel 398][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel398
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel424
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '398'
        hoofdstuk: II
        afdeling: '2'
  - number: '425.1'
    text: |-
      In geval van tijd- of reisbevrachting is ieder der partijen, mits zij dit zo spoedig mogelijk doet, bevoegd de
      overeenkomst geheel of met betrekking tot een gedeelte der zaken op te zeggen, wanneer het schip, zonder dat
      het vergaan is, zodanig beschadigd blijkt te zijn, dat het schip het herstel, nodig voor de uitvoering van de
      overeenkomst, niet waard is of dat dit herstel binnen redelijke tijd niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel425
  - number: '425.2'
    text: |-
      De reisbevrachter komt de hem in het eerste lid van dit artikel toegekende bevoegdheid ten aanzien van reeds aan
      boord ontvangen zaken niet toe, indien de vervrachter, zodra hem dit redelijkerwijs mogelijk was, heeft verklaard
      dat hij deze zaken, zij het niet in het bevrachte schip, ondanks de beëindiging van de overeenkomst naar hun
      bestemming zal vervoeren; zulk vervoer wordt vermoed op grond van de oorspronkelijke overeenkomst plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel425
  - number: '425.3'
    text: |-
      De opzegging geschiedt door telegram of bericht per telex of door enig ander spoedbericht, waarvan de ontvangst
      duidelijk aantoonbaar is en de overeenkomst eindigt op het ogenblik van ontvangst daarvan, doch ten aanzien van
      reeds aan boord ontvangen zaken, eerst na lossing van die zaken. Een in een dergelijk telegram of bericht vervatte
      mededeling, dat de vervrachter zaken alsnog, doch niet in het bevrachte schip, naar hun bestemming zal vervoeren,
      houdt met betrekking tot die zaken opzegging van de overeenkomst in.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel425
  - number: '425.4'
    text: |-
      Ten aanzien van reeds ten vervoer ontvangen zaken wordt vermoed, dat de beschadiging van het schip is te wijten
      aan een omstandigheid, die voor rekening van de vervrachter komt; voor rekening van de vervrachter komen die
      omstandigheden, die in geval van beschadiging van door hem vervoerde zaken voor zijn rekening komen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel425
  - number: '425.5'
    text: |-
      Het derde, het vierde en het vijfde lid van artikel 398 zijn van toepassing met dien verstande, dat ingeval van
      tijdbevrachting vracht verschuldigd blijft tot op het tijdstip van de lossing der zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel425
  - number: '426.1'
    text: |-
      In geval van tijd- of reisbevrachting eindigt de overeenkomst met het vergaan van het schip. In geval van
      langdurige tijdingloosheid wordt vermoed, dat het schip is vergaan te 2400 uur Universele Tijd van de dag, waarop
      het laatste bericht is ontvangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel426
  - number: '426.2'
    text: |-
      Ten aanzien van reeds ten vervoer ontvangen zaken wordt vermoed, dat het vergaan van het schip is te wijten
      aan een omstandigheid, die voor rekening van de vervrachter komt; voor rekening van de vervrachter komen die
      omstandigheden, die in geval van beschadiging van door hem vervoerde zaken voor zijn rekening komen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel426
  - number: '426.3'
    text: |-
      Vervoert de vervrachter ondanks het vergaan van het schip zaken die reeds aan boord waren ontvangen alsnog naar hun
      bestemming, dan wordt in geval van reisbevrachting dit vervoer vermoed op grond van de oorspronkelijke overeenkomst
      plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel426
  - number: '426.4'
    text: De vervrachter verwittigt de bevrachter zo spoedig als dit mogelijk is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel426
  - number: '426.5'
    text: |-
      Het derde, het vierde en het vijfde lid van [artikel 398][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel398
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel426
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '398'
        hoofdstuk: II
        afdeling: '2'
  - number: '440.1'
    text: |-
      De afzender - of, indien een cognossement is afgegeven, uitsluitend de in [artikel 441][ref1] bedoelde houder
      daarvan en dan alleen tegen afgifte van alle verhandelbare exemplaren van dit cognossement - is bevoegd, voor zover
      de vervoerder hieraan redelijkerwijs kan voldoen, aflevering van ten vervoer ontvangen zaken of, indien daarvoor
      een cognossement is afgegeven, van alle daarop vermelde zaken gezamenlijk, vóór de aankomst ter bestemmingsplaats
      te verlangen, mits hij de vervoerder en de belanghebbenden bij de overige lading ter zake schadeloos stelt. Hij
      is verplicht tot bijdragen in een avarij-grosse, wanneer de avarij-grosse handeling plaatshad met het oog op een
      omstandigheid, waarvan reeds vóór de aflevering is gebleken.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel441
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel440
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '441'
        hoofdstuk: II
        afdeling: '2'
  - number: '440.2'
    text: Hij kan dit recht niet uitoefenen, wanneer door de voortijdige aflevering de reis zou worden vertraagd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel440
  - number: '440.3'
    text: |-
      Zaken, die ingevolge het eerste lid zijn afgeleverd, worden aangemerkt als ter bestemming afgeleverde zaken en de
      bepalingen van deze afdeling nopens de aflevering van zaken, alsmede de [artikelen 490][ref1] en [491][ref2] zijn
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel490
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel491
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel440
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '490'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '491'
        hoofdstuk: II
        afdeling: '2'
  - number: '441.1'
    text: |-
      Indien een cognossement is afgegeven, heeft uitsluitend de regelmatige houder daarvan, tenzij hij niet op
      rechtmatige wijze houder is geworden, jegens de vervoerder onder het cognossement het recht aflevering van de
      zaken overeenkomstig de op de vervoerder rustende verplichtingen te vorderen; daarbij is [artikel 387][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel387
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel441
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '387'
        hoofdstuk: II
        afdeling: '2'
  - number: '441.2'
    text: |-
      Jegens de houder van het cognossement, die niet de afzender was, is de vervoerder onder cognossement gehouden
      aan en kan hij een beroep doen op de bedingen van dit cognossement. Jegens iedere houder van het cognossement,
      kan hij de uit het cognossement duidelijk kenbare rechten tot betaling geldend maken. Jegens de houder van het
      cognossement, die ook de afzender was, kan de vervoerder zich bovendien op de bedingen van de vervoerovereenkomst
      en op zijn persoonlijke verhouding tot de afzender beroepen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel441
  - number: '442.1'
    text: |-
      Indien bij toepassing van [artikel 461][ref1] verscheidene personen als vervoerder onder het cognossement moeten
      worden aangemerkt zijn dezen jegens de in [artikel 441][ref2] eerste lid bedoelde cognossementhouder hoofdelijk
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel461
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel441
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel442
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '461'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '441'
        hoofdstuk: II
        afdeling: '2'
  - number: '442.2'
    text: |-
      In het in het eerste lid genoemde geval is ieder der vervoerders gerechtigd de uit het cognossement blijkende
      rechten jegens de cognossementhouder uit te oefenen en is deze jegens iedere vervoerder gekweten tot op het
      opeisbare bedrag dat hij op grond van het cognossement aan één hunner heeft voldaan. [Titel 7 van Boek 3][ref1] is
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel442
    references:
      - id: ref1
        bwb_id: BWBR0005291
  - number: '460'
    text: |-
      Van de houders van verschillende exemplaren van hetzelfde cognossement heeft hij het beste recht, die houder is van
      het exemplaar, waarvan ná de gemeenschappelijke voorman, die houder was van al die exemplaren, het eerst een ander
      houder is geworden te goeder trouw en onder bezwarende titel.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel460
  - number: '461.1'
    text: |-
      Onverminderd de overige leden van dit artikel worden als vervoerder onder het cognossement aangemerkt hij die het
      cognossement ondertekende of voor wie een ander dit ondertekende alsmede hij wiens formulier voor het cognossement
      is gebezigd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel461
  - number: '461.2'
    text: |-
      Indien de kapitein of een ander voor hem het cognossement ondertekende, wordt naast degene genoemd in het eerste
      lid, die tijd- of reisbevrachter, die vervoerder is bij de laatste overeenkomst in de keten der exploitatie-
      overeenkomsten als bedoeld in [afdeling 1 van titel 5][ref1], als vervoerder onder het cognossement aangemerkt.
      Indien het schip in rompbevrachting is uitgegeven wordt naast deze eventuele tijd- of reisbevrachter ook de
      laatste rompbevrachter als vervoerder onder het cognossement aangemerkt. Is het schip niet in rompbevrachting
      uitgegeven dan wordt naast de hier genoemde eventuele tijd- of reisbevrachter ook de reder als vervoerder onder het
      cognossement aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel461
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '1'
  - number: '461.3'
    text: |-
      In afwijking van de vorige leden wordt uitsluitend de laatste rompbevrachter, onderscheidenlijk de reder,
      als vervoerder onder het cognossement aangemerkt indien het cognossement uitsluitend deze rompbevrachter,
      onderscheidenlijk de reder, uitdrukkelijk als zodanig aanwijst en, in geval van aanwijzing van de rompbevrachter,
      bovendien diens identiteit uit het cognossement duidelijk kenbaar is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel461
  - number: '461.4'
    text: |-
      Dit artikel laat het tweede lid van [artikel 262][ref1] onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel262
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel461
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '262'
        hoofdstuk: II
        afdeling: '2'
  - number: '461.5'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel461
  - number: '462.1'
    text: |-
      Het eerste lid van artikel 461 vindt geen toepassing indien een daar als vervoerder onder het cognossement
      aangemerkte persoon bewijst dat hij die het cognossement voor hem ondertekende daarbij de grenzen zijner
      bevoegdheid overschreed of dat het formulier zonder zijn toestemming is gebezigd. Desalniettemin wordt een in
      het eerste lid van [artikel 461][ref1] bedoelde persoon als vervoerder onder het cognossement aangemerkt, indien
      de houder van het cognossement bewijst dat op het ogenblik van uitgifte van het cognossement, op grond van een
      verklaring of gedraging van hem voor wie is ondertekend of wiens formulier is gebezigd, redelijkerwijze mocht
      worden aangenomen, dat hij die ondertekende daartoe bevoegd was of dat het formulier met toestemming was gebezigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel461
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel462
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '461'
        hoofdstuk: II
        afdeling: '2'
  - number: '462.2'
    text: |-
      In afwijking van het eerste lid wordt de rederij als vervoerder onder het cognossement aangemerkt indien haar
      boekhouder door ondertekening van het cognossement de grenzen zijner bevoegdheid overschreed, doch zij wordt
      niet gebonden jegens de eerste houder van het cognossement die op het ogenblik van uitgifte daarvan wist dat de
      boekhouder de grenzen zijner bevoegdheid overschreed.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel462
  - number: '462.3'
    text: |-
      Een beroep op het tweede lid van [artikel 461][ref1] is mogelijk ook indien de kapitein door ondertekening van
      het cognossement of door een ander de bevoegdheid te geven dit namens hem te ondertekenen, de grenzen zijner
      bevoegdheid overschreed, doch dergelijk beroep staat niet open aan de eerste houder van het cognossement die op het
      ogenblik van uitgifte daarvan wist dat de kapitein de grenzen zijner bevoegdheid overschreed.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel461
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel462
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '461'
        hoofdstuk: II
        afdeling: '2'
  - number: '462.4'
    text: |-
      Het derde lid vindt eveneens toepassing indien hij die namens de kapitein het cognossement ondertekende daarbij de
      grenzen zijner bevoegdheid overschreed.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel462
  - number: '480.1'
    text: |-
      Is een vervrachter ingevolge [artikel 461][ref1] tot meer gehouden dan waartoe hij uit hoofde van zijn bevrachting
      is verplicht of ontving hij minder dan waartoe hij uit dien hoofde is gerechtigd, dan heeft hij - mits de
      ondertekening van het cognossement of de afgifte van het formulier plaatsvond krachtens het in de bevrachting
      bepaalde, dan wel op verzoek van de bevrachter - deswege op deze laatste verhaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel461
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel480
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '461'
        hoofdstuk: II
        afdeling: '2'
  - number: '480.2'
    text: Hetzelfde geldt voor een ingevolge het eerste lid aangesproken bevrachter, die op zijn beurt vervrachter is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel480
  - number: '481.1'
    text: |-
      De houder van het cognossement, die zich tot ontvangst van de zaken heeft aangemeld, is verplicht, voordat hij deze
      heeft ontvangen, het cognossement van kwijting te voorzien en aan de vervoerder af te geven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel481
  - number: '481.2'
    text: |-
      Hij is gerechtigd het cognossement tot zekerheid der afgifte daarvan bij een, in geval van geschil op verzoek van
      de meest gerede partij door de rechter aan te wijzen, derde in bewaring te geven totdat de zaken afgeleverd zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel481
  - number: '482.1'
    text: |-
      Een door de vervoerder na intrekking van het cognossement afgegeven document dat de houder daarvan recht geeft op
      aflevering van in dat cognossement genoemde zaken, wordt met betrekking tot deze zaken met het cognossement gelijk
      gesteld. Het cognossement wordt vermoed van het hier bedoelde document deel uit te maken. Hij die dit document
      ondertekende of voor wie een ander dit ondertekende, noch hij wiens formulier werd gebruikt, wordt door het blote
      feit van deze ondertekening of dit gebruik als vervoerder onder het cognossement aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel482
  - number: '482.2'
    text: |-
      Tenzij in documenten als bedoeld in het eerste lid anders is bepaald, zijn de houders daarvan hoofdelijk verbonden
      voor de verbintenissen die uit het vervoer van de onder het cognossement vervoerde zaken voor de houder van dat
      cognossement voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel482
  - number: '483.1'
    text: Behalve in geval van bevrachting is de vervoerder verplicht de zaken uit het schip te lossen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel483
  - number: '483.2'
    text: |-
      Op de lossing van de zaken vindt [artikel 422][ref1] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel422
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel483
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '422'
        hoofdstuk: II
        afdeling: '2'
  - number: '484.1'
    text: |-
      De vracht is verschuldigd na aflevering van de zaken ter bestemming of ter plaatse, waar de vervoerder hen met
      inachtneming van [artikel 440][ref1] afleverde. Is de vracht bepaald naar gewicht of omvang der zaken, dan wordt
      hij berekend naar deze gegevens bij aflevering.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel440
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel484
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '440'
        hoofdstuk: II
        afdeling: '2'
  - number: '484.2'
    text: |-
      Vracht die in één som voor alle zaken ter bestemming is bepaald, is, ook wanneer slechts een gedeelte van die zaken
      is afgeleverd, in zijn geheel verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel484
  - number: '484.3'
    text: |-
      Onder voorbehoud van het vijfde lid van dit artikel is voor zaken, die onderweg zijn verkocht omdat hun
      beschadigdheid verder vervoer redelijkerwijs niet toeliet, de vracht verschuldigd, doch ten hoogste tot het bedrag
      van hun opbrengst.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel484
  - number: '484.4'
    text: |-
      Vracht, die vooruit te voldoen is of voldaan is, is en blijft - behalve in geval van tijdbevrachting - in zijn
      geheel verschuldigd, ook wanneer de zaken niet ter bestemming worden afgeleverd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel484
  - number: '484.5'
    text: |-
      In waardeloze toestand afgeleverde zaken worden aangemerkt als niet te zijn afgeleverd. Zaken, die niet zijn
      afgeleverd, of die in waardeloze toestand zijn afgeleverd, worden desalniettemin aangemerkt als afgeleverde zaken,
      voor zover het niet of in waardeloze toestand afleveren het gevolg is van de aard of een gebrek van de zaken, dan
      wel van een handeling of nalaten van een rechthebbende op of de afzender of ontvanger van de zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel484
  - number: '485'
    text: |-
      Voor zaken die door een opvarende voor eigen rekening in strijd met enig wettelijk verbod worden vervoerd is
      de hoogste vracht verschuldigd die ten tijde van de inlading voor soortgelijke zaken kon worden bedongen. Deze
      vracht is verschuldigd ook wanneer de zaken niet of in waardeloze toestand ter bestemming worden afgeleverd en de
      ontvanger is met de verscheper hoofdelijk voor deze vracht verbonden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel485
  - number: '486'
    text: |-
      Onder voorbehoud van de laatste zinsnede van het vijfde lid van [artikel 425][ref1] is in geval van tijdbevrachting
      vracht niet verschuldigd over de tijd, dat de bevrachter het schip niet overeenkomstig de bedingen van de
      bevrachting te zijner beschikking heeft


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel425
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel486
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '425'
        hoofdstuk: II
        afdeling: '2'
  - number: 486.a
    text: ten gevolge van beschadiging daarvan, dan wel
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel486
  - number: 486.b
    text: doordat de vervrachter in de nakoming van zijn verplichtingen te kort schiet,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel486
  - number: '487.1'
    text: |-
      Bij tijdbevrachting komen de brandstof voor de machines, het ketelwater, de havenrechten en soortgelijke rechten en
      uitgaven, die verschuldigd worden ten gevolge van uitgevoerde reizen en het vervoeren van zaken, ten laste van de
      bevrachter. De overige lasten der exploitatie van het schip komen ten laste van de vervrachter.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel487
  - number: '487.2'
    text: |-
      De vervrachter is gerechtigd en verplicht de zich bij het einde van de bevrachting nog aan boord bevindende
      brandstof van de bevrachter over te nemen tegen de marktprijs ten tijde en ter plaatse van de oplevering van het
      schip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel487
  - number: '488'
    text: |-
      Onverminderd het omtrent avarij-grosse bepaalde en onverminderd [afdeling 1 van Titel 4 van Boek 6][ref1] zijn de
      afzender, de ontvanger en, indien een cognossement is afgegeven, de in [artikel 441][ref2] bedoelde houder daarvan,
      hoofdelijk verbonden de vervoerder de schade te vergoeden, geleden doordat deze zich als zaakwaarnemer inliet met
      de behartiging van de belangen van een rechthebbende op ten vervoer ontvangen zaken dan wel doordat de kapitein of
      de schipper zijn in [artikel 261][ref3] of [artikel 860][ref4] genoemde verplichtingen is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling1
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel441
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel261
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel860
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel488
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '441'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '261'
        hoofdstuk: II
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '860'
        hoofdstuk: III
        afdeling: '2'
  - number: '489.1'
    text: |-
      De vervoerder is gerechtigd afgifte van zaken, die hij in verband met de vervoerovereenkomst onder zich heeft,
      te weigeren aan ieder, die uit anderen hoofde dan de vervoerovereenkomst recht heeft op aflevering van die zaken,
      tenzij op de zaken beslag is gelegd en uit de vervolging van dit beslag een verplichting tot afgifte aan de
      beslaglegger voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel489
  - number: '489.2'
    text: |-
      De vervoerder kan het recht van retentie uitoefenen op zaken, die hij in verband met de vervoerovereenkomst onder
      zich heeft, voor hetgeen hem door de ontvanger verschuldigd is of zal worden terzake van het vervoer van die zaken
      alsmede voor hetgeen als bijdrage in avarij-grosse op die zaken verschuldigd is of zal worden. Dit retentierecht
      vervalt zodra aan de vervoerder is betaald het bedrag waarover geen geschil bestaat en voldoende zekerheid is
      gesteld voor de betaling van die bedragen, waaromtrent wel geschil bestaat of welker hoogte nog niet kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel489
  - number: '489.3'
    text: |-
      De in dit artikel aan de vervoerder toegekende rechten komen hem niet toe jegens een derde, indien hij op het
      tijdstip dat hij de zaak ten vervoer ontving, reden had te twijfelen aan de bevoegdheid van de afzender jegens die
      derde hem de zaak ten vervoer ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel489
  - number: '490.1'
    text: |-
      Voor zover hij die jegens de vervoerder recht heeft op aflevering van vervoerde zaken niet opkomt, weigert deze
      te ontvangen of deze niet met de vereiste spoed in ontvangst neemt, voor zover op zaken beslag is gelegd, alsmede
      indien de vervoerder gegronde redenen heeft aan te nemen, dat een houder van een cognossement die als ontvanger
      opkomt, desalniettemin niet tot de aflevering gerechtigd is, is de vervoerder gerechtigd deze zaken voor rekening
      en gevaar van de rechthebbende bij een derde op te slaan in een daarvoor geschikte bewaarplaats of lichter. Op zijn
      verzoek kan de rechter bepalen dat hij deze zaken, desgewenst ook in het schip, onder zichzelf kan houden of andere
      maatregelen daarvoor kan treffen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel490
  - number: '490.2'
    text: |-
      De derde-bewaarnemer en de ontvanger zijn jegens elkaar verbonden, als ware de omtrent de bewaring gesloten
      overeenkomst mede tussen hen aangegaan. De bewaarnemer is echter niet gerechtigd tot afgifte dan na schriftelijke
      toestemming daartoe van hem, die de zaken in bewaring gaf.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel490
  - number: '491.1'
    text: |-
      In geval van toepassing van [artikel 490][ref1] kan de vervoerder, de bewaarnemer dan wel hij, die jegens de
      vervoerder recht heeft op de aflevering op zijn verzoek, door de rechter worden gemachtigd de zaken geheel of
      gedeeltelijk op de door deze te bepalen wijze te verkopen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel490
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel491
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '490'
        hoofdstuk: II
        afdeling: '2'
  - number: '491.2'
    text: |-
      De bewaarnemer is verplicht de vervoerder zo spoedig mogelijk van de voorgenomen verkoop op de hoogte te stellen;
      de vervoerder heeft deze verplichting jegens degeen, die jegens hem recht heeft op de aflevering van de zaken, en
      jegens degeen, aan wie hij volgens de bepalingen van een mogelijkerwijs afgegeven cognossement bericht van aankomst
      van het schip moet zenden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel491
  - number: '491.3'
    text: |-
      De opbrengst van het verkochte wordt in de consignatiekas gestort voor zover zij niet strekt tot voldoening van
      de kosten van opslag en verkoop alsmede, binnen de grenzen der redelijkheid, van de gemaakte kosten. Tenzij op de
      zaken beslag is gelegd voor een geldvordering, moet aan de vervoerder uit het in bewaring te stellen bedrag worden
      voldaan hetgeen hem verschuldigd is ter zake van het vervoer, alsmede een bijdrage in avarij-grosse; voor zover
      deze vorderingen nog niet vast staan, zal de opbrengst of een gedeelte daarvan op door de rechter te bepalen wijze
      tot zekerheid voor deze vorderingen strekken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel491
  - number: '491.4'
    text: De in de consignatiekas gestorte opbrengst treedt in de plaats van de zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel491
  - number: '492.1'
    text: |-
      Tenzij aan de vervoerder of zijn agent in de loshaven vóór of op het ogenblik van het weghalen van de zaken en van
      hun overgifte aan de krachtens de vervoerovereenkomst op de aflevering rechthebbende persoon schriftelijk kennis
      is gegeven van verliezen of schaden en van de algemene aard van deze verliezen of schaden, schept dit weghalen, tot
      op bewijs van het tegendeel, het vermoeden dat de zaken door de vervoerder zijn afgeleverd in de staat als in de
      vervoerovereenkomst omschreven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel492
  - number: '492.2'
    text: |-
      Zijn de verliezen of schaden niet uiterlijk zichtbaar, dan moet de kennisgeving binnen drie dagen na de aflevering
      geschieden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel492
  - number: '492.3'
    text: |-
      Schriftelijk voorbehoud is overbodig als de staat van de zaak op het ogenblik van de inontvangstneming door beide
      partijen gezamenlijk werd vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel492
  - number: '493'
    text: |-
      Indien er zekerheid of vermoeden bestaat, dat er verlies of schade is, moeten de vervoerder en de ontvanger elkaar
      over en weer in redelijkheid alle middelen verschaffen om het onderzoek van de zaak en het natellen van de colli
      mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel493
  - number: '494.1'
    text: |-
      Zowel de vervoerder als hij die jegens de vervoerder recht heeft op de aflevering, is bevoegd bij de aflevering van
      zaken de rechter te verzoeken een gerechtelijk onderzoek te doen plaatshebben naar de toestand waarin deze worden
      afgeleverd; tevens zijn zij bevoegd de rechter te verzoeken de daarbij bevonden verliezen of schaden gerechtelijk
      te doen begroten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel494
  - number: '494.2'
    text: |-
      Indien dit onderzoek in tegenwoordigheid of na behoorlijke oproeping van de wederpartij heeft plaatsgehad, wordt
      het uitgebrachte rapport vermoed juist te zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel494
  - number: '495.1'
    text: |-
      Zowel de vervoerder als hij die jegens de vervoerder recht heeft op de aflevering is, wanneer hij verliezen of
      schaden van zaken vermoedt, bevoegd de rechter te verzoeken vóór, bij of terstond na de aflevering daarvan en
      desgewenst aan boord van het schip een gerechtelijk onderzoek te doen plaatshebben naar de oorzaak daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel495
  - number: '495.2'
    text: |-
      Indien dit onderzoek in tegenwoordigheid of na behoorlijke oproeping van de wederpartij heeft plaatsgehad, wordt
      het uitgebrachte rapport vermoed juist te zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel495
  - number: '496.1'
    text: |-
      De kosten van gerechtelijk onderzoek, als bedoeld in de [artikelen 494][ref1] en [495][ref2], moeten worden voldaan
      door de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel494
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel495
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel496
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '494'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '495'
        hoofdstuk: II
        afdeling: '2'
  - number: '496.2'
    text: |-
      De rechter kan deze kosten en door het onderzoek geleden schade geheel of gedeeltelijk ten laste van de wederpartij
      van de aanvrager brengen, ook al zou daardoor het bedrag genoemd in het eerste lid van [artikel 388][ref1] worden
      overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel388
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel496
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '388'
        hoofdstuk: II
        afdeling: '2'
  - number: '500.1'
    text: |-
      De overeenkomst van personenvervoer in de zin van deze titel is de overeenkomst van personenvervoer, al dan niet
      tijd- of reisbevrachting zijnde, waarbij de ene partij (de vervoerder) zich tegenover de andere partij verbindt aan
      boord van een schip een of meer personen (reizigers) en al dan niet hun bagage uitsluitend over zee te vervoeren.
      De overeenkomst van personenvervoer aan boord van een luchtkussenvoertuig noch de overeenkomst van personenvervoer
      als omschreven in artikel 100 is een overeenkomst van personenvervoer in de zin van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel500
  - number: '500.2'
    text: |-
      Vervoer over zee en binnenwateren aan boord van een en eenzelfde schip, dat deze beide wateren bevaart, wordt als
      vervoer over zee beschouwd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel500
  - number: '500.3'
    text: |-
      Hutbagage in de zin van deze afdeling is de bagage, met uitzondering van levende dieren die de reiziger in zijn hut
      heeft, die hij in zijn bezit, onder zijn toezicht of in zijn macht heeft, alsmede de bagage die hij aan boord heeft
      van een met hem als bagage ten vervoer aangenomen voertuig of schip, doch niet dit voertuig of schip zelf.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel500
  - number: '500.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen zaken die geen hutbagage zijn voor de toepassing van bepalingen van deze
      afdeling als hutbagage worden aangewezen, dan wel bepalingen van deze afdeling niet van toepassing worden verklaard
      op zaken, die hutbagage zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel500
  - number: '501'
    text: 'Vervoer over zee omvat:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel501
  - number: 501.a
    text: |-
      met betrekking tot personen of hun hutbagage de tijd dat de reiziger of zijn hutbagage aan boord van het schip
      verblijft, de tijd van inscheping of ontscheping, alsmede de tijd dat de reiziger of zijn hutbagage te water wordt
      vervoerd tussen wal en schip of tussen schip en wal, indien de prijs hiervan in de vracht is inbegrepen of het voor
      dit hulpvervoer gebezigde schip door de vervoerder ter beschikking van de reiziger is gesteld. Vervoer over zee
      van personen omvat echter niet de tijd dat de reiziger verblijft in een stationsgebouw, op een kade of enige andere
      haveninstallatie;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel501
  - number: 501.b
    text: |-
      met betrekking tot hutbagage bovendien de tijd dat de reiziger verblijft in een stationsgebouw, op een kade of
      enige andere haveninstallatie, indien die bagage is overgenomen door de vervoerder en niet weer aan de reiziger
      is afgeleverd;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel501
  - number: 501.c
    text: |-
      met betrekking tot bagage die geen hutbagage is de tijd tussen het overnemen door de vervoerder hetzij te land,
      hetzij aan boord en de aflevering door de vervoerder;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel501
  - number: 501.d
    text: |-
      met betrekking tot een levend dier de tijd dat het aan boord van het schip verblijft dan wel onder de hoede van de
      vervoerder is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel501
  - number: '502.1'
    text: |-
      Tijd- of reisbevrachting in de zin van deze afdeling is de overeenkomst van personenvervoer, waarbij de vervoerder
      (de vervrachter) zich verbindt tot vervoer aan boord van een schip dat hij daartoe, anders dan bij wijze van
      rompbevrachting, in zijn geheel en al dan niet op tijdbasis (tijdbevrachting of reisbevrachting) ter beschikking
      stelt van zijn wederpartij (de bevrachter).
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel502
  - number: '502.2'
    text: |-
      De in [afdeling 2 van titel 5][ref1] in het bijzonder voor het geval van bevrachting gegeven bepalingen, alsmede
      [artikel 375][ref2] zijn op deze bevrachting van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel375
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel502
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '375'
        hoofdstuk: II
        afdeling: '2'
  - number: '503'
    text: |-
      De wetsbepalingen omtrent huur, bewaarneming en bruikleen zijn op ter beschikkingstelling van een schip ten
      vervoer, anders dan bij wijze van rompbevrachting, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel503
  - number: '504.1'
    text: |-
      De vervoerder is aansprakelijk voor schade veroorzaakt door dood of letsel van de reiziger, indien een voorval dat
      hiertoe leidde zich voordeed tijdens het vervoer en voor zover dit voorval is veroorzaakt door een omstandigheid
      die een zorgvuldig vervoerder heeft kunnen vermijden of door een omstandigheid waarvan zulk een vervoerder de
      gevolgen heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel504
  - number: '504.2'
    text: |-
      Vermoed wordt dat een zorgvuldig vervoerder de omstandigheid die leidde tot schipbreuk, aanvaring, stranding,
      ontploffing of brand heeft kunnen vermijden, alsmede dat zulk een vervoerder heeft kunnen verhinderen dat deze
      omstandigheid tot een dergelijk voorval leidde.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel504
  - number: '504.3'
    text: |-
      Gebrekkigheid of slecht functioneren van het schip of van het materiaal, waarvan hij zich voor het vervoer bedient
      wordt aangemerkt als een omstandigheid die een zorgvuldig vervoerder heeft kunnen vermijden en waarvan hij de
      gevolgen heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel504
  - number: '504.4'
    text: |-
      Bij de toepassing van dit artikel wordt slechts dan rekening gehouden met een gedraging van een derde, indien geen
      andere omstandigheid, die mede tot het voorval leidde, voor rekening van de vervoerder is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel504
  - number: '505.1'
    text: |-
      De vervoerder is aansprakelijk voor schade veroorzaakt door geheel of gedeeltelijk verlies dan wel beschadiging
      van hutbagage of van een als bagage ten vervoer aangenomen levend dier, indien een voorval dat hiertoe leidde zich
      voordeed tijdens het vervoer en voor zover dit voorval is veroorzaakt door een omstandigheid die een zorgvuldig
      vervoerder heeft kunnen vermijden of waarvan zulk een vervoerder de gevolgen heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel505
  - number: '505.2'
    text: Behalve met betrekking tot een levend dier zijn het tweede en derde lid van artikel 504 van toepassing.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel505
  - number: '505.3'
    text: |-
      Bij de toepassing van dit artikel wordt slechts dan rekening gehouden met een gedraging van een derde, indien geen
      andere omstandigheid, die mede tot het voorval leidde, voor rekening van de vervoerder is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel505
  - number: '505.4'
    text: Dit artikel laat de artikelen 545 en 1006 onverlet.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel505
  - number: '506'
    text: |-
      Onder voorbehoud van artikel 505 is de vervoerder aansprakelijk voor schade veroorzaakt door geheel of gedeeltelijk
      verlies dan wel beschadiging van bagage, indien een voorval dat hiertoe leidde zich voordeed tijdens het vervoer,
      tenzij en voor zover dit voorval is veroorzaakt door een omstandigheid die een zorgvuldig vervoerder niet heeft
      kunnen vermijden en waarvan zulk een vervoerder de gevolgen niet heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel506
  - number: '507'
    text: |-
      De vervoerder is niet aansprakelijk in geval van verlies of beschadiging overkomen aan geldstukken, verhandelbare
      documenten, goud, zilver, juwelen, sieraden, kunstvoorwerpen of andere zaken van waarde, tenzij deze zaken van
      waarde aan de vervoerder in bewaring zijn gegeven en hij overeengekomen is hen in zekerheid te zullen bewaren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel507
  - number: '508'
    text: |-
      De vervoerder is terzake van door de reiziger aan boord gebrachte zaken die hij, indien hij hun aard of gesteldheid
      had gekend, niet aan boord zou hebben toegelaten en waarvoor hij geen bewijs van ontvangst heeft afgegeven, geen
      enkele schadevergoeding verschuldigd indien de reiziger wist of behoorde te weten, dat de vervoerder de zaken
      niet ten vervoer zou hebben toegelaten; de reiziger is alsdan aansprakelijk voor alle kosten en schaden voor de
      vervoerder voortvloeiend uit de aanbieding ten vervoer of uit het vervoer zelf.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel508
  - number: '509'
    text: |-
      Onverminderd [artikel 508][ref1] en onverminderd [artikel 179 van Boek 6][ref2] is de reiziger verplicht de
      vervoerder de schade te vergoeden die hij of zijn bagage deze berokkende, behalve voor zover deze schade is
      veroorzaakt door een omstandigheid die een zorgvuldig reiziger niet heeft kunnen vermijden en voor zover zulk een
      reiziger de gevolgen daarvan niet heeft kunnen verhinderen. De reiziger kan niet om zich van zijn aansprakelijkheid
      te ontheffen beroep doen op de hoedanigheid of een gebrek van zijn bagage.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel508
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel179
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel509
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '508'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '179'
  - number: '510.1'
    text: |-
      Onverminderd de bepalingen van deze afdeling zijn op het vervoer van bagage de [artikelen 378][ref1], [387][ref2],
      [388 tweede lid][ref3], [389][ref4], [394 eerste en tweede lid][ref5], [395][ref6], [396][ref7], [398][ref8],
      [488 tot en met 491][ref9] en [493 tot en met 496][ref10] van toepassing. De in artikel 396 bedoelde opzegging kan
      ook mondeling geschieden. De in [artikel 489][ref11] toegekende rechten en het in [artikel 491][ref12] toegekende
      recht tot het zich laten voldoen uit het in bewaring te stellen bedrag van kosten terzake van het vervoer, kunnen
      worden uitgeoefend voor alles wat de wederpartij van de vervoerder of de reiziger aan de vervoerder verschuldigd
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel378
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel387
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel388
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel389
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Artikel394
      [ref6]: https://wetten.overheid.nl/BWBR0005034#Artikel395
      [ref7]: https://wetten.overheid.nl/BWBR0005034#Artikel396
      [ref8]: https://wetten.overheid.nl/BWBR0005034#Artikel398
      [ref9]: https://wetten.overheid.nl/BWBR0005034#Artikel488
      [ref10]: https://wetten.overheid.nl/BWBR0005034#Artikel493
      [ref11]: https://wetten.overheid.nl/BWBR0005034#Artikel489
      [ref12]: https://wetten.overheid.nl/BWBR0005034#Artikel491
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel510
    references:
