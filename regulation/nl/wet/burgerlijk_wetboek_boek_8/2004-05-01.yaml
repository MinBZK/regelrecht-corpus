  - number: 1714.a
    text: |-
      ten vervoer ter beschikking stellen of ontvangen van bepaalde zaken, verschaffen van opgaven, inlichtingen of
      documenten betreffende deze zaken, betrachten van zorg ten aanzien van deze documenten, adresseren van bepaalde
      zaken of aanbrengen van gegevens op die zaken of op hun verpakking;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1714
  - number: 1714.b
    text: |-
      laden, behandelen, stuwen, herstuwen, vervoeren, lossen, opslaan, vernietigen of onschadelijk maken van bepaalde
      zaken dan wel berokkenen van schade door die zaken of door in- of uitladen daarvan;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1714
