        artikel: '1711'
        hoofdstuk: VII
        afdeling: '2'
  - number: '1719'
    text: |-
      In afwijking van de [artikelen 1714][ref1], [1715][ref2] en [1717][ref3] begint in geval van een door een
      vervoerder ingestelde rechtsvordering tot vergoeding van schade geleden door verlies of beschadiging van een
      vervoermiddel de in [artikel 1711][ref4] genoemde termijn met de aanvang van de dag, volgende op die waarop het
      verlies of de beschadiging plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1714
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1715
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1717
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1711
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1719
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1714'
        hoofdstuk: VII
        afdeling: '2'
      - id: ref2
