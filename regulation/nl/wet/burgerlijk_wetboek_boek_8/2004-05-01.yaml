        afdeling: '4'
  - number: '1711'
    text: |-
      Behoudens de [artikelen 1712][ref1] en [1720][ref2] verjaart een op een vervoerovereenkomst gegronde
      rechtsvordering door verloop van één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1712
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1720
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1711
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1712'
        hoofdstuk: VII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1720'
        hoofdstuk: VII
        afdeling: '2'
  - number: '1712.1'
    text: |-
      De vervoerder bij een vervoerovereenkomst onder cognossement, als bedoeld in [artikel 377][ref1], is in ieder
      geval van alle aansprakelijkheid, welke dan ook, met betrekking tot de vervoerde zaken ontheven, tenzij een
      rechtsvordering wordt ingesteld binnen één jaar, welke termijn begint met de aanvang van de dag volgende op de dag
      van aflevering of de dag waarop de zaken hadden moeten zijn afgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel377
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1712
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '377'
        hoofdstuk: II
        afdeling: '2'
  - number: '1712.2'
    text: |-
      In afwijking van het eerste lid kunnen rechtsvorderingen tot verhaal op een derde zelfs na afloop van de in dat lid
      genoemde termijn worden ingesteld gedurende een termijn van drie maanden, te rekenen van de dag waar op degene die
      een zodanige rechtsvordering tot verhaal instelt ten aanzien van het van hemzelf gevorderde de zaak heeft geregeld
      of waarop hij te dien aanzien in rechte is aangesproken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1712
  - number: '1712.3'
    text: |-
      De in het eerste lid bedoelde termijn kan worden verlengd bij overeenkomst tussen partijen, gesloten nadat de
      gebeurtenis die de rechtsvordering heeft doen ontstaan, heeft plaats gehad.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1712
  - number: '1713.1'
    text: |-
      Behoudens [artikel 1716][ref1] en in afwijking van [artikel 1717][ref2] begint in geval van een door een afzender
      tegen een vervoerder ingestelde rechtsvordering terzake van niet terbeschikkingstelling van het vervoermiddel of
      niet aanwezig zijn daarvan, de in [artikel 1711][ref3] genoemde termijn met de aanvang van de dag, volgende op de
      dag dat het vervoermiddel ter beschikking gesteld had moeten zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1716
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1717
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1711
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1713
    references:
