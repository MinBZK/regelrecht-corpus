    text: |-
      afleveren van bepaalde zaken, verschaffen van middelen tot onderzoek en natellen daarvan, betalen van
      vracht daarover of van onkosten of extra-vergoedingen in verband met deze zaken, vergoeden van de in de
      [artikelen 488][ref1], [951][ref2], [1129][ref3] of [1195][ref4] bedoelde schade en innen en afdragen van
      remboursgelden;


