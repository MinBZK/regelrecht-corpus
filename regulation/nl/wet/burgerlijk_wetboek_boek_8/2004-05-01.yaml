        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '389'
        hoofdstuk: II
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005034
        artikel: '394'
        hoofdstuk: II
        afdeling: '2'
