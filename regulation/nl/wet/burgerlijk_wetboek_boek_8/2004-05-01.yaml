        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1711'
        hoofdstuk: VII
        afdeling: '2'
  - number: '1717'
    text: |-
      Behoudens de [artikelen 1713 tot en met 1716][ref1], [1718][ref2], [1719][ref3] en [1822][ref4] begint in geval
      van een rechtsvordering gegrond op een tijdbevrachting de in [artikel 1711][ref5] genoemde termijn met de aanvang
      van de dag, volgende op die waarop de uitvoering van de overeenkomst is geëindigd; in geval van een rechtsvordering
      gegrond op een reisbevrachting begint deze termijn met de aanvang van de dag volgende op die waarop de reis, naar
      aanleiding waarvan de vordering is ontstaan, is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1713
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1718
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1719
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1822
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Artikel1711
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1717
