articles:
  - number: '1.1'
    text: |-
      In dit wetboek worden onder schepen verstaan alle zaken, geen luchtvaartuig zijnde, die blijkens hun constructie
      bestemd zijn om te drijven en drijven of hebben gedreven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1
  - number: '1.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen zaken, die geen schepen zijn, voor de toepassing van bepalingen van dit
      wetboek als schip worden aangewezen, dan wel bepalingen van dit wetboek niet van toepassing worden verklaard op
      zaken, die schepen zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1
  - number: '1.3'
    text: |-
      Voortbewegingswerktuigen en andere machinerieën worden bestanddeel van het schip op het ogenblik dat, na hun
      inbouw, hun bevestiging daaraan zodanig is als deze ook na voltooiing van het schip zal zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1
  - number: '1.4'
    text: |-
      Onder scheepstoebehoren worden verstaan de zaken, die, geen bestanddeel van het schip zijnde, bestemd zijn
      om het schip duurzaam te dienen en door hun vorm als zodanig zijn te herkennen, alsmede die navigatie- en
      communicatiemiddelen, die zodanig met het schip zijn verbonden, dat zij daarvan kunnen worden afgescheiden, zonder
      dat beschadiging van betekenis aan hen of aan het schip wordt toegebracht.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1
  - number: '1.5'
    text: |-
      Behoudens afwijkende bedingen wordt het scheepstoebehoren tot het schip gerekend. Een afwijkend beding kan worden
      ingeschreven in de openbare registers, bedoeld in [afdeling 2 van Titel 1 van Boek 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '1.6'
    text: |-
      Voor de toepassing van het derde, het vierde en het vijfde lid van dit artikel wordt onder schip mede verstaan een
      schip in aanbouw.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel1
  - number: '2.1'
    text: |-
      In dit wetboek worden onder zeeschepen verstaan de schepen, die teboekstaan in het in artikel 193 genoemde
      register, alsmede de schepen, die noch in dit register, noch in het in artikel 783 genoemde register te boekstaan
      en blijkens hun constructie uitsluitend of in hoofdzaak voor drijven in zee zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel2
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen schepen, die geen zeeschepen zijn, voor de toepassing van bepalingen van
      dit wetboek als zeeschip worden aangewezen, dan wel bepalingen van dit wetboek niet van toepassing worden verklaard
      op schepen, die zeeschepen zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel2
  - number: '2.3'
    text: |-
      In dit wetboek worden onder zeevissersschepen verstaan zeeschepen, die blijkens hun constructie uitsluitend of in
      hoofdzaak voor de bedrijfsmatige visvangst zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel2
  - number: '3.1'
    text: |-
      In dit wetboek worden onder binnenschepen verstaan de schepen, die teboekstaan in het in artikel 783 genoemde
      register, alsmede de schepen, die noch in dit register, noch in het in artikel 193 genoemde register teboekstaan en
      blijkens hun constructie noch uitsluitend noch in hoofdzaak voor drijven in zee zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel3
  - number: '3.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen schepen, die geen binnenschepen zijn, voor de toepassing van bepalingen
      van dit wetboek als binnenschip worden aangewezen, dan wel bepalingen van dit wetboek niet van toepassing worden
      verklaard op schepen, die binnenschepen zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel3
  - number: 3a.1
    text: |-
      In dit wetboek worden onder luchtvaartuigen verstaan toestellen die in de dampkring kunnen worden gehouden ten
      gevolge van krachten die de lucht daarop uitoefent, met uitzondering van toestellen die blijkens hun constructie
      bestemd zijn zich te verplaatsen op een luchtkussen, dat wordt in stand gehouden tussen het toestel en het
      oppervlak der aarde.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel3a
  - number: 3a.2
    text: |-
      Het casco, de motoren, de luchtschroeven, de radiotoestellen en alle andere voorwerpen bestemd voor gebruik in of
      aan het toestel, onverschillig of zij daarin of daaraan zijn aangebracht dan wel tijdelijk ervan zijn gescheiden,
      zijn bestanddeel van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel3a
  - number: 3a.3
    text: |-
      Bij algemene maatregel van bestuur kunnen zaken die geen luchtvaartuigen zijn, voor de toepassing van bepalingen
      van dit wetboek als luchtvaartuig worden aangewezen, dan wel bepalingen van dit wetboek niet van toepassing worden
      verklaard op zaken die luchtvaartuigen zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel3a
  - number: '4'
    text: |-
      Onder voorbehoud van [artikel 552][ref1] worden in dit boek de Dollart, de Waddenzee, het IJsselmeer, de stromen,
      de riviermonden en andere zo nodig voor de toepassing van bepalingen van dit boek bij algemene maatregel van
      bestuur aan te wijzen wateren, binnen zo nodig nader bij algemene maatregel van bestuur te bepalen grenzen, als
      binnenwater beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel552
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '552'
        hoofdstuk: II
        afdeling: '2'
  - number: '5'
    text: In dit wetboek worden onder opvarenden verstaan alle zich aan boord van een schip bevindende personen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel5
  - number: '6'
    text: In dit wetboek worden de kapitein en de schipper aangemerkt als lid van de bemanning.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel6
  - number: '8'
    text: |-
      In dit wetboek worden onder bagage verstaan de zaken, die een vervoerder in verband met een door hem gesloten
      overeenkomst van personenvervoer op zich neemt te vervoeren met uitzondering van zaken, vervoerd onder een het
      vervoer van zaken betreffende overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel8
  - number: '10'
    text: In dit wetboek wordt onder reder verstaan de eigenaar van een zeeschip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel10
  - number: '12'
    text: |-
      In dit boek leidt strijd met een dwingende wetsbepaling tot ambtshalve toe te passen nietigheid van de
      rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel12
  - number: '13'
    text: |-
      Dit boek laat onverlet enige voor Nederland van kracht zijnde internationale overeenkomst of enige wet die de
      aansprakelijkheid voor kernschade regelt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel13
  - number: '20'
    text: |-
      De overeenkomst van goederenvervoer is de overeenkomst, waarbij de ene partij (de vervoerder) zich tegenover de
      andere partij (de afzender) verbindt zaken te vervoeren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel20
  - number: '21'
    text: |-
      De vervoerder is verplicht ten vervoer ontvangen zaken ter bestemming af te leveren en wel in de staat waarin hij
      hen heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel21
  - number: '22'
    text: |-
      Onverminderd [artikel 21][ref1] is de vervoerder verplicht ten vervoer ontvangen zaken zonder vertraging te
      vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel21
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '21'
        hoofdstuk: I
        afdeling: '1'
  - number: '23'
    text: |-
      De vervoerder is niet aansprakelijk voor schade, voor zover deze is veroorzaakt door een omstandigheid die een
      zorgvuldig vervoerder niet heeft kunnen vermijden en voor zover zulk een vervoerder de gevolgen daarvan niet heeft
      kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel23
  - number: '24'
    text: |-
      De afzender is verplicht de vervoerder de schade te vergoeden die deze lijdt doordat de overeengekomen zaken, door
      welke oorzaak dan ook, niet op de overeengekomen plaats en tijd te zijner beschikking zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel24
  - number: '25.1'
    text: |-
      Alvorens zaken ter beschikking van de vervoerder zijn gesteld, is de afzender bevoegd de overeenkomst op te zeggen.
      Hij is verplicht de vervoerder de schade te vergoeden die deze ten gevolge van de opzegging lijdt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel25
  - number: '25.2'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving en de overeenkomst eindigt op het ogenblik
      van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel25
  - number: '26'
    text: |-
      De afzender is verplicht de vervoerder omtrent de zaken alsmede omtrent de behandeling daarvan tijdig al die
      opgaven te doen, waartoe hij in staat is of behoort te zijn, en waarvan hij weet of behoort te weten, dat zij voor
      de vervoerder van belang zijn, tenzij hij mag aannemen dat de vervoerder deze gegevens kent.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel26
  - number: '27'
    text: |-
      De afzender is verplicht de vervoerder de schade te vergoeden die deze lijdt doordat de documenten, die van de
      zijde van de afzender voor het vervoer vereist zijn, door welke oorzaak dan ook, niet naar behoren aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel27
  - number: '28.1'
    text: |-
      Wanneer vóór of bij de aanbieding van de zaken aan de vervoerder omstandigheden aan de zijde van een der partijen
      zich opdoen of naar voren komen, die haar wederpartij bij het sluiten van de overeenkomst niet behoefde te
      kennen, doch die, indien zij haar wel bekend waren geweest, redelijkerwijs voor haar grond hadden opgeleverd de
      vervoerovereenkomst niet of op andere voorwaarden aan te gaan, is deze wederpartij bevoegd de overeenkomst op te
      zeggen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel28
  - number: '28.2'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving en de overeenkomst eindigt op het ogenblik
      van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel28
  - number: '28.3'
    text: |-
      Naar maatstaven van redelijkheid en billijkheid zijn partijen na opzegging der overeenkomst verplicht elkaar de
      daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel28
  - number: '29'
    text: De vracht is verschuldigd na aflevering van de zaken ter bestemming.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel29
  - number: '30.1'
    text: |-
      De vervoerder is gerechtigd afgifte van zaken, die hij in verband met de vervoerovereenkomst onder zich heeft,
      te weigeren aan ieder, die uit anderen hoofde dan de vervoerovereenkomst recht heeft op aflevering van die zaken,
      tenzij op de zaken beslag is gelegd en uit de vervolging van dit beslag een verplichting tot afgifte aan de
      beslaglegger voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel30
  - number: '30.2'
    text: |-
      De vervoerder kan het recht van retentie uitoefenen op zaken, die hij in verband met de vervoerovereenkomst onder
      zich heeft, voor hetgeen hem door de ontvanger verschuldigd is of zal worden terzake van het vervoer van die
      zaken. Hij kan dit recht tevens uitoefenen voor hetgeen bij wijze van rembours op die zaak drukt. Dit retentierecht
      vervalt zodra aan de vervoerder is betaald het bedrag waarover geen geschil bestaat en voldoende zekerheid is
      gesteld voor de betaling van die bedragen, waaromtrent wel geschil bestaat of welker hoogte nog niet kan worden
      vastgesteld. De vervoerder behoeft echter geen zekerheid te aanvaarden voor hetgeen bij wijze van rembours op de
      zaak drukt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel30
  - number: '30.3'
    text: |-
      De in dit artikel aan de vervoerder toegekende rechten komen hem niet toe jegens een derde, indien hij op het
      tijdstip dat hij de zaak ten vervoer ontving, reden had te twijfelen aan de bevoegdheid van de afzender jegens die
      derde hem de zaak ten vervoer ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel30
  - number: '31'
    text: |-
      Wordt de vervoerder dan wel de afzender of een ondergeschikte van een hunner buiten overeenkomst aangesproken, dan
      zijn de [artikelen 361 tot en met 366][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel361
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '361'
        hoofdstuk: II
        afdeling: '1'
  - number: '32'
    text: Deze afdeling geldt slechts ten aanzien van niet elders in dit boek geregelde overeenkomsten van goederenvervoer.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel32
  - number: '40'
    text: |-
      De overeenkomst van gecombineerd goederenvervoer is de overeenkomst van goederenvervoer, waarbij de vervoerder
      (gecombineerd vervoerder) zich bij een en dezelfde overeenkomst tegenover de afzender verbindt dat het vervoer
      deels over zee, over binnenwateren, over de weg, langs spoorstaven, door de lucht of door een pijpleiding dan wel
      door middel van enige andere vervoerstechniek zal geschieden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel40
  - number: '41'
    text: |-
      Bij een overeenkomst van gecombineerd goederenvervoer gelden voor ieder deel van het vervoer de op dat deel
      toepasselijke rechtsregelen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel41
  - number: '42.1'
    text: |-
      Indien de gecombineerd vervoerder de zaken niet zonder vertraging ter bestemming aflevert in de staat waarin hij
      hen heeft ontvangen en niet is komen vast te staan, waar de omstandigheid, die het verlies, de beschadiging of de
      vertraging veroorzaakte, is opgekomen, is hij voor de daardoor ontstane schade aansprakelijk, tenzij hij bewijst,
      dat hij op geen der delen van het vervoer, waar het verlies, de beschadiging of de vertraging kan zijn opgetreden,
      daarvoor aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel42
  - number: '42.2'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel42
  - number: '43.1'
    text: |-
      Indien de gecombineerd vervoerder aansprakelijk is voor schade ontstaan door beschadiging, geheel of gedeeltelijk
      verlies, vertraging of enig ander schadeveroorzakend feit en niet is komen vast te staan waar de omstandigheid,
      die hiertoe leidde, is opgekomen, wordt zijn aansprakelijkheid bepaald volgens de rechtsregelen die toepasselijk
      zijn op dat deel of die delen van het vervoer, waarop deze omstandigheid kan zijn opgekomen en waaruit het hoogste
      bedrag aan schade vergoeding voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel43
  - number: '43.2'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel43
  - number: '44.1'
    text: |-
      De gecombineerd vervoerder kan op verlangen van de afzender, geuit alvorens zaken te zijner beschikking worden
      gesteld, terzake van het vervoer een document (CT-document) opmaken, dat door hem wordt gedateerd en ondertekend en
      aan de afzender wordt afgegeven. De ondertekening kan worden gedrukt of door een stempel dan wel enig ander kenmerk
      van oorsprong worden vervangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: '44.2'
    text: 'Op het CT-document worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: 44.2.a
    text: de afzender,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: 44.2.b
    text: |-
      de ten vervoer ontvangen zaken met omschrijving van de algemene aard daarvan, zoals deze omschrijving gebruikelijk
      is,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: 44.2.c
    text: 'een of meer der volgende gegevens met betrekking tot de onder *b* bedoelde zaken:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: 44.2.c.1°
    text: aantal,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: 44.2.c.2°
    text: gewicht,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: 44.2.c.3°
    text: volume,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: 44.2.c.4°
    text: merken,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: 44.2.d
    text: de plaats waar de gecombineerd vervoerder de zaken ten vervoer heeft ontvangen,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: 44.2.e
    text: de plaats waarheen de gecombineerd vervoerder op zich neemt de zaken te vervoeren,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: 44.2.f
    text: |-
      de geadresseerde die, ter keuze van de afzender, wordt aangegeven hetzij bij name of andere aanduiding, hetzij als
      order van de afzender of van een ander, hetzij als toonder. De enkele woorden "aan order" worden geacht de order
      van de afzender aan te geven,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: 44.2.g
    text: de gecombineerd vervoerder,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: 44.2.h
    text: het aantal exemplaren van het document indien dit in meer dan één exemplaar is uitgegeven,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: 44.2.i
    text: al hetgeen overigens afzender en gecombineerd vervoerder gezamenlijk goeddunkt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: '44.3'
    text: |-
      De aanduidingen vermeld in het tweede lid onder *a* tot en met *c* worden in het CT-document opgenomen aan de hand
      van door de afzender te verstrekken gegevens, met dien verstande dat de gecombineerd vervoerder niet verplicht is
      in het CT-document enig gegeven met betrekking tot de zaken op te geven of te noemen, waarvan hij redelijke gronden
      heeft te vermoeden, dat het niet nauwkeurig de in werkelijkheid door hem ontvangen zaken weergeeft of tot het
      toetsen waarvan hij geen redelijke gelegenheid heeft gehad. De gecombineerd vervoerder wordt vermoed geen redelijke
      gelegenheid te hebben gehad de hoeveelheid en het gewicht van gestorte of gepompte zaken te toetsen. De afzender
      staat in voor de juistheid, op het ogenblik van de inontvangstneming van de zaken, van de door hem verstrekte
      gegevens.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: '44.4'
    text: |-
      Partijen zijn verplicht elkaar de schade te vergoeden die zij lijden door het ontbreken van in het tweede lid
      genoemde gegevens.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel44
  - number: '45'
    text: |-
      De verhandelbare exemplaren van het CT-document, waarin is vermeld hoeveel van deze exemplaren in het geheel
      zijn afgegeven, gelden alle voor één en één voor alle. Niet verhandelbare exemplaren moeten als zodanig worden
      aangeduid.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel45
  - number: '46.1'
    text: |-
      Voor het deel van het vervoer, dat overeenkomstig de tussen partijen gesloten overeenkomst zal plaatsvinden als
      vervoer over zee of binnenwateren, wordt het CT-document als cognossement aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel46
  - number: '46.2'
    text: |-
      Voor het deel van het vervoer, dat overeenkomstig de tussen partijen gesloten overeenkomst over de weg zal
      plaatsvinden, wordt het CT-document als vrachtbrief aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel46
  - number: '46.3'
    text: |-
      Voor het deel van het vervoer, dat overeenkomstig de tussen partijen gesloten overeenkomst langs spoorstaven of
      door de lucht zal plaatsvinden, wordt het CT-document, mits het mede aan de daarvoor gestelde vereisten voldoet,
      als voor dergelijk vervoer bestemd document aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel46
  - number: '47'
    text: |-
      Indien een overeenkomst van gecombineerd goederenvervoer is gesloten en bovendien een CT-document is afgegeven,
      wordt, behoudens [artikel 51 tweede lid, tweede volzin][ref1], de rechtsverhouding tussen de gecombineerd
      vervoerder en de afzender door de bedingen van de overeenkomst van gecombineerd goederenvervoer en niet door die
      van dit CT-document beheerst. Behoudens het in artikel 51 eerste lid gestelde vereiste van houderschap van het CT-
      document, strekt dit hun dan slechts tot bewijs van de ontvangst der zaken door de gecombineerd vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel51
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '51'
        hoofdstuk: I
        afdeling: '2'
  - number: '48.1'
    text: |-
      Het CT-document bewijst, behoudens tegenbewijs, dat de gecombineerd vervoerder de zaken heeft ontvangen en
      wel zoals deze daarin zijn omschreven. Tegenbewijs tegen het CT-document wordt niet toegelaten, wanneer het is
      overgedragen aan een derde te goeder trouw.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel48
  - number: '48.2'
    text: |-
      Indien in het CT-document de clausule: "aard, gewicht, aantal, volume of merken onbekend" of enige andere clausule
      van dergelijke strekking is opgenomen, binden zodanige in het CT-document voorkomende vermeldingen omtrent de zaken
      de gecombineerd vervoerder niet, tenzij bewezen wordt dat hij de aard, het gewicht, het aantal, het volume of de
      merken der zaken heeft gekend of had behoren te kennen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel48
  - number: '48.3'
    text: |-
      Een CT-document, dat de uiterlijk zichtbare staat of gesteldheid van de zaak niet vermeldt, levert, behoudens
      tegenbewijs dat ook jegens een derde mogelijk is, een vermoeden op dat de gecombineerd vervoerder die zaak voor
      zover uiterlijk zichtbaar in goede staat of gesteldheid heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel48
  - number: '48.4'
    text: |-
      Een in het CT-document opgenomen waarde-opgave schept, behoudens tegenbewijs, een vermoeden, doch bindt niet de
      gecombineerd vervoerder die haar kan betwisten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel48
  - number: '48.5'
    text: |-
      Verwijzingen in het CT-document worden geacht slechts die bedingen daarin te voegen, die voor degeen, jegens wie
      daarop een beroep wordt gedaan, duidelijk kenbaar zijn. Een dergelijk beroep is slechts mogelijk voor hem, die op
      schriftelijk verlangen van degeen jegens wie dit beroep kan worden gedaan of wordt gedaan, aan deze onverwijld die
      bedingen heeft doen toekomen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel48
  - number: '48.6'
    text: Dit artikel laat onverlet de bepalingen die aan cognossement of vrachtbrief een grotere bewijskracht toekennen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel48
  - number: '48.7'
    text: Nietig is ieder beding, waarbij van het vijfde lid van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel48
  - number: '49'
    text: |-
      Een CT-document aan order wordt geleverd op de wijze als aangegeven in [afdeling 2 van Titel 4 van Boek 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '50'
    text: |-
      Levering van het CT-document vóór de aflevering van de daarin vermelde zaken door de vervoerder geldt als levering
      van die zaken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel50
  - number: '51.1'
    text: |-
      Indien een CT-document is afgegeven, heeft uitsluitend de regelmatige houder daarvan, tenzij hij niet op
      rechtmatige wijze houder is geworden, jegens de gecombineerd vervoerder het recht aflevering van de zaken
      overeenkomstig de op deze rustende verplichtingen te vorderen. Onverminderd dit recht op aflevering heeft hij - en
      hij alleen - voor zover de gecombineerd vervoerder aansprakelijk is wegens het niet nakomen van de op hem rustende
      verplichting zaken zonder vertraging ter bestemming af te leveren in de staat waarin hij hen heeft ontvangen,
      uitsluitend het recht te dier zake schadevergoeding te vorderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel51
  - number: '51.2'
    text: |-
      Jegens de houder van het CT-document, die niet de afzender was, is de gecombineerd vervoerder gehouden aan en
      kan hij een beroep doen op de bedingen van het CT-document. Jegens iedere houder van het CT-document kan hij de
      daaruit duidelijk kenbare rechten tot betaling geldend maken. Jegens de houder van het CT-document, die ook de
      afzender was, kan de gecombineerd vervoerder zich bovendien op de bedingen van de overeenkomst van gecombineerd
      goederenvervoer en op zijn persoonlijke verhouding tot de afzender beroepen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel51
  - number: '52'
    text: |-
      Van de houders van verschillende exemplaren van hetzelfde CT-document heeft hij het beste recht, die houder is van
      het exemplaar, waarvan ná de gemeenschappelijke voorman, die houder was van al die exemplaren, het eerst een ander
      houder is geworden te goeder trouw en onder bezwarende titel.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel52
  - number: '60'
    text: |-
      De overeenkomst tot het doen vervoeren van goederen is de overeenkomst, waarbij de ene partij (de expediteur) zich
      jegens zijn wederpartij (de opdrachtgever) verbindt tot het te haren behoeve met een vervoerder sluiten van een
      of meer overeenkomsten van vervoer van door deze wederpartij ter beschikking te stellen zaken, dan wel tot het te
      haren behoeve maken van een beding in een of meer zodanige vervoerovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel60
  - number: '61.1'
    text: |-
      Voor zover de expediteur de overeenkomst tot het sluiten waarvan hij zich verbond, zelf uitvoert, wordt hij zelf
      aangemerkt als de vervoerder uit die overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel61
  - number: '61.2'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel61
  - number: '62.1'
    text: |-
      Indien de zaken niet zonder vertraging ter bestemming worden afgeleverd in de staat, waarin zij ter beschikking
      zijn gesteld, is de expediteur, voor zover hij een vervoerovereenkomst die hij met een ander zou sluiten, zelf
      uitvoerde, verplicht zulks onverwijld aan de opdrachtgever die hem kennis gaf van de schade mede te delen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel62
  - number: '62.2'
    text: |-
      Doet de expediteur de in het eerste lid bedoelde mededeling niet, dan is hij, wanneer hij daardoor niet tijdig als
      vervoerder is aangesproken, naast vergoeding van de schade die de opdrachtgever overigens dientengevolge leed, een
      schadeloosstelling verschuldigd gelijk aan de schadevergoeding, die hij zou hebben moeten voldoen, wanneer hij wel
      tijdig als vervoerder zou zijn aangesproken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel62
  - number: '62.3'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel62
  - number: '63.1'
    text: |-
      Indien de zaken niet zonder vertraging ter bestemming worden afgeleverd in de staat, waarin zij ter beschikking
      zijn gesteld, is de expediteur voor zover hij de vervoerovereenkomst, welke hij met een ander zou sluiten, niet
      zelf uitvoerde, verplicht de opdrachtgever onverwijld te doen weten welke vervoerovereenkomsten hij ter uitvoering
      van zijn verbintenis aanging. Hij is tevens verplicht de opdrachtgever alle documenten en gegevens ter beschikking
      te stellen, waarover hij beschikt of die hij redelijkerwijs kan verschaffen, voor zover deze althans kunnen dienen
      tot verhaal van opgekomen schade.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel63
  - number: '63.2'
    text: |-
      De opdrachtgever verkrijgt jegens degeen, met wie de expediteur heeft gehandeld, van het ogenblik af, waarop hij
      de expediteur duidelijk kenbaar maakt, dat hij hen wil uitoefenen, de rechten en bevoegdheden, die hem zouden zijn
      toegekomen, wanneer hij zelf als afzender de overeenkomst zou hebben gesloten. Hij kan ter zake in rechte optreden,
      wanneer hij overlegt een door de expediteur - of in geval van diens faillissement door diens curator - af te
      geven verklaring, dat tussen hem en de expediteur ten aanzien van de zaken een overeenkomst tot het doen vervoeren
      daarvan werd gesloten. Indien ten aanzien van de expediteur de schuldsaneringsregeling natuurlijke personen van
      toepassing is, geeft de bewindvoerder de verklaring af, tenzij de overeenkomst tot het doen vervoeren tot stand is
      gekomen na de uitspraak tot de toepassing van de schuldsaneringsregeling.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel63
  - number: '63.3'
    text: |-
      Komt de expediteur een verplichting als in het eerste lid bedoeld niet na, dan is hij, naast vergoeding van de
      schade die de opdrachtgever overigens dientengevolge leed, een schadeloosstelling verschuldigd gelijk aan de
      schadevergoeding die de opdrachtgever van hem had kunnen verkrijgen, wanneer hij de overeenkomst die hij sloot,
      zelf had uitgevoerd, verminderd met de schadevergoeding die de opdrachtgever mogelijkerwijs van de vervoerder
      verkreeg.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel63
  - number: '63.4'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel63
  - number: '64'
    text: |-
      De opdrachtgever is verplicht de expediteur de schade te vergoeden die deze lijdt doordat de overeengekomen zaken,
      door welke oorzaak dan ook, niet op de overeengekomen plaats en tijd ter beschikking zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel64
  - number: '65.1'
    text: |-
      Alvorens zaken ter beschikking zijn gesteld, is de opdrachtgever bevoegd de overeenkomst op te zeggen. Hij is
      verplicht de expediteur de schade te vergoeden die deze ten gevolge van de opzegging lijdt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel65
  - number: '65.2'
    text: |-
      De opzegging geschiedt door schriftelijke kennisgeving en de overeenkomst eindigt op het ogenblik van ontvangst
      daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel65
  - number: '66.1'
    text: |-
      De opdrachtgever is verplicht de expediteur omtrent de zaken alsmede omtrent de behandeling daarvan tijdig al die
      opgaven te doen, waartoe hij in staat is of behoort te zijn, en waarvan hij weet of behoort te weten, dat zij voor
      de expediteur van belang zijn, tenzij hij mag aannemen, dat de expediteur deze gegevens kent.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel66
  - number: '66.2'
    text: |-
      De expediteur is niet gehouden, doch wel gerechtigd, te onderzoeken of de hem gedane opgaven juist en volledig
      zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel66
  - number: '67'
    text: |-
      De opdrachtgever is verplicht de expediteur de schade te vergoeden die deze lijdt doordat de documenten, die van de
      zijde van de opdrachtgever voor het uitvoeren van de opdracht vereist zijn, door welke oorzaak dan ook, niet naar
      behoren aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel67
  - number: '68.1'
    text: |-
      Wanneer vóór of bij de terbeschikkingstelling van de zaken omstandigheden aan de zijde van een der partijen zich
      opdoen of naar voren komen, die haar wederpartij bij het sluiten van de overeenkomst niet behoefde te kennen, doch
      die, indien zij haar wel bekend waren geweest, redelijkerwijs voor haar grond hadden opgeleverd de overeenkomst
      niet of op andere voorwaarden aan te gaan, is deze wederpartij bevoegd de overeenkomst op te zeggen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel68
  - number: '68.2'
    text: |-
      De opzegging geschiedt door schriftelijke kennisgeving en de overeenkomst eindigt op het ogenblik van ontvangst
      daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel68
  - number: '68.3'
    text: |-
      Naar maatstaven van redelijkheid en billijkheid zijn partijen na opzegging der overeenkomst verplicht elkaar de
      daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel68
  - number: '69.1'
    text: |-
      De expediteur is gerechtigd afgifte van zaken of documenten, die hij in verband met de overeenkomst onder zich
      heeft, te weigeren aan ieder, die uit anderen hoofde dan de overeenkomst tot doen vervoeren recht heeft op
      aflevering daarvan, tenzij daarop beslag is gelegd en uit de vervolging van dit beslag een verplichting tot afgifte
      aan de beslaglegger voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel69
  - number: '69.2'
    text: |-
      De expediteur kan het recht van retentie uitoefenen op zaken of documenten, die hij in verband met de overeenkomst
      onder zich heeft, voor hetgeen hem terzake van de overeenkomst door zijn opdrachtgever verschuldigd is of zal
      worden. Hij kan dit recht tevens uitoefenen voor hetgeen bij wijze van rembours op de zaak drukt. Dit retentierecht
      vervalt zodra aan de expediteur is betaald het bedrag waarover geen geschil bestaat en voldoende zekerheid is
      gesteld voor de betaling van die bedragen, waaromtrent wel geschil bestaat of welker hoogte nog niet kan worden
      vastgesteld. De expediteur behoeft echter geen zekerheid te aanvaarden voor hetgeen bij wijze van rembours op de
      zaak drukt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel69
  - number: '69.3'
    text: |-
      De in dit artikel aan de expediteur toegekende rechten komen hem niet toe jegens een derde, indien hij op het
      tijdstip dat hij de zaak of het document onder zich kreeg, reden had te twijfelen aan de bevoegdheid van de
      opdrachtgever jegens die derde hem die zaak of dat document ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel69
  - number: '70'
    text: |-
      Indien een overeenkomst tot het doen vervoeren van goederen niet naar behoren wordt uitgevoerd, dan wel een zaak
      niet zonder vertraging ter bestemming wordt afgeleverd in de staat, waarin zij ter beschikking is gesteld, is de
      expediteur, die te dier zake door zijn wederpartij buiten overeenkomst wordt aangesproken, jegens deze niet verder
      aansprakelijk dan hij dit zou zijn op grond van de door hen gesloten overeenkomst tot het doen vervoeren van die
      zaak.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel70
  - number: '71'
    text: |-
      Indien een overeenkomst tot het doen vervoeren van goederen niet naar behoren wordt uitgevoerd, dan wel
      een zaak niet zonder vertraging ter bestemming wordt afgeleverd in de staat, waarin zij ter beschikking
      is gesteld, is de expediteur, die te dier zake buiten overeenkomst wordt aangesproken, behoudens de
      [artikelen 361 tot en met 366][ref1], [artikel 880][ref2] en [artikel 1081][ref3], niet verder aansprakelijk dan
      hij dit zou zijn tegenover zijn opdrachtgever.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel361
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel880
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel1081
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '361'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '880'
        hoofdstuk: III
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '1081'
        hoofdstuk: IV
        afdeling: '1'
  - number: '72'
    text: |-
      Indien een vordering, als genoemd in het vorige artikel, buiten overeenkomst wordt ingesteld tegen een
      ondergeschikte van de expediteur, dan is deze ondergeschikte, mits hij de schade veroorzaakte in de werkzaamheden,
      waartoe hij werd gebruikt, niet verder aansprakelijk dan een dergelijke expediteur, die hem tot deze werkzaamheden
      gebruikte, dit op grond van het vorige artikel zou zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel72
  - number: '73'
    text: |-
      Het totaal van de bedragen, verhaalbaar op de expediteur, al dan niet gezamenlijk met het bedrag, verhaalbaar op de
      wederpartij van degene die de vordering instelt, en hun ondergeschikten mag, behoudens in geval van schade ontstaan
      uit eigen handeling of nalaten van de aangesprokene, geschied hetzij met het opzet die schade te veroorzaken,
      hetzij roekeloos en met de wetenschap dat die schade er waarschijnlijk uit zou voortvloeien, niet overtreffen het
      totaal, dat op grond van de door hen ingeroepen overeenkomst is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel73
  - number: '80.1'
    text: |-
      De overeenkomst van personenvervoer is de overeenkomst, waarbij de ene partij (de vervoerder) zich tegenover de
      andere partij verbindt een of meer personen (reizigers) te vervoeren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel80
  - number: '80.2'
    text: |-
      De overeenkomst van personenvervoer als omschreven in [artikel 100][ref1] is geen overeenkomst van personenvervoer
      in de zin van deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel100
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '100'
        hoofdstuk: I
        afdeling: '5'
  - number: '81'
    text: |-
      De vervoerder is aansprakelijk voor schade veroorzaakt door dood of letsel in verband met het vervoer aan de
      reiziger overkomen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel81
  - number: '82.1'
    text: |-
      De vervoerder is niet aansprakelijk voor schade ontstaan door dood of letsel, voor zover deze dood of dit letsel is
      veroorzaakt door een omstandigheid die een zorgvuldig vervoerder niet heeft kunnen vermijden en voor zover zulk een
      vervoerder de gevolgen daarvan niet heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel82
  - number: '82.2'
    text: |-
      De vervoerder kan niet om zich van zijn aansprakelijkheid voor schade door dood of letsel van de reiziger
      veroorzaakt te ontheffen, beroep doen op de gebrekkigheid of het slecht functioneren van het vervoermiddel of van
      het materiaal waarvan hij zich voor het vervoer bedient.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel82
  - number: '83'
    text: |-
      Indien de vervoerder bewijst, dat schuld of nalatigheid van de reiziger schade heeft veroorzaakt of daartoe heeft
      bijgedragen, kan de aansprakelijkheid van de vervoerder daarvoor geheel of gedeeltelijk worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel83
  - number: '84'
    text: |-
      Nietig is ieder voor het aan de reiziger overkomen voorval gemaakt beding waarbij de ingevolge [artikel 81][ref1]
      op de vervoerder drukkende aansprakelijkheid of bewijslast wordt verminderd op andere wijze dan in deze afdeling
      is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel81
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '81'
        hoofdstuk: I
        afdeling: '4'
  - number: '85.1'
    text: |-
      In geval van aan de reiziger overkomen letsel en van de dood van de reiziger zijn de [artikelen 107][ref1] en
      [108 van Boek 6][ref2] niet van toepassing op de vorderingen die de vervoerder als wederpartij van een andere
      vervoerder tegen deze laatste instelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel108
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '108'
  - number: '85.2'
    text: |-
      De aansprakelijkheid van de vervoerder is in geval van dood of letsel van de reiziger beperkt tot een bij of
      krachtens algemene maatregel van bestuur te bepalen bedrag of bedragen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel85
  - number: '86'
    text: |-
      De wederpartij van de vervoerder is verplicht deze de schade te vergoeden die hij lijdt doordat de reiziger, door
      welke oorzaak dan ook, niet tijdig ten vervoer aanwezig is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel86
  - number: '87'
    text: |-
      De wederpartij van de vervoerder is verplicht deze de schade te vergoeden die hij lijdt doordat de documenten met
      betrekking tot de reiziger, die van haar zijde voor het vervoer vereist zijn, door welke oorzaak dan ook, niet naar
      behoren aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel87
  - number: '88.1'
    text: |-
      Wanneer vóór of tijdens het vervoer omstandigheden aan de zijde van de wederpartij van de vervoerder of de
      reiziger zich opdoen of naar voren komen, die de vervoerder bij het sluiten van de overeenkomst niet behoefde
      te kennen, doch die, indien zij hem wel bekend waren geweest, redelijkerwijs voor hem grond hadden opgeleverd
      de vervoerovereenkomst niet of op andere voorwaarden aan te gaan, is de vervoerder bevoegd de overeenkomst op te
      zeggen en de reiziger uit het vervoermiddel te verwijderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel88
  - number: '88.2'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving aan de wederpartij van de vervoerder of
      aan de reiziger en de overeenkomst eindigt op het ogenblik van ontvangst van de eerst ontvangen kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel88
  - number: '88.3'
    text: |-
      Naar maatstaven van redelijkheid en billijkheid zijn partijen na opzegging der overeenkomst verplicht elkaar de
      daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel88
  - number: '89.1'
    text: |-
      Wanneer vóór of tijdens het vervoer omstandigheden aan de zijde van de vervoerder zich opdoen of naar voren komen,
      die diens wederpartij bij het sluiten van de overeenkomst niet behoefde te kennen, doch die, indien zij haar wel
      bekend waren geweest, redelijkerwijs voor haar grond hadden opgeleverd de vervoerovereenkomst niet of op andere
      voorwaarden aan te gaan, is deze wederpartij van de vervoerder bevoegd de overeenkomst op te zeggen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel89
  - number: '89.2'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving en de overeenkomst eindigt op het ogenblik
      van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel89
  - number: '89.3'
    text: |-
      Naar maatstaven van redelijkheid en billijkheid zijn partijen na opzegging der overeenkomst verplicht elkaar de
      daardoor geleden schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel89
  - number: '90.1'
    text: |-
      De wederpartij van de vervoerder is steeds bevoegd de overeenkomst op te zeggen. Zij is verplicht de vervoerder de
      schade te vergoeden, die deze ten gevolge van de opzegging lijdt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel90
  - number: '90.2'
    text: Zij kan dit recht niet uitoefenen, wanneer daardoor de reis van het vervoermiddel zou worden vertraagd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel90
  - number: '90.3'
    text: |-
      De opzegging geschiedt door een mondelinge of schriftelijke kennisgeving en de overeenkomst eindigt op het ogenblik
      van ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel90
  - number: '91'
    text: |-
      Wordt de vervoerder, zijn wederpartij, de reiziger of een ondergeschikte van een hunner buiten overeenkomst
      aangesproken, dan zijn de [artikelen 361 tot en met 366][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel361
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '361'
        hoofdstuk: II
        afdeling: '1'
  - number: '92'
    text: Deze afdeling geldt slechts ten aanzien van niet elders in dit boek geregelde overeenkomsten van personenvervoer.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel92
  - number: '100.1'
    text: |-
      De overeenkomst van personenvervoer in de zin van deze afdeling is de overeenkomst van personenvervoer, waarbij
      de ene partij (de vervoerder) zich tegenover de andere partij verbindt aan boord van een vervoermiddel, geen
      luchtvaartuig noch luchtkussenvoertuig zijnde, een of meer personen (reizigers) en al dan niet hun handbagage
      binnen Nederland hetzij langs spoorstaven hetzij op andere wijze en dan volgens een voor een ieder kenbaar schema
      van reismogelijkheden (dienstregeling) te vervoeren. Tijd- of reisbevrachting is, voor zover het niet betreft
      vervoer langs spoorstaven, geen overeenkomst van personenvervoer in de zin van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel100
  - number: '100.2'
    text: |-
      Als vervoerder in de zin van deze afdeling wordt tevens beschouwd de instantie die op een mogelijkerwijs afgegeven
      vervoerbewijs is vermeld. Wordt enig vervoerbewijs afgegeven dan zijn de artikelen 56, tweede lid, 75, eerste lid
      en 186, eerste lid van boek 2 niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel100
  - number: '100.3'
    text: |-
      In deze afdeling wordt onder handbagage verstaan de bagage met inbegrip van levende dieren, die de reiziger als
      gemakkelijk mee te voeren, draagbare dan wel met de hand verrijdbare zaken op of bij zich heeft.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel100
  - number: '100.4'
    text: |-
      Bij algemene maatregel van bestuur, die voor ieder vervoermiddel onderling verschillende bepalingen kan bevatten,
      kunnen zaken, die geen handbagage zijn, voor de toepassing van bepalingen van deze afdeling als handbagage worden
      aangewezen, dan wel bepalingen van deze afdeling niet van toepassing worden verklaard op zaken, die handbagage
      zijn.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel100
  - number: '101.1'
    text: |-
      Indien een of meer vervoerders zich bij een en dezelfde overeenkomst verbinden tot vervoer met onderling al dan
      niet van aard verschillende vervoermiddelen, gelden voor ieder deel van het vervoer de op dat deel toepasselijke
      rechtsregelen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel101
  - number: '101.2'
    text: |-
      Indien een voertuig dat voor het vervoer wordt gebezigd aan boord van een schip wordt vervoerd, gelden voor dat
      deel van het vervoer de op het vervoer te water toepasselijke rechtsregelen, met dien verstande echter dat de
      vervoerder zich niet kan beroepen op lichamelijke of geestelijke tekortkomingen van de bestuurder van het voertuig
      die in de tijd, dat de reiziger aan boord daarvan was, tot schade leidden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel101
  - number: '101.3'
    text: |-
      Bij de overeenkomst waarbij de ene partij zich bij een en dezelfde overeenkomst tegenover de andere partij verbindt
      deels tot het vervoer van personen als bedoeld in [artikel 100][ref1], deels tot ander vervoer, gelden voor ieder
      deel van het vervoer de op dat deel toepasselijke rechtsregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel100
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '100'
        hoofdstuk: I
        afdeling: '5'
  - number: '102.1'
    text: |-
      Vervoer van personen omvat uitsluitend de tijd dat de reiziger aan boord van het vervoermiddel is, daarin instapt
      of daaruit uitstapt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel102
  - number: '102.2'
    text: |-
      Vervoer van personen per schip omvat bovendien de tijd dat de reiziger te water wordt vervoerd tussen wal en schip
      of tussen schip en wal, indien de prijs hiervan in de vracht is inbegrepen of het voor dit hulpvervoer gebezigde
      schip door de vervoerder ter beschikking van de reiziger is gesteld. Het omvat echter niet de tijd dat de reiziger
      verblijft op een ponton, een steiger, een veerstoep of enig ander schip, dat ligt tussen de wal en het schip aan
      boord waarvan hij vervoerd zal worden of werd, in een stationsgebouw, op een kade of enige andere haveninstallatie.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel102
  - number: '103.1'
    text: |-
      Vervoer van handbagage omvat uitsluitend de tijd dat deze aan boord van het vervoermiddel is, daarin wordt
      ingeladen of daaruit wordt uitgeladen, alsmede de tijd dat zij onder de hoede van de vervoerder is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel103
  - number: '103.2'
    text: |-
      Vervoer van handbagage per schip omvat bovendien de tijd dat de handbagage te water wordt vervoerd tusen wal
      en schip of tussen schip en wal, indien de prijs hiervan in de vracht is inbegrepen of het voor dit hulpvervoer
      gebezigde schip door de vervoerder ter beschikking van de reiziger is gesteld. Het omvat echter niet de tijd dat
      de handbagage zich bevindt op een ponton, een steiger, een veerstoep of enig ander schip, dat ligt tussen de wal
      en het schip aan boord waarvan zij vervoerd zal worden of werd, in een stationsgebouw, op een kade of enige andere
      haveninstallatie, tenzij zij zich daar onder de hoede van de vervoerder bevindt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel103
  - number: '105.1'
    text: |-
      De vervoerder is aansprakelijk voor schade veroorzaakt door dood of letsel van de reiziger ten gevolge van een
      ongeval dat in verband met en tijdens het vervoer aan de reiziger is overkomen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel105
  - number: '105.2'
    text: |-
      In afwijking van het eerste lid is de vervoerder niet aansprakelijk, voor zover het ongeval is veroorzaakt door
      een omstandigheid die een zorgvuldig vervoerder niet heeft kunnen vermijden en voor zover zulk een vervoerder de
      gevolgen daarvan niet heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel105
  - number: '105.3'
    text: |-
      Lichamelijke of geestelijke tekortkomingen van de bestuurder van het voertuig alsmede gebrekkigheid of slecht
      functioneren van het vervoermiddel of van het materiaal, waarvan hij zich voor het vervoer bedient, worden
      aangemerkt als een omstandigheid die een zorgvuldig vervoerder heeft kunnen vermijden en waarvan zulk een
      vervoerder de gevolgen heeft kunnen verhinderen. Onder materiaal wordt niet begrepen een ander vervoermiddel aan
      boord waarvan het vervoermiddel zich bevindt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel105
  - number: '105.4'
    text: |-
      Bij de toepassing van het tweede lid wordt slechts dan rekening gehouden met een gedraging van een derde, indien
      geen andere omstandigheid, die mede tot het ongeval leidde, voor rekening van de vervoerder is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel105
  - number: '106.1'
    text: |-
      De vervoerder is aansprakelijk voor schade veroorzaakt door geheel of gedeeltelijk verlies dan wel beschadiging van
      handbagage of van een als bagage ten vervoer aangenomen voertuig of schip en de zaken aan boord daarvan, voor zover
      dit verlies of deze beschadiging is ontstaan tijdens het vervoer en is veroorzaakt
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel106
  - number: 106.1.a
    text: door een aan de reiziger overkomen ongeval dat voor rekening van de vervoerder komt, of
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel106
  - number: 106.1.b
    text: |-
      door een omstandigheid die een zorgvuldig vervoerder heeft kunnen vermijden of waarvan zulk een vervoerder de
      gevolgen heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel106
  - number: '106.2'
    text: |-
      Lichamelijke of geestelijke tekortkomingen van de bestuurder van het voertuig alsmede gebrekkigheid of slecht
      functioneren van het vervoermiddel of van het materiaal waarvan hij zich voor het vervoer bedient, worden
      aangemerkt als een omstandigheid die een zorgvuldig vervoerder heeft kunnen vermijden en waarvan zulk een
      vervoerder de gevolgen heeft kunnen verhinderen. Onder materiaal wordt niet begrepen een ander vervoermiddel aan
      boord waarvan het vervoermiddel zich bevindt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel106
  - number: '106.3'
    text: |-
      Bij de toepassing van het eerste lid wordt slechts dan rekening gehouden met een gedraging van een derde, indien
      geen andere omstandigheid die mede tot het voorval leidde voor rekening van de vervoerder is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel106
  - number: '106.4'
    text: |-
      Dit artikel laat de [artikelen 545][ref1] en [1006][ref2] onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel545
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1006
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '545'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1006'
        hoofdstuk: III
        afdeling: '1'
  - number: '107'
    text: |-
      De vervoerder is terzake van door de reiziger aan boord van het vervoermiddel gebrachte zaken, die hij, indien hij
      hun aard of gesteldheid had gekend, niet aan boord van het vervoermiddel zou hebben toegelaten en waarvoor hij geen
      bewijs van ontvangst heeft afgegeven, geen enkele schadevergoeding verschuldigd indien de reiziger wist of behoorde
      te weten dat de vervoerder de zaken niet ten vervoer zou hebben toegelaten; de reiziger is alsdan aansprakelijk
      voor alle kosten en schaden voor de vervoerder voortvloeiend uit de aanbieding ten vervoer of uit het vervoer zelf.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel107
  - number: '108'
    text: |-
      De vervoerder is niet aansprakelijk voor schade die is veroorzaakt door vertraging, door welke oorzaak dan ook
      vóór, tijdens of na het vervoer opgetreden, dan wel is veroorzaakt door welke afwijking van de dienstregeling dan
      ook.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel108
  - number: '109.1'
    text: |-
      Indien de vervoerder bewijst, dat schuld of nalatigheid van de reiziger schade heeft veroorzaakt of daartoe heeft
      bijgedragen, kan de aansprakelijkheid van de vervoerder daarvoor geheel of gedeeltelijk worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel109
  - number: '109.2'
    text: |-
      Indien personen van wier hulp de vervoerder bij de uitvoering van zijn verbintenis gebruik maakt, op verzoek van
      de reiziger diensten bewijzen, waartoe de vervoerder niet is verplicht, worden zij aangemerkt als te handelen in
      opdracht van de reiziger aan wie zij deze diensten bewijzen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel109
  - number: '110.1'
    text: |-
      De in deze afdeling bedoelde aansprakelijkheid van de vervoerder is beperkt tot bij of krachtens algemene maatregel
      van bestuur te bepalen bedrag of bedragen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel110
  - number: '110.2'
    text: |-
      Dit artikel laat de [titels 7][ref1] en [12][ref2] van dit boek onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005034#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005034
        hoofdstuk: III
  - number: '111.1'
    text: |-
      De vervoerder kan zich niet beroepen op enige beperking van zijn aansprakelijkheid, voor zover de schade is
      ontstaan uit zijn eigen handeling of nalaten, geschied hetzij met het opzet die schade te veroorzaken, hetzij
      roekeloos en met de wetenschap dat die schade er waarschijnlijk uit zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel111
  - number: '111.2'
    text: Nietig is ieder beding, waarbij van dit artikel wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel111
  - number: '112'
    text: |-
      Nietig is ieder vóór het aan de reiziger overkomen ongeval, of vóór het verlies of de beschadiging van handbagage
      of van als bagage ten vervoer aangenomen vaartuig of schip en de zaken aan boord daarvan, gemaakt beding, waarbij
      de ingevolge de [artikelen 105][ref1] en [106][ref2] op de vervoerder drukkende aansprakelijkheid of bewijslast
      wordt verminderd op andere wijze dan in deze afdeling is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel106
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '105'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '106'
        hoofdstuk: I
        afdeling: '5'
  - number: '113.1'
    text: |-
      In geval van verlies of beschadiging van handbagage wordt de vordering tot schadevergoeding gewaardeerd naar de
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel113
  - number: '113.2'
    text: |-
      In geval van aan de reiziger overkomen letsel en van de dood van de reiziger zijn de [artikelen 107][ref1] en
      [108 van Boek 6][ref2] niet van toepassing op de vorderingen die de vervoerder als wederpartij van een andere
      vervoerder tegen deze laatste instelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel108
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '108'
  - number: '114.1'
    text: |-
      Onverminderd [artikel 107][ref1] en onverminderd [artikel 179 van Boek 6][ref2] is de reiziger aansprakelijk
      voor schade veroorzaakt door zijn handeling of nalaten, dan wel door zijn handbagage of een als bagage aangenomen
      voertuig of schip en de zaken aan boord daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel179
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '107'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '179'
  - number: '114.2'
    text: |-
      In afwijking van het eerste lid is de reiziger niet aansprakelijk, voor zover de schade is veroorzaakt door een
      omstandigheid die een zorgvuldig reiziger niet heeft kunnen vermijden en voor zover zulk een reiziger de gevolgen
      daarvan niet heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel114
  - number: '114.3'
    text: |-
      De hoedanigheid of een gebrek van zijn handbagage, of een als bagage aangenomen vaartuig of schip en de zaken aan
      boord daarvan, wordt aangemerkt als een omstandigheid die een zorgvuldig reiziger heeft kunnen vermijden en waarvan
      zulk een reiziger de gevolgen heeft kunnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel114
  - number: '114.4'
    text: |-
      De schade wordt aangemerkt het door de vervoerder naar zijn redelijk oordeel vast te stellen bedrag te belopen,
      doch indien de vervoerder meent dat de schade meer dan € 227 beloopt moet hij zulks bewijzen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel114
  - number: '115'
    text: |-
      Behoeft deze afdeling in het belang van een goede uitvoering ervan nadere regeling, dan geschiedt dit bij algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel115
  - number: '116'
    text: |-
      Wordt de vervoerder, zijn wederpartij, de reiziger of een ondergeschikte van een dezer buiten overeenkomst
      aangesproken, dan zijn de [artikelen 361 tot en met 366][ref1] en [1081][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel361
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1081
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '361'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1081'
        hoofdstuk: IV
        afdeling: '1'
  - number: '120'
    text: |-
      De overeenkomst van gecombineerd vervoer van personen is de overeenkomst van personenvervoer, waarbij de vervoerder
      (gecombineerd vervoerder) zich bij een en dezelfde overeenkomst verbindt dat het vervoer deels over zee, over
      binnenwateren, over de weg, langs spoorstaven, door de lucht dan wel door middel van enige andere vervoerstechniek
      zal geschieden.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel120
  - number: '121'
    text: |-
      Bij een overeenkomst van gecombineerd vervoer van personen gelden voor ieder deel van het vervoer de op dat deel
      toepasselijke rechtsregelen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel121
  - number: '160.1'
    text: |-
      Indien een zeeschip blijkens de openbare registers bedoeld in [afdeling 2 van Titel 1 van Boek 3][ref1] aan twee of
      meer personen gezamenlijk toebehoort, bestaat tussen hen een rederij. Wanneer de eigenaren van het schip onder een
      gemeenschappelijke naam optreden bestaat slechts een rederij, indien zulks uitdrukkelijk bij akte is overeengekomen
      en deze akte in die registers is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '160.2'
    text: De rederij is geen rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel160
  - number: '161'
    text: |-
      Iedere mede-eigenaar is van rechtswege lid der rederij. Wanneer een lid ophoudt eigenaar te zijn, eindigt zijn
      lidmaatschap van rechtswege.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel161
  - number: '162'
    text: |-
      De leden der rederij moeten zich jegens elkander gedragen naar hetgeen door de redelijkheid en de billijkheid wordt
      gevorderd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel162
  - number: '163'
    text: In iedere rederij kan een boekhouder worden aangesteld. Een vennootschap is tot boekhouder benoembaar.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel163
  - number: '164'
    text: |-
      De boekhouder kan slechts met toestemming van de leden der rederij overgaan tot enige buitengewone herstelling van
      het schip of tot benoeming of ontslag van een kapitein.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel164
  - number: '165'
    text: |-
      De boekhouder geeft aan ieder lid der rederij op diens verlangen kennis en opening van alle aangelegenheden de
      rederij betreffende en inzage van alle boeken, brieven en documenten, op zijn beheer betrekking hebbende.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel165
  - number: '166'
    text: |-
      De boekhouder is verplicht, zo dikwijls een terzake mogelijk bestaand gebruik dit medebrengt, doch in ieder geval
      telkens na verloop van een jaar en bij het einde van zijn beheer, binnen zes maanden aan de leden der rederij
      rekening en verantwoording te doen van zijn beheer met overlegging van alle bewijsstukken daarop betrekking
      hebbende. Hij is verplicht aan ieder van hen uit te keren wat hem toekomt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel166
  - number: '167'
    text: |-
      Ieder lid der rederij is verplicht de rekening en verantwoording van de boekhouder binnen drie maanden op te nemen
      en te sluiten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel167
  - number: '168'
    text: |-
      De goedkeuring der rekening en verantwoording door de meerderheid van de leden der rederij bindt slechts hen,
      die daartoe hebben medegewerkt, behoudens dat zij ook een lid dat aan de rekening en verantwoording niet heeft
      medegewerkt bindt, wanneer dit lid nalaat de rekening en verantwoording in rechte te betwisten binnen één jaar,
      nadat hij daarvan heeft kunnen kennis nemen en nadat de goedkeuring door de meerderheid hem schriftelijk is
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel168
  - number: '169.1'
    text: |-
      De betrekking van de boekhouder eindigt, indien over hem een provisionele bewindvoerder is benoemd, hij onder
      curatele is gesteld, terzake van krankzinnigheid in een gesticht is geplaatst, in staat van faillissement is
      verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard,
      hij niet langer de nationaliteit van een van de lid-staten van de Europese Gemeenschappen of van een van de
      overige Staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte bezit of buiten het
      grondgebied van een van de lid-staten van de Europese Gemeenschappen of van een van de overige Staten die partij
      zijn bij de Overeenkomst betreffende de Europese Economische Ruimte gaat wonen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel169
  - number: '169.2'
    text: |-
      De betrekking van een vennootschap als boekhouder eindigt indien deze vennootschap ophoudt een rechtspersoon als
      bedoeld in [artikel 311, derde lid, van het Wetboek van Koophandel][ref1] te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '311'
  - number: '170.1'
    text: |-
      Is de boekhouder lid der rederij, dan heeft hij, indien de leden zijn betrekking doen eindigen of hem een dringende
      reden hebben gegeven op grond waarvan hij zijnerzijds de betrekking doet eindigen, het recht te verlangen, dat zijn
      aandeel door de overige leden wordt overgenomen tegen zodanige prijs als deskundigen het op het tijdstip, waarop
      hij de overneming verlangt, waard zullen achten. Hij heeft dit recht niet, indien hij aan de leden der rederij een
      dringende reden heeft gegeven op grond waarvan zij de betrekking doen eindigen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel170
  - number: '170.2'
    text: |-
      Hij moet van zijn verlangen tot overneming kennis geven aan de leden der rederij binnen een maand, nadat zijn
      betrekking is geëindigd. Wanneer aan zijn verlangen niet binnen een maand is voldaan of wanneer niet binnen twee
      weken na het overnemen van zijn aandeel de daarvoor bepaalde prijs aan hem is voldaan, kan de rechter op een binnen
      twee maanden door de boekhouder gedaan verzoek bevelen dat het schip wordt verkocht. De wijze van verkoop wordt
      door de rechter bepaald.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel170
  - number: '170.3'
    text: |-
      Door ieder van hen die tot de overneming verplicht zijn, wordt van het overgenomen aandeel een gedeelte verkregen,
      evenredig aan zijn aandeel in het schip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel170
  - number: '171.1'
    text: |-
      Alle besluiten, de aangelegenheden der rederij betreffende, worden genomen bij meerderheid van stemmen van de leden
      der rederij.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel171
  - number: '171.2'
    text: |-
      Het kleinste aandeel geeft één stem; ieder groter aandeel zoveel stemmen als het aantal malen, dat in dit aandeel
      het kleinste begrepen is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel171
  - number: '171.3'
    text: Besluiten tot
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel171
  - number: 171.3.a
    text: |-
      aanstelling van een boekhouder, die buiten het grondgebied van een van de lid-staten van de Europese
      Gemeenschappen of van een van de overige Staten die partij zijn bij de Overeenkomst betreffende de Europese
      Economische Ruimte woont, niet is lid der rederij, niet de nationaliteit van een van de lid-staten van de
      Europese Gemeenschappen of van een van de overige Staten die partij zijn bij de Overeenkomst betreffende
      de Europese Economische Ruimte bezit of een vennootschap is, niet zijnde een rechtspersoon als bedoeld in
      [artikel 311, derde lid, van het Wetboek van Koophandel][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '311'
  - number: 171.3.b
    text: uitbreiding van de bevoegdheid van de boekhouder buiten de grenzen getrokken door artikel 178 eerste lid,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel171
  - number: 171.3.c
    text: |-
      het sluiten, voor meer dan zes maanden, van een rompbevrachting, een tijdbevrachting of een overeenkomst, als
      genoemd in artikel 531 of artikel 991,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel171
  - number: 171.3.d
    text: |-
      ontbinding der rederij tijdens de loop van een overeenkomst tot vervoer, van een overeenkomst waarbij het schip ter
      beschikking van een ander is gesteld, of van een ter visvangst ondernomen reis,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel171
  - number: 171.3.e
    text: |-
      de gehele of gedeeltelijke overdracht van een aandeel in het schip, waardoor dit de hoedanigheid van Nederlands
      schip zou verliezen,
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel171
  - number: '172'
    text: |-
      Op rederijen van zeevissersschepen is [artikel 171 derde lid, onder a][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel171
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '171'
        hoofdstuk: II
        afdeling: '1'
  - number: '173'
    text: |-
      Indien tengevolge van staking der stemmen de exploitatie van het schip wordt belet, kan de rechter op een binnen
      twee maanden door een lid der rederij gedaan verzoek bevelen dat het schip wordt verkocht. De wijze van verkoop
      wordt door de rechter bepaald.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel173
  - number: '174.1'
    text: |-
      Indien is besloten omtrent enige buitengewone herstelling van het schip, omtrent benoeming of ontslag van de
      kapitein, dan wel omtrent het aangaan van een vervoerovereenkomst waarbij het schip ter beschikking van een ander
      wordt gesteld, kan ieder lid der rederij, dat tot het besluit niet heeft medegewerkt of daartegen heeft gestemd,
      verlangen dat zij die vóór het besluit hebben gestemd, zijn aandeel overnemen tegen zodanige prijs, als deskundigen
      het op het tijdstip, waarop hij de overneming verlangt, waard zullen achten. Hij moet van zijn verlangen tot
      overneming kennisgeven aan de boekhouder of, indien er geen boekhouder is, aan hen, die voorstemden, binnen een
      maand nadat het besluit te zijner kennis is gebracht. Wanneer aan zijn verlangen niet binnen een maand is voldaan
      of wanneer niet binnen twee weken na het overnemen van zijn aandeel de daarvoor bepaalde prijs aan hem is voldaan,
      kan de rechter op een binnen twee maanden door het lid der rederij gedaan verzoek bevelen dat het schip wordt
      verkocht. De wijze van verkoop wordt door de rechter bepaald.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel174
  - number: '174.2'
    text: |-
      Door ieder van hen die tot de overneming verplicht zijn, wordt van het overgenomen aandeel een gedeelte verkregen,
      evenredig aan zijn aandeel in het schip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel174
  - number: '175'
    text: |-
      Indien anders dan door overdracht van een aandeel in het schip, dit schip zou ophouden een Nederlands schip te
      zijn in de zin van [artikel 311 van het Wetboek van Koophandel][ref1], kan de rechter, op een binnen twee maanden
      door een lid der rederij gedaan verzoek, bevelen, dat het aandeel in het schip wordt verkocht. De wijze van verkoop
      wordt door de rechter bepaald. Het aandeel mag alleen worden toegewezen aan een gegadigde, door wiens verkrijging
      het schip weer een Nederlands schip is in de zin van [artikel 311 van het Wetboek van Koophandel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel311
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '311'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '311'
  - number: '176'
    text: |-
      De leden der rederij moeten naar evenredigheid van hun aandeel bijdragen tot de uitgaven der rederij, waartoe
      bevoegdelijk is besloten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel176
  - number: '177'
    text: De leden der rederij delen in de winst en het verlies naar evenredigheid van hun aandeel in het schip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel177
  - number: '178.1'
    text: |-
      Is een boekhouder aangesteld, dan is hij, onverminderd [artikel 360 eerste lid][ref1] en met uitsluiting van ieder
      lid der rederij, in alles wat de normale exploitatie van het schip medebrengt, bevoegd voor de rederij met derden
      te handelen en de rederij te vertegenwoordigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel360
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '360'
        hoofdstuk: II
        afdeling: '1'
  - number: '178.2'
    text: |-
      Indien de rederij in het handelsregister is ingeschreven kunnen beperkingen van de bevoegdheid van de boekhouder
      aan derden, die daarvan onkundig waren, niet worden tegengeworpen, tenzij deze beperkingen uit dat register
      blijken. Is de rederij niet in het handelsregister ingeschreven, dan kunnen beperkingen van de bevoegdheid van de
      boekhouder aan derden slechts worden tegengeworpen, wanneer hun die bekend waren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel178
  - number: '178.3'
    text: De boekhouder heeft alle verplichtingen na te komen, die de wet de reder oplegt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel178
  - number: '179'
    text: |-
      Indien de rederij in het handelsregister is ingeschreven, kunnen de aanstelling van een boekhouder of het eindigen
      van diens betrekking aan derden, die daarvan onkundig waren, niet worden tegengeworpen zo lang niet inschrijving
      daarvan in het handelsregister heeft plaats gehad. Is de rederij niet in het handelsregister ingeschreven
      dan kunnen de aanstelling van een boekhouder of het eindigen van diens betrekking aan derden slechts worden
      tegengeworpen wanneer dit hun bekend was.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel179
  - number: '180.1'
    text: |-
      Indien er geen boekhouder is, alsmede in geval van ontstentenis of belet van de boekhouder, wordt de rederij
      vertegenwoordigd en kan voor haar worden gehandeld door een of meer harer leden, mits alleen of tezamen eigenaars
      zijnde van meer dan de helft van het schip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel180
  - number: '180.2'
    text: |-
      In de gevallen genoemd in het eerste lid kunnen handelingen, die geen uitstel kunnen lijden, zo nodig door ieder
      lid zelfstandig worden verricht en is ieder lid bevoegd ten behoeve van de rederij verjaring te stuiten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel180
  - number: '181'
    text: |-
      Voor de verbintenissen van de rederij zijn haar leden aansprakelijk, ieder naar evenredigheid van zijn aandeel in
      het schip.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel181
  - number: '182'
    text: |-
      De rederij wordt niet ontbonden door de dood van een harer leden noch door diens faillissement, het van toepassing
      verklaren van de schuldsaneringsregeling natuurlijke personen, plaatsing ter zake van krankzinnigheid in een
      gesticht of plaatsing onder curatele.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel182
  - number: '183'
    text: |-
      Het lidmaatschap der rederij kan niet worden opgezegd; evenmin kan een lid van het lidmaatschap der rederij worden
      vervallen verklaard.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel183
  - number: '184'
    text: |-
      Indien tot ontbinding der rederij is besloten, moet het schip worden verkocht. Indien binnen twee maanden na het
      besluit het schip nog niet is verkocht, kan de rechter op een binnen twee maanden door een lid der rederij gedaan
      verzoek, bevelen tot deze verkoop over te gaan. De wijze van verkoop wordt door de rechter bepaald. Een besluit tot
      verkoop of een ingevolge [artikel 170][ref1], [artikel 173][ref2] of [artikel 174][ref3] gegeven bevel tot verkoop
      van het schip staat gelijk met een besluit tot ontbinding der rederij.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel170
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel173
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel174
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '170'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '173'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '174'
        hoofdstuk: II
        afdeling: '1'
  - number: '185.1'
    text: Na ontbinding blijft de rederij bestaan voor zover dit tot haar vereffening nodig is.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel185
  - number: '185.2'
    text: De boekhouder, zo die er is, is met de vereffening belast.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel185
  - number: '186'
    text: |-
      Nietig is ieder beding, waarbij wordt afgeweken van de [artikelen 161-163][ref1], [169][ref2],
      [170 eerste en tweede lid][ref3], [178 derde lid][ref4], [180][ref5], [182][ref6] en [183][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel161
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel169
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel170
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel178
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Artikel180
      [ref6]: https://wetten.overheid.nl/BWBR0005034#Artikel182
      [ref7]: https://wetten.overheid.nl/BWBR0005034#Artikel183
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '161'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '169'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '170'
        hoofdstuk: II
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '178'
        hoofdstuk: II
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0005034
        artikel: '180'
        hoofdstuk: II
        afdeling: '1'
      - id: ref6
        bwb_id: BWBR0005034
        artikel: '182'
        hoofdstuk: II
        afdeling: '1'
      - id: ref7
        bwb_id: BWBR0005034
        artikel: '183'
        hoofdstuk: II
        afdeling: '1'
  - number: '190.1'
    text: |-
      In de [afdelingen 2 tot en met 5 van titel 3][ref1] worden onder schepen mede verstaan schepen in aanbouw. Onder
      reder wordt mede verstaan de eigenaar van een zeeschip in aanbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '2'
  - number: '190.2'
    text: |-
      Indien een schip in aanbouw een schip in de zin van [artikel 1][ref1] is geworden, ontstaat daardoor niet een nieuw
      schip.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1'
        hoofdstuk: I
  - number: '191'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel191
  - number: 191.a
    text: |-
      de openbare registers: de openbare registers, bedoeld in [afdeling 2 van Titel 1 van Boek 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 191.b
    text: |-
      het register: het register bedoeld in [artikel 193][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel193
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '193'
        hoofdstuk: II
        afdeling: '2'
  - number: '192'
    text: |-
      De in deze afdeling aan de reder opgelegde verplichtingen rusten, indien het schip toebehoort aan meer personen,
      aan een vennootschap onder firma, aan een commanditaire vennootschap of aan een rechtspersoon, mede op iedere mede-
      eigenaar, beherende vennoot of bestuurder.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel192
  - number: '193'
    text: |-
      Er wordt een afzonderlijk openbaar register gehouden voor de teboekstelling van zeeschepen, dat deel uitmaakt van
      de openbare registers.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel193
  - number: '194.1'
    text: |-
      Teboekstelling is slechts mogelijk - van een in aanbouw zijnd zeeschip: indien het in Nederland in aanbouw is;
        - van een afgebouwd zeeschip: indien het een Nederlands schip is in de zin van
      [artikel 311 van het Wetboek van Koophandel][ref1]
        - dan wel ingeval het een zeevissersschip is: indien het is ingeschreven in een krachtens
      [artikel 3 der Visserijwet 1963][ref2] aangehouden register.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel3
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '311'
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '3'
  - number: '194.2'
    text: |-
      Teboekstelling is niet mogelijk van een zeeschip dat reeds teboekstaat in het register, in het in artikel 783
      genoemde register of in enig soortgelijk buitenlands register.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel194
  - number: '194.3'
    text: |-
      In afwijking van het tweede lid is teboekstelling van een zeeschip dat in een buitenlands register teboekstaat
      mogelijk, wanneer dit schip, nadat de teboekstelling ervan in dat register is doorgehaald, een Nederlands schip
      in de zin van [artikel 311 van het Wetboek van Koophandel][ref1] zal zijn of wanneer dit schip als zeevissersschip
      is ingeschreven in een krachtens [artikel 3 der Visserijwet 1963][ref2] aangehouden register. Deze teboekstelling
      heeft evenwel slechts rechtsgevolg, wanneer zij binnen 30 dagen is gevolgd door aantekening in het register, dat
      de teboekstelling in het buitenlandse register is doorgehaald, of wanneer, ingeval de bewaarder van een buitenlands
      register ondanks daartoe schriftelijk tot hem gericht verzoek doorhaling weigert, van dit verzoek en van het feit
      dat er geen gevolg aan is gegeven, aantekening in het Nederlandse register is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel3
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '311'
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '3'
  - number: '194.4'
    text: |-
      De teboekstelling wordt verzocht door de reder van het zeeschip. Hij moet daarbij ter inschrijving overleggen een
      door hem ondertekende verklaring, dat naar zijn beste weten het schip voor teboekstelling als zeeschip vatbaar
      is. Indien het een verzoek tot teboekstelling als zeeschip in aanbouw betreft, gaat deze verklaring vergezeld van
      een bewijs dat het schip in Nederland in aanbouw is. Indien het een verzoek tot teboekstelling als zeeschip, niet
      zijnde een zeeschip in aanbouw of een zeevissersschip, betreft, gaat deze verklaring vergezeld van een door of
      namens Onze Minister van Verkeer en Waterstaat afgegeven verklaring als bedoeld in [artikel 311][ref1]. Indien het
      een verzoek tot teboekstelling als zeevissersschip betreft, gaat deze verklaring vergezeld van een bewijs dat het
      schip is ingeschreven in een krachtens [artikel 3 van de Visserijwet 1963][ref2] aangehouden register.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311a
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel3
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 311a
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '3'
  - number: '194.5'
    text: |-
      De teboekstelling in het register heeft geen rechtsgevolg, wanneer aan de vereisten van de voorgaande leden van dit
      artikel niet is voldaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel194
  - number: '194.6'
    text: |-
      Bij het verzoek tot teboekstelling wordt woonplaats gekozen in Nederland. Deze woonplaats wordt in het verzoek tot
      teboekstelling vermeld en kan door een andere in Nederland gelegen woonplaats worden vervangen.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel194
  - number: '195.1'
    text: De teboekstelling wordt slechts doorgehaald
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel195
  - number: 195.1.a
    text: op verzoek van degeen, die in de openbare registers als reder vermeld staat;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel195
  - number: 195.1.b
    text: op aangifte van de reder of ambtshalve
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel195
  - number: 195.1.b.1°
    text: als het schip is vergaan, gesloopt is of blijvend ongeschikt voor drijven is geworden;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel195
  - number: 195.1.b.2°
    text: |-
      als van het schip gedurende 6 maanden na het laatste uitvaren of de dag, waartoe zich de laatst ontvangen berichten
      uitstrekken, in het geheel geen tijding is aangekomen, zonder dat dit aan een algemene storing in de berichtgeving
      kan worden geweten;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel195
  - number: 195.1.b.3°
    text: als het schip door rovers of vijanden is genomen;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel195
  - number: 195.1.b.4°
    text: |-
      als het schip, indien het niet in het register te boek zou staan, een binnenschip zou zijn in de zin van artikel 3
      of artikel 780;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel195
  - number: 195.1.b.5°
    text: |-
      als het schip niet of niet meer de hoedanigheid van Nederlands schip heeft dan wel niet of niet meer is
      ingeschreven in een krachtens [artikel 3 der Visserijwet 1963][ref1] aangehouden register. Ambtshalve doorhaling
      wegens het verlies van de hoedanigheid van Nederlands schip geschiedt uitsluitend na ontvangst van een mededeling
      van de intrekking van een verklaring als bedoeld in [artikel 311][ref2]. Wanneer het schip de hoedanigheid van
      Nederlands schip heeft verloren door toewijzing na een executie buiten Nederland, dan wel de inschrijving van het
      schip in een krachtens [artikel 3 der Visserijwet 1963][ref3] aangehouden register is doorgehaald, vindt doorhaling
      slechts plaats, wanneer hetzij de reder, degenen van wier recht uit een inschrijving blijkt en de beslagleggers
      gelegenheid hebben gehad hun rechten op de opbrengst geldend te maken en hun daartoe ook feitelijk de gelegenheid
      is gegeven, hetzij deze personen hun toestemming tot de doorhaling verlenen of hun vorderingen zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel311a
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel3
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel195
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 311a
      - id: ref3
        bwb_id: BWBR0002416
        artikel: '3'
  - number: '195.2'
    text: |-
      In de in het eerste lid onder *b* genoemde gevallen is de reder tot het doen van aangifte verplicht binnen drie
      maanden nadat de reden tot doorhaling zich heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel195
  - number: '195.3'
    text: |-
      Wanneer ten aanzien van het schip inschrijvingen of voorlopige aantekeningen ten gunste van derden bestaan,
      geschiedt doorhaling slechts, wanneer geen dezer derden zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel195
  - number: '195.4'
    text: Doorhaling geschiedt slechts na op verzoek van de meest gerede partij verleende machtiging van de rechter.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel195
  - number: '196.1'
    text: |-
      Zolang de teboekstelling in het register niet is doorgehaald heeft teboekstelling van een zeeschip in een
      buitenlands register of vestiging in het buitenland van rechten daarop, voor vestiging waarvan in Nederland
      inschrijving in de openbare registers vereist zou zijn geweest, geen rechtsgevolg.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel196
  - number: '196.2'
    text: |-
      In afwijking van het eerste lid wordt een teboekstelling of vestiging van rechten als daar bedoeld erkend, wanneer
      deze geschiedde onder voorwaarde van doorhaling van de teboekstelling in het Nederlandse register binnen 30 dagen
      na de teboekstelling van het schip in het buitenlandse register.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel196
  - number: '197'
    text: |-
      De enige zakelijke rechten, waarvan een in het register teboekstaand zeeschip het voorwerp kan zijn, zijn de
      eigendom, de hypotheek, het vruchtgebruik en de in artikel 211 en artikel 217 eerste lid onder *b* genoemde
      voorrechten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel197
  - number: '199.1'
    text: Een in het register teboekstaand zeeschip is een registergoed.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel199
  - number: '199.2'
    text: |-
      Bij toepassing van artikel 301 van Boek 3 ter zake van akten die op de voet van artikel 89 leden 1 en 4 van Boek 3
      zijn bestemd voor de levering van zodanig zeeschip, kan de in het eerste genoemde artikel bedoelde uitspraak van de
      Nederlandse rechter niet worden ingeschreven, zolang zij niet in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel199
  - number: '201'
    text: |-
      Eigendom, hypotheek en vruchtgebruik op een teboekstaand zeeschip worden door een bezitter te goeder trouw
      verkregen door een onafgebroken bezit van vijf jaren.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel201
  - number: '202'
    text: |-
      Onverminderd het bepaalde in [artikel 260, eerste lid, van Boek 3][ref1] wordt in de notariële akte waarbij
      hypotheek wordt verleend op een teboekstaand zeeschip of op een recht waaraan een zodanig schip is onderworpen,
      duidelijk het aan de hypotheek onderworpen schip vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel260
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel202
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '260'
  - number: '203'
    text: |-
      Behoudens afwijkende, uit de openbare registers blijkende, bedingen omvat de hypotheek de zaken die uit
      hoofde van hun bestemming blijvend met het schip zijn verbonden en die toebehoren aan de reder van het schip.
      [Artikel 266 van Boek 3][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel266
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel203
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '266'
  - number: '204'
    text: |-
      De door hypotheek gedekte vordering neemt rang na de vorderingen, genoemd in de [artikelen 210][ref1], [211][ref2],
      [221][ref3], [222 eerste lid][ref4], [831][ref5] en [832 eerste lid][ref6], doch vóór alle andere vorderingen,
      waaraan bij deze of enige andere wet een voorrecht is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel210
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel211
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel221
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel222
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Artikel831
      [ref6]: https://wetten.overheid.nl/BWBR0005034#Artikel832
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '210'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '211'
        hoofdstuk: II
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '221'
        hoofdstuk: II
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '222'
        hoofdstuk: II
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0005034
        artikel: '831'
        hoofdstuk: III
        afdeling: '5'
      - id: ref6
        bwb_id: BWBR0005034
        artikel: '832'
        hoofdstuk: III
        afdeling: '5'
  - number: '205'
    text: |-
      Indien de vordering rente draagt, strekt de hypotheek mede tot zekerheid voor de renten der hoofdsom, vervallen
      gedurende de laatste drie jaren voorafgaand aan het begin van de uitwinning en gedurende de loop hiervan.
      [Artikel 263 van Boek 3][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel263
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel205
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '263'
  - number: '206'
    text: |-
      Op hypotheek op een aandeel in een teboekstaand zeeschip is [artikel 177 van Boek 3][ref1] niet van toepassing; de
      hypotheek blijft na vervreemding of toedeling van het schip in stand.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel177
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '177'
  - number: '207.1'
    text: |-
      De eerste twee leden van [artikel 264 van Boek 3][ref1] zijn in geval van een hypotheek waaraan een teboekstaand
      zeeschip is onderworpen, mede van toepassing op bevrachtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel264
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '264'
  - number: '207.2'
    text: |-
      De [artikelen 234][ref1] en [261 van Boek 3][ref2] zijn op een zodanige hypotheek niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel234
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel261
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '234'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '261'
  - number: '208'
    text: |-
      In geval van vruchtgebruik op een teboekstaand zeeschip zijn de bepalingen van [artikel 217 van Boek 3][ref1]
      mede van toepassing op bevrachting voor zover die bepalingen niet naar hun aard uitsluitend op pacht, huur van
      bedrijfsruimte of huur van woonruimte van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel217
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '217'
  - number: '210.1'
    text: |-
      In geval van uitwinning van een zeeschip worden de kosten van uitwinning, de kosten van bewaking tijdens deze
      uitwinning of verkoop, alsmede de kosten van gerechtelijke rangregeling en verdeling van de opbrengst onder de
      schuldeisers uit de opbrengst van de verkoop voldaan boven alle andere vorderingen, waaraan bij deze of enige
      andere wet een voorrecht is toegekend.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel210
  - number: '210.2'
    text: |-
      In geval van verkoop van een gestrand, onttakeld of gezonken zeeschip, dat de overheid in het openbaar belang
      heeft doen opruimen, worden de kosten der wrakopruiming uit de opbrengst van de verkoop voldaan boven alle andere
      vorderingen, waaraan bij deze of enige andere wet een voorrecht is toegekend.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel210
  - number: '210.3'
    text: De in de vorige leden bedoelde vorderingen staan in rang gelijk en worden ponds-pondsgewijs betaald.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel210
  - number: 210a
    text: |-
      [Artikel 292 van Boek 3][ref1] en de [artikelen 60, tweede lid, eerste zin, derde lid en vierde lid][ref2], en
      [299b, derde tot en met vijfde lid, van de Faillissementswet][ref3] zijn op zeeschepen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel292
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel299b
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel210a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '292'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '60'
      - id: ref3
        bwb_id: BWBR0001860
        artikel: 299b
  - number: '211'
    text: |-
      Boven alle andere vorderingen waaraan bij deze of enige andere wet een voorrecht is toegekend zijn, behoudens
      artikel 210, op een zeeschip bevoorrecht:
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel211
  - number: 211.a
    text: |-
      in geval van beslag: de vorderingen ter zake van kosten na het beslag gemaakt tot behoud van het schip, daaronder
      begrepen de kosten van herstellingen, die onontbeerlijk waren voor het behoud van het schip;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel211
  - number: 211.b
    text: |-
      de vorderingen ontstaan uit de arbeidsovereenkomsten van de kapitein of de andere leden der bemanning, met dien
      verstande dat de vorderingen met betrekking tot loon, salaris of beloningen slechts bevoorrecht zijn tot op een
      bedrag over een tijdvak van twaalf maanden verschuldigd;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel211
  - number: 211.c
    text: de vorderingen ter zake van hulpverlening alsmede ter zake van de bijdrage van het schip in avarij-grosse;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel211
  - number: 211.d
    text: |-
      de vorderingen ter zake van havengelden en maatregelen met betrekking tot een schip die noodzakelijk waren ter
      waarborging van de veiligheid van de haven of van derden, met dien verstande dat dit voorrecht vervalt doordat het
      schip een nieuwe reis aanvangt.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel211
  - number: '212'
    text: |-
      Wanneer een vordering uit hoofde van [artikel 211][ref1] bevoorrecht is, zijn de renten hierop en de kosten ten
      einde een voor tenuitvoerlegging vatbare titel te verkrijgen gelijkelijk bevoorrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel211
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '211'
        hoofdstuk: II
        afdeling: '3'
  - number: '213.1'
    text: |-
      De bevoorrechte vorderingen, genoemd in [artikel 211][ref1], nemen rang in de volgorde, waarin zij daar zijn
      gerangschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel211
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '211'
        hoofdstuk: II
        afdeling: '3'
  - number: '213.2'
    text: |-
      Bevoorrechte vorderingen onder dezelfde letter vermeld, staan in rang gelijk, doch de vorderingen genoemd in
      [artikel 211 onder c][ref1] nemen onderling rang naar de omgekeerde volgorde van de tijdstippen, waarop zij
      ontstonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel211
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '211'
        hoofdstuk: II
        afdeling: '3'
  - number: '213.3'
    text: In rang gelijkstaande vorderingen worden ponds-pondsgewijs betaald.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel213
  - number: '214'
    text: |-
      De voorrechten, genoemd in [artikel 211][ref1], strekken zich uit tot


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel211
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '211'
        hoofdstuk: II
        afdeling: '3'
  - number: 214.a
    text: |-
      alle zaken, die uit hoofde van hun bestemming blijvend met het schip zijn verbonden en die toebehoren aan de reder
      van het schip;
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel214
  - number: 214.b
    text: |-
      de schadevergoedingen, verschuldigd voor het verlies van het schip of voor niet herstelde beschadiging daarvan,
      daarbij inbegrepen dat deel van een beloning voor hulpverlening, van een beloning voor vlotbrengen of van een
      vergoeding in avarij-grosse, dat tegenover een zodanig verlies of beschadiging staat. Dit geldt eveneens wanneer
      deze schadevergoedingen of vorderingen tot beloning zijn overgedragen of met pandrecht zijn bezwaard. Deze
      schadevergoedingen omvatten echter niet vergoedingen welke zijn verschuldigd krachtens een overeenkomst van
      verzekering van het schip, die dekking geeft tegen het risico van verlies of avarij. [Artikel 283 van Boek 3][ref1]
      is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel283
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '283'
  - number: '215.1'
    text: |-
      De schuldeiser, die een voorrecht heeft op grond van [artikel 211][ref1], vervolgt zijn recht op het schip, in
      wiens handen dit zich ook bevinde.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel211
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel215
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '211'
        hoofdstuk: II
        afdeling: '3'
  - number: '215.2'
    text: |-
      Voorrechten als bedoeld in [artikel 211][ref1] kunnen worden ingeschreven in de openbare registers, bedoeld in
      [afdeling 2 van Titel 1 van Boek 3][ref2]. [Artikel 24 lid 1 van Boek 3][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel211
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel215
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '211'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '216'
    text: |-
      De vorderingen genoemd in artikel 211, doen een voorrecht op het schip ontstaan en zijn alsdan daarop verhaalbaar,
      zelfs wanneer zij zijn ontstaan tijdens de terbeschikkingstelling van het schip aan een bevrachter, dan wel tijdens
      de exploitatie van het schip door een ander dan de reder, tenzij aan deze de feitelijke macht over het schip door
      een ongeoorloofde handeling was ontnomen en bovendien de schuldeiser niet te goeder trouw was.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel216
  - number: '217.1'
    text: |-
      Boven alle andere vorderingen, waaraan bij deze of enige andere wet een voorrecht is toegekend, doch na de
      bevoorrechte vorderingen genoemd in [artikel 211][ref1], na de hypothecaire vorderingen, na de vorderingen genoemd
      in de [artikelen 222][ref2] en [832][ref3] en na de vordering van de pandhouder, zijn op een zeeschip, waaronder
      voor de toepassing van dit artikel niet is te verstaan een zeeschip in aanbouw, bij voorrang verhaalbaar:


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel211
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel222
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel832
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '211'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '222'
        hoofdstuk: II
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '832'
        hoofdstuk: III
        afdeling: '5'
  - number: 217.1.a
    text: |-
      de vorderingen, die voortvloeien uit rechtshandelingen, die de reder of een rompbevrachter binden en die
      rechtstreeks strekken tot het in bedrijf brengen of houden van het schip, alsmede de vorderingen die tegen
      een uit hoofde van [artikel 461][ref1] gelezen met [artikel 462][ref2] of [artikel 943][ref3] gelezen met
      [artikel 944][ref4] als vervoerder aangemerkte persoon kunnen worden geldend gemaakt. Onder rechtshandeling is hier
      het in ontvangst nemen van een verklaring begrepen;


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel461
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel462
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel943
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel944
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '461'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '462'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '943'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '944'
        hoofdstuk: III
        afdeling: '2'
  - number: 217.1.b
    text: |-
      de vorderingen, die uit hoofde van [afdeling 1 van titel 6][ref1] op de reder rusten;


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: II
        afdeling: '1'
  - number: 217.1.c
    text: |-
      de vorderingen, genoemd in [artikel 752][ref1] voor zover zij op de reder rusten.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel752
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '752'
        hoofdstuk: II
  - number: '217.2'
    text: De in het eerste lid genoemde vorderingen staan in rang gelijk en worden ponds-pondsgewijs betaald.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel217
  - number: '217.3'
    text: |-
      De [artikelen 212][ref1], [214 onder a][ref2] en [216][ref3] zijn op de in het eerste lid genoemde vorderingen
      van toepassing. Op de vorderingen die in het eerste lid onder *b* worden genoemd, is ook [artikel 215][ref4] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel212
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel214
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel216
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel215
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '212'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '214'
        hoofdstuk: II
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '216'
        hoofdstuk: II
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '215'
        hoofdstuk: II
        afdeling: '3'
  - number: '217.4'
    text: |-
      [Artikel 283 van Boek 3][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel283
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '283'
  - number: '218'
    text: |-
      Na de vorderingen genoemd in [artikel 217][ref1] zijn de vorderingen genoemd in de [artikelen 284][ref2] en
      [285 van Boek 3][ref3], voor zover zij dit niet zijn op grond van enig ander artikel van deze titel, op een
      zeeschip bij voorrang verhaalbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel217
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel284
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel285
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '217'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '284'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '285'
  - number: '219.1'
    text: |-
      De krachtens deze afdeling verleende voorrechten gaan teniet door verloop van een jaar, tenzij de schuldeiser zijn
      vordering in rechte geldend heeft gemaakt. Deze termijn begint met de aanvang van de dag volgend op die, waarop de
      vordering opeisbaar wordt. Met betrekking tot de vordering voor hulploon begint deze termijn echter met de aanvang
      van de dag volgend op die, waarop de hulpverlening is beëindigd.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel219
  - number: '219.2'
    text: Het voorrecht gaat teniet met de vordering.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel219
  - number: '219.3'
    text: |-
      In geval van executoriale verkoop gaan de voorrechten mede teniet op het tijdstip waarop het proces-verbaal van
      verdeling wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel219
  - number: '220'
    text: |-
      Deze afdeling geldt onder voorbehoud van [titel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0005034
        hoofdstuk: V
  - number: '221.1'
    text: |-
      In geval van uitwinning van zaken aan boord van een zeeschip worden de kosten van uitwinning, de kosten van
      bewaking daarvan tijdens deze uitwinning, alsmede de kosten van gerechtelijke rangregeling en verdeling van de
      opbrengst onder de schuldeisers, uit de opbrengst van de verkoop voldaan boven alle andere vorderingen, waaraan bij
      deze of enige andere wet een voorrecht is toegekend.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel221
  - number: '221.2'
    text: De in het eerste lid bedoelde vorderingen staan in rang gelijk en worden ponds-pondsgewijs betaald.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel221
  - number: '222.1'
    text: |-
      Op zaken aan boord van een zeeschip zijn de vorderingen ter zake van hulpverlening en van een bijdrage van
      die zaken in avarij-grosse bevoorrecht. Deze vorderingen nemen daartoe rang na die welke zijn genoemd in de
      [artikelen 210][ref1], [211][ref2], [221][ref3], [820][ref4], [821][ref5] en [831][ref6], doch vóór alle andere
      vorderingen, waaraan bij deze of enige andere wet een voorrecht is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel210
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel211
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel221
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel820
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Artikel821
      [ref6]: https://wetten.overheid.nl/BWBR0005034#Artikel831
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '210'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '211'
        hoofdstuk: II
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '221'
        hoofdstuk: II
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '820'
        hoofdstuk: III
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0005034
        artikel: '821'
        hoofdstuk: III
        afdeling: '4'
      - id: ref6
        bwb_id: BWBR0005034
        artikel: '831'
        hoofdstuk: III
        afdeling: '5'
  - number: '222.2'
    text: |-
      Op ten vervoer ontvangen zaken zijn bevoorrecht de vorderingen uit een met betrekking tot die zaken gesloten
      vervoerovereenkomst, dan wel uit [artikel 488][ref1] of [artikel 951][ref2] voortvloeiend, doch slechts voor
      zover aan de vervoerder door [artikel 489][ref3] of [artikel 954][ref4] een recht op de zaken wordt toegekend.
      Deze vorderingen nemen daartoe rang na die welke zijn genoemd in het eerste lid en in de [artikelen 204][ref5] en
      [794][ref6], doch vóór alle andere vorderingen, waaraan bij deze of enige andere wet een voorrecht is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel488
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel951
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel489
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel954
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Artikel204
      [ref6]: https://wetten.overheid.nl/BWBR0005034#Artikel794
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '488'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '951'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '489'
        hoofdstuk: II
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '954'
        hoofdstuk: III
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005034
        artikel: '204'
        hoofdstuk: II
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0005034
        artikel: '794'
        hoofdstuk: III
        afdeling: '2'
  - number: '223'
    text: |-
      Wanneer een vordering uit hoofde van [artikel 222][ref1] bevoorrecht is, zijn de renten hierop en de kosten
      teneinde een voor tenuitvoerlegging vatbare titel te verkrijgen gelijkelijk bevoorrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel222
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel223
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '222'
        hoofdstuk: II
        afdeling: '4'
  - number: '224.1'
    text: |-
      De vorderingen ter zake van hulpverlening of bijdrage in avarij-grosse, die bevoorrecht zijn op grond van
      [artikel 211][ref1], [artikel 222 eerste lid][ref2], [artikel 821][ref3] of [artikel 832 eerste lid][ref4], nemen
      onderling rang naar de omgekeerde volgorde van de tijdstippen, waarop zij ontstonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel211
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel222
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel821
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel832
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '211'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '222'
        hoofdstuk: II
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '821'
        hoofdstuk: III
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '832'
        hoofdstuk: III
        afdeling: '5'
  - number: '224.2'
    text: |-
      De bevoorrechte vorderingen in het tweede lid van [artikel 222][ref1] vermeld staan in rang gelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel222
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '222'
        hoofdstuk: II
        afdeling: '4'
  - number: '224.3'
    text: |-
      De in [artikel 284 van Boek 3][ref1] genoemde vordering neemt rang na de in de vorige leden genoemde vorderingen,
      ongeacht wanneer die vorderingen zijn ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel284
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '284'
  - number: '224.4'
    text: In rang gelijkstaande vorderingen worden ponds-pondsgewijs betaald.
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel224
  - number: '225'
    text: |-
      De voorrechten, genoemd in [artikel 222][ref1], strekken zich uit tot de schadevergoedingen, verschuldigd
      voor verlies of niet herstelde beschadiging, daarbij inbegrepen dat deel van een beloning voor hulpverlening,
      van een beloning voor vlotbrengen of van een vergoeding in avarij-grosse, dat tegenover een zodanig verlies
      of beschadiging staat. Dit geldt eveneens wanneer deze schadevergoedingen of vorderingen tot beloning zijn
      overgedragen of met pandrecht zijn bezwaard. Deze schadevergoedingen omvatten echter niet vergoedingen, welke zijn
      verschuldigd krachtens een overeenkomst van verzekering die dekking geeft tegen het risico van verlies of avarij.
      [Artikel 283 van Boek 3][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel222
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel283
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '222'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '283'
  - number: '226'
    text: |-
      De in [artikel 222][ref1] genoemde vorderingen doen een voorrecht op de daar vermelde zaken ontstaan en zijn alsdan
      daarop bij voorrang verhaalbaar, ook al is hun eigenaar op het tijdstip, dat het voorrecht is ontstaan, niet de
      schuldenaar van deze vorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel222
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel226
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '222'
        hoofdstuk: II
        afdeling: '4'
  - number: '227.1'
    text: |-
      Met de aflevering van de zaken aan de daartoe gerechtigde gaan, behalve in het geval van [artikel 559][ref1], de
      in [artikel 222][ref2] genoemde voorrechten teniet. Zij gaan mede teniet met de vordering en door, in geval van
      executoriale verkoop, niet tijdig verzet te doen tegen de verdeling van de koopprijs alsmede door gerechtelijke
      rangregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel559
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel222
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '559'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '222'
        hoofdstuk: II
        afdeling: '4'
  - number: '227.2'
    text: |-
      Zij blijven in stand, zolang de zaken op grond van de [artikelen 490][ref1],
      [955][ref2] of [574][ref3] zijn opgeslagen of daarop op grond van [artikel 626][ref4] of
      [artikel 636 van het Wetboek van Burgerlijke Rechtsvordering][ref5] beslag is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel490
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel955
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel574
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel626
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel636
    url: https://wetten.overheid.nl/BWBR0005034/2004-05-01#Artikel227
