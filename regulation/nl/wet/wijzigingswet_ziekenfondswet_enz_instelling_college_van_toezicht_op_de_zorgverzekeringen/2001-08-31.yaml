preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het toezicht op de uitvoering van de Ziekenfondswet
    en de Algemene Wet Bijzondere Ziektekosten op te dragen aan een onafhankelijk College van toezicht op de
    zorgverzekeringen en tevens het toezicht op de uitvoering van de Ziekenfondswet en de Algemene Wet Bijzondere
    Ziektekosten te moderniseren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011943/2001-08-31#ArtikelAanhef
articles:
  - number: X
    text: |-
      1 Met ingang van de datum van inwerkingtreding van dit artikel zijn de personeelsleden van het College voor
      zorgverzekeringen, van wie naam en functie zijn vermeld op een door het College voor zorgverzekeringen in
      overeenstemming met de Commissie toezicht uitvoeringsorganisatie vastgestelde lijst, van rechtswege ontslagen en in
      dienst van het College van toezicht op de zorgverzekeringen.

      2 De overgang van de in het eerste lid bedoelde personeelsleden vindt plaats met een rechtspositie die als geheel
      ten minste gelijkwaardig is aan die welke voorheen gold bij het College voor zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0011943/2001-08-31#ArtikelX
  - number: XI
    text: |-
      1 Alle zaken, rechten en verplichtingen van het College voor zorgverzekeringen die samenhangen met de vervulling
      van de taken, bedoeld in [artikel 1u van de Ziekenfondswet][ref1], worden binnen een maand na de inwerkingtreding
      van dit artikel door het College voor zorgverzekeringen in overeenstemming met de Commissie toezicht
      uitvoeringsorganisatie opgenomen op een lijst. De lijst wordt ter goedkeuring voorgelegd aan Onze Minister.
      Alle op de door Onze Minister goedgekeurde lijst opgenomen zaken, rechten en verplichtingen van het College voor
      zorgverzekeringen gaan met ingang van de datum van inwerkingtreding van [artikel I van deze wet](onbekend) onder
      algemene titel over op het College van toezicht op de zorgverzekeringen. Door het College van toezicht op de
      zorgverzekeringen worden belanghebbenden op de hoogte gesteld van de overgang van zaken, rechten en verplichtingen.

      2 Ter zake van de overgang van vermogensbestanddelen, bedoeld in het eerste lid, blijft heffing van
      overdrachtsbelasting achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1u
    url: https://wetten.overheid.nl/BWBR0011943/2001-08-31#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1u
  - number: XII
    text: |-
      Rechtsgedingen die zijn ingesteld door of tegen het College voor zorgverzekeringen en die samenhangen met
      de vervulling van de taken, bedoeld in [artikel 1u van de Ziekenfondswet][ref1], worden met ingang van de
      inwerkingtreding van deze wet voortgezet door of tegen het College van toezicht op de zorgverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1u
    url: https://wetten.overheid.nl/BWBR0011943/2001-08-31#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1u
  - number: XIII
    text: |-
      Archiefbescheiden berustend bij de Commissie toezicht uitvoeringsorganisatie van het College voor zorgverzekeringen
      gaan met ingang van de datum van inwerkingtreding van deze wet over naar het College van toezicht op de
      zorgverzekeringen, voor zover zij niet overeenkomstig de [Archiefwet 1995][ref1] zijn overgebracht naar een
      archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0011943/2001-08-31#ArtikelXIII
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: XIV
    text: |-
      1 De vaststelling door het College van toezicht op de zorgverzekeringen van een bestuursreglement als bedoeld in
      [artikel 1c][ref1], onderscheidenlijk een werkprogramma als bedoeld in [artikel 1e ][ref2]en een begroting als
      bedoeld in [artikel 1f van de Ziekenfondswet][ref3], vindt plaats zo spoedig mogelijk onderscheidenlijk vindt voor
      het eerst plaats ten aanzien van het kalenderjaar na dat waarin deze wet in het Staatsblad is geplaatst.

      2 Tot het tijdstip waarop Onze Minister het bestuursreglement goedkeurt gelden voor het College van toezicht op de
      zorgverzekeringen de door het College voor zorgverzekeringen in het bestuursreglement gestelde regels ten aanzien
      van de Commissie toezicht uitvoeringsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1c
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel1e
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel1f
