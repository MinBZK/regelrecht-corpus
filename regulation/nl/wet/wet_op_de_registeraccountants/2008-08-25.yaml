preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het wenselijk is bij de wet regelen te stellen betreffende het
    accountantswezen en daarbij toepassing te geven aan de artikelen 159-161 der Grondwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Er is onder de naam *Nederlands Instituut van Registeraccountants* een orde van registeraccountants, in deze wet
      verder te noemen Orde. Deze heeft tot leden degenen, die in het in [artikel 55][ref1] bedoelde accountantsregister
      ingeschreven zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel55
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '55'
        paragraaf: '1'
  - number: '1.2'
    text: |-
      De Orde is gevestigd te Amsterdam. Zij is een openbaar lichaam in de zin van [artikel 134 van de Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
  - number: '1.3'
    text: |-
      De Orde heeft tot taak de bevordering van een goede beroepsuitoefening door de registeraccountants en de
      behartiging van hun gemeenschappelijk belang. Ten aanzien van registeraccountants die werkzaamheden verrichten
      als externe accountant als bedoeld in [artikel 1, onderdeel e, van de Wet toezicht accountantsorganisaties][ref1]
      heeft de Orde tot taak de bevordering van een goede beroepsuitoefening van deze accountants binnen
      accountantsorganisaties als bedoeld in [artikel 1, onderdeel a, van die wet][ref2]. Haar taak omvat mede de zorg
      voor de eer van de stand van de registeraccountants en het verzorgen of doen verzorgen van de praktijkstage,
      bedoeld in [artikel 67, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002374#Artikel67
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002374
        artikel: '67'
  - number: '1.4'
    text: |-
      In afwijking van het eerste lid zijn degenen, die op grond van
      [artikel 58, onder b, juncto artikel 59, tweede lid][ref1], in het accountantsregister zijn ingeschreven, slechts
      lid van de Orde indien zij de wens daartoe schriftelijk aan het bestuur van de Orde kenbaar hebben gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel58
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '58'
        paragraaf: '2'
  - number: '2'
    text: De Orde heeft een ledenvergadering, een bestuur en een voorzitter.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel2
  - number: '3.1'
    text: |-
      Het aantal leden van het bestuur wordt door de ledenvergadering bepaald, doch bedraagt ten minste zeven. De
      bestuursleden worden door de ledenvergadering uit de leden van de Orde voor vier jaren benoemd.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel3
  - number: '3.2'
    text: |-
      Jaarlijks treedt een deel der bestuursleden volgens een door de ledenvergadering vast te stellen rooster af. De
      rooster wordt zodanig ingericht, dat voor zover mogelijk telkenmale hetzelfde aantal bestuursleden aftreedt. De
      aftredenden zijn niet terstond herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel3
  - number: '3.3'
    text: |-
      Hij, die benoemd is ter vervulling van een tussentijds opengevallen plaats, treedt af op het tijdstip, waarop
      degene, in wiens plaats hij is benoemd, had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel3
  - number: '3.4'
    text: |-
      De jaarlijkse benoeming van bestuursleden ter vervulling van de ingevolge het tweede lid openvallende plaatsen
      geschiedt in de bijeenkomst van de ledenvergadering, waarin overeenkomstig [artikel 26][ref1] het bestuur rekening
      en verantwoording doet.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel26
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '26'
        paragraaf: '5'
  - number: '4'
    text: De leden van het bestuur ontvangen vergoeding van reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel4
  - number: '6.1'
    text: |-
      De voorzitter en een plaatsvervangende voorzitter worden door de ledenvergadering uit de bestuursleden telkens
      voor een jaar benoemd. Behoudens ter vervulling van een tussentijds openvallende plaats geschiedt de benoeming
      in de bijeenkomst van de ledenvergadering, waarin overeenkomstig [artikel 26][ref1] het bestuur rekening en
      verantwoording doet.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel26
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '26'
        paragraaf: '5'
  - number: '6.2'
    text: |-
      De [artikelen 3, derde lid][ref1], en [4][ref2] zijn ten aanzien van de voorzitter en de plaatsvervangende
      voorzitter van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel4
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002374
        artikel: '4'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      Het personeel, dat de Orde en de bij of krachtens deze wet ingestelde colleges voor de vervulling van hun taak
      behoeven, wordt door of namens de Orde in dienst genomen op arbeidsovereenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel7
  - number: '7.2'
    text: De ledenvergadering regelt bij verordening de voorwaarden, waaronder de indienstneming geschiedt.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel7
  - number: '7.3'
    text: Verordeningen, vastgesteld krachtens het tweede lid, behoeven de goedkeuring van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel7
  - number: '8'
    text: |-
      Het bestuur roept de ledenvergadering bijeen, zo dikwijls het zulks nodig oordeelt en voorts indien ten minste
      veertig leden van de Orde, onder opgaaf van de te behandelen punten, om haar bijeenroeping verzoeken.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel8
  - number: '9'
    text: |-
      De voorzitter van de Orde bekleedt in de bijeenkomsten van de ledenvergadering en in de bestuursvergaderingen het
      voorzitterschap.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel9
  - number: '10'
    text: Het bestuur vergadert niet, wanneer niet ten minste de helft van het aantal zitting hebbende leden is opgekomen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel10
  - number: '11'
    text: |-
      De leden van het bestuur zijn niet gerechtelijk vervolgbaar voor hetgeen zij in de bestuursvergaderingen hebben
      gezegd of aan haar schriftelijk hebben overgelegd.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel11
  - number: '12'
    text: De leden van het bestuur stemmen zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel12
  - number: '13'
    text: |-
      De leden van het bestuur onthouden zich in de bestuursvergaderingen van medestemmen over aangelegenheden, die hun,
      hun echtgenoten of hun geregistreerde partners, hun bloed- of aanverwanten tot de derde graad ingesloten, degenen
      met wie zij in de uitoefening van een beroep voor gemene rekening of onder gemeenschappelijke naam optreden hun
      werknemers, hun werkgevers, hun opdrachtgevers of degenen, op wie de in de uitoefening van hun beroep verrichte
      werkzaamheden rechtstreeks betrekking hebben, persoonlijk aangaan.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel13
  - number: 13a.1
    text: De bijeenkomsten van de ledenvergadering worden in het openbaar gehouden.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel13a
  - number: 13a.2
    text: |-
      De deuren worden gesloten, wanneer ten minste een vijfde van de aanwezige leden daarom verzoekt of de voorzitter
      het nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel13a
  - number: 13a.3
    text: De ledenvergadering beslist vervolgens of met gesloten deuren zal worden vergaderd.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel13a
  - number: '14.1'
    text: Indien bij het nemen van een beslissing geen der leden stemming vraagt, is het voorstel aangenomen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel14
  - number: '14.2'
    text: Stemming over personen vindt plaats bij gesloten en ongetekende stembriefjes.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel14
  - number: '15.1'
    text: |-
      Een stemming in een bijeenkomst van de ledenvergadering is nietig, indien niet meer dan de helft van de stemmen is
      uitgebracht van de ter vergadering aanwezige of vertegenwoordigde stemgerechtigden.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel15
  - number: '15.2'
    text: |-
      Een stemming in een bestuursvergadering is nietig, indien niet ten minste de helft van het aantal zitting hebbende
      leden, die zich niet van medestemmen moeten onthouden, eraan heeft deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel15
  - number: '15.3'
    text: |-
      Bij stemming over personen worden leden, die blanco briefjes ingeleverd hebben, voor de toepassing van dit artikel
      geacht aan de stemming te hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel15
  - number: '16.1'
    text: Ieder lid kan slechts één stem uitbrengen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel16
  - number: '16.2'
    text: |-
      Tenzij bij verordening anders is bepaald, kan een lid aan een ander lid schriftelijk volmacht verlenen tot het
      uitbrengen van zijn stem. Een lid kan voor ten hoogste drie andere leden een stem uitbrengen. Leden van het bestuur
      kunnen niet als gevolmachtigde optreden.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel16
  - number: '16.3'
    text: |-
      Voor het tot stand komen van een beslissing bij stemming wordt de volstrekte meerderheid van de uitgebrachte
      stemmen vereist. Blanco stemmen worden voor de toepassing van dit artikel geacht niet te zijn uitgebracht.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel16
  - number: '17.1'
    text: |-
      Bij staking van stemmen in een bijeenkomst van de ledenvergadering of in een voltallige bestuursvergadering is,
      indien het zaken betreft, het voorstel verworpen en beslist, indien het personen betreft, het lot.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel17
  - number: '17.2'
    text: |-
      Bij staking van stemmen in een niet voltallige bestuursvergadering wordt het nemen van een beslissing tot een
      volgende vergadering uitgesteld, waarin de beraadslagingen kunnen worden heropend. Indien de stemmen dan opnieuw
      staken, is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel17
  - number: '18.1'
    text: De ledenvergadering kan bij verordening nadere regelen stellen betreffende haar werkwijze en die van het bestuur.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel18
  - number: '18.2'
    text: |-
      Het bestuur kan nadere regelen stellen betreffende zijn werkwijze, voor zover niet de ledenvergadering daarin bij
      verordening heeft voorzien.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel18
  - number: '19.1'
    text: |-
      De ledenvergadering maakt de verordeningen, die zij ter vervulling van de in [artikel 1][ref1] omschreven taak
      nodig oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel1
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '1'
        paragraaf: '1'
  - number: '19.2'
    text: |-
      De ledenvergadering stelt ten behoeve van een goede uitoefening van de werkzaamheden van registeraccountants
      bij verordening gedrags- en beroepsregels vast, welke gelden voor allen, die zijn ingeschreven in het in
      [artikel 55][ref1] bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel55
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '55'
        paragraaf: '1'
  - number: '19.3'
    text: |-
      Voor zover uit deze wet niet anders blijkt, zijn de verordeningen van de Orde slechts verbindend voor haar leden
      en organen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel19
  - number: '19.4'
    text: |-
      De ledenvergadering stelt bij verordening regels vast terzake van de onafhankelijkheid, het stelsel
      van kwaliteitsbeheersing en de integere bedrijfsvoering van accountantsorganisaties als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Wet toezicht accountantsorganisaties][ref1], welke verbindend zijn voor
      alle accountantsorganisaties waarbinnen registeraccountants hun beroep uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
  - number: '19.5'
    text: |-
      De ledenvergadering stelt bij verordening regels vast terzake van de behandeling van klachten door
      registeraccountants, accountantsorganisaties als bedoeld in het vierde lid of andere kantoren waarbinnen
      registeraccountants hun beroep uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel19
  - number: '19.6'
    text: |-
      De ledenvergadering kan de bevoegdheid tot het geven van nadere voorschriften omtrent door haar bij verordening
      geregelde onderwerpen overdragen aan het bestuur.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel19
  - number: '19.7'
    text: |-
      Verordeningen, vastgesteld krachtens het tweede lid, met betrekking tot de uitoefening van de
      werkzaamheden van registeraccountants ter zake van het verrichten van wettelijke controles als bedoeld in
      [artikel 1, onderdeel j, van de Wet toezicht accountantsorganisaties][ref1], en vierde lid, behoeven de goedkeuring
      van Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
  - number: 19a.1
    text: |-
      De voorschriften in de in [artikel 19, tweede lid][ref1], bedoelde verordening met betrekking tot de
      uitoefening van de werkzaamheden van registeraccountants ter zake van het verrichten van wettelijke controles
      als bedoeld in [artikel 1, eerste lid, onderdeel j, van de Wet toezicht accountantsorganisaties][ref2]
      dienen dezelfde inhoud te hebben als de desbetreffende voorschriften in de in
      [artikel 24, tweede lid, van de Wet op de Accountants-Administratieconsulenten][ref3] bedoelde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel24
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '19'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002856
        artikel: '24'
  - number: 19a.2
    text: |-
      Met het oog op de uitvoering van het eerste lid wordt een ontwerp voor de desbetreffende bepalingen van de
      verordening opgesteld door een commissie, bestaande uit een gelijk aantal leden van het Nederlands Instituut van
      Registeraccountants en van de Nederlandse Orde van Accountants-Administratieconsulenten.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel19a
  - number: 19a.3
    text: |-
      In afwijking van het eerste en tweede lid kan Onze Minister van Financiën, op voorstel van de
      Orde, bij ministeriële regeling regels stellen met betrekking tot het in het eerste lid bedoelde
      onderwerp. Daarbij bepaalt Onze Minister van Financiën tevens welke bepalingen uit de verordeningen,
      bedoeld in [artikel 24, tweede lid, van de Wet op de Accountants-Administratieconsulenten][ref1] en
      [artikel 19, tweede lid][ref2], buiten toepassing blijven. Indien na de inwerkingtreding van de ministeriële
      regeling een overeenkomstig [artikel 19, tweede lid][ref3] en het tweede lid van dit artikel vastgestelde
      verordening in werking treedt, trekt Onze Minister van Financiën haar in.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002374#Artikel19
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002374
        artikel: '19'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002374
        artikel: '19'
        paragraaf: '4'
  - number: 19a.4
    text: |-
      Indien een verordening houdende de in het eerste lid bedoelde voorschriften wordt vernietigd op grond van
      [artikel 31][ref1] en de ledenvergadering niet binnen zes maanden na de datum van vernietiging een verordening
      heeft vastgesteld in overeenstemming met het bepaalde in het eerste lid, worden de in dat lid bedoelde
      voorschriften vastgesteld door Onze Minister van Financiën, in overeenstemming met Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel31
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '31'
        paragraaf: '6'
  - number: '20'
    text: Het bestuur bestuurt de Orde en voert het beheer over haar vermogen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel20
  - number: '21'
    text: De voorzitter vertegenwoordigt de Orde in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel21
  - number: '22'
    text: Het bestuur verstrekt Onze Ministers desgevraagd alle inlichtingen over alle zaken, de Orde betreffende.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel22
  - number: 22a
    text: |-
      Indien de Orde haar taken vervult met betrekking tot registeraccountants die werkzaamheden verrichten als
      externe accountant als bedoeld in [artikel 1, onderdeel e, van de Wet toezicht accountantsorganisaties][ref1],
      werkt de Orde, voor zover noodzakelijk ten behoeve van de uitoefening van het toezicht ingevolge de
      [Wet toezicht accountantsorganisaties][ref2], samen met de Stichting Autoriteit Financiële Markten. In de daartoe
      voorkomende gevallen pleegt de Orde overleg met de Stichting Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019468
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019468
  - number: 22b.1
    text: |-
      De Orde kan, in afwijking van [artikel 2:5 van de Algemene wet bestuursrecht][ref1], vertrouwelijke gegevens of
      inlichtingen verkregen bij de uitoefening van de haar ingevolge deze wet opgedragen taak, verstrekken aan:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 22b.1.a
    text: de Stichting Autoriteit Financiële Markten;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel22b
  - number: 22b.1.b
    text: |-
      een organisatorisch verband van marktpartijen, dat zich ten doel stelt een doeltreffende bijdrage te leveren
      aan de uitvoering door de Stichting Autoriteit Financiële Markten van het toezicht op de naleving van de
      [Wet toezicht accountantsorganisaties][ref1] en daartoe met de Autoriteit Financiële Markten een convenant heeft
      gesloten; en


      [ref1]: https://wetten.overheid.nl/BWBR0019468
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0019468
  - number: 22b.1.c
    text: |-
      de Nederlandse Orde van Accountants-Administratieconsulenten, bedoeld in
      [artikel 2, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel2
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '2'
  - number: 22b.2
    text: |-
      Indien de Orde vertrouwelijke gegevens of inlichtingen op grond van het eerste lid heeft verstrekt aan een in dat
      lid bedoelde instantie en die instantie verzoekt om die gegevens of inlichtingen te mogen gebruiken voor een ander
      doel dan waarvoor zij zijn verstrekt, willigt de Orde dat verzoek slechts in:
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel22b
  - number: 22b.2.a
    text: indien het beoogde gebruik niet in strijd is met het eerste lid; of
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel22b
  - number: 22b.2.b
    text: |-
      voor zover die instantie op een andere wijze dan in deze wet voorzien met inachtneming van de daarvoor geldende
      wettelijke procedures voor dat andere doel de beschikking over die gegevens of inlichtingen zou kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel22b
  - number: '23.1'
    text: |-
      De ontwerpen van verordeningen worden door het bestuur op bij algemene maatregel van bestuur te bepalen wijze
      openbaar gemaakt. Een ieder kan gedurende drie weken na de openbaarmaking van een ontwerp bij het bestuur zijn
      bedenkingen schriftelijk naar voren brengen. Het bestuur brengt de naar voren gebrachte bedenkingen ter kennis van
      de leden.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel23
  - number: '23.2'
    text: |-
      De verordeningen worden door het bestuur op bij algemene maatregel van bestuur te bepalen wijze bekendgemaakt.
      Indien zij de goedkeuring van een Onzer Ministers behoeven, geschiedt de bekendmaking niet dan nadat de goedkeuring
      is verleend en wordt bij de bekendmaking aan de voet van de verordening het besluit vermeld, waarbij deze is
      goedgekeurd. De verordeningen treden, indien zij niet anders bepalen, niet eerder in werking dan de tweede dag na
      die van de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel23
  - number: '24'
    text: Het boekjaar van de Orde loopt van 1 september tot en met 31 augustus.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel24
  - number: '25'
    text: |-
      Vóór de aanvang van het boekjaar stelt de ledenvergadering de begroting van de Orde vast. Het bestuur dient daartoe
      een ontwerp-begroting in, vergezeld van de nodige toelichting. Het ontwerp wordt door het bestuur, ten minste twee
      weken vóór de behandeling daarvan door de ledenvergadering, aan de leden toegezonden.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel25
  - number: '26.1'
    text: |-
      Voor elk boekjaar benoemt de ledenvergadering uit de leden een accountant, die belast is met de controle op de
      financiële verantwoording, benevens een plaatsvervanger voor deze.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel26
  - number: '26.2'
    text: De accountant brengt binnen dertien weken na afloop van het betrokken boekjaar een verslag uit aan het bestuur.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel26
  - number: '26.3'
    text: |-
      Binnen vier maanden na afloop van het boekjaar doet het bestuur aan de ledenvergadering rekening en verantwoording
      over zijn in het boekjaar gevoerde bestuur, onder overlegging van een balans en staat van baten en lasten
      met toelichting en met een verklaring van de accountant daarover. De balans, de staat van baten en lasten, de
      toelichting en de verklaring van de accountant worden door het bestuur, ten minste twee weken vóór de behandeling
      daarvan door de ledenvergadering, aan de leden toegezonden.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel26
  - number: '26.4'
    text: |-
      De ledenvergadering stelt de rekening vast. De vaststelling strekt tot décharge van het bestuur, behoudens in geval
      van later gebleken valsheid in bewijsstukken of andere onregelmatigheden.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel26
  - number: '27.1'
    text: |-
      De Orde kan van haar leden jaarlijks bijdragen heffen, waarvan het bedrag voor elk boekjaar afzonderlijk door
      de ledenvergadering bij verordening wordt vastgesteld. Het bedrag kan voor verschillende categorieën van leden
      verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel27
  - number: '27.2'
    text: |-
      De Orde kan bovendien de kosten van de werkzaamheden die zij verricht ter beoordeling van de kwaliteit van de
      beroepsuitoefening van een registeraccountant in rekening brengen bij haar leden of de kantoren waarbinnen deze
      leden werkzaam zijn. Ter bepaling van het verschuldigde bedrag worden door de ledenvergadering bij verordening
      tarieven vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel27
  - number: '27.3'
    text: De verordeningen, bedoeld in het eerste en tweede lid, behoeven de goedkeuring van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel27
  - number: '28'
    text: De Orde draagt alle kosten en is gerechtigd tot alle baten, uit de uitvoering van deze wet voortvloeiende.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel28
  - number: '29.1'
    text: |-
      Het bestuur kan de krachtens deze wet aan de Orde verschuldigde bedragen, verhoogd met de op de invordering
      vallende kosten, bij dwangbevel invorderen. Geen invordering geschiedt dan nadat de nalatige schuldenaar door het
      bestuur bij aangetekende brief tot betaling is aangemaand, doch in gebreke is gebleven binnen de in de aanmaning
      gestelde termijn, die ten minste tien dagen moet bedragen, aan zijn verplichting te voldoen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel29
  - number: '29.2'
    text: |-
      Het dwangbevel levert een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] kan worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '30.1'
    text: |-
      Indien een verordening van de Orde de goedkeuring van een Onzer Ministers behoeft, wordt deze alleen geweigerd
      wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel30
  - number: '30.2'
    text: |-
      Onze Minister kan bij een beslissing tot goedkeuring van een verordening bepalen dat nadere voorschriften,
      overeenkomstig [artikel 19, vierde lid][ref1], ter uitvoering van die verordening gegeven, eveneens zijn
      goedkeuring behoeven. Het eerste lid is wat de goedkeuring van die nadere voorschriften betreft van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel19
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '19'
        paragraaf: '4'
  - number: '31.1'
    text: Verordeningen en andere beslissingen van de Orde kunnen bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel31
  - number: '31.2'
    text: Van een besluit tot schorsing of vernietiging wordt mededeling gedaan door plaatsing in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel31
  - number: '31.3'
    text: |-
      Het achterwege blijven van vernietiging binnen de termijn waarvoor een beslissing is geschorst wordt, nadat de
      schorsing is geëindigd, voor zover het een bekendgemaakte beslissing betreft, door het bestuur op bij algemene
      maatregel van bestuur te bepalen wijze bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel31
  - number: '32'
    text: |-
      Het bestuur brengt jaarlijks vóór 1 januari aan Onze Minister van Financiën verslag uit omtrent de werkzaamheden
      van de Orde in het afgelopen boekjaar. Dit verslag wordt, tegen betaling der kosten, algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel32
  - number: '33.1'
    text: |-
      De tuchtrechtspraak heeft ten doel het weren en beteugelen van misslagen van registeraccountants in de uitoefening
      van hun beroep en van inbreuken op verordeningen van de Orde en op de eer van de stand der registeraccountants.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel33
  - number: '33.2'
    text: |-
      De tuchtrechtspraak wordt in eerste aanleg uitgeoefend door een of meer raden van
      tucht voor registeraccountants en Accountants-Administratieconsulenten als bedoeld in
      [artikel 51, tweede lid, van de Wet op de Accountants-Administratieconsulenten][ref1] en in beroep, tevens in
      hoogste ressort, door het College van Beroep voor het bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel51
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '51'
  - number: '33.3'
    text: |-
      In geval van doorhaling van een inschrijving in het accountantsregister blijft de betrokkene ter zake van
      handelingen en gedragingen, die gedurende de tijd, dat hij ingeschreven stond, hebben plaats gehad, aan de
      tuchtrechtspraak onderworpen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel33
  - number: '33.4'
    text: |-
      Indien de betrokkene wederom wordt ingeschreven, is hij bovendien aan deze rechtspraak onderworpen ter zake van
      handelingen en gedragingen, die gedurende de tijd, dat zijn inschrijving doorgehaald was, hebben plaats gehad en
      tot weigering van de inschrijving op grond van [artikel 59, eerste lid, onder ][ref1], aanleiding zouden hebben
      gegeven, zo zij reeds bij de behandeling van de aanvrage bekend waren geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel59
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '59'
        paragraaf: '2'
  - number: '34.1'
    text: |-
      Het berechtende college zal, indien het oordeelt, dat het tegen de betrokken registeraccountant gerezen bezwaar
      gegrond is, een der volgende maatregelen kunnen opleggen:
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel34
  - number: 34.1.a
    text: schriftelijke waarschuwing;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel34
  - number: 34.1.b
    text: schriftelijke berisping;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel34
  - number: 34.1.c
    text: schorsing als registeraccountant, voor ten hoogste zes maanden;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel34
  - number: 34.1.d
    text: |-
      doorhaling van de inschrijving in het in [artikel 55][ref1] bedoelde accountantsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel55
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '55'
        paragraaf: '1'
  - number: '34.2'
    text: |-
      De maatregel van schorsing als registeraccountant brengt mede verlies, voor de tijd dat de maatregel van kracht
      is, van het recht de titel registeraccountant of de benaming accountant te voeren. Voorts brengt deze maatregel mee
      verlies van de betrekkingen, waarbij de hoedanigheid van lid van de Orde ingevolge het bij of krachtens deze wet
      bepaalde vereiste voor benoembaarheid of verkiesbaarheid is.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel34
  - number: '34.3'
    text: |-
      Het college kan bij zijn beslissing bepalen, dat deze, al dan niet met de gronden waarop zij berust, geheel
      of gedeeltelijk zal worden openbaar gemaakt. Het bepaalt daarbij tevens de wijze, waarop de openbaarmaking zal
      geschieden.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel34
  - number: '35.1'
    text: |-
      De maatregel van schorsing als registeraccountant gaat in bij het onherroepelijk worden van de beslissing of op
      zodanig tijdstip nadien als in de beslissing is bepaald.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel35
  - number: '35.2'
    text: |-
      Het bestuur van de Orde draagt zorg voor de tenuitvoerlegging van de maatregelen van schriftelijke waarschuwing,
      van schriftelijke berisping en van doorhaling van de inschrijving in het accountantsregister en voor de in
      [artikel 34, derde lid][ref1], bedoelde openbaarmaking. De tenuitvoerlegging en de openbaarmaking geschieden niet
      voordat de beslissing onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel34
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '34'
        paragraaf: '2'
  - number: '39'
    text: |-
      Aan de behandeling en de beslissing van tuchtzaken in de zin van deze wet wordt op straffe van nietigheid
      van de beslissing deelgenomen door drie of vijf leden van de raad van tucht, onder wie de voorzitter of een
      plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel39
  - number: '40.1'
    text: |-
      De raad van tucht neemt een tegen een registeraccountant gerezen bezwaar in behandeling hetzij op een bij de
      raad ingediende klacht, hetzij op verzoek van het bestuur, hetzij ambtshalve. De raad van tucht geeft van het in
      behandeling nemen van een bezwaar onverwijld kennis aan de betrokken registeraccountant onder vermelding van het
      bezwaar.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel40
  - number: '40.2'
    text: |-
      In het geval, bedoeld in [artikel 33, vierde lid][ref1], neemt de raad het bezwaar niet in behandeling dan op
      verzoek van het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel33
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '33'
        paragraaf: '1'
  - number: '41.1'
    text: |-
      Een lid van een raad van tucht kan zich verschonen en kan worden gewraakt, indien er te zijnen aanzien feiten of
      omstandigheden bestaan, waardoor in het algemeen de rechterlijke onpartijdigheid schade zou kunnen lijden.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel41
  - number: '41.2'
    text: |-
      Over de verschoning of wraking wordt door de overige leden van de raad zo spoedig mogelijk beslist. In geval van
      staking van stemmen is het verzoek tot wraking of verschoning toegestaan.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel41
  - number: '42.1'
    text: |-
      De raad van tucht beslist aangaande een tegen een registeraccountant gerezen bezwaar niet dan na verhoor, althans
      oproeping bij aangetekende brief, van de betrokken registeraccountant, benevens, indien de behandeling op klacht,
      dan wel op verzoek van het bestuur geschiedt, van de klager, onderscheidenlijk van het bestuur.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel42
  - number: '42.2'
    text: |-
      De betrokken registeraccountant kan - tenzij de raad beveelt, dat hij in persoon zal verschijnen - zich ter
      terechtzitting doen vertegenwoordigen door een daartoe gemachtigde. Hij kan zich door een raadsman doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel42
  - number: '42.3'
    text: |-
      De raad kan weigeren bepaalde personen, die niet advocaat zijn, als gemachtigde of als raadsman toe te laten. Bij
      zodanige weigering houdt de raad de zaak tot een volgende zitting aan.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel42
  - number: '42.4'
    text: |-
      De registeraccountant en zijn raadsman worden in de gelegenheid gesteld tijdig van de processtukken kennis te
      nemen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel42
  - number: '42.5'
    text: |-
      De raad van tucht behandelt het bezwaar in een openbare zitting. De raad kan om gewichtige redenen beslissen dat de
      behandeling geheel of gedeeltelijk met gesloten deuren zal plaats vinden.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel42
  - number: '43.1'
    text: De raad van tucht kan getuigen en deskundigen oproepen en horen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel43
  - number: '43.2'
    text: |-
      Op verzoek van de raad doet de officier van justitie bij de rechtbank, binnen welker rechtsgebied de raad zitting
      houdt, hen dagvaarden. Zij zijn verplicht na dagvaarding te verschijnen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel43
  - number: '43.3'
    text: |-
      Verschijnt een getuige of een deskundige op de dagvaarding niet, dan doet de officier van justitie op verzoek van
      de raad hem andermaal dagvaarden, desverzocht met bevel tot medebrenging.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel43
  - number: '43.4'
    text: |-
      [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '556'
  - number: '43.5'
    text: |-
      Ten aanzien van de beëdiging van de getuigen is [artikel 177 van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      van toepassing. De deskundigen zijn verplicht hun taak onpartijdig en naar beste weten te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel177
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '177'
  - number: '43.6'
    text: |-
      Ten aanzien van de getuigen en deskundigen zijn de [artikelen 217-219 van het Wetboek van Strafvordering][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel217
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '217'
  - number: '43.7'
    text: |-
      De getuigen en deskundigen ontvangen desverkiezende op vertoon van hun oproeping of dagvaarding schadeloosstelling,
      door de voorzitter van de raad te begroten overeenkomstig het bij of krachtens het Tarief van justitiekosten en
      salarissen in burgerlijke zaken bepaalde.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel43
  - number: '44.1'
    text: |-
      De beslissing van de raad van tucht aangaande een tegen een registeraccountant gerezen bezwaar is op straffe van
      nietigheid met redenen omkleed en wordt in het openbaar uitgesproken.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel44
  - number: '44.2'
    text: |-
      De raad zendt van zijn beslissing onverwijld bij aangetekende brief afschrift aan de betrokken registeraccountant,
      en, indien naar aanleiding van een klacht is beslist, aan de klager, alsmede aan het bestuur.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel44
  - number: '45.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de rechtsgang, bedoeld in de
      [artikelen 40][ref1], [41][ref2], [42][ref3], [43][ref4] en [44][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0002374#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0002374#Artikel43
      [ref5]: https://wetten.overheid.nl/BWBR0002374#Artikel44
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '40'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002374
        artikel: '41'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002374
        artikel: '42'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0002374
        artikel: '43'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0002374
        artikel: '44'
        paragraaf: '4'
  - number: '45.2'
    text: |-
      Een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als in het eerste
      lid bedoeld wordt gedaan door Onze Ministers van Economische Zaken en van Justitie gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel45
  - number: '52.1'
    text: |-
      Tegen een beslissing van de raad van tucht aangaande een tegen een registeraccountant gerezen bezwaar kan binnen
      twee maanden na de dag van verzending van de in [artikel 44, tweede lid][ref1], bedoelde aangetekende brief beroep
      worden ingesteld bij het College van Beroep voor het bedrijfsleven:


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel44
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '44'
        paragraaf: '4'
  - number: 52.1.a
    text: door de betrokken registeraccountant, indien het bezwaar geheel of gedeeltelijk gegrond is verklaard;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel52
  - number: 52.1.b
    text: door de klager, indien zijn bezwaar geheel of gedeeltelijk ongegrond is verklaard;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel52
  - number: 52.1.c
    text: door het bestuur.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel52
  - number: '52.2'
    text: |-
      Het beroep wordt ingesteld bij met redenen omkleed beroepschrift, bij de griffier van het College in tweevoud
      of, indien het beroep door een klager is ingesteld, in drievoud in te dienen tezamen met een authentiek afschrift
      van de beslissing, waartegen het beroep is gericht. De griffier geeft van de instelling van het beroep onverwijld
      kennis aan de betrokken raad van tucht, alsmede, indien het beroep door de klager of door het bestuur is ingesteld,
      aan de betrokken registeraccountant. Indien het beroep door de betrokken registeraccountant is ingesteld in
      een procedure die bij klacht of op verzoek van het bestuur bij de raad van tucht aanhangig is gemaakt, geeft de
      griffier voorts van de instelling van het beroep onverwijld kennis aan de klager, respectievelijk aan het bestuur.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel52
  - number: '53'
    text: |-
      De raad van tucht doet binnen een en twintig dagen na de ontvangst van de mededeling, bedoeld in
      [artikel 52, tweede lid][ref1], de stukken toekomen aan de griffier van het College van Beroep voor het
      bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel52
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '52'
        paragraaf: '6'
  - number: '54.1'
    text: |-
      Is het beroep kennelijk niet-ontvankelijk of ongegrond, dan kan, zonder dat een nader onderzoek door het College
      van Beroep voor het bedrijfsleven vereist is, de voorzitter bij met redenen omklede beschikking het beroep niet-
      ontvankelijk of ongegrond verklaren. De griffier zendt afschrift van de beschikking aan de raad van tucht, alsmede
      bij aangetekende brief van de betrokken accountant en, indien de procedure bij de raad van tucht bij klacht is
      aanhangig gemaakt, aan de klager.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54
  - number: '54.2'
    text: |-
      Tegen de beschikking, in het eerste lid bedoeld, kan degene, die het beroep heeft ingesteld, binnen veertien
      dagen na de verzending van de onderhavige brief verzet doen bij het College. Het verzet wordt gedaan door een
      schriftelijke verklaring aan de griffier van het College.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54
  - number: '54.3'
    text: |-
      Het College verklaart het verzet niet-ontvankelijk, gegrond of ongegrond. Indien het verzet gegrond wordt
      verklaard, vervalt de beschikking.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54
  - number: '54.4'
    text: |-
      Is het College van oordeel, dat het beroep kennelijk niet-ontvankelijk of ongegrond is, dan kan het zonder nader
      onderzoek het verzet niet-ontvankelijk of ongegrond verklaren, echter niet dan na de betrokkene in de gelegenheid
      te hebben gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54
  - number: '54.5'
    text: De beschikking van het College ter zake van het gedane verzet is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54
  - number: '54.6'
    text: |-
      De griffier brengt de beschikking van het College ter kennis van de betrokken accountant en de klager, alsmede van
      de raad van tucht.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54
  - number: 54a.1
    text: |-
      Indien [artikel 54][ref1] geen toepassing vindt of het verzet gegrond is verklaard, bepaalt de voorzitter de dag
      voor de behandeling der zaak. De griffier brengt bij aangetekend schrijven de rechtsdag ter kennis van de betrokken
      accountant en de klager, respectievelijk het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel54
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '54'
        paragraaf: '6'
  - number: 54a.2
    text: |-
      Voor de behandeling ter terechtzitting worden de processtukken in origineel of in door de griffier gewaarmerkte
      afschriften gedurende ten minste tien dagen ter griffie van het College van Beroep voor het bedrijfsleven, ter
      griffie van een rechtbank of elders ter kosteloze inzage voor de betrokken accountant en de klager respectievelijk
      het bestuur of hun gemachtigden nedergelegd. Het tijdstip, waarop de gelegenheid tot inzage een aanvang zal nemen,
      wordt door de griffier tijdig tevoren ter kennis van bedoelde personen gebracht.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54a
  - number: 54a.3
    text: |-
      De in het tweede lid bedoelde termijn kan met toestemming van de accountant en de klager respectievelijk het
      bestuur worden verkort.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54a
  - number: 54a.4
    text: |-
      Is de termijn niet in acht genomen, dan bepaalt het College van Beroep voor het bedrijfsleven een nieuwe rechtsdag,
      tenzij de betrokken accountant en de klager respectievelijk het bestuur in persoon of bij gemachtigde zijn
      verschenen. In dit laatste geval kan op verzoek van elk hunner uitstel worden verleend.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54a
  - number: 54a.5
    text: |-
      In de gevallen, waarin op de terechtzitting de behandeling van de zaak voor een bepaalde tijd wordt uitgesteld of
      geschorst, wordt geen nieuwe kennisgeving gedaan.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54a
  - number: 54b
    text: |-
      Op het rechtsgeding voor het College van Beroep voor het bedrijfsleven zijn de [artikelen 41][ref1],
      [42, tweede, derde, vierde en vijfde lid][ref2], en [43][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0002374#Artikel43
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54b
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '41'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002374
        artikel: '42'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002374
        artikel: '43'
        paragraaf: '4'
  - number: 54c
    text: |-
      Aan de betrokken accountant en de klager respectievelijk het bestuur of hun gemachtigden en aan de raadsleden wordt
      de gelegenheid gegeven het woord te voeren en de middelen van beroep toe te lichten.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54c
  - number: 54d
    text: |-
      Het College van Beroep voor het bedrijfsleven kan de raad van tucht, die de beslissing in eerste aanleg heeft
      genomen, uitnodigen inlichtingen te geven.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54d
  - number: 54e
    text: |-
      Na de behandeling van de zaak ter terechtzitting bepaalt de voorzitter de dag van de uitspraak. Het College van
      Beroep voor het bedrijfsleven kan ook terstond uitspraak doen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54e
  - number: 54f.1
    text: |-
      Het College van Beroep voor het bedrijfsleven verklaart het beroep niet-ontvankelijk, verwerpt het of verklaart
      het gegrond.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54f
  - number: 54f.2
    text: |-
      Indien het College niet voldoende is ingelicht, kan het bevelen, dat de behandeling der zaak op een nader te
      bepalen datum zal worden hervat.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54f
  - number: 54g
    text: |-
      Indien het College van Beroep voor het bedrijfsleven het beroep gegrond verklaart, vernietigt het de beslissing van
      de raad van tucht; het doet alsdan de zaak zelf af of verwijst haar naar een der raden van tucht om haar af te doen
      met inachtneming van de beslissing van het College.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54g
  - number: 54h.1
    text: |-
      De uitspraak van het College van Beroep voor het bedrijfsleven houdt de gronden in en wijst de voorschriften aan,
      waarop zij rust.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54h
  - number: 54h.2
    text: |-
      De uitspraak wordt door de voorzitter van de kamer, die de uitspraak heeft gedaan, en de griffier ondertekend.
      Indien de voorzitter zich in de onmogelijkheid bevindt de uitspraak te ondertekenen, geschiedt zulks door het
      oudst benoemde gewone of plaatsvervangende lid, dat de uitspraak mede gewezen heeft. Indien de griffier zich in de
      onmogelijkheid bevindt, wordt daarvan instede van de ondertekening melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54h
  - number: 54i.1
    text: Het College van Beroep voor het bedrijfsleven zendt van zijn beslissing onverwijld afschrift;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54i
  - number: 54i.1.a
    text: aan de betrokken accountant;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54i
  - number: 54i.1.b
    text: aan de klager, indien de beslissing betreft een bezwaar, dat op klacht in behandeling is genomen;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54i
  - number: 54i.1.c
    text: aan het bestuur;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54i
  - number: 54i.1.d
    text: aan de raad van tucht, die de zaak in eerste instantie heeft behandeld;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54i
  - number: 54i.1.e
    text: |-
      aan de raad van tucht, naar welke de zaak krachtens [artikel 54][ref1] is verwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel54g
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54i
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: 54g
        paragraaf: '6'
  - number: 54i.2
    text: |-
      Het College kan in afwijking van het eerste lid, onder *b*, bij zijn beslissing bepalen, dat de klager kennis wordt
      gegeven uitsluitend van dat deel der beslissing, dat voor hem van belang is.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54i
  - number: 54j
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep in stellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel54j
  - number: 34_bis
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel34
  - number: '55.1'
    text: |-
      Er is een accountantsregister, waarin als registeraccountant op hun aanvrage worden ingeschreven zij, die voldoen
      aan de bij deze wet gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel55
  - number: '55.2'
    text: |-
      Bij elke inschrijving worden in het register vermeld de naam, voornamen, geboortedatum en het adres van de
      betrokkene en de datum der inschrijving.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel55
  - number: '55.3'
    text: Bij elke doorhaling van een inschrijving wordt de datum der doorhaling vermeld.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel55
  - number: '55.4'
    text: |-
      In geval van schorsing van een ingeschrevene als registeraccountant worden vermeld de tijdstippen, waarop de
      schorsing aanvangt en eindigt.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel55
  - number: '55.5'
    text: Met het beheer van het accountantsregister is belast het bestuur van de Orde.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel55
  - number: '56.1'
    text: Het accountantsregister ligt voor een ieder kosteloos ter inzage bij het bestuur van de Orde.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel56
  - number: '56.2'
    text: |-
      Tegen betaling van een vergoeding volgens een door de ledenvergadering bij verordening vast te stellen tarief wordt
      aan een ieder, die zulks verlangt, schriftelijk medegedeeld:
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel56
  - number: 56.2.a
    text: of een persoon in het accountantsregister staat ingeschreven;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel56
  - number: 56.2.b
    text: of een ingeschrevene als registeraccountant is geschorst.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel56
  - number: '56.3'
    text: |-
      Ten dienste van het Rijk, de provincies, de gemeenten en andere publiekrechtelijke lichamen worden schriftelijke
      mededelingen als in het tweede lid bedoeld kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel56
  - number: '56.4'
    text: Verordeningen, vastgesteld krachtens het tweede lid, behoeven de goedkeuring van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel56
  - number: '58'
    text: 'In het accountantsregister kunnen worden ingeschreven degenen die:'
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel58
  - number: 58.a
    text: |-
      beschikken over getuigschriften waaruit blijkt dat zij de opleiding, bedoeld in [artikel 66][ref1], met goed gevolg
      hebben afgerond; of


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel66
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '66'
  - number: 58.b
    text: |-
      beschikken over een verklaring van vakbekwaamheid als bedoeld in [artikel 78][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel78
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '78'
  - number: 58a
    text: |-
      Degene, die is ingeschreven in het accountantsregister als bedoeld in [artikel 55][ref1], is gerechtigd tot het
      voeren van de titel registeraccountant, afgekort RA.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel55
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '55'
        paragraaf: '1'
  - number: 58b
    text: |-
      Het is degene, die niet is ingeschreven in het accountantsregister als bedoeld in [artikel 55][ref1], verboden
      de titel registeraccountant zonder toevoeging dan wel in enigerlei samenstelling of afkorting te voeren, dan wel
      zich zodanig te gedragen, dat daardoor bij het publiek redelijkerwijs de indruk moet worden gewekt dat hij tot het
      voeren van deze titel gerechtigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel55
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel58b
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '55'
        paragraaf: '1'
  - number: 58c
    text: |-
      Onze Minister van Financiën kan bepalen dat degene, die is ingeschreven in het accountantsregister, bedoeld in
      [artikel 55][ref1] en die een opleidings- of beroepstitel of een afkorting daarvan voert, waartoe hij op grond van
      een wettelijke regeling van een andere Staat dan Nederland is gerechtigd, bij het voeren van die titel of afkorting
      tevens de naam en de plaats van vestiging van de instelling of examencommissie, die deze titel heeft verleend,
      moet vermelden.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel55
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel58c
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '55'
        paragraaf: '1'
  - number: '59.1'
    text: 'De inschrijving wordt geweigerd:'
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel59
  - number: 59.1.a
    text: |-
      indien de aanvrager niet voldoet aan de bij [artikel 58][ref1] voor inschrijving gestelde eis;


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel58
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '58'
        paragraaf: '2'
  - number: 59.1.b
    text: |-
      indien de aanvrager ingevolge in kracht van gewijsde gegane rechterlijke uitspraak in staat van faillissement
      verkeert of ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel59
  - number: 59.1.c
    text: indien de aanvrager ingevolge in kracht van gewijsde gegane rechterlijke uitspraak onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel59
  - number: 59.1.d
    text: indien de aanvrager ingevolge rechterlijke uitspraak is ontzet van het recht het accountantsberoep uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel59
  - number: 59.1.e
    text: |-
      indien gegronde vrees bestaat, dat de aanvrager als registeraccountant inbreuk zal maken op wettelijke
      voorschriften, de registeraccountants betreffende, of dat zijn inschrijving uit anderen hoofde de eer van de stand
      der registeraccountants zal schaden.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel59
  - number: '59.2'
    text: |-
      Het eerste lid onder e is niet van toepassing op een aanvrager, die beschikt over de in
      [artikel 58, onder b][ref1], bedoelde verklaring, indien hij zonder zich in Nederland te vestigen onderzoeken
      als bedoeld in [artikel 393, eerste lid, van Boek 2 Burgerlijk Wetboek][ref2] bij wijze van dienstverlening wil
      verrichten, mits hij bevoegd is tot het wettelijk voorgeschreven onderzoek van jaarrekeningen in een Lid-Staat
      van de Europese Gemeenschappen, anders dan Nederland, of in een andere Staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte (*Trb*. 1992, 132).


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '58'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '60.1'
    text: |-
      Hij, die in het accountantsregister wenst te worden ingeschreven, dient daartoe een aanvrage in bij het bestuur,
      onder betaling van een door de ledenvergadering bij verordening te bepalen bedrag.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel60
  - number: '60.2'
    text: Verordeningen, vastgesteld krachtens het eerste lid, behoeven de goedkeuring van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel60
  - number: '60.3'
    text: Onze genoemde Minister kan bepalen, welke gegevens bij de aanvrage dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel60
  - number: '60.4'
    text: |-
      Op de voorbereiding van de beschikking op de aanvraag tot inschrijving is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '62'
    text: |-
      Het bestuur schrijft de aanvrager, te wiens aanzien tot inschrijving is beslist, binnen drie dagen in het
      accountantsregister in.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel62
  - number: '63.1'
    text: 'Het bestuur haalt een inschrijving in het accountantsregister door:'
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel63
  - number: 63.1.a
    text: in geval van overlijden van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel63
  - number: 63.1.b
    text: op verzoek van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel63
  - number: 63.1.c
    text: |-
      indien de ingeschrevene in een der in [artikel 59, eerste lid, onder b-d][ref1], genoemde omstandigheden is komen
      te verkeren;


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel59
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '59'
        paragraaf: '2'
  - number: 63.1.d
    text: |-
      ter tenuitvoerlegging, krachtens [artikel 35, tweede lid][ref1], van een daartoe strekkende tuchtrechtelijke
      maatregel;


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel35
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '35'
        paragraaf: '2'
  - number: 63.1.e
    text: |-
      indien de accountantskamer een maatregel tot doorhaling van de gegevens van de ingeschrevene in het register,
      bedoeld in [artikel 11 van de Wet toezicht accountantsorganisaties][ref1], heeft opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel11
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '11'
  - number: 63.1.f
    text: |-
      indien de ingeschrevene na de tenuitvoerlegging van een dwangbevel in gebreke blijft de jaarlijkse bijdrage,
      bedoeld in [artikel 27][ref1], te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel27
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '27'
        paragraaf: '5'
  - number: '63.2'
    text: |-
      Doorhaling van de inschrijving brengt mede verlies van de betrekkingen, waarbij de hoedanigheid van lid van de Orde
      ingevolge het bij of krachtens deze wet bepaalde vereiste voor benoembaarheid of verkiesbaarheid is.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel63
  - number: '64.1'
    text: |-
      Hij, die in het accountantsregister ingeschreven is geweest, wordt geacht te voldoen aan de bij [artikel 58][ref1]
      voor inschrijving gestelde eis.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel58
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '58'
        paragraaf: '2'
  - number: '64.2'
    text: |-
      Bij het indienen van een aanvrage om opnieuw in het accountantsregister te worden ingeschreven moet, indien de
      vorige inschrijving is doorgehaald op een der gronden, bedoeld in [artikel 63, eerste lid, onder ][ref1], het
      bewijs worden overgelegd, dat deze grond heeft opgehouden te bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel63
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '63'
        paragraaf: '2'
  - number: '65'
    text: |-
      Van elke doorhaling van een inschrijving in het accountantsregister wordt door het bestuur op bij algemene
      maatregel van bestuur te bepalen wijze mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel65
  - number: '66'
    text: |-
      De opleiding tot registeraccountant omvat de bij algemene maatregel van bestuur vast te stellen vakgebieden die
      voor de bij of krachtens de wet vereiste controles van financiële verantwoordingen van belang zijn, en voldoet aan
      de in [artikel 69, tweede lid, onderdeel a][ref1], bedoelde eindtermen.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel69
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '69'
  - number: 66a.1
    text: Bij verordening wordt het beroepsprofiel van de registeraccountant vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel66a
  - number: 66a.2
    text: De verordening, bedoeld in het eerste lid, behoeft de goedkeuring van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel66a
  - number: '67.1'
    text: |-
      Gedurende ten minste drie jaar dient als onderdeel van de opleiding een praktijkstage te worden gevolgd waarvoor de
      Orde zorg draagt. De praktijkstage wordt afgesloten met een examen. Indien het examen met goed gevolg is afgelegd,
      geeft de Orde daarvan een getuigschrift af.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel67
  - number: '67.2'
    text: |-
      Bij verordening als bedoeld in [artikel 19][ref1] worden met betrekking tot de praktijkstage in elk geval geregeld:


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel19
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '19'
        paragraaf: '4'
  - number: 67.2.a
    text: de toelatingseisen;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel67
  - number: 67.2.b
    text: |-
      de inhoud van het examen, de wijze waarop het examen wordt afgenomen en de personen die bevoegd zijn het examen af
      te nemen;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel67
  - number: 67.2.c
    text: de voorwaarden voor de toelating tot het afleggen van het examen;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel67
  - number: 67.2.d
    text: de voorwaarden voor het verkrijgen van vrijstelling van bepaalde onderdelen van het examen;
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel67
  - number: 67.2.e
    text: de hoogte van de examengelden en te wiens laste deze komen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel67
  - number: '67.3'
    text: De verordening, bedoeld in het tweede lid, behoeft de goedkeuring van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel67
  - number: '68'
    text: |-
      Bij de beoordeling of aan de toelatingeisen voor de praktijkstage is voldaan, bepaalt de Orde aan de hand van de
      vastgestelde eindtermen, bedoeld in [artikel 69, eerste lid, onderdeel a][ref1], en de overgelegde getuigschriften
      van opleidingen of een aanvulling op de genoten opleiding noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel69
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '69'
  - number: '69.1'
    text: Er is een Commissie eindtermen accountantsopleiding.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel69
  - number: '69.2'
    text: 'De Commissie eindtermen accountantsopleiding heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel69
  - number: 69.2.a
    text: |-
      het vaststellen van de eindtermen, met inachtneming van de vakgebieden, bedoeld in [artikel 66][ref1], en het
      beroepsprofiel, bedoeld in [artikel 66a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel66a
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0002374
        artikel: 66a
  - number: 69.2.b
    text: |-
      het aanwijzen van opleidingen die geheel of gedeeltelijk voldoen aan de in onderdeel a bedoelde eindtermen, met
      uitzondering van de eindtermen die betrekking hebben op de praktijkstage, voor zover deze opleidingen niet zijn
      geaccrediteerd overeenkomstig [artikel 5a.9 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
  - number: 69.2.c
    text: het toetsen van de praktijkstage aan de mate waarin wordt voldaan aan de eindtermen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel69
  - number: '69.3'
    text: De vastgestelde eindtermen worden bekendgemaakt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel69
  - number: '70.1'
    text: De Commissie eindtermen accountantsopleiding heeft ten hoogste acht leden waaronder de voorzitter.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel70
  - number: '70.2'
    text: |-
      Onze Minister van Financiën benoemt, schorst en ontslaat de leden van de commissie. De leden zijn deskundig op het
      gebied van het accountantsberoep. De benoeming vindt plaats op persoonlijke titel en geschiedt voor een periode van
      ten hoogste vijf jaar. Bij de benoeming van de leden van de Commissie eindtermen accountantsopleiding bepaalt Onze
      Minister wie de voorzitter is. De leden van de commissie zijn onbeperkt herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel70
  - number: '70.3'
    text: |-
      Schorsing en ontslag vinden slechts plaats wegens ongeschiktheid of onbekwaamheid voor de vervulde functie dan wel
      wegens andere zwaarwegende in de persoon van de betrokkene gelegen redenen. Ontslag vindt voorts plaats op eigen
      verzoek.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel70
  - number: '70.4'
    text: |-
      Een lid van de Commissie eindtermen accountantsopleiding vervult geen andere functies die ongewenst zijn met het
      oog op een goede vervulling van zijn functie of de handhaving van zijn onafhankelijkheid of van het vertrouwen
      daarin.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel70
  - number: '70.5'
    text: 'In het bestuursreglement worden regels vastgesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel70
  - number: 70.5.a
    text: |-
      het aanvaarden van een nevenfunctie anders dan uit hoofde van het lidmaatschap van de Commissie eindtermen
      accountantsopleiding, en
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel70
  - number: 70.5.b
    text: de wijze van openbaarmaking van nevenfuncties.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel70
  - number: '71.1'
    text: |-
      Aan het lidmaatschap van de Commissie eindtermen accountantsopleiding is een bezoldiging dan wel een
      schadeloosstelling verbonden.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel71
  - number: '71.2'
    text: Onze Minister van Financiën stelt de bezoldiging of schadeloosstelling vast.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel71
  - number: '72'
    text: |-
      De Commissie eindtermen accountantsopleiding stelt een bestuursreglement vast. Het bestuursreglement en elke
      wijziging daarvan behoeven de goedkeuring van Onze Minister van Financiën. De goedkeuring kan worden onthouden
      wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel72
  - number: '73.1'
    text: |-
      De Commissie eindtermen accountantsopleiding zendt jaarlijks voor 1 april aan Onze Minister van Financiën de
      ontwerpbegroting voor het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel73
  - number: '73.2'
    text: |-
      Indien gedurende een kalenderjaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en
      de begrote baten en lasten dan wel inkomsten en uitgaven, doet de Commissie eindtermen accountantsopleiding daarvan
      onverwijld mededeling aan Onze Minister van Financiën onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel73
  - number: '73.3'
    text: |-
      De Commissie eindtermen accountantsopleiding brengt jaarlijks de kosten van de werkzaamheden die
      zij verricht in verband met de uitoefening van haar taak op grond van deze wet en op grond van de
      [Wet op de Accountants-Administratieconsulenten][ref1] in rekening bij de Orde en de Nederlandse Orde van
      Accountants-Administratieconsulenten, voor zover deze kosten niet ten laste komen van de Rijksbegroting. Tot de
      kosten behoren onder meer de kosten die zij ter voorbereiding op de uitvoering van haar taak heeft gemaakt, voordat
      deze taak aan haar werd opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002856
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0002856
  - number: '73.4'
    text: De kosten worden gebaseerd op de begroting waarmee Onze Minister van Financiën heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel73
  - number: '73.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel73
  - number: '74.1'
    text: |-
      De Commissie eindtermen accountantsopleiding stelt jaarlijks voor 1 juli een verslag op van de werkzaamheden, het
      gevoerde beleid in het algemeen en de doelmatigheid en doeltreffendheid van haar werkzaamheden en werkwijze in het
      bijzonder in het afgelopen kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel74
  - number: '74.2'
    text: Het verslag wordt aan Onze Minister van Financiën gezonden.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel74
  - number: '75.1'
    text: |-
      De Commissie eindtermen accountantsopleiding verstrekt desgevraagd aan Onze Minister van Financiën alle voor de
      uitoefening van diens taak benodigde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel75
  - number: '75.2'
    text: |-
      Onze Minister van Financiën kan inzage vorderen van alle zakelijke gegevens en bescheiden, indien dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel75
  - number: '76.1'
    text: |-
      Onze Minister van Financiën kan een besluit van de Commissie eindtermen accountantsopleiding vernietigen, indien
      dit besluit is genomen in strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel76
  - number: '76.2'
    text: Van het vernietigingsbesluit wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel76
  - number: '77.1'
    text: |-
      Indien naar het oordeel van Onze Minister van Financiën de Commissie eindtermen accountantsopleiding haar taak
      ernstig verwaarloost, kan Onze Minister van Financiën de noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel77
  - number: '77.2'
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat de Commissie
      eindtermen accountantsopleiding in de gelegenheid is gesteld om binnen een door Onze Minister van Financiën te
      stellen termijn alsnog haar taak naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel77
  - number: '77.3'
    text: |-
      Onze Minister van Financiën stelt de beide kamers der Staten-Generaal onverwijld in kennis van door hem getroffen
      voorzieningen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel77
  - number: '78.1'
    text: 'De Commissie eindtermen accountantsopleiding geeft een verklaring van vakbekwaamheid af aan degene die:'
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel78
  - number: 78.1.a
    text: |-
      beschikt over een bewijsstuk waaruit blijkt dat hij voldoet aan de eisen van vakbekwaamheid die in een lidstaat
      van de Europese Gemeenschappen, anders dan Nederland, of in een andere Staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte, krachtens wettelijke regeling worden gesteld voor de toelating tot de
      controle van jaarrekeningen als bedoeld in artikel 1 van de Achtste [Richtlijn nr. 84/253/EEG](31984L0253) van de
      Raad van de Europese Gemeenschappen van 10 april 1984 op de grondslag van artikel 54, lid 3, sub g, van het Verdrag
      inzake de toelating van personen, belast met de controle van boekhoudbescheiden (PbEG L 126); of
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel78
  - number: 78.1.b
    text: |-
      in andere gevallen dan bedoeld in het onderdeel a, beschikt over een in een ander land dan Nederland verkregen
      diploma of soortgelijk bewijsstuk, waaruit naar het oordeel van de Commissie eindtermen accountantsopleiding
      eenzelfde niveau van vakbekwaamheid blijkt als die, welke blijkt uit het met goed gevolg hebben voltooid van de
      opleiding tot registeraccountant; en
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel78
  - number: 78.1.c
    text: |-
      met goed gevolg een examen heeft afgelegd waarbij de kennis van de betrokkene van het Nederlandse recht wordt
      getoetst; en
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel78
  - number: 78.1.d
    text: |-
      met goed gevolg een examen heeft afgelegd waarbij de kennis van de betrokkene van de voor de registeraccountants
      geldende gedrags- en beroepsregels wordt getoetst.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel78
  - number: '78.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het examen, bedoeld in
      het eerste lid, onderdeel c. Bij verordening worden regels gesteld met betrekking tot het examen, bedoeld in het
      eerste lid, onderdeel d. De inhoud van het examen, bedoeld in het eerste lid, onderdeel d, wordt vastgesteld bij
      verordening als bedoeld in [artikel 19][ref1]. De verordening, bedoeld in de vorige volzin, behoeft de goedkeuring
      van Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel19
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '19'
        paragraaf: '4'
  - number: '107.1'
    text: |-
      Degene, die in strijd handelt met het bepaalde in de [artikelen 34, tweede lid][ref1], en [58b][ref2] wordt
      gestraft met een geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel58b
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '34'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002374
        artikel: 58b
        paragraaf: '2'
  - number: '107.2'
    text: Het in het eerste lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel107
  - number: '107.3'
    text: |-
      Indien tijdens het plegen van de in het eerste lid omschreven overtreding nog geen jaar is verlopen sedert een
      vroegere veroordeling van de schuldige wegens dezelfde overtreding onherroepelijk is geworden, wordt hij gestraft
      met een hechtenis van ten hoogste twee weken of een geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel107
  - number: 107a.1
    text: |-
      Met de opsporing van bij deze wet strafbaar gestelde feiten zijn, behalve de bij of krachtens
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren, belast zij, die daartoe door Onze
      Minister van Justitie in overeenstemming met Onze Minister van Financiën zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 107a.2
    text: Van een krachtens het eerste lid vastgestelde beschikking wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel107a
  - number: '108'
    text: 'Deze wet kan worden aangehaald als: Wet op de Registeraccountants.'
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel108
  - number: '109'
    text: De onderscheidene artikelen van deze wet treden in werking op door Ons te bepalen tijdstippen.
    url: https://wetten.overheid.nl/BWBR0002374/2008-08-25#Artikel109
