---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: rijkswet_zetelverplaatsing_door_de_overheid_van_rechtspersonen_en_instellingen
regulatory_layer: WET
publication_date: '2010-09-01'
valid_from: '2010-10-10'
bwb_id: BWBR0002562
url: https://wetten.overheid.nl/BWBR0002562/2010-10-10
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede gelet op artikel 38, vierde lid, van het Statuut voor het
    Koninkrijk, wenselijk is bij rijkswet te voorzien in bijzondere maatregelen, vereist door de belangen van het
    Koninkrijk, aangaande de plaats van vestiging van rechtspersonen en instellingen, naast de Rijkswet vrijwillige
    zetelverplaatsing van rechtspersonen;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder rechtspersoon wordt in het bij of krachtens deze rijkswet bepaalde begrepen iedere maat- of vennootschap,
      vereniging of stichting, fonds of privaatrechtelijke instelling in de ruimste zin, ook indien daaraan in andere
      wettelijke bepalingen de rechtspersoonlijkheid niet mocht zijn toegekend of uitdrukkelijk mocht zijn onthouden.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel1
  - number: '2.1'
    text: |-
      Indien in geval van oorlog, onmiddellijk oorlogsgevaar, revolutie of daarmee vergelijkbare buitengewone
      omstandigheden naar Ons oordeel de belangen van het Koninkrijk dit vereisen, kunnen Wij Onze Ministers van Justitie
      en van Financiën machtigen om bij gezamenlijke beschikking de plaats van vestiging van een of meer in Nederland,
      Aruba, Curaçao of Sint Maarten gevestigde rechtspersonen over te brengen naar een andere, in de beschikking aan te
      geven, plaats binnen het Koninkrijk der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      Onze voornoemde Ministers kunnen in hun beschikking ook andere bepalingen van de akte van oprichting of van de
      statuten en reglementen van de rechtspersoon wijzigen, indien dit naar hun oordeel noodzakelijk is in verband
      met de overbrenging van de plaats van vestiging. Een wijziging als bedoeld in de vorige zin kan ook een omzetting
      inhouden van een naamloze vennootschap, besloten vennootschap met beperkte aansprakelijkheid of een besloten
      vennootschap in een van de andere genoemde typen van vennootschappen.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel2
  - number: '2.3'
    text: |-
      Is de rechtspersoon in Aruba, Curaçao of Sint Maarten gevestigd of bestaat het voornemen tot overbrenging daarheen,
      dan geschiedt de overbrenging slechts in overeenstemming met het gevoelen van Onze Ministers van Justitie en van
      Financiën van Aruba, Curaçao of Sint Maarten, tenzij de omstandigheden naar Ons oordeel niet toelaten hen van
      tevoren te raadplegen.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel2
  - number: '3'
    text: |-
      In afwijking van [artikel 3:40 van de Algemene wet bestuursrecht][ref1], treden de overbrenging en de wijziging,
      bedoeld in [artikel 2][ref2], in werking met ingang van de dag waarop de beschikking tot stand is gekomen, tenzij
      de beschikking anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002562#Artikel2
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002562
        artikel: '2'
  - number: '4.1'
    text: |-
      Indien de plaats van vestiging is overgebracht naar een ander deel van het Koninkrijk, worden aldaar zo spoedig
      mogelijk openbaar gemaakt:
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel4
  - number: 4.1.a
    text: de beschikking, waardoor de plaats van vestiging is overgebracht;
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel4
  - number: 4.1.b
    text: |-
      de akte van oprichting of de statuten en reglementen van de rechtspersoon, zoals zij door de wijziging zijn komen
      te luiden.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel4
  - number: '4.2'
    text: |-
      In het geval, bedoeld in het eerste lid, wordt voorts, tenzij daartegen redelijke bezwaren bestaan, in het deel van
      het Koninkrijk, waar de rechtspersoon tevoren gevestigd was, openbaar gemaakt de beschikking, waardoor de plaats
      van vestiging is overgebracht.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel4
  - number: '4.3'
    text: |-
      Indien de plaats van vestiging is overgebracht naar een andere plaats binnen hetzelfde deel van het Koninkrijk,
      zijn het eerste en het tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel4
  - number: '4.4'
    text: |-
      De openbaarmaking geschiedt door middel van het blad, waarin van overheidswege de officiële berichten in het
      betrokken deel van het Koninkrijk worden gepubliceerd, en wel hetzij door de rechtspersoon, hetzij van Onzentwege.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel4
  - number: '4.5'
    text: |-
      In afwijking van de eerste drie leden behoeven de statuten en reglementen van een rechtspersoon, die geen naamloze
      vennootschap, besloten vennootschap met beperkte aansprakelijkheid of besloten vennootschap is, en de daarin
      aangebrachte wijzigingen slechts te worden openbaar gemaakt, voor zover andere in het betrokken deel van het
      Koninkrijk geldende wettelijke bepalingen een soortgelijke openbaarmaking van de statuten en reglementen van
      zodanige rechtspersoon voorschrijven.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel4
  - number: '4.6'
    text: |-
      Voor zover aan de voorschriften van de vorige leden niet is voldaan, kunnen de overbrenging en de wijziging van de
      akte van oprichting of van de statuten en reglementen niet tegen derden te goeder trouw worden ingeroepen.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel4
  - number: '5'
    text: |-
      Na de overbrenging kan de plaats van vestiging van de rechtspersoon, onverminderd het bepaalde
      in de voorgaande artikelen, weer worden teruggebracht naar het deel van het Koninkrijk of
      naar de plaats in hetzelfde deel van het Koninkrijk, waar de rechtspersoon het eerst was
      gevestigd. Deze terugbrenging geschiedt uitsluitend door overeenkomstige toepassing van de
      [afdelingen 2 of 4 van de Rijkswet vrijwillige zetelverplaatsing van rechtspersonen][ref1], wanneer het een
      naamloze vennootschap, besloten vennootschap met beperkte aansprakelijkheid of besloten vennootschap betreft, dan
      wel van afdeling 6 van die Rijkswet, wanneer het een andere rechtspersoon betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002561#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002561
        afdeling: '2'
  - number: '6.1'
    text: |-
      Van het tijdstip af, waarop de plaats van vestiging van een rechtspersoon overeenkomstig deze rijkswet naar een
      ander deel van het Koninkrijk is overgebracht of teruggebracht, bezit hij de staat van een volgens het recht van
      dat deel van het Koninkrijk opgerichte rechtspersoon en wordt hij door het aldaar geldende recht beheerst.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel6
  - number: '6.2'
    text: |-
      De bevoegde organen van het deel van het Koninkrijk, waarheen overeenkomstig deze rijkswet de plaats van vestiging
      van een of meer rechtspersonen is overgebracht, kunnen echter met betrekking tot deze rechtspersonen afwijkende
      deviezenrechtelijke voorschriften treffen.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel6
  - number: '7.1'
    text: |-
      Heeft een rechtspersoon een recht of bevoegdheid verkregen, voor het behoud waarvan het gevestigd zijn in, of
      het opgericht zijn volgens het recht van een bepaald deel van het Koninkrijk een vereiste of voorwaarde is, dan
      wordt dit vereiste of deze voorwaarde voor vervuld gehouden, zolang de rechtspersoon ingevolge toepassing van deze
      rijkswet in een ander deel van het Koninkrijk gevestigd is.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel7
  - number: '7.2'
    text: |-
      Heeft een rechtspersoon een recht of bevoegdheid verkregen, voor het behoud waarvan een vereiste of voorwaarde is,
      dat een of meer van zijn bestuurders, commissarissen, vennoten of vertegenwoordigers ingezetene zijn van, dan wel
      woonachtig of geboren zijn in een bepaald deel van het Koninkrijk, dan wordt, zolang de rechtspersoon ingevolge
      toepassing van deze rijkswet in een ander deel van het Koninkrijk gevestigd is, dit vereiste of deze voorwaarde
      voor vervuld gehouden, indien even zovele van zijn bestuurders, commissarissen, vennoten of vertegenwoordigers
      ingezetene zijn van, dan wel woonachtig of geboren zijn in enig deel van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel7
  - number: '8'
    text: |-
      Voor zover bepalingen in de akte van oprichting of de statuten en reglementen van een rechtspersoon niet in
      overeenstemming zijn met het bij of krachtens deze rijkswet bepaalde, blijven zij buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel8
  - number: '9'
    text: |-
      Wij behouden Ons voor bij algemene maatregel van rijksbestuur te regelen, wat verder nodig is voor de uitvoering
      van deze rijkswet.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel9
  - number: '10'
    text: Het Koninklijk besluit van 4 maart 1942 (*Stb.* C 16) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel10
  - number: '11'
    text: |-
      Deze rijkswet kan worden aangehaald onder de titel: Rijkswet zetelverplaatsing door de overheid van rechtspersonen
      en instellingen.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel11
  - number: '12.1'
    text: Deze rijkswet is verbindend voor het gehele Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel12
  - number: '12.2'
    text: Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002562/2010-10-10#Artikel12
