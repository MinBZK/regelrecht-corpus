preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de Wet minimumloon en minimumvakantiebijslag te
    herzien, teneinde deze wet beter te laten aansluiten bij de huidige arbeidsmarkt waar variatie in arbeidsduur en
    (intersectorale) mobiliteit gedurende de loopbaan gebruikelijker is geworden en om de handhaafbaarheid van de wet
    verder te verbeteren en dat als gevolg daarvan ook andere wetten dienen te worden aangepast;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0048186/2024-01-01#ArtikelAanhef
articles:
  - number: XXXXa
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt binnen vijf jaar na de inwerkingtreding van deze wet aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0048186/2024-01-01#ArtikelXXXXa
  - number: XXXXI
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.

      2 Voor de eerste toepassing na inwerkingtreding van deze wet wordt in afwijking van
      de [artikelen I, onderdeel B, artikel 8, eerste lid, onderdelen a en b][ref1], en
      [XXXII, artikel 3.1, eerste lid, onderdeel a][ref2], bij ministeriële regeling het toepasselijke bedrag gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0048186#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0048186#ArtikelXXXII
