preamble:
  text: |-
    Gelet op artikel 2, eerste lid, onder c, jo artikel 4, eerste lid, van de Wet overige OCW-subsidies en artikel 43,
    vijfde lid, van het Besluit rijkssubsidiëring instandhouding monumenten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0027191/2010-02-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *besluit:* [Besluit rijkssubsidiëring instandhouding monumenten][ref1];

      b. *minister:* Minister van Onderwijs, Cultuur en Wetenschap;

      c. *stadsherstellichaam:* organisatie die zich uitsluitend of nagenoeg uitsluitend bezig houdt met verwerving,
      renovatie, restauratie en beheer van beschermde monumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0019439
    url: https://wetten.overheid.nl/BWBR0027191/2010-02-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019439
  - number: '2'
    text: |-
      De [artikelen 8][ref1], [17][ref2], [24][ref3], [29][ref4] en [35, eerste lid, van het besluit][ref5] zijn van
      overeenkomstige toepassing met dien verstande dat instandhouding telkens wordt gelezen als restauratie.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0019439#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0019439#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0019439#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0019439#Artikel35
    url: https://wetten.overheid.nl/BWBR0027191/2010-02-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0019439
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0019439
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0019439
        artikel: '29'
      - id: ref5
        bwb_id: BWBR0019439
        artikel: '35'
  - number: '3'
    text: |-
      1 De minister kan op aanvraag subsidie verstrekken voor de jaren 2009 en 2010 ten behoeve van de restauratie van
      beschermde monumenten of voor de aankoop en overdracht van beschermde monumenten met als doel de restauratie van
      deze monumenten.

      2 Voor de subsidie, bedoeld in het eerste lid, komen slechts in aanmerking stadsherstellichamen die in de
      jaren 2004 tot en met 2007 gebruik maakten van de vrijstelling van de heffing van vennootschapsbelasting voor
      woningbouwlichamen.
    url: https://wetten.overheid.nl/BWBR0027191/2010-02-13#Artikel3
  - number: '4'
    text: Voor subsidieverstrekking is voor de jaren 2009 en 2010 jaarlijks een bedrag van € 2 miljoen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0027191/2010-02-13#Artikel4
  - number: '5'
    text: |-
      1 Subsidiabel zijn de kosten van werkzaamheden, maatregelen en voorzieningen als bedoeld in de Leidraad Brim
      subsidiabele instandhoudingskosten, opgenomen als [bijlage bij de Regeling rijkssubsidiëring instandhouding
      monumenten](onbekend), met dien verstande dat:

      a. kosten uitsluitend subsidiabel zijn voorzover de werkzaamheden:

      1°. strekken tot restauratie van het beschermde monument en zijn monumentale waarden,

      2°. sober en doelmatig zijn,

      3°. technisch noodzakelijk zijn, en

      4°. de werkzaamheden zijn gericht op maximaal behoud van aanwezige monumentale waarden, in het bijzonder
      historische materialen en constructies;

      b. kosten voor werkzaamheden gericht op het voorkomen van verval of het voorkomen van vervolgschade subsidiabel
      zijn;

      c. kosten voor werkzaamheden gericht op vervanging van materialen die hun functie niet meer kunnen vervullen
      subsidiabel zijn;

      d. kosten voor werkzaamheden gericht op reconstructie niet subsidiabel zijn, tenzij ze in uitzonderlijke gevallen
      naar het oordeel van de minister ter versterking van de monumentale waarden gewenst zijn; en

      e. kosten voor werkzaamheden die voortvloeien uit veranderd gebruik, alsmede kosten voor werkzaamheden die zijn
      gericht op comfortverbetering niet subsidiabel zijn.

      2 Tevens zijn subsidiabel kosten voor zover deze redelijkerwijs noodzakelijk zijn voor de aankoop en de overdracht
      van beschermde monumenten.

      3 Kosten komen niet voor subsidie in aanmerking voor zover voor deze kosten op andere wijze al subsidie is
      verstrekt op grond van het [Besluit rijkssubsidiëring instandhouding monumenten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019439
    url: https://wetten.overheid.nl/BWBR0027191/2010-02-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019439
  - number: '6'
    text: |-
      Per stadsherstellichaam bedraagt het subsidiebedrag ten hoogste een percentage van € 4 miljoen dat wordt berekend
      aan de hand van de resultaten, bedoeld in [artikel 8, tweede lid, onder a][ref1], van het desbetreffende
      stadsherstellichaam ten opzichte van het totaal van die resultaten van alle ingediende aanvragen die in aanmerking
      komen voor subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0027191#Artikel8
    url: https://wetten.overheid.nl/BWBR0027191/2010-02-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027191
        artikel: '8'
  - number: '7'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0027191/2010-02-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '8'
    text: |-
      1 Een stadsherstellichaam dient één aanvraag voor subsidie op grond van deze regeling in voor de jaren 2009 en
      2010.

      2 De aanvraag voor subsidie bevat in ieder geval:

      a. een overzicht van de resultaten vóór belastingen van het desbetreffende stadsherstellichaam van de jaren 2004
      tot en met 2007 die blijken uit de desbetreffende jaarrekeningen;

      b. de monumentnummers en adresgegevens van de te restaureren of aan te kopen beschermde monumenten; en

      c. een raming van de kosten per beschermd monument, waarbij de restauratiekosten slechts de subsidiabele kosten als
      bedoeld in [artikel 5][ref1] omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0027191#Artikel5
    url: https://wetten.overheid.nl/BWBR0027191/2010-02-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027191
        artikel: '5'
  - number: '9'
    text: Een aanvraag wordt voor 1 maart 2010 ingediend.
    url: https://wetten.overheid.nl/BWBR0027191/2010-02-13#Artikel9
  - number: '10'
    text: |-
      1 De minister beslist tegelijk op de aanvragen met toepassing van [artikel 6][ref1].

      2 De minister beslist voor 1 april 2010 op de aanvragen en verleent subsidie met terugwerkende kracht voor de jaren
      2009 en 2010.

      3 Indien het te verstrekken subsidiebedrag minder bedraagt dan € 25.000, stelt de minister de subsidie zonder
      subsidieverlening vast.


      [ref1]: https://wetten.overheid.nl/BWBR0027191#Artikel6
    url: https://wetten.overheid.nl/BWBR0027191/2010-02-13#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0027191
        artikel: '6'
  - number: '11'
    text: |-
      De minister verstrekt uiterlijk op 15 april 2010 aan de subsidieontvanger een voorschot ter hoogte van het
      verleende subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0027191/2010-02-13#Artikel11
  - number: '12'
    text: |-
      1 De ontvanger van een subsidie waarvan het verleende bedrag € 25.000 of meer bedraagt, dient voor 1 oktober 2011
      een aanvraag tot vaststelling van de subsidie in.

      2 De aanvraag tot vaststelling gaat vergezeld van een overzicht waarin de monumentnummers staan vermeld ten behoeve
      waarvan de subsidie is besteed.

      3 [Artikel 33 van het besluit][ref1] is van overeenkomstige toepassing indien het verleende subsidiebedrag
      € 125.000 of meer bedraagt, met dien verstande dat:

      a. aangewezen organisatie voor monumentenbehoud telkens wordt gelezen als stadsherstellichaam; en

      b. de aanvraag tot vaststelling vergezeld gaat van een overzicht van totaal gemaakte restauratiekosten en, voor
      zover van toepassing en in redelijkheid, de kosten voor aankoop en overdracht, per beschermd monument waarvoor
      subsidie is verleend.

      4 De minister beslist binnen dertien weken op de aanvraag tot vaststelling van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel33
    url: https://wetten.overheid.nl/BWBR0027191/2010-02-13#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '33'
  - number: '13'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0027191/2010-02-13#Artikel13
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Regeling restauratie monumenten stadsherstellichamen.'
    url: https://wetten.overheid.nl/BWBR0027191/2010-02-13#Artikel14
