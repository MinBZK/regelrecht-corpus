      [ref6]: https://wetten.overheid.nl/BWBR0006285#Artikel13
      [ref7]: https://wetten.overheid.nl/BWBR0006285#Artikel14
      [ref8]: https://wetten.overheid.nl/BWBR0006285#Artikel17
      [ref9]: https://wetten.overheid.nl/BWBR0006285#Artikel19
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel20
    references:
