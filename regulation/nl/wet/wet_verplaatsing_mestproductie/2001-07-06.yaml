  - number: '21.1'
    text: |-
      Het Verplaatsingsbesluit Meststoffenwet (*Stb.* 1987, 171) wordt ingetrokken op een bij koninklijk besluit te
      bepalen tijdstip, dat voor de verschillende artikelen en onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel21
  - number: '21.2'
    text: |-
      In het belang van een goede invoering van deze wet kan Onze Minister regelen stellen omtrent de gevallen waarin
      en de wijze waarop één of meer onderdelen van het Verplaatsingsbesluit Meststoffenwet nog kunnen of moeten worden
      toegepast.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel21
  - number: '22.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel22
  - number: '22.2'
    text: |-
      De verschillende artikelen van deze wet of onderdelen daarvan, komen te vervallen op een bij algemene maatregel
      van bestuur te bepalen tijdstip dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel22
  - number: '22.3'
    text: |-
      De verschillende artikelen van deze wet of onderdelen daarvan kunnen op een bij algemene maatregel van bestuur te
      bepalen tijdstip, dat voor de verschillende artikelen of onderdelen verschillend kan worden vastgesteld, voor een
      bij de maatregel te bepalen gebied buiten werking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel22
  - number: '22.4'
    text: 'Deze wet kan worden aangehaald als: Wet verplaatsing mestproductie.'
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel22
  - number: 22a
    text: Deze wet vervalt met ingang van 1 januari 2005.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel22a
