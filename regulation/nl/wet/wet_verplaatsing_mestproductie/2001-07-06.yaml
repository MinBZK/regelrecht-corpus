preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is bij wet regelen te stellen omtrent het verplaatsen
    van mestproductie;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: mestproductierecht: hoeveelheid
      dierlijke meststoffen uitgedrukt in onderscheidenlijk kilogrammen fosfaat varkens- en kippenmest, in
      kilogrammen fosfaat rundvee- en kalkoenenmest en in kilogrammen fosfaat afkomstig van de mest van één
      of meer andere krachtens [artikel 1 van de Meststoffenwet][ref1] aangewezen diersoorten, die ingevolge
      [artikel 55, eerste, vijfde, zesde, zevende en achtste lid, van de Meststoffenwet][ref2] op een bedrijf gedurende
      een kalenderjaar ten hoogste mag worden geproduceerd, zoals deze hoeveelheid in voorkomend geval is gewijzigd
      door toepassing van het bepaalde bij of krachtens de [Meststoffenwet][ref3] en bij deze wet; niet-gebonden
      mestproductierecht: deel van het mestproductierecht dat de hoeveelheid overeenkomend met 125 kg fosfaat per jaar
      per hectare tot een bedrijf behorende oppervlakte landbouwgrond te boven gaat; verplaatsing: het, met benutting
      van een overeenkomstig deze wet geregistreerd niet-gebonden mestproductierecht en in afwijking in zoverre van
      [artikel 55, eerste, tweede, vijfde en zesde lid, van de Meststoffenwet][ref4], gaan produceren van dierlijke
      meststoffen op een andere locatie of een ander bedrijf; bedrijf: geheel van productie-eenheden bestaande uit één
      of meer gebouwen of gedeelten daarvan en de daarbij behorende landbouwgrond, uitsluitend of onder meer dienende
      tot de uitoefening van de landbouw, zulks beoordeeld naar de feitelijke omstandigheden; Bureau Heffingen: Bureau
      Heffingen van het Ministerie van Landbouw, Natuurbeheer en Visserij, te Assen; dierlijke meststoffen: dierlijke
      meststoffen als bedoeld in [artikel 1 van de Meststoffenwet][ref5]; landbouwgrond: landbouwgrond, bedoeld in
      [artikel 1 van de Meststoffenwet][ref6]; tot het bedrijf behorende oppervlakte landbouwgrond: tot het bedrijf
      behorende oppervlakte landbouwgrond als bedoeld in [artikel 1 van de Meststoffenwet][ref7]; Onze Minister: Onze
      Minister van Landbouw, Natuurbeheer en Visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0004054
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel55
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref7]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel1
