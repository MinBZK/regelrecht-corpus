        artikel: '1'
  - number: '1.2'
    text: |-
      Voor de toepassing van deze wet wordt onder bedrijf mede verstaan dat geheel van productie-eenheden dat als één
      bedrijf is opgegeven op grond van de krachtens [artikel 7 van de Meststoffenwet][ref1] gestelde regelen inzake
      de registratie van de productie van dierlijke meststoffen, voor zover zodanig bedrijf niet reeds is gesplitst
      of samengevoegd op grond van de krachtens [artikel 58 van de Meststoffenwet][ref2] gestelde regelen, alsmede elk
      afzonderlijk geheel van productie-eenheden dat na inwerkingtreding van deze wet is ontstaan door splitsing van een
      oorspronkelijk bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '58'
  - number: '1.3'
    text: |-
      Indien op een bedrijf mestproductierechten zijn geregistreerd betreffende meer dan een van de krachtens
      [artikel 1 van de Meststoffenwet][ref1] aangewezen diersoorten wordt, voor de bepaling van de omvang van het
      desbetreffende niet-gebonden mestproductierecht, de bij het bedrijf behorende oppervlakte landbouwgrond aan een
      mestproductierecht toegedeeld overeenkomstig door Onze Minister vast te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
  - number: '1.4'
    text: |-
      Voor de toepassing van het begrip bedrijf wordt geen rekening gehouden met handelingen waarvan, op grond van de
      omstandigheid dat zij geen wezenlijke verandering van feitelijke verhoudingen hebben ten doel gehad of waarvan op
      grond van andere bepaalde feiten en omstandigheden, moet worden aangenomen dat zij achterwege gebleven zouden zijn
      indien daarmede niet de toepassing van deze wet voor het vervolg geheel of ten dele onmogelijk zou worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel1
  - number: '2'
    text: Verplaatsing is slechts toegestaan overeenkomstig de regels van deze wet.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel2
  - number: '3'
    text: |-
      Het is verboden na verplaatsing een grotere hoeveelheid dierlijke meststoffen te produceren dan
      voortvloeit uit het bepaalde in deze wet, een en ander onverminderd de hoeveelheid die op grond van
      [artikel 55 van de Meststoffenwet][ref1] mag worden geproduceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel55
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '55'
  - number: '4'
    text: |-
      Het is verboden te verplaatsen van een locatie of bedrijf, geheel of gedeeltelijk gelegen buiten de in de bij deze
      wet behorende bijlage aangegeven gebieden, naar een locatie of bedrijf geheel of gedeeltelijk gelegen binnen deze
      gebieden. Het is op overeenkomstige wijze verboden om tussen de aangewezen gebieden onderling, te verplaatsen.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel4
  - number: '5.1'
    text: |-
      Bij de in [artikel 9][ref1] bedoelde kennisgeving en daaropvolgende registratie neemt het niet-gebonden
      mestproductierecht:


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel9
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '9'
  - number: 5.1.a
    text: |-
      af op het bedrijf waarvandaan de voorgenomen verplaatsing plaatsvindt met de desbetreffende overeenkomstig
      [artikel 9][ref1] geregistreerde hoeveelheid;


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel9
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '9'
  - number: 5.1.b
    text: |-
      toe op het bedrijf waarheen verplaatst gaat worden met een hoeveelheid gelijk aan de desbetreffende overeenkomstig
      [artikel 9][ref1] geregistreerde hoeveelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel9
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '9'
  - number: '5.2'
    text: |-
      De hoeveelheid mestproductierechten welke overeenkomstig het bepaalde in [artikel 1][ref1] bepalend is voor
      de vaststelling van de hoeveelheid niet-gebonden mestproductierechten varkens- en kippenmest en rundvee-
      en kalkoenenmest welke na één of meer kennisgevingen als bedoeld in [artikel 9][ref2] in totaal kan worden
      geregistreerd, is ten hoogste gelijk aan de desbetreffende gerealiseerde mestproductie in 1988, 1989 of 1990.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006285#Artikel9
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006285
        artikel: '9'
  - number: '5.3'
    text: |-
      De in het tweede lid bedoelde gerealiseerde mestproductie wordt bepaald aan de hand van de krachtens de
      [artikelen 8][ref1] en [13 van de Meststoffenwet][ref2] , zoals deze vóór 1 januari 1998 luidden deze inzake de
      aangiften voor de overschotheffing voor die jaren opgegeven aantallen dieren of toegepaste correcties.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel13
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '13'
  - number: '5.4'
    text: |-
      Bij de bepaling van de in het tweede en derde lid bedoelde gerealiseerde mestproductie kan de belanghebbende uit
      een van de aldaar bedoelde jaren het jaar kiezen waarin deze mestproductie het grootst was.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel5
  - number: '5.5'
    text: |-
      De in het tweede lid bedoelde gerealiseerde mestproductie wordt slechts in aanmerking genomen voor zover deze
      gelijk is aan of lager is dan de in [artikel 55, eerste, vijfde, zesde en zevende lid, van de Meststoffenwet][ref1]
      vastgelegde maximaal toegestane mestproductie.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel55
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '55'
  - number: '5.6'
    text: |-
      De in het tweede lid bedoelde vaststelling heeft geen betrekking op kennisgevingen en registraties betreffende de
      hoeveelheden die overeenkomstig deze wet zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel5
  - number: '6.1'
    text: |-
      Bij de bepaling en de berekening van de in [artikel 5][ref1] bedoelde hoeveelheid niet-gebonden
      mestproductierechten welke overeenkomstig deze wet ten hoogste kan worden geregistreerd, kunnen door Onze Minister
      nadere regelen worden gesteld welke onder meer betrekking kunnen hebben op: - het voor de toepassing van deze wet
      ambtshalve vaststellen van de in dat artikel bedoelde hoeveelheden;
        - de gevallen waarin en de wijze waarop van de in dat artikel bedoelde bepaling en berekening kan of moet worden
      afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel5
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '5'
  - number: '6.2'
    text: |-
      Door Onze Minister kunnen regelen worden gesteld omtrent de wijze waarop en de gevallen waarin de overeenkomstig
      de [artikelen 9][ref1] en [10][ref2] aan te melden en te registreren niet-gebonden mestproductierechten met een bij
      die regelen te bepalen percentage worden gekort, welk kortingspercentage echter niet groter kan zijn dan 25%.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006285#Artikel10
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0006285
        artikel: '10'
  - number: '6.3'
    text: |-
      De krachtens [artikel 9, tweede lid, van de Meststoffenwet][ref1], gestelde regelen zijn van overeenkomstige
      toepassing op de bepaling van de omvang van de mestproductie van de in deze wet bedoelde diersoorten.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel9
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '9'
  - number: '7.1'
    text: |-
      Bij de gevolgen van grondtransacties op de omvang van het mestproductierecht en het niet-gebonden
      mestproductierecht blijft [artikel 55 van de Meststoffenwet][ref1] onverkort van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel55
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '55'
  - number: '7.2'
    text: |-
      Onder grondtransacties worden in dit artikel verstaan, eigendomsovergangen, het tot stand komen of eindigen van
      pachtovereenkomsten en het vestigen, overdragen of tenietgaan van zakelijke gebruiksrechten.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel7
  - number: '7.3'
    text: |-
      Onder het tot stand komen en eindigen van pachtovereenkomsten wordt in dit artikel verstaan, het aangaan van
      een pachtovereenkomst voor tenminste de duur als bedoeld in [artikel 12, eerste lid, van de Pachtwet][ref1]
      (*Stb.* 1958, 37), welke vervolgens is goedgekeurd door de grondkamer, een door de grondkamer
      goedgekeurde beëindiging van een zodanige pachtovereenkomst, een door de rechter uitgesproken ontbinding
      van een zodanige pachtovereenkomst, een afwijzing door de rechter van een verzoek tot verlenging
      van een zodanige pachtovereenkomst, of het eindigen van een zodanige overeenkomst als gevolg van een
      kennisgeving als bedoeld in [artikel 36, tweede lid, van de Pachtwet][ref2], waarna niet overeenkomstig
      [artikel 36, derde lid, van de Pachtwet][ref3] verlenging is verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0002269#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002269#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0002269#Artikel36
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002269
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0002269
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0002269
        artikel: '36'
  - number: '8.1'
    text: |-
      Indien sprake is van een in [artikel 7, tweede lid][ref1], bedoelde beëindiging van een pachtovereenkomst welke,
      ongeacht de overeengekomen duur van zodanige overeenkomst, is aangegaan op een tijdstip gelegen in de periode
      vanaf 1 januari 1987 tot de dag van inwerkingtreding van deze wet, gaat een mestproductierecht over, overeenkomstig
      de hoeveelheid die ingevolge het bepaalde bij of krachtens de [Meststoffenwet][ref2] bij het aangaan van de
      pachtovereenkomst naar de pachter overging, met inachtneming evenwel van het bepaalde in de overige bepalingen van
      deze wet en de [Meststoffenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004054
      [ref3]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004054
      - id: ref3
        bwb_id: BWBR0004054
  - number: '8.2'
    text: |-
      Indien sprake is van een in [artikel 7, tweede lid][ref1], bedoelde beëindiging van een pachtovereenkomst welke,
      ongeacht de overeengekomen duur van zodanige overeenkomst, is aangegaan op een tijdstip gelegen vóór 1 januari
      1987, gaat een mestproductierecht over op basis van de door partijen aan de verpachte lokatie toe te rekenen
      mestproductiecapaciteit, met inachtneming evenwel van het bepaalde in de overige bepalingen van deze wet en de
      [Meststoffenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004054
  - number: '8.3'
    text: |-
      De betrokken partijen kunnen een andere hoeveelheid overeenkomen dan volgt uit het bepaalde in het eerste en tweede
      lid, met inachtneming evenwel van het bepaalde in de overige bepalingen van deze wet en de [Meststoffenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '8.4'
    text: |-
      De in het eerste tot en met derde lid bedoelde hoeveelheid dient door de betrokken partijen gezamenlijk te worden
      aangegeven op het in [artikel 9, eerste lid][ref1], bedoelde formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel9
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '9'
  - number: '9.1'
    text: |-
      Degene die voornemens is te verplaatsen en degene van wiens bedrijf het desbetreffende niet-gebonden
      mestproductierecht afkomstig is geven van de verplaatsing gezamenlijk kennis aan het Bureau Heffingen met
      gebruikmaking van het daartoe bestemde, door Onze Minister vastgestelde formulier.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel9
  - number: '9.2'
    text: Het formulier dient overeenkomstig de daarbij aangegeven wijze volledig en naar waarheid te worden ingevuld.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel9
  - number: '9.3'
    text: |-
      Er kan eerst aanspraak op het in het eerste lid bedoelde mestproductierecht worden gemaakt vanaf het moment van de
      registratie van de kennisgeving door het Bureau Heffingen.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel9
  - number: '9.4'
    text: |-
      Registratie vindt niet plaats indien: - een grotere hoeveelheid niet-gebonden mestproductierechten ter registratie
      wordt aangeboden dan volgt uit de [artikelen 5][ref1] en [6][ref2];
        - blijkens de toepassing van paragraaf 3 van het Besluit mestbank en mestboekhouding ([Meststoffenwet][ref3])
      (*Stb.* 1987, 170) noch in het eerste jaar noch in het tweede jaar volgend op de inwerkingtreding van deze
      wet een productie van dierlijke meststoffen heeft plaatsgevonden op het bedrijf waarvan het niet-gebonden
      mestproductierecht afkomstig is;
        - het in het eerste lid bedoelde formulier niet of niet volledig is ingevuld of indien uit aan het Bureau Heffingen
      ter beschikking staande andere gegevens blijkt dat de verplaatsing geen doorgang kan vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006285#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006285
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0004054
  - number: '9.5'
    text: |-
      Voor het lopende kalenderjaar waarin de registratie plaatsvindt, kan degene op wiens naam de registratie
      plaatsvindt het niet-gebonden mestproductierecht nog slechts benutten in de mate waarin het niet-gebonden
      mestproductierecht in dat kalenderjaar niet werd benut op het bedrijf waarvan dit afkomstig is, één en ander met
      inachtneming van de [artikelen 5][ref1] en [6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006285#Artikel6
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006285
        artikel: '6'
  - number: '10.1'
    text: |-
      Degene die voornemens is te verplaatsen naar een ander aan hem toebehorend bedrijf of een andere aan hem
      toebehorende locatie die op 31 december 1986, indien het betreft de productie van dierlijke meststoffen afkomstig
      van varkens, kippen, rundvee of kalkoenen, dan wel op 31 december 1991, indien het betreft de productie van
      dierlijke meststoffen afkomstig van eenden, vossen, nertsen, konijnen, geiten of schapen, nog niet tot zijn bedrijf
      behoorde geeft daarvan kennis aan het Bureau Heffingen met gebruikmaking van het daartoe bestemde, door Onze
      Minister vastgestelde formulier.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel10
  - number: '10.2'
    text: |-
      [Artikel 9, tweede tot en met zesde lid][ref1], is van overeenkomstige toepassing op de in het eerste lid bedoelde
      kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel9
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '9'
  - number: '12.1'
    text: |-
      In afwijking van artikel 228 van Boek 3 van het Burgerlijk Wetboek kan op mestproductierechten geen pandrecht
      worden gevestigd.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel12
  - number: '12.2'
    text: |-
      Bij door Onze Minister te stellen regelen kan worden bepaald dat alvorens het Bureau Heffingen de in
      [artikel 9, eerste lid][ref1], bedoelde kennisgeving in behandeling neemt, van deze kennisgeving mededeling wordt
      gedaan aan in die regelen aan te geven derde-belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel9
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '9'
  - number: '12.3'
    text: |-
      Onze Minister kan nadere regelen stellen omtrent de uitvoering van het tweede lid, waarbij in elk geval kan
      worden bepaald welke gegevens door het Bureau Heffingen aan de derde-belanghebbende kenbaar worden gemaakt, binnen
      welke termijn zulks door het Bureau Heffingen dient te geschieden, de periode waarin het Bureau Heffingen de in
      [artikel 9, eerste lid][ref1], bedoelde kennisgeving niet in behandeling neemt, alsmede de wijze waarop en de
      termijn waarbinnen de in die regeling bedoelde derde-belanghebbende zich bij het Bureau Heffingen dient aan te
      melden en de bescheiden die deze derde-belanghebbende aan het Bureau Heffingen dient te overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel9
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '9'
  - number: '13.1'
    text: |-
      Met betrekking tot de toepassing van de bepalingen van deze wet dienen gegevens te worden bijgehouden
      overeenkomstig de door Onze Minister gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel13
  - number: '13.2'
    text: |-
      Bij de in het eerste lid bedoelde regelen kan tevens worden bepaald dat de gegevens dienen te worden verstrekt op
      de daarbij aangegeven wijze aan daartoe aan te wijzen organen.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel13
  - number: '14'
    text: |-
      Het is verboden onjuiste gegevens als bedoeld in [artikel 13][ref1], op te maken, over te leggen en af te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel13
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '13'
  - number: '15'
    text: |-
      Onze Minister doet over de werking van de eerste twee jaren van deze wet aan de beide Kamers der Staten-Generaal
      een verslag toekomen.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel15
  - number: '16'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan de belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel16
  - number: '17'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel17
  - number: '18.1'
    text: |-
      Bij door Onze Minister te stellen regelen kan worden bepaald dat een verzoek om registratie of kennisgeving als
      bedoeld in [artikel 9][ref1], 10 of 12, eerst in behandeling wordt genomen nadat een daarvoor vastgesteld bedrag
      is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel9
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '9'
  - number: '18.2'
    text: |-
      Al naar gelang sprake is van een registratiehandeling krachtens [artikel 9][ref1], 10 of 12 kan het in het eerste
      lid bedoelde bedrag verschillend worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel9
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '9'
  - number: '19'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 69][ref1] en[ 70 van de Meststoffenwet][ref2] is van toepassing op het
      bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel70
    url: https://wetten.overheid.nl/BWBR0006285/2001-07-06#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '70'
  - number: '20'
    text: |-
      Handelen in strijd met de [artikelen 2][ref1], [3][ref2], [4][ref3], [9, tweede en zesde lid][ref4], [10][ref5],
      [13][ref6], [14][ref7], [17][ref8] en [19][ref9] is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006285#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006285#Artikel4
