preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede gelet op de artikelen 237b van de gemeentewet (Stb. 1931,
    89) en 144b van de Provinciewet (Stb. 1962, 17), gewenst is bij wet regels te stellen met betrekking tot enkele
    specifieke uitkeringen aan provincies en gemeenten op het terrein van Verkeer en Waterstaat;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005062/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan aan een gemeente dan wel aan een openbaar lichaam als bedoeld in
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref1] of een provincie uit 's Rijks kas een bijdrage
      verlenen terzake van maatregelen ter bestrijding van de verkeersonveiligheid.

      2 Bij algemene maatregel van bestuur worden regels gesteld omtrent de verlening van bijdragen als bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0005062/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
  - number: '2'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan aan een provincie of een gemeente uit 's Rijks kas een bijdrage
      verlenen in de kosten van het beheer en onderhoud van waterstaatswerken met een functie voor de waterhuishouding of
      de waterkering.

      2 Bij algemene maatregel van bestuur worden regels gesteld omtrent de verlening van bijdragen als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0005062/2015-01-01#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan aan de provincie Zeeland uit 's Rijks kas een bijdrage verlenen in de
      exploitatiekosten van de veerdiensten over de Westerschelde.

      2 Bij ministerieel besluit worden regels gesteld omtrent de verlening van de bijdrage bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005062/2015-01-01#Artikel3
  - number: '4'
    text: |-
      1 De regels bedoeld in het tweede lid van de [artikelen 1][ref1], [2][ref2] en [3][ref3] hebben betrekking op de
      tijdsduur van de geldigheid van de betrokken bijdrageregeling, de voorwaarden waaraan moet worden voldaan om voor
      een bijdrage in aanmerking te komen, de wijze van vaststelling van de uitkeringsbedragen per rechthebbende alsmede
      zonodig het totaalbedrag van de jaarlijks te verlenen bijdragen, de betaling van de bijdrage en de controle op de
      besteding daarvan.

      2 Voor zover het bijdragen in de kosten van het beheer en onderhoud van hoofdvaarwegen betreft kunnen in de regels
      tevens voorschriften worden gegeven ter bescherming van de hoofdvaarwegfunctie.

      3 Bij een algemene maatregel van bestuur als bedoeld in het [tweede lid van de artikelen 1][ref4] en [2][ref5]
      kunnen onderwerpen worden aangewezen ten aanzien waarvan krachtens die maatregel regels kunnen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005062#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005062#Artikel2
