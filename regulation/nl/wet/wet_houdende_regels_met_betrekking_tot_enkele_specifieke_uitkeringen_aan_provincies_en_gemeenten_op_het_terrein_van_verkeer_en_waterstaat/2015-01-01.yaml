  - number: '5'
    text: |-
      1 Een algemene maatregel van bestuur als bedoeld in het [tweede lid van de artikelen 1][ref1] en [2][ref2] treedt
      niet eerder in werking dan een maand na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de
      plaatsing wordt onverwijld mededeling gedaan aan de beide Kamers der Staten-Generaal.

      2 Een ministerieel besluit als bedoeld in het [tweede lid van artikel 3][ref3] treedt niet eerder in werking
      dan een maand na de datum van uitgifte van de *Staatscourant* waarin zij is geplaatst. Van de plaatsing wordt
      onverwijld mededeling gedaan aan de beide Kamers der Staten-Generaal.


