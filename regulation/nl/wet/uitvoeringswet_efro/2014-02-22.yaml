  - number: '16'
    text: |-
      Onze Minister kan een autoriteit als bedoeld in [artikel 3][ref1] opdragen een rapportageplicht op grond van een
      EFRO-verordening uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0034784#Artikel3
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0034784
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '17'
    text: |-
      Voor zover een in [artikel 3][ref1] bedoelde autoriteit op grond van een EFRO-verordening een rapportage uitbrengt
      over werkzaamheden van een andere op grond van artikel 3 aangewezen autoriteit, wordt de laatstbedoelde autoriteit
      gedurende ten minste twee weken in de gelegenheid gesteld haar zienswijze te geven op een ontwerp van de
      rapportage, tenzij een inzagerecht op grond van een EFRO-verordening niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0034784#Artikel3
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0034784
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '20'
    text: |-
      In afwijking van [artikel 3, tweede lid][ref1], kan voor de periode 2014–2020 als autoriteit worden aangewezen
      een privaatrechtelijke rechtspersoon die voorafgaand aan die programmaperiode als autoriteit was aangewezen in het
      kader van de uitvoering van de destijds geldende EFRO-verordeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0034784#Artikel3
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0034784
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '21.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel21
  - number: '21.2'
    text: |-
      Indien het Staatsblad waarin het koninklijk besluit, bedoeld in het eerste lid, wordt geplaatst wordt uitgegeven na
      1 januari 2014, kan in dat besluit worden bepaald dat [artikel 3][ref1] terugwerkt uiterlijk tot en met 1 januari
      2014.


      [ref1]: https://wetten.overheid.nl/BWBR0034784#Artikel3
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0034784
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '22'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet EFRO.'
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel22
