regulatory_layer: WET
publication_date: '2021-03-17'
valid_from: '2014-02-22'
bwb_id: BWBR0034784
url: https://wetten.overheid.nl/BWBR0034784/2014-02-22
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen in verband met de uitvoering van
    verordeningen inzake het Europees Fonds voor Regionale Ontwikkeling;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Onze Minister:* Onze Minister van
      Economische Zaken;
        - *EFRO:* Europees Fonds voor Regionale Ontwikkeling;
        - *EFRO-verordening:* verordening van het Europees Parlement en de Raad van de Europese Unie betreffende het EFRO
      op grond van artikel 175, 177 of artikel 178 van het Verdrag betreffende de werking van de Europese Unie, alsmede
      een verordening of een besluit van de Europese Commissie ter uitvoering van een dergelijke verordening;
        - *programma:* programma opgesteld in het kader van de uitvoering van een EFRO-verordening dat de
      ontwikkelingsstrategie en invulling in een bepaald gebied of voor een specifieke sector omvat;
        - *grensoverschrijdend programma:* programma dat betrekking heeft op een gebied dat deels buiten Nederland valt;
        - *programmaperiode:* in een EFRO-verordening vastgestelde periode waarvoor een programma wordt opgesteld;
        - *cofinanciering:* financiële middelen die door het Rijk, een gemeente, een provincie of een ander openbaar
      lichaam ter beschikking worden gesteld ter medefinanciering van de uitvoering van een programma;
        - *project:* samenhangend geheel van activiteiten ter verwezenlijking van de doelstelling van een programma volgens
      de daarvoor in dat programma vastgestelde criteria;
        - *EGTS:* Europese groepering voor territoriale samenwerking als bedoeld in [verordening (EG) nr. 1082/2006]
      (32006R1082) van het Europees Parlement en de Raad van de Europese Unie van 5 juli 2006 betreffende een Europese
      groepering voor territoriale samenwerking (PbEU L 210).
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel1
  - number: '2.1'
    text: |-
      Gemeenten, provincies of andere openbare lichamen kunnen ten behoeve van een grensoverschrijdend programma een
      overeenkomst tot grensoverschrijdende samenwerking sluiten met territoriale gemeenschappen of autoriteiten van
      andere staten in de zin van artikel 2, tweede lid, van de op 21 mei 1980 te Madrid tot stand gekomen Europese
      Kaderovereenkomst inzake grensoverschrijdende samenwerking tussen territoriale gemeenschappen of autoriteiten (Trb.
      1980, 129).
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel2
  - number: '2.2'
    text: |-
      Een overeenkomst tot grensoverschrijdende samenwerking omvat buiten de uit een EFRO-verordening voortvloeiende
      onderdelen, ten minste afspraken rond het toezicht op de uitvoering van het programma.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel2
  - number: '2.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen indien een EFRO-verordening daartoe noopt nadere regels worden gesteld
      inzake het sluiten van een overeenkomst tot grensoverschrijdende samenwerking.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister wijst na een daartoe strekkend verzoek de autoriteiten aan die een taak hebben bij de uitvoering van
      het programma.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel3
  - number: '3.2'
    text: |-
      Voor aanwijzing als autoriteit in een programma komen in aanmerking een bestuursorgaan van
      het Rijk, van een provincie, van een gemeente of van een openbaar lichaam als bedoeld in
      [artikel 8 van de Wet gemeenschappelijke regelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
  - number: '3.3'
    text: |-
      Voor aanwijzing als autoriteit in geval van een grensoverschrijdend programma komt tevens een orgaan van een EGTS
      in aanmerking.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel3
  - number: '3.4'
    text: |-
      Een in Nederland gevestigde autoriteit die door Onze Minister is aangewezen, heeft nadat het programma is
      goedgekeurd de aan die autoriteit in een EFRO-verordening, in het programma en bij of krachtens deze wet toegekende
      taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel3
  - number: '3.5'
    text: |-
      Na de goedkeuring van het programma door de Europese Commissie maakt Onze Minister de aanwijzing van de
      autoriteiten bekend in de Staatscourant en doet daarbij mededeling van hun taken.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel3
  - number: '3.6'
    text: |-
      Indien een autoriteit haar taken niet of in onvoldoende mate uitvoert, trekt Onze Minister de aanwijzing in en
      wijst hij een ander bestuursorgaan aan dat de taken van die autoriteit uitvoert. Hij gaat daartoe niet eerder over
      dan nadat de betrokken autoriteit binnen een door Onze Minister te stellen termijn in de gelegenheid is gesteld
      haar taak alsnog naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel3
  - number: '3.7'
    text: Onze Minister maakt een besluit als bedoeld in het zesde lid, eerste volzin, bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel3
  - number: '4.1'
    text: |-
      Bij algemene maatregel van bestuur kan voor zover een goede uitvoering van een EFRO-verordening daartoe noopt,
      nader worden voorzien in een taakomschrijving van de in [artikel 3][ref1] bedoelde autoriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0034784#Artikel3
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0034784
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '4.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor zover een goede uitvoering van een EFRO-verordening daartoe noopt,
      regels worden gesteld inzake de onderlinge verhouding tussen de autoriteiten en de verhouding van de autoriteiten
      met de Europese Commissie. Deze regels kunnen mede betrekking hebben op gegevensuitwisseling.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel4
  - number: '5.1'
    text: |-
      Indien de noodzaak daartoe voortvloeit uit een EFRO-verordening kan Onze Minister organen of instanties aanwijzen
      die geen autoriteit zijn binnen een programma maar die anderszins zijn betrokken bij de uitvoering van die
      verordening of een andere EFRO-verordening.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel5
  - number: '5.2'
    text: |-
      Een orgaan of een instantie als bedoeld in het eerste lid heeft de taken en bevoegdheden die uit een EFRO-
      verordening voortvloeien. [Artikel 4, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034784#Artikel4
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0034784
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '6.1'
    text: |-
      Bij regeling van Onze Minister kunnen in verband met subsidieverstrekking in het kader van een programma regels
      worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
  - number: 6.1.a
    text: subsidiabiliteit van de kosten van projecten;
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
  - number: 6.1.b
    text: |-
      de vaststelling van subsidieplafonds of deelplafonds, alsmede omtrent de bevoegdheden ter zake van een of meer
      autoriteiten als bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034784#Artikel3
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0034784
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 6.1.c
    text: de activiteiten waarvoor subsidie kan worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
  - number: 6.1.d
    text: de criteria om voor subsidie in aanmerking te komen;
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
  - number: 6.1.e
    text: het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
  - number: 6.1.f
    text: de voorwaarden waaronder de subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
  - number: 6.1.g
    text: de aanvraag, alsmede de wijze waarop gegevens worden aangeleverd;
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
  - number: 6.1.h
    text: de verplichtingen van de subsidieontvanger;
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
  - number: 6.1.i
    text: de vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
  - number: 6.1.j
    text: de betaling van de subsidie en het verlenen van voorschotten;
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
  - number: 6.1.k
    text: intrekking en wijziging van de subsidieverlening of -vaststelling;
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
  - number: 6.1.l
    text: de financiering van het project en de wijze waarop deze tot stand komt;
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
  - number: 6.1.m
    text: de controle en het toezicht bij de uitvoering van een programma;
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
  - number: 6.1.n
    text: de procedure en tijdsverloop rond de besluitvorming over de subsidieverstrekking ter uitvoering van een programma.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde regels hebben, tenzij uit een EFRO-verordening anders voortvloeit, betrekking op
      de ten laste van het EFRO te verstrekken middelen, op de vanwege het Rijk te verstrekken cofinanciering en op
      andere cofinanciering voor zover de betrokken gemeente, provincie of het betrokken openbaar lichaam daartoe heeft
      besloten.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister, een van Onze andere Ministers, een gemeentebestuur of een provinciebestuur kan zijn bevoegdheid tot
      het nemen van besluiten inzake subsidieverstrekking in het kader van een programma delegeren aan een autoriteit als
      bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034784#Artikel3
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0034784
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '7.2'
    text: |-
      Een besluit tot delegatie als bedoeld in het eerste lid regelt de gevolgen van de intrekking van dat besluit. Het
      bevat voorts voorschriften omtrent de verantwoording van het gebruik van de gedelegeerde bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel7
  - number: '7.3'
    text: Ten aanzien van de bekendmaking van een besluit tot delegatie zijn
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel7
  - number: 7.3.a
    text: |-
      de [artikelen 136 tot en met artikel 138 van de Provinciewet][ref1] van overeenkomstige toepassing ten aanzien van
      een besluit van het provinciebestuur;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel136
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '136'
  - number: 7.3.b
    text: |-
      de [artikelen 139 tot en met 141 van de Gemeentewet][ref1] van overeenkomstige toepassing ten aanzien van een
      besluit van het gemeentebestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
  - number: '8'
    text: |-
      Voor zover cofinanciering door het Rijk is aan te merken als een specifieke uitkering in de zin van
      [artikel 15a van de Financiële-verhoudingswet][ref1], is artikel 15a, derde lid, van die wet niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel15a
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 15a
  - number: '9'
    text: |-
      Een autoriteit als bedoeld in [artikel 3][ref1] neemt algemene uitgangspunten omtrent de uitoefening van haar
      bevoegdheden rond subsidieverstrekking die zij vaststelt ingevolge een EFRO-verordening op in een beleidsregel.


      [ref1]: https://wetten.overheid.nl/BWBR0034784#Artikel3
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0034784
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '10.1'
    text: |-
      Voor zover subsidieverstrekking in strijd is met een EFRO-verordening of een andere ingevolge een verdrag voor de
      staat geldende verplichting kan een daartoe ingevolge [artikel 3][ref1] bevoegde autoriteit:


      [ref1]: https://wetten.overheid.nl/BWBR0034784#Artikel3
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0034784
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 10.1.a
    text: subsidieverstrekking weigeren;
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel10
  - number: 10.1.b
    text: een subsidie lager vaststellen dan overeenkomstig de subsidieverlening;
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel10
  - number: 10.1.c
    text: een subsidieverlening of subsidievaststelling intrekken of ten nadele van de ontvanger wijzigen.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel10
  - number: '10.2'
    text: |-
      Bij de vaststelling, intrekking of wijziging kan worden bepaald, dat over onverschuldigde betaalde subsidiebedragen
      een rentevergoeding verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel10
  - number: '10.3'
    text: |-
      De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verstrekt, tenzij bij de
      intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel10
  - number: '10.4'
    text: |-
      De [artikelen 4:49, derde lid][ref1], en [4:57, vierde lid, van de Algemene wet bestuursrecht][ref2] zijn niet van
      toepassing op de vaststelling, intrekking en wijziging, bedoeld in het eerste lid, onderscheidenlijk terugvordering
      indien de betrokken verdragsverplichting noodzaakt tot een latere intrekking, wijziging of terugvordering.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '11'
    text: |-
      Met het toezicht op de naleving van een EFRO-verordening en de bij of krachtens deze wet gestelde regels zijn
      belast de bij besluit van de in [artikel 3][ref1] bedoelde autoriteiten aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0034784#Artikel3
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0034784
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '12.1'
    text: |-
      De in [artikel 11][ref1] bedoelde aanwijzing kan in het kader van de uitvoering van een grensoverschrijdend
      programma, in een andere lidstaat van de EU werkzame personen betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0034784#Artikel11
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0034784
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '12.2'
    text: |-
      Een aanwijzing als bedoeld in het eerste lid, alsmede de daarbij geldende voorwaarden inzake aansturing, werkwijze
      en verantwoording, behoeven de instemming van het bestuursorgaan of de instantie in de andere lidstaat waarbij de
      aan te wijzen persoon in dienst is.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel12
  - number: '13.1'
    text: |-
      Onze Minister kan personen aanwijzen die deel kunnen nemen aan het uitoefenen van toezicht en controles door
      ambtenaren van de Europese Commissie op de uitvoering van programma’s op grond van een EFRO-verordening.
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel13
  - number: '13.2'
    text: |-
      [Afdeling 5.2 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing ten aanzien van de op
      grond van het eerste lid aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.2'
  - number: '14'
    text: |-
      Ten aanzien van personen aan wie ingevolge een grensoverschrijdend programma door een in het buitenland gevestigde
      autoriteit het uitoefenen van toezicht is opgedragen, zijn de [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3],
      [5:16][ref4], [5:17][ref5] en [5:20 van de Algemene wet bestuursrecht][ref6] van overeenkomstige toepassing, voor
      zover dat toezicht in Nederland wordt uitgeoefend, met dien verstande dat indien de aanwijzing in een andere EU-
      lidstaat werkzame personen betreft, daarvoor de voorafgaande goedkeuring van Onze Minister is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '15'
    text: |-
      Onze Minister kan van de in [artikel 3][ref1] bedoelde autoriteiten en de in [artikel 5][ref2] bedoelde instanties
      en organen alle inlichtingen verlangen en inzage vorderen van alle gegevens en bescheiden indien dat voor de
      vervulling van zijn taak in het kader van de uitvoering van een EFRO-verordening redelijkerwijs nodig is, dan
      wel indien hij daarover moet kunnen beschikken ten behoeve van de uitvoering van artikel 59 van [verordening
      nr. 966/2012](32012R0966) van het Europees Parlement en de Raad van de Europese Unie van 25 oktober 2012 tot
      vaststelling van de financiële regels van toepassing op de algemene begroting van de Unie en tot intrekking van
      verordening (EG, Euratom) nr. 1605/2002.


      [ref1]: https://wetten.overheid.nl/BWBR0034784#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0034784#Artikel5
    url: https://wetten.overheid.nl/BWBR0034784/2014-02-22#Artikel15
    references:
      - id: ref1
