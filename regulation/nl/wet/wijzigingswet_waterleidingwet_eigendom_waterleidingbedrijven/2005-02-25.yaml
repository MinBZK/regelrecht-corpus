preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben dat het gewenst is de Waterleidingwet te wijzigen teneinde te verzekeren dat
    de eigendom van waterleidingbedrijven in handen van de overheid blijft;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017184/2005-02-25#ArtikelAanhef
articles:
  - number: III
    text: |-
      In afwijking van [artikel 3j van de Waterleidingwet][ref1] kan, voor de periode gedurende welke dat nodig
      is voor de uitvoering van een plan tot reorganisatie als bedoeld in [hoofdstuk III van die wet][ref2], een
      distributiegebied worden toegewezen aan een waterleidingbedrijf dat niet voldoet aan de voorwaarden, bedoeld in
      [artikel 1, eerste lid, onderdeel f, onder 2°, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002246#Artikel3j
      [ref2]: https://wetten.overheid.nl/BWBR0002246#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0002246#Artikel1
    url: https://wetten.overheid.nl/BWBR0017184/2005-02-25#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0002246
        artikel: 3j
      - id: ref2
        bwb_id: BWBR0002246
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002246
        artikel: '1'
  - number: IV
    text: >-
      Onze Minister zendt binnen vijf jaar na inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0017184/2005-02-25#ArtikelIV
  - number: V
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0017184/2005-02-25#ArtikelV
