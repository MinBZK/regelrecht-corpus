preamble:
  text: |-
    gelet op de Richtlijn nr. 92/117/EEG van de Raad van 17 december 1992 inzake maatregelen voor de bescherming tegen
    bepaalde zoönoses en bepaalde zoönoseverwekkers bij dieren en in produkten van dierlijke oorsprong ten einde door
    voedsel overgedragen infecties en vergiftigingen te voorkomen,

    gelet op de artikelen 93, eerste lid, 95 en 102 van de Wet op de Bedrijfsorganisatie, en de artikelen 5, 6, 7 en 8
    van de Instellingsverordening Productschap Pluimvee en Eieren 1998-I,

    op 11 november 1999 vastgesteld de navolgende

    VERORDENING
  url: https://wetten.overheid.nl/BWBR0010849/2006-07-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening en de daarop berustende bepalingen wordt verstaan onder:









                  1.


                  productschap:


                  het Productschap Pluimvee en Eieren;




                  2.


                  bestuur:


                  het bestuur van het productschap;




                  3.


                  voorzitter:


                  de voorzitter van het productschap;




                  4.


                  pluimvee:


                  kippen, die worden opgefokt of gehouden voor de productie van broedeieren, vlees of consumptie-eieren;




                  5.


                  broedeieren:


                  eieren afkomstig van pluimvee, bestemd om te worden bebroed;




                  6.


                  eendagskuikens:


                  pluimvee dat nog géén 72 uur oud is;




                  7.


                  fokpluimvee:


                  pluimvee van 72 uur en ouder, bestemd voor de productie van broedeieren;




                  8.


                  vleeskuikens:


                  pluimvee van 72 uur en ouder, dat wordt gehouden voor de productie van vlees;




                  9.


                  leghennen:


                  pluimvee dat wordt gehouden voor de productie van consumptie-eieren;




                  10.


                  pluimveebedrijf:


                  inrichting die wordt gebruikt voor het (op)fokken en/of het houden van fokpluimvee en/of vleeskuikens
      en/of legpluimvee;




                  11.


                  fokbedrijf:


                  inrichting die zich toelegt op de productie van broedeieren, bestemd voor de productie van fokpluimvee;




                  12.


                  vermeerderingsbedrijf:


                  inrichting die zich toelegt op de productie van broedeieren, bestemd voor de productie van legpluimvee
      of vleeskuikens;




                  13.


                  opfokbedrijf:


                  een inrichting die zich toelegt op het opfokken van fokpluimvee tot het voortplantingsstadium;




                  14.


                  kuikenbroederij:


                  inrichting die wordt gebruikt voor het inleggen en uitbroeden van broedeieren onderscheidenlijk
      inrichting waarin één of meerdere vorengenoemde handelingen worden verricht;




                  15.


                  vleeskuikenbedrijf:


                  inrichting die wordt gebruikt voor het houden van vleeskuikens;




                  16.


                  leghennenbedrijf:


                  inrichting die wordt gebruikt voor het houden van leghennen;




                  17.


                  opfokleghennenbedrijf:


                  inrichting die zich toelegt op het opfokken van leghennen tot het stadium waarop zij consumptie-eieren
      produceren;




                  18.


                  meerleeftijdenleghennenbedrijf:


                  een leghennenbedrijf waarin koppels leghennen worden gehouden die per koppel in leeftijd verschillen
      (dan wel een leghennenbedrijf waarin leghennen worden gehouden waarbij de leghennen binnen één koppel van leeftijd
      verschillen);




                  19.


                  ondernemer:


                  een natuurlijk persoon of rechtspersoon, die een pluimveebedrijf of een kuikenbroederij uitoefent;




                  20.


                  koppel:


                  alle pluimvee met dezelfde gezondheidsstatus dat in dezelfde stal of binnen dezelfde uitloopruimte
      wordt geplaatst of gehouden en dat een epidemiologische eenheid vormt. In batterijen omvat deze term alle dieren
      die hetzelfde omsloten luchtvolume delen.
                  Bij een koppel leghennen geldt dat ingeval leghennen in meer dan één stal zijn gehuisvest, maar
      toch één gemeenschappelijke uitloop hebben, de leghennen uit elke stal als een afzonderlijk koppel moeten worden
      beschouwd.
                  Ingeval leghennen in meer dan één stal zijn gehuisvest, maar waarbij de stallen op de een of andere
      wijze (bijvoorbeeld via een gemeenschappelijke voorruimte) met elkaar in verbinding staan, vormt elke stal één
      epidemiologische eenheid. Elke stal wordt als één koppel beschouwd.
                  Ingeval meerleeftijden leghennen in één stal zijn gehuisvest, hebben de dieren in die stal dezelfde
      gezondheidsstatus. Deze dieren kunnen derhalve als één koppel worden gezien;




                  21.


                  open drinkwatersysteem:


                  drinkwatersysteem waarbij vlotterbakken of voorraadtanken, die geen goed sluitende deksel hebben,
      worden gebruikt en/of andere open verbindingen zijn;




                  22.


                  bedrijfsgebouw:


                  het gebouw waarin pluimvee wordt gehouden en/of broedeieren zijn ingelegd en de tot het gebouw
      behorende voorruimte en lokalen.
    url: https://wetten.overheid.nl/BWBR0010849/2006-07-02#Artikel1
  - number: '2'
    text: |-
      1 Ondernemers zijn, onverminderd enig ander wettelijk voorschrift, verplicht:

      a. binnen de bedrijfsgebouwen geen huisdieren, landbouwhuisdieren en ander pluimvee, sier- en nutsgevogelte toe
      te laten;

      b. indien ander pluimvee, sier- of nutsgevogelte wordt gehouden op het perceel waarop het pluimveebedrijf of de
      kuikenbroederij wordt uitgeoefend, deze dieren achter een afscheiding of in een volière te houden, waardoor deze
      dieren niet bij de pluimveestallen of de kuikenbroederij kunnen komen en de verzorging van deze dieren strikt
      gescheiden te houden van het pluimvee;

      c. de bedrijfsgebouwen zodanig in te richten dat vogels het bedrijfsgebouw niet kunnen binnenkomen, in het geval
      van legpluimveebedrijven met vrije uitloop zijn openingen die noodzakelijk zijn voor de vrije uitloop toegestaan;

      d. alleen bezoekers toegang tot de bedrijfsgebouwen te verschaffen, als dit voor de bedrijfsvoering strikt
      noodzakelijk is en indien zij handelen overeenkomstig de voorwaarden van de persoonlijke en bedrijfshygiëne;

      e. er op toe te zien dat alle op het bedrijf aanwezige personen de persoonlijke en bedrijfshygiëne volledig in
      acht nemen;

      f. er op toe te zien dat alle personen die het bedrijf willen betreden, vóór het betreden van het schone deel van
      het bedrijfsgebouw schone voor de pluimveevleessector staleigen bedrijfskleding aantrekken;

      g. er voor zorg te dragen dat per bedrijf in minstens één van de bedrijfsgebouwen een handenwasgelegenheid aanwezig
      is, waarin zich ten minste een wasbak met afvoer, water, zeep en een handdoek bevindt;

      h. er voor zorg te dragen dat de faciliteiten voor persoonlijke hygiëne in een goed functionerende staat zijn;

      i. er op toe te zien dat, voordat de stal en/of broederij wordt betreden, de handen worden gewassen;

      j. een ongediertebestrijdingsplan op te stellen en volgens het plan te werken, tenzij gewerkt wordt met een
      professionele ongediertebestrijdingsinstantie die minimaal elke twee maanden op het bedrijf langskomt om eventueel
      aanwezig ongedierte te bestrijden;

      k. alle acties met betrekking tot wering, signalering en bestrijding van ongedierte vast te leggen in, indien van
      toepassing, het ongediertebestrijdingsplan en te intensiveren bij een toename van dit ongedierte;

      l. drinkwater van een eigen bron in combinatie met een gesloten drinkwatersysteem, drinkwater van een eigen bron en
      drinkwater van het openbare waterleidingnet in combinatie met een open drinkwatersysteem jaarlijks door een erkende
      instantie, welke door de voorzitter is aangewezen en werkt volgens een door het bestuur vastgesteld protocol,
      te laten onderzoeken en de onderzoeksresultaten twee jaar te bewaren. Het bestuur kan bij besluit nadere regels
      stellen ten aanzien van het vorenbedoeld onderzoek. Wanneer de uitslag van het drinkwateronderzoek niet voldoet
      aan een door het bestuur vastgestelde norm dan dient de ondernemer de door het bestuur vastgestelde maatregelen
      te nemen;

      m. indien gebruik wordt gemaakt van drinkwater van het openbare waterleidingnet in combinatie met een gesloten
      drinkwatersysteem, aan te tonen dat het drinkwatersysteem tijdens elke leegstandperiode wordt gereinigd en ontsmet;

      n. indien gebruik wordt gemaakt van drinkwater van het openbare waterleidingnet in combinatie met een gesloten
      drinkwatersysteem en een drinkwateronderzoek is uitgevoerd overeenkomstig het bepaalde in onderdeel l., vervalt de
      verplichting tot reiniging en ontsmetting als bedoeld in onderdeel m., mits de uitslag van het drinkwateronderzoek
      voldoet aan de door het bestuur vastgestelde norm;

      o. wanneer zij een kuikenbroederij uitoefenen, de kuikenbroederij zo in te richten dat geen kruisbesmetting van de
      in de Bijlageonderdeel a. bedoelde schadelijke micro-organismen kan ontstaan;

      p. in de pluimveevleessector dienen de oppervlakken in de stallen glad en dicht te zijn. Bij visuele controle
      dienen naden en kieren schoon te zijn.

      2 Ondernemers zijn, onverminderd enig ander wettelijk voorschrift, voorts verplicht:

      a. het perceel waarop het pluimveebedrijf wordt uitgeoefend zodanig in te richten dat de perceelgrenzen herkenbaar
      zijn en dat voor bezoekers duidelijk is waar zij zich moeten melden;

      b. de bedrijfsgebouwen en de inventaris schoon te houden en het perceel waarop het pluimveebedrijf of de
      kuikenbroederij wordt uitgeoefend en met name de directe omgeving van de stallen of de kuikenbroederij schoon te
      maken en op te ruimen, zodat geen ongedierte aangetrokken wordt;

      c. de bedrijfsgebouwen zodanig in te richten, dat ongehinderde toegang door derden tot de stallen of de
      kuikenbroederij niet mogelijk is;

      d. in iedere stal of de kuikenbroederij een voorruimte aanwezig te hebben die volledig afgescheiden is van de
      ruimte waarin het pluimvee gehouden wordt;

      e. bij iedere stal en/of broederij een fysieke scheiding aan te brengen in een bufferdeel en een schoon deel en op
      de scheiding van het bufferdeel en het schone deel van schoeisel te wisselen;

      f. er voor zorg te dragen dat in het schone deel van de stal of de kuikenbroederij voldoende schoeisel aanwezig is;

      g. er voor zorg te dragen dat de looproutes van en naar de bedrijfsgebouwen verhard zijn, zodanig dat deze
      deugdelijk gereinigd kunnen worden;

      h. er voor zorg te dragen dat er een deugdelijke afwatering ten opzichte van de stallen op het perceel aanwezig is;

      i. voedersilo's op een verharde ondergrond te plaatsen, schoon te houden, van buiten de stallen te vullen en,
      indien meerdere voedersilo’s op het bedrijf aanwezig zijn, te voorzien van een bedrijfs- uniek nummer;

      j. gebruik te maken van een bedrijfseigen stofopvangmiddel bij het lossen van het voer;

      k. voeders, aanwezig bodem- en neststrooisel en verpakkingsmateriaal zodanig op te slaan dat deze schoon, droog en
      schimmelvrij blijven;

      l. voeder dat na de ontruiming van een stal nog aanwezig is in het voedersysteem buiten de silo af te voeren,
      zodanig dat het niet meer in contact kan komen met het pluimvee;

      m. in de pluimveevleessector dient mest, afkomstig van met Salmonella paratyphi B var. Java besmette koppels, van
      het bedrijfsperceel afgevoerd te worden. Deze mest mag niet in de directe omgeving van pluimveebedrijven worden
      uitgereden.

      3 Het bepaalde in het tweede lid, onderdeel e., is niet van toepassing op een ondernemer die een
      opfokleghennenbedrijf en/of een leghennenbedrijf uitoefent waarbij de opfokleghennen en/of de leghennen worden
      gehouden in legbatterijen, mits de betreffende ondernemer voldoet aan de door het bestuur vast te stellen eisen.

      4 Ondernemers die een pluimveebedrijf uitoefenen zijn verplicht zich jaarlijks ten minste één maal op eigen kosten
      te laten controleren op de naleving van het bepaalde bij of krachtens deze verordening door een door de voorzitter
      erkende controle-instantie.

      5 Ondernemers die een kuikenbroederij uitoefenen zijn verplicht zich iedere drie maanden op eigen kosten te laten
      controleren op de naleving van het bepaalde bij of krachtens deze verordening door een door de voorzitter erkende
      controle-instantie.

      6 Het bestuur stelt bij besluit de erkenningsvoorwaarden vast waaraan een controle-instantie, zoals bedoeld
      in de voorgaande twee leden, ten minste dient te voldoen. Deze voorwaarden strekken tot waarborging van de
      onafhankelijkheid en de expertise van de controle-instanties.

      7 Het besluit zoals bedoeld in het voorgaande lid wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0010849/2006-07-02#Artikel2
  - number: 2a
    text: |-
      1 Controle-instanties zoals bedoeld in [artikel 2, vierde, vijfde en zesde lid][ref1], kunnen op aanvraag worden
      erkend door de voorzitter.

      2 De erkenning kan tijdelijk en onder voorwaarden worden verleend. De erkenning kan worden ingetrokken indien
      blijkt dat niet meer aan de voorwaarden wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0010849#Artikel2
    url: https://wetten.overheid.nl/BWBR0010849/2006-07-02#Artikel2a
