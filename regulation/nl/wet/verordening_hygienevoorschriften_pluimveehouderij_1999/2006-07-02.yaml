  - number: '7'
    text: |-
      1 Het bestuur wijst een of meerdere instantie(s) aan die wordt belast met de controle op naleving van het bepaalde
      bij of krachtens deze verordening. Bij het uitoefenen van de controle houdt de aangewezen instantie(s) zich aan de
      bepalingen van het protocol dat is vastgesteld door het bestuur van het productschap.

      2 Indien een ondernemer het bepaalde bij of krachtens deze verordening heeft overtreden dan zal de in het eerste
      lid bedoelde instantie(s) de AID hiervan op hoogte stellen.
    url: https://wetten.overheid.nl/BWBR0010849/2006-07-02#Artikel7
  - number: '8'
    text: |-
      De ondernemer is verplicht aan controleurs van de in [artikel 7][ref1] bedoelde instanties:

      a. al die gegevens te verstrekken of te doen verstrekken, die naar hun oordeel nodig zijn voor de vervulling van
      hun taak;

      b. inzage te geven of te doen geven van die boeken en bescheiden, die naar hun oordeel nodig zijn voor de
      vervulling van hun taak;

      c. te allen tijde toegang te geven of te doen geven tot hun bedrijfsruimten en tot die plaatsen of vervoermiddelen,
      waar of waarin voorraden, die tot het bedrijf van de ondernemer behoren, zijn opgeslagen of worden vervoerd;

      d. te gedogen dat zij monsters nemen uit de voorraden van het bedrijf van de ondernemer, ongeacht de plaats waar
      of waarin zich die voorraden bevinden, en alsdan de gevorderde medewerking overeenkomstig de aanwijzingen en onder
      toezicht van die controleurs te verlenen;

      e. voor het overige alle medewerking te verlenen ter vervulling van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0010849#Artikel7
