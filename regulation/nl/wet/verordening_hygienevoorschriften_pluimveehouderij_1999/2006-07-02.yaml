        artikel: '4'
  - number: '6'
    text: |-
      1 Indien een besmetting met de in de Bijlage bedoelde schadelijke micro- organismen bij een koppel pluimvee is
      vastgesteld dient, onverminderd enig ander wettelijk voorschrift, de ondernemer die een pluimveebedrijf uitoefent,
      op wiens bedrijf het betreffende koppel zich bevindt, onmiddellijk na het ontruimen van de stal waarin hij dat
      koppel heeft gehouden, de betreffende stal grondig te reinigen en te ontsmetten.

      Voorts dient de ondernemer de in [artikel 4, eerste lid][ref1] bedoelde monsters te laten onderzoeken door een
      laboratorium als bedoeld in [artikel 4, achtste lid][ref2].

      2 Indien de in het vorige lid bedoelde besmetting is vastgesteld bij een koppel pluimvee dat zich op een
      opfokbedrijf, opfokleghennenbedrijf, fokbedrijf of vermeerderingsbedrijf bevindt kan de voorzitter de betreffende
      ondernemer verplichten het besmette koppel pluimvee te ruimen of te behandelen. Het bestuur stelt bij besluit
      vast onder welke voorwaarden een koppel pluimvee geruimd of behandeld kan worden. Een in de vorige zin bedoelde
      voorwaarde kan een verbod tot aflevering van pluimvee en/of broedeieren inhouden.

      3 Na het reinigen en ontsmetten, als bedoeld in het eerste lid, is de ondernemer verplicht een onderzoek op de
      aanwezigheid in de stal van de in de Bijlage onderdeel a. bedoelde schadelijke micro-organismen uit te laten voeren
      door een erkende instantie. Het bestuur kan nadere regels stellen omtrent het tijdstip waarop de in de vorige zin
      bedoelde onderzoek dient plaats te vinden.

      4 Indien uit het onderzoek op de aanwezigheid van de in de Bijlage onderdeel a. bedoelde schadelijke micro-
      organismen, als bedoeld in het derde lid, blijkt dat de betreffende stal niet vrij is van deze schadelijke micro-
      organismen, dient de ondernemer de stal te reinigen en te ontsmetten. Het bestuur stelt nadere regels vast over het
      tijdstip en de wijze waarop de hiervoor bedoelde reiniging en ontsmetting dient plaats te vinden.

      5 In afwijking van het eerste lid dient de ondernemer die een kuikenbroederij uitoefent, na vaststelling van een
      besmetting in de kuikenbroederij met de in de Bijlage onderdeel a. bedoelde schadelijke micro-organismen, de door
      het bestuur bij besluit vastgestelde maatregelen te nemen.

      6 In afwijking van het eerste lid dient de ondernemer die een opfokleghennenbedrijf en/of leghennenbedrijf
      uitoefent, na vaststelling van een besmetting met de in de Bijlage onderdeel c. bedoelde schadelijke micro-
      organismen bij een koppel pluimvee, onmiddellijk na het ontruimen van de stal waarin hij dat koppel heeft
      gehouden, de betreffende stal te reinigen en te laten ontsmetten door een professioneel ontsmettingsbedrijf. De
      ondernemer die een leghennenbedrijf drijft dient na vaststelling van een besmetting als hiervoor bedoeld tevens een
      tracerings-, monitorings- en bestrijdingsplan op te stellen en uit te voeren.

      7 Na het reinigen en ontsmetten, als bedoeld in het zesde lid, is de ondernemer die een opfokleghennenbedrijf en/
      of een leghennenbedrijf uitoefent verplicht, in afwijking van het derde lid, een onderzoek op de aanwezigheid in de
      stal van de in de Bijlage, onderdeel c. bedoelde schadelijke micro-organismen uit te laten voeren door een erkende
      instantie.

      8 Indien uit het onderzoek op de aanwezigheid van de in de Bijlage, onderdeel c. bedoelde schadelijke micro-
      organismen, als bedoeld in het zevende lid, blijkt dat de betreffende stal niet vrij is van deze schadelijke micro-
      organismen, dient de ondernemer de stal opnieuw te laten ontsmetten door een professioneel ontsmettingsbedrijf.
      Na het ontsmetten dient de betreffende stal opnieuw te worden onderzocht op de aanwezigheid van de in de Bijlage,
      onderdeel c., bedoelde schadelijke micro-organismen. Na het laatstbedoelde onderzoek is het toegestaan een nieuw
      koppel pluimvee op te zetten in de desbetreffende stal.

      9 In het geval dat uit het onderzoek, als bedoeld in [artikel 4][ref3], blijkt dat een leghennenbedrijf twee
      opeenvolgende keren besmet is met de in de Bijlage, onderdeel c. bedoelde schadelijke micro-organismen, dan dient
      de ondernemer een tracerings-, monitorings- en bestrijdingsplan op te stellen en uit te voeren.

      10 Het in het zesde en negende lid bedoelde plan dient te worden opgesteld in de periode tussen de uitslag van de
      monstername en voor het plaatsen van een volgend koppel pluimvee. Het bestuur kan bij besluit vaststellen aan welke
      eisen het in de vorige zin bedoelde plan dient te voldoen.

      11 Indien de ondernemer die een leghennenbedrijf uitoefent het in het vorige lid bedoelde plan ten uitvoer heeft
      gelegd maar uit het onderzoek, bedoeld in [artikel 4][ref4], blijkt dat zijn leghennenbedrijf besmet is met de in
      de Bijlage bedoelde schadelijke micro-organismen kan de voorzitter aan het betreffende leghennenbedrijf aanvullende
      eisen stellen betreffende de inrichting, de bestrijdings- en beheersingsmaatregelen en aan de bestemming van de
      eieren. Het bestuur stelt bij besluit vast welke aanvullende eisen aan leghennenbedrijven gesteld kunnen worden.

      Het bestuur stelt bij besluit vast in welke situaties er eisen gesteld kunnen worden aan de bestemming van eieren.

      12 De erkende instantie, als bedoeld in het derde en zevende lid wordt aangewezen door de voorzitter en werkt
      volgens een door het bestuur goedgekeurd protocol.

      13 Indien op een leghennenbedrijf bij een koppel leghennen een S.e./S.t. besmetting is vastgesteld is het voor
      de ondernemer verplicht op het desbetreffende bedrijf uitsluitend tegen S.e. gevaccineerde koppels op te zetten,
      totdat er uitsluitend gevaccineerde koppels op het bedrijf aanwezig zijn.

      14 Indien bij de ondernemer die een pluimveebedrijf in de pluimveevleessector uitoefent bij een koppel één van
      de in de Bijlage, onderdeel a., bedoelde schadelijke micro-organismen is geconstateerd, moet de ondernemer een
      tracerings-, monitorings- en bestrijdingsplan opstellen.


