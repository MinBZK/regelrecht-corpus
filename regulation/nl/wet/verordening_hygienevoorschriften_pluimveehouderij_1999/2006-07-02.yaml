        artikel: '2'
  - number: '3'
    text: |-
      1 Iedere ondernemer die een pluimveebedrijf uitoefent is, onverminderd enig ander wettelijk voorschrift, verplicht
      onmiddellijk na het ontruimen van een stal waarin hij een koppel pluimvee heeft gehouden, de in die stal aanwezige
      mest en strooisel te verwijderen en na afvoer van de mest en strooisel de betreffende stal grondig te reinigen en
      te ontsmetten.

      Het plaatsen van nieuwe leghennen is pas toegestaan na het reinigen en het ontsmetten van de stal. Uitgezonderd
      zijn de meerleeftijdenstallen en koppels die geruid zijn. Meerleeftijdenstallen worden niet ontsmet maar slechts
      gereinigd.

      2 In afwijking van het eerste lid is iedere ondernemer die een opfokleghennenbedrijf uitoefent, onverminderd enig
      ander wettelijk voorschrift, verplicht voor het opzetten van eendagskuikens in een stal, de in die stal aanwezige
      mest en strooisel te verwijderen en na afvoer van de mest en strooisel de betreffende stal grondig te reinigen en
      te ontsmetten . Iedere ondernemer die een opfokleghennenbedrijf uitoefent is ten minste verplicht de stal minimaal
      een keer per jaar grondig te reinigen en te ontsmetten.

      3 Iedere ondernemer die een pluimveebedrijf in de legsector uitoefent is verplicht na het reinigen en ontsmetten,
      als bedoeld in het eerste lid, een hygiëne-onderzoek te laten uitvoeren door een erkende instantie. De uitslag van
      dit onderzoek dient te voldoen aan de norm dat door het bestuur bij besluit zal worden vastgesteld.

      4 De ondernemer die een pluimveebedrijf in de pluimveevleessector uitoefent laat eenmaal per jaar,
      nadat de stal is gereinigd en ontsmet als bedoeld in het eerste lid, in de stal een hygiëneonderzoek
      en een visuele controle uitvoeren door een door de voorzitter erkende instantie, overeenkomstig het
      [Besluit protocollen hygiënevoorschriften pluimveehouderij 1999][ref1].

      5 Iedere ondernemer die een kuikenbroederij uitoefent is, onverminderd enig ander wettelijk voorschrift, verplicht
      onmiddellijk na de aflevering van de eendagskuikens, de gebruikte lokalen te reinigen en ontsmetten.

      6 Iedere ondernemer die een kuikenbroederij uitoefent is verplicht een hygiëne- onderzoek te laten uitvoeren door
      een erkende instantie, volgens een door het bestuur vastgesteld programma, waarbij het onder door het bestuur vast
      te stellen voorwaarden is toegestaan dat de ondernemer die een kuikenbroederij uitoefent zelf een deel van het
      vorengenoemde programma uitvoert. De uitslag van dit onderzoek dient te voldoen aan de norm dat door het bestuur
      bij besluit zal worden vastgesteld.

      7 Indien een ondernemer die een leghennenbedrijf uitoefent gebruik heeft gemaakt van een professioneel
      ontsmettingsbedrijf bij het, ingevolge het eerste lid verplichte, reinigen en ontsmetten, is dat betreffende
      bedrijf, in afwijking van het derde lid, vrijgesteld van de verplichting een hygiëne- onderzoek uit te laten
      voeren .

      8 Het bepaalde in het derde lid van dit artikel is niet van toepassing op ondernemers die een leghennenbedrijf
      uitoefenen waarin minder dan 250 leghennen worden gehouden en waarvan de eieren bestemd zijn voor eigen consumptie
      en/of boerderijverkoop.

      9 De erkende instantie, bedoeld in het derde en zesde lid, wordt aangewezen door de voorzitter en werkt volgens een
      door het bestuur goedgekeurd protocol.

      10 Iedere ondernemer is verplicht de uitslag van het hygiëne-onderzoek, bedoeld in het derde en zesde lid, twee
      jaar te bewaren.


      [ref1]: https://wetten.overheid.nl/BWBR0010848
