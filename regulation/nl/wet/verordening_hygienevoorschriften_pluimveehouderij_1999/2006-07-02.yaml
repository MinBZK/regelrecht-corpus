  - number: '4'
    text: |-
      1 Iedere ondernemer is verplicht elk koppel pluimvee te laten onderzoeken op de aanwezigheid van de in de Bijlage,
      onderdeel a., bedoelde schadelijke micro-organismen. Voorts is iedere ondernemer verplicht monsters te nemen van
      voeders op zijn bedrijf. Het bestuur kan regels stellen omtrent het materiaal dat bemonsterd dient te worden, de
      wijze van bemonstering, alsmede het tijdstip waarop de bemonstering dient plaats te vinden.

      2 Iedere ondernemer die een vleeskuikenbedrijf uitoefent is verplicht twee maal per jaar een koppel vleeskuikens
      bij vertrek van zijn bedrijf te onderzoeken op de aanwezigheid van de in de Bijlage, onderdeel b. bedoelde
      schadelijke micro-organismen. Vanaf een door het bestuur vast te stellen datum dient de ondernemer het in de vorige
      zin bedoelde onderzoek bij elk koppel uit te voeren.

      3 Het in het eerste en tweede lid bedoelde onderzoek geschiedt door middel van het nemen van monsters. De monsters
      dienen te worden genomen door een erkende instantie, die wordt aangewezen door de voorzitter en werkt volgens een
      door het bestuur goedgekeurd protocol.

      4 Iedere ondernemer die een opfokleghennenbedrijf en/of een leghennenbedrijf uitoefent is verplicht, in afwijking
      van het eerste lid, elk koppel pluimvee te laten onderzoeken op de aanwezigheid van de in de Bijlage, onderdeel c.
      bedoelde schadelijke micro-organismen.

      5 In afwijking van het derde lid is het de ondernemer die een vleeskuikenbedrijf, kuikenbroederij of opfokbedrijf
      uitoefent in de door het bestuur bij besluit aangewezen gevallen toegestaan zelf monsters te nemen of te laten
      nemen.

      6 Het is de ondernemer die een opfokleghennenbedrijf en/of leghennenbedrijf uitoefent toegestaan, in afwijking van
      het derde lid, monsters te laten nemen door een veterinair of paraveterinair.

      7 Het bestuur kan regels stellen omtrent de wijze van bemonstering en het tijdstip waarop de bemonstering dient
      plaats te vinden.

      8 De monsters dienen te worden onderzocht door een erkend laboratorium, dat wordt aangewezen door de voorzitter, op
      basis van door het bestuur vast te stellen erkenningsvoorwaarden.

      9 Iedere ondernemer is verplicht de uitslag van het onderzoek, bedoeld in het eerste, tweede en vierde lid, twee
      jaar te bewaren.
    url: https://wetten.overheid.nl/BWBR0010849/2006-07-02#Artikel4
  - number: '5'
    text: |-
      1 Iedere ondernemer is verplicht de informatie, die is verkregen door middel van het onderzoek bedoeld in het
      [eerste, tweede en vierde lid van artikel 4][ref1], door te geven aan de afnemer van het pluimvee, broedeieren of
      consumptie-eieren. Het bestuur kan bij besluit bepalen dat een ondernemer tevens verplicht is de in de vorige zin
      bedoelde informatie aan de leverancier van pluimvee of broedeieren en/of aan het productschap door te geven.

      2 Het bestuur kan regels stellen omtrent de wijze waarop de in het eerste lid bedoelde informatie moet worden
      doorgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0010849#Artikel4
    url: https://wetten.overheid.nl/BWBR0010849/2006-07-02#Artikel5
