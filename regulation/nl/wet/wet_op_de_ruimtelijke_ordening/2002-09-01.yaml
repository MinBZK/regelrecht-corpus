  - number: '35'
    text: |-
      De gemeenteraad kan besluiten een bestemmingsplan geheel of gedeeltelijk in te trekken. De [artikelen 23-29][ref1]
      zijn van overeenkomstige toepassing. Intrekking van een bestemmingsplan voor een gebied, dat niet tot een bebouwde
      kom behoort, is behoudens ingeval ontheffing is verleend ingevolge het bepaalde in [artikel 10, derde lid][ref2],
      slechts mogelijk, indien voor dat gebied een ontwerp voor een nieuw bestemmingsplan ter inzage is gelegd dan wel
      een nieuw bestemmingsplan is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel10
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel35
