  - number: '39'
    text: |-
      Een planologische kernbeslissing ten behoeve van een groot project van nationaal belang bevat een of meer concrete
      beleidsbeslissingen. Bij de nadere besluitvorming over zodanige projecten worden die beleidsbeslissingen in acht
      genomen.
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel39
  - number: '40'
    text: |-
      1 Gedeputeerde staten kunnen burgemeester en wethouders verzoeken ten behoeve van de verwezenlijking van een
      project vrijstelling te verlenen van het geldende bestemmingsplan voor zover bovengemeentelijke belangen zulks
      vorderen, een verwezenlijking van dat project in de naaste toekomst noodzakelijk is en naar het oordeel van
      gedeputeerde staten of van Onze Minister de besluitvorming omtrent die verwezenlijking is vastgelopen. In dat
      geval is [artikel 19][ref1] niet van toepassing. Bij hun verzoek voegen gedeputeerde staten, onder vermelding van
      de redenen tot het verzoek, een beschrijving van het betrokken project en geven zij aan welke consequenties het
      project zal hebben voor het betreffende bestemmingsplan. Bij algemene maatregel van bestuur kunnen voorschriften
      worden gegeven omtrent het verzoek en de daarbij behorende stukken. Het verzoek geeft aan voor welk gebied het
      geldt en wordt vanaf het tijdstip van ontvangst voor dit gebied gelijkgesteld met een voorbereidingsbesluit
      als bedoeld in [artikel 21][ref2]. Bij hun verzoek voegen gedeputeerde staten het desbetreffend verzoek tot
      vrijstelling voor het betrokken project met daarbij behorende stukken. Zij doen hiervan gelijktijdig mededeling aan
      provinciale staten en Onze Minister door toezending van een afschrift van hun verzoek. Onze Minister heeft gelijke
      bevoegdheid. Hij doet gelijktijdig mededeling van zijn verzoek door toezending van een afschrift daarvan aan de
      Tweede Kamer der Staten-Generaal en gedeputeerde staten.

      2 Voor zover het verzoek van gedeputeerde staten geen grondslag vindt in of redelijkerwijs voortvloeit uit een
      streekplan of het provinciaal ruimtelijk beleid, voor zover dit is neergelegd in een besluit van provinciale
      staten, de provinciale planologische commissie gehoord, stellen gedeputeerde staten vier weken tevoren provinciale
      staten in kennis van hun voornemen om toepassing te geven aan het eerste lid, onder vermelding van de redenen
      daarvoor. Het verzoek kan binnen de in de eerste volzin genoemde termijn worden gedaan

      a. indien door of namens provinciale staten de wens te kennen wordt gegeven dat zij over het voornemen in het
      openbaar willen beraadslagen en die beraadslagingen binnen die termijn zijn beëindigd, dan wel

      b. indien binnen die termijn te kennen wordt gegeven dat van beraadslagingen wordt afgezien.

      Voor zover het verzoek van Onze Minister geen grondslag vindt in een plan als bedoeld in [artikel 2][ref3], dan wel
      in een aanwijzing als bedoeld in [artikel 37, tweede lid][ref4], stelt hij de Tweede Kamer vier weken tevoren in
      kennis van zijn voornemen om toepassing te geven aan het eerste lid, onder vermelding van de redenen daarvoor. De
      tweede volzin is van overeenkomstige toepassing.

      3 Zo spoedig mogelijk, doch in elk geval binnen zes weken na ontvangst van het verzoek met de bijbehorende aanvraag
      besluiten burgemeester en wethouders omtrent medewerking aan het verzoek tot het verlenen van vrijstelling.

      4 Indien burgemeester en wethouders besluiten tot medewerking aan het verzoek, leggen zij binnen twee weken na
      dagtekening van hun besluit het verzoek tot het verlenen van vrijstelling met de bijbehorende aanvraag gedurende
      vier weken ter gemeentesecretarie voor een ieder ter inzage.

      5 Burgemeester en wethouders geven van de nederlegging te voren in de *Staatscourant*, in een of meer dag- of
      nieuwsbladen, die in de gemeente verspreid worden, en voorts op de gebruikelijke wijze kennis. Afschrift van de
      kennisgeving wordt gezonden aan gedeputeerde staten en de inspecteur van de ruimtelijke ordening. Indien Onze
      Minister om medewerking heeft verzocht, wordt tevens een afschrift gezonden aan Onze Minister.

      6 De kennisgeving houdt mededeling in van de bevoegdheid voor een ieder om gedurende de termijn van
      terinzageligging schriftelijk bedenkingen tegen het verlenen van vrijstelling naar voren te brengen bij
      burgemeester en wethouders.

      7 Binnen acht weken na afloop van de termijn van terinzageligging, genoemd in het vierde lid, besluiten
      burgemeester en wethouders omtrent het verzoek tot het verlenen van vrijstelling. Gedeputeerde staten of Onze
      Minister kunnen deze termijn op verzoek van burgemeester en wethouders eenmaal met ten hoogste acht weken
      verlengen.

      8 Indien burgemeester en wethouders niet tijdig hebben besloten omtrent medewerking als bedoeld in het derde
      lid, dan wel hun medewerking weigeren of, indien de termijn voor terinzagelegging wordt overschreden, besluiten
      gedeputeerde staten onderscheidenlijk Onze Minister omtrent het verlenen van vrijstelling. Het vierde tot en met
      zevende lid zijn van overeenkomstige toepassing.

      9 Indien burgemeester en wethouders niet binnen de in het zevende lid genoemde termijn besluiten dan wel bij hun
      besluit ingevolge het zevende lid geen vrijstelling verlenen, besluiten gedeputeerde staten onderscheidenlijk Onze
      Minister omtrent het verlenen van de vrijstelling binnen vier weken na afloop van die termijn, dan wel na eerdere
      kennisgeving van dat besluit. Burgemeester en wethouders dragen onverwijld de desbetreffende stukken over aan
      gedeputeerde staten onderscheidenlijk Onze Minister.

      10 Tegelijkertijd met de bekendmaking van het besluit op het verzoek om vrijstelling wordt daarvan mededeling
      gedaan aan degenen die bedenkingen naar voren hebben gebracht, aan gedeputeerde staten en de inspecteur van de
      ruimtelijke ordening en, indien Onze Minister om medewerking heeft verzocht, tevens aan Onze Minister. Indien
      gedeputeerde staten of Onze Minister hebben besloten tot verlening van vrijstelling, handelen zij overeenkomstig,
      met dien verstande dat gedeputeerde staten of Onze Minister tevens mededeling doen van het besluit door toezending
      van een afschrift aan burgemeester en wethouders alsmede aan provinciale staten onderscheidenlijk de Tweede Kamer
      der Staten-Generaal. Afschrift van het besluit ligt zo spoedig mogelijk voor een ieder ter gemeentesecretarie ter
      inzage. Het vijfde lid, eerste volzin, is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
