  - number: '22'
    text: |-
      De bekendmaking van een voorbereidingsbesluit geschiedt door terinzagelegging van dit besluit voor een ieder.
      [Artikel 3:12, eerste lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing. Van het
      voorbereidingsbesluit wordt tevens mededeling gedaan in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel312
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:12
  - number: '23'
    text: |-
      1 Op de voorbereiding van een bestemmingsplan is de in [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      geregelde procedure van toepassing, met dien verstande dat

      a. burgemeester en wethouders de kennisgeving, bedoeld in [artikel 3:12][ref2], tevens in de Staatscourant
      plaatsen,

      b. het ontwerp gedurende vier weken ter inzage ligt gedurende welke periode het ontwerp tevens desgevraagd ten
      minste gedurende drie aaneengesloten uren per week buiten de werkuren kan worden ingezien,

      c. een ieder gedurende de termijn van terinzageligging schriftelijk zijn zienswijze omtrent het ontwerp kenbaar kan
      maken, en

      d. de gemeenteraad degenen die hun zienswijze kenbaar hebben gemaakt in de gelegenheid stelt tot het geven van een
      nadere mondelinge toelichting.

      2 Worden in het ontwerp van een bestemmingsplan ingevolge [artikel 13, eerste lid][ref3], gronden aangewezen ten
      aanzien waarvan de verwerkelijking van het plan in de naaste toekomst nodig wordt geacht, dan geschiedt daarvan,
      onverminderd het tweede lid, afzonderlijke kennisgeving aan degenen die in de kadastrale registratie staan vermeld
      als eigenaar van die gronden of rechthebbende op een beperkt recht waaraan die gronden onderworpen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel312
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel13
