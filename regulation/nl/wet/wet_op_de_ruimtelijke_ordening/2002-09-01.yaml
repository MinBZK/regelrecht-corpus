  - number: 6a
    text: |-
      Het gemeentebestuur betrekt de ingezetenen van de gemeente en in de gemeente een belang hebbende natuurlijke
      en rechtspersonen bij de voorbereiding van ruimtelijke plannen of herziening daarvan dan wel bij de
      voorbereiding van toepassing van [artikel 19, eerste lid][ref1], op de wijze voorzien in de krachtens
      [artikel 150 van de Gemeentewet][ref2] vastgestelde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel150
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel6a
