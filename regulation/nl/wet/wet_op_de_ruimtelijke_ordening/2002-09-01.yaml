  - number: '64'
    text: |-
      1 Bij het opsporen van een strafbaar feit als bedoeld in de [artikelen 59][ref1] en [60][ref2] hebben de in
      [artikel 63][ref3] bedoelde ambtenaren toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling
      van hun taak nodig is.

      2 Wij kunnen bij algemene maatregel van bestuur voorschrijven, dat ten aanzien van bepaalde plaatsen of plaatsen,
      die tot bepaalde doeleinden dienen, de in het eerste lid bedoelde bevoegdheid slechts wordt uitgeoefend door
      bepaalde der in [artikel 63][ref4] genoemde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0002375#Artikel63
