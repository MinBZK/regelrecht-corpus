  - number: 19a
    text: |-
      1 Het vrijstellingsbesluit, bedoeld in [artikel 19, eerste en tweede lid][ref1], bevat een beschrijving van het
      betrokken project, de ruimtelijke onderbouwing en de afwegingen die aan het verlenen van vrijstelling ten grondslag
      liggen. [Artikel 15, derde lid][ref2], is van overeenkomstige toepassing.

      2 De gemeenteraad of in voorkomend geval burgemeester en wethouders beslissen zo spoedig mogelijk, doch in elk
      geval binnen acht weken na ontvangst van de aanvraag tot vrijstelling als bedoeld in [artikel 19][ref3], of
      toepassing zal worden gegeven aan het vierde lid.

      3 Indien besloten wordt geen toepassing te geven aan het vierde lid wordt de vrijstelling geweigerd.

      4 Op de voorbereiding van het besluit omtrent de vrijstelling, bedoeld in [artikel 19][ref4], is de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref5] geregelde procedure van toepassing, met dien verstande dat:

      a. de aanvraag gedurende vier weken ter inzage ligt,

      b. gedurende de termijn van terinzageligging een ieder schriftelijk zijn zienswijze omtrent de aanvraag kenbaar kan
      maken, en,

      c. indien geen verklaring van geen bezwaar van gedeputeerde staten is vereist, burgemeester en wethouders binnen
      vier weken na afloop van de termijn van terinzageligging beslissen.

      5 De gemeenteraad beslist of in voorkomend geval burgemeester en wethouders beslissen binnen acht weken na afloop
      van de termijn van terinzageligging, genoemd in het vierde lid, onder a, omtrent het aanvragen van een verklaring
      van geen bezwaar.

      6 Indien tot aanvraag van de verklaring van geen bezwaar wordt besloten, wordt deze binnen twee weken nadien met de
      aanvraag om vrijstelling en de in voorkomend geval ingebrachte bedenkingen aan gedeputeerde staten gezonden.

      7 Alvorens het besluit omtrent de verklaring van geen bezwaar, bedoeld in [artikel 19, eerste lid][ref6], of in
      voorkomend geval tweede lid, te nemen, horen gedeputeerde staten de inspecteur van de ruimtelijke ordening.

      8 Het besluit omtrent de verklaring van geen bezwaar, bedoeld in [artikel 19, eerste lid][ref7], of in
      voorkomend geval tweede lid, wordt binnen acht weken na ontvangst van de desbetreffende aanvraag bekendgemaakt.
      Van het besluit wordt onverwijld mededeling gedaan aan de inspecteur van de ruimtelijke ordening.
      [Artikel 10:31, tweede en derde lid, van de Algemene wet bestuursrecht][ref8] is niet van toepassing. Gedeputeerde
      staten kunnen de verklaring weigeren wegens strijd met een goede ruimtelijke ordening. Indien gedeputeerde staten
      binnen de gestelde termijn geen besluit aan de gemeenteraad, of in voorkomend geval burgemeester en wethouders
      hebben bekendgemaakt, wordt dit gelijkgesteld met een besluit tot weigering van de verklaring.

      9 Indien de inspecteur van de ruimtelijke ordening aan gedeputeerde staten te kennen heeft gegeven dat de
      beoogde vrijstelling in kennelijke strijd is met het nationaal ruimtelijk beleid en gedeputeerde staten niettemin
      besluiten tot verlening van de verklaring van geen bezwaar, treedt het besluit van gedeputeerde staten niet in
      werking. Gedeputeerde staten doen hiervan mededeling bij de bekendmaking van hun besluit aan de gemeenteraad of in
      voorkomend geval burgemeester en wethouders, onder gelijktijdige verzending van een afschrift aan de inspecteur van
      de ruimtelijke ordening.

      10 Onze Minister kan gedurende acht weken na verzending aan de inspecteur van de ruimtelijke ordening van de
      mededeling, bedoeld in het negende lid, het besluit van gedeputeerde staten vervangen door een eigen besluit
      inhoudende weigering van de verklaring. Alvorens te besluiten hoort hij de Rijksplanologische Commissie en
      gedeputeerde staten. Indien Onze Minister binnen die termijn geen besluit heeft bekendgemaakt dan wel zoveel
      eerder als hij heeft medegedeeld van vervanging af te zien, treedt het besluit van gedeputeerde staten in werking.
      Gedeputeerde staten doen daarvan mededeling aan de gemeenteraad of in voorkomend geval burgemeester en wethouders.

      11 De gemeenteraad beslist, of in voorkomend geval burgemeester en wethouders beslissen omtrent het verlenen van
      vrijstelling binnen twee weken na de inwerkingtreding van het besluit van gedeputeerde staten.

      12 Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven die in acht moeten worden genomen
      alvorens vrijstelling mag worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
