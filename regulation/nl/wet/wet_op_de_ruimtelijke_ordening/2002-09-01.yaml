  - number: '48'
    text: |-
      Burgemeester en wethouders kunnen een aanlegvergunning intrekken:

      a. indien blijkt dat de vergunning ten gevolge van een onjuiste of onvolledige opgave is verleend;

      b. indien binnen een in de vergunning te bepalen termijn na de dagtekening van de vergunning geen begin met de
      werkzaamheden is gemaakt;

      c. indien de werkzaamheden langer dan een in de vergunning te bepalen termijn zijn gestaakt.
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel48
  - number: '49'
    text: |-
      Voor zover blijkt dat een belanghebbende ten gevolge van:

      a. de bepalingen van een bestemmingsplan,

      b. het besluit omtrent vrijstelling, als bedoeld in de [artikelen 17][ref1] of [19][ref2],

      c. het besluit tot het verlenen van vrijstelling ingevolge [artikel 40][ref3], of van een vergunning of andere
      beschikking ingevolge [artikel 41][ref4],

      d. de aanhouding van het besluit omtrent het verlenen van een bouw- of aanlegvergunning ingevolge
      [artikel 50, eerste lid, van de Woningwet][ref5] dan wel ingevolge [artikel 46, tweede lid][ref6],

      e. aanwijzingen als bedoeld in [artikel 37, tweede of vijfde lid][ref7],

      f. het koninklijk besluit als bedoeld in [artikel 66][ref8],

      schade lijdt of zal lijden, welke redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven en waarvan
      de vergoeding niet of niet voldoende door aankoop, onteigening of anderszins is verzekerd kent de gemeenteraad
      hem op zijn verzoek een naar billijkheid te bepalen schadevergoeding toe. Ingeval van schade ten gevolge van de
      aanhouding bedoeld onder *d* kan het verzoek om schadevergoeding eerst worden ingediend na de terinzagelegging van
      het vastgestelde bestemmingsplan.


