  - number: '5'
    text: |-
      1 Een streekplan wordt, behoudens door Onze Minister voor ten hoogste tien jaren verleende vrijstelling en
      onverminderd het bepaalde bij [artikel 6][ref1], ten minste eenmaal in de tien jaren herzien.

      2 Ten aanzien van de herziening en de intrekking van een streekplan zijn de [artikelen 4a][ref2] en [4b][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel4a
