  - number: '30'
    text: |-
      1 Indien door gedeputeerde staten of, in een geval als bedoeld in [artikel 29, achtste lid][ref1], door Onze
      Minister goedkeuring aan een vastgesteld bestemmingsplan is onthouden, stelt de gemeenteraad binnen een jaar
      met ingang van de dag na die, waarop de beroepstermijn bedoeld in [artikel 56a, onder b of c][ref2], afloopt of,
      indien binnen de beroepstermijn bij de voorzitter van de Afdeling bestuursrechtspraak van de Raad van State een
      verzoek om voorlopige voorziening is gedaan, dat verzoek is afgewezen, een nieuw plan vast, waarbij het besluit van
      gedeputeerde staten, dan wel van Onze Minister in acht wordt genomen.

      2 Gedeputeerde staten kunnen of, in een geval als bedoeld in [artikel 29, achtste lid][ref3], Onze Minister kan
      de termijn tot vaststelling van een nieuw plan op verzoek van burgemeester en wethouders met zes maanden verlengen
      of bij het besluit inzake goedkeuring die termijn door een andere vervangen, dan wel bepalen dat geen nieuw plan
      behoeft te worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel56a
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel29
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel30
