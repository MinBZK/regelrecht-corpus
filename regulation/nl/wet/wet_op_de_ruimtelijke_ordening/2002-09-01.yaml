preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is bij de wet nieuwe voorschriften omtrent de ruimtelijke
    ordening vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder

      Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      planologische kernbeslissing: een plan als bedoeld in [artikel 2a][ref1];

      concrete beleidsbeslissing: een als zodanig door het bestuursorgaan aangegeven besluit in een planologische
      kernbeslissing, een streekplan of een regionaal structuurplan.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 2a
        hoofdstuk: II
  - number: '2'
    text: |-
      1 Onze Minister verricht het nodige ter voorbereiding en ter uitvoering van het Regeringsbeleid inzake de
      ruimtelijke ordening. De uitkomsten hiervan worden, met inachtneming van de grenzen gesteld bij of krachtens de
      [Wet openbaarheid van bestuur][ref1], gepubliceerd.

      2 Jaarlijks doet Onze Minister aan de Tweede Kamer der Staten-Generaal in de memorie van toelichting op het
      desbetreffende hoofdstuk van de Rijksbegroting toekomen:

      a. een verslag van het door de Regering gevoerde beleid inzake de ruimtelijke ordening;

      b. een wetgevingsprogramma gericht op harmonisatie en coördinatie van ruimtelijk relevante wetgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 2a
    text: |-
      1 De Ministerraad stelt voor bepaalde aspecten van het nationale ruimtelijke beleid plannen vast. Deze plannen
      kunnen bestaan uit structuurschetsen, structuurschema’s of nota's, die van belang zijn voor het nationaal
      ruimtelijk beleid, zoals nader bepaald bij algemene maatregel van bestuur. Indien een onderdeel van een zodanig
      plan een concrete beleidsbeslissing is, wordt die beslissing bij de vaststelling van andere plannen op grond van
      deze wet in acht genomen. De in het eerste volzin bedoelde plannen worden voorbereid door Onze Ministers, wie
      het aangaat, Onze Minister daaronder begrepen. Van het voornemen een plan voor te bereiden doen Onze Ministers
      mededeling aan de Staten-Generaal. Afschrift van deze mededeling zendt Onze Minister aan de VROM-raad, ingesteld
      bij de [Wet op de VROM-raad][ref1]. In het plan wordt vermeld voor welke tijdsduur het geldt.

      2 Met betrekking tot de voorbereiding van het plan is de in [afdeling 3.4 van de Algemene wet bestuursrecht][ref2]
      geregelde procedure van toepassing, met dien verstande dat het ontwerp gedurende ten hoogste twaalf weken ter
      inzage ligt en gedurende die periode desgevraagd ten minste gedurende drie aaneengesloten uren per week buiten de
      werkuren kan worden ingezien. Op verzoek wordt binnen die termijn een kosteloze mondelinge toelichting verstrekt.
      Een ieder kan gedurende de termijn van terinzageligging schriftelijk zijn zienswijze omtrent het ontwerp kenbaar
      maken aan de eerstverantwoordelijke van Onze Ministers als bedoeld in het eerste lid.

      3 Over het ontwerp plegen Onze in het eerste lid bedoelde Ministers overleg met de besturen van provincies,
      gemeenten en waterschappen alsmede met die van de in [artikel 134 van de Grondwet][ref3] bedoelde openbare
      lichamen, voor zover deze daarvoor in aanmerking komen. Bedoeld overleg vindt plaats tot uiterlijk twaalf weken na
      de termijn van terinzageligging bedoeld in het tweede lid.

      4 Onze in het eerste lid bedoelde Ministers kunnen de VROM-raad verzoeken advies uit te brengen over het ontwerp.
      De raad brengt zijn advies uit binnen een door Onze bedoelde Ministers te bepalen termijn, die ten hoogste twaalf
      weken na de in het tweede lid bedoelde terinzageligging beloopt.

      5 Onze in het eerste lid bedoelde Ministers zenden het ontwerp gelijktijdig met de in het tweede lid bedoelde
      terinzagelegging aan de Staten-Generaal.

      6 Het plan wordt uiterlijk negen maanden na de terinzagelegging, bedoeld in het tweede lid, aan de instemming van
      de Tweede Kamer der Staten-Generaal onderworpen. De motivering van het plan vermeldt in elk geval op welke wijze
      door de Ministerraad bij de vaststelling van het plan rekening is gehouden met opvattingen als bedoeld in het
      tweede lid, uitkomsten van het bestuurlijk overleg, bedoeld in het derde lid, en het advies, bedoeld in het vierde
      lid.

      7 Alvorens omtrent instemming te besluiten stelt de Tweede Kamer Onze in het eerste lid bedoelde Ministers in
      de gelegenheid het plan te wijzigen. De Tweede Kamer zendt het plan, voor zover zij daarmee heeft ingestemd,
      onverwijld naar de Eerste Kamer. De Eerste Kamer besluit tot verlening of tot onthouding van instemming met het
      plan, zoals het daar ligt. De Eerste Kamer wordt geacht te hebben ingestemd met het plan, indien zij niet binnen
      vier weken na ontvangst van het plan uitdrukkelijk tot behandeling ervan besluit.

      8 De bekendmaking van het plan waarmee beide Kamers hebben ingestemd geschiedt door terinzagelegging op door Onze
      in het eerste lid bedoelde Ministers te bepalen plaatsen. Voorafgaand aan de bekendmaking wordt in de Staatscourant
      en in een of meer dag-, nieuws- of huis-aan-huisbladen aangekondigd op welke plaatsen en vanaf welk tijdstip het
      plan ter inzage zal liggen.

      9 Het plan treedt in werking met ingang van de dag volgende op die waarop het overeenkomstig het achtste lid ter
      inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008279
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel134
