        hoofdstuk: IV
        afdeling: '3'
  - number: '61'
    text: |-
      De in de [artikelen 59][ref1] en [60][ref2] bedoelde strafbare feiten worden beschouwd als overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel60
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel61
