  - number: 56b
    text: |-
      1 Indien gedurende de beroepstermijn met betrekking tot een besluit inzake goedkeuring van een bestemmingsplan,
      de uitwerking of wijziging of de herziening of intrekking daarvan of met betrekking tot een besluit tot uitwerking
      of wijziging als bedoeld in [artikel 11, zevende lid][ref1], bij de voorzitter van de Afdeling bestuursrechtspraak
      van de Raad van State een verzoek om voorlopige voorziening is gedaan, wordt de werking van het besluit opgeschort
      totdat op het verzoek is beslist. Bij toewijzing van het verzoek geeft de voorzitter aan op welke onderdelen van
      het plan de voorlopige voorziening betrekking heeft.

      2 In geval van samenloop van een aanwijzing ingevolge [artikel 37][ref2] met een aanwijzing
      ingevolge [artikel 26 van de Luchtvaartwet][ref3], [artikel 15 van de Tracéwet][ref4] of
      [artikel 7e van de Ontgrondingenwet][ref5] begint de termijn van een jaar na afloop van de in
      [artikel 38, tweede lid, onder a, b of c][ref6], bedoelde termijn voor Onze Minister of voor gedeputeerde staten te
      lopen met ingang van de dag na die waarop de beroepstermijn voor de aanwijzing krachtens de [Luchtvaartwet][ref7],
      de [Tracéwet][ref8] of de [Ontgrondingenwet][ref9] afloopt. Indien gedurende de beroepstermijn bij de voorzitter
      van de Afdeling bestuursrechtspraak van de Raad van State een verzoek om voorlopige voorziening is gedaan, wordt de
      werking van de aanwijzing ingevolge [artikel 37][ref10] opgeschort totdat op het verzoek is beslist.

      3 Indien tegen het besluit tot het verlenen van vrijstelling ingevolge [artikel 40][ref11] beroep is ingesteld en
      binnen de beroepstermijn bij de voorzitter van de Afdeling bestuursrechtspraak van de Raad van State een verzoek
      om voorlopige voorziening is gedaan, begint de in [artikel 40a, eerste lid][ref12], bedoelde termijn te lopen zodra
      dat verzoek is afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel11
