  - number: '66'
    text: |-
      Op de gezamenlijke voordracht van Onze Minister en van Onze Minister, die het mede aangaat, kunnen Wij bepalen,
      dat deze wet niet van toepassing is op een in Ons besluit aan te wijzen werk of werkzaamheid ten behoeve van de
      landsverdediging. Alvorens Ons een voordracht te doen horen Onze Ministers de Rijksplanologische Commissie.
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel66
  - number: '69'
    text: |-
      1 Onderstaande personen hebben in de hierna genoemde gebieden van zonsopgang tot zonsondergang toegang tot alle
      terreinen, voor zover dat redelijkerwijs voor de uitvoering van deze wet nodig is:

      1°. in het gehele Rijk:

      de voorzitter en de leden van de Rijksplanologische Commissie en de door Onze Minister aan te wijzen
      rijksambtenaren;

      2°. in een provincie: de door de commissaris van de Koning aan te wijzen personen;

      3°. in een gemeente:

      de burgemeester en de door hem aan te wijzen personen.

      2 Ten aanzien van het uitoefenen van de in het eerste lid bedoelde bevoegdheid vindt het bepaalde in
      [artikel 64, tweede lid][ref1], overeenkomstige toepassing.

      3 De in het eerste lid bedoelde personen verschaffen zich zo nodig de toegang met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel64
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '64'
        hoofdstuk: X
  - number: '70'
    text: |-
      Alle stukken, opgemaakt ter verkrijging van de beschikking door de gemeente over onroerende zaken ten einde
      uitvoering te kunnen geven aan een bestaand of toekomstig bestemmingsplan, zijn vrij van kosten van legalisatie en
      van griffiekosten.
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel70
  - number: '71'
    text: |-
      De kosten, voor de gemeente voortvloeiende uit de medewerking aan de uitvoering van deze wet, zijn uitgaven als
      bedoeld in [artikel 193 van de Gemeentewet][ref1]. [Artikel 194 van die wet](onbekend) vindt toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel193
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '193'
  - number: '72'
    text: |-
      De bevoegdheid aan provinciale staten overeenkomstig [artikel 145 van de Provinciewet][ref1] en aan de gemeenteraad
      overeenkomstig [artikel 149 van de Gemeentewet][ref2] toekomende blijft ten aanzien van het onderwerp, waarin deze
      wet voorziet, gehandhaafd voor zover de door deze colleges te maken verordeningen niet met deze wet in strijd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel145
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel149
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '145'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '149'
  - number: '73'
    text: |-
      1 Deze wet kan worden aangehaald als Wet op de Ruimtelijke Ordening.

      2 Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel73
