        artikel: '59'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '60'
        hoofdstuk: X
  - number: '63'
    text: |-
      1 Met de opsporing van de bij de [artikelen 59][ref1] en [60][ref2] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref3], belast:

      a. de inspecteurs van de ruimtelijke ordening;

      b. de door Onze Commissaris in de provincie aan te wijzen ambtenaren;

      c. de door de burgemeester aan te wijzen ambtenaren.

      2 Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de
      [artikelen 179 tot en met 182][ref4] en [184 van het Wetboek van Strafrecht][ref5], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel63
