  - number: '18'
    text: |-
      1 Burgemeester en wethouders beslissen zo spoedig mogelijk doch in elk geval binnen acht weken na ontvangst van de
      aanvraag tot vrijstelling als bedoeld in [artikel 17][ref1] of toepassing zal worden gegeven aan het derde lid.

      2 Indien besloten wordt geen toepassing te geven aan het derde lid wordt de vrijstelling geweigerd.

      3 Op de voorbereiding van het besluit omtrent de vrijstelling bedoeld in [artikel 17][ref2] is de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] geregelde procedure van toepassing, met dien verstande dat

      a. de aanvraag gedurende twee weken ter inzage ligt,

      b. gedurende de termijn van terinzageligging een ieder schriftelijk zijn zienswijze omtrent de aanvraag kenbaar kan
      maken, en

      c. burgemeester en wethouders binnen vier weken na afloop van de termijn van terinzageligging beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
