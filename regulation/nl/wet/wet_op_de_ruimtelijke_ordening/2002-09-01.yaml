        artikel: '37'
        hoofdstuk: V
  - number: '37'
    text: |-
      1 Onze Minister kan na overleg met gedeputeerde staten en de gemeenteraad, de Rijksplanologische Commissie
      gehoord, voor zover een juiste uitvoering van het Regeringsbeleid de totstandkoming of herziening van planologische
      maatregelen vordert, de gemeenteraad verplichten, een bestemmingsplan vast te stellen of te herzien.

      2 Bij toepassing van het eerste lid kan Onze Minister na overleg met gedeputeerde staten en de gemeenteraad,
      de Rijksplanologische Commissie gehoord, voorzover bovengemeentelijke belangen dat vorderen, aanwijzingen geven
      omtrent de inhoud van een bestemmingsplan. Hij gaat hiertoe niet eerder over dan vier weken nadat hij de Tweede
      Kamer der Staten-Generaal van zijn voornemen tot het geven van bedoelde aanwijzingen in kennis heeft gesteld.
      Het voornemen gaat vergezeld van de door gedeputeerde staten en de gemeenteraad gemaakte opmerkingen. Indien en
      voor zover bedoelde aanwijzingen niet gebaseerd zijn op een planologische kernbeslissing geeft Onze Minister geen
      uitvoering aan zijn voornemen, dan na uitdrukkelijke instemming daarmee door de Tweede Kamer. Met het voornemen
      wordt geacht te zijn ingestemd, indien de Tweede Kamer binnen vier weken na de inkennisstelling van het voornemen
      geen besluit heeft genomen omtrent de behandeling daarvan.

      3 Zo spoedig mogelijk na de bekendmaking wordt van besluiten en aanwijzingen van Onze Minister, als bedoeld in het
      eerste en tweede lid, mededeling gedaan door toezending van een afschrift aan de Rijksplanologische Commissie, aan
      gedeputeerde staten en aan de inspecteur van de ruimtelijke ordening. Een aanwijzing als bedoeld in het tweede lid
      wordt, tegelijkertijd met de toezending van de afschriften, op door Onze Minister te bepalen plaatsen ter inzage
      gelegd. [Artikel 3:12 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing. De kennisgeving,
      bedoeld in het eerste lid van dat artikel, wordt tevens in de *Staatscourant* geplaatst.

      4 Gedeputeerde staten kunnen na overleg met de gemeenteraad, de provinciale planologische commissie gehoord, de
      gemeenteraad verplichten een bestemmingsplan vast te stellen of te herzien.

      5 Bij toepassing van het vierde lid kunnen gedeputeerde staten na overleg met de gemeenteraad, de provinciale
      planologische commissie gehoord, voorzover bovengemeentelijke belangen dat vorderen, aanwijzingen geven omtrent
      de inhoud van een bestemmingsplan. Deze aanwijzingen moeten hun grondslag vinden in of redelijkerwijs voortvloeien
      uit een streekplan of het provinciaal ruimtelijk beleid, voorzover dit is neergelegd in een besluit van provinciale
      staten, de provinciale planologische commissie gehoord.

      6 Zo spoedig mogelijk na de bekendmaking wordt van besluiten en aanwijzingen van gedeputeerde staten, als
      bedoeld in het vierde en vijfde lid, mededeling gedaan door toezending van een afschrift aan de provinciale
      planologische commissie en aan de inspecteur van de ruimtelijke ordening. Een aanwijzing als bedoeld in het vijfde
      lid wordt, tegelijkertijd met de toezending van de afschriften, op het provinciehuis en bij de desbetreffende
      gemeentesecretarie ter inzage gelegd. [Artikel 3:12 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige
      toepassing. De kennisgeving, bedoeld in het eerste lid van dat artikel, wordt tevens in de *Staatscourant*
      geplaatst.

      7 De gemeenteraden zijn verplicht binnen een jaar na dagtekening van een besluit als bedoeld in het eerste of
      vierde lid, een bestemmingsplan vast te stellen of te herzien en dat in overeenstemming te brengen met aanwijzingen
      als bedoeld in het tweede of vijfde lid.

      8 Een ieder die bedenkingen heeft tegen een besluit als bedoeld in het eerste of vierde lid, en tegen aanwijzingen
      als bedoeld in het tweede of vijfde lid, kan deze gedurende de in [artikel 23][ref3] bedoelde termijn van
      terinzageligging van het ontwerp voor het bestemmingsplan, dat strekt ter uitvoering van dat besluit en die
      aanwijzingen, als onderdeel van zijn zienswijze omtrent dat ontwerp bij de gemeenteraad of, indien toepassing wordt
      gegeven aan [artikel 38, derde of vierde lid][ref4], bij Onze Minister of gedeputeerde staten, kenbaar maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel312
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel312
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0002375#Artikel38
