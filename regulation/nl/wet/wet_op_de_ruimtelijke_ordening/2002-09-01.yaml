  - number: '24'
    text: |-
      Voor zover het ontwerp van een bestemmingsplan zijn grondslag vindt in een concrete beleidsbeslissing is
      [artikel 23, eerste lid, onder c][ref1], alsmede [artikel 27, eerste en tweede lid][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel23
