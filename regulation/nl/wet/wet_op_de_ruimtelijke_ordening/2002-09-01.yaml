  - number: '21'
    text: |-
      1 De gemeenteraad kan verklaren, dat een bestemmingsplan wordt voorbereid (voorbereidingsbesluit). Indien
      [artikel 37, eerste of vierde lid][ref1], toepassing hebben gevonden, hebben Onze Minister onderscheidenlijk
      gedeputeerde staten gelijke bevoegdheid.

      2 Bij een voorbereidingsbesluit wordt bepaald voor welk gebied het geldt en met ingang van welke dag het in werking
      treedt.

      3 Bij een voorbereidingsbesluit kunnen voorschriften als bedoeld in [artikel 14][ref2] worden gegeven voor zover
      zulks noodzakelijk is om te voorkomen, dat een terrein minder geschikt wordt voor de verwerkelijking van een
      daaraan bij het plan te geven bestemming.

      4 Een besluit als in het eerste lid bedoeld vervalt, indien niet binnen één jaar na de datum van inwerkingtreding
      daarvan het ontwerp van het plan ter inzage is gelegd.

      5 Is het voorbereidingsbesluit genomen door Onze Minister, dan kan hij de in het vierde lid genoemde termijn
      eenmaal met één jaar verlengen. Hetzelfde geldt voor gedeputeerde staten, indien zij het voorbereidingsbesluit
      hebben genomen.

      6 Geldt het voorbereidingsbesluit voor een gebied dat tot een bebouwde kom behoort en ten aanzien waarvan bij een
      structuurplan aanwijzingen voor de bestemming zijn gegeven, dan kan in afwijking van het vierde lid bij het besluit
      worden bepaald, dat het besluit vervalt indien niet binnen een bij het besluit aan te geven termijn het ontwerp van
      het plan ter inzage is gelegd. Die termijn mag op niet langer dan twee jaar gesteld worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel14
