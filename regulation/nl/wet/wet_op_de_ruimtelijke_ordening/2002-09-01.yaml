  - number: 2c
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent het bepaalde in
      de [artikelen 2a][ref1] en [2b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel2b
