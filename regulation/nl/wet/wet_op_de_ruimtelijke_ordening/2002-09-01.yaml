  - number: '26'
    text: |-
      Het bestemmingsplan wordt zo spoedig mogelijk, doch in elk geval binnen vier weken na de dagtekening van het
      raadsbesluit voor een ieder ter inzage gelegd voor de duur van vier weken. [Artikel 23, eerste lid, onder a][ref1],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel23
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel26
