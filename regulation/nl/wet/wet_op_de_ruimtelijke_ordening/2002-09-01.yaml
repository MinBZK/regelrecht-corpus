  - number: '7'
    text: |-
      1 De gemeenteraad kan voor het grondgebied van de gemeente een structuurplan vaststellen, waarin de toekomstige
      ontwikkeling van de gemeente wordt aangegeven.

      2 De gemeenteraad kan in samenwerking met de raden van aangrenzende gemeenten voor het gebied van de betrokken
      gemeenten een structuurplan vaststellen, waarin de toekomstige ontwikkeling van die gemeenten wordt aangegeven.
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel7
  - number: '8'
    text: |-
      1 Het ontwerp voor een structuurplan ligt gedurende vier weken voor een ieder ter inzage ter gemeentesecretarie.
      Gedurende deze periode kunnen de stukken desgevraagd ten minste gedurende drie aaneengesloten uren per week
      buiten de werkuren worden ingezien. Op verzoek wordt binnen die termijn een kosteloze mondelinge toelichting
      verstrekt. Tegen vergoeding van ten hoogste de kosten wordt afschrift van de ter inzage gelegde stukken verstrekt.
      Burgemeester en wethouders geven tevoren kennis van de terinzagelegging in de Staatscourant en in een of meer dag-,
      nieuws- of huis-aan-huisbladen of op een andere geschikte wijze.

      2 Een ieder kan gedurende de termijn van terinzageligging schriftelijk zijn zienswijze omtrent het ontwerp naar
      voren brengen. Degenen die een zienswijze naar voren hebben gebracht worden in de gelegenheid gesteld tot het geven
      van een mondelinge toelichting.
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel8
  - number: '9'
    text: |-
      De vaststelling van het structuurplan wordt bekendgemaakt door het besluit tot vaststelling
      samen met het structuurplan voor een ieder ter inzage te leggen ter gemeentesecretarie.
      [Artikel 8, eerste lid, vijfde volzin][ref1], is van overeenkomstige toepassing. Tegelijkertijd met de bekendmaking
      wordt van het structuurplan mededeling gedaan aan gedeputeerde staten en aan de inspecteur van de ruimtelijke
      ordening.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel8
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel9
