  - number: '56'
    text: |-
      1 In afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref1] kan beroep worden ingesteld door
      een ieder tegen een concrete beleidsbeslissing, of tegen een herziening of intrekking daarvan als bedoeld in
      [artikel 54, tweede lid, onder a][ref2].

      2 In afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref3] kan beroep als bedoeld in
      [artikel 54, tweede lid, onder d en e][ref4], worden ingesteld:

      a. voor zover het besluit strekt tot goedkeuring:

      1°. door degene, die zich tijdig op grond van [artikel 27, eerste of tweede lid][ref5], tot gedeputeerde staten
      heeft gewend of

      2°. door een belanghebbende die aantoont dat hij redelijkerwijs niet in staat is geweest zich overeenkomstig
      [artikel 27, eerste of tweede lid][ref6], tot gedeputeerde staten te wenden, en

      3°. in een geval als bedoeld in [artikel 54, tweede lid, onder e][ref7], tevens door gedeputeerde staten;

      b. voor zover het besluit strekt tot onthouding van goedkeuring, door een ieder.

      3 In afwijking van [artikel 8.1 van de Algemene wet Bestuursrecht][ref8], kan beroep als bedoeld in
      [artikel 54, tweede lid, onder h][ref9], worden ingesteld:

      a. voor zover het besluit strekt tot verlening van vrijstelling:

      1°. door degene die zich tijdig op grond van [artikel 33, derde lid][ref10], tot gedeputeerde staten heeft gewend
      of

      2°. door een belanghebbende die aantoont dat hij redelijkerwijs niet in staat is geweest zich overeenkomstig
      [artikel 23, eerste lid, onder c][ref11], tot gedeputeerde staten te wenden;

      b. voor zover het besluit strekt tot weigering van vrijstelling, door een ieder.

      4 In afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref12] kan uitsluitend beroep worden ingesteld
      door:

      a. het algemeen bestuur van het regionaal openbaar lichaam tegen een besluit van gedeputeerde staten tot onthouding
      van goedkeuring aan een regionaal structuurplan of een herziening daarvan;

      b. het in eerste aanleg bevoegde gezag tegen een besluit houdende een aanwijzing krachtens
      [artikel 41, vierde lid][ref13].


