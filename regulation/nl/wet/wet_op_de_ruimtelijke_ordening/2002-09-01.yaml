  - number: '19'
    text: |-
      1 De gemeenteraad kan, behoudens het gestelde in het tweede en derde lid, ten behoeve van de verwezenlijking van
      een project vrijstelling verlenen van het geldende bestemmingsplan, mits dat project is voorzien van een goede
      ruimtelijke onderbouwing en vooraf van gedeputeerde staten de verklaring is ontvangen, dat zij tegen het verlenen
      van vrijstelling geen bezwaar hebben. Onder een goede ruimtelijke onderbouwing wordt bij voorkeur een gemeentelijk
      of intergemeentelijk structuurplan verstaan. Indien er geen structuurplan is of wordt opgesteld, wordt bij de
      ruimtelijke onderbouwing in elk geval ingegaan op de relatie met het geldende bestemmingsplan, dan wel wordt er
      gemotiveerd waarom het te realiseren project past binnen de toekomstige bestemming van het betreffende gebied. De
      gemeenteraad kan de in de eerste volzin bedoelde vrijstellingsbevoegdheid delegeren aan burgemeester en wethouders.

      2 Burgemeester en wethouders kunnen vrijstelling verlenen van het bestemmingsplan in door gedeputeerde staten, in
      overeenstemming met de inspecteur van de ruimtelijke ordening, aangegeven categorieën van gevallen. Gedeputeerde
      staten kunnen daarbij tevens bepalen onder welke omstandigheden vooraf een verklaring van gedeputeerde staten
      dat zij tegen het verlenen van vrijstelling geen bezwaar hebben, is vereist. Het bepaalde in het eerste lid met
      betrekking tot een goede ruimtelijke onderbouwing is van overeenkomstige toepassing.

      3 Burgemeester en wethouders kunnen eveneens vrijstelling verlenen van het bestemmingsplan in bij algemene
      maatregel van bestuur aan te geven gevallen.

      4 Vrijstelling krachtens het eerste lid wordt niet verleend voor een project dat wordt uitgevoerd in een gebied
      waarvoor

      a. het bestemmingsplan niet tijdig overeenkomstig [artikel 33, eerste lid][ref1], is herzien of

      b. geen vrijstelling overeenkomstig [artikel 33, tweede lid][ref2], is verleend, tenzij voor het gebied een
      voorbereidingsbesluit geldt of een ontwerp voor een herziening ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel33
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel19
