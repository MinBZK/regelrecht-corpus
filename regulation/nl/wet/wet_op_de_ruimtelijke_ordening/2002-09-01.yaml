  - number: '41'
    text: |-
      1 Voor zover bovengemeentelijke belangen zulks vorderen, een verwezenlijking van een project in de naaste toekomst
      noodzakelijk is en naar het oordeel van gedeputeerde staten of van Onze Minister de besluitvorming omtrent die
      verwezenlijking is vastgelopen, kunnen gedeputeerde staten of Onze Minister aan het daartoe bevoegde orgaan van een
      gemeente, een waterschap, een provincie of enig ander publiekrechtelijk lichaam verzoeken enige andere beschikking
      dan bedoeld in [artikel 40, eerste lid][ref1], inzake toestemming ten behoeve van het verwezenlijken van dat
      project te geven. [Artikel 40][ref2] is van overeenkomstige toepassing, met dien verstande dat:

      a. indien de desbetreffende beschikking bij of krachtens een wet is vereist en Onze Minister het verzoek heeft
      gedaan, ten aanzien van de betrokken beschikking overigens Onze Minister die de verantwoordelijkheid of de eerste
      verantwoordelijkheid heeft voor de uitvoering van de desbetreffende wet, in de plaats treedt van Onze Minister,

      b. de in [artikel 40][ref3] voorgeschreven procedure, met inbegrip van de daarbij aangegeven termijnen, in de
      plaats treedt van de bij de desbetreffende regeling voorgeschreven procedure voor het tot stand brengen van die
      beschikking,

      c. ten aanzien van de inhoud van de beschikking in acht genomen wordt hetgeen daarover bij of krachtens de wet
      is bepaald; bepalingen, die - al dan niet krachtens de wet - bij of krachtens een regeling van een provincie,
      gemeente of waterschap daaromtrent zijn vastgesteld, kunnen om dringende redenen buiten toepassing worden gelaten,
      voor zover het toepassen daarvan een onevenredige belemmering met zich zou brengen voor de verwezenlijking van
      het project.

      2 In gevallen waarin met betrekking tot de totstandkoming van een beschikking, als bedoeld in het eerste lid,
      [afdeling 3.5 van de Algemene wet bestuursrecht][ref4] van toepassing is, is - in afwijking van het eerste
      lid, onder *b* - de in die afdeling voorgeschreven procedure voor het tot stand brengen van die beschikking van
      toepassing.

      3 Indien ten behoeve van een zelfde project een of meer beschikkingen vereist zijn, als bedoeld in
      [artikel 40, eerste lid][ref5], of in het eerste lid van dit artikel, worden de aanvragen om de betrokken
      beschikkingen te zamen, overeenkomstig de in [artikel 40][ref6] voorgeschreven procedure, dan wel in een geval als
      bedoeld in het tweede lid, overeenkomstig de daar bedoelde procedure, behandeld.

      4 Het bestuursorgaan dat het verzoek om medewerking aan de verwezenlijking van het betrokken project heeft gedaan,
      kan, indien dat met het oog op de samenhang tussen de onderscheidene beschikkingen ter verwezenlijking van het
      project geboden is, en [artikel 40, achtste of negende lid][ref7], niet wordt toegepast, aan het in eerste aanleg
      bevoegde orgaan een bindende aanwijzing geven ter zake van de inhoud van een zodanige beschikking. Deze aanwijzing
      wordt niet gegeven dan na overleg met het betrokken orgaan.

      5 Een aanwijzing als bedoeld in het vierde lid wordt vermeld in de beschikking ter zake waarvan zij wordt gegeven.
      Een exemplaar ervan wordt gevoegd bij ieder exemplaar van die beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel40
