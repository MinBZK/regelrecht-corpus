  - number: '20'
    text: |-
      De voorschriften van het bestemmingsplan blijven buiten toepassing voor zover deze:

      a. betrekking hebben op het bouwen waarvoor krachtens [artikel 43, eerste lid, van de Woningwet][ref1], geen
      bouwvergunning vereist is, of

      b. betrekking hebben op het gebruik van bouwwerken en standplaatsen dat voldoet aan
      de voorschriften die zijn gegeven bij de algemene maatregel van bestuur, bedoeld in
      [artikel 43, eerste lid, onderdeel c, van de Woningwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel43
