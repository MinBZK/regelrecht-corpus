  - number: '13'
    text: |-
      1 Bij een bestemmingsplan kunnen voor zover het gronden betreft, waarvan het gebruik afwijkt van het plan, een of
      meer onderdelen worden aangewezen, ten aanzien waarvan de verwerkelijking van het plan in de naaste toekomst nodig
      wordt geacht.

      2 Bij een bestemmingsplan kan worden bepaald, dat met de verwerkelijking van gemeentewege van één of meer
      onderdelen daarvan eerst na een bij het plan te bepalen tijdstip een aanvang kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel13
  - number: '14'
    text: |-
      Bij een bestemmingsplan kan worden bepaald, dat het verboden is binnen een bij het plan aan te geven gebied
      bepaalde werken, geen bouwwerken zijnde, of werkzaamheden uit te voeren zonder of in afwijking van een vergunning
      van burgemeester en wethouders (aanlegvergunning), voor zover zulks noodzakelijk is:

      a. om te voorkomen, dat een terrein minder geschikt wordt voor de verwerkelijking van de daaraan bij het plan
      gegeven bestemming;

      b. ter handhaving en ter bescherming van een verwerkelijkte bestemming als bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel14
  - number: '15'
    text: |-
      1 Bij een bestemmingsplan kan worden bepaald, dat burgemeester en wethouders met inachtneming van de in het plan
      vervatte regelen bevoegd zijn:

      a. van bij het plan aan te geven voorschriften vrijstelling te verlenen;

      b. ten opzichte van in het plan omschreven punten nadere eisen te stellen.

      2 Bij het plan kan worden bepaald, dat vrijstelling van bepaalde voorschriften slechts kan worden verleend mits
      vooraf van gedeputeerde staten de verklaring is ontvangen, dat zij tegen het verlenen van de vrijstelling geen
      bezwaar hebben. Gedeputeerde staten kunnen de verklaring weigeren wegens strijd met een goede ruimtelijke ordening.

      3 Aan een vrijstelling als bedoeld onder *a* van het eerste lid mogen slechts voorwaarden worden verbonden ter
      bescherming van de belangen, ten behoeve waarvan de bepalingen, waarvan vrijstelling wordt verleend, in het plan
      zijn opgenomen. Aan de vrijstelling kan een termijn worden verbonden, waarbinnen van de vrijstelling gebruik moet
      zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel15
  - number: '16'
    text: |-
      Bij een bestemmingsplan kan ten aanzien van bepaalde werken uit te voeren in bepaalde gebieden worden
      voorgeschreven, dat bouw- of aanlegvergunning slechts mag worden verleend mits vooraf van gedeputeerde staten de
      verklaring is ontvangen, dat zij tegen het verlenen van de vergunning geen bezwaar hebben. Gedeputeerde staten
      kunnen de verklaring weigeren wegens strijd met een goede ruimtelijke ordening.
    url: https://wetten.overheid.nl/BWBR0002375/2002-09-01#Artikel16
  - number: '17'
    text: |-
      1 Burgemeester en wethouders kunnen met het oog op een voor een bepaalde termijn voorgenomen afwijking van een
      bestemmingsplan voor die termijn vrijstelling verlenen van dat plan. De termijn kan, ook na mogelijke verlenging,
      ten hoogste vijf jaren belopen. Het [derde lid van artikel 15][ref1] is van overeenkomstige toepassing.

      2 Bij een bestemmingsplan kan worden bepaald, dat de toepasselijkheid van dit artikel is uitgesloten indien het
      belang ter bescherming waarvan een bepaalde bestemming in het plan is opgenomen, zich niet verdraagt met een
      vrijstelling als bedoeld in het eerste lid.

      3 Burgemeester en wethouders zenden van iedere vrijstelling onverwijld afschrift aan de inspecteur van de
      ruimtelijke ordening.

      4 Na het verstrijken van de in het eerste lid genoemde termijn is degeen aan wie de vrijstelling is verleend of
      diens rechtsopvolger verplicht de met het bestemmingsplan strijdige situatie te zijner keuze hetzij in de vorige
      toestand te herstellen, hetzij met het bestemmingsplan in overeenstemming te brengen.

      5 De in het vierde lid genoemde verplichting wordt opgeschort, indien vóór het verstrijken van de in het eerste
      lid genoemde termijn een ontwerp voor een op opheffing van bedoelde strijdigheid gerichte herziening van het
      bestemmingsplan ter inzage is gelegd. Deze opschorting duurt totdat de termijn bedoeld in [artikel 25][ref2] is
      overschreden, de termijn voor terinzagelegging, genoemd in [artikel 26][ref3] is overschreden, dan wel omtrent
      goedkeuring van de herziening onherroepelijk is beslist. Ingeval van goedkeuring vervalt de verplichting.

      6 Indien degeen aan wie de vrijstelling is verleend of diens rechtsopvolger in gebreke blijft aan zijn verplichting
      als in het vierde lid bedoeld te voldoen, schrijven burgemeester en wethouders hem onverwijld aan tot naleving van
      die verplichting.

      7 Wij kunnen bij algemene maatregel van bestuur voorschriften geven, die bij het verlenen van vrijstelling
      ingevolge dit artikel in acht genomen moeten worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel26
