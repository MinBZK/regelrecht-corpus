  - number: 40b
    text: |-
      1 Indien de gemeenteraad niet voldoet aan een verplichting als bedoeld in [artikel 30][ref1], gaan gedeputeerde
      staten op kosten van de gemeente tot de vaststelling of herziening van het bestemmingsplan over. Zolang de
      kennisgeving van de terinzagelegging van het ontwerp van het plan nog niet heeft plaatsgevonden blijft de
      gemeenteraad tot de vaststelling of herziening bevoegd. [Artikel 38, vierde lid][ref2], is van toepassing; het
      vijfde lid van dat artikel is van overeenkomstige toepassing.

      2 Indien de gemeenteraad niet voldoet aan een verplichting als bedoeld in [artikel 40a][ref3], gaan
      gedeputeerde staten onderscheidenlijk Onze Minister op kosten van de gemeente tot de vaststelling
      of herziening van het bestemmingsplan over. De tweede volzin van het eerste lid is van toepassing.
      [Artikel 38, vierde, onderscheidenlijk derde lid][ref4], is van toepassing; het vijfde lid van dat artikel is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel30
