  - number: '25'
    text: |-
      Binnen acht weken of, indien over het ontwerp tijdig een zienswijze kenbaar is gemaakt, binnen vier maanden na
      afloop van de in [artikel 23][ref1] genoemde termijn beslist de gemeenteraad omtrent de vaststelling van het
      bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel23
