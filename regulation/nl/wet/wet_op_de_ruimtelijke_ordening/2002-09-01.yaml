        artikel: '23'
        hoofdstuk: IV
        afdeling: '3'
  - number: '27'
    text: |-
      1 Degene die tijdig zijn zienswijze bij de gemeenteraad kenbaar heeft gemaakt, alsmede een belanghebbende die
      aantoont dat hij redelijkerwijs niet in staat is geweest overeenkomstig [artikel 23][ref1] zijn zienswijze bij de
      gemeenteraad kenbaar te maken, kan gedurende de in [artikel 26][ref2] genoemde termijn van terinzageligging bij
      gedeputeerde staten schriftelijk bedenkingen inbrengen tegen het bestemmingsplan.

      2 Voor zover de gemeenteraad bij de vaststelling van het plan daarin wijzigingen heeft aangebracht ten opzichte van
      het ontwerp, kan een ieder gedurende de in [artikel 26][ref3] bedoelde termijn bij gedeputeerde staten daartegen
      schriftelijk bedenkingen inbrengen.

      3 Gedeputeerde staten stellen degenen die overeenkomstig het eerste of het tweede lid tijdig bedenkingen hebben
      ingebracht in de gelegenheid tot het geven van een nadere mondelinge toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel26
