  - number: 19b
    text: |-
      Een krachtens de [artikelen 15][ref1], [17][ref2] of [19][ref3] verleende vrijstelling wordt door burgemeester en
      wethouders als bijlage bij het bestemmingsplan opgenomen, zodra die vrijstelling is verleend. Een zodanige bijlage
      is geen onderdeel van het bestemmingsplan.


