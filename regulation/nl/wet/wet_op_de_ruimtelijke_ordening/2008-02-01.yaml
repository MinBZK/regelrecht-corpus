  - number: '6'
    text: |-
      1 Onze Minister kan na overleg met gedeputeerde staten, de Rijksplanologische Commissie gehoord, de provinciale
      staten verplichten binnen een door hem te bepalen termijn een streekplan vast te stellen of te herzien.

      2 Bij toepassing van het eerste lid kan Onze Minister na overleg met gedeputeerde staten, de Rijksplanologische
      Commissie gehoord, voor zover een juiste uitvoering van het Regeringsbeleid de totstandkoming of herziening
      van planologische maatregelen vordert, aan de provinciale staten aanwijzingen geven omtrent de inhoud van een
      streekplan.

      3 Van zijn besluit, bedoeld in het eerste lid en van aanwijzingen, als bedoeld in het tweede lid, zendt Onze
      Minister behalve aan het provinciaal bestuur afschriften aan de Rijksplanologische Commissie en aan de inspecteur.
      Van de dag der verzending van de afschriften af liggen aanwijzingen, als bedoeld in het tweede lid op door Onze
      Minister te bepalen plaatsen ter inzage. De nederlegging wordt tevoren door de zorg van Onze Minister in de
      *Staatscourant* en daarvoor in aanmerking komende dag- of nieuwsbladen bekendgemaakt.

      4 Provinciale staten zijn verplicht, bij de herziening van een streekplan dit plan in overeenstemming te brengen
      met de in het tweede lid bedoelde aanwijzingen. Voor zover deze aanwijzingen betrekking hebben op een gebied
      waarvoor geen streekplan is vastgesteld, bestaat een overeenkomstige verplichting zodra provinciale staten tot
      vaststelling van een streekplan overgaan.

      5 Een ieder die bedenkingen heeft tegen een besluit als bedoeld in het eerste lid en aanwijzingen als bedoeld in
      het tweede lid, kan deze als onderdeel van zijn zienswijze over het ontwerp voor het streekplan, dat strekt ter
      uitvoering van dat besluit en die aanwijzingen, naar voren brengen.

      6 Indien provinciale staten niet voldoen aan een verplichting, als bedoeld in het eerste en vierde lid, gaat
      Onze Minister op kosten van de provincie over tot het vaststellen of herzien van een streekplan. In dit geval
      is [artikel 4a, derde lid][ref1], van toepassing, met dien verstande dat Onze Minister in de plaats treedt van
      provinciale staten en gedeputeerde staten.

      7 Een streekplan dat ingevolge het zesde lid is tot stand gekomen of herzien, wordt geacht te zijn vastgesteld door
      provinciale staten.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel4a
