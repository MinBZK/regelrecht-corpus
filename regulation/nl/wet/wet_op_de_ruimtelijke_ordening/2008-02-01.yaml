  - number: 49a
    text: |-
      1 Voor zover schade die op grond van [artikel 49][ref1] voor vergoeding in aanmerking zou komen, haar grondslag
      vindt in een besluit op een verzoek om ten behoeve van de verwezenlijking van een project bepalingen in
      een bestemmingsplan op te nemen of te wijzigen dan wel om vrijstelling te verlenen, anders dan bedoeld in
      [artikel 31a][ref2] of [31b][ref3], kunnen burgemeester en wethouders met de verzoeker overeenkomen dat die schade
      geheel of gedeeltelijk voor zijn rekening komt.

      2 De verzoeker die een overeenkomst als bedoeld in het eerste lid heeft gesloten, is belanghebbende bij een besluit
      van burgemeester en wethouders op een aanvraag om schadevergoeding op grond van [artikel 49][ref4] terzake van de
      wijziging van het bestemmingsplan dan wel de verlening van de vrijstelling waarom hij heeft verzocht.


