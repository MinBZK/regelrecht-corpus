  - number: '42'
    text: |-
      1 De gemeenteraad stelt een verordening vast waarin de voorwaarden worden vastgelegd, waaronder de gemeente
      medewerking zal verlenen aan de exploitatie van gronden, die in de naaste toekomst voor bebouwing in aanmerking
      komen (exploitatieverordening).

      2 Een exploitatieverordening bevat onder meer voorschriften omtrent:

      a. de gevallen, waarin en de wijze waarop het treffen van voorzieningen voor doeleinden van openbaar nut
      afhankelijk wordt gesteld van de afstand van grond aan de gemeente;

      b. het aandeel van de kosten van voorzieningen van openbaar nut, dat ten laste wordt gebracht van de gronden, die
      door deze voorzieningen worden gebaat en de wijze, waarop deze kosten over de genoemde gronden worden omgeslagen.

      3 Gedeputeerde staten kunnen van de verplichting tot het vaststellen van een exploitatieverordening op verzoek
      vrijstelling verlenen.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel42
  - number: '44'
    text: |-
      1 De aanlegvergunning mag alleen en moet worden geweigerd, indien:

      a. het werk of de werkzaamheid in strijd zou zijn met een bestemmingsplan of de krachtens zodanig plan gestelde
      eisen;

      b. voor het werk of de werkzaamheid een vergunning ingevolge de [Monumentenwet 1988][ref1] of een provinciale of
      gemeentelijke monumentenverordening is vereist en deze niet is verleend.

      2 Aan een vergunning mogen slechts voorwaarden worden verbonden ter bescherming van de belangen ten behoeve waarvan
      de bepalingen strekken krachtens welke de vergunning wordt verleend en waaraan het werk of de werkzaamheid, waarop
      de aanvraag betrekking heeft, moet voldoen.

      3 Indien de vergunning betrekking heeft op een werk of werkzaamheid in een gebied dat behoort tot een beschermd
      stads- of dorpsgezicht in de zin van de [Monumentenwet 1988][ref2] zenden burgemeester en wethouders terstond na de
      bekendmaking een afschrift van hun besluit aan de Rijksdienst voor de Monumentenzorg.

      4 De vergunning treedt in werking met ingang van de zevende week na de dag waarop zij is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004471
      [ref2]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004471
      - id: ref2
        bwb_id: BWBR0004471
  - number: '45'
    text: |-
      1 Indien het werk of de werkzaamheid slechts toelaatbaar is ingevolge een voorlopige bestemming of een voorlopige
      gebruiksregel, stellen burgemeester en wethouders overeenkomstig hetgeen bij het bestemmingsplan omtrent de duur
      van de bestemming is bepaald, in de vergunning een termijn na het verstrijken waarvan het werk of de werkzaamheid
      moet worden verwijderd of beëindigd of op andere wijze met het bestemmingsplan in overeenstemming moet worden
      gebracht. De termijn kan worden verlengd, indien en voor zover de duur van de voorlopige bestemming is verlengd.

      2 Indien de termijn is verstreken is de rechthebbende verplicht binnen twaalf weken na aanzegging van burgemeester
      en wethouders te zijner keuze het werk of de werkzaamheden te verwijderen of te beëindigen of in overeenstemming te
      brengen met het bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel45
  - number: '46'
    text: |-
      1 Burgemeester en wethouders beslissen omtrent een aanvraag om aanlegvergunning binnen vier weken na de dag, waarop
      de aanvraag ontvangen is.

      2 In afwijking van het eerste lid houden burgemeester en wethouders de beslissing aan, indien er geen grond is om
      de vergunning te weigeren en voor het gebied, waarin het werk of de werkzaamheid zal worden uitgevoerd, voordat
      de aanvraag is ingekomen een voorbereidingsbesluit in werking is getreden, een ontwerp-bestemmingsplan of het
      ontwerp voor een herziening daarvan ter inzage is gelegd, dan wel een bestemmingsplan of een herziening daarvan is
      vastgesteld, dan wel een bestemmingsplan of een herziening daarvan na vaststelling ter inzage is gelegd.

      3 De aanhouding duurt totdat het voorbereidingsbesluit overeenkomstig [artikel 21][ref1] is vervallen, de termijn,
      genoemd in [artikel 25][ref2], is overschreden, de termijn voor terinzagelegging, genoemd in [artikel 26][ref3],
      is overschreden, de termijn, genoemd in [artikel 30][ref4], is overschreden, dan wel het bestemmingsplan of de
      herziening daarvan in werking is getreden.

      4 In afwijking van het eerste lid houden burgemeester en wethouders de beslissing omtrent een aanvraag om
      vergunning eveneens aan indien er geen grond is om de vergunning te weigeren en de aanvraag van de vergunning een
      werk of werkzaamheid betreft in een gebied, behorend tot een beschermd stads- of dorpsgezicht in de zin van de
      [Monumentenwet 1988][ref5], waarvoor nog geen ter bescherming daarvan strekkend bestemmingsplan geldt.

      5 De aanhouding, bedoeld in het vierde lid, duurt totdat een ter voldoening aan
      [artikel 36 van de Monumentenwet 1988][ref6] vast te stellen of te herzien bestemmingsplan in werking is getreden.

      6 In afwijking van het tweede lid kunnen burgemeester en wethouders de aanlegvergunning verlenen indien het werk of
      de werkzaamheid niet in strijd is met het in voorbereiding zijnde bestemmingsplan of met de in voorbereiding zijnde
      herziening daarvan dan wel met het provinciaal en nationaal ruimtelijk beleid.

      7 In afwijking van het tweede lid kunnen burgemeester en wethouders de aanlegvergunning eveneens verlenen indien
      het werk of de werkzaamheid in strijd is met het in voorbereiding zijnde bestemmingsplan of met de in voorbereiding
      zijnde herziening daarvan, mits het werk of de werkzaamheid is voorzien van een goede ruimtelijke onderbouwing en
      vooraf van gedeputeerde staten de verklaring is ontvangen, dat zij tegen het verlenen van vergunning geen bezwaar
      hebben. [Artikel 19a, eerste, vierde tot en met elfde lid][ref7], is van overeenkomstige toepassing.

      8 In afwijking van het tweede lid kunnen burgemeester en wethouders de aanlegvergunning eveneens verlenen indien
      het werk of de werkzaamheid in strijd is met het in voorbereiding zijnde bestemmingsplan of met de in voorbereiding
      zijnde herziening daarvan en het betreft:

      a. een werk of werkzaamheid ten aanzien waarvan [artikel 17][ref8] wordt toegepast;

      b. een geval als bedoeld in [artikel 19, tweede of derde lid][ref9].

      9 Op de voorbereiding van het besluit tot vergunningverlening, bedoeld in het achtste lid, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref10] van toepassing. Zienswijzen kunnen naar voren worden
      gebracht door een ieder. [Artikel 3:18 van de Algemene wet bestuursrecht][ref11] is niet van toepassing.

      10 Onverminderd het zesde en zevende lid, kunnen burgemeester en wethouders, in afwijking van het vierde lid,
      de aanlegvergunning verlenen indien het werk of de werkzaamheid niet strijdt met het in voorbereiding zijnde
      ter bescherming van het beschermde stads- of dorpsgezicht, alsmede van beschermd landschap, natuurgebied,
      rijksbufferzone en archeologische vindplaats strekkende bestemmingsplan en vooraf van gedeputeerde staten de
      verklaring is ontvangen dat zij tegen het verlenen van de vergunning geen bezwaar hebben.

      11 De in het zevende en tiende lid bedoelde verklaringen worden gelijktijdig bekendgemaakt.
      [Artikel 19a, achtste lid, eerste volzin][ref12], is alsdan niet van toepassing. Alvorens het besluit
      omtrent de in het tiende lid bedoelde verklaring te nemen, horen gedeputeerde staten de Rijksdienst
      voor de Monumentenzorg. Van het besluit wordt onverwijld mededeling gedaan aan genoemde dienst.
      [Artikel 10:31, tweede en derde lid, van de Algemene wet bestuursrecht][ref13] is niet van toepassing. Gedeputeerde
      staten kunnen een verklaring weigeren wegens strijd met een goede ruimtelijke ordening.


