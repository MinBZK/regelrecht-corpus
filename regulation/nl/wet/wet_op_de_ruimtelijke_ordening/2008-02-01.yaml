        hoofdstuk: IV
        afdeling: '3'
  - number: '27'
    text: |-
      1 Degene die tijdig zijn zienswijze bij de gemeenteraad naar voren heeft gebracht, alsmede een belanghebbende
      aan wie redelijkerwijs niet kan worden verweten dat hij niet overeenkomstig [artikel 23][ref1] juncto
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] zijn zienswijze bij de gemeenteraad naar voren heeft
      gebracht, kan gedurende de in [artikel 26][ref3] genoemde termijn van terinzageligging bij gedeputeerde staten
      bedenkingen inbrengen tegen het bestemmingsplan.

      2 Voor zover de gemeenteraad bij de vaststelling van het plan daarin wijzigingen heeft aangebracht ten opzichte van
      het ontwerp, kan een ieder gedurende de in [artikel 26][ref4] bedoelde termijn bij gedeputeerde staten daartegen
      bedenkingen inbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
