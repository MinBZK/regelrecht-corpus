  - number: '36'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften omtrent de voorbereiding, de vormgeving
      en de inrichting van structuurplannen en bestemmingsplannen gegeven.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel36
  - number: 36a
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. regionaal openbaar lichaam: een plusregio als bedoeld in
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] die de gemeente of gemeenten Amsterdam, Arnhem en
      Nijmegen, Eindhoven en Helmond, Enschede en Hengelo, ’s-Gravenhage, Rotterdam of Utrecht omvat;

      b. samenwerkingsgebied: het grondgebied van een regionaal openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '104'
  - number: 36c
    text: |-
      1 Het algemeen bestuur van een regionaal openbaar lichaam stelt voor het samenwerkingsgebied een regionaal
      structuurplan vast, waarin de toekomstige ontwikkeling van dat gebied wordt aangegeven. In dat plan
      worden concrete beleidsbeslissingen opgenomen over de lokatie van projecten of voorzieningen van regionaal
      belang. Bij de vaststelling van gemeentelijke plannen als bedoeld in [Hoofdstuk IV][ref1] van deze wet en
      [Hoofdstuk IV van de Wet op de stads- en dorpsvernieuwing][ref2] worden die beslissingen in acht genomen.

      2 Indien toepassing wordt gegeven aan het eerste lid, blijft voor het daarbij begrepen gebied
      [artikel 7, tweede lid][ref3], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0003709#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel7
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0002375
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003709
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0002375
        artikel: '7'
        hoofdstuk: IV
        afdeling: '2'
  - number: 36d
    text: |-
      1 Op de voorbereiding van een regionaal structuurplan is [artikel 8][ref1] van overeenkomstige toepassing, met dien
      verstande dat het ontwerp ter inzage ligt ter secretarie van het regionaal openbaar lichaam en van de gemeenten op
      wier gebied het betrekking heeft en dat burgemeester en wethouders worden vervangen door het dagelijks bestuur van
      het regionaal openbaar lichaam.

      2 Binnen acht weken of, indien over het ontwerp een zienswijze naar voren is gebracht, binnen vier maanden na
      afloop van de termijn voor terinzageligging van het ontwerp, stelt het algemeen bestuur van het regionaal openbaar
      lichaam het regionaal structuurplan vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel8
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel36d
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '8'
        hoofdstuk: IV
        afdeling: '2'
  - number: 36e
    text: |-
      1 Het regionaal structuurplan behoeft de goedkeuring van gedeputeerde staten. Het plan wordt daartoe zo spoedig
      mogelijk, doch in elk geval binnen vier weken na de dagtekening van het besluit tot vaststelling, aan gedeputeerde
      staten verzonden.

      2 Alvorens het besluit omtrent goedkeuring te nemen horen gedeputeerde staten de provinciale planologische
      commissie en voorzover het regionaal structuurplan mede een beschermd stads- of dorpsgezicht omvat, de Rijksdienst
      voor de Monumentenzorg. [Artikel 10:31, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] is niet
      van toepassing. De goedkeuring kan worden onthouden wegens strijd met een goede ruimtelijke ordening, wegens het
      belang van het aangewezen beschermde stads- of dorpsgezicht of wegens het belang van bescherming van archeologische
      vindplaatsen. Van het besluit wordt onverwijld mededeling gedaan door toezending van een afschrift aan Onze
      Minister, aan de provinciale planologische commissie en aan genoemde Rijksdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1031
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel36e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:31
  - number: 36f
    text: |-
      De bekendmaking van een besluit als bedoeld in [artikel 36e, tweede lid][ref1], geschiedt
      door het besluit tezamen met het regionaal structuurplan voor een ieder ter inzage te
      leggen ter secretarie van het regionaal openbaar lichaam en van de gemeenten op wier
      gebied het betrekking heeft. De [artikelen 3:11, eerste, tweede en derde lid][ref2], en
      [3:12, eerste en tweede lid, en derde lid, onderdeel a, van de Algemene wet bestuursrecht][ref3] alsmede
      [artikel 4a, derde lid, onderdeel b][ref4], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel36e
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel311
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel312
      [ref4]: https://wetten.overheid.nl/BWBR0002375#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel36f
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 36e
        hoofdstuk: IVA
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 3:11
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 3:12
      - id: ref4
        bwb_id: BWBR0002375
        artikel: 4a
        hoofdstuk: III
  - number: 36g
    text: |-
      Een regionaal structuurplan wordt, behoudens door gedeputeerde staten voor ten hoogste tien jaren verleende
      vrijstelling en onverminderd het bepaalde bij [artikel 36k][ref1], ten minste eenmaal in de tien jaren herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel36k
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel36g
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 36k
        hoofdstuk: IVA
        afdeling: '2'
  - number: 36h
    text: |-
      Ten aanzien van de herziening van een regionaal structuurplan zijn de [artikelen 36c tot en met 36f][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel36c
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel36h
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 36c
        hoofdstuk: IVA
        afdeling: '2'
  - number: 36i
    text: |-
      Intrekking van een regionaal structuurplan of van een gedeelte daarvan is slechts mogelijk indien voor dat gebied
      een ontwerp voor een nieuw regionaal structuurplan ter inzage is gelegd dan wel een nieuw regionaal structuurplan
      is vastgesteld. Ten aanzien van de intrekking zijn de [artikelen 36c tot en met 36f][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel36c
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel36i
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 36c
        hoofdstuk: IVA
        afdeling: '2'
  - number: 36j
    text: |-
      Bij of krachtens algemeen maatregel van bestuur kunnen voorschriften worden gegeven omtrent de voorbereiding, de
      vormgeving en inrichting van regionale structuurplannen.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel36j
  - number: 36k
    text: |-
      1 Onze Minister kan na overleg met het algemeen bestuur, gedeputeerde staten en de Rijksplanologische Commissie
      gehoord, het algemeen bestuur van een regionaal openbaar lichaam verplichten binnen een door hem te bepalen termijn
      een regionaal structuurplan vast te stellen of te herzien.

      2 Bij toepassing van het eerste lid kan Onze Minister na overleg met het algemeen bestuur, gedeputeerde staten en
      de Rijksplanologische Commissie gehoord, voor zover een juiste uitvoering van het Regeringsbeleid de totstandkoming
      of herziening van regionale planologische maatregelen vordert, aan het algemeen bestuur aanwijzingen geven omtrent
      de inhoud van een regionaal structuurplan.

      3 Van zijn besluit, bedoeld in het eerste lid en van aanwijzingen, als bedoeld in het tweede lid, zendt Onze
      Minister behalve aan het algemeen bestuur afschriften aan de Rijksplanologische Commissie, aan gedeputeerde staten
      en aan de inspecteur. Van de dag der verzending van de afschriften af liggen aanwijzingen, als bedoeld in het
      tweede lid op door Onze Minister te bepalen plaatsen ter inzage. De nederlegging wordt tevoren door de zorg van
      Onze Minister in de *Staatscourant* en daarvoor in aanmerking komende dag- of nieuwsbladen bekendgemaakt.

      4 Gedeputeerde staten kunnen na overleg met het algemeen bestuur van een regionaal openbaar lichaam, de provinciale
      planologische commissie gehoord, dat algemeen bestuur verplichten binnen een door hen te bepalen termijn een
      regionaal structuurplan vast te stellen of te herzien.

      5 Bij toepassing van het vierde lid kunnen gedeputeerde staten na overleg met het algemeen bestuur, de provinciale
      planologische commissie gehoord, voor zover bovengemeentelijke belangen dat vorderen, aanwijzingen geven omtrent
      de inhoud van een regionaal structuurplan. Deze aanwijzingen moeten hun grondslag vinden in of redelijkerwijs
      voortvloeien uit een streekplan of het provinciaal ruimtelijk beleid, voor zover dit is neergelegd in een besluit
      van provinciale staten, de provinciale planologische commissie gehoord.

      6 Van hun besluit, bedoeld in het vierde lid, en van aanwijzingen als bedoeld in het vijfde lid, zenden
      gedeputeerde staten behalve aan het algemeen bestuur, afschriften aan de provinciale planologische commissie en
      aan Onze Minister. Van de dag der verzending van de afschriften af liggen aanwijzingen als bedoeld in het vijfde
      lid ter provinciale griffie, op de secretarie van het desbetreffende regionale openbaar lichaam en van de gemeenten
      op wier grondgebied het betrekking heeft ter inzage. [Artikel 3:12 van de Algemene wet bestuursrecht][ref1] is van
      overeenkomstige toepassing. De kennisgeving, bedoeld in het eerste lid van dat artikel, wordt door gedeputeerde
      staten tevens in de *Staatscourant* geplaatst.

      7 Het algemeen bestuur is verplicht bij de herziening van het regionaal structuurplan dit plan in overeenstemming
      te brengen met aanwijzingen als bedoeld in het tweede of vijfde lid. Voor zover die aanwijzingen betrekking hebben
      op een gebied, waarvoor geen regionaal structuurplan is vastgesteld, bestaat een overeenkomstige verplichting zodra
      het algemeen bestuur tot vaststelling van een regionaal structuurplan overgaat.

      8 Een ieder die bedenkingen heeft tegen een besluit als bedoeld in het eerste of vierde lid en aanwijzingen als
      bedoeld in het tweede of vijfde lid, kan deze als onderdeel van zijn zienswijze over het ontwerp voor het regionaal
      structuurplan, dat strekt ter uitvoering van dat besluit en die aanwijzingen, naar voren brengen.

      9 Indien het algemeen bestuur niet voldoet aan een verplichting, als bedoeld in het eerste of vierde lid, gaat Onze
      Minister onderscheidenlijk gaan gedeputeerde staten op kosten van het algemeen bestuur over tot het vaststellen
      of herzien van een regionaal structuurplan. Zolang de kennisgeving van de terinzagelegging van het ontwerp van het
      plan nog niet heeft plaatsgevonden blijft het algemeen bestuur tot de vaststelling of herziening bevoegd.

      10 In het geval bedoeld in het negende lid zijn de [artikelen 36c tot en met 36f][ref2] van overeenkomstige
      toepassing, met dien verstande, dat Onze Minister in de plaats treedt onderscheidenlijk gedeputeerde staten in de
      plaats treden van het algemeen en het dagelijks bestuur van het regionaal openbaar lichaam.

      11 Een regionaal structuurplan dat ingevolge het negende lid is tot stand gekomen of herzien, staat gelijk aan een
      door het algemeen bestuur van het regionaal openbaar lichaam vastgesteld regionaal structuurplan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel312
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel36c
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel36k
