  - number: 39d
    text: |-
      1 Op de voorbereiding van het rijksprojectbesluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing.

      2 Voor zover een ontwerp van een rijksprojectbesluit als bedoeld in het eerste lid zijn grondslag vindt in een
      concrete beleidsbeslissing in een planologische kernbeslissing, kunnen zienswijzen daarop geen betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
