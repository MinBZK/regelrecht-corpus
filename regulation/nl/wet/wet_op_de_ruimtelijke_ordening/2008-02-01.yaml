  - number: 39b
    text: |-
      Onze Ministers wie het aangaat, Onze Minister daaronder begrepen, na overleg in de ministerraad dan wel Onze
      projectminister stelt een rijksprojectbesluit vast, dat ten minste een beschrijving bevat van:

      a. het betrokken project en de wijze waarop het zal worden uitgevoerd,

      b. de gevolgen van het project voor de bij het project betrokken belangen, en

      c. de wijze waarop de inpassing van het betrokken project zal geschieden en, waar deze in redelijkheid niet kan
      worden verlangd, de compenserende maatregelen, die zullen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel39b
  - number: 39c
    text: |-
      1 Indien ten aanzien van het project het maken van een milieueffectrapport krachtens [artikel 7.2][ref1]
      of [artikel 7.4 van de Wet milieubeheer][ref2] verplicht is, gaat de mededeling, bedoeld in
      [artikel 7.12, eerste lid][ref3], of [artikel 7.13, eerste lid, van die wet][ref4], vergezeld van een toelichting
      met betrekking tot de wijze waarop het project past binnen het in planologische kernbeslissingen vastgestelde
      nationale ruimtelijk beleid. Indien het project strijdig is met het vastgestelde nationale ruimtelijk beleid, dient
      de mededeling vergezeld te gaan van een uitgebreide motivering waarom afwijking van dit beleid gerechtvaardigd is.
      Voorts dient de mededeling vergezeld te gaan van een globale beschrijving van de te verwachten sociaal-economische
      gevolgen van het project en van de gevolgen voor de overige bij het project betrokken belangen.

      2 Onze projectminister draagt ervoor zorg dat bij de publicatie van de beschrijving wordt vermeld binnen welke
      termijn een ontwerp van het rijksprojectbesluit ter inzage zal worden gelegd. Indien de terinzagelegging niet
      binnen deze termijn kan geschieden, deelt Onze projectminister dit voor het verstrijken daarvan onder vermelding
      van de redenen mee:

      a. aan beide kamers der Staten-Generaal;

      b. in de Staatscourant.

      3 Indien ten aanzien van het project het maken van een milieueffectrapport niet verplicht is, draagt Onze
      projectminister ervoor zorg dat in het kader van de voorbereiding van een rijksprojectbesluit een beschrijving als
      bedoeld in het eerste lid wordt opgesteld. Het tweede lid is alsdan niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7.2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7.4
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7.12
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel7.13
