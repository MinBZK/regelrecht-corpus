  - number: 36l
    text: |-
      1 Indien voor het gebied begrepen in een regionaal structuurplan een bestemmingsplan is vastgesteld en dit aan
      de goedkeuring van gedeputeerde staten wordt onderworpen, houden gedeputeerde staten bij hun besluit omtrent
      goedkeuring van dat bestemmingsplan rekening met het regionaal structuurplan.

      2 Voor zover het bestemmingsplan, bedoeld in het eerste lid, in strijd is met het regionaal structuurplan, vragen
      gedeputeerde staten het dagelijks bestuur van het regionaal openbaar lichaam om advies. Binnen vier weken na
      ontvangst van de adviesaanvraag bericht het dagelijks bestuur gedeputeerde staten, dat

      a. het regionaal structuurplan zal worden gewijzigd en het bestemmingsplan, vooruitlopend op die wijziging kan
      worden goedgekeurd, of

      b. aan het bestemmingsplan goedkeuring moet worden onthouden wegens strijd met het regionaal structuurplan.

      3 In een geval, bedoeld in het tweede lid, onder *b*, stellen gedeputeerde staten de termijn bedoeld in
      [artikel 30, eerste lid][ref1], op drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel30
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel36l
