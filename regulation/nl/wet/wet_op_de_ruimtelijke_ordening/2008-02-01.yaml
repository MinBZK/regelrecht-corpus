  - number: '29'
    text: |-
      1 Onze Minister kan binnen vier weken na de bekendmaking van het besluit omtrent goedkeuring van het
      bestemmingsplan aan gedeputeerde staten schriftelijk mededelen dat hij overweegt dat besluit voor zover in
      kennelijke strijd met het nationaal ruimtelijk beleid te vervangen door een eigen besluit.

      2 Voor zover het besluit van gedeputeerde staten strekt tot goedkeuring geeft Onze Minister slechts toepassing aan
      het eerste lid, indien de inspecteur op de in het eerste lid genoemde grondslag bedenkingen heeft ingebracht bij
      gedeputeerde staten op grond van [artikel 27, eerste of tweede lid][ref1].

      3 Indien Onze Minister geen toepassing geeft aan het eerste lid wordt het besluit van gedeputeerde staten met het
      bestemmingsplan met ingang van de zesde week na de bekendmaking, bedoeld in [artikel 28, vijfde lid][ref2], ter
      gemeentesecretarie voor een ieder ter inzage gelegd.

      4 Indien Onze Minister toepassing geeft aan het eerste lid zenden gedeputeerde staten hem terstond hun besluit
      onder bijvoeging van de zich onder hen bevindende, op de zaak betrekking hebbende stukken, voor zover dit niet in
      strijd is met enige wettelijke bepaling tot geheimhouding.

      5 Indien toepassing is gegeven aan het eerste lid doet Onze Minister daarvan gelijktijdig mededeling door
      toezending van een afschrift aan de Rijksplanologische Commissie, aan de betrokken gemeente en aan de inspecteur.
      [Artikel 3:12, eerste lid, van de Algemene wet bestuursrecht][ref3] is van overeenkomstige toepassing.

      6 Binnen twaalf weken na de dagtekening van de in het eerste lid bedoelde mededeling beslist Onze Minister
      omtrent vervanging van het besluit van gedeputeerde staten. Alvorens te beslissen hoort hij de Rijksplanologische
      Commissie, gedeputeerde staten en de betrokken gemeenteraad.

      7 Onze Minister maakt zijn besluit binnen twee weken na dagtekening daarvan bekend aan gedeputeerde staten.
      Indien Onze Minister niet heeft beslist binnen de in het zesde lid bedoelde termijn, wordt het besluit van
      Onze Minister vervangen door een schriftelijke mededeling van dat feit. Het vijfde lid is van overeenkomstige
      toepassing. Voorts zendt Onze Minister een afschrift van zijn besluit of van de in de tweede volzin van
      dit lid bedoelde mededeling aan hen die bij gedeputeerde staten bedenkingen hebben ingebracht als bedoeld
      in [artikel 27, eerste of tweede lid][ref4]. Het besluit van Onze Minister of de mededeling, bedoeld in de
      tweede volzin van dit lid, wordt binnen twee weken na de bekendmaking daarvan met het besluit van gedeputeerde
      staten en het bestemmingsplan ter gemeentesecretarie voor een ieder ter inzage gelegd voor de duur van zes
      weken.[ Artikel 23, eerste lid, onder a][ref5], is van overeenkomstige toepassing.

      8 Voor zover het besluit, bedoeld in het zesde lid, strekt tot vervanging, komt het besluit van Onze Minister in
      de plaats van het besluit van gedeputeerde staten. Onze Minister geeft zo nodig het door hem vervangen gedeelte
      van het besluit van gedeputeerde staten op de tot het plan behorende kaart en in de daarbij behorende voorschriften
      aan. [Artikel 28, vierde lid][ref6], is van overeenkomstige toepassing.

      9 Indien het besluit, bedoeld in het zesde lid, ertoe strekt van vervanging af te zien, dan wel de in dat lid
      bedoelde termijn is verstreken zonder dat een besluit als bedoeld in dat lid is genomen, blijft het besluit van
      gedeputeerde staten gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel312
