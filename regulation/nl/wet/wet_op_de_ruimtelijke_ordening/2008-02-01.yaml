  - number: 40a
    text: |-
      Indien met toepassing van [artikel 40][ref1] besloten wordt tot verlening van vrijstelling, is de gemeenteraad
      verplicht binnen een jaar te rekenen vanaf de dagtekening van dat besluit het bestemmingsplan dienovereenkomstig
      vast te stellen of te herzien. Gedeputeerde staten of Onze Minister kunnen deze termijn eenmaal met ten hoogste een
      jaar verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel40
