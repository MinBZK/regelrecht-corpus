  - number: '10'
    text: |-
      1 Voor het gebied van de gemeente, dat niet tot een bebouwde kom behoort, stelt de gemeenteraad een bestemmingsplan
      vast, waarbij, voor zover dit ten behoeve van een goede ruimtelijke ordening nodig is, de bestemming van de in
      het plan begrepen grond wordt aangewezen en zo nodig, in verband met de bestemming, voorschriften worden gegeven
      omtrent het gebruik van de in het plan begrepen grond en de zich daarop bevindende opstallen. Deze voorschriften
      mogen slechts om dringende redenen een beperking van het meest doelmatige gebruik inhouden en mogen geen eisen
      bevatten met betrekking tot de structuur van agrarische bedrijven. Onder grond wordt water mede begrepen.

      2 Voor het gebied van de gemeente, dat tot een bebouwde kom behoort, of voor een gedeelte daarvan, kan de
      gemeenteraad een bestemmingsplan, als in het vorige lid bedoeld, vaststellen.

      3 Gedeputeerde staten kunnen voor een door hen te bepalen termijn van de in het eerste lid bedoelde verplichting
      ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel10
  - number: '11'
    text: |-
      1 Bij een bestemmingsplan kan worden bepaald, dat, tenzij de gemeenteraad zich daarbij een van deze bevoegdheden
      zelf heeft voorbehouden, burgemeester en wethouders volgens bij het plan te geven regelen het plan moeten
      uitwerken of binnen bij het plan te bepalen grenzen het plan kunnen wijzigen. De wijzigingsbevoegdheid kan mede
      een uitwerkingsplicht inhouden. Bij het plan wordt geregeld op welke wijze belanghebbenden in de gelegenheid worden
      gesteld hun zienswijzen omtrent de uitwerking of wijziging naar voren te brengen.

      2 De besluiten van burgemeester en wethouders of, in voorkomend geval van de gemeenteraad, behoeven de goedkeuring
      van gedeputeerde staten. Met het besluit ontvangen gedeputeerde staten de bij burgemeester en wethouders, of in
      voorkomend geval de raad, ingebrachte zienswijzen.

      3 Het besluit omtrent goedkeuring wordt binnen acht weken na de verzending ter goedkeuring aan de gemeenteraad
      bekendgemaakt. In afwijking van [artikel 10:31, tweede lid, van de Algemene wet bestuursrecht][ref1] kan het nemen
      van het besluit omtrent goedkeuring eenmaal voor ten hoogste vier weken worden verdaagd.

      4 De goedkeuring kan worden onthouden wegens strijd met een goede ruimtelijke ordening.

      5 Het besluit van gedeputeerde staten wordt door burgemeester en wethouders bekendgemaakt door de terinzagelegging
      daarvan met het uitwerkings- of wijzigingsplan en het desbetreffende bestemmingsplan ter gemeentesecretarie voor
      een ieder. [Artikel 23, eerste lid, onder a][ref2], is van overeenkomstige toepassing.

      6 Uitwerkingen en wijzigingen als in dit artikel bedoeld worden geacht van het plan deel uit te maken, met dien
      verstande, dat zij, zolang en voor zover de bestemming nog niet verwerkelijkt is, kunnen worden herzien op dezelfde
      wijze, als waarop zij tot stand zijn gebracht.

      7 In afwijking van het tweede lid behoeven de besluiten van burgemeester en wethouders of, in voorkomend geval,
      de gemeenteraad tot uitwerking of tot wijziging van het bestemmingsplan geen goedkeuring van gedeputeerde
      staten, voor zover deze in hun besluit tot goedkeuring van het bestemmingsplan zulks hebben omschreven en tegen
      die uitwerking of wijziging niet van zienswijzen is gebleken. Zodanig besluit van burgemeester en wethouders
      of de raad wordt bekendgemaakt door de terinzagelegging daarvan met het uitwerkings- of wijzigingsplan en het
      desbetreffend bestemmingsplan ter gemeentesecretarie voor een ieder. [Artikel 23, eerste lid, onder a][ref3], is
      van overeenkomstige toepassing. Van zodanig besluit tot uitwerking of wijziging van het bestemmingsplan zenden
      burgemeester en wethouders onverwijld afschrift aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1031
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel23
