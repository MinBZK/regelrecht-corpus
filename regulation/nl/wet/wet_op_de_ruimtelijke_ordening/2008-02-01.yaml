  - number: '25'
    text: |-
      Binnen acht weken of, indien over het ontwerp tijdig een zienswijze naar voren is gebracht, binnen vier maanden na
      afloop van de in [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref1] genoemde termijn beslist de
      gemeenteraad omtrent de vaststelling van het bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel316
