preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is bij de wet nieuwe voorschriften omtrent de ruimtelijke
    ordening vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder

      Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      planologische kernbeslissing: een plan als bedoeld in [artikel 2a][ref1];

      concrete beleidsbeslissing: een als zodanig door het bestuursorgaan aangegeven besluit in een planologische
      kernbeslissing, een streekplan of een regionaal structuurplan;

      Onze projectminister: Onze minister die overeenkomstig [artikel 39a, eerste lid][ref2], als zodanig is aangewezen;

      rijksprojectbesluit: besluit als bedoeld in [artikel 39b][ref3];

      inspecteur: als zodanig bij besluit van Onze Minister aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel39a
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel39b
