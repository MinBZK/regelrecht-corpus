  - number: '38'
    text: |-
      1 Zo spoedig mogelijk, doch in elk geval binnen zes weken na de bekendmaking van een besluit als bedoeld in
      [artikel 37, eerste of vierde lid][ref1], en van aanwijzingen als bedoeld in het tweede of vijfde lid, van
      dat artikel, besluit de gemeenteraad omtrent medewerking aan de opgedragen vaststelling of herziening van het
      bestemmingsplan. Burgemeester en wethouders maken dit besluit onverwijld bekend.

      2 Indien de gemeenteraad

      a. de termijn genoemd in het eerste lid, voor het besluit omtrent medewerking overschrijdt,

      b. binnen de termijn, genoemd in het eerste lid, besluit niet mee te werken aan de opgedragen vaststelling of
      herziening van het bestemmingsplan, of

      c. binnen de termijn van een jaar, genoemd in [artikel 37, zevende lid][ref2], geen bestemmingsplan of herziening
      hiervan heeft vastgesteld in overeenstemming met de gegeven aanwijzingen,

      kunnen Onze Minister onderscheidenlijk gedeputeerde staten binnen een jaar na afloop van de onder *a*, *b* of
      *c* bedoelde termijn, met uitsluiting van de bevoegdheid ter zake van de gemeenteraad, op kosten van de gemeente
      overgaan tot die vaststelling of herziening.

      3 Indien Onze Minister overgaat tot de vaststelling of herziening, zijn de [artikelen 21 tot en met 26][ref3],
      [28, zevende lid][ref4], en [31a][ref5] van overeenkomstige toepassing met dien verstande dat:

      a. Onze Minister in de plaats treedt van de gemeenteraad en van burgemeester en wethouders;

      b. Onze Minister, alvorens te besluiten, de Rijksplanologische Commissie hoort.

      4 Indien gedeputeerde staten overgaan tot de vaststelling of herziening, zijn de
      [artikelen 21 tot en met 27][ref6], [28, eerste, vierde, vijfde en zevende lid][ref7], [30][ref8] en [31a][ref9],
      van overeenkomstige toepassing met dien verstande dat:

      a. gedeputeerde staten in de plaats treden van de gemeenteraad en van burgemeester en wethouders;

      b. gedeputeerde staten, alvorens te besluiten, de provinciale planologische commissie horen;

      c. Onze Minister in de plaats treedt van gedeputeerde staten;

      d. Onze Minister, alvorens te besluiten, de Rijksplanologische Commissie hoort.

      5 Een planologische maatregel overeenkomstig dit artikel tot stand gekomen, wordt geacht door de gemeenteraad onder
      goedkeuring van gedeputeerde staten te zijn vastgesteld.

      6 Indien door Onze Minister of gedeputeerde staten niet binnen het jaar bedoeld in het tweede lid, het
      bestemmingsplan is vastgesteld of herzien, vervalt de desbetreffende aanwijzing.


