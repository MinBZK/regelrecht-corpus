        artikel: '28'
        hoofdstuk: IV
        afdeling: '3'
  - number: 31b
    text: |-
      1 Indien ten behoeve van belangen, uitsluitend of mede behartigd door andere openbare lichamen dan de gemeente,
      op schriftelijk verzoek van die openbare lichamen onherroepelijk vrijstelling is verleend als bedoeld in
      de [artikelen 17][ref1], [19][ref2] en [40][ref3], dan wel onherroepelijk is beslist de verlening van een
      bouw- of aanlegvergunning ingevolge [artikel 50, eerste lid, van de Woningwet][ref4], dan wel ingevolge
      [artikel 46, tweede lid][ref5], aan te houden, kunnen burgemeester en wethouders gedeputeerde staten gedurende vier
      weken, ingaande daags nadat de vrijstelling, dan wel het besluit tot aanhouding onherroepelijk is geworden, een
      verzoek doen als bedoeld in [artikel 31a][ref6]. Burgemeester en wethouders kunnen vorenbedoeld verzoek ook tot
      gedeputeerde staten richten binnen de in de vorige volzin bedoelde termijn wanneer ingevolge [artikel 40][ref7] een
      vrijstelling of ingevolge [artikel 41][ref8] een vergunning of andere beschikking is verleend.

      2 In afwijking van het eerste lid, eerste volzin, beslist Onze Minister dan wel beslissen Onze Minister en Onze
      Minister die het mede aangaat omtrent het in die volzin bedoelde verzoek, indien het andere openbaar lichaam het
      Rijk is. In afwijking van het eerste lid, tweede volzin, beslist Onze Minister omtrent het in die volzin bedoelde
      verzoek, in geval [artikel 40][ref9] of [artikel 41][ref10] toepassing heeft gevonden op verzoek van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel17
