  - number: '18'
    text: |-
      1 Burgemeester en wethouders beslissen zo spoedig mogelijk doch in elk geval binnen acht weken na ontvangst van de
      aanvraag tot vrijstelling als bedoeld in [artikel 17][ref1] of toepassing zal worden gegeven aan het derde lid.

      2 Indien besloten wordt geen toepassing te geven aan het derde lid wordt de vrijstelling geweigerd.

      3 Op de voorbereiding van het besluit omtrent de vrijstelling is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien verstande dat:

      a. zienswijzen naar voren kunnen worden gebracht door een ieder;

      b. in afwijking van [artikel 3:18, eerste en tweede lid, van de Algemene wet bestuursrecht][ref3], burgemeester en
      wethouders beslissen binnen vier weken nadat de termijn voor het naar voren brengen van zienswijzen is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel17
