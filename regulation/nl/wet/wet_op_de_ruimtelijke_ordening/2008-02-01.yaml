  - number: 39e
    text: |-
      Indien [paragraaf 3][ref1] van deze afdeling op het project van toepassing is, kan desalniettemin in het
      rijksprojectbesluit worden bepaald dat in de verdere procedure ter realisering van het project van de toepassing
      van die paragraaf wordt afgezien, indien het nut van de toepassing naar het oordeel van de ministerraad of de
      projectminister niet opweegt tegen de daaraan verbonden bezwaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#HoofdstukVa
