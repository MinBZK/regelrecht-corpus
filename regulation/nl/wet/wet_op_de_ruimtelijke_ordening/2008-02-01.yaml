    text: |-
      De inspecteur alsmede de door de commissaris van de Koning en de burgemeester aangewezen ambtenaren zijn,
      onverminderd [artikel 141 van het Wetboek van Strafvordering][ref1], belast met de opsporing van de feiten,
      strafbaar gesteld in de [artikelen 179 tot en met 182][ref2] en [184 van het Wetboek van Strafrecht][ref3],
      voorzover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
