  - number: 19a
    text: |-
      1 Het vrijstellingsbesluit, bedoeld in [artikel 19, eerste en tweede lid][ref1], bevat een beschrijving van het
      betrokken project, de ruimtelijke onderbouwing en de afwegingen die aan het verlenen van vrijstelling ten grondslag
      liggen. [Artikel 15, derde lid][ref2], is van overeenkomstige toepassing.

      2 De gemeenteraad of in voorkomend geval burgemeester en wethouders beslissen zo spoedig mogelijk, doch in elk
      geval binnen acht weken na ontvangst van de aanvraag tot vrijstelling als bedoeld in [artikel 19][ref3], of
      toepassing zal worden gegeven aan het vierde lid.

      3 Indien besloten wordt geen toepassing te geven aan het vierde lid wordt de vrijstelling geweigerd.

      4 Op de voorbereiding van het besluit omtrent de vrijstelling is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] van toepassing, met dien verstande dat:

      a. zienswijzen naar voren kunnen worden gebracht door een ieder;

      b. in afwijking van [artikel 3:18, eerste en tweede lid, van de Algemene wet bestuursrecht][ref5], burgemeester en
      wethouders beslissen binnen vier weken nadat de termijn voor het naar voren brengen van zienswijzen is verstreken,
      indien geen verklaring van geen bezwaar is vereist.

      5 De gemeenteraad beslist of in voorkomend geval burgemeester en wethouders beslissen binnen acht weken na afloop
      van de termijn van terinzageligging omtrent het aanvragen van een verklaring van geen bezwaar.

      6 Indien tot aanvraag van de verklaring van geen bezwaar wordt besloten, wordt deze binnen twee weken nadien met
      de aanvraag om vrijstelling en de in voorkomend geval naar voren gebrachte zienswijzen aan gedeputeerde staten
      gezonden.

      7 Alvorens het besluit omtrent de verklaring van geen bezwaar, bedoeld in [artikel 19, eerste lid][ref6], of in
      voorkomend geval tweede lid, te nemen, horen gedeputeerde staten de inspecteur.

      8 Het besluit omtrent de verklaring van geen bezwaar, bedoeld in [artikel 19, eerste lid][ref7],
      of in voorkomend geval tweede lid, wordt binnen acht weken na ontvangst van de desbetreffende
      aanvraag bekendgemaakt. Van het besluit wordt onverwijld mededeling gedaan aan de inspecteur.
      [Artikel 10:31, tweede en derde lid, van de Algemene wet bestuursrecht][ref8] is niet van toepassing. Gedeputeerde
      staten kunnen de verklaring weigeren wegens strijd met een goede ruimtelijke ordening. Indien gedeputeerde staten
      binnen de gestelde termijn geen besluit aan de gemeenteraad, of in voorkomend geval burgemeester en wethouders
      hebben bekendgemaakt, wordt dit gelijkgesteld met een besluit tot weigering van de verklaring.

      9 Indien de inspecteur aan gedeputeerde staten te kennen heeft gegeven dat de beoogde vrijstelling in kennelijke
      strijd is met het nationaal ruimtelijk beleid en gedeputeerde staten niettemin besluiten tot verlening van de
      verklaring van geen bezwaar, treedt het besluit van gedeputeerde staten niet in werking. Gedeputeerde staten doen
      hiervan mededeling bij de bekendmaking van hun besluit aan de gemeenteraad of in voorkomend geval burgemeester en
      wethouders, onder gelijktijdige verzending van een afschrift aan de inspecteur.

      10 Onze Minister kan gedurende acht weken na verzending aan de inspecteur van de mededeling, bedoeld in het negende
      lid, het besluit van gedeputeerde staten vervangen door een eigen besluit inhoudende weigering van de verklaring.
      Alvorens te besluiten hoort hij de Rijksplanologische Commissie en gedeputeerde staten. Indien Onze Minister binnen
      die termijn geen besluit heeft bekendgemaakt dan wel zoveel eerder als hij heeft medegedeeld van vervanging af te
      zien, treedt het besluit van gedeputeerde staten in werking. Gedeputeerde staten doen daarvan mededeling aan de
      gemeenteraad of in voorkomend geval burgemeester en wethouders.

      11 In afwijking van [artikel 3:18, eerste en tweede lid][ref9], beslist de gemeenteraad of beslissen in voorkomend
      geval burgemeester en wethouders omtrent het verlenen van vrijstelling binnen twee weken na de inwerkingtreding
      van het besluit van gedeputeerde staten. Burgemeester en wethouders zenden afschrift van het besluit omtrent
      vrijstelling aan de inspecteur.

      12 Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven die in acht moeten worden genomen
      alvorens vrijstelling mag worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
