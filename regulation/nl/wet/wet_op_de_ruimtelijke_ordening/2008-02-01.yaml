  - number: 41c
    text: |-
      1 Bij besluit van de gemeenteraad kunnen gevallen of categorieën van gevallen worden aangewezen waarin
      verwezenlijking van een onderdeel van het gemeentelijk ruimtelijk beleid het wenselijk maakt dat de voorbereiding
      en de bekendmaking van nader aan te duiden, op aanvraag of ambtshalve te nemen besluiten worden gecoördineerd.

      2 Bij de gecoördineerde voorbereiding en bekendmaking, bedoeld in het eerste lid, wordt de procedure, bedoeld in de
      [artikelen 41d][ref1] en [41e][ref2], toegepast.


