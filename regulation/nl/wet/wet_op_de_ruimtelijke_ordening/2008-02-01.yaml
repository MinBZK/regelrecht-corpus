  - number: '28'
    text: |-
      1 Het bestemmingsplan behoeft de goedkeuring van gedeputeerde staten. Het plan wordt daartoe zo spoedig mogelijk,
      doch in elk geval binnen vier weken na de dagtekening van het raadsbesluit tot vaststelling, aan gedeputeerde
      staten verzonden.

      2 Indien tegen het vastgestelde plan tijdig bedenkingen zijn ingebracht krachtens [artikel 27][ref1], wordt het
      besluit omtrent goedkeuring bekendgemaakt binnen zes maanden na afloop van de termijn van terinzagelegging, bedoeld
      in [artikel 26][ref2]. Alvorens het besluit te nemen, horen gedeputeerde staten de provinciale planologische
      commissie. [Artikel 10:31, tweede en derde lid, van de Algemene wet bestuursrecht][ref3] is niet van toepassing. De
      goedkeuring kan worden onthouden indien de ingebrachte bedenkingen daartoe aanleiding geven dan wel wegens strijd
      met een goede ruimtelijke ordening.

      3 Aan het plan wordt geacht goedkeuring te zijn onthouden, indien het eerste lid, tweede volzin, niet is nageleefd
      en niet tijdig een besluit omtrent goedkeuring is bekendgemaakt.

      4 Indien het besluit van gedeputeerde staten strekt tot het onthouden van goedkeuring, kunnen daarbij voorschriften
      als bedoeld in [artikel 14][ref4] worden gegeven voor zover dat noodzakelijk is om te voorkomen dat een terrein
      minder geschikt wordt voor de verwerkelijking van een daaraan bij het plan te geven bestemming.

      5 Gelijktijdig met de bekendmaking doen gedeputeerde staten mededeling van hun besluit door
      toezending van een afschrift aan hen die bedenkingen hebben ingebracht krachtens [artikel 27][ref5],
      aan de provinciale planologische commissie en aan de inspecteur. Indien het derde lid dan wel
      [artikel 10:31, vierde lid, van de Algemene wet bestuursrecht][ref6] toepassing heeft gevonden wordt het besluit
      van gedeputeerde staten vervangen door een schriftelijke mededeling van gedeputeerde staten van dat feit.

      6 Behoudens indien toepassing kan worden gegeven aan [artikel 29, eerste lid][ref7], wordt binnen twee weken na de
      bekendmaking van het besluit omtrent goedkeuring van gedeputeerde staten dit besluit, of zo het derde lid dan wel
      [artikel 10:31, vierde lid, van de Algemene wet bestuursrecht][ref8] toepassing heeft gevonden, de schriftelijke
      mededeling van dat feit, met het bestemmingsplan ter gemeentesecretarie voor een ieder ter inzage gelegd voor de
      duur van zes weken. [Artikel 23, eerste lid, onder a][ref9], is van overeenkomstige toepassing.

      7 Een besluit van gedeputeerde staten omtrent goedkeuring treedt in werking met ingang van de dag na die waarop de
      beroepstermijn afloopt.


