  - number: 41d
    text: |-
      1 In de door de gemeenteraad met toepassing van [artikel 41c, eerste lid][ref1], bepaalde gevallen bevorderen
      burgemeester en wethouders een gecoördineerde voorbereiding van de krachtens dat lid aangeduide besluiten.
      Burgemeester en wethouders kunnen andere bestuursorganen verzoeken de medewerking te verlenen, die voor het
      welslagen van de coördinatie nodig is. Met het oog daarop zendt het bestuursorgaan dat bevoegd is op een aanvraag
      voor een dergelijk besluit te beslissen, hen onverwijld een afschrift van die aanvraag.

      2 Ten aanzien van een aanvraag als bedoeld in het eerste lid, derde volzin, zijn burgemeester en wethouders mede
      bevoegd die in te dienen bij het bevoegde bestuursorgaan.

      3 Op de voorbereiding van besluiten als bedoeld in [artikel 41c, eerste lid][ref2], is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing, met dien verstande dat:

      a. de kennisgeving, bedoeld in [artikel 3:12 van die wet][ref4], tevens wordt gedaan in de Staatscourant en langs
      elektronische weg;

      b. burgemeester en wethouders de kennisgevingen, bedoeld in [artikel 3:12 van die wet][ref5], voor verschillende
      onderwerpen kunnen samenvoegen in een kennisgeving die door burgemeester en wethouders wordt gedaan;

      c. de ontwerpbesluiten binnen een door burgemeester en wethouders in overeenstemming met het betrokken bevoegd
      gezag te bepalen termijn worden toegezonden aan burgemeester en wethouders die zorg dragen voor de toezending,
      bedoeld in [artikel 3:13 van die wet][ref6];

      d. zienswijzen door een ieder naar voren kunnen worden gebracht;

      e. in afwijking van [artikel 3:18 van die wet][ref7] de besluiten worden genomen binnen een door burgemeester en
      wethouders in overeenstemming met het betrokken bevoegd gezag te bepalen termijn;

      f. de besluiten onverwijld worden toegezonden aan burgemeester en wethouders;

      g. burgemeester en wethouders beslissen over de toepassing van [artikel 3:18, tweede lid, van die wet][ref8], en

      h. de toezending, bedoeld in [artikel 3:44 van die wet][ref9], tevens geschiedt aan burgemeester en wethouders.


