      Voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] worden als één
      besluit aangemerkt:

      a. een verklaring van geen bezwaar als bedoeld in [artikel 15, tweede lid][ref2], [16][ref3],
      [19, eerste, of, in voorkomend geval, tweede lid][ref4], [46, zevende of tiende lid][ref5], en het besluit waarop
      de verklaring betrekking heeft;

      b. een besluit van Onze Minister als bedoeld in [artikel 29, zevende lid][ref6], en een besluit van gedeputeerde
      staten als bedoeld in [28, tweede lid][ref7], voor zover niet vervangen;

      c. een besluit omtrent een verzoek om vrijstelling als bedoeld in [artikel 40, eerste lid][ref8], en besluiten
      omtrent medewerking als bedoeld in [artikel 40, derde, achtste en negende lid][ref9], en het besluit omtrent die
      vrijstelling;

      d. een besluit tot het verlenen van vrijstelling als bedoeld in [artikel 40][ref10] en een besluit omtrent een
      beschikking als bedoeld in [artikel 41][ref11], in onderlinge samenhang genomen;

      e. de beschikkingen, bedoeld in [artikel 41][ref12], met betrekking tot de verwezenlijking van eenzelfde project;

      f. de besluiten, bedoeld in [artikel 39j, eerste lid][ref13];

      g. indien ten behoeve van een project de [paragrafen 2][ref14] en [3][ref15] van
      [afdeling 1a van hoofdstuk Va][ref16] gelijktijdig zijn toegepast, de besluiten, bedoeld in
      [artikel 39j, eerste lid][ref17], en het rijksprojectbesluit;

      h. de besluiten, bedoeld in [artikel 41c, eerste lid][ref18], met betrekking tot de verwezenlijking van eenzelfde
      project.


