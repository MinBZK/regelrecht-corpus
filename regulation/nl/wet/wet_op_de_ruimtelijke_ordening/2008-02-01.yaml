  - number: 50a
    text: |-
      1 Onze Minister kan ter uitvoering van het nationaal ruimtelijk beleid, zoals verwoord in de Planologische
      Kernbeslissing Nationaal Ruimtelijk Beleid, subsidies verstrekken ten behoeve van:

      a. de ontwikkeling of herziening van ruimtelijke plannen van provincies, samenwerkingsgebieden als bedoeld in
      [hoofdstuk IVA][ref1] of gemeenten;

      b. de voorbereiding van projecten of activiteiten die voor de uitvoering van het nationaal ruimtelijk beleid van
      strategisch belang zijn;

      c. de realisering van projecten of activiteiten die voor de uitvoering van het nationaal ruimtelijk beleid van
      strategisch belang zijn.

      2 Onze Minister kan tevens subsidies verstrekken ten behoeve van activiteiten ter uitvoering van het nationaal
      ruimtelijk beleid, zoals verwoord in een andere planologische kernbeslissing dan genoemd in het eerste lid, indien
      bij algemene maatregel van bestuur zodanige planologische kernbeslissing alsmede de activiteiten waarvoor een
      subsidie kan worden verstrekt, zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#HoofdstukIVA
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0002375
        hoofdstuk: IVA
  - number: 50c
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gegeven met betrekking tot de wijze van verdeling
      van de subsidiegelden.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot:

      a. de vaststelling van een subsidieplafond, het tijdvak waarvoor het subsidieplafond is vastgesteld, alsmede de
      wijze waarop dit bekend wordt gemaakt;

      b. de subsidieverlening;

      c. de gevallen waarin de subsidieverlening wordt geweigerd;

      d. de verplichtingen van de subsidie-ontvanger;

      e. de subsidievaststelling;

      f. het intrekken of het ten nadele van de subsidie-ontvanger wijzigen zolang de subsidie niet is vastgesteld;

      g. de betaling van de subsidie;

      h. het verlenen van voorschotten en de betaling daarvan.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel50c
  - number: '51'
    text: |-
      1 Ten behoeve van overleg over zaken betreffende de ruimtelijke ordening is er een Rijksplanologische Commissie. De
      commissie heeft voorts tot taak Onze Minister en desgevraagd Onze andere Ministers van advies te dienen over zaken
      betreffende de ruimtelijke ordening.

      2 De voorzitter van de Commissie wordt door Ons benoemd. Onze bij algemene maatregel van bestuur aan te wijzen
      Ministers benoemen de leden der commissie. Elke Minister kan zoveel leden benoemen als bij algemene maatregel van
      bestuur wordt bepaald.

      3 Onze Minister voorziet in het secretariaat van de commissie.

      4 Wij kunnen bij algemene maatregel van bestuur subcommissies instellen en bepalen, in welke gevallen het advies
      dier subcommissies in de plaats treedt van dat der Rijksplanologische Commissie.

      5 Wij kunnen bij algemene maatregel van bestuur nadere voorschriften geven omtrent de taak en de werkwijze van
      de commissie.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel51
  - number: '53'
    text: |-
      1 Ten behoeve van het overleg over zaken betreffende de ruimtelijke ordening is er in elke provincie een
      provinciale planologische commissie. Deze commissie dient voorts het provinciaal bestuur van advies over de
      uitvoering van de taak, die bij of krachtens deze wet aan dat bestuur is opgedragen.

      2 De voorzitter, de leden en de secretaris der commissie worden door gedeputeerde staten benoemd. De inspecteur is
      ambtshalve lid van de commissie.

      3 Wij geven bij algemene maatregel van bestuur voorschriften omtrent de samenstelling der commissies.

      4 Gedeputeerde staten kunnen nadere voorschriften geven omtrent de taak en werkwijze der commissie. Zij
      kunnen bepalen, dat bepaalde bevoegdheden van de provinciale planologische commissie worden uitgeoefend door
      subcommissies.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel53
  - number: '54'
    text: |-
      1 [Afdeling 7.1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op een besluit van Onze Minister
      als bedoeld in [artikel 29, zesde lid][ref2].

      2 Een belanghebbende kan bij de Afdeling bestuursrechtspraak van de Raad van State beroep instellen tegen:

      a. een concrete beleidsbeslissing, een herziening of een intrekking daarvan, opgenomen in een planologische
      kernbeslissing, een streekplan of een regionaal structuurplan;

      b. een besluit inzake goedkeuring van een besluit van burgemeester en wethouders of de gemeenteraad tot uitwerking
      of tot wijziging van een bestemmingsplan;

      c. een besluit van burgemeester en wethouders of de gemeenteraad tot uitwerking of wijziging van een
      bestemmingsplan overeenkomstig [artikel 11, zevende lid][ref3];

      d. een besluit omtrent goedkeuring van een bestemmingsplan of van de herziening of intrekking daarvan;

      e. een besluit van Onze Minister tot vervanging van het besluit van gedeputeerde staten omtrent goedkeuring van een
      bestemmingsplan of van de herziening of intrekking daarvan;

      f. een besluit omtrent een verzoek tot vergoeding van hogere kosten ten gevolge van het opnemen van bepalingen in
      een bestemmingsplan op verzoek of krachtens wettelijke bepaling;

      g. een besluit omtrent een verzoek om vergoeding van hogere kosten ten gevolge van het verlenen van vrijstelling of
      aanhouding van bouw- of aanlegvergunning op verzoek van een ander openbaar lichaam;

      h. een besluit van gedeputeerde staten omtrent vrijstelling als bedoeld in [artikel 33, tweede lid][ref4];

      i. een besluit tot vrijstelling als bedoeld in [artikel 40][ref5];

      j. een beschikking als bedoeld in [artikel 41, eerste lid][ref6];

      k. een rijksprojectbesluit;

      l. een besluit als bedoeld in [artikel 39j, eerste lid][ref7], voorzover dat besluit geen grondslag vindt in een
      concrete beleidsbeslissing in een planologische kernbeslissing of in een rijksprojectbesluit;

      m. besluiten als bedoeld in [artikel 41c, eerste lid][ref8].

      3 De Afdeling bestuursrechtspraak van de Raad van State beslist op:

      a. de beroepen, bedoeld in het tweede lid, onder d en e, binnen twaalf maanden na afloop van de beroepstermijn;

      b. een beroep als bedoeld in het tweede lid, onder k, binnen twaalf maanden na ontvangst van het verweerschrift,
      met dien verstande dat de Afdeling bestuursrechtspraak in bijzondere omstandigheden deze termijn met ten hoogste
      drie maanden kan verlengen;

      c. een beroep als bedoeld in het tweede lid, onder l en m, binnen zes maanden na ontvangst van het verweerschrift;

      d. op een beroep als bedoeld in het tweede lid, onder k en l, indien gelijktijdig beroep is ingesteld, binnen
      twaalf maanden na ontvangst van het verweerschrift, met dien verstande dat de Afdeling bestuursrechtspraak in
      bijzondere omstandigheden deze termijn met ten hoogste drie maanden kan verlengen.

      4 Indien het beroep een bestemmingsplan of een herziening daarvan betreft waarin ingevolge
      [artikel 13, eerste lid, onderdelen][ref9] zijn aangewezen ten aanzien waarvan de verwerkelijking van het plan in
      de naaste toekomst nodig wordt geacht, wordt het beroep behandeld vóór andere ingestelde beroepen als bedoeld in
      het derde lid.

      5 Indien tegen een beschikking als bedoeld in [artikel 41][ref10] een beroep anders dan ingevolge het tweede lid,
      onder j, openstaat, blijven de bepalingen inzake dat beroep buiten toepassing.

      6 Indien tegen een rijksprojectbesluit tevens een beroep anders dan overeenkomstig het tweede lid, onder k, kan
      worden ingesteld, blijven de bepalingen inzake dat beroep buiten toepassing.

      7 Bij het beroep tegen een rijksprojectbesluit kunnen geen gronden worden aangevoerd die betrekking hebben op de
      concrete beleidsbeslissing in een planologische kernbeslissing, waarop dat besluit berust.


