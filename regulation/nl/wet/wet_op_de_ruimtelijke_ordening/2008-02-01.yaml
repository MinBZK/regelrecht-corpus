  - number: 36m
    text: |-
      Voor zover in een gebied, begrepen in een regionaal structuurplan, toepassing wordt gegeven aan [artikel 19][ref1]
      of [46][ref2], horen gedeputeerde staten tevens het dagelijks bestuur van het regionaal openbaar lichaam alvorens
      zij besluiten omtrent de verklaring van geen bezwaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel46
