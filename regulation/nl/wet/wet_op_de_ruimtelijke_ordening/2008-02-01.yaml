  - number: '34'
    text: |-
      1 Ten aanzien van de herziening van een structuurplan zijn de [artikelen 8][ref1] en [9][ref2] van overeenkomstige
      toepassing.

      2 Ten aanzien van de herziening van een bestemmingsplan zijn de [artikelen 21-31][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel8
