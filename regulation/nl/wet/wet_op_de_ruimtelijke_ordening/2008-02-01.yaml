  - number: 39g
    text: |-
      Het rijksprojectbesluit vervalt van rechtswege indien het niet binnen tien jaar na het tijdstip waarop het
      onherroepelijk is geworden in uitvoering is genomen.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel39g
  - number: 39h
    text: |-
      1 Voor het gebied dat is begrepen in een rijksprojectbesluit geldt het rijksprojectbesluit als
      voorbereidingsbesluit als bedoeld in [artikel 21][ref1]. Voorzover het rijksprojectbesluit geldt als
      voorbereidingsbesluit, is [artikel 21, vierde tot en met zesde lid][ref2], niet van toepassing. Het
      rijksprojectbesluit geldt niet meer als voorbereidingsbesluit indien voor het gebied een bestemmingsplan in
      overeenstemming met het rijksprojectbesluit in werking is getreden.

      2 [Artikel 50 van de Woningwet][ref3] is niet van toepassing op aanvragen om een bouwvergunning ter uitvoering van
      het rijksprojectbesluit.

      3 Voorzover het rijksprojectbesluit en het bestemmingsplan niet met elkaar in overeenstemming zijn, geldt het
      rijksprojectbesluit voor de uitvoering daarvan als vrijstelling, als bedoeld in [artikel 19][ref4].

      4 Voorzover een bestemmingsplan of een ander besluit voor de uitvoering van werken en werkzaamheden een
      aanlegvergunning als bedoeld in [artikel 14][ref5] vereist, geldt zodanige eis niet voor de uitvoering van
      werken en werkzaamheden ter uitvoering van het rijksprojectbesluit in het gebied dat is begrepen in een
      rijksprojectbesluit.

      5 Voorschriften in een leefmilieuverordening als bedoeld in
      [artikel 9, derde lid, van de Wet op de stads- en dorpsvernieuwing][ref6] blijven buiten toepassing voor de
      uitvoering van werken, werkzaamheden en bouwwerken en voor het gebruik van gronden en opstallen ter uitvoering van
      een rijksprojectbesluit, voorzover het rijksprojectbesluit en die voorschriften niet met elkaar in overeenstemming
      zijn.

      6 De gemeenteraad is verplicht binnen een jaar nadat het rijksprojectbesluit onherroepelijk is geworden, het
      bestemmingsplan overeenkomstig dat rijksprojectbesluit vast te stellen of te herzien.

      7 Indien het bestemmingsplan nog niet in overeenstemming is met het rijksprojectbesluit, verleent het
      gemeentebestuur aan degenen die inzage verlangen in dat plan tevens inzage in het rijksprojectbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel21
