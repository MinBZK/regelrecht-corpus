  - number: 39f
    text: |-
      1 Het rijksprojectbesluit wordt vastgesteld binnen dertien weken nadat de termijn voor het naar voren brengen van
      zienswijzen is verstreken.

      2 De vaststelling van het rijksprojectbesluit kan eenmaal voor ten hoogste dertien weken worden verdaagd.

      3 [Artikel 39c, tweede lid, tweede volzin][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel39c
