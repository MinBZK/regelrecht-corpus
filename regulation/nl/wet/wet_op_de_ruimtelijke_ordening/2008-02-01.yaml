      1 Voor de toepassing van [artikel 6:13 van de Algemene wet bestuursrecht][ref1] op een beroep als bedoeld
      in [artikel 54, tweede lid, onder d en e][ref2], wordt het inbrengen van bedenkingen overeenkomstig
      [artikel 27, eerste of tweede lid][ref3], aangemerkt als het naar voren brengen van zienswijzen als bedoeld in
      [artikel 3:15 van de Algemene wet bestuursrecht][ref4].

      2 In afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref5] kan beroep bij de Afdeling
      bestuursrechtspraak van de Raad van State worden ingesteld door uitsluitend:

      a. het algemeen bestuur van het regionaal openbaar lichaam tegen een besluit van gedeputeerde staten tot onthouding
      van goedkeuring aan een regionaal structuurplan of een herziening daarvan;

      b. het in eerste aanleg bevoegde gezag tegen een besluit houdende een aanwijzing krachtens
      [artikel 41, vierde lid][ref6].


