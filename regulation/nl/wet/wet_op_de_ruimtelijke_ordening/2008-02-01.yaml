  - number: 39k
    text: |-
      1 Op de voorbereiding van de in [artikel 39j, eerste lid][ref1], bedoelde besluiten is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien verstande dat:

      a. de ontwerpen van de besluiten binnen een door Onze projectminister te bepalen termijn worden toegezonden aan
      Onze projectminister, die zorg draagt voor de in [artikel 3:13, eerste lid, van die wet][ref3] bedoelde toezending;

      b. Onze projectminister ten aanzien van de ontwerpen van de besluiten gezamenlijk toepassing kan geven aan de
      [artikelen 3:11, eerste lid][ref4], en [3:12 van die wet][ref5];

      c. zienswijzen naar voren kunnen worden gebracht door een ieder;

      d. in afwijking van [artikel 3:18 van die wet][ref6] de besluiten worden genomen binnen een door Onze
      projectminister te bepalen termijn;

      e. de besluiten onverwijld worden toegezonden aan Onze projectminister.

      2 Voor zover een ontwerp van een besluit als bedoeld in het eerste lid, zijn grondslag vindt in een concrete
      beleidsbeslissing in een planologische kernbeslissing of in een projectbesluit, kunnen bedenkingen daarop geen
      betrekking hebben.

      3 [Artikel 46, eerste lid, van de Woningwet][ref7] is niet van toepassing op aanvragen om een bouwvergunning ter
      uitvoering van het rijksprojectbesluit.


