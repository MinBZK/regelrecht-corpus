  - number: '57'
    text: |-
      1 Onze Minister is gemachtigd namens de Staat tot oprichting over te gaan van een stichting die tot doel heeft de
      taak te verrichten, bedoeld in [artikel 57a][ref1].

      2 Wijziging van de statuten van de stichting, dan wel ontbinding van de stichting behoeft de toestemming van Onze
      Minister. Alvorens te beslissen over de toestemming, hoort Onze Minister de Afdeling bestuursrechtspraak van de
      Raad van State.

      3 De statuten van de stichting waarborgen dat de stichting haar werkzaamheden onpartijdig en onafhankelijk
      verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel57a
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 57a
        hoofdstuk: IXB
  - number: 57a
    text: |-
      De stichting heeft tot taak aan de administratieve rechter op diens verzoek deskundigenbericht uit te brengen
      inzake beroepen op grond van deze wet. Op verzoek van de administratieve rechter brengt de stichting tevens
      deskundigenbericht uit inzake beroepen op grond van andere wetten, voor zover het onderwerpen betreft die
      samenhangen met de ruimtelijke ordening.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel57a
  - number: 57b
    text: |-
      De personen die deel uitmaken van de organen van de stichting, en het personeel van de stichting vervullen geen
      functies en betrekkingen, waarvan de uitoefening ongewenst is met het oog op de handhaving van de onpartijdigheid
      en onafhankelijkheid van de stichting dan wel van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel57b
  - number: 57c
    text: |-
      1 Indien met toepassing van [artikel 57][ref1] een stichting is opgericht, verstrekt Onze Minister aan de stichting
      subsidie overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen voorschriften, voor zover dat
      redelijkerwijs noodzakelijk is voor een goede taakuitoefening.

      2 [Artikel 8:36, eerste lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel836
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel57c
    references:
