  - number: '33'
    text: |-
      1 Een structuurplan en een bestemmingsplan worden, onverminderd het bepaalde bij
      [artikel 37, eerste en vierde lid][ref1], tenminste eenmaal in de tien jaren herzien.

      2 Gedeputeerde staten kunnen op verzoek van de gemeenteraad voor ten hoogste tien jaren vrijstelling verlenen van
      de verplichting, bedoeld in het eerste lid.

      3 Op de totstandkoming van het besluit tot vrijstelling is [artikel 23, eerste lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel23
