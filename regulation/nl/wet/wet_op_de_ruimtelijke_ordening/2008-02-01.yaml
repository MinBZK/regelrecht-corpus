  - number: '39'
    text: |-
      Een planologische kernbeslissing ten behoeve van een groot project van nationaal belang bevat een of meer concrete
      beleidsbeslissingen. Bij de nadere besluitvorming over zodanige projecten worden die beleidsbeslissingen in acht
      genomen.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel39
  - number: 39a
    text: |-
      1 Bij de wet, in een planologische kernbeslissing of, indien spoedeisende maatschappelijke belangen dit vergen, in
      een besluit van Onze Ministers wie het aangaat, Onze Minister daaronder begrepen, na overleg in de ministerraad,
      kan worden bepaald dat op de besluitvorming omtrent een project of een categorie van projecten van nationaal belang
      de procedure die is beschreven in de [paragrafen 2][ref1] en [3][ref2] van deze afdeling, dan wel een van die
      paragrafen van toepassing is. Onder projecten van nationaal belang worden verstaan projecten met een bovenlokale
      ruimtelijke dimensie of met bovenlokale ruimtelijke effecten. Indien de grondslag wordt gevonden in de wet of
      een planologische kernbeslissing wordt daarbij aangegeven welke minister optreedt als projectminister. Indien de
      grondslag is gelegen in een besluit van Onze Ministers wie het aangaat treedt Onze minister op als projectminister
      tenzij bij dat besluit uitdrukkelijk een andere minister wordt aangewezen.

      2 Indien [paragraaf 2][ref3] van deze afdeling van toepassing is verklaard, wordt in de wet, de planologische
      kernbeslissing of het besluit tevens bepaald of het rijksprojectbesluit wordt vastgesteld door Onze Ministers wie
      het aangaat, Onze Minister daaronder begrepen, na overleg in de ministerraad of door Onze projectminister.

      3 Een besluit van Onze Ministers wie het aangaat als bedoeld in het eerste lid, geeft een aanduiding van de
      betekenis en het belang van het betrokken project en bevat een globale beschrijving van de te verwachten gevolgen
      van het project voor het nationaal ruimtelijk beleid, van de sociaal-economische gevolgen van het project en
      van de gevolgen voor de andere bij het project betrokken belangen. Het besluit wordt toegezonden aan de Tweede
      Kamer der Staten-Generaal. Aan het besluit wordt geen uitvoering gegeven dan nadat de Tweede Kamer daarmee heeft
      ingestemd. Met het besluit van Onze Ministers wie het aangaat, Onze Minister daaronder begrepen, wordt geacht te
      zijn ingestemd indien de Tweede Kamer binnen vier weken na de toezending van dat besluit geen besluit heeft genomen
      omtrent de behandeling daarvan.

      4 Voorzover de uitvoering van een project waarop een wet of een besluit van Onze Ministers wie het aangaat,
      Onze Minister daaronder begrepen, als bedoeld in het eerste lid, betrekking heeft, in strijd zou zijn met een
      planologische kernbeslissing, wordt door Onze Ministers wie het aangaat, Onze Minister daaronder begrepen, aan de
      Tweede Kamer mededeling gedaan van het voornemen deze planologische kernbeslissing te herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#HoofdstukVa
      [ref2]: https://wetten.overheid.nl/BWBR0002375#HoofdstukVa
      [ref3]: https://wetten.overheid.nl/BWBR0002375#HoofdstukVa
