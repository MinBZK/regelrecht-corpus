    text: |-
      1 Indien een bestuursorgaan dat in eerste aanleg bevoegd is een besluit als bedoeld in [artikel 39i][ref1] te
      nemen, niet of niet tijdig op de aanvraag beslist dan wel een beslissing neemt die naar het oordeel van Onze
      Minister en van Onze projectminister wijziging behoeft kunnen Onze projectminister en Onze Minister wie het mede
      aangaat gezamenlijk een beslissing op de aanvraag nemen. In het laatste geval treedt hun besluit in de plaats
      van het besluit van het in het eerste aanleg bevoegde bestuursorgaan. Indien Onze in de eerste volzin bedoelde
      Ministers voornemens zijn zelf een beslissing op de aanvraag te nemen, plegen zij overleg met het bestuursorgaan
      dat in eerste aanleg bevoegd is op de aanvraag te beslissen.

      2 Het eerste lid is van overeenkomstige toepassing op de in [artikel 39j, eerste lid][ref2], bedoelde ambtshalve te
      nemen besluiten.

      3 Indien bij de toepassing van het eerste lid de beslissing op een aanvraag wordt genomen door in dat lid bedoelde
      ministers, stort het bestuursorgaan dat in eerste aanleg bevoegd was te beslissen op de aanvraag, de ter zake
      ontvangen leges in 's Rijks kas.

      4 Ten aanzien van de in de in [artikel 39i, eerste lid][ref3], bedoelde aanvragen is Onze projectminister mede
      bevoegd deze in te dienen bij de bevoegde bestuursorganen.


