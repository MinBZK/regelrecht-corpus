  - number: '3'
    text: |-
      1 Maatregelen en plannen, die van betekenis zijn voor het Regeringsbeleid inzake de ruimtelijke ordening, komen tot
      stand door tussenkomst van de Rijksplanologische Commissie.

      2 Wij kunnen bij algemene maatregel van bestuur al dan niet onder het stellen van voorwaarden, afwijking van het
      eerste lid toestaan.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel3
  - number: 3a
    text: |-
      De in deze wet voorziene algemene maatregelen van bestuur treden niet eerder in werking dan twee maanden na
      de dagtekening van het *Staatsblad*, waarin de desbetreffende besluiten zijn geplaatst. Van de plaatsing wordt
      onverwijld aan de Staten-Generaal mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel3a
  - number: '4'
    text: |-
      1 Gedeputeerde staten verrichten het nodige ter voorbereiding van de bepaling van het provinciale beleid inzake
      de ruimtelijke ordening. Over maatregelen en plannen, die van betekenis zijn voor dit beleid, horen zij vooraf de
      provinciale planologische commissie.

      2 Jaarlijks doen gedeputeerde staten aan provinciale staten een verslag toekomen van het door hen gevoerde beleid
      inzake de ruimtelijke ordening.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel4
  - number: 4a
    text: |-
      1 Provinciale staten kunnen voor één of meer gedeelten of voor het gehele gebied der provincie een streekplan
      vaststellen, waarin de toekomstige ontwikkeling van het in het plan begrepen gebied in hoofdlijnen wordt
      aangegeven, alsmede een vastgesteld streekplan herzien. Indien een onderdeel van een zodanig plan een
      concrete beleidsbeslissing is, wordt die beslissing bij de uitwerking of afwijking bedoeld in het tiende lid
      of bij de vaststelling van gemeentelijke of regionale plannen als bedoeld in de [hoofdstukken IV][ref1] of
      [IVA van deze wet][ref2] in acht genomen. Provinciale staten geven bij het plan aan in hoeverre het voorgenomen
      beleid is afgestemd op, dan wel leidt tot aanpassing van het provinciale milieubeleid, het provinciale
      waterhuishoudingsbeleid of het provinciale verkeers- en vervoersbeleid en in hoeverre en binnen welke termijn zij
      voornemens zijn het geldende provinciale milieubeleidsplan, het geldende provinciale waterhuishoudingsplan of het
      geldende provinciale verkeers- en vervoersplan te herzien. Een streekplan strekt tot grondslag aan aanwijzingen als
      bedoeld in [artikel 37, vijfde lid][ref3].

      2 Gedeputeerde staten zijn met de voorbereiding belast. Hierbij horen zij de provinciale planologische commissie.

      3 Op de voorbereiding van het streekplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] van toepassing,
      met dien verstande dat:

      a. de terinzagelegging tevens geschiedt ter secretarie van de gemeenten op wier gebied het plan betrekking heeft;

      b. aan [artikel 3:12 van die wet][ref5] tevens toepassing wordt gegeven door burgemeester en wethouders van elke
      gemeente op wier gebied het plan betrekking heeft;

      c. zienswijzen naar voren kunnen worden gebracht door een ieder.

      4 Binnen vier maanden na afloop van de in het derde lid genoemde termijn stellen provinciale staten het streekplan
      vast. Zij kunnen hun beslissing éénmaal voor ten hoogste acht weken verdagen. Voor zover bij de vaststelling van
      het plan wijzigingen worden aangebracht ten opzichte van het ontwerp en de gewijzigde vaststelling een concrete
      beleidsbeslissing betreft, wordt Onze Minister tevoren in de gelegenheid gesteld alsnog daarover zienswijzen naar
      voren te brengen.

      5 Voor zover het ontwerp van een streekplan zijn grondslag vindt in een in een planologische kernbeslissing
      opgenomen concrete beleidsbeslissing is het derde lid, onder c niet van toepassing.

      6 Behoudens indien toepassing kan worden gegeven aan [artikel 4b, eerste lid][ref6], wordt het besluit tot
      vaststelling van het streekplan binnen twee weken na de dagtekening daarvan bekendgemaakt door dit besluit samen
      met het vastgestelde streekplan voor een ieder ter inzage te leggen op het provinciehuis en ter secretarie van
      de gemeenten op wier gebied het betrekking heeft. De [artikelen 3:11, eerste, tweede en derde lid][ref7], en
      [3:12, eerste lid, en derde lid, onderdeel a, van de Algemene wet bestuursrecht][ref8] alsmede het derde lid,
      onderdeel b, zijn van overeenkomstige toepassing.

      7 Besluiten tot vaststelling van een streekplan worden terstond na dagtekening aan Onze Minister medegedeeld
      door toezending van een afschrift. Indien in het streekplan een concrete beleidsbeslissing is opgenomen gaat het
      afschrift vergezeld van een exemplaar van het streekplan.

      8 Bij een streekplan wordt bepaald, in hoeverre gedeputeerde staten volgens bij het plan aan te geven regelen
      het plan moeten uitwerken en binnen bij het plan te bepalen grenzen van het plan mogen afwijken. De uitwerking of
      afwijking kan geen concrete beleidsbeslissing inhouden.

      9 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de voorbereiding, vormgeving en
      inrichting van streekplannen.


