  - number: '2'
    text: |-
      1 Onze Minister verricht het nodige ter voorbereiding en ter uitvoering van het Regeringsbeleid inzake de
      ruimtelijke ordening. De uitkomsten hiervan worden, met inachtneming van de grenzen gesteld bij of krachtens de
      [Wet openbaarheid van bestuur][ref1], gepubliceerd.

      2 Jaarlijks doet Onze Minister aan de Tweede Kamer der Staten-Generaal in de memorie van toelichting op het
      desbetreffende hoofdstuk van de Rijksbegroting toekomen:

      a. een verslag van het door de Regering gevoerde beleid inzake de ruimtelijke ordening;

      b. een wetgevingsprogramma gericht op harmonisatie en coördinatie van ruimtelijk relevante wetgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 2a
    text: |-
      1 De Ministerraad stelt voor bepaalde aspecten van het nationale ruimtelijke beleid plannen vast. Deze plannen
      kunnen bestaan uit structuurschetsen, structuurschema’s of nota's, die van belang zijn voor het nationaal
      ruimtelijk beleid, zoals nader bepaald bij algemene maatregel van bestuur. Indien een onderdeel van een zodanig
      plan een concrete beleidsbeslissing is, wordt die beslissing bij de vaststelling van andere plannen op grond van
      deze wet in acht genomen. De in het eerste volzin bedoelde plannen worden voorbereid door Onze Ministers, wie
      het aangaat, Onze Minister daaronder begrepen. Van het voornemen een plan voor te bereiden doen Onze Ministers
      mededeling aan de Staten-Generaal. Afschrift van deze mededeling zendt Onze Minister aan de VROM-raad, ingesteld
      bij de [Wet op de VROM-raad][ref1]. In het plan wordt vermeld voor welke tijdsduur het geldt.

      2 Op de voorbereiding van het plan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met
      dien verstande dat:

      a. daaraan toepassing wordt gegeven door de eerstverantwoordelijke van Onze Ministers als bedoeld in het eerste
      lid;

      b. zienswijzen naar voren kunnen worden gebracht door een ieder;

      c. de termijn voor het naar voren brengen van zienswijzen twaalf weken bedraagt.

      3 Onze in het eerste lid bedoelde Ministers kunnen de VROM-raad verzoeken advies uit te brengen over het ontwerp.
      De raad brengt zijn advies uit binnen een door Onze bedoelde Ministers te bepalen termijn, die ten hoogste twaalf
      weken na de in het tweede lid, onder c, bedoelde termijn beloopt.

      4 Onze in het eerste lid bedoelde Ministers zenden het ontwerp gelijktijdig met de terinzagelegging aan de Staten-
      Generaal.

      5 Het plan wordt uiterlijk negen maanden na de terinzagelegging aan de instemming van de Tweede Kamer der Staten-
      Generaal onderworpen. De motivering van het plan vermeldt in elk geval op welke wijze door de Ministerraad bij
      de vaststelling van het plan rekening is gehouden met overeenkomstig [artikel 3:15][ref3] naar voren gebrachte
      zienswijzen, uitkomsten van bestuurlijk overleg en het advies, bedoeld in het derde lid.

      6 Alvorens omtrent instemming te besluiten stelt de Tweede Kamer Onze in het eerste lid bedoelde Ministers in
      de gelegenheid het plan te wijzigen. De Tweede Kamer zendt het plan, voor zover zij daarmee heeft ingestemd,
      onverwijld naar de Eerste Kamer. De Eerste Kamer besluit tot verlening of tot onthouding van instemming met het
      plan, zoals het daar ligt. De Eerste Kamer wordt geacht te hebben ingestemd met het plan, indien zij niet binnen
      vier weken na ontvangst van het plan uitdrukkelijk tot behandeling ervan besluit.

      7 De bekendmaking van het plan waarmee beide Kamers hebben ingestemd geschiedt door terinzagelegging op door Onze
      in het eerste lid bedoelde Ministers te bepalen plaatsen. De [artikelen 3:11, eerste, tweede en derde lid][ref4],
      en [3:12, eerste en tweede lid, en derde lid, onderdeel a, van de Algemene wet bestuursrecht][ref5] zijn van
      overeenkomstige toepassing.

      8 Het plan treedt in werking met ingang van de dag volgende op die waarop het overeenkomstig het zevende lid ter
      inzage is gelegd.


