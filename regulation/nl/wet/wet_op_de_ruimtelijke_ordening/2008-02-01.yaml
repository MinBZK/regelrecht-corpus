  - number: '7'
    text: |-
      1 De gemeenteraad kan voor het grondgebied van de gemeente een structuurplan vaststellen, waarin de toekomstige
      ontwikkeling van de gemeente wordt aangegeven.

      2 De gemeenteraad kan in samenwerking met de raden van aangrenzende gemeenten voor het gebied van de betrokken
      gemeenten een structuurplan vaststellen, waarin de toekomstige ontwikkeling van die gemeenten wordt aangegeven.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel7
  - number: '8'
    text: |-
      Op de voorbereiding van het structuurplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing,
      met dien verstande dat:

      a. burgemeester en wethouders de kennisgeving, bedoeld in [artikel 3:12 van die wet][ref2], tevens in de
      Staatscourant plaatsen;

      b. zienswijzen naar voren kunnen worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel312
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel8
