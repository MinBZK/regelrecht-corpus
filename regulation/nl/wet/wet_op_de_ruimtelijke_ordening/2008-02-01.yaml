  - number: 4b
    text: |-
      1 Voor zover in het streekplan een concrete beleidsbeslissing is opgenomen kan Onze Minister binnen vier weken
      na de toezending van het afschrift van het besluit tot vaststelling van het streekplan provinciale staten
      schriftelijk mededelen dat hij overweegt ten aanzien van die concrete beleidsbeslissing toepassing te geven aan
      [artikel 6][ref1].

      2 Onze Minister geeft slechts toepassing aan het eerste lid, indien hij op grond van
      [artikel 4a, derde of vierde lid][ref2], zienswijzen over die concrete beleidsbeslissing naar voren heeft gebracht
      wegens kennelijke strijd met het nationaal ruimtelijk beleid.

      3 Indien Onze Minister geen toepassing geeft aan het eerste lid, wordt het besluit tot vaststelling van het
      streekplan met ingang van de zesde week na de dagtekening daarvan bekendgemaakt door dit besluit samen met
      het vastgestelde streekplan voor een ieder ter inzage te leggen op het provinciehuis en ter secretarie van
      de gemeenten op wier gebied het betrekking heeft. De artikelen [3:11, eerste, tweede en derde lid][ref3],
      en [3:12, eerste en derde lid, onderdeel a, van de Algemene wet bestuursrecht][ref4] alsmede
      [artikel 4a, derde lid, onderdeel b][ref5], zijn van overeenkomstige toepassing.

      4 Indien Onze Minister toepassing geeft aan het eerste lid, zendt hij gelijktijdig een afschrift van zijn
      mededeling aan de Rijksplanologische Commissie, aan gedeputeerde staten en aan de inspecteur.

      5 Binnen twaalf weken na dagtekening van de in het eerste lid bedoelde mededeling beslist Onze Minister omtrent
      toepassing van [artikel 6][ref6].

      6 Onze Minister maakt zijn besluit binnen een week na dagtekening daarvan bekend aan provinciale staten. Indien
      Onze Minister niet heeft beslist binnen de in het vijfde lid bedoelde termijn, wordt het besluit van Onze Minister
      vervangen door een schriftelijke mededeling van dat feit.

      7 Het besluit van Onze Minister of de mededeling, bedoeld in het zesde lid, wordt met het vaststellingsbesluit van
      provinciale staten en het vastgestelde streekplan door gedeputeerde staten bekendgemaakt door terinzagelegging voor
      een ieder op het provinciehuis en ter secretarie van de gemeenten op wier gebied het betrekking heeft.

      8 Indien het besluit van Onze Minister strekt tot toepassing van [artikel 6][ref7] blijft voor wat betreft het
      daarbij aangegeven gebied, het besluit van provinciale staten tot vaststelling van het streekplan buiten werking.


