  - number: '30'
    text: |-
      1 Indien door gedeputeerde staten of, in een geval als bedoeld in [artikel 29, achtste lid][ref1], door Onze
      Minister goedkeuring aan een vastgesteld bestemmingsplan is onthouden, stelt de gemeenteraad binnen een jaar
      met ingang van de dag na die, waarop de beroepstermijn bedoeld in [artikel 56a, onder b of c][ref2], afloopt of,
      indien binnen de beroepstermijn bij de voorzitter van de Afdeling bestuursrechtspraak van de Raad van State een
      verzoek om voorlopige voorziening is gedaan, dat verzoek is afgewezen, een nieuw plan vast, waarbij het besluit van
      gedeputeerde staten, dan wel van Onze Minister in acht wordt genomen.

      2 Gedeputeerde staten kunnen of, in een geval als bedoeld in [artikel 29, achtste lid][ref3], Onze Minister kan
      de termijn tot vaststelling van een nieuw plan op verzoek van burgemeester en wethouders met zes maanden verlengen
      of bij het besluit inzake goedkeuring die termijn door een andere vervangen, dan wel bepalen dat geen nieuw plan
      behoeft te worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel56a
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel29
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '29'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: 56a
        hoofdstuk: IXA
      - id: ref3
        bwb_id: BWBR0002375
        artikel: '29'
        hoofdstuk: IV
        afdeling: '3'
  - number: '31'
    text: |-
      Het bestemmingsplan ligt, nadat de goedkeuring onherroepelijk is geworden, voor een ieder ter inzage ter
      gemeentesecretarie. [Artikel 23, eerste lid, onder a][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel23
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '23'
        hoofdstuk: IV
        afdeling: '3'
  - number: 31a
    text: |-
      1 Indien ten behoeve van belangen, uitsluitend of mede behartigd door andere openbare lichamen dan de gemeente,
      op schriftelijk verzoek van die openbare lichamen, dan wel krachtens wettelijk voorschrift bepalingen in een
      bestemmingsplan zijn opgenomen die hogere kosten voor de gemeente ten gevolge kunnen hebben en blijkens de bij het
      bestemmingsplan behorende toelichting over de verdeling van deze kosten geen overeenstemming kon worden bereikt,
      kan de gemeenteraad binnen de termijn, bedoeld in [artikel 28, eerste lid][ref1], gedeputeerde staten verzoeken
      gelijktijdig met hun besluit omtrent goedkeuring van het vastgestelde plan te beslissen omtrent het opleggen van
      de verplichting aan die openbare lichamen de hogere kosten, welke redelijkerwijs niet of niet geheel ten laste van
      de gemeente behoren te blijven en waarvan de vergoeding niet of niet voldoende anderszins is verzekerd en evenmin
      krachtens wettelijk voorschrift is uitgesloten, geheel of gedeeltelijk aan de gemeente te vergoeden.

      2 Indien ten tijde van het vaststellen van het bestemmingsplan de hogere kosten, bedoeld in het eerste lid,
      in redelijkheid niet waren te voorzien kunnen gedeputeerde staten, in afwijking van het eerste lid, op een
      desbetreffend verzoek van de gemeente beslissen nadat het bestemmingsplan in werking is getreden. Burgemeester en
      wethouders vermelden in hun verzoek uitdrukkelijk waarom over de verdeling van de hogere kosten tussen de gemeente
      en de desbetreffende openbare lichamen geen overeenstemming kon worden bereikt.

      3 In afwijking van het eerste en het tweede lid beslist Onze Minister dan wel beslissen Onze Minister en Onze
      Minister die het mede aangaat omtrent een verzoek als bedoeld in die leden, indien het andere openbaar lichaam het
      Rijk is. In een geval als bedoeld in het eerste lid beslissen Onze Minister en Onze Minister die het mede aangaat,
      zodra de desbetreffende bepalingen van het bestemmingsplan in werking zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel28
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel31a
