  - number: '48'
    text: |-
      Burgemeester en wethouders kunnen een aanlegvergunning intrekken:

      a. indien blijkt dat de vergunning ten gevolge van een onjuiste of onvolledige opgave is verleend;

      b. indien binnen een in de vergunning te bepalen termijn na de dagtekening van de vergunning geen begin met de
      werkzaamheden is gemaakt;

      c. indien de werkzaamheden langer dan een in de vergunning te bepalen termijn zijn gestaakt.
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel48
  - number: 48a
    text: |-
      1 Voorzover blijkt dat een belanghebbende ten gevolge van een onherroepelijk rijksprojectbesluit schade lijdt
      of zal lijden, die redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven, en ten aanzien waarvan
      de vergoeding niet of niet voldoende door aankoop, onteigening of op andere wijze is verzekerd, kent Onze
      projectminister hem op zijn verzoek een naar billijkheid te bepalen schadevergoeding toe.

      2 [Artikel 49][ref1] blijft buiten toepassing voor zover de belanghebbende met betrekking tot de schade een beroep
      doet of kan doen op een schadevergoeding als bedoeld in het eerste lid.

      3 Onze projectminister kan nadere regels geven omtrent de indiening en afhandeling van een verzoek om
      schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel49
    url: https://wetten.overheid.nl/BWBR0002375/2008-02-01#Artikel48a
