      - id: ref2
        bwb_id: BWBR0005537
        artikel: 3:12
  - number: '9'
    text: |-
      De vaststelling van het structuurplan wordt bekendgemaakt door het besluit tot
      vaststelling samen met het structuurplan voor een ieder ter inzage te leggen ter
      gemeentesecretarie. De [artikelen 3:11, eerste, tweede en derde lid][ref1], en
      [3:12, eerste en tweede lid, en derde lid, onderdeel a, van de Algemene wet bestuursrecht][ref2] alsmede
      [artikel 8, onderdeel a][ref3], zijn van overeenkomstige toepassing. Tegelijkertijd met de bekendmaking wordt van
      het structuurplan mededeling gedaan aan gedeputeerde staten en aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel311
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel312
