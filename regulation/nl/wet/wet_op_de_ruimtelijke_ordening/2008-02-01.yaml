    text: |-
      1 Indien voor de uitvoering van een project een op aanvraag te nemen besluit van een bestuursorgaan is vereist,
      zendt het bestuursorgaan onverwijld na de ontvangst van de aanvraag een afschrift daarvan aan Onze projectminister.

      2 Met betrekking tot een verzoek om vrijstelling van een geldend bestemmingsplan krachtens [artikel 19][ref1] is
      een verklaring van geen bezwaar als bedoeld in [dat artikel][ref2] niet vereist.


