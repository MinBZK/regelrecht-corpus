  - number: '49'
    text: |-
      1 Voor zover blijkt dat een belanghebbende ten gevolge van:

      a. de bepalingen van een bestemmingsplan,

      b. het besluit omtrent vrijstelling, als bedoeld in de [artikelen 17][ref1] of [19][ref2],

      c. het besluit tot het verlenen van vrijstelling ingevolge [artikel 40][ref3], of van een vergunning of andere
      beschikking ingevolge [artikel 41][ref4],

      d. de aanhouding van het besluit omtrent het verlenen van een bouw- of aanlegvergunning ingevolge
      [artikel 50, eerste lid, van de Woningwet][ref5] dan wel ingevolge [artikel 46, tweede lid][ref6],

      e. aanwijzingen als bedoeld in [artikel 37, tweede of vijfde lid][ref7],

      f. het koninklijk besluit als bedoeld in [artikel 66][ref8],

      schade lijdt of zal lijden, welke redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven en waarvan
      de vergoeding niet of niet voldoende door aankoop, onteigening of anderszins is verzekerd kennen burgemeester en
      wethouders hem op aanvraag een naar billijkheid te bepalen schadevergoeding toe.

      2 Een aanvraag om vergoeding van schade als bedoeld in het eerste lid, onder a, b, c, of f, moet worden ingediend
      binnen vijf jaar nadat de desbetreffende bepaling van het bestemmingsplan onderscheidenlijk het desbetreffende
      besluit onherroepelijk is geworden. Ingeval van schade ten gevolge van een aanhouding bedoeld onder d of van een
      aanwijzing onder e, kan de aanvraag om schadevergoeding eerst worden ingediend na de terinzagelegging van het
      vastgestelde bestemmingsplan, doch niet later dan vijf jaar nadat dat bestemmingsplan onherroepelijk is geworden.

      3 Van de aanvrager heffen burgemeester en wethouders een recht ten bedrage van € 300, welk bedrag bij verordening
      van de gemeenteraad met ten hoogste twee derde deel kan worden verhoogd of verlaagd. Zij wijzen hem op de
      verschuldigdheid van het recht en delen hem mede dat het verschuldigde bedrag binnen vier weken na de dag
      van verzending van de mededeling op de rekening van de gemeente dan wel op een aangegeven plaats moet zijn
      gestort. Indien het bedrag niet binnen deze termijn is bijgeschreven of gestort verklaren zij de aanvrager niet
      ontvankelijk, tenzij redelijkerwijs niet kan worden geoordeeld dat aanvrager in verzuim is geweest. Indien op
      de aanvraag geheel of gedeeltelijk positief wordt beslist, storten burgemeester en wethouders het betaalde recht
      terug.

      4 Het in het derde lid genoemde bedrag kan bij algemene maatregel van bestuur worden gewijzigd voor zover het
      prijsindexcijfer voor de gezinsconsumptie daartoe aanleiding geeft.


