  - number: 56a
    text: |-
      In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref1] vangt de beroepstermijn aan:

      a. in een geval als bedoeld in [artikel 54, tweede lid, onder b][ref2], met ingang van de dag van terinzagelegging
      van het besluit omtrent goedkeuring overeenkomstig [artikel 11, vijfde lid][ref3];

      b. in een geval als bedoeld in [artikel 54, tweede lid, onder d][ref4], met ingang van de dag van terinzagelegging
      van het besluit omtrent goedkeuring overeenkomstig [artikel 28, zesde lid][ref5] of [artikel 29, derde lid][ref6];

      c. in een geval als bedoeld in [artikel 54, tweede lid, onder e][ref7], met ingang van de dag van terinzagelegging
      van het besluit van Onze Minister overeenkomstig [artikel 29, zevende lid][ref8];

      d. in een geval als bedoeld in [artikel 54, tweede lid, onder f][ref9], met ingang van de dag van terinzagelegging
      van het besluit van gedeputeerde staten overeenkomstig [artikel 28, zesde lid][ref10];

      e. in een geval als bedoeld in [artikel 56, tweede lid, onder b][ref11], met ingang van de dag na die waarop de
      beschikking waarop de aanwijzing betrekking heeft, is gegeven;

      f. voor beroepen tegen een of meer concrete beleidsbeslissingen of een herziening daarvan, in een
      planologische kernbeslissing die de grondslag vormt voor een rijksprojectbesluit of voor een besluit als
      bedoeld in [artikel 39j, eerste lid][ref12], met ingang van de dag waarop beroep kan worden ingesteld
      tegen het rijksprojectbesluit of de herziening daarvan dan wel tegen een besluit als bedoeld in
      [artikel 39j, eerste lid][ref13], met dien verstande dat indien niet binnen een jaar na het van kracht worden van
      de planologische kernbeslissing of de herziening daarvan een daarop berustend rijksprojectbesluit onderscheidenlijk
      een besluit als bedoeld in [artikel 39j, eerste lid][ref14], is bekendgemaakt, de beroepstermijn aanvangt met
      ingang van de dag waarop dat jaar is verstreken;

      g. voor een beroep tegen een rijksprojectbesluit dat de grondslag vormt voor een besluit als bedoeld in
      [artikel 39j, eerste lid][ref15], met ingang van de dag waarop beroep kan worden ingesteld tegen een besluit als
      bedoeld in [artikel 39j, eerste lid][ref16], met dien verstande dat indien niet binnen een jaar na het van kracht
      worden van het rijksprojectbesluit een daarop berustend besluit als bedoeld in [artikel 39j, eerste lid][ref17],
      is bekendgemaakt, de beroepstermijn aanvangt met ingang van de dag waarop dat jaar is verstreken; dit onderdeel is
      niet van toepassing in gevallen als bedoeld in onderdeel f.


