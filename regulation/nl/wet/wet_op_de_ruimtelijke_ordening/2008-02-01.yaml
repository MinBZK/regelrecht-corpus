    text: |-
      1 Projecten waarop krachtens [artikel 39a][ref1] de [paragrafen 2][ref2] en [3][ref3] dan wel een van die
      paragrafen van toepassing zijn, worden voor de toepasssing van de [Belemmeringenwet Privaatrecht][ref4] aangemerkt
      als openbare werken van algemeen nut.

      2 Indien voor de uitvoering van een of meer besluiten als bedoeld in [artikel 39j, eerste lid][ref5], toepassing
      van de [Belemmeringenwet Privaatrecht][ref6] noodzakelijk is:

      a. kan Onze Minister in afwijking van [artikel 2, vierde lid, van de Belemmeringenwet Privaatrecht][ref7]:

      1°. een andere plaats of gemeente aanwijzen waar de zitting plaatsvindt;

      2°. bepalen dat de zitting wordt geleid door een door Onze Minister van Verkeer en Waterstaat aan te wijzen
      persoon;

      b. worden in afwijking van de [artikelen 2, vijfde lid][ref8], en
      [3, tweede lid, van de Belemmeringenwet Privaatrecht][ref9] gedeputeerde staten niet gehoord;

      c. geldt in plaats van [artikel 4 van de Belemmeringenwet Privaatrecht][ref10] dat:

      1°. tegen een besluit als bedoeld in [artikel 2, vijfde lid][ref11], of [artikel 3, tweede lid, van die wet][ref12]
      een belanghebbende beroep kan instellen bij de Afdeling bestuursrechtspraak van de Raad van State;

      2°. [artikel 7:1 van de Algemene wet bestuursrecht][ref13] niet van toepassing is;

      3°. de werking van een besluit als bedoeld in [artikel 2, vijfde lid][ref14], of
      [artikel 3, tweede lid, van de Belemmeringenwet Privaatrecht][ref15] opgeschort wordt totdat de termijn voor het
      indienen van een beroepschrift is verstreken.


