preamble:
  text: |-
    Gelet op de artikelen 3 en 4 van de Kaderwet subsidies Verkeer en Waterstaat,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *Minister:*


              Minister van Verkeer en Waterstaat;



            b

              *overslagterminal:*


              samenhangend geheel van op Nederlands grondgebied gelegen voorzieningen die hoofdzakelijk zijn bestemd en
      worden gebruikt voor de overslag van goederen van de ene naar een andere vervoersmodaliteit;



            c

              *intermodaal vervoer:*


              vervoer van goederen in één en dezelfde laadeenheid door middel van meer dan één vervoersmodaliteit;



            d

              *multimodaal vervoer:*


              vervoer van goederen door middel van meer dan één vervoersmodaliteit;



            e

              *private rechtspersoon:*


              een rechtspersoon die in Nederland is gevestigd of in Nederland een nevenvestiging heeft in de zin van
      [artikel 3, eerste lid, van de Handelsregisterwet 1996][ref1], met dien verstande dat de beslissende zeggenschap
      over die rechtspersoon, alsmede het uiteindelijk gerechtigd zijn tot de inkomsten berust bij particuliere personen,
      onderscheidenlijk bij andere rechtspersonen dan een overheidslichaam als bedoeld in artikel 1, eerste en tweede
      lid, van Boek 2 van het Burgerlijk Wetboek;



            f

              *overslagbedrijf:*


              private rechtspersoon die activiteiten verricht of twee of meer private rechtspersonen die activiteiten
      verrichten, welke activiteiten geheel of gedeeltelijk bestaan of zullen bestaan uit het exploiteren of doen
      exploiteren van één of meer overslagterminals;



            g

              *project:*


              het investeringsproject waarop de subsidie-aanvraag betrekking heeft;



            h

              *initiële investeringen:*


              investeringen die betrekking hebben op de realisering van een nieuwe overslagterminal voorzover die
      noodzakelijk zijn om de terminal te laten functioneren;



            i

              *uitbreidingsinvesteringen:*


              investeringen die betrekking hebben op de uitbreiding van de capaciteit van bestaande overslagterminals tot
      het door de aanvrager gewenste en met intentieverklaringen onderbouwde niveau;



            j

              *subsidie:*


              subsidie voor een investering, bedoeld in [artikel 2 van het Besluit Infrastructuurfonds][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Artikel2
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006264
        artikel: '2'
  - number: '2.1'
    text: |-
      Op aanvraag van een overslagbedrijf kan de Minister ter bevordering van het gebruik van intermodaal en multimodaal
      vervoer subsidie verlenen ten behoeve van initiële of uitbreidingsinvesteringen van een overslagterminal. De
      subsidie kan worden verleend voor zowel investeringen in infrastructuur als in vaste en mobiele uitrusting die
      nodig is voor de overslag van goederen.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: '2.2'
    text: 'De subsidie wordt slechts verleend indien:'
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: 2.2.a
    text: het overslagbedrijf een onderneming is die primair gericht is op het maken van winst;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: 2.2.b
    text: is aangetoond dat de continuïteit van het overslagbedrijf voldoende is gewaarborgd, en
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: 2.2.c
    text: |-
      de met de overslagterminal gemoeide totale projectkosten, bedoeld in [artikel 3][ref1], voor ten minste 50% door
      private rechtspersonen risicodragend worden gefinancierd.


      [ref1]: https://wetten.overheid.nl/BWBR0011721#Artikel3
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011721
        artikel: '3'
  - number: '2.3'
    text: 'De subsidie wordt slechts verleend indien de overslagterminal waarop het project betrekking heeft:'
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: 2.3.a
    text: niet gelegen is in het beheersgebied van een zeehaven;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: 2.3.b
    text: |-
      niet gelegen is binnen het samenwerkingsgebied Arnhem-Nijmegen, bedoeld in
      [artikel 1 van de Kaderwet bestuur in verandering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel1
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006620
        artikel: '1'
  - number: 2.3.c
    text: |-
      bestemd is en gebruikt wordt voor de overslag van goederen van andere partijen dan het overslagbedrijf of, indien
      dit een andere onderneming is, de exploitant van de overslagterminal;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: 2.3.d
    text: |-
      voldoende capaciteit heeft om de overslagvolumes die voor de eerste vijf jaren zijn geraamd, te kunnen verwerken
      zonder dat aanvullende investeringen nodig zijn;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: 2.3.e
    text: |-
      in een periode van een jaar na de ingebruikneming van (de uitbreiding van) de terminal uitsluitend nieuw
      intermodaal of multimodaal vervoer aantrekt;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: 2.3.f
    text: binnen vijf jaar kostendekkend geëxploiteerd kan worden;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: 2.3.g
    text: voldoende ontsloten is voor aanvoer en afvoer van goederen;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: 2.3.h
    text: |-
      goederen overslaat waarvoor geldt dat het overgrote deel van het totale transport van deze goederen niet over de
      weg gaat, en
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: 2.3.i
    text: |-
      zodanig gelegen is dat er in de onmiddellijke nabijheid voldoende mogelijkheden voor capaciteitsuitbreiding
      aanwezig zijn voor de geraamde overslagactiviteiten en de daarmee samenhangende bedrijfsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: '2.4'
    text: 'De subsidie wordt voorts slechts verleend indien:'
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: 2.4.a
    text: |-
      in een periode van vijf jaar na de ingebruikneming van de (uitbreiding van de) terminal niet met behulp van de
      subsidie enige prijsconcurrentie met andere terminals wordt bedreven;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: 2.4.b
    text: |-
      op het tijdstip waarop de aanvraag is ontvangen de uitvoering van het project niet reeds geheel of gedeeltelijk is
      gestart of gestaakt dan wel reeds is voltooid, en
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: 2.4.c
    text: |-
      naar verwachting binnen drie maanden na de datum van de subsidieverlening uitvoeringsgereed zal zijn in die zin dat
      de financiering van het project is verzekerd.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het subsidieplafond dat per jaar voor het verlenen van subsidies ingevolge deze regeling beschikbaar is, is gelijk
      aan het bedrag dat in de begroting van het Ministerie van Verkeer en Waterstaat voor dat desbetreffende jaar
      daarvoor op artikel IF 04.03 van het Infrastructuurfonds beschikbaar wordt gesteld, rekening houdend met uitgaven
      betreffende in eerdere jaren verleende subsidies.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      De subsidie voor een project bedraagt ten hoogste 50% van de subsidiabele onderdelen van het project tot ten
      hoogste 25% van de totale projectkosten, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
  - number: 3.2.a
    text: |-
      indien uit anderen hoofde dan deze regeling financiële steun is verleend dan wel aanspraak daarop bestaat, de
      subsidie op grond van deze regeling zodanig wordt verlaagd dat het totaal van alle verstrekte subsidies voor
      initiële of uitbreidingsinvesteringen niet meer dan 50% van de totale projectkosten bedraagt;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
  - number: 3.2.b
    text: de verleende subsidie per project niet hoger is dan € 2.268.901, en
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
  - number: 3.2.c
    text: |-
      voor de vaststelling van de totale projectkosten alle kosten, die betrekking hebben op de verwezenlijking of de
      uitbreiding van de terminal waarop het project betrekking heeft, in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
  - number: '3.3'
    text: |-
      Tot de totale projectkosten, bedoeld in het tweede lid, behoren de kosten, bedoeld in
      [artikel 5, eerste lid, van het Besluit Infrastructuurfonds][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel5
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '5'
  - number: '3.4'
    text: 'Tot de subsidiabele onderdelen van het project, bedoeld in het tweede lid, behoren:'
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
  - number: 3.4.a
    text: materialen;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
  - number: 3.4.b
    text: werkzaamheden voor de aanleg van vast en mobiel materieel voor overslag;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
  - number: 3.4.c
    text: |-
      de krachtens de [Wet op de Omzetbelasting 1968][ref1] verschuldigde belasting voorzover die niet kan worden
      teruggevorderd;


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 3.4.d
    text: bouwrente;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
  - number: 3.4.e
    text: studies voor het project voor zover de Minister die aanvaardbaar acht;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
  - number: 3.4.f
    text: vergunningen en leges voor zover de Minister die aanvaardbaar acht, en
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
  - number: 3.4.g
    text: |-
      kosten van voorbereiding, administratie en toezicht tot een maximum van 16% van de kosten, bedoeld in de onderdelen
      a en b van dit lid.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
  - number: '3.5'
    text: |-
      De bouwrente, bedoeld in het vierde lid, onderdeel e, is gelijk aan de rente van de meest recente openbare
      staatslening op het moment van gunning van het werk.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
  - number: '3.6'
    text: |-
      De kosten van de subsidiabele onderdelen van het project, bedoeld in het vierde lid, worden slechts voorzover zij
      aantoonbaar betrekking hebben op het project, en voorzover zij in redelijkheid noodzakelijk zijn, in aanmerking
      genomen.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      Een aanvraag als bedoeld in artikel 2, eerste lid, wordt vóór 1 januari 2004 ingediend bij de Minister van Verkeer
      en Waterstaat door tussenkomst van de directeur Algemeen Beleid van het Directoraat-Generaal Goederenvervoer.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: '4.2'
    text: 'Bij de aanvraag worden in elk geval gevoegd:'
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: 4.2.a
    text: |-
      de gegevens van de aanvrager (naam, adres, plaats van de aanvrager, dagtekening en vermelding van de
      subsidieregeling waar aanspraak op wordt gemaakt);
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: 4.2.b
    text: een overzicht van de werkzaamheden betreffende het project;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: 4.2.c
    text: een overzicht van de kosten van het project, gespecificeerd per projectonderdeel, en
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: 4.2.d
    text: stukken waaruit blijkt dat aan de vereisten van artikel 2 wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: '4.3'
    text: 'Voorts worden bij de aanvraag in elk geval gevoegd:'
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: 4.3.a
    text: |-
      een recent uittreksel van de inschrijving van het overslagbedrijf, en in voorkomend geval, die van de exploitant
      van de overslagterminal, in het Handelsregister, en
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: 4.3.b
    text: 'een bedrijfsplan, dat in elk geval de volgende onderdelen bevat:'
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: 4.3.b.(i)
    text: |-
      tekeningen van het project en de ruimtelijke situatie van de plaats waar het project wordt uitgevoerd, waarbij de
      mogelijkheden tot uitbreiding en de ontsluiting zijn aangegeven;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: 4.3.b.(ii)
    text: |-
      een marktanalyse, waarin in elk geval is opgenomen een raming van de overslagvolumes over de eerste vijf jaren,
      zoals bedoeld in artikel 2, vierde lid, onderdeel d, onderbouwd met intentieverklaringen van klanten en potentiële
      klanten;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: 4.3.b.(iii)
    text: een marketingplan waarin een concurrentieanalyse is opgenomen;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: 4.3.b.(iv)
    text: een investeringsplan, met inbegrip van een tijdsplanning van de investeringsuitgaven;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: 4.3.b.(v)
    text: een financieringsplan;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: 4.3.b.(vi)
    text: |-
      schema's van de ondernemingsstructuur van het overslagbedrijf en, indien dit een andere onderneming is, van de
      exploitant van de overslagterminal;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: 4.3.b.(vii)
    text: de exploitatiebegroting, en
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: 4.3.b.(viii)
    text: |-
      een opgave van de stand van zaken met betrekking tot de voor de uitvoering van het project noodzakelijke wettelijke
      procedures.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel4
  - number: '5.1'
    text: De Minister beslist binnen zes maanden na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      Zowel de beoordeling van de aanvragen als de verlening van subsidies tot het subsidieplafond, bedoeld in
      [artikel 3, eerste lid][ref1], vinden plaats in volgorde van ontvangst van de aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011721#Artikel3
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011721
        artikel: '3'
  - number: '6.1'
    text: |-
      Onverminderd de [artikelen 4:25][ref1] en [4:35 van de Algemene wet bestuursrecht][ref2] kan de subsidieverlening
      worden geweigerd indien niet wordt voldaan aan de vereisten, bedoeld in [artikel 2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011721#Artikel2
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0011721
        artikel: '2'
  - number: '6.2'
    text: 'Indien er op enige datum:'
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel6
  - number: 6.2.a
    text: |-
      een aanvraag wordt ontvangen en het bedrag waarvoor subsidie verleend zou worden hoger is dan het op die datum
      resterende gedeelte van het budget tot het subsidieplafond, wordt de aanvraag afgewezen, of
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel6
  - number: 6.2.b
    text: |-
      meer dan één aanvraag wordt ontvangen en de som van de bedragen waarvoor subsidie verleend zou worden hoger is dan
      het op die datum resterende gedeelte van het budget tot het subsidieplafond, worden de aanvragen afgewezen.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel6
  - number: '7.1'
    text: 'De beschikking tot subsidieverlening vermeldt in elk geval:'
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel7
  - number: 7.1.a
    text: de onderdelen van het project die in overeenstemming met deze regeling als subsidiabel worden aangemerkt;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel7
  - number: 7.1.b
    text: de totale projectkosten, en
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel7
  - number: 7.1.c
    text: het maximale subsidiebedrag en de wijze waarop dit berekend is.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel7
  - number: '7.2'
    text: Bij de beschikking tot subsidieverlening wordt het ritme van uitbetaling van de subsidie vermeld.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel7
  - number: '7.3'
    text: |-
      Bij de beschikking tot subsidieverlening kan bepaald worden dat een daarbij aan te geven bedrag bij wijze van
      voorschot uitbetaald wordt. [Artikel 13, tweede, derde en zesde lid, van het Besluit Infrastructuurfonds][ref1]
      zijn van overeenkomstige toepassing op de voorschotverstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel13
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006264
        artikel: '13'
  - number: '7.4'
    text: |-
      Het in het derde lid bedoelde voorschot wordt verleend op basis van in te dienen declaraties die zijn afgestemd op
      de gerealiseerde en geplande voortgang van de projectwerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel7
  - number: '7.5'
    text: |-
      Bij de beschikking tot subsidieverlening kunnen bijzondere verplichtingen worden opgelegd in verband met de
      specifieke omstandigheden van de exploitatie van de terminal.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel7
  - number: '8.1'
    text: |-
      Behoudens een afwijkende beslissing van de Minister op een schriftelijke, gemotiveerde aanvraag van de subsidie-
      ontvanger, vangt deze binnen één jaar na de subsidieverlening met de uitvoering van het project aan.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      De subsidie-ontvanger vangt niet met de daadwerkelijke bouw van het project aan alvorens de daarvoor benodigde
      vergunningen zijn verleend en overgelegd aan de Minister.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel8
  - number: '8.3'
    text: |-
      De subsidie-ontvanger doet de diensten van de overslagterminal op non-discriminatoire basis en tegen marktconforme
      tarieven toegankelijk zijn voor elke vervoerder of verlader die van de diensten gebruik wil maken.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel8
  - number: '8.4'
    text: |-
      De subsidie-ontvanger die een wijziging aanbrengt in het project of afziet van de uitvoering van het project of een
      onderdeel daarvan, deelt dit onverwijld mede aan de Minister.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel8
  - number: '8.5'
    text: |-
      Onverminderd het bepaalde in het vierde lid overlegt de subsidie-ontvanger, indien de uitvoering van het project
      een looptijd van langer dan achttien maanden heeft, jaarlijks binnen twee maanden na afloop van het kalenderjaar
      een voortgangsrapportage aan de Minister, waarin zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel8
  - number: 8.5.a
    text: |-
      een beschrijving van de in het desbetreffende kalenderjaar uitgevoerde activiteiten en de per activiteit gedane
      uitgaven;
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel8
  - number: 8.5.b
    text: een planning van de in het kader van het project nog uit te voeren activiteiten, en
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel8
  - number: 8.5.c
    text: de nog te verwachten uitgaven.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel8
  - number: '8.6'
    text: |-
      Onverminderd het bepaalde in het vierde en het vijfde lid dient de subsidie-aanvrager binnen vier maanden na
      voltooiing van het project bij de Minister een verzoek tot subsidievaststelling in. Dit verzoek gaat vergezeld van
      een financiële verantwoording over de uitvoering van het totale project. Deze verantwoording is voorzien van een
      verklaring van een onafhankelijke registeraccountant of accountant-administratieconsulent. Deze verklaring wordt
      opgesteld aan de hand van het bij de beschikking tot subsidieverlening gevoegde controle-protocol.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      Binnen acht weken nadat de subsidie-ontvanger de gegevens, bedoeld in [artikel 8, vijfde lid][ref1], heeft
      overgelegd, wordt het bedrag van de subsidie vastgesteld overeenkomstig het tweede tot en met het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011721#Artikel8
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011721
        artikel: '8'
  - number: '9.2'
    text: |-
      Indien uit de gegevens, bedoeld in het eerste lid, blijkt dat de werkelijke kosten van de subsidiabele onderdelen
      van het project of de totale projectkosten lager zijn dan was vermeld in de beschikking tot subsidieverlening,
      wordt het in de beschikking tot subsidieverlening vermelde maximale subsidiebedrag zodanig verlaagd dat de subsidie
      bestaat uit een vergoeding van ten hoogste 50% van de werkelijke kosten van de subsidiabele onderdelen van het
      project tot een maximum van 25% van de werkelijke projectkosten.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien het vastgestelde subsidiebedrag hoger is dan hetgeen reeds als voorschot ingevolge
      [artikel 7, derde lid][ref1], is uitbetaald, wordt het meerdere binnen vier weken na de dag waarop de
      subsidievaststelling is bekend gemaakt, uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011721#Artikel7
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011721
        artikel: '7'
  - number: '9.4'
    text: |-
      Indien het vastgestelde subsidiebedrag lager is dan hetgeen reeds als voorschot ingevolge
      [artikel 7, derde lid][ref1], is uitbetaald, betaalt de subsidie-ontvanger op eerste vordering van de Minister
      binnen een daarbij te bepalen termijn het teveel betaalde terug.


      [ref1]: https://wetten.overheid.nl/BWBR0011721#Artikel7
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011721
        artikel: '7'
  - number: '10.1'
    text: |-
      De subsidie-ontvanger draagt zorg voor een administratie die zodanig is ingericht, dat daaruit op elk gewenst
      tijdstip op eenvoudige en duidelijke wijze de aan de exploitatie en de overige activiteiten gerelateerde kosten
      zijn af te leiden.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel10
  - number: '10.2'
    text: |-
      De subsidie-ontvanger verkoopt gedurende vijf jaar na de subsidievaststelling geen van de gesubsidieerde
      projectonderdelen noch delen van de onderneming of de onderneming te wier bate de subsidie is verstrekt zonder
      voorafgaande schriftelijke toestemming van de Minister. Aan deze toestemming kunnen voorschriften worden verbonden
      in het belang van het doel van deze regeling. Tot die voorschriften kan het opleggen van de verplichting tot
      terugbetaling van de subsidie of een deel daarvan behoren.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel10
  - number: '10.3'
    text: |-
      Op verzoek van de Minister verleent de subsidie-ontvanger tussentijds alle medewerking aan een evaluatie-onderzoek,
      bedoeld om te beoordelen in welke mate de verlening van de subsidie heeft bijgedragen aan de door de Minister
      geformuleerde beleidsdoelen.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel10
  - number: '11'
    text: |-
      Indien de subsidie-ontvanger zich niet houdt aan de verplichtingen ingevolge de [Algemene wet bestuursrecht][ref1]
      of deze regeling, betaalt hij op eerste vordering van de Minister binnen een daarbij te bepalen termijn een daarbij
      aan te geven deel of het gehele bedrag van de ontvangen subsidie terug.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '12.1'
    text: |-
      Vóór 31 december 2004 publiceert de Minister een verslag over de doeltreffendheid, de doelmatigheid en de effecten
      van deze regeling in de praktijk.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel12
  - number: '12.2'
    text: |-
      De subsidie-ontvanger verstrekt alle gevraagde informatie die nodig is voor de opstelling van het verslag, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel12
  - number: '13'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel13
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling openbare inland terminals.'
    url: https://wetten.overheid.nl/BWBR0011721/2002-01-01#Artikel14
