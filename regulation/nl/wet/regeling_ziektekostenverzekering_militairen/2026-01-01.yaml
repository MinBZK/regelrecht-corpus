articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *de militair* de militair in werkelijke dienst als bedoeld in
      [artikel 90, eerste lid, van het Algemeen militair ambtenarenreglement][ref1].
        - *heffingsgrondslag* de bezoldiging bedoel in artikel 1, vermeerderd met de eindejaarsuitkering alsmede de
      daarover berekende vakantie-uitkering, met inachtneming van het minimumbedrag van de vakantie-uitkering, tot een
      maximum van € 4.088,– of; indien sprake is van een afwijkende bezoldiging, de afwijkende bezoldiging, vermeerderd
      met de eindejaarsuitkering alsmede de daarover berekende vakantie-uitkering, met inachtneming van het minimumbedrag
      van de vakantie-uitkering, tot een maximum van € 4.088,–.
        - *afwijkende bezoldiging de bezoldiging in geval van:* 1°. ongeoorloofdeafwezigheid; 2°. vermissing; 3°. verlof;
      4°. ziekte; 5°. schorsing, vrijheidsstraf of voorlopige hechtenis.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel90
    url: https://wetten.overheid.nl/BWBR0041348/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '90'
  - number: '2'
    text: |-
      Bij het vaststellen van de premie voor de militair is
      [artikel 3, eerste en tweede lid van het Inkomstenbesluit militairen][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel3
    url: https://wetten.overheid.nl/BWBR0041348/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '3'
  - number: '3'
    text: |-
      De omvang van de geneeskundige zorg van de militair alsmede de procedures met betrekking tot realisering van de
      aanspraak daar op zijn neergelegd in Verzekeringsvoorwaarden Ziektekostenverzekering Krijgsmacht 2026.
    url: https://wetten.overheid.nl/BWBR0041348/2026-01-01#Artikel3
  - number: '4'
    text: Met ingang van 1 januari 2026 bedraagt de door de militair verschuldigde premie 6,40% van de heffingsgrondslag.
    url: https://wetten.overheid.nl/BWBR0041348/2026-01-01#Artikel4
  - number: '5'
    text: |-
      1 De Minister draagt voor 61,72% bij in de door de militair verschuldigde premie. Per 1 januari 2026 is dat 3,95%
      van de heffingsgrondslag. De militair is loonheffing verschuldigd over de werkgeversbijdrage.

      2 Dit percentage wordt herzien indien:

      a. de aanspraken als bedoeld in [artikel 3][ref1] wijziging ondergaan of;

      b. de maximum heffingsgrondslag geen gelijke tred houdt met de loonontwikkeling.


