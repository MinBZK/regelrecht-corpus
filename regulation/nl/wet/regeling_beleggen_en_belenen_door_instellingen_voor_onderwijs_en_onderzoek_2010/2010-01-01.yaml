  - number: '2'
    text: |-
      Instellingen doen jaarlijks in de jaarverslaggeving ten aanzien van de publieke middelen ten minste verslag van:

      a. het beleid en de uitvoering ten aanzien van het beleggen en belenen;

      b. de soorten en omvang van de beleggingen en beleningen;

      c. de looptijden van de beleggingen en beleningen.
    url: https://wetten.overheid.nl/BWBR0026436/2010-01-01#Artikel2
  - number: '3'
    text: |-
      1 Instellingen leggen de hoofdlijnen van de op het beleggen en belenen betrekking hebbende administratieve
      organisatie en interne controle vast, waaronder in ieder geval wordt begrepen de verdeling van taken
      en bevoegdheden, de voor de instelling toegestane beleggings- en beleningsvormen, de bijbehorende
      informatievoorziening minimaal bestaande uit een kasstroomprognose, de verantwoordingsinformatie en de wijze
      waarop onderscheid wordt aangebracht tussen publieke middelen en overige middelen die niet op een adequate wijze
      afgescheiden zijn van de publieke middelen enerzijds en andere middelen anderzijds.

      2 Instellingen beleggen en belenen hun niet voor lopende betalingen benodigde publieke en overige middelen:

      a. in de vorm van waardepapieren waarvoor een solvabiliteitsratio van 0 procent geldt;

      b. al dan niet tegen waardepapieren bij financiële ondernemingen in lidstaten in vormen waarvan de hoofdsom bij
      opname intact is;

      c. bij financiële ondernemingen in lidstaten in de vorm van derivaten.

      3 De ratingeisen voor de beleggings- en beleningsvormen waarbij de hoofdsom bij opname intact is zijn als volgt
      afhankelijk van de looptijd van die vormen:

      a. beleggings- en beleningsvormen voor een periode tot en met drie maanden mogen worden betrokken van financiële
      ondernemingen die aantonen dat ze voor henzelf of voor de door hen uitgegeven waardepapieren beschikken over
      minstens een A-rating, afgegeven door minstens twee ratingbureaus.

      b. beleggings- en beleningsvormen voor een periode van meer dan drie maanden mogen worden betrokken van financiële
      ondernemingen die aantonen dat ze voor henzelf of voor de door hen uitgegeven waardepapieren beschikken over
      minstens een AA-minusrating afgegeven door minstens twee ratingbureaus.

      4 Op derivatenzijn de in het derde lid, onder b, bedoelde ratingeisen van toepassing, tenzij de derivaten zijn
      afgesloten op een gereglementeerde markt in de Europese Economische Ruimte, bedoeld in [Richtlijn 93/22/EEG]
      (31993L0022) van de Raad van 10 mei 1993 betreffende het verrichten van diensten op het gebied van beleggingen in
      effecten bij een in deze Richtlijn bedoelde financiële onderneming. Een wijziging van deze Richtlijn gaat voor de
      toepassing van deze regeling gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering
      moet zijn gegeven.

      5 Het tweede, derde en vierde lid hebben betrekking op beleggingen en beleningen die na de datum van
      inwerkingtreden nieuw worden verworven, respectievelijk gesloten.
    url: https://wetten.overheid.nl/BWBR0026436/2010-01-01#Artikel3
