preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op artikel 148 van de Wet op het primair onderwijs, artikel 143 van de Wet op de expertisecentra, artikel
    99 van de Wet op het voortgezet onderwijs, artikel 2.5.3, tweede lid en artikel 2.5.10 van de Wet educatie en
    beroepsonderwijs, artikel 2.9, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek, en
    artikel 22 van de TNO-wet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0026436/2010-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *derivaat:* contract met betrekking tot een transactie gericht op het beperken van financiële risico’s, waarin
      is bepaald dat het moment waarop deze transactie zal of kan plaatsvinden afhankelijk is van bepaalde voorwaarden
      en dat de waarde van deze transactie afhankelijk is van één of meer onderliggende activa, referentieprijzen of
      indices;
        - *financiële onderneming:* onderneming als bedoeld in de [Wet op het financieel toezicht][ref1] die het bedrijf
      van kredietinstelling mag uitoefenen, beleggingsdiensten mag verlenen, beleggingsinstellingen mag beheren, rechten
      van deelneming in een beleggingsmaatschappij mag aanbieden, of het bedrijf van verzekeraar mag uitoefenen;
        - *instelling:* door de Minister bekostigde onderwijsaanbieder als bedoeld in
      [artikel 1 van de Wet op het primair onderwijs][ref2], [artikel 1][ref3] en
      [artikel 28b van de Wet op de expertisecentra][ref4], [artikel 1 van de Wet op het voortgezet onderwijs][ref5],
      met uitzondering van de onderwijsaanbieders, bedoeld in [titel II, afdeling II van die wet][ref6],
      [artikel 1.1.1 onder b van de Wet educatie en beroepsonderwijs][ref7],
      [artikel 1.8 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref8]
      en [artikel 1, onder c, van de TNO-wet][ref9] en niet aangewezen op grond van
      [artikel 45, eerste of derde lid van de Comptabiliteitswet 2001][ref10];
        - *jaarverslaggeving:* verantwoording van de instelling conform
      [Titel 9 van boek 2 van het Burgerlijk Wetboek][ref11] die minimaal bestaat uit het bestuursverslag en
      de jaarrekening, voor het onderwijs het jaarverslag, de jaarrekening en de overige gegevens, bedoeld in
      [artikel 1 onder c. van de Regeling Jaarverslaggeving Onderwijs][ref12];
        - *kasstroomprognose:* liquiditeitsplanning voor de korte termijn en de financieringsplanning voor de lange
      termijn;
        - *lidstaat:* staat die lid is van de Europese Unie of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte – Noorwegen, IJsland en Liechtenstein – en ten minste beschikt over een
      AA-rating afgegeven door ten minste twee ratingbureaus;
        - *Minister:* Minister van Onderwijs, Cultuur en Wetenschap en voor zover het onderwijs en onderzoek betreft op het
      gebied van de landbouw en de natuurlijke omgeving de Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *overige middelen:* alle gelden waarover een instelling beschikt, niet zijnde publieke middelen en voor zover
      niet op een adequate wijze afgescheiden van de publieke middelen;
        - *publieke middelen:* gelden verkregen ten laste van de rijksbegroting of anderszins uit hoofde van bij of
      krachtens de wet ingestelde heffingen verkregen gelden, alsmede de opbrengsten daarvan, waarover een instelling de
      beschikking heeft gekregen om de wettelijke taak te verrichten;
        - *rating:* taxatie van de kredietwaardigheid van een financiële onderneming of een land;
        - *ratingbureau:* bureau dat de kredietwaardigheid van financiële ondernemingen en landen taxeert;
        - *solvabiliteitsratio:* het in een lidstaat voorgeschreven minimumniveau aansprakelijk vermogen van een financiële
      onderneming tegenover aangehouden naar risicograad gewogen activa;
        - *waardepapieren:* documenten met een geldwaarde, zoals een bewijs van een aandeel of obligatie of een derivaat.


