  - number: 18a
    text: |-
      Een laboratorium waarop [artikel 4a, tweede lid, onderdeel c][ref1], van toepassing is, verstrekt op verzoek van de
      minister het bewijs van accreditatie als bedoeld in het tweede lid, onderdeel c, van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0045052#Artikel4a
