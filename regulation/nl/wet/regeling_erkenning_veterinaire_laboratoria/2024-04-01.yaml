preamble:
  text: |-
    Gelet op Verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad van de Europese Unie van 22 mei 2001
    houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare
    spongiforme encefalopathieën (PbEG L 147), Verordening (EU) nr. 2016/429 van het Europees Parlement en de Raad
    van 9 maart 2016 betreffende overdraagbare dierziekten en tot wijziging en intrekking van bepaalde handelingen
    op het gebied van diergezondheid (diergezondheidsverordening) (PbEU 2016, L 84), Verordening (EU) nr. 2017/625
    van het Europees Parlement en de Raad van 15 maart 2017 betreffende officiële controles en andere officiële
    activiteiten die worden uitgevoerd om de toepassing van de levensmiddelen- en diervoederwetgeving en van de
    voorschriften inzake diergezondheid, dierenwelzijn, plantgezondheid en gewasbeschermingsmiddelen te waarborgen,
    tot wijziging van de Verordeningen (EG) nr. 999/2001, (EG) nr. 396/2005, (EG) nr. 1069/2009, (EG) nr. 1107/2009,
    (EU) nr. 1151/2012, (EU) nr. 652/2014, (EU) 2016/429 en (EU) 2016/2031 van het Europees Parlement en de Raad, de
    Verordeningen (EG) nr. 1/2005 en (EG) nr. 1099/2009 van de Raad en de Richtlijnen 98/58/EG, 1999/74/EG, 2007/43/
    EG, 2008/119/EG en 2008/120/EG van de Raad, en tot intrekking van de Verordeningen (EG) nr. 854/2004 en (EG) nr.
    882/2004 van het Europees Parlement en de Raad, de Richtlijnen 89/608/EEG, 89/662/EEG, 90/425/EEG, 91/496/EEG,
    96/23/EG, 96/93/EG en 97/78/EG van de Raad en Besluit 92/438/EEG van de Raad (Verordening officiële controles)
    (PbEU 2017, L95), Verordening (EU) 2020/689 van de Commissie van 17 december 2019 tot vaststelling van Verordening
    (EU) 2016/429 van het Europees Parlement en de Raad wat betreft regels voor bewaking, uitroeiingsprogramma’s en
    de ziektevrij status voor bepaalde in de lijst opgenomen ziekten en nieuwe ziekten (PbEU 2020, L 174), Verordening
    (EU0 2020/686 van de Commissie van 17 december 2019 tot aanvulling van Verordening (EU) 2016/429 van het Europees
    Parlement en de Raad wat betreft de erkenning van inrichtingen voor levende producten en de traceerbaarheids-
    en diergezondheidsvoorschriften voor verplaatsingen binnen de Unie van levende producten van bepaalde gehouden
    landdieren (PbEI 2020, L 174), Verordening (EU) 2020/688 van de Commissie van 17 december 2019 tot aanvulling van
    Verordening (EU) 2016/429 van het Europees Parlement en de Raad wat betreft de diergezondheidsvoorschriften voor
    verplaatsingen binnen de Unie van landdieren en broedeieren (PbEU 2020, L 174) en de artikelen 7.1, 7.6, 7.8 van
    de Wet dieren, de artikelen 19, 22a en 22b van de Landbouwwet en artikel 4.10 van het Besluit handhaving en overige
    zaken Wet dieren;

    Besluit:

    Artikel
  url: https://wetten.overheid.nl/BWBR0045052/2024-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *niet-gereguleerde dierziekte:* dierziekte die niet voor een soort of groep soorten is opgenomen in de tabel in
      de bijlage bij [verordening (EU) nr. 2018/1882](32018R1882);
        - *NRL:* Nationaal Referentie Laboratorium;
        - *OIE:* World Organisation for Animal Health;
        - *TSE-verordening:* [verordening (EG) nr. 999/2001](32001R0999) van het Europees Parlement en de Raad van de
      Europese Unie van 22 mei 2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing
      van bepaalde overdraagbare spongiforme encefalopathieën (PbEG L 147);
        - *verordening (EG) nr. 2160/2003:* [verordening (EG) nr. 2160/2003](32003R2160) van het Europees Parlement en
      de Raad van 17 november 2003 inzake de bestrijding van salmonella en andere specifieke door voedsel overgedragen
      zoönoseverwekkers (PbEG L 325);
        - *verordening (EU) nr. 200/2010:* verordening (EU) nr. 200/2010 van de Commissie van 10 maart 2010 ter uitvoering
      van [Verordening (EG) nr. 2160/2003](32003R2160) van het Europees Parlement en de Raad wat betreft een doelstelling
      van de Unie voor het verminderen van de prevalentie van serotypen Salmonella bij volwassen vermeerderingskoppels
      van Gallus gallus (PbEU L 61);
        - *verordening (EU) nr. 517/2011:* verordening (EU) nr. 517/2011 van de Commissie van 25 mei 2011 ter uitvoering
      van [Verordening (EG) nr. 2160/2003](32003R2160) van het Europees Parlement en de Raad wat betreft een doelstelling
      van de Unie voor het verminderen van de prevalentie van bepaalde serotypes van salmonella bij legkippen van Gallus
      gallus en tot wijziging van [verordening (EG) nr. 2160/2003](32003R2160) en verordening (EU) nr. 200/2010 van de
      Commissie (PbEU L 138);
        - *verordening (EU) nr. 200/2012:* verordening (EU) nr. 200/2012 van de Commissie van 8 maart 2012 tot vaststelling
      van een doelstelling van de Unie voor het terugdringen van Salmonella enteritidis en Salmonella typhimurium bij
      koppels slachtkuikens, als vastgesteld in [verordening (EG) nr. 2160/2003](32003R2160) van het Europees Parlement
      en de Raad (PbEU L 71);
        - *verordening (EU) nr. 1190/2012:* verordening (EU) nr. 1190/2012 van de Commissie van 12 december 2012 tot
      vaststelling van een doelstelling van de Unie voor het terugdringen van Salmonella enteritidis en Salmonella
      typhimurium bij koppels kalkoenen, als vastgesteld in [Verordening (EG) nr. 2160/2003](32003R2160) van het Europees
      Parlement en de Raad (PbEU L 340);
        - *verordening (EU) nr. 576/2013:* verordening (EU) nr. 576/2013 van het Europees Parlement en de Raad van 12 juni
      2013 betreffende het niet-commerciële verkeer van gezelschapsdieren en tot intrekking van [Verordening (EG) nr.
      998/2003](32003R0998);
        - *verordening (EU) nr. 2015/1375:* uitvoeringsverordening (EU) nr. 2015/1375 van de Commissie van 10 augustus 2015
      tot vaststelling van specifieke voorschriften voor de officiële controles op Trichinella in vlees (PbEU L 212);
        - *verordening (EU) nr. 2016/429:* [verordening (EU) 2016/429](32016R0429) van het Europees Parlement en de Raad
      van 9 maart 2016 betreffende overdraagbare dierziekten en tot wijziging en intrekking van bepaalde handelingen op
      het gebied van diergezondheid (‘diergezondheidswetgeving’) (PbEU 2016, L 84);
        - *verordening (EU) nr. 2017/625:* verordening (EU) 2017/625 van het Europees Parlement en de Raad van 15 maart
      2017 betreffende officiële controles en andere officiële activiteiten die worden uitgevoerd om de toepassing
      van de levensmiddelen- en diervoederwetgeving en van de voorschriften inzake diergezondheid, dierenwelzijn,
      plantgezondheid en gewasbeschermingsmiddelen te waarborgen, tot wijziging van de [Verordeningen (EG) nr. 999/2001]
      (32001R0999), [(EG) nr. 396/2005](32005R0396), [(EG) nr. 1069/2009](32009R1069), [(EG) nr. 1107/2009](32009R1107),
      (EU) [nr. 1151/2012](32012R1151), (EU) [nr. 652/2014](32014R0652), (EU) [2016/429](32329R2016) en (EU) [2016/2031]
      (32031R2016) van het Europees Parlement en de Raad, de Verordeningen [(EG) nr. 1/2005](32005R0001) en [(EG) nr.
      1099/2009](32009R1099) van de Raad en de Richtlijnen [98/58/EG](31958R0098), [1999/74/EG](31974R1999), [2007/43/
      EG](31943R2007), [2008/119/EG](32019R2008) en [2008/120/EG](32020R2008) van de Raad, en tot intrekking van de
      Verordeningen [(EG) nr. 854/2004](32004R0854) en [(EG) nr. 882/2004](32004R0882) van het Europees Parlement en
      de Raad, de Richtlijnen [89/608/EEG](32508R0089), [89/662/EEG](32562R0089), [90/425/EEG](32325R0090), [91/496/
      EEG](32396R0091), [96/23/EG](31923R0096), [96/93/EG](31993R0096) en [97/78/EG](31978R0097) van de Raad en Besluit
      [92/438/EEG](32338R0092) van de Raad (verordening officiële controles) (Pb EU L 95);
        - *verordening (EU) nr. 2018/1882:* [uitvoeringsverordening (EU) 2018/1882](32018R1882) van de Commissie van
      3 december 2018 betreffende de toepassing, op de categorieën in de lijst opgenomen ziekten, van bepaalde regels
      voor de preventie en bestrijding van ziekten en tot vaststelling van een lijst van soorten en groepen soorten die
      een aanzienlijk risico vormen in verband met de verspreiding van die ziekten (PbEU 2018, L 308);
        - *verordening (EU) nr. 2019/2035:* gedelegeerde verordening (EU) 2019/2035 van de Commissie van 28 juni 2019 tot
      aanvulling van Verordening (EU) 2016/429 van het Europees Parlement en de Raad wat betreft regels voor inrichtingen
      waar landdieren worden gehouden en broederijen, alsmede voor de traceerbaarheid van bepaalde gehouden landdieren en
      broedeieren (PbEU 2019, L 314);
        - *verordening (EU) nr. 2020/686:* gedelegeerde verordening (EU) 2020/686 van de Commissie van 17 december 2019
      tot aanvulling van Verordening (EU) 2016/429 van het Europees Parlement en de Raad wat betreft de erkenning van
      inrichtingen voor levende producten en de traceerbaarheids- en diergezondheidsvoorschriften voor verplaatsingen
      binnen de Unie van levende producten van bepaalde gehouden landdieren (PbEU 2020, L 174);
        - *verordening (EU) nr. 2020/688:* gedelegeerde verordening (EU) 2020/688 van de Commissie van 17 december
      2019 tot aanvulling van Verordening (EU) 2016/429 van het Europees Parlement en de Raad wat betreft de
      diergezondheidsvoorschriften voor verplaatsingen binnen de Unie van landdieren en broedeieren (PbEU 2020, L 174);
        - *verordening (EU) nr. 2020/689:* gedelegeerde verordening (EU) 2020/689 van de Commissie van 17 december 2019 tot
      aanvulling van Verordening (EU) 2016/429 van het Europees Parlement en de Raad wat betreft regels voor bewaking,
      uitroeiingsprogramma’s en de ziektevrije status voor bepaalde in de lijst opgenomen ziekten en nieuwe ziekten (PbEU
      2020, L 174);
        - *ziekte van categorie E:* ziekte als bedoeld in artikel 1, onderdeel 5, van [verordening (EU) nr. 2018/1882]
      (32018R1882), voor zover de ziekte voor een soort of groep soorten is opgenomen in de tabel in de bijlage bij deze
      verordening.

      2 Deze regeling berust mede op [artikel 1.59, tweede en derde lid, van het Besluit houders van dieren][ref1] en
      [artikel 1a.1, tweede en derde lid, van het Besluit dierlijke producten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1.59
      [ref2]: https://wetten.overheid.nl/BWBR0032335#Artikel1a.1
    url: https://wetten.overheid.nl/BWBR0045052/2024-04-01#Artikel1
