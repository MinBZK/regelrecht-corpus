  - number: '5'
    text: |-
      1 Voor het verrichten van één of meer in [bijlage 2][ref1] opgenomen testmethoden kan de minister op aanvraag een
      laboratorium, gevestigd in een andere lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat
      van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland
      bindt, gelijkstellen met een op grond van [artikel 4][ref2] erkend laboratorium.

      2 Een besluit tot gelijkstelling als bedoeld in het eerste lid wordt genomen indien het laboratorium door de
      bevoegde autoriteiten van de lidstaat of staat is erkend voor het verrichten van de in [bijlage 2][ref3] opgenomen
      testmethode, op basis van criteria waardoor een gelijkwaardig kwaliteits- en betrouwbaarheidsniveau wordt bereikt
      als op basis van de eisen in onderhavige regeling.

      3 Bij een aanvraag tot gelijkstelling als bedoeld in het eerste lid worden documenten overgelegd waaruit blijkt dat
      het laboratorium voldoet aan het bepaalde in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045052
      [ref2]: https://wetten.overheid.nl/BWBR0045052#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0045052
    url: https://wetten.overheid.nl/BWBR0045052/2024-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0045052
      - id: ref2
        bwb_id: BWBR0045052
        artikel: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0045052
  - number: '6'
    text: Het laboratorium is gelegen op Nederlands grondgebied.
    url: https://wetten.overheid.nl/BWBR0045052/2024-04-01#Artikel6
  - number: '7'
    text: |-
      1 Het laboratorium is door de Raad voor Accreditatie geaccrediteerd, conform NEN-EN-ISO/IEC 17025, voor de
      testmethode waarvoor de erkenning wordt aangevraagd.

      2 Indien het laboratorium een erkenning aanvraagt voor een testmethode als bedoeld in [bijlage 2][ref1],
      uitgezonderd de testmethodes, genoemd in die bijlage, onder 3, 4, 6, 8 of 15, is mede uit een audit, uitgevoerd
      door het bevoegde NRL, gebleken dat de testmethode overeenkomstig de door het laboratorium in het kader van de
      accreditatie, bedoeld in het eerste lid, opgestelde documentatie en analysevoorschriften wordt uitgevoerd.

      3 Indien het laboratorium een erkenning aanvraagt voor een testmethode als bedoeld in [bijlage 1][ref2],
      uitgezonderd de testmethodes, genoemd in die bijlage onder 4, 5, 7, 12, 14, 18, 19 of 20, is mede uit een audit,
      uitgevoerd door het bevoegde NRL, gebleken dat de testmethode overeenkomstig de door het laboratorium in het kader
      van de accreditatie, bedoeld in artikel 37, vierde lid, onderdeel e, van verordening (EU) nr. 2017/625, opgestelde
      documentatie en analysevoorschriften wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0045052
      [ref2]: https://wetten.overheid.nl/BWBR0045052
    url: https://wetten.overheid.nl/BWBR0045052/2024-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0045052
      - id: ref2
        bwb_id: BWBR0045052
  - number: '8'
    text: |-
      Indien het laboratorium niet beschikt over de accreditatie, bedoeld in [artikel 7, eerste lid][ref1], wordt voldaan
      aan de volgende voorwaarden:

      a. de aanvraag voor de accreditatie is ingediend bij de Raad voor Accreditatie, en

      b. mede uit een audit, uitgevoerd door het bevoegde NRL, is gebleken dat de testmethode, bedoeld in
      [bijlage 2][ref2], uitgezonderd de testmethodes, genoemd in de bijlage onder 3, 4, 6, 8 of 15, overeenkomstig
      de door het laboratorium in het kader van die accreditatie opgestelde documentatie en analysevoorschriften wordt
      uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0045052#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0045052
    url: https://wetten.overheid.nl/BWBR0045052/2024-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0045052
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0045052
  - number: '9'
    text: |-
      Het laboratorium heeft deelgenomen aan een ringtest, georganiseerd door het bevoegde NRL, waaruit is gebleken dat
      het laboratorium de testmethode voldoende nauwkeurig uitvoert.
    url: https://wetten.overheid.nl/BWBR0045052/2024-04-01#Artikel9
  - number: '10'
    text: |-
      Een laboratorium dat een erkenning voor de testmethode, bedoeld in [bijlage 1][ref1], onder 10, aanvraagt, is
      met gunstig resultaat beoordeeld door laboratorium Laboratoire d’études sur la rage et la pathologie des animaux
      sauvages, te Nancy van de Agence française de sécurité sanitaire des aliments Nancy (AFSSA Nancy).


      [ref1]: https://wetten.overheid.nl/BWBR0045052
    url: https://wetten.overheid.nl/BWBR0045052/2024-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0045052
  - number: '11'
    text: |-
      1 De aanvraag voor een erkenning als bedoeld in [artikel 3][ref1], [4][ref2] of [4a, eerste lid][ref3], wordt
      gedaan met een door de minister ter beschikking gesteld middel.

      2 Bij de aanvraag worden in ieder geval de volgende gegevens overgelegd:

      a. bij een aanvraag als bedoeld in [artikel 3][ref4]: het bewijs van accreditatie, bedoeld in artikel 37, vierde
      lid, onderdeel e, van [verordening nr. 2017/625](32525R2017);

      b. bij een aanvraag als bedoeld in [artikel 4][ref5]:

      1° het bewijs van accreditatie, bedoeld in [artikel 7, eerste lid][ref6], of een kopie van de aanvraag voor een
      accreditatie, bedoeld in [artikel 8, onderdeel a][ref7], en

      2° indien [artikel 8][ref8] van toepassing is, de door het laboratorium in het kader van de accreditatie,
      opgestelde documentatie en analysevoorschriften;

      c. bij een aanvraag voor een erkenning als bedoeld in [artikel 4a, eerste lid][ref9]: het bewijs van accreditatie,
      bedoeld in artikel 4a, tweede lid, onderdeel c.

      3 Bij een aanvraag voor een erkenning voor een testmethode als bedoeld in [bijlage 1][ref10], onder
      1, wordt tevens een technische omschrijving van het elektronisch in- en uitslagregister, bedoeld in
      [artikel 18, onderdeel c][ref11], overgelegd.

      4 Bij een aanvraag voor een erkenning voor de testmethode, bedoeld in [bijlage 1][ref12], onder 10, worden tevens
      documenten overgelegd waaruit blijkt dat het laboratorium voldoet aan het bepaalde in [artikel 10][ref13].


