  - number: '13'
    text: |-
      1 Het laboratorium verricht een onderzoek als bedoeld in [bijlage 2][ref1], met de testmethode waarvoor het
      laboratorium erkend is.

      2 Het laboratorium voert de testmethodes uit met reagentia of testkits waarvan de uitgangswaarden voldoen aan de
      Europese regelgeving of goede laboratoriumpraktijken, zoals gecontroleerd door het bevoegde NRL.


      [ref1]: https://wetten.overheid.nl/BWBR0045052
    url: https://wetten.overheid.nl/BWBR0045052/2024-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0045052
  - number: '14'
    text: |-
      1 Het laboratorium meldt niet-negatieve testresultaten, voor zover de testresultaten betrekking hebben op een
      aangewezen besmettelijke dierziekte als bedoeld in de [artikelen 2.1](onbekend) en [2.2](onbekend), voor zover
      het gaat om een infectie met Sars-Cov-2, van de [Regeling diergezondheid](onbekend), onmiddellijk telefonisch en
      elektronisch aan de minister en stuurt de monsters direct naar het bevoegde NRL voor bevestigingsonderzoek.

      2 In afwijking van het eerste lid, stuurt het laboratorium monsters die niet-negatieve testresultaten geven
      van het onderzoek, bedoeld in [bijlage 1][ref1], onder 8, en [bijlage 2][ref2], onder 7, enkel aan het bevoegde
      Nationaal Referentie Laboratorium, indien het testresultaat een uitslag van een test uitgevoerd volgens de gE-Elisa
      testmethode betreft. Het laboratorium meldt daarnaast niet-negatieve testresultaten van het onderzoek, bedoeld in
      bijlage 1, onder 8, en bijlage 2, onder 7, eveneens in afwijking van het eerste lid, enkel aan de minister, indien
      het testresultaat een uitslag van een test uitgevoerd volgens de gE-Elisa testmethode betreft.

      3 Bij het melden van een niet-negatieve uitslag aan de minister, als bedoeld in het eerste lid, vermeldt het
      laboratorium telkens:

      a. het met het desbetreffende monster corresponderende unieke registratienummer, bedoeld in artikel 93, slot, van
      verordening (EU) nr. 2016/429, of het unieke erkenningsnummer, bedoeld in artikel 2, onderdeel 16, van verordening
      (EU) nr. 2019/2035 dat aan de inrichting waarop de dieren worden gehouden, is toegekend, indien het monster
      afkomstig is van een dier dat zich in Nederland bevindt, dan wel

      b. het land van herkomst van het desbetreffende monster en de naam en het adres van het bedrijf waar het dier waar
      het monster van afkomstig is gehouden wordt, indien het monster afkomstig is van een dier dat zich buiten Nederland
      bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0045052
      [ref2]: https://wetten.overheid.nl/BWBR0045052
    url: https://wetten.overheid.nl/BWBR0045052/2024-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0045052
      - id: ref2
        bwb_id: BWBR0045052
  - number: '15'
    text: |-
      Het laboratorium rapporteert elk kwartaal aan de minister elektronisch over de in dat kwartaal uitgevoerde
      onderzoeken, bedoeld in [bijlage 1][ref1] en [2][ref2], alsmede over de uitslagen van die onderzoeken,
      overeenkomstig een door de minister opgesteld format.


      [ref1]: https://wetten.overheid.nl/BWBR0045052
      [ref2]: https://wetten.overheid.nl/BWBR0045052
    url: https://wetten.overheid.nl/BWBR0045052/2024-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0045052
      - id: ref2
        bwb_id: BWBR0045052
  - number: '16'
    text: |-
      1 Het laboratorium verleent medewerking aan periodieke monitoring, uitgevoerd door het NRL.

      2 De in het eerste lid bedoelde monitoring bestaat in ieder geval per erkenning uit:

      a. ten minste 2 ringtesten per jaar, dan wel ten minste 1 ringtest per jaar indien het laboratorium de ringtesten
      in de voorgaande 3 jaren steeds met goed gevolg heeft afgelegd en effectieve monitoring door het bevoegde NRL
      gewaarborgd blijft;

      b. een controle inzake de nauwkeurigheid van de testmethode en de betrouwbaarheid van testuitslagen.

      3 In aanvulling op het tweede lid bestaat de in het eerste lid bedoelde monitoring uit:

      a. ten minste één keer per jaar een audit voor een testmethode als bedoeld in [bijlage 1][ref1], onder 1 tot en met
      3, 6, 8 tot en met 11, 13, 15 tot en met 17, 21 tot en met 27 en [bijlage 2][ref2], onder 1, 2, 5, 7, 9 tot en met
      11, 17, 20, 21, 23 en 25;

      b. het uitvoeren van controletesten op monsters met een negatieve testuitslag, die zijn onderzocht met een
      testmethode als bedoeld in [bijlage 1][ref3], onder 2, 3, 8, 13, 15 en 21 tot en met 27 en [bijlage 2][ref4], onder
      1, 2, 7, 9 tot en met 11, 17, 20, 21, 23 en 25.

      4 Indien een laboratorium beschikt over meer dan één erkenning, worden de audits, bedoeld in het derde lid, onder
      a, gecombineerd uitgevoerd.

      5 Het laboratorium dat is erkend voor een testmethode als bedoeld in [bijlage 1][ref5], onder 2, 3, 8, 13, 15 en
      21 tot en met 27 en [bijlage 2][ref6], onder 1, 2, 7, 9 tot en met 11, 17, 20, 21, 23 en 25 zendt jaarlijks 10% van
      de onderzochte monsters met een negatieve testuitslag, tot een maximum van 250 monsters per testmethode, aan het
      bevoegde NRL, tenzij het door het bevoegde NRL in kennis is gesteld van het feit dat in het betrokken kalenderjaar
      reeds 250 of meer monsters, onderzocht met de desbetreffende testmethode, zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0045052
      [ref2]: https://wetten.overheid.nl/BWBR0045052
      [ref3]: https://wetten.overheid.nl/BWBR0045052
      [ref4]: https://wetten.overheid.nl/BWBR0045052
      [ref5]: https://wetten.overheid.nl/BWBR0045052
      [ref6]: https://wetten.overheid.nl/BWBR0045052
