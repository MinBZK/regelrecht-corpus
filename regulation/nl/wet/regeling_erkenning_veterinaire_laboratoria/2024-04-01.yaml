  - number: '19'
    text: |-
      1 De minister kan de erkenning, bedoeld in [artikel 4][ref1], schorsen voor een door hem te bepalen termijn indien
      het laboratorium niet voldoet aan één of meer voorwaarden en verplichtingen als bedoeld in [paragraaf 2][ref2]
      of [4][ref3].

      2 In geval van een schorsing van de erkenning als bedoeld in het eerste lid, voert het laboratorium de
      desbetreffende testmethode niet uit. Indien de erkenning wordt geschorst omdat het laboratorium niet voldoet aan
      [artikel 11][ref4], kan de minister besluiten dat het laboratorium de testmethode mag blijven verrichten.

      3 De minister kan de erkenning, bedoeld in [artikel 4][ref5], intrekken indien:

      a. het laboratorium zich niet houdt aan het tweede lid;

      b. na afloop van de schorsing, bedoeld in het eerste lid, blijkt dat het laboratorium nog steeds niet voldoet aan
      één of meer voorwaarden en verplichtingen als bedoeld in [paragraaf 2][ref6] of [4][ref7];

      c. blijkt dat binnen een periode van twaalf maanden na afloop van de schorsingstermijn, bedoeld in het eerste
      lid, het laboratorium opnieuw niet voldoet aan één of meer voorwaarden en verplichtingen als bedoeld in
      [paragraaf 2][ref8] of [4][ref9], of

      d. het laboratorium niet voldoet aan één of meer voorwaarden en verplichtingen als bedoeld in [paragraaf 2][ref10]
      of [4][ref11], en naar het oordeel van de minister afbreuk is gedaan aan de correctheid en betrouwbaarheid van de
      resultaten van het onderzoek.

      4 Voordat een besluit tot schorsing of intrekking wordt genomen, wordt het laboratorium in de gelegenheid gesteld
      binnen een bepaalde termijn alsnog aan de voorwaarden en verplichtingen als bedoeld in [paragraaf 2][ref12] of
      [4][ref13] te voldoen.

      5 De minister kan de erkenning met onmiddellijke ingang intrekken indien sprake is van een situatie als bedoeld in
      het derde lid, onderdeel d, en het belang van de dier- en volksgezondheid een intrekking met onmiddellijke ingang
      vereist.


