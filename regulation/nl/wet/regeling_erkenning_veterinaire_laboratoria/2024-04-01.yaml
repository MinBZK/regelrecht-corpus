  - number: '12'
    text: |-
      Indien de erkenning, bedoeld in [artikel 4][ref1] is verleend terwijl het laboratorium niet beschikt over de
      accreditatie, bedoeld in [artikel 7, eerste lid][ref2], dient het laboratorium binnen zes maanden na de datum
      waarop de erkenning, bedoeld in artikel 4 is verleend, geaccrediteerd te zijn overeenkomstig artikel 7, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045052#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0045052#Artikel7
