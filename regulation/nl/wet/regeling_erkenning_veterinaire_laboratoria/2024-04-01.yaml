  - number: '18'
    text: |-
      In aanvulling op de voorgaande artikelen, voldoet een laboratorium dat erkend is voor een testmethode als bedoeld
      in [bijlage 1][ref1], onder 1, aan de volgende vereisten:

      a. artikel 6, derde lid, van de TSE-verordening;

      b. het verleent geen inzage in en doet geen mededelingen over resultaten van de onderzoeken, anders dan
      aan de ambtenaren, belast met het toezicht op de naleving van deze regeling, aan medewerkers van Wageningen
      Bioveterinary Research, te Lelystad, die werkzaamheden verrichten in het kader van de uitvoering van de taken,
      bedoeld in bijlage X, hoofdstukken A en C, van de TSE-verordening, alsmede aan medewerkers van de Raad voor
      Accreditatie, die werkzaamheden verrichten in het kader van het verlenen van de accreditatie, bedoeld in
      [artikel 7, eerste lid][ref2];

      c. het heeft een elektronisch in- en uitslagregister van de monsters operationeel dat is gekoppeld aan een
      elektronisch register van de minister of van een andere door de minister aangewezen organisatie op een zodanige
      wijze dat de minister op ieder gewenst moment een koppeling kan leggen tussen de monsters en het individuele rund,
      waarvan het monster afkomstig is;

      d. het rapporteert maandelijks aan de minister over de in die maand uitgevoerde onderzoeken, bedoeld in
      [bijlage 1][ref3], onder 1, de uitslagen van die onderzoeken en de leeftijd van de onderzochte dieren,
      overeenkomstig een door de minister opgesteld format.


      [ref1]: https://wetten.overheid.nl/BWBR0045052
      [ref2]: https://wetten.overheid.nl/BWBR0045052#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0045052
    url: https://wetten.overheid.nl/BWBR0045052/2024-04-01#Artikel18
