  - number: '2'
    text: |-
      De minister is bevoegd tot aanwijzing van nationale referentielaboratoria als bedoeld in artikel 100, eerste lid,
      eerste zin, van verordening (EU) nr. 2017/625, ten aanzien van onderwerpen die diergezondheid betreffen.
    url: https://wetten.overheid.nl/BWBR0045052/2024-04-01#Artikel2
  - number: '3'
    text: |-
      1 De onderzoeken, bedoeld in [bijlage 1][ref1], worden uitgevoerd met de in die bijlage opgenomen testmethodes
      voor het desbetreffende onderzoek, door een daartoe door de minister ingevolge artikel 37 van verordening (EU) nr.
      2017/625 erkend laboratorium.

      2 De minister verleent een erkenning aan een laboratorium voor een of meer in [bijlage 1][ref2] opgenomen
      testmethodes, indien is voldaan aan artikel 37 van verordening (EU) nr. 2017/625 en artikel 7, derde lid.

      3 In aanvulling op de artikelen 37, vierde lid, en 38 van verordening (EU) nr. 2017/625 voldoet een erkend
      laboratorium als bedoeld in het eerste lid, aan de [artikelen 14 tot en met 16][ref3] en [artikel 18][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0045052
      [ref2]: https://wetten.overheid.nl/BWBR0045052
      [ref3]: https://wetten.overheid.nl/BWBR0045052#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0045052#Artikel18
    url: https://wetten.overheid.nl/BWBR0045052/2024-04-01#Artikel3
