        artikel: '18'
        paragraaf: '4'
  - number: '4'
    text: |-
      1 De onderzoeken, bedoeld in [bijlage 2][ref1], worden uitgevoerd met de in die bijlage opgenomen testmethodes
      voor het desbetreffende onderzoek door een daartoe door de minister ingevolge deze regeling erkend laboratorium
      wanneer het onderzoek onder toepassing van [artikel 1.59, tweede lid, van het Besluit houders van dieren][ref2] of
      [artikel 1a.1, tweede lid, van het Besluit dierlijke producten][ref3] plaatsvindt ten behoeve van uitvoer naar een
      land, niet zijnde een lidstaat of een andere staat die partij is bij het EER-Verdrag.

      2 De minister verleent een erkenning aan een laboratorium voor een of meer in [bijlage 2][ref4] opgenomen
      testmethodes, indien is voldaan aan [paragraaf 2][ref5].

      3 Een erkend laboratorium als bedoeld in het eerste lid voldoet aan [paragraaf 4][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0045052
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel1.59
