  - number: '17'
    text: |-
      Het NRL, bedoeld in [artikel 16, eerste lid][ref1], verstrekt de resultaten van:

      a. de audit, bedoeld in [artikel 7, tweede lid][ref2];

      b. de ringtest, bedoeld in [artikel 9][ref3]; en

      c. de monitoring, bedoeld in [artikel 16][ref4],

      uitsluitend aan de minister en het desbetreffende laboratorium.


