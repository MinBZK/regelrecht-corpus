$id: tijdelijke_regeling_introductie_premiepensioeninstellingen
regulatory_layer: WET
publication_date: '2011-12-20'
valid_from: '2011-01-01'
bwb_id: BWBR0029285
url: https://wetten.overheid.nl/BWBR0029285/2011-01-01
preamble:
  text: |-
    Gelet op artikel IV, eerste en tweede lid, van de Wet introductie premiepensioeninstellingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0029285/2011-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In de alfabetische opsomming van [artikel 1:1 van de Wet op het financieel toezicht][ref1] dient in onderdeel a van
      de definitie van aanbieden de zinsnede ‘een financieel product dat geen financieel instrument of verzekering is’ te
      worden gelezen als: een financieel product dat geen financieel instrument, premiepensioenvordering of verzekering
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0029285/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '1.2'
    text: |-
      In de alfabetische opsomming van [artikel 1:1 van de Wet op het financieel toezicht][ref1] dient de definitie van
      aanbieden te worden gelezen als was onder verlettering van de onderdelen b en c tot onderdelen c en d, na onderdeel
      a een onderdeel ingevoegd, luidende:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0029285/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1.2.b
    text: |-
      het in de uitoefening van een beroep of bedrijf rechtstreeks of middellijk doen van een voldoende bepaald voorstel
      tot het als wederpartij aangaan van een overeenkomst waarbij een premiepensioenvordering ontstaat of het in de
      uitoefening van een beroep of bedrijf aangaan, beheren of uitvoeren van een dergelijke overeenkomst;
    url: https://wetten.overheid.nl/BWBR0029285/2011-01-01#Artikel1
  - number: '1.3'
    text: |-
      In de alfabetische opsomming van [artikel 1:1 van de Wet op het financieel toezicht][ref1] dient in onderdeel a van
      de definitie van adviseren de zinsnede ‘met uitzondering van verzekeringen en financiële instrumenten’ te worden
      gelezen als: met uitzondering van premiepensioenvorderingen, verzekeringen en financiële instrumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0029285/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '1.4'
    text: |-
      In de alfabetische opsomming van [artikel 1:1 van de Wet op het financieel toezicht][ref1] dient in onderdeel b
      van de definitie van adviseren de zinsnede ‘van een of meer specifieke verzekeringen of’ te worden gelezen als:
      van een of meer specifieke overeenkomsten waarbij een premiepensioenvordering ontstaat, van een of meer specifieke
      verzekeringen of.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0029285/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '1.5'
    text: |-
      In de alfabetische opsomming van [artikel 1:1 van de Wet op het financieel toezicht][ref1] dient in onderdeel a
      van de definitie van bemiddelen de zinsnede ‘een ander financieel product dan een financieel instrument, krediet
      of verzekering’ te worden gelezen als: een ander financieel product dan een financieel instrument, krediet,
      premiepensioenvordering of verzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0029285/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '1.6'
    text: |-
      In de alfabetische opsomming van [artikel 1:1 van de Wet op het financieel toezicht][ref1] dient de definitie
      van bemiddelen te worden gelezen als was aan het slot van onderdeel b ‘of’ vervallen en onder verlettering van
      onderdeel c tot onderdeel d na onderdeel b een onderdeel ingevoegd, luidende:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0029285/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1.6.c
    text: |-
      alle werkzaamheden in de uitoefening van een beroep of bedrijf gericht op het als tussenpersoon tot stand brengen
      van een overeenkomst waarbij een premiepensioenvordering ontstaat tussen een cliënt en een premiepensioeninstelling
      of op het assisteren bij het beheer en de uitvoering van een dergelijke overeenkomst; of.
    url: https://wetten.overheid.nl/BWBR0029285/2011-01-01#Artikel1
  - number: '2'
    text: |-
      In [artikel 3:17, derde lid, van de Wet op het financieel toezicht][ref1] dient de zinsnede
      ‘beleggingsondernemingen met zetel in Nederland die beleggingsdiensten verlenen of beleggingsactiviteiten
      verrichten in Nederland en bewaarders die zijn verbonden aan een beleggingsinstelling met zetel in Nederland die
      rechten van deelneming in Nederland aanbiedt’ te worden gelezen als: beleggingsondernemingen met zetel in Nederland
      die beleggingsdiensten verlenen of beleggingsactiviteiten verrichten in Nederland, pensioenbewaarders met zetel
      in Nederland die zijn verbonden aan een premiepensioeninstelling met zetel in Nederland en bewaarders die zijn
      verbonden aan een beleggingsinstelling met zetel in Nederland die rechten van deelneming in Nederland aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029285/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '3'
    text: |-
      In [artikel 4:39][ref1] dient de zinsnede ‘beheerder, beleggingsmaatschappij of bewaarder’ te worden gelezen als:
      beheerder, beleggingsmaatschappij, bewaarder of pensioenbewaarder.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0029285/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: '4'
    text: De artikelen van deze regeling treden in werking met ingang van 1 januari 2011.
    url: https://wetten.overheid.nl/BWBR0029285/2011-01-01#Artikel4
  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling introductie premiepensioeninstellingen.'
    url: https://wetten.overheid.nl/BWBR0029285/2011-01-01#Artikel5
