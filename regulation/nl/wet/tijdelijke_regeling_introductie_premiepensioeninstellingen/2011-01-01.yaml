preamble:
  text: |-
    Gelet op artikel IV, eerste en tweede lid, van de Wet introductie premiepensioeninstellingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0029285/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In de alfabetische opsomming van [artikel 1:1 van de Wet op het financieel toezicht][ref1] dient in onderdeel a
      van de definitie van aanbieden de zinsnede ‘een financieel product dat geen financieel instrument of verzekering
      is’ te worden gelezen als: een financieel product dat geen financieel instrument, premiepensioenvordering of
      verzekering is.

      2 In de alfabetische opsomming van [artikel 1:1 van de Wet op het financieel toezicht][ref2] dient de definitie van
      aanbieden te worden gelezen als was onder verlettering van de onderdelen b en c tot onderdelen c en d, na onderdeel
      a een onderdeel ingevoegd, luidende:

      b. het in de uitoefening van een beroep of bedrijf rechtstreeks of middellijk doen van een voldoende bepaald
      voorstel tot het als wederpartij aangaan van een overeenkomst waarbij een premiepensioenvordering ontstaat of het
      in de uitoefening van een beroep of bedrijf aangaan, beheren of uitvoeren van een dergelijke overeenkomst;

      3 In de alfabetische opsomming van [artikel 1:1 van de Wet op het financieel toezicht][ref3] dient in onderdeel
      a van de definitie van adviseren de zinsnede ‘met uitzondering van verzekeringen en financiële instrumenten’ te
      worden gelezen als: met uitzondering van premiepensioenvorderingen, verzekeringen en financiële instrumenten.

      4 In de alfabetische opsomming van [artikel 1:1 van de Wet op het financieel toezicht][ref4] dient in onderdeel
      b van de definitie van adviseren de zinsnede ‘van een of meer specifieke verzekeringen of’ te worden gelezen als:
      van een of meer specifieke overeenkomsten waarbij een premiepensioenvordering ontstaat, van een of meer specifieke
      verzekeringen of.

      5 In de alfabetische opsomming van [artikel 1:1 van de Wet op het financieel toezicht][ref5] dient in onderdeel a
      van de definitie van bemiddelen de zinsnede ‘een ander financieel product dan een financieel instrument, krediet
      of verzekering’ te worden gelezen als: een ander financieel product dan een financieel instrument, krediet,
      premiepensioenvordering of verzekering.

      6 In de alfabetische opsomming van [artikel 1:1 van de Wet op het financieel toezicht][ref6] dient de definitie
      van bemiddelen te worden gelezen als was aan het slot van onderdeel b ‘of’ vervallen en onder verlettering van
      onderdeel c tot onderdeel d na onderdeel b een onderdeel ingevoegd, luidende:

      c. alle werkzaamheden in de uitoefening van een beroep of bedrijf gericht op het als tussenpersoon tot
      stand brengen van een overeenkomst waarbij een premiepensioenvordering ontstaat tussen een cliënt en een
      premiepensioeninstelling of op het assisteren bij het beheer en de uitvoering van een dergelijke overeenkomst; of.


