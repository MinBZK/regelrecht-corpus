  - number: '2'
    text: |-
      In [artikel 3:17, derde lid, van de Wet op het financieel toezicht][ref1] dient de zinsnede
      ‘beleggingsondernemingen met zetel in Nederland die beleggingsdiensten verlenen of beleggingsactiviteiten
      verrichten in Nederland en bewaarders die zijn verbonden aan een beleggingsinstelling met zetel in Nederland die
      rechten van deelneming in Nederland aanbiedt’ te worden gelezen als: beleggingsondernemingen met zetel in Nederland
      die beleggingsdiensten verlenen of beleggingsactiviteiten verrichten in Nederland, pensioenbewaarders met zetel
      in Nederland die zijn verbonden aan een premiepensioeninstelling met zetel in Nederland en bewaarders die zijn
      verbonden aan een beleggingsinstelling met zetel in Nederland die rechten van deelneming in Nederland aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel317
    url: https://wetten.overheid.nl/BWBR0029285/2011-01-01#Artikel2
