  - number: 9o
    text: |-
      1 Het is verboden schapen of geiten van een schapenverzamelcentrum, onderscheidenlijk geitenverzamelcentrum, af te
      voeren anders dan naar een slachthuis.

      2 De aanbieder draagt ervoor zorg dat iedere vervoerseenheid waarin schapen of geiten van een
      schapenverzamelcentrum, onderscheidenlijk een geitenverzamelcentrum, worden afgevoerd wordt verzegeld met een door
      de Minister voor het desbetreffende schapenverzamelcentrum, onderscheidenlijk geitenverzamelcentrum, goedgekeurd
      zegel. Lossing van een vervoerseenheid geschiedt op ten hoogste één slachthuis.

      3 De afvoer van slachtschapen en -geiten van een op grond van [artikel 9l][ref1] erkend schapenverzamelcentrum,
      onderscheidenlijk een geitenverzamelcentrum, naar een niet in Nederland gelegen slachthuis geschiedt met
      inachtneming van de [Hoofdstukken 2][ref2] en [7 van de Regeling handel levende dieren en levende producten][ref3].

      4 In afwijking van het eerste lid geschiedt de afvoer van slachtschapen en -geiten van een op grond
      van artikel 9l erkend schapenverzamelcentrum, onderscheidenlijk een geitenverzamelcentrum, rechtstreeks
      naar een buiten Nederland gelegen verzamelcentrum met inachtneming van de [Hoofdstukken 2][ref4] en
      [7 van de Regeling handel levende dieren en levende producten][ref5].

      5 Het is verboden op een bedrijf, niet zijnde een slachterij, schapen of geiten, afkomstig van een
      schapenverzamelcentrum, onderscheidenlijk een geitenverzamelcentrum, te ontvangen.


