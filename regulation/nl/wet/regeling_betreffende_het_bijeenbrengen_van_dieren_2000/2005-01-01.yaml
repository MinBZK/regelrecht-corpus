  - number: 9fa
    text: |-
      1 De afvoer van weiderunderen, bedoeld in [artikel 9d, onderdeel a, onder 4][ref1], van een op grond van
      [artikel 9b][ref2] erkend runderverzamelcentrum geschiedt rechtstreeks en uitsluitend naar:

      a. hetzij een al dan niet in Nederland gelegen slachthuis;

      b. hetzij een in Nederland gelegen vetweiderijbedrijf dat uitsluitend runderen rechtstreeks afvoert naar een dan
      niet in Nederland gelegen slachthuis, mits het vetweiderijbedrijf bij Minister is geregistreerd, met gebruikmaking
      van een daartoe ter beschikking gesteld formulier.

      2 De afvoer van weiderunderen, bedoeld in [artikel 9d, onderdeel a, onder 4][ref3], naar een
      niet in Nederland gelegen slachthuis geschiedt met in achtneming van de [Hoofdstukken 2][ref4] en
      [3 van de Regeling handel levende dieren en levende producten][ref5].

      3 Het is verboden op een bedrijf, niet zijnde een slachthuis of een vetweiderijbedrijf, weiderunderen afkomstig van
      een runderverzamelcentrum te ontvangen.

      4 Onverminderd het bepaalde in de [Regeling handel levende dieren en levende producten][ref6] is de aanvoer
      van weiderunderen op een verzamelcentrum verboden, indien die runderen in de periode voor de aanvoer op een
      runderverzamelcentrum voor een tijdvak korter dan 21 dagen bijeen zijn gebracht.

      5 Registratie van een vetweiderijbedrijf als bedoeld in het eerste lid, vindt slechts plaats indien:

      a. op het vetweiderijbedrijf uitsluitend runderen worden gehouden; en

      b. al deze runderen rechtstreeks naar het slachthuis worden afgevoerd.

      6 Door middel van een daartoe opgesteld document kan, vanaf 30 dagen na het moment dat alle op het
      vetweiderijbedrijf aanwezige van een runderverzamelcentrum afkomstige weiderunderen naar een al dan niet in
      Nederland gelegen slachthuis zijn afgevoerd, op verzoek van de eigenaar of de exploitant van het vetweiderijbedrijf
      door de Minister de registratie, bedoeld in het vijfde lid, worden ingetrokken.

      7 Op de registratie, bedoeld in het vijfde lid, is [artikel 9i, eerste en tweede lid][ref7], van overeenkomstige
      toepassing.


