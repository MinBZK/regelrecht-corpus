  - number: 9u
    text: |-
      1 Eenieder, die het deel van de plaats, waar runderen, schapen of geiten verblijven, betreedt of verlaat, ontsmet
      zijn schoeisel door middel van voorzieningen, die duidelijk zichtbaar aanwezig zijn bij elke in- en uitgang van
      voornoemd deel van de plaats.

      2 Op de plaats zijn voor de reiniging en ontsmetting van vervoermiddelen, waarmee evenhoevigen worden vervoerd,
      één of meer installaties aanwezig die water leveren van voldoende druk voor een deugdelijke en efficiënte reiniging
      en ontsmetting.

      3 [Artikel 6, eerste lid, van de Regeling inzake hygiënevoorschriften besmettelijke dierziekten 2000][ref1] is
      niet van toepassing bij het uitladen van evenhoevigen op een plaats.

      4 Voordat een vervoermiddel, dat geladen is met runderen, schapen of geiten, de plaats verlaat reinigt en ontsmet
      de bestuurder de wielen en wielkasten van dat vervoermiddel.

      5 De reiniging en ontsmetting, bedoeld in het vierde lid, geschiedt op een verharde en voor water ondoordringbare
      ondergrond.

      6 Bij de installatie of inrichting voor het reinigen en ontsmetten van vervoermiddelen, bedoeld in het tweede lid,
      is een lekvrije en afsluitbare voorziening voor de tijdelijke opslag en afvoer van mest en strooisel aanwezig.

      7 Zo spoedig mogelijk na afloop van de tentoonstelling of keuring worden de verharde terreindelen van de plaats
      gereinigd en ontsmet met een installatie als bedoeld in [artikel 9c, onderdeel t][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012010#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011441#Artikel9c
    url: https://wetten.overheid.nl/BWBR0011441/2005-01-01#Artikel9u
