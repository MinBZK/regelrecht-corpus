  - number: '8'
    text: |-
      1 Het ten behoeve van de export aanvoeren van varkens op een varkensverzamelcentrum is verboden tenzij de
      exporteur van de varkens de VWA uiterlijk om 14.00 op de tweede werkdag voorafgaande aan de aanvoer op het
      varkensverzamelcentrum door middel van een daartoe verstrekt aanvraagformulier in kennis heeft gesteld van de
      voorgenomen aanvoer op het varkensverzamelcentrum en de Minister de exporteur schriftelijk in kennis heeft gesteld
      tegen de aanvoer geen bezwaar te hebben en voldaan is aan:.

      a. artikel 3, tweede lid, onderdelen b, c en d, van [richtlijn 64/432/EEG](31964L0432),

      b. indien het fok- en gebruiksvarkens betreft, 30 dagen vóór de aanvoer op het varkensverzamelcentrum, of, indien
      zij minder dan 30 dagen oud zijn, sedert hun geboorte op het bedrijf hebben verbleven en

      c. de aanvoer geschiedt overeenkomstig artikel 4 van [richtlijn 64/432/EEG](31964L0432).

      2 Het ten behoeve van een in Nederland gelegen slachthuis aanvoeren van uit Nederland afkomstige varkens op een
      varkensverzamelcentrum is verboden tenzij de handelaar van de varkens de VWA uiterlijk om 14.00 op de tweede
      werkdag voorafgaande aan de aanvoer op het varkensverzamelcentrum de VWA van de van de voorgenomen aanvoer door
      middel van een daartoe verstrekt aanvraagformulier in kennis heeft gesteld onder vermelding van de aanvoerdatum,
      het aantal varkens en de UBN-nummers van de aan te voeren varkens op het varkensverzamelcentrum en de Minister de
      handelaar schriftelijk in kennis heeft gesteld tegen de aanvoer geen bezwaar te hebben.

      3 In afwijking van [artikel 2.26, eerste lid, van de Regeling handel levende dieren en levende producten][ref1]
      stelt de aanbieder de VWA uiterlijk 24 uur voorafgaande aan de aanvoer op het varkensverzamelcentrum schriftelijk
      in kennis van de aanvoer van varkens afkomstig uit andere Lid-Staten van de Europese Unie dan Nederland onder
      vermelding van de aanvoerdatum, de categorie varkens, het aantal varkens en het bestemmingsadres van de varkens.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.26
    url: https://wetten.overheid.nl/BWBR0011441/2005-01-01#Artikel8
