  - number: '10'
    text: |-
      Voor de werkzaamheden is de aanbieder een vergoeding verschuldigd. Deze vergoeding bestaat uit een starttarief
      van € 35,92 indien op de dag waarop de werkzaamheden plaatsvinden, geen varkens of runderen anders dan in doorvoer
      buiten Nederland worden gebracht en een bedrag van

      a. € 28,65 per kwartier dat aan de werkzaamheden door een keuringsdierenarts is besteed, en

      b. € 17,03 per kwartier dat aan de werkzaamheden door een assistent is besteed.
    url: https://wetten.overheid.nl/BWBR0011441/2005-01-01#Artikel10
  - number: '11'
    text: |-
      Indien certificaten worden afgegeven, is de aanbieder boven de vergoedingen, bedoeld in [artikel 10][ref1], een
      vergoeding verschuldigd van € 2,15 per certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0011441#Artikel10
    url: https://wetten.overheid.nl/BWBR0011441/2005-01-01#Artikel11
