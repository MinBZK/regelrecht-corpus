  - number: 9p
    text: |-
      1 De Minister kan de erkenning, bedoeld in [artikel 9l][ref1], met onmiddellijke ingang schorsen voor een
      bepaalde termijn indien naar het oordeel van de Minister niet wordt voldaan aan de eisen en regels, bedoeld in de
      [artikelen 9m][ref2] tot en met [9o][ref3], en veterinaire belangen de schorsing rechtvaardigen.

      2 De Minister kan de erkenning, bedoeld in [artikel 9l][ref4], intrekken, indien:

      a. naar het oordeel van de Minister blijkt dat het schapenverzamelcentrum, onderscheidenlijk het
      geitenverzamelcentrum, niet voldoet aan de eisen, bedoeld in de [artikelen 9m][ref5] tot en met [9o][ref6], terwijl
      de exploitant van de inrichting in de gelegenheid is gesteld binnen een bepaalde termijn alsnog aan de eisen te
      voldoen en deze termijn inmiddels is verstreken, dan wel

      b. indien na afloop van de schorsing, bedoeld in het eerste lid, naar het oordeel van de Minister blijkt dat het
      schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, nog steeds niet voldoet aan de eisen, bedoeld
      in de [artikelen 9m][ref7] tot en met [9o][ref8].


