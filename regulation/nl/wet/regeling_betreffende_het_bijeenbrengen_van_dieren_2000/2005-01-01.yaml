  - number: 9e
    text: |-
      1 De afvoer van fokrunderen, bedoeld in [artikel 9d, onderdeel a, onder 1][ref1]), van een op
      grond van [artikel 9b][ref2] erkend runderverzamelcentrum geschiedt rechtstreeks en uitsluitend
      naar een niet in Nederland gelegen bedrijf, met inachtneming van de [Hoofdstukken 2][ref3] en
      [3 van de Regeling handel levende dieren en levende producten][ref4].

      2 Indien aan het einde van een blokperiode de fokrunderen, bedoeld in
      [artikel 9d, eerste lid, onderdeel a, onder 1][ref5], niet zijn afgevoerd, worden de runderen door de aanbieder na
      voorafgaande kennisgeving aan de VWA met gebruikmaking van een daartoe ter beschikking gesteld formulier:

        - afgevoerd naar een slachthuis, of
        - op het verzamelcentrum gedurende 30 dagen in een epidemiologische bedrijfseenheid gescheiden gehouden van de
      overige fokrunderen, waarna de fokrunderen wederom voor een blokperiode kunnen worden aangeboden, of
        - op het verzamelcentrum in een epidemiologische bedrijfseenheid gescheiden gehouden van andere fokrunderen
      gedurende een periode, die aanvangt op de eerste dag van de scheiding en de fokrunderen op de vijfde dag van
      de scheiding door een dierenarts klinisch worden onderzocht op besmettelijke dierziekten en de uitslag van dat
      onderzoek negatief is, waarna de fokrunderen worden vervoerd naar een in Nederland gelegen bedrijf.

      3 De termijn van 30 dagen, bedoeld in het tweede lid, tweede en derde gedachtestreepje, vangt aan nadat het laatste
      fokrund aan de epidemiologische eenheid is toegevoegd.

      4 Het is verboden op een bedrijf, niet zijnde een slachterij of een Nederlands bedrijf als bedoeld in het tweede
      lid, derde gedachtestreepje, fokrunderen afkomstig van een runderverzamelcentrum te ontvangen.


