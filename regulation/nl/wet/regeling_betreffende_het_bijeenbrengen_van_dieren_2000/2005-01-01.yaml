  - number: '9'
    text: |-
      Het afvoeren van varkens vanaf een varkensverzamelcentrum is verboden, tenzij:

      a. de varkens rechtstreeks en zonder bij- of afladen vanaf het varkensverzamelcentrum in een verzegeld
      vervoermiddel worden vervoerd naar een in Nederland gelegen slachthuis. Voor zover de varkens afkomstig zijn uit
      Nederland controleert de exploitant van een varkensverzamelcentrum overeenkomstig een door de Minister goedgekeurd
      protocol of de varkens worden vervoerd als bedoeld in de voorgaande volzin;

      b. fok- en gebruiksvarkens voorzover zij afkomstig zijn uit andere Lid-Staten van de Europese Unie dan Nederland
      rechtstreeks en zonder bij- of afladen vanaf het varkensverzamelcentrum in een verzegeld vervoermiddel worden
      vervoerd naar een in Nederland gelegen bedrijf;

      c. de varkens vanaf het varkensverzamelcentrum overeenkomstig artikel 4 van [richtlijn 64/432/EEG](31964L0432)
      naar een of meer bestemmingen buiten Nederland worden vervoerd, in welk geval de varkens, voorzover zij afkomstig
      zijn uit Nederland, vergezeld gaan van een bewijsstuk, als bedoeld in [artikel 77, tweede lid, van de wet][ref1],
      en, voorzover zij afkomstig zijn uit andere Lid-Staten van de Europese Unie dan Nederland, vergezeld gaan van de
      gezondheidscertificaten bedoeld in artikel 5, eerste en vijfde lid, van [richtlijn 64/432/EEG](31964L0432), waarbij
      geldt dat dit vervoer rechtstreeks en zonder bij- of afladen in een verzegeld vervoermiddel plaatsvindt, met dien
      verstande en in afwijking van [artikel 3, derde lid][ref2], dat voor slachtvarkens het vervoer zonder afladen via
      een ander in Nederland gelegen varkensverzamelcentrum ten behoeve van het opladen van varkens afkomstig van dat
      varkensverzamelcentrum is toegestaan, onder de voorwaarden:

        - dat het een vervoermiddel betreft dat uit een combinatie van een voertuig met één of meerdere aanhangwagens
      bestaat,
        - op iedere afzonderlijke vervoerseenheid slechts varkens aanwezig zijn die blijkens het begeleidende
      vervoersdocument alle gelijktijdig van hetzelfde varkensverzamelcentrum zijn afgevoerd,
        - bij het opladen geen vervoerseenheid op het varkensverzamelcentrum wordt gebracht dat ten behoeve van het
      betrokken transport reeds op een ander varkensverzamelcentrum is geweest en
        - indien bij het opladen op de ene vervoerseenheid voorwerpen worden gebruikt die behoren tot een andere
      vervoerseenheid, die voorwerpen na gebruik worden gereinigd en ontsmet en de vervoermiddelen waarmee de varkens
      worden vervoerd op de plaats van bestemming geheel worden gelost.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0011441#Artikel3
