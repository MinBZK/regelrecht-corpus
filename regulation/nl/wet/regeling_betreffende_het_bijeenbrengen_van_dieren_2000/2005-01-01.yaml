  - number: 9a
    text: |-
      1 Het is verboden runderen afkomstig van verschillende plaatsen op een plaats voor een kortere periode dan 21 dagen
      bijeen te brengen.

      2 Het in het eerste lid bedoelde verbod geldt niet indien de runderen worden bijeengebracht op een
      runderverzamelcentrum dat op grond van [artikel 9b][ref1] door de Minister is erkend.

      3 Het in het eerste lid bedoeld verbod geldt niet voor het bijeenbrengen van runderen op een vervoermiddel,
      mits vervolgens lossing van het gehele vervoermiddel geschiedt op één bedrijf, waaronder mede wordt verstaan één
      runderverzamelcentrum of één slachthuis.

      4 Het bijeenbrengen van runderen als bedoeld in het derde lid geschiedt

      a. op het bedrijf van afvoer, grenzend aan de openbare weg;

      b. voorzover aanwezig, vanaf een voorziening op het bedrijf van afvoer waar de af te voeren runderen tijdelijk
      bijeengebracht worden met het oog op het bijeenbrengen op een vervoermiddel, of

      c. indien het stieren, ouder dan twaalf maanden, betreft, op een andere wijze, mits contact tussen de
      verblijfplaats van de bijeen te brengen dieren en het vervoermiddel is uitgesloten.

      5 Het in het eerste lid bedoelde verbod geldt niet voor het bijeenbrengen van runderen op een slachthuis.

      6 Het is verboden runderen af te voeren van een slachthuis, met uitzondering van de afvoer van runderen in de
      categorieën 3 tot en met 6 als bedoeld in de Bijlage van de Regeling tarieven keuring vlees en vleesproducten 1993
      naar een door de Minister aangewezen inrichting ten behoeve van noodslachting.


      [ref1]: https://wetten.overheid.nl/BWBR0011441#Artikel9b
    url: https://wetten.overheid.nl/BWBR0011441/2005-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0011441
        artikel: 9b
        paragraaf: '3'
  - number: 9b
    text: |-
      Een runderverzamelcentrum wordt door de Minister erkend indien voldaan wordt aan de eisen, bedoeld in
      [artikel 9c][ref1]. Indien het runderverzamelcentrum beschikt over meerdere epidemiologische bedrijfseenheden,
      bevat het besluit tot erkenning van een runderverzamelcentrum, bedoeld in de eerste volzin, een aanduiding van het
      aantal epidemiologische eenheden dat voldoet aan [artikel 9c, onderdeel y][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011441#Artikel9c
      [ref2]: https://wetten.overheid.nl/BWBR0011441#Artikel9c
    url: https://wetten.overheid.nl/BWBR0011441/2005-01-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0011441
        artikel: 9c
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011441
        artikel: 9c
        paragraaf: '3'
  - number: 9c
    text: |-
      De eisen, bedoeld in [artikel 9b][ref1], zijn:

      a. het runderverzamelcentrum is gemakkelijk bereikbaar via verharde wegen en ligt niet in een gebied ten aanzien
      waarvan op grond van de regelgeving van de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen
      of op grond van nationale regelgeving maatregelen zijn genomen, houdende de instelling van een verbod om dieren uit
      het betrokken gebied uit te voeren of in de handel te brengen;

      b. het runderverzamelcentrum maakt geen deel uit van een bedrijf waar vee is gehuisvest, van een slachthuis,
      of van een andere verzamelplaats ten behoeve van het verzamelen van andere dieren dan runderen. De gebouwen van
      het runderverzamelcentrum zijn gelegen op een minimale afstand van 100 meter van gebouwen behorende bij één of
      meer van de bovengenoemde bedrijven. Het runderverzamelcentrum is zodanig omheind, dat vrije toegang tot het
      runderverzamelcentrum niet mogelijk is;

      c. het runderverzamelcentrum beschikt over een door de Minister goedgekeurd opleidingsplan op grond waarvan het
      personeel dat op het centrum verantwoordelijk is voor de dieren door de aanbieder wordt opgeleid in de zorg voor en
      het welzijn van de dieren alsmede in de wettelijke eisen die ter zake van het runderverzamelcentrum worden gesteld;

      d. het gehele terrein van het runderverzamelcentrum waar met smetstof verontreinigd materiaal vanaf
      transportmiddelen op de grond terecht kan komen, is verhard. De plaats waar runderen in- en uitgeladen worden
      is voorzien van een verharde en voor water ondoordringbare terreinbedekking. Het gehele verharde terrein van het
      runderverzamelcentrum is in goede staat van onderhoud en zonder glooiingen;

      e. alle materialen waarmee de runderen op het runderverzamelcentrum in aanraking kunnen komen zijn uitsluitend
      van duurzaam en ondoordringbaar materiaal gemaakt dat gemakkelijk en grondig kan worden gereinigd en ontsmet.
      De materialen worden goed onderhouden en eventuele reparaties worden onmiddellijk uitgevoerd. Het gebruik van
      corroderende materialen is niet toegestaan. Hout is slechts toegestaan, wanneer dit is ingebed in kunststof of
      hars;

      f. het runderverzamelcentrum beschikt over laad- en losruimten waar de runderen worden in- en uitgeladen. De laad-
      en losvoorzieningen zijn zodanig dat laad- en loswerkzaamheden ongehinderd kunnen plaatsvinden;

      g. behoudens wanneer ten genoegen van de Minister kan worden aangetoond dat de bedrijfsvoering van het
      runderverzamelcentrum zodanig is dat aankomende en vertrekkende runderen niet met elkaar in contact komen, is het
      runderverzamelcentrum zodanig ingericht dat bij het in- en uitladen aankomende en vertrekkende runderen niet met
      elkaar in contact komen;

      h. op het runderverzamelcentrum onderscheidenlijk de epidemiologische bedrijfseenheid zijn één of meerdere
      stalruimten aanwezig voor het onderbrengen van de runderen. Voorzieningen zijn in de stalruimten aanwezig voor het
      voeren en drenken van de runderen;

      i. in de onmiddellijke nabijheid van de uitlaadruimte, is een aparte, afsluitbare stalling voor zieke of van
      een dierziekte verdachte runderen aanwezig dan wel een stalruimte waarin een voorziening is getroffen voor de
      afzondering van runderen zodanig dat de daartoe bestemde ruimte fysiek door middel van geheel gesloten wanden
      gescheiden is van de overige stallingsvoorzieningen binnen de stalruimte;

      j. op het runderverzamelcentrum is een voor runderen ontoegankelijke ruimte aanwezig voor opslag van voeder en
      strooisel, gescheiden van de ruimte waar runderen kunnen verblijven alsmede een afsluitbare, lekvrije, voor vogels
      of ongedierte ontoegankelijke en goed reinigbare voorziening aanwezig voor de opslag van kadavers. Deze voorziening
      is zodanig op een verharde plaats gesitueerd dat het vanaf de openbare verharde weg binnen het bereik ligt van de
      laadkraan van het vervoermiddel van degene die het materiaal ophaalt;

      k. in de nabijheid van de stalruimte is een voorziening aanwezig voor de opslag van mest en indien een stalruimte
      geheel of gedeeltelijk wordt ingestrooid, is tevens in de nabijheid van de stalruimte een voorziening aanwezig voor
      de opslag van het gebruikte strooisel;

      l. indien het runderverzamelcentrum gebruikt wordt voor de export van runderen is op het centrum ten behoeve van de
      VWA een stoel, een telefoon en een afsluitbaar bureau aanwezig of een afsluitbare ruimte, ingericht met ten minste
      een tafel. Indien de VWA een onafhankelijke telefoonaansluiting wenst, komt deze voor rekening van de VWA. In of in
      de nabijheid van de kantoorruimte bevindt zich een toilet met gelegenheid tot handen wassen;

      m. het runderverzamelcentrum beschikt over een geschikt opvangsysteem voor het afvalwater dat zorg draagt dat het
      afvalwater kan afvloeien of op andere wijze wordt verwijderd;

      n. bij de laad- en losruimte en in de stalruimte is een voor inspectie en keuringen passende verlichting met een
      minimale lichtsterkte van 300 lux aanwezig;

      o. de in- en uitgangen van de stalruimte zijn afsluitbaar. Bij de in- en uitgangen zijn ten behoeve van schoeisel
      deugdelijke ontsmettingsbakken aanwezig. De inhoud van de ontsmettingsbakken wordt tenminste bij de aanvang van een
      blokperiode ververst met ontsmettingsmiddelen. De inhoud van de ontsmettingsbakken is zodanig dat te allen tijde
      afdoende ontsmetting mogelijk is;

      p. er is zoveel stalruimte aanwezig dat de aan- en afvoer van runderen per blokperiode ongestoord kan verlopen;

      q. de op het runderverzamelcentrum aanwezige stalruimte en de laad- en losplaatsen zijn voorzien van een gesloten
      dakbedekking, windkerende wanden en een klimaatsregelingssysteem zodanig dat de stalruimte en de laad- en
      losplaatsen onder alle klimatologische omstandigheden deugdelijk en efficiënt gereinigd en ontsmet kunnen worden;

      r. het vloeroppervlak van de stalruimte bestaat geheel uit voor water ondoordringbaar materiaal. De wanden van deze
      ruimten bestaan, voorzover deze niet hoger zijn dan 2,5 meter boven het vloeroppervlak, geheel, dan wel, voorzover
      deze hoger zijn dan 2,5 meter boven het vloeroppervlak, tot een hoogte van 2,5 meter uit voor water ondoordringbaar
      en niet poreus materiaal, zodat deze steeds gereinigd en ontsmet kunnen worden;

      s. op het terrein zijn één of meerdere wasplaatsen aanwezig voor de reiniging en
      ontsmetting van vervoermiddelen. De wasplaatsen zijn geregistreerd op grond van
      [artikel 23, eerste lid, van de Regeling inzake hygiënevoorschriften besmettelijke dierziekten 2000][ref2];

      t. op het terrein zijn één of meerdere reinigings- en ontsmettingsinstallaties of -inrichtingen aanwezig voor
      de reiniging en ontsmetting van het terrein, de stalruimten en overige voorzieningen. Deze installaties en
      inrichtingen voldoen aan de volgende voorwaarden:

        - ten behoeve van reiniging en ontsmetting is levering van warm water van tenminste 70 °C en koud water, beide met
      voldoende hoge druk mogelijk;
        - bij besproeiing onder hoge druk kan een detergens worden aangebracht die het oppervlak reinigt;
        - door verneveling of anderszins kan ontsmettingsmiddel op het gereinigde oppervlak worden aangebracht en
        - efficiënte en deugdelijke reiniging en ontsmetting van het gehele verharde terrein als bedoeld in de onderdelen d
      en r, moet mogelijk zijn;

      u. het bij reiniging en ontsmetting gebruikte water dient op regelmatige afstanden af te vloeien naar de gierkelder
      of naar de met roosters afgedekte kolken;

      v. voor de mogelijkheid tot controle op reiniging en ontsmetting geldt een minimale lichtsterkte van 300 lux;

      w. op het runderverzamelcentrum zijn een in- en uitslagregister dan wel een elektronische informatiedrager met
      gegevens over de in- en uitslag aanwezig waarin onmiddellijk na aankomst onderscheidenlijk voor vertrek van
      de runderen onder vermelding van het aantal runderen, de datum van aankomst en vertrek, het herkomstbedrijf
      en de eigenaar en het bestemmingsadres van de runderen worden bijgehouden door middel van registratie van de
      identificatie van alle runderen die het runderverzamelcentrum passeren, zodanig dat een directe koppeling tussen de
      in- en uitslag per rund mogelijk is. De voor aan- en afvoer gebruikte vervoermiddelen worden eveneens onmiddellijk
      na aankomst onderscheidenlijk vertrek onder vermelding van de registratienummers van de vervoerders alsmede van
      het vervoermiddel in het register dan wel in de elektronische informatiedrager bijgehouden alsmede bij export van
      de runderen het serienummer van het gezondheidscertificaat. De houder van het runderverzamelcentrum administreert
      zodanig, dat de keuringsdierenarts aan de hand van het register alle op het runderverzamelcentrum aangevoerde,
      aanwezige en afgeleverde runderen, de vervoerders en de vervoermiddelen waarmee de runderen werden getransporteerd,
      kan traceren. De gegevens bedoeld in dit onderdeel worden minimaal drie jaren bewaard;

      x. op het runderverzamelcentrum is een logboek aanwezig waarin door of namens de eigenaar van het
      runderverzamelcentrum de volgende gegevens worden bijgehouden:

        - type, concentratie en hoeveelheid van de ter ontsmetting gebruikte ontsmettingsmiddelen;
        - datum en tijdstip van door de keuringsdierenarts of de assistent uitgevoerde inspecties;
        - beschrijving van die gevallen waarin door de keuringsdierenarts of de assistent is geconstateerd dat niet aan
      de in deze regeling gestelde eisen of andere op het runderverzamelcentrum, onderscheidenlijk de eigenaar van het
      runderverzamelcentrum van toepassing zijnde regelgeving is voldaan, alsmede de in verband met die constateringen
      door de keuringsdierenarts of de assistent gegeven instructies, en
        - de datum waarop de opheffing van de geconstateerde tekortkomingen zal zijn voorzien.

      y. indien een runderverzamelcentrum meerdere epidemiologische bedrijfseenheden omvat die voor het verzamelen
      van fokrunderen worden gebruikt overeenkomstig [artikel 9d, onderdelen k tot en met o][ref3], beschikt elke
      epidemiologische bedrijfseenheid over een hygiënesluis die is voorzien van omkleed-, wasfaciliteiten en is in de
      onmiddellijke nabijheid een toilet aanwezig. Schone bedrijfskleding en laarzen zijn in de hygiënesluis aanwezig;

      z. Indien op het runderverzamelcentrum weiderunderen bijeen worden gebracht is op het centrum een door de Minister
      goedgekeurd protocol aanwezig waarin is voorzien in de controle op de aanvoer op het vetweiderijbedrijf van
      weiderunderen die van het runderverzamelcentrum naar het vetweiderijbedrijf zijn afgevoerd. Het protocol voldoet
      tenminste aan de in [bijlage V][ref4] aangegeven voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0011441#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0012010#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0011441#Artikel9d
      [ref4]: https://wetten.overheid.nl/BWBR0011441
    url: https://wetten.overheid.nl/BWBR0011441/2005-01-01#Artikel9c
