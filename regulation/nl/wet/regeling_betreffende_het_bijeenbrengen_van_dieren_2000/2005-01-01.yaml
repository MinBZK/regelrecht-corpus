  - number: 9t
    text: |-
      1 De organisator stelt tenminste 30 dagen voorafgaand aan de datum waarop de tentoonstelling of keuring
      zal plaatsvinden de VWA schriftelijk in kennis van naam, adres en telefoonnummer van de organisator van de
      tentoonstelling of keuring, de datum en plaats, alsmede het UBN van de plaats, en het aantal runderen, schapen of
      geiten dat wordt tentoongesteld of gekeurd.

      2 De houder of eigenaar van de tentoon te stellen of te keuren runderen, schapen of geiten laat deze binnen vijf
      dagen voorafgaand aan de tentoonstelling of keuring door een dierenarts klinisch onderzoeken.

      3 Van het onderzoek, bedoeld in het tweede lid, wordt door de dierenarts en de houder of eigenaar
      van de runderen, schapen of geiten een verklaring opgesteld volgens het model in [bijlage IV][ref1],
      waarin tenminste zijn opgenomen de identificatienummers, zoals voorgeschreven krachtens het
      [Besluit identificatie en registratie van dieren][ref2], alsmede de naam van de houder of eigenaar van de runderen,
      schapen of geiten en het adres van het herkomstbedrijf van de runderen, schapen of geiten.

      4 De organisator stelt voor aanvang van de tentoonstelling of keuring zeker dat de schapen of geiten individueel
      geregistreerd staan bij de Gezondheidsdienst voor Dieren en laat runderen, schapen of geiten slechts toe tot
      de plaats indien zij vergezeld gaan van de door de dierenarts en de houder of eigenaar ondertekende verklaring,
      bedoeld in het derde lid.

      5 De tentoon te stellen of te keuren runderen, schapen of geiten worden uitsluitend op de plaats aangevoerd en van
      de plaats afgevoerd met vervoermiddelen waarvoor krachtens de [Wegenverkeerswet 1994][ref3] een kentekenbewijs of
      registratiebewijs is afgegeven.

      6 Op de plaats zijn tegelijk met runderen, schapen of geiten geen andere evenhoevigen aanwezig.

      7 De plaats is zodanig ingericht dat verschillende aanwezige diersoorten niet met elkaar in contact kunnen komen.

      8 Runderen, schapen of geiten worden zo spoedig mogelijk na afloop van de tentoonstelling of keuring rechtstreeks
      vervoerd naar:

      a. hetzij een in Nederland gelegen slachthuis;

      b. hetzij het bedrijf van herkomst.

      9 In afwijking van [artikel 9a, derde lid][ref4], onderscheidenlijk [artikel 9k, derde lid][ref5], is het
      toegestaan runderen onderscheidenlijk schapen of geiten, afkomstig van verschillende bedrijven, op één
      vervoermiddel bijeen te brengen ten behoeve van het vervoer naar een tentoonstelling of keuring en dezelfde
      runderen onderscheidenlijk schapen of geiten na afloop van de tentoonstelling of keuring hetzij op de bedrijven van
      herkomst hetzij op een slachterij als bedoeld in het achtste lid, af te leveren.

      10 Het in
      [artikel 10, eerste lid, van de Regeling aanvullende voorschriften besmettelijke dierziekten en zoönosen][ref6]
      bedoelde verbod geldt niet voor de rechtstreekse afvoer van runderen naar een slachthuis indien deze runderen, na
      een tentoonstelling of keuring, zijn vervoerd naar het bedrijf van herkomst, als bedoeld in het achtste lid.

      11 Indien de dieren, bedoeld in het achtste lid, naar het bedrijf van herkomst worden vervoerd is
      [artikel 10, zesde lid, van de Regeling aanvullende voorschriften besmettelijke dierziekten en zoönosen][ref7],
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011441
      [ref2]: https://wetten.overheid.nl/BWBR0009019
