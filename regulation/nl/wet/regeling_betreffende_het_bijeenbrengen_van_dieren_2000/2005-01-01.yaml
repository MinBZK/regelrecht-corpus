  - number: '5'
    text: |-
      De erkenning, bedoeld in [artikel 4][ref1], wordt verleend indien het varkensverzamelcentrum voldoet aan de in
      [bijlage I][ref2] bij de onderhavige regeling vermelde eisen en voor het betreffende varkensverzamelcentrum geen
      subsidie is verleend op grond van de [Subsidieregeling sanering verzamelcentra varkens][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011441#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011441
      [ref3]: https://wetten.overheid.nl/BWBR0009818
