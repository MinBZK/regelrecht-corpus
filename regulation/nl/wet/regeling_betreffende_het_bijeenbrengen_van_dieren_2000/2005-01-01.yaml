preamble:
  text: |-
    Gelet op de artikelen 10, eerste en tweede lid, onderdeel c, 11, eerste lid, 17, 18, 30, 77, 81 en 94 van de
    Gezondheids- en welzijnswet voor dieren;

    Voorts gelet op artikel 2, tweede lid, artikel 3, tweede lid, onderdelen b, c en d, artikel 4, artikel 5, tweede
    en derde lid, artikel 6, eerste lid en artikel 11, eerste tot en met vierde lid, van Richtlijn 64/432/EEG inzake
    veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire handelsverkeer in runderen en varkens,
    zoals gewijzigd bij Richtlijn 97/12/EG van de Raad van de Europese Unie van 17 maart 1997 (PbEG L 109) en op
    Richtlijn 92/66/EEG van de Raad van de Europese Gemeenschappen van 14 juli 1992 tot vaststelling van communautaire
    maatregelen voor de bestrijding van de ziekte van Newcastle (PbEG L 260),

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011441/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             wet:

              [Gezondheids- en welzijnswet voor dieren][ref1];



            b
             verzamelen van varkens:

              op één plaats tijdelijk bijeenbrengen van varkens, afkomstig van verschillende plaatsen;



            c
             varkensverzamelcentrum:

              plaats in Nederland ten behoeve van de verzameling van varkens;



            d
             runderverzamelcentrum:

              plaats in Nederland ten behoeve van het bijeenbrengen van runderen.



            e
             eerste verzameling:

              eerste aanvoer van varkens, runderen, schapen, of geiten, op onderscheidenlijk een varkensverzamelcentrum,
      een runderverzamelcentrum, een schapenverzamelcentrum, of een geitenverzamelcentrum, nadat dit is ontvolkt,
      gereinigd en ontsmet dan wel, indien op een runderverzamelcentrum met meerdere epidemiologische bedrijfseenheden
      fokrunderen worden aangevoerd, eerste aanvoer van fokrunderen op een epidemiologische bedrijfseenheid nadat deze is
      ontvolkt, gereinigd en ontsmet;



            f
             VWA:

              de Voedsel en Waren Autoriteit, ingesteld bij het [Besluit organisatie VWA][ref2];



            g
             werkzaamheden:

              controle als bedoeld in [artikel 18, tweede lid, van de wet][ref3];



            h
             openingstijd:

              periode van maandag tot en met vrijdag, met uitzondering van algemeen erkende feestdagen, van 07.00 uur tot
      18.00 uur;



            i
             werkdag:

              dag, niet zijnde een zaterdag, zondag of algemeen erkende feestdag;



            j
             algemeen erkende feestdag:

              de Nieuwjaarsdag, de Christelijke tweede Paas- en Pinksterdag, de beide Kerstdagen, de Hemelvaartsdag, de
      dag waarop de verjaardag van de Koning(in) wordt gevierd en de vijfde mei;



            k
             aanbieder:

              exploitant, eigenaar of diens vertegenwoordiger van onderscheidenlijk een varkensverzamelcentrum, een
      runderverzamelcentrum, een schapenverzamelcentrum, of een geitenverzamelcentrum;



            l
             kwartier:

              spanne tijd van één vierde deel van een uur, of enkel gedeelte daarvan, die of dat besteed is of zou zijn
      aan de werkzaamheden, met uitzondering van reistijd;



            m
             starttarief:

              toeslag op het tarief voor werkzaamheden die op één dag, in één aaneengesloten periode, reguliere pauzes
      daaronder begrepen, voor één aanbieder op één plaats worden verricht;



            n
             vervoermiddel:

              voertuig, waaronder mede begrepen een combinatie van een voertuig met één of meer door dat voertuig
      voortbewogen aanhangwagens, opleggers of containers;



            o
             vervoerseenheid:

              voertuig dat of aanhangwagen, oplegger of container die deel uitmaakt van een combinatie als bedoeld in
      onderdeel m;



            p
             blokperiode:

              tijdseenheid, die begint vanaf het tijdstip van eerste verzameling, van:
              ten hoogste 48 uur op een schapenverzamelcentrum, of
      ten hoogste 144 uur op een runderverzamelcentrum, voorzover het fokrunderen betreft die zijn bestemd voor export
      naar een lidstaat van de Europese Unie, niet zijnde Nederland, of
      ten hoogste 30 dagen op een runderverzamelcentrum, voorzover het fokrunderen betreft die zijn bestemd voor export
      naar een land niet zijnde Nederland en niet zijnde een lidstaat van de Europese Unie, of
      ten hoogste 24 uur op een varkensverzamelcentrum, geitenverzamelcentrum, onderscheidenlijk runderverzamelcentrum
      voorzover het varkens, geiten, onderscheidenlijk andere runderen dan fokrunderen betreft.



            q
             beslag:

              op een bedrijf als een afzonderlijke epidemiologische eenheid gehouden varkens of groep varkens
      onderscheidenlijk rund of groep runderen met eenzelfde gezondheidsstatus;



            r
             aanvoerstal:

              ruimte waar varkens binnen het varkensverzamelcentrum verblijven na aanvoer op het varkensverzamelcentrum
      voordat zij worden geselecteerd naar bestemmingsadres;



            s
             selectieruimte:

              ruimte binnen het varkensverzamelcentrum waar varkens worden geselecteerd naar bestemmingsadres;



            t
             afvoerstal:

              ruimte waar varkens binnen het varkensverzamelcentrum verblijven nadat zij ten behoeve van de afvoer zijn
      geselecteerd naar bestemmingsadres;



            u
             de export:

              het anders dan in doorvoer buiten Nederland brengen;



            v
             certificaat:

              schriftelijke verklaring naar aanleiding van de onder g genoemde werkzaamheden;



            w
             dierenarts:

              bevoegde, door de VWA met werkzaamheden belaste dierenarts;



            x
             assistent:

              door de VWA met werkzaamheden belaste persoon, niet zijnde een dierenarts;



            y

              [richtlijn 64/432/EEG](31964L0432):

              [richtlijn nr. 64/432/EEG](31964L0432) van de Raad van de Europese Gemeenschappen van 26 juni 1964 inzake
      veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire handelsverkeer in runderen en varkens
      (PbEG L 121);



            z

              [richtlijn 92/102/EEG](31992L0102):

              [richtlijn nr. 92/102/EEG](31992L0102) van de Raad van de Europese Gemeenschappen van 27 november 1992 met
      betrekking tot de identificatie en de registratie van dieren (PbEG L 335);



            aa
            fokrunderen:

              runderen, ouder dan 2 maanden en jonger dan 50 maanden, die kennelijk zijn bestemd voor de fokkerij in een
      land, niet zijnde Nederland;



            bb
             slachtrunderen:

              runderen, die kennelijk zijn bestemd om te worden geslacht;



            cc
             mesterij:

              bedrijf of onderdeel van een bedrijf waar runderen, jonger dan 12 maanden, worden gehouden die zijn bestemd
      om te worden afgevoerd naar een slachthuis;



            dd
             starterbedrijf:

              bedrijf of onderdeel van een bedrijf waar runderen, jonger dan 16 weken, worden gehouden die zijn bestemd
      om te worden afgevoerd naar een mesterij;



            ee
             epidemiologische bedrijfseenheid:

              afgescheiden stalruimte op een runderverzamelcentrum ten behoeve van de huisvesting van een beslag dat
      zodanig is gesitueerd dat geen contact met de overige op het verzamelcentrum aanwezige beslagen mogelijk is, met
      dien verstande dat wanneer meerdere epidemiologische bedrijfseenheden zijn ondergebracht in een gebouw de voor elke
      epidemiologische bedrijfseenheid bestemde ruimte fysiek door middel van geheel gesloten wanden gescheiden is van de
      voor de overige epidemiologische bedrijfseenheden bestemde ruimten;



            ff
            schapenverzamelcentrum:

              plaats in Nederland ten behoeve van de verzameling van schapen;



            gg
            geitenverzamelcentrum:

              plaats in Nederland ten behoeve van de verzameling van geiten;



            hh
             afleveringsvoorziening:

              fysiek afgescheiden ruimte waarin varkens binnen een bedrijf verblijven nadat zij zijn geselecteerd ten
      behoeve van de afvoer naar het slachthuis welke ruimte niet is ondergebracht in een gebouw waarbinnen de overige op
      het bedrijf aanwezige varkens zich bevinden;



            ii
             weiderunderen:

              vrouwelijke runderen, ouder dan 12 maanden, die kennelijk zijn bestemd om te worden afgevoerd naar een
      vetweiderijbedrijf;



            jj
             vetweiderijbedrijf:

              bedrijf waar uitsluitend runderen worden gehouden die zijn bestemd om rechtstreeks te worden afgevoerd naar
      een slachthuis;



            kk
             Minister:

              Minister van Landbouw, Natuur en Voedselkwaliteit.


