  - number: 9j
    text: |-
      Deze paragraaf geldt in zoverre in aanvulling op het koninklijk besluit van 1 mei 1975 houdende voorschriften
      betreffende het veeartsenijkundig toezicht op veemarkten (Stb. 247).
    url: https://wetten.overheid.nl/BWBR0011441/2005-01-01#Artikel9j
  - number: 9k
    text: |-
      1 Onverminderd het bepaalde in de [Regeling handel levende dieren en levende producten][ref1] is het verboden
      schapen of geiten afkomstig van verschillende plaatsen op een plaats voor een kortere periode dan 21 dagen bijeen
      te brengen.

      2 Het in het eerste lid bedoelde verbod geldt niet indien de schapen of geiten worden bijeengebracht op een
      schapenverzamelcentrum, onderscheidenlijk een geitenverzamelcentrum, dat op grond van [artikel 9l][ref2]
      door de Minister is erkend, of een erkende bedrijfsruimte van een erkende handelaar als bedoeld in
      [artikel 7.9, eerste en tweede lid, van de Regeling handel levende dieren en levende producten][ref3].

      3 Het in het eerste lid bedoelde verbod geldt niet voor het bijeenbrengen van schapen of geiten op een
      vervoermiddel, mits vervolgens lossing van het gehele vervoermiddel geschiedt op één slachthuis of één
      schapenverzamelcentrum, onderscheidenlijk één geitenverzamelcentrum.

      4 Het in het eerste lid bedoelde verbod geldt niet voor het bijeenbrengen van geiten, jonger dan vier weken,
      afkomstig van een bedrijf dat uitsluitend is ingericht op het houden van geiten voor melkproductie, op een
      vervoermiddel, mits vervolgens lossing geschiedt op één in Nederland gelegen bedrijf dat:

      a. is geregistreerd bij de Minister en

      b. geiten uitsluitend afvoert naar een slachthuis.

      5 Het bijeenbrengen van schapen of geiten als bedoeld in het derde lid geschiedt

      a. op het bedrijf van afvoer, grenzend aan de openbare weg, of

      b. voorzover aanwezig, vanaf een voorziening op het bedrijf van afvoer waar de af te voeren schapen of geiten
      tijdelijk bijeengebracht worden met het oog op het bijeenbrengen op een vervoermiddel.

      6 Het in het eerste lid bedoelde verbod geldt niet voor het bijeenbrengen van schapen of geiten op een slachthuis.

      7 Het is verboden schapen of geiten af te voeren van een slachthuis.

      8 De registratie, bedoeld in het vierde lid, onderdeel a, geschiedt met gebruikmaking van een daartoe ter
      beschikking gesteld formulier.


