      De krachtens artikel 4 van de Regeling betreffende het bijeenbrengen van dieren verleende erkenningen worden geacht
      te zijn verleend op grond van artikel 4 van deze regeling.
    url: https://wetten.overheid.nl/BWBR0011441/2005-01-01#Artikel17
