  - number: 9f
    text: |-
      1 De afvoer van slachtrunderen, bedoeld in [artikel 9d, onderdeel a, onder 2][ref1]), van een op grond van
      [artikel 9b][ref2] erkend runderverzamelcentrum geschiedt rechtstreeks en uitsluitend naar een al dan niet in
      Nederland gelegen slachthuis.

      2 De afvoer van slachtrunderen, bedoeld in [artikel 9d, onderdeel a, onder 2][ref3]), naar een
      niet in Nederland gelegen slachthuis geschiedt met inachtneming van de [Hoofdstukken 2][ref4] en
      [3 van de Regeling handel levende dieren en levende producten][ref5].

      3 Het is verboden op een bedrijf, niet zijnde een slachterij, slachtrunderen afkomstig van een
      runderverzamelcentrum te ontvangen.


