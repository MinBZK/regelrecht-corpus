  - number: 9d
    text: |-
      1 Een runderverzamelcentrum, dat erkend is op grond van [artikel 9b][ref1], voldoet aan [artikel 9c][ref2] en aan
      de volgende eisen:

      a. op het runderverzamelcentrum zijn gelijktijdig uitsluitend runderen behorende tot een van de volgende
      categorieën runderen aanwezig:

      1) fokrunderen;

      2) slachtrunderen;

      3) runderen, jonger dan 12 maanden, of

      4) weiderunderen;

      b. op het runderverzamelcentrum zijn, met inachtneming van onderdeel a, tegelijk met de runderen geen andere dieren
      aanwezig;

      c. gedurende een blokperiode worden uitsluitend runderen bijeengebracht met eenzelfde gezondheidsstatus;

      d. de aanbieder controleert bij aanvoer van de runderen dat zij overeenkomstig [Verordening (EG) nr.1760/2000]
      (32000R1760) van het Europees Parlement en de Raad van de Europese Unie van 17 juli 2000 tot vaststelling van een
      identificatie- en registratieregeling voor runderen en inzake de etikettering van rundvlees en rundvleesproducten
      en tot intrekking van [Verordening (EG) nr.820/97](31997R0820) van de Raad van de Europese Unie (PbEG L 204)
      zijn geïdentificeerd, hetgeen voor uit Nederland afkomstige runderen betekent dat zij overeenkomstig het bij
      of krachtens het [Besluit identificatie en registratie van dieren][ref3] bepaalde zijn geïdentificeerd alsmede
      dat de runderen overeenkomstig het bepaalde bij of krachtens de Verordening zelfcontrole op het verbod gebruik
      van bepaalde stoffen van het Productschap Vee en Vlees zijn aangevoerd. De aanbieder toont ten genoegen van de
      keuringsdierenarts of de assistent aan dat voldaan is aan voornoemde controle.

      e. slechts slachtrunderen uit andere lidstaten worden met inachtneming van onderdeel a tot een verzamelcentrum
      toegelaten indien zij vergezeld gaan van een voor de slachtrunderen afgegeven gezondheidscertificaat, als bedoeld
      in artikel 5 van [richtlijn 64/432/EEG](31964L0432), waarvan de geldigheidsduur nog niet is verstreken;

      f. slechts runderen die afkomstig zijn van beslagen die officieel vrij zijn van brucellose, tuberculose en leukose
      worden met inachtneming van onderdeel a op het runderverzamelcentrum bijeengebracht;

      g. aan het einde van de blokperiode wordt het runderverzamelcentrum onderscheidenlijk de epidemiologische
      bedrijfseenheid ontvolkt;

      h. onmiddellijk na iedere ontvolking wordt het runderverzamelcentrum onderscheidenlijk de epidemiologische
      bedrijfseenheid gereinigd en ontsmet volgens een door de Minister goedgekeurd protocol met ontsmettingsmiddelen die
      voor dat doel zijn toegelaten op grond van de [Bestrijdingsmiddelenwet 1962][ref4]. De aanbieder toont ten genoegen
      van de keuringsdierenarts of de assistent aan dat voldaan is aan voornoemde reiniging en ontsmetting;

      i. de aanbieder meldt de aanvang en het einde van elke blokperiode uiterlijk om 14.00 uur op de werkdag
      voorafgaande aan de blokperiode aan de VWA;

      j. de in- en uitgang van het runderverzamelcentrum onderscheidenlijk de epidemiologische bedrijfseenheid worden
      op dagen waarop aan- en afvoer van runderen heeft plaatsgevonden na beëindiging van de werkzaamheden gereinigd
      en ontsmet;

      k. bij het gebruik van epidemiologische bedrijfseenheden voor het verzamelen van fokrunderen overeenkomstig de
      onderdelen l tot en met o worden de volgende eisen in acht genomen:

        - voordat personen een epidemiologische bedrijfseenheid betreden, reinigen zij zich in de hygiënesluis en voorzien
      zij zich in de hygiënesluis van schone bedrijfskleding en schone laarzen;
        - per afzonderlijke epidemiologische bedrijfseenheid worden afzonderlijke werktuigen en stalmaterieel gebruikt;
        - het laden en lossen van een epidemiologische bedrijfseenheid vindt in tijd of plaats gescheiden plaats van het
      laden en lossen van andere epidemiologische bedrijfseenheden, en
        - onverminderd de onderdelen l en m, zijn in een epidemiologische bedrijfseenheid niet zowel fokrunderen bestemd
      voor de export naar een lidstaat van de EU, niet zijnde Nederland, als fokrunderen bestemd voor de export naar een
      land, niet zijnde een lidstaat van de Europese Unie en niet zijnde Nederland, aanwezig;

      l. fokrunderen worden na binnenkomst in de epidemiologische bedrijfseenheid niet meer verplaatst, behoudens ten
      behoeve van:

        - de afvoer van het verzamelcentrum overeenkomstig [artikel 9e][ref5], of
        - het overbrengen naar een andere binnen het runderverzamelcentrum gelegen epidemiologische bedrijfseenheid;

      m. het overbrengen van fokrunderen naar een andere epidemiologische bedrijfseenheid, bedoeld in onderdeel l, tweede
      gedachtenstreepje, geschiedt uitsluitend van een epidemiologische bedrijfseenheid waar fokrunderen verblijven
      bestemd voor een lidstaat van de Europese Unie, niet zijnde Nederland:

        - naar een epidemiologische bedrijfseenheid waar fokrunderen verblijven bestemd voor een lidstaat van de Europese
      Unie, niet zijnde Nederland, met dien verstande dat het desbetreffende fokrund uiterlijk 144 uur na aanvoer op het
      runderverzamelcentrum, overeenkomstig [artikel 9e][ref6] van het runderverzamelcentrum wordt afgevoerd, of
        - een epidemiologische bedrijfseenheid waar fokrunderen verblijven bestemd voor de export naar een land niet
      zijnde een lidstaat van de Europese Unie en niet zijnde Nederland, met dien verstande dat het desbetreffende
      fokrund uiterlijk 30 dagen na aanvoer op het runderverzamelcentrum, overeenkomstig [artikel 9e][ref7] van het
      runderverzamelcentrum wordt afgevoerd;

      n. een fokrund wordt in een periode van 30 dagen ten hoogste eenmaal overgebracht naar een andere epidemiologische
      bedrijfseenheid, bedoeld in onderdeel l, tweede gedachtenstreepje;

      o. van het overbrengen naar een andere epidemiologische bedrijfseenheid, bedoeld in onderdeel l, tweede
      gedachtestreepje, wordt mededeling gedaan aan de VWA met gebruikmaking van een daartoe ter beschikking gesteld
      formulier;

      p. indien weiderunderen van een runderverzamelcentrum naar een vetweiderijbedrijf worden afgevoerd controleert de
      eigenaar of de exploitant van het runderverzamelcentrum, overeenkomstig het in [artikel 9c, onderdeel z][ref8],
      bedoelde protocol, binnen een termijn van 4 werkdagen of deze runderen op het vetweiderijbedrijf zijn aangevoerd;

      q. indien de eigenaar of de exploitant van het runderverzamelcentrum, overeenkomstig onderdeel p, constateert dat
      weiderunderen niet zijn aangevoerd geeft hij hiervan onmiddellijk kennis aan de dierenarts of de assistent.

      2 In afwijking van het eerste lid, onderdeel a, is het toegestaan op een runderverzamelcentrum fokrunderen en
      runderen, jonger dan 12 maanden, aanwezig te hebben, mits de fokrunderen en de runderen, jonger dan 12 maanden, van
      elkaar gescheiden worden gehouden door middel van epidemiologische eenheden en de aan- of afvoer van fokrunderen
      niet geschiedt op dagen waarop runderen, jonger dan 12 maanden, aan- of afgevoerd worden.


