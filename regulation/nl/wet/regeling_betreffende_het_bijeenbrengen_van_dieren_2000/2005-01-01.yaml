  - number: '2'
    text: Het verzamelen van varkens is verboden.
    url: https://wetten.overheid.nl/BWBR0011441/2005-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het in [artikel 2][ref1] bedoelde verbod geldt niet voorzover het verzamelen betrekking heeft op:

      a. het bijladen op één vervoermiddel van varkens ten vervoer naar een slachthuis, mits is voldaan aan het tweede
      lid; of

      b. het bijladen op één vervoermiddel van varkens bestemd voor de slacht, niet zijnde meer dan licht zieke
      of meer dan licht gewonde varkens in de zin van het [Besluit dierenvervoer 1994][ref2] ten vervoer naar een
      verzamelcentrum, mits is voldaan aan het tweede lid; of

      c. het opladen op één vervoermiddel dat uit een combinatie van een voertuig met één of meer aanhangwagens bestaat
      van varkens, mits is voldaan aan het derde lid.

      2 Voor het bijladen, bedoeld in het eerste lid, onderdeel a en b, geldt dat:

      a. op het betrokken vervoermiddel per rit naar een slachthuis onderscheidenlijk verzamelcentrum zich varkens van
      ten hoogste drie verschillende bedrijven, niet zijnde verzamelcentra, bevinden;

      b. het vervoermiddel, waarop de varkens worden bijgeladen, niet op het bedrijf wordt gebracht, waarop de bij te
      laden varkens zich bevinden;

      c. indien de bij te laden varkens met een vervoermiddel vanaf het bedrijf worden gebracht naar het vervoermiddel
      waarop zij worden bijgeladen, het eerstbedoelde vervoermiddel niet op de openbare weg wordt gebracht en

      d. in het betrokken vervoermiddel door middel van een toegankelijk overzicht vanaf het moment van inladen wordt
      bijgehouden van welke bedrijven de bij het bijladen betrokken varkens afkomstig zijn, welk overzicht gedurende
      zes maanden na de dag waarop het bijladen heeft plaatsgevonden, op het bedrijf of de onderneming van de vervoerder
      wordt bewaard.

      3 Voor het opladen, bedoeld in het eerste lid, onderdeel c, geldt dat:

      a. op iedere afzonderlijke vervoerseenheid slechts varkens aanwezig zijn die blijkens het begeleidende
      vervoersdocument alle gelijktijdig van hetzelfde bedrijf, niet zijnde een verzamelcentrum, of, indien het bedrijf
      bestaat uit meer vestigingen, van dezelfde vestiging zijn afgevoerd;

      b. bij het opladen geen vervoerseenheid op het bedrijf wordt gebracht die ten behoeve van het betrokken transport
      reeds op een ander bedrijf is geweest, en

      c. indien bij het opladen op de ene vervoerseenheid voorwerpen worden gebruikt die behoren tot een andere
      vervoerseenheid, die voorwerpen na gebruik worden gereinigd en ontsmet.

      4 Indien de varkens, bedoeld in het eerste lid, onderdelen a en b, rechtstreeks uit een afleveringsvoorziening
      worden bijgeladen, is het in afwijking van het tweede lid, onderdeel b, toegestaan het vervoermiddel, waarop de
      varkens worden bijgeladen, op het bedrijf te brengen.

      5 Onverminderd het bepaalde in het tweede lid, geldt voor het bijladen, bedoeld in het vierde lid, dat:

      a. indien de bij te laden varkens afkomstig zijn van een A- of een C-bedrijf, als bedoeld in de
      [Regeling varkensleveringen][ref3], de overige reeds op het vervoermiddel aanwezige varkens eveneens afkomstig zijn
      van een A- of een C-bedrijf;

      b. indien de bij te laden varkens afkomstig zijn van een B-bedrijf als bedoeld in de
      [Regeling varkensleveringen][ref4], de overige reeds op het vervoermiddel aanwezige varkens niet afkomstig zijn van
      een D-bedrijf als bedoeld in de [Regeling varkensleveringen][ref5];

      c. de vervoerder de laadklep van het vervoermiddel waarop de varkens worden bijgeladen, terstond na het bijladen op
      de plaats van bijlading reinigt en ontsmet;

      d. de eigenaar of exploitant, dan wel diens vertegenwoordiger, van het bedrijf waarop de bij te laden varkens zich
      bevinden, terstond na het bijladen de afleveringsvoorziening, bedoeld in het vierde lid, reinigt en ontsmet.

      6 Indien ingevolge het vierde lid wordt bijgeladen, vermeldt de vervoerder in een op het vervoermiddel aanwezig
      overzicht, van welke bedrijven de op- en bij te laden varkens afkomstig zijn, waarbij per bedrijf wordt aangegeven
      of het een A-, B, C-, of D-bedrijf betreft, als bedoeld in de [Regeling varkensleveringen][ref6], alsmede het
      tijdstip waarop de varkens worden op- en bijgeladen. Dit overzicht dient gedurende zes maanden na de dag waarop het
      bijladen heeft plaatsgevonden, op het bedrijf of de onderneming van de vervoerder worden bewaard.


