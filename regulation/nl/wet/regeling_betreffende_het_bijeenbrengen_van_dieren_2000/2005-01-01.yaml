  - number: '4'
    text: |-
      1

      Het in [artikel 2][ref1] bedoelde verbod geldt niet indien de varkens verzameld worden op een
      varkensverzamelcentrum dat voor de desbetreffende categorie varkens door de minister is erkend.

      2 [Artikel 6, eerste lid, onderdeel f][ref2], eerste zin, onderdelen k tot en met o,
      [artikel 6, tweede lid][ref3], en [artikel 8, tweede en derde lid][ref4], zijn niet van toepassing
      op varkens die op het terrein van een varkensverzamelcentrum worden aangevoerd, afkomstig zijn
      van één bedrijf en aan- en afgevoerd worden in hetzelfde vervoermiddel, mits voldaan wordt aan
      [artikel 4.4a van de Regeling handel levende dieren en levende producten][ref5].

      3 Het in [artikel 2][ref6] bedoelde verbod geldt niet voor het bijeenbrengen van varkens op een slachthuis.

      4 Het is verboden varkens af te voeren van een slachterij, met uitzondering van de afvoer van varkens in de
      categorieën 3 tot en met 6, bedoeld in de Bijlage van de Regeling tarieven keuring vlees en vleesproducten 1993,
      naar een door de Minister aangewezen inrichting ten behoeve van noodslachting.


