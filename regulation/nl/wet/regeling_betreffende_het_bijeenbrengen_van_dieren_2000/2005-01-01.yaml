  - number: 9n
    text: |-
      Een schapenverzamelcentrum, onderscheidenlijk geitenverzamelcentrum dat erkend is op grond van [artikel 9l][ref1],
      voldoet aan [artikel 9m][ref2] en aan de volgende eisen:

      a. op het schapenverzamelcentrum zijn tegelijk met de schapen geen andere dieren aanwezig;

      b. op het geitenverzamelcentrum zijn tegelijk met de geiten geen andere dieren aanwezig;

      c. gedurende een blokperiode worden uitsluitend schapen, onderscheidenlijk geiten, bijeengebracht met eenzelfde
      gezondheidsstatus;

      d. de aanbieder vergewist zich ervan dat ten aanzien van de aangevoerde schapen, onderscheidenlijk geiten, de
      krachtens het [Besluit identificatie en registratie van dieren][ref3] gestelde regels in acht zijn genomen;

      e. de aanbieder draagt er zorg voor dat de aangevoerde schapen, onderscheidenlijk geiten, terstond na aanvoer
      op het schapenverzamelcentrum, onderscheidenlijk geitenverzamelcentrum, worden gemerkt overeenkomstig de
      [Regeling identificatie en registratie van dieren 2003][ref4].

      f. aan het einde van de blokperiode wordt het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum,
      ontvolkt;

      g. onmiddellijk na iedere ontvolking wordt het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum,
      gereinigd en ontsmet volgens een door de Minister goedgekeurd protocol met ontsmettingsmiddelen die voor dat
      doel zijn toegelaten op grond van de [Bestrijdingsmiddelenwet 1962][ref5]. De aanbieder toont ten genoegen van de
      keuringsdierenarts of de assistent aan dat voldaan is aan voornoemde reiniging en ontsmetting;

      h. de aanbieder meldt de aanvang en het einde van elke blokperiode uiterlijk om 14.00 uur op de werkdag
      voorafgaande aan de blokperiode aan de VWA, en

      i. de in- en uitgang van het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, worden op
      dagen waarop aan- en afvoer van schapen, onderscheidenlijk geiten, heeft plaatsgevonden na beëindiging van de
      werkzaamheden gereinigd en ontsmet.


