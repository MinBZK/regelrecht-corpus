  - number: 9i
    text: |-
      1 De Minister kan de erkenning, bedoeld in [artikel 9b][ref1], met onmiddellijke ingang schorsen voor een bepaalde
      termijn indien naar het oordeel van de Minister niet wordt voldaan aan de eisen, bedoeld in de [artikelen 9c][ref2]
      tot en met [9g][ref3], en veterinaire belangen de schorsing rechtvaardigen.

      2 De Minister kan de erkenning, bedoeld in [artikel 9b][ref4], intrekken, indien:

      a. naar het oordeel van de Minister blijkt dat het runderverzamelcentrum niet voldoet aan de eisen, bedoeld in de
      [artikelen 9c][ref5] tot en met [9g][ref6], terwijl de exploitant van de inrichting in de gelegenheid is gesteld
      binnen een bepaalde termijn alsnog aan de eisen te voldoen en deze termijn inmiddels is verstreken, dan wel

      b. indien na afloop van de schorsing, bedoeld in het eerste lid, naar het oordeel van de Minister blijkt dat
      het runderverzamelcentrum nog steeds niet voldoet aan de eisen, bedoeld in de [artikelen 9c][ref7] tot en met
      [9g][ref8].

      3 De registratie van een starterbedrijf, bedoeld in [artikel 9g, eerste lid, onderdeel d][ref9],
      kan door de Minister worden doorgehaald, indien het starterbedrijf niet voldoet aan
      [artikel 9g, eerste lid, onderdeel d][ref10], of [artikel 9h, tweede of derde lid][ref11].


