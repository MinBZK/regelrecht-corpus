  - number: '6'
    text: |-
      1 Een erkend varkensverzamelcentrum voldoet aan de eisen van bijlage I en aan de volgende eisen:

      a. de faciliteiten van het varkensverzamelcentrum worden gebruikt overeenkomstig hun functie;

      b. slechts op het varkensverzamelcentrum werkzame personen worden tot het varkensverzamelcentrum toegelaten;

      c. op het varkensvarkensverzamelcentrum zijn tegelijk met de varkens geen andere dieren aanwezig;

      d. ongedierte wordt op het varkensverzamelcentrum volgens een door de Minister goedgekeurd
      ongediertebestrijdingsprogramma bestreden;

      e.

      f. op het varkensverzamelcentrum, waarvoor ingevolge artikel 4 erkenning is verleend, worden slechts per
      blokperiode van maximaal 50 herkomstbedrijven varkens aangevoerd en, voorzover zij afkomstig zijn uit Nederland ter
      zake waarvan de Minister de aanbieder schriftelijk in kennis heeft gesteld tegen de aanvoer geen bezwaar te hebben.
      De aanbieder controleert bij aanvoer van de varkens dat zij overeenkomstig [richtlijn 92/102/EEG](31992L0102) zijn
      geïdentificeerd, hetgeen voor uit Nederland afkomstige varkens betekent dat zij overeenkomstig het bij of krachtens
      het Besluit identificatie en registratie van dieren bepaalde zijn geïdentificeerd en dat zij vergezeld gaan van
      identificatiedocumenten;

      g. slechts van officieel brucellose vrije beslagen afkomstige varkens met eenzelfde gezondheidsstatus worden binnen
      een blokperiode verzameld, met dien verstande dat varkens afkomstig uit Nederland, varkens afkomstig uit andere
      Lid-Staten van de Europese Unie dan Nederland die bestemd zijn voor de invoer en varkens afkomstig uit andere
      Lid-Staten van de Europese Unie dan Nederland die bestemd zijn voor de doorvoer niet tegelijkertijd binnen één
      blokperiode worden verzameld, en, indien het varkensverzamelcentrum erkend is voor zowel slachtvarkens als voor
      fok- en gebruikvarkens, gedurende een blokperiode niet tegelijkertijd slachtvarkens en fok- en gebruikvarkens
      worden verzameld;

      h. slechts varkens uit andere Lid-Staten van de Europese Unie dan Nederland worden tot een varkensverzamelcentrum
      toegelaten indien zij vergezeld gaan van een voor de betreffende categorie varkens afgegeven
      gezondheidscertificaat, als bedoeld in artikel 5 van [richtlijn 64/432/EEG](31964L0432), waarvan de geldigheidsduur
      nog niet is verstreken;

      i. aan het einde van de blokperiode wordt het varkensverzamelcentrum ontvolkt;

      j. onmiddellijk na iedere ontvolking wordt het varkensverzamelcentrum gereinigd en ontsmet met ontsmettingsmiddelen
      die voor dat doel zijn toegelaten op grond van de Bestrijdingsmiddelenwet 1962 volgens een door de Minister
      goedgekeurd protocol dat ter inzage ligt bij de VWA;

      k. de aangevoerde varkens worden onmiddellijk na lossing ondergebracht in een aanvoerstal;

      l. de varkens worden na aanvoer in de aanvoerstal niet meer verplaatst, behoudens ten behoeve van de verplaatsing
      naar de selectieruimte;

      m. de varkens worden stuksgewijs uit de aanvoerstal overgeplaatst naar de selectieruimte waar zij worden
      geselecteerd en vervolgens per bestemmingsadres gegroepeerd worden ondergebracht in de afvoerstal;

      n. de varkens worden na binnenkomst in de afvoerstal niet meer verplaatst, behoudens ten behoeve van de afvoer;

      o. ter zake van de afvoer van de varkens is per bestemmingsadres het aantal varkens per UBN bekend en bedraagt het
      aantal herkomstbedrijven per bestemmingsadres niet meer dan 30, met dien verstande dat wanneer het vervoermiddel
      uit één of meerdere vervoerseenheden bestaat het aantal herkomstbedrijven per vervoerseenheid niet meer dan 30
      bedraagt;

      p. de aanbieder meldt de aanvang en het einde van de blokperiode uiterlijk om 14.00 uur op de tweede werkdag
      voorafgaande aan de blokperiode aan de VWA.

      q. het varkensverzamelcentrum beschikt over een reinigings- en ontsmettingsplaats, welke is geregistreerd op grond
      van artikel 23, eerste lid, van de Regeling inzake hygiëne-voorschriften besmettelijke dierziekten 2000.

      2 De in het eerste lid, onderdelen k, l, m, en n vermelde eisen gelden niet indien het varkensverzamelcentrum niet
      uit een aanvoerstal, selectieruimte en afvoerstal bestaat, doch uit een algemene stalruimte waarbij:

        - de aangevoerde varkens onmiddellijk na lossing en gedurende één blokperiode per aanvoeradres gegroepeerd worden
      ondergebracht in de stalruimte en daarin niet meer, behoudens voor weging, worden verplaatst en
        - de aangevoerde varkens na één blokperiode slechts naar één bestemmingsadres worden afgevoerd.

      3 In afwijking van het eerste lid, onderdeel i, is het toegestaan slachtvarkens, voorzover zij afkomstig zijn uit
      Nederland, langer dan de blokperiode op het varkensverzamelcentrum te houden, voorzover:

      a. de slachtvarkens gegroepeerd per bestemmingsadres uiterlijk 24 uur na de eerste verzameling in een afzonderlijke
      overligstal verblijven;

      b. de slachtvarkens na aanvoer op de overligstal niet meer worden verplaatst;

      c. het varkensverzamelcentrum met inbegrip van de overligstal binnen 24 uur na aanvoer van de eerste varkens in de
      overligstal geheel wordt ontvolkt;

      d. het varkensverzamelcentrum met inbegrip van de overligstal onmiddellijk na iedere ontvolking van de overligstal
      wordt gereinigd en ontsmet en

      e. bij het afvoeren van de slachtvarkens wordt voldaan aan het vierde lid.

      4 Indien overeenkomstig het derde lid slachtvarkens langer op het varkensverzamelcentrum verblijven dan een
      blokperiode worden uitsluitend slachtvarkens op het varkensverzamelcentrum verzameld en geldt, behalve voor
      de overligstal, het bepaalde in het eerste lid, onderdelen i en j, onverkort voor het overige terrein van het
      varkensverzamelcentrum.

      5 Voor zover aanvoer van varkens als bedoeld in het eerste lid, onderdeel f, van slechts één in Nederland gelegen
      herkomstbedrijf plaatsvindt en aan- en afvoer plaatsvindt met hetzelfde vervoermiddel, is artikel 6, eerste lid,
      van de Regeling inzake hygiënevoorschriften besmettelijke dierziekten 2000 niet van toepassing.

      6 Indien ingevolge artikel 59, tweede lid, onderdeel e, van de wet en artikel 6, eerste lid, van het Besluit
      dierenvervoer 1994 op het terrein van een varkensverzamelcentrum voor het vervoer van varkens, afkomstig
      van slechts één herkomstbedrijf, geen gezondheidscertificaat wordt afgegeven, is het toegestaan deze varkens
      rechtstreeks en uitsluitend af te voeren naar een in Nederland gelegen slachthuis.
    url: https://wetten.overheid.nl/BWBR0011441/2005-01-01#Artikel6
  - number: '7'
    text: |-
      De erkenning, bedoeld in [artikel 4][ref1], wordt ingetrokken indien het varkensverzamelcentrum niet langer voldoet
      aan de eisen, bedoeld in de [artikelen 5][ref2] en [6][ref3].


