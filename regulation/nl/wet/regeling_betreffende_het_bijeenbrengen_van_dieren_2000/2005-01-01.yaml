  - number: '12'
    text: |-
      1 De [artikelen 8 tot en met 10 van de Regeling tarieven Gezondheids- en welzijnswet voor dieren][ref1] zijn van
      overeenkomstige toepassing, voorzover de strekking van die artikelen zich daartegen niet verzet.

      2 De aanbieder is een extra vergoeding verschuldigd boven de in [artikel 10][ref2] verschuldigde vergoedingen,
      bestaande uit een bedrag van

      a. € 5,71 per kwartier per voor de VWA met de werkzaamheden belaste indien de werkzaamheden later zijn aangemeld
      dan 14.00 uur van de werkdag voorafgaande aan de dag waarop de werkzaamheden zouden plaatsvinden;

      b. € 8,17 per kwartier dat door een keuringsdierenarts aan werkzaamheden besteed is ingeval deze plaatsvinden
      buiten openingstijd.

      c. € 5,71 per kwartier dat door een assistent aan werkzaamheden besteed is ingeval deze plaatsvinden buiten
      openingstijd.

      d. € 13,88 ingeval zowel de situatie, bedoeld in onderdeel a als b van toepassing is;

      e. € 11,42 ingeval zowel de situatie, bedoeld in onderdeel a als c van toepassing is.

      3 De aanbieder is boven de vergoeding, bedoeld in [artikel 10][ref3], een extra vergoeding verschuldigd voorzover
      door omstandigheden buiten toedoen van de met de werkzaamheden belaste persoon of personen, de werkzaamheden worden
      onderbroken of uitgesteld, bestaande uit een bedrag van

      a. € 28,65 per kwartier voor iedere keuringsdierenarts voor elk kwartier dat de onderbreking of het uitstel heeft
      geduurd, en

      b. € 17,03 per kwartier voor iedere assistent voor elk kwartier dat de onderbreking of het uitstel heeft geduurd.

      4 De aanbieder is boven de vergoeding, bedoeld in [artikel 10][ref4], een extra vergoeding verschuldigd voorzover
      door omstandigheden buiten toedoen van de met de werkzaamheden belaste persoon of personen, de werkzaamheden in het
      geheel of gedeeltelijk niet plaatsvinden, bestaande uit een bedrag van

      a. € 28,65 voor iedere keuringsdierenarts die met deze werkzaamheden volgens de vaststelling van de kringdirecteur,
      bedoeld in [artikel 8, derde lid][ref5], zou zijn belast, voor elk kwartier dat de werkzaamheden volgens die
      vaststelling zouden hebben geduurd, en

      b. € 17,03 voor iedere assistent die met deze werkzaamheden volgens de vaststelling van de kringdirecteur, bedoeld
      in [artikel 8, derde lid][ref6], zou zijn belast, voor elk kwartier dat de werkzaamheden volgens die vaststelling
      zouden hebben geduurd.

      5 De aanbieder is een extra vergoeding verschuldigd boven de in het derde en vierde lid verschuldigde vergoedingen,
      bestaande uit een bedrag van

      a. € 5,71 per kwartier per voor de VWA met de werkzaamheden belaste persoon indien de werkzaamheden later zijn
      aangemeld dan 14.00 uur van de werkdag voorafgaande aan de dag waarop de werkzaamheden zouden plaatsvinden;

      b. € 8,17 per kwartier dat door een keuringsdierenarts aan werkzaamheden besteed is ingeval deze plaatsvinden
      buiten openingstijd.

      c. € 5,71 per kwartier dat door een assistent aan werkzaamheden besteed is ingeval deze plaatsvinden buiten
      openingstijd.

      d. € 13,88 ingeval zowel de situatie, bedoeld in onderdeel a als b van toepassing is;

      e. € 11,42 ingeval zowel de situatie, bedoeld in onderdeel a als c van toepassing is.


