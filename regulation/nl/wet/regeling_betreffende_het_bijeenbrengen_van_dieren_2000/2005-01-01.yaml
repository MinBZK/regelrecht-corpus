    text: |-
      Deze regeling berust op de [artikelen 17, tweede lid][ref1], [18, tweede lid][ref2], en
      [30, eerste en derde lid, van de Gezondheids- en welzijnswet voor dieren][ref3] zoals die luiden met ingang van
      het tijdstip waarop de wet van 30 januari 2002 tot wijziging van de [Gezondheids- en welzijnswet voor dieren][ref4]
