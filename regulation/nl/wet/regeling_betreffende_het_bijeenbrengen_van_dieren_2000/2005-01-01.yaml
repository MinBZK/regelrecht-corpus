  - number: 9h
    text: |-
      1 Het is verboden van een starterbedrijf runderen, jonger dan 10 weken, afkomstig van een runderverzamelcentrum, af
      te voeren anders dan naar een mesterij of een slachthuis.

      2 De afvoer van runderen van een starterbedrijf, jonger dan 16 weken, naar een mesterij vindt niet plaats dan nadat
      een dierenarts direct voorafgaand aan het vervoer schriftelijk heeft verklaard dat de af te voeren runderen geen
      verschijnselen vertonen van de in [artikel 2 van de Regeling aanwijzing besmettelijke dierziekten][ref1] genoemde
      dierziekten.

      3 Het is verboden van een mesterij runderen afkomstig van een runderverzamelcentrum of een starterbedrijf af te
      voeren anders dan naar een slachthuis.

      4 Het is verboden van een geregistreerd vetweiderijbedrijf runderen af te voeren anders dan naar een slachthuis.

      5 Het vetweiderijbedrijf toont ten genoegen van de Minister aan dat de runderen die zijn afgevoerd van het
      vetweiderijbedrijf zijn aangevoerd op een slachthuis. Het vetweiderijbedrijf houdt hiervan een administratie bij en
      bewaart deze administratie gedurende drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007933#Artikel2
    url: https://wetten.overheid.nl/BWBR0011441/2005-01-01#Artikel9h
    references:
      - id: ref1
        bwb_id: BWBR0007933
        artikel: '2'
  - number: 9ha
    text: |-
      Indien het runderverzamelcentrum naar het oordeel van de Minister niet voldoet aan de voor de aanvoer van
      weiderunderen op een vetweiderijbedrijf opgestelde voorwaarden, bedoeld in de [artikelen 9c][ref1] en [9d][ref2],
      kan de Minister besluiten dat op het runderverzamelcentrum niet langer weiderunderen bijeen mogen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011441#Artikel9c
      [ref2]: https://wetten.overheid.nl/BWBR0011441#Artikel9d
