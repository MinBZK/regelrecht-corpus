  - number: '7'
    text: |-
      De erkenning, bedoeld in [artikel 4][ref1], wordt ingetrokken indien het varkensverzamelcentrum niet langer voldoet
      aan de eisen, bedoeld in de [artikelen 5][ref2] en [6][ref3].


