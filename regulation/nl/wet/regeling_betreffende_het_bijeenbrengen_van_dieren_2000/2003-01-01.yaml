  - number: '13'
    text: |-
      In geheel Nederland zijn de markten waarop pluimvee, loopvogels of postduiven worden verhandeld verboden,
      alsmede het organiseren van wedvluchten van postduiven of het tijdelijk bijeenbrengen op één plaats van pluimvee,
      loopvogels of postduiven die afkomstig zijn van verschillende plaatsen en vervolgens naar verschillende plaatsen
      binnen het Rijk, niet zijnde slachterijen, worden weggevoerd.
    url: https://wetten.overheid.nl/BWBR0011441/2003-01-01#Artikel13
  - number: '14'
    text: |-
      1 In afwijking van [artikel 13][ref1] is het organiseren van een tentoonstelling of keuring van sierpluimvee,
      loopvogels of postduiven of van een wedvlucht van postduiven toegestaan, mits op deze tentoonstelling of keuring
      slechts hoenderachtigen, loopvogels of postduiven of bij deze wedvlucht slechts postduiven worden toegelaten die
      vergezeld gaan van een op hen betrekking hebbende, volledig ingevulde en ondertekende verklaring van enting tegen
      pseudo-vogelpest.

      2 Uit de in het eerste lid bedoelde verklaring, waarvan het model als bijlage II en bijlage III bij deze regeling
      is gevoegd, moet blijken dat:

      a. de hoenderachtigen en loopvogels van de betreffende houder, voorzover de dieren ouder zijn dan 30 dagen,
      tenminste twee weken en ten hoogste vijf maanden voor het begin van de tentoonstelling of de keuring op de in
      [bijlage II][ref2] omschreven wijze zijn geënt tegen pseudo-vogelpest;

      b. de postduiven van de betreffende houder ten minste twee weken voor het begin van de tentoonstelling, keuring of
      wedvlucht op de in [bijlage III][ref3] omschreven wijze zijn geënt tegen pseudo-vogelpest overeenkomstig de bij de
      registratie van de entstof gegeven voorschriften betreffende het entschema en de dosering.


      [ref1]: https://wetten.overheid.nl/BWBR0011441#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0011441
      [ref3]: https://wetten.overheid.nl/BWBR0011441
    url: https://wetten.overheid.nl/BWBR0011441/2003-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011441
        artikel: '13'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0011441
      - id: ref3
        bwb_id: BWBR0011441
  - number: '15'
    text: |-
      1 Onverminderd de [artikelen 13][ref1] en [14][ref2] is het tijdelijk op één plaats bijeenbrengen van pluimvee,
      loopvogels of postduiven afkomstig van verschillende plaatsen slechts toegestaan, indien is voldaan aan het tweede
      of derde lid.

      2 Degene, die voornemens is pluimvee, loopvogels of postduiven afkomstig van verschillende plaatsen tijdelijk op
      één plaats bijeen te brengen, is verplicht:

      a. van dit voornemen ten minste acht dagen van tevoren kennis te geven aan de VWA;

      b. de dieren, alvorens deze toe te laten, bij de plaats van aanvoer op zijn kosten te laten onderzoeken door één of
      meer dierenartsen.

      3 In afwijking van het tweede lid is degene die voornemens is postduiven voor een wedvlucht bijeen te brengen
      verplicht van dit voornemen jaarlijks een overzicht aan de VWA te doen toekomen. De Minister kan besluiten de
      postduiven, alvorens deze bij de wedvlucht worden toegelaten, bij de plaats van aanvoer te laten onderzoeken door
      één of meer dierenartsen, op kosten van degene die de postduiven voor de wedvlucht bijeen heeft gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011441#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0011441#Artikel14
    url: https://wetten.overheid.nl/BWBR0011441/2003-01-01#Artikel15
