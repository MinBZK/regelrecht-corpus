  - number: 9v
    text: |-
      1 De organisator houdt een administratie bij overeenkomstig de artikelen 21, 35 en 36, eerste lid, onderdeel
      c, tweede en derde lid, van de Regeling identificatie en registratie van dieren 2002 en van de originele
      gezondheidsverklaringen, bedoeld in [artikel 9t, derde lid][ref1], en de kentekens van de vervoermiddelen waarmee
      runderen zijn aan- en afgevoerd.

      2 Onverminderd artikel 21, vijfde lid, en 36, vierde lid, van de Regeling identificatie en registratie van dieren
      2002 bewaart de organisator de administratie, bedoeld in het eerste lid, tot ten minste drie maanden na afloop van
      de tentoonstelling of keuring.

      3 De organisator houdt de administratie zodanig bij dat de met toezicht belaste ambtenaren op basis hiervan alle
      aan- en afgevoerde dieren en de gebruikte vervoermiddelen eenvoudig kunnen traceren.


      [ref1]: https://wetten.overheid.nl/BWBR0011441#Artikel9t
