  - number: 9r
    text: |-
      In deze paragraaf wordt verstaan onder:



            a
             organisator:

              organisator van een tentoonstelling of keuring;



            b
             plaats:

              plaats waar tentoonstelling of keuring wordt gehouden;



            c
             schapen of geiten:

              schapen of geiten, die individueel geregistreerd staan bij het Individuele Dier Registratiesysteem van de
      Gezondheidsdienst voor Dieren;



            d
             UBN:

              door de minister toegewezen uniek bedrijfsnummer, als bedoeld in artikel 3, tweede lid, van de Regeling
      identificatie en registratie van dieren 2002.
    url: https://wetten.overheid.nl/BWBR0011441/2003-01-01#Artikel9r
  - number: 9s
    text: |-
      Het in [artikel 9a, eerste lid][ref1], en [artikel 9k, eerste lid][ref2], bedoelde verbod geldt niet voor het
      bijeenbrengen van runderen, schapen of geiten, afkomstig van verschillende bedrijven, voor een tentoonstelling of
      een keuring op een plaats, mits voldaan wordt aan de [artikelen 9t][ref3] tot en met [9v][ref4].


