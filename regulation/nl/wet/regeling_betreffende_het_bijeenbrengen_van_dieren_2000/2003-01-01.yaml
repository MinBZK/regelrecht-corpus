  - number: 9l
    text: |-
      Een schapenverzamelcentrum, onderscheidenlijk een geitenverzamelcentrum, wordt door de Minister erkend indien
      voldaan wordt aan de eisen, bedoeld in [artikel 9m][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011441#Artikel9m
    url: https://wetten.overheid.nl/BWBR0011441/2003-01-01#Artikel9l
    references:
      - id: ref1
        bwb_id: BWBR0011441
        artikel: 9m
        paragraaf: '4'
  - number: 9m
    text: |-
      De eisen, bedoeld in [artikel 9l][ref1], zijn:

      a. het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, is gemakkelijk bereikbaar via verharde
      wegen;

      b. het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, ligt niet in een gebied ten aanzien
      waarvan op grond van enige wettelijke bepaling maatregelen zijn genomen houdende de instelling van een verbod om
      dieren uit het betrokken gebied uit te voeren of in de handel te brengen;

      c. het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, maakt geen deel uit van een bedrijf
      waar vee is gehuisvest, van een slachthuis, of van een andere verzamelplaats ten behoeve van het verzamelen van
      andere dieren dan schapen, onderscheidenlijk geiten. De gebouwen van het schapenverzamelcentrum, onderscheidenlijk
      het geitenverzamelcentrum, zijn gelegen op een minimale afstand van 100 meter van gebouwen behorende bij één of
      meer van de bovengenoemde bedrijven. Het schapenverzamelcentrum of het geitenverzamelcentrum, is zodanig omheind
      dat vrije toegang tot het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, niet mogelijk is;

      d. het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, beschikt over een door de Minister
      goedgekeurd opleidingsplan op grond waarvan het personeel dat op het schapenverzamelcentrum, onderscheidenlijk
      het geitenverzamelcentrum, verantwoordelijk is voor de dieren vanwege de aanbieder wordt opgeleid in de zorg
      voor en het welzijn van de dieren alsmede in de wettelijke eisen die ter zake van het schapenverzamelcentrum,
      onderscheidenlijk het geitenverzamelcentrum, worden gesteld;

      e. het gehele terrein van het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, waar met
      smetstof verontreinigd materiaal vanaf transportmiddelen op de grond terecht kan komen, is verhard. De plaats
      waar schapen, onderscheidenlijk geiten, in- en uitgeladen worden is voorzien van een verharde en voor water
      ondoordringbare terreinbedekking. Het gehele verharde terrein van het schapenverzamelcentrum, onderscheidenlijk het
      geitenverzamelcentrum, is in goede staat van onderhoud en zonder glooiingen;

      f. alle materialen waarmee de schapen of geiten op het schapenverzamelcentrum, onderscheidenlijk het
      geitenverzamelcentrum, in aanraking kunnen komen zijn uitsluitend van duurzaam en ondoordringbaar materiaal gemaakt
      dat gemakkelijk en grondig kan worden gereinigd en ontsmet. De materialen worden goed onderhouden en eventuele
      reparaties worden onmiddellijk uitgevoerd. Het gebruik van corroderende materialen is niet toegestaan. Hout is
      slechts toegestaan, wanneer dit is ingebed in kunststof of hars;

      g. het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, beschikt over laad- en losruimten waar
      de schapen, onderscheidenlijk de geiten, worden in- en uitgeladen. De laad- en losvoorzieningen zijn zodanig dat
      laad- en loswerkzaamheden ongehinderd kunnen plaatsvinden;

      h. behoudens wanneer ten genoegen van de Minister kan worden aangetoond dat de bedrijfsvoering van het
      schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, zodanig is dat aankomende en vertrekkende
      schapen, onderscheidenlijk geiten, niet met elkaar in contact komen, is het schapenverzamelcentrum,
      onderscheidenlijk het geitenverzamelcentrum, zodanig ingericht dat bij het in- en uitladen aankomende en
      vertrekkende schapen, onderscheidenlijk geiten, niet met elkaar in contact komen;

      i. op het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, zijn één of meerdere stalruimten
      aanwezig voor het onderbrengen van de schapen, onderscheidenlijk geiten. Voorzieningen zijn in de stalruimten
      aanwezig voor het voeren en drenken van de schapen, onderscheidenlijk geiten;

      j. in de onmiddellijke nabijheid van de uitlaadruimte van het schapenverzamelcentrum, onderscheidenlijk het
      geitenverzamelcentrum, is een aparte, afsluitbare stalling voor zieke of van een dierziekte verdachte schapen,
      onderscheidenlijk geiten, aanwezig, dan wel een stalruimte waarin een voorziening is getroffen voor de afzondering
      van schapen, onderscheidenlijk geiten, zodanig dat de daartoe bestemde ruimte fysiek door middel van geheel
      gesloten wanden gescheiden is van de overige stallingsvoorzieningen binnen de stalruimte;

      k. op het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, is een voor schapen,
      onderscheidenlijk geiten, ontoegankelijke ruimte aanwezig voor opslag van voeder en strooisel, gescheiden van de
      ruimte waar schapen, onderscheidenlijk geiten, kunnen verblijven alsmede een afsluitbare, lekvrije, voor vogels of
      ongedierte ontoegankelijke en goed reinigbare voorziening aanwezig voor de opslag van kadavers. Deze voorziening
      is zodanig op een verharde plaats gesitueerd dat het vanaf de openbare verharde weg binnen het bereik ligt van de
      laadkraan van het vervoermiddel van degene die het materiaal ophaalt;

      l. in de nabijheid van de stalruimte is een voorziening aanwezig voor de opslag van mest en indien een stalruimte
      geheel of gedeeltelijk wordt ingestrooid, is tevens in de nabijheid van de stalruimte een voorziening aanwezig voor
      de opslag van het gebruikte strooisel;

      m. indien het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, gebruikt wordt voor de export
      van schapen, onderscheidenlijk geiten, naar een buiten Nederland gelegen slachthuis, is op het centrum ten behoeve
      van de VWA een stoel, een telefoon en een afsluitbaar bureau aanwezig of een afsluitbare ruimte, ingericht met ten
      minste een tafel. Indien de VWA een onafhankelijke telefoonaansluiting wenst, komt deze voor rekening van de VWA.
      In of in de nabijheid van de kantoorruimte bevindt zich een toilet met gelegenheid tot handen wassen;

      n. het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, beschikt over een geschikt
      opvangsysteem voor het afvalwater waarmee het afvalwater kan afvloeien of op andere wijze wordt verwijderd;

      o. bij de laad- en losruimte en in de stalruimte is een voor inspectie en keuringen passende verlichting met een
      minimale lichtsterkte van 300 lux aanwezig;

      p. de in- en uitgangen van de stalruimte zijn afsluitbaar. Bij de in- en uitgangen zijn ten behoeve van schoeisel
      deugdelijke ontsmettingsbakken aanwezig. De inhoud van de ontsmettingsbakken wordt tenminste bij de aanvang van een
      blokperiode ververst met ontsmettingsmiddelen. De inhoud van de ontsmettingsbakken is zodanig dat te allen tijde
      afdoende ontsmetting mogelijk is;

      q. er is zoveel stalruimte aanwezig dat de aan- en afvoer van schapen, onderscheidenlijk geiten, per blokperiode
      ongestoord kan verlopen;

      r. de op het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, aanwezige stalruimte en de laad-
      en losplaatsen zijn voorzien van een gesloten dakbedekking, windkerende wanden en een klimaatsregelingssysteem
      zodanig dat de stalruimte en de laad- en losplaatsen onder alle klimatologische omstandigheden deugdelijk en
      efficiënt gereinigd en ontsmet kunnen worden;

      s. het vloeroppervlak van de stalruimte bestaat geheel uit voor water ondoordringbaar materiaal. De wanden van deze
      ruimten bestaan, voorzover deze niet hoger zijn dan 2,5 meter boven het vloeroppervlak, geheel, dan wel, voorzover
      deze hoger zijn dan 2,5 meter boven het vloeroppervlak, tot een hoogte van 2,5 meter uit voor water ondoordringbaar
      en niet poreus materiaal, zodat deze steeds gereinigd en ontsmet kunnen worden;

      t. op het terrein zijn één of meerdere wasplaatsen aanwezig voor de reiniging en
      ontsmetting van vervoermiddelen. De wasplaatsen zijn geregistreerd op grond van
      [artikel 23, eerste lid, van de Regeling inzake hygiënevoorschriften besmettelijke dierziekten 2000][ref2];

      u. op het terrein zijn één of meerdere reinigings- en ontsmettingsinstallaties of -inrichtingen aanwezig voor
      de reiniging en ontsmetting van het terrein, de stalruimten en overige voorzieningen. Deze installaties en
      inrichtingen voldoen aan de volgende voorwaarden:

        - ten behoeve van reiniging en ontsmetting is levering van warm water van tenminste 70 °C en koud water, beide met
      voldoende hoge druk mogelijk;
        - bij besproeiing onder hoge druk kan een detergens worden aangebracht die het oppervlak reinigt;
        - door verneveling of anderszins kan ontsmettingsmiddel op het gereinigde oppervlak worden aangebracht en
        - efficiënte en deugdelijke reiniging en ontsmetting van het gehele verharde terrein als bedoeld in de onderdelen e
      en s, moet mogelijk zijn;

      v. het bij reiniging en ontsmetting gebruikte water dient op regelmatige afstanden af te vloeien naar de gierkelder
      of naar de met roosters afgedekte kolken;

      w. voor de mogelijkheid tot controle op reiniging en ontsmetting geldt een minimale lichtsterkte van 300 lux;

      x. op het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, zijn een in- en uitslagregister
      dan wel een elektronische informatiedrager met gegevens over de in- en uitslag aanwezig waarin onmiddellijk
      na aankomst, onderscheidenlijk voor vertrek van de schapen, onderscheidenlijk geiten, onder vermelding van
      het aantal schapen, onderscheidenlijk geiten, de datum van aankomst en vertrek, het herkomstbedrijf en de
      eigenaar en het bestemmingsadres van de schapen, onderscheidenlijk geiten, worden bijgehouden door middel van
      registratie van de identificatie van alle schapen, onderscheidenlijk geiten, die het schapenverzamelcentrum,
      onderscheidenlijk het geitenverzamelcentrum, passeren, zodanig dat een directe koppeling tussen het aantal in-
      en uitgeslagen dieren mogelijk is. De voor aan- en afvoer gebruikte vervoermiddelen worden eveneens onmiddellijk
      na aankomst, onderscheidenlijk vertrek onder vermelding van de registratienummers van de vervoerders alsmede
      van het vervoermiddel in het register dan wel in de elektronische informatiedrager bijgehouden alsmede bij
      export van de schapen, onderscheidenlijk geiten, het serienummer van het gezondheidscertificaat. De houder
      van het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, administreert zodanig, dat de
      keuringsdierenarts aan de hand van het register alle op het schapenverzamelcentrum, onderscheidenlijk het
      geitenverzamelcentrum, aangevoerde, aanwezige en afgeleverde schapen, onderscheidenlijk geiten, de vervoerders en
      de vervoermiddelen waarmee de schapen, onderscheidenlijk geiten, werden getransporteerd, kan traceren. De gegevens
      bedoeld in dit onderdeel worden minimaal drie jaren bewaard;

      y. op het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, is een logboek aanwezig waarin door
      of namens de eigenaar van het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum, de volgende
      gegevens worden bijgehouden:

        - type, concentratie en hoeveelheid van de ter ontsmetting gebruikte ontsmettingsmiddelen;
        - datum en tijdstip van door de keuringsdierenarts of de assistent uitgevoerde inspecties;
        - beschrijving van die gevallen waarin door de keuringsdierenarts of de assistent is geconstateerd dat
      niet aan de in deze regeling gestelde eisen of andere op het schapenverzamelcentrum, onderscheidenlijk het
      geitenverzamelcentrum, of de aanbieder van het schapenverzamelcentrum, onderscheidenlijk het geitenverzamelcentrum,
      van toepassing zijnde regelgeving is voldaan, alsmede de in verband met die constateringen door de
      keuringsdierenarts of de assistent gegeven instructies, en
        - de datum waarop de opheffing van de geconstateerde tekortkomingen zal zijn voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0011441#Artikel9l
      [ref2]: https://wetten.overheid.nl/BWBR0012010#Artikel23
