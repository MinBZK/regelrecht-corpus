  - number: 9g
    text: |-
      1 De afvoer van runderen, jonger dan 12 maanden, bedoeld in [artikel 9d, onderdeel a, onder 3][ref1]), van een op
      grond van [artikel 9b][ref2] erkend runderverzamelcentrum geschiedt rechtstreeks en uitsluitend naar:

      a. hetzij een in Nederland gelegen slachthuis;

      b. hetzij een niet in Nederland gelegen bedrijf of slachthuis;

      c. hetzij een in Nederland gelegen mesterij, indien het runderen jonger dan 12 maanden betreft, die afkomstig zijn
      van een in Nederland gelegen bedrijf, mits deze runderen vanaf voornoemde mesterij rechtstreeks en uitsluitend naar
      een slachthuis worden afgevoerd;

      d. hetzij een starterbedrijf, indien het betreft runderen, jonger dan 12 maanden, en het starterbedrijf uitsluitend
      runderen rechtstreeks afvoert naar:

        - een in Nederland gelegen mesterij, mits deze runderen vanaf de desbetreffende mesterij rechtstreeks en
      uitsluitend naar een slachthuis worden afgevoerd, of
        - een slachthuis,

      en het starterbedrijf bij de Minister is geregistreerd, met gebruikmaking van een daartoe ter beschikking gesteld
      formulier.

      2 De afvoer van runderen, jonger dan 12 maanden, bedoeld in [artikel 9d, onderdeel a, onder 3][ref3]), naar
      een niet in Nederland gelegen bedrijf of slachthuis geschiedt met inachtneming van de [Hoofdstukken 2][ref4] en
      [3 van de Regeling handel levende dieren en levende producten][ref5].

      3 De aanvoer van runderen, jonger dan 12 maanden, op een runderverzamelcentrum is verboden, indien die runderen in
      de periode voor de aanvoer op een runderverzamelcentrum voor een tijdvak korter dan 30 dagen bijeen zijn gebracht.

      4 De aanvoer van een rund, jonger dan 12 maanden, op een runderverzamelcentrum gaat vergezeld van een bewijs dat
      het betreffende rund is aangemeld krachtens het [Besluit identificatie en registratie van dieren][ref6].


