---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitvoeringswet_screeningsverordening_buitenlandse_directe_investeringen
regulatory_layer: WET
publication_date: '2022-06-10'
valid_from: '2020-12-04'
bwb_id: BWBR0044449
url: https://wetten.overheid.nl/BWBR0044449/2020-12-04
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen in verband met de uitvoering van
    Verordening (EU) 2019/452 van het Europees Parlement en de Raad van 19 maart 2019 tot vaststelling van een kader
    voor de screening van buitenlandse directe investeringen in de Unie (PbEU 2019, L 79);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder: - *buitenlandse directe investering:* buitenlandse directe investering als
      bedoeld in artikel 2, onder 1, van [verordening 2019/452](32352R2019);
        - *verordening 2019/452:* Verordening (EU) 2019/452 van het Europees Parlement en de Raad van 19 maart 2019 tot
      vaststelling van een kader voor de screening van buitenlandse directe investeringen in de Unie (PbEU 2019, L 79);
        - *screeningsmechanisme:* screeningsmechanisme als bedoeld in artikel 2, onder 4, van [verordening 2019/452]
      (32352R2019);
        - *Onze verantwoordelijke Minister:* de op grond van [artikel 3][ref1] eerstverantwoordelijke minister.


      [ref1]: https://wetten.overheid.nl/BWBR0044449#Artikel3
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0044449
        artikel: '3'
  - number: '2'
    text: |-
      Onze Minister van Economische Zaken en Klimaat is het contactpunt, bedoeld in artikel 11, eerste lid, van
      [verordening 2019/452](32352R2019) en is verantwoordelijk voor het verslag, bedoeld in artikel 5, eerste en tweede
      lid, van [verordening 2019/452](32352R2019).
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel2
  - number: '3.1'
    text: |-
      Verantwoordelijk voor het nemen van beslissingen in het kader van de samenwerking, bedoeld in de artikelen 6 tot en
      met 8 van [verordening 2019/452](32352R2019), is:
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel3
  - number: 3.1.a
    text: |-
      Onze Minister die het aangaat, in overeenstemming met Onze Minister van Economische Zaken en Klimaat en Onze
      Minister van Justitie en Veiligheid, indien de samenwerking ziet op een buitenlandse directe investering in
      Nederland waarop een screeningsmechanisme van toepassing is;
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel3
  - number: 3.1.b
    text: |-
      Onze Minister die het aangaat, in overeenstemming met Onze Minister van Economische Zaken en Klimaat, Onze Minister
      van Justitie en Veiligheid en Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking, indien de
      samenwerking ziet op een buitenlandse directe investering in een andere lidstaat waarop, indien zij in Nederland
      had plaatsgevonden, een screeningsmechanisme van toepassing zou zijn; of
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel3
  - number: 3.1.c
    text: |-
      Onze Minister van Economische Zaken en Klimaat, in overeenstemming met Onze Minister van Justitie en Veiligheid,
      Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking en, indien van toepassing, Onze Minister of
      Ministers die het mede aangaat, in de gevallen waarin onderdeel a of onderdeel b niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel3
  - number: '3.2'
    text: |-
      Onze verantwoordelijke Minister is verwerkingsverantwoordelijke voor de verwerking van persoonsgegevens die
      noodzakelijk zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel3
  - number: '4.1'
    text: |-
      Onze op grond van [artikel 3][ref1] betrokken Ministers, het contactpunt, genoemd in [artikel 2][ref2], en de
      partijen, bedoeld in het derde en vierde lid, verwerken slechts persoonsgegevens in het kader van deze wet met het
      doel te voldoen aan verplichtingen die volgen uit [verordening 2019/452](32352R2019).


      [ref1]: https://wetten.overheid.nl/BWBR0044449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044449#Artikel2
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0044449
        artikel: '2'
  - number: '4.2'
    text: |-
      Onze verantwoordelijke Minister maakt ten behoeve van het verzamelen van de informatie, bedoeld in artikel 9,
      eerste en derde lid, van [verordening 2019/452](32352R2019), voor zover deze informatie nog niet in het kader van
      een screeningsmechanisme is verzameld, gebruik van gegevens die afkomstig zijn uit:
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel4
  - number: 4.2.a
    text: het handelsregister;
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel4
  - number: 4.2.b
    text: |-
      de basisregistratie kadaster en de openbare registers, bedoeld in [artikel 1, eerste lid, van de Kadasterwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel1
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '1'
  - number: 4.2.c
    text: overige openbare registers bij de wet ingesteld; en
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel4
  - number: 4.2.d
    text: openbare informatie.
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel4
  - number: '4.3'
    text: |-
      De volgende bestuursorganen, diensten, toezichthouders of andere personen, verstrekken desgevraagd alle informatie
      aan Onze verantwoordelijke Minister die noodzakelijk is voor de uitvoering van de verplichtingen, bedoeld in
      artikel 9, eerste en derde lid, van [verordening 2019/452](32352R2019):
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel4
  - number: 4.3.a
    text: Onze Minister van Financiën, voor zover het gegevens betreft die verwerkt worden door de Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel4
  - number: 4.3.b
    text: |-
      Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking, voor zover het gegevens betreft die verwerkt
      worden in het kader van de [Wet strategische diensten][ref1] en het [Besluit strategische goederen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0030545
      [ref2]: https://wetten.overheid.nl/BWBR0024139#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0030545
      - id: ref2
        bwb_id: BWBR0024139
        paragraaf: '5'
  - number: 4.3.c
    text: |-
      de Autoriteit Consument en Markt, voor zover het gegevens betreft die worden verwerkt in het kader van
      [hoofdstuk 5 van de Mededingingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008691
  - number: 4.3.d
    text: bij algemene maatregel van bestuur aan te wijzen bestuursorganen, diensten, toezichthouders of andere personen.
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel4
  - number: '4.4'
    text: |-
      Onze verantwoordelijke Minister kan voorts de Algemene Inlichtingen- en Veiligheidsdienst of de Militaire
      Inlichtingen- en Veiligheidsdienst om informatie verzoeken, voor zover dit noodzakelijk is voor de uitvoering van
      de verplichtingen, bedoeld in artikel 9, eerste en derde lid, van [verordening 2019/452](32352R2019).
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel4
  - number: '4.5'
    text: |-
      Voor zover de verzameling of verstrekking, bedoeld in het tweede tot en met vierde lid, niet de benodigde gegevens
      heeft opgeleverd, maakt Onze verantwoordelijke Minister gebruik van de bevoegdheid, bedoeld in artikel 9, vierde
      lid, van [verordening 2019/452](32352R2019).
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel4
  - number: '4.6'
    text: |-
      Indien de onderneming waarin de buitenlandse directe investering wordt gepland of is voltooid in staat van
      faillissement is verklaard, verstrekt de betrokken curator desgevraagd de informatie, bedoeld in artikel 9, tweede
      lid, van [verordening 2019/452](32352R2019), voor zover de verzameling of verstrekking, bedoeld in het tweede tot
      en met vierde lid, niet de benodigde gegevens heeft opgeleverd.
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel4
  - number: '4.7'
    text: De gegevensverstrekking ingevolge het tweede lid, onder c, en het derde tot en met zesde lid, geschiedt kosteloos.
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel4
  - number: '5'
    text: |-
      Met het toezicht op de naleving van artikel 9, vierde lid, tweede volzin, van [verordening 2019/452](32352R2019)
      zijn belast de bij besluit van Onze verantwoordelijke Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel5
  - number: '6.1'
    text: |-
      Onze verantwoordelijke Minister kan in geval van overtreding van artikel 9, vierde lid, tweede volzin, van
      [verordening 2019/452](32352R2019), de overtreder een last onder bestuursdwang opleggen.
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel6
  - number: '6.2'
    text: |-
      Onze verantwoordelijke Minister kan in geval van overtreding van [artikel 4, zesde lid][ref1], de onderneming
      waarin de buitenlandse directe investering wordt gepland of is voltooid een last onder bestuursdwang opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0044449#Artikel4
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0044449
        artikel: '4'
  - number: '6.3'
    text: |-
      Van een besluit als bedoeld in het eerste of het tweede lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel6
  - number: '10'
    text: |-
      Onze Minister van Economische Zaken en Klimaat zendt in overeenstemming met Onze Minister van Justitie en
      Veiligheid en Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking binnen vijf jaar na de
      inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van de
      informatieverzameling op grond van [artikel 4, derde tot en met zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044449#Artikel4
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0044449
        artikel: '4'
  - number: '11'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel11
  - number: '12'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet screeningsverordening buitenlandse directe investeringen.'
    url: https://wetten.overheid.nl/BWBR0044449/2020-12-04#Artikel12
