  text: |-
    Gelet op richtlijn nr. 2002/49/EG van het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002
    inzake de evaluatie en de beheersing van omgevingslawaai (PbEG L 189) en de artikelen 117a, eerste lid, 119, eerste
    lid, en 120, vierde lid, van de Wet geluidhinder en de artikelen 18, 19, 21, tweede lid, en 25 van het Besluit
    omgevingslawaai;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017035/2010-11-01#ArtikelAanhef
