  - number: '3'
    text: |-
      De geluidsbelastingkaarten die de Minister ter beschikking worden gesteld, bestaan uit de tabellen als bedoeld in
      de [artikelen 7][ref1] en [10 van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016989#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0016989#Artikel10
    url: https://wetten.overheid.nl/BWBR0017035/2010-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016989
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0016989
        artikel: '10'
  - number: '4'
    text: |-
      Voor de toepassing van [hoofdstuk 2 van het besluit][ref1] wordt het aantal bewoners van woningen bepaald door het
      aantal woningen te vermenigvuldigen met 2,3.


      [ref1]: https://wetten.overheid.nl/BWBR0016989#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017035/2010-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016989
        hoofdstuk: '2'
  - number: '5'
    text: |-
      De in [artikel 6, eerste lid, van het besluit][ref1] bedoelde geografische kaarten bevatten een legenda waarin
      wordt verklaard hoe de informatie op die kaarten is weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0016989#Artikel6
    url: https://wetten.overheid.nl/BWBR0017035/2010-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016989
        artikel: '6'
  - number: '6.1'
    text: |-
      Een verzoek om verstrekking van inlichtingen en gegevens als bedoeld in [artikel 118a, eerste lid][ref1], of
      [123b, eerste lid, van de wet][ref2] kan betrekking hebben op gegevens als vermeld in [bijlage 1, deel A][ref3],
      bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel118a
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel123b
      [ref3]: https://wetten.overheid.nl/BWBR0017035
    url: https://wetten.overheid.nl/BWBR0017035/2010-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 118a
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 123b
      - id: ref3
        bwb_id: BWBR0017035
  - number: '6.2'
    text: |-
      Een verzoek om verstrekking van inlichtingen en gegevens als bedoeld in [artikel 118a, tweede lid][ref1], of
      [123b, eerste lid, van de wet][ref2] kan betrekking hebben op gegevens als vermeld in [bijlage 1, deel B][ref3],
      bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel118a
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel123b
      [ref3]: https://wetten.overheid.nl/BWBR0017035
    url: https://wetten.overheid.nl/BWBR0017035/2010-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 118a
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 123b
      - id: ref3
        bwb_id: BWBR0017035
  - number: '6.3'
    text: |-
      De te verstrekken ruimtelijk georiënteerde inlichtingen en gegevens zijn gebaseerd op het
      rijksdriehoekcoördinatenstelsel.
    url: https://wetten.overheid.nl/BWBR0017035/2010-11-01#Artikel6
  - number: '7'
    text: |-
      Het percentage bewoners van woningen per geluidsbelastingklasse dat door een of meer geluidsbronnen wordt
      gehinderd of ernstig gehinderd dan wel van wie daardoor de slaap wordt verstoord, wordt bepaald door middel van de
      desbetreffende in [bijlage 2][ref1] bij deze regeling opgenomen dosis-effectrelatie.


      [ref1]: https://wetten.overheid.nl/BWBR0017035
    url: https://wetten.overheid.nl/BWBR0017035/2010-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017035
  - number: '8'
    text: |-
      De geluidsbelasting L en de geluidsbelasting L vanwege een weg of spoorweg worden bepaald volgens de
      Standaardkarteringsmethode I of II opgenomen in [bijlage 3][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017035
    url: https://wetten.overheid.nl/BWBR0017035/2010-11-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017035
  - number: '9.1'
    text: |-
      Voor de bepaling van de geluidsbelasting L vanwege een inrichting of een verzameling van inrichtingen wordt
      de geluidsbelasting L gelijkgesteld aan de geluidsbelasting vanwege een industrieterrein van die inrichting of
      verzameling van inrichtingen.
    url: https://wetten.overheid.nl/BWBR0017035/2010-11-01#Artikel9
  - number: '9.2'
    text: |-
      Voor de bepaling van de geluidsbelasting L vanwege een inrichting of een verzameling van inrichtingen wordt de
      geluidsbelasting L gelijkgesteld aan de geluidsbelasting L vanwege die inrichting of verzameling van inrichtingen
      minus 10 dB.
    url: https://wetten.overheid.nl/BWBR0017035/2010-11-01#Artikel9
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0017035/2010-11-01#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Regeling omgevingslawaai.'
    url: https://wetten.overheid.nl/BWBR0017035/2010-11-01#Artikel11
