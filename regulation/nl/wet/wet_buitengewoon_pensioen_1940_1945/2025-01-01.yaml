  - number: 31e
    text: |-
      1 Indien het maandinkomen van

      a. een deelnemer aan het verzet die recht heeft op een buitengewoon pensioen,

      b. de weduwe, genoemd in [artikel 14, eerste lid][ref1], die recht heeft op een buitengewoon pensioen, dan wel

      c. een weduwnaar, genoemd in [artikel 14, vierde lid, onder ][ref2], die recht heeft op een buitengewoon pensioen,
      lager is dan het op grond van [artikel 31][ref3] van toepassing zijnde normbedrag, wordt aan die buitengewoon
      gepensioneerde een garantietoeslag verleend, gelijk aan het verschil tussen zijn of haar maandinkomen en het van
      toepassing zijnde normbedrag.

      2 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot het inkomen, bedoeld in het eerste
      lid.


