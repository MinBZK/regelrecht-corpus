  - number: 37b
    text: |-
      1 Van de beslissing op het bezwaarschrift wordt mededeling gedaan aan de Stichting 1940-1945.

      2 [Artikel 25][ref1] is van overeenkomstige toepassing.

      3 In afwijking van [artikel 7:10, eerste, derde en vierde lid, van de Algemene wet bestuursrecht][ref2] beslist de
      Raad of de Sociale verzekeringsbank binnen dertien weken gerekend vanaf de dag na die waarop de termijn voor het
      indienen van het bezwaarschrift is verstreken. Ingeval van bijzondere omstandigheden kan deze termijn eenmaal met
      ten hoogste vier weken worden verlengd. Van de verlenging doet de Raad of de Sociale verzekeringsbank schriftelijk
      mededeling aan de belanghebbende en aan de Stichting 1940-1945.

      4 Indien de belanghebbende in het buitenland gevestigd is, worden de termijnen, bedoeld in het derde lid, ieder met
      acht weken verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel25b
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel710
