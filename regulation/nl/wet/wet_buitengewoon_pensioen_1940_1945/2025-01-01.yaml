  - number: '32'
    text: |-
      1 De buitengewone pensioenen en de garantietoeslagen worden maandelijks voldaan.

      2 De eerste termijn wordt zo spoedig mogelijk, doch uiterlijk binnen dertien weken na de toekenning, vastgesteld
      en betaald.

      3 Indien de door belanghebbende verstrekte gegevens en bescheiden onvoldoende zijn voor het vaststellen van het
      bedrag van de eerste termijn, verzoekt de Sociale verzekeringsbank de belanghebbende deze gegevens en bescheiden
      alsnog te verstrekken. De periode van dertien weken, bedoeld in het tweede lid, wordt in zodanig geval opgeschort
      met ingang van de dag waarop de Sociale verzekeringsbank vorenbedoeld verzoek heeft gedaan tot de dag waarop de
      gegevens en bescheiden zijn verstrekt.

      4 De termijnen van een buitengewoon pensioen en van een garantietoeslag, welke niet zijn ingevorderd binnen een
      jaar na de eerste maand, waarin de uitkering daarvan had mogen plaats hebben, worden niet meer uitbetaald, tenzij
      de belanghebbende ten genoege van de Sociale verzekeringsbank kan aantonen, dat het overschrijden van die termijn
      het gevolg is geweest van omstandigheden, van zijn wil onafhankelijk.

      5 De uitbetaling van een buitengewoon pensioen en van een garantietoeslag geschiedt op de wijze bij algemene
      maatregel van bestuur te bepalen.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel32
  - number: '33'
    text: |-
      1 De gepensioneerde, die is veroordeeld tot een vrijheidsstraf van drie maanden, tot plaatsing in een
      Rijkswerkinrichting, tot plaatsing in een tuchtschool voor drie maanden, of tot enige zwaardere straf, of op
      bevel van de rechter ter beschikking van de Regering is gesteld, mist over de tijd gedurende welke hij zijn straf
      ondergaat of van Regeringswege in zijn opvoeding wordt voorzien, of gedurende welke hij zich door de vlucht aan de
      tenuitvoerlegging van het vonnis onttrekt, het genot van buitengewoon pensioen en garantietoeslag.

      2 De Sociale verzekeringsbank is bevoegd het pensioenbedrag en het bedrag van de garantietoeslag over die tijd
      geheel of ten dele aan of ten behoeve van de echtgenoot, afstammelingen in de rechte linie, die de leeftijd van
      eenentwintig jaar nog niet hebben bereikt en niet gehuwd zijn of gehuwd geweest zijn, of bloedverwanten in de
      opgaande linie van de gepensioneerde te doen uitbetalen.

      3 De Sociale verzekeringsbank is tevens bevoegd om, voor zover van de bevoegdheid in het vorige lid bedoeld, geen
      gebruik is gemaakt, de gepensioneerde, die al of niet voorwaardelijk uit de gevangenis, uit de Rijkswerkinrichting
      of uit de tuchtschool is ontslagen, of wiens opvoeding van Regeringswege is beëindigd, in het genot te stellen van
      een uitkering, ten bedrage van ten hoogste de helft van het niet uitgekeerde bedrag, tot een maximum van de helft
      van het jaarlijkse bedrag van het buitengewoon pensioen en de garantietoeslag.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel33
  - number: '34'
    text: |-
      1 Het buitengewoon pensioen wordt door de Sociale verzekeringsbank vervallen verklaard:

      1. wanneer gedurende vijf achtereenvolgende jaren na de eerste dag, waarop een termijn daarvan kan worden geïnd,
      iedere invordering is achterwege gebleven;

      2. wanneer de gepensioneerde:

      a. van Nederlandse nationaliteit zijnde, zonder Onze toestemming zich in vreemde krijgsdienst of vreemde
      burgerlijke overheidsdienst begeeft;

      b. niet van Nederlandse nationaliteit zijnde, zich in vreemde krijgsdienst of vreemde burgerlijke overheidsdienst
      bevindt of begeeft bij een mogendheid, die met Nederland in oorlog is, ook al is die mogendheid zijn eigen
      vaderland.

      2 In bijzondere gevallen kan een op grond van dit artikel vervallen buitengewoon pensioen door de Sociale
      verzekeringsbank opnieuw worden toegekend. Een dergelijk besluit wordt niet genomen dan nadat daarin bij koninklijk
      besluit is toegestemd. Toestemming kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel34
  - number: '35'
    text: |-
      Indien een buitengewoon pensioengerechtigde in een inrichting ter verpleging van geesteszieken of zwakzinnigen is
      opgenomen, of, niet opgenomen zijnde in zodanige inrichting, op grond van geestelijke gestoordheid niet in staat
      is kwijting te verlenen voor de uitbetaling van zijn buitengewoon pensioen en zijn garantietoeslag, is de Sociale
      verzekeringsbank bevoegd het buitengewoon pensioen en de garantietoeslag uit te betalen aan een door hem aan te
      wijzen persoon of instelling. In andere bijzondere gevallen is de Sociale verzekeringsbank eveneens bevoegd het
      buitengewoon pensioen en de garantietoeslag in plaats van aan de pensioengerechtigde zonder diens machtiging uit te
      betalen aan een door hem in overleg met de Stichting 1940-1945 aan te wijzen persoon of instelling.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel35
  - number: 35a
    text: |-
      De Sociale verzekeringsbank is bevoegd geheel of gedeeltelijk van invordering af te zien van uit de toepassing van
      deze wet voortvloeiende aan het Rijk toekomende vorderingen, dan wel deze vorderingen geheel of gedeeltelijk kwijt
      te schelden. Een dergelijk besluit wordt niet genomen dan nadat Onze Minister daarin heeft toegestemd. Toestemming
      kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel35a
  - number: 36a
    text: |-
      1 De pensioenbedragen, bedoeld in [artikel 31][ref1], de overlijdensuitkering, bedoeld in [artikel 30][ref2],
      de garantietoeslag, bedoeld in [artikel 31][ref3], en de vergoedingen zijn niet vatbaar voor vervreemding of
      verpanding.

      2 De overlijdensuitkering, bedoeld in [artikel 30][ref4], en de vergoedingen zijn niet vatbaar voor beslag.

      3 Volmacht tot ontvangst van het buitengewoon pensioen, van de overlijdensuitkering, bedoeld in [artikel 30][ref5],
      de garantietoeslag, bedoeld in [artikel 31][ref6], of van de vergoedingen is steeds herroepelijk.

      4 Elk beding, strijdig met enige bepaling van dit artikel, is nietig.


