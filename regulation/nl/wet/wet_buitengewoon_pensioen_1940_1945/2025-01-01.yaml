  - number: '18'
    text: |-
      1 De buitengewone pensioenen, toegekend aan de personen, bedoeld in [artikel 17, a, c, d, e, f, g en i][ref1],
      zullen tezamen niet meer mogen bedragen dan negentig procent van de pensioengrondslag, waarnaar die pensioenen zijn
      berekend, met dien verstande, dat:

        - de personen, bedoeld in [artikel 17, g][ref2], alleen aanspraak hebben op buitengewoon pensioen, indien de
      personen, bedoeld in artikel 17, a, c, d, e, f en i, hun volle buitengewoon pensioen ontvangen hebben;
        - de personen, bedoeld in [artikel 17, f][ref3], alleen aanspraak hebben op buitengewoon pensioen, indien de
      personen, bedoeld in artikel 17, a, c, d, e en i, hun volle buitengewoon pensioen ontvangen hebben;
        - de personen, bedoeld in [artikel 17, d][ref4] en e, alleen aanspraak hebben op buitengewoon pensioen, indien de
      personen, bedoeld in artikel 17, a, c en i, allen hun volle buitengewoon pensioen ontvangen hebben.

      2 Indien de buitengewone pensioenen van de personen, bedoeld in [artikel 17, a, c en i][ref5], tezamen meer
      zouden bedragen dan het in het eerste lid voor hen gestelde maximum, zal elk buitengewoon pensioen een evenredige
      vermindering ondergaan.

      3 Indien de personen, bedoeld in [artikel 17, d en e][ref6], niet het volle buitengewoon pensioen kunnen ontvangen,
      zal het buitengewoon pensioen van ieder hunner een evenredige vermindering ondergaan.

      4 Het in het vorige lid bepaalde is ook van toepassing op de kleinkinderen als bedoeld in [artikel 17, f][ref7],
      indien van deze méér dan één in leven zijn en elk kleinkind niet zijn volle buitengewoon pensioen kan ontvangen.

      5 Ingeval het bepaalde bij het tweede lid is toegepast, en in het aantal op buitengewoon pensioen recht hebbende
      kinderen wijziging komt, zal de toegepaste evenredige vermindering worden herzien en wel met ingang van de maand
      volgende op die, waarin de wijziging is ingetreden.


