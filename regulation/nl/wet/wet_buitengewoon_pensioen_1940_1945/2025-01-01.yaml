        paragraaf: '1'
  - number: 41a
    text: |-
      1 De pensioengrondslag van de deelnemer aan het verzet, die gedurende een aaneengesloten periode van ten minste
      drie jaren andere of meer omvattende werkzaamheden heeft verricht dan die, in verband waarmede deze grondslag is
      vastgesteld, of voor het geval, dat het bepaalde in [artikel 8, vierde lid][ref1], toepassing heeft gevonden, door
      het verrichten van werkzaamheden gedurende een zelfde periode inkomsten heeft genoten, wordt, indien betrokkene
      deze werkzaamheden op grond van de verwonding, verminking, ziekten of gebreken, bedoeld in [artikel 4][ref2], of
      van de verergering daarvan heeft moeten beëindigen, op diens verzoek of op verzoek van zijn nagelaten betrekkingen
      opnieuw vastgesteld. Deze hernieuwde vaststelling geschiedt op de wijze, bepaald in [artikel 8][ref3], met dien
      verstande, dat voor het deel van de grondslag dat verband hield met inkomsten uit werkzaamheden van de deelnemer
      aan het verzet, bij de hernieuwde vaststelling van dat deel van de grondslag rekening wordt gehouden met de
      omstandigheden in het jaar, waarin de in [de vorige volzin][ref4] bedoelde werkzaamheden moesten worden beëindigd
      of - zo dit voor belanghebbende gunstig zou zijn - het jaar, voorafgaande aan dat, waarin de inkomsten uit die
      werkzaamheden tengevolge van een verwonding, verminking, ziekten of gebreken, bedoeld in [artikel 4][ref5], of van
      de verergering daarvan vermindering hebben ondergaan.

      2 Indien de pensioengrondslag opnieuw wordt vastgesteld, wordt tevens het invaliditeitspercentage, als bedoeld in
      [artikel 9][ref6], opnieuw bepaald.

      3 De nieuwe vaststelling van de pensioengrondslag en van het invaliditeitspercentage, blijft achterwege, indien
      blijkt, dat deze niet zou leiden tot een hoger buitengewoon pensioen.

      4 Het op de herziene grondslag gebaseerde pensioen gaat in op de eerste dag van de maand, volgende op die, waarin
      de in het eerste lid bedoelde werkzaamheden zijn beëindigd. Het bepaalde in [artikel 26, tweede lid][ref7], is van
      overeenkomstige toepassing. Jaar voor jaar wordt geen lager bedrag betaalbaar gesteld dan indien het eerste lid
      geen toepassing had gevonden.


