  - number: '24'
    text: |-
      1 Zij, die aanspraak menen te hebben op buitengewoon pensioen of vergoeding krachtens deze wet, dienen daartoe bij
      de Raad of de Sociale verzekeringsbank een aanvrage in. Bij een aanvrage moet worden overgelegd de voor de regeling
      van het buitengewone pensioen of vergoeding benodigde, bij algemene maatregel van bestuur aan te wijzen stukken,
      welke vrij zijn van leges.

      2 Zij die erkend willen worden als deelnemer aan het verzet dienen daartoe bij de Raad een aanvrage in.

      3 De Raad legt de aanvrage om een buitengewoon pensioen dan wel de aanvrage erkend te worden als deelnemer aan het
      verzet voor aan de Stichting 1940-1945. Deze geeft binnen vier maanden nadat de Raad de aanvrage heeft voorgelegd,
      een verklaring af waaruit blijkt of de aanvrager of degene aan wie de aanvrager zijn aanspraken wenst te ontlenen,
      al dan niet heeft behoord tot de deelnemers aan het verzet in de zin van de wet en of een omstandigheid als
      bedoeld in [artikel 2, tweede lid][ref1], al dan niet aanwezig is. Indien de aanvrage om een buitengewoon pensioen
      afkomstig is van een persoon, als bedoeld in de [artikelen 14][ref2] en [15][ref3], en de overledene aan wie de
      aanvrager zijn rechten wenst te ontlenen, aanspraken op deze wet heeft doen gelden, wordt de verklaring, waaruit
      blijkt of ten aanzien van de aanvrager een omstandigheid als bedoeld in [artikel 2, tweede lid][ref4], al dan niet
      aanwezig is, binnen vier weken afgegeven. Indien de Stichting 1940-1945 niet tijdig de vorengenoemde verklaringen
      verschaft kan de Raad, met instemming van de betrokkene, besluiten op andere wijze de benodigde informatie in te
      winnen.

      4 Indien de door de Stichting 1940-1945 afgegeven verklaring, bedoeld in het derde lid, inhoudt dat de betrokkene
      niet heeft behoord tot de deelnemers aan het verzet in de zin van de wet of dat een omstandigheid als bedoeld in
      [artikel 2, tweede lid][ref5], aanwezig is, kan de Raad niettemin een buitengewoon pensioen verlenen, indien naar
      zijn oordeel de betrokkene daarop anders aanspraak had kunnen maken. Het bedrag van dit buitengewoon pensioen is
      gelijk aan het bedrag, waarop de betrokkene recht zou hebben, wanneer de verklaring van de Stichting 1940-1945 zou
      inhouden dat de betrokkene heeft behoord tot de deelnemers aan het verzet of dat een omstandigheid als bedoeld in
      [artikel 2, tweede lid][ref6], niet aanwezig is.

      5 Indien de door de Stichting 1940–1945 afgegeven verklaring, bedoeld in het derde lid, inhoudt dat de betrokkene
      niet heeft behoord tot de deelnemers aan het verzet in de zin van de wet of dat een omstandigheid als bedoeld in
      [artikel 2, tweede lid][ref7], aanwezig is, kan de Raad niettemin een erkenning als verzetsdeelnemer afgeven indien
      hiervoor naar zijn oordeel voldoende termen aanwezig zijn.

      6 De voorlopig gepensioneerden dienen binnen twee jaren na het einde van de termijn, waarover voorlopig
      buitengewoon pensioen werd toegekend, een aanvrage in om weder in het genot van zodanig buitengewoon pensioen te
      worden gesteld.

      7 Personen, die verkeerden in het geval, bedoeld in het [derde lid van artikel 7][ref8], dienen, wanneer zij menen
      opnieuw aanspraak op buitengewoon pensioen te kunnen doen gelden, een aanvrage in.

      8 Indien door de Stichting 1940-1945, de Stichting Friesland 1940-1945, de Stichting Sneek 1940-1945, de overheid
      of enig door de overheid ingesteld of erkend orgaan een uitkering of onderstand is verleend over een tijdvak,
      waarover later met terugwerkende kracht buitengewoon pensioen wordt verleend, worden deze als voorschotten
      aangemerkt, en wordt de som hiervan zonder enige beperking op het bedrag van het pensioen ingehouden ten gunste van
      de overheid, de instellingen of de organen, als bedoeld.


