  - number: '41'
    text: |-
      1 Indien de verwonding, verminking, ziekten of gebreken, als bedoeld in [artikel 4][ref1], de deelnemer aan het
      verzet in een toestand brengen die, had deze op het tijdstip van de toekenning van het buitengewoon pensioen
      bestaan hem recht zou gegeven hebben op een hoger buitengewoon pensioen dan verleend werd, wordt hij op een door of
      namens hem ingediende aanvrage alsnog in het genot gesteld van dat hoger buitengewoon pensioen.

      2 Wanneer de aanvrage tot het verkrijgen van een hoger buitengewoon pensioen als bedoeld in het eerste lid niet
      binnen twee jaren ná de dag, waarop het ingevolge het bepaalde in het eerste lid zou kunnen ingaan, is ontvangen,
      gaat het hoger buitengewoon pensioen in op de eerste dag der maand, volgende op die, waarin de aanvrage is
      binnengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel4
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel41
