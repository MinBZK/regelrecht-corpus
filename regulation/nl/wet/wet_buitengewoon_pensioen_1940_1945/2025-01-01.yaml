  - number: 25b
    text: |-
      1 Indien de aanvrager kennis wenst te nemen van gegevens, welke mede tot de beschikking van de Raad of de Sociale
      verzekeringsbank hebben geleid, worden deze hem op zijn verzoek binnen vier weken alsnog door de Raad of de Sociale
      verzekeringsbank verstrekt, indien en voor zover door het verstrekken van deze gegevens geen inbreuk wordt gemaakt
      op de persoonlijke levenssfeer van derden.

      2 De Raad of de Sociale verzekeringsbank kan in het belang van de geestelijke of lichamelijke gezondheid van
      de betrokken persoon, al dan niet op verzoek van de geneeskundig adviseur, bepalen dat het kennisnemen van
      geneeskundige rapporten niet wordt toegestaan aan de belanghebbende persoonlijk, maar uitsluitend aan een
      gemachtigde die hetzij arts, hetzij advocaat is, dan wel van de Raad of de Sociale verzekeringsbank bijzondere
      toestemming heeft verkregen.

      3 Indien de gegevens, bedoeld in het tweede lid, aan de gemachtigde ter kennis zijn gebracht, wordt hiervan door
      de Raad of de Sociale verzekeringsbank binnen een termijn van ten hoogste drie maal vierentwintig uur aan de
      belanghebbende mededeling gedaan, onder vermelding van de datum waarop de gegevens zijn verstrekt.

      4 Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de vergoeding welke verschuldigd is,
      indien afschrift wordt verstrekt van de op de beschikking betrekking hebbende bescheiden.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel25b
  - number: '26'
    text: |-
      1 Behoudens afwijkende bepalingen gaat het buitengewoon pensioen in op de eerste dag van de maand, volgende op
      die, waarin deze wet is afgekondigd of, indien het recht op buitengewoon pensioen later is ontstaan, op de dag van
      het ontstaan van dat recht. Indien degene, aan wie het buitengewoon pensioen wordt ontleend, later overleden is,
      gaat het buitengewoon pensioen in op de eerste dag, volgende op die van het overlijden. Het tijdelijk buitengewoon
      pensioen, verleend op grond van [artikel 16][ref1], gaat in op de dag, volgende op die der vermissing, doch niet
      eerder dan op de eerste dag van de maand, volgende op die, waarin deze wet is afgekondigd.

      2 Wanneer de aanvrage tot het verkrijgen van het buitengewoon pensioen niet binnen twee jaren nà de dag, waarop het
      ingevolge het bepaalde in het vorige lid zou kunnen ingaan, is ontvangen, gaat het buitengewoon pensioen in op de
      eerste dag der maand, volgende op die waarin de aanvraag is binnengekomen.

      3 Een voorlopig buitengewoon pensioen, dat bij vernieuwing wordt toegekend, alsmede een blijvend buitengewoon
      pensioen, dat verleend wordt ter vervanging van een voorlopig buitengewoon pensioen, gaat in op de dag,
      volgende op die, waarop het vorige buitengewoon pensioen heeft opgehouden, behalve in de gevallen, genoemd in
      [artikel 7, derde lid][ref2], in welke gevallen het buitengewoon pensioen ingaat op de dag waarop de aanvrage
      daartoe is binnengekomen, tenzij de Sociale verzekeringsbank termen aanwezig acht anders te beslissen.

      4 Ingeval de aanvrage, bedoeld in [artikel 24, zesde lid][ref3], niet is ontvangen binnen de daar gestelde termijn
      van twee jaren, zal de vervanging of verlenging van voorlopig buitengewoon pensioen ingaan op de dag, waarop de
      aanvrage is binnengekomen, tenzij de Sociale verzekeringsbank termen aanwezig acht anders te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002032#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002032#Artikel24
