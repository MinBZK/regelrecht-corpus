  - number: '29'
    text: |-
      Het buitengewoon pensioen van de weduwe en dat van een gewezen echtgenote worden niet uitbetaald over de tijd,
      gedurende welke de vrouw in concubinaat leeft.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel29
  - number: 29a
    text: |-
      Het buitengewoon pensioen van personen, die zijn gepensioneerd krachtens het bepaalde in artikel 17,  en , wordt
      niet, dan wel slechts ten dele, uitbetaald over de tijd, gedurende welke op grond van de omstandigheden, waarin die
      personen verkeren, voor uitbetaling, dan wel voor volledige uitbetaling geen noodzaak bestaat.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel29a
  - number: '30'
    text: |-
      Een tijdelijk buitengewoon pensioen, verleend op grond van [artikel 16, eerste en derde lid][ref1], of een blijvend
      buitengewoon pensioen, verleend op grond van [artikel 16, vijfde lid][ref2], houdt op met de door de Sociale
      verzekeringsbank te bepalen datum, wanneer de vermiste of hij, te wiens aanzien bij rechterlijke uitspraak de
      vermissing is vastgesteld in leven blijkt te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002032#Artikel16
