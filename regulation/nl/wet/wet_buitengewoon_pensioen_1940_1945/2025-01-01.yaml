        artikel: '6'
  - number: '2'
    text: |-
      1 Onder de voorwaarden en naar de regelen, bij of krachtens deze wet gesteld, wordt buitengewoon pensioen verleend
      aan deelnemers aan het verzet, alsmede aan hun nagelaten betrekkingen.

      2 Voor toekenning van buitengewoon pensioen dan wel erkenning als deelnemer aan het verzet komen niet in aanmerking
      zij, die zich tijdens de vijandelijke bezetting van het Rijk in Europa uit Nederlands nationaal oogpunt beschouwd
      onwaardig hebben gedragen. Evenmin komen in aanmerking de nagelaten betrekkingen - voor zover niet vallende onder
      de vorige volzin - van de deelnemers aan het verzet op wie de vorenbedoelde omschrijving van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel2
  - number: 3a
    text: |-
      De voordracht voor een krachtens deze wet vast te stellen algemene maatregel van bestuur wordt niet gedaan dan
      nadat het ontwerp in de *Staatscourant* is bekend gemaakt en aan een ieder de gelegenheid is geboden om binnen vier
      weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister te brengen.
      Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel3a
  - number: '4'
    text: |-
      1 De deelnemer aan het verzet heeft recht op buitengewoon pensioen in geval van:

      a. verwonding of verminking, in verband met het verzet bekomen;

      b. ziekten of gebreken, welke geheel of gedeeltelijk het gevolg zijn van verrichtingen of vermoeienissen aan
      dit verzet verbonden, of van de behandeling ondervonden tijdens gevangenschap ter zake van het verzet, of van
      bijzondere omstandigheden of toestanden, welke zich bij het verzet hebben voorgedaan, dan wel welke tot uiting
      zijn gekomen of verergerd onder overwegende invloed van die verrichtingen, vermoeienissen, behandeling, bijzondere
      omstandigheden of toestanden;

      een en ander onder voorbehoud, dat de toestand van de belanghebbende tengevolge van deze verwonding, verminking,
      ziekten of gebreken blijken een invaliditeit te veroorzaken van ten minste 10 procent.

      2 Indien de in het eerste lid bedoelde verwonding, verminking, ziekten of gebreken een invaliditeit veroorzaken
      van tenminste veertig procent, doch het totaal der invaliditeit een hoger percentage bedraagt, geldt voor de
      vaststelling van de mate van invaliditeit waarnaar het buitengewoon pensioen wordt berekend, dit hoger percentage,
      voorzoveel de meerdere invaliditeit niet duidelijk uit andere oorzaken dan het verzet is ontstaan.

      3 Het verband of gevolg, bedoeld in het eerste lid, wordt geacht aanwezig te zijn indien de deelnemer aan het
      verzet:

      a. tijdens de bezetting of in aansluiting daarop in verband met het verzet drie maanden of langer in gevangenschap
      heeft doorgebracht dan wel naar het oordeel van de Raad, de Stichting 1940-1945 gehoord, in verband met de aard van
      zijn verzetsactiviteiten aan buitengewoon zware en langdurige spanningen heeft blootgestaan en

      b. voor tenminste zestig procent invalide is en deze invaliditeit niet duidelijk uit andere oorzaken dan het verzet
      is ontstaan.

      4 Bij toepassing van dit artikel wordt rekening gehouden met de inzichten en ervaringen van de medische wetenschap
      met betrekking tot de relatie tussen het verzet en de geestelijke en lichamelijke gezondheidstoestand.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel4
  - number: '5'
    text: Een buitengewoon pensioen kan blijvend of voorlopig worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel5
  - number: '6'
    text: |-
      Het buitengewoon pensioen wordt blijvend toegekend, indien, hetzij bij eerste toekenning, hetzij bij vernieuwing
      van pensioen, verandering van het invaliditeitspercentage voor de toekomst niet aannemelijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel6
  - number: '7'
    text: |-
      1 Het buitengewoon pensioen wordt voorlopig toegekend, indien verandering van het invaliditeitspercentage voor de
      toekomst aannemelijk wordt geacht.

      2 Het voorlopig buitengewoon pensioen wordt voor tenminste één jaar en voor ten hoogste vijf jaren toegekend; een
      zodanig pensioen wordt opnieuw toegekend, zo dikwijls daartoe aanleiding bestaat. De termijn van ten minste één
      jaar is niet van toepassing bij de tweede of verdere toekenning van voorlopig buitengewoon pensioen.

      3 Indien, nadat een voorlopig buitengewoon pensioen niet is vernieuwd, op grond dat de invaliditeit van de
      belanghebbende is gedaald beneden 10 procent, later blijkt, dat de invaliditeit wederom tot tenminste 10 procent is
      gestegen, wordt opnieuw voorlopig buitengewoon pensioen, of, indien verandering van invaliditeitspercentage voor de
      toekomst niet aannemelijk wordt geacht, blijvend buitengewoon pensioen toegekend.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel7
  - number: '8'
    text: |-
      1 Ingeval krachtens deze wet aanspraak op buitengewoon pensioen ontstaat, wordt door de Raad de pensioengrondslag
      vastgesteld, naar welke het buitengewoon pensioen moet worden berekend.

      2 De pensioengrondslag wordt, overeenkomstig het bepaalde in het zevende lid, afgeleid van het jaarbedrag,
      dat naar redelijkheid nodig is om de deelnemer aan het verzet in staat te stellen te leven op de voet, waarop
      gelijksoortige valide personen, die in het tweede jaar voorafgaande aan het jaar van indiening van de in
      [artikel 24, eerste lid][ref1], bedoelde aanvraag in overeenkomstige omstandigheden als betrokkene leefden,
      gemiddeld leefden ten tijde van het inwerkingtreden van deze wet, met dien verstande dat, indien de omstandigheden
      in het eerstbedoelde jaar naar het oordeel van de Raad belangrijk afwijken van de omstandigheden in de aan dat jaar
      voorafgaande twee jaren, de gemiddelde omstandigheden in laatstbedoelde drie jaren in aanmerking worden genomen.
      Bij de vaststelling van dit jaarbedrag wordt geen rekening gehouden met de mogelijkheid van bevordering, grotere
      vakbekwaamheid, uitbreiding van bedrijf of andere dergelijke factoren.

      3 De Raad of de Sociale verzekeringsbank is bevoegd op daartoe door of namens betrokkene gedaan verzoek in plaats
      van het in het tweede lid bedoelde jaar als peiljaar aan te wijzen het jaar voorafgaande aan dat jaar, waarin het
      inkomen van betrokkene ten gevolge van zijn verzetsomstandigheden vermindering heeft ondergaan, of het jaar van
      intreden van invaliditeit, indien dit voor hem gunstiger zou zijn.

      4 Bij de vaststelling van de pensioengrondslag van een deelnemer aan het verzet, die voor het intreden van zijn
      invaliditeit door of in verband met het volgen van onderwijs nog geen inkomsten uit arbeid in beroep of bedrijf
      genoot, wordt rekening gehouden met de omstandigheden, die ten tijde van de indiening van de aanvraag, bedoeld
      in [artikel 24, eerste lid][ref2], ter zake van invloed zijn. Bij algemene maatregel van bestuur worden te dien
      aanzien nadere regelen gesteld.

      5 Het jaarbedrag bedoeld in het tweede lid, wordt berekend door het peiljaar-inkomen te herleiden tot een inkomen
      ten tijde van het inwerkingtreden van deze wet, met toepassing van een op de indexcijfers der lonen gebaseerde
      rekenfactor. Deze rekenfactor wordt door Onze Minister per 1 januari 1978 vastgesteld en vervolgens telkens met
      ingang van 1 januari door hem herzien.

      6 Indien het jaarbedrag, bedoeld in het tweede lid, verhoogd met het percentage, waarmede het peil der buitengewone
      pensioenen in de periode 1947 tot en met 31 december van het voor de vaststelling van de grondslag dienende
      peiljaar is gestegen, als uitkomst een bedrag oplevert, dat vijf procent of meer ten achter blijft bij de
      inkomsten, die de deelnemer aan het verzet in dat peiljaar uit arbeid in beroep of bedrijf heeft genoten of zou
      hebben genoten indien hij zijn werkzaamheden in verband met zijn invaliditeit of de verergering daarvan in de loop
      van dat jaar heeft moeten beëindigen of indien hij in dat jaar is overleden, wordt, in afwijking van het bepaalde
      in het tweede en vierde lid, de grondslag, overeenkomstig het bepaalde in het zevende lid, afgeleid van het
      jaarbedrag dat wordt verkregen, door de inkomsten, die in het peiljaar door de deelnemer aan het verzet uit arbeid
      in beroep of bedrijf zijn of zouden zijn genoten, kinderbijslag of kindertoeslag daarin niet begrepen, te herleiden
      tot een inkomen ten tijde van het inwerkingtreden van deze wet, met toepassing van het percentage, waarmede het
      peil der buitengewone pensioenen is aangepast als rekenfactor.

      7 De pensioengrondslag bedraagt ten minste € 1 225,21 en ten hoogste:

      100 procent van de eerste € 2813,44,

      36,84 procent van de volgende € 1724,37,

      30 procent van de volgende € 907,56,

      20 procent van de volgende € 907,56,

      10 procent van de volgende € 907,56 en

      5 procent van de volgende € 1815,12 van het jaarbedrag, bedoeld in het tweede of zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002032#Artikel24
