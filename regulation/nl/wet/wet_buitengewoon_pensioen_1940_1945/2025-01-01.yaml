  - number: 18a
    text: |-
      1 Het buitengewoon pensioen van de weduwe, wier echtgenoot over een periode van ten minste drie maanden,
      voorafgaande aan zijn overlijden in het genot was gesteld van een blijvend buitengewoon pensioen uit hoofde van een
      invaliditeit van ten minste negentig procent wordt gedurende het eerste jaar na het overlijden van de echtgenoot
      verhoogd met twintig procent van de pensioengrondslag en gedurende het tweede jaar na het overlijden met tien
      procent van die grondslag, voor zover het verhoogde buitengewoon weduwen-pensioen daardoor gedurende het eerste
      jaar niet meer dan vijfentachtig procent van de minimum-pensioengrondslag bedraagt en gedurende het tweede jaar
      niet meer dan vijfenzeventig procent van die grondslag.

      2 De verhoging, bedoeld in het eerste lid, wordt voor de toepassing van [artikel 18][ref1] buiten beschouwing
      gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel18
