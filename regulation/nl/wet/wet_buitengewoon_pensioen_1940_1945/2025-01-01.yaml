  - number: 45a
    text: |-
      1 De schoonouders, die op de dag, voorafgaande aan die, waarop
      [artikel 396, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref1] (nieuw) in werking treedt, recht hebben op
      buitengewoon pensioen krachtens [artikel 15, eerste lid, onder e][ref2], juncto artikel 17, g, behouden dit recht,
      indien en voor zolang zij dit zouden hebben, wanneer artikel 464 van het Burgerlijk Wetboek (oud) nog van kracht
      zou zijn.

      2 De schoonmoeder, die op de dag, voorafgaande aan die, waarop
      [artikel 396, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref3] (nieuw) in werking treedt, uitzicht heeft op
      wedertoekenning van buitengewoon pensioen krachtens [artikel 28, derde lid][ref4], behoudt dit uitzicht, indien en
      voor zolang zij dit zou hebben, wanneer artikel 464 van het Burgerlijk Wetboek (oud) nog van kracht zou zijn.


