  - number: 42c
    text: |-
      1 Het buitengewoon pensioen of de garantietoeslag wordt, met uitzondering van de op grond van [artikel 8][ref1]
      vastgestelde pensioengrondslag en het invaliditeitspercentage, bedoeld in [artikel 9][ref2], opnieuw vastgesteld:

      a. wanneer de pensioengerechtigde of zijn echtgenoot de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3], bereikt;

      b. wanneer de pensioengerechtigde in het huwelijk treedt of zijn huwelijk wordt beëindigd door echtscheiding of
      overlijden van zijn echtgenoot;

      c. wanneer de pensioengerechtigde duurzaam gescheiden van zijn echtgenoot gaat leven;

      d. wanneer een kind of pleegkind van de pensioengerechtigde meerderjarig wordt;

      e. wanneer de pensioengerechtigde aanspraak maakt op de betaling uit een nieuwe bron van inkomsten, of

      f. wanneer de pensioengerechtigde geen aanspraak meer kan maken op de betaling uit een bron van inkomsten, tenzij
      hij het vervallen van die aanspraak heeft bewerkstelligd.

      2 Het eerste lid, onder e en f, is van overeenkomstige toepassing op de inkomsten van de echtgenoot van de
      pensioengerechtigde, voor zover die inkomsten de hoogte van het buitengewoon pensioen of de garantietoeslag mede
      bepalen.

      3 De beschikking, bedoeld in het eerste en tweede lid, wordt genomen binnen 13 weken nadat de noodzakelijke
      gegevens ter kennis van de Sociale verzekeringsbank zijn gebracht.

      4 Hetgeen als gevolg van een beschikking als bedoeld in het eerste of tweede lid te veel dan wel te weinig is
      uitbetaald, wordt door de Sociale verzekeringsbank teruggevorderd of verrekend dan wel nabetaald. De terugvordering
      kan in door de Sociale verzekeringsbank te bepalen termijnen plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002032#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
