  - number: 25a
    text: |-
      1 Indien de Raad vier weken voor het verstrijken van de verlengde termijn, bedoeld in
      [artikel 25, derde lid][ref1], onvoldoende gegevens aanwezig acht om tot een beoordeling van de aanvrage te komen
      en dientengevolge niet in staat is een beschikking te geven, stelt hij de aanvrager gedurende die vier weken in de
      gelegenheid zijn zienswijze naar voren te brengen.

      2 [Artikel 4:9 van de Algemene wet bestuursrecht][ref2] is op het horen van toepassing.

      3 Indien de aanvrager zijn zienswijze mondeling naar voren brengt, wordt een verslag gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel25
