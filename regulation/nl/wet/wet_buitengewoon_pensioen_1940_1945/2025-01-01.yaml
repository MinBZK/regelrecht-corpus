  - number: 24a
    text: |-
      De ontvangst van de aanvrage wordt de aanvrager schriftelijk bevestigd. Daarbij wordt hem voorlichting gegeven over
      de verdere procedure en de geldende behandeltermijnen.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel24a
  - number: '25'
    text: |-
      1 Van de beschikking wordt mededeling gedaan aan de Stichting 1940-1945.

      2 Bij de bekendmaking van de beschikking wordt voorlichting gegeven over de procedure en de voor het bezwaarschrift
      geldende termijn van behandeling.

      3 De beschikking op een aanvrage krachtens [artikel 4][ref1] onderscheidenlijk de [artikelen 14][ref2] en
      [15][ref3] voor zover de overleden deelnemer aan het verzet geen aanspraken op deze wet heeft doen gelden, wordt
      gegeven binnen negen maanden na de datum waarop de aanvrage is ingekomen. Indien de Raad ten gevolge van bijzondere
      omstandigheden niet binnen deze termijn kan beslissen, kan hij eenmaal met ten hoogste acht weken worden verlengd.
      Van de verlenging doet de Raad schriftelijk mededeling aan de belanghebbende en aan de Stichting 1940-1945.

      4 De beschikking op een aanvrage krachtens [artikel 24, tweede lid][ref4], wordt gegeven binnen zes maanden na de
      datum waarop de aanvrage is ingekomen. Indien de Raad ten gevolge van bijzondere omstandigheden niet binnen deze
      termijn kan beslissen, kan hij eenmaal met ten hoogste vier weken worden verlengd. Van de verlenging doet de Raad
      schriftelijk mededeling aan de belanghebbende en aan de Stichting 1940–1945.

      5 De beschikking op een aanvrage krachtens [artikel 4][ref5], voorzover de aanvrager reeds op grond van
      [artikel 24, tweede lid][ref6], als deelnemer aan het verzet is erkend, [artikel 11][ref7], de [artikelen 14][ref8]
      en [15][ref9] voor zover de overleden deelnemer aan het verzet aanspraken op deze wet heeft doen gelden,
      onderscheidenlijk [artikel 24, zesde en zevende lid][ref10], wordt gegeven binnen dertien weken na de datum waarop
      de aanvrage is ingekomen. Indien de Raad of de Sociale verzekeringsbank ten gevolge van bijzondere omstandigheden
      niet binnen deze termijn kan beslissen, kan hij eenmaal met ten hoogste vier weken worden verlengd. Van de
      verlenging doet de Raad of de Sociale verzekeringsbank schriftelijk mededeling aan de belanghebbende en aan de
      Stichting 1940-1945.

      6 Met betrekking tot een aanvrage, bedoeld in het vijfde lid, die wordt ingediend terwijl een aanvrage, bedoeld
      in het derde lid, nog in behandeling is geldt, in afwijking van het vijfde lid, de termijn die resteert voor
      de beschikking op de aanvrage, bedoeld in het derde lid, tenzij de resterende termijn korter is dan de termijn,
      bedoeld in het vijfde lid.


