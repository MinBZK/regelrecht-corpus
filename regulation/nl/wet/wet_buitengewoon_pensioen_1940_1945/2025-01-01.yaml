  - number: '12'
    text: |-
      1 Bij algemene maatregel van bestuur worden met inachtneming van de volgende leden regelen vastgesteld betreffende
      de inkomsten, die voor verrekening met het buitengewoon pensioen in aanmerking komen.

      2 De inkomsten van de betrokkene, worden op het buitengewoon pensioen in mindering gebracht voor het bedrag,
      waarmede het buitengewoon pensioen, ongeacht de vermeerdering of vergoeding ingevolge de [artikelen 10][ref1],
      [11][ref2] en [11a][ref3], vermeerderd met de inkomsten uit vermogen, alsmede met vijfenzeventig procent van
      het pensioen ingevolge de [Algemene Ouderdomswet][ref4] (*Stb.* 1956, 281) en [Algemene nabestaandenwet][ref5]
      en zeventig procent van de overige inkomsten de grondslag, waarover het buitengewoon pensioen is berekend,
      overschrijdt.

      Tot de inkomsten van betrokkene als bedoeld in de vorige volzin worden niet gerekend:

      a. inkomsten uit arbeid indien de betrokkene de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref6], heeft bereikt;

      b. inkomsten uit arbeid, arbeidsvervangende inkomsten en inkomsten uit onderneming van zijn echtgenoot;

      c. inkomsten uit vermogen, tot een bedrag van vijfhonderd gulden

      met dien verstande, dat indien met zodanige inkomsten van de echtgenoot of gewezen echtgenoot of uit vermogen reeds
      rekening is gehouden bij de vaststelling van de pensioengrondslag, een bedrag gelijk aan het met deze inkomsten
      verband houdende deel van het buitengewoon pensioen op het buitengewoon pensioen in mindering wordt gebracht. Wij
      bepalen bij algemene maatregel van bestuur in welke gevallen van laatstgenoemde vermindering wordt afgezien. Het
      in of krachtens de tweede en derde volzin bepaalde vindt geen toepassing, indien zulks zou leiden tot een lager
      betaalbaar pensioenbedrag.

      3 Indien op grond van hetzelfde feit, als waaraan het genot van een buitengewoon pensioen wordt ontleend,
      gelijktijdig een uitkering, een pensioen of andere inkomsten worden genoten ten laste van het Rijk, de
      Republiek Suriname, de Nederlandse Antillen, Aruba, de Republiek Indonesië, een publiekrechtelijk lichaam in
      een dezer gebieden of een door het openbaar gezag aldaar ingesteld fonds, wordt - behoudens het bepaalde in
      het vijfde lid - het bedrag van het buitengewoon pensioen, ongeacht de vermeerdering of vergoeding ingevolge de
      [artikelen 10][ref7], [11][ref8] en [11a][ref9], met het bedrag van die uitkering, dat pensioen of die andere
      inkomsten verminderd, nadat daarvan is afgetrokken het bedrag ter compensatie ter zake van de premie ingevolge
      de [Algemene Ouderdomswet][ref10] en de [Algemene nabestaandenwet][ref11], hetwelk daarin is of naar de voor de
      buitengewone pensioenen geldende wettelijke maatstaven moet worden geacht te zijn begrepen. Voor zover echter die
      uitkering, dat pensioen of die andere inkomsten worden genoten uit hoofde van een vrijwillige verzekering, welke
      werd gesloten op grond van een wettelijk verleende bevoegdheid, of uit hoofde van een verplichte verzekering,
      welke voor eigen rekening is voortgezet, en door de Sociale verzekeringsbank als zodanig wordt aangemerkt, dan wel
      krachtens een wettelijke regeling van overeenkomstige strekking als de [Ziektewet][ref12], is het bepaalde in de
      vorige volzin niet van toepassing.

      4 Voor de toepassing van de eerste volzin van het vorige lid wordt een afkoopsom krachtens de
      [Liquidatiewet ongevallenwetten][ref13] (*Stb.* 1967, 99) uitsluitend in aanmerking genomen in het jaar van
      uitbetaling daarvan.

      5 Indien op grond van hetzelfde feit, als waaraan het genot van een buitengewoon pensioen wordt ontleend,
      gelijktijdig een uitkering krachtens de Interimwet invaliditeitsrentetrekkers (*Stb.* 1962, 534) of een daarvoor
      in de plaats tredende uitkering krachtens de [Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref14]
      (*Stb.* 1967, 102) wordt genoten, wordt - indien dit voor betrokkene voordeliger is - voor de toepassing van het
      bepaalde in het derde lid die uitkering verminderd met het bedrag van de daarover verschuldigde premie ingevolge de
      [Wet financiering sociale verzekeringen][ref15], met dien verstande, dat deze vermindering beperkt blijft tot het
      bedrag, dat over het jaar 1966 in mindering werd gebracht.

      6 Indien onder het pensioen of de andere inkomsten, bedoeld in de eerste volzin van het derde lid, zijn begrepen
      bijslagen of toeslagen voor kinderen, die na het tijdstip, hetwelk gediend heeft voor de beoordeling van de
      pensioengrondslag, zijn geboren of deel zijn gaan uitmaken van het gezin van de gepensioneerde, worden deze
      bijslagen of toeslagen niet op het buitengewoon pensioen in mindering gebracht. Indien onder het pensioen of
      andere inkomsten, bedoeld in de eerste volzin van het derde lid, zijn begrepen bedragen, welke worden genoten
      krachtens in andere wettelijke regelingen voorkomende bepalingen van overeenkomstige strekking als die van de
      [artikelen 10][ref16], [11][ref17] en [11a][ref18] van deze wet, worden ook die bedragen niet op het buitengewoon
      pensioen in mindering gebracht; is evenwel een vermeerdering of vergoeding ingevolge de [artikelen 10][ref19],
      [11][ref20] en [11a][ref21] van deze wet toegekend, dan wordt die vermeerdering of vergoeding verminderd met het
      bedrag, dat genoten wordt krachtens de met die artikelen overeenkomende bepalingen in andere wettelijke regelingen.


