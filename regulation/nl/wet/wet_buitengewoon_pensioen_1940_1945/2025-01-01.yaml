  - number: '28'
    text: |-
      1 Het buitengewoon pensioen van de weduwe en dat van een gewezen echtgenote eindigen voorts bij een volgend door
      haar gesloten huwelijk en wel met het einde van het kwartaal, in de loop waarvan het huwelijk heeft plaatsgehad.
      Indien de vrouw dan binnen dertien weken na het sluiten van dat huwelijk een verzoek daartoe indient bij de
      Sociale verzekeringsbank, ontvangt zij als afkoopsom van haar buitengewoon pensioen een bedrag ineens van tweemaal
      het jaarbedrag van haar buitengewoon pensioen, verminderd met de bedragen, welke worden genoten krachtens in
      andere wettelijke regelingen voorkomende bepalingen van overeenkomstige strekking. Wordt een dergelijk verzoek
      niet gedaan, dan wordt aan de vrouw, indien haar huwelijk wordt ontbonden, op haar aanvrage door de Sociale
      verzekeringsbank haar vroeger buitengewoon pensioen weder toegekend. Zouden haar echter ter zake van het latere
      huwelijk pensioen of andere inkomsten toekomen, als bedoeld in [artikel 12, derde lid][ref1], dan vindt deze
      wetsbepaling overeenkomstige toepassing. Het buitengewoon pensioen gaat dan weer in met de dag volgende op die van
      de ontbinding van het huwelijk, mits de aanvrage is ingediend binnen één jaar na de datum van de ontbinding van
      het vorige huwelijk. Wordt de aanvrage later ingediend dan gaat het buitengewoon pensioen in op de dag waarop de
      aanvrage bij de Sociale verzekeringsbank is binnengekomen.

      2 Voor de berekening van de afkoopsom in het eerste lid bedoeld, geldt als bedrag van het buitengewoon pensioen
      het bedrag, waarop het pensioen zou zijn bepaald zonder de vermindering, bedoeld in [artikel 18, tweede lid][ref2],
      of [artikel 19, tweede lid][ref3], welk bedrag wordt verminderd met de tijdelijke verhoging, bedoeld in
      [artikel 18][ref4].

      3 Het bepaalde in de vorige leden is van overeenkomstige toepassing ten aanzien van de personen, bedoeld in
      [artikel 14, vierde lid, eerste volzin, onder ][ref5], alsmede ten aanzien van de moeder, de grootmoeder en de
      schoonmoeder van een overleden deelnemer aan het verzet.

      4 Indien de weduwe in het genot was van een garantietoeslag als bedoeld in [artikel 31][ref6], bedraagt de
      afkoopsom, bedoeld in het eerste lid, indien dat voor haar gunstiger is, vierentwintig maal het bedrag van de
      garantietoeslag, die zij genoot over de maand, voorafgaande aan de maand waarin dat volgende huwelijk heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel12
