  - number: '20'
    text: |-
      1 Op de buitengewone pensioenen, toegekend aan de personen, bedoeld in [artikel 17][ref1], is het bepaalde
      in [artikel 12, eerste lid, tweede lid, tweede volzin, onder a][ref2], alsmede het derde en zesde lid, van
      overeenkomstige toepassing.

      2 Voor zover door de weduwe of de gewezen echtgenote inkomsten uit vermogen worden genoten, worden deze voor
      vijftig procent van die inkomsten op het buitengewoon pensioen in mindering gebracht, met dien verstande, dat
      indien die inkomsten minder dan € 680,67 per jaar bedragen, slechts een zodanig bedrag in mindering wordt gebracht
      als waarmede die inkomsten een som van € 340,34 mochten te boven gaan.

      3 Voor zover door de weduwe of de gewezen echtgenote andere inkomsten dan waarop in het eerste en tweede lid
      wordt gedoeld, worden genoten, wordt vijftig procent van het bedrag, waarmede die inkomsten de som van € 453,78
      overschrijden, op het buitengewoon pensioen in mindering gebracht. Onverminderd het bepaalde in de vorige
      volzin worden, indien de daar bedoelde overschrijding uitsluitend of mede het gevolg is van het genot van
      een ouderdomspensioen krachtens de Algemene Ouderdomswet van meer dan € 453,78 van het bedrag, waarmede dat
      ouderdomspensioen de som van € 453,78 overschrijdt, in plaats van vijftig procent de volgende percentages op het
      buitengewoon pensioen in mindering gebracht:

      a. op een buitengewoon weduwenpensioen, dat geen vermindering als bedoeld in [artikel 17, a en b][ref3], heeft
      ondergaan: zestig procent;

      b. op een buitengewoon weduwenpensioen, dat een vermindering als bedoeld in [artikel 17, a en b][ref4], heeft
      ondergaan: een evenredig deel van het onder *a* genoemde percentage;

      c. op het buitengewoon pensioen van de gewezen echtgenote, bedoeld in [artikel 17, i en j][ref5], een deel van
      zestig procent, hetwelk tot dat percentage in dezelfde verhouding staat als het aantal jaren, hetwelk in de in die
      artikelonderdelen genoemde berekeningsformule door de letter p onderscheidenlijk x wordt voorgesteld, zich verhoudt
      tot veertig jaar.

      Voor een buitengewoon pensioen, toegekend aan de in [artikel 17, b][ref6], bedoelde weduwe alsook voor een
      buitengewoon pensioen, toegekend aan de gewezen echtgenote, bedoeld in [artikel 17, j][ref7], wordt het op deze
      pensioenen ingevolge de vorige volzin in mindering te brengen bedrag beperkt tot een percentage daarvan, gelijk
      aan dat der invaliditeit, waarnaar het buitengewoon pensioen van de overleden echtgenoot onderscheidenlijk gewezen
      echtgenoot van de vrouw laatstelijk was of zou zijn berekend.

      4 Indien door de weduwe of de gewezen echtgenote zowel inkomsten bedoeld in het tweede lid als inkomsten bedoeld in
      het derde lid worden genoten, worden, in afwijking van het bepaalde aan het slot van het tweede lid, de inkomsten
      uit vermogen voor vijftig procent van die inkomsten op het buitengewoon pensioen in mindering gebracht, met dien
      verstande, dat in elk geval een bedrag van € 340,34 van het totaal der inkomsten buiten mindering blijft.

      5 Indien een uitkering ingevolge de [Algemene nabestaandenwet][ref8] wordt genoten, wordt die uitkering niet
      gerekend tot de met het buitengewoon pensioen verrekenbare inkomsten, als in de voorgaande leden bedoeld. In
      dat geval worden echter, nadat de voorgaande leden zijn toegepast, van het bedrag van de uitkering ingevolge de
      [Algemene nabestaandenwet][ref9] de volgende percentages op het buitengewoon pensioen in mindering gebracht:

      a. op een buitengewoon weduwenpensioen, dat geen vermindering als bedoeld in [artikel 17, a en b][ref10], heeft
      ondergaan, en op het buitengewoon wezenpensioen: zestig procent;

      b. op een buitengewoon weduwenpensioen, dat een vermindering als bedoeld in [artikel 17, a en b][ref11], heeft
      ondergaan, een evenredig deel van het onder *a* genoemde percentage;

      c. op het buitengewoon pensioen van de gewezen echtgenote, bedoeld in [artikel 17, i en j][ref12], een deel van
      zestig procent, hetwelk tot dat percentage in dezelfde verhouding staat als het aantal jaren, hetwelk in de in die
      artikelonderdelen genoemde berekeningsformule door de letter p onderscheidenlijk x wordt voorgesteld, zich verhoudt
      tot veertig jaar.

      Het bepaalde in de derde volzin van het derde lid van dit artikel is van overeenkomstige toepassing.

      Indien de weduwe tevens in het genot is van een invaliditeitsrente krachtens de Invaliditeitswet, waarop zij tot
      het in werking treden van dit artikellid, ingevolge de Wet tot aanvulling van renten krachtens de Invaliditeitswet
      en de wet van 3 februari 1954 (*Stb.* 60) toe- en bijslagen genoot, komt het totaal bedrag dezer toe- en bijslagen
      in aanmerking voor aftrek op de in de vorige volzin bedoelde vermindering.

      Ten aanzien van degene, die aantoont, dat uit hoofde van zijn aanspraak op uitkering ingevolge de
      [Algemene nabestaandenwet][ref13] mede een vermindering plaatsvindt van enig ander pensioen of enige andere
      verplichte periodieke uitkering, en dat het gezamenlijke bedrag der verminderingen zestig procent van het bedrag
      van bedoeld bodempensioen overschrijdt, wordt de vermindering, in de vorige volzinnen van dit artikellid bedoeld,
      zodanig beperkt, dat het inkomen van de belanghebbende zo mogelijk veertig procent van het bedrag van bedoeld
      bodempensioen meer bedraagt dan ingeval geen uitkering ingevolge de [Algemene nabestaandenwet][ref14] wordt
      genoten.

      6 Het ingevolge de voorafgaande leden met het buitengewoon pensioen van de weduwe en/of de gewezen
      echtgenote wegens het genot van neveninkomsten verrekenbare bedrag wordt beperkt tot het bedrag, waarmede
      het buitengewoon pensioen - ongeacht de vermindering, bedoeld in de [artikelen 18][ref15] en [19][ref16] -,
      vermeerderd met die neveninkomsten, vijfenzestig procent van de in [artikel 12, tweede lid][ref17], bedoelde
      grondslag overschrijdt, met dien verstande evenwel, dat de verrekening van een pensioen of uitkering als
      bedoeld in [artikel 12, derde lid][ref18], zomede de verrekening ter zake van een uitkering ingevolge de
      [Algemene nabestaandenwet][ref19] en ter zake van een pensioen ingevolge de [Algemene Ouderdomswet][ref20]
      onverkort blijft. Tot de neveninkomsten, bedoeld in de vorige volzin, worden niet gerekend de kinderbijslagen of
      -toeslagen, zomede de inkomsten, welke onverplicht door derden worden verschaft.


