  - number: '15'
    text: |-
      1 Indien de deelnemer aan het verzet het leven heeft verloren in verband met het verzet, dan wel is overleden aan
      de gevolgen van verwonding, verminking, ziekten of gebreken, als bedoeld in [artikel 4][ref1], ontstaat voorts
      recht op buitengewoon pensioen voor:

      a. elk kind dat in familierechtelijke betrekking stond tot de overledene; voorts onder de voorwaarden in
      [artikel 18][ref2] gesteld, voor:

      b. elk ander kind, ten behoeve van hetwelk aan de overledene onderhoudsplicht krachtens het Burgerlijk Wetboek was
      opgelegd of ten behoeve van hetwelk de overledene een zodanige onderhoudsplicht had erkend;

      c. de ouders, of bij ontstentenis van deze, de grootouders van de overledene, indien deze hun kostwinner was;

      d. elk ouderloos kleinkind van de overledene, indien deze deszelfs kostwinner was;

      e. de schoonouders van de overledene, indien deze hun kostwinner was.

      2 Eveneens recht op buitengewoon pensioen heeft elk kind dat in familierechtelijke betrekking stond tot een
      deelnemer aan het verzet, die is overleden door andere oorzaken dan in het vorige lid bedoeld, mits de deelnemer
      aan het verzet op het tijdstip van zijn overlijden recht op buitengewoon pensioen ontleende aan het bepaalde in
      [artikel 4][ref3].

      3 Recht op buitengewoon pensioen bestaat voor de kinderen, bedoeld in het eerste lid, onder a, b en d, alsmede voor
      de kinderen, bedoeld in het tweede lid, zolang zij beneden de leeftijd van eenentwintig jaren en niet gehuwd zijn
      of gehuwd geweest zijn en voor de schoonouders, bedoeld in het eerste lid onder e, zolang de overledene, ware hij
      nog in leven, als behuwdkind jegens hen onderhoudsplichtig zou zijn geweest.

      4 Voor de toepassing van deze wet worden met de in het eerste lid, onder a, bedoelde kinderen gelijkgesteld
      kinderen, die op het tijdstip van het overlijden op kosten van de deelnemer aan het verzet werden opgevoed en na
      diens overlijden geen kostwinner hebben.


