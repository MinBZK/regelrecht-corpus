  - number: '14'
    text: |-
      1 Recht op buitengewoon pensioen heeft de weduwe van een deelnemer aan het verzet, indien haar echtgenoot het
      leven heeft verloren in verband met het verzet dan wel indien hij op het tijdstip van zijn overlijden recht op
      buitengewoon pensioen ontleende aan het bepaalde in [artikel 4][ref1].

      2 Eveneens recht op buitengewoon pensioen heeft de vrouw, met wie een overleden deelnemer aan het verzet gehuwd is
      geweest, mits:

      a. de man op de dag waarop de beschikking tot echtscheiding of de ontbinding van het huwelijk is uitgesproken dan
      wel het geregistreerd partnerschap ingevolge [artikel 80c, onder c en d, van Boek 1 van het Burgerlijk Wetboek]
      (onbekend) is beëindigd, recht op buitengewoon pensioen ontleende aan het bepaalde in [artikel 4][ref2] en hij dat
      recht ook op het tijdstip van zijn overlijden kon doen gelden,

      b. de onder *a* bedoelde dag ligt na het tijdstip van de inwerkingtreding van de Wet herziening echtscheidingsrecht
      en de echtscheiding of de ontbinding van het huwelijk niet is uitgesproken met toepassing van het vóór genoemd
      tijdstip geldende recht, en

      c. de vrouw niet als gevolg van hertrouwen, het aangaan van een huwelijk na een geregistreerd partnerschap, het
      aangaan van een geregistreerd partnerschap na een huwelijk dan wel het opnieuw aangaan van een geregistreerd
      partnerschap met haar vroegere echtgenoot ter zake van diens overlijden recht op buitengewoon weduwenpensioen
      verkrijgt,

      met dien verstande, dat indien de vrouw op de datum van overlijden van haar vroegere echtgenoot is hertrouwd of
      geregistreerd dan wel opnieuw geregistreerd, het recht op buitengewoon pensioen, hetwelk zij aan dat overlijden
      ontleent, eerst ontstaat op de dag, volgende op die, waarop dat volgende door haar gesloten huwelijk is ontbonden.

      3 Voor de toepassing van deze wet wordt met een weduwe (echtgenote) gelijkgesteld de vrouw, die ingevolge een
      uitspraak van de Afdeling Rechtspraak van de Raad voor het Rechtsherstel of enige andere rechterlijke uitspraak in
      vermogensrechtelijk en/of erfrechtelijk opzicht gelijk wordt gesteld met een weduwe (echtgenote).

      4 Buitengewoon pensioen als in de voorgaande leden van dit artikel bedoeld, komt eveneens toe aan:

      a. de weduwnaar van een deelneemster aan het verzet;

      b. de man, met wie een overleden deelneemster aan het verzet gehuwd is geweest.

      Op het buitengewoon pensioen van de in de vorige volzin onder *a* en *b* genoemde personen zijn de bepalingen van
      deze wet, betrekking hebbende op het buitengewoon pensioen van de in het eerste onderscheidenlijk het tweede lid
      van dit artikel genoemde personen, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel4
