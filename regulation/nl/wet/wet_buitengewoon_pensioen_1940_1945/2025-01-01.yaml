  - number: '16'
    text: |-
      1 Aan de in de [artikelen 14][ref1] en [15][ref2] genoemde betrekkingen van een deelnemer aan het verzet wordt
      tijdelijk een buitengewoon pensioen verleend, indien de deelnemer aan het verzet vermist is geraakt en de
      vermissing in verband staat met het verzet.

      2 Het bedrag van dit tijdelijk pensioen zal gelijk zijn aan het bedrag, waarop de belanghebbenden recht zouden
      hebben, wanneer de vermiste het leven had verloren in verband met het verzet.

      3 Aan de in de [artikelen 14][ref3] en [15][ref4] genoemde betrekkingen van een deelnemer aan het verzet wordt
      eveneens tijdelijk een buitengewoon pensioen verleend, indien de deelnemer aan het verzet anders dan in verband met
      het verzet vermist is geraakt en hij op het tijdstip van zijn vermissing recht op buitengewoon pensioen ontleende
      aan het bepaalde in [artikel 4][ref5].

      4 Het bedrag van het in het vorige lid bedoelde tijdelijk pensioen zal gelijk zijn aan het bedrag, waarop de
      belanghebbenden recht zouden hebben, wanneer de vermiste zou zijn overleden.

      5 Het tijdelijk pensioen gaat van rechtswege over in een blijvend buitengewoon pensioen, zodra het overlijden
      van de vermiste vaststaat of indien omtrent hem bij rechterlijk vonnis is verklaard, dat de vermissing van de
      betrokkene is vastgesteld.

      6 De overige bepalingen van dit hoofdstuk zijn ook op het tijdelijk buitengewoon pensioen van toepassing.


