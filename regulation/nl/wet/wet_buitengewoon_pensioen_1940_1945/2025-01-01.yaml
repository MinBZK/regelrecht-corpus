    text: |-
      Voor de toepassing van deze wet wordt gelijkgesteld met:

      a. huwelijk: het geregistreerd partnerschap;

      b. gehuwd: als partner geregistreerd;

      c. echtgenoot of echtgenote: de geregistreerde partner;

      d. weduwe of weduwnaar: de achtergebleven partij bij een geregistreerd partnerschap;
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel1a
  - number: 1b
    text: |-
      Waar in deze wet in een artikel of artikellid sprake is van «de Raad of de Sociale
      verzekeringsbank» is de taakverdeling in overeenstemming met de [artikelen 4][ref1] en
      [6 van de Wet uitvoering wetten voor verzetsdeelnemers en oorlogsgetroffenen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0027660#Artikel6
