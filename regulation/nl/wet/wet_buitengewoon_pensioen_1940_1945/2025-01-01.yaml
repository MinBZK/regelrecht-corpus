  - number: 11a
    text: |-
      1 Wanneer op grond van verwonding, verminking, ziekten of gebreken, als bedoeld in [artikel 4][ref1], een
      buitengewoon pensioen wordt toegekend en uit hoofde van die verwonding, verminking, ziekten of gebreken behandeling
      of verpleging is vereist, wordt aan de gepensioneerde ter zake daarvan vergoeding verleend volgens bij of krachtens
      algemene maatregel van bestuur te stellen regelen.

      2 In afwijking van het eerste lid kan aan categorieën gepensioneerden vergoeding ter zake van bepaalde de
      behandeling of verpleging omvattende voorzieningen worden verleend zonder dat deze voorzieningen uit hoofde
      van verwonding, verminking, ziekten of gebreken als bedoeld in [artikel 4, eerste lid][ref2], zijn vereist. Bij
      algemene maatregel van bestuur worden ter zake regels gesteld.

      3 Bij algemene maatregel van bestuur worden regels gesteld betreffende de mogelijkheid om de vergoeding ter
      zake van bepaalde de behandeling of verpleging omvattende voorzieningen na het overlijden van de gepensioneerde
      gedurende een bepaalde tijd ten gunste van de weduwe of weduwnaar voort te zetten..


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002032#Artikel4
