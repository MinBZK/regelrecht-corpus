  - number: '31'
    text: |-
      Voor de toepassing van [artikel 31a][ref1] en van de tot uitvoering daarvan genomen besluiten worden verstaan
      onder:

      a. pensioenbedragen: de aan [artikel 2, eerste lid][ref2], ontleende pensioenen, vermeerderd met de toeslag
      krachtens de [Toeslagwet buitengewone pensioenen 1966][ref3], vóórdat het bepaalde in de [artikelen 12][ref4],
      onderscheidenlijk [20][ref5] en [29a][ref6] daarop is toegepast;

      b. grondslagen, welke voor toepassing van [artikel 12, tweede lid][ref7], gelden voor de verrekening van inkomsten
      met het buitengewoon pensioen: de krachtens het bepaalde in de [Toeslagwet buitengewone pensioenen 1966][ref8]
      verhoogde grondslagen;

      c. maxima, bedoeld in de [artikelen 17, e, f en g,][ref9][18, eerste lid][ref10] en [19, eerste lid][ref11]: de
      krachtens het bepaalde in de [Toeslagwet buitengewone pensioenen 1966][ref12] fictief verhoogde maxima.


