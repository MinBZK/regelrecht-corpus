  - number: 42d
    text: |-
      1 Op aanvraag van de gerechtigde wordt het buitengewoon pensioen of de garantietoeslag, met uitzondering van
      de op grond van [artikel 8][ref1] vastgestelde pensioengrondslag en het invaliditeitspercentage, bedoeld in
      [artikel 9][ref2], opnieuw vastgesteld indien het vast te stellen pensioen of de vast te stellen garantietoeslag op
      de datum van deze aanvraag hoger is dan het laatst vastgestelde of aangepaste pensioen of de laatst vastgestelde of
      aangepaste garantietoeslag, mits dit niet uitsluitend het gevolg is van de koersomrekening van inkomsten die door
      de gerechtigde of zijn echtgenoot worden ontvangen.

      2 Indien toepassing is gegeven aan het eerste lid gaat het opnieuw vastgestelde buitengewoon pensioen of de opnieuw
      vastgestelde garantietoeslag in op de eerste dag van de maand waarin de aanvraag is ingediend.

      3 Op een beschikking, voortvloeiende uit de toepassing van het eerste lid, is [artikel 25, vijfde lid][ref3], van
      overeenkomstige toepassing.


