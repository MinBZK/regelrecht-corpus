  - number: 31i
    text: |-
      Het buitengewoon pensioen, bedoeld in de [artikelen 9][ref1], [17][ref2] en [18a][ref3], de garantietoeslag genoemd
      in [artikel 31e][ref4], alsmede de vermeerdering, genoemd in de [artikelen 10][ref5] en [11][ref6], worden naar
      boven afgerond tot hele euro’s.


