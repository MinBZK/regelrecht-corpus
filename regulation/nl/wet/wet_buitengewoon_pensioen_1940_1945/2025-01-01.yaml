  - number: '13'
    text: |-
      1 Geen buitengewoon pensioen wordt verleend of gewijzigd, zonder dat over het ontstaan, de aard en de gevolgen van
      de verwonding, verminking, ziekten of gebreken, welke recht geven op buitengewoon pensioen, op kosten van het Rijk
      een geneeskundig onderzoek heeft plaatsgehad en daarbij de invaliditeitspercentages zijn vastgesteld, een en ander
      naar regelen te stellen bij algemene maatregel van bestuur.

      2 Het geneeskundig onderzoek zal, op last van de Raad of de Sociale verzekeringsbank éénmaal worden herhaald,
      indien de belanghebbende daartoe de wens te kennen geeft in zijn bezwaarschrift, als bedoeld in [artikel 37][ref1],
      en voorts in elk geval waarin een herhaling door het Rijk wenselijk wordt geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel37
