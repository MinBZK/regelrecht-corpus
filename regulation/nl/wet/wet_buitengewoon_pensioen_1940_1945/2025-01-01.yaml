  - number: '17'
    text: |-
      Het buitengewoon pensioen, bedoeld in de [artikelen 14][ref1] en [15][ref2], bedraagt:

      a. voor de weduwe, wier echtgenoot het leven heeft verloren in verband met het verzet, dan wel is overleden
      aan de gevolgen van verwonding, verminking, ziekten of gebreken, als bedoeld in [artikel 4][ref3], alsmede voor
      de weduwe van de deelnemer aan het verzet, die is overleden door andere oorzaken dan hiervoor genoemd en wiens
      invaliditeit, waarnaar zijn buitengewoon pensioen laatstelijk was of zou zijn berekend, tenminste zestig procent
      bedroeg, vijfenzestig procent van de pensioengrondslag, die op grond van het bepaalde in [artikel 8][ref4] of
      [artikel 41a][ref5] voor de echtgenoot heeft of zou hebben gegolden, indien deze als deelnemer aan het verzet recht
      op buitengewoon pensioen had of zou hebben gehad. Indien er bij het overlijden van de deelnemer aan het verzet
      tevens recht of krachtens [artikel 14, tweede lid][ref6], uitzicht op een of meerdere buitengewone pensioenen, als
      bedoeld onder *i*, bestaat, wordt het buitengewoon weduwenpensioen met het bedrag daarvan verminderd;

      b. voor de weduwe van de deelnemer aan het verzet, die het leven heeft verloren door andere oorzaken dan
      verwonding, verminking, ziekten of gebreken, als bedoeld in [artikel 4][ref7], en wiens invaliditeit, waarnaar zijn
      buitengewoon pensioen laatstelijk was of zou zijn berekend, minder dan zestig procent bedroeg, vijfenzestig procent
      van het pensioen, waarop de deelnemer op het tijdstip van zijn overlijden recht had of zou hebben gehad. Indien
      er bij het overlijden van de deelnemer aan het verzet tevens recht of krachtens [artikel 14, tweede lid][ref8],
      uitzicht op een of meer buitengewone pensioenen, als bedoeld onder *j*, bestaat, wordt het buitengewoon
      weduwenpensioen met het bedrag daarvan verminderd;

      c. voor elk kind dat in familierechtelijke betrekking stond tot de deelnemer aan het verzet, die het leven heeft
      verloren in verband met het verzet, dan wel is overleden aan de gevolgen van verwonding, verminking, ziekten of
      gebreken, als bedoeld in [artikel 4][ref9], alsmede voor elk door hem erkend kind, vijftien procent van de eerste
      € 2268,90 en tien procent van het overige gedeelte van de onder *a* bedoelde pensioengrondslag, indien de andere
      ouder aan het overlijden van de deelnemer aan het verzet aanspraak op buitengewoon pensioen ontleent; dertig
      procent van de eerste € 2268,90 en twintig procent van het overige gedeelte van het bedrag van die grondslag,
      indien de andere ouder aan het overlijden van de deelnemer aan het verzet geen aanspraak op buitengewoon pensioen
      ontleent.

      Het vorenstaande is van overeenkomstige toepassing op het kind dat in familierechtelijke betrekking stond tot
      de deelnemer aan het verzet, die is overleden door andere oorzaken dan hiervoor genoemd en wiens invaliditeit,
      waarnaar zijn buitengewoon pensioen laatstelijk was of zou zijn berekend, tenminste zestig procent bedroeg;

      d. voor elk ander kind ten behoeve van hetwelk de vader, die het leven heeft verloren in verband met het
      verzet, dan wel is overleden aan de gevolgen van verwonding, verminking, ziekten of gebreken, als bedoeld in
      [artikel 4][ref10], een onderhoudsplicht was opgelegd krachtens de bepalingen van het Burgerlijk Wetboek of ten
      behoeve van hetwelk de vader deze onderhoudsplicht had erkend, vijftien procent van de eerste € 2268,90 en tien
      procent van het overige gedeelte van de onder *a* bedoelde pensioengrondslag, indien de moeder aan het overlijden
      van de vader aanspraak op buitengewoon pensioen ontleent; dertig procent van de eerste € 2268,90 en twintig procent
      van het overige gedeelte van het bedrag van die grondslag, indien de moeder aan het overlijden van de vader geen
      aanspraak op buitengewoon pensioen ontleent;

      e. voor de ouders of bij ontstentenis van deze de grootouders van de overledene, zoveel als hij in de regel
      als kostwinner tot hun levensonderhoud bijdroeg, doch niet meer dan veertig procent van de eerste € 2268,90 en
      dertig procent van het overige bedrag van de boven onder *a* bedoelde pensioengrondslag en wel tot de dood van
      de langstlevende;

      f. voor elk ouderloos kleinkind van de overledene zoveel als hij in de regel als kostwinner tot diens
      levensonderhoud bijdroeg, doch niet meer dan twintig procent van de eerste € 2268,90 en vijftien procent van het
      overige bedrag van de boven onder *a* bedoelde pensioengrondslag;

      g. voor de schoonouders van de overledene zoveel als hij in de regel als kostwinner tot hun levensonderhoud
      bijdroeg, doch niet meer dan veertig procent van de eerste € 2268,90 en dertig procent van het overige bedrag van
      de boven onder *a* bedoelde pensioengrondslag en wel tot de dood van de langstlevende dan wel tot het tijdstip,
      waarop de overledene, ware hij nog in leven, als behuwdkind jegens hen niet meer onderhoudsplichtig zou zijn
      geweest;

      h. voor elk kind dat in familierechtelijke betrekking stond tot de deelnemer aan het verzet, die het leven heeft
      verloren door andere oorzaken dan verwonding, verminking, ziekten of gebreken, als bedoeld in [artikel 4][ref11],
      en wiens invaliditeit, waarnaar zijn buitengewoon pensioen laatstelijk was of zou zijn berekend, minder dan zestig
      procent bedroeg, vijftien procent van de eerste € 2268,90 en zes procent van het overige gedeelte van het onder
      *b* bedoelde pensioen, indien de andere ouder aan het overlijden van de deelnemer aan het verzet aanspraak op
      buitengewoon pensioen ontleent; dertig procent van de eerste € 2268,90 en twaalf procent van het overige gedeelte
      van het bedrag van dat pensioen, indien de andere ouder aan het overlijden van de deelnemer aan het verzet geen
      aanspraak op buitengewoon pensioen ontleent.

      Het in dit onderdeel bepaalde is slechts van toepassing op het kind, dat geboren is uit het huwelijk van de
      hiervoren bedoelde ouders of dat voor de toepassing van deze wet met een kind dat in familierechtelijke betrekking
      tot de deelnemer aan het verzet staat is gelijkgesteld;

      i. voor de gewezen echtgenote van een overleden deelnemer aan het verzet, die is overleden aan de gevolgen van
      verwonding, verminking, ziekten of gebreken, als bedoeld in [artikel 4][ref12], alsmede voor de gewezen echtgenote
      van een overleden deelnemer aan het verzet, die is overleden door andere oorzaken dan hiervoor genoemd en wiens
      invaliditeit, waarnaar zijn buitengewoon pensioen laatstelijk was of zou zijn berekend, ten minste zestig procent
      bedroeg, een bedrag, berekend volgens de formule:

      , in welke formule:

      p voorstelt: het aantal volle jaren, gedurende hetwelk de man in zijn leeftijdsperiode van 25 tot 65 jaar
      met de vrouw gehuwd is geweest, vermeerderd met het aantal volle jaren, gedurende hetwelk de man in dezelfde
      leeftijdsperiode vóór het sluiten van dat huwelijk zonder onderbreking ongehuwd is geweest, en

      q voorstelt: de pensioengrondslag, welke op grond van het bepaalde in [artikel 8][ref13] of [artikel 41a][ref14]
      voor de man op het tijdstip van zijn overlijden gold of zou hebben gegolden;

      j. voor de gewezen echtgenote van een overleden deelnemer aan het verzet, die is overleden door andere oorzaken
      dan verwonding, verminking, ziekten of gebreken, als bedoeld in [artikel 4][ref15], en wiens invaliditeit, waarnaar
      zijn buitengewoon pensioen laatstelijk was of zou zijn berekend, minder dan zestig procent bedroeg, een bedrag,
      berekend volgens de formule:

      , in welke formule:

      x voorstelt: het aantal volle jaren, gedurende hetwelk de man in zijn leeftijdsperiode van 25 tot 65 jaar
      met de vrouw gehuwd is geweest, vermeerderd met het aantal volle jaren, gedurende hetwelk de man in dezelfde
      leeftijdsperiode vóór het sluiten van dat huwelijk zonder onderbreking ongehuwd is geweest, en

      y voorstelt: het buitengewoon pensioen, waarop de man op het tijdstip van zijn overlijden recht had of zou hebben
      gehad.


