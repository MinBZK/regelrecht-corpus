  - number: 16a
    text: |-
      Voor de vaststelling van het recht op buitengewoon pensioen, waarop krachtens de bepalingen van deze paragraaf
      recht kan bestaan, is het bepaalde in [artikel 13, eerste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel13
