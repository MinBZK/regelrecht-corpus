preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een regeling te treffen met betrekking tot recht op
    buitengewoon pensioen ten behoeve van hen, die tijdens de vijandelijke bezetting van het Rijk in Europa door daad
    of houding hebben deelgenomen aan het binnenlands verzet, alsmede van hun nagelaten betrekkingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet wordt verstaan onder:

      "Onze Minister": Onze Minister van Volksgezondheid, Welzijn en Sport;

      "de Raad": de Pensioen- en Uitkeringsraad, bedoeld in
      [artikel 3 van de Wet uitvoering wetten voor verzetsdeelnemers en oorlogsgetroffenen][ref1];

      de Sociale verzekeringsbank: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      "deelnemers aan het verzet": zij, die tijdens de vijandelijke bezetting van het Rijk in Europa door daad of houding
      hebben deelgenomen aan het binnenlands verzet, met inbegrip van hen, die deel uitmaakten van de Binnenlandse
      Strijdkrachten en daadwerkelijk hebben deelgenomen aan de strijd tegen de vijandelijke bezettende macht van het
      Rijk in Europa;

      "gewezen echtgenote": de vrouw, bedoeld in [artikel 14, tweede lid][ref3];

      "peiljaar": het jaar vastgesteld ingevolge [artikel 8, tweede en derde lid][ref4], en [artikel 41][ref5];

      "minimum-pensioengrondslag": de pensioengrondslag, bedoeld in [artikel 8, zevende lid, aanhef][ref6].

      2 Bij algemene maatregel van bestuur worden categorieën van personen aangewezen op wie deze wet van overeenkomstige
      toepassing zal zijn.


