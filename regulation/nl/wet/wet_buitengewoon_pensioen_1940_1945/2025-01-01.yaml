  - number: '9'
    text: |-
      1 Het buitengewoon pensioen bedraagt zoveel procent van het bedrag van de pensioengrondslag als het voor de
      belanghebbende vastgestelde invaliditeitspercentage beloopt.

      2 Invaliditeitspercentages boven 10 procent worden naar boven afgerond in veelvouden van tien procent.

      3 Bij een percentage van minder dan 10 procent wordt invaliditeit geacht niet te bestaan.
    url: https://wetten.overheid.nl/BWBR0002032/2025-01-01#Artikel9
  - number: '10'
    text: |-
      Het buitengewoon pensioen wordt éénmaal met twintig procent van de pensioengrondslag vermeerderd, wanneer
      tengevolge van de verwonding, verminking, ziekten of gebreken, in [artikel 4][ref1] bedoeld:

      a. een der ledematen (handen of voeten) is verloren gegaan, of voorgoed geheel onbruikbaar is geworden, dan wel een
      toestand is ontstaan, die met een zodanig verlies of een zodanige onbruikbaarheid is gelijk te stellen;

      b. twee of meer ledematen dermate in beweeglijkheid of bruikbaarheid zijn verminderd, dat de toestand van de
      belanghebbende met die onder *a* beschreven is gelijk te stellen;

      c. het gezichtsvermogen door organische oorzaken zodanig is beperkt, dat het vermogen om zich zelfstandig te
      bewegen er ernstig door wordt getroffen;

      d. belangrijke misvorming van het gelaat is ontstaan, welke door hulpmiddelen niet voldoende te verbergen is, zodat
      de belanghebbende de omgang met zijn medemensen ernstig wordt bemoeilijkt; of

      e. een blijvend buitengewoon pensioen is verleend uit hoofde van een invaliditeit van 80 of 90 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel4
