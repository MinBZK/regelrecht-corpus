  - number: '27'
    text: |-
      Voor zover krachtens [artikel 26, derde lid][ref1], algemene gegevens of verwijsgegevens aan een derde
      kunnen worden verstrekt, wordt hem op zijn verzoek slechts mededeling gedaan van daarop betrekking hebbende
      administratieve gegevens, voor zover de verzoeker aantoont dat deze gegevens noodzakelijk zijn in verband met
      de uitvoering van het algemeen verbindend voorschrift of de werkzaamheden waarvoor de gegevens worden gevraagd.
      Geen gegevens worden verstrekt, waaruit de verstrekking van gegevens uit de basisadministratie aan een afnemer,
      overheidsorgaan of een derde kan worden afgeleid, voor zover dit noodzakelijk is in het belang van de veiligheid
      van de staat of de voorkoming, opsporing en vervolging van strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel26
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel27
    references:
