  - number: '4'
    text: |-
      1 De basisadministratie heeft tot doel de afnemers te voorzien van gegevens, voor zover deze gegevens noodzakelijk
      zijn voor de vervulling van hun publiekrechtelijke taken.

      2 De basisadministratie heeft mede tot doel:

      a. overheidsorganen te voorzien van gegevens, voor zover deze gegevens noodzakelijk zijn voor de vervulling van
      hun taken;

      b. derden te voorzien van gegevens in bij of krachtens deze wet aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel4
  - number: 4a
    text: |-
      Voor het uitvoeren van de verplichtingen op grond van [hoofdstuk 2, afdeling 1, paragraaf 2][ref1], worden geen
      kosten in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel4a
    references:
