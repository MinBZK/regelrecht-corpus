  - number: 27a
    text: |-
      Een andere verstrekking uit een basisadministratie of de verstrekkingenvoorziening dan bedoeld in de
      [paragrafen 2][ref1] of [3][ref2] is slechts toegestaan voor zover:

      a. de verstrekking plaatsvindt voor historische, statistische of wetenschappelijke doeleinden, en

      b. de persoonlijke levenssfeer van de ingeschrevene niet onevenredig wordt geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel3
