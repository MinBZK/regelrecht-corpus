  - number: '35'
    text: |-
      1 Naast de in [artikel 10, eerste lid][ref1], bedoelde gegevens worden tot een bij Koninklijk Besluit te bepalen
      datum over de ingeschrevene de volgende algemene gegevens opgenomen:

      a. gegevens over het ID-nummer, bedoeld in
      [artikel 2, eerste lid, onderdeel e, van de Wet identiteitskaarten BES][ref2], van de ingeschrevene, de ouders, de
      echtgenoot, de eerdere echtgenoten, de geregistreerde partner, de eerdere geregistreerde partners en de kinderen;

      b. de datum van opneming van de in onderdeel a genoemde ID-nummers.

      2 Naast de in [artikel 11, eerste lid][ref3], bedoelde gegevens worden tot de in het eerste lid bedoelde datum
      over de ingeschrevene de volgende verwijsgegevens en administratieve gegevens in verband met de verwijsgegevens
      opgenomen:

      a. het ID-nummer;

      b. datum van kracht worden ID-nummer.

      3 Het ID-nummer wordt opgenomen overeenkomstig de [Wet identiteitskaarten BES][ref4].

      4 De ID-nummers van de ouders, de echtgenoot, de eerdere echtgenoten, de geregistreerde partner, de
      eerdere geregistreerde partners en de kinderen worden ontleend aan de desbetreffende persoonslijsten in de
      basisadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel10
