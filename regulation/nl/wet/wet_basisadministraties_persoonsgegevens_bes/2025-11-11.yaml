  - number: 27b
    text: |-
      1 Indien een persoon aangifte doet van vertrek naar een ander openbaar lichaam,
      Aruba, Curaçao, Sint Maarten of een gemeente worden, met het oog op de bijhouding
      van persoonsgegevens in de andere basisadministratie, over die persoon de in
      __REF000___________________________________________________________________________________________________________
      _________, bedoelde gegevens spontaan medegedeeld aan de verantwoordelijke voor de verwerking van persoonsgegevens
      in de andere basisadministratie.

      2 Op verzoek van de verantwoordelijke voor de verwerking van persoonsgegevens in een andere basisadministratie
      worden, met het oog op de bijhouding van persoonsgegevens in de andere basisadministratie, gegevens als bedoeld
      in het eerste lid over een persoon die als ingezetene in de basisadministratie is of was ingeschreven, aan de
      verzoeker medegedeeld.

      3 Indien over een persoon, komende van een ander openbaar lichaam, Aruba, Curaçao, Sint Maarten of een gemeente,
      gegevens als bedoeld in het eerste lid moeten worden opgenomen in de basisadministratie en deze gegevens niet al
      uit de andere basisadministratie zijn ontvangen, wordt de verantwoordelijke voor de verwerking van persoonsgegevens
      in de andere basisadministratie verzocht deze gegevens alsnog mede te delen.

      4 Aan Onze Minister worden spontaan de gegevens verstrekt die hij nodig heeft in verband met de uitvoering
      van [artikel 1.4, tweede lid, van de Wet basisregistratie personen][ref2] wat betreft het bijhouden van
      persoonsgegevens overeenkomstig [afdeling 3 van hoofdstuk 2 van die wet][ref3].

      5 Op verzoek van Onze Minister worden voor de uitvoering van
      [artikel 4.3a, eerste lid, van de Wet basisregistratie personen][ref4], gegevens als bedoeld in
      [artikel 10, eerste lid][ref5], over personen die als ingezetene in de basisadministratie zijn of waren
      ingeschreven, aan hem medegedeeld.


