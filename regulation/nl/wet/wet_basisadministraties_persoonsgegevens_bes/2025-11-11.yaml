  - number: '2'
    text: In ieder openbaar lichaam is een geautomatiseerde basisadministratie met gegevens over de bevolking.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel2
  - number: '3'
    text: |-
      1 Het bestuurscollege is verantwoordelijk voor de verwerking van persoonsgegevens over de bevolking in een
      geautomatiseerde basisadministratie van persoonsgegevens.

      2 Bij ministeriële regeling worden regels gesteld omtrent het beheer, de technische en administratieve inrichting
      en werking en de beveiliging van de basisadministraties.

      3 Het bestuurscollege draagt zorg dat de basisadministratie functioneert overeenkomstig de regels, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel3
  - number: 3a
    text: |-
      1 Er is een verstrekkingenvoorziening ten behoeve van de systematische verstrekking van gegevens
      uit de basisadministraties van de openbare lichamen op grond van [artikel 26, eerste lid][ref1]. De
      verstrekkingenvoorziening bevat hiertoe een kopie van de persoonslijsten, die in de basisadministraties van de
      openbare lichamen zijn opgenomen.

      2 Onze Minister is verantwoordelijk voor de verstrekkingenvoorziening en draagt zorg voor een stelsel van
      berichtuitwisseling ten behoeve van de bijhouding van de basisadministraties van de openbare lichamen en de
      verstrekkingenvoorziening en de systematische verstrekking van gegevens.

      3 Bij ministeriële regeling worden regels gesteld omtrent:

      a. de technische en administratieve inrichting en werking en de beveiliging van de verstrekkingenvoorziening;

      b. de uitwisseling van berichten tussen de basisadministraties van de openbare lichamen en de
      verstrekkingenvoorziening en tussen de verstrekkingenvoorziening en de overheidsorganen en derden aan wie
      systematisch gegevens worden verstrekt.

      4 Het overheidsorgaan of de derde aan wie systematisch gegevens worden verstrekt draagt zorg dat de uitwisseling
      van berichten in verband met de systematische verstrekking van gegevens van zijn kant geschiedt overeenkomstig de
      regels, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel26
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel3a
