  - number: '18'
    text: |-
      1 Het bestuurscollege voldoet binnen vier weken aan het schriftelijk verzoek van betrokkene de hem betreffende
      gegevens in de basisadministratie op de aangegeven wijze te verbeteren, aan te vullen of te verwijderen, indien de
      gegevens onjuist dan wel onvolledig zijn of ten onrechte zijn opgenomen. Hiervoor worden geen kosten in rekening
      gebracht.

      2 De termijn, bedoeld in het eerste lid, kan door het bestuurscollege, voor zover noodzakelijk, ten hoogste
      driemaal met telkens acht weken worden verlengd, indien het verzoek betrekking heeft op gegevens over de
      burgerlijke staat of de nationaliteit. Van een beslissing tot verlenging wordt terstond schriftelijk mededeling
      gedaan aan de verzoeker.

      3 Het bestuurscollege doet terstond schriftelijk mededeling aan de verzoeker van de voldoening aan het verzoek.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel18
  - number: '19'
    text: |-
      1 Als het bestuurscollege het voornemen heeft:

      a. aan een aangifte geen of slechts ten dele gevolg te geven;

      b. een gegeven over de burgerlijke staat niet op te nemen, dan wel een geschrift daarover dat als akte is
      aangeboden niet als zodanig aan te merken;

      c. een gegeven over de nationaliteit niet op te nemen;

      d. ambtshalve over te gaan tot inschrijving, of tot opneming van gegevens in het geval dat inschrijving of opneming
      op grond van een aangifte had moeten geschieden;

      e. bij een opgenomen algemeen gegeven een aantekening over de onjuistheid van dat gegeven of over de strijdigheid
      daarvan met de openbare orde te plaatsen;

      f. niet te voldoen aan een verzoek als bedoeld in de [artikelen 17][ref1], [17a][ref2], [18][ref3] en
      [28, eerste lid][ref4], doet hij van dat voornemen aan de betrokkene zo spoedig mogelijk en, indien het voornemen
      betrekking heeft op een verzoek als bedoeld onder f, binnen de desbetreffende termijn schriftelijk mededeling onder
      vermelding van de gronden.

      2 Het bestuurscollege stelt de betrokkene in de gelegenheid binnen vier weken na de verzending van de mededeling
      van het voornemen, bedoeld in het eerste lid, zijn zienswijze schriftelijk kenbaar te maken en zo nodig mondeling
      toe te lichten.

      3 De in het tweede lid bedoelde termijn kan op schriftelijk verzoek van betrokkene, ten hoogste driemaal met
      telkens acht weken worden verlengd, voor zover het voornemen betrekking heeft op gegevens over de burgerlijke staat
      of de nationaliteit.

      4 Het bestuurscollege neemt binnen vier weken nadat de betrokkene zijn zienswijze kenbaar heeft gemaakt dan wel
      binnen vier weken na het verstrijken van de in het tweede lid bedoelde termijn de beslissing omtrent het voornemen.

      5 Het bestuurscollege brengt zijn beslissing schriftelijk ter kennis van de betrokkene. De beslissing vermeldt de
      gronden daarvan, voor zover de zienswijze van de betrokkene niet wordt gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0028208#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0028208#Artikel28
