        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
  - number: '21'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de indiening van verzoeken
      tot verstrekking van gegevens en de wijzen van verstrekking van gegevens uit de basisadministraties en de
      verstrekkingenvoorziening.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel21
  - number: 21a
    text: |-
      Aan een afnemer die geen orgaan is van het openbaar lichaam of een daaronder ressorterende dienst of instelling
      wordt geen rechtstreekse toegang verleend tot de basisadministratie.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel21a
  - number: '22'
    text: |-
      1 Verstrekking aan een afnemer geschiedt uitsluitend voor zover noodzakelijk voor de vervulling van diens
      publiekrechtelijke taak.

      2 De verstrekking heeft uitsluitend betrekking op de algemene gegevens, bedoeld
      in [artikel 10, eerste lid, onderdeel a][ref1], en de verwijsgegevens, bedoeld in
      [artikel 11, eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel11
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel22
    references:
