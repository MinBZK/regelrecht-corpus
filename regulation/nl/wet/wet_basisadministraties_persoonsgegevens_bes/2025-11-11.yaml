  - number: '28'
    text: |-
      1 Het bestuurscollege geeft aan het schriftelijke verzoek van betrokkene om in de gevallen, bedoeld in
      [artikel 26, derde lid, onder a, of vijfde lid][ref1] geen gegevens die opgenomen zijn op zijn persoonslijst
      of hem betreffende verwijsgegevens aan derden te verstrekken, binnen vier weken gevolg en doet daarvan terstond
      schriftelijk mededeling aan de verzoeker, onder vermelding van de geldende regels ter zake.

      2 In afwijking van het eerste lid worden omtrent de verzoeker in de gevallen bedoeld in
      [artikel 26, derde lid, onder a][ref2], gegevens verstrekt, indien de persoonlijke levenssfeer daardoor niet
      onevenredig wordt geschaad. Het bestuurscollege maakt de beslissing om krachtens artikel 26, derde lid, onder a, in
      afwijking van het eerste lid gegevens te verstrekken, terstond bekend aan de betrokkene. Het geeft geen uitvoering
      aan de beslissing binnen een daarbij gestelde termijn.

      3 Indien op de persoonslijst een aantekening is gesteld omtrent beperking van de verstrekking van gegevens aan
      derden, worden geen gegevens van de persoonslijst verstrekt op grond van [artikel 26, derde lid, onder b][ref3],
      voor zover de beperking van de verstrekking van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0028208#Artikel26
