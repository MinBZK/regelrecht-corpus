  - number: 35a
    text: |-
      [Artikel 12a, eerste lid][ref1], is niet van toepassing als een persoon op het moment van
      inwerkingtreding van dat artikel reeds in de basisadministratie is ingeschreven. In dat geval wordt
      het burgerservicenummer dat aan diegene is toegekend overeenkomstig [artikel 8, tweede lid][ref2], of
      [artikel 22, eerste lid, van de Wet algemene bepalingen burgerservicenummer][ref3] onmiddellijk opgenomen op diens
      persoonslijst.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0022428#Artikel22
