  - number: '24'
    text: |-
      Indien een verstrekking een algemeen gegeven betreft, dat is voorzien van een aantekening als bedoeld in
      [artikel 10, eerste lid, onderdeel c, onder 3°][ref1], wordt dat gegeven uitsluitend verstrekt onder mededeling
      van die aantekening.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel10
