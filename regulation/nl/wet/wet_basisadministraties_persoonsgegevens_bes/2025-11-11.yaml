    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *openbaar lichaam:* openbaar lichaam als bedoeld in
      [artikel 1, eerste lid, onder a, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1];

      b. *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      c. *basisadministratie:* een basisadministratie, als bedoeld in [artikel 2][ref2];

      d. *andere basisadministratie:* een basisadministratie over de bevolking in een ander openbaar lichaam, Aruba,
      Curaçao of Sint Maarten dan wel de basisregistratie personen in het Europese deel van Nederland;

      e. *persoonslijst:* het geheel van gegevens als bedoeld in [artikel 10, eerste lid][ref3], over een persoon in
      een basisadministratie;

      f. *inschrijving:* de opneming van een persoonslijst in een basisadministratie;

      g. *ingeschrevene:* degene ten aanzien van wie een persoonslijst is opgenomen in een basisadministratie of een
      andere basisadministratie;

      h. *ingezetene:* de ingeschrevene op wiens persoonslijst niet het gegeven van zijn overlijden of zijn vertrek is
      opgenomen;

      i. *afnemer:* een orgaan van een openbaar lichaam alsmede een daaronder ressorterende dienst of een bij
      eilandsverordening als zodanig aangewezen bedrijf of instelling met een publiekrechtelijke taak gericht op het
      territorium van het betreffende openbaar lichaam;

      j. *overheidsorgaan:*

      1. een orgaan van een rechtspersoon die in Nederland krachtens publiekrecht is ingesteld, of

      2. een ander persoon of college, met enig openbaar gezag in Nederland bekleed;

      k. *derde:* elke andere persoon of instelling dan een afnemer, een overheidsorgaan of de ingeschrevene;

      l. *gegevensuitwisseling:* het verstrekken van informatie over een ingeschrevene aan een andere basisadministratie;

      m. *gegevensverstrekking:* het verstrekken van informatie uit de persoonslijst van de ingeschrevene aan afnemers,
      overheidsorganen of derden;

      n. *adres:* het adres waar betrokkene woont, of bij ontbreken hiervan een adres waar betrokkene naar redelijke
      verwachting gedurende drie maanden het merendeel van de tijd zal overnachten;

      o. *verblijfstitel:* een verblijfstitel krachtens de [Wet toelating en uitzetting BES][ref4];

      p. *verstrekkingenvoorziening:* de verstrekkingenvoorziening, bedoeld in [artikel 3a][ref5];

      q. *burgerservicenummer:* het nummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref6].

      2 Onder «adres» wordt mede begrepen het adres van een woning die zich in een voertuig of vaartuig bevindt, indien
      het voertuig of vaartuig een vaste stand- of ligplaats heeft.


