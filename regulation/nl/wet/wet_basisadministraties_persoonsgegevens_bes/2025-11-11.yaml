  - number: '11'
    text: |-
      1 In de basisadministratie worden in verband met het vertrek van een persoon als bedoeld in [artikel 9][ref1] naar
      een ander openbaar lichaam, Aruba, Curaçao, Sint Maarten of het Europese deel van Nederland over de uitgeschreven
      persoon in ieder geval de volgende gegevens opgenomen:

      a. verwijsgegevens:

      1° gegevens over de naam en de geboorte;

      2° gegevens over het administratienummer;

      3° het gegeven dat de persoon intussen is ingeschreven in een andere basisadministratie, het adres en de datum van
      inschrijving, voor zover deze gegevens bekend zijn;

      b. administratieve gegevens in verband met de verwijsgegevens.

      2 Een verwijsgegeven dat in de basisadministratie is opgenomen, blijft daarin opgenomen, tenzij de betrokkene
      wederom in de basisadministratie als ingezetene wordt ingeschreven.

      3 Bij algemene maatregel van bestuur wordt nader bepaald welke verwijsgegevens en wordt bepaald welke
      administratieve gegevens in verband met de verwijsgegevens worden opgenomen, en bij ministeriele regeling worden
      regels gesteld met betrekking tot de verwijdering en de vernietiging van deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel9
