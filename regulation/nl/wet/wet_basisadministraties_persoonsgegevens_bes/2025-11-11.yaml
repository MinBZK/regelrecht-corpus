        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028208
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
  - number: 17b
    text: |-
      1 Het bestuurscollege verstrekt aan de ingeschrevene binnen vier weken na een inschrijving als bedoeld in
      [artikel 5][ref1] in begrijpelijke vorm een volledig overzicht van zijn persoonslijst.

      2 Bij minderjarigen jonger dan 16 jaar en bij onder curatele gestelden geschiedt de verstrekking aan de ouders,
      voogden of verzorgers, onderscheidenlijk aan de curator.

      3 Bij de verstrekking van de persoonslijst wordt schriftelijk mededeling gedaan van de hoofdlijnen van de ter
      zake van de basisadministratie geldende regels, waaronder ten minste de hoofdlijnen van de regels betreffende
      de identiteit van de voor de verwerking verantwoordelijke, de doeleinden van de basisadministratie, de opgenomen
      gegevenscategorieën, de categorieën van ontvangers van gegevens en de rechten van de ingeschrevene.

      4 Degene die aangifte van verblijf en adres doet, wordt bij die gelegenheid schriftelijk op de hoogte gesteld van
      het recht, bedoeld in [artikel 28][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel28
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel17b
