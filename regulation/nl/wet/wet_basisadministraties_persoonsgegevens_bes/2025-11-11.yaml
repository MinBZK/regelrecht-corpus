  - number: '29'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel29
  - number: '30'
    text: |-
      1 Onze Minister kan een onderzoek verrichten om vast te stellen of:

      a. een bestuurscollege voldoet aan de regels, bedoeld in [artikel 3, tweede lid][ref1];

      b. een overheidsorgaan of een derde aan wie systematisch gegevens worden verstrekt voldoet aan de regels, bedoeld
      in [artikel 3a, derde lid][ref2].

      2 Bij ministeriële regeling kan worden bepaald op welke wijze het bestuurscollege dan wel het overheidsorgaan of de
      derde medewerking verleent aan een onderzoek als bedoeld in het eerste lid.

      3 De Commissie toezicht bescherming persoonsgegevens BES, bedoeld in
      [artikel 44 van de Wet bescherming persoonsgegevens BES][ref3], ziet in het belang van de bescherming van de
      persoonlijke levenssfeer toe op de uitvoering van deze wet.

      4 De [artikelen 50][ref4] en [51 van de Wet bescherming persoonsgegevens BES][ref5] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel3a
