        hoofdstuk: II
        afdeling: '2'
  - number: '16'
    text: |-
      Verplichtingen als bedoeld in [artikel 13][ref1] kunnen worden vervuld door:

      a. de ouder en zijn meerderjarig kind, indien beiden hetzelfde adres hebben, voor elkaar;

      b. echtgenoten dan wel geregistreerde partners die hetzelfde adres hebben, voor elkaar;

      c. elke meerderjarige voor een persoon die hem daartoe schriftelijk heeft gemachtigd;

      d. het hoofd van een instelling voor gezondheidszorg voor een in die instelling verblijvende persoon die wegens de
      toestand van zijn gezondheid niet in staat kan worden geacht aan zijn verplichtingen te voldoen of een machtiging
      daartoe te geven, dan wel de echtgenoot, de geregistreerde partner of de bloed- of aanverwanten tot en met de
      tweede graad van een zodanige persoon, onder overlegging van een schriftelijke verklaring van het hoofd van de
      desbetreffende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel13
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028208
        artikel: '13'
        hoofdstuk: II
        afdeling: '2'
  - number: '17'
    text: |-
      1 Het bestuurscollege deelt eenieder op diens verzoek schriftelijk binnen vier weken mede, of hem betreffende
      gegevens zijn opgenomen in de basisadministratie. Hiervoor worden geen kosten in rekening gebracht.

      2 Het bestuurscollege verleent eenieder op diens verzoek binnen vier weken inzage in hem betreffende gegevens in de
      basisadministratie. Hiervoor worden geen kosten in rekening gebracht.

      3 Het bestuurscollege verstrekt op verzoek van de ingeschrevene binnen vier weken een afschrift van de hem
      betreffende gegevens die zijn opgenomen in de basisadministratie.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel17
  - number: 17a
    text: |-
      1 Het bestuurscollege neemt op schriftelijk verzoek van de ouder binnen vier weken kosteloos op diens persoonslijst
      de gegevens op over een kind als bedoeld in [artikel 10, eerste lid, onderdeel a, onder 2°][ref1], indien de ouder
      ten tijde van het verzoek als ingezetene in de basisadministratie is of wordt ingeschreven.

      2 Het bestuurscollege doet terstond schriftelijke mededeling aan de verzoeker van de voldoening aan het verzoek.

      3 Het bestuurscollege verwijdert op schriftelijk verzoek van de ouder binnen vier weken
      kosteloos van de persoonslijst van die ouder de gegevens over het kind, bedoeld in
      [artikel 10, eerste lid, onderdeel a, onder 2°][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel10
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0028208
        artikel: '10'
