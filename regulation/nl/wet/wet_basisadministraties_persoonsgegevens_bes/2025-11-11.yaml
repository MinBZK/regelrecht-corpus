  - number: 12a
    text: |-
      1 Het burgerservicenummer dat aan een persoon is toegekend overeenkomstig
      [artikel 8 van de Wet algemene bepalingen burgerservicenummer][ref1] wordt opgenomen op diens persoonslijst,
      voordat over de betrokken persoon voor de eerste keer gegevens worden verstrekt.

      2 De gegevens over het burgerservicenummer van de ouders, de echtgenoot, de eerdere echtgenoten, de geregistreerde
      partner, de eerdere geregistreerde partners en de kinderen worden ontleend aan de desbetreffende persoonslijsten.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel8
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '8'
  - number: '13'
    text: |-
      1 Degene die naar redelijke verwachting gedurende een half jaar twee derden van de tijd binnen een openbaar lichaam
      verblijf zal houden en die beschikt over een geldige verblijfstitel, meldt zich binnen vijf dagen na aanvang van
      zijn verblijf in persoon bij het bestuurscollege van dat openbaar lichaam om schriftelijk aangifte te doen van
      verblijf en adres.

      2 De ingezetene die zijn adres wijzigt binnen het openbaar lichaam, doet hiervan binnen vijf dagen na wijziging van
      het adres schriftelijk aangifte bij het bestuurscollege.

      3 De ingezetene die naar redelijke verwachting gedurende een half jaar ten minste twee derden van de tijd in een
      ander openbaar lichaam zal verblijven, meldt zich binnen tien dagen voor zijn vertrek bij het bestuurscollege
      om schriftelijk aangifte van vertrek te doen. Eenzelfde verplichting geldt voor de ingezetene die naar redelijke
      verwachting gedurende een jaar twee derden van de tijd buiten een openbaar lichaam zal verblijven.

      4 Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de gegevens die in het kader van de in
      het eerste, tweede en derde lid genoemde verplichtingen door de betrokkene dienen te worden verstrekt en worden de
      gevallen geregeld waarin het eerste, tweede en derde lid niet van toepassing zijn.

      5 De ingezetene brengt zo spoedig mogelijk alle feiten, betreffende zijn burgerlijke staat en nationaliteit, die
      zich buiten het openbaar lichaam hebben voorgedaan, ter kennis van het bestuurscollege en verschaft aan deze,
      desverlangd in persoon, de inlichtingen en legt de geschriften over die noodzakelijk zijn voor het bijhouden van
      de basisadministratie. Op verzoek van het bestuurscollege legt hij van een geschrift een door een beëdigde vertaler
      vervaardigde Nederlandse vertaling over.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel13
  - number: '14'
    text: |-
      De echtgenoot, de geregistreerde partner en de nabestaanden tot en met de tweede graad van een ingeschrevene
      die buiten het openbaar lichaam is overleden, geven aan het bestuurscollege op zijn verzoek over dat overlijden,
      voor zover mogelijk, de inlichtingen en leggen de geschriften over die noodzakelijk zijn voor het bijhouden van
      de basisadministratie.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel14
  - number: '15'
    text: |-
      Verplichtingen als bedoeld in [artikel 13][ref1] rusten op:

      a. ouders, voogden en verzorgers van minderjarige personen, jonger dan 16 jaar;

      b. ouders, voogden en verzorgers van inwonende minderjarigen vanaf 16 jaar, tenzij de minderjarige zelf aangifte
      heeft gedaan;

      c. curatoren voor onder curatele gestelden.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel13
