  - number: '36'
    text: |-
      Met inachtneming van de voorschriften van deze wet kunnen bij of krachtens algemene maatregel van bestuur nadere
      regels worden gesteld omtrent punten waarin deze wet niet voorziet.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel36
  - number: '37'
    text: |-
      Uiterlijk tot twee jaar na de inwerkingtreding van deze wet wordt in de in [artikel 4c, tweede en derde lid][ref1],
      bedoelde regels voorzien bij ministeriële regeling.


