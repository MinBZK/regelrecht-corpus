        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028208
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
  - number: '23'
    text: |-
      Een verstrekking als bedoeld in [artikel 22][ref1] kan ook de daarop betrekking hebbende
      administratieve gegevens omvatten als bedoeld in [artikel 10, eerste lid, onderdeel c][ref2], en
      [artikel 11, eerste lid, onderdeel b][ref3], voor zover deze gegevens noodzakelijk zijn voor de vervulling van
      de publiekrechtelijke taak van de afnemer. Geen gegevens worden verstrekt, waaruit de verstrekking van gegevens
      uit de basisadministratie aan een afnemer, een overheidsorgaan of een derde kan worden afgeleid, voor zover
      dit noodzakelijk is in het belang van de veiligheid van de staat of de voorkoming, opsporing en vervolging van
      strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0028208#Artikel11
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel23
