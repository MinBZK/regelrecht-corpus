        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
  - number: 4b
    text: |-
      1 De systematische verstrekking van gegevens op grond van [artikel 26, eerste lid][ref1], geschiedt kosteloos,
      onverminderd het bepaalde in [artikel 4c][ref2].

      2 Andere verstrekkingen aan een overheidsorgaan geschieden kosteloos.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel26
