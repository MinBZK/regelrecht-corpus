  - number: '25'
    text: Een overheidsorgaan en een derde hebben geen rechtstreekse toegang tot de basisadministratie.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel25
  - number: '26'
    text: |-
      1 Aan een overheidsorgaan onderscheidenlijk een derde als bedoeld in het vierde lid, worden de gegevens verstrekt
      die noodzakelijk zijn voor de vervulling van de taak van het overheidsorgaan onderscheidenlijk het verrichten van
      de werkzaamheden door de derde. De verstrekking geschiedt op grond van een besluit van Onze Minister als bedoeld in
      [artikel 20, derde lid][ref1].

      2 In afwijking van het eerste lid verstrekt het bestuurscollege op verzoek van een overheidsorgaan aan wie de
      gevraagde gegevens niet moeten worden verstrekt op grond van een besluit van Onze Minister als bedoeld in het
      eerste lid, de gegevens over de ingeschrevenen in zijn basisadministratie die noodzakelijk zijn voor de vervulling
      van de taak van het overheidsorgaan.

      3 In afwijking van het eerste lid verstrekt het bestuurscollege op verzoek van een derde aan wie de gevraagde
      gegevens niet moeten worden verstrekt op grond van een besluit van Onze Minister als bedoeld in het eerste lid, de
      algemene gegevens en de verwijsgegevens over de ingeschrevenen in zijn basisadministratie, voor zover:

      a. die gegevens noodzakelijk zijn in verband met de uitvoering van een algemeen verbindend voorschrift door die
      derde, of

      b. de verstrekking in overeenstemming is met het vierde lid.

      4 Bij algemene maatregel van bestuur kunnen door derden verrichte werkzaamheden met een bijzonder maatschappelijk
      belang worden aangewezen, ten behoeve waarvan algemene gegevens of verwijsgegevens uit een basisadministratie
      worden verstrekt. De maatregel bepaalt tevens de categorieën van derden die voor de verstrekking in aanmerking
      komen, de gegevens die kunnen worden verstrekt en of [artikel 28][ref2] op de verstrekking van toepassing is.

      5 In afwijking van het eerste en derde lid kunnen op verzoek van een derde aan hem gegevens worden verstrekt voor
      zover daarin is voorzien bij eilandsverordening en voor zover:

      a. de derde voorafgaande schriftelijke toestemming heeft van de ingeschrevene van wie gegevens worden verstrekt, of

      b. de verstrekking in overeenstemming is met het zesde lid.

      6 Bij eilandsverordening kunnen door derden verrichte werkzaamheden met een bijzonder maatschappelijk belang
      voor het openbaar lichaam worden aangewezen, ten behoeve waarvan gegevens uit de basisadministratie kunnen
      worden verstrekt. De verordening bepaalt tevens de categorieën van derden die voor de verstrekking in aanmerking
      komen. De verordening staat slechts verstrekking toe voor zover deze noodzakelijk is voor de behartiging van het
      gerechtvaardigde belang van de derde en het belang of de fundamentele rechten en vrijheden van de ingeschrevene
      niet aan de verstrekking in de weg staan.

      7 In de gevallen, bedoeld in het vijfde lid, kan de verstrekking alleen betrekking hebben op algemene en
      verwijsgegevens over de naam, de geslachtsnaam van de echtgenoot dan wel geregistreerde partner, de eerdere
      echtgenoot of geregistreerde partner, het gebruik door de ingeschrevene van de geslachtsnaam van de echtgenoot
      dan wel geregistreerde partner, de eerdere echtgenoot of geregistreerde partner, het adres, de geboortedatum en de
      datum van overlijden.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel28
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel26
