  - number: 30b
    text: |-
      Onze Minister verstrekt aan een bestuurscollege dat daar belang bij heeft spontaan of op verzoek zo spoedig
      mogelijk alle inlichtingen die van belang zijn voor een goede uitvoering van de taak met betrekking tot de
      basisadministratie.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel30b
  - number: '31'
    text: |-
      1 Overtreding van het gestelde bij of krachtens de [artikelen 13][ref1], [14][ref2] en
      [32, tweede en vierde lid][ref3], wordt gestraft met hechtenis van ten hoogste een maand of geldboete van de tweede
      categorie.

      2 De in het eerste lid strafbaar gestelde feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel13
