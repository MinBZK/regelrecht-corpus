  - number: '32'
    text: |-
      1 Bij alle handelingen betreffende het bijhouden van de basisadministratie en het verstrekken van gegevens uit de
      basisadministratie en het bevolkingsregister draagt het bestuurscollege zorg voor een deugdelijke vaststelling van
      de identiteit van de betrokkene onderscheidenlijk de verzoeker.

      2 Degene die ingevolge deze wet in persoon verschijnt bij het bestuurscollege, overlegt desgevraagd met het oog op
      de vaststelling van zijn identiteit een op hem betrekking hebbend document.

      3 Als document, bedoeld in het tweede lid, worden geaccepteerd:

      a. een binnen Aruba, Curaçao, Sint Maarten, Bonaire, Sint Eustatius of Saba afgegeven geldige identiteitskaart;

      b. een geldig paspoort;

      c. een binnen het Koninkrijk afgegeven geldig rijbewijs.

      4 De ouders, voogden, verzorgers en curatoren van minderjarigen of onder curatele gestelden, zijn met het oog op
      de vaststelling van de identiteit van de minderjarige of onder curatele gestelde desgevraagd verplicht, deze te
      laten verschijnen bij het bestuurscollege en een op de minderjarige of onder curatele gestelde betrekking hebbend
      document als bedoeld in het tweede lid over te leggen.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel32
  - number: '33'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel33
  - number: '34'
    text: |-
      1 Bij algemene maatregel van bestuur worden regels gesteld omtrent de zorg voor de bevolkingsregisters, bedoeld
      in [artikel 2][ref1], van het besluit van den 16den december 1929, ter uitvoering van de verordening van de
      21sten juni 1929 (P.B. 1929, no. 89), tot het vaststellen van bepalingen nopens het aanleggen en bijhouden van
      bevolkingsregisters (P.B. 1929, no. 103). Daarbij kan worden bepaald dat de bevolkingsregisters op een andere
      wijze dan in de vorm van gezinskaarten kunnen worden aangehouden en kan de vernietiging van gezinskaarten worden
      geregeld.

      2 Uit de bevolkingsregisters worden geen andere gegevens verstrekt dan gegevens als bedoeld in de
      [artikelen 22 tot en met 27][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel22
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel34
