  - number: '12'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald aan welke geschriften, mededelingen of andere bronnen in
      de daarbij aangegeven gevallen gegevens als bedoeld in de [artikelen 10][ref1] en [11][ref2] worden ontleend
      om te worden opgenomen in de basisadministratie; bij algemene maatregel van bestuur worden tevens bepaald de
      verplichtingen van instellingen belast met de uitvoering van publiekrechtelijke taken tot het verstrekken van
      informatie die van belang is voor de bijhouding van de basisadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028208#Artikel11
