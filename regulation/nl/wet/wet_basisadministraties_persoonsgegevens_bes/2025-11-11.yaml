  - number: '20'
    text: |-
      1 Het verstrekken van gegevens vindt uitsluitend plaats op een daartoe strekkend schriftelijk verzoek, dat de
      gronden voor het verzoek bevat.

      2 Op een verzoek als bedoeld in het eerste lid wordt door het bestuurscollege beslist, tenzij het derde lid van
      toepassing is.

      3 Indien het voor de vervulling van de taak van een overheidsorgaan of het verrichten van werkzaamheden door
      een derde als bedoeld in [artikel 26, vierde lid][ref1], noodzakelijk is dat aan het overheidsorgaan of de derde
      op systematische wijze persoonsgegevens worden verstrekt, en deze gegevens uit de basisadministraties van de
      openbare lichamen aan het overheidsorgaan of de derde verstrekt kunnen worden, is het overheidsorgaan verplicht
      onderscheidenlijk de derde bevoegd een verzoek in te dienen bij Onze Minister om een besluit te nemen tot
      verstrekking van gegevens als bedoeld in artikel 26, eerste lid, uit de verstrekkingenvoorziening. Indien Onze
      Minister besluit dat gegevens dienen te worden verstrekt, wordt in het besluit in ieder geval bepaald over welke
      categorieën van personen gegevens worden verstrekt, welke gegevens het betreft en in welke gevallen gegevens
      worden verstrekt. Het besluit bepaalt tevens aan welk overheidsorgaan of welke derde, op welke wijze en vanaf welke
      datum de verstrekking plaatsvindt. Het besluit tot verstrekking van gegevens wordt tijdig aan de verzoeker bekend
      gemaakt.

      4 Aan een besluit tot verstrekking van gegevens op grond van het tweede of derde lid kunnen voorschriften en
      beperkingen worden verbonden in het belang van een zorgvuldige en een doelmatige gegevensverstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel26
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel20
    references:
      - id: ref1
