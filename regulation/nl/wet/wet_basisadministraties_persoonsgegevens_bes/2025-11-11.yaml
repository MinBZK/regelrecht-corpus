        hoofdstuk: III
        paragraaf: '3'
  - number: '5'
    text: |-
      1 Inschrijving in de basisadministratie vindt plaats op grond van de geboorteakte, de aangifte van verblijf en
      adres, bedoeld in [artikel 7, eerste lid][ref1], van betrokkene of ambtshalve.

      2 Bij algemene maatregel van bestuur kunnen categorieën personen worden aangewezen die in verband met hun
      bijzondere verblijfsrechtelijke status niet in aanmerking komen voor inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel7
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028208
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: '6'
    text: |-
      1 Op grond van de geboorteakte, opgemaakt door de ambtenaar van de burgerlijke stand in een openbaar lichaam
      of in Aruba, Curaçao of Sint Maarten, wordt het kind ingeschreven dat niet reeds is ingeschreven in een
      basisadministratie of in een andere basisadministratie en waarvan ten minste één der ouders op de geboortedatum
      van het kind als ingezetene in een basisadministratie is ingeschreven. De inschrijving geschiedt in de
      basisadministratie waar de moeder als ingezetene is ingeschreven, dan wel in de basisadministratie waar de vader
      als ingezetene is ingeschreven, indien de moeder niet als ingezetene is ingeschreven.

      2 Als datum van inschrijving geldt de geboortedatum.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel6
  - number: '7'
    text: |-
      1 Op grond van zijn aangifte van verblijf en adres wordt degene die rechtmatig verblijf geniet, niet als
      ingezetene is ingeschreven in de basisadministratie en die naar redelijke verwachting gedurende een half jaar
      ten minste twee derden van de tijd in het openbaar lichaam verblijf zal houden, als ingezetene ingeschreven in
      de basisadministratie.

      2 Het bestuurscollege draagt ambtshalve zorg voor inschrijving, indien geen aangifte is gedaan door een persoon als
      bedoeld in het eerste lid.

      3 Inschrijving vindt ten aanzien van degene die zich in het openbaar lichaam vestigt, komende vanuit een ander
      openbaar lichaam, Aruba, Curaçao, Sint Maarten of het Europese deel van Nederland niet plaats, dan nadat hij
      een hem betreffend verhuisbericht, verstrekt door de verantwoordelijke voor de bijhouding van gegevens in de
      andere basisadministratie waar hij laatstelijk als ingezetene was ingeschreven, heeft overgelegd. In het geval
      dat anderzijds blijkt dat het vertrek van de betrokken persoon is verwerkt in de basisadministratie waar hij
      laatstelijk als ingezetene was ingeschreven, of blijkt dat betrokkene daarin niet als ingezetene was ingeschreven,
      kan hiervan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel7
  - number: '8'
    text: |-
      Degene die is ingeschreven in de basisadministratie blijft daarin na zijn vertrek dan wel na zijn overlijden
      ingeschreven. Alsdan wordt de bijhouding van diens persoonslijst opgeschort.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel8
  - number: '9'
    text: |-
      1 Op grond van zijn aangifte van vertrek worden gegevens betreffende het vertrek opgenomen op de persoonslijst van
      degene die naar redelijke verwachting gedurende:

      a. een half jaar ten minste twee derden van de tijd in een ander openbaar lichaam verblijf zal houden, dan wel

      b. een jaar ten minste twee derden van de tijd buiten een openbaar lichaam verblijf zal houden.

      2 Het bestuurscollege draagt ambtshalve zorg voor opneming van gegevens betreffende het vertrek, indien geen
      aangifte is gedaan door een persoon als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028208/2025-11-11#Artikel9
  - number: '10'
    text: |-
      1 In de basisadministratie worden over de ingeschrevene uitsluitend de volgende gegevens opgenomen:

      a. algemene gegevens:

      1° gegevens over de burgerlijke staat;

      2° gegevens over kinderen die op het moment van de geboorte niet meer in leven zijn of omtrent wie een akte in een
      openbaar lichaam is opgemaakt die vermeldt dat het kind op het ogenblik van de aangifte niet in leven is, dan wel
      die zijn overleden zonder zelf ingeschrevene te zijn;

      3° gegevens over curatele;

      4° gegevens over het gezag dat over de minderjarige wordt uitgeoefend;

      5° gegevens over de nationaliteit;

      6° gegevens over de verblijfstitel;

      7° gegevens over het adres alsmede over het verblijf in en het vertrek uit het openbaar lichaam;

      8° gegevens over de administratienummers van de ingeschrevene, de ouders, de echtgenoot, de eerdere echtgenoten, de
      geregistreerde partner, de eerdere geregistreerde partners en de kinderen;

      9° gegevens over het burgerservicenummer van de ingeschrevene, de ouders, de echtgenoot, de eerdere echtgenoten, de
      geregistreerde partner, de eerdere geregistreerde partners en de kinderen;

      10° gegevens over het gebruik door de ingeschrevene van de geslachtsnaam van de echtgenoot of eerdere echtgenoot,
      de geregistreerde partner of de eerdere geregistreerde partner.

      b. bijzondere gegevens:

      1° gegevens, noodzakelijk in verband met de uitvoering van de Paspoortwet;

      2° gegevens, noodzakelijk in verband met de uitvoering van de Kieswet.

      c. administratieve gegevens:

      1° gegevens in verband met de inschrijving;

      2° gegevens ter aanduiding van akten en andere geschriften waaruit algemene gegevens zijn verkregen, dan wel van de
      rechtsgrond krachtens welke gegevens over het Nederlanderschap zijn opgenomen;

      3° gegevens ter aanduiding van de onjuistheid van een opgenomen algemeen gegeven of van strijd met de openbare
      orde van een opgenomen gegeven over de burgerlijke staat dan wel over een onderzoek naar die onjuistheid of
      strijdigheid, alsmede andere gegevens, noodzakelijk in verband met het bijhouden van de basisadministratie;

      4° gegevens over de systematische verstrekking van gegevens;

      5° gegevens over de niet-verstrekking krachtens [artikel 28][ref1].

      2 Bij algemene maatregel van bestuur wordt nader bepaald welke algemene, bijzondere en administratieve gegevens
      worden opgenomen, en bij ministeriële regeling worden regels gesteld met betrekking tot de verwijdering en de
      vernietiging van deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel28
