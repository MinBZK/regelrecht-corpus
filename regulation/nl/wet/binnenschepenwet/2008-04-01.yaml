---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: binnenschepenwet
regulatory_layer: WET
publication_date: '2009-06-30'
valid_from: '2008-04-01'
bwb_id: BWBR0003443
url: https://wetten.overheid.nl/BWBR0003443/2008-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is ter bevordering van de veiligheid van de vaart van
    schepen op binnenwateren en van de veiligheid, de gezondheid en het welzijn in verband met de arbeid aan boord van
    die schepen wettelijke regelen te stellen met betrekking tot de deugdelijkheid van het schip, de inrichting en de
    uitrusting daarvan, de bekwaamheid van de schipper alsmede ten aanzien van de arbeidsomstandigheden aan boord;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: 1.1.a
    text: '"Onze Minister": Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: 1.1.b
    text: '"Onze Ministers": Onze Ministers van Verkeer en Waterstaat en van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: 1.1.c
    text: |-
      "binnenwateren": de wateren, die in Nederland zijn gelegen binnen een langs de Nederlandse kust gaande, bij
      algemene maatregel van bestuur aan te wijzen lijn;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: 1.1.d
    text: |-
      rivieren, kanalen en meren: binnenwateren met uitzondering van de Westerschelde, de Oosterschelde, de Waddenzee, de
      Eems, de Dollard en het IJsselmeer met inbegrip van het IJmeer en het Markermeer, met uitzondering van de Gouwzee;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: 1.1.e
    text: '"schipper": de gezagvoerder van een schip of degene, die deze vervangt;'
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: 1.1.f
    text: '"lengte": de grootste lengte van de romp, roer en boegspriet niet inbegrepen;'
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: 1.1.g
    text: |-
      "Herziene Rijnvaartakte": de Herziene Rijnvaartakte, ondertekend te Mannheim de 17de oktober 1868, sedert gewijzigd
      (*Trb.* 1955, 161 en 1964, 83);
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: 1.1.h
    text: 'inspecteur-generaal: inspecteur-generaal van de Inspectie Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: 1.1.i
    text: 'divisie Scheepvaart: divisie Scheepvaart van de Inspectie Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: 1.1.j
    text: |-
      "arbeid": alle werkzaamheden in een onderneming, dan wel in een bedrijf of dienst onder beheer van het Rijk, een
      provincie, een gemeente of ander publiekrechtelijk lichaam, van een vereniging of van een stichting;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: 1.1.k
    text: 'bedrijfsmatig: in de uitoefening van een beroep of bedrijf of tegen vergoeding;'
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: 1.1.l
    text: 'sleepboot: een schip dat is gebouwd om te slepen;'
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: 1.1.m
    text: 'duwboot: een schip dat is gebouwd om te duwen.'
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: '1.2'
    text: |-
      Onder schepen worden mede verstaan draagvleugelboten, veerponten, alsmede baggermolens, drijvende kranen,
      elevatoren en alle andere drijvende werktuigen, pontons of materieel van soortgelijke aard.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: '1.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere voorwerpen, die voor vervoer of opslag op binnenwateren worden
      gebruikt, voor de toepassing van daarbij aangewezen bepalingen van deze wet met schepen worden gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: '1.4'
    text: |-
      Met de eigenaar van een schip wordt gelijkgesteld de gebruiker van het schip, niet zijnde een reis- of
      tijdbevrachter.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel1
  - number: '3.1'
    text: |-
      Schepen, behorende tot de volgende categorieën, moeten bij gebruik op de binnenwateren zijn voorzien van een geldig
      certificaat van onderzoek:
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel3
  - number: 3.1.a
    text: schepen, bestemd of gebezigd voor het bedrijfsmatig vervoer van goederen, met een laadvermogen van 15 ton of meer;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel3
  - number: 3.1.b
    text: schepen, niet bestemd of gebezigd voor het bedrijfsmatig vervoer van goederen, met een lengte van 15 meter of meer;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel3
  - number: 3.1.c
    text: sleep- of duwboten;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel3
  - number: 3.1.d
    text: schepen, bestemd of gebezigd voor het bedrijfsmatig vervoer van meer dan 12 personen, buiten de bemanning.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel3
  - number: '3.3'
    text: |-
      Het eerste lid geldt niet voor schepen die zich op de Rijn, de Lek of de Waal bevinden, met uitzondering van
      veerponten.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel3
  - number: '4.1'
    text: 'Het certificaat van onderzoek is niet vereist voor:'
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel4
  - number: 4.1.a
    text: |-
      schepen die voorzien zijn van een scheepspatent als bedoeld in de Herziene Rijnvaartakte en zich begeven van de
      Rijn, de Lek of de Waal naar open zee of naar België, of omgekeerd, dan wel bij algemene maatregel van bestuur aan
      te wijzen categorieën van schepen die voorzien zijn van een scheepspatent als bedoeld in de Herziene Rijnvaartakte
      en zich bevinden op bij die algemene maatregel van bestuur aan te wijzen binnenwateren;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel4
  - number: 4.1.b
    text: |-
      schepen, die voorzien zijn van een geldig certificaat van deugdelijkheid, afgegeven krachtens de
      [Schepenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001876
  - number: 4.1.c
    text: |-
      schepen die voorzien zijn van een ander dan onder *a* bedoeld geldig document, dat door de bevoegde autoriteiten
      in het buitenland ten bewijze van de deugdelijkheid van het schip is afgegeven en voor zover dat bij internationale
      regeling dan wel door Onze Minister is erkend;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel4
  - number: 4.1.d
    text: schepen, die bestemd zijn tot het redden van drenkelingen;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel4
  - number: 4.1.e
    text: schepen, die bestemd zijn om louter door spierkracht te worden voortbewogen;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel4
  - number: 4.1.f
    text: woonschepen, anders dan voor de vaart gebruikt;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel4
  - number: 4.1.g
    text: |-
      baggermolens, grind- of zandzuigers en andere drijvende werktuigen van soortgelijke aard, die zich bevinden in een
      grind- of zandgat;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel4
  - number: 4.1.h
    text: |-
      schepen die in beheer zijn bij de Koninklijke Marine, alsmede andere schepen die in beheer zijn bij het Ministerie
      van Defensie, voor zover zij behoren tot de organieke uitrusting van het legerkorps;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel4
  - number: 4.1.i
    text: schepen, die in gebruik zijn bij enige bondgenootschappelijke krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel4
  - number: '4.2'
    text: 'Het certificaat van onderzoek is evenmin vereist voor:'
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel4
  - number: 4.2.a
    text: schepen, die in aanbouw zijn of waarmede een proefvaart wordt ondernomen;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel4
  - number: 4.2.b
    text: |-
      de in het eerste lid, aanhef, onder *f*, bedoelde woonschepen, die worden versleept of waarmede naar of van een
      werf wordt gevaren;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel4
  - number: 4.2.c
    text: |-
      schepen, die hetzij hier te lande voor buitenlandse rekening zijn gebouwd, hetzij naar het buitenland zijn
      verkocht, en die over de binnenwateren naar hun bestemmingsplaats worden gebracht;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel4
  - number: 4.2.d
    text: |-
      schepen die voorzien zijn van een geldig voorlopig certificaat van onderzoek als bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5b
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: 5b
        hoofdstuk: II
  - number: '5.1'
    text: |-
      Het certificaat van onderzoek wordt op aanvraag afgegeven door de inspecteur-generaal, indien na een onderzoek
      is gebleken dat het schip voldoet aan bij of krachtens algemene maatregel van bestuur te stellen regelen, die
      betrekking kunnen hebben op de constructie, de inrichting, de werktuigen, de uitrusting, het vrijboord, de
      stabiliteit van het schip en de sleep- en duwverbindingen van schepen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel5
  - number: '5.2'
    text: |-
      Ingeval tevens moet worden voldaan aan de in [artikel 13, eerste lid, aanhef, onder ][ref1], bedoelde regelen wordt
      het certificaat niet eerder afgegeven dan nadat door een onderzoek gebleken is dat ook aan die regelen is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel13
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '13'
        hoofdstuk: III
  - number: '5.3'
    text: |-
      De in het eerste lid bedoelde regelen kunnen verschillen met het oog op de eigen omstandigheden van de vaart op bij
      algemene maatregel van bestuur aan te wijzen binnenwateren.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel5
  - number: '5.4'
    text: |-
      Het certificaat geeft aan voor welke binnenwateren het geldig is en vermeldt tevens of het in het tweede lid
      bedoelde onderzoek is ingesteld.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel5
  - number: '5.5'
    text: |-
      Aan een certificaat kunnen voorschriften worden verbonden indien ouderdom, reeds bestaande of bijzondere
      constructie, inrichting, werktuigen, of uitrusting van het schip het stellen van deze voorschriften noodzakelijk
      maken. De voorschriften worden in het certificaat vermeld. De eigenaar draagt zorg voor de naleving van deze
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel5
  - number: '5.6'
    text: Onze Minister stelt het model van het certificaat vast.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel5
  - number: 5a.1
    text: |-
      Onze Minister kan met betrekking tot bepaalde categorieën van schepen van een of meer van de krachtens
      [artikel 5, eerste lid][ref1], gestelde regelen, zo nodig onder het geven van voorschriften, vrijstelling verlenen,
      mits de veiligheid van de schepen en de opvarenden voldoende gewaarborgd is.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
        hoofdstuk: II
  - number: 5a.2
    text: |-
      De inspecteur-generaal is bevoegd om in bijzondere gevallen ontheffing te verlenen van een of meer van de krachtens
      [artikel 5, eerste lid][ref1], gestelde regelen. Aan een ontheffing kunnen voorschriften en beperkingen worden
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
        hoofdstuk: II
  - number: 5a.3
    text: |-
      De inspecteur-generaal kan een krachtens het tweede lid verleende ontheffing intrekken, indien de aldaar bedoelde
      voorschriften en beperkingen niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel5a
  - number: 5a.4
    text: |-
      De eigenaar draagt zorg voor de naleving van de voorschriften en de beperkingen, bedoeld in het eerste en tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel5a
  - number: 5b.1
    text: |-
      De inspecteur-generaal kan een voorlopig certificaat van onderzoek afgeven voor schepen, behorende tot de
      categorieën, bedoeld in [artikel 3, eerste lid][ref1], hetzij vooruitlopend op de afgifte van het certificaat van
      onderzoek, hetzij in het geval dat de schepen een zodanige schade hebben geleden dat de staat, waarin zij verkeren,
      niet meer met het in het certificaat van onderzoek gestelde overeenstemt, mits de veiligheid van het schip en de
      opvarenden voldoende gewaarborgd is.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel3
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '3'
        hoofdstuk: II
  - number: 5b.2
    text: Het voorlopige certificaat van onderzoek wordt afgegeven voor ten hoogste een maand.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel5b
  - number: 5b.3
    text: |-
      Het voorlopige certificaat van onderzoek kan voorschriften bevatten, die door de inspecteur-generaal in het belang
      van de veiligheid van het schip of de opvarenden nodig worden geacht. De eigenaar draagt zorg voor de naleving van
      deze voorschriften.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel5b
  - number: 5b.4
    text: Onze Minister stelt het model vast van het voorlopige certificaat van onderzoek.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel5b
  - number: '6.1'
    text: |-
      Het certificaat van onderzoek wordt afgegeven voor een tijdvak van zeven jaren. Indien het echter schepen betreft
      die bestemd zijn voor het vervoer van passagiers, wordt het certificaat van onderzoek afgegeven voor een tijdvak
      van vier jaren.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel6
  - number: '6.2'
    text: |-
      Indien de toestand of de aard van het gebruik van het schip daartoe aanleiding geeft, kan het certificaat worden
      afgegeven voor een korter tijdvak dan in het vorige lid is vermeld.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel6
  - number: '6.3'
    text: Het tijdvak, waarvoor het certificaat wordt afgegeven, wordt gerekend van de dag van afgifte af.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel6
  - number: '6.4'
    text: |-
      De in het eerste en tweede lid bedoelde tijdvakken kunnen in bijzondere gevallen door de inspecteur-generaal met
      ten hoogste één jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel6
  - number: '7'
    text: |-
      De eigenaar van een schip, waarvoor een certificaat van onderzoek is afgegeven, draagt zorg dat de inspecteur-
      generaal onverwijld in kennis wordt gesteld van:
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel7
  - number: 7.a
    text: belangrijke schade en herstellingen aan het schip;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel7
  - number: 7.b
    text: verbouwingen en andere ingrijpende wijzigingen van het schip;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel7
  - number: 7.c
    text: overgang van eigendom van het schip.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel7
  - number: '8.1'
    text: |-
      Ten aanzien van schepen, waarvoor een certificaat van onderzoek is afgegeven, wordt in de gevallen, bedoeld
      in [artikel 7, onder ][ref1], en bij vermoeden van ernstige gebreken aan het schip, een onderzoek ingesteld.
      De eigenaar is verplicht om op vordering van de ambtenaar van de dienst, belast met het onderzoek van schepen,
      medewerking te verlenen aan dat onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel7
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '7'
        hoofdstuk: II
  - number: '8.2'
    text: 'Het certificaat van onderzoek kan door de inspecteur-generaal in de volgende gevallen ongeldig worden verklaard:'
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel8
  - number: 8.2.a
    text: |-
      indien bij het onderzoek blijkt dat niet wordt voldaan aan de in [artikel 5, eerste lid][ref1], bedoelde
      voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
        hoofdstuk: II
  - number: 8.2.b
    text: indien bij het onderzoek blijkt dat bij gebruik van het schip de veiligheid van de arbeid in gevaar wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel8
  - number: 8.2.c
    text: indien niet wordt voldaan aan de vordering tot medewerking aan het onderzoek.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel8
  - number: '8.3'
    text: |-
      De ongeldigverklaring vindt niet plaats dan nadat de eigenaar in de gelegenheid is gesteld de redenen voor de
      ongeldigverklaring weg te nemen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel8
  - number: '8.4'
    text: De inspecteur-generaal doet van een besluit tot ongeldigverklaring mededeling in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel8
  - number: '8.5'
    text: |-
      Onverminderd [artikel 3:40 van de Algemene wet bestuursrecht][ref1] treedt een besluit tot ongeldigverklaring in
      werking met ingang van de dag na die waarop de in het vierde lid bedoelde mededeling is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '9.1'
    text: |-
      De vaart met schepen, die voorzien moeten zijn van een certificaat van onderzoek, en met schepen, bedoeld in
      [artikel 4, eerste lid, onder ][ref1], kan worden onderbroken door de ambtenaren van de divisie Scheepvaart en door
      de door Onze Minister van Sociale Zaken en Werkgelegenheid daartoe aangewezen onder hem ressorterende ambtenaren,
      indien de staat waarin het schip zich bevindt zodanig is dat de veiligheid van het schip en de opvarenden of van
      andere schepen en hun opvarenden onmiddellijk gevaar loopt.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel4
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '4'
        hoofdstuk: II
  - number: '9.2'
    text: |-
      In geval van toepassing van het vorige lid is de schipper verplicht het schip onverwijld en met inachtneming van de
      aanwijzingen van de ambtenaar te voeren of te doen voeren naar een door de ambtenaar geschikt geachte plaats.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel9
  - number: '9.3'
    text: |-
      De schipper is verplicht het schip op de aangewezen plaats te laten liggen totdat de redenen voor het onderbreken
      van de vaart zijn weggenomen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel9
  - number: '9.4'
    text: |-
      De voorgaande leden zijn mede van toepassing op schepen, bedoeld in [artikel 4, eerste lid, onder ][ref1], voor
      zover zij zich bevinden op enig binnenwater, niet zijnde de Rijn, de Lek of de Waal.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel4
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '4'
        hoofdstuk: II
  - number: '9.5'
    text: |-
      [Afdeling 5.3 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de in het eerste lid bedoelde
      bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.3'
  - number: '10.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ten aanzien van schepen, die voorzien moeten zijn van een
      certificaat van onderzoek, regelen gegeven, die betrekking kunnen hebben op het handhaven van de deugdelijke staat
      van het schip, van de werktuigen en de uitrusting, de belading van het schip, de inachtneming van het vrijboord,
      het aantal personen dat ten hoogste kan worden toegelaten, en hetgeen overigens in het belang van de veiligheid van
      het schip en de opvarenden dient te worden verricht of nagelaten.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel10
  - number: '10.2'
    text: De eigenaar draagt zorg voor de naleving van de in het vorige lid bedoelde regelen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel10
  - number: '11'
    text: |-
      Een gelijke verplichting als die, welke bij de [artikelen 5, vijfde lid][ref1], [5][ref2], [5][ref3], [7][ref4],
      [8, eerste lid][ref5], en [10, tweede lid][ref6], op de eigenaar van het schip is gelegd, rust op de schipper.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0003443#Artikel5b
      [ref4]: https://wetten.overheid.nl/BWBR0003443#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0003443#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0003443#Artikel10
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003443
        artikel: 5a
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003443
        artikel: 5b
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003443
        artikel: '7'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0003443
        artikel: '8'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0003443
        artikel: '10'
        hoofdstuk: II
  - number: '12.1'
    text: |-
      De kosten van behandeling van een aanvraag van een certificaat van onderzoek, van het verlenen van een ontheffing
      en van een onderzoek en daarmee samenhangende werkzaamheden komen ten laste van de eigenaar van het schip.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12
  - number: '12.2'
    text: |-
      In afwijking van het bepaalde in het vorige lid komen de kosten van een onderzoek en daarmee samenhangende
      werkzaamheden, voor zover deze worden verricht door de in [artikel 27, eerste en tweede lid][ref1], bedoelde
      diensten en personen, ten laste van het Rijk:


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel27
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '27'
        hoofdstuk: V
  - number: 12.2.a
    text: |-
      indien naar aanleiding van een vermoeden ten aanzien van de aanwezigheid van ernstige gebreken aan het schip op
      grond van het bepaalde in [artikel 8][ref1] een onderzoek is ingesteld en hetzij bij dat onderzoek, hetzij na
      een ingesteld beroep tegen de ongeldigverklaring van het certificaat van onderzoek, gebleken is dat het vermoeden
      onjuist is geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel8
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '8'
        hoofdstuk: II
  - number: 12.2.b
    text: |-
      indien op grond van het bepaalde in [artikel 9][ref1] de vaart met een schip is onderbroken en hetzij bij een
      daaropvolgend onderzoek, hetzij na een ingesteld beroep tegen het onderbreken van de vaart, gebleken is dat het
      onderbreken van de vaart met het schip ten onrechte is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel9
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '9'
        hoofdstuk: II
  - number: '12.3'
    text: |-
      Bij regeling van Onze Minister worden de tarieven voor de kosten van behandeling van een aanvraag van een
      certificaat en van een ontheffing vastgesteld. Bij regeling van Onze Minister worden in overeenstemming met
      Onze bij algemene maatregel van bestuur aangewezen Ministers de tarieven vastgesteld voor de onderzoeken en
      werkzaamheden, voor zover deze worden verricht door de in [artikel 27, eerste en tweede lid][ref1], bedoelde
      diensten en personen.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel27
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '27'
        hoofdstuk: V
  - number: 12a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter uitvoering van de Herziene Rijnvaartakte regels gesteld
      betreffende:
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12a
  - number: 12a.1.a
    text: |-
      de bouw, inrichting en uitrusting van schepen die de Rijn in Nederland, met inbegrip van de Waal en de Lek,
      bevaren;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12a
  - number: 12a.1.b
    text: |-
      het onderzoek van schepen, hun uitrusting en de afgifte van documenten ten behoeve van schepen die de in onderdeel
      a genoemde scheepvaartwegen bevaren;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12a
  - number: 12a.1.c
    text: de instellingen en bedrijven die onderzoeken verrichten en documenten afgeven als bedoeld in onderdeel b;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12a
  - number: 12a.1.d
    text: |-
      de instellingen en de autoriteiten in Nederland die belast zijn met de uitvoering van de in dit lid bedoelde
      regels.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12a
  - number: 12a.2
    text: |-
      Voor de werkzaamheden, bedoeld in het eerste lid, onderdeel b, is een vergoeding verschuldigd volgens een bij
      ministeriële regeling vast te stellen tarief. De vergoeding kan worden berekend aan de hand van onder andere de
      ouderdom van de schepen of hun uitrusting, de aard van de schepen of hun uitrusting, het aantal inspecties, de
      aard, het tijdstip en de plaats van de inspecties en de aard van de documenten. Voor de werkzaamheden verricht door
      instellingen en bedrijven als bedoeld in het eerste lid, onderdeel c, kan in deze regeling een maximumtarief worden
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12a
  - number: 12a.3
    text: |-
      Teneinde rekening te houden met de technische ontwikkelingen in de binnenvaart of om proefnemingen mogelijk te
      maken, kunnen, uitsluitend overeenkomstig de door de Centrale Commissie voor de Rijnvaart aangenomen resoluties,
      bij ministeriële regeling voorschriften worden vastgesteld waarbij tijdelijke afwijkingen voor ten hoogste drie
      jaren van de in het eerste lid bedoelde regels toegelaten zijn.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12a
  - number: 12b.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter uitvoering van de Herziene Rijnvaartakte regels gesteld
      betreffende:
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12b
  - number: 12b.1.a
    text: |-
      eisen en keuringsvoorwaarden voor uitrusting, bestemd voor of aanwezig op schepen die de Rijn in Nederland, met
      inbegrip van de Waal en de Lek, bevaren;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12b
  - number: 12b.1.b
    text: |-
      de keuring van uitrusting als bedoeld in onderdeel a en de afgifte van met de keuring verband houdende documenten
      ten behoeve van schepen die de in onderdeel a genoemde scheepvaartwegen bevaren;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12b
  - number: 12b.1.c
    text: |-
      de procedure van typekeuring van uitrusting als bedoeld in onderdeel a en de afgifte van met de keuring verband
      houdende documenten en aan te brengen merken, alsmede de aanwijzing en erkenning van keuringsinstellingen en de
      intrekking daarvan;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12b
  - number: 12b.1.d
    text: |-
      de instellingen en bedrijven en de aanwijzing en erkenning daarvan, die de inbouw of vervanging, de reparatie en
      het onderhoud van uitrusting als bedoeld in onderdeel a verrichten;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12b
  - number: 12b.1.e
    text: |-
      de instellingen en de autoriteiten in Nederland die belast zijn met de uitvoering van de in dit lid bedoelde
      regels.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12b
  - number: 12b.2
    text: |-
      Voor de werkzaamheden, bedoeld in het eerste lid, onderdeel b, is een vergoeding verschuldigd volgens een bij
      ministeriële regeling vast te stellen tarief. De vergoeding kan worden berekend aan de hand van onder andere de
      ouderdom van de uitrusting, de aard van de uitrusting, het aantal keuringen, de aard, het tijdstip en de plaats van
      de keuring en de aard van de documenten. Voor de werkzaamheden verricht door instellingen en bedrijven als bedoeld
      in het eerste lid, onderdelen c en d, kan in deze regeling een maximumtarief worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12b
  - number: 12c.1
    text: |-
      Schippers van binnenschepen die ingevolge [artikel 785, eerste lid, van boek 8 van het Burgerlijk Wetboek][ref1]
      teboekgesteld moeten zijn, zijn bij gebruik van die schepen voorzien van een geldige meetbrief,
      afgegeven volgens de voorschriften, bedoeld in het tweede lid, dan wel een meetbrief als bedoeld in
      [artikel 1.10, eerste lid, onderdeel f, van het Rijnvaartpolitiereglement 1995][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel785
      [ref2]: https://wetten.overheid.nl/BWBR0006923#Artikel1
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '785'
      - id: ref2
        bwb_id: BWBR0006923
        artikel: '1'
  - number: 12c.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter uitvoering van de op 15 februari 1966 te Genève tot
      stand gekomen Overeenkomst nopens de meting van binnenvaartuigen (Trb.1967, 43), regels gesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12c
  - number: 12c.2.a
    text: de meting van binnenschepen;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12c
  - number: 12c.2.b
    text: de afgifte van meetbrieven;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12c
  - number: 12c.2.c
    text: de overige werkzaamheden samenhangend met de meting van binnenschepen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12c
  - number: 12c.3
    text: |-
      Voor de werkzaamheden, bedoeld in het tweede lid, is een vergoeding verschuldigd volgens een bij ministeriële
      regeling vast te stellen tarief. De vergoeding kan worden berekend aan de hand van onder andere de aard van de
      meting, de verplaatsing en de aard van het schip, de aard van de meetbrieven en de aard van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel12c
  - number: '13.1'
    text: |-
      Ter bevordering van de arbeidsomstandigheden aan boord van schepen bij gebruik op de binnenwateren worden bij of
      krachtens algemene maatregel van bestuur regelen gegeven met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel13
  - number: 13.1.a
    text: de inrichting en de uitrusting van schepen;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel13
  - number: 13.1.b
    text: de arbeid aan boord daarvan.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel13
  - number: '13.2'
    text: |-
      De in het vorige lid bedoelde regelen zijn van toepassing voor zover zij verenigbaar zijn met bij of krachtens de
      Herziene Rijnvaartakte gegeven regelen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel13
  - number: '13.3'
    text: |-
      Zij gelden met betrekking tot schepen, behorende tot de in [artikel 3, eerste lid][ref1], bedoelde categorieën, aan
      boord waarvan arbeid pleegt te worden verricht, uitgezonderd:


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel3
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '3'
        hoofdstuk: II
  - number: 13.3.a
    text: |-
      voor wat betreft de regelen, bedoeld in het eerste lid, aanhef, onder *a*: schepen, die teboekstaan in een
      buitenlands register voor binnenschepen en voor de vaart tussen het buitenland en Nederland worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel13
  - number: 13.3.b
    text: 'voor wat betreft de regelen, bedoeld in het eerste lid, aanhef, onder *a* en *b*:'
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel13
  - number: 13.3.b.1°
    text: schepen, uitsluitend of in hoofdzaak gebruikt voor de vaart ter zee;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel13
  - number: 13.3.b.2°
    text: |-
      schepen die in beheer zijn bij de Koninklijke Marine, alsmede andere schepen die in beheer zijn bij het Ministerie
      van Defensie, voor zover zij behoren tot de organieke uitrusting van het legerkorps;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel13
  - number: 13.3.b.3°
    text: schepen, die in gebruik zijn bij enige bondgenootschappelijke krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel13
  - number: 13.3.b.4°
    text: baggermolens, grind- of zandzuigers en andere drijvende werktuigen van soortgelijke aard.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel13
  - number: 13a.1
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, kan met betrekking
      tot bepaalde categorieën van schepen van een of meer van de krachtens [artikel 13, eerste lid][ref1], gestelde
      regelen, zo nodig onder het geven van voorschriften, vrijstelling verlenen, mits de arbeidsomstandigheden aan boord
      voldoende gewaarborgd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel13
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '13'
        hoofdstuk: III
  - number: 13a.2
    text: |-
      De inspecteur-generaal, in overeenstemming met een door Onze Minister van Sociale Zaken en Werkgelegenheid daartoe
      aangewezen onder hem ressorterende ambtenaar, is bevoegd om in bijzondere gevallen ontheffing te verlenen van een
      of meer van de krachtens [artikel 13, eerste lid][ref1], gestelde regelen. Aan een ontheffing kunnen voorschriften
      en beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel13
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '13'
        hoofdstuk: III
  - number: 13a.3
    text: |-
      De inspecteur-generaal, in overeenstemming met een door Onze Minister van Sociale Zaken en Werkgelegenheid daartoe
      aangewezen onder hem ressorterende ambtenaar, kan een krachtens het tweede lid verleende ontheffing intrekken,
      indien de aldaar bedoelde voorschriften en beperkingen niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel13a
  - number: '14.1'
    text: |-
      Door Onze Minister van Sociale Zaken en Werkgelegenheid daartoe aangewezen onder hem ressorterende ambtenaren
      kunnen in een bepaald geval voorschriften geven met betrekking tot de naleving van de in [artikel 13][ref1]
      bedoelde regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel13
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '13'
        hoofdstuk: III
  - number: '14.2'
    text: |-
      Indien omtrent de uitleg van de krachtens [artikel 13, eerste lid, aanhef en onder ][ref1], gestelde regels een
      onoverkomelijk verschil van opvatting bestaat tussen een door Onze Minister van Sociale Zaken en Werkgelegenheid
      aangewezen onder hem ressorterende ambtenaar en een belanghebbende, geeft een ambtenaar als bedoeld in het eerste
      lid, op verzoek van de belanghebbende zo spoedig mogelijk een verklaring houdende een weergave van zijn opvatting.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel13
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '13'
        hoofdstuk: III
  - number: '14.3'
    text: |-
      Bij het geven van een voorschrift als bedoeld in het eerste lid wordt een termijn bepaald, binnen welke er aan
      behoort te zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel14
  - number: '15.1'
    text: |-
      De eigenaar van een schip, waarvoor regelen als bedoeld in [artikel 13, eerste lid][ref1], gelden, draagt zorg
      dat die regelen alsmede de krachtens [artikel 13][ref2] gegeven voorschriften en beperkingen en de krachtens
      [artikel 14][ref3] gegeven voorschriften bij gebruik van het schip op binnenwateren worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel13a
      [ref3]: https://wetten.overheid.nl/BWBR0003443#Artikel14
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '13'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003443
        artikel: 13a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003443
        artikel: '14'
        hoofdstuk: III
  - number: '15.2'
    text: Een gelijke verplichting rust op de schipper van het schip.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel15
  - number: '15.3'
    text: |-
      Degene, die arbeid verricht, waarop een regel of voorschrift als bedoeld in
      [de artikelen 13, eerste lid, aanhef, onder ][ref1], en [14, eerste lid][ref2], of een aan een ontheffing
      verbonden voorschrift of beperking als bedoeld in [artikel 13][ref3], betrekking heeft, is verplicht die regel, dat
      voorschrift of die beperking, voor zover hij redelijkerwijs geacht kan worden daarmee bekend te zijn, na te leven,
      voor zover en op de wijze als bij die regel, dat voorschrift of die beperking is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003443#Artikel13a
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '13'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '14'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003443
        artikel: 13a
        hoofdstuk: III
  - number: '16.1'
    text: |-
      Een schipper is bij het varen op de binnenwateren in het bezit van een geldig groot vaarbewijs, indien hij vaart
      met:
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel16
  - number: 16.1.a
    text: |-
      een schip met een lengte van 20 meter of meer, dat bedrijfsmatig wordt gebruikt of voor bedrijfsmatig gebruik is
      bestemd;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel16
  - number: 16.1.b
    text: |-
      een schip, dat wordt gebruikt of is bestemd voor het bedrijfsmatig vervoer van meer dan 12 personen, buiten de
      bemanning;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel16
  - number: 16.1.c
    text: |-
      een schip, dat wordt gebruikt om een schip met een lengte van 20 meter of meer te slepen, langszij vastgemaakt mee
      te voeren of te duwen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel16
  - number: '16.2'
    text: |-
      Onverminderd het eerste lid, is een schipper bij het varen op de binnenwateren in het bezit van een geldig klein
      vaarbewijs, indien hij vaart met:
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel16
  - number: 16.2.a
    text: een schip met een lengte van 15 meter of meer dat niet bedrijfsmatig wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel16
  - number: 16.2.b
    text: |-
      een schip met een lengte tussen de 15 en 20 meter dat bedrijfsmatig wordt gebruikt of voor bedrijfsmatig gebruik
      is bestemd;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel16
  - number: 16.2.c
    text: een sleep- of duwboot;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel16
  - number: 16.2.d
    text: |-
      een motorboot met een lengte van minder dan 15 meter die een snelheid van meer dan 20 kilometer per uur kan
      bereiken.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel16
  - number: '16.3'
    text: |-
      Het eerste en tweede lid zijn van toepassing op schepen die zich op de Rijn in Nederland, op de Lek of de Waal
      bevinden, voor zover deze toepassing verenigbaar is met bij of krachtens de Herziene Rijnvaartakte gegeven regelen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel16
  - number: '16.4'
    text: |-
      Voor de vaart op rivieren, kanalen en meren is de schipper voorzien van een groot, dan wel een klein vaarbewijs,
      voor rivieren kanalen en meren. Voor de vaart op de overige binnenwateren is de schipper voorzien van een groot,
      dan wel klein vaarbewijs, voor alle binnenwateren.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel16
  - number: '16.5'
    text: Het groot vaarbewijs is geldig voor het varen met alle schepen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel16
  - number: '16.6'
    text: De vaarbewijzen worden afgegeven door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel16
  - number: '16.7'
    text: De modellen van de vaarbewijzen worden bij regeling van Onze Minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel16
  - number: '17.1'
    text: 'Het vaarbewijs is niet vereist:'
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel17
  - number: 17.1.a
    text: |-
      indien het een schip betreft in beheer bij de Koninklijke Marine, of een ander schip in beheer bij het Ministerie
      van Defensie, voor zover het behoort tot de organieke uitrusting van het legerkorps, of indien het een schip
      betreft in gebruik bij enige bondgenootschappelijke krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel17
  - number: 17.1.b
    text: indien het schip bestemd is tot het redden van drenkelingen;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel17
  - number: 17.1.c
    text: indien het schip bestemd is om louter door spierkracht te worden voortbewogen;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel17
  - number: 17.1.d
    text: indien het schip wordt gebruikt voor grind- of zandwinning in den natte en zich bevindt in een grind- of zandgat;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel17
  - number: 17.1.e
    text: |-
      indien het schip uitsluitend of in hoofdzaak wordt gebruikt voor de vaart ter zee en de schipper is voorzien
      van een bewijs van bekwaamheid voor de zeevaart, afgegeven door een bevoegde autoriteit in Nederland of in het
      buitenland;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel17
  - number: 17.1.f
    text: |-
      indien de schipper is voorzien van een groot patent als bedoeld in het [Reglement Rijnpatenten 1998][ref1] of een
      krachtens [artikel 5.01 van het Reglement Rijnpatenten 1998](onbekend) geldig Rijnschipperspatent;


      [ref1]: https://wetten.overheid.nl/BWBR0008934
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008934
  - number: 17.1.g
    text: |-
      indien de schipper is voorzien van een bewijs van bekwaamheid voor de binnenvaart, dat is afgegeven door een
      bevoegde autoriteit in het buitenland en voor zover dat bij internationale regeling dan wel door Onze Minister is
      erkend voor de daarbij aan te geven categorie schepen;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel17
  - number: 17.1.h
    text: |-
      indien het een schip betreft dat behoort tot een door Onze Minister aangewezen categorie schepen, de schipper is
      voorzien van een door Onze Minister aangewezen bewijs van bekwaamheid dat is erkend ingevolge onderdeel g, en de
      schipper of een ander lid van de dekbemanning is voorzien van een door Onze Minister aangewezen aanvullend bewijs
      van bekwaamheid voor de binnenvaart, dat is afgegeven door een bevoegde autoriteit in het buitenland.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister kan met betrekking tot bepaalde categorieën van schippers vrijstelling verlenen van de in
      [artikel 16][ref1] bedoelde verplichting, zo nodig onder het geven van voorschriften, indien de veilige vaart met
      het schip op binnenwateren voldoende gewaarborgd is. De schipper draagt zorg voor de naleving van de voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel16
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '16'
        hoofdstuk: IV
  - number: '17.3'
    text: |-
      Onze Minister kan ontheffing verlenen van de in [artikel 16][ref1] bedoelde verplichting, indien naar zijn oordeel
      de veilige vaart met het schip op binnenwateren voldoende gewaarborgd is. Aan een ontheffing kunnen voorschriften
      en beperkingen worden verbonden. De schipper draagt zorg voor de naleving van de voorschriften en de beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel16
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '16'
        hoofdstuk: IV
  - number: '17.4'
    text: |-
      Onze Minister kan een krachtens het derde lid verleende ontheffing intrekken, indien de aldaar bedoelde
      voorschriften en beperkingen niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel17
  - number: '19.1'
    text: |-
      Afgifte van een vaarbewijs vindt plaats na overlegging van verklaringen, waaruit blijkt dat de aanvrager voldoet
      aan bij of krachtens algemene maatregel van bestuur te stellen eisen, die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel19
  - number: 19.1.a
    text: |-
      de algemene lichamelijke geschiktheid, de geestelijke geschiktheid en de geschiktheid van de gezichts- en
      gehoororganen;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel19
  - number: 19.1.b
    text: de kennis en bekwaamheid om het schip te voeren.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel19
  - number: '19.2'
    text: |-
      De aan de aanvrager van het vaarbewijs te stellen eisen kunnen tevens betrekking hebben op de tijd, doorgebracht
      als lid van de dekbemanning aan boord van een schip.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel19
  - number: '19.3'
    text: |-
      De in het eerste lid bedoelde eisen kunnen verschillend zijn naar gelang het betreft een vaarbewijs voor de vaart
      op de rivieren, kanalen en meren, of voor de vaart op alle binnenwateren en naar gelang het betreft een klein of
      een groot vaarbewijs.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel19
  - number: '19.4'
    text: |-
      Ter uitvoering van het eerste lid worden persoonsgegevens betreffende de gezondheid als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref1] verwerkt. De verwerking van deze gegevens vindt plaats
      teneinde te kunnen beoordelen of de aanvrager voldoet aan de bij of krachtens algemene maatregel van bestuur
      gestelde eisen betreffende de algemene lichamelijke geschiktheid, de geestelijke geschiktheid en de geschiktheid
      van de gezichts- en gehoororganen. Onze Minister is verantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: '20'
    text: Een vaarbewijs wordt niet afgegeven aan degene die de leeftijd van 18 jaren nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel20
  - number: '21.1'
    text: |-
      Onze Minister wijst artsen aan die onderzoeken of door de aanvrager van een vaarbewijs wordt voldaan aan de eisen,
      bedoeld in [artikel 19, eerste lid, aanhef, onder ][ref1] Zij geven een verklaring af indien het onderzoek met
      gunstig gevolg heeft plaatsgevonden. Indien uit het onderzoek blijkt, dat het om een beperkte geschiktheid gaat,
      kunnen aan het vaarbewijs voorschriften worden verbonden, die op het vaarbewijs worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel19
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '19'
        hoofdstuk: IV
  - number: '21.2'
    text: |-
      Wordt de afgifte van een verklaring geweigerd, dan wordt op verzoek van de aanvrager door een door Onze Minister
      aangewezen deskundige, niet zijnde de arts die het onderzoek heeft verricht, nogmaals onderzocht of aan de
      aanvrager een verklaring, als bedoeld in het vorige lid, kan worden afgegeven. Indien uit het onderzoek blijkt,
      dat het om een beperkte geschiktheid gaat, kunnen aan het vaarbewijs voorschriften worden verbonden, die op het
      vaarbewijs worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel21
  - number: '21.3'
    text: |-
      Bij de weigering wordt de aanvrager opmerkzaam gemaakt op het bepaalde in het vorige lid, indien hij nog niet door
      een deskundige is onderzocht.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel21
  - number: '22.1'
    text: |-
      Het onderzoek of de aanvrager voldoet aan de eisen bedoeld in [artikel 19, eerste lid, aanhef, onder ][ref1],
      geschiedt door instellingen of personen, die door Onze Minister worden aangewezen. Zij geven een verklaring af
      indien het onderzoek met gunstig gevolg heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel19
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '19'
        hoofdstuk: IV
  - number: '22.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regelen gegeven omtrent de toelating van de aanvrager
      tot het onderzoek en de wijze van onderzoek.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel22
  - number: '22.3'
    text: |-
      Onze Minister kan de aanwijzing ingevolge het eerste lid intrekken indien de in het vorig lid bedoelde regelen niet
      in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel22
  - number: '22.4'
    text: |-
      Onze Minister wijst gecommitteerden aan die het onderzoek kunnen bijwonen. Zij ontvangen ten laste van het Rijk
      vergoeding van reis- en verblijfkosten alsmede, voor zover hun benoeming haar oorzaak niet vindt in het ambt dat
      zij bekleden, vacatiegelden.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel22
  - number: '23.1'
    text: |-
      Het onderzoek, bedoeld in [artikel 21][ref1], blijft achterwege:


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel21
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '21'
        hoofdstuk: IV
  - number: 23.1.a
    text: indien de aanvrager het klein vaarbewijs wenst te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel23
  - number: 23.1.b
    text: indien de aanvrager reeds een vaarbewijs bezit en hij tevens de 50-jarige leeftijd nog niet heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel23
  - number: 23.1.c
    text: |-
      indien de aanvrager niet langer dan drie maanden tevoren een overeenkomstig onderzoek met gunstig gevolg heeft
      ondergaan.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel23
  - number: '23.2'
    text: |-
      In de in het eerste lid bedoelde gevallen wordt volstaan met een eigen verklaring van de aanvrager, waaruit blijkt
      dat hij lichamelijk, in het bijzonder voor wat betreft zijn gezichts- en gehoororganen, en geestelijk geschikt is
      voor het beoefenen van de vaart op de binnenwateren.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel23
  - number: '23.3'
    text: |-
      Het onderzoek, bedoeld in [artikel 22][ref1], kan geheel of gedeeltelijk achterwege blijven indien de aanvrager in
      het bezit is van:


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel22
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '22'
        hoofdstuk: IV
  - number: 23.3.a
    text: een geldig vaarbewijs;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel23
  - number: 23.3.b
    text: een vaarbewijs dat zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel23
  - number: 23.3.c
    text: een ander bewijs van vaarbekwaamheid voor de binnenvaart, dat door Onze Minister is erkend.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel23
  - number: '23.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regelen gegeven met betrekking tot het bepaalde in de
      vorige leden.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel23
  - number: 23a.1
    text: |-
      Het groot vaarbewijs, afgegeven voor de 50-jarige leeftijd van de houder, is geldig tot de dag waarop hij de
      leeftijd van 50 jaar en drie maanden bereikt.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel23a
  - number: 23a.2
    text: |-
      Het groot vaarbewijs, afgegeven na het bereiken van de 50-jarige, doch voor het bereiken van de 55-jarige leeftijd
      van de houder, is geldig tot de dag waarop hij de leeftijd van 55 jaar en drie maanden bereikt.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel23a
  - number: 23a.3
    text: |-
      Het groot vaarbewijs, afgegeven na het bereiken van de 55-jarige, doch voor het bereiken van de 60-jarige leeftijd
      van de houder, is geldig tot de dag waarop hij de leeftijd van 60 jaar en drie maanden bereikt.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel23a
  - number: 23a.4
    text: |-
      Het groot vaarbewijs, afgegeven na het bereiken van de 60-jarige, doch voor het bereiken van de 65-jarige leeftijd
      van de houder, is geldig tot de dag waarop hij de leeftijd van 65 jaar en drie maanden bereikt.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel23a
  - number: 23a.5
    text: |-
      Het groot vaarbewijs, afgegeven na het bereiken van de 65-jarige leeftijd van de houder, is geldig tot drie maanden
      na de eerstvolgende verjaardag van de houder.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel23a
  - number: '24.1'
    text: |-
      Het klein vaarbewijs, afgegeven voor de 65-jarige leeftijd van de houder, is geldig tot de dag waarop hij de 65-
      jarige leeftijd bereikt.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel24
  - number: '24.2'
    text: |-
      In afwijking van het eerste lid is het klein vaarbewijs, afgegeven voor de 65-jarige leeftijd doch na het bereiken
      van de 62-jarige leeftijd van de houder, drie jaar geldig.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel24
  - number: '24.3'
    text: Het klein vaarbewijs, afgegeven nadat de houder de 65-jarige leeftijd heeft bereikt, is drie jaar geldig.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel24
  - number: '25.1'
    text: |-
      Op vordering van Onze Minister is de schipper te wiens naam een geldig vaarbewijs staat en te wiens aanzien een
      vermoeden van lichamelijke of geestelijke ongeschiktheid tot of onbekwaamheid in het voeren van het schip bestaat,
      verplicht zich te onderwerpen aan een onderzoek.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel25
  - number: '25.2'
    text: |-
      Bij vermoeden van lichamelijke of geestelijke ongeschiktheid wordt het onderzoek ingesteld naar de algemene
      lichamelijke of geestelijke geschiktheid dan wel naar de geschiktheid van de gezichts- of gehoororganen op de voet
      van het bepaalde bij of krachtens [artikel 21][ref1]. Bij vermoeden van onbekwaamheid wordt het onderzoek ingesteld
      op de voet van het bepaalde bij of krachtens [artikel 22][ref2]. [Artikel 23][ref3] is in de in dit lid bedoelde
      gevallen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0003443#Artikel23
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '21'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '22'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0003443
        artikel: '23'
        hoofdstuk: IV
  - number: '25.3'
    text: |-
      Indien bij een in het vorige lid bedoeld onderzoek de afgifte van een verklaring wordt geweigerd, of indien de
      schipper niet aan de in het eerste lid bedoelde verplichting voldoet zonder dat van een geldige reden daartoe
      blijkt, kan degene die met de afgifte van vaarbewijzen is belast het afgegeven vaarbewijs ongeldig verklaren.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel25
  - number: '25.4'
    text: |-
      Degene die met de afgifte van vaarbewijzen is belast, doet van een besluit tot ongeldigverklaring mededeling in
      de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel25
  - number: '25.5'
    text: |-
      Onverminderd [artikel 3:40 van de Algemene wet bestuursrecht][ref1] treedt een besluit tot ongeldigverklaring in
      werking met ingang van de dag na die waarop de in het vierde lid bedoelde mededeling is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '25.6'
    text: |-
      Ter uitvoering van het eerste, tweede en derde lid worden persoonsgegevens betreffende de gezondheid als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref1] verwerkt. De verwerking van deze gegevens vindt plaats
      teneinde te kunnen beoordelen of sprake is van lichamelijke of geestelijke ongeschiktheid van de schipper. Onze
      Minister is verantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: '26.1'
    text: |-
      De kosten van behandeling van de aanvrage van het vaarbewijs of van een ontheffing en de kosten, welke verbonden
      zijn aan de in de[artikelen 21][ref1] en [22][ref2] bedoelde onderzoeken, komen ten laste van de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel22
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '21'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '22'
        hoofdstuk: IV
  - number: '26.2'
    text: |-
      Indien bij een in [artikel 25][ref1] bedoeld onderzoek de ongeschiktheid of onbekwaamheid van de schipper niet
      blijkt, komen de kosten van het onderzoek ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel25
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '25'
        hoofdstuk: IV
  - number: '26.3'
    text: Bij regeling van Onze Minister worden de tarieven voor de kosten vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel26
  - number: 26a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter uitvoering van de Herziene Rijnvaartakte regels gesteld
      betreffende:
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel26a
  - number: 26a.1.a
    text: |-
      de voorwaarden die gesteld worden aan personen die werkzaam zijn op schepen die de Rijn in Nederland, met inbegrip
      van de Waal en de Lek, bevaren;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel26a
  - number: 26a.1.b
    text: |-
      de onderzoeken voorafgaand aan de afgifte, alsmede de afgifte van bevoegdheidsbewijzen en verklaringen ten behoeve
      van personen werkzaam op schepen die de in onderdeel a genoemde scheepvaartwegen bevaren;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel26a
  - number: 26a.1.c
    text: |-
      de instellingen en bedrijven en de aanwijzing en erkenning daarvan die onderzoeken verrichten en documenten afgeven
      als bedoeld in onderdeel b;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel26a
  - number: 26a.1.d
    text: de instellingen en de autoriteiten in Nederland die belast zijn met de uitvoering van deze regels.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel26a
  - number: 26a.2
    text: |-
      Voor de werkzaamheden, bedoeld in het eerste lid, onderdeel b, is een vergoeding verschuldigd volgens een bij
      ministeriële regeling vast te stellen tarief. De vergoeding kan worden berekend aan de hand van onder andere de
      aard van de examens, de aard van bevoegdheidsbewijzen en verklaringen ten behoeve van personen en de aard van de
      mutaties die daarin worden aangebracht. Voor werkzaamheden verricht door instellingen en bedrijven als bedoeld in
      het eerste lid, onderdeel c, kan in deze regeling een maximumtarief worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel26a
  - number: '27.1'
    text: |-
      De ambtenaren van de divisie Scheepvaart en de door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen
      onder hem ressorterende ambtenaren zijn belast met het onderzoek van schepen. Zij onderzoeken of voldaan wordt aan
      de regelen bedoeld in [de artikelen 5, eerste lid][ref1], en [13, eerste lid, aanhef, onder ][ref2]. Onze Ministers
      kunnen beleidsregels vaststellen ten aanzien van de taakvervulling door deze ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel13
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '13'
        hoofdstuk: III
  - number: '27.2'
    text: |-
      Onze Ministers kunnen in overeenstemming met Onze bij algemene maatregel van bestuur aangewezen Ministers andere
      diensten en personen aanwijzen, die voor het verrichten van bepaalde werkzaamheden, samenhangende met het onderzoek
      van schepen, ter beschikking worden gesteld van de divisie Scheepvaart of de door Onze Minister van Sociale Zaken
      en Werkgelegenheid aangewezen onder hem ressorterende ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel27
  - number: '27.3'
    text: |-
      Voor de krachtens het tweede lid aangewezen diensten en personen, ressorterende onder een ander departement dan
      dat van Onze Ministers, worden beleidsregels betreffende de vervulling van hun in het tweede lid bedoelde taak niet
      gesteld dan in overeenstemming met Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel27
  - number: '27.4'
    text: Van een krachtens het tweede lid vastgesteld besluit wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel27
  - number: '27.5'
    text: |-
      Door Ons kunnen onderzoekingsbureaus worden aangewezen wier verklaringen, dat de constructie, de
      inrichting, de werktuigen en de uitrusting van een schip voldoen aan hun voorschriften, dan wel aan de in
      [artikel 5, eerste lid][ref1], bedoelde regelen, in aanmerking worden genomen bij het onderzoek van schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
        hoofdstuk: II
  - number: '27.6'
    text: |-
      Onze Ministers kunnen instellingen of personen aanwijzen voor het verrichten van bepaalde werkzaamheden,
      samenhangend met het onderzoek van schepen. Van deze aanwijzing wordt mededeling gedaan in de *Staatscourant*. Het
      bepaalde in het eerste lid, tweede en derde volzin, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel27
  - number: '27.7'
    text: Het onderzoek van schepen wordt bij of krachtens algemene maatregel van bestuur nader geregeld.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel27
  - number: '28.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de ambtenaren van de divisie
      Scheepvaart en de door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen onder hem ressorterende
      ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel28
  - number: '28.2'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet en de Herziene Rijnvaartakte zijn voorts
      belast de bij besluit van Onze Minister, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid
      aangewezen ambtenaren, alsmede de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane. Indien Onze
      Minister, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, ambtenaren van provincies,
      gemeenten of waterschappen aanwijst, doet hij dit eveneens in overeenstemming met de desbetreffende besturen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel28
  - number: '28.3'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel28
  - number: '29.1'
    text: |-
      De toezichthouder beschikt niet over de bevoegdheid, genoemd in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '29.2'
    text: De toezichthouder is bevoegd afgifte te vorderen van ongeldige certificaten van onderzoek en vaarbewijzen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel29
  - number: '30.1'
    text: |-
      Tegen een beschikking, gegeven op grond van het bepaalde in de[artikelen 5, eerste en vierde lid][ref1],
      [5][ref2], [5][ref3], [8, tweede lid, aanhef, onder ][ref4], en [54][ref5], staat beroep open bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0003443#Artikel5b
      [ref4]: https://wetten.overheid.nl/BWBR0003443#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0003443#Artikel54
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003443
        artikel: 5a
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003443
        artikel: 5b
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003443
        artikel: '8'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0003443
        artikel: '54'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '30.2'
    text: |-
      Beroep bij Onze Minister staat eveneens open tegen een beschikking, gegeven op grond van het bepaalde in de
      [artikelen 5, vijfde lid][ref1], [6, tweede lid][ref2], en [9, eerste lid juncto vierde lid][ref3], indien de
      beschikking de veiligheid van de vaart betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003443#Artikel9
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '6'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003443
        artikel: '9'
        hoofdstuk: II
  - number: '39.1'
    text: |-
      Tegen een beschikking, gegeven op grond van het bepaalde in de [artikelen 5, tweede lid][ref1],
      [8, tweede lid, aanhef, onder ][ref2], [13][ref3], en [14, eerste lid][ref4], en tegen een verklaring, bedoeld in
      [artikel 14, tweede lid][ref5], staat beroep open bij Onze Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003443#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0003443#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0003443#Artikel14
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '8'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003443
        artikel: '13'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0003443
        artikel: '14'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0003443
        artikel: '14'
        hoofdstuk: III
  - number: '39.2'
    text: |-
      Beroep bij Onze Minister van Sociale Zaken en Werkgelegenheid staat eveneens open tegen een beschikking,
      gegeven op grond van het bepaalde in de [artikelen 5, vijfde lid][ref1], [6, tweede lid][ref2] en
      [9, eerste lid juncto vierde lid][ref3], voor zover de beschikking de arbeidsomstandigheden betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003443#Artikel9
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '6'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003443
        artikel: '9'
        hoofdstuk: II
  - number: '43'
    text: |-
      Behalve waar het een beschikking betreft, gegeven krachtens de [artikelen 8, tweede lid, aanhef, onder b][ref1],
      en [9, eerste lid juncto vierde lid][ref2], vloeit uit een beschikking, waarvan beroep kan worden ingesteld, geen
      verplichting voort gedurende de termijn waarbinnen beroep ingevolge [artikel 39][ref3] kan worden ingesteld en
      zolang op een zodanig beroep niet is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003443#Artikel39
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '9'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003443
        artikel: '39'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '44'
    text: |-
      De eigenaar van een schip, dat niet voorzien is van een geldig certificaat van onderzoek in de gevallen waarin dit
      ingevolge [hoofdstuk II][ref1] wordt vereist, wordt gestraft met hechtenis van ten hoogste twee weken of geldboete
      van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003443
        hoofdstuk: II
  - number: '45'
    text: |-
      Handelen of nalaten in strijd met een verplichting voortvloeiende uit het bepaalde in de
      [artikelen 3, tweede lid][ref1], [5, vijfde lid][ref2], [5][ref3], [5][ref4], [7][ref5], [10, tweede lid][ref6],
      [11][ref7], [15][ref8] en [17, tweede en derde lid][ref9], wordt gestraft met hechtenis van ten hoogste een week of
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003443#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0003443#Artikel5b
      [ref5]: https://wetten.overheid.nl/BWBR0003443#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0003443#Artikel10
      [ref7]: https://wetten.overheid.nl/BWBR0003443#Artikel11
      [ref8]: https://wetten.overheid.nl/BWBR0003443#Artikel15
      [ref9]: https://wetten.overheid.nl/BWBR0003443#Artikel17
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '5'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003443
        artikel: 5a
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003443
        artikel: 5b
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0003443
        artikel: '7'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0003443
        artikel: '10'
        hoofdstuk: II
      - id: ref7
        bwb_id: BWBR0003443
        artikel: '11'
        hoofdstuk: II
      - id: ref8
        bwb_id: BWBR0003443
        artikel: '15'
        hoofdstuk: III
      - id: ref9
        bwb_id: BWBR0003443
        artikel: '17'
        hoofdstuk: IV
  - number: '46'
    text: |-
      De schipper die niet is voorzien van een geldige meetbrief als bedoeld in [artikel 12c, eerste lid][ref1], of die
      niet in het bezit is van een geldig vaarbewijs als bedoeld in [artikel 16][ref2] wordt gestraft met hechtenis van
      ten hoogste een week of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel16
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: 12c
        hoofdstuk: IIb
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '16'
        hoofdstuk: IV
  - number: '47'
    text: De in dit hoofdstuk strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel47
  - number: '48.1'
    text: |-
      Met de opsporing van de bij of krachtens deze wet en de bij de Herziene Rijnvaartakte strafbaar gestelde feiten
      zijn, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref1], belast de in [artikel 28][ref2] genoemde
      ambtenaren, die daartoe door Onze Minister van Justitie en Onze Minister, in overeenstemming met Onze Minister
      van Sociale Zaken en Werkgelegenheid, zijn aangewezen, waarbij [artikel 28, tweede lid, tweede volzin][ref3], van
      overeenkomstige toepassing is. Met de opsporing van de bij de Herziene Rijnvaartakte strafbaar gestelde feiten
      zijn, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref4], voorts belast de ambtenaren van de
      rijksbelastingdienst, bevoegd inzake douane. Deze ambtenaren zijn tevens belast met de opsporing van de feiten,
      strafbaar gesteld in de [artikelen 179 tot en met 182][ref5] en [184 van het Wetboek van Strafrecht][ref6], voor
      zover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0003443#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '28'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0003443
        artikel: '28'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref6
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '48.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel48
  - number: '49.1'
    text: |-
      De [artikelen 5:13][ref1] en [5:15][ref2] tot en met [5:20 van de Algemene wet bestuursrecht][ref3] zijn van
      overeenkomstige toepassing ten aanzien van de in [artikel 48][ref4] bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003443#Artikel48
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0003443
        artikel: '48'
        hoofdstuk: VII
  - number: '49.2'
    text: |-
      De in [artikel 48][ref1] bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning
      te betreden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel48
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '48'
        hoofdstuk: VII
  - number: '49.3'
    text: |-
      De in [artikel 48][ref1] bedoelde ambtenaren zijn bevoegd afgifte te vorderen van ongeldige certificaten van
      onderzoek en vaarbewijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel48
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '48'
        hoofdstuk: VII
  - number: '52.1'
    text: De ingevolge deze wet afgegeven documenten moeten aan boord van het schip aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel52
  - number: '52.2'
    text: |-
      Onze Minister kan met betrekking tot bepaalde soorten schepen vrijstelling verlenen van de in het vorige lid
      bedoelde verplichting.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel52
  - number: 52a.1
    text: |-
      Op de eerste vordering van de in de [artikelen 28][ref1] en [48][ref2] bedoelde ambtenaren is de schipper verplicht
      de volgende documenten behoorlijk ter inzage af te geven:


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel48
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '28'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '48'
        hoofdstuk: VII
  - number: 52a.1.a
    text: |-
      een geldig certificaat van onderzoek dan wel een document als bedoeld in
      [artikel 4, eerste lid, onder a, b, of c, of tweede lid, onder d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel4
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '4'
        hoofdstuk: II
  - number: 52a.1.b
    text: |-
      een geldig vaarbewijs dan wel een document als bedoeld in [artikel 17, eerste lid, onder e, f of g][ref1], of een
      bewijs van een ontheffing als bedoeld in [artikel 17, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel17
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '17'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '17'
        hoofdstuk: IV
  - number: 52a.1.c
    text: een geldige meetbrief.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel52a
  - number: 52a.2
    text: |-
      Handelen of nalaten in strijd met een verplichting, voortvloeiende uit het eerste lid, wordt gestraft met geldboete
      van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel52a
  - number: '54.1'
    text: |-
      Indien niet wordt voldaan aan de in [artikel 5, eerste lid][ref1], bedoelde regelen ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
        hoofdstuk: II
  - number: 54.1.a
    text: schepen waarvan de bouw was voltooid;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel54
  - number: 54.1.b
    text: schepen waarvoor het bouwcontract was gesloten;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel54
  - number: 54.1.c
    text: |-
      schepen waarvoor geen bouwcontract is gesloten, maar waarvan de kiel was gelegd dan wel de bouw zich in een daarmee
      vergelijkbaar stadium bevond;
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel54
  - number: '54.2'
    text: |-
      Het vorige lid is niet van toepassing met betrekking tot schepen, die na het in werking treden van
      [artikel 5][ref1] uit het buitenland worden gekocht.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
        hoofdstuk: II
  - number: '55.1'
    text: |-
      In afwijking van [artikel 19][ref1] wordt een vaarbewijs afgegeven aan een ieder, die bij het in werking treden
      van [artikel 19][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel19
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '19'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '19'
        hoofdstuk: IV
  - number: 55.1.a
    text: |-
      als schipper werkzaam is en sedert het tijdstip, gelegen drie jaren voor het in werking treden van
      [artikel 19][ref1], als schipper werkzaam is geweest aan boord van een schip, dat tot de in [artikel 16][ref2]
      bedoelde categorieën behoort en waarmede bedrijfsmatig op binnenwateren wordt gevaren, of


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel16
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '19'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '16'
        hoofdstuk: IV
  - number: 55.1.b
    text: |-
      in eigendom heeft en sedert het tijdstip, gelegen drie jaren voor het in werking treden van [artikel 19][ref1]
      in eigendom heeft gehad een schip, dat tot de in [artikel 16][ref2] bedoelde categorieën behoort en waarmede niet
      bedrijfsmatig wordt gevaren, of


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel16
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '19'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '16'
        hoofdstuk: IV
  - number: 55.1.c
    text: |-
      in het bezit is van een bewijs van vaarbekwaamheid voor de binnenvaart, dat afgegeven is voor de bedrijfsmatige
      vaart en dat door Onze Minister is erkend, of
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel55
  - number: 55.1.d
    text: |-
      in het bezit is van een bewijs van vaarbekwaamheid voor de binnenvaart, dat afgegeven is voor de niet-
      bedrijfsmatige vaart en dat door Onze Minister is erkend.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel55
  - number: '55.2'
    text: |-
      De aanvrage ter verkrijging van het vaarbewijs dient uiterlijk een jaar na het in werking treden van
      [artikel 19][ref1] te worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel19
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '19'
        hoofdstuk: IV
  - number: '55.3'
    text: |-
      In de gevallen, bedoeld in het eerste lid, aanhef, onder *a* en *c*, onderscheidenlijk *b* en *d*, wordt afgegeven
      het groot vaarbewijs, onderscheidenlijk het klein vaarbewijs.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel55
  - number: '55.4'
    text: |-
      Indien de aanvrager bij het in werking treden van [artikel 19][ref1] 65 jaar of ouder is, wordt het vaarbewijs
      niet eerder afgegeven dan nadat de verklaringen, bedoeld in [artikel 19, eerste lid, aanhef, onder ][ref2], zijn
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel19
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '19'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '19'
        hoofdstuk: IV
  - number: '55.5'
    text: Het vaarbewijs is geldig voor de vaart op alle binnenwateren.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel55
  - number: 55a.1
    text: |-
      Het groot vaarbewijs, afgegeven ingevolge deze wet, waarvan de houder de 50-jarige leeftijd nog niet heeft bereikt
      op de datum van inwerkingtreding van [artikel 23a][ref1], is geldig tot de dag waarop de houder de leeftijd van 50
      jaar en drie maanden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel23a
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: 23a
        hoofdstuk: IV
  - number: 55a.2
    text: |-
      Het groot vaarbewijs, afgegeven ingevolge deze wet, waarvan de houder de 50-jarige leeftijd bereikt of heeft
      bereikt op de datum van inwerkingtreding van [artikel 23a][ref1], is geldig tot de dag waarop de houder de leeftijd
      van 55 jaar en drie maanden heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel23a
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: 23a
        hoofdstuk: IV
  - number: 55a.3
    text: |-
      Het groot vaarbewijs, afgegeven ingevolge deze wet, waarvan de houder de 55-jarige leeftijd bereikt of heeft
      bereikt op de datum van inwerkingtreding van [artikel 23a][ref1], is geldig tot de dag waarop de houder de leeftijd
      van 60 jaar en drie maanden heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel23a
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: 23a
        hoofdstuk: IV
  - number: 55a.4
    text: |-
      Het groot vaarbewijs, afgegeven ingevolge deze wet, waarvan de houder de 60-jarige leeftijd bereikt of heeft
      bereikt op de datum van inwerkingtreding van [artikel 23a][ref1], is geldig tot de dag waarop de houder de leeftijd
      van 65 jaar en drie maanden heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel23a
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: 23a
        hoofdstuk: IV
  - number: 55a.5
    text: |-
      Het groot vaarbewijs, afgegeven ingevolge deze wet, waarvan de houder de 65-jarige leeftijd bereikt of heeft
      bereikt op de datum van inwerkingtreding van [artikel 23a][ref1], is geldig tot drie maanden na de eerstvolgende
      verjaardag van de houder.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel23a
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: 23a
        hoofdstuk: IV
  - number: '56.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid, en 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1]
      kan, ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze
      Minister-President, [artikel 56][ref2] in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel56a
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003443
        artikel: 56a
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '56.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel56
  - number: '56.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel56
  - number: '56.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel56
  - number: '56.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel56
  - number: '56.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel56
  - number: 56a
    text: |-
      De bepalingen van en krachtens deze wet ten aanzien van schepen en schippers gelden slechts voor zover zulks bij
      algemene maatregel van bestuur is bepaald.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel56a
  - number: '58.1'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel58
  - number: '58.2'
    text: |-
      De voordracht voor een algemene maatregel van bestuur, bedoeld in de [artikelen 3, tweede lid][ref1],
      [5, eerste lid][ref2], [10, eerste lid][ref3], [13, eerste lid][ref4] en [19, eerste lid][ref5], wordt Ons niet
      gedaan dan twee maanden nadat een ontwerp-tekst van die maatregel in de *Staatscourant* is bekend gemaakt en
      daarvan aan de Staten-Generaal mededeling is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003443#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003443#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0003443#Artikel19
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '5'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003443
        artikel: '10'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003443
        artikel: '13'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0003443
        artikel: '19'
        hoofdstuk: IV
  - number: '59'
    text: |-
      De bevoegdheid tot het maken van gemeentelijke verordeningen blijft ten aanzien van het onderwerp, waarin deze wet
      voorziet, gehandhaafd, voor zover die verordeningen niet met deze wet in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel59
  - number: '60'
    text: |-
      De Wet van 23 April 1880, *S.* 67, betreffende de openbare middelen van vervoer, met uitzondering der
      spoorwegdiensten, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel60
  - number: '63'
    text: Deze wet kan worden aangehaald als "Binnenschepenwet".
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel63
  - number: '64'
    text: |-
      De artikelen van deze wet treden in werking op een door Ons te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden gesteld met betrekking tot door Ons te bepalen categorieën
      schepen.
    url: https://wetten.overheid.nl/BWBR0003443/2008-04-01#Artikel64
