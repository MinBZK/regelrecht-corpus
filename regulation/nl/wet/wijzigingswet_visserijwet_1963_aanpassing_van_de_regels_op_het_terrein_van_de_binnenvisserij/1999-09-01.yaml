  - number: III
    text: |-
      In het jaar waarin [artikel I, onderdeel K][ref1], in werking treedt geldt, in afwijking in zoverre van
      [artikel 43, eerste lid, van de Visserijwet 1963][ref2], de periode vanaf 1 april tot en met 31 december als
      boekjaar voor de Organisatie ter verbetering van de binnenvisserij, bedoeld in artikel 38 van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009735#ArtikelI
