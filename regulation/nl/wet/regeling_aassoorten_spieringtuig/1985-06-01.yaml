preamble:
  text: |-
    Gelet op artikel 1, vijfde lid, van de Visserijwet 1963 (Stb. 312)1Laatstelijk gewijzigd bij Wet van 19 april 1985
    (Stb. 229).;

    Gehoord de Voorlopige Adviesraad voor de Binnenvisserij;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003788/1985-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor zover de grootste afmeting daarvan niet meer dan 2 cm bedraagt, worden als aas, bedoeld in
      [artikel 1, vijfde lid, van de Visserijwet 1963][ref1] (Stb. 312) aangewezen:

      a. een stukje vis;

      b. een stukje worm;

      c. een draad rode wol;

      d. een stukje zilverpapier.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
