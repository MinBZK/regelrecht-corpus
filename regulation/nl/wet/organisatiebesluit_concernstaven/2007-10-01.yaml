    Gelet op artikel 4:2 van het Organisatiebesluit BZK 2004;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit heeft betrekking op de Concernstaven, genoemd in het [Organisatiebesluit BZK 2004][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017563
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017563
  - number: 3:1
    text: |-
      De dienst heeft tot taak

      a. het (doen) vertalen van centrale kaders en richtlijnen in specifieke voorschriften en procedures:

      I. het stellen van kaders voor de VBTB-begroting en werkafspraken en

      II. het verbeteren van de kwaliteit van de VBTB-begroting en de werkafspraken;

      b. het regisseren van de uitvoering van de integrale departementale P&C-cyclus ten aanzien van:

      I. het financieel-economische beeld van het ministerie;

      II. het budgettaire beeld van het ministerie;

      III. het proces van voorbereiding, totstandkoming en verantwoording van de begroting en de meerjarenraming;

      c. het beoordelen van beleidsvoorstellen op samenhang tussen inhoudelijke doelstellingen en middeleninzet,
      inclusief de advisering aan de bewindslieden, secretaris-generaal en de bestuursraad;

      d. het (doen) verrichten van internal audits (bedrijfsvoeringsonderzoeken) en doelmatigheidsonderzoeken;

      e. het BZK-breed toetsen van de producten in het kader van de begroting, beleid en beheer en het adviseren van de
      politieke en ambtelijke top hierover;

      f. het (inhoudelijk) bewaken van (de voortgang van) Algemene Rekenkamer-onderzoeken binnen de lijn en het adviseren
      terzake aan de secretaris-generaal en de bewindslieden;

      g. het voeren van overleg namens het departement met het ministerie van Financiën over alle begrotings- en
      verantwoordingsaangelegenheden;

      h. het zorgdragen voor de totstandkoming, indiening en beheersing van de begrotingen van de directoraten-generaal;

      i. het zorgdragen voor een adequaat financieel-economisch beheer voor het ministerie;

      j. het borgen van de kwaliteit van de bedrijfsvoering en de daaraan verbonden (financieel administratieve)
      processen binnen het ministerie;

      k. het leveren van bijdragen aan strategieontwikkeling en doorvertaling hiervan in het financieel-economische
      beleid op concernniveau;

      l. het coördineren van het opstellen van de begroting, waaronder het in samenwerking met de leden van de
      ministerstaf opstellen van de beleidsagenda respectievelijk het beleidsverslag in het kader van de verantwoording;

      m. het zorgdragen voor advisering over en beoordeling van processen, informatiestromen, inzet van middelen,
      doelmatigheid en doeltreffendheid;

      n. het adviseren van de secretaris-generaal en de bewindslieden ten aanzien van bijzondere vraagstukken op
      concernniveau.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel31
  - number: 4:1
    text: |-
      Het Bureau Secretaris-Generaal bestaat uit de onderdelen:

      a. de sector Beleid (BEL);

      b. de sector Secretariaten (SEC);

      c. de sector Administratie, Informatievoorziening en Beheers- en beleidsondersteuning (AIB);

      d. de beveiligingsambtenaar (BVA);

      e. het bureau Strategische Kennisontwikkeling (SKO).
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel41
  - number: 4:2
    text: |-
      De sector Beleid heeft de volgende taken:

      a. het uitoefenen van de secretarisfunctie voor en het adviseren aan de bewindslieden onder verantwoordelijkheid
      van de secretaris-generaal;

      b. het procesmatig ondersteunen van de politieke en de ambtelijke leiding;

      c. het ondersteunen van de secretaris-generaal in diens taken en verantwoordelijkheden met betrekking tot de
      staatsrechtelijke kennis binnen het departement;

      d. het behartigen en coördineren van ad hoc activiteiten met hoge politiek relevantie.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel42
  - number: 4:3
    text: |-
      De sector Secretariaten heeft tot taak het voeren van het secretariaat van en het leveren van
      managementondersteuning aan de bewindspersonen, de secretaris-generaal en de plaatsvervangend secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel43
  - number: 4:4
    text: |-
      1 De sector Administratie, Informatievoorziening en Beheers- en beleidsondersteuning staat onder leiding van een
      hoofd.

      2 De sector heeft de volgende taken:

      a. het coördineren van de stukkenstroom;

      b. het beheren van de bedrijfsvoeringapplicaties;

      c. het beleidsmatig en beheersmatig ondersteunen van de plaatsvervangend secretaris-generaal;

      d. het beheersmatig ondersteunen van het bureau Strategische Kennisontwikkeling;

      e. het voeren van het secretariaat van en het leveren van managementondersteuning aan het bureau secretaris-
      generaal;

      f. het ontwikkelen van beheren van de parlementaire monitor.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel44
  - number: 4:5
    text: |-
      1 De Beveiligingsambtenaar heeft de volgende taken:

      a. het beleidsmatige afstemmen en coördineren van de verschillende aspecten van de beveiliging;

      b. het toezicht houden op de uitvoering van de beveiliging;

      c. het verantwoordelijk zijn voor de beveiliging van staatsgeheimen;

      d. het fungeren als aanspreekpunt voor alle aspecten die samenhangen met vertrouwensfuncties en
      veiligheidsonderzoeken;

      e. het adviseren en ondersteunen bij de integrale beveiliging.

      2 Bovengenoemde taken of delen daarvan worden door de plaatsvervangend Beveiligingsambtenaar uitgeoefend voor zover
      hij hiermee door de Beveiligingsambtenaar is belast.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel45
  - number: 4:6
    text: |-
      1 Het bureau Strategische Kennisontwikkeling staat onder leiding van een hoofd.

      2 Het bureau heeft de volgende taken:

      a. het ontwikkelen en implementeren van een departementale benadering voor strategische agendavorming in
      samenspraak met de departementsonderdelen;

      b. het versterken van de strategische kennisfunctie van het ministerie ter ondersteuning van het (de)centrale
      proces van strategische agendavorming door onderzoek, onderzoeksprogrammering, netwerkontwikkeling en
      kennisuitwisseling.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel46
  - number: 5:1
    text: |-
      De Auditdienst bestaat uit de volgende onderdelen:

      a. het Bedrijfsbureau (BB);

      b. de discipline Financial Audit (FA);

      c. de discipline ICT-audit (IT);

      d. de discipline Operational Audit (OA).
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel51
  - number: 5:2
    text: |-
      1 Het Bedrijfsbureau staat onder leiding van een hoofd.

      2 Het Bedrijfsbureau heeft de volgende taken:

      a. het zorgdragen voor de secretariële en administratieve ondersteuning van de dienst;

      b. het zorgdragen voor de interne bedrijfsvoering van de dienst;

      c. het beleidsmatig ondersteunen van de leiding van de dienst.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel52
  - number: 5:3
    text: |-
      1 De discipline Financial Audit is de verantwoordelijkheid van een tweetal auditmanagers.

      2 De discipline heeft de volgende taken:

      a. het verstrekken van mededelingen over de getrouwheid van financiële en andere verantwoordingen;

      b. onderzoek doen naar de kwaliteit van het (financiële) beheer, voor zover dit zijn weerslag vindt in deze
      verantwoordingen;

      c. het uitvoeren van reviews op grond van wettelijke bepalingen of andere afspraken;

      d. overige assurance services.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel53
  - number: 5:4
    text: |-
      1 De discipline ICT-audit is de verantwoordelijkheid van een auditmanager.

      2 De discipline heeft de volgende taken:

      a. het rapporteren en adviseren over de ICT-informatiestrategie, het ICT-beheer, de ICT‑infrastructuren en
      informatiesystemen, zowel in ontwikkeling als in productie;

      b. het optreden als de onafhankelijke deskundige, bedoeld in het Voorschrift Informatiebeveiliging Rijksdienst;

      c. het op verzoek van derden verstrekken van mededelingen met betrekking tot opzet en bestaan van geautomatiseerde
      systemen.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel54
  - number: 5:5
    text: |-
      1 De discipline Operational Audit is de verantwoordelijkheid van een auditmanager.

      2 De discipline heeft de volgende taken:

      a. het onderzoeken van en adviseren over de kwaliteit van de sturings- en beheersingsprocessen in samenhang met de
      primaire en ondersteunende processen (bedrijfsvoering);

      b. het ad hoc beoordelen en doorlichten;

      c. het uitvoeren van aspect-audits gericht op de naleving van centrale beheerskaders.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel55
  - number: 6:1
    text: |-
      De directie bestaat uit de onderdelen:

      a. de afdeling Wetgeving Staatsinrichting en grondrechten (WSG);

      b. de afdeling Wetgeving Veiligheid en Openbaar bestuur (WVOB);

      c. de afdeling Constitutioneel Beleid (CB);

      d. de afdeling Juridisch Adviseur (JA);

      e. het bureau Ondersteuning en Kennismanagement (OK).
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel61
  - number: 6:2
    text: |-
      1 De afdeling Wetgeving Staatsinrichting en grondrechten staat onder leiding van een hoofd.

      2 De afdeling heeft tot taak het concipiëren van de wet- en regelgeving (beperkt tot algemeen verbindende
      voorschriften), met inbegrip van internationale regelgeving, op het gebied van constitutionele zaken, informatie en
      de institutionele organisatie op Rijksniveau.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel62
  - number: 6:3
    text: |-
      1 De afdeling Wetgeving Veiligheid, Decentrale Overheid en Personeel staat onder leiding van een hoofd.

      2 De afdeling sector heeft tot taak het concipiëren van de wet- en regelgeving (beperkt tot algemeen verbindende
      voorschriften), op de terreinen van het management van de openbare sector, van het Nederlands openbaar bestuur en
      van de openbare orde en veiligheid, met inbegrip van internationale regelgeving.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel63
  - number: 6:4
    text: |-
      1 De afdeling Constitutioneel Beleid staat onder leiding van een hoofd.

      2 De afdeling heeft de taak beleid te ontwikkelen en te adviseren over de constitutionele aspecten van het beleid
      op het terrein van:

      a. de staatkundige verhoudingen binnen het koninkrijk;

      b. de staatsinrichting in brede zin;

      c. de klassieke en sociale grondrechten;

      d. de positie van het staatshoofd, de adeldom, de regering en het parlement, de ministeriële verantwoordelijkheid,
      de scheiding der staatsmachten, de herzieningsprocedure van de [Grondwet][ref1] en de betrokkenheid van de burger
      bij het democratisch bestuur;

      e. de inrichting van het openbaar bestuur met uitzondering van de inrichting van het openbaar bestuur bij de
      medeoverheden;

      f. de internationale betrekkingen, alsmede de doorwerking van internationaal en Europees recht;

      g. defensie, belastingen, begroting, noodwetgeving;

      h. openbaarheid van bestuur;

      i. Europese en internationale zaken;

      j. het algemeen bestuursrecht;

      k. het preventieve en repressieve toezicht op de naleving van statutaire voorschriften, met inbegrip van het beleid
      inzake interventies in Antilliaanse en Arubaanse rechtsorde op grond van de waarborg taak van het Statuut.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 6:5
    text: |-
      1 De afdeling Juridisch Adviseur staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het behandelen van civielrechtelijke kwesties en andere bijzondere juridische aangelegenheden, waaronder
      gecompliceerde en/of politiek gevoelige juridische vraagstukken;

      b. het adviseren van alle onderdelen van het departement voor juridische vragen waar het departement
      als organisatie en als onderdeel van de Staat mee wordt geconfronteerd, waaronder juridische geschillen,
      subsidieaangelegenheden, contracten, aanbestedingen overheidsopdrachten en staatssteun;

      c. het adviseren over de toepassing van de [Wet openbaarheid van bestuur][ref1], in het bijzonder indien afwijzing
      van de openbaarheidsverzoeken wordt overwogen;

      d. het uitvoeren van de [Tijdelijke referendumwet][ref2];

      e. het ondersteunen van de organisatie van verkiezingen;

      f. het ondersteunen van de Kiesraad;

      g. het voeren van het coördinatiepunt notificaties.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0012701
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0012701
  - number: 6:6
    text: |-
      1 Het bureau Ondersteuning en Kennismanagement staat onder leiding van de plaatsvervangend directeur.

      2 Het bureau heeft de volgende taken:

      a. het begeleiden van de stukkenstroom;

      b. het voeren van het secretariaat;

      c. het bewaken van processen en het ondersteunen van medewerkers op het terrein van automatisering en op het
      terrein van kennismanagement;

      d. het organiseren van evenementen.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel66
  - number: 7:1
    text: |-
      [Artikel 3:7 van het organisatiebesluit BZK 2004][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017563#Artikel37
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0017563
        artikel: 3:7
  - number: '8.1'
    text: |-
      [Artikel 3:8 van het organisatiebesluit BZK 2004][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017563#Artikel38
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0017563
        artikel: 3:8
  - number: '9'
    text: |-
      Tot de taak van de in dit besluit genoemde dienstonderdelen behoort voorts de uitvoering van andere taken dan
      vermeld, in opdracht van een minister, de secretaris-generaal of de plaatsvervangend secretaris-generaal, voor
      zover hogere wet- en regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel9
  - number: 10:1
    text: |-
      1 De plaatsvervangend secretaris-generaal is verantwoordelijk voor het beheer en de terinzagelegging van dit
      besluit.

      2 Het beheer geschiedt met inachtneming van de desbetreffende (richtlijnen inzake) administratieve
      organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel101
  - number: 10:2
    text: |-
      Wijziging van dit besluit is voorbehouden aan de secretaris-generaal en geschiedt op voordracht van de
      plaatsvervangend secretaris-generaal, na advisering door de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel102
  - number: 11:1
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing van dit besluit in de Staatscourant en
      werkt terug tot en met 1 september 2004.
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel111
  - number: 11:2
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit Concernstaven.'
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel112
  - number: 11:3
    text: |-
      Met verwijzing naar artikel 11:3 van het organisatiebesluit Gemeenschappelijke Diensten wordt het
      [Organisatiebesluit Centrale Stafdiensten][ref1] van 17 september 2003 ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015583
    url: https://wetten.overheid.nl/BWBR0017889/2007-10-01#Artikel113
